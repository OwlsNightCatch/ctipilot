  - title: "GhostAction October escalation: 72,000 commits to 23,000 repositories, a font-file stealer that runs on developer machines outside GitHub's workflow hold, cron persistence, and AWS OIDC role-assumption attempts"
    update_target: "2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft"
    update_type_suggested: update
    sources:
      - { url: "https://blog.gitguardian.com/ghostaction-x-polinrider/", publisher: "GitGuardian (Gaetan Ferry)", date: "2026-10-27", role: "primary" }
      - { url: "https://opensourcemalware.com/blog/ghostaction-copycats-polinrider-by-hiding-a-stealer-in-a-fake-font-file", publisher: "OpenSourceMalware", date: "2026-10-16 (updated 2026-10-26)", role: "corroborating" }
      - { url: "https://www.darkreading.com/application-security/ghostaction-hacking-wave-fizzles-attackers-github", publisher: "Dark Reading (relays GitGuardian)", date: "2026-10-28", role: "corroborating" }
    discovery_trace: "first seen at: darkreading, feed URL https://www.darkreading.com/rss.xml (item dated 2026-10-28) -> drilled article https://www.darkreading.com/application-security/ghostaction-hacking-wave-fizzles-attackers-github -> primary: GitGuardian, URL https://blog.gitguardian.com/ghostaction-x-polinrider/ (listed in https://blog.gitguardian.com/rss/, 2026-10-27) -> corroborating: OpenSourceMalware, URL https://opensourcemalware.com/blog/ghostaction-copycats-polinrider-by-hiding-a-stealer-in-a-fake-font-file (linked from the GitGuardian post)"
    summary: |
      The published GhostAction entry (last changed 2026-10-20) stops at the 8 to 12 October workflow wave and carries GitHub's workflow hold as the reason nothing was extracted. GitGuardian's
      post of 2026-10-27 reports, from its own commit feed and as lower bounds, that between 13 and 21 October the operator pushed 72,026 commits to 22,964 public repositories (7,989 new) from
      1,792 accounts, 1,382 of which had already pushed the 8 October payload, so the same stolen tokens still work. It describes five payload families: the security-audit workflow re-pointed to a
      new port; seven innocuously named workflows (the v5 payload adds four AI-provider key patterns to the credential grep, clones the repository wiki with the workflow token and falls back to a
      private gist when the POST fails); workflows for self-hosted runners that query the cloud instance metadata service and read credential files; a legacy workflow that requests a GitHub OIDC
      token and tries to assume every AWS IAM role ARN found in the environment; and a "font stealer". The font stealer is not a workflow at all: one commit adds a plain Node.js script named like
      a web-font file, another adds a hidden VS Code task set to run on folder open, so it executes when a developer opens the repository in VS Code and trusts the workspace, reads cloud, registry,
      git, kube and AI-tool credential files, SSH keys and matching environment variables, posts them to a bare IP address and installs a cron job that fetches a shell script every five minutes.
      Three payload families install that cron persistence, and cleaning the repository does not remove it. GitGuardian found no successful run of any workflow payload because GitHub blocks them,
      but says the endpoint stealer was never meant to run in CI and so GitHub's measures could not stop it. OpenSourceMalware, which first found the font-file second stage on 2026-10-16 through
      a Jamf Threat Labs researcher, counts 1,230 repositories owned by 391 accounts with the stage as of its 2026-10-26 update. Both label the launcher a copy of PolinRider's (a campaign that hides
      obfuscated loaders in developer repositories, originally attributed to a North Korea-aligned actor): between 22 and 26 October 188 GhostAction commits were amended in place with PolinRider
      loaders and force-pushed. GitGuardian's working hypothesis is that GhostAction's operator copied a public PolinRider launcher and that both groups hold overlapping victims; it sees no clear
      indicator that the two actors are related, and OpenSourceMalware likewise labels GhostAction a copycat rather than an extension of PolinRider. These are vendor counts from their own
      feeds, not independent measurements of the same population.
    delta_vs_entry: |
      Missing from the entry: the developer-endpoint payload that GitHub's hold does not cover, the five-minute cron persistence that survives repository cleanup, the self-hosted-runner and OIDC
      variants, the token reuse (1,382 of 1,792 accounts), and the PolinRider overlap. The entry's action covers only workflow-file search; the post-cleanup hunt (crontab on machines that opened an
      affected repository, VS Code folder-open tasks, private gists named like a build cache, CloudTrail AssumeRoleWithWebIdentity from GitHub's OIDC provider on unexpected repositories or branches)
      and the OIDC trust-policy lever are new.
    region_nexus: "global; any Swiss federal, cantonal or communal development team or IT supplier that hosts code on GitHub, and every developer laptop that opens a cloned repository in VS Code"
    primary_sector_nexus: "indirect"
    sector: "technology"
