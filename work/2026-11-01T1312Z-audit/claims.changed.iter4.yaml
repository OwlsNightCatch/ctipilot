claims:
  - claim_id: 07a668bd97
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "summary"
    kind: frontmatter
    text: "Canton Bern's government council confirmed on 2026-09-10 that its new Gesetz über Informations- und Cybersicherheit (ICSG) and implementing ordinance (IDSV) enter into force on 1 November 2026. From that date, every cantonal administrative unit must report cyberattacks and security incidents within 24 hours (72 hours where personal data is affected), classify ICT assets by protection need, and name each agency's top leadership as the accountable security officer. The baseline directive Grundschutz BE is expected in the first quarter of 2027, and its general terms on information security and data protection (AGB ISDS BE) must be agreed in cantonal contracts that cover processing information or personal data."
  - claim_id: 0fda2cbbca
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: cited
    text: "The canton is also standing up a dedicated platform for reporting security incidents, vulnerabilities and data-security breaches, for which KAIO's page, as changed on 2026-10-30, still gives no details ("
    urls: ["https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html"]
  - claim_id: f2a4cc9c73
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "record 2026-11-01T13:59:12Z"
    kind: record-summary
    text: "Bern's ICSG and IDSV are in force from 1 November 2026 and the old ISDS DV lapses; KAIO now expects the Grundschutz BE baseline directive in the first quarter of 2027, with its AGB ISDS BE terms to be agreed in cantonal contracts that cover processing information or personal data. Communes are bound wherever they process cantonal or federal information, use cantonal or federal ICT resources or process personal data."
  - claim_id: 460ff2e27f
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "summary"
    kind: frontmatter
    text: "StepSecurity and Socket report that on 2026-10-08 the GhostAction campaign used the GitHub credentials of two open-source maintainers to commit a workflow disguised as a security audit straight to the default branch of 345 to 346 repositories, including one of an Uber-owned organisation, and that the workflow now sends the credentials found in the working tree and in the entire git history, besides the named Actions secrets, to a hardcoded address over plain HTTP. GitGuardian's own data puts the wave of 8 to 12 October at more than 30,000 repositories reached through about 1,900 compromised GitHub accounts, and says GitHub has prevented the workflow from running since 9 October. Between 13 and 21 October the operator pushed at least 72,026 further commits, mostly from accounts whose tokens were already used on 8 October, including a stealer disguised as a font file that a hidden VS Code task runs on developer machines, outside GitHub's workflow hold, and a cron job that survives cleaning the repository."
