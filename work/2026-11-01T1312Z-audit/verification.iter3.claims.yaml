claims:
  - {claim_id: 823c1537aa, passage: 'At the time of disclosure, Ivanti is aware of limited exploitation in the wild.', source_url: 'https://www.ivanti.com/blog/october-2026-security-update', verdict: ok}
  - {claim_id: b9d96ea8c1, passage: 'CVE-2026-104935, a high-severity authentication bypass by spoofing; CVSSv3.0 score of 8.6; remote unauthenticated attacker to execute arbitrary commands', source_url: 'https://www.rapid7.com/blog/post/etr-ivanti-connect-secure-zero-day-exploited-in-the-wild-cve-2026-104935/', verdict: ok}
  - {claim_id: 7718a80e8e, passage: Ivanti is tracking both the RCE and authentication bypass components of this chain under CVE-2026-104935., source_url: 'https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/', verdict: ok}
  - {claim_id: a1e1ab8d43, passage: Check the /tmp/ directory for evidence of post-exploitation actions. conduct network and memory forensics; Integrity Checker may not be able to identify device compromise, source_url: 'https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/', verdict: ok}
  - {claim_id: 705ff200a5, passage: the tool does not detect any modifications; exploit code then removes log entries relating to the exploitation, source_url: 'https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/', verdict: ok}
  - {claim_id: f7ad3a2da5, passage: 'Check the /tmp/ directory...; If you suspect your device has been compromised, conduct network and memory forensics', source_url: 'https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/', verdict: ok}
  - {claim_id: 468f2cb903, passage: The authentication bypass and RCE vulnerabilities are tracked under CVE-2026-104935., source_url: 'https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/', verdict: ok}
  - {claim_id: f237496a39, passage: 'record summary matches section: Volexity /tmp, forensics, Integrity Checker; CVE-2026-104935 binding', source_url: null, verdict: ok}
  - {claim_id: 13361f8877, passage: 'CVE-2026-111357 - GitHub Advisory Database: Ivanti Connect Secure 22.8R2.4 mishandles the manner in which the dsinvoked broker trusts DSCache configuration data, leading to privilege escalation to roo', source_url: 'https://github.com/advisories/GHSA-fhw5-mpvj-x89m', verdict: ok}
  - {claim_id: 114c813201, passage: 'Rapid7 tables resolved builds for CVE-2026-104935 only; CCC/CISA list affected ranges without per-CVE fixed builds; Ivanti advisory unreadable. Sentence is hedged; consistent with cves[].fixed', source_url: 'https://www.rapid7.com/blog/post/etr-ivanti-connect-secure-zero-day-exploited-in-the-wild-cve-2026-104935/', verdict: ok}
  - {claim_id: fd02bc6366, passage: 'Socket: committed a workflow named security-audit.yml into 346 repositories; StepSecurity: swept 345 repositories; GG1: 30,000 repos, 1,900 users, hold since Oct 9; GG2: 72,026 commits, font file, cro', source_url: 'https://socket.dev/blog/ghostaction-cloud-credentials', verdict: ok}
  - {claim_id: e055a43568, passage: '4. On any machine that opened an affected repository in VS Code, and on any self-hosted runner, look for #ghc2 in the crontab; cron every five minutes; font stealer starts Oct. 14', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: bcaccda48f, passage: compromised two high-profile open-source maintainer accounts and swept 345 repositories; disguised as a security improvement; retained write access to the Uber organization repository, source_url: 'https://www.stepsecurity.io/blog/ghostaction-returns', verdict: ok}
  - {claim_id: 563f852e22, passage: 'remains at the core of the Mini Shai-Hulud malware family, which is still used today', source_url: 'https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/', verdict: ok}
  - {claim_id: 6abf9405b3, passage: 'Between October 8th and 12th... more than 30,000 repositories across 3,000 users and orgs', source_url: 'https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/', verdict: ok}
  - {claim_id: 2d604d8b4c, passage: '72,026 commits from the operator across 22,964 repositories ... 1,792 pushing accounts; 1,382 of the 1,792 had already pushed the Oct. 8 payload; All counts are lower bounds', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 9fa422758b, passage: 'Font stealer starts Oct. 14, 21:39; When a developer opens the folder in VS Code and trusts the workspace, the task runs the font', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 0ca55c9841, passage: 'If a workflow named Security Audit or Github Actions Security appeared in any repository you maintain since August 31, 2026, treat it as a confirmed breach', source_url: 'https://www.stepsecurity.io/blog/ghostaction-returns', verdict: ok}
  - {claim_id: d2fe7a606e, passage: 'Audit-log patterns: bypassing pull requests; unsigned rapid-fire commits across many repositories within minutes; No DNS query is made; raw IP plain-HTTP egress', source_url: 'https://www.stepsecurity.io/blog/ghostaction-returns', verdict: ok}
  - {claim_id: 181fcf1165, passage: The GitHub credential that allowed the injection in the first place must be found and revoked too, source_url: 'https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/', verdict: ok}
  - {claim_id: f6ff3b706e, passage: 'Every five minutes, the machine asks the C2 for a shell script and runs it ... stays under control after the repository is cleaned', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 61aba84c74, passage: 'What to do now: 4. look for #ghc2 in the crontab; 8. Search your repositories for .vscode/tasks.json files with a folderOpen task; derived takeaway consistent', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 4dfc962b24, passage: 'The other 7,989 are new; 1,382 of the 1,792 pushing accounts had already pushed the Oct. 8 payload; operator relies on tokens stolen earlier and never revoked', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 0c4a9250b1, passage: 'Self-hosted: query the cloud IMDS for role credentials; Legacy OIDC requests a GitHub OIDC token and tries to assume every IAM role ARN found in the environment', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: b55c7cd648, passage: 'We found no successful run for any of the GhostAction payloads ... caught by GitHub, and their execution was prevented', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 4aa07fd0ea, passage: 'From Oct. 22 to 26, PolinRider loaders were added to GhostAction commits, which were then force-pushed; no clear indicators that the PolinRider and GhostAction threat actors are related', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 9b78972f05, passage: 'Do not revert Update commits: reverting restores the previous malicious version. We saw re-infection after clean-up when tokens were kept.', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: c76bb5ac79, passage: 'The campaign now ships five payload families. It now also targets developer machines, self-hosted runners, and AWS roles', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 0f461591ab, passage: 'Node.js script; reads ~/.aws/credentials, .pypirc, .npmrc, .git-credentials, .kube/config, Claude/Gemini creds, SSH keys; GitHub''s workflow hold does not apply, since no workflow is involved', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 3ed0bb51a9, passage: 'Three GhostAction payloads install the same persistence: */5 cron; Every five minutes, the machine asks the C2 for a shell script and runs it', source_url: 'https://blog.gitguardian.com/ghostaction-x-polinrider/', verdict: ok}
  - {claim_id: 20f2e2c4aa, passage: 'Record summary matches section (72,026 commits, 22,964 repos, hidden VS Code task, IMDS/AWS roles, cron); ''mostly the same accounts'' matches 1,382/1,792', source_url: null, verdict: ok}
