  - entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    verdict: imprecision
    findings:
      - code: F3
        claim_id: "676ef65b2a"
        where: "main analysis, first sentence (named lead from cited-page pre-pass)"
        defect: "'Ivanti disclosed CVE-2026-104935 in Connect Secure on 2026-10-13 and says it is aware of limited exploitation in the wild ([Ivanti, 2026-10-13](https://www.ivanti.com/blog/october-2026-security-update))'"
        ground_truth: "Decision: the fact is correct but the cited page does not carry the id. Ivanti's blog text reads 'today we are disclosing a vulnerability in limited versions of Ivanti Connect Secure. At the time of disclosure, Ivanti is aware of limited exploitation in the wild.' and never names CVE-2026-104935 in its visible text (the id appears only in the slug of the advisory link it points to). The id binding is carried by Volexity ('Ivanti is tracking both the RCE and authentication bypass components of this chain under CVE-2026-104935. This vulnerability was fixed in patches released on October 13, 2026'), Rapid7 and the EUVD/CVE record. The pre-10-31 wording was 'Ivanti disclosed a vulnerability in limited versions of Connect Secure on 2026-10-13 and says it is aware of limited exploitation in the wild ([Ivanti])', which the 10-31 rewrite changed to name the CVE."
        ground_truth_url: "https://www.ivanti.com/blog/october-2026-security-update"
        fix: "split the clause: 'Ivanti disclosed a vulnerability in limited versions of Connect Secure on 2026-10-13 and says it is aware of limited exploitation in the wild ([Ivanti]); Rapid7 and Volexity tie it to CVE-2026-104935'"
      - code: F3
        claim_id: "f4c0a9198f"
        where: "main analysis, second paragraph: 'The first two steps are CVE-2026-104935 and the root step is CVE-2026-111357 ([GitHub Advisory Database, 2026-10-15])'"
        defect: "the GHSA page carries only CVE-2026-111357 (root escalation via dsinvoked/DSCache); the binding of the first two steps to CVE-2026-104935 is Volexity's, not the cited page's"
        ground_truth: "GHSA-fhw5-mpvj-x89m: 'Ivanti Connect Secure 22.8R2.4 mishandles the manner in which the dsinvoked broker trusts DSCache configuration data, leading to privilege escalation to root'. Volexity: 'The RCE and authentication bypass vulnerabilities are tracked under CVE-2026-104935.' (The pre-pass CVE check passed because the GHSA HTML mentions 104935 only in a reference-link slug.)"
        ground_truth_url: "https://github.com/advisories/GHSA-fhw5-mpvj-x89m"
        fix: "cite [Volexity] after 'the first two steps are CVE-2026-104935' and keep GHSA on the root-step clause"
      - code: F8
        claim_id: null
        where: "**Detection:** / **Defender takeaway:** after the 2026-10-31 body rewrite"
        defect: "(low confidence) the rewrite dropped host-level and process guidance the pre-10-31 text carried: Volexity's hidden capture directory with a renamed capture binary and post-exploitation files in /tmp, 'a clean Integrity Checker result does not show the appliance is safe' with network and memory forensics, CISA's recovery sequence and the 22.8 end-of-life date; the record summary does not state these trims"
        ground_truth: "Volexity: 'The dsstatmond process is running from a directory named .icscap for stealth'; 'Check the /tmp/ directory for evidence of post-exploitation actions'; 'If you suspect your device has been compromised, conduct network and memory forensics ... The Ivanti Integrity Checker may not be able to identify device compromise.' CISA alert: recovery steps 1-4 and 'Ivanti Connect Secure version 22.8 reaches end of life on Jan. 31, 2027.'"
        ground_truth_url: "https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"
        fix: "restore one behavioural sentence (hidden capture directory and renamed capture binary on the data partition, files in the temp directory, memory forensics advised) within the word bound, or state the trim in the record summary"
    advisories:
      - code: F11
        where: "cves[CVE-2026-111357].fixed, cves[CVE-2026-118527].affected/fixed, sourcing_note, Exposure, 2026-10-31 section"
        defect: "reader-facing text narrates the pipeline's reading ('Ivanti's advisory could not be read', 'not readable without a browser', 'not stated in any source read')"
        fix: "state the world fact ('Ivanti's advisory page is not publicly readable; builds are taken from CISA and the Canadian Cyber Centre') once, in the sourcing_note"
      - code: F11
        where: "evidence[] CERT-FR quote"
        defect: "'CERT-FR is aware of lateral movement using these secrets.' is a translation of a French original but lacks the inline '(translated from French)' marker used elsewhere in the store"
        fix: "append '(translated from French)' to the quote string"
    note: "Checked and correct: CISA KEV adds of 2026-10-30 (CVE-2026-111357, CVE-2026-118527; KEV descriptions quoted verbatim, chained-with statements, knownRansomwareCampaignUse Unknown), cves[] for all three ids (CVSS 3.1 8.6 and 7.0 per CVE records; CVE-2026-118527 has no CVE record or EUVD hit on 2026-11-01), CISA alert and Canadian Cyber Centre Update 2 affected lists, Volexity update banner (patch 2026-10-29), CERT-FR (initial version 2026-10-14), EUVD quote (via API record), fixed-build targets. Ivanti advisory page is a JavaScript app (WebFetch: loading stub), so the entry's 'could not be read' remains true. Priority critical holds (in-window patch for the previously unpatched exploited root step, KEV adds, builds of 2026-10-13 no longer sufficient)."
    length_note: "main analysis 550 words (at bound); whole body with four dated sections about 1,270 words"
