  - entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    verdict: imprecision
    findings:
      - code: F3
        claim_id: "13fe2f1bf3"
        where: "## Update — 2026-10-31T03:39:00Z, last sentence"
        defect: "'Rapid7 tested Remote Support 24.1.2 and says other affected releases and fixed builds have not been established; BeyondTrust's advisory remains the reference for affected and fixed versions ([BeyondTrust, 2026-10-15](.../bt26-05))' - the Rapid7-attributed first clause terminates in a BeyondTrust-only citation"
        ground_truth: "Rapid7: 'We tested **Remote Support 24.1.2, build 1524046** ... Other affected releases and fixed builds have not been established.' The BeyondTrust advisory page says nothing about Rapid7's test build; it lists 'All versions <= 26.2.3' and the 'BT26-05-RS patch for (v24.3.1 - v26.2.3)'."
        ground_truth_url: "https://www.rapid7.com/blog/post/ra-rapid7-analysis-unauthenticated-file-upload-to-rce-in-beyondtrust-remote-support-cve-2026-102764/"
        fix: "cite [Rapid7, 2026-10-30] after the first clause and keep the BeyondTrust citation on the second"
    advisories:
