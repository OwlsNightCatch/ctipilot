        where: "body vs record summary (2026-10-31 update)"
        defect: "the diff of the 2026-10-31 run also trimmed the main analysis (dropped GTIG's file-transfer reconnaissance of software inventories, BeyondTrust's note that its third-party triage tool closed the privilege-escalation alerts as false positives, and the GTIG-cited 'closes the hole but does not undo earlier exposure' clause in Exposure); `body` is declared in fields but the record summary describes only the Rapid7 delta"
