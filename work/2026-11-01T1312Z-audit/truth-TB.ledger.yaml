    surface: "summary"
    kind: frontmatter
    text: "Broadcom's Enterprise Security Group advisory 39404, last revised on 2026-10-30, lists Carbon Black App Control Server, Symantec Endpoint Protection Manager (SEPM), the CloudSOC SpanVA Appliance and, since 2026-10-30, Content Analysis and Malware Analysis (CASMA) as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619, and gives no versions, fixes or workarounds. Broadcom's article 459982 names App Control Server 8.12.2 and 8.13.2 as the fixes for all supported versions; the SEPM builds 14.3.27716.10000 and 14.4.494.0000 rest on a community report that NCSC-NL's tracker accepts, because Broadcom's SEPM advisory needs a login. CISA lists both PHP flaws as exploited, and Broadcom's advisory says nothing about attacks on these products."
