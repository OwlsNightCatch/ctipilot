    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "According to the paper, an on-site inspection at PK Softech on 2026-10-07 established the outflow of security-relevant federal data, and Publica's letter to its insured persons mentions neither Akira nor the ransom demand ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: 810c3ef191
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "This is one chain of reporting, and the article quotes no confirmation of the actor, the ransom demand or the scope from the Confederation, Publica or PK Softech ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
