    entry: 2026-09-30/manno-ti-commune-ransomware-safepay-claim
    surface: "summary"
    kind: frontmatter
    text: "The Ticino commune of Manno stated in a signed notice of 2026-09-16 that part of its servers were hit by an attack that encrypted data on 4 August 2026; it isolated the server and restored from existing backups. SafePay, recorded on 2026-09-28 listing manno.ch on its leak site, has since put about 30 GB of stolen data into the darknet, and Inside IT reports of 2026-10-27 that the security firm Risikomonitor found social-assistance decisions with AHV numbers and health insurers from 2014 to December 2025, debt-enforcement extracts, naturalisation files and data on the whole population of 1,381; the commune says it will make no statement."
