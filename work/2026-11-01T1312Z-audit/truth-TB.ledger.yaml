    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-20T03:39:20Z"
    kind: uncited
    text: "The scenario of matching stolen federal data against entry lists is Blick's reading and an unnamed insider's, not an authority finding."
