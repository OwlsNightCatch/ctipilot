    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "headline"
    kind: frontmatter
    text: "Machelen municipality: foothold from a website's misleading instructions, 22 days to detection; Rhysida lists its files"
  - claim_id: 57438e0f40
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "summary"
    kind: frontmatter
    text: "The Belgian municipality of Machelen published a timeline in which attackers gained access to an internal laptop through misleading instructions on an external website on 2026-08-20, reached a user with high privileges on 2026-09-10 and were found on 2026-09-11; it confirms that personal data was stolen. Ransomware.live recorded on 2026-10-27 that the Rhysida group had listed the municipal and social-welfare file servers on its leak site, a claim the municipality has not confirmed."
  - claim_id: 0173759ecd
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: cited
    text: "Machelen's own timeline records that on 2026-08-20 attackers gained access to an internal laptop through misleading instructions on an external website, explored it extensively from 24 August to 1 September, and on 10 September had access to a user with high access rights and other IT systems; the municipality found the incident on 11 September, isolated all systems, reported to the Belgian CCB-CERT, restarted part of its systems from a backup of a safe date on 14 September and recorded the first evidence of leaked data on 17 September ("
    urls: ["https://www.machelen.be/tijdslijn-cyberincident"]
  - claim_id: e15c3f96a1
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: cited
    text: "It confirms that personal data was leaked and says the scope is still being investigated ("
    urls: ["https://www.machelen.be/faq-cyberincident-persoonsgegevens"]
  - claim_id: 64774c030f
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: cited
    text: "); the mayor had said on 14 September that no personal data appeared to be affected, and ITdaily reports that this proved wrong ("
    urls: ["https://itdaily.com/news/security/machelen-municipality-hit-by-cyberattack-via-phishing/"]
  - claim_id: 181a67039f
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: cited
    text: "Ransomware.live recorded on 2026-10-27 that Rhysida listed Machelen on its leak site, describing the listing as municipal and social-welfare file servers of about 1.3 million files, with client files that include passports and identity cards, nursing-home medical files and civil-status records, which are the group's own claims ("
    urls: ["https://www.ransomware.live/id/TWFjaGVsZW4gKEJlbGdpdW0pQHJoeXNpZGE="]
  - claim_id: 781fc109ba
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: derived
    text: "**Detection:** the timeline puts 22 days between first access and detection, with the first laptop explored from 24 August to 1 September; it names neither the website nor the commands, so the telemetry to review includes endpoint process creation after a user followed instructions on a web page and later use of a high-privilege account from that workstation, which is an inference from the timeline."
  - claim_id: d599c759ca
    entry: 2026-10-29/machelen-municipality-misleading-instructions-rhysida
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a user who followed instructions from a website on a work laptop as a possible intrusion that can sit unseen for weeks; review high-privilege account activity from the user's workstation for the weeks after the event, not only the day it is reported."
