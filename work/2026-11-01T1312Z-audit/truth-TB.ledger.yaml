  - claim_id: ec07f178c6
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "The Bernische Pensionskasse (BPK) states in a notice dated 2026-10-09 that an external software supplier of the BPK suffered a cyberattack at the end of September 2026 and that this is \"the same company that also supplies the federal pension fund Publica\" (translated from German); the supplier filed a criminal complaint, informed the relevant federal bodies and its affected customers, various federal bodies are clarifying with it which data is affected, and the Federal Prosecutor's Office has opened an investigation ("
    urls: ["https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf"]
  - claim_id: 261c171cc0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "The BPK says there are currently no indications that its data was stolen but that this cannot be entirely excluded, and that insured persons are being informed ("
    urls: ["https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf"]
  - claim_id: 401e6d40aa
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "Netzwoche reports that the Canton of Bern's own notice names the BPK and the Bernische Lehrerversicherungskasse (BLVK) as concretely affected, that the BPK insures canton staff and the personnel of the three cantonal universities (42,145 active insured and 18,321 pensioners on 31 December 2025) and that the BLVK insures 21,417 active Bernese teachers ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: eb27d6eddd
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "The BLVK's own notice does not name its supplier; it says the supplier took the affected environment off the network, brought in external specialists, informed the authorities and filed a criminal complaint, and that the supplier and the BLVK are still checking whether and to what extent BLVK data is affected ("
    urls: ["https://blvk.ch/wp-content/uploads/2026/10/20261008_Cyberangriff-auf-Softwarelieferant-von-der-BLV.pdf"]
  - claim_id: 891a2d790b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "Pensionskasse Post, the occupational pension fund of Swiss Post, names PK Softech and says whether and to what extent its insured persons' data is affected is under review; it states that its data at PK Softech is anonymised and holds no particularly sensitive personal data such as IV disability-insurance files, a claim that is the fund's own and not independently verified ("
    urls: ["https://www.pkpost.ch/news/260-cyberangriff-auf-softwarelieferant-der-pensionskasse-post"]
  - claim_id: 9498b720f9
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "Inside IT, working from the AWP agency, lists the BLVK, the BPK, Migros-Pensionskasse, Pensionskasse Post and Syngenta Pensionskasse as customers of the manufacturer \"among others\" and says some of the funds have already announced that they are checking with PK Softech for a possible data outflow ("
    urls: ["https://www.inside-it.ch/weitere-pensionskassen-pruefen-datenabfluesse-20261009"]
  - claim_id: 77347f6db1
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-10T03:48:33Z"
    kind: cited
    text: "PK Softech says it has been fully available to its customers again since 2 October 2026 ("
