    text: "Inside IT: SafePay published about 49 GB from a Bernese wastewater association; the association declines to comment"
  - claim_id: 6692dbe527
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "summary"
    kind: frontmatter
    text: "SafePay claimed an attack on the Bernese wastewater-treatment association ARA-Region Lyss-Limpachtal on 2026-09-15, and Inside IT reports of 2026-10-27 that the group has now put about 49 GB of stolen data into the darknet. Risikomonitor's analysis, which Inside IT relays and which is not verified independently, finds data on more than 1,200 identifiable persons, bank statements, 255 password hits in files and a third party's monitoring-portal credentials stored on the association's server; the association will not comment, and no source says how the attackers got in."
  - claim_id: 2622fea452
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "The tracker DeXpose recorded on 2026-09-15 that SafePay had claimed an attack on ARA Lyss, the wastewater-treatment association at ara-lyss.ch, posting that the full leak would be published soon unless a company representative made contact ("
    urls: ["https://www.dexpose.io/safepay-ransomware-attack-on-ara-lyss-in-switzerland/"]
  - claim_id: b98b3413ad
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "Inside IT reported on 2026-10-27 that SafePay has put the stolen data into the darknet, about 49 GB in the case of the Bernese association ARA-Region Lyss-Limpachtal, that the security firm Risikomonitor analysed it, and that the association's management declined to comment ("
    urls: ["https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027"]
  - claim_id: 9ed24764f0
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "Risikomonitor's analysis, relayed by Inside IT and not verified independently, finds about 3,200 e-mail addresses and data on more than 1,200 identifiable persons; user folders and a data store with content up to March 2026 that hold 255 password hits, 195 of them very weak; bank statements and a transaction list with more than 100 payments by private persons with name and address; the full login data to the monitoring portals of the photovoltaic plants of another company's customers, stored on the same server; and a 2015 applicant list with birth dates, civil status, former employer and interview notes that was never deleted ("
    urls: ["https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027"]
  - claim_id: ab7180c4de
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "BACS told Inside IT that SafePay, which relies on double extortion, is among the more active ransomware groups in Switzerland and, together with The Gentlemen, the third most active in 2026 after Akira and Payload, that it has no clear focus on Switzerland, and that it was first observed there in May 2025 ("
    urls: ["https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027"]
  - claim_id: dedc4cdbd0
    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** a communal body or association should look for credentials, bank statements and applicant files on its own file servers before an attacker does: Risikomonitor found 255 password hits in files, another company's portal logins and a 2015 applicant list that had never been deleted, and those are what a published dump gives fraudsters ("
    urls: ["https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027"]
