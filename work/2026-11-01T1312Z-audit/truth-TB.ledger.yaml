    surface: "body"
    kind: cited
    text: "Publica confirmed the sequence to the paper: after the Xplain case it asked PK Softech to delete all legacy data, including that of the 2019 migration, and received written confirmation, and it is now clarifying why personal data presumably lay on the servers, while PK Softech did not answer and says it does not comment on individual customer relationships ("
