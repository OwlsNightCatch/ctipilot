    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reported on 2026-10-21 that PK Softech AG had confirmed in writing to Publica that it deleted the data, and that this apparently did not happen: its summary says the company reported in January that it had deleted the information on former Federal Councillors and agents, \"but this was false\" (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-hacker-erpressen-loesegeld-mit-publica-daten-654128340841"]
  - claim_id: 72c2dd6dd4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Inside IT, working from the Tamedia research, dates the written confirmation to January 2026 and says PK Softech confirmed it held no personal data in plaintext and had deleted the data of the 2019 migration, that Publica confirmed the sequence (after the Xplain case it asked the supplier to delete all legacy data, including that of the 2019 migration, and received written confirmation), that Publica is clarifying why personal data presumably lay on the servers regardless, and that PK Softech did not answer and does not comment on individual customer relationships ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022"]
  - claim_id: 1876375e72
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "). 20 Minuten reports the same sequence and notes that PK Softech received the data in 2019 in a migration for Publica ("
    urls: ["https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740"]
  - claim_id: d9bfe55eed
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Inside IT also relays, from Tamedia, that the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group, which still threatens to publish or sell it; 20 Minuten writes that according to findings so far Akira stole the data ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022", "https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740"]
  - claim_id: a5900b9a57
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "This is a reported confirmation of the actor by an authority, but it reaches the reader second-hand through the paywalled Tamedia article: the Federal Prosecutor's Office is not quoted directly, and Publica's own page, in its entry of 2026-10-20, still says it is clarifying whether data of Publica left and whose ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: af1d5a21f2
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT says through Corriere del Ticino, relayed by Ticinonline on 2026-10-20, that potentially all of its insured could be involved but that there is no evidence yet that their data was actually taken; it has filed a complaint with the Federal Prosecutor's Office and is preparing a letter to the insured warning of telephone and e-mail fraud ("
    urls: ["https://www.tio.ch/ticino/cronaca/1958050/informazioni-ticino-dati-ipct-attacco"]
  - claim_id: 2dd8bdd0d7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "TicinoNews adds, from its own information, that a folder labelled IPCT with the data of a few hundred insured persons was on the supplier's server, while IPCT, which has about 27,000 affiliated persons, says it has no certainty yet that data of its insured is involved ("
    urls: ["https://www.ticinonews.ch/ticino/hackeraggio-casse-pensioni-centinaia-di-ticinesi-a-rischio-445085"]
  - claim_id: 01a35751a0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT has put numbers on its exposure in a letter of 2026-10-23 to its roughly 17,000 active insured and 10,000 pensioners ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 241fcc32f5
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "PK Softech told it in the late afternoon of 2026-10-14 that the authorities had established that personal data were taken from the supplier's servers, without saying which funds the data belonged to, and the fund's checks to date found among the documents on the attacked server data of about 1,800 persons, held there for two ongoing projects of spot checks and recalculations ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 2870e21ed7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 1,700 are persons who left the fund through resignation or death in 2024 and 2025: surname, first name, postal address, date of birth, AHV number and insured number, the exit-benefit amount and the receiving fund with its bank account (IBAN), and the personal IBAN for about 50 who were paid out directly, with no e-mail address or telephone number ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 3b21f5aada
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 80 are insured persons on a disability pension whose passive pension data was being updated: name, date of birth, AHV number, insured number, passive insured salary, passive retirement assets, degree and start of invalidity, with no contact data ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: b529fa4a99
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The fund says it has no certain evidence that these data were taken but that it appears plausible, that savings capital and pensions of all insured are untouched, that the cantonal administration's IT centre hosting the fund's infrastructure was not breached, and that it filed a criminal complaint against unknown persons and was recognised as private plaintiff, while the Federal Prosecutor's Office and the federal police investigate ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1", "https://www.tio.ch/ticino/attualita/1958742/dati-stati-cantone-istituto-ticino-attacco-pensioni-casse-previdenza"]
  - claim_id: 0ceced170a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "It decided to send the letter to all insured because its information is partial, the analyses are still evolving and it may never have certainty, and it asks them to watch for unexpected e-mails, calls and messages over the coming weeks and never to disclose passwords, access data or personal data unless sure of the requester ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: f1f30cee3f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The letter names PK Softech's other customers as Publica, large cantonal public funds such as Bern and Zurich and company funds such as Migros and Post, for hundreds of thousands of insured persons in total ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 64e2090483
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "The Federal Data Protection and Information Commissioner (EDÖB) says PK Softech notified it of the cyberattack on its IT infrastructure on 2026-10-08, that the affected pension funds also reported to it, that it started an informal preliminary inquiry at Publica on 2026-10-14 and that on 2026-10-22 it opened a formal investigation against PK Softech AG on suspicion of data-protection violations ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 5dc63e3966
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Its release states that data of several important occupational pension institutions, Publica among them, was exfiltrated in the attack; the investigation is to give an overall picture of the personal data the funds handed to the software supplier and to clarify the legal framework of those transfers, how they were actually implemented and the scope of the data that left, and the EDÖB gives no further information on pending proceedings ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 310041a1ad
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Der Bund relays the step and adds that besides Publica the pension funds of Migros, Post and the City of Zurich obtain software from PK Softech ("
    urls: ["https://www.derbund.ch/cyberangriff-auf-pk-softech-bund-eroeffnet-untersuchung-985784970943"]
  - claim_id: 7c70e95f73
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: uncited
    text: "The release names neither the actor nor the number of insured persons."
  - claim_id: 05641b021a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: cited
    text: "Publica's own newsletter of 2026-10-22 says that the hacker group Akira is being associated with the attack, referring readers to the Federal Office for Cybersecurity's description of the group's methods, and that Publica filed a criminal complaint with the Federal Prosecutor's Office on 2026-10-15 ("
    urls: ["https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"]
  - claim_id: add486ec9d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: cited
    text: "The same newsletter says Publica must assume that data left the supplier and that whether and to what extent Publica's personal data is among it is still being investigated ("
    urls: ["https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"]
  - claim_id: f9d27d143b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: uncited
    text: "The ransom demand and the Federal Prosecutor's Office confirmation of the exfiltration by Akira remain press reports."
  - claim_id: f38696e5c5
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-10T03:48:33Z"
    kind: record-summary
    text: "The supplier's customers are now named: the Bernische Pensionskasse (canton of Bern staff and three cantonal universities) says its supplier is the same company that serves Publica, the Bernische Lehrerversicherungskasse and Pensionskasse Post report the supplier incident, and Inside IT lists Migros-Pensionskasse and Syngenta Pensionskasse among the customers. None of the funds has confirmed which member data left."
  - claim_id: a5d5fdfb04
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-13T03:38:20Z"
    kind: record-summary
    text: "Publica's own page of 2026-10-08 lists civil status and the IBAN among the data that could be affected and says its investigation indicates personal data of insured persons has presumably left. The AWP agency relays the software firm's position that it knows data left but not yet whether personal data is among it, that it may be business data, and that the volume is rather small."
  - claim_id: 81f7397d2d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-15T03:48:00Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, says on 2026-10-13 that it currently uses another provider, plans to move to PK Softech's system in early 2027 and is checking whether data from migration tests was affected. Publica's page says as of 2026-10-14 that it has no indications that data from the attack was published on the darkweb."
  - claim_id: 1b1c82eff0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-16T04:11:00Z"
    kind: record-summary
    text: "Cantonal police warn that criminals could use the leaked salary and pension data to phone insured persons with investment-fraud offers, SwissCybersecurity.net ties the warning to PK Softech, and the Zurich cantonal fund BVK says its PK Softech software runs in its own data centre so it is not directly affected; PK Softech can neither confirm nor rule out further affected customers, and the Ticino fund listed as a customer has made no statement."
  - claim_id: f9b5c80f72
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-17T03:35:30Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, now says in its notice of 2026-10-15 that its inquiries indicate personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch, was stolen, and that which fields were taken is still being clarified. Pensionskasse Post says in its notice of the same date that personal data did leave and no longer repeats its earlier anonymisation statement, though it is still unclear whether its insured persons' data is among it."
  - claim_id: 10acaaa5a7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-18T14:00:04Z"
    kind: record-summary
    text: "The 2026-10-10 update said each of the five pension funds Inside IT lists is checking with PK Softech for a possible data outflow; Inside IT says only some of them have so far announced such a check."
  - claim_id: 5d8e29958c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-20T03:39:20Z"
    kind: record-summary
    text: "SonntagsBlick reports, from a confidential federal information note, that the Confederation rates the incident as serious and says the security organs of the Confederation are particularly affected, which it glosses as the Federal Intelligence Service, the Defence Group and fedpol, that the Federal Council was briefed on 2026-10-14 and that the cantons were informed; the Finance Department confirms only the briefing. NZZ adds that the pension consultancy Libera AG is also affected, that the Bernische Pensionskasse now says it must be assumed personal data left, and that Publica ran no regular on-site audits at the supplier."
  - claim_id: cd4a00676f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-21T03:47:07Z"
    kind: record-summary
    text: "Tamedia reports, and Inside IT relays, that the Akira ransomware group holds about 100 GB of the pension data of well over 100,000 current and former federal employees, with employer details of staff under cover identity among it, and demands ransom; neither the Confederation nor Publica confirms the actor or the demand."
  - claim_id: 8e54eb9379
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-22T03:47:53Z"
    kind: record-summary
    text: "Netzwoche, relaying Tages-Anzeiger, reports that the Federal Council and the security authorities now assume data on practically all current and former federal and federally affiliated staff left, federal judges and former Federal Council members among them, and that an on-site inspection at PK Softech on 2026-10-07 established the outflow of security-relevant data; neither the Confederation nor Publica has confirmed the actor, the demand or the scope."
  - claim_id: 5266f48158
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-23T03:40:13Z"
    kind: record-summary
    text: "The supplier's written pledge to delete Publica's 2019 migration data was apparently not kept, Inside IT relays that the Federal Prosecutor's Office confirmed Akira exfiltrated data, though that is second-hand and neither the Confederation nor Publica has itself named the actor, and the Ticino cantonal fund IPCT says all its insured could potentially be involved but has no evidence yet that data was taken."
  - claim_id: 722605f3ff
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-24T03:41:16Z"
    kind: record-summary
    text: "The Ticino cantonal fund IPCT says in a letter of 2026-10-23 that data of about 1,800 of its insured persons (about 1,700 who left in 2024 and 2025, with exit-benefit amounts and IBANs, and about 80 on disability pensions) sat on the attacked supplier server for two ongoing projects; it has no certain evidence the data were taken but finds it plausible, and it writes to all insured because it cannot exclude more."
  - claim_id: 3b6a4524a0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-25T03:37:54Z"
    kind: record-summary
    text: "The Federal Data Protection and Information Commissioner (EDÖB) opened a formal investigation against PK Softech on 2026-10-22, after an informal inquiry at Publica on 2026-10-14, and states that data of several pension funds, Publica among them, was exfiltrated; the investigation is to establish which personal data the funds handed to the supplier, on what legal basis, and how much left."
  - claim_id: 5cc3e07119
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-30T03:55:40Z"
    kind: record-summary
    text: "The entry said that neither the Confederation nor Publica had named the actor. Publica's own newsletter of 2026-10-22 says the Akira group is being associated with the attack, and that Publica filed a criminal complaint with the Federal Prosecutor's Office on 2026-10-15; the summary, the sourcing note and the paragraph on the Akira reporting now say so, a population figure was trimmed from the analysis, and the demand and the Prosecutor's Office confirmation still rest on press reports."
  - claim_id: 74559cfa15
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "headline"
    kind: frontmatter
    text: "HPE ClearPass 6.14, 6.12 and 6.11 are affected by PHP2Shell; a hotfix patch exists for each train"
  - claim_id: 791785faa0
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "summary"
    kind: frontmatter
    text: "HPE Networking's bulletin HPESBNW05171, released on 2026-10-22 and revised on 2026-10-23 and 2026-10-29, lists ClearPass Policy Manager 6.14.0 and earlier and 6.11.15 and earlier as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619, each scored CVSS 3.1 9.8, adds the 6.12 train in its machine-readable record, and names a hotfix patch for 6.14.1, 6.12.8 and 6.11.16. HPE asks customers to consider removing guest portals and all management interfaces from public access until the affected instances are upgraded; the bulletin says nothing about exploitation of ClearPass, although CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
  - claim_id: bd8f489512
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the HPE ClearPass 6.14.1, 6.12.8 or 6.11.16 hotfix patch for CVE-2026-109618 and CVE-2026-109619 on every ClearPass Policy Manager node from the HPE Networking Support Portal, and until it is installed take the guest portal and the CLI and web management interfaces off public networks, confining management to a dedicated layer 2 segment or behind firewall policy."
  - claim_id: 518de0acbd
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "cves[CVE-2026-109618]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-109618\", \"cvss\": \"9.8\", \"status\": [\"cisa-kev\", \"patch-available\"], \"affected\": \"ClearPass Policy Manager 6.14.0 and earlier in the 6.14 train and 6.11.15 and earlier in the 6.11 train per the advisory note, and per its machine-readable record the 6.14, 6.11 and, since revision 3, 6.12 trains below the hotfix boundaries 6.14.1, 6.11.16 and 6.12.8; versions past end of maintenance are presumed affected and versions past end of support were not assessed\", \"fixed\": \"ClearPass 6.14.1 Hotfix Patch, ClearPass 6.12.8 Hotfix Patch and ClearPass 6.11.16 Hotfix Patch, from the HPE Networking Support Portal\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 2dc5d226a7
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "cves[CVE-2026-109619]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-109619\", \"cvss\": \"9.8\", \"status\": [\"cisa-kev\", \"patch-available\"], \"affected\": \"ClearPass Policy Manager 6.14.0 and earlier in the 6.14 train and 6.11.15 and earlier in the 6.11 train per the advisory note, and per its machine-readable record the 6.14, 6.11 and, since revision 3, 6.12 trains below the hotfix boundaries 6.14.1, 6.11.16 and 6.12.8; versions past end of maintenance are presumed affected and versions past end of support were not assessed\", \"fixed\": \"ClearPass 6.14.1 Hotfix Patch, ClearPass 6.12.8 Hotfix Patch and ClearPass 6.11.16 Hotfix Patch, from the HPE Networking Support Portal\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4bcbe4bfaf
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "body"
    kind: cited
    text: "HPE Networking's bulletin HPESBNW05171, released on 2026-10-22 and revised on 2026-10-23 and 2026-10-29, covers CVE-2026-109618 and CVE-2026-109619, the PHP flaws behind PHP2Shell, in ClearPass Policy Manager and scores each CVSS 3.1 9.8 with network access, no privileges and no user interaction ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05171.json"]
  - claim_id: 1ca4abf371
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "body"
    kind: cited
    text: "Its affected-products note lists ClearPass 6.14.0 and earlier in the 6.14 release train and 6.11.15 and earlier in the 6.11 train, while its machine-readable record also lists the 6.12 train and gives 6.14.1, 6.11.16 and 6.12.8 as the boundaries; the bulletin does not reconcile the two ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05171.json"]
  - claim_id: e27db08c0f
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "body"
    kind: cited
    text: "The fix is a hotfix patch for each train, 6.14.1, 6.12.8 (added in revision 3, which HPE says \"exceptionally\" includes 6.12.8) and 6.11.16, downloadable from the HPE Networking Support Portal; versions past end of maintenance are presumed affected and are not covered, and HPE has not assessed versions past end of support, which it says should be considered potentially impacted ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05171.json"]
  - claim_id: 4a239604c9
    entry: 2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
    surface: "body"
    kind: cited
    text: "HPE recommends confining the CLI and web management interfaces to a dedicated layer 2 segment or VLAN, or controlling them with firewall policy at layer 3 and above, and asks customers to consider removing guest portals and all management interfaces from public access until the affected ClearPass instances have been upgraded ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05171.json"]
  - claim_id: b8b014853a
