    kind: cited
    text: "Tamedia's Tages-Anzeiger reports that the Akira ransomware group holds about 100 GB of compressed pension data on well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom, which Inside IT relays without the volume; as of 2026-10-20 neither the Confederation nor Publica had confirmed the perpetrator or the demand, and Publica said it still had no indication that data was published on the darkweb ("
