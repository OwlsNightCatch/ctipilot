  - entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    verdict: imprecision
    findings:
      - code: F3
        claim_id: 8176d755fa
        where: "## Update 2026-10-25T03:38:42Z, 2nd clause; record 2026-10-25T03:38:42Z summary (claim 69bb5cc554); evidence[] quote attributed to Siemens ProductCERT SSA-566512 (named lead from page-checks)"
        defect: "Siemens lists RUGGEDCOM APE1808 ... and gives patch and update information only through customer support; evidence quote: 'Contact customer support to receive patch and update information'"
        ground_truth: "Decision on the named lead: the quote is NOT a contiguous passage of the page as it stands today, but it was literal when the entry was written. The Internet Archive copy of SSA-566512 V1.0 (2026-10-23, snapshot 2026-10-24) reads 'Contact customer support to receive patch and update information'. The page was revised to V1.1 (2026-10-28, history line 'Automatically generated entry') and now reads: 'Upgrade to corresponding available PAN-OS version. Contact customer support to receive additional patch and update information.' So the quote is a page-edited-since case, but the entry's statement 'only through customer support' is now stale (Siemens now points to the corresponding available PAN-OS version, and all 20 PAN-OS hotfixes are released)."
        ground_truth_url: "https://cert-portal.siemens.com/productcert/html/ssa-566512.html"
        fix: "Add an update record: Siemens SSA-566512 V1.1 (2026-10-28) says to upgrade to the corresponding available PAN-OS version and to contact support for additional patch information; replace the evidence quote with the current sentence (or add the new sentence as a second quote)."
      - code: F3
        claim_id: 5a4116d8ab
        where: "## Update 2026-10-26T03:39:39Z, last sentence"
        defect: "The Hacker News article of 2026-10-25 relays the retracted account and carries no correction"
        ground_truth: "The page as fetched today opens with a correction note: 'In an update, Palo Alto Networks Unit 42 said it's retracting its earlier assessment that the post-compromise activity targeting the European government agency involved the exploitation of the PHP2Shell flaws.' ... 'The original story follows.' (publisher revision after the entry's 2026-10-26 record; the source label 'relaying the retracted account' is also stale)"
        ground_truth_url: "https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html"
        fix: "Say the article now leads with Unit 42's retraction, or drop the sentence and the 'relaying the retracted account' label."
      - code: F9
        claim_id: 042abb8efd
        where: "## Update 2026-10-27T03:48:15Z (and sourcing_note, record 2026-10-27 summary): 'documents the first successful code execution' / 'the first documented successful code execution is Karimi's honeypot report'"
        defect: "(low confidence) 'first' is stated as fact while another source the entry cites for the 2026-11-01 update lists earlier honeypot-confirmed shells."
        ground_truth: "Hunt.io (revised 2026-10-30): 'Shells have been confirmed only on honeypots and sensors by watchTowr, 0x4D31, and GreyNoise' and 'watchTowr reported exploitation of both CVEs on its Attacker Eye honeypots on 2026-10-21, the earliest of the three'. SecurityWeek (2026-10-26) supports the entry: 'security firms had not confirmed any successful code execution' before Karimi's report. watchTowr's own page says only 'observed exploitation of CVE-2026-109618 and CVE-2026-109619 in the wild', with no shell detail."
        ground_truth_url: "https://hunt.io/blog/php2shell-honeypot-shells-root-palo-alto-firewalls"
        fix: "Attribute 'first' to SecurityWeek ('security firms had not confirmed...') or soften to 'the first publicly documented shell-level evidence' and note that watchTowr reports earlier honeypot exploitation without detail."
    notes:
