  - entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    verdict: imprecision
    findings:
      - code: F3
        claim_id: 7f7fd5a5b3
        where: "summary, first sentence"
        defect: "(low confidence) Palo Alto Networks' advisory of 2026-10-21 says active exploitation has been observed against PAN-OS management interfaces exposed to the internet"
        ground_truth: "The exploitation sentence ('Active exploitation has been observed targeting the Palo Alto Networks management interface exposed to the internet.') is on the page as revised from 2026-10-27/28. The 2026-10-21 text said Palo Alto was not aware of malicious exploitation (the entry's own 2026-10-23 section), the Internet Archive copy of 2026-10-27 17:10 UTC reads 'Very limited exploitation has been observed targeting the Palo Alto Networks management interface.', and the vendor timeline (JSON) has no 2026-10-21 entry about exploitation. Read literally, 'advisory of 2026-10-21' dates the statement to the original publication."
        ground_truth_url: "https://security.paloaltonetworks.com/json/CVE-2026-109618"
        fix: "Write 'Palo Alto Networks' advisory now says' (the body already dates it to the 2026-10-28 reading)."
    notes:
      - "All 20 hotfix versions, the 20 Threat IDs, CVSS-B 9.2/7.7, WF-500 unaffected after the 2026-10-23 correction, GlobalProtect/captive portal not affected, 11.2.10-h16/h17 note, every PAN timeline date, Dream numbers (24 firewalls, 25 servers, 22 parked, 19,000/5,000/240 funnel, US/JP/TW/KR, PHP 8.0.30) and Unit 42's 2026-10-29 verification match the pages fetched today (PAN HTML + JSON revised 2026-10-29 23:54 UTC, Dream and Unit 42 updated 2026-10-29)."
      - "All ten techniques[] ids are active in the pinned attack/enterprise-attack.json (v20.0) and each names a behaviour Dream describes."
    length_note: "main analysis ~551 words (bound 550); headline 119 chars (bound 120); title 296 chars"
