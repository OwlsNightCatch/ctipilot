  - entry: 2026-10-27/php2shell-ot-products-netmodule-nrsw-no-fix-macmon-schneider
    verdict: factual-error
    findings:
      - code: F4
        claim_id: 1df960364e
        where: "title, headline (62d8a4b314), summary (999ebf3ade), actions[0] (1b4fad82a5), cves[].status 'no-patch' and cves[].fixed 'NRSW: no patched release' (cea6b8f313, 8545824384), body paragraph 1 (1df960364e), Defender takeaway (014a68e859); the whole entry is built on this"
        defect: "Belden says all versions of NetModule NRSW ... are affected and that no patched release exists; until one ships it advises disabling the web interface ... because no patched NRSW release exists"
        ground_truth: "Belden PSIRT-10 is now Version 1.1 (Belden's security index lists 'PSIRT-10 | Critical PHP Vulnerabilities in macmon and NRSW | 1.1 | 2026-10-22'). Its NRSW paragraph reads: 'All NRSW versions are affected by the latest PHP vulnerabilities (CVE-2026-109618 / 109619), including the latest mainline release 5.0.0.104. We recommend upgrading to version 5.0.0.105. The mitigation steps we recommend if unable to upgrade to the newer version are to disable the web-interface after making sure there is a ssh connection to the device ...'. The earlier run's saved extraction of the PDF was 3,885 characters, today's is 3,923, consistent with a post-publication revision; SecurityWeek (2026-10-26) still relays the V1.0 wording ('a patched version has yet to be released')."
        ground_truth_url: "https://assets.belden.com/asset/0e20ea6c-c1f5-4269-b765-e160a2bf4965/PSIRT-10-Critical-PHP-Vulnerabilities-in-macmon-and-NRSW.pdf"
        fix: "Record an update (a correction if V1.1 already stood at publication): NRSW 5.0.0.105 is the vendor-recommended fixed version, the web-interface disable (http.status=0 / https.status=0) is the fallback only where the upgrade cannot be installed; drop the 'no-patch' status, change title, headline, summary, fixed field, action and takeaway accordingly (the Bern/Swiss nexus remains)."
      - code: F8
        claim_id: 699c9fe955
        where: "body paragraph 2 and cves[].affected: Schneider Electric list (cited bulletin 'version 2.0.0, 2026-10-26')"
        defect: "Schneider lists EcoStruxure Security Expert, ProLeiT LINEoptimize and EcoStruxure Control Engineering"
        ground_truth: "SESB-2026-295-01 is now v3.2.0 (2026-10-30). v3.0.0 (2026-10-28) 'Added EcoStruxure Foxboro DCS H90 Server to affected products with mitigations' (HPE ProLiant DL380 Gen9, Windows Server 2016: 'Check Firewalls that the TCP 2301/2381 ports (used by HPE System Management Homepage (SMH)) are blocked') and renamed the product 'EcoStruxure Security Expert Web Client' (all versions prior to 1.48.4.0). Control Engineering text (debian.org/sury.org auto-update, otherwise Schneider patch) is unchanged and correct."
        ground_truth_url: "https://download.se.com/files?p_Doc_Ref=SESB-2026-295-01&p_enDocType=Security+and+Safety+Notice&p_File_Name=SESB-2026-295-01.pdf"
        fix: "Add the fourth affected product (Foxboro DCS H90 Server, mitigation: block TCP 2301/2381) to affected_products, cves[].affected and the Schneider sentence; update the bulletin version label."
      - code: F8
        claim_id: f24efab8e9
        where: "body paragraph 2 (Wibu-Systems) and Defender takeaway 'CodeMeter License Central 5.2.2'"
        defect: "Wibu-Systems lists ... with 5.2.2 released and a patch installer for 5.1.2 and 5.0.x"
        ground_truth: "Wibu product alert (last updated 2026-10-29 5:00 pm CET): 'CodeMeter License Central 5.2.3 Released ... automatically applies the post-update configuration recommendations'; 5.2 table row: 'Update to version 5.2.3 ... if remaining on 5.2.2, manual adjustment of php.ini according to the manual is strongly recommended'; the new installer upgrades 5.0.x/5.1.x installations to 5.2.3; 4.x is patched through Ubuntu Pro OS updates; mTLS reverse proxy is the stated risk reducer. 5.2.2 is still a fixed build, so the entry is incomplete rather than wrong."
        ground_truth_url: "https://www.wibu.com/support/product-alerts.html#c61269"
        fix: "Name 5.2.3 as the recommended 5.2.x build (5.2.2 acceptable with the php.ini hardening), 4.x via Ubuntu Pro, and the installer's 5.2.3 upgrade path."
    notes:
      - "Verified against the pages fetched today: Belden macmon 6.x/7.x text and the HQ sentence (Belden 2022-03-14 release: 'headquartered in Bern, Switzerland'), HMS HMSSAR-2026-10-22-002 v2 (3.00.11, LAN/USB exposure), B&R SA26P015 v1.0 (APROL <= R 4.4-65, patches 'expected' 2026-10-26 and 2026-10-29; the advisory has not been revised, so the dates are past but unconfirmed), Oracle Rev 2 (Secure Backup, Solaris 11, 8 Communications patches, CVSS 3.1 9.8), SecurityWeek quotes, CISA KEV listing."
      - "Johnson Controls claim rests on SecurityWeek's relay (the vendor PDF viewer is JS-only); the sourcing_note says so."
    length_note: null
