    verdict: imprecision
    findings:
      - code: F3
        claim_id: "de2c9ccc2e"
        where: "body, **Exposure:** line, citations 'Trend Micro, 2026-10-28' and 'Quest Software, 2026-10-28' (low confidence)"
        defect: >
          The Exposure line names Mobile Security for Enterprise as an exposed Trend Micro server but cites "Trend Micro, 2026-10-28". The page's table row for Mobile Security for Enterprise only exists in the
          status as of 2026-10-30 (the entry's own 2026-10-31 section says it was "newly listed"), so the citation date is two days older than the content it vouches for.
          The same date label sits on the Quest citation although the page was last updated 2026-10-29.
        ground_truth: "KA-0024802: 'Current Status as of Oct. 30 ... Trend Micro Mobile Security for ENT (TMMS) Impacted - Contact support for mitigation Critical Patch ETA: Nov. 17'; 'Last updated: 2026/10/30'."
        ground_truth_url: "https://success.trendmicro.com/en-US/solution/KA-0024802"
        fix: "Re-date the Trend citation in the Exposure line to 2026-10-30 (and the Quest one to 2026-10-29)."
      - code: F4
        claim_id: null
        where: "title: 'Trend Micro Apex Central and Apex One server have no fix until 2026-11-11' (low confidence)"
        defect: "The title turns Trend Micro's estimate into a firm release date and says no fix exists until that day. The body and summary correctly say 'expected' / 'due'."
        ground_truth: "KA-0024802: 'Apex Central | Impacted - Critical Patch ETA: Nov. 11' and 'Apex One (On-premise server) | Impacted - Critical Patch ETA: Nov. 11'; the page also says the table 'will be continually updated'."
        ground_truth_url: "https://success.trendmicro.com/en-US/solution/KA-0024802"
        fix: "Title: '... have no released fix, patches expected 2026-11-11'."
    length_note: null
  - entry: 2026-10-31/php2shell-broadcom-sepm-carbon-black-app-control-casma
    verdict: imprecision
    findings:
      - code: F4
        claim_id: "4695cc07c8"
        where: "**Defender takeaway:** 'CloudSOC SpanVA and CASMA have none' (low confidence)"
        defect: >
          States as fact that no fix exists for CloudSOC SpanVA and CASMA. The umbrella advisory only lists them as affected and links per-product advisories 39429 (SpanVA) and 39475 (CASMA)
          which require a Broadcom login and were not readable, as was 39411 for App Control. The sourcing note names only 39421 as unreadable, so the gap behind "have none" is not disclosed.
        ground_truth: "Advisory 39404 revision history: '2026-10-23 11:00 PT - CloudSOC SpanVA Appliance added to Affected', '2026-10-30 12:00 PT - Content Analysis and Malware Analysis moved to Affected'; no fix or workaround on the page; the per-product links (39411, 39421, 39429, 39475) all return the Broadcom sign-in page."
        ground_truth_url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39404"
        fix: "Say 'no fix is published on the readable pages for CloudSOC SpanVA and CASMA' and extend the sourcing note to name 39429 and 39475 as login-gated."
