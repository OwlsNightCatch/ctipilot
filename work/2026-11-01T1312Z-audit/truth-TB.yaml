entries:
  - entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    verdict: imprecision
    findings:
      - code: F9
        claim_id: null
        where: "evidence[] cash.ch quote + ## Improvement 2026-10-13T03:38:20Z, against the Tamedia ~100 GB figure in the main analysis and headline (low confidence)"
        defect: >
          The entry keeps "According to the software firm, a rather small amount of data left." (AWP, 2026-10-09; the Improvement section repeats it as "the volume is rather small")
          beside the headline and main-analysis report that Akira holds "about 100 GB" of compressed data on well over 100,000 federal employees. The two are never reconciled and no
          Contradiction line states that the supplier's early volume statement is at odds with the later reporting.
        ground_truth: >
          cash.ch (AWP, 2026-10-09): "Laut der Softwarefirma sei eine eher kleine Datenmenge abgeflossen."; Tages-Anzeiger 2026-10-20 summary: "Die Hackergruppe Akira stahl rund hundert Gigabyte komprimierte Pensionskassendaten."
        ground_truth_url: "https://www.cash.ch/news/cyberangriff-auf-softwarefirma-betrifft-auch-berner-pensionskassen-975542"
        fix: "Add one clause to the main analysis saying PK Softech's early 'rather small' volume statement sits against Tamedia's 100 GB figure, or drop the superseded 'rather small' evidence record from the main reading."
      - code: F11
        claim_id: "5cc3e07119"
        where: "updates[] record 2026-10-30T03:55:40Z summary (advisory; verdict not affected)"
        defect: >
          The reader-facing record summary narrates record keeping ("the summary, the sourcing note and the paragraph on the Akira reporting now say so, a population figure was trimmed
          from the analysis") and states a trimmed population figure that the ## Correction section never mentions (record summary says more than its section).
        ground_truth: "Section text: only the newsletter statements (Akira being associated, criminal complaint 2026-10-15, data assumed to have left, demand and Prosecutor confirmation still press reports); the 70,000/41,600 membership figure removed from the main analysis is a correct watson.ch figure."
        ground_truth_url: "https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"
        fix: "Amend the record summary to what the section says (newsletter content only) and drop the field and record-keeping narration."
    length_note: "main analysis 1,158 words (bound 550); headline 115 characters; the 3,282 words of dated sections are history"
