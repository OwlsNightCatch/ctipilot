- code: F11
  category: editorial-advisory
  section: updated-entries
  item: "Reader-facing record-keeping narration and wording glitches in this fire's text"
  url_or_quote: "PHP 2026-11-01 section: 'Karimi's honeypot report is no longer described as the first successful code execution' and 'The stale triage line about website take-downs on 2026-10-21 and 2026-10-22 is removed.'; .NET correction: 'as the entry had stated'; Linux 46300 correction: 'the Exposure and Defender takeaway lines now carry that'; Ivanti improvement: 'Volexity, not GitHub's advisory record, is the source that ties ... to CVE-2026-104935.'; GitLab body: 'Affected are ... 19.4 before 19.4.2; The 19.4.1 release'; Windows Shell actions[0]: 'Rapid7 says Windows Server 2012 receives no patch.; confirm that Microsoft Edge ...'; VMware 2026-08-28 section carries the 2026-10-30 CISA ransomware flag that the 2026-11-01 correction repeats"
  summary: "Self-referential edit narration and stray punctuation in reader-facing text; the Ivanti improvement also duplicates the Detection line it just changed. State the delta without describing the entry's earlier wording, fix the '; The' and '.;' glitches, and keep the CISA ransomware statement in one place."
- code: F11
  category: editorial-advisory
  section: updated-entries
  item: "Record and evidence hygiene"
  url_or_quote: "GhostAction evidence: 'Socket has observed no malicious package versions published to PyPI or crates.io as a result of this activity at the time of writing.'; Linux 46300 record: 'two at-disclosure sentences the KEV listing superseded are removed'; eMudhra record: build-string and Oracle-quote changes; Node2Shell Correction 2026-11-01"
  summary: "(a) The GhostAction Socket evidence quote (as of 2026-10-09) now supports no statement in the entry after the summary and body clauses were removed, and reads stale beside the October escalation. (b) The Linux 46300 record says the KEV listing superseded two at-disclosure sentences; only Microsoft's 'no evidence of exploitation' sentence is superseded, the AlmaLinux/CloudLinux patch sentence is not, and the record omits the rewritten 'root step of a chain' sentence. (c) The eMudhra record narrates two non-reader changes the section does not state. (d) The Node2Shell correction carries new developments (Zscaler telemetry, Datadog layers, Prisma Cloud Transporter Client) that do not float the entry; an update or improvement record would describe them accurately."
