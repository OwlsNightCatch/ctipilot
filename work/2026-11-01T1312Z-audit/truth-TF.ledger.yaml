  - claim_id: 5047e6f9fd
    entry: 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    surface: "body"
    kind: cited
    text: "**Exposure:** any WS_FTP Server on Windows below 2024.0.7 or 2025.0.4; CSIRT Italia describes it as a secure file-transfer server used within organisations and with external partners, so instances reachable from partner or public networks come first ("
    urls: ["https://www.acn.gov.it/portale/w/progress-risolte-vulnerabilita-in-ws_ftp-server"]
