  - claim_id: 8e86839a99
    entry: 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    surface: "body"
    kind: derived
    text: "For an instance that was reachable before the fix, the records to review are the web-server logs of the Web Admin console and the file-transfer server's own logons for administrator access from unfamiliar addresses, and process creation by the service or its web worker, since CVE-2026-90865 is command execution (an inference from the described flaw)."
  - claim_id: c72beaa356
    entry: 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade to 2024.0.7 or 2025.0.4, partner-facing instances first, and rotate the administrator credentials afterwards, because the upgrade does not change credentials an attacker already read; take an instance on an unsupported branch off the network or migrate it."
  - claim_id: 5997d0772e
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "headline"
    kind: frontmatter
    text: "Microsoft: Teams help-desk vishing into Quick Assist ended in AD CS certificates for privileged accounts and a DC"
  - claim_id: 72d58d4232
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Threat Intelligence describes two human-operated intrusions, not attributed to any actor, in which an external Teams contact impersonating help-desk staff got a user to open Quick Assist, after which the operator staged a portable runtime and used Active Directory Certificate Services to reach privileged identities: a template open to ESC1 issued certificates for privileged accounts and DCSync followed within seconds, and in the second case PetitPotam was relayed to AD CS Web Enrollment (ESC8) for a certificate for a domain controller account. An issued certificate stays valid after a password reset or a reimage of the first workstation, and in the first case one privileged account excluded from automated containment stayed usable and was used to copy data to an external SFTP destination."
  - claim_id: a553637c2b
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "actions[0]"
    kind: frontmatter
    text: "In every forest with an enterprise CA, list the AD CS Web Enrollment and Certificate Enrollment Web Service endpoints that lack HTTPS and Extended Protection for Authentication and the certificate templates that accept requester-supplied identity with broad enrollment rights, because both intrusions turned a Quick Assist session into a certificate for a privileged identity."
  - claim_id: 6fa24d6ecd
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "In the session the operator placed an archive in Downloads, extracted it into a newly created KB-prefixed folder under the user profile and started the payload with a portable Python, JavaScript or Java runtime, which ran host and network discovery and assessed AD CS ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: b996e973ee
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "Defender's automated disruption blocked more than 1,000 SMB attempts, but a privileged account excluded from automated response stayed usable, reached a file server and ran a renamed Rclone that copied a share to an external SFTP destination ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: cbe7640fdb
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "In the second case the operator used PetitPotam to make a domain controller authenticate to the attacker's host, relayed that NTLM authentication to an AD CS Web Enrollment endpoint, obtained a certificate from the Domain Controller template and used it for PKINIT to get a ticket-granting ticket for the controller's account; Defender raised ESC8 alerts and the customer isolated the workstation ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: 12439c3f41
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "**Exposure:** a forest with an enterprise CA whose authentication-capable templates accept requester-supplied identity with broad enrollment rights (ESC1), or whose Web Enrollment or Certificate Enrollment Web Service endpoints lack HTTPS and Extended Protection (ESC8), where Teams accepts external chats and calls and users can start Quick Assist; Defender for Identity's AD CS posture assessments, or an inventory of /certsrv endpoints and template permissions, shows the first two ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: d63f61b833
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "**Detection:** new external Teams contacts from help-desk-themed tenants; in process telemetry, a portable runtime started from a freshly created KB-prefixed folder under the user profile after a remote-support session; in CA records, certificate requests and issuances correlated by requester, subject alternative name and template with the first authentication using the certificate; and a domain controller account authenticating to Web Enrollment from a device that is not that controller, which Microsoft calls a strong pivot ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: cfac250fe2
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: cited
    text: "Treat a containment exclusion as an incident decision with a manual compensating step, because in the first case the one excluded privileged account was the route to the file server ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/30/help-desk-impersonation-ad-cs-abuse-investigating-esc1-esc8-intrusion-paths/"]
  - claim_id: abf83525e0
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: uncited
    text: "Microsoft Threat Intelligence describes two human-operated intrusions, not attributed to any threat actor, that began with an external Teams contact (across the broader activity Microsoft saw organisation-themed tenant names and support-style display names) who persuaded a user to open Quick Assist and read out the connection code; the activity did not exploit a Teams vulnerability."
  - claim_id: 797944209f
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: uncited
    text: "In the first case a certificate template open to ESC1, where the requester supplies the identity, produced certificates for three privileged accounts, and about 90 minutes later for eight more after a second wave against 16 users; DCSync began within seconds of obtaining one privileged certificate."
  - claim_id: cc590861fd
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: derived
    text: "After containment, revoke the unauthorized certificates and assess issued Kerberos tickets separately; a password reset and a reimage of the first workstation leave both in place."
  - claim_id: 552e687e29
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: derived
    text: "**Triage:** a help-desk Quick Assist session is routine; what separates this one is an external-tenant initiator with no matching ticket and an interpreter runtime launched from a newly created user-writable folder rather than a managed install path."
  - claim_id: 6f109be7f2
    entry: 2026-10-31/teams-help-desk-impersonation-quick-assist-ad-cs-esc1-esc8
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** require HTTPS and Extended Protection on every enrollment web endpoint, drop the ones nobody needs, review authentication-capable templates and require approval where enrollment is broad, and enable the Certification Services audit subcategory and CA audit filter; limit Teams external access and restrict remote-support tools to approved ones."
  - claim_id: 826d7e692b
