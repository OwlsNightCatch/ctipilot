claims:
  - claim_id: 82c9ff5863
    entry: 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2
    surface: "headline"
    kind: frontmatter
    text: "WatchGuard fixes three feature-dependent unauthenticated flaws scored 9.2 in Fireware OS; no exploitation known"
  - claim_id: 77f4ca0675
    entry: 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2
    surface: "summary"
    kind: frontmatter
    text: "WatchGuard's advisories of 2026-10-27 fix 17 flaws in Fireware OS 2026.4, 12.12.4 and, for T15 and T35 models, 12.5.22, seven of them scored 9.0 or higher. Three need no authentication but a specific feature: a heap write in the Access Portal's WebSocket handling, a stack overflow in the SIP proxy and missing authentication in the FireCluster sync daemon, each scored 9.2. Four more need an attacker who controls or intercepts traffic to an Active Directory server, to WatchGuard Cloud or to a log server. WatchGuard is not aware of exploitation of any of them."
  - claim_id: dc2206cb96
    entry: 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every WatchGuard Firebox to Fireware OS 2026.4, 12.12.4 or, on T15 and T35 models, 12.5.22, starting with appliances that have the Access Portal or a SIP proxy enabled or that are FireCluster members, because WatchGuard names no workaround for the three unauthenticated flaws."
