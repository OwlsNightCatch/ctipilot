    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "); WordPress's release documentation counts 22 vulnerabilities, as Wordfence reports ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: ea242b9b6a
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "During a core update with a complete package, the new files are unpacked into a predictable directory under `wp-content/upgrade`; the temporary copy includes the installer, and an unauthenticated attacker who requests it at the right moment can interact with the staged copy and reach PHP code execution ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: b8957b44af
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Wordfence scores it CVSS 8.1 for versions 4.7 through 7.1.3 and states that the attack complexity is high, because the attacker needs web access to the staging tree and must win a race that lasted only seconds in its lab ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 73df295a6f
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Patchstack reads the same flaw as needing `wp-content/upgrade/` to be reachable over the web, notes that the sink dates back to WordPress 2.8 and that the window returns on every update, unattended ones included, and would not call it practical to exploit ("
    urls: ["https://patchstack.com/articles/wordpress-7-1-4-security-release/"]
  - claim_id: ce97543ed8
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Wordfence reports that its new firewall rule matched within nine minutes of deployment and that it recorded more than 18,500 requests for staged `setup-config.php` installer paths in the first 21 hours, with two large sources polling small groups of sites for about 14.5 hours, which it reads as attempts to catch the update window ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 25fa785e87
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "The fix randomises the staging directory, adds an index guard and prevents unsafe promotion of staged configuration data ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: f3631bb31b
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Most sites receive the release through automatic background updates, which Wordfence says should be checked rather than assumed ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 427b050a67
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Exposure:** any WordPress site on 4.7 to 7.1.3 that runs a full-package core update, automatic ones included, with `wp-content/upgrade/` reachable from the internet; Dashboard > Updates shows the running version, and the fixed releases are 7.1.4 and the backport of each branch (7.0.8, 6.9.11, 6.8.12, 6.7.11, 6.6.11 and the earlier branches listed by Wordfence down to 4.7.39) ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: ce368e7fe9
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Detection:** in web server access logs, requests under `wp-content/upgrade/` and for `setup-config.php` inside a staging directory, repeated from one source against a few sites as Wordfence saw ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 20b8785955
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "); between updates the directory holds only an `index.php` ("
    urls: ["https://patchstack.com/articles/wordpress-7-1-4-security-release/"]
  - claim_id: b9e2a71480
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** confirm that the automatic update completed on every site instead of assuming it, and deny web access to `wp-content/upgrade/` at the web server, because a firewall that WordPress itself loads cannot block the request: the staged copy loads from its own files ("
    urls: ["https://patchstack.com/articles/wordpress-7-1-4-security-release/"]
  - claim_id: 690386ea05
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
