    text: "Patch every E-Business Suite 12.2.3 to 12.2.15 web tier for CVE-2026-101767 now, because exploit attempts began a week after release, and review its web logs since 2026-10-27 for unauthenticated requests to the Thin Client Framework servlet and for database or Concurrent Manager activity that followed."
