  - claim_id: 2d3942359b
    entry: 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2
    surface: "body"
    kind: derived
    text: "For the three unauthenticated rows, connections to the cluster management address from hosts that are not cluster peers, WebSocket upgrade requests to the Access Portal from unexpected sources, SIP traffic from outside expected carriers, and restarts of the portal, SIP or sync services on the Firebox are the telemetry to review; this is an inference from the stated mechanisms."
  - claim_id: c62fc19fc8
    entry: 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2
    surface: "body"
    kind: derived
