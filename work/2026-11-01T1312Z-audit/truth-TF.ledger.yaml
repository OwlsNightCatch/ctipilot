    text: "**Exposure:** an ASA or FTD unit below the first fixed release of its branch whose running configuration has `webvpn` enabled on an interface and `secondary-authentication-server-group` on any tunnel group; the default tunnel group DefaultWEBVPNGroup counts even when the tunnel group list is disabled."
