    surface: "body"
    kind: cited
    text: "Cisco says its PSIRT became aware of active exploitation in October 2026 and names no actor or victim ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: 3dc44ce3fb
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "); CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-29 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/29/cisa-adds-two-known-exploited-vulnerabilities-catalog"]
  - claim_id: ba38f8448a
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "), and CERT-FR restates the advisory ("
    urls: ["https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1412/"]
  - claim_id: f92e852cc7
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "The stated impact is a reload and denial of service, scored CVSS 3.1 8.6 with availability as the only impact; no code execution or data access is described ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: e3ea5780eb
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "The first fixed releases are ASA 9.16.4.104 (for 9.16 and earlier), 9.18.4.96, 9.20.4.50, 9.22.3.200, 9.23.1.48, 9.24.1.27 and 9.24.10.1, and FTD 7.0.11 (for 7.0 and earlier), 7.2.13, 7.4.9, 7.6.7, 7.7.14, 10.0.3 and 10.1.1 ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: 2128a44a3b
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "Cisco lists no workaround; its mitigation is to remove secondary authentication from the tunnel group, which lowers the security posture of the remote access VPN, or, where DefaultWEBVPNGroup does not use secondary authentication, to disable the tunnel group list with `no tunnel-group-list enable` ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: 9bb049e1db
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "Cisco confirms that Secure FMC, Cloud-delivered Firewall, cdFMC and Secure Access are not affected ("
