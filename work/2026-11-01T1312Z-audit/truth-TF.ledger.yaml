    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "The mechanism points at device availability telemetry: unexpected reloads, HA failover flaps, uptime resets and crash files on units that terminate the remote access VPN, read against VPN authentication logs for connection attempts from external addresses that never complete a login."
