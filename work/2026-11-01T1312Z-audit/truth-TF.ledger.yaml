  - claim_id: b2fb1cbd3f
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "headline"
    kind: frontmatter
    text: "Talos IR Q3: public administration tied for most targeted; vishing into RMM and EDR killing mark the ransomware cases"
  - claim_id: 054a90b974
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos Incident Response's Q3 2026 trends report names public administration, tied with finance at 18 percent of engagements, as the most targeted sector, and puts phishing first and public-facing application exploitation second among initial-access techniques. Its ransomware cases (27 percent of engagements) show help-desk vishing that leads the victim to allow remote access through a legitimate remote-management tool, and operators who uninstall or terminate EDR, including with vulnerable drivers."
  - claim_id: 502d6186e2
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Cisco Talos Incident Response reports that in Q3 2026 financial organisations made up 18 percent of its engagements, tying with public administration as the most targeted sector ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 5d5fb04d9f
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Phishing was the leading initial-access technique at 37 percent of engagements and exploitation of public-facing applications second at 33 percent; the phishing cases include numerous actors who phone the victim as the IT help desk to get remote access allowed through a legitimate remote monitoring and management (RMM) tool ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 0ef6927db1
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Ransomware and pre-ransomware cases were 27 percent of engagements, with The Gentlemen, Qilin, Rhysida and the closed group Interlock among the families and a new variant, VYPR, that Talos calls operationally immature: it had no leak site when seen, reused leaked Conti-derived source code and exfiltrated over several days ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: fe593e0624
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "The VYPR intrusion began with a vishing call that had the user start a Microsoft Quick Assist session; the actor then used RMM software that ran PowerShell to download and install an MSI from a remote address, with MeshAgent, Rclone, PsExec, an IP scanner and mstsc as tools, and disabled EDR with several vulnerable drivers ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 69a51ff213
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Interlock operators repeatedly tried to uninstall Cisco Secure Endpoint, used PsExec and taskkill to end security services and integrity checkers, turned off Windows Defender real-time protection and cleared event logs ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 4171e64d38
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Talos names insufficient logging (over 40 percent of engagements), weak credential and secret handling, and absent or incomplete MFA as the most common weaknesses, and recommends centralised logging with at least 90 days of retention ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 9305422677
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Exposure:** an organisation whose help desk or staff can be reached by phone and whose endpoints permit Quick Assist or an unapproved RMM agent; Talos names public administration among the most targeted sectors in its caseload."
  - claim_id: f552fe8e54
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Detection:** in process-creation and software-install telemetry, an RMM or Quick Assist session started after an inbound call, followed by PowerShell run under the RMM agent that downloads an installer from an external address; in endpoint and service-control telemetry, attempts to uninstall the EDR agent, PsExec or taskkill ending security services, Defender real-time protection switched off, vulnerable kernel drivers loaded, and event logs cleared."
  - claim_id: 28ef4edcb4
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a remote-support session that nobody at the help desk started as the vishing signal and inventory which RMM tools and Quick Assist are permitted on endpoints; alert on EDR uninstall and security-service termination as a ransomware precursor; and centralise logs with the 90-day minimum retention Talos recommends, because actors delete logs on the endpoint."
  - claim_id: 4da1c1f2f7
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "headline"
    kind: frontmatter
    text: "Cisco ASA and FTD SSL VPN reload flaw is exploited and on CISA KEV; fixes in every branch, no workaround"
  - claim_id: 42f50ed10e
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory of 2026-10-28 fixes CVE-2026-76418, a logic error in the remote access SSL VPN of Secure Firewall ASA and Secure FTD that lets an unauthenticated attacker reload the device with a crafted connection request when a tunnel group uses secondary authentication, and says Cisco's PSIRT became aware of active exploitation in October 2026; CISA added it to the Known Exploited Vulnerabilities catalog on 2026-10-29. Cisco names no actor, offers no workaround and lists first fixed releases for every ASA and FTD branch."
  - claim_id: 24a71be4ee
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Cisco ASA and FTD unit that has webvpn enabled and secondary authentication on any tunnel group, DefaultWEBVPNGroup included, to the first fixed release of its branch (ASA 9.16.4.104, 9.18.4.96, 9.20.4.50, 9.22.3.200, 9.23.1.48, 9.24.1.27 or 9.24.10.1; FTD 7.0.11, 7.2.13, 7.4.9, 7.6.7, 7.7.14, 10.0.3 or 10.1.1), internet-facing units first, because Cisco reports exploitation and its only mitigation removes secondary authentication."
  - claim_id: 6835fe24b0
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "cves[CVE-2026-76418]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-76418\", \"cvss\": \"8.6 (CVSS 3.1)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"ASA and FTD releases below the first fixed release of their branch, with webvpn enabled on an interface and secondary-authentication-server-group set on a tunnel group or on DefaultWEBVPNGroup\", \"fixed\": \"ASA 9.16.4.104, 9.18.4.96, 9.20.4.50, 9.22.3.200, 9.23.1.48, 9.24.1.27 and 9.24.10.1; FTD 7.0.11, 7.2.13, 7.4.9, 7.6.7, 7.7.14, 10.0.3 and 10.1.1\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 96f145506b
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "Cisco's advisory of 2026-10-28 describes CVE-2026-76418, a logic error in the remote access SSL VPN service of Secure Firewall ASA and Secure FTD: an unauthenticated, remote attacker who sends a crafted request while connecting to the SSL VPN makes the device reload, and a successful VPN login is not required to reach the affected processing path ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
