    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "summary"
    kind: frontmatter
    text: "The Linux kernel CVE team published CVE-2026-98432 on 2026-10-15, a use-after-free in the IPv4 TCP connection setup path that dates to Linux 4.4 and is reached by a SYN packet carrying IP options; the CNA scores it CVSS 9.8. Anthropic reports that Claude wrote an exploit giving a remote, unauthenticated attacker root command execution on servers with a multipath TCP (MPTCP) listener, and the Go team says the bug is not specific to MPTCP and that Go programs enable MPTCP on Linux listeners by default. Debian's security kernels are fixed while Ubuntu 22.04 to 26.10 and RHEL 8 to 10 had no fixed kernel on 2026-10-30; no source reports public exploit code or attacks."
  - claim_id: d054443627
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Linux server, install the distribution kernel that fixes CVE-2026-98432 and reboot as soon as it ships (Debian bookworm 6.1.190-1 and trixie 6.12.113-1 are out; Ubuntu and RHEL kernels were not as of 2026-10-30), and until then drop IPv4 TCP packets that carry IP options ahead of the TCP stack as CIQ describes, after testing on one non-production host because it also drops legitimate option-bearing traffic; disabling MPTCP alone does not close the path."
