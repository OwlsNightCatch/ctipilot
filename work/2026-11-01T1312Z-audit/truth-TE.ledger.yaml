    text: "MDaemon uses ClamAV to scan attachments of incoming mail; old ClamAV versions carry CVE-2025-8088, the WinRAR path-traversal flaw ESET uncovered last year, which ESET says was fixed in ClamAV's source on 27 July 2025 (the release notes below date the fixed ClamAV builds 2026-08-07), while MDaemon kept shipping an old libclamunrar.dll until MDaemon 26.0.4 of 2026-08-25 ("
