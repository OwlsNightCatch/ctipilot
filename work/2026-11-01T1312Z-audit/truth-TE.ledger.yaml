    surface: "section 2026-10-17T03:34:30Z"
    kind: cited
    text: "), the same step Volexity describes as abusing the dsinvoked service's trust in the shared DSCache store ("
    urls: ["https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"]
  - claim_id: 5de0b50030
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-17T03:34:30Z"
    kind: cited
    text: "The record names only 22.8R2.4 as affected and states no fixed build; Volexity wrote that Ivanti was working on a fix for release in the coming weeks ("
    urls: ["https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"]
  - claim_id: 2e1f748b9e
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-17T03:34:30Z"
    kind: cited
    text: "The Canadian Cyber Centre's bulletin on the Ivanti advisory, updated 2026-10-16, adds that open-source reporting indicates CVE-2026-111357 is being exploited in the wild ("
    urls: ["https://cyber.gc.ca/en/alerts-advisories/ivanti-security-advisory-av26-1035"]
  - claim_id: b5558342da
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-17T03:34:30Z"
    kind: uncited
    text: "A scanner, SIEM enrichment rule or ticket can now follow the unfixed step by this ID, and an appliance that was exposed still needs the compromise check above."
  - claim_id: f5e309b91e
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-21T08:20:53Z"
    kind: cited
    text: "Ivanti's own description of CVE-2026-104935, as the numbering authority, reads \"Authentication bypass by spoofing in ICS before version 25.1.3.0 allows a remote unauthenticated attacker to execute arbitrary commands\" ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-98816"]
  - claim_id: c6a514e858
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-21T08:20:53Z"
    kind: cited
    text: "Rapid7 relays that, according to Ivanti, a portion of the flaw was found through its product security program and patched in the July 2026 release of 25.1.3.0, and that exploitation occurred while Ivanti was backporting the fix to the other supported versions ("
    urls: ["https://www.rapid7.com/blog/post/etr-ivanti-connect-secure-zero-day-exploited-in-the-wild-cve-2026-104935/"]
  - claim_id: 5e0e631502
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-21T08:20:53Z"
    kind: cited
    text: "CERT-FR still lists 25.1.3.x builds before 25.1.3.1 as affected ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-013/"]
  - claim_id: d17bf8a39c
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: cited
    text: "Volexity's report now carries an update banner saying Ivanti published a patch on 2026-10-29 for the privilege-escalation step, which is tracked as CVE-2026-111357 ("
    urls: ["https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"]
  - claim_id: 75b0ee78de
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: cited
    text: "CISA added CVE-2026-111357 and a third chain flaw, CVE-2026-118527, to its Known Exploited Vulnerabilities catalog on 2026-10-30 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/30/cisa-adds-two-known-exploited-vulnerabilities-catalog"]
  - claim_id: 05a3d88bbc
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: cited
    text: "The catalog describes CVE-2026-118527 as a generation-of-predictable-numbers-or-identifiers flaw that lets a remote authenticated attacker upload files with attacker-controlled content to a known location on disk, and says it can be chained with CVE-2026-104935 and CVE-2026-111357 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 74a1107c03
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: cited
    text: "The Canadian Cyber Centre's bulletin on Ivanti's advisory, updated 2026-10-30, now lists the Connect Secure versions before 25.1.1.3, 25.1.3.1 and 22.8R2.6 as affected ("
    urls: ["https://cyber.gc.ca/en/alerts-advisories/ivanti-security-advisory-av26-1035"]
  - claim_id: d467230ec5
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: cited
    text: "), a range that takes in 25.1.1.2 and 22.8R2.5, the builds of 2026-10-13; CISA's alert, updated the same day, lists versions 25.1.1.2 and prior, 25.1.2.2 and prior and 22.8R2.5 and prior as affected by the three chain CVEs ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerability-ivanti-connect-secure"]
  - claim_id: 2346c93fa5
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-31T03:37:10Z"
    kind: uncited
    text: "Ivanti's advisory page could not be read, so which build carries which CVE's fix is not confirmed, and CVE-2026-118527 has no public CVE record, affected range or fixed build yet."
  - claim_id: eba229c118
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "record 2026-10-16T04:10:00Z"
    kind: record-summary
    text: "CERT-FR's alert of 2026-10-14 says it knows of lateral movement using the LDAP and Active Directory secrets stored on the appliance, and sets the response order: isolate the appliance from the internet and the internal network, snapshot and keep it powered on, then analyse before any reset; its rotation scope also covers Kerberos tickets of the service accounts and licence-server authentication. CERT-FR also counts 25.1.3.0 as affected, so the fixed-build targets now name 25.1.3.1."
  - claim_id: 467620a6b5
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "record 2026-10-17T03:34:30Z"
    kind: record-summary
    text: "The unfixed root-escalation step of the chain now has its own identifier, CVE-2026-111357, published 2026-10-15, and the Canadian Cyber Centre says open-source reporting indicates it is exploited in the wild; its description names only 22.8R2.4 as affected, says the step was exploited in the wild in October 2026 and states no fixed build, so scanners, SIEM enrichment and tickets can now follow the step by ID."
  - claim_id: 7a4ff2e3ee
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "record 2026-10-18T14:00:53Z"
    kind: record-summary
    text: "The CVE-2026-111357 record now carries the CVSS 3.1 score of 7.0 from its CVE record, and the CVE-2026-104935 fixed builds add 25.1.3.0, which Ivanti's own CVE record lists as unaffected, as Rapid7 does; CERT-FR's reading of build 25.1.3.0 as affected is kept beside it."
  - claim_id: f7bfc8ac8f
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "record 2026-10-21T08:20:53Z"
    kind: record-summary
    text: "The status of build 25.1.3.0 now rests on Ivanti's own description of the flaw, which covers versions before 25.1.3.0, beside Rapid7's table and CERT-FR's alert, which counts 25.1.3.0 as affected; 25.1.3.1 stays the target build."
  - claim_id: e8eaf9b680
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "record 2026-10-31T03:37:10Z"
    kind: record-summary
    text: "Ivanti patched the root-escalation step of the exploited Connect Secure chain, CVE-2026-111357, on 2026-10-29, and CISA listed it and a third chain flaw, CVE-2026-118527, on 2026-10-30. The Canadian Cyber Centre and CISA now list builds 25.1.1.2 and 22.8R2.5 as affected, so the builds of 2026-10-13 are no longer the target."
