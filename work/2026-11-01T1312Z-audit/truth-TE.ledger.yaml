    kind: cited
    text: "Data that may be affected, not every category for every person, includes name, date and place of birth, first-degree relatives, insured status, family doctor, social benefits, pensions, disability, driving licence, photograph, vehicles and companies owned or run, IBAN, tax debts and payment history; AGE says card data is not held on the platform and it found no unauthorised change to state registers ("
    urls: ["https://egov.md/ro/node/41145"]
  - claim_id: 291169021f
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "body"
    kind: cited
    text: "AGE stopped the extraction on 23 October at 11:30, reviewed 82 digital services and suspended the exposed ones, and its timeline says 82 public services and more than 30 information systems and administration panels were disconnected as a precaution on 23 October; it blocked further attempts on 25 and 27 October, and the Prime Minister's account is that 30 of the 82 services were disconnected ("
    urls: ["https://egov.md/ro/node/41145", "https://www.moldpres.md/eng/society/prime-minister-on-cyberattack-targeting-public-digital-services-authorities-are-investigating-the-possible-involvement-of-foreign-state-actors-as-well"]
  - claim_id: 2fa297d407
