  - claim_id: 4d3d536ba7
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "headline"
    kind: frontmatter
    text: "JPCERT/CC and NICT: attackers decompile the public app, then call internal APIs; AI platforms scan exposed web apps"
  - claim_id: 3426ab5520
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "summary"
    kind: frontmatter
    text: "JPCERT/CC (alert AT-2026-0030, updated 2026-10-23) and NICT describe a wave of personal-data leaks from Japanese web systems in which attackers analyse the published Android app to find API endpoints and keys and then call internal management APIs the app screens never use, place JSP web shells as .war files on application servers behind the public web server, and, per the latest update, run AI penetration-testing platforms (Cairn, CyberStrikeAI, ARTEX) against internet-facing web applications, WSUS servers included. No actor is named, JPCERT/CC says it confirmed AI used to scan for known vulnerabilities and attack through APIs, and Macnica could not confirm AI use."
  - claim_id: b3d9c4266b
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "JPCERT/CC's alert of 2026-10-08, updated on 2026-10-23, says that around September 2026 Japanese organisations disclosed a run of personal-data leaks through unauthorised access, and singles out an attack type that may be increasing: systems the operator never expected strangers to reach, such as business-intelligence tools and staff-management systems, were hit alongside public apps ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: ee6c58c376
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "It does not tie them to one method and groups them in five: per-target scanning for known flaws and exposed configuration and backup files; unauthorised calls to application management APIs; the Metabase SQL injection CVE-2026-72898; .war files carrying a JSP web shell that runs commands passed in query parameters, placed on application servers reachable from the public web server; and, added on 2026-10-23, attempts through AI penetration-testing platforms it names as Cairn, CyberStrikeAI and ARTEX, including against exposed WSUS servers ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: 26f7484b89
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "In the API case the attackers analyse the published smartphone app to find endpoints and keys, then attack internal APIs the app screens cannot reach: changing user rights, creating accounts, toggling a header or sending malformed tokens to compare responses, and blind NoSQL injection to find account data; some use API keys stolen elsewhere ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: a9fe661f5c
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "NICT calls this an app-to-backend attack: the app need not be vulnerable, and backend authentication, authorisation or input-validation faults leak data ("
    urls: ["https://cynex.nict.go.jp/library/261013-01.html"]
  - claim_id: c03c247e22
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "On attack servers JPCERT/CC found Android packages, reverse-engineering tools and a Python script that answers requests with HTTP 302 redirects and appears to have been used to test for server-side request forgery ("
    urls: ["https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html"]
  - claim_id: 3701d28873
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "JPCERT/CC says it confirmed that the attackers used AI to scan for known vulnerabilities and attack through APIs ("
    urls: ["https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html"]
  - claim_id: 78342e8034
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "), while Macnica could not confirm AI use ("
    urls: ["https://www.recordedfuture.com/blog/japan-cyber-crisis-warnings"]
  - claim_id: 8f424ff2f4
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "API-attack access also arrives through Tor exit nodes and residential proxies ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: 868a568505
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "**Exposure:** an organisation that publishes a mobile app with a backend API, runs internet-facing web applications, or leaves BI tools, staff-management systems or WSUS servers reachable from the internet ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: b8432a31a9
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "); NICT asks operators to inventory public APIs and servers and check their access logs ("
    urls: ["https://cynex.nict.go.jp/library/261013-01.html"]
  - claim_id: a528536b7f
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "**Detection:** in API and web access logs, calls to internal or management endpoints from clients that never load the app screens, role-change and account-creation calls outside the admin console, one endpoint called in sequence with and without a header or with malformed tokens, blind NoSQL-injection-style probing of account lookups, and use of API keys extracted from the app; in web server telemetry, scans for exposed configuration and backup files and .war deployments to application servers ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: 5c5862ce60
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "**Triage:** the app's own User-Agent proves nothing, because JPCERT/CC saw attack requests carrying it; the endpoints called and the sequence (header toggling, malformed tokens, role changes) discriminate, and a TLS fingerprint that matches a generic Python client does not identify the attacker alone ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html"]
  - claim_id: bfe9553941
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat the published app package as public and test the backend for authorisation gaps on internal endpoints (IDOR and BOLA), server-side request forgery, remote code execution and SQL injection ("
    urls: ["https://cynex.nict.go.jp/library/261013-01.html"]
  - claim_id: 760540e230
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: cited
    text: "JPCERT/CC's measures are per-endpoint and per-method access control including non-public APIs, expiring least-privilege API tokens with fast revocation, rate limits on login, password reset, SMS and search, no long-lived secrets in apps, and no management functions on the internet ("
    urls: ["https://www.jpcert.or.jp/at/2026/at260030.html", "https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html"]
  - claim_id: d236bd5f05
    entry: 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan
    surface: "body"
    kind: uncited
    text: "No source names an actor."
