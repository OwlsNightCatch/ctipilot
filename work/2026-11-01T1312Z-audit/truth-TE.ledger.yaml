    surface: "body"
    kind: cited
    text: "Moldova has not attributed the attack to any country or group ("
    urls: ["https://therecord.media/moldova-investigates-possible-foreign-involvement-cyberattacks"]
  - claim_id: 4b9ed2d838
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "body"
    kind: cited
    text: "**Exposure:** a public e-service of a federal, cantonal or communal administration that returns person data for an identifier without authentication, or whose output feeds other registers, since AGE says the extraction chained from unauthenticated services into further data ("
    urls: ["https://egov.md/ro/node/41145"]
  - claim_id: 95727aab2f
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "body"
    kind: cited
    text: "**Detection:** citizens noticed the abuse because the data-access history in the EVO app showed processing for civil-status document requests and driving-licence issue that they had not made, so a data-subject-visible access log is a detection channel ("
    urls: ["https://egov.md/ro/node/41145"]
  - claim_id: 3b27d83af0
