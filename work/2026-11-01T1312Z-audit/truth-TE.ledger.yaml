    surface: "section 2026-10-17T03:34:30Z"
    kind: cited
    text: "The root-escalation step of the chain now has its own identifier, CVE-2026-111357, published on 2026-10-15 and rated High on GitHub's advisory database as GHSA-fhw5-mpvj-x89m ("
    urls: ["https://github.com/advisories/GHSA-fhw5-mpvj-x89m"]
  - claim_id: 58d33e6693
