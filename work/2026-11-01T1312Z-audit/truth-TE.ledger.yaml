  - claim_id: 40744edcd0
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "headline"
    kind: frontmatter
    text: "Huntress: phished MDM enrolments push ScreenConnect back after removal; the RMM is not the root of the intrusion"
  - claim_id: a752740f79
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "summary"
    kind: frontmatter
    text: "Huntress reports several recent incidents in which phishing victims ended up with an MDM client from Hexnode or Rippling followed by an unauthorised ScreenConnect agent. In the Rippling case the attacker used the MDM, running with SYSTEM rights, to stage and run ScreenConnect; in the Hexnode case the managed-service provider removed ScreenConnect and it returned several hours later to the same relay while the Hexnode client was still installed. Huntress says the products are not at fault and that removing the RMM does not remove the management architecture behind it."
  - claim_id: 3a481c2d2a
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "actions[0]"
    kind: frontmatter
    text: "On every endpoint from which an unauthorised ScreenConnect or other RMM agent has been removed, check for a Hexnode or Rippling MDM agent or enrolment that nobody authorised and unenrol the device from that tenant, because in Huntress's Hexnode case ScreenConnect returned hours after its removal while the MDM client stayed."
  - claim_id: afdf110dad
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "Huntress reports several recent incidents in which attackers used legitimate mobile-device-management platforms, not flaws in them, as a trusted management path, naming Hexnode and Rippling as the two it saw and noting the list is not definitive ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: f18babc442
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "In the first case, proposal-themed emails led a user to download an MSI named like a DocuSign installer that installed Hexnode components (gateway, agent and PostgreSQL components); ScreenConnect followed shortly after and connected to an attacker relay, the managed-service provider removed it, and it came back several hours later to the same relay while the Hexnode client was still installed ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: 08a2515630
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "In the second, a receptionist clicked a link in an email about tax planning that led to a fake Teams calendar page; about a minute later a Rippling enrolment registry key appeared, the agent was downloaded into a SYSTEM profile path and installed with SYSTEM rights, and about 35 minutes after that the attacker used the MDM to stage and run a ScreenConnect installer as SYSTEM ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: 16ab3eb64d
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "**Exposure:** a managed Windows endpoint whose user can run an installer or follow an enrolment link, in an organisation without an inventory of its authorised MDM tenants, agents and RMM instances ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: 7a90de13f6
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "**Detection:** the chain Huntress describes as a stronger signal is social engineering, then a new MDM enrolment, then an RMM installation, then outbound communication with an unfamiliar relay, correlated across identity, MDM, endpoint and network telemetry; in endpoint telemetry that is an MSI run from a browser download folder that installs an MDM agent, an enrolment registry key on a device nobody enrolled, a new SYSTEM-level agent in a vendor directory shortly after a click, and an RMM installed by that agent ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: d793a28295
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "A repeat of the same RMM relay after the RMM was removed, as in the Hexnode case, points to a remaining MDM client as a possible source ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: 751963f8e1
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat an unexpected MDM enrolment as a security event and keep an inventory of authorised tenants; after removing a rogue RMM, unenrol the device from the unauthorised tenant, disable accounts the attacker created, revoke sessions and tokens, reset credentials and reimage the endpoint if its integrity cannot be confirmed, as Huntress advises ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
  - claim_id: f62f192ee3
    entry: 2026-10-29/huntress-mdm-enrolment-brings-back-removed-screenconnect
    surface: "body"
    kind: derived
    text: "**Triage:** a corporate enrolment started by IT looks similar in process telemetry; the discriminators are a tenant that is not in the authorised inventory, a trigger that is an emailed link or a user-run installer instead of IT's enrolment workflow, and an RMM install within minutes (an inference from Huntress's two cases)."
  - claim_id: 3298beede3
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "headline"
