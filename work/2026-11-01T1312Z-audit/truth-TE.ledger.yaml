    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "headline"
    kind: frontmatter
    text: "DeadTag: expired tag domains send visitors to iPhone exploit kits; opening the page is enough on vulnerable iOS"
  - claim_id: c8d062cb0f
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "summary"
    kind: frontmatter
    text: "Report URI and iVerify report that an operator they call DeadTag buys the expired domains of old analytics and advertising tags that thousands of websites still load, so every page that carries the tag runs the operator's script, and sells the visitors on; Report URI counts more than 660 re-registered domains. For chosen iPhone visitors one chain ends at a page that serves the Coruna kit to iOS 13 to 17.2.1 and a modified DarkSword kit to iOS 18.4 to 18.7, both of which attack the browser itself, so that opening the page compromises a vulnerable device and steals keychain passwords and crypto-wallet data."
  - claim_id: bc0bd4f49c
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "actions[0]"
    kind: frontmatter
    text: "List every third-party script domain on the public websites your organisation, its agencies and its hosting suppliers run, and remove or re-verify each whose provider has shut down, because DeadTag buys exactly those expired domains."
  - claim_id: 90d396e249
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
    kind: cited
    text: "Report URI and iVerify describe a campaign they name DeadTag: attackers buy the expired domains behind old analytics and advertising tags that thousands of websites still load, so every page that still carries the tag runs the operator's script without the site owner changing or noticing anything, and the operator sells the visitors those tags bring in ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: 3a04913a64
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
    kind: cited
    text: "Report URI has identified more than 660 re-registered domains still embedded on thousands of sites and cautiously estimates 135 million visits a month ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: 261b78931c
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
    kind: cited
    text: "The script is about 2 KB, does nothing for search engines, scanners and other bots, asks the operator's server what to do with each visitor and redirects the chosen ones, and Report URI found that the operator stopped answering when it probed from data-centre addresses or returned too often from residential ones; destinations include scam pages, a fake VPN pop-up and, for iPhones, a page that serves two exploit kits ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: ddc9fb4f79
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
    kind: cited
    text: "One chain ends at a fake prediction-market page that picks the kit by the visitor's iOS version, Coruna for iOS 13 to 17.2.1 and a modified \"P7\" variant of DarkSword for iOS 18.4 to 18.7; both attack the browser itself, so opening the page is enough to compromise a vulnerable device, and the spyware they install steals keychain passwords, crypto-wallet app data and device and account information and reports to one server; Report URI notes that Coruna and DarkSword are separate exploit kits that have been seen in different campaigns, and that here both send their stolen data to the same server, which it reads as one operator running both ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: cbca49319d
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
