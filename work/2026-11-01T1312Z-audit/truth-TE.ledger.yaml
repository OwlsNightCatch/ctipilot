    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: derived
    text: "**Exposure:** a Linux host where a local user or workload can run code and unprivileged user namespaces are on (shared hosting, CI runners, container nodes, login nodes) on the distributions above."
  - claim_id: c7d620b5e1
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
