    kind: cited
    text: "The Prime Minister says the incident is not isolated, that foreign state actors are being investigated and that the attackers automated the extraction, with the use of artificial intelligence allegedly facilitating the identification and exploitation of the vulnerabilities ("
    urls: ["https://www.moldpres.md/eng/society/prime-minister-on-cyberattack-targeting-public-digital-services-authorities-are-investigating-the-possible-involvement-of-foreign-state-actors-as-well"]
  - claim_id: 2af3e69abf
