    urls: ["https://safedep.io/testmetest-npm-worm-miasma-variant"]
  - claim_id: 8b9c2a3038
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "body"
    kind: cited
    text: "JFrog found 42 armed third-party GitHub repositories of 11 legitimate owners with hooks for AI coding assistants and IDEs, and says the payload blobs were large enough to evade GitHub's search and API paths ("
