    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "For ksmbd, look for the ksmbd module, the ksmbd.mountd daemon and a kernel-owned listener on TCP 445 ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 01fedf99f6
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Detection:** the exploit is one unprivileged process that unshares into new user and network namespaces and writes sysctls, brings up an nlmon interface, installs XFRM state over netlink, adds an nftables NFQUEUE rule, attaches a tc pedit action with a redirect and then calls splice() into a socket on the loopback address; Sysdig says nothing legitimate does all of that from one unprivileged process, so syscall-level runtime telemetry sees it ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: a7fa38de28
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** restrict unprivileged user namespaces where nothing depends on them (Sysdig says user.max_user_namespaces=0 should block the public exploit, untested by TuxCare, and breaks rootless containers and some build tooling), do not rely on Ubuntu's AppArmor restriction, set seccomp RuntimeDefault on Kubernetes pods and install the fixed kernel where your distribution has shipped it; unload ksmbd where unused and keep TCP 445 to trusted networks where it must stay ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 4c510d79bc
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: uncited
    text: "Two reports concern ksmbd, the kernel's own SMB server, not Samba."
