  - claim_id: 1e1028110c
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "body"
    kind: cited
    text: "It exfiltrates by committing encrypted data, with the victim's encrypted GitHub token, to a new public repository in the victim's own account, injects a GitLab CI job that requests npm and PyPI OIDC tokens, adds its loader to the victim's npm packages and publishes new patch versions, republishes to PyPI and RubyGems, commits a fake CodeQL workflow and AI-agent configuration files that infect the host again, and copies itself over SSH to the hosts in known_hosts ("
    urls: ["https://safedep.io/testmetest-npm-worm-miasma-variant"]
  - claim_id: e5a0a1fda1
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "body"
    kind: cited
