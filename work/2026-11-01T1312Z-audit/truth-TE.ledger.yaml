    surface: "body"
    kind: cited
    text: "**Detection:** inventory the external script references of each public site and flag any whose domain has been re-registered or no longer belongs to its provider; Report URI recommends script monitoring that shows when a new script or domain appears on a page, and a Content Security Policy that controls which domains a site may load code from ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: 7f0e09fb9f
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** remove dead third-party tags from every site you run, enforce a Content Security Policy and keep iPhones on the current iOS, with Lockdown Mode for people who may be targeted; for an iPhone that may have opened an affected page, Report URI advises restarting it, changing the passwords stored in its keychain and moving crypto assets to a new wallet ("
    urls: ["https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/"]
  - claim_id: c4a00bba47
