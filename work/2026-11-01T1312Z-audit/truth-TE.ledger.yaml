  - claim_id: 44a6a08aaf
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "summary"
    kind: frontmatter
    text: "Moldova's Electronic Governance Agency says that between 2026-10-19 and 2026-10-23 attackers exploited flaws in state digital services reachable without authentication to query about one million national identification numbers and, on preliminary estimates, extract data sets for about 750,000 of them, then used what they obtained to extract more from interconnected systems. The Prime Minister says foreign state involvement is being investigated and that AI allegedly helped find the flaws; Moldova has not attributed the attack, and the agency took 82 services under review and disconnected exposed services and more than 30 systems."
  - claim_id: 7b80913f1a
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "body"
    kind: cited
    text: "Moldova's Electronic Governance Agency (AGE) reported on 2026-10-27 that between 19 and 23 October attackers queried about one million national identification numbers (IDNPs) through state digital services and that, on preliminary estimates, data sets for about 750,000 of them were extracted; MOLDPRES had put the access requests at about 11 million on 2026-10-24 ("
    urls: ["https://egov.md/ro/node/41145", "https://www.moldpres.md/eng/society/cyberattack-on-digital-public-services-authorities-block-about-11-million-access-requests"]
  - claim_id: 3dc2c83b5d
    entry: 2026-10-29/moldova-egovernment-mass-extraction-unauthenticated
    surface: "body"
    kind: cited
    text: "AGE's technical explanation is that the attackers exploited vulnerabilities in services reachable without authentication and then used the data they obtained for further extractions; the first attacks hit an electronic service that logged the legal basis of processing incorrectly, which is why citizens saw entries for civil-status document requests and driving-licence issue in the data-access history of the EVO app ("
    urls: ["https://egov.md/ro/node/41145"]
  - claim_id: 81f02d837e
