  - claim_id: 8d5686a623
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos reports that a cluster it calls UAT-11473 exploited CVE-2026-20127, the peering authentication bypass in Cisco Catalyst SD-WAN Controller, Manager and Validator (CVSS 10.0, fixed releases since February 2026, no workaround), and then ran the KeyDrift implant inside the controller's control-plane process to collect session metadata and what Talos assesses to be data-plane IPsec keys. Cisco's advisory, revised on 2026-10-28 to link Talos's post, says it is aware of limited exploitation, and Talos assesses with high confidence that the operating infrastructure overlaps considerably with Volt Typhoon's Silent Train network."
  - claim_id: bab90ffdf4
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Cisco Catalyst SD-WAN Controller, Manager and Validator to its first fixed release (20.9.8.2, 20.12.5.3 or 20.12.6.1, 20.15.4.2 or 20.18.2.1; releases earlier than 20.9 must migrate), and until then limit ports 22 and 830 on the control components to known controller and management addresses, because Cisco offers no workaround."
  - claim_id: 2c63e51c78
