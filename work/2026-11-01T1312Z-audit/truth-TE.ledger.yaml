claims:
  - claim_id: 9478e26117
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "headline"
    kind: frontmatter
    text: "Public root exploit for a Linux page-cache write past the Dirty Frag fix; AlmaLinux kernels carry the fix, no CVE yet"
  - claim_id: f94e4a5786
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro's Zero Day Initiative copied public Linux kernel lists on five kernel reports on 2026-10-21 before any fix was merged, and Sysdig ranks ZDI-CAN-33367 as the one to act on: a local privilege escalation through skb_zerocopy() that gets past the Dirty Frag fix, with a public exploit that TuxCare reproduced as root on AlmaLinux 8 to 10, CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04. A reviewed patch is in the kernel's networking tree but not in mainline, AlmaLinux announced on 2026-10-28 that fixed kernels are in production for 8, 9 and 10, none of the six reports has a CVE, and two ksmbd reports that ZDI scores CVSS 9.0 matter only where the in-kernel SMB server runs; no exploitation in the wild is reported."
  - claim_id: 9574bdc0d0
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "actions[0]"
    kind: frontmatter
    text: "On every AlmaLinux host where untrusted users or workloads run code, install kernel-4.18.0-553.178.1.el8_10, kernel-5.14.0-687.60.1.el9_8 or kernel-6.12.0-211.69.1.el10_2 or later and reboot, or apply TuxCare's KernelCare patch on EL9 and EL10."
  - claim_id: 884c445db7
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "On 2026-10-21 Trend Micro's Zero Day Initiative sent five Linux kernel reports and copied public mailing lists on every one, several with no fix in any released kernel; none of the six reports, the five kernel ones and a ConnMan report, has a CVE ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: fbeaabd1ad
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33367 matters most: skb_zerocopy() moves shared page-cache pages into a new socket buffer without the marker the Dirty Frag fix added, so IPsec ESP decrypts in place and an unprivileged local user writes attacker bytes into the cached copy of a read-only file, which gives root through a setuid binary or /etc/passwd; the public exploit needs unprivileged user namespaces and networking modules such as nlmon and act_pedit ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 5f430738ec
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "TuxCare reproduced a root shell on AlmaLinux 8 to 10 (Dirty Frag fix installed), CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04 (AppArmor user-namespace restriction bypassed) ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 978d35d469
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "A reviewed patch from the netdev list is now in the kernel's networking tree but not in mainline, and a kernel with only the fix for CVE-2026-90049, a bug in the same function, is not covered ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", "https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/"]
