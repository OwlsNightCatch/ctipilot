    kind: cited
    text: "Siemens lists RUGGEDCOM APE1808 application-hosting devices running Palo Alto Networks PAN-OS 10.2, 11.1, 11.2, 12.1 and 12.2 as affected by the two flaws and gives patch and update information only through customer support ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-566512.html"]
  - claim_id: 82f6b1c14b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-25T03:38:42Z"
    kind: cited
    text: "ReliaQuest says it independently reproduced exploitation of CVE-2026-109618 in controlled labs, with code execution only where the exploit's prerequisites were already present, and that it has not observed successful exploitation in customer environments ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/"]
  - claim_id: 4ba8112d99
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-25T03:38:42Z"
    kind: cited
    text: "The sequence it saw in its logs is a POST that returns HTTP 500, PHP memory exhaustion reported \"in Unknown on line 0\", heap corruption and an abort of the Apache worker that handled the request within seconds, which it reads as a stronger indication when the events involve the same process ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/"]
  - claim_id: 9ca1b4066e
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-26T03:39:39Z"
    kind: cited
    text: "Its brief now says that what its researchers saw was an attack against a European government agency executed in the context of a vulnerable PHP application, that this led them to believe it was exploitation of these flaws, and that it is unable to confirm that the initial access is associated with the specific PHP2Shell CVEs ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
