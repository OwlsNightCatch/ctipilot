    surface: "section 2026-10-26T03:39:39Z"
    kind: cited
    text: "The Hacker News article of 2026-10-25 relays the retracted account and carries no correction ("
    urls: ["https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html"]
  - claim_id: 6641cda581
