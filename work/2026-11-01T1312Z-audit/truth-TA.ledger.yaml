    entry: 2026-10-28/cisco-php2shell-expressway-urwb-duo-access-gateway-fixes
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory cisco-sa-php-october26-Jj384Daq, final at version 1.10 on 2026-10-30, lists Expressway Series and Expressway Select Series (fixed release 15.5.21, workaround in the bug record), Ultra-Reliable Wireless Backhaul and Unified Industrial Wireless Software (fixed release 26.2.1.9, listed for November 2026, workaround in the bug record), Duo Access Gateway (3.2.0) and ISE Portal Builder (fix deployed, no customer action required) as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619. Cisco knows of no malicious use against a Cisco product, although CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
