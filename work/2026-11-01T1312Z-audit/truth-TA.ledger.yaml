claims:
  - claim_id: 0ba933c2f6
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "headline"
    kind: frontmatter
    text: "PHP2Shell: CISA lists both flaws as exploited after honeypot code execution; update the runtime, not the CMS"
  - claim_id: e185d1ed08
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php, with no upstream release for PHP 8.1 and older and a third path, CVE-2026-115560, left unfixed (keep session.upload_progress.enabled=0). CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after a honeypot operator documented 35 successful code executions on PHP 8.4.26 under single-worker mod_php and VulnCheck extended its working exploit across builds of PHP 8.2 to 8.5; GreyNoise's sensors have recorded shell sessions since 2026-10-28, Palo Alto Networks' advisory now reports active exploitation against internet-exposed PAN-OS management interfaces, Dream Research recovered a custom build chained with the Linux kernel flaw CVE-2026-46300 that rooted 25 Palo Alto Networks PAN-OS firewall and management servers and attacked a US government-affiliated network, SRF links a data theft at TCS Camping's booking-system supplier to the flaws without naming a CVE, and Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to them. As of 2026-10-22 BACS knew of no attack in Switzerland but said federal PHP applications were affected and that it had no complete overview of the update status, and Swiss cantons, universities, Cyon, the Lodur platform and Publica took sites offline as a precaution."
  - claim_id: 741412c726
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "immediate_action"
    kind: frontmatter
    text: "Update the PHP runtime on every internet-facing host today: Two unauthenticated remote-code-execution flaws in PHP itself are on CISA's exploited list since 2026-10-26, honeypots recorded working code execution and Palo Alto reports attacks on internet-exposed PAN-OS management interfaces, fixed builds (8.5.12, 8.4.27, 8.3.36, 8.2.35) have been out since 2026-10-21, and public proofs of concept circulate. Update PHP, not the CMS, on every internet-facing server and container image, restart PHP-FPM, Apache and all long-running workers, and confirm the running version, because distribution packages can keep the old version string. Isolate anything that cannot be updated from public networks, and check web roots, logs, crashes and unexpected processes, since an update does not remove an attacker who is already in."
  - claim_id: ecd645e617
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
  - claim_id: 3dcdf4e309
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[1]"
    kind: frontmatter
    text: "After updating, set session.upload_progress.enabled=0 on every PHP host and keep it there until PHP's next regular bugfix release: CVE-2026-115560, which the October releases do not fix, needs session upload progress to be enabled."
  - claim_id: d38fde7800
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[2]"
    kind: frontmatter
    text: "List every appliance and management server whose web interface embeds PHP (firewalls, network access control and security consoles), take each interface off the internet and install its vendor's PHP2Shell fix, because Dream Research reports Palo Alto Networks PAN-OS firewalls rooted through an exposed management interface."
