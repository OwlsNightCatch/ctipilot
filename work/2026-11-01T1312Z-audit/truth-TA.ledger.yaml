    surface: "section 2026-10-26T03:39:39Z"
    kind: uncited
    text: "Palo Alto Networks' Unit 42 retracted on 2026-10-25 the update of 2026-10-23 in which it had reported post-exploitation by agentic attack platforms at a European government entity."
  - claim_id: f555d1472f
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-26T03:39:39Z"
    kind: uncited
    text: "The observations of the retracted update, including the command-batch markers and the Active Directory activity, are no longer part of the brief."
  - claim_id: cb735fa230
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-26T03:39:39Z"
    kind: uncited
    text: "What remains documented is scanning and attack attempts, reported by Cloudflare, watchTowr, VulnCheck and others, and VulnCheck's working exploit for specific PHP builds; CrowdStrike, Sophos and Wordfence report no successful exploitation, and no source tied a named CVE to a production compromise."
  - claim_id: d45bfa986a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: cited
    text: "CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26 and updated its alert the same day, which still tells operators to patch internet-facing systems first, to take PHP-based systems offline where they cannot be patched or run PHP 8.1 or earlier, and to monitor for PHP worker processes launching shells or downloading tools ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 042abb8efd
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: cited
    text: "The listing follows a honeypot report by Adel Karimi of Perplexity dated 2026-10-24, relayed by SecurityWeek and BleepingComputer on 2026-10-26, that documents the first successful code execution: 35 execution-stage requests against three honeypots running PHP 8.4.26 under single-worker mod_php, each followed by a shell started directly by an Apache worker, consistent with CVE-2026-109618 and not establishing a separate CVE-2026-109619 path ("
    urls: ["https://github.com/0x4D31/honeypot-data/blob/main/reports/php2shell/2026-10-24-confirmed-rce.md", "https://www.securityweek.com/php2shell-exploitation-moves-from-probes-to-working-shells/", "https://www.bleepingcomputer.com/news/security/php2shell-security-flaws-now-sucessfully-exploited-in-the-wild/"]
  - claim_id: fe06e6a55c
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: cited
    text: "Expel's Marcus Hutchins calls it by far the highest-quality confirmation of in-the-wild exploitation he has seen ("
    urls: ["https://www.bleepingcomputer.com/news/security/php2shell-security-flaws-now-sucessfully-exploited-in-the-wild/"]
  - claim_id: f79b09b292
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: cited
    text: "VulnCheck's page, updated as of 2026-10-26, extends its working exploit to mod_php on PHP 8.2.28 to 8.2.34 and 8.3.22 to 8.3.35 as well as 8.4.10 to 8.4.26 and 8.5.10 to 8.5.11 ("
    urls: ["https://www.vulncheck.com/blog/php2shell-vulnerabilities"]
  - claim_id: 240c1a5fca
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: cited
    text: "In Switzerland, SRF reports on 2026-10-26 that TCS Camping is warning about 15,000 customers because data was stolen at its booking-system supplier Camping.Care in connection with the PHP flaw: names, telephone numbers and reservation numbers were used in fraudulent WhatsApp messages, and TCS says account and IBAN data were not affected; neither SRF nor TCS names a CVE or the entry point ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping"]
  - claim_id: 8a572f6456
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-27T03:48:15Z"
    kind: uncited
    text: "It is honeypot evidence: no second-stage download was observed, Karimi says it does not measure exploit reliability on other worker counts, PHP builds or applications, and, as of 2026-10-27, no source ties a named CVE to a production compromise; Unit 42's retraction of 2026-10-25 stands."
  - claim_id: 62230143af
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-28T03:41:36Z"
    kind: cited
    text: "Palo Alto Networks' advisory for both flaws now states that active exploitation has been observed targeting the Palo Alto Networks management interface exposed to the internet, and its severity is Critical with urgency Highest ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 669031ce03
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-28T03:41:36Z"
    kind: cited
    text: "A copy of the page taken on 2026-10-27 at 17:10 UTC said instead that very limited exploitation had been observed ("
    urls: ["https://web.archive.org/web/20261027171028/https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: c234445d18
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-28T03:41:36Z"
    kind: cited
    text: "It is a vendor statement about its own product, Unit 42's retraction of 2026-10-25 stands ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 1c1b6c4b2d
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-28T03:41:36Z"
    kind: cited
    text: "), and Palo Alto's remaining PAN-OS hotfixes are due by 2026-10-30 ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 4dff92ef12
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-28T03:41:36Z"
    kind: uncited
    text: "The advisory names no victim, actor or post-exploitation behaviour and does not say which flaw was used."
  - claim_id: 8fe1575884
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "CISA's catalog entry of 2026-10-28 for the Linux kernel flaw CVE-2026-46300 says it can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 328f9221df
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Dream Research reports a chain that takes these flaws to root on appliances: a custom, non-public PHP2Shell build for the management web server of one large vendor's firewall software, which runs PHP 8.0.30 with a high memory limit, gave code execution as the nobody user, and the kernel flaw lifted it to root in one HTTP request in under 15 minutes ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 6ea9efbf1b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Dream found the build tuned to eleven firmware versions, nine exploitable, with offsets from the vendor's own PHP library, the deployment-specific calibration CrowdStrike expects a reliable exploit to need (an inference) ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/"]
  - claim_id: d24dfc8bfc
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "From about 19,000 internet-facing firewalls of that vendor it narrowed to 240, rooted 24 and left a PHP webshell on each, and from the second of two firewalls of a US government-affiliated organization (the first crashed) built a persistent outbound SSH tunnel, rooted the organization's firewall management server through it and began an attack on its Active Directory; Dream could not tell whether that attack succeeded, does not name the vendor, calls the campaign apparently Chinese and AI-assisted and does not attribute it to a named actor ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 12d82217b3
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "The targets were firewalls whose management interfaces were reachable from the internet ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 549deb27a5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Palo Alto Networks' advisory as read on 2026-10-29 lists all PAN-OS hotfixes as released except 11.1.7-h12, due on 2026-10-30 ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 93c50af96a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: cited
    text: "GreyNoise's live tracker, last updated 2026-11-01 03:48 UTC, records successful exploitation on its deliberately vulnerable sensors from 2026-10-28, the first when an Apache worker spawned a shell that ran curl, and counts 1,177 confirmed exploitations from five attacker addresses, defined as sessions in which the web server ran operating-system commands ("
    urls: ["https://php.events.greynoise.io/"]
  - claim_id: 73b136dad3
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: cited
    text: "The commands recorded on 2026-10-29 include bash reverse shells over /dev/tcp, creation of /var/www/.ssh, queries to the cloud metadata address and downloads of the linPEAS and gitleaks enumeration and secret-scanning tools; secret-scanning runs over /var/www/html and system directories appear in the sessions of 2026-10-31 ("
    urls: ["https://php.events.greynoise.io/"]
  - claim_id: bd48f793cc
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: cited
    text: "Hunt.io, reading open-directory captures, says shells have been confirmed only on honeypots and sensors, which it names as watchTowr, 0x4D31 and GreyNoise, and that its shared exploit kit has not been seen landing on a live victim, while relaying Dream Research's and Unit 42's account of PAN-OS firewalls rooted in production as the first confirmed production compromises; in one capture an operator who ran the chain against a national government got only a crash, because session files lay outside the webroot, and then broke in with a different bug ("
    urls: ["https://hunt.io/blog/php2shell-honeypot-shells-root-palo-alto-firewalls"]
  - claim_id: 8c7f2155bf
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: cited
    text: "Dream Research updated its report on 2026-10-29 to say that the affected devices run Palo Alto Networks PAN-OS and that the operation rooted 25 PAN-OS firewall and management servers, and Unit 42 says it independently verified the attacker's tooling and confirmed the reported results ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 4b3fc13d9a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: uncited
    text: "The count is of shell events on sensors, not of compromised servers."
  - claim_id: a7a9af82e0
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: uncited
    text: "The earlier description of \"one unnamed vendor\" above is superseded."
  - claim_id: 9ae8e2267d
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-22T03:45:26Z"
    kind: record-summary
    text: "The fixed releases (PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35) shipped on 2026-10-21, so the earlier no-fix status ends; Cloudflare, watchTowr and VulnCheck report attack traffic and at least one unsuccessful web-shell attempt, proofs of concept are circulating, VulnCheck holds an exploit that succeeds with ASLR enabled and no source reports a confirmed compromise, so priority moves to critical. Swiss cantons, universities, the Lodur fire-brigade platform and Publica took sites offline as a precaution, and BACS, CERT-EU and ENISA tell operators to update the runtime, check embedded installations and look for compromise."
  - claim_id: 11f2d3ff6c
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-23T03:45:21Z"
    kind: record-summary
    text: "BACS says it knows of no attack in Switzerland but that PHP applications of the federal administration were affected and that it has no complete overview of the update status; the host Cyon took more than 100,000 sites offline for hours, a UK minister reports 32 government services unavailable with no confirmed compromise, and AWS reports a first exploit attempt on 2026-10-17. Sansec and Red Hat judge exploitation harder than VulnCheck's exploit suggests, and Palo Alto now schedules PAN-OS hotfixes for 2026-10-26 to 2026-10-30."
  - claim_id: 3b91237eb0
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-24T03:36:31Z"
    kind: record-summary
    text: "Unit 42 reports a confirmed intrusion of a European government entity with agentic post-exploitation, from its own telemetry and without naming the victim or the flaw that gave the foothold, while CrowdStrike, Sophos and Wordfence report no successful exploitation; PHP adds an informational advisory for a third code-execution path, CVE-2026-115560, that the October releases do not fix, and advises session.upload_progress.enabled=0 until its next regular release. VulnCheck's exploit now covers PHP 8.5.10 and 8.5.11 as well as 8.4.10 to 8.4.26, and Cisco, Splunk and Palo Alto Networks revised their product statuses."
  - claim_id: 69bb5cc554
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-25T03:38:42Z"
    kind: record-summary
    text: "Tenable's patch SC-202610.2 updates the PHP bundled in Security Center and Enclave Security to 8.2.35, and Siemens lists RUGGEDCOM APE1808 devices running PAN-OS as affected with patch information only through customer support. ReliaQuest's lab reproduction gives a log sequence for detection (a POST returning HTTP 500, PHP memory exhaustion in Unknown on line 0, heap corruption, an Apache worker abort within seconds) and it has not seen successful exploitation in customer environments."
  - claim_id: 87c38abf9a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-25T14:00:41Z"
    kind: record-summary
    text: "VulnCheck's quoted sentence follows its edited post. Palo Alto's hotfix dates are given as due by 2026-10-30 (the PAN-OS entry carries the detail, including the three builds listed as released in Palo Alto's revision of 2026-10-25), the Publica status page label no longer carries a date, and the headline is cut to 110 characters."
  - claim_id: f160f2d183
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-26T03:39:39Z"
    kind: record-summary
    text: "Palo Alto Networks' Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to these flaws and says it cannot confirm that the initial access is associated with them; the summary, the detection guidance and the 2026-10-24 section no longer carry that account. Priority stays critical: the scanning, attack attempts, public proofs of concept and VulnCheck's working exploit do not rest on the retracted report, and no source ties a confirmed compromise to these flaws."
  - claim_id: e2eab545be
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-27T03:48:15Z"
    kind: record-summary
    text: "CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26 after a honeypot operator documented the first successful code execution (35 shells on three PHP 8.4.26 mod_php targets); no source ties a named CVE to a production compromise. VulnCheck's exploit now also covers PHP 8.2 and 8.3 builds on mod_php, and SRF links a data theft at TCS Camping's booking-system supplier to the PHP flaw; the entry's earlier statements that neither flaw was listed and that no source reported successful exploitation are replaced."
  - claim_id: 37c87d410b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-28T03:41:36Z"
    kind: record-summary
    text: "Palo Alto Networks' advisory for both flaws now says that active exploitation has been observed against its PAN-OS management interface exposed to the internet, after a copy of 2026-10-27 said very limited exploitation; it names no victim or actor, and Unit 42's retraction of 2026-10-25 stands. Priority stays critical."
  - claim_id: eff3d8e0f3
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-29T07:03:00Z"
    kind: record-summary
    text: "Dream Research reports a production chain of a custom PHP2Shell build with the Linux kernel flaw CVE-2026-46300 that gave unauthenticated root on 24 firewalls of one unnamed vendor and led to an attack on the Active Directory of a US government-affiliated organization; CISA's catalog entry for the kernel flaw of 2026-10-28 says the same chaining. The earlier statement that no source ties a named CVE to a production compromise is replaced, an action for appliances that embed PHP is added, the URWB fix date in the vendor list is corrected from March 2027 to November 2026 (advisory version 1.9), and the PAN-OS hotfix status is updated to nineteen of twenty released (advisory of 2026-10-29). Removed from the text: the sentence on the release time, Karimi's two-source-address-clusters and PHPSESSID remarks in the main text (the 2026-10-27 section keeps his reliability caveat), VulnCheck's failed web-shell attempt in the main text (the Detection line keeps it), the lab log-path remark and most of Sansec's note on its CVE attribution (kept as a short clause); the 'no source ties a named CVE' statement of 2026-10-27 is dated, and the evidence record for Karimi's clusters remark is dropped."
  - claim_id: bbe5cfacd4
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-11-01T04:10:00Z"
    kind: record-summary
    text: "GreyNoise's live tracker records successful exploitation on its deliberately vulnerable sensors from 2026-10-28, with reverse shells, a .ssh directory under /var/www, cloud-metadata queries and secret-scanning tools in the sessions of 2026-10-29 and 2026-10-31; Hunt.io reports that an operator's attempt against a national government failed because session files lay outside the webroot, and relays that PAN-OS firewalls were rooted in production. Dream Research's updated report names Palo Alto Networks PAN-OS as the product behind the chain first described with an unnamed vendor, which Unit 42 says it verified."
  - claim_id: 089e6aa2f4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "headline"
    kind: frontmatter
    text: "PAN-OS management interfaces were rooted in the wild via PHP2Shell and a kernel flaw: hotfix, then check for compromise"
  - claim_id: 7f7fd5a5b3
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21 says active exploitation has been observed against PAN-OS management interfaces exposed to the internet, and Dream Research, with Unit 42's verification, reports a custom PHP2Shell build chained with a Linux kernel flaw that rooted 25 PAN-OS firewall and management servers in the United States, Japan, Taiwan and South Korea and went on to attack a US government-affiliated Active Directory. The advisory lists every release below the hotfix for its train, of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama, as affected through the management web interface by CVE-2026-109618 and CVE-2026-109619 (CVSS-B 9.2); all twenty hotfixes are released, and GlobalProtect and the captive portal are not affected. A device that was exposed and unpatched needs a compromise check as well as the hotfix, and CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
  - claim_id: ae47c44e6d
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[0]"
    kind: frontmatter
    text: "Take the management interface of every PA-Series and VM-Series firewall and Panorama off the internet now by restricting it to a jump box or trusted internal addresses, because Palo Alto reports active exploitation against internet-exposed management interfaces, and install the hotfix for your maintenance release, which Palo Alto's table lists for every line from 10.2.7 to 12.2.4 (11.2.10-h17 adds the Brotli fix)."
  - claim_id: 3a346a84b1
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[1]"
    kind: frontmatter
    text: "Rotate the directory bind account, HA replication keys, certificate private keys and device authentication keys of every PAN-OS firewall and Panorama that was reachable from the internet while unpatched and shows a PHP web shell or a tunnel, because the chain Dream Research recovered harvested exactly those from rooted firewalls, and the hotfix does not remove a web shell or tunnel already in place."
