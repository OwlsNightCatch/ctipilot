    surface: "body"
    kind: cited
    text: "), and CrowdStrike, Wordfence and Sophos reported no successful exploitation ("
    urls: ["https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/", "https://www.wordfence.com/blog/2026/10/attacks-on-php2shell-continue-but-no-known-compromises-as-a-result-yet/", "https://www.sophos.com/en-us/blog/proof-of-concept-exploit-released-for-php-vulnerabilities-109618-109619"]
  - claim_id: 1db5576450
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Dream Research describes the chain it recovered: a custom PHP2Shell build tailored to the management web server of Palo Alto Networks PAN-OS (PHP 8.0.30), combined with the Linux kernel flaw CVE-2026-46300, gave unauthenticated root on 24 internet-facing firewalls and led, through the second of two firewalls of a US government-affiliated organization (the first crashed), to an outbound SSH tunnel, the rooting of the organization's firewall management server and a password-spraying attack on its Active Directory, and CISA's entry for the kernel flaw says the same chaining ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 3507d31a6a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "In Switzerland, SRF reported on 2026-10-26 that TCS Camping is warning about 15,000 customers in connection with the PHP flaw after a data theft at its booking-system supplier Camping.Care, and Blick, citing SRF, writes that the attackers used the two flaws; neither names a CVE ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping", "https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"]
  - claim_id: 57703dc293
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "PHP posted an informational advisory on 2026-10-23 for a third code-execution path, CVE-2026-115560, that the October releases do not fix: it needs an application that sets session.serialize_handler to php_binary or php_serialize, switches it to php with ini_set() before session_start(), and leaves session upload progress enabled; PHP calls it an unlikely vector, issues no emergency release, suggests session.upload_progress.enabled=0 until the next regular bugfix release and will publish the full advisory then ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-23-1"]
  - claim_id: 8e3c63971a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "PHP has not stated affected versions or a severity score for CVE-2026-115560, and no exploitation is reported ("
    urls: ["https://thehackernews.com/2026/10/urgent-php-warns-of-another-unpatched.html"]
  - claim_id: e9ef6009db
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Sansec says an attack needs specific knowledge of the target server and specific conditions on it, that nobody has shown a single request that works against any vulnerable server, as there was for Log4Shell and Shellshock, that a researcher who tested the public proofs of concept found they do not work against a default PHP installation, and that mass exploitation is therefore less likely than it first expected, while it advises updating anyway ("
    urls: ["https://sansec.io/research/php2shell"]
  - claim_id: e487aa83ca
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CrowdStrike expects no single universal exploit but says a reliable one is feasible against a specific deployment profile, such as a fixed Docker image, because an attacker can calibrate offsets and heap grooming in advance ("
    urls: ["https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/"]
  - claim_id: 5527e4b057
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and the SANS Internet Storm Center, reading the public proofs of concept, finds a universal, reliable one-click exploit quite difficult ("
    urls: ["https://isc.sans.edu/diary/33452"]
  - claim_id: 689d6bdce5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Red Hat rates CVE-2026-109618 Important (CVSS 3.1 8.1 with high attack complexity, against 9.8 at NVD), says reliable exploitation requires precise heap manipulation and timing, and says its standard Red Hat Enterprise Linux deployments use PHP-FPM, whose workers exit on early initialization failures, so code execution is difficult in practice and typically needs non-default behavior such as parsing a second request body during script execution ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-109618"]
