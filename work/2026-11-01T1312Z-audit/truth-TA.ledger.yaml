    text: "Tenable's Security Center (versions 6.6.0, 6.7.2, 6.8.0 and 6.9.1) and Enclave Security (1.7.0, 1.8.0 and 1.9.1) bundle PHP, and patch SC-202610.2 updates the bundled PHP to 8.2.35 ("
