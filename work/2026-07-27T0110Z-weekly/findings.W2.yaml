items:
  - title: "ENISA opens public consultation on the EU Managed Security Services (EUMSS) certification scheme, the certification prerequisite for the EU Cybersecurity Reserve"
    sources:
      - { url: "https://www.enisa.europa.eu/news/have-your-say-on-the-certification-of-eu-managed-security-services", publisher: "ENISA", date: "2026-07-24", role: "primary" }
      - { url: "https://certification.enisa.europa.eu/browse-topic/eumss_en", publisher: "ENISA (EU Cybersecurity Certification portal)", date: "2026-07-24", role: "primary" }
      - { url: "https://www.enisa.europa.eu/topics/eu-incident-response-and-cyber-crisis-management/eu-cybersecurity-reserve", publisher: "ENISA", date: "2026-07-24", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"ENISA EUMSS Managed Security Services certification public consultation\") -> primary: ENISA news release, URL https://www.enisa.europa.eu/news/have-your-say-on-the-certification-of-eu-managed-security-services -> pivot: ENISA certification portal topic page, URL https://certification.enisa.europa.eu/browse-topic/eumss_en -> corroborating: ENISA EU Cybersecurity Reserve topic page, URL https://www.enisa.europa.eu/topics/eu-incident-response-and-cyber-crisis-management/eu-cybersecurity-reserve"
    summary: |
      ENISA published (2026-07-24) a public consultation on the draft candidate certification scheme for EU Managed
      Security Services (EUMSS) under the Cybersecurity Act, developed by an Ad Hoc Working Group that kicked off
      in October 2025 following a Commission request of 25 April 2025 and a January 2025 amendment to the
      Cybersecurity Act extending certification scope to "incident response, penetration testing, security audits
      and consultancy". The draft scheme uses a layered structure: horizontal baseline requirements (secure design,
      deployment, business continuity, operational service management) applying to every certified service, plus
      vertical service-profile requirements — the current draft version scopes only the "Incident Management
      Lifecycle" vertical, specifically the "Incident Response" service profile. Three assurance levels (basic,
      substantial, high) are defined. The consultation runs until 2026-09-13 via the EU Survey portal. The scheme
      matters operationally beyond a standards exercise: providers delivering services under the EU Cybersecurity
      Reserve — the Union-level pool of vetted MSSPs that EU Member States and their crisis-management authorities
      can call on for major-incident response and recovery support, currently populated via a separate ownership-
      control vetting process — will be required to hold EUMSS certification within two years of the scheme's
      adoption. For Swiss and European public-sector procurement teams and CISOs contracting incident-response
      retainers or SOC/MDR services from EU-based providers, this is the first concrete signal of what a
      harmonised EU baseline for "trusted" managed security services will require; MSSPs serving EU-institution or
      cross-border clients should track the baseline/vertical requirement split now, since the Incident Response
      profile is the one currently open for comment.
    region_nexus: "EU-wide (Cybersecurity Act instrument); indirect for Switzerland via EU-based MSSP/incident-response suppliers serving Swiss public-sector and CI clients"
    primary_sector_nexus: "indirect — public-sector procurement and CI-operator dependence on certified incident-response/MSS providers"
    sector: "public-sector, cross-sector (all critical-infrastructure verticals via managed-security-service supply chains)"
