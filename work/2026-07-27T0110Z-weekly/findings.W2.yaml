      - quote: "Das bisherige Nebeneinander im digitalen Schutz unseres Staates können wir uns nicht mehr leisten"
        attribution: "Karsten Wildberger, Federal Minister for Digital Affairs and State Modernisation (BMDS), quoted via move-online.de"
        source_url: "https://www.move-online.de/k21-meldungen/bundesverwaltung-stellt-cyber-schutz-neu-auf/"
    extended_notes: |
      English gloss of the three German quotes above: (1) "All departments and supreme federal authorities are
      henceforth to use uniform and best-possible security standards for their IT"; (2) "Strategic direction is
      exercised through a steering committee chaired by the Federal Ministry for Digital Affairs and State
      Modernisation"; (3) "We can no longer afford the previous side-by-side approach to the digital protection of
      our state" (Minister Wildberger). This is a national (German) federal-administration governance reform, not
      an EU-level legal instrument — included here under the domain's "neighbouring national authorities" /
      governance-model watch rather than as a formal NIS2/DORA/CRA transposition milestone. Distinct from, and not
      a duplicate of, the W29 KRITIS-Dachgesetz CER-registration item (a different law, a different subject —
      physical/operational resilience of external critical-infrastructure operators, vs. CyberGovSecure's internal
      federal-administration IT-security governance).
    borderline: true
    borderline_reason: "German domestic federal-administration governance reform rather than a Swiss obligation or an EU-level legal instrument; carried for its transferable governance-model value to Swiss federal/cantonal administration, not because it changes any Swiss or EU-wide compliance obligation."

