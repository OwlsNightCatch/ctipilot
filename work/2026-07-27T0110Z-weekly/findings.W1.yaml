      This is a genuine independent second-vendor analysis (Trend Micro, not Sysdig) of the already-tracked JadePuffer cluster, adding new detection-relevant framing (no-file-hash / behaviour-only detection requirement; adaptive path abandonment) not present in the original Sysdig disclosure or the 2026-07-21 ENCFORGE update. Status re-check verdict for actor:jadepuffer this week: fresh delta = this analytical corroboration; no new victim or new malware variant beyond ENCFORGE (already covered).

