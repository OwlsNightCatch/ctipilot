  - title: "Google GTIG unifies Mandiant + TAG threat-actor naming into a single cryptonym system — Sandworm becomes SANDWORM RELIC"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/", publisher: "Google Threat Intelligence Group (GTIG)", date: "2026-07-24", role: "primary" }
      - { url: "https://gbhackers.com/google-launches-unified-cryptonym-based-naming-system/", publisher: "GBHackers", date: "2026-07-25", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Sandworm APT44 new report July 2026\") → pivot: WebSearch (\"Updated Cyber Threat Actor Naming System Google GTIG\") → primary: Google Cloud Blog (GTIG), URL https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/ → corroboration/detail: GBHackers, URL https://gbhackers.com/google-launches-unified-cryptonym-based-naming-system/"
    summary: |
      Google Threat Intelligence Group (GTIG) published (2026-07-24) a unified, two-word cryptonym naming schema replacing the separate tracking conventions Mandiant and Google's Threat Analysis Group (TAG) maintained independently before their 2025 merger into GTIG. The first word is a memorable actor-specific identifier (preserving a name already used in public reporting where one exists, or a randomly generated, analyst-vetted term for a newly identified cluster); the second word encodes nation-state/motivation category: CASTLE (People's Republic of China), ION (Iran), NEPTUNE (North Korea), RELIC (Russia), COMET (cybercriminal). GTIG is initially applying the new cryptonyms to "several dozen" of the most active groups, with legacy identifiers (UNC####, APT##, TEMP.###) remaining indexed and searchable in the Google Threat Intelligence platform alongside MITRE ATT&CK mappings and other vendors' aliases. The concretely disclosed rename directly touching this brief's tracked entities: the Russian GRU-linked actor long tracked as APT44/Sandworm is now designated SANDWORM RELIC by Google — the identifier itself is unchanged, the suffix newly signals the assessed Russian state affiliation. Sandworm/UAC-0145's own operational activity this week (CERT-UA's 2026-07-20 ClickFix/EtherHiding/Android-backdoor report, already covered) is unaffected technically; this item is a taxonomy/attribution-infrastructure change defenders should fold into search queries, detection-rule documentation and threat-actor-alias mapping tables, since GTI-integrated feeds, dashboards and alerts will begin surfacing the new cryptonyms alongside (not instead of) legacy names.
    region_nexus: "global; affects all defenders using Google Threat Intelligence-integrated feeds, including CH/EU public-sector and CI SOCs"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, telco, finance, healthcare"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["actor:sandworm"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Threat tracking shouldn't be an exercise in memorization, but rather one of intuition."
        attribution: "Google Threat Intelligence Group (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
      - quote: "The first word is a unique and memorable term chosen to represent the specific actor, particularly names that may have been used in prior public reporting. If no previously used term exists, this word is randomly generated to remove bias, then vetted by our analysts."
        attribution: "Google Threat Intelligence Group (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
