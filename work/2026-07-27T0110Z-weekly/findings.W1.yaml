        attribution: "SentinelLabs (Tom Hegel)"
        source_url: "https://www.sentinelone.com/labs/iran-war-cyber-threat-landscape-a-midyear-assessment-on-what-matters/"
    extended_notes: |
      Single-source (one lab's analytic assessment); flagged SINGLE-SOURCE-OTHER per verification policy since SentinelLabs is not on the national-CERT carve-out list. Confidence held at MEDIUM because the AI-assisted-wiper attribution and the grid-down confidence downgrade are the analyst's own assessed judgment calls, not independently corroborated by a second telemetry-holding source in this run. Status re-check for actor:cyberav3ngers this week: no new PLC-intrusion delta beyond the already-covered 2026-07-24 AA26-097A Schneider/Siemens expansion; this SentinelLabs piece adds analytic context (mission-set classification) rather than new technical detail on CyberAv3ngers specifically. No in-window delta found for actor:oilrig / actor:cavern-manticore beyond the already-covered 2026-07-22 Kaspersky DNS-AAAA-fallback corroboration.

  - title: "Cross-cluster synthesis: this week's espionage and ransomware tooling converged on trusted-service C2 channels and AI-toolchain supply-chain poisoning as the shared evasion primitive"
    sources:
      - { url: "https://www.group-ib.com/blog/hollowgraph-microsoft-365/", publisher: "Group-IB", date: "2026-07-20", role: "primary" }
      - { url: "https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/", publisher: "Cisco Talos", date: "2026-07-23", role: "primary" }
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1", publisher: "Zscaler ThreatLabz", date: "2026-07-20", role: "primary" }
      - { url: "https://www.crowdstrike.com/en-us/blog/denying-the-worm-sandworm-mode-and-ai-toolchain-supply-chain-attacks/", publisher: "CrowdStrike", date: "2026-07-21", role: "primary" }
    discovery_trace: "synthesis of independently-fetched primaries already tracked as separate operational entries this week; first seen at: prior_coverage.json entries 2026-07-21/hollowgraph-m365-calendar-graph-api-c2-cavern, 2026-07-22/cavern-cav3rn-oilrig-attribution-dns-aaaa-c2-fallback, 2026-07-24/msarat-chaos-cdp-webrtc-covert-c2, 2026-07-23/sandworm-mode-npm-ai-toolchain-supply-chain-worm-mcp, 2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage → re-fetched and re-verified in this run at each primary URL above (plus https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1 for TELESHIM, already covered operationally)."
    summary: |
      Four independently-reported tools this week (2026-07-20 to 2026-07-26) converge on one defender-relevant pattern: process-to-network attribution is being deliberately defeated by routing command-and-control through a trusted, already-whitelisted service or protocol rather than attacker-owned infrastructure, and one supply-chain worm applies the same "blend into legitimate telemetry" principle to a CI/CD credential-theft chain rather than C2. Group-IB's HOLLOWGRAPH (Iran-nexus, linked to the Cavern C2 framework and — per Kaspersky's follow-on, low-confidence — OilRig) plants tasking as attachments on far-future Microsoft 365 calendar events and reads/writes it via the Microsoft Graph API, so the malware's "C2 traffic" is indistinguishable from a legitimate Graph API session against the victim's own tenant; when Graph auth fails, a DNS AAAA-record fallback recovers replacement Entra credentials. Cisco Talos's msaRAT (Chaos ransomware) goes further: the malware process itself never opens a socket at all — it drives a headless Chrome/Edge instance over the Chrome DevTools Protocol and tunnels the actual C2 over a WebRTC DataChannel relayed through Cloudflare Workers and a Twilio TURN server, so endpoint detection keyed on "which process opened the connection" sees only the browser. Zscaler's TELESHIM/MIXEDKEY/BINDCLOAK toolkit (East-Asia-nexus, government-targeted) persists via scheduled tasks and resolves C2 through the Telegram Bot API, so its traffic pattern-matches a mainstream consumer-messaging service, while its final-stage implant decrypts only with a key derived from the victim machine's own volume serial number to defeat sandbox/analyst detonation. And CrowdStrike's SANDWORM_MODE — a February-2026 Socket.dev-discovered npm worm CrowdStrike published defensive detection research on this week — applies the identical "hide in legitimate telemetry" principle to developer tooling: it plants rogue Model Context Protocol tool-provider entries into AI coding-assistant configs (Cursor, VS Code, Claude Desktop, Windsurf) and injects global git-template hooks, so its credential-harvesting actions are indistinguishable from ordinary developer/CI activity — CrowdStrike notes only 2 of 14 investigated behaviours met the bar for high-fidelity alerting. The shared defender lesson across all four: signature- and process-identity-based detection is structurally blind to this pattern, and the viable control is anomaly detection on the trusted channel itself (unusual Graph API calendar-write volume/timing, headless-browser CDP sessions from non-browser-owning processes, Telegram Bot API traffic from enterprise endpoints, unexpected MCP tool-provider entries or git hook modifications) rather than blocking the carrier service outright, since Microsoft 365, Chrome, Telegram and AI coding assistants are core productivity tooling that cannot simply be denied.
    region_nexus: "direct for the Microsoft 365 Graph-API-calendar-C2 technique (any CH/EU M365-tenant public-sector or CI estate is the transferable exposure); global for the AI-toolchain and browser-CDP techniques"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology, finance"
    cves: []
    techniques: ["T1102", "T1071.004", "T1195.002", "T1554", "T1090"]
    affected_products: ["Microsoft 365", "Microsoft Graph API", "Google Chrome", "Microsoft Edge", "npm"]
    entity_keys: ["tool:cavern-c2-framework", "actor:cavern-manticore", "actor:oilrig", "actor:chaos-ransomware", "malware:msarat", "malware:sandworm-mode"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Group-IB uncovers HOLLOWGRAPH, a Windows malware that abuses Microsoft Graph API to exfiltrate files and receive commands from the attacker using Microsoft 365 calendar events, and DNS tunneling to refresh credentials used in C2 communication."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/hollowgraph-microsoft-365/"
      - quote: "The Chaos ransomware group uses new malware \"msaRAT\" that hijacks browsers. The malware doesn't communicate directly with C2 but connects through the browser. It enables arbitrary command execution while hiding the attacker's IP from victims via WebRTC over TURN."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/"
      - quote: "In February 2026, Socket.dev published research on a multi-stage npm supply chain worm operating under the internal flag SANDWORM_MODE. The campaign spanned 19 malicious packages in total across two unique publisher aliases and demonstrated a new class of supply chain attacks that targeted AI-augmented development workflows."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/denying-the-worm-sandworm-mode-and-ai-toolchain-supply-chain-attacks/"
    extended_notes: |
      This is a cross-cluster pattern-recognition synthesis drawing on four already-published W30 operational entries (HollowGraph/Cavern 07-21 & 07-22, msaRAT/Chaos 07-24, SANDWORM_MODE 07-23) plus one already-covered TELESHIM entry (07-26) — all four/five primary URLs were independently re-fetched and verified live in this run (see url-liveness.tsv) rather than merely re-cited from the prior-coverage summaries. Intended as a weekly-research-section candidate analogous to the W29 "state-nexus EDR-blinding tradecraft" and "identity trust-relationship abuse" syntheses; the main agent should treat the four/five referenced operational entries as the detailed technical record and this item as the pattern-level framing layer. Note the malware:sandworm-mode entity is unrelated to actor:sandworm (the GRU actor) despite the name collision — CrowdStrike's internal flag name is coincidental, not an attribution claim; this distinction should be preserved in composition to avoid conflating the two entities.

