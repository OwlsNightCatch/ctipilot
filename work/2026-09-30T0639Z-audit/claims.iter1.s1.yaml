    surface: "body"
    kind: uncited
    text: "The Hermes tool now appears in four unrelated intrusions — this financially motivated campaign and the three above — each independently reaching for the same permissive, open-source agent framework and each disabling its safety rails before use."
  - claim_id: 11b39b56af
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "That convergence, not any single victim in this campaign, is the transferable signal for a defender: an increasingly capable, freely available agent orchestration layer is now common tooling across financially motivated operators and government-targeting intrusions alike, regardless of how firmly any of them is ultimately attributed, and the underlying attack chain here — SQL injection, insecure OTP storage, unrestricted file upload, `sudo` misconfiguration, an over-permissive NFS export, and cloud-secrets exposure — is entirely composed of defects a Tier 2/3 team already reviews for in any custom-coded web application, Swiss public-sector portals included."
  - claim_id: 7d999acceb
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** none of the individual flaws in this chain are novel; what changed is that an unattended, cheap AI agent can now find and chain them without an operator watching."
  - claim_id: f887eddbb0
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: derived
    text: "A web-application security review that checks each of these six defect classes — injectable authentication parameters, plaintext OTP storage, unrestricted file upload, `sudo` NOPASSWD entries, NFS exports without root-squash, and cloud-secrets scope — closes the same door this campaign walked through, regardless of who or what is doing the walking."
