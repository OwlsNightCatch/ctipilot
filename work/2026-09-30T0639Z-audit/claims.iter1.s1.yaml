    text: "Separately, Japanese authorities disclosed \"for the first time in Japan\" a dismantled \"laptop farm\" — a facility where an enabler physically hosted employer-issued laptops and remotely operated them on North Korean workers' behalf — moving \"several hundred million\" yen in cryptocurrency abroad ("
