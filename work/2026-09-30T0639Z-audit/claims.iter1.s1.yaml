    surface: "body"
    kind: uncited
    text: "The operator had added a custom skill that strips Hermes's own content-safety filters, and drove the campaign through only 1,951 short, largely Chinese-language operator prompts across 260 sessions — most of the actual attack work ran autonomously between those prompts."
  - claim_id: 0c145f1aa2
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "One fully documented Cairn project illustrates the chain, though Gambit is explicit that each victim's actual path was chosen dynamically through real-time probing and most chains differed victim to victim: unauthenticated SQL injection in a login email parameter (error-based EXTRACTVALUE) read a one-time-passcode value in plaintext directly from an application database table, bypassing multi-factor authentication and reaching the admin panel; an image-upload field with no extension check then gave host remote code execution as a non-root user; a `sudo` misconfiguration allowing NOPASSWD execution of `python3.12` escalated that to root; an internal NFS mount configured with `no_root_squash` let the agent read a separate host's WordPress database credentials in plaintext from its `wp-config.php`; those credentials gave a direct database write creating a new WordPress administrator account, which in turn let the agent upload a malicious plugin for code execution on the blog host; from there the agent dumped the full contents of the account's AWS Secrets Manager (46 secrets, 102 KB), reached the production Magento database on Amazon Aurora, extracted the Magento application's encryption key, and used it to decrypt stored card numbers encrypted with Blowfish in ECB mode."
  - claim_id: 3e723df19f
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Confirmed impact across the campaign: 600,000-plus unexpired credit-card records exfiltrated from two victims, live checkout-page skimmer scripts confirmed on 19 of 27 named victims (100-plus further sites found via a shared skimmer signature), and partial-to-full compromise reaching a Fortune 500 hospitality company, a major US airline, a large US industrial-supplies distributor and a US online fashion retailer — named separately by Gambit as categories of accessed victims, not as the source of the illustrative chain above."
  - claim_id: bf6d75a73f
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit documents eight distinct skimmer-injection methods used across victims, all worth carrying into any custom-web-application hardening review: appending the loader to the end of a legitimate, already-served JavaScript file while restoring its original modification timestamp; inserting a foreign `<script>` tag directly into the checkout page; hiding the loader inside a site's Google global-site-tag (`gtag.js`) block, between the real `gtag('js', ...)` and `gtag('config', ...)` calls, padded with roughly a hundred tab characters to push it past the right edge of a typical code-review view; using a discovered AWS access key to write the loader into the storage bucket behind the retailer's own CDN, so it loads from that trusted CDN host rather than a third-party domain; injecting the loader into a database content field (such as a product-description column) via the admin panel and relocating it to a file on the victim's own domain; adding it as a Kubernetes `initContainer` in a production front-end deployment manifest; writing it directly into a server-side page-cache entry for the checkout page, so the served HTML differs from the page's own template; and a self-healing cron job placed in a JBoss log directory that checks the injected file's size every two minutes and re-appends the loader whenever a redeploy reverts it."
  - claim_id: 84509c070b
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Some targets were not discovered by the agents at all: Gambit's operator handed at least two victims to Hermes already holding a compromised admin password obtained elsewhere, with the instruction to proceed directly to the objective."
  - claim_id: 72781bef06
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Detection concept, telemetry class first: in web-server access logs, alert on SQL-error-pattern responses (`EXTRACTVALUE` or equivalent) to login-form parameters, and on image-upload requests whose stored file is later executed by the web server rather than served as static content; in host telemetry, alert on `sudo` invocations of an interpreter (`python3.12` or similar) by a low-privilege account with no corresponding change-management record; in network/mount telemetry, flag any host mounting an NFS export it has not mounted before, particularly where the export allows root-equivalent access; in cloud-audit telemetry, alert on a single principal enumerating or reading the entire contents of an AWS Secrets Manager instance in a short window; and in file-integrity or CDN-origin monitoring, treat any modification to a served JavaScript file's content (even with its timestamp preserved) or any script tag added to a checkout page outside a deployment window as high-priority."
