    text: "The victim is then persuaded to download and open a file disguised as a legitimate application — observed lures include Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass — or as MRI scan results; a decoy screen matching the lure's theme displays while the core malware installs in the background."
