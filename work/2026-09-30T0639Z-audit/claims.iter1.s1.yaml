    surface: "body"
    kind: uncited
    text: "Gambit Security's Threat Intelligence team recovered a financially motivated operator's exposed staging server and reconstructed a campaign, running since July 2026, in which three off-the-shelf open-source AI agent harnesses conduct nearly the entire intrusion lifecycle unattended against online retailers."
  - claim_id: 39b88a2e99
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Strix, an open-source AI pentesting tool run via OpenRouter (GLM 5.2, later switched to DeepSeek v4 Pro), performs autonomous vulnerability discovery — 146 deep-mode scans against 138 hosts between 23–31 August 2026, burning 633 hours of scanner time within 195 hours of wall-clock time."
  - claim_id: d78208a463
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Hermes — the same open-source \"Hermes AI agent\" (Nous Research, persistent daemon, self-authored skills, unattended execution) previously observed in three unrelated intrusions: an operation against Thailand's Ministry of Finance that a low-to-medium-confidence assessment linked to a Chinese-speaking operator without establishing a firm nexus (2026-07-25); a Taiwan government intrusion Tenable's own analysis assesses as more likely a state-adjacent contractor or patriotic-hacker operation than direct state sponsorship (2026-08-28); and a self-described Zhuhai-based, Chinese-speaking operator's mass-exploitation campaign against more than 460 targets including a Malaysian government entity, with no firm state-nexus attribution established (Unit 42, 2026-07-30) — orchestrated the campaign end to end, running on Anthropic Opus 4.6 (\"after newer models refused its requests\") under a Chinese system persona the operator loaded, titled \"SOUL - Red Team Operator\"."
  - claim_id: ceff97c4c8
