    surface: "body"
    kind: cited
    text: "Those files carry one of five malware families the advisory names for the first time together: **BeaverTail** (a JavaScript loader hidden in NPM packages hosted on GitHub or Bitbucket), **InvisibleFerret** (a Python backdoor), **OtterCookie** (a JavaScript RAT and infostealer), **OtterCandy** (combining OtterCookie and RATatouille features), and **StoatWaffle** — a modular Node.js loader, credential harvester and RAT that hides inside blockchain-themed decoy VS Code project repositories and auto-executes through a malicious VS Code configuration file the moment the victim opens and trusts the folder ("
