- {claim_id: a24ed2a7d0, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "Until patches are deployed, disable the vulnerable modules ... if not required (raw HTML lists esp4 esp6 rxrpc); RHSB: Blocking esp4/esp6 will break IPsec; HNS: drop the page cache"}
- {claim_id: b8864cabad, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "improper handling of shared page fragments during skb coalescing ... modify read-only file contents in the kernel page cache and achieve root"}
- {claim_id: 4edbe191a7, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "uses user and network namespaces to obtain CAP_NET_ADMIN privileges within an isolated namespace ... NETLINK_XFRM ... /usr/bin/su ... does not alter the on-disk binary"}
- {claim_id: f571f6d018, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "attackers can modify any file readable by the user, including [/etc/passwd]"}
- {claim_id: 25c6b38d25, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "Fragnesia was accidentally activated by the patch fixing one of the original Dirty Frag vulnerabilities (CVE-2026-43284)"}
- {claim_id: f5ba0f40b2, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "discovered by William Bowling of Zellic.io ... AI-agentic software auditing tool; technical explainer and proof-of-concept exploit code"}
- {claim_id: 830913f67d, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "allows unprivileged local attackers to modify read-only file contents ... achieve root (local primitive)"}
- {claim_id: e6722822e7, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "shared Linux hosts ..., container clusters (where the page cache is shared across the host), CI runners and build farms, and cloud SaaS solutions running user code"}
- {claim_id: 3291117f9d, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "AppArmor restrictions on unprivileged user namespaces, such as those default in Ubuntu, may serve as a partial mitigation, requiring additional bypasses"}
- {claim_id: 1d9c08da1f, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "Microsoft analysts added there is currently no evidence pointing to in-the-wild exploitation of Fragnesia"}
- {claim_id: fe0a13c3f4, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "Some Linux distributions have already relased kernel patches, namely AlmaLinux and CloudLinux"}
- {claim_id: 3128e8e707, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "less of a risk for single-user workstations ... than for shared Linux hosts, container clusters, CI runners; apply vendor kernel patches"}
- {claim_id: b5eb44e91f, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "Wiz: disable the vulnerable modules if not required (raw HTML names esp4 esp6 rxrpc); HNS: disable/denylist or unload esp4, esp6, rxrpc"}
- {claim_id: 271c6ad612, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "for environments where IPsec must remain functional ... disabling unprivileged user namespaces. Warning: may also affect rootless containers, sandboxed browsers, and Flatpak"}
- {claim_id: 10a3d48f35, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "applying the mitigation alone is not enough ... After mitigating, drop the page cache to force a reload from disk"}
- {claim_id: 974bfc35bd, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "The vulnerability impacts the Linux kernel's XFRM ESP-in-TCP subsystem; RH CVE page agrees"}
- {claim_id: c9e5e86d22, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "Warning: Blocking esp4/esp6 will break IPsec functionality"}
- {claim_id: a7760ad943, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "less of a risk for single-user workstations ... than for shared Linux hosts"}
- {claim_id: 6bb75d57fb, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "disable the vulnerable modules for both Fragnesia and DirtyFrag, if not required"}
