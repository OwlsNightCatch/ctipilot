- {claim_id: 81cd5be618, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "blocking outbound SMB traffic at the network perimeter will also limit exposure to NTLM coercion attacks; MSRC recommends July 2026 updates"}
