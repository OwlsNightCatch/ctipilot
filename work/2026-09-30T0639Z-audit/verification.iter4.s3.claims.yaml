- {claim_id: d27bfbdefb, passage: '119 ransomware groups ... 3,300 ... a 49 percent increase from 80 groups in 2024; Many incidents are mislabeled as ''IT incidents'' when Windows servers hosting SCADA ...; Ransomware groups target VMwar', source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: 1816ed208f, passage: 'In 2025, 49 percent of Dragos Services reports included elevated findings related to remote access, and 53 percent identified internet-facing systems.', source_url: 'https://www.dragos.com/blog/ot-cybersecurity-lessons-learned-frontlines', verdict: ok}
- {claim_id: 0eba539ec4, passage: 82 percent of organizations lack clear criteria for when operational anomalies should trigger cyber investigations., source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: 9fc7ed15f6, passage: We're excited to announce the release of our 9th Annual OT Cybersecurity Year in Review report; date 2026-02-17; covers 2025 data, source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: e09b3c86f2, passage: derived exposure line; consistent with poor IT/OT segmentation and compromised VPN/jumphost credentials findings, source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: f9f0b69b32, passage: 'derived detection concept; Defenders need to know who connected, from where, to what system ... whether that activity aligns with normal operation', source_url: 'https://www.dragos.com/blog/ot-cybersecurity-lessons-learned-frontlines', verdict: ok}
- {claim_id: 158af50e14, passage: 81 percent of assessments identified poor IT/OT segmentation., source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: 319e7b4245, passage: '73 percent of all-time IR cases involved compromised VPN or jumphost credentials. (involved, not caused/stolen)', source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
- {claim_id: b98640778e, passage: 'Published: ''81% of engagements identified no meaningful IT/OT network segmentation''; ''dominant entry vector in 62% of cases''; ''34% of confirmed OT intrusions''; NIS2 ... IEC 62443', source_url: 'origin/main:entries/2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem.md', verdict: ok}
- {claim_id: 162c4bc7b6, passage: 'Published text: ''81% of engagements'', ''Frontlines IR Edition'', 62%, 34%, NIS2 Annex-I, IEC 62443, SARI framework; Dragos pages carry none of these', source_url: 'origin/main:entries/2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem.md', verdict: ok}
- {claim_id: 90089654bc, passage: Every existing tag in the repository has been moved to point to a imposter commits ... exfiltrates credentials from CI/CD pipelines, source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 0d1f4df940, passage: 'every tag (53 in total) ... every tag (15 in total); Only workflows pinned to a known-good full commit SHA are unaffected; THN: exfiltration domain overlap, Socket likely linked', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 6446ff9086, passage: a commit that is not reachable from the action's default branch history; unique imposter commit per tag; 53 in total; 15 in total, source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 47b3302675, passage: 'Downloads the bun JavaScript runtime; Reads memory from the Runner.Worker process; tr/grep pipelines filtering for "isSecret":true; outbound HTTPS to attacker-controlled domain', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 437a3f9f0b, passage: 'fake "Build action for vX.Y.Z" message that mirrors the legitimate maintainer''s commit-message style; all 53 ... within a 3-minute, 16-second window (2026-05-18)', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 3655ed10e7, passage: 'Burckhardt: the @antv npm compromise is likely linked to the actions-cool hack, citing overlaps in the exfiltration domain; ''strong enough that we''re treating them as related''; GitHub disabled reposit', source_url: 'https://thehackernews.com/2026/05/github-actions-supply-chain-attack.html', verdict: ok}
- {claim_id: aa085306e4, passage: any workflow that references the action by version pulls the malicious code on its next run. Only workflows pinned to a known-good full commit SHA are unaffected., source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 4eb2ea181b, passage: 'Payload Markers: bun at /home/runner/.bun/bin/bun; /proc/<Runner.Worker PID>/mem from python3 child; gh auth token, sudo python3, tr/grep pipelines; Outbound HTTPS port 443', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 8fcdc2ac4d, passage: flags any workflow that references a GitHub Action via a commit SHA ... which does not match any legitimate tag or branch head ... exactly the signature of this attack, source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: a815367f05, passage: 'Any workflow protected by Harden-Runner will automatically block outbound connections to this domain - even in audit mode; even if a compromised action somehow runs, the credentials cannot leave the r', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 8c4a8ae229, passage: 'derived takeaway: tags resolve to malicious commits; pin to full commit SHA; credentials harvested from Runner.Worker memory', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: 1bb4a7c572, passage: 'GitHub has since disabled access to the repository ... violation of GitHub''s terms of service; Socket: likely linked, citing overlaps in the exfiltration domain; npm (@antv); no PyPI mention on THN, S', source_url: 'https://thehackernews.com/2026/05/github-actions-supply-chain-attack.html', verdict: ok}
- {claim_id: eebc590712, passage: Published summary names Nx Console VS Code extension (separate stolen-credential incident); published body 'EU and Swiss developer organisations ... were directly in scope'; no cited page says it, source_url: 'origin/main:entries/2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags.md', verdict: ok}
- {claim_id: bd689abddc, passage: 'Published had ''GitHub has since disabled the repository'', ''Socket confirmed ... npm / PyPI'', T1552.001, domain and 1c9e803; event_date was 2026-05-19, StepSecurity dated 2026-05-18', source_url: 'https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials', verdict: ok}
- {claim_id: ec017dd589, passage: 'JetBrains 07-27 advisory + 08-07 follow-up: reports of active exploitation, as well as attempted exploitation; Cloud customers need no action, measures already applied; KEV: dateAdded 2026-08-05, know', source_url: 'https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/', verdict: ok}
- {claim_id: 9b7ccea9d4, passage: 'update to 2025.11.7 or 2026.1.3; security patch plugin for 2017.1+; follow-up: restrict external access until mitigated', source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
- {claim_id: 89cc79bb12, passage: 'review the list of unauthorized build agents for unexpected entries; successful exploit could expose stored credentials, modify server state, compromise build artifacts', source_url: 'https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/', verdict: ok}
- {claim_id: e93c1bd098, passage: fixed in 2025.11.7 and 2026.1.3; plugin for 2017.1+; all versions affected; Cloud measures already applied; no numeric CVSS on page, source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
- {claim_id: 1af9c71399, passage: flaw may enable an unauthenticated attacker with HTTP(S) access ... bypass authentication checks and execute arbitrary operating system commands with the privileges of the TeamCity server process. All, source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
