- {claim_id: ec5674c05d, passage: 'reported to us privately on July 10, 2026, by Antoni Tremblay; At the time of publishing this advisory, we are not aware of any active exploitation', source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
- {claim_id: 20397a15a2, passage: 'we have received reports of active exploitation, as well as attempted exploitation, targeting unpatched TeamCity servers (follow-up dated 2026-08-07)', source_url: 'https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/', verdict: ok}
