claims:
- {claim_id: 50ffa337eb, passage: 81 percent of assessments identified poor IT/OT segmentation. 73 percent of all-time IR cases involved compromised VPN or jumphost credentials., source_url: 'https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review', verdict: ok}
