- {claim_id: 6a86ee0d25, passage: 'This vulnerability affects Cisco Secure FMC Software, regardless of device configuration; table: 7.0 and earlier -> 7.0.10 (page revised 2026-09-16 v1.6)', source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh', verdict: ok}
- {claim_id: 37398366c3, passage: There are no workarounds that address this vulnerability., source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh', verdict: ok}
- {claim_id: dc2b2f2adf, passage: 'does not affect: Cloud-Delivered FMC (cdFMC), Firewall Device Manager (FDM), ASA, FTD, Security Cloud Control (SCC)', source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh', verdict: ok}
