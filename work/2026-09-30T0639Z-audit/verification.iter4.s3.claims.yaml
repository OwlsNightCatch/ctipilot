- {claim_id: 5aa1123b71, passage: 'Base 5.3; regardless of device configuration; not affected: cdFMC, FDM, ASA, FTD, SCC; 10.1->10.1.0; Previously, hot fixes were provided; v1.6 2026-SEP-16', source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh', verdict: ok}
