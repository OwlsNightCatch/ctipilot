- {claim_id: 4b6053be90, passage: 'editorial framing: stored credentials, build artifact integrity and downstream CI/CD named by JetBrains', source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
- {claim_id: 837aafb6ce, passage: 'a successful attack could expose TeamCity data, configurations, and stored credentials, modify server state, and potentially compromise the integrity of build artifacts and downstream CI/CD pipelines', source_url: 'https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/', verdict: ok}
