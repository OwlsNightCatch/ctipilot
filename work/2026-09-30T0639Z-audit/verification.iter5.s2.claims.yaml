claims:
- {claim_id: ad00563b80, verdict: ok, source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202", passage: "Exploited Yes / Exploitation Detected; Rev 2.0 Jul 28 2026 re-released ... recommends July 2026 updates"}
- {claim_id: 3c2c91f00c, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "stems from an incomplete patch for CVE-2026-21510 ... exploited by APT28 via weaponized LNK files; KEV dateAdded 2026-04-28; MSRC rev 1.1 Apr 27 corrected Exploited flag"}
- {claim_id: a3b05fb156, verdict: ok, source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202", passage: "Protection mechanism failure in Windows Shell allows an unauthorized attacker to perform spoofing over a network; CVSS 4.3; Released Apr 14, 2026; Exploitation Detected"}
- {claim_id: 98169493be, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "successfully preventing the initial remote code execution and SmartScreen bypass ... sending the victim's Net-NTLMv2 hash to the attacker, which can later be used for NTLM relay attacks and offline cr"}
- {claim_id: 914b834b01, verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "kev.json CVE-2026-32202 dateAdded 2026-04-28"}
- {claim_id: 4b81390dcf, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "APT28 named only for CVE-2026-21510/21513 predecessors; no actor named for CVE-2026-32202 exploitation"}
- {claim_id: ca93e1a7f2, verdict: ok, source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202", passage: "2.0 Jul 28, 2026 This CVE has been re-released to comprehensively address the vulnerability ... Microsoft recommends installing the July 2026 updates"}
- {claim_id: 20b614b9da, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "affects a range of supported Windows 10, 11, and Windows Server versions; outbound SMB blocking advised"}
- {claim_id: ae1947cbd7, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "SMB connection to attacker server when user opens folder where LNK was downloaded (derived detection, consistent)"}
- {claim_id: 388b05138e, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "even if the victim refrained from opening the malicious LNK file"}
- {claim_id: 81cd5be618, verdict: ok, source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202", passage: "recommends installing the July 2026 updates; HelpNet: blocking outbound SMB at perimeter limits exposure"}
- {claim_id: 9b781d1d2f, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "stems from an incomplete patch for CVE-2026-21510 ... in conjunction with CVE-2026-21513, has been exploited by APT28"}
- {claim_id: f3d201644a, verdict: ok, source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202", passage: "2.0 Jul 28, 2026 This CVE has been re-released to comprehensively address the vulnerability"}
- {claim_id: 39ce8306b7, verdict: ok, source_url: "git show origin/main:entries/2026-05-08/cve-2026-32202...", passage: "published body: APT28 has weaponised this against EU government ministries."}
- {claim_id: acce1fb364, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/04/29/windows-cve-2026-32202-exploited/", passage: "no actor named for this CVE in any cited source"}
- {claim_id: b98537bf44, verdict: ok, source_url: "git show origin/main:entries/2026-05-08/cve-2026-32202...", passage: "published sources: nvd.nist.gov only; title had CISA KEV deadline 2026-05-12; body said APT28 EU ministries"}
- {claim_id: a24ed2a7d0, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "If IPsec not in active use it is safe to block the modules; Wiz rmmod esp4 esp6 rxrpc; HelpNet: drop the page cache after mitigating"}
- {claim_id: b8864cabad, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "improper handling of shared page fragments during skb coalescing ... modify read-only file contents in the kernel page cache"}
- {claim_id: 4edbe191a7, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "uses user and network namespaces to obtain CAP_NET_ADMIN ... NETLINK_XFRM ... first bytes of /usr/bin/su ... does not alter the on-disk binary"}
- {claim_id: f571f6d018, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "attackers can modify any file readable by the user, including /etc/passwd"}
- {claim_id: 25c6b38d25, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "according to Dirty Frag discoverer Hyunwoo Kim, Fragnesia was accidentally activated by the patch fixing ... CVE-2026-43284"}
- {claim_id: f5ba0f40b2, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "discovered by William Bowling of Zellic.io, with the help of the company's AI-agentic software auditing tool ... technical explainer and PoC exploit code"}
- {claim_id: 830913f67d, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "allows unprivileged local attackers to modify read-only file contents ... achieve root (local-only; inference of post-compromise primitive)"}
- {claim_id: e6722822e7, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "shared Linux hosts, container clusters (page cache shared across the host), CI runners and build farms, and cloud SaaS solutions running user code"}
- {claim_id: 3291117f9d, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "AppArmor restrictions on unprivileged user namespaces, such as those default in Ubuntu, may serve as a partial mitigation, requiring additional bypasses"}
- {claim_id: 1d9c08da1f, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "They also added that there is currently no evidence pointing to in-the-wild exploitation of Fragnesia (Microsoft analysts)"}
- {claim_id: fe0a13c3f4, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "Some Linux distributions have already released kernel patches, namely AlmaLinux and CloudLinux"}
- {claim_id: 3128e8e707, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "less of a risk for single-user workstations than shared Linux hosts, container clusters, CI runners; apply vendor kernel patches"}
- {claim_id: b5eb44e91f, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "raw HTML: Until patches are deployed, disable the vulnerable modules ... rmmod esp4 esp6 rxrpc; HelpNet: esp4, esp6, rxrpc unload"}
- {claim_id: 271c6ad612, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "for environments where IPsec must remain functional ... disabling unprivileged user namespaces ... may also affect rootless containers, sandboxed browsers, and Flatpak"}
- {claim_id: 10a3d48f35, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "CloudLinux: applying the mitigation alone is not enough ... After mitigating, drop the page cache to force a reload from disk"}
- {claim_id: 974bfc35bd, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "The vulnerability impacts the Linux kernel's XFRM ESP-in-TCP subsystem ... allows unprivileged local attackers ... root"}
- {claim_id: c9e5e86d22, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "Warning: Blocking esp4/esp6 will break IPsec functionality"}
- {claim_id: a7760ad943, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "shared hosts higher risk; derived takeaway consistent with source"}
- {claim_id: 6bb75d57fb, verdict: ok, source_url: "https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp", passage: "raw HTML: disable the vulnerable modules ... rmmod esp4 esp6 rxrpc (if not required)"}
- {claim_id: 0409b3fbc2, verdict: ok, source_url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-003", passage: "Blocking esp4/esp6 will break IPsec; Targeted Method preserves IPsec by disabling unprivileged user namespaces"}
- {claim_id: c2d3fabc1a, verdict: ok, source_url: "https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/", passage: "AlmaLinux and CloudLinux kernel patches already released"}
- {claim_id: eadf7f4df1, verdict: ok, source_url: null, passage: "section lead-in; mitigation text matches Wiz/HelpNet/RH"}
- {claim_id: d2151106e8, verdict: ok, source_url: "git show origin/main:entries/2026-05-15/cve-2026-46300...", passage: "published: xfrm_espintcp / esp6_offload modules, CAP_NET_ADMIN, 5.x and 6.x LTS series, Ubuntu/Debian/RHEL/SUSE, Wiz researcher Hyunwoo Kim"}
- {claim_id: 02ac936b9f, verdict: ok, source_url: "git show origin/main:entries/2026-05-15/cve-2026-46300...", passage: "published sources: cveawg.mitre.org CVSS 7.8; Red Hat CVE page now shows Base Score 7.8; actor:uat-8616 and CVE table in published body"}
- {claim_id: 847735e3f7, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "over a million individual files from a victim's SharePoint and OneDrive; DLS shutdown 'signals a possible transition phase'"}
- {claim_id: 27c2de7e35, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "victim directed to lookalike SSO subdomain; code or approval to actor; register new MFA device; spoofed ClientAppId for Microsoft Office; python-requests"}
- {claim_id: db5529cd21, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "By February 2026, the group formally adopted the 'BlackFile' moniker; targeted dozens of organizations across North America, Australia, and the UK"}
- {claim_id: 848876e9df, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "callers often call targeted employees' personal cellular phones ... passkeys or MFA update ... registered with Tucows ... 'passkey' or 'enrollment' themes"}
- {claim_id: 2e0600fe79, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "captures these in real-time and immediately submits them to the legitimate SSO provider ... register a new, attacker-controlled MFA device to ensure persistence"}
- {claim_id: ccdec5a389, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "These compromises are not the result of a security vulnerability in vendor products or infrastructure ... social engineering"}
- {claim_id: 920c36dc22, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "SharePoint, OneDrive, Zendesk and Salesforce; 'confidential' and 'SSN'; Microsoft Graph, python-requests and PowerShell direct HTTP GET; valid session cookies (e.g., FedAuth)"}
- {claim_id: d90b1f6f1e, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "access and download over a million individual files from a victim's SharePoint and OneDrive environments"}
- {claim_id: 0d841bdc7c, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "frequently recorded as a FileAccessed event rather than FileDownloaded ... may bypass detection in many SOCs ... treat FileAccessed as benign"}
- {claim_id: 9b4b7c7ffe, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Figure 1 FileDownloaded in early intrusions; they spoofed the ClientAppId for 'Microsoft Office' to bypass basic conditional access filters ... python-requests/2.28.1 or WindowsPowerShell/5.1"}
- {claim_id: f68d53dbd0, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Figure 2: FileAccessed event from later UNC6671 intrusions; AppAccessContext ClientAppName python-requests"}
- {claim_id: 7fd91119af, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "originated from non-standard infrastructure, such as commercial VPN exit nodes and hosting providers"}
- {claim_id: 64c1f77fd6, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "DLS site went offline in late April 2026, but briefly came back online on May 11, 2026 ... 'BlackFile is shutting down... under this name' ... inaccessible at publication"}
- {claim_id: 2016b1da1a, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "signals a possible transition phase rather than a permanent cessation ... commonly rebrand or disperse their operations"}
- {claim_id: d6170c741f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "co-opted the ShinyHunters brand in at least one instance ... GTIG assesses that the operations are independent (UNC6240)"}
- {claim_id: 8eb7b89476, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Review IdP logs for system.multifactor.factor.setup events immediately preceded by user.authentication.auth_via_mfa failures or 'Abandoned' challenges"}
- {claim_id: d8214c38cd, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "treat FileAccessed events with the same criticality as FileDownloaded when User-Agent identifies a programming library or command-line tool; headless client / volume exceeds human browsing"}
- {claim_id: c36e2a1527, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "User-Agent mismatches ... discrepancy suggests access was driven by automated scripts rather than human interaction with the SharePoint user interface"}
- {claim_id: 799cacf4d3, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Alert on authentication attempts originating from known commercial VPNs or hosting providers that are abnormal for the user's typical geographic location"}
- {claim_id: a165582d67, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Implement FIDO2-compliant security keys or passkeys, which are resistant to the AiTM and vishing tactics employed by UNC6671"}
- {claim_id: 145fa58975, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "signals a possible transition phase rather than a permanent cessation"}
- {claim_id: 2cd3bbda5d, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "Figure 1 FileDownloaded with ClientAppId; Figure 2 FileAccessed python-requests; Monitor IdP logs for factor.setup preceded by failures or Abandoned challenges"}
- {claim_id: 151e59fc3c, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "valid session cookies (e.g., FedAuth) captured during the initial vishing phase; no mention of access-token theft"}
- {claim_id: 492f64a1da, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/", passage: "record summary matches page; 'GTIG reports no targeting in Switzerland': page lists only NA, Australia, UK and is silent on Switzerland (advisory wording)"}
- {claim_id: c25344b744, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "Once loaded via require('node-ipc'), the payload silently harvests over 90 categories of credentials ... exfiltrates it"}
- {claim_id: 1947fda93f, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "DNS TXT exfiltration instead of HTTP; StepSecurity Channel 1 HTTPS POST; rotate SSH keys, npm tokens, cloud provider keys ... on affected hosts"}
- {claim_id: 7202e1ddf2, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "simultaneously published ... account atiertant ... has no prior publish history on this package"}
- {claim_id: 273e26d3c0, verdict: ok, source_url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html", passage: "domain ... had expired on January 10, 2025, and was re-registered on May 7, 2026, a week before the attack"}
- {claim_id: 03c626b9bd, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "Assuming the npm account recovery email ... new domain owner was then able to trigger a standard npm password reset ... without ever compromising any of the maintainer's own infrastructure"}
- {claim_id: 84e5a37251, verdict: ok, source_url: "https://www.csoonline.com/article/4171926/expired-domain-leads-to-supply-chain-attack-on-node-ipc-npm-package.html", passage: "used as a dependency for 424 other projects, and receives almost 700K weekly downloads; StepSecurity: over 10 million weekly downloads"}
- {claim_id: 578b68172b, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "users pinned to ~9.1.x, ~9.2.x, ^9, ^12, or ~12.0 all received the compromised package ... 9.x releases are entirely fabricated; copied the 12.x package structure"}
- {claim_id: 13f434be60, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "npm's latest dist-tag now points to node-ipc@12.0.1. Any project that runs npm install node-ipc without a pinned version will pull the compromised tarball"}
- {claim_id: 53c85cd413, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "fires unconditionally on every require('node-ipc') ... no preinstall, install, or postinstall scripts ... invisible to tools that only scan lifecycle hooks"}
- {claim_id: cfe2dca972, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "ESM-only consumers ... do not load the malicious file ... unless another dependency or direct require path loads node-ipc.cjs"}
- {claim_id: dc5a1c4dd3, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "forks detached child; targets: cloud configs, SSH, Kubernetes, GitHub CLI, .env, shell histories, macOS Keychain; StepSecurity adds Terraform state and CI/CD workflows; gzip"}
- {claim_id: 0d4de5c69e, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "four layers: String array shuffling, Control flow flattening, Dead code injection, Custom base-16 encoding with reversed nibbles"}
- {claim_id: 141fefc10c, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "AI scanner detected ... within roughly three minutes of publication; no observed cron, launchd, rc.d, service installation, or second-stage download"}
- {claim_id: 072119e44d, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "90+ file-path patterns; dual-channel exfiltration (HTTPS POST + DNS TXT); targeting gate (12.0.1 only) inert unless module path hashes to target"}
- {claim_id: f85dd6de50, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "macOS list 113 patterns, Linux 127; does not use http, https, or tls.connect() for exfiltration; hash identical across versions; hash gate changes export behaviour"}
- {claim_id: 5b6bf5739a, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "resolves sh.azurestaticprovider.net using 1.1.1.1 or 8.8.8.8 then re-targets the resolver at the C2; Organizations relying solely on DNS logging through corporate resolvers would not see this traffic"}
- {claim_id: 3b34b9e9ae, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "For a 500 KiB gzip archive, the expected data query volume is roughly 29,400 TXT queries"}
- {claim_id: 25b61dfca4, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "child_process.fork(path.resolve(module.filename)) detached, stdio ignore (node-ipc.cjs)"}
- {claim_id: bfb980c34f, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "Check package-lock, yarn.lock, pnpm-lock, build caches, and local npm cache; CommonJS consumers trigger the payload; audit whether loaded via CommonJS, ESM or transitive dependency"}
- {claim_id: 11cbedff37, verdict: ok, source_url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html", passage: "re-install a known clean version (9.2.1 and 12.0.0) ... rotate; Socket lists SSH keys, npm tokens, cloud keys, GitHub and GitLab tokens, Kubernetes, Docker registry, Terraform, database credentials"}
- {claim_id: b9cdaed6c5, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "For Developers: Prefer dependency review that inspects package entrypoints, not only install scripts; use short-lived cloud credentials and scoped tokens"}
- {claim_id: ed3ba400ff, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "identical 80 KB obfuscated credential-stealing payload injected into the package's CommonJS bundle; appended IIFE at end of node-ipc.cjs"}
- {claim_id: 98e01172fa, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "Socket: DNS TXT not HTTP/TLS, 113/127 patterns; StepSecurity: 90+ patterns, HTTPS POST + DNS TXT, targeting gate on 12.0.1 (genuine source disagreement)"}
- {claim_id: e2567bc80a, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "hash gate only changes export behavior; StepSecurity: 9.x versions have no gate; treat all three as active"}
- {claim_id: 7258dd468b, verdict: ok, source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack", passage: "npm's latest dist-tag now points to node-ipc@12.0.1 (no source states removal from registry)"}
- {claim_id: 57215d3b4d, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "For Developers: dependency review at entrypoints; For Users: rotate SSH keys, npm tokens, cloud provider keys ... on affected hosts"}
- {claim_id: 3c88f15bd4, verdict: ok, source_url: "https://socket.dev/blog/node-ipc-package-compromised", passage: "Socket: DNS TXT not HTTP/HTTPS; StepSecurity: dual-channel; Socket 113/127 patterns vs StepSecurity 90+; gate difference"}
