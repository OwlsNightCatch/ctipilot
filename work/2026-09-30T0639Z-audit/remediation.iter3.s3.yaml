needs_main_agent:
- >-
  Tooling defect behind the Swiss-motion finding: fixlib.replace_source(text, old_url, new_url, ...)
  deletes the sources[] record outright when new_url equals old_url (its 'already listed' branch fires
  on the record itself). Iteration 2 used it to re-date the Netzwoche record and silently removed it.
  Other slices may have hit the same path; check_run has no check that every inline citation URL
  appears in sources[], so the gate stayed green. Suggest a store-wide sweep for inline URLs missing
  from sources[] in this run's entries (my sweep of slice 3 finds none now; the parser needs to allow
  parentheses in URLs such as the Curia Vista OData link) and, if wanted, a check_run check.
- >-
  entities/registry.yaml: no change needed. The Bitget incident summary carries neither the USD 351.6M
  nor the USD 464M figure. The OpenAI entry no longer lists
  incident:openai-australia-medicare-agent-breach-2026-06,
  incident:openai-dsewiki-agent-collusion-2026-05 or incident:openai-unctad-agent-scan-2026-04; each
  key is still linked by its own entry and no registry relation cites the OpenAI entry.
- >-
  state/cves_seen.json: no change needed this iteration.
- >-
  Older text left alone by the iteration rule, for the audit's awareness: OpenAI headline (131
  characters, not changed by this run); HPE headline's 'the controller that manages Aruba switch
  fabrics' (uncited background, older text); em dashes in unchanged Gentlemen sentences that share a
  paragraph line with this run's edits.
- >-
  Cisco FMC: the verifier asked for 'revised 2026-09-16' as the citation label in this run's
  Correction. check_run's citation-date check (entry-shape) compares this run's section citations with
  the sources[] date (2026-07-29, first publication), so the revision dates now sit in the sentence
  text and the label keeps 2026-07-29. If the main agent prefers the label form, the check needs a
  carve-out for revision-dated labels.
