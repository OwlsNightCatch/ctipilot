- claim_id: 13f464deed
  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: headline
  kind: frontmatter
  text: Fifty credential-free, no-interaction flaws span Oracle's middleware, ERP, BI and telco-assurance lines in an off-quarter patch release
- claim_id: 8a408eac53
  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: summary
  kind: frontmatter
  text: 'Oracle''s September 2026 Critical Security Patch Update, published 2026-09-15, carries 673 patches of which 153 are for Fusion Middleware, and Oracle states 78 of those may be exploited over a
    network without credentials. Oracle''s own risk matrix lists fifty CVEs at CVSS 9.8-10.0 that are network-reachable without privileges or user interaction and marked remotely exploitable without authentication.
    Six are CVSS 10.0 flaws in WebLogic Server, Access Manager, Forms, Internet Directory, Platform Security for Java and Hyperion Financial Management, and forty-four are CVSS 9.8 flaws across Fusion Middleware
    (Access Manager, Forms, Internet Directory and Platform Security for Java again, plus Data Integrator, Identity Manager, JDeveloper, WebCenter Enterprise Capture/Portal/Sites, WebLogic Server and Service
    Delivery Platform) and other product lines: E-Business Suite, Hyperion Financial Management, Business Intelligence/BI Publisher, Enterprise Manager, Communications Unified Assurance and Product Lifecycle
    Analytics. No exploitation is reported for any of the fifty. The release is Oracle''s off-quarter patch line, which a calendar built only on the quarterly dates will miss.'
- claim_id: 54d0e642d8
  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: actions[0]
  kind: frontmatter
  text: Apply Oracle's September 2026 Critical Security Patch Update now to every affected Fusion Middleware, Hyperion Financial Management, Analytics, Enterprise Manager, Communications Unified Assurance
    and Product Lifecycle Analytics deployment. It is an off-quarter release that a quarterly patch calendar does not schedule.
- claim_id: 0a6cc049df
  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: actions[1]
  kind: frontmatter
  text: 'Patch Oracle E-Business Suite 12.2.3-12.2.15 for CVE-2026-83327, CVE-2026-83452 and CVE-2026-83462 in this same release now: Cl0p exploited an earlier Oracle EBS zero-day from August 2025 to steal
    files from many organizations, and these three flaws need no credential and no user interaction.'
