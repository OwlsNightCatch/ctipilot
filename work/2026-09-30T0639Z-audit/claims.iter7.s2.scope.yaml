- claim_id: a8088c7837
  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: body
  kind: cited
  text: 'Six flaws in the release carry a CVSS 3.1 base score of 10.0 in Oracle''s own risk matrix with Attack Vector Network, Attack Complexity Low, Privileges Required None, User Interaction None and
    Scope Changed, meaning an unauthenticated request across the network reaches high confidentiality and integrity impact and crosses a security boundary (the first five also reach high availability impact;
    Hyperion Financial Management''s is rated none): CVE-2026-83021 in the Web Container of Oracle WebLogic Server over HTTP, CVE-2026-71133 in the Authentication Engine of Oracle Access Manager over HTTP,
    CVE-2026-83099 in Oracle Forms Services over HTTP, CVE-2026-83059 in the OID LDAP Server of Oracle Internet Directory over LDAP, CVE-2026-83020 in the centralized third-party jars of Oracle Platform
    Security for Java over HTTP, and CVE-2026-87230 in the Security component of Oracle Hyperion Financial Management over HTTP ('
  urls:
  - https://www.oracle.com/security-alerts/cspusep2026.html
