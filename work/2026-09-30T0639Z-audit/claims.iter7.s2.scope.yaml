  entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
  surface: body
  kind: cited
  text: Oracle published its September 2026 Critical Security Patch Update on 2026-09-15 (Rev 1, initial release) with 673 new security patches across its product families; Oracle Fusion Middleware alone
    accounts for 153 of them, and Oracle states that "78 of these vulnerabilities may be remotely exploitable without authentication, i.e., may be exploited over a network without requiring user credentials"
    (
  urls:
