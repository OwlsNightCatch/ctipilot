    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", "https://nx.dev/blog/nx-console-v18-95-0-postmortem", "https://github.com/nrwl/nx-console/security/advisories/GHSA-c9j4-9m59-847w", "https://github.com/TanStack/router/security/advisories/GHSA-g7cv-rxg3-hmpx", "https://blog.daemon-tools.cc/post/security-incident", "https://www.kaspersky.com/blog/daemon-tools-supply-chain-attack/55691/", "https://www.helpnetsecurity.com/2026/05/21/github-grafana-breach-root-cause-nx-console/"]
