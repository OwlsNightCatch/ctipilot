    text: "The takeaway still said no CVE or Oracle advisory was involved, after ShinyHunters told BleepingComputer it used the WAF bypass for CVE-2026-35273 against FBI Jobs. The takeaway now attributes that link to the group, the CVE is recorded with a link to the PeopleSoft campaign entry that carries the patch and hunt actions, the watch-for-an-advisory action is removed, and the priority moves from high to notable because the incident's defender value lies in the already-covered CVE. The title, headline, summary, main text, 2026-09-29 update and sourcing note described the FBI's later statement as confirming the compromise. The FBI is investigating without confirming a breach, its scope or attribution, so those passages now say so, the 2026-09-27 update attributes the WAF-bypass link to the group, the zero-day claim is re-cited from TechCrunch to BleepingComputer, an evidence quote records the FBI's position, and credibility returns from 2 to 3."
