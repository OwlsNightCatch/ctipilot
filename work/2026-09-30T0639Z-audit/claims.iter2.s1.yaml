    surface: "body"
    kind: cited
    text: "NCSC states the most commonly observed additional-malware drop location is a lookalike of the system SysWOW64 directory under a folder named \"Windows\" with a trailing space, which NCSC states the actor created specifically for the purpose of deploying malware; in at least one sample, this downloaded payload carried the data-wiping functionality already described above ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: ff97750f35
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "Some victims' personal data has since surfaced on pro-Iranian leak sites, which NCSC reads as a further harassment vector rather than incidental exposure ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
