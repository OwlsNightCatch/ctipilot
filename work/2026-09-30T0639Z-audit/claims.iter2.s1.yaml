    text: "Sophos X-Ops published a write-up on 2026-05-07 of a malvertising campaign using a counterfeit Claude AI site to distribute a previously undocumented Windows backdoor named Beagle, loaded by Donut shellcode after DLL sideloading on a signed G DATA antivirus updater (Sophos X-Ops, 2026-05-07 · Malwarebytes, 2026-04-10 (earlier wave))."
  - claim_id: 837139f86f
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "Sophos X-Ops published a write-up on 2026-05-07 of a malvertising campaign using a counterfeit Claude AI site to distribute a previously undocumented Windows backdoor it named **Beagle** ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
  - claim_id: e8523a084a
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "The chain delivers a roughly 505 MB ZIP archive containing a malicious MSI that drops a *legitimate, signed G DATA antivirus updater executable*, an encrypted data file and an attacker-controlled DLL into the user's startup folder, so the updater sideloads the malicious DLL (DLL side-loading) ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
  - claim_id: c54529475b
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "The DLL decrypts the data file and executes the resulting Donut (DonutLoader) shellcode, an open-source in-memory loader, which loads Beagle ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
  - claim_id: e178f93c47
    entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
    surface: "body"
    kind: cited
    text: "Beagle communicates with a subdomain of the same lookalike site over TCP/443 and UDP/8080 with AES-encrypted payloads, and its eight commands are `uninstall`, `cmd`, `upload`, `download`, `mkdir`, `rename`, `ls` and `rm` ("
    urls: ["https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor"]
