    surface: "record 2026-09-30T07:03:25Z"
    kind: record-summary
    text: "The title ran to 48 words and the sourcing note carried a rating letter and a registry key. The title is shortened, leaving the domain-root link, the every-workstation scope and the dark-web publication to the summary and main text, and the sourcing note states the provenance in plain language. The sourcing note also claimed, without a source, that the incident is unrelated to the PAYLOAD group behind an August 2026 Zurich-area leak; Kaspersky names a PAYLOAD ransomware family and does not name the operators, so that claim is removed. The priority moves from high to notable: a single-victim incident from April 2026 with a transferable technique but no constituency nexus."
