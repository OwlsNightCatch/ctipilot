    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "summary"
    kind: frontmatter
    text: "Brevo (CRM/email platform, formerly Sendinblue) confirmed a stolen long-lived Cloudflare API key let an attacker deploy a malicious edge Worker that rewrote Brevo's own pages and three customer-embedded widget scripts for roughly 5.5 hours on 2026-09-14, serving a ClickFix clipboard-paste lure and a WordPress administrator-backdoor plugin without modifying any origin file. Sansec counts more than 100,000 sites embedding the affected scripts, a count of sites carrying the components rather than of confirmed infections."
