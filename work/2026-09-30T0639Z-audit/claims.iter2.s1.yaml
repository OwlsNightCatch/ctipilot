  - claim_id: 9608df3ca7
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "Command and control runs over Telegram, with each victim device assigned its own unique Telegram Bot ID as an explicit operational-security measure to prevent cross-contamination between victims ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
