    surface: "body"
    kind: cited
    text: "Seven government agencies — Japan's National Police Agency and National Cybersecurity Office, the US FBI and DoD Cyber Crime Center, Australia's Signals Directorate/ACSC, and Germany's BND and BfV — jointly published a Cybersecurity Advisory on 2026-09-18 on the North Korean \"WaterPlum\" cyber-actor group, publicly known as **Contagious Interview** ("
