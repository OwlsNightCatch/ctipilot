    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "The discriminator NCSC gives is connections to these services in DNS or web proxy logs where they are not expected as part of normal business ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
