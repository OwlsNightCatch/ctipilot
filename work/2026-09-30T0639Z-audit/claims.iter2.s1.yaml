    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: uncited
    text: "Because hosted instances were remediated server-side by the vendor, the live exposure is narrowed to self-hosted and partner-managed deployments that have not yet applied the update — a population that still includes public-sector and critical-infrastructure operators running ServiceNow ITSM, HR-service-delivery and case-management on-prem or through partners."
  - claim_id: f6ab39cb9e
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** hosted-instance customers are covered by ServiceNow's server-side fix, so verification is the action — confirm with your account team that your hosted instance received the 2026-07-13 update, and for self-hosted or partner-managed instances apply the listed patch for your family release (Zurich/Yokohama/Australia/Brazil) rather than waiting for the next maintenance window."
