    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: cited
    text: "ServiceNow states it \"addressed this vulnerability by deploying a security update to hosted instances,\" provided updates to self-hosted customers and partners, and at disclosure was \"not currently aware of exploitation against ServiceNow instances\" ("
    urls: ["https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947"]
  - claim_id: a2e5753686
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: cited
    text: "ServiceNow has not published the mechanism behind the \"certain circumstances\" precondition, but Searchlight Cyber's analysis shows unauthenticated requests passing `javascript:` expressions into GlideRecord query parameters, demonstrated through the `sysparm_assessable_type` parameter of `assessment_thanks.do`, and abusing `gs.include()` script-include evaluation to escape the sandbox ("
    urls: ["https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/"]
  - claim_id: 4b1d56ac6c
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: uncited
    text: "Per ServiceNow, the flaw \"could enable an unauthenticated user, in certain circumstances, to execute code within the ServiceNow platform\" — an isolation failure in the AI Platform's code-execution environment."
  - claim_id: 1cde52faf2
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: uncited
    text: "Fixed releases are Zurich Patch 7b/9, Yokohama Patch 12 Hot Fix 1b/13, Australia Patch 2 and Brazil EA/GA."
