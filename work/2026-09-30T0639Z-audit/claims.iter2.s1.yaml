    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "summary"
    kind: frontmatter
    text: "ServiceNow disclosed CVE-2026-6875 (CVSS 9.5), a sandbox escape in the ServiceNow AI Platform that, in certain circumstances, lets an unauthenticated user execute code within the platform. ServiceNow has already fixed its own hosted instances; the flaw is exploited in the wild (NCSC-CH flagged active exploitation on 2026-07-20; Defused observed first attempts on 2026-07-17), so self-hosted and partner-managed customers running ITSM/case-management on-prem must apply the listed family-release patches now."
  - claim_id: 2a611b6dd3
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "body"
    kind: cited
    text: "ServiceNow disclosed CVE-2026-6875, a \"Sandbox Escape in ServiceNow AI Platform\" rated CVSS 4.0 9.5, in security bulletin KB3137947 published 2026-07-13 ("
