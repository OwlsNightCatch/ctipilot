    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "summary"
    kind: frontmatter
    text: "THORChain, a Switzerland-based cross-chain liquidity protocol, lost about $11M across nine blockchains after one of its six vaults was compromised. The leading hypothesis is a GG20 Threshold-Signature-Scheme implementation flaw exploited by a newly churned validator node that gradually leaked vault key material over keygen/signing rounds before forging outbound signatures. THORChain said initial indications were that user funds were safe and only protocol-owned funds were affected (The Record, 2026-05-15; TRM Labs, 2026-05-15)."
