    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: uncited
    text: "Access begins with extensive social-engineering rapport-building over WhatsApp or Telegram, the actor posing as a contact already known to the target or as platform technical support."
  - claim_id: 938ea46ba5
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: uncited
    text: "The victim is then persuaded to download and open a file disguised as a legitimate application — observed lures include Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass — or as MRI scan results; a decoy screen matching the lure's theme displays while the core malware installs in the background."
  - claim_id: dd81aa79ee
