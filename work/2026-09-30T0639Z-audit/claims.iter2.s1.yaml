    surface: "body"
    kind: uncited
    text: "CHOSEN BRICK persists across reboot via the registry Run key `HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`, registers a mutex so only one copy runs, and adds Microsoft Defender exclusions to evade detection."
