- code: F3
  category: claim-not-supported
  section: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  item: "Correction 2026-09-30 (claim 05b90fa478): \"in the Unit 42 case the reported route is the choice of a permissive model rather than use of the installed jailbreaking skill\""
  url_or_quote: https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/
  summary: "(low confidence) Unit 42 reports the actor 'selected a model with minimal safety controls (DeepSeek)' and lists 'godmode: LLM jailbreaking, framework-bundled' among the skills the actor customized Hermes with ('godmode jailbreaking skill available'). It does not say the skill was unused, so 'rather than use of the installed jailbreaking skill' asserts a negative the page does not carry. Reword to: the route Unit 42 reports is the choice of a permissive model; the framework-bundled jailbreaking skill was also configured, and Unit 42 does not say whether it was used."
- code: F3
  category: claim-not-supported
  section: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  item: "summary (claim 77413f75ff): \"multiple sources describe a collective called ScatteredLapsussHunters as now directing ShinyHunters' operations\"; same framing in the Update 2026-09-29 section: \"a collective calling itself ScatteredLapsussHunters, led by a teenage cybercriminal known as \\\"Rey,\\\" as having taken effective control of ShinyHunters' operations\""
  url_or_quote: https://krebsonsecurity.com/2026/09/dutch-police-arrest-reformed-hacker-in-shiny-hunters-investigation/
  summary: "(low confidence) Krebs: the shift came 'after ShinyHunters was taken over by a teenage cybercriminal from Amman, Jordan who goes by the nickname Rey and operates as part of a cybercrime group called ScatteredLapsussHunters (SLSH)', which 'experts say is an amalgamation of three hacking groups' that includes ShinyHunters itself. The sources attribute the takeover to Rey, not to the SLSH collective directing ShinyHunters. Reword to: sources told Krebs a teenager known as Rey, who operates as part of SLSH, took over ShinyHunters."
- code: F3
  category: claim-not-supported
  section: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  item: "body (claim 54c59e42a5): \"The same week, ShinyHunters separately defaced the ransomware group Clop's own Tor leak site over an unrelated dispute, using it to extort Clop directly\""
  url_or_quote: https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/
  summary: "(low confidence) The cited BleepingComputer piece is dated 2026-09-19 and says the Clop attack 'began Friday night' (2026-09-18); the FBI intrusion was Monday night 2026-09-21, and BleepingComputer's FBI article (2026-09-22) calls the Clop defacement 'last week'. 'The same week' is not what the pages say; 'days earlier' (or 'on 2026-09-18') is."
- code: F9
  category: surface-contradiction
  section: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
  item: "body and summary first sentence: \"...distributing a previously undocumented Windows backdoor it named Beagle ... (Sophos X-Ops, 2026-05-07 · Malwarebytes, 2026-04-10)\" and the Correction's \"Malwarebytes' report of 2026-04-10 covers the same attack\""
  url_or_quote: https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer
  summary: "(low confidence) Malwarebytes, cited alongside Sophos for the Beagle clause, says the fake site 'deploys a PlugX malware chain' ('quietly deploying PlugX malware'); Sophos says that 'on closer inspection' the payload is DonutLoader plus 'a previously undocumented backdoor' (Beagle), not PlugX. The entry presents Malwarebytes as coverage of the same attack but never says the two sources name different payload families, and Malwarebytes carries neither 'Beagle' nor the malvertising assessment the sentence ends on. Add a Contradiction line (Malwarebytes: PlugX; Sophos: a different, previously undocumented backdoor) or split the citation."
