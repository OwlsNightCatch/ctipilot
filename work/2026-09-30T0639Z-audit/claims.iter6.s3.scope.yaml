- claim_id: 716e467887
  entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
  surface: record 2026-09-30T07:27:10Z
  kind: record-summary
  text: Adds that CISA's KEV catalog marks CVE-2026-20316 as used in known ransomware campaigns. Cisco's fixed-release table covers 7.0 and earlier, not only 7.0, and the detection and triage text claimed
    that any login under the static account has no legitimate use, which Cisco does not say. Detection now leads with Cisco's log check and the unsupported triage line is removed. The sourcing note is rewritten,
    and the US federal deadline is gone. Hot-fix file names the current advisory no longer lists are dropped, Cisco's warning about existing compromise is attributed to its hot fix files, and an uncited
    statement that the server holds credentials for every managed device is removed.
