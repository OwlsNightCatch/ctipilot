- claim_id: 50e4716520
  entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
  surface: summary
  kind: frontmatter
  text: 'Cisco disclosed CVE-2026-20316 on 2026-07-29: the web interface of Cisco Secure Firewall Management Center carries a vendor-embedded static password for a low-privileged account, which an unauthenticated
    remote attacker can use to log in and reach sensitive data on the management server. Cisco PSIRT states it became aware of active exploitation in July 2026, and CISA added the CVE to its Known Exploited
    Vulnerabilities catalog the same day. The base score is only 5.3 because the account is low-privileged, but Cisco deliberately raised the advisory''s Security Impact Rating to High because the account
    can be combined with other Secure FMC flaws to elevate privileges. Releases 7.0 and earlier, 7.2, 7.4, 7.6, 7.7 and 10.0 are affected regardless of configuration and there is no workaround. The hot
    fixes Cisco first shipped have been replaced by hardening releases (7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2), and Cisco warns that its hot fixes prevent future exploitation but may not address
    an existing compromise.'
- claim_id: 2184717ee5
  entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
  surface: actions[0]
  kind: frontmatter
  text: Upgrade every on-premises Secure FMC on 7.0 and earlier, 7.2, 7.4, 7.6, 7.7 and 10.0 to its hardening release (7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13 or 10.0.2), including any already carrying the
    earlier hot fix; Cisco states no workaround exists, so restricting reachability is a containment step and not a substitute.
- claim_id: b434a88314
  entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
  surface: actions[1]
  kind: frontmatter
  text: On every FMC whose web interface has been reachable, run Cisco's check in expert mode (zgrep "package_info.*license" over /var/log/messages*, a hit naming /var/tmp/license.tmp indicates possible
    exploitation) and treat a hit as a compromise to work with Cisco TAC, since Cisco states its hot fixes may not address an existing compromise.
