  - claim_id: 6d5e2f9a9b
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "summary"
    kind: frontmatter
    text: "Poland's Internal Security Agency (ABW) reports that in 2025 attackers breached water treatment plants in Jabłonna Lacka, Szczytno, Małdyty, Tolkmicko and Sierakowo and, where they reached the industrial control systems, altered equipment parameters, putting operation and water supply at risk. ABW describes hacktivist groups exploiting poor password policies and device management panels exposed directly to the internet, and names no state actor for these intrusions."
  - claim_id: c69dd0196b
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: cited
    text: "Poland's Internal Security Agency (ABW) reports in its 2024-2025 activity review that in 2025 \"security breaches were reported at water treatment plants in the following towns: Jabłonna Lacka, Szczytno, Małdyty, Tolkmicko and Sierakowo\", and that \"by gaining access, in some cases, to industrial control systems, the attackers were able to alter the technical parameters of the equipment\", a direct risk to the plants' continued operation and to water supply ("
    urls: ["https://www.abw.gov.pl/download/24/4877/InternalSecurityAgencyABW2024-2025Selectedactvities.pdf"]
  - claim_id: 6161a94cf1
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: cited
    text: "ABW describes hacktivist groups as particularly active against municipal infrastructure and says they \"exploited glaring vulnerabilities in the form of poor password policies and unsecured device management panels, accessible directly via the public internet\" ("
    urls: ["https://www.abw.gov.pl/download/24/4877/InternalSecurityAgencyABW2024-2025Selectedactvities.pdf"]
  - claim_id: 447e4fa5d1
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: cited
    text: "The report names no group for the water-plant intrusions; the state-sponsored actors it lists elsewhere, APT28, APT29 and UNC1151, are described in a separate passage as espionage and influence operators ("
