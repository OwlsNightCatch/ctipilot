    entry: 2026-05-08/cve-2026-5787-cve-2026-6973-ivanti-epmm-pre-auth-certificate
    surface: "record 2026-09-30T07:22:44Z"
    kind: record-summary
    text: "The entry described CVE-2026-5787 and CVE-2026-6973 as an exploited pre-authentication chain, marked all five May EPMM CVEs as exploited and KEV-listed, and named the European Commission, the Dutch data protection authority, the Dutch judiciary council and Finland's Valtori as victims of this wave. Ivanti reports limited exploitation of CVE-2026-6973 only, which needs an admin login, and no exploitation of the other four; only CVE-2026-6973 is in KEV, and no source ties those organisations to the May wave. The entry is rewritten from Ivanti, The Hacker News, CERT-FR, BleepingComputer, SecurityWeek and the KEV catalog, with per-CVE scores, the January credential-reuse path CERT-FR describes, and exposure, detection and takeaway lines. The three duplicate entries for the same disclosure are folded into it."
