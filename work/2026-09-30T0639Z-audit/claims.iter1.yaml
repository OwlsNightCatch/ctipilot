    surface: "summary"
    kind: frontmatter
    text: "Progress Kemp LoadMaster pre-auth RCE (CVE-2026-8037, CVSS 9.8): uninitialized-malloc heap corruption in the /accessv2 API reaches code execution as root. watchTowr published the full mechanics, exploitation attempts began on 2026-06-29 and CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-08-07; the fix is in v7.2.63.2."
  - claim_id: faf3b8e3ad
    entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
    surface: "body"
    kind: cited
    text: "CVE-2026-8037 (CVSS 9.8) is a pre-authentication RCE in Progress Kemp LoadMaster, an edge load balancer ("
    urls: ["https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/"]
  - claim_id: 6a7aa25dec
    entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
    surface: "body"
    kind: uncited
    text: "The `escape_quotes()` function in the `access` executable allocates buffers via uninitialized `malloc()` without null-terminating escaped strings; a sprayed JSON payload to `/accessv2` (four single-quotes expanding to 16 bytes) overwrites heap metadata in adjacent freed chunks, and the subsequent `__sprintf_chk()` reads out-of-bounds into attacker-controlled data, reaching code execution as root with no authentication. watchTowr published the full mechanics."
  - claim_id: c592f35cb6
