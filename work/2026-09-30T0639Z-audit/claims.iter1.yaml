  - claim_id: cb99932734
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "HPE Networking Fabric Composer (AFC), the controller that manages Aruba CX switch fabrics, carries 45 CVEs in one bulletin ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339"]
  - claim_id: c9be16cb04
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "), two of them CVSS 10.0: CVE-2026-76658 is a flaw in AFC's SSH daemon that \"allows unauthenticated remote attackers to gain administrative access and execute arbitrary commands, risking full system compromise\" ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339"]
  - claim_id: 0f5ce99fca
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "Separately, ArubaOS-CX — the network OS on Aruba's CX-series campus and data-center switches — carries CVE-2026-73749 (CVSS 9.8): a buffer overflow in an unnamed AOS-CX daemon that an unauthenticated remote attacker triggers by sending specially crafted packets, reaching remote code execution with elevated privileges ("
    urls: ["https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/", "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0340"]
  - claim_id: cf39cfbc7c
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "The exact further-CVE count differs between the two cited sources: BleepingComputer's account of HPE's own bulletin states \"23 other security vulnerabilities...between 8.1 and 8.8\" ("
    urls: ["https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/"]
  - claim_id: 0de322f7b6
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "), and its list names at least one identifier (CVE-2026-73781, an authenticated stored XSS) absent from NCSC-NL's independently-mirrored structured advisory data for the same bulletin, which lists 25 further CVEs spanning a wider 4.9-8.8 range ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0340"]
  - claim_id: 688940a2ca
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "HPE published two Aruba Networking security bulletins in the same release window: Fabric Composer bulletin HPESBNW05133 on 2026-09-01, and an ArubaOS-CX bulletin around the same date, both picked up by NCSC-NL and CERT-FR on 2026-09-02/03."
  - claim_id: 94296fcd43
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "Three more rank Critical: CVE-2026-19766 (9.6, adjacent-network auth bypass to privileged code execution on the underlying OS), CVE-2026-73701 (9.0, unauthenticated privileged RCE with unspecified preconditions) and CVE-2026-73700 (9.0, authenticated stored cross-site scripting reachable by a low-privilege operator against an admin)."
  - claim_id: df1a17236c
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "Fixed in Fabric Composer 7.4.0 (or 7.3.4 for the 7.3 branch); every 7.3.3-and-earlier install is affected, all discovered by HPE's own internal Networking security research team."
  - claim_id: 4c810cfd69
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "Affected release branches and fixes, per HPE's bulletin: the 10.18 branch up to and including 10.18.0001, fixing to 10.18.1002+, 10.17.1021 and earlier fix to 10.17.1030+, 10.16.1051 and earlier fix to 10.16.1060+, 10.13.1180 and earlier fix to 10.13.1190+, and 10.10.1180 and earlier fix to 10.10.1181+ — that last branch is already past HPE's End of Maintenance and receives only critical-severity fixes, a category this CVE qualifies for."
  - claim_id: 6b40073cec
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "The same ArubaOS-CX bulletin lists further CVEs including an unauthenticated adjacent-network arbitrary file write via an API endpoint (CVE-2026-73752, 8.8), an unauthenticated format-string flaw in the CLI reachable from an adjacent network (CVE-2026-73782, 8.8), and an unauthenticated predictable factory-default password (CVE-2026-73778, 8.1) granting full admin control on a switch before an administrator sets credentials after Zero-Touch Provisioning."
  - claim_id: 6c836f2f69
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: uncited
    text: "HPE states it is not aware of active exploitation or public proof-of-concept for either bulletin's flaws."
  - claim_id: 73f8d0378a
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Fabric Composer sits in the network-management plane rather than on a single application host, so its compromise grants control over the whole switch-fabric configuration — segmentation, routing, persistence below typical EDR visibility."
  - claim_id: b37c0e9853
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: derived
    text: "Before patching, remove the AFC API and web management interface onto a dedicated out-of-band management segment, restrict SSH access to the AFC host by source address, and review AFC operator authentication logs for administrative logins originating outside the management network."
  - claim_id: 1804d1c82a
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: derived
    text: "For ArubaOS-CX, diffing live fabric configuration (VLANs, ACLs, routes) against an approved baseline is the most likely way to catch exploitation after the fact, since a successful buffer-overflow exploit against a compiled daemon leaves little application-layer telemetry beyond a crash-restart cycle."
  - claim_id: 35e5b87227
