  - claim_id: 526e10395d
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "TCP ports 43210 and 43211, used by the S1HAL (Silicon One Hardware Abstraction Layer) process, are reachable in the default Layer 3 VRF; an unauthenticated remote attacker who can reach either port sends crafted input that executes as root, or crashes the S1HAL process and forces the device to reload ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 46b550229b
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Only switches carrying a Silicon One ASIC are affected — Cisco names ten specific product IDs, determinable via `show module`; the advisory's own \"Products Confirmed Not Vulnerable\" section explicitly excludes the Nexus 3000 Series and every other Nexus 9000 model, so inventory should key on the ten Silicon One product IDs rather than on the Nexus 9000 family name, as Cisco's own advisory title \"Cisco Nexus 9000 Series Switches Silicon One Remote Code Execution Vulnerability\" might suggest ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 01a42eb15b
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Cisco published cisco-sa-n9k-s1-rce-EH8dEtr on 2026-09-02, disclosing CVE-2026-20212 (CVSS 9.8, CWE-1327 Binding to an Unrestricted IP Address) in the Silicon One ASIC integration on Nexus 9000 Series switches."
  - claim_id: 356de4b802
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Cisco found the flaw during an internal TAC support case and states it is not aware of any public announcement or malicious use."
  - claim_id: c384f93f1c
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Fixed NX-OS software is available via Cisco's Software Checker."
  - claim_id: dd5c4237b1
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Until upgraded, Cisco recommends infrastructure ACLs (iACLs) denying TCP traffic destined to ports 43210/43211, or its temporary NX-OS \"Live Protect\" shield for this CVE — Cisco itself frames Live Protect as a bridge to patching, not a substitute for it."
  - claim_id: 6eadb407d0
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The same CERT-FR advisory (CERTFR-2026-AVI-1110) also bundled two lower-severity companion Cisco advisories from the same release cycle: an IOS XR hardening advisory covering several configuration-dependent weaknesses across multiple software trains, and a denial-of-service flaw in the SIP software running on several Cisco IP Phone and Wireless IP Phone models."
  - claim_id: 73977242ad
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** an unauthenticated root-RCE primitive on core network-fabric switching hardware demands patching or the iACL workaround ahead of the normal maintenance window, not on it — S1HAL sits in the data-center switch's own control path, so a successful exploit compromises the fabric itself, not an endpoint behind it."
  - claim_id: 34f08e1595
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: derived
    text: "Detection concept: monitor for inbound TCP SYN or connection attempts to 43210/43211 on any Nexus 9000 management or control-plane VRF interface from unexpected sources — these ports have no legitimate business reason to be reached from outside the switch's own internal S1HAL control path."
  - claim_id: 5446358c31
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "section 2026-09-30T07:19:28Z"
    kind: cited
    text: "Scope this flaw by Cisco's ten Silicon One product IDs, not by the Nexus 9000 family name: Cisco's advisory lists the Nexus 3000 Series and every other Nexus 9000 model as not vulnerable ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 946232bb51
