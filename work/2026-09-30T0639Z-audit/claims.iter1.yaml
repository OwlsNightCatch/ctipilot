    text: "On every WordPress site that embedded a Brevo forms, Conversations or SDK script on 2026-09-14, check the must-use-plugins directory for a plugin impersonating \"Web Media Optimizer\" that is missing from the admin plugin list; if present, remove it, invalidate all administrator sessions and review administrator accounts, because its hardcoded key mints admin logins without a password."
