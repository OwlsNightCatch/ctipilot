    surface: "body"
    kind: derived
    text: "**Exposure:** on-premises EPMM below 12.6.1.1, 12.7.0.1 or 12.8.0.1, most acutely appliances that were exploited in the January CVE-2026-1281/1340 wave and whose admin passwords were never reset."
  - claim_id: 4c1bdb0203
    entry: 2026-05-08/cve-2026-5787-cve-2026-6973-ivanti-epmm-pre-auth-certificate
    surface: "body"
    kind: derived
    text: "**Detection:** administrative API sessions from sources outside the management network or at unusual hours, followed by the EPMM service spawning shells or making outbound connections, and for CVE-2026-5787, client certificates issued to Sentry hosts that do not exist in the deployment."
  - claim_id: 94be03d42d
    entry: 2026-05-08/cve-2026-5787-cve-2026-6973-ivanti-epmm-pre-auth-certificate
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patching closes all five flaws, but only a credential reset evicts an attacker who already holds a January-era admin password, so do both on any appliance that was internet-facing during January."
