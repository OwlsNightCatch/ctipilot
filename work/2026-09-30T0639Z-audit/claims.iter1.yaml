    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "Detection concept, per Check Point's own two independent indicators of compromise: first, a pre-authentication login attempt whose username field is anomalously long (over 1,000 characters) in the management-process log, occurring at the same timestamp as a management-process core dump, indicates a crash consistent with exploitation attempt; second, and sufficient on its own, a resource-loading error referencing a file path containing parent-directory-reference sequences in the same log is the traversal primitive itself surfacing in application error output."
