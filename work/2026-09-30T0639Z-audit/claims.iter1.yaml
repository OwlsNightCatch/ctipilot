    surface: "cves[CVE-2026-0769]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-0769\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"no-patch\"], \"affected\": \"No affected version range is published: ZDI's advisory names none. This absence is itself the finding: an operator cannot answer \\\"is my version affected?\\\" from the public record, and must treat any Langflow instance exposing the custom-component path as in scope until the vendor states otherwise.\", \"fixed\": \"None documented. ZDI published this as a 0-day advisory after notifying the vendor of its intent to do so, and its stated mitigation is to restrict interaction with the product rather than to upgrade. GitHub's advisory database record carries no affected-and-fixed version pair, and a direct OSV lookup for the same advisory identifier returns not-found — so no fixed release can be cited.\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: f85a4ec759
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "The first: CVE-2026-0769 is an eval injection in Langflow's `eval_custom_component_code` function, where a user-supplied string reaches Python execution without proper validation, and Zero Day Initiative states plainly that authentication is not required to exploit it ("
