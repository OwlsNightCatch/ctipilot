  - claim_id: 9ab224fa7d
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "The lure follows DPRK's established \"Contagious Interview\" pattern: fake job-interview GitHub repositories themed as infrastructure-engineering coding challenges (named Northwind-IAC, novacart-interview, terraform-candidate-repo) each carry a weaponized `.terraform.lock.hcl` pointing to a typosquatted, attacker-controlled Terraform provider registry impersonating HashiCorp's own naming."
