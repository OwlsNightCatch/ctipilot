  - claim_id: e1dbd008d8
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: cited
    text: "NLnet Labs shipped Unbound 1.26.1 on 2026-09-16, fixing two heap-corruption vulnerabilities in the widely deployed open-source validating/recursive DNS resolver; every version up to and including 1.26.0 is affected ("
    urls: ["https://nlnetlabs.nl/downloads/unbound/CVE-2026-81642.txt"]
  - claim_id: 8f317b3e7b
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-81642 (CVSS4.0 9.1, found by Yuqi Qiu and Xiang Li of Nankai University's AOSP Lab) sits in the DNSSEC validator: a DNSKEY record whose owner name carries a compression pointer that references back into its own RDATA can overflow the digest buffer during DNSKEY digesting, and NLnet Labs states \"remote code execution is possible through attacker controlled data\" — triggered simply by having a vulnerable Unbound query a zone the attacker controls ("
    urls: ["https://nlnetlabs.nl/downloads/unbound/CVE-2026-81642.txt"]
  - claim_id: 667aeaeb3e
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-82717 (rated High by NLnet Labs; found by Ben Morris of Anthropic) is a companion bug in CNAME synthesis: when Unbound rewrites a maximum-TTL value into the packet buffer during upstream-response processing, a compression pointer that now references the overwritten, invalidated domain name sends the code down an error path that fails to advance the buffer position correctly, producing a heap overflow NLnet Labs describes as \"heavily reliant on heap memory layout\" and capable of remote code execution \"under specific systems and compilation options\" ("
    urls: ["https://nlnetlabs.nl/downloads/unbound/CVE-2026-82717.txt"]
  - claim_id: e9b4d86028
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: cited
    text: "NCSC Switzerland's advisory records exploitation status as unknown for both and notes the operative precondition plainly: \"resolver must have DNSSEC validation active, and query routing must allow the attacker's malicious DNS zone to be parsed\" ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/12957"]
  - claim_id: 396c2dc5b7
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the prerequisite for CVE-2026-81642 is not exposure to attacker-initiated connections but DNSSEC validation plus the ability to recurse into an attacker-registered domain — a condition most validating recursive resolvers meet by design, since resolving arbitrary domains on request is their job."
  - claim_id: efd93ec146
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "Patch to 1.26.1 now rather than waiting for confirmed exploitation; CVE-2026-82717's outcome is more heap-layout- and build-dependent, so a crash/DoS is the more likely near-term observable even without full RCE, but it shares the same fix and the same urgency."
  - claim_id: 008a71b4ca
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "Detection concept: `unbound`/`named`-style crash-loops or repeated resolver-process restarts that correlate with resolution of an unusual or newly registered authoritative zone are the closest available behavioral signal in the absence of a public proof-of-concept; no PoC was found at time of writing."
  - claim_id: a4c3c36c7b
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Triage:** ordinary DNSSEC validation failures (a misconfigured zone, an expired signature) produce a `SERVFAIL` response and a logged validation error, not a resolver crash — a `named`/`unbound` worker process terminating or restarting during or immediately after resolving a specific external zone is the discriminator that separates this from routine DNSSEC validation noise."
  - claim_id: 9dae56f343
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "record 2026-09-30T07:19:40Z"
    kind: record-summary
    text: "The CVSS 4.0 score of 8.4 for CVE-2026-82717 was cited to the NVD API, which is not a citable source, and NLnet Labs' own advisory text prints no number. The score is removed and the text keeps NLnet Labs' High rating."
