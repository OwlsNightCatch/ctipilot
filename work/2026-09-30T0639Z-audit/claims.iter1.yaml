    surface: "body"
    kind: uncited
    text: "**Triage:** the first indicator is diagnostic only as its own correlated pair — an anomalously long username alone is not; the second indicator, a traversal-pattern sequence inside the resource-loading error path, is a self-contained sign of an exploitation attempt on its own."
