  - claim_id: d28cc1f723
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "cves[CVE-2026-42016]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-42016\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"JFrog Artifactory (Self-Hosted) before 7.133.11\", \"fixed\": \"7.133.11\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 2448351665
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "cves[CVE-2026-42018]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-42018\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"JFrog Artifactory before 7.111.20; 7.117.0–7.117.27; 7.125.0–7.125.19; 7.133.0–7.133.28; 7.146.0–7.146.8\", \"fixed\": \"7.111.20 / 7.117.27 / 7.125.19 / 7.133.28 / 7.146.8\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 996cdaf244
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "JFrog disclosed the two flaws separately and weeks apart, on 2026-07-27 and 2026-08-12, labelling each only \"High\" without a numeric score ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation"]
  - claim_id: a4075687fa
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "CVE-2026-42016 (CWE-863 Incorrect Authorization), disclosed 27 July 2026, is a privilege-escalation bug in Artifactory's token handling: the platform validates a token's signature and issuer but never checks whether the token's *scope* matches what it is being used for, so a low-privileged token can be exchanged for one carrying administrative authority ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation"]
  - claim_id: 272cc3e3a7
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "CVE-2026-42018 (CWE-287 Improper Authentication), disclosed 12–13 August 2026, is narrower but supplies the missing first step: Artifactory returns an internal anonymous-user token to a caller who never authenticated, even when anonymous access is disabled ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42018---anonymous-user-token-generation-exposure"]
  - claim_id: 08f670ce1b
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "Neither flaw alone grants administrative control — Wiz Research states plainly that the anonymous token from CVE-2026-42018 and the scope-validation gap in CVE-2026-42016 \"together... can turn an unauthenticated request into an admin-scoped token in two steps\" ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: 346bd462ea
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "CISA added both CVEs to its Known Exploited Vulnerabilities catalog on 2026-09-11 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 61ea9edbf0
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "**Kill chain, as Wiz reconstructed it from real intrusions (initial access, T1190).** An unauthenticated `POST /access/api/v1/aws/token/` — the trailing slash matters; the bare path without it returns 401 — returns HTTP 200 with a JWT scoped to Artifactory's internal anonymous identity, exploiting CVE-2026-42018."
  - claim_id: 80fbc46eb6
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "The operator then exchanges that JWT for a new one via `POST /access/api/v1/tokens`, which returns HTTP 200 carrying admin authority despite the request originating from the anonymous identity — exploiting CVE-2026-42016's missing scope check (**T1550.001**, forging elevated authority onto an application access token)."
  - claim_id: 49d0c7c1d7
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "The escalated token still shows `token:anonymous` as its actor in logs, which is itself a detection anomaly: no legitimate administrative action originates from the anonymous identity."
  - claim_id: cabdd1ec49
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "Wiz observed actors reach a created administrator account in under five minutes from the first request in some cases."
  - claim_id: 79125ad434
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "**Post-exploitation observed across the chained cases.** Operators create persistent administrator accounts via `PUT /api/security/users/<username>` or `/access/api/ui/users/<username>` (**T1136.001**); deploy malicious Groovy plugins through Artifactory's own extensible plugin framework to gain arbitrary code execution (**T1505**, abusing a legitimate server extension mechanism for persistence); and run ad-hoc shell commands through the plugin-execution endpoint (`GET`/`POST /api/plugins/execute/<plugin>`), used for reconnaissance and file enumeration (**T1059**)."
  - claim_id: a079a4df7a
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "Across multiple cases Wiz observed a custom Rust-based backdoor with command-and-control capability dropped to disk as a further persistence layer."
  - claim_id: cb83b9d875
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "Wiz's own patching-velocity data is the second half of the defender-relevant finding: at first disclosure, 67% of organizations running Artifactory had at least one instance vulnerable to CVE-2026-42016, and a similar 69% for CVE-2026-42018; six weeks after CVE-2026-42016's disclosure, 59% remained vulnerable, and CVE-2026-42018 fell only from 69% to 62% over four weeks — versus the separately-disclosed CVE-2026-82329 (a default-configuration join-key bypass, disclosed 28 August 2026), which dropped from 67% to 49% within two weeks of its own disclosure."
  - claim_id: e8e5d5e7fa
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: uncited
    text: "Wiz attributes the gap to CVE-2026-82329's critical-severity label likely driving faster security-team attention, while these two high-severity CVEs went unpatched at far higher rates for far longer — precisely the CVSS-driven prioritization trap that let this chain stay open long enough to be found under active exploitation."
  - claim_id: 381e9a47a0
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patching one CVE in this pair without the other leaves the chain intact, and a \"high\" rather than \"critical\" severity label on either individual flaw is not a reason to deprioritize a bug that, chained, hands over full administrative control of your artifact-repository and CI/CD supply-chain infrastructure."
  - claim_id: 2654603e63
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: derived
    text: "**Triage:** the highest-confidence detection signal is behavioral rather than a single request — a 401 on the bare `/access/api/v1/aws/token/` path followed by a 200 on a variant of it (with the trailing slash), from the same client, in a short window, is an operator confirming the vulnerable variant before relying on it, a pattern a normal client does not produce; correlate any resulting anonymous-identity token activity against subsequent user-creation, plugin-execution or credential-enumeration calls."
  - claim_id: 35fcb50c99
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "section 2026-09-30T07:19:38Z"
    kind: cited
    text: "The CVSS scores of 8.1 and 7.5 given earlier are removed: JFrog rates both flaws High without a numeric score ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation"]
  - claim_id: 0d4ec6ecc3
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "record 2026-09-30T07:19:38Z"
    kind: record-summary
    text: "The 8.1 and 7.5 scores were cited to the MITRE CVE Services records, which are not citable sources, and no citable page publishes them. The scores are removed from the text and the structured data, and the sentence now cites JFrog's own advisory page, which rates both flaws High."
  - claim_id: d62d3db1a3
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "NCSC UK, the US FBI and the Netherlands' AIVD jointly published a technical advisory on 2026-09-15 for CHOSEN BRICK, a Windows-only malware family Iranian state cyber actors have used since at least 2025 against dissidents, activists and journalists, with confirmed victims in the UK, US and Netherlands ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: f7694e0508
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "NCSC assesses Iran \"almost certainly\" uses this activity to support repression of people it perceives as regime threats, and notes Iranian intelligence services have in parallel plotted kidnap or lethal operations against some of the same class of target — framing CHOSEN BRICK as a transnational-repression tool rather than conventional espionage tradecraft ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: ccd1f5f852
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "NCSC UK's advisory does not itself name a specific Iranian government entity, but the tradecraft closely matches activity the FBI attributed to actors operating \"on behalf of the Government of Iran Ministry of Intelligence and Security\" in a flash warning circulated in March 2026, which also linked a July 2025 hack-and-leak operation to the \"Handala Hack\" persona the FBI assesses MOIS operates and connects to a further group, \"Homeland Justice\" ("
    urls: ["https://therecord.media/iran-cyber-spies-use-fake-mri-scans-as-lure"]
  - claim_id: 9608df3ca7
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "Command and control runs over Telegram, with each victim device assigned its own unique Telegram Bot ID as an explicit operational-security measure to prevent cross-contamination between victims ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: 4091f14749
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "NCSC states the most commonly observed additional-malware drop path is `C:\\Windows \\SysWOW64` — a non-standard location on most Windows installs because of the deliberate space after \"Windows,\" which NCSC states the actor created specifically for the purpose of deploying malware; in at least one sample, this downloaded payload carried the data-wiping functionality already described above ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: ff97750f35
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: cited
    text: "Some victims' personal data has since surfaced on pro-Iranian leak sites, which NCSC reads as a further harassment vector rather than incidental exposure ("
    urls: ["https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"]
  - claim_id: c63eb00424
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: uncited
    text: "Access begins with extensive social-engineering rapport-building over WhatsApp or Telegram, the actor posing as a contact already known to the target or as platform technical support."
  - claim_id: 938ea46ba5
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "body"
    kind: uncited
    text: "The victim is then persuaded to download and open a file disguised as a legitimate application — observed lures include Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass — or as MRI scan results; a decoy screen matching the lure's theme displays while the core malware installs in the background."
  - claim_id: dd81aa79ee
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
