    surface: "section 2026-09-30T06:52:00Z"
    kind: uncited
    text: "The catalog still listed that flag as unknown on 2026-09-18, so the change is recent."
  - claim_id: c2c872c265
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: derived
    text: "**Defender takeaway:** ransomware use moves any TeamCity On-Premises server that was internet-reachable and unpatched after 2026-07-27 from a patch item to an incident-response case."
  - claim_id: d832e99b85
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: derived
    text: "Check it for unenrolled build agents and for the server process spawning shells outside build execution, then rotate the VCS, artifact-repository and signing credentials it holds."
  - claim_id: be75c635b8
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "record 2026-09-30T06:52:00Z"
    kind: record-summary
    text: "CISA's Known Exploited Vulnerabilities catalog now marks CVE-2026-63077 as used in ransomware campaigns, a flag it still listed as unknown on 2026-09-18. Ransomware operators are now exploiting the unauthenticated TeamCity On-Premises RCE, so any server that was reachable and unpatched needs the compromise assessment, not only the upgrade. The summary and main text no longer say exploitation is unobserved. The CVSS 9.8 figure and CWE-502 classification were cited to the MITRE CVE Services record; CWE-502 now cites CISA's KEV record, and the numeric score, which no citable source publishes, is removed."
  - claim_id: 35d26aeeea
