    surface: "headline"
    kind: frontmatter
    text: "Gitea's Docker image trusts a login header from any source, letting anyone on the port sign in as admin; NCSC-CH rates it exploited"
  - claim_id: 1d8d2047c2
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "summary"
    kind: frontmatter
    text: "Gitea's Docker image shipped with REVERSE_PROXY_TRUSTED_PROXIES defaulting to the trust-all wildcard, so anyone who can reach the container's HTTP port can forge an X-WEBAUTH-USER header and authenticate as any account, admin included, with no credentials (CVE-2026-20896, CVSS 9.8). BSI rated it \"hoch\" on 2026-06-22 and NCSC-CH set it to actively exploited on 2026-07-10, while public telemetry so far shows reconnaissance probing. Fixed in 1.26.3 / 1.26.4 (Gitea, 2026-06-21)."
