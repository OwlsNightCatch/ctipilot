    kind: derived
    text: "**Triage:** legitimate Google administrators and helpdesks never call account holders unprompted about a security case; the tell is the free-text \"case ID\" riding inside an otherwise-genuine Google recovery-address notification, and any login page served from sites.google.com rather than accounts.google.com."
