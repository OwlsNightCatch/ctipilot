    kind: frontmatter
    text: "{\"id\": \"CVE-2026-12537\", \"cvss\": \"10.0 (Google)\", \"status\": [\"patch-available\"], \"affected\": \"@google/gemini-cli < 0.39.1; google-github-actions/run-gemini-cli < 0.1.22\", \"fixed\": \"gemini-cli 0.39.1; run-gemini-cli 0.1.22\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 32abf2201a
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "Novee Security tested each against the vendor's own public repository in default configuration ("
    urls: ["https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/"]
  - claim_id: 9d3848ecf8
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "The advisory records the affected range as 0.2.54 up to 2.1.163 and the fix in 2.1.163 ("
    urls: ["https://github.com/anthropics/claude-code/security/advisories/GHSA-fg94-h982-f3mm"]
  - claim_id: 5145347f16
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "The Google finding is tracked as CVE-2026-12537, which Google rated CVSS 10.0 in its own advisory ("
    urls: ["https://novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents/"]
  - claim_id: bece8e7f21
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: cited
    text: "), fixed in gemini-cli 0.39.1 and run-gemini-cli 0.1.22 ("
    urls: ["https://api.osv.dev/v1/vulns/GHSA-wpqr-6v78-jr5g"]
  - claim_id: fb6d8c9f9b
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Three AI coding-agent CI harnesses were broken in different ways by the same underlying question: what, inside an automated pipeline, is the agent allowed to treat as authoritative?"
  - claim_id: 1e07317c80
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "The Claude Code Action work is best read as three successive rounds of patch-and-bypass, and only the last of them carries an identifier."
  - claim_id: 94935da329
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Round one turned on an ordering mistake in defensive code: the command-injection validation pipeline strips single-quoted content before inspecting a command — a sensible-looking measure to avoid false positives on shell metacharacters inside string literals — which means an injected payload placed inside single quotes is examined only after the interesting part has been removed."
  - claim_id: 3307ce8547
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "A validator that sanitises its input before deciding whether the input is dangerous is checking something other than what will execute."
  - claim_id: 413a0e3661
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Round two was an asymmetry in the allowlist itself, where commands classed as read-only were exempted from path checking, so a read-only utility could be pointed at any file on the runner."
  - claim_id: e444782d5a
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Neither round carries a CVE."
  - claim_id: bc33cb32a2
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Both of those were patched weeks to months before the write-up appeared, so for those two vendors the action is a version check, not an incident."
  - claim_id: 2b38b9da55
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "Their mechanics are still worth carrying, because the lesson generalises to anyone building command allowlists rather than merely consuming these products — and because the exfiltration target the researchers reached is already known here from a different flaw in the same product family."
  - claim_id: b8c8e106e1
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "The write-up's phrasing of that step is worth quoting for how narrow the distinction is: \"cat /proc/$PPID/environ reads the parent, not self, and pulls from the process that still holds every single thing the isolation was built to keep away.\""
  - claim_id: dec530b46f
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "The third finding is the one that is genuinely current, and it has no CVE because, as the researchers observe, nobody files one for newly documented behaviour."
  - claim_id: b3b4f734b8
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "In an OpenAI Codex workflow, two agent passes ran over a single shared checkout, and the agent's own default instruction file sat in that checkout outside the protected-metadata set."
  - claim_id: 71adb9deae
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "That file \"is loaded from disk on every single invocation and injected as instructions the model treats as authoritative\" — so a first pass induced to modify it dictates what the second pass believes it has been told to do."
  - claim_id: ad5ad42d97
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "The fix was structural rather than a patch: \"3 Days after our report they fixed it and the two passes on openai/codex were split into separate jobs, each with its own checkout.\" That change landed in the vendor's own repository."
  - claim_id: 4039faee97
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: uncited
    text: "It does not propagate to anyone else's pipeline, because the flaw is not in a shipped component — it is in a workflow shape."
  - claim_id: e6f0d8dda0
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the transferable rule is that an agent's instruction file is executable input, and any pipeline stage that can write it controls every later stage that reads it."
  - claim_id: 62662cef82
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: derived
    text: "Where a public-sector organisation runs coding agents in CI, the questions to ask are whether multiple agent passes share a workspace, whether the agent's instruction file is treated as protected metadata or as ordinary repository content, and — for the two patched products — whether the versions in use are past the fixed releases."
  - claim_id: 6175fa6106
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "body"
    kind: derived
    text: "The first of those has no vendor answer at all, and it is also the one no CVE feed will ever tell you about."
