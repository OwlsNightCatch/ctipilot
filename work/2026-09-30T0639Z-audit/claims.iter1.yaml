    kind: cited
    text: "The four companion flaws are not reported exploited: CVE-2026-5786 (CVSS 8.8) lets an authenticated attacker gain administrative access, CVE-2026-5787 (CVSS 8.9) lets an unauthenticated attacker impersonate registered Sentry hosts and obtain valid CA-signed client certificates, CVE-2026-5788 (CVSS 7.0) lets an unauthenticated attacker invoke arbitrary methods, and CVE-2026-7821 (CVSS 7.4) lets an unauthenticated attacker enroll a device from a restricted set, exposing information about the appliance ("
