  - claim_id: 5c0940d1e8
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "summary"
    kind: frontmatter
    text: "JetBrains disclosed CVE-2026-63077 on 2026-07-27: an attacker with nothing more than HTTP(S) access to a TeamCity On-Premises server can exploit the agent-polling protocol to bypass authentication checks and execute arbitrary operating-system commands as the TeamCity server process. Every On-Premises version is affected; fixes are 2025.11.7 and 2026.1.3, with a security-patch plugin available down to 2017.1 for estates that cannot upgrade immediately. TeamCity Cloud is not affected. CISA listed the flaw as exploited on 2026-08-05 and its KEV catalog now marks known ransomware campaign use, and JetBrains' own Cadence service was breached through it. A build server compromise is a supply-chain compromise."
  - claim_id: 2baac96882
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "cves[CVE-2026-63077]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-63077\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"All TeamCity On-Premises versions prior to the branch fixes; TeamCity Cloud is not affected.\", \"fixed\": \"2025.11.7 and 2026.1.3, with JetBrains' security-patch plugin as the mitigation path for installations from 2017.1 onward that cannot take the full upgrade.\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 1af9c71399
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' advisory is short on mechanism by design and unambiguous on reach: an unauthenticated attacker with HTTP(S) access to a TeamCity On-Premises server can bypass authentication checks and run arbitrary operating-system commands with the privileges of the TeamCity server process, and every On-Premises version ever shipped is affected ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 760abce027
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' own framing is that exploitation of the flaw requires no authentication and that the attacker bypasses authentication checks by way of that protocol, so there is no credential, session, or user interaction standing between a network-reachable server and command execution ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: e1472bf0a7
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "The flaw was reported privately on 2026-07-10 by Antoni Tremblay, and JetBrains states it is not aware of any active exploitation as of publication ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: e6302b4e93
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "); CISA's catalog classifies it as CWE-502, deserialization of untrusted data, reachable through the agent polling protocol ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: b25593519d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reachable surface is the agent-polling protocol — the channel distributed build agents use to check in with the central server for job assignments and configuration."
  - claim_id: 4b6053be90
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reason this warrants moving ahead of the ordinary patch queue is what a build server is, not the score."
  - claim_id: 4c60d70ac5
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "A TeamCity server holds the credentials its pipelines deploy with, the signing material its artifacts are stamped with, and write access to the outputs every downstream consumer trusts — so command execution as the server process converts into a durable ability to alter what future builds produce."
  - claim_id: ef7a421728
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "At disclosure no public exploitation had been observed, and that clock ran out within nine days (see the updates below)."
  - claim_id: 47dd924f65
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "JetBrains withheld the gadget chain, but \"all versions affected\" plus \"no authentication\" plus a widely deployed, easily fingerprinted product is a combination that historically closes quickly once someone reconstructs the path."
  - claim_id: 90026a0fe3
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "Detection: the observable is in the web-server or reverse-proxy access log in front of TeamCity and in process-creation telemetry on the server host."
  - claim_id: c70ab5cb7d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "Requests to the agent-polling endpoint arriving from addresses that are not your registered build agents are the first signal, and the second — the one that matters if the first was missed — is any child process spawned by the TeamCity server process that is not part of a build it was asked to run: shells, interpreters, or network utilities parented to the server rather than to an agent's build step."
  - claim_id: a033baa4dd
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "**Triage:** the agent-polling endpoint legitimately receives continuous check-in traffic from your build fleet, so request volume to it discriminates nothing on its own."
  - claim_id: 896bd6aff1
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The source address set is finite and knowable — your registered agents are an inventory, so polling traffic from anything outside it is the anomaly."
  - claim_id: 57c8a756ed
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "And on the server host, legitimate command execution belongs to agent processes running build steps; the server process itself spawning an interpreter or a network utility is not a quieter version of normal activity but a different thing entirely."
  - claim_id: dfbb78a4db
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "Hardening: apply 2025.11.7 or 2026.1.3, or the security-patch plugin on 2017.1 and later, and treat the agent-polling interface as an internal service — if the only reason it faces the internet is that some agents live outside the network, a VPN or reverse tunnel for those agents removes the exposure that makes this flaw reachable at all."
  - claim_id: 47266b4da0
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "CISA's Known Exploited Vulnerabilities catalog now marks CVE-2026-63077 as used in ransomware campaigns ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 098d827b3b
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "JetBrains has separately confirmed that its own Cadence service was compromised through this flaw between 2026-08-08 and 2026-08-24 because the server was never patched against the advisory ("
    urls: ["https://blog.jetbrains.com/pycharm/2026/08/cadence-security-incident-august-2026/"]
  - claim_id: 636e71a59f
