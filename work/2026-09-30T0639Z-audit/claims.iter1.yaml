    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch self-hosted Gitea Docker instances to 1.26.4 and fix the reverse-proxy trust scope now**: set `REVERSE_PROXY_TRUSTED_PROXIES` to your exact proxy IP/CIDR (never the wildcard), or disable `ENABLE_REVERSE_PROXY_AUTHENTICATION` if you don't use header auth. Internet-reachable instances first."
  - claim_id: df6107fe86
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "actions[1]"
    kind: frontmatter
    text: "Hunt Gitea sign-in/audit logs for X-WEBAUTH-USER-authenticated admin sessions whose source IP is not the configured trusted proxy. By construction any such hit is a spoofed header, and it separates exploitation from legitimate proxy auth."
  - claim_id: f98ac62bc3
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "body"
    kind: cited
    text: "Any attacker who can reach the container's HTTP port can therefore send an `X-WEBAUTH-USER` header naming an arbitrary user — including an administrator — and be authenticated as that user with no credentials ("
    urls: ["https://blog.gitea.com/release-of-1.26.3-and-1.26.4", "https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4"]
