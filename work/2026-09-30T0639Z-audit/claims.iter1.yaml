  - claim_id: 3e50b66e68
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: derived
    text: "**Exposure:** small municipal water and wastewater operators whose control-system or device management interfaces answer from the internet and accept weak or shared passwords."
  - claim_id: fca8bca6b3
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: derived
    text: "**Detection:** successful logins to HMI, PLC or device management interfaces from internet addresses, and changes to setpoints or equipment parameters that match no operator log."
  - claim_id: 8d8da318ca
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the whole access path ABW describes is an internet-reachable management panel with a weak password, so removing direct internet exposure of OT interfaces and enforcing unique strong credentials on them closes it."
