- claim_id: ebd89df67b
  entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
  surface: record 2026-09-30T06:54:52Z
  kind: record-summary
  text: Microsoft's assessment that Fox Tempest very likely used stolen US and Canadian identities was stated as fact, its tiered pricing plans were described as per-signing-run pricing, and INC, Qilin
    and Akira were called confirmed customers, although Microsoft ties them to Fox Tempest through cryptocurrency links to their affiliates. Unsourced claims about European victims and unsourced detection
    advice are removed, and guidance on exposure, detection and triage drawn from Microsoft's reporting is added. An attacker-controlled domain is no longer named. The title no longer says the service fed
    INC, Qilin and Akira operations. The priority moves from high to notable.
