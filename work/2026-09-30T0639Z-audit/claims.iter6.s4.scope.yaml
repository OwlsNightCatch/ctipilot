- claim_id: 21eda7737c
  entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  surface: body
  kind: derived
  text: In egress telemetry, look for outbound connections from the Langflow host to mining pools or to destinations unrelated to the model providers the application legitimately calls, and for authentication
