  date: "2026-09-16"
  passage: "A vulnerability was found in Unbound that can progressively corrupt heap memory and under certain systems and compilation options could lead to remote code execution."
  note: "Clause: \"CVE-2026-82717 (CVSS4.0 8.4 per NLnet Labs' own CNA scoring, mirrored on NVD; found by Ben Morris of Anthropic) is a companion bug in CNAME synthesis\". PARTIAL. The existing NLnet Labs advisory text (fetched with url --direct; the extract transport returns nothing for .txt) carries the flaw (CNAME synthesis rewriting a max TTL value in the packet buffer + compression pointer -> heap buffer overflow), \"Affected products: Unbound up to and including version 1.26.0\", fix \"Unbound 1.26.1\", and credit \"Ben Morris from Anthropic\". It prints NO numeric score or severity. NLnet's product index https://nlnetlabs.nl/projects/unbound/security-advisories/ (fetched; an index of all Unbound advisories - use only if your source gate accepts it) shows for this advisory \"Severity: High\" linking the CVSS 4.0 calculator with vector CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:U, but not the number 8.4. STATED ONLY BY THE BANNED PAGE (CVE record, read not cited): the numeric base score 8.4 (CNA NLnet Labs, CVSS 4.0, same vector; CISA-ADP SSVC Exploitation none). Safe rewrite: \"NLnet Labs rates it High (CVSS 4.0)\" or drop the 8.4; the \"mirrored on NVD\" link text goes with the URL."
