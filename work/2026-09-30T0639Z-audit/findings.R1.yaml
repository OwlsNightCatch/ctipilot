  date: "2026-06-01"
  passage: "This vulnerability is being actively exploited, and poses a risk for all user-end plugin versions prior to 2.4.8."
  note: "Clause: plugin before 2.4.8 (fixed in WHM PlugIn 5.3.2.1) mishandles symlinks from a user with FTP/web-shell access on CloudLinux/CageFS, enabling cross-account file access and privilege escalation; \"NVD records exploitation in the wild in May 2026 (NVD CVSS 8.5)\". PARTIAL ONLY. The existing LiteSpeed vendor blog (fetched) carries: privilege escalation to root for a user with FTP or web shell access on CloudLinux/CageFS shared hosting, \"being actively exploited\", patched in cPanel plugin v2.4.8 / WHM plugin v5.3.2.1, timeline \"May 31, 2026: We were alerted to the original issue\", CVE assigned Jun 14. The CISA KEV JSON feed (fetched) adds the label \"LiteSpeed cPanel Plugin UNIX Symbolic Link (Symlink) Following Vulnerability\", dateAdded 2026-06-15, cwes CWE-61, and shortDescription \"could allow a user with FTP or web shell access on a shared hosting server running CloudLinux/CageFS\". STATED ONLY BY THE BANNED PAGE (I read NVD to confirm, not cited): the CVSS 8.5 (a secondary 3.1 score submitted by cve@mitre.org, vector AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H) and the CVE-description phrase \"as exploited in the wild in May 2026\". \"Cross-account file access\" is stated by no source I could reach (LiteSpeed says root). Drop the score or attribute it to the CVE record without a link; say \"exploited in the wild per LiteSpeed (2026-06-01)\"."
- entry: "2026-06-16/cve-2026-48611-cve-2026-48612-phpbb-unauthenticated-authenti"
  banned_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-48611"
  replacement: none
  url: "https://pentest-tools.com/research/phpbb-authentication-bypass"
  publisher: "Pentest-Tools.com security research team (discoverer write-up; already cited on the entry)"
  date: "2026-06-08"
  passage: "CVE-2026-48611 (PTT-2026-004) is an authentication bypass in phpBB that lets an attacker get a valid session as any active user, including administrators, with a single unauthenticated HTTP request."
  note: "Clause: \"CVE-2026-48611 (NVD CVSS 9.8) is an improper-authentication flaw in the OAuth implementation that allows account hijacking - including admin accounts - even when OAuth is not configured, reachable by a single unauthenticated request given only a target username (publicly visible via the member list)\". PARTIAL. The existing Pentest-Tools write-up (fetched; dated 2026-06-08 on the entry) carries: single unauthenticated request, default installs, any active user including administrators, target username enumerable because \"the member list (memberlist.php) is publicly accessible\", affected \"phpBB <= 3.3.16 and 4.0.0-a2\", fixed \"phpBB 3.3.17 - June 6, 2026\". STATED ONLY BY THE BANNED PAGE (NVD record, read not cited): \"CVSS 9.8\" (a CVSS 3.0 secondary score from the CNA support@hackerone.com) and the sentence \"Improper authentication checks in the OAuth implementation allow account hijacking even when OAuth is not configured or enabled\". Pentest-Tools instead scores it \"9.4 Critical\" (its own CVSS v3.1 vector AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L) and describes the mechanism as the Apache auth provider not comparing PHP_AUTH_PW, reached via the login_link route; the Aikido technical write-up (https://www.aikido.dev/blog/authentication-bypass-phpbb-technical-writeup, fetched, 2026-07-04) explains that the login_link feature exists for OAuth account linking and lets the attacker force auth_provider=apache, which reconciles the \"OAuth\" wording. phpbb.com announcement (t=2672170 / p=16116763) returned 403 on every transport. Narrow to: single unauthenticated request, default install, any username incl. admin, fixed in 3.3.17; drop \"NVD CVSS 9.8\" or state Pentest-Tools' 9.4."
