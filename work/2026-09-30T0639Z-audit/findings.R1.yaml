- entry: "2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac"
  banned_url: "https://nvd.nist.gov/vuln/detail/CVE-2023-33241"
  replacement: new
  url: "https://www.fireblocks.com/blog/gg18-and-gg20-paillier-key-vulnerability-technical-report"
  publisher: "Fireblocks research team (Daniel Evans), 'GG18 and GG20 Paillier Key Vulnerability [CVE-2023-33241]: Technical Report'"
  date: "2023-08-09"
  passage: "If exploited, the vulnerability allows a threat actor interacting with the signatories in the MPC protocol to steal their secret shards and ultimately obtain the master secret key."
  note: "Clause: \"The TSSHOCK vulnerability class - CVE-2023-33241 (Fireblocks GG18/GG20 Paillier-ZK-proof flaw) and related GG20/ECDSA-MPC research - showed that malformed or missing zero-knowledge proofs during GG18/GG20 keygen can leak private-key shards across multiple rounds\". Fireblocks' own report (title carries CVE-2023-33241) states the flaw: \"parties not checking to see if the attacker's Paillier modulus, denoted N, has small factors or that it is a biprime\", fix \"a key-generation process that can detect maliciously formed Paillier modulus using a suitable ZK proof\", and that leakage of key shards occurs in the first round (Case 1, 16 iterations) or over many signature attempts (Case 2). Naming caveat: TSSHOCK is Verichains' name for a separate set of three key-extraction attacks (https://www.verichains.io/tsshock/, fetched, page dated 2023-03-28, released at Black Hat USA 2023); the Verichains page's 'Updated on August 10, 2023' note credits a range-proof-bypass attack to Fireblocks' separate Black Hat USA 2023 talk and the Verichains page never mentions CVE-2023-33241. CVE-2023-33241 is the Fireblocks finding (report dated 2023-08-09); the fetched sources do not show it belongs to the Verichains TSSHOCK trio, so describe them as related but separate disclosures. The THORChain-specific claim (GG20 flaw) stays with the cited CryptoTimes/TRM sources; nothing on the Fireblocks page ties CVE-2023-33241 to THORChain."
