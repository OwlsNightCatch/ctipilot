- entry: "2026-09-17/cve-2026-58704-google-pixel-modem-zero-click-eop"
  banned_url: "https://cveawg.mitre.org/api/cve/CVE-2026-58704"
  replacement: existing
  url: "https://techcrunch.com/2026/09/16/google-says-some-pixel-phone-owners-were-hacked-in-zero-day-attacks/"
  publisher: "TechCrunch (Zack Whittaker), already cited on the entry"
  date: "2026-09-16"
  passage: "The bug can be exploited silently and without any interaction from the phone owner in what’s known as a “zero-click” attack, meaning a victim does not need to click on a link or open a file."
  note: "Clause: \"the CVE's own MITRE record describes it as a possible permission bypass due to a logic error, reachable with no additional execution privileges and no user interaction needed for exploitation - a zero-click privilege escalation out of the modem's sandbox into the broader device\". Two existing sources together carry it: (1) TechCrunch 2026-09-16 (fetched): the passage above plus \"Exploiting the bug could allow an attacker to gain access beyond the sandboxed walls of the modem and into the broader phone’s data, a vulnerability known as privilege escalation\" (TechCrunch itself relies on the NVD description, so attribute it as TechCrunch's reading); (2) the CISA KEV JSON feed already on the entry (fetched via cisa-kev): vulnerabilityName \"Google Pixel Improper Authorization Vulnerability\", dateAdded 2026-09-16, dueDate 2026-09-19, shortDescription \"Google Pixel devices contain an improper authorization vulnerability in the cellular modem. A logic error may allow an attacker to bypass permission checks and escalate privileges.\" (cwes CWE-693). The Google Pixel bulletin (existing; loads only with a cookie jar - the bridge hits an OAuth 302 loop) lists CVE-2026-58704, A-484011314, EoP, High, Modem, published September 15, 2026. STATED ONLY BY THE BANNED PAGE: the CVE-record boilerplate \"no additional execution privileges needed\" - drop or fold into \"zero-click\" as reported by TechCrunch."
- entry: "2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce"
