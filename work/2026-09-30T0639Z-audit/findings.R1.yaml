  banned_url: "https://cveawg.mitre.org/api/cve/CVE-2026-73749"
  replacement: existing
  url: "https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/"
  publisher: "BleepingComputer (reading of HPE bulletin HPESBNW05134)"
  date: "2026-09-03"
  passage: "Tracked as CVE-2026-73749, the security issue is a buffer overflow that allows unauthenticated remote attackers to send specially crafted packets to an affected daemon process, achieving code execution with elevated privileges."
  note: "Clauses: (1) CVE-2026-73749 (CVSS 9.8) is a buffer overflow in an unnamed AOS-CX daemon triggered by crafted packets from an unauthenticated remote attacker -> RCE with elevated privileges; (2, Correction) HPE's CVE record states affected AOS-CX as 10.18.0000 up to and including 10.18.0001, and BleepingComputer agrees. Existing BleepingComputer article (fetched) carries (1) minus the score, and the bulletin version list: \"10.18.0001 -> upgrade to 10.18.1002+\", \"10.17.1021 and earlier -> 10.17.1030+\", \"10.16.1051 and earlier -> 10.16.1060+\", \"10.13.1180 and earlier -> 10.13.1190+\", \"10.10.1180 and earlier -> 10.10.1181+\" (10.10.1181 End of Maintenance; no exploitation/PoC known at publication). The CVSS 9.8 is carried by the existing NCSC-NL advisory NCSC-2026-0340 (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0340; CSAF read via ncsc-nl csaf, published 2026-09-03: CVE-2026-73749 baseScore 9.8, \"Multiple vulnerabilities in an AOS-CX daemon enable an unauthenticated remote attacker to send crafted packets that may result in remote code execution with elevated privileges.\"). STATED ONLY BY THE BANNED PAGE: the explicit lower bound \"10.18.0000\" of the 10.18 branch range. Caution for the Correction: existing CERT-FR AVI-1104 (fetched, 2026-09-02) lists \"AOS-CX versions 10.18.x antérieures à 10.18.1002\" as affected, i.e. every 10.18.x build below 10.18.1002, which is wider than \"10.18.0000 to 10.18.0001\"; the safest wording is \"10.18.x before 10.18.1002 (CERT-FR); BleepingComputer lists the branch as 10.18.0001\"."
- entry: "2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover"
