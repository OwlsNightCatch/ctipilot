  publisher: "Cisco PSIRT (cisco-sa-sdwan-arbfw-c2rZvQ)"
  date: "2026-06-15"
  passage: "A vulnerability in the web UI of Cisco Catalyst SD-WAN Manager, formerly SD-WAN vManage, could allow an authenticated, remote attacker to create a file or overwrite any file on the filesystem of an affected system."
