- entry: "2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli"
  banned_url: "https://abw.gov.pl/pl/cyberbezpieczenstwo/"
  replacement: new
  url: "https://www.abw.gov.pl/download/24/4877/InternalSecurityAgencyABW2024-2025Selectedactvities.pdf"
  publisher: "ABW (Internal Security Agency), report 'Internal Security Agency ABW 2024-2025 - Selected activities' (English edition; news page dated 2026-05-06)"
  date: "2026-05-06"
  passage: "In 2025, security breaches were reported at water treatment plants in the following towns: Jabłonna Lacka, Szczytno, Małdyty, Tolkmicko and Sierakowo. By gaining access, in some cases, to industrial control systems, the attackers were able to alter the technical parameters of the equipment"
  note: "Clause: ABW disclosed that five water treatment facilities' OT was breached and technical/pump parameters altered. PDF carries the five towns, ICS access and altered equipment parameters, and separately says hacktivists exploited poor password policies and internet-exposed device management panels. It does NOT say 'pump settings', manual overrides or that no supply loss occurred, and it lists APT28/APT29/UNC1151 in a separate APT-groups paragraph without tying them to the water intrusions (the entry's tri-attribution to those three for the water campaign is not stated in the report); report publication date is 2026-05-06 per the ABW news page https://www.abw.gov.pl/pl/aktualnosci/2815,Agencja-Bezpieczenstwa-Wewnetrznego-2024-2025-Wybrane-aktywnosci.html, not 2026-05-07; the document is 'Agencja Bezpieczeństwa Wewnętrznego 2024-2025. Wybrane aktywności' (a two-year activity report, not an 'annual report'); Polish edition at https://www.abw.gov.pl/download/24/4867/ABWraport20242025.pdf (linked from the ABW news page, not fetched separately); cited landing page returns HTTP 404."
- entry: "2026-05-08/qilin-ransomware-hits-die-linke-germany-1-5-tb-claimed-dpa-n"
  banned_url: "https://www.heise.de/news/"
  replacement: new
  url: "https://www.heise.de/en/news/Qilin-Left-Party-reports-Russian-ransomware-attack-11227232.html"
  publisher: "Heise Online (Falk Steiner), 'Qilin: Left Party reports Russian ransomware attack'"
  date: "2026-03-27"
  passage: "The party has filed a criminal complaint due to the incident; it has not yet been definitively clarified which internal data has been compromised."
  note: "Clause: Die Linke hit by Qilin ransomware. Heise (the entry's named publisher) carries the incident, Qilin suspicion, criminal complaint and unaffected member file, but predates the 2026-04-01 leak-site listing and carries neither the 1.5 TB claim nor the state-DPA notification. BleepingComputer 2026-04-03 (https://www.bleepingcomputer.com/news/security/die-linke-german-political-party-confirms-data-stolen-by-qilin-ransomware/) and The Record 2026-04-06 (https://therecord.media/hackers-threaten-to-leak-german-political-party-data) both fetched: Qilin listed the party on 2026-04-01 with no samples, and the party has not confirmed data was stolen ('impossible to assess whether and to what extent this will succeed or has already occurred') - so 'confirmed ... encrypted and exfiltrated' overstates it; incident date is 2026-03-26/27, not April. The 1.5 TB figure and state-DPA notification are not stated in any fetchable page I could reach (cybernews/securityboulevard/die-linke.de returned 403): narrow or drop those two claims."
- entry: "2026-05-08/eurail-breach-308-777-travellers-notified-three-months-after"
  banned_url: "https://nos.nl/artikel/"
  replacement: new
  url: "https://www.bleepingcomputer.com/news/security/eurail-says-december-data-breach-impacts-300-000-individuals/"
  publisher: "BleepingComputer (Sergiu Gatlan)"
  date: "2026-04-09"
  passage: "Eurail B.V., a European travel operator that provides digital passes covering 33 national railways, says attackers stole the personal information of over 300,000 individuals in a December 2025 data breach."
  note: "Clause: Eurail breach, 308,777 travellers, passport numbers/IBANs/DiscoverEU data, December 2025, delayed notification, Dutch DPA and EDPS reviews. BleepingComputer (which cites Eurail's own breach-notification letters and the Oregon AG filing) carries: December 2025 breach, 308,777 individuals, passport numbers, and Eurail's February disclosure of IBANs/health data/DiscoverEU exposure; its text also gives 'transferred files ... on December 26, 2025', 'on February 25, 2026, determined that they contained some of your information' and notification letters sent 'on March 27' - i.e. notification began 2026-03-27, not 'late April', and 308,777 is the count given in Eurail's Oregon Attorney General filing. NOT stated by it or any page I reached: 'Dutch DPA and EDPS have opened reviews' - the European Commission DiscoverEU notice (https://youth.europa.eu/news/updated-data-security-incident-affecting-discovereu-travellers_en, fetched, 2026-01-13) says only 'The European Data Protection Supervisor was notified about the personal data breach' and lists IBAN/passport/health data as possibly involved. No nos.nl article on Eurail exists in search results; the composer should narrow the review claim."
