  publisher: "JFrog (vendor security advisories, already cited on the entry)"
  date: "2026-07-27"
  passage: "[CVE-2026-42016](https://www.cve.org/CVERecord?id=CVE-2026-42016) | High | CWE-863 Incorrect Authorization | 27 Jul 2026 | 27 Jul 2026"
  note: "Clause: \"JFrog disclosed the two flaws separately and weeks apart, labeling each only High without a numeric score; the CNA's own submitted CVSS 3.1 base scores - 8.1 for CVE-2026-42016 and 7.5 for CVE-2026-42018 - are recorded in the MITRE CVE record for each\". PARTIAL. The existing JFrog vendor advisory page (fetched; both entries in one page) supports the first half of the clause: JFrog labels each flaw only \"High\" with no numeric CVSS (table columns: CVE Identifier | Severity | CWE Weakness Type | Date Published | Date Updated), disclosed separately (CVE-2026-42016 published 27 Jul 2026; CVE-2026-42018 published 12 Aug 2026, updated 13 Aug 2026), so \"weeks apart\" holds. STATED ONLY BY THE BANNED PAGES (MITRE CVE records, read not cited): the CNA-submitted CVSS 3.1 base scores 8.1 (CVE-2026-42016, vector AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N) and 7.5 (CVE-2026-42018, vector AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N); no permitted page I could reach carries them (Wiz Research 2026-09-10, THN 2026-09-11, BSI WID-SEC-2026-2808 (bsi-csaf) and the CISA KEV feed (both added 2026-09-11, cwes CWE-863 / CWE-287) publish no numeric score for these two CVEs; an aggregator, strix.ai, shows a different number for 42016, so do not use it). Rewrite as \"JFrog rates both flaws High without a numeric score\" and drop the 8.1 / 7.5 figures (or attribute them to the CVE records without a link). Both CVEs are KEV listed with dateAdded 2026-09-11."
