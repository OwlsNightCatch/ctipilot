    Yes: six CVSS 10.0 flaws in WebLogic Server, Access Manager, Forms, Internet Directory, Platform Security for Java and Hyperion Financial Management, plus forty-four CVSS 9.8 flaws spanning the same
    Fusion Middleware product line far more broadly (Access Manager, Forms, Internet Directory and Platform Security for Java again, plus Data Integrator, Identity Manager, JDeveloper, WebCenter Enterprise
    Capture/Portal/Sites, WebLogic Server and Service Delivery Platform), plus E-Business Suite, Hyperion Financial Management, Business Intelligence/BI Publisher, Enterprise Manager, Communications Unified
    Assurance and Product Lifecycle Analytics. No exploitation is reported for any of the fifty. The release is Oracle''s off-quarter patch line, which a calendar built only on the quarterly dates will
    miss.'
