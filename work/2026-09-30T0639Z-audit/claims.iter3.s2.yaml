  entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
  surface: body
  kind: cited
  text: Improper handling of shared page fragments during skb coalescing lets an unprivileged local user modify read-only file contents in the kernel page cache and gain root (
