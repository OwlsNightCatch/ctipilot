- claim_id: e38f86b643
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: uncited
  text: 'On the victim host, both backdoors sat dormant on disk from March 18 to March 29, 2026, then launched the moment the developer opened a specific Cursor IDE workspace: the Cursor process itself
    spawned both implants directly, which began beaconing to their command-and-control servers within two seconds, before FLATROOF stripped the macOS quarantine attribute from ROOFDECK and set its executable
    bit moments later, a Gatekeeper bypass.'
- claim_id: 560fa6b051
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: uncited
  text: FLATROOF is a Rust ARM64 backdoor supporting shell, kill, upload and stop commands, paired with a Python data-harvesting module that pulls Chrome/Brave/Firefox/Safari data, Terminal history, installed-application
    lists, `ps aux` output, `system_profiler` output and a raw copy of `login.keychain-db`, exfiltrated via a hardcoded Telegram bot.
- claim_id: 13663f0625
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: uncited
  text: 'ROOFDECK is the more capable second-stage implant: on first run it queries a public Nostr relay-status API plus a hardcoded relay list, searches Nostr relays for an operator profile matching a
    configured public key, and reads that profile''s "website" field as its live command-and-control URL, a decentralized dead-drop resolver that survives takedown of any single C2 domain.'
- claim_id: 3ef920fc1c
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: derived
  text: '**Defender takeaway:** any organization whose engineering staff use Terraform or other HashiCorp tooling and could plausibly be approached through fake technical-recruiting outreach should treat
    an unfamiliar or newly-cloned repository''s lockfile as untrusted input — check the source registry a lockfile''s providers resolve to before running `terraform init`, since a lockfile can silently
    redirect a trusted command to attacker infrastructure.'
- claim_id: 8ef1a2bc09
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: derived
  text: Any macOS fleet should alert on `xattr -rd com.apple.quarantine` combined with a `chmod +x` on the same file in immediate succession, and on outbound connections to Nostr relay infrastructure from
    a host with no legitimate reason to run a Nostr client.
- claim_id: 12a34c66fc
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: derived
  text: '**Triage:** developers legitimately run `terraform init` against new or unfamiliar repositories constantly, so the command itself is not the signal — the discriminator is the lockfile''s declared
    provider source pointing to a domain that is not `registry.terraform.io` or a known private registry the organization operates.'
