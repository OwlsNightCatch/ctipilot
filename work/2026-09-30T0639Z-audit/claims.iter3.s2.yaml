- claim_id: a24ed2a7d0
  entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
  surface: actions[0]
  kind: frontmatter
  text: '**Patch CVE-2026-46300 on multi-tenant Linux hosts, container nodes and CI runners.** Apply the distribution kernel update and reboot. Until then, where IPsec is not in use, block and unload the
    `esp4`, `esp6` and `rxrpc` modules (this breaks IPsec), then drop the page cache so any binary already modified in memory reloads from disk.'
