- claim_id: e546dc60ec
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: uncited
  text: 'On Microsoft Exchange servers the group deploys the GhostContainer backdoor, a .NET assembly that incorporates the Neo-reGeorg tunnel, an exploit component for CVE-2020-0688, and the `GhostWebShell`
    class from the ysoserial utility; Kaspersky could not determine how the backdoor reached the servers but assesses with high confidence that delivery reused a technique it had already documented: extracting
    Exchange''s own ASP.NET machine keys, then overwriting the `VIEWSTATE` framework parameter and injecting a payload into it to launch the backdoor in memory.'
- claim_id: 9d85cd47c1
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: uncited
  text: Once running, the backdoor evades detection by patching addresses in `amsi.dll` and `ntdll.dll`, blinding both the Antimalware Scan Interface and Windows Event Logging.
- claim_id: 08e869455d
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: uncited
  text: For network access, NightEagle abuses Microsoft's own legitimate dev-tunnels feature (`*.devtunnels.ms`), a service meant to publish local developer web services to the internet, to expose port
    3389 (RDP) outward on the compromised host, then layers `rdp2tcp`, a public RDP-virtual-channel TCP tunneling tool, inside that RDP session, a combination Kaspersky states lets the group maintain network
    access using legitimate services, without opening any additional suspicious port.
- claim_id: 67dbb04232
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: uncited
  text: For lateral movement and privilege escalation, NightEagle exploited CVE-2019-0708 (BlueKeep) in one incident to create and elevate a local account into the Administrators and Remote Desktop Users
    groups, used Impacket's `atexec` to set scheduled netsh `portproxy` rules for internal port forwarding, and requested Kerberos tickets carrying a non-standard `Forwardable`/`Proxiable`/`Renewable` flag
    combination.
- claim_id: 0beb087aa6
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: derived
  text: '**Defender takeaway:** any environment permitting outbound access to `*.devtunnels.ms` should treat an unexpected dev-tunnels connection from a server or workstation as equivalent to an unauthorized
    reverse-tunnel opening; rdp2tcp''s presence inside an RDP session is detectable via Windows event IDs 132 and 148 in `Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational.evtx`, where the RemoteFX
    virtual-channel name reads "rdp2tcp" or a random string in place of a legitimate RDS channel name.'
- claim_id: 39f0296c72
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: derived
  text: '**Triage:** Microsoft dev-tunnels traffic to `*.devtunnels.ms` is legitimate on developer workstations running Visual Studio or the Dev Tunnels CLI — the discriminator is the host class: a production
    server, domain controller, or non-developer endpoint establishing an outbound dev-tunnels connection has no legitimate reason to do so.'
