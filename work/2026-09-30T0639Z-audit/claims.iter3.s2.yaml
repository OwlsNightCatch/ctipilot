- claim_id: 3c2c91f00c
  entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
  surface: summary
  kind: frontmatter
  text: 'CVE-2026-32202 is left over from Microsoft''s February fix for CVE-2026-21510, which APT28 exploited with crafted LNK files: Windows Explorer still opens an SMB connection to an attacker server
    when it renders the folder holding the shortcut, sending the user''s Net-NTLMv2 hash for relay or cracking. Microsoft patched it on 2026-04-14, marked it exploited later and re-released the fix on 2026-07-28,
    recommending the July 2026 updates. CISA listed it on 2026-04-28. No source ties this CVE''s exploitation to APT28 itself.'
