- claim_id: c10715aa8e
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: immediate_action
  kind: frontmatter
  text: 'Patch and hunt JFrog Artifactory now — confirmed admin-takeover chain, backdoors already dropped: Wiz Research confirms active, ongoing exploitation of this two-CVE chain against self-hosted JFrog
    Artifactory since 15 August 2026, reaching full administrative control and, in multiple cases, a dropped Rust-based backdoor with C2 capability. Six weeks after disclosure, most organizations running
    Artifactory still have at least one vulnerable instance. Upgrade every instance to 7.133.11 or later, JFrog''s only fixed build for CVE-2026-42016, on a build that also carries the CVE-2026-42018 fix
    for its branch. Wiz lists 7.133.29, 7.146.38 and 7.161.20 for those branches, above JFrog''s own table. Wiz''s lower-branch builds 7.111.21, 7.117.28 and 7.125.20 stay inside JFrog''s affected range
    for CVE-2026-42016. Then search access logs for the chain''s own signature: an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by a POST to /access/api/v1/tokens from the same
    client. Any hit is a confirmed compromise, not a near-miss. Revoke all tokens, reset the Access token signing key and certificate, audit for administrator accounts you did not create, remove unauthorized
    Groovy plugins and restart the JVM to clear any in-memory implant.'
- claim_id: 7706e2c8e6
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[0]
  kind: frontmatter
  text: 'Upgrade every self-hosted JFrog Artifactory instance to a build that closes both CVEs: 7.133.11 or later for CVE-2026-42016, which JFrog names as its only fixed build, and the CVE-2026-42018 fix
    for the branch, where Wiz''s corrected builds (7.133.29, 7.146.38, 7.161.20) sit above JFrog''s table. Wiz''s 7.111.21, 7.117.28 and 7.125.20 are below 7.133.11, so instances on those branches remain
    vulnerable to CVE-2026-42016 and must move to 7.133.11 or later.'
- claim_id: 83e925117d
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[1]
  kind: frontmatter
  text: 'On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ (trailing slash) followed
    within minutes by a POST to /access/api/v1/tokens from the same client. That two-request sequence is the chain''s signature. Where found, treat the instance as compromised: revoke all tokens, reset
    the Access token signing key and certificate, audit /api/security/users and /access/api/ui/users for administrator accounts you did not create, remove any Groovy plugin you did not deploy, and restart
    the JVM to clear an in-memory implant.'
