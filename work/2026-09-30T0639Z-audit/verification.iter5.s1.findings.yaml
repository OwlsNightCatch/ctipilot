- code: F3
  category: claim-not-supported
  section: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  item: 'body, last sentence of the IT-worker paragraph (claim f1fc9068a4): "The advisory records two prior cases of IT-worker escalation beyond simple wage fraud: one worker extorted an employer over its own source code after a payment dispute, and another defaced and disabled a hiring company''s website."'
  url_or_quote: https://www.ic3.gov/CSA/2026/260918.pdf
  summary: '(low confidence) Advisory section 2(2) (and The Record, which quotes it): "a North Korean IT worker extorted a company over payment and published its proprietary source code online". The entry says the extortion was "over its own source code after a payment dispute", drops that the code was published, and carries no inline citation (the preceding cited sentence is about the laptop-farm definition). Use the advisory wording and cite the PDF.'
- code: F3
  category: claim-not-supported
  section: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
  item: 'Correction (this run, claim 1d7995ab61): "It does not use `eval` or `new Function`, which the sandbox forbids because they would run free of its constraints. It obtains the Function constructor through `Class.create.constructor` and runs it during a `gs.include()` evaluation."'
  url_or_quote: https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/
  summary: '(low confidence) Searchlight: "eval and new Function(...)() are forbidden" inside the script sandbox, and its gadget sets Object.clone to Class.create.constructor (the Function constructor) so that gs.include() "will essentially evaluate ItemViewElementsProvider.prototype = Function(code)". The chain therefore does reach new-Function-equivalent execution, only indirectly. Reword to say it does not write eval or new Function in the sandboxed script (they are blocked) and reaches the Function constructor through a gadget that gs.include() invokes outside the sandbox.'
- code: F3
  category: claim-not-supported
  section: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  item: 'headline: "Kaspersky GERT: a Group Policy Object was the whole ransomware on Windows, and it left nothing for an EDR to alert on until the wallpaper changed"'
  url_or_quote: https://securelist.com/tr/payload-ransomware-via-group-policy/121335/
  summary: '(low confidence) Kaspersky: "the majority of endpoint detection and response tools is designed not to inspect" Group Policy, but its "Detection by Kaspersky solutions" section says audit-driven GPO creation and modification "generates a large number of characteristic artifacts on the domain controller, enabling Kaspersky Endpoint Detection and Response Expert to promptly alert the user to anomalies" and ships EDR rules (gpo_creation, setting_the_gpcmachineextensionname_attribute). The entry''s own Improvement section already concedes the attack is not invisible to file-integrity tooling. The headline keeps the absolute EDR claim this run corrected elsewhere. Narrow to "no malicious binary or process for endpoint tooling to flag".'
- code: F3
  category: claim-not-supported
  section: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  item: 'Update 2026-09-25 section (earlier-run text, still in the body): "Anthropic identified and banned the account associated with the campaign after determining that Hermes''s operator ran it on an earlier Claude model, Opus 4.6, whose safeguards attempts on newer Claude releases did not get past"'
  url_or_quote: https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records
  summary: '(low confidence) Computing UK reports as separate statements that the attacker used Claude Opus 4.6, that attempts on newer Claude models were rejected, and that "Anthropic said it had identified and banned the account linked to the attacks". It does not say Anthropic banned the account "after determining" the Opus 4.6 use. Drop the causal link. Body-only fix; the 09-25 record is untouched.'
- code: F3
  category: claim-not-supported
  section: 2026-06-09/cve-2026-50751-check-point-security-gateway-ikev1-vpn-authen
  item: 'Update 2026-06-17 section (earlier-run text): "NCSC-NL updated its advisory ... to note that public proof-of-concept code is now available for the Check Point Security Gateway IKEv1 authentication bypass (CVE-2026-50751, CVSS 9.3), increasing the probability of exploitation ([NCSC-NL, 2026-06-16])"'
  url_or_quote: https://advisories.ncsc.nl/advisory?id=NCSC-2026-0179
  summary: '(low confidence) The NCSC-NL advisory lists "CVE-2026-50751 - CVSS (v4) 6.9"; the 9.3 is Check Point''s score (Check Point blog table). The citation therefore does not carry the figure it terminates, and the two scores are not reconciled. Attribute 9.3 to Check Point and note NCSC-NL''s v4 6.9, or drop the parenthetical. A body-section fix is enough; the 2026-06-17 record stays as is.'
- code: F4
  category: hallucinated-fact
  section: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  item: 'Update 2026-09-29 section (edited in place this run, sentence left unchanged): "Multiple sources cited by Krebs describe a collective calling itself ScatteredLapsussHunters ... as having taken effective control of ShinyHunters'' operations and driven its 2026 pivot toward high-risk, non-financially-motivated targets including the FBI and Cl0p"'
  url_or_quote: https://krebsonsecurity.com/2026/09/dutch-police-arrest-reformed-hacker-in-shiny-hunters-investigation/
  summary: '(low confidence) Krebs says sources described "a major pivot away from the more measured tenor of the hacking gang''s operations" and that remaining members were "extorting" Cl0p. He does not call the targets non-financially-motivated. This run''s Correction removed the same "coercive rather than financial" characterization elsewhere in the section, and BleepingComputer describes the Cl0p action as a threat to extort the gang. Replace with Krebs''s wording ("high-risk", "pivot away from the more measured tenor").'
- code: F4
  category: hallucinated-fact
  section: 2026-09-24/openai-agent-australia-medicare-portal-breach
  item: 'sourcing_note: "The Record''s independent review of Internet-Archive-preserved portal code and Transluce''s own published analysis materially undercut the \"unauthorized access\"/\"hack\" framing without either government or vendor issuing a revised account."'
  url_or_quote: https://therecord.media/openai-australia-breach-cyber
  summary: 'The Record, ABC and CNN report Transluce as finding genuine offensive techniques (SQL injection, path traversal, command injection, anti-bot bypass) against AIHW and two other sites, and ABC quotes Transluce calling the AIHW attempt "part of the first reported instance of agents hacking a government". Only The Record''s archived-code review undercuts the Medicare "hack" framing; Transluce''s analysis conflicts with the "entirely normal" remark about AIHW, which the main text now says. The reader-facing sourcing note contradicts the rewritten summary and Correction. State that The Record''s archival review undercuts the Medicare framing and that Transluce''s analysis bears on the AIHW and other sites. (sourcing_note is not in this run''s declared fields; add it.)'
