  - claim_id: f8c41e60df
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "A Huntress researcher was targeted after DEFCON by an X account impersonating a CoinDesk marketing executive, who sent a legitimate Google Doc carrying a custom Google Apps Script sidebar ("
    urls: ["https://www.huntress.com/blog/defcon-phishing-google-doc-malware"]
  - claim_id: 639e531de5
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "The sidebar runs client-side with no OAuth consent prompt; per Huntress's own recap of the incident, merely opening the document while signed in — no click, no download — was enough for it to silently report the viewer's public IP address, geolocation, browser, and whether a MetaMask, Phantom, Tron or Solana wallet extension was installed, beaconing every action through the Telegram Bot API ("
    urls: ["https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows"]
  - claim_id: 31235732be
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "In a later message, the same actor sent a second document link, this time via DropBox DocSend, that routed macOS victims to another host serving the same AMOS payload and told Windows victims to install a DocSend-branded desktop installer signed with a second stolen certificate, from Discord Inc., whose signature did not validate ("
    urls: ["https://www.huntress.com/blog/defcon-phishing-google-doc-malware"]
  - claim_id: 4056387b78
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "Per Huntress's own recap, the firm reconstructed the sample's own command-and-control registration protocol from its bundled `@sentry/electron` module and queried the live infrastructure directly ("
    urls: ["https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows"]
  - claim_id: 2f52dd2bd8
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "The first, NetSupport Manager — a legitimate remote-monitoring tool reconfigured to redirect data to attacker infrastructure and disable its own chat/connect/disconnect alerts — carries persistence for all three payloads: a kernel-mode keyboard-filter driver, a Windows service, a Winlogon modification and its own registered COM object ("
    urls: ["https://www.huntress.com/blog/defcon-phishing-google-doc-malware"]
  - claim_id: 4878dff544
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: cited
    text: "The most novel component is that second payload, the TLS-intercepting local proxy itself: disguised as a Lenovo driver package and signed with a genuine stolen Lenovo certificate — the third of the three abused code-signing certificates, after the Norwegian and Discord ones — it hollows `MsBuild.exe` and generates its own self-signed certificate authority presenting itself as \"Google Trust Services CN=WR3\" plus a fabricated `www.virustotal.com` leaf certificate, installs that CA into the system root store, adds a hosts-file entry and a local-proxy firewall rule, and thereby locally answers HTTPS connections with fabricated \"clean\" results and no certificate warning for any domain the operator chooses — crypto-wallet sites, antivirus update checks, or anything else ("
    urls: ["https://www.huntress.com/blog/defcon-phishing-google-doc-malware"]
  - claim_id: 141b5be216
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "A fake \"decryption failure\" overlay then delivered OS-specific ClickFix remediation instructions, each offering a choice between pasting a clipboard command or downloading a file manually."
  - claim_id: 247884b08b
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "On macOS, the pasted command launched a piped zsh chain that never actually delivered a payload in Huntress's own testing — the fetched URL looped through repeated redirects until the browser gave up, so the actor's evident intent for that path went unconfirmed; the manual-download option instead led to a disk image bundling its own Gatekeeper-bypass instructions and password prompt, and running it delivered a confirmed AMOS-family stealer harvesting browser, crypto-wallet, Telegram, Apple Notes, cookie and login-keychain data, plus a LaunchDaemon-installed backdoor capable of arbitrary remote commands and of turning the host into a SOCKS5 proxy."
  - claim_id: cc5c9600cc
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "On Windows, pasting the ClickFix command launched an encoded PowerShell command that fetched a loader which pulled down three further payloads; by the time Huntress analyzed the kit all three had already gone offline, and their existence is known only because copies had reached VirusTotal — no certificate or further technical detail on this particular set was recoverable."
  - claim_id: 45d59ca4e5
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "Windows victims who instead chose the manual download were led down an entirely separate route: the same fake decryption-failure message told them to update a \"Google API Connector,\" an application signed with a certificate belonging to a small Norwegian company (either stolen or fraudulently issued) that deployed via abuse of Microsoft's ClickOnce feature — the first of the three stolen code-signing certificates Huntress recovered across the whole campaign."
  - claim_id: 28075d2ad2
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "That installer's own DocSend flow was itself a non-functional distraction — a five-screen fake onboarding carousel using genuine Dropbox marketing pages that installed nothing."
  - claim_id: 383a196adf
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "The third, the Ledger-wallet implant, reuses the second payload's disguise and technique."
  - claim_id: 83f497d833
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "Because the certificate authority is regenerated per infected host, blocking a specific certificate thumbprint achieves nothing."
  - claim_id: 89cd892771
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: uncited
    text: "The interception process itself dies at reboot, but the installed root CA, the hosts-file entry and the firewall rule all persist across reboots untouched."
  - claim_id: ad780a0626
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** hunt for unexpected certificate authorities in the Windows or macOS system trust store claiming to be a major public CA (Google Trust Services, DigiCert, and similar) that were not provisioned by your own PKI or MDM — a rogue self-signed CA sitting in the trust store is the persistence artifact this technique leaves behind even after the active interception process is gone."
  - claim_id: b432ce7bdf
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: derived
    text: "Cross-reference unexplained hosts-file entries and orphaned local-proxy firewall rules against known-good baselines rather than certificate thumbprints, since the CA regenerates per host."
  - claim_id: 3a0423cdab
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: derived
    text: "Any organization whose staff attend security conferences should treat unsolicited, previously-unknown-contact Google Docs carrying custom Apps Script sidebars as a live reconnaissance vector requiring no click at all."
  - claim_id: 94ac8bb9d1
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: derived
    text: "**Triage:** a locally-installed root CA is not automatically malicious — some legitimate enterprise MDM and TLS-inspection proxies do this deliberately."
  - claim_id: ac3edc7701
    entry: 2026-09-21/conference-phishing-rogue-root-ca-mitm-persistence
    surface: "body"
    kind: derived
    text: "The discriminator is provenance: a root CA your own PKI/MDM inventory does not recognize as provisioned by it, especially one impersonating a well-known public CA's name, is the signal; one your MDM issued is not."
  - claim_id: db0d126433
