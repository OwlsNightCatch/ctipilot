  - claim_id: fb648dcc5e
    entry: 2026-05-16/node-ipc-npm-package-backdoored-via-expired-domain-account-t
    surface: "body"
    kind: uncited
    text: "The malicious payload is an 80 KB obfuscated Immediately-Invoked Function Expression appended to `node-ipc.cjs` (the CommonJS bundle); it fires unconditionally on every `require('node-ipc')` via `setImmediate()`, and notably **does not use an npm lifecycle hook** (`preinstall`, `postinstall`), which lets it bypass `npm audit` and conventional install-time scanning that only inspects lifecycle-script execution."
  - claim_id: a6540a216f
    entry: 2026-05-16/node-ipc-npm-package-backdoored-via-expired-domain-account-t
    surface: "body"
    kind: uncited
    text: "Four-layer obfuscation (string-array shuffling, control-flow flattening, dead-code injection, custom reversed-nibble base-16 encoding) defeats static signature analysis."
  - claim_id: b4c75475d6
    entry: 2026-05-16/node-ipc-npm-package-backdoored-via-expired-domain-account-t
    surface: "body"
    kind: uncited
    text: "The collector enumerates approximately 90 file-path patterns covering AWS / Azure / GCP / OCI / DigitalOcean / Hetzner / Fly / Vercel credentials and configs, SSH private keys, Kubernetes service-account tokens, GitHub CLI configurations, npm and Git tokens, Terraform state, `.env` files, shell history, and macOS Keychain databases; data is GZIP-compressed then exfiltrated over two simultaneous channels — DNS TXT queries to the `bt.node.js` suffix and HTTPS POST to an attacker domain styled to look like Azure static hosting."
