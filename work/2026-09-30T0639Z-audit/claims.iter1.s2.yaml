    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "Detection priorities: alert on Okta `system.multifactor.factor.setup` events not preceded by a user-initiated session; flag M365 audit `FileAccessed` events with `AppAccessContext.ClientAppId == d3590ed6-52b3-4102-aeff-aad2292ab01c` AND a user-agent containing `python-requests` or `PowerShell`; require Conditional Access compliant-device for Graph API access from administrative accounts; and move helpdesk-privileged accounts to FIDO2 phishing-resistant MFA."
