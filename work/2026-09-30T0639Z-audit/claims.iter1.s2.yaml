    surface: "body"
    kind: uncited
    text: "Five of them are the single-sign-on, directory and application-server tiers that Swiss federal, cantonal and communal estates run legacy identity services on, and a Scope Changed rating on an authentication engine means the compromise does not stay inside the component that carries the flaw."
  - claim_id: bc603bd0f3
