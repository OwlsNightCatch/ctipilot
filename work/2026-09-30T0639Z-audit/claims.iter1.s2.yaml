    text: "Fifty credential-free, no-interaction flaws span Oracle's middleware, ERP, BI and telco-assurance lines in an off-quarter patch release"
  - claim_id: 2db5da52cd
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "summary"
    kind: frontmatter
    text: "Oracle's September 2026 Critical Security Patch Update, published 2026-09-15, carries 673 patches of which 153 are for Fusion Middleware, and Oracle states 78 of those may be exploited over a network without credentials. A full re-count against Oracle's own risk matrix (Access Vector Network, Privileges Required None, User Interaction None, \"Remote Exploit without Auth.\" Yes) finds fifty CVEs at CVSS 9.8-10.0: six CVSS 10.0 flaws in WebLogic Server, Access Manager, Forms, Internet Directory, Platform Security for Java and Hyperion Financial Management, plus forty-four CVSS 9.8 flaws spanning the same Fusion Middleware product line far more broadly (Access Manager, Forms, Internet Directory and Platform Security for Java again, plus Data Integrator, Identity Manager, JDeveloper, WebCenter Enterprise Capture/Portal/Sites, WebLogic Server and Service Delivery Platform), plus E-Business Suite, Hyperion Financial Management, Business Intelligence/BI Publisher, Enterprise Manager, Communications Unified Assurance and Product Lifecycle Analytics. No exploitation is reported for any of the fifty. The release is Oracle's off-quarter patch line, which a calendar built only on the quarterly dates will miss."
  - claim_id: 08334bf5d1
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "actions[0]"
    kind: frontmatter
    text: "Check every Oracle Fusion Middleware and Hyperion deployment against the affected component version strings (WebLogic Server 12.2.1.4.0 / 14.1.1.0.0 / 14.1.2.0.0; Access Manager and Internet Directory 12.2.1.4.0 / 14.1.2.1.0; Forms 12.2.1.19.0 / 14.1.2.0.0; Platform Security for Java 12.2.1.4.0 / 14.1.2.0.0; Hyperion Financial Management 11.2.26.0.000) and apply the September 2026 Critical Security Patch Update, which is an off-quarter release a January/April/July/October patch calendar does not schedule."
  - claim_id: 1156481446
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "actions[1]"
    kind: frontmatter
    text: "Confirm that no Oracle Internet Directory LDAP listener, WebLogic web container or Access Manager authentication endpoint answers from outside its administrative network segment; all fifty flaws in the release need no credential and no user interaction, so reachability is the whole of the exposure."
  - claim_id: 1086ac428b
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "actions[2]"
    kind: frontmatter
    text: "Patch Oracle E-Business Suite 12.2.3-12.2.15 for CVE-2026-83327, CVE-2026-83452 and CVE-2026-83462 in this same release now: EBS is the product line Cl0p mass-exploited in 2025, and these three flaws need no credential and no user interaction."
  - claim_id: f825b384ce
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
