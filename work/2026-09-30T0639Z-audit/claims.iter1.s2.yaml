    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** inventory by component rather than by suite name."
  - claim_id: 924e40b23c
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "The affected version strings in Oracle's matrix are narrow and specific, 12.2.1.4.0 and 14.1.1.0.0/14.1.2.0.0 for WebLogic's web container, 12.2.1.4.0 and 14.1.2.1.0 for Access Manager and Internet Directory, 12.2.1.19.0 and 14.1.2.0.0 for Forms, so an estate that tracks only \"Fusion Middleware 14c\" cannot tell from its own inventory whether it is affected."
  - claim_id: 823c3e21cd
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "Until the patch lands, the reachable-surface question is which of these listeners answer from outside the management network at all: an OID LDAP server or a WebLogic web container exposed beyond an administrative segment is the exposure that turns a Privileges Required None flaw into a single-request compromise."
  - claim_id: 83dfcd144b
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "**Triage:** exploitation of these components produces authentication and application-tier telemetry, not endpoint telemetry."
  - claim_id: d329766aa4
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "On the identity tier, look for successful authorization decisions from Access Manager with no preceding credential-validation event, and for LDAP binds or searches against the OID listener from source ranges that no application integration uses."
  - claim_id: 3ef5e90f0d
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "On the application tier, look for requests to WebLogic or Forms endpoints that return successfully without a prior session-establishment request in the same log sequence."
  - claim_id: 8ed6e179c8
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: derived
    text: "Ordinary integrations and health checks produce the same request types, so the discriminator is the missing predecessor event, not the request itself."
