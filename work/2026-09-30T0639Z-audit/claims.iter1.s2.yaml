    kind: cited
    text: "The chain starts with a phone call placed to a victim's personal mobile number in which an operator impersonates internal IT helpdesk and directs the target to an attacker-registered lookalike single sign-on portal (Tucows-registered hostnames that prefix the target organisation's name to enrolment- and passkey-themed lookalike domains); the operator captures credentials and TOTP / push approvals live and **immediately registers a new attacker-controlled MFA device** for persistent post-vishing access, mapping to"
