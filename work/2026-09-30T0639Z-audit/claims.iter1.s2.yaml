    surface: "body"
    kind: cited
    text: "The Netherlands' national cyber-security centre relayed the Fusion Middleware half of the release as advisory NCSC-2026-0372 on 2026-09-16 and assigned it priority \"Hoog\", its high rating ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0372"]
