    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "Post-compromise, BlackFile uses Python `requests` and PowerShell scripts against the Microsoft Graph API and direct SharePoint file-stream URLs to exfiltrate, with single-victim file counts exceeding one million; the API requests surface Microsoft Office's `ClientAppId` (`d3590ed6-52b3-4102-aeff-aad2292ab01c`) in the M365 audit log `AppAccessContext` field — the same value legitimate Office clients carry — to blend in with normal Office activity."
  - claim_id: 5d4bbf23e1
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "The detection break is the underlying user-agent: legitimate Office clients do not present `python-requests/2.28.1` or `WindowsPowerShell/5.1` as the user-agent header against Graph or SharePoint endpoints."
  - claim_id: 592fa24671
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "GTIG also notes that the `FileAccessed` audit event distinguishes the bulk-API extraction pattern from interactive `FileDownloaded` events."
  - claim_id: 15863347ee
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "Geographic focus is North America, Australia, and the UK — but the playbook is language-agnostic; any European helpdesk-fronted M365 / Okta environment is one successful call away from the same outcome."
  - claim_id: e5ddf61361
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "The BlackFile data-leak site went offline in late April 2026 and relaunched on 2026-05-11 with a shutdown announcement, which GTIG assesses as probable rebrand rather than cessation."
  - claim_id: 9a106d9eb6
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: uncited
    text: "GTIG explicitly distinguishes UNC6671 from ShinyHunters (UNC6240)."
