  - claim_id: b7fb138e5f
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "summary"
    kind: frontmatter
    text: "NLnet Labs' Unbound 1.26.1 security release fixes nine vulnerabilities, among them two heap-corruption flaws affecting every version through 1.26.0 that it rates critical and high: CVE-2026-81642, a DNSSEC-validator digest-buffer overflow triggered by a DNSKEY record whose owner name uses a self-referencing compression pointer, and CVE-2026-82717, a companion CNAME-synthesis heap overflow during upstream response processing. Both can reach remote code execution; NCSC Switzerland records exploitation status as unknown. Any DNSSEC-validating resolver that can be made to resolve an attacker-registered zone must patch to 1.26.1 now."
