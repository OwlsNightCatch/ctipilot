  entry: 2026-09-04/cve-2026-85046-chrome-v8-type-confusion-exploited
  surface: record 2026-09-30T07:19:27Z
  kind: record-summary
  text: The main text cited Google's release note for the crafted-HTML-page vector, sandboxed code execution and CWE-843, which come from CISA's KEV record, and carried CISA-ADP's CVSS 8.8 score from CISA's
    enrichment of the CVE record rather than from a cited advisory, so no score is shown. It also called the flaw a sandbox-escape primitive although code run through it stays inside the renderer sandbox,
    and said no source described chaining, while Proofpoint has since documented the BlueMoon kit chaining it with a sandbox escape and a Windows privilege-escalation flaw. CVE-2026-85043 is Google's incomplete
    cleanup in Network, not an information disclosure. Detection now covers the Chrome browser process running curl to download and execute a file, which Proofpoint documents for the BlueMoon chain.
