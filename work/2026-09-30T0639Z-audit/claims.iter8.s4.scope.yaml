  entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
  surface: summary
  kind: frontmatter
  text: Gitea's official Docker image hard-coded REVERSE_PROXY_TRUSTED_PROXIES to the trust-all wildcard, so on instances where an administrator enabled reverse-proxy authentication, anyone who can reach
    the container's HTTP port can send an X-WEBAUTH-USER header and be signed in as any user whose login name is known or guessable, admins included (CVE-2026-20896, CVSS 9.8). NCSC-CH set it to actively
    exploited on 2026-07-10, while public Sysdig telemetry shows an attempt that had not gone beyond initial investigation. Fixed in 1.26.3, and Gitea recommends 1.26.4.
