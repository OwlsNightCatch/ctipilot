- code: F3
  category: claim-not-supported
  section: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
  item: "summary (claim d5d5e76cec): \"...distributing a previously undocumented Windows backdoor named Beagle, loaded by Donut shellcode after DLL sideloading on a signed G DATA antivirus updater (Sophos X-Ops, 2026-05-07 · Malwarebytes, 2026-04-10).\""
  url_or_quote: https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer
  summary: "(low confidence) The iteration-6 remediation removed Malwarebytes from the body's Beagle sentence, but the summary still cites it beside Sophos for the Beagle and malvertising clause. Malwarebytes says the site 'deploys a PlugX malware chain' and never names Beagle or malvertising. Drop the Malwarebytes parenthetical from the summary or add that Malwarebytes calls the payload PlugX."
- code: F3
  category: claim-not-supported
  section: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  item: "body Contradiction line (claim 0799a67fd5): \"...and BleepingComputer that it 'did not confirm that its systems had been breached or that data was stolen' ([BleepingComputer, 2026-09-26])\"; same pairing in the summary"
  url_or_quote: https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/
  summary: "(low confidence) The BC 2026-09-26 sentence 'The FBI confirmed that it was investigating claims of unauthorized activity affecting FBIjobs.gov but did not confirm that its systems had been breached or that data was stolen' sits in a recap of the 2026-09-22 events ('At the time, BleepingComputer could not independently verify...'); the page never mentions the FBI's 2026-09-23 release. It cannot be set against Krebs's reading of that release as the line does. Cite the 2026-09-22 BleepingComputer article for the early holding statement, or state that BC's sentence recaps the first response."
- code: F3
  category: claim-not-supported
  section: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
  item: "body (claim 8dce0ff254): \"On WordPress sites embedding an affected widget, a logged-in administrator's browser silently installed a plugin impersonating 'Web Media Optimizer'...\" ([BleepingComputer, 2026-09-17])"
  url_or_quote: https://www.bleepingcomputer.com/news/security/brevo-supply-chain-attack-injected-clickfix-scripts-on-customer-sites/
  summary: "(low confidence) BleepingComputer says the script 'attempted to upload a malicious plugin' and Brevo's post-mortem says it 'attempted to silently install and activate a plugin'; neither reports a confirmed installation (Sansec's 'secretly install' describes the script's function). The entry states installation as fact against the BC citation. Reword to 'attempted to silently install'."
- code: F5
  category: missing-citation
  section: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  item: "body (claim aba91d5f57): \"The group defaced the FBI's careers site, apply.fbijobs.gov, with its Umbreon Pokémon logo and a message claiming the theft; the FBI took the site offline, and it now shows a maintenance page.\""
  url_or_quote: https://www.bleepingcomputer.com/news/security/shinyhunters-claims-fbi-hack-data-theft-in-peoplesoft-zero-day-breach/
  summary: "(low confidence) The sentence carries no inline citation. BleepingComputer shows the defacement via a screenshot the group shared and reports the maintenance message as the group's account; TechCrunch says the hackers 'reportedly' defaced it and the page was down at publication. 'now shows a maintenance page' is a 2026-09-22 observation stated in the present tense. Cite BC/TechCrunch, attribute the defacement, and date the maintenance observation (CyberScoop 2026-09-28: 'remains offline as of Monday')."
- code: F4
  category: hallucinated-fact
  section: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  item: "body (claim b16fff01f2): \"writing it directly into a server-side page-cache entry for the checkout page, so the served HTML differs from the page's own template\"; also \"...in a production front-end deployment manifest\""
  url_or_quote: https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company
  summary: "(low confidence) Gambit says only 'At a large American hospitality company the operator wrote the payload into the cached page model of the checkout page' and 'On a US print-on-demand platform the injection was added to the production front-end deployment'. The 'served HTML differs from the page's own template' consequence and the word 'manifest' are not in the page. Trim to Gambit's wording."
- code: F3
  category: claim-not-supported
  section: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
  item: "body opening sentence (not in the ledger sample): \"On 2026-05-15 an attacker drained approximately $11M in protocol-owned funds from THORChain\" ([The Record]; [TRM Labs])"
  url_or_quote: https://therecord.media/more-than-10-million-stolen-crypto-platform-thorchain
  summary: "(low confidence) The Record quotes THORChain: 'Initial indications are user funds are safe and only protocol owned funds are affected'; TRM says 'drained more than USD 11 million in assets' without that qualifier. The opening states 'protocol-owned' as established, while a later sentence in the same entry correctly hedges it as 'initial indications'. Add the hedge to the opening or drop 'protocol-owned' there."
- code: F9
  category: surface-contradiction
  section: 2026-05-28/nx-console-tanstack-daemon-tools-supply-chain-cascade-lands
  item: "body (claim ddc62e6d08): \"The malicious version was live for less than an hour (about 18 minutes on the Visual Studio Marketplace and 36 on Open VSX)\" ([GHSA-c9j4-9m59-847w])"
  url_or_quote: https://nx.dev/blog/nx-console-v18-95-0-postmortem
  summary: "(low confidence) The cited postmortem's TL;DR says 'The Visual Studio Marketplace package was live ~11 minutes until we patched it', while the advisory says '~18 minutes' and the postmortem's own timeline (12:30 upload, 12:48 unpublish) supports 18. The entry cites both sources and silently follows the advisory. A one-clause note that the postmortem's TL;DR gives ~11 minutes (counted from the maintainer's email) would surface it."
