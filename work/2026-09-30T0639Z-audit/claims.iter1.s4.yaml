  - claim_id: 583a1956a4
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Cisco disclosed CVE-2026-76460 (CVSS 3.1 10.0, AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) on 2026-09-16: an unauthenticated, remote attacker can bypass authentication on an API endpoint of Cisco Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC) due to insufficient authentication control, affecting every release \"regardless of device configuration\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: 1ab25f9965
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Cisco confirms the flaw was found while resolving a customer's TAC support case, not internal research, and states it is aware of active exploitation ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: 3495dc55f5
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "); a successful exploit bypasses the web-based management interface entirely and, per Cisco's own advisory, \"threat actors may obtain command execution with root privileges\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: 03cf45b30a
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Fixed releases are 3.1 Patch 12, 3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7 and 3.5 Patch 4; Cisco ISE 3.0 has reached End of Software Maintenance and must migrate to a supported, fixed release ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: 5b066368ca
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "CISA added the flaw to its Known Exploited Vulnerabilities catalog the same day ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 2631d8084e
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "This CVE was part of a bundled disclosure of 15 distinct Cisco ISE advisories the same day ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP"]
  - claim_id: 0495ce0436
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "A sibling flaw, CVE-2026-76423 (CVSS 10.0, also unauthenticated and affecting every release \"regardless of device configuration\"), removes the same authentication boundary via a separate API endpoint, letting an attacker read or modify ISE configuration and identity data with administrative privileges; Cisco states it is \"not aware of any public announcements or malicious use\" of this second flaw as of disclosure, but it shares the same fixed-release schedule ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-hrP9jQSQ"]
  - claim_id: 8c4e6c5568
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: cited
    text: "Cisco supplies a concrete first check: review each node's `access.log` (or a decrypted debug-log bundle at `./ise/logs/apigateway/access.log.*.gz`) for suspicious usernames on the API endpoint, using `show logging application ise-kong/access.log | include dummyuser` as a worked example ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"]
  - claim_id: cad9d1923e
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: uncited
    text: "There is no workaround; the only mitigation is restricting management-plane access via infrastructure ACLs."
  - claim_id: 7c3d006930
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: uncited
    text: "Cisco ISE is standard 802.1X/network-access-control and identity infrastructure across enterprise and public-sector networks, so an unauthenticated bypass of its management/API surface is a direct path to defeating an organization's network access controls."
  - claim_id: 42e7a25dba
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch every ISE/ISE-PIC node and restrict management-plane reachability via ACLs immediately — there is no other mitigation, and Cisco's own guidance is to distrust the appliance's own logs for ruling out compromise once root access is possible."
  - claim_id: edc637e166
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate administrative session against the ISE API originates from an authenticated, known management source; the discriminator here is that exploitation reaches the API without any authentication at all, so any successful request against the affected endpoint from outside expected management-plane sources is itself the signal — and because a root-level attacker can edit or delete `access.log` entries, an apparently clean on-box log is not evidence of an intact device."
  - claim_id: 1b129f95f5
    entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
    surface: "body"
    kind: derived
    text: "Cisco's guidance is to corroborate against firewall and network logs external to the ISE node for unexpected outbound uploads or downloads to unfamiliar IP addresses."
  - claim_id: 27cd950584
