  - claim_id: 6d5e2f9a9b
    entry: 2026-05-08/pro-russian-hacktivists-modify-ot-pump-settings-at-five-poli
    surface: "summary"
    kind: frontmatter
    text: "Poland's Internal Security Agency (ABW) reports that in 2025 attackers breached water treatment plants in Jabłonna Lacka, Szczytno, Małdyty, Tolkmicko and Sierakowo and, where they reached the industrial control systems, altered equipment parameters, putting operation and water supply at risk. ABW describes hacktivist groups exploiting poor password policies and device management panels exposed directly to the internet, and names no state actor for these intrusions."
