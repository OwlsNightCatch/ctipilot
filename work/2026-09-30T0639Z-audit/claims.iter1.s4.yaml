    surface: "body"
    kind: derived
    text: "**Detection:** administrative API sessions from sources outside the management network or at unusual hours, followed by the EPMM service spawning shells or making outbound connections, and for CVE-2026-5787, client certificates issued to Sentry hosts that do not exist in the deployment."
