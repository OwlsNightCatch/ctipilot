    urls: ["https://support.apple.com/en-us/148170"]
  - claim_id: 97cb3f9e08
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: cited
    text: "NCSC-NL carried it to European constituents the following day, classing it CWE-287 ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0280"]
  - claim_id: bbb69742da
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: cited
    text: "He states \"I know the bug was fixed by the DoS entry\" in the preceding Apple bulletin, and argues that entry understates what the bug actually was ("
    urls: ["https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/"]
  - claim_id: 3194837cdf
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: cited
    text: "That one it doesn't do\" ("
    urls: ["https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/"]
  - claim_id: 4259cccab0
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Apple's 2026-08-06 updates for macOS Tahoe 26.6.1, Sequoia 15.7.9 and Sonoma 14.8.9 fix CVE-2026-65400 in Screen Sharing, the VNC-based remote-desktop service built into macOS."
  - claim_id: cbdb743ba0
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Apple published no severity score and at disclosure reported no exploitation; NCSC-NL and CISA later confirmed active abuse (see the correction below)."
  - claim_id: defff90040
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Taken alone this is a straightforward patch item on a client operating system."
  - claim_id: 4617251f9f
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "What raises it is the interval."
  - claim_id: 798998fc2f
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "One week earlier, macOS reverse-engineer fG! published an account of a separate defect in the same `screensharingd` daemon: a pre-authentication bug that lets an unauthenticated caller \"download any file from a vulnerable macOS machine\" given its full path, with `/etc/sudoers` offered as the worked example."
  - claim_id: 9c69e7e1dc
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "He is explicit that this is not the bug the other research team reported."
  - claim_id: 9a84d1fd34
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "That characterisation is his and Apple has not endorsed it, so it is context rather than a finding."
  - claim_id: 85ad48863b
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "The operational consequence does not depend on adjudicating that dispute."
  - claim_id: bd6c38802f
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Two independent, severe authentication and state-handling defects have now surfaced in the same daemon across consecutive release cycles, one of them described publicly in enough detail to be actionable."
  - claim_id: 803aacb064
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "An estate that took 26.6 and deferred 26.6.1, or that reads bulletin severity labels as a patch-prioritisation input, ends up with the wrong picture in both directions."
  - claim_id: 23dea4f3f2
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Detection concept and hardening are the same lever: Screen Sharing listens on TCP/5900 and is discoverable over mDNS, so the exposure to hunt for is any managed Mac with the service reachable from a segment it does not need to serve — inventory it from network telemetry rather than from configuration policy, because the setting is per-device and users enable it."
  - claim_id: 350577326d
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "There is no known persistent artifact specific to CVE-2026-65400: Apple frames it as an authentication-state defect, not a post-exploitation primitive, so a successful attack looks like a legitimate Screen Sharing session, and the discriminator available is the session's source rather than anything about the session itself."
  - claim_id: aa6b08069f
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "Where the service is genuinely required, restrict it to a defined set of management sources or a VPN path."
  - claim_id: 899a893b03
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "body"
    kind: uncited
    text: "On the related daemon bug fG! is precise about the limits of the platform's own controls, and the limits cut both ways: he records that it \"doesn't care about TCC either\", but also that \"It would be perfect if it could bypass SIP."
  - claim_id: fe63f802b7
