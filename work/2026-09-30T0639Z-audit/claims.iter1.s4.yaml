    entry: 2026-06-12/cve-2026-25089-fortinet-fortisandbox-unauthenticated-os-comm
    surface: "summary"
    kind: frontmatter
    text: "Fortinet patched CVE-2026-25089 (CVSS 9.8), an unauthenticated OS command injection in the FortiSandbox web UI's VNC-launch handler, on 2026-06-09. Defused then reported exploitation of it together with the April flaws CVE-2026-39808 (unauthenticated command injection, CVSS 9.8) and CVE-2026-39813 (JRPC path traversal authentication bypass, CVSS 9.1), and CISA added CVE-2026-25089 and CVE-2026-39808 to KEV on 2026-07-16. FortiSandbox 5.0.6 and 4.4.9 fix all three, 5.2 is not affected."
  - claim_id: 9661b2c824
    entry: 2026-06-12/cve-2026-25089-fortinet-fortisandbox-unauthenticated-os-comm
    surface: "actions[0]"
    kind: frontmatter
    text: "**Upgrade every FortiSandbox to 5.0.6 or 4.4.9 (or move to 5.2)**, which fixes all three exploited flaws (CVE-2026-25089, CVE-2026-39808, CVE-2026-39813), and confirm the web UI and JRPC API answer only from the management network."
