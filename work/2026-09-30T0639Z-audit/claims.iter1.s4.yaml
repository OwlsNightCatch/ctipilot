    text: "Apple's macOS 26.6.1, Sequoia 15.7.9 and Sonoma 14.8.9 updates of 2026-08-06 fix CVE-2026-65400 in Screen Sharing, where \"an attacker on the network may be able to authenticate to Screen Sharing without valid credentials\", addressed through improved state management. The flaw is exploited in the wild: NCSC-NL reported active abuse on 2026-08-12 and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-08-18. It lands one week after macOS reverse-engineer fG! publicly described a separate pre-authentication file-download bug in the same screensharingd daemon which he says Apple fixed under a denial-of-service entry in the preceding bulletin — a characterisation Apple has not endorsed. Disabling Screen Sharing where it is not needed is the control that does not depend on adjudicating that."
