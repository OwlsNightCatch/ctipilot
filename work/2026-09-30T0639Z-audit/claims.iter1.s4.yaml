  - claim_id: 1d8d2047c2
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "summary"
    kind: frontmatter
    text: "Gitea's Docker image shipped with REVERSE_PROXY_TRUSTED_PROXIES defaulting to the trust-all wildcard, so anyone who can reach the container's HTTP port can forge an X-WEBAUTH-USER header and authenticate as any account, admin included, with no credentials (CVE-2026-20896, CVSS 9.8). BSI rated it \"hoch\" on 2026-06-22 and NCSC-CH set it to actively exploited on 2026-07-10, while public telemetry so far shows reconnaissance probing. Fixed in 1.26.3 / 1.26.4 (Gitea, 2026-06-21)."
  - claim_id: f4d5ed097e
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch self-hosted Gitea Docker instances to 1.26.4 and fix the reverse-proxy trust scope now**: set `REVERSE_PROXY_TRUSTED_PROXIES` to your exact proxy IP/CIDR (never the wildcard), or disable `ENABLE_REVERSE_PROXY_AUTHENTICATION` if you don't use header auth. Internet-reachable instances first."
  - claim_id: df6107fe86
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "actions[1]"
    kind: frontmatter
    text: "Hunt Gitea sign-in/audit logs for X-WEBAUTH-USER-authenticated admin sessions whose source IP is not the configured trusted proxy. By construction any such hit is a spoofed header, and it separates exploitation from legitimate proxy auth."
