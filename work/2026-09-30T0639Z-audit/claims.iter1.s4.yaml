    surface: "body"
    kind: cited
    text: "The actor operated a malware-signing-as-a-service (MSaaS) since at least May 2025, abusing **Microsoft Artifact Signing** (formerly Azure Trusted Signing) to mint short-lived (72-hour) code-signing certificates tied to stolen US and Canadian identities ("
