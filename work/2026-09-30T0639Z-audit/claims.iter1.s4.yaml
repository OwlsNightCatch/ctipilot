    text: "The `escape_quotes()` function in the `access` executable allocates buffers via uninitialized `malloc()` without null-terminating escaped strings; a sprayed JSON payload to `/accessv2` (four single-quotes expanding to 16 bytes) overwrites heap metadata in adjacent freed chunks, and the subsequent `__sprintf_chk()` reads out-of-bounds into attacker-controlled data, reaching code execution as root with no authentication. watchTowr published the full mechanics."
