    entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
    surface: "body"
    kind: uncited
    text: "Confirmed downstream customers: **Vanilla Tempest** (deploying Rhysida ransomware via Microsoft-signed `MSTeamsSetup.exe` carrying the Oyster/Broomstick backdoor), **Storm-0501**, **Storm-2561**, **Storm-0249**, and ransomware families **Rhysida**, **INC**, **Qilin**, **Akira**, plus commodity loaders **Oyster**, **Lumma Stealer**, and **Vidar**."
  - claim_id: a5860ca7b3
    entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
    surface: "body"
    kind: uncited
