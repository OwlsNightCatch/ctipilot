    text: "Attackers copied files from Eurail's network on 2025-12-26, and the rail-pass operator sent breach letters on 2026-03-27 to 308,777 people whose names and passport numbers were exposed. The European Commission warned DiscoverEU participants that passport or ID copies, IBANs and health data may also be involved, and says it notified the European Data Protection Supervisor."
