    entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
    surface: "body"
    kind: uncited
    text: "Microsoft's write-up details the service's commercialisation: short-lived signing certificates sold to ransomware affiliates per signing run, with infrastructure transitioning in February 2026 to VM-based delivery on Cloudzy-hosted hosts that accepted customer binaries and returned signed outputs."
