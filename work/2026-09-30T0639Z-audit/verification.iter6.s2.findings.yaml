- code: F4
  category: hallucinated-fact
  section: virtualizor
  item: "2026-09-23/virtualizor-billing-hook-unauth-root-rce (body, claim d1a36ef6a0)"
  url_or_quote: "instead relays each command's output to a randomly named static file written into the webroot and served directly over plain HTTP"
  summary: "(low confidence) VulnCheck (https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce) says only: \"writing each command's output to a random static file in the webroot that nginx serves directly, no php-fpm\" and shows \"GET /<rand>.txt\"; the page never says plain HTTP, and its demo targets port 4085. The qualifier is unsupported (a defender could read it as an HTTP-only hunting hint). Fix: \"served directly by nginx\"."
- code: F3
  category: claim-not-supported
  section: oracle
  item: "2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10 (## Correction 2026-09-30T06:57:52Z; claim c95769cc81, outside the scoped set)"
  url_or_quote: "Oracle now patches monthly, and its next releases are Critical Security Patch Updates on 17 November and 15 December 2026"
  summary: "(low confidence) Oracle's page (https://www.oracle.com/security-alerts/cspusep2026.html) lists the next four dates as 20 October 2026 (CPU), 17 November (CSPU), 15 December (CSPU), 19 January 2027 (CPU). The Correction calls the two CSPUs its next releases and omits the 20 October CPU, which is the next release and is stated correctly in the main text. Fix: \"its next dates are the CPU of 20 October, CSPUs on 17 November and 15 December\"."
- code: F5
  category: missing-citation
  section: ncsc-ch-google
  item: "2026-09-23/ncsc-ch-google-recovery-oauth-app-password-persistence (body Triage line)"
  url_or_quote: "**Triage:** legitimate Google administrators and helpdesks never call account holders unprompted about a security case; the tell is the free-text \"case ID\" riding inside an otherwise-genuine Google recovery-address notification, and any login page served from sites.google.com rather than accounts.google.com."
  summary: "(low confidence) The first sentence of the Triage paragraph carries no inline citation (the BACS link follows only the next sentence), although the run's record summary says \"The triage, detection and takeaway lines now cite the BACS report they follow.\" BACS (https://www.bacs.admin.ch/de/26w38-de) does support it (\"Echte Plattformbetreiber kontaktieren Nutzerinnen und Nutzer niemals spontan telefonisch wegen Sicherheitsvorfällen\"; \"Offizielle Login-Seiten von Google befinden sich ausschliesslich unter accounts.google.com\"); add the BACS citation after the sentence."
