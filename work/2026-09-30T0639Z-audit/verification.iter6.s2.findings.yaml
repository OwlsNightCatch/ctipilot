  item: "2026-09-27/pentagon-dmdc-military-personnel-data-breach-unencrypted-ssn (record 2026-09-30T07:31:59Z summary; claim 4a6e86bd22)"
  url_or_quote: "the relevance is stated as a sector nexus rather than asserted global significance"
  summary: "(low confidence) Composition-rationale sentence in a reader-rendered record summary. The published body (git show origin/main) carries no \"global significance\" wording (only regions: [us, global] and a \"transferable lesson\" takeaway), and regions still lists global, so the sentence describes a change the diff does not show. Drop it; the other clauses already state the change."
