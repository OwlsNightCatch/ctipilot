  - claim_id: ad00563b80
    entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
    surface: "headline"
    kind: frontmatter
    text: "Opening a folder with a crafted shortcut sends the user's NTLM hash to an attacker. Exploited, and re-fixed in July 2026"
  - claim_id: 3c2c91f00c
    entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-32202 is left over from Microsoft's February fix for CVE-2026-21510, which APT28 exploited with crafted LNK files: Windows Explorer still opens an SMB connection to an attacker server when it renders the folder holding the shortcut, sending the user's Net-NTLMv2 hash for relay or cracking. Microsoft patched it on 2026-04-14, marked it exploited later and re-released the fix on 2026-07-28, recommending the July 2026 updates. CISA listed it on 2026-04-28. No source ties this CVE's exploitation to APT28 itself."
  - claim_id: ca93e1a7f2
    entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
    surface: "body"
    kind: cited
    text: "Microsoft's record, revised on 2026-07-28, says the CVE \"has been re-released to comprehensively address the vulnerability\" and recommends installing the July 2026 updates ("
    urls: ["https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-32202"]
  - claim_id: 20b614b9da
    entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
    surface: "body"
    kind: derived
    text: "**Exposure:** supported Windows 10, 11 and Windows Server builds without the July 2026 update, on networks that allow outbound SMB to the internet."
  - claim_id: 81cd5be618
    entry: 2026-05-08/cve-2026-32202-windows-shell-ntlm-coercion-apt28-itw-cvss-4
    surface: "body"
    kind: derived
    text: "Install the July 2026 updates, not only the April ones, and block outbound SMB at the perimeter, which also cuts the relay path for the next variant."
