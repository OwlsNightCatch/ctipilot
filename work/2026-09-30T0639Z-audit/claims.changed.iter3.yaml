  - claim_id: 6454d46000
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "summary"
    kind: frontmatter
    text: "THORChain, a Switzerland-based cross-chain liquidity protocol, lost about $11M across nine blockchains after one of its six vaults was compromised (The Record, 2026-05-15; TRM Labs, 2026-05-15). The working theory reported by CryptoTimes is a GG20 Threshold Signature Scheme implementation flaw exploited through a newly churned validator node, suspected of gradually leaking vault key material over keygen and signing rounds before forging outbound signatures (CryptoTimes, 2026-05-17). THORChain said initial indications were that user funds were safe and only protocol-owned funds were affected (The Record, 2026-05-15)."
  - claim_id: caf60df1ff
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: uncited
    text: "Any organisation operating MPC-custody, threshold-signing or cross-chain bridge validator infrastructure, including FINMA-supervised digital-asset custodians, EU MiCA-regulated DeFi platforms and internal HSM-replacement projects that have moved to MPC-TSS, should audit node-admission controls, keygen/signing-round integrity, and whether newly-joined nodes can participate in signing quorums before completing a full security review."
  - claim_id: 97b3e5f4c1
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "record 2026-09-30T07:16:56Z"
    kind: record-summary
    text: "The text called CVE-2023-33241 part of the TSSHOCK class and cited NVD for it. CVE-2023-33241 is Fireblocks' own finding, and TSSHOCK is Verichains' separate set of attacks. The sentence now names both disclosures with their own sources, and drops an unsupported claim that this was the second large-scale production case. The entry also gains the source rating and ATT&CK mapping every entry of its kind now carries. The main text no longer states the malicious-node theory as The Record's finding, credits Chainalysis for the GG20 theory, names the Lazarus Group or presents the TSS link as established. The evidence quote is replaced with a verbatim passage from The Record, the node address is removed as an indicator, the event date moves to the 2026-05-15 drain, and the priority moves from high to notable: a crypto-protocol vault drain gives the constituency no decision within seven days. The summary cites CryptoTimes for the working theory it carries, and the Verichains citation carries the page's own date."
