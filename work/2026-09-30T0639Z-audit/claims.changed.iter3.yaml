    text: "Gambit Security reconstructs a financially motivated campaign, running since July 2026, in which three open-source AI agent harnesses, Strix (vulnerability discovery), Cairn (autonomous exploitation) and Hermes (orchestration), ran nearly the entire intrusion lifecycle unattended against online retailers, compromising at least 27 named victims. Gambit's body confirms skimmers in place on 19 of them while its own summary counts skimmer installations on five, and it detected more than 100 further websites infected with a skimmer associated with the campaign. Hermes is the same open-source agent framework seen in three earlier, unrelated intrusions that touched government targets in Thailand, Taiwan and Malaysia."
