    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Softaculous Virtualizor's admin panel guards every pre-authentication request except one: a request with act=login walks straight into an unauthenticated billing-module handler. From there, an attacker reaches unauthenticated root command execution, PHP object injection, or arbitrary tenant-balance manipulation. Fixed in 3.2.9 patch 9 / 3.3.0. VulnCheck's disclosure does not state whether it observed in-the-wild exploitation. It turned the command-injection flaw into a self-contained module for its open-source go-exploit framework that needs no credentials or account information from the operator, and does not say whether that module is public."
