    text: "Operators create persistent administrator accounts via `PUT /api/security/users/<username>` or `/access/api/ui/users/<username>` (**T1136.001**); deploy malicious Groovy plugins through Artifactory's own extensible plugin framework to gain arbitrary code execution (**T1505**, abusing a legitimate server extension mechanism for persistence); and run ad-hoc shell commands through the plugin-execution endpoint (`GET`/`POST /api/plugins/execute/<plugin>`), used for reconnaissance and file enumeration (**T1059**) ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
