- code: F8
  entry: 2026-09-04/cve-2026-85046-chrome-v8-type-confusion-exploited
  finding: 'Detection rests on "Google withholds exploit specifics" and ignores the behaviour Proofpoint describes (finding 6)'
  remediation_applied: 'Applied. Proofpoint 2026-09-08 (saved extract, re-read): "a separate injector shellcode injects a `CreateProcess` stub into the parent Chrome broker process, executing an operator-specified command. The default command downloads a remotely hosted executable via a `curl` command and executes it"; detection section "Default BlueMoon deployments feature a distinctive and suspicious process tree"; the LPE elevates the renderer first ("A second reflectively loaded DLL runs the LPE exploit to elevate the renderer process. With those additional privileges ..."). Detection now: on Windows, after the chain''s privilege escalation, the parent Chrome browser process runs an operator-specified command, by default a command shell using curl to download an executable to the temp directory and run it, a process tree Proofpoint calls distinctive and suspicious (cited); process-creation telemetry for the browser process spawning a shell, curl or a just-downloaded executable is the tell, and any shell or download utility under the browser process deserves review because the command is configurable. The "Google withholds exploit specifics" premise and the renderer-crash fallback are dropped; no attacker file names or URLs carried. The Correction gains one cited sentence (the earlier guidance assumed withheld specifics; Proofpoint has since described the browser process running curl), the record summary one sentence.'
  verify_in_this_iteration: 'Does the Chrome Detection line match Proofpoint''s description of the broker-process command (shell, curl, download-and-execute) without indicators, and is the withheld-specifics premise gone?'
