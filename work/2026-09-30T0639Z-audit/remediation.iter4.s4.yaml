  finding: '"checks that the HTTP Basic username matches but never checks the password" drops the non-empty requirement (finding 18)'
  remediation_applied: 'Applied. Pentest-Tools: "The Apache provider''s login() method checks two things: that PHP_AUTH_USER matches the submitted username, and that PHP_AUTH_PW is non-empty. The login() method never compares the value of PHP_AUTH_PW against the stored password hash." Main text now "which checks only that the HTTP Basic username matches and that the password is non-empty, never comparing the password with the stored hash". Sentence is this run''s own text (not on origin/main).'
  verify_in_this_iteration: 'Does the phpBB main text state the non-empty password requirement in Pentest-Tools'' terms?'
