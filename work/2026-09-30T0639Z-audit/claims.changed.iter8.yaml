  - claim_id: 1f3bdfd6ff
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit documents eight distinct skimmer-injection methods used across victims, all worth carrying into any custom-web-application hardening review: appending the loader to the end of a legitimate, already-served JavaScript file while restoring its original modification timestamp; inserting a foreign `<script>` tag directly into the checkout page; hiding the loader inside a site's Google global-site-tag (`gtag.js`) block, between the real `gtag('js', ...)` and `gtag('config', ...)` calls, padded with roughly a hundred tab characters to push it past the right edge of a typical code-review view; using a discovered AWS access key to write the loader into the storage bucket behind the retailer's own CDN, so it loads from that trusted CDN host rather than a third-party domain; injecting the loader into a database content field (such as a product-description column) through an admin pod and relocating it to a file on the victim's own domain; adding it to a production front-end deployment as a Kubernetes `initContainer`; writing it into the cached page model of the checkout page; and a self-healing cron job placed in a JBoss log directory that checks the injected file's size every two minutes and re-appends the loader whenever a redeploy reverts it."
