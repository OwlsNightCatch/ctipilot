  - claim_id: 95e4ee57b7
    entry: 2026-09-29/bitget-hot-wallet-theft-north-korea-nexus
    surface: "summary"
    kind: frontmatter
    text: "Cryptocurrency exchange Bitget confirms unauthorized transfers of approximately $388M from its hot and warm wallet infrastructure on 2026-09-24. Mandiant's and SlowMist's reports, released on 2026-09-30, trace the path through two compromised third-party security appliances (SlowMist dates malicious activity on a node of its Product A to 2026-08-31, and Mandiant found a web shell with command-and-control on its appliance B), lateral movement to the production wallet job server, and a custom withdrawal tool that forged risk-control parameters. Bitget's CEO calls North Korean involvement \"very likely\"; TRM Labs finds laundering overlap with wallets from earlier North Korean thefts, including Bybit and AFX Bridge, through a network it ties to TraderTraitor, but states attribution is not definitive."
