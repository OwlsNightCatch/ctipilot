claims:
- {claim_id: e165f87841, passage: compromised third party security appliances A and B ... moved laterally to Bitget's production wallet job server, source_url: 'https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf', verdict: ok}
- {claim_id: 25325bbbb5, passage: 'earliest malicious activity ... August 31; Mandiant: web shell onto appliance B + C2; SlowMist: forged risk-control parameters; TRM: laundering network overlaps, not definitively attributed', source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 1828566fd5, passage: 'approximately 18:31 UTC on September 24, 2026 ... 11 blockchains: Ethereum, XRP Ledger, Zcash, TRON, Arbitrum, Optimism, Base, BNB Smart Chain, Avalanche, Algorand, Celestia', source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: b1142a334b, passage: attacker may have exploited a vulnerability in a third-party security product to potentially obtain high-level internal credentials ... impersonate authorized activity and send fraudulent withdrawal c, source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: babc3ee13e, passage: 'The attacker compromised a critical backend system within our wallet infrastructure, used it to spoof transaction data, and triggered our authorization process to move funds out.', source_url: 'https://thehackernews.com/2026/09/bitget-says-suspected-north-korean.html', verdict: ok}
- {claim_id: f6feadaa0a, passage: currently estimated at approximately $388 million ... transfers involved 12 wallet addresses, source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: 51840206c4, passage: Bitget reported a loss of USD 351.6 million ... This post uses Bitget's figure., source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 1c5a9a88ff, passage: Bitget's Protection Fund covers the financial impact of this platform-wide incident., source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: db207b1609, passage: Bitget paused withdrawals and says its USD 464 million User Protection Fund covers the loss., source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 3a51147d74, passage: internal login credentials were revoked and reissued; access to highly sensitive systems was restructured; multiple approvals ... required; Mandiant and SlowMist were engaged, source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: 43a66c9bf3, passage: 'Bitget CEO Gracy Chen has said North Korean involvement is "very likely," citing IP addresses that Bitget''s preliminary investigation linked to VPN services associated with a North Korean hacking grou', source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 57b4ba7866, passage: 'multiple overlaps with wallets used to launder previous North Korean hacks, including Bybit and AFX Bridge. At a minimum, these onchain links confirm the group ... TRM has not linked this laundering s', source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 866b349e94, passage: hidden script under the service process; command to read the environment variable containing the database password; connected to the database; injected commands into task parameters; web execution end, source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 7001de2c25, passage: earliest malicious activity identified in the available logs dates to August 31 (theft began Sept 25 UTC+8), source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 5ff90967b9, passage: private-key compromise has also been ruled out; Cold wallets ... not affected; Bitget has notified the relevant third-party vendor and disabled the affected functionality pending completion of a fix, source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: 8d208f0007, passage: 'User account balances remain unaffected; Trading and deposits have continued; BTC withdrawals resumed at 08:00 UTC on September 28', source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: a5b13f90b2, passage: TRM has not yet definitively attributed the exploit to North Korea; another actor carrying out the theft remains technically possible, source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 86dc92a0f8, passage: compromised network and security appliances and leveraged them to distribute malicious packages and gain control over the wallet job server (takeaway follows), source_url: 'https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf', verdict: ok}
- {claim_id: 16b1dd391a, passage: web shell + C2 on appliance B then lateral movement; SlowMist hidden script under service process (takeaway follows from mechanism), source_url: 'https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf', verdict: ok}
- {claim_id: 83120a877c, passage: Product A / Product B; neither report names vendors, source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 428a4050a6, passage: Both investigations identified the compromise of third-party security products that ultimately enabled unauthorized access to Bitget Exchange's wallet environment., source_url: 'https://www.bitget.com/support/articles/12560603896305', verdict: ok}
- {claim_id: ed6eab506f, passage: a threat actor gained unauthorised privileged access to Bitget's third party security appliances A and B. ... deployed a web shell onto the security appliance B and established a C2 connection ... dep, source_url: 'https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf', verdict: ok}
- {claim_id: f32782bcb9, passage: highly customized withdrawal tool from files the attacker had deleted ... forged risk-control parameters ... attempted to modify withdrawal records directly in the wallet database, source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: fae9ddcbf5, passage: web shell + C2 on appliance B; moved laterally to production wallet job server; SlowMist hidden script under the service process, source_url: 'https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf', verdict: ok}
- {claim_id: 307e89a6d6, passage: 'September 30, 05:20 UTC | Independent investigation reports from Mandiant and SlowMist became available.', source_url: 'https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response', verdict: ok}
- {claim_id: 3d6b02466e, passage: A service running on one of Product A's nodes was affected by a zero-day vulnerability. The attacker ran a hidden script ... Similar hidden-script activity was observed on two other nodes on September, source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 7d1cb68559, passage: 'In the early hours of September 25, the attacker accessed Product B''s management platform using an internal employee''s identity ... three consecutive attempts to inject system commands ... web executi', source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: 1744f46b2e, passage: Product A / Product B (vendors unnamed in both reports), source_url: 'https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf', verdict: ok}
- {claim_id: ba18de4714, passage: Bitget reported a loss of USD 351.6 million; Bitget ... says its USD 464 million User Protection Fund; Mandiant/SlowMist as above, source_url: 'https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack', verdict: ok}
- {claim_id: 5916a4431d, passage: GitHub und GitLab lehnen sie ab. Angreifbar ... Bitbucket oder selbst gehosteten Git-Servern; Gemini CLI Consumer bleibt dauerhaft verwundbar; Copilot fix in 1.0.87, source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: cf6995bfb5, passage: 'Every affected agent checks out the pinned commit but never checks that it actually landed there ... Codex 0.146.0 / Claude Code 2.1.179; heise: Copilot 1.0.87 / app 1.1.23', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 73f5d71f53, passage: Nach Angaben des GitHub-Supports steckt der Fix in der Copilot CLI ab Version 1.0.87 ... und in der Copilot-App ab Version 1.1.23, source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 41727b432b, passage: Every affected agent checks out the pinned commit but never checks that it actually landed there., source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 0d24af963d, passage: creates a branch whose name is the exact 40-hex pinned SHA and makes it the repository's default ... git prefers the ref and only prints a `refname is ambiguous` warning, source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: cba5c9a957, passage: 'if the repository''s default branch is itself named `FETCH_HEAD`, the checkout resolves to the branch', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 1438a40e39, passage: Agents update installed plugins in the background - in Claude Code and Codex this is the default ... full access to every asset and every piece of data the agent can reach, source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 524455c75b, passage: Air says it built a working test attack against all four agents in May and told the vendors in June., source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: c4e2e05fec, passage: 'That change shipped in Codex 0.146.0. ... Anthropic''s release notes for 2.1.179 do not mention the fix, and the account that it is fixed in is Air''s.', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 9e51226403, passage: 'GitHub Copilot - we disclosed the same flaw to Microsoft, which has not shipped a fix, so users have no patch.', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 0ed2fa51cc, passage: "GitHub hat die L\xFCcke inzwischen auch in Copilot geschlossen. Nach Angaben des GitHub-Supports ... Der Fix pr\xFCft, ob der ausgecheckte Code dem gepinnten Commit entspricht.", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 6f2ba8ebff, passage: 'Google has deprecated the Gemini CLI and will not patch it, so every install stays vulnerable for good', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: dd89c18324, passage: "Enterprise-Zug\xE4nge \xFCber Gemini Code Assist oder Google Cloud bleiben davon unber\xFChrt ... Antigravity CLI ... \xFCber keinen vergleichbaren SHA-Pinning-Mechanismus", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: d7baf23915, passage: 'auto-update is on by default only for the agents'' own built-in marketplaces, which are hosted on GitHub ... every plugin in Anthropic''s community catalog ... points to a GitHub repository', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 633788dee0, passage: 'Air says the trick works on hosts that permit such names, such as Bitbucket or a company''s own git server', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 0d5ee9c9e3, passage: "Anders als urspr\xFCnglich angegeben ist GitLab nicht angreifbar, da es wie GitHub Branch-Namen im Format eines Commit-Hashes ablehnt.", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 186be6b8c4, passage: 'As of September 18, no CVE identifier had been assigned ... there is no sign it has been used in a real attack.', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 58a46ed88b, passage: 'One assertion closes both variants: after checkout, resolve the commit actually in the working tree and abort unless it equals the pinned SHA. ... check the resolved HEAD', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 7dae40e66b, passage: A marketplace can blunt the branch-name variant by allowing only hosts that reject SHA-shaped names ... and does nothing for Gemini CLI's variant., source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 7d04ad1d22, passage: 'zero-click remote code execution across Claude Code, Codex, GitHub Copilot, and Gemini CLI', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: fcf22bf77a, passage: "Am 4. August erhielten die Sicherheitsforscher von Google die Best\xE4tigung, dass Gemini CLI f\xFCr Consumer-Nutzer eingestellt wird und damit auch keinen Fix erh\xE4lt", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 078603f0a6, passage: auto-update is on by default only for the agents' own built-in marketplaces ... and is off or optional for outside ones, source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 74e16ba48e, passage: GitHub's rule against hash-shaped names does not clearly block that name. So it is not established that installing a Gemini CLI plugin from GitHub avoids the flaw, source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: 163a162d0e, passage: test "$(git rev-parse HEAD)" = "<pinned-sha>" || abort; has to check the resolved HEAD, source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: 2629fbaa18, passage: 'the same `git checkout` re-runs on background auto-update, so update telemetry matches the attack; check resolved HEAD', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: c327401509, passage: 'It has to check the resolved HEAD, not the ref that was requested', source_url: 'https://www.air.security/blog-posts/plugin4shell', verdict: ok}
- {claim_id: dcedf7244a, passage: 'Nach Angaben des GitHub-Supports ...; Anthropic release notes do not mention the fix, the account is Air''s (THN)', source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: '1754203053', passage: "Nach Angaben des GitHub-Supports steckt der Fix in der Copilot CLI ab Version 1.0.87 ... Copilot-App ab Version 1.1.23 ... Der Fix pr\xFCft, ob der ausgecheckte Code dem gepinnten Commit entspricht.", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: d47b5ef9f4, passage: "Anders als urspr\xFCnglich angegeben ist GitLab nicht angreifbar, da es wie GitHub Branch-Namen im Format eines Commit-Hashes ablehnt.", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 3f9325dbdb, passage: 'Anthropic''s release notes for 2.1.179 do not mention the fix, and the account that it is fixed in is Air''s. ... OpenAI''s own public fix ... shipped in Codex 0.146.0.', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: b5feca8e15, passage: 'GitHub does not allow branch or tag names that look like commit hashes ... a reader who installs plugins only from the agents'' default, GitHub-based marketplaces is not exposed to the branch-name vers', source_url: 'https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html', verdict: ok}
- {claim_id: b9d15dd443, passage: "Am 4. August erhielten die Sicherheitsforscher von Google die Best\xE4tigung ... (researchers received it from Google)", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 385b30e856, passage: "heise: \"Anders als urspr\xFCnglich angegeben ist GitLab nicht angreifbar\"; earlier text said heise named GitLab; AIR: Microsoft has not shipped a fix (superseded by heise)", source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: 1bb2ee463e, passage: 'GitHub-Supports ... Copilot CLI 1.0.87 ... Copilot-App 1.1.23; GitLab nicht angreifbar; THN: account that it is fixed in is Air''s', source_url: 'https://www.heise.de/news/Kritische-Luecke-bei-Claude-Code-OpenAI-Codex-GitHub-Copilot-und-Gemini-CLI-11459862.html', verdict: ok}
- {claim_id: f891f313ff, passage: 'Citrix has not published a workaround for either vulnerability, so upgrading is the only fix.', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: bdc45ff79b, passage: Exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated NetScaler deployments have been observed; KEV dateAdded 2026-09-27; GTIG campaign since at least early September, source_url: 'https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
- {claim_id: cdf94dcdfa, passage: 8 CVEs in CTX697096 (Initial Publication 2026-09-27); "Exploits of CVE-2026-88771 and CVE-2026-88772 ... have been observed.", source_url: 'https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
- {claim_id: 93af5e1d89, passage: 'attackers exploited as zero-days, before any fix existed.', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: 69be7f2e4c, passage: Exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated NetScaler deployments have been observed., source_url: 'https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
- {claim_id: a91abd13b4, passage: 'KEV row: dateAdded 2026-09-27, forensicTriage "Yes", "Customers must conduct forensic triage as directed by BOD 26-04"; the feed states no order (triage "before remediation" is only in the BOD guidanc', source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: F3}
- {claim_id: ff0f929be7, passage: Citrix has confirmed active exploitation of these 2 critical vulnerabilities in the wild ... run a compromise assessment on any internet-facing appliance, source_url: 'https://cert.europa.eu/publications/security-advisories/2026-014/', verdict: ok}
- {claim_id: 64c698d707, passage: 'BC: admins reported IT suppliers advising shutdown; NCSC-NL "reportedly sent a pre-notification"; declined to confirm. BC does not say the shutdown advice traced to the NCSC-NL notice (watchTowr FAQ d', source_url: 'https://www.bleepingcomputer.com/news/security/citrix-admins-warned-to-shut-down-netscalers-over-2-exploited-zero-days/', verdict: F3}
- {claim_id: f78239f07d, passage: 'NCSC-2026-0394 1.0.0 initial version 27-09-2026 16:55 (Citrix fixes 8 vulnerabilities)', source_url: 'https://advisories.ncsc.nl/advisory?id=NCSC-2026-0394', verdict: ok}
- {claim_id: 375d1894db, passage: 'No attribution has been made public. Historically, NetScaler vulnerabilities have been exploited by both state-sponsored groups and ransomware operators; CVE-2023-4966, CVE-2025-5777 in KEV table', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: 8f9351d61d, passage: Appliances patched for CVE-2026-19490 remain vulnerable to CVE-2026-88771 and CVE-2026-88772 unless they run one of the fixed builds above., source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: 648420dd0b, passage: 'Citrix has not published a workaround for either vulnerability, so upgrading is the only fix.', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: 04630e19c2, passage: 'CISA advises checking for compromise and preserving forensic evidence first, because an update can remove the evidence. 1. Capture logs, a snapshot, a support bundle and a core dump', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: fca670b72b, passage: 'Run the IOC scan on the NetScaler Console Security Advisory page (version 14.1-73.36 or later, with telemetry enabled) ... Citrix warns that the IOCs do not cover every technique', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
- {claim_id: 322cc94494, passage: 'payload "pitboss PPE unexpectedly died NSPPE;...`id>...`;# X" in login field; semicolons/backticks; "Failed login attempts ... request parameters, and User-Agent headers can all end up in the logs"', source_url: 'https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/', verdict: ok}
- {claim_id: 226cf67bcf, passage: 'A matching DTLS handshake failure followed within minutes by an NSPPE termination/crash ... strong exploitation signal; alert on these messages and NSPPE kernel termination/crash events independently ', source_url: 'https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances', verdict: ok}
- {claim_id: ed14a6880e, passage: 'NCSC-CH post 13005 created 2026-09-28: "Current exploitation status: Actively Exploited" (fetched via ncsc-csh post 13005)', source_url: 'https://security-hub.ncsc.admin.ch/#/posts/13005', verdict: ok}
- {claim_id: d60f83161c, passage: 'organizations in North America and Europe in the government, financial services, technology, education ... were likely impacted', source_url: 'https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances', verdict: ok}
- {claim_id: ffff8517f1, passage: CVE-2026-88771 ... CWE-20 ... CVSS v4.0 9.5 ... All NetScaler ADC and NetScaler Gateway deployments (Default configuration / No additional feature required), source_url: 'https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
