  surface: summary
  kind: frontmatter
  text: node-ipc npm package (widely-used Node.js IPC library) hijacked via expired-domain account takeover; three malicious versions (9.1.6, 9.2.3, 12.0.1) exfiltrate cloud, CI/CD, SSH and Keychain credentials
