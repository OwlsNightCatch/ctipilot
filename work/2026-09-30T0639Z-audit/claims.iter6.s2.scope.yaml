  kind: record-summary
  text: 'GTIG''s leak-site assessment is corrected from probable rebrand to a possible transition phase. The detection guidance now follows GTIG''s own: the spoofed Office ClientAppId sat on FileDownloaded
    records, and new MFA registrations are suspicious after failed or abandoned challenges. Reuse of captured session cookies replaces an unsupported token-theft mapping, and the title and summary no longer
