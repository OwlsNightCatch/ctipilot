- claim_id: 9d85cd47c1
  entry: 2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync
  surface: body
  kind: uncited
  text: Once running, the backdoor evades detection by patching addresses in `amsi.dll` and `ntdll.dll`, blinding both the Antimalware Scan Interface and Windows Event Logging.
