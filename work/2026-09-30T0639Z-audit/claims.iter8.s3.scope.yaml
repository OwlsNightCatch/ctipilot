- claim_id: 604f99bc26
  entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
  surface: record 2026-09-30T07:19:37Z
  kind: record-summary
  text: 'Several flaw descriptions, counts and version ranges rested on relays and on CVE-record mirrors rather than on HPE''s own bulletins, which are now the primary source: the Fabric Composer bulletin
    lists 52 CVEs (not 45) affecting 7.3.3 and below, the AOS-CX bulletin lists 34 CVEs, HPE lists 10.18.0001 as the affected 10.18 build while CERT-FR reads the branch as all 10.18.x before 10.18.1002,
    and the end-of-maintenance 10.10 branch has no fix for the lower-rated AOS-CX flaws. HPE''s exploitation statement is quoted as written. The SSH-daemon description and its evidence quote now come from
