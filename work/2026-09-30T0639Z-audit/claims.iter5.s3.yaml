  surface: summary
  kind: frontmatter
  text: Citrix's CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772 (memory
    overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were already being exploited in the wild before any fix existed. CISA added both to KEV the same day; Citrix lists
    no workaround. Google's Mandiant and GTIG report a campaign running since at least early September that leaves web-server-configuration persistence on compromised appliances, so an appliance patched
    after the bulletin still needs a compromise check.
