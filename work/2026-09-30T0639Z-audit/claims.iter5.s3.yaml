  kind: frontmatter
  text: 'CISA added three unrelated Linux kernel CVEs to its Known Exploited Vulnerabilities catalog on 2026-09-18: CVE-2025-39682 (kTLS receive-path logic error, network-reachable where kernel TLS is in
    use according to Red Hat, local according to The Hacker News), CVE-2025-39964 (AF_ALG crypto-socket race condition, local) and CVE-2026-53266 (netfilter bridge ebtables SNAT out-of-bounds write, local).
