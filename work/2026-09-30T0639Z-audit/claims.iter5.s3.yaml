- claim_id: 0d1f4df940
  entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
  surface: summary
  kind: frontmatter
  text: On 2026-05-18 all 53 version tags of the actions-cool/issues-helper GitHub Action, and all 15 of actions-cool/maintain-one-comment, were moved to imposter commits whose payload reads the Runner.Worker
    process memory for decrypted workflow secrets and sends them over HTTPS to an attacker-controlled domain (StepSecurity). Socket links the exfiltration domain to the Mini Shai-Hulud npm campaign; only
    workflows pinned to a full commit SHA were unaffected.
