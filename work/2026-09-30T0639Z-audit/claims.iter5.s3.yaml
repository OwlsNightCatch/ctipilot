  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: headline
  kind: frontmatter
  text: AI coding agents' plugin SHA-pinning is bypassable, mainly via plugins hosted on Bitbucket or self-hosted git, and only consumer Gemini CLI stays unfixed
- claim_id: cf6995bfb5
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: summary
  kind: frontmatter
  text: 'AIR Security disclosed Plugin4Shell (2026-09-17): a design flaw present in Claude Code, OpenAI Codex, GitHub Copilot and Gemini CLI, none of which verified after checkout that a plugin''s working
    tree matches its marketplace-pinned commit hash, so a repository owner can swap malicious code into an installed, trusted plugin on its next update. The branch-name trick needs a git host that accepts
    hash-shaped branch names, such as Bitbucket or a self-hosted server (GitHub and GitLab reject them), and auto-update is on by default only for the agents'' built-in GitHub-hosted marketplaces; Gemini
    CLI''s variant is not clearly blocked on GitHub. OpenAI''s own fix shipped in Codex 0.146.0, AIR says Claude Code 2.1.179 is fixed, heise online reports, citing GitHub support, that Copilot CLI 1.0.87
    and the Copilot app 1.1.23 carry a fix, and Google is retiring consumer Gemini CLI instead of fixing it.'
- claim_id: 73f5d71f53
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: actions[0]
  kind: frontmatter
  text: 'Upgrade Codex to 0.146.0 or later (OpenAI''s own fix), Claude Code to 2.1.179 or later (fixed according to AIR, though Anthropic''s release notes do not mention it), and Copilot CLI to 1.0.87 or
    later and the Copilot app to 1.1.23 or later (fixed according to GitHub support, as reported by heise online). Consumer Gemini CLI gets no fix: on it, verify `git rev-parse HEAD` against a plugin''s
    marketplace-pinned SHA before trusting any update, or migrate off it as AIR advises.'
