  entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
  surface: body
  kind: cited
  text: StepSecurity disclosed on 2026-05-18 that every existing tag of the `actions-cool/issues-helper` GitHub Action, 53 in total, had been moved to its own imposter commit that is not reachable from
    the action's default branch, and that all 15 tags of the companion `actions-cool/maintain-one-comment` action were moved the same way (
  urls:
  - https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials
