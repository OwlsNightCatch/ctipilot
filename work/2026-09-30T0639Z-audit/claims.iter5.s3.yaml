- claim_id: ec017dd589
  entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
  surface: summary
  kind: frontmatter
  text: 'JetBrains disclosed CVE-2026-63077 on 2026-07-27: an attacker with nothing more than HTTP(S) access to a TeamCity On-Premises server can exploit the agent-polling protocol to bypass authentication
    checks and execute arbitrary operating-system commands as the TeamCity server process. Every On-Premises version is affected; fixes are 2025.11.7 and 2026.1.3, with a security-patch plugin available
    down to 2017.1 for estates that cannot upgrade immediately, and JetBrains says TeamCity Cloud needs no customer action because it is already mitigated. CISA listed the flaw as exploited on 2026-08-05,
    JetBrains reported active and attempted exploitation of unpatched servers on 2026-08-07, CISA''s KEV catalog now marks known ransomware campaign use, and JetBrains'' own Cadence service was breached
    through it. A build server compromise is a supply-chain compromise.'
- claim_id: 9b7ccea9d4
  entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
  surface: actions[0]
  kind: frontmatter
  text: Upgrade TeamCity On-Premises to 2025.11.7 or 2026.1.3 on the matching branch, or install JetBrains' security-patch plugin where the version is older than that but at least 2017.1, and while the
    upgrade is scheduled, take the server's agent-polling endpoint off any internet-reachable interface, because the flaw needs nothing but HTTP(S) reachability.
- claim_id: 89cc79bb12
  entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
  surface: actions[1]
  kind: frontmatter
  text: 'Treat any TeamCity On-Premises server that was internet-reachable and unpatched before 2026-08-05 as a compromise-assessment target rather than a completed patch: review build-agent registrations
    for agents you did not enrol, and rotate the VCS credentials, artifact-repository tokens and signing keys the server holds, because an upgrade evicts the entry point but not what was taken through it.'
