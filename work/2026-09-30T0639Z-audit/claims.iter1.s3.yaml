    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "headline"
    kind: frontmatter
    text: "CISA and Red Hat confirm active exploitation of three separate Linux kernel bugs, with no public account of how any of them is used"
  - claim_id: 368c200cef
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "summary"
    kind: frontmatter
    text: "CISA added three unrelated Linux kernel CVEs to its Known Exploited Vulnerabilities catalog on 2026-09-18 — CVE-2025-39682 (kTLS receive-path logic error, network-reachable when kernel TLS offload is used), CVE-2025-39964 (AF_ALG crypto-socket race condition, local) and CVE-2026-53266 (netfilter bridge ebtables SNAT out-of-bounds write, local) — with no named actor, campaign or public technical account of the exploitation behind any of the three. Red Hat updated its advisories on 2026-09-19 to state that public exploits exist."
  - claim_id: 8d93666909
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CISA added three unrelated Linux kernel vulnerabilities to its Known Exploited Vulnerabilities catalog on 2026-09-18, in two separate alerts ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-one-known-exploited-vulnerability-catalog", "https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-two-known-exploited-vulnerabilities-catalog"]
  - claim_id: b0347fcbce
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2025-39682 is a logic error in the kernel's TLS receive path (`net/tls/tls_sw.c`): a peer on a connection using kernel TLS offload for receive can supply a record sequence where the initial record picked up from the socket's `rx_list` queue is itself zero-length, a corner case the fix commit describes as previously unhandled ("
    urls: ["https://access.redhat.com/security/cve/cve-2025-39682"]
  - claim_id: 6c77ae1bf5
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2025-39964 is a race condition in the AF_ALG crypto user-API socket (`crypto/af_alg.c`): concurrent `sendmsg()` calls to the same socket were never given exclusive-write ownership, letting request payloads interleave and corrupt per-socket state ("
    urls: ["https://access.redhat.com/security/cve/cve-2025-39964"]
  - claim_id: 49f81f3cca
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2026-53266 is an out-of-bounds write in the netfilter bridge `ebt_snat` target: the optional ARP sender-hardware-address rewrite can improperly modify the underlying memory pages rather than a copy of them, which Red Hat rates Important and describes as reaching privilege escalation, memory corruption or denial of service ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-53266"]
  - claim_id: 301d2b8656
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: uncited
    text: "Fixed kernel builds: 6.1.149 / 6.6.103 / 6.12.44 / 6.16.4 / 6.17 for CVE-2025-39682; 5.10.245 / 5.15.194 / 6.1.154 / 6.6.108 / 6.12.49 / 6.16.9 for CVE-2025-39964; 5.10.259 / 5.15.210 / 6.1.176 / 6.6.143 / 6.12.94 / 6.18.36 for CVE-2026-53266."
  - claim_id: 595bff6948
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the KEV listing is jurisdiction-agnostic confirmation of active exploitation, so treat all three as confirmed exploited despite the absence of a public narrative."
  - claim_id: 9e73fa44b1
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: derived
    text: "The two local-access bugs (AF_ALG, ebtables SNAT ARP-rewrite) narrow the realistic exposure to hosts where an untrusted or partially-trusted local user already has a foothold; the kTLS bug is the only one reachable purely over the network, and only against hosts that have deliberately enabled kernel TLS receive offload."
  - claim_id: ab2f2327cc
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: derived
    text: "A general-purpose Linux server or workstation fleet on standard kernel patch cadence is not at elevated risk from any of the three; a fleet running custom bridge-netfilter appliances, kTLS-terminating proxies, or exposing AF_ALG to less-trusted users should patch those specific hosts now rather than waiting for the normal cycle."
  - claim_id: 928e9070d8
