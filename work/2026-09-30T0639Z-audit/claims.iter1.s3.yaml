  - claim_id: 0eba539ec4
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** the two findings point at the same fix, so put phishing-resistant MFA and session brokering on every VPN and jump-host path into OT, and treat an unexplained process anomaly as a trigger for a security investigation, since Dragos found 82% of organisations lack that criterion ("
    urls: ["https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review"]
  - claim_id: 9fc7ed15f6
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
