  - claim_id: e09b3c86f2
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
    kind: derived
    text: "**Exposure:** OT networks reachable from enterprise IT, and remote access into OT through VPN or jump hosts protected by reusable credentials."
