    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: uncited
    text: "Because the account is a fixed, vendor-embedded identity and not one an operator ever provisions, any successful web-interface authentication under it is anomalous by construction — there is no legitimate administrative workflow that uses it, so a single such event is a compromise signal rather than something to baseline."
  - claim_id: 06b616dac8
    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: uncited
    text: "Hardening beyond the hotfix is reachability: confine the FMC web interface to a dedicated management segment, since the flaw needs nothing more than a network path to it."
  - claim_id: 290d67f70c
    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch, then check for compromise."
  - claim_id: 78802e56fd
    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: derived
    text: "For a box that stores managed-device credentials, a hit on Cisco's log check means the credentials it held should be treated as exposed, and the upgrade alone only closes the door behind whoever may already have walked through it."
  - claim_id: 93d4a5fc64
    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: derived
    text: "**Triage:** normal FMC logins map to named operator accounts with a provisioning history and an owner."
  - claim_id: 8dee3a6dd0
    entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
    surface: "body"
    kind: derived
    text: "The discriminator here is identity rather than behaviour: an authentication event for the vendor's static low-privileged account, from any source address including an internal one, has no benign explanation, whereas a failed login from an unexpected address is ordinary internet noise on any exposed management interface."
