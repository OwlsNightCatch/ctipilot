    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "summary"
    kind: frontmatter
    text: "Dragos's ninth annual OT Cybersecurity Year in Review, released 2026-02-17 and summarised again on 2026-05-07, finds poor IT/OT segmentation in 81% of its assessments, compromised VPN or jump-host credentials in 73% of all-time incident cases, adequate OT monitoring in only 46% of assessments, and 119 ransomware groups hitting 3,300 industrial organisations in 2025."
  - claim_id: 54f05ae86f
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
    kind: cited
    text: "Its field findings: \"81 percent of assessments identified poor IT/OT segmentation. 73 percent of all-time IR cases involved compromised VPN or jumphost credentials\", only 46% of assessments found adequate OT network monitoring, 56% of penetration tests abused living-off-the-land tools without triggering alerts, and 30% of incident cases began with operational issues the asset owner could not explain ("
    urls: ["https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review"]
  - claim_id: a32eb47307
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
    kind: cited
    text: "Dragos tracked 119 ransomware groups affecting 3,300 industrial organisations in 2025, up from 80 groups in 2024, and says many OT ransomware incidents are misfiled as IT incidents when the Windows or ESXi hosts running SCADA software are encrypted ("
    urls: ["https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review"]
  - claim_id: 1816ed208f
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "body"
    kind: cited
    text: "A 2026-05-07 follow-up adds that 49% of Dragos Services reports carried elevated remote-access findings and 53% identified internet-facing systems ("
