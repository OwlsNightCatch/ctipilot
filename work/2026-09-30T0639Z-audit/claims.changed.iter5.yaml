    surface: "record 2026-09-30T07:12:19Z"
    kind: record-summary
    text: "The earlier text said pro-Russian hacktivists modified pump settings at all five facilities, with manual overrides preventing disruption, that ABW attributed the intrusions to APT28, APT29 and UNC1151 and to hacktivists exploiting flat IT/OT networks, and it described Poland's NIS2 transposition. ABW's 2024-2025 activity review names the five plants and says that in some cases the attackers reached industrial control systems and altered equipment parameters, but it names no actor or access vector. ABW's press office has said the potentially compromised operators had internet-reachable IT resources, including HMI panels. ABW released the review in Polish on 2026-05-06 and in English on 2026-05-25, not on 2026-05-07. The priority moves from high to notable."
