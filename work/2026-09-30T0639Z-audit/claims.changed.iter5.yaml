    surface: "record 2026-09-30T07:00:42Z"
    kind: record-summary
    text: "The title presented the GitHub-exposed secret as the campaign's route and the summary called it the likely initial access, but Microsoft lists it only as possible initial access and could not confirm it was used. The takeaway called resource locks and deletion protection the only control that stopped deletions, while the Azure SQL deletions failed on an unsupported API version. The rotation step named a tenant ID, which is not a credential, and now adds Microsoft's advice to investigate each exposed credential's historical use. The headline merged the two service principals Microsoft reports into one. The summary said the actor tried to disable the Site Recovery and Backup protection locks, which Microsoft reports as failed deletion attempts, and the main text said Microsoft attributes the activity to JADEPUFFER, which Microsoft describes as associated with it."
