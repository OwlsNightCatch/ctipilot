    entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
    surface: "record 2026-09-30T07:03:25Z"
    kind: record-summary
    text: "The title is shortened, leaving the domain-root link, the every-workstation scope and the dark-web publication to the summary and main text. An unsourced claim that the incident is unrelated to the Payload leak-site group is removed, and the main text now notes that a group of that name runs a leak site and that no cited source ties it to this incident. A detection line gives Kaspersky's directory-service, SYSVOL and endpoint telemetry, and the triage line rests on Kaspersky's indicators rather than on Administrator-account or firewall settings alone. The priority moves from high to notable: a single-victim incident from April 2026 with a transferable technique but no tie to Switzerland."
