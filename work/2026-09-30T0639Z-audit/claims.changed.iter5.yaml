  - claim_id: 09714d8ca4
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "summary"
    kind: frontmatter
    text: "THORChain, a Switzerland-based cross-chain liquidity protocol, lost about $11M across nine blockchains after one of its six vaults was compromised (The Record, 2026-05-15; TRM Labs, 2026-05-15). CryptoTimes reports that THORChain's first incident update confirmed a malicious, newly churned validator node as the vector, and that the working theory is a GG20 Threshold Signature Scheme implementation flaw through which that node gradually leaked vault key material over keygen and signing rounds before forging outbound signatures (CryptoTimes, 2026-05-17). THORChain said initial indications were that user funds were safe and only protocol-owned funds were affected (The Record, 2026-05-15)."
