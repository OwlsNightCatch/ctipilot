  - claim_id: 46c4a93031
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: uncited
    text: "Three phishing kits, ERRTRAFFIC plus two Push-internal-named kits TURNTIP and NOCHAIN, account for 73% of ClickFix detections, with ERRTRAFFIC alone responsible for 34% in August."
  - claim_id: e00d849a19
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: uncited
    text: "Four in five 2026 ClickFix payloads were reached through search engines (Google/Bing) rather than email, via compromised sites, malvertising and SEO poisoning, meaning the technique largely bypasses email security controls that assume a phishing message is the entry point."
  - claim_id: abcf44d0a0
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: uncited
    text: "Push observed 84 distinct ClickFix command forms spanning more than 20 trusted system binaries (PowerShell, cmd, bash/zsh, mshta, rundll32, msiexec, pcalua, wmic, certutil, schtasks among others), a deliberate LOLBin-rotation strategy intended to outpace endpoint-detection rules keyed on any single binary; Push reports the main kits now read their configuration from a smart contract on a public blockchain (an \"EtherHiding\" technique observed across BNB Smart Chain testnet, Polygon, Base and Ethereum Sepolia, with most of the observed traffic on testnets) rather than from the page itself, so payload and lure are fetched at load time, can be rotated with a single blockchain transaction, and leave no hosting infrastructure for defenders to take down or block."
  - claim_id: c546ec57a9
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: uncited
    text: "Push notes that standard EDR guidance of baselining LOLBin activity and alerting on anomalies suffers a high false-positive rate for this technique class, because legitimate IT automation, MDM tooling and administrator scripts generate similar-looking process-execution telemetry to a ClickFix payload's own binary invocation."
  - claim_id: bf0e9a36ec
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: derived
    text: "**Triage:** the discriminator is not which binary runs but its parent-process lineage and trigger context: a LOLBin (PowerShell, mshta, rundll32, certutil, or any of the 20+ Push documents) launched with a paste-derived command line from `explorer.exe` or a browser process, following a user interaction with a fake CAPTCHA or verification prompt on a webpage, is the ClickFix pattern; the same binary launched from a scheduled task, an MDM agent, or an IT-administration parent process in the course of routine automation is the benign lookalike."
  - claim_id: 8a2e61e59a
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: derived
    text: "Sequence and parentage separate the two; the binary alone does not."
  - claim_id: 2e7a99026a
    entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** because delivery is overwhelmingly search-driven rather than email-driven, browser and endpoint telemetry, not mail-gateway controls, are where this technique surfaces; monitor for the clipboard-paste-to-Run/PowerShell pattern specifically, and treat any of the 20+ documented LOLBins launched immediately after a browser session visited an unfamiliar or newly-registered domain as a priority hunt lead, independent of which specific binary appears."
  - claim_id: 7559cc6c63
    entry: 2026-09-29/bitget-hot-wallet-theft-north-korea-nexus
    surface: "record 2026-09-30T06:56:10Z"
    kind: record-summary
    text: "Mandiant's and SlowMist's investigation reports, released by Bitget on 2026-09-30, trace the intrusion through two compromised third-party security appliances: a zero-day in a service on one appliance with activity from 2026-08-31, a web shell and command-and-control on the other, then lateral movement to the production wallet job server and a custom withdrawal tool that forged risk-control parameters. Priority moves from high to notable: the appliance path is a transferable technique worth a hunt, but the vendors are unnamed and there is no product-specific decision for Swiss public bodies. TRM Labs' attribution reasoning is stated as TRM reports it, and the earlier USD 351.6M loss and the USD 464M fund size are Bitget's own figures as TRM relays them."
