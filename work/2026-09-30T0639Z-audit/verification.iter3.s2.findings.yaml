- code: F11
  category: editorial-advisory
  section: aepd / pentagon
  item: "2026-09-17/aepd-first-ai-agent-breach-notification and 2026-09-27/pentagon-dmdc-military-personnel-data-breach-unencrypted-ssn (relevance sentences)"
  url_or_quote: "\"The relevance for the constituency is the policy signal: ...\" / \"Its relevance is sectoral: a government's central personnel-data store kept identity numbers unencrypted ...\""
  summary: "(low confidence) 'the constituency' is organisation-profile vocabulary in reader-facing text; and the Pentagon 'sectoral' ground is not one of the four grounds named for out-of-nexus incidents (global significance, transferable TTP, plausible actor, imminent shared threat). The Pentagon Update section also restates the count and 'small number of unauthorized users' already in the main paragraph. Consider 'For a Swiss public-sector SOC, ...' wording and dropping the duplicated count."
