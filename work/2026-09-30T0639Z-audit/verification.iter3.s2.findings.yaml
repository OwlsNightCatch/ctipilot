  section: ncsc-ch-google-recovery
  item: "2026-09-23/ncsc-ch-google-recovery-oauth-app-password-persistence (Triage / Detection and hardening / Defender takeaway)"
  url_or_quote: "\"legitimate Google administrators and helpdesks never call account holders unprompted about a security case; ... any login page served from sites.google.com rather than accounts.google.com\""
  summary: "(low confidence) The Triage, Detection and Defender takeaway paragraphs carry no inline link although the facts are on the BACS page (Empfehlungen: 'Echte Plattformbetreiber kontaktieren Nutzerinnen und Nutzer niemals spontan telefonisch'; 'Offizielle Login-Seiten von Google befinden sich ausschliesslich unter accounts.google.com'; delete all App-Passwoerter). This run linked the first paragraph but left the tail uncited. Claims 850b20cf2b, a034e7dade, 73a69331a6 (verified supported, uncited)."
- code: F11
  category: editorial-advisory
  section: oracle-september-2026
  item: "2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10 (summary)"
  url_or_quote: "\"...User Interaction None and \\\"Remote Exploit without Auth.\\\" Yes: six CVSS 10.0 flaws in WebLogic Server, ...\""
  summary: "The summary sentence this run rewrote splices a matrix column value ('Yes') into the prose with a colon, so it reads as a stray answer; it also introduces 'forty-four CVSS 9.8 flaws spanning the same Fusion Middleware product line' and then lists E-Business Suite, Hyperion and other non-Fusion-Middleware products inside that count. Split into two clean sentences."
- code: F11
  category: editorial-advisory
  section: virtualizor
  item: "2026-09-23/virtualizor-billing-hook-unauth-root-rce (summary)"
  url_or_quote: "\"VulnCheck's disclosure does not state whether it observed in-the-wild exploitation. It turned the command-injection flaw into a self-contained module ... and does not say whether that module is public.\""
  summary: "Subject shift: 'It turned ...' now refers to the disclosure rather than VulnCheck, and the trailing clause has no clear subject. Rewrite as 'VulnCheck turned the command-injection flaw into ...; its post does not say whether that module is public or whether it observed in-the-wild exploitation.'"
