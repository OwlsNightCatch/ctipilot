- code: F4
  category: hallucinated-fact
  section: cve-2026-42016-42018
  item: "2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover (Correction 2026-09-30T07:19:38Z vs Defender takeaway)"
  url_or_quote: "Correction: \"CVE-2026-42016 is fixed only from 7.133.11, so an instance on the 7.111, 7.117 or 7.125 branch needs 7.133.11 or later to close the chain\" / Defender takeaway: \"patching one CVE in this pair without the other leaves the chain intact\""
  summary: "The two statements cannot both hold. JFrog's CVE-2026-42018 table (https://docs.jfrog.com/releases/docs/jfrog-security-advisories) lists 7.133.0 to 7.133.28 as affected with 7.133.28 the patched build, so a 7.111/7.117/7.125 instance moved to 7.133.11 (the CVE-2026-42016 fix) is still exposed to CVE-2026-42018, which the takeaway says leaves the chain intact; conversely Wiz says 'Neither vulnerability grants administrative control on its own', so closing CVE-2026-42016 alone does break the admin escalation and the takeaway overstates. Reconcile: say 7.133.11 or later closes CVE-2026-42016 (and on the 7.133 branch 7.133.28 or later is needed for CVE-2026-42018), and reword the takeaway to what each fix closes. Claims b2d46975a0, 4a1ffafb96."
- code: F4
  category: hallucinated-fact
  section: cve-2026-42016-42018
  item: "2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover (immediate_action)"
  url_or_quote: "\"Any hit is a confirmed compromise, not a near-miss.\""
  summary: "(low confidence) Wiz (https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201) describes the sequence as successful HTTP 200 responses at both steps and advises 'If your instance was exposed while vulnerable, assume compromise and hunt'; it never says a log hit is a confirmed compromise. The action text searches for the two POSTs with no status-code condition, so a hit with 401/4xx is a failed or blocked attempt. Say 'a hit with HTTP 200 on both requests is a successful exploitation; treat the instance as compromised' (the longer action[1] already says 'treat the instance as compromised'). Claim c10715aa8e. Text predates this run."
- code: F14
  category: quantifier-without-source
  section: oracle-september-2026
  item: "2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10 (## Update 2026-09-29, paragraph 2, rewritten this run)"
  url_or_quote: "\"the matrix lists thirty-two further CVSS 9.8 flaws inside the Fusion Middleware product line, beyond the single CVSS 10.0 flaw in each of four of its components.\""
  summary: "(low confidence) Oracle's risk matrix (https://www.oracle.com/security-alerts/cspusep2026.html) carries a CVSS 10.0 flaw in five Fusion Middleware components (CVE-2026-71133 Access Manager, CVE-2026-83099 Forms, CVE-2026-83059 Internet Directory, CVE-2026-83020 Platform Security for Java, CVE-2026-83021 WebLogic Server); NCSC-NL (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0372) also lists five CVSS 10.0 ids in those five products. The same paragraph then lists WebLogic Server with three further flaws, so 'four' is wrong. Change to five. Not a ledger claim."
- code: F4
  category: hallucinated-fact
  section: virtualizor
  item: "2026-09-23/virtualizor-billing-hook-unauth-root-rce (tags)"
  url_or_quote: "tags: [vulnerabilities, rce, pre-auth, default-config, patch-available]"
  summary: "(low confidence) VulnCheck (https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce) headed a section 'The precondition, stated honestly': 'This is not precondition-free' (a type 2, in-house-billing, currently suspended, paid-up account must exist), and the body says the same. Only the sql_mode part is stated as default. The default-config tag overstates for the flagship CVE-2026-43641; the run removed the same tag from the Arista entry for the equivalent reason. Tags are outside the ledger."
- code: F3
  category: claim-not-supported
  section: multiple
  item: "cve-2026-46300 (Red Hat RHSB-2026-003, 2026-07-03) and afpa (Cyberattaque.org 2026-09-19, FrenchBreaches 2026-09-19)"
  url_or_quote: "[Red Hat RHSB-2026-003, 2026-07-03] / [Cyberattaque.org, 2026-09-19] / [FrenchBreaches, 2026-09-19]"
  summary: "(low confidence) Citation dates differ by 2 or more days from the pages' own publication dates: RHSB-2026-003 shows 'Public Date: May 7, 2026' and 'Updated July 3, 2026'; Cyberattaque.org datePublished 2026-09-15 (modified 2026-09-19); FrenchBreaches datePublished 2026-09-16 (modified 2026-09-19). The labels use the page-modified date. The labels predate this run but were re-used in text it rewrote. Either use the publication date or leave (the modified date is defensible as an as-of date); flagging per the two-day rule."
