    kind: cited
    text: "A per-country cardholder breakdown embedded in Gambit's own page (488,372 of the recovered cards, 79.0%, United States) skews overwhelmingly toward the United States; no Swiss-issued cards appear among the top entries of that table ("
    urls: ["https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"]
