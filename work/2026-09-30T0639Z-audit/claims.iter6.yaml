    entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
    surface: "summary"
    kind: frontmatter
    text: "Kiteworks, a secure managed-file-transfer and confidential-communications platform rebranded from Accellion and marketed to government agencies and financial institutions, emailed customers worldwide on 2026-09-25 urging a precautionary shutdown of every Kiteworks system over the weekend of 2026-09-26 (six hours in press coverage, nine on Kiteworks' own page) after receiving \"credible threat intelligence from law enforcement\" of a possible imminent attack; its later statements name federal intelligence authorities. No CVE was known for the threat behind the warning and Kiteworks says it is not aware of any actual compromise; the Central European shutdown window falls in the timezone Switzerland shares. Kiteworks later said its engineering and security work during the shutdown led to the discovery and fix of a previously unknown critical vulnerability in a capability enabled for under 1% of its customers, with no indication it was exploited. On 2026-09-30 Kiteworks published advisories for Email Protection Gateway, Core and Secure Data Forms, including CVE-2026-54154, a maximum-severity unauthenticated code-execution chain to root in all Email Protection Gateway versions before 9.4.1, with further critical fixes in 9.5.0 and 9.5.1, three of them CVSS 9.8 account takeovers; none is stated to be exploited."
