    kind: frontmatter
    text: "Poland's Internal Security Agency (ABW) reports that in 2025 attackers breached water treatment plants in Jabłonna Lacka, Szczytno, Małdyty, Tolkmicko and Sierakowo and, where they reached the industrial control systems, altered equipment parameters, putting operation and water supply at risk. It names no actor or access vector for these breaches. In a separate passage on municipal infrastructure, ABW describes hacktivist groups exploiting poor password policies and device management panels exposed directly to the internet."
