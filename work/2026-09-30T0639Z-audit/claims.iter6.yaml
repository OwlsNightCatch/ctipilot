    text: "Dragos: poor IT/OT segmentation in 81% of assessments, and compromised VPN or jump-host credentials involved in 73% of its all-time incident cases"
  - claim_id: ca2ed67adc
    entry: 2026-05-08/dragos-2025-ot-cybersecurity-year-in-review-81-of-ir-engagem
    surface: "summary"
    kind: frontmatter
    text: "Dragos's ninth annual OT Cybersecurity Year in Review, released 2026-02-17 and summarised again on 2026-05-07, finds poor IT/OT segmentation in 81% of its assessments, compromised VPN or jump-host credentials in 73% of all-time incident cases, adequate OT monitoring in only 46% of assessments, and 119 ransomware groups hitting 3,300 industrial organisations in 2025."
