    surface: "summary"
    kind: frontmatter
    text: "Japan's NPA and NCO, the US FBI and DoD Cyber Crime Center, Australia's ASD/ACSC and Germany's BND and BfV jointly published a Cybersecurity Advisory on 2026-09-18 on the DPRK \"WaterPlum\" cyber-actor group, the long-running campaign publicly known as \"Contagious Interview\". From around December 2025 through July 2026 it counts 30,000+ infected devices across 100+ countries, funds or credentials exfiltrated from 7,000+ cryptocurrency wallets, and roughly USD 10.7 million transferred to DPRK. The advisory names five malware families delivered via fake technical-interview coding assignments and reports Japan's first dismantled DPRK \"laptop farm.\""
