    text: "For network access, NightEagle abuses Microsoft's own legitimate dev-tunnels feature (`*.devtunnels.ms`), a service meant to publish local developer web services to the internet, to expose port 3389 (RDP) outward on the compromised host, then layers `rdp2tcp`, a public RDP-virtual-channel TCP tunneling tool, inside that RDP session, a combination Kaspersky states lets the group maintain network access using legitimate services, without opening any additional suspicious port."
