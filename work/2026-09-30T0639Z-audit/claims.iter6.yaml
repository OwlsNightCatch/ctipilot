    surface: "body"
    kind: uncited
    text: "NLnet Labs released Unbound 1.26.1 as a security release on 2026-09-16, fixing nine vulnerabilities in the widely deployed open-source validating and recursive DNS resolver."
  - claim_id: 09cc8e5cfc
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the prerequisite for CVE-2026-81642 is not exposure to attacker-initiated connections but DNSSEC validation plus the ability to recurse into an attacker-registered domain, a condition most validating recursive resolvers meet by design, since resolving arbitrary domains on request is their job."
  - claim_id: efd93ec146
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "Patch to 1.26.1 now rather than waiting for confirmed exploitation; CVE-2026-82717's outcome is more heap-layout- and build-dependent, so a crash/DoS is the more likely near-term observable even without full RCE, but it shares the same fix and the same urgency."
  - claim_id: 008a71b4ca
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "Detection concept: `unbound`/`named`-style crash-loops or repeated resolver-process restarts that correlate with resolution of an unusual or newly registered authoritative zone are the closest available behavioral signal in the absence of a public proof-of-concept; no PoC was found at time of writing."
  - claim_id: 520ccf2a78
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Triage:** ordinary DNSSEC validation failures (a misconfigured zone, an expired signature) produce a `SERVFAIL` response and a logged validation error, not a resolver crash; a `named`/`unbound` worker process terminating or restarting during or immediately after resolving a specific external zone is the discriminator that separates this from routine DNSSEC validation noise."
