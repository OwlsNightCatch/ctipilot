    surface: "body"
    kind: cited
    text: "In the Unit 42 case the actor likely turned to DeepSeek, which Unit 42 describes as a model with minimal safety controls, after Western providers' controls limited it, and a framework-bundled jailbreaking skill was also installed ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/"]
  - claim_id: a50e7a1963
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit Security's Threat Intelligence team recovered a financially motivated operator's exposed staging server and reconstructed a campaign, running since July 2026, in which three off-the-shelf open-source AI agent harnesses conduct nearly the entire intrusion lifecycle unattended against online retailers."
  - claim_id: b9f171d850
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Strix, an open-source AI pentesting tool run via OpenRouter (GLM 5.2, later switched to DeepSeek v4 Pro), performs autonomous vulnerability discovery: 146 deep-mode scans against 138 hosts between 23–31 August 2026, burning 633 hours of scanner time within 195 hours of wall-clock time."
  - claim_id: 81a1b12b10
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Hermes, an open-source autonomous agent with persistent memory and skills the agent writes and edits itself, orchestrated the campaign end to end, running on Anthropic Opus 4.6 (\"after newer models refused its requests\") under a Chinese system persona the operator loaded, titled \"SOUL - Red Team Operator\"."
  - claim_id: 0c145f1aa2
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "One fully documented Cairn project illustrates the chain, though Gambit is explicit that each victim's actual path was chosen dynamically through real-time probing and most chains differed victim to victim: unauthenticated SQL injection in a login email parameter (error-based EXTRACTVALUE) read a one-time-passcode value in plaintext directly from an application database table, bypassing multi-factor authentication and reaching the admin panel; an image-upload field with no extension check then gave host remote code execution as a non-root user; a `sudo` misconfiguration allowing NOPASSWD execution of `python3.12` escalated that to root; an internal NFS mount configured with `no_root_squash` let the agent read a separate host's WordPress database credentials in plaintext from its `wp-config.php`; those credentials gave a direct database write creating a new WordPress administrator account, which in turn let the agent upload a malicious plugin for code execution on the blog host; from there the agent dumped the full contents of the account's AWS Secrets Manager (46 secrets, 102 KB), reached the production Magento database on Amazon Aurora, extracted the Magento application's encryption key, and used it to decrypt stored card numbers encrypted with Blowfish in ECB mode."
  - claim_id: 7fc6c16b77
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Confirmed impact across the campaign: 600,000-plus unexpired credit-card records exfiltrated from two victims, and skimmer scripts ordered against at least 27 named victims and confirmed in place on 19 of them according to the body of Gambit's report, although its own summary counts skimmer installations on the websites of five companies and does not reconcile the two figures."
  - claim_id: ed6be78db2
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit also detected more than 100 further websites infected with a skimmer associated with the campaign."
  - claim_id: 494215e16e
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit reports some level of access to the assets of companies including a Fortune 500 hospitality company, a major US airline, a large private US industrial-supplies distributor and a US online fashion retailer, which it names separately from the illustrative chain above."
  - claim_id: b16fff01f2
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Gambit documents eight distinct skimmer-injection methods used across victims, all worth carrying into any custom-web-application hardening review: appending the loader to the end of a legitimate, already-served JavaScript file while restoring its original modification timestamp; inserting a foreign `<script>` tag directly into the checkout page; hiding the loader inside a site's Google global-site-tag (`gtag.js`) block, between the real `gtag('js', ...)` and `gtag('config', ...)` calls, padded with roughly a hundred tab characters to push it past the right edge of a typical code-review view; using a discovered AWS access key to write the loader into the storage bucket behind the retailer's own CDN, so it loads from that trusted CDN host rather than a third-party domain; injecting the loader into a database content field (such as a product-description column) through an admin pod and relocating it to a file on the victim's own domain; adding it as a Kubernetes `initContainer` in a production front-end deployment manifest; writing it directly into a server-side page-cache entry for the checkout page, so the served HTML differs from the page's own template; and a self-healing cron job placed in a JBoss log directory that checks the injected file's size every two minutes and re-appends the loader whenever a redeploy reverts it."
  - claim_id: 909adfc013
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "This was collateral data loss from the attacker's own automated cleanup, not extortion."
  - claim_id: 72781bef06
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "Detection concept, telemetry class first: in web-server access logs, alert on SQL-error-pattern responses (`EXTRACTVALUE` or equivalent) to login-form parameters, and on image-upload requests whose stored file is later executed by the web server rather than served as static content; in host telemetry, alert on `sudo` invocations of an interpreter (`python3.12` or similar) by a low-privilege account with no corresponding change-management record; in network/mount telemetry, flag any host mounting an NFS export it has not mounted before, particularly where the export allows root-equivalent access; in cloud-audit telemetry, alert on a single principal enumerating or reading the entire contents of an AWS Secrets Manager instance in a short window; and in file-integrity or CDN-origin monitoring, treat any modification to a served JavaScript file's content (even with its timestamp preserved) or any script tag added to a checkout page outside a deployment window as high-priority."
  - claim_id: a39f8d294f
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "**Triage:** a legitimate deployment modifies checkout-page assets during a known release window with a corresponding commit and change record; the discriminators here are modification with no matching deployment event, a modification timestamp that has been deliberately restored to match the original file, or content padded with unusual whitespace specifically to evade a manual code read."
  - claim_id: 359b17e362
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: uncited
    text: "In three of the four intrusions the operators worked around model safety controls."
  - claim_id: c208cd5876
