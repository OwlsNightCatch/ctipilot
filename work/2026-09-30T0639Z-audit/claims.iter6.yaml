    text: "The bulletin lists 33 further CVEs scored 4.9 to 8.8, among them an unauthenticated arbitrary file write through an API endpoint (CVE-2026-73752, 8.8, adjacent network), an unauthenticated format-string flaw in the CLI (CVE-2026-73782, 8.8, adjacent network), and a predictable factory-default password in the Credential Manager (CVE-2026-73778, 8.1) that gives an unauthenticated attacker full administrative control of a switch in factory-default or post-Zero-Touch-Provisioning state before an administrator sets credentials ("
