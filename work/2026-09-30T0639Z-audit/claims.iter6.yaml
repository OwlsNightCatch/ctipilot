    kind: cited
    text: "HPE published two Aruba Networking security bulletins on 2026-09-01: HPESBNW05133 for HPE Networking Fabric Composer (AFC) and HPESBNW05134 for HPE Networking AOS-CX ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05134.txt"]
