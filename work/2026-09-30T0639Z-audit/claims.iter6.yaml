    text: "The flaw is what remained of Microsoft's February fix for CVE-2026-21510, which APT28 exploited together with CVE-2026-21513 through crafted LNK files: the February patch stopped code execution and the SmartScreen bypass, but Windows Explorer still opens an SMB connection to the attacker's server when it renders the folder that holds the shortcut, a connection \"sending the victim's Net-NTLMv2 hash to the attacker, which can later be used for NTLM relay attacks and offline cracking\" ("
