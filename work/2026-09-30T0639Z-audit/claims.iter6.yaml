    surface: "body"
    kind: cited
    text: "Developers should check any `tasks.json` for code that downloads or executes further files, avoid opening unknown projects from a path previously marked as trusted, run unknown code only in a sandbox or virtual machine, and be especially cautious of commands or scripts containing strings such as curl, base64, -enc, mshta, Invoke-WebRequest or hidden ("
