    entry: 2026-09-04/cve-2026-85046-chrome-v8-type-confusion-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat fleet-wide Chrome update verification as a today task, not the next patch cycle, given confirmed in-the-wild exploitation and the browser's ubiquity on administrative endpoints."
