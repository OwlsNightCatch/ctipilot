  - claim_id: 7b50dca9c7
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch and hunt JFrog Artifactory now — confirmed admin-takeover chain, backdoors already dropped: Wiz Research confirms active, ongoing exploitation of this two-CVE chain against self-hosted JFrog Artifactory since 15 August 2026, reaching full administrative control and, in multiple cases, a dropped Rust-based backdoor with C2 capability. Six weeks after disclosure, most organizations running Artifactory still have at least one vulnerable instance. Upgrade every instance to 7.133.11 or later, JFrog's only fixed build for CVE-2026-42016, on a build that also carries the CVE-2026-42018 fix for its branch. Wiz lists 7.133.29, 7.146.38 and 7.161.20 for those branches, above JFrog's own table. Wiz's lower-branch builds 7.111.21, 7.117.28 and 7.125.20 stay inside JFrog's affected range for CVE-2026-42016. Then search access logs for the chain's own signature: an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by a POST to /access/api/v1/tokens from the same client. A hit where both requests returned HTTP 200 is a successful exploitation: treat the instance as compromised. Revoke all tokens, reset the Access token signing key and certificate, audit for administrator accounts you did not create, remove unauthorized Groovy plugins and restart the JVM to clear any in-memory implant."
  - claim_id: 7706e2c8e6
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-hosted JFrog Artifactory instance to a build that closes both CVEs: 7.133.11 or later for CVE-2026-42016, which JFrog names as its only fixed build, and the CVE-2026-42018 fix for the branch, where Wiz's corrected builds (7.133.29, 7.146.38, 7.161.20) sit above JFrog's table. Wiz's 7.111.21, 7.117.28 and 7.125.20 are below 7.133.11, so instances on those branches remain vulnerable to CVE-2026-42016 and must move to 7.133.11 or later."
  - claim_id: 83e925117d
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "actions[1]"
    kind: frontmatter
    text: "On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ (trailing slash) followed within minutes by a POST to /access/api/v1/tokens from the same client. That two-request sequence is the chain's signature. Where found, treat the instance as compromised: revoke all tokens, reset the Access token signing key and certificate, audit /api/security/users and /access/api/ui/users for administrator accounts you did not create, remove any Groovy plugin you did not deploy, and restart the JVM to clear an in-memory implant."
  - claim_id: d28cc1f723
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "cves[CVE-2026-42016]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-42016\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"JFrog Artifactory (Self-Hosted) before 7.133.11\", \"fixed\": \"7.133.11\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 1a85474dff
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "cves[CVE-2026-42018]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-42018\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"JFrog Artifactory before 7.111.20; 7.117.0–7.117.27; 7.125.0–7.125.19; 7.133.0–7.133.28; 7.146.0–7.146.8 (JFrog table)\", \"fixed\": \"Wiz: 7.111.21 / 7.117.28 / 7.125.20 / 7.133.29 / 7.146.38 / 7.161.20 (JFrog lists 7.111.20 / 7.117.27 / 7.125.19 / 7.133.28 / 7.146.8)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 996cdaf244
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "JFrog disclosed the two flaws separately and weeks apart, on 2026-07-27 and 2026-08-12, labelling each only \"High\" without a numeric score ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation"]
  - claim_id: c5d5e97856
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "CVE-2026-42016 (CWE-863 Incorrect Authorization), disclosed 27 July 2026, is a privilege-escalation bug in Artifactory's token handling: the platform validates a token's signature and issuer but not the token's *scope* ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation"]
  - claim_id: 315cc88fde
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "Wiz describes the consequence: a low-privileged token can be escalated to admin scope ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: 272cc3e3a7
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "CVE-2026-42018 (CWE-287 Improper Authentication), disclosed 12–13 August 2026, is narrower but supplies the missing first step: Artifactory returns an internal anonymous-user token to a caller who never authenticated, even when anonymous access is disabled ("
    urls: ["https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42018---anonymous-user-token-generation-exposure"]
  - claim_id: 0ba2d86f1b
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "Wiz Research states that the anonymous token from CVE-2026-42018 and the scope-validation gap in CVE-2026-42016 \"together... can turn an unauthenticated request into an admin-scoped token in two steps\" ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: f9b37bd5ff
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "An unauthenticated `POST /access/api/v1/aws/token/` (with the trailing slash, since the bare path returns 401) returns HTTP 200 with a JWT scoped to Artifactory's internal anonymous identity, exploiting CVE-2026-42018 ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: d65bc14c14
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "The operator then exchanges that JWT for a new one via `POST /access/api/v1/tokens`, which returns HTTP 200 carrying admin authority despite the request originating from the anonymous identity, exploiting CVE-2026-42016's missing scope check (**T1550.001**, forging elevated authority onto an application access token) ("
