    surface: "body"
    kind: cited
    text: "Its field findings: \"81 percent of assessments identified poor IT/OT segmentation. 73 percent of all-time IR cases involved compromised VPN or jumphost credentials\", only 46% of assessments found adequate OT network monitoring, 56% of penetration tests abused living-off-the-land tools without triggering alerts, and 30% of incident cases began with operational issues the asset owner could not explain ("
    urls: ["https://www.dragos.com/blog/dragos-2026-ot-cybersecurity-year-in-review"]
