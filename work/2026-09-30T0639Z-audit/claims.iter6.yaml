    surface: "body"
    kind: cited
    text: "Cairn, an autonomous exploitation engine on DeepSeek v4.1 Flash, receives a target domain and an objective and runs unattended for hours until it gets a shell or admin access: \"between 10 and 15 September alone, 105 attack projects were launched and at least 27 companies were compromised to varying degrees\" ("
    urls: ["https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"]
  - claim_id: df718e8161
    entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
    surface: "body"
    kind: cited
    text: "The operator had added a custom skill that strips Hermes's own content-safety filters, and drove the campaign through only 1,951 short, largely Chinese-language operator prompts across 260 sessions, with most of the actual attack work running autonomously between those prompts ("
    urls: ["https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"]
  - claim_id: 4d27a75605
