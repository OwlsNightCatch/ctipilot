    entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
    surface: "record 2026-09-30T06:56:58Z"
    kind: record-summary
    text: "The takeaway said no CVE or Oracle advisory was involved, although ShinyHunters told BleepingComputer it used the WAF bypass for CVE-2026-35273 against FBI Jobs. That link is now attributed to the group, the CVE is recorded with a link to the PeopleSoft campaign entry that carries the patch and hunt actions, the watch-for-an-advisory action is removed, and the priority moves from high to notable because the defender value lies in the already-covered CVE. The FBI's 2026-09-23 statement leaves the point of breach undetermined, and sources differ on whether it confirms the compromise: Krebs on Security reads it as confirmation, while BleepingComputer and CyberScoop report no confirmed breach, scope or attribution. The group's motive is now given in its own words, including its later description of the confrontation as a marketing campaign. Figures and the analyst-role detail are cited to the outlets that carry them, the takeaways are folded into one, and the arrested suspect is no longer named."
