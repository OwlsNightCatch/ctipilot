  - claim_id: f3798ac5fe
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "record 2026-09-30T07:19:28Z"
    kind: record-summary
    text: "A sentence contrasted Cisco's product scope with the MITRE CVE record's title, cited to the CVE Services API, which is not a citable source. It now makes the scoping point from Cisco's own advisory, and the sourcing note drops the rating narration. The detection guidance now points at the default Layer 3 VRF that Cisco names, the discovery is described as a TAC support case without calling it internal, and an uncited paragraph on two unrelated Cisco advisories is removed. The takeaway now asks for the patch or the iACL workaround ahead of the maintenance window and drops two claims no source makes, that exploitation compromises the fabric itself and that the ports have no legitimate use."
  - claim_id: b336cb612a
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "summary"
    kind: frontmatter
    text: "HPE's 2026-09-01 Aruba Networking bulletins fix 52 CVEs in Networking Fabric Composer (AFC), two of them unauthenticated CVSS 10.0 flaws reaching full administrative or OS-level compromise, and 34 in AOS-CX switch firmware, led by a CVSS 9.8 unauthenticated buffer-overflow RCE. HPE reports no public discussion or exploit code for either bulletin as of release."
