    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch the ten Silicon One product IDs, or apply the iACL workaround, ahead of the normal maintenance window."
