    text: "The summary still said no exploitation was known after the 2026-07-21 update recorded NCSC-CH's active-exploitation flag, and the takeaway said no hunt discriminator existed, misdated the hosted fix and called security bulletin KB3137947 a hotfix. The takeaway now leads with the /assessment_thanks.do sink the observed payloads hit, marks the gs.include() route as Searchlight Cyber's proof of concept, and notes the Guarded Script changes that ship with the patches. ServiceNow's statement that it is not aware of exploitation is set against the exploitation reports. The 2026-07-21 section no longer calls NCSC-CH's first advisory a revision or the exploitation confirmed, dates Defused's first attempts to 2026-07-17, and describes Searchlight's sandbox escape through gs.include() rather than eval. An uncited exposure clause is removed."
  - claim_id: ec017dd589
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "summary"
    kind: frontmatter
    text: "JetBrains disclosed CVE-2026-63077 on 2026-07-27: an attacker with nothing more than HTTP(S) access to a TeamCity On-Premises server can exploit the agent-polling protocol to bypass authentication checks and execute arbitrary operating-system commands as the TeamCity server process. Every On-Premises version is affected; fixes are 2025.11.7 and 2026.1.3, with a security-patch plugin available down to 2017.1 for estates that cannot upgrade immediately, and JetBrains says TeamCity Cloud needs no customer action because it is already mitigated. CISA listed the flaw as exploited on 2026-08-05, JetBrains reported active and attempted exploitation of unpatched servers on 2026-08-07, CISA's KEV catalog now marks known ransomware campaign use, and JetBrains' own Cadence service was breached through it. A build server compromise is a supply-chain compromise."
  - claim_id: 9b7ccea9d4
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade TeamCity On-Premises to 2025.11.7 or 2026.1.3 on the matching branch, or install JetBrains' security-patch plugin where the version is older than that but at least 2017.1, and while the upgrade is scheduled, take the server's agent-polling endpoint off any internet-reachable interface, because the flaw needs nothing but HTTP(S) reachability."
  - claim_id: 89cc79bb12
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Treat any TeamCity On-Premises server that was internet-reachable and unpatched before 2026-08-05 as a compromise-assessment target rather than a completed patch: review build-agent registrations for agents you did not enrol, and rotate the VCS credentials, artifact-repository tokens and signing keys the server holds, because an upgrade evicts the entry point but not what was taken through it."
  - claim_id: e93c1bd098
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "cves[CVE-2026-63077]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-63077\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"All TeamCity On-Premises versions prior to the branch fixes; TeamCity Cloud already mitigated by JetBrains.\", \"fixed\": \"2025.11.7 and 2026.1.3, with JetBrains' security-patch plugin as the mitigation path for installations from 2017.1 onward that cannot take the full upgrade.\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 1af9c71399
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' advisory is short on mechanism by design and unambiguous on reach: an unauthenticated attacker with HTTP(S) access to a TeamCity On-Premises server can bypass authentication checks and run arbitrary operating-system commands with the privileges of the TeamCity server process, and every On-Premises version ever shipped is affected ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 760abce027
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' own framing is that exploitation of the flaw requires no authentication and that the attacker bypasses authentication checks by way of that protocol, so there is no credential, session, or user interaction standing between a network-reachable server and command execution ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: ec5674c05d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "The flaw was reported privately on 2026-07-10 by Antoni Tremblay, and JetBrains stated at publication that it was not aware of any active exploitation ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 20397a15a2
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "); on 2026-08-07 it reported \"active exploitation, as well as attempted exploitation, targeting unpatched TeamCity servers\" ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: 72c9b8e391
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "CISA's catalog classifies it as CWE-502, deserialization of untrusted data, reachable through the agent polling protocol ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: efa591ffaf
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "TeamCity Cloud is already mitigated and needs no customer action ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: c7a209d351
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Detection:** JetBrains' own indicators are server-log occurrences of `com.thoughtworks.xstream.converters.ConversionException`, which \"may indicate an attempted or successful exploit\", and unexpected entries in the list of unauthorized build agents; the date shown for such an agent is not the attempt time, so the log timestamps are what date an attempt ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: cdaffecf83
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Triage:** on a server that already runs a fixed version or the security-patch plugin, `com.thoughtworks.xstream.security.ForbiddenClassException` in the log marks an exploitation attempt that was blocked, not a compromise ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: e8bd9a4580
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reachable surface is the agent-polling protocol, the channel distributed build agents use to check in with the central server for job assignments and configuration."
  - claim_id: 4b6053be90
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reason this warrants moving ahead of the ordinary patch queue is what a build server is, not the score."
  - claim_id: 837aafb6ce
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "A TeamCity server holds the credentials its pipelines deploy with, the signing material its artifacts are stamped with, and write access to the outputs every downstream consumer trusts, so command execution as the server process converts into a durable ability to alter what future builds produce."
  - claim_id: ef7a421728
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "At disclosure no public exploitation had been observed, and that clock ran out within nine days (see the updates below)."
  - claim_id: 47dd924f65
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "JetBrains withheld the gadget chain, but \"all versions affected\" plus \"no authentication\" plus a widely deployed, easily fingerprinted product is a combination that historically closes quickly once someone reconstructs the path."
  - claim_id: 6762ec8794
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** every TeamCity On-Premises server that an attacker can reach over HTTP(S) and that runs neither 2025.11.7, 2026.1.3 nor the security-patch plugin for 2017.1 and later is affected."
  - claim_id: 45fbba6da6
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Beyond those, the observable is in the web-server or reverse-proxy access log in front of TeamCity and in process-creation telemetry on the server host."
  - claim_id: 1b5e869038
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Requests to the agent-polling endpoint arriving from addresses that are not your registered build agents are the first signal, and the second, the one that matters if the first was missed, is any child process spawned by the TeamCity server process that is not part of a build it was asked to run: shells, interpreters, or network utilities parented to the server rather than to an agent's build step."
  - claim_id: e2ba4f7951
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The agent-polling endpoint legitimately receives continuous check-in traffic from your build fleet, so request volume to it discriminates nothing on its own."
  - claim_id: a6303c8e0d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The source address set is finite and knowable: your registered agents are an inventory, so polling traffic from anything outside it is the anomaly."
  - claim_id: 57c8a756ed
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "And on the server host, legitimate command execution belongs to agent processes running build steps; the server process itself spawning an interpreter or a network utility is not a quieter version of normal activity but a different thing entirely."
  - claim_id: b31cda4d7d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Hardening: apply 2025.11.7 or 2026.1.3, or the security-patch plugin on 2017.1 and later, and treat the agent-polling interface as an internal service."
  - claim_id: 2c1fc1a453
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "If the only reason it faces the internet is that some agents live outside the network, a VPN or reverse tunnel for those agents removes the exposure that makes this flaw reachable at all."
  - claim_id: 47266b4da0
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "CISA's Known Exploited Vulnerabilities catalog now marks CVE-2026-63077 as used in ransomware campaigns ("
