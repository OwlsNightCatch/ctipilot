    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every HPE Networking Fabric Composer instance to 7.4.0 (or 7.3.4 on the 7.3 branch) now; until patched, remove the AFC API and web management interface from general-purpose networks onto a dedicated out-of-band management segment and restrict SSH access to the AFC host by source address, because CVE-2026-76658 needs no authentication."
