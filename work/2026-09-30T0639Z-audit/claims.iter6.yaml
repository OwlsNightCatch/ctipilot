    text: "**Patch Check Point IKEv1 VPN gateways now (CVE-2026-50751)**: apply hotfix sk185033, disable deprecated IKEv1 remote-access support or enforce machine-certificate authentication, and run a forensic lookback from 7 May 2026 for VPN sessions established without a matching MFA event."
