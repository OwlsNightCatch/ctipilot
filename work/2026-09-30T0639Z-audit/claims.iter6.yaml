  - claim_id: 751ac7b154
    entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Security Research documents Azure resource-destruction activity by JADEPUFFER (tracked by Microsoft as Storm-3168), the actor Sysdig disclosed in July 2026 as the first documented agentic-ransomware operation. Two compromised service principals from one tenant enumerated resources for over 15 hours before a roughly seven-minute destructive burst attempted 100+ storage-account deletions (most succeeded, some blocked by resource locks), deleted a Key Vault, a Function App and an App Service plan, and attempted to delete Azure Site Recovery and Backup protection locks before harvesting storage-account keys. Timing evidence points to automated, scripted execution. Microsoft says it is unclear how the service principal was compromised. As possible initial access it notes a service-principal secret an employee posted in plaintext in a public GitHub issue, which stayed retrievable through the issue's edit history after redaction, but it could not confirm that secret was used."
