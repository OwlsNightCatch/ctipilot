    text: "**Triage:** BeaverTail/InvisibleFerret/OtterCookie-family execution shows up as a `node` or `python` process spawned from an IDE or terminal session shortly after a new project folder is opened or an `npm install` completes, followed by outbound connections to non-corporate destinations and API calls against browser credential stores or the clipboard — legitimate build tooling does not read browser credential stores or poll the clipboard."
