  - claim_id: 18fcb1eadb
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's cisco-sa-n9k-s1-rce-EH8dEtr (2026-09-02) fixes CVE-2026-20212 (CVSS 9.8), a flaw reachable because TCP ports 43210/43211 used by the Silicon One Hardware Abstraction Layer (S1HAL) process are exposed in the default Layer 3 VRF on ten named Nexus 9000 product IDs. An unauthenticated network attacker who reaches either port can execute code as root or crash the device. Found during a Cisco TAC support case; no known exploitation."
  - claim_id: 526e10395d
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "TCP ports 43210 and 43211, used by the S1HAL (Silicon One Hardware Abstraction Layer) process, are reachable in the default Layer 3 VRF; an unauthenticated remote attacker who can reach either port sends crafted input that executes as root, or crashes the S1HAL process and forces the device to reload ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 20eaa0f577
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco names ten specific product IDs, determinable via `show module`, and the advisory's own \"Products Confirmed Not Vulnerable\" section explicitly excludes the Nexus 3000 Series and every other Nexus 9000 model, so inventory should key on the ten Silicon One product IDs rather than on the Nexus 9000 family name, as Cisco's own advisory title \"Cisco Nexus 9000 Series Switches Silicon One Remote Code Execution Vulnerability\" might suggest ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: f9303bbe7c
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco found the flaw while resolving a Technical Assistance Center (TAC) support case and states it is not aware of any public announcement or malicious use ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: b90132b332
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco also offers a temporary NX-OS Live Protect shield for this CVE and treats every workaround as a bridge to the fixed release, not a substitute ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: fb42cea5af
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco's workaround denies all such traffic, so connections from outside the device warrant a look ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 4162fdeeb6
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "An exploit gives root on the switch itself ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 01a42eb15b
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Cisco published cisco-sa-n9k-s1-rce-EH8dEtr on 2026-09-02, disclosing CVE-2026-20212 (CVSS 9.8, CWE-1327 Binding to an Unrestricted IP Address) in the Silicon One ASIC integration on Nexus 9000 Series switches."
  - claim_id: eb5b36aba5
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
