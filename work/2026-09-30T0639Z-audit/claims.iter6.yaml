    kind: record-summary
    text: "The summary still said no exploitation was reported, and the main text that Apple reported none, after NCSC-NL confirmed active abuse on 2026-08-12 and CISA listed the flaw on 2026-08-18. The main analysis also called it a straightforward patch item with no artifact to look for. It now gives the daemon's root context, the disagreement between Huntress and Calif over which flaw fG!'s proof-of-concept exploited, and Huntress's authentication-type and session-user discriminator, and it drops an unsourced mDNS claim and an unsourced link between the confirmed cases and that discriminator. The 2026-08-11 claim that such a session has no benign explanation is narrowed to Huntress's wording. NCSC-NL reports a planted miner and has not said whether the attacks went further, so the 2026-08-16 text no longer rules out data theft or ransomware."
