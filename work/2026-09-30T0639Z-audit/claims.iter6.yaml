    text: "HR and recruiting workflows, including at cantonal or federal IT departments and their contracted suppliers that source developer talent through crowdsourcing or freelance platforms, should never let a candidate run unreviewed take-home-assignment code with credentials or production access, should sandbox or review any coding-assignment repository before execution, and should verify a remote contractor's identity documents against known facilitator/laptop-farm patterns before onboarding."
  - claim_id: 62e0746c6b
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "For developers and their endpoints, the advisory's controls are to open unknown VS Code projects only in Restricted Mode, by answering \"No\" to the prompt asking whether to trust the authors of the files in the folder, which stops `.vscode/tasks.json` from running on launch."
  - claim_id: 3d970e315b
