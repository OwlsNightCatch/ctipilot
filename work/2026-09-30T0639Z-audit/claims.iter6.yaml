    text: "The earlier text described CVE-2026-5787 and CVE-2026-6973 as an exploited pre-authentication chain, marked all five May EPMM CVEs as exploited and KEV-listed, and named the European Commission, the Dutch data protection authority, the Dutch judiciary council and Finland's Valtori as victims of this wave. Ivanti reports limited exploitation of CVE-2026-6973 only, which needs an admin login, and no exploitation of the other four. Only CVE-2026-6973 is in KEV, and no source ties those organisations to the May wave. The corrected text also covers the January credential-reuse path CERT-FR and BSI describe and the Apple Device Enrollment condition that limits CVE-2026-7821. The May fixed builds fall within Ivanti's later critical EPMM update of 2026-06-09."
