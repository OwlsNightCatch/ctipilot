    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "The Fabric Composer bulletin lists 52 CVEs, two of them CVSS 10.0: CVE-2026-76658 is a flaw in AFC's SSH daemon that \"could allow an unauthenticated remote attacker to gain administrative access to vulnerable AFC hosts\" and run arbitrary commands as a privileged user, \"leading to complete system compromise\" ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
