    kind: cited
    text: "Some targets were not discovered by the agents at all: the operator handed at least two victims, a New Zealand retailer and a US photo printing company, to Hermes already holding a working administrator password, with the order to \"get to work\" ("
    urls: ["https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company"]
