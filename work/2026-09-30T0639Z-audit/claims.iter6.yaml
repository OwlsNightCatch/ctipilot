    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every Mac to macOS 26.6.1 / 15.7.9 / 14.8.9 and turn Screen Sharing off wherever it is not actively needed; close port 5900 at the network edge and confirm no host still answers Screen Sharing from the internet. Re-check hosted or leased bare-metal Macs after provisioning, which Huntress reports being built from vulnerable images."
