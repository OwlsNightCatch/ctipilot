    text: "); found by Yuqi Qiu and Xiang Li of Nankai University's AOSP Lab) sits in the DNSSEC validator: a DNSKEY record whose owner name carries a compression pointer that references back into its own RDATA can overflow the digest buffer during DNSKEY digesting, and NLnet Labs states \"remote code execution is possible through attacker controlled data\", triggered simply by having a vulnerable Unbound query a zone the attacker controls ("
    urls: ["https://nlnetlabs.nl/downloads/unbound/CVE-2026-81642.txt"]
  - claim_id: 556e032650
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-82717 (found by Ben Morris of Anthropic) is a companion bug in CNAME synthesis: when Unbound rewrites a maximum-TTL value into the packet buffer during upstream-response processing, a compression pointer that now references the overwritten, invalidated domain name sends the code down an error path that fails to advance the buffer position correctly, producing a heap overflow NLnet Labs describes as \"heavily reliant on heap memory layout\" and capable of remote code execution \"under specific systems and compilation options\" ("
    urls: ["https://nlnetlabs.nl/downloads/unbound/CVE-2026-82717.txt"]
  - claim_id: 09cc8e5cfc
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the prerequisite for CVE-2026-81642 is not exposure to attacker-initiated connections but DNSSEC validation plus the ability to recurse into an attacker-registered domain, a condition most validating recursive resolvers meet by design, since resolving arbitrary domains on request is their job."
  - claim_id: 520ccf2a78
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "body"
    kind: derived
    text: "**Triage:** ordinary DNSSEC validation failures (a misconfigured zone, an expired signature) produce a `SERVFAIL` response and a logged validation error, not a resolver crash; a `named`/`unbound` worker process terminating or restarting during or immediately after resolving a specific external zone is the discriminator that separates this from routine DNSSEC validation noise."
  - claim_id: 254776283a
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "section 2026-09-30T07:19:40Z"
    kind: cited
    text: "The CVSS 4.0 score of 9.1 for CVE-2026-81642 is NCSC Switzerland's figure ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/12957"]
  - claim_id: 33a8b8b8e6
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "section 2026-09-30T07:19:40Z"
    kind: uncited
    text: "NLnet Labs' advisory texts print no CVSS score or severity for either flaw."
  - claim_id: 7f83ceb3db
    entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
    surface: "record 2026-09-30T07:19:40Z"
    kind: record-summary
    text: "The CVSS 4.0 score of 8.4 for CVE-2026-82717 was cited to the NVD API, which is not a citable source, and NLnet Labs' advisory texts print no score or severity. The 8.4 is removed from the scores and the title, the High rating is dropped because only NLnet Labs' advisory listing page carries it, and the 9.1 for CVE-2026-81642 now cites NCSC Switzerland's advisory, which publishes it."
  - claim_id: a6b79f4cc5
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "summary"
    kind: frontmatter
    text: "Japan's NPA and NCO, the US FBI and DoD Cyber Crime Center, Australia's ASD/ACSC and Germany's BND and BfV jointly published a Cybersecurity Advisory on 2026-09-18 on the DPRK \"WaterPlum\" cyber-actor group, the long-running campaign publicly known as \"Contagious Interview\": 30,000+ infected devices across 100+ countries, funds or credentials exfiltrated from 7,000+ cryptocurrency wallets, and roughly USD 10.7 million transferred to DPRK. The advisory names five malware families delivered via fake technical-interview coding assignments and reports Japan's first dismantled DPRK \"laptop farm.\""
  - claim_id: 3a37d45d4b
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory puts figures on the campaign: at least 30,000 infected devices across more than 100 countries, funds or credentials exfiltrated from over 7,000 cryptocurrency wallets, and roughly 1.7 billion Japanese yen (about USD 10.7 million) moved to DPRK ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: f62c36ced9
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "Those files carry one of five malware families the advisory names: **BeaverTail** (a JavaScript loader hidden in NPM packages hosted on GitHub or Bitbucket), **InvisibleFerret** (a Python backdoor), **OtterCookie** (a JavaScript RAT and infostealer), **OtterCandy** (combining OtterCookie and RATatouille features), and **StoatWaffle** — a modular Node.js loader, credential harvester and RAT that hides inside blockchain-themed decoy VS Code project repositories and auto-executes through a malicious VS Code configuration file the moment the victim opens and trusts the folder ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: dfe0118ffa
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory ties the malware-delivery operation to North Korea's remote-IT-worker placement scheme: \"the NPA and the FBI assess both WaterPlum cyber actors and some North Korean IT workers operate under the 313 General Bureau of the Munitions Industry Department subordinate to the Central Committee of the Workers Party of Korea\" ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: ade16de627
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "It adds that some WaterPlum actors also operate as North Korean IT workers, and that both used the same IP addresses when accessing laptop farms, using crowdsourcing services and applying for positions at a Japanese cryptocurrency exchange ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: cb87aac6bc
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory's interview flags for suspected North Korean IT workers are refusals or excuses regarding in-person meetings, requests to receive payment in cryptocurrency, frequent glances at another monitor as if reading from the screen, occasional background voices, and repeated video or audio freezes ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: 826f37fc9b
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "section 2026-09-30T07:02:21Z"
    kind: cited
    text: "Its interview flags for suspected North Korean IT workers are refusals or excuses regarding in-person meetings, requests for cryptocurrency payment, glances at another monitor, background voices, and repeated video or audio freezes ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: 18e386344d
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "section 2026-09-30T07:02:21Z"
    kind: uncited
    text: "The advisory does not name the IT-worker scheme by any vendor alias, and it does not claim to be the first to quantify the campaign or to name its five malware families together."
  - claim_id: 89ca9d71b0
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "section 2026-09-30T07:02:21Z"
    kind: uncited
    text: "Its only first is Japan's dismantled laptop farm."
  - claim_id: c8374ef766
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "record 2026-09-30T07:02:21Z"
    kind: record-summary
    text: "Two phrases narrated the pipeline's own tracking of the actors. They now name the public aliases only. The priority moves from high to notable because the advisory documents an established campaign with no new decision due for the constituency this week. The text also equated the advisory's North Korean IT workers with vendor aliases the advisory never uses, claimed the advisory was the first to quantify the campaign and to name the five families together, and listed interview flags the advisory does not give. The title, summary and main text now follow the advisory's own wording, including its five interview flags and its statement that some WaterPlum actors also work as IT workers."
