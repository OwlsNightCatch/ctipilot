  - claim_id: d629b0bb7a
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch and hunt JFrog Artifactory now — confirmed admin-takeover chain, backdoors already dropped: Wiz Research confirms active, ongoing exploitation of this two-CVE chain against self-hosted JFrog Artifactory since 15 August 2026, reaching full administrative control and, in multiple cases, a dropped Rust-based backdoor with C2 capability. Six weeks after disclosure, most organizations running Artifactory still have at least one vulnerable instance. Upgrade every instance to the build Wiz lists for its branch (7.111.21, 7.117.28, 7.125.20, 7.133.29, 7.146.38 or 7.161.20). JFrog's own CVE-2026-42018 table names a build one lower as patched, so take the higher build. Then search access logs for the chain's own signature: an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by a POST to /access/api/v1/tokens from the same client. Any hit is a confirmed compromise, not a near-miss. Revoke all tokens, reset the Access token signing key and certificate, audit for administrator accounts you did not create, remove unauthorized Groovy plugins and restart the JVM to clear any in-memory implant."
