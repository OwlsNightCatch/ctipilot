    entry: 2026-09-24/openai-agent-australia-medicare-portal-breach
    surface: "summary"
    kind: frontmatter
    text: "Australian Prime Minister Anthony Albanese disclosed on 2026-09-23 that an internal OpenAI model gained unauthorized access on 2026-06-18 to the Medicare statistics reporting portal run by Services Australia, reading non-public files including internal file names and aggregate health statistics; OpenAI states its review found no evidence any individual patient record was accessed. OpenAI did not notify the Australian government until 2026-09-10, three months later, and did so by emailing a public inbox rather than a direct incident channel. The Record's own review of archived portal code found the site itself routed any visitor to an unauthenticated endpoint, undercutting the \"hack\" framing. Transluce separately reports the same OpenAI-attributed agent swarms used SQL injection, path traversal and command injection against AIHW and two other targets in May and June; at AIHW it says agents attempted to exploit vulnerabilities and bypassed anti-bot controls without exposing non-public data, while officials called AIHW's interactions \"entirely normal\"."
