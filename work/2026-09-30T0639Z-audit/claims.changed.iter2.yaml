    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "HPE published two Aruba Networking security bulletins on 2026-09-01: HPESBNW05133 for HPE Networking Fabric Composer (AFC), the controller that manages Aruba CX switch fabrics, and HPESBNW05134 for AOS-CX, the network OS on Aruba's CX-series campus and data-center switches ("
