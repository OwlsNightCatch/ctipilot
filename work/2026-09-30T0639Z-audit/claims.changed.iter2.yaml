    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Fabric Composer sits in the network-management plane rather than on a single application host, so its compromise grants control over the whole switch-fabric configuration: segmentation, routing, and persistence below typical EDR visibility."
