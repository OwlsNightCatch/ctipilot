  - claim_id: 0d1f4df940
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "summary"
    kind: frontmatter
    text: "On 2026-05-18 all 53 version tags of the actions-cool/issues-helper GitHub Action, and all 15 of actions-cool/maintain-one-comment, were moved to imposter commits whose payload reads the Runner.Worker process memory for decrypted workflow secrets and sends them over HTTPS to an attacker-controlled domain (StepSecurity). Socket links the exfiltration domain to the Mini Shai-Hulud npm campaign; only workflows pinned to a full commit SHA were unaffected."
  - claim_id: 6446ff9086
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "StepSecurity disclosed on 2026-05-18 that every existing tag of the `actions-cool/issues-helper` GitHub Action, 53 in total, had been moved to its own imposter commit that is not reachable from the action's default branch, and that all 15 tags of the companion `actions-cool/maintain-one-comment` action were moved the same way ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 47b3302675
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "The payload downloads the Bun JavaScript runtime to the runner, then a `python3` child process reads the memory of the Runner.Worker process, which holds the workflow's decrypted secrets, filters the captured bytes for values flagged as secret and sends them over HTTPS to an attacker-controlled domain ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 437a3f9f0b
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "The 53 imposter commits carry fake \"Build action for vX.Y.Z\" messages in the maintainer's style and were all created within 3 minutes 16 seconds on 2026-05-18 ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 3655ed10e7
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "Socket's head of threat intelligence told The Hacker News that the @antv npm compromise in the Mini Shai-Hulud campaign is likely linked to the actions-cool hack because the two share an exfiltration domain, and that \"the overlap is strong enough that we're treating them as related\"; GitHub has since disabled access to the maintain-one-comment repository for a terms-of-service violation ("
    urls: ["https://thehackernews.com/2026/05/github-actions-supply-chain-attack.html"]
  - claim_id: aa085306e4
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "**Exposure:** any workflow that referenced either action by a version tag pulled the malicious code on its next run after the tags moved; \"Only workflows pinned to a known-good full commit SHA are unaffected\" ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 4eb2ea181b
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "**Detection:** on the runner, the Bun runtime appearing under `/home/runner/.bun/bin/bun`, a `python3` child process reading `/proc/<Runner.Worker PID>/mem`, `gh auth token` and `sudo python3` executions, `tr` and `grep` pipelines filtering for secret-flagged values, and an outbound HTTPS connection to a domain outside the workflow's normal destinations ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 8fcdc2ac4d
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "In workflow definitions, an action reference that resolves to a commit matching no legitimate tag or branch head of the action's repository is the signature of this attack ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 8d45bc1f80
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "Allow-listing runner egress, as StepSecurity's Harden-Runner does, keeps harvested credentials from leaving the runner even when a compromised action executes ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
  - claim_id: 8c4a8ae229
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat any workflow run that used either action by tag on or after 2026-05-18 as a secrets exposure: rotate every secret the workflow could read, including its GitHub token, and pin third-party actions to full commit SHAs."
