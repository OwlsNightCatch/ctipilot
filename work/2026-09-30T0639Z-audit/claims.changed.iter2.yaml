    text: "TRM Labs, an independent blockchain-forensics firm, reports that on-chain tracing shows the wallets laundering Bitget's stolen funds overlap with wallets previously used to launder proceeds from the 2025 Bybit and AFX Bridge hacks, both attributed to the DPRK-linked TraderTraitor cluster (also known as UNC4899/PUKCHONG): \"these onchain links confirm the group laundering these proceeds is the same one used by TraderTraitor in other recent hacks\" ("
