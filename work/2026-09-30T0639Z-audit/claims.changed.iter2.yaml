    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Exploitation requires only an existing, currently-suspended in-house-billing account on the target — server state that exists on any install using that billing mode by design — and no separate enumeration step is needed because the same request path is a non-destructive timing oracle: injecting a `sleep` payload via the `uid` field hangs the response only for a valid, eligible uid."
  - claim_id: 198d23b2d7
    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The bug additionally needs MySQL's default non-strict `sql_mode`, which VulnCheck confirmed is what Virtualizor's own bundled MySQL 5.5.62 stack ships uncorrected — this is a default-production condition, not a lab artifact."
  - claim_id: 6d5bd0321e
    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The root-level impact is possible because Virtualizor's EMPS stack splits PHP execution across separate php-fpm pools by port: the admin-panel `index.php` on ports 4084/4085 runs in a pool that executes as root, while the client panel and every other `.php` file run in an unprivileged pool — the exploit therefore never drops a PHP web shell (which would run unprivileged) and instead relays each command's output to a randomly named static file written into the webroot and served directly over plain HTTP."
  - claim_id: 6c5d79a08f
    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-43642 (CWE-502 PHP object injection) reaches the same unauthenticated handler's native `unserialize()` call on attacker-controlled POST data with no `allowed_classes` restriction; no working exploitation gadget chain exists in the stock code today, but the primitive is live for any add-on or plugin that introduces a class with a `__wakeup` or `__destruct` method."
  - claim_id: 14829f9130
    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-43643 (CWE-639 authorization bypass through a user-controlled key) lets an unauthenticated caller zero out or inflate any tenant's account balance through the same handler's `whmcs` branch, via a parameterized but unauthenticated balance UPDATE with no ownership check."
  - claim_id: 2d5d29bff9
    entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
    surface: "body"
    kind: uncited
