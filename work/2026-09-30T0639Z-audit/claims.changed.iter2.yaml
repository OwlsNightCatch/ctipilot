  - claim_id: 92b972d244
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "headline"
    kind: frontmatter
    text: "AI coding agents' plugin SHA-pinning is bypassable, mainly via non-GitHub marketplaces; Copilot and Gemini CLI unfixed"
  - claim_id: 2f81aa8083
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "summary"
    kind: frontmatter
    text: "AIR Security disclosed Plugin4Shell (2026-09-17): a design flaw present in Claude Code, OpenAI Codex, GitHub Copilot and Gemini CLI, none of which verifies after checkout that a plugin's working tree matches its marketplace-pinned commit hash, so a repository owner can swap malicious code into an installed, trusted plugin on its next update. The branch-name trick needs a git host that accepts hash-shaped branch names, such as Bitbucket or a self-hosted server, and auto-update is on by default only for the agents' built-in GitHub-hosted marketplaces; Gemini CLI's variant is not clearly blocked on GitHub. OpenAI's own fix shipped in Codex 0.146.0, AIR says Claude Code 2.1.179 is fixed, Microsoft has shipped no Copilot fix and Google is retiring Gemini CLI instead of fixing it."
  - claim_id: df0aef62cd
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade Codex to ≥0.146.0 (OpenAI's own fix) and Claude Code to ≥2.1.179 (fixed according to AIR; Anthropic's release notes do not mention it). GitHub Copilot and consumer Gemini CLI have no fix; on those two, manually verify `git rev-parse HEAD` against a plugin's marketplace-pinned SHA before trusting any auto-update, and restrict Copilot plugin installs to the built-in GitHub-hosted marketplace until Microsoft ships a fix."
  - claim_id: 41727b432b
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "body"
    kind: cited
    text: "All four implement plugin-marketplace SHA-pinning, locking each install to a reviewed 40-hex commit hash, but none verifies after checkout that the resolved working tree actually matches that hash ("
    urls: ["https://www.air.security/blog-posts/plugin4shell"]
  - claim_id: 0d24af963d
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "body"
    kind: cited
    text: "An attacker who controls or takes over a trusted plugin's upstream repository creates a branch named identically to the pinned SHA and sets it as the repository's default branch; Claude Code, Codex and Copilot run a plain `git clone` followed by a checkout of the pinned commit, and because git resolves an ambiguous ref-versus-object-id in favor of the ref, the checkout silently resolves to the attacker's branch while the agent reports the pinned commit installed ("
    urls: ["https://www.air.security/blog-posts/plugin4shell"]
  - claim_id: cba5c9a957
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "body"
    kind: cited
    text: "Gemini CLI has a distinct but equally exploitable variant: it fetches the pinned commit into `FETCH_HEAD` then checks that out, which an attacker defeats by naming their malicious default branch literally \"FETCH_HEAD\" ("
    urls: ["https://www.air.security/blog-posts/plugin4shell"]
  - claim_id: 1438a40e39
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
    surface: "body"
    kind: cited
    text: "Because background plugin auto-update is the default in Claude Code and Codex, an already-installed, already-reviewed plugin is silently swapped on the next update with no install step and no prompt: full zero-click compromise of the agent and \"full access to every asset and every piece of data the agent can reach\" ("
    urls: ["https://www.air.security/blog-posts/plugin4shell"]
  - claim_id: 524455c75b
    entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
