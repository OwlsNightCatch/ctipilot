    surface: "body"
    kind: cited
    text: "**Detection:** the investigators describe appliance-side activity visible before any funds moved: scripts run under a security appliance's own service process, a read of the environment variable holding a database password followed by a database connection from that node, management-platform activity under an employee identity that places system commands in task parameters or submits code through a web execution endpoint, a new outbound command-and-control connection from an appliance, and sessions from an appliance to production servers ("
