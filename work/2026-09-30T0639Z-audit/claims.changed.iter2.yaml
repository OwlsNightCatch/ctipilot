  - claim_id: 5fa80143e6
    entry: 2026-09-29/bitget-hot-wallet-theft-north-korea-nexus
    surface: "record 2026-09-30T06:56:10Z"
    kind: record-summary
    text: "Mandiant's and SlowMist's investigation reports, released by Bitget on 2026-09-30, trace the intrusion through two compromised third-party security appliances: a zero-day in a service on one appliance with activity from 2026-08-31, a web shell and command-and-control on the other, then lateral movement to the production wallet job server and a custom withdrawal tool that forged risk-control parameters. Priority moves from high to notable: the appliance path is a transferable technique worth a hunt, but the vendors are unnamed and there is no product-specific decision for the constituency."
