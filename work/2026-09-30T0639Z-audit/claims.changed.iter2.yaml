    entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
    surface: "summary"
    kind: frontmatter
    text: "Kiteworks, a secure managed-file-transfer platform rebranded from Accellion and marketed to government agencies and financial institutions, told customers worldwide on 2026-09-25 to shut down every Kiteworks system for a weekend window after \"credible threat intelligence from law enforcement\" of a possible imminent attack. It lifted the advice on 2026-09-27 with no indication of compromise, telling customers with self-hosted Advanced Forms to contact Customer Support, and said on 2026-09-28 that work during the shutdown found and fixed a previously unknown critical vulnerability in a capability enabled for under 1% of customers, with no sign of exploitation. BSI names Kiteworks Advanced Forms below 9.5.1 as affected; no CVE is known."
