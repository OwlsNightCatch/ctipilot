    kind: frontmatter
    text: "VulnCheck reported on 2026-07-28 that it has observed attackers gaining initial access to Langflow through CVE-2026-0769, harvesting credentials, deploying cryptominers and attempting lateral movement, and that the flaw is not in CISA's Known Exploited Vulnerabilities catalog. CVE-2026-0769 is a Zero Day Initiative 0-day advisory: an eval injection in Langflow's eval_custom_component_code function reachable with no authentication (CVSS 9.8), for which ZDI documents no fixed version and names restricting interaction with the product as the only mitigation. A KEV-driven patch process will not surface this, and the near-identical CVE-2026-0770 that IS KEV-listed is a different vulnerability."
