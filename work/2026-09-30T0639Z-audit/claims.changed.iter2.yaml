    text: "GTIG analyses UNC6671 \"BlackFile\" vishing-driven AiTM extortion: real-time helpdesk impersonation → attacker-registered lookalike SSO portals → live MFA code capture and rogue MFA device registration → programmatic SharePoint exfiltration (1M+ files from one victim) via Python requests spoofing the Microsoft Office ClientAppId; DLS shutdown signals possible rebrand (Google Threat Intelligence Group, 2026-05-15)."
