  - claim_id: e82e9d6bb9
    entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
    surface: "summary"
    kind: frontmatter
    text: "The extortion group ShinyHunters claims it exploited a new, undisclosed Oracle PeopleSoft zero-day on the night of 2026-09-21 to compromise the FBI's recruitment site (apply.fbijobs.gov), then pivoted into FBI-managed AWS GovCloud infrastructure and stole employee and applicant data. The group later told BleepingComputer it used the URL-encoded WAF bypass for the known PeopleSoft flaw CVE-2026-35273 against FBI Jobs, while still claiming a further unknown flaw. The FBI says it is investigating the incident, its root cause and the alleged impact to employee PII, but has not confirmed a breach, the type or amount of data, or attribution to ShinyHunters. Journalists who reviewed actor-supplied samples report psychiatric/medical files, a roughly 5,000-entry sample of names, addresses, phone numbers and relatives' information, and data identifying counterintelligence-relevant staff, including Remote Operations Unit personnel. Dutch police separately confirmed an arrest connected to the ShinyHunters investigation, and multiple sources describe a collective called ScatteredLapsussHunters as now directing ShinyHunters' operations."
