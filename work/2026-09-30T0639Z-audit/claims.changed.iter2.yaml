    surface: "body"
    kind: cited
    text: "The Fabric Composer bulletin lists 52 CVEs, two of them CVSS 10.0: CVE-2026-76658 is a flaw in AFC's SSH daemon that \"allows unauthenticated remote attackers to gain administrative access and execute arbitrary commands, risking full system compromise\" ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339"]
