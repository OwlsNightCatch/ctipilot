  item: 2026-09-12/jfrog-artifactory (actions[0]; immediate_action)
  url_or_quote: 'actions[0]: "These builds are above 7.133.11, which closes CVE-2026-42016, and one above the builds JFrog''s CVE-2026-42018 table names as patched, so the higher build closes both halves of the chain." immediate_action: "JFrog''s own CVE-2026-42018 table names a build one lower as patched, so take the higher build."'
  summary: 'Wiz''s builds are 7.111.21, 7.117.28, 7.125.20, 7.133.29, 7.146.38, 7.161.20. Three of the six (7.111.21, 7.117.28, 7.125.20) are numerically below 7.133.11, so "These builds are above 7.133.11" is false for them. JFrog''s CVE-2026-42016 advisory (https://docs.jfrog.com/releases/docs/jfrog-security-advisories) lists Affected "< 7.133.11", Patched "7.133.11" and "Upgrade ... to a fixed version applicable to your release branch: 7.133.11", so a 7.111/7.117/7.125 instance moved to Wiz''s branch build is still inside JFrog''s affected range for CVE-2026-42016. "One above/one lower" is also wrong for 7.146.38 vs JFrog''s 7.146.8 (30 apart) and 7.161.20 (no JFrog counterpart). The pre-run text (git HEAD) said "7.133.11 for CVE-2026-42016, and the CVE-2026-42018 fix matching your branch" and warned that a build above 7.133.11 numerically can still be unpatched for the second CVE; this run''s rewrite dropped the 7.133.11 requirement and introduced the false statement. Restore: >= 7.133.11
    for CVE-2026-42016 and the branch build for CVE-2026-42018. Claims 98945dd372, d629b0bb7a.'
