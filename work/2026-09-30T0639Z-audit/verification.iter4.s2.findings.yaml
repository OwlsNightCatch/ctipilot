- code: F3
  category: claim-not-supported
  section: cve-2026-46300
  item: "2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x (## Update 2026-09-05T05:10:00Z, rewritten in part by this run)"
  url_or_quote: "\"...was itself stated as ambiguous between the \"Dirty Frag\" family and the separate, earlier \"Copy Fail\" vulnerability (CVE-2026-31431) from process logs alone ([Microsoft Security Blog, 2026-05-08](https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/))\""
  summary: "(low confidence) The Microsoft post says only that the su activity \"may be indicative of techniques associated with either 'Dirty Frag' or 'Copy Fail'\" and names CVE-2026-31431 for CopyFail; the words 'from process logs alone' are Aikido's gloss (\"since the two are hard to tell apart from process logs alone\", https://www.aikido.dev/blog/dirty-frag), not Microsoft's. Drop 'from process logs alone' or cite Aikido for it. Sentence text predates this run; the run only re-punctuated it. Not a ledger claim."
- code: F3
  category: claim-not-supported
  section: cve-2026-42016-42018
  item: "2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover (body, patching-velocity paragraph; ledger claim 2e309341ea)"
  url_or_quote: "\"The separately disclosed CVE-2026-82329 (a default-configuration join-key bypass, disclosed 28 August 2026) dropped from 67% to 49% within two weeks of its own disclosure ([Wiz Research, 2026-09-10](https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201))\""
  summary: "(low confidence) Wiz calls CVE-2026-82329 \"a critical authentication-bypass vulnerability affecting Artifactory under its default configuration\" and lists a stolen join key only as post-exploitation; it never calls the flaw a 'join-key bypass'. 'default-configuration' and the 28 August date are on the page, 'join-key bypass' is not (it comes from watchTowr in the sibling 2026-09-01 entry). Say 'authentication bypass' or cite the source that states the join-key mechanism. Sentence text predates this run."
- code: F3
  category: claim-not-supported
  section: ncsc-ch-google-recovery
  item: "2026-09-23/ncsc-ch-google-recovery-oauth-app-password-persistence (**Triage:** paragraph, Detection and hardening sentence; ledger claim 5db9d59dca)"
  url_or_quote: "\"Detection and hardening: audit and restrict app-password issuance on any Google account, and treat an app-password creation event with the same sensitivity as a new OAuth grant for incident-response purposes, since it is a durable, MFA-bypassing credential that a full password rotation does not revoke ([NCSC Switzerland, 2026-09-22](https://www.bacs.admin.ch/de/26w38-de))\""
  summary: "(low confidence) Iteration 3 asked for a citation; the one added now implies BACS says this. BACS (https://www.bacs.admin.ch/de/26w38-de, Empfehlungen) says only: change the password, sign out sessions and foreign devices, review 'App-Passwoerter' and delete all entries, check recovery addresses and forwarding rules. It does not say to restrict app-password issuance or to rank an app-password creation like an OAuth grant. The durable-credential clause is supported; the advice before it is the analyst's own. Keep the citation on the supported clause and drop it from the advice, or reword the advice to BACS's recommendation (delete all app passwords, check recovery addresses and forwarding rules)."
- code: F4
  category: hallucinated-fact
  section: nighteagle
  item: "2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync (body paragraph 1; ledger claim d91abae3a4)"
  url_or_quote: "\"Initial access used compromised VPN credentials, with connections originating from IP addresses in the Russian segment linked to Cloudflare WARP tunnels, as well as from European VPS ranges.\""
  summary: "(low confidence) Securelist (https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/) says \"In most incidents, the attackers used compromised valid credentials to gain access to corporate VPNs\"; the entry drops 'in most incidents' and states it for all intrusions. Restore the hedge. Sentence text predates this run (uncited in the sentence, cited at the paragraph end)."
- code: F11
  category: editorial-advisory
  section: aepd / push-security / gtig / conference-phishing / tradertraitor / virtualizor
  item: "'the constituency' (organisation-profile vocabulary) in reader-facing text"
  url_or_quote: "AEPD body: \"The relevance for the constituency is the policy signal:\" / Push Security body: \"home-region infrastructure the constituency's users may encounter\" / record summaries: gtig \"no targeting in the constituency's region\", conference-phishing \"without evidence of targeting the constituency\", tradertraitor \"not the constituency\", virtualizor \"outside the typical constituency estate\""
  summary: "Iteration 3 raised this for AEPD and Pentagon; the remediation log says no body of those two carries 'the constituency' any more, but the AEPD body still does (line 85). The same vocabulary is in the Push body and in four record summaries written this run. Use 'a Swiss public-sector SOC' (the wording already used in the AEPD record) or name the actual nexus. Advisory only. gtig and node-ipc record summaries also say 'source rating', which is rating-scheme vocabulary."
- code: F11
  category: editorial-advisory
  section: pentagon
  item: "2026-09-27/pentagon-dmdc-military-personnel-data-breach-unencrypted-ssn (body, relevance sentence; ledger claim 1735d89d43)"
  url_or_quote: "\"Its relevance is sectoral: a government's central personnel-data store kept identity numbers unencrypted and readable for nine months before discovery\""
  summary: "Iteration 3 flagged 'sectoral' (not one of the four grounds an out-of-nexus incident may rest on) and the remediation log says the body no longer carries it; it still does. State the actual ground, for example the transferable lesson for Swiss Armed Forces or civil-protection personnel stores, or drop the sentence. Advisory only (entry is routine, two paragraphs)."
