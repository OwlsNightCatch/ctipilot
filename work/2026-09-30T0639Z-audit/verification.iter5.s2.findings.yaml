  category: hallucinated-fact
  section: virtualizor
  item: "2026-09-23/virtualizor-billing-hook-unauth-root-rce (headline, frontmatter; predates this run)"
  url_or_quote: "headline: \"A single mis-scoped pre-auth check in a hosting control panel opens three unauthenticated paths to root\""
  summary: "VulnCheck (https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce) lists \"three unauthenticated bugs behind one mis-scoped guard: an OS command injection to root (the flagship), a PHP object injection, and a cross-tenant balance write\"; CVE-2026-43642 has \"no stock gadget\" and CVE-2026-43643 is a \"data-tampering bug\". Only CVE-2026-43641 reaches root. The entry's own summary and body say so, so the headline overstates the sources. Reword, e.g. \"opens three unauthenticated paths, one to root\". Needs a correction record naming headline."
- code: F3
  category: claim-not-supported
  section: nighteagle
  item: "2026-09-21/nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync (## Correction 2026-09-30T07:00:33Z; claim 4e0b592222)"
  url_or_quote: "\"It does not describe BlueKeep leading to the DCSync attempt or a completed credential dump.\""
  summary: "(low confidence) Securelist (https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/), Lateral movement section, closes with \"Through these methods, the attackers establish persistence in the infrastructure, obtain password hashes for domain accounts, use long-lived Kerberos tickets ... and ultimately compromise domain controllers\". That is a general outcome statement, not a described completed DCSync, but it cuts against an unqualified \"does not describe ... a completed credential dump\". The BlueKeep-to-DCSync half is right. Narrow the sentence, e.g. \"Kaspersky describes only a DCSync attempt and states in general terms that the methods yield domain-account password hashes\"."
