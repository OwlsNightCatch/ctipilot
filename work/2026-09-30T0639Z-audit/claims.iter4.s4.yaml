    and scores it 9.8 itself. Fix Packs 8.5.5.30 and 9.0.5.29 followed on 2026-07-27 and 2026-09-08. The module-disabling advice is NCSC-CH's and covers certain denial-of-service vectors only, the exploitation
    status is unknown, and an unsourced claim about Swiss banking, insurance and federal deployments is withdrawn. The priority moves from high to notable.
