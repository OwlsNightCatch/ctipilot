- claim_id: 944015a933
  entry: 2026-05-08/cve-2026-5787-cve-2026-6973-ivanti-epmm-pre-auth-certificate
  surface: summary
  kind: frontmatter
  text: Ivanti's 2026-05-07 update for on-premises Endpoint Manager Mobile fixes five flaws. Only CVE-2026-6973 (CVSS 7.2), remote code execution for an authenticated administrator, is exploited, in very
    limited attacks, and CISA listed it the same day. CERT-FR warns that attackers can reuse administrator passwords stolen in January's CVE-2026-1281/1340 wave where they were not reset. The other four,
    including CVE-2026-5787 (CVSS 8.9, unauthenticated impersonation of Sentry hosts to obtain CA-signed client certificates), are not reported exploited. Fixed in 12.6.1.1, 12.7.0.1 and 12.8.0.1, builds
    that a later critical EPMM update of 2026-06-09 also covers.
