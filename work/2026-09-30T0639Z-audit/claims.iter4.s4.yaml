- claim_id: b243f025a9
  entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
  surface: record 2026-09-30T06:44:45Z
  kind: record-summary
  text: 'The summary still said no exploitation was reported, and the main text that Apple reported none, after NCSC-NL confirmed active abuse on 2026-08-12 and CISA listed the flaw on 2026-08-18. The main
    analysis also called it a straightforward patch item with no artifact to look for. It now states the confirmed exploitation, the root context of the daemon, the disagreement between Huntress and Calif
    over which flaw fG!''s proof-of-concept exploited, and Huntress''s authentication-type and session-user discriminator for the bypass it analysed, and drops an unsourced mDNS claim. A link between the
    confirmed cases and that discriminator, which no source makes, is removed. The 2026-08-11 claim that an attach with the SRP type or a root or null user has no benign explanation is narrowed to Huntress''s
    wording, and the Sequoia and Sonoma fixes cite Apple''s own bulletins. The four accumulated action items are replaced by the current two: patch and disable or firewall Screen Sharing, then assess every
    Mac that was reachable before patching.'
