- claim_id: 1d5c25ea7d
  entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
  surface: summary
  kind: frontmatter
  text: Microsoft's Digital Crimes Unit disrupted Fox Tempest, a malware-signing service active since May 2025 that abused Microsoft Artifact Signing to obtain code-signing certificates valid for 72 hours,
    seizing its website under a case unsealed in the Southern District of New York and revoking over a thousand certificates. Microsoft links it to Vanilla Tempest (Rhysida), Storm-0501, Storm-2561 and
    Storm-0249, and through cryptocurrency analysis to affiliates delivering INC, Qilin and Akira ransomware. The signed malware posed as AnyDesk, Teams, PuTTY and Webex installers.
