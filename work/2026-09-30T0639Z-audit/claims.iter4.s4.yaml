- claim_id: 698a82494c
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: '**Detection and hunting.** In Azure Resource Manager audit-log telemetry, the signal is volume and sequencing rather than any single call: dozens to hundreds of deletion or ListKeys operations
    against storage accounts, Key Vaults and Function Apps within minutes, especially when preceded by hours of broad read-only enumeration from the same or a paired service principal, and when it includes
    attempts against Site Recovery or Backup protection locks specifically, a combination with essentially no legitimate operational counterpart.'
- claim_id: 52682e80e7
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: derived
  text: '**Triage:** legitimate infrastructure-as-code teardown and disaster-recovery testing can also delete storage accounts and Key Vaults in bulk, so the discriminators are the attempt against recovery-protection
    locks specifically (a step with no purpose in routine teardown), the credential-harvesting ListKeys sweep that follows the destructive burst rather than preceding it, and multiple overlapping OAuth
    tokens performing different destructive operations in parallel from principals with no prior operational history of this pattern.'
- claim_id: 685c1e129e
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: derived
  text: '**Defender takeaway:** treat any service-principal secret, storage key or connection string that has ever appeared in a public repository, issue, commit or gist as compromised the moment it is
    discovered, whatever its current visibility; Microsoft''s own conclusion is that an edit or redaction does not revoke the value.'
