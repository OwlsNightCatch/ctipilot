- claim_id: bd7e2c0a5f
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: record 2026-09-30T07:00:42Z
  kind: record-summary
  text: The title presented the GitHub-exposed secret as the campaign's route and the summary called it the likely initial access. Microsoft lists it only as possible initial access, says it is unclear
    how the service principal was compromised, and could not confirm the secret was used. The takeaway said resource locks and deletion protection were the only thing that stopped part of the deletions,
    while the Azure SQL deletions failed because the actor used an unsupported API version. The rotation step asked to rotate a tenant ID, which is an identifier rather than a credential. It now names secrets,
    storage keys and connection strings and adds Microsoft's advice to investigate each exposed credential's historical use. The headline said one service principal both enumerated the tenant and destroyed
    resources, and now names the two principals Microsoft reports and their separate roles.
