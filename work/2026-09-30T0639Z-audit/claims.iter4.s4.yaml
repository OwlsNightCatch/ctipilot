  entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
  surface: body
  kind: cited
  text: When an administrator enables `ENABLE_REVERSE_PROXY_AUTHENTICATION = true` to put Gitea behind an authenticating reverse proxy, the image trusts the `X-WEBAUTH-USER` header from any source IP, so
