- claim_id: 0c145f1aa2
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: 'One fully documented Cairn project illustrates the chain, though Gambit is explicit that each victim''s actual path was chosen dynamically through real-time probing and most chains differed victim
    to victim: unauthenticated SQL injection in a login email parameter (error-based EXTRACTVALUE) read a one-time-passcode value in plaintext directly from an application database table, bypassing multi-factor
    authentication and reaching the admin panel; an image-upload field with no extension check then gave host remote code execution as a non-root user; a `sudo` misconfiguration allowing NOPASSWD execution
    of `python3.12` escalated that to root; an internal NFS mount configured with `no_root_squash` let the agent read a separate host''s WordPress database credentials in plaintext from its `wp-config.php`;
    those credentials gave a direct database write creating a new WordPress administrator account, which in turn let the agent upload a malicious plugin for code execution on the blog host; from there the
    agent dumped the full contents of the account''s AWS Secrets Manager (46 secrets, 102 KB), reached the production Magento database on Amazon Aurora, extracted the Magento application''s encryption key,
    and used it to decrypt stored card numbers encrypted with Blowfish in ECB mode.'
