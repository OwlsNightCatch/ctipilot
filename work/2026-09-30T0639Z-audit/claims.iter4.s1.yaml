- claim_id: 101cf3a58b
  entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  surface: record 2026-09-30T06:56:58Z
  kind: record-summary
  text: 'The takeaway said no CVE or Oracle advisory was involved, although ShinyHunters told BleepingComputer it used the WAF bypass for CVE-2026-35273 against FBI Jobs. That link is now attributed to
    the group, the CVE is recorded with a link to the PeopleSoft campaign entry that carries the patch and hunt actions, the watch-for-an-advisory action is removed, and the priority moves from high to
    notable because the defender value lies in the already-covered CVE. The FBI''s 2026-09-23 statement had been described as confirming the compromise. It leaves the point of breach undetermined between
    a third party and the FBI''s own systems, and sources differ on whether it confirms the compromise: Krebs on Security reads it as confirmation, while BleepingComputer and CyberScoop report no confirmed
    breach, scope or attribution. The statement is added as a source, the assessed credibility reflects that disagreement, figures and the analyst-role detail are cited to the outlets that carry them, the
    two updated takeaways are folded into the main one, and the arrested suspect is no longer named.'
