  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: Compromise ranged from partial to full at a Fortune 500 hospitality company, a major US airline, a large US industrial-supplies distributor and a US online fashion retailer, which Gambit names separately
    as categories of accessed victims, not as the source of the illustrative chain above.
- claim_id: b16fff01f2
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: 'Gambit documents eight distinct skimmer-injection methods used across victims, all worth carrying into any custom-web-application hardening review: appending the loader to the end of a legitimate,
    already-served JavaScript file while restoring its original modification timestamp; inserting a foreign `<script>` tag directly into the checkout page; hiding the loader inside a site''s Google global-site-tag
    (`gtag.js`) block, between the real `gtag(''js'', ...)` and `gtag(''config'', ...)` calls, padded with roughly a hundred tab characters to push it past the right edge of a typical code-review view;
    using a discovered AWS access key to write the loader into the storage bucket behind the retailer''s own CDN, so it loads from that trusted CDN host rather than a third-party domain; injecting the loader
    into a database content field (such as a product-description column) through an admin pod and relocating it to a file on the victim''s own domain; adding it as a Kubernetes `initContainer` in a production
    front-end deployment manifest; writing it directly into a server-side page-cache entry for the checkout page, so the served HTML differs from the page''s own template; and a self-healing cron job placed
    in a JBoss log directory that checks the injected file''s size every two minutes and re-appends the loader whenever a redeploy reverts it.'
- claim_id: 909adfc013
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: This was collateral data loss from the attacker's own automated cleanup, not extortion.
- claim_id: 72781bef06
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: 'Detection concept, telemetry class first: in web-server access logs, alert on SQL-error-pattern responses (`EXTRACTVALUE` or equivalent) to login-form parameters, and on image-upload requests whose
    stored file is later executed by the web server rather than served as static content; in host telemetry, alert on `sudo` invocations of an interpreter (`python3.12` or similar) by a low-privilege account
    with no corresponding change-management record; in network/mount telemetry, flag any host mounting an NFS export it has not mounted before, particularly where the export allows root-equivalent access;
    in cloud-audit telemetry, alert on a single principal enumerating or reading the entire contents of an AWS Secrets Manager instance in a short window; and in file-integrity or CDN-origin monitoring,
    treat any modification to a served JavaScript file''s content (even with its timestamp preserved) or any script tag added to a checkout page outside a deployment window as high-priority.'
- claim_id: a39f8d294f
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: '**Triage:** a legitimate deployment modifies checkout-page assets during a known release window with a corresponding commit and change record; the discriminators here are modification with no matching
    deployment event, a modification timestamp that has been deliberately restored to match the original file, or content padded with unusual whitespace specifically to evade a manual code read.'
- claim_id: 359b17e362
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: In three of the four intrusions the operators worked around model safety controls.
- claim_id: c208cd5876
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: 'That convergence, not any single victim in this campaign, is the transferable signal for a defender: an increasingly capable, freely available agent orchestration layer is now common tooling across
    financially motivated operators and government-targeting intrusions alike, regardless of how firmly any of them is ultimately attributed, and the underlying attack chain here (SQL injection, insecure
    OTP storage, unrestricted file upload, `sudo` misconfiguration, an over-permissive NFS export, and cloud-secrets exposure) is entirely composed of defects a Tier 2/3 team already reviews for in any
    custom-coded web application, Swiss public-sector portals included.'
- claim_id: 7d999acceb
  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: derived
  text: '**Defender takeaway:** none of the individual flaws in this chain are novel; what changed is that an unattended, cheap AI agent can now find and chain them without an operator watching.'
