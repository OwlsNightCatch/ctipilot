  surface: body
  kind: cited
  text: 'The advisory puts figures on the campaign: at least 30,000 infected devices across more than 100 countries, funds or credentials exfiltrated from over 7,000 cryptocurrency wallets, and roughly
    1.7 billion Japanese yen (about USD 10.7 million) moved to DPRK ('
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: bfc2e6880a
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: Germany's BfV confirms the campaign has targeted software developers "also in Germany" (translated from German) (
