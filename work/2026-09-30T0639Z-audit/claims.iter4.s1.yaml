- claim_id: 9dc596745f
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: 'On every Windows workstation, the GPO used only native client-side extensions (CSEs) to achieve the operation''s whole visible impact, with no encryptor of any kind: the Files CSE dropped a read-only
    ransom note to every desktop and drive root; the Registry CSE rewrote the Windows logon legal-notice banner to ransom text; the Personalization/Desktop policy set a SYSVOL-hosted ransom image as every
    machine''s lock screen and wallpaper; and Security Settings CSE (`GptTmpl.inf`) disabled the local Administrator account fleet-wide, alongside a second GPO disabling Windows Firewall domain-wide.'
- claim_id: 9c75eb2044
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: Because computer-configuration GPO settings apply only on reboot or a policy refresh cycle, the malicious policy sat cached and dormant for a full day between authoring (13 April) and mass visible
    impact (14 April); during that window, data exfiltration from file servers and several additional systems proceeded unnoticed.
- claim_id: 3236ced601
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: 'On the Windows domain-joined estate specifically, Kaspersky''s forensic reconstruction found no files encrypted, no ransomware binary resident on disk, and no endpoint persistence mechanism of
    any kind: a detection program keyed on ransomware executables, encryption behavior, or process-level anomalies would have produced zero alerts until the ransom wallpaper appeared, post-reboot, on every
    affected desktop simultaneously.'
- claim_id: 9ecc01153a
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: The exfiltrated data was later published on the dark web, per Kaspersky's own account, confirming the extortion followed through beyond the operational-disruption phase.
