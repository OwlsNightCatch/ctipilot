  entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  surface: body
  kind: uncited
  text: 'Strix, an open-source AI pentesting tool run via OpenRouter (GLM 5.2, later switched to DeepSeek v4 Pro), performs autonomous vulnerability discovery: 146 deep-mode scans against 138 hosts between
