  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: derived
  text: '**Triage:** for the Windows-side GPO attack, the discriminator is not endpoint behavior but Group Policy content and change history, since no encryption or binary execution occurs on those hosts.'
- claim_id: 0e0da45a7b
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: derived
  text: A domain-root or high-scope GPO created or modified outside a change-managed window, especially one touching the Files, Registry, Security Settings or Personalization CSEs simultaneously, is the
    signal; ordinary administrative GPO changes rarely touch all four categories in a single object, and a GPO disabling the local Administrator account or Windows Firewall domain-wide has essentially no
    benign justification.
- claim_id: 8998df2a17
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: derived
  text: 'On ESXi/Linux hosts, the discriminator is the ordinary one for ransomware: an actual PAYLOAD binary execution.'
- claim_id: 2c0a742bd6
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: derived
  text: '**Defender takeaway:** review GPO-write/modify permissions at the domain root and any OU covering a meaningful share of the estate, since the Windows-side technique requires only that access, not
    code execution rights on any endpoint; enable auditing on GPO creation and linking events (Group Policy Management Console / SYSVOL change auditing) as a primary detection surface, because this class
    of attack is invisible to EDR and file-integrity tooling by construction on Windows.'
- claim_id: 56610765a1
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
