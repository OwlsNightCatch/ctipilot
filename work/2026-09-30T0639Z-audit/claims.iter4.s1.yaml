  entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
  surface: body
  kind: cited
  text: Brevo (CRM/email-marketing platform, formerly Sendinblue) confirmed in a 2026-09-17 post-mortem that an attacker used a long-lived Cloudflare API key with full account permissions, hardcoded in
    Brevo's application source code, to create a malicious Cloudflare Worker on Brevo's own account, first misused as early as late August 2026 (
