  entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
  surface: summary
  kind: frontmatter
  text: ServiceNow disclosed CVE-2026-6875 (CVSS 9.5), a sandbox escape in the ServiceNow AI Platform that, in certain circumstances, lets an unauthenticated user execute code within the platform. ServiceNow
    addressed its hosted instances starting in April and released updates for self-hosted instances on 2026-07-13. Defused reports exploitation attempts in the wild from 2026-07-17, and NCSC-CH flagged
    the CVE as actively exploited on 2026-07-20, citing that reporting. ServiceNow's advisory says it is not aware of exploitation against ServiceNow instances, and its spokesperson says it has seen no
    evidence that the activity relates to instances it hosts. Self-hosted and partner-managed customers must apply the fixed release for their family now.
