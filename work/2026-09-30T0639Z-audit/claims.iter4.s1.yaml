- claim_id: 6454d46000
  entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
  surface: summary
  kind: frontmatter
  text: THORChain, a Switzerland-based cross-chain liquidity protocol, lost about $11M across nine blockchains after one of its six vaults was compromised (The Record, 2026-05-15; TRM Labs, 2026-05-15).
    The working theory reported by CryptoTimes is a GG20 Threshold Signature Scheme implementation flaw exploited through a newly churned validator node, suspected of gradually leaking vault key material
    over keygen and signing rounds before forging outbound signatures (CryptoTimes, 2026-05-17). THORChain said initial indications were that user funds were safe and only protocol-owned funds were affected
    (The Record, 2026-05-15).
