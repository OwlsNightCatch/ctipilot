  text: Grocery delivery service Flink (Germany, also operating in the Netherlands) confirmed a breach of an internal order-management system. After Flink ignored a cryptocurrency ransom demand, the little-known
    extortion actor "LPG Group" emailed customers and employees directly, demanding 0.005 ETH each with a 2 October 2026 deadline. Flink told heise that at least 10,000 customers in the Netherlands received
