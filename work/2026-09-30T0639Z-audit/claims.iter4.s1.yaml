- claim_id: 0f3e6a099d
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: 'Those files carry one of five malware families the advisory names: **BeaverTail** (JavaScript-based malware hidden inside NPM packages and downloadable from GitHub or Bitbucket), **InvisibleFerret**
    (a Python backdoor), **OtterCookie** (a JavaScript RAT and infostealer), **OtterCandy** (combining OtterCookie and RATatouille features), and **StoatWaffle**, a modular Node.js loader, credential harvester
    and RAT that hides inside blockchain-themed decoy VS Code project repositories and auto-executes through a malicious VS Code configuration file the moment the victim opens and trusts the folder ('
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: dfe0118ffa
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: 'The advisory ties the malware-delivery operation to North Korea''s remote-IT-worker placement scheme: "the NPA and the FBI assess both WaterPlum cyber actors and some North Korean IT workers operate
    under the 313 General Bureau of the Munitions Industry Department subordinate to the Central Committee of the Workers Party of Korea" ('
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: ade16de627
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: It adds that some WaterPlum actors also operate as North Korean IT workers, and that both used the same IP addresses when accessing laptop farms, using crowdsourcing services and applying for positions
    at a Japanese cryptocurrency exchange (
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: a7f01808dd
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: The advisory defines a laptop farm as a location, often an enabler's residence, where employment-related computers are set up and remotely controlled by North Korean IT workers (
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: cb87aac6bc
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: The advisory's interview flags for suspected North Korean IT workers are refusals or excuses regarding in-person meetings, requests to receive payment in cryptocurrency, frequent glances at another
    monitor as if reading from the screen, occasional background voices, and repeated video or audio freezes (
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
- claim_id: ee62484a55
  entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  surface: body
  kind: cited
  text: Developers should check any `tasks.json` for code that downloads or executes further files, avoid opening unknown projects from a path previously marked as trusted, run unknown code only in a sandbox
    or virtual machine, and be especially cautious of commands or scripts containing strings such as curl, base64, -enc, mshta, Invoke-WebRequest or hidden (
  urls:
  - https://www.ic3.gov/CSA/2026/260918.pdf
