  kind: uncited
  text: 'Confirmed impact across the campaign: 600,000-plus unexpired credit-card records exfiltrated from two victims, and skimmer scripts ordered against at least 27 named victims and confirmed in place
    on 19 of them according to the body of Gambit''s report, although its own summary counts skimmer installations on the websites of five companies and does not reconcile the two figures.'
