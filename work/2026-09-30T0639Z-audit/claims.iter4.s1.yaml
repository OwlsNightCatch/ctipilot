- claim_id: 7a3a5b2aa8
  entry: 2026-05-08/qilin-ransomware-hits-die-linke-germany-1-5-tb-claimed-dpa-n
  surface: record 2026-09-30T07:12:38Z
  kind: record-summary
  text: The entry said Die Linke confirmed in April that Qilin encrypted and exfiltrated its systems, that Qilin claimed 1.5 TB and that the party notified its state data protection authority. The party
    disclosed the attack on 2026-03-27, has not confirmed data theft, and no reachable source carries the 1.5 TB figure or the notification. The entry is rewritten from Heise, BleepingComputer and The Record,
    and the priority moves from notable to routine because the sources give no access vector. The summary and correction now give the party's own uncertainty, which internal data was compromised and whether
    publication will succeed, instead of whether data was stolen. The party's own statement is now cited for the facts it carries.
