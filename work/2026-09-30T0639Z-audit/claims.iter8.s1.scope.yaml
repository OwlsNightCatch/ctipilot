    OTP storage, unrestricted file upload, `sudo` misconfiguration, an over-permissive NFS export, and cloud-secrets exposure) is entirely composed of defects a Tier 2/3 team already reviews for in any
    custom-coded web application, Swiss public-sector portals included.'
