  entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  surface: headline
  kind: frontmatter
  text: ShinyHunters claims it stole FBI staff and applicant data via PeopleSoft; the FBI says the point of breach is still undetermined
- claim_id: d61b05f9b6
  entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  surface: summary
  kind: frontmatter
  text: The extortion group ShinyHunters claims it exploited a new Oracle PeopleSoft zero-day on the night of 2026-09-21 to compromise the FBI's recruitment site (apply.fbijobs.gov), then pivoted into FBI-managed
    AWS GovCloud infrastructure and stole employee and applicant data. The group later told BleepingComputer it used the URL-encoded WAF bypass for the known PeopleSoft flaw CVE-2026-35273 against FBI Jobs,
    while still claiming a further unknown flaw. The FBI's 2026-09-23 statement, titled as a statement on the "Compromise of fbijobs.gov Portal", says a group is claiming a compromise, that the point of
    breach, a third party or the FBI's own enterprise, is still undetermined, and that it is investigating. Krebs on Security reads the statement as confirming the hack, while BleepingComputer and CyberScoop
    report that the FBI has not confirmed a breach, the data involved or attribution to ShinyHunters. Reuters, which examined documents the group shared, reports psychiatric and medical files, the group
    sent journalists a roughly 5,000-entry sample of names, addresses, phone numbers and relatives' information, and Nextgov/FCW reports, citing two people familiar with the matter, that the data covers
    intelligence analysts and Remote Operations Unit personnel. Dutch police separately confirmed an arrest connected to the ShinyHunters investigation, and Krebs's sources say a cybercriminal known as
    Rey, who operates as part of a collective called ScatteredLapsussHunters, has taken over ShinyHunters' operations.
