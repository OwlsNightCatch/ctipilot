- claim_id: 78f3b2b8cf
  entry: 2026-05-28/nx-console-tanstack-daemon-tools-supply-chain-cascade-lands
  surface: summary
  kind: frontmatter
  text: CISA added three supply-chain CVEs to KEV on 2026-05-27, the Nx Console / TanStack / DAEMON Tools cascade. The Nx Console v18.95.0 VS Code extension compromise (CVE-2026-48027) traces to the TanStack
    npm supply-chain compromise (CVE-2026-45321), whose payload exfiltrated a contributor's GitHub CLI OAuth token. GitHub's CISO named the extension as the vector for the theft of about 3,800 GitHub internal
    repositories, and Grafana Labs traced its own breach to the upstream TanStack compromise. Separately, CVE-2026-8398 covers a roughly four-week trojanisation of signed DAEMON Tools Lite builds 12.5.0.2421
