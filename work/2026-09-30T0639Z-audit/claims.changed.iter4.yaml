  - claim_id: 9fc53024bd
    entry: 2026-06-09/cve-2026-50751-check-point-security-gateway-ikev1-vpn-authen
    surface: "summary"
    kind: frontmatter
    text: "Check Point IKEv1 VPN auth bypass (CVE-2026-50751, CVSS 9.3) exploited in the wild since 7 May, a month before disclosure, against a few dozen targeted organizations. Check Point confirmed post-compromise activity associated with a Qilin ransomware affiliate in one case and assesses with medium confidence that the actor behind the exploitation is financially motivated and uses Qilin ransomware (Check Point, 2026-06-08). Unauthenticated session forgery on Remote Access / Mobile Access gateways. NCSC-CH flagged it as actively exploited (NCSC-CH, 2026-06-08) and CISA added it to KEV (CISA KEV catalog, 2026-06-08)."
  - claim_id: 492e7e651d
    entry: 2026-06-09/cve-2026-50751-check-point-security-gateway-ikev1-vpn-authen
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch Check Point IKEv1 VPN gateways (CVE-2026-50751): An unauthenticated attacker can forge a Remote Access / Mobile Access VPN session without a valid password on gateways running the deprecated IKEv1 key exchange, and the flaw has been exploited in the wild since 7 May 2026, a month before disclosure, against a few dozen targeted organizations. Check Point confirmed Qilin-affiliate post-compromise activity in one case and assesses with medium confidence that the exploiting actor uses Qilin ransomware. NCSC-CH has issued an advisory flagging the CVE as actively exploited. Apply hotfix sk185033 now, disable legacy IKEv1 remote-access client support, and begin forensic lookback from 7 May for VPN sessions established without a matching MFA/password event."
