    surface: "summary"
    kind: frontmatter
    text: "Softaculous Virtualizor's admin panel guards every pre-authentication request except one: a request with act=login walks straight into an unauthenticated billing-module handler. From there, an attacker reaches unauthenticated root command execution, PHP object injection, or arbitrary tenant-balance manipulation. Fixed in 3.2.9 patch 9 / 3.3.0. The root command injection needs an existing suspended in-house-billing account, so it is not precondition-free. VulnCheck turned it into a self-contained module for its open-source go-exploit framework that needs no credentials from the operator, and its post says neither whether that module is public nor whether it observed in-the-wild exploitation."
