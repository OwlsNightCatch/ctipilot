    text: "Patch and hunt JFrog Artifactory now — confirmed admin-takeover chain, backdoors already dropped: Wiz Research confirms active, ongoing exploitation of this two-CVE chain against self-hosted JFrog Artifactory since 15 August 2026, reaching full administrative control and, in multiple cases, a dropped Rust-based backdoor with C2 capability. Six weeks after disclosure, most organizations running Artifactory still have at least one vulnerable instance. Upgrade every instance to 7.133.11 or later, JFrog's only fixed build for CVE-2026-42016, on a build that also carries the CVE-2026-42018 fix for its branch. Wiz lists 7.133.29, 7.146.38 and 7.161.20 for those branches, above JFrog's own table. Wiz's lower-branch builds 7.111.21, 7.117.28 and 7.125.20 stay inside JFrog's affected range for CVE-2026-42016. Then search access logs for the chain's own signature: an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by a POST to /access/api/v1/tokens from the same client. A hit where both requests returned HTTP 200 is a successful exploitation: treat the instance as compromised. Revoke all tokens, reset the Access token signing key and certificate, audit for administrator accounts you did not create, remove unauthorized Groovy plugins and restart the JVM to clear any in-memory implant."
