    text: "**Defender takeaway:** review GPO-write/modify permissions at the domain root and any OU covering a meaningful share of the estate, since the Windows-side technique requires only that access, not code execution rights on any endpoint; enable auditing on GPO creation and linking events (Group Policy Management Console / SYSVOL change auditing) as a primary detection surface, because this class of attack is invisible to EDR and file-integrity tooling by construction on Windows."
