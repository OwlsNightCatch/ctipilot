- code: F3
  category: claim-not-supported
  section: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  item: "Defender takeaway, last sentences (claim 7dae40e66b): 'restricting plugin hosts does nothing for its variant' cited to AIR"
  url_or_quote: "Consumer Gemini CLI will not be fixed, and restricting plugin hosts does nothing for its variant ([AIR Security, 2026-09-17](https://www.air.security/blog-posts/plugin4shell))"
  summary: "AIR (https://www.air.security/blog-posts/plugin4shell) says only 'Google has deprecated the Gemini CLI and will not patch it, so every install stays vulnerable for good'; it says nothing about plugin hosts for the FETCH_HEAD variant. The Hacker News (https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html), which the body cites two paragraphs earlier, says GitHub's rule 'does not clearly block that name. So it is not established that installing a Gemini CLI plugin from GitHub avoids the flaw'. 'Does nothing' is an absolute no source states and goes beyond the body's own 'not established as safe'. Write 'restricting plugin hosts is not established to help against its variant' and cite THN."
