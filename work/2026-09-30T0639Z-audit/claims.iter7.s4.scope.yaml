  text: 'Apple''s macOS 26.6.1, Sequoia 15.7.9 and Sonoma 14.8.9 updates of 2026-08-06 fix CVE-2026-65400 in Screen Sharing, where "an attacker on the network may be able to authenticate to Screen Sharing
