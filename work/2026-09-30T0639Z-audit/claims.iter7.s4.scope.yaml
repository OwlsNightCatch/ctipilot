- claim_id: 6a7aa25dec
  entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
  surface: body
  kind: uncited
  text: The `escape_quotes()` function in the `access` executable allocates buffers via uninitialized `malloc()` without null-terminating escaped strings; a sprayed JSON payload to `/accessv2` (four single-quotes
    expanding to 16 bytes) overwrites heap metadata in adjacent freed chunks, and the subsequent `__sprintf_chk()` reads out-of-bounds into attacker-controlled data, reaching code execution as root with
    no authentication. watchTowr published the full mechanics.
