  entry: 2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin
  surface: summary
  kind: frontmatter
  text: 'Progress Kemp LoadMaster pre-auth RCE (CVE-2026-8037, CVSS 9.8 per ZDI, 9.6 per eSentire): uninitialized-malloc heap corruption in the /accessv2 API reaches code execution as root. watchTowr published
    the full mechanics, exploitation attempts began on 2026-06-29 and CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-08-07; the fix is in GA v7.2.63.2 and LTSF v7.2.54.18.'
