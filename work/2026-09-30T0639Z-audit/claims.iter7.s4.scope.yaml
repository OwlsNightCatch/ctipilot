- claim_id: 55cfe7e568
  entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  surface: body
  kind: derived
  text: 'Langflow runs Python, so the process-creation observable is the Langflow service process spawning children it has no business spawning: shells, package managers, download utilities, or a second
    Python interpreter outside the application''s own worker pattern.'
- claim_id: 21eda7737c
  entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  surface: body
  kind: derived
  text: In egress telemetry, look for outbound connections from the Langflow host to mining pools or to destinations unrelated to the model providers the application legitimately calls, and for authentication
    events at your model providers originating from addresses that are not the Langflow host.
- claim_id: fc1e2c35ed
  entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  surface: body
  kind: derived
  text: '**Triage:** Langflow''s whole purpose is executing user-authored component code, so "Python executing dynamic code" is the application working as designed and is not by itself a signal; the discriminators
    are the process''s *children* stepping outside the interpreter, and egress to destinations the application has no configured relationship with.'
