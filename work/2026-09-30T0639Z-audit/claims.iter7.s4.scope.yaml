  surface: record 2026-09-30T07:18:22Z
  kind: record-summary
  text: CVE-2026-48611 was described through NVD's 9.8 score as an OAuth-implementation flaw with no public exploit code, and an OAuth stop-gap was advised. Pentest-Tools.com, which found it independently
    of Aikido, scores it 9.4 and shows a single unauthenticated request through phpBB's Apache authentication provider yielding a session as any active user on default installations, with no configuration
    workaround, and it published proof-of-concept requests on 2026-07-04. CVE-2026-48612 needs OAuth enabled and a victim who opens a crafted link, and binds the attacker's OAuth identity to the victim's
    account. An unsourced claim that phpBB is common at European universities and municipalities and a table of unrelated CVEs are removed. Sources disagree on whether an administrator session obtained
    this way reaches the Administration Control Panel.
