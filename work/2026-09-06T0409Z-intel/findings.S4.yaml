    extended_notes: |
      Root-cause / hunt takeaway: a UNION-based SQLi against a membership/subscription portal is a textbook input-validation gap on a public-facing form or query parameter — the transferable defender action is auditing any communal-association, cantonal, or federal member-directory web application for parameterised-query discipline and WAF coverage, and specifically checking whether any legacy credential-storage path retains plaintext passwords alongside (or instead of) properly hashed ones. The combined dataset (identity + function + municipality + credentials) enables both targeted spear-phishing of specific mayors/DGS and credential-stuffing against any other portal reusing the same password.
    borderline: false

  - title: "JetBrains confirms its own Cadence/TeamCity cloud service was breached via the KEV-listed CVE-2026-63077 it had disclosed a month earlier — AWS IAM credentials, S3 data and PyCharm source code exposed over a 16-day dwell"
    sources:
      - { url: "https://blog.jetbrains.com/pycharm/2026/08/cadence-security-incident-august-2026/", publisher: "JetBrains (PyCharm Blog)", date: "2026-09-03", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/attackers-breached-jetbrains-cadence.html", publisher: "The Hacker News", date: "2026-09-05", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS, URL https://feeds.feedburner.com/TheHackersNews → primary: JetBrains PyCharm Blog, URL https://blog.jetbrains.com/pycharm/2026/08/cadence-security-incident-august-2026/"
    summary: |
      JetBrains disclosed (updated most recently 2026-09-03, 19:00 CEST) that its Cadence cloud-compute service — reachable through an optional PyCharm plugin that lets developers run ML/heavy workloads on JetBrains-hosted cloud GPUs — was compromised via CVE-2026-63077, a critical (CVSS 9.8) deserialization-of-untrusted-data flaw in JetBrains TeamCity that lets an unauthenticated attacker execute arbitrary OS commands with TeamCity server-process privileges. JetBrains had itself disclosed CVE-2026-63077 in July 2026, and CISA added it to the KEV catalog on 2026-08-05 after observing active exploitation. Despite owning the advisory, JetBrains admits the Cadence server ("api.cadence.jetbrains.com") — which used TeamCity internally to orchestrate workloads — was never patched: "The server should have been patched as part of our response to the vulnerability, but it was not." Exploitation activity ran from 2026-08-08 to 2026-08-24 (a 16-day dwell before JetBrains discovered it on 2026-08-23 and took the server offline the next day). Confirmed impact: exfiltration of personal data (usernames, real names, emails, last-login timestamps/IPs) for the affected user cohort; a full 2024 backup of the Cadence server containing credentials, configuration, artifacts and logs; multiple AWS IAM users and their credentials/secrets (including IAM users belonging to JetBrains employees), extracted from that 2024 backup; access to files in S3 buckets within JetBrains's own AWS accounts used by Cadence; and possible access to PyCharm project source code synchronized to the affected server. JetBrains has invalidated all Cadence plugin access tokens, published a list of exploitation-source IP addresses, and instructs affected users to rotate every credential/secret (cloud, source-control, package-registry, container-registry, Slack, SSH/deployment keys) that ever touched a Cadence execution.
    region_nexus: "global — any organization worldwide running self-hosted JetBrains TeamCity (or using JetBrains Cadence) is directly affected; no specific Swiss/EU nexus stated"
