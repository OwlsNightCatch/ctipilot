  - title: "ZeroBytes: two suspects arrested in France over the DGFiP tax-authority intrusion; wider ZeroBytes/Epsilon alias network under investigation"
    sources:
      - { url: "https://www.zataz.com/deux-suspects-interpelles-apres-le-piratage-du-fisc/", publisher: "ZATAZ.COM", date: "2026-09-04", role: "primary" }
      - { url: "https://www.zataz.com/zerobytes-deux-arrestations-et-des-alias-a-demeler/", publisher: "ZATAZ.COM", date: "2026-09-05", role: "corroborating" }
    discovery_trace: "first seen at: zataz RSS feed, URL https://www.zataz.com/feed/ → primary: ZATAZ.COM, URL https://www.zataz.com/deux-suspects-interpelles-apres-le-piratage-du-fisc/ → companion analysis: ZATAZ.COM, URL https://www.zataz.com/zerobytes-deux-arrestations-et-des-alias-a-demeler/"
    summary: |
      Update to the already-tracked France DGFiP tax-authority credential-intrusion entry (incident:france-dgfip-tax-breach-2026-08, actor:zerobytes). France's Paris public prosecutor's office confirmed to press that two suspects linked to the ZeroBytes intrusion crew were arrested in August 2026. The first, an 18-year-old (identified by ZATAZ as "ChatNoir," a self-described co-founder of the earlier Epsilon hacking collective previously tied to breaches at Free, LDLC, Sport 2000 and hijacked broadcast accounts at BFM-TV/RMC) was arrested 2026-08-18, placed under examination two days later and remanded to pretrial detention; the same suspect had two prior judicial cases (2024, 2025) for 2023-2024 intrusions while a minor. A second suspect ("Casquette"), aged under 16, was arrested 2026-08-26, held in police custody, and then released without charge pending forensic analysis of seized devices. Both are charged with unauthorized access/persistence in an automated data-processing system containing personal data (aggravating circumstance: organized group), plus data modification/extraction/transmission/reproduction offences and conspiracy carrying up to ten years. The Paris prosecutor's office states the ZeroBytes cluster (operating under at least five pseudonyms) claimed dark-web operations beyond DGFiP, including France Travail, the French Handball Federation, Intermarché, SFR, Bureau Vallée and Pulsy, in addition to the previously-tracked Éducation nationale and Bloctel/DGCCRF leaks. ZATAZ's own alias-mapping work (built on prior account-history correlation) notes the arrests coincide with an abrupt halt in "ChatNoir's" forum communications and several ZeroBytes-adjacent forum accounts being banned or closed — but a "third man" (alias xMetah) remained active and is suspected of a further leak posted 2026-09-01, after the arrests, underscoring that arrests of individual members do not necessarily end an active leak/extortion campaign run by a loosely affiliated crew.
