          aliases: [],
          summary: "UNION-based SQL injection against amf.asso.fr exposed ~114,000 records on French mayors, municipal councillors and territorial agents, including plaintext passwords; claimed by hacker 'Alduin' and confirmed by AMF 2026-09-04, reported to CNIL." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
