  - title: "IDScan.net traced as the source of a 153-million-record driver's-license dark-web marketplace; FBI opens formal investigation, class-action suits follow"
    sources:
      - { url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/", publisher: "Krebs on Security", date: "2026-09-01", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/idscan-sued-over-alleged-data-breach-affecting-153-million-drivers/", publisher: "BleepingComputer", date: "2026-09-04", role: "primary" }
      - { url: "https://www.securityweek.com/153-million-driver-license-images-offered-on-dark-web/", publisher: "SecurityWeek", date: "2026-09-03", role: "corroborating" }
      - { url: "https://www.infosecurity-magazine.com/news/fbi-probes-breach-153-million/", publisher: "Infosecurity Magazine", date: "2026-09-03", role: "corroborating" }
    discovery_trace: "backlog re-check tasked by main agent (item 4: IDScan.net / 'Nexus' 153M+ driver's-license listing) → WebSearch (\"IDScan.net Nexus 153 million driver's license dark web listing access vector\") → Krebs on Security primary, URL https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/ → corroboration/development: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/idscan-sued-over-alleged-data-breach-affecting-153-million-drivers/ (2026-09-04, FBI confirmation to BleepingComputer + Reuters, lawsuits filed)"
    summary: |
      A dark-web identity-theft storefront called Nexus appeared on the Russian cybercrime forum Exploit around 2026-08-31, advertising searchable access to more than 153 million U.S. and Canadian driver's-license scans, 10 million ID cards, 3 million travel documents and 579,000 medical cards, growing by roughly 400,000 records per day. Krebs on Security verified the data against volunteers' own licenses: each record carries six image files (front/back, plain, infrared and ultraviolet scans) with an embedded capture timestamp, and every volunteer's timestamp matched a point where they had physically handed a license to a clerk operating a document-scanning terminal — a car-rental counter (Hertz), a cannabis dispensary (Planet13) or similar point-of-presentation kiosk. That scanning technology traces to idscan.net, a New Orleans-based identity-verification vendor whose "trust" page lists Hertz, Target, FedEx, Motorola Solutions, Jack Henry and Caesars Entertainment as clients and which states its systems perform 21 million-plus verifications a month at 20,000+ locations; the Nexus operators themselves claimed to have been "continuously exfiltrating new data for over a year." idscan.net has acknowledged it is "investigating the matter" but has issued no public statement naming a root cause. The FBI's New Orleans field office opened a formal investigation on 2026-09-01 (independently confirmed to Reuters and to BleepingComputer); the Nexus service went offline hours after Krebs's story published, though the underlying dataset remains in criminal hands. By 2026-09-04, multiple U.S. law firms (Markovits Stock & DeMarco, Hall Attorneys) had opened class-action investigations, and IDScan reportedly began notifying some business customers around 2026-09-01. Caesars Entertainment has publicly disputed being an active IDScan.net client at the time of the incident, illustrating the vendor-attestation risk in the client list itself.
    region_nexus: "global (US/Canada primary data subjects); no direct Swiss/EU nexus, but the underlying vendor-concentration risk applies to any organization relying on third-party ID-document verification/kiosk vendors, including for physical access control or age/KYC verification"
    primary_sector_nexus: "indirect — transferable third-party/supply-chain risk lesson for any public-sector body using outsourced identity-document verification or physical access-control scanning vendors"
    sector: "cross-sector"
    cves: []
    techniques: [T1213]
    affected_products: ["IDScan.net identity-verification / document-scanning platform (VeriScan)"]
    entity_keys: []
    new_entities:
      - { key: "incident:idscan-net-nexus-driver-license-breach-2026-09", type: incident, name: "IDScan.net / Nexus 153M+ driver's-license dark-web marketplace",
          aliases: ["Nexus dark web ID service"],
          summary: "A dark-web identity-theft service (Nexus) sold 153M+ driver's-license/ID scans traced by Krebs on Security to identity-verification vendor idscan.net; FBI New Orleans field office opened a formal investigation 2026-09-01; class-action suits followed." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "We have been continuously exfiltrating new data for over a year into our private database"
        attribution: "Nexus service operator, quoted by Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
      - quote: "the technology scans IDs with both infrared and ultraviolet light. Idscan.net says the company's systems and technology perform more than 21 million verifications monthly, at more than 20,000 locations around the world"
        attribution: "Krebs on Security, citing idscan.net's own documentation"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
      - quote: "Earlier this afternoon, I was added to a conference call with a half-dozen FBI agents, including senior leaders from the agency's cyber division. During that call, the FBI shared that earlier today their New Orleans field office opened an official investigation into an apparent breach involving idscan.net."
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
    extended_notes: |
      Defender takeaway: this is a vendor-concentration/data-retention failure, not a classic network intrusion — idscan.net retained multi-year, multi-modal (visible + IR/UV) scans of physical ID documents captured at thousands of downstream client locations, and the exposure surfaced only through victim-side timestamp correlation by an independent researcher, not vendor detection. Any organization (including government agencies) that outsources physical identity-document verification/kiosk scanning to a third party should ask: (1) how long does the vendor retain raw document images, (2) are IR/UV biometric scans retained beyond the verification transaction, (3) what is the vendor's own breach-detection capability given this vendor apparently had "over a year" of undetected exfiltration. No access-vector (how the attacker got into idscan.net's own systems) has been confirmed publicly as of this writing — root cause remains open.
    borderline: true
    borderline_reason: "no direct Swiss/EU nexus (US/Canada data subjects); included per PD-11 limb (a) — global significance/scale (153M+ document scans, cross-border, FBI investigation) and limb (b) — transferable third-party ID-verification vendor risk lesson. Flagged per main agent's explicit backlog-resolution instruction (item 4)."

  - title: "France's Association des maires de France (AMF) confirms a UNION-based SQL-injection breach exposing 114,000 records on mayors, municipal councillors and territorial agents — plaintext passwords included"
    sources:
      - { url: "https://www.clubic.com/actualite-628315-alerte-fuite-de-donnees-l-association-des-maires-de-france-touchee-par-une-cyberattaque.html", publisher: "Clubic", date: "2026-09-04", role: "primary" }
      - { url: "https://incyber.org/article/fuite-donnees-association-des-maires-de-france/", publisher: "INCYBER NEWS", date: "2026-09-05", role: "corroborating" }
      - { url: "https://frenchbreaches.com/alertes/association-des-maires-de-france-mtmsxq04rjndct88z4p", publisher: "FrenchBreaches", date: "2026-09-04", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec / normal S4 sweep pivot via WebSearch (\"Association des maires de France cyberattaque 114000 lignes fuite données\") → primary: Clubic, URL https://www.clubic.com/actualite-628315-alerte-fuite-de-donnees-l-association-des-maires-de-france-touchee-par-une-cyberattaque.html → corroboration: INCYBER NEWS, URL https://incyber.org/article/fuite-donnees-association-des-maires-de-france/ → further detail: FrenchBreaches, URL https://frenchbreaches.com/alertes/association-des-maires-de-france-mtmsxq04rjndct88z4p"
    summary: |
      The Association des maires de France (AMF), France's national association of mayors with more than 34,000 member municipalities, confirmed on 2026-09-04 that its membership/subscription database at amf.asso.fr had been breached. An attacker using the handle "Alduin" claimed on a hacking forum to have exploited a UNION-type SQL-injection flaw against the amf.asso.fr web application to pull data from multiple database tables. The claimed and now AMF-confirmed dataset totals roughly 114,000 (per the attacker's claim; 114,465 per one outlet) entries — noting a single person can appear in multiple rows — covering names, professional/personal email addresses, municipality or intercommunality affiliation, job title/function, subscription type and dates, and internal identifiers for mayors, deputy mayors, municipal councillors, directors general of services (DGS) and other territorial agents. Critically, the stolen dataset reportedly contains both bcrypt password hashes and a separate table of plaintext passwords for the same accounts — a basic-hygiene failure (storing recoverable plaintext credentials alongside a properly hashed table) that undermines whatever protection the hashing was meant to provide. AMF has confirmed the incident, is still scoping it, has notified France's data-protection authority (CNIL) as legally required, and says it will inform affected individuals once its internal audit concludes. No patch/remediation timeline or WAF/input-validation fix has been publicly stated by AMF as of this writing.
    region_nexus: "France (EU neighbouring jurisdiction); direct transferable lesson for Swiss cantonal/communal-association equivalents (e.g. any body that aggregates contact/subscription data on municipal officials across many communes)"
    primary_sector_nexus: "direct — a national association of local-government elected officials and territorial civil servants is a close functional analogue to Swiss cantonal associations of communes (e.g. municipal associations, cantonal conferences); the exposed population (mayors, councillors, DGS-equivalent municipal administrators) mirrors the constituency's own communal-administration officials"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products: ["AMF membership/subscription web application (amf.asso.fr)"]
