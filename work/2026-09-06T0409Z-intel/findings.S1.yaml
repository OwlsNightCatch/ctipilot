    extended_notes: |
      Detection concept (telemetry class first): RouterOS's own system log is the primary hunt surface here (no EDR on most of these devices) — alert on any login-failure log entry for a non-standard/negative numeric pseudo-username followed within the same session window by a user-creation log entry, and independently alert on creation of any locally-administered account with full/administrative group membership that does not correlate to a known change-management ticket. Cross-reference against the vendor's own "Flagged" device-mode status (`/system/device-mode/print`) but do not treat an unflagged device as clear, per CERT Polska's own caveat. For the WebFig file-disclosure path (CVE-2026-67281), web-access logs showing `/jsproxy` requests with encoded parent-directory traversal sequences are the anchor. For the bandwidth-test flaw (CVE-2026-67277), unexpected inbound connections to the bandwidth-test service from unauthenticated sources, or unexplained device reboots correlated with such connections, are the observable.
      Hardening: patch to 7.25beta3 / 7.24.2 / 7.23.4 / 6.49.21 immediately; until patched, disable or firewall SSH, WWW/WWW-SSL and the bandwidth-test server to trusted management networks only, and avoid initiating outbound TLS connections or using RouterOS's built-in SSH client (`/system ssh`, `/system ssh-exec`) from an unpatched device toward untrusted networks/hosts (mitigates CVE-2026-67278). Post-patch, inspect configuration for unknown users, scripts, scheduler tasks, proxy servers and tunnels; if the Flagged marker or log evidence indicates compromise, isolate the device, preserve logs/config before any reset, factory-reset, and rebuild from a trusted verified configuration rather than restoring a backup taken from the potentially compromised device.
      Novel provenance note for defenders: CERT Polska states the vulnerabilities were found using an agentic research environment built on OpenAI's GPT-5.5-cyber/GPT-5.6-sol models under the OpenAI GTAC programme, automating RouterOS protocol-state-machine modelling (skip/repeat/reorder testing of handshake stages) and binary-diff-driven hypothesis generation, with every hypothesis independently confirmed on real hardware before publication — a fourth 2026 case (alongside prior brief items on Spring/Log4j AI-discovered findings) of AI-accelerated vulnerability research reaching production disclosure velocity.
