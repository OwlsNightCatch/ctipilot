    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu (enisa-euvd recent exploited, bridge api) → primary: CERT Polska, URL https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/ → primary: CERT Polska per-CVE page, URL https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve → primary: MikroTik vendor bulletin, URL https://mikrotik.com/supportsec/september-2026-vulnerability/ → corroborating: Nick Pratley independent reverse-engineering, URL https://npratley.net/reversing-mikrotiks-silent-patch-the-routeros-7-23-4-fix-they-wouldnt-explain/ → corroborating: MITRE CVE record, URL https://cveawg.mitre.org/api/cve/CVE-2026-67276"
    summary: |
      CERT Polska (own research, disclosed via its GPT-5.5-cyber/GPT-5.6-sol-assisted agentic research lab under OpenAI's GTAC programme) coordinated disclosure of six MikroTik RouterOS CVEs on 2026-09-05, naming the two-vulnerability chain that yields unauthenticated full device takeover "MikroTrick", and states plainly that it is observing active exploitation of that chain against RouterOS devices whose SSH service is reachable from the internet. The six flaws span four attack surfaces: the SSH server (CVE-2026-67276, CVE-2026-86060, CVE-2026-67279), the bandwidth-test service (CVE-2026-67277), X.509/TLS certificate validation (CVE-2026-67278), and the WebFig web management interface (CVE-2026-67281).
      CVE-2026-67276 (CVSS 4.0 9.2) is a signature-verification flaw: RouterOS's SSH authentication compares only the key type and modulus of a client-supplied RSA public key against the authorized-keys entry, never the exponent, and because signature verification is performed against the client-supplied key rather than the stored one, an attacker who knows an authorized user's RSA modulus can submit a key with exponent 1, forge a valid signature, and open an SSH session as that user without ever holding the private key. CVE-2026-86060 (CVSS 4.0 9.2) is a companion flaw in the same login path: RouterOS mishandles SSH usernames that begin with a prohibited character, and MITRE's own CVE record states exploitation "requires an unauthenticated SSH session to reach the RouterOS login helper" — no credential, no privilege, no user interaction — to change the trusted RouterOS policy mask and obtain full administrative rights. CERT Polska names these two as the components of MikroTrick. An independent researcher's reverse-engineering of the silent 2026-09-03 patch (Nick Pratley, published 2026-09-04, corroborating but not the coordinating CNA) traces the crafted-username path in detail: the SSH daemon invokes a legacy `/nova/bin/login` helper via `execl()` with the authenticated username and a decimal policy mask as trailing positional arguments; that helper's undocumented legacy transport treats any positional beginning with `-` as a file-descriptor number, reads up to 4096 bytes from that descriptor, and splits the buffer on NUL bytes into a replacement identity and a replacement `strtoul`-parsed policy mask — so an SSH session authenticated as username `-2` lets the client supply its own trusted policy mask over the PTY's own file descriptor 2, escalating an intended read-only account straight to RouterOS's full administrative privilege set. The researcher states they reproduced full policy-mask override once a username of `-2` was accepted (via a scoped test RADIUS responder) but did not reproduce a stock, credential-free way to make SSH accept that literal username in the first place, leaving CERT Polska's own combination of the two CVEs — rather than this third-party analysis — as the authoritative description of the unauthenticated attack path.
      The remaining four CVEs are lower-severity but still notable: CVE-2026-67277 (CVSS 8.8) lets an unauthenticated client reach the bandwidth-test service's post-authentication code path, disclosing uninitialized kernel packet-buffer contents and triggering an integer-underflow crash/reboot via mismatched size validation; CVE-2026-67278 (CVSS 6.3) lets an attacker who can intercept or redirect an outbound RouterOS TLS connection forge a trusted intermediate certificate for arbitrary hostnames, because RouterOS accepts malformed RSA/PKCS#1 v1.5 signatures during X.509 validation and its trust store ships a low-exponent (e=3) root CA; CVE-2026-67279 (CVSS 6.9) lets an unauthenticated SSH client that requests a rekey before ever attempting authentication still reach the connection protocol and issue an exec request, letting it create, overwrite or reconstruct files in RouterOS's managed file namespace including configuration/diagnostic support files; and CVE-2026-67281 (CVSS 8.7) is an unauthenticated file-read in the WebFig `/jsproxy` path caused by a newly allocated session retaining a stale, uninitialized "principal" pointer used for file-authorization checks, which an attacker can exploit with directory-traversal components in an encrypted URI to disclose root-owned files including credential-bearing configuration stores.
      All six are fixed in RouterOS 7.25beta3, 7.24.2, 7.23.4 and 6.49.21 (2026-09-03); MikroTik pushed a first-ever app push notification to administrators alongside the release. RouterOS ships a "Flagged" self-check at startup that scans configuration for known post-compromise traces and marks the device "Flagged" in the system log — CERT Polska explicitly cautions this detects only known compromise patterns, so an unflagged device is not proof it was never compromised, and the vendor may not have disclosed every hardened issue in the changelog. CERT Polska's own analysis of the confirmed attacks found the operators created a highly-privileged local account named "ops" after exploitation, and RouterOS logged the sequence as a failed login for a numeric-negative pseudo-user followed by that user's creation via the SSH session — both distinctive of this exploitation path and worth an immediate configuration audit independent of the Flagged marker. No CVE was in CISA's KEV catalog as of the 2026.09.04 catalog version (pre-dating this disclosure) or in the checked ENISA EUVD listing beyond the six records above; none carries a populated EPSS score yet given how recent the disclosure is.
