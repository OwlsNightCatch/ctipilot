items:
  - title: "MikroTrick — CERT Polska coordinates disclosure of a six-CVE RouterOS chain that takes over any internet-exposed SSH service without authentication, exploited since at least 2 September"
    sources:
      - { url: "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/", publisher: "CERT Polska (NASK)", date: "2026-09-05", role: "primary" }
      - { url: "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve", publisher: "CERT Polska (NASK) — CVE detail page", date: "2026-09-05", role: "primary" }
    discovery_trace: "first seen at: cert-pl, URL https://cert.pl/en/rss.xml → primary: CERT Polska, URL https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/ (no pivot needed — CERT-PL is the discovering and coordinating authority) → corroboration: CERT Polska CVE detail page, URL https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve"
    summary: |
      CERT Polska (NASK) discovered and coordinated disclosure of six RouterOS vulnerabilities it collectively names "MikroTrick" and confirms two of them are being chained in live attacks against internet-exposed SSH services. CVE-2026-67276 (CVSS 9.2) is the core primitive: RouterOS's SSH authentication compares only the key type and the RSA modulus of a client-supplied public key against the authorized key on file, never the exponent — an attacker who already knows an authorized user's public modulus (harvestable from the exposed SSH host key exchange in many configurations) can craft a substitute key with exponent 1, forge a valid signature over it without the corresponding private key, and open an authenticated SSH command channel as that user. CVE-2026-86060 (CVSS 9.2, CWE-88 argument-delimiter/argument-injection) is chained immediately after: RouterOS mishandles SSH usernames beginning with a disallowed character, letting a crafted username escalate the resulting session to full administrative privileges regardless of the account the auth-bypass targeted. CERT Polska states it has independent confirmation the two are being combined against SSH-exposed devices in ongoing attacks and that the vendor's patches stop the observed activity. Three lower-severity flaws round out the chain: CVE-2026-67277 (CVSS 8.8) is an unauthenticated pre-auth state in the bandwidth-test service that leaks uninitialized kernel packet-buffer memory and can trigger a kernel restart via an integer-underflow size check; CVE-2026-67278 lets an attacker forge a trusted TLS intermediate certificate because RouterOS's trust store contains a root CA with public exponent e=3 and accepts malformed RSA/PKCS#1 v1.5 signatures during X.509 validation, enabling TLS server impersonation on outbound RouterOS connections; CVE-2026-67279 lets an unauthenticated client that requests an SSH rekey before ever attempting authentication still open a session channel and issue an exec request that the affected build dispatches, permitting unauthenticated creation/overwrite of files in the managed namespace including configuration/diagnostic support files; CVE-2026-67281 is an unauthenticated file-read in the WebFig `/jsproxy` path via a stale uninitialized session principal pointer. Affected: RouterOS 6.0.0 before 6.49.21, 7.0.0 before 7.23.4, and 7.24 before 7.24.2. Fixed in 6.49.21, 7.23.4, 7.24.2 and 7.25beta3 (MikroTik security bulletin, referenced by CERT Polska). MikroTik additionally shipped a boot-time configuration scanner in the fixed releases that flags selected known post-compromise artifacts (a "Flagged" marker) — CERT Polska is explicit this only catches selected traces and its absence is not proof a device is clean.
    region_nexus: "global — internet-facing SSH-managed network infrastructure, discovered/coordinated by a Council-of-Europe-region national CERT (Poland)"
