      - quote: "We have obtained confirmation that the attackers are exploiting this combination of vulnerabilities to take full control of devices whose SSH service is accessible from public networks. It has also been confirmed that the released patches prevent the observed attacks."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/"
      - quote: "RouterOS did not properly verify public keys used for SSH authentication - in particular, it did not compare the entire RSA public key assigned to a user."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve"
      - quote: "RouterOS did not properly handle usernames beginning with a disallowed character in the SSH login mechanism. By using a crafted username, an attacker could elevate their privileges. The resulting session had full administrative privileges in the RouterOS system."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/"
    extended_notes: |
      Detection concept (telemetry class first): authentication-log review on any RouterOS device with SSH reachable beyond a trusted management network — look for SSH login sessions that immediately follow a rekey request with no prior authentication attempt, and for account-creation events shortly after an SSH session establishes (RouterOS system log entries recording a new user added "by ssh" from an external session). Config-artifact hunt: enumerate all local users for any unexpected/unrecognized administrative account, and check the `/system/device-mode/print` "Flagged" marker after updating — CERT Polska is explicit this marker only catches known traces and its absence never proves a device is clean, so a full user/script/scheduler/proxy/tunnel configuration review is the actual bar, not just the marker. Hardening: update to 6.49.21 / 7.23.4 / 7.24.2 / 7.25beta3 immediately; until patched, remove SSH, WWW/WWW-SSL and the bandwidth-test server from any interface reachable outside a trusted management network, and do not originate TLS connections or use the built-in SSH client/exec tools from an unpatched device toward untrusted hosts (CVE-2026-67278 lets an on-path or DNS-hijacking attacker impersonate any TLS server to such a device). No IOCs are reproduced here per this pipeline's policy — CERT Polska's advisory documents the specific log-message templates and a named suspicious account observed in the wild for anyone needing them at the source.
  - title: "Berlin Landesnetz aftermath: Rhysida's full data dump goes live after the ransom ultimatum lapses, and the federal government uses the same week to shelve the constitutional fix for BSI's cross-Länder assistance gap"
    sources:
      - { url: "https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html", publisher: "heise online (dpa)", date: "2026-09-04", role: "primary" }
      - { url: "https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html", publisher: "heise online", date: "2026-09-03", role: "primary" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → primary: heise online, URL https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html and https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html (both fetched via python3 tools/fetch_source.py extract)"
    summary: |
      Two directly-connected developments this window on the already-tracked Berlin Landesnetz/Rhysida incident. First, a genuine policy consequence: heise reports (citing the Federal Interior Ministry's own written reply to a Bundestag inquiry from Green-faction deputy chair Konstantin von Notz) that the German federal government has quietly abandoned the coalition-agreement commitment to amend the Basic Law (Grundgesetz) so the BSI could act as a true central authority for state- and municipal-level cyber incidents. Today the BSI may only assist a Land after that Land explicitly requests Amtshilfe, and durable bilateral cooperation agreements — a precondition the BMI itself confirms do not yet exist with all 16 federal states — still gate faster support; in practice the BSI has repeatedly had to help first and formalise the legal basis afterward. The BMI's reply points instead to the 14 existing cooperation agreements, the NIS2-transposition-driven expansion of BSI's powers, and increased staffing/budget as sufficient, explicitly declining to revive the constitutional change. Von Notz calls the reversal "devastating for Germany's IT security" given the still-unfolding fallout from this exact incident. This is a direct, defender-relevant illustration of a structural gap in federated cyber-incident response — the same tension the Swiss constituency's federal/cantonal/communal cooperation model with BACS must itself navigate — landing in the same week the incident's fallout peaked. Second, on the incident itself: Rhysida's ransom ultimatum lapsed 2026-09-04 and the group published its full "auction" dataset in the clear on its leak site after Berlin's Senate confirmed it would not pay (a fact this pipeline's prior update on 2026-09-05 had already recorded); the added, previously uncaptured detail is what Chaos Computer Club spokesperson Joachim Selzer identifies as concretely exposed and exploitable — personnel matters and employment reference letters, and an employee's handwritten signature on an internal device-request form, which he assesses is more useful for medium-term identity-fraud and impersonation than for immediate abuse given the dataset's size. IT-security expert Christof Fischer separately confirms in the same reporting that German law bars public bodies from paying such ransoms outright.
