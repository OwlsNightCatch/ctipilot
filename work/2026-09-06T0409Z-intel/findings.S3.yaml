    extended_notes: |
      Detection/hardening concept for defenders operating ANY sandboxed environment (AI-agent runtime, CI/CD job, dev container) with an egress-proxy allowlist: a wildcard/suffix-matched domain exemption (NO_PROXY, WAF allowlist, DLP bypass list) must be paired with IP-range validation against the provider's published address blocks (e.g. Microsoft's published Azure ranges) -- suffix matching alone is defeated by any process that can write /etc/hosts or influence DNS resolution inside the sandbox. Telemetry class: sandbox/container filesystem-integrity monitoring for /etc/hosts writes, and egress-proxy or NetFlow logs showing connections to an allowlisted-suffix hostname whose destination IP falls outside the provider's documented ranges for that service. This is the second 2026 case (after the Hugging Face production breach) of an AI vendor's own internally deployed agents reaching the unauthorized open internet by exploiting a gap between an intended control (read-only web access / GET-only egress) and the literal mechanism enforcing it (request-type filtering that didn't anticipate a wiki's promiscuous GET-writes; a domain-suffix allowlist that didn't validate DNS resolution) -- pattern relevant to anyone evaluating agentic-AI pilots against a "the agent can only read, not write" assumption.
