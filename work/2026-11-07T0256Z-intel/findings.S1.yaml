    discovery_trace: "first seen at: CERT-FR avis feed (python3 tools/fetch_source.py cert-fr avis-recent 25: CERTFR-2026-AVI-1477 'Vulnerabilite dans les produits Mitel', 2026-11-06; AVI-1467 Cisco, 2026-11-05) -> pivot: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1477/ and https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1467/ -> primary: Mitel https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0010 and Cisco https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u -> second lead: Siemens ProductCERT Atom feed https://cert-portal.siemens.com/productcert/rss/advisories.atom (SSA-045512 V1.2, SSA-443410 V1.1, 2026-11-06), read with `url --direct` for the product tables -> Synology listing https://www.synology.com/en-us/security/advisory (Synology-SA-26:15 'Ongoing')"
    summary: |
      The vendor wave around the exploited Brotli decoder flaw widened on 2026-11-06. Cisco's advisory (version 1.8, 2026-11-06) says Cisco PSIRT is "aware that proof-of-concept exploit code is available" and "not aware of any malicious use of these vulnerabilities against any Cisco product"; it was expanded on 2026-10-30 to cover Brotli outside Node.js and now lists priority products Catalyst SD-WAN, IOS XE, IOS XR, Secure Firewall ASA, FMC and FTD as not impacted and Identity Services Engine as under investigation. Affected products with fixes include Duo Network Gateway (fixed in 3.4.2) and Duo Authentication Proxy Local Manager for Windows (6.8.1, November 2026), Webex Connect (6.22.2, November 2026), Spaces (24.22.1), Packet Tracer (9.2.0, December 2026), Business Process Automation (5.0 in November 2026; 4.1.2 and 5.1 undated), Intersight and Intersight Virtual Appliance and Secure Endpoint Private Cloud Appliance (November 2026, release number to be determined), Secure Workload (February 2027), Smart PHY (March 2027), Catalyst Center (3.4.1, July 2027), Nexus 9000 in standalone NX-OS (Guest Shell), Virtualized Infrastructure Manager and RoomOS on Board, Desk and Room Series devices (on-premises 11.41.2.3 and 26.7.4.3; cloud builds 26.9.1 and later or 11.41.1 and later). CERT-FR's AVI-1467 relays the same list. Several Cisco fixes are dated well after today.
      Siemens' SSA-045512 (V1.2, CVSS 3.1 9.8) lists the building-management platform Desigo CC V8 and V9 as affected in all versions, remediated by installing the latest .NET security updates through Windows Update, and Gridscale X DSA (fixed in 5.4) and Gridscale X PSS(R)E (36.8.0); SSA-443410 (V1.1) covers Industrial Edge: fixes for Cloud Connector Configurator (1.24.3), Data Flow Monitoring (3.0.18), Databus Configurator (4.0.1), DataXess Configurator (1.5.7), Edge OPC UA Server Configurator (2.3.10) and Flow Creator Configurator (1.15.1), no fix yet for Common Configurator (on Edge and on IEM) with 'uninstall all Management Applications and protect your IEM instance with a Firewall/WAF' as the interim measure, and Industrial Edge Hub and Management Cloud already fixed by Siemens in October. Mitel's MISA-2026-0010 (revision 5.0) rates it high (CVSS 3.1 8.1) and lists MiVoice Business 10.6.0.7 and earlier and MiVoice Business Solution Virtual Instance 2.1.0.9 and earlier (updates planned, KB000129034), OpenScape SBC V11R3.4.4 and earlier (V11R3.4.5 planned, workaround KB000129100), OpenScape Xpert V9 R0.2.0 and earlier, OpenScape SESAP V2 R1.1.9 and earlier (V2 R1.1.10 planned), OpenScape Contact Center V12R0 to V12R0FR7 (V12R0FR8 planned, workaround KB000129114) and OpenScape Endpoint Management V1 R2.5.1 and earlier, with several products still under investigation; CERT-FR relays it. Synology's SA-26:15 (2026-10-30, Moderate, ongoing) says its DSM packages (Drive, MailPlus, Chat Server, Photos and others), the SRM VPN Plus Server and Note Station Client are not affected and only the desktop Synology Chat Client is affected with a fix ongoing.
