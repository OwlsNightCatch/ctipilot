    discovery_trace: "first seen at: BleepingComputer feed https://www.bleepingcomputer.com/feed/ (item 'QNAP says hackers breaching NAS devices in Plex2Shell attacks', 2026-11-06 12:04) -> pivot: https://www.bleepingcomputer.com/news/security/qnap-says-hackers-breaching-nas-devices-in-plex2shell-attacks/ -> primary: QNAP notice https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately -> primary: Plex announcement https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319 -> primary: CISA alert found by WebSearch (cisa.gov allowed-domain search) and fetched at https://www.cisa.gov/news-events/alerts/2026/10/20/cisa-adds-six-known-exploited-vulnerabilities-catalog (KEV JSON from tools/fetch_source.py cisa-kev confirms dateAdded 2026-10-20 for all four) -> primary: https://zmain.info/blog/plex2shell"
    summary: |
      Plex2Shell is a chain of four Plex Media Server flaws fixed in 1.43.3.10861; CISA added all four to the KEV catalogue on 2026-10-20 and the store has carried it only as a borderline drop. The new development is QNAP's security notice of 2026-11-06: QNAP says it "has received reports from some users that Plex Media Server on their NAS appears to have been compromised" through the chain, that QNAP Technical Support is assisting them, and that QTS, QuTS hero and other QNAP operating systems are not themselves affected because the flaws sit in the Plex app. Plex's own announcement says the chain lets an unauthenticated remote attacker run code with the privileges of the Plex Media Server process, that a public proof of concept appeared on 2026-10-16, that the attacks are "actively and widely exploited" against internet-facing servers that were not updated, and that compromised servers ran cryptocurrency miners and proxy software that routes other people's traffic through the victim.
      The discoverer's write-up (2026-10-16) describes the chain: an unauthenticated server-side request forgery in the player timeline endpoint makes the server call itself over loopback, which reaches the loopback-only plugin API, where an injected identifier forges a call to a networking function that attaches the server owner's admin token to a request whose host name starts with 127.0.0.1 but resolves to an attacker-controlled address; with the owner token the attacker points the transcoder at an attacker-hosted file and a transcoder preference writes it into the Codecs directory as a shared object that the next transcode loads, so code runs as the Plex service user. Plex's CVE list names -96652 the unauthenticated SSRF in the timeline endpoint, -96654 access to internal agent functions over loopback, -96655 disclosure of the owner's admin token and -96656 the arbitrary file write to the Codecs directory; CISA's catalogue text describes -96655 as an authenticated SSRF in the transcode path and -96656 as an admin-level file write, which fits the same chain from a different angle.
      Affected: Plex Media Server 1.43.2 and earlier on every platform (Windows, macOS, Linux, Docker and NAS packages); fixed in 1.43.3.10861 and later. QNAP offers it through App Center and tells users to confirm the version under Plex Web Settings > General. QNAP advises treating a NAS as potentially compromised if Plex ran 1.43.2 or earlier and was reachable from the internet (Remote Access on, port 32400 forwarded, or opened by UPnP), because updating does not remove what an attacker installed, and recommends a clean reinstall of QTS or QuTS hero, resetting Plex and NAS credentials, and a VPN instead of port forwarding.
    region_nexus: "global; any internet-reachable Plex Media Server, including on QNAP and other NAS. No Swiss-specific reporting found; the BACS week-44 review the store already dropped covered Plex among home-network compromises."
    primary_sector_nexus: "indirect: staff or communal NAS devices running the Plex app; the product itself is a consumer media server"
    sector: "public-sector"
