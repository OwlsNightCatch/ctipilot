dispositions:
  - "KEV sweep: python3 tools/fetch_source.py cisa-kev (catalogue 2026.11.06, 1769 entries) shows exactly one addition in the window, CVE-2026-19868 (dateAdded 2026-11-06); the preceding additions are 2026-11-04 Apple CVE-2024-27834 and 2026-11-03 WordPress CVE-2026-119977, both COVERED. ENISA EUVD's exploited list (4 records) adds nothing new. CVE-2026-19868 -> item 1 (new, no SonicWall SSLVPN entry exists; the SMA1000 entry of 2026-10-08 and the GMS entry of 2026-11-05 are different products)."
  - "KEV cross-check of the whole catalogue against the store's CVE index since 2026-08-15: absent from the store are the four Plex Media Server CVEs (item 2, previously borderline-dropped), EG Secure Solutions SiteGuard Server Edition CVE-2026-106931 (KEV 2026-10-20, Japanese WAF module, OS command injection; borderline-dropped by the 2026-10-21/22 fires, no new development) and four old CVEs added 2026-08-26 (Red Hat libuser CVE-2015-3246, ABRT CVE-2015-5287, Linux kernel CVE-2022-0995, SQL Server CVE-2019-1068); nothing else."
  - "PHP2Shell vendor wave: Fortinet FG-IR-26-186 (FortiSOAR only, CVSS 5.3), Palo Alto, QNAP QSA-26-18/19 (2026-10-22) and Siemens SSA-566435 (a not-affected list) add nothing new; the one new delta is Siemens SSA-166980 V1.3 (item 8, update-of 2026-10-27/php2shell-ot-products-netmodule-nrsw-no-fix-macmon-schneider, borderline). CERT-FR AVI-1476 (Cisco Expressway/URWB/Duo Access Gateway) and AVI-1474 (VMware SDDC Manager) relay advisories already covered by existing entries."
  - "Scheduled multi-product releases in the window: none landed (Microsoft Patch Tuesday, SAP Patch Day and Adobe are 2026-11-10; Oracle CPU is January). Releases that ended just before it and were handled by earlier fires: Android November bulletin (NCSC-NL 2026-0467: no reports of active exploitation), Chrome 157 (2026-11-03, 213 fixes, seven Critical: CVE-2026-121156, -121229, -121246, -121035, -121247, -121203, -121126; Google's notes carry no in-the-wild statement; borderline-dropped by the 2026-11-04 and 2026-11-05 fires), Next.js November security release (2026-11-03: one High and six Medium cache-isolation and disclosure issues, no RCE, fixed in 16.4.5 and 15.5.29; borderline-drop), Cisco UCS Central cisco-sa-cucs-rce (2026-11-04, authenticated, CVSS 7.6, drop), Splunk, Citrix CTX697256 (XenServer Workload Balancing and Conversion Manager), HPE Aruba AVI-1451, Mattermost, Foxit, IBM, MongoDB, OpenOffice, SPIP, Zookeeper, Ruby on Rails: nothing exploited or pre-auth network CVSS 9.0 and above that is new."
  - "MSRC revised-CVE sweep (Security Update Guide API, latestRevisionDate on or after 2026-11-04, 1280 records, all paged): Microsoft-rated CVEs revised or released in the window are Paint CVE-2026-83844 (revised 2026-11-06, item 3), Entra Device Registration CVE-2026-109469 (released 2026-11-05, CVSS 3.1 10.0 Critical, Elevation of Privilege, CWE-639, exploited No, publicly disclosed No, Customer Action Required false: Microsoft states it 'has already been fully mitigated' and that the CVE exists for transparency; borderline-drop, no customer action) and Microsoft Edge CVE-2026-122518 (6.5, information disclosure). None is exploited or publicly disclosed. The same sweep returned about 1270 third-party and Linux-kernel CVE records, none Microsoft-rated."
  - "Advisories revised after publication that a covered entry cites: Cisco cisco-sa-oct2026-node-js v1.8 (2026-11-06, daily revisions; item 6), Siemens SSA-045512 V1.2 and SSA-443410 V1.1 (2026-11-06; item 6), SSA-834709 V1.1 (2026-11-04; item 7), Mitel MISA-2026-0010 revision 5.0 (2026-11-04; item 6), Synology SA-26:15 (2026-10-30), Synology SA-26:16 (OpenSSH sshole, 2026-11-06: none of Synology's products affected; informational for the sshole entry), NCSC-CH Security Hub post 13144 (Barracuda; edited 2026-11-06 to add watchTowr's analysis and proof of concept, which the entry already carried from 2026-11-06 03:41Z) and post 13054 (refrigeration controllers; edited 2026-11-06 with the Swiss incidents, which the Danfoss entry already carries from 2026-11-06 03:44Z), Fortinet FG-IR-26-188 (Linux kernel TCP, 2026-11-02, products still under investigation; no revision in the window). The OpenSSH and WordPress developments are items 4 and 5."
  - "Previously borderline-dropped and checked again, no new development, NOT resubmitted: Apache OFBiz 24.09.08 (oss-security 2026-11-04, 46 CVEs including pre-authentication RCE CVE-2026-68524, CVE-2026-73578 and CVE-2026-83542, hard-coded JWT key CVE-2026-105330 and REST authentication bypass CVE-2026-92887; the 2026-11-06 fire flagged it as an audit lead), Rails Active Storage GHSA-f3w6-w445-fwh9 (CVSS 9.8, ImageMagick MSL coder, fixed in activestorage 8.0.5.2 and 8.1.4.1; Debian and Ubuntu ImageMagick policies do not deny the coders per the advisory; the 2026-11-05 fire dropped it), Xen XSA-523 (CVE-2026-102703/-102704, guest-to-dom0 memory read/write, no mitigation, all Xen from 4.6), APT CVE-2026-109518 (Debian DSA-6607-1 and DLA-4880-1, Ubuntu USN-8996-1; Ubuntu's tracker now shows fixes for all eight releases including ESM; needs an on-path attacker), HPE Networking Fabric Composer HPESBNW05172 (CVE-2026-95731 9.8 hard-coded CLI password, two 9.6 adjacent). These are the strongest borderline candidates if the audit revisits the bar; none is exploited."
  - "New low-priority drops: D-Link DGS-3130-30TS hardware rev B1 interim advisory SAP10523 (2026-11-02 disclosure, published 2026-11-06; DDP authentication, access-control and information-handling weaknesses, no CVE ids, no firmware date, no exploitation, adjacent-network; mitigations: disable DDP, remove default SNMP communities, restrict management access), Wazuh 4.14.x GHSAs of 2026-11-06 (eight CVEs: Windows-agent stack overflow in read_snortfull, manager analysisd memory exhaustion from repeated JSON fields, authenticated dashboard header override, execd out-of-bounds write; none pre-auth network at 9.0 or above), Apache ActiveMQ 2026-11-03 batch (six CVEs rated low, moderate or important), Sonatype Nexus Repository 3.98.0 (seven CVEs, none shown critical), HCL BigFix, MariaDB CVE-2026-102523, Gogs CVE-2026-123012 (authenticated DoS), Control Web Panel 'cwpdoor' backdoor (XLab; post-exploitation implant, entry vector unknown; S3/S4 material), CERT-PL KAMSOFT ZSIRep CLIENT (CVE-2026-113618, Polish pharmacy software), watchTowr and Fortinet, Palo Alto, CERT-EU and NCSC-UK listings (nothing in the window)."

