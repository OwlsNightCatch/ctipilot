        attribution: "CISA (KEV alert of 2026-11-06)"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/11/06/cisa-adds-one-known-exploited-vulnerability-catalog"
      - quote: "SonicWall fixed the issues in versions 7.3.4-7013 and 8.2.3-8015 and says no workarounds are available."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/"
    extended_notes: |
      Exposure: SonicWall Gen7 and Gen8 firewalls (and NSv) running SonicOS at or below 7.3.3-7015 / 8.2.2-8015 with the SSL VPN enabled and SAML configured as a login method for SSLVPN; the running build is the first check, SAML-for-SSLVPN the second (the vendor's stated precondition).
      Detection (inference from the stated mechanism, not a vendor-published detection): the bypass uses valid credentials of a different authentication method, so compare successful SSL VPN logins on the firewall with the identity provider's sign-in log; a VPN session that has no matching SAML sign-in or MFA event at the IdP, or a SAML-enrolled user who authenticated through a local, LDAP or RADIUS path, is the signal. Patching does not evict an attacker already holding a session or reusing the credentials, so review VPN sessions since SAML was enabled and reset the credentials of any account that exists in both authentication paths. SonicWall publishes no indicators and CISA's catalogue marks forensic triage "No".
      Triage: SAML-enforced MFA that is applied at the firewall's login page differs from MFA applied at the IdP; a legitimate user who signs in through the SAML path leaves an IdP event, an attacker using the alternate path does not (follows from the mechanism; no vendor discriminator published).
      Defender takeaway: upgrade every Gen7/Gen8 firewall that serves SAML SSL VPN logins to 7.3.4-7013 / 8.2.3-8015 or later; there is no workaround, and the exploitation basis (a report, not published evidence) is thin, so treat reachable gateways as the priority.
      Background (not sourced to this advisory): CISA's catalogue text names the weakness "Use of Single-factor Authentication".

