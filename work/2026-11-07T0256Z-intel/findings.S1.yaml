  - title: "UPDATE CVE-2026-123158 (OpenSSH *sshole, musl without PAM): Previdian reports exploitation attempts from 2026-11-06 and a root login on an Alpine honeypot; the flaw is not in the CISA catalogue"
    suggested_priority: notable
    novelty: "update-of:2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
    update_target: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
    update_type: update
    update_fields: [summary, headline, tags, cves, sources, evidence, actions, body]
    update_notes: "The entry says 'no source reports attacks' in summary and body; that statement is now false. Exploitation rests on one telemetry vendor (Previdian, honeypot sensors), single-source for the exploitation claim; CISA has not listed it (Previdian page: 'Not in CISA KEV'). The entry's cves[].status should gain exploited only if the main agent accepts a telemetry-vendor basis; otherwise write 'exploitation attempts reported by Previdian' without the status."
    sources:
      - { url: "https://previdian.com/CVE-2026-123158", publisher: "Previdian (exploitation telemetry page for CVE-2026-123158)", date: "2026-11-06", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html", publisher: "The Hacker News", date: "2026-11-06", role: "corroborating" }
      - { url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/", publisher: "Alpine Linux (security advisory)", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: The Hacker News feed https://feeds.feedburner.com/TheHackersNews (item 'Hackers Target OpenSSH SSHole Flaw Within Hours of Disclosure, Gain Root on Honeypot', 2026-11-06 20:51) -> pivot: https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html -> primary: Previdian page https://previdian.com/CVE-2026-123158 (fetched with extract) -> primary (detection guidance): https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"
    summary: |
      The Hacker News reports, citing Previdian, that attackers began trying CVE-2026-123158 less than nine hours after the CVE was published and that Previdian confirmed a successful root login on an Alpine Linux honeypot; Previdian's own page now counts 14 exploitation attempts from 9 source addresses in 8 countries since 2026-11-06 and lists it as not in the CISA catalogue. Previdian describes the observed activity as oversized passwords followed by reconnaissance commands in non-interactive SSH sessions (an identity and host query), i.e. a confirmed bypass followed by hands-on checks, with no payload reported. This is one telemetry vendor's honeypot data; no vendor, CISA or NCSC source confirms attacks on production systems.
      Alpine's advisory adds two points the entry can use: upgrading the openssh package alone does not replace the running daemon, so sshd must be restarted, and Alpine names the log check, 'Accepted password for' lines in /var/log/messages for accounts that should not accept passwords (alpine, root or any key-only user), together with a review of doas use and recently created users, files and authorized keys; if a login cannot be ruled out the machine is to be treated as compromised.
    region_nexus: "global; Alpine/musl hosts, OpenWrt and containers built on Alpine with sshd and no PAM"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-123158]
    techniques: [T1190, T1021.004]
    affected_products: ["OpenSSH", "Alpine Linux", "OpenWrt"]
    entity_keys: ["product:openssh", "product:alpine-linux", "product:openwrt"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: "B3 for the exploitation claim (one telemetry vendor, honeypot only); the flaw itself stays as already rated"
    evidence:
      - quote: "Threat intelligence firm Previdian said it observed the first exploitation attempt less than nine hours after the CVE publication, adding it has confirmed successful root access on a honeypot running Alpine Linux and OpenSSH."
        attribution: "The Hacker News (citing Previdian)"
        source_url: "https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html"
      - quote: "Yes. Previdian sensors have observed 14 exploitation attempts, 9 unique attacker IPs, and 8 countries targeting CVE-2026-123158."
        attribution: "Previdian"
        source_url: "https://previdian.com/CVE-2026-123158"
      - quote: "Upgrading the package alone does not replace the running daemon."
        attribution: "Alpine Linux"
        source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"
    extended_notes: |
      Detection: successful password authentications in sshd logs for accounts whose password field is locked or '*' (key-only users), especially with very long passwords, then short non-interactive sessions running identity commands; on Alpine the log is /var/log/messages.
      Defender takeaway: restart sshd after the package update and sweep the accepted-password log lines for key-only accounts on every exposed Alpine or musl host; Previdian's honeypot confirmation makes that sweep a live check rather than a precaution.

  # ---------------------------------------------------------------------------
  # U2. WordPress CVE-2026-119977 -- the first update to the fixed release is itself exposed (update-of)
  # ---------------------------------------------------------------------------
  - title: "UPDATE CVE-2026-119977 (WordPress core upgrade-window RCE): the update that installs 7.1.4 still unpacks with the old code, so the staging folder name can be predicted one last time; Picus advises blocking web access to wp-content/upgrade before updating"
    suggested_priority: high
    novelty: "update-of:2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race"
    update_target: "2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race"
    update_type: update
    update_fields: [summary, actions, sources, evidence, body]
    update_notes: "A hardening lever the entry lacks and a correction of its implicit assumption that updating to 7.1.4 closes the window: the first update from an unfixed release to a fixed one runs the old, vulnerable unpacking code. The entry's headline says to confirm 7.1.4 'ran on every site'; the new fact is that the run itself is the last exposed moment. Picus blog dated 2026-10-14 in page metadata but 'LAST UPDATED ON NOVEMBER 05, 2026' in its text; its guidance post-dates the 2026-11-03 KEV addition."
    sources:
      - { url: "https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability", publisher: "Picus Security (Umut Bayram, discoverer; last updated 2026-11-05)", date: "2026-11-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html", publisher: "The Hacker News", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: The Hacker News feed https://feeds.feedburner.com/TheHackersNews (item 'Installing the Fix for an Exploited WordPress Flaw Can Expose Some Sites One Last Time', 2026-11-06 21:38) -> pivot: https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html -> primary: https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability"
    summary: |
      Picus Security's Umut Bayram, who found the race, shows that the update which installs the fix still unpacks its files using the site's old, unpatched code. On a site on 5.9 or later that old code names the staging folder under wp-content/upgrade after the downloaded file, so the path is predictable (for example wp-content/upgrade/wordpress-7.1.4 on a 7.0.7 to 7.1.4 update) during that one update. The part of the fix that stops the live wp-config.php being overwritten already works in that update, because the copy step runs the new code, but an attacker who reaches the staged installer can still set it up with their own database, log in to the temporary copy and run PHP with the web server's permissions before the folder is deleted, from where the live site's files can be read or written. Exposure depends on the package: complete packages always carry the installer files, partial packages only if they happen to contain them; The Hacker News found the WordPress.org update service offered a partial package for in-branch updates such as 7.1.3 to 7.1.4, including for automatic updates, and only complete packages for moves from an older branch such as 7.0.7 to 7.1.4. After 7.1.4 or a branch fix is installed, later updates use a random folder name.
      Picus's first recommendation, before updating: stop the web server serving wp-content/upgrade at all (WordPress reaches the folder through the filesystem, so blocking it does not break updates), confirm that /wp-content/upgrade/ answers 403, then update to 7.1.4 or the branch's fixed release; do not place an .htaccess file inside the folder because the old updater empties it before unpacking.
    region_nexus: "global; every WordPress site with web-reachable wp-content/upgrade"
    primary_sector_nexus: "direct: cantonal and communal sites run on WordPress; CISA lists the flaw as exploited"
    sector: "public-sector"
    cves: [CVE-2026-119977]
    techniques: [T1190, T1505.003]
    affected_products: ["WordPress core"]
    entity_keys: ["product:wordpress-core"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    suggested_classification: "B2 (discoverer's research plus independent press check of the update service; no reported exploitation of the update-window variant)"
    evidence:
      - quote: "This is why the first update from an unpatched release to a fixed one must be handled carefully. Only after 7.1.4 is installed do later updates use a random staging directory."
        attribution: "Picus Security (Umut Bayram)"
        source_url: "https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability"
      - quote: "Denying web access to this directory makes the temporary installer unreachable, regardless of whether the staging path is predictable, and it does not break the update process."
        attribution: "Picus Security (Umut Bayram)"
        source_url: "https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability"
      - quote: "The researcher advises blocking web access to the site's wp-content/upgrade folder before updating."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"
    extended_notes: |
      Detection: web server access logs for requests to /wp-content/upgrade/ paths (especially the staged wp-admin/setup-config.php and install steps) at any time; a new administrator account or an unexpected plugin upload after an update window is the post-compromise sign.
      Action candidate for the entry's actions[]: block /wp-content/upgrade/ in the web server (nginx 'location ^~ /wp-content/upgrade/ { deny all; }', Apache 'Require all denied', or an .htaccess RedirectMatch 403 in the WordPress root, never inside the folder) before running the update on any site still below 7.1.4 or its branch fix, and confirm the 403.

