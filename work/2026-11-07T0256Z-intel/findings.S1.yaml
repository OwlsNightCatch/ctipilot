  # ---------------------------------------------------------------------------
  # N4. UNC6671 / vishing data extortion -- restatement with two new authority sources (update-of)
  # ---------------------------------------------------------------------------
  - title: "UPDATE UNC6671 help-desk vishing extortion: the Canadian Cyber Centre alert AL26-028 (2026-10-28) and eSentire's advisory (2026-11-03) restate the campaign against legal, healthcare and financial targets, with Teams as a contact channel and a Zoom remote-control step"
    suggested_priority: notable
    novelty: "update-of:2026-08-07/unc6671-blackfile-multi-brand-passkey-vishing-aitm"
    update_target: "2026-08-07/unc6671-blackfile-multi-brand-passkey-vishing-aitm"
    update_type: update
    update_fields: [summary, sources, evidence, body]
    update_notes: "Restatement of a covered campaign; the delta is two further sources, one a national authority. The existing entry already carries the AiTM, MFA-registration and SharePoint exfiltration mechanics (2026-05-16 and 2026-08-07 entries). The CCCS alert is dated 2026-10-28 (outside the window) and found through eSentire's outbound links; eSentire's own advisory is within the 145 h lookback of the esentire record. The page's own outbound citation names GTIG's UNC6671 blog (already the entry's basis)."
    lookback: true
    borderline: true
    borderline_reason: "Low-delta restatement. Kept only because a government authority (CCCS) now publishes the same help-desk vishing campaign with Teams, office phones and personal mobiles as contact channels and detection/hardening advice a Swiss M365 tenant can use."
    sources:
      - { url: "https://www.cyber.gc.ca/en/alerts-advisories/al26-028-ongoing-help-desk-voice-phishing-campaign-targeting-canadian-organizations", publisher: "Canadian Centre for Cyber Security (AL26-028)", date: "2026-10-28", role: "primary" }
      - { url: "https://www.esentire.com/security-advisories/increase-in-impersonation-vishing-attacks-leading-to-data-extortion", publisher: "eSentire Threat Response Unit", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: eSentire security advisories listing (WebFetch https://www.esentire.com/security-advisories, item 'Increase in Impersonation Vishing Attacks Leading to Data Extortion', 2026-11-03) -> pivot: WebFetch of https://www.esentire.com/security-advisories/increase-in-impersonation-vishing-attacks-leading-to-data-extortion (outbound links) -> primary: https://www.cyber.gc.ca/en/alerts-advisories/al26-028-ongoing-help-desk-voice-phishing-campaign-targeting-canadian-organizations (fetched with extract; GTIG blog https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments read and confirmed already in the store)"
    summary: |
      The Canadian Cyber Centre's alert AL26-028 of 2026-10-28 says a financially motivated actor is running an ongoing help-desk vishing campaign against Canadian organizations, increasingly legal and financial since July and concentrated on the legal sector in October, with callers posing as internal IT and claiming an urgent passkey migration, MFA enrolment or password change; calls may reach personal mobiles, office phones or Microsoft Teams, may spoof help-desk numbers, and the callers may end the call if the employee tries to verify. The victim is sent to an organisation-branded adversary-in-the-middle sign-in page that relays credentials and MFA responses to the real identity provider; afterwards the actor registers attacker-controlled MFA methods or devices, deletes password-reset, MFA-change and security notifications, resets passwords for non-SSO applications, uses scripts and Microsoft Graph to take data from Microsoft 365 and connected SaaS, and sends extortion demands. The Cyber Centre says the tradecraft matches publicly reported operations of one actor and the lure domains rotate often enough to limit blocklists.
      eSentire's Threat Response Unit (2026-11-03) says it sees an increase in vishing leading to data extortion against legal, healthcare and financial-services organizations, matching the Canadian alert and Google's UNC6671 reporting, with additional detail the base entry lacks: in one case 127 employees were contacted within one hour from the same number, OneDrive data was taken in under ten minutes, other cases moved data to Google Drive, and one user was persuaded during a Teams call to grant remote control through Zoom. eSentire's page was read through WebFetch's summariser; treat its case details as that summary.
    region_nexus: "global; Canada-focused alert, sectors legal, healthcare, financial services"
    primary_sector_nexus: "indirect: M365/Teams tenants of public administrations share the contact channels and the MFA-registration step"
    sector: "public-sector"
    cves: []
    techniques: [T1566.004, T1556.006, T1078.004, T1567]
    affected_products: ["Microsoft Teams", "Microsoft 365", "Microsoft Entra ID"]
    entity_keys: ["actor:unc6671", "product:microsoft-entra-id"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    suggested_classification: "B2"
    evidence:
      - quote: "The campaign bypasses conventional multi-factor authentication (MFA) through real-time relay and frequently rotates lure domains, limiting the effectiveness of blocklists."
        attribution: "Canadian Centre for Cyber Security (AL26-028)"
        source_url: "https://www.cyber.gc.ca/en/alerts-advisories/al26-028-ongoing-help-desk-voice-phishing-campaign-targeting-canadian-organizations"
      - quote: "Calls may target personal mobile phones, office phones or Microsoft Teams, and may spoof legitimate help desk numbers."
        attribution: "Canadian Centre for Cyber Security (AL26-028)"
        source_url: "https://www.cyber.gc.ca/en/alerts-advisories/al26-028-ongoing-help-desk-voice-phishing-campaign-targeting-canadian-organizations"
    extended_notes: |
      Detection: new MFA method or device registrations shortly after a help-desk-themed contact, deletion of security-notification mail, scripted or high-volume SharePoint/OneDrive access through Microsoft Graph by a newly authenticated session (Entra sign-in logs, M365 unified audit log, mailbox rules). Hardening (CCCS): phishing-resistant MFA (FIDO2, device-bound passkeys), Conditional Access requiring managed devices, restricted external Teams contact, independent callback verification of IT requests.

