    discovery_trace: "first seen at: kev-window.txt NOT COVERED row + python3 tools/fetch_source.py cisa-kev (catalogue 2026.11.06, dateAdded 2026-11-06, only addition in window) -> primary: KEV notes field URL https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014 (SPA; extract returned the text but not the affected/fixed tables) -> pivot: the SPA's own bundle names psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0014, fetched with `url --direct` (affected + fixed tables, credits, revision history) -> corroboration: ENISA EUVD exploited list https://euvdservices.enisa.europa.eu/api/exploitedvulnerabilities (EUVD-2026-118429), CISA alert https://www.cisa.gov/news-events/alerts/2026/11/06/cisa-adds-one-known-exploited-vulnerability-catalog (WebFetch), BleepingComputer https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/, runZero https://www.runzero.com/blog/sonicwall/"
    summary: |
      SonicWall advisory SNWLID-2026-0014 of 2026-11-06 covers seven SonicOS flaws on Gen7 and Gen8 firewalls, and one of them, CVE-2026-19868, is listed by CISA as exploited. It is an authentication enforcement weakness in the SSLVPN service (CWE-308, single-factor authentication): a user who holds valid credentials for an alternate authentication method can bypass the SAML authentication controls, which may also bypass SAML-enforced multi-factor authentication. SonicWall states the flaw only affects SSLVPN when SAML is enabled for SSLVPN logins. SonicWall says its PSIRT "investigated a report indicating potential exploitation"; CISA added CVE-2026-19868 to the KEV catalogue the same day "based on evidence of active exploitation" with a federal due date of 2026-11-20, and ENISA's EUVD marks it exploited since 2026-11-06. No source names an actor, a victim, a technique beyond the stated mechanism, or the scale; the catalogue entry marks ransomware use unknown.
      Affected: Gen7 hardware firewalls (TZ 270, 270W, 370, 370W, 470, 470W, 570, 570W, 570P, 670; NSa 2700, 3700, 4700, 5700, 6700; NSsp 10700, 11700, 13700, 15700) and Gen7 NSv 270/470/870 on ESX, KVM, Hyper-V, AWS and Azure up to and including SonicOS 7.3.3-7015, fixed in 7.3.4-7013 and higher; Gen8 hardware (TZ 80, 280, 280W, 380, 380W, 480, 580, 680; NSa 2800, 3800, 4800, 5800) and Gen8 NSv XS/S/M/L up to and including 8.2.2-8015, fixed in 8.2.3-8015 and higher. SonicWall lists no workaround; Gen6 and the SMA product lines are not listed in this advisory. The discoverer is Ryan Harris of The Electronic Office. The score differs by source: SonicWall's own vector is CVSS 3.1 7.1 (AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:L/A:N), while ENISA's record and runZero carry 7.5 (PR:N).
      The same advisory fixes six lower-profile flaws that no source reports as exploited: CVE-2026-107155 (permissive cross-domain policy) and CVE-2026-107154 (session validation, CWE-291 reliance on IP address for authentication) in the management interface, both 8.8 with user interaction required and credited to Pentest-Tools.com; CVE-2026-82308, a pre-authentication heap overflow in the SSL-VPN service (7.5, denial of service); CVE-2026-77708 and CVE-2026-77709, pre-authentication stack and heap overflows in the TACACS+ client (5.9, denial of service); and CVE-2026-19703, weak password hashing on virtual appliances (5.2, needs local access). It is a different product line from the SMA1000 flaws already covered (2026-10-08 entry) and from the end-of-life GMS entry of 2026-11-05.
    region_nexus: "global; SonicWall Gen7/Gen8 firewalls with SAML-based SSL VPN. No Swiss-specific reporting yet (NCSC-CH Security Hub has no post on it at 2026-11-07 03:00Z)."
    primary_sector_nexus: "indirect: perimeter VPN of the kind public administrations run; exposure depends on SAML being enabled for SSLVPN logins"
