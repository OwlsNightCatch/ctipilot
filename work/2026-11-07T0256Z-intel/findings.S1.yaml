      - quote: "Chained together, these issues let an unauthenticated remote attacker run code with the privileges of the Plex Media Server process."
        attribution: "Plex (security announcement)"
        source_url: "https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319"
    extended_notes: |
      Exposure: Plex Media Server 1.43.2 or earlier reachable from the internet (Remote Access enabled, port 32400 forwarded or opened by UPnP); version is shown in Plex Web under Settings > General.
      Detection: after patching, look for what Plex itself lists: child processes of the Plex Media Server process that nobody installed (miner- or proxy-style names), unfamiliar shared-object or DLL files in the Codecs folder, transcoder options in Preferences.xml that the owner did not set, sustained high CPU with nothing playing, and outbound connections from the Plex host to proxy-service infrastructure. Telemetry classes: process creation with Plex as parent, file creation in the Plex Codecs directory, egress traffic from the NAS or server.
      Triage: Plex legitimately loads codecs and spawns the transcoder; the discriminator is a shared object that was written by a transcode request rather than installed with the app, and a process the transcoder does not normally start.
      Hardening: update to 1.43.3.10861 or later, turn Remote Access off if unneeded, do not forward 32400 (use a VPN), rebuild a possibly compromised host from a clean install and rotate Plex and NAS credentials; Plex adds that anything the Plex service account could reach (mounted shares, stored credentials) should be treated as exposed.
      Prior dispositions: 2026-10-21/22 fires borderline-dropped (consumer product, no public-sector deployment shown); G1 audit 2026-10-25 concurred. Rescana's link to the AISURU proxyware botnet is a single secondary vendor claim and is not carried here.

