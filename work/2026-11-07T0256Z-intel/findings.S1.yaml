  - title: "CVE-2026-19868, SonicWall SonicOS SSLVPN: a user with valid credentials for another authentication method bypasses SAML, MFA included; SonicWall investigated a report of exploitation and CISA lists it as exploited (Gen7 up to 7.3.3-7015, Gen8 up to 8.2.2-8015)"
