- code: F3
  category: claim-not-supported
  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "headline, title, cves[CVE-2026-111497].affected, Exposure line, affected_products (claims 022f4ea785, c0809790f0, 9839bd780e)"
  url_or_quote: "headline: \"Brotli flaw reaches Desigo CC, Industrial Edge, Mitel MiVoice and OpenScape, Cisco Duo; several fixes still pending\"; affected: \"Cisco Duo Network Gateway and RoomOS below the builds Cisco lists\""
  summary: "(low confidence) Residual of iteration-4 F3. https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u covers four CVEs (CVE-2026-111497, -105482, -105483, -106069) in one 'Impacted Products with Software Fixes' table with no CVE column ('Duo Network Gateway 3.4.2', RoomOS 'On-premises: 11.41.2.3 26.7.4.3'); the page says the bug IDs carry platform-specific information and never states that Duo Network Gateway or RoomOS bundle the Brotli decoder. The remediation hedged the summary ('without saying which of its CVEs each fix addresses') and the Cisco fixed text ('not tied to one CVE'), but the headline and title still assert the Brotli flaw reaches Cisco Duo and RoomOS, cves[].affected and the Exposure line still list them as affected by this CVE, so the entry contradicts its own summary. Fix: word headline, title, affected and Exposure as 'Cisco lists Duo Network Gateway and RoomOS in its combined Node.js and Brotli advisory' (or drop Duo and RoomOS from the Brotli-specific affected text)."
- code: F3
  category: claim-not-supported
  section: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
  item: "update 2026-11-07T03:52:19Z, summary, record summary, evidence[] Previdian quote (claims b48d66b6c9, 231d797fff, d6b5cc41a7)"
  url_or_quote: "\"Previdian's page for CVE-2026-123158 says its sensors observed 14 exploitation attempts from 9 addresses in 8 countries, first and last observed on 2026-11-06\""
  summary: "(low confidence) https://previdian.com/CVE-2026-123158, fetched in this iteration, now says 'Previdian sensors have observed 15 exploitation attempts, 10 unique attacker IPs, and 8 countries ... First observed Nov 06, 2026; last observed Nov 07, 2026' (page 'Updated 07 Nov 2026'). The composer's saved body and the earlier iterations read 14 / 9 / last observed 2026-11-06, so the figures were right when read and the live counter has moved; the update section, entry summary, record summary ('all on 2026-11-06') and the evidence quote ('14 exploitation attempts, 9 unique attacker IPs') no longer match the cited page. Fix: give the figures an 'as read on 2026-11-07' qualifier (or refresh to 15 / 10 and 'last observed 2026-11-07'); it is a live counter, so the qualifier matters more than the number."
- code: F8
  category: needs-more-research
  section: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
  item: "body **Triage:** line (residual of iteration-4 F8 #2)"
  url_or_quote: "\"**Triage:** Cisco's own discriminator is the mail_logs pattern `COPY.*TO PROGRAM`; any hit is evidence of attempted or successful SQL-injection exploitation and warrants full incident response\""
  summary: "(low confidence) The remediation added the clean-grep caveat to actions[1], immediate_action and the record summary ('a clean result does not rule out the S/MIME injection, which did not leave that pattern in the module author's reproduction'; PR 22024: the ECS SQLi 'was the only one that generated this matching IOC'), but the Triage line the finding named and the new body section carry no such sentence. The Triage line is read field by field by triage agents, and the section only implies the point. Fix: append one clause to the Triage line (or the section) that a clean mail_logs result does not exclude use of the S/MIME injection."
- code: F11
  category: editorial-advisory
  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "tags and cves[CVE-2026-111497].status vs summary"
  url_or_quote: "tags: [vulnerabilities, rce, pre-auth, cisa-kev, poc-public, patch-available, no-patch]; summary: \"CISA lists the flaw as exploited\""
  summary: "(low confidence) The summary and body say CISA lists the flaw as exploited ('based on evidence of active exploitation', CISA alert of 2026-10-27, KEV record read this iteration), yet status carries no 'exploited' and the tags carry no 'actively-exploited'. The two sibling entries on the same CVE (2026-10-24 node2shell, 2026-10-26 Microsoft .NET) carry [exploited, cisa-kev ...] and 'actively-exploited'. A machine consumer filtering on those fields misses this entry. Fix: add exploited and actively-exploited, or leave as is if the omission is deliberate because Cisco reports no malicious use against its products (then say so in sourcing_note)."
- code: F11
  category: editorial-advisory
  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "summary, Cisco clause"
  url_or_quote: "\"Cisco's combined advisory lists Duo Network Gateway (3.4.2) and RoomOS among products with fixes dated up to 2027\""
  summary: "Reads as if the Duo Network Gateway and RoomOS fixes are dated up to 2027. In the Cisco table Duo Network Gateway 3.4.2 and RoomOS on-premises 11.41.2.3 / 26.7.4.3 carry no date; the dates (November 2026 to July 2027, for example Catalyst Center 3.4.1 July 2027) belong to other products, as the body says correctly. Fix: 'lists Duo Network Gateway (3.4.2) and RoomOS among its products with fixes, a longer list of which is dated up to July 2027'."
- code: F11
  category: editorial-advisory
  section: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "body **Defender takeaway:** first clause"
  url_or_quote: "\"install the current .NET updates on every Desigo CC host, where Common Configurator runs, remove the Industrial Edge Management Applications or stop it on Edge devices until Siemens ships a fix\""
  summary: "The relative clause 'where Common Configurator runs' sits after 'Desigo CC host', so it reads as if Common Configurator ran on Desigo CC hosts; Common Configurator is an Industrial Edge application (SSA-443410), and 'remove the Industrial Edge Management Applications' is not scoped to the one application Siemens attaches the uninstall mitigation to. Fix: split into two sentences, one for Desigo CC and one for Industrial Edge instances that run Common Configurator."
- code: F11
  category: editorial-advisory
  section: runs/2026-11-07/2026-11-07T0256Z-intel.md
  item: "Verification & coverage notes, 'Contradiction handling' bullet"
  url_or_quote: "\"so the Cisco record says Rapid7's mapping is the author's belief and does not say whether the exploited injection is the one the module uses\""
  summary: "Second half of iteration-4 F4 left over: the Updates bullet now names both modules, but this bullet still speaks of 'the module' in the singular, while the entry's sourcing_note says Cisco 'does not say which flaw either module uses' and the ECS module maps to CVE-2026-76461 only at the author's medium confidence. Fix: 'either module'."
