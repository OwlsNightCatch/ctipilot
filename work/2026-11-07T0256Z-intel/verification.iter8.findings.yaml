- code: F14
  category: quantifier-without-source
  section: threat
  item: "2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan (Exposure line, claim 0ea038ec85)"
  url_or_quote: "Entry: \"TRU reports the three emergency-services cases as the gravest confirmed harm.\" Source https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/ : \"The gravest confirmed harm was the targeting of emergency-services data: patient-care records and dispatch case information from an organization that serves millions of residents.\""
  summary: "TRU names two kinds of gravest harm (patient-care records, dispatch case information); the page nowhere counts three emergency-services cases, and the fire-dispatch vendor's default-credential panel appears in TRU's financial-sector paragraph without a gravity ranking. The entry's own summary lists two cases. Fix: say 'the patient-care and dispatch records' or drop the count."
- code: F2
  category: generic-url
  section: vulnerability
  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce (sources[] primary, claim 1e86952489)"
  url_or_quote: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  summary: "(low confidence) The cited page is the whole-catalogue KEV JSON feed (1,769 entries, version 2026.11.06 when fetched), a listing rather than a per-CVE page; the record for CVE-2026-76461 is in it (dateAdded 2026-09-14, forensicTriage Yes) so the claim is supported, but the same pattern was ruled F2 on the Brotli entry in iteration 1. A per-CVE page exists and was fetched this iteration: https://www.cisa.gov/news-events/alerts/2026/09/14/cisa-adds-one-known-exploited-vulnerability-catalog (it does not carry the forensic-triage flag, so the JSON may stay as a second source). The citation predates this run's record."
- code: F8
  category: needs-more-research
  section: vulnerability
  item: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole (body, claim 0880960c27 and the Exposure line)"
  url_or_quote: "Entry: \"On Alpine's official AWS and Azure images the passwordless account is the default alpine user, which can run doas without a password, so the bypass chains to root there\". Alpine advisory https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/ : \"The official tiny-cloud images ... ship an `alpine` user with a `*` password field and passwordless `doas`. They are safe on first boot. They become exploitable as soon as any `$6$` hash exists on the machine\" and, under not affected, \"Cloud images configured through cloud-init, which writes `PasswordAuthentication no`\"."
  summary: "(low confidence) The entry cites Alpine's advisory elsewhere but drops its cloud-image precondition, which is the discriminator a defender needs to tell which Alpine cloud instances are exposed (a local $5$/$6$ hash on the box and cloud-init not having disabled password login). The preceding OX-sourced condition list partly covers it, so the chain-to-root sentence reads conditional only to a careful reader. Fix: add one clause with Alpine's tiny-cloud caveat to Exposure."
- code: F11
  category: editorial-advisory
  section: updates
  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (section 2026-11-07T03:53:29Z and its record summary; claims fcf6e9f82d, 9cc12016e1, e7bc27a39f)"
  url_or_quote: "NCSC post 13054: \"Review refrigeration management systems across all relevant operations, including equipment managed by external service providers. ... Provide remote access through a secure VPN or protected network.\" Ransom-ISAC: \"Between approximately 03:15 and 03:21, the same source made 588 parameter writes across 26 devices. That is about 1.6 writes per second, a pace more consistent with a script or a bulk-programming function than with manual edits.\""
  summary: "(low confidence) Paraphrase drift, no decision changes (already raised as iteration-7 advisory and declined): the section says 'across all operations' and 'allow remote access only through', the record summary says 'any cooling plant', and the scripted-pace reading is attached by the relative clause to both bursts although Ransom-ISAC states it for the 588-write burst only."
