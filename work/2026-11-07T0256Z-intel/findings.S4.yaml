  - title: "ChimeraZ forum sales aimed at Switzerland: Solnet and Destination Davos Klosters confirm real data was taken, while the four communes of Ebikon, Gersau, Meggen and Wil say the offered sample is public open-data content and no intrusion occurred"
    sources:
      - { url: "https://www.inside-it.ch/derselbe-hacker-verkauft-erneut-schweizer-daten-20261106", publisher: "Inside IT (Derselbe Hacker verkauft erneut Schweizer Daten)", date: "2026-11-06", role: "primary" }
