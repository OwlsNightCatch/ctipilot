    discovery_trace: "first seen at: backlog row (b) of the S4 spawn message, URL https://frenchbreaches.com/alertes/ebikon-gersau-meggen-et-wil-suisses-mvwolian3fkl2e1adtg (extract resolved it to the canonical https://frenchbreaches.com/alertes/suisse-fuite-donnees-quatre-communes-ebikon-gersau-meggen-wil-mvwolian3fkl2e1adtg) -> WebSearch (\"Gemeinde Ebikon Gersau Meggen Wil Websites Hackerangriff Daten\", no on-point hit) -> extract of the inside-it.ch front page, URL https://www.inside-it.ch/ (teaser 'Derselbe Hacker verkauft erneut Schweizer Daten', article hrefs read from `url --direct`) -> primary: Inside IT, URL https://www.inside-it.ch/derselbe-hacker-verkauft-erneut-schweizer-daten-20261106 (full body read from the embedded article JSON, the lede only is visible to extract because of the paywall) -> pivot: Inside IT Solnet article, URL https://www.inside-it.ch/provider-solnet-schildert-datenabfluss-20261104"
    summary: |
      Inside IT reports that one forum pseudonym offered three Swiss data packages for sale, and the victims' own statements split them into two confirmed incidents and one non-incident. French Breaches had flagged the commune listing on 2026-10-31 under the handle ChimeraZ as a credible but unconfirmed claim, noting that the visible sample resembled municipal event-calendar content that is public anyway.
      Solnet, a Solothurn internet and solution provider: the seller claims about 6,800 entries on 5,000 people (customer data, transactions, failed logins). CEO Erich Hohermuth confirms that the published sample comes from log files of Solnet's webmail service, containing e-mail addresses, recipients, subject lines and connection data, with passwords only masked; he says an investigation found unauthorised access to the webmail send logs through a gap, covering 13 to 31 October 2026. He rules out the PHP2Shell flaw (a security update was applied the same day it became known, 21 October), says Solnet does not know who obtained the data or holds it, and says the Federal Office for Cybersecurity (BACS) and Switch-CERT drew attention to the listing. Affected customers were told on 2 November, the webmail environment was rebuilt, externally reviewed and back in operation since 2 November, and customers were advised to change their mail password and enable multi-factor authentication; Solnet sees no sign of mailbox or other system takeover.
      Destination Davos Klosters, the cooperative behind the davos.ch tourism site: the seller claims about 19,600 people, mainly names, postal addresses and phone numbers, 13,000 of them in Switzerland. The organisation says it has known of the listing since 2 November, that the data date from April 2026 and must be assumed real (first name, last name, address, place, phone; no passwords, e-mail addresses or payment data), that it cannot tell who is affected because the data set holds tens of thousands more records, and that the PHP flaw was not the route. It says its developers identified and fixed the gap on Monday 2 November and that the federal data protection commissioner (EDÖB) was notified.
      Ebikon (LU), Gersau (SZ), Meggen (LU) and Stadt Wil (SG): the seller claims 8,900 entries on about 5,000 people. The head of Stadt Wil's communications office answers for all four: their IT provider Seantis analysed the samples and found exclusively public data retrievable through the public, documented Open Government Data API, mostly entries of the public event calendar entered by the organisers themselves; no cyber incident is known to the communes, there was no direct contact from criminals, Seantis found no anomaly on its servers, the admin.digital solution is not written in PHP, and there are no indications of unauthorised access or data outflow. No source states how the Solnet logs or the Davos records were obtained.
    extended_notes: |
      Backlog row (b) disposition: Ebikon, Gersau, Meggen and Wil are NOT confirmed as an intrusion (the communes answered and explained the data as public open-data API content) so that part of the hold is closed as a non-incident; davos.ch is confirmed by the victim (Destination Davos Klosters, verified as the operator of davos.ch from the site metadata); the Belgian rescue zone Hainaut-Est (ZOHE) is still unconfirmed, no source mentioning it was found in French searches, keep the row to its 2026-11-17 expiry. The same pseudonym is the registry's actor:chimeraz (French SDIS fire-and-rescue campaign, Aveyron OnRecrute); Inside IT says 'unter demselben Pseudonym' for the three listings but does not itself name the handle, French Breaches names ChimeraZ for the commune listing only.
      Defender angles. Exposure: Solnet webmail customers (public bodies that use a Solnet mailbox included, if any) should treat recipients, subject lines and connection metadata of mail sent 13 to 31 October as known to the criminal; the realistic follow-on is phishing or replies that quote real subject lines, so mail-flow monitoring for look-alike threads to those recipients is the hook, plus a password change and MFA as Solnet itself advises. Triage: a sample of 'stolen' municipal data made of event titles, organiser names and phone numbers that are already on the public site, in JSON, is the discriminator for an OGD-API scrape rather than a breach; ask the data owner whether the same fields are retrievable from the public interface before opening an incident. The commune case is also the lesson that forum posts naming a PHP flaw or a government domain need that check before escalation.
      Sourcing: two Inside IT articles carrying direct victim statements plus French Breaches' independent review of the listing; the Inside IT article bodies are partly paywalled, the text used here was read from the page's embedded article data. Suggested rating B2. The Solnet article's URL date is 2026-11-04 (CEO interview 4 November), page metadata shows 2026-11-06.
