    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (`url` listing; entry 2026/11/05/015717 carried an update stamp of 2026-11-06 PM) -> pivot: Piyolog entry, URL https://piyolog.hatenadiary.jp/entry/2026/11/05/015717 -> primary: Alala/Paycloud joint notice, URL https://www.arara.com/news/info/20261106_arara and the third-report PDF read with `fetch_source.py pdf`, URL https://contents.xj-storage.jp/xcontents/AS71226/0d5f3847/6172/4bcc/bfab/73896dab795d/20261106211906670s.pdf -> context: Paycloud notice of 2026-10-22, URL https://www.paycloud.inc/news/info/20261022_paycloud"
    summary: |
      Alala Inc., a subsidiary of Paycloud Holdings (Tokyo), runs the bulk e-mail service Alala Message. A third party got into the service in late October 2026; the companies' joint notice of 2026-11-06 and Paycloud's third timely disclosure of the same day put the number of e-mail addresses taken, de-duplicated across three categories, at 81,329,467, of which about 34.3 million are address-only and about 47.0 million carry attributes such as name, sex, birth date, phone number, member number or address for some customers. Up to about 380 contracting companies are estimated affected (still under review), and between 28 and 30 October up to about 7.13 million mails posing as a credit-card company were sent through the service itself; the service holds no card numbers. All Alala Message services were stopped on 31 October and the restart date is undecided. Police, the Personal Information Protection Commission and the Kanto bureau of the Ministry of Internal Affairs and Communications (MIC) were told.
      As Piyolog reads the three reports: reconnaissance-like access on 27 October; on 28 October a third party logged in to the administration console of the shared environment and used its data-export function; between 28 and 31 October the attacker moved through the service's servers and the databases of 97 servers in contracting companies' environments were read; a second cloud environment ('B', 3.25 million address-only records, added in the third report) was reached with misused credentials in the same period. The first report blamed a web-server vulnerability in part of the environment, the second added problems in the system environment, and the companies say the start and route of the intrusion are still under investigation. Paycloud's notice of 2026-10-22 shows the group suspended or put into maintenance parts of its services on 21 to 22 October for the two critical PHP flaws (the PHP2Shell pair); no source ties the Alala intrusion to those flaws, so the timing is a hypothesis to check, not a finding.
      Public-sector exposure, per Piyolog's table of customer notices (customer pages not fetched in this run): MIC says 775 e-mail addresses and 21 names from an English-language newsletter that Alala handled for it were taken; Osaka Prefecture and Higashi-Osaka say an e-application provider's mail service was breached (press reports name Alala for Osaka); the towns of Eniwa and Tobe warned residents about suspicious mail from the vendor's sender. A sibling incident documented in Piyolog's separate summary: YumeLink's Cuenote service was compromised from 16 October through a library or program vulnerability plus a support-staff credential, followed by planted code, database export and session theft, and several municipalities suspended disaster-information and safety e-mail services.
    extended_notes: |
      PD-11 basis: global scale (81 million addresses, hundreds of corporate and public list owners), public-sector customers, and a transferable access-to-abuse chain (supplier admin console and export function, stolen account and key reused across 97 customer-environment servers, then the supplier's own sending identity used to phish at volume). No Swiss nexus is claimed; the lesson is for any Swiss body that sends newsletters, e-application confirmations or alert mails through a third-party mailer.
      Exposure: you are in scope if a vendor sends mail on your behalf from its own domain or infrastructure and holds your recipient lists (newsletters, citizen notifications, alert services, e-government application confirmations); the vendor's incident exposes your recipients' addresses even when your own systems are untouched, and the vendor's sending identity can then carry phishing that passes sender checks. Detection: mail-flow logs for inbound and outbound messages from your notification vendors' sender domains with unusual lure themes, sending times or volumes, and recipient reports of mail from a vendor they only know as a newsletter sender; check the vendor status page and ask for the vendor's own indicator guidance. Triage: ordinary newsletters from the same vendor are the benign lookalike; the discriminator is theme (card-statement style confirmation requests), timing (28 to 30 October here) and lists the recipient never registered for.
      Sourcing: company primary notices (A) with the numbers being the company's own estimates; the customer-by-customer facts come through Piyolog's compilation (B) and were not re-read at each customer. Suggested rating A2. Out of window note: the first report is 2026-10-29, the in-window facts are the 2026-11-06 third report, the joint notice and the Piyolog update.
