    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (item 'DigiCert data breach exposes customer information, identity documents', 2026-11-06, drilled via extract at https://databreaches.net/2026/11/06/digicert-data-breach-exposes-customer-information-identity-documents/) -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/digicert-data-breach-exposes-customer-information-identity-documents/ -> primary: DigiCert's CA-compliance incident report, URL https://bugzilla.mozilla.org/show_bug.cgi?id=2084460"
    summary: |
      DigiCert's own incident report to the Mozilla CA Program (full report due by 2026-11-03, last updated 2026-11-06) says an internal business system that archives information customer representatives supplied to validate their identity was moved on 2025-02-04 from a VPN-restricted segment to another availability zone, and that this migration inadvertently made it reachable externally. A self-registration feature meant for other applications became available on it; accounts created that way were not subject to the MFA DigiCert otherwise requires, got read-only mode by default and, through an authorisation flaw, could read archived data. DigiCert saw non-DigiCert accounts on 2026-06-18, learned of the account-creation path on 2026-06-21 from its managed security research programme, deployed an authorisation fix on 2026-07-02 without realising archived data had been read, first suspected data access on 2026-10-12 and confirmed on 2026-10-19 that one unauthorised account read a subset of archived data between 2026-06-27 and 2026-07-02.
      The records are mostly names, business e-mail addresses, phone numbers and business addresses of customer representatives, and for a small minority a customer-provided document such as a driver's licence, passport or utility bill. DigiCert says the access could not write records, act as a validation approver or issue certificates, that its CA services, CertCentral and DigiCert ONE were not affected, and that no action is needed on active certificates; customer notifications are going out and identification documents are still being reviewed to find who is affected. Remediation listed: self-registration disabled everywhere, all endpoints moved to private-IP load balancers, a security sign-off rule for network access changes on internal tools, least-privilege review, extra monitoring on file access and request volumes.
    extended_notes: |
      Why a borderline return: DigiCert is one of the largest public CAs and its customers include public bodies, but the scale is stated only as 'a small proportion' of archived data and nothing in the sources links a Swiss body. Transferable lesson (hence worth a short entry if shipped): an infrastructure migration silently exposed an internal tool, and a leftover self-registration endpoint combined with a missing authorisation check handed read access to whoever found it; the first handling treated it as an account-creation issue and not a data-access event, which is why the confirmation took until October.
      Exposure: any organisation that bought OV, EV, code-signing or document-signing validation from DigiCert and sent identity documents for its representatives may be in the affected subset; check for the DigiCert notification, expect targeted phishing or identity-fraud attempts that cite certificate orders or the named representatives, and brief those representatives. No certificate revocation or reissue is advised by DigiCert. Detection: for your own estate, the hook is configuration-change review for any workload moved between network segments (external reachability scan after each migration), and authentication-log alerts on newly self-registered accounts on internal tools.
      Sourcing: vendor primary (A) plus BleepingComputer; the incident report is self-reported to the browser root programmes. Suggested rating A1. Distinct from the registry's older incident:digicert-support-portal-2026 (a different event).
