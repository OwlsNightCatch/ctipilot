  - title: "Refrigeration attacks, controller-level evidence: Ransom-ISAC publishes the event log of a 2026-11-02 compromise of an internet-reachable Copeland XWEB Pro 1.9.0 (two external Administrator sessions, 743 parameter writes across 31 devices, alarm mutes, keypad locks, defrost commands) and says the default Administrator credentials were used"
    sources:
      - { url: "https://ransom-isac.org/blog/the-copeland-incident/", publisher: "Ransom-ISAC (The Copeland Incident)", date: "2026-11-06", role: "primary" }
    discovery_trace: "first seen at: ransom-isac, URL https://ransom-isac.org/blog/ (extract of the listing, newest post 2026-11-06) -> post href read from `url --direct https://ransom-isac.org/blog/` -> primary: Ransom-ISAC, URL https://ransom-isac.org/blog/the-copeland-incident/ (extract, full body). Context sources the post cites (CISA ICSA-26-057-10, Claroty Team82, Copeland bulletin) were not re-fetched in this slice: the existing entry already carries them."
    summary: |
      Ransom-ISAC (Massimo Giaimo and contributors) analyses a supplied event log from a commercial refrigeration site in Italy (labels translated from Italian, device names anonymised) whose Copeland XWEB Pro controller, reportedly running firmware 1.9.0, was reachable from a public address. The log shows two Administrator sessions from different external addresses in the early hours of 2 November 2026, the same night as the cold-room changes at the French blood service, but Ransom-ISAC states it has no evidence linking the case to NoName057(16), Z-Pentest Alliance or the French attacks.
      First session: a read sweep of parameters across 31 listed assets (display cases, freezer cabinets, cold rooms, central plant) about five minutes before the first change, then 588 parameter writes across 26 devices in roughly six minutes, about 1.6 writes a second, a pace Ransom-ISAC reads as scripted or bulk-programming. Second session about 25 minutes later: more reads, then 155 writes across five cold rooms. Totals: 743 parameter writes on 31 devices. Setpoints were moved to 110 and 150 degrees C, alarm limits and delays to outlying values (often 150 or 255), other control settings to zero and defrost intervals, termination values and modes altered; the log also records keypad-lock commands, alarm-mute commands (one failed with 'no valid function') and two defrost commands. Routine scheduler-originated 'sent device command' events appear in the same log and are not attacker activity.
      What it does not show: the log records administrator-level actions only, not how the attackers got in, the real temperatures reached, whether each write was accepted or persisted, or how long equipment ran unsafely. Ransom-ISAC says the controller was still on its default Administrator credentials so no exploit was needed; the post does not publish the evidence for that statement, and it names two critical XWEB Pro CVEs from CISA's advisory only as context ('does not prove that any specific published vulnerability was used'). Firmware 1.9.0 lies inside CISA's affected range (up to 1.12.1).
    extended_notes: |
      Update shape for 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack: the entry already says to confirm the factory Admin password on XWEB units and names exposure; the delta is the first public controller-log view of a compromise and the concrete alert patterns, all read from the controller's own event log. Sourcing is a single secondary-class lab (Admiralty C; the log is the site's, passed to Ransom-ISAC), so attribute every count and the default-credential statement to Ransom-ISAC.
      Detection (telemetry class: the controller or supervisor event log, forwarded off-device if the model allows): Administrator login from outside the approved management networks, or a second Administrator session from another address within the hour; a read sweep across most of the fleet right after a login (earliest signal, about five minutes ahead of the first write); bulk 'wrote parameters' events (more than about 20 a minute from one account, or writes to more than three devices in five minutes; the first session ran near 98 a minute); keypad-lock, alarm-mute or defrost-on commands that do not come from the scheduler; implausible values for setpoint (110/150) and alarm thresholds (150/255). Triage: scheduler-originated device commands and maintenance-window writes from a named contractor account are the benign lookalikes; the discriminator is source address, account (the shared Administrator), burst rate and the combination of extreme setpoints with muted alarms. Hardening named by the post: change the default Administrator password, remove public reachability and port forwarding, brokered VPN with MFA and named accounts, independent temperature monitoring that does not depend on the controller, offline configuration backups. Swiss relevance: the entry already records the first Swiss cases (a Köniz butcher, three Volg stores), so the same exposure check applies to any Swiss site that runs an XWEB or comparable supervisor reachable from the internet.
    region_nexus: "Italy (the logged site); campaign spans France, Germany, Benelux, Switzerland and others per the existing entry"
