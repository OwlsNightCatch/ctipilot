    summary: |
      Inside IT reports, from a customer e-mail it has seen, that the German software company Eye-Able detected unauthorised access to parts of its 'Eye-Able Dashboard' IT system on 2026-10-27, during which the attackers could temporarily reach certain customer and user data. Possibly affected are e-mail addresses, user-account information, company names and other information stored while using the platform; the notice does not say which data were actually viewed or copied. By Eye-Able's own account it recognised and stopped the attack the same day, attempts to delete data, change passwords or upload files failed, no further access has been seen since the morning of 28 October, external forensic and cybersecurity experts were engaged and the competent data protection authority was informed.
      Eye-Able sells accessibility overlays, audits and monitoring for websites; Inside IT names the disability association Procap Schweiz and Swiss Tennis as Swiss users and says the vendor lists Roche as a customer. The access route is not stated.
    extended_notes: |
      Borderline: a supplier whose overlay script and dashboard sit on many websites (the vendor's own homepage, which is not a citable source, claims over 20,000 and markets audit-ready reports for authorities; public-body customers in Germany exist but were not verified here), but single-source via a customer e-mail relayed by one outlet, the access vector is unknown, and the Inside IT piece (published 2026-11-05T09:53Z, about 41 h before this run) lies outside the 26 h window, inside the 72 h developing window. The vendor says upload attempts failed, which is the question that matters for any site embedding the overlay script: ask Eye-Able to confirm in writing that the delivered script and customer configuration were not altered, and check the integrity of the script your sites load. Exposure: Eye-Able dashboard accounts (webmaster and agency contact e-mail addresses) are the exposed population; expect phishing to those addresses; rotate dashboard passwords and enable MFA if offered. No technique mapped because no vector is stated.
