- code: F14
  category: quantifier-without-source
  section: file-system-access-api-browser-persistence-chrome-edge
  item: "Oneconsult on the File System Access API (2026-11-07 new entry), body paragraph 2"
  url_or_quote: "Oneconsult demonstrates five paths."
  summary: "Oneconsult states no count. Its 'Concrete Attack Paths' section has separate headings for exfiltration, VS Code extension, PowerShell profile, PowerShell module backdoor, public-desktop drops, SMB-share drops and (in a further section) the interactive file proxy, and its Mark-of-the-Web impact table lists six attack paths (VSCode extension, PowerShell profile, PowerShell module, public desktop drops, SMB new files, SMB existing scripts). The entry's 'five' is its own grouping (profile and module merged, SMB omitted). Fix: drop the number ('Oneconsult demonstrates several paths') or add the SMB-share path. Source: https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/ (claim 7f6edc7fb8)."
- code: F3
  category: claim-not-supported
  section: file-system-access-api-browser-persistence-chrome-edge
  item: "Oneconsult on the File System Access API (2026-11-07 new entry), Oz paragraph"
  url_or_quote: "says modifying signed files breaks their signatures ([Oz, 2026-07-05](https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/))"
  summary: "(low confidence) Oz's Technical Limitations section says 'Signed files, structurally complex files, very large files, or files protected by security products may fail, be blocked, or break in a way that prevents execution.' It does not say a modification breaks the signature. The sentence is also the unfixed run-on from iteration 1 finding 22 (no conjunction, comma-spliced 'only' clause). Fix: split into sentences and say signed files 'may fail, be blocked or break in a way that prevents execution'. Claim f6e2fa9b82."
