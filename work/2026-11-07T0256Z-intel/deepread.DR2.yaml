  - claim: 'ICTjournal (2026-11-06 update): first publicly disclosed successful attack on refrigeration installations in Switzerland - a butcher shop in Köniz; freezer temperature reportedly reached 70 degrees.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Un premier cas de cyberattaque réussie contre des installations frigorifiques a été rendu public en Suisse. Une boucherie de Köniz a été touchée, la température de ses installations de congélation ayant temporairement atteint 70 degrés.
    translation: A first case of a successful cyberattack on refrigeration installations has been made public in Switzerland. A butcher's shop in Köniz was hit, the temperature of its freezer installations having temporarily reached 70 degrees.
  - claim: 'ICTjournal, citing SRF: victim named as Lüthis Fleischwaren in Köniz (canton of Bern).'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Dans la commune bernoise de Köniz, la boucherie Lüthis Fleischwaren a été prise pour cible,
    translation: In the Bernese municipality of Köniz, the butcher Lüthis Fleischwaren was targeted,
  - claim: 'ICTjournal, citing SRF and the company''s customer notice: hackers manipulated the electronic control systems; the shop disconnected the installations from the network and temporarily closed.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: des pirates ont manipulé les systèmes de commande électroniques de ses installations de réfrigération et de congélation. La boucherie a alors déconnecté les installations du réseau et fermé temporairement son point de vente.
    translation: hackers manipulated the electronic control systems of its refrigeration and freezer installations. The butcher then disconnected the installations from the network and temporarily closed its point of sale.
  - claim: 'ICTjournal, citing SRF: owner says the freezer room reached 50 to 70 degrees; some meat appeared cooked.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Selon le propriétaire, la température à l'intérieur de la chambre de congélation a grimpé jusqu'à 50 à 70 degrés.
    translation: According to the owner, the temperature inside the freezer room climbed to 50 to 70 degrees.
  - claim: 'ICTjournal: SRF calls it the first such case made public in Switzerland.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Qui ajoute qu’il s'agit du premier cas de ce type rendu public en Suisse.
    translation: Who adds that it is the first case of this kind made public in Switzerland.
  - claim: 'ICTjournal (2026-11-03 news): Coop Switzerland attempted attacks on its refrigeration installations were unsuccessful, per its spokeswoman to 20 Minuten.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: En Suisse, Coop a également enregistré des tentatives d’attaque visant ses installations frigorifiques,
    translation: In Switzerland, Coop also recorded attempted attacks on its refrigeration installations,
  - claim: 'ICTjournal: Coop attempts did not succeed.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Ces tentatives n’ont toutefois pas abouti.
    translation: These attempts did not, however, succeed.
  - claim: 'ICTjournal: French blood-collection sites targeted from Monday 2 November 2026; EFS confirmed Wednesday.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Dès le lundi 2 novembre 2026, plusieurs établissements de collecte de sang en France ont également été visés par des cyberattaques.
    translation: From Monday 2 November 2026, several blood-collection establishments in France were also targeted by cyberattacks.
  - claim: 'ICTjournal: second wave reached Germany, Italy, UK and Romania on Tuesday 3 November.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Mardi 3 novembre 2026, des enseignes de distribution en Allemagne, en Italie, au Royaume-Uni et en Roumanie ont à leur tour été visées.
    translation: On Tuesday 3 November 2026, retail chains in Germany, Italy, the United Kingdom and Romania were in turn targeted.
  - claim: 'ICTjournal (citing The Guardian): wave now touches shops in nearly a dozen European countries.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: La vague de cyberattaques contre les installations frigorifiques des supermarchés touche désormais des magasins dans près d'une douzaine de pays européens,
    translation: The wave of cyberattacks against supermarket refrigeration installations now affects shops in nearly a dozen European countries,
  - claim: 'ICTjournal: ICA stores concerned were linked to an external refrigeration-control system supplied by Danfoss (per Le Temps/AFP).'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: les magasins ICA concernés étaient reliés à un système externe de contrôle de la réfrigération fourni par le fabricant danois Danfoss.
    translation: the ICA stores concerned were linked to an external refrigeration-control system supplied by the Danish manufacturer Danfoss.
  - claim: 'ICTjournal: Belgian contractor says attackers remotely activated defrost mode; Belgian prosecutors opened an investigation; no link established with the October French attack at that stage.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: D'après Sabcobel, les attaquants auraient activé à distance le mode dégivrage des installations. Le parquet belge a ouvert une enquête. À ce stade, aucun lien n'a été établi entre ces perturbations et l'attaque survenue en France en octobre.
    translation: According to Sabcobel, the attackers reportedly remotely activated the installations' defrost mode. The Belgian prosecutor's office opened an investigation. At this stage, no link has been established between these disruptions and the attack in France in October.
  - claim: 'ICTjournal: EFS said it was not directly targeted; alarms triggered quickly, no blood products lost.'
    source_url: https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-2.md
    passage: Les systèmes d'alarme des équipements concernés se sont rapidement déclenchés, évitant toute perte de produits sanguins.
    translation: The alarm systems of the affected equipment triggered quickly, avoiding any loss of blood products.
  - claim: 'Ransom-ISAC summary (page description): two Administrator sessions on an internet-exposed Copeland XWEB Pro 1.9.0 read settings across 31 devices, then 743 parameter writes, alarm mutes, keypad locks and defrosts, on 2 November 2026.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: On 2 November 2026, two Administrator sessions on an internet-exposed Copeland XWEB Pro 1.9.0 refrigeration controller read settings across 31 devices, then made 743 parameter writes, muted alarms, locked keypads and triggered defrosts.
  - claim: 'Ransom-ISAC: firmware version and exposure are ''reportedly'' - the controller was reportedly running X-Web Pro 1.9.0 and reachable via a public address.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The controller was reportedly running X-Web Pro 1.9.0 and was reachable through a public internet address.
  - claim: 'Ransom-ISAC: 1.9.0 is older than the affected-version ceiling in CISA''s advisory (1.12.1 and earlier).'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Version 1.9.0 is older than the affected-version ceiling in CISA’s advisory (1.12.1 and earlier), so it falls within the stated affected range for the covered XWEB Pro models.
  - claim: 'Ransom-ISAC: default-credential statement #1.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: 'Other evidence shows the way in: the controller still used its default Administrator credentials, so no exploit was needed.'
  - claim: 'Ransom-ISAC: default-credential statement #2.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: In this incident, the Administrator sessions came through the default credentials, so none of these vulnerabilities was needed.
  - claim: 'Ransom-ISAC: what the log does NOT show - exploit or access path - and no proof that any published CVE was used.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: That does not prove that any specific published vulnerability was used in this incident.
  - claim: 'Ransom-ISAC: log records only administrator-level actions.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The event log only records administrator-level actions, not the exploit itself or how the attackers got in.
  - claim: 'Ransom-ISAC: no public PoC known for the two named XWEB CVEs.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: At the time of writing, no public proof-of-concept exploit is known for either vulnerability.
  - claim: 'Ransom-ISAC: first session, 588 parameter writes across 26 devices in about six minutes.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Between approximately 03:15 and 03:21, the same source made 588 parameter writes across 26 devices.
  - claim: 'Ransom-ISAC: pace about 1.6 writes per second, consistent with a script or bulk-programming function.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: That is about 1.6 writes per second, a pace more consistent with a script or a bulk-programming function than with manual edits.
  - claim: 'Ransom-ISAC: second session, 155 further writes on five cold rooms; total 743 writes affecting 31 devices.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: After another sequence of parameter reads, that session made 155 further writes across five cold rooms, between approximately 03:42 and 03:44. In total, the log records 743 parameter writes affecting 31 devices.
  - claim: 'Ransom-ISAC: reconnaissance sweep over 31 listed assets precedes the writes.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The account spent the next several minutes reading device parameters across 31 listed refrigeration assets.
  - claim: 'Ransom-ISAC: setpoints pushed to 110 and 150 degrees C.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Across multiple refrigeration assets, setpoints were moved from ordinary cold-storage values to extreme values, including 110°C and 150°C.
  - claim: 'Ransom-ISAC: alarm thresholds and delays pushed to outlying values.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Alarm thresholds, limits, and delays were also pushed to outlying values, often 150 or 255, while other control settings were reduced to zero.
  - claim: 'Ransom-ISAC: direct alarm-mute and keypad-lock commands.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The log also records direct commands to mute alarms and lock local keypads on a number of units.
  - claim: 'Ransom-ISAC: only two defrost commands; one alarm-mute failed; others only ''potentially successful''.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Two refrigerated island units received defrost commands. One alarm-mute attempt failed because the target reported “no valid function”; the remaining recorded commands should be treated as potentially successful until independently verified.
  - claim: Ransom-ISAC limits of evidence (what the log cannot show).
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: It cannot tell us the actual temperatures reached, whether every write was accepted, whether the settings persisted, whether equipment safeguards intervened, or how long any unit operated in an unsafe state. It also cannot identify the operator behind the source addresses, or say whether the two sessions were one operator or two.
  - claim: 'Ransom-ISAC: no evidence linking the incident to NoName057(16), Z-Pentest Alliance or the French attacks.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: We have no evidence linking it to NoName057(16), Z-Pentest Alliance or the attacks in France.
  - claim: 'Ransom-ISAC: similarity to reported attacks does not link the incidents.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The changes resemble the reported attacks, with setpoints pushed to 110°C and defrost cycles manipulated, but anyone with administrative access can make them, so the similarity does not link the incidents.
  - claim: 'Ransom-ISAC: NoName057(16)/Z-Pentest claim dated November 4; investigators did not confirm it.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: On November 4, NoName057(16) and Z-Pentest claimed the supermarket attacks, but investigators did not confirm the claim or establish a link between the blood-service attack and the supermarket attacks.
  - claim: 'Ransom-ISAC: blood-service attack via a contractor (Coolworld) at three EFS sites; staff responded to alarms.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: On the night of November 1 to 2, attackers went through Coolworld, a contractor of the French blood service (EFS), and changed freezer settings from about −30°C to 110°C at three EFS sites.
  - claim: 'Ransom-ISAC: exposure counts (about 13,000 European systems with vulnerable software; 1,173 Copeland XWEB units exposed worldwide) and second wave in at least nine countries.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: In early November, a second wave hit supermarkets in at least nine European countries. Analysts found about 13,000 refrigeration systems in Europe that still run vulnerable software, and researchers found 1,173 Copeland XWEB units exposed to the internet worldwide.
  - claim: 'Ransom-ISAC: no ransom demand and no known malware.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: with no ransom demand and no known malware.
  - claim: 'Ransom-ISAC: state-direction caveat.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: In December 2025, Denmark linked both groups to the Russian state, but no authority published evidence of state direction for the refrigeration attacks.
  - claim: 'Ransom-ISAC: provenance of the log - ''supplied XWEB event log'', counts derived from it.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: 'Primary incident source: supplied XWEB event log dated 2 November 2026. Statistical counts and timeline in this article are derived from the supplied log.'
  - claim: 'Ransom-ISAC: Copeland firmware 1.13 addresses the Claroty findings.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Copeland released firmware 1.13 to address the reported findings.
  - claim: 'Ransom-ISAC: CVE-2026-21718 as the author describes it (an authentication bypass), CVSS 10.0.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: 'CVSS 10.0 (Critical) / EPSS 0.00692: an authentication bypass that may allow code execution without authentication.'
  - claim: 'Ransom-ISAC: CVE-2026-24663 OS command injection, CVSS 9.0.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: 'CVSS 9.0 (Critical) / EPSS 0.03691: operating system command injection via a specially crafted request, potentially allowing for remote code execution without authentication.'
  - claim: 'Ransom-ISAC alert guidance: bulk parameter-write threshold (author''s suggestion, to be tuned).'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: more than about 20 “Wrote parameters” events a minute from one account, or writes to more than three devices within five minutes. The first session made about 98 writes a minute.
  - claim: 'Ransom-ISAC alert guidance: safety-function commands not originating from the scheduler.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: any keypad-lock (“KeyboardLock”, “Blocco tastiera”), “Alarm Mute”, “Defrost ON” or “ActiveDefrost” command that does not come from the scheduler.
  - claim: 'Ransom-ISAC alert guidance: read sweep is the earliest sign.'
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: Here the sweep began about five minutes before the first write, making it the earliest sign of the attack in the log.
  - claim: Ransom-ISAC conclusion on cause.
    source_url: https://ransom-isac.org/blog/the-copeland-incident/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-3.md
    passage: The attackers needed no vulnerability, only the default credentials. The log does not show whether stock was lost.
  - claim: 'Unit 42: Xpanse count over Nov 5-6, 2026 (over 5,000 internet-exposed devices from manufacturers named in the CERT-FR advisory) - a global count, with a top-country figure; not a vulnerable-version count.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: From Nov. 5–6, 2026, we identified the presence of over 5,000 devices exposed to the internet that were manufactured by companies listed in the
  - claim: 'Unit 42 caveat: counts do not mean the devices run exploitable versions.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: These statistics do not necessarily mean that the devices are running vulnerable versions of software that could’ve been exploited.
  - claim: 'Unit 42: Figure 1 is by top 10 countries (text); the chart image shows nine bars (US 740, China 625, Italy 370, Germany 262, France 234, Spain 220, Greece 177, Turkey 153, Brazil 137), no Switzerland bar.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: Figure 1 below illustrates these findings based on device count by the top 10 countries.
    note: Chart values read visually from the figure image https://unit42.paloaltonetworks.com/wp-content/uploads/2026/11/chart-4.png (not text-verifiable).
  - claim: 'Unit 42: time-series since 1 October 2026 introduced as an exploration of ''internet-exposed devices'' because the activity ''primarily affected devices in France'' - the text does not state that the series is France-only.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: Given the impact of this malicious activity primarily affected devices in France, we decided to explore the trend of internet-exposed devices since October 1, 2026.
  - claim: 'Unit 42: decline three periods - Oct 1-15: 1,853.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: 'October 1-15, 2026: 1,853'
  - claim: 'Unit 42: Oct 16-31: 558.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: 'October 16-31, 2026: 558'
  - claim: 'Unit 42: Nov 1-6: 316.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: 'November 1-6, 2026: 316'
  - claim: 'Unit 42: waves - first overnight Oct. 11-12 (about 700 supermarkets in France), second overnight Nov. 1-2 (at least 10 additional European countries, 100-115 retail locations).'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: The first wave of these attacks occurred overnight between Oct. 11–12, 2026, primarily targeting approximately 700 supermarkets in France. Since that time, another wave occurred overnight between Nov. 1–2, 2026, expanding across at least 10 additional European countries and impacting over 100–115 retail locations.
  - claim: 'Unit 42: initial access vector unconfirmed; default credentials and vulnerable versions are ''widespread speculation''.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: The initial access vector currently remains unconfirmed. However, there is widespread speculation that impacted devices were potentially running vulnerable versions of software and/or used default credentials provided by the manufacturers that attackers easily identified.
  - claim: 'Unit 42: NoName057(16)/Z-Pentest claim dated Nov. 3; allegations unverified.'
    source_url: https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/
    body_file: work/2026-11-07T0256Z-intel/bodies/U1-4.md
    passage: On Nov. 3, 2026, the pro-Russian hacktivist groups NoName057(16) and Z-Pentest
