  exploitation_status:
    as_of: 2026-11-07 (sources fetched this run); Cisco hardening advisory last revised 2026-10-14 (v1.1); Cisco SQLi advisory last revised 2026-11-03 (v1.2)
    cve_2026_76443: 'Cisco hardening advisory (v1.1 2026-OCT-14): ''Two of them are known to be actively exploited.'' - the two are the SQL Injection and Arbitrary File Write advisories (footnotes 2 and 1). The CVE.org CNA record for CVE-2026-76443 itself says: ''Except as otherwise noted previously, the Cisco PSIRT is not aware of any public announcements or malicious use of the vulnerabilities that are described in this advisory.'' Footnote 2 states ''One vulnerability that belongs to this vulnerability class is known to be actively exploited'' for the CWE-707 class that carries CVE-2026-76443.'
    cve_2026_76461: 'Cisco SQLi advisory: ''In September 2026, the Cisco PSIRT became aware of active exploitation of this vulnerability.'''
    public_exploit_code: Metasploit module in master since 2026-10-28 (PR merged); Rapid7 wrap-up 2026-11-06. Cisco SQLi advisory v1.2 refers to 'exploit code that is available online' (Cisco does not say which code or whether it is the Metasploit module).
  evidence_candidates:
  - quote: The Cisco advisories are vague, but I think this maps to CVE-2026-76443. I was exploring another SQLi, CVE-2026-76461 (Which was exploited in-the-wild a few weeks back), and diffed out this one.
    publisher: 'Rapid7 / Metasploit PR #22018 (author sfewer-r7)'
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
  - quote: Public-key harvesting must be enabled on the inbound mail flow policy for the target to be exploitable.
    publisher: 'Rapid7 Metasploit module documentation (PR #22018 diff)'
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018.diff
  - quote: Cisco Secure Email Gateway Release First Fixed Release 15.5 and earlier 15.5.5-014 16.0 Migrate to a fixed release. 16.5 16.5.0-780
    publisher: Cisco PSIRT
    source_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm
  discrepancies:
  - 'Lead says the module maps to CVE-2026-76443 ''not the exploited CVE-2026-76461''. Sources: the ''not 76461'' wording appears only in the module documentation (''appears to be CVE-2026-76443 rather than CVE-2026-76461 based on the IOCs available for CVE-2026-76461''); the Rapid7 wrap-up says only ''we have reason to believe this maps to CVE-2026-76443'' and the PR text says ''I think this maps to CVE-2026-76443''. It is the author''s belief/inference throughout; Cisco has not confirmed any mapping.'
  - CVE-2026-76443 is a Cisco CWE-707 grouping ID covering multiple internally found injection-class flaws, and Cisco's footnote 2 on that row says one vulnerability in that class is known to be actively exploited (pointing to the SQL Injection advisory, i.e. the CVE-2026-76461 flaw per the CVE.org record). Cisco therefore does not say CVE-2026-76443 is unexploited - it says the CNA record's blanket statement 'not aware of any public announcements or malicious use' applies 'except as otherwise noted'. Keep both statements; do not write that CVE-2026-76443 is 'not exploited'.
  - 'Open question, not resolved by any source: Cisco''s SQLi advisory (exploited flaw) tells admins to grep mail_logs for COPY ... TO PROGRAM, and the module doc says its payload ''stacks COPY TO PROGRAM''; yet the module doc says it maps to CVE-2026-76443 ''rather than'' CVE-2026-76461 ''based on the IOCs available for CVE-2026-76461'' without saying which IOCs. Do not state that the module''s traffic is or is not the exploited flaw.'
  - Cisco's hardening advisory gives ONE fixed-release table for all five CVEs, not per CVE. For the 16.0 train it says 'Migrate to a fixed release.' (no 16.0.x build), whereas the separate SQLi advisory lists 16.0.4-302 for 16.0. Do not carry 16.0.4-302 as a fix for CVE-2026-76443.
  - The Oct 31 re-release of 15.5.5-014 (retroscannerstatus / Retro Remediation Engine 4.0.2+) is stated in the SQLi advisory v1.2 (2026-NOV-03) only; the hardening advisory (v1.1, 2026-OCT-14) was not revised and does not mention it. Whether it also covers the CVE-2026-76443 group is not stated.
  - 'Cisco says all five hardening CVEs affect the products ''regardless of device configuration''; the Metasploit module doc says exploitability requires public-key harvesting enabled on the inbound mail flow policy (author''s testing statement, not Cisco''s). Also unstated: whether harvesting is enabled by default.'
  - Rapid7 describes the exploited 76461 as 'exploited in-the-wild a few weeks back' (PR text, merged 2026-10-28). Cisco's SQLi advisory says it became aware of exploitation in September 2026 and published 2026-09-14 (exploited before disclosure).
  - 'Rapid7 wrap-up internal inconsistency (not this item): the Citrix NetScaler module''s title says CVE-2026-88771 while its ''CVE reference'' line says CVE-2026-88773.'
  - 'Source metadata: the saved extract of the hardening advisory shows page date 2026-10-14 (v1.1); first publication was 2026-SEP-14.'
  unread:
  - 'PR #22018 conversation text is partly truncated by the extractor (review comments only partly captured; the author''s PR description is captured in full). Module documentation was read from the PR''s .diff view instead (additional fetch, same PR).'
  - GitHub API (merge metadata) not available in this session (gh 403); merge time taken from the PR page's embedded JSON state.
