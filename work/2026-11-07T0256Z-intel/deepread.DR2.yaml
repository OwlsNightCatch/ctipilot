  discrepancies:
  - 'No German original: the NCSC hub post 13054 is published in English only (the hub API returns identical English text for Accept-Language de and fr; a German-language search found no separate NCSC German page). The ''German original plus English translation'' requested for the NCSC wording therefore does not exist - the verbatim passages above ARE the original.'
  - 'Country count of the second wave differs by source: Unit 42 ''at least 10 additional European countries'' (100-115 retail locations), Ransom-ISAC ''at least nine European countries'', ICTjournal (via The Guardian) ''près d''une douzaine de pays'' after an earlier ''sept pays'' report. Keep each attributed; do not average.'
  - 'Date of the NoName057(16)/Z-Pentest claim: Unit 42 says ''On Nov. 3, 2026''; Ransom-ISAC says ''On November 4''. Both agree the claim is unverified/unconfirmed.'
  - 'Ransom-ISAC contradicts itself in emphasis: it says the log ''only records administrator-level actions, not the exploit itself or how the attackers got in'' and ''does not prove that any specific published vulnerability was used'', yet states ''Other evidence shows the way in: the controller still used its default Administrator credentials'' without saying what that other evidence is. Treat ''default credentials'' as the author''s statement, not a verified finding; the log itself is a ''supplied'' document of unstated origin (site anonymised, victim unnamed).'
  - Ransom-ISAC calls CVE-2026-21718 'an authentication bypass'; the CVE.org CNA record (icscert) titles it 'Use of a Broken or Risky Cryptographic Algorithm' (CWE-327), CVSS 3.1 10.0. CVE-2026-24663 (OS command injection, CVSS 9.0) matches.
  - 'Unit 42''s time series (1,853 / 558 / 316) has no stated country scope (the lead summary asks which country/region the counts cover): the ''over 5,000'' Nov 5-6 snapshot is global (top-country chart led by the United States and China, France 234); the series'' scope is not stated in text or chart. Whether it is France-only is an unstated inference - do not assert it. Also, Figure 1 is described as ''top 10 countries'' but shows nine bars; Switzerland does not appear.'
  - Unit 42's Xpanse period labels in text are windows ('October 1-15', 'October 16-31', 'November 1-6') while the chart labels the points 10/15/2026, 10/31/2026 and 11/06/2026 and draws error bars the text does not explain.
  - 'NCSC status wording: header ''Actively Exploited'' (about the campaign, from 2026-10-13) versus update wording that the reviewed information does not ''confirm exploitation of the specific Danfoss CVEs''. The CVEs sit under the label ''Alleged as potentially related''. Do not write that these CVEs were exploited.'
  - NCSC first-version recovery steps (CERT-FR order) include a factory reset; the 2026-11-06 update adds that a factory reset alone is insufficient if the system remains vulnerable and internet-reachable.
  - ICTjournal reports 'jusqu'à 50 à 70 degrés' in the Köniz freezer room (SRF via owner) while its lede says 'temporairement atteint 70 degrés'; Unit 42 says up to 50 C in the supermarket attacks and Ransom-ISAC says settings of about -30 C to 110 C at the blood-service sites (setpoints, not measured temperatures; Ransom-ISAC says measured temperatures are not known).
  - Victim name in ICTjournal (Lüthis Fleischwaren, Köniz) comes from SRF's report, not from NCSC; NCSC's update says only 'Swiss media report manipulation of refrigeration controllers in Switzerland.'
