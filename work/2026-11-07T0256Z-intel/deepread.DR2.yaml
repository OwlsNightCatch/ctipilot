  claims:
  - claim: 'Rapid7''s 2026-11-06 Metasploit wrap-up lists the Cisco Secure Email Gateway S/MIME SQLi module (author sfewer-r7, PR #22018) and states Rapid7 ''has reason to believe'' it maps to CVE-2026-76443 (belief wording, not a vendor confirmation).'
    source_url: https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-1.md
    passage: This module exploits a SQLi for unauthenticated RCE as root against Cisco Secure Email Gateway. The Cisco advisories are vague, however we have reason to believe this maps to CVE-2026-76443.
  - claim: Module path as listed in the wrap-up.
    source_url: https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-1.md
    passage: 'Path: `unix/smtp/cisco_secure_email_gateway_smime_sqli_rce`'
  - claim: Wrap-up headline for the module (type Exploit, single author).
    source_url: https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-1.md
    passage: '### Cisco Secure Email Gateway S/MIME SQL Injection RCE'
  - claim: 'The module author''s own PR text: ''I think this maps to CVE-2026-76443''; he was exploring CVE-2026-76461 (which he describes as exploited in the wild a few weeks earlier) and ''diffed out this one'' (i.e. found it while diffing, a separate SQLi).'
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-2.md
    passage: The Cisco advisories are vague, but I think this maps to CVE-2026-76443. I was exploring another SQLi, CVE-2026-76461 (Which was exploited in-the-wild a few weeks back), and diffed out this one.
  - claim: 'Tested target and precondition as the author words it: AsyncOS 15.5.1-055 with ''S/MIME Public Key Harvesting'' enabled for inbound mail.'
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-2.md
    passage: which has the "S/MIME Public Key Harvesting" feature enabled for inbound mail.
  - claim: 'Reviewer (jheysel-r7) reproduced it: SQLi reached in about 10 seconds; all payloads worked first try.'
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-2.md
    passage: Can confirm I got SQLi in about 10 seconds while testing
  - claim: Reviewer comment on payload results.
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-2.md
    passage: Thanks for the module [@sfewer-r7](https://github.com/sfewer-r7). Super cool bug. All payloads worked first try without issue
  - claim: Module sends one S/MIME email with 500 certificate addresses over SMTP port 25; exploit email accepted by the gateway; Meterpreter session as root (test log).
    source_url: https://github.com/rapid7/metasploit-framework/pull/22018
    body_file: work/2026-11-07T0256Z-intel/bodies/U4-2.md
    passage: Sending 85828-byte email with 500 certificate addresses
  - claim: 'PR was merged by jheysel-r7 on 2026-10-28T01:47:42Z (raw GitHub page state: mergedTime). PR opened 2026-10-15 (page date metadata). So the module was in Metasploit master from 2026-10-28, i.e. before Rapid7''s 2026-11-06 wrap-up and before Cisco''s 2026-10-31 re-release of the 15.5.5-014 fix.'
