    publisher: Check Point Research
    source_url: https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/
  discrepancies:
  - 'REPOSITORY DATE CONFLICT INSIDE Check Point''s report: ''its developer decided to make the project closed-source on October 8th'' vs ''Following the deletion of the original ARTEX project on September 8, numerous forks emerged''. Same document, one month apart, ''closed-source'' vs ''deletion''. Check Point does not reconcile them (they could be two events but the report does not say so). Safest: attribute each to Check Point or omit the date. The report also says the South Korean bank attacks preceded the closed-sourcing; the CrowdStrike blog it links was not read.'
  - 'Check Point scale figures are not mutually consistent as worded: Key Points say ''more than 1,800 publicly exposed instances for ARTEX alone''; the body says 2,557 systems hosting or having hosted panels with 1,608 live and public at time of research; the conclusion says ''more than a thousand publicly available servers''. Quote 2,557 / 1,608 / 10 exactly as the body words them; the 1,800 figure is a separate Key-Points claim without an explained derivation.'
  - The operator-behaviour findings rest on the 10 instances that leaked full databases (stated), not on all 1,608; 'most attacks were fully autonomous' is therefore a statement about the analysed consoles. Check Point's three worked campaigns are not claimed to be the same actors as Microsoft's Storm-3358; Check Point never mentions Storm-3358 (0 occurrences) and its campaigns target signing shops, crypto and game-credential sites, not the financial sector in Southeast Asia.
  - Microsoft gives no numbers for its deception/tarpit testing ('helped reduce the attack traffic reaching real assets and produced high-confidence, attribution-quality signal'); no sample size or method is stated.
  - Microsoft's IOC list and its KQL hunting query disagree on one IP entry (one octet differs between the table and the query array); IOC values not carried; treat the table as the reference only after checking.
  - Check Point states that, with American models configured on 3 instances, guardrails were hit only when using Anthropic's Opus 5.5, after which the actor switched to more permissive Chinese models - the lead summary did not mention this; it is Check Point's observation about its own sample and implies nothing about the model's general behaviour. Check Point does not say how many instances used Opus 5.5.
  - 'The lead asks for ''ARTEX behavioural tells in web/auth logs'': Microsoft states request-pattern tells (wide variety of requests in a brief time, technique retries, machine-speed next-stage moves) and default tool client strings; it does NOT give auth-log specifics beyond Entra''s Verified threat actor IP detection. Check Point offers the version-tag clustering hint (server-side, not victim-log). No further tells are stated by either source.'
