    as_of: 2026-11-06 (Microsoft) / 2026-11-05 (Check Point)
    microsoft: '''Microsoft has observed Storm-3358 use ARTEX in combination with conventional automated tools to scan systems connected to the public internet, exploit security flaws including anonymous file upload and server-side request forgery (SSRF), and install open-source remote access trojans (RATs).'' (observation by the telemetry holder; IOCs ''Active as of 2026-11-06'')'
    check_point: Artefacts from the operator consoles of 10 misconfigured instances show agent-driven exploitation of web flaws against signing shops, crypto services and game-credential servers; Check Point reports no link to Storm-3358 and does not name it.
  evidence_candidates:
  - quote: The threat actor that Microsoft Threat Intelligence tracks as Storm-3358 is a Cambodia-based intrusion cluster that primarily targets financial organizations in Southeast Asia, in addition to a smaller number of large financial organizations globally.
