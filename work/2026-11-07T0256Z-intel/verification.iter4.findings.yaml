  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, update 2026-11-07T03:49:14Z (claims b3b8bfe8db, 502dd92af7, a28682ad65)"
  url_or_quote: "https://github.com/rapid7/metasploit-framework/pull/22024.diff"
  summary: "The new section reports the merged ECS module for the CVE-2026-76461 mapping but omits the precondition the same PR's module documentation states: 'URL Filtering and URL Retrospective Service must both be enabled.' (scenario: 'which has the URL Filtering and URL Retrospective Service features enabled for inbound mail'). The entry gives the equivalent precondition for the S/MIME module ('Public-key harvesting must be enabled on the inbound mail flow policy') and labels only S/MIME 'a non-default feature', while Cisco's advisory says CVE-2026-76461 affects the gateway 'regardless of device configuration'. A triage reader cannot tell which appliances the public exploit for the CISA-listed flaw reaches, and the tension with Cisco's wording is a second reason the mapping is only medium confidence that the entry does not give. Fix: add the ECS module's precondition to the section and the CVE-2026-76461 status text (cite the 22024 .diff), and say it sits beside Cisco's 'regardless of configuration' statement."
- code: F8
  category: needs-more-research
  section: updates
  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, Triage line, actions[1], immediate_action, update 2026-11-07T03:49:14Z"
  url_or_quote: "of the injections reproduced from the patch diff it was the only one that left the pattern COPY.*TO PROGRAM in mail_logs"
  summary: "(low confidence) The new section states that the ECS injection is the only reproduced one that left the mail_logs pattern, but the Triage line ('Cisco's own discriminator is the mail_logs pattern'), actions[1] and immediate_action ('hunt mail_logs for the exploitation pattern before assuming a device is clean') still treat a clean grep as the check. PR 22024 says the other injection it reproduced (S/MIME, public module in PR 22018, which Cisco's own table puts in the same injection class as the exploited flaw) did not generate the match, so a clean grep does not rule out use of that vector. The section leaves the reader to infer this. Fix: one clause saying a clean mail_logs grep does not exclude exploitation through the S/MIME injection."
