  section: updates
  item: "2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race, Exposure line and cves[CVE-2026-119977].affected (claim 6ade5a9fb8)"
  url_or_quote: "any WordPress site on 4.7 to 7.1.3 with `wp-content/upgrade/` reachable from the internet while a core update runs"
  summary: "(low confidence) Picus (the discoverer, cited): 'The underlying updater and copy behavior affects WordPress 2.7.0 through 7.1.3', and The Hacker News (cited): 'The researcher says the flaw goes back to WordPress 2.7 ... those sites should move to a supported version'. Wordfence (cited) gives 4.7 through 7.1.3. The entry follows Wordfence and adds only '4.6 and earlier get no fix', without saying those sites are affected too, so an inventory built from the Exposure line skips them. Fix: one clause or Contradiction line that the discoverer dates the flaw to 2.7 and that 2.7 to 4.6 are exposed with no fix."
