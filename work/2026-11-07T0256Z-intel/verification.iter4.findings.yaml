  item: "2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo, summary and cves[CVE-2026-111497].affected/fixed (claims 5dac0aad0d, b7031a507e)"
  url_or_quote: "Cisco names Duo Network Gateway (fixed in 3.4.2) and RoomOS among products with fixes dated up to 2027"
  summary: "(low confidence) Cisco's advisory (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u) covers four CVEs in one set of tables: CVE-2026-111497 (Brotli) plus CVE-2026-105482 (DNS truncation) and CVE-2026-105483 and CVE-2026-106069 (TLS hostname validation); its fixed-release table has no CVE column and the page says the bug IDs 'contain additional platform-specific information'. 'Duo Network Gateway 3.4.2' and the RoomOS builds are therefore not shown to fix or be affected by the Brotli flaw specifically, yet the summary says the three vendors 'listed products that bundle the Brotli decoder flaw CVE-2026-111497' and the CVE record carries them as its Cisco fix. The Cisco bullet in the body is accurate as a description of the advisory. Fix: say the Cisco table covers the October Node.js flaws including this one and does not map products to CVE ids, and word the CVE record's Cisco fix accordingly."
