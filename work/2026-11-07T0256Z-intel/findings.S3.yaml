  - title: "ARTEX: Microsoft names Storm-3358 (Cambodia-based, financially motivated) driving it against financial organisations, and Check Point reads operator consoles showing nearly autonomous opportunistic campaigns on 1,608 exposed panels"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/", publisher: "Microsoft Threat Intelligence", date: "2026-11-06", role: "primary" }
      - { url: "https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/", publisher: "Check Point Research", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: msft-ti listing, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (raw url shows the newest card, post time 2026-11-06T18:44-08:00) -> primary: Microsoft article, URL https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/ ; second: checkpoint-research feed, URL https://research.checkpoint.com/feed/ -> primary: Check Point article, URL https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/ (inside the 72 h developing window)"
    summary: |
      Microsoft Threat Intelligence (2026-11-06) reports that Storm-3358, a Cambodia-based intrusion cluster that mainly targets financial organisations in Southeast Asia and a smaller number of large ones globally, has used ARTEX since October 2026 together with conventional automated tools to scan internet-facing systems, exploit anonymous file upload and server-side request forgery flaws, and install the open-source remote access tools WISP, vshell and AdaptixC2, with ARTEX agents using netcat and curl to fetch them, web shells for persistence on compromised web servers and compromised cloud identities for persistence and exfiltration. Microsoft names the behavioural tell of an agent (a wide variety of requests in a short burst, retries of technique variants, a switch to next-stage actions at machine speed), lists the default tools and user agents ARTEX drives (Nmap, curl, wget, Python HTTP clients, Playwright-driven headless Chromium), and reports that honeypots, decoys, tarpits and "fake wins" that convince an agent its objective is done cut the traffic reaching real assets in its tests. Check Point Research (2026-11-05) adds the operator side: it counts 2,557 hosts that host or hosted ARTEX panels with 1,608 live and public, ten of which exposed the full database, from which it reads operator prompts and models (DeepSeek Flash family most common; guardrails hit only on Anthropic's Opus 5.5, after which the operator switched to a more permissive Chinese model). Its three worked campaigns are opportunistic crime, not espionage: stealing iOS signing certificates from grey-market shops, trying to drain USDT from payment sites (230 findings, nothing moved), and harvesting game-account credentials from backend servers. The agents got in through hardcoded administrator passwords in single-page-app JavaScript bundles, missing API authentication, command injection, insecure direct object references, weak admin credentials and template injection, and in one case used leaked storage credentials to gain write access to a bucket serving app landing pages. Check Point gives two dates for the original repository (closed-source on 2026-10-08 in one place, "deletion" on 2026-09-08 in another) and Mandiant said October, so treat the date as unsettled. The delta against the existing ARTEX entries: a third named cluster with a financial-sector focus, and hard numbers on how exposed and how autonomous operator-side ARTEX use is.
    region_nexus: "global; Storm-3358 mainly Southeast Asia financial sector; the exposed-web-application attack class applies to Swiss public bodies"
    primary_sector_nexus: "indirect"
    sector: "financial (Storm-3358) / cross-sector (operator behaviour)"
    cves: []
    techniques: [T1595.002, T1190, T1505.003, T1105, T1110.003, T1078.004, T1552.001]
    affected_products: []
    entity_keys: ["tool:artex", "actor:storm-0940", "actor:unc7228", "actor:vapor-panda", "tool:adaptixc2"]
    new_entities:
      - { key: "actor:storm-3358", type: actor, name: "Storm-3358", aliases: [], summary: "Microsoft Threat Intelligence designation for a Cambodia-based, financially motivated intrusion cluster that mainly targets financial organisations in Southeast Asia and a smaller number of large ones globally and has used the ARTEX agent framework together with open-source remote access tools since October 2026 (Microsoft, 2026-11-06)." }
      - { key: "tool:vshell", type: tool, name: "vshell", aliases: [], summary: "Open-source remote access and command-and-control tool that Microsoft lists, with WISP and AdaptixC2, among the tools Storm-3358 installs after ARTEX-driven exploitation (Microsoft, 2026-11-06)." }
    relation_suggestions:
      - { subject: "actor:storm-3358", object: "tool:artex", basis: "Microsoft states Storm-3358 began targeting financial-sector organisations using ARTEX in October 2026 (Microsoft Threat Intelligence, 2026-11-06)" }
      - { subject: "actor:storm-3358", object: "tool:adaptixc2", basis: "Microsoft states Storm-3358 used the WISP, vshell and AdaptixC2 RATs for persistence and lateral movement (Microsoft Threat Intelligence, 2026-11-06)" }
      - { subject: "actor:storm-3358", object: "tool:vshell", basis: "same Microsoft sentence names vshell among the RATs Storm-3358 used (Microsoft Threat Intelligence, 2026-11-06)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: "A / 1 on the facts each lab holds first-hand (Microsoft victim-side telemetry; Check Point operator-console artefacts, independent of each other)."
    novelty: "update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    evidence:
      - quote: "The threat actor that Microsoft Threat Intelligence tracks as Storm-3358 is a Cambodia-based intrusion cluster that primarily targets financial organizations in Southeast Asia, in addition to a smaller number of large financial organizations globally."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"
      - quote: "Storm-3358 has used the WISP, vshell, and AdaptixC2 RATs for persistence and lateral movement."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/"
      - quote: "With American models configured on 3 different instances, we observed guardrails being hit only when using Anthropic’s Opus 5.5."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/"
      - quote: "Companies can expect to be exposed to a high volume of attacks, if being target of an agentic hacking campaign. Systems in the exposed perimeter should be tested and hardened accordingly."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/"
    extended_notes: |
      Exposure: any internet-facing web application or API of a public body (not a product list): the agents' successful entry points are classic weaknesses (hardcoded administrator credentials in JavaScript bundles, endpoints without authentication, command injection, IDOR, SSTI, weak admin passwords); where authentication was enforced the agents stalled. Microsoft's guidance is that blocking default user agents will not stop an agent because it changes them quickly, but they are a useful alert.
      Detection (telemetry class first): web and WAF access logs showing one source walking many endpoints and parameter variants within seconds and retrying the same technique with variations, default scanner user agents and headless-Chromium fingerprints; on Linux web servers, shell execution spawned from a PHP application or web server user, netcat or curl pulling a binary into a world-writable directory, new cron jobs; in Entra, service-principal sign-ins flagged by Verified threat actor IP risk detections (Microsoft). Check Point notes the ARTEX build tag (default "dev", or the last git commit) can cluster operators.
      Triage: authorised penetration tests and vulnerability scanners produce similar bursts; the discriminators are an untested external source, no change ticket, retry-on-error variation, and follow-on installs of remote access tools.
      Hardening: pre-auth surface review of every exposed web app and API (remove credentials from front-end bundles, enforce authentication on every API route); Microsoft's deception suggestion (decoys, tarpits, fake wins) as a cheap way to burn agent time and gain attribution-quality signal.
