  - title: "Acronis TRU: BOSSAI, a single operator's 12-agent AI attack mesh, took patient-care records and dispatch case data from Taiwanese emergency services and scanned fire-dispatch systems in five cities"
    lookback: true
    sources:
      - { url: "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/", publisher: "Acronis Threat Research Unit", date: "2026-11-04", role: "primary" }
    discovery_trace: "first seen at: acronis-tru bonus sweep (not in the S3 slice; rotation lookback 146 h, last attempted 2026-11-01), URL https://www.acronis.com/en-us/tru/feed.xml (feed) -> primary: Acronis TRU article, URL https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/ . WebSearch ('BOSSAI Acronis AI agent mesh Taiwan emergency services Hualien operator') found no independent coverage."
    summary: |
      Acronis TRU reports that it found an open attack workstation, 90,000 files and 9 GB of logs, agent conversations and operator histories, and describes BOSSAI, a mesh of 12 AI agents (nine active) run by one operator, using Hermes Agent as the main offensive harness and open-source agentic pentest platforms, with commands typed in Traditional Chinese. In the 12 days TRU watched, the mesh targeted hundreds of organisations in eleven countries, among them government emergency services, banks and lenders, universities and military systems; TRU confirms data exfiltration or access at about ten targets in three countries and active attacks without confirmed compromise at about fifteen more. The emergency-services harm is the part that matters for this constituency: a Taipei fire-department patient-care records platform exposed ECG readings, ambulance video and vital signs without credentials back to 2018; a city 119 dispatch system's API yielded case records (times, response types, status, street-level locations) across seven districts; an emergency-management system showed a hardcoded AES-256 key in front-end JavaScript that exposed session-cookie contents including an administrator identity; a fire-dispatch vendor's database administration panel opened with default root credentials; a national fire agency single sign-on portal was brute-forced without confirmed access; and fire-department systems in five cities were fingerprinted. TRU also records what failed: the agents hallucinated a critical Apache flaw at a disaster-response centre (the port was filtered), commercial models refused offensive work so the operator fell back on locally run abliterated models, and TRU says the agents failed where authentication was enforced. TRU attributes the operation with high confidence to a single individual in Taiwan, from operational-security failures; this entry carries no personal identifiers.
    region_nexus: "Taiwan (heaviest), Mexico, Thailand and others; transferable to Swiss emergency-services web platforms and cantonal dispatch vendors"
    primary_sector_nexus: "direct (emergency services: dispatch, patient-care records, fire services)"
    sector: "public-sector (emergency services), education, finance"
    cves: []
    techniques: [T1595.002, T1190, T1078.001, T1110, T1119, T1090]
    affected_products: []
    entity_keys: ["tool:hermes-ai-agent"]
    new_entities:
      - { key: "campaign:bossai-ai-attack-mesh-2026-11", type: campaign, name: "BOSSAI", aliases: [], summary: "Acronis TRU name for a single operator's mesh of 12 AI agents (Hermes Agent as main offensive harness, open-source agentic pentest platforms, abliterated local models) that targeted hundreds of organisations in eleven countries, among them Taiwanese emergency services, banks, universities and military systems, over the 12 days TRU observed it (Acronis TRU, 2026-11-04)." }
    relation_suggestions:
      - { subject: "campaign:bossai-ai-attack-mesh-2026-11", object: "tool:hermes-ai-agent", basis: "Acronis TRU: the most prolific of BOSSAI's offensive agents used Hermes Agent as its agentic harness (Acronis TRU, 2026-11-04)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "B / 2: vendor research with first-hand evidence (exposed operator server); no independent corroboration found, attribution to an individual is TRU's own."
    novelty: new
    evidence:
      - quote: "Using the BOSSAI mesh, the operator targeted hundreds of organizations spanning government emergency services, banks and lenders, universities, military systems, phone directories, e-commerce platforms, and gambling sites in eleven countries."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"
      - quote: "A fire-dispatch technology vendor's database administration panel was logged into with default root credentials, exposing 18 or more database tables."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"
      - quote: "The agents failed where authentication was enforced, where paywalls required valid sessions and where endpoints were properly filtered."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"
    extended_notes: |
      Exposure: web platforms of emergency services and their vendors that are reachable without strong authentication: patient-care record systems, dispatch case APIs, vendor admin panels with default credentials, SSO portals without lockout, front-end bundles that hold keys. TRU's own lesson: "obscurity is no longer a valid defense" because an agent can examine hundreds of targets in parallel; properly configured systems gave the agents little.
      Detection: web and API logs showing a burst from one source that enumerates dozens of subdomains and then runs concurrent directory and parameter discovery (TRU names nmap, nikto, ffuf, gobuster, dirsearch) followed by SQL-injection tooling (sqlmap, boolean-blind) against a legacy host, routed through a commercial proxy matched to the target's country; authentication logs showing credential brute-forcing of an SSO portal; admin-panel logins with default accounts.
      Triage: a scheduled authorised scan or red-team exercise looks alike; the discriminators are no change ticket, residential or commercial-proxy egress geolocated to the victim country, and terse, error-driven retries.
      Hardening: inventory every dispatch, patient-record and vendor-managed web interface and API for pre-auth data access; remove default credentials on vendor panels (ask the supplier); no secrets or cryptographic keys in front-end JavaScript; rate-limit and lock out SSO brute force.
