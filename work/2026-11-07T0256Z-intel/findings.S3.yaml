  - title: "ANNUAL REPORT — ReliaQuest Ransomware and Cyber Extortion in Q3 2026: 43 first-time groups drove 93% of leak-site growth, ExfilSquad looks like credential scraping, and about 85% of the added victims were outside the US"
    lookback: true
    borderline: true
    borderline_reason: "Quarterly vendor report; value is the method lesson (verify a leak-site claim against your own logs; do not read sector or country rankings as risk), not new attack detail. Independent counts (Comparitech, 2026-10-06) show the Q3 volume rise and a 36% quarter-on-quarter rise in government targets."
    sources:
      - { url: "https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q3-2026/", publisher: "ReliaQuest Threat Research", date: "2026-11-03", role: "primary" }
      - { url: "https://www.comparitech.com/news/ransomware-roundup-q3-2026-stats-on-attacks-ransoms-and-active-gangs", publisher: "Comparitech", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: reliaquest sitemap, URL https://reliaquest.com/sitemap.xml (filtered to /blog/, lastmod 2026-11-04) -> primary: ReliaQuest article, URL https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q3-2026/ ; corroboration: WebSearch ('\"Q3 2026\" threat landscape report ransomware public sector government November 2026') -> Comparitech roundup, URL https://www.comparitech.com/news/ransomware-roundup-q3-2026-stats-on-attacks-ransoms-and-active-gangs"
    summary: |
      ReliaQuest's quarterly ransomware report (published 2026-11-03) says organisations named on data-leak sites rose 30% in Q3 2026 but that 43 groups with no earlier posts accounted for 93% of the increase, while groups active in both Q2 and Q3 added 1%; it judges that leak-site headcounts no longer measure attacks, that some listings are likely rebrands, recycled data or false claims, and that detection should rest on shared ransomware behaviours (abuse of remote services, identity compromise, lateral movement, exfiltration) rather than group names. It assesses that ExfilSquad, an exfiltration-extortion name first seen in July 2026, is likely an opportunistic actor that scrapes exposed credentials, takes only what those accounts reach, and uses a ransomware-style leak site to make limited access look like a breach, so a named organisation should verify the claim against its own logs before responding; the likeliest real harm is targeted phishing of the named staff. Manufacturing victims grew 70% because Qilin and The Gentlemen between them added about a quarter of the sector's listings, both using internet-facing flaws, vulnerable drivers to disable EDR and Group Policy changes to push the encryptor, and about 85% of the added victims were outside the US (US share of listed victims 55%, 49%, 41% across Q1 to Q3). ReliaQuest forecasts more fragmentation in Q4 2026. Comparitech's independent Q3 count (published 2026-10-06) reports the highest quarterly total it has recorded and a 36% quarter-on-quarter rise in attacks on government entities, which supports the volume rise but not ReliaQuest's reading of what the new names mean.
    region_nexus: "global; US share falling, so non-US public bodies are a growing share of listings"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["actor:exfilsquad", "actor:qilin", "actor:thegentlemen"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_hint: "B / 2 (vendor telemetry; leak-site data are claims)."
    novelty: new
    evidence:
      - quote: "Organizations named on data-leak sites rose 30%, but 43 groups that had never posted before Q3 drove 93% of that increase."
        attribution: "ReliaQuest Threat Research"
        source_url: "https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q3-2026/"
      - quote: "ExfilSquad is likely an opportunistic actor using exposed credentials to reach limited data, then using a ransomware-style leak site to make that access look like a major breach."
        attribution: "ReliaQuest Threat Research"
        source_url: "https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q3-2026/"
      - quote: "Education saw the biggest uptick with an increase of 50 percent, followed by healthcare (up 39 percent), government (up 36 percent), and businesses (up 27 percent)."
        attribution: "Comparitech"
        source_url: "https://www.comparitech.com/news/ransomware-roundup-q3-2026-stats-on-attacks-ransoms-and-active-gangs"
    extended_notes: |
      Defender takeaway: when a commune, canton or supplier is named on a new leak site, treat the post as an unverified claim and let internal telemetry decide (ReliaQuest's three questions: was the organisation compromised, does the evidence match the actor's account of how it got the data, is the name a distinct operation, a rebrand or an opportunistic poster). Useful alongside the many SafePay and similar claims in the store.
