    discovery_trace: "first seen at: kaspersky-securelist feed, URL https://securelist.com/feed/ -> primary: Securelist article, URL https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/ . WebSearch ('Kaspersky GERT ESXi Proxmox ransomware PRTG monitoring root credential BlackNevas The Gentlemen') found no independent coverage."
    summary: |
      Kaspersky's Global Emergency Response Team describes two ransomware investigations in virtualised estates. In case 1 BlackNevas ransomware activity surfaced on a Windows host in a virtualised domain-controller segment where AnyDesk and the GMER anti-rootkit tool had been run; the estate's PRTG Network Monitor held VMware credentials with broad reach to the ESXi hosts and the same root password was reused across several nodes, so the attacker used it to connect by SSH, upload the encryptor, disable the ESXi execInstalledOnly setting with esxcli (the first execution attempt had been blocked by it), run the binary and delete logs, on two hosts at once in October 2025. In case 2 a ransomware incident by The Gentlemen group, the actor used what it collected during the dwell time: on a compromised system administrator workstation it found Proxmox root credentials and access details in plaintext notes, logged in as root@pam, opened the VNC web socket to reach the other hosts and ran the ransomware across the cluster (the log timestamps are ambiguous between day and month, so no date is given). GERT's point is that no VM escape was needed: monitoring that holds recoverable hypervisor credentials, password reuse, direct root SSH that bypasses vCenter role controls, a security setting that the same credential can switch off, and credentials in notes each turned one foothold into the management plane. Its remediation list is concrete and platform-neutral: a dedicated least-privilege monitoring identity per platform, no recoverable host root passwords on monitoring or general servers, ESXi administration through vCenter with Lockdown Mode and SSH and the ESXi Shell stopped by default, execInstalledOnly with Secure Boot, alerting on changes to those settings, isolated management networks behind jump hosts, and remote log storage and separate backup identities.
    region_nexus: "global; VMware and Proxmox virtualisation is standard in Swiss federal, cantonal and communal data centres"
    primary_sector_nexus: "direct"
    sector: "cross-sector (hypervisor administration plane)"
    cves: []
    techniques: [T1078.003, T1021.004, T1021.005, T1552.001, T1685, T1685.006, T1486, T1219]
    affected_products: ["VMware ESXi", "Proxmox VE", "Paessler PRTG Network Monitor"]
    entity_keys: ["actor:thegentlemen"]
    new_entities:
      - { key: "actor:blacknevas", type: actor, name: "BlackNevas", aliases: [], summary: "Ransomware name Kaspersky GERT gives to the encryptor deployed on ESXi hosts in an October 2025 case in which the attacker used a root password reused across hosts and stored in PRTG Network Monitor (Kaspersky GERT, 2026-11-06)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "B / 2: vendor incident-response cases, first-hand; no independent corroboration; victim and sector not named."
    novelty: new
    evidence:
      - quote: "The available evidence showed that the PRTG deployment had broad access to the ESXi hosts and that the same root password was reused across several nodes."
        attribution: "Kaspersky GERT (Securelist)"
        source_url: "https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"
      - quote: "On a compromised system administrator workstation, the actor discovered administrative credentials and access details stored in notes in plain text."
        attribution: "Kaspersky GERT (Securelist)"
        source_url: "https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"
      - quote: "No VM escape was required."
        attribution: "Kaspersky GERT (Securelist)"
        source_url: "https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"
    extended_notes: |
      Exposure: any estate where a monitoring, backup or automation system stores or can retrieve a hypervisor root credential, where ESXi hosts share a root password, where SSH or the ESXi Shell is left running, or where the Proxmox or vCenter admin interface is reachable from general server networks. Check by listing every credential store in monitoring tools, scripts and scheduled tasks and attempting direct SSH and API access to a host with a routine account.
      Detection (telemetry class first): hypervisor and vCenter audit logs: SSH service started or enabled, root SSH logins from a monitoring or workstation source, changes to the execInstalledOnly advanced setting, Secure Boot or Lockdown Mode changes, local-account and exception-user list changes, firewall-rule changes, log-forwarding changes; Proxmox API logs showing root@pam requests to the vncwebsocket endpoint across many nodes; on the monitoring server, process creation of ssh or esxcli parented by the monitoring service.
      Triage: legitimate maintenance also enables SSH and root logins; the discriminators are no change ticket, a source that is the monitoring server or an admin workstation rather than the jump host, execInstalledOnly switched off, and a new binary written under a datastore path just before execution.
      Hardening: as Kaspersky lists above; most valuable first steps are removing stored root passwords from monitoring tools and unique per-host credentials from a vault.
