  - title: "cwpdoor: Qianxin X-Lab finds a passive, log-suppressing backdoor built into a recompiled cwpsrv, the web server of Control Web Panel, with about 340,000 panels exposed and the spread vector unknown"
    lookback: true
    sources:
      - { url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/", publisher: "Qianxin X-Lab", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: xlab-qianxin feed, URL https://blog.xlab.qianxin.com/rss/ -> primary: X-Lab article (English slug), URL https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/ . WebSearch ('cwpdoor Control Web Panel backdoor cwpsrv XLab') found no independent coverage."
    summary: |
      Qianxin X-Lab's telemetry caught a script on 2026-06-29 that replaces the cwpsrv binary of Control Web Panel (a free Linux hosting control panel; cwpsrv is its dedicated nginx-based web server) with a recompiled copy carrying a passive backdoor, which X-Lab names cwpdoor. The update script supports cwpsrv 1.24.0 and 1.15.10, needs root, backs up the original, restarts the service, rolls back if the health check fails and then restores the file and directory timestamps and clears shell history. The backdoor does nothing until a request carries three custom headers (a timestamp within plus or minus 300 seconds, an AES-256-CBC encrypted command and an RSA signature over both), after which a helper process runs the command and the encrypted answer returns as an HTTP 200 octet-stream, and the module swaps the logging context so that the request never reaches the access log. X-Lab says a 2026-09-30 VirusTotal upload from Brazil, which also contained an Ebury backdoor library, shows real victims exist and that the file had zero detections; it says the relationship to Ebury is unclear and that it does not yet know which vulnerability spreads cwpdoor. It counts more than 340,000 CWP instances exposed to the internet in the past month (potential targets, not infections). For defenders: access logs cannot reveal this backdoor, so detection rests on host integrity (the running cwpsrv binary against the vendor package, unexpected backup files beside it, a helper child process and a local Unix-domain socket for inter-process communication) and on network telemetry for the odd headers; X-Lab's advice is to treat a confirmed host as compromised and to rotate all control-panel credentials.
    region_nexus: "global; Swiss exposure unknown (CWP is a hosting-provider and small-site panel; check web-hosting suppliers of communes and cantonal bodies)"
    primary_sector_nexus: "indirect (hosting suppliers)"
    sector: "cross-sector (web hosting)"
    cves: []
    techniques: [T1554, T1070.006, T1070.003, T1205, T1573.001, T1071.001]
    affected_products: ["Control Web Panel", "CWP cwpsrv"]
    entity_keys: []
    new_entities:
      - { key: "malware:cwpdoor", type: malware, name: "cwpdoor", aliases: [], summary: "Qianxin X-Lab's name for a passive backdoor compiled into the cwpsrv web server of Control Web Panel; it is triggered only by a signed request carrying three custom headers and suppresses logging for that request (Qianxin X-Lab, 2026-11-05)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "B / 2: first-hand telemetry and reverse engineering by a research lab; single source; spread vector and operator unknown."
    novelty: new
    evidence:
      - quote: "At the same time, it suppresses logging for that request, leaving no trace of the interaction in the access logs."
        attribution: "Qianxin X-Lab"
        source_url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/"
      - quote: "We do not yet know which vulnerability cwpdoor uses to spread"
        attribution: "Qianxin X-Lab"
        source_url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/"
      - quote: "making all of them potential targets for cwpdoor infection"
        attribution: "Qianxin X-Lab"
        source_url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/"
    extended_notes: |
      Exposure: Linux servers running Control Web Panel whose cwpsrv panel (web server on the panel port) is reachable from the internet; X-Lab's two captured samples target cwpsrv 1.15.10 and 1.24.0 (the update script supports only those two versions); X-Lab does not say how infection occurs.
      Detection (telemetry class first): file-integrity monitoring or package verification on the cwpsrv binary and its directory (replaced binary with original timestamps restored; a backup file left beside it), process lineage (a helper child of cwpsrv), local Unix-domain socket listing for a socket whose name contains the word integrity (X-Lab's quick check), strings in the binary for the three custom header names; network or TLS-inspection telemetry for HTTP requests to the panel carrying X-Ngx-Integrity-prefixed headers and answered with a 200 octet-stream; none of this appears in web access logs by design.
      Triage: a legitimate cwpsrv update also restarts the service and writes a backup; the discriminators are a binary that no longer matches the vendor package, a helper child process, and the Unix-domain socket.
      Post-patch check: upgrading does not prove cleanliness; X-Lab says treat a confirmed host as compromised and rotate every control-panel credential.
