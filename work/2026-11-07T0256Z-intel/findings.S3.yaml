  - title: "Cisco Secure Email Gateway: a public Metasploit module now gives unauthenticated root through a second S/MIME SQL injection, which Rapid7 believes is CVE-2026-76443 and not the exploited CVE-2026-76461"
    sources:
      - { url: "https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/", publisher: "Rapid7 (Metasploit wrap-up)", date: "2026-11-06", role: "primary" }
      - { url: "https://github.com/rapid7/metasploit-framework/pull/22018", publisher: "Metasploit Framework pull request #22018 (author sfewer-r7, reviewer jheysel-r7)", date: "2026-10-15", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm", publisher: "Cisco PSIRT (hardening-release advisory)", date: "2026-10-14", role: "corroborating" }
    discovery_trace: "first seen at: rapid7-research listing, URL https://www.rapid7.com/blog/ (raw url; majors sweep) -> Metasploit wrap-up article, URL https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/ -> pivot: module pull request, URL https://github.com/rapid7/metasploit-framework/pull/22018 -> Cisco hardening advisory (fixed-release table), URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm. WebSearch ('Cisco Secure Email Gateway S/MIME SQL injection CVE-2026-76443 Metasploit module public exploit') found no independent coverage."
    summary: |
      Rapid7's Metasploit wrap-up of 2026-11-06 lists a new exploit module (unix/smtp/cisco_secure_email_gateway_smime_sqli_rce) for an unauthenticated SQL injection that ends in command execution as root on Cisco Secure Email Gateway. The module sends one signed S/MIME message (about 85 KB, 500 certificate identities, the count the author's code comment says is needed to hit the harvesting writer's buffer limit so the injection fires) to an accepted recipient on the SMTP listener; the reviewer's test opened a session as root and confirmed the injection in about 10 seconds. The pull request was open on GitHub by 2026-10-15 (page metadata), the reviewer approved it on 2026-10-28 and reports "All payloads worked first try"; the author tested against AsyncOS 15.5.1-055 with the "S/MIME Public Key Harvesting" feature enabled for inbound mail. The author states he found it while diffing the fix for CVE-2026-76461 (the flaw Cisco confirms exploited) and that the Cisco advisories are vague but he believes it maps to CVE-2026-76443, one of the injection-class rows in Cisco's September hardening release, which Cisco's table lists as fixed in 15.5.5-014 and 16.5.0-780 while saying only "Migrate to a fixed release" for 16.0. That mapping is Rapid7's belief, not Cisco's statement, and no source reports this second flaw exploited in the wild. The delta against the existing entry: the entry records that Cisco's statement of 2026-10-31 about exploit code online is Cisco's alone; this is a public, working root-exploit module for a Cisco Secure Email Gateway SQL injection, but Rapid7's author believes it targets CVE-2026-76443 and not the exploited CVE-2026-76461, so it does not confirm the flaw Cisco's footnote refers to. A 16.0 appliance that took 16.0.4-302 (which the entry says closes CVE-2026-76461 only) has no named fix for the flaw this module appears to use.
    region_nexus: "global; Cisco Secure Email Gateway is an internet-facing mail-edge appliance common in European public administrations"
    primary_sector_nexus: "direct (mail gateways of public bodies)"
    sector: "public-sector"
    cves: [CVE-2026-76443, CVE-2026-76461]
    techniques: [T1190]
    affected_products: ["Cisco Secure Email Gateway", "Cisco AsyncOS"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "A / 2 for the module's existence (Rapid7 is the module's author and the Metasploit maintainer; the public PR is first-hand); the CVE mapping is Rapid7's assessment, credibility 3."
    novelty: "update-of:2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
    evidence:
      - quote: "This module exploits a SQLi for unauthenticated RCE as root against Cisco Secure Email Gateway. The Cisco advisories are vague, however we have reason to believe this maps to CVE-2026-76443."
        attribution: "Rapid7 (Metasploit wrap-up)"
        source_url: "https://www.rapid7.com/blog/post/pt-metasploit-wrapup-unauth-rce-modules-in-network-perimeter-devices-and-much-more/"
      - quote: "I was exploring another SQLi, CVE-2026-76461 (Which was exploited in-the-wild a few weeks back), and diffed out this one."
        attribution: "Metasploit Framework PR #22018 (author sfewer-r7)"
        source_url: "https://github.com/rapid7/metasploit-framework/pull/22018"
      - quote: "which has the \"S/MIME Public Key Harvesting\" feature enabled for inbound mail."
        attribution: "Metasploit Framework PR #22018 (author sfewer-r7)"
        source_url: "https://github.com/rapid7/metasploit-framework/pull/22018"
      - quote: "16.0 Migrate to a fixed release."
        attribution: "Cisco PSIRT (hardening-release advisory)"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm"
    extended_notes: |
      Exposure: a Cisco Secure Email Gateway whose SMTP listener is reachable from untrusted networks and that has S/MIME public-key harvesting enabled in its inbound mail policy (the author's tested configuration; no source says whether disabling the feature prevents the flaw, so do not present it as a mitigation). Read the AsyncOS version with the appliance's version command; Cisco's table names 15.5.5-014 (re-released 2026-10-31 per the existing entry) and 16.5.0-780 as fixed and no 16.0 build.
      Behaviour to detect: inbound SMTP messages that are signed S/MIME (application/pkcs7-mime, smime-type signed-data) of unusual size carrying hundreds of certificate identities, delivered after the sender probed for an accepted recipient with HELO/MAIL/RCPT exchanges carrying a random local-part and then RSET (the module's own log shows this sequence; a different tool could vary it). No source publishes appliance-side artefacts for this second injection: the mail_logs pattern in the existing entry is Cisco's for CVE-2026-76461 and no source says it matches this one. Post-patch compromise check as in the existing entry: root on the appliance means mail_logs can have been tampered with, so compare against firewall and network logs outside the appliance.
      Triage: legitimate S/MIME mail with several certificate addresses is common; the discriminators are the extreme identity count (hundreds in one message), a message from a sender with no mail history that was preceded by recipient-probing envelopes, and a follow-on outbound connection from the appliance.
      Hardening: move 16.0 appliances to 16.5.0-780 (Cisco's only 16.x fixed build for the hardening CVEs); restrict SMTP ingress to the sending MTAs that must reach the gateway.
