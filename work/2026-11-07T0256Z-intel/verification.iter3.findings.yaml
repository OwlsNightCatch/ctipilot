- code: F13
  category: analytical-link-as-fact
  section: update 2026-11-07T03:49:14Z
  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, Metasploit paragraph (claim 8d1ece9c5c)"
  url_or_quote: "describes a stacked COPY TO PROGRAM statement, the pattern Cisco's own log check already searches for ([Rapid7 Metasploit module documentation, 2026-10-15](https://github.com/rapid7/metasploit-framework/pull/22018.diff))"
  summary: "The cited .diff says the module 'stacks COPY TO PROGRAM' but says nothing about Cisco's mail_logs check; its documentation says the module maps to CVE-2026-76443 'rather than CVE-2026-76461 based on the IOCs available for CVE-2026-76461'. The same author's PR 22024 (https://github.com/rapid7/metasploit-framework/pull/22024, the CVE-2026-76461 module) says 'the ECS SQLi (i.e. this module) was the only one that generated this matching IOC' (the vendor regex COPY.*TO PROGRAM). So the sentence implies Cisco's log grep covers the S/MIME module, which no cited source states and the author's own PR contradicts. Fix: drop the clause, or say the author reports that this module's injection did not produce the pattern Cisco's check searches for, so the mail_logs grep may not find it."
- code: F3
  category: claim-not-supported
  section: body, Detection line
  item: "2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race (claim b35a890800)"
  url_or_quote: "confirm that `wp-config.php` and the database it names are unchanged and look for administrator accounts, plugins and PHP files under `wp-content/upgrade/` that nobody created ([The Hacker News, 2026-11-06](https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html))"
  summary: "(low confidence) The Hacker News carries Wordfence's list (unexpected requests to PHP files under wp-content/upgrade, unrecognised administrator accounts, plugins no one installed, PHP files in wp-content/upgrade) but nothing on confirming wp-config.php and the database it names are unchanged; that check follows from the mechanism on Picus's page (an attacker-written wp-config.php pointing at an attacker database) and the clause sits under the Hacker News citation. Fix: end the sentence after the Wordfence list, or cite Picus for the wp-config.php and database check."
- code: F8
  category: needs-more-research
  section: update 2026-11-07T03:49:14Z, cves[CVE-2026-76461].status
  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
  url_or_quote: "https://github.com/rapid7/metasploit-framework/pull/22024 ('Add exploit module for Cisco Secure Email Gateway ECS SQLi (CVE-2026-76461)', merged 2026-11-05); update text: 'Whether harvesting is on by default is not stated'"
  summary: "The update reports a public Metasploit module for the S/MIME injection (believed CVE-2026-76443) but not the public module for the exploited CVE-2026-76461 itself: PR 22024 (author sfewer-r7, merged 2026-11-05, cross-referenced as '#22024 Merged' in the cited PR 22018) adds an exploit for the Email Cloud Scanner URL-retrospective SQL injection, 'medium confidence' mapped to CVE-2026-76461, and notes the mail_logs COPY.*TO PROGRAM pattern matches it. cves[CVE-2026-76461].status [exploited, cisa-kev, patch-available] lacks poc-public and the entry never says a public exploit exists for the CISA-listed flaw. The same PR also calls S/MIME harvesting 'a different non-default feature', which answers the entry's 'Whether harvesting is on by default is not stated'. Fix: add the module and the non-default statement to the update, set poc-public on CVE-2026-76461 (author's medium-confidence mapping), declare the changed fields in the record."
