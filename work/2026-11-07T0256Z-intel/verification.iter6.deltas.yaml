  summary: '(low confidence) Residual of iteration-4 F3. https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u covers four CVEs (CVE-2026-111497,
