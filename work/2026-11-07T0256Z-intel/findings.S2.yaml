  - title: "Canton Aargau: the Regierungsrat adopts the information-security ordinance (InfoSiV) and sets 1 January 2027 for the information-security law and ordinance, with a Fachstelle holding directive and enforcement powers and a cantonal cyber coordination office at the cantonal police"
    novelty: new
    sources:
      - { url: "https://www.aargauerpolitik.ch/regierung-wahlt-cyber-koordinator/", publisher: "Aargauer Politik (carries the Departement Finanzen und Ressourcen communiqué)", date: "2026-11-06", role: "primary" }
