        attribution: "Oneconsult"
        source_url: "https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"
      - quote: "The bypass has been reported to Google."
        attribution: "Oneconsult"
