    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (page dated 03/11/2026) -> https://ccb.belgium.be/advisories/warning-multiple-vulnerabilities-veeam-management-pack-microsoft-system-center-could -> primary: https://www.veeam.com/kb4961 (cited by the CCB page)"
    summary: |
      Lookback item (CCB record lookback 97 h; CCB warning 2026-11-03, Veeam KB 2026-10-29). Veeam's KB4961 lists three flaws resolved in Veeam Management Pack for Microsoft System Center 13.1: CVE-2023-22793, an unauthenticated remote code execution on servers running the Veeam Virtualization Extensions service (Critical, CVSS 4.0 9.3, vector network, no privileges, no user interaction); CVE-2026-107238, remote code execution as LocalSystem by an authenticated domain user on servers running the Collector service (High, 8.7; CCB describes it as insecure deserialization); and CVE-2026-107239, remote code execution by a member of the Veeam Virtualization Extensions Users group on the Collector service (High, 8.8; CCB calls it relative path traversal). Veeam says all three were found in internal testing. Affected: Management Pack 9.1 and all earlier version 9 builds, including the Backup & Replication 13 compatibility patch; Veeam states no fix will be provided for version 9.x and customers must upgrade to 13.1.0.334, and that unsupported versions were not tested but are likely affected. Neither Veeam nor CCB reports exploitation.
      Defender angle: Veeam names the Virtualization Extensions service and the Collector service as the vulnerable components, so servers running them are the ones to identify and keep off untrusted networks until upgraded to 13.1.0.334. The CVE-2023-22793 identifier is as printed by both Veeam and CCB; it predates the 2026 fix, which is unusual and worth checking against the CVE record before filing it. Patching does not remediate historic compromise (CCB).
