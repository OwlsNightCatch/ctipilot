  # ------------------------------------------------------------------
  - title: "Canonical LXD and MicroCloud: the API mutual-TLS check compares every certificate in the client's chain to the trust store, so anyone holding a registered user's public certificate can authenticate as that user (CVE-2026-112816, CVSS 4.0 10.0)"
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Pre-authentication, network-reachable, CVSS 10.0 and fixed, so it fits the S1 pre-auth-critical question, but it needs the HTTPS API reachable and a public certificate of a registered client, and no exploitation or public exploit is reported; S1 holds the vulnerability gates and may already have it."
    sources:
      - { url: "https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557", publisher: "Canonical / Ubuntu Discourse (security advisory)", date: "2026-10-28", role: "primary" }
      - { url: "https://ccb.belgium.be/advisories/warning-critical-authentication-vulnerability-canonical-lxd-and-microcloud-patch", publisher: "Centre for Cybersecurity Belgium", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (raw `url` fetch exposes /advisories/<slug> hrefs; page dated 03/11/2026) -> https://ccb.belgium.be/advisories/warning-critical-authentication-vulnerability-canonical-lxd-and-microcloud-patch -> primary: https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557 (cited by the CCB page)"
    summary: |
      Lookback item (CCB record lookback 97 h; the CCB warning is dated 2026-11-03, Canonical's advisory 2026-10-28 with point releases from 2026-10-29). Canonical's own advisory states the flaw was referred by the Incus project and confirmed to affect LXD: the remote API's mutual-TLS logic compared all peer certificates sent by the client to the known trust-store entries, although only the leaf certificate proves possession of the signing key, so an attacker who can reach the LXD HTTPS API and holds the public certificate of a trusted client places it as an intermediate certificate in the chain and is authenticated as that identity; depending on the victim's privilege this reaches full cluster and VM control and possibly root on the host. In MicroCloud, an attacker able to intercept the public certificate of a joining cluster member can authenticate as that member. CCB's CVSS 4.0 vector is network, no privileges, no user interaction, with high impact and subsequent-system impact (10.0), weakness CWE-295.
      Affected and fixed versions as given: LXD below 4.0.15, 5.0.11, 5.21.9 and 6.10.1 (fixed 4.0.15, 5.0.11, 5.21.9, 6.10.1 on the respective channels) and MicroCloud below 2.1.5 and 3.4.1 (fixed 2.1.5, 3.4.1); Canonical says all point releases were in progressive roll-out from candidate to stable and instructs `snap refresh lxd` and `snap refresh microcloud`. Neither Canonical nor CCB reports exploitation; CCB adds that patching does not remediate historic compromise. Exposure check: Canonical frames the precondition as an attacker who is able to reach the LXD HTTPS API, so instances whose API is reachable from untrusted networks are the exposed ones. Mechanically, clients presenting a chain longer than one certificate to the LXD API are the anomalous pattern; neither source offers a detection recipe, so treat that as inference from the stated mechanism.
    region_nexus: "global; open-source container and VM management used in private-cloud and hosting estates"
    primary_sector_nexus: "indirect: relevant only where Swiss public-sector or supplier estates run LXD or MicroCloud with the API exposed"
    sector: "public-sector"
    cves: [CVE-2026-112816]
    techniques: [T1190, T1078]
    affected_products: ["Canonical LXD", "Canonical MicroCloud"]
    entity_keys: []
    new_entities:
      - { key: "product:canonical-lxd", type: product, name: "Canonical LXD", aliases: ["LXD"], summary: "Canonical's system-container and virtual-machine manager with a remote HTTPS API; CVE-2026-112816 (mutual-TLS chain check) fixed in 4.0.15, 5.0.11, 5.21.9 and 6.10.1." }
      - { key: "product:canonical-microcloud", type: product, name: "Canonical MicroCloud", aliases: ["MicroCloud"], summary: "Canonical's multi-node LXD cluster product; CVE-2026-112816 fixed in 2.1.5 and 3.4.1." }
    verification: MULTI-SOURCE
    confidence: HIGH
    evidence:
      - quote: "The vulnerability allows an attacker that is able to reach the LXD HTTPS API to authenticate as any trusted TLS client, for which the attacker has the public certificate."
        attribution: "Canonical (Ubuntu Discourse security advisory)"
        source_url: "https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557"
      - quote: "The API mTLS authentication logic compares all certificates in the TLS chain sent by the client to known trust store entries instead of only comparing the leaf certificate."
        attribution: "Centre for Cybersecurity Belgium"
        source_url: "https://ccb.belgium.be/advisories/warning-critical-authentication-vulnerability-canonical-lxd-and-microcloud-patch"
      - quote: "Depending on the user they can impersonate, this gives them full access to the cluster and virtual machines, possibly allow root access."
        attribution: "Centre for Cybersecurity Belgium"
        source_url: "https://ccb.belgium.be/advisories/warning-critical-authentication-vulnerability-canonical-lxd-and-microcloud-patch"
    extended_notes: |
      CVE id taken from the CCB page; Canonical's advisory page text as fetched does not repeat the identifier, so the id rests on CCB (A-reliability authority). NVD was not consulted (per-CVE NVD pages are not citable and the id comes from an authority advisory).

