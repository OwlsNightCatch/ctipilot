        attribution: "Cybercrimepolice.ch (Kantonspolizei Zürich)"
        source_url: "https://cybercrimepolice.ch/de/faelle/gefaelschte-ehra-mail-fordert-zur-aktualisierung-von-handelsregisterdaten-auf"
