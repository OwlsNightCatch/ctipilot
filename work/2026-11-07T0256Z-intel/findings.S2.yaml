    discovery_trace: "first seen at: heise-sec feed https://www.heise.de/security/feed.xml (2026-11-06T14:06Z) -> https://www.heise.de/news/Plattformen-offline-Cyberangriff-auf-TU-Muenchen-11515734.html -> primary: https://www.tum.de/aktuelles/alle-meldungen/pressemitteilungen/details/it-sicherheitsvorfall-an-der-tum (linked from the heise article)"
    summary: |
      TUM's own incident page (status Friday 2026-11-06, 12:20) says unknown attackers attacked the myTUM portal and captured the passwords used for central sign-in to TUM systems (login.tum.de, TUMonline and others) from all persons who had signed in at myTUM, among them the credentials of a TUMonline system administrator; with those the attackers attacked the central campus-management system TUMonline, which TUM took off the network. Data possibly reached: for everyone the TUM-account password, name, private address and date of birth; for staff also the service address and work phone number; for students possibly matriculation number, course of study and number of semesters. TUMonline's own access logs were largely recorded, and on that evaluation TUM currently assumes no further TUMonline data such as grades or applications is affected (still being checked). TUM blocked the affected accounts, reported to the Bavarian data-protection commissioner and filed a criminal complaint. The university says accounts with multi-factor authentication were protected in this attack and asks users to change the password and then enable MFA. heise, quoting a TUM spokesperson, reports that the attackers entered through the legacy system myTUM, that about 60,000 students and employees are in scope, that password reset and MFA enrolment are impaired until TUMonline returns over the next days, and, citing "university circles", that the old system served as the entry point to current campus administration rather than being the target. The exact mechanism of the capture at myTUM is not stated by TUM.
      Transferable lesson, marked as such: a retired or secondary portal that still accepts the central directory password is a credential-harvest and pivot point into the primary identity and administration systems; an administrator account whose password was typed into that portal gave the step to the main system; and per TUM only MFA-protected accounts held. For Swiss cantonal schools, universities and public portals this maps to inventorying legacy sign-in portals that still validate against the central directory, requiring MFA on administrator accounts for campus and school-management systems, and checking whether a legacy front end ever saw administrator sign-ins. The Vaud school IT-support platform case already in the store is a related education-sector pattern.
