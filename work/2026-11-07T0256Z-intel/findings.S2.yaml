  - title: "Phishing in the name of the federal commercial-register office (EHRA): fake 'data update' mails with a six-working-day deadline lead to a Confederation look-alike site that collects company, person and IBAN data; BACS warns after numerous reports"
    novelty: new
    borderline: true
    borderline_reason: "Federal-authority brand abuse with an in-window BACS warning (two independent Swiss authorities), but the targets are companies and the data collected feeds later fraud, not a compromise of administrations; the main agent decides whether a Swiss-authority warning without a public-sector victim clears the bar."
    sources:
      - { url: "https://www.bacs.admin.ch/de/warnung-ehra-de", publisher: "BACS / NCSC Switzerland (Aktuelle Vorfälle)", date: "2026-11-06", role: "primary" }
      - { url: "https://cybercrimepolice.ch/de/faelle/gefaelschte-ehra-mail-fordert-zur-aktualisierung-von-handelsregisterdaten-auf", publisher: "Cybercrimepolice.ch (Kantonspolizei Zürich)", date: "2026-11-04", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-incidents, URL https://www.bacs.admin.ch/de/aktuelle-vorfaelle (card dated 6. November 2026) -> primary: https://www.bacs.admin.ch/de/warnung-ehra-de (also first card on ncsc-ch-focus https://www.bacs.admin.ch/de/im-fokus) -> corroboration: cybercrimepolice.ch RSS https://cybercrimepolice.ch/de/rss-feed -> https://cybercrimepolice.ch/de/faelle/gefaelschte-ehra-mail-fordert-zur-aktualisierung-von-handelsregisterdaten-auf (2026-11-04, two days earlier)"
    summary: |
      BACS (NCSC Switzerland) says it is currently receiving numerous reports about an allegedly necessary data update in the commercial register (EHRA, the Federal Commercial Registry Office) and that these are phishing messages; its advice is to delete them. The Kantonspolizei Zürich's cybercrimepolice.ch had described the same mail on 2026-11-04: it claims to come from the EHRA, says changes to the register entry showed the company data may be wrong, sets a deadline of six working days for the correction and threatens administrative measures, temporary deletion of the entry and difficulties in business transactions. It greets the "Geschäftsleitung" (management) in Swiss German ("Grüezi, sehr geehrte Geschäftsleitung"). The link leads to a site imitating the Swiss Confederation's appearance and staging the process as an official review: after a reference number it asks for personal, company and contact details, then claims to verify authorisation by IBAN and asks for the bank name, with progress bars and a final success message that make the inputs look like one administrative process. The police read the harvested data as the basis for later targeted fraud (spear-phishing by mail or vishing by phone, possibly again posing as the EHRA or as staff of the named bank); that is the police's assessment, not an observed follow-up.
      Defender relevance: the lure borrows a federal authority's identity and a statutory-sounding deadline, so the first line of defence is that the sender is not who it claims (BACS advises verifying the sender over an independent channel such as a separately researched official phone number or website, and watching for look-alike addresses such as info@firma-schweiz.com instead of info@firma.ch). For companies with little online presence BACS recommends a simple official website as the primary information source, a periodic online search for the company name, and staff awareness of third parties posing as partners or customers. Report to BACS; file a complaint with the cantonal police where money was lost.
    region_nexus: "Switzerland (federal authority impersonated; Swiss companies targeted; German-language lure)"
    primary_sector_nexus: "indirect: impersonates a federal authority; targets businesses; public bodies fielding enquiries and staff receiving the mail"
    sector: "public-sector, business"
    cves: []
    techniques: [T1598.003, T1566.002]
    affected_products: []
    entity_keys: []
    new_entities:
