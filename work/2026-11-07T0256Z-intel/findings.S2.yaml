        original: "Für die Korrektur wird eine Frist von sechs Arbeitstagen gesetzt."
        attribution: "Cybercrimepolice.ch (Kantonspolizei Zürich)"
        source_url: "https://cybercrimepolice.ch/de/faelle/gefaelschte-ehra-mail-fordert-zur-aktualisierung-von-handelsregisterdaten-auf"
    extended_notes: |
      The BACS page carries no technical indicators (by design, none are reproduced here). Admiralty suggestion: A for BACS and the police statement in their own jurisdiction, credibility 1 (two independent Swiss authorities).
      Detection concept: inbound mail claiming to be from a federal register office whose link domain is not a *.admin.ch address; web-proxy or DNS telemetry for staff visits to look-alike "Eidgenossenschaft" pages that post a form containing IBAN fields. Triage (inference from the lure's mechanics; the sources do not describe what a genuine EHRA contact looks like): the discriminators are the link domain, the demanded deadline and the request for bank data through a web form.

