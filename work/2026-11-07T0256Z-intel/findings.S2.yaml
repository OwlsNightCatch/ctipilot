      - { url: "https://www.netzwoche.ch/news/2025-02-24/kanton-aargau-will-cybersicherheit-staerken", publisher: "Netzwoche (2025 consultation outcome, background)", date: "2025-02-24", role: "background" }
    discovery_trace: "first seen at: inside-it-ch feed https://www.inside-it.ch/rss.xml -> https://www.inside-it.ch/aargau-staerkt-informationssicherheit-20261106 (body read from the page's __NEXT_DATA__ JSON) -> WebSearch (\"Aargau Informationssicherheitsverordnung InfoSiV Regierungsrat Cyber-Koordinator Kantonspolizei\" and an extended re-query) -> pivot: https://www.aargauerpolitik.ch/regierung-wahlt-cyber-koordinator/ (reproduces the cantonal department's communiqué; ag.ch media portal https://www.ag.ch/de/aktuelles/medienportal returned 404 and aargauerzeitung.ch returned 403, so the ag.ch primary page was not located) -> background: https://www.netzwoche.ch/news/2025-02-24/kanton-aargau-will-cybersicherheit-staerken"
    summary: |
      Cantonal implementation of the information-security regime, which the standing policy watch tracks. The Aargau Regierungsrat (government) adopted the Verordnung über die Informationssicherheit (InfoSiV) and set the entry into force of the information-security legislation (InfoSiG and InfoSiV) for 1 January 2027. The department's communiqué (Departement Finanzen und Ressourcen) says the law anchors uniform standards and a holistic information-security system in the cantonal administration; a Fachstelle für Informationssicherheit is to advise cantonal bodies and carry directive (Weisungs-) and enforcement powers so that one detection-and-defence strategy applies; a second Fachstelle runs personnel security vetting; and a cantonal Cyber-Koordinationsstelle is being built to protect authorities, businesses and the population. The vetting Fachstelle and the cyber coordination office sit at the Kantonspolizei Aargau, and the government elected Bernhard Droz, currently head of IT forensics and cybercrime at the cantonal police, as cyber coordinator from 2027-01-01.
      What changes for defenders, as stated: from 2027-01-01 Aargau cantonal bodies fall under one standard with a central unit that can issue binding instructions, which turns cantonal information-security governance into a concrete implementation task for 2026 (the sources describe the Fachstelle's powers, not detailed duties). What the sources do not state: the final scope towards communes and other bearers of public tasks. In the 2025 consultation outcome (Netzwoche, relaying the canton's communiqué) a majority approved including communes and other public-task bodies in the law's scope, so communal IT owners should read the final text; the 2026 communiqué relays do not say whether that proposal survived. The planned start has also moved: the 2025 report targeted 1 July 2026.
      Why it matters beyond Aargau: it follows the Bern ICSG law (in force 2026-11-01, already covered) as a second cantonal law that sets up a central body with directive powers, which shapes which office Swiss cantonal defenders will take instructions from.
    region_nexus: "Switzerland: canton Aargau (cantonal administration; communal scope unconfirmed)"
