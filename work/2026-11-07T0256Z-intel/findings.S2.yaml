        original: "Das BACS erhält derzeit zahlreiche Meldungen bezüglich einer angeblich notwendigen Datenaktualisierung im Handelsregister (EHRA). Es handelt sich dabei um Phishing-Nachrichten."
        attribution: "BACS / NCSC Switzerland"
