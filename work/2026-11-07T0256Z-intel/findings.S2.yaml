  - title: "Refrigeration controllers: NCSC Switzerland updated its advisory on 2026-11-06 to acknowledge the Swiss incidents, add Copeland/Dixell XWEB and the blood-service case, and set a four-point checklist for any cooling plant including supplier-managed ones"
    novelty: "update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13054", publisher: "NCSC Switzerland (Security Hub advisory 13054, edited 2026-11-06T10:54Z)", date: "2026-11-06", role: "primary" }
      - { url: "https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update", publisher: "ICTjournal", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub (ncsc-csh recent 25 via python3 tools/fetch_source.py), post 13054 lastModified 2026-11-06T10:54:22Z with history reason 'Update: 6 November 2026, added Swiss incidents, Copeland/Dixell XWEB and healthcare attacks.' -> primary (no pivot needed); Swiss-case corroboration: ICTjournal feed https://www.ictjournal.ch/rss.xml -> https://www.ictjournal.ch/news/2026-11-06/les-cyberattaques-contre-les-congelateurs-font-une-victime-en-suisse-update (relays SRF 2026-11-05, already cited in the entry)"
    summary: |
      Delta for the existing entry, not a new finding. NCSC Switzerland's own advisory (published 2026-10-13, which the entry already cites as corroborating) was edited on 2026-11-06 10:54 UTC; the hub's edit history records the reason as "added Swiss incidents, Copeland/Dixell XWEB and healthcare attacks". What the update states, as facts: Swiss media report manipulation of refrigeration controllers in Switzerland; the updated CERT-FR alert also names Copeland/Dixell XWEB next to Danfoss AK-SM and AK-SC, and Copeland's guidance addresses end-of-service XWEB EVO systems (migrate to a supported platform) while supported XWEB PRO systems must still be kept off direct internet access; healthcare is hit too, with refrigeration settings altered at three sites of France's national blood service after an incident at a refrigeration equipment provider. NCSC adds an explicit evidential limit: the public information it reviewed does not establish a common attack method across the incidents or confirm exploitation of the specific Danfoss CVEs (CVE-2025-41450/41451/41452) it lists as "alleged as potentially related". Its summary widens the audience beyond food supply, to healthcare and other users of specialised cooling equipment.
      The Swiss authority's four actions go further than the entry's current NCSC reference and are the defender-relevant new content: (1) review refrigeration management systems across all relevant operations, expressly including equipment managed by external service providers; (2) remove direct internet access to management interfaces and provide remote access only through a secure VPN or protected network; (3) check temperature settings, defrost schedules, alarm thresholds, notification recipients and user accounts, verify actual temperatures and test alarm delivery; (4) apply the latest supported firmware and manufacturer hardening guidance and plan replacement of equipment that no longer gets updates. For suspected compromise it says to coordinate containment and recovery with the refrigeration provider and the security team, and that a factory reset alone is insufficient if the system remains vulnerable and directly reachable from the internet.
      Main-agent checks before composing the record: the entry currently says no source names make, route or maintenance provider in the Swiss cases (consistent with NCSC, which names none); verify whether `actions[]` already carries the alarm-delivery test, notification-recipient and supplier-managed-equipment review (those are the new points for healthcare and for any public body whose cooling plant is run by a contractor); NCSC's "alleged as potentially related" wording for the Danfoss 2025 CVEs is consistent with the entry's empty cves[].
