  - title: "Oneconsult: the File System Access API as an initial-access and persistence channel in Chrome and Edge, with the Chromium blocklist gaps that leave .vscode, PowerShell profile folders, the public desktop, SMB shares and OneDrive writable once a user clicks twice"
    novelty: new
    lookback: true
    sources:
      - { url: "https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/", publisher: "Oneconsult AG (Switzerland)", date: "2026-11-02", role: "primary" }
      - { url: "https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/", publisher: "Daniel Oz (Rogue Sandbox, original technique write-up)", date: "2026-07-05", role: "corroborating" }
    discovery_trace: "first seen at: oneconsult-ch feed https://www.oneconsult.com/en/feed/ (item dated Mon 02 Nov 2026 15:45 UTC; the page's own metadata reads 2026-11-04) -> primary: https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/ (extract) -> its cited prior work: https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/"
    summary: |
      Lookback item from the Swiss pen-test firm Oneconsult's research blog (record lookback 121 h). The post analyses the Chromium source (tests July 2026 on Windows 11 with Chrome and Edge 150.0.7871.101) to show what a website can reach through the File System Access API (showDirectoryPicker, readwrite) after the user selects a folder and confirms a second permission prompt: with one call the site gets read and write access to almost every file and subdirectory in that folder, the handle does not expire while the tab is open and can be restored from IndexedDB after the tab is closed with one re-confirmation. Chrome's per-platform blocklist (generated once, cached, "nearest ancestor wins") blocks AppData, Program Files, Windows, .ssh, .gnupg and the browser profile, but its kDontBlockChildren rule on the home, Desktop, Documents and Downloads directories leaves their subfolders selectable. The attack paths the post demonstrates: credential and secret theft from .Azure token caches, .vscode .env files and similar; persistence by dropping a fake extension into .vscode\extensions (Node.js ignores Mark of the Web, and the code runs inside the normal code.exe process); persistence through the PowerShell profile or a module entry point in Documents\WindowsPowerShell, which only works where the execution policy is Bypass or Unrestricted because the API stamps every written file with ZoneId=3; file drops on C:\Users\Public\Desktop and into SMB shares (new executables and scripts trigger the Mark-of-the-Web warning, "a certain percentage of users" acknowledge it); and an interactive "file proxy" over WebSocket that lets an operator browse and edit the selected tree in real time from a still-open tab with no process on the host. OneDrive Known Folder Move produces a stale-blocklist bypass: if Desktop is redirected into OneDrive after Chrome has started, the new path is not in the cached blocklist (observed for Desktop, not for Documents); the post says it was reported to Google and that Google made the issue public. A separate drag-and-drop path returns handles to individual files in blocked directories, which Google classed as not a security issue.
      Defender levers named by the post: Chrome and Edge enterprise policies for file system read and write access (FileSystemReadAskForUrls, FileSystemWriteAskForUrls and the respective AskForUrls policies), AppLocker or WDAC for script control, awareness training on sites that ask the user to pick a folder, and detection of unexpected writes to PowerShell profiles and VS Code extension folders plus monitoring of the Zone.Identifier stream, whose ReferrerUrl and HostUrl fields keep the origin of the page that wrote a file. The post stresses that EDR sees only the browser reading and writing files, which is normal for web editors, so, following from that mechanism, the useful discriminators are the origin page in Zone.Identifier and writes into persistence locations rather than the file activity itself. The base technique is from Daniel Oz's July 2026 "Rogue Sandbox" write-up; the blocklist analysis and attack-path catalogue are Oneconsult's.
    region_nexus: "Swiss research firm; technique class is global (Chromium-based browsers on Windows)"
    primary_sector_nexus: "indirect: the technique class applies wherever Chromium-based browsers and OneDrive Known Folder Move are deployed; the source carries no Swiss estate data"
    sector: "public-sector"
    cves: []
    techniques: [T1204.001, T1176.002, T1546.013, T1552.001, T1005, T1080]
    affected_products: ["Google Chrome", "Microsoft Edge", "Microsoft OneDrive"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    sourcing_note: "The attack paths and blocklist observations are Oneconsult's own testing (single source); only the base technique (folder-level readwrite permission turned into a write surface) is corroborated by the earlier Rogue Sandbox write-up. The Chromium issue tracker entries cited by Oneconsult were not fetched."
    evidence:
      - quote: "When called in readwrite mode, the website gains full read and write access to (almost) every file and subdirectory in the selected folder with a single call."
        attribution: "Oneconsult"
        source_url: "https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"
      - quote: "The beacon runs within the VSCode process. EDR solutions that monitor process creation only see the normal code.exe process."
        attribution: "Oneconsult"
