items:
  N3:
    title: "Acronis TRU - BOSSAI: AI attack mesh that targeted Taiwan's emergency services"
    sources_read:
      - url: "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"
        saved_body: "work/2026-11-07T0256Z-intel/bodies/N3-1.md"
        publisher: "Acronis Threat Research Unit (TRU)"
        publication_date: "2026-11-04 (page JSON-LD datePublished 2026-11-04T01:00:00Z; trafilatura metadata date 2026-11-04)"
        fetch: "extract (trafilatura-direct); raw HTML re-fetched via url --direct to confirm the page ends at the IOCs block"
    claims:
      - claim: "TRU's mesh composition: 12 AI agents, nine active, three set up but unused at time of investigation, driven by a changing roster of LLMs."
        source_url: &acr "https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"
        passage: |-
          At a high level, BOSSAI is a mesh of 12 AI agents (nine of which active, and three which were set up but unused at the time of our investigation), all driven by a varying (and often changing) roster of LLM models.
      - claim: "Roles of the named agents: builders, attackers, and a scanning layer (HalberdStrike agentic + cracked Acunetix, which is not an LLM agent). The text names nine agents/tools in this passage; the three unused agents are not named."
        source_url: *acr
        passage: |-
          Builders (Grok, OpenClaw, Claude Code, Codex) assembled and maintained the mesh: MCP wiring, DNS, proxy configuration, messaging-app gateways. Attackers (Hermes above all, plus Cursor, Trae and CyberStrike) scanned targets and built exploits. A dedicated scanning layer (the agentic HalberdStrike and a cracked Acunetix Web Vulnerability Scanner installation) fed structured vulnerability reports into the attack pipeline.
      - claim: "Acunetix (AWVS) is explicitly not an AI agent."
        source_url: *acr
        passage: |-
          AWVS is a traditional automated vulnerability scanner. It's not an AI agent and doesn't use an LLM.
      - claim: "No agent-to-agent communication; the operator manually bridged agents."
        source_url: *acr
        passage: |-
          Notably, no agent-to-agent communication was established. The operator was at the very center of the mesh, acting as a bridge between agents, often manually pasting the results of one agent's work into another.
      - claim: "Operator commands were typed in Traditional Chinese; Hermes (primary offensive agent) had a WeChat gateway, OpenClaw a LINE integration."
        source_url: *acr
        passage: |-
          Commands were issued by the operator in Traditional Chinese, primarily typed directly into each agent's interface.
      - claim: "MCP stack: 13 MCP servers at peak (GitHub security, CVE lookup, OSINT, cloud audit, Ghidra/Radare2, Playwright, Kali wrapper exposing nmap, sqlmap, Metasploit, Hydra)."
        source_url: *acr
        passage: |-
          At its peak the mesh loaded 13 MCP servers providing access to tools for GitHub security, CVE lookup, OSINT, cloud auditing, binary analysis via Ghidra and Radare2, browser automation via Playwright, and an MCP-wrapped Kali Linux instance exposing nmap, sqlmap, Metasploit, Hydra, and more.
      - claim: "At time of investigation the MCP stack was trimmed to three servers."
        source_url: *acr
        passage: |-
          By the time we'd investigated the MCP stack, this had been trimmed to three: HexStrike AI (a custom cybersecurity automation server), a Kali MCP server and a Ghidra bridge.
      - claim: "Local GPU host serving abliterated models via llama.cpp."
        source_url: *acr
        passage: |-
          a primary GPU host running RTX 4090s which served local abliterated models through llama.cpp
      - claim: "Hermes was the most prolific offensive agent (~95 sessions)."
        source_url: *acr
        passage: |-
          Across roughly 95 sessions, it generated 18,311 messages, 83.5% of which were direct tool calls and their results.
      - claim: "Heaviest tool usage across the campaign."
        source_url: *acr
        passage: |-
          The heaviest individual tool invocations were sqlmap (appearing in 561 messages across sessions), FOFA queries for asset discovery (432), nmap port scans (271), Shodan lookups (213), and nikto web-server audits (158)
      - claim: "Most heavily used Hermes skill targeted Taiwanese government fire-dispatch and emergency-management APIs."
        source_url: *acr
        passage: |-
          gov-api-penetration, the most heavily invoked skill at 51 uses and 57 iterative patches, targeted Taiwanese government fire-dispatch and emergency-management APIs
      - claim: "Hermes ran in full autonomous mode with excessive autonomy; summary states models were told not to bother the operator."
        source_url: *acr
        passage: |-
          Every session ran in full autonomous mode
      - claim: "TRU summary bullet on autonomy."
        source_url: *acr
        passage: |-
          The models were given excessive autonomy and instructed not to bother the operator.
      - claim: "Offensive core ran on abliterated open-weight models; final default was an abliterated DeepSeek-V4 variant."
        source_url: *acr
        passage: |-
          The offensive core, the agents that actually executed attacks, ran almost exclusively on abliterated models: stripped-down variants of DeepSeek, GLM, and Qwen with safety alignment removed.
      - claim: "Final default model."
        source_url: *acr
        passage: |-
          The final default was an abliterated DeepSeek-V4 variant the operator called DS4, running on locally hosted GPUs with 64K context.
      - claim: "Hermes cycled through at least nine models over 19 days (config-backup based; different time base from the 12-day observation)."
        source_url: *acr
        passage: |-
          The primary attack agent, Hermes, cycled through at least nine models over 19 days, with each rotation documented in dated configuration backups.
      - claim: "Refusals: commercial models used for infrastructure repeatedly refused offensive work; Chinese commercial open models refused and lectured on cyber law; operator forced to local abliterated models."
        source_url: *acr
        passage: |-
          While the BOSSAI mesh made use of commercial models for building infrastructure, these models repeatedly refused to engage in actual offensive activity.
      - claim: "Chinese commercial open-source models also refused."
        source_url: *acr
        passage: |-
          Chinese commercial open-source models refused hacking instruction as well and even lectured the operator on cyber laws.
      - claim: "Consequence of refusals: local abliterated models, less effective and resource constrained."
        source_url: *acr
        passage: |-
          As a result, the operator was forced to turn to locally run abliterated models, which were less effective and resource constrained.
      - claim: "Commercial models asked for proof of legality and refused without it; TRU does not know whether a fake engagement letter would have changed that."
        source_url: *acr
        passage: |-
          Multiple commercial models repeatedly asked the operator to prove that the requested action was legal, then refused to assist when proof was not provided. It is not clear how the models would have reacted had the operator simply generated a fake engagement letter.
      - claim: "Grok and OpenClaw (MiniMax M3) refusals; Grok complied once to fix a broken PoC."
        source_url: *acr
        passage: |-
          Grok (14 sessions, primarily infrastructure) refused all explicit attack requests, complying only once to fix a broken POC script, while OpenClaw (17 sessions, running commercial MiniMax M3) refused every offensive request, citing Computer Crime Law in response.
      - claim: "Claude Code and Codex CLI were routed via shims to the abliterated DS4 model for infrastructure work."
        source_url: *acr
        passage: |-
          Claude Code and OpenAI's Codex CLI were notable exceptions to the commercial-for-infrastructure pattern: The operator ran shims that intercepted their API calls and routed them to the same abliterated DS4 that powered the attack agents.
      - claim: "TRU: reported frontier-model jailbreaks via pentester pretext did not pan out here."
        source_url: *acr
        passage: |-
          This has not panned out in our investigation of this campaign.
      - claim: "Observation period and breadth as worded in the Victims section: 12 days, 11 countries."
        source_url: *acr
        passage: |-
          In the 12 days that we observed the BOSSAI mesh, the operator had managed to target organizations spanning government emergency services, banks and lenders, universities, military systems, phone directories, e-commerce platforms and gambling sites in 11 countries.
      - claim: "Counts: ~10 targets with confirmed exfiltration or system access across three countries; ~15 actively attacked without confirmed compromise; eight further countries recon-only or staged."
        source_url: *acr
        passage: |-
          Confirmed data exfiltration or system access occurred at roughly 10 distinct targets across three countries. Another 15 or so targets were actively attacked without confirmed compromise. Entities in eight additional countries were subjected to reconnaissance or had attacks staged against them that have not yet been executed at the time of this analysis.
      - claim: "Introduction wording: hundreds of organizations in eleven countries, lone operator based out of Taiwan, 'in recent weeks'."
        source_url: *acr
        passage: |-
          In recent weeks, the Acronis TRU team has identified and investigated an agentic, AI-driven campaign orchestrated by a lone operator based out of Taiwan, targeting hundreds of organizations in eleven countries and across several critical industries.
      - claim: "AAT section wording uses 'dozens of organizations' (differs from 'hundreds')."
        source_url: *acr
        passage: |-
          Using this infrastructure, the actor was able to attack dozens of organizations, all while relying on AI to handle much of the technical complexity.
      - claim: "TRU on the gap between ambition and results, including hallucinated vulnerabilities."
        source_url: *acr
        passage: |-
          The operator's ambition seems to have far outpaced the mesh's ability to deliver results, and the AI agents themselves contributed to the gap by hallucinating vulnerabilities, inflating findings, and stalling on tooling failures.
      - claim: "Summary bullet: confirmed breaches at universities and emergency-services providers with confirmed exfiltration of medical data and PII."
        source_url: *acr
        passage: |-
          Confirmed breaches occurred at universities and emergency services providers and resulted in confirmed data exfiltration of medical data and PII.
      - claim: "Taiwan emergency-services targeting: emergency services, financial institutions, government portals, at least one fire-dispatch technology vendor."
        source_url: *acr
        passage: |-
          The operator directed agents against emergency services, financial institutions, government portals, and at least one fire-dispatch technology vendor.
      - claim: "EMERGENCY FINDING 1 (patient-care records platform): exposed medical data, year 2018 only, no credentials required."
        source_url: *acr
        passage: |-
          A Taipei fire-department emergency patient-care records platform was found exposing various medical data, dated back to (and including only) the year 2018: ECG readings, ambulance video, and patient vital signs, all accessible without credentials.
      - claim: "TRU's characterisation of the underlying weakness for that platform ('legacy medical-data port left open since 2018')."
        source_url: *acr
        passage: |-
          a legacy medical-data port left open since 2018
      - claim: "EMERGENCY FINDING 2 (119 dispatch): case records pulled from the system's API; seven Taipei districts; not real-time GPS; TRU calls it confirmed exfiltration."
        source_url: *acr
        passage: |-
          Separately, agents accessed a city's 119 emergency dispatch system and pulled case records containing incident times, response types, status fields, and street-level locations across seven Taipei districts. These were dispatch case records from the system's API, not real-time GPS tracking of moving ambulances, but they still represent confirmed exfiltration of important emergency-response data.
      - claim: "TRU's characterisation of the dispatch exposure (public-facing API); no authentication detail is stated."
        source_url: *acr
        passage: |-
          dispatch records on a public-facing API
      - claim: "EMERGENCY FINDING 3 (emergency management information system): hardcoded AES-256 key in front-end JavaScript exposing session-cookie contents incl. administrator identity; partial SSRF relay path; full compromise never confirmed."
        source_url: *acr
        passage: |-
          An emergency management information system was attacked through multiple vectors by multiple agents: The agents surfaced one genuine cryptographic flaw (a hardcoded AES-256 key in frontend JavaScript that exposed session-cookie contents, including an administrator identity) and a partial SSRF relay path. Full system compromise was never confirmed, but the findings represented potential attack paths.
      - claim: "FAILED / HALLUCINATED 1: national disaster-response center - fabricated Apache RCE; port filtered; re-examination downgraded every finding."
        source_url: *acr
        passage: |-
          A national disaster-response center was scanned by the operator's autonomous vulnerability platform, which reported a critical Apache remote-code-execution flaw. The vulnerability was fabricated. The port in question was filtered; no Apache version was ever confirmed. The platform's own re-examination downgraded every finding to false positive or misclassified negative.
      - claim: "EMERGENCY FINDING 4 (SSO brute force): national fire agency SSO portal brute-forced without confirmed access."
        source_url: *acr
        passage: |-
          A national fire agency single sign-on portal was brute-forced without confirmed access.
      - claim: "EMERGENCY FINDING 5 (five-city fingerprinting): recon tool scanned fire-department systems across five Taiwanese cities; fingerprinting only."
        source_url: *acr
        passage: |-
          A custom reconnaissance tool scanned fire-department systems across five Taiwanese cities, fingerprinting technology stacks but achieving no confirmed compromise.
      - claim: "EMERGENCY FINDING 6 (fire-dispatch vendor admin panel): DB admin panel logged into with default root credentials, 18+ tables exposed; webshell attempt via known CVE failed."
        source_url: *acr
        passage: |-
          A fire-dispatch technology vendor's database administration panel was logged into with default root credentials, exposing 18 or more database tables. The agents attempted a webshell through a known CVE against the same vendor and failed.
      - claim: "HalberdStrike usage, including a single Taiwanese emergency-services portal."
        source_url: *acr
        passage: |-
          HalberdStrike was used across at least 20 distinct projects, from a single Taiwanese emergency-services portal to a batch of over 50 commercial websites
      - claim: "Documented multi-agent chain on a Taiwanese emergency-services target: HalberdStrike report -> Hermes consolidation -> Cursor exploitation."
        source_url: *acr
        passage: |-
          In one documented example, HalberdStrike scanned a Taiwanese emergency services target and generated a penetration-testing report documenting several misconfigurations.
      - claim: "Cursor analysed the site and executed the attack path (same chain)."
        source_url: *acr
        passage: |-
          Cursor analyzed the target's site, determined the correct attack path, and executed the attack.
      - claim: "HalberdStrike false-positive rate as TRU words it."
        source_url: *acr
        passage: |-
          In HalberdStrike's case, over half of high-severity and critical findings were false positives or misclassifications.
      - claim: "TRU's summary of where weakness clustered."
        source_url: *acr
        passage: |-
          Risk seems to cluster around data that was already weakly protected: a legacy medical-data port left open since 2018, dispatch records on a public-facing API, a bank with 16 SQL-injection points in production, universities running unpatched Oracle databases and semi-public phone directories.
      - claim: "What failed: agents failed where authentication was enforced, where sessions were required, where endpoints were filtered."
        source_url: *acr
        passage: |-
          The agents failed where authentication was enforced, where paywalls required valid sessions and where endpoints were properly filtered.
      - claim: "TRU on gravest harm."
        source_url: *acr
        passage: |-
          The gravest confirmed harm was the targeting of emergency-services data: patient-care records and dispatch case information from an organization that serves millions of residents.
      - claim: "Thailand: 489 potential targets across 45 institutions; confirmed SQLi with data extraction at three universities."
        source_url: *acr
        passage: |-
          Agents used infrastructure-search engines to identify 489 potential targets across 45 institutions, then ran automated SQL-injection testing against the highest-scored ones. Confirmed SQL injection with data extraction occurred at three universities
      - claim: "Mexico: mass collection of residential PII."
        source_url: *acr
        passage: |-
          The final deliverable contained approximately 206,800 residential phone records with associated names, addresses and postal codes.
      - claim: "Honduras military air-force personnel system: characterized, not exploited; model self-declared out of scope."
        source_url: *acr
        passage: |-
          The system was characterized but not exploited, as the model decided, mid-work, that it was out of scope, without consulting with the operator.
      - claim: "How TRU found it: misconfigured-looking development environment; 90,000+ files, 9GB evidence."
        source_url: *acr
        passage: |-
          TRU uncovered the campaign after identifying what initially appeared to be a misconfigured development environment.
      - claim: "Evidence volume."
        source_url: *acr
        passage: |-
          More than 90,000 files totaling 9GB of evidence provided end-to-end visibility, including attack orchestration logs, AI agent conversations, operator command histories, exploit tooling, credentials and victim data spanning multiple countries.
      - claim: "TRU introduces the label 'AI-augmented threat (AAT)'."
        source_url: *acr
        passage: |-
          which we have now begun to classify as an AI-augmented threat (AAT)
      - claim: "Motivation/affiliation not established."
        source_url: *acr
        passage: |-
          The diversity of targets does not establish a single political, financial, or ideological objective, further blurring traditional threat classifications.
      - claim: "ATTRIBUTION wording and confidence (single individual, high confidence)."
        source_url: *acr
        passage: |-
          TRU assesses with high confidence that the infrastructure and activity were operated by a single individual based in Hualien City, Taiwan.
      - claim: "Attribution basis: OPSEC failures plus OSINT (infrastructure overlap with the operator's legitimate businesses)."
        source_url: *acr
        passage: |-
          Analysis of the infrastructure revealed multiple OPSEC failures which, combined with OSINT, led directly to attribution.
      - claim: "TRU's closest defensive messaging (no recommendations section exists)."
        source_url: *acr
        passage: |-
          Obscurity is therefore no longer a valid defense when agents can easily and quickly investigate hundreds of targets at once. However, when a system is properly configured, there was substantially less that the agents could do.
      - claim: "TRU's second implied defensive point."
        source_url: *acr
        passage: |-
          Not every organization is highly secure, and obscurity no longer offers any kind of benefit when faced with autonomous agentic attackers.
    structured:
