        source_url: *onec
        passage: |-
          In Documents\WindowsPowerShell\Modules\, there are installed PowerShell modules such as Az.Accounts, Microsoft.Graph, or custom modules.
      - claim: "[Oneconsult] Module backdoor runs on import."
        source_url: *onec
