    claims:
      - claim: "[ag.ch communique] Adoption of the ordinance and decision on entry into force of the information-security legislation on 1 January 2027."
        source_url: &agc "https://www.ag.ch/de/medien/medienmitteilungen?mm=bulletin-zur-regierungsratssitzung-b790d5a8-ec12-4162-98c6-daac664c6033_de"
        passage: |-
          Der Regierungsrat hat die Verordnung über die Informationssicherheit (InfoSiV) verabschiedet und gleichzeitig die Inkraftsetzung der Informationssicherheitsgesetzgebung (InfoSiG und InfoSiV) auf den 1. Januar 2027 beschlossen.
        translation: "The Government Council has adopted the ordinance on information security (InfoSiV) and at the same time decided that the information-security legislation (InfoSiG and InfoSiV) comes into force on 1 January 2027."
      - claim: "[ag.ch communique] Release headline."
        source_url: *agc
        passage: |-
          Informationssicherheit: Regierungsrat beschliesst Inkraftsetzung der Informationssicherheitsgesetzgebung und wählt Cyber-Koordinator
        translation: "Information security: Government Council decides on entry into force of the information-security legislation and elects a cyber coordinator."
      - claim: "[ag.ch communique] Canton's own characterisation of the legal basis."
        source_url: *agc
        passage: |-
          Der Kanton Aargau verfügt damit über zukunftsweisende rechtliche Grundlagen zur Stärkung der Informations- und Cybersicherheit.
        translation: "The canton of Aargau thus has forward-looking legal foundations for strengthening information and cyber security."
      - claim: "[ag.ch communique] Rationale: rising cyber attacks; single legal basis; attacks can make statutory state tasks impossible."
        source_url: *agc
        passage: |-
          Angesichts zunehmender Cyberangriffe ist die Schaffung einer einheitlichen Rechtsgrundlage für den ganzheitlichen Schutz von Informationen und Daten unabdingbar.
        translation: "In view of increasing cyber attacks, creating a uniform legal basis for the holistic protection of information and data is indispensable."
      - claim: "[ag.ch communique] Consequence of attacks as the canton words it."
        source_url: *agc
        passage: |-
          Cyberangriffe können erhebliche finanzielle Folgen haben und in schwerwiegenden Fällen sogar die Erfüllung gesetzlicher Aufgaben des Staates verunmöglichen.
        translation: "Cyber attacks can have considerable financial consequences and, in serious cases, even make it impossible for the state to fulfil its statutory tasks."
      - claim: "[ag.ch communique] Scope as worded: uniform standards and an information-security system in the cantonal administration."
        source_url: *agc
        passage: |-
          Das neue Informationssicherheitsgesetz sieht unter anderem vor, in der kantonalen Verwaltung einheitliche Standards und ein ganzheitliches Informationssicherheitssystem zu verankern.
        translation: "The new information security act provides, among other things, for anchoring uniform standards and a holistic information-security system in the cantonal administration."
      - claim: "[ag.ch communique] FACHSTELLE FÜR INFORMATIONSSICHERHEIT powers: advises cantonal bodies; to be equipped with directive (Weisungs-) and enforcement (Durchsetzungs-) powers (modality: 'soll ... ausgestattet werden')."
        source_url: *agc
        passage: |-
          Eine Fachstelle für Informationssicherheit soll die kantonalen Stellen beraten und mit Weisungs- und Durchsetzungsbefugnissen ausgestattet werden, um eine schlagkräftige einheitliche Erkennungs- und Abwehrstrategie umsetzen zu können.
        translation: "An information-security specialist unit is to advise the cantonal bodies and be equipped with powers to issue directives and to enforce, so that an effective, uniform detection and defence strategy can be implemented."
      - claim: "[ag.ch communique] Second unit: Fachstelle für Personensicherheitsprüfungen (personnel security vetting)."
        source_url: *agc
        passage: |-
          Eine weitere Fachstelle für Personensicherheitsprüfungen soll das Risiko einer Beeinträchtigung der Sicherheitsinteressen des Kantons identifizieren, das mit der Ausübung einer sicherheitsrelevanten Tätigkeit durch eine bestimmte Person bestehen könnte.
        translation: "A further specialist unit for personnel security checks is to identify the risk of impairment of the canton's security interests that could arise from a particular person carrying out a security-relevant activity."
      - claim: "[ag.ch communique] Cantonal Cyber-Koordinationsstelle being built; protection target 'authorities, economy and population'."
        source_url: *agc
        passage: |-
          Um Behörden, Wirtschaft und Bevölkerung besser vor Cyber-Bedrohungen zu schützen, wird zudem eine kantonale Cyber-Koordinationsstelle aufgebaut.
        translation: "To better protect authorities, businesses and the population against cyber threats, a cantonal cyber coordination office is also being set up."
      - claim: "[ag.ch communique] PLACEMENT: the personnel-security unit and the cyber coordination office are located at Kantonspolizei Aargau (KAPO). The placement of the Fachstelle für Informationssicherheit is not stated."
        source_url: *agc
        passage: |-
          Sowohl die Fachstelle für Personensicherheitsprüfungen als auch die Cyber-Koordinationsstelle sind bei der Kantonspolizei Aargau (KAPO) verortet.
        translation: "Both the personnel-security-vetting unit and the cyber coordination office are located at the Cantonal Police Aargau (KAPO)."
      - claim: "[ag.ch communique] APPOINTMENT: Government Council elected the head of the cyber coordination office / cyber coordinator as of 1 January 2027."
        source_url: *agc
        passage: |-
          Der Regierungsrat hat für die Leitung der Cyber-Koordinationsstelle und somit für die Funktion als Cyber-Koordinator per 1. Januar 2027 Bernhard Droz gewählt.
        translation: "For the head of the cyber coordination office, and hence the function of cyber coordinator, the Government Council has elected Bernhard Droz as of 1 January 2027."
      - claim: "[ag.ch communique] Appointee's current role as stated."
        source_url: *agc
        passage: |-
          Bernhard Droz ist zurzeit Dienstchef IT-Forensik und Cybercrime bei der KAPO und bringt aufgrund seiner Erfahrung und Vernetzung optimale Voraussetzungen für diese Funktion mit.
        translation: "Bernhard Droz is currently head of service for IT forensics and cybercrime at KAPO and, owing to his experience and network, brings ideal prerequisites for this function."
      - claim: "[aargauerpolitik.ch] Attribution line: the item reports the Departement Finanzen und Ressourcen's release (text otherwise identical to the ag.ch bulletin)."
        source_url: &agp "https://www.aargauerpolitik.ch/regierung-wahlt-cyber-koordinator/"
        passage: |-
          Dies meldet das Departement Finanzen und Ressourcen.
        translation: "This is reported by the Department of Finance and Resources."
      - claim: "[aargauerpolitik.ch] Same adoption/entry-into-force sentence as the ag.ch bulletin."
        source_url: *agp
        passage: |-
          Der Regierungsrat hat die Verordnung über die Informationssicherheit (InfoSiV) verabschiedet und gleichzeitig die Inkraftsetzung der Informationssicherheitsgesetzgebung (InfoSiG und InfoSiV) auf den 1. Januar 2027 beschlossen.
        translation: "Same as the ag.ch bulletin sentence above."
      - claim: "[aargauerpolitik.ch] Same placement sentence as the ag.ch bulletin."
        source_url: *agp
        passage: |-
          Sowohl die Fachstelle für Personensicherheitsprüfungen als auch die Cyber-Koordinationsstelle sind bei der Kantonspolizei Aargau (KAPO) verortet.
        translation: "Same as the ag.ch bulletin sentence above."
      - claim: "[inside-it.ch] Adoption: ordinance (InfoSiV) adopted; 'the associated law' is to enter into force on 1 January 2027 (modality: 'soll ... in Kraft treten')."
        source_url: &iit "https://www.inside-it.ch/aargau-staerkt-informationssicherheit-20261106"
        passage: |-
          Der Regierungsrat des Kantons Aargau hat die Informationssicherheitsverordnung (InfoSiV) verabschiedet. Das dazugehörige Gesetz soll am 1. Januar 2027 in Kraft treten.
        translation: "The Government Council of the canton of Aargau has adopted the information security ordinance (InfoSiV). The associated law is to enter into force on 1 January 2027."
      - claim: "[inside-it.ch] Goal wording (uniform security standards in the cantonal administration to detect and close gaps early)."
        source_url: *iit
        passage: |-
          Dieses sieht vor, in der kantonalen Verwaltung einheitliche Sicherheitsstandards festzulegen, um Lücken und Schwachstellen frühzeitig zu erkennen und zu schliessen.
        translation: "It provides for setting uniform security standards in the cantonal administration in order to detect and close gaps and vulnerabilities early."
      - claim: "[inside-it.ch] Only inside-it states the government has dealt with the draft since early last year (i.e. early 2025); not in the ag.ch bulletin."
        source_url: *iit
        passage: |-
          Seit Anfang letzten Jahres hat sich der Regierungsrat mit dem Gesetzentwurf befasst.
        translation: "Since the beginning of last year the Government Council has been dealing with the draft law."
      - claim: "[inside-it.ch] Fachstelle powers (inside-it uses the past tense 'wurde ... geschaffen' - 'was created'; the ag.ch bulletin says 'soll ... ausgestattet werden')."
        source_url: *iit
        passage: |-
          Für eine koordinierte Erkennungs- und Abwehrstrategie wurde laut Mitteilung eine Fachstelle für Informationssicherheit mit Weisungs- und Durchsetzungsbefugnissen geschaffen.
        translation: "For a coordinated detection and defence strategy, according to the release, an information-security specialist unit with directive and enforcement powers was created."
      - claim: "[inside-it.ch] Fachstelle audience as inside-it words it: advise and support all cantonal administrative bodies."
        source_url: *iit
        passage: |-
          Sie soll alle kantonalen Verwaltungsstellen beraten und unterstützen.
        translation: "It is to advise and support all cantonal administrative bodies."
      - claim: "[inside-it.ch] Cyber coordination office protects authorities, businesses and population; located at Kantonspolizei Aargau together with the personnel-security unit."
        source_url: *iit
        passage: |-
          Die neu aufgebaute Cyber-Koordinationstelle soll laut Mitteilung Behörden, Unternehmen und Bevölkerung besser vor Cyberbedrohungen schützen. Sie ist zusammen mit der Fachstelle für Personensicherheit an der Kantonspolizei Aargau angesiedelt.
        translation: "The newly established cyber coordination office is, according to the release, to better protect authorities, companies and the population against cyber threats. It is located at the Cantonal Police Aargau together with the personnel-security unit."
      - claim: "[inside-it.ch] Appointment as inside-it words it ('ernannt'; takes the post from 1 January 2027)."
        source_url: *iit
        passage: |-
          Dazu hat der Regierungsrat Bernhard Droz zum Leiter der Stelle und somit zum Cyber-Koordinator ernannt.
        translation: "To this end the Government Council appointed Bernhard Droz head of the office and thus cyber coordinator."
      - claim: "[inside-it.ch] Start of the appointment."
        source_url: *iit
        passage: |-
          Er tritt seine Stelle ab 1. Januar 2027 an.
        translation: "He takes up his post from 1 January 2027."
      - claim: "[netzwoche.ch, Feb 2025, BACKGROUND] EARLIER PLANNED START: in February 2025 the planned law was due to enter into force on 1 July 2026 'if all goes to plan' (conditional)."
        source_url: &nwo "https://www.netzwoche.ch/news/2025-02-24/kanton-aargau-will-cybersicherheit-staerken"
        passage: |-
          Verläuft alles nach Plan, soll das neue Informationssicherheitsgesetz am 1. Juli 2026 in Kraft treten.
        translation: "If everything goes to plan, the new information security act is to enter into force on 1 July 2026."
      - claim: "[netzwoche.ch, Feb 2025, BACKGROUND] COMMUNES / BEARERS OF PUBLIC TASKS: a consultation-stage proposal, approved by a majority, that communes and other bearers of public tasks fall within the law's scope. This is the draft stage (Feb 2025), not confirmed for the final law in the Nov 2026 sources."
        source_url: *nwo
        passage: |-
          Mehrheitlich gutgeheissen habe man den Vorschlag, dass Gemeinden und andere Träger öffentlicher Aufgaben unter den Geltungsbereich des Gesetzes fallen sollen.
        translation: "The proposal that municipalities and other bearers of public tasks should fall within the scope of the law was approved by a majority."
      - claim: "[netzwoche.ch, Feb 2025, BACKGROUND] Legislative timeline then: to the Grosser Rat, deliberation in Q2 2025."
        source_url: *nwo
        passage: |-
          Das Geschäft geht nun an den Grossen Rat. Dieser soll die Beratung des Entwurfs im zweiten Quartal 2025 aufnehmen.
        translation: "The matter now goes to the Grand Council, which is to begin deliberating the draft in the second quarter of 2025."
      - claim: "[netzwoche.ch, Feb 2025, BACKGROUND] The planned law would create the cantonal Cyber-Koordinationsstelle and uniform standards (same unit as in Nov 2026)."
        source_url: *nwo
        passage: |-
          Zudem will der Aargauer Regierungsrat mit dem Gesetz auch eine kantonale Cyber-Koordinationsstelle aufbauen.
        translation: "In addition, the Aargau Government Council wants to set up a cantonal cyber coordination office with the law."
      - claim: "[bluewin/Keystone-SDA, July 2024, BACKGROUND] Grosser Rat approved information-security credits (one-off about CHF 6.6 million, recurring CHF 3.6 million per year), cut by almost CHF 900,000 against the government's wish."
        source_url: &blw "https://www.bluewin.ch/de/news/schweiz/aargauer-parlament-kuerzt-kredite-fuer-informationssicherheit-li.2266621"
        passage: |-
          Der Grosse Rat hat einen einmaligen Kredit von knapp 6,6 Millionen Franken und einen jährlich wiederkehrenden Kredit von 3,6 Millionen Franken bewilligt.
        translation: "The Grand Council approved a one-off credit of just under CHF 6.6 million and an annually recurring credit of CHF 3.6 million."
