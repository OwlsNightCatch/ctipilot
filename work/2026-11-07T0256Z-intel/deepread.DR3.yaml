      - claim: "[Oneconsult] Accessible: Azure cached tokens and tenant/subscription IDs."
        source_url: *onec
        passage: |-
          Cached Azure tokens, tenant/subscription IDs
      - claim: "[Oneconsult] Accessible: C:\\Users\\Public (no rule applies) and SMB shares."
        source_url: *onec
        passage: |-
          Not the active user profile; no rule applies
      - claim: "[Oneconsult] Accessible: SMB network shares not under a blocked path."
        source_url: *onec
        passage: |-
          Not under a blocked path
      - claim: "[Oneconsult] Historic UNC-path bypass fixed in 2022."
        source_url: *onec
        passage: |-
          Until 2022, it was possible to partially bypass the filter by using UNC paths for local directories. However, this bug has since been fixed (see https://issues.chromium.org/issues/40059686).
      - claim: "[Oneconsult] ATTACK PATH exfiltration: recursive search of a user-selected folder; one click on a parent folder suffices."
        source_url: *onec
        passage: |-
          As soon as a user selects a folder, the website can recursively search through all files and specifically exfiltrate high-quality content. Since the FSA API allows arbitrary navigation within the selected directory, a single click on a parent folder is all it takes.
      - claim: "[Oneconsult] Exfiltration targets: Azure token cache, .vscode .env secrets."
        source_url: *onec
        passage: |-
          Cached Azure access tokens, tenant IDs, and subscription IDs
      - claim: "[Oneconsult] Exfiltration target: persistent Azure auth tokens."
        source_url: *onec
        passage: |-
          Persistent Azure authentication tokens
      - claim: "[Oneconsult] ATTACK PATH VS Code extension persistence: MotW irrelevant because Node.js does not check Zone.Identifier."
        source_url: *onec
        passage: |-
          A MotW (Mark of the Web) has no effect on the execution, since Node.js simply does not check the Zone.Identifier Alternate Data Stream (ADS).
      - claim: "[Oneconsult] VS Code extension runs in the VS Code process; process-creation EDR sees only code.exe."
        source_url: *onec
        passage: |-
          The beacon runs within the VSCode process. EDR solutions that monitor process creation only see the normal code.exe process.
      - claim: "[Oneconsult] VS Code persistence precondition: user must grant access to the .vscode/extensions/ folder specifically."
        source_url: *onec
