          The file written via the FSA API is automatically assigned the identifier ZoneId=3. Under the RemoteSigned execution policy (default on Windows 11), PowerShell refuses to execute the file, throwing a PSSecurityException with the following message:
      - claim: "[Oneconsult] Profile vector therefore works only under Bypass/Unrestricted, which Oneconsult says is common on dev/build systems."
        source_url: *onec
