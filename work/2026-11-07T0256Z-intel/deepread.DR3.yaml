        saved_body: "work/2026-11-07T0256Z-intel/bodies/N7-2.md"
        publisher: "heise online (Volker Briegleb)"
        publication_date: "2026-11-06T15:06:00+01:00 (JSON-LD datePublished = dateModified)"
        fetch: "extract (trafilatura-direct); raw HTML re-fetched via url --direct for the timestamp"
    claims:
      - claim: "[TUM] Status line of the incident page (time of the statement)."
        source_url: &tum "https://www.tum.de/aktuelles/alle-meldungen/pressemitteilungen/details/it-sicherheitsvorfall-an-der-tum"
        passage: |-
          Stand: Freitag, 06.11.2026, 12:20 Uhr
        translation: "Status: Friday, 6 November 2026, 12:20."
      - claim: "[TUM] What happened - first step: unknown attackers attacked the myTUM portal."
        source_url: *tum
        passage: |-
          Unbekannte haben das Portal myTUM angegriffen.
        translation: "Unknown persons attacked the myTUM portal."
      - claim: "[TUM] WHAT WAS CAPTURED AT myTUM: passwords for the central TUM login (e.g. login.tum.de, TUMonline), from all persons who had logged in to myTUM. Mechanism of capture not stated."
        source_url: *tum
        passage: |-
          Dabei haben sie Passwörter für die zentrale Anmeldung an TUM-Systemen (z.B. login.tum.de, TUMonline, usw) erbeutet, und zwar von allen Personen, die sich bei myTUM angemeldet haben.
        translation: "In doing so they captured passwords for the central login to TUM systems (e.g. login.tum.de, TUMonline, etc.), namely from all persons who had logged in to myTUM."
      - claim: "[TUM] ADMIN-CREDENTIAL PIVOT: the captured credentials included those of a system administrator for TUMonline; with them the attackers attacked the central campus-management system TUMonline, which TUM then took off the network."
        source_url: *tum
        passage: |-
          Hierunter befanden sich auch die Zugangsdaten eines Systemverwalters für TUMonline. Mit diesen haben die Angreifer unser zentrales Campus-Management-System TUMonline angegriffen. Dieses haben wir daraufhin vom Netz genommen.
        translation: "Among these were also the access credentials of a system administrator for TUMonline. With these the attackers attacked our central campus management system TUMonline. We then took it off the network."
      - claim: "[TUM] Lead-in to data categories: possible access during the attack ('möglicherweise')."
        source_url: *tum
        passage: |-
          Während des Angriffs konnten die Angreifer möglicherweise auf folgende Daten zugreifen:
        translation: "During the attack the attackers may have been able to access the following data:"
      - claim: "[TUM] DATA - all affected: TUM account password, name, private address, date of birth."
        source_url: *tum
        passage: |-
          bei allen Betroffenen: Passwort für Ihren TUM-Account, Ihren Namen, Ihre private Anschrift und Ihr Geburtsdatum
        translation: "for all affected persons: password for your TUM account, your name, your private address and your date of birth."
      - claim: "[TUM] DATA - staff additionally: business address and business telephone number."
        source_url: *tum
        passage: |-
          bei Beschäftigten zusätzlich: Ihre Dienstanschrift und Ihre dienstliche Telefonnummer
        translation: "for employees additionally: your business address and your business telephone number."
      - claim: "[TUM] DATA - students additionally: possibly matriculation number, degree programme, number of subject semesters."
        source_url: *tum
        passage: |-
          bei Studierenden zusätzlich: gegebenenfalls Ihre Matrikelnummer, Ihren Studiengang und die Anzahl Ihrer Fachsemester
        translation: "for students additionally: where applicable your matriculation number, your degree programme and the number of your subject semesters."
      - claim: "[TUM] Logging of attacker access in TUMonline and current assessment that no further TUMonline data (e.g. grades, study-place applications) is affected; still being checked."
        source_url: *tum
        passage: |-
          Die Zugriffe der Angreifer innerhalb von TUMonline wurden weitgehend protokolliert. Nach Auswertung dieser Protokolle gehen wir derzeit davon aus, dass keine weiteren Daten aus TUMonline betroffen sind, etwa Noten oder Studienplatzbewerbungen. Wir prüfen dies weiter.
        translation: "The attackers' accesses within TUMonline were largely logged. After evaluating these logs we currently assume that no further data from TUMonline is affected, e.g. grades or study-place applications. We are continuing to check this."
      - claim: "[TUM] CONTAINMENT: affected accounts locked immediately; TUMonline temporarily deactivated; to TUM's current knowledge this prevented further spread."
        source_url: *tum
        passage: |-
          Wir haben die betroffenen Accounts sofort gesperrt und TUMonline vorübergehend deaktiviert. Nach unserem derzeitigen Kenntnisstand konnten wir dadurch verhindern, dass sich der Angriff weiter ausbreitet.
        translation: "We locked the affected accounts immediately and temporarily deactivated TUMonline. To our current knowledge this prevented the attack from spreading further."
      - claim: "[TUM] AUTHORITY NOTIFICATIONS: reported to the Bavarian State Commissioner for Data Protection; criminal complaint filed."
        source_url: *tum
        passage: |-
          Den Vorfall haben wir dem Bayerischen Landesbeauftragten für den Datenschutz gemeldet und Strafanzeige erstattet.
        translation: "We have reported the incident to the Bavarian State Commissioner for Data Protection and filed a criminal complaint."
      - claim: "[TUM] MFA STATEMENT: user accounts with MFA were protected in this attack (no mechanism given)."
        source_url: *tum
        passage: |-
          Benutzerkonten mit MFA waren bei diesem Angriff geschützt.
        translation: "User accounts with MFA were protected in this attack."
      - claim: "[TUM] Action requested: change the TUM password (options provided by Monday), then enable MFA."
        source_url: *tum
        passage: |-
          Ändern Sie Ihr TUM-Passwort. Wir stellen Ihnen dafür bis Montag mehrere Möglichkeiten zur Verfügung und informieren Sie, wie und bis wann Sie Ihr Passwort ändern müssen.
        translation: "Change your TUM password. We will provide you with several options for this by Monday and will inform you how and by when you must change your password."
      - claim: "[TUM] Password reuse advice."
        source_url: *tum
        passage: |-
          Falls Sie Ihr TUM-Passwort auch bei anderen Diensten außerhalb der TUM benutzt haben, sollten Sie es dort unbedingt ändern.
        translation: "If you have also used your TUM password for other services outside TUM, you should definitely change it there."
      - claim: "[TUM] Phishing risk warning."
        source_url: *tum
        passage: |-
          Mit Ihrem Namen, Ihrem Studiengang und Ihrer Anschrift könnten Betrüger glaubwürdig wirkende Nachrichten verfassen.
        translation: "With your name, your degree programme and your address, fraudsters could write credible-looking messages."
      - claim: "[TUM] TUM never asks for passwords by email, phone or letter."
        source_url: *tum
        passage: |-
          Die TUM wird Sie niemals per E-Mail, Telefon oder Brief nach Ihrem Passwort fragen.
        translation: "TUM will never ask you for your password by email, telephone or letter."
      - claim: "[heise] SPOKESPERSON POINT 1 (entry system): attackers got in via a legacy system ('Altsystem'), potentially gaining access to student and staff data; whether data was also exfiltrated is still being investigated. Reported speech: 'bestätigte ein Sprecher der TUM gegenüber heise online'."
        source_url: &hei "https://www.heise.de/news/Plattformen-offline-Cyberangriff-auf-TU-Muenchen-11515734.html"
        passage: |-
          Angreifer seien über ein Altsystem eingedrungen und hätten dabei potenziell Zugriff auf Daten von Studenten und Mitarbeitern erlangt, bestätigte ein Sprecher der TUM gegenüber heise online. Ob Daten dabei auch entwendet wurden, werde noch untersucht.
        translation: "Attackers had penetrated via a legacy system and thereby potentially gained access to data of students and staff, a TUM spokesperson confirmed to heise online. Whether data was also exfiltrated is still being investigated."
      - claim: "[heise] POINT 2 (about 60,000 users): heise's own sentence, not attributed to the spokesperson in the text: data of 'gut 60.000' students and employees."
        source_url: *hei
        passage: |-
          Insgesamt geht es um Daten von gut 60.000 Studenten und Beschäftigten der Hochschule.
        translation: "In total the data of well over 60,000 students and employees of the university is concerned."
      - claim: "[heise] What was actually stolen is unclear; the university assumes damage is limited; blocking the platforms contained the attack for now."
        source_url: *hei
        passage: |-
          Was davon tatsächlich entwendet wurde, ist zur Stunde noch unklar. Die Hochschule geht derzeit davon aus, dass sich der Schaden in Grenzen hält. Mit der Sperrung der Plattformen sei der Angriff zunächst eingedämmt worden.
        translation: "What was actually taken is still unclear at present. The university currently assumes the damage is limited. By blocking the platforms the attack was initially contained."
      - claim: "[heise] TUM statement quoted by heise: via the legacy system myTUM, attackers obtained passwords, names, private addresses, dates of birth, matriculation numbers, degree-programme information and number of subject semesters ('teilte die TUM dazu mit')."
        source_url: *hei
        passage: |-
          Angreifern war es gelungen, über das Altsystem myTUM an Passwörter, Namen, private Anschriften und Geburtsdaten der Nutzenden sowie Matrikelnummern, Studiengangsinformationen und die Anzahl der jeweiligen Fachsemester zu kommen
        translation: "The attackers had succeeded in obtaining, via the legacy system myTUM, users' passwords, names, private addresses and dates of birth as well as matriculation numbers, degree-programme information and the number of respective subject semesters."
      - claim: "[heise] All myTUM user accounts are potentially affected; whether data actually left is unclear."
        source_url: *hei
        passage: |-
          Potenziell betroffen sind alle Nutzerkonten von myTUM, ob dort aber tatsächlich Daten abgeflossen sind, ist noch unklar.
        translation: "All myTUM user accounts are potentially affected, but whether data actually flowed out there is still unclear."
      - claim: "[heise] UNOFFICIAL (university circles): attackers not interested in myTUM data; the old system was the entry point to current campus administration; they also obtained a TUMonline system administrator's credentials."
        source_url: *hei
        passage: |-
          Nach bisherigen Erkenntnissen seien die Angreifer nicht an den Daten auf myTUM interessiert gewesen, heißt es aus Universitätskreisen. Vielmehr sei das alte System als Einfallstor für die aktuelle Campusverwaltung genutzt worden. Dabei haben die Angreifer den Angaben zufolge auch Zugangsdaten eines Systemverwalters für TUMonline erlangt.
        translation: "According to findings so far the attackers were not interested in the data on myTUM, it is said from university circles. Rather, the old system was used as a gateway to the current campus administration. According to the information, the attackers also obtained access credentials of a system administrator for TUMonline."
      - claim: "[heise] SPOKESPERSON QUOTE: with these (admin credentials) the attackers attacked the central campus-management system."
        source_url: *hei
        passage: |-
          Mit diesen haben die Angreifer unser zentrales Campus-Management-System angegriffen
        translation: "With these the attackers attacked our central campus management system."
      - claim: "[heise] Harvested TUM identifiers have been locked."
        source_url: *hei
        passage: |-
          Die erbeuteten TUM-Kennungen seien inzwischen gesperrt worden.
        translation: "The captured TUM identifiers have meanwhile been locked."
      - claim: "[heise] Not exfiltrated to current knowledge (heise's list): grades, exam results, applications, bank details."
        source_url: *hei
        passage: |-
          Sensible Daten wie Noten, Prüfungsergebnisse, Bewerbungen oder Bankverbindungen seien nach derzeitigem Kenntnisstand nicht abgeflossen, betont die Hochschule.
        translation: "Sensitive data such as grades, exam results, applications or bank details have, to current knowledge, not flowed out, the university stresses."
      - claim: "[heise] AUTHORITY NOTIFICATIONS (heise)."
        source_url: *hei
        passage: |-
          Die Technische Universität München hat den Angriff beim Bayerischen Landesbeauftragten für den Datenschutz gemeldet und Strafanzeige erstattet.
        translation: "The Technical University of Munich has reported the attack to the Bavarian State Commissioner for Data Protection and filed a criminal complaint."
      - claim: "[heise] POINT 3 (impaired password reset / MFA enrolment, per TUM-IT) and phased restoration of TUMonline over the next days."
        source_url: *hei
        passage: |-
          Die Hochschule arbeitet den Angaben zufolge daran, TUMonline im Laufe der nächsten Tage schrittweise wieder ans Netz zu bringen. Bis dahin sind laut TUM-IT auch die Passwortrücksetzung und die MFA-Einrichtung beeinträchtigt.
        translation: "According to the information, the university is working on bringing TUMonline back onto the network step by step over the next few days. Until then, according to TUM-IT, password reset and MFA setup are also impaired."
      - claim: "[heise] MFA statement echoed: accounts secured that way were protected against the attack."
        source_url: *hei
        passage: |-
          So gesicherte Konten seien gegen den Angriff geschützt gewesen.
        translation: "Accounts secured in this way had been protected against the attack."
      - claim: "[heise] Lead/teaser sentence - says attackers 'Daten entwendet haben' (data stolen), which the body then qualifies as still under investigation."
        source_url: *hei
        passage: |-
          Die TUM hat ihr zentrales Campus-Management-System offline genommen, nachdem sich Angreifer unberechtigten Zugriff verschafft und Daten entwendet haben.
        translation: "TUM has taken its central campus management system offline after attackers gained unauthorised access and stole data."
      - claim: "[heise] Context: LMU München incident from September (600,000 records, ~50 years of data) - heise's comparison, not part of the TUM incident."
        source_url: *hei
        passage: |-
          Dabei waren 600.000 Datensätze mit Stamm- und Immatrikulationsdaten von aktuellen und ehemaligen LMU-Studenten betroffen, die etwa 50 Jahre zurückreichen.
        translation: "In that case 600,000 records with master and enrolment data of current and former LMU students, going back about 50 years, were affected."
