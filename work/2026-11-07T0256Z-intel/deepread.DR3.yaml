    claims:
      - claim: "[Oneconsult] Test basis: July 2026, Windows 11, Chrome and Edge 150.0.7871.101; other OSes/configurations not covered."
        source_url: &onec "https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"
        passage: |-
          The analysis is based on tests conducted in July 2026 on Windows 11 using Chrome 150.0.7871.101 and Edge 150.0.7871.101.
      - claim: "[Oneconsult] Other operating systems and browser configurations are out of scope."
        source_url: *onec
        passage: |-
          Other operating systems and browser configurations may have different protection mechanisms and are not covered by this analysis.
      - claim: "[Oneconsult] Basis of the analysis is public Chromium source (blocklist read from source, not only black-box tested)."
        source_url: *onec
        passage: |-
          In this article, I analyze Chrome's Windows-specific protection mechanisms based on the publicly available Chromium source code.
      - claim: "[Oneconsult] Handle lifetime: valid indefinitely (source text has a non-breaking space before the dash, so the sentence is split into two contiguous passages)."
        source_url: *onec
        passage: |-
          What makes this unique is that the handle remains valid indefinitely
      - claim: "[Oneconsult] Handle lifetime: no timeout or re-authentication needed."
        source_url: *onec
        passage: |-
          without a timeout or the need for re-authentication
      - claim: "[Oneconsult] Handle lifetime: as long as the tab is open."
        source_url: *onec
        passage: |-
          as long as the tab is open.
      - claim: "[Oneconsult] Two user clicks give a handle (red-team perspective)."
        source_url: *onec
        passage: |-
          From a red-team perspective, however, this means that after just two user clicks (selecting the folder and granting permission) on the website, a handle to the files is obtained.
      - claim: "[Oneconsult] Chrome blocks listed paths with 'This folder contains system files'."
        source_url: *onec
        passage: |-
          If the selected path matches a blocked entry, Chrome rejects it with the error message "This folder contains system files".
      - claim: "[Oneconsult] BlockType kDontBlockChildren semantics."
        source_url: *onec
        passage: |-
          The directory itself cannot be selected, but its "children" (subdirectories, files) are allowed.
      - claim: "[Oneconsult] BlockType kBlockAllChildren semantics."
        source_url: *onec
        passage: |-
          The directory and everything below it is blocked. Access is not possible at any level.
      - claim: "[Oneconsult] Blocklist is from GenerateBlockPaths() as of July 2026 and explicitly not exhaustive."
        source_url: *onec
        passage: |-
          (as of July 2026; this list is not intended to be exhaustive)
      - claim: "[Oneconsult] Gap rule: any path not in the table and not an ancestor of a blocked path is allowed. Source's example (written with a leading '...' shorthand) is AppData\\Local blocked but AppData\\LocalLow allowed."
        source_url: *onec
        passage: |-
          If a path is not listed in this table and is not an ancestor of a blocked path, Chrome grants access to it.
      - claim: "[Oneconsult] Gap rule example: LocalLow is allowed (second half of the source's example sentence)."
        source_url: *onec
        passage: |-
          LocalLow is allowed.
      - claim: "[Oneconsult] 'Nearest ancestor wins' creates holes in blocked subtrees."
        source_url: *onec
        passage: |-
          If multiple block rules apply (a parent directory and a child directory both have rules), the most specific (deepest) rule takes precedence. This is how Chrome creates "holes" in otherwise blocked subtrees that attackers can exploit.
      - claim: "[Oneconsult] Design intent of kDontBlockChildren under the user profile and the assumption behind it."
        source_url: *onec
        passage: |-
          "don't let a website access everything, but let users share specific folders". The assumption is that a user who selects .Azure or .vscode understands what they are sharing.
      - claim: "[Oneconsult] Paths confirmed accessible by manual testing on Windows 11 (Chrome and Edge 150.0.7871.101, July 2026)."
        source_url: *onec
        passage: |-
          The paths listed below have been confirmed to be accessible on Windows 11 (Chrome 150.0.7871.101 and Edge 150.0.7871.101; July 2026) through manual testing.
      - claim: "[Oneconsult] Accessible-path examples (table cells): .vscode, .Azure, .config contents."
        source_url: *onec
        passage: |-
