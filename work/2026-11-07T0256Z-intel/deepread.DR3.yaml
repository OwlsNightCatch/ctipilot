        source_url: *kas
        passage: |-
          Separate monitoring from administration.
      - claim: "Kaspersky REMEDIATION LIST - label 2."
        source_url: *kas
        passage: |-
          Replace stored root passwords.
      - claim: "Kaspersky REMEDIATION LIST - label 3."
        source_url: *kas
        passage: |-
          Restrict direct host access.
      - claim: "Kaspersky REMEDIATION LIST - label 4 (vendor product item; text is promotional)."
        source_url: *kas
        passage: |-
          Use a specialized security solution.
      - claim: "Remediation item 4 names Kaspersky's own product (KCWS) - vendor self-promotion, not a control."
        source_url: *kas
        passage: |-
          is perfectly suited to address virtual environment risks
      - claim: "Kaspersky REMEDIATION LIST - label 5."
        source_url: *kas
        passage: |-
          Treat configuration changes as security events.
      - claim: "Kaspersky REMEDIATION LIST - label 6."
        source_url: *kas
        passage: |-
          Isolate the management network.
      - claim: "Kaspersky REMEDIATION LIST - label 7."
        source_url: *kas
        passage: |-
          Protect logs, backups, and recovery.
      - claim: "Kaspersky REMEDIATION LIST item 1 - body text of 'Separate monitoring from administration' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Create a dedicated monitoring identity for each platform and restrict it to the smallest set of objects and actions that the monitoring sensors require. Do not use ESXi root or another emergency account for routine polling. Prevent monitoring servers from starting interactive administrator sessions unless a separately approved support workflow requires it. The same principle applies beyond VMware.
      - claim: "Kaspersky REMEDIATION LIST item 2 - body text of 'Replace stored root passwords' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Locate every copy of hypervisor, management, storage, and backup credentials in monitoring tools, scripts, scheduled tasks, connection managers, and service configurations. Replace static passwords with vault retrieval, brokered identities, or limited API tokens where the platform supports them. Record every retrieval and rotate the secret after emergency use or compromise.
      - claim: "Kaspersky REMEDIATION LIST item 3 - body text of 'Restrict direct host access' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Route normal ESXi administration through vCenter and enable an appropriate Lockdown Mode after testing monitoring, backup, and recovery dependencies. Keep ESXi Shell and SSH stopped by default. When support work requires SSH, enable it for a defined period, restrict the source, and alert on service activation, root login, and changes to the exception list of users who are allowed to connect via SSH.
      - claim: "Kaspersky REMEDIATION LIST item 5 - body text of 'Treat configuration changes as security events' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Alert when `execInstalledOnly`, Secure Boot enforcement, Lockdown Mode, SSH, local accounts, exception users, firewall rules, or remote logging settings change. Baseline the expected state and test whether the security team can detect an unauthorized change. A secure configuration set once does not mean that the control remains active on the host.
      - claim: "Kaspersky REMEDIATION LIST item 6 - body text of 'Isolate the management network' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Place hypervisor, monitoring, backup, storage, and cluster administration on restricted management networks. Permit only the exact source and destination services required. Administrative workstations should enter through hardened jump hosts with named identities and multifactor authentication.
      - claim: "Kaspersky REMEDIATION LIST item 7 - body text of 'Protect logs, backups, and recovery' (bullet text after the bold lead; extractor markdown such as backticks is retained where the source used code formatting)."
        source_url: *kas
        passage: |-
          Forward ESXi, vCenter, Proxmox monitoring, identity, and network logs to protected storage that a compromised administrator cannot erase. Backup platforms should use separate identities, restricted management paths, and recovery copies outside ordinary administrative reach.
