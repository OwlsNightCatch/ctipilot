    discrepancies:
      - "CANTON COMMUNIQUE FOUND: ag.ch/de/aktuell/medienmitteilungen 404s and the portal's search API (https://www.ag.ch/app/search-service/api/v1/medienmitteilungen) returns HTTP 500 without its custom query parameter. Working route: https://www.ag.ch/sitemap.xml lists https://www.ag.ch/content/export/api/v1/xml/medienmitteilungen (all release URLs, newest first, ~2.5 MB); the 2026-11-06 'Bulletin zur Regierungsratssitzung' item (title/author 'Departement Finanzen; Ressourcen') carries the text and reads with `extract`. Recommend recording this recipe for sources.json (ag.ch media releases)."
      - "ADOPTION DATE: no source states the date of the Regierungsrat decision. The only dates are publication dates (ag.ch bulletin 2026-11-06; aargauerpolitik 2026-11-06T13:17Z; inside-it 2026-11-06T15:02Z). Use 'announced 6 November 2026', not 'adopted on 6 November'."
      - "NOT INDEPENDENT: aargauerpolitik.ch reproduces the ag.ch bulletin text (it even says 'Dies meldet das Departement Finanzen und Ressourcen'); inside-it.ch is a re-report of the same release ('laut Mitteilung'). All three trace to the canton's release - one source, not three."
      - "MODALITY DIFFERENCES: (1) ag.ch: the Fachstelle 'soll ... beraten und mit Weisungs- und Durchsetzungsbefugnissen ausgestattet werden' (is to be equipped); inside-it: the Fachstelle 'wurde ... geschaffen' (was created). (2) ag.ch: Inkraftsetzung of InfoSiG and InfoSiV decided for 2027-01-01; inside-it: 'das dazugehörige Gesetz soll am 1. Januar 2027 in Kraft treten' (law only mentioned). (3) ag.ch: Fachstelle advises 'die kantonalen Stellen'; inside-it: 'alle kantonalen Verwaltungsstellen'. Prefer the ag.ch wording."
      - "PLACEMENT GAP: the communique places only the Fachstelle für Personensicherheitsprüfungen and the Cyber-Koordinationsstelle at KAPO; it does not say where the Fachstelle für Informationssicherheit (the one with Weisungs-/Durchsetzungsbefugnisse) sits. inside-it likewise says only that the coordination office 'ist zusammen mit der Fachstelle für Personensicherheit an der Kantonspolizei Aargau angesiedelt'."
      - "SCOPE GAP (communes / bearers of public tasks): none of the three Nov 2026 texts mentions Gemeinden or Träger öffentlicher Aufgaben; they speak of 'kantonale Verwaltung' / 'kantonalen Stellen'. Only the Feb 2025 netzwoche item (reporting the draft stage) says a consultation proposal to include communes and other bearers of public tasks was approved by a majority. Whether the final InfoSiG/InfoSiV covers communes is therefore NOT confirmed by the assigned sources. The Cyber-Koordinationsstelle's protection mandate is worded broadly ('Behörden, Wirtschaft und Bevölkerung')."
      - "EARLIER START DATE: neither assigned source states one. netzwoche (2025-02-24) gave 1 July 2026 as the conditional planned entry into force; the 2027-01-01 date is therefore ~6 months later than that earlier plan (inference from two sources, not stated by any single source)."
      - "LEGISLATIVE STATUS: the Nov 2026 communique speaks of 'Inkraftsetzung der Informationssicherheitsgesetzgebung (InfoSiG und InfoSiV)', implying the InfoSiG is already enacted, but none of the fetched texts states the Grosser Rat's final vote or its date."
      - "Wording check: the ag.ch bulletin says the ordinance was 'verabschiedet' (adopted) and the coordinator 'gewählt' (elected); inside-it says 'ernannt' (appointed). The appointee is a named public official; the name is carried because the assignment asks for it."
