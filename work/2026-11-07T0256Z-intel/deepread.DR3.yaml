    exploitation_status: "Not a vulnerability disclosure: both cases are credential/configuration abuse with no CVE and no VM escape ('No VM escape was required')."
    evidence_candidates:
      - {quote: "A fully patched hypervisor can still be compromised through a shared password, an overprivileged monitoring account, an open SSH path, or an administrator interface reachable from a general server network.", publisher: "Kaspersky GERT (Securelist)", source_url: *kas}
      - {quote: "User \"root\" deactivates the execInstalledOnly option.", publisher: "Kaspersky GERT (Securelist)", source_url: *kas}
      - {quote: "The actor then activated the VNC web socket through the compromised root account, gaining extensive control over the Proxmox environment.", publisher: "Kaspersky GERT (Securelist)", source_url: *kas}
    discrepancies:
      - "The lead's 'SSH from the monitoring host' is an inference: Kaspersky says 'After obtaining access to the monitoring environment, the attacker used the ESXi credential to connect over SSH to the hosts that shared the same password' and the timelines show root SSH from redacted private IPs, but it never states that the SSH source was the PRTG server itself."
      - "Kaspersky does not say how the attacker first reached the Windows system / PRTG environment (Case 1) or the administrator workstation (Case 2); no initial-access vector and no dwell-time duration are given."
      - "Case 2 has no explicit incident date; the only date evidence is the log timestamp 01/08/2026 (-0400), whose day/month order is not stated. Case 1 dates (2025-10-18/19) are stated in ISO form. The two incidents are therefore ~3 months apart if 01/08 means 8 January 2026, or ~9 months apart if 1 August 2026."
      - "Case 2 'root@pam' evidence is a set of web-server style GET log lines for vncwebsocket requests, not a separate authentication-success log line; Kaspersky describes it as 'root account being used to access other hosts via a VNC web socket'."
      - "The malware binary name and switches appear only as redacted command lines in the Case 1 timelines (binary 'esx'; switches /log, /selftest, /p, /depth 5, /wipe); Kaspersky does not link BlackNevas to that binary by hash or name beyond 'the malware esx'."
      - "Remediation item 4 is a Kaspersky product recommendation (KCWS/KHCS/KCS); the other six items are vendor-neutral controls."
      - "The article also covers general virtualization attack surface (VM escape CVE-2025-22224, Copy Fail CVE-2026-31431, runc CVE-2024-21626, Portainer GHSA-7fw3-x4r2-g7wc, Docker CVE-2026-41567/41568/42306); those are background, not part of the two cases."
