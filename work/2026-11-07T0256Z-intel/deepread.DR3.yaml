        - {finding: "national fire agency SSO portal", weakness: "brute force attempted", outcome: "no confirmed access"}
        - {finding: "fire-department systems in five Taiwanese cities", weakness: "n/a - technology-stack fingerprinting", outcome: "no confirmed compromise"}
        - {finding: "fire-dispatch technology vendor database administration panel", weakness: "default root credentials", data: "18 or more database tables exposed", outcome: "logged in; webshell attempt via known CVE failed"}
      outbound_links_on_page:
        - "https://www.anthropic.com/threat-intelligence-report-september-2026"
        - "https://www.acronis.com/en/tru/posts/poisoning-the-well-ai-supply-chain-attacks-on-hugging-face-and-openclaw/"
    status: "Campaign analysed over a 12-day observation window; TRU page dated 2026-11-04; the page does not say whether the exposed emergency-services systems were notified or remediated, and does not name the victim organisations."
    exploitation_status: "As of 2026-11-04 (TRU): confirmed data exfiltration or system access at roughly 10 distinct targets across three countries; ~15 further targets actively attacked without confirmed compromise."
    evidence_candidates:
      - {quote: "BOSSAI is a mesh of 12 AI agents (nine of which active, and three which were set up but unused at the time of our investigation)", publisher: "Acronis TRU", source_url: *acr}
      - {quote: "Confirmed data exfiltration or system access occurred at roughly 10 distinct targets across three countries.", publisher: "Acronis TRU", source_url: *acr}
      - {quote: "The agents failed where authentication was enforced, where paywalls required valid sessions and where endpoints were properly filtered.", publisher: "Acronis TRU", source_url: *acr}
    discrepancies:
      - "NO DEFENSIVE RECOMMENDATIONS SECTION: the post (verified on raw HTML) has sections Summary, Introduction, AAT, mesh, infrastructure, Victims, Arsenal exposure and attribution, Attribution, IOCs - no recommendations/mitigations/detection section. The only defence-relevant statements are the two 'obscurity' passages and the 'agents failed where ...' passage above. The main agent must not attribute recommendations to TRU."
      - "Country count: headline says eleven countries, but the body enumerates Taiwan, Mexico, Thailand (the three confirmed-compromise countries), Honduras, eight 'additional' recon-level countries (US, UK, Australia, Sri Lanka, Singapore, China, Vietnam, Japan), plus three queue-only countries (Hong Kong, Indonesia, Canada) - i.e. more than eleven. Use 'eleven countries (TRU)' attributed, do not recompute."
      - "Scale wording is inconsistent within the post: 'hundreds of organizations' (summary, introduction) vs 'attack dozens of organizations' (AAT section) vs ~10 confirmed + ~15 actively attacked (Victims). Attribute each to TRU; prefer the Victims-section counts for confirmed outcomes."
      - "Two time bases: 12 days observed (Victims section) vs Hermes cycling through at least nine models over 19 days (config-backup history). Not a contradiction but do not merge."
      - "Summary bullet says 'a Honduran military base'; body says a military air-force personnel system / military host that was characterized but not exploited."
      - "Emergency-services mapping to the lead: 'patient-care records platform' = Taipei fire-department emergency patient-care records platform (data 2018 only, no credentials); '119 dispatch API' = a city's 119 emergency dispatch system, case records from the system's API, seven Taipei districts. TRU does not state the authentication state of the 119 API beyond 'public-facing API'."
      - "The hardcoded AES-256 key finding is described as exposing session-cookie contents including an administrator identity - TRU does not say the key was used to forge sessions or take over the system ('Full system compromise was never confirmed')."
      - "The attribution passage names a city and (elsewhere) business/handle details of the operator; those personal identifiers are deliberately NOT reproduced here. Confidence word: 'high confidence'. TRU's attribution is to an individual, not a state; TRU states it is 'unclear' whether the operator has any specific affiliation or goal beyond monetisation ('presumably')."
      - "trafilatura front-matter date (2026-11-04) matches the page JSON-LD datePublished (2026-11-04T01:00:00Z)."
    unread: []
  N4:
    title: "Kaspersky GERT - ESXi and Proxmox ransomware cases (misconfigurations in virtual environments)"
    sources_read:
      - url: "https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"
        saved_body: "work/2026-11-07T0256Z-intel/bodies/N4-1.md"
        publisher: "Securelist (Kaspersky GERT)"
        publication_date: "2026-11-06 (page datePublished 2026-11-06T10:00:12+00:00, dateModified 2026-11-06T08:33:41+00:00 as read via url fetch; extract metadata date 2026-11-06); title 'How misconfigurations in virtual environments can lead to compromise'"
        fetch: "extract (trafilatura-direct); raw HTML read via url (direct failed once, fallback transport) for dates only"
    claims:
      - claim: "Scope statement: two further GERT ransomware cases on ESXi and Proxmox; contributing factors."
        source_url: &kas "https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"
        passage: |-
          Kaspersky GERT recently investigated two more ransomware cases on ESXi and Proxmox environments in which weak access controls, insufficient network separation, exposed administrative services, and poor management of privileged credentials contributed to the impact.
      - claim: "Key framing: monitoring system could reach the virtualization layer and exposed a reusable root credential; no VM escape needed."
        source_url: *kas
        passage: |-
          A monitoring system that could reach the virtualization layer also exposed a reusable root credential. Once the attacker controlled that route, ordinary administrative access was enough to affect several hosts. No VM escape was required.
      - claim: "CASE 1 start: BlackNevas ransomware activity on a Windows system in a virtualized domain-controller segment."
        source_url: *kas
        passage: |-
          The investigation began with evidence of BlackNevas ransomware activity on a Windows system in a virtualized domain controller segment.
      - claim: "CASE 1 artefacts: UserAssist records AnyDesk and GMER execution; environment used PRTG Network Monitor."
        source_url: *kas
        passage: |-
          recorded execution of the AnyDesk RMM tool and GMER binaries. The environment also used PRTG Network Monitor to monitor its virtual infrastructure.
