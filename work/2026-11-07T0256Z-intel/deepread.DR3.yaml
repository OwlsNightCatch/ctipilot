        - {finding: "city 119 emergency dispatch system", weakness: "dispatch records on a public-facing API (mechanism not further stated)", data: "case records: incident times, response types, status fields, street-level locations across seven Taipei districts; not real-time ambulance GPS", outcome: "confirmed exfiltration (TRU)"}
        - {finding: "emergency management information system", weakness: "hardcoded AES-256 key in front-end JavaScript exposing session-cookie contents incl. an administrator identity; partial SSRF relay path", outcome: "full compromise never confirmed; potential attack paths"}
