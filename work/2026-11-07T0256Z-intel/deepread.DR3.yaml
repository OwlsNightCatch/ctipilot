          The Beacon runs as soon as the module is imported.
      - claim: "[Oneconsult] ATTACK PATH public desktop drops: C:\\Users\\Public\\Desktop has no blocking rule; files appear on all users' desktops. (Source sentence is garbled by a German fragment in the page.)"
        source_url: *onec
        passage: |-
          is accessible via the FSA API and is not subject to any blocking rules since it is not the profile directory of the active user. Files placed here appear on the desktop of all users.
      - claim: "[Oneconsult] Public-desktop drops carry MotW warning; user acknowledgement rate is Oneconsult's experience claim."
        source_url: *onec
        passage: |-
          All of these files trigger a warning when double-clicked, since FSA write operations always set a MotW. However, experience shows that a certain percentage of users acknowledge this warning, especially if the filename suggests a plausible business context.
      - claim: "[Oneconsult] ATTACK PATH SMB shares: fully accessible, no 'system files' block, read and write to whole share."
        source_url: *onec
        passage: |-
          SMB network shares are fully accessible via the FSA API. There is no "system files" block. When a user selects a network share in the file picker, the website gains read and write access to the entire share structure.
      - claim: "[Oneconsult] MotW applied to every written file incl. on shares; intranet zone does not override."
        source_url: *onec
        passage: |-
          The FSA API applies a MotW (ZoneId=3) to every file written, including those on network shares. The intranet zone of the share does not override the ADS that has already been stamped.
      - claim: "[Oneconsult] Existing .ps1/.bat files modified on shares gain a MotW, which can break previously trusted scripts."
        source_url: *onec
        passage: |-
          Modified existing files (such as .ps1 or .bat) now receive a MotW where none existed before. Under RemoteSigned, this can prevent previously trusted scripts from running and alert the user.
      - claim: "[Oneconsult] Share lateral-movement risk is mainly exfiltration or dropping new scripts into trusted locations / permissive execution-policy environments (source writes 'Bypass or Unsigned')."
        source_url: *onec
        passage: |-
          The lateral movement risk associated with network shares therefore lies primarily in the exfiltration of sensitive files or in the placement of new scripts in trusted locations and in environments with the Execution Policy Bypass or Unsigned.
      - claim: "[Oneconsult] MotW on every FSA write is mandatory and cannot be removed through the API."
        source_url: *onec
        passage: |-
          This is not optional and cannot be removed via the API (filenames containing a ":" are rejected with the error "Name not allowed").
      - claim: "[Oneconsult] MotW impact summary: VS Code injection works under any policy."
        source_url: *onec
        passage: |-
          Yes, under any policy
      - claim: "[Oneconsult] MotW impact summary: profile under RemoteSigned throws PSSecurityException."
        source_url: *onec
        passage: |-
          PSSecurityException under RemoteSigned
      - claim: "[Oneconsult] Forensic artefact: ReferrerUrl/HostUrl in Zone.Identifier ADS record the writing page's origin."
        source_url: *onec
        passage: |-
          The ReferrerUrl and HostUrl fields in the Zone.Identifier ADS contain the origin of the page that wrote the file. The C2 domain is permanently stored in the ADS of every written file and can be used as a clear forensic indicator.
      - claim: "[Oneconsult] SPECIAL CASE OneDrive KFM: blocklist should block redirected folders but does not always."
        source_url: *onec
        passage: |-
          Chrome should correctly block these redirected paths. However, this is not always the case, as shown below.
      - claim: "[Oneconsult] KFM test result: OneDrive tenant Desktop ALLOWED via stale blocklist; root blocked by ancestry check; Documents blocked."
        source_url: *onec
        passage: |-
          Ancestry check: includes blocked documents
      - claim: "[Oneconsult] KFM test result label for Desktop."
        source_url: *onec
        passage: |-
          Stale blocklist bypass (see below)
      - claim: "[Oneconsult] Proof: test file written to the redirected Desktop via the browser and synced to OneDrive."
        source_url: *onec
        passage: |-
          For example, a test file (fsa-proof.txt) was successfully written to the desktop via the browser and appeared both on the desktop and in the OneDrive sync.
      - claim: "[Oneconsult] GOOGLE RESPONSE (KFM stale-blocklist bypass): reported to Google; Google made the issue public (tracker 534049460)."
        source_url: *onec
        passage: |-
          The bypass has been reported to Google. Google has made the issue public (see https://issues.chromium.org/issues/534049460?pli=1).
      - claim: "[Oneconsult] Root cause: blocklist generated once and cached; later known-folder path changes are unprotected."
        source_url: *onec
        passage: |-
          The bypass can be reproduced and is based on a fundamental characteristic of the blocklist architecture: GenerateBlockPaths() is called once, and the result is cached. If the path of a known folder changes after the blocklist is created, the new path is not protected.
      - claim: "[Oneconsult] Reproduction step: Desktop backup to OneDrive enabled while Chrome is running; picker called without restarting Chrome."
        source_url: *onec
        passage: |-
          Without restarting Chrome, call showDirectoryPicker({ mode: 'readwrite' }) via the console
      - claim: "[Oneconsult] Stale-list precondition state: Desktop backup initially disabled, then KFM moves Desktop."
        source_url: *onec
        passage: |-
          Disable Desktop backup to OneDrive (Desktop is therefore located locally at C:\Users\alice\Desktop).
      - claim: "[Oneconsult] Bypass observed for Desktop but not Documents, cause unknown."
        source_url: *onec
        passage: |-
          For unknown reasons, this behavior was observed for Desktop but not for Documents.
      - claim: "[Oneconsult] Impact of stale list: KFM enabled while Chrome is running leaves Desktop path with full read/write."
        source_url: *onec
        passage: |-
          If KFM is enabled for Desktop while Chrome is running, Chrome has an outdated blocklist. The new Desktop path within the OneDrive folder is accessible with full read and write access.
      - claim: "[Oneconsult] Without KFM / personal OneDrive and SharePoint libraries: no blocked descendants, always accessible."
        source_url: *onec
        passage: |-
          Without KFM (or personal OneDrive): The OneDrive folder has no blocked descendants. Access is therefore permitted.
      - claim: "[Oneconsult] SharePoint libraries synced into the profile root are always accessible."
        source_url: *onec
        passage: |-
          Synchronized SharePoint libraries appear as separate folders in the profile root directory. These have no blocked descendants and are always accessible.
      - claim: "[Oneconsult] Writes via FSA propagate to the cloud and can affect other users."
        source_url: *onec
        passage: |-
          Changes written via the FSA API are synchronized back to the cloud. As a result, malicious software can also affect other users.
      - claim: "[Oneconsult] SPECIAL CASE drag-and-drop: file handle obtained via getAsFileSystemHandle() bypasses ConfirmSensitiveEntryAccess() for files (not directories)."
        source_url: *onec
        passage: |-
          When a user drags a file onto a website, the site can obtain a file handle via getAsFileSystemHandle(). For files (not directories), this code path completely bypasses ConfirmSensitiveEntryAccess().
      - claim: "[Oneconsult] Drag-and-drop allows reading files from .ssh, Desktop, AppData and other blocked directories."
        source_url: *onec
        passage: |-
          This allows files from .ssh, Desktop, AppData, and any other blocked directory to be read.
      - claim: "[Oneconsult] GOOGLE RESPONSE (drag-and-drop file access): classified 'not a security issue' because the user explicitly imported the file."
        source_url: *onec
        passage: |-
          Google has understandably classified this behavior as "not a security issue". The reasoning is that the user explicitly imported the file
      - claim: "[Oneconsult] ATTACK PATH interactive file proxy / C2 over WebSocket: handle persisted in IndexedDB; user re-confirms once."
        source_url: *onec
        passage: |-
          Furthermore, the handle can be persisted via IndexedDB. If the user closes the tab and reopens the page later, the stored handle can be restored. The user only needs to confirm once in a dialog that they wish to grant access again, without having to go through the file picker once more.
      - claim: "[Oneconsult] File-proxy C2: no process on the target; all access inside the Chrome process."
        source_url: *onec
        passage: |-
          The key advantage over traditional post-exploitation frameworks is that no process runs on the target system. All file access occurs within the Chrome process via a legitimate web API.
      - claim: "[Oneconsult] File-proxy C2 EDR visibility: only Chrome reading/writing files."
        source_url: *onec
        passage: |-
          EDR solutions only detect that Chrome is reading and writing files – an activity that is completely normal for web applications such as Google Docs or VSCode for Web.
      - claim: "[Oneconsult] File-proxy C2 lasts as long as the tab stays open; pretext spinner keeps the user from closing it."
        source_url: *onec
        passage: |-
          As long as the user does not actively close the tab, file access remains active.
      - claim: "[Oneconsult] DETECTION ADVICE 1: monitor MotW (Zone.Identifier ADS) changes in .vscode\\extensions, PowerShell profile paths, OneDrive directories; ReferrerUrl clues."
        source_url: *onec
        passage: |-
          Investigate changes to the Zone.Identifier Alternate Data Stream (ADS) in files located in relevant directories such as .vscode\extensions, PowerShell profile paths, and OneDrive directories. The ReferrerUrl field – if present – can provide clues about a file's origin.
      - claim: "[Oneconsult] ENTERPRISE POLICIES named: FileSystemReadAskForUrls, FileSystemWriteAskForUrls and 'the respective AskForUrls policies' (only these are named; extractor retains backticks)."
        source_url: *onec
        passage: |-
          Restrict file and directory access via Chrome Enterprise policies for read and write access. This includes, in particular, `FileSystemReadAskForUrls, FileSystemWriteAskForUrls`, and the respective AskForUrls policies.
      - claim: "[Oneconsult] DETECTION ADVICE 3: rules for unexpected changes to PowerShell profiles, VS Code extensions; correlate browser activity with file changes where telemetry allows."
        source_url: *onec
        passage: |-
          Develop detection rules for unexpected changes to PowerShell profiles, VSCode extensions, and other files suitable for persistence. If the telemetry in use allows it, suspicious browser activity and subsequent file changes should also be correlated.
      - claim: "[Oneconsult] HARDENING: AppLocker/WDAC; rules must match the real execution environment; OneDrive location alone is not a blocking criterion."
        source_url: *onec
        passage: |-
          Check AppLocker or Windows Defender Application Control (WDAC) to restrict unauthorized scripts and applications. The rules must match the actual execution environment. Simply being stored in a OneDrive directory is not a sufficient criterion for blocking.
      - claim: "[Oneconsult] ORG ADVICE: awareness - folder-selection prompts as a social-engineering vector."
        source_url: *onec
        passage: |-
          Include prompts from websites asking users to select a folder or grant access to local files as a potential social engineering vector in awareness training sessions.
      - claim: "[Oneconsult] ORG ADVICE: central browser policy management for Chrome and Edge, tested and reviewed regularly."
        source_url: *onec
        passage: |-
          Restrict file system access in Chrome and Edge in accordance with organizational requirements. Policies should be tested and reviewed regularly to ensure that security requirements and legitimate workflows remain compatible.
      - claim: "[Oneconsult] ORG ADVICE: test detection and response (SOC visibility)."
        source_url: *onec
        passage: |-
          Verify that the SOC can detect and appropriately handle suspicious file modifications, tampering with development environments, and unusual persistence mechanisms.
      - claim: "[Oneconsult] Framing: Oneconsult says its summary of the researcher's lure is 'the web server uses Windows' File System Access API' (loose wording; the API is a browser API run client-side)."
        source_url: *onec
        passage: |-
          In the background, the web server uses Windows' File System Access API to write to selected files.
      - claim: "[danieloz147] Not a sandbox escape; trust-model abuse within browser boundaries."
        source_url: &danz "https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/"
        passage: |-
          Rogue Sandbox is not a sandbox escape; it is a trust-model abuse pattern inside legitimate browser boundaries.
      - claim: "[danieloz147] Trigger: Check Point Research article (July 2026, 'Browser-Only Ransomware') showing a FSA-API-only attack path."
        source_url: *danz
        passage: |-
          The trigger for this research was the Check Point Research article that demonstrated an attack path built entirely on the File System Access API, with no exploit and no local payload.
      - claim: "[danieloz147] Check Point's technique: social engineering + user-granted permissions + native browser capabilities, no exploit/payload/OS bypass."
        source_url: *danz
        passage: |-
          Their work demonstrated that combining social engineering, user-granted permissions, and native browser capabilities can result in local file modification without an exploit, without a local payload, and without bypassing operating system security mechanisms.
      - claim: "[danieloz147] Lure choice: malware-scanner narrative."
        source_url: *danz
        passage: |-
          Instead of an AI tool, I built a flow that looked like a malware scanner.
      - claim: "[danieloz147] Platform scope: Chromium desktop and Chrome on Android; Firefox and Safari lack the same model."
        source_url: *danz
        passage: |-
          By contrast, Chrome/Chromium on desktop and Chrome on Android are the environments where this question becomes practically relevant.
      - claim: "[danieloz147] User gesture requirement does not prevent phishing."
        source_url: *danz
        passage: |-
          In other words, the user-gesture requirement does not prevent phishing. It prevents automatic picker invocation without user action.
      - claim: "[danieloz147] Sensitive directories blocked; ordinary user directories (Documents, Downloads, Pictures, project folders) remain accessible."
        source_url: *danz
        passage: |-
          System directories, root locations, or browser profile paths may be blocked. But user-selected directories such as Documents, Downloads, Pictures, or a project folder may remain accessible.
      - claim: "[danieloz147] The research does not bypass Chromium sensitive-directory checks."
        source_url: *danz
        passage: |-
          This model does not bypass those checks; it leverages user-selected, non-blocked areas.
      - claim: "[danieloz147] Core demo: an existing file is modified in place; no download moment."
        source_url: *danz
        passage: |-
          The user did not download a new file. The user allowed a site to edit a file that was already present.
      - claim: "[danieloz147] Demo payload is a MessageBox marker only; no full operational recipe published."
        source_url: *danz
        passage: |-
          This article does not publish a full operational infection recipe.
      - claim: "[danieloz147] Limitations: signed, complex, large or protected files may fail or break."
        source_url: *danz
        passage: |-
          Signed files, structurally complex files, very large files, or files protected by security products may fail, be blocked, or break in a way that prevents execution.
      - claim: "[danieloz147] Modifying signed files breaks signatures (limitation and detection signal)."
        source_url: *danz
        passage: |-
          Modifying signed files is expected to break signatures. This can become both a detection signal and a technical limitation.
      - claim: "[danieloz147] MotW view: editing by a website does not automatically reclassify a file as internet-downloaded (DIFFERS from Oneconsult's 'every written file receives ZoneId=3')."
        source_url: *danz
        passage: |-
          Editing by a website does not automatically reclassify a file as internet-downloaded in the Windows trust model.
      - claim: "[danieloz147] Safe Browsing / Download Protection can inspect some FSA writes in Chrome."
        source_url: *danz
        passage: |-
          In some cases, when the site attempted to write back specific files through the File System Access API, Chrome triggered protections associated with Safe Browsing / Download Protection.
      - claim: "[danieloz147] Evasion used in the lab: non-EXE extension with user told to restore the extension."
        source_url: *danz
        passage: |-
          In my research scenario, this constraint was handled through narrative design: content was represented under a non-EXE extension, and users were socially guided to restore the extension afterward.
      - claim: "[danieloz147] Edge behaved differently from Chrome in the lab."
        source_url: *danz
        passage: |-
          In my lab tests, Edge did not block folder-file access and editing in the same way as Chrome.
      - claim: "[danieloz147] Defensive advice: limit/control read-write filesystem site requests via browser policy; allow-list approved origins."
        source_url: *danz
        passage: |-
          Configure browser policy to limit or control site requests for read/write filesystem access.
      - claim: "[danieloz147] Defensive advice: allow File System Access only for approved origins with a business need."
        source_url: *danz
        passage: |-
          Allow File System Access only for known and approved origins where business need is explicit.
      - claim: "[danieloz147] Defensive advice: monitor browsers writing to many files or changing sensitive extensions."
        source_url: *danz
        passage: |-
          Monitor browser processes writing to many files or changing sensitive extensions.
      - claim: "[danieloz147] Enterprise policies exist in Chrome and Edge but the post names none."
        source_url: *danz
        passage: |-
          Additionally, both Chrome and Edge provide enterprise policies to control how sites request filesystem read/write access.
      - claim: "[danieloz147] EDR visibility: low-noise absent high-volume file churn."
        source_url: *danz
        passage: |-
          However, absent rapid high-volume file churn, this activity may remain low-noise and under-classified.
      - claim: "[danieloz147] Cloud-sync folders (OneDrive, Google Drive, Dropbox) listed as follow-up direction, not the primary case."
        source_url: *danz
        passage: |-
          A relevant future direction is synced folders such as OneDrive, Google Drive, or Dropbox.
      - claim: "[danieloz147] Research was lab-only on dedicated test files."
        source_url: *danz
        passage: |-
          All demos, code samples, and projects presented in this article were developed strictly for research purposes and tested in a controlled lab environment on dedicated test files.
    structured:
      tested_versions:
        oneconsult: "Windows 11; Chrome 150.0.7871.101 and Edge 150.0.7871.101; tests July 2026; Chromium source analysis as of July 2026"
        danieloz147: "no browser or OS version numbers stated in the post (lab tests on Chrome and Edge; Windows PE modification demo)"
      blocklist_windows_per_oneconsult_July_2026:
        kBlockAllChildren: ["AppData\\Roaming", "AppData\\Local", "C:\\ProgramData", "C:\\Program Files", "C:\\Program Files (x86)", "C:\\Windows", "~\\.ssh", "~\\.gnupg", "Chrome install/module/assets/user-data dirs", "(runtime) parent of active profile path and Chrome user-data root"]
        kDontBlockChildren: ["user home", "Desktop", "Documents", "Downloads"]
        kBlockNestedDirectories: ["IE/Edge temporary Internet cache"]
        kBlockWrite: ["every .git/hooks directory (enforced only for save operations)"]
        gaps_named_by_oneconsult: ["children of home (.vscode, .Azure, .config, .dotnet, .nuget, .local, .ms-ad)", "Documents\\WindowsPowerShell\\ (and Modules)", "C:\\Users\\Public (incl. Public\\Desktop)", "SMB/network shares", "OneDrive and OneDrive - <TENANT> folders (SharePoint libraries have no blocked descendants)", "AppData\\LocalLow", "OneDrive KFM Desktop after a KFM change while Chrome runs (stale cached blocklist; reproduced for Desktop, not Documents)"]
      attack_paths_with_preconditions:
        - {path: "credential/secret exfiltration from a user-selected folder (e.g. .Azure token cache, .vscode .env)", precondition: "user picks a folder that contains the files (a parent such as the profile subfolder suffices) and grants readwrite/read access", motw_effect: "n/a (read)"}
        - {path: "VS Code malicious extension in .vscode/extensions", precondition: "user must grant access to the .vscode/extensions folder itself (startIn can steer the picker)", motw_effect: "Node.js ignores MotW; works under any execution policy; runs inside the code.exe process"}
        - {path: "PowerShell profile overwrite (Microsoft.PowerShell_profile.ps1 under Documents\\WindowsPowerShell)", precondition: "execution policy Bypass or Unrestricted (RemoteSigned, the Windows 11 default, blocks the MotW-stamped ZoneId=3 file with PSSecurityException)", motw_effect: "blocked under RemoteSigned"}
        - {path: "PowerShell module .psm1 backdoor (Az.Accounts, Microsoft.Graph, custom)", precondition: "execution policy Bypass or Unrestricted (Authenticode + MotW block otherwise)", motw_effect: "blocked under RemoteSigned"}
        - {path: "file drops on C:\\Users\\Public\\Desktop (.vbs/.bat/.exe)", precondition: "user grants access to the folder; victim must then double-click and acknowledge the MotW security warning", motw_effect: "warning dialog; works if the user confirms"}
        - {path: "file drops / script placement on SMB shares", precondition: "user selects a network share in the picker; new files get ZoneId=3 and warn on execution; existing .ps1/.bat modified gain MotW", motw_effect: "warning or interrupted execution; Oneconsult says more dangerous for exfiltration and in Bypass-policy environments"}
        - {path: "OneDrive KFM Desktop stale-blocklist bypass", precondition: "KFM Desktop backup enabled while Chrome is already running (blocklist cached at start); user then selects OneDrive - <TENANT>\\Desktop", motw_effect: "writes sync to the cloud and can affect other users"}
        - {path: "drag-and-drop of individual files from blocked directories (.ssh, Desktop, AppData) via getAsFileSystemHandle()", precondition: "user drags the file onto the page (phishing pretext e.g. 'verification')", motw_effect: "n/a (read); Google classified as 'not a security issue'"}
        - {path: "interactive file-proxy C2 over WebSocket using the persistent directory handle (IndexedDB restore)", precondition: "tab stays open (or user re-confirms once after reopening); no agent or executable on the host", motw_effect: "files written by the proxy still get ZoneId=3"}
      enterprise_policies_named:
        oneconsult: ["FileSystemReadAskForUrls", "FileSystemWriteAskForUrls", "'the respective AskForUrls policies'"]
        danieloz147: "none named; says both Chrome and Edge provide enterprise policies for filesystem read/write site requests"
      other_controls_named_by_oneconsult: ["AppLocker or WDAC (rules must match the actual execution environment)", "central review of Chrome/Edge policies", "awareness training on folder-selection prompts", "purple/red-team validation (Oneconsult service plugs)"]
      detection_advice_oneconsult: ["Zone.Identifier ADS changes in .vscode\\extensions, PowerShell profile paths and OneDrive directories; ReferrerUrl/HostUrl as origin clue", "rules for unexpected PowerShell profile / VS Code extension changes; correlate browser activity with subsequent file changes", "SOC test of detection and response"]
      detection_advice_danieloz147: ["browser processes writing to many files or changing sensitive extensions", "treat chrome.exe/msedge.exe file modifications as behavioural signals needing context"]
      google_issue_trackers_cited_by_oneconsult:
        - {issue: "534049460", topic: "OneDrive KFM stale-blocklist Desktop bypass", state_as_worded: "reported to Google; Google has made the issue public"}
        - {issue: "516164715", topic: "drag-and-drop file handle bypassing ConfirmSensitiveEntryAccess", state_as_worded: "classified 'not a security issue' (user explicitly imported the file)"}
        - {issue: "40059686", topic: "UNC-path filter bypass (historic)", state_as_worded: "fixed (per Oneconsult: 'Until 2022 ... since been fixed')"}
      outbound_links_on_pages:
        - "https://research.checkpoint.com/2026/browser-only-ransomware-from-llm-hallucinations-to-a-practical-attack-technique/"
        - "https://github.com/danieloz147/rogue-sandbox"
        - "https://github.com/danieloz147/Browser-Based-Ransomware"
        - "https://issues.chromium.org/issues/534049460"
        - "https://issues.chromium.org/issues/516164715"
        - "https://issues.chromium.org/issues/40059686"
        - "https://chromium.googlesource.com/chromium/src/+/main/docs/security/faq.md"
    status: "Not a CVE: technique/design-gap research. danieloz147 post 2026-07-05; Oneconsult analysis page published 2026-11-02 and modified 2026-11-04 (tests July 2026). KFM stale-blocklist bypass: reported to Google and public in the Chromium tracker (no fix state stated by Oneconsult); drag-and-drop file read: classified not-a-security-issue by Google (per Oneconsult)."
    exploitation_status: "No in-the-wild exploitation is stated by either source; both are red-team/lab research. danieloz147 states demos ran in a controlled lab on dedicated test files."
    evidence_candidates:
      - {quote: "The analysis is based on tests conducted in July 2026 on Windows 11 using Chrome 150.0.7871.101 and Edge 150.0.7871.101.", publisher: "Oneconsult AG", source_url: *onec}
      - {quote: "This attack vector therefore only works if the execution policy is set to Bypass or Unrestricted.", publisher: "Oneconsult AG", source_url: *onec}
      - {quote: "Google has understandably classified this behavior as \"not a security issue\".", publisher: "Oneconsult AG", source_url: *onec}
    discrepancies:
      - "Google-response attribution: the three Google outcomes in the lead map to DIFFERENT issues. 'Reported to Google / Google has made the issue public' applies to the OneDrive KFM stale-blocklist Desktop bypass (tracker 534049460). 'Not a security issue' applies to the drag-and-drop single-file read (tracker 516164715). The UNC bypass is a 2022 fix. Oneconsult does not state a fix, CVE or severity for the KFM bypass."
      - "MotW semantics differ between the two sources: Oneconsult states that every file written through the FSA API receives ZoneId=3 and 'Modified existing files ... now receive a MotW where none existed before'; danieloz147 states 'Editing by a website does not automatically reclassify a file as internet-downloaded in the Windows trust model.' Hold both and attribute; do not merge."
      - "Policy names: Oneconsult names only FileSystemReadAskForUrls / FileSystemWriteAskForUrls (+ 'the respective AskForUrls policies'). It does not name Blocked-for-URLs or default-setting policies; danieloz147 names no policy at all."
      - "Oneconsult's phrase 'the web server uses Windows' File System Access API' misdescribes the mechanism; danieloz147 states the processing is client-side in the browser ('all meaningful processing happens client-side')."
      - "Oneconsult page has a German sentence fragment embedded in the Public\\Desktop paragraph (extraction/page artefact) and 'Execution Policy Bypass or Unsigned' (likely meant Unrestricted); quoted as written."
      - "Oneconsult dates: the page JSON-LD says published 2026-11-02 and modified 2026-11-04; extractor metadata shows only 2026-11-04. The lead's 'recent' should treat 2026-11-02 as first publication."
      - "danieloz147 states no browser/OS versions; the only tested versions are Oneconsult's (Chrome and Edge 150.0.7871.101, Windows 11). danieloz147's Edge/Chrome behavioural difference (Safe Browsing vs SmartScreen) is lab-observed, not versioned."
      - "Oneconsult's code blocks (JavaScript/PowerShell snippets) are not in the extracted text; only prose and tables were verified. The 'blocklist table' is Oneconsult's reading of Chromium source as of July 2026 and says it is not exhaustive."
    unread: ["Check Point Research 'Browser-Only Ransomware: From LLM Hallucinations to a Practical Attack Technique' (July 2026) - cited by danieloz147, not in the assignment, not fetched", "Chromium issue tracker pages 534049460 / 516164715 / 40059686 - cited by Oneconsult, not in the assignment, not fetched (state of the KFM issue therefore unverified)"]
