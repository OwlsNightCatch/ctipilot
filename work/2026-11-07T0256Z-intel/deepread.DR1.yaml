  - 'KEV: not in CISA KEV (Previdian page statement and KEV catalogue version 2026.11.06 read 2026-11-07). CISA-ADP SSVC in the CVE record lists Exploitation: poc, not active. The "exploitation" evidence is single-source (Previdian sensors) plus the THN relay; Previdian is a commercial vendor with a KEV-style feed (its own "Previdian KEV", not CISA).'
  - 'Timing: THN says first exploitation attempt "less than nine hours after the CVE publication". Previdian timeline: CVE published 05 Nov 15:46 UTC; "Observed by Previdian sensors" 06 Nov 00:05 UTC (about 8h19m) - consistent; the separate KEV-source table row "Previdian Sensors First 2026-11-06 09:53 UTC" is a different timestamp (when the sensor evidence was added to Previdian''s KEV).'
  - 'Previdian page title says "affecting OpenBSD OpenSSH" / "Vendor OpenBSD" - the flaw is in the portable OpenSSH on Linux with musl libc and no PAM, not in OpenBSD itself (CVE.org: platform Linux). Previdian EPSS 1.0% on the page vs sample API epss_score 0.00976 (same value rounded).'
  - 'Lead asked for "source-address/country numbers": the source address (an IP) is deliberately not carried (IOC); country numbers: 8 countries per Previdian; THN says one IP geolocated to Japan.'
