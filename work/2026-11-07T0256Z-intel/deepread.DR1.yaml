  discrepancies:
  - 'Version sets differ: Picus - the updater behaviour affects WordPress 2.7.0 through 7.1.3 and branches 2.7 through 4.6 received no fix; THN, CVE.org (Wordfence CNA) and the WordPress GHSA state the affected range as 4.7 through 7.1.3 (the maintained/backported set), with THN adding that 4.6 and earlier get no fix and the flaw goes back to 2.7. Fixed versions per branch are in the WordPress GHSA table (7.1.4, 7.0.8, 6.9.11 ... 4.7.39).'
  - 'Package exposure: KEV, CVE.org and the WordPress GHSA all say "full-package"/"complete package" upgrades; Picus says full, no_content and new_bundled packages carry the installer files and partial/rollback packages are exposed only if the archive contains them; THN says complete packages always include the installer, a partial package only if it happens to contain it, and (Bayram update 2026-11-06) "isn’t partial versus complete. It’s whether the updater already installed on the site has been fixed." The Picus post (last updated 2026-11-05) predates Bayram''s 2026-11-06 clarification reported by THN.'
  - 'THN''s own check of WordPress.org (2026-11-06): within-branch updates such as 7.1.3 to 7.1.4 were offered as a partial package (including automatic updates); moves from an older branch (7.0.7 to 7.1.4) only complete packages. The exposure of a partial package depends on its contents (not established by either source for the 7.1.3 to 7.1.4 partial).'
  - 'Automatic updates: stated by the WordPress 7.1.4 release post ("If you have sites that support automatic background updates, the update process will begin automatically.") and THN ("installs the fix automatically, via the same updater and the same steps"); Picus does not discuss automatic updates. The WordPress post also said on 2026-10-28 that backports for older branches "are in progress and will ship as they become ready", so an older-branch site may not have been offered its fix at that date; the GHSA (2026-10-29) lists patched versions for all branches back to 4.7.'
  - 'Severity: WordPress GHSA rates it Low (and shows "No known CVE"); Wordfence CNA CVSS 3.1 8.1 (AC:H); CISA KEV lists it as exploited (dueDate 2026-11-06, forensicTriage Yes).'
  - Picus page metadata date reads 2026-10-14 (extractor metadata) while the body says "LAST UPDATED ON NOVEMBER 05, 2026" and describes the 2026-11-03 KEV addition; treat the body date as authoritative. The Picus post says WordPress 7.1.4 was released October 28, 2026 (WordPress release post dated 2026-10-28).
  - Picus pre-fix mechanism (attacker creates wp-config.php in the staging tree which the updater copies over the live file) is what the fix's wp-config.php skip addresses; the residual first-update exposure (attacker sets up the temporary copy with their own database, logs in and runs PHP with web-server privileges) is stated by Picus and THN. Neither says the residual path allows replacing the live wp-config.php.
  - Picus pre-update recommendation text is "Block Web Access to wp-content/upgrade/" with the explicit warning that an .htaccess file INSIDE wp-content/upgrade/ will be deleted by the unpatched unpack_package(); the .htaccess option is only for the WordPress root .htaccess above the rewrite block. THN repeats the same five steps.
  - CISA KEV catalogue (2026.11.06) lists forensicTriage "Yes" for this CVE (BOD 26-04 forensics triage requirement); its description says "during full-package core upgrades".
  unread:
  - 'Wordfence attack analysis (wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/) and THN article "wordpress-rce-flaw-draws-nearly-63000": referenced by THN, outside the assigned sources; not read, so the nine-minute / 14.5-hour telemetry is single-sourced via THN.'
  - 'The public GitHub exploit repositories: not read (no operational detail wanted); THN states whether they work "has not been established".'
