    staging_path_predictability_picus:
      2.7.0-2.7.1: fixed staging path wp-content/upgrade/core
      2.8.0-4.3.35: staging directory name derived from the package local filename, no random suffix (predictable)
      4.4.0-5.8.18: six-character random suffix on the package filename; NOT derivable; conditionally exploitable only if the path is disclosed elsewhere (verbose errors etc.)
      5.9.0-7.1.3: derivable again (Content-Disposition filename rename), e.g. wp-content/upgrade/wordpress-7.1.4
      fixed_updater_7.1.4_and_branch_fixes: 16-character random suffix on the working directory; upgrade/index.php preserved; wp-config.php added to the update_core() skip list
    package_types:
      picus:
        contain_installer_files: full, no_content, new_bundled
        conditional: partial and rollback - exposed only if that individual archive contains setup-config.php, wp-config-sample.php, wp-settings.php and the other installer files
      thn: 'Complete packages always include the installer files; a partial package exposes a site only if it happens to contain them. THN checked WordPress.org update service on 2026-11-06: within-branch update (7.1.3 to 7.1.4) offered a partial package (including for automatic updates); a move from an older branch (7.0.7 to 7.1.4) offered only complete packages. Bayram (2026-11-06 update): WordPress falls back to a complete package if core files do not match checksums or the update is a reinstall; "isn’t partial versus complete. It’s whether the updater already installed on the site has been fixed."'
    automatic_updates:
