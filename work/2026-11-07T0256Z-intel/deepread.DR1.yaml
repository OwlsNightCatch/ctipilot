  - 'Lead asked about Gen7/Gen8/NSv fixed builds: the advisory gives ONE fixed build per generation covering hardware and NSv alike (7.3.4-7013 Gen7, 8.2.3-8015 Gen8); there is no separate NSv build and no separate per-CVE fix table. Note the Gen8 fixed build number equals the build suffix of the affected 8.2.2-8015 (8.2.3-8015 vs 8.2.2-8015) - recorded as the source states it.'
  - 'No workaround: SonicWall structured fields say is_workaround_available false / workaround "None."; the lead text "workaround statement" is therefore the single word "None."; BleepingComputer paraphrases it as "says no workarounds are available".'
