  discrepancies:
  - 'Counts: THN (2026-11-06) says "a total of eight exploitation attempts from an IP address geolocated to Japan"; the Previdian page as read on 2026-11-07 says 14 attempts, 9 unique attacker IPs, 8 countries (CH, DK, IR, JP, NL, NO, SG, US) and 3 sensors, all dated 06 Nov. The counts are different snapshots/definitions (THN''s eight attempts are from one IP; Previdian''s page totals are higher). Use the Previdian page numbers with the as-of marker "Updated 07 Nov 2026"; attribute THN''s eight to THN/Previdian statement. Switzerland (CH) appears in the page''s attacker-country list.'
