  discrepancies:
  - 'KEV: the lead does not mention it, but CVE-2026-111497 IS in the CISA KEV catalogue (dateAdded 2026-10-27, dueDate 2026-11-10; name "Google Brotli Unchecked Return Value Vulnerability"), and the CISA-ADP SSVC says Exploitation: active (2026-10-23). Cisco PSIRT nevertheless says it is "not aware of any malicious use ... against any Cisco product" - a statement scoped to Cisco products, not a contradiction of KEV.'
