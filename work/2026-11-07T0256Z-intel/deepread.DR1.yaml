  - 'Cisco CSAF vs the HTML tables disagree: the CSAF product_status/known_affected lists 18 products (including ASA, FMC, FTD, ISE, NX-OS, Secure Endpoint, FXOS, NDFC, Smart License Utility ...) with a blanket vendor_fix "Cisco has released software updates that address this vulnerability", while the human-readable tables say ASA/FMC/FTD/IOS XE/IOS XR/Catalyst SD-WAN are Not impacted, ISE is Under Investigation, and fixed releases are mostly dated in the future or TBD. The CSAF notes (text) carry the same tables as the HTML, so the HTML tables are the usable per-product status; the CSAF product tree looks over-inclusive/stale. Treat CSAF known_affected as unreliable for this advisory (Cisco states "Affected Product Comprehensiveness: Complete.").'
  - 'Released vs planned (Cisco): the table column is "Fixed Release Available"; Cisco does not label rows released or planned. Rows without any date (Duo Network Gateway 3.4.2, AI Canvas 26.10.4, Spaces 24.22.1, RoomOS builds, Cloud Connect 15.0.SU3 - ES 202701) carry no date; rows with "(Nov 2026)" etc. give only a month; many are "Release no. TBD". The lead summary cannot claim any specific release date from this page.'
  - 'Cisco revision: the advisory is at v1.8 (2026-11-06 20:17 GMT) at fetch time on 2026-11-07; CERT-FR AVI-1467 (05 Nov) reflects an earlier revision (no RoomOS, Cloud Connect, AI PODs, IQ Link, IQ Virtual Appliance, Common Services Platform Collector, but it adds UCS Central Software 2.1(2c) from a different Cisco advisory, cisco-sa-cucs-rce-LzHSFRDQ / CVE-2026-76506).'
  - 'Mitel: all on-prem affected products are "Planned update" (no released fix); only Mitel-operated SaaS (Unify Phone, CloudLink) is stated as updated. Three products have a workaround KB (OpenScape SBC KB000129100, OpenScape SESAP KB000129034, OpenScape Contact Center KB000129114) and MiVoice Business / MiVoice Business Solution Virtual Instance point at KB000129034 for the planned update. KB article contents NOT read (ServiceNow, partner/login gated).'
  - 'CVSS differs by vendor for the same CVE: Google CNA CVSS 4.0 9.2; Siemens 3.1 9.8 / 4.0 9.2; Synology 3.1 9.8 (but advisory severity Moderate); Mitel 3.1 8.1 (AC:H); Cisco SIR High with no per-CVE score. CWE: Google CNA lists CWE-787 and CWE-252; Siemens CWE-787; Synology CWE-252; CISA KEV CWE-252 and CWE-787.'
  - 'Synology: advisory-level Severity "Moderate" / Status "Ongoing" with only Synology Chat Client (a desktop client) affected and no fixed release yet ("OnGoing"); every listed server package is Not affected; the abstract wording ("remote attackers to execute arbitrary code via susceptible versions of the following products") covers all listed products, the table narrows it to one. Mitigation: None.'
  - 'ANSSI AVI-1477 (Mitel): lists "Mitel versions 10.6.0.7 et anterieures" (the Mitel table says MiVoice Business 10.6.0.7 and earlier) and "OpenScape SBC versions anterieures a 11R3.4.5 (disponibilite du correctif non annoncee)" whereas Mitel says V11R3.4.4 and earlier with a planned V11R3.4.5. ANSSI date is 06 Nov 2026 (Mitel advisory first issued 2026-10-28).'
  - 'Siemens: three advisories (SSA-045512 Siemens Products incl. Desigo CC and Gridscale X; SSA-443410 Industrial Edge Management Applications; SSA-898633 RUGGEDCOM APE1808 with Palo Alto Networks PAN-OS). SSA-898633 was not in the assignment; it was surfaced by the siemens-SADP container of the CVE.org record and read. Siemens names the vulnerability "Node2Shell"; Cisco calls the third-party site "Broccoli2Shell". The Desigo CC remediation is the Microsoft .NET security updates (Windows Update), with no KB id or .NET version named in the Siemens advisory. SSA-045512 text says Siemens "has released new versions for the affected products" - for Desigo CC the remediation is a .NET update, not a Siemens version.'
  - 'Lead asked for interim mitigations with KB ids: only Mitel (KB000129034, KB000129100, KB000129114) carries KB ids; Cisco says workarounds are documented only in the product bugs (Cisco bug IDs CSCwx49006, CSCwx48997, CSCwx48988, CSCwx48980, CSCwx48998, CSCwx48976, CSCwx44334 are listed for some rows) and the header says "No workarounds available"; Siemens Industrial Edge gives explicit mitigations (stop CC on Edge; uninstall Management Applications and put IEM behind Firewall/WAF for CC on IEM).'
  - CVE.org stores datePublic 2026-02-27 for a record reserved 2026-10-16 and published 2026-10-22; Cisco and Siemens both say Node.js announced fixes on October 21, 2026. Recorded as read; not interpreted.
  unread:
  - 'Mitel KB articles KB000129034, KB000129100, KB000129114 (mitel.service-now.com): partner/login gated; not fetched, so workaround content is unknown.'
  - 'Cisco Bug Search Tool pages for the CSCwx* bug ids (login gated): per-bug workarounds / fixed releases not read.'
  - 'Siemens ProductCERT CSAF JSON: the cert-portal JSON path returned HTTP 403; structured data was taken from the raw HTML tables and the siemens-SADP container of the CVE.org record (consistent with each other).'
  - 'Node.js security release page, Google Brotli release notes, ellio.tech / aikido.dev write-ups, broccoli2shell.com, Palo Alto Networks CVE-2026-111497 notice: outside the assigned sources; not read (referenced by CVE.org / Cisco / Siemens).'
