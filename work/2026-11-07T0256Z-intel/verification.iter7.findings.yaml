  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (section 2026-11-07T03:53:29Z; record summary; claims fcf6e9f82d, 9cc12016e1, e7bc27a39f)"
  url_or_quote: "https://security-hub.ncsc.admin.ch/#/posts/13054 ; https://ransom-isac.org/blog/the-copeland-incident/"
  summary: >-
    (low confidence) Small paraphrase drift in the new section, none of it changing a decision. (1) Entry: "review refrigeration management systems across all operations" and "allow remote access only
    through a secure VPN or protected network"; record summary: "a four-point checklist for any cooling plant". NCSC post 13054 says "Review refrigeration management systems across all relevant
    operations, including equipment managed by external service providers. Remove direct internet access to management interfaces. Provide remote access through a secure VPN or protected network."
    "Relevant" and the word "only" are not in the source. (2) Entry: "made 588 writes across 26 devices in about six minutes and 155 further writes across five cold rooms, which Ransom-ISAC reads as
    scripted or bulk programming rather than manual edits". Ransom-ISAC says it of the first burst only: "Between approximately 03:15 and 03:21, the same source made 588 parameter writes across 26
    devices. That is about 1.6 writes per second, a pace more consistent with a script or a bulk-programming function than with manual edits." Fix: keep "relevant", drop "only" and "any cooling plant",
    and attach the scripted-pace reading to the 588 writes.
