  item: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge (body, claim 909cb607a5)
  url_or_quote: '"Oneconsult says it reported the issue to Google, which made it public"'
  summary: '(low confidence) The cited Oneconsult page (https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/) says "Note: The bypass has been reported to Google. Google has made the issue public"; it does not say who reported it. Fix: "notes that the bypass has been reported to Google, which made the issue public".'
