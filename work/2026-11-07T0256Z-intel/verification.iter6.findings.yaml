  item: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo (body **Exposure:** line, claim 9839bd780e)
  url_or_quote: '"or a Cisco Duo Network Gateway or RoomOS device below the builds above"'
  summary: '(low confidence) Residual of iteration-5 F3. The Exposure line still lists Cisco Duo Network Gateway and RoomOS as exposed to this flaw without the qualifier the title, summary and cves[].affected now carry. https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u covers four CVEs in one "Impacted Products with Software Fixes" table with no CVE column and says "Cisco is investigating its product line to determine which products may be affected by these vulnerabilities". The run record says the Exposure line now states that Cisco lists the products in a combined advisory; the line does not. Fix: "or a Cisco Duo Network Gateway or RoomOS device that Cisco lists in its combined advisory, below the builds above".'
