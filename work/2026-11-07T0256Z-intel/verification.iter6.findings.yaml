  item: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo (title, headline)
  url_or_quote: 'title: "Desigo CC takes the .NET updates, while Mitel and Industrial Edge fixes are still planned"; headline: "...; fixes pending"'
  summary: '(low confidence) Siemens SSA-443410 lists released fixed versions for six Industrial Edge applications (Data Flow Monitoring V3.0.18, Flow Creator Configurator V1.15.1, Cloud Connector Configurator V1.24.3, Databus Configurator V4.0.1, DataXess Configurator V1.5.7, Edge OPC UA Server Configurator V2.3.10) and says "Siemens has released new versions for several affected products ... is preparing further fixes"; only Common Configurator has no fix. The body says this correctly, the title reads as if no Industrial Edge fix exists. Cisco lists Duo Network Gateway 3.4.2 as a fix too. Fix: "Mitel updates and the Industrial Edge Common Configurator fix are still pending".'
