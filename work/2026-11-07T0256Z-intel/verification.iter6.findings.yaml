  item: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (section 2026-11-07T03:53:29Z, claim 122cc2adfd; record summary, claim 076bf0c907)
  url_or_quote: '"Unit 42 counts over 5,000 internet-exposed devices from the manufacturers CERT-FR names on 5 and 6 November, with 1,853 in the first half of October, 558 in the second half and 316 in the first six days of November" / record summary: "Unit 42 counts over 5,000 exposed devices with a falling trend"'
  summary: 'Unit 42 (https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/) gives two different series: Figure 1 "internet exposed devices by country, top 10 results - Nov. 5-6 2026" (over 5,000 in total; France 234) and Figure 2 "internet exposed devices in France by date since Oct.1, 2026" (1,853 / 558 / 316). The section joins the France-only trend to the multi-country 5,000 total with "with", and the record summary binds "a falling trend" to the 5,000 figure; 316 for 1-6 November cannot be a subset of a 5-6 November count of over 5,000. Fix: say the 1,853 / 558 / 316 trend is for France and the 5,000+ is the 5-6 November count across countries.'
