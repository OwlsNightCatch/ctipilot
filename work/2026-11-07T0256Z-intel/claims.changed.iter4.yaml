    text: "Rapid7's Metasploit framework now carries public modules for two unauthenticated SQL injections on Cisco Secure Email Gateway that end in root command execution: one merged on 2026-11-05 for the injection its author matches, at medium confidence, to the exploited CVE-2026-76461, and one for the S/MIME public-key harvesting feature, a non-default feature, that Rapid7 believes is CVE-2026-76443. Cisco's hardening advisory names no fixed 16.0 build for the hardening CVEs."
