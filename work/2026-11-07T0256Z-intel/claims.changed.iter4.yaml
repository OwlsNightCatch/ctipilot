    text: "**Defender takeaway:** install the current .NET updates on every Desigo CC host, where Common Configurator runs, remove the Industrial Edge Management Applications or stop it on Edge devices until Siemens ships a fix, apply Mitel's workaround articles where an update is still planned, update Duo Network Gateway to 3.4.2, and re-read Cisco's advisory before relying on a fix date because it changes daily; the advisories read report no attacks on these products, while CISA lists the flaw as exploited."
