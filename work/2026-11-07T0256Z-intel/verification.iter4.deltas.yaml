- code: F13
  entry: update 2026-11-07T03:49:14Z
  item: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, Metasploit paragraph (claim 8d1ece9c5c)
  summary: 'The cited .diff says the module ''stacks COPY TO PROGRAM'' but says nothing about Cisco''s mail_logs check; its documentation says the module maps to CVE-2026-76443 ''rather than CVE-2026-76461
    based on the IOCs available for CVE-2026-76461''. The same author''s PR 22024 (https://github.com/rapid7/metasploit-framework/pull/22024, the CVE-2026-76461 module) says ''the ECS SQLi (i.e. this module)
    was the only one that generated this matching IOC'' (the vendor regex COPY.*TO PROGRAM). So the sentence implies Cisco''s log grep covers the S/MIME module, which no cited source states and the author''s
    own PR contradicts. Fix: drop the clause, or say the author reports that this module''s injection did not produce the pattern Cisco''s check searches for, so the mail_logs grep may not find it.'
  remediation_applied: 'fixed: the clause was dropped; the section now reports PR 22024 and states the log pattern only as that author''s account'
  verify_in_this_iteration: confirm the remediation and that no new defect was introduced
