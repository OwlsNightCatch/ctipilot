  entry: update 2026-11-07T03:49:14Z, cves[CVE-2026-76461].status
  item: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
  summary: 'The update reports a public Metasploit module for the S/MIME injection (believed CVE-2026-76443) but not the public module for the exploited CVE-2026-76461 itself: PR 22024 (author sfewer-r7,
    merged 2026-11-05, cross-referenced as ''#22024 Merged'' in the cited PR 22018) adds an exploit for the Email Cloud Scanner URL-retrospective SQL injection, ''medium confidence'' mapped to CVE-2026-76461,
    and notes the mail_logs COPY.*TO PROGRAM pattern matches it. cves[CVE-2026-76461].status [exploited, cisa-kev, patch-available] lacks poc-public and the entry never says a public exploit exists for
    the CISA-listed flaw. The same PR also calls S/MIME harvesting ''a different non-default feature'', which answers the entry''s ''Whether harvesting is on by default is not stated''. Fix: add the module
    and the non-default statement to the update, set poc-public on CVE-2026-76461 (author''s medium-confidence mapping), declare the changed fields in the record.'
  remediation_applied: 'fixed: the section, entry summary, record summary and the CVE-2026-76461 status (poc-public) now carry the merged module for the exploited injection and the author''s non-default
    statement'
  verify_in_this_iteration: confirm the remediation and that no new defect was introduced
