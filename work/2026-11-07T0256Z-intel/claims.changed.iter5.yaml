    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.8 (CVSS 3.1, Siemens)\", \"status\": [\"cisa-kev\", \"poc-public\", \"patch-available\", \"no-patch\"], \"affected\": \"Siemens Desigo CC V8 and V9, all versions; Industrial Edge Management Applications, Common Configurator and the configurator applications below their fixed versions; Mitel MiVoice Business 10.6.0.7 and earlier, MiVoice Business Solution Virtual Instance up to the build Mitel lists, OpenScape SBC V11R3.4.4 and earlier, OpenScape SESAP V2 R1.1.9 and earlier, OpenScape Contact Center V12R0 to V12R0FR7, OpenScape Xpert V9 R0.2.0 and earlier, OpenScape Endpoint Management V1 R2.5.1 and earlier; Cisco Duo Network Gateway and RoomOS below the builds Cisco lists\", \"fixed\": \"Desigo CC: latest .NET security updates via Windows Update; Industrial Edge: Data Flow Monitoring V3.0.18, Flow Creator Configurator V1.15.1 and four further configurators, Common Configurator no fix; Mitel: updates planned (OpenScape SBC V11R3.4.5, SESAP V2 R1.1.10, Contact Center V12R0FR8), none released; Cisco: fixes listed in its combined advisory for Duo Network Gateway 3.4.2 and RoomOS on-premises 11.41.2.3 and 26.7.4.3, not tied to one CVE\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 2757350671
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** install the current .NET updates on every Desigo CC host, where Common Configurator runs, remove the Industrial Edge Management Applications or stop it on Edge devices until Siemens ships a fix, apply Mitel's workaround articles for OpenScape SBC, SESAP and Contact Center while no update is released, update Duo Network Gateway to 3.4.2, and re-read Cisco's advisory before relying on a fix date because it changes daily; Cisco says it is not aware of malicious use against its products, while CISA lists the flaw as exploited."
