claims:
  - claim_id: c1dc7be142
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Cisco Secure Email Gateway now: unauthenticated root RCE via a single email, already exploited: A remote, unauthenticated attacker gains root on the appliance by sending it one crafted email; there is no workaround and no mitigation short of upgrading. Cisco found this in a TAC support case, and CISA lists it as exploited. Upgrade every physical and virtual Secure Email Gateway appliance today and hunt mail_logs for the pattern Cisco names before assuming a device is clean; a clean result does not rule out the S/MIME injection."
  - claim_id: 8b895a5e09
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Grep every appliance's mail_logs (and, if clustered, every cluster member's logs) for the pattern \"COPY.*TO PROGRAM\" and cross-check firewall/network logs external to the appliance for unexpected outbound connections; a successful exploit grants root, so an attacker may have removed local log evidence of their own access; a clean result does not rule out the S/MIME injection, which did not leave that pattern in the module author's reproduction."
