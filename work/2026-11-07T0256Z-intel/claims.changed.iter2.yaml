  - claim_id: ea242b9b6a
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "During a core update with a complete package, the new files are unpacked into a predictable directory under `wp-content/upgrade`; the temporary copy includes the installer, and an unauthenticated attacker who requests it at the right moment can interact with the staged copy and reach PHP code execution ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 9f785caa23
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Wordfence reports that its new firewall rule matched within nine minutes of deployment and that it recorded more than 18,500 requests for staged `setup-config.php` installer paths in the first 21 hours ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 6ade5a9fb8
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Exposure:** any WordPress site on 4.7 to 7.1.3 with `wp-content/upgrade/` reachable from the internet while a core update runs; the discoverer says the deciding factor is whether the updater already installed on the site has been fixed, so the update to 7.1.4 is exposed too, automatic updates included, although a partial package exposes the installer only if it contains the installer files ("
    urls: ["https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"]
  - claim_id: aea0c7390a
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "The fixed releases are 7.1.4 and the backport of each branch (7.0.8, 6.9.11 and so on down to 4.7.39) ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: b35a890800
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Where an update ran while the site was unpatched and the directory was reachable, confirm that `wp-config.php` and the database it names are unchanged and look for administrator accounts, plugins and PHP files under `wp-content/upgrade/` that nobody created ("
    urls: ["https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"]
  - claim_id: d1d8aba87e
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "section 2026-11-07T03:51:45Z"
    kind: cited
    text: "Picus says the new code's skip of wp-config.php already works in that first update but the randomised folder name does not, so the temporary installer sits at a predictable path on sites running 5.9 or later and, on 4.4 to 5.8, behind a random suffix that hides it unless the site leaks the path; an attacker who reaches it can no longer replace the live configuration but can still set up the temporary copy, log in to it, run PHP and from there read or write files in the live directory ("
    urls: ["https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability"]
  - claim_id: 908f35a3ed
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "section 2026-11-07T03:51:45Z"
    kind: cited
    text: "It’s whether the updater already installed on the site has been fixed\", and that a partial package exposes the installer only if it contains the installer files; The Hacker News found WordPress.org offering an in-branch move such as 7.1.3 to 7.1.4 as a partial package, automatic updates included, so whether such an update is exposed depends on what that package contains, and only once 7.1.4 or the branch fix is installed do later updates use a random folder ("
    urls: ["https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"]
  - claim_id: 0349a1f916
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "section 2026-11-07T03:51:45Z"
    kind: cited
    text: "For sites that stayed on an affected version, Wordfence suggests looking for unexpected requests to PHP files under wp-content/upgrade, administrator accounts no one recognises, plugins no one installed and PHP files in wp-content/upgrade that no one put there ("
    urls: ["https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"]
  - claim_id: c8e52b6eb7
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "section 2026-11-07T03:51:45Z"
    kind: cited
    text: "Code that its authors describe as an exploit has appeared in public GitHub repositories since earlier this week, and whether it works has not been established; WordPress's own advisory rates the flaw low, against Wordfence's CVSS 8.1 and CISA's listing as exploited ("
    urls: ["https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html"]
  - claim_id: cdd7461f0f
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
