    entry: 2026-11-07/tum-mytum-legacy-portal-credential-harvest-tumonline
    surface: "body"
    kind: derived
    text: "**Exposure:** a public university or other public body that keeps a retired or secondary sign-in portal validating against its central directory, so that every password typed there is a credential for the primary identity and administration systems; TUM's accounts with MFA held, and the lesson transfers to Swiss cantonal and university portals."
