  - claim_id: cee803c0cb
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "record 2026-11-07T03:51:45Z"
    kind: record-summary
    text: "The discoverer, Umut Bayram of Picus Security, shows that the update installing WordPress 7.1.4 still unpacks with the site's old code, so the staging folder under wp-content/upgrade can be reachable at a predictable path during that update, while a partial package exposes the installer only if it contains the installer files; he advises denying web access to the folder and confirming it answers 403 before updating."
