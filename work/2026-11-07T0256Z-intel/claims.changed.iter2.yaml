    surface: "body"
    kind: cited
    text: "The canton says the law anchors uniform standards and a holistic information-security system in the cantonal administration, that an information-security specialist unit is to advise the cantonal bodies and be equipped with directive and enforcement powers so that one detection and defence strategy can be implemented, and that a further specialist unit for personnel security vetting and a cantonal cyber coordination office are being set up, both at the cantonal police (translated from German) ("
    urls: ["https://www.ag.ch/de/medien/medienmitteilungen?mm=bulletin-zur-regierungsratssitzung-b790d5a8-ec12-4162-98c6-daac664c6033_de"]
  - claim_id: 43bbf40ff9
    entry: 2026-11-07/aargau-infosiv-adopted-information-security-law-2027-01-01
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** from 1 January 2027 Aargau cantonal bodies answer to one information-security specialist unit that is to be equipped to issue binding directives, so the 2026 task is reading the ordinance and the directives the specialist unit issues; the canton describes the unit's planned powers and not detailed duties, and communal IT owners should read the final text to see whether they are covered."
  - claim_id: 9a642639fb
    entry: 2026-11-07/tum-mytum-legacy-portal-credential-harvest-tumonline
    surface: "summary"
    kind: frontmatter
    text: "The Technical University of Munich said on 2026-11-06 that unknown attackers attacked its myTUM portal and captured the central-login passwords of all persons who had signed in there, among them the credentials of a TUMonline system administrator, with which they attacked the campus-management system TUMonline, which TUM took off the network. TUM says accounts with multi-factor authentication were protected, reported the incident to the Bavarian data-protection commissioner and filed a criminal complaint; heise reports that the entry point was a legacy system and that about 60,000 users are concerned."
