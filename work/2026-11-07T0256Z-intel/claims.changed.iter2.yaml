    entry: 2026-11-07/aargau-infosiv-adopted-information-security-law-2027-01-01
    surface: "summary"
    kind: frontmatter
    text: "The Aargau government council announced on 2026-11-06 that it adopted the information-security ordinance (InfoSiV) and that the information-security law (InfoSiG) and the ordinance enter into force on 1 January 2027. An information-security specialist unit is to advise cantonal bodies with directive and enforcement powers, and a cantonal cyber coordination office, headed from that date by Bernhard Droz, and a personnel-security-vetting unit sit at the cantonal police."
