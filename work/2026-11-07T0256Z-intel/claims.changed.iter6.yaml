    surface: "body"
    kind: cited
    text: "**Triage:** Cisco's own discriminator is the mail_logs pattern `COPY.*TO PROGRAM`; any hit is evidence of attempted or successful exploitation and warrants incident response, not just a patch, since success implies root-level compromise and possible log tampering; a clean mail_logs result does not rule out the S/MIME injection, which left no such pattern in the module author's reproduction ("
    urls: ["https://github.com/rapid7/metasploit-framework/pull/22024"]
  - claim_id: ea42f3cb59
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every internet-facing Cisco Secure Email Gateway as potentially already compromised until patched and checked; Cisco's detection guidance and the KEV listing both signal active use against real environments."
  - claim_id: 55d6d7d536
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16. Previdian's page, as read on 2026-11-07, reports 15 exploitation attempts from 10 addresses since 2026-11-06 and, according to The Hacker News, a successful root login on an Alpine honeypot; CISA does not list the flaw."
