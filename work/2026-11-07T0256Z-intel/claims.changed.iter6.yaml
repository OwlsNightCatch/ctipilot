    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.8 (CVSS 3.1, Siemens)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\", \"no-patch\"], \"affected\": \"Siemens Desigo CC V8 and V9, all versions; Industrial Edge Management Applications, Common Configurator and the configurator applications below their fixed versions; Mitel MiVoice Business 10.6.0.7 and earlier, MiVoice Business Solution Virtual Instance up to the build Mitel lists, OpenScape SBC V11R3.4.4 and earlier, OpenScape SESAP V2 R1.1.9 and earlier, OpenScape Contact Center V12R0 to V12R0FR7, OpenScape Xpert V9 R0.2.0 and earlier, OpenScape Endpoint Management V1 R2.5.1 and earlier; Cisco Duo Network Gateway and RoomOS, which Cisco's combined advisory lists in a table with no per-CVE column, below the builds it lists\", \"fixed\": \"Desigo CC: latest .NET security updates via Windows Update; Industrial Edge: Data Flow Monitoring V3.0.18, Flow Creator Configurator V1.15.1 and four further configurators, Common Configurator no fix; Mitel: updates planned (OpenScape SBC V11R3.4.5, SESAP V2 R1.1.10, Contact Center V12R0FR8), none released; Cisco: fixes listed in its combined advisory for Duo Network Gateway 3.4.2 and RoomOS on-premises 11.41.2.3 and 26.7.4.3, not tied to one CVE\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
