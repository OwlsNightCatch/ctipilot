  - claim_id: 231d797fff
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16. Previdian reports 14 exploitation attempts from 9 addresses on 2026-11-06 and, according to The Hacker News, a successful root login on an Alpine honeypot; CISA does not list the flaw."
  - claim_id: 2a9547ed63
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "cves[CVE-2026-123158]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123158\", \"cvss\": \"8.1\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"OpenSSH Portable before 10.6p2 on Linux with musl libc and no PAM; needs an account whose password field is * and at least one other account with a real password\", \"fixed\": \"OpenSSH Portable 10.6p2; Alpine edge 10.6_p2-r0, 3.24 10.3_p1-r2, 3.23 10.2_p1-r1, 3.22 10.0_p1-r11, 3.21 9.9_p2-r1, 3.20 9.7_p1-r6, 3.19 9.6_p1-r3, 3.18 9.3_p2-r4, 3.17 9.1_p1-r7, 3.16 9.0_p1-r6 per OX Security; temporary mitigation PasswordAuthentication no\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 6350735ebf
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "Portable OpenSSH 10.6p2, released on 2026-11-05, carries what its release notes call a critical security workaround for Linux systems that use the musl libc with PAM disabled ("
    urls: ["https://www.openssh.org/txt/release-10.6p2"]
  - claim_id: b797396646
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "NCSC Switzerland says remote, unauthenticated attackers can bypass SSH password authentication over the network and gain access, and rated the exploitation status unknown ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13155"]
  - claim_id: e0841f8538
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX Security explains the mechanism: musl's crypt() refuses inputs over 256 bytes and returns the string `*` when it fails, `*` is also what /etc/shadow holds for an account with no valid password, and OpenSSH, whose 2016 user-enumeration countermeasure can hash a password with settings taken from another account, reads the two matching values as a successful login ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: b0e1fa8ce4
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX gives the conditions: sshd on musl without PAM (Alpine's openssh-server by default, or UsePAM no), password logins enabled, an account whose password field is `*` (key-only users, LDAP users, root on Alpine) and at least one other account on the host with a real password; accounts that hold `!`, glibc systems, PAM setups, Dropbear and OpenBSD are not affected, and OX scores the flaw CVSS 3.1 8.1 ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 0880960c27
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "On Alpine's official AWS and Azure images the passwordless account is the default alpine user, which can run doas without a password, so the bypass chains to root there ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: c2f6b1d81d
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "The OpenSSH developers do not consider the root cause to lie in OpenSSH ("
    urls: ["https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html"]
  - claim_id: 66c2c67d44
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
