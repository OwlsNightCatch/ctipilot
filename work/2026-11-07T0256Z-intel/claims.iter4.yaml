    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-834709.html"]
  - claim_id: daf3b334d3
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "section 2026-11-07T03:48:06Z"
    kind: uncited
    text: "Siemens revised SSA-834709 to V1.1 on 2026-11-04, describing the change as \"Clarified Affected products list."
  - claim_id: 33c14cae8e
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "section 2026-11-07T03:48:06Z"
    kind: uncited
    text: "Owners of the Basic, M.2 and SM variants are therefore in scope for the update and for the exposure and detection points above; the 10.0 scores and the two interim mitigations are unchanged."
  - claim_id: 56655c3f24
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "record 2026-11-07T03:48:06Z"
    kind: record-summary
    text: "Siemens revised its advisory SSA-834709 to V1.1 on 2026-11-04 and now lists the SIMATIC IoT2050 Advanced, Basic, M.2 and SM variants as affected, all versions below V4.3.4-1 with Node-RED installed; the fix and interim mitigations are unchanged, so owners of the three further variants are in scope as well."
  - claim_id: 502dd92af7
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco disclosed CVE-2026-76461 (CVSS 9.8) on 2026-09-14: an unauthenticated attacker who sends a single crafted email containing SQL statements to a Cisco Secure Email Gateway can execute arbitrary OS commands as root. Cisco confirms active exploitation and says the flaw was found during the resolution of a TAC support case; there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog the same day. Cisco simultaneously shipped a hardening release fixing five further internally-found vulnerabilities in the same product; Cisco's hardening advisory says two vulnerabilities from its internal review are known to be exploited, this one and the arbitrary file write CVE-2026-76519. On 2026-10-31 Cisco re-released the 15.5.5-014 fix in light of new information related to exploit code available online, so a 15.5 appliance patched earlier needs a check of its Retro Remediation Engine version. Public Metasploit modules now exist for the exploited injection (merged 2026-11-05, its author's medium-confidence match to CVE-2026-76461) and for a second S/MIME injection that its author believes is CVE-2026-76443, for which Cisco names no fixed 16.0 build."
  - claim_id: 1c966f2e0d
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Cisco Secure Email Gateway appliance (physical and virtual) to AsyncOS 15.5.5-014 as re-released on 2026-10-31 (on an appliance that took the earlier build, confirm with retroscannerstatus that Retro Remediation Engine runs 4.0.2 or later), 16.0.4-302, or 16.5.0-780 (Cisco's recommended target) now; 16.0.4-302 closes CVE-2026-76461 only, because the hardening advisory names no fixed 16.0 release, so move a 16.0 appliance to 16.5.0-780 to close the five hardening-release CVEs (CVE-2026-76440, CVE-2026-76441, CVE-2026-20353, CVE-2026-76443, CVE-2026-76442) as well, one of which, CVE-2026-76443, has a public Metasploit module according to its author."
  - claim_id: 296f50a482
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Grep every appliance's mail_logs (and, if clustered, every cluster member's logs) for the pattern \"COPY.*TO PROGRAM\" and cross-check firewall/network logs external to the appliance for unexpected outbound connections; a successful exploit grants root, so an attacker may have removed local log evidence of their own access."
  - claim_id: d652d6da8c
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[2]"
    kind: frontmatter
    text: "Secure Email Cloud customers should confirm directly with Cisco whether their instance is among those where indicators of compromise were identified; Cisco states it has already proactively contacted affected Cloud customers and upgraded all Cloud instances."
  - claim_id: a28682ad65
