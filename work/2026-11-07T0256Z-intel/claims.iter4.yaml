claims:
  - claim_id: 8dacaee08c
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "headline"
    kind: frontmatter
    text: "VulnCheck caught exploitation of the Node-RED flaw in Siemens IoT2050; all four variants affected, V4.3.4-1 fixes"
  - claim_id: 2c26dba4da
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "summary"
    kind: frontmatter
    text: "Siemens ProductCERT advisory SSA-834709 of 2026-08-11 discloses CVE-2026-58115, rated 10.0 on both CVSS 3.1 and 4.0: SIMATIC IoT2050 devices running Industrial OS with Node-RED installed do not enforce authentication on the Node-RED HTTP interface, so an unauthenticated attacker with network reach can create a flow and run code with maximum privileges. Siemens' advisory, revised on 2026-11-04, lists the Advanced, Basic, M.2 and SM variants, all versions below V4.3.4-1; V4.3.4-1 is the fix, and Siemens offers uninstalling or hardening Node-RED as interim mitigations. VulnCheck reports that on 2026-10-30 one of its canaries caught exploitation, a single request that deployed a flow downloading and running a Linux bot, with web-shell flows from the same address since; the target was a canary and the activity looks like opportunistic mass scanning."
  - claim_id: fa3acae621
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every SIMATIC IoT2050 (Advanced, Basic, M.2 and SM) to V4.3.4-1 or later now; where that cannot happen at once, uninstall Node-RED on units that do not use it, since Siemens names uninstalling or hardening Node-RED as its interim mitigations and exploitation takes a single unauthenticated request."
  - claim_id: ae95b1ed1c
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Node-RED instance that was reachable from an untrusted network, review the deployed flows for exec nodes and http-in endpoints that nobody built, and the access logs for POST requests to /flows from non-engineering addresses."
  - claim_id: 7cd283cbd6
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "cves[CVE-2026-58115]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-58115\", \"cvss\": \"10.0\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"SIMATIC IoT2050 Advanced (6ES7647-0BA00-1YA2), Basic (6ES7647-0BA00-0YA2), M.2 (6ES7647-0BB00-1YA2) and SM (6ES7647-0CA00-1AA2), all versions < V4.3.4-1 running Industrial OS with Node-RED installed\", \"fixed\": \"V4.3.4-1 or later\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: caa214e1d6
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "Siemens scores it 10.0 under CVSS 3.1 and 4.0 (CWE-306), names V4.3.4-1 as the fix for every earlier version, and offers uninstalling Node-RED or hardening it per its User Guide as interim mitigations ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-834709.html"]
  - claim_id: 88509d75ca
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "CERT-FR and NCSC-NL carried the advisory in August and list only the Advanced variant ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1009/", "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0282"]
  - claim_id: 99d8616eff
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "VulnCheck reports that on 2026-10-30 one of its canaries caught an attacker exploiting CVE-2026-58115 with a single POST to the Node-RED /flows endpoint: an inject node wired to an exec node ran a base64-wrapped shell command that downloaded a Linux bot into the RAM-backed /dev/shm as a hidden file and started it detached ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: ed8af93961
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "By 2026-11-01 the same address had produced 16 events against this CVE with further payloads, among them flows that expose an http-in endpoint wired to an exec node as a persistent web shell; VulnCheck did not retrieve the bot, so its function is unknown, and it reads the address as opportunistic mass-scanning infrastructure rather than a campaign ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: caed26daa7
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "The target was a canary, not a Siemens device, and CISA's catalog did not list the flaw as VulnCheck wrote ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: 7a611a2ad2
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "); The Register relays the finding ("
    urls: ["https://www.theregister.com/security/2026/11/02/max-severity-bug-in-widely-used-ot-programming-tool-exploited-to-deliver-linux-malware/5307086"]
  - claim_id: 889f76b9cb
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "**Exposure:** a SIMATIC IoT2050 (Advanced, Basic, M.2 or SM) below V4.3.4-1 running Industrial OS with Node-RED installed and its HTTP interface reachable by an attacker ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-834709.html"]
  - claim_id: 45fa09844e
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "); VulnCheck says Node-RED instances without adminAuth are being found and exploited automatically and that Node-RED is embedded in other ICS and OT products ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: d39c91121f
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: cited
    text: "**Detection:** in web or reverse-proxy access logs, POST requests to the Node-RED /flows endpoint from sources that are not engineering workstations, above all bodies that deploy an exec node carrying a base64 string piped into sh, which a filter matching only wget or curl misses; on the host, hidden files started from /dev/shm or /tmp and detached with setsid or nohup by the Node-RED process, and deployed flows with exec nodes or http-in endpoints that nobody built, since the web-shell flows survive the loss of the memory-resident implant ("
    urls: ["https://www.vulncheck.com/blog/exploitation-targeting-node-red"]
  - claim_id: acc861c0ff
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: uncited
    text: "Siemens ProductCERT published SSA-834709 on 2026-08-11 for CVE-2026-58115 in SIMATIC IoT2050 devices running Industrial OS with Node-RED installed (the current advisory, V1.1 of 2026-11-04, lists the Advanced, Basic, M.2 and SM variants): affected devices \"do not enforce authentication on the Node-RED HTTP interface, allowing unauthenticated access to programming nodes that are capable of executing system commands on the server\", so an unauthenticated remote attacker can create malicious flows and run code with maximum privileges."
  - claim_id: f6c217c7e3
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate engineering deployments also POST to /flows; the signal is a deployment from a non-engineering address whose exec node carries encoded shell or a download-and-execute chain (an inference from the described mechanism)."
  - claim_id: 0f7a0ba8d0
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update every IoT2050 to V4.3.4-1 or later or uninstall Node-RED where it is not used, and take the Node-RED interface of any device off networks that untrusted hosts can reach, because exploitation takes one request and is now observed; on any exposed Node-RED, review the deployed flows for planted exec nodes and http-in endpoints."
  - claim_id: 2e703bc72e
    entry: 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root
    surface: "section 2026-11-07T03:48:06Z"
