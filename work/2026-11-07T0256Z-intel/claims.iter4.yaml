    text: "Alpine pushed the fix to every branch back to 3.16 (edge 10.6_p2-r0, 3.24 10.3_p1-r2, 3.23 10.2_p1-r1, 3.22 10.0_p1-r11, 3.21 9.9_p2-r1, 3.20 9.7_p1-r6, 3.19 9.6_p1-r3, 3.18 9.3_p2-r4, 3.17 9.1_p1-r7, 3.16 9.0_p1-r6) ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
