    surface: "body"
    kind: cited
    text: "Upgrading to 15.5.5-014 or 16.5.0-780 closes the exploited flaw and the hardening CVEs together, while for a 16.0 appliance the hardening advisory names no fixed release and says to migrate, so 16.0.4-302 closes CVE-2026-76461 only ("
