    kind: frontmatter
    text: "{\"id\": \"CVE-2026-76443\", \"cvss\": \"9.8\", \"status\": [\"patch-available\", \"poc-public\"], \"affected\": \"Cisco Secure Email Gateway and Secure Email and Web Manager, all configurations; a separate finding from the same September 2026 internal hardening review, grouped under CWE-707, which Cisco's own table describes as covering command, SQL, and code/eval injection, and cross-site scripting collectively, without stating which applies to this CVE ID specifically; listed separately from CVE-2026-76461 (Cisco says one vulnerability in this injection class, the SQL injection CVE-2026-76461, is known to be actively exploited); Rapid7's public Metasploit module, which its author believes maps to this CVE, needs S/MIME public-key harvesting enabled on the inbound mail flow policy\", \"fixed\": \"Gateway: 15.5.5-014 / migrate off 16.0 / 16.5.0-780. Web Manager: 15.5.5-006 / migrate off 16.0 / 16.5.0-429\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
