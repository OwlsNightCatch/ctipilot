  - claim_id: ebb6fa87bc
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall has not shared details about the reported exploitation ("
