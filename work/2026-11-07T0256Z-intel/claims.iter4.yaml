    surface: "body"
    kind: cited
    text: "Cisco's own advisory names the mechanism plainly: insufficient validation in the email-parsing logic of AsyncOS lets an unauthenticated remote attacker send a single crafted email containing SQL statements through the device, and \"a successful exploit could allow the attacker to execute arbitrary SQL statements, leading to command execution with root privileges on the underlying operating system\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX"]
  - claim_id: 42ff84740f
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "First, Cisco states the vulnerability \"was found during the resolution of a Cisco TAC support case\" (while the hardening advisory lists the same flaw among those found during internal testing ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm"]
  - claim_id: b49bb65ce4
