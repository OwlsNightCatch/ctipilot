    kind: cited
    text: "The Aargau government council adopted the information-security ordinance (InfoSiV) and decided that the information-security legislation, the law (InfoSiG) and the ordinance, enters into force on 1 January 2027 (translated from German) ("
    urls: ["https://www.ag.ch/de/medien/medienmitteilungen?mm=bulletin-zur-regierungsratssitzung-b790d5a8-ec12-4162-98c6-daac664c6033_de"]
