    text: "Between 2026-10-27 and 2026-11-06 Siemens, Mitel and Cisco listed products that bundle the Brotli decoder flaw CVE-2026-111497: Siemens names Desigo CC V8 and V9 (remedy: the latest .NET security updates) and Industrial Edge, where Common Configurator has no fix; Mitel names MiVoice Business and five OpenScape products with updates planned and workaround articles for three; Cisco names Duo Network Gateway (fixed in 3.4.2) and RoomOS among products with fixes dated up to 2027. Cisco says it is not aware of malicious use against any Cisco product, and CISA lists the flaw as exploited."
