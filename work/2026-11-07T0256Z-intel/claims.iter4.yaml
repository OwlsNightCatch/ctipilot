  - claim_id: ddce8e6940
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "headline"
    kind: frontmatter
    text: "BOSSAI AI agents took emergency-services data through open ports, public APIs and default credentials"
  - claim_id: 94105aeda3
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "summary"
    kind: frontmatter
    text: "Acronis TRU describes BOSSAI, an agentic campaign it attributes with high confidence to one operator in Taiwan: a mesh of 12 AI agents, nine active, that over 12 observed days targeted government emergency services, banks, universities and military systems in 11 countries, with confirmed data exfiltration or system access at roughly ten targets in three countries. The confirmed emergency-services harm was patient-care records of a Taipei fire department and dispatch case records of a city 119 system; TRU says the agents failed where authentication was enforced and endpoints were filtered."
  - claim_id: 12855ce5b8
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "Acronis TRU found an open attack workstation holding more than 90,000 files and describes BOSSAI as a mesh of 12 AI agents, nine active, driven by a changing roster of language models, with the operator acting as the bridge between agents and typing commands in Traditional Chinese ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 977def65ac
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "The agents that executed attacks ran almost exclusively on abliterated open-weight models run locally, after commercial models repeatedly refused offensive requests ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 918d857422
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "In the 12 days TRU observed, the operator targeted government emergency services, banks and lenders, universities and military systems in 11 countries, with confirmed exfiltration or system access at roughly ten targets in three countries and about fifteen more attacked without confirmed compromise ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 4b4f2b4815
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "A Taipei fire-department patient-care records platform exposed ECG readings, ambulance video and vital signs from 2018, accessible without credentials; a city's 119 dispatch system yielded case records with incident times, response types, status fields and street-level locations across seven districts from the system's API; and a fire-dispatch vendor's database administration panel opened with default root credentials, exposing 18 or more tables ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 45bf13c673
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "In an emergency-management system the agents found a hardcoded AES-256 key in front-end JavaScript that exposed session-cookie contents, an administrator identity among them, and a partial server-side request forgery path, without confirming a full compromise ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 8bf09a0b30
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "A brute-force run against a national fire agency's single sign-on portal gave no confirmed access, and the critical Apache flaw that the operator's vulnerability platform reported at a disaster-response centre was fabricated, because the port was filtered ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 45860a5274
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: cited
    text: "TRU says the agents failed where authentication was enforced, where paywalls required valid sessions and where endpoints were properly filtered, and that obscurity no longer protects a system from agents that investigate hundreds of targets at once ("
    urls: ["https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/"]
  - claim_id: 6aa84e889a
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: uncited
    text: "The confirmed emergency-services harm is the part that matters here."
  - claim_id: 0ea038ec85
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: derived
    text: "**Exposure:** emergency-service, dispatch and public-safety systems that expose a record API or a legacy data port without authentication, leave default administrator credentials on a vendor's database panel, or ship secrets in front-end JavaScript; those are the weaknesses the agents turned into data, and TRU reports the three emergency-services cases as the gravest confirmed harm."
  - claim_id: b749fabe08
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: derived
    text: "**Detection:** TRU names sqlmap, nmap and nikto among the most-used tools, so the traffic is ordinary scanner traffic in web access and authentication logs (an inference from the tool list): bursts of SQL-injection probing, repeated sign-in attempts against a single sign-on portal from one source, and logins to a database administration panel with a default account."
  - claim_id: de4b2e46f7
    entry: 2026-11-07/bossai-ai-agent-mesh-emergency-services-data-taiwan
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Swiss dispatch, patient-care and records systems of emergency services are the same target class, so check them for unauthenticated APIs and legacy ports, default root or administrator credentials on vendor panels, and keys or tokens in front-end code; the agents failed wherever authentication was enforced, so closing those gaps is what stops this tooling."
  - claim_id: 3aaaa587f4
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "headline"
    kind: frontmatter
    text: "Kaspersky: ESXi and Proxmox ransomware ran on a monitoring server's root password and admin notes, no VM escape"
  - claim_id: 2217605493
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky's Global Emergency Response Team describes two ransomware cases in virtualised estates. In the BlackNevas case a PRTG Network Monitor held ESXi root access and the same root password was reused across hosts, so the attacker connected over SSH, disabled the execInstalledOnly policy with esxcli, ran the encryptor and deleted logs; in the case attributed to The Gentlemen the actor found Proxmox root credentials in plaintext notes on an administrator workstation and used the VNC web socket to encrypt the cluster. Kaspersky stresses that no VM escape was needed."
  - claim_id: 7efb9e7473
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "actions[0]"
    kind: frontmatter
    text: "List every monitoring server, script, scheduled task and connection manager that stores an ESXi, vCenter or Proxmox root password, replace each with a least-privilege monitoring account, and rotate the root passwords that were stored or reused across hosts."
  - claim_id: b4269569b3
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "In the first case, Kaspersky's investigation began with BlackNevas ransomware activity on a Windows system in a virtualised domain-controller segment, where the execution of the AnyDesk remote tool and the GMER binary was recorded ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: e02bacc975
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "The environment used PRTG Network Monitor, whose deployment had broad access to the ESXi hosts, and the same root password was reused across several nodes; after obtaining access to the monitoring environment the attacker used the ESXi credential to connect over SSH to the hosts that shared the password ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 5d3a7e2f64
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "On the first host, a file was uploaded during a root SSH session and its first execution failed with \"Execution of non-installed file prevented\"; the actor then disabled the execInstalledOnly policy with esxcli and ran it, while on a second host in another subnet with the same password the binary ran and the logs were cleared ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 4cfb8bfe37
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "In the second case, a ransomware incident by The Gentlemen, the actor used information it had collected between initial access and visible impact: on a compromised system administrator's workstation it found Proxmox root credentials and access details in plain-text notes and logged in as root ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 972e4eae47
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "It then activated the VNC web socket through the root account, which gave it control of the Proxmox environment, and used that access to download and run the ransomware in the cluster, encrypting the whole virtual environment ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 185c0d122a
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "Kaspersky says a fully patched hypervisor can still be compromised through a shared password, an overprivileged monitoring account, an open SSH path or an administrator interface reachable from a general server network ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: ff7a438074
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "**Exposure:** a virtualisation estate where a monitoring, backup or management server stores or can use hypervisor root credentials, where one root password is shared across hosts, where SSH to ESXi is reachable from general server networks, or where administrators keep Proxmox or ESXi credentials in plain-text notes; PRTG, which supports storing VMware credentials at device or group level, is the product Kaspersky names ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 2be232de7c
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "**Detection:** on ESXi, root SSH logins from addresses that do not normally administer the hosts, a file upload followed by a failed execution of a non-installed file, a change to the execInstalledOnly setting and cleared logs; on Proxmox, root@pam requests to the VNC web socket used to reach other hosts, as the log records Kaspersky shows ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: 37dda9a0ca
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "Kaspersky advises alerting when execInstalledOnly, Secure Boot enforcement, Lockdown Mode, SSH, local accounts or remote logging settings change ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: d9d2b52718
    entry: 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** give each monitoring platform its own least-privilege identity instead of ESXi root, replace stored root passwords with vault retrieval or limited tokens, administer ESXi through vCenter with Lockdown Mode and SSH stopped by default, and keep logs off the hosts so a compromised administrator cannot erase them ("
    urls: ["https://securelist.com/virtualization-security-esxi-and-proxmox-ransomware-cases/121819/"]
  - claim_id: ad6205e6d4
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "headline"
    kind: frontmatter
    text: "Oneconsult: a site granted a folder in Chrome or Edge can steal tokens and plant VS Code and PowerShell persistence"
  - claim_id: 977ed4b22c
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "summary"
    kind: frontmatter
    text: "Oneconsult's analysis of Chromium's Windows blocklist shows that a website granted a folder through the File System Access API after two clicks keeps a handle for as long as the tab is open, and that the blocklist leaves .vscode, .Azure, C:\\Users\\Public, SMB shares and, after a OneDrive Known Folder Move, the Desktop reachable. The paths it demonstrates are token and .env theft, a fake VS Code extension and PowerShell profile or module backdoors that need the Bypass or Unrestricted execution policy, and a file proxy through the open tab that EDR sees only as browser file activity."
  - claim_id: ab8d810b2d
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "Oneconsult analyses, from the Chromium source and tests on Windows 11 with Chrome and Edge 150.0.7871.101 in July 2026, what a website can reach through the File System Access API once a user selects a folder and grants permission: the handle stays valid as long as the tab is open and is obtained after just two user clicks ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: b9a8aa0cbc
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "Chrome rejects blocklisted paths, but a path that is not in its table and not an ancestor of a blocked path is allowed, and the kDontBlockChildren rule leaves the subfolders of listed directories selectable; Oneconsult confirmed .vscode, the Azure token cache, C:\\Users\\Public and SMB shares as accessible ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: d0e0a31218
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "And it can run an interactive file proxy through the still-open tab, where EDR sees only the browser reading and writing files ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 909cb607a5
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "A OneDrive Known Folder Move enabled while Chrome is running leaves a stale blocklist, so the redirected Desktop was writable; Oneconsult says it reported the issue to Google, which made it public, and notes that Google classed reading a single dragged file from a blocked folder as \"not a security issue\" ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 6ada047cbf
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "He says the user-gesture requirement does not prevent phishing, only automatic picker invocation, and that signed or complex files may fail, be blocked or break in a way that prevents execution ("
    urls: ["https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/"]
  - claim_id: 0d683a6933
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows users of Chrome or Edge, above all developer workstations with VS Code, cached Azure tokens or PowerShell on the Bypass or Unrestricted execution policy, and estates that enable OneDrive Known Folder Move; the attack needs a user to choose a folder and confirm a second prompt ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 7161fe2c53
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "**Detection:** file-write telemetry for PowerShell profile paths, PowerShell module folders and .vscode\\extensions, and changes to the Zone.Identifier stream there, whose ReferrerUrl and HostUrl fields keep the origin of the page that wrote the file ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 3a46b9f4bc
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "Oz says editing a file does not automatically reclassify it as downloaded, so the stream is a possible marker, not a guaranteed one ("
    urls: ["https://danieloz147.github.io/2026/07/05/rogue-sandbox-when-the-scan-is-the-payload/"]
  - claim_id: b580f42fd7
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** restrict file system read and write access with the Chrome Enterprise policies Oneconsult names, FileSystemReadAskForUrls, FileSystemWriteAskForUrls and the respective AskForUrls policies, alert on writes to PowerShell profiles and VS Code extension folders, and treat a website's request to choose a local folder as a social-engineering step ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 2a7bde4616
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "Oneconsult demonstrates these paths."
  - claim_id: 312ef4ebf1
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "A site can recursively search a granted folder and take high-value files such as cached Azure tokens and .env files."
  - claim_id: dcdeada6c9
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "It can drop a fake VS Code extension into .vscode/extensions, which runs inside the normal code.exe process and is unaffected by Mark of the Web because Node.js does not check the Zone.Identifier stream."
  - claim_id: c17afb31bd
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "It can plant PowerShell profile and module backdoors, which work only with the Bypass or Unrestricted execution policy because the API stamps every written file with ZoneId=3 and RemoteSigned refuses such files."
  - claim_id: 262f19ec1e
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "It can drop files on the public desktop, where they appear for all users and trigger a warning that a certain percentage of users acknowledge."
  - claim_id: d157c6ba14
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: uncited
    text: "Daniel Oz's July write-up of the same technique has a website edit a file the user already holds."
  - claim_id: 08ca2e2391
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: derived
    text: "**Triage:** browsers legitimately read and write files for web editors such as Google Docs and VS Code for Web, as Oneconsult notes; the signal is a browser process writing into a persistence location, not the file activity itself."
  - claim_id: 52a437bd49
