  section: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
  item: "Detection line not updated for the first-update exposure"
  url_or_quote: "confirm that `wp-config.php` and the database it names are unchanged, because the fix exists to stop unsafe promotion of staged configuration data"
  summary: "Picus (https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability): during the fixing update the wp-config.php skip already works, but an attacker 'can still set up the temporary WordPress copy ... log in to it, and execute PHP code ... From there, they can still read or write files in the live WordPress directory'. Wordfence lists unfamiliar administrator accounts, unexpected plugins and PHP files under wp-content/upgrade. The only compromise check in the entry is wp-config.php, which the fixing update no longer exposes; a site that updated with the folder reachable needs the broader check."
