- code: F4
  category: hallucinated-fact
  section: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
  item: "updates[] record 2026-11-07T03:51:45Z summary, and the Update section / Exposure line framing"
  url_or_quote: "stays reachable at a predictable path during that update on sites running 5.9 or later, whether the package is partial or complete"
  summary: "The Hacker News (https://thehackernews.com/2026/11/installing-fix-for-exploited-wordpress.html) says 'Not every update exposes the installer ... A smaller partial package ... exposes a site only if it happens to contain them' and, in its Update, Bayram told it 'whether a partial update is exposed depends on what that specific package contains ... the installer never becomes reachable'. The record summary says exposure holds whether partial or complete; the section quotes 'isn't partial versus complete' and that WordPress.org offers 7.1.3 to 7.1.4 as a partial package, without the content caveat, so a reader concludes the common in-branch update is exposed. Fix: state that a partial package exposes the installer only if it contains the installer files, and correct the record summary."
