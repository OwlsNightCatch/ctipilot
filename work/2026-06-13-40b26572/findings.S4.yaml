items:
  - title: "ShinyHunters (UNC6240) exploits Oracle PeopleSoft zero-day CVE-2026-35273 (CVSS 9.8) — 100+ organisations breached, University of Nottingham 454,600 students confirmed victim"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
        publisher: "Google Mandiant (GTIG)"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.oracle.com/security-alerts/alert-cve-2026-35273.html"
        publisher: "Oracle PSIRT"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/"
        publisher: "Rapid7"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
        publisher: "University of Nottingham (victim disclosure)"
        date: "2026-06-10"
        role: "victim-primary"
      - url: "https://www.bleepingcomputer.com/news/security/nottingham-university-data-breach-affects-over-450-000-students/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/11/oracle-peoplesoft-under-attack-cve-2026-35273/"
        publisher: "Help Net Security"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: >
      first seen at: hackernews (THN RSS feed), URL https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html
      → pivot: Mandiant/Google Cloud primary blog, URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/
      → pivot: Oracle PSIRT advisory, URL https://www.oracle.com/security-alerts/alert-cve-2026-35273.html
      → pivot: University of Nottingham victim disclosure, URL https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident
    summary: |
      ShinyHunters (tracked by Mandiant as UNC6240) exploited CVE-2026-35273, a CVSS 9.8 SSRF-driven RCE zero-day
      in Oracle PeopleSoft PeopleTools versions 8.61 and 8.62, between 27 May and 9 June 2026 — two weeks before
      Oracle published its out-of-band advisory on 10 June. The attack chain targets two unauthenticated endpoints
      in the Environment Management Hub component: /PSEMHUB/hub and /PSIGW/HttpListeningConnector (the Integration
      Broker Listening Connector), chaining older SSRF gadgets (CVE-2013-3821, CVE-2017-3548) with the new zero-day
      to achieve RCE on WebLogic. Post-exploitation: attackers deployed MeshCentral remote-management agents
      disguised as Azure binaries for persistent C2, then executed fanout shell scripts using SSH with hardcoded
      PeopleSoft admin credentials to pivot laterally across internal hosts and exfiltrate data to the ShinyHunters
      leak site. Over 100 organisations were breached across approximately 300 PeopleSoft instances; 68% of victims
      are higher education institutions. The University of Nottingham confirmed a breach of its student record
      system on 10 June; data on 454,600 current and former students — including names, addresses, phone numbers,
      ethnicities, disabilities, passport numbers, academic enrolment records and fee payments — was published on
      the leak site. CISA added CVE-2026-35273 to the KEV catalog on 12 June. Oracle released a patch via My Oracle
      Support (Doc ID 2999999.1) for PeopleTools 8.61 and 8.62 on 10 June; EU/Swiss public sector organisations
      running PeopleSoft Campus Solutions must treat this as P1 patch urgency.
    ch_eu_nexus: |
      Global campaign with EU university exposure; PeopleSoft Campus Solutions is deployed at multiple European
      universities (including Swiss higher-education institutions). The campaign explicitly targeted higher education.
      University of Nottingham is UK/EU-adjacent with campuses in the UK, Malaysia and China.
    public_sector_nexus: "direct — higher education institutions (public universities) are primary targets"
    sector: "education, public-sector"
    cves:
      - CVE-2026-35273
      - CVE-2013-3821
      - CVE-2017-3548
    actors_campaigns_malware:
      - "UNC6240 (ShinyHunters)"
      - "MeshCentral (remote management tool, weaponised)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Mandiant and Google Threat Intelligence Group identified an active exploitation campaign by UNC6240 (ShinyHunters) targeting Oracle PeopleSoft's Environment Management Hub (PSEMHUB) using CVE-2026-35273, a critical remote code execution vulnerability (CVSS 9.8)."
        attribution: "Google Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
      - quote: "Student and alumni data has been compromised in a data security incident. We have identified that an external third party has obtained unauthorised access to a significant amount of data in our student record system."
        attribution: "University of Nottingham (victim disclosure)"
        source_url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
      - quote: "CVE-2026-35273 is a critical remote code execution vulnerability (CVSS 9.8) in Oracle PeopleTools versions 8.61 and 8.62 that exploits a server-side request forgery flaw in the Environment Management component. The attack chain leverages two endpoints: /PSEMHUB/hub and /PSIGW/HttpListeningConnector."
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/"
    extended_notes: |
      Detection: Monitor web-server access logs for unauthenticated POST requests to /PSEMHUB/hub and
      /PSIGW/HttpListeningConnector. Watch for MeshCentral agent spawning from PeopleSoft app-server processes
      (Sysmon EID 1, parent image matching psadmin/PS* process family). Outbound SMB from PeopleSoft hosts to
      external IPs signals credential-capture via NTLM relay (T1187). SSH lateral movement with PeopleSoft
      default credentials: hunt for SSH sessions originating from PeopleSoft hosts to internal subnets.
      Hardening: Apply Oracle patch (Doc ID 2999999.1) immediately; restrict network access to PSEMHUB and
      PSIGW endpoints to trusted admin subnets; rotate all PeopleSoft administrative credentials; enable
      alerting on new remote-management agent installations. MITRE ATT&CK: T1190 (Exploit Public-Facing
      Application), T1021.004 (SSH lateral movement), T1219 (Remote Access Software — MeshCentral),
      T1187 (Forced Authentication), T1567.002 (Exfiltration to Cloud Storage).

