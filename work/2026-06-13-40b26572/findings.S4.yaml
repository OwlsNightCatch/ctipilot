    summary: |
      On 12 June 2026, INTERPOL and Group-IB publicly named the SniperDz (also known as Joker Dz, Storm Dz,
      Spam Dz) phishing-as-a-service platform as the primary target of Operation Ramz, an INTERPOL-led
      operation across 13 MENA countries (October 2025–February 2026). The primary developer and administrator,
