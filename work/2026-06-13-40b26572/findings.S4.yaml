        role: "corroborating"
    discovery_trace: >
      first seen at: BleepingComputer listing page, URL https://www.bleepingcomputer.com/news/security/
      → pivot: Novo Nordisk primary press release, URL https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916571
      → pivot: Novo Nordisk incident update page, URL https://www.novonordisk.com/news-and-media/latest-news/incident-update.html
    summary: |
      Danish pharmaceutical giant Novo Nordisk (Wegovy/Ozempic maker) disclosed on 11 June 2026 that
      unauthorised external actors accessed a limited number of internal IT systems, copying non-public data
      including clinical trial participant records and healthcare professional (HCP) contact information. Clinical
      trial data exposed: pseudonymised patient IDs (random alphanumeric strings), trial participation status,
      sex, year of birth, biomarkers, health and immunogenicity data, and lifestyle factors (smoking, alcohol use,
      BMI). The company states patient data was not directly linked to names. HCP data exposed: names,
      registration numbers, email addresses, phone numbers, WhatsApp contact details, and office locations —
      this data is directly identifying and creates a spear-phishing surface against clinical researchers.
      Attack vector is not disclosed. Novo Nordisk took affected systems offline, engaged external cybersecurity
      experts, and is in contact with relevant authorities. No ransomware group or threat actor has been named.
      The breach is material for EU/EEA pharma data-protection regulators (likely notified to the Danish Data
      Protection Authority, Datatilsynet, and potentially competent clinical-trial supervisors under
      Regulation (EU) 536/2014).
    ch_eu_nexus: |
      Novo Nordisk is a Danish company headquartered in Bagsvaerd, Denmark — an EU-registered data controller.
      Clinical trial data for EU/EEA participants processed under GDPR; breach notification obligations apply
      to Datatilsynet and potentially EEA national DPAs for EU-resident trial participants. EU pharma sector
      nexus; clinical trial sponsors in Switzerland subject to Swiss DSG (nDSG) for equivalent domestic trials.
    public_sector_nexus: "indirect — HCP contact data includes researchers at public universities and hospitals"
    sector: "pharmaceutical, healthcare"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
