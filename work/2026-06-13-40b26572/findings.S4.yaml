        role: "corroborating"
    discovery_trace: >
      first seen at: hackernews (THN RSS feed), URL https://thehackernews.com/2026/06/google-sues-chinese-smishing-network.html
      → pivot: Google primary blog, URL https://blog.google/innovation-and-ai/technology/safety-security/combatting-ai-scams/
      → pivot: court docket, URL https://www.courtlistener.com/docket/73476270/google-llc-v-does-125/ (returned 403)
    summary: |
      On 12 June 2026 Google filed a federal lawsuit (Google LLC v. Does 1–25) against a China-based cybercrime
      network operating "Outsider Enterprise," a phishing-as-a-service (PhaaS) platform that weaponises Google's
      Gemini AI coding agent to generate and customise fraudulent web pages at scale. The platform offers 290+
      pre-built phishing templates targeting financial, retail, and government impersonation, distributed via
      Telegram for as low as $88/week with keystroke logging built in. Between November 2025 and April 2026,
      Google detected over 1.59 million URLs linked to Outsider Enterprise; approximately 100,000 victims
      sustained millions of dollars in losses. In parallel, the FBI's Operation Ghost Hook seized platform
      domains and confiscated approximately $100,000 in cryptocurrency. Google also coordinated with AT&T,
      T-Mobile, and Verizon to block malicious SMS traffic; 2.6 million smishing messages were sent through
      Google Messages in the two-week period 18 May–1 June alone. The lawsuit is Google's first targeting
      abuse of its own Gemini AI platform, and it advocates seven bipartisan anti-AI-fraud legislative bills
      currently before Congress. EU/CH relevance: Outsider-class PhaaS operations are platform-agnostic and
      have historically migrated to EU targets when US law-enforcement pressure increases.
    ch_eu_nexus: |
      Indirect: platform-agnostic PhaaS operations pivot geographies under enforcement pressure. EU financial
      institutions and government portals are typical targets for template expansion. AI-generated phishing
      pages represent a qualitatively new evasion challenge for email-gateway and browser-isolation defences.
    public_sector_nexus: "indirect — government portal impersonation templates included in platform"
    sector: "technology, financial, government"
