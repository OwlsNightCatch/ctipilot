    novelty: new
    evidence:
      - quote: "Novo Nordisk identified unauthorized access to limited internal IT systems. Certain non-public data and personal data were copied externally without authorisation."
        attribution: "Novo Nordisk (primary press release)"
        source_url: "https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916571"
      - quote: "Exposed information included pseudonymized patient IDs, trial participation details, sex, birth year, biomarkers, health/immunogenicity data, and lifestyle factors (smoking, alcohol use, BMI). Healthcare professionals' names, registration numbers, email addresses, phone numbers, WhatsApp details, and office locations were also compromised."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/pharmaceutical-giant-novo-nordisk-discloses-security-breach/"
    extended_notes: |
      The HCP spear-phishing surface is the highest-priority defender concern: names + phone numbers + WhatsApp
      details for clinical-trial investigators are a complete targeting package. Defenders in pharma / hospital
      networks should brief clinical-research staff on elevated social-engineering risk. No IOCs or TTPs are
      publicly available at time of writing; the initial-access vector is undisclosed.

  - title: "South Korea's PIPC fines Coupang a record 624.6 billion won ($409M) for breach of 37.5M customers via unrevoked authentication key held by former employee"
    sources:
      - url: "https://therecord.media/south-korea-data-breach-record-fine-coupang"
        publisher: "The Record (Recorded Future News)"
        date: "2026-06-12"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/south-korea-hits-coupang-with-record-409-million-fine-over-data-breach/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: >
      first seen at: BleepingComputer listing page, URL https://www.bleepingcomputer.com/news/security/
      → pivot: The Record primary article, URL https://therecord.media/south-korea-data-breach-record-fine-coupang
      → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/south-korea-hits-coupang-with-record-409-million-fine-over-data-breach/
    summary: |
      South Korea's Personal Information Protection Commission (PIPC) on 11 June 2026 issued its largest-ever
      data-protection fine: 624.6 billion won (~$409M USD) against Coupang (NYSE: CPNG), South Korea's largest
      e-commerce platform. Root cause: a former Chinese software engineer who developed Coupang's alternative
      authentication system stole the signing key upon departure and used it to generate forged authentication
      tokens, systematically querying delivery address and account pages for 33.7 million customer records plus
      4.3 million non-member records over seven months without detection. Coupang failed to revoke the key
      during offboarding and lacked anomaly-detection for overseas access patterns — described by PIPC as
      "deficiencies in basic safety management rather than a sophisticated hacking attack." An additional
      201.1 billion won covers unlawful collection of online behavioural data from 11.17 million users across
      third-party sites without consent. Coupang also destroyed approximately six months of web access logs
      after receiving a preservation order, resulting in an evidence-obstruction finding. Subsidiary Coupang
      Fulfillment Services was separately fined 248 million won. Coupang plans to appeal in Seoul Administrative
      Court; the fine is not automatically stayed. The previous record in South Korea was 134.8 billion won
      against SK Telecom in 2025.
    ch_eu_nexus: |
      Enforcement-model signal for EU/Swiss regulators: the PIPC precedent of applying record fines for
      credential-management failures in offboarding is directly analogous to GDPR Article 32 (appropriate
      technical measures) and Swiss nDSG Article 8 (data security) obligations. The case illustrates regulator
      willingness to attribute "management failure" rather than requiring a sophisticated attack to sustain
      maximum fines.
    public_sector_nexus: "indirect — enforcement precedent relevant to public-sector IAM and offboarding procedures"
    sector: "e-commerce, retail, technology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The breach stemmed from 'deficiencies in basic safety management' rather than sophisticated hacking — a former Chinese employee who developed Coupang's alternative authentication system stole the signing key before departing and systematically accessed delivery address and account pages over seven months using non-existent member IDs."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/south-korea-data-breach-record-fine-coupang"
      - quote: "Coupang deleted six months of web access logs after receiving a preservation order, destroying approximately 13% of evidence from the attack period."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/south-korea-data-breach-record-fine-coupang"
    extended_notes: |
      Defender/compliance takeaway: this case is a clean model for "offboarding token revocation failure leads to
      maximum regulatory exposure." Identity teams should audit: (1) all signing keys and OAuth client secrets
      tied to former employees or contractors; (2) whether access logs are subject to legal-hold triggers and
      retention policies cover the full incident window; (3) anomaly detection for credential use from unexpected
      geographic locations. EU/Swiss equivalents: GDPR Art. 32 / nDSG Art. 8 both require "appropriate technical
      measures" — a tribunal applying this case's logic would find unrevoked signing keys a clear Article 32
      breach. MITRE ATT&CK: T1078.004 (Valid Accounts – Cloud Accounts), T1550.001 (Use Alternate Auth Material).

  - title: "Google sues China-based 'Outsider Enterprise' PhaaS network for weaponising Gemini AI in smishing campaign; FBI Operation Ghost Hook seizes domains"
    sources:
      - url: "https://blog.google/innovation-and-ai/technology/safety-security/combatting-ai-scams/"
        publisher: "Google (primary blog)"
        date: "2026-06-12"
