  - title: "ShinyHunters (UNC6240) exploits Oracle PeopleSoft Environment Management Hub as a zero-day (CVE-2026-35273, CVSS 9.8) — 100+ orgs hit, 68% universities, zero-day window May 27–June 9"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
        publisher: "Mandiant / Google Threat Intelligence Group (GTIG)"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/"
        publisher: "Rapid7"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.oracle.com/security-alerts/alert-cve-2026-35273.html"
        publisher: "Oracle PSIRT"
        date: "2026-06-10"
        role: "vendor-advisory"
    discovery_trace: "first seen at: mandiant-gtig RSS feed (feeds.feedburner.com/threatintelligence/pvexyqv7v0v), item 1 → primary: Mandiant/GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/ → corroborating: Rapid7, URL https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/"
    summary: |
      Mandiant and Google GTIG attribute active exploitation of CVE-2026-35273 to UNC6240 (ShinyHunters), a financially-motivated extortion actor, between May 27 and June 9, 2026 — before Oracle published its out-of-band advisory on June 10. The flaw is a Server-Side Request Forgery (SSRF) leading to unauthenticated RCE (CWE-918) in the PeopleSoft Environment Management Hub (PSEMHUB), exploitable via HTTP at the endpoints `/PSEMHUB/hub` and `/PSIGW/HttpListeningConnector`. Affected versions: PeopleTools 8.61 and 8.62. Post-exploitation: attackers deployed custom MeshCentral remote-management agents masquerading as Microsoft Azure binaries (meshagent64-azure-ops.exe, meshagent64-v2.exe), performed SSH credential-spraying via a lateral-movement script (`[victim_abbreviation]_fanout.sh`), compressed exfiltrated data with zstd, and uploaded it to ShinyHunters Data Leak Site. Outbound SMB connections (TCP 445) indicate NTLM hash capture attempts. The C2 server communicated over `wss://azurenetfiles.net:443/agent.ashx`. Over 100 organisations were targeted; 68% were higher education. University of Nottingham confirmed 455,000 records stolen (names, addresses, passport numbers, ethnicity). CVE was added to CISA KEV on June 12, 2026.
    ch_eu_nexus: "EU higher-education institutions running Oracle PeopleSoft are directly in scope; University of Nottingham (UK) confirmed victim; Swiss cantonal universities should check PeopleTools 8.61/8.62 deployments"
    public_sector_nexus: "direct — education public-sector; Oracle PeopleSoft is common HRM/ERP across European universities"
    sector: "higher-education, public-sector"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["UNC6240", "ShinyHunters", "MeshCentral"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Mandiant and Google Threat Intelligence Group (GTIG) have identified an active compromise and extortion campaign attributed to UNC6240 (ShinyHunters) targeting Oracle PeopleSoft application infrastructure. The activity was observed between May 27, 2026, and June 9, 2026 and is consistent with the exploitation of CVE-2026-35273, a critical remote code execution vulnerability (CVSS 9.8) in the Environment Management component."
        attribution: "Mandiant / Google GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
      - quote: "The flaw exists in the Updates Environment Management component. According to the article, 'successful exploitation may result in remote code execution (RCE).' The vulnerability was exploited as a zero-day between May 27 and June 9, 2026, before Oracle's advisory on June 10, 2026. Two endpoints involved: /PSEMHUB/hub and /PSIGW/HttpListeningConnector"
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-active-exploitation-of-oracle-peoplesoft-zero-day-cve-2026-35273/"
    extended_notes: |
      Detection angles: Look for anomalous HTTP requests to /PSEMHUB/hub and /PSIGW/HttpListeningConnector from unexpected source IPs. Post-exploitation: MeshCentral agent processes launching from the web-app service account context (Sysmon EID 1 with parent matching PeopleTools web server process). Outbound TCP 445 from PeopleSoft servers (unusual for HRM tier). zstd compression of large data archives (T1560). SSH lateral movement from PeopleSoft hosts with hardcoded credential patterns. Network: block/alert on outbound WSS to non-standard IPs on port 443 with agent.ashx URI pattern. Hardening: immediately apply Oracle CPU187 for PeopleTools 8.61/8.62; restrict PSEMHUB to internal IPs only via network ACL; disable PSIGW HTTP Listening Connector if not required; enable PeopleSoft intrusion detection logging.

  - title: "Velvet Ant Operation Highland: China-nexus actor backdoored Linux PAM/OpenSSH in nine variants over ~10 years, surviving password resets on air-gapped network"
    sources:
      - url: "https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "primary-relay"
      - url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/"
        publisher: "Sygnia"
        date: "2026-06-12"
        role: "primary"
    discovery_trace: "first seen at: hackernews RSS feed (feeds.feedburner.com/TheHackersNews), item 4 'China-Linked Hackers Backdoored Linux Login Software' → primary: Sygnia blog, URL https://www.sygnia.co/blog/operation-highland-velvet-ant/ (Cloudflare-gated; bridge also blocked by Imunify360) → corroborating: THN, URL https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html → WebSearch confirmed multiple secondary sources"
    summary: |
      Sygnia's 'Operation Highland' tracks Velvet Ant (China-nexus, prior Cisco Nexus switch and F5 BIG-IP attacker) compromising the Linux authentication stack on an isolated network starting around 2016. The group replaced pam_unix.so and sshd/ssh binaries with nine distinct backdoored variants, each with a hard-coded secret password that bypasses normal authentication and silently logs legitimate credentials — without generating anomalous log entries. Because the target network had no direct internet access, Velvet Ant staged through internet-facing perimeter hosts first. By poisoning the authentication layer itself rather than deploying user-land malware, the group survived repeated password resets and IR containment cycles; cleanup requires filesystem integrity verification against known-good package manager checksums rather than traditional EDR. MITRE mappings: T1556.003 (Pluggable Authentication Modules), T1078 (Valid Accounts — via harvested credentials), T1021.004 (Remote Services — SSH), T1036.005 (Match Legitimate Name or Location). No CVE assigned — these were trojanised system binaries, not a product vulnerability. Sectors: financial services, manufacturing (prior Sygnia reporting on the same actor across earlier intrusions).
    ch_eu_nexus: "Any European enterprise with Linux systems that uses PAM/OpenSSH and has previously been assessed by the same actor family; relevant to Swiss federal IT audit of Linux fleet integrity; prior Velvet Ant activity targeted manufacturing and financial sectors with EU presence"
    public_sector_nexus: "indirect — critical infrastructure and manufacturing"
    sector: "financial-services, manufacturing, critical-infrastructure"
    cves: []
    actors_campaigns_malware: ["Velvet Ant", "Operation Highland", "VELVETSHELL"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Velvet Ant's backdoor variants operate through pam_unix.so, sshd, and ssh — components that exist on virtually every Linux host in the environment, that behave normally for legitimate users, and that generate no anomalous log entries when backdoored."
        attribution: "The Hacker News (relaying Sygnia findings)"
        source_url: "https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html"
      - quote: "The target network had no direct internet connectivity. Instead, the attacker engineered a deliberate multi-stage access chain to reach it. Instead of dropping new malware that a scanner might catch, the attacker changed the trusted login programs themselves. Nothing obvious appeared, and no exploit was needed, so the activity looked like normal administration."
        attribution: "The Hacker News (relaying Sygnia findings)"
        source_url: "https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html"
    extended_notes: |
      Detection: standard EDR telemetry and network scanning will not surface this. Require filesystem integrity monitoring (FIM) against authoritative package-manager checksums — AIDE, rpm -V, dpkg --verify — on all Linux hosts. Specifically verify sha256sum of /lib/security/pam_unix.so and /usr/sbin/sshd against their package-provided values. Stale or unmatched checksums on binaries in /usr/sbin/, /lib/security/ demand forensic triage. Threat-hunt: review SSH authentication logs for unusual successful logins coinciding with unusual source IPs or at unusual times; PAM-module replacement will NOT produce failed-login events. Hardening: deploy file integrity monitoring in detect+block mode; separate change management for OS authentication components; network segmentation for high-value isolated networks should include outbound filtering on internet-facing pivot hosts.

  - title: "Atomic Arch: supply-chain hijack of 400+ Arch Linux AUR packages delivers Rust credential stealer + eBPF rootkit (Sonatype-2026-003775, CVSS 8.7)"
    sources:
      - url: "https://www.sonatype.com/blog/atomic-arch-npm-campaign-adds-malicious-dependency"
        publisher: "Sonatype"
        date: "2026-06-11"
        role: "primary"
      - url: "https://ioctl.fail/preliminary-analysis-of-aur-malware/"
        publisher: "ioctl.fail (independent researcher Whanos)"
        date: "2026-06-11"
        role: "primary-technical"
      - url: "https://www.bleepingcomputer.com/news/security/over-400-arch-linux-packages-compromised-to-push-rootkit-infostealer/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed (feeds.feedburner.com/TheHackersNews), item 2 'Over 400 Arch Linux AUR Packages Hijacked' → primary: Sonatype blog, URL https://www.sonatype.com/blog/atomic-arch-npm-campaign-adds-malicious-dependency → primary technical: ioctl.fail, URL https://ioctl.fail/preliminary-analysis-of-aur-malware/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/over-400-arch-linux-packages-compromised-to-push-rootkit-infostealer/"
    summary: |
      Attackers took ownership of ~400 abandoned AUR packages and injected a malicious npm dependency (`atomic-lockfile@1.4.2`) into their PKGBUILD files. During any AUR package installation, the modified PKGBUILD runs `npm install atomic-lockfile minimist chalk`, pulling a bundled Linux ELF (3 MB, Rust-compiled) via npm's preinstall hook. The ELF harvests developer secrets: browser profiles (Chrome/Edge/Brave), SSH keys, GitHub/npm/OpenAI tokens, Slack/Discord/Teams/Telegram session data, shell histories, Docker credentials, and VPN config files. When running with root or CAP_BPF/CAP_SYS_ADMIN, the embedded eBPF component pins BPF maps at /sys/fs/bpf/hidden_pids, /sys/fs/bpf/hidden_names, /sys/fs/bpf/hidden_inodes and hides selected processes, filenames, and network socket inodes from all userland tools (ls, ps, netstat, EDR agents). C2 communicates to a Tor .onion address via a local SOCKS-style proxy on 127.0.0.1, exfiltrating via HTTP POST /api/agent. A second wave deployed `js-digest` and `lockfile-js` as alternate delivery packages. Sonatype estimates up to 1,500 packages compromised across multiple waves. Relevant for developers building on Linux (CI/CD runners, developer workstations).
    ch_eu_nexus: "Directly targets developer workstations and CI/CD pipelines — relevant to Swiss federal IT and EU open-source software supply chains; CI runners for public-sector projects using Arch-based Docker images may be in scope"
    public_sector_nexus: "indirect — developer/CI infrastructure"
    sector: "technology, software-development, devops"
    cves: []
    actors_campaigns_malware: ["Atomic Arch infostealer", "eBPF rootkit", "atomic-lockfile npm package"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attack Vector: Modified package build instructions execute `npm install atomic-lockfile minimist chalk` during installation, bypassing traditional detection methods since malicious code resides in the dependency, not the package itself. eBPF program (scales.bpf.c) running with kernel privileges... Process, file, and network hiding functionality."
        attribution: "Sonatype"
        source_url: "https://www.sonatype.com/blog/atomic-arch-npm-campaign-adds-malicious-dependency"
      - quote: "When running with root privileges or CAP_BPF/CAP_SYS_ADMIN capabilities, the embedded eBPF component: Hides selected PIDs from /proc listings; Conceals process names and socket inodes; Obstructs live-response tool visibility; Uses pinned maps at /sys/fs/bpf/hidden_pids, /sys/fs/bpf/hidden_names, /sys/fs/bpf/hidden_inodes"
        attribution: "ioctl.fail"
        source_url: "https://ioctl.fail/preliminary-analysis-of-aur-malware/"
    extended_notes: |
      Detection: Check for unexpected npm install invocations spawned from makepkg processes (Sysmon EID 1, parent image = makepkg). BPF map file creation events at /sys/fs/bpf/ from non-standard processes. Outbound SOCKS proxy traffic from developer workstations to Tor exit nodes. Hunt for the pinned BPF map names: ls /sys/fs/bpf/hidden_* on any Linux developer host. SHA256 of known-bad ELF: 6144D433F8A0316869877B5F834C801251BBB936E5F1577C5680878C7443C98B. Hardening: avoid installing AUR packages on privilege-holding CI runners; prefer official Arch repos or curated ABS packages; enforce mandatory BPF restrictions via bpf_jit_enable=0 or cgroup BPF restrictions in CI environments.

  - title: "Check Point Research: LangGraph checkpointer flaw chain — SQLi (CVE-2025-67644) + unsafe msgpack deserialization (CVE-2026-28277) yields RCE on self-hosted AI agents"
    sources:
      - url: "https://research.checkpoint.com/2026/from-sqli-to-rce-exploiting-langgraphs-checkpointer/"
        publisher: "Check Point Research"
        date: "2026-06-11"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/langgraph-flaw-chain-exposes-self.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed (feeds.feedburner.com/TheHackersNews) → primary: Check Point Research, URL https://research.checkpoint.com/2026/from-sqli-to-rce-exploiting-langgraphs-checkpointer/ → corroborating: THN, URL https://thehackernews.com/2026/06/langgraph-flaw-chain-exposes-self.html"
    summary: |
      Check Point Research disclosed three vulnerabilities in LangGraph, an open-source framework for building stateful multi-agent AI applications with 50+ million monthly downloads, published under LangChain. CVE-2025-67644 (CVSS 7.3) is a SQL injection in the SQLite checkpointer's `get_state_history()` function that directly interpolates user-controlled metadata filter keys into SQL queries without sanitisation, allowing an attacker to inject arbitrary SQL. CVE-2026-28277 (CVSS 6.8) is unsafe msgpack deserialization during checkpoint loading — by chaining with the SQLi to insert a malicious checkpoint row, an attacker can trigger arbitrary Python module import and system command execution. CVE-2026-27022 (CVSS 6.5) is a parallel SQL injection in the Redis checkpointer via RediSearch query injection. The attack requires (a) self-hosted LangGraph with SQLite or Redis checkpointer, (b) the application exposes `get_state_history()`, and (c) filter input is user-controlled. LangChain's managed LangSmith cloud and PostgreSQL-backed deployments are NOT vulnerable. Patched in: langgraph-checkpoint-sqlite ≥ 3.0.1, langgraph ≥ 1.0.10, @langchain/langgraph-checkpoint-redis ≥ 1.0.1.
    ch_eu_nexus: "Directly affects organisations running self-hosted AI agent infrastructure using LangGraph — growing in Swiss public-sector and EU enterprise AI deployments; any self-hosted RAG/agentic system using LangGraph checkpoint storage is in scope"
    public_sector_nexus: "indirect — AI infrastructure used in public-sector automation"
    sector: "technology, AI-ML-infrastructure"
    cves: [CVE-2025-67644, CVE-2026-28277, CVE-2026-27022]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A SQL injection flaw (CVE-2025-67644) in the SQLite checkpointer allows attackers to inject malicious rows into database queries through unsanitized filter parameters. This chains with unsafe msgpack deserialization (CVE-2026-28277) to achieve remote code execution by importing arbitrary modules and executing system commands."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/from-sqli-to-rce-exploiting-langgraphs-checkpointer/"
      - quote: "The attack requires exposing get_state_history() with user-controlled filters. PostgreSQL deployments and LangSmith Cloud remain unaffected."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/from-sqli-to-rce-exploiting-langgraphs-checkpointer/"
    extended_notes: |
      Detection: Monitor for msgpack deserialization exceptions or unexpected module-import traces in LangGraph application logs. If running Flask/FastAPI behind LangGraph, WAF rule for metadata filter injection patterns. Defender actions: pin langgraph-checkpoint-sqlite to ≥ 3.0.1, langgraph to ≥ 1.0.10, and langgraph-checkpoint-redis to ≥ 1.0.1; treat filter inputs to get_state_history() as untrusted user input even in internal tooling; avoid exposing LangGraph state-history API to external users without authentication.

  - title: "Agentjacking: Tenet Security documents MCP injection via fake Sentry error events hijacking AI coding agents (Claude Code, Cursor, Codex) with 85% success rate"
    sources:
      - url: "https://tenetsecurity.ai/blog/agentjacking-coding-agents-with-fake-sentry-errors/"
        publisher: "Tenet Security"
        date: "2026-06-12"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/agentjacking-attack-tricks-ai-coding.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed (feeds.feedburner.com/TheHackersNews) → primary: Tenet Security, URL https://tenetsecurity.ai/blog/agentjacking-coding-agents-with-fake-sentry-errors/ (Cloudflare-gated — WebFetch returned verification page) → corroborating: THN, URL https://thehackernews.com/2026/06/agentjacking-attack-tricks-ai-coding.html → WebSearch confirmed CSA Labs secondary analysis"
    summary: |
      Tenet Security researchers Ron Bobrov, Barak Sternberg, and Nevo Poran documented 'Agentjacking' — a Model Context Protocol (MCP) injection attack that exploits the implicit trust relationship between AI coding agents and the Sentry error-tracking integration. The attack chain: (1) the attacker obtains a target organisation's Sentry DSN (a write-only credential often exposed in browser JavaScript or GitHub), (2) crafts malicious Sentry error events embedding markdown-formatted instructions, (3) a developer asks their AI coding agent to investigate/fix a Sentry issue, (4) the agent retrieves the injected event via MCP and executes attacker-controlled commands with the developer's full system privileges. Tested against Claude Code, Cursor, and Codex — 85% exploitation success rate. Because the agent performs only explicitly authorised operations (no novel binary execution, no policy violation), EDR, WAF, IAM controls, and VPN all fail to alert. 2,388 organisations identified with injectable Sentry DSNs exposed. Sentry acknowledged the disclosure (June 3, 2026) but declined root-cause remediation, deploying only a global content filter blocking a specific payload string pattern. No CVE assigned — this is an architectural trust-model issue in MCP. Maps to T1059.007 (JavaScript execution via agent), T1553.002 (Code Signing trust abuse), T1195 (Supply Chain Compromise — via injected telemetry).
    ch_eu_nexus: "Affects any EU/Swiss development team using AI coding agents with Sentry MCP integration — growing in DevOps pipelines at public-sector software teams; Sentry is widely deployed in Swiss SME and enterprise environments"
    public_sector_nexus: "indirect — development tooling"
    sector: "technology, software-development"
    cves: []
    actors_campaigns_malware: ["Agentjacking", "MCP injection"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Testing revealed an 85% exploitation success rate across major AI coding assistants, affecting at least 2,388 organizations with exposed Sentry Data Source Names (DSNs). In tested configurations, the attack bypassed endpoint detection and response (EDR), web application firewalls, IAM controls, and VPN because the agent performed only authorized operations using the developer's own credentials — no policy was violated, and no anomaly threshold was crossed."
        attribution: "The Hacker News (relaying Tenet Security research)"
        source_url: "https://thehackernews.com/2026/06/agentjacking-attack-tricks-ai-coding.html"
      - quote: "Sentry acknowledged the disclosure on June 3, 2026, but declined root-cause remediation, describing the issue as 'technically not defensible.' However, the company is said to have activated a global content filter that blocks a 'specific payload string.'"
        attribution: "The Hacker News (relaying Tenet Security research)"
        source_url: "https://thehackernews.com/2026/06/agentjacking-attack-tricks-ai-coding.html"
    extended_notes: |
      Hardening: audit all MCP server integrations for external write access — any external service that can write content subsequently presented to an AI agent is an injection surface. Treat Sentry event content as untrusted; consider a dedicated read-only service account for Sentry MCP with a separate project that no attacker-controlled service can write to. Rotate exposed DSNs; do not commit DSNs to public repos. Apply content filtering before any Sentry issue text reaches an AI agent. Detection: monitor AI agent process trees for unexpected child processes or outbound network connections; flag when an AI agent tool call chain involves Sentry events AND produces shell or filesystem writes.

  - title: "Google sues Chinese 'Outsider Enterprise' PhaaS network for weaponising Gemini AI to generate phishing sites, 2.5M smishing texts, 9,000 fraudulent domains"
    sources:
      - url: "https://blog.google/innovation-and-ai/technology/safety-security/combatting-ai-scams/"
        publisher: "Google (official blog)"
        date: "2026-06-12"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/google-sues-chinese-smishing-network.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed (feeds.feedburner.com/TheHackersNews) → primary: Google official blog, URL https://blog.google/innovation-and-ai/technology/safety-security/combatting-ai-scams/ → WebSearch confirmed lawsuit filing"
    summary: |
      Google filed a civil lawsuit in Manhattan federal court on June 12 against the 'Outsider Enterprise', a suspected China-based PhaaS network that weaponised Google's own Gemini AI to auto-generate phishing site HTML, converting AI-produced code directly into live scam pages. The Outsider Enterprise sold subscriptions from $88/week providing phishing kits, Telegram-based affiliate coordination, and step-by-step Gemini abuse tutorials. Between November 2025 and April 2026: 9,000 fraudulent domains, 1.59M malicious URLs; in May 2026: 2.5M fraudulent SMS messages to Android users (55,000 user-flagged in two weeks). FBI estimates the broader operation caused $1.9B in losses and compromised 3.87M credit cards. US court issued a temporary restraining order. The FBI, AT&T, T-Mobile and Verizon collaborated on infrastructure takedown ('Operation Ghost Hook' / 'Operation Riptide'), seizing ~$100,000 USDT from payment wallets. The technical abuse: Gemini was prompted with innocuous-seeming HTML generation requests; the resulting code was imported into the Outsider kit and deployed as live phishing pages — exploiting the gap between AI content-policy enforcement and downstream weaponisation.
    ch_eu_nexus: "Direct: PhaaS services targeting European users are well-documented; the AI-assisted phishing page generation technique is available to EU-targeting actors; the Outsider kit is accessible to affiliates globally"
    public_sector_nexus: "indirect — citizen-facing fraud risk; Swiss federal cyber-awareness relevance"
    sector: "financial-services, retail, government-citizen-services"
    cves: []
    actors_campaigns_malware: ["Outsider Enterprise", "Outsider PhaaS kit"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Members of the Outsider Enterprise actively encouraged one another to use Gemini to generate custom code for phishing websites, which was then imported directly into the Outsider software suite and converted into live scam pages."
        attribution: "The Hacker News (relaying Google lawsuit complaint)"
        source_url: "https://thehackernews.com/2026/06/google-sues-chinese-smishing-network.html"
      - quote: "Between November and April, the Outsider Enterprise allegedly generated more than 1.5 million malicious URLs, and in just a 14-day stretch in early May, the network reportedly blasted out 2.5 million fraudulent text messages."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/google-sues-chinese-smishing-network.html"
    extended_notes: |
      AI content policy evasion note: Gemini was prompted with innocuous-seeming HTML requests; this underscores the irreducible gap between LLM safety filters and downstream weaponisation. SOC awareness: smishing kits operating at this scale may appear in EU targets; advise incident-response teams to treat unexpected Sentry DSN exposure and AI-generated phishing page content as related threat vectors. For public-sector communications teams: the kit specifically impersonated postal services, package delivery (DHL, USPS), and tax authorities — all common Swiss/EU lures.

