  - title: "The Gentlemen (Storm-2697) overtakes Qilin as the most prolific ransomware operation in Q2 2026 — ReliaQuest ties the shift to an AI-accelerated affiliate build pipeline"
    sources:
      - { url: "https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q2-2026", publisher: "ReliaQuest", date: "2026-07-16", role: primary }
      - { url: "https://www.infosecurity-magazine.com/news/the-gentlemen-most-prolific/", publisher: "Infosecurity Magazine", date: "2026-07-17", role: corroborating }
      - { url: "https://www.cybersecuritydive.com/news/ransomware-concentrated-ai-guidepoint/824828/", publisher: "Cybersecurity Dive (on GuidePoint GRIT Q2 2026)", date: "2026-07-09", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("Qilin ransomware Q2 2026 report new tooling affiliate") →
      pivot: WebSearch lead to securityboulevard.com summary (not fetched directly) → pivot: Infosecurity
      Magazine, URL https://www.infosecurity-magazine.com/news/the-gentlemen-most-prolific/ → primary:
      ReliaQuest Threat Spotlight, URL https://reliaquest.com/blog/threat-spotlight-ransomware-and-cyber-extortion-in-q2-2026
      (fetched directly) → corroborating background: Cybersecurity Dive on the GuidePoint GRIT Q2 2026
      "four-headed monster" report, URL https://www.cybersecuritydive.com/news/ransomware-concentrated-ai-guidepoint/824828/
    summary: |
      ReliaQuest's Q2 2026 threat-spotlight (2026-07-16, fetched directly) confirms a status change on
      the tracked The Gentlemen (Storm-2697/Phantom Mantis)/Qilin rivalry the prior weekly (2026-W28)
      flagged as developing: The Gentlemen posted 300 victims in Q2 2026 versus Qilin's 289, ending
      Qilin's prior dominance of the RaaS leaderboard (ReliaQuest's own tracked total: 2,252 victims
      across 90 groups in 99 countries this quarter). ReliaQuest attributes the overtake to "aggressive
      affiliate recruitment and a well-packaged intrusion kit" — affiliates reportedly "receive a full
      starter kit, consisting of pre-compromised victim lists, custom EDR killers, Group Policy
      Object-based [deployment tooling]" — plus what the report calls "a likely AI-accelerated iteration
      layer" that lets The Gentlemen refresh tooling faster than rivals still relying on human developers,
      consistent with the already-tracked GentleKiller EDR-killer framework (BYOVD, 48 vendors) the
      operators centrally maintain for affiliates. An independent GuidePoint GRIT report (2026-07-09,
      background/pre-window) corroborates the concentration finding with a "four-headed monster" framing
      (Qilin, The Gentlemen, Akira, DragonForce collectively >40% of Q2 attacks) and separately assesses
      that current adversary AI use is automation-level (data-structure analysis, negotiation-message
      drafting) rather than a qualitatively new attack capability — "the prevailing concern that AI will
      enable a new class of catastrophic AI-native attacks remains largely unrealized." Infosecurity
      Magazine's independent write-up of the same ReliaQuest report corroborates the 300-vs-289 figures
      and names Coinbase Cartel, Deadlock, Akira and UNC5342 among other active Q2 groups. No new CVE or
      initial-access vector is disclosed in this update; the entities and initial-access funnel (FortiGate
      CVE-2024-55591 for Gentlemen; opportunistic edge exploitation generally for Qilin) are unchanged from
      prior reporting — the delta is purely the quantitative leaderboard shift and the AI-tooling-cadence
      explanation for it.
    region_nexus: "global; The Gentlemen's prior-documented victim base is 32% European (Unit 42, prior coverage) — the leaderboard shift is directly relevant to any Swiss/EU public-sector or CI estate already tracking this RaaS operator as a threat"
