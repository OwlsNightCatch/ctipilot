items:
  - title: "ENISA publishes a free SME Cyber Resilience Maturity Assessment Model ahead of the CRA's 11 September 2026 vulnerability-reporting obligation"
    sources:
      - { url: "https://www.enisa.europa.eu/publications/sme-cyber-resilience-maturity-assessment-model", publisher: "ENISA", date: "2026-07-13", role: "primary" }
      - { url: "https://www.cyberresilienceact.eu/news/enisa-sme-cra-maturity-assessment-model.html", publisher: "cyberresilienceact.eu (CRA compliance tracker)", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Cyber Resilience Act CRA news July 2026\") → primary: ENISA, URL https://www.enisa.europa.eu/publications/sme-cyber-resilience-maturity-assessment-model → corroborating: cyberresilienceact.eu, URL https://www.cyberresilienceact.eu/news/enisa-sme-cra-maturity-assessment-model.html"
    summary: |
      ENISA published, on 13 July 2026, a free Excel-based "SME Cyber Resilience Maturity Assessment Model" that lets micro, small and medium-sized manufacturers of products with digital elements self-score their readiness for the EU Cyber Resilience Act (CRA) across five domains: governance and documentation, risk management and security-by-design/-by-default, vulnerability management, product lifecycle management, and cybersecurity skills. Each domain is rated 1-5 into an overall basic/intermediate/advanced profile. ENISA is explicit that the tool is diagnostic only and does not substitute for the CRA's formal conformity assessment (Article 32) or product classification. The release lands three weeks after ENISA's 24 June 2026 SME CRA Survey Report, which found most SMEs aware of the CRA but few operationally ready, and roughly eight weeks ahead of the CRA's first hard compliance clock: from 11 September 2026, Article 14 requires manufacturers to issue an early warning to their CSIRT and ENISA within 24 hours of becoming aware of an actively exploited vulnerability in a product with digital elements, a fuller notification within 72 hours, and a final report within 14 days. For a Swiss federal SOC, the direct relevance is the public-sector technology-supplier tail of the constituency: any EU-market supplier of connected products to Swiss/European public-sector or CI customers is now on this reporting clock, and this maturity model is the first concrete self-assessment tool ENISA has issued for it.
    region_nexus: "EU-wide; direct relevance to EU-market suppliers of connected/digital products serving Swiss and European public-sector and CI customers"
    primary_sector_nexus: "indirect"
