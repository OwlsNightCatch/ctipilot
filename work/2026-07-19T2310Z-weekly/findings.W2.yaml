  - title: "Germany's KRITIS-Dachgesetz opens its first operator-registration window (17 July 2026) — the EU Critical Entities Resilience Directive's first hard compliance clock for ~1,300 German CI operators"
    sources:
      - { url: "https://www.bbk.bund.de/DE/Themen/Kritische-Infrastrukturen/Strategien-und-rechtlicher-Rahmen/KRITISDachG/kritisdachg_node.html", publisher: "BBK (Bundesamt für Bevölkerungsschutz und Katastrophenhilfe)", date: "2026-03-17", role: "primary" }
      - { url: "https://www.channelpartner.de/article/4179709/die-zweite-kritis-frist-naht-was-jetzt-zu-tun-ist.html", publisher: "ChannelPartner (German IT trade press)", date: "2026-06-05", role: "corroborating" }
      - { url: "https://www.ad-hoc-news.de/wirtschaft/kritis-dachgesetz-registrierungsfrist-17-juli-fuer-1-300-betreiber/69452307", publisher: "ad-hoc-news.de", date: "2026-05-31", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"KRITIS-Dachgesetz Inkrafttreten Juli 2026 Deutschland kritische Infrastruktur\") → pivot: channelpartner.de, URL https://www.channelpartner.de/article/4179709/die-zweite-kritis-frist-naht-was-jetzt-zu-tun-ist.html → pivot: ad-hoc-news.de, URL https://www.ad-hoc-news.de/wirtschaft/kritis-dachgesetz-registrierungsfrist-17-juli-fuer-1-300-betreiber/69452307 → primary: BBK, URL https://www.bbk.bund.de/DE/Themen/Kritische-Infrastrukturen/Strategien-und-rechtlicher-Rahmen/KRITISDachG/kritisdachg_node.html"
    summary: |
      Germany's KRITIS-Dachgesetz (KRITIS Umbrella Act, in force since 17 March 2026) — the national transposition of the EU Critical Entities Resilience (CER) Directive, and the physical/organisational-resilience counterpart to the BSI-Act NIS2 transposition — opened its first operator-registration window on 17 July 2026, squarely inside this week. From that date, operators identified as critical facilities across ten sectors (energy, transport, health, water/wastewater, food, finance/insurance, IT and telecommunications, space, municipal waste, and public administration) must register on a joint BBK/BSI digital platform within three months of being identified as critical — naming the affected facility(ies), assigning them to a CER sector, designating a resilience contact, running an initial threshold self-assessment, and providing 24/7 emergency contact details. Registration starts the clock on further obligations: a risk analysis due within nine months and a documented resilience plan with concrete physical/organisational protective measures due within ten months. Reporting sources converge on roughly 1,300 directly affected German operators; secondary reporting cites administrative fines up to EUR 500,000 for failing to register (escalating toward EUR 1M for non-submission of requested documents, and toward the NIS2-scale EUR 10M/2%-of-global-revenue band where a registration failure compounds with a separate BSI-Act/NIS2 breach). For a Swiss federal SOC, this is the CER-side sibling of the NIS2 transposition milestones tracked in the prior two weeklies (Netherlands Cyberbeveiligingswet) — it is a live illustration of the EU's parallel physical-resilience track hitting its first enforceable deadline, directly relevant to any Swiss CI operator, subsidiary, or supplier with cross-border German operations or CER-equivalent reporting relationships.
    region_nexus: "Germany (EU CER Directive transposition); direct relevance to Swiss-domiciled organisations with German CI subsidiaries, suppliers, or cross-border CER-equivalent reporting relationships"
