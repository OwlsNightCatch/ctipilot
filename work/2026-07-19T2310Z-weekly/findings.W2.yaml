        attribution: "BBK (\"The KRITIS-Dachgesetz (KRITISDachG for short) entered into force on 17.03.2026\")"
        source_url: "https://www.bbk.bund.de/DE/Themen/Kritische-Infrastrukturen/Strategien-und-rechtlicher-Rahmen/KRITISDachG/kritisdachg_node.html"
    extended_notes: |
      Fine figures diverge slightly across secondary reporting (EUR 100,000 vs EUR 500,000 for a bare registration failure) — likely reflecting different reporting outlets rounding or conflating the base KRITIS-DachG penalty with the higher NIS2-compounded band; the BBK primary page's body text (JS-rendered) did not yield the specific figures despite two direct fetch attempts, so the precise statutory amount should be confirmed against the Bundesgesetzblatt text (https://www.gesetze-im-internet.de/kritisdachg/) before being treated as exact. The registration event itself (platform opening 17 July 2026) is corroborated across three independent secondary sources plus the BBK's own confirmation that the law is in force; verification is MULTI-SOURCE but confidence is held at MEDIUM pending the fine-amount discrepancy.
