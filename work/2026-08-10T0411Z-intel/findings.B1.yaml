    extended_notes: |
      Per-CVE authority provenance (why each pairing is trusted): each CVE id was read directly off that
      GHSA's own sidebar metadata panel (GitHub's per-advisory "CVE ID" field), which required forcing the
      jina-reader HTML variant since the plain-markdown render of a GHSA page drops the sidebar entirely
      (severity badge, affected/patched versions, CVE ID, CWE, credits) — `python3 tools/fetch_source.py
      jina <url> html` surfaces it; `python3 tools/fetch_source.py url <url>` (markdown) does not. This is
      an empirical finding worth folding into sources.json notes for any future GHSA-heavy run. OSV.dev
      (`osv vuln <GHSA-id>`) returned HTTP 404 for all four ids — OSV has not yet mirrored this GHSA batch
      as of 2026-08-10, so it was not usable as the cross-check the task suggested; BSI's independent CVE
      list served that role instead. github.com/advisories/<id> (the GHSA *global* database page, distinct
      from the repo-scoped advisory page) also 404s for all four — consistent with GitHub not yet having
      promoted these into the global advisory database, which is itself consistent with NVD/MITRE not yet
      carrying records for them.

      Detection: for the cluster-protocol file-write pair (CVE-2026-49441/CVE-2026-48024), hunt for
      cluster-peer sessions on TCP/1516 whose extra-valid sync payload targets `etc/ossec.conf`,
      `etc/shared/`, or any path outside the peer's expected `queue/cluster/<peer>/` subtree — file-integrity
      monitoring on `ossec.conf` mtime/hash plus a subsequent `wazuh-logcollector` restart is the strongest
      practical detection anchor since the cluster wire protocol itself is rarely visible to conventional
      IDS. For the DAPI deserialization RCE (CVE-2026-44901), any REST API request with `nodes_list`
      containing more than one node is the necessary condition for `merge()` to fire — audit-log egress
      showing cross-node DAPI fan-out correlated with an unexpected `exec`/`os.system` child process under
      the wazuh-manager service account is the anchor; process-creation telemetry with parent
      `wazuh-clusterd`/`wazuh-apid` spawning a shell is anomalous on a healthy cluster. For the pre-auth
      strncpy overflow (CVE-2026-45798), repeated short-lived TCP/1515 connections immediately followed by
      `wazuh-authd` restarts is the crash signature; this is the only one of the four reachable without any
      credential or cluster-peer status at all.
      Hardening: rotate/restrict the cluster Fernet key and place cluster traffic (TCP/1516) on a network
      segment no untrusted host can reach — none of the file-write or deserialization bugs are reachable
      without holding or spoofing that key; require `ssl_verify_host=yes` / mutual TLS on the registration
      service and set `allow_higher_versions` deliberately rather than relying on the shipped default to
      reduce the strncpy overflow's blast radius (it does not eliminate reachability, since the vulnerable
      comparison fires regardless of that setting's value per the advisory's own code trace). Upgrade to
      4.14.6 regardless — all ten CVEs in this cluster share that one fixed release.

