      - { url: "https://pwn.ai/blog/xss2shell", publisher: "pwn.ai (discovering researcher)", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md (2026-08-10T0110Z-weekly entry, itself sourced from pwn.ai and wordpress.org) → primary: WordPress's own release announcement fetched at https://wordpress.org/news/2026/08/wordpress-7-0-3-release/?output_format=md → pivot: WordPress's own GHSA advisory fetched via jina-reader (html) at https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-52p2-r8wf-jcrf → pivot: discovering researcher's technical write-up at https://pwn.ai/blog/xss2shell → cross-check: NVD (https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-64638) and MITRE (https://cveawg.mitre.org/api/cve/CVE-2026-64638), both confirming CVE-2026-64638 published 2026-08-07 by assigner hackerone → dedup check: work/2026-08-10T0411Z-intel/prior_coverage.json grepped for wp2shell/wordpress/64638 — the tracked WP2Shell entry (2026-08-08/ncsc-ch-clickfix-wp2shell-etherhiding-vidar-swiss-websites, CVE-2026-63030/CVE-2026-60137) is a different CVE, different CNA, different vulnerable code path; no prior coverage of CVE-2026-64638 exists."
    summary: |
      CVE-2026-64638 (GHSA-52p2-r8wf-jcrf) is a pre-authentication reflected XSS on WordPress's login
      screen, disclosed by pwn.ai and patched same-day in WordPress 7.0.3 (2026-08-06), with backports
      across every maintained branch back to 4.7.34 — WordPress's own advisory lists 24 separate
      affected/patched version-range pairs from 4.7.0-4.7.33 up to 7.0.0-7.0.2, rated High (CVSS 4.0 8.9,
      vector AV:N/AC:H/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H). The root cause is a parser
      disagreement: `wp_signon()`'s failed-login error message runs the submitted username through
      `sanitize_user()` → `wp_strip_all_tags()` (wrapping PHP's `strip_tags()`, which requires `<`
      immediately followed by a letter to recognise a tag), but the error later reaches
      `wp_admin_notice()` → `wp_kses_post()`, WordPress's own KSES tokenizer, which tolerates whitespace
      between `<` and the tag name and treats `< area id=x>` as a live `<area>` element — the login page
      ends up with real, attacker-specified DOM nodes that `wp_strip_all_tags()` had already certified as
      inert text. Those injected nodes are then targeted by `user-profile.js` (loaded on the login page
      only because it also serves the password-reset flow): a DOM-clobbered `ajaxurl` global turns a
      `$.post()` call into a same-origin REST request, and because WordPress's REST JSONP callback regex
      (`^[a-zA-Z0-9_.]+$`) permits property-chain traversal, the callback `window.opener.approve.click` (a
      2022 Same-Origin-Method-Execution technique) clicks the Application-Password-authorization "approve"
      button inside a genuinely logged-in administrator's own window once that administrator opens the
      attacker's page — minting a valid Application Password for the attacker with no further interaction.
      With that credential the attacker's script publishes a page exploiting the administrator's default
      `unfiltered_html` capability, then uses the same Application Password to upload a plugin ZIP via
      `/wp-admin/update.php?action=upload-plugin`; WordPress extracts it into `wp-content/plugins/` without
      requiring activation, and any PHP inside is directly web-accessible and executed by the webserver.
      The chain requires one social-engineered click by an authenticated administrator — WordPress's own
      advisory states it "requires successful social engineering of and explicit interaction by the target
      victim" — so it is not zero-click against the administrator, though the initial reflected XSS itself
      needs no authentication at all. No exploitation reported; discovered 2026-07-26, reported to
      WordPress 2026-07-27, patched and disclosed 2026-08-06/07 with a bounty paid. This is a technically
      and causally distinct chain from the KEV-listed, actively-exploited-against-Swiss-sites WP2Shell
      chain this pipeline already tracks (CVE-2026-63030/CVE-2026-60137, discovered by AssetNote via
      GPT-5.6): different CNA-assigned CVE, different vulnerable code path (a REST-batch route-confusion →
      pre-auth SQL injection → forged `WP_Post` chain, not a login-page sanitiser disagreement) — the
      "2Shell" naming is coincidental branding from two unrelated research teams, not a shared root cause.
    region_nexus: "global; WordPress Core is the most widely deployed public-sector CMS in this constituency"
