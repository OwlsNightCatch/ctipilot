    summary: |
      Wazuh shipped 4.14.6 on 2026-08-06/07 fixing ten CVEs, each disclosed as its own GitHub Security
      Advisory; BSI's WID-SEC-2026-2699 (2026-08-06) independently lists the identical ten CVE ids and
      the identical ten GHSA ids for the same release. This run fetched four flaw-specific GHSA pages
      individually and read each CVE id directly off that record's own sidebar (not by list position),
      then cross-checked each id against BSI's independently-published CVE list, where all four matched
      verbatim: CVE-2026-49441 (GHSA-3v57-hgvj-3vj2, CVSS 3.1 9.1 Critical), CVE-2026-48024
      (GHSA-gh4h-fx78-q8xc, CVSS 9.1 Critical), CVE-2026-44901 (GHSA-8c6v-7g3w-prrq, CVSS 8.4 High) and
      CVE-2026-45798 (GHSA-4fvp-jfc3-qr6r, CVSS 7.5 High). None of the four is yet published on NVD or
      resolves on MITRE's CVE-record API as of this run — GitHub's own per-advisory record plus BSI's
      independent cross-listing is the strongest confirmation currently available; the pairing is not a
      guess. CVE-2026-49441 and CVE-2026-48024 are both critical arbitrary-file-write-to-root-RCE
      primitives in the cluster protocol's master-side file-receive path
      (`DistributedAPI.process_files_from_worker`, framework/wazuh/core/cluster/master.py) and both
      explicitly bypass the earlier fix for CVE-2026-25770 (v4.14.3's `_ALLOWED_PREFIXES` hardening)
      through two different sibling code paths — the non-merged branch's unchecked
      `cluster_item_key`→`file_path` mapping, and the merged/`unmerge_info` path's peer-controlled
      header-line path traversal — either lets a cluster peer holding the shared Fernet key overwrite
      `/var/ossec/etc/ossec.conf`, reaching root RCE via `wazuh-logcollector` on the next reload. CVE-2026-44901
      is a deserialization RCE in the DAPI's `merge()` function (framework/wazuh/core/results.py): a
      compromised worker sets `sort_casting=["exec"]` in its JSON response, and the master's unallowlisted
      `getattr(builtins, type_)` resolution calls `exec()` on attacker-controlled data as root when a REST
      request fans out across two or more cluster nodes (`nodes_list=worker,master`). CVE-2026-45798 is a
      pre-authentication stack-buffer-overflow in `compare_wazuh_versions()` (src/shared/src/version_op.c),
      reached via the `V:` field of an enrollment message to `wazuh-authd` on TCP/1515:
      `strncpy(ver, version, 9)` into a 10-byte buffer never NUL-terminates a 9-byte input, and the OOB
      `strchr`/`strtok` scans reliably crash the daemon; anonymous SSL (`ssl_verify_host=no`) and the
      shipped default `allow_higher_versions=false` mean no credential is required. Affected range:
      wazuh-manager >=4.0.0 (>=4.3.0 for CVE-2026-49441) through 4.14.5; all four — and the six other CVEs
      in the same BSI cluster this run did not individually verify — are fixed in 4.14.6. All four are
      researcher-disclosed (credited: moltenbit, TarPeg007, Mahmoud Bettouch with TrendAI's Zero Day
      Initiative) with no exploitation reported.
