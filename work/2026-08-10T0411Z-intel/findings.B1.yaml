        source_url: "https://wordpress.org/news/2026/08/wordpress-7-0-3-release/"
      - quote: |
          Via a specially crafted malicious third-party website hosted by an attacker, it is possible for this to be escalated to an RCE vulnerability with conditions outside of the attackers control. This requires successful social engineering of and explicit interaction by the target victim.
        attribution: "WordPress (GitHub Security Advisory GHSA-52p2-r8wf-jcrf, CVE-2026-64638)"
        source_url: "https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-52p2-r8wf-jcrf"
      - quote: |
          WordPress validates the nonce (correct), checks the capability (administrator, correct), and extracts the ZIP into wp-content/plugins/. The plugin does not need to be activated. PHP files inside the extracted directory are directly accessible by URL and are as good as activated plugins since the web server will executes them.
        attribution: "pwn.ai (Nigusu Kasahun, XSS2Shell write-up)"
        source_url: "https://pwn.ai/blog/xss2shell"
    extended_notes: |
      Detection: the load-bearing telemetry class is web/application access logs on the login endpoint —
      a `wp-login.php` POST whose `log` (username) parameter contains a literal `< ` (angle-bracket
      followed by whitespace) is the discriminating artifact for the initial XSS delivery, since that
      whitespace is exactly what defeats `wp_strip_all_tags()` while surviving `wp_kses_post()`; no
      legitimate username contains that sequence. Downstream, an Application Password creation event
      immediately following an `authorize-application.php` page view with no visible prior API-key
      management session, plus a plugin-upload event (`/wp-admin/update.php?action=upload-plugin`) from the
      same session shortly after, is the escalation signature — REST API audit logging (if enabled) showing
      `_jsonp=` or `_envelope=1` query parameters on `rest_route=/` requests is a strong, low-noise hunt
      query since legitimate WordPress REST clients rarely use either. Triage/benign-lookalike note: `<area>`,
      `<div>`, `<button>` are legitimate KSES-post allowlist elements, so their mere presence in a rendered
      admin notice is not itself anomalous — the discriminator is that these elements originate from the
      login-page error path (an unauthenticated, pre-session context) rather than from authenticated content
      editing.
      Hardening: this is a same-day-patched vendor CVE with no interim mitigation offered beyond upgrading —
      WordPress 7.0.3 (or the matching backport for the running branch) removes the parser disagreement.
      Defense-in-depth for administrators who cannot patch immediately: disable Application Passwords
      (`add_filter('wp_is_application_passwords_available', '__return_false')`) removes the credential-theft
      step even if the XSS-to-click chain still fires, and training administrators not to open unsolicited
      links while logged into wp-admin removes the required social-engineering step entirely.

  # ============================================================
  # ITEM 3 — FreeBSD CTL HA pre-auth remote kernel RCE
  # ============================================================
  - title: "FreeBSD CTL HA: three independent pre-auth remote kernel-RCE primitives on the unauthenticated cluster-failover TCP interconnect (port 999); FreeBSD documents the risk in the manpage rather than patching the protocol"
    sources:
      - { url: "https://blog.calif.io/p/the-taking-of-freebsd-one-two-three", publisher: "Calif (discovering/exploiting researcher)", date: "2026-08-06", role: "primary" }
      - { url: "https://cgit.freebsd.org/src/commit/?id=3c8f8432", publisher: "FreeBSD Project (official src git repository, commit 3c8f8432)", date: "2026-08-05", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md (2026-08-09T1315Z-audit entry, re-verified again by a same-day earlier fire on 2026-08-10, itself sourced from blog.calif.io) → primary re-fetch this run: https://blog.calif.io/p/the-taking-of-freebsd-one-two-three via python3 tools/fetch_source.py url (saved to work/2026-08-10T0411Z-intel/b1-freebsd.txt) → independent corroboration located this run (not previously fetched by any earlier fire per the backlog note): FreeBSD's own official git commit at https://cgit.freebsd.org/src/commit/?id=3c8f8432 , located via WebSearch (\"FreeBSD ctl.4 manpage kern.cam.ctl.ha_peer 'no authentication mechanism' commit Mark Johnston\") then fetched directly — the commit message credits 'Ryan of Calif.io' as reporter and the manpage diff text matches the blog's quote verbatim, elevating this item from single- to multi-source."
    summary: |
      FreeBSD's CTL (CAM Target Layer) kernel subsystem — the iSCSI/SCSI storage-target driver, live on
      TrueNAS Enterprise HA clusters and any FreeBSD host with `kern.cam.ctl.ha_peer` explicitly configured
      — runs an unauthenticated High-Availability failover protocol on TCP/999 by default: "whatever
      connects is trusted as the second controller." Researcher Calif (credited in FreeBSD's own commit as
      "Ryan of Calif.io") reported three independent primitives behind that port in March-April 2026, each
      independently sufficient for a root shell from network access alone. FreeBSD-One is an unchecked
      raw-kernel-pointer dereference in HA DATA-channel messages, giving arbitrary kernel read/write
      directly off the wire (trivial to weaponise since the GENERIC kernel ships without KASLR).
      FreeBSD-Two abuses a second untrusted wire pointer (`original_sc`) in the DATAMOVE handler for a
      write-only primitive that repoints a handler function pointer to pivot into FreeBSD-One's clean-write
      path. FreeBSD-Three is a heap overflow in the DATAMOVE scatter-gather copy loop — an unchecked entry
      count overflowing a fixed 64-byte heap buffer into the adjacent UMA slab object, requiring a full
      slab-grooming heap exploit (overwrite a callback pointer, stack pivot, ROP, clear the NX bit). All
      three finish with kernel shellcode calling `kproc_create`/`kern_execve` to spawn `/bin/sh` connected
      back to the attacker, with the `ha_rx` kernel thread exiting cleanly so the box stays up — there is no
      crash signature. FreeBSD declined a code fix: the project's own git commit (3c8f8432b6f6, authored by
      Mark Johnston 2026-08-04, merged 2026-08-05, independently fetched and confirmed by this run at
      cgit.freebsd.org) instead adds a `ctl.4` manpage warning; the maintainers' position, stated in their
      own commit message, is that CTL HA is a private, by-design-trusted backchannel between two storage
      controllers that was never supposed to be reachable from an untrusted network, so documentation is
      the fix, not a bounds check. No CVE has been assigned by either FreeBSD or the researchers — this run
      confirms that absence; none should be invented. CTL HA requires explicit administrator configuration
      (`kern.cam.ctl.ha_peer` set) rather than shipping enabled on a stock FreeBSD install, but ships enabled
      by product design on TrueNAS Enterprise HA clusters. Public, working exploit scripts for all three
      primitives are published alongside the write-up; neither source states which specific FreeBSD release
      branches were tested, only that the vulnerable manpage/feature dates at least to March 2017.
    region_nexus: "global; FreeBSD-derived storage appliances (e.g. TrueNAS Enterprise HA) sit in critical-infrastructure estates"
    primary_sector_nexus: "indirect"
    sector: "energy, water, transport, healthcare, finance, telco, public-sector"
    cves: []
    techniques: [T1210]
    affected_products: ["FreeBSD", "FreeBSD CTL (CAM Target Layer)", "TrueNAS Enterprise HA"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: |
          Once it's on, the kernel listens on a TCP port (999 by default) for its peer, with no authentication. Whatever connects is trusted as the second controller.
        attribution: "Calif (\"The Taking of FreeBSD One Two Three\")"
        source_url: "https://blog.calif.io/p/the-taking-of-freebsd-one-two-three"
      - quote: |
          NOTE: HA must be configured only on trusted networks: there is no authentication mechanism built in to the implementation, and the HA protocol effectively permits remote code execution on the peer node.
        attribution: "FreeBSD Project (ctl.4 manpage text, commit 3c8f8432, Mark Johnston)"
        source_url: "https://cgit.freebsd.org/src/commit/?id=3c8f8432"
      - quote: |
          There is no authentication mechanism and the protocol itself embeds kernel pointers in the messages exchanged between HA hosts. This property (of CTL_MSG_DATAMOVE messages specifically), as well as insufficient validation of inbound messages, mean that anyone able to access a CTL HA port is able to remotely execute code on that host.
        attribution: "FreeBSD Project (commit message, commit 3c8f8432, Mark Johnston)"
        source_url: "https://cgit.freebsd.org/src/commit/?id=3c8f8432"
    extended_notes: |
      Detection: the load-bearing telemetry class is network flow/connection logs — any TCP connection to
      port 999 (or whatever port `kern.cam.ctl.ha_peer` is configured to) from a source address other than
      the configured HA peer is definitionally illegitimate, since the protocol has no authentication to
      fall back on; this is a case where network segmentation visibility (a flow log or firewall deny/allow
      rule keyed on port 999 with a two-host allowlist) is the only practical control, because the exploit
      chain runs entirely in kernel context before any host-based EDR telemetry (process creation, etc.)
      would fire. If a primitive succeeds, the eventual `/bin/sh` connect-back is a normal outbound
      network-connection artifact, but the parent lineage will be anomalous (spawned via `kproc_create` from
      kernel context rather than any expected userland parent) — host telemetry that can observe
      process-parent anomalies at that resolution is uncommon outside kernel-level EDR/DTrace-based tooling.
      Hardening: FreeBSD's own guidance is the only hardening lever that exists — place CTL HA's TCP port on
      a network no untrusted host can reach (a dedicated, non-routable interconnect segment between the two
      storage controllers only), and do not enable `kern.cam.ctl.ha_peer` unless HA failover is actually
      required. For TrueNAS Enterprise HA deployments specifically, verify the HA interconnect ships on a
      dedicated physical/VLAN segment per vendor deployment guidance rather than a shared management or
      production network — there is no patch to apply instead.

  # ============================================================
  # ITEM 4 — wp2root (update_of tracked WP2Shell/NCSC-CH entry)
  # ============================================================
  - title: "wp2root: a PHP Serializable use-after-free plus the CISA KEV-listed 'Copy Fail' Linux kernel bug (CVE-2026-31431) turns wp2shell's sandboxed PHP execution into fileless native root, defeating disable_functions"
    sources:
      - { url: "https://blog.calif.io/p/the-wordpress-chain-massacre", publisher: "Calif (post-exploitation chain author)", date: "2026-08-05", role: "primary" }
      - { url: "https://copy.fail/", publisher: "Theori / Xint Code (Copy Fail discloser)", date: "2026-04-29", role: "primary" }
      - { url: "https://blog.calif.io/p/mad-bugs-finding-and-exploiting-a", publisher: "Calif (background: the PHP unserialize UAF bug class)", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: state/coverage_backlog.md (2026-08-09T1315Z-audit entry, re-verified by a same-day earlier fire on 2026-08-10, itself sourced from blog.calif.io) → primary re-fetch this run: https://blog.calif.io/p/the-wordpress-chain-massacre via python3 tools/fetch_source.py url (saved to work/2026-08-10T0411Z-intel/b1-wp2root.txt) → pivot for the CVE-2026-31431 check the task required: https://copy.fail/ (Theori/Xint's own disclosure page) → cross-check: NVD (https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-31431) and MITRE (https://cveawg.mitre.org/api/cve/CVE-2026-31431), both PUBLISHED (assigner: Linux kernel CNA) — confirms the identifier resolves and matches the described crypto/algif_aead bug → additional check: python3 tools/fetch_source.py cisa-kev — CVE-2026-31431 present, dateAdded 2026-05-01 → additional check: FIRST.org EPSS API — CVE-2026-31431 epss=0.99907 (2026-08-09) → background pivot: https://blog.calif.io/p/mad-bugs-finding-and-exploiting-a for the PHP Serializable UAF bug-class history → dedup check: work/2026-08-10T0411Z-intel/prior_coverage.json confirms 2026-08-08/ncsc-ch-clickfix-wp2shell-etherhiding-vidar-swiss-websites (CVE-2026-63030/CVE-2026-60137) as the tracked entry this item updates."
    summary: |
      Calif's wp2root chain (2026-08-05) is a post-exploitation extension that starts where AssetNote's
      wp2shell (WordPress Core pre-auth RCE, CVE-2026-63030/CVE-2026-60137 — the chain this pipeline
      already tracks as actively exploited against Swiss websites per NCSC-CH's ClickFix/EtherHiding
      advisory) hands an attacker sandboxed PHP execution, and turns it into fileless native root even
      where `disable_functions` blocks `system()`/`exec()` and the filesystem is read-only. The escape from
      PHP uses a use-after-free in PHP's legacy `Serializable` interface path (`zend_user_unserialize()`,
      missing a `BG(serialize_lock)++` increment on a code path unpatched since PHP 5.1 shipped in 2005 —
      the same bug class Calif profiled separately in "MAD Bugs," tracing back through Taoguang Chen's
      2015-2017 SPL UAF CVEs): recursive `unserialize()` calls inside a `Serializable::unserialize()` body
      share the outer parser's `var_hash` reference table, and a subsequent property-table resize frees a
      bucket the outer parser still references, letting sprayed strings reclaim it as attacker-controlled
      zvals. This specific bug carries no CVE — this run confirms that absence is consistent with PHP's own
      August 2017 internals decision that `unserialize()` memory-corruption bugs are not treated as
      CVE-worthy security issues; none should be invented for it. The resulting arbitrary read builds a
      "self-resolving" ROP chain (no hardcoded offsets — it locates the PHP binary and its own gadgets from
      the live process at exploit time) that either calls PHP's native `system` handler directly in machine
      code — defeating `disable_functions`, which removes only the PHP-level name, not the underlying
      handler — or launches a position-independent stager. That stager `memfd_create`s a second-stage ELF
      helper, pins it at fd 197 (surviving `execve` because the memfd is not close-on-exec), and runs it via
      `execveat(..., AT_EMPTY_PATH)` — nothing touches disk. The helper performs "Copy Fail" (CVE-2026-31431:
      a logic flaw in `algif_aead`/`authencesn`, reachable via `AF_ALG` and `splice()`, that lets an
      unprivileged local user overwrite the kernel's page-cache copy of a setuid-root binary such as
      `/usr/bin/su` with a 4-byte write — defeating on-disk file-integrity monitoring since the file itself
      is never modified): running the setuid binary then executes the attacker's cached-page stub as root,
      which re-enters the helper via fd 197 for a full root shell. This run independently confirmed
      CVE-2026-31431 resolves on both NVD and MITRE (Linux kernel CNA, CVSS 3.1 7.8 High, fixed by mainline
      commit a664bf3d603d, reported 2026-03-23/patched 2026-04-01/disclosed 2026-04-29) — it is also CISA
      KEV-listed since 2026-05-01 for confirmed active exploitation, independent of Calif's chain-building
      exercise, and EPSS scores it 0.999 (99.97th percentile) as of 2026-08-09. Ships as a material update
      on tracked, actively-exploited-against-Swiss-targets ground: the underlying kernel LPE this chain
      relies on for its root step is itself under confirmed active exploitation, not merely a research
      demonstration.
    region_nexus: "global; directly extends a chain NCSC-CH has already confirmed compromising Swiss websites"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: [CVE-2026-31431]
    techniques: [T1190, T1068, T1611]
    affected_products: ["WordPress Core", "PHP", "Linux kernel"]
    entity_keys: []
    new_entities:
      - { key: "tool:wp2root", type: tool, name: "wp2root", aliases: [],
          summary: "Calif's post-exploitation chain that escalates AssetNote's wp2shell WordPress pre-auth RCE (sandboxed PHP execution) to fileless native Linux root, using a PHP Serializable use-after-free for native-code execution and the 'Copy Fail' Linux kernel bug (CVE-2026-31431) for the final privilege escalation, defeating disable_functions hardening (Calif, 2026-08-05)." }
      - { key: "tool:wp2shell", type: tool, name: "wp2shell", aliases: [],
          summary: "AssetNote's WordPress Core pre-authentication remote-code-execution chain (CVE-2026-63030/CVE-2026-60137), discovered with GPT-5.6 assistance; KEV-listed and actively exploited against, among others, Swiss websites per NCSC-CH's 2026-08-08 advisory." }
    relation_suggestions:
      - { subject: "tool:wp2root", object: "tool:wp2shell",
          basis: "Calif: \"Today we walk through wp2root, our post-exploitation chain that begins where wp2shell ends\" (blog.calif.io, 2026-08-05)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-08-08/ncsc-ch-clickfix-wp2shell-etherhiding-vidar-swiss-websites"
    evidence:
      - quote: |
          wp2shell drops you inside the PHP interpreter, and on a hardened host that interpreter is locked down. Dangerous functions like system() and exec() are switched off with disable_functions, the filesystem can be mounted read-only, and there may be nowhere to write a file.
        attribution: "Calif (\"The WordPress Chain Massacre\")"
        source_url: "https://blog.calif.io/p/the-wordpress-chain-massacre"
      - quote: |
          The first recovers the native system handler and calls it directly, in native code, even though disable_functions took away the PHP-level name.
        attribution: "Calif (\"The WordPress Chain Massacre\")"
        source_url: "https://blog.calif.io/p/the-wordpress-chain-massacre"
      - quote: |
          Copy Fail (CVE-2026-31431): a 732-byte Linux LPE — straight-line, no race, no per-distro offsets. Same Python script roots Ubuntu, Amazon Linux, RHEL, SUSE since 2017. Page-cache write bypasses on-disk file-integrity tools and crosses container boundaries.
        attribution: "Theori / Xint Code (copy.fail)"
        source_url: "https://copy.fail/"
    extended_notes: |
      CVE-2026-31431 provenance detail: NVD/MITRE record it as "crypto: algif_aead - Revert to operating
      out-of-place," reverting 2017 commit 72548b093ee3 (the in-place AEAD optimization) except for
      associated-data copying — this is the Linux kernel's own CNA-authored description and it matches
      copy.fail's account exactly (mainline fix commit a664bf3d603d). CISA's KEV entry
      (dateAdded 2026-05-01, dueDate 2026-05-15, "Linux Kernel Incorrect Resource Transfer Between Spheres
      Vulnerability," CWE-669) references the same lore.kernel.org CVE announcement and the same Xint
      write-up. `knownRansomwareCampaignUse` is "Unknown" in the KEV record — KEV listing confirms
      exploitation observed, not a ransomware-specific link.
      Detection: for the PHP-side escape, the discriminating telemetry class is PHP worker process behavior
      — a PHP-FPM/mod_php worker process that opens an anonymous memfd and then calls `execveat` on it
      (visible via process-creation telemetry with an argv/exe path resolving to `/proc/self/fd/<n>` or a
      memfd-backed inode rather than a normal on-disk binary) is a strong, low-false-positive signal, since
      legitimate WordPress/PHP workflows never spawn child processes this way. For Copy Fail specifically,
      `lsof | grep AF_ALG` / `ss -xa` surfaces any process holding an AF_ALG socket, which is itself unusual
      outside of the small set of applications the copy.fail advisory names (dm-crypt/LUKS, kTLS, IPsec use
      the in-kernel crypto API directly and do not touch AF_ALG); a setuid-root binary executing anomalously
      shortly after such a socket closes is the composite signature. Hardening: patch to a kernel including
      mainline commit a664bf3d603d (most major distributions have shipped this since April/May 2026); where
      patching is not immediately possible, disable the `algif_aead` module
      (`echo "install algif_aead /bin/false" > /etc/modprobe.d/disable-algif.conf; rmmod algif_aead`) — the
      discloser states this breaks nothing for dm-crypt/LUKS, kTLS, IPsec/XFRM, OpenSSL/GnuTLS/NSS default
      builds, SSH, or kernel keyring crypto, all of which bypass AF_ALG entirely; for untrusted-workload
      hosts (CI runners, multi-tenant containers), block AF_ALG socket creation via seccomp regardless of
      patch state. Neither hardening step touches the PHP-side UAF, which remains reachable from any
      pre-existing PHP code-execution foothold (wp2shell or otherwise) — the durable fix for that half is
      keeping `disable_functions`/read-only filesystem hardening in place as defense-in-depth even though
      this chain shows it is not a complete backstop, and treating any WordPress pre-auth RCE (including
      wp2shell) as requiring full incident response rather than a plugin/theme cleanup, since post-exploitation
      to root is demonstrated and does not require any additional vulnerability disclosure to execute today.

