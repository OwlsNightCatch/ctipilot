  # ITEM 2 — WordPress Core XSS2Shell, CVE-2026-64638
  # ============================================================
  - title: "WordPress Core XSS2Shell (CVE-2026-64638): a wp_strip_all_tags()/wp_kses_post() parser disagreement on the login page chains through DOM clobbering and a JSONP/SOME callback into administrator RCE — patched same-day in 7.0.3, distinct from the tracked WP2Shell chain"
    sources:
