    evidence:
      - quote: "A use-after-free vulnerability in the Linux kernel bridge (net/bridge) Spanning Tree Protocol (STP) implementation."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/"
      - quote: "A bridge that is administratively down while kernel STP is enabled, together with a port driven into the LEARNING state, arms periodic STP timers without an IFF_UP guard."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/"
      - quote: "Two independent security researchers, n132 and sven sze, submitted this during our TyphoonPWN 2026 and won second place in the Linux PE category."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/"
      - quote: "So as long as we refill the freed slot with a buffer carrying an attacker-controlled function pointer, we obtain a control-flow hijacking primitive."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/"
      - quote: "This check is missing from br_topology_change_detection() and it is possible to engineer a situation in which the topology change timer is armed while the bridge is administratively down, resulting in a use-after-free"
        attribution: "Ido Schimmel (upstream kernel fix commit 2a00517db8de4be7df3d483b215c5544fb30a191)"
        source_url: "https://github.com/torvalds/linux/commit/2a00517db8de4be7df3d483b215c5544fb30a191"
    extended_notes: |
      RELEVANCE VERDICT: Clears the bar, with the precondition stated as precisely as the sources allow rather than rounded up or down. This is NOT a network-reachable bug and NOT exploitable by a fully unprivileged process in the strict sense — it needs CAP_NET_ADMIN over a bridge device, gated by netlink bridge-management operations (RTM_NEWLINK/DELLINK with IFLA_INFO_KIND="bridge", IFLA_BR_STP_STATE). That capability is realistically available on: (a) any host where the attacker already has root or a NET_ADMIN-granted container/process (common on CI runners, network-function containers, and some multi-tenant platforms); (b) any host permitting unprivileged user-namespace creation, which is a widely-enabled-by-default Linux feature that lets a fully unprivileged local user obtain CAP_NET_ADMIN inside a new namespace without root — making this a genuine local-privilege-escalation-class primitive on many real deployments, which is exactly how SSD's own "Linux PE" TyphoonPWN category framing treats it. The published, compilable exploit code and a still-unconfirmed stable/LTS backport status make this actionable now: hunt for anomalous bridge create/STP-enable/delete sequences from non-root or namespace-confined principals (auditd/eBPF on RTM_NEWLINK/RTM_DELLINK with IFLA_INFO_KIND=bridge, or kernel timer/slab-debug warnings matching "ODEBUG: free active... object type: timer_list... br_topology_change_timer_expired"), and treat kernel.unprivileged_userns_clone / user.max_user_namespaces restrictions as a real mitigating control until each host's specific kernel build is confirmed to include the fix commit.

