      (1) Anthropic Claude Code Action and (2) Google Gemini CLI: the CVEs themselves are NOT new — GHSA-fg94-h982-f3mm/CVE-2026-54316 published 2026-06-13 (fixed in claude-code 2.1.163, already ~8 weeks old), GHSA-wpqr-6v78-jr5g/CVE-2026-12537 published 2026-04-24 (fixed in gemini-cli 0.39.1 / run-gemini-cli 0.1.22, already ~15 weeks old). This pipeline's prior_coverage.json and entities/registry.yaml show extensive existing coverage of the coding-agent-as-attack-surface theme, and specifically one existing entity (trend:claude-code-action-github-issue-supply-chain, from GMO Flatt Security, 2026-06-05) documenting a DIFFERENT but related claude-code-action bug (a [bot]-suffix actor bypass in checkWritePermissions(), also chaining to /proc/self/environ theft) — so the /proc/self/environ exfiltration TARGET is already known to the store, but the THREE validator-bypass mechanics (quote-stripping past a command-injection pipeline, a hardcoded read-only-vs-path-checked command-list asymmetry, and a public-download-counter side channel) are new mechanistic detail not previously captured. For a defender, the actionable content on these two vendors is a completeness/audit check ("confirm you are on claude-code >= 2.1.163 and gemini-cli >= 0.39.1 / run-gemini-cli >= 0.1.22, and that you have opted into Gemini's new headless folder-trust model"), not new emergency response.
      (2) OpenAI Codex: genuinely new. No CVE or GHSA exists for this finding in any source checked (confirmed absence, not an omission on my part — the article's own text states "Nobody files a CVE for a just now documented behavior"). OpenAI's fix is scoped to openai/codex's own repository only; there is no version bump or downstream-facing patch that reaches any other GitHub organization running the same multi-pass-agent pattern with openai/codex-action. This is immediately actionable and not previously covered by this pipeline: any team running two-or-more-pass AI-agent CI workflows sharing a single checkout/workspace should audit for exactly this pattern now, regardless of vendor, because the underlying flaw is architectural (shared filesystem + an agent's own default instruction file left outside the protected-metadata list) rather than a single vendor's bug.
      Net call: publish, but the entry's actionable weight should sit on the OpenAI Codex / cross-vendor architectural lesson, with the Claude Code and Gemini CLI material carried as supporting mechanistic detail and a "confirm you're patched" note rather than framed as breaking vulnerability news.

  - title: "Linux kernel bridge STP timer use-after-free — no CVE assigned, a full working exploit published inline by the discloser, and the precondition is CAP_NET_ADMIN over a bridge device (not network-reachable, not exploitable by a fully unprivileged process without that capability)"
    sources:
      - { url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/", publisher: "SSD Secure Disclosure", date: "2026-08-05", role: "primary" }
      - { url: "https://github.com/torvalds/linux/commit/2a00517db8de4be7df3d483b215c5544fb30a191", publisher: "Linux kernel (torvalds/linux, GitHub mirror of the upstream fix commit)", date: "2026-06-30", role: "primary" }
      - { url: "https://cybersecuritynews.com/linux-kernel-bridge-use-after-free-vulnerability/", publisher: "Cyber Security News", date: "2026-08-06", role: "corroborating" }
    discovery_trace: "first seen at: S3 sweep coverage-gap recovery (main-agent-supplied lead, primary URL not given) → WebSearch (\"site:ssd-disclosure.com bridge STP\") and WebSearch (\"ssd-disclosure.com bridge STP timer use-after-free advisory 2026\") did not directly surface the advisory URL → pivot: cybersecuritynews.com/linux-kernel-bridge-use-after-free-vulnerability (fetched via python3 tools/fetch_source.py url, its body links the SSD advisory directly) → primary: ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/ (per the run's own noted transport quirk, the jina-reader path hit an anti-bot Robot Challenge Screen; python3 tools/fetch_source.py url --direct succeeded on retry after an initial HTTP 202 challenge response) → pivot for fix-commit verification: git.kernel.org direct fetch AND jina-reader fetch both blocked by an Anubis proof-of-work challenge (genuine transport failure, logged below) → primary (alternate mirror): github.com/torvalds/linux/commit/2a00517db8de4be7df3d483b215c5544fb30a191 (fetched via jina-reader fallback, returns the full upstream commit message with Fixes:/Reported-by:/Signed-off-by: tags)"
    summary: |
      SSD Secure Disclosure published an advisory (2026-08-05) for a use-after-free in the Linux kernel's software bridge STP implementation (net/bridge), submitted independently by two researchers, n132 and sven sze, during SSD's TyphoonPWN 2026 competition, where it won second place in the Linux privilege-escalation category. NO CVE HAS BEEN ASSIGNED — confirmed by the absence of any CVE reference on the SSD advisory page and by the absence of a "Cc: stable@vger.kernel.org" tag or CVE reference in the upstream fix commit's own message. Root cause, per SSD's own root-cause and vulnerability-analysis sections plus the upstream fix commit message (fetched via a GitHub mirror after git.kernel.org itself was blocked by an anti-bot challenge on both direct and jina-reader transports): the Linux bridge driver arms three periodic STP timers (hello_timer, tcn_timer, topology_change_timer) plus per-port timers, embedded directly inside struct net_bridge, itself private data inside the bridge's net_device. The arming path reached when a port transitions into the LEARNING state — specifically br_topology_change_detection(), called during that transition — is missing the IFF_UP guard that every other arming call site checks, so a bridge that is administratively DOWN can still have its topology-change timer armed. The only code path that synchronously cancels these timers (del_timer_sync()) is br_stp_disable_bridge(), reached from br_dev_stop() on an UP→DOWN transition (ndo_stop). Deleting the bridge link directly instead runs br_dev_delete(), which never calls br_stp_disable_bridge(); unregister_netdevice_many() additionally skips ndo_stop entirely for a device that is already DOWN. Consequently, a bridge left administratively DOWN with kernel STP enabled and a port driven into LEARNING has its STP timers queued but never cancelled; when the link is subsequently deleted, the backing net_device (with the timers embedded in its private net_bridge data) is freed while still linked into a per-CPU timer base, and the next __run_timers() softirq pass dereferences and calls the freed timer's function pointer via call_timer_fn() with RDI pointing at the timer list — a control-flow-hijacking primitive if the attacker can reclaim the freed kmalloc-cg-8k slab slot with a controlled function pointer before the timer fires. The upstream fix (commit 2a00517db8de4be7df3d483b215c5544fb30a191, authored by Ido Schimmel/Nvidia, acked by Nikolay Aleksandrov/Nvidia, merged by Paolo Abeni, committed to Linus's tree on 2026-06-30) adds the missing IFF_UP check to br_topology_change_detection() and, "for good measure," synchronously shuts down all three STP timers when the bridge is deleted; the commit carries a Fixes: tag pointing to 1da177e4c3f4 ("Linux-2.6.12-rc2") — i.e. the bug is as old as the kernel's git history for this subsystem, effectively present in every historical mainline release up to the fix. PRECONDITION, reported precisely and not softened: triggering this bug requires the ability to create/delete a bridge network interface and manipulate its STP state and port state via netlink (RTM_NEWLINK/RTM_DELLINK, the IFLA_BR_STP_STATE attribute, and port-state transitions) — these bridge-management operations are gated by the CAP_NET_ADMIN capability in the Linux kernel. Neither the SSD advisory nor the upstream commit states that the bug is reachable from network/wire traffic (it is not — the trigger is entirely local interface/netlink manipulation), and neither source states that it is exploitable by a fully unprivileged process without CAP_NET_ADMIN. In practice CAP_NET_ADMIN is available to root, to many containerized workloads that are granted NET_ADMIN (common for CI runners, network-configuration sidecars, and some multi-tenant container platforms), and — on distributions that permit unprivileged user-namespace creation (a widely enabled default) — to an unprivileged local user via unshare(CLONE_NEWUSER|CLONE_NEWNET), which grants CAP_NET_ADMIN inside the new namespace without real root; SSD's own "Linux PE" (privilege escalation) category framing at TyphoonPWN is consistent with this being treated as a local-privilege-escalation-class primitive rather than a remote one, but the exact minimum starting privilege was not stated by either primary source, and this run could not independently confirm which starting condition TyphoonPWN's rules assumed. A full, compilable C proof-of-concept (netlink helper functions for bridge/link creation and deletion, IFLA_BR_STP_STATE manipulation, and the interface up/down toggling primitives) is published inline on the SSD advisory page itself — this IS a public PoC, published by the discloser as part of the coordinated-disclosure write-up, and multiple news outlets (Cyber Security News, GB Hackers, Cyber Press) picked up the story on 2026-08-06 explicitly under headlines emphasizing "Public PoC Released." Stable/LTS backport status beyond the mainline commit could not be confirmed in this run: git.kernel.org (both the commit view and any stable-queue equivalent) was blocked by an Anubis proof-of-work anti-bot challenge on every transport tried (direct fetch and jina reader), and the upstream commit message as mirrored on GitHub does not carry an explicit "Cc: stable@vger.kernel.org" tag, so whether or when this lands in specific stable/LTS point releases is an open question this run could not close.
    region_nexus: "global — relevant wherever Linux hosts run bridge interfaces with STP enabled and a principal (root, a NET_ADMIN-capable container, or an unprivileged user permitted to create user+network namespaces) can create/delete bridges and manipulate port/STP state; directly relevant to Swiss and European public-sector, energy, water, transport, healthcare, finance and telco operators' Linux virtualization hosts, container platforms and CI/build infrastructure."
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
