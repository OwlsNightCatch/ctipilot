    discovery_trace: "first seen at: S3 sweep coverage-gap recovery (main-agent-supplied lead) → go.synack.com/security-research/natjack (marketing landing page, confirms 2 CVEs assigned, CVSS 7.2-9.6, Black Hat USA 2026 talk by Malcolm Stagg) → pivot: natjack.io (the researcher's own technical site, full four-primitive breakdown + explicit CVE-to-flaw mapping + disclosure timeline) → primary: msrc.microsoft.com/update-guide/vulnerability/CVE-2026-56181 (Microsoft's own CVRF/CVSS record, fetched via python3 tools/fetch_source.py msrc cve and msrc cvrf) → primary: lore.kernel.org linux-cve-announce (fetched via jina reader fallback after direct fetch hit an Anubis bot challenge) → verification: nvd.nist.gov per-CVE pages (not cited as entry sources per house style) → corroboration: csoonline.com (fetched via WebFetch, confirms 32 products / 95 configurations / 13 vendors tested vulnerable)"
    summary: |
      NatJack is a newly identified attack class — presented by independent researcher Malcolm Stagg (Synack Red Team, SODIUM-24) at Black Hat USA 2026 on 2026-08-06 — that abuses a decades-old, unstated trust assumption in network address translation: that devices sharing a NAT table can trust one another. Independent testing found every evaluated NAT implementation vulnerable to at least one of four primitives: (1) TCP session hijack via downstream (LAN-side) IP spoofing, where an attacker sharing the NAT table removes or replaces the NAT mapping for an active victim TCP connection and redirects traffic to itself, enabling impersonation, traffic injection, session termination, or limited MITM against long-lived HTTP connections; (1b) a coordinated variant requiring both a downstream attacker host and an upstream attacker-controlled server (upstream spoofing), needing prior knowledge of the victim's externally mapped ephemeral port; (2) UDP DNS response hijack via the same downstream NAT-mapping removal/replacement technique, applied to DNS query/response pairs; (3) victim IP/port information disclosure via predictable NAT ephemeral-port allocation, letting a downstream attacker probe and infer a victim's externally mapped port (and in some conditions internal IP) — itself a stepping-stone to primitives 1/1b/2; and (4) NAT-table exhaustion DoS via mass spoofed TCP/UDP flows from a downstream attacker, denying new outbound connections to legitimate LAN clients. Only two of the four primitives have an assigned CVE, and the mapping is per-vendor rather than per-primitive: CVE-2026-56181 covers Microsoft's Windows NAT component (which backs Hyper-V's default-switch/ICS NAT) specifically "in a downstream spoofing configuration" (i.e., the TCP-hijack-via-downstream-spoofing primitive), and CVE-2026-63913 covers Linux kernel netfilter conntrack, also specifically the mitigation for the downstream-spoofing attack. Neither the upstream-spoofing TCP hijack, the DNS hijack, the port/IP disclosure primitive, nor the DoS primitive carries a CVE from any vendor in the material reviewed; NatJack.io's own "CVEs, Patches and Advisories" section lists exactly these two CVEs and nothing else, plus one unrelated 2025 FreeBSD/OpenBSD incidental patch and an Amazon eero blog advisory. CVE-2026-56181 (Windows Network Address Translation (NAT) Spoofing Vulnerability, CWE-346 Origin Validation Error) is CVSS 3.1 8.3 base / 7.2 temporal (AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H) per Microsoft's own CVRF record, rated Moderate severity, not publicly disclosed and not exploited per MSRC, released 2026-07-14, and affects Windows 11 24H2/25H2/26H1 (both x64 and ARM64) and Windows Server 2025 (including Server Core) — specifically builds below 10.0.26100.8875 (24H2), 10.0.26200.8875 (25H2), 10.0.28000.2525 (26H1), and 10.0.26100.33158 (Server 2025); no discrete KB number was published in the CVRF record reviewed, and the fix appears to have shipped as part of the July 2026 update cycle. CVE-2026-63913 (netfilter: conntrack: tcp: do not force CLOSE on invalid-seq RST without direction check, in net/netfilter/nf_conntrack_proto_tcp.c) has no CWE assigned by the Linux CNA; NVD's own CVSS 3.1 assessment is 8.2 HIGH (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H). The bug — an RST packet with an invalid sequence number that can force a TCP conntrack entry to CLOSE without validating packet direction, letting a downstream attacker prematurely terminate an active NAT mapping and free it for reuse — was introduced in kernel 2.6.15 and is fixed in stable/LTS 5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.93, 6.18.35, 7.0.12, and mainline 7.1, all via the same upstream fix. Attacker position for the primitive both CVEs address is "downstream" — the attacker shares the NAT table with the victim from the LAN/internal side (this can be a different VLAN/subnet, a compromised container, VM, or cloud tenant behind the same NAT — it does not require the same broadcast domain, which is what distinguishes NatJack from classic ARP spoofing). The upstream-spoofing TCP-hijack variant additionally needs an attacker-controlled upstream server. Beyond Windows and Linux, natjack.io and CSO Online report the researcher tested 32 products across 95 configurations from 13 vendors, finding vulnerable behavior in routers/firewalls, Docker and Kubernetes bridge networking, hypervisors including Hyper-V, cloud NAT gateways, and virtual bridges/switches; AWS published a statement describing hardening deployed to NAT Gateway and Network Load Balancer connection-state validation (requiring the attacker to already control an EC2 instance inside the target VPC); Google accepted Android Hotspot DNS-hijack reports as moderate severity; Kubernetes' bug bounty program and Docker deferred to the underlying Netfilter fix; OpenWRT stated any fix must be ported from the Linux kernel. No vendor patch is described as a complete fix — every fix reviewed is characterized by its own vendor or by natjack.io as increasing attack complexity rather than eliminating the class. A prior, narrower NAT sequence-number-leakage TCP-hijack research line by Yang et al. (NDSS) produced CVE-2023-30305 through CVE-2023-30314 and is credited by the researcher as related prior work.
    region_nexus: "global — no Swiss/EU-specific targeting; direct relevance to this constituency because it names Microsoft Hyper-V (backed by Windows NAT) and Linux kernel netfilter/conntrack, both ubiquitous NAT implementations in Swiss and European public-sector, energy, water, transport, healthcare, finance and telco infrastructure."
