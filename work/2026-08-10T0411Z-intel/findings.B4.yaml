    extended_notes: |
      RELEVANCE VERDICT: Clears the bar clearly. This constituency runs both named platforms (Hyper-V, Linux netfilter) at scale, the affected/patched-version detail is vendor-precise, the attacker-precondition (shared-NAT/downstream position) is stated plainly, and the finding gives defenders something to act on now: confirm Windows builds are at or above the patched CVRF thresholds, confirm Linux kernels are at or above the patched stable/LTS point releases, and — because neither fix is described as complete — treat any environment where trusted and untrusted workloads share one NAT table (multi-tenant Hyper-V hosts, Docker/K8s nodes running mixed-trust containers, shared cloud NAT gateways) as still exposed to the three CVE-less primitives. natjack.io additionally recommends disabling nf_conntrack_tcp_loose and equivalent permissive connection-tracking modes, and monitoring NAT-table utilization for anomalous growth as a detection signal — this is a genuine, vendor-neutral hunt/hardening lever, not filler advice. No public exploit tool or PoC code release was found in the sources reviewed (natjack.io publishes demonstration screenshots, not a public exploit); Microsoft's own quoted characterization ("the PoC, however, can target the entire ephemeral port range in a matter of seconds") indicates the underlying PoC used in vendor engagement is fast and comprehensive even though it was not released publicly in the sources checked.

