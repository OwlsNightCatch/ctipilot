  # ITEM 3 — Rapid7 / CVE-2026-66066 Metasploit module
  # ============================================================
  - title: "Rapid7 ships a public Metasploit module and its own end-to-end reproduction of CVE-2026-66066 (Rails Active Storage libvips/libmatio chain) — its own weaponization, NOT a claim of observed in-the-wild exploitation"
    sources:
      - { url: "https://www.rapid7.com/blog/post/ra-kindarails2shell-technical-analysis-cve-2026-66066", publisher: "Rapid7", date: "2026-08-03", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails/", publisher: "Rapid7 (Emergent Threat Response tracker)", date: "2026-07-30 (updated 2026-08-03)", role: "primary" }
      - { url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm", publisher: "GitHub Security Advisory (Rails project)", date: "2026-07-31", role: "corroborating" }
    discovery_trace: >-
      first seen at: state/coverage_backlog.md (surfaced by 2026-08-09T1315Z-audit)
      → re-fetch: Rapid7, URL https://www.rapid7.com/blog/post/ra-kindarails2shell-technical-analysis-cve-2026-66066 (technical-analysis post, 2026-08-03)
      → pivot: Rapid7 ETR tracker, URL https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails/ (the linked exploitation-status tracking post)
      → corroboration: GitHub Security Advisory, URL https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm ; NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-66066
    summary: |
      CORRECTION TO THE BACKLOG FRAMING: the backlog item describes this as "Rapid7 confirms active exploitation" — direct re-fetch of both Rapid7 posts, including a raw-body search for every occurrence of "wild", "exploited" and "scanning" across the full technical-analysis post, found ZERO claim of in-the-wild exploitation anywhere. Rapid7's own exploitation-status tracker states explicitly: "As of July 30, 2026, Rapid7 is not aware of exploitation in the wild." That tracker's only subsequent update (Update #1, 2026-07-31) records that Rails itself published technical details and forensic tooling early — not that attacker activity was observed. The 2026-08-03 technical-analysis post is Rapid7's OWN reproduction of the previously-withheld attack chain plus its own weaponization: "We reproduced the published chain against Rails 6.0.6.1, 6.1.7.10, 7.2.3.1, 8.0.5, and 8.1.3, and confirmed that patched 7.2.3.2, 8.0.5.1, and 8.1.3.1 targets block the crafted representation," and "Our Metasploit module follows the representation-based chain described above. It creates crafted direct-upload blobs, confirms the file read against /proc/version, recovers and validates Rails signing material, signs an ImageProcessing variation, and triggers either send/spawn for command payloads or send/eval for native Ruby payloads." No honeypot, scanning, or attacker-side telemetry is cited by either post.
      The technical chain (per NVD and Rapid7, corroborating): Active Storage, when configured to use the Vips image processor for untrusted uploads, does not disable libvips operations marked unsafe for untrusted content. libvips selects its `matload` decoder purely from a file beginning with the string "MATLAB 5.0" — a genuine MAT 7.3 file instead begins "MATLAB 7.3 MAT-file" and fails this check, so a crafted file can pass itself off as a legitimate MAT/HDF5 container to libvips while carrying a MAT 7.3 version tag libmatio reads from bytes 124–125. libmatio then follows an HDF5 "External Storage" dataset reference containing an attacker-chosen file path and byte offset, copying arbitrary local file bytes into the MAT variable buffer; those bytes are returned to the requester rendered as PNG pixel data. Recovering Rails' `secret_key_base` or other signing material through this arbitrary-file-read primitive escalates to remote code execution without a Marshal deserialization gadget — Rapid7 states it validated the chain "against Rails 8.0.5 configured with config.active_support.message_serializer = :json," i.e. the RCE path works even against Rails' safer JSON-based session/message serializer. Affected: Active Storage < 7.2.3.2, >= 8.0 < 8.0.5.1, and >= 8.1 < 8.1.3.1 (matches NVD's fix-version statement exactly). CVSS v4.0 base score 9.5 (Critical) per NVD/GHSA.
    region_nexus: "global; any Rails deployment accepting untrusted image uploads with libvips/Vips configured, including EU/CH public-sector web applications"
