  # ITEM 4 — CVE-2026-33824 root cause (0patch / ikeext.dll)
  # ============================================================
  - title: "0patch's root-cause writeup: CVE-2026-33824 is a pre-authentication double free in ikeext.dll's IKEv2 fragment-reassembly path (IkeReinjectReassembledPacket), reachable on UDP 500/4500 against any host acting as an IKEv2 responder"
    sources:
      - { url: "https://0patch.com/blog/micropatches-released-for-windows-ike-service-extensions", publisher: "0patch (ACROS Security)", date: "2026-08-05", role: "primary — single-source for the root-cause analysis" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-33824", publisher: "Microsoft Security Response Center", date: "2026-04-14 (initial); revision current as fetched", role: "corroborating — confirms the CVE, CWE-415 Double Free classification, CVSS, affected products and patch date; does NOT corroborate 0patch's specific function-level (ikeext.dll / IkeReinjectReassembledPacket) analysis" }
    discovery_trace: >-
      first seen at: state/coverage_backlog.md (surfaced by 2026-08-10T0110Z-weekly)
      → re-fetch: 0patch blog, URL https://0patch.com/blog/micropatches-released-for-windows-ike-service-extensions
      → corroboration: MSRC structured record for CVE-2026-33824 (fetched via tools/fetch_source.py msrc cve CVE-2026-33824, human-facing page https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-33824 ) and the April 2026 MSRC CVRF release document (affected-products enumeration)
      → verification: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-33824
    summary: |
      0patch (ACROS Security) published a root-cause analysis on 2026-08-05 stating CVE-2026-33824 is "a pre-authentication double free in ikeext.dll, the module behind the 'IKE and AuthIP IPsec Keying Modules' service, which runs as Local System inside a svchost.exe. The flaw is in function IkeReinjectReassembledPacket, on the IKEv2 fragment reassembly path. An unauthenticated attacker who can reach UDP 500/4500 on a host that acts as an IKEv2 responder can free the same heap block twice, resulting in potentially exploitable memory corruption." 0patch states it recreated a working proof-of-concept "from the official patch" (i.e., by diffing Microsoft's fix) in order to build micropatches for Windows versions that are past end-of-support and no longer receive official updates from Microsoft (its demonstration used "a vulnerable Windows 11 computer... [with] the IKEv2 responder enabled" attacked by a second host running the PoC).
      Microsoft's own MSRC record (fetched directly via the structured API, since the human-facing page is a JS-only SPA that returns no content to a plain fetch) independently corroborates: the CVE was released 2026-04-14 as part of April 2026 Patch Tuesday, classified CWE-415 Double Free (matching 0patch's double-free claim, though MSRC does not name the specific function or DLL), CVSS 3.1 base score 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H — network vector, low complexity, no privileges or user interaction required), with "Exploited: No" and "Publicly Disclosed: No" recorded as of the fetched revision. Microsoft's own FAQ states: "An unauthenticated attacker could send specially crafted packets to a Windows machine with Internet Key Exchange (IKE) version 2 enabled, which could enable remote code execution" — confirming the flaw requires the host to have IKEv2 enabled/configured as a responder, not that every Windows host is reachable by default; Microsoft's stated mitigation (for those who cannot immediately patch) is to block inbound UDP 500/4500 for systems not using IKE, or restrict it to known peer addresses for systems that require it. The MSRC CVRF affected-products list (retrieved via the structured API) spans Windows Server 2016 through Windows Server 2025 and Windows 10 version 1607 through Windows 11 version 26H1 — i.e., essentially every supported Windows client and server release at the time of the April 2026 patch.
      This directly closes the evidence gap flagged in this pipeline's tracked entry 2026-08-02/unit42-autonomous-campaign-confirmed-impact-was-understated, which recorded CVE-2026-33824 as one of four CVEs the autonomous-AI intrusion campaign actually exploited, described there only as "callbacks from three IKE VPN endpoints" with no root-cause detail.
