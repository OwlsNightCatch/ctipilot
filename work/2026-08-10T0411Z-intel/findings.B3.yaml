        source_url: "https://www.rapid7.com/blog/post/ra-kindarails2shell-technical-analysis-cve-2026-66066"
      - quote: |
          Action Pack is a framework for handling and responding to web requests. In versions prior to 7.2.3.2, 8.0.5.1 and 8.1.3.1, Active Storage does not disable libvips operations marked unsafe for untrusted content, allowing a crafted upload to invoke such an operation.
        attribution: "NVD (CVE-2026-66066 description, sourced from the GitHub Security Advisory)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-66066"
    extended_notes: |
      This is the single most important correction in this backlog batch: the surfacing fire's framing ("Rapid7 confirms active exploitation") is NOT supported by either Rapid7 source. Compose this as vendor-side weaponization (public Metasploit module + full reproduction across five Rails version lines) raising the imminent-exploitation risk — the CVE now has a public, automatable exploit chain and no authentication/user-interaction prerequisite — but do NOT state or imply confirmed attacker activity. Recommend priority "high" (consistent with the 2026-08-02 predecessor entry), not "critical", absent an ITW claim. Detection angle: application logs recording direct-upload blob creation followed immediately by a variant/representation request for the same blob within one session, especially where the uploaded content-type claims image/png but the byte-124-125 MAT-version field is non-zero; outbound reads of unexpected local paths (e.g., /proc/version) via the image-processing pipeline are a strong signal per Rapid7's own PoC methodology.

