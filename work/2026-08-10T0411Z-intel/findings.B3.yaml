      - { url: "https://thehackernews.com/2026/08/over-4400-rockwell-plcs-exposed-online.html", publisher: "The Hacker News", date: "2026-08-06", role: "corroborating" }
    discovery_trace: >-
      first seen at: state/coverage_backlog.md (surfaced by 2026-08-10T0110Z-weekly, citing thehackernews.com relay of Forescout, and nextgov.com relay of a CISA Black Hat briefing)
      → WebSearch ("Forescout research Rockwell PLC 4407 exposed EtherNet/IP water utility") located the Forescout post directly
      → re-fetch: Forescout, URL https://www.forescout.com/blog/ot-security-analysis-exposed-devices-attacked-in-us-water-systems/ (primary reached directly — the relay is no longer necessary)
      → re-fetch: Nextgov/FCW, URL https://www.nextgov.com/cybersecurity/2026/08/cisa-still-finds-water-system-controls-exposed-online-amid-multistate-hacks/415266/ (primary reached directly for the CISA quote)
      → corroboration: The Hacker News, URL https://thehackernews.com/2026/08/over-4400-rockwell-plcs-exposed-online.html
    summary: |
      Both figures the backlog item flagged as relayed were reached directly in this run — the relay outlets are corroboration, not the primary, going forward. Forescout's own blog post (2026-08-05) states it queried Shodan on 2026-08-03 and "returns 4,407 devices exposing port 44818" (the EtherNet/IP engineering protocol used by Rockwell Automation/Allen-Bradley controllers, including the MicroLogix 1100/1400 families the FBI/EPA advisory names for the water-utility campaign), with "the vast majority (65%) ... located in the U.S., followed by Canada (12%) and Spain (3%)" — 65% of 4,407 is consistent with the ~2,844 US figure the relay reporting cited. Forescout states: "We identified 22 located in cities targeted in the current campaign," and "Approximately 86% (19 of 22) hosts observed in the affected cities were susceptible to this CVE [CVE-2017-16740] based on firmware versions." Forescout explicitly caveats exploitation: "we cannot confirm these particular assets were compromised in this campaign." On the exposure mechanism, Forescout states "exposing EtherNet/IP to the internet creates an unauthenticated path" — standard-mode CIP over port 44818 accepts connections without authentication, letting a remote party identify a controller or, depending on device configuration, write settings to it. CVE-2017-16740 is a stack-based buffer overflow in Rockwell Automation Allen-Bradley MicroLogix 1400 Controllers Series B/C, firmware 21.002 and earlier, that "may allow remote code execution" (NVD); it is not itself confirmed as the campaign's entry point — Forescout frames it purely as a maintenance/patch-currency signal on already-exposed, already-targeted devices, not as the exploited vulnerability.
      CISA Acting Director Nick Andersen, speaking on the sidelines of the Black Hat conference on 2026-08-06 (per Nextgov/FCW, which conducted the interview), said: "We're seeing things like [programmable logic controllers] that are open and accessible on the internet with either no password set or default password set," and, asked about actor attribution: "For us, we're not doing anything with attribution right now." Andersen's guidance to affected utilities was blunt: "Get your operational technology off the internet, set a password." Nextgov reports the wider campaign now spans "around 12 states," with "more than 30 community water systems in Minnesota" affected — consistent with this pipeline's already-tracked incident record.
