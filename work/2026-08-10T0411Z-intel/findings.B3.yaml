    summary: |
      Żabka, Poland's largest convenience-store franchise chain, has confirmed — in a same-day written statement its press office gave to niebezpiecznik.pl, reproduced in near-identical wording by sekurak.pl, RMF FM and cyberdefence24.pl — that it detected unauthorized access to "selected technical resources supporting information exchange between the franchisor and franchisees" at the end of the week before 2026-08-03. Żabka states the access occurred "through the use of an external service provider's account," was detected and immediately blocked per its security procedures, and that "to our current knowledge, the perpetrator gained access to the ticketing system [Jira]." Żabka states transaction data, consumer services and the "Żappka" loyalty-app data's confidentiality "remain unaffected," and that it has referred the matter to its own Data Protection Officer, to Poland's data-protection regulator (UODO) and to specialized law-enforcement agencies (per RMF FM, also to CERT Polska). Żabka explicitly declines to name the compromised supplier or comment on the perpetrator's identity ("we do not comment on details of the ongoing proceedings, including matters relating to the perpetrator").
      What Żabka has NOT confirmed is the deeper technical scope. A seller on a cybercrime forum listed a data package for 5,000 EUR on 2026-08-02, and niebezpiecznik.pl frames its entire itemized breakdown of that listing explicitly as "if we are to believe the attacker" ("jeśli wierzyć atakującemu"): ~541,000 Jira issues across 48 projects (including partner-domain accounts from Accenture, Netguru, Onwelo, BlueSoft and Sygeon), 229,734 IT/service-desk tickets referencing internal systems (POS "Nowa Kasa", sales system ZSS, warehouse/ordering platforms Cyberstore and zMarket, SAP ERP+MDG, a Lotto integration), source code and IaC from 89 GitLab repositories (~11,700 files; Terraform, Kubernetes Helm charts, ArgoCD), and — separately claimed — live production access material: a single GitLab Personal Access Token the seller says was reused across all 89 repository dumps, Solace messaging-broker credentials, MongoDB admin passwords, hardcoded .env tokens, and Azure/AKS infrastructure mapping (16 production database clusters, Istio service mesh, SSH access patterns to individual store servers). Niebezpiecznik.pl's own editorial framing of the initial-access-to-lateral-movement mechanism is explicitly speculative — its own words are "we guess (Zgadujemy) that the attacker used information placed in Jira such as tokens/passwords/test accounts to get into subsequent systems" — not a confirmed forensic finding by either the outlet or the company. The attacker's access, per the leaked sample, extended to 2026-07-29, two days before Żabka's pending 100%-stake sale to Circle K/Couche-Tard was publicly announced; several outlets note the timing but no source confirms a link between the two events.
