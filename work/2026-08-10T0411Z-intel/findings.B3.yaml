    summary: |
      Connor Riley Moucka, 26, of Kitchener, Ontario, pleaded guilty on 2026-08-05 to a four-count federal indictment (computer fraud, wire fraud, aggravated identity theft, and a related conspiracy count) arising from a February–October 2024 hacking-and-extortion campaign. Mandiant tracks the cluster as UNC5537; Moucka's own operational aliases, per KrebsOnSecurity, were principally "Judische" and "Waifu." DOJ's press release states the conspiracy compromised "over 165 victim organizations," stole "billions of sensitive customer records," and that the conspirators personally profited by at least $495,000, with the co-conspirators collectively "receiving over $2.5 million in ransom payments" — DOJ states victim companies suffered "over $9.5 million in actual losses," a figure DOJ says excludes harm to those companies' own customers, "totaling at least 100 million individuals." DOJ names no specific victim provider anywhere in the release, describing it only as "a U.S.-based software-as-a-service company." Sentencing is scheduled for 2026-10-27; the aggravated-identity-theft count carries a mandatory minimum of two years, with a statutory maximum of 30 years on the remaining counts.
      Two material facts the surfacing backlog item flagged as at-risk of misattribution are confirmed here by direct re-fetch: (1) the words "multi-factor," "MFA" and "Snowflake" do NOT appear anywhere in the DOJ release — that reporting is entirely KrebsOnSecurity's. Krebs states plainly: "The hackers targeted stolen credentials for Snowflake customer accounts that did not enforce multi-factor authentication," and separately that "Snowflake responded to the data thefts by increasing password complexity requirements and enforcing multi-factor authentication." (2) DOJ names no co-conspirators; Krebs identifies Cameron "Kiberphant0m" Wagenius, a U.S. Army soldier who pleaded guilty in July 2025 to extorting AT&T and Verizon and who is separately scheduled to be sentenced on 2026-09-03, and a third alleged (not yet convicted, per Krebs) co-conspirator, John Erin Binns ("IRDev"/"IntelSecrets"), tied to the 2021 T-Mobile breach and reported to have recently obtained Turkish citizenship after release from a Turkish prison. The entire access path described by both sources is credential-based against SaaS-tenant accounts that lacked MFA — no vulnerability in the provider's own systems is alleged by either source.
