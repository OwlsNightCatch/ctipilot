  # ============================================================
  - title: "Forescout's own count: 4,407 internet-facing Rockwell PLCs found worldwide on 2026-08-03, 19 of 22 in already-attacked water-utility cities running CVE-2017-16740-susceptible firmware; CISA's Nick Andersen says exposed devices had no password or a default one"
    sources:
      - { url: "https://www.forescout.com/blog/ot-security-analysis-exposed-devices-attacked-in-us-water-systems/", publisher: "Forescout", date: "2026-08-05", role: "primary" }
