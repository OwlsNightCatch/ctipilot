    discovery_trace: "first seen at: ransomware.live (rotation-priority source, watchlist_duty sweep of leak-site claims), URL https://www.ransomware.live/api/v2/recentvictims (via https://api.ransomware.live/v2/recentvictims JSON mirror) → attempted corroboration via WebSearch (\"Université Libre de Bruxelles cyberattaque Qilin\", \"ULB cyberattaque piratage août 2026\") → only hit was a dead/404 smartdata.ch link and a 2020 unrelated ULB incident (RTBF); no live independent source found → no primary beyond the leak-site listing itself"
    summary: |
      Ransomware.live recorded on 2026-08-09T10:59Z that the Qilin ransomware-as-a-service
      operation added Université libre de Bruxelles (ULB), a major Belgian public university,
      to its extortion leak site, tagged under the "Education" activity category. No ransom
      amount, no data sample, and no description of the intrusion mechanism accompanies the
      listing. ULB has issued no public statement; the Belgian Centre for Cybersecurity (CCB)
      has not published an advisory referencing this claim; and no independent journalism
      (Belgian French/Dutch-language press, wire services) could be found corroborating the
      claim despite a targeted search. The only other ULB cyberattack in searchable reporting
      is an unrelated, already-resolved 2020 incident. Qilin is a high-volume RaaS operation
      already active against French and Belgian targets in this reporting window (e.g. Stade
      français, multiple French SMEs), so a further European-education-sector claim is
      plausible on base rate alone, but this specific claim currently rests on a single
      leak-site tracker (Admiralty C) with zero corroboration.
    region_nexus: "Belgium (EU) — public university, if the claim is accurate"
