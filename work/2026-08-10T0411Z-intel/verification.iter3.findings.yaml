  item: "2026-08-10/linux-bridge-stp-timer-uaf-no-cve-public-exploit"
  url_or_quote: "\"found by two researchers independently during its TyphoonPWN 2026 competition\""
  summary: "The cited SSD advisory (fetched this iteration, title 'Linux Bridge STP Timer Use-After-Free', datePublished 2026-08-05) says under Credit: 'Two independent security researchers, n132 and sven sze, submitted this during our TyphoonPWN 2026 and won second place in the Linux PE category.' That is one joint submission by two unaffiliated researchers, not independent co-discovery — a materially different claim, since independent rediscovery is a standard exploitation-likelihood signal. The entry's own summary gets it right ('submitted by two researchers'); only the body sentence overstates."
