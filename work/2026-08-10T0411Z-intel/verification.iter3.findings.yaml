  item: "2026-08-10/retelit-qilin-italian-telco-cloud-operator-public-sector"
  url_or_quote: "\"The listing first appeared on 11 July and a document-and-passport sample followed on 14 July — corroborated independently the next day by an Italian trade outlet reporting the listing with no company confirmation at that point ([Bismark.it, 2026-07-12])\""
  summary: "Two problems in one clause, both against sources fetched this iteration. (a) 'the next day' sits immediately after '14 July' and therefore reads as 15 July, while the cited Bismark article's own article:published_time / datePublished is 2026-07-12T05:54:09+00:00 — the day after the 11 July listing, not after the 14 July sample. (b) The clause casts Bismark as corroborating IrpiMedia, but the cited primary states the opposite order: 'A quasi due mesi dalla scoperta dell'attacco, riportato la prima volta dal blog di settore Bismark' — Bismark reported it first. Fix: state the date explicitly ('first reported by an Italian trade outlet on 12 July, the day after the listing appeared') rather than a relative day."
