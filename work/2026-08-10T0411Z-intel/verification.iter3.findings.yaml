  item: "2026-08-10/pam-rootok-identity-shuffle-as-anti-forensics-xmrig"
  url_or_quote: "\"if SOC analysts only remediated the root compromise, the botnet implant would simply regenerate.\""
  summary: "Body quote truncated mid-sentence with a fabricated full stop, dropping the clause that names the mechanism. Group-IB's sentence (verified against the run's own capture and the fetched page) reads '... the botnet implant would simply regenerate from the shadowed accounts.' The entry's own evidence[] record honestly stops at 'regenerate from', so frontmatter and body disagree. Same defect class the run record says it repaired for the Forescout and CISA quotes. Milder second instance in the same entry: '\"transitions into a fileless state, running entirely from memory.\"' drops the source's trailing '(RAM)' and re-punctuates. Fix both by extending the quotes or cutting outside the quotation marks."
