  item: "2026-08-10/retelit-qilin-italian-telco-cloud-operator-public-sector"
  url_or_quote: "\"Retelit says it informed affected customers promptly, which is compatible with the public silence\""
  summary: "The entry's sharpest tier conflict is unsurfaced. Retelit's right-of-reply says it 'ha prontamente informato i clienti impattati'; the same cited primary reports the opposite from the customer side in its 6 August update: 'In seguito alla comunicazione diramata dal Cert Agid alla fine di luglio, numerosi clienti riferiscono di aver scritto a Retelit per chiedere come mai non fosse arrivata alcuna comunicazione in seguito al data breach' — numerous customers say no notification reached them until CERT-AGID's late-July message prompted them to ask. The takeaway's first defender question is built on the uncontested reading of Retelit's claim. An entry whose whole discipline is keeping four claim tiers apart must show this contradiction rather than resolve it silently."
