    summary: |
      Intrinsec's "Enterprise LLM Threat Atlas" (published 2026-07-30) is an architecture-agnostic threat model for
      enterprise LLM deployments covering two deployment shapes: "Self-hosted/internal LLM applications (customer
      owns app, infrastructure, integrations)" and "LLM functionality embedded into SaaS products (customer controls
      configuration, access, and governance)." Its framing thesis: "The dominant near-term risk is not 'model
      hacking' in isolation, but LLMs acting as a high-bandwidth interface to enterprise data and actions."
      Six threat patterns are named as the most common/impactful: indirect prompt injection via RAG/copilot-retrieved
      enterprise content; over-permissioned connectors/copilots enabling rapid post-compromise data discovery;
      tool/agent abuse (the model triggering real-world actions — tickets, emails, sharing links, cloud operations —
      without robust policy gating); RAG/knowledge-base poisoning; operational data leakage through logs/transcripts/
      analytics; and supply-chain/platform risk in self-hosted stacks (models, containers, inference servers,
      dependencies).
      The stated risk ranking and its basis: "Tool/Agent abuse and supply-chain attacks seem to be the most important
      current risks for enterprise LLM infrastructure. Indeed, it is in those two domains that we found the highest
      number of public reports – either real-world incidents or research cases." This is Intrinsec's own editorial
      count of public reporting volume, not a quantified figure (no specific count is given on the landing page —
      the full PDF may quantify this but could not be rendered in this environment) and not a claim independently
      verified elsewhere in this fetch.
      Mapping methodology: "A ATLAS MITRE + ATT&CK MITRE mapping approach (ATLAS for AI-native techniques; ATT&CK for
      the surrounding intrusion lifecycle)" — i.e. MITRE ATLAS covers the AI/ML-specific technique layer (prompt
      injection, model manipulation, etc.) while ATT&CK Enterprise covers the conventional intrusion lifecycle
      wrapped around it (initial access, persistence, exfiltration). The report also includes "a control baseline
      (Prevent/Detect/Respond) for self-hosted and SaaS-embedded LLMs" and "a monitoring and incident response
      appendix." No periodicity statement (annual/quarterly/volume/first-edition) appears anywhere in the fetched
      landing-page text — this does not read as a recurring/dated series and should NOT be tagged "ANNUAL REPORT."
    region_nexus: "global — architecture-agnostic threat model, not region-specific"
    primary_sector_nexus: "indirect — applies to any organisation deploying enterprise LLM functionality, self-hosted or SaaS-embedded, including this deployment's own constituency"
