      - quote: "Immediately after establishing this mutex, the malware performs a self-unlink operation. By deleting its own binary file from the disk while the process remains active, the malware transitions into a fileless state, running entirely from memory (RAM)."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/"
      - quote: "Alerts should be triggered immediately if root is observed rapidly transitioning into standard user accounts (USER_START events associated with pam_rootok)."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/"
    extended_notes: |
      ATT&CK mapping rationale (built by this sub-agent from the source's stated mechanics, cross-checked against
      the pipeline's pinned attack/enterprise-attack.json): T1199 Trusted Relationship (source's own "trusted
      third-party relationship" framing for initial access); T1556.003 Modify Authentication Process: Pluggable
      Authentication Modules (the pam_rootok abuse itself — an unambiguous, precise fit not explicitly cited by
      Group-IB but directly matching their described mechanism); T1685.006 Disable or Modify Tools: Clear Linux or
      Mac System Logs (the log-suppression/auth-log-tampering behaviour — note the ATT&CK id Group-IB's own
      readership might expect, T1070.002, is REVOKED in the current ATT&CK release and superseded by T1685.006,
      which we use instead); T1053.003 Scheduled Task/Job: Cron (redundant cronjob persistence across shadowed
      accounts); T1027.011 Obfuscated Files or Information: Fileless Storage (self-unlink into memory-resident
      execution); T1036.005 Masquerading: Match Legitimate Resource Name or Location (the -h flag spoofing the
      process name as "ssh" in ps/top/proc/comm). Group-IB's own cited id, T1564.013, is included above per the
      source's explicit statement but flagged: in the pinned dataset it names "Bind Mounts" specifically, not a
      generic "Hide Artifacts" — worth the composer either omitting it or keeping it as a source-attributed
      citation with the mismatch noted, rather than treating it as this sub-agent's own confirmed mapping.
      Detection/hunt hooks stated by Group-IB itself (Recommendations section): monitor /var/log/secure and
      audit.log for "USER_START events associated with pam_rootok" where root rapidly transitions into standard
      user accounts; treat unexplained stops/modifications of rsyslog/auditd as a signal and forward logs to an
      external tamper-proof SIEM in real time; hunt for the transient /tmp/.lock mutex file as a memory-forensics
      starting point once the on-disk binary has self-deleted.
      Custom CLI surface (behavioural, not IOC): the implant replaces XMRig's standard argument parser with flags
      including -lan (hardcoded LAN pool IP, bypassing DNS sinkholes), -h <name> (process masquerading), -c
      (disables the implant's default auto-cron-install behaviour), -k (forces max hashrate, no CPU yielding), and
      -dp (combined static-IP + custom-port shorthand) — the existence of a "disable auto-cronjob" flag confirms
      cron-based self-installation is the implant's default behaviour, reinforcing the redundant-persistence design
      intent described above.
      Triage-relevant benign lookalike: root-to-standard-user `su` transitions are routine on any multi-admin Linux
      estate (e.g. `su - appuser` for maintenance); the Group-IB-cited discriminator is not the su call itself but
      its volume/pattern (rapid, repeated transitions into multiple, normally-unused or unmonitored standard
      accounts, each followed by new cron entries) rather than an occasional single admin's own account.

