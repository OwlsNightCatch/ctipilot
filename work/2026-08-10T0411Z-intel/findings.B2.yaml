  - title: "GOLD EMBRACE / Interlock weaponise Volatility3 and WinPmem for offline credential extraction after a ClickFix foothold"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/", publisher: "Sophos X-Ops / Emergency Incident Response (EIR)", date: "2026-08-07", role: primary }
      - { url: "https://www.sophos.com/en-us/threat-profiles/gold-embrace", publisher: "Sophos Counter Threat Unit (CTU) — threat profile", date: "2026-08-07", role: corroborating }
    discovery_trace: "first seen at: state/coverage_backlog.md (surfaced by 2026-08-09T1315Z-audit) → primary: Sophos X-Ops, URL https://www.sophos.com/en-us/blog/2608-volatility-interlock/ → corroborating: Sophos CTU threat profile, URL https://www.sophos.com/en-us/threat-profiles/gold-embrace (re-fetched in full this run via python3 tools/fetch_source.py url for both pages; quotes below are literal-checked against the raw fetched body)"
    summary: |
      Sophos's Emergency Incident Response team investigated a March 2026 Interlock intrusion (published 2026-08-07)
      in which the ransomware operator ran the legitimate memory-forensics tool Volatility3 and the legitimate
      physical-memory acquisition tool WinPmem directly against a live endpoint to harvest credentials, in place of a
      commodity dumper such as Mimikatz. On "Patient Zero" (a Defender-managed Windows 10 host that, per Sophos,
      turned out not to be running any endpoint protection at all), the actor first captured a full physical-memory
      image with `winpmem_mini_x64_rc2.exe mem.raw`, then ran Volatility3's Windows plugins offline against that
      image: `vol.exe -f .\mem.raw windows.hashdump.Hashdump` (NTLM/LM hash and account extraction from the SAM/SYSTEM
      hive structures resident in memory) and `vol.exe -f .\mem.raw windows.cachedump.Cachedump` (cached domain
      credential extraction). Sophos states plainly that adversarial use of these tools "would leave similar traces"
      to legitimate DFIR/security-assessment/malware-analysis use of the same commands, and that the only reason they
      could call this one hostile is that "the customer knew of no legitimate Volatility3 use on their system" —
      i.e. the discriminator is entirely environmental (was this authorized?), not technical (the artefact looks
      identical either way).
      Initial access was a ClickFix lure served from a compromised, otherwise-reputable web page reached via a ChatGPT
      search result; the user pasted an attacker-supplied command into the Windows Run dialog, which used a
      wildcard-obfuscated PowerShell invocation to pull a RAT payload and install it for persistence. Interlock then
      spent roughly 26 hours moving from that single endpoint to full domain-controller compromise — including LDAP
      domain-group discovery, a Kerberoasting SPN query, an NTLM-downgrade RDP logon to the DC using a compromised
      domain-admin account, and node.exe-based persistence deployed via `schtasks.exe` under a name masquerading as a
      Windows Defrag scheduled task — before dumping AWS credentials, adding new domain-admin accounts, tampering with
      Defender, exfiltrating data, and locking the customer out of its hypervisors.
      Sophos's own threat-profile page states the naming relationship without hedging: "GOLD EMBRACE is a financially
      motivated cybercriminal threat group operating the Interlock double extortion ransomware, first observed in late
      September 2024." GOLD EMBRACE is Sophos CTU's internal tracking designation for the same actor publicly known
      as Interlock — not a distinct group and not a partner/affiliate relationship. Sophos separately notes Interlock
      exploited CVE-2026-20131 (a critical Cisco Secure Firewall Management Center insecure-deserialization RCE,
      publicly disclosed and KEV-listed in March 2026) roughly two weeks before Cisco's own disclosure — background
      context on the actor's broader access-vector portfolio, not part of this finding's core Volatility3/WinPmem
      tradecraft.
    region_nexus: "direct — Sophos's own threat profile states GOLD EMBRACE/Interlock 'targets organizations across North America and Europe'"
    primary_sector_nexus: "direct — sectors named are healthcare, government (public-sector), education and manufacturing"
    sector: "healthcare, public-sector, education, manufacturing"
    cves: ["CVE-2026-20131"]
    techniques: [T1189, T1547.001, T1069.002, T1055.002, T1134.003, T1558.003, T1021.001, T1053.005, T1003.002, T1003.005]
    affected_products: ["Volatility3", "WinPmem", "Cisco Secure Firewall Management Center Software"]
