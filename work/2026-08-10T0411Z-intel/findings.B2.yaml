        source_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
      - quote: "When resolving imports, each DLL is loaded via RtlQueueWorkItem with LoadLibraryW and the DLL name as arguments to evade EDRs since LoadLibraryW calls from unbacked executable memory regions are considered highly suspicious by EDRs."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
      - quote: "the new campaign we identified in July 2026 highlights a notable expansion of operations to target the Middle East with a key focus on the energy vertical."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
      - quote: "the threat actor consistently reused the Tucows domain registrar to register C2 domains, as well as Njalla name servers, and infrastructure hosted on ASN 14956."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
      - quote: "BINDCLOAK is a 64-bit modular backdoor written in C++ that uses a complex message routing mechanism to manage the C2 communication channel."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
    extended_notes: |
      Full MITRE ATT&CK table as published by Zscaler for BINDCLOAK specifically (distinct from Part 1's TELESHIM/
      MIXEDKEY mapping already in the published entry): T1134.001 (Token Impersonation/Theft — "BINDCLOAK can
      escalate privileges for modules by abusing collected user and process tokens"), T1134.003 (Make and
      Impersonate Token — "BINDCLOAK can abuse user tokens collected from authenticated with provided credentials"),
      T1620 (Reflective Code Loading — "BINDCLOAK loads plugin module DLLs via reflective DLL loading"), T1057
      (Process Discovery — "BINDCLOAK collects information about running processes and associated user and token"),
      T1132.002 (Non-Standard Encoding — "BINDCLOAK uses two layers of XOR encoding for C2 communication"), T1095
      (Non-Application Layer Protocol — "BINDCLOAK uses TLS over TCP for C2 communication").
      Host-identifier mechanism: "Adds up the ASCII values of all the wide characters of the computer name and adds
      this sum to the volume serial number to generate a unique identifier for the host" via GetComputerNameW and
      GetVolumeInformation for C:\ — a 4-byte ID embedded in every C2 message, not itself a decryption key (that role
      belongs to the volume-serial-derived key documented for the BINDCLOAK payload in Part 1), but useful as a
      detection/hunt correlator if extracted from memory during response.
      Command taxonomy (11 total, source-named): Token commands — COLLECT_USER_TOKEN (LogonUserW-based credential
      capture, 712-byte domain/username/password blob), CLEANUP_USER_TOKENS, GET_STATUS (WTSEnumerateProcessesW +
      LookupAccountSidW + OpenProcessToken flag checks — reconnaissance for which processes' tokens are worth
      stealing). General module commands — START_MODULE_WITH_USER_TOKEN / START_MODULE_WITH_PROCESS_TOKEN (via
      DuplicateTokenEx with TOKEN_ASSIGN_PRIMARY), STOP_MODULE, REMOVE_MODULE. Plugin module commands —
      INIT_PLUGIN_MODULE, REMOVE_PLUGIN_MODULE. Misc — SET_THREAD_EXECUTION_STATE, and one command (0x64570) whose
      "intent or purpose... is currently unknown" per Zscaler itself — an honest stated gap worth carrying rather
      than guessing at.
      Beacon message parity with OctLurk, stated directly: "Information gathered from the host machine by BINDCLOAK
      and the structure of the beacon message sent to the C2 server is the same as the OctLurk backdoor" and "This
      C2 message encryption algorithm is the same as the one used by the OctLurk backdoor... Although this XOR key
      is different from the key used in the OctLurk backdoor, there is a high-level of similarity between the keys"
      — shared algorithm/structure with a swapped-but-similarly-styled key is itself part of the code-overlap basis
      for the high-confidence variant call.
      Zscaler's own coverage statement (no independent detection specifics beyond product-name signature):
      "Win64.Backdoor.BINDCLOAK" and "Zscaler's multilayered cloud security platform detects indicators related to
      this campaign at various levels" — thin as a defender takeaway; the RtlQueueWorkItem-masked LoadLibraryW
      pattern and the reflective-loading DOS-header zeroing are the concrete hunt hooks this item should carry
      instead (EDR telemetry for LoadLibraryW calls originating from work-item queue callbacks executing against
      unbacked/RWX memory regions, and PE loaders whose DOS header fields don't match a normal on-disk file).

  - title: "Group-IB: an XMRig botnet operator weaponises pam_rootok to impersonate low-privileged users as a deliberate forensic smokescreen, after trusted-third-party initial access"
    sources:
      - { url: "https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/", publisher: "Group-IB (Digital Forensics & Incident Response team)", date: "2026-07-30", role: primary }
    discovery_trace: "first seen at: state/coverage_backlog.md (surfaced by 2026-08-03T0110Z-weekly) → WebSearch (\"Group-IB pam_rootok anti-forensics blog\") → primary: Group-IB, URL https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/ (fetched in full this run via python3 tools/fetch_source.py url — direct transport succeeded, no jina fallback needed; quotes below are literal-checked against the raw fetched body, including the full Technical Walkthrough and Recommendations sections)"
    summary: |
      Group-IB's DFIR team documents a May 2026 covert Monero-mining campaign (published 2026-07-30) whose defining
      feature is not the miner itself but a deliberate anti-forensics use of Linux PAM. Initial access came through
      "a trusted third-party relationship, allowing threat actors to traverse from a trusted environment into the
      primary network undetected" using a standard user account, after which the actor escalated to root.
      Rather than operating as root — which Group-IB notes "typically triggers high-severity alerts in any
      organization's Security Operations Center (SOC)" — the actor "weaponized the Linux Pluggable Authentication
      Modules (PAM) architecture. By abusing the pam_rootok policy, the attacker utilized the `su` command to
      seamlessly assume the identities of multiple low-privileged users across the system without requiring their
      passwords." pam_rootok is a legitimate PAM module option that, when configured, tells the `su` auth stack to
      succeed automatically for a caller already running as root without prompting for the target user's password —
      normally a convenience for root-initiated administrative su, here abused deliberately as a lateral/persistence
      primitive rather than an intended admin shortcut. Because the su transitions look like normal
      already-authenticated-as-root activity, the resulting authentication trail to a responder shows root
      switching into a sequence of ordinary low-privileged accounts rather than any single obviously-compromised
      identity — "By distributing their malicious activities and planting redundant cronjob persistence across
      various unmonitored standard accounts, the attackers ensured that if SOC analysts only remediated the root
      compromise, the botnet implant would simply regenerate from the shadowed accounts" (Group-IB's own
      "hydra-like" characterisation).
      Logging suppression compounds this: "By stopping core logging services and tampering with authentication logs,
      the threat actor ensured that their initial privilege escalation and PAM manipulation left a minimal forensic
      footprint on the disk, effectively blinding traditional file-based monitoring." The implant itself is a
      customised, musl-libc-cross-compiled build of open-source XMRig 6.25.0 (hardcoded banner: "PRIVATE VERSION FOR
      BOTNET") that self-unlinks immediately after establishing a /tmp/.lock execution mutex — "By deleting its own
      binary file from the disk while the process remains active, the malware transitions into a fileless state,
      running entirely from memory (RAM)" — plus process-name masquerading (a `-h` flag spoofs the name shown in
      ps/top/proc/comm, e.g. as "ssh") and a Stratum-over-HTTP User-Agent disguised as "Java/Agent". Group-IB
      explicitly maps the evasion set to "MITRE technique T1564.013 (Hide Artifacts)" as their own umbrella label;
      per this pipeline's pinned ATT&CK dataset, T1564.013 currently resolves to the specific sub-technique "Bind
      Mounts", which does not obviously match the self-unlinking/masquerading behaviour described — flagged below
      for the composer rather than silently corrected, alongside a better-fitting unambiguous alternative mapping.
      Binary campaign-tracking strings (XOR keys "I3F0" and "CLIENT") tie the sample to a "V25 (Generation 26)"
      campaign family, per Group-IB's own reverse-engineering.
    region_nexus: "global — no region stated by the source; the PAM anti-forensics technique is transferable to any Linux estate, including this deployment's own"
    primary_sector_nexus: "indirect — no sector named; initial access via a trusted third-party relationship is the transferable supply-chain lesson"
