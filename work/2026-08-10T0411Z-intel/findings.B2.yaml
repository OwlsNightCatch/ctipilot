    summary: |
      CERT Intrinsec (Intrinsec's PRIS-qualified incident-response and digital-forensics team) opened an "AI Agents
      X Digital Forensics" series (Part 3, on Claude Code, followed on 2026-08-07 but is outside this item's scope)
      mapping where autonomous coding-agent CLIs leave forensic artefacts on disk — the same paths a responder needs
      for evidence, and, read the other way, the same paths an attacker with any code-execution foothold on a
      developer or CI workstation would target for credential collection (API keys and OAuth/session tokens sit
      there in cleartext JSON).
      OpenCode (Part 1, 2026-07-27; OpenCode is an open-source CLI/desktop/IDE-extension coding agent by Anomaly
      Innovations Inc.): "A folder used for OpenCode configuration files can be found in: C:\Users\<user>\.config\
      opencode on Windows. In this folder, the file opencode.json is forensically interesting because it stores
      configuration for OpenCode" (external providers, plugins, MCP servers installed). Separately, "A folder used
      by OpenCode to store cached data can be found in: C:\Users\<user>\.local\share\opencode on Windows," containing
      auth.json ("This file contains authentication information such as API keys") and the SQLite database
      opencode.db — "The most valuable artifact... storing sessions, messages, projects, workspaces, etc." Its
      `session` table records per-session model provider, model id, token counts and creation/update timestamps; its
      `part` table holds full message history, distinguishing model responses (a `time` field present) from user
      prompts (no `time` field) by session_id.
      OpenAI Codex CLI (Part 2, 2026-07-31): "All files related to Codex can be found in C:\Users\<user>\.codex\."
      Sub-artefacts: history.jsonl ("The list of user prompts is stored in the file... It contains only user
      messages and not the model response," recording session_id, a timestamp, and the prompt text); config.toml
      (configuration); auth.json ("can be interesting in a digital forensics investigation as it contains
      authentication information such as API keys, access tokens, etc."); models_cache.json (models list); a
      skills\ folder (built-in and installed skills); and a sessions\ tree of per-session rollout-<timestamp>-
      <id>.jsonl files recording user messages, agent responses, and (after every agent response) a token-usage
      summary broken out by input/cached-input/output/reasoning-output tokens plus the model's context-window size.
      Both posts are explicitly framed by Intrinsec as reconstruction tooling for investigators: "investigators can
      decode these remnants to reconstruct the actions undertaken using such tools in modern forensic
      investigations." Neither post states retention/rotation behaviour for these files (no log-rotation, size-cap,
      or expiry statement was found in either post) — an explicit gap, not an assumption.
