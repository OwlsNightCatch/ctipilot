    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "In March 2026, the Sophos Emergency Incident Response (EIR) team investigated an incident in which we observed the use of the legitimate IR memory analysis tool Volatility3 by the ransomware threat actor Interlock."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/"
      - quote: "Interlock, which Sophos Counter Threat Unit (CTU) researchers track as GOLD EMBRACE, emerged in September 2024."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/"
      - quote: "In a legitimate use scenario, use of this command could be expected as part of a DFIR investigation, a security assessment, or malware analysis. However, adversarial use of Volatility3 would leave similar traces. In this situation, the customer knew of no legitimate Volatility3 use on their system."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/"
      - quote: "We found evidence of credential dumping (including AWS credentials), access to sensitive files, addition of new domain-admin accounts, tampering with Defender on the endpoints, and more."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/2608-volatility-interlock/"
      - quote: "GOLD EMBRACE is a financially motivated cybercriminal threat group operating the Interlock double extortion ransomware, first observed in late September 2024. The group targets organizations across North America and Europe, with victims from a range of sectors including healthcare, government, education, and manufacturing."
        attribution: "Sophos Counter Threat Unit"
        source_url: "https://www.sophos.com/en-us/threat-profiles/gold-embrace"
    extended_notes: |
      Full attack-chain diary (Sophos's own ATT&CK labels in brackets, from the article's "Diary of an attack chain"
      section — the 26-hour initial-access-to-DC-compromise interval includes a deliberate 24-hour pause after Day 1
      persistence before the actor resumed):
      - Day 1, T+0s: end-user device reaches a compromised-but-reputable site via a ChatGPT search result for
        Dynamics 365 content [T1189 Drive-by Compromise].
      - T+5s: clipboard contents read via an API call (ClickFix fingerprint) "(that is, five seconds in)".
      - T+13s: user pastes an attacker-supplied command into a Run dialog; a wildcard-obfuscated PowerShell path
        invocation downloads a second-stage PowerShell script via curl from an attacker IP, installing a RAT to run
        at startup.
      - T+25m41s: malicious ASEP registry Run-key persistence installed [T1547.001].
      - Day 2: LDAP domain-group enumeration [T1069.002].
      - Day 2, T+37m29s (relative day counter resets per-day in the source): payload `zoom.txt` executed via a
        trusted Microsoft process, labelled by Sophos as Process Injection: Portable Executable Injection
        [T1055.002] — worth flagging to a verifier as an unusual pairing of PE-injection with a `.txt`-named
        payload; Sophos does not elaborate on the injection mechanics beyond the ATT&CK label.
      - T+58m22s: SPN query indicating a Kerberoasting attack, labelled by Sophos as Access Token Manipulation:
        Make and Impersonate Token [T1134.003] — the behaviour described (TGS request against a valid TGT for a
        privileged SPN) is textbook Kerberoasting [T1558.003], which we add as the more precise unambiguous mapping
        alongside Sophos's own label.
      - T+2h19m39s (Day into lateral movement): RDP lateral move to the domain controller using anonymous login
        and an NTLM downgrade attack [T1021.001].
      - Day 3: using a compromised domain-admin account, `schtasks.exe /create /sc DAILY /tn
        \Microsoft\Windows\Defrag\ScheduledDefrags /tr "...\node-v22.11.0-win-x64\node.exe ...\debug.log" /st 23:30
        /ru system` on a print server — persistence malware `debug.log` executed by a bundled Node.js runtime under a
        scheduled-task name masquerading as a routine Windows Defrag job [T1053.005].
      - Post-Day-3: AWS credential dumping, new domain-admin account creation, Defender tampering, data
        exfiltration, hypervisor lockout/encryption.
      Triage-relevant note the article makes explicitly: Sophos's own Application Control Policy includes
      Volatility, and "customers can choose whether Volatility activity is or is not permitted on their managed
      devices" — i.e. the vendor's own mitigation is allowlisting/environmental context, not signature detection,
      because there is no way to distinguish the artefact itself from legitimate DFIR use.
      windows.hashdump.Hashdump and windows.cachedump.Cachedump are both real, documented Volatility3 plugin names
      (not obfuscated or renamed) — an organisation could hunt for these literal plugin-name strings appearing in
      process command-line telemetry on hosts where no authorized DFIR/IR engagement is running, which is the
      practical form of Sophos's "no legitimate use known" discriminator.
      Cisco context (background only, not part of the core finding): "evidence shows Interlock was making use of the
      CVE-2026-20131 Cisco zero-day a full two weeks before Cisco acknowledged it" — this CVE was already publicly
      disclosed and KEV-listed in March 2026, well outside this run's window; carried here only as actor-profile
      context, not as a fresh vulnerability item.

  - title: "CrowdStrike catalogues 21 command-obfuscation techniques (six classes) viable inside VMware ESXi's minimal BusyBox ash shell"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/", publisher: "CrowdStrike", date: "2026-08-07", role: primary }
    discovery_trace: "first seen at: state/coverage_backlog.md (surfaced by 2026-08-09T1315Z-audit) → primary: CrowdStrike, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/ (re-fetched in full this run via python3 tools/fetch_source.py url; quotes below are literal-checked against the raw fetched body, including the full unabridged technique catalogue and CQL detection section)"
    summary: |
      CrowdStrike systematically tested command obfuscation against a real ESXi host (validated on "ESX 7.0.3
      build-20036589 running the VMware-provided BusyBox at /usr/lib/vmware/busybox/bin/busybox, which enables the
      awk GNU math extensions (xor, and, or)") and catalogued 21 distinct working techniques across six classes,
      motivated by ESXi's status as ransomware's hypervisor-layer endgame ("Threat groups including SCATTERED
      SPIDER, BlackBasta, Royal (aka BlackSuit), Akira, and the ESX-focused ransomware as a service (RaaS) platform
      shinysp1d3r have demonstrated that once an adversary reaches the hypervisor layer, they can rapidly encrypt
      virtual machines, disable logging, and cripple an entire data center").
      The foundational insight, stated by CrowdStrike, is a parsing/execution gap: "ESX shell logs capture commands
      during the parsing stage, before expansions occur" — so a shell-substitution obfuscated command executes
      identically to its plaintext form but the log entry preserves only the obfuscated string, defeating any
      keyword-based detection for the literal command name.
      The six classes: (1) Escape Sequence Encoding — octal/hex character codes via printf, echo -e or ANSI-C
      quoting; (2) Character Generation and String Manipulation — runtime character assembly via awk/Python, string
      reversal, and (the most evasive variant) harvesting individual characters from existing environment variables
      like $TERM/$SHELL so the command line contains no encoded content at all, only standard variable references;
      (3) Invisible Unicode Character Injection — zero-width and Private-Use-Area Unicode codepoints (over 131,000
      available in the most extreme variant) interleaved between visible command characters, stripped at runtime by
      awk's gsub(); (4) Cryptographic Encoding — awk's arithmetic/bitwise primitives implement genuine ciphers:
      bitwise XOR/OR with a fixed key, a Fibonacci-sequence keystream, an affine cipher, and a CBC-like cumulative
      XOR chain where each character's decode depends on the previous one; (5) ESX Infrastructure-Keyed Obfuscation
      — the most operationally significant class: decryption keys derived from the target host's own build number,
      hostname length, or live infrastructure state (firewall status, VM count), so a captured payload only decodes
      correctly on the intended host, plus a VMFS-steganography variant that writes an octal-encoded payload to a
      hidden VMFS file bracketed by forged vmkernel syslog entries and self-deletes after execution; (6) Alternative
      Encoding Systems — Morse code, binary strings, scientific-notation ASCII values, Caesar/ROT13 and
      Quoted-Printable, none of which resemble numeric obfuscation at all.
      CrowdStrike built regex-based CrowdStrike Query Language (CQL) detection patterns targeting the shared
      syntactic primitives of each class (not the specific payloads), deployed as a Falcon Next-Gen SIEM correlation
      rule against the vmware.esxi / esxi.shell telemetry source, and explicitly maps the technique set to "MITRE
      ATT&CK T1027 (Obfuscated Files or Information), T1059.004 (Command and Scripting Interpreter: Unix Shell), and
      T1140 (Deobfuscate/Decode Files or Information)".
    region_nexus: "global — technique-class research; transferable to any ESXi estate, including European critical-infrastructure operators running VMware hypervisors"
    primary_sector_nexus: "indirect — no specific sector named; applicability is to any organisation running VMware ESXi, which spans this deployment's full additional-sector list (energy, water, transport, healthcare, finance, telco)"
    sector: ""
    cves: []
    techniques: [T1027, T1059.004, T1140]
    affected_products: ["VMware ESXi"]
    entity_keys: ["actor:akira", "actor:scattered-spider"]
    new_entities:
      - { key: "tool:shinysp1d3r", type: tool, name: "shinysp1d3r", aliases: [],
          summary: "ESX-focused ransomware-as-a-service (RaaS) platform named by CrowdStrike as one of the recurring threat groups targeting the ESXi hypervisor layer in ransomware campaigns (CrowdStrike, 2026-08-07)." }
      - { key: "actor:blackbasta", type: actor, name: "Black Basta", aliases: ["BlackBasta"],
          summary: "Ransomware group named by CrowdStrike among recurring ESXi hypervisor-layer ransomware operators (CrowdStrike, 2026-08-07)." }
      - { key: "actor:royal-blacksuit", type: actor, name: "Royal / BlackSuit", aliases: ["Royal", "BlackSuit"],
          summary: "Ransomware group (Royal, rebranded as BlackSuit) named by CrowdStrike among recurring ESXi hypervisor-layer ransomware operators (CrowdStrike, 2026-08-07)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "VMware ESX systems are a recurring target in ransomware campaigns. Threat groups including SCATTERED SPIDER, BlackBasta, Royal (aka BlackSuit), Akira, and the ESX-focused ransomware as a service (RaaS) platform shinysp1d3r have demonstrated that once an adversary reaches the hypervisor layer, they can rapidly encrypt virtual machines, disable logging, and cripple an entire data center."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
      - quote: "The critical insight is that ESX shell logs capture commands during the parsing stage, before expansions occur."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
      - quote: "All techniques were validated on ESX 7.0.3 build-20036589 running the VMware-provided BusyBox at /usr/lib/vmware/busybox/bin/busybox, which enables the awk GNU math extensions (xor, and, or)."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
      - quote: "The techniques covered map to MITRE ATT&CK T1027 (Obfuscated Files or Information), T1059.004 (Command and Scripting Interpreter: Unix Shell), and T1140 (Deobfuscate/Decode Files or Information)."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
      - quote: "Any detection strategy that searches for the keyword \"esxcli\" would miss this command entirely."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-hunts-for-shell-command-obfuscation-vmware-esx/"
    extended_notes: |
      Why ash still supports this despite its minimal footprint (source's own explanation): "Despite BusyBox's
      minimal footprint, it maintains POSIX compliance for core shell functionality. Command substitution, variable
      expansion, escape sequence interpretation, and quoting mechanisms all function as expected. The awk utility,
      available on all ESX versions, provides a particularly rich attack surface with string manipulation,
      arithmetic, bitwise operations, and even system() for command execution." — i.e. awk (not the shell itself) is
      the real obfuscation engine; bash-specific hardening/monitoring approaches built for Linux servers will miss
      this because they don't expect a POSIX-minimal shell to have this much capability via a coreutils applet.
      Baseline/normal activity CrowdStrike observed in production to calibrate false-positive risk: plaintext service
      restarts (/etc/init.d/hostd restart), hardware tools (/opt/hp/tools/hponcfg), backup scripts (ghettoVCB.sh),
      certificate renewal (/sbin/generate-certificates), NTP restarts, SSH-hardening audits (cat
      /etc/ssh/sshd_config | grep -i AllowTcpForwarding), network diagnostics (esxcli network nic vlan stats get),
      and VM config review (cat vm-config.vmx | grep CPU) — none of which resemble any of the six obfuscation
      classes, which is the basis for treating the CQL patterns as low-false-positive against real ESXi shell
      telemetry.
      Detection log source and rule scope, stated precisely: "#Vendor=\"vmware\" #event.module=\"esxi\"
      #event.dataset=\"esxi.shell\"" feeding a correlation rule template named "VMware - ESXi - Obfuscated Shell
      Command Execution", one of "over 95 VMware correlation rule templates already available in Falcon Next-Gen
      SIEM, spanning ESX and vCenter threat categories including authentication brute-force, SSH lateral movement,
      ransomware attack chains, LOLBin abuse, syslog tampering, privilege escalation, guest VM manipulation, and
      VMFS filesystem anomalies."
      Detection strategy, stated precisely: "From the 21 validated techniques, we identified the syntactic primitives
      that each category shares and built regex-based CQL detection patterns targeting those primitives" — i.e.
      matching the mechanism class (e.g. `awk.*BEGIN.*printf.*%c.*[0-9]` for character generation,
      `awk\s+.*\|\s*(?:\/bin\/)?(sh|bash)\b` for awk-constructed-command-piped-to-shell) rather than any specific
      payload string, which is the property that should generalise to techniques CrowdStrike hasn't catalogued yet.
      Most concerning class for a defender to prioritise: ESX Infrastructure-Keyed Obfuscation (class 5) — payloads
      keyed to the host's own build number, hostname length, or live state (firewall-enabled AND VM-count
      thresholds) cannot be decoded by static analysis or a sandbox because the decode depends on facts only the
      real target host has; the VMFS+syslog steganography sub-variant additionally bracket-injects forged vmkernel
      "Storage check" log lines around the actual execution and self-deletes the payload file afterward, so a
      threat hunter reviewing syslog sees only routine-looking storage-check messages either side of the real event.
      Behavioural discriminator for hunting (Triage-relevant): legitimate ESXi shell activity in CrowdStrike's own
      baseline consists of plaintext, human-readable commands (see baseline list above); ANY command-substitution
      syntax ($(...), backticks, ANSI-C $'...' quoting), awk invocation with BEGIN{printf "%c"...} character
      generation, or awk output piped to sh/bash in ESXi shell telemetry is itself anomalous against that baseline —
      administrators do not routinely write self-decoding awk one-liners.

  - title: "BINDCLOAK — Zscaler details a modular C++ backdoor with RtlQueueWorkItem-masked reflective DLL loading, assessed high-confidence as an OctLurk variant, in an East-Asia-linked campaign now expanding to Middle East energy-sector government targets"
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2", publisher: "Zscaler ThreatLabz", date: "2026-08-03", role: primary }
      - { url: "https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/", publisher: "Kaspersky GReAT", date: "2026-07-30", role: corroborating }
    discovery_trace: "first seen at: state/coverage_backlog.md (surfaced by 2026-08-09T1315Z-audit) → primary: Zscaler ThreatLabz Part 2, URL https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2 → cross-referenced: Kaspersky GReAT OctLurk/SilkLurk report (already tracked in entities/registry.yaml as malware:octlurk / malware:silklurk / tool:lurkproxy, entry 2026-07-31/octlurk-silklurk-service-dll-plugin-backdoors-government) (re-fetched Zscaler Part 2 in full this run via python3 tools/fetch_source.py url; quotes below are literal-checked against the raw fetched body, including the full Technical Analysis, Threat Attribution and MITRE ATT&CK Framework sections)"
    summary: |
      This is Part 2 of Zscaler ThreatLabz's two-part series on an East-Asia-linked actor targeting Middle East
      government entities (Part 1, already published in this store as
      entries/2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage.md, covered the TELESHIM
      backdoor and MIXEDKEY loader). Part 2 is a full technical teardown of BINDCLOAK, the toolkit's third and final
      stage: "BINDCLOAK is a 64-bit modular backdoor written in C++ that uses a complex message routing mechanism to
      manage the C2 communication channel." It generates a 4-byte per-victim host identifier from the ASCII sum of
      the computer name plus the volume serial number (continuing Part 1's environmental-keying theme), runs two
      core built-in modules (a C2 module and a Command module, each identified by a fixed type ID) plus C2-delivered
      plugin DLL modules, and supports 11 C2 commands grouped into token-collection (LogonUserW-based credential
      capture and reuse via DuplicateTokenEx), module start/stop, plugin-module init/remove, and miscellaneous
      commands (including a SetThreadExecutionState call to keep the infected host awake).
      In-process evasion tradecraft: the plugin loader allocates PAGE_EXECUTE_READWRITE memory via VirtualAlloc and
      reflectively loads a plugin DLL into it; when resolving that DLL's imports, "each DLL is loaded via
      RtlQueueWorkItem with LoadLibraryW and the DLL name as arguments to evade EDRs since LoadLibraryW calls from
      unbacked executable memory regions are considered highly suspicious by EDRs" — i.e. the suspicious
      LoadLibraryW-from-unbacked-memory call is queued to execute on a worker-thread-pool thread rather than being
      called directly from the loader's own thread context, breaking the direct-caller heuristic EDRs use to flag
      that pattern. The loader also zeroes/overwrites DOS-header fields (e_cparhdr, e_minalloc) to store the DLL
      size, hindering static PE-header-based detection of the staged plugin. C2 traffic uses two chained XOR passes
      (a hardcoded 105-byte rolling key plus a per-message random 83-byte key sent in cleartext) over zlib-compressed
      data, over TLS/TCP.
      Attribution: "ThreatLabz assesses with high-confidence that BINDCLOAK is a variant of OctLurk" — the source's
      own confidence language for this specific relationship, based on stated code overlap plus infrastructure
      overlap (an identical SSL certificate serial/CN shared between BINDCLOAK's and OctLurk's C2 domains, shared
      Tucows domain registration, Njalla nameservers, and a shared hosting ASN, corroborated by observed
      post-compromise ping attempts to both families' C2 domains from the same intrusion). This is a distinct,
      higher-confidence claim from Kaspersky's own medium-confidence assessment (already in this registry) that
      OctLurk and SilkLurk share one unattributed Chinese-speaking operator — the two confidence levels must not be
      conflated when composing the entry. Targeting: previously Central Asia (per Kaspersky, since early 2025); "the
      new campaign we identified in July 2026 highlights a notable expansion of operations to target the Middle East
      with a key focus on the energy vertical" — a direct hit against this deployment's energy sector-lens, even
      though the named victims are outside Europe.
    region_nexus: "indirect — victims are Middle East government/energy entities, not Europe; the tradecraft class (environmentally-keyed, EDR-evading implant) and the actor's demonstrated pivot into the energy vertical are directly transferable to this deployment's energy sector-lens"
    primary_sector_nexus: "direct — government/public-sector targeting stated; energy named explicitly as the sector the campaign has expanded into"
    sector: "public-sector, energy"
