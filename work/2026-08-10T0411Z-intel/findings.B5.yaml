    extended_notes: |
      Attribution discipline applied per task constraints:
      - The "193 public administrations / 3 digital-identity providers / Leonardo" figure is IrpiMedia's OWN
        reporting of Retelit's general customer base (used to establish why the breach is significant), NOT a
        Qilin claim about the contents of the stolen data. This must not be merged with breach-scope facts in
        the published entry.
      - A separate, stronger fact exists for Leonardo specifically: IrpiMedia states it directly examined the
        leaked document dump and found Leonardo-specific connectivity-provisioning files inside it (dated
        Oct 2025 / Apr 2026). No equivalent direct confirmation exists for any of the 193 PAs or the three
        digital-identity providers — for those, the only concrete PA-facing fact is Cert-AgID's 30 July
        precautionary warning naming Cineca, Lepida and InfoCamere as recipients (not as confirmed-impacted).
        No Italian PA has confirmed downstream impact; the PA angle remains an inference from customer
        relationship plus a precautionary warning, not a confirmed breach-scope fact.
      - Retelit disputes IrpiMedia's implied scope: Retelit's own right-of-reply narrows the incident to 3 of
        38 data centres (~7%), where IrpiMedia's own framing (270k files / ~300 GB across two dumps, hundreds
        of documents spanning 2000-2026) reads as more severe. Both claims are reported verbatim and attributed
        to their respective source in the entry; the discrepancy itself (a company minimizing scope after
        investigative reporting forced disclosure) is part of the story and should be preserved, not resolved
        by the entry.
      - The ACN/CSIRT-ITA bulletin BL01/260528/CSIRT-ITA (28-29 May 2026) is GENERAL Qilin campaign context
        (nationwide Italian SME/cloud-provider targeting via Ivanti EPMM CVE-2026-1281/CVE-2026-1340, Fortinet
        CVE-2024-21762/CVE-2024-55591, or VPN brute-force, then Rust ransomware on VMware ESXi). It predates
        Retelit's own stated 8 June incident date and does NOT name Retelit — no source states this bulletin's
        vectors were used against Retelit specifically. Per task instruction, the entry's techniques[] list
        does NOT include an access-vector mapping (e.g. T1190 for the Ivanti/Fortinet CVEs) because no source
        ties those CVEs to the Retelit incident. The only Retelit-specific behaviors described are credential
        theft from a system administrator's workstation used for lateral movement (T1078 Valid Accounts) and
        subsequent server encryption (T1486 Data Encrypted for Impact); the exact credential-theft mechanism
        (keylogging vs. credential dumping vs. password-store access) is not specified by any source and is
        therefore not further sub-mapped.
      - The ACN bulletin's own MITRE ATT&CK tags (as listed on the bulletin page: T1078, T1190, T1133,
        T1059.001, T1070.004, T1486, T1562.001, T1021.002, T1037.004, T1567, T1048.003, T1086, T1485, T1021.004,
        T1021.001) characterize Qilin's GENERAL campaign profile, not this specific incident, and are reported
        here as background only — not carried into this item's techniques[] field beyond the two independently
        Retelit-supported ids (T1078, T1486) that also happen to overlap the general profile.
      - Garante Privacy: the only source for a Garante notification is Retelit's own statement ("in via
        prudenziale e cautelativa" / as a precaution); no independent Garante confirmation, enforcement action,
        or public statement was found. WebSearch for Garante-side confirmation returned only generic GDPR
        breach-notification procedural pages, nothing Retelit-specific.
      - Detection/hardening framing for readers: this is a disclosed incident, not an active exploitable
        vulnerability — the defender takeaway is supply-chain/customer-relationship exposure (any organization
        using Retelit's multi-cloud or data-centre hosting, especially the Verona/Rome/Milan sites named in
        IrpiMedia's 6 August update, should validate its own backup-restoration capability and confirm whether
        its account was among those Cert-AgID precautionarily warned) rather than a patchable technical flaw.
        The credential-theft-to-lateral-movement pattern (privileged admin workstation compromise → domain/
        infrastructure-wide lateral movement → encryption) is the generic hunt takeaway: monitor for anomalous
        authentication from administrator accounts to virtualization-management interfaces (vCenter/ESXi hosts)
        outside normal change windows, and verify backup isolation (network-segmented, immutable, and tested
        restore) given Retelit's own marketing claim of "dati immutabili a prova di ransomware" ("immutable,
        ransomware-proof data") is directly contradicted by at least two customers' reported restoration
        failures per IrpiMedia's 6 August update.
