    summary: |
      Italian investigative outlet IrpiMedia reported (4 August 2026, updated 6 August 2026) that Retelit — one
      of Italy's largest B2B telecommunications and cloud operators, co-owner of a transcontinental submarine
      fibre cable and operator of 38 nationally distributed data centres — suffered an extortion attack claimed
      by the Qilin RaaS group. Qilin's own leak-site page (screenshotted by IrpiMedia on 1 August) lists 270,000
      files; IrpiMedia's own automated estimate of the actual data volume (since Qilin's site displayed an
      apparent placeholder "0 GB" size) is at least 300 GB. Qilin first claimed Retelit on its leak site on 11
      July 2026 (independently corroborated by Italian trade outlet Bismark.it, which reported the listing on
      12 July with no Retelit confirmation at that time) and published a data "sample" (internal documents plus
      scanned passports) on 14 July; a further, larger document dump followed between 30 July and 1 August.
      IrpiMedia reviewed an internal Retelit document describing the incident dated to early June 2026. Retelit
      did not issue any public statement through its own channels — its official press-release index carries no
      mention of the incident as of this run's fetch, the most recent entry being a 17 July Starlink partnership
      announcement — and did not immediately respond when IrpiMedia sought comment before publication. After
      IrpiMedia's article ran, Retelit sent the outlet a written right-of-reply (published in full, and again
      referenced in a 6 August update), which for the first time gives the company's own account: the attack,
      "attributed to the Qilin criminal group," occurred on 8 June 2026 and was notified to ACN, CSIRT-ITA, the
      Postal Police and — as a precaution — the data-protection Garante; Retelit stood up a "War Room" with
      ACN/CSIRT and external IR/forensics firms. Retelit characterizes the scope as limited to 3 of its 38
      national data centres (~7% of data-centre-distributed systems); IrpiMedia's 6 August update names those
      three sites as Verona, Rome and Milan (the latter being the site ACN-certified for Retelit's own backup
      and service-continuity capability) and reports unsolicited complaints from two Retelit customers about
      partial or total backup-recovery failure. IrpiMedia's own examination of the leaked documents (not a
      Qilin claim) found specific files concerning state-controlled defense/aerospace group Leonardo — Internet
      connectivity provisioning documents for Leonardo's Genoa and Turin offices, dated October 2025 and April
      2026 — actually present in the published dump. Separately, and at a lower evidentiary tier, IrpiMedia's
      own reporting (not sourced to Qilin) states Retelit's general customer roster includes roughly 193
      Italian public administrations and at least three digital-identity providers; no specific PA is stated by
      any source to have confirmed downstream impact — the only concrete PA-facing action documented is that
      Cert-AgID (the CERT for Italy's public administration) only learned of the incident on 30 July and began
      precautionarily warning PA security officers using Retelit's services, naming Cineca, Lepida and
      InfoCamere as recipients of that warning (not as confirmed-impacted parties). A separate ACN/CSIRT-ITA
      bulletin (BL01/260528/CSIRT-ITA, published 28 May, updated 29 May 2026) independently documents a
      systematic nationwide Qilin campaign against Italian organizations — including cloud-service providers —
      via exploitation of Ivanti EPMM (CVE-2026-1281, CVE-2026-1340) and Fortinet FortiOS/FortiProxy
      (CVE-2024-21762, CVE-2024-55591), or VPN brute-force/IAB-purchased credentials, followed by Rust-based
      ransomware against VMware ESXi; this bulletin predates Retelit's own stated 8 June incident date, does
      not name Retelit, and no source in this run states which of these vectors (if any) was used against
      Retelit specifically — IrpiMedia's own reporting instead attributes Retelit's compromise to credentials
      captured from a system administrator's workstation, used to conduct lateral movement, with at least one
      customer's backup restoration only partially succeeding.
