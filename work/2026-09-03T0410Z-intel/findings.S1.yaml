items:
  - title: "CVE-2026-59822 — BerriAI LiteLLM: unauthenticated MCP-endpoint auth bypass via a fabricated Bearer token, added to CISA KEV (third distinct LiteLLM CVE exploited in three months)"
    sources:
      - { url: "https://osv.dev/vulnerability/GHSA-7488-6r32-c95q", publisher: "BerriAI (GitHub Security Advisory GHSA-7488-6r32-c95q, mirrored via OSV.dev)", date: "2026-07-22", role: primary }
      - { url: "https://vulnerability.circl.lu/vuln/CVE-2026-59822", publisher: "CVE Program (cvelistv5, via CIRCL Vulnerability-Lookup)", date: "2026-08-28", role: corroborating }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge cisa-kev API, catalogVersion 2026.09.02, entry dateAdded 2026-09-02) → primary: BerriAI GitHub Security Advisory GHSA-7488-6r32-c95q, URL https://osv.dev/vulnerability/GHSA-7488-6r32-c95q (GHSA sign-in-walled on direct/jina fetch, read via the OSV.dev mirror of the same advisory JSON) → corroborating: CVE Program record, URL https://vulnerability.circl.lu/vuln/CVE-2026-59822"
    summary: |
      CISA added CVE-2026-59822 to its KEV catalog on 2026-09-02 (due date 2026-09-16), confirming active
      exploitation of an authentication-bypass flaw in LiteLLM's MCP Streamable HTTP endpoint. Prior to 1.84.0,
      that endpoint supported an OAuth2 passthrough mode for upstream MCP servers; on failed LiteLLM key
      validation, the fallback path substituted an empty UserAPIKeyAuth() object rather than rejecting the
      request. An unauthenticated attacker who sends any fabricated Authorization Bearer header therefore
      establishes an authenticated MCP session with no valid LiteLLM key at all, and can list and invoke every
      MCP tool and connected service the gateway exposes (GHSA-7488-6r32-c95q, mirrored on OSV.dev). CVSS 4.0
      8.8 High; CWE-287 Improper Authentication / CWE-306 Missing Authentication for Critical Function per
      CISA's own CWE tags. Fixed in 1.84.0; the vendor's stated workaround where upgrading is not immediately
      possible is to disable MCP routes or block `/mcp/` and related MCP endpoints at the reverse proxy or API
      gateway. This is the third distinct LiteLLM vulnerability this pipeline has tracked reaching confirmed
      exploitation inside three months: CVE-2026-42271 (command injection via MCP stdio test endpoints, KEV
      2026-06-08) chained with the Starlette host-header bypass CVE-2026-48710, and Microsoft's 2026-08-26
      disclosure of a real production LiteLLM-gateway intrusion using that chain. This new CVE is a distinct
      code path (the Streamable HTTP MCP transport's OAuth2 fallback, not the stdio test-endpoint command
      injection) — a different mechanism on the same class of MCP-facing attack surface, not a re-run of the
      same bug.
    region_nexus: "global; any internet-reachable LiteLLM gateway"
    primary_sector_nexus: "indirect — LiteLLM is deployed as AI-gateway infrastructure across sectors, public-sector included wherever agencies operate self-hosted LLM proxies"
    sector: "technology"
    cves: [CVE-2026-59822]
    techniques: [T1190, T1550.001]
    affected_products: ["BerriAI LiteLLM"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "LiteLLM's MCP Streamable HTTP endpoint could allow an unauthenticated attacker to establish an authenticated MCP session using an arbitrary Bearer token. The MCP auth handler supported OAuth2 passthrough for upstream MCP servers, but the fallback path could replace failed LiteLLM key validation with an empty `UserAPIKeyAuth()` object. This allowed requests with a fabricated `Authorization` header to reach MCP tooling without a valid LiteLLM key."
        attribution: "BerriAI (GitHub Security Advisory GHSA-7488-6r32-c95q, via OSV.dev)"
        source_url: "https://osv.dev/vulnerability/GHSA-7488-6r32-c95q"
      - quote: "If upgrading is not immediately possible, disable MCP routes or block access to `/mcp/` and related MCP endpoints at your reverse proxy or API gateway."
        attribution: "BerriAI (GitHub Security Advisory GHSA-7488-6r32-c95q, via OSV.dev)"
        source_url: "https://osv.dev/vulnerability/GHSA-7488-6r32-c95q"
      - quote: "BerriAI LiteLLM contains an improper authentication vulnerability in the MCP Streamable HTTP endpoint that could allow an unauthenticated attacker to establish an authenticated MCP session using an arbitrary Bearer token."
        attribution: "CISA (KEV catalog entry)"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    extended_notes: |
      Disposition per the KEV sweep duty: NEW ENTRY CANDIDATE. Distinct vulnerability/CVE/mechanism from
      CVE-2026-42271 (2026-06-09 entry) and CVE-2026-48710 (2026-05-30 entry, referenced again in the
      2026-08-31 AI-infrastructure threat entry) — different endpoint (MCP Streamable HTTP vs. MCP stdio test
      endpoints), different CWE (287/306 improper/missing authentication vs. 78 OS command injection). The
      composer may wish to cross-reference the 2026-06-09 and 2026-08-31 entries in `references[]` given they
      concern the same product's recurring MCP attack surface, without merging them — this is a separate flaw.
