  - title: "CVE-2026-9586 — Sangoma Switchvox: unauthenticated SQL injection in an XML phone-notification endpoint reaches PostgreSQL COPY TO PROGRAM, and honeypots caught exploitation starting five weeks after the patch"
    sources:
      - { url: "https://horizon3.ai/attack-research/disclosures/cve-2026-9586-sangoma-switchvox-rce/", publisher: "Horizon3.ai (Zach Hanley)", date: "2026-09-01", role: primary }
      - { url: "https://www.helpnetsecurity.com/2026/09/02/exploitation-of-sangoma-switchvox-flaw-underway-cve-2026-9586/", publisher: "Help Net Security", date: "2026-09-02", role: corroborating }
      - { url: "https://vulnerability.circl.lu/vuln/CVE-2026-9586", publisher: "CVE Program (cvelistv5, via CIRCL Vulnerability-Lookup)", date: "2026-07-17", role: corroborating }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge cisa-kev API, catalogVersion 2026.09.02) → primary: Horizon3.ai, URL https://horizon3.ai/attack-research/disclosures/cve-2026-9586-sangoma-switchvox-rce/ → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/09/02/exploitation-of-sangoma-switchvox-flaw-underway-cve-2026-9586/"
    summary: |
      CISA added CVE-2026-9586 to its KEV catalog on 2026-09-02 (due date 2026-09-16). Sangoma Switchvox
      (VoIP/unified-communications platform built on Asterisk) exposes an unauthenticated HTTP endpoint /pa,
      handled by PhoneAppsHandler.pm, meant to let supported phones receive call-event notifications. The
      handler validates only that the POST body starts with the literal string <PolycomIPPhone> — no content
      sanitisation — then parses it as XML via XML::Simple::XMLin() and extracts the PhoneIP field with no
      validation, concatenating it directly into an unparameterized SQL string executed against PostgreSQL
      with $db->query(). CVSS 4.0 9.3 (CWE-89). Horizon3.ai's timeline: reported to Sangoma 10 April 2026,
      patched in Switchvox 8.4.0.2 on 14 July 2026; Horizon3 (with Defused Cyber) deployed internet honeypots
      from 8 May 2026 — before the patch shipped — specifically to watch for zero-day use. Exploitation
      attempts began 30 August 2026, six weeks after the patch, from a single source IP dropping reverse
      shells (an observed initial payload of `nc <ip> <port> | sh`) then enumerating running processes via a
      base64-encoded `top -bn1` pipeline exfiltrated over HTTP. Help Net Security's 2026-09-02 update (citing
      Hanley directly) reports the same threat actor has since begun deploying second-stage malware that
      "on a cursory look appeared to be a cryptominer," and that dozens of additional source IPs have joined,
      including simple scanning payloads. Hanley assesses the appliance's own value to attackers is as an
      internal-network pivot point, since some appliances hold integration secrets usable with stolen
      credentials. Approximately 4,000 Switchvox instances are visible on Shodan, mostly in the United States.
      Indicator (not an IOC in the operational sense — a log artifact the vendor's own component writes):
      SQL-injection payloads land in /var/log/switchvox/db-quirks.log.
    region_nexus: "global; Shodan-visible population concentrated in the United States, but any internet-exposed instance is affected regardless of geography"
    primary_sector_nexus: "indirect — Switchvox is an SMB/enterprise VoIP platform, not sector-specific, but any public-sector telephony deployment on this product is directly exposed"
    sector: "telecom"
    cves: [CVE-2026-9586]
    techniques: [T1190, T1059.004, T1496]
    affected_products: ["Sangoma Switchvox"]
    entity_keys: []
