  - title: "CVE-2026-83548 / CVE-2026-83549 — SonicWall SMA1000: a pre-auth SSRF in the Appliance Work Place interface chains into post-auth OS command injection in the Appliance Management Console for unauthenticated RCE — the second SMA1000 zero-day chain in seven weeks"
    sources:
      - { url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016", publisher: "SonicWall PSIRT (advisory SNWLID-2026-0016)", date: "2026-09-01", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", publisher: "BleepingComputer", date: "2026-09-02", role: corroborating }
      - { url: "https://www.helpnetsecurity.com/2026/09/02/sonicwall-sma-1000-cve-2026-83548-cve-2026-83549-zero-day-attacks/", publisher: "Help Net Security", date: "2026-09-02", role: corroborating }
      - { url: "https://vulnerability.circl.lu/vuln/CVE-2026-83548", publisher: "CVE Program (cvelistv5, via CIRCL Vulnerability-Lookup)", date: "2026-09-01", role: corroborating }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge cisa-kev API, catalogVersion 2026.09.02) → cross-checked at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12904 (post id 12904, created 2026-09-02) → primary: SonicWall PSIRT, URL https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016 (JS-SPA shell on direct fetch, hydrated via jina reader) → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/ → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/09/02/sonicwall-sma-1000-cve-2026-83548-cve-2026-83549-zero-day-attacks/"
    summary: |
      CISA added CVE-2026-83548 and CVE-2026-83549 to its KEV catalog on 2026-09-02 (due date 2026-09-16).
      SonicWall's own advisory (SNWLID-2026-0016, updated 2026-09-01) states it "has investigated a case
      indicating the active exploitation of the vulnerabilities." CVE-2026-83548 (CVSS 3.0 10.0,
      AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) is a pre-authentication SSRF in the SMA1000 Appliance Work Place
      interface arising from an unintended alternate access path (CWE-918 SSRF, CWE-441 Confused Deputy),
      letting a remote unauthenticated attacker reach unauthorized functionality. CVE-2026-83549 (CVSS 3.0
      7.8, AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) is a post-authentication OS command injection in the SMA1000
      Appliance Management Console (CWE-78) exploitable by an attacker holding admin privilege. News reporting
      states the two are chained — the SSRF grants the unauthorized access that then reaches the AMC command
      injection — for unauthenticated remote code execution end to end. Affects physical and virtual SMA1000
      models 6210, 7210 and 8200v; does not affect the SMA 100 series or SonicWall firewall SSL-VPN. Fixed by
      upgrading to hotfix 12.4.3-03526 or 12.5.0-02952 (branch-dependent) via mysonicwall.com. SonicWall has
      not published IOCs or attack narrative detail; its guidance where indicators are found is to re-image or
      re-deploy the appliance, change every user and administrator password, and reset TOTP tokens — implying
      SonicWall treats successful exploitation as credential- and MFA-seed-compromising. Shadowserver tracks
      over 400 internet-exposed SMA1000 appliances. This is the second SMA1000 zero-day chain reported in
      seven weeks: CVE-2026-15409/15410 (SSRF-to-command-injection, tracked by Volexity as UTA0533, already
      in this store's 2026-07-14 entry) were exploited from at least June 2026 and CISA confirmed ransomware
      gangs abusing them in August 2026 — the same SSRF-to-injection pattern recurs here on a different
      endpoint pair, but no source ties this new chain to UTA0533 or any other named actor/cluster.
    region_nexus: "global; SMA1000 is deployed by large enterprises, government agencies and MSSPs for remote access"
    primary_sector_nexus: "direct — SMA1000 is explicitly marketed for government and critical-infrastructure remote-access use"
