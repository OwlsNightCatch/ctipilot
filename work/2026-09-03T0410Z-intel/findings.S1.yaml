    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The PhoneIP field extracted directly from the XML message and directly concatenated into an unparameterized SQL query."
        attribution: "Horizon3.ai (Zach Hanley)"
        source_url: "https://horizon3.ai/attack-research/disclosures/cve-2026-9586-sangoma-switchvox-rce/"
      - quote: "Given the quick succession of exploit attempts across multiple honeypots from the same source IP, we believe that it is likely that most internet exposed Switchvox instances will be or have already been targeted."
        attribution: "Horizon3.ai (Zach Hanley)"
        source_url: "https://horizon3.ai/attack-research/disclosures/cve-2026-9586-sangoma-switchvox-rce/"
      - quote: "the same threat actor has been observed downloading second-stage malware onto the system, which on a cursory look appeared to be a cryptominer, he shared. Also, since his post was published, dozens of additional source IPs have been observed exploiting the honeypots to include simple scanning payloads and also more second stage malware installation."
        attribution: "Help Net Security, citing Horizon3.ai's Zach Hanley"
        source_url: "https://www.helpnetsecurity.com/2026/09/02/exploitation-of-sangoma-switchvox-flaw-underway-cve-2026-9586/"
    extended_notes: |
      Disposition per the KEV sweep duty: NEW ENTRY CANDIDATE — no existing entry covers this product or CVE.
      New product for the registry: Sangoma Switchvox (no existing product: key found in entities/registry.yaml).
      Triage note for the composer: the SQL-injection-to-RCE mechanism (PostgreSQL COPY TO PROGRAM invoked from
      within an injected query) is a reusable technique class worth naming explicitly in the body — it doesn't
      require xp_cmdshell-style stored-procedure abuse, just a database role permitted to write server-side
      files/execute programs, which is a common PostgreSQL misconfiguration this same primitive would apply to
      elsewhere.
