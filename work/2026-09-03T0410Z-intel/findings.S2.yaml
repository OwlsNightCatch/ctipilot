items:
  - title: "EU CRA Single Reporting Platform still has no published URL eight days before the 11 September mandatory-reporting go-live, and ENISA's own FAQ confirms no API at launch"
    sources:
      - { url: "https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp/frequently-asked-questions", publisher: "ENISA (SRP FAQ)", date: "2026-08-31", role: "primary" }
