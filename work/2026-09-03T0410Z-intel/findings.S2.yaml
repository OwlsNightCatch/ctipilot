    discovery_trace: "first seen at: WebSearch (\"Cyber Resilience Act reporting obligation guidance September 2026 manufacturer checklist\") -> techtimes.com, URL https://www.techtimes.com/articles/326249/20260901/eu-cyber-resilience-act-reporting-deadline-filing-portal-launches-same-day-it-becomes-mandatory.htm -> primary: ENISA SRP FAQ, URL https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp/frequently-asked-questions -> corroborating legal analysis: Hogan Lovells Cadwalader, URL https://www.hlc.com/en/publications/eu-cyber-resilience-act-preparing-for-vulnerability-and-incident-reporting -> corroborating: European Commission CRA reporting page, URL https://digital-strategy.ec.europa.eu/en/policies/cra-reporting"
    summary: |
      Eight days before the EU Cyber Resilience Act's Article 14 mandatory vulnerability/incident-reporting
      obligation takes effect (11 September 2026), ENISA's own Single Reporting Platform (SRP) FAQ page
      (last updated 31 August 2026) still states the platform is only "scheduled to be operational by
      11 September 2026" and that its public URL "will be communicated and published in due course on this
      page before the platform goes live" -- i.e. manufacturers cannot pre-test the only channel through
      which the law lets them file. ENISA's FAQ further confirms the SRP will accept submissions only through
      a web portal at launch: "no Application Programming Interfaces will be provided at this stage," so an
      organisation with an automated SBOM-to-vulnerability-database correlation pipeline still has to
      terminate that workflow at the portal boundary and file manually within the 24-hour early-warning
      window. Two operational constraints from the same FAQ matter for anyone building an incident-response
      playbook against this deadline: non-validated Assigned Representative (AR) accounts are capped at
      20 notifications before validation becomes mandatory, and each manufacturer may register only one
      Primary AR (plus up to 20 Secondary ARs) -- so an account created and validated only after a live
      incident starts risks hitting that cap mid-response. ENISA's own guidance is counter-intuitive:
      manufacturers should create an EU Login (ecas.ec.europa.eu) now, but "register and initiate the
      validation process only when they need to submit a notification," to avoid overloading national CSIRTs
      before go-live -- meaning the first live interaction most organisations have with the SRP will be under
      the pressure of an actual reportable event. Separately, Hogan Lovells Cadwalader's legal analysis
      confirms a scope point the store's prior NCSC-FI-sourced coverage did not carry: under Art. 69(3) CRA,
      the Art. 14 reporting duty is NOT limited to products launched after 11 September 2026 -- it applies
      retroactively to every in-scope "product with digital elements" already placed on the EU market before
      the CRA's main 11 December 2027 compliance date, provided the product remains within its declared
      support period. This closes a scope gap: a Swiss-domiciled manufacturer (or an EU-market supplier to
      Swiss public-sector buyers) with legacy connected hardware or software already deployed in the EU must
      still be able to detect, assess and report an actively-exploited vulnerability in that legacy product
      from day one, which in practice requires a component inventory (SBOM) for products the organisation may
      not have originally built one for.
    region_nexus: "EU-wide regulatory obligation; directly applicable to any Swiss-domiciled manufacturer of connected hardware/software placed on the EU market (via an EU authorised representative), and indirectly relevant to Swiss federal/cantonal/communal buyers who need assurance that their connected-product suppliers can meet the 24h/72h/14-day reporting clock from 11 September 2026"
