    extended_notes: |
      Sourcing note: Tech Times' own article states the AR-notification cap as "ten," which contradicts
      ENISA's own FAQ text (20) quoted above -- ENISA's primary FAQ is treated as authoritative and the
      figure of 20 is what is carried into the evidence/summary; Tech Times is retained only as a
      corroborating discovery source for the "platform not live" and "Article 69(3) legacy-product" framing,
      both of which are independently confirmed by ENISA's own FAQ and by Hogan Lovells Cadwalader's legal
      reading respectively. The Hogan Lovells Cadwalader piece is dated 2026-06-10 (pre-window) and is cited
      solely as legal-analysis corroboration for the Art. 69(3) scope point, which is a durable statutory
      fact rather than a fresh news claim; the in-window delta driving this update is ENISA's own FAQ update
      (31 August 2026) and the Tech Times discovery piece (1 September 2026).
