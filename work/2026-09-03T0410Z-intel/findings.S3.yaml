  - title: "A brand-impersonation download campaign regenerates a fresh-hash installer archive per request from Chinese-language look-alike sites, then disables Windows Update and tampers with Defender via a throwaway SYSTEM scheduled task — Microsoft ties it to Silver Fox with moderate confidence"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/01/counterfeit-installers-system-compromise-tracking-deceptive-software-download-campaign/", publisher: "Microsoft Threat Intelligence / Microsoft Defender Experts", date: "2026-09-01", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/fake-software-installers-disable.html", publisher: "The Hacker News", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: majors-sweep (msft-ti listing), URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ → primary: Microsoft Threat Intelligence, URL https://www.microsoft.com/en-us/security/blog/2026/09/01/counterfeit-installers-system-compromise-tracking-deceptive-software-download-campaign/ → corroboration search: WebSearch (\"Microsoft counterfeit installers Silver Fox fake software download campaign September 2026\") → The Hacker News, URL https://thehackernews.com/2026/09/fake-software-installers-disable.html"
    summary: |
      Microsoft Defender Experts (2026-09-01) tracks an active campaign impersonating legitimate software vendors through high-fidelity clone download pages hosted on `.com.cn`/`.hl.cn`/`.cn` infrastructure with Chinese-language lure content, spoofing brands including Razer, Microsoft Edge, Kaspersky, NetEase Youdao, Baidu Netdisk, oCam, draw.io, SteelSeries, Sogou, Calibre and a MindMaster typosquat. Every clone funnels to the same small set of delivery hosts; the downloaded ZIP archive (families `app_setup.*`, `zinst.*`, `zintall.*`, `intsoft.*`, `innstll.*`) keeps a constant filename while its hash changes on every single download — direct evidence the payload is regenerated server-side per request, confirmed by Microsoft capturing two content-distinct copies of the same-named archive written roughly 69 seconds apart from the same delivery URL. Infrastructure enrichment resolves the look-alike domains into two hosting/DNS procurement groupings (six domains sharing one ASN and nameserver pair across four unrelated netblocks and three registered country codes; two more sharing a different ASN and nameserver pair in a single /21) — Microsoft states ASN-level analysis, not netblock or geographic grouping, is what surfaces the relationship. A wrapper installer (e.g. `a_instapp83353001.exe`) drops a randomized stage-one payload under `C:\Users\Public\<random>\` or `C:\Program Files (x86)\<random>\`, with the same payload hash observed under many different names/paths; a parallel execution vector runs the same masquerade pattern through `msiexec.exe` in embedded mode. One later-stage payload's version resource fraudulently declares CompanyName "Speech Processing Solutions GmbH" / FileDescription "Philips Speech Driver Client Configuration" while retaining an unfilled build-template placeholder ("ProductName: TODO: <Product name>") — evidence the version metadata was fabricated rather than inherited from genuine software. A second payload carries the Indigo Rose TrueUpdate Client's version metadata and genuinely reproduces that product's runtime behavior (writing `_ir_tu2_temp_*` artifacts) while connecting to an attacker-controlled Alibaba Cloud OSS bucket over TLS to fetch further payloads — a legitimate update mechanism repurposed for delivery. Persistence uses Scheduled Tasks with innocuous display names (e.g. "Deadline Mission Target") launching specific payloads from `C:\ProgramData\`, giving affected hosts a characteristic ~60-second re-execution cadence. Privilege escalation for defense-evasion actions uses a throwaway SYSTEM-level scheduled task (`SCHTASKS /Create ... /RL HIGHEST /RU "SYSTEM"`, immediately run then deleted) to write Defender path exclusions via registry; other payloads delete volume-shadow copies (`vssadmin delete shadows /all /quiet`), harden their own directories against removal via `icacls`, and neutralize Windows Update by stopping/disabling `wuauserv`/`UsoSvc`/`uhssvc`/`WaaSMedicSvc`, renaming update DLLs and deleting the SoftwareDistribution cache. Process injection was also observed (a persistent payload creating a remote thread in a legitimate application moments after it started). C2 runs over non-standard ports (5090, 7031-7032, 7088-7090, 8050, 28290, 28300) to six-character `.net` domains and IP:port endpoints, with a primary hub on 202.95.14.237 (AS152194). Victims span healthcare, manufacturing, gaming, technology, logistics, government and higher education, predominantly tied to China-based operations of multinational organizations and Chinese-speaking users. Microsoft assesses with moderate confidence the activity is consistent with the publicly reported Silver Fox (Yinhu, 银狐) fake-software cluster — which The Hacker News notes has a track record of spoofed vendor download pages distributing Gh0st RAT and ValleyRAT/Winos 4.0 — but has not attributed it to a nation-state actor; Microsoft Defender's Attack Disruption engaged automated containment in observed environments.
    region_nexus: "primarily China-based operations of multinational organizations and Chinese-speaking users; the technique class (server-side per-request hash regeneration, ASN-level infrastructure pivoting over netblock/geography, fabricated-vendor version-resource masquerade) is directly transferable to any public-sector estate facing fake-software distribution regardless of region"
