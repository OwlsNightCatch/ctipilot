  - title: "GitSpawn — AI coding agents (Claude Code, Grok Build, Qwen Code, Hermes, Goose) auto-run git commands that a hostile repository's own config can hijack into arbitrary code execution"
    sources:
      - { url: "https://www.manifold.security/blog/ai-coding-agents-git-hijack", publisher: "Manifold Security", date: "2026-09-01", role: "primary" }
      - { url: "https://www.heise.de/news/KI-Agenten-fuehren-git-Schadcode-beim-Starten-automatisch-aus-11437165.html", publisher: "heise Security", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS) → article https://www.heise.de/news/KI-Agenten-fuehren-git-Schadcode-beim-Starten-automatisch-aus-11437165.html → primary: Manifold Security, URL https://www.manifold.security/blog/ai-coding-agents-git-hijack"
    summary: |
      Manifold Security discloses "GitSpawn": every CLI AI coding agent it tested gathers repository context at startup or on first prompt by running ordinary git commands (`git status`, `git diff`) against the repository's own local git configuration — outside the agent's sandbox, before any workspace-trust prompt, and on some agents before the user has even authenticated. Any git command that refreshes the index (which `git status`/`git diff` do) honours the repository's `core.fsmonitor` setting: a performance hook where git hands off the refresh to an external helper program named in `.git/config`, running it with the developer's full local privileges. A hostile `.git/config` can set `[core] fsmonitor = <arbitrary command>`, and the agent's own routine startup housekeeping executes it with no approval prompt and nothing on screen. Delivery is constrained but real: cloning, fetching or pulling a hostile URL is NOT a vector (git never carries `.git/config` across those operations, per Manifold), so the attack requires the `.git` directory arriving as files — a shared zip, sync folder, drive, or USB stick, the way colleagues and consultants routinely hand off projects. Eight findings across seven agents; four remain unpatched at publication. Confirmed sinks: Goose (`git diff` during `goose review`, fixed 1.44.0, CVE-2026-72718 CVSS 7.0), Claude Code's `core.fsmonitor` path (patched 2.1.196) and a second, still-unpatched sink in `claude ultrareview` that uses a different git config key Manifold has withheld while unfixed, Hermes Agent (`git status` on first message, unpatched on 0.21.0 despite six contact attempts across five channels — CVE-2026-71963 assigned by VulnCheck, not the vendor), Qwen Code (`git status` at startup, before authentication — accepted by Alibaba's SRC but unpatched on 0.22.3), and Grok Build (payload fires on the first keystroke — unpatched on 1.0.13, an earlier July report on the same class was closed by xAI as "informative"). OpenAI Codex and Cursor were also affected and are now patched. Manifold states the underlying pattern is not limited to the named agents and spans both major AI labs and large software companies. Mitigation: inspect `.git/config` before opening any repository received as files (any entry naming a program is suspicious); agent vendors should sanitize the git config on their context-gathering calls, e.g. `git -c core.fsmonitor=false status`.
    region_nexus: "global — affects any developer or SOC workstation running a CLI AI coding agent"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1204.002, T1059]
    affected_products: ["Claude Code", "Grok Build", "Qwen Code", "Hermes Agent", "Goose", "OpenAI Codex", "Cursor"]
    entity_keys: []
    new_entities:
      - { key: "trend:gitspawn-ai-coding-agent-git-config-rce", type: trend, name: "GitSpawn",
          summary: "Manifold Security's designation for a class of vulnerabilities across CLI AI coding agents where automatic, sandbox-exempt context-gathering git commands honour a hostile repository's own git configuration (e.g. core.fsmonitor), letting the repository itself specify an arbitrary command that executes with the developer's full privileges before any trust prompt (Manifold Security, 2026-09-01)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Open a folder with Claude Code and it runs git status before you type anything. Before the workspace-trust prompt. On some agents, before you have even authenticated."
        attribution: "Manifold Security"
        source_url: "https://www.manifold.security/blog/ai-coding-agents-git-hijack"
      - quote: "Delivery is worth being precise about, because git never carries this. Cloning a hostile URL does nothing, and neither does fetch or pull. The repository has to arrive as files with its .git directory already inside"
        attribution: "Manifold Security"
        source_url: "https://www.manifold.security/blog/ai-coding-agents-git-hijack"
      - quote: "Agenten von Claude, Qwen, Grok usw. starten in manipulierten Repositories automatisch Schadcode – ohne Zutun des Anwenders, aber mit dessen vollen Rechten."
        attribution: "heise Security"
        source_url: "https://www.heise.de/news/KI-Agenten-fuehren-git-Schadcode-beim-Starten-automatisch-aus-11437165.html"
    extended_notes: |
      Manifold frames this as a general risk class: "the same shape shows up wherever an agent picks up something it did not write. Skills, MCP servers, and plugins arrive as files, carry their own configuration, and are trusted on arrival for the same reason a repository is." Worth a hunting note for any org standardising on AI coding agents: audit `.git/config` provenance policy for zipped/copied repos (not cloned ones), and check whether the agent vendor in use has patched the fsmonitor-class sink.

  - title: "Gambling Goblin (Earth Berberoka overlap): a Chinese-speaking cluster compiles malicious Apache modules on compromised Brazilian .gov.br servers to reverse-proxy visitors into a gambling-SEO fraud network"
    sources:
      - { url: "https://research.checkpoint.com/2026/gaming-the-system-how-a-chinese-speaking-actor-turned-brazilian-government-sites-into-an-seo-weapon/", publisher: "Check Point Research", date: "2026-09-02", role: "primary" }
      - { url: "https://blog.checkpoint.com/research/gambling-goblin-a-chinese-speaking-actor-hijacks-brazilian-government-sites-to-fuel-a-global-seo-fraud-machine/", publisher: "Check Point Blog", date: "2026-09-02", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/gambling-goblin-brazilian/", publisher: "Infosecurity Magazine", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: majors-sweep (Check Point Research listing), URL https://research.checkpoint.com/ → primary: Check Point Blog, URL https://blog.checkpoint.com/research/gambling-goblin-a-chinese-speaking-actor-hijacks-brazilian-government-sites-to-fuel-a-global-seo-fraud-machine/ → primary technical report: Check Point Research, URL https://research.checkpoint.com/2026/gaming-the-system-how-a-chinese-speaking-actor-turned-brazilian-government-sites-into-an-seo-weapon/"
    summary: |
      Check Point Research documents "Gambling Goblin," a Chinese-speaking cluster it assesses with medium-to-high confidence overlaps Earth Berberoka (first documented by Trend Micro in 2022, targeting gambling platforms serving Chinese-speaking users). Active against Brazilian organisations since mid-2025, primarily government and educational institutions. On a compromised Linux host, the group's Bash installer (confirms root, fingerprints Debian/Ubuntu vs. CentOS/RedHat, pulls matching Apache dev packages, patches a missing macro so a hardcoded staging-server source file `opsproxy.c` compiles cleanly on the victim) compiles and installs a custom Apache module via `apxs`, then deletes all build artefacts and timestomps the resulting `.so` and its load-config to match legitimate modules such as `mod_ssl` or `mod_suexec`. The module hooks Apache's name-translation stage, matches a small set of hardcoded URL prefixes (`/wps`, `/bmw`, `/card` in the observed samples), and silently reverse-proxies matching requests to a hardcoded upstream — the victim domain never changes in the browser bar. It strips the site's own Content-Security-Policy header and replaces it with a permissive one (allowing inline/`eval`'d scripts, third-party assets, `data:`/`blob:` sources) so injected content renders unrestricted. A second ELF module decrypts an RC4-protected ruleset keyed on path/referrer/User-Agent/client-IP, locates `<body.*?>` via regex, and injects fetched remote content via `ap_rwrite` — classic SEO-cloaking/content-injection behaviour. The upstream phishing pages impersonate Google Play, Microsoft Store and Amazon (fabricated ratings, `schema.org` metadata, Chinese-language CSS comments) and push gambling/sports-betting content; navigation tiles on the Brazilian pages point to dozens of real `.gov.br` domains spanning federal ministries, state legislative assemblies/courts of accounts, a state utility, and numerous municipal administrations — borrowing their search-engine trust to rank the fraud pages. The group also runs an internet-facing reconnaissance agent ("cluster-asset-mapping"/"cam-agent", a Go ELF binary using gRPC C2 with embedded certs) that wraps `dirprobe`, `httpx`, `naabu`, `nuclei` v3, `subfinder` and `whatweb` as plugins for attack-surface mapping. Custom implants include DownPro (Go downloader, AES-GCM-encrypted URLs, drops payloads under names mimicking system binaries like `systemd-udevd`/`nftables-init` or PHP-session-style temp files), AlphaAgent (modular Go backdoor: gRPC-over-HTTPS with uTLS browser fingerprint mimicry and Google/Cloudflare traffic camouflage, or a DNS/TXT covert channel; bundles a SOCKS5 proxy, yamux multiplexer and Ligolo-style relay for pivoting; archives victims' `.ssh` and `.bash_history`; carries an "AI plugin" execution path (`ai_plugin_%s.sh`) whose purpose is not yet confirmed), and oRAT (Go RAT persisting as a systemd service disguised as the real `xtables-addons` netfilter package, embedding its own SSH/SFTP server, masquerading its process as `sshd: root@pts/0`). A 3snake-based credential stealer intercepts `sshd`/`sudo`/`su`/`ssh`/`passwd`/`kinit`/`login` executions via netlink process-event monitoring and `ptrace`. Attribution rests on three independent overlaps Check Point names explicitly: oRAT's shared `orat/cmd/agent` codebase (tied to Earth Berberoka since 2022), an AlphaAgent sample recovered from the same archive as previously-attributed Earth Berberoka tooling, and C2 infrastructure sharing Earth Berberoka's historical Amazon ASN (AS16509). Check Point states the model is already exported: parallel phishing templates localised for Vietnamese, Spanish and English audiences, with daily domain generation.
    region_nexus: "Brazil (government at federal/state/municipal level) primary; localised phishing infrastructure also found for Vietnamese, Spanish and English-speaking audiences — the technique (reverse-proxy Apache module abusing a government domain's search reputation) is directly transferable to any public-sector web-hosting estate"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1584.004, T1090.002, T1071.001, T1071.004, T1572, T1036.005, T1070.006, T1552.004, T1110, T1595.002]
    affected_products: ["Apache HTTP Server (Linux)"]
    entity_keys: []
    new_entities:
