          summary: "Chinese-speaking cybercrime cluster first documented by Trend Micro (2022) targeting online gambling platforms serving Chinese-speaking users across Windows/Linux/macOS; Check Point Research's 2026-09-02 'Gambling Goblin' report links a campaign compromising Brazilian government (.gov.br) web servers into an SEO-fraud reverse-proxy network to this cluster with medium-to-high confidence, via shared oRAT codebase, co-archived AlphaAgent tooling, and shared C2 ASN (AS16509)." }
      - { key: "tool:orat", type: tool, name: "oRAT",
          summary: "Go-based Linux RAT used by Earth Berberoka/Gambling Goblin; persists as a systemd service disguised as the legitimate xtables-addons package, embeds its own SSH/SFTP server, and exposes REST-style operator routes (exec, upload/download, screenshot, portscan, SOCKS proxy) over TCP/TLS/QUIC transports (Check Point Research, 2026-09-02)." }
      - { key: "tool:alphaagent", type: tool, name: "AlphaAgent",
          summary: "Modular Go backdoor used by Earth Berberoka/Gambling Goblin; communicates via gRPC-over-HTTPS with uTLS browser-fingerprint mimicry and Google/Cloudflare traffic camouflage, or over a DNS covert channel, bundling a SOCKS5 proxy, yamux multiplexer and Ligolo-style relay for lateral pivoting, plus an unconfirmed 'AI plugin' execution path (Check Point Research, 2026-09-02)." }
      - { key: "tool:downpro", type: tool, name: "DownPro",
          summary: "Go-based downloader used by Earth Berberoka/Gambling Goblin to stage the rest of the toolkit on a freshly compromised Linux host; AES-GCM-encrypts its configured URLs and drops payloads under filenames mimicking legitimate system binaries or PHP session temp files (Check Point Research, 2026-09-02)." }
    relation_suggestions:
      - { subject: "actor:earth-berberoka", object: "tool:orat", basis: "Check Point Research: 'oRAT was tied to Earth Berberoka in 2022, and the variant we analyzed shares the same orat/cmd/agent codebase and REST-style operator routes' (Check Point Research, 2026-09-02)" }
      - { subject: "actor:earth-berberoka", object: "tool:alphaagent", basis: "Check Point Research: 'one of the AlphaAgent samples we recovered was uploaded in the same archive as other tools previously attributed to Earth Berberoka, placing AlphaAgent directly alongside the group's known toolset' (Check Point Research, 2026-09-02)" }
