    discovery_trace: "first seen at: majors-sweep (msft-ti listing), URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ → primary: Microsoft Threat Intelligence, URL https://www.microsoft.com/en-us/security/blog/2026/09/02/impersonating-it-support-threat-actors-turn-remote-session-into-enterprise-wide-access/ → background/corroboration search: WebSearch (\"Microsoft \\\"Impersonating IT support\\\" Teams remote session Node.js implant\") → BleepingComputer, URL https://www.bleepingcomputer.com/news/security/fake-it-support-calls-on-microsoft-teams-push-etherrat-malware/"
    summary: |
      Microsoft Threat Intelligence (2026-09-02) documents a human-operated intrusion campaign that abuses Microsoft Teams external-collaboration chat/calls to impersonate IT or helpdesk personnel ("Microsoft Security Update", "Spam Filter Update", "Account Verification" pretexts, sometimes reinforced with vishing) and socially-engineer the victim into approving a "request control" prompt during a Teams screen-share, or into opening Quick Assist and reading back a connection code. Once remote control is granted through the legitimate support tool, the operator uses PowerShell inside the same session to silently pull a malicious MSI (disguised with update-themed names like "devfix"/"Hotfix", hosted on a widely-used cloud-storage platform to blend with legitimate traffic) and installs it via `msiexec /qn`. The MSI stages a portable Node.js runtime fetched from the official Node.js distribution plus a separate encrypted implant file under `LocalAppData`; a deferred MSI custom action launches hidden bootstrap code via PowerShell/cmd.exe/WScript, which decrypts the implant (nonstandard extensions such as `.tmp`/`.ini`/`.dat`/`.bin`/`.cfg`) and hands it to Node.js either via standard input or a temporary `.js` file — evading controls that key on unsigned executables or conventional script extensions. Per-user persistence uses an `HKCU Run` value or Startup-folder shortcut, both named "EdgeUpdate". The implant polls its C2 over randomized HTTPS long-polling and executes returned JavaScript dynamically (Node.js module loading, process execution, environment variables, filesystem access); observed tasking performs sandbox/AV-discovery checks (display-adapter name, installed AV via SecurityCenter2), periodic Base64-encoded desktop-screenshot capture, and ADSI-based Active Directory sweeps (domain-joined server enumeration with CIM reachability probing, user object/description-attribute harvesting) using randomized sleep jitter to stay quiet. Follow-on payloads execute via `rundll32.exe` loading operator-supplied DLLs through an exported `open` function gated by a per-execution token. The intrusion culminates in lateral movement over WinRM (TCP 5985) from a non-administrative process context to a large set of domain-joined systems — explicitly including domain controllers and certificate authorities — which Microsoft frames as the hallmark of activity that precedes large-scale data theft, extortion or ransomware deployment. A dormant capability in the analyzed implants queries an Ethereum smart contract for an updated C2 URL (disabled in the recovered builds, which fall back to a hard-coded server) — the contract stores only a URL string, no payload. Microsoft's own detection-name table (Trojan:JS/EtherRatz.A!MTB / .B!MTB, Trojan:JS/SynkLoader.SA) ties the implant to the malware family this pipeline already tracks as EtherRAT: a cross-platform Node.js RAT previously reported (BleepingComputer, 2026-07-06, relaying Unit 42's GitHub-published analysis of a distinct June/July 2026 wave delivered via an "Employee Survey" phishing PDF plus Teams vishing from an external tenant, using HopToDesk/AnyDesk as the remote-access tool and pulling payloads from an open distribution directory containing versions v1 through v9) as previously used in state-sponsored intrusions exploiting a "React2Shell" flaw and since adopted by multiple unrelated threat actors — and already flagged by this pipeline on 2026-08-23 (Red Canary's August monthly threat-intelligence round-up) as one of several malware families that resolve C2 from a public-blockchain dead drop. Microsoft's Sept-2 report supplies a materially deeper technical picture of a live delivery chain and full post-compromise playbook (MSI/Node.js staging, ADSI-based AD reconnaissance, WinRM pivot to domain controllers and CAs) than either prior mention captured.
