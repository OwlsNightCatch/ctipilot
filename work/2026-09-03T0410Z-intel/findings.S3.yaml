  - title: "EtherRAT gains a new delivery chain: Teams helpdesk-impersonation vishing installs the Node.js RAT via a silent MSI, then pivots over WinRM straight to domain controllers and certificate authorities"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/02/impersonating-it-support-threat-actors-turn-remote-session-into-enterprise-wide-access/", publisher: "Microsoft Threat Intelligence", date: "2026-09-02", role: "primary" }
