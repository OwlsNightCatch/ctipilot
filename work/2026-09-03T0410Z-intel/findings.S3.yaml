    extended_notes: |
      Very strong fit for this constituency: the campaign specifically weaponises the trust of government (.gov) domains at every administrative tier (federal ministry, state legislative assembly, state court of accounts, state utility, municipal administrations) — precisely the class of infrastructure (cantonal/communal Swiss public-sector web presence) this brief exists to protect, even though the observed victims are Brazilian. Check Point's own defender guidance (audit Apache modules/timestamps, watch for stripped CSP headers on specific paths, hunt masqueraded processes) is directly actionable. Initial access vector was not observed by Check Point; the finding is squarely about post-compromise infrastructure abuse.

  - title: "MoiClient: an invoice-themed backdoor chains BYOVD (a vulnerable Lenovo PC Manager driver) with an RPC-based UAC bypass to kill security products and hide its own C2 from the OS network stack"
    sources:
      - { url: "https://asec.ahnlab.com/en/95211/", publisher: "AhnLab ASEC", date: "2026-09-01", role: "primary" }
    discovery_trace: "first seen at: ahnlab-asec, URL https://asec.ahnlab.com/en/ (listing) → primary: AhnLab ASEC, URL https://asec.ahnlab.com/en/95211/"
    summary: |
      AhnLab's ASEC documents "MoiClient" (named for the "moimoi" string in its BYOVD component), distributed as a .vhdx file disguised as an invoice email attachment: the archive contains `Invoice.Pdf.Exe` (actually the legitimate SumatraPDF viewer, used to DLL-sideload a same-directory malicious `uxtheme.dll`) plus hidden support files. Once loaded, MoiClient fetches an in-memory second-stage payload from its C2 — identified as "MoiXD Stealer", a browser-credential stealer using a ChromeElevator-style technique. Execution moves into a legitimate process via classic process hollowing: MoiClient spawns `explorer.exe` suspended, overwrites its entry point with shellcode from a co-located `data.dat`, and lets that shellcode run the next injection stage. For privilege escalation, MoiClient abuses an RPC-based UAC-bypass technique resembling the AppInfo local-RPC interface technique documented by Google Project Zero in 2019: it connects to the AppInfo Service over `ncalrpc`, launches `winver.exe` as a debug target to obtain a debug-object handle, then drives `ComputerDefaults.exe` (a system binary that auto-elevates) through the same RPC path, clones its process handle, and sets that cloned handle as the parent of subsequent `sc.exe`/PowerShell processes so they inherit elevated privileges — a UAC bypass with no user prompt. With elevated rights, MoiClient drops a vulnerable Lenovo PC Manager kernel driver (`BootRepair.sys` v2.5.30.11281) under the name `moimoi.sys`, registers and starts it as a kernel service, and uses its device interface (`\\.\BootRepair`) to pass PIDs of running security-product processes for forced termination — targeting Windows Defender, Malwarebytes, Bitdefender, Kaspersky, Avast, AVG and McAfee by process name. A separate technique specifically neutralises Windows Defender: MoiClient downloads `defendnot.dll`/`defendnot-loader.exe` from its C2 and runs them via the elevated PowerShell session. Persistence is a Task Scheduler job (named `MicrosoftWindowsUpdateTask<4-digit>`, or the existing task name with a trailing period appended if one already exists) that fires every 30 minutes, re-launching the renamed SumatraPDF binary (`demo.exe`) to re-trigger the DLL sideload chain.
    region_nexus: "Korea-focused per AhnLab's telemetry; technique chain (BYOVD + RPC-based UAC bypass + DLL sideload) is globally transferable"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566.001, T1574.001, T1055.012, T1548.002, T1685, T1053.005, T1555.003]
    affected_products: ["Microsoft Windows", "Lenovo PC Manager (BootRepair.sys driver)"]
    entity_keys: []
    new_entities:
      - { key: "malware:moiclient", type: malware, name: "MoiClient",
          summary: "Backdoor named by AhnLab ASEC for the 'moimoi' string in its BYOVD component; delivered as an invoice-themed .vhdx exploiting DLL sideloading via a repackaged SumatraPDF, using an RPC-based UAC-bypass technique and a vulnerable Lenovo PC Manager driver (BootRepair.sys) to kill security products, and fetching an in-memory 'MoiXD Stealer' browser-credential-theft payload (AhnLab ASEC, 2026-09-01)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "MoiClient uses the ncalrpc protocol sequence to connect to the RPC interface of the AppInfo Service, then executes winver.exe as a debug target and acquires the debug object handle."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95211/"
      - quote: "version 2.5.30.11281 of BootRepair.Sys—a vulnerable driver in Lenovo PC Manager—was exploited. MoiClient creates this driver in the %Public% path under the name moimoi.sys"
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95211/"
      - quote: "The registered task runs every 30 minutes. At that time, SumatraPDF—named \"demo.exe\"—is launched, and \"uxtheme.dll,\" which is located in the same path and is actually MoiClient, is reloaded."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95211/"
    extended_notes: |
      Single-source (AhnLab only) — no independent corroboration found this run; flagged accordingly. AhnLab's IOC/hunt list is unusually complete for a defender: check for unintended explorer.exe processes, the specific Task Scheduler command line (`%LOCALAPPDATA%\demo.exe -print-to-default -silent file.pdf`), and the named files under %Public%/%LOCALAPPDATA%.

  - title: "Kimsuky's seafood-invoice LNK campaign abuses Backblaze B2 cloud storage as C2 and exfiltration infrastructure, keyed by victim BIOS serial number"
    sources:
      - { url: "https://asec.ahnlab.com/en/95217/", publisher: "AhnLab ASEC", date: "2026-09-01", role: "primary" }
    discovery_trace: "first seen at: ahnlab-asec, URL https://asec.ahnlab.com/en/ (listing) → primary: AhnLab ASEC, URL https://asec.ahnlab.com/en/95217/"
    summary: |
      AhnLab ASEC attributes a new malicious-LNK campaign to Kimsuky based on code and behavioural overlap with prior Kimsuky LNK operations (PowerShell extraction syntax, fixed-offset data extraction from the LNK, Task Scheduler registration pattern). The lure is a spearphishing attachment named "[Royal Hotel Seoul] Request for Review of Seafood Ingredient Purchases.LNK". Running it uses PowerShell to extract embedded data: it drops a legitimate-looking decoy .hwp document at the same path (displayed to the victim) while simultaneously writing an XOR-encrypted ZIP to `C:\ProgramData\systmp\sunshine`, containing a PowerShell script `termsvc.ps1` and a JScript file `poc.js` (saved as `C:\ProgramData\systmp\ping_<first 4 chars of a UUID>.js`, with supporting files under `C:\ProgramData\video`). Persistence is a Scheduled Task named `MicrosoftOffice2016_<first 4 chars of UUID>` that runs the JS file via `wscript.exe` roughly every 14 minutes; the JS is obfuscated, checks for `termsvc.ps1`, and bypasses the PowerShell execution policy to run it hidden. `termsvc.ps1` collects OS name/architecture, system timezone, public IP (queried via `api.ipify.org`), username/domain, running-process list (via `tasklist`) and computer name, then authenticates to the Backblaze B2 API and uploads the collected data to a per-victim path keyed on the BIOS serial number — using a legitimate cloud-storage service as C2 infrastructure rather than attacker-registered domains. It then polls the same B2 path for a follow-up command file (`aaa`), saves it under an arbitrary name as a `.cmd` in `%TEMP%`, executes it via `cmd.exe /c` in hidden mode, and deletes the local copy roughly 120 seconds later. The actor deletes the original LNK and the intermediate "sunshine" file during execution to remove traces, leaving only the components needed for the persistence loop.
    region_nexus: "Korea (business-lure targeting); Kimsuky is a persistent European/global espionage threat per prior reporting"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1204.002, T1059.001, T1059.007, T1053.005, T1102, T1082, T1057, T1016.001, T1070.004, T1027]
    affected_products: ["Microsoft Windows"]
    entity_keys: ["actor:kimsuky"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "In this attack, Backblaze B2 was used not merely as a file storage space but as a C2 infrastructure to exfiltrate information from infected PCs and relay follow-up commands."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95217/"
      - quote: "Based on such similarities in code and behavior, AhnLab determined that this malicious LNK is also linked to the Kim Sukki group."
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95217/"
      - quote: "it is configured to execute ping_<FIRST 4 digits of UUID>.Js approximately every 14 minutes via wscript.Exe"
        attribution: "AhnLab ASEC"
        source_url: "https://asec.ahnlab.com/en/95217/"
    extended_notes: |
      Single-source (AhnLab only). The reusable detection hook is the abuse pattern itself: authenticated outbound HTTPS traffic to Backblaze B2 API endpoints from a workstation with no legitimate backup/storage use case, alongside a Scheduled Task invoking wscript.exe against a script under C:\ProgramData at a short (~14 min) interval — both are hunt queries that generalise beyond this specific campaign to "legitimate cloud storage service abused as C2," a pattern increasingly common across unrelated actors.

  - title: "UK Supreme Court removes state immunity as a bar to spyware-victim lawsuits against foreign governments (Shehabi v. Bahrain)"
    sources:
      - { url: "https://citizenlab.ca/uk-supreme-court-opens-door-for-spyware-victims-to-sue-foreign-states/", publisher: "Citizen Lab", date: "2026-09-02", role: "primary" }
      - { url: "https://www.lawfaremedia.org/article/u.k.-supreme-court-opens-door-for-spyware-victims-to-sue-foreign-states", publisher: "Lawfare", date: "2026-09-02", role: "primary" }
    discovery_trace: "first seen at: citizen-lab, URL https://citizenlab.ca/feed/ → primary: Citizen Lab, URL https://citizenlab.ca/uk-supreme-court-opens-door-for-spyware-victims-to-sue-foreign-states/ → primary analysis: Lawfare, URL https://www.lawfaremedia.org/article/u.k.-supreme-court-opens-door-for-spyware-victims-to-sue-foreign-states"
    summary: |
      The UK Supreme Court ruled in *The Kingdom of Bahrain v. Shehabi and another*, holding that Bahrain is not immune from litigation over its use of FinSpy spyware against two Bahraini dissidents living in the UK who allege resulting psychological harm. Citizen Lab researchers (writing in Lawfare) characterise the ruling as removing "the blunt defense of state immunity" at the jurisdictional stage for this class of claim, giving exiles and other targets in the UK greater certainty that civil claims against foreign states for spyware-enabled hacking are viable — a step toward legal accountability for state-sponsored device compromise. The case now returns to the UK High Court, where attribution, causation and injury still have to be proven on the merits; the ruling only removes the jurisdictional immunity defence.
    region_nexus: "UK jurisdiction; precedent relevant to any European state (including Switzerland) considering exposure to, or victims of, foreign-state spyware operations"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "by removing the blunt defense of state immunity from these cases, the U.K. Supreme Court has dealt a meaningful victory to individuals and organizations fighting spyware and other forms of digital transnational repression"
        attribution: "Citizen Lab (Siena Anstis, Natalia Krapiva, Kate Pundyk, via Lawfare)"
        source_url: "https://citizenlab.ca/uk-supreme-court-opens-door-for-spyware-victims-to-sue-foreign-states/"
    extended_notes: |
      No attacker TTP content — legal/policy item, included for situational awareness on the mercenary-spyware accountability landscape rather than technical actionability. Low priority; borderline relevance to a highly technical SOC audience, included because it is a substantive legal development directly about state-sponsored device compromise (Citizen Lab's core beat) and genuinely fresh (published within window). Mark borderline for the main agent's final call.
    borderline: true
    borderline_reason: "legal/policy development with no technical TTP or detection content for a highly technical SOC audience; included for situational-awareness value on spyware accountability"

