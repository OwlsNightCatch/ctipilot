items:
  - title: "Suspected breach at identity-verification vendor IDScan.net puts 153M+ US/Canadian driver's-license scans up for sale, including federal-employee CAC-linked records"
    sources:
      - { url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/", publisher: "KrebsOnSecurity", date: "2026-09-01", role: "primary" }
      - { url: "https://cyberinsider.com/153-million-drivers-licenses-exposed-in-suspected-idscan-breach/", publisher: "CyberInsider", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: cyberinsider (rotation source-id), URL https://cyberinsider.com → article https://cyberinsider.com/153-million-drivers-licenses-exposed-in-suspected-idscan-breach/ → primary: KrebsOnSecurity, URL https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
    summary: |
      A dark-web identity-theft marketplace called Nexus surfaced on the Russian cybercrime forum Exploit on 2026-08-31, advertising digital scans of more than 153 million US and Canadian driver's licenses (the seller claimed over 170 million people), plus 10M+ other ID cards, 3M+ travel/international documents and 579,000 medical cards. Brian Krebs (KrebsOnSecurity) traced the source by using his own license — offered as a free sample by the seller — and confirming with nine other individuals that image timestamps matched real-world moments they had presented a driver's license, most commonly at Hertz rental counters and at IDScan-instrumented venues (a Planet13 cannabis dispensary in one case). Each record carries front/back plus infrared and ultraviolet scan images with GMT timestamps, matching the scanning modality IDScan.net documents for its own identity-verification technology, which the vendor says processes 21M+ verifications/month across 20,000+ locations for customers including Hertz, Target, FedEx, Motorola Solutions, Jack Henry and Caesars Entertainment. The seller's own claim: "We have been continuously exfiltrating new data for over a year into our private database" — records grew by ~400,000 in the 24 hours Krebs monitored the service. Nexus also reportedly held records for senior US officials (Defense Secretary Pete Hegseth) and an FBI assistant director, with some entries labelled "CAC" (Common Access Card, the US federal PIV-equivalent credential). The FBI's New Orleans field office opened a formal investigation on 2026-09-01. IDScan.net's own written notice to a business customer (obtained by a reader and independently forwarded), dated 2026-09-02, states it "received information suggesting that certain information may have been exposed and that IDScan.net may be implicated" and has activated incident-response procedures, engaged outside counsel and an independent forensic firm, and is coordinating with law enforcement — but has "not reached conclusions regarding the nature or scope of the incident." The Nexus site went offline shortly after Krebs's story published (2026-09-01, ~20:56 ET), replaced with a "no longer available" message. No initial-access vector, intrusion technique or attacker attribution has been disclosed by IDScan, the FBI, or any investigator — the "over a year" exfiltration duration is the criminal seller's own unverified claim.
    region_nexus: "global (US/Canada primary victim population); transferable to any government or public-sector body relying on a third-party identity-verification vendor for ID document scanning/validation"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1213]
    affected_products: ["IDScan.net identity-verification platform"]
    entity_keys: []
