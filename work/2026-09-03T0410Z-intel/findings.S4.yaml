      - { key: "incident:idscan-nexus-drivers-license-breach-2026-09", type: incident, name: "IDScan.net / Nexus driver's-license marketplace breach (September 2026)", aliases: ["Nexus identity theft service"], summary: "Suspected ongoing breach at Louisiana-based identity-verification vendor IDScan.net, surfaced via a dark-web marketplace (Nexus) selling 153M+ US/Canadian driver's-license scans and other ID documents; FBI investigation opened 2026-09-01 (KrebsOnSecurity, 2026-09-01)." }
