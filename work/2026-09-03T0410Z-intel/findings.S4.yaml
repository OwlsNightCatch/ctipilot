      - quote: "A new identity theft service launched on the dark web this week is selling digital scans of more than 153 million drivers licenses from people in the United States and Canada."
        attribution: "KrebsOnSecurity"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
      - quote: "We have been continuously exfiltrating new data for over a year into our private database."
        attribution: "Nexus marketplace operator, quoted by KrebsOnSecurity"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
      - quote: "Earlier today, September 1, we received information suggesting that certain information may have been exposed and that IDScan.net may be implicated."
        attribution: "IDScan.net customer notification, reproduced in KrebsOnSecurity reader comments"
        source_url: "https://krebsonsecurity.com/2026/09/fbi-probes-service-selling-153m-drivers-licenses/"
    extended_notes: |
      Confidence held at MEDIUM rather than HIGH: scale (153M/170M) and sourcing are the criminal seller's own claims, corroborated only indirectly (Krebs's own license plus nine volunteers' timestamp matches, not an independent forensic count); IDScan itself has confirmed only that it is investigating, not that a breach occurred or its scope. No CVE, no named threat actor/cluster, no ransomware family — this is a data-broker/identity-verification-vendor concentration-risk story, not an exploit narrative. Relevance for this constituency: government and cantonal e-government/ID-verification workflows that outsource document-scanning/liveness-check functions to third-party IDV vendors carry the same concentration risk this incident demonstrates — a single compromised IDV vendor exposes a cross-sector population regardless of which relying party asked for the ID check. No home-region victims identified in any source.
    borderline: true
    borderline_reason: "No Swiss/EU nexus stated in any source; carried under PD-11(a) genuinely-global-scale (153-170M identity documents, systemic IDV-vendor concentration-risk lesson) rather than a direct constituency hit — main agent should confirm this clears the bar over a narrower US-only breach."

