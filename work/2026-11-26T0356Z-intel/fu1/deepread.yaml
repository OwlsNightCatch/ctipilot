  claims:
  - topic: mechanism
    kind: fact
    claim: 'Juniper (CNA text via ENISA EUVD): OS command injection (improper neutralization) in the AutomatedProvisioner of Session Smart Conductor; remote, root, trigger is a crafted salt minion ID.'
    source_url: https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-112215
    file: euvd_EUVD-2026-112215.json
    quote: An Improper Neutralization of Special Elements used in an OS Command vulnerability in the AutomatedProvisioner in Juniper Networks Session Smart Conductor allows a remote attacker to execute arbitrary commands as root via a specially crafted salt minion ID.
  - topic: mechanism
    kind: fact
    claim: 'CISA KEV wording is broader than the CNA: it names Conductor AND Router; the CNA, the EUVD product list, KISA (via braindetox) and the CNA solution text name only Session Smart Conductor as affected by this CVE.'
    source_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    file: kev_CVE-2026-103406.json
    quote: Hewlett Packard Enterprise (HPE) Juniper Session Smart Conductor and Session Smart Router contain an OS command injection vulnerability that could allow a remote attacker to execute arbitrary commands as root via a specially crafted salt minion ID.
  - topic: affected_versions
    kind: fact
    claim: 'Juniper CNA record, solution field: the fix text names Session Smart Conductor only (the 17 sibling CVEs that touch the Router read ''Session Smart Router and Session Smart Conductor'' or ''Session Smart Router'').'
