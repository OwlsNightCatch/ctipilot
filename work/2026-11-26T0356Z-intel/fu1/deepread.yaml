  triage_discriminator:
    supported: partially, by mechanism only
    text: Legitimate router registration with a Conductor carries a router-name style minion ID; the CNA states the exploit rides in a 'specially crafted salt minion ID', so a minion ID or registration event carrying shell metacharacters or command-substitution syntax, or a shell or interpreter spawned by the Conductor's provisioning or salt services as root, is the discriminating signal. This follows from the stated mechanism; no source publishes an indicator or names the log source. Mark as inference if used, or omit.
