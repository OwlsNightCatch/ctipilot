  cves_note: type 'injection' and 'privilege-escalation' and auth 'local-user' and 'not-stated' used in the findings.S1.yaml cve_table are NOT in site/taxonomy.yaml (content_model.validate_entry rejects them); the values above are taxonomy-valid. Three records (CVE-2026-124839, -124843, -124841) carry an auth_note because the vendor states no privilege.
  techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    evidence: Vendor describes unauthenticated requests to the GINA login page and the GINA upload and reset functions; SEPPmail documentation describes the GINA web interface as what external recipients use.
    confidence: high
  - id: T1078
    name: Valid Accounts
    evidence: 'Account takeover rows (CVE-2026-130637, CVE-2026-124840, CVE-2026-124842): the attacker ends up controlling a registered GINA account (''take it over'', ''replace the password''). T1098 Account Manipulation was considered and not preferred because the flaws are the route to the takeover, not persistence on an attacker-owned account.'
    confidence: medium
  - id: T1059.004
    name: Unix Shell
    evidence: 'CVE-2026-124839: vendor fix text ''The account address is no longer passed to a shell command.'''
    confidence: high for the row
  - id: T1068
    name: Exploitation for Privilege Escalation
    evidence: 'CVE-2026-124838: the local socket open to all local users lets an attacker with local code execution run commands with elevated privileges.'
    confidence: high for the row
  - id: T1499
    name: Endpoint Denial of Service
    evidence: 'CVE-2026-124844: unauthenticated uploads not removed ''could allow an attacker to fill up the disk''. Optional (no sub-technique fits cleanly).'
    confidence: low-medium, optional
  - id: T1684.002
    name: Email Spoofing
    evidence: 'CVE-2026-124837: a crafted DKIM signature injects forged results into Authentication-Results under the gateway''s ARC seal. T1672 is REVOKED in the pinned v20.1 dataset and forwards to T1684.002. Optional.'
    confidence: low-medium, optional
  triage_discriminators:
  - cve: CVE-2026-124842
    text: The vendor fix says the unauthenticated reset now runs only for unregistered accounts, so an unauthenticated reset of an UNREGISTERED GINA account (a new external recipient setting a first password) is the legitimate lookalike; a reset that takes effect on an already registered account without the security-question step is the abuse. Supported by the vendor's own fix description.
  - cve: CVE-2026-124840
    text: Security-question recovery legitimately creates a recovery session; the abuse is that same session being accepted by registration or settings (password-change) workflows. Which log fields show the session purpose is not stated; mark any detection as inference.
  registry:
    existing_key: product:seppmail-secure-e-mail-gateway (name 'SEPPmail Secure E-Mail Gateway', no aliases, first_seen 2026-05-09)
    naming_note: Use the registry spelling 'SEPPmail Secure E-Mail Gateway' in affected_products; findings.S1.yaml uses 'SEPPmail Secure Email Gateway'. SEPPmail's own docs write 'SEPPMAIL Secure E-Mail Gateway'. Optionally add that spelling as an alias.
    propose: []
  dedup:
    cve_grep_entries: none of the eleven CVE ids appears in any file under entries/
    prior_coverage_14d: no SEPPmail record in the 14-day index (the 15.1.1 entry is 21 days old)
    related_existing: 2026-11-05/seppmail-gateway-15-1-1-unauth-root-rce-and-file-access
  unknowns:
  - CVSS version and vectors of the vendor scores (no CNA record yet).
  - Whether each flaw exists in 15.0.x (no fix will ship; the vendor range is '<15.1.2').
  - Whether SEPPmail Cloud instances were patched or are affected (not stated on any page).
  - 'Exploitation, proof of concept, scanning: none stated by any source.'
  - Which template engine is meant, and the exact request fields (not stated).
  - Whether a given deployment exposes the GINA login page to the internet (documentation says GINA is the recipient-facing interface by design).
item3_1password_github_account_compromise:
  title: 1Password employee GitHub account compromise (disclosed 2026-11-25)
  primary_read:
    url: https://1password.com/blog/update-on-nov-2026-security-incident
    result: 'read in full with extract (5,637 bytes, saved fu1/1p_primary.md); refetched about 15 minutes later: body identical. The post is headed ''November 25, 2026 - 4 min'', carries no revision log and ends ''We''ll keep this blog post current''.'
    post_text_differs_from_press: 'BleepingComputer and Born''s IT blog attribute to 1Password statements that are NOT in the post as it reads now: ''restored clean versions of affected services'' (BC and Born), ''only a small number of users were affected'' (BC) and ''a limited number of customer account data of a subset of customers'' (Born). The simplest explanation is that the post was edited after first publication on 2026-11-25; I could not retrieve an earlier snapshot (Wayback is blocked from this egress and from WebFetch). Treat those press wordings as press-relayed, not as 1Password statements.'
  claims:
  - topic: vector
    kind: fact
    claim: '1Password: investigation began 2026-11-19 on indications that an attacker had access to an employee''s corporate GitHub account.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: On November 19, 2026, 1Password began investigating indications that an attacker gained access to an employee’s corporate GitHub account.
  - topic: vector
    kind: fact
    claim: 'The only statement on the means of compromise is that a token was stolen and attacker-created access was removed. Token type, theft method, whether SSO or MFA covered the account: not stated.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Disabled the affected GitHub account, revoked the stolen token, and removed the access the attacker created.
  - topic: mechanism
    kind: fact
    claim: Account used to read source code and push malicious code to backend services, which downloaded administrative data about customers.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: The actor used the account to access source code and push malicious code to backend services, which downloaded administrative data pertaining to our customers.
  - topic: mechanism
    kind: fact
    claim: Source copied from private repositories; CI/CD system accessed.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: The attacker also copied source code from private repositories and gained access to our CI/CD system.
  - topic: mechanism
    kind: fact
    claim: CI/CD holds infrastructure secrets; every credential that may have been exposed was rotated; 1Password states no impact to services, availability or product security.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: CI/CD contains infrastructure related secrets in order for our product to work. We have triggered a rotation of all credentials which may have been exposed, and there is no impact to 1Password’s services, availability, or product security.
  - topic: data
    kind: fact
    claim: Records downloaded for a subset of users (size of the subset not stated).
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: The attacker downloaded account records for a subset of our users.
  - topic: data
    kind: fact
    claim: Data class 1.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Names and email addresses'
  - topic: data
    kind: fact
    claim: Data class 2.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Account and user identifiers, and account creation and last sign-in times'
  - topic: data
    kind: fact
    claim: Data class 3 (public keys).
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Public keys (which are public by design, this has no impact to user security)'
  - topic: data
    kind: fact
    claim: Data class 4 (SRP parameters); 1Password says they cannot be used to access an account.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: protocol parameters (which cannot be used to access your account)
  - topic: data
    kind: fact
    claim: 'Data class 5: tokens in certain emailed invitation, provisioning and account-recovery links.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Tokens present in certain emailed links for invitations, provisioning and account recovery'
  - topic: data
    kind: fact
    claim: 'Data class 6: internal architecture metadata.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Other non-secret account metadata relative to our internal architecture (e.g. version numeric identifiers, file numeric identifiers)'
  - topic: data
    kind: fact
    claim: Provisioning invites are the SCIM Bridge and Hosted Provisioning flows; a small number of users in that state at the time were notified directly. This 'small number' refers to users with a pending invite or recovery, NOT to the size of the affected subset.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: During this incident there were a small number of users in this state, who have been specifically notified.
  - topic: token_controls
    kind: fact
    claim: 'A token alone cannot complete an invitation or recovery: it needs an SSO sign-in or a six-digit code sent to the registered address.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: This token is used to complete the invitation or recovery process, but only when combined with an SSO sign-in or a six digit code sent to the user's registered email address.
  - topic: code_length_change
    kind: fact
    claim: 'Code length change: six numeric digits to ten alphanumeric characters (the post uses ''digits'' in one sentence and ''characters'' in another), as a precaution against guessing.'
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: we’ve expanded the code from six numeric digits to ten alphanumeric digits.
  - topic: code_length_change
    kind: fact
    claim: Same change in the action list.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Lengthened the codes used in invitation and recovery emails from six digits to ten characters as a precautionary measure.
  - topic: no_takeover_evidence
    kind: claim
    claim: 1Password says it validated no internal evidence of account takeover using exposed provisioning tokens (an assertion by the victim; no independent check yet).
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Validated no internal evidence of user account takeovers or compromise using any exposed account provisioning tokens.
  - topic: not_affected
    kind: fact
    claim: Vault contents.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: At no time were customer vault contents accessed by, or available to, the attacker.
  - topic: not_affected
    kind: fact
    claim: Vault items.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Your vaults and the items in them'
  - topic: not_affected
    kind: fact
    claim: Recovery keys.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- Account recovery keys'
  - topic: not_affected
    kind: fact
    claim: Apps and extensions.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: '- 1Password apps and browser extensions'
  - topic: vendor_actions
    kind: fact
    claim: Containment steps.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Disabled the affected GitHub account, revoked the stolen token, and removed the access the attacker created.
  - topic: vendor_actions
    kind: fact
    claim: Hardening and detections.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Tightened internal GitHub, CI/CD, and endpoint controls, and added new detections for this kind of attack.
  - topic: vendor_actions
    kind: fact
    claim: External validation.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Brought in independent cybersecurity experts to validate our containment approaches and remediation efforts.
  - topic: customer_actions
    kind: fact
    claim: The only customer guidance is phishing caution; no password, Secret Key or token reset is requested in the post.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: Be cautious about phishing attempts in the form of unexpected emails, texts or calls that mention 1Password, invitations, or account recovery attempts.
  - topic: customer_actions
    kind: fact
    claim: Never-ask statement.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: 1Password will never contact you to ask for your account password or Secret Key.
  - topic: customer_actions
    kind: fact
    claim: Reporting address.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: If you see something suspicious, tell us at support@1password.com.
  - topic: update_policy
    kind: fact
    claim: The post is a living document.
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
    file: 1p_primary.md
    quote: We’ll keep this blog post current, and we’ll update it if we find anything that changes what we’ve said here.
  - topic: press_only
    kind: press-only
    claim: BleepingComputer attributes to 1Password that clean versions of affected services were restored; the post as read does not say this.
    source_url: https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/
    file: 1p_bc.md
    quote: restored clean versions of affected services
  - topic: press_only
    kind: press-only
    claim: 'BleepingComputer: ''only a small number of users were affected''; the post limits ''small number'' to users with pending invites or recoveries and gives no figure for the affected subset.'
    source_url: https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/
    file: 1p_bc.md
    quote: The company says only a small number of users were affected and have been individually notified.
  - topic: press_only
