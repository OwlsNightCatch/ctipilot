    text: '1Password''s guidance names the lookalike: invitation, provisioning and account-recovery messages are legitimate only when someone on the customer side requested them (an admin invited a user, a user started recovery). An invitation, recovery email or six-digit code that nobody requested is the signal the vendor itself says to treat as phishing. Anything beyond that (specific sender domains, log fields) is not stated.'
