    epss: null
    type: auth-bypass
    vector: zero-click
    auth: pre-auth
    status:
    - patch-available
    affected: SEPPmail Secure E-Mail Gateway before 15.1.2 (no 15.0.x fix; 15.0.x exposure not stated); GINA login page, request values processed by the template engine, read attributes of any GINA account and take it over
    fixed: 15.1.2 (patch release of 2026-11-24)
    type_note: template processing of request values; the vendor's stated outcome is account read and takeover, hence auth-bypass; not rce because the vendor does not claim code execution
  - id: CVE-2026-124840
    cvss: 9.2 (vendor page)
    epss: null
    type: auth-bypass
    vector: zero-click
    auth: pre-auth
    status:
    - patch-available
    affected: before 15.1.2; GINA, a security-question recovery session also accepted by registration and settings workflows; the attacker must know the security answer
    fixed: 15.1.2
    auth_note: no session needed but the victim's security answer is a precondition; the vendor does not call it unauthenticated
  - id: CVE-2026-124843
    cvss: 9.2 (vendor page)
    epss: null
