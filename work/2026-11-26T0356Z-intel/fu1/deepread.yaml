  stated_by_1password_only:
  - 2026-11-19 start of investigation; employee corporate GitHub account; stolen token revoked; attacker-created access removed
  - malicious code pushed to backend services that downloaded customer administrative data; subset of users; the six data classes
  - private-repository source copied; CI/CD accessed; all possibly exposed credentials rotated; no impact on services, availability or product security
  - vaults, vault keys, account recovery keys, apps and browser extensions not affected
  - token plus SSO or six-digit code needed; code lengthened to ten characters; no internal evidence of takeover with exposed tokens
  - controls tightened, new detections added, independent experts engaged; customer action limited to phishing caution
  stated_by_press_only:
  - restored clean versions of affected services (BC, Born)
  - only a small number of users affected (BC; conflates the pending-invite group with the affected subset)
  - no password or Secret Key change required (BC, heise, Born)
  - supply-chain characterization (heise); phishing-list value of the stolen data (BC)
  - that 1Password had not answered BC's questions at publication (BC)
  unknowns:
  - How the employee's GitHub token or account was obtained (phishing, infostealer, leaked PAT, OAuth app, session theft) and whether SSO or MFA covered it.
  - When the attacker first had access, when malicious code was pushed and removed, how long it ran, and how it was detected (post says only 'indications').
  - Which backend services were altered, whether the export ran through CI/CD deployment or a different path, and which data stores were queried.
  - How many users are in the affected subset, how many were notified, which plans (Business, Enterprise, Families) and regions (including Switzerland and the EU) are included.
  - What 'non-secret internal metadata' contains beyond the example (version and file numeric identifiers).
  - 'Attribution: no actor, motive or extortion claim is reported by any source.'
  - 'Whether any build or release artifacts were verified clean: the post says apps and extensions were not affected and product security is unaffected, but states no integrity verification method.'
  - Whether regulators or data-protection authorities were notified (not stated).
