  cves_note: 'All 18 records read from Juniper''s CNA container (advisory JSA112183, discovery INTERNAL, CNA workaround: ''There are no known workarounds for this issue.'' for 17, ''No available workarounds exist for this issue.'' for CVE-2026-103406). Juniper''s CNA exploitation statement for the other 17 is ''Juniper SIRT is not aware of any malicious exploitation of this vulnerability.'' Recommended entry scope: the KEV CVE, CVE-2026-103409 and the 8.8 group; the nine below 8.0 can be listed by id and score only. Only CVE-2026-103406 is KEV-listed (verified against the full KEV catalogue: no other Session Smart CVE).'
  techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    evidence: 'CNA: remote attacker, no privileges, no interaction (AV:N/PR:N/UI:N); Juniper documentation says the most conventional Conductor deployment is reachable on a public IPv4 address; CISA lists it as exploited.'
    confidence: medium-high (internet reachability of a given Conductor is deployment-specific)
  - id: T1059.004
    name: Unix Shell
    evidence: 'CNA: arbitrary commands as root via a crafted minion ID (OS command injection, CWE-78 in the KEV record); BSI lists the affected platform as ''Juniper Appliance, Linux''.'
    confidence: medium (mapping of OS command injection on a Linux appliance; sources do not name the shell)
  registry:
    existing_keys: []
    grep_result: no Juniper, Junos or Session Smart product in entities/registry.yaml (only HPE Aruba/ClearPass/iLO products); no actor or campaign for this activity (none named by any source)
    propose:
    - key: product:juniper-session-smart-conductor
      type: product
      name: Juniper Session Smart Conductor
      aliases:
      - Session Smart Conductor
      - Juniper Networks Session Smart Conductor
      - HPE Juniper Session Smart Conductor
      summary: Management and orchestration component of Juniper's Session Smart (SSR) SD-WAN routing product line, which also runs a salt master for its routers; CVE-2026-103406 (AutomatedProvisioner command injection) is on CISA KEV since 2026-11-25 (CISA, Juniper CNA).
    - key: product:juniper-session-smart-router
      type: product
      name: Juniper Session Smart Router
      aliases:
      - Session Smart Router
      - SSR
      - Juniper Networks Session Smart Router
      - HPE Juniper Session Smart Router
      summary: Juniper's Session Smart (SSR) software router; 17 of the 18 CVEs of Juniper bulletin JSA112183 affect it, fixed in 7.0.5, 7.1.7 and 7.2.3 (Juniper CNA, BSI).
  dedup:
    cve_grep_entries: 'grep -rl for all 18 CVE ids over entries/: no hits'
    prior_coverage_14d: no record mentions Juniper, Session Smart, JSA112183 or CVE-2026-103406
    related_existing: entries/2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171.md mentions Juniper only incidentally (HPE advisory text), not this finding; no reference needed
  corrections_to_findings_S1:
  - 'Juniper''s exploitation statement IS now sourced: the Juniper CNA record (updated 2026-11-24) and BSI revision 2 (2026-11-24) both state exploitation before CISA''s KEV listing; S1 had only CISA and EUVD.'
  - KEV names Conductor and Router, but the Juniper CNA lists only Session Smart Conductor as affected by CVE-2026-103406.
  - 'EPSS: FIRST gives 0.0086 (percentile 0.56) on 2026-11-25; EUVD''s 0.52 is not an EPSS probability.'
  - S1's bulletin count of 18 is right (BSI, NCSC-NL, Juniper CNA); KISA via braindetox lists ten.
  - Juniper states no workaround for CVE-2026-103406 yet also says 'take steps to mitigate'; the two statements are unreconciled in the CNA text.
  unknowns:
  - Juniper's bulletin page text (workaround detail beyond the CNA, modification history, any Conductor exposure condition, fix-table notes, severity wording) was not read.
  - Which Conductor interface or service parses the minion ID, and whether it is reachable only from enrolled routers or from any network host.
  - Date of first exploitation, number of exploited Conductors, victims, actor, and the post-exploitation behaviour.
  - Whether Swiss public-sector networks run Session Smart (no source says).
  - Whether 6.x and older Conductor releases are supported or simply affected with no fix (the CNA range starts at 0).
item2_seppmail_gateway_15_1_2:
  title: SEPPmail Secure E-Mail Gateway patch release 15.1.2 of 2026-11-24
  primary_pages:
  - url: https://docs.seppmail.com/en/20_revision-history.html
    note: Revision history, section 'Patch release 15.1.2, 2026-11-24' (read in full with extract, saved fu1/seppmail_revhist.md, 244 kB)
  - url: https://downloads.seppmail.com/extrelnotes/151/ERN15.1.html
    note: 'Extended release notes 15.1, page titled ''15.1.2 Patch Release'': same eleven security rows, same text and scores, plus internal reference numbers and two extra REST notes (second SEPPmail page, same assessor, not independent)'
  - url: https://seppmail.statuspal.eu/info_notices/257218
    note: 'SEPPmail Statuspal information notice ''New Appliance Release 15.1.2'' (the customer-and-partner push channel): repeats the revision-history text including the security rows; not labelled as a security notice in its title'
  vendor_rows_exact:
  - cve: CVE-2026-130637
    score_as_written: '9.3'
    description: Request values reflected on the GINA login page were processed by the template engine, which could allow an unauthenticated attacker to read attributes of any GINA account and take it over.
    fix: Values supplied with the request are no longer expanded as template placeholders.
  - cve: CVE-2026-124840
    score_as_written: '9.2'
    description: In GINA, a session created by answering the security question was also accepted by the account registration and settings workflows. An attacker who knows the security answer could replace the password and take over the account.
    fix: Security question recovery now uses a separate session purpose that is only accepted by the recovery workflow.
  - cve: CVE-2026-124843
    score_as_written: '9.2'
    description: If the appliance-specific key material could not be loaded, a hard-coded fallback secret was used for cryptographic operations, which could allow encrypted Large File Transfer attachments to be decrypted outside the appliance.
    fix: Large File Transfer encryption no longer falls back to the hard-coded secret and is refused if the required key is not available.
  - cve: CVE-2026-124844
    score_as_written: '8.7'
    description: Files uploaded to GINA by unauthenticated requests were not removed, which could allow an attacker to fill up the disk.
    fix: Uploads are limited to the maximum message size of the GINA domain, and upload files not used by the request are removed.
  - cve: CVE-2026-124838
    score_as_written: '8.5'
    description: The local socket of the configuration service was accessible to every local user, which could allow an attacker with local code execution to run commands with elevated privileges.
    fix: Access to the socket is restricted to authorized system accounts, and command data passed to the configuration service is now escaped.
  - cve: CVE-2026-124842
    score_as_written: '8.3'
    description: An unauthenticated GINA request could reset the password of a registered account without answering the security question.
    fix: The unauthenticated reset is now only executed for unregistered accounts; registered accounts must complete the configured reset procedure.
  - cve: CVE-2026-124839
    score_as_written: '7.7'
    description: A specially crafted GINA account address could lead to command execution with elevated privileges by a maintenance script during system start.
    fix: The account address is no longer passed to a shell command.
  - cve: CVE-2026-124841
    score_as_written: '6.9'
    description: Wildcard characters in account addresses were not escaped in LDAP lookups of GINA, which could cause a lookup to select a different account than intended.
    fix: All values used in these LDAP filters are now escaped.
  - cve: CVE-2026-124836
    score_as_written: '6.3'
    description: Values taken from a message were inserted into the LDAP filters of the ldap_compare and ldap_read rule commands without escaping, which could allow a sender to alter the result of an LDAP-based rule.
    fix: All message values substituted into these LDAP filters are now escaped.
  - cve: CVE-2026-124837
    score_as_written: '6.3'
    description: A specially crafted DKIM signature could inject forged authentication results into the Authentication-Results header, which were then covered by the ARC seal of the gateway.
    fix: Values copied from a DKIM signature into the Authentication-Results header are now validated.
  - cve: CVE-2026-124845
    score_as_written: '6.3'
    description: A client-supplied HTTP header could make the GINA domain lookup fail, so the request was processed with the [default] GINA domain settings instead of those of the requested domain.
    fix: Requests for a GINA domain that cannot be resolved are now rejected instead of falling back to the [default] domain.
  vendor_rows_note: 'Every row reads ''Affected versions: <15.1.2''. The page prints ''CVSS Score: N'' with no CVSS version and no vector. For the 15.1.1 release (2026-11-03) the ENISA EUVD records carry NCSC.ch CNA scores with baseScoreVersion 4.0 equal to the page''s numbers (two of them swapped on the page), so the 15.1.2 numbers are probably CVSS 4.0 too, but that is an inference by analogy and not stated anywhere.'
