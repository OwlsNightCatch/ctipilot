    source_url: https://docs.seppmail.com/en/03_wp_02_pap_02_et_04_gina__gina-webmail.html
    file: gina_webmail.md
    quote: The SEPPmail Secure E-Mail Gateway uses a technology for spontaneous communication, the GINA technology.
  - topic: gina_exposure
    kind: fact
    claim: External recipients use it with only a browser and Internet access, i.e. the GINA web interface is by design reachable by external recipients.
    source_url: https://docs.seppmail.com/en/03_wp_02_pap_02_et_04_gina__gina-webmail.html
    file: gina_webmail.md
    quote: For reading the emails encrypted by means of this technology, the communication partner only requires Internet access
  - topic: gina_exposure
    kind: fact
    claim: 'SEPPmail''s flow description: the recipient opens the encrypted HTML attachment and reaches the GINA web mailer over an SSL path.'
    source_url: https://docs.seppmail.com/en/03_wp_05_af_03_ime_02_seppmail-ime-using-only-gina.html
    file: gina_only.md
    quote: can access the known GINA web mailer (3), by means of which the original email from the HTML attachment can be decrypted and read.
  - topic: gina_exposure
    kind: fact
    claim: GINA web interfaces are configured as GINA domains, and by default only the [default] GINA domain exists (relevant to CVE-2026-124845, which falls back to [default]).
    source_url: https://docs.seppmail.com/en/07_mi_17_gd__gina-domains.html
    file: seppmail_gina_domains.md
    quote: By default, only the "\[default\]" GINA domain exists.
  - topic: gina_exposure
    kind: fact
    claim: '15.1.0 notes: external communication partners can upload files through GINA (supports the upload-exhaustion row being reachable from outside).'
    source_url: https://docs.seppmail.com/en/20_revision-history.html
    file: seppmail_revhist.md
    quote: Added support for restricting file types that external communication partners can upload through GINA.
  - topic: rest_hardening
    kind: fact
    claim: 'Same release, REST API change without a CVE: login enforces the administrator MFA policy, answers all failed logins uniformly with HTTP 403 and audit-logs successful logins; client values are escaped in several REST LDAP filters.'
    source_url: https://docs.seppmail.com/en/20_revision-history.html
    file: seppmail_revhist.md
    quote: The REST login now enforces the administrator MFA policy, answers all failed logins uniformly with HTTP 403, and records successful logins in the audit log.
  - topic: rest_hardening
    kind: fact
    claim: 'Extended release notes add: user API tokens are invalidated after the admin-GUI timeout (not on the revision-history page; its issue type is not labelled a vulnerability).'
    source_url: https://downloads.seppmail.com/extrelnotes/151/ERN15.1.html
    file: seppmail_ern151.md
    quote: In this ticket, the REST API was modified to invalidate user API tokens after the timeout period configured for the admin GUI
  - topic: exploitation
    kind: fact
    claim: No exploitation, workaround or detection guidance appears on any of the three SEPPmail pages; the vendor offers only the patch. The Statuspal notice is a plain release notice.
    source_url: https://seppmail.statuspal.eu/info_notices/257218
    file: seppmail_statuspal_257218.md
    quote: A new SEPPmail Appliance release has been published.
  - topic: external_records
    kind: fact
    claim: 'ENISA EUVD: no record for SEPPmail dated 2026-11-20 or later as of 2026-11-26T04:53Z (vendor=SEPPmail query returns total 0; the five SEPPmail records of November are all the 15.1.1 CVEs of 2026-11-04). A text=GINA query for the same window also returns 0.'
    source_url: https://euvdservices.enisa.europa.eu/api/search?vendor=SEPPmail&fromDate=2026-11-20&toDate=2026-11-30
    file: euvd_vendor_seppmail_since_1120.txt
    quote: '{"items":[],"total":0}'
  - topic: external_records
    kind: fact
    claim: 'CVE Program: the eleven CVE ids return CVE_RECORD_DNE (reserved or unpublished) at about 2026-11-26T04:50Z, so no CNA text or CNA score exists yet; the vendor-page scores are the only scores. (Read to verify only, not citable.)'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-130637
    file: sepp/CVE-2026-130637.json
    quote: CVE_RECORD_DNE
  external_records_summary:
    euvd: 'none (queries: vendor=SEPPmail 2026-11-20..11-30 total 0; text=GINA total 0; text=<CVE id> returned only unrelated EUVD ids that numerically coincide, e.g. EUVD-2026-130637 is a Splunk SOAR record and EUVD-2026-124840 a WordPress plugin; ignore them)'
    ncsc_ch: 'none: ncsc-csh recent 25 (2026-10-21 to 2026-11-25) holds no SEPPmail advisory; the newest item is the 2026-11-25 GeoServer advisory'
