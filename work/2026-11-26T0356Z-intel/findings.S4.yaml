    role: corroborating
  discovery_trace: 'first seen at: borncity, URL https://borncity.com/blog/feed/ (item ''Sicherheitsvorfall bei Todoist … (22./23. Nov. 2026)'') -> article https://borncity.com/blog/2026/11/25/sicherheitsvorfall-bei-todoist-22-23-nov-2026/
    -> primary: Todoist incident notice, URL https://www.todoist.com/de/help/todoist/get-started/security-incident-in-november-2026-cG0EIACNU (Born dates Todoist''s publication to 2026-11-24; the page metadata
    reads 2026-11-25; no second independent source found, a WebSearch for coverage returned only Todoist help pages)'
  summary: Todoist's own notice says that between 2026-11-22 and 2026-11-23 an attacker used a stolen credential associated with its version control system to modify automated workflows in three repositories
    and obtain further credentials, and could read source code; Todoist found no change to application code. One obtained credential let the attacker change how employees access internal systems, and the
    attacker used it to take over an employee's work account and reach cloud infrastructure. On 2026-11-23 the attacker downloaded a file of account records (e-mail address, password hash, creation date)
    for early users whose passwords were still stored with salted SHA1, about 6% of users; retrieved Todoist API and Slack integration tokens for about 0.003% of users and used some API tokens against the
    sync endpoint; ran manual and then automated searches of customer content for credential patterns (cloud, source-control, AI and payment services) for about 0.001% of users; and, with credentials taken
    from the Todoist for Outlook add-in, requested subjects, senders and the first 255 characters of recent messages from the connected mailboxes of about 0.001% of users (Todoist says it cannot confirm
    which requests completed). Todoist says it has not established how the first credential was obtained and names a compromised employee device as its leading, unconfirmed theory; it blocked the access
    paths, rotated exposed credentials and retired SHA1 support.
  region_nexus: 'Global SaaS task-management vendor; no Swiss or public-sector customer named and user impact is a few percent at most. Reason to look: staff in any organisation that keep credentials in
    task text, and organisations that connected Outlook mailboxes to the add-in.'
  primary_sector_nexus: indirect
  sector: technology (SaaS productivity)
  cves: []
  techniques:
  - T1078.004
  - T1098
  - T1552
  - T1550.001
  - T1114.002
  techniques_basis: 'T1078.004: stolen version-control credential and a taken-over employee work account. T1098: a credential was used to change how employees access internal systems. T1552: searches of
    customer content for credential patterns (Todoist lists the patterns). T1550.001: API and Slack integration tokens used against the sync endpoint. T1114.002: requests against connected Outlook mailboxes
    through the add-in. All from Todoist''s notice.'
  affected_products:
  - Todoist
  - Todoist for Outlook
