- source_id: databreaches-net
  reason: 'Recipe confirmed, not a failure: `WebFetch https://databreaches.net/feed/` returns 10 dated items and `?paged=2` and `?paged=3` reach back about one day per page (page 3 ended 2026-11-19), enough
    for the 122-hour lookback; per-article WebFetch returns 403 and `extract` returns 403 with every jina key at HTTP 402. Article bodies are therefore unreadable; the feed excerpt is a lead only, so every
    databreaches item must be drilled to its own primary.'
- source_id: frenchbreaches
  reason: 'Recipe note: per-alert `extract` intermittently returns an anti-bot interstitial titled ''One moment, please...'' (Quimper twice; INCa worked on the second attempt; Septeo, DGAC, LNB worked first
    time). A single retry sometimes clears it; the feed itself reads cleanly.'
- source_id: cnil-fr
  reason: 'Recipe note: `url --direct https://www.cnil.fr/fr/actualites` returns the listing (173 kB) and `extract` reads each page; the `date` in the extract metadata is a modification date that differs
    from the publication date printed in the body (the collectivités sanctions page is metadata 2026-11-18, body 09 novembre 2026). Use the body date for the recency check.'
- source_id: tio-ch-attacco-informatico
  reason: 'Recipe note: `url --direct` returns the topic listing, but each card carries only a relative age (''4 gior'', ''1 sett'') and no date, so in-horizon items cannot be dated without an `extract`
    per article; the newest card is the FBI NCIC story (about 4 days old) and nothing Swiss is in the 74-hour horizon.'
- source_id: jina-reader
  reason: Every jina key in the pool answered HTTP 402 (balance exhausted) during this run; extract fell back to direct fetch where it could. Normal condition per the tooling notes, recorded for the dashboard.
