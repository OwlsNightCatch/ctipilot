    2026-11-24 intel run''s S4 listed the ScarlettGroup claim as ''claim only, no victim statement found''; the hospital statement now exists)'
  summary: The CHU de Bordeaux (a French university hospital) said on 2026-11-23 that two of its e-mail addresses had been used fraudulently to send mass e-mail to its professionals, and on 2026-11-24 at
    09:30 that investigations had confirmed a compromise of its information system. It has not said whether data was extracted, has not named the entry point or the link between the mass mailings and the
    intrusion, activated a crisis cell, informed ANSSI, filed with the CNIL and plans a complaint; care continues normally and external access to one server was suspended. ZATAZ reports that ScarlettGroup,
    a young extortion group, listed the hospital on its leak site on 2026-11-22 with a countdown, claims patient identities and contact details, social-security numbers, medical histories, prescriptions,
    laboratory results, imaging, invoices, e-mail and HR files, and says it can confirm some elements; that is the group's claim and ZATAZ's partial check, not the hospital's statement. ZATAZ lists the
    group's other claimed victims as including Sunnybrook hospital (which confirmed data theft on 2026-11-12), SIG Sauer (a US firearms maker), NBCUniversal and Genesys.
  region_nexus: 'France (Swiss neighbour); public-sector healthcare. No Swiss victim named by any source. Ground for a look: a public hospital with a mailbox-abuse first signal and a group whose claim list
    spans hospitals, police-adjacent data and a firearms maker.'
  primary_sector_nexus: sector analogue (public health institution), neighbouring country
  sector: public-sector, healthcare
  cves: []
  techniques:
