  discovery_trace: 'first seen at: zataz, URL https://www.zataz.com/feed/ (item ''CHU de Bordeaux et SIG Sauer ciblés par ScarlettGroup'') -> article https://www.zataz.com/chu-de-bordeaux-et-sig-sauer-cibles-par-scarlettgroup/
