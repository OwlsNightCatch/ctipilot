    and the outage page https://mycolorado.state.co.us/'
  summary: Colorado's Office of Information Technology says that on the night of 2026-11-18 the myColorado citizen app showed unusual usage patterns that triggered automated threat detection in its Amazon
    Web Services environment, and it took the app offline entirely. On 2026-11-25 OIT confirmed the incident primarily involved the 'myCards and Documents' part of the app, which holds user-uploaded PDFs
    and photographs such as passports, vehicle registrations and insurance cards; payment information was not involved. OIT's estimate moved from 50,000 to 150,000 users (2026-11-24) to roughly 100,000
    of about 2.1 million users, and it plans direct notices naming the files involved from 2026-11-27. The state says it has no reason to believe the incident is part of a bigger attack and has not stated
    the entry path, the actor, or how many days the access lasted; a university professor quoted by 9NEWS only assumes a cloud-hosted server was attacked. The app also carries the state's mobile driver
    licence, which is why the outage affects identity checks.
  region_nexus: 'United States (Colorado state e-government). No Swiss link. Analogy only: cantonal and federal citizen portals and wallet apps that let residents upload identity documents into a government-run
    cloud store.'
  primary_sector_nexus: sector analogue (public-sector e-government, citizen identity documents)
  sector: public-sector
  cves: []
