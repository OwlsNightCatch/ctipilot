  - T1114
  techniques_basis: 'Weak: the hospital states only that two mailboxes were used fraudulently for mass mailings and that a compromise was confirmed. T1078.004 (use of a legitimate cloud or mail account)
    and T1114 (mailbox access) are the nearest mappings to a mailbox that sends mass mail it should not; no source states the access method, so the composer should treat both as inference.'
