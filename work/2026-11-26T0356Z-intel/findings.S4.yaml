    attribution: Todoist
    source_url: https://www.todoist.com/de/help/todoist/get-started/security-incident-in-november-2026-cG0EIACNU
  - quote: The attacker used it to take over an employee’s work account and gain access to our cloud infrastructure.
    attribution: Todoist
    source_url: https://www.todoist.com/de/help/todoist/get-started/security-incident-in-november-2026-cG0EIACNU
  - quote: We have not established how the attacker originally obtained this credential.
    attribution: Todoist
    source_url: https://www.todoist.com/de/help/todoist/get-started/security-incident-in-november-2026-cG0EIACNU
  extended_notes: 'Detection (analysis; telemetry class first): source-control audit events for token use from new addresses and for workflow-file edits outside review; identity-provider admin changes to
    employee access paths; mailbox audit for Graph or add-in reads of the 10 most recent messages. Todoist''s list of searched credential patterns is the practical check for what staff stored in task text.'
