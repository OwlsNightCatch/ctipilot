    type: incident
    name: 1Password GitHub-account backend compromise (November 2026)
    aliases: []
    summary: 1Password disclosed on 2026-11-25 that an attacker used an employee's corporate GitHub account (investigation began 2026-11-19) to push malicious code to backend services that downloaded customer
      account records, and copied source code and reached CI/CD; vaults not affected (1Password, 2026-11-25).
  relation_suggestions: []
  references: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  confidence_note: First-party victim disclosure with specific field-level detail; BleepingComputer and heise restate it and are not independent. HIGH for what 1Password says it lost and what it says it
    did not; the vector into the GitHub account, the timing of the code push and the affected-customer count are unknown.
  suggested_classification:
    reliability: A
    credibility: '2'
    note: the victim's own statement; no independent observation yet, press derives from it
  suggested_priority: notable
  novelty: new
  gate_ground: PD-11 incident gate (d) imminent shared threat / supplier blast radius and (b) transferable TTP (employee source-control identity to malicious backend deploy to bulk customer export); incident
    floor met (vector class, behavior and data classes stated).
  evidence:
  - quote: On November 19, 2026, 1Password began investigating indications that an attacker gained access to an employee’s corporate GitHub account.
    attribution: 1Password
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
  - quote: The actor used the account to access source code and push malicious code to backend services, which downloaded administrative data pertaining to our customers.
    attribution: 1Password
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
  - quote: The attacker also copied source code from private repositories and gained access to our CI/CD system.
    attribution: 1Password
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
  - quote: At no time were customer vault contents accessed by, or available to, the attacker.
    attribution: 1Password
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
  - quote: we’ve expanded the code from six numeric digits to ten alphanumeric digits.
    attribution: 1Password
    source_url: https://1password.com/blog/update-on-nov-2026-security-incident
  - quote: Wann die Angreifer die Malware eingeschleust haben, sagt das Unternehmen nicht.
    attribution: heise online
    source_url: https://www.heise.de/news/1Password-Kundendaten-entfleucht-11538455.html
  extended_notes: 'Exposure: an organisation is in scope if it has 1Password accounts (names, sign-in e-mail addresses and account identifiers were in the copied records) and especially if it uses SCIM
    Bridge, Hosted Provisioning or account recovery, because tokens in those e-mailed links were among the data; 1Password says a small number of users with pending invitations or recoveries were notified
    directly. Vendor-stated customer action: none required beyond phishing caution; no password or Secret Key reset is asked for. Detection (analysis, not source-stated; telemetry class first): identity-provider
    and 1Password admin audit records for invitation, provisioning and account-recovery events since about 2026-11-19 that nobody on the admin side requested; mail-gateway logs for inbound mail that imitates
    1Password invitations or recovery with real tenant or user details; user reports of unsolicited recovery codes. Transferable lesson (the actual mechanics the post gives): a single employee source-control
    identity was enough to reach backend deployment and CI/CD, so source-control audit events for pushes or workflow changes from employee tokens and a deploy path with required review are the levers. Same-week
    context, not a linked campaign: Todoist (stolen version-control credential, 2026-11-22/23) and WP Connect (a partner''s GitHub token used against an auto-publish pipeline, 2026-11-22) describe the same
    first-move class; no source ties the three to one actor, so any composed link must stay a pattern observation.'
- title: 'Todoist: a stolen version-control credential led to workflow changes in three repositories, an employee-account takeover and cloud access; early-user password hashes, API and Slack tokens and
    some Outlook mailbox previews were taken'
  sources:
  - url: https://www.todoist.com/de/help/todoist/get-started/security-incident-in-november-2026-cG0EIACNU
    publisher: Todoist (incident notice)
