- title: '1Password: an attacker took over an employee''s GitHub account, pushed code that made backend services export customer account records, and reached source code and the CI/CD system; vaults not
    affected'
  sources:
  - url: https://1password.com/blog/update-on-nov-2026-security-incident
    publisher: 1Password (incident post)
    date: '2026-11-25'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/
    publisher: BleepingComputer
    date: '2026-11-25'
    role: corroborating
  - url: https://www.heise.de/news/1Password-Kundendaten-entfleucht-11538455.html
    publisher: heise online
    date: '2026-11-26'
    role: corroborating
  - url: https://borncity.com/blog/2026/11/26/1password-wurde-gehackt-nov-2026/
    publisher: Borns IT- und Windows-Blog
    date: '2026-11-26'
    role: corroborating
  discovery_trace: 'first seen at: databreaches-net, URL https://databreaches.net/feed/ (item ''1Password says a hacker used an employee''s GitHub account to take customer data'', article https://databreaches.net/2026/11/25/1password-says-a-hacker-used-an-employees-github-account-to-take-customer-data/
    returns 403 to every transport) -> pivot: borncity, URL https://borncity.com/blog/feed/ -> article https://borncity.com/blog/2026/11/26/1password-wurde-gehackt-nov-2026/ -> primary: 1Password incident
    post, URL https://1password.com/blog/update-on-nov-2026-security-incident -> corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/
    and heise https://www.heise.de/news/1Password-Kundendaten-entfleucht-11538455.html (both derive from the 1Password post, not independent observations)'
  summary: 1Password disclosed on 2026-11-25 that on 2026-11-19 it began investigating indications that an attacker had gained access to an employee's corporate GitHub account. Per 1Password, the actor
    used the account to access source code and to push malicious code to backend services, and those services downloaded administrative data about customers. The records taken for a subset of users are
    names and e-mail addresses, account and user identifiers, account creation and last sign-in times, public keys, Secure Remote Password protocol parameters, tokens embedded in certain e-mailed invitation,
    provisioning (SCIM Bridge and Hosted Provisioning) and account-recovery links, and non-secret internal metadata. 1Password says the attacker also copied source code from private repositories and gained
    access to its CI/CD system, which holds infrastructure secrets, and that it triggered a rotation of every credential that may have been exposed. It states that vault contents, the keys protecting them,
    account recovery keys and the apps and browser extensions were not affected. The emailed tokens complete an invitation or recovery only together with an SSO sign-in or a six-digit code sent to the registered
    address; 1Password lengthened that code to ten alphanumeric characters and says it found no evidence of account takeover with the exposed tokens. The sources do not say how the GitHub account was compromised,
    when the malicious code was pushed (heise notes the company does not say), how many customers are in the affected subset, or who the actor is; the vendor's wording on customer action is limited to caution
    about phishing that mentions invitations or account recovery (BleepingComputer adds that the harvested name and address list is useful for such phishing).
  region_nexus: 'Global vendor (Toronto); no Swiss or public-sector customer named. Nexus is supplier exposure: any Swiss federal, cantonal or communal body, or an IT supplier to them, that runs 1Password
    Business or Enterprise (including SCIM provisioning or SSO) holds users whose names, addresses and account identifiers were taken. No source quantifies Swiss exposure.'
  primary_sector_nexus: indirect (supplier of credential management; supply-chain blast radius)
  sector: technology (password management, identity)
  cves: []
  techniques:
  - T1078.004
  - T1213.003
  - T1195.002
  techniques_basis: 'T1078.004: 1Password states the actor used an employee''s corporate GitHub account. T1213.003: the same post says source code was copied from private repositories. T1195.002: heise
    calls the push of malicious code into 1Password''s own backend a variant of a supply-chain attack; the code ran in 1Password''s own services rather than reaching customers, so treat this id as the composer''s
    call.'
  affected_products:
  - 1Password
  entity_keys: []
  new_entities:
