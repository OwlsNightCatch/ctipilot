  - claim_id: ac638cf252
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: cited
    text: "SEPPmail's revision history lists patch release 15.1.2 of 2026-11-24 with eleven security fixes, each marked as affecting versions before 15.1.2 ("
    urls: ["https://docs.seppmail.com/en/20_revision-history.html"]
  - claim_id: 54fadb496e
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: cited
    text: "Two further rows score 9.2: CVE-2026-124840, where a session created by answering the security question was also accepted by the registration and settings workflows, so an attacker who knows the security answer could replace the password, and CVE-2026-124843, where a hard-coded fallback secret was used if the appliance's key material could not be loaded, which could let encrypted Large File Transfer attachments be decrypted outside the appliance ("
    urls: ["https://docs.seppmail.com/en/20_revision-history.html"]
  - claim_id: 774afdd4de
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: cited
    text: "The remaining rows are CVE-2026-124844 (8.7), unauthenticated GINA uploads that were never removed and could fill the disk; CVE-2026-124838 (8.5), a configuration-service socket open to every local user; CVE-2026-124842 (8.3), an unauthenticated GINA request that reset the password of a registered account without the security question; CVE-2026-124839 (7.7), a crafted GINA account address that reached a shell command in a maintenance script at start, with elevated privileges; and four rows at 6.9 to 6.3 covering unescaped LDAP filter values (CVE-2026-124841, CVE-2026-124836), a crafted DKIM signature that injects forged Authentication-Results later covered by the gateway's ARC seal (CVE-2026-124837) and a GINA domain lookup that falls back to the default domain settings (CVE-2026-124845) ("
    urls: ["https://docs.seppmail.com/en/20_revision-history.html"]
  - claim_id: 70c826ea5f
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: cited
    text: "**Exposure:** a SEPPmail Secure E-Mail Gateway before 15.1.2 whose GINA web interface is reachable from outside; the revision history says release 15.1.0 added support for restricting the file types that external communication partners can upload through GINA, which shows external recipients use it ("
    urls: ["https://docs.seppmail.com/en/20_revision-history.html"]
  - claim_id: f87e4b0cd1
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: cited
    text: "**Triage:** an unauthenticated password reset on a GINA account that is not yet registered is legitimate, since the fix keeps it for unregistered accounts only; the same request taking effect on an already registered account without the security-question step is the abuse ("
    urls: ["https://docs.seppmail.com/en/20_revision-history.html"]
  - claim_id: fd7b361f6d
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: uncited
    text: "The worst is CVE-2026-130637 (vendor score 9.3): request values reflected on the GINA login page were processed by the template engine, which could let an unauthenticated attacker read attributes of any GINA account and take it over, and the fix stops expanding request values as template placeholders."
  - claim_id: 472fa09fda
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: uncited
    text: "The page names no exploitation and no workaround, and does not say whether the 15.0 branch, whose last release is 15.0.7, is affected."
  - claim_id: abae96d9d3
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: derived
    text: "The page does not state the CVSS vector of any score."
  - claim_id: 12b412913d
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: derived
    text: "**Detection:** in GINA web access logs, login-page requests whose parameters carry template placeholder syntax, unauthenticated password-reset requests for accounts that are already registered, calls to the registration and settings workflows that follow a security-question recovery, and bursts of unauthenticated uploads; in the gateway's audit log, GINA password changes without the usual recovery sequence."
