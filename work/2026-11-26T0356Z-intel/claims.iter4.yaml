  - claim_id: e60eff3741
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation events showing a shell or interpreter started as root by the Conductor's provisioning or salt services, minion or router registration events whose ID contains shell metacharacters or command-substitution syntax, and the Conductor's audit and configuration-change records; these follow from the mechanism ENISA relays, and no source publishes an indicator."
  - claim_id: 9b02621118
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "body"
    kind: derived
    text: "Upgrading does not remove an attacker who is already in, so a Conductor that was reachable before the upgrade needs a check for accounts, router registrations and configuration pushed from it that nobody made."
  - claim_id: 7d8dada0db
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade every Conductor to a fixed release now rather than at the next cycle, since CISA and BSI both report exploitation of an unauthenticated root command injection; until then, limit which hosts can reach the Conductor, because the flaw needs only network access."
  - claim_id: 8aed92e05a
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "headline"
    kind: frontmatter
    text: "1Password breach via an employee GitHub account exported customer records; vaults not affected"
  - claim_id: 12063ce7e5
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "summary"
    kind: frontmatter
    text: "1Password disclosed on 2026-11-25 that an attacker who had gained access to an employee's corporate GitHub account pushed malicious code to backend services, which downloaded administrative data about a subset of customers: names, email addresses, identifiers, public keys, protocol parameters and tokens embedded in some emailed invitation, provisioning and account-recovery links. The attacker also copied private-repository source code and reached the CI/CD system, and 1Password rotated every credential that may have been exposed. 1Password says vault contents, vault keys and recovery keys were not affected and the exposed tokens need an SSO sign-in or an emailed code, which it lengthened; it does not say how the account was compromised or how many customers are affected."
  - claim_id: f5ab7a0c75
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "1Password disclosed on 2026-11-25 that on 2026-11-19 it began investigating indications that an attacker had gained access to an employee's corporate GitHub account ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: ac50a5d602
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "The attacker used the account to access source code and push malicious code to backend services, which downloaded administrative data about customers; the attacker also copied source code from private repositories and gained access to the CI/CD system, which holds infrastructure secrets, and 1Password rotated every credential that may have been exposed ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: 4dcf6be7b7
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "It says the actor had stolen a token and that vault contents, the keys that protect them, account recovery keys and its apps and browser extensions were not affected ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: 4769d76bd4
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "The records taken for a subset of users, whose size is not stated, are names and email addresses, account and user identifiers, account creation and last sign-in times, public keys, Secure Remote Password protocol parameters, tokens embedded in certain emailed invitation, SCIM Bridge and Hosted Provisioning, and account-recovery links, and non-secret internal metadata ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: bd71a4bbad
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "Those tokens complete an invitation or recovery only together with an SSO sign-in or an emailed code, which 1Password has lengthened from six numeric digits to ten alphanumeric characters, and it says it found no evidence of account takeover with the exposed tokens; its advice to customers is caution about phishing that mentions invitations or account recovery, that it will never ask for the account password or Secret Key, keeping both safe, and reporting suspicious messages to its support address ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: 6cd95c375b
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "BleepingComputer adds that the harvested name and email list is useful for such phishing ("
    urls: ["https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/"]
  - claim_id: a218211e50
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "**Exposure:** any organisation with 1Password accounts, since users' names, sign-in addresses and identifiers were in the copied records, and especially one using SCIM provisioning or account recovery, because tokens in those emailed links were among the data; 1Password says it notified a small number of users with pending invitations or recoveries directly ("
    urls: ["https://1password.com/blog/update-on-nov-2026-security-incident"]
  - claim_id: 991021218f
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** 1Password's own advice covers phishing caution, never sharing the password or Secret Key and reporting suspicious messages, and BleepingComputer says it is not requiring customers to change their account passwords or Secret Keys ("
    urls: ["https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/"]
  - claim_id: 6aa55210b7
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: derived
    text: "**Detection:** in the identity provider's and 1Password's administrator audit records, invitation, provisioning and account-recovery events since about 2026-11-19 that no administrator or user requested; in mail-gateway logs, inbound mail that imitates 1Password invitations or recovery messages with real tenant or user details; and user reports of recovery codes nobody asked for."
  - claim_id: b5c2e9154b
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: derived
    text: "These checks are analysis from the data classes the post lists, which publishes no indicator."
  - claim_id: a2fd331cb0
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate invitation or recovery message follows an administrator's or user's own action; one that arrives without it is the signal."
  - claim_id: 729349cf4a
    entry: 2026-11-26/1password-employee-github-account-backend-compromise
    surface: "body"
    kind: derived
    text: "For your own pipelines the mechanism is one employee source-control identity that could push to backend services and reach CI/CD, so require review on the deploy path and alert on pushes and workflow changes made with employee tokens."
