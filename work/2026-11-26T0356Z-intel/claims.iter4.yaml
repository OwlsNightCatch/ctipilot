  - claim_id: c56741133c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases; Expel saw the same infrastructure create its own accounts through Okta self-service registration. Google Threat Intelligence Group and Mandiant report on 2026-10-31 that since late August they have seen ARTEX, PentAGI and CAIRN operated in incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations, and that the original ARTEX repository was taken down in October while forks keep it in circulation. CrowdStrike and Recorded Future document another actor using the framework, and Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, with the same framework according to BleepingComputer. Microsoft adds on 2026-11-06 another cluster, the Cambodia-based, financially motivated Storm-3358 targeting financial organisations, and Check Point reads ten exposed operator consoles that show near-autonomous, opportunistic ARTEX campaigns. CERT-EU says AI-driven activity against the EU institutions it protects highly likely involved ARTEX. The FBI's FLASH of 2026-11-13 says a variety of actors have used ARTEX since at least August against sectors including financial services, government, technology and defense, and lists the observed techniques, among them cloud-trust and vendor-credential pivots, Kudu abuse and Active Directory credential theft. Microsoft's defender guide of 2026-11-25 widens its named ARTEX users to six, adding the North Korean clusters Onyx Sleet and Pearl Sleet and the clusters Crystal Typhoon and Salt Typhoon, says ThreatBook now sells an ARTEX Pro, and lists detections on the web server, in identity logs and on egress."
