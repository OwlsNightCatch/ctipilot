    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-26T05:05:00Z"
    kind: cited
    text: "Microsoft says ARTEX can drive virtually any model, including open-weight and guardrail-stripped ones, and can switch models when one fails, so its activity is not necessarily constrained by, or visible in, any single provider's telemetry; it adds that ARTEX introduces no new techniques and does not obfuscate by default, and calls behavior the most durable signal: a wide variety of requests in a brief time, retries of technique variants and next-stage actions at machine speed ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/"]
  - claim_id: d523458f7c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-26T05:05:00Z"
    kind: cited
    text: "Its detections, by telemetry class: on web servers, web-server processes (w3wp.exe, php-fpm, httpd or apache2, Java application servers) starting shells, script files created in web-accessible or upload directories, including files a database server process writes after its log file was pointed at a web directory, several short-lived web shells with incrementing names, and rapid reads of /etc/shadow, .env files, private keys and cloud credential files; in access logs, a client requesting 100 or more distinct paths with 50 or more client errors in one minute; in Entra sign-in logs, one address attempting service-principal sign-ins for three or more applications within an hour with both failures and successes, where a success after an invalid or expired client secret error warrants immediate investigation; in the audit log, one identity adding application credentials and assigning roles or permissions within an hour, and in one case an application assigning itself Global Administrator; and on egress, reverse shells and requests from servers to webhook and file-sharing services, where Microsoft's lever is to restrict outbound connections from web servers ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/"]
  - claim_id: dd9afdc7b0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-26T05:05:00Z"
    kind: cited
    text: "Microsoft's thresholds are defaults to tune: exclude build and automation servers that run shells under Java or Node.js, review file names because content management system updates also write script files, and do not alert on default curl, Wget, Python or headless Chromium user agents alone ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/"]
  - claim_id: fd2d580112
