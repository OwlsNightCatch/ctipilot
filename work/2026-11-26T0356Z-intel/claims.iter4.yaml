    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/"]
  - claim_id: 4c7e0b2367
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-26T05:05:00Z"
    kind: record-summary
    text: "Microsoft's defender guide of 2026-11-25 names six ARTEX users, adding the North Korean clusters Onyx Sleet and Pearl Sleet and the clusters Crystal Typhoon and Salt Typhoon, says ThreatBook sells an ARTEX Pro, and lists web-server, identity and egress detections; ThreatBook's own release shows the commercial edition is its product, not a community fork."
  - claim_id: 152a7ff76c
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "summary"
    kind: frontmatter
    text: "Apiiro found the PolinRider loader in at least 7,609 GitHub repositories owned by 2,330 accounts, where stolen GitHub access force-pushes a copy of the owner's own commit, with the same author, message and date, plus a loader hidden after hundreds of spaces in a build configuration file. Sonatype found the same loader in 12 hijacked npm releases and JFrog in a fake employer's take-home test and scripted camera check; none relies on an npm install script, the server address is read from an Ethereum wallet, and removing the code does not revoke the access that pushed it. SafeDep later found a Python variant of the loader in 375 public repositories, and StepSecurity traced force-pushed commits that ran in a project's release CI and published 40 infected installers."
  - claim_id: 6412eaf0ac
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "actions[0]"
    kind: frontmatter
    text: "Search every branch of your organisation's and suppliers' GitHub repositories for a semicolon followed by 200 or more spaces or tabs in JavaScript, TypeScript and build configuration files, for a utils package or conftest.py that runs node, and for .vscode/tasks.json tasks that run node when a folder opens; on any hit, rotate every GitHub and npm token reachable from the developer machines and CI runners that built the repository and review force-pushes, deploy keys, Actions secrets and releases since the infection, because deleting the loader does not revoke the access that pushed it."
  - claim_id: e32a106c7d
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: cited
    text: "SafeDep reports that PolinRider now plants a Python loader in GitHub repositories, hidden in a small utils package or in conftest.py with five import lines added to a start file, and found it in 375 public repositories under 260 accounts on 2026-11-24; no PyPI or npm package carries it, and because it uses only the standard library a scan of requirements files or a lockfile does not show it ("
    urls: ["https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"]
  - claim_id: 45a3842fa1
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: cited
    text: "Its remedy is to delete the planted package, import lines and conftest.py loader, then clean the machines that push to the repository and replace their GitHub tokens and SSH keys ("
    urls: ["https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"]
  - claim_id: 813715c7d3
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: cited
    text: "StepSecurity reports that the loader reached open-source projects through commits force-pushed on 2026-10-19 into pull requests that were still open, from one GitHub account, at AsyncAPI Generator, CircuitVerse and Open Food Facts; the malicious commits reuse a clean commit's message and date but are unsigned and carry a different committer name, and none of the merged pull requests contains the loader ("
    urls: ["https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests"]
  - claim_id: b5332b3634
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: cited
    text: "StepSecurity counts 576 infected repositories of 622 it fetched, across 311 accounts, and assesses from a shared funding wallet that the fake interviews and these infections share an operator ("
    urls: ["https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests"]
  - claim_id: 4a921ca725
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: uncited
    text: "When Python imports the file, the loader reads the input data of the newest transaction an Ethereum wallet sent to itself, writes it as JavaScript to a temporary file and runs node on it; the next stage is written to the standard input of a detached interactive node process, so it is absent from the process command line, and the node child starts from python or pytest. pytest runs the loader through conftest.py every time, and fixing an import error for the missing utils package also starts it."
  - claim_id: ad10f2bd7c
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: uncited
    text: "SafeDep did not contact the command server, so later stages are unobserved, and the stealer behavior it describes comes from the September chain."
  - claim_id: 19d0d48e86
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: uncited
    text: "In the files it read, the added line is about 315 tab characters followed by the loader, so GitHub's diff looks empty, and the loader runs from a prefix on the build and dev scripts, from a Jest or PostCSS config file or from a hidden VS Code folder-open task."
  - claim_id: 99ddeaf4f2
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "section 2026-11-26T05:07:10Z"
    kind: uncited
    text: "CircuitVerse's pull_request workflows ran on the poisoned fork commits with no approval step, and its maintainers confirmed the loader ran in the desktop build and deleted 40 installers that had stayed downloadable for more than a month; AsyncAPI's CI did not run it, and Open Food Facts' builds failed and its maintainers rotated a secret."
  - claim_id: 4f8d6e538e
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "record 2026-11-26T05:07:10Z"
    kind: record-summary
    text: "SafeDep found a Python variant of the loader in 375 public repositories, hidden in a utils package or conftest.py, and StepSecurity traced force-pushed pull-request commits that ran in CircuitVerse's release workflows and published 40 infected installers, with the loader padded by tabs; StepSecurity counts 576 infected repositories of 622 fetched."
  - claim_id: 06a590e3a6
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 fix CVE-2026-114938, an out-of-bounds write in the AVX-512 Base64 decoder that Calif, one of its two credited reporters, scores CVSS 4.0 9.2 and says it turned into pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate; Oracle scores it CVSS 3.1 8.1 with high attack complexity. Only x86-64 hosts with AVX-512 VBMI are affected, a trigger proof of concept is public, Calif withholds its product chains, a second researcher claims a working exploit with no release stated, GreyNoise reports exploitation attempts without a confirmed success against its sensors, and VulnCheck says a working exploit is available to its customers. NCSC.ch and BACS warn operators to update internet-reachable Java applications and identity services first, and Cisco's advisory, at version 1.4, lists Catalyst Center, IOS XE and ISE as not affected while Siemens lists Siveillance Control, Siveillance Control Pro and Industrial Edge Management Pro and Virtual with no fix yet."
