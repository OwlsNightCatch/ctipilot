  - claim_id: 1d84982873
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "headline"
    kind: frontmatter
    text: "Okta: AI agents sign up with mail.tm; its rotating domain will very likely outdate blocklists within weeks"
  - claim_id: 3b160ba96a
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "summary"
    kind: frontmatter
    text: "Okta Threat Intelligence, with data from the P0 Labs team of Permiso (now part of Okta), reports that since June 2026, and at scale in October and November, AI agents registered accounts with disposable addresses, mostly from the mail.tm family, on Auth0 tenants and Okta organizations that allow public self-service registration. mail.tm exposes one active domain at a time through an account-free API and replaces it periodically, so a blocklist will very likely stop matching within weeks. Okta reads such sign-ups as a likely early sign that agents are tasked against an organization, and says agents often register through the Auth0 Authentication API, which can skip protections applied in Universal Login."
  - claim_id: c74f737e7c
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "Okta Threat Intelligence reports that since June 2026, and at scale through October and November, AI agents have registered accounts with disposable email addresses on Auth0 tenants and Okta organizations that allow public self-service registration, activity Okta calls almost certainly malicious and that customers often reported alongside attacks on their applications ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: f43fb154f7
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "The addresses mostly belong to the mail.tm family, a free receive-only service whose API needs no account or key and lets a script create a mailbox, obtain a token and poll for one-time codes ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 0544785b83
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "In tests by the P0 Labs team of Permiso, which Okta acquired on 2026-08-26 ("
    urls: ["https://www.okta.com/newsroom/press-releases/okta-signs-definitive-agreement-to-acquire-permiso-security"]
  - claim_id: 961308b149
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "), the ARTEX, Cairn, CyberStrikeAI and pentestcode frameworks each picked mail.tm at run time, and in a data set containing attacker tooling mail.tm appeared on 80 percent of the attacker hosts where disposable email was found ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 622724621c
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "Okta says the use always occurred within a short window of other agentic reconnaissance and intrusion attempts against the same entities ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: dc85421b02
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "Bot detection and CAPTCHA generally stopped the October mail.tm sign-ups before email verification, but Okta warns agents can solve challenges and commonly register by calling the Auth0 Authentication API directly, which can skip protections applied in Universal Login ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 07cbd4b333
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "For workforce users Okta says self-service registration is a prerequisite for many of the attacks it describes and should be disabled or restricted ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 9c22407e15
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "**Detection:** in identity-provider registration telemetry, sign-up events whose email domain belongs to a disposable provider's currently active mailbox domain, kept current by polling the provider's public domain endpoint instead of a static list, as Okta advises ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: ec4075d2c5
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "**Triage:** the discriminator Okta supports is context: a disposable-domain sign-up read alongside other agentic reconnaissance or intrusion attempts against the same entities, not the domain alone ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 2103d71d2f
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "Treat a disposable-domain sign-up as a prompt to look for other agentic activity against the same estate, since Okta says it gives a heads-up to look for successful intrusion attempts, and do not rely on CAPTCHA alone ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 6790e0585b
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: uncited
    text: "mail.tm exposes only one active mailbox domain at a time and replaces it periodically, so a blocklist built from earlier domains will very likely stop matching within weeks; Okta's Auth0 telemetry shows sign-ups tracking the domain the API currently returns, and the attackers' domain changed around 2026-10-30 when the API response did."
  - claim_id: 3b9061e148
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: uncited
    text: "Agents also used mailinator, guerrillamail and emailnator, and at one target an agent moved to another provider when blocked, which Okta reads as agents treating disposable mail as an interchangeable capability."
  - claim_id: 58037133ab
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: derived
    text: "**Exposure:** an Auth0 tenant or Okta organization that allows public self-service registration."
  - claim_id: 82f260b0da
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** on Auth0, block sign-ups through the API while allowing Universal Login and block disposable domains with Actions; on Okta Workforce Identity, disable or restrict self-service registration."
