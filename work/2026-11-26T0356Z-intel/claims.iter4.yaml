    surface: "summary"
    kind: frontmatter
    text: "Drupal published SA-CORE-2026-017 (CVE-2026-132165) and SA-CORE-2026-018 (CVE-2026-132166, Moderately critical, not directly exploitable) on 2026-11-18 and SA-CORE-2026-019 (CVE-2026-136716, Highly critical 21 of 25) on 2026-11-25: under specific conditions an attacker can use the installer to reinstall Drupal, which can lead to site takeover or remote code execution, and sites in unusual or incomplete install states stay open after the first fix. Drupal says both installer flaws are exploited on live sites (SA-CORE-2026-017 from 2026-11-19 19:00 UTC) and CISA listed CVE-2026-132165 as exploited on 2026-11-24; the fixed releases are 11.4.14, 11.3.23 and 10.6.23, update.php must be run, and securing the installer is strongly recommended."
