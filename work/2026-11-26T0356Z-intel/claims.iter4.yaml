  - claim_id: 6043fc012b
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0012 of 2026-11-16, revised on 2026-11-24 to list the CVE ids, covers five flaws in the Audio, Web and Video Conferencing (AWV) component of MiCollab 10.3 (10.3.0.18) and earlier, led by an unauthenticated blind command injection scored CVSS 3.1 10.0 (CVE-2026-133323) and an unauthenticated XML injection scored 9.0 that could run commands (CVE-2026-133303). CISA added all five to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming an actor, victim or technique, while Mitel's own page says nothing on attacks. Mitel offers a patch through its portal (KB000129195) and says restricting external access to the AWV component reduces the risk; the 10.3.0.18 release that Mitel named as the fix for its July advisory is itself in the affected range."
  - claim_id: 7bedcad592
    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply Mitel's patch KB000129195 to every MiCollab on 10.3 (10.3.0.18) or earlier, including systems already moved to 10.3.0.18 for the July advisory, restrict external access to the Audio, Web and Video Conferencing component until it is in, and on any system whose AWV component was reachable from outside check for shell child processes of the AWV service and new files in its upload paths, because CISA lists all five flaws as exploited."
