  - claim_id: 1baf82c627
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "summary"
    kind: frontmatter
    text: "SEPPmail's patch release 15.1.2 of 2026-11-24 fixes eleven flaws in Secure E-Mail Gateway versions before 15.1.2, led by CVE-2026-130637 (vendor score 9.3): request values reflected on the GINA login page were processed by the template engine, which could let an unauthenticated attacker read attributes of any GINA account and take it over. Two more rows score 9.2 (a security-question recovery session accepted by the password-change workflows, and a hard-coded fallback secret for Large File Transfer attachments) and an unauthenticated request could reset a registered account's password without the security question. SEPPmail names no exploitation and no workaround, and does not say whether the 15.0 branch is affected."
