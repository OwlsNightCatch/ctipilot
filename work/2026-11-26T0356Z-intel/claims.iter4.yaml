  - claim_id: 2030ad5abb
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "summary"
    kind: frontmatter
    text: "The GeoServer project published a batch of security advisories on 2026-11-23, most for flaws fixed in 3.0.2, 2.28.6 and 2.27.7, and five of them chain an anonymous WFS request to code execution: a path disclosure, a service-security bypass with a prefixed service name, an XML injection, a predictable remember-me key that forges an administrator session (critical, CVSS 4.0 9.2) and a JDBC deserialization. The reporter, who says it works on a default installation, published a full-chain proof of concept the same night; the project announced the fixed releases on 2026-10-19. watchTowr reports exploitation attempts in the form of error-based probes that create and invoke stored queries, and NCSC Switzerland rates the chain actively exploited; watchTowr is the only observer and the sources name different flaws as exploited."
  - claim_id: 9d3021d847
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every internet-reachable GeoServer to 3.0.2, 2.28.6 or 2.27.7 (2.27 is end of life, so plan the move to a supported line) and, on any instance that ran an older build while reachable, review the stored queries under the data directory's wfs/query folders and the administrator accounts before trusting the host, because a public proof of concept chains the steps from an anonymous request to code execution and watchTowr reports exploitation attempts."
