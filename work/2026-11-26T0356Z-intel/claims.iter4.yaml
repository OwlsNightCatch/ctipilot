    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "CVE-2025-41451 (CWE-77 OS Command Injection, CVSS v3 7.6) is a post-authenticated command injection in the alarm-to-email (SMTP) configuration field: a user-supplied value is formatted unsanitized into a shell command executed on the device, which Claroty used to achieve remote code execution: \"the field value being formatted into the shell command is not sanitized according to our analysis and could potentially include OS shell directives that yield subsequent commands controlled by a potential attacker\" ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
  - claim_id: 25fdf3c830
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "CVE-2025-41452 (CWE-15 External Control of Configuration Setting, CVSS v3 5.4) lets a post-authenticated user inject arbitrary Nginx directives via the exposed `headers.conf` include: \"an attacker could abuse it to implant arbitrary routing directives into the Internet-facing Nginx configuration\" ("
