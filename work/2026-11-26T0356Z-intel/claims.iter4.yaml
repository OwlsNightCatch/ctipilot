    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** a Session Smart Conductor on a release below 7.0.5, 7.1.7 or 7.2.3 that a network attacker can reach; the sources do not name the interface or port the AutomatedProvisioner path uses or say whether it is on by default."
  - claim_id: 1ce0603981
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
