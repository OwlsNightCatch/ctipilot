    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "Claroty says bypassing authentication gave it the device's full administrative interface and every management function it exposed, among them email notifications, and its next finding is the command injection on the SMTP email configuration page, so on an unpatched device the bypass leads to the two post-authentication flaws ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
  - claim_id: 4d24969aec
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "**Triage:** Claroty says the code-of-the-day mechanism is likely intended for vendor support or maintenance, so a login by Danfoss support or by the contractor that maintains the unit is the benign lookalike and an administrative session that nobody on the operator or service-provider side opened is the signal; Claroty publishes no log field that separates them ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
  - claim_id: 0cf5a16cf9
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: uncited
    text: "CVE-2025-41450 is a hidden, undocumented \"code-of-the-day\" authentication mechanism (Claroty gives CWE-287 Improper Authentication; Danfoss scores it CVSS 8.2)."
