  - claim_id: 133f9fba93
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to unauthenticated code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, NCSC.ch and Wiz the two HTTP/2 flaws and Rapid7 CVE-2026-123007. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings; Unit 42 reached pre-authentication code execution through CVE-2026-123633 as the worker user in a lab, on a non-default configuration and with a separate memory leak that F5 has not given a CVE. Palo Alto Networks lists PAN-OS and Panorama with HTTP/2 enabled as affected, Cisco, Siemens and Synology list products with fixes pending or none, Fortinet confirms FortiOS, FortiProxy and FortiMail not impacted and is still investigating FortiManager, FortiAnalyzer, FortiAuthenticator and dozens of other products."
  - claim_id: 3fe14a832c
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "On every PAN-OS firewall and Panorama with the HTTP/2 option enabled, upgrade to 12.2.4-h3, 12.1.10-h6 or 11.2.16-h3 or later (12.1.7-h15, 11.2.10-h19 and 11.2.13-h6 are released too, and PAN-OS 11.1 and 10.2 are cleared) or disable HTTP/2, because Palo Alto Networks lists CVE-2026-123007 and CVE-2026-123633 as affecting them with that option on."
  - claim_id: 9233805acf
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "F5, as CERT.at relays it, frames the base effect as worker crashes, with code execution possible where ASLR is disabled or can be bypassed, which Wiz says attackers can do by reading memory first (translated from German) ("
    urls: ["https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities"]
  - claim_id: e30638e785
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update and restart nginx, because a configuration reload does not replace the running executable; disabling HTTP/2 on exposed listeners blocks only the two HTTP/2 flaws and, if it stays on elsewhere, leaves connection pressure ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"]
  - claim_id: ac878a8e81
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "), and Xint gives interim measures for the others: a fixed upstream group in place of request-time DNS lookups for CVE-2026-123634, no QUIC listeners for CVE-2026-121810 and bound or firewalled mail listeners for CVE-2026-113425 ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 1af876eb5b
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: cited
    text: "The chain needed a non-default configuration and a separate memory disclosure that F5 assessed as limited to a non-typical configuration and has not given a CVE, whose details Unit 42 withholds ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"]
  - claim_id: 5b5df02f3d
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: cited
    text: "Its one log signal is the error-log warning that worker connections are not enough and are being reused, which needs the warn log level and also appears under ordinary connection pressure ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"]
  - claim_id: 5fdaee8952
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: cited
    text: "Palo Alto Networks removed the ETA for 12.1.7-h15, 11.2.10-h19 and 11.2.13-h6 on 2026-11-24 because those builds are released, so every fixed build named above is available, marked PAN-OS 11.1 and 10.2 as not impacted, and says the impacted products for CVE-2026-121810, CVE-2026-123634 and CVE-2026-113425 are the same as for the two HTTP/2 flaws; it knows of no malicious exploitation ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-123633"]
  - claim_id: 131e943648
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: cited
    text: "Cisco's advisory, now version 1.5 of 2026-11-26, has rated the flaws High rather than Critical since version 1.2 of 2026-11-23, lists IOS XE as not affected, gives NX-OS 10.3.11, 10.4.9, 10.5.7, 10.6.5 and 10.7.1 in place of 10.7.2F, lists Catalyst Center with bug IDs and fixes 3.3.3 and 3.4.1 (dates to be determined) where it was listed as not affected, and writes the Finesse fix as 15.0(1)SU3 with Unified Intelligence Center on the same release ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nginx-nov-2026-e8jska2s"]
  - claim_id: 1b6ded96e6
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: uncited
    text: "Unit 42 published a first-person account of reaching pre-authentication code execution through CVE-2026-123633 as the non-root NGINX worker on a two-VM lab target running 1.31.8: the first attempt recovered a libc address without a shell and the second opened an interactive shell."
  - claim_id: 53d9c2f3a5
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: uncited
    text: "The tested path needs HTTP/2 on the listener and a reverse-proxy route whose upstream is a variable resolved at request time, with free worker connections at or below one sixteenth of worker_connections; static upstream routes still need review, and Unit 42 publishes no confirmed indicators of compromise."
  - claim_id: 81f5f9c25a
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-26T05:07:20Z"
    kind: uncited
    text: "Raising worker_connections adds only headroom and disabling HTTP/2 on some listeners leaves extra HTTP/1.1 connections, so neither replaces the upgrade; no source reports exploitation."
  - claim_id: 4bfd11a396
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "record 2026-11-26T05:07:20Z"
    kind: record-summary
    text: "Unit 42 reached pre-authentication code execution through CVE-2026-123633 as the worker user in a two-VM lab, on a non-default configuration and chained with a memory leak F5 has not given a CVE, and publishes the exposure test and a log signal. Palo Alto Networks released its last three PAN-OS fixed builds and cleared 11.1 and 10.2, and Cisco's advisory, now at version 1.5, rates the flaws High and changes several product statuses and fixed releases."
  - claim_id: afb5dd8b49
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "headline"
