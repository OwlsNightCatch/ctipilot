  - claim_id: 3b160ba96a
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "summary"
    kind: frontmatter
    text: "Okta Threat Intelligence, with data from the P0 Labs team of Permiso (now part of Okta), reports that since June 2026, and at scale in October and November, AI agents registered accounts with disposable addresses, mostly from the mail.tm family, on Auth0 tenants and Okta organizations that allow public self-service registration. mail.tm exposes one active domain at a time through an account-free API and replaces it periodically, so a blocklist will very likely stop matching within weeks. Okta reads such sign-ups as a likely early sign that agents are tasked against an organization, and says agents often register through the Auth0 Authentication API, which can skip protections applied in Universal Login."
  - claim_id: e9ec8c848a
    entry: 2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update every gateway on 15.1 to 15.1.2 and, for gateways on the 15.0 branch, ask SEPPmail whether these flaws apply, since the page does not say; where GINA is internet-facing, give the update priority within the regular cycle, because the template injection and the unauthenticated reset need no login, and review GINA account changes made before the update."
