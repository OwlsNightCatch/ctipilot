    surface: "cves[CVE-2025-41451]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2025-41451\", \"cvss\": \"8.7\", \"status\": [\"patch-available\"], \"affected\": \"Danfoss AK-SM 800A firmware before R4.3.1\", \"fixed\": \"Firmware R4.3.1\", \"auth\": \"post-auth\", \"vector\": \"user-interaction\"}"
  - claim_id: f8bb9c9d7d
