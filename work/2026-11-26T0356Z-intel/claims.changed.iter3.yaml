  - claim_id: 9521365f7b
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "Claroty says its findings combine into attack chains but does not state that the code-of-the-day bypass reaches those two primitives in practice, so the chain is treated as auth-gated unless a combined path is confirmed ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
