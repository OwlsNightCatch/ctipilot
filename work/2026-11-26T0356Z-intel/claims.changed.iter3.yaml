    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "**Triage:** Claroty says the code-of-the-day mechanism is likely intended for vendor support or maintenance, so a login by Danfoss support or by the contractor that maintains the unit is the benign lookalike and an administrative session that nobody on the operator or service-provider side opened is the signal; Claroty publishes no log field that separates them ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
