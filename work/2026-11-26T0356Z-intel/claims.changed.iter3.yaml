claims:
  - claim_id: b0f286528a
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "headline"
    kind: frontmatter
    text: "Danfoss AK-SM 800A hidden 'code-of-the-day' login is on CISA's exploited list; two post-auth flaws follow"
  - claim_id: 3fa9986eed
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "summary"
    kind: frontmatter
    text: "Companion disclosure to Claroty's Copeland research, same team and publish day. Danfoss AK-SM 800A refrigeration system managers, used in supermarkets, cold storage and commercial HVAC, carry an undocumented 'code-of-the-day' authentication bypass (CVE-2025-41450) that Claroty says gives a fully authenticated administrative session and that Danfoss and CISA describe as generating a web report with internal IPs, usernames and store names, a post-authenticated OS command injection in the alarm-email configuration (CVE-2025-41451), and an Nginx configuration-injection flaw enabling denial of service (CVE-2025-41452). Claroty's own internet-wide scan found thousands of exposed devices. CISA added CVE-2025-41450 to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming a campaign."
  - claim_id: bb01e0cec6
