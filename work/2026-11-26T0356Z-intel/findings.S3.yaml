      Delta against the ARTEX entry (8 changelog records, last development 2026-11-20): (1) four newly named actor clusters, two of them state-aligned PRC (Crystal Typhoon, Salt Typhoon) and two DPRK (Onyx Sleet, Pearl Sleet); the registry knows none of the four. (2) ThreatBook commercialisation of 'ARTEX Pro' and a CyberStrikeAI enterprise edition (Microsoft's claim; ThreatBook's own statement not fetched), which undercuts the 'repository removed' mitigation. (3) Microsoft's consolidated detection list, which maps cleanly onto telemetry classes: process-creation events where web-server processes (w3wp, php-fpm, httpd/apache2, Java application servers) spawn sh, bash, cmd or PowerShell; file-creation events for new or modified .php/.jsp/.jspx/.asp/.aspx/.ashx files in web-accessible or upload directories, including files written by a database server after its logging settings were pointed at a web directory; several short-lived web shells with incrementing names each running one command as the agent corrects errors; rapid reads of /etc/shadow, .env files, private keys and cloud credential files; outbound requests from servers to webhook or file-sharing services; two or three attack chains active at once and renewed attempts through new paths after containment. Identity side: service-principal sign-ins followed by credential additions, privileged role assignments, Graph or ARM enumeration, Key Vault and storage access. (4) Microsoft's own caution on network indicators: default user agents and request options exist but actors and agents vary them, so static blocklists are a weak control. (5) Triage discriminator the post supports: authorised vulnerability scanners and red-team tooling also produce bursts, so the separating features are stage-to-stage progression from one source within minutes (exploitation, web shell, credential read, cloud-identity abuse) and retry-until-success web-shell iteration; Microsoft says build and automation servers that run shells under Java or Node should be excluded from the web-server-spawns-shell hunt. (6) Hardening named: block-mode WAF with rate limiting, restrict outbound connections from web servers (agents used curl and netcat to fetch RATs and curl with rotating webhook.site URLs to return output), phishing-resistant MFA for administrators, block legacy authentication, Entra Password Protection extended to on-premises AD, restricted app registration and user consent, secret scanning with push protection, gMSA and LAPS, Defender for Identity on domain controllers. Microsoft also suggests honeypots, decoys, tarpits and 'fake wins' and says they gave 'attribution-quality signal' in its testing. No exploitation of any Swiss body is claimed. The New York Times / Nextgov claim about US intelligence-agency systems comes only through The Record here; S4 may hold the incident side. Admiralty hint: B2.
