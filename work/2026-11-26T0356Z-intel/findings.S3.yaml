        source_url: "https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests"
    extended_notes: |
      Delta against the 2026-11-15 entry (Apiiro: 7,609 repositories, forged force-pushed commits, hijacked npm releases, fake employer take-home test): a Python delivery path invisible to dependency scanning, execution inside a victim project's CI with a released artefact as the consequence, and a hidden-task persistence kit (VS Code tasks.json with a hidden task, settings that allow automatic tasks and hide the terminal, a decoy README, .gitignore edits). Hunting concepts: on developer endpoints, node or python child processes started by test runners, build tools or an editor's folder-open task that then make requests to public Ethereum explorer or RPC services (shared public services, so the request alone is not an infection), and detached long-lived node processes; in repositories, build scripts that run a local file before the real command, config files with very long lines after hundreds of tabs or spaces, and VS Code tasks that run on folder open. On CI: pull_request workflows from forks that run without maintainer approval, build and release jobs triggered by fork pull requests, and artefacts published from them. Post-incident: removing the code does not revoke the GitHub access that pushed it; rotate tokens, review force-pushes and rewritten history, and treat build artefacts produced from poisoned commits as untrusted (the CircuitVerse installers stayed downloadable for more than a month). Hardening: require approval for fork workflows, never let fork pull requests publish artefacts, block build-time egress to public blockchain RPC services where unneeded, and do not allow automatic VS Code tasks on folder open. StepSecurity also lists IOCs and a read-only check list in its post; they are not reproduced here. Admiralty hint: B1 (two labs, independent measurements).
  - title: "Unit 42 on NGINX HTTP/2 use-after-free CVE-2026-123633: a Unit 42 researcher reached pre-authentication code execution as the worker user on a non-default configuration by chaining it with a separate leak F5 will not give a CVE, and publishes the exposure test and the log signal to hunt"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/", publisher: "Palo Alto Networks Unit 42", date: "2026-11-24", role: "primary" }
    discovery_trace: "first seen at: standing check of unit42, feed URL https://unit42.paloaltonetworks.com/feed/ (item 2026-11-24T23:00Z) -> primary: https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/ ; CVE already covered by the nginx2root entry found in work/2026-11-26T0356Z-intel/prior_coverage.json"
    summary: |
      A Unit 42 researcher, credited by F5 as memN0ps among the reporters of CVE-2026-123633, published the technical analysis on 2026-11-24. The defect is in NGINX's HTTP/2 stream creation, which leaves a connection marked reusable after a request starts; when free worker connections fall to a sixteenth of worker_connections and a request-time DNS lookup opens a new resolver socket, NGINX closes the live connection and frees resolver state the request still uses. Unit 42 reproduced the use-after-free with AddressSanitizer on 1.31.7 and 1.31.8 (loopback, worker_connections lowered to 16, master process off) and, on two VMs, chained it with a separate memory disclosure that leaks a libc pointer to obtain an interactive shell as the unprivileged worker user on a non-default configuration; the first attempt failed and the second succeeded. Unit 42 says F5 classed that disclosure as limited to a non-typical configuration and has not assigned a CVE, so it withholds the details and exploit steps. F5's CVE record scores the HTTP/2 flaw 9.2 under CVSS 4.0 and 8.1 under CVSS 3.1 while the NGINX advisories page labels it medium; fixes are in NGINX 1.30.7 and 1.31.9, and the CVE record lists no workaround. The reproduced path needs HTTP/2 enabled and a proxy route whose upstream hostname is a variable resolved at request time through a configured resolver, though F5's description covers a broader set of HTTP/2 reverse proxies and Unit 42 did not test grpc_pass, fastcgi_pass, uwsgi_pass or scgi_pass.
    region_nexus: "global; NGINX fronts many federal, cantonal and communal web and API estates, and appliances that embed it are already tracked in the covering entry"
    primary_sector_nexus: "direct: internet-facing reverse proxies"
    sector: "public-sector"
    cves: [CVE-2026-123633]
    techniques: [T1190]
    affected_products: ["NGINX", "NGINX Plus"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: update-of:2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    evidence:
      - quote: "From an attacker VM, I achieved pre-authentication remote code execution on a target VM as the non-root NGINX worker. The chain required a non-default NGINX configuration, and some attempts did not open a shell."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"
      - quote: "F5 assessed the memory disclosure as a behavior limited to a non-typical configuration and has not assigned it a CVE at the time of writing"
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"
      - quote: "CVE-2026-123633 affects NGINX servers that accept HTTP/2 client connections and proxy requests to a backend when free worker connections run low."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/"
    extended_notes: |
      Delta against the 2026-11-19 entry (five flaws fixed 2026-11-18, CERT-EU says unauthenticated code execution possible, Rapid7 proof of concept for CVE-2026-123007, no exploitation reported): the first vendor-lab demonstration of code execution through CVE-2026-123633, an unpatched-by-CVE companion leak, and the first published detection and exposure guidance for this flaw. S1 may also return it. Detection concepts: the NGINX error log line 'worker_connections are not enough, reusing connections' (warn level, logged at most once per second per worker; the default error level omits warnings, so set error_log to warn or finer), correlated with resolver traffic and connection pressure on routes that resolve at request time; unexpected worker exits near HTTP/2 requests. Both signals also occur under ordinary load, and a worker exit alone is weak evidence; a release build may keep running after reading freed memory. Exposure test: HTTP/2 enabled on a listener (listen ... http2, or 'http2 on;' on 1.25.1 and later), a variable proxy_pass target resolved at request time with a configured resolver, and how close the worker gets to worker_connections; check the live configuration, since the master can load a file other than the packaged path (nginx -T prints the on-disk one). Mitigation if the upgrade must wait: disable HTTP/2 on exposed listeners where possible (this can break gRPC and shift load to HTTP/1.1); raising worker_connections only adds headroom. Unit 42's ASan test setup (loopback, worker_connections set to 16, master process off) is a lab configuration, not the documented default of 512. Admiralty hint: B2 (single vendor lab, reporter-authored).
  - title: "Guardio 'PaperCut': one added script tag in a payment processor's hosted card form served a WebRTC-based card skimmer to about 80 US newspaper checkouts from 2026-11-13 to 2026-11-19, invisible to the publisher's CSP and page monitoring"
    sources:
      - { url: "https://guard.io/labs/papercut---80-us-newspaper-websites-served-a-credit-card-stealer", publisher: "Guardio Labs", date: "2026-11-22", role: "primary" }
      - { url: "https://news.risky.biz/risky-bulletin-card-stealer-found-on-80-major-us-news-sites/", publisher: "Risky Business News", date: "2026-11-25", role: "corroborating" }
    discovery_trace: "first seen at: risky-biz-news slice record, feed URL https://news.risky.biz/rss/ -> Risky Bulletin 2026-11-25 https://news.risky.biz/risky-bulletin-card-stealer-found-on-80-major-us-news-sites/ (lead item, links Guardio) -> primary: Guardio Labs https://guard.io/labs/papercut---80-us-newspaper-websites-served-a-credit-card-stealer ; no vendor (Naviga, Payway) statement was found"
    summary: |
      Guardio Labs reports that from 2026-11-13 a single script tag added to the card form that the payment processor Payway hosts inside the checkout of newspapers using Naviga's subscription software loaded a file disguised as an old jQuery release. That file is a small remote-control loader: it opens a WebRTC connection to an attacker server, which sends the actual card stealer to each visitor, so the stealer is never stored in a scannable file; when the buyer hovers over the pay button, card number, expiry and security code, plus any name, email, phone and address fields on the form, leave over the WebRTC channel with no ordinary web request. Guardio says the newspaper's own page did not change and the tag sat inside the processor's frame, so the publisher's content security policy and monitoring did not treat it as theirs, and that CSP controls web requests, not WebRTC; it counts about 80 affected checkouts and roughly 15,000 downloads of the loader per day (jsDelivr statistics, not a count of stolen cards) until the line was removed on 2026-11-19. Guardio notes Sansec reported the first WebRTC card skimmer in March 2026, and says what is new is where it was planted; Risky Business News relays the finding and says the vendor was informed. No vendor statement was found.
    region_nexus: "United States newspapers; transferable to any Swiss public body that embeds a third-party hosted payment form (cantonal and communal e-shops, fee and fine portals)"
    primary_sector_nexus: "indirect: the lesson applies to government e-payment pages that embed a processor's hosted form"
    sector: "public-sector"
    cves: []
    techniques: [T1195.002, T1059.007, T1056, T1041]
    affected_products: ["Naviga subscription checkout", "Payway hosted payment form"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "US consumer-newspaper victims and a single research source, but the delivery pattern (a trusted processor's hosted frame plus WebRTC exfiltration that CSP and web-request monitoring cannot see) is transferable to Swiss government card-payment pages; the main agent decides whether it clears the relevance bar"
    evidence:
      - quote: "CSP, the usual defense against skimmers, controls web requests, not WebRTC."
        attribution: "Guardio Labs"
        source_url: "https://guard.io/labs/papercut---80-us-newspaper-websites-served-a-credit-card-stealer"
      - quote: "The newspaper’s own page didn’t change. The tag sits inside Payway’s frame, so the newspaper’s code, CSP and monitoring tools don’t treat it as theirs."
        attribution: "Guardio Labs"
        source_url: "https://guard.io/labs/papercut---80-us-newspaper-websites-served-a-credit-card-stealer"
      - quote: "a hosted payment form is part of your checkout. Monitor what it loads, including WebRTC connections, not just your own page."
        attribution: "Guardio Labs"
        source_url: "https://guard.io/labs/papercut---80-us-newspaper-websites-served-a-credit-card-stealer"
    extended_notes: |
      Detection concepts: browser-side or proxy telemetry on payment pages showing a script loaded from a public CDN or code-hosting path under a file name that mimics an old library, followed by a WebRTC peer connection (outbound UDP to a single address) opened from the payment frame; a hosted form that starts loading a script it did not load before; script-integrity or content-change monitoring on the processor's form, not only on your own page; network logs show only an encrypted connection to an address, not card data, so network inspection alone will not see the theft. Triage lookalike: WebRTC on legitimate video-call or chat widgets is normal; on a payment page with a card-number field it is not, and Guardio says the skimmer only activates where a card field exists. Hardening named by Guardio: treat the hosted payment form as part of your checkout and monitor what it loads including WebRTC; ask the processor how it controls template changes (the added line was in the processor's form, so the publisher could only have caught it by monitoring the frame). Post-incident: cards typed on the affected checkouts between 2026-11-13 and 2026-11-19 should be treated as exposed; notification duties may apply to publishers. Guardio's page lists indicators, which are not reproduced here. Admiralty hint: B2 (Guardio holds the telemetry via jsDelivr statistics and its own captures; no second independent source).
