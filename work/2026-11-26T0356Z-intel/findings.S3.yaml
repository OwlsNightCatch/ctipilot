    summary: |
      Developments on a covered vulnerability, CVE-2026-132165 in Drupal core's installer (SA-CORE-2026-017, fixed 2026-11-18 in 10.6.22, 11.3.22 and 11.4.13, exploitation on live sites reported from 2026-11-19 19:00 UTC). On 2026-11-24 CISA added it to the KEV catalog, and the same day Searchlight Cyber published how a default, unauthenticated attacker reaches the bug: by exhausting a system limit (open file descriptors, the database connection limit, or the local TCP source-port range) the attacker makes the installer's early database checks fail and a later one succeed within a single request, so install.php treats an installed site as new. Searchlight shows this on Apache and PHP-FPM with MySQL and PostgreSQL on Drupal 8.9, 9, 10 and 11, then reaches code execution by choosing an SQLite database path ending in .php under the web root, storing PHP as the site name, and requesting the file through a path-handling gap in Drupal's stock .htaccess rule for core scripts; Searchlight states the underlying flaw duplicates a finding by Anthropic's OSS Scanner and that its contribution is making it exploitable on stock configurations. StepSecurity independently reproduced installer re-entry on 11.4.12 with a PostgreSQL connection flood (about 12 percent of install.php requests returned the 'Database configuration' form in one 20-second run) and none on 11.4.13, and reports that the fixed releases do not change the .htaccess rule, so a PHP file that the web-server user can write into a code directory such as web/modules still executes on patched versions. End-of-life Drupal 8.9 and 9 are reported affected with no fix; StepSecurity also lists 10.5 and earlier and 11.0 to 11.2 as affected with no fix, and Drupal's advisory says those branches receive no security coverage. The Hacker News reports a CVSS score of 9.8; StepSecurity says no CVSS score existed in the CVE record on 2026-11-26.
    region_nexus: "global; Drupal runs many federal, cantonal and communal sites in the German-speaking area, so the exposure test (reachable /core/install.php, version) applies directly"
