        attribution: "SafeDep"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
      - quote: "The loader uses only the standard library. It needs no dependency, so a scan of `requirements.txt` or a lockfile does not show it."
        attribution: "SafeDep"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
