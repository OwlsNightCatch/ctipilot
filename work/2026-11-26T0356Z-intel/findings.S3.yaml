  - title: "PolinRider develops two ways in: a Python loader in conftest.py and utils modules that runs JavaScript stored in Ethereum transaction data (375 repositories), and force-pushed pull-request commits that ran in CircuitVerse's release CI and published 40 infected installers"
    sources:
      - { url: "https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests", publisher: "StepSecurity", date: "2026-11-26", role: "primary" }
      - { url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata", publisher: "SafeDep", date: "2026-11-24", role: "primary" }
    discovery_trace: "first seen at: out-of-slice sweep of safedep, URL https://safedep.io/rss.xml (item 2026-11-24) and stepsecurity-blog, URL https://www.stepsecurity.io/blog/rss.xml (feed stamps 2026-11-25T22:13Z; page dated 2026-11-26) -> primary: SafeDep https://safedep.io/blog/polinrider-python-loader-ethereum-calldata and StepSecurity https://www.stepsecurity.io/blog/polinrider-malware-open-source-pull-requests ; Risky Bulletin 2026-11-25 (https://news.risky.biz/risky-bulletin-card-stealer-found-on-80-major-us-news-sites/) relayed the SafeDep item"
    summary: |
      Two labs with independent telemetry extend the PolinRider campaign already in the store. SafeDep found on 2026-11-24 a Python variant: a 58-line loader hidden in a utils package or conftest.py that, when Python imports it (pytest does so through conftest.py), reads the newest transaction an Ethereum wallet sent to itself through public explorer and RPC services, decodes the transaction data as JavaScript, runs it with Node.js, and hands the next stage to a detached node process; it appears in 375 public repositories under 260 accounts, in no PyPI or npm package, and uses only the standard library, so scans of requirements files or lockfiles do not show it. StepSecurity reports that on 2026-10-19 rewritten commits carrying the loader were force-pushed into still-open pull requests from one GitHub account at AsyncAPI Generator, CircuitVerse and Open Food Facts, each malicious commit reusing the message and date of a clean signed commit and standing for 30 to 40 minutes at AsyncAPI before a later force-push left a clean final diff. Three triggers start it without any install script: a node api.js prefix on the build and dev scripts, config files that Jest or PostCSS load, and a hidden VS Code folderOpen task. At CircuitVerse the pull-request workflows ran with no approval step, including the release build for the desktop app, and the maintainers say the fork pull requests published 40 infected installers through their CI, which they deleted on 2026-11-25; at AsyncAPI fork workflows need a maintainer's approval and none ran; none of the account's 145 merged pull requests contains the loader. StepSecurity ties the same wallet to the fake-recruiter AccuraSoftHire campaign and says the fake interviews and these repository infections share an operator (StepSecurity's assessment, from shared wallet funding).
    region_nexus: "global; relevant to Swiss public-sector software teams that accept external pull requests or build open-source dependencies on developer machines and CI runners"
    primary_sector_nexus: "indirect: developer endpoints and build pipelines, not citizen-facing services"
