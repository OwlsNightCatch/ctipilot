  - title: "CISA lists three Danfoss AK-SM 800A flaws (CVE-2023-25914, CVE-2023-25915, CVE-2025-41450) as known exploited, the controller family BACS says was attacked in Switzerland"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/11/25/cisa-adds-10-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-11-25", role: "primary" }
