  - title: "Basel-Stadt data-protection commissioner stops by binding instruction the cantonal administration's plan to move its VPN and web proxy into a US provider's cloud with encryption broken open (project Infra21+)"
    suggested_kind: policy
    sources:
      - { url: "https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud", publisher: "Kanton Basel-Stadt, Datenschutzbeauftragte (DSB)", date: "2026-11-18", role: "primary" }
      - { url: "https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125", publisher: "Inside IT", date: "2026-11-25", role: "corroborating" }
      - { url: "https://www.inside-it.ch/schwyz-will-vorerst-an-m365-festhalten-20261125", publisher: "Inside IT", date: "2026-11-25", role: "context" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (feed item 'Basler Datenschutzbeauftragte verhindert Datenauslagerung', 2026-11-25 14:20Z) → drilled article https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125 (url --direct, body from __NEXT_DATA__) → pivot: https://www.bs.ch/datenschutzbeauftragte (listing of DSB news, fetched with url --direct) → primary: DSB Basel-Stadt release, URL https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud (extract; page date metadata 2026-11-18). WebSearch for a second primary or an administration reaction found none."
    summary: |
      The data-protection commissioner of the canton of Basel-Stadt (DSB, Danielle Kaufmann) has issued a binding instruction (verbindliche Weisung) to prevent the cantonal administration from moving its remote access (VPN) and its internet-access control (web proxy) from locally operated systems into the cloud solution of a US provider. The DSB states that the provider would be meant to break the encryption, so that it could in practice reach most of the cantonal data traffic, including special-category personal data such as health data and secrecy-bound data such as tax data, and that Word files, case files, passwords and state-security-relevant information would be in scope. The administration should have submitted the plan for prior consultation before binding itself contractually but did not; the DSB learned of it late through concerned staff, gave a negative recommendation, and issued the instruction because the outsourcing was to proceed regardless. It finds no demonstrated urgency, says the existing local solution can be extended, and notes that as far as it knows the other cantons continue to run their VPN and web proxy locally, which it reads as proof that data-protection-compliant alternatives exist. Inside IT adds from its own research that the plan belongs to project Infra21+, which replaces the VPN-based remote-access infrastructure and the secure web gateway with a zero-trust network access (ZTNA) solution, that the contract went in April 2025 for CHF 11.3 million to the Swiss integrator BNC (now Axians BNC), and that BNC apparently intends to host web proxy and VPN at a US technology partner such as AWS; the DSB does not publish the provider's name. No source reports the administration's reaction, an appeal, or whether the project continues with a local design. The bs.ch page carries the date 2026-11-18; the trade press reported it first on 2026-11-25.
    region_nexus: "Switzerland, canton Basel-Stadt; the DSB points at the other cantons' local VPN and web-proxy practice"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["report:privatim-cloud-merkblatt-v3-02-2026"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "hat eine verbindliche Weisung erlassen, um die Auslagerung des kantonalen Datenverkehrs in die Cloud-Lösung eines US amerikanischen Anbieters zu verhindern"
        attribution: "Kanton Basel-Stadt, Datenschutzbeauftragte (DSB)"
        source_url: "https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud"
      - quote: "Es ist vorgesehen, dass der Anbieter die Verschlüsselung aufbricht."
        attribution: "Kanton Basel-Stadt, Datenschutzbeauftragte (DSB)"
        source_url: "https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud"
      - quote: "Soweit bekannt, setzen auch die anderen Kantone für ihre VPN und Web Proxys weiterhin auf klassische, lokale Lösungen."
        attribution: "Kanton Basel-Stadt, Datenschutzbeauftragte (DSB)"
        source_url: "https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud"
      - quote: "Der Zuschlag ging im April 2025 für 11,3 Millionen Franken an den Schweizer IT-Dienstleister BNC, der mittlerweile Axians BNC heisst."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125"
    extended_notes: |
      Admiralty hint: source A (the authority acting on its own jurisdiction), credibility 2 (the DSB's account of the plan and of its own instruction is not independently confirmed by the administration or the provider; Inside IT's tender detail is its own research). Reliability of the trade-press detail is C.
      Context only, not a separate item: on the same day Inside IT reports that the Schwyz cantonal government keeps its principle decision to introduce Microsoft 365 in the administration in its answer to a parliamentary interpellation on digital sovereignty (it classes the CLOUD Act risk as theoretical, cites more than 50 specialist applications already tied to Microsoft technology, and says open standards, exit and second-source options stay on the agenda). It changes no obligation and is not worth an entry on its own.
      Related store entry for the cantonal data-protection line on cloud: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk (references[] candidate; the DSB release does not cite privatim, so the link is the main agent's editorial call).
      Why it matters to a Tier 2/3 reader: it is a regulator-enforced limit on one common architecture choice (TLS inspection and remote access run by a foreign hyperscaler for a cantonal administration) and a signal that other cantonal and communal data-protection offices may apply the same test; it carries no threat or detection content, hence borderline.
    borderline: true
    borderline_reason: "Regulator action on public-sector SASE/ZTNA outsourcing and TLS inspection: a sector-lens policy item with architecture implications for cantonal and communal network teams, but no threat, TTP or detection content; the primary page is dated 2026-11-18 and only the trade-press relay is in the 26 h window."

