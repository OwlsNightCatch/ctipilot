      Overlap warning: S1's progress file records the same delta (watchTowr / The Hacker News / NCSC-CH 13242 / Eye) as a GeoServer `update-of`; the main agent should write ONE changelog record. The S2 contribution is that the Swiss authority itself now rates it actively exploited (advisory 13242, 2026-11-25 14:40Z) and that GeoServer is typical public-administration geodata infrastructure. The CSH post has no `lastModified`, so there is no later revision to track.
      Exposure check (from the sources): GeoServer version is visible on the 'About GeoServer' page (Eye Security); the chain needs network access to an instance exposing WFS/OWS services (NCSC-CH). Post-patch check implied by the chain: the remember-me key and password hashes are read from users.xml and security/config.xml, so an instance exposed before upgrading needs its administrator credentials and the remember-me key rotated and its JDBC data-store list reviewed; this is an inference from the chain, not a vendor statement.
