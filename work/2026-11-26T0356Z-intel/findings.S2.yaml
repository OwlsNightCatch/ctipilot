      - { url: "https://www.bacs.admin.ch/de/warnung-kuehlanlagen-de", publisher: "BACS / NCSC Switzerland", date: "2026-11-10", role: "context (Swiss nexus)" }
    discovery_trace: "first seen at: cisa-advisories, WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories (listing, newest alert 'CISA Adds 10 Known Exploited Vulnerabilities to Catalog', 2026-11-25) → drilled https://www.cisa.gov/news-events/alerts/2026/11/25/cisa-adds-10-known-exploited-vulnerabilities-catalog (WebFetch) → KEV JSON via bridge `cisa-kev` (descriptions) → vendor primary Danfoss DSA-2023-08-01 (extract) → Swiss context BACS page https://www.bacs.admin.ch/de/warnung-kuehlanlagen-de (extract), already cited in the store's Danfoss entry."
    summary: |
      CISA added ten vulnerabilities to its Known Exploited Vulnerabilities catalogue on 2026-11-25, among them three in the Danfoss AK-SM 800A series: CVE-2023-25914 (path traversal that reads files of the underlying server through the XML interface), CVE-2023-25915 (improper input validation that lets a remote attacker run arbitrary commands) and CVE-2025-41450 (improper authentication that generates a web report exposing internal IP addresses, usernames and store names). CISA names no actor, campaign or victims, and the alert gives only the short catalogue labels. The two 2023 flaws are in Danfoss advisory DSA-2023-08-01 (AK-SM 800A below software version 3.3, CVSS 7.5 and 9.8 as Danfoss rates them) and CVE-2025-41450 is the 'code-of-the-day' bypass the store records as fixed in firmware build 4.2, so what CISA lists are old, patched flaws, which fits BACS's statement of 2026-11-10 that the AK-SM 800A family is exposed when it runs outdated firmware and that attackers reach management interfaces reachable directly from the internet; whether the KEV evidence comes from the October to November campaign is not stated by any source (inference, not a finding). The store's refrigeration entries cover the Swiss incidents and the six unpatched pre-authentication flaws in firmware up to 5.3.2 but none of these three KEV rows carries an exploited status. BACS lists butchers, restaurants, pharmacies, doctors' practices, laboratories and logistics sites as typical users and has warned operators of critical infrastructure through the Cyber Security Hub (advisory 13054, edited 2026-11-16).
    region_nexus: "Switzerland and Europe; BACS says attacks on refrigeration controllers have affected Switzerland"
    primary_sector_nexus: "indirect (cold-chain controllers in healthcare, municipal catering and logistics)"
