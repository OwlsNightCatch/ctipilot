        attribution: "Danfoss PSIRT"
        source_url: "https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2023-08-01/"
      - quote: "Den bisherigen Erkenntnissen zufolge verschaffen sich Angreifer Zugriff auf Managementschnittstellen, die direkt aus dem Internet erreichbar sind."
        attribution: "BACS / NCSC Switzerland"
        source_url: "https://www.bacs.admin.ch/de/warnung-kuehlanlagen-de"
    extended_notes: |
      Overlap warning: this is S1's KEV-diff territory (kev-window.txt rows: CVE-2023-25914 and CVE-2023-25915 NOT COVERED, CVE-2025-41450 COVERED-STALE on 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce). It is returned from S2 because the Swiss nexus is strong (BACS page of 2026-11-10 and CSH advisory 13054); the main agent should fold both into one changelog record, preferably on the incident entry named in `novelty`, with the Claroty entry's cves[] status for CVE-2025-41450 moved to exploited.
      Sources disagree on the 2023 flaws' severity and authentication: Danfoss rates CVE-2023-25914 at 7.5 and CVE-2023-25915 at 9.8 and words the latter as remote without a login, while the search snippets of Synacktiv's 2023 research (not fetched) describe the command execution as authenticated root; do not carry either reading beyond the vendor's words.
      Exposure per BACS: the AK-SM 800A / 8xxA family with outdated firmware, the end-of-life AK-SM 800 and AK-SC 355, and Copeland/Dixell XWEB; check Internet reachability of the management interface, including units run by external service providers.
