    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge `ncsc-csh recent 25` (post 13242 'GeoServer: Actively Exploited Unauthenticated RCE Chain', created 2026-11-25T14:40Z, reference list read from the post body) → pivot: The Hacker News, URL https://thehackernews.com/2026/11/hackers-exploit-two-geoserver-flaws-as.html (extract) → primary disclosure: Eye Security, URL https://labs.eye.security/unauthenticated-remote-code-execution-vulnerability-in-geoserver/ (extract). The exploitation claim originates in a watchTowr post on X that both NCSC-CH and The Hacker News link; the X page was not fetched and is not cited."
    summary: |
      The Swiss NCSC Cyber Security Hub published advisory 13242 on 2026-11-25 14:40 UTC for the GeoServer chain it labels "Actively Exploited, Proof of concept available": CVE-2026-120705 (unauthenticated WFS GetFeatureById XML injection leading to arbitrary file read and SSRF, CVSS 8.6, marked actively exploited), CVE-2026-129245 (hard-coded remember-me signing key that forges administrator sessions, 9.2) and CVE-2026-120704 (administrator-controlled JDBC configuration that loads a native library, 7.2). Its references include the Eye Security disclosure, the three GeoServer GitHub advisories, an unverified public proof of concept, The Hacker News and a watchTowr post on X reporting in-the-wild exploitation. The Hacker News reports that watchTowr says attackers are exploiting CVE-2026-120705 and CVE-2026-129243 (the service-security bypass with a prefixed service name such as x/WFS), and quotes watchTowr that the attackers sent error-based probes creating and invoking stored queries to validate that a server is vulnerable. These are the first sources the store has that report exploitation; the existing entry says no source reported it as of 2026-11-25. The claim belongs to watchTowr and is relayed by NCSC-CH and The Hacker News; neither names an actor, victims or scale, and CISA's KEV catalogue (version 2026.11.25) does not list any of the five CVEs. Sources disagree on one date: The Hacker News says the project's advisories were published on 2026-11-24, Eye Security says GeoServer published the details on 2026-11-23, and the fixed releases (3.0.2, 2.28.6, and the unsupported-series 2.27.7) have been out since 2026-10-19.
    region_nexus: "global; NCSC-CH issued the advisory to Swiss critical-infrastructure operators; Eye Security says GeoServer is commonly used by government institutions to publish open data"
    primary_sector_nexus: "direct (geodata services of public administrations)"
    sector: "public-sector"
