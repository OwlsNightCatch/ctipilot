  and the page was not read by extract.
- Danfoss advisory pages (DSA-2023-08-01, DSA-2025-03-01, DSA-2025-08-01, DSA-2026-12-01), Mitel, GeoServer,
  Eye, The Hacker News and watchTowr read through extract (trafilatura-direct); NCSC.ch through ncsc-csh
