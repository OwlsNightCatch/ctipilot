- id: 3
  name: 'GeoServer five-step chain: exploitation now claimed (watchTowr), relayed by The Hacker News and
    NCSC.ch'
  entry: entries/2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc.md
  entry_already_states:
  - Project advisories published 2026-11-23, fixes 3.0.2, 2.28.6, 2.27.7 announced 2026-10-19, 2.27 end
    of life; five-step chain (CVE-2026-129244, -129243, -120705, -129245, -129242); CryptoCat's full-chain
    PoC public; priority high; 'no source reports exploitation as of 2026-11-25'.
  - CVE-2026-120704 is not in the entry's cves[] and not in state/cves_seen.json.
  who_says_exploitation_happened:
    originator: 'watchTowr (vulnerability-intelligence vendor with its own honeypot network ''Attacker
      Eye''); the claim reached the store through three documents that all trace to watchTowr: its own
      FAQ page, a post on X that The Hacker News and NCSC.ch link (the X post was not fetched and is not
      citable), and The Hacker News'' article quoting the post.'
    relays: The Hacker News (2026-11-25, article updated after publication) and NCSC Switzerland Security
      Hub advisory 13242 (created 2026-11-25T14:40:27Z, history shows only 'Published', no later edit).
      Neither adds telemetry; NCSC.ch lists the X post under 'Additional Sources' as 'report of in-the-wild
      exploitation'.
    date_of_claim: '2026-11-25 (The Hacker News: ''in an X post today''; watchTowr FAQ dated 2026-11-25;
      NCSC.ch post 14:40Z). Derived, not source-stated and not citable: the numeric id of the linked X
      status decodes under the public snowflake scheme to about 2026-11-25T11:09Z.'
    what_watchTowr_does_not_state: watchTowr's FAQ names no actor ('No attribution has been made public.'),
      no victim, no scale and no source-IP data; its FAQ does not say its honeypots saw the traffic (the
      honeypot sentence only says the network 'is monitoring for exploitation activity as it emerges'),
      although a honeypot origin is the natural reading.
    independence: One observer. Three documents, one set of sensors; nothing independent of watchTowr
      confirms exploitation. Two open-web searches found no second report. CISA's KEV catalogue (2026.11.25)
      lists none of CVE-2026-120705, -129243, -129245, -129244, -129242 or -120704.
  which_cves_are_named_as_exploited:
    The Hacker News (quoting watchTowr): CVE-2026-120705 and CVE-2026-129243 only
    NCSC.ch 13242: the post is rated 'Actively Exploited'; only CVE-2026-120705 carries the label '(actively
      exploited)'; its CVE list is CVE-2026-120705, CVE-2026-129245, CVE-2026-120704 (CVE-2026-129243,
      -129244, -129242 are absent)
    watchTowr FAQ prose: all five chain CVEs (CVE-2026-129245, -129242, -129243, -129244, -120705)
    watchTowr FAQ table: CVE-2026-129245 'Yes'; CVE-2026-129242, -129243, -129244, -120705, -120704 and
      the other eleven rows 'Not reported'
    reading: The three statements disagree; CVE-2026-120705 is the only CVE named as exploited by all
      three documents' prose or labels. Keep the claim attributed and per-source; do not upgrade the whole
      chain to exploited.
  probe_behavior:
    source_wording: '''Attackers sent error-based exploit probes to validate that the server is vulnerable
      by creating and invoking stored queries'' (watchTowr post as quoted by The Hacker News).'
    telemetry_class: 'web or reverse-proxy access logs for the WFS endpoint: requests creating stored
      queries and then invoking them from clients that never authenticated, answered with WFS exception
      reports.'
    inference_not_source_stated: The project advisory for CVE-2026-120705 says the fetched text comes
      back 'in the `Illegal property name` error response' and that contents are echoed only when a layer
      is published to anonymous users, which matches an error-based validity probe; and the service-name
      bypass (CVE-2026-129243) is what lets anonymous clients create stored queries. These two links are
      the composer's inference from the project text, not a watchTowr statement. The entry's existing
      detection lines (slash in the service parameter, stored queries under wfs/query and workspaces/*/wfs/query)
      already cover them.
