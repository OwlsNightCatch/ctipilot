item1_artex_update:
  entry_id: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
  novelty: update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
  recommended_record:
    type: update
    internal: false
    why: Four newly named ARTEX users, the identity of the commercial seller, a defender-relevant statement that provider-side telemetry will not show ARTEX,
      and a consolidated behavioural detection set are reader-facing deltas, so a non-internal update that floats the entry is warranted. Priority stays
      notable (no new exploitation of a constituency body, no do-now action derived).
    fields_touched_suggestion:
    - headline
    - summary
    - tags
    - entities
    - techniques
    - sources
    - evidence
    - sourcing_note
    - body
  source_times:
    microsoft_guide: 2026-11-25T18:09:06Z (Microsoft blog feed pubDate; page date 2026-11-25)
    the_record: 2026-11-25 (page metadata; time not stamped)
    microsoft_north_korea_report: 2026-10-29 (page metadata)
    threatbook_launch_release: 2026-10-16 (PR Newswire copy on TNGlobal and Macau Business)
    nextgov: 2026-11-24 (page metadata)
  already_in_entry_do_not_repeat:
  - Storm-0940 as a China-state aligned actor and privileged cloud access in under three hours (entry body and summary).
  - Storm-3358 (Cambodia-based, financially motivated) from Microsoft 2026-11-06, including the default tool set (Nmap, curl, wget, Python HTTP clients,
    headless Chromium through Playwright) and the honeypot, decoy, tarpit and fake-win statement (update 2026-11-07).
  - Original repository removed in October, forks and an unnamed commercial version in circulation (updates 2026-11-01, 2026-11-08, 2026-11-16).
  - 'FBI table: Kudu abuse, XXE cloud-metadata query, .aspx and .jsp files in unexpected paths, outbound calls to LLM API endpoints (update 2026-11-16).'
  - Python and curl user agents as weak evidence (Triage line); credential additions and an application assigning itself a directory role as Entra audit-log
    detection (Detection line).
  delta_claims:
  - id: C1
    status: NEW
    claim: 'Microsoft names six actors as integrating ARTEX into their tooling: Storm-0940, Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon and Salt
      Typhoon, described collectively as "both state-sponsored and financially motivated". Onyx Sleet, Pearl Sleet, Crystal Typhoon and Salt Typhoon are
      new to the entry (and to the registry).'
    support:
    - quote: As of November 2026, Microsoft Threat Intelligence has observed both state-sponsored and financially motivated threat actors such as Storm-0940,
        Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon, and Salt Typhoon integrating ARTEX into their tooling.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    note: The guide gives no nexus, no campaign detail and no method per actor. Two of the four (Onyx Sleet, Pearl Sleet) are backed by Microsoft's separate
      2026-10-29 report (C2); the two Typhoon clusters are not.
  - id: C2
    status: NEW
    claim: Microsoft's separate report of 2026-10-29 on North Korean AI adoption says it has identified Onyx Sleet and Pearl Sleet using ARTEX since late
      October 2026, rates both at its "accelerating" stage of AI adoption, and assesses that North Korean AI-enabled operations remain human-directed and
      have not become fully autonomous. That report is the only place in this evidence set where Onyx Sleet and Pearl Sleet ARTEX use is described, and
      it gives no operation, target or technique detail for it.
    support:
    - quote: Since late October 2026, Microsoft Threat Intelligence has identified Onyx Sleet and Pearl Sleet leveraging open-source agentic AI penetration
        testing ARTEX in operations, highlighting how North Korean threat actors are adopting new AI technologies as they become available.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
      check: grep -F on fu4/msft-nk.norm.txt
    - quote: Further, Onyx Sleet and Pearl Sleet are leveraging the open-source agentic AI penetration testing framework ARTEX to conduct operations, further
        indicating North Korea’s willingness to quickly adopt new AI technologies for their operations.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
      check: grep -F on fu4/msft-nk.norm.txt
    - quote: Microsoft Threat Intelligence assesses that Diamond Sleet, Onyx Sleet, Pearl Sleet, and Sapphire Sleet are at the accelerating stage of AI
        adoption.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
      check: grep -F on fu4/msft-nk.norm.txt
    - quote: Despite threat actors’ adoption of AI, Microsoft Threat Intelligence assesses that AI-enabled operations remain human-directed and have not
        become fully autonomous.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
      check: grep -F on fu4/msft-nk.norm.txt
    note: 'How Microsoft knows: "has identified" with no telemetry or method stated. The ARTEX use began after the original repository was withdrawn (2026-10-08
      per FBI and ThreatBook), so these actors use a fork or the commercial edition; neither source says which.'
  - id: C3
    status: NEW
    claim: 'Crystal Typhoon and Salt Typhoon: the guide states only that they integrate ARTEX into their tooling. It carries no link and no campaign detail
      for them and states no nexus on the page. The China nexus comes from Microsoft''s naming convention (family name Typhoon equals origin or attribution
      to China, per Microsoft''s naming page) and from The Record, which writes "Chinese state-backed groups". The Record''s phrase that ARTEX "has been
      steadily added to the arsenal of multiple North Korean and Chinese groups" is The Record''s characterisation, not Microsoft wording.'
    support:
    - quote: Storm-0940, Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon, and Salt Typhoon integrating ARTEX into their tooling.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: For nation-state actors, a family name is assigned to a country/region of origin tied to attribution. For example, Typhoon indicates origin
        or attribution to China.
      source_url: https://learn.microsoft.com/en-us/unified-secops-platform/microsoft-threat-actor-naming
      check: grep -F on fu4/msft-naming.norm.txt
    - quote: '| Salt Typhoon | China | OPERATOR PANDA, GhostEmperor, FamousSparrow |'
      source_url: https://learn.microsoft.com/en-us/unified-secops-platform/microsoft-threat-actor-naming
      check: grep -F on fu4/msft-naming.norm.txt
    - quote: '| Crystal Typhoon | China | Storm-1849, UAT4356 |'
      source_url: https://learn.microsoft.com/en-us/unified-secops-platform/microsoft-threat-actor-naming
      check: grep -F on fu4/msft-naming.norm.txt
    - quote: Microsoft said on Wednesday that Chinese state-backed groups Crystal Typhoon and Salt Typhoon have integrated Artex into their suite of tools,
        using it for “network reconnaissance, credential attacks, and web application exploitation.”
      source_url: https://therecord.media/microsoft-china-salt-typhoon-using-artex-ai-tool
      check: grep -F on fu4/record.norm.txt
    - quote: Artex was released in July, and according to Microsoft, it has been steadily added to the arsenal of multiple North Korean and Chinese groups.
      source_url: https://therecord.media/microsoft-china-salt-typhoon-using-artex-ai-tool
      check: grep -F on fu4/record.norm.txt
    note: Evidence class undisclosed; Microsoft holds endpoint, identity and cloud telemetry so it could know, but publishes nothing to test it. Treat the
      two Typhoon attributions as Microsoft-only assertions (single source, relayed by The Record). Do not carry The Record's Salt Typhoon background (2024
      telecom intrusions) as part of the ARTEX finding.
  - id: C4
    status: NEW
    claim: 'Link observation on the guide: the hyperlink on "Storm-0940" points to the 2026-10-29 North Korea report, the same URL as Onyx Sleet and Pearl
      Sleet, while Storm-3358 links to the 2026-11-06 report. That North Korea report mentions ARTEX only for Onyx Sleet and Pearl Sleet and never mentions
      Storm-0940. Microsoft''s Storm-0940 report of 2026-10-21 appears only in the guide''s References list.'
    support: []
    note: 'Checked with grep -F on the raw extraction: the Storm-0940, Onyx Sleet and Pearl Sleet anchors carry the 2026/10/29 URL and the Storm-3358 anchor
      carries the 2026/11/06 URL; grep -c -i storm-0940 on the 2026-10-29 report returns 0. Likely an authoring slip on Microsoft''s side. Do not cite that
      anchor as support for Storm-0940; cite the 2026-10-21 post.'
  - id: C5
    status: NEW
    claim: 'ThreatBook: Microsoft says that in November 2026 ThreatBook claimed ownership of ARTEX and began offering commercial access to "ARTEX Pro",
      alongside CyberStrikeAI Enterprise Edition. The Record relays this only as "at least one Chinese company" and does not name ThreatBook.'
    support:
    - quote: In November 2026, the China-based cybersecurity company ThreatBook (微步在线) claimed ownership of ARTEX and began offering commercial access to
        “ARTEX Pro”, in addition to CyberStrikeAI Enterprise Edition and other AI-powered penetration testing frameworks.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: at least one Chinese company now offers commercial access to a version of it.
      source_url: https://therecord.media/microsoft-china-salt-typhoon-using-artex-ai-tool
      check: grep -F on fu4/record.norm.txt
    note: 'Who says it: Microsoft (a statement about what ThreatBook claimed and did). The guide cites no ThreatBook document.'
  - id: C6
    status: NEW
    claim: ThreatBook's own launch release for its RedAgents platform, dated 2026-10-16, already lists Artex Pro (Enterprise Edition) and describes it as
      an extension of Artex (Open-Source Edition), an autonomous pentest agent "developed as a personal project, by the product lead of RedAgents". It says
      the open-source edition was converted to closed source on 2026-10-08 after attackers misused it, and that CyberStrikeAI was acquired by ThreatBook
      in September 2026 (IT Brief reports the acquisition on 2026-10-02 and ThreatBook plans to keep the open-source version and add an enterprise edition).
    support:
    - quote: Artex Pro (Enterprise Edition). An extension of Artex (Open-Source Edition), which is an autonomous pentest agent developed as a personal project,
        by the product lead of RedAgents, Artex Pro enhances security control capabilities
      source_url: https://macaubusiness.com/threatbook-launches-ai-powered-pentest-aggregator-redagents/
      check: grep -F on fu4/tb-pr-macau.norm.txt
    - quote: Artex (Open-Source Edition) was officially converted to closed source on 8 October 2026 after being misused by attackers, leading to several
        large-scale security incidents in the financial services industry.
      source_url: https://macaubusiness.com/threatbook-launches-ai-powered-pentest-aggregator-redagents/
      check: grep -F on fu4/tb-pr-macau.norm.txt
    - quote: Given the lack of built-in security control measures in Artex (Open-Source Edition), it can only be used cautiously in test environments.
      source_url: https://macaubusiness.com/threatbook-launches-ai-powered-pentest-aggregator-redagents/
      check: grep -F on fu4/tb-pr-macau.norm.txt
    - quote: including Artex Pro, Cyber(YanJi), Yanxun, and CyberStrikeAI (Enterprise Edition).
      source_url: https://macaubusiness.com/threatbook-launches-ai-powered-pentest-aggregator-redagents/
      check: grep -F on fu4/tb-pr-macau.norm.txt
    - quote: CyberStrikeAI was acquired by ThreatBook in September 2026
      source_url: https://macaubusiness.com/threatbook-launches-ai-powered-pentest-aggregator-redagents/
      check: grep -F on fu4/tb-pr-macau.norm.txt
    - quote: ThreatBook has acquired the open-source AI penetration testing platform CyberStrikeAI, bringing one of the more widely used AI-led security
        testing tools into its red team portfolio.
      source_url: https://itbrief.com.au/story/threatbook-acquires-cyberstrikeai-in-red-team-push
      check: grep -F on fu4/tb-itbrief.norm.txt
    - quote: The company said it will keep the open-source version available while introducing an enterprise edition for internal security teams.
      source_url: https://itbrief.com.au/story/threatbook-acquires-cyberstrikeai-in-red-team-push
      check: grep -F on fu4/tb-itbrief.norm.txt
    note: 'Two discrepancies to keep visible. (1) Date: Microsoft places the ownership claim and the commercial offering in November; ThreatBook''s release
      naming Artex Pro is dated 2026-10-16 (TNGlobal and Macau Business copies of one PR Newswire release; the PR Newswire original was not fetched). (2)
      Wording: ThreatBook''s release does not literally claim that ThreatBook owns ARTEX; it says the open-source tool was a personal project of its RedAgents
      product lead. Microsoft''s "claimed ownership" may rest on a later ThreatBook statement that this run did not find. No source in this set says that
      the GitHub user Autumn-27 (Microsoft) or "a Chinese cybersecurity engineer known as Autumn-27" (Nextgov) is ThreatBook''s product lead; do not link
      them.'
  - id: C7
    status: NEW
    claim: Microsoft dates the original release to July 2026 by GitHub user Autumn-27, with a Chinese-language interface, and says forks now publish ARTEX
      in many other languages after the developer removed the code in October.
    support:
    - quote: In July 2026, GitHub user Autumn-27 published ARTEX as open-source code with a Chinese-language interface.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: While the original developer removed the source code in October 2026, other developers who had forked the project continue to publish their
        own versions of ARTEX in many other languages.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    note: The entry carries neither the author handle nor the release month.
  - id: C8
    status: NEW
    claim: 'Defender-relevant limit: ARTEX can drive virtually any model, including open-weight and abliterated ones, with an optional pool that fails over
      between models, keys and providers, so Microsoft says its activity is not necessarily constrained by one provider''s safety controls or visible in
      one provider''s telemetry. Provider-side telemetry cannot be the primary detection path; host, web and identity telemetry are.'
    support:
    - quote: The threat actor can configure ARTEX to power its agents with virtually any large language model, including frontier models, open-weight models,
        or models that the threat actor has abliterated (modified to remove built-in guardrails) or otherwise manually tuned.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: An optional pool function allows ARTEX to switch to different models when one fails for any reason
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: For that reason, ARTEX activity is not necessarily constrained by any single provider’s safety controls or visible in any single provider’s
        telemetry.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    note: 'Contrast with the FBI signal already in the entry (outbound calls to LLM API endpoints): Microsoft''s guide does not list LLM-API egress as a
      detection.'
  - id: C9
    status: NEW
    claim: Microsoft states ARTEX introduces no new attack techniques and does not obfuscate its activity by default, so existing compromise detections
      are expected to capture it; the durable signal is behavioural (varied requests in a short time, retries of technique variants, stage-to-stage progression
      at machine speed).
    support:
    - quote: ARTEX does not introduce new attack techniques; it uses common, pre-existing penetration testing tools and techniques.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: By default, ARTEX does not take any measures to obfuscate its malicious activity.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: 'The most reliable and durable signal of ARTEX activity is behavioral: ARTEX sends a wide variety of requests in a brief time and retries variations
        on the same technique or moves on to next-stage actions at machine speed.'
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    note: Overlaps Expel's and Wiz's existing statements; new in the default-no-obfuscation claim and in Microsoft naming the behavioural signal as its
      primary one.
  - id: C10
    status: NEW
    claim: 'Scale figure: in one Storm-0940 campaign that used ARTEX, Microsoft recorded more than 151,000 failed sign-ins, peaking at 2,900 per minute.'
    support:
    - quote: In one Storm-0940 campaign that used ARTEX, Microsoft recorded more than 151,000 failed sign-ins, peaking at 2,900 failures per minute.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
