      check: grep -F on fu4/auth0-det.norm.txt
    - quote: 'Because mail[.]tm exposes only one active mailbox domain at a time and replaces it periodically, a blocklist built from previously observed
        domains will very likely stop matching within weeks of being compiled. Our analysis of Auth0 telemetry supports this: signup activity tracks the
        domain currently returned by the mail[.]tm API.'
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: Agents commonly register accounts by calling the Auth0 Authentication API directly, which can skip protections applied in Universal Login.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
