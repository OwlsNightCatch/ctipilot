  threatbook_statement:
    who_says_what:
      microsoft_2026_11_25: In November 2026 ThreatBook claimed ownership of ARTEX and began offering commercial access to "ARTEX Pro" next to CyberStrikeAI
        Enterprise Edition (quote in C5).
      threatbook_release_2026_10_16: RedAgents launch release lists Artex Pro (Enterprise Edition) as an extension of the open-source Artex built as a personal
        project by the RedAgents product lead; the open-source edition went closed source on 2026-10-08 (quotes in C6).
      itbrief_2026_10_02: ThreatBook acquired CyberStrikeAI (company statement relayed by IT Brief), keeps the open-source version and adds an enterprise
        edition (quotes in C6).
      the_record: only "at least one Chinese company" (quote in C5).
    not_found: ThreatBook's own November statement claiming ownership of ARTEX was not found (WebSearch twice, threatbook.io home and its 2026-10-09 ARTEX
      incident post carry no ownership statement). The ownership claim is therefore Microsoft's characterisation plus ThreatBook's October "personal project
      of our product lead" wording.
    supersedes: See superseded_entry_sentences S2.
