  suggested_summary_for_composer: Okta Threat Intelligence, with data from Permiso's P0 Labs (part of Okta since 2026-08-26), reports that since June 2026
    and at scale in October and November AI agents registered disposable-email accounts on Auth0 tenants and Okta organizations with public self-service
    registration, mostly on the mail.tm family, which exposes a single rotating mailbox domain through an account-free API, so domain blocklists stop matching
    within weeks. In P0 Labs tests ARTEX, Cairn, CyberStrikeAI and pentestcode each picked mail.tm at run time and switched providers when blocked. Okta
    reads such sign-ups as a likely early sign that agents are tasked against an organization, says bot challenges stopped the October mail.tm attempts
    before email verification but that agents can solve challenges and often register through the Auth0 Authentication API, which skips Universal Login
    protections, and recommends disabling or restricting workforce self-registration, blocking disposable domains and API sign-ups, and polling the provider's
    domain list.
