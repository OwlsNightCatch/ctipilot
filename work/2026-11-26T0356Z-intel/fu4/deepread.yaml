    indicator: Identity-provider sign-up or registration events whose email domain belongs to a disposable-mail provider, in particular the provider's currently
      active mailbox domain, correlated with other agentic activity on the same web estate.
    where_it_shows_up: 'Identity-provider registration telemetry: the Auth0 tenant log (Okta''s linked Auth0 detection reads successful sign-up events,
      type ss, with failed sign-up fs in the tenant log query) and Okta self-service registration events; Okta states its own finding came from Auth0 telemetry
      and does not name an Okta System Log event type. The Authentication API path leaves the same sign-up events but bypasses Universal Login controls.'
    support:
    - quote: The query monitors successful signups events when a disposable email has been used.
      source_url: https://github.com/auth0/auth0-customer-detections/blob/5b3940da41120c9303cb4beae31526aa3e45862c/detections/risk_of_signup_fraud_by_disposable_domains.yml
