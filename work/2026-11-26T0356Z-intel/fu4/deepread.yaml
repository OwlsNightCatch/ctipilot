  caveats_and_contradictions:
  - Microsoft says November 2026 for the ThreatBook ownership claim; ThreatBook's release naming Artex Pro is dated 2026-10-16 (C6).
  - The Storm-0940 anchor in the guide points to the North Korea report (C4).
  - The Record states a China nexus for the two Typhoon clusters that the Microsoft page itself does not state.
  - The 151,000 figure is probably the 2026-10-10 to 2026-10-14 spray already in the ConnectWise entry, but Microsoft does not say so (C10).
  - The guide's two default user-agent tokens are indicator-class; the entry convention (no IOCs) argues for describing the existence of a default token
    and its fragility, not the values.
  - The guide is a consolidation by Microsoft; its detection list is Microsoft's read of ARTEX behaviour, not new victim telemetry.
  suggested_update_summary_for_composer: Microsoft's defender guide of 2026-11-25 widens its named ARTEX users from two to six. Besides Storm-0940 and Storm-3358
    it names Onyx Sleet and Pearl Sleet, North Korean clusters that its report of 2026-10-29 says have used ARTEX since late October, and Crystal Typhoon
    and Salt Typhoon, for which it gives no campaign detail and, on the page, no nexus (The Record reads them as Chinese state-backed). Microsoft says ThreatBook
    claimed ownership of ARTEX in November and sells an ARTEX Pro; ThreatBook's own release of 2026-10-16 already lists it and says the open-source edition
    went closed source on 2026-10-08. Because ARTEX can drive any model and fail over between providers, Microsoft says it is not necessarily visible in
    one provider's telemetry, so its detections sit on the web server (shell and script-file creation, short-lived web shells, rapid secret-file reads),
    identity (service-principal sign-ins across several applications, credential additions followed by role assignment) and egress (webhook and file-sharing
    requests from servers).
item2_okta_permiso_disposable_email:
  recommended_handling: 'NEW entry, kind research (not a changelog record on the ARTEX entry): the finding is a cross-framework, provider-level identity
    indicator for Auth0 and Okta tenants with open self-registration; references the ARTEX entry and the ARTEX-in-AWS Cognito self-sign-up entry. Okta''s
    own statement that "customers often" reported it alongside application attacks is the only constituency-relevant context.'
  publication:
    original_publication_utc: '2026-11-23T16:00:00Z'
    last_modified_utc: '2026-11-24T01:23:47Z'
    evidence:
    - okta.html JSON-LD datePublished "2026-11-23T16:00:00Z" and dateModified "2026-11-24T01:23:47.43Z" (grep -F verified on fu4/okta.html)
    - Okta threat-intelligence RSS pubDate "Mon, 23 Nov 2026 16:00:00 +0000" (fu4/okta-feed.json)
    lookback_note: About 61 hours before this run (2026-11-26T04:40Z); outside a 26 h window, inside the standard record lookback.
    authors: 'Okta Threat Intelligence; contributors named on the page: Katie Nickels and Grayson Schermerhorn'
    author_support:
    - quote: Schermerhorn contributed to this research.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
  source_independence:
    finding: 'Single corporate source. Permiso Security is part of Okta: Okta signed the agreement on 2026-07-30 and closed the acquisition on 2026-08-26,
      and says Permiso''s P0 Labs will expand Okta''s research capabilities. The "joint investigation" is therefore Okta and its own newly acquired research
      team, not two independent labs.'
    support:
    - quote: 'Update August 26, 2026: We are excited to announce that today Okta closed its acquisition of Permiso Security.'
      source_url: https://www.okta.com/newsroom/press-releases/okta-signs-definitive-agreement-to-acquire-permiso-security
      check: grep -F on fu4/okta-permiso-pr.norm.txt
    - quote: Permiso’s P0 Labs will expand Okta’s research capabilities
      source_url: https://www.okta.com/newsroom/press-releases/okta-signs-definitive-agreement-to-acquire-permiso-security
      check: grep -F on fu4/okta-permiso-pr.norm.txt
    permiso_site: 'permiso.io/blog (fetched 2026-11-26, raw HTML 370 kB) carries the banner "Permiso Security has officially joined Okta, the leader in
      identity security!" (grep -F verified on fu4/permiso-blog.html) and has no post about disposable email, mail.tm, ARTEX or agent registration (grep
      -c for mail.tm and disposable returns 0; no relevant slugs among the listed posts). permiso.io/p0-labs fetched: no mention.'
    p0_labs_primary_found: false
    plainly: Permiso P0 Labs' own post could not be found. Three WebSearch queries (Permiso P0 Labs with mail.tm, ARTEX, Cairn, CyberStrikeAI, pentestcode;
      P0 Labs agentic frameworks disposable email; swarmtraces) returned nothing from Permiso or P0 Labs on this topic, and the Permiso blog listing holds
      none. The P0 Labs figures (80 percent of attacker hosts, four frameworks choosing mail.tm in tests) therefore exist only as Okta's relay.
    no_independent_corroboration: 'No other vendor in this evidence set reports mail.tm use by agents. Consistent but not corroborating: Expel''s Okta self-registration
      case and Wiz''s sign-up and account-recovery calls (both already in the ARTEX entry).'
  claims:
  - id: K1
    status: NEW
    claim: Okta states that since June 2026, accelerating at scale through October and November 2026, it observed AI agents registering accounts with disposable
      email addresses on Auth0 tenants and Okta organizations that allow public self-service registration, almost certainly malicious activity often seen
      by customers reporting attacks on their applications.
    support:
    - quote: Starting in June 2026 and accelerating at scale throughout October and November 2026, Okta Threat Intelligence observed AI agents registering
        accounts with disposable email addresses on Auth0 tenants and Okta organizations that allow public self-service registration. This activity is almost
        certainly malicious and was often observed by customers reporting attacks on their applications.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: A joint investigation by Okta Threat Intelligence and Permiso's P0 Labs has identified that when asked to create accounts for security testing
        purposes, AI agents frequently choose the services of one specific family of disposable email services.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
  - id: K2
    status: NEW
    claim: The addresses used primarily belong to domains of the mail.tm family, a free receive-only service with a public documented REST API that needs
      no account registration or key, so a mailbox can be created, a token obtained and one-time codes polled entirely from a script.
    support:
    - quote: The registered email addresses belonged primarily to domains associated with mail[.]tm, which provisions receive-only inboxes through a free,
        public and well-documented API and rotates the mailbox domains it offers.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: mail[.]tm provides receive-only disposable inboxes at no cost. An address is provisioned on first request, in the browser or through the API,
        and the API requires no account registration or key.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: Its REST API, defined in the machine-friendly OpenAPI specification, allows a mailbox to be created, a token obtained and messages polled for
        one-time codes entirely from a script.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
  - id: K3
    status: NEW
    claim: 'Framework evidence: P0 Labs saw four autonomous penetration-testing frameworks (ARTEX, Cairn, CyberStrikeAI, pentestcode) each pick mail.tm
      at run time rather than from packaged tooling, probing which disposable domains a target accepts and falling back to other providers only when blocked;
      mail.tm was on 80 percent of attacker hosts with disposable email in a data set containing attacker tooling.'
    support:
    - quote: P0 Labs observed the ARTEX, Cairn, CyberStrikeAI and pentestcode frameworks each selecting mail[.]tm at run time rather than from packaged
        agent tooling, probing which disposable domains a target accepts and only falling back to other providers when blocked.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: each arrived at the same email provider independently during tests by P0 Labs.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: In a data set containing attacker tooling, P0 Labs identified mail[.]tm use on eighty percent of attacker hosts where disposable email was
        found, spanning the ARTEX, Cairn, CyberStrikeAI and pentestcode frameworks.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    note: 'Source of this framework evidence: P0 Labs tests, a data set of attacker tooling, and attacker-side logs from open directories (O28, O14). Okta
      does not attribute the customer-tenant sign-ups to a specific framework, and gives no tenant, account or customer counts, no sector or region, and
      no description of what registered accounts did afterwards (the section headed "Registration and probing in Auth0 and Okta logs" contains no probing
      details).'
  - id: K4
    status: NEW
    claim: 'Date caveat: the June 2026 start comes in the body from Okta''s analysis of the swarmtraces data set, not from a stated customer-tenant observation;
      the executive summary states the June start as sign-up observation. The swarmtraces site describes itself as a public trail of the OpenAI agent swarm
      that hacked Hugging Face in July. So the earliest data point concerns OpenAI-linked agents in that incident, and agent-driven disposable-mail use
      is not limited to attacker frameworks (inference from the two sources; Okta does not discuss it).'
    support:
    - quote: Okta Threat Intelligence's analysis of the swarmtraces data set indicates agentic use of the mail[.]tm family as early as June 2026.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: When a swarm of 700 OpenAI agents hacked Hugging Face in July, they left behind a public trail of evidence.
      source_url: https://swarmtraces.org/
      check: grep -F on fu4/swarmtraces.norm.txt
    note: The store already holds the Hugging Face entry 2026-07-21/hugging-face-autonomous-ai-agent-production-breach. Okta's "almost certainly malicious"
      applies to the customer-observed sign-ups.
  - id: K5
    status: NEW
    claim: 'Indicator and its meaning, in Okta''s words: the use of these services always occurred within a short window of other agentic reconnaissance
      and intrusion attempts against the same entities, so disposable-domain sign-ups are likely an early indicator that agents have been tasked against
      an organization; the activity is predominantly registration and reconnaissance and gives a heads-up to look for successful intrusion.'
    support:
    - quote: The use of these services always occurred within a short window of activity that included other agentic reconnaissance and intrusion attempts
        against the same entities. Disposable-domain signups are therefore likely to be an early indicator that AI agents have been tasked with performing
        attacks against an organization.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: While these email domains are predominantly used in account registration/reconnaissance activity, we have observed that this account registration
        activity often occurs along with other agentic reconnaissance and intrusion attempts.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: Therefore, identifying use of these disposable email addresses with known agentic patterns can assist organizations in determining if they
        are being targeted by agents, giving them a heads-up that they need to look for successful intrusion attempts.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    note: '"Likely" on Okta''s published scale is 55 to 80 percent; "almost certainly" is 95 to 99 percent; "very likely" is 80 to 95 percent (O35). The
      early-indicator claim is the weaker of Okta''s calls.'
  - id: K6
    status: NEW
    claim: 'Okta''s estimative scale (to read its hedges): likelihood terms map to percentages with "likely" at 55-80% and "almost certainly" at 95-99%.'
    support:
    - quote: '| Percentage | 1-5% | 5-20% | 20-45% | 45-55% | 55-80% | 80-95% | 95-99% |'
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
  - id: K7
    status: NEW
    claim: 'Blocklist decay: mail.tm exposes one active mailbox domain at a time and replaces it periodically, so a blocklist of previously observed domains
      will very likely stop matching within weeks; Okta''s Auth0 telemetry shows sign-up activity tracking the domain currently returned by the provider
      API. Okta dates two data points without naming them here: a single domain returned on 2026-09-13 and a different single domain from around 2026-10-30,
      with the attacker sign-up domain changing when the API response changed.'
    support:
    - quote: 'Because mail[.]tm exposes only one active mailbox domain at a time and replaces it periodically, a blocklist built from previously observed
        domains will very likely stop matching within weeks of being compiled. Our analysis of Auth0 telemetry supports this: signup activity tracks the
        domain currently returned by the mail[.]tm API.'
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: mail[.]tm and the services that share its API currently expose one active mailbox domain at a time through the public /domains endpoint.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: As we have tracked agentic-driven account registrations, we noticed a change in the email domains used starting around October 30, 2026
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    - quote: When the domain in the API response changed, so too did the attackers' email domain.
      source_url: https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/
      check: grep -F on fu4/okta.norm.txt
    note: Okta lists three mailbox domains it observed and dates two of them; the third is undated. The domains are indicators and are not reproduced.
