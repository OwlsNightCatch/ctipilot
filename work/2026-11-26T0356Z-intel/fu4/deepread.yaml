  - id: C11
    status: NEW
    claim: During Storm-0940 activity ARTEX agents added credentials to applications and an application assigned itself the Global Administrator role. Agents
      also used an XXE flaw to query a cloud metadata service for role credentials, in one investigation used a compromised OAuth application to run scripts
      on Azure virtual machines, ran commands through cloud administration interfaces such as Kudu, and focused on credentials for AI services.
    support:
    - quote: During Storm-0940 activity, ARTEX agents added credentials to applications, and an application assigned itself the Global Administrator role.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: ARTEX agents map the permissions of the credentials they capture and have used an XXE flaw to query a cloud metadata service for role credentials,
        and in one investigation AI agents used a compromised OAuth application to run scripts on Azure virtual machines.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    - quote: ARTEX agents have run commands through cloud administration interfaces such as Kudu when they had credentials for them, and AI agents have
        focused on credentials for AI services.
      source_url: https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
      check: grep -F on fu4/msft.norm.txt
    note: XXE-to-metadata and Kudu are already in the entry through the FBI table; the self-assigned Global Administrator role, the OAuth-application-to-VM
      script execution and the focus on AI-service credentials are new.
