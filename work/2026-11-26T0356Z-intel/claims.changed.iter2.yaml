  - claim_id: fa92d8a91f
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "CVE-2025-41450 (CWE-287 Improper Authentication, CVSS 3.1 8.2) is a hidden, undocumented \"code-of-the-day\" authentication mechanism: the application accepts a specially crafted authentication request containing a generated \"code of the day\" that bypasses normal login and discloses a web report with internal IPs, usernames and store names, as Claroty puts it: \"the application accepts a specially crafted authentication request containing a generated 'code of the day'\" ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
  - claim_id: 4f387ec18f
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "Danfoss's advisory scores CVE-2025-41451 at 8.7 and CVE-2025-41452 at 6.8 without naming a CVSS version ("
    urls: ["https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-08-01/"]
  - claim_id: 07335d9103
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: derived
    text: "**Triage:** monitor authentication attempts against AK-SM 800A management interfaces for requests carrying a non-standard authentication parameter shape (a \"code\" field distinct from the normal username/password flow): legitimate operator logins never use the code-of-the-day mechanism, so its presence in a request is itself the discriminator."
