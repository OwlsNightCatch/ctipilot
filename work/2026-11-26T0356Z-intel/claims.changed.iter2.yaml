claims:
  - claim_id: 05b92b940a
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "summary"
    kind: frontmatter
    text: "Companion disclosure to Claroty's Copeland research, same team and publish day. Danfoss AK-SM 800A refrigeration system managers, used in supermarkets, cold storage and commercial HVAC, carry an undocumented 'code-of-the-day' authentication bypass disclosing internal IPs, usernames and store names (CVE-2025-41450), a post-authenticated OS command injection in the alarm-email configuration (CVE-2025-41451), and an Nginx configuration-injection flaw enabling denial of service (CVE-2025-41452). Claroty's own internet-wide scan found thousands of exposed devices. CISA added CVE-2025-41450 to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming a campaign."
  - claim_id: 7e870c5d08
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade Danfoss AK-SM 800A refrigeration system managers to firmware R4.3.1 (build 4.2 closes CVE-2025-41450 alone) on every deployment, and where that cannot happen immediately take the management interface off the public internet, treating the thousands of internet-exposed devices Claroty found as a priority, because CISA lists CVE-2025-41450 as exploited."
