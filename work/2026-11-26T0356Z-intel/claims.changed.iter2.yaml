  - claim_id: b07b48c3ad
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "summary"
    kind: frontmatter
    text: "Okta Threat Intelligence, with data from the P0 Labs team of Permiso (now part of Okta), reports that since June 2026, and at scale in October and November, AI agents registered accounts with disposable addresses, mostly from the mail.tm family, on Auth0 tenants and Okta organizations that allow public self-service registration. mail.tm exposes one active domain at a time through an account-free API and replaces it periodically, so a blocklist stops matching within weeks. Okta reads such sign-ups as a likely early sign that agents are tasked against an organization, and says agents often register through the Auth0 Authentication API, which can skip protections applied in Universal Login."
  - claim_id: 0544785b83
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "In tests by the P0 Labs team of Permiso, which Okta acquired on 2026-08-26 ("
    urls: ["https://www.okta.com/newsroom/press-releases/okta-signs-definitive-agreement-to-acquire-permiso-security"]
  - claim_id: 961308b149
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "), the ARTEX, Cairn, CyberStrikeAI and pentestcode frameworks each picked mail.tm at run time, and in a data set containing attacker tooling mail.tm appeared on 80 percent of the attacker hosts where disposable email was found ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: dc85421b02
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
    surface: "body"
    kind: cited
    text: "Bot detection and CAPTCHA generally stopped the October mail.tm sign-ups before email verification, but Okta warns agents can solve challenges and commonly register by calling the Auth0 Authentication API directly, which can skip protections applied in Universal Login ("
    urls: ["https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/"]
  - claim_id: 3b9061e148
    entry: 2026-11-26/okta-ai-agents-mail-tm-disposable-signups-blocklist-decay
