  - claim_id: 53535524c2
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-103406 to its Known Exploited Vulnerabilities catalogue on 2026-11-25, after BSI revised its advisory to say the flaw is being exploited. ENISA's record, which carries Juniper's own description, calls it an OS command injection in the AutomatedProvisioner of Session Smart Conductor that lets a remote attacker run commands as root through a crafted salt minion ID (CVSS 3.1 9.8, no privileges or user interaction), with the affected ranges ending at 7.0.5, 7.1.7 and 7.2.3. No source names an actor, victim, scale or technique, and Juniper's own bulletin JSA112183 of 2026-10-28 could not be read."
  - claim_id: d0368b83c8
    entry: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Juniper Session Smart Conductor to 7.0.5, 7.1.7 or 7.2.3 (by branch) and, on any Conductor that was reachable before the upgrade, look for shell processes started by its provisioning services and for routers, accounts or configuration changes nobody made, because CISA lists CVE-2026-103406 as exploited."
