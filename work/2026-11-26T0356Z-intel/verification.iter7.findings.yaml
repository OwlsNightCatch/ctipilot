  item: "2026-11-26/seppmail-15-1-2-gina-template-injection-account-takeover"
  url_or_quote: "id: CVE-2026-124839 ... type: rce, vector: zero-click, auth: pre-auth"
  summary: "(low confidence) SEPPmail's row says 'A specially crafted GINA account address could lead to command execution with elevated privileges by a maintenance script during system start'; execution at system start is not a zero-click RCE on the request, and the page names no remote trigger. The sourcing_note discloses the auth and vector fields as a reading, but type: rce plus zero-click is the strongest reading; consider type: command-injection or leaving vector as a reading with local/next-start semantics."
