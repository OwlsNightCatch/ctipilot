  summary: "The cited Fortinet PSIRT page (https://fortiguard.fortinet.com/psirt/FG-IR-26-279, fetched this iteration, timeline lists 'not impacted list updated' on 2026-11-21, -23, -24 and -26) now carries FortiManager, FortiAnalyzer, FortiManager Cloud, FortiAnalyzer Cloud, FortiADC, FortiWeb and FortiSIEM under 'Products confirmed NOT impacted'; its 'Products under investigation' list (29 names) no longer names FortiManager or FortiAnalyzer but still names FortiAuthenticator, FortiClient EMS, FortiWeb Manager, FortiSOAR and others. The summary states the 2026-11-21 state in the present tense. Claim 133f9fba93. Update the clause to the current lists (or date it)."
