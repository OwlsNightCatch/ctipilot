  - id: 4
    entry: entries/2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce.md
    findings_refs: ["findings.S1.yaml items[9]"]
    headline: "HPE's bulletin adds a whole vendor (seven products, none in the entry) and a workaround class the entry lacks entirely (hiding the avx512vbmi CPU feature from the guest at the hypervisor, with an exposure test); it does not mention the JVM option the entry already carries. Bonus finding: Cisco's advisory is at version 1.4 (2026-11-23), not 1.3, with about 26 affected rows; Splunk SVD-2026-1102 adds UBA and the AppDynamics Apache agent"
    answer_to_the_question_asked: "HPE's bulletin is NOT redundant. The entry contains no HPE product, no HPE fixed version, no hypervisor CPU-feature mask workaround, no cpuid or /proc/cpuinfo exposure command and no instance-family guidance for public clouds (grep of the entry: zero hits for HPE, Aruba, hypervisor, cpuid, EVC, Splunk, AppDynamics). The only workaround the entry states is the JVM options -XX:-UseBASE64Intrinsics and -XX:UseAVX=2, which HPE does not mention (zero occurrences of a -XX option in the bulletin)."
    delta_claims:
      - id: D4.1
        status: NEW
        claim: "HPE Networking security bulletin HPESBNW05193, published 2026-Nov-25, revision 1, status Investigating, severity HIGH, CVSS 3.1 base 8.1 with vector AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H, identical to the Oracle score the entry records (HPE's detail block repeats Oracle's description; HPE does not claim its own scoring); internal reference VULN-1627. The advisory is a PGP-signed plain-text file."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "Publication Date: 2026-Nov-25"
          - "CVSS v3.1 Base Score: 8.1"
      - id: D4.2
        status: NEW
        claim: "Known-affected HPE products and versions (none of them in the entry): Central On-Premises 2.5.8.12 and below; New Central On-Premises 3.0.4.4 and below; NetEdit 2.19.0 and below; Analytics and Location Engine 5.2.0 and below; AirWave 8.3.0.7 and below; ClearPass Policy Manager 6.14.x only; SD-WAN Orchestrator 9.7.x. HPE adds that mitigating details may make a deployment not impacted, and that other supported versions are not known to be impacted."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "COP 2.5.8.12 and below"
          - "CNXOP 3.0.4.4 and below"
          - "NetEdit 2.19.0 and below"
          - "ALE 5.2.0 and below"
          - "AirWave 8.3.0.7 and below"
          - "ClearPass 6.14.x only"
          - "Orchestrator 9.7.x - see resolution for fixes"
      - id: D4.3
        status: NEW
        claim: "Fixed versions and availability per HPE: AirWave 8.3.0.8 and above (no ETA stated, i.e. available; the S1 findings say the same build also fixes the three AirWave flaws of HPESBNW05186, not re-verified here); SD-WAN Orchestrator 9.7.2.41110 and 9.7.1.42066 (no ETA stated); ClearPass 6.14.1-HF3 ETA December 01, 2026; Central On-Premises 2.5.8.13, NetEdit 2.19.1 and above and ALE 5.2.1 and above with ETA TBD; New Central On-Premises final version TBD, ETA TBD. Downloads are from the HPE Networking support portal. HPE's 'no ETA stated' for AirWave and Orchestrator is read from the text, not an explicit 'released' statement."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "COP 2.5.8.13 (ETA: TBD)"
          - "CNXOP final version TBD (ETA: TBD)"
          - "NetEdit 2.19.1 and above (ETA: TBD)"
          - "ALE 5.2.1 and above (ETA: TBD)"
          - "AirWave 8.3.0.8 and above"
          - "ClearPass 6.14.1-HF3 (ETA: December 01, 2026)"
          - "Orchestrator 9.7.2.41110"
          - "Orchestrator 9.7.1.42066"
      - id: D4.4
        status: NEW
        claim: "Unaffected per HPE: Classic Central, New Central, ClearPass 6.12.x and 6.11.x, AOS-CX, AOS-S, AOS-8 and AOS-10 (conductors, controllers, gateways, instant and access points), CloudAuth, CloudGuest, Private 5G, Fabric Composer, Instant On, Meridian, IoT, UXI, EdgeConnect and the Mist products (Mist Cloud, Wireless, Wired and Access Assurance, Location Services, Premium Analytics, Mist Access Points, Mist Edge). Products not listed were not evaluated and are outside the advisory's scope. End-of-maintenance versions are presumed affected and unassessed."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "6.12.x and 6.11.x are not impacted"
          - "Maintenance (EoM) are presumed to be affected by the"
      - id: D4.5
        status: NEW
        claim: "Exposure test (new to the entry, which states only the CPU flag requirement in prose): HPE says exposure depends on the environment and that an instance is not vulnerable when the CPU does not expose avx512vbmi; it gives a /proc/cpuinfo check and a cpuid alternative, to be run through HPE TAC (shell access to an appliance), and notes a hypervisor may allow checking from outside the instance."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "grep -o -w avx512vbmi /proc/cpuinfo | sort -u    # no output = not vulnerable"
          - "cpuid -1 -l 7 -s 0 | grep -i vbmi  # alternative command."
      - id: D4.6
        status: NEW
        claim: "Workaround class absent from the entry: mitigate in virtual machines by having the hypervisor hide the avx512vbmi CPU feature from the guest. HPE lists levers per platform: VMware (per-VM cpuid.7.ecx mask, or an EVC baseline of Intel Skylake or Cascade Lake generation, which also hides every newer feature), QEMU/KVM and libvirt (disable the feature in the CPU definition), Proxmox (raw QEMU args or a custom CPU model), OpenStack Nova (extra CPU model flag, Wallaby or later, applies to every instance on the compute node), Xen (cpuid setting), XCP-ng and XenServer (host-wide only), VirtualBox (override of CPUID leaf 7), Firecracker (custom CPU template), Hyper-V (cannot mask one feature; processor compatibility mode hides all of AVX-512), public clouds (cannot change the CPUID mask, choose an instance family without VBMI). Guests need a power cycle after the change."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "using the hypervisor to prevent exposing the \"avx512vbmi\" feature"
          - "Option 2: EVC (vSphere)."
          - "qemu-system-x86_64 -enable-kvm -cpu host,avx512vbmi=off ..."
          - "cpu_model_extra_flags = -avx512vbmi"
          - "There is no simple per-VM switch for a single feature."
          - "Hyper-V cannot mask an individual CPUID feature."
          - "You cannot change the CPUID mask. Choose an instance family backed by"
      - id: D4.7
        status: NEW
        claim: "Instance families HPE names: without VBMI are Intel Skylake-SP and Cascade Lake (for example AWS c5 and m5, GCP n1 and n2 pinned to Cascade Lake) and AMD Zen 3 or earlier (for example AWS c6a and m6a, Azure Dasv5); Ice Lake, Sapphire Rapids and Zen 4 families all expose VBMI. This agrees with the entry's Upwind-sourced CPU list (Ice Lake to Granite Rapids and Zen 4 or newer) and adds concrete cloud choices."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "Ice Lake, Sapphire Rapids and Zen 4 families all expose VBMI."
          - "AMD Zen 3 or earlier (e.g. AWS c6a/m6a, Azure Dasv5)."
      - id: D4.8
        status: NEW
        claim: "Bare-metal appliances cannot use the mask: Central On-Premises, New Central On-Premises and bare-metal ClearPass cannot hide the CPU flag, so HPE says to harden and control access; its general workaround is to restrict CLI and web management interfaces to a dedicated layer 2 segment or VLAN and/or firewall policy with accounting. Entry impact: for these products the entry's JVM-option workaround is not offered by HPE (HPE's text names no JVM option), so appliance owners depend on the vendor build."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "For products such as COP and CNXOP these are installed on bare metal,"
          - "dedicated layer 2 segment/VLAN and/or controlled by firewall"
      - id: D4.9
        status: NEW
        claim: "HPE's exploitation statement (limited to its own products): not aware of any public discussion or exploit code that targets the vulnerability on HPE products as of the release date; it links Calif's and Upwind's write-ups. Consistent with the entry (no confirmed exploitation, public trigger proof of concept, vendor-claimed customer exploit)."
        source_url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05193.txt"
        body_file: hpe-05193.txt
        quotes:
          - "HPE Networking is not aware of any public discussion or exploit"
      - id: D4.10
