      - id: D1.10
        status: NEW
        claim: "End-of-life statement widened in SA-019's solution text to Drupal 8 and Drupal 9 (no coverage). SA-019 does not say 8 and 9 are affected; the affected-versions field (<10.6.23) is a range that formally includes them. Searchlight and StepSecurity say 8.9 and 9 are affected by the SA-017 flaw (see D1.15)."
