      - id: D1.13
        status: NEW
        claim: "Searchlight Cyber (published 2026-11-24, page text dated November 24, 2026) states it found the flaw independently, that it turned out to duplicate Anthropic's OSS Scanner report behind SA-017, and that its own contribution is making the issue exploitable on stock configurations."
        source_url: "https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal"
        body_file: searchlight.extract.md
        quote: |-
          However, we still believe the research we did to leverage system limits and make the issue exploitable on stock Drupal configurations is novel and worth sharing in a dedicated article.
      - id: D1.14
        status: NEW
        claim: "Mechanism in observable terms (Searchlight): an availability failure is converted into a trusted state. Driving the database (or the web tier's outbound TCP source ports) into refusing connections makes the installer's early database checks fail and a later one succeed within one request, so install.php treats an installed site as new. Searchlight's own summary sentence follows. No exploit step is repeated here."
        source_url: "https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal"
        body_file: searchlight.extract.md
        quote: |-
          In Drupal, temporary database failures can produce a `FAIL`, `FAIL`, and then `SUCCESS` sequence that reopens the installer on an existing website and ultimately leads to pre-authentication RCE through an SQLite database containing PHP code.
      - id: D1.15
        status: NEW
        claim: "Searchlight reports the flaw reachable pre-authentication on four stock deployment combinations (Apache or PHP-FPM, each with PostgreSQL or MySQL, on Drupal's official Docker images) and on Drupal 8.9, 9, 10 and 11, but not Drupal 7 or 8 before 8.9. This supersedes nothing in the entry's text but tests its statement that Drupal's own rating says only uncommon module configurations are exploitable: Searchlight says default stacks are reachable."
        source_url: "https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal"
        body_file: searchlight.extract.md
        quote: |-
          Applying this methodology to Drupal uncovered a pre-authentication RCE affecting Drupal 8.9, 9, 10, and 11 across four common deployment combinations
        tension_with_entry_quote: "Drupal's own rating says only uncommon module configurations are exploitable"
      - id: D1.15b
        status: NEW
        claim: "Searchlight's limits: PHP-FPM reachability needs source-port exhaustion and, on its tests, servers with 4 vCPUs; on 2 vCPUs success depends on the deployment (so exploitability on small hosts is uncertain, per Searchlight)."
        source_url: "https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal"
        body_file: searchlight.extract.md
        quote: |-
          That being said, based on our benchmark results, we believe this vulnerability can be exploited remotely on servers with `4 vCPUs`. On servers with only `2 vCPUs`, however, exploitation is likely to depend more heavily on the deployment configuration.
      - id: D1.15c
        status: NEW
        claim: "Searchlight's timeline places confirmation of pre-authentication code execution on 2026-10-27, three weeks before Drupal's 2026-11-18 release, and its write-up on 2026-11-24, five days after Drupal's first exploitation report (2026-11-19); Searchlight itself reports no in-the-wild exploitation."
        source_url: "https://www.slcyber.io/research/fail2install-system-limits-pre-auth-rce-drupal"
        body_file: searchlight.extract.md
        quote: |-
          Pre-authentication RCE confirmed on stock Apache with PostgreSQL.
      - id: D1.16
        status: NEW
        claim: "StepSecurity (post dated 2026-11-26) reproduced installer re-entry on a finished 11.4.12 site under a database connection flood (Apache with mod_php and PostgreSQL, lab server it owns, not internet-exposed): the installer reopened with no change to stored data, about 12 percent of install.php requests in one 20-second run returned the Database configuration form (rate varies run to run). It stopped at reaching the form and did not complete a reinstall."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          On 11.4.12, the installer reopened on a live, finished site, with no change to anything stored on it.
      - id: D1.17
        status: NEW
        claim: "StepSecurity's fix verification: the identical flood against 11.4.13 never reached the Database configuration form; every request that reopened the installer on 11.4.12 returned Requirements problem instead."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          We ran the identical flood against 11.4.13.
      - id: D1.18
        status: NEW
        claim: "StepSecurity's finding on the code-execution step (attributed to StepSecurity; it tested this step on its own on a lab host, with a planted benign PHP file in a code directory owned by the web-server user as Drupal's official image leaves it): the web server's stock .htaccess rule that blocks direct PHP requests outside /core is unchanged in the fixed releases, so a PHP file that the web-server user can write into a code directory such as web/modules still executes on 11.4.13 exactly as on 11.4.12. It adds that the patch closes installer re-entry only."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          The fixed releases do not change that `.htaccess` rule.
      - id: D1.18b
        status: NEW
        claim: "StepSecurity states the scope of the fix in one sentence."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          The patch closes the installer re-entry; it does not stop code execution for an attacker who can write a `.php` into a code directory by any route.
      - id: D1.18c
        status: NEW
        claim: "Caveat on D1.18: the claim is StepSecurity's lab result and rests on one vendor-authored test; Drupal's advisories (017, 019) say nothing about the .htaccess rule, and the Drupal release notes page for 11.4.14 (WebFetch, summariser) does not mention .htaccess either. StepSecurity's page (dated 2026-11-26, written before or without reference to SA-019: it contains no mention of 019 or 11.4.14) tests only 11.4.13 vs 11.4.12, so the .htaccess state in 11.4.14, 11.3.23 and 10.6.23 is not covered by any source read."
        source_url: "https://www.drupal.org/project/drupal/releases/11.4.14"
        body_file: webfetch-notes.md
        grep_verified: false
        quote: |-
          The page does not mention install.php, update hooks, .htaccess or settings.php.
      - id: D1.19
        status: NEW
        claim: "StepSecurity's account of what the SA-017 fix changes (single commit to the installer include file): a database error now stops the installer; an installation with any recorded step plus an install time cannot be resumed; only the browser session that started an installation can continue it; the installer no longer changes permissions on settings.php (it only reports the problem)."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          The installer no longer changes permissions on `settings.php`.
      - id: D1.20
        status: NEW
        claim: "StepSecurity: patched Drupal publishes only its major version (X-Generator header 'Drupal 11'), so banner or version-string scanning cannot separate a fixed from a vulnerable site; the two testable facts are whether /core/install.php is reachable from outside and which drupal/core version the site was built from."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          So a banner scan cannot tell a patched 10.6.22 from a vulnerable 10.6.21, and you cannot scan the internet, or your own fleet, for this CVE by version string.
      - id: D1.21
        status: NEW
        claim: "StepSecurity's Shodan count on 2026-11-26 (third-party estimate, lower bound): about 55,800 Drupal services, about 31,500 on affected branches, roughly 15,000 of those on the end-of-life 8 and 9 branches; country ranking leads with the United States, then Italy, China, Germany, Vietnam, France, India, Canada (Switzerland not named)."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          That is about 31,500 services on affected branches, and roughly 15,000 of them on the end-of-life 8 and 9 branches, which will never get a fix and have to migrate.
      - id: D1.22
        status: NEW
        claim: "StepSecurity's detection tripwire in observable terms: the database has to be driven into refusing connections, so a burst of database connection-refusal errors (PostgreSQL 'too many clients', MySQL 'Too many connections' or 'Cannot assign requested address' in PHP or web logs) together with a burst of HTTP 500 responses and requests to install.php on a finished site is the signal; install.php has no legitimate use on a finished site. It cautions that a legitimate traffic spike can also exhaust a pool, so the pairing with install.php requests is the discriminator."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          A large legitimate traffic spike can also exhaust a pool, so the signal to alert on is a database-refusal burst together with requests to `install.php`, which has no legitimate reason on a finished site.
      - id: D1.23
        status: NEW
        claim: "StepSecurity post-compromise artefact checks (observable, no payload): a response titled 'Database configuration' served to an anonymous client by a finished site; changes to settings.php (database driver or target, modification time), a later install time, user 1 changed; a file with a .php name that is really an SQLite database under a code directory; access-log request paths that append a core-script suffix after a .php file outside /core, which Drupal does not generate. If any is found StepSecurity says to treat the server as compromised (settings.php holds the database password and hash salt), restore from a pre-attack backup, rotate database credentials and keys stored in site config and review all administrators."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          If you find any of these, treat the server as compromised.
      - id: D1.24
        status: NEW
        claim: "StepSecurity hardening levers (vendor-authored, lab-tested on its own server): block /core/install.php at the web server (Apache Location deny or nginx location with prefix match, not an exact match, because exact matching does not block a path-suffixed request); make settings.php and code directories (web/modules, web/themes) read-only for the web-server user; a per-source connection cap (20 concurrent connections per address stopped its flood, a distributed flood would pass); use drush site:install if the installer is needed again."
        source_url: "https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"
        body_file: stepsec-fail2install.extract.md
        quote: |-
          Do not use an exact match (`location = /core/install.php`) on nginx.
      - id: D1.25
        status: NEW
        claim: "Score conflict to carry as an open contradiction: The Hacker News gives CVSS 9.8 for CVE-2026-132165 without naming whose score; StepSecurity says no CVSS score exists because the CVE record was not published as of 2026-11-26; Drupal rates with its own 25-point scale only; CISA's KEV record gives no score. No vendor or CNA CVSS was read. Keep cvss 'n/a' (Drupal 20 of 25) and do not carry 9.8 as a fact."
