          Run update.php. An update hook must run to fix existing production sites in this state.
      - id: D1.7
        status: NEW
        claim: "Securing the installer is now framed two ways: a site that already secured it is not vulnerable to SA-019, and Drupal strongly recommends securing it on all new and existing sites. (Drupal's SA-017 text called it the workaround if the update must wait; SA-019 says it is strongly recommended in addition to, not instead of, the update and update.php.)"
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          If you have already secured the installer, you are not vulnerable.
      - id: D1.7b
        status: NEW
        claim: "Drupal's strongly recommended step list for SA-019."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          Strongly recommended: Follow the instructions for securing the Drupal installer on all new and existing sites.
      - id: D1.8
        status: NEW
        claim: "Post-compromise checks Drupal itself names for SA-019: site logs for unauthorised access with emphasis on changes to or by the user 1 account; set the user 1 email to one you control and consider resetting the user 1 password; if compromise is suspected, follow Drupal's hacked-site guide. The entry's Detection paragraph says Drupal names no indicators; this is the nearest Drupal gets (it is guidance, not an indicator list)."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          Check your site logs for unauthorized access, especially unexpected changes to or by the user 1 account.
      - id: D1.8b
        status: NEW
        claim: "User 1 hygiene step."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
