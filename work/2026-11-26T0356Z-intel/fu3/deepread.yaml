    entry: entries/2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16.md
    findings_refs: ["findings.S1.yaml items[8]", "findings.S3.yaml items[1]"]
    headline: "A SECOND exploited installer flaw (SA-CORE-2026-019, CVE-2026-136716) with NEWER fixed versions (11.4.14, 11.3.23, 10.6.23) and a mandatory update.php run; KEV listing of CVE-2026-132165; public technique write-up; StepSecurity: the .htaccess code-execution step is not changed by the SA-017 fix"
    entry_already_states: "SA-017 fixed versions 11.4.13, 11.3.22, 10.6.22 (title, headline, summary, cves[].fixed, actions[0], body); Drupal's exploitation report from 2026-11-19 19:00 UTC; Highly critical 20 of 25; installer-securing workaround; Steward covers 017; EOL lines 11.2.x and below and 10.5.x and below; Anthropic OSS Scanner credit is NOT stated in the entry"
    fixed_versions_new_vs_entry: "NEW and now the upgrade target: Drupal 11.4.14, 11.3.23, 10.6.23 (SA-CORE-2026-019, 2026-11-25). Unchanged from the entry and still valid as the SA-017 fix: 11.4.13, 11.3.22, 10.6.22 (cumulative: the 019 releases carry them). The entry states ONLY the older set."
    delta_claims:
      - id: D1.1
        status: NEW
        claim: "Drupal published SA-CORE-2026-019 on 2026-11-25, rated Highly critical 21 of 25 (access complexity Basic, authentication None, confidentiality and integrity impact All, exploit status Exploit, target distribution Uncommon), vulnerability type Access bypass, CVE-2026-136716. Both the feed item and a WebFetch read of the page agree; the page has no separate Update section."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          AC:Basic/A:None/CI:All/II:All/E:Exploit/TD:Uncommon
      - id: D1.2
        status: NEW
        claim: "SA-019 is a distinct flaw from SA-017: after SA-017 fixed several installer flaws, certain sites in unusual or incomplete install states, production sites included, remain open to site takeover; the user interface does not show whether a site is in that state, and already compromised sites may no longer be in it (so a clean-looking site proves nothing)."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          SA-CORE-2026-017 recently fixed several vulnerabilities within the Drupal core installer. However, certain sites in unusual or incomplete install states remain vulnerable to site takeover following that advisory, including production sites.
      - id: D1.3
        status: NEW
        claim: "The same paragraph states that the vulnerable state is not visible in the user interface and that compromised sites may no longer be in it."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          It is not apparent in the user interface if a site is in the affected vulnerable state, and sites that are already compromised may no longer be in the vulnerable state.
      - id: D1.4
        status: NEW
        claim: "Drupal states SA-019 is exploited in the wild (Drupal's own statement, no date or actor given) and that any site that left its installer remotely accessible after SA-017 may still have been compromised. This is separate from the 2026-11-19 report on SA-017 that the entry carries."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
        quote: |-
          This is being exploited in the wild. Any site that left its installer remotely accessible following SA-CORE-2026-017 may still have been compromised.
      - id: D1.5
        status: SUPERSEDES
        claim: "Upgrade target moves: affected versions are <10.6.23, >=11.0.0 <11.3.23 and >=11.4.0 <11.4.14; update 11.4.x to 11.4.14, 11.3.x to 11.3.23, 10.6.x to 10.6.23. A site on 11.4.13, 11.3.22 or 10.6.22 is inside the SA-019 affected range."
        supersedes_entry_quote: "Drupal core 11.4.13, 11.3.22 and 10.6.22 fix CVE-2026-132165 (SA-CORE-2026-017, Highly critical)"
