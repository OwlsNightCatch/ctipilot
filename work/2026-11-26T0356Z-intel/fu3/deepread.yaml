  - id: 3
    entry: entries/2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter.md
    findings_refs: ["findings.S1.yaml items[16] (borderline, SafeDep only)", "findings.S3.yaml items[4] (SafeDep and StepSecurity)"]
    headline: "Two independent labs extend PolinRider: a Python variant (conftest.py and utils modules, JavaScript payload read from Ethereum transaction data, 375 repositories) and force-pushed pull-request commits that ran in CircuitVerse's release CI and published 40 infected installers; both read the same address-publishing wallet (inference)"
    entry_state: "updates: [] and updated_at: null, so this would be the first changelog record; the entry's counts and loader description are Apiiro's alone"
    delta_claims:
      - id: D3.1
        status: NEW
        claim: "SafeDep: PolinRider now plants a Python loader (58 lines) that hides in a small utils package (file names that look like an HTTP client) or in conftest.py; when Python imports the file it reads the newest transaction an Ethereum wallet sent to itself, decodes its input data as JavaScript and runs it with Node.js."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          The PolinRider campaign now plants a Python loader in GitHub repositories. The loader hides in a small `utils` package or in `conftest.py`.
      - id: D3.2
        status: NEW
        claim: "Scale (SafeDep's own GitHub code search on 2026-11-24): 375 public repositories under 260 accounts, 370 with a push in November 2026, mostly small personal projects (189 stars in total). No PyPI or npm package carries it."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          GitHub code search returns the exact loader in 375 files in 375 repositories under 260 accounts. 370 of these repositories had a push in November 2026. Most are small personal projects, with 189 stars in total.
      - id: D3.2b
        status: NEW
        claim: "Distribution channel statement."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          No package on PyPI or npm carries it.
      - id: D3.3
        status: SUPERSEDES
        claim: "The payload is in the input data of a transaction, not in an address field as in earlier samples: the Python loader's first stage reads JavaScript from the transaction input, and that JavaScript then reads a second wallet to find the command server (the address-in-the-recipient-field mechanism the entry describes). The entry's description covers only the second mechanism."
        supersedes_entry_quote: "The loader reads the latest outbound transaction of a hard-coded Ethereum wallet and decodes two IPv4 addresses from its recipient field"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          The payload is in the input data of a transaction, not in an IP address in the `to` field as in the September samples.
      - id: D3.4
        status: NEW
        claim: "How the loader hides and where: loader files in planted packages (363 of 375, mostly a utils folder inside the project) or conftest.py (12); the attacker also adds five import lines to a start file of the project (main.py, app.py most common)."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          The attacker also adds five import lines to a start file of the project.
      - id: D3.5
        status: NEW
        claim: "Execution conditions (SafeDep tested, with stub modules, on five example repository and command pairs): pytest runs the loader through conftest.py every time it runs in that folder; the planted import lines run it only when Python can find a top-level utils package; in the three example applications SafeDep checked, documented start commands fail with an import error before the loader runs, and a developer who fixes the import path then starts it. SafeDep did not check all 375 repositories for a working import path."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          A developer who reads the error `No module named 'utils'` and fixes the import path also starts the loader.
      - id: D3.5b
        status: NEW
        claim: "pytest and conftest.py trigger."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          `pytest` runs the loader through `conftest.py`.
      - id: D3.6
        status: NEW
        claim: "Observable behavior of the loader: it writes the decoded payload to a temporary .js file and runs node on it under a 20-second cap, hides every error (a host without Node.js shows nothing), and the JavaScript stage starts its next step in a detached process that outlives the loader."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          decodes the input data from hex to text, writes it to a temporary `.js` file, and runs `node` on it.
      - id: D3.7
        status: SUPERSEDES
        claim: "Process-lineage detail beyond the entry's 'detached node child': the next stage is written to the standard input of a detached interactive node process, so the code does not appear in the process command line (earlier samples passed it as a command-line argument); the parent chain can be python (pytest or an application start) to node to a detached node."
        supersedes_entry_quote: "a detached node child with no console started from a build script, editor or package entrypoint"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          The stage writes the next stage to the standard input of a detached `node -i` process. The code does not appear in the process command line.
      - id: D3.8
        status: NEW
        claim: "Dependency scanning does not see it, and the shared services it queries are not an infection indicator by themselves (benign lookalike, SafeDep's words). The entry's Triage line already has the benign blockchain-developer case."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          The loader uses only the standard library. It needs no dependency, so a scan of `requirements.txt` or a lockfile does not show it.
      - id: D3.8b
        status: NEW
        claim: "SafeDep's network hunt shape: a Python process that queries a public Ethereum explorer API and then a public RPC node, followed by a node process that queries an Ethereum RPC endpoint or block explorer and then a bare IP address."
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
        body_file: safedep-polinrider.extract.md
        quote: |-
          On the network, look for a Python process that calls
      - id: D3.9
        status: NEW
        claim: "Later stages of the Python chain were not observed: SafeDep did not contact the command server; the stealer behavior it describes (environment secrets, browser passwords, cookies, wallet data) comes from the September chain it followed to the end. Treat a machine that ran the loader with Node.js present as compromised (SafeDep: rotate shell-environment secrets and browser-saved passwords and cookies, move funds out of wallets)."
