cross_item_notes:
  - "All four deltas are update-of records on existing entries; nothing here warrants a new entry. Drupal (item 1) is the only item that changes what a defender must do now (new fixed versions plus update.php, a second exploited flaw, KEV with forensic triage)."
  - "Item 2: the entry should not say the Cisco rating changed in version 1.5; it changed in version 1.2 (2026-NOV-23). Version 1.5 and 1.4 (both 2026-NOV-26) changed Catalyst Center, Finesse and Nexus 3000/9000 rows."
  - "Item 2: Unit 42 and Palo Alto are the same company; Unit 42's article is the reporter's own account and Palo Alto's PSIRT page is a vendor product-status page, so they are not independent corroboration of each other. Unit 42 reports a lab chain, not exploitation."
  - "Item 3: SafeDep and StepSecurity are independent observations (different collection: GitHub code search for the Python loader versus a maintainer's incident plus StepSecurity's own scan), but they converge on the same address-publishing wallet (inference D3.19). Neither names North Korea."
  - "Item 4: HPE's bulletin is a first-party primary (Admiralty A for its own products). The S1 finding's summary of it is accurate; two precision notes on the S1 text: HPE's CVSS 3.1 8.1 is Oracle's vector repeated (HPE does not claim its own scoring), and HPE does not mention any JVM option."
  - "Cited-source hygiene: no NVD, MITRE or cveawg per-CVE page cited; every cited URL was fetched this run and appended to url-liveness.tsv."
