      - id: D1.6
        status: NEW
        claim: "A mandatory update.php run: the fix is not complete with the code swap, because an update hook has to repair existing production sites already in the vulnerable state. The entry's actions[0] has no update.php step."
        source_url: "https://www.drupal.org/sa-core-2026-019"
        body_file: drupal-sa-core-2026-019.plain.txt
