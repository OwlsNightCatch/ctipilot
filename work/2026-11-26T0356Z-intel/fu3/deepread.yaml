        status: NEW
        claim: "Mechanism in observable terms: HTTP/2 stream creation leaves the connection marked reusable after a (fragmented) request starts; once free worker connection slots fall to one sixteenth of worker_connections or below, opening a new socket (the demonstrated trigger is a request-time DNS lookup opening a resolver socket) can close a live connection and free resolver state the request still uses. Unit 42 notes the fix commit also names upstream connection setup as a trigger."
