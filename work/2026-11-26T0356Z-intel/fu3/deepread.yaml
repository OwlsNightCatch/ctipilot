        status: NEW
        claim: "SA-017 (page re-read through the feed): Drupal credits the discovery to Anthropic's OSS Scanner (vulnerability ANT-2026-GMRPK0BU); Searchlight says its independent finding was a duplicate of that report. The entry does not state the credit. SA-017's exploitation Update text, fixed versions and the 'if you cannot upgrade immediately' secure-the-installer instruction are unchanged since the entry's 2026-11-22 record."
        source_url: "https://www.drupal.org/sa-core-2026-017"
