  url_or_quote: 'including a commercial version GTIG calls ARTEX PRO, which ThreatBook''s own release, covered in the update of 2026-11-26, presents as the vendor''s product ([GTIG and Mandiant, 2026-10-31](https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks))'
  summary: '(low confidence) The GTIG page carries "community forks, including localized variations such as ScopeWeaver and a commercial version dubbed ARTEX PRO" but nothing on ThreatBook or its release; the clause that terminates on the GTIG citation chains a fact from Macau Business/Microsoft. The attribution is explicit and the later section cites it, so the substance holds; end the GTIG sentence at "ARTEX PRO" and put the ThreatBook clause in its own sentence with the Macau Business citation, without the same-entry pointer.'
