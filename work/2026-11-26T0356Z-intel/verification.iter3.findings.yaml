  item: 2026-11-26/juniper-session-smart-cve-2026-103406-unauth-root-rce
  url_or_quote: 'The record points to Juniper''s bulletin JSA112183 of 2026-10-28, which carries the fix and could not be read.'
  summary: '(low confidence) The ENISA record gives only the reference "https://supportportal.juniper.net/JSA112183" and a CVE-record datePublished of Oct 28, 2026; the bulletin itself is unreadable (WebFetch returns a loading shell), so its date and the claim that it "carries the fix" rest on inference. Drop the date or say the CVE record was published on 2026-10-28.'
