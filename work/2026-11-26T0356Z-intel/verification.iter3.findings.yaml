  item: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
  url_or_quote: '"Cisco''s advisory now reads version 1.4: ..." ([Cisco, 2026-11-20](https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nov2026-java-rce-eCa6ss9z)); also "Cisco''s advisory (version 1.4) lists ..." ([Cisco, 2026-11-20]) and sources[] date 2026-11-20'
  summary: '(low confidence) Remaining half of the iteration-2 finding: the sentence no longer states a mismatched date, but the citation label is still 2026-11-20. The page header reads "First Published: 2026 November 18 16:00 GMT" and "Last Updated: 2026 November 23 20:32 GMT"; the revision table puts 2026-11-20 at version 1.3. The label equals neither the first publication (2 days off) nor the version-1.4 text it terminates (3 days off). Label 2026-11-18 or 2026-11-23.'
