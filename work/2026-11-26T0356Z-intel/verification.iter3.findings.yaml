- code: F3
  category: claim-not-supported
  section: body
  item: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
  url_or_quote: 'Claroty says its findings combine into attack chains but does not state that the code-of-the-day bypass reaches those two primitives in practice, so the chain is treated as auth-gated unless a combined path is confirmed ([Claroty Team82, 2026-08-09](https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers)); sourcing_note repeats it ("does not explicitly confirm the code-of-the-day mechanism as a pre-auth path into them")'
  summary: 'The cited Claroty page says the opposite in substance: "Successfully bypassing authentication dramatically expanded the attack surface available for analysis. Instead of being limited to the small number of unauthenticated endpoints, we gained access to the device''s full administrative interface and every management function it exposed", lists "email notifications" among those functions and then continues "The SMTP Email configuration page quickly stood out" (the CVE-2025-41451 injection). The Censys page the store already cites on the Danfoss incident entry states "In August 2026, researchers at Claroty demonstrated how CVE-2025-41450 and CVE-2025-41451 could be chained together to achieve remote code execution." The auth-gated reading, the cves[] auth values (41450 pre-auth, 41451 post-auth with no chained note) and the sourcing note understate a KEV-listed bypass. Fix: say Claroty reports the bypass gives access to every management function including the email-notification page where it then found the injection, drop "auth-gated unless confirmed".'
