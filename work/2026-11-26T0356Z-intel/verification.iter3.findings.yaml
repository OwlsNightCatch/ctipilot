  item: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
  url_or_quote: 'sourcing_note: "CVE identifiers are 2025-dated despite the 2026-08-09 public disclosure: reserved-then-disclosed-later is a normal CNA pattern, not a dating error."'
  summary: 'The entry''s own sources date the CVE publications to 2025: Danfoss DSA-2025-03-01 "24 March, 2025: Publication", DSA-2025-08-01 "01 August, 2025: Publication"; ENISA EUVD-2025-13996 datePublished "May 8, 2025" and EUVD-2025-25499 "Aug 22, 2025". Claroty''s 2026-08-09 post is a later write-up of flaws Danfoss had published and patched in 2025, not a disclosure of reserved ids; the stated mechanism is in no source. Replace with the 2025 publication dates (the patch existed about 17 months before the KEV listing).'
