  category: claim-not-supported
  section: body
  item: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
  url_or_quote: '(CWE-77 OS Command Injection, CVSS 3.1 7.6) ... (CWE-15 External Control of Configuration Setting, CVSS 3.1 5.4), cited to Claroty Team82'
  summary: '(low confidence) The Claroty page prints "CVSS v3: 7.6" and "CVSS v3: 5.4" only; its disclosure-dashboard pages carry no version either. "3.1" is on no cited page (ENISA''s CNA records for the same CVEs carry CVSS 4.0 8.7 and 6.8). Write "CVSS v3 7.6" or drop the minor version.'
