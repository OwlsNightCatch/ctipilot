  item: runs/2026-11-26/2026-11-26T0356Z-intel.md
  url_or_quote: 'the Juniper entry''s `epss` is FIRST''s 2026-11-25 probability (EUVD''s 0.52 is not an EPSS probability)'
  summary: '(low confidence) FIRST''s series shows 0.00516 on 2026-11-24 and 0.0086 on 2026-11-25; the EUVD record for the same CVE shows "epss":0.86 today, which is FIRST''s 0.0086 expressed in percent, so the 0.52 the note cites matches FIRST''s 0.00516 of the day before. The entry''s 0.0086 is right; the note''s reason is wrong. Say EUVD gives EPSS in percent.'
