  - {claim_id: f43fb154f7, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "the API requires no account registration or key... allows a mailbox to be created, a token obtained and messages polled for one-time codes entirely from a script"}
  - {claim_id: 0544785b83, verdict: ok, source_url: "https://www.okta.com/newsroom/press-releases/okta-signs-definitive-agreement-to-acquire-permiso-security", passage: "Update August 26, 2026: today Okta closed its acquisition of Permiso Security."}
