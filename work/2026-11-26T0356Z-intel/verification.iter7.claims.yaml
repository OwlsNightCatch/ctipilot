  - {claim_id: 58037133ab, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "Auth0 tenants and Okta organizations that allow public self-service registration"}
