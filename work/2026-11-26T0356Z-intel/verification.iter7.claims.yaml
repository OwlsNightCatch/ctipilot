  - {claim_id: 622724621c, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "The use of these services always occurred within a short window of activity that included other agentic reconnaissance and intrusion attempts against the same entities."}
  - {claim_id: dc85421b02, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "never reached email verification. CAPTCHA cannot stop all attempts, as agents can solve challenges; skip protections applied in Universal Login"}
  - {claim_id: 07cbd4b333, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "Allowing self-service registration is a prerequisite for many of the attacks described in this advisory. Disable or restrict it for workforce users."}
  - {claim_id: 9c22407e15, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "Poll provider APIs like api.mail.tm/domains to receive a list of currently active disposable email domains."}
