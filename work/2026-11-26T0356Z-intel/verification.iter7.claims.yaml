claims:
  - {claim_id: 1d84982873, verdict: ok, source_url: "https://www.okta.com/blog/threat-intelligence/ai-agents-prefer-specific-disposable-email-services-during-ident/", passage: "a blocklist built from previously observed domains will very likely stop matching within weeks of being compiled"}
