  item: "2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce"
  url_or_quote: "Cisco's product impact, published 2026-11-18, is at version 1.3: Secure Network Analytics, Secure Workload and further products are affected, Catalyst Center, IOS XE, ISE and UCS Central are not affected"
  summary: "(low confidence) Cisco's revision table: 1.2 is 2026-NOV-19, 1.3 is 2026-NOV-20 ('Changed Catalyst Center from affected to not affected'), 1.4 is 2026-NOV-23. A section dated 2026-11-19 cannot describe version 1.3 or Catalyst Center as not affected, and the entry's own 2026-11-21 section says 1.3 made that change. The sentence was left as is when its citation label was changed in this run; rewrite it to the 2026-11-19 state (1.2) or fold it into the 2026-11-21 section."
