  item: "2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce"
  url_or_quote: "CVE-2025-41452 (CWE-15 External Control of Configuration Setting, CVSS v3 5.4)"
  summary: "(low confidence) The cited Claroty page prints 'CWE-15 EXTERNAL CONTROL OF SYSTEM OR CONFIGURATION SETTING'; the entry drops 'System or', so the CWE name it attributes is not the one the page (or CWE-15) carries."
