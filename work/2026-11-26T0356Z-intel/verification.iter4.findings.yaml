- code: F4
  category: hallucinated-fact
  section: summary
  item: "2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce"
  url_or_quote: "Claroty's own internet-wide scan found thousands of exposed devices."
  summary: "Claroty's post says the opposite of 'own scan': 'we searched publicly available internet-wide scanning platforms, including Shodan and Censys, for signatures associated with its management interface'. The entry's own body states it correctly ('via internet-wide scan data, using platforms including Shodan and Censys'); the summary overstates it. Reword to 'Claroty's search of public internet-scan platforms found thousands of exposed management interfaces'."
- code: F3
  category: claim-not-supported
