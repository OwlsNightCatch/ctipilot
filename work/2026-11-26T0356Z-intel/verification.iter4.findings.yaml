  item: "2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16"
  url_or_quote: "NCSC-NL says the condition arises when the installer is not secured or removed after installation (translated from Dutch)"
  summary: "(low confidence) Translation fidelity. NCSC-NL: 'Dit gebeurt wanneer de installer niet correct is beveiligd of verwijderd na de initiele installatie' = 'not correctly secured or removed after the initial installation'. The new wording drops 'correctly' (the prior wording kept it), which changes the meaning from an incorrectly secured installer to an unsecured one."
