  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack"
  url_or_quote: "CISA names no campaign, actor or victim and cites only Danfoss's advisories for them"
  summary: "(low confidence) The KEV record's notes field for CVE-2025-41450 lists the Danfoss advisory, the two BOD 26-04 pages and 'https://nvd.nist.gov/vuln/detail/CVE-2025-41450'; 'only Danfoss's advisories' is not literally true. The substance (no campaign named) holds; reword to 'cites Danfoss's advisories as its vendor source'."
- code: F8
  category: needs-more-research
  section: body
  item: "2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce"
  url_or_quote: "(body carries only a **Triage:** line; no **Exposure:**, **Detection:** or **Defender takeaway:** line)"
  summary: "The run raised this entry to high on a KEV listing and rewrote its body, yet it still ends without the required **Defender takeaway:** (every other run-modified entry has Exposure, Detection and Takeaway). The sources clearly support both: Exposure (AK-SM 800A firmware before build 4.2 for CVE-2025-41450 and before R4.3.1 for the two post-auth flaws; management interface reachable from the internet; Claroty 'thousands of publicly accessible management interfaces') and Takeaway (upgrade to R4.3.1, take the interface off the public internet, treat CVE-2025-41450 as exploited). Add them from the cited Claroty, Danfoss and CISA pages."
