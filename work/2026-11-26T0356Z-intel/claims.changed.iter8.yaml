    surface: "record 2026-11-26T05:05:30Z"
    kind: record-summary
    text: "CISA added all five MiCollab AWV flaws, among them the unauthenticated CVSS 10.0 command injection, to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming an actor, victim or technique; Mitel's advisory, revised to version 2.0 on 2026-11-24, now lists the CVE ids and makes no exploitation statement. Priority moves to high."
  - claim_id: 7a96ad8d6b
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to unauthenticated code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, NCSC.ch and Wiz the two HTTP/2 flaws and Rapid7 CVE-2026-123007. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings; Unit 42 reached pre-authentication code execution through CVE-2026-123633 as the worker user in a lab, on a non-default configuration and with a separate memory leak that F5 has not given a CVE. Palo Alto Networks lists PAN-OS and Panorama with HTTP/2 enabled as affected, Cisco, Siemens and Synology list products with fixes pending or none, Fortinet confirms FortiOS, FortiProxy, FortiMail, FortiManager and FortiAnalyzer not impacted and still has FortiAuthenticator and dozens of other products under investigation."
