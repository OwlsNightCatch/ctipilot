claims:
  - claim_id: 375b41632c
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "summary"
    kind: frontmatter
    text: "Companion disclosure to Claroty's Copeland research, same team and publish day. Danfoss AK-SM 800A refrigeration system managers, used in supermarkets, cold-storage facilities and warehouses, carry an undocumented 'code-of-the-day' authentication bypass (CVE-2025-41450) that Claroty says gives a fully authenticated administrative session and that Danfoss and CISA describe as generating a web report with internal IPs, usernames and store names, a post-authenticated OS command injection in the alarm-email configuration (CVE-2025-41451), and an Nginx configuration-injection flaw enabling denial of service (CVE-2025-41452). Claroty's search of public internet-scan platforms found thousands of exposed management interfaces. CISA added CVE-2025-41450 to its Known Exploited Vulnerabilities catalogue on 2026-11-25 without naming a campaign."
  - claim_id: ee35542b86
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "CVE-2025-41451 (CWE-77 OS Command Injection, CVSS v3 7.6) is a post-authenticated command injection in the alarm-to-email (SMTP) configuration field: a user-supplied value is formatted unsanitized into a shell command executed on the device, which Claroty used to achieve remote code execution ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
  - claim_id: eb5cb35b59
    entry: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce
    surface: "body"
    kind: cited
    text: "CVE-2025-41452 (CWE-15 External Control of System or Configuration Setting, CVSS v3 5.4) lets a post-authenticated user inject arbitrary Nginx directives via the exposed `headers.conf` include and so implant routing directives into the Internet-facing Nginx configuration, enabling denial-of-service ("
    urls: ["https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"]
