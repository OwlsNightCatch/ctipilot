  # ---------------------------------------------------------------- 9. Drupal SA-CORE-2026-019 (UPDATE-OF)
  - title: "Drupal core SA-CORE-2026-019 (CVE-2026-136716, Highly critical 21 of 25): a second installer flaw leaves sites in unusual or incomplete install states open to takeover after SA-CORE-2026-017, exploited in the wild; fixed in 11.4.14, 11.3.23 and 10.6.23 with an update.php step; CVE-2026-132165 is on the KEV catalogue from 2026-11-24"
    sources:
      - { url: "https://www.drupal.org/sa-core-2026-019", publisher: "Drupal Security Team (SA-CORE-2026-019, read through the security feed)", date: "2026-11-25", role: "primary" }
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA (KEV catalogue record, CVE-2026-132165)", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: drupal-security, URL https://www.drupal.org/security/all/rss.xml (python3 tools/fetch_source.py feed; newest item 'Drupal core - Highly critical - Access bypass - SA-CORE-2026-019', 2026-11-25T17:04Z; the drupal.org page itself answers fetch tools with a client challenge, so the advisory body was read from the feed's content) → primary (no pivot needed) → CISA KEV record for CVE-2026-132165 (python3 tools/fetch_source.py cisa-kev, added 2026-11-24)"
    summary: |
      Drupal published SA-CORE-2026-019 on 2026-11-25 (CVE-2026-136716, Highly critical 21 of 25: access complexity basic, authentication none, confidentiality and integrity impact all, exploit status Exploit, target distribution uncommon). Drupal core ships an install.php installer; a site that has already secured the installer is not vulnerable. SA-CORE-2026-017 fixed several installer flaws, but certain sites in unusual or incomplete install states, production sites included, remain open to site takeover after it; the user interface does not show whether a site is in the vulnerable state, and already compromised sites may no longer be in it. Drupal says this is being exploited in the wild and that any site which left its installer remotely accessible after SA-CORE-2026-017 may still have been compromised. Affected: core before 10.6.23, from 11.0.0 before 11.3.23 and from 11.4.0 before 11.4.14; fixed in 11.4.14, 11.3.23 and 10.6.23, and an update.php run is required because an update hook must fix existing production sites in this state; Drupal 11.2.x and below, 10.5.x and below, 9 and 8 are end of life with no fix. Drupal also advises checking site logs for unauthorised access, especially unexpected changes to or by the user 1 account, making sure the user 1 email address is one you control and considering a password reset for user 1; both advisories are covered by Drupal Steward mitigations, though Drupal says to upgrade anyway. Separately CISA added CVE-2026-132165 (SA-CORE-2026-017) to the KEV catalogue on 2026-11-24 with a 2026-11-27 due date.
    region_nexus: "global; Drupal is widely used for public-sector websites (not quantified in the sources); NCSC.ch and NCSC-NL covered the earlier release"
