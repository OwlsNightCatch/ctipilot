    summary: |
      CISA added CVE-2026-103406 to its KEV catalogue on 2026-11-25 with a 2026-11-28 due date, a forensic-triage flag and an unknown ransomware-use status; its record describes an OS command injection in Juniper Session Smart Conductor and Session Smart Router that lets a remote attacker execute arbitrary commands as root through a specially crafted salt minion ID. ENISA's EUVD record, which carries Juniper's own CNA text, narrows it to the AutomatedProvisioner of Session Smart Conductor, scores it CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N) and lists Conductor releases before 7.0.5, from 7.1.0 before 7.1.7 and from 7.2.0 before 7.2.3 as affected, fixed in 7.0.5, 7.1.7 and 7.2.3; EUVD shows it as exploited since 2026-11-25. The flaw sits in Juniper's bulletin JSA112183, published 2026-10-28 and titled by Juniper as multiple internally discovered vulnerabilities resolved, which fixes 18 CVEs in the two products in the same three releases. Besides CVE-2026-103406 the notable rows are CVE-2026-103409 (Router, 9.8: an unauthenticated network attacker obtains administrative privileges through crafted URL parameters sent to an insecure endpoint that runs as root, exploitable only before the device is onboarded to Mist or a Conductor), CVE-2026-103403 and CVE-2026-106079 (OS command injection in AccessManager, 8.8, needing low privileges or config-write), CVE-2026-103401 (8.8, link following in unauthenticated web-server handlers, exploitable on Mist-managed and not-yet-onboarded routers) and CVE-2026-103408 (Router, 8.8, stack overflow in the DHCP client reachable by an unauthenticated attacker on the local network through a malicious DHCP reply). No source names an exploiting actor, a victim, an attack technique or the number of affected devices, and Juniper's own bulletin page could not be read by any transport, so Juniper's exploitation wording, workarounds and fix-table detail are unconfirmed; the facts above are CISA's catalogue record and the CNA text as relayed by ENISA.
