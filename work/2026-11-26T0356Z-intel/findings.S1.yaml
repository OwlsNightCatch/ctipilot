  - { source_id: msrc-update-guide, reason: "recipe improvement: the plain `$filter=latestRevisionDate ge <date>` OData sweep is dominated by third-party (Azure Linux kernel) revisions, hundreds per day; add `issuingCna eq 'Microsoft'` (via `url --direct 'https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability?$filter=issuingCna%20eq%20%27Microsoft%27%20and%20latestRevisionDate%20ge%20<ISO>&$orderby=latestRevisionDate%20desc&$top=100'`) and `exploited eq 'Yes'` or `publiclyDisclosed eq 'Yes'` variants to get the Microsoft-issued, exploited and disclosed rows" }
