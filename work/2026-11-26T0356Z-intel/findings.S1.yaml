    extended_notes: |
      Exposure check from the advisory wording: an installed Joomla site whose installation folder still exists on the web root is in scope for the installer flaw; removing the folder is the long-standing hardening step and the advisory's trigger condition. Detection: web access logs for requests under /installation/ on a site that is already installed, and unexpected modification of configuration.php.
