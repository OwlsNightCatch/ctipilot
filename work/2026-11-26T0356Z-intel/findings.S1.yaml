Security are unaffected, while ITSI, DB Connect and the AppDynamics Java Agent use a separately installed Java runtime that customers must update. Cisco's advisory is at version 1.4 (2026-11-23), still stating that Cisco PSIRT knows of proof-of-concept code and of no malicious use. No source in this batch reports exploitation.
