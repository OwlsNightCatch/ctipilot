      Shadowserver is first-hand for its own scan and honeypot telemetry (single source by nature; its references point to an FBI FLASH on ARTEX (FLASH-20261113-001), a UK NCSC blog and a CERT-EU blog, none fetched here). Defender value: the daily Device Identification report lists exposed framework instances on a network (device_type ai-attack-framework), and the honeypot event reports label source addresses running them. Behavioural hunt hooks from the stated activity: rapid iterative probing of one target (dozens of requests per minute), browser-like spoofed user agents mixed with curl, python-requests, Go and aiohttp, traffic-relay attempts toward payment, banking and crypto services, requests for .env and Git metadata including path traversal, and default-credential attempts on Jenkins. The note that an exposed framework may be an authorised pentest tool means ownership has to be verified before treating an instance as compromise. Overlaps registry entries on ARTEX, the BACS first-confirmed-AI-agent-attacks entry (2026-11-25) and CyberStrikeAI AWS CloudTrail intrusion entry (2026-11-14); this item adds the exposure and honeypot quantification, not a new incident.
    classification: { reliability: B, credibility: 2 }


