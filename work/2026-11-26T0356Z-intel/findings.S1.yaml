  # ---------------------------------------------------------------- 15. Joomla core 5.4.11 / 6.2.1 (NEW, borderline)
  - title: "Joomla 5.4.11 and 6.2.1 (2026-11-24): RCE through media custom field parameters (CVE-2026-129393, EUVD CVSS 9.4, Joomla rates severity and probability Low), unauthenticated web-installer rewrite while the installation folder exists (CVE-2026-123214, 9.2, severity Moderate and probability Low) and a language-parameter local file inclusion (CVE-2026-126045)"
    sources:
      - { url: "https://developer.joomla.org/security-centre/1154-20261156-core-rce-through-media-custom-field-parameters.html", publisher: "Joomla Security Strike Team (20261156)", date: "2026-11-24", role: "primary" }
      - { url: "https://developer.joomla.org/security-centre/1109-20261111-core-missing-authentication-in-web-installer.html", publisher: "Joomla Security Strike Team (20261111)", date: "2026-11-24", role: "primary" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-134309", publisher: "ENISA EUVD (EUVD-2026-134309)", date: "2026-11-24", role: "corroborating" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-134297", publisher: "ENISA EUVD (EUVD-2026-134297)", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-24&toDate=2026-11-26&page=0&size=100 (four Joomla! Core records 9.2 to 9.4, published 2026-11-24 17:23 to 17:30 UTC) → primary: Joomla Developer Network security-centre pages 1154, 1109 and 1110 named in the EUVD references (extract)"
    summary: |
      Joomla's Security Strike Team lists a core security release on 2026-11-24 (fixed in 5.4.11 and 6.2.1; affected 4.0.0 to 5.4.10 and 6.0.0 to 6.2.0). 20261156 (CVE-2026-129393, reported by VulnCheck for Alex Williams of Pellera Technologies on 2026-10-26): inadequate escaping of media field parameters in the generated form XML lets an attacker manipulate the form definition, leading to remote code execution; Joomla's own ratings are impact Critical, severity Low, probability Low, while the EUVD carries CVSS 9.4. 20261111 (CVE-2026-123214, impact Critical, severity Moderate, probability Low): the web installer remains usable on an installed site as long as the installation folder exists, so unauthenticated users can rewrite the configuration. 20261112 (CVE-2026-126045, impact High, severity Low, probability Low, affecting from 1.6.0): the language request parameter is not validated before building the path of included language files. A fourth record covers a race condition in the formatted text logger that can recreate a log file without its protective header (CVE-2026-127297). The advisories do not say which privileges the media-field RCE needs, state no exploitation and no workaround beyond upgrading. The installer item has the same shape as the Drupal installer takeovers now exploited (SA-CORE-2026-017 and -019), but nothing indicates that Joomla's has been used.
    region_nexus: "global; Joomla is a common CMS for municipal and association websites (Swiss use not quantified in the sources)"
    primary_sector_nexus: "indirect"
