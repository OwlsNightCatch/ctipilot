  # ---------------------------------------------------------------- 14. Genetec Security Center (NEW, borderline)
  - title: "Genetec Security Center authentication bypass for external identity-provider logins (CVE-2026-124284, CVSS 3.1 9.8, specific conditions required) fixed in 5.10.4.34, 5.11.3.32, 5.12.2.25, 5.13.3.11, 5.14.1.4 and 5.14.2.1; published 2026-11-24"
