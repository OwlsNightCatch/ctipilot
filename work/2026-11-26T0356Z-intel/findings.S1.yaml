    summary: |
      SEPPmail's revision history lists patch release 15.1.2 of 2026-11-24 with eleven security fixes, all for versions before 15.1.2; the gateway is a Swiss secure-email product and the earlier 15.1.1 fixes (2026-11-03) are already covered by the store. The vendor's scores: CVE-2026-130637 (9.3): request values reflected on the GINA login page were processed by the template engine, which could let an unauthenticated attacker read attributes of any GINA account and take it over; CVE-2026-124840 (9.2): in GINA a session created by answering the security question was also accepted by the account registration and settings workflows, so an attacker who knows the security answer could replace the password and take over the account; CVE-2026-124843 (9.2): if the appliance-specific key material could not be loaded a hard-coded fallback secret was used, which could let encrypted Large File Transfer attachments be decrypted outside the appliance; CVE-2026-124844 (8.7): files uploaded to GINA by unauthenticated requests were not removed, so an attacker could fill the disk; CVE-2026-124838 (8.5): the configuration service's local socket was accessible to every local user, a local-to-elevated path; CVE-2026-124842 (8.3): an unauthenticated GINA request could reset the password of a registered account without answering the security question; CVE-2026-124839 (7.7): a crafted GINA account address could lead to command execution with elevated privileges by a maintenance script at system start; and four rows at 6.9 to 6.3 (LDAP wildcard escaping in GINA lookups, LDAP-filter injection in the ldap_compare and ldap_read rule commands, forged Authentication-Results through a crafted DKIM signature that the gateway's ARC seal then covers, and a GINA-domain fallback to the [default] domain settings when a client header breaks the lookup). The same release makes the REST login enforce the administrator MFA policy, answer all failed logins uniformly with HTTP 403 and log successful logins to the audit log, and escapes client values in the LDAP search filters of several REST endpoints. The page names no exploitation, no workaround and no branch other than the one fixed; whether the 15.0 branch (last release 15.0.7 per the earlier advisory) is affected is not stated on the page.
