    summary: |
      Shadowserver says it has begun daily scanning for publicly exposed instances of 15 agentic offensive frameworks, among them ARTEX, AntiFox and ScopeWeaver (both derived from ARTEX), CyberStrikeAI, PentAGI, Cairn, RedAmon, Strix and PentestCode. On 2026-11-23 its scans identified about 4,200 exposed instances, up from just under 3,700 the day before; nearly half were in Asia, over a third in North America and most of the rest in Europe, ARTEX made up about 70 percent on most days, and AntiFox grew fastest, from a handful to around 200. Shadowserver notes that not all frameworks are malicious, since security teams use them for authorised testing. In its Global Honeypot Sensor Network, more than 80 IP addresses fingerprinted as running such frameworks generated over 10,000 events between 9 and 23 November, a handful of addresses accounting for most, nearly nine in ten fingerprinted as ARTEX Gateway and almost all on cloud networks. About six in ten tried to tunnel traffic through the sensors to other destinations (over 40 percent of relay requests went to payment, banking and crypto services, most from two addresses), some probed AI, LLM and automation services (n8n, Dify, Flowise, MLflow, MCP endpoints), about one in ten looked for credential files such as .env or tried default logins such as admin/admin on Jenkins, and the most active addresses searched VPN and remote-access gateways, VMware vSphere, Jenkins, Metabase and GeoServer; about one in ten sent exploit payloads, most often for Metabase CVE-2023-38646, plus PHPUnit CVE-2017-9841, Cisco IOS XE CVE-2023-20198 and GeoServer CVE-2024-36401. Much of the activity was automated, with dozens of requests per minute at peak, and a few addresses were active in every hour of the day over several days. Shadowserver advises responders not to attribute activity by source IP address or country alone, to retain proxy and gateway logs, and offers the exposure and honeypot data free in its Device Identification and honeypot event reports (device_type ai-attack-framework) to network owners and national CSIRTs.
