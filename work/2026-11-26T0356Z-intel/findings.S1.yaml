    extended_notes: |
      The Drupal Security Team is the only source for the new advisory (read from its feed because the page answers a client challenge); the carve-out applies as the disclosing party for its own product. Exposure check: request /core/install.php (or the installer path in use) from outside; a site that returns an installer screen or does not block the path is in scope; the supported fix is the update plus 'securing the installer' as Drupal's documentation describes. Detection: web access logs for requests to install.php with unusual parameters from outside, and Drupal's database log and user table for changes to user 1 (email, password, last-login), new administrators or changed settings.php. Post-patch: update.php must run, otherwise the fixed code does not repair a site already in the vulnerable state. The existing entry's actions[] should add the update.php step and the user 1 review.
