    evidence:
      - quote: "The web installer remains usable on an installed site as long as the installation folder exists, allowing unauthenticated users to rewrite the configuration."
        attribution: "Joomla Security Strike Team (20261111)"
        source_url: "https://developer.joomla.org/security-centre/1109-20261111-core-missing-authentication-in-web-installer.html"
      - quote: "Inadequate escaping of media field parameters in the generated form XML allowed manipulating the form definition, leading to a remote code execution vulnerability."
        attribution: "Joomla Security Strike Team (20261156)"
