  - title: "Shadowserver: about 4,200 internet-exposed agentic AI attack-framework instances on 2026-11-23, around 70 percent ARTEX, and more than 80 framework-fingerprinted IP addresses sent over 10,000 events to its honeypots from 9 to 23 November, hitting VPN and virtualization gateways, Jenkins, Metabase and GeoServer"
