  # ---------------------------------------------------------------- 16. hex.pm incident (NEW, borderline)
  - title: "hex.pm, the Erlang and Elixir package registry, was breached on 2026-11-23 through an unauthenticated remote code execution in its request parser (CVE-2026-129514, CVSS 10.0): no package modification found, infrastructure credentials and session and token signing keys rotated, password hashes, 2FA secrets and API key hashes possibly read, registry signing key still to be replaced"
    sources:
      - { url: "https://hex.pm/blog/security-incident-on-hexpm", publisher: "Hex (hex.pm security incident notice)", date: "2026-11-24", role: "primary" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-134070", publisher: "ENISA EUVD (EUVD-2026-134070)", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-24&toDate=2026-11-26&page=0&size=100 (EUVD-2026-134070, hexpm 10.0, published 2026-11-24 13:48 UTC) → primary: https://hex.pm/blog/security-incident-on-hexpm (extract; the post's own timeline runs to 2026-11-24 13:48 UTC, its exact publication time is not shown)"
    summary: |
      Hex says an unauthorized third party exploited a vulnerability in hex.pm on 2026-11-23 and ran commands on its web servers: 69 malicious requests from 18:16 to 18:29 UTC reached six web servers, a firewall rule followed at 18:27 and patched builds replaced all servers by 18:31. Hex found no unauthorized package modification, database change or sign of lasting access, but cannot rule out that the attacker read stored data because database reads are not logged: email addresses, password hashes, API key hashes, 2FA secrets, sessions and audit logs; private-package reads in the period matched its own servers and it will contact affected organisations. The attacker's commands could read the servers' credentials, so Hex replaced the storage, CDN, email and database credentials and the session and access-token signing keys (everyone was logged out) and has not yet rotated the registry signing key: a new signing system with key rotation is promised in new Hex client releases within days and, until then, Hex says to avoid third-party mirrors and fetch only from repo.hex.pm. Users are told to change their password, reset 2FA and update the client. The flaw (CVE-2026-129514, published 2026-11-24): an endpoint-level parser decoded unauthenticated Erlang-term bodies with the 'safe' decoder, which still lets Elixir struct values through, and the struct, placed in the request parameters, caused an error whose reporting path (Sentry, Bandit logging, the JSON log formatter) calls inspect, so the struct's module chose the next call, chaining through Ecto's DynamicExpr inspect and a DBConnection stream's log option into an attacker-supplied module, function and arguments tuple and OS command execution as the BEAM user. Hex found the same class in Ash keyset pagination cursors (CVE-2026-124283, fixed in ash 3.38.0 on 2026-11-24) and lists hardening for plug_crypto, plug, ecto and db_connection (CVE-2026-133555). Hex reported to CISA, ENISA and the Swedish data protection authority IMY.
    region_nexus: "global; Hex notified CISA, ENISA and the Swedish data protection authority IMY; Elixir and Erlang use in Swiss public bodies is not stated"
    primary_sector_nexus: "indirect (software supply chain)"
    sector: "technology / software supply chain"
    cves: [CVE-2026-129514, CVE-2026-124283, CVE-2026-133555]
    techniques: [T1190, T1059, T1552.001]
    affected_products: ["hex.pm (hexpm)", "Ash framework", "Elixir Plug", "Elixir Ecto", "db_connection"]
    entity_keys: []
    new_entities:
      - { key: "incident:hexpm-registry-rce-breach-2026-11", type: incident, name: "hex.pm registry unauthenticated RCE breach (23 November 2026)", aliases: ["Hex security incident"], summary: "Unauthorized third party ran commands on hex.pm web servers on 2026-11-23 through CVE-2026-129514; no package tampering found, credentials and signing keys rotated, user data possibly read (Hex, 2026-11-24)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "first-hand victim disclosure with a transferable technique (struct gadget chain through inspect in error reporting) but low Elixir/Erlang footprint for the constituency; the post's publication time is unverified and the CVE record was published 2026-11-24 13:48 UTC, about twelve hours before the window, so S4 may carry it; the registry signing key was not yet rotated at publication"
    evidence:
      - quote: "On November 23, 2026, an unauthorized third party exploited a vulnerability in hex.pm that let them run commands on our web servers."
        attribution: "Hex"
        source_url: "https://hex.pm/blog/security-incident-on-hexpm"
      - quote: "We found no evidence of unauthorized package modifications, or database changes, or that the attacker maintained access to our systems."
        attribution: "Hex"
        source_url: "https://hex.pm/blog/security-incident-on-hexpm"
      - quote: "Until then, don't trust third-party mirrors and fetch packages only from repo.hex.pm."
        attribution: "Hex"
        source_url: "https://hex.pm/blog/security-incident-on-hexpm"
    extended_notes: |
      Victim's own words, so single-source by nature. Transferable detection concept for any Elixir or Erlang web service: unauthenticated POSTs with the application/vnd.hex+erlang content type (or any Erlang external term format body) to routes that never needed it, and error-tracker events carrying UndefinedFunctionError with a struct argument. Hardening lever stated by Hex: reject any decoded term containing a map with a __struct__ key; the underlying libraries are being hardened.
    classification: { reliability: B, credibility: 2 }

  # ---------------------------------------------------------------- 17. PolinRider Python loader (UPDATE-OF, borderline)
  - title: "PolinRider campaign adds a Python loader that runs JavaScript stored in Ethereum transactions: SafeDep found it in 375 public GitHub repositories of 260 accounts on 2026-11-24, hidden in utils modules and conftest.py"
    sources:
      - { url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata", publisher: "SafeDep", date: "2026-11-24", role: "primary" }
    discovery_trace: "first seen at: safedep, URL https://safedep.io/rss.xml (python3 tools/fetch_source.py feed; item 'PolinRider Moves to Python with an Ethereum Calldata Loader', 2026-11-24) → primary: https://safedep.io/blog/polinrider-python-loader-ethereum-calldata (extract)"
    summary: |
      SafeDep reports that PolinRider now plants a 58-line Python loader in GitHub repositories. It hides in a small utils package (files such as session.py, transport.py, clients.py, http_session.py, net.py) or in conftest.py; when Python imports it, it reads the newest transaction an Ethereum wallet sent to itself through the public Ethplorer API and an Ethereum RPC node, decodes the input data as JavaScript and runs it with Node.js; that stage reads a second wallet to find the command-and-control server and passes the next stage to a detached node -i process, so the code is not in the process command line. On 2026-11-24 SafeDep found the loader in 375 public repositories under 260 accounts, 370 of them with a push in November 2026, and no PyPI or npm package carries it. pytest runs a conftest.py loader on every test run; the planted import lines in application files run it only when Python can find a top-level utils package, so documented start commands often fail with an import error before the loader runs, and a developer who fixes the import path starts it. The loader uses only the standard library, so a scan of requirements files or lockfiles does not show it; two repositories hold it in commits whose message says it removes the malware, and a request to Ethplorer or PublicNode alone does not indicate infection. SafeDep continues its September post on the Ethereum C2 variant; the first public report was an issue in the meSingh/polinrider-scanner repository on the same day.
    region_nexus: "global; developer workstations and CI that clone or run affected repositories"
    primary_sector_nexus: "indirect"
    sector: "technology / software supply chain"
    cves: []
    techniques: [T1195.002, T1059.006, T1059.007, T1102]
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter"
    update_fields_hint: [summary, body, sources, techniques]
    lookback: true
    borderline: true
    borderline_reason: "campaign delta (new Python loader, 375 repositories) but single-source, developer-targeted and with no stated public-sector victim; at most a short changelog record on the existing PolinRider entry"
    evidence:
      - quote: "On 24 November 2026, SafeDep found the loader in 375 public repositories that belong to 260 accounts."
        attribution: "SafeDep"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
      - quote: "No package on PyPI or npm carries it."
        attribution: "SafeDep"
        source_url: "https://safedep.io/blog/polinrider-python-loader-ethereum-calldata"
    extended_notes: |
      Behavioural detection concepts (no IOCs): a Python process that makes an HTTPS request to a public blockchain-explorer API and an Ethereum JSON-RPC endpoint and then spawns node (visible as python to node child-process lineage with a temporary .js file); a detached node -i process fed through standard input; git history showing planted utils files plus five import lines at the top of an application start file. Developers and CI runners are the exposure; the benign lookalike is legitimate use of Ethplorer or PublicNode by blockchain tooling, which SafeDep says is not by itself an infection.
    classification: { reliability: B, credibility: 2 }

