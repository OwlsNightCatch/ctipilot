  # ---------------------------------------------------------------- 3. SEPPmail 15.1.2 (NEW)
  - title: "SEPPmail Secure Email Gateway before 15.1.2 (patch release of 2026-11-24): unauthenticated template injection on the GINA login page that reads and takes over any GINA account (CVE-2026-130637, CVSS 9.3), unauthenticated password reset of registered GINA accounts (CVE-2026-124842, 8.3) and a security-question session accepted by registration and settings (CVE-2026-124840, 9.2), eleven security fixes in all"
