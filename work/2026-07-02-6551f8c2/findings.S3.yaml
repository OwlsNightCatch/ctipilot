  - title: "Cisco Talos: \"ARToken\" — an EvilTokens affiliate panel exposes a complete BEC-as-a-service toolkit on top of Microsoft 365 device-code phishing"
    sources:
      - { url: "https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/", publisher: "Cisco Talos", date: "2026-07-01", role: "primary" }
      - { url: "https://cyberscoop.com/artoken-bec-platform-cisco-talos/", publisher: "CyberScoop", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: talos (bridge feed https://blog.talosintelligence.com/rss/) → primary: Cisco Talos, URL https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/ (no pivot needed) → corroborating: CyberScoop, URL https://cyberscoop.com/artoken-bec-platform-cisco-talos/"
    summary: |
      Cisco Talos identified a fully-featured phishing-as-a-service (PhaaS) operator panel, "ARToken," that shares API contracts and infrastructure patterns with EvilTokens, the device-code phishing platform Sekoia and Microsoft documented in March/April 2026. ARToken's React SPA dashboard exposes 80+ API endpoints covering device-code phishing, Primary Refresh Token (PRT) persistence, mailbox access, BEC operations, and SharePoint/OneDrive exfiltration — a complete post-compromise BEC operations environment, not just a credential-phishing kit. Talos found the panel's 1.7MB compiled JavaScript bundle unauthenticated at "dashboard-bl.pamconj[.]com" during an IR engagement; the C2 API (spx.pamconj[.]com) issues an identical POST /api/device/start contract (userId, clientMode:"broker", login_hint, redirect_url → device_code/user_code/verification_uri) to the one Sekoia documented for EvilTokens, and the same broker-mode WAM flow drives PRT acquisition via /prt/setup → /prt/refresh → /prt/renew → /prt/reacquire → /prt/cookie — a persistence chain that survives password resets (kit config flag persistAfterPassChange:false signals affiliates understand this and must exfiltrate/escalate before a reset). The phishing payload itself is delivered XOR-encrypted (16-byte key) and gated by a seven-layer client-side anti-analysis chain (User-Agent regex, navigator.webdriver check, browser feature fingerprinting, window-dimension analysis, interaction telemetry requiring 3+ mouse moves/1+ touch event, an 800ms timing gate, and mouse-trajectory pattern analysis) — materially more sophisticated than EvilTokens' previously documented server-side X-Antibot-Token (SHA-256(secret+timestamp+"antibot"), 5-min validity) mechanism. Capabilities not previously reported for EvilTokens include cross-mailbox keyword monitoring ("Box Monitor"), programmatic inbox-rule creation for evidence suppression, token import/export for cross-platform trading, operator-to-operator shared access links, geo-dynamic lure templates, and a standalone Windows desktop session browser ("ARTBrowser") equivalent to EvilTokens' "Portal Browser." The recovered in-the-wild lure abused a real vendor relationship (spoofed accounts-payable contact, Reply-To pivot to an attacker domain, SPF/DKIM/DMARC all failing) and a genuine sharepoint.com tenant whose anchor text displayed the real vendor tenant but whose href pointed to a look-alike tenant folded from the vendor name plus ".com" under an attacker-controlled Microsoft 365 workspace, inheriting SharePoint's clean domain reputation.
    ch_eu_nexus: "global; targets Microsoft 365 tenants broadly, directly relevant to any EU/CH public-sector or enterprise M365 estate"
    public_sector_nexus: "indirect"
    sector: "cross-sector; finance, HR, logistics per EvilTokens targeting precedent"
    cves: []
    actors_campaigns_malware: ["ARToken", "EvilTokens"]
    verification: MULTI-SOURCE
