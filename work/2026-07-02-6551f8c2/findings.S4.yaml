        source_url: "https://www.ransomware.live/id/QmRAbWVkdXNhbG9ja2Vy"
    extended_notes: |
      Framing per S4 domain guidance: MedusaLocker claims to have extracted 772 emails from bd.zh.ch; this is NOT
      confirmed by the Canton of Zurich. No victim statement, NCSC.ch (BACS) advisory, or Swiss press coverage was
      found despite targeted searching. Given the direct relevance to a Swiss cantonal-government reader base, this
      is surfaced as an early, unconfirmed signal for situational awareness — recommend the main agent frame this
      explicitly as "listed by MedusaLocker; not confirmed by the Canton of Zurich" and treat it as a watch item
      pending either an official statement or independent journalism. No technical detail (initial-access vector,
      exploited product) is available from the leak-site listing.

