items:
  - title: "DHS confirms hackers breached the Homeland Security Information Network (HSIN), targeting servers and a SharePoint collaboration system"
    sources:
      - { url: "https://www.nextgov.com/cybersecurity/2026/06/hackers-breached-dhs-information-sharing-network-people-familiar-say/414534/", publisher: "Nextgov/FCW", date: "2026-06-30", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/dhs-confirms-hackers-breached-hsin-info-sharing-platform/", publisher: "BleepingComputer", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/feed/ (item published 2026-07-01T17:32Z) → primary: Nextgov/FCW investigative report (2026-06-30), URL https://www.nextgov.com/cybersecurity/2026/06/hackers-breached-dhs-information-sharing-network-people-familiar-say/414534/ → corroborating: BleepingComputer's follow-up carrying DHS's on-record statement, URL https://www.bleepingcomputer.com/news/security/dhs-confirms-hackers-breached-hsin-info-sharing-platform/"
    summary: |
      Nextgov/FCW reported (2026-06-30, citing two people familiar with the matter) that an unknown threat actor
      accessed the Homeland Security Information Network (HSIN) — a DHS platform used by federal, state, local,
      international, and private-sector partners to exchange sensitive-but-unclassified information, coordinate
      incident response, and share data on persons of interest. The intrusion is believed to have occurred between
      late May and early June 2026; the threat actors targeted HSIN servers and a SharePoint system used for
      collaboration. DHS's Office of Intelligence and Analysis conducted a damage assessment; attribution and
      whether documents were exfiltrated remain undisclosed. The timing draws added scrutiny because the US is
      currently overseeing security coordination for World Cup games, and HSIN is used to coordinate safety
      planning for major events — raising the possibility that event security-planning documents or interagency
      coordination details were exposed. Following the Nextgov report, DHS confirmed the incident to
      BleepingComputer: "The Department of Homeland Security is aware of a recent cyber incident involving a
      specific, unclassified legacy information sharing environment. We immediately took action to isolate the
      affected systems, mitigate the vulnerability, and launch a comprehensive forensic investigation. There is no
      indication that classified networks were impacted, and the system remains operational for our partners."
      HSIN previously suffered a 2023 access-misconfiguration incident (a contractor coding error set permissions
      to "everyone" rather than a restricted group), exposing sensitive US-person PII inside HSIN-Intel.
    ch_eu_nexus: "indirect — HSIN's international-partner access model means non-US agencies with liaison access could be affected; no CH/EU entity named"
    public_sector_nexus: "direct — US federal government critical information-sharing infrastructure"
    sector: "public-sector, law-enforcement, critical-infrastructure-coordination"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The hackers targeted HSIN servers and a SharePoint system used for collaboration efforts, the person added."
        attribution: "Nextgov/FCW"
        source_url: "https://www.nextgov.com/cybersecurity/2026/06/hackers-breached-dhs-information-sharing-network-people-familiar-say/414534/"
      - quote: "The Department of Homeland Security is aware of a recent cyber incident involving a specific, unclassified legacy information sharing environment. We immediately took action to isolate the affected systems, mitigate the vulnerability, and launch a comprehensive forensic investigation."
        attribution: "DHS spokesperson, via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/dhs-confirms-hackers-breached-hsin-info-sharing-platform/"
    extended_notes: |
      Defender takeaway: no vulnerable component / CVE has been disclosed — DHS's statement references "mitigate
      the vulnerability" without naming it, and neither outlet's sourcing identifies an initial-access vector.
      Operational lesson worth flagging for public-sector SOCs regardless: HSIN's own history (the 2023 permissions
      misconfiguration) and this event both trace to information-sharing / collaboration-platform trust boundaries
      (SharePoint, cross-org portals) rather than perimeter exploitation — worth an internal review of who has
      standing access to your own cross-agency information-sharing portals and whether access reviews / anomalous-
      download alerting exist for them. Nextgov notes a related February 2026 suspected China-linked breach of an
      FBI surveillance system (reported separately) as context for the broader pattern of nation-state interest in
      US law-enforcement/intelligence-sharing infrastructure.

  - title: "Kubota North America discloses a ~5-week HR-data breach; employee/dependent SSNs, bank details and benefits data exposed, no ransomware claim"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/kubota-says-hackers-had-month-long-access-to-network-systems/", publisher: "BleepingComputer", date: "2026-07-01", role: "corroborating" }
      - { url: "https://www.kubotausa.com/notice-of-security-incident", publisher: "Kubota North America Corporation (victim notice)", date: "2026-06-30", role: "primary" }
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/feed/ (item published 2026-07-01T21:09Z) → primary: Kubota's own victim notice page, URL https://www.kubotausa.com/notice-of-security-incident (content confirmed via bridge fetch of the underlying Next.js data payload)"
    summary: |
      Kubota North America Corporation disclosed unauthorized access to "certain network systems" between
      2026-03-16 and 2026-04-20. Per Kubota's own notice: "we identified and addressed an incident involving
      unauthorized access to certain network systems between March 16, 2026 and April 20, 2026." On 2026-04-30
      Kubota discovered that files maintained by its human-resources team had been accessed; a file review
      concluded on 2026-06-16 that the accessed files contained personal data for certain employees and their
      dependents — full names, Social Security numbers, dates of birth, taxpayer IDs, driver's-license/government
      ID numbers, direct-deposit bank account details, corporate payment-card information, and benefits enrollment
      /limited claims data. Individual notification letters went out via email starting 2026-06-30, each tailored
      to the specific data exposed per person, with Kroll identity-protection enrollment instructions. Kubota North
      America operates facilities producing tractors, mowers, and utility vehicles across a company that employs
      over 52,000 people in 120 countries. No ransomware group or extortion actor has claimed responsibility as of
      publication, and Kubota reported no operational/business disruption.
    ch_eu_nexus: "none disclosed — US subsidiary, HR/benefits data affects US-based employees and dependents"
    public_sector_nexus: "none — private-sector manufacturer"
    sector: "manufacturing, human-resources/HR-data"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "an incident involving unauthorized access to certain network systems between March 16, 2026 and April 20, 2026"
        attribution: "Kubota North America Corporation, victim notice"
        source_url: "https://www.kubotausa.com/notice-of-security-incident"
      - quote: "On April 30, 2026, we discovered that files maintained by our human resources team were accessed as part of this incident. We carefully reviewed these files, and on June 16, 2026, we determined that one or more files may have contained personal information related to certain employees"
        attribution: "Kubota North America Corporation, victim notice"
        source_url: "https://www.kubotausa.com/notice-of-security-incident"
    extended_notes: |
      Operational lesson: the timeline shows a roughly 10-day gap between the end of unauthorized access
      (2026-04-20) and discovery that HR files were touched (2026-04-30), then a further ~7-week gap before the
      file-content review concluded which individuals were affected (2026-06-16) and notifications went out
      (2026-06-30) — a ~75-day span from incident end to individual notification, illustrating the operational cost
      of post-incident file-content review (as opposed to structured data stores) when breach scoping requires
      manual/automated review of unstructured HR file shares. No technical root cause, initial-access vector, or
      vulnerable component has been disclosed by Kubota or reported by BleepingComputer; no ATT&CK mapping is
      supportable from the sourcing available.

  - title: "MedusaLocker leak site lists the Canton of Zurich's Baudirektion (bd.zh.ch) as a victim — unconfirmed dark-web claim, not corroborated by the Canton"
    sources:
      - { url: "https://www.ransomware.live/id/QmRAbWVkdXNhbG9ja2Vy", publisher: "Ransomware.live (leak-site tracker)", date: "2026-07-01", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"ransomware victim disclosure July 2 2026\") → pivot: ransomware.live recent-victims API/dashboard → primary: Ransomware.live victim page for the claimed listing, URL https://www.ransomware.live/id/QmRAbWVkdXNhbG9ja2Vy (cross-checked against Kubota/BleepingComputer-style WebSearch attempts to find independent press or a Canton statement; none found)"
    summary: |
      The MedusaLocker ransomware group's leak site added a listing on 2026-07-01T22:29 UTC for a victim named
      "Bd" with domain bd.zh.ch — the domain used by the Baudirektion (Building/Construction Directorate) of the
      Canton of Zurich, a Swiss cantonal government department. Ransomware.live's tracker records the group's own
      claim text: "Organization with 772 emails extracted. Domain: bd.zh.ch." No ransom amount, data sample, or
      press coverage has surfaced. **This is a dark-web leak-site claim only** — MedusaLocker was listed as the
      claiming group; the claim is NOT confirmed by the Canton of Zurich or any independent reporting found in this
      research window. Targeted WebSearches for a Canton Zurich statement, NCSC.ch (BACS) advisory, or Swiss press
      coverage of a Baudirektion/bd.zh.ch incident returned no results as of this run. The same MedusaLocker leak
      wave (2026-07-01, ~22:28–22:33 UTC) also listed several other European entities in immediate succession,
      including a French municipality ("Mairie Thiverval Grignon", domain mairie-thiverval-grignon.fr, "162 emails
      extracted") and organisations in Germany — consistent with a batch-style leak-site posting rather than a
      single targeted disclosure event.
    ch_eu_nexus: "direct — Swiss cantonal (Canton of Zurich) government department named on a ransomware leak site"
    public_sector_nexus: "direct — cantonal government (Baudirektion Kanton Zürich)"
    sector: "public-administration, cantonal-government"
