  - title: "CVE-2026-14439 — Altium Enterprise Server / Altium 365 Git Service: authenticated path traversal to RCE and cross-tenant data exposure"
    sources:
      - { url: "https://github.com/advisories/GHSA-m97g-7h77-r5pr", publisher: "GitHub Security Advisories (Altium)", date: "2026-07-02", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd bridge (python3 tools/fetch_source.py enisa-euvd recent criticals), URL https://euvd.enisa.europa.eu/ (structured API, EUVD-2026-41210 entry) → primary: GitHub Security Advisory, URL https://github.com/advisories/GHSA-m97g-7h77-r5pr"
    summary: |
      A path-traversal vulnerability (CWE-22, CVSS 9.4) in the Git Service component shared by Altium Enterprise
      Server and Altium 365 (electronics CAD/PCB-design collaboration platforms) allows an authenticated user
      with only basic git access to exploit a sequence of post-clone file-manipulation operations that accept
      user-supplied paths without validation. This lets an attacker move arbitrary files outside the intended
      repository directory; because the moved files can land in locations later executed by the Git Service,
      the primitive escalates to remote code execution under the Git Service account. On multi-tenant Altium
      365 SaaS deployments, the same flaw could expose data belonging to other tenants sharing the same
      infrastructure node. Altium Enterprise Server is fixed in 8.1.1; Altium 365's shared multi-tenant
      deployments have been remediated at the service level, with remediation still in progress on remaining
      Altium 365 deployments as of publication (2026-07-02). No evidence of exploitation has been reported.
    ch_eu_nexus: "Altium is widely used in European manufacturing, electronics, defense-adjacent and industrial engineering firms for PCB/CAD design collaboration"
    public_sector_nexus: "indirect — defense-industrial-base and engineering-sector supply chain relevance"
    sector: "manufacturing, defense-industrial-base, technology"
    cves: [CVE-2026-14439]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    extended_notes: |
      Low privilege bar (only "basic git access" required) combined with a path to RCE and cross-tenant SaaS
      exposure make this notable for any CH/EU manufacturing or defense-adjacent org using Altium 365's
      collaborative design-review features. Hunting focus: audit Git Service account process activity for
      file operations writing outside expected repository paths following clone operations; multi-tenant SaaS
      customers should confirm with Altium that their specific infrastructure node received the service-level
      remediation rather than assuming blanket coverage. No public PoC identified in this pass. Maps to
      T1190 (Exploit Public-Facing Application) for the initial authenticated access path and T1083/T1005-
      adjacent file-discovery-and-staging behavior once the path-traversal primitive is used.

