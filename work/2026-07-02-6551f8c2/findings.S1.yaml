        attribution: "Microsoft MSRC (CVE-2026-45659 vulnerability record)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
    extended_notes: |
      Flagged MEDIUM confidence rather than HIGH because no independent researcher write-up or press coverage
      corroborating active exploitation could be located in this pass — only the CISA KEV catalog entry itself,
      which is treated as an acceptable single-source national-authority disclosure per the verification
      carve-out. Recommend the main agent or a follow-up run check for a dedicated CISA alert page
      ("CISA Adds ... Known Exploited Vulnerability to Catalog") once transport access to cisa.gov news pages
      recovers — every attempt in this run (direct bridge fetch of both a plausible and a confirmed historical
      alert URL) returned HTTP 403, which reads as an anti-bot/rate-limit condition rather than page-not-found
      (a known-good historical alert URL 403'd identically). Detection: any SharePoint access-log or IIS log
      entries showing anomalous POST bodies against SharePoint's object-model / API endpoints tied to a low-
      privileged Site-Member session, followed by unexpected w3wp.exe child-process spawns, warrants review.
      Maps to T1190 (Exploit Public-Facing Application) and T1505.003-adjacent web-shell follow-on activity
      typical of prior SharePoint deserialization exploitation waves (ToolShell/CVE-2025-53770 lineage).

  - title: "Adobe patches seven CVSS-10.0 flaws across ColdFusion and Campaign Classic (APSB26-68 / APSB26-69) — no known exploitation yet, Priority-1 rated"
    sources:
      - { url: "https://helpx.adobe.com/security/products/coldfusion/apsb26-68.html", publisher: "Adobe PSIRT", date: "2026-06-30", role: "primary" }
      - { url: "https://helpx.adobe.com/security/products/campaign/apsb26-69.html", publisher: "Adobe PSIRT", date: "2026-06-30", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/adobe-patches-seven-max-severity-coldfusion-campaign-flaws/", publisher: "BleepingComputer", date: "2026-07-01", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0217", publisher: "NCSC-NL", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Adobe ColdFusion Campaign Classic CVSS 10.0 critical vulnerabilities July 2026\") → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/adobe-patches-seven-max-severity-coldfusion-campaign-flaws/ → primary: Adobe PSIRT, URL https://helpx.adobe.com/security/products/coldfusion/apsb26-68.html and https://helpx.adobe.com/security/products/campaign/apsb26-69.html → corroborating: NCSC-NL, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0217"
    summary: |
      Adobe's 2026-06-30 emergency bulletins APSB26-68 (ColdFusion) and APSB26-69 (Campaign Classic) fix twelve
      vulnerabilities total, six of them rated the maximum CVSS 10.0 in ColdFusion 2025 (≤ Update 9) and 2023
      (≤ Update 20): CVE-2026-48276 and CVE-2026-48283 (CWE-434 unrestricted dangerous file-type upload → RCE),
      CVE-2026-48277, CVE-2026-48281 and CVE-2026-48316 (CWE-20 improper input validation → RCE), and
      CVE-2026-48282 (CWE-22 path traversal → RCE). All six require no authentication and no user interaction
      and are exploitable over the network (AV:N/AC:L). A separate CVSS 10.0 flaw in Campaign Classic on-premises
      7.4.3 build 9396 and earlier, CVE-2026-48286 (CWE-863 incorrect authorization → arbitrary code execution),
      is fixed in build 9397; Adobe-hosted Campaign Classic instances were already remediated server-side.
      Additional ColdFusion fixes cover CVE-2026-48313/CVE-2026-48314 (path traversal → file read / privilege
      escalation, CVSS 9.3/6.5), CVE-2026-48315 (input validation → privilege escalation, CVSS 9.3),
      CVE-2026-48307 (reflected XSS, CVSS 8.8) and CVE-2026-48285 (SSRF → security bypass, CVSS 8.6). Every
      CVE is rated Adobe Priority 1 ("high risk of being targeted"), but Adobe states it is not aware of any
      exploitation in the wild as of publication. Patched in ColdFusion 2025 Update 10 and ColdFusion 2023
      Update 21.
    ch_eu_nexus: "on-prem ColdFusion and Campaign Classic deployments are common in EU/CH public-sector web portals and marketing-automation stacks"
    public_sector_nexus: "direct — ColdFusion has a long history as an internet-facing public-sector web-application platform"
    sector: "public administration, marketing/e-commerce, cross-sector"
    cves: [CVE-2026-48276, CVE-2026-48277, CVE-2026-48281, CVE-2026-48282, CVE-2026-48283, CVE-2026-48316, CVE-2026-48286, CVE-2026-48313, CVE-2026-48314, CVE-2026-48315, CVE-2026-48307, CVE-2026-48285]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Adobe is not aware of any exploits in the wild for any of the issues addressed in these updates."
        attribution: "Adobe PSIRT (APSB26-68)"
        source_url: "https://helpx.adobe.com/security/products/coldfusion/apsb26-68.html"
    extended_notes: |
      No PoC or ITW evidence yet, but the combination of unauthenticated network-reachable file-upload and
      path-traversal RCE primitives on a historically high-value internet-facing platform (ColdFusion's prior
      CVEs have repeatedly seen rapid weaponisation, e.g. 2023's HelloKitty/2025's CL0P-adjacent campaigns)
      makes this a same-week patch priority even absent confirmed exploitation. Detection/hunt guidance:
      review ColdFusion upload directories (`cf_scripts`, `CFIDE`, admin upload paths) for newly written
      `.jsp`/`.cfm`/`.cfc` files outside expected deployment windows; monitor for anomalous outbound requests
      from the ColdFusion service account consistent with SSRF probing (CVE-2026-48285); Campaign Classic
      admins should audit any recent unauthorized role/authorization changes consistent with CWE-863 abuse.

