    summary: |
      UPDATE (originally covered 2026-06-30 as a fresh watchTowr disclosure): eSentire's Threat Response Unit
      reports that in-the-wild exploitation attempts against CVE-2026-8037 (Progress Kemp LoadMaster pre-auth
      OS command injection via the uninitialized-heap `escape_quotes()` bug reachable through the `/accessv2`
      API endpoint, CVSS 9.6-9.8) began 2026-06-29 — the same day a public proof-of-concept was released,
      confirming the compressed disclosure-to-exploitation timeline (PoC → active probing within hours). TRU's
      MDR-for-Network detections and threat hunts identified the attempts but found the exploitation itself
      unsuccessful in the cases observed, with no post-compromise activity. eSentire assesses that public PoC
      availability plus detailed technical write-ups (e.g. watchTowr Labs' original analysis) will drive
      continued and likely more successful attacks in the near term. Affected versions remain LoadMaster
      7.2.63.1 and earlier (GA) and 7.2.54.17 and earlier (LTSF); Progress shipped patched firmware in early
      June 2026.
