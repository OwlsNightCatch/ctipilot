  - title: "Argo CD repo-server unauthenticated RCE — no CVE assigned, unpatched 18 months after disclosure (Synacktiv)"
    sources:
      - { url: "https://www.synacktiv.com/en/publications/caught-in-the-octopus-trap-unauthenticated-rce-in-argo-cd-with-codeql", publisher: "Synacktiv", date: "2026-07-01", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/unpatched-argo-cd-repo-server-flaw.html", publisher: "The Hacker News", date: "2026-07-01", role: "corroborating" }
      - { url: "https://github.com/argoproj/argo-cd/security/advisories/GHSA-786q-9hcg-v9ff", publisher: "GitHub Security Advisories (argoproj/argo-cd)", date: "unknown", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Argo CD repo-server vulnerability Kubernetes cluster takeover CVE\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/unpatched-argo-cd-repo-server-flaw.html → primary: Synacktiv, URL https://www.synacktiv.com/en/publications/caught-in-the-octopus-trap-unauthenticated-rce-in-argo-cd-with-codeql"
    summary: |
      Synacktiv used custom CodeQL queries to find an unauthenticated remote code execution path in Argo CD's
      repo-server component, reported to the Argo CD maintainers in January 2025 and still unpatched as of
      publication (2026-07-01) — no CVE has been assigned. The vulnerable surface is the internal gRPC service
      `repository.RepoServerService/GenerateManifest`, which accepts a user-controlled `KustomizeOptions.BuildOptions`
      field with no authentication check. An attacker who can reach the repo-server's gRPC port (default internal,
      but frequently reachable from any pod in flat/default Kubernetes network configurations) can inject a
      `--enable-helm --helm-command <script>` flag into the kustomize build invocation (kustomize.go), causing
      the repo-server to execute an arbitrary attacker-supplied binary from an attacker-controlled Git repository
      instead of the legitimate `helm` binary. Because Argo CD's Helm chart does not enable Kubernetes
      NetworkPolicies by default (manifests exist under `manifests/base/repo-server/argocd-repo-server-network-policy.yaml`
      but are opt-in), most Helm-based deployments expose this port to any workload in the cluster. Once code
      execution on repo-server is achieved, the attacker can read the Redis password from the pod's environment,
      connect to Argo CD's unauthenticated-by-default Redis cache, and poison cached deployment manifests so the
      next GitOps sync deploys an attacker-supplied workload — a full path from network-reachable-but-unauthenticated
      to cluster-wide compromise. No official Argo CD patch or CVE acknowledgment exists at publication time despite
      "numerous follow-ups via GitHub and email" from the researchers.
    ch_eu_nexus: "global; Argo CD is the dominant open-source GitOps continuous-delivery controller across EU/CH public-sector and enterprise Kubernetes estates"
    public_sector_nexus: "indirect — any org running self-managed Kubernetes/GitOps pipelines"
    sector: "technology, cross-sector (any Kubernetes/GitOps user)"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Despite our ongoing efforts to establish communication and coordinate a fix, including numerous follow-ups via GitHub and email, the vulnerability remains unpatched."
        attribution: "Synacktiv"
        source_url: "https://www.synacktiv.com/en/publications/caught-in-the-octopus-trap-unauthenticated-rce-in-argo-cd-with-codeql"
    extended_notes: |
      Detection/hardening for defenders: enforce the repo-server + Redis NetworkPolicies shipped in the Argo CD
      manifests (deny-by-default ingress to repo-server and redis pods, allow only from application-controller/
      server/repo-server components); Helm-chart users must explicitly enable `networkPolicy.create=true` since
      the chart ships it disabled. Detection: monitor repo-server pod logs for `GenerateManifest` gRPC calls
      carrying unexpected `KustomizeOptions` / `helm-command` build-option strings; watch for repo-server process
      trees spawning unexpected child binaries (Sysmon-equivalent / container runtime process-exec auditing)
      rather than the expected `helm`/`kustomize` binaries. Maps to T1190 (Exploit Public-Facing Application, if
      repo-server is reachable beyond the cluster), T1059 (Command and Scripting Interpreter via the injected
      binary), and T1552.001 (Credentials in Files/environment variables, for the Redis-password read).

  - title: "CVE-2026-45659 — Microsoft SharePoint deserialization RCE added to CISA KEV two months after patch, tight 3-day remediation window"
    sources:
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA (Known Exploited Vulnerabilities catalog, primary data feed)", date: "2026-07-01", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659", publisher: "Microsoft MSRC", date: "2026-05-21 (patch); catalog data queried 2026-07-02", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev), URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json → primary (CISA's own catalog is the disclosing authority for this addition; corroborated against Microsoft's own MSRC vulnerability record via bridge msrc cve CVE-2026-45659)"
    summary: |
      CISA added CVE-2026-45659 (Microsoft SharePoint Server deserialization-of-untrusted-data RCE, CVSS 8.8,
      CWE-502) to its Known Exploited Vulnerabilities catalog on 2026-07-01 with an unusually tight federal
      remediation deadline of 2026-07-04 (three days), per BOD 26-04. The flaw allows any authenticated attacker
      holding a minimum of Site Member permissions to achieve remote code execution on the SharePoint Server
      backend with no additional user interaction. Notably, Microsoft's own MSRC record still rates the CVE
      "Exploitation Less Likely" and "exploited: No" as of this run, and the fix already shipped quietly in
      May 2026 (the CVE was "inadvertently omitted from the May 2026 Security Updates" and only formally
      published 2026-05-21/26) — meaning CISA's KEV addition six weeks after the patch shipped is the first
      public confirmation that this deserialization path is now under active exploitation, despite the vendor's
      original risk assessment. No independent research write-up or news outlet had picked up the KEV addition
      at the time of this research pass (confirmed via direct CISA alert-page fetch attempts, which 403'd, and
      via WebSearch, which surfaced no dedicated news coverage yet) — defenders should treat the KEV entry itself
      as the authoritative, if still thinly corroborated, exploitation signal.
    ch_eu_nexus: "global; on-premises SharePoint Server 2016/2019/Subscription Edition is common in Swiss/EU public-sector and enterprise environments"
    public_sector_nexus: "direct — on-prem SharePoint is a frequent public-sector document/collaboration platform"
