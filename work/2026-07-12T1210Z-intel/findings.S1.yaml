  Notable false lead investigated and DROPPED (documented for the audit
  trail and as a process lesson — see self-evolution note below): VulnCheck's
  advisory feed listed several Flowise and Crawl4AI CVEs "dated 7/12/2026"
  (CVE-2026-56271 Flowise hardcoded-JWT auth bypass, CVE-2026-56259/56260/
  56265 Crawl4AI Docker-API-server SSRF/file-write/credential-exfiltration/
  hardcoded-JWT cluster), and NVD's own "Published" field for these CVE
  records likewise shows 2026-07-12. On drilling to the actual GitHub
  Security Advisories that are the CVEs' primary source, the true vendor
  disclosure dates are materially older: GHSA-cc4f-hjpj-g9p8 (Flowise) traces
  to a mirror dated ~2026-04-16; GHSA-365w-hqf6-vxfg (Crawl4AI multi-vuln,
  fixed in 0.8.7) published 2026-06-02; GHSA-f989-c77f-r2cq (Crawl4AI
  credential exfiltration, fixed in 0.8.8) published by the maintainer
  2026-06-04 (confirmed by fetching the GHSA page directly — "unclecode
  published GHSA-f989-c77f-r2cq Jun 4, 2026"). NVD/VulnCheck simply
  assigned/catalogued the CVE records over a month later; no fresh
  development, no new exploitation signal, no update to the advisories
  in-window. Per recency discipline (source publication date, not CVE
  catalog timestamp, gates inclusion) this is recycled news and was
  correctly dropped rather than reported as new S1 signal.

  Self-evolution note for prompts/docs: NVD "Published" and vendor-advisory-
  aggregator "date" fields (VulnCheck advisory pages, in this case) can lag
  the true vendor/GHSA disclosure date by many weeks — sometimes appearing
  to publish "today." Before treating any NVD-fresh or aggregator-fresh CVE
  as in-window signal, pivot to the actual GitHub Security Advisory (or
  equivalent primary vendor advisory) and read its own "published" timestamp
  before deciding recency. This is a variant of the existing "check the
  original event date" guidance and is worth calling out explicitly for
  vulnerability-focused sub-agents (S1) since NVD/VulnCheck timestamp lag is
  a systematic, recurring trap distinct from ordinary news-recycling.

