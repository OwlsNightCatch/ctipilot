  - title: "Dutch DPA: cyberattack-driven data breaches rose 58% in 2025 as AI phishing kits shift phishing from a consequence of breaches to their leading cause"
    sources:
      - { url: "https://www.autoriteitpersoonsgegevens.nl/en/current/ai-increases-the-risks-of-cyberattacks", publisher: "Autoriteit Persoonsgegevens (Dutch DPA)", date: "2026-07-08", role: "primary" }
      - { url: "https://www.autoriteitpersoonsgegevens.nl/en/documents/report-data-breaches-2025", publisher: "Autoriteit Persoonsgegevens (Dutch DPA)", date: "2026-07-08", role: "primary" }
      - { url: "https://www.techtimes.com/articles/320084/20260710/ai-phishing-kits-drove-58-breach-surge-dutch-authority-warns-businesses.htm", publisher: "Tech Times", date: "2026-07-10", role: "corroborating" }
    discovery_trace: >
      first seen at: Tech Times (sibling link inside the NIS2 CJEU referral article), URL
      https://www.techtimes.com/articles/320084/20260710/ai-phishing-kits-drove-58-breach-surge-dutch-authority-warns-businesses.htm →
      pivot: WebSearch ("Autoriteit Persoonsgegevens Datalekkenrapportage 2025 juli 2026") →
      primary: Autoriteit Persoonsgegevens (Dutch data protection authority), URL
      https://www.autoriteitpersoonsgegevens.nl/en/current/ai-increases-the-risks-of-cyberattacks
    summary: |
      The Dutch data protection authority (Autoriteit Persoonsgegevens, AP) published its Rapportage datalekken 2025 (~8 July 2026), recording 39,407 total GDPR breach notifications in 2025 (37,839 in 2024). Within that total, cyberattack-driven breaches reached 2,428 (up 58% from ~1,500 in 2024); account-takeover incidents specifically rose from 607 in 2024 to 1,742 in 2025 — a near-threefold increase. The AP's structural finding, stated as regulatory guidance rather than a mere observation: phishing has flipped from being primarily a downstream consequence of breaches to being their upstream cause — a stolen credential from an AI-crafted lure now routinely launches the larger organisational intrusion, not just monetises an existing one. The AP names two drivers: (1) LLM-generated phishing content that eliminates the grammar/formatting tells legacy filters and security-awareness training rely on, personalised using data harvested from prior breaches (name, employer, bank); (2) commoditised "phishing kits" traded openly online, an increasing share of which bundle adversary-in-the-middle (AiTM) functionality that intercepts the live session between victim and legitimate site, capturing both password and one-time code and thereby defeating standard (SMS/push) MFA. The AP explicitly frames the resulting loop — AI phishing produces takeovers, takeover data feeds better AI phishing — as a flywheel it expects to accelerate. A single named case illustrates supply-chain concentration risk: a 2024 ransomware attack on AddComm, a Dutch customer-communications/document-distribution processor used by banks (including ABN Amro) and utilities, generated 5,407 separate downstream GDPR breach notifications in 2025 alone as every client organisation that had routed personal data through AddComm filed its own notification.
      Defensive guidance stated by the AP: migrate MFA to phishing-resistant FIDO2/WebAuthn (hardware keys or platform passkeys) since SMS and push-based OTP remain interceptable by AiTM kits; deploy behavioural/anomaly-based account-takeover detection (unusual login times, atypical geography, post-authentication behavioural deviation) rather than relying on inbox-level content filtering tuned to pre-AI phishing; formally reassess Article 32 GDPR "appropriate technical measures" against the current AI-assisted threat model, since a 2022-era compliance baseline no longer reflects it; and audit third-party/data-processor exposure given the AddComm cascade. Non-compliant essential/important entities face GDPR fines up to €10M/2% global turnover (up to €20M/4% for core-principle breaches) — a live enforcement lever the AP states it will use. Directly relevant to Swiss public-sector and regulated entities that process EU personal data or route it through EU-based processors, and a useful comparator for BACS/NCSC-CH's own incident statistics.
    region_nexus: "Netherlands (EU); directly relevant to any organisation — including Swiss public-sector and finance/healthcare entities — processing EU personal data or using EU-based data processors, given GDPR's extraterritorial reach"
