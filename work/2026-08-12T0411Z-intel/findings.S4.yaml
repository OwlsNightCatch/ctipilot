  - title: "N-able N-central authentication-bypass patch bypass turns MSPs into a ransomware supply chain — Storm-1175 deploys new StormEncryptor strain within hours of disclosure"
    sources:
      - { url: "https://therecord.media/china-hackers-ransomware-microsoft", publisher: "The Record (Recorded Future News)", date: "2026-08-10", role: primary }
      - { url: "https://www.n-able.com/blog/n-central-security-update-august-6-2026", publisher: "N-able (vendor incident disclosure)", date: "2026-08-10", role: primary }
      - { url: "https://www.huntress.com/blog/n-able-vulnerability-exploitation", publisher: "Huntress", date: "2026-08-03 (updated through 2026-08-06)", role: primary }
      - { url: "https://thehackernews.com/2026/08/china-linked-hackers-deploy-new.html", publisher: "The Hacker News", date: "2026-08-10", role: corroborating }
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/04/06/storm-1175-focuses-gaze-on-vulnerable-web-facing-assets-in-high-tempo-medusa-ransomware-operations/", publisher: "Microsoft Security Blog", date: "2026-04-06", role: corroborating (actor background) }
      - { url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", publisher: "CISA KEV Catalog", date: "dateAdded 2026-08-03 (CVE-2026-18577) / 2026-08-04 (CVE-2026-18556)", role: corroborating }
    discovery_trace: >
      first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, headline
      "China-linked hackers turning popular cybersecurity tool into ransomware launchpad, Microsoft warns") →
      WebSearch ("China-linked hackers turning popular cybersecurity tool into ransomware launchpad Microsoft
      warns") → primary: The Record, URL https://therecord.media/china-hackers-ransomware-microsoft → pivot:
      N-able's own incident-disclosure blog, URL https://www.n-able.com/blog/n-central-security-update-august-6-2026
      → pivot: Huntress independent technical analysis, URL https://www.huntress.com/blog/n-able-vulnerability-exploitation
      → corroboration: The Hacker News, URL https://thehackernews.com/2026/08/china-linked-hackers-deploy-new.html
      → background: Microsoft's April 2026 Storm-1175/Medusa profile, URL https://www.microsoft.com/en-us/security/blog/2026/04/06/storm-1175-focuses-gaze-on-vulnerable-web-facing-assets-in-high-tempo-medusa-ransomware-operations/
      → cross-check: CISA KEV catalog entries for CVE-2026-18556/CVE-2026-18577 (fetched via tools/fetch_source.py cisa-kev).
    summary: |
      N-able's own Adlumin MDR telemetry caught a threat actor exploiting a previously unknown, unauthenticated
      remote-admin-access flaw in N-central (its RMM/PSA platform for MSPs) on 31 July 2026. N-able registered
      CVE-2026-18556 and shipped Hotfix 1 (2026.3.1.7) on 2 August; continued monitoring on 6 August surfaced a
      related attack path that bypassed Hotfix 1 — registered as CVE-2026-18577, a "patch bypass" per both N-able
      and Huntress — and N-able shipped Hotfix 2 (2026.3.1.10) the same day. Both CVEs carry CWE-288 (authentication
      bypass using an alternate path/channel) and are now in CISA's KEV catalog (added 2026-08-03/04, "knownRansomwareCampaignUse:
      Unknown" — the KEV tag has not yet caught up with the ransomware reporting below). Per N-able's own account,
      the attacker used the flaw to obtain remote administrative access without authentication, then abused
      N-central's built-in "Take Control" feature to pivot into every managed endpoint reachable from the compromised
      server, and registered Cloudflare tunnel services on those endpoints as a persistence mechanism that survived
      revocation of N-central access itself. Microsoft Threat Intelligence separately reported that Storm-1175 — a
      financially motivated actor Microsoft and other outlets describe as China-linked, previously known for
      high-tempo Medusa ransomware campaigns exploiting N-day/zero-day flaws in internet-facing software (Mirth
      Connect, ConnectWise ScreenConnect, JetBrains TeamCity, Fortinet FortiClient EMS, Fortra GoAnywhere) — began
      deploying a new, previously undocumented ransomware strain, StormEncryptor, on 2 August: the same day Hotfix 1
      and CVE-2026-18577 were registered, indicating the actor moved from disclosure to weaponisation within hours.
      StormEncryptor is written in C++, appends the extension ".encrypted", and drops a ransom note named
      "!!!README_FIRST!!!.txt" in every scanned directory. Post-compromise the group used AnyDesk and SimpleHelp
      (legitimate RMM tools) for continued access, Advanced IP Scanner for network reconnaissance, and Mimikatz for
      LSASS credential dumping, moving from initial access to encryption in days or, per Microsoft's characterisation
      of the actor's historical tempo, as little as 24 hours. Huntress's independent telemetry (as of 3 August)
      showed roughly 55.6% of reachable cloud-hosted N-central instances and 28.6% of self-hosted instances still
      unpatched hours after disclosure, and documented reconnaissance targeting domain controllers as the priority
      post-compromise objective. Named confirmed victim sectors are healthcare, professional services and finance
      in Australia, the UK and the US; N-able states "a limited number of customers" were impacted and that it has
      engaged each directly, but stresses its investigation is ongoing and that patching alone "does not remove a
      threat actor who may already be present."
    region_nexus: "global; N-central is deployed by MSPs serving European and Swiss public-sector and critical-infrastructure clients — the mechanism (one compromised RMM server cascades into every downstream managed endpoint) is the Kaseya-2021 supply-chain pattern replayed on a different platform"
    primary_sector_nexus: "indirect (MSP/RMM supply chain touching all sectors, incl. public-sector clients of affected MSPs)"
    sector: "public-sector, healthcare, finance, technology (MSP/RMM supply chain)"
    cves: [CVE-2026-18556, CVE-2026-18577]
    techniques: [T1190, T1219, T1003.001, T1046, T1572, T1486]
