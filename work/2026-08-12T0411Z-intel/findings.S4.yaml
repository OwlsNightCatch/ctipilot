      to fully rebuild rather than restore-and-trust is the notable operational signal — worth surfacing as the
      hardening takeaway (assume persistence beyond the encrypted estate; rebuild critical identity/AD infrastructure
      rather than restoring domain controllers from backup after ransomware with suspected data theft).

  - title: "Wesco confirms a CRM data-exfiltration incident after ExfilSquad's claim — but disputes scope, finds no ransomware, as the group's leak-site list widens past government portals into private-sector Dynamics 365/CRM environments"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/", publisher: "BleepingComputer", date: "2026-08-11", role: primary }
      - { url: "https://www.resecurity.com/blog/article/exfilsquad-targets-new-victims-shares-data-via-torrents", publisher: "Resecurity", date: "2026-08-07", role: corroborating }
    discovery_trace: >
      first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) →
      WebSearch ("Wesco confirms security incident ExfilSquad data theft") → primary:
      https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/
      → pivot for access-vector context: Resecurity's earlier ExfilSquad victim-list research, URL
      https://www.resecurity.com/blog/article/exfilsquad-targets-new-victims-shares-data-via-torrents
      (already covered by this pipeline's 2026-07-31 ExfilSquad/DfE/PNLD entry — this item reports the delta only).
    summary: |
      Wesco International — a Fortune-500 US industrial/electrical distributor (~21,000 employees) — confirmed to
      BleepingComputer on 11 August that it is investigating a security incident after the extortion brand
      ExfilSquad (already tracked by this pipeline for its confirmed July 2026 breach of the UK Department for
      Education's public portals and the Police National Legal Database) claimed to have stolen 2.6 million records
      from Wesco's cloud CRM environment — customer/employee PII, account and contact data, CRM user profiles,
      business identifiers and authentication metadata. Wesco's own statement, via VP of Corporate Communications
      Jennifer Sniderman, confirms a claim of "CRM data exfiltration by a third party" exists but disputes its
      severity: the company says it found no evidence of ransomware or other malware on its IT systems, does not
      believe payment-card, financial-account or other sensitive customer/employee data is at risk, and reports no
      business disruption. This is the first ExfilSquad-claimed victim in this pipeline's tracking to give an
      on-record statement that concedes an incident occurred while directly contesting the leak site's own scale and
      severity framing — earlier confirmed cases (UK DfE, PNLD) were full government confirmations; most of
      ExfilSquad's other ~13 claimed victims (Resecurity, 2026-08-07 — including Allstate, Frontier Airlines,
      District of Columbia Public Schools, City of Houston, City of Atlanta and the Swedish/Nordic developer Bonava)
      remain unconfirmed leak-site listings only. Resecurity's research ties ExfilSquad's mechanism to misconfigured
      Microsoft Power Pages data tables with anonymous read/write access; Wesco is publicly known to use Microsoft
      Dynamics 365, so researchers (per BleepingComputer's reporting) assess — without confirmation from Wesco
      itself, which has not disclosed its own access vector — that the group's targeting has widened from
      Power-Pages-portal misconfiguration specifically into the broader class of exposed Dynamics 365/Power Platform
      CRM data surfaces.
    region_nexus: "actor already confirmed targeting UK central government (DfE, Police National Legal Database); this delta shows the same actor's campaign widening into private-sector CRM/Dynamics 365 environments, a technology base equally present in European public-sector and CI operators"
    primary_sector_nexus: "indirect (delta on an actor with a direct, already-confirmed UK-government nexus)"
    sector: "public-sector, technology, industrial/distribution"
    cves: []
    techniques: [T1213]
    affected_products: ["Microsoft Dynamics 365", "Microsoft Power Pages"]
    entity_keys: [actor:exfilsquad, incident:uk-dfe-exfilsquad-breach-2026-07]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-07-31/exfilsquad-uk-department-for-education-pnld-breach"
    evidence:
      - quote: "We have worked with our cloud CRM vendor on the matter, and we do not believe that there is a risk to sensitive data."
        attribution: "Jennifer Sniderman, Wesco VP Corporate Communications"
        source_url: "https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/"
      - quote: "found no evidence of ransomware or other malicious software on its IT systems"
        attribution: "Wesco (per BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/"
      - quote: "has targeted in the past improperly configured Microsoft Power Pages data tables"
        attribution: "Resecurity / VenariX (per BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/"
    extended_notes: |
      Held to MEDIUM confidence because the access-vector claim (Dynamics 365) is a researcher inference from public
      technology-stack information, not a Wesco-confirmed root cause, and Wesco directly disputes ExfilSquad's own
      scale claim (2.6M records) without offering its own figure. Framed as an update on the tracked ExfilSquad
      actor/campaign entity rather than a new incident entity, per the run's dedup instruction that this campaign
      needs a genuine delta — the delta here is Wesco's on-record partial-confirmation/dispute posture and the
      Dynamics-365-vs-Power-Pages technical widening, neither of which was in the original 2026-07-31 entry.

