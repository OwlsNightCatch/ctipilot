      - { key: "tool:stormencryptor", type: tool, name: "StormEncryptor", aliases: [],
          summary: "C++ ransomware payload first deployed by Storm-1175 on 2026-08-02; appends the '.encrypted' extension and drops a ransom note named '!!!README_FIRST!!!.txt' in every scanned directory (Microsoft Threat Intelligence via The Hacker News, 2026-08-10). Marks the actor's first observed departure from its long-standing Medusa RaaS tooling."
    relation_suggestions:
      - { subject: "actor:storm-1175", object: "tool:stormencryptor",
          basis: "Microsoft Threat Intelligence: Storm-1175 began deploying the StormEncryptor ransomware strain on 2026-08-02, its first observed operation since April 2026 and a shift from its prior Medusa tooling (The Record / The Hacker News, 2026-08-10)" }
