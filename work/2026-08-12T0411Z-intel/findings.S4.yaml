      - quote: "StormEncryptor is written in C++ and appends the file name extension .encrypted to files it encrypts. It then drops a ransom note named !!!README_FIRST!!!.txt to every scanned directory."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://thehackernews.com/2026/08/china-linked-hackers-deploy-new.html"
      - quote: "Storm-1175 rapidly moves from initial access to data exfiltration and deployment of Medusa ransomware, often within a few days and, in some cases, within 24 hours."
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/04/06/storm-1175-focuses-gaze-on-vulnerable-web-facing-assets-in-high-tempo-medusa-ransomware-operations/"
    extended_notes: |
      Timing note: N-able's own incident-disclosure post carries a "Published Time" metadata field of
      2026-08-10T00:22:07+01:00 (i.e. shortly before this run's strict 26h window opens at 2026-08-11T02:11Z), and
      The Record / The Hacker News pieces are also dated 2026-08-10. This is included under the run's
      developing_window_hours: 72 allowance as a fast-moving, multi-day supply-chain incident (detection 31 Jul →
      Hotfix 1 + CVE-2026-18556 on 2 Aug → StormEncryptor deployment same day → Hotfix 1 bypass + Hotfix 2 +
      CVE-2026-18577 on 6 Aug → wide press coverage and CISA KEV addition by 10-11 Aug), not a single-day story
      whose freshest coverage happens to sit just outside the tight window. No fresher (11-12 Aug) follow-on
      reporting was found despite a targeted search; if the main agent's own window arithmetic disagrees, this item
      should be held for the next run rather than dropped outright, since the underlying incident is still active
      (N-able states its investigation "remains active and ongoing").
      Detection/hunt hooks from Huntress: default remote-session account "mspsupport@n-able.com" / "MSP Support"
      appearing in Take Control session logs; Windows Event IDs 4102, 8192, 8193 around session login/Take-Control
      activity; log artefacts at C:\ProgramData\GetSupportService_N-Central\Logs\BASupSrvc_*.log.gz; reconnaissance
      prioritising domain controllers before lateral movement. Benign-lookalike note: Take Control sessions are
      routine MSP activity — the discriminator Huntress uses is the account identity (default/unfamiliar account
      rather than a named technician) combined with immediate post-session process-listing/recon commands rather
      than a ticket-linked support action.

  - title: "German public heritage foundation running the Sachsenhausen and Ravensbrück memorial sites confirms ransomware attack across all seven sites — root cause undisclosed"
    sources:
      - { url: "https://www.stiftung-bg.de/presse/presseinformationen/42-26-die-stiftung-wurde-opfer-eines-ransomware-angriffs/", publisher: "Stiftung Brandenburgische Gedenkstätten (victim's own press release)", date: "2026-08-11", role: primary }
      - { url: "https://www.heise.de/news/Brandenburg-Cyberangriff-legt-IT-System-der-Gedenkstaetten-lahm-11410695.html", publisher: "heise online", date: "2026-08-11", role: corroborating }
    discovery_trace: >
      first seen at: heise-security, URL https://www.heise.de/security/ (listing) → drilled to
      https://www.heise.de/news/Brandenburg-Cyberangriff-legt-IT-System-der-Gedenkstaetten-lahm-11410695.html →
      primary: the foundation's own press release, URL
      https://www.stiftung-bg.de/presse/presseinformationen/42-26-die-stiftung-wurde-opfer-eines-ransomware-angriffs/
      (linked from the heise article).
    summary: |
      The Stiftung Brandenburgische Gedenkstätten — a German public-law foundation, funded by the Brandenburg state
      science/culture ministry and the federal government's culture-and-media commissioner, which operates seven
      memorial sites including the Sachsenhausen and Ravensbrück former concentration-camp memorials — disclosed in
      its own press release (No. 42/2026, dated 11 August) that it was hit by a ransomware attack detected on 5
      August 2026. Attackers penetrated the internal IT systems, encrypted parts of the IT systems and data with
      dedicated software, and left a ransom note demanding payment for decryption — the foundation states it "must
      currently assume that data was downloaded by the attackers" before encryption. All seven memorial-site
      locations and the central business office are affected; the foundation's IT department disconnected all
      internet and network connections immediately and is rebuilding IT systems from scratch (rather than restoring
      from potentially compromised backups) specifically to deny the attacker's re-entry, working with a BSI-recommended
      external incident-response provider conducting forensic analysis. The foundation reported the incident to the
      police (Zentrale Ansprechstelle Cybercrime at the Brandenburg state police) and filed a timely breach
      notification with the Brandenburg state data-protection authority. No threat actor or ransomware family is
      named in either the primary statement or heise's corroborating report, no leak-site listing has surfaced, and
      neither source states an initial-access vector. Physical visits to the memorial sites continue unaffected;
      booking delays for educational programmes are expected while systems are rebuilt.
    region_nexus: "Germany (federal-culture-funded, state-of-Brandenburg public foundation) — direct home-region/EU public-sector nexus"
    primary_sector_nexus: "direct (public-sector cultural/heritage institution funded by state and federal government)"
