      role-elevation via a client-controlled account field) is a concrete, actionable pattern worth a detection/
      hardening note regardless of whether this specific claim proves out, and (b) the target class (a national
      public-health agency) sits inside this deployment's core constituency. Recommend the main agent either
      drop this pending confirmation or publish with heavy hedging (claim attributed throughout to Cybernox /
      Cyberattaque.org, never stated as a confirmed SPF breach) and revisit if Santé publique France or a
      national authority (CNIL, ANSSI/CERT-FR) issues a statement.
