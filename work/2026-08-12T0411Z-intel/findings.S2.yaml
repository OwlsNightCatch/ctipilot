  - title: "Cybercrime handle 'Cybernox' claims a broken-access-control breach of a Santé publique France platform (~80,000 records) — unconfirmed by the agency"
    sources:
      - { url: "https://www.cyberattaque.org/sante-publique-france-pres-de-80-000-personnes-exposees-apres-une-faille/", publisher: "Cyberattaque.org", date: "2026-08-11", role: "primary (relays unconfirmed claim)" }
      - { url: "https://www.zataz.com/cybernox-multiplie-les-revendications-de-fuites-en-france/", publisher: "ZATAZ", date: "2026-08-07", role: "corroborating (actor track-record context)" }
    discovery_trace: "first seen at: cyberattaque.org RSS feed, URL https://www.cyberattaque.org/feed/ (item published 2026-08-11T18:49:09Z) → primary: Cyberattaque.org, URL https://www.cyberattaque.org/sante-publique-france-pres-de-80-000-personnes-exposees-apres-une-faille/ → pivot: WebSearch (\"Santé publique France cyberattaque faille données août 2026\") found no independent corroboration beyond re-syndication of the same claim → pivot: WebSearch (\"'Santé publique France' Cybernox fuite données 80000\") surfaced the claimed actor's handle and led to ZATAZ, URL https://www.zataz.com/cybernox-multiplie-les-revendications-de-fuites-en-france/ (fetched via bridge, published 2026-08-07, does not itself name Santé publique France but documents Cybernox's pattern of multiplying leak claims in France since March 2026)."
    summary: |
      A threat actor using the handle "Cybernox" claimed on 2026-08-11 to have breached a platform associated
      with Santé publique France (the French national public-health agency) and exposed records on roughly
      80,000 people — names, addresses, phone numbers, emails, affiliated organizations and professional
      categories. Per Cyberattaque.org's reporting of the claim, the described mechanism is a server-side
      authorization flaw: the application accepted a client-supplied modification to the requester's own account
      role without adequately verifying the requester held the necessary permission, letting the actor escalate
      their own account to an administrative role and then use a built-in user-export function to exfiltrate data
      in bulk — a mass-assignment / broken-function-level-authorization pattern (CWE-863/OWASP API5 Broken
      Function Level Authorization) rather than a stolen-credential or phishing vector. Cyberattaque.org's own
      framing is explicit that this is "a claimed cyberattack, not yet officially confirmed by Santé publique
      France" as of publication. Cybernox is a handle first observed on cybercrime forums in March 2026 with a
      documented pattern (per ZATAZ, 2026-08-07) of "multiplying" French data-leak claims; no independent
      technical validation, victim confirmation, or high-reliability-outlet corroboration of this specific claim
      was found.
