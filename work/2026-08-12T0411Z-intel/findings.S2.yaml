    discovery_trace: "first seen at: inside-it-ch RSS feed, URL https://www.inside-it.ch/rss.xml (item published 2026-08-10T13:34:57Z, title 'Datenleck in Liechtenstein durch fehlerhafte Zugriffsprüfung') → pivot: WebSearch (\"Liechtenstein Fabian Schmid VwbP Zugriffsprüfung Amt für Justiz Medienkonferenz\") surfaced the same story via three independent search passes with consistent, specific attribution → pivot: attempted direct fetch of https://www.inside-it.ch/datenleck-in-liechtenstein-durch-fehlerhafte-zugriffspruefung-20260810 via WebFetch (HTTP 403) and via `tools/fetch_source.py url` (both direct and jina-reader fallback blocked) → primary corroboration: lie:zeit online, URL https://www.lie-zeit.li/2026/08/cyberangriff-auf-das-register-der-wirtschaftlichen-berechtigten/ (a reader letter published 2026-08-11T13:49:07Z that quotes the Inside IT article verbatim and links to it) → secondary corroboration: Liechtensteiner Vaterland, URL https://www.vaterland.li/liechtenstein/politik/neue-details-zum-cyberangriff-hacker-schleusten-stundenlang-datensatz-um-datensatz-aus-dem-system-art-749313 (updated 2026-08-11T08:21Z, paywalled beyond the excerpt)."
    summary: |
      Inside IT reported on 2026-08-10 that the Liechtenstein government's Office of IT director, Fabian Schmid,
      attributed the July 2026 breach of the VwbP (Verzeichnis wirtschaftlich berechtigter Personen — the national
      beneficial-ownership register at the Amt für Justiz, already covered in this pipeline on 2026-08-04 and
      2026-08-05) to a broken object-level authorization check: an authenticated user of the register's data-entry
      portal could, under certain conditions, retrieve not only their own submitted entries but also records
      belonging to other legal entities — a horizontal-privilege-escalation / IDOR-class flaw (CWE-639/OWASP
      API3 Broken Object Property Level Authorization) layered on top of the previously-reported entry point (the
      attacker first created their own account on the VwbP recording portal, per earlier 2026-08-04 reporting).
      This is a materially new technical fact versus the pipeline's prior two entries, which had only identified
      "a possible entry point" without describing the underlying authorization logic. Separately, Inside IT's
      reporting (quoted by a lie:zeit reader letter published 2026-08-11) surfaces a third-party-risk angle: the
      VwbP application was built and is maintained by an external contractor, and per the IT office director the
      contractor bears contractual responsibility for the application's security — a governance detail relevant
      to any public-sector body relying on vendor-developed case-management/registry portals. Direct fetch of the
      Inside IT article was blocked in this run (HTTP 403 on both a direct browser-UA GET and the jina-reader
      fallback); the "faulty logic" detail is corroborated by three independent WebSearch passes returning
      consistent, specific attribution to Fabian Schmid, and its existence/date/title is confirmed via the
      publisher's own RSS feed and via direct quotation in the fetched lie:zeit article, but no single fetched
      page in this run carries the exact "faulty logic" sentence verbatim — see sourcing note.
