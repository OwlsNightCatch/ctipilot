      (fetched via `tools/fetch_source.py msrc cve CVE-2026-68820` — vendor confirms "exploited": "Yes", CVSS 3.1 7.0) →
      corroboration: CISA KEV catalog, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog
      (fetched via `tools/fetch_source.py cisa-kev` — entry added 2026-08-11, due 2026-08-25).
    summary: |
      Check Point Research reports a 2026 wave of Lazarus Group's long-running Operation Dream Job, which it
      attributes to the DPRK-nexus actor and describes as focused on the defense, aerospace and aviation
      sectors, with confirmed targeting in Western Europe (France, Germany) and India. Check Point documents
      two parallel infection chains behind fake recruiter job offers: a DLL-sideloading chain (a legitimate
      signed PDF-viewer executable side-loads a malicious `libmupdf.dll` that decrypts and launches the
      MISTPEN in-memory downloader), and a newer chain distributing "SecurityPDF" — a trojanized MuPDF-based
      PDF viewer pushed from SEO-boosted websites impersonating the company Enveil — which decrypts and runs
      an embedded payload from any opened PDF containing a hardcoded marker string, XOR-decrypted with a
      single byte key.
      According to Check Point, MISTPEN runs reconnaissance and screen-capture modules over the Microsoft
      Graph API / OneDrive C2 channel, then loads an LPE module that negotiates a GOST-CBC session key via
      Kyber/ML-KEM and deploys FudModule v3.1 — Lazarus's kernel-mode rootkit — which exploits
      CVE-2026-68820, a zero-day use-after-free race condition in the Windows Ancillary Function Driver
      (afd.sys) triggered when concurrent threads race on shared per-socket state, to obtain a kernel
      read/write primitive and SYSTEM privileges. Microsoft's own advisory confirms the vulnerability
      (CVSS 3.1 7.0, AV:L/AC:H/PR:L/UI:N — attack complexity is rated High specifically because exploitation
      requires winning the race), lists it as actively exploited, and shipped a fix on the 11 August 2026
      Patch Tuesday following Check Point's responsible disclosure (reported 28 Jul, CVE assigned 5 Aug);
      CISA added it to the KEV catalog the same day with a 25 August 2026 federal remediation deadline.
      Post-exploitation, FudModule v3.1 tears down ETW providers, process/thread/image-notify callbacks and
      minifilters (Check Point notes 94 of its 95 hardcoded ETW-kill GUIDs match, in identical order, the
      publicly documented FudModule v3 list from Gen Digital's 2024 analysis, behind a "completely
      different" novel exploit chain), and adds a new Smart App Control tampering routine that zeroes
      `VerifiedAndReputablePolicyState` via `NtSetSystemInformation` class `0xA4`. On the newer chain it
      drops a previously undocumented modular backdoor Check Point names Troy (17 operator commands over
      HTTP with a three-server failover list); the older chain drops the well-documented ForestTiger
      backdoor via MISTPEN. Check Point reports that C2 for both backdoors, plus a new PHP relay web shell
      it names RelayShell, runs through compromised Roundcube webmail, WordPress and PrestaShop servers —
      Roundcube access obtained via leaked dark-web credentials combined with exploitation of the
      already-public CVE-2025-49113 PHP deserialization bug — and that at least one compromised Western
      European organization was itself repurposed to send further spear-phishing to additional targets.
    region_nexus: "Explicit European targeting named by the source (France, Germany); a compromised Western European organization was repurposed as spear-phishing infrastructure against further targets worldwide. Defense/aerospace sector nexus is directly relevant to national-defense components of federal/cantonal government."
