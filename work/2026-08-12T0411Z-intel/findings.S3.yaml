  - title: "Lazarus's Operation Dream Job burns a zero-day in Windows AFD.sys (CVE-2026-68820) to deploy FudModule v3.1 against European defense-sector targets"
    sources:
      - { url: "https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/", publisher: "Check Point Research", date: "2026-08-11", role: primary }
