    extended_notes: |
      Detection-relevant angle: the discriminator here is not the destination (script.google.com is
      legitimate Google infrastructure that most enterprise egress policies allow) but the DNS-selection
      logic upstream of it — a host performing repeated A-record lookups against attacker-controlled
      authoritative nameservers immediately before selecting between a direct-HTTPS and a
      script.google.com-relayed connection is the pattern Kaspersky's analysis supports; this is a DNS
      telemetry / passive-DNS correlation problem more than a web-proxy one. Flagged as `update-of` the
      2026-07-22 entry that first covered this cluster's OilRig-association and DNS/AAAA C2 fallback
      behavior, since Kaspersky explicitly frames this as a continuation of the same tracked framework;
      the main agent should confirm whether an intermediate July article was already captured before
      deciding whether this is a fresh entry or a delta note. Marked SINGLE-SOURCE — only Kaspersky has
      published on this specific update; treat the OilRig association itself as still LOW-confidence per
      Kaspersky's own prior caveat, not strengthened by this article.
