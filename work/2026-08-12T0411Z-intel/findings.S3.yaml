    extended_notes: |
      Triage-relevant behavioral notes (all from Check Point's write-up, no IOCs reproduced here per
      policy): the FudModule LPE stage produces a distinctive "telemetry blackout" signature — sudden,
      near-simultaneous loss of process/thread/image-notify callback telemetry, ETW provider stop events
      across a hardcoded GUID list, and minifilter unregistration by altitude band — that is anomalous
      when it follows a non-security-vendor process (a PDF viewer, or a SYSTEM msiexec.exe spawned via the
      documented services.exe two-hop) rather than a signed security-product uninstaller; that mismatch
      between the triggering process and a legitimate AV/EDR removal is the discriminator Check Point's
      analysis supports. MISTPEN's C2 rides the Microsoft Graph API / OneDrive, so the anchor for detection
      is identity/cloud-audit telemetry (an unusual application/service principal authenticating to Graph
      from an endpoint process that does not normally call it) rather than a network signature. RelayShell
      is a web-server-side artifact: its "victim mode"/"operator mode" split and its file-based
      (`<session_id><1|2>.log`) message-passing channel means it never directly executes attacker commands
      through the web request itself, so web-log-based webshell detections tuned to look for command
      execution in the request path may miss it — the tell is repeated small POSTs against a plausible
      but non-standard file path (`.../public/js/...`-style) followed by `.ses`/`.log` file churn on the
      web root, a pattern web-access-log and file-integrity monitoring can both surface. Hardening lever:
      CVE-2026-68820 is patched in the 11 August 2026 cumulative update — prioritize per the CISA KEV
      25 August 2026 remediation deadline; separately, any organization still running a Roundcube instance
      unpatched against CVE-2025-49113 (fixed in 2025) should treat it as active C2-relay infrastructure
      risk, not just a data-exposure risk, given this campaign's specific reuse of the flaw to plant
      webshells rather than exfiltrate mail.
      Cross-domain note: CVE-2026-68820 is also this run's August Patch Tuesday zero-day and may surface
      independently via a vulnerability-kind S1 finding on the same CVE; this item is the actor/campaign
      narrative (Lazarus TTPs, malware families, C2 infrastructure) behind that same patch and should be
      composed as a threat/campaign entry cross-referencing the CVE rather than a duplicate vulnerability
      entry. IOCs (hashes, C2 domains/IPs) published in the source are intentionally omitted here per
      pipeline policy.
  - title: "Project CAV3RN's espionage C2 adds a Google Apps Script relay with DNS-based channel selection — a fourth documented iteration of a legitimate-cloud-service C2 evasion technique"
    sources:
      - { url: "https://securelist.com/project-cav3rn-continues/120991/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-08-11", role: primary }
    discovery_trace: >
      first seen at: kaspersky-securelist, URL https://securelist.com/ (listing) →
      primary: Kaspersky Securelist (GReAT), URL https://securelist.com/project-cav3rn-continues/120991/ →
      cross-check: WebSearch ("Securelist CAV3RN Google Apps Script C2") returned only derivative coverage
      (a malware.news aggregator repost and a Czech-language machine-translated news item), both tracing
      back to the same Securelist article — no independent second primary was found, so this item is
      SINGLE-SOURCE.
    summary: |
      Kaspersky's GReAT team reports a further iteration of Project CAV3RN, a modular espionage framework
      it has tracked since at least June 2026 against targets in Israel (Kaspersky attributes the framework
      to the "Cavern" cluster it separately associates, at LOW confidence, with the Iran-nexus actor OilRig
      — see entities tool:cavern-c2-framework / actor:oilrig, tracked in this pipeline since 2026-07-22).
      The newly documented core finding is a C2 module (`GoogleService.dll`, compiled with .NET 8
      NativeAOT) that queries DNS A-record responses to decide, per transaction, whether to communicate
      over direct HTTPS or relay through a Google Apps Script deployment; Kaspersky states the DNS
      infrastructure also validates and rotates the Apps Script deployment IDs used for the relay. The
      module supports five internal commands (s_version, s_config, s_enLog, s_deLog, s_write) for
      operational control. Kaspersky also documents a newly identified inter-component broker
      (`rnp.dll`) that masquerades as the legitimate RNP OpenPGP library while coordinating the
      framework's other DLL components: at startup it initializes a message dispatcher and scans the host
      directory for additional DLLs, supporting runtime component upgrades without needing a fresh
      delivery mechanism. Kaspersky frames this as a continuation of a technique trend for this cluster —
      Outlook calendar events for C2 in an earlier iteration, now Google Apps Script — explicitly
      abusing legitimate cloud services so that C2 traffic blends into normal enterprise network activity
      and evades network-based detection tuned to attacker-registered infrastructure.
    region_nexus: "Source-stated targeting is Israel; no direct Swiss/European nexus stated. The C2-evasion technique class (DNS-gated selection between direct and legitimate-cloud-service relay channels) is directly transferable to any defender's network-detection engineering, independent of region."
