    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog (bridge `cisa-kev`) → pivot: MSRC OData record, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-68820 (bridge `msrc cve CVE-2026-68820`) → pivot: WebSearch (\"actively exploited vulnerability August 11 2026\") → primary: Check Point Research, URL https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/"
    summary: |
      Microsoft's August 2026 Patch Tuesday (11 Aug) fixed roughly 400 CVEs including three that carry action beyond the routine cycle. CVE-2026-68820 (CVSS 7.0, CWE-416 Use-After-Free) is Microsoft's sole "Exploitation Detected" entry this cycle: a race condition in the Windows Ancillary Function Driver for WinSock (afd.sys) lets a locally-authenticated attacker run a specially crafted application to win a timing race and gain SYSTEM privileges; Microsoft rates it "not publicly disclosed" prior to patch. Check Point Research's own write-up (published the same day) attributes in-the-wild exploitation to the DPRK-aligned Lazarus group's "Operation Dream Job" campaign against defense/aerospace-sector targets: victims receive fake job offers (impersonating firms including Lockheed Martin and Enveil) via LinkedIn (T1566.003), are lured into downloading an encrypted ZIP containing a trojanized MuPDF-based PDF viewer ("SecurityPDF") or a legitimate application abused for DLL side-loading, which drops the lightweight in-memory downloader MISTPEN (C2 over Microsoft Graph API/OneDrive). MISTPEN progressively loads reconnaissance and persistence modules before triggering CVE-2026-68820 for kernel-mode code execution and deploying FudModule v3.1, Lazarus's signature kernel-mode rootkit used to blind EDR/AV telemetry — the same driver family previously abused via CVE-2024-38193 in earlier Lazarus intrusions. Two further Patch Tuesday entries are publicly-disclosed-but-not-yet-exploited: CVE-2026-62832 (CVSS 7.8, "LegacyHive") is a TOCTOU symlink-confusion flaw in Windows User Profile Service letting a local attacker mount another user's registry hive and gain Administrator (0patch shipped an unofficial micropatch for this on 19 July, weeks before Microsoft's official fix); CVE-2026-72971 (CVSS 5.5) is a link-following tampering flaw in the Windows Container Isolation FS Filter Driver (unionfs.sys). Post-compromise infrastructure in the Check Point report also chains a Roundcube webmail RCE (CVE-2025-49113) and a PHP webshell ("RelayShell") on compromised WordPress sites as C2 relay nodes, ultimately delivering a new modular backdoor ("Troy") supporting 17 operator commands.
    region_nexus: "global; Windows endpoints are ubiquitous across Swiss/EU federal, cantonal, and critical-infrastructure networks — Lazarus's Operation Dream Job specifically targets defense/aerospace organisations, a sector adjacent to several European government constituencies"
