    summary: |
      This is a material update to the 2026-08-09 entry on Metabase's unauthenticated SQL-injection zero-day: at the time of that entry, Metabase had disclosed active exploitation via the `/api/session/reset_password` endpoint but "no CVE identifier has been assigned." That gap is now closed. GitHub Security Advisory GHSA-vwf4-m7j8-wcjf, published 6 August 2026, formally assigns CVE-2026-72898 with CVSS v3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) and states plainly: "Metabase has confirmed active exploitation of this vulnerability." Affected version ranges are now published precisely: >=x.58.0 <x.58.23, >=x.59.0 <x.59.20, >=x.60.0 <x.60.16, >=x.61.0 <x.61.10, >=x.62.0 <x.62.8, >=x.63.0 <x.63.3, fixed in x.58.24 / x.59.21 / x.60.17 / x.61.11 / x.62.9 / x.63.5 (OSS and EE builds both affected). CISA added CVE-2026-72898 to its KEV catalog on 11 August 2026 with a 14 August remediation deadline, formalising for federal-agency risk registers a vulnerability that a purely CVE-driven vulnerability-management process previously could not surface at all. The interim workaround remains blocking the `/api/session/reset_password` endpoint if immediate patching is not possible; Metabase's own remediation guidance additionally recommends revoking all active sessions (delete rows in `core_session`), auditing API keys and administrator accounts, and rotating credentials for every connected data source after patching.
    region_nexus: "global; Metabase is a widely self-hosted open-source BI tool with adoption across public-sector analytics teams and finance-sector reporting pipelines"
