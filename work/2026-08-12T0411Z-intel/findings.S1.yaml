      afd.sys (Ancillary Function Driver for WinSock) has now been the vector for at least two Lazarus privilege-escalation zero-days: CVE-2024-38193 (patched August 2024, exploited to deploy an earlier FudModule variant, publicly analysed by Exodus Intelligence's "Windows Sockets: From Registered I/O to SYSTEM Privileges") and now CVE-2026-68820. Defenders with EDR telemetry on afd.sys-adjacent kernel callbacks or driver-load anomalies should treat repeated targeting of this driver family as a durable Lazarus TTP, not a one-off. CVE-2026-62832 ("LegacyHive") triage note: 0patch's unofficial micropatch (19 Jul 2026, https://0patch.com/blog/micropatches-available-for-legacyhive-windows-user-profile-service-elevation-of-p) pre-dates Microsoft's official fix by three weeks — estates that deployed the community patch were already covered.
