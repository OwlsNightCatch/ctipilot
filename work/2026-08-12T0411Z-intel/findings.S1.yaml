  - title: "Cisco Secure Firewall ASA/FTD Remote Access SSL VPN pre-auth denial-of-service under active exploitation (CVE-2026-20349)"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-vpn-dos-dzv4mQFF", publisher: "Cisco PSIRT", date: "2026-08-11", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/cisco-warns-of-asa-and-ftd-vpn-flaw-exploited-to-crash-devices/", publisher: "BleepingComputer", date: "2026-08-11", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog (bridge `cisa-kev`) → primary: Cisco PSIRT advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-vpn-dos-dzv4mQFF → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisco-warns-of-asa-and-ftd-vpn-flaw-exploited-to-crash-devices/"
    summary: |
      Cisco disclosed CVE-2026-20349 (CVSS 8.6) on 11 August 2026 and states its PSIRT "became aware of active exploitation of this vulnerability" the same month. The flaw is insufficient error checking when the Remote Access SSL VPN service on Secure Firewall ASA and Secure Firewall Threat Defense (FTD) parses HTTP requests: an unauthenticated, remote attacker sends a single crafted HTTP request to the SSL VPN listener and forces the device to reload, producing a denial-of-service condition. Exploitation requires no authentication or user interaction and works whenever SSL listen sockets are enabled — i.e., on any device running IKEv2 Remote Access VPN with client services, SSL VPN, or Zero Trust Network Access. Affected releases are ASA 9.16, 9.18, 9.20, 9.22, 9.23, and 9.24, and FTD 7.0, 7.2, 7.4, 7.6, 7.7, and 10.0; Cisco Secure Firewall Management Center (FMC) is not affected. Cisco has released hot fixes (e.g., ASA 9.24.1.221, FTD 10.0.0.1-2) and states there are no workarounds — the only mitigation is upgrading. Cisco has not disclosed who is exploiting the flaw or which organizations are targeted; the bug was found both during Cisco's internal testing and independently reported by researcher Valerio Brussani. CISA added the CVE to its KEV catalog on 11 August 2026 with an unusually short remediation deadline (14 August).
    region_nexus: "global; Cisco Secure Firewall ASA/FTD is a widely deployed VPN/perimeter gateway across Swiss and EU government, energy, healthcare, and finance-sector remote-access infrastructure"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, healthcare, finance, telco"
    cves: ["CVE-2026-20349"]
