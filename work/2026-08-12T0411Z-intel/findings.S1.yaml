    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12839 (bridge `ncsc-csh recent 40`) → primary: SAP Security Patch Day, URL https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html → corroboration: CERT-FR CERTFR-2026-AVI-0998, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0998/ → technical depth: Onapsis Research Labs, URL https://onapsis.com/blog/sap-security-patch-day-august-2026/"
    summary: |
      SAP's August 2026 Security Patch Day (11 Aug) shipped 28 new/updated notes including four CRITICAL-rated CVEs. The most severe, CVE-2026-58231 (CVSS 10.0), is an improper-authorization flaw in SAP Commerce Cloud's Data Hub Adapter: an unauthenticated network attacker submits crafted data to the Data Hub import endpoint and achieves arbitrary code execution with no privileges or user interaction required. CVE-2026-44772 (CVSS 9.9) and CVE-2026-44758 (CVSS 9.1) are code-injection flaws in vulnerable servlets in SAP Manufacturing Integration and Intelligence (MII/XMII 15.4, 15.5) that let an attacker submit specially crafted input to execute arbitrary OS commands on the underlying host; -44772 needs only low privileges while -44758 needs higher privileges, accounting for the CVSS gap. CVE-2026-34265 (CVSS 9.8) is a memory-corruption bug from logical errors in DIAG-protocol parsing inside the core SAP NetWeaver/ABAP Platform kernel (KRNL64NUC/UC, KERNEL 7.22-9.19), exploitable pre-auth over the network to disclose sensitive information or crash the AS ABAP instance. Two further High-severity flaws round out the internet-facing exposure: CVE-2026-58243 (CVSS 8.8) in ABAP Developer Tools' SQL Console lets a low-privileged authenticated user run unauthorized database operations via host expressions in SQL statements, and CVE-2026-42945 (CVSS 8.1) is a buffer overflow in the NGINX component fronting Commerce Cloud public-cloud deployments, exploitable pre-auth via specially crafted requests. No party has reported active exploitation as of publication, but the unauthenticated, network-reachable, no-user-interaction profile on Commerce Cloud and the ABAP kernel matches the imminent-exploitation pattern seen in prior SAP zero-days. Patches are available for every listed CVE; Commerce Cloud fixes require a rebuild/redeploy of the affected release rather than a simple patch install.
    region_nexus: "global; SAP ERP/Commerce Cloud/NetWeaver is heavily deployed across Swiss and EU federal, cantonal, and finance-sector back-office and e-commerce estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance"
