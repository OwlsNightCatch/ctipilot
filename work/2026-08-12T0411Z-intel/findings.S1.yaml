    extended_notes: |
      CERT-FR's advisory (CERTFR-2026-AVI-0998) lists the complete affected-version matrix across 15+ SAP components sharing this patch day, confirming Commerce Cloud (COM_CLOUD 2211, 2211-JDK21), NetWeaver/ABAP kernel versions from 7.22 through 9.19, and BusinessObjects BI as also receiving fixes in the same cycle. Given the CVSS 10.0 pre-auth profile on a component (Commerce Cloud) that is by definition internet-facing (public storefronts), this is a strong candidate for rapid scanning/exploitation attempts in the days following disclosure — track CISA KEV and ENISA EUVD for an exploitation-confirmed update.
