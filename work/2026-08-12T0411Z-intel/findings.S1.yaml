      Cisco ASA/FTD has a multi-year history of being a preferred target for sophisticated, persistence-focused espionage actors (the ArcaneDoor campaign tracked since 2024 against separate CVEs); Cisco's advisory does not link CVE-2026-20349 exploitation to any named cluster, and this reporting does not assert that connection. Given the short KEV deadline and no available workaround, treat repeated unexplained reloads of internet-facing ASA/FTD VPN gateways as a hunt trigger pending patching.
