items:
  - title: "TA488/LAUNDRY BEAR weaponised the Exchange OWA XSS (CVE-2026-42897) as a zero-day, delivering a browser-resident implant (OWAReaper)"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit", publisher: "Proofpoint", date: "2026-07-29", role: primary }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12577", publisher: "NCSC Switzerland (Cyber Security Hub, post 12577)", date: "2026-07-30", role: primary }
      - { url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498", publisher: "Microsoft Exchange Team Blog", date: "2026-05-14", role: corroborating }
      - { url: "https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146", publisher: "Microsoft Exchange Team Blog", date: "2026-07-14", role: corroborating }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12577 (NCSC-CH CSH 'Update 30.07' addendum to its May advisory linking a fresh Proofpoint post) → primary: Proofpoint, URL https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit → vendor patch confirmation: Microsoft Exchange Team Blog, URL https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498 and https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146"
    summary: |
      Proofpoint published (2026-07-29) attribution of active exploitation of CVE-2026-42897 — a stored XSS in
      Exchange Server's Outlook Web Access, disclosed by Microsoft 2026-05-14 and CISA-KEV-listed 2026-05-15 —
      to TA488 (Microsoft: Void Blizzard; registry actor:laundry-bear; also CL-STA-1114 / UNK_PitStop), the
      Russian state-supported email-espionage actor NCSC-CH/CISA/NSA/FBI and 16 nations jointly exposed on
      2026-07-23 for a parallel Zimbra zero-click campaign. The vulnerability lets an attacker execute arbitrary
      JavaScript in a victim's OWA reading pane by sending a specially crafted email — no link click or
      attachment open required, only that the target view the message in OWA ("half-click"). TA488 embeds
      exploit code via onload event handlers that assemble and execute Base64-encoded payloads out of the HTML
      message body, delivering "OWAReaper," a JavaScript browser implant that runs entirely inside the OWA
      reading pane (no host-file footprint), persists via manipulation of legitimate OWA localStorage settings
      keys, and establishes server-side persistence by modifying Exchange folder permissions. Proofpoint's
      infrastructure-creation timeline (March 2026) predates Microsoft's original disclosure by two months,
      making zero-day use plausible. Targeting spans government, telecommunications, finance, hospitality and
      aerospace across the US and Europe via deliberately vague, no-call-to-action lure emails. Affected:
      Exchange Server 2016/2019/SE (any update level) on-premises only; Exchange Online is not impacted. A full
      permanent fix shipped in the July 2026 Exchange Security Update (Exchange SE RTM; 2016 CU23 / 2019
      CU14-CU15 via the Period 2 Extended Security Update program) — administrators who applied it must
      manually remove the earlier EEMS/EOMT mitigation artifacts per Microsoft's follow-up guidance, since
      installing the SU does not do so automatically.
    region_nexus: "global; targeting spans US and Europe including government, finance and telecom — direct relevance to Swiss/EU public-sector Exchange on-prem estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, telco, finance"
    cves: ["CVE-2026-42897"]
    techniques: [T1566, T1203, T1098.002, T1114.002]
    affected_products: ["Microsoft Exchange Server 2016", "Microsoft Exchange Server 2019", "Microsoft Exchange Server Subscription Edition"]
    entity_keys: ["actor:laundry-bear"]
    new_entities:
      - { key: "tool:owareaper", type: tool, name: "OWAReaper", aliases: [],
          summary: "TA488/LAUNDRY BEAR's JavaScript browser implant delivered via the CVE-2026-42897 Exchange OWA stored-XSS zero-day; runs entirely in the OWA reading pane with no host-file footprint, persists via manipulation of legitimate OWA localStorage settings keys, and gains server-side persistence by modifying Exchange folder permissions (Proofpoint, 2026-07-29)." }
    relation_suggestions:
      - { subject: "actor:laundry-bear", object: "tool:owareaper", basis: "Proofpoint: TA488 delivers OWAReaper via CVE-2026-42897 exploitation in the OWA reading pane (Proofpoint, 2026-07-29)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen"
    evidence:
      - quote: "TA488 used intentionally vague message lures with no call-to-action for the targeted user."
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit"
      - quote: "OWAReaper is executed entirely in the Outlook Web Access (OWA) reading pane...no host footprint."
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit"
      - quote: "The earliest infrastructure used in this campaign was created in March 2026, two months prior to Microsoft's out-of-band patch...feasible that TA488 used this vulnerability as a zero-day."
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit"
      - quote: "Proof point published a blog post detailing a campaign exploiting CVE-2026-42897"
        attribution: "NCSC Switzerland (Cyber Security Hub)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12577"
    extended_notes: |
      This is a companion campaign to the already-tracked LAUNDRY BEAR Zimbra zero-click wave (Ulej/Flowerbed,
      CVE-2025-66376, covered 2026-07-24) — same actor, same email-espionage tradecraft class, different
      webmail platform and different implant family (OWAReaper vs. ZimReaper/Ulej). Defenders running
      on-premises Exchange should treat "patched in May" as insufficient: the July CU is the actual permanent
      fix, and EEMS/EOMT mitigation leftovers should be explicitly removed per Microsoft's guidance rather than
      assumed harmless.

  - title: "Rails Active Storage: unauthenticated arbitrary file read + RCE via libvips 'unfuzzed' image-loader operations (CVE-2026-66066)"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0948/", publisher: "CERT-FR / ANSSI", date: "2026-07-30", role: primary }
      - { url: "https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432", publisher: "Ruby on Rails security advisory", date: "2026-07-29", role: primary }
      - { url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm", publisher: "GitHub Security Advisory (rails/rails)", date: "2026-07-29", role: primary }
      - { url: "https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve", publisher: "Ethiack (\"KindaRails2Shell\" research note)", date: "2026-07-29", role: corroborating }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0948/ → primary: Ruby on Rails security advisory, URL https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432 → primary: GitHub Security Advisory, URL https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm → corroborating: Ethiack, URL https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve"
    summary: |
      CERT-FR (avis CERTFR-2026-AVI-0948, 2026-07-30) and the Rails security team (2026-07-29) disclosed
      CVE-2026-66066 (GHSA-xr9x-r78c-5hrm, CVSS 4.0 9.5 Critical, CWE-1188 Initialization of a Resource with an
      Insecure Default), a critical flaw in Active Storage's image-variant processing when using libvips — the
      default variant processor since Rails 7.0. libvips reads/writes file formats through "loaders" and
      "savers" and flags some of them "unfuzzed" (unsafe for untrusted content); Active Storage never disabled
      these unfuzzed operations before generating a variant. An unauthenticated attacker who can upload an
      untrusted image to any application that accepts uploads and generates variants can trigger one of these
      unfuzzed loaders/savers, yielding arbitrary file read (including `secret_key_base` and credential files)
      and, per the researcher-nicknamed "KindaRails2Shell" chain, remote code execution as the worker-process
      user. Affected: activestorage < 7.2.3.2, >= 8.0 < 8.0.5.1, >= 8.1 < 8.1.3.1; fixed in 7.2.3.2 / 8.0.5.1 /
      8.1.3.1. Patching Rails alone is insufficient — libvips itself must be >= 8.13 to be able to disable
      unfuzzed operations at all (`VIPS_BLOCK_UNTRUSTED=1` or `Vips.block_untrusted(true)`); on libvips < 8.13
      the patched Active Storage will refuse to boot in an unsecurable configuration. No public PoC or
      in-the-wild exploitation confirmed at publication; the disclosing researcher (Ethiack) is deliberately
      withholding the exploit chain until 2026-08-28 "to give users a reasonable window to patch," but
      explicitly warns "assume attackers with AI tooling can reconstruct one quickly."
    region_nexus: "global — any Rails application (including EU/Swiss public-sector e-government portals) accepting untrusted image uploads with the default libvips variant processor"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, healthcare"
    cves: ["CVE-2026-66066"]
    techniques: [T1190]
    affected_products: ["Ruby on Rails Active Storage (activestorage gem)"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "In its default configuration, a Rails application that displays image variants may allow an unauthenticated attacker to read arbitrary files from the server, including the process environment."
        attribution: "GitHub Security Advisory (rails/rails)"
        source_url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm"
      - quote: "Active Storage did not disable the unfuzzed operations, so an attacker who can upload a crafted file and cause a variant to be generated from it may be able to invoke one."
        attribution: "GitHub Security Advisory (rails/rails)"
        source_url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm"
      - quote: "The minimum version of libvips must be upgraded to >= 8.13...Earlier versions of libvips (< 8.13) cannot disable unfuzzed operations at all."
        attribution: "Ruby on Rails security advisory"
        source_url: "https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432"
    extended_notes: |
      Hunt/hardening priority: any internet-facing Rails app that lets unauthenticated or low-trust users
      upload images (public forms, ticketing, citizen portals) and uses the default libvips processor is
      exposed regardless of authentication controls elsewhere in the app — this bypasses application-level
      auth entirely via the image-processing pipeline. Verify BOTH the activestorage gem version AND the
      system libvips version; a patched gem on libvips < 8.13 cannot self-protect and Rails will refuse to
      boot until libvips is upgraded.

  - title: "Balbooa Gridbox for Joomla: pre-auth registration-to-admin escalation chained with file upload for RCE — 23 flaws found in a vendor-invited audit, active exploitation confirmed (CVE-2026-65884, CVE-2026-65885)"
    sources:
      - { url: "https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/", publisher: "mySites.guru", date: "2026-07-29", role: primary }
      - { url: "https://www.balbooa.com/blog/gridbox/gridbox-2-20-2-security-release", publisher: "Balbooa (Gridbox vendor security release note)", date: "2026-07-30", role: corroborating }
    discovery_trace: "first seen at: mysites-guru, URL https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/ → primary (no pivot needed; researcher is the disclosing party) → corroboration: Balbooa vendor page, URL https://www.balbooa.com/blog/gridbox/gridbox-2-20-2-security-release (confirms the 2.20.2 security release exists) → CVE verification: NVD records for CVE-2026-65884 and CVE-2026-65885"
    summary: |
      mySites.guru disclosed (2026-07-29) the results of a full source-code audit of Balbooa's Gridbox Joomla
      page builder (com_gridbox) that Balbooa itself commissioned after mySites.guru's earlier disclosure of a
      critical authentication-bypass cookie (`gridbox_username=admin`, CVE-2026-61425, fixed 2.20.1,
      2026-07-20; already tracked). The follow-on audit found 23 additional distinct vulnerabilities in one
      component, including a pre-authentication RCE chain, more than one further route to code execution,
      multiple ways to obtain administrator privilege without a password, several unauthenticated SQL
      injection points (one returning every user's password hash), unauthenticated path-traversal file read,
      and unauthenticated recursive directory deletion. The Joomla CNA has so far assigned two CVEs: CVE-2026-
      65884 (CVSS 4.0 10.0, CWE-284 Improper Access Control) — the registration handler adds the requested
      usergroup IDs instead of replacing them, so an anonymous visitor can register an account directly into an
      administrator group with no exploit skill; and CVE-2026-65885 (CVSS 4.0 9.4, CWE-434 Unrestricted Upload
      of File with Dangerous Type) — an authenticated arbitrary file upload that, chained with the
      CVE-2026-65884 self-registered admin account, yields full unauthenticated RCE end-to-end via a PHP file
      written into a web-reachable folder. Both CVE records carry NVD-confirmed exploit maturity "Attacked."
      The vendor's first two remediation attempts (an unversioned interim build, then a second build)
      each left live flaws — including an anonymous SQL injection Balbooa believed was fixed — before the
      complete fix shipped as Gridbox 2.20.2 (2026-07-29). The Joomla Security Strike Team independently
      confirmed at least three of the flaws are under active exploitation; mySites.guru observed exploitation
      attempts directly in server access logs and found rogue-admin accounts already planted on a connected
      site (92 accounts, generator pattern `xtw18387<4 hex chars>@outlook.com`, arriving in batches starting
      27 July, two days before the Strike Team's warning). The researcher is deliberately withholding every
      endpoint, parameter and PoC given the live exploitation. mySites.guru itself supplies the remaining 21
      vulnerabilities' shape only, without technical detail, pending broader remediation across the installed
      base.
    region_nexus: "global; Joomla with page-builder extensions is common on European municipal/cantonal and SME public-facing sites"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-65884", "CVE-2026-65885"]
    techniques: [T1190, T1136.001, T1505.003]
    affected_products: ["Balbooa Gridbox for Joomla (com_gridbox)"]
    entity_keys: ["trend:joomla-extension-file-upload-rce-wave"]
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: "update-of:2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave"
    evidence:
      - quote: "Twenty-three distinct vulnerabilities in one Joomla extension, including a pre-authentication remote code execution reachable in a single HTTP request."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"
      - quote: "the registration handler adds the default group to whatever groups the visitor asks for, instead of replacing them. So anyone can register a normal account and place themselves straight into an administrator group."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"
      - quote: "on one connected Joomla site our rogue admin check is holding 92 planted accounts right now, every one stamped by the same generator: the username xtw18387 plus four hex characters"
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"
    sourcing_note: >
      [SINGLE-SOURCE-OTHER: mySites.guru] — no second independent editorial source was found reporting this
      specific Gridbox 23-vulnerability audit at time of research (a CSA Singapore alert exists for the
      unrelated, already-covered SP Page Builder / Page Builder CK members of the same extension wave, not
      Gridbox). Confidence is nonetheless HIGH because: (1) mySites.guru is the vendor-invited, credited
      auditor with a track record of five prior CVE-yielding Joomla disclosures this pipeline has verified
      accurate; (2) both CVE-2026-65884 and CVE-2026-65885 are independently confirmed on NVD with CNA-assigned
      CVSS 4.0 scores and an exploit-maturity flag of "Attacked" — a status the CNA/NVD record attests
      independently of the blog narrative; (3) the vendor's own security-release page (fetched independently)
      confirms the 2.20.2 release exists as described.
    extended_notes: |
      Hunt guidance for Joomla fleets running Gridbox: check for administrator-group members created via
      self-registration rather than explicit admin action, and for the stated planted-account naming pattern
      shape (username of a fixed prefix plus random hex, matching outlook.com addresses arriving in
      batches) as a benign-lookalike discriminator against ordinary registration spam.

  - title: "osTicket: password-reset token expiry check bypass enables account takeover (CVE-2026-18363)"
    sources:
      - { url: "https://www.incibe.es/en/incibe-cert/notices/aviso/weak-password-recovery-mechanism-osticket-enhancesoft-llc", publisher: "INCIBE-CERT (Spain)", date: "2026-07-30", role: primary }
      - { url: "https://github.com/osTicket/osTicket/commit/5600f949623ba80254eb12e0350d60b69f8cb51b", publisher: "osTicket (vendor fix commit)", date: "2026-07-30", role: corroborating }
    discovery_trace: "first seen at: enisa-euvd, bridge enisa-euvd recent lastvulnerabilities (EUVD-2026-51068) → primary: INCIBE-CERT, URL https://www.incibe.es/en/incibe-cert/notices/aviso/weak-password-recovery-mechanism-osticket-enhancesoft-llc → corroborating: osTicket GitHub fix commit, URL https://github.com/osTicket/osTicket/commit/5600f949623ba80254eb12e0350d60b69f8cb51b"
    summary: |
      Spain's INCIBE-CERT published (2026-07-30) an advisory for CVE-2026-18363 (CVSS 3.1 9.1 Critical, CWE-640
      Weak Password Recovery Mechanism) in osTicket, the open-source support-ticket platform widely deployed by
      public-sector and SME helpdesks. The password-reset flow retrieves the timestamp associated with a
      supplied reset token and only performs the expiry check when that timestamp lookup fails — meaning any
      token whose timestamp record still exists skips expiry validation entirely, regardless of age. An
      attacker who obtains a valid reset token (e.g. via a leaked or intercepted reset-email link) can therefore
      replay it to force an unauthorized password reset and take over the account long after the token should
      have expired. Fixed in osTicket 1.17.8 and 1.18.4. No in-the-wild exploitation reported. Given the recent
      pattern of support-ticket/helpdesk platforms as an overlooked sensitive-data and access surface (cf. the
      EY third-party ITSM breach and the wider identity-trust-relationship-abuse trend already tracked this
      pipeline), any public-sector or CI operator running self-hosted osTicket for citizen or internal support
      should prioritise this patch.
    region_nexus: "global; osTicket is common in European public-sector/SME self-hosted helpdesk deployments"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-18363"]
    techniques: [T1190]
    affected_products: ["osTicket (Enhancesoft LLC)"]
    entity_keys: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "high CVSS but requires the attacker to already possess a valid reset token, no confirmed exploitation, and only a single national-CERT-tier source (INCIBE-CERT, Spain) found — included given the widely-deployed public-sector helpdesk use case and precise, actionable technical mechanism."
    evidence:
      - quote: "An attacker able to obtain a valid password reset token could reuse it to perform an unauthorised password reset and compromise the affected account."
        attribution: "INCIBE-CERT"
        source_url: "https://www.incibe.es/en/incibe-cert/notices/aviso/weak-password-recovery-mechanism-osticket-enhancesoft-llc"
    sourcing_note: >
      [SINGLE-SOURCE-NATIONAL-CERT: INCIBE-CERT, Spain] acting as primary disclosing/coordinating party for
      this advisory; treated per the carve-out for a high-reliability national cybersecurity authority. No
      second editorial source located in-window.

