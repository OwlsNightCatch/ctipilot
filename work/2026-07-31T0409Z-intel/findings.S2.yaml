        attribution: "TechNadu"
        source_url: "https://www.technadu.com/everest-hackers-leak-270000-files-reportedly-from-stadler-rail-breach-after-swiss-firm-refuses-to-pay-including-cctv-footage-configurations/632103/"
      - quote: "The threat actor claimed responsibility for a Stadler cyberattack last week but did not list the company on its dark web portal."
        attribution: "TechNadu"
