      - quote: "Die Ransomware-Bande Everest Group hat sich offiziell zum Angriff bekannt. Stadler hatte bereits über den Datendiebstahl informiert."
        attribution: "Inside IT Switzerland"
        source_url: "https://www.inside-it.ch/cyberkriminelle-veroeffentlichen-daten-von-stadler-rail-20260730"
    extended_notes: |
      Note for the composer: TechNadu is a mid-tier security-news outlet not previously in sources.json (candidate below); its account of the specific file count (271,000) and volume (201 GB) plus the named rail-operator customers is the only detailed public accounting found this run — I could not find a second independent outlet reproducing those specific numbers (several AI-search aggregations simply reflow TechNadu's own wording). Treat the numeric specifics (271,000 files / 201 GB / named third-party rail operators) as MEDIUM confidence pending a second primary; the higher-level fact that Everest published data and claims responsibility is corroborated by inside-it.ch (Swiss trade press, direct Swiss-incident reporting) independently. Stadler itself has issued no statement acknowledging the leak as of this run — its media page is unchanged since 2026-07-23. Everest reportedly did NOT list Stadler on its formal DLS despite the FTP-archive publication, an operationally odd detail (data published without a leak-site listing) worth flagging to a triage team following the case.
