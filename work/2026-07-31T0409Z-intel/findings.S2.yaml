items:
  - title: "Everest ransomware publishes 271,000 files / 201 GB reportedly from the Stadler Rail supplier breach — Deutsche Bahn, Merseytravel, Westbahn and MTR technical files allegedly included"
    sources:
      - { url: "https://www.technadu.com/everest-hackers-leak-270000-files-reportedly-from-stadler-rail-breach-after-swiss-firm-refuses-to-pay-including-cctv-footage-configurations/632103/", publisher: "TechNadu", date: "2026-07-29", role: "primary" }
      - { url: "https://www.inside-it.ch/cyberkriminelle-veroeffentlichen-daten-von-stadler-rail-20260730", publisher: "Inside IT Switzerland", date: "2026-07-30", role: "corroborating" }
      - { url: "https://www.stadlerrail.com/en/media/media-releases/cybervorfall", publisher: "Stadler Rail (official media release)", date: "2026-07-23 (page last updated; unchanged as of 2026-07-31)", role: "corroborating — confirms no updated Stadler statement since the original 'not compromised' release" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'Cyberkriminelle veröffentlichen Daten von Stadler Rail', 2026-07-30T12:44Z) → pivot: WebSearch (\"Stadler Rail Everest ransomware data published leak\") → primary: TechNadu, URL https://www.technadu.com/everest-hackers-leak-270000-files-reportedly-from-stadler-rail-breach-after-swiss-firm-refuses-to-pay-including-cctv-footage-configurations/632103/ → corroboration: Stadler Rail's own media-release page, URL https://www.stadlerrail.com/en/media/media-releases/cybervorfall (checked for an update; none published)"
    summary: |
      Everest ransomware has published a 201 GB FTP archive of 271,000+ files it says came from the Stadler Rail supplier-platform intrusion disclosed on 2026-07-21, moving the incident from an unpaid ransom demand into an actual data-leak event. Per TechNadu (2026-07-29, first flagged by threat-intel tracker HackManac), the leaked set spans railway software, CCTV footage, engineering documentation and configuration files, and Everest claims the data touches projects tied to several other rail operators beyond Stadler itself — Deutsche Bahn, Merseytravel, Westbahn and MTR are named. Inside-it.ch corroborated on 2026-07-30 that Everest has now "officially claimed" the attack. Stadler's own media-release page (last updated 2026-07-23, unchanged as of this writing) still states production, internal IT, rail vehicles and personal data were unaffected and that only non-security-relevant supplier technical data was taken — Stadler has not yet acknowledged or commented on the new leak claim, and at time of writing Everest had reportedly not listed Stadler on its formal dark-web leak-site portal despite publishing the archive. This is a material development on the 2026-07-22 finding (Everest demands CHF 10M, Stadler refuses to pay): the "no security-relevant data taken" framing from the original disclosure is now contested by an actual (if still victim-unconfirmed) data publication naming other rail-sector customers whose technical documentation may be exposed through Stadler's supplier relationship — a supply-chain blast-radius pattern relevant to any manufacturer or operator that exchanges engineering/config data with third-party suppliers over a shared platform. The underlying access vector documented in the original 2026-07-22 disclosure remains a trusted-relationship compromise (MITRE ATT&CK T1199): Everest reused compromised login credentials for the shared Stadler-supplier data-exchange platform rather than breaching Stadler's own perimeter — this update does not add a new access technique, only confirms the extortion escalated from threat to actual data publication.
    region_nexus: "Switzerland (Stadler Rail, Thurgau) — home-region primary victim; secondary exposure named for Germany (Deutsche Bahn), UK (Merseytravel), Austria (Westbahn) and Hong Kong (MTR) rail operators whose technical files reportedly transited the compromised supplier platform"
