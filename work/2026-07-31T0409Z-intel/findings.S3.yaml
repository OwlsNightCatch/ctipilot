  - title: "Rapid7 (with Rails/Ethiack/GMO Flatt Security): CVE-2026-66066 'KindaRails2Shell' — unauthenticated file-read-to-secrets-exposure in Rails Active Storage's default libvips image processor, CVSSv4 9.5"
    sources:
      - { url: "https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails", publisher: "Rapid7", date: "2026-07-30", role: "primary" }
      - { url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm", publisher: "Ruby on Rails / GitHub Security Advisories", date: "2026-07-29", role: "primary" }
    discovery_trace: "first seen at: rapid7 RSS feed, URL https://blog.rapid7.com/rss.xml (item dated Thu 30 Jul 2026 16:11:10 GMT, full body in feed) → primary: Rapid7, URL https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails, cross-referenced against the Rails GHSA advisory linked inline"
    summary: |
      On 2026-07-29 the Ruby on Rails project published GHSA-xr9x-r78c-5hrm for CVE-2026-66066 ("KindaRails2Shell"), a critical vulnerability (CVSSv4 9.5, CWE-1188 Initialization of a Resource with an Insecure Default) affecting Active Storage's image-variant processing when backed by the libvips library — the default Active Storage variant processor since Rails 7.0. libvips exposes format-loading/saving operations, some explicitly marked "unfuzzed"/"untrusted" because they are unsafe for untrusted content; Active Storage did not disable these operations before processing user-supplied uploads, so a crafted image upload can trigger an unsafe libvips operation and disclose arbitrary files readable by the Rails application process — no authentication or even variant-generation is required, only that the app accepts image uploads from untrusted users while using the Vips processor. Disclosed by independent researchers Ethiack and GMO Flatt Security, who withheld PoC code and the full attack chain; public code claiming to exploit the CVE exists but its correspondence to the actual reported chain is unconfirmed. Rapid7 states it is not aware of in-the-wild exploitation as of 2026-07-30; full technical details are due by 2026-08-28 per the Rails security announcement. Disclosed file-read access can expose secrets (Rails secret_key_base, master key and decrypted credentials, storage/database credentials, third-party tokens) enabling downstream RCE or lateral access to connected systems — hence the "possible RCE" framing rather than confirmed direct code execution. Affected: Rails 7.0.0-7.2.3.1 (fixed 7.2.3.2), 8.0.0-8.0.5 (fixed 8.0.5.1), 8.1.0-8.1.3 (fixed 8.1.3.1); Rails 6.0.0-6.1.7.10 may also be affected when Vips is explicitly configured (no fixed 6.x release — migrate or apply the workaround). Remediation requires BOTH a fixed Active Storage/Rails release AND libvips >= 8.13 — patching Rails alone with an old libvips is insufficient. Temporary workaround on libvips >= 8.13: set the VIPS_BLOCK_UNTRUSTED environment variable, or call Vips.block_untrusted(true) from an initializer with ruby-vips >= 2.2.1; on older libvips, the only workaround is removing the libvips dependency. Given secret exposure, affected organizations are advised to rotate secret_key_base and all credentials accessible to the app process (this invalidates active sessions and all encrypted/signed cookies, signed global IDs and Active Storage URLs).
    region_nexus: "global; Ruby on Rails is widely used for public-facing web applications and citizen/e-government portals across the Swiss/European public and private sector"
    primary_sector_nexus: "direct"
    sector: "public-sector, all-sectors (any Rails-based web application accepting image uploads)"
    cves: [CVE-2026-66066]
    techniques: [T1190, T1552]
    affected_products: ["Ruby on Rails (Active Storage)", "libvips", "ruby-vips"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
