  - title: "Kaspersky: Toy Ghouls upgrades to a custom Windows+Linux/ESXi ransomware, GenieLocker — no ransom note left on disk, in-band manual demand only"
    sources:
      - { url: "https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/", publisher: "Kaspersky Securelist (Malware descriptions)", date: "2026-07-30", role: "primary" }
    discovery_trace: "first seen at: Securelist RSS sweep, URL https://securelist.com/feed/ (item dated 30 Jul 2026 08:00 UTC) → primary: Kaspersky Securelist, URL https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/ (full article fetched via bridge)"
    summary: |
      Kaspersky documents GenieLocker, a new custom ransomware family (active since March 2026) built by the Toy Ghouls extortion group (aka Bearlyfy, Labubu, Laboo.boo) — previously reliant on third-party lockers (RedAlert, LockBit, Babuk) — to reduce third-party dependency. In the analyzed March-2026 intrusion against a Russian manufacturing-sector victim, initial access came through an OpenVPN connection from an external partner's network using stolen-but-still-valid credentials, abusing the trusted partner relationship. Post-access, the actor installed OpenSSH, socks5.exe, SoftPerfect Network Scanner and Mimikatz for discovery/credential dumping, and accessed the already-installed KeePassXC password manager to attempt extraction of stored credentials from local KeePass databases. Lateral movement used RDP (Windows) and SSH (Linux); mass deployment of the ransomware binary used the legitimate utilities PsExec and PAExec; C2 ran over a reverse SSH tunnel. No data exfiltration was found — consistent with the group's established pattern of not running double extortion or a leak site. GenieLocker's Windows build (MSVC-compiled C/C++, libsodium for crypto) requires a "secret argument" hex string (SHA-256-checked against a hard-coded value) before it will run at all — evading sandboxes/automated analysis and non-authorized reuse — and spawns a watchdog thread that polls IsDebuggerPresent/CheckRemoteDebuggerPresent every 500ms plus a running CRC32 check of its own .text section to detect debugger tampering, immediately terminating on any check failure. It deliberately leaves no ransom note on disk (avoiding detection heuristics keyed on mass README creation); demands are delivered manually by the attackers out-of-band. The Linux/ESXi ELF build additionally stops running virtual machines before encrypting their disks. Exclusion lists cover system folders/files/extensions to avoid corrupting the host OS.
    region_nexus: "out-of-nexus (Russian Federation manufacturing-sector victim; Toy Ghouls' documented targeting is Russia-focused); the trusted-partner-VPN initial-access vector, KeePassXC credential-store targeting, and PsExec/PAExec-driven Windows+Linux/ESXi dual-platform encryption are directly transferable tradecraft for any organization with third-party VPN access or hypervisor estates"
