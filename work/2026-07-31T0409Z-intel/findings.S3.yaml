          summary: "Financially motivated extortion group targeting Russian organizations (primarily manufacturing); previously relied on third-party encryptors (RedAlert, LockBit, Babuk) before developing the custom GenieLocker ransomware; does not run double extortion or a leak site (Kaspersky, 2026-07-30)." }
