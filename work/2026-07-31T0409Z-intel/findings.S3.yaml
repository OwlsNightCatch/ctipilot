      Good deep-dive / detection-engineering candidate given the story already has three prior operational entries here — this delta is purely the "how do I detect this" layer the audience (Tier 2/3, detection engineers) explicitly wants. Full rule-name list (60+ named Defend/SIEM rules across worker-RCE, credential-access, Kubernetes/cloud audit, and egress/C2 categories) is in the fetched body if the main agent wants more granularity than the summary above carries.

  - title: "Unit 42 catches a Chinese-speaking actor's autonomous AI offensive stack live — DeepSeek/Hermes Agent enumerates and exploits 7 CVEs with zero human input, exposed by its own misconfigured file server"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/", publisher: "Unit 42 (Palo Alto Networks)", date: "2026-07-30", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Unit 42 'Chinese-speaking threat actor' AI models autonomous cyberattacks July 2026\") → primary: Unit 42, URL https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/ (full article fetched via bridge; article:published_time confirmed 2026-07-30T10:00:52+00:00)"
    summary: |
      Unit 42 obtained full visibility into a live autonomous-AI attack operation after the actor's own "Hermes Agent" framework, responding to a Telegram command, started an HTTP file server (python3 -m http.server 8888) from its home directory rather than an isolated staging path, exposing the actor's entire tool configuration, API keys, exploit scripts, target lists, bash history and session logs. The actor (aliases knaithe / KnYuan, self-described binary-security researcher based in Zhuhai, China, and maintainer of the "1DayNews" automated RCE-alert pipeline) used DeepSeek as the reasoning engine behind the open-source Hermes Agent (already tracked here as tool:hermes-ai-agent from the unrelated Thailand-MoF Hunt.io case — this is a second, independent actor using the same framework) for fully autonomous vulnerability enumeration, exploit-code retrieval and exploitation attempts, orchestrated via Telegram C2. Hermes Agent was customized with three skills: "godmode" (LLM jailbreaking), a bundled unauthenticated-WebSocket exploitation module, and a custom FOFA-driven internet-asset-enumeration procedure feeding a DeepSeek natural-language-to-FOFA-query MCP server. In one recovered session, DeepSeek autonomously chose to abandon a Langflow CVE-2026-33017 (CVSS 9.8) target after assessing deployment scale as too small ("Deployments small (84 alive), exploitable probably 0"), then pivoted via GitHub PoC-star-count triage to n8n (647,017 global instances via FOFA), attempting the chained CVE-2026-21858 (arbitrary file read, CVSS 10.0) + CVE-2025-68613 (sandbox-bypass RCE, CVSS 9.9) against Chinese instances — failing because the required unauthenticated form endpoint was gated behind auth on every reachable target. Separate MANUAL campaigns by the same actor achieved confirmed impact: data exfiltration from three organizations (including persistent, multi-day targeting of a Malaysian government entity, with proxy-anonymized reconnection) via the Citrix NetScaler out-of-bounds-memory-read CVE-2026-3055, searching exfiltrated memory for NetScaler session-hijacking cookies (NSC_AAAC=); command execution on 11 Marimo-notebook instances (CVE-2026-39987); Java-deserialization reverse-shell attempts against 9 Apache Tomcat servers (CVE-2026-34486); and reverse-shell callbacks against 3 Windows IKE VPN endpoints (CVE-2026-33824). A cloned PoC for PAN-OS Captive Portal CVE-2026-0300 was non-functional (placeholder values, never executed). The actor tested Western tools (Claude Code, Codex) only for connectivity/proxy validation via a third-party proxy (code.newcli[.]com) with anti-attribution headers set and response-storage disabled — OpenAI independently confirmed to Unit 42 that its provider-side safeguards refused the actor's policy-violating requests and flagged/disabled the associated account before Unit 42's outreach. Unit 42's framing: exploitation was blocked only by target-side configuration (auto_login disabled, form auth enabled) — weaker defaults would have yielded compromise — and the autonomous capability itself caused the actor's own operational-security failure.
    region_nexus: "global; confirmed victims in China, Malaysia (government) and elsewhere; the exploited product set (Langflow, n8n, Citrix NetScaler ADC/Gateway, Apache Tomcat, Marimo Notebook, PAN-OS Captive Portal, Windows IKE Extensions) is common across Swiss/EU enterprise and public-sector estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, all-sectors (edge/perimeter and workflow-automation software)"
    cves: [CVE-2026-33017, CVE-2026-21858, CVE-2025-68613, CVE-2026-3055, CVE-2026-34486, CVE-2026-39987, CVE-2026-0300, CVE-2026-33824]
    techniques: [T1595, T1190, T1539, T1102]
    affected_products: ["Langflow", "n8n Workflow Automation", "Citrix NetScaler ADC & Gateway", "Apache Tomcat", "Marimo Notebook", "PAN-OS User-ID Authentication Portal (Captive Portal)", "Windows IKE Extensions (IKE VPN)"]
    entity_keys: ["tool:hermes-ai-agent"]
