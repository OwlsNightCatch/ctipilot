  - title: "Kaspersky: OctLurk and SilkLurk — two new plugin-based backdoors (medium-confidence Chinese-speaking actor) hit Central Asian and Syrian government bodies via scheduled-task/service-DLL loaders"
    sources:
      - { url: "https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-30", role: "primary" }
    discovery_trace: "first seen at: xlab-qianxin RSS sweep prompted a broader Securelist RSS check, URL https://securelist.com/feed/ (item dated 30 Jul 2026 11:00 UTC) → primary: Kaspersky Securelist, URL https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/ (full article fetched via bridge)"
    summary: |
      Kaspersky GReAT disclosed two new plugin-based backdoors, OctLurk and SilkLurk, active since at least January 2025 against government organizations in Afghanistan, Kyrgyzstan, Tajikistan, Uzbekistan, Kazakhstan and Syria, spanning healthcare, research institutes, foreign-affairs ministries, logistics, law enforcement, urban planning/facilities management and public education. Kaspersky assesses with medium confidence that the same, as-yet-unattributed Chinese-speaking actor operates both families (some SilkLurk victims also carry OctLurk). Deployment already presumes admin-level access: the attacker creates a scheduled task named "GoogleUpDate" (running once under System privileges) executing a batch script that installs a Windows service (observed service names include NgcCIntSvc, Cusrxsrv, specitsrc, cmtastsvc, PNRPHostSvc, vmictimerosync, vmicagent) whose ServiceMain registry value is repointed to a RegisterService export in a malicious loader DLL. The loader double-XOR-decrypts (one hard-coded key, one derived from the C: drive serial number) and zlib-decompresses a payload path and the backdoor DLL itself, then reflectively injects the DLL into memory. OctLurk communicates over a hard-coded C2 (port 443) using double-XOR + zlib framing on both send and receive, and loads plugins directly from the C2 into memory: a File Manager plugin (drive/file enumeration, ShellExecuteExW/CreateProcessAsUserW execution, SHFileOperationW copy/move/delete, timestamp tampering, chunked file read/write with CRC32 verification), a Command Shell plugin (cmd.exe spawn, command relay via temp-file redirection), and an Interaction Manager plugin (screen capture, clipboard read/write, synthesized mouse/keyboard events via low-level Win32 event codes). Post-compromise, the attacker used the command-shell plugin to fingerprint victims (chcp 1256 for Arabic code-page support, qwinsta/klist/TASKLIST, wevtutil query for EventID 4624 LogonType 10 RDP logons, WMIC AV enumeration, netstat connection enumeration) and separately deployed Impacket's secretsdump, a custom keylogger, a browser-password decryptor, Pandora FMS remote-access agents, the FSCAN network scanner, and email-harvesting tooling. A companion utility, LurkProxy, shares OctLurk's architecture but is not itself a backdoor. SilkLurk victims additionally received PlugX as a second-stage payload. Both loader families are heavily obfuscated per-victim (payload decryption keys derive from victim-machine data), complicating static analysis and signature-based detection.
    region_nexus: "out-of-nexus (Central Asia and Syria government targets); the credential-harvesting/plugin-backdoor architecture (service-based DLL sideload, double-XOR+zlib obfuscation, in-memory plugin loading, Impacket secretsdump usage) is directly transferable tradecraft for any government-sector detection team"
    primary_sector_nexus: "indirect"
    sector: "public-sector (government, healthcare, education, law-enforcement)"
    cves: []
    techniques: [T1053.005, T1543.003, T1055, T1027, T1003, T1056.001, T1555.003, T1046, T1219, T1114]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "malware:octlurk", type: malware, name: "OctLurk", aliases: [],
          summary: "Plugin-based Windows backdoor (service-loaded, reflectively-injected DLL) deployed against Central Asian/Syrian government targets since Jan 2025; hard-coded C2 with double-XOR+zlib framing; File Manager/Command Shell/Interaction Manager in-memory plugins (Kaspersky GReAT, 2026-07-30)." }
      - { key: "malware:silklurk", type: malware, name: "SilkLurk", aliases: [],
          summary: "Sibling backdoor to OctLurk sharing loader architecture and victimology (Central Asia/Syria government); deploys PlugX as a second-stage payload on some victims (Kaspersky GReAT, 2026-07-30)." }
      - { key: "tool:lurkproxy", type: tool, name: "LurkProxy", aliases: [],
          summary: "Companion utility architecturally similar to the OctLurk backdoor but not itself a backdoor, deployed alongside OctLurk/SilkLurk (Kaspersky GReAT, 2026-07-30)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "We assess with medium confidence that the same threat actor is behind both backdoors, and that they are Chinese-speaking. However, at the time of publication, we couldn't attribute this activity to any known group."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/"
      - quote: "The backdoor loaders are customized for each victim and use information from the victim's machine to decrypt the payload. Both the loaders and the backdoors are heavily obfuscated, making analysis more complicated."
