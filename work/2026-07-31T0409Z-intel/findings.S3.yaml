  - title: "Hugging Face breach: Elastic maps the whole AI-agent kill chain to production Elastic Defend / SIEM rules stage-by-stage"
    sources:
      - { url: "https://www.elastic.co/security-labs/ai-agent-attack-detection-hugging-face-breach", publisher: "Elastic Security Labs", date: "2026-07-31", role: "primary" }
    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs (listing, item dated 31 July 2026) → primary: Elastic Security Labs, URL https://www.elastic.co/security-labs/ai-agent-attack-detection-hugging-face-breach (full article fetched via bridge after WebFetch summarised only the title/teaser)"
    summary: |
      Elastic Security Labs published a stage-by-stage detection-engineering mapping of the July 2026 Hugging Face autonomous-AI-agent breach (already tracked here across three prior deltas: initial disclosure 2026-07-21, OpenAI attribution 2026-07-23, Artifactory zero-day update 2026-07-30). This post adds no new facts about the incident itself; its value is a concrete, vendor-neutral detection checklist tied to each stage of the real intrusion. Initial access: a Hugging Face dataset-processing worker (production Kubernetes conversion-worker pod) was reached via two paths against the same config-driven loader — an HDF5 external-raw-storage read that disclosed local files (env secrets, worker source) and a Jinja2 template-injection RCE; earlier SSRF attempts against cloud metadata failed on the datasets URL allowlist. Post-exploitation: escalation to node-level access, harvest of cloud/cluster credentials (service-account token reads, EKS API probing, TokenRequest for CSI identities, SelfSubjectRulesReview, STS identity checks, cluster secret-object reads), then lateral movement into several internal clusters over 9-13 July UTC via ~17,600 reconstructed actions from a swarm of short-lived sandboxes. C2 was self-migrating on public services (request-capture hosts, pastebins, attacker-controlled HF datasets as dead-drops, HF Spaces as egress relay), payloads gzip/base64-packed and sometimes XOR'd/chunked. Elastic maps each stage to named production Defend behavior rules and SIEM detections (e.g. "Suspicious Child Execution via Web Server", "Curl or Wget Spawned via Node.js", "Environment Variable Secret Collection", "Multi-Value Secret Searching via Grep", a full set of Kubernetes secret-access/privileged-pod/TokenRequest rules, AWS STS/IAM first-seen rules, and GenAI-parented correlation rules requiring Elastic Stack 9.3.0+: "Elastic Defend Alert from GenAI Utility or Descendant" and "LLM-Based Attack Chain Triage by Host"). Elastic also lists behavioral tells that distinguish an autonomous agent from a human operator: retries of already-succeeded actions, valid exploit steps followed by malformed/syntactically broken commands, benchmark-task strings leaking into traces, and large volumes of hallucinated input — useful correlation context, not stand-alone detections. Elastic's explicit scope caveat: this is a public-disclosure-based mapping, not a claim of complete coverage against every sandbox variant or custom agent harness.
    region_nexus: "global; any organization running ML/data-processing worker pods on untrusted dataset content, or exposing Kubernetes/cloud credentials to processing workers, is in-scope — directly relevant to Swiss/EU public-sector and research bodies increasingly running Hugging Face-hosted models"
    primary_sector_nexus: "indirect"
    sector: "technology, public-sector (research/AI infrastructure), all-sectors (any org running ML data pipelines)"
    cves: []
    techniques: [T1190, T1059, T1059.004, T1552, T1021, T1078, T1071, T1613]
    affected_products: ["Hugging Face Hub (dataset-processing pipeline)", "Elastic Defend", "Elastic Security (SIEM)"]
    entity_keys: ["incident:hugging-face-autonomous-ai-agent-breach-2026-07"]
