    corrections:
      - "MSRC's own CVSS 3.1 vector for CVE-2026-42897 is CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N/E:F/RL:O/RC:C — base 8.1, but with temporal component E:F (Functional exploit code exists), issued by CNA=Microsoft. S1's cve_table carried the base score only; the E:F temporal flag and the CNA identity are new, directly-sourced detail."
      - "Expanded/corrected MITRE ATT&CK mapping. S1 mapped [T1566, T1203, T1098.002, T1114.002]. Verified against the pinned enterprise-attack.json (all active, non-deprecated, non-revoked): T1566 Phishing (crafted-email delivery) and T1203 Exploitation for Client Execution (browser-context JS execution via the stored-XSS) both hold. T1098.002 Additional Email Delegate Permissions correctly maps the UpdateFolder/'Default'-user folder-permission grant. T1114.002 Remote Email Collection is weakly supported — Proofpoint explicitly states 'Unlike ZimReaper, there is no mass exfiltration of emails' — recommend dropping or treating as low-confidence. Recommend ADDING, all directly evidenced in the fetched Proofpoint body: T1185 Browser Session Hijacking (implant runs entirely in-browser, in the OWA reading-pane DOM context); T1552 Unsecured Credentials (invisible-input DOM autofill harvesting of saved OWA credentials); T1102.001 Dead Drop Resolver (GitHub Commit Search API used as a C2 command channel); T1071.004 DNS (label-tunneling exfiltration fallback); T1027 Obfuscated Files or Information (AES-CTR + Base64/Base32 encoding of C2 traffic and payload data)."
      - "New adjacent-context detail not in the S1 record: MSRC's CVE-2026-42897 FAQ (updated 2026-07-14) explicitly cross-references a second, related Exchange OWA CVE fixed in the same July SU — CVE-2026-55008 (CWE-79, CVSS 3.1 9.6, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H/E:U/RL:O/RC:C, exploited: No per Microsoft). Surfaced for main-agent awareness only; not independently corroborated by a second source and out of this DR1's assigned scope, so not proposed as its own item."
      - "Precise mitigation-removal mechanics not in the S1 summary: EM-Service-applied mitigations require removing 'mitigation M2.1.0 IIS rules' per the documented rollback procedure; EOMT-script-applied mitigations require running the documented EOMT rollback command. Known operational issues under mitigation (OWA Print Calendar, inline images, OWA-light, OWACalendar.Proxy health-set alerts) persist until BOTH the SU is installed AND the mitigation is explicitly removed."
    extended_notes: |
      This is a companion campaign to the already-tracked LAUNDRY BEAR Zimbra zero-click wave (Ulej/Flowerbed,
      CVE-2025-66376, covered 2026-07-24) — same actor, same email-espionage tradecraft class, different
      webmail platform and different implant family (OWAReaper vs. ZimReaper/Ulej), with Proofpoint explicitly
      stating OWAReaper shares code/behavioral overlap with ZimReaper (autofill-harvesting DOM technique,
      error-handling style). Detection-engineering angle worth surfacing in the entry body: defenders should hunt
      for (a) unexpected UpdateFolder calls granting Owner permission to the "Default" alias across mail folders
      (an anomalous EWS/Graph audit-log signature — legitimate admin folder-permission changes are rare and
      scoped, not blanket Owner grants to a low-privilege preset alias); (b) OWA client-side telemetry/DLP for
      writes to the PageDataPayload.OwaUserDefaultSettings localStorage key outside normal OWA sync operations;
      (c) outbound GitHub Commit Search API polling from an Exchange-adjacent client context (unusual egress
      pattern for a mail client); (d) DNS query volume/entropy anomalies consistent with label-tunneling
      exfiltration. Benign-lookalike caveat: OWA's own sync-restore flow legitimately reads/writes
      OwaFrontendSyncState-adjacent keys constantly, so the discriminator is the *specific* settings-field key
      path and payload structure, not the mere presence of localStorage writes.

