      CVE-2026-65885 (NVD record): CVSS 4.0 vector
      `CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:A/.../U:Red`, baseScore 9.4 CRITICAL,
