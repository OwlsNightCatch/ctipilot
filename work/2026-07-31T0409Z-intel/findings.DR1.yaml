      general-purpose overlay), the Joomla CNA's "Attacked" assessment is the authoritative one here: it is
      independently corroborated by mySites.guru's own first-hand server-log observations ("We have the server
      access logs showing the exploitation requests arriving, and connected sites where the accounts are already
      planted... 92 planted accounts") and indirectly by Balbooa's own vendor page, which references "the recent
      increase in automated attacks" and instructs customers to remove temporary .htaccess rules "added...to
