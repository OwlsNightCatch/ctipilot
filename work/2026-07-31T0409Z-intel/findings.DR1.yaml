    discovery_trace: "DR1 scoped re-read of S1 item (findings.S1.yaml). first seen at: work/2026-07-31T0409Z-intel/findings.S1.yaml → re-fetched in full: Proofpoint (bridge `url`, full body, first attempt truncated at 37KB by output cap, second attempt captured full 129KB page), URL https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit → re-fetched: NCSC-CH CSH via `python3 tools/fetch_source.py ncsc-csh recent 20`, URL https://security-hub.ncsc.admin.ch/#/posts/12577 → re-fetched: Microsoft Exchange Team Blog (May post; techcommunity.microsoft.com serves gzip-compressed bodies even with Accept-Encoding: identity, corrupting the bridge's text-mode stdout — recovered via the jina reader), URL https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498 → re-fetched: Microsoft Exchange Team Blog (July SU post, jina reader), URL https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146 → cross-checked: MSRC vulnerability record via `python3 tools/fetch_source.py msrc cve CVE-2026-42897`, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 → cross-checked: CISA KEV catalog via `python3 tools/fetch_source.py cisa-kev`, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    summary: |
      DEEP-DIVE ENRICHMENT of the already-triaged S1 item. Full re-read confirms and substantially extends the
      technical picture.

      Injection mechanism (Proofpoint, verbatim mechanism): "The messages exploit CVE-2026-42897, a vulnerability
      in Outlook Web Access in which the server does not adequately sanitize HTML in the message body. This
      allows a loader piece of JavaScript to use the onload= event handler to parse the rest of the message body,
      assemble a Base64 fragment, and execute it as encoded JavaScript." The initial exploit trigger and payload
      blobs are embedded inside the social-media icon elements of the message-body HTML; the next-stage payload
      data sits after `#` fragment markers that the browser's image-from-Base64 parser stops at, hiding it from
      casual HTML inspection — a more subtle storage location than TA488's prior Zimbra targeting used.

      OWAReaper execution flow (server-side, in the reading pane, on message open): (1) it uses Outlook APIs to
      rewrite the email on the Exchange server and strip the exploit content, while disabling OWA pop-ups and
      right-click; (2) it derives a per-target session key and enumerates the victim's email address, username
      and Outlook settings; (3) it creates two invisible DOM input elements and waits for the browser's autofill
      to populate them with the OWA-saved username/password (a technique it shares — including the same
      -9999px/-9998px invisible-popup sizing and error-handling code — with the prior ZimReaper payload, of which
      OWAReaper is Proofpoint's assessed evolution); (4) it enumerates installed Outlook add-ins with
      ReadWriteMailbox permission and, where found, abuses them to call GetClientAccessToken to steal OAuth
      tokens; (5) it calls UpdateFolder to grant itself Owner-level permission on every mail folder for the
      "Default" low-permission preset alias present in every Exchange tenant — Proofpoint states this is
      deliberate and durable: "This persistent access lives on the server-side and requires deliberate removal
      from the Exchange server; credential rotation and even full re-imaging of the targeted user's device will
      not evict the actor."

      Persistence (client-side, two layers): OWAReaper writes an AES-encrypted copy of itself plus a decryption
      wrapper into the browser's localStorage under the PageDataPayload.OwaUserDefaultSettings key — a legitimate
      OWA settings key that OWA itself evaluates as OwaFrontendSyncState during its own sync-restore flow, so
      every normal OWA tab-open re-triggers OWAReaper automatically with no separate loader needed. A second,
      independent persistence layer adds a hidden iframe to messages cached in OWA's offline IndexedDB store
      (owa_offline_db) with caching enabled, so opening the poisoned message from the offline cache re-infects
      the endpoint even after a full device re-image.

      Command and control (two channels): (1) a "dead-drop" channel — OWAReaper polls GitHub's public Commit
      Search API every 24 hours for specially crafted commit messages containing the target's email address;
      matches are AES-CTR decrypted with a hardcoded key plus a per-session key, yielding a 4-character command
      header for one of three command types (`code` = full toolkit replacement, `domn` = C2 domain rotation,
      `cmnd` = one-time arbitrary-code execution via eval()); (2) an email-borne channel — the implant parses
      IndexedDB-cached inbound messages every 5 minutes (looking back 30 minutes) for the same
      {target_email}{space}{Base64} structure and the same command handler. Two exfiltration protocols: primary
      HTTPS with AES-CTR-encrypted URI paths proxied through legitimate public image-CDN services (falling back
      to direct HTTP GET if the CDN proxy path fails); a DNS label-tunneling fallback (AES-CTR then Base32 over a
      restricted alphanumeric alphabet, split into 2–4 subdomain labels) used if HTTPS exfiltration fails.

      Zero-day timeline and targeting: Proofpoint's stated infrastructure-creation date for this campaign is
      March 2026 — two months before Microsoft's May 14 disclosure — supporting the "feasible…zero-day" framing.
      The 22 July 2026 campaign start (one day before Proofpoint's NSA-joint TA488/Void Blizzard release) targeted
      government, telecommunications, finance, hospitality and aerospace entities across the US and Europe, using
      deliberately banal lure subjects (supply-chain/tourism/energy/health "indicator update" themes) with no
      call-to-action — Proofpoint frames the unusually broad volume/targeting breadth as likely deliberate blending
      with mass-mailing spam.

      MSRC record (queried directly): CVE-2026-42897 is CWE-79, CVSS 3.1 base score 8.1 with vector
      CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N/E:F/RL:O/RC:C — the E:F (Functional exploit code exists)
      temporal component and Microsoft's own `"exploited": "Yes"` / `"latestSoftwareRelease": "Exploitation
      Detected"` fields corroborate active-exploitation status independent of Proofpoint's reporting. Issuing CNA:
      Microsoft. CISA KEV: dateAdded 2026-05-15, dueDate 2026-05-29 (confirmed directly from the KEV catalog JSON,
      not a news paraphrase).

      Patch trains (confirmed from the Exchange Team Blog's own structured "SUs are available for" list, July 14
      2026 post): Exchange SE RTM (public download); Exchange Server 2019 CU14 and CU15 (Period 2 ESU program
      only); Exchange Server 2016 CU23 (Period 2 ESU program only) — Period 1-only ESU customers do not receive
      this update (that program ended April 2026). Removal of earlier mitigation artifacts is explicit and
      NOT automatic: "Installing the July 2026 update does not automatically remove already applied
      CVE-2026-42897 mitigations." Administrators must, post-SU: if EM Service was used, manually remove the
      mitigation M2.1.0 IIS rules per the documented EEMS rollback procedure; if the downloadable EOMT script was
      used, run its documented rollback. Known mitigation-era operational issues (OWA Print Calendar breakage,
      inline-image rendering, OWA-light non-function, OWACalendar.Proxy health-set false-unhealthy alerts) are
      only resolved once the SU is installed AND the mitigation is removed — servers kept on mitigation-only
      status continue to carry those known issues indefinitely.

      Adjacent context (not part of this CVE but disclosed in the same MSRC/July-SU cycle): MSRC's own FAQ update
      for CVE-2026-42897 states "Microsoft recommends installing the July 2026 Security Updates for your version
      of Exchange Server as soon as possible to be protected from this vulnerability and related CVE-2026-55008
      vulnerability" — a second Exchange OWA spoofing/XSS CVE (CWE-79, CVSS 3.1 9.6, vector
      CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H/E:U/RL:O/RC:C) fixed in the same July SU but NOT currently
      flagged as exploited by Microsoft (`"exploited": "No"`, `"latestSoftwareRelease": "Exploitation More
      Likely"`). Flagging for main-agent awareness only — out of this DR1's assigned scope, not independently
      verified against a third source, and not proposed as a separate item.
