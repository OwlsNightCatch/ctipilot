      Vendor remediation timeline (mySites.guru, first-hand account of the coordinated-disclosure process):
      Balbooa's FIRST proposed fix build, sent for pre-publication verification, left several reported findings
      live — most seriously, an anonymous SQL injection returning password hashes that Balbooa believed was
      fixed but had only patched at one of several identical, reachable entry points. Balbooa's SECOND build,
      turned around within a day of that finding being re-proven, closed the anonymous injection and the
      actively-exploited routes, but still left two issues live: a forgeable payment-gateway callback signature
      (exploitable on a common configuration) and a SQL injection reachable by a logged-in low-privilege user.
      The COMPLETE fix — closing all 23 findings plus the payment-callback and low-priv-SQLi gaps from build two
      — shipped as Gridbox 2.20.2 on 29 July 2026. Balbooa's own security-release page corroborates the version
      and confirms pre-publication verification: "Prior to the public release of Gridbox 2.20.2, the updated
