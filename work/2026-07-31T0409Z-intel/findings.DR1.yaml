        source_url: "https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve"
      - quote: "As of July 30, 2026, Rapid7 is not aware of exploitation in the wild. Ethiack and GMO Flatt Security, who independently reported the vulnerability, have withheld proof-of-concept code and details of the full attack chain."
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails"
      - quote: "The minimum version of libvips must be upgraded to >= 8.13...Earlier versions of libvips (< 8.13) cannot disable unfuzzed operations at all, and Active Storage will raise an exception during boot in such an unsecurable environment."
        attribution: "Ruby on Rails security advisory / GHSA-xr9x-r78c-5hrm"
        source_url: "https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432"
