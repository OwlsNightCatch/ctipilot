    summary: |
      DEEP-DIVE ENRICHMENT. NVD structured records for both CVEs (owning CNA: security@joomla.org, the Joomla
      CNA — NOT MITRE/NVD's own assessment) confirm the S1 summary's figures precisely, add exact CVSS4 vector
      strings and CWE citations, and surface one exploitation-status discrepancy the task specifically asked to
      be checked for.

      CVE-2026-65884 (NVD record, quoted structured fields): CVSS 4.0 vector
      `CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:A/.../U:Red`, baseScore 10.0 CRITICAL,
