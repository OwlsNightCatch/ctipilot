      - "S1/S3 both stated the Rails 6.x affected range as flat fact in the vulnerability's own affected-version list. Structured verification (OSV ranges + NVD affected-versions field) shows NEITHER the Rails/GHSA advisory NOR NVD lists a 6.x range at all — the 3 structured ranges are 7.x (<7.2.3.2), 8.0.x (<8.0.5.1), 8.1.x (<8.1.3.1) only. The 6.x claim is Ethiack's own researcher assessment, relayed by Rapid7 with explicit attribution ('Ethiack reports that...'). Recommend the composed entry attribute the 6.x detail to Ethiack/Rapid7 specifically rather than presenting it as part of the Rails advisory's own affected-version table."
      - "CVSS 4.0 9.5 is assigned by GitHub Security Advisories acting as Rails' CNA (NVD sourceIdentifier: security-advisories@github.com), confirmed directly from the NVD structured record — not independently scored by Rapid7 or the Rails team as a separate act; Rapid7 and CERT-FR both simply report the same GHSA-assigned score."
      - "New precondition detail not in S1/S3: Ethiack states a third, technically undisclosed precondition — 'Runs a libvips build linked against certain third-party libraries' — meaning not every libvips build is equally exposed even when Vips is the configured processor; withheld pending the August 28 full disclosure."
      - "New scope-boundary detail not in S1/S3: Ethiack explicitly states applications using the (non-default, pre-7.0) ImageMagick/Magick variant processor are NOT affected by this specific vector."
    extended_notes: |
      Hunt/hardening priority unchanged from S1/S3: any internet-facing Rails app accepting untrusted image
      uploads on the default (Rails >= 7.0) libvips processor is exposed regardless of application-level
      authentication, because the exposure is in the image-processing pipeline, not the app's auth layer.
      Verification checklist for defenders: (1) `Rails.application.config.active_storage.variant_processor` —
      confirm whether it is `:vips` (default since 7.0) or `:mini_magick`/ImageMagick (out of scope for this
      vector per Ethiack); (2) installed `activestorage` gem version against the three fixed points; (3) system
      libvips version against the >= 8.13 floor — a patched gem on an older libvips will refuse to boot rather
      than silently remain vulnerable, which is itself a useful boot-time detection signal; (4) if upgrading
      libvips is not immediately possible, confirm `VIPS_BLOCK_UNTRUSTED` is set or `Vips.block_untrusted(true)`
      is called from an initializer as an interim compensating control.

