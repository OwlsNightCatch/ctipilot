      "File upload methods allows authenticated attackers to upload arbitrary files. Turns into an authenticated
      RCE if combined with CVE-2026-65884 as the required account can be created by the attacker."

      IMPORTANT DISCREPANCY the task asked to be surfaced: both NVD records ALSO carry a separate SSVC
      (Stakeholder-Specific Vulnerability Categorization) block attributed to role "CISA Coordinator" that states
      `"exploitation": "none"` for both CVEs — directly contradicting the Joomla CNA's own CVSS temporal metric
      of `E:A` (Attacked) / `providerUrgency: RED` set in the SAME record by the CVE-owning authority
