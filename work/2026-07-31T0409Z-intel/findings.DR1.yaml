  # ITEM 2 — CVE-2026-66066 Rails Active Storage / libvips "KindaRails2Shell"
  # ============================================================
  - title: "Rails Active Storage: unauthenticated arbitrary file read + RCE via libvips 'unfuzzed' image-loader operations (CVE-2026-66066)"
    deep_read: true
    sources:
      - { url: "https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm", publisher: "GitHub Security Advisories (Rails CNA) — retrieved via OSV mirror", date: "2026-07-30", role: primary }
      - { url: "https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432", publisher: "Ruby on Rails security advisory (Rafael França, Rails core team)", date: "2026-07-29", role: primary }
      - { url: "https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve", publisher: "Ethiack (discovering researcher — André Baptista/0xacb)", date: "2026-07-29", role: primary }
      - { url: "https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails", publisher: "Rapid7", date: "2026-07-30", role: primary }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0948/", publisher: "CERT-FR / ANSSI", date: "2026-07-30", role: corroborating }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-66066", publisher: "NVD (CVE record owner: security-advisories@github.com)", date: "2026-07-30", role: primary }
    discovery_trace: "DR1 scoped re-read of S1/S3 items (findings.S1.yaml, findings.S3.yaml). first seen at: work/2026-07-31T0409Z-intel/findings.S1.yaml and findings.S3.yaml → re-fetched structured record: OSV mirror of the GHSA (github.com egress-blocked, used `python3 tools/fetch_source.py osv vuln GHSA-xr9x-r78c-5hrm`), URL https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm → re-fetched full body: Rails Discourse advisory (bridge `url`), URL https://discuss.rubyonrails.org/t/cve-2026-66066-possible-arbitrary-file-read-and-remote-code-execution-in-active-storage-variant-processing/91432 → re-fetched full body: Ethiack (bridge `url`), URL https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve → re-fetched full body: Rapid7 (bridge `url`), URL https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails → re-fetched: CERT-FR (bridge `url`), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0948/ → cross-checked structured CVSS/SSVC: NVD REST API (bridge `url`), URL https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-66066"
    summary: |
      DEEP-DIVE ENRICHMENT. Structured-field re-verification (OSV mirror of the GHSA, and NVD directly) confirms
      the version ranges and adds precision the prose summaries in S1/S3 did not carry, plus one attribution
      correction.

      Structured affected-version ranges (from OSV's `affected[].ranges` — the machine-readable GHSA data, NOT
      a prose paraphrase): THREE separate ECOSYSTEM ranges — (1) introduced "0", fixed "7.2.3.2"; (2) introduced
      "8.0.0.beta1", fixed "8.0.5.1"; (3) introduced "8.1.0.beta1", fixed "8.1.3.1". NVD's own affected-versions
      field for the same CVE lists identically: "< 7.2.3.2", ">= 8.0.0.beta1, < 8.0.5.1", ">= 8.1.0.beta1, <
      8.1.3.1" — three ranges, no fourth. Note: the first range's "introduced: 0" boundary is a database-encoding
      artifact (no earlier fix boundary exists to anchor it), not a live claim that every historical activestorage
      release back to 0.1 is practically exploitable — Vips was not even a configurable variant processor that
      far back.

      CORRECTION to S1/S3 framing on Rails 6.x: neither the Rails/GHSA advisory's own structured version ranges
      NOR NVD's affected-versions field mention Rails 6.x at all. The "Rails 6.0.0–6.1.7.10 may also be affected"
      claim originates specifically from Ethiack (the discovering researcher), relayed by Rapid7 — not from the
      Rails advisory itself. Rapid7, verbatim: "Ethiack reports that Rails 6.0.0 through 6.1.7.10 may also be
      affected when Active Storage is configured to use Vips; Rails 6.x does not use Vips by default. Rails has
      not published a fixed 6.x release, so affected Rails 6.x applications should migrate to a supported fixed
      branch or apply the applicable workaround." Ethiack's own site states the same, with an explicit non-default
      caveat: "Rails 6.0.0 through 6.1.7.10 may be affected only if Active Storage has been set up outside its
      defaults, so a normal 6.x install isn't exposed to this vulnerability." Ethiack's own version table lists
      the 6.x row's "Fixed In" as 7.2.3.2 (i.e., there is no 6.x point-release fix — the only remediation path
      for an affected 6.x app is to upgrade the whole Rails version or apply the libvips-level workaround).
      Both S1 and S3 stated the 6.x detail as flat fact without attributing it to Ethiack/Rapid7 specifically as
      distinct from the Rails advisory — worth correcting the attribution when composing.

      Precondition precision (answers the assigned question on variant generation): GHSA/OSV, verbatim: "An
      application is affected if it meets all of these requirements: Uses libvips for Active Storage image
      processing...Allows image uploads from untrusted users. Generating variants is not a separate requirement."
      Rapid7 corroborates identically. This means the exposure condition is (a) Vips configured as the variant
      processor AND (b) untrusted image uploads accepted — NOT a further requirement that a variant actually be
      generated on-demand. Ethiack adds an undisclosed third precondition it declines to detail: "Runs a libvips
      build linked against certain third-party libraries" — implying not every libvips build/platform combination
      is equally exposed, but the specifics are withheld pending the August 28 disclosure.

      Scope boundary not previously captured: Ethiack states explicitly, "Only the Vips image processor is
      affected. Applications using Magick are not affected by this vector" — i.e., Rails apps configured for
      the alternative (older-default, pre-7.0) ImageMagick-based variant processor are out of scope for this
      specific vector.

      CVSS assignment and authority: NVD's structured record shows `sourceIdentifier: security-advisories@github.com`
      (GitHub Security Advisories acting as Rails' CNA) as the assigning party for CVSS 4.0 9.5 CRITICAL, vector
      CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:X (exploit maturity NOT_DEFINED at
      publication — i.e., no exploitation status has been formally set in the CVSS record itself). NVD's separate
      SSVC entry (role: CISA Coordinator) independently records `"exploitation": "none"`, `"automatable": "yes"`,
      `"technicalImpact": "total"` — consistent with Rapid7's plain-text statement, "As of July 30, 2026, Rapid7
      is not aware of exploitation in the wild." No disagreement between authorities here (unlike item 3 below).

      Disclosure credit and timeline (from Ethiack's own site, the primary discovering party): independently and
      near-simultaneously reported by André Baptista (0xacb), Bruno Mendes (s3np41k1r1t0) and Rafael Castilho
      (castilho) of Ethiack, and — a few days later — by RyotaK of GMO Flatt Security Inc.; the two teams then
      coordinated disclosure and fix timing together with Rails maintainer Mike Dalessio (flavorjones) and the
      libvips maintainers. Full technical/PoC details are withheld until no later than 2026-08-28, per the Rails
      Security Announcements forum. Ethiack's own reasoning for withholding, verbatim: "No PoC or technical chain
      details from us yet, but assume attackers with AI tooling can reconstruct one quickly once patches ship and
      diffs go public, so don't wait to upgrade."

      Credential-rotation consequence (Rapid7/GHSA, both agree): because the vulnerability is a file-read primitive
      against the whole application process, a successful exploitation should be treated as exposing every secret
      the Rails process can read — secret_key_base, the Rails master key and everything config/credentials.yml.enc
      decrypts, Active Storage service credentials (S3/GCS/Azure), database credentials, and third-party
      tokens/keys — and rotating secret_key_base specifically invalidates active sessions and all encrypted/signed
      cookies, signed global IDs, and Active Storage URLs. CERT-FR's advisory is a thin structured roundup (risks:
      confidentiality breach + remote code execution; same three version ranges) pointing to the Rails Discourse
      thread as its sole documentation reference — no independent technical content, no exploitation claim, fully
      consistent with the primaries.
