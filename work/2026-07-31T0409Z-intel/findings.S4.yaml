  - title: "ExfilSquad, a data-extortion brand that surfaced 26 July, claims a confirmed UK Department for Education breach and an unattributed Analog Devices intrusion — but most of its 15-victim leak-site list looks fabricated"
    sources:
      - { url: "https://therecord.media/united-kingdom-ransomware-education", publisher: "The Record (Recorded Future News)", date: "2026-07-30", role: primary }
      - { url: "https://socradar.io/blog/dark-web-profile-exfilsquad/", publisher: "SOCRadar", date: "2026-07-28", role: primary }
      - { url: "https://www.sec.gov/Archives/edgar/data/6281/000119312526324223/d158253d8k.htm", publisher: "Analog Devices, Inc. (SEC 8-K, Item 8.01)", date: "2026-07-29", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/analog-devices-discloses-data-breach-says-operations-unaffected/", publisher: "BleepingComputer", date: "2026-07-30", role: corroborating }
      - { url: "https://cyberinsider.com/analog-devices-says-hackers-stole-company-files-in-june-cyberattack/", publisher: "CyberInsider", date: "2026-07-30", role: corroborating }
    discovery_trace: "first seen at: therecord.media homepage, URL https://therecord.media/ → primary: The Record, URL https://therecord.media/united-kingdom-ransomware-education (UK DfE breach); separately first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ → primary: SEC EDGAR 8-K, URL https://www.sec.gov/Archives/edgar/data/6281/000119312526324223/d158253d8k.htm (Analog Devices); pivot: WebSearch (\"ExfilSquad extortion group Analog Devices data claim leak site\") → primary: SOCRadar Dark Web Profile, URL https://socradar.io/blog/dark-web-profile-exfilsquad/ (actor profile tying both claims together, plus a 15-victim leak-site inventory)"
    summary: |
      ExfilSquad is a data-exfiltration-only extortion brand (no confirmed encryption capability) whose Tor-hosted leak site first appeared on 26 July 2026 with a rapidly-growing, low-credibility victim list of 15 named organisations spanning government, education, finance and technology (SOCRadar: Wesco International, Analog Devices, Bonava, City of Atlanta, City of Houston, Viavi Solutions, Newcastle University, DC Public Schools, Zenith Bank, Frontier Airlines, TaylorMade/Sun Day Red, Allstate, Microsoft, the UK Police National Legal Database and the UK Department for Education). SOCRadar assesses that "fabrication currently appear[s] more likely" than genuine compromise for most listings — no forensic evidence, data samples, victim confirmation, or initial-access technical detail is publicly available for the group, and it lists Microsoft, a target implausible for a data-theft-only crew of this profile, without corroboration.
      One claim is independently confirmed, however: the UK Department for Education acknowledged a breach of two public-facing portals — the DfE Help Desk Self-Service Portal and the Turing Scheme Portal — describing roughly 600,000 lines of customer-service contact data (names, phone numbers, emails, job titles of parents, officials, school leaders and university staff) as compromised, alongside a separately-affected Police National Legal Database dataset (135,000 records naming police officers, forces and work emails). DfE characterises the risk to individuals as not high and confirms no financial data was involved; the UK's NCSC is supporting the response and the government's standing no-ransom-payment policy for the public sector applies.
      Separately, semiconductor manufacturer Analog Devices disclosed (SEC 8-K, Item 8.01 — not Item 1.05) that it identified unauthorized access to its systems on 23 June 2026, confirmed subsequent file exfiltration, and does not believe the incident is "reasonably likely to materially impact its business" — filing under the non-material "Other Events" item despite acknowledged data exfiltration, a materiality-threshold choice worth noting for SOC teams benchmarking peer disclosure practice. Analog Devices has NOT attributed this June intrusion to ExfilSquad; the group briefly listed ADI (claiming ~570,000 customer PII/address records) before quietly delisting it, a pattern consistent with either ransom-negotiation withdrawal or claim retraction after scrutiny. ADI's 8-K separately notes it is "assessing the validity, scope, and any potential impact" of a distinct "disparate cybersecurity matter" reported publicly on 26 July — almost certainly the ExfilSquad listing.
    region_nexus: "UK Department for Education is a national government department (home-region/coverage-focus nexus, public-sector core constituency); Analog Devices is a US-headquartered global semiconductor supplier with no confirmed EU/CH victim link"
