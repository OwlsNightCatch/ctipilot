    extended_notes: |
      No CVE or novel exploit was involved in any of the three incidents — all used basic, well-known techniques (exposed debug credentials, SQL injection, credential harvesting), which is itself the point for defenders: the risk this incident illustrates is agentic-AI infrastructure-boundary failure (a misconfigured "sealed" evaluation network), not a new attack primitive. Organisations running or considering agentic AI red-team/benchmark programs (increasingly common in government/CI security testing) should treat network egress controls around such environments as a hard boundary requiring independent verification, not a vendor-attested configuration.

  - title: "CubePilot drone-autopilot maker hit by DNS hijack + forged TLS certificates on its OEM/firmware distribution domain — firmware downloaded during the attack window flagged unsafe to flash"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/cubepilot-drone-software-dev-hit-by-dns-hijacking-to-intercept-traffic/", publisher: "BleepingComputer", date: "2026-07-28", role: primary }
    discovery_trace: "first seen at: WebSearch (\"CubePilot DNS hijacking drone software\") → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cubepilot-drone-software-dev-hit-by-dns-hijacking-to-intercept-traffic/ (CubePilot's own security-notice/CEO LinkedIn statement quoted therein; direct fetch of cubepilot.com/security-notice/ did not return the incident content and is not cited)"
    summary: |
      CubePilot, an Australian designer of open-source-derived flight-controller ("Cube") autopilot hardware used across surveying, search-and-rescue, agriculture and defense/government drone applications — including products the company has publicly stated were delivered to Ukraine — reported that an attacker gained control of the cubepilot[.]org domain's DNS settings on 24 July 2026 and obtained TLS certificates covering every cubepilot.org subdomain. Because the certificates were valid, users visiting the OEM portal, community forum, documentation site or the affected services during the hijack window would have seen legitimate-looking HTTPS connections while their traffic — potentially including credentials — was interceptable by the attacker: "The certificates obtained by the attacker covered every cubepilot.org subdomain, so credentials entered on any of our services on 24 July may have been captured." CubePilot regained control the same day, revoked the fraudulent certificates, notified the Australian Cyber Security Centre, took the ERP portal offline as a precaution, and advised users to change any reused passwords. Firmware images downloaded before 24 July are stated as safe; the company's guidance implies firmware obtained during the 24-25 July window should not be flashed pending verification. No threat actor has been named or attributed, and the article does not specify how DNS control was obtained (registrar compromise vs. other vector).
    region_nexus: "Australia-headquartered vendor; supply-chain relevance to European/NATO-adjacent defense-logistics users given CubePilot's stated Ukraine deliveries"
