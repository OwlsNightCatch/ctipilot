  - title: "ShinyHunters' vishing-to-SSO-takeover campaign against healthcare confirmed by Health-ISAC (Medtronic, DentaQuest, iRhythm, OneMedical) as Brinks Home becomes the newest confirmed victim"
    sources:
      - { url: "https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/", publisher: "Health-ISAC", date: "2026-07-24", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/health-isac-warns-of-rising-shinyhunters-data-theft-attacks-on-healthcare/", publisher: "BleepingComputer", date: "2026-07-29", role: corroborating }
      - { url: "https://www.bleepingcomputer.com/news/security/shinyhunters-claims-brinks-home-breach-threatens-to-leak-stolen-data/", publisher: "BleepingComputer", date: "2026-07-30", role: primary }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ → primary: Health-ISAC advisory, URL https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/; pivot: BleepingComputer Brinks Home coverage, URL https://www.bleepingcomputer.com/news/security/shinyhunters-claims-brinks-home-breach-threatens-to-leak-stolen-data/ (fresh confirmed victim with CEO statement)"
    summary: |
      Health-ISAC issued a sector advisory (24 July, surfaced in BleepingComputer's coverage 29 July) formalising the attack chain ShinyHunters — the actor already tracked across this pipeline's EY and Abbott/Exact Sciences entries — runs against healthcare specifically: vishing (voice social engineering) targeting helpdesk staff → an MFA reset, password reset, or device re-enrollment performed without out-of-band identity proofing → Microsoft Entra/Okta/Google SSO account takeover → lateral pivot into connected SaaS platforms (Salesforce, Microsoft 365, SharePoint, ServiceNow, Teams) → rapid bulk data exfiltration used purely as extortion leverage, with no encryption payload. Health-ISAC's framing: "SSO is the control plane, and ShinyHunters' leverage is created through data theft at cloud scale." Named healthcare/medtech victims already impacted per Health-ISAC's own citations: Medtronic (medical-device manufacturer), DentaQuest, iRhythm and OneMedical.
      A fresh, independently confirmed victim landed the following day: residential-security firm Brinks Home confirmed (CEO statement, 30 July) that it detected an intrusion on 20 July; ShinyHunters claims the actual breach occurred 13 July via a Microsoft Entra voice-phishing call in which "the threat actor calls an employee and convinces them to complete a Microsoft Entra authentication or registration process," followed by exfiltration of 1.1M+ Salesforce Contacts rows, 4,000+ employee PII records and 3.8M customer-support chat logs from the company's Cresta instance. Brinks Home states alarm-monitoring and system functionality were unaffected throughout.
      Health-ISAC's mitigation guidance carries an explicit 30-60 day action list: prioritise phishing-resistant MFA (FIDO2/WebAuthn) for high-risk users, require out-of-band identity verification for any password reset / MFA reset / device re-enrollment request, treat SSO infrastructure as Tier-0 critical assets with heightened monitoring, and rehearse containment of a compromised cloud-identity account.
    region_nexus: "Named victims are US-based (Health-ISAC's remit); the identical vishing-to-SSO-takeover tradecraft is documented against European SaaS-integrated enterprises in this pipeline's prior ShinyHunters/EY and Abbott entries, making the technique directly transferable to Swiss/EU healthcare and public-sector SSO estates"
