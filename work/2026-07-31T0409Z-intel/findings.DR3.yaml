    discovery_trace: "deep-read re-fetch of S2's chain: first seen at inside-it-ch RSS → primary TechNadu, URL https://www.technadu.com/everest-hackers-leak-270000-files-reportedly-from-stadler-rail-breach-after-swiss-firm-refuses-to-pay-including-cctv-footage-configurations/632103/ → corroboration Stadler Rail's own Storyblok-CMS media release, URL https://www.stadlerrail.com/en/media/media-releases/cybervorfall (full raw body recovered via bridge fetcher, Next.js RSC payload). This pass additionally ran 5 distinct WebSearch queries attempting to find a second independent outlet reproducing the 271,000-file / 201 GB figures or the named rail-operator list (Deutsche Bahn, Merseytravel, Westbahn, MTR) — every query returned only the TechNadu article itself, plus a set of syndication/AI-search summaries that verbatim-reflow TechNadu's own sentences (identical phrasing 'Everest claims the compromised data touches projects linked to several high-profile operators, including Deutsche Bahn, Merseytravel, Westbahn, and MTR' recurred across every search-engine summary, confirming these are restatements of the same single source, not independent reporting)."
