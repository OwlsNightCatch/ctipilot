  # ============================================================
  # ITEM 2 — ExfilSquad / UK DfE / Analog Devices
  # ============================================================
  - title: "ExfilSquad / UK Department for Education and Analog Devices — deep read separates DfE's own confirmed facts from ExfilSquad's claims, traces the Analog Devices delisting to BleepingComputer (not SOCRadar) and the 570,000-record figure to CyberInsider (an ExfilSquad claim, not ADI-confirmed)"
    deep_read: true
    of_item: "S4: ExfilSquad, a data-extortion brand that surfaced 26 July, claims a confirmed UK Department for Education breach and an unattributed Analog Devices intrusion"
    sources:
      - { url: "https://therecord.media/united-kingdom-ransomware-education", publisher: "The Record (Recorded Future News) — byline Alexander Martin", date: "2026-07-30", role: primary }
      - { url: "https://socradar.io/blog/dark-web-profile-exfilsquad/", publisher: "SOCRadar", date: "2026-07-28", role: primary }
      - { url: "https://www.sec.gov/Archives/edgar/data/6281/000119312526324223/d158253d8k.htm", publisher: "Analog Devices, Inc. (SEC Form 8-K, Item 8.01 Other Events)", date: "2026-07-29", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/analog-devices-discloses-data-breach-says-operations-unaffected/", publisher: "BleepingComputer — byline Bill Toulas", date: "2026-07-30T11:12:00-04:00", role: primary }
      - { url: "https://cyberinsider.com/analog-devices-says-hackers-stole-company-files-in-june-cyberattack/", publisher: "CyberInsider", date: "2026-07-30", role: corroborating }
    discovery_trace: "deep-read re-fetch of S4's chain, plus one new pivot: BleepingComputer's ADI article (https://www.bleepingcomputer.com/news/security/analog-devices-discloses-data-breach-says-operations-unaffected/) links out to a ransomware.live victim-tracker page (https://www.ransomware.live/id/QW5hbG9nIERldmljZXNARXhmaWxTcXVhZA==) confirming the ExfilSquad/Analog-Devices leak-site listing exists as a tracked entry, corroborating the delisting claim's premise (a listing existed to be removed)."
    transport_notes: >
      The Record: WebFetch succeeded cleanly; bridge fetch also used to extract exact
      surrounding paragraph text for precision. SOCRadar: WebFetch returned a reasonable
      summary but explicitly stated "No mention of Analog Devices being delisted or removed
      appears in this document" — verified independently via full raw-body bridge fetch
      (395 KB HTML) and a targeted string search for "Analog Devices", "delist", "removed",
      "570,000", "ADI" — CONFIRMED: none of the delisting/570k details appear anywhere in
      SOCRadar's article; SOCRadar's only Analog Devices mention is the one-line inclusion in
      its 15-victim list. BleepingComputer's own ADI article: WebFetch 503'd twice
      (transient); bridge fetcher's direct-GET rung succeeded on first attempt (88.5 KB) and
      is where the delisting fact and its "common for threat actors to delist companies when
      ransom negotiations begin" framing actually originates. CyberInsider: WebFetch
      succeeded and is where the 570,000-record figure and the explicit "has not attributed"
      sentence originate. SEC 8-K: bridge-fetched the raw HTML filing directly (29.5 KB,
      plain text after tag-stripping) — confirmed Item 8.01 verbatim.
    summary: |
      Deep read confirms the DfE/PNLD facts largely as S4 reported them, adds one precision
      (the "lines of data, not individuals" distinction is DfE's OWN clarification, not a
      generic caveat), and issues one material sourcing CORRECTION on the Analog Devices
      thread: the "ExfilSquad briefly listed then delisted Analog Devices" fact and the
      "~570,000 customer PII/address records" figure were NOT both sourced correctly in the
      prior record — they trace to two DIFFERENT outlets, neither of which is SOCRadar.

      DfE-confirmed facts (The Record, quoting a DfE spokesperson directly): two portals were
      affected — the "DfE Help Desk Self-Service Portal" and the "Turing Scheme Portal"; the
      compromised data is "customer service contact details" (names, emails, phone numbers);
      DfE explicitly clarifies that ExfilSquad's "more than 600,000 pieces of data" figure
      "refers to lines of data, rather than the count of individuals affected" — i.e. DfE
      itself is pushing back on the scale implied by the criminals' own number, not merely
      restating it; and DfE assesses "the risk to individuals is not considered high."
      Separately, the Police National Legal Database (135,000 records: names, forces, work
      emails of police officers and criminal-justice personnel) was impacted — The Record
      notes this "does not contain protected information from investigations or witnesses,"
      and that the Home Office (which owns PNLD, not DfE) "declined to comment" on that
      specific element. NCSC confirmed it is "supporting law enforcement colleagues in
      response to an incident affecting the Police National Legal Database." No ransom was
      paid, consistent with the UK's standing public-sector no-payment posture (with
      legislation in progress to make such payments illegal for public-sector/CNI entities).

      ExfilSquad/SOCRadar thread: SOCRadar's own 15-victim inventory and credibility
      assessment are confirmed verbatim ("the listings may involve reused data or fabricated
      allegations, with fabrication currently appearing more likely"). One addition from the
      full-body read: SOCRadar separately documents a July 27, 2026 event in which "ExfilSquad
      posted directly on X, tagging Microsoft's security-intelligence account and sharing a
      screenshot resembling an internal Dynamics 365-style directory record for a senior
      executive account" — authenticity unconfirmed — illustrating the group's publicity-
      seeking behavior beyond the leak-site listing itself. SOCRadar also states it found "no
      known aliases, predecessor operations, or rebranding history" for the group, i.e. no
      evidence ExfilSquad is a rebrand of a previously tracked actor.

      Analog Devices thread — CORRECTED sourcing: BleepingComputer's own article (not
      SOCRadar) is the source for the delisting fact: "This may be related to the data
      extortion group 'ExfilSquad' that recently added Analog Devices to its leak site,
      claiming to have exfiltrated information from company systems. However, the threat
      actor no longer lists Analog Devices on their site. While the reason for this is
      unknown, it is common for threat actors to delist companies when ransom negotiations
      begin." CyberInsider (not SOCRadar or BleepingComputer) is the source for the specific
      record count: "The group alleges it stole approximately 570,000 customer records
      containing personally identifiable information (PII) and physical addresses" — framed
      explicitly as ExfilSquad's own allegation, not ADI-confirmed. CyberInsider also states
      plainly: "Analog Devices has not attributed the June incident to any threat actor or
      confirmed that Exfilsquad's claims are related" — directly confirming the two-thread
      separation the task requested. The SEC 8-K itself (Item 8.01, "Other Events" — verbatim
      confirmed from the raw filing) discloses that ADI "identified unauthorized access to
      certain Company systems" on June 23, 2026, that its "investigation has found that
      certain files were exfiltrated," and that it "does not believe the June 23, 2026
      incident is reasonably likely to materially impact its business, operations, or
      financial condition" — filed as a non-material Other Events item despite acknowledged
      exfiltration. The same filing separately (and explicitly) flags the ExfilSquad claim
      without naming it: "Separately and unrelated, on July 26, 2026, the Company was made
      aware of public reports regarding a disparate cybersecurity matter and is currently
      assessing its validity, scope, and any potential impact" — the July 26 date lines up
      exactly with ExfilSquad's leak-site launch date reported by SOCRadar.
