    summary: |
      Deep read confirms and sharpens S2's finding with no material change to the overall
      narrative but several load-bearing corrections/additions:

      (1) TechNadu is confirmed as the SOLE public source for the 271,000-file / 201 GB
      figures and the four named rail-operator customers (Deutsche Bahn, Merseytravel,
      Westbahn, MTR) — five independent WebSearch queries this pass surfaced no second outlet
      with these specifics; every search-engine summary that appeared to "corroborate" them
      was verbatim-reflowing TechNadu's own sentences. TechNadu's own article explicitly
      frames the operator-linkage claim as Everest's assertion, not a verified fact: "Everest
      claims the compromised data touches projects linked to several high-profile operators
      ... If validated, exposure of engineering documentation and system configurations tied
      to these operators raises concerns around downstream risk to connected railway
      infrastructure" — the "if validated" hedge is TechNadu's own, underscoring these
      operator names are unconfirmed extortion-actor claims, not established fact.

      (2) TechNadu attributes the original figures to a third party, not its own analysis:
      "According to the threat actor, which was first flagged by threat-intelligence tracker
      HackManac, the data breach yielded a 201 GB FTP archive holding more than 271,000
      files." The HackManac post itself is a specific X/Twitter status
      (https://x.com/H4ckmanac/status/2082350161779392871, linked from TechNadu's own image
      caption) — i.e. the ultimate origin of the numeric claim is a threat-intel tracker's
      social-media post relaying Everest's own extortion-site listing, not independent
      forensic verification by any outlet.

      (3) Stadler Rail's own media release — fetched in full this pass via its raw Next.js
      RSC payload rather than a client-rendered shell — contains ZERO mentions of Deutsche
      Bahn, Merseytravel, Westbahn, MTR, or the 271,000/201 GB figures. Stadler's statement is
      exclusively about the ransom demand and its "no security-relevant data, no personal
      data, vehicles/production unaffected" position; it does not address (confirm, deny, or
      even acknowledge) the subsequent data-publication event TechNadu and Inside-IT report.
      Stadler's CMS record shows created_at 2026-07-20T14:28:30.804Z, published_at
      2026-07-23T07:35:27.738Z, and updated_at IDENTICAL to published_at down to the
      millisecond — mechanically confirming the release has never been revised since first
      publication, i.e. Stadler has issued no public update addressing the 2026-07-29/30
      leak-publication development. (The on-page display text separately shows a content
      "date" field of "2026-07-21 00:00" — rendered as "21.07.2026" — which is the editorial
      dateline Stadler chose to display, distinct from the CMS's actual publish timestamp of
      2026-07-23T07:35:27Z; both figures reconcile the minor date discrepancy between S2's
      "2026-07-23" note and the page's visible "21.07.2026" text.)

      (4) New precise detail from Stadler's own (translated) text: the intrusion itself is
      dated by Stadler to "Mitte Juli 2026" (mid-July 2026) — i.e. the access/credential-theft
      predates both the ~2026-07-21/23 disclosure and the 2026-07-29/30 data-publication by
      roughly a week or more. Stadler also confirms filing the criminal complaint specifically
      with the Kantonspolizei Thurgau (Thurgau cantonal police).

      (5) TechNadu confirms, independent of Stadler, that Everest "claimed responsibility for
      a Stadler cyberattack last week but did not list the company on its dark web portal" —
      i.e. the 201 GB archive was apparently published via a direct FTP-archive drop rather
      than (or in addition to) Everest's own formal Tor leak-site listing mechanism; a repeat
      WebSearch this pass found no update indicating Stadler has since appeared on Everest's
      DLS.

      Net effect on confidence: the update-of-record should keep the numeric specifics (271k
      files / 201 GB / four named operators) at MEDIUM confidence, single-sourced to TechNadu,
      with the "if validated" / unconfirmed-claim framing preserved verbatim rather than
      flattened into established fact — and should explicitly state that Stadler's own channel
      has not addressed the leak-publication claim at all as of this run.
