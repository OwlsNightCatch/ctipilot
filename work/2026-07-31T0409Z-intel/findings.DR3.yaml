  # ITEM 1 — Everest / Stadler Rail data-leak publication
  # ============================================================
  - title: "Everest ransomware publishes 271,000 files / 201 GB reportedly from the Stadler Rail supplier breach — deep read confirms TechNadu is the SOLE source for the numeric specifics and named rail operators; Stadler's own release (unchanged since 2026-07-23T07:35:27Z) neither names them nor addresses the leak"
