  - title: "Kaspersky: OctLurk and SilkLurk — two new plugin-based backdoors (medium-confidence Chinese-speaking actor) hit Central Asian and Syrian government bodies via scheduled-task/service-DLL loaders"
    deep_read: true
    sources:
      - { url: "https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-30", role: "primary" }
    discovery_trace: "deep-read re-fetch of the S3-discovered primary, URL https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/ (full raw HTML body fetched via bridge and parsed for exact wording; datePublished confirmed 2026-07-30T11:00:12+00:00, authors Saurabh Sharma and Yaroslav Kikel)"
    summary: |
      Deep-read enrichment of the S3-discovered Kaspersky GReAT report; the loader chain confirmed as observable behavior end-to-end. Deployment presupposes administrative access throughout: every deployment path — OctLurk, LurkProxy, the fingerprinting batch script, the keylogger, and the Pandora RC agent — begins with "The attacker created a scheduled task named `GoogleUpDate` on remote machines using admin credentials. The task runs once with System account privileges right after it was created." The task executes a batch script (observed paths include user-profile `Videos`/`Desktop` folders, `C:\windows\temp`, `C:\ProgramData`) that installs a Windows service (observed service names: `NgcCIntSvc`, `Cusrxsrv`, and separately `specitsrc`, `cmtastsvc`, `PNRPHostSvc`, `vmictimerosync`, `vmicagent`); the service's `ServiceMain` registry parameter is repointed to invoke the `RegisterService` export of the malicious loader DLL (observed loader names: `oleasapi.dll`, `msbasesysdc.dll`). The loader DLL itself exports two methods, `Refresh` and `RegisterService`; the service calls `RegisterService`, which in turn invokes `Refresh`, the method containing the malicious logic.

      Double-XOR key derivation, full mechanics: to locate the payload, the loader double-XOR-decrypts and zlib-decompresses a set of hard-coded bytes to yield the payload file path, then applies the identical double-XOR + zlib process to the payload bytes themselves to produce the backdoor DLL. The double-XOR uses two distinct multibyte keys: "Key 1: hard-coded in the loader" and "Key 2: derived from the serial number of the C: drive" — i.e., one static key baked into the binary and one machine-specific key computed at runtime from the victim's volume serial, which is what makes each victim's loader artifact undecodable without that victim's own machine data (defeats naive static/signature analysis and cross-victim IOC reuse). The backdoor DLL is then reflectively injected into memory and its entry point executed; the loader calls exported methods by name or ordinal, both hard-coded and decrypted via the same double-XOR + zlib process (observed backdoor entry invocation: `curl_easy_escape`, ordinal 2 — a decoy/borrowed libcurl symbol name, not actual curl functionality). C2 communication reuses the identical double-XOR + zlib framing on both send and receive: outbound victim telemetry (OS version, computer name, username, local IP, local time) is zlib-deflate-compressed, then XOR'd first with a hard-coded string key, then with a freshly generated 83-byte (0x53) random byte sequence that itself travels in the packet header — so the "session key" changes every connection even though the static key does not.

      Three plugin classes, loaded directly from the C2 into memory (no plugin ever touches disk): each plugin exports two methods, `ins_ctl_db` and `oct_lk_col`, with all real functionality in `oct_lk_col`. (1) File Manager: drive/volume enumeration (GUID path, serial, free space), filename search with full timestamp/attribute metadata, recursive directory listing filtered by C2-supplied size/time thresholds, file open via `ShellExecuteExW`, command execution via `CreateProcessAsUserW`, copy/move/delete/rename via `SHFileOperationW`, directory creation, attribute setting, deliberate timestamp tampering to attacker-supplied values (anti-forensic), and chunked file read/write with per-chunk CRC32 integrity verification. (2) Command Shell: spawns `cmd.exe` as an interactive shell when running, relaying stdin/stdout to the C2; when no interactive shell is active, executes non-interactively via `cmd.exe /S /C "<command>" > %TEMP%\tmp<decimal><hex>.tmp`, reads the output file back, then deletes it — a classic temp-file-redirection execution pattern that is a strong, source-supported detection anchor (transient `%TEMP%\tmp*.tmp` file creation immediately followed by a read-then-delete from a `cmd.exe` child of a non-interactive-shell parent process). (3) Interaction Manager: single and interval screen capture via GDI `BitBlt`, clipboard read/write via `GetClipboardData`/`SetClipboardData`, and synthesized mouse/keyboard input via low-level Win32 event codes (`MOUSEEVENTF_*` constants for click/move/wheel, key-down/up by virtual-key code) — i.e., full interactive remote-hands-on-keyboard capability delivered as an in-memory plugin, not a separate RAT.

      Post-compromise fingerprinting was executed via a dedicated batch script and includes, verbatim command set: `chcp 1256` (Arabic code page — notable given the victim set spans Central Asia/Syria, suggesting operator locale or target-region familiarity), PowerShell version check, `qwinsta` (active sessions), `klist sessions` (Kerberos), `TASKLIST /V`, `wevtutil qe Security /f:text /c:5 /rd:true /q:"*[System[(EventID=4624)]] and *[EventData[Data[@Name='LogonType']=10]]"` (hunting the last 5 successful RDP logons — EventID 4624 LogonType 10), `WMIC ... AntiVirusProduct` AV enumeration, `Get-MpComputerStatus` and Defender tamper-protection/exclusion registry queries, `netstat -ano` variants for listening/established connections, and BIOS/CPU/memory/disk hardware enumeration via WMI — output collected to `info.txt` and per-hostname `.datb` files in `%TEMP%`. Second-stage tooling deployed post-fingerprinting: Impacket's `secretsdump` (password-hash extraction, followed by querying "Domain Controllers" group membership to expand targeting), a custom keylogger persisted via a scheduled task named `AnyDesk` (keystrokes/clipboard XOR'd by subtracting 2 from each byte — a trivially weak but non-zero obfuscation), a browser-password decryptor targeting Chrome (`Login Data` + `Local State` master key) and Firefox (`logins.json`), Pandora FMS remote-access agents (legitimate commercial remote-control software repurposed for persistent hands-on-keyboard access), the FSCAN network scanner (SSH/MySQL port scanning, service brute-forcing, reverse-shell generation), and a curl-driven email-harvesting workflow. SilkLurk victims additionally received PlugX as a second-stage payload via a DLL-sideload chain against legitimate Symantec binaries — Kaspersky's own inference: "This suggests that both OctLurk and SilkLurk were also developed and operated by a Chinese-speaking actor" (PlugX's ~2008-vintage, historically Chinese-speaking-actor lineage supporting the attribution). SilkLurk post-compromise activity additionally shows an active-hands-on-keyboard exfiltration workflow: `net use` to mount shares with harvested admin credentials, manual search of shared drives for confidential documents, then archiving via WinRAR or 7-Zip prior to exfiltration.

      Infrastructure overlap (source-stated, not inferred): "Some OctLurk and LurkProxy C2 addresses are referenced in a public report by Kazakhstan's State Technical Service (STS)," which documented a March 2025 campaign against Kazakhstani critical infrastructure using a Linux-targeting RAT the STS calls TrustFall (aka MystRodX per Qianxin, aka SilentRaid per Cisco Talos). "Three observed TrustFall C2 addresses were also leveraged by OctLurk and LurkProxy. This overlap points to shared infrastructure across multiple OS-targeting campaigns, though it remains unclear whether these activities ran concurrently or at different times." Confidence/attribution, exact wording: "We assess with medium confidence that the same actor is behind both backdoors, and that they are Chinese-speaking. However, at the time of publication, we couldn't attribute this activity to any known group." Victims (exact wording): "Identified victims are located in Afghanistan, Kyrgyzstan, Tajikistan, Uzbekistan, Kazakhstan, and the Syrian Arab Republic," across "healthcare, research, government offices, ministries of foreign affairs, logistics, law-enforcement agencies, urban planning and facilities management, and public educational establishments."
    region_nexus: "out-of-nexus (Central Asia and Syria government targets); the credential-harvesting/plugin-backdoor architecture (service-based DLL sideload, double-XOR+zlib obfuscation, in-memory plugin loading, Impacket secretsdump usage, TrustFall/MystRodX/SilentRaid infrastructure overlap) is directly transferable tradecraft and hunt signal for any government-sector detection team"
