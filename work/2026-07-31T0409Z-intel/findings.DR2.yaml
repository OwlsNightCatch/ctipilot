  - title: "Kaspersky: Toy Ghouls upgrades to a custom Windows+Linux/ESXi ransomware, GenieLocker — no ransom note left on disk, in-band manual demand only"
    deep_read: true
    sources:
      - { url: "https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/", publisher: "Kaspersky Securelist (Malware descriptions)", date: "2026-07-30", role: "primary" }
    discovery_trace: "deep-read re-fetch of the S3-discovered primary, URL https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/ (full raw HTML body fetched via bridge and parsed for exact wording; datePublished confirmed 2026-07-30T08:00:57+00:00)"
    summary: |
      Deep-read enrichment of the S3-discovered Kaspersky report. Initial access, Kaspersky's own words: "During the incident, the attackers first entered the environment through an OpenVPN connection originating from an external partner's network. They likely exploited the trusted relationship with that partner and used stolen, yet still valid, credentials to connect." No exploit or vulnerability is involved — this is a trusted-third-party-VPN + valid-credential-abuse initial-access path (a supply-chain/partner-trust vector, not a technical vulnerability).

      Anti-analysis design, full mechanics: GenieLocker (Windows build: MSVC-compiled C/C++, libsodium for cryptography) requires its first command-line argument to be a variable-length hex string ("the 'secret argument'," up to 4096 bytes) which is converted to bytes and hashed with SHA-256; the result is compared against a hard-coded value, and execution proceeds only on a match. Kaspersky notes an unused-artifact detail: on a successful match, the literal string "session" is appended to the secret value and the whole string is hashed again with BLAKE2b-256 — "but the resulting hash is never used. This may be a part of a feature still in development." Kaspersky's own assessment of the gate's purpose: "avoid execution on sandboxes and other automated analysis environments... Another reason may be to prevent unauthorized usage by other threat actors" (i.e., doubles as an affiliate/customer access-control mechanism). After the secret-argument check passes, GenieLocker spawns a parallel thread named `watchdog` running an infinite loop that polls for known debuggers "every 500 milliseconds" via `IsDebuggerPresent` and `CheckRemoteDebuggerPresent`; on top of this, at watchdog-thread startup it computes a CRC32 hash of the process's own `.text` section, saves it, and recomputes/compares it on every loop iteration — "In case the code in this section is modified by the debugger or other program, this method allows the Trojan to detect this modification." Any single check failure across either mechanism causes the entire process to terminate immediately, with no partial-encryption fallback described.

      Deliberate ransom-note absence, exact wording: "Aligned with the recent trend supported by our expertise, as observed in attacks of some other ransomware strains, GenieLocker doesn't save the ransom notes on the victim's system. The Trojan doesn't contain any attackers' contact info or negotiation addresses. Instead, the attackers will need to deliver the ransom demands and contacts manually during the attack. This approach may be an attempt by the GenieLocker developers to avoid proactive detection of the ransomware process being triggered by the creation of multiple readme files." — i.e., a deliberate design choice to defeat mass-README-drop heuristic/behavioral detections, at the cost of requiring the operators to maintain out-of-band victim contact themselves.

      ESXi/Linux build: "On the compromised Linux and ESXi servers, they stopped active virtual machines and encrypted their disks using the ELF version of GenieLocker." Kaspersky does not document the specific stop mechanism (no `esxcli`/`vim-cmd` command sequence given in the analyzed sample write-up) — treat "stops running VMs before encrypting their backing disks" as the confirmed behavior without over-specifying the implementation. The ELF/ESXi build is architecturally simpler than the Windows build — "there is no secret argument, anti-debugging techniques, or exclusion lists" — but adds ESXi-specific features: double-fork process daemonization support and the ability to overwrite the ESXi Welcome Message (`/etc/vmware/welcome`, the hypervisor's MOTD) — in the analyzed sample this was left blank rather than replaced with a ransom message, consistent with the on-disk-note-avoidance design choice extending to the ESXi build too. Default encryption directory for the ESXi build is `/vmfs/volumes` (can still be pointed at ordinary Linux paths).

      Deployment tooling and lateral movement: "Lateral movement was performed by using RDP to reach Windows machines and SSH for Linux servers. The widespread deployment of the encryption Trojan was conducted with the legitimate utilities PsExec and PAExec. Additionally, the attackers established a reverse SSH tunnel to communicate with their command-and-control server." Discovery/credential-access tooling deployed post-access: SoftPerfect Network Scanner (discovery), Mimikatz (credential dumping), and forensically-observed access to the already-installed KeePassXC password manager on several compromised machines, "likely attempting to extract the stored credentials from the KeePass databases" — i.e., targeting a local password-manager database rather than browser-stored credentials, a discriminator worth flagging for hunt teams that only watch browser credential-store paths.

      Data exfiltration: explicitly assessed as absent — "forensic analysis found no evidence of data exfiltration, which is typical behavior for this threat actor. Toy Ghouls have not employed a double-extortion model and do not run a data-leak website." Group alias set, exact wording: "The Toy Ghouls, also known as Bearlyfy, Labubu and Laboo.boo, is a financially motivated extortion group, which previously relied on third-party encryption Trojans like RedAlert, LockBit, and Babuk." Attribution basis: "attributed to the Toy Ghouls group by open-source intelligence (link in Russian)" — Kaspersky cites a Russian-language OSINT source (securitylab.ru, attributed to Russian threat-intel firm F6) for the group attribution, not its own first-party attribution; treat the Toy Ghouls↔GenieLocker link as OSINT-sourced rather than Kaspersky-first-party, though Kaspersky's own prior TTP tracking of Toy Ghouls (referenced but not itself re-verified here) supports the match. Victim: Russian Federation manufacturing-sector organization, intrusion end of March 2026.

      Encryption routine: libsodium-based; folder exclusions include Windows system directories (`$recycle.bin`, `program files`, `programdata`, `windows`, `boot`, etc.) and a long system/executable file-extension exclusion list (`.exe`, `.dll`, `.sys`, `.lnk`, etc., plus `.lock`/`.key` to avoid double-encrypting its own artifacts); default chunk size 0x1000000 bytes (16 MiB) on Windows vs. 0x400000 bytes (4 MiB) on ESXi/Linux. Command-line arguments (Windows): secret hex value (positional, required), `-p/--percent N` (encryption percentage — i.e., partial/intermittent encryption support), `-r/--recursive`, `-l/--log <file>`, target path (positional); ESXi/Linux adds `-j <workers>` (thread count), `-w <sec>` (start delay), `-d` (daemonize).
    region_nexus: "out-of-nexus (Russian Federation manufacturing-sector victim; Toy Ghouls' documented targeting is Russia-focused); the trusted-partner-VPN initial-access vector, KeePassXC password-manager-database targeting, hashed-secret-argument sandbox evasion, and PsExec/PAExec-driven Windows+Linux/ESXi dual-platform encryption are directly transferable tradecraft for any organization with third-party VPN access or hypervisor estates"
