  item: "CVE-2026-86206 / CVE-2026-86207 / CVE-2026-86218 — N-able N-central: a third, unrelated auth-bypass/RCE chain in five weeks"
  url_or_quote: "cves[].auth: pre-auth (CVE-2026-86207) vs OffSeq's own cvssVector: CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N"
  summary: "CVE-2026-86207's frontmatter auth field says pre-auth; its own cited CNA record (OffSeq, assigner N-able) encodes PR:L/AT:P (some privileges + attack conditions required), unlike its two sibling CVEs which genuinely carry PR:N/AT:N. Not disclosed in sourcing_note, which only addresses the CVSS-score (not auth-level) vendor-blog-vs-CNA discrepancy."
