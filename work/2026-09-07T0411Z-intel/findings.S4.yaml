        attribution: "FrenchBreaches (2026-09-06)"
        source_url: "https://frenchbreaches.com/alertes/aveyron-mtp0hyfwss6ietkec1q"
      - quote: "Le hacker ne précise toutefois pas la méthode utilisée pour obtenir ces informations. Rien ne permet à ce stade de déterminer si l'accès provient directement de la plateforme d'emploi, de son extranet ou d'un autre composant de l'écosystème En Aveyron."
        attribution: "Cyberattaque.org (2026-09-06)"
        source_url: "https://www.cyberattaque.org/aveyron-cyberattaque-emplois/"
      - quote: "Le pirate ChimeraZ revendique les données de 20 316 personnes ainsi que près de 1 500 documents PDF, dont des CV contenant de nombreuses informations personnelles et professionnelles."
        attribution: "FrenchBreaches (2026-09-06)"
        source_url: "https://frenchbreaches.com/alertes/aveyron-mtp0hyfwss6ietkec1q"
    extended_notes: |
      Item-granularity note: the same actor (ChimeraZ) also claimed a second French victim the same
      day — Pass Pass, a Hauts-de-France regional mobility/ticketing service (~18,861 people, per
      FrenchBreaches, https://frenchbreaches.com/alertes/passpass-mtokkaq53s0e7hlda1i, 2026-09-05) — but
      that platform's public-sector ownership status and access vector are both less clearly established
      than Aveyron's, so it was deliberately left out of this item rather than folded in or given its own
      entry, to avoid diluting the clearer, better-sourced Aveyron finding. Worth a bounded re-check if a
      later fire needs to decide whether it clears the bar on its own.
      Registry note: actor:chimeraz already exists (tied to campaign:france-sdis-data-leaks-2026, which
      is explicitly scoped to fire-and-rescue services); this Aveyron incident is a distinct victim type
      outside that campaign's scope, so no relation_suggestion is offered — the connection is stated here
      as analytic context (same forum handle, expanding target set) rather than a source-stated typed
      relation between two registry entities.
  - title: "ShinyHunters lists Medela AG (Baar, Zug) on its leak site — bare extortion claim, no corroboration, too fresh to verify"
    sources:
      - { url: "https://www.ransomware.live/id/TWVkZWxhLmNvbUBzaGlueWh1bnRlcnM=", publisher: "Ransomware.live", date: "2026-09-07", role: "primary" }
    discovery_trace: "first seen at: ransomware.live RSS feed (source id ransomware-live), URL https://www.ransomware.live/rss.xml → primary (no pivot found): the group's own listing page, URL https://www.ransomware.live/id/TWVkZWxhLmNvbUBzaGlueWh1bnRlcnM= → WebSearch corroboration attempts (\"Medela ShinyHunters ransomware breach\"; \"Medela cyberattack statement September 2026\"; \"Medela Cyberangriff Datenleck 2026\") found no victim statement or press pickup of any kind"
    summary: |
      Ransomware.live recorded on 2026-09-07 01:32 UTC that ShinyHunters added Medela AG — a Swiss
      medical-device manufacturer (breast pumps and neonatal/vacuum-therapy equipment) headquartered in
      Baar, canton Zug — to its extortion leak site, with a "final warning" deadline of 2026-09-08. The
      listing itself states a small claimed scope (1 compromised employee, 38 compromised users, 56
      third-party employee credentials, 19 external attack-surface points) that reads more like an
      external attack-surface/exposure scan result than a confirmed data-theft claim, and carries no
      description of an access vector or data categories beyond that count. No press in any language
      (English, German) and no statement from Medela were found despite a targeted search; this is a
      same-day, single-source leak-site posting with no independent corroboration.
