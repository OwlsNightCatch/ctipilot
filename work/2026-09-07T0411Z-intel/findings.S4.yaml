items:
  - title: "ChimeraZ claims a French département's employment platform, exposing 20,000+ job candidates' CVs — access-vector claim (compromised no-MFA partner account, IDOR, misconfigured Odoo DB) is single-sourced and contradicted by a second independent reviewer"
    sources:
      - { url: "https://frenchbreaches.com/alertes/aveyron-mtp0hyfwss6ietkec1q", publisher: "FrenchBreaches", date: "2026-09-06", role: "primary" }
      - { url: "https://www.cyberattaque.org/aveyron-cyberattaque-emplois/", publisher: "Cyberattaque.org", date: "2026-09-06", role: "primary" }
      - { url: "https://fuitesinfos.fr/article/2026-09-05-onrecrute-en-aveyron-aveyron-attractivite", publisher: "Fuites Infos", date: "2026-09-05", role: "corroborating" }
    discovery_trace: "first seen at: frenchbreaches (source id frenchbreaches), URL https://frenchbreaches.com/ (listing showed the Aveyron alert) → primary: FrenchBreaches' own alert page, URL https://frenchbreaches.com/alertes/aveyron-mtp0hyfwss6ietkec1q → corroboration pivot via WebSearch (\"OnRecrute.enAveyron Département Aveyron fuite données ZATAZ\") → independent second reviewer: Cyberattaque.org, URL https://www.cyberattaque.org/aveyron-cyberattaque-emplois/ → tertiary corroboration found via WebSearch: Fuites Infos, URL https://fuitesinfos.fr/article/2026-09-05-onrecrute-en-aveyron-aveyron-attractivite (not separately fetched this run, title/date only)"
    summary: |
      The threat actor ChimeraZ — a criminal-forum handle this store already tracks for a recurring
      data-theft campaign against French departmental fire-and-rescue services (SDIS) — claimed on
      2026-09-05 to have exfiltrated and published data from OnRecrute.EnAveyron.fr, an employment/CV
      platform operated by the Département de l'Aveyron through its Agence Départementale de
      l'Attractivité et du Tourisme (ADAT). Two independent breach-tracking outlets, FrenchBreaches and
      Cyberattaque.org, each state they obtained and directly analysed the leaked files rather than
      merely relaying the forum post, and both corroborate the same scope: 23,381 records covering
      20,316 people and roughly 1,499 PDF documents (~451 MB) — predominantly job-seeker CVs — for a
      total claimed dataset of ~465 MB. Exposed fields include names, email addresses, phone numbers,
      postal codes/communes, and — within the CV documents specifically — dates of birth, driving
      licence status, education, employment history and named former employers. Cyberattaque.org notes
      several candidate profiles were created or updated as recently as August 2026, indicating the
      exposed data was live production data, not a stale archive.
      The access-vector claim is where the two trackers diverge and neither is a victim statement.
      FrenchBreaches alone reports the mechanism as a compromised partner/customer account lacking
      multi-factor authentication, combined with an IDOR (Insecure Direct Object Reference) flaw that
      granted access to a misconfigured Odoo database from which the data was extracted, adding that no
      detection of the malicious activity has occurred to date. Cyberattaque.org, which independently
      obtained and reviewed the same files, explicitly declines to confirm any mechanism, stating the
      hacker did not specify the access method and that nothing in the leak establishes whether access
      came from the employment platform itself, its extranet, or another component of the wider "En
      Aveyron" ecosystem. No statement has been issued by the Département de l'Aveyron, the ADAT, or the
      platform operator as of this run. ChimeraZ is a known escalating actor: the store's registry
      record already ties this handle to the SDIS fire-and-rescue campaign (five departmental
      fire-and-rescue services hit July–August 2026); this incident shows the same actor now reaching
      French departmental administrative services outside the fire-and-rescue vertical, via a
      third-party/partner-account foothold into a business-application (Odoo) backend — a pattern
      directly transferable to Swiss cantonal and communal administrations that run comparable
      outsourced CRM/ERP-backed citizen or partner portals.
    region_nexus: "France (Département de l'Aveyron, Occitanie) — EU-neighbour local/departmental government administration; the actor and technique class are directly transferable to Swiss cantonal/communal administrations running comparable outsourced Odoo/CRM-backed citizen or partner portals"
