    extended_notes: |
      RECENCY / PROVENANCE NOTE FOR THE MAIN AGENT: this item's primary source (Rapid7, 2026-09-03) and
      corroborating source (The Hacker News, 2026-09-04) both predate this run's 24h window
      (window_hours=24, anchor 2026-09-07T04:11:40Z). It is included per explicit spawn-message tasking:
      "state/coverage_backlog.md ... Rapid7's 'Ted backdoor and curlRAT' research ... this was flagged as the
      strongest of four held-back PD-11(d) research items ... should be the first published if a fire has
      room." Per coverage_backlog.md's own header, backlog rows are "exempt from the recency gate." No
      fresher (in-window) follow-up coverage of this specific story was found by this run (Rapid7's own blog
      listing and a further WebSearch pass surfaced nothing newer). Suggest composing as a `threat` entry with
      `priority: notable` (own registry/backlog language: "none is critical or high severity for this
      constituency... the strongest of the four [and] should be the first published"); discovered_at should
      probably reflect today's run per the entry-lifecycle convention for backlog recoveries.

      DETECTION / HARDENING SPECIFICS (source-supported, no IOCs):
      - Telemetry class: binary-integrity verification of edge-host system daemons (haproxy, crond, agetty,
        atd, polkitd, sshd) against package-manager-recorded checksums (rpm -V / debsums-class tooling) run
        out-of-band from the host itself - the compromise replaces binaries in place rather than exploiting a
        flaw, so a vulnerability scan or HAProxy's own version string will not reveal it (a recompiled binary
        still reports the same version string as a clean build, per The Hacker News's read of the report).
      - Telemetry class: independent network capture/NetFlow at the network edge (or a downstream device's own
        access log) correlated against the load balancer's self-reported connection/request counters - a
        discrepancy where externally observed request volume exceeds what HAProxy's own statistics record is
        the core discriminator this technique defeats internally.
      - Telemetry class: process/thread-creation monitoring on the haproxy process itself (unexpected
        pthread_create activity, unexpected named-pipe/FIFO file creation under /tmp keyed to a connection ID)
        and file-integrity monitoring on non-standard cache/config paths the running HAProxy configuration does
        not reference.
      - Hunt technique: absence-of-evidence hunting - a near-total absence of routine keywords (cron, crond,
        wget, tmp) across bash_history and the affected system-log set on a host where such activity would
        normally be routine is itself the anomaly this toolkit's log-scrubbing produces, rather than their
        presence.
      - Hunt technique: cross-reference system-daemon binary ctime/mtime against the package manager's own
        install/update transaction history rather than against each other - the observed technique
        deliberately timestomps the replaced binary to match another system binary's timestamp, defeating a
        same-host-only comparison.
      - Triage / benign lookalike (source-supported): a legitimate in-house HAProxy Lua/filter module can
        also hook the HTTP parser and modify response bodies; the discriminating feature Rapid7's mechanism
        supports is that no operationally normal filter needs to actively decrement or zero HAProxy's own
        connection/traffic counters - any module doing so (as opposed to only reading them) warrants
        investigation.
      - Hardening: apply the same binary-integrity and patch discipline to edge/load-balancer components as to
        application servers; do not rely on HAProxy's own logs/stats as an audit trail for that host; harden
        and monitor exposed Groupware/webmail portals sitting on the same edge host (the suspected, unconfirmed
        initial-access class); restrict outbound HTTPS from load-balancer/edge hosts to operationally required
        destinations only.

