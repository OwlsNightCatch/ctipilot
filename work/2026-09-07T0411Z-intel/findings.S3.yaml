items:
  - title: "Rapid7: DPRK-nexus actor compiles a custom C2 filter directly into a victim's own HAProxy source tree (\"ted backdoor\"), pairs it with a curl-based RAT trojanizing crond/agetty/atd/polkitd on South Korean edge servers"
    sources:
      - { url: "https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/", publisher: "Rapid7 Labs", date: "2026-09-03", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/new-ted-backdoor-hides-inside-victims.html", publisher: "The Hacker News", date: "2026-09-04", role: "corroborating" }
    discovery_trace: "first seen at: state/coverage_backlog.md backlog row (surfaced 2026-09-06 by 2026-09-06T1308Z-audit, held below the recovery bar as one of four PD-11(d) research items, flagged strongest of the four and worth prioritizing) → primary: Rapid7 Labs, URL https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/09/new-ted-backdoor-hides-inside-victims.html"
    summary: |
      Rapid7 Labs documented a previously undocumented Linux espionage toolkit against two South Korean
      automotive- and media-sector organizations, active since at least early 2025, attributed with medium
      confidence to a DPRK-nexus actor via infrastructure overlap (ThreatFox / maltrail both tag the hardcoded
      C2 domain list to APT37). Rather than exploiting a HAProxy vulnerability, the actor obtained code
      execution on the host and recompiled the victim's own HAProxy 2.8.12 source tree to embed a custom
      filter plugin ("ted_plugin") that hooks HAProxy's native HTTP parser, memory-pool allocator and event
      scheduler. Using hardcoded 2.8.12 struct offsets, the implant decrements HAProxy's own live-connection
      counters (per-backend beconn/feconn, global actconn, and the 64-bit cum_conn/cum_req/bytes_in/bytes_out
      fields) after every C2 exchange, so command traffic terminates at the load balancer and never appears in
      backend logs or load-balancer statistics. A request to one hardcoded static-asset-style path flips the
      filter into C2 mode (beacon, file upload/download, shell command execution via popen, config update);
      outside that mode the filter can also passively capture session cookies and selected HTTP headers, or -
      when four conditions are met (User-Agent present and pattern-matched, a byte-substring selecting a 32-
      or 64-bit payload path, a URL+referer regex match, and either IP allow/deny-list membership or an
      operator key smuggled in the Accept-Language header that overrides IP filtering entirely) - substitute or
      append attacker-supplied content into the HTTP response body using HAProxy's own body-editing/data-filter
      callbacks, rewriting Content-Type/Content-Length and stripping Accept-Ranges so the size change is
      invisible to the client. A companion RAT ("curlRAT" - libcurl-based, hence the name) is compiled into
      trojanized replacements of crond, agetty, atd and polkitd; it polls a hardcoded C2 over HTTPS (HTTP
      fallback) every 12 hours by default (30 seconds in an operator-set fast-poll mode), decodes tasking
      through a Base64-plus-rolling-XOR pipeline, and offers command execution, file transfer, an interactive
      PTY/reverse shell that calls setuid(0)/setreuid(0,0) before handoff, and a watchdog thread that polls
      /proc/<pid> hourly to report HAProxy's started/stopped/restarted/reloaded state back to the operator. A
      stager component deploys only when HAProxy or cron is already present, verifies root, overwrites the
      legitimate crond binary in place, timestomps the replacement to match /usr/bin/ssh's creation time, and
      scrubs the keywords tmp/wget/cron/crond from root's bash history and six system logs including auth.log
      and audit/audit.log via a staging file named to resemble a JSP engine artifact. A separate trojanized
      sshd intercepts plaintext credentials into an encrypted log file. Rapid7 could not establish the initial-
      access vector with certainty but notes both victims ran an exposed Groupware login portal and mail
      server on the same edge host - a plausible entry point Rapid7 says is consistent with documented Kimsuky
      tradecraft against Korean groupware vendors. The watering-hole delivery model otherwise overlaps
      Kaspersky's Operation SyncHole (Nov 2024-Feb 2025), which Kaspersky attributed to Lazarus; Rapid7
      explicitly flags that APT37 and Lazarus are organizationally distinct DPRK clusters (per Mandiant's 2023
      structure assessment) operating under different agencies, so the attribution rests on three separate,
      only partially reconciled evidentiary threads (APT37 via the C2 domain list, Lazarus via the delivery
      model, Kimsuky via the initial-access hypothesis) rather than a single confirmed cluster.
    region_nexus: "South Korea (automotive and media sectors); the technique class - compiling covert C2 directly into an internet-facing edge daemon's own source tree so its self-reported telemetry cannot be trusted - is directly transferable to any organization, including Swiss public-sector estates, running HAProxy or comparable load-balancer/reverse-proxy software at the network edge"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (edge network infrastructure / load balancers)"
