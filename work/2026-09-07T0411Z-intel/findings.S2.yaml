        attribution: "Recorded Future Insikt Group"
        source_url: "https://www.recordedfuture.com/research/h1-2026-malware-vulnerability-trends"
    extended_notes: |
      Backlog item state/coverage_backlog.md #3 asked specifically for the tool-stack-reuse-across-CVEs
      section rather than the vanity-metric headline figures (215 exploited CVEs, AsyncRAT top malware,
      etc.) — this item deliberately centers that section. The report also covers AI-enabled malware
