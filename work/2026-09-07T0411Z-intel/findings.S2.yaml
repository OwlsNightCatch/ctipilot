items:
  - title: "Berlin Landesnetz leak confirmed to include critical-infrastructure and defense-industrial records; BSI warns of hack-and-leak risk ahead of 20 September state election"
    sources:
      - { url: "https://www.heise.de/news/Cyberangriff-Berlin-mit-Steuerungseinheit-will-Betroffene-kontaktieren-11442896.html", publisher: "Heise Online", date: "2026-09-06", role: "primary" }
      - { url: "https://www.heise.de/news/BSI-warnt-nach-Daten-Leak-vor-erhoehter-Cyber-Bedrohung-11442510.html", publisher: "Heise Online (BSI direct statement)", date: "2026-09-05", role: "primary" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml -> article: Heise Online, URL https://www.heise.de/news/Cyberangriff-Berlin-mit-Steuerungseinheit-will-Betroffene-kontaktieren-11442896.html -> corroborating: Heise Online (BSI statement), URL https://www.heise.de/news/BSI-warnt-nach-Daten-Leak-vor-erhoehter-Cyber-Bedrohung-11442510.html"
    summary: |
      This is a material update to the already-tracked Berlin Landesnetz/Rhysida entry. After the Berlin
      state government refused the roughly EUR 2 million ransom demand, the actor published ~1.44 million
      files (5.8 TB) from the compromised shared state government network (Landesnetz) on 2026-09-04.
      Follow-up reporting (Der Tagesspiegel, cited by Heise 2026-09-06) establishes for the first time that
      the leak goes well beyond the personnel data first identified: it includes records tied to water
      supply, district-heating/power plants, fuel depots, backup-power installations, electrical substations,
      prisons, and defense-industrial/Bundeswehr-related material. Germany's BSI issued a public statement
      (2026-09-05) warning of an elevated threat level from the leak: a heightened targeted-phishing risk
      against anyone who had contact with affected individuals or institutions, and separately a hack-and-leak
      risk given Berlin's 20 September state election, while stating it assesses the underlying intrusion
      itself as financially rather than politically motivated. Berlin's government has since (2026-09-06) set
      up a dedicated coordination unit ("Steuerungseinheit") in which BSI, BKA and the domestic intelligence
      service BfV jointly review the leaked material, and started a risk-based letter/email notification
      process for affected citizens, employees and companies. Independent IT-security expert Manuel Atug
      publicly accused the state of "grobe Fahrlässigkeit" (gross negligence) for failing to meet mandatory
      Geheimschutz (classified-information handling) requirements he says he had already flagged to Berlin's
      parliamentary interior committee in 2023 and 2025.
    region_nexus: "Germany (Berlin state government), a neighbouring DACH jurisdiction; directly transferable lesson for Swiss federal/cantonal administrations given comparable shared-network architecture (a single Landesnetz-style backbone serving multiple administrative units) and comparable classified/CI-relevant information-handling obligations."
    primary_sector_nexus: "direct"
    sector: "public-sector"
