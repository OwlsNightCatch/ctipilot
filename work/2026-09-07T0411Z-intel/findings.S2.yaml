  - title: "Homemade wire-slinging devices short-circuit German extra-high-voltage substations from outside the fence line, tripping 4,200 MW of lignite generation"
    sources:
      - { url: "https://www.heise.de/hintergrund/Draht-statt-Sprengstoff-Angriffe-auf-Umspannwerke-und-Grenzen-der-Netzredundanz-11442322.html", publisher: "Heise Online", date: "2026-09-05", role: "primary" }
      - { url: "https://www.amprion.net/Presse/Presse-Detailseite_98753.html", publisher: "Amprion (transmission system operator, own statement)", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml -> article: Heise Online, URL https://www.heise.de/hintergrund/Draht-statt-Sprengstoff-Angriffe-auf-Umspannwerke-und-Grenzen-der-Netzredundanz-11442322.html -> corroborating: Amprion press statement, URL https://www.amprion.net/Presse/Presse-Detailseite_98753.html"
    summary: |
      Between 1-3 September 2026, a series of confirmed sabotage attempts hit Germany's extra-high-voltage
      transmission grid in Brandenburg (Turnow-Preilack, near the Jänschwalde lignite plant) and North
      Rhine-Westphalia (Amprion's Rommerskirchen substation). Perpetrators used homemade launch devices to
      sling bare conductive wire over uninsulated 220/380kV overhead lines from open ground outside any
      perimeter fence, producing a phase-to-ground short that ignited a sustained arc; protective relaying
      isolated the affected lines before general supply was interrupted in either case. At Rommerskirchen
      the fault propagated into RWE Power's Neurath and Niederaußem lignite units, forcing roughly 4,200 MW
      of combined generation offline (two units, ~1,600 MW, returned within hours; the rest over the
      following day/weekend). State criminal police recovered more than 20 homemade rocket-type devices
      across sites in Brandenburg, North Rhine-Westphalia and Saxony, plus explicit-motive letters naming
      further targets including the Weisweiler power plant; one suspect remains at large. Heise's technical
      analysis states the underlying weakness plainly: overhead HV conductors carry no insulation beyond
      the air gap itself, so any conductive object bridging phase-to-ground triggers a fault irrespective of
      fencing, cameras or access control, and the resulting arc persists as a conductive plasma channel
      until protection equipment — not the melted wire — clears it. The attack therefore needs no site
      access at all, only line-of-sight from tens of meters away, which the article notes also defeats the
      drone-countermeasure debate currently under policy discussion for private grid operators.
    region_nexus: "Germany (neighbouring EU state, interconnected European transmission grid); directly transferable OT/physical-security lesson for Swiss transmission infrastructure (Swissgrid) and cantonal/federal critical-infrastructure protection given Switzerland's own overhead 220/380kV lines and comparable substation perimeter-security posture. Precedent: BACS's own H1/2026 half-year report devoted a chapter to the Polish energy-grid sabotage as a directly actionable KRITIS lesson for Swiss defenders (already tracked, entry 2026-08-24/bacs-halbjahresbericht-2026-1-poland-sabotage-dream-job)."
    primary_sector_nexus: "indirect"
    sector: "critical-infrastructure"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    classification: { reliability: "B", credibility: "1" }
    evidence:
      - quote: "Die Täter sollen selbstgebaute Abschussvorrichtungen eingesetzt haben, um Drähte in Freileitungen zu schleudern."
        attribution: "Heise Online"
        source_url: "https://www.heise.de/hintergrund/Draht-statt-Sprengstoff-Angriffe-auf-Umspannwerke-und-Grenzen-der-Netzredundanz-11442322.html"
      - quote: "RWE Power nahm der Konzern daraufhin fünf Braunkohleblöcke in Neurath und Niederaußem mit zusammen rund 4200 Megawatt Leistung vom Netz."
        attribution: "Heise Online (citing RWE Power)"
        source_url: "https://www.heise.de/hintergrund/Draht-statt-Sprengstoff-Angriffe-auf-Umspannwerke-und-Grenzen-der-Netzredundanz-11442322.html"
      - quote: "Zäune, Kameras und Zutrittskontrollen helfen gegen Eindringlinge, nicht gegen Angriffe aus einigen Dutzend Metern Entfernung – und noch weniger gegen Drohnen"
        attribution: "Heise Online"
        source_url: "https://www.heise.de/hintergrund/Draht-statt-Sprengstoff-Angriffe-auf-Umspannwerke-und-Grenzen-der-Netzredundanz-11442322.html"
      - quote: "Mit hoher Wahrscheinlichkeit ist von einer Fremdeinwirkung auszugehen. Die allgemeine Stromversorgung war zu keinem Zeitpunkt davon betroffen und die Systemstabilität immer gewährleistet."
        attribution: "Amprion (transmission system operator, own press statement)"
        source_url: "https://www.amprion.net/Presse/Presse-Detailseite_98753.html"
    extended_notes: |
      This is physical/kinetic sabotage, not a cyber intrusion — no MITRE ATT&CK enterprise technique
      applies and no digital access vector is involved, hence techniques: []. Carried here because the
      pipeline has already set precedent for treating grid-sabotage physical security as an
      organization-relevant KRITIS lesson (see the BACS half-year report entry on the Polish grid
      sabotage). Main agent should weigh whether a non-cyber physical-security item belongs in a CTI brief
      at all, versus dropping or holding for the next quality-audit's KRITIS/OT sweep.
    borderline: true
    borderline_reason: "Physical/kinetic sabotage of energy-grid infrastructure, not a cyber intrusion — no ATT&CK mapping applies. Included for KRITIS/OT-defense transferable-lesson value given explicit pipeline precedent (BACS half-year report's own treatment of the Poland grid sabotage), but the fit against a strictly cyber-intelligence brief is genuinely borderline."

