        source_url: "https://www.heise.de/news/Cyberangriff-Berlin-mit-Steuerungseinheit-will-Betroffene-kontaktieren-11442896.html"
    extended_notes: |
      BSI's own assessment ("ausschließlich finanziell motiviert") should be carried as BSI's attributed
      assessment, not fact — it directly contradicts the alarmed political framing ("Daten-Super-GAU",
      national-security risk) from opposition politicians quoted in the same piece, which is itself
      political commentary rather than a technical finding. Both should be attributed to their speakers if
      carried into the entry.

  - title: "Recorded Future's H1 2026 report: two clusters show the same post-exploitation tool stack reused across thirteen and ten unrelated initial CVEs"
    sources:
      - { url: "https://www.recordedfuture.com/research/h1-2026-malware-vulnerability-trends", publisher: "Recorded Future (Insikt Group)", date: "2026-09-03", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Recorded Future Insikt Group \\\"H1 2026 Malware and Vulnerability Trends\\\"\") -> primary: Recorded Future, URL https://www.recordedfuture.com/research/h1-2026-malware-vulnerability-trends (no pivot needed)"
    summary: |
      Recorded Future's Insikt Group published its H1 2026 Malware and Vulnerability Trends report on
      2026-09-03, tracking 215 actively exploited CVEs in H1 2026 (up 34% from 161 in H1 2025); 176 (82%)
      were network-accessible, 146 (68%) required no prior authentication, and 142 of those 146 combined
      both properties. Sixty of 82 RCE vulnerabilities combined network reachability, no-auth exploitation
      and code execution. The report's most actionable finding for defenders is that tool-stack reuse
      persists across otherwise-unrelated initial-access vulnerabilities: a cluster the report designates
      StrikeShark applied an identical six-tool post-exploitation stack — SharkLoader, Cobalt Strike Beacon,
      FScan, Searchall, Pillager Stealer, and SharpGPOAbuse — across thirteen separate CVEs spanning 2016
      through 2025 in Microsoft Exchange/SharePoint, Fortinet FortiOS, Cisco IOS XE, F5 BIG-IP, GeoServer
      and Apache Shiro. Separately, Storm-1175 linked Mimikatz, Impacket, PsExec, Rclone and Medusa
      ransomware across ten different initial CVEs (a China-linked cluster the report calls
      SHADOW-EARTH-053 separately reused Mimikatz against CVE-2021-26855 in Microsoft Exchange). Insikt
      mapped 114 of the 215 CVEs to MITRE ATT&CK: Exploit Public-Facing Application (T1190) applied to 77
      CVEs (68%), and 50 of those 77 also co-occurred with PowerShell/Windows Command Shell/Unix Shell
      execution (T1059.001/.003/.004); all 28 web-shell-associated CVEs (T1505.003) also carried T1190.
      The report's defender-facing takeaway is explicit: because the same limited tool stack recurs
      regardless of which vulnerability supplied the initial foothold, detection engineering should chain
      exploitation telemetry from public-facing systems through to the post-exploitation behaviors these
      clusters repeat — credential dumping, remote-service execution via native Windows admin mechanisms,
      bulk outbound data transfer, and ransomware staging — rather than treating each CVE alert as an
      isolated, one-off event.
    region_nexus: "global (vendor threat-intelligence synthesis; no Switzerland-specific finding, but the vulnerable product families named — Exchange, SharePoint, FortiOS, Cisco IOS XE, F5 BIG-IP — are common in Swiss public-sector estates)"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
