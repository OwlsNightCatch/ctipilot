  - title: "VMSA-2026-0007 (CVE-2026-59346 VMXNET3 guest-to-host escape, VMware Workstation/Fusion) — coverage-backlog check: no exploitation reports, and the flaw does not reach ESXi"
    sources:
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288", publisher: "Broadcom/VMware Security Advisory (vendor)", date: "2026-09-03", role: primary }
    discovery_trace: >
      first seen at: coverage-backlog tasking (state/coverage_backlog.md) → primary: Broadcom
      VMSA-2026-0007 advisory, URL
      https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288
      → corroboration: WebSearch ("VMSA-2026-0007 CVE-2026-59346 exploitation ESXi") — no
      independent exploitation reporting found.
    summary: |
      Backlog check, not a new finding: Broadcom's VMSA-2026-0007 (issued 2026-09-03, also
      surfaced by NCSC-CH CSH post #12912 the same day) scopes CVE-2026-59346 (VMXNET3 integer
      overflow, CVSS3.1 9.3) and its sibling CVE-2026-59347 (HGFS stack overflow, CVSS3.1 8.1) to
      VMware Workstation and Fusion ONLY — the response matrix lists no ESX/ESXi or vCenter product
      row, unlike the earlier VMSA-2026-0006 (CVE-2026-47876, a different VMXNET3 escape CVE already
      in this store) which did affect ESX. Broadcom's own advisory states "Known Attack Vectors: A
      malicious actor with local administrative privileges on a virtual machine with VMXNET3 virtual
      network adapter may exploit this issue to execute code on the host" with no exploitation
      language. No public PoC or in-the-wild exploitation report was found via WebSearch as of this
      run (2026-09-07). Conclusion for the backlog row: does not clear the recovery bar — no update
      needed on the existing store (there is in fact no existing entry for VMSA-2026-0006/0007 in the
      14-day prior-coverage window at all; VMSA-2026-0006 predates that window).
