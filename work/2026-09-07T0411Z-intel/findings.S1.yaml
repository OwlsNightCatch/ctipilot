        attribution: "N-able Status (HF4 release notes)"
        source_url: "https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/"
      - quote: "A vulnerability in the N-central internal API access control filter allows unauthorised access to internal APIs. This is fixed in N-central 2026.3 HF3 and 2026.4"
        attribution: "OffSeq Threat Radar (CVE-2026-86206 CNA record)"
        source_url: "https://radar.offseq.com/threat/a-vulnerability-in-the-n-central-internal-api-access-control-filter-allows-unauthorised-access-to-43df6868be83edb2"
    extended_notes: |
      References the store's existing entry 2026-08-03/cve-2026-18577-n-able-n-central-auth-bypass-exploited
      (August CVE-2026-18556/CVE-2026-18577 chain, exploited by actor:storm-1175 with
      malware:stormencryptor) — this is a genuinely distinct new vulnerability chain in the same
      product, not a development on the same CVEs, so it should ship as a new entry with that prior
      entry in `references[]` rather than as a changelog update. Detection concept: telemetry class =
      RMM/appliance authentication and internal-API access logs; anchor = N-central's own
      envoy_proxy_HTTPS.log and syslog ncentraldms (Huntress: filter for URL-encoded internal API
      route access, e.g. encoded "%2F", and audit newly created user accounts for anomalous naming
      such as an email address suffixed ".invalid"). Behavioral pivot to managed endpoints: Windows
      Application Event Log IDs 4102/8192/8193 showing "MSP Support" (the default N-central Take
      Control account name) sessions from unexpected source IPs targeting domain controllers — a
      lookalike-free discriminator would be Take Control sessions outside a change ticket or expected
      support window, especially against high-value hosts. Hardening: self-hosted N-central admins
      should not treat HF3 as sufficient — HF4 (2026.3.1.14) is required for CVE-2026-86218
      specifically; restrict N-central console exposure to the internet (VPN/allowlist only); audit
      user/role tables for unexpected accounts.
