items:
  - title: "N-able N-central: a third distinct auth-bypass/RCE chain in five weeks, this one a confirmed-exploited pre-auth CVSS 10.0 zero-day (CVE-2026-86206, CVE-2026-86207, CVE-2026-86218)"
    sources:
      - { url: "https://www.huntress.com/blog/n-able-vulnerability-exploitation", publisher: "Huntress (Threat Response Unit)", date: "2026-09-06", role: primary }
      - { url: "https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/", publisher: "N-able Status (vendor)", date: "2026-09-06", role: primary }
      - { url: "https://uptime.n-able.com/event/201814/", publisher: "N-able Status Dashboard — Active Incident (vendor)", date: "2026-09-06", role: primary }
      - { url: "https://status.n-able.com/2026/09/05/n-central-2026-3-hotfix-3-cve-2026-86206-and-cve-2026-86207/", publisher: "N-able Status (vendor)", date: "2026-09-05", role: primary }
      - { url: "https://radar.offseq.com/threat/cve-2026-86207-cwe-305-authentication-bypass-by-primary-weakness-in-n-able-n-central-fdc4e7f222848fbd", publisher: "OffSeq Threat Radar (CVE record aggregator, CNA data)", date: "2026-09-05", role: corroborating }
      - { url: "https://radar.offseq.com/threat/a-vulnerability-in-the-n-central-internal-api-access-control-filter-allows-unauthorised-access-to-43df6868be83edb2", publisher: "OffSeq Threat Radar (CVE record aggregator, CNA data)", date: "2026-09-05", role: corroborating }
      - { url: "https://radar.offseq.com/threat/cve-2026-86218-cwe-96-improper-neutralization-of-directives-in-statically-saved-code-static-code-70cdd1c30c8772ef", publisher: "OffSeq Threat Radar (CVE record aggregator, CNA data)", date: "2026-09-06", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("actively exploited vulnerability September 6 2026") → Huntress,
      URL https://www.huntress.com/blog/n-able-vulnerability-exploitation → primary: N-able Status
      (vendor hotfix pages), URL https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/
      and https://status.n-able.com/2026/09/05/n-central-2026-3-hotfix-3-cve-2026-86206-and-cve-2026-86207/
      → primary: N-able Active Incident dashboard (jina-rendered, JS-SPA), URL
      https://uptime.n-able.com/event/201814/ → corroboration: OffSeq Threat Radar per-CVE CNA
      records for CWE/CVSS specificity, URLs listed above.
    summary: |
      N-able's remote-monitoring-and-management platform N-central — used by MSPs to centrally
      manage patching, monitoring and remote access across their customers' fleets — has now shipped
      four emergency hotfixes in five weeks against three separate, unrelated authentication/RCE
      flaws. Following the August CVE-2026-18556/CVE-2026-18577 auth-bypass chain (already tracked in
      this store, entry 2026-08-03/cve-2026-18577-n-able-n-central-auth-bypass-exploited, exploited by
      the Storm-1175/StormEncryptor ransomware actor), Huntress discovered on 2026-09-04 that a
      customer's already-patched (HF2) N-central production server was compromised again through a
      completely distinct exploit chain. N-able's HF3 (build 2026.3.1.13, 2026-09-05) addressed two
      newly designated CVEs: CVE-2026-86206 (CWE unspecified access-control gap in the N-central
      internal API access-control filter, allowing unauthorised access to internal-only APIs,
      moderate severity per OSV/GHSA-9x6x-w4xq-rw3g) and CVE-2026-86207 (CWE-305 authentication
      bypass by primary weakness, also reaching internal-only APIs, CVSS4.0 7.7 High). Then, in the
      early hours of 2026-09-06, a THIRD independent researcher reported a separate, unrelated
      zero-day — CVE-2026-86218, CWE-96 improper neutralization of directives in statically saved
      code ("static code injection"), a pre-authentication remote-code-execution path rated CVSS4.0
      10.0 — which N-able's own Jason Murphy confirmed in a support-community thread as "a Zero day"
      that "has been exploited in the wild", and which N-able's Active Incident dashboard states
      explicitly "has been observed being exploited in the wild" — even though the concurrently
      published HF4 release notes hedge to "we have no confirmations that this vulnerability has been
      exploited in production environments". HF4 (build 2026.3.1.14) supersedes HF3 and is required
      even for servers already on HF3. Huntress could not determine from appliance logs (already
      rotated) which of the three new CVEs was used in the 2026-09-04 compromise, and given the
      exploit chain grants full administrative ("god-mode") control over N-central's user/role
      management, an attacker can create rogue admin accounts, push scripts/jobs to every managed
      endpoint, and pivot into managed networks via the built-in Take Control remote-access feature
      or by deploying Cloudflare-tunnel backdoors for persistence — the same post-compromise pattern
      Huntress documented in the August incident. Hosted (NCOD) instances are already patched by
      N-able; only self-hosted/on-premises N-central deployments are exposed.
    region_nexus: "global — N-central is an MSP-operated RMM platform with install base across Europe including Swiss-market MSPs; no confirmed Swiss victim, but the platform class (third-party-managed IT for public-sector customers) is directly relevant to cantonal/communal administrations that outsource IT operations"
    primary_sector_nexus: "indirect — public-sector bodies reached through their managed-service-provider's N-central estate, not a direct public-sector product"
    sector: "public-sector"
