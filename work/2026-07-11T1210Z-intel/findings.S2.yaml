    summary: |
      France's CERT-FR published an advisory on 2026-07-10 for three new CVEs in Progress MOVEit
      Transfer, a managed file-transfer (MFT) product with a documented history of mass exploitation
      (Cl0p's 2023 campaign against ~2,600 organizations). CVE-2026-10699 (CVSS 3.1 7.5, AV:N/AC:L/PR:N/UI:N)
      is a memory-leak in the SFTP service — memory is not released after its effective lifetime,
      letting an unauthenticated remote attacker exhaust memory and trigger denial of service.
      CVE-2026-10698 (CVSS 7.2, AV:N/AC:L/PR:H/UI:N, CWE-943) is an improper-neutralization-of-query-logic
      flaw in the Custom Reports module: an attacker who already holds high (admin-level) privileges can
      bypass table-scope restrictions to read/manipulate data outside the report's intended scope.
      CVE-2026-11903 (CVSS 8.0, AV:N/AC:L/PR:L/UI:R) is a stored cross-site scripting flaw in the Ad Hoc
      module, exploitable by a low-privileged authenticated user with a victim-interaction step. CERT-FR
      states the affected range as MOVEit Transfer 2026.x versions prior to 2026.0.2 (fixed release);
      CVE.org version metadata additionally lists the 2025.0.x (before 2025.0.8) and 2025.1.x (before
      2025.1.4) branches as affected for the same three flaws. No active exploitation has been confirmed
      for any of the three CVEs as of this advisory. Given MOVEit Transfer's history as an internet-facing
      MFT product widely deployed for secure file exchange in government and financial-sector workflows,
      and that the SFTP DoS is pre-auth and reachable without any account, Swiss/EU public-sector and
      finance operators running MOVEit Transfer should prioritise the 2026.0.2 upgrade (or the
      corresponding 2025.0.8 / 2025.1.4 fixes) and review admin-level account scoping for Custom Reports.
    region_nexus: "Switzerland/EU — surfaced by France's national CERT (CERT-FR); MOVEit Transfer is broadly deployed for government and financial-sector managed file transfer across Europe"
