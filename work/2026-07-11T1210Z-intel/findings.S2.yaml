    extended_notes: |
      CERT-FR's advisory cites the affected range as "MOVEit Transfer versions 2026.x antérieures à
      2026.0.2" for this specific bulletin; the CVE.org metadata (relayed via cve.threatint.eu) separately
      lists 2026.0.0 before 2026.0.1 as the fixed boundary for the 2026.x branch on the two CVEs it
      details in full (10698, 11903) — the discrepancy (2026.0.1 vs 2026.0.2) was not resolved because
      the actual Progress vendor security bulletin (community.progress.com/s/article/MOVEit-Transfer-
      Critical-Security-Bulletin-June-2026) is a Salesforce Community JS-only page that returned only a
      loading/CSS-error shell under both WebFetch and the jina reader — defenders should verify against
      their own build number rather than relying on either secondary figure. No public PoC or KEV listing
      found for any of the three CVEs as of this run.
