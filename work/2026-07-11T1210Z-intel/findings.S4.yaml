items:
  - title: "CISA publishes forensic postmortem of its own May 2026 AWS GovCloud credential leak — secrets-in-repo and public-upload guardrails as the transferable lesson"
    sources:
      - { url: "https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident", publisher: "CISA", date: "2026-07-09", role: primary }
      - { url: "https://cyberscoop.com/cisa-credential-leak-forensic-report/", publisher: "CyberScoop", date: "2026-07-10", role: corroborating }
      - { url: "https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/", publisher: "Krebs on Security", date: "2026-05-18", role: background }
    discovery_trace: "first seen at: WebSearch (\"CISA blog forensic report May credential leak GitHub AWS GovCloud\") → pivot: CyberScoop, URL https://cyberscoop.com/cisa-credential-leak-forensic-report/ → primary: CISA, URL https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident (fetched via bridge/jina reader — CISA.gov 403s direct WebFetch per repo convention)"
    summary: |
      CISA published a forensic postmortem (2026-07-09) of the incident it disclosed in May 2026, in which
      a Nightwing contractor's personal GitHub repository ("Private-CISA") exposed administrative credentials
      to three AWS GovCloud accounts, plaintext passwords for internal CISA systems, SSH keys and access to
      CISA's internal Artifactory build-package repository ("LZ-DSO") for roughly six months (this is an
      update on entries/2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an — the original
      Krebs on Security disclosure). CISA's own account confirms the exposure mechanism was T1552.001
      (Credentials In Files): a contractor uploaded a personal copy of CISA's build/deployment repo — including
      Infrastructure-as-Code and both admin and build credentials — to a public personal GitHub account for
      autonomous cloud-infra tooling, and had disabled GitHub's default push-protection secret scanning on that
      repo. Forensic log analysis found the leaked credentials were not used outside CISA's own environments and
      no customer/mission data was exposed, but key rotation "took longer than anticipated" given the complexity
      of CISA's federal/industry interconnections. The concrete corrective actions CISA now names are the
      transferable content for defenders: (1) monitoring/blocking uploads to public code repositories via EDR
      rather than relying on developer-honoured settings, since users previously had unrestricted ability to
      push to public repos; (2) mandatory secrets rotation across every environment where the exposed individual
      held admin rights (not just the directly-exposed credentials); (3) a dedicated GitHub/cloud incident
      playbook, which CISA had not had prepared in advance; (4) consolidating developer environments to enforce
      consistent controls; (5) simplifying and multiplying reporting channels (a security.txt file alone was
      insufficient — the researcher had to route through a reporter after multiple failed channels).
    region_nexus: "global — US federal cybersecurity authority; no direct CH/EU victim, included as a transferable governance/incident-response lesson for national CERTs and public-sector build pipelines (see extended_notes)"
    primary_sector_nexus: "indirect — public-sector CI/cloud build-pipeline security practice, directly transferable to NCSC/BSI/ANSSI-class national CERT operations and any public-sector DevOps environment"
    sector: "public-sector"
    cves: []
    techniques: [T1552.001]
    affected_products: ["GitHub (public repositories)", "Amazon AWS GovCloud"]
    entity_keys: ["incident:cisa-nightwing-contractor-aws-govcloud-keys-exposed-github"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an"
    evidence:
      - quote: "The individual had uploaded copies of a CISA build and deployment repository to their personal GitHub account for the purpose of creating cloud infrastructure autonomously. This repository included CISA's Infrastructure As Code and build code."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident"
      - quote: "No repository should contain secrets, yet secrets made it into CISA private repositories. CISA has since rotated all secrets and created an action plan to improve management of developer secrets and to better monitor for exposed secrets going forward."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident"
      - quote: "It also analyzed log files to learn that none of the leaked credentials were used outside of CISA, and that no customer or mission data was exposed."
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/cisa-credential-leak-forensic-report/"
    extended_notes: |
      Included as a transferable governance lesson rather than a CH/EU-nexus breach: the underlying incident
      (a national cybersecurity authority's own build-credential exposure via a contractor's personal GitHub
      repo, six months undetected, disabled secret-scanning) is a generic-but-universal failure mode for any
      national CERT or public-sector DevOps pipeline that gives contractors/integrators push access to build
      infrastructure — squarely the kind of transferable lesson the org's own S1/S4 entity note on the original
      incident (entries/2026-05-19) already flagged for NCSC/BSI/ANSSI operators. This item supplies the concrete
      remediation playbook CISA actually implemented, which the original entry could not have known in May.
      Borderline call: no CH/EU victim and CISA is a foreign authority, but the entity key was already registered
      from the May disclosure and the update meaningfully deepens the actionable lesson, so it clears the bar as
      an update rather than a fresh out-of-nexus item requiring the (a)-(d) test.
    borderline: true
    borderline_reason: "US federal agency self-disclosure with no Swiss/EU victim; included as update-of a previously registered incident because the postmortem supplies new, concrete, transferable secrets-management/incident-response detail (EDR-enforced repo-upload controls, mandatory org-wide secret rotation, GitHub/cloud playbook gap) not available at original disclosure."

