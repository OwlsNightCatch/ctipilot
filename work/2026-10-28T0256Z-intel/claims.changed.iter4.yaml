    text: "**Exposure:** every Magento Open Source and Adobe Commerce store without the 2.4.9 or 2026-jul fix; the anonymous guest-cart item routes need no credentials, and the upload becomes code execution on stock nginx for the oldest 2.x lines, on any non-stock nginx that hands every .php file to the PHP handler, and on Apache before 2.3.5 without the engine switch set for that directory ("
