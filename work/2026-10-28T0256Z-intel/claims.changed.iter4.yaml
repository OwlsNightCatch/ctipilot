  - claim_id: 13c1201453
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "summary"
    kind: frontmatter
    text: "Sansec reports that PolyShell, the unauthenticated file upload in the Magento and Adobe Commerce REST API that Adobe tracks as CVE-2026-48356, has been attacked since 2026-03-19, with a mass wave on 2026-03-30 that put a JavaScript loader on 471 stores in one hour. Adobe's fix reached 2.4.9 on 2026-05-12 and the supported lines through bulletin APSB26-73 on 2026-07-14, a bulletin that still says Adobe knows of no exploits; CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-27. A store that ran an unpatched build may carry a webshell that the update does not remove."
  - claim_id: 10590c9301
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Magento Open Source and Adobe Commerce store to 2.4.9 or the 2026-jul fix in bulletin APSB26-73, then check for compromise: any script file in the custom-options upload directory, administrator accounts nobody created and loader scripts in CMS blocks, because a store that ran an unpatched build since March 2026 may already hold a webshell that the update does not remove."
  - claim_id: 73f02eeb66
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "cves[CVE-2026-48356]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-48356\", \"cvss\": \"9.6 (CVSS 3.1, Adobe bulletin; Adobe's CVE record says 9.3)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Magento Open Source and Adobe Commerce up to 2.4.9-alpha2 per Sansec; Adobe's bulletin lists Adobe Commerce 2.4.9 and 2.4.8-p5, 2.4.7-p10, 2.4.6-p15, 2.4.5-p17 and 2.4.4-p18 and earlier, Magento Open Source 2.4.9 and 2.4.8-p5, 2.4.7-p10 and 2.4.6-p15 and earlier, and Adobe Commerce B2B 1.5.3 and 1.5.2-p5, 1.4.2-p10, 1.3.4-p17 and 1.3.3-p18 and earlier (its version table covers every fix of the update)\", \"fixed\": \"2.4.9 (Sansec, 2026-05-12); the 2026-jul builds of the supported lines per bulletin APSB26-73, for example 2.4.9-2026-jul and 2.4.8-2026-jul (2026-07-14)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
