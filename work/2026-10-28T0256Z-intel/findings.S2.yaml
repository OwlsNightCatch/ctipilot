    discovery_trace: "first seen at: inside-it-ch, RSS https://www.inside-it.ch/rss.xml (item 'Kritische Schweizer Infrastrukturen attackiert', 2026-10-27) -> extract https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027 -> checked the commune's own page https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico.html (unchanged since the notice of 2026-09-16, no new statement) -> WebSearch (Italian and German queries) found no Ticino outlet (RSI, tio.ch, laRegione, CdT) carrying the data publication."
    summary: |
      The covered entry (2026-09-30) records the commune's own notice of 2026-09-16 (encryption on 2026-08-04, restored from backups) and a leak-site listing on 2026-09-28, and says a reported stolen-data claim could not be corroborated. Inside IT now reports that SafePay has put the stolen package, about 30 GB, into the darknet, and relays a Risikomonitor analysis of it (an analysis by a security firm, not verified independently). Contents per that analysis: about 5,300 e-mail addresses and more than 2,000 identifiable persons; documents on social-assistance decisions with name, address, monthly amount, AHV numbers and health insurer from 2014 to December 2025; debt-collection register extracts, naturalisation dossiers from 2018 and payment orders against tax debtors; bank statements of employees with IBANs; and information on the whole population of 1,381 inhabitants, with mass letters to all households, Christmas letters to pensioners, a youth-protection survey and a list of property owners with parcel numbers and water meters, which together make a near-complete address book. Risikomonitor's managing director says whoever holds this data knows who receives social assistance, who has debts and who is elderly, material for fraud against the weakest. Inside IT points out that cantonal data-protection laws name social-assistance data as especially sensitive personal data. The commune told Inside IT it will give no statement on the publication; it had itself made the attack public in September. The commune's notice names no actor and no data theft, so the link between the August encryption and this package rests on Inside IT's and Risikomonitor's reading and SafePay's claim.
