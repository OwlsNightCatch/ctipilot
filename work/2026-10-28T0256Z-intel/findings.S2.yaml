  # ------------------------------------------------------------------
  # 5. BORDERLINE: BACS week-43 review
  # ------------------------------------------------------------------
  - title: "BACS week 43: fake 'vote for a child' messages hijack WhatsApp accounts through the registration code or a linked-device QR scan, with more than 50 reports in October"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w43-de", publisher: "BACS (NCSC.ch), weekly review", date: "2026-10-27", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, bridge `url https://www.bacs.admin.ch/de/im-fokus` (card parse, 'Woche 43', 2026-10-27) -> primary: `extract https://www.bacs.admin.ch/de/26w43-de`."
    summary: |
      BACS's weekly review of 2026-10-27 reports a renewed larger wave of reports about stolen or manipulated WhatsApp accounts, with more than 50 reports in October alone (the page's metadata description says over 40, its lead paragraph over 50), many of them successful. The lure arrives from a contact in the victim's address book whose account is already taken over, asking for a vote for a friend's daughter in a school or dance contest; the link goes to a convincing fake contest site that uses constantly changing domains to evade filters. The site then either asks for the phone number and the six-digit code that WhatsApp sends by SMS, which is the real registration code and lets the attackers activate the account on their own device, or shows a QR code with the instruction to scan it under 'Linked devices', which silently links the account to the criminals' system (the legitimate WhatsApp Web feature), so the victim may not notice the abuse. With control the attackers read chats, groups and photos and send the same message to the victim's whole address book. BACS recommends never typing the verification code on a website, using Linked devices only for one's own devices, enabling WhatsApp two-step verification with a PIN, warning contacts through another channel, and, for the QR case, removing unknown entries under Linked devices; for the SMS case, re-registering resets the attacker's session, but if the attackers set their own PIN the victim must wait seven days. BACS first reported the method in spring 2026 (week 21).
    region_nexus: "Switzerland"
    primary_sector_nexus: "indirect: staff private and, in some services, operational WhatsApp accounts; a taken-over account is a trusted-contact phishing channel into colleagues and groups"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002]
    affected_products: ["WhatsApp"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    classification_suggestion: { reliability: A, credibility: 2 }
    novelty: new
    borderline: true
    borderline_reason: "Consumer-fraud review (same class as the week-42 TWINT review that was returned and not published on 2026-10-22); kept only because the linked-device abuse persists after a password change and affects staff who run groups on WhatsApp. Drop if the bar stays at public-sector operations."
    evidence:
      - quote: "BACS is currently recording a renewed, larger wave of reports about stolen or manipulated WhatsApp accounts. (translated from German)"
        original: "Das BACS verzeichnet derzeit eine erneute, grössere Welle an Meldungen über gestohlene oder manipulierte WhatsApp-Konten."
        attribution: "BACS (NCSC.ch)"
        source_url: "https://www.bacs.admin.ch/de/26w43-de"
