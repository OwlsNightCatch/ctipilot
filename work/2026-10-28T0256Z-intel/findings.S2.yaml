        source_url: "https://www.bacs.admin.ch/de/26w43-de"

  # ------------------------------------------------------------------
  # 6. BORDERLINE cross-domain lead for S3: Arctic Wolf / Teams external chat
  # ------------------------------------------------------------------
  - title: "Arctic Wolf: more than 400 incidents of Microsoft Teams external-chat 'IT support' impersonation lead to Quick Assist or other RMM tools within minutes; the default-on external access is the lever"
    sources:
      - { url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/", publisher: "Arctic Wolf Labs", date: "2026-10-26", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-10-27/cyberkriminelle-geben-sich-in-microsoft-teams-als-it-support-aus", publisher: "Netzwoche (Swiss relay)", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: netzwoche feed https://www.netzwoche.ch/rss.xml (item 'Cyberkriminelle geben sich in Microsoft Teams als IT-Support aus', 2026-10-27) -> extract https://www.netzwoche.ch/news/2026-10-27/cyberkriminelle-geben-sich-in-microsoft-teams-als-it-support-aus -> primary: Arctic Wolf blog, extract https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/ (page date 2026-10-26)."
    summary: |
      Research domain (S3) item found through Swiss trade press. Arctic Wolf Labs analysed more than 400 incidents in which attackers used Microsoft Teams' external chat creation for IT-support impersonation, from its own customer telemetry; the activity exploits no Teams vulnerability but the default-on external access (federation). Observed pattern: a mail-bombing flood of newsletter confirmations precedes or accompanies a one-to-one Teams chat from a freshly created tenant, with IT-themed names and an '(Internal)' suffix in the display name although Teams labels the sender External; 30 to 40 percent of cases used default onmicrosoft.com tenants, and among paid domains about half were .top; the goal is hands-on-keyboard access through a remote-access tool, most often Quick Assist (QuickAssist.exe, msra.exe), then AnyDesk, ScreenConnect, TeamViewer, Atera and others, and Arctic Wolf says reported chains reach payload execution in under 15 minutes after the victim engages. Attackers avoid pasting a URL into Teams (Safe Links/ZAP scanning) and navigate to the payload during the remote session. One case it calls potentially novel: the user was told to run a PowerShell command under explorer.exe, which pulled an MSI from Azure Blob Storage that dropped a PowerShell loader and a pythonw implant that enumerated Active Directory users and computers over LDAP and sent them to C2. Detection anchor given: the ChatCreated event for a first contact from an external tenant, correlated with endpoint, identity, e-mail and remote-access telemetry; also alerting on RMM tools not sanctioned in the environment, especially an RMM install followed by user/group/network enumeration. Hardening levers named: in the Teams admin centre set External access to allow only specific trusted domains, block chat with unmanaged/consumer accounts, block federation with trial-only tenants (Set-CsTenantFederationConfiguration -ExternalAccessWithTrialTenants Blocked), restrict Quick Assist to authorised IT roles and block unsanctioned RMM tools, and mandate an out-of-band call-back for any remote-access request. Arctic Wolf is a single vendor's telemetry and attributes no actor in this report; it cites earlier Microsoft (Storm-1811/Black Basta), Sophos (Chaos, 3AM) and Zscaler (GoGRPC) reporting for the same technique.
    region_nexus: "global; Microsoft 365 tenants with Teams external access enabled, which includes most Swiss administrations on Microsoft 365"
    primary_sector_nexus: "indirect: any public-sector Microsoft 365 tenant that has not restricted Teams external access"
    sector: "public-sector"
    cves: []
    techniques: [T1566.003, T1566.004, T1667, T1199, T1204.002, T1059.001, T1219, T1585.003, T1583.001]
    affected_products: ["Microsoft Teams", "Microsoft Quick Assist"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    verification_note: "One vendor's telemetry; Netzwoche is a relay of it. Prior public reporting of the technique family (Microsoft, Sophos, Zscaler) is cited inside the Arctic Wolf post, not fetched here."
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    borderline: true
    borderline_reason: "S3-domain research item; the primary is dated 2026-10-26, up to about 27 hours before the 26-hour window start, with the Swiss relay inside the window. Returned so the lead is not lost if S3 did not pick it up; the main agent should dedup against S3's return. It is the Swiss-relevant hardening lever (Teams external-access allow-list) that earns it a place."
    evidence:
      - quote: "Microsoft Teams ships with external access (federation) turned on by default"
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/"
      - quote: "This activity does not exploit any known Teams vulnerability; it abuses a legitimate, default-on collaboration capability."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/"
      - quote: "Of these, Quick Assist is the most frequently used."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/"
      - quote: "Microsoft records this first contact as a ChatCreated event, which Arctic Wolf assesses to be the primary detection opportunity for defenders."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/"
      - quote: "Most organizations have no legitimate need for open, any-tenant external chat."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/threat-actors-abuse-microsoft-teams-external-chat-for-initial-access/"

