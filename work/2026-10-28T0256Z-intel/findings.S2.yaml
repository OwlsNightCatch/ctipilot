    extended_notes: |
      Transferable lessons for communal bodies (stated by the sources, no more): a file server that also stored a third party's customer portal credentials, user folders carrying weak passwords, and applicant records kept for eleven years are the retention and segregation findings Risikomonitor draws; its own conclusion is that the danger lies in the detail (bank statements, negotiation records, passwords) because that is enough for very credible fraud against the persons named, which is the follow-on risk for anyone whose name and address appear in the payment list. No intrusion telemetry, vector or timeline is public, so there is no detection concept to carry; the post-incident check the data supports is that any password found in the leaked folders, and the PV-portal credentials of the third party, must be treated as burnt.
      Cross-reference for the composer: same wave as the covered Manno entry (2026-09-30/manno-ti-commune-ransomware-safepay-claim); BACS statistics above are BACS's own replies to a trade journal, not a BACS publication.
