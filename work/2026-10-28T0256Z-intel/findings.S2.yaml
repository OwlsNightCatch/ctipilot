  # 1. NEW: ARA-Region Lyss-Limpachtal (BE) - SafePay leak
  # ------------------------------------------------------------------
  - title: "ARA-Region Lyss-Limpachtal (BE wastewater municipal association): SafePay has put about 49 GB from the attack on the darknet, with bank statements, 255 password hits and a third party's PV-portal credentials, while the association declines to comment; BACS ranks SafePay third most active in Switzerland in 2026"
    sources:
      - { url: "https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027", publisher: "Inside IT (original reporting, relays a Risikomonitor analysis of the leaked data and BACS replies)", date: "2026-10-27", role: "primary" }
      - { url: "https://www.dexpose.io/safepay-ransomware-attack-on-ara-lyss-in-switzerland/", publisher: "DeXpose (leak-site tracker; claim record only)", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, RSS https://www.inside-it.ch/rss.xml (item 'Kritische Schweizer Infrastrukturen attackiert', 2026-10-27 07:55 UTC) -> extract https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027 (raw page; body read from the page's __NEXT_DATA__ JSON) -> pivot: WebSearch (\"Safepay Manno ARA Lyss-Limpachtal Daten veroeffentlicht Risikomonitor\") -> DeXpose, URL https://www.dexpose.io/safepay-ransomware-attack-on-ara-lyss-in-switzerland/ (claim of 2026-09-15). Primary of the leak analysis (Risikomonitor) not found: risikomonitor.com/news and /presse listings carry no SafePay analysis, so the contents rest on Inside IT's report of it. The ransomware.live record for ara-lyss.ch timed out twice (>100 s)."
    summary: |
      Claims and facts are separated here. Fact (Inside IT, 2026-10-27): SafePay has publicly claimed eight attacks in Switzerland since 2026-09-15, among them the Bernese wastewater-treatment association ARA-Region Lyss-Limpachtal and the Ticino commune of Manno, which Inside IT calls two critical infrastructures. The DeXpose tracker recorded SafePay's claim against ara-lyss.ch on 2026-09-15 with the group's own wording that the full leak would be published unless a company representative made contact. Claim (SafePay, as relayed by Inside IT): the group has now put the stolen data packages into the darknet, about 49 GB in the case of ARA Lyss. Analysis (Risikomonitor, an Austrian-Swiss darknet-monitoring firm, relayed by Inside IT; not independently verified): the ARA data includes about 3,200 e-mail addresses and data on more than 1,200 identifiable persons; user folders and file storage with content up to March 2026, of which the analysis found 255 hits on passwords, 195 of them very weak; bank statements and a transaction list with more than 100 payments from private individuals with name and address; data of a third-party company that sat on the same server, including full login credentials to the monitoring portals of its customers' photovoltaic plants; and a 2015 list of job applicants with date of birth, civil status, then employer and interview notes, and the article asks why these data were never deleted in eleven years. By the ENISA methodology, Risikomonitor rates five of six assessed data groups high or very high. The ARA management told Inside IT it did not want to comment on the incident; no statement by the association, no initial access vector, no word on encryption or operational impact and no confirmation of the criminals' claim by the victim is public in the sources found.
      BACS context given to Inside IT (BACS, not the incident): the office gives no details on individual attacks; critical infrastructure has had a reporting duty since April 2025; the mandatory-report volume has stayed stable at about 30 to 40 reports a month with ransomware at three to five a month (August slightly higher, September below average); SafePay is among the more active ransomware groups in Switzerland, third most active over 2026 together with The Gentlemen after Akira and Payload, first seen in Switzerland in May 2025, opportunistic with no clear Swiss focus, and uses double extortion. The joint FBI/CISA advisory AA26-293A on SafePay is already in the store (2026-10-21/aa26-293a-safepay-ransomware-edge-flaws-backup-nas-reset) and is the technical reference; this item adds a Swiss communal-infrastructure victim and the data contents, not new SafePay tradecraft.
    region_nexus: "Switzerland, canton of Bern; communal wastewater utility (Gemeindeverband)"
    primary_sector_nexus: "direct: a communal public body that is Swiss critical infrastructure (wastewater treatment) under the cyber reporting duty; same SafePay wave as Manno (TI)"
