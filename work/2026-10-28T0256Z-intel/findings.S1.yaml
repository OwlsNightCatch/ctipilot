      - { quote: "The Cisco PSIRT is not aware of any malicious use of these vulnerabilities against any Cisco product.", attribution: "Cisco PSIRT (advisory, Vulnerabilities in node.js Affecting Cisco Products)", source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u" }
      - { quote: "A single HTTP request containing a crafted 23 MB body crashed the tested ClickHouse server.", attribution: "JFrog Security Research", source_url: "https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/" }
      - { quote: "Akamai telemetry shows that 61% of networks are running affected Node.js versions.", attribution: "Akamai Security Intelligence Group", source_url: "https://www.akamai.com/blog/security-research/inside-node2shell-closer-look-cve-2026-111497" }
    extended_notes: |
      Delta vs entry (its cves[] status is poc-public, patch-available and its text says no source reports exploitation outside Imperva's lab demo): status becomes exploited (cisa-kev; ELLIO sensor telemetry), with the caveats above (CISA gives no detail, ELLIO's chain failed in the lab, vendors report none against their products). The entry's statement "no source reports exploitation" is replaced.
      Exposure (how to tell): Node.js: the application must hand attacker-controlled Brotli data to the decoder: inbound request bodies with Content-Encoding: br inflated by Express 5 / body-parser 2 (inflate defaults to true), Koa with @koa/bodyparser; outbound responses decoded by undici/fetch(), axios, got, SuperAgent (attacker-influenced URLs: link previews, webhooks, crawlers); direct node:zlib brotli calls. A bare node:http server does not inflate request bodies by itself. Python: installed Brotli or brotlicffi is used by urllib3, requests, httpx[brotli], aiohttp, Scrapy from the response Content-Encoding. Distro builds linking system libbrotli need the distro package (Debian bookworm 1.0.9-2+deb12u1, trixie 1.1.0-2+deb13u1, Alpine 1.2.1-r0 per ELLIO) and a restart; images pinned to node:24.22.0 stay vulnerable until the tag changes.
      Detection (telemetry classes): web/app access logs: POSTs with Content-Encoding: br from a single source, from ~1 KB malformed probes and valid streams (sweep) up to a single ~23 MB body (exploit attempt); process/crash telemetry: Node worker segfaults and supervisor restart loops right after such a request (ELLIO: most of 400 lab attempts crashed the worker); core files where systemd-coredump is on (stock Ubuntu: /var/lib/systemd/coredump) can hold other visitors' session tokens and keys, so restrict who reads them; process-creation: /bin/sh spawned by the node process (parent node, shell child) after a crash pattern. Failed attempts against patched builds return HTTP 400 with ERR__ERROR_FORMAT_BLOCK_SWITCH.
      Triage: ordinary Brotli-compressed responses are benign and common; the discriminator is Brotli-coded request bodies (rare for legitimate clients) or Brotli responses from attacker-influenced URLs, combined with worker crashes. ELLIO's checker identifies itself with its own user agent string; no IOCs recorded here.
      Hardening: patch to the fixed releases above and rebuild images/lockfiles, move off Node.js 20/23/25 (no fix), drop Content-Encoding: br on inbound requests at the edge if the application does not need it (ELLIO), disable core dumps or restrict their readers; PAN-OS with Brotli inspection and TLS decryption: `set system setting brotli-encoding disable` (PAN) until the hotfix.
      Registry: tool:node2shell should carry the aliases Brotli2Shell, HTTP2Shell and Broccoli2Shell (Tenable, JFrog, ELLIO).
      Cisco's node.js advisory (v1.0, Interim, 2026-10-27) lists Catalyst SD-WAN Manager, ISE, IOS, IOS XE, IOS XR, NX-OS, ASA, FMC and FTD among priority products under investigation; none is confirmed affected. A second entry covers the .NET fix (2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix): MSRC rev 1.1 (2026-10-26) still shows Exploited: No and Publicly Disclosed: Yes.

