recipe_notes:
  - "hpe-networking-psirt: https://csaf.arubanetworking.hpe.com/changes.csv (read with `url --direct`) lists every CSAF file with its release timestamp, so new bulletins can be enumerated without guessing IDs (2026-10-28: HPESBNW05171 released 2026-10-23T16:00Z, HPESBNW05162 2026-10-22). index.txt lists names only."
  - "cisco-psirt: `feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml 25` returns dated items including Interim revisions; the advisory page reads with extract (prose) and `url --direct` (the vulnerable-products table without markup, revision history)."
  - "paloalto-psirt: https://security.paloaltonetworks.com/json/CVE-2026-109618 returns the advisory as CVE JSON including `exploits`, `metrics` (CVSS 4.0 with E:A) and a timestamped `timeline`; cheaper than parsing HTML and keeps the revision log."
  - "chrome-releases: the Blogger Atom URL guessed by `feed` answers 302; WebFetch of https://chromereleases.googleblog.com/ lists posts with hrefs and `extract <post URL>` reads the full CVE list."
  - "EUVD human pages https://euvd.enisa.europa.eu/vulnerability/<EUVD-id> are an SPA shell (200 with no content); the per-CVE API search `url 'https://euvdservices.enisa.europa.eu/api/search?text=<CVE>&size=3'` gives exploitedSince and scores."
  - "FIRST EPSS: `url 'https://api.first.org/data/v1/epss?cve=CVE-a,CVE-b'` works from the container and takes a comma list."
  - "cve.org API: `url https://cveawg.mitre.org/api/cve/<CVE>` returns the CNA record and CISA-ADP SSVC block (Exploitation: active) in JSON; useful for the exploitation field the KEV flip sets."

