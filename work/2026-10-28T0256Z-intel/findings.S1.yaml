    discovery_trace: "first seen at: work/2026-10-28T0256Z-intel/kev-window.txt (COVERED-STALE) and `cisa-kev` bridge, catalogVersion 2026.10.27 -> CISA alert https://www.cisa.gov/news-events/alerts/2026/10/27/cisa-adds-two-known-exploited-vulnerabilities-catalog (WebFetch + extract) -> pivot: EUVD API https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-111497&size=3 (exploitedSince 2026-10-27) -> pivot: tenable-research feed https://feeds.feedburner.com/tenable/qaXL item https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497 (names ELLIO as exploitation source) -> primary: https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/ ; JFrog https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/ and Akamai linked from Tenable; Cisco advisory from cisco-psirt feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml; vendor status: PAN https://security.paloaltonetworks.com/CVE-2026-111497, MSRC `msrc cve CVE-2026-111497` (exploited: No)."
    summary: |
      CISA added CVE-2026-111497 to its Known Exploited Vulnerabilities catalog on 2026-10-27 "based on evidence of active exploitation" (remediation due 2026-11-10 under BOD 26-04); the alert names no actor, victim, product or date, and CISA's SSVC data on the CVE record carries Exploitation: active, as does ENISA's EUVD (exploitedSince 2026-10-27). The only first-hand attack telemetry found is ELLIO's: its sensors recorded a public exposure checker sending 20 Brotli-coded POST bodies to map which hosts decompress Brotli, then on 2026-10-26 (15:08 UTC) a single Brotli-coded request body of about 23 MB built against one binary, Node.js v24.22.0 on x86-64, whose delivery layer copies public proofs of concept and whose ROP chain is original; ELLIO assesses this as adoption by an operator focused on mass exploitation but, testing the chain against a pristine 24.22.0 target, got no shell in 50 attempts (a defective last stage), so a failed attempt is a worker crash. Tenable relays ELLIO's report and says it has not confirmed it independently. Vendors report differently: Palo Alto (revision of 2026-10-27, before the KEV listing) and Cisco PSIRT (2026-10-27, products still under investigation) say they know of no malicious use against their products, and Microsoft's .NET record still says Exploited: No. New scope since the entry: JFrog reproduced instruction-pointer control in FFmpeg through libjxl (JPEG XL "brob" metadata), a remote crash of ClickHouse with one crafted 23 MB Content-Encoding: br request (fix merged, no release at its writing), an Apache Arrow denial of service and a .NET native crash; Akamai's telemetry says 61% of networks run an affected Node.js. Fixed: Node.js 22.23.4, 24.22.1, 26.12.1 (20, 23 and 25 are end of life and get no fix), Brotli 1.0.10, 1.1.1, 1.2.1, Bun 1.4.4, PyPI Brotli 1.2.1 and brotlicffi 1.2.1.0, PHP Windows builds 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; the CVE record also references release v1.2.7 of the Go port andybalholm/brotli ("Detect and report invalid stream earlier", a port of the upstream fix commit), so Go services that embed that port should update. Node.js cherry-picked the fix without bumping the bundled version string, so process.versions.brotli reads 1.2.0 on patched and unpatched builds (check the Node.js release version instead).
    region_nexus: "global; any Node.js, Bun, Python, Envoy/Istio, .NET or media-processing service that decompresses Brotli from untrusted input"
