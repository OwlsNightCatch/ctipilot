  - title: "CVE-2026-102788 / CVE-2026-102789, Balbooa Gridbox for Joomla: two unauthenticated SQL injection routes (CVSS 4.0 9.3) fixed in 2.20.4.2"
    novelty: new
    sources:
      - { url: "https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update", publisher: "Balbooa (Gridbox 2.20.4.2 security update)", date: "2026-10-27", role: "primary" }
      - { url: "https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/", publisher: "mySites.guru", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: mysites-guru feed https://mysites.guru/rss.xml (item 'Gridbox 2.20.4.2 Fixes Two Unauthenticated SQL Injection Flaws', 2026-10-27 09:27 GMT) -> primary: https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update (extract) -> CNA records read through https://cveawg.mitre.org/api/cve/CVE-2026-102788 and .../CVE-2026-102789 (Joomla CNA text: component names, versions, CVSS 4.0 9.3, finder Artur Blazewicz)"
    summary: |
      Balbooa released Gridbox 2.20.4.2 on 2026-10-27 for two unauthenticated SQL injection routes in the Joomla page builder, rated Critical by the vendor and CVSS 4.0 9.3 by the Joomla CNA. CVE-2026-102788: on store and category post list pages the sort-by URL parameter is filtered as a string and passed to GridboxHelper::getBlogPosts(), which, when the value matches no known sort key, prefixes a table alias and inserts it into the ORDER BY clause without an allowlist. CVE-2026-102789: EditorController::getBlogPosts() reads the same order parameter but, unlike its sibling tasks, omits the GridboxHelper::checkUserEditLevel() permission check, a second anonymous route to the same query. Affected per the CNA records: com_gridbox 1.0.0 to 2.20.4.1; fixed 2.20.4.2 (mySites.guru found only two PHP files changed). Both are read-side: the Joomla user table with password hashes and every other table become readable. mySites.guru says about 95% of the Gridbox sites it monitors ran an affected version on the morning of the release and that sites on the Joomla 3 line end at Gridbox 2.17.0.2, which has no fix for any of this year's Gridbox flaws; no source reports exploitation of these two. Context: Gridbox already carried an exploited wave in July 2026 (cookie-forged Super User bypass and four exploited CVEs among eleven fixed in 2.20.2), and a further unauthenticated SQL injection was fixed in 2.20.3.1.
    region_nexus: "global; Joomla sites, a CMS common on Swiss communal and regional websites"
    primary_sector_nexus: "indirect; depends on whether communal or cantonal Joomla sites run Gridbox"
    sector: "public-sector"
    cves: [CVE-2026-102788, CVE-2026-102789]
    techniques: [T1190]
    affected_products: ["Balbooa Gridbox for Joomla"]
    entity_keys: ["product:balbooa-gridbox-for-joomla", "product:joomla"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    references_hint: "context entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave (earlier Gridbox flaws, no CVE overlap)"
    evidence:
      - { quote: "Gridbox 2.20.4.1 and earlier", attribution: "Balbooa (Gridbox 2.20.4.2 security update)", source_url: "https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update" }
      - { quote: "Neither needs a login, and about 95% of the Gridbox sites we monitor were on an affected version on the morning of the release.", attribution: "mySites.guru", source_url: "https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/" }
      - { quote: "In 2.20.4.1 that task had no login or permission check, so an anonymous visitor could call it", attribution: "mySites.guru", source_url: "https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/" }
      - { quote: "Sites on the Joomla 3 line top out at Gridbox 2.17.0.2", attribution: "mySites.guru", source_url: "https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/" }
    extended_notes: |
      Exposure: installed com_gridbox version (Joomla administrator extension manager) at or below 2.20.4.1; reachable to anonymous visitors on any front-end page that renders a Gridbox store or category post list, and through the editor task endpoint without a session.
      Detection (telemetry class: web access logs + database query logs): requests to store/category list URLs carrying unusual sort-by values (time-delay, boolean or subquery fragments rather than known sort keys), repeated anonymous calls to the Gridbox editor getBlogPosts task, and slow-query bursts on the Joomla database from the web account. Because the flaws are read-only, a post-patch check is credential hygiene: password hashes and email addresses in the user table should be treated as read if the site was exposed and probed.
      Hardening: update to 2.20.4.2; Joomla 3 sites have no fix and need a supported Joomla.
      Fix verification by mySites.guru: only two PHP files differ between 2.20.4.1 and 2.20.4.2, each one of the two fixes (a strict allowlist for the sort value; a permission check that turns guests away before the query).

