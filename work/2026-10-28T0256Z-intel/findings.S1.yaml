    discovery_trace: "first seen at: work/2026-10-28T0256Z-intel/kev-window.txt (NOT COVERED) and `cisa-kev` bridge, catalogVersion 2026.10.27 -> notes field names https://www.adobe.com/trust/security/products/commerce/apsb26-73.html (extract, url --direct for the vulnerability row, WebFetch for the table) -> CISA alert https://www.cisa.gov/news-events/alerts/2026/10/27/cisa-adds-two-known-exploited-vulnerabilities-catalog -> EUVD API https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-48356&size=3 (exploitedSince 2026-10-27, EUVD-2026-44420) -> CNA record via https://cveawg.mitre.org/api/cve/CVE-2026-48356 (CISA-ADP SSVC Exploitation: active, 2026-10-27T19:53Z). Searched for a third-party exploitation report (WebSearch x3, Sansec research listing https://sansec.io/research): none names CVE-2026-48356."
    summary: |
      CISA added CVE-2026-48356, an Adobe Commerce and Magento Open Source unrestricted upload of a file with a dangerous type (CWE-434), to the KEV catalog on 2026-10-27 "based on evidence of active exploitation" (due 2026-11-10); the alert, the catalog entry and CISA's SSVC data on the CVE record (Exploitation: active, Automatable: no, Technical Impact: total) give no actor, campaign or victim, and no third-party report of exploitation was found (Sansec, the usual Magento reporter, does not mention it). Adobe disclosed and fixed the flaw on 2026-07-14 in APSB26-73 (last updated 2026-08-11) rated Critical, and that bulletin still says Adobe "is not aware of any exploits in the wild", so the exploitation claim comes from CISA alone. The CNA record, ENISA's EUVD and Adobe's bulletin describe code execution in the context of the current user that requires user interaction (a victim visits a crafted URL or interacts with a compromised page), scope changed; the CNA record scores 9.3 (vector C:H/I:H/A:N) while the bulletin prints 9.6 (A:L), a discrepancy between the two Adobe-originated sources. Affected: Adobe Commerce 2.4.9 and 2.4.8-p5, 2.4.7-p10, 2.4.6-p15, 2.4.5-p17, 2.4.4-p18 and earlier; Magento Open Source 2.4.9, 2.4.8-p5, 2.4.7-p10, 2.4.6-p15 and earlier; Adobe Commerce B2B 1.5.3 and 1.5.2-p5, 1.4.2-p10, 1.3.4-p17, 1.3.3-p18 and earlier; Adobe Commerce Events 1.6.0 to 1.20.0. Fixed: the 2026-jul builds (2.4.9-2026-jul to 2.4.4-2026-jul for Commerce, 2.4.9-2026-jul to 2.4.6-2026-jul for Magento Open Source, 1.5.3-2026-jul to 1.3.3-2026-jul for B2B) and Events 1.21.0; the bulletin does not say whether later monthly builds include the fix.
    region_nexus: "global; Adobe Commerce / Magento storefronts"
    primary_sector_nexus: "none evident; e-commerce platform"
    sector: "cross-sector"
    cves: [CVE-2026-48356]
    techniques: [T1190, T1505.003]
    affected_products: ["Adobe Commerce", "Adobe Commerce B2B", "Magento Open Source", "Adobe Commerce Events"]
    entity_keys: ["product:adobe-commerce", "product:adobe-commerce-b2b", "product:magento-open-source"]
    verification: "SINGLE-SOURCE-NATIONAL-CERT"
    confidence: MEDIUM
    evidence:
      - { quote: "based on evidence of active exploitation", attribution: "CISA (alert, KEV additions 2026-10-27)", source_url: "https://www.cisa.gov/news-events/alerts/2026/10/27/cisa-adds-two-known-exploited-vulnerabilities-catalog" }
      - { quote: "Adobe is not aware of any exploits in the wild for any of the issues addressed in these updates.", attribution: "Adobe (security bulletin APSB26-73, last updated 2026-08-11)", source_url: "https://www.adobe.com/trust/security/products/commerce/apsb26-73.html" }
      - { quote: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L", attribution: "Adobe (security bulletin APSB26-73, last updated 2026-08-11)", source_url: "https://www.adobe.com/trust/security/products/commerce/apsb26-73.html" }
    extended_notes: |
      Not in the store before (no entry carries CVE-2026-48356 or APSB26-73); the 2026-10-14 Adobe October entry covers a different Commerce flaw set (APSB26-153). KEV notes field cites the Adobe bulletin as the mitigation reference.
      The sources name neither the upload endpoint nor the exploitation route, so no behavioural description is possible beyond the class: a file with an executable type reaches the web root or a web-served media path through an upload initiated from a victim's session. Hunt concept (class only): new PHP or other executable files in web-served upload/media directories, and upload requests to the admin or REST surface from a session whose user did not initiate them; post-patch, the web-shell check matters because the fix does not remove a dropped file.
      Exposure: Commerce or Magento Open Source on a release line without a 2026-jul (or later documented) build; Composer installs keep the vulnerable base version unless the monthly release or an isolated patch is applied (Sansec, in the October Adobe entry).
