  - title: "CVE-2026-42589, Gotenberg: VulnCheck canaries record 1,358 exploitation events from seven clusters, including a custom Go implant, against a flaw that CISA has not listed"
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "unauthenticated RCE (CVSS 9.8) with first-hand multi-cluster exploitation telemetry, but a PDF-conversion microservice that is usually internal, the flaw is five months old and PoeLLM (2026-10-11 entry) already names Gotenberg as an exploited target; mainly a research item for S3"
    sources:
      - { url: "https://vulncheck.com/blog/cache-me-if-you-can", publisher: "VulnCheck (blog, 2026-10-26)", date: "2026-10-26", role: "primary" }
      - { url: "https://github.com/gotenberg/gotenberg/security/advisories/GHSA-rqgh-gxv4-6657", publisher: "Gotenberg (GitHub security advisory GHSA-rqgh-gxv4-6657)", date: "2026-04-30", role: "primary" }
    discovery_trace: "first seen at: vulncheck, WebFetch https://www.vulncheck.com/blog (listing; posts dated 2026-10-26 inside the record's 145 h lookback) -> primary: https://vulncheck.com/blog/cache-me-if-you-can (extract) -> vendor advisory https://github.com/gotenberg/gotenberg/security/advisories/GHSA-rqgh-gxv4-6657 (extract) and CNA record via https://cveawg.mitre.org/api/cve/CVE-2026-42589 (affected < 8.31.0, CVSS 3.1 9.8)"
    summary: |
      VulnCheck's canary network recorded 1,358 exploitation events from 128 source addresses over 30 days against Gotenberg's unauthenticated command execution CVE-2026-42589 (CVSS 3.1 9.8, affected before 8.31.0): the /forms/pdfengines/metadata/write endpoint passes JSON metadata keys to ExifTool, so a newline inside a key injects an argument line and the -if flag evaluates Perl, giving OS command execution in one request. VulnCheck separates at least seven clusters, from a Contabo-hosted scanner (364 events in 2026-10-19 to 2026-10-24) and XMRig cryptominers to a custom Go reverse shell, cache_base, delivered from three payload mirrors with a Node.js download fallback and tied to a GitHub repository holding Linux, Windows and MIPS builds, PHP web shells and WordPress and Joomla backdoor plugins. The flaw is in VulnCheck KEV since 2026-06-26 but, VulnCheck notes, not in CISA's catalog. Gotenberg is a Docker-based document-to-PDF service (headless Chromium, LibreOffice) used inside invoicing and document-management systems; exposure matters only where the API is reachable from untrusted networks.
    region_nexus: "global"
    primary_sector_nexus: "none evident; depends on document-generation services reachable from outside"
    sector: "cross-sector"
    cves: [CVE-2026-42589]
    techniques: [T1190, T1059.004, T1505.003]
    affected_products: ["Gotenberg"]
    entity_keys: ["product:gotenberg"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    references_hint: "context entry: 2026-10-11/poellm-botnet-github-poem-c2-exposed-ai-and-gitea-servers (names Gotenberg as an exploited target; check whether it carries this CVE)"
    evidence:
      - { quote: "1,358 exploitation events from 128 unique source IPs", attribution: "VulnCheck (blog, 2026-10-26)", source_url: "https://vulncheck.com/blog/cache-me-if-you-can" }
      - { quote: "is not listed in CISA's Known Exploited Vulnerabilities (KEV) catalog", attribution: "VulnCheck (blog, 2026-10-26)", source_url: "https://vulncheck.com/blog/cache-me-if-you-can" }
    extended_notes: |
      Exposure: Gotenberg 8.31.0 or later is fixed; check the container image tag and whether the API port is reachable beyond the application that calls it.
      Detection (web/app access logs): POSTs to /forms/pdfengines/metadata/write whose JSON metadata keys contain newline or `-if` sequences; process telemetry: wget/curl/node child processes of the Gotenberg container writing and running a downloaded binary (cache_base lock file name and dynamic-DNS C2 are in VulnCheck's post; no IOCs recorded here). EPSS 0.030 on 2026-10-27.

