    extended_notes: |
      Delta vs entry: (1) exploitation status moves from "no malicious exploitation known" to vendor-observed active exploitation of internet-exposed management interfaces; (2) vendor severity moves to Critical, urgency Highest, CVSS-B from 8.7 (availability only) to 9.2 (C:H/I:H/A:H), E:A; (3) nothing else changed in the hotfix/ETA table. Candidate for a priority raise: an exploited pre-auth RCE on a perimeter firewall management plane, vendor-confirmed.
      Exposure check (vendor): the risk is highest where the management interface is reachable from external IPs; restrict it to a jump box or trusted internal addresses. Threat Prevention coverage per the advisory (Threat IDs 543004, 97622-97625 and others from content versions 9162-9164) works only when MGT traffic is routed through a dataplane port, the management certificate is replaced, inbound traffic is decrypted and threat prevention is enabled on it.
      Hunt (Unit 42, generic): NGFW threat-log filter for threat id 543004 or threat names matching php / multipart / upload.progress / longjmp / CVE-2026-10961x on traffic towards management-reachable zones from non-internal sources.
