    summary: |
      Palo Alto Networks revised its PHP2Shell advisory at 2026-10-27 16:40 UTC: the timeline line reads "Severity Updated to Critical and Urgency updated as Highest", the Exploit Maturity field now reads Attacked, and the Exploitation Status says active exploitation has been observed targeting the PAN-OS management interface exposed to the internet. The previous revision, and the entry that covers it, said Palo Alto knew of no malicious exploitation and scored the PAN-OS impact as availability only (CVSS-B 8.7); the vendor vector is now CVSS 4.0 C:H/I:H/A:H, base 9.2 (attack complexity High) with the management interface reachable from the internet, and 7.7 (CVSS-BT 5.2) when it is reachable only from an adjacent network such as behind a jump box. The advisory names no actor, victim, count or post-exploitation behaviour, so what is known is the vendor's own statement; it is a separate vendor observation from Unit 42's 2026-10-25 retraction of an earlier claim that an attack on a European government agency was PHP2Shell. The affected surface is unchanged: the management web UI and XML API of PA-Series, VM-Series and Panorama on every release of PAN-OS 10.2, 11.1, 11.2, 12.1 and 12.2 (a dataplane interface only when a management profile is attached; GlobalProtect portal, gateway, Clientless VPN and the captive portal are not affected). The hotfix and ETA table is unchanged from the entry (eleven builds released, nine due 2026-10-27 to 2026-10-30), and the FAQ says one hotfix covers both the PHP and the Brotli flaw except 11.2.10-h16, which has only the PHP fix (11.2.10-h17 has both).
