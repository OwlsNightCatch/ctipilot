  - claim_id: 8d366ef685
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "summary"
    kind: frontmatter
    text: "Sansec reports that PolyShell, the unauthenticated file upload in the Magento and Adobe Commerce REST API that Adobe tracks as CVE-2026-48356, has been attacked since 2026-03-19, with a mass wave on 2026-03-30 that put a JavaScript loader on 471 stores in one hour. Adobe's bulletin APSB26-73 of 2026-07-14 names the 2026-jul builds as the fix and still says Adobe knows of no exploits, while Sansec says Magento 2.4.9 carried a fix on 2026-05-12; CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-27. A store that ran an unpatched build may carry a webshell that the update does not remove."
  - claim_id: 0a653561c9
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Magento Open Source and Adobe Commerce store, those on 2.4.9 included, to the 2026-jul fix in bulletin APSB26-73, then check for compromise: any script file in the custom-options upload directory, administrator accounts nobody created and loader scripts in CMS blocks, because a store that ran an unpatched build since March 2026 may already hold a webshell that the update does not remove."
