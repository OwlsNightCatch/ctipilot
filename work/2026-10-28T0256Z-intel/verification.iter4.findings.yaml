- code: F17
  category: classification
  section: entries/2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
  item: "(low confidence) classification A1 and verification multi-source after the seventh-report update"
  url_or_quote: "classification: {reliability: A, credibility: 1}; verification: multi-source"
  summary: "The headline claims added by this run (cause: open-source flaw in the portal's authentication system; no server data left; 71 customers' registration data queried; 206 backups) rest on IDC Frontier's seventh report alone; BleepingComputer (2026-10-08) predates the cause and corroborates only the outage and console lockout. Credibility 1 and multi-source overstate the corroboration shown; 2 and a victim-statement label fit."
- code: F11
