- code: F9
  category: surface-contradiction
  section: entries/2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
  item: "CVE-2026-48356 (PolyShell) action, Exposure, fixed field and summary name Magento 2.4.9 as a fixed build"
  url_or_quote: "actions[0]: \"Update every Magento Open Source and Adobe Commerce store to 2.4.9 or the 2026-jul fix in bulletin APSB26-73\"; Exposure: \"every Magento Open Source and Adobe Commerce store without the 2.4.9 or 2026-jul fix\"; summary: \"Adobe's fix reached 2.4.9 on 2026-05-12\"; cves[].fixed: \"2.4.9 (Sansec, 2026-05-12)\""
  summary: "Only Sansec says 2.4.9 carries the fix (\"Update May 12th: Adobe has released Magento 2.4.9 containing the fix\"). Adobe's own bulletin APSB26-73 (raw HTML, Date published July 14, 2026) lists \"Adobe Commerce | 2.4.9 2.4.8-p5 and earlier ...\" and \"Magento Open Source | 2.4.9 2.4.8-p5 and earlier ...\" under Affected Versions and gives \"2.4.9-2026-jul\" as the updated version, and Adobe's CNA record (cveawg.mitre.org/api/cve/CVE-2026-48356) lists lessThanOrEqual \"2.4.9, 2.4.8-p5, ...\" as affected with \"2.4.9-2026-jul\" unaffected. The entry's own affected field repeats Adobe's list including 2.4.9 while fixed lists 2.4.9, and the contradiction is not surfaced in the body or sourcing_note. Make the action and Exposure name the 2026-jul build for the reader's line (2.4.9-2026-jul included), attribute the 2.4.9 fix to Sansec only, and add a Contradiction line."
- code: F3
  category: claim-not-supported
  section: entries/2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix
  item: "CVE-2026-114148 scope restored after iteration 3 F8 (claim 6cd4cf4ad0)"
  url_or_quote: "\"affecting source-build tarballs of .NET 10 and 11 and ASP.NET Core tarballs of .NET 8 and 9 ([dotnet/announcements #495])\""
  summary: "dotnet/announcements #495 (cited) lists source-built .NET 8 and 9 as affected too: \"Source-built .NET 8 Linux distributions | >= 8.0.100, \\< 8.0.133 | 8.0.133\" and \"Source-built .NET 9 Linux distributions | >= 9.0.100, \\< 9.0.123 | 9.0.123\"; the .NET blog says for .NET 8 and 9 the flaw \"also affects ASP.NET Core distributions\". The clause drops source-built 8 and 9, and disagrees with cves[].affected (\"; source-built .NET tarballs\"). Say: ASP.NET Core runtime and targeting-pack tarballs of .NET 8 and 9, and source-built tarballs of .NET 8, 9, 10 and 11."
- code: F3
  category: claim-not-supported
  section: entries/2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
  item: "(low confidence) bulletin names the B2B build as the fix (claim 3f963ef46a)"
  url_or_quote: "\"That bulletin rates the flaw Critical at CVSS 3.1 9.6, names the 2026-jul builds of Adobe Commerce, Magento Open Source and Adobe Commerce B2B as the fix\""
  summary: "APSB26-73's CVE-2026-48356 row carries \"Notes:\" with no product mapping, while CVE-2026-47995 carries \"Notes: B2B\"; the Solution table lists B2B builds for the whole update. Only Adobe's CNA record (not cited) lists Adobe Commerce B2B for this CVE. Cite the CNA record for B2B or drop B2B from the clause; affected_products keeps it only on the CNA record's authority."
- code: F3
