  url_or_quote: "\"NetScaler Product Security says NetScaler is affected ... and that Citrix is working to upgrade the PHP package, and that all supported software versions are affected ([NetScaler Product Security, 2026-10-21])\""
  summary: "The Tech Zone post as it stands (Last updated on: October 27, 2026; read through the reader, direct fetches are 403) says \"Citrix has released fixes to address these two PHP memory safety vulnerabilities for all supported NetScaler software versions\" and carries no 'working to upgrade' text, so the clause is stale against both the cited page and the entry's own newest section. Reword to what the page says or mark it as the original 2026-10-21 wording."
- code: F3
