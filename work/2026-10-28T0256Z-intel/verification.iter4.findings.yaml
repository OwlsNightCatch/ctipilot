  summary: "Uncited, and it reads as if no PAN-OS hotfix has shipped: the advisory (read 2026-10-28 06:18 and 06:36 UTC) carries no ETA on 14 of 20 hotfix builds (released) and ETAs 10/29 or 10/30 on six; the entry's own body says \"most of its hotfixes released and the rest due by 2026-10-30\". Write 'the remaining hotfixes are due by 2026-10-30' and cite the advisory."
