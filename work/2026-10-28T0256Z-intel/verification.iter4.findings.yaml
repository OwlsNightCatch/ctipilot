  summary: "tools/fetch_source.py extract returns the full 2026-09-29 Inside IT article (trafilatura-direct, 3,161 bytes: Manno isolated the server, SafePay claimed it on its darknet presence, unspecified dataset, 3 to 4 day deadline), and fetch_source.py pdf returns the notice's restoration sentence cleanly (\"nel corso del pomeriggio è stato possibile ripristinare i dati e l'operatività tramite i backup esistenti\"). Both statements are pipeline reading-status narration and no longer true; drop them and the 'teaser' wording, and cite the article body."
