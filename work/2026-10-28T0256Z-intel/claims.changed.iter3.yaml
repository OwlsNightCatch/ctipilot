    text: "{\"id\": \"CVE-2026-48356\", \"cvss\": \"9.6 (CVSS 3.1, Adobe)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Adobe Commerce 2.4.9 and 2.4.8-p5, 2.4.7-p10, 2.4.6-p15, 2.4.5-p17 and 2.4.4-p18 and earlier; Magento Open Source 2.4.9 and 2.4.8-p5, 2.4.7-p10 and 2.4.6-p15 and earlier; Adobe Commerce B2B 1.5.3 and 1.5.2-p5, 1.4.2-p10, 1.3.4-p17 and 1.3.3-p18 and earlier (the bulletin's version table covers every fix of the update and gives no per-CVE mapping)\", \"fixed\": \"the 2026-jul builds of the same lines (for example 2.4.9-2026-jul and 2.4.8-2026-jul)\", \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
