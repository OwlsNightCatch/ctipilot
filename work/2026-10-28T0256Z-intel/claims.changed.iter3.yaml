  - claim_id: a70549fa23
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-48356, an unrestricted file upload in Adobe Commerce and Magento (CWE-434), to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation. Adobe fixed it on 2026-07-14 in bulletin APSB26-73 (Critical, CVSS 3.1 9.6, user interaction required) and the bulletin, last updated on 2026-08-11, still says Adobe knows of no exploits. No source names an actor, a victim or an attack chain."
  - claim_id: 658821d91a
    entry: 2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Check every Adobe Commerce, Magento Open Source and Adobe Commerce B2B instance against the fixed builds in bulletin APSB26-73 (the 2026-jul builds), internet-facing storefronts first, and update any that predate them."
