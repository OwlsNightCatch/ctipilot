    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "CVE-2026-102788 is in the sort-by URL parameter of store and category post lists, for which Balbooa added a strict allowlist validation ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update"]
  - claim_id: 9a936f606d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "); mySites.guru says the value previously went into the ORDER BY part of the database query ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: fbcb2d058d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "CVE-2026-102789 is a missing permission check on the editor task that loads blog posts, which Balbooa fixed by adding a user edit-level check ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update"]
  - claim_id: 70cdacfa42
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "), and mySites.guru reads it as a second anonymous route to the same query. mySites.guru reports that the Joomla CNA scores both CVSS 4.0 9.3 and lists every release from 1.0.0 to 2.20.4.1 as affected, and that only two PHP files differ between 2.20.4.1 and 2.20.4.2, one per fix ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: 7dcc384b18
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "Both flaws read data: an anonymous visitor can extract the Joomla user table, with its password hashes, and every other table the site's extensions created. mySites.guru says about 95% of the Gridbox sites it monitors ran an affected version on the morning of the release, that sites on the Joomla 3 line stop at Gridbox 2.17.0.2, which has no fix for this year's flaws, and that there is no public report of exploitation yet ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: f0c814ff51
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "**Defender takeaway:** update to 2.20.4.2 now, communal and agency sites included, and move Joomla 3 sites to a supported Joomla ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: e15ce59a68
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: uncited
    text: "Nothing here is reported exploited, unlike the July batches above; the version to be on is now 2.20.4.2."
  - claim_id: e8c32d8bc1
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: derived
    text: "**Detection:** in web access and database query logs, store or category list requests whose sort-by value is not one of the known sort keys, repeated anonymous calls to the Gridbox editor's blog-post task, and slow-query bursts from the web account; because the flaws only read, the post-patch check is credential hygiene on a site that was exposed, starting with administrator accounts nobody created, since the password hashes can be worked on offline."
  - claim_id: b776e53c67
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "record 2026-10-28T03:52:00Z"
    kind: record-summary
    text: "Balbooa released Gridbox 2.20.4.2 on 2026-10-27, fixing two unauthenticated read-side SQL injections, CVE-2026-102788 (the sort-by parameter of store and category post lists) and CVE-2026-102789 (an editor task without a permission check), both scored CVSS 4.0 9.3 by the Joomla CNA and affecting every release up to 2.20.4.1. No exploitation is reported, Joomla 3 sites have no fix, and the action now points at 2.20.4.2."
