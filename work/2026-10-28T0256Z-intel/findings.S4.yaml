      - { url: "https://hacksnack.ch/safepay-greift-kritische-infrastrukturen-in-der-schweiz-an/", publisher: "Hacksnack (relays Inside IT, not independent)", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch feed https://www.inside-it.ch/rss.xml (item 'Kritische Schweizer Infrastrukturen attackiert', 2026-10-27), fetched during the ARX cross-check → extract of https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027 (page served as raw HTML, body read from its embedded JSON) → Ransomware.live API https://api.ransomware.live/v2/groupvictims/safepay (listing of 2026-09-15, press null) → Hacksnack https://hacksnack.ch/safepay-greift-kritische-infrastrukturen-in-der-schweiz-an/ (states it relays Inside IT). WebSearch (DE, IT) for Risikomonitor, ARA Lyss and a second independent report: none found. Backlog row struck 2026-10-14 (state/coverage_backlog.md) is re-gated by this item."
    summary: |
      Ransomware.live recorded SafePay listing ara-lyss.ch on 2026-09-15; until now no press report or victim statement existed (backlog row struck 2026-10-14). Inside IT (2026-10-27) now reports that SafePay has put the stolen data into the darknet, about 49 GB for the ARA-Region Lyss-Limpachtal municipal association and about 30 GB for the Ticino commune of Manno, and that the security firm Risikomonitor analysed both sets.
      For the wastewater association Risikomonitor reports about 3,200 e-mail addresses and data on more than 1,200 identifiable persons; user folders and a data store with content to March 2026 that hold 255 password hits, 195 of them very weak; bank statements and a transaction list with more than 100 payments by private persons with name and address; the full login data to the photovoltaic-monitoring portals of another company's customers, stored on the same server; and a 2015 applicant list with birth dates, civil status, former employer and interview notes that was never deleted. Risikomonitor rates five of six data groups high or very high on ENISA's method, which is the firm's rating, not an authority's.
      The association's management told Inside IT it does not wish to comment on the incident; no notice by the association has been found, and nothing in the sources says whether plant operations were affected or what the entry route was. The BACS (Switzerland's cyber-security office) is quoted as saying SafePay, with The Gentlemen, is the third most active ransomware group in Switzerland in 2026 behind Akira and Payload, that the group is opportunistic with no particular focus on Switzerland, and that it was first seen in Switzerland in May 2025; the BACS adds that mandatory reports from critical infrastructure run at about 30 to 40 a month, ransomware at three to five. The group is described as using double extortion: data is taken before encryption and publication is threatened.
      The claim of the leak is the group's; the content analysis is Risikomonitor's, relayed by one trade outlet; the listing itself was recorded independently by a tracker.
