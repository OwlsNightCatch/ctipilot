    exposure: "Residents of Manno whose records were in the commune's file servers (social assistance, debt enforcement, naturalisation), and employees whose bank statements were kept there."
    detection: "Recipient-side signal only: unsolicited calls, letters or messages that cite a resident's social-assistance amount, debts or health insurer. The commune's September notice already warned residents to distrust unexpected urgent payment requests."
    triage: "A message that quotes a genuine monthly social-assistance amount, a debt-enforcement detail or an AHV number is not proof that it comes from the commune or an authority, given that these fields are in the published set."
    defender_takeaway: "A clean restore does not close a communal ransomware case: the entry now shows the data-theft side materialised weeks after the restore, so the data-protection notification and the resident-fraud warning have to follow the publication, not the encryption."
    extended_notes: |
      The existing entry's priority is notable; the sensitivity of the published data classes (social assistance with AHV numbers) argues for raising it. The existing entry's statement that the group's role was unconfirmed can stay attributed to the commune's silence on the publication.

  - title: "IDC Frontier final report: the IDCF Cloud ransomware began with an open-source flaw in the authentication system of the customer portal, after which the attacker obtained administrator rights on the virtualisation platform through the management console; portal records of up to 71 customers were queried and up to four passwords changed"
    sources:
      - { url: "https://www.idcf.jp/news/topics/20261027001", publisher: "IDC Frontier (7th report, Japanese)", date: "2026-10-27", role: "primary" }
      - { url: "https://www.idcf.jp/news/topics/20261018001", publisher: "IDC Frontier (6th report, Japanese)", date: "2026-10-18", role: "primary" }
    discovery_trace: "first seen at: developing-incident check of the covered entry 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups (last record 2026-10-16, fifth report) → WebSearch ('IDCフロンティア IDCFクラウド 障害 ランサムウェア 復旧 報告', which returned only reports up to the fifth) → extract of https://www.idcf.jp/news/topics/ (listing shows 6th report 2026/10/18 and 7th report 2026/10/27) → hrefs enumerated from the raw listing via url https://www.idcf.jp/news/topics/ → primary https://www.idcf.jp/news/topics/20261027001 and https://www.idcf.jp/news/topics/20261018001. No secondary coverage of the 7th report found yet (WebSearch in Japanese)."
    summary: |
      The covered entry stops at IDC Frontier's fifth report of 2026-10-14 (backups retrievable for 194 of 495 customers, no sign of customer server data taken, 48 customers' portal data queried). Two reports have followed. The sixth (2026-10-18) says the backup service was restored after a safety check, while the snapshot function stays suspended.
      The seventh report of 2026-10-27 states that the investigation is complete and names the cause: a third party exploited a vulnerability in open-source software used in the authentication system of the IDCF Cloud Portal, the portal customers use to start virtual servers and check billing, and so entered the authentication system. The attacker then obtained administrator rights on the virtualisation platform through the management console, stopped the customers' virtual servers and encrypted the servers themselves. The software is not named. The provider says traces show no customer data left the virtual servers and no secondary harm is confirmed, that it never contacted the attacker or negotiated or paid, and that 495 companies and local governments in four zones of East Japan Region 1 were affected.
      Portal registration data of up to 71 customers (up from 48) was queried without authorisation, including personal names or e-mail addresses that may contain them for up to 31 customers; no trace of removal was found; up to four login passwords were changed without authorisation and have been reset. Backup data is now retrievable for 206 customers (up from 194).
      Remediation the provider describes: rebuilding the portal in a new environment, changing the credentials of all its servers, replacing the authentication system with an external identity provider, restricting portal access to customer IP addresses with mandatory multi-factor authentication, extending vulnerability testing to open-source software with a company-wide software inventory, and a three-stage reopening in which the provider performs customers' operations until the portal returns.
    region_nexus: "Japan; provider of cloud services to 495 companies and local governments (jichitai); no Swiss customer link in sources"
    primary_sector_nexus: "indirect: a cloud provider whose affected tenants include local governments; the attack path is a customer-portal authentication flaw leading to hypervisor administrator rights"
