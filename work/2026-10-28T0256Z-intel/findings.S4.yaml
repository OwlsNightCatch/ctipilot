    exposure: "Customers of any cloud or hosting provider whose customer portal and management console share an authentication stack that includes open-source components; a portal login flaw becomes administrator control of tenant virtual machines."
    detection: "Provider-side: authentication-system and management-console logs for logins that were not customer-initiated, administrator-rights changes on the virtualisation platform, and bulk portal-record queries (the provider found up to 71 customers' records queried and up to four passwords changed). Customer-side: the first sign was virtual servers stopping and refusing restart."
    defender_takeaway: "For an outsourced hosting contract, ask the provider in writing which open-source components sit in its customer portal's authentication path, whether console access is restricted to customer addresses and requires multi-factor authentication, and keep at least one backup outside the provider's own snapshot function, because only the customers that used the snapshot function (206 of 495) could get data back."
    extended_notes: |
      The provider says the attack surface was a customer portal, not the storage or hypervisor directly; its remediation (external identity provider, IP restriction, mandatory MFA) is a checklist a public-sector buyer can reuse as a contract requirement.

  - title: "Camping.Care: a second Swiss customer, Campingplatz Huettenberg (TG), has a notice (page date 2026-10-23) that guests of several campsites receive WhatsApp phishing with real booking data; the notice names no PHP flaw and says the vendor is still investigating the cause"
    sources:
      - { url: "https://www.netzwoche.ch/news/2026-10-27/nach-angriff-ueber-php-sicherheitsluecke-nehmen-betrueger-camper-ins-visier", publisher: "Netzwoche", date: "2026-10-27", role: "primary" }
      - { url: "https://www.camping-huettenberg.ch/erreichbarkeit-ueber-die-herbst-und-winterzeit-2/", publisher: "Campingplatz Huettenberg (own notice, page date 2026-10-23)", date: "2026-10-23", role: "primary" }
      - { url: "https://www.watson.ch/schweiz/digital/154077128-tcs-camping-meldet-datenleck-nach-php-sicherheitsluecke", publisher: "watson.ch (Keystone-SDA copy)", date: "2026-10-26", role: "corroborating" }
      - { url: "https://www.inside-it.ch/tcs-wird-opfer-der-php-luecke-20261027", publisher: "Inside IT (Keystone-SDA relay)", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: netzwoche feed https://www.netzwoche.ch/rss.xml (item 2026-10-27 10:40Z) → Netzwoche article https://www.netzwoche.ch/news/2026-10-27/nach-angriff-ueber-php-sicherheitsluecke-nehmen-betrueger-camper-ins-visier → primary victim notice https://www.camping-huettenberg.ch/erreichbarkeit-ueber-die-herbst-und-winterzeit-2/ (fetched with the exact link the article gives, which carries a utm parameter) → watson https://www.watson.ch/schweiz/digital/154077128-tcs-camping-meldet-datenleck-nach-php-sicherheitsluecke → Inside IT https://www.inside-it.ch/tcs-wird-opfer-der-php-luecke-20261027"
    summary: |
      The covered entry (TCS Camping warns 15,000 guests, data stolen at the booking-system supplier Camping.Care) says no other Camping.Care customer is named and that SRF and Blick tie the theft to the PHP flaws without any source naming the entry point. Netzwoche (2026-10-27) now names a second Swiss customer: Campingplatz Huettenberg in canton Thurgau, whose own notice (page date 2026-10-23) says Camping.care informed it that guests of several campsites are receiving WhatsApp messages about existing bookings that contain real booking details and a link, that these are phishing messages sent neither by the campsite nor by Camping.care, and that Camping.care is investigating the cause and that it must currently be assumed that booking data was used without authorisation.
      Netzwoche points out that the campsite's notice does not say whether the attackers actually used one of the PHP flaws. The PHP link therefore rests on SRF's and Blick's reporting and a TCS spokesperson's statement to Keystone-SDA, not on a statement by the vendor. The campsite's page carries the date 2026-10-23 in its metadata (the notice text itself has no date), two days after the PHP patches of 2026-10-21; if that date is the publication date, the WhatsApp fraud was already circulating three days before TCS's confirmation of 2026-10-26.
      Facts not in the sources: the intrusion date, the entry point, the number of Camping.Care customers affected and whether any CVE was involved.
