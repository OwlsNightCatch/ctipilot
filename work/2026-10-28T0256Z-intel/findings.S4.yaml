  - title: "Manno (TI): SafePay has published about 30 GB, which Risikomonitor's analysis, relayed by Inside IT, finds includes social-assistance decisions with AHV numbers and health-insurer names, debt-enforcement extracts, naturalisation files and a near-complete address book of the commune's 1,381 residents; the commune declines to comment"
    sources:
      - { url: "https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027", publisher: "Inside IT", date: "2026-10-27", role: "primary" }
      - { url: "https://api.ransomware.live/v2/groupvictims/safepay", publisher: "Ransomware.live (API v2 claim records: manno.ch discovered 2026-09-28, press field empty)", date: "2026-09-28", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch feed https://www.inside-it.ch/rss.xml (item 'Kritische Schweizer Infrastrukturen attackiert', 2026-10-27) → extract of https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027 → covered entry 2026-09-30/manno-ti-commune-ransomware-safepay-claim (updates: [], its sourcing note says the Inside IT body was not readable on 2026-09-30) → Ransomware.live API record for manno.ch (press still null). Manno's own notice page https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico.html re-fetched: no newer notice."
    summary: |
      The covered entry holds the commune's own notice of 2026-09-16 (encryption on 4 August, restored from backup) and Ransomware.live's record of SafePay listing manno.ch on 2026-09-28; it records that no dataset was described and that the group's role was unconfirmed. The new fact is Inside IT's report of 2026-10-27 that SafePay has since put the stolen data into the darknet, about 30 GB for Manno, and that Risikomonitor analysed it.
      Risikomonitor reports files with about 5,300 e-mail addresses and more than 2,000 identifiable persons; social-assistance decisions with name, address, monthly amount, AHV numbers and health insurer covering 2014 to December 2025; debt-enforcement register extracts, naturalisation dossiers from 2018 and payment orders against tax debtors; employees' bank statements with IBANs; mass letters, a survey on youth protection and a list of property owners with parcel and water-meter numbers that together make a near-complete address book of a commune of 1,381 inhabitants. Risikomonitor's managing director says whoever holds the data knows who receives social assistance, who has debts and who is old, which is material for fraud against the weakest.
      Manno published the attack itself in September and, asked about SafePay's publication, answered that the commune will make no statement on the matter. The date of the publication is not given. The group's role was a tracker listing; the content description is one firm's analysis relayed by one trade outlet.
