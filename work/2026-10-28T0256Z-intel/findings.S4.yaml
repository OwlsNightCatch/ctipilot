    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/ (extract listing, 2026-10-28) → DataBreaches post https://databreaches.net/2026/10/27/privacy-commissioner-of-canada-to-investigate-data-breach-involving-crime-stoppers/ → primary OPC release https://www.priv.gc.ca/en/opc-news/news-and-announcements/2026/nr-c_261027/ and Navigate360's notice https://navigate360.com/blog/navigate360-notice-of-data-breach/ ; context post https://databreaches.net/2026/10/27/navigate360s-lack-of-transparency-is-catching-up-with-them-more-organizations-tell-people-not-to-use-their-tiplines/"
    summary: |
      The Privacy Commissioner of Canada announced on 2026-10-27 an investigation into Navigate360, the company that provides and manages the tip-management platform used by Canadian Crime Stoppers chapters, to examine the security safeguards in place at the time of the breach. Crime Stoppers itself, a not-for-profit, falls outside the federal private-sector privacy law.
      Navigate360's own notice, published on 2026-10-22 or 23, says it became aware of suspicious activity on about 2026-03-18 and that an unauthorised third party accessed one of its systems and obtained copies of data between 2025-11-21 and 2026-03-05; the data may include name, address, date of birth, social security numbers, telephone numbers and e-mail addresses.
      DataBreaches.net, a C-rated outlet that holds a copy of the data set, reports that a hacktivist took 8.3 million tips, among them tips from students, teachers, community members and members of the US armed forces, that tipsters were promised anonymity and encryption at rest, that Ontario Crime Stoppers organisations have suspended use of the platform, and that the Nevada Department of Education's SafeVoice programme said about 10 percent of its tips containing personally identifiable information were compromised. Those figures are DataBreaches.net's and the Nevada statement's, not Navigate360's; the entry route and the actor's name are not in the primary sources.
