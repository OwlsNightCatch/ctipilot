        translation: "After entering the portal's authentication system, the attacker obtained administrator rights on the virtualisation platform through the management console, stopped customers' virtual servers and encrypted the servers themselves."
        attribution: "IDC Frontier"
        source_url: "https://www.idcf.jp/news/topics/20261027001"
