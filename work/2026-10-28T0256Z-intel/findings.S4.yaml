    summary: |
      Moldova's e-Governance Agency (AGE) says its government digital services were attacked from the night of 2026-10-22, with about 11 million requests recorded; the attack ran until 2026-10-23, and the services at risk were taken offline. According to AGE's preliminary estimate, the attackers targeted about one million personal identification numbers (IDNPs) and extracted records on about 750,000 people.
      AGE explained that the attackers exploited vulnerabilities in services accessible without authentication. The data that may be involved includes names, dates and places of birth, family details, insurance status, pensions, social benefits, disabilities, photographs, driving-licence and vehicle details, IBANs, tax debts and payment history through the MPay payment service. AGE says bank-card data was not affected and it found no unauthorised changes to state registers, but some users saw in the history of the EVO government app that their data had been used to request civil-status documents or apply for a driving licence.
      The prime minister, per UA.NEWS, says about 82 services were audited, some issues were fixed and the government will not hurry to restore every platform before experts are satisfied it is safe. The investigation involves the Cybersecurity Agency, STISC, SIS and the National Center for Personal Data Protection; no actor is named.
      Both outlets relay AGE and government statements, so they are one source in substance; the figures are AGE's preliminary estimates.
