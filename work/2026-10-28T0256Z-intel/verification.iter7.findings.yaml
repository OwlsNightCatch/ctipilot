  summary: "(low confidence) HPE's bulletin says \"customers are asked to consider removing guest portals and all management interfaces from public access until ClearPass instances have been upgraded to a version providing some level of mitigation\"; the headline turns the request into 'should go private' (body, summary and Exposure line carry HPE's wording correctly). Say 'HPE asks customers to consider taking guest portals off public access'."
