- code: F3
  category: claim-not-supported
  section: updated-entries
  item: "netscaler-php2shell-management-gui-fixes-2026-10-27 (body paragraph 2 and summary)"
  url_or_quote: "https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"
  summary: "(low confidence) Body: \"Until a build is installed, Citrix tells customers to restrict GUI and API access on those addresses to trusted administrative hosts or narrowly scoped management networks ...\" and summary: \"... and tells customers to restrict management access to trusted networks until they are installed\". The Tech Zone post as last updated 2026-10-27 (saved reader body quote-bodies/d3ac951301303b64.extract.txt, 'Last updated on: October 27, 2026') says \"Customers should immediately restrict access to NetScaler management interfaces to trusted, limited networks.\" and cites the Secure Deployment Guide rule that management interfaces \"must be logically or physically isolated from data traffic, completely blocked from the Internet, and restricted via ACLs to trusted administrative subnets only\"; it ties no end date to the restriction, and CTX697263 only points to the blog for \"immediate mitigation guidance\". The 2026-10-27 revision added the sentence that fixes are released but left the guidance unconditional, so the 'until a build is installed' bound is the entry's own, not Citrix's. Fix: attribute only 'immediately restrict' and the standing isolation rule to Citrix, and keep 'until the builds are installed' as the entry's own advice outside the Citrix-attributed clause (body paragraph 2 and summary)."
- code: F11
