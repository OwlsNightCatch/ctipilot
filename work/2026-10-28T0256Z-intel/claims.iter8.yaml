    surface: "summary"
    kind: frontmatter
    text: "IDC Frontier, a SoftBank Group subsidiary, says a ransomware attack from about 3:40 a.m. on 2026-10-07 stopped four zones of its IDCF Cloud East Japan Region 1, affecting 495 companies and local governments. Its seventh report of 2026-10-27, which closes the investigation, says an open-source flaw in the authentication system of the customer portal was exploited, after which the attacker took administrator rights on the virtualisation platform through the management console, stopped customers' virtual servers and encrypted them; it finds no trace of server data leaving, says portal registration data of up to 71 customers was queried and that backups are retrievable for 206 customers. The software is not named."
