    surface: "body"
    kind: cited
    text: "**Detection:** inventory the external script references of each public site and flag any whose domain has been re-registered or no longer belongs to its provider; Report URI recommends script monitoring that shows when a new script or domain appears on a page, and a Content Security Policy that controls which domains a site may load code from ("
