  - claim_id: 20be16d7d8
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "In Balbooa's Gridbox page builder, \"A critical unauthenticated authentication bypass in Gridbox let anyone become a Super User on a Joomla site by setting a single browser cookie\" ("
    urls: ["https://mysites.guru/blog/gridbox-critical-authentication-bypass/"]
  - claim_id: fd4f3a6d1d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "EasyStore for Joomla carried an unauthenticated SQL injection able to read the whole site database (CVE-2026-65761, scored 9.3 by the Joomla CNA) plus an order-forgery flaw (CVE-2026-65759, 8.7) where \"An anonymous request to the order-repayment endpoint could mark any order paid with no login, no token, and no contact with any payment gateway\" ("
    urls: ["https://mysites.guru/blog/easystore-security-disclosure/"]
  - claim_id: 17cbd2d688
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "Events Booking exposed invoices containing personal and financial data to anonymous requests that simply walked sequential identifiers, fixed in 5.8.2 ("
    urls: ["https://mysites.guru/blog/events-booking-invoice-idor/"]
  - claim_id: 10ee58bf86
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "The Joomla CNA disagreed\" and it was assigned CVE-2026-62415 at 9.1 critical, fixed in Membership Pro 4.6.2 ("
    urls: ["https://mysites.guru/blog/membership-pro-unauthenticated-file-upload/"]
  - claim_id: fe06ee4fa1
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The Joomla third-party-extension disclosure wave covered here since early July has been a file-upload story: unauthenticated uploads reaching code execution, several of which were weaponised and CISA-KEV-listed within days of disclosure."
  - claim_id: 2d23f4ae22
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The batch mySites.guru published between 2026-07-20 and 2026-07-23 adds a different and more direct failure."
  - claim_id: ce213a1e1e
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The extension treats a client-supplied cookie value as proof of identity rather than as an assertion to be validated against server-side session state, so an anonymous requester who places an administrator's username in that cookie is served the site as that administrator — no password, no login form, no pre-existing session."
  - claim_id: a811447ba5
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "Because a Joomla Super User can edit templates, and templates are PHP, the practical outcome is code execution on the web server from a single unauthenticated request."
  - claim_id: 4ad00ca3ef
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "Gridbox 2.20.1 fixes it; the vulnerable code had shipped since the previous release in October 2025, roughly nine months of exposure."
  - claim_id: e6bccd96f6
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The rest of the week's batch is the same research campaign continuing on its original axis, with two flaws that matter beyond the site itself."
  - claim_id: a40b7a51c5
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "There is no public exploitation signal for any of these: the researcher withholds the exact cookie name, endpoints and proof-of-concept code under a fix-first policy."
  - claim_id: 3d535d8124
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The reason to act ahead of the routine extension-update cycle is the wave's own track record rather than current telemetry — earlier members of this same disclosure series moved from publication to confirmed in-the-wild exploitation within days once the mechanism became public, and a cookie-forgery bypass is trivially rediscovered by anyone who diffs the 2.20.1 release against its predecessor."
  - claim_id: a837d02f0c
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Joomla is common in European public-sector, municipal and education web estates, and this class of flaw sits in third-party extensions that rarely appear in vulnerability-management inventories keyed on the CMS core version."
  - claim_id: d2a80502bc
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "Enumerate installed extensions and their versions as first-class inventory, not as a property of the Joomla install, and prioritise Gridbox given the nine-month exposure window and the anonymous-to-admin outcome."
  - claim_id: 0244729a85
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "**Triage:** a cookie-forgery bypass leaves little at the network layer to distinguish it — the request is well-formed and returns HTTP 200."
  - claim_id: 10a70872a3
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "The observable is the mismatch between authentication and privilege: administrative actions in Joomla's action log attributed to a Super User account with no preceding successful login event for that account, and no session-establishment record."
  - claim_id: e2f002b9d7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "Legitimate administrator activity is preceded by an authentication event from a consistent source; forged-cookie access produces privileged actions that appear without one."
  - claim_id: e39ac6c393
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "On sites running affected Gridbox versions, template-file modification timestamps postdating the October 2025 release, with no corresponding administrator login, are the artefacts worth reviewing."
  - claim_id: 53477b5fd7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "Balbooa released Gridbox 2.20.4.2 on 2026-10-27 with two security fixes rated Critical, for the versions 2.20.4.1 and earlier ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update"]
  - claim_id: 7e4367abdd
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "CVE-2026-102788 is in the sort-by URL parameter of store and category post lists and CVE-2026-102789 is a missing permission check on the editor task that loads blog posts ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: 30d873686a
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "); Balbooa's fixes are a strict allowlist validation for the sort-by parameter and a user edit-level check on the editor task ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-4-2-security-hardening-update"]
  - claim_id: 439a0e9175
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "). mySites.guru says the sort value previously went into the ORDER BY part of the database query and reads the second flaw as a second anonymous route to the same query. mySites.guru reports that the Joomla CNA scores both CVSS 4.0 9.3 and lists every release from 1.0.0 to 2.20.4.1 as affected, and that only two PHP files differ between 2.20.4.1 and 2.20.4.2, one per fix ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: 7dcc384b18
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "Both flaws read data: an anonymous visitor can extract the Joomla user table, with its password hashes, and every other table the site's extensions created. mySites.guru says about 95% of the Gridbox sites it monitors ran an affected version on the morning of the release, that sites on the Joomla 3 line stop at Gridbox 2.17.0.2, which has no fix for this year's flaws, and that there is no public report of exploitation yet ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: f0c814ff51
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "**Defender takeaway:** update to 2.20.4.2 now, communal and agency sites included, and move Joomla 3 sites to a supported Joomla ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: e15ce59a68
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: uncited
    text: "Nothing here is reported exploited, unlike the July batches above; the version to be on is now 2.20.4.2."
  - claim_id: e8c32d8bc1
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: derived
    text: "**Detection:** in web access and database query logs, store or category list requests whose sort-by value is not one of the known sort keys, repeated anonymous calls to the Gridbox editor's blog-post task, and slow-query bursts from the web account; because the flaws only read, the post-patch check is credential hygiene on a site that was exposed, starting with administrator accounts nobody created, since the password hashes can be worked on offline."
  - claim_id: b776e53c67
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "record 2026-10-28T03:52:00Z"
    kind: record-summary
    text: "Balbooa released Gridbox 2.20.4.2 on 2026-10-27, fixing two unauthenticated read-side SQL injections, CVE-2026-102788 (the sort-by parameter of store and category post lists) and CVE-2026-102789 (an editor task without a permission check), both scored CVSS 4.0 9.3 by the Joomla CNA and affecting every release up to 2.20.4.1. No exploitation is reported, Joomla 3 sites have no fix, and the action now points at 2.20.4.2."
  - claim_id: eecfb7af4b
    entry: 2026-09-30/manno-ti-commune-ransomware-safepay-claim
    surface: "headline"
    kind: frontmatter
    text: "Inside IT: SafePay published about 30 GB from Manno, social-assistance files with AHV numbers; no commune statement"
  - claim_id: fd8634f2b4
    entry: 2026-09-30/manno-ti-commune-ransomware-safepay-claim
    surface: "summary"
    kind: frontmatter
    text: "The Ticino commune of Manno stated in a signed notice of 2026-09-16 that part of its servers were hit by an attack that encrypted data on 4 August 2026; it isolated the server and restored from existing backups. SafePay, recorded on 2026-09-28 listing manno.ch on its leak site, has since put about 30 GB of stolen data into the darknet, and Inside IT reports of 2026-10-27 that the security firm Risikomonitor found social-assistance decisions with AHV numbers and health insurers from 2014 to December 2025, debt-enforcement extracts, naturalisation files and data on the whole population of 1,381; the commune says it will make no statement."
  - claim_id: b5c4d89e71
    entry: 2026-09-30/manno-ti-commune-ransomware-safepay-claim
    surface: "body"
    kind: cited
    text: "The Ticino commune of Manno stated in a signed notice dated 2026-09-16 that on 4 August 2026 part of its servers suffered an attack that encrypted data ("
    urls: ["https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico/sidebar/0/items/0/file/Pubblicazione%20avviso%20attacco%20informatico.pdf.pdf"]
  - claim_id: b39575c7dd
