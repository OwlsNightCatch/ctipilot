    surface: "body"
    kind: cited
    text: "The commune isolated the affected server immediately and, per the notice, restored data and operations from existing backups in the course of the afternoon ("
    urls: ["https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico/sidebar/0/items/0/file/Pubblicazione%20avviso%20attacco%20informatico.pdf.pdf"]
  - claim_id: f805deeb05
