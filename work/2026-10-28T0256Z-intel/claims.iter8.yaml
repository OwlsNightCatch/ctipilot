    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "headline"
    kind: frontmatter
    text: "DeadTag: expired tag domains send visitors to iPhone exploit kits; opening the page is enough on vulnerable iOS"
  - claim_id: c8d062cb0f
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "summary"
    kind: frontmatter
    text: "Report URI and iVerify report that an operator they call DeadTag buys the expired domains of old analytics and advertising tags that thousands of websites still load, so every page that carries the tag runs the operator's script, and sells the visitors on; Report URI counts more than 660 re-registered domains. For chosen iPhone visitors one chain ends at a page that serves the Coruna kit to iOS 13 to 17.2.1 and a modified DarkSword kit to iOS 18.4 to 18.7, both of which attack the browser itself, so that opening the page compromises a vulnerable device and steals keychain passwords and crypto-wallet data."
  - claim_id: bc0bd4f49c
    entry: 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits
    surface: "actions[0]"
    kind: frontmatter
    text: "List every third-party script domain on the public websites your organisation, its agencies and its hosting suppliers run, and remove or re-verify each whose provider has shut down, because DeadTag buys exactly those expired domains."
  - claim_id: 90d396e249
