    text: "**Exposure:** any public website that still loads a script from a third-party domain whose provider no longer operates it, where the browser fetches nothing useful and the page looks normal, and any iPhone on iOS 13 to 17.2.1 or 18.4 to 18.7 that opens such a page ("
