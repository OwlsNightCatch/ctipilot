    text: "Node2Shell Brotli flaw is now on CISA KEV, with exploit traffic seen against Node.js 24.22.0; update now"
  - claim_id: 3026eae6cd
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-111497, an out-of-bounds write in the Brotli decoder bundled with Node.js, to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation, and ELLIO's sensors recorded exploit traffic against Node.js 24.22.0 on 2026-10-26, though its own copy of the attacker's chain got no shell. Node.js 22.23.4, 24.22.1 and 26.12.1 fix it, and because the flaw is in Google's decoder the PyPI packages Brotli (1.2.1) and brotlicffi (1.2.1.0), Envoy, Microsoft .NET, PHP for Windows, Ubuntu and, with Brotli inspection and TLS decryption enabled, PAN-OS 12.2, 12.1 and 11.2 firewalls carry it too; Palo Alto and Cisco report no malicious use against their own products."
  - claim_id: 524ae395b4
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images (a Dockerfile that pins 24.22.0 keeps the flaw until the pin changes), and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; judge a Node.js build by its release version, because process.versions.brotli reads 1.2.0 on patched builds too, and move any application on an end-of-life Node.js line to a supported release."
  - claim_id: eda4db7a81
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every Envoy proxy that has the Brotli decompressor configured to v1.40.0, v1.39.3, v1.38.6, v1.37.8 or v1.36.12; the advisory names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable."
  - claim_id: 1ca60e5544
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[2]"
    kind: frontmatter
    text: "On every PA-Series and VM-Series firewall on PAN-OS 12.2, 12.1 or 11.2 that has TLS decryption enabled, run show system setting brotli and, where it returns Enabled: yes, run set system setting brotli-encoding disable until the hotfix for the release is installed; 12.1.4-h13, 12.1.10-h3 and 11.2.4-h23 are still due, on 2026-10-29 and 2026-10-30."
  - claim_id: 468ca9f7d0
