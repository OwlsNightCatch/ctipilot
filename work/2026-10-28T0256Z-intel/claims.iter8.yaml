    entry: 2026-10-28/ara-region-lyss-limpachtal-safepay-darknet-publication
    surface: "body"
    kind: cited
    text: "Risikomonitor's analysis, relayed by Inside IT and not verified independently, finds about 3,200 e-mail addresses and data on more than 1,200 identifiable persons; user folders and a data store with content up to March 2026 that hold 255 password hits, 195 of them very weak; bank statements and a transaction list with more than 100 payments by private persons with name and address; the full login data to the monitoring portals of the photovoltaic plants of another company's customers, stored on the same server; and a 2015 applicant list with birth dates, civil status, former employer and interview notes that was never deleted ("
    urls: ["https://www.inside-it.ch/kritische-schweizer-infrastrukturen-attackiert-20261027"]
