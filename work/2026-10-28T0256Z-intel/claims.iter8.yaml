  - claim_id: f8f9f6fcec
    entry: 2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix
    surface: "summary"
    kind: frontmatter
    text: "Microsoft released .NET 8.0.33, 9.0.22, 10.0.14 and 11 Release Candidate 3 out of band on 2026-10-25 to fix the Brotli decoder flaw CVE-2026-111497 (CVSS 3.1 8.1, publicly disclosed, rated Exploitation More Likely) and to deliver the corrected fixes for CVE-2026-70197 (Windows sockets memory corruption, CVSS 3.1 8.1) and CVE-2026-102870 (Blazor debugger), which the 2026-10-13 release did not fully address. Brotli exposure needs an application that decompresses attacker-controlled Brotli data, which ASP.NET Core and HttpClient do not do by default; CISA lists CVE-2026-111497 as exploited since 2026-10-27, although Microsoft's record still said not exploited on 2026-10-25 and no source reports an attack on .NET."
