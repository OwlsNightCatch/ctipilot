    surface: "body"
    kind: cited
    text: "**Defender takeaway:** remove dead third-party tags from every site you run, enforce a Content Security Policy and keep iPhones on the current iOS, with Lockdown Mode for people who may be targeted; for an iPhone that may have opened an affected page, Report URI advises restarting it, changing the passwords stored in its keychain and moving crypto assets to a new wallet ("
