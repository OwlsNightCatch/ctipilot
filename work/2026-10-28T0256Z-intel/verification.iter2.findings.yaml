- code: F7
  category: drop
  section: entries/2026-10-28/cve-2026-102788-102789-balbooa-gridbox-joomla-unauth-sqli
  item: "(low confidence) recorded borderline include; judged the stated ground"
  url_or_quote: "Balbooa Gridbox CVE-2026-102788 and CVE-2026-102789, an unauthenticated read-side SQL injection with no exploitation report, kept under the 'otherwise' limb of PD-11 (b): sibling Gridbox flaws were exploited in July and the Joomla-extension disclosure-stream rule gives each product its own entry"
  summary: "The ground holds only narrowly. (1) PD-11(b)'s otherwise limb names 'sibling flaws in the same wave weaponised within days'; the July flaws were a different wave three months earlier, and the entry itself says no exploitation is reported. The leg that does hold is 'a fix diff that hands over the technique' (mySites.guru: two PHP files differ, one per fix), but the entry never says which limb applies. (2) The disclosure-stream rule says each product gets its own entry; Gridbox already has one (2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave) that absorbed the later Gridbox batches as changelog records (2026-07-31 and 2026-09-29, the latter including the 2.20.3.1 unauthenticated blind SQL injection that mySites.guru calls the same mistake in the same listing code), so the rule points at an update there, not a second Gridbox entry. Either fold this finding into that entry as an update record or state the PD-11(b) limb in one clause in the Defender takeaway."
