  item: "entries/2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27.md (evidence[0] and evidence[2])"
  url_or_quote: "evidence[0] (https://support.citrix.com/external/article/CTX697263): \"Impacted. Please refer to the blog for more information and immediate mitigation guidance\"; evidence[2] (Tech Zone post): \"Citrix plans to release fixes to address these two PHP memory safety vulnerabilities for all supported NetScaler software versions on October 27, 2026.\""
  summary: "Two evidence quotes are no longer contiguous verbatim text on the pages the entry cites, because Citrix revised both on 2026-10-27 and this run kept the old quotes while adding two new ones (the record's fields name evidence). CTX697263 now reads 'Impacted. What Customers Should Do Cloud Software Group strongly urges customers ... [four fixed builds] ... Please refer to the blog for more information and immediate mitigation guidance: <link>', so the quote splices two sentences across the inserted text (saved raw body work/<run>/quote-bodies/d2bdf0341f894b25.html.txt: 'Impacted. What Customers Should Do ...'). The Tech Zone post (last updated October 27, 2026 PDT; saved body quote-bodies/d3ac951301303b64.extract.txt) now says 'Citrix has released fixes to address these two PHP memory safety vulnerabilities for all supported NetScaler software versions' and carries no 'plans to release' text (0 matches), so the quoted sentence sits under a headline that says the fix is out and reads as current. check_run quote-literal passed because neither page is machine-checkable by direct transport. Fix: drop both quotes or replace them with the current sentences ('Citrix has released fixes to address these two PHP memory safety vulnerabilities for all supported NetScaler software versions.'; 'Impacted.' alone or the 'Cloud Software Group strongly urges customers ... 14.1-73.49 and later releases' sentence)."
- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "entries/2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud.md, Defender takeaway"
  url_or_quote: "\"... because SRF, Blick and a TCS spokesperson tie this theft to the PHP flaws although a customer's notice says the supplier is still investigating the cause ([Campingplatz Huettenberg, 2026-10-23](https://www.camping-huettenberg.ch/erreichbarkeit-ueber-die-herbst-und-winterzeit-2/))\""
  summary: "(low confidence) The remediation of the iteration-5 attribution finding added the Huettenberg cite at the end of a clause that also states 'SRF, Blick and a TCS spokesperson tie this theft to the PHP flaws'. The Huettenberg notice carries only 'Camping.care untersucht derzeit die Ursache des Vorfalls. Nach aktuellem Stand ist davon auszugehen, dass Buchungsdaten unbefugt verwendet wurden.' and does not mention PHP, SRF, Blick or TCS. The tie is documented on the SRF, Blick and watson pages cited earlier in the entry, so the fact is true and sourced elsewhere; under the adjacency rule the cite vouches for the whole clause. Fix: add the SRF, Blick and watson cites after 'PHP flaws', or split the clause so the Huettenberg cite follows only the 'still investigating the cause' half."
