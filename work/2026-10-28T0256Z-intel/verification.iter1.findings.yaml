- code: F9
  category: surface-contradiction
  section: entries/2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
  item: '2026-10-28 section: ''revised its advisory on 2026-10-27 (16:40 UTC) to record that active exploitation has been observed targeting the ... management interface exposed to the internet''; record summary; PHP entry section'
  url_or_quote: Palo Alto Networks revised its advisory on 2026-10-27 (16:40 UTC) to record that active exploitation has been observed
  summary: The vendor timeline (security.paloaltonetworks.com/json/CVE-2026-109618) ends with 2026-10-27T16:40 'Severity Updated to Critical and Urgency updated as Highest' and carries no later entry. The Wayback copy of the HTML page taken 2026-10-27T17:10:28Z (https://web.archive.org/web/20261027171028/https://security.paloaltonetworks.com/CVE-2026-109618) reads 'Very limited exploitation has been observed targeting the Palo Alto Networks management interface.'; the live page and the 03:34 UTC copy read 'Active exploitation has been observed targeting the Palo Alto Networks management interface exposed to the internet.' The wording was strengthened after 17:10 UTC without a timeline record. Do not tie 'active' to the 16:40 revision; add a Contradiction line that the vendor first said 'very limited' and later 'active ... exposed to the internet'.
