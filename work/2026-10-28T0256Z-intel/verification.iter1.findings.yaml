  section: entries/2026-10-27/camping-care-tcs-camping-data-theft-php-flaw-whatsapp-fraud
  item: '2026-10-28 section and record summary: ''The link to the PHP flaws therefore rests on SRF, Blick and the TCS statements, not on the supplier.'' (the TCS statement has no citation)'
  url_or_quote: rests on SRF, Blick and the TCS statements
  summary: 'No cited source carries a TCS statement tying the theft to PHP: SRF writes the PHP link in its own voice ("Im Zusammenhang mit der weltweiten Sicherheitslücke bei der Programmiersprache PHP warnt TCS Camping ...") and quotes TCS only on theft, IBAN data and the closed hole. The source that does carry it is not in sources[]: Watson/Keystone-SDA (https://www.watson.ch/schweiz/digital/154077128-tcs-camping-meldet-datenleck-nach-php-sicherheitsluecke, 2026-10-26): "Betrüger konnten im Zusammenhang mit der internationalen Sicherheitslücke bei der Programmiersprache PHP Kundschafts- und Buchungsinformationen entwenden, wie ein Sprecher des Touring Club Schweiz (TCS) ... bestätigte." Add Watson as a source and cite the clause; the same article is the better basis for the headline''s ''PHP link not vendor-confirmed'' (vendor = Camping.Care).'
