  section: entries/2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
  item: affected_products[] and cves[].affected/fixed omit dependents the cited sources name
  url_or_quote: 'affected_products: [Node.js, Google Brotli, Python Brotli (PyPI), brotlicffi (PyPI), Envoy Proxy, Microsoft .NET, Palo Alto Networks PAN-OS]'
  summary: The entry's own 2026-10-27 section says NCSC names Bun among the affected dependents, yet Bun is absent from cves[].affected and affected_products. ELLIO's fix table (https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/) lists Bun 1.4.4, Ruby brotli gem 0.9.1/0.9.2, Debian bookworm 1.0.9-2+deb12u1, Debian trixie 1.1.0-2+deb13u1, Alpine 1.2.1-r0 / 1.1.1-r0; Tenable lists Bun and Istio; NCSC (https://security-hub.ncsc.admin.ch/#/posts/13105) lists PowerShell and Visual Studio. Distro packages matter for container fleets; add them to affected/fixed.
