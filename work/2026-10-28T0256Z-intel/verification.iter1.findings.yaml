- code: F3
  category: claim-not-supported
  section: entries/2026-10-28/cisco-php2shell-expressway-urwb-duo-access-gateway-fixes
  item: 'Cisco entry: ISE Portal Builder is said to need an administrator login and to score CVSS 3.1 6.6'
  url_or_quote: 'ISE Portal Builder is offline for remediation, where the attacker must be authenticated as an administrator, which lowers its CVSS 3.1 score to 6.6 | cves[].affected: "... and, with an administrator login, Identity Services Engine Portal Builder" | sourcing_note: "The advisory carries no CVSS score except for ISE Portal Builder" | evidence[2]: "For this product, the attacker must be authenticated as an administrator to exploit this vulnerability."'
  summary: 'Live Cisco page (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-php-october26-Jj384Daq, v1.8) has the footnote marker on the URWB row: <td>Ultra-Reliable Wireless Backhaul (URWB)<sup>1,2</sup><br>Unified Industrial Wireless Software</td>; the ISE Portal Builder row <td>Identity Services Engine (ISE) Portal Builder</td> carries no footnote. Footnote 1 (admin must be authenticated, CVSS vector reducing the score to 6.6) therefore belongs to URWB, as the PHP entry''s own 2026-10-24 section already says. Fix the body paragraph, both cves[].affected strings, the sourcing_note and the evidence[2] context; ISE Portal Builder has no stated score or admin condition.'
- code: F3
  category: claim-not-supported
  section: entries/2026-10-28/hpe-clearpass-php2shell-hotfixes-hpesbnw05171
  item: 'HPE ClearPass: ''hotfixed 6.14.1 or 6.11.16, which it describes as versions providing some level of mitigation'' and ''the hotfix is described as a mitigation level'''
  url_or_quote: 'until the ClearPass instances run the hotfixed 6.14.1 or 6.11.16, which it describes as versions providing some level of mitigation | summary: "until the hotfixed versions run" | takeaway: "the hotfix is described as a mitigation level, so check HPE''s bulletin for a full fix before treating the exposure as closed"'
  summary: 'CSAF https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05171.json workaround text: "until ClearPass instances have been upgraded to a version providing some level of mitigation. These versions are 6.14.1 and 6.11.16." The word hotfix is not there, the same bulletin lists 6.14.1 and 6.11.16 as affected ("and below", known_affected >=6.14.0|<=6.14.1), and the hotfix patches are the remediations[0] category vendor_fix. The entry inserts ''hotfixed'' and then tells readers the fix is only a mitigation level. Quote HPE''s wording as is, add a Contradiction line (the mitigation versions are also listed as affected) and drop the ''check for a full fix'' advice.'
