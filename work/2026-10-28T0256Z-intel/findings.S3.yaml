    date: '2026-10-21'
    role: primary
  discovery_trace: 'first seen at: iverify-blog, URL https://www.iverify.com/blog (url --direct listing; relative blog links) -> https://www.iverify.com/blog/malvertising-coruna-darksword-iphone-exploits
    (extract, dated 2026-10-21) -> corroborating/primary for the web-delivery side: https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/
    (found in rss https://blog.report-uri.com/rss/, dated 2026-10-22). Rotational lookback: the iVerify post is about four hours older
    than that record''s horizon, Report URI''s post is inside it'
  summary: 'iVerify (2026-10-21, device side) and Report URI (2026-10-22, web-delivery side) report independently that an operator they
    call DeadTag buys the expired domains of defunct analytics, advertising and other third-party tag providers that thousands of sites
    still load, so every page that carries the old tag now runs the operator''s script. The script is about 2 KB, does nothing for bots,
    scanners or repeat data-centre visitors, asks the operator''s server per visitor and redirects selected visitors, apparently selling
    the traffic: destinations include scam pages, fake VPN pop-ups and an iPhone exploit crew''s page that serves Coruna to iOS 13 to
    17.2.1 and a modified ''P7'' DarkSword to iOS 18.4 to 18.7, both of which attack the browser itself, so opening the page is enough.
    Report URI counts 660+ re-registered domains on thousands of sites and cautiously estimates 135 million visits a month, and iVerify
    says DeadTag appears focused on European domains; the kits steal keychain secrets, crypto-wallet app data and device and account
    information and send them to one server. iVerify separately caught P7 DarkSword through a malicious Instagram ad on an employee
    phone at a customer, whose security team rotated credentials before they were sold, and its post, which presents the joint findings,
    says a DarkSword loader was found on hundreds of PrestaShop stores hidden in a folder named like analytics code. Report URI says
    DeadTag''s own origin is unknown, and the joint post describes the iPhone crew as at least Chinese-speaking from Chinese code comments
    and wallet targeting, an inference rather than attribution; the vendors sell tag-monitoring and mobile-EDR products.'
  region_nexus: global with a European skew per iVerify; Swiss sites or staff iPhones are not named
  primary_sector_nexus: indirect (public websites that still load third-party tags; staff iPhones on old iOS)
