  exposure: Windows endpoints where a user (often with local admin rights) downloads an 'AI desktop client' ZIP from a GitHub release
    or Pages site that is not the vendor's official distribution; developer and IT workstations are the typical population.
  detection: 'Image-load and process telemetry: a signed vendor Setup.exe or Cursor.exe loading winmm.dll from its own extracted folder
    instead of System32; creation of a WMProcess folder under ProgramData holding a copy of WMPDMC.exe plus an unexpected wmpdui.dll;
    a boot-time scheduled task running as SYSTEM from that path with Author ''Microsoft Corporation'' but created by a non-Microsoft
    process (Windows Security event 4698 or Task Scheduler operational event 106); non-browser processes fetching Telegram channel pages
    and querying dns.google resolve for TXT records; svchost.exe with an injected miner, a local Tor SOCKS listener and obfs4 egress;
    hidden PowerShell (-WindowStyle Hidden -ExecutionPolicy Bypass -File) from a randomly named %TEMP% folder. Source-grounded behaviours
    only; the report also publishes YARA, which is not reproduced here.'
  triage: WMPDMC.exe is a genuine Windows binary in System32; the discriminator the report gives is a copy under ProgramData with an
    adjacent wmpdui.dll and a boot task created by a non-Microsoft process. Legitimate AI desktop clients are distributed from the vendor's
    site or store, not from a GitHub release of an unrelated account.
  defender_takeaway: Block or allow-list installers for AI desktop clients (obtain them only from the vendor's official site or the
    software centre), alert on sideloading of system DLL names (winmm.dll) from user-writable folders next to signed binaries, and hunt
    for the ProgramData scheduled-task and DoH/Telegram patterns above.
  extended_notes: Check Point shows the actor reusing one DJB2 hashing scheme with different seeds per stage and an earlier June 2026
    variant with a Startup-folder LNK under a misspelled 'Microsaft Difendir' folder; the final payload being a miner makes the immediate
    impact modest, but the generic signed-tasking loader means a later wave could carry anything. Check Point publishes full indicators
    (not reproduced).
- title: 'DeadTag: expired analytics and ad-tag domains re-registered to funnel visitors, mostly of European sites, to the Coruna and
    DarkSword iPhone exploit kits with no click required'
  sources:
  - url: https://blog.report-uri.com/deadtag-how-forgotten-website-tags-became-a-delivery-network-for-iphone-spyware/
    publisher: Report URI (Scott Helme)
