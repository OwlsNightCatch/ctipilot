    ad; any public website that still includes script tags from analytics, advertising or widget providers that no longer operate (check
    script hosts for domains whose registration changed hands).
  detection: 'Web side: Content Security Policy report-only logs and script monitoring that show a new third-party script host, and
    registration-date or registrant changes (RDAP) on domains your pages load scripts from; the operator cloaks, so a scanner from a
    data-centre address often sees an empty response. Device side: mobile EDR or MDM alerts on Safari renderer crashes or exploit indicators,
    and credential rotation for any user whose phone was exposed (iVerify''s customer did this in time).'
  defender_takeaway: Keep managed iPhones off the targeted iOS ranges (iOS 18.4 to 18.7 and 17.2.1 and earlier) through MDM version
    enforcement and consider Lockdown Mode for high-risk users; for public websites, inventory every third-party script, remove tags
    of defunct providers and enforce a Content Security Policy with an allow-list.
  extended_notes: Both research teams sell relevant products (Report URI tag monitoring, iVerify mobile EDR); the mechanism is documented
    with decoded chains, so the finding stands, but the 135-million-visits figure is Report URI's cautious estimate. Citizen Lab's AdFection
    report on targeted-ad delivery of Candiru (already in the store as 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery)
    is the targeted counterpart that iVerify cites.
- title: 'Kaspersky Securelist: managed-Kubernetes tenant isolation bypass chain, from a k0s Konnectivity DIAL_REQ SSRF to control-plane
    D-Bus and a flat overlay network exposing other tenants'' databases, logs and Salt master'
  sources:
