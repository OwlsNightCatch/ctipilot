    publisher: SecurityWeek
    date: '2026-10-27'
    role: corroborating
  discovery_trace: 'first seen at: securityweek, rss https://www.securityweek.com/feed/ -> https://www.securityweek.com/tailscale-rushes-patches-after-uncoordinated-disclosure-of-tailworm-flaws/
    -> pivot: researcher report https://tailworm.com/ -> pivot: vendor https://tailscale.com/ssh-investigation-update -> primary: https://tailscale.com/blog/tailscale-ssh-findings-fixes
    and https://tailscale.com/security-bulletins (extract)'
  summary: 'Cyberdione Labs (researcher Erica Windisch) published an unsolicited audit of Tailscale client 1.104.2 and headscale 0.29.5
    on 2026-10-24, about two hours after sending it to Tailscale, with 11 findings reproduced in a lab between 2026-10-22 and 2026-10-24.
    Tailscale shipped v1.104.4 on 2026-10-27 with four bulletins (TS-2026-014 to TS-2026-017) and says it was already investigating.
    The central class: Tailscale SSH, built into the root-privileged tailscaled, validates unix-socket paths lexically but performs
    forwarding (ssh -L and -R) as root, so an approved peer whose SSH policy rule allows forwarding can dial root-only sockets such
    as the Docker socket or the tailscaled local API, unlink and replace root-owned sockets, and win a check-to-use rename race against
    the path allowlist. Cyberdione reports root via Docker, intermittent root via the systemd private socket, capture of a node enrolment
    key from the local API and enrolment of a rogue node in tailnets without Tailnet Lock, and measures lab propagation of under a second
    per hop across every device the SSH policy permits, which it calls wormable; Tailscale disputes the worm framing, describes lateral
    movement limited to connections the tailnet policy already allows, and stresses that an attacker needs a foothold on an authorized
    peer with SSH explicitly permitted. The other fixed items are unbounded session memory in tailscaled SSH (TS-2026-015), tailscale
    serve TCP forwards and a symlink race that reach the tailscaled local API (TS-2026-016) and capability-header bleed across HTTP/2
    serve mounts (TS-2026-017). Per Cyberdione''s matrix of 2026-10-28, still open or partial are the headscale registration-cache eviction
    (pre-auth onboarding lockout) and embedded-DERP memory growth, a funnel entitlement finding that Tailscale calls as designed (bypass
    needs local admin) and the conn25 connector egress gap (open pull request); Tailscale says conn25 is pre-production and the stable
    app connectors are not affected. Neither SecurityWeek nor the report mentions in-the-wild exploitation, and no CVE identifiers are
    cited.'
  region_nexus: global; no source states Swiss or European public-sector use; relevant wherever Tailscale or self-hosted headscale provides
    administrative access to Linux servers
