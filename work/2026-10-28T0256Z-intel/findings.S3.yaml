  summary: Eye Security's threat hunting found an Updater.exe from the abandoned Time4Popcorn fork of Popcorn Time beaconing to an unregistered
    update domain; after registering it, Eye saw over 3.8 million hardware IDs over six months (about 2.5 to 3 million Windows and 250,000
    to 350,000 macOS hosts per SecurityWeek's reading, under 200,000 Android). The updater runs at boot, requests updates over unencrypted
    HTTP, does no code signing and downloads and executes any executable the answering domain returns with NT AUTHORITY\SYSTEM or root
    privileges; the flaw is CVE-2026-30612, advised in June 2026. With no vendor left, Eye registered 15 unowned domains from November
    2025 and pushed an update that only stops and disables the updater service on Windows and macOS (about 2 million systems by March
    2026, a 98 percent drop in requests), and The Shadowserver Foundation took over the domains in late March; the Android updater needs
    user action and was not disabled. Eye says clients connected from end-user ISPs and also from 'various government and military networks'
    and corporate networks, and that the rest of the application, built on a 2014 Chrome without a sandbox, remains risky, so its advice
    is to uninstall it.
