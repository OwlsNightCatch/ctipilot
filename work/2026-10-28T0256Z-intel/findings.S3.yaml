    first independent coverage, but the reopen conditions the audit set (a vendor advisory naming common server or PC lines, or exploitation)
    are still unmet, exposure is limited to the PXE-boot window with ICMP reachability, and the constituency has no named exposure;
    S1 may also carry it'
  evidence:
  - quote: an unauthenticated network attacker who can deliver ICMP error messages to it can corrupt DXE-phase memory and execute arbitrary
      code before the operating system loads
    attribution: TianoCore EDK II
    source_url: https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m
  - quote: The vulnerability, with a severity rating of 9.5 out of 10
    attribution: Ars Technica
    source_url: https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/
  - quote: With publicly available patch code, it will be trivial for advanced hackers to learn how the vulnerability is triggered and
      to build working exploits.
    attribution: Ars Technica
    source_url: https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/
  exposure: Machines whose EDK II-based firmware network-boots (PXE over IPv4 or IPv6) on a segment an attacker can send ICMP to; servers
    and PCs that boot only from local disk with PXE disabled are outside the window. Which firmware builds carry the fix is vendor-specific
    (OEM capsule updates); the project fix is EDK II pull request 13302.
  detection: 'Network telemetry on provisioning and imaging VLANs: unicast ICMP error messages (destination unreachable and similar)
    to clients during PXE boot, especially oversized ones or from hosts that are not the PXE or DHCP servers; PXE boot hangs (the source''s
    deterministic crash case) on specific clients. No host-side detection exists before the OS loads; verify firmware level through
    the OEM''s inventory tooling.'
