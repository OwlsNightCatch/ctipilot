  - url: https://github.com/k0sproject/k0s/security/advisories/GHSA-3588-pcxv-rx45
    publisher: k0s project (KLSA-00466, GHSA-3588-pcxv-rx45)
    date: '2026-08-31'
    role: primary
  discovery_trace: 'first seen at: kaspersky-securelist, rss https://securelist.com/feed/ (gap-fill sweep of research feeds, not in
    the S3 slice) -> primary: https://securelist.com/cloud-infrastructure-isolation-bypass/121609/ -> primary for the k0s component:
    https://github.com/k0sproject/k0s/security/advisories/GHSA-3588-pcxv-rx45 (both extract)'
  summary: 'Kaspersky Security Services (Matvey Bukhtoyarov; Securelist 2026-10-27, first presented at SAS on 2026-10-22) describes
    an authorised bug-bounty penetration test of an anonymised major cloud provider that Kaspersky says is fully fixed. As an ordinary
    tenant it created a privileged pod with host PID in the provider''s managed k0s cluster (v1.25.16+k0s.0), whose security policies
    did not block it, and entered the worker host as root; a Konnectivity token on the worker then let it send a forged DIAL_REQ to
    the control plane''s konnectivity-server, which dialled the attacker''s chosen protocol and address, including unix sockets, giving
    an SSRF in the control-plane context. Through the control-plane D-Bus socket it enabled user lingering and started a transient systemd
    unit for code execution, then used a known OverlayFS user-namespace bug for root. From there a flat overlay network exposed other
    tenants'' assets: a VictoriaMetrics target list naming other customers'' control planes, VictoriaLogs holding cloud-init output
    with root SSH private keys, managed Kafka hosts with an exposed JMX/RMI registry that allowed an MLet-loaded MBean, a redis exporter
    whose scrape target parameter leaked the instance credentials, unauthenticated etcd that allowed a Patroni archive_command change
    for PostgreSQL code execution, and a Salt master custom pillar with SQL injection. The k0s project''s advisory for the Konnectivity
    part (affected k0s releases v1.21 to v1.27 that use its apiserver-network-proxy fork, CVSS 3 6.4, CVE not assigned) gives as remediation
    migrating to the upstream kubernetes-sigs apiserver-network-proxy rather than a fixed k0s version.'
  region_nexus: global; provider unnamed (the Russian Pentest Award entry), so no Swiss exposure can be stated
  primary_sector_nexus: indirect (tenants of managed Kubernetes and database services; operators of self-managed k0s)
