    had seen the GHSA via BSI WID-SEC-2026-4136 and dropped it as borderline pending a vendor advisory naming common server lines or
    exploitation'
  summary: The TianoCore project's advisory (published 2026-10-22) says that while a machine PXE-boots over IPv4 or IPv6, an unauthenticated
    attacker who can deliver ICMP error messages to it can corrupt DXE-phase memory in the PXE Base Code driver (UefiPxeBcDxe) and,
    knowing the firmware build, run code before the operating system loads and before Secure Boot or measured boot checks anything;
    the copy loop writes messages longer than its fixed 504-byte field past it, and the exposure window is the duration of the PXE boot.
    Ars Technica (2026-10-27) adds the CVE identifier, a severity of 9.5 out of 10, and that the finders, Alex Matrosov (Anthropic)
    and Dan Holmes (Google), had planned coordinated disclosure for January until AMI published a pull request with the fix last month,
    after which TianoCore published the advisory; Ars says the public patch makes working exploits trivial for skilled attackers, that
    virtually all UEFI suppliers including AMI, Insyde and Phoenix use the EDK II reference code extensively and that Microsoft's Project
    Mu used the code containing the vulnerable component. The fix is EDK II pull request 13302, but firmware reaches fleets only through
    each vendor's firmware update, and no vendor advisory naming server product lines and no exploitation report was found.
  region_nexus: global; data-centre and PC fleets that network-boot
