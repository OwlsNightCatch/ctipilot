- title: 'Yoba: fake GitHub ''ChatGPT, Claude and Cursor desktop'' projects ship malware beside genuine signed OpenAI and Anthropic
    binaries (DLL sideloading), a Telegram-picture DGA with DNS-over-HTTPS tasking and an XMRig miner over Tor'
  sources:
  - url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    publisher: Check Point Research
    date: '2026-10-27'
    role: primary
  discovery_trace: 'first seen at: checkpoint-research, rss https://research.checkpoint.com/feed/ (gap-fill sweep of research feeds,
    not in the S3 slice) -> primary: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    (extract); no independent corroboration found'
  summary: 'Check Point Research (2026-10-27) tracks a two-month campaign it names Yoba: fake GitHub repositories and GitHub Pages sites
    impersonating desktop apps such as ''GPT-5.6 Sol'', ''GPT-6 Astra'' and ''Claude Opus'', which rank in Google results (Check Point
    assesses SEO poisoning; no fake stars or forks). Each unencrypted ZIP release holds a genuine signed OpenAI or Anthropic Setup.exe
    next to a malicious winmm.dll that is sideloaded; the DLL (YobaDropper) checks that its host process name hashes to the expected
    value (otherwise it sleeps about 12.7 days), skips systems with CIS-region keyboard layouts (Ukrainian excepted) and demands administrator
    rights, then copies System32''s WMPDMC.exe into a WMProcess folder under ProgramData next to a dropped wmpdui.dll and persists through
    a boot-time scheduled task as LocalSystem whose author is ''Microsoft Corporation'' and whose description reads ''Collects device
    metadata for Windows Media Player''. The second stage (YobaLoader) reads a Telegram channel page, uses the last 50 bytes of the
    channel''s profile picture to derive a word-list domain on a free dynamic-DNS service, asks Google''s DNS-over-HTTPS API for its
    TXT record, verifies an Ed25519 signature and decrypts a pointer to a payload on a public file host plus one of three launch modes
    (inject into svchost.exe, write an EXE to %TEMP% after stripping the Zone.Identifier stream, or run a hidden PowerShell script).
    The observed payload was XMRig 6.26.0 injected into svchost.exe and reaching an onion mining endpoint through a bundled Tor client
    with obfs4 bridges, but Check Point stresses the loader is generic and an operator can push any PE or PowerShell payload; an earlier
    variant of June 2026 sideloaded through a Cursor.exe host. Check Point says indicators suggest Russian origins and a UTC-4 working
    pattern (the latter from compilation timestamps); that is an assessment, not attribution to a named group.'
  region_nexus: global; no Swiss or public-sector victim named
  primary_sector_nexus: indirect (staff and developers downloading AI desktop clients from GitHub)
