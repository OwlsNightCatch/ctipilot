- title: 'PHP2Shell: Bishop Fox responder guidance adds a lab reproduction with ASLR on, FPM yielding denial of service, and a per-setting
    hardening assessment'
  sources:
  - url: https://bishopfox.com/blog/responder-guidance-for-php2shell
    publisher: Bishop Fox (Jon Williams and Threat Enablement team)
    date: '2026-10-27'
    role: primary
  discovery_trace: 'first seen at: bishopfox-blog, rss https://bishopfox.com/feeds/blog.rss -> primary: https://bishopfox.com/blog/responder-guidance-for-php2shell
    (extract)'
  summary: 'Bishop Fox (2026-10-27) says its team reproduced full unauthenticated remote code execution for the PHP2Shell flaws against
    stock php:8.3, 8.4 and 8.5 Apache mod_php Docker images with ASLR on, over HTTP only and with no debugger, and that real application
    images with opcache enabled forced the attacker to recalibrate. In its testing the direct out-of-memory path against PHP-FPM produced
    denial of service rather than code execution, though it says an application-dependent RCE path on FPM exists and that the vendor
    treats every SAPI as at risk. It assesses mitigations one by one, as partial only: session.upload_progress.enabled=0 set before
    request parsing (not by ini_set or .user.ini) removes the confirmed CVE-2026-109619 session vector; memory_limit=-1 with enforcement
    removes the attacker-tunable memory limit that drives the OOM; low post_max_size and request-shape caps (parts, headers, fields,
    nesting) at the proxy remove the most reliable way to drive the exhaustion; display_errors off at request start denies the public
    session-based chain the address leak it takes from error output; fatal_error_backtraces=0 on PHP 8.5 blocks one trigger; and it
    advises patching to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or a vendor backport for 7.4, 8.0 and 8.1, then restarting every worker. The
    store''s PHP entry already carries VulnCheck''s ASLR-bypass exploit, the honeypot confirmation and CISA''s KEV listing; Bishop Fox''s
    addition is an independent reproduction and the per-setting reading.'
  region_nexus: global
  primary_sector_nexus: direct (PHP applications across cantonal, communal and federal sites are in scope per BACS in the existing entry)
  sector: cross-sector
  event_date: '2026-10-27'
