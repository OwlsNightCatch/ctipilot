    basis: Cyberdione Labs' Tailworm report audits Tailscale 1.104.2 and headscale 0.29.5 (tailworm.com, 2026-10-24); Tailscale confirms
      the SSH and Serve findings in bulletins TS-2026-014 to TS-2026-017
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  suggested_admiralty: B1
  evidence:
  - quote: Tailscale SSH performs no user-level authentication.
    attribution: Cyberdione Labs
    source_url: https://tailworm.com/
  - quote: Exploitation requires an existing foothold on an authorized peer in the tailnet
    attribution: Tailscale
    source_url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
  - quote: This vulnerability is fixed in Tailscale version 1.104.4 or newer.
    attribution: Tailscale
    source_url: https://tailscale.com/security-bulletins
  - quote: Neither Tailscale nor the Tailworm report mentions in-the-wild exploitation.
    attribution: SecurityWeek
    source_url: https://www.securityweek.com/tailscale-rushes-patches-after-uncoordinated-disclosure-of-tailworm-flaws/
  exposure: 'tailscaled below 1.104.4 on hosts that run Tailscale SSH and whose SSH policy rules allow local or remote forwarding (SaaS:
    per-rule forwarding fields; Cyberdione says headscale v0.29.5 grants forwarding on every accepted SSH session); nodes using tailscale
    serve with TCP forwards to unix sockets; internet-reachable self-hosted headscale 0.29.5 (pre-auth findings). Version check: tailscale
    version on each node; SSH exposure: the tailnet policy file''s ssh rules and forwarding settings.'
  detection: 'Cyberdione''s unpatched-state sensors: auditd (object-scoped) on unix-socket unlink, bind and chmod in /tmp, home directories
    and /run/user and on the agent''s own socket paths; a socket at mode 0755 where 0600 is expected as a signature of a race-won bind;
    inotify or audit rate alerts on sustained directory rename loops; alerts on auth-key issuance or use outside change windows and
    on a node joining with a previously unseen key under a tagged identity; one network endpoint serving a second node identity. After
    patching: look for rogue tailnet devices and rotate auth keys; Cyberdione says a node''s identity is key material in its state file,
    so reimaging a rooted host does not revoke a stolen copy and the device must be deleted at the control plane (or its key expire).'
  triage: Admins legitimately forward ports and sockets over Tailscale SSH. The discriminators the report gives are forwarding aimed
    at root-owned unix sockets (Docker, systemd private socket, tailscaled local API) from an unprivileged account, sockets bound at
    0755, and rename storms in the session's directory. These come from a lab write-up and are hunting leads, not validated field signatures.
  defender_takeaway: 'Update tailscaled to 1.104.4 or later, rewrite SSH policy as per-pair grants rather than identity-wide or tag-wide
    accept rules, disable SSH forwarding where unneeded (Tailscale: the TS_SSH_DISABLE_FORWARDING environment setting or the policy
    flags) and consider SSH check mode for sensitive servers; treat every headscale 0.29.5 SSH grant as root-equivalent until fixed
    (Cyberdione''s claim).'
  extended_notes: 'Disclosure dispute worth carrying: Cyberdione published hours after notifying the vendor and argued rapid awareness
    speeds remediation; Tailscale says it received the report on the morning of Saturday 2026-10-24 and was already working on related
    fixes since concerns circulated on 2026-10-23. The ''worm'' label is the researcher''s lab measurement; Tailscale calls it policy-bounded
    lateral movement. Both agree on prerequisites (foothold on an authorized peer).'
