    attribution: k0s project (KLSA-00466)
    source_url: https://github.com/k0sproject/k0s/security/advisories/GHSA-3588-pcxv-rx45
  exposure: Self-managed k0s clusters on the listed releases that use the project's apiserver-network-proxy fork (an attacker needs
    a compromised worker or the konnectivity-agent token); managed Kubernetes or database services whose provider runs a flat overlay
    between tenant control planes and shared management services (a provider-side property a tenant cannot inspect).
  detection: 'On clusters you run: admission or audit logs showing pods created with privileged true, hostPID or host namespaces; konnectivity-server
    logs with DIAL_REQ targets that are unix sockets or non-node addresses; unexpected D-Bus calls (SetUserLinger, StartTransientUnit)
    from a service account''s process on a control-plane node; JMX/RMI, etcd, redis-exporter scrape and VictoriaLogs queries from tenant
    address space.'
  defender_takeaway: For self-managed Kubernetes, deny privileged pods and host namespaces by admission policy, keep control-plane services
    off tenant-reachable networks, bind JMX/RMI stubs to loopback, require authentication on etcd and metrics/log back ends, and plan
    the k0s move off the vulnerable proxy fork; for provider assessments, ask how tenant management networks are segmented.
