    (extract)'
  summary: Sysdig's Threat Research Team (2026-10-27) analysed every public bypass of the defenses built against malicious Python pickle
    model files and says none of PyTorch's restricted loader (weights_only), Keras safe mode or model-file scanners held up against
    six documented CVE bypasses, because pickle is a program for a stack-based virtual machine and a file that is invalid as a whole
    can still execute in part. The post explains why torch.save and joblib are pickle, ranks model formats by danger, reports Sysdig's
    measurement of malicious model loads against two detection engines and gives deployment and runtime-detection guidance; only the
    framing and the headline claim were read in full here, so specifics of the ranked formats and detection results are not carried.
