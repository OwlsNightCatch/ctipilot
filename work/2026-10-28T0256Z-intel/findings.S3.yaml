- title: 'Node2Shell / Brotli2Shell (CVE-2026-111497): JFrog reaches FFmpeg through JPEG XL, crashes ClickHouse and loops Apache Arrow;
    Bun and Istio fixes, Akamai''s body-parser lever and a February upstream fix'
  sources:
  - url: https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/
    publisher: JFrog Security Research
    date: '2026-10-25'
    role: primary
  - url: https://www.akamai.com/blog/security-research/inside-node2shell-closer-look-cve-2026-111497
    publisher: Akamai Security Intelligence Group
    date: '2026-10-26'
    role: primary
  - url: https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497
    publisher: Tenable Research Special Operations
    date: '2026-10-26'
    role: corroborating
  - url: https://github.com/oven-sh/bun/security/advisories/GHSA-663w-cv8g-jj2p
    publisher: Bun project (GHSA-663w-cv8g-jj2p)
    date: '2026-10-23'
    role: primary
  - url: https://istio.io/latest/news/security/istio-security-2026-007/
    publisher: Istio (ISTIO-SECURITY-2026-007)
    date: '2026-10-15'
    role: corroborating
  discovery_trace: 'first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-while-everyone-was-looking-at-php-another-rce-is-wrecking-whats-left-of-the-internet/
    (2026-10-26; Brotli breadth) -> gap-fill rss sweep: tenable-research FAQ https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497
    -> pivots: JFrog https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/, Akamai https://www.akamai.com/blog/security-research/inside-node2shell-closer-look-cve-2026-111497,
    Bun https://github.com/oven-sh/bun/security/advisories/GHSA-663w-cv8g-jj2p, Istio https://istio.io/latest/news/security/istio-security-2026-007/
    (all extract)'
  summary: 'JFrog Security Research (2026-10-25) shows the Brotli decoder flaw is reachable without HTTP: a crafted JPEG XL file reaches
    it through FFmpeg''s libjxl (a Brotli-compressed brob metadata box) and gives instruction-pointer control in its proof of concept
    without a demonstrated code execution; a single HTTP request with a crafted 23 MB body and Content-Encoding br crashed a tested
    ClickHouse server (the fix is merged but no release had shipped); a 534-byte input sends Apache Arrow''s pyarrow into an infinite
    loop (issue open); and a .NET runtime crash reproduced locally. JFrog also released a scanner for Brotli decoding paths and notes
    that version-only scanners miss bundled copies. Akamai (2026-10-26) reports telemetry showing 61 percent of networks run affected
    Node.js versions and gives a concrete lever: set the body-parser inflate option to false so Express 5 rejects compressed request
    bodies with HTTP 415. Bun''s advisory (2026-10-23) fixes the bundled decoder in Bun 1.4.4, notes that executables built with bun
    build --compile must be rebuilt, and lists decompress false on fetch as a per-request workaround; Tenable lists Istio 1.29.9, 1.30.6
    and 1.31.2 as fixed and says Envoy and Istio had shipped fixes earlier in October without naming the flaw and that Google committed
    the upstream fix to the Brotli source repository on February 27. The store''s entry names Node.js, PyPI, Envoy, .NET, PAN-OS, PHP
    for Windows and Ubuntu and cites NCSC naming Bun, so Bun''s fixed release, Istio, the non-HTTP reach and the February upstream commit
    are new; Tenable says some projects had not shipped a fixed release as of 2026-10-26, and no source reports exploitation outside
    research demonstrations.'
  region_nexus: global; NCSC Switzerland advisory 13105 already cited by the existing entry
  primary_sector_nexus: direct (Node.js, Envoy and Istio estates in federal and cantonal platforms; media and data-processing pipelines)
