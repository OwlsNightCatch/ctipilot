  - quote: A single HTTP request containing a crafted 23 MB body crashed the tested ClickHouse server.
    attribution: JFrog Security Research
    source_url: https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/
  - quote: If your application does not need to accept compressed request bodies, set the body-parser inflate option to false.
    attribution: Akamai Security Intelligence Group
    source_url: https://www.akamai.com/blog/security-research/inside-node2shell-closer-look-cve-2026-111497
  - quote: Bun 1.4.4 updates brotli to 1.2.1, which contains the fix.
    attribution: Bun project
    source_url: https://github.com/oven-sh/bun/security/advisories/GHSA-663w-cv8g-jj2p
  - quote: had already shipped fixed releases earlier in October without naming the flaw
    attribution: Tenable Research Special Operations
    source_url: https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497
  exposure: 'In addition to the existing entry: Bun below 1.4.4 (fetch, node:zlib and DecompressionStream decode Brotli; compiled executables
    embed the runtime), Istio 1.29.0 to 1.29.8, 1.30.0 to 1.30.5 and 1.31.0 to 1.31.1 with Brotli decompression enabled (for example
    through an EnvoyFilter), ClickHouse servers that accept Content-Encoding br (no fixed release at the time), FFmpeg builds with libjxl,
    and pyarrow reading Brotli-compressed Parquet.'
  detection: HTTP logs with Content-Encoding br request bodies to Express 5 or body-parser endpoints, ClickHouse HTTP interface crashes
    after a large br body, and processes that decode untrusted JPEG XL or Parquet inputs crashing or spinning on CPU; JFrog's open-source
    scanner and the Trail of Bits Brotli checker find decoding paths that inventory by version misses.
  defender_takeaway: Where Node.js cannot be updated yet, set body-parser inflate to false (Akamai) or reject Content-Encoding br; rebuild
    bun build --compile executables after moving to Bun 1.4.4; inventory bundled Brotli copies and non-HTTP decode paths rather than
    versions only.
  extended_notes: 'Meaning for the brief: the upstream Brotli fix was committed to the repository on 2026-02-27, about eight months
    before disclosure, consistent with the silent-fix-then-disclose pattern also visible in the EDK II item above. Istio''s own advisory
    is dated 2026-10-15 and predates the Node.js disclosure.'
