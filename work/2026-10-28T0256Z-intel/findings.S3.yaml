- title: 'Tailworm: Cyberdione Labs'' 11 findings in Tailscale SSH, Serve and headscale, published before any fix; Tailscale v1.104.4
    (2026-10-27) closes the root unix-socket forwarding flaws'
  sources:
  - url: https://tailworm.com/
    publisher: Cyberdione Labs (Erica Windisch), Tailworm security assessment report
    date: '2026-10-24'
    role: primary
  - url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
