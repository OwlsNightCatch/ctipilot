  exposure: Applies to police and fire/rescue organisations that run legacy ICT or let suppliers or a parent authority host their data
    and systems; the report's test is whether supplier-held systems and logs fall inside the organisation's own monitoring and incident-reporting
    terms.
  detection: 'The report''s relevant observation: supplier-held system logs are often not visible to in-house security teams, so supplier-side
    compromise is detected late or by third parties; contract terms for prompt incident reporting and log access are the lever, not
    an endpoint detection.'
  defender_takeaway: Check each supplier that holds operational or victim data for ongoing (not one-off) cyber assurance, a prompt incident-reporting
    duty and in-house visibility of its logs, and test restore from backups; HMICFRS ties both to its recommendations on procurement,
