    -> full report https://hmicfrs.justiceinspectorates.gov.uk/publication-html/cybersecurity-in-police-forces-and-fire-and-rescue-services
    (extract)'
  summary: His Majesty's Inspectorate of Constabulary and Fire & Rescue Services (HMICFRS) published on 2026-10-27 the public version
    of an inspection of three police forces and three fire and rescue services plus national bodies such as the Police Digital Service.
    It reports that leaders in both sectors name legacy ICT as their highest strategic cyber risk; that third-party suppliers who hold
    or manage sensitive police data (victims, safeguarding, intelligence, investigations) sit outside the force's protective monitoring;
    that preparedness is underdeveloped, with unsatisfactory ICT backup and restoration arrangements; that some organisations have weak
    joiner-mover-leaver controls, poor password management and no multi-factor authentication; and that monitoring coverage is often
    insufficient, with fire and rescue services frequently dependent on local-authority ICT. Its 13 recommendations cover baseline standards,
    external validation of self-assessments, procurement and contract management of third-party ICT suppliers (for fire and rescue,
    a May 2027 deadline for chief fire officers to ensure new or renewed contracts meet Cyber Essentials and Secure by Design) and a
    national monitoring capability for fire and rescue. The Record adds that most police supplier contracts included no ongoing cybersecurity
    assurance, that supplier-held system logs were not routinely visible to in-house teams in several organisations, and that the Police
    Digital Service recorded 252 incidents and 796 near misses in the first quarter of 2026; the report withholds which suppliers or
    forces were hit and whether data was stolen.
  region_nexus: UK (England and Wales); no Swiss obligation changes. Swiss cantonal police and communal fire and rescue services that
    rely on external software suppliers face the same assurance and log-visibility gaps (S3 assessment), and the Swiss supplier incidents
    already in the store (Publica / PK Softech) are of the kind the report describes
  primary_sector_nexus: direct (police and fire/rescue sector, transferable lessons)
