    text: "The decoder is Google's, so Bun (fixed in 1.4.4), Istio, the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (1.2.1.0), Envoy and Microsoft .NET carry the flaw too ("
    urls: ["https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/", "https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497", "https://opensourcemalware.com/blog/node2shell-affects-python", "https://github.com/envoyproxy/envoy/security/advisories/GHSA-3wvj-j6qm-62mr", "https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/"]
