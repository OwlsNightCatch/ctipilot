- code: F4
  category: hallucinated-fact
  section: entries/2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
  item: "CVE-2026-48356, Adobe Commerce and Magento: CISA lists the unrestricted file upload flaw as exploited"
  url_or_quote: "summary: \"No source names an actor, a victim or an attack chain.\"; Defender takeaway: \"because CISA reports exploitation but no source says since when\"; Detection: \"As an inference from the flaw class, not from a reported attack\"; sourcing_note: \"The exploitation status rests on CISA alone\""
  summary: "False against sources the CVE record itself links. cveawg.mitre.org/api/cve/CVE-2026-48356 (dateUpdated 2026-10-28T03:55:44Z, CISA-ADP container, SSVC Exploitation: active) references https://sansec.io/research/magento-cms-block-loader-deepveindrilling and https://sansec.io/research/polyshell-mass-attack-wave. Sansec 2026-03-17 (https://sansec.io/research/magento-polyshell): 'Sansec discovered and named the PolyShell vulnerability (CVE-2026-48356): a critical flaw in Magento's REST API that lets unauthenticated attackers upload executable files to any store', 'attacks on 79.5% of all stores', timeline '2026-03-19 First PolyShell attacks observed in the wild', '2026-07-14 Adobe backports the fix ... via APSB26-73'. Sansec 2026-03-30: 'The attack chain: 1. Attacker uploads a PHP webshell via the PolyShell vulnerability 2. Webshell drops accesson.php backdoors', 471 stores in one hour. Sansec 2026-10-24: 'In March the operator injected the loader into 471 stores in one hour, after uploading webshells through PolyShell (CVE-2026-48356)'. So an attack chain, victims in aggregate and a first-exploitation date (March 2026, four months before Adobe's fix) are published; exploitation does not rest on CISA alone; Adobe's 'not aware of any exploits' was already wrong in July. Fix: add Sansec as a corroborating source, rewrite summary, body, sourcing_note and verification."
