- code: F10
  category: missed-angle
  section: whole-run
  item: "CVE-2026-48356 / PolyShell: Sansec research (2026-03-17, 2026-03-30, 2026-10-24) missing from the Adobe entry"
  url_or_quote: "https://sansec.io/research/magento-polyshell ; https://sansec.io/research/polyshell-mass-attack-wave ; https://sansec.io/research/magento-cms-block-loader-deepveindrilling"
  summary: "The entry's sources are CISA and Adobe only, with verification single-source and credibility 2. The vulnerability has a named, public, mass-exploited history (PolyShell, attacks observed from 2026-03-19, 79.5% of Sansec-protected stores targeted, 82% hit by 2026-04-14, Adobe fix 2.4.9 on 2026-05-12 and the supported-line backport only on 2026-07-14) that explains the KEV listing and changes the defender's decision (stores that ran an unpatched build since March need a compromise assessment, not just the update). Search: 'Sansec PolyShell CVE-2026-48356 Magento'. Re-weigh verification, classification and priority after adding it."
- code: F8
  category: needs-more-research
  section: entries/2026-10-28/cve-2026-48356-adobe-commerce-magento-upload-flaw-cisa-kev
  item: "Exposure and Detection lines"
  url_or_quote: "Detection: \"As an inference from the flaw class, not from a reported attack, look for newly written script or other executable file types in web-reachable media and upload directories\""
  summary: "Sansec (2026-03-17) supplies the specifics the line lacks: exploitation through the anonymous REST guest-cart routes (POST/PUT /V1/guest-carts/:cartId/items), polyglot uploads written to pub/media/custom_options/quote/, 'Any .php, .phtml, or .phar file in pub/media/custom_options/ is a strong indicator of compromise', the accesson.php backdoor, CMS-block JavaScript loaders as post-exploitation, and the web-server configurations (stock nginx, non-stock fastcgi, Apache without php_flag engine 0) that turn an upload into code execution. Use them in Exposure and Detection, keeping the compromise check for stores that ran an older build."
