  - title: "UPDATE: TheGentlemen RaaS targets University of Finance and Administration (CZ) — European higher-education targeting continues; Swiss firm DEVO-Tech AG also claimed"
    sources:
      - { url: "https://www.dexpose.io/thegentlemen-target-university-of-finance-and-administration-in-czech-republic/", publisher: "DeXpose", date: "2026-05-19", role: "primary" }
      - { url: "https://www.dexpose.io/thegentlemen-ransomware-group-targets-swiss-engineering-firm-devo-tech-ag/", publisher: "DeXpose", date: "2026-05-18", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch 'Switzerland cyber attack public sector 2026 May 19 20' → found ransomware.live reference to DEVO-Tech (May 18) and TheGentlemen → pivot: WebSearch 'TheGentlemen ransomware University of Finance May 2026' → DeXpose article confirmed May 19"
    summary: |
      On 2026-05-19, the TheGentlemen RaaS group claimed an attack against the University of Finance and Administration (VSFS, vsfs.cz) in the Czech Republic, threatening to leak sensitive academic and administrative data unless ransom demands are met. The same group claimed DEVO-Tech AG (devo-tech.ch, Swiss engineering, Ziefen/BL) on 2026-05-18. TheGentlemen was previously documented in depth (2026-05-14 brief, backend database leak analysis by Check Point Research). The VSFS claim is noteworthy as a direct hit on a European higher-education institution, following the group's established pattern of targeting mid-size European organisations with insufficient backup hygiene.

      This is an UPDATE on the TheGentlemen campaign (previously covered: item:TheGentlemen 2026-05-14). No material new technical details beyond the new EU public-sector victim claim. TTPs remain unchanged: Go-based locker for Windows/Linux/NAS/BSD, double-extortion model, approximately 332 published victims in the first five months of 2026. Higher-education and public-sector defenders in the EU/CH region should confirm offline backup status and audit SD-WAN / VPN gateway patch levels (TheGentlemen's known initial access vectors) and Erlang SSH exposure (CVE-2025-32433, used in at least one prior TheGentlemen case).
    ch_eu_nexus: "Direct — Czech EU higher-education victim claimed; Swiss private-sector victim (DEVO-Tech AG) also claimed same week"
