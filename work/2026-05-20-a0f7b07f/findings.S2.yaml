  - title: "Drupal core highly critical pre-auth vulnerability — patch window opens May 20 19:00–23:00 CEST; exploits expected within hours of disclosure"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12584", publisher: "NCSC.ch Security Hub", date: "2026-05-19", role: "primary" }
      - { url: "https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/", publisher: "SecurityWeek", date: "2026-05-19", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/05/drupal-to-release-urgent-core-security.html", publisher: "The Hacker News", date: "2026-05-19", role: "corroborating" }
      - { url: "https://www.theregister.com/security/2026/05/19/drupal-warns-admins-to-brace-for-highly-critical-core-patch/5242728", publisher: "The Register", date: "2026-05-19", role: "corroborating" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1579", publisher: "BSI WID (WID-SEC-2026-1579)", date: "2026-05-19", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-csh recent 10, URL https://security-hub.ncsc.admin.ch/#/posts/12584 → primary: NCSC.ch post references https://www.drupal.org/psa-2026-05-18 (Cloudflare-blocked) → corroborating: SecurityWeek, The Hacker News, The Register, BSI WID-SEC-2026-1579 all fetched"
    summary: |
      The Drupal Security Team issued PSA-2026-05-18 on 2026-05-18, pre-announcing a highly critical security release for all supported Drupal core branches scheduled for May 20, 2026 between 17:00–21:00 UTC (19:00–23:00 CEST). CVE identifiers have not been disclosed ahead of the patch release (full embargo until publication). The pre-advisory scores the flaw at 20/25 on Drupal's own security scale — "highly critical" — with Access Complexity "None" and no authentication requirement, meaning exploitation is unauthenticated. The vulnerability is restricted to specific site configurations (Target Distribution: "Uncommon"), reducing the chained score below the theoretical maximum 25. The Drupal Security Team explicitly warns that "exploits might be developed within hours or days" of release.

      Affected versions: 10.5.x, 10.6.x, 11.2.x, 11.3.x receive official patches; EOL branches 11.1.x (→ 11.1.9 minimum), 10.4.x (→ 10.4.9 minimum) also receive patches. Legacy Drupal 8.9 and 9.5 receive best-effort patch files only. Drupal is among the most widely deployed CMS platforms in EU/CH public-sector web portals (government, university, municipality). Sites running Drupal and exposed to the internet must apply the patch immediately on 20 May. Until the patch is released, no technical mitigation is available. Detection: monitor web-server access logs at vulnerable Drupal path endpoints once the CVE is published; set up alerting on CMS version-identification queries in WAF logs.
    ch_eu_nexus: "Direct — Drupal dominates EU/CH public-sector web presence; Swiss federal, cantonal, and municipal portals as well as most EU national agency sites run Drupal"
