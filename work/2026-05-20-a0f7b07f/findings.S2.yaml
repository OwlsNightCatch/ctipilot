  - title: "Sparx Enterprise Architect / Pro Cloud Server — five CVEs (CVE-2026-42096 to CVE-2026-42100), unauthenticated SQL injection + RCE chain, CERT-PL + ENISA EUVD, PoC public"
    sources:
      - { url: "https://cert.pl/en/posts/2026/05/CVE-2026-42096/", publisher: "CERT Polska (CERT-PL)", date: "2026-05-19", role: "primary" }
      - { url: "https://sploit.tech/2026/05/19/Sparx-Enterprise-Architect-PCS.html", publisher: "sploit.tech (researcher Blazej Adamczyk / br0x)", date: "2026-05-19", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30931", publisher: "ENISA EUVD (EUVD-2026-30929 to EUVD-2026-30932)", date: "2026-05-19", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd recent lastvulnerabilities, items EUVD-2026-30929 to EUVD-2026-30932 all published 2026-05-19 → pivot: CERT-PL advisory https://cert.pl/en/posts/2026/05/CVE-2026-42096/ → researcher write-up https://sploit.tech/2026/05/19/Sparx-Enterprise-Architect-PCS.html with PoC"
    summary: |
      CERT Polska disclosed five vulnerabilities in Sparx Systems products on 2026-05-19, all assigned via CERT-PL. The highest-severity chain reaches CVSSv4 10.0 Critical when Pro Cloud Server (PCS) is deployed with its optional WebEA component.

      CVE-2026-42097 (CWE-639, CVSS 4.0: 9.3 Critical) — Authentication bypass in PCS via model-parameter omission in POST binary blob. The URL query parameter `model` may be omitted; the model name sent only in the binary blob bypasses the authentication gate, enabling unauthenticated arbitrary SQL query execution (both read and write) against any configured database. Affects PCS <= 6.1.

      CVE-2026-42096 (CWE-863, CVSS 4.0: ~8–9) — Broken access control: authenticated SQL injection. Any authenticated user can inject arbitrary SQL via an exposed database API endpoint. Affects PCS <= 6.1.

      CVE-2026-42099 (CWE-362, CVSS 4.0: 7.7) — Race condition in `/data_api/dl_internal_artifact.php`. Attacker with repository access controls both filename and contents of a file saved to `__DIR__`; a slow-client timing attack keeps the PHP file alive during transmission, enabling a second request to execute it, yielding RCE in the web-server context. Requires WebEA to be installed. Affects PCS <= 6.1.

      CVE-2026-42098 (CWE-603, CVSS 4.0: 8.7) — Client-side authentication in Enterprise Architect 17.1 and below. The RBAC enforcement is client-side; any authenticated user can modify the EA client binary to log in as any other user including administrators, then perform arbitrary repository modifications.

      CVE-2026-42100 (CWE-835, DoS) — Malformed SQL query triggers Pro Cloud Server service crash.

      The vendor (Sparx Systems) was notified in advance but did not respond with version details or a remediation timeline. No official patch has been released; tested vulnerable versions are PCS <= 6.1 (build 167) and EA <= 17.1. Public exploit code is available at https://github.com/br0xpl/sparx_hack/. Sparx Enterprise Architect is extensively deployed in EU/CH government enterprise-architecture practices (it is one of the dominant tools for national/cantonal IT architecture modelling). PCS is the cloud-serving component that exposes EA repositories to remote teams.

      Detection: monitor IIS/Apache access logs for requests to `/data_api/dl_internal_artifact.php` with unusual `guid` parameters; watch for `_api/data` requests that omit the `model` query parameter; inspect for `.php` file creation inside the PCS WebEA web root. Hardening: restrict PCS/WebEA to internal-network access only; disable WebEA if not required; rotate all database credentials accessible from the PCS service account.
    ch_eu_nexus: "Direct — Sparx EA and PCS are widely used in EU and Swiss public-sector enterprise architecture units"
    public_sector_nexus: "direct"
    sector: "public-sector, government, education"
    cves: [CVE-2026-42096, CVE-2026-42097, CVE-2026-42098, CVE-2026-42099, CVE-2026-42100]
