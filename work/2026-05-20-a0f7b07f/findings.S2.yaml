  - title: "vm2 Node.js sandbox — 12 critical CVEs (CVE-2026-24118 to CVE-2026-44009), host RCE from sandboxed code, PoC public, AI-agent escalation path; patch to 3.11.2"
    sources:
      - { url: "https://thehackernews.com/2026/05/vm2-nodejs-library-vulnerabilities.html", publisher: "The Hacker News", date: "2026-05-19", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1583", publisher: "BSI WID (WID-SEC-2026-1583)", date: "2026-05-19", role: "corroborating" }
      - { url: "https://www.kodemsecurity.com/resources/vm2-sandbox-escape-vulnerabilities-the-2026-cve-wave-turning-ai-agents-into-host-rce-vectors", publisher: "Kodem Security", date: "2026-05-19", role: "corroborating" }
    discovery_trace: "first seen at: bsi-rss, item WID-SEC-2026-1583 [NEU] [kritisch] vm2: Mehrere Schwachstellen published 2026-05-19 → pivot: WebSearch 'vm2 critical vulnerability CVE 2026 May RCE sandbox escape' → The Hacker News primary article, Kodem analysis on AI agent risk"
    summary: |
      On 2026-05-01, vm2's maintainers published 13 GitHub Security Advisories for critical sandbox-escape vulnerabilities in the vm2 Node.js library (NPM: `vm2`). The BSI flagged these as kritisch (critical) on 2026-05-19. vm2 is a widely-used library that allows Node.js applications to execute untrusted JavaScript in an isolated V8 context; it is embedded in code editors, CI/CD pipelines, serverless function runners, workflow automation platforms (n8n, similar tools), and AI agent frameworks.

      Highest-severity CVEs:
      - CVE-2026-43997 (CVSS 10.0) — Host Object access via code injection in the `BaseHandler.getPrototypeOf` trap; attacker obtains a reference to the real host `Object` prototype, escaping all sandbox restrictions. Affects <= 3.10.5; patched in 3.11.0.
      - CVE-2026-44005 (CVSS 10.0) — Prototype pollution via attacker-controlled JavaScript in versions 3.9.6–3.10.5; patched in 3.11.0.
      - CVE-2026-44006 (CVSS 10.0) — Code injection via `BaseHandler.getPrototypeOf`; patched in 3.11.0.
      - CVE-2026-43999 (CVSS 9.9) — NodeVM allowlist bypass: when `child_process` module is explicitly permitted, the `Module._load()` internal is reachable, letting sandboxed code load any builtin including `child_process` for OS command execution; patched in 3.11.0.
      - CVE-2026-44009 (CVSS 9.8) — `neutralizeArraySpeciesBatch()` function bypass via null-proto exception; affects <= 3.11.1, patched in 3.11.2.
      - CVE-2026-44008 (CVSS 9.8) — Null proto exception exploitation; affects <= 3.11.1, patched in 3.11.2.
      - CVE-2026-26956 (CVSS 9.8) — Symbol-to-string coercion TypeError in v3.10.4; patched in 3.10.5.

      Public proof-of-concept code for at least four CVEs is circulating on GitHub. Exploitation requires ability to pass untrusted JavaScript to a vm2 instance — i.e. any application that evaluates user-supplied or LLM-generated code in a vm2 sandbox. The AI-agent escalation path (Microsoft Security Research framing: "Prompts Become Shells") is: prompt injection into an AI agent → agent evaluates attacker-controlled JavaScript via vm2 → sandbox escape → host OS command execution and lateral movement. Public-sector deployments of automation platforms (e.g. n8n) or custom AI agent pipelines running Node.js with vm2 are in scope.

      Full patch: upgrade to vm2 3.11.2. No configuration workaround exists; treat any unpatched instance that has processed externally-supplied code as compromised and rotate all secrets accessible from the Node.js process.

      Detection: process-tree analysis for Node.js spawning unexpected child processes; EDR alert on `vm2`-linked `child_process.exec` / `spawn` calls; SBOM scan for vm2 < 3.11.2 in Node dependencies across CI/CD runners and automation platforms.
    ch_eu_nexus: "Global; directly relevant to CH/EU public-sector deployments of Node.js automation (n8n, custom pipelines) and AI-agent frameworks used in digitisation projects"
    public_sector_nexus: "indirect"
    sector: "public-sector, finance, telco, all"
