    summary: |
      Cisco Talos researcher Joey Chen published on 2026-05-19 the first detailed MaaS-ecosystem analysis of a BadIIS variant identifiable by embedded "demo.pdb" path strings. PDB analysis traces development to a single alias "lwxat" from at least September 2021 through January 2026, with rapid iterative updates and reactive evasion features targeting Norton AV specifically. Talos recovered a dedicated builder tool that allows threat actors to generate configuration files and inject parameters into BadIIS ISAPI DLL payloads — enabling traffic redirection to illicit sites, reverse proxying for search-engine crawler manipulation, content hijacking, and backlink injection for SEO fraud monetisation. The ISAPI DLL hooks into the Windows IIS pipeline by registering as an ISAPI filter or extension (loaded from the applicationHost.config or web.config), intercepting all HTTP requests to hosted websites and selectively modifying HTTP responses — either serving different content to web crawlers vs. human browsers, or proxying requests to attacker-controlled infrastructure. Campaign scope: over 1,800 Windows IIS servers compromised globally; focus on Thailand and Vietnam but infection confirmed in India, Pakistan, Japan. Link to the broader DragonRank SEO poisoning ecosystem previously documented by Talos. No CVE exploitation — BadIIS requires prior IIS server compromise (web shell, vulnerable CMS) to plant the DLL. Detection: check applicationHost.config and each site's web.config for unexpected IsapiFilters entries; IIS logs for response-body size anomalies on content that should be static; monitor IIS worker-process (w3wp.exe) for unexpected outbound HTTP connections; Event ID 4688 / Sysmon EID 1 for DLL loads into w3wp.exe from non-standard paths.
