        source_url: "https://cybersecuritynews.com/nx-console-vs-code-extension-compromised/"
      - quote: "The malicious version was only live for roughly 11 minutes before the Nx team detected and removed it. Any developer who had version 18.95.0 installed and opened a workspace between 12:36 and 12:47 UTC on May 18 should treat all credentials on that machine as compromised."
