  - title: "SEPPmail Secure E-Mail Gateway: pre-auth RCE (CVE-2026-2743, CVSS 10.0) and unauthenticated RCE (CVE-2026-44128, CVSS 9.3) — DACH-region appliances exposed"
    sources:
      - url: "https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/"
