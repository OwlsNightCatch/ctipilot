  - title: "actions-cool/issues-helper GitHub Action compromised: all 53 version tags redirected to imposter commit that reads Runner.Worker /proc/PID/mem to harvest CI/CD secrets; linked to Mini Shai-Hulud cluster"
    sources:
      - url: "https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"
