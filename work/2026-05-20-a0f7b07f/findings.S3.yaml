  - title: "Nx Console 18.95.0 (VS Code extension, 2.2M installs) compromised via stolen publisher credentials — 11-minute window; multi-stage stealer harvests GitHub, npm, AWS, HashiCorp, K8s, 1Password secrets with DNS-tunnel exfiltration and macOS backdoor"
    sources:
      - url: "https://cybersecuritynews.com/nx-console-vs-code-extension-compromised/"
        publisher: "CybersecurityNews"
        date: "2026-05-19"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/compromised-nx-console-18950-targeted.html"
        publisher: "The Hacker News"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (bridge), item 2026-05-19 → WebSearch ('Nx Console 18.95.0 compromised supply chain VS Code') → primary: CybersecurityNews https://cybersecuritynews.com/nx-console-vs-code-extension-compromised/ → corroborating: THN https://thehackernews.com/2026/05/compromised-nx-console-18950-targeted.html"
    summary: |
      On 2026-05-18, version 18.95.0 of the Nx Console VS Code extension (nrwl.angular-console, 2.2+ million installs) was pushed to the Visual Studio Marketplace using stolen publisher credentials belonging to a compromised developer. The malicious version activated on any workspace open, fetching a 498 KB obfuscated payload from a dangling orphan commit on the official nrwl/nx GitHub repository; the injected code was 2,777 bytes inserted into the minified main.js. The payload is a multi-stage credential stealer and supply-chain poisoner: it harvests tokens from GitHub, npm, AWS, HashiCorp Vault, Kubernetes kubeconfigs, and 1Password, exfiltrating via three independent channels (HTTPS, GitHub API, DNS tunneling). On macOS it additionally installs a persistent Python backdoor using the GitHub Search API as a dead-drop for commands signed with a 4096-bit RSA key. The malicious version was live for approximately 11 minutes (12:36–12:47 UTC) before Nx team detection and removal; safe version is 18.100.0 or later. Any developer who opened a workspace during that window should rotate all credentials on that machine. Detection: VS Code extension activity logs for unexpected network calls during workspace initialization; EDR parent-process chain node.js → python spawning curl/dns; check macOS launch agents for Python persistence items; audit AWS CloudTrail / GitHub audit log for unexpected API calls from developer IPs in that 11-minute window on 2026-05-18.
    ch_eu_nexus: "global; affects European developer organisations using Nx Console for Angular/React monorepo development"
    public_sector_nexus: "indirect — developer tooling"
    sector: "software supply chain, developer tools, technology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
