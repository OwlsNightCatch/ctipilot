    discovery_trace: "first seen at: THN feed (bridge), item 2026-05-19 → pivot: WebSearch ('actions-cool issues-helper GitHub Action compromised tag redirect May 2026') → primary: StepSecurity, URL https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials (SPA, verified by metadata) → corroborating: CybersecurityNews, THN"
    summary: |
      StepSecurity disclosed on 2026-05-18 that all 53 existing version tags of the popular actions-cool/issues-helper GitHub Action were moved to point to an imposter commit (identified as 1c9e803) not present in the normal branch history, along with 15 tags on the companion actions-cool/maintain-one-comment action. The malicious payload downloads the Bun JavaScript runtime to the runner environment, then spawns a Python process that reads the /proc/<PID>/mem address space of the Runner.Worker process — the GitHub Actions component that holds decrypted workflow secrets during job execution. The data is filtered using tr and grep to extract values marked isSecret: true, then exfiltrated via HTTPS to t.m-kosche[.]com. Socket confirmed the exfiltration domain overlaps with the Mini Shai-Hulud npm/PyPI supply-chain campaign, assessed as the same activity cluster. All 53 imposter commits were created within a 3-minute 16-second window. GitHub disabled the repository for terms-of-service violation. The attack window was active from 2026-05-18 UTC; teams that ran any workflow referencing actions-cool/issues-helper@v* or a mutable tag in that period should treat all CI/CD secrets (GitHub PATs, npm tokens, AWS credentials, SSH keys) as compromised and rotate immediately. Hardening: pin all Actions references to full commit SHA (e.g., uses: actions-cool/issues-helper@<sha>), not mutable tags or branch names; deploy StepSecurity Harden-Runner or equivalent to detect in-flight secret reads from non-approved process parents; restrict workflow GITHUB_TOKEN permissions to minimum.
    ch_eu_nexus: "global CI/CD supply chain; affects any organisation using actions-cool/issues-helper in GitHub workflows — common in open-source and developer-tooling contexts including European public-sector repos"
