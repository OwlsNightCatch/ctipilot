        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('SEPPmail secure email gateway RCE vulnerability May 2026') → primary: InfoGuard Labs, URL https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/ → corroborating: THN https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html"
    summary: |
      InfoGuard Labs (Baar, Switzerland) published on 2026-05-18 a full technical disclosure of seven vulnerabilities in SEPPmail Secure E-Mail Gateway, a virtual appliance widely deployed in DACH-region enterprises for S/MIME and PGP email encryption. SEPPmail instances are common in Swiss public administration, healthcare, and financial services. The most critical flaw, CVE-2026-2743 (CVSS 10.0), is a pre-authenticated path traversal in the Large File Transfer (LFT) back-end's /v1/file.app endpoint: the handle_request function passes a JSON-supplied filename through WebMailMessage::store_attachments without sanitisation, allowing ../ sequences to write arbitrary files as the nobody user. The nobody account has unusual write access to /etc/syslog.conf; by overwriting that file with a piped Perl reverse-shell one-liner, and triggering a newsyslog rotation (which runs every 15 minutes via cron and sends SIGHUP to syslogd), an unauthenticated attacker achieves remote code execution and full appliance compromise. This vulnerability affects only instances with the Large File Transfer license; Censys scanning indicates the majority of customers have LFT enabled (exposure detectable by HTTP status on /v1/file.app — 404 = not affected). CVE-2026-44128 (CVSS 9.3) is a second unauthenticated RCE in the GINA V2 web interface: the /api.app/template endpoint passes a user-controlled upldd parameter directly to Perl's eval() without sanitisation. Additional flaws: CVE-2026-44127 (LFI reading stored emails, LDAP databases, and cryptographic keys), CVE-2026-44129 (server-side template injection, CVSS 8.3), CVE-2026-44126 (insecure deserialization, fixed 15.0.3), CVE-2026-44125 (missing authorization in GINAv2), CVE-2026-7864 (CVSS 6.9, server environment variable exposure through unauthenticated endpoint). All vulnerabilities are patched in SEPPmail 15.0.4 (CVE-2026-44128 in 15.0.2.1, CVE-2026-44126 in 15.0.3, remainder in 15.0.4). Detection: web-server access logs for POST to /v1/file.app with ../ sequences in JSON body; unusual Perl process trees spawned by syslogd; unexplained connections from the appliance's IP outbound on high ports. Hardening: update to 15.0.4 immediately; disable GINA V2 if not in use; restrict /v1/file.app to known IP ranges at perimeter if LFT is not required.
    ch_eu_nexus: "direct — SEPPmail is a Swiss product with primary deployment in DACH (CH, DE, AT); InfoGuard Labs is a Swiss security firm"
    public_sector_nexus: "direct — Swiss federal agencies, cantonal governments, and healthcare institutions are common SEPPmail customers"
    sector: "government, healthcare, finance, legal, education (DACH primary)"
