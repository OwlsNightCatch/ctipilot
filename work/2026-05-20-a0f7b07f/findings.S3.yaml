        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('CVE-2026-31635 Linux kernel DirtyDecrypt LPE PoC May 2026') → primary technical: Moselwal, URL https://moselwal.com/blog/dirtydecrypt-linux-kernel-rxgk-cve-2026-31635 → corroborating: BleepingComputer + THN"
    summary: |
      CVE-2026-31635 (CVSS 7.5, CWE-122 heap-based buffer overflow / missing COW guard) is a local privilege escalation in the Linux kernel's RxGK (Kerberos-for-AFS) subsystem, dubbed DirtyDecrypt by its researchers. The vulnerability is a page-cache write due to a missing copy-on-write (COW) guard in the rxgk_decrypt_skb() function in net/rxrpc/rxgk_crypt.c. The Zellic/V12 research team disclosed it on 2026-05-09; kernel maintainers noted it was a duplicate of a vulnerability patched on 2026-04-25 in the mainline. A working PoC was published by V12 on 2026-05-19 triggering immediate attention. Affected systems: only distributions compiled with CONFIG_RXGK=y — Fedora, Arch Linux, and openSUSE Tumbleweed in their standard configurations; Debian Stable, RHEL, and Ubuntu LTS build kernels without CONFIG_RXGK and are not affected. Kubernetes workers on these rolling-release distros are at risk. DirtyDecrypt is assessed as a variant of the Copy Fail family (CVE-2026-31431, CVE-2026-43284, CVE-2026-43500, CVE-2026-46300). No in-the-wild exploitation reported yet. Mitigation: apply kernel patch from 2026-04-25 (linux-stable >=6.x.y); or blacklist the rxrpc module via /etc/modprobe.d/rxgk-blacklist.conf (breaks IPsec/AFS VPN, fragile). Verify kernel build with grep RXGK /boot/config-$(uname -r). Detection: Falco/Tetragon alert on unexpected rxrpc module load; UID-change events (Sysmon-for-Linux EID 8) from unprivileged processes; unusual root process spawned from container context.
    ch_eu_nexus: "global; affects Linux systems running rolling-release distros, relevant to CH/EU public-sector Linux desktop and container environments on Fedora/Arch/Tumbleweed"
    public_sector_nexus: "indirect"
    sector: "cross-sector, CI/CD, developer workstations, Linux infrastructure"
