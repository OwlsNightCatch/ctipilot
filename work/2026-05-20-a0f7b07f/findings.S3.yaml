  - title: "DirtyDecrypt (CVE-2026-31635, CVSS 7.5) — Linux kernel LPE via rxgk_decrypt_skb page-cache write, PoC published; Fedora, Arch, openSUSE Tumbleweed affected"
    sources:
      - url: "https://moselwal.com/blog/dirtydecrypt-linux-kernel-rxgk-cve-2026-31635"
        publisher: "Moselwal (technical analysis)"
