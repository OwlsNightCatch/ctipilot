  - title: "TeamPCP supply-chain campaign: Checkmarx Jenkins AST plugin officially confirmed compromised (third breach in three months); Mini Shai-Hulud wave signs malicious @tanstack/react-router packages with SLSA Build Level 3 provenance — provenance no longer guarantees safety"
    sources:
      - url: "https://isc.sans.edu/diary/rss/32994"
        publisher: "SANS Internet Storm Center (Kenneth Hartman)"
        date: "2026-05-18"
        role: "primary aggregation / updated summary"
      - url: "https://www.wiz.io/blog/mini-shai-hulud-strikes-again-tanstack-more-npm-packages-compromised"
        publisher: "Wiz"
        date: "2026-05-13"
        role: "corroborating (primary on SLSA detail)"
      - url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem"
        publisher: "StepSecurity"
        date: "2026-05-13"
        role: "corroborating"
    discovery_trace: "first seen at: SANS ISC RSS feed (bridge), item 2026-05-18 → primary: SANS ISC diary https://isc.sans.edu/diary/rss/32994 → referenced primaries: Wiz https://www.wiz.io/blog/mini-shai-hulud-strikes-again-tanstack-more-npm-packages-compromised; StepSecurity; Checkmarx https://checkmarx.com/blog/ongoing-security-updates/"
    summary: |
      SANS ISC published an aggregation diary on 2026-05-18 summarising two TeamPCP campaign developments. First, Checkmarx officially confirmed on 2026-05-11 that its Jenkins AST scanner plugin (version 2026.5.09) was trojanized — a claim first made by a single researcher on 2026-05-09. The exposure window was 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC; the malicious plugin was installed by several hundred Jenkins controllers. This is the third Checkmarx compromise in three months. Last known-good build: 2.0.13-829.vc72453fa_1c16; remediated builds: 2.0.13-848.v76e89de8a_053 or 2.0.13-847.v08c0072b_2fd5. Second, the Mini Shai-Hulud npm worm published malicious versions of 42 @tanstack npm packages (including @tanstack/react-router at ~12M weekly downloads) within six minutes on 2026-05-11, propagating to ~170 packages including Mistral AI, UiPath, OpenSearch, Guardrails AI across npm and PyPI (cumulative downloads >500M). Most critically, the malicious versions carried valid SLSA Build Level 3 provenance attestations — because the attacker compromised TanStack's release pipeline using its legitimate OIDC identity rather than stealing npm credentials. Wiz's 2026-05-13 update notes a 1-in-6 probabilistic disk-wipe payload on systems matching Israeli or Iranian locale; Expel confirmed persistence injection into .vscode/tasks.json and ~/.claude/settings.json on developer machines. CVE-2026-45321 (CVSS 9.6, GHSA-g7cv-rxg3-hmpx). Detection: Audit Jenkins for versions matching the compromised build; scan npm lockfiles for @tanstack packages published between 2026-05-11 19:20–19:26 UTC; inspect .vscode/tasks.json and ~/.claude/settings.json for unexpected entries. Note: SLSA Level 3 provenance is not a sufficient control against CI pipeline compromise — add lockfile pinning and hash verification against known-good baselines.
    ch_eu_nexus: "global supply-chain campaign; European developer organisations and CI/CD pipelines affected directly"
    public_sector_nexus: "indirect"
    sector: "software supply chain, developer tools"
    cves:
      - CVE-2026-45321
    actors_campaigns_malware:
      - "TeamPCP"
      - "Mini Shai-Hulud"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-16"
    evidence:
      - quote: "Two TeamPCP events broke within 48 hours of each other and doubled attention on the campaign. Checkmarx confirmed its Jenkins AST plugin was trojanized, its third compromise in three months"
        attribution: "SANS ISC (Kenneth Hartman)"
        source_url: "https://isc.sans.edu/diary/rss/32994"
      - quote: "this is the first documented npm supply chain attack shipping malware with valid SLSA Build Level 3 provenance attestations. Analysts assess this is novel and material: the attacker never stole maintainer npm credentials."
        attribution: "SANS ISC (Kenneth Hartman)"
        source_url: "https://isc.sans.edu/diary/rss/32994"

