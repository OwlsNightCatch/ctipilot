    discovery_trace: "first seen at: msft-secblog (bridge subcommand), feed item 2026-05-19 → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/ → corroborating: The Record, URL https://therecord.media/microsoft-disrupts-fox-tempest-malware-signing-service"
    summary: |
      Microsoft Threat Intelligence published a full exposure of Fox Tempest on 2026-05-19, concurrent with Microsoft's Digital Crimes Unit (DCU) unsealing a U.S. District Court legal action and disrupting the actor's infrastructure. Fox Tempest operated a malware-signing-as-a-service (MSaaS) under the brand "signspace[.]cloud" since at least May 2025, abusing Microsoft Artifact Signing (formerly Azure Trusted Signing) to generate short-lived (72-hour) code-signing certificates tied to stolen US and Canadian identities. Over 1,000 certificates were issued and hundreds of Azure tenants created. Customers uploaded malicious binaries — masquerading as AnyDesk, Teams, PuTTY, Webex — and received Microsoft-signed executables that bypassed AV/EDR signing checks. In February 2026 Fox Tempest transitioned to VM-based delivery: pre-configured VMs hosted on Cloudzy's US infrastructure accepted customer uploads and returned signed binaries. Fox Tempest customers include Vanilla Tempest (deploying Rhysida ransomware), Storm-0501, Storm-2561, and Storm-0249; the downstream malware families include Oyster, Lumma Stealer, Vidar, INC, Qilin, and Akira. Microsoft revoked all 1,000+ certificates and seized the signspace[.]cloud infrastructure. Defender detections (BehaviorWin32/Fox*) and updated Artifact Signing identity-validation controls have been deployed. Detection: hunt for Microsoft-signed PE binaries with certificate validity <= 72h issued after 2025-05-01 from issuers tied to "Trusted Signing" where the signing timestamp does not match the organizational EV entity; EDR parent-process tree where Teams.exe / AnyDesk.exe spawns cmd.exe / powershell.exe without the expected Microsoft installer ancestry. Hardening: enforce WDAC/AppLocker policy requiring certificates from organisational PKI roots; monitor Conditional-Access sign-in logs for Azure app registrations in newly created tenants with Artifact-Signing scope.
    ch_eu_nexus: "global, with confirmed UK, France impacts; European ransomware affiliates (INC, Qilin, Akira) used the service — EU public-sector targets plausible"
