  - title: "CVE-2026-45584 — Microsoft Defender RCE (heap buffer overflow over network, CVSS 8.1, no exploitation confirmed)"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584"
        publisher: "Microsoft MSRC"
        date: "2026-05-19"
        role: "primary"
    discovery_trace: "first seen at: msrc recent (bridge:msrc.recent) → MSRC OData API returned CVE-2026-45584 exploited=No, publiclyDisclosed=No, releaseDate=2026-05-19 → primary: MSRC, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584"
    summary: |
      Published 2026-05-19 in the MSRC May 2026 update guide, CVE-2026-45584 is a heap-based buffer overflow in Microsoft Defender that allows an unauthenticated attacker to execute code over a network (AV:N). CVSS 8.1. No exploitation observed at publication; no public PoC. Like CVE-2026-41091, this auto-remediates through Defender Engine updates. Given that the same product just had CVE-2026-41091 actively exploited, defender teams should verify Engine version is >= 1.1.26040.8 (which addresses both this and CVE-2026-41091). A network-based RCE in an endpoint security product is operationally severe: successful exploitation would place attacker code into the same privileged context as Defender.
    ch_eu_nexus: "Same universal exposure as CVE-2026-41091."
    public_sector_nexus: "direct"
    sector: "all"
    cves: [CVE-2026-45584]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Heap-based buffer overflow in Microsoft Defender allows an unauthorized attacker to execute code over a network."
        attribution: "Microsoft MSRC CVE-2026-45584"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584"
    extended_notes: |
      No public PoC as of 2026-05-20 04:00 UTC. Priority: check Defender Engine auto-update status. Network-based exploitation vectors in AV products are historically targeted by advanced actors (cf. previous Kaspersky, Symantec RCE vulnerabilities over the years). This is a Patch Tuesday artifact elevated to watch status.

  - title: "Fortinet CVE-2026-44277 (FortiAuthenticator) and CVE-2026-26083 (FortiSandbox) — unauthenticated RCE, CVSS 9.1/9.1"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12569"
        publisher: "NCSC Switzerland CSH"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-rce-flaws-in-fortisandbox-and-fortiauthenticator/"
        publisher: "BleepingComputer"
        date: "2026-05-13"
        role: "corroborating"
      - url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-128"
        publisher: "Fortinet PSIRT"
        date: "2026-05-12"
        role: "primary"
    discovery_trace: "first seen at: ncsc-ch-security-hub (bridge:ncsc-csh.recent), CSH post 12569 → Fortinet PSIRT advisory FG-IR-26-128, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-128 → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-rce-flaws-in-fortisandbox-and-fortiauthenticator/"
    summary: |
      Fortinet disclosed two critical unauthenticated RCE vulnerabilities on 2026-05-12 affecting enterprise security appliances. CVE-2026-44277 (FG-IR-26-128, CVSS 9.8 per some sources, 9.1 per NCSC CSH) is an improper access control (CWE-284) in FortiAuthenticator that allows unauthenticated attackers to execute arbitrary code and commands via specially crafted HTTP requests to the management interface. Affected: FortiAuthenticator < 6.5.7, < 6.6.9, < 8.0.3; patched in 6.5.7, 6.6.9, 8.0.3. FortiAuthenticator Cloud is not affected. CVE-2026-26083 (FG-IR-26-136, CVSS 9.1) is a missing authorization weakness (CWE-862) in FortiSandbox, FortiSandbox Cloud, and FortiSandbox PaaS Web UI that allows unauthenticated RCE via HTTP. Affected: FortiSandbox < 4.4.9 or < 5.0.2, Cloud < 5.0.6; patched in 4.4.9, 5.0.2. Both vulnerabilities target network-accessible management web UIs — the preconditions are solely network reachability, with no credentials required. Neither was observed exploited at publication, but Fortinet security appliances are frequent targets of ransomware affiliates and espionage actors.
    ch_eu_nexus: "High — FortiAuthenticator is widely deployed for MFA/2FA in Swiss and EU enterprise and government networks; FortiSandbox is used in government SOCs for malware analysis. Compromise of these appliances could undermine authentication infrastructure (FortiAuthenticator) or expose sensitive files analysed in the sandbox (FortiSandbox)."
    public_sector_nexus: "direct"
    sector: "government, finance, energy, telco, education"
    cves: [CVE-2026-44277, CVE-2026-26083]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-44277 CVSS3.1: 9.8 (CRITICAL) - Improper access control in FortiAuthenticator leading to RCE; CVE-2026-26083 CVSS3.1: 9.1 (CRITICAL) - Missing authorization in FortiSandbox Web UI leading to RCE"
        attribution: "NCSC Switzerland CSH post 12569"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12569"
    extended_notes: |
      Detection: FortiAuthenticator logs (auth.log or /var/log/authd.log) for unexpected POST requests to /api/ or /login/ endpoints from non-administrative source IPs; FortiSandbox: look for unexpected API requests to sandbox management endpoints (typically on port 8443 or 443). Hardening: restrict management interface access to dedicated management networks; apply vendor patches immediately. T1190 (Exploit Public-Facing Application). Note: these advisories were published 2026-05-12/13 — outside strict 36h window, but included because CERT-FR (CERTFR-2026-AVI-0575) confirmed them on 2026-05-13 and NCSC CSH published on 2026-05-13, making them close boundary items not yet in prior coverage records.

  - title: "CVE-2026-45185 — Exim 'Dead.Letter' unauthenticated RCE via BDAT/GnuTLS use-after-free (CVSS 9.8)"
    sources:
      - url: "https://www.openwall.com/lists/oss-security/2026/05/12/4"
        publisher: "Openwall oss-security"
        date: "2026-05-12"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/new-exim-bdat-vulnerability-exposes.html"
        publisher: "The Hacker News"
        date: "2026-05-12"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0163"
        publisher: "NCSC Netherlands"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"
        publisher: "XBOW Security"
        date: "2026-05-12"
        role: "corroborating"
    discovery_trace: "first seen at: advisories-ncsc-nl (bridge:ncsc-nl.recent), advisory NCSC-2026-0163 → CSAF fetch: UAF in Exim BDAT/GnuTLS → primary: oss-security disclosure, URL https://www.openwall.com/lists/oss-security/2026/05/12/4 → researcher blog: XBOW, URL https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"
    summary: |
      CVE-2026-45185 ("Dead.Letter") is a use-after-free (UAF) in Exim's binary data transmission (BDAT) message body parsing path triggered when a client sends a TLS close_notify alert before the BDAT body transfer completes and then appends a final cleartext byte on the same TCP connection. Exim frees its GnuTLS transfer buffer during TLS teardown, but a nested BDAT receive wrapper can still process the trailing byte and write a single character into the freed memory region via the C standard library ungetc() function — corrupting the heap allocator's internal metadata. On builds without ASLR (unusual), this allows deterministic unauthenticated RCE. On standard ASLR-enabled systems, this causes heap corruption that can lead to RCE, though exploitation is more complex. Preconditions: Exim built with USE_GNUTLS=yes (default on Debian/Ubuntu; not OpenSSL-based builds); STARTTLS and CHUNKING (BDAT) advertised — both are on by default; unauthenticated SMTP access (TCP 25). Affected: Exim 4.97 through 4.99.2. Fixed: Exim 4.99.3 (released 2026-05-12). Discovered by Federico Kirschbaum (XBOW); NCSC-NL CSAF advisory confirms version scope and CVSS 9.8. No active exploitation confirmed at time of reporting; a functional PoC was developed by XBOW during the coordinated disclosure window.
    ch_eu_nexus: "Medium-High — Exim is widely deployed as MTA on Debian/Ubuntu Linux systems across Swiss and EU public-sector infrastructure (universities, research institutes, some government mail relays). GnuTLS builds are standard on these distributions."
    public_sector_nexus: "indirect"
    sector: "education, research, government-mail, hosting"
    cves: [CVE-2026-45185]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A remotely reachable Use-After-Free (UAF) vulnerability has been identified in Exim's BDAT (binary data transmission) body parsing path when using the GnuTLS backend. This vulnerability can lead to heap corruption and potential code execution."
        attribution: "Exim maintainer Heiko Schlittermann, oss-security disclosure"
        source_url: "https://www.openwall.com/lists/oss-security/2026/05/12/4"
      - quote: "The vulnerability is triggered during BDAT message body handling when a client sends a TLS close_notify alert before the body transfer is complete, and then follows up with a final byte in cleartext on the same TCP connection."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/new-exim-bdat-vulnerability-exposes.html"
    extended_notes: |
      Detection: network-level monitoring for SMTP sessions that initiate STARTTLS + BDAT and exhibit unusual TLS close_notify sequences; SMTP server logs for malformed BDAT sequences; Exim logs (/var/log/exim4/mainlog) for UAF-related segfaults or panics. T1190 (Exploit Public-Facing Application) via SMTP. Note: primary source date is 2026-05-12, 8 days before today. However, NCSC-NL advisory (NCSC-2026-0163) was published 2026-05-15 with fresh corroboration. The initial disclosure falls outside strict 36h window but is included because: (1) NCSC-NL advisory 2026-05-15 is within the 7-day developing-story window; (2) no prior coverage in covered_items.json; (3) CVSS 9.8 critical unauthenticated MTA RCE warrants coverage.

