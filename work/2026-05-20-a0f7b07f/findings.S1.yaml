items:
  - title: "Drupal core 'highly critical' (score 20/25) unpatched vulnerability — patch window opens today 2026-05-20 17:00 UTC"
    sources:
      - url: "https://www.drupal.org/psa-2026-05-18"
        publisher: "Drupal.org Security Team"
        date: "2026-05-18"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
        publisher: "NCSC Switzerland CSH"
        date: "2026-05-19"
        role: "primary"
      - url: "https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/"
        publisher: "SecurityWeek"
        date: "2026-05-19"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/drupal-to-release-urgent-core-security.html"
        publisher: "The Hacker News"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12584 → primary: Drupal.org PSA, URL https://www.drupal.org/psa-2026-05-18 → corroborating: SecurityWeek, URL https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/"
    summary: |
      Drupal's Security Team issued a pre-release advisory (PSA-2026-05-18) on 2026-05-18 warning of a highly critical vulnerability in Drupal Core affecting all currently supported branches (11.3.x, 11.2.x, 10.6.x, 10.5.x) and several end-of-life branches. The official Drupal severity scoring assigns this a 20/25 — the highest tier below maximum — driven by zero authentication requirement, zero complexity, and attacker capability to access all non-public data and modify or delete arbitrary content. The vulnerability type and CVE remain embargoed until the patch window (17:00–21:00 UTC on 2026-05-20), though all signs point to a remote code execution or critical access-control failure, not merely an XSS. NCSC Switzerland's CSH advisory (post 12584, published 2026-05-19 09:25 UTC) reinforces the urgency: the Drupal Security Team explicitly warns exploits may be developed within hours or days of disclosure. Not all configurations are affected; the advisory instructs administrators to immediately evaluate their specific version's exposure during the release window. Drupal 7 is not affected. Swiss and EU governments running Drupal-based portals, transparency platforms, and citizen-facing services face material exposure given that public-sector adoption of Drupal is high in the region.
    ch_eu_nexus: "Direct — Drupal is widely deployed across Swiss and EU public-sector web infrastructure (federal, cantonal, municipal portals). High attack surface in government and education sectors."
    public_sector_nexus: "direct"
    sector: "government, education, public-sector-web"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Drupal Security Team urges you to reserve time for core updates at that time because exploits might be developed within hours or days."
        attribution: "Drupal.org PSA-2026-05-18"
        source_url: "https://www.drupal.org/psa-2026-05-18"
      - quote: "Successful exploitation could allow unauthenticated attackers to fully compromise affected Drupal installations."
        attribution: "NCSC Switzerland CSH post 12584"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
    extended_notes: |
      Detection and hardening angles once the advisory publishes: monitor WAF logs for abnormal Drupal admin/node/REST API requests; ensure Drupal Update Manager or external patch management triggers an emergency update cycle; disable public-facing REST API / JSON:API endpoints if not required as a temporary risk reduction; audit which Drupal instances are internet-facing vs internal.

  - title: "CVE-2026-41091 — Microsoft Defender EoP exploited in the wild (Malware Protection Engine <= 1.1.26030.3008, link following, SYSTEM privileges)"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091"
        publisher: "Microsoft MSRC"
        date: "2026-05-19"
        role: "primary"
    discovery_trace: "first seen at: msrc recent (bridge:msrc.recent) → MSRC OData API returned CVE-2026-41091 with exploited=Yes, publiclyDisclosed=Yes, releaseDate=2026-05-19 → primary: MSRC update guide SPA, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091"
    summary: |
      Microsoft added CVE-2026-41091 to the May 2026 update guide on 2026-05-19 with exploitation confirmed and publicly disclosed status. The flaw is an improper link resolution before file access (CWE-59, "link following") in Microsoft Defender that allows a low-privileged local attacker to gain SYSTEM privileges. CVSS 7.8 (AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H). The affected component is the Microsoft Malware Protection Engine: all builds at or below version 1.1.26030.3008 are vulnerable; Engine version 1.1.26040.8 contains the fix. Critically, this vulnerability is auto-remediated — the Malware Protection Engine updates automatically through Windows Update and Microsoft Defender's signature update channel when allowed by policy. Environments where automatic updates are blocked (air-gapped, highly controlled patch schedules, or explicitly disabled auto-updates) remain vulnerable until manually patched. The exploitation path (local, low privilege) makes it attractive as a second-stage LPE gadget following initial access via phishing or web exploitation. A SYSTEM shell grants an attacker full administrative control over the endpoint including credential extraction from LSASS, persistence via service creation, and lateral movement.
    ch_eu_nexus: "Universal — Microsoft Defender is the default endpoint protection across Windows installations worldwide; Swiss and EU public-sector endpoints running Windows with Defender-only AV are directly exposed if automatic updates are blocked."
    public_sector_nexus: "direct"
    sector: "all"
    cves: [CVE-2026-41091]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Improper link resolution before file access ('link following') in Microsoft Defender allows an authorized attacker to elevate privileges locally."
        attribution: "Microsoft MSRC CVE-2026-41091"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091"
      - quote: "An attacker who successfully exploited this vulnerability could gain SYSTEM privileges."
        attribution: "Microsoft MSRC CVE-2026-41091 FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091"
    extended_notes: |
      Detection: look for Defender process tree anomalies (Malware Protection Engine version queries via WMI — Get-MpComputerStatus), sudden SYSTEM-level process spawns from MsMpEng.exe or associated Defender helpers. Hardening: confirm Engine auto-update is not disabled via GPO (Computer Configuration → Administrative Templates → Windows Components → Microsoft Defender Antivirus → "Turn off routine remediation"); verify WU connectivity on Defender-dependent systems; push Engine updates manually if needed. The link-following class (CWE-59) typically involves hard link or junction abuse during privileged file operations; hunting for junction/hard-link creation events (Sysmon EID 11 with TargetFilename pointing to privileged directories) at the time of Defender scans may surface exploitation artefacts.

  - title: "UPDATE: CVE-2026-45585 (YellowKey) — Microsoft assigns CVE and publishes mitigation for BitLocker WinRE bypass; no patch yet"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45585"
        publisher: "Microsoft MSRC"
        date: "2026-05-19"
        role: "primary"
    discovery_trace: "first seen at: msrc recent (bridge:msrc.recent) → MSRC OData API returned CVE-2026-45585 publiclyDisclosed=Yes, releaseDate=2026-05-19 → primary: MSRC update guide SPA, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45585 (cross-reference with prior coverage: item:windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days, 2026-05-15)"
    summary: |
      On 2026-05-19, Microsoft formally assigned CVE-2026-45585 to the 'YellowKey' BitLocker bypass zero-day disclosed by 'Nightmare Eclipse' on 2026-05-12 and first covered in this brief on 2026-05-15. Microsoft confirms this is a CWE-77 (command injection in Windows BitLocker / WinRE), CVSS 6.8 (AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), requiring physical access. No security update is available yet; Microsoft has published interim mitigation guidance: administrators must mount each device's WinRE image, remove the autofstx.exe entry from the BootExecute registry value inside WinRE, commit the image, and then re-establish BitLocker trust for WinRE. This requires per-device work on every endpoint with TPM-only BitLocker (without a PIN/password protector). The MSRC advisory classifies the exploit evidence as 'Proof-of-Concept' (E:P in the CVSS temporal vector, RL:W — workaround). This is a fresh in-window delta because: (1) a CVE was formally assigned (prior coverage had no CVE), (2) Microsoft published official mitigation, and (3) the MSRC entry confirms scope of affected systems and the specific WinRE attack path.
    ch_eu_nexus: "High — Swiss federal administration and cantonal governments use BitLocker for device encryption on Windows endpoints; physical-access requirement fits insider-threat and device-theft attack vectors. Swiss Military and classified environments are particularly relevant."
    public_sector_nexus: "direct"
    sector: "government, defense, all-sector-endpoints"
    cves: [CVE-2026-45585]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: update-to-prior:2026-05-15
    evidence:
      - quote: "Microsoft is aware of a security feature bypass vulnerability in Windows publicly referred to as 'YellowKey'. The proof of concept for this vulnerability has been made public violating coordinated vulnerability best practices."
        attribution: "Microsoft MSRC CVE-2026-45585"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45585"
      - quote: "A successful attacker could bypass the BitLocker Device Encryption feature on the system storage device. An attacker with physical access to the target could exploit this vulnerability to gain access to encrypted data."
        attribution: "Microsoft MSRC CVE-2026-45585 FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45585"
    extended_notes: |
      The mitigation involves registry editing inside the WinRE image — an operationally complex rollout for large fleets. Detection is hard as physical access is required and leaves minimal software-side artefacts. Key hardening steps: (1) add a BitLocker PIN/password protector (not just TPM-only) to all endpoints — this prevents the WinRE path from exposing data even if the bypass succeeds; (2) deploy the WinRE image mitigation from MSRC; (3) restrict physical access to devices. Sysmon-based detection is not applicable for physical attacks, but inventory tools should flag devices still running unpatched WinRE.

