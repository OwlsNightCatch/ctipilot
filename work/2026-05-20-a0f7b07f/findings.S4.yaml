        role: "primary"
      - url: "https://therecord.media/microsoft-disrupts-fox-tempest-malware-signing-service"
        publisher: "The Record / Recorded Future News"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/ → corroborating: The Record, URL https://therecord.media/microsoft-disrupts-fox-tempest-malware-signing-service"
    summary: |
      Microsoft's Digital Crimes Unit (DCU), with Resecurity support, disrupted Fox Tempest — a financially
      motivated threat actor operating a malware-signing-as-a-service (MSaaS) via the website signspace[.]cloud
      (now seized). Fox Tempest abused Microsoft Artifact Signing (formerly Azure Trusted Signing) to generate
      short-lived (72-hour) fraudulent code-signing certificates using stolen US and Canadian identities, creating
      hundreds of Azure tenants and subscriptions to support operations active since at least May 2025. The
      service charged ransomware affiliates USD $5,000–$9,000 per signing run, with a Google Form pricing sheet
      and a Telegram channel (EV Certs for Sale by SamCodeSign). Microsoft filed a civil court action in the US
      District Court for SDNY on May 5, obtained a court order May 8, then unsealed the case May 19; actions
      included seizing signspace[.]cloud, disabling hundreds of Cloudzy-hosted VMs, taking down ~1,000 accounts,
      and revoking 1,000+ certificates. The downstream impact covered healthcare, education, government, and
      financial sectors in the US, France, India, and China. Vanilla Tempest (Rhysida affiliate) used Fox
      Tempest to sign trojanised MSTeamsSetup.exe delivering the Oyster backdoor (also called Broomstick). Other
      confirmed downstream consumers include Storm-0501, Storm-2561, Storm-0249, and ransomware families INC,
      Qilin, and Akira. Malware families delivered via Fox Tempest-signed binaries include Oyster, Lumma
      Stealer, and Vidar, all masquerading as AnyDesk, Teams, Putty, or Webex. Defender: audit Artifact
      Signing tenant subscriptions; hunt for process trees where installer executables (Teams, AnyDesk, Webex,
      Putty) launch Oyster/Broomstick stages (Sysmon EID 1, parent = user-download path, child = rundll32 /
      regsvr32 loading unsigned DLL); alert on certificate issuance events from unrecognised Entra tenants in
      Defender for Cloud Apps; block revoked certificate hashes across endpoint estate.
    ch_eu_nexus: "Global; confirmed victims in France (EU). MSaaS model supplies ransomware affiliates (Akira, Qilin) actively targeting European sectors."
    public_sector_nexus: "Direct — government listed as affected sector by Microsoft; Vanilla Tempest/Rhysida targets include public sector."
