  - title: "Ofcom (UK) issues final decision requiring tech firms to deploy hash-matching proactive technology to detect non-consensual intimate images and AI deepfakes"
    sources:
      - url: "https://therecord.media/uk-regulator-to-require-tech-firms-to-tackle-deepfakes-nudification-ai"
        publisher: "The Record / Recorded Future News"
        date: "2026-05-19"
        role: "primary"
    discovery_trace: "first seen at: The Record RSS feed (bridge subcommand), URL https://therecord.media/feed → article drilled: primary The Record, URL https://therecord.media/uk-regulator-to-require-tech-firms-to-tackle-deepfakes-nudification-ai"
    summary: |
      Ofcom, the UK communications regulator, announced on 2026-05-19 its final decision requiring tech
      companies to expand use of "hash matching" proactive technology to detect and block non-consensual
      intimate images (NCII) and AI-generated sexual deepfakes. The measure updates Ofcom's Online Safety Act
      Illegal Harms Code of Practice; subject to a parliamentary process, requirements are expected to take
      effect in summer/autumn 2026. Hash matching converts images to digital fingerprints stored in a
      database to prevent future uploads of the same or similar files. Companies failing to remove NCII
      within two days face service-blocking orders (announced by PM Starmer in February 2026). The regulatory
      context: the UK's push followed widespread distribution of sexualised deepfakes via xAI's Grok chatbot
      (Ofcom + ICO investigations opened February 2026). The article notes the UK's approach diverges from the
      EU: an EU law permitting tech firms to scan communications for CSAM expired the prior month (late
      April 2026) after a parliament privacy standoff, though tech giants said they would continue CSAM
      scanning. The Ofcom decision has direct operational implications for platform operators serving UK users
      on NCII detection tooling procurement and compliance engineering.
    ch_eu_nexus: "UK domestic regulatory action; relevant to EU context given divergence from the expired EU CSAM scanning law. Swiss/EU platform operators with UK user bases face analogous compliance obligations."
    public_sector_nexus: "Indirect — affects platform operators broadly; no direct public-sector breach or incident."
    sector: "technology, platform, media"
