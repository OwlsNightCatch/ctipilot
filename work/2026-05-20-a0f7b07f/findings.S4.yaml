  - title: "Storm-2949 cloud-wide breach via SSPR social engineering: SSPR abuse → Entra ID MFA takeover → Key Vault secret theft → Azure VM compromise (Microsoft incident analysis)"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"
        publisher: "Microsoft Security Blog"
        date: "2026-05-18"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/microsoft-self-service-password-reset-abused-in-azure-data-theft-attacks/"
        publisher: "BleepingComputer"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/ → corroborating: BleepingComputer feed item (title: 'Microsoft Self-Service Password Reset abused in Azure data theft attacks'), URL https://www.bleepingcomputer.com/news/security/microsoft-self-service-password-reset-abused-in-azure-data-theft-attacks/"
    summary: |
      Microsoft Threat Intelligence published a detailed incident analysis of Storm-2949, a financially
      motivated threat actor (unattributed nation-state affiliation) that executed a multi-phase cloud-wide
      breach using no traditional malware, relying entirely on abusing legitimate Azure/M365 management features.
      Phase 1 (Identity): Storm-2949 initiated the Microsoft SSPR (Self-Service Password Reset) flow for
      targeted users (including IT personnel and senior leadership), then impersonated an internal IT support
      representative to convince victims to approve spurious MFA prompts. Once approved, the actor reset
      passwords, removed existing MFA methods (phone/email/Authenticator registrations), enrolled Microsoft
      Authenticator on their own device, and blocked the legitimate user from signing in. This was repeated
      across four compromised accounts. Phase 2 (M365 discovery and exfiltration): Using Microsoft Graph API
      and custom Python scripts, Storm-2949 enumerated users, roles, applications, and service principals,
      then exfiltrated thousands of files from OneDrive and SharePoint (targeting VPN configuration documents
      and remote access procedures as a lateral-movement springboard). Phase 3 (Azure Key Vault and Storage):
      The actor abused privileged custom Azure RBAC roles to invoke microsoft.Web/sites/publishxml/action on
      secondary App Service instances (auxiliary apps for auth/internal APIs), extracting basic-auth FTP/Web
      Deploy credentials and accessing Kudu management consoles. They then pivoted to Key Vault using the Key
      Vault Contributor role, modified access policies, and exfiltrated dozens of secrets (database credentials,
      connection strings). Phase 4 (Azure SQL and Storage): SQL firewall rules were modified via
      microsoft.sql/servers/firewallrules/write, databases accessed, rules deleted (defense evasion); Storage
      account network access modified via microsoft.storage/storageaccounts/write; SAS tokens and account
      keys retrieved via microsoft.Storage/storageAccounts/listkeys/action; large blob downloads executed via
      custom Python Azure SDK script over multiple days. Phase 5 (VM compromise): VMAccess extension deployed
      to create a new local admin account; Azure Run Command used for credential harvesting and on-prem
      domain reconnaissance. Detection: Azure Audit Log / Defender for Cloud alerts on Key Vault policy
      changes, SQL firewall rule mutations, storage network access changes, and VM extension deployments.
      Entra ID Sign-In Logs: hunt for SSPR flow initiations (event category: SelfServicePasswordReset)
      followed by MFA method changes and new Authenticator device enrollment from a new IP within the same
      session. Flag Graph API user/role/app enumeration in bulk (hundreds of requests in short window).
      Hardening: require Phishing-Resistant MFA (FIDO2/certificate-based) for all privileged roles; restrict
      SSPR to pre-registered recovery methods only; limit Key Vault Contributor role; enable Defender for
      Cloud on Key Vault, App Service, Storage, and SQL.
    ch_eu_nexus: "Global; attack pattern directly applicable to any organisation using Azure/M365. Particularly relevant to Swiss/EU public-sector entities migrating workloads to Azure Government or commercial Azure."
    public_sector_nexus: "Direct — Microsoft notes the technique is relevant to government entities; victim profile (IT personnel, senior leadership targeted) matches public-sector patterns."
    sector: "cross-sector (any Azure/M365 tenant), public sector, healthcare, financial"
    cves: []
    actors_campaigns_malware:
      - "Storm-2949"
    verification: MULTI-SOURCE
    confidence: HIGH
