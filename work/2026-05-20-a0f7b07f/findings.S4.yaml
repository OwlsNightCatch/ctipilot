    evidence:
      - quote: "Storm-2949 leveraged a social engineering technique consistent with known abuses of Microsoft's Self-Service Password Reset (SSPR) process. In such attacks, a threat actor initiates the SSPR process on behalf of a targeted user and subsequently employs social engineering tactics to persuade the user to complete multifactor authentication (MFA) prompts that appear to be legitimate."
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"
      - quote: "The threat actor pivoted to the organization's Azure Key Vault estate – an environment more likely to centralize sensitive secrets and offer indirect access to production systems."
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"
    extended_notes: |
      MITRE ATT&CK mapping: T1078.004 (Valid Accounts: Cloud Accounts), T1556.006 (Modify Authentication
      Process: Multi-Factor Authentication), T1098.005 (Account Manipulation: Device Registration),
      T1530 (Data from Cloud Storage), T1552.001 (Credentials In Files — Key Vault secrets),
      T1562.007 (Impair Defenses: Disable or Modify Cloud Firewall), T1021.007 (Remote Services: Cloud
      Services — Kudu console / Run Command), T1041 (Exfiltration Over C2 Channel), T1083 (File and
      Directory Discovery via Graph API). The absence of malware means EDR coverage of SSPR-triggered
      events is the critical detection layer; endpoint-only coverage will miss the identity-to-cloud
      pivot chain almost entirely.

  - title: "Huawei VRP enterprise router zero-day triggered nationwide telecom outage in Luxembourg (July 2025); no CVE filed 10 months later, patch status and exposure scope unknown"
    sources:
      - url: "https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage"
        publisher: "The Record / Recorded Future News"
        date: "2026-05-19"
        role: "primary"
    discovery_trace: "first seen at: The Record RSS feed (bridge subcommand), URL https://therecord.media/feed → article drilled: primary The Record, URL https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage"
    summary: |
      Recorded Future News disclosed on 2026-05-19 that a zero-day vulnerability in Huawei enterprise router
      software (VRP operating system) caused POST Luxembourg's nationwide telecom outage on 23 July 2025,
      disrupting landline, 4G, and 5G networks for 3+ hours and triggering hundreds of calls to emergency
      services when connectivity was restored. POST Luxembourg head of communications Paul Rausch confirmed
      the incident "exploited a non-public, non-documented behaviour, for which no patch was available at the
      time" and "was not related to the exploitation of any known or previously documented vulnerabilities."
      Multiple anonymous sources described it as a zero-day attack. The attack mechanism was specially crafted
      network traffic that sent Huawei enterprise routers into a continuous restart loop — the traffic appears
      to have transited POST's network rather than being specifically directed at POST as a target (Luxembourg
      prosecutors: "no evidence that an attack was specifically directed at POST Luxembourg"). Luxembourg
      cybersecurity authorities alerted partner IR teams across Europe through government channels after the
      incident. Critically, no CVE has been assigned in 10 months; Huawei has not publicly acknowledged the
      vulnerability; Huawei enterprise security advisories are published through a restricted customer portal,
      not as public CVEs. A separate, potentially unrelated Huawei DoS advisory (non-CVE) was published on
      the restricted portal last month. Whether the flaw was patched, how many operators are exposed, and
      whether similar Huawei enterprise routers remain vulnerable is unknown. Huawei did not respond to
      questions for the article. Defender: operators of Huawei enterprise router fleets (common in European
      telco and large-enterprise environments) should contact their Huawei account team and demand status on
      the Luxembourg advisory; monitor for anomalous packet-parsing behavior causing router reboots in
      traffic logs; apply RTBH/BPF filtering for malformed protocol traffic. The CVE disclosure gap
      underscores the structural risk of vendor-restricted advisory portals for critical national
      infrastructure components.
    ch_eu_nexus: "Direct EU; Luxembourg is an EU member state. Huawei enterprise routers are deployed in Swiss, German, and EU telco/ISP environments. The 10-month disclosure gap means Swiss/EU operators cannot assess exposure through standard vulnerability management processes."
    public_sector_nexus: "Direct — POST Luxembourg is a state-owned operator; outage disrupted government communications and emergency services."
    sector: "telco, critical infrastructure, government"
    cves: []
    actors_campaigns_malware: []
