  - title: "Microsoft DCU disrupts Fox Tempest malware-signing-as-a-service; 1,000+ fraudulent certificates revoked, ransomware pipeline to Rhysida/Akira/Qilin/Vanilla Tempest severed"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/"
        publisher: "Microsoft Security Blog"
