  item: "2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6 (body, actions[0], Defender takeaway)"
  url_or_quote: "actions[0]: \"upgrade each one whose configuration uses alias with rewrite and $request_filename, a regex map whose captures are referenced before its output variable, or aio together with ssi to nginx 1.30.6 or 1.31.7\""
  summary: "The same 1.30.6/1.31.7 release closes two more flaws that nginx.org lists and CERT-FR's AVI-1341 (cited) covers: CVE-2026-95101 (HTTP/3: part of an unknown frame treated as request body, bypassing client_max_body_size or injecting data into the proxied request) and CVE-2026-97629 (TLS session ticket key rotation leaves a key uninitialised, which might allow forging a session), both per https://nginx.org/en/CHANGES-1.30. The entry omits them and its config-conditional upgrade guidance tells operators to upgrade only instances matching the three patterns. Add the two flaws with their own preconditions (HTTP/3 enabled, ticket key rotation) and widen the action. The body also drops CCB's and F5's qualifier that exploitation needs 'conditions beyond the attacker's control' (AC:H)."
