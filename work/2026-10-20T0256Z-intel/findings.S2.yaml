    sources:
      - { url: "https://github.com/ovh/ovhcloud-cli/issues/300", publisher: "GitHub issue ovh/ovhcloud-cli #300 (third-party reporter, with OVHcloud maintainer replies)", date: "2026-10-19", role: "primary" }
      - { url: "https://x.com/olesovhcom/status/2112225308589834260", publisher: "Octave Klaba, OVHcloud founder (vendor statement on X; not the sole source)", date: "2026-10-19", role: "primary" }
      - { url: "https://www.top10hebergeurs.com/guide/infos-industrie/cli-ovhcloud-compromise-un-binaire-voleur-de-secrets-diffuse-ce-lundi-mettez-a-jour-ou-supprimez", publisher: "Top 10 Hébergeurs (relays Klaba, checked v0.16.0 on GitHub)", date: "2026-10-19", role: "corroborating" }
      - { url: "https://www.cyberattaque.org/ovhcloud-un-hacker-piege-plusieurs-versions-de-son-cli-officiel/", publisher: "Cyberattaque.org", date: "2026-10-19", role: "corroborating" }
      - { url: "https://runtimewire.com/article/ovhcloud-cli-compromised-secrets-october-2026", publisher: "RuntimeWire", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: cyberattaque-org, URL https://www.cyberattaque.org/ (front page via jina, item dated 19 octobre 2026) -> pivot: https://www.cyberattaque.org/ovhcloud-un-hacker-piege-plusieurs-versions-de-son-cli-officiel/ (extract) -> WebSearch (\"OVHcloud CLI supply chain attack release assets replaced GitHub account compromised v0.16.0\") -> RuntimeWire and Top 10 Hébergeurs (fetched) -> primary: GitHub issue https://github.com/ovh/ovhcloud-cli/issues/300 (extract, with OVHcloud staff replies) and the founder's post https://x.com/olesovhcom/status/2112225308589834260 (extract)"
    summary: |
      On 2026-10-19 the release assets of already published versions of OVHcloud's official command-line tool (GitHub repository ovh/ovhcloud-cli) were swapped for a malicious build. Facts from the GitHub issue (opened by an external user whose CI pins the SHA-256 of the Linux arm64 archive and started failing): the assets of v0.15.0 (published 2026-09-16) were replaced between about 12:47 and 12:57 UTC, those of v0.14.0 and v0.13.0 by 13:11 UTC, by an uploader account the reporter says is not a public member of the ovh organisation and not among the contributors; the i386, Windows arm64 and wasm assets of v0.15.0 were untouched. The reporter's `go version -m` on the new binary shows a local build of a 2026-10-13 commit with uncommitted changes (vcs.modified=true) and without the release pipeline's version ldflag, while the v0.15.0 tag and the Go module proxy still point at the original commit. An OVHcloud maintainer replied that all binaries involved were deleted at 16:21 (GMT+2) and that v0.16.0 is released with a signed tag and as an immutable release; a post-mortem is promised.
      OVHcloud's founder Octave Klaba states (on X): the build of 14:47 (CEST) was compromised by a hacker and was detected and blocked at 16:21 thanks to a customer report; the compromised versions are v0.11.0, v0.12.0, v0.13.0, v0.14.0 and v0.15.0, v0.10.0 and v0.16.0 are clean; no other repository is affected; the hacker used the GitHub account of one of the developers and added a binary whose job is to collect secrets from the disk, of poor quality but able to do the job; anyone concerned should change all secrets on the disk; analysis of the binary continues. Scope note: the GitHub issue observed replacement on v0.13.0 to v0.15.0 (the reporter did not check others), Klaba names v0.11.0 to v0.15.0; both statements stand. Not stated anywhere: which distribution channels served the binary, how many downloads occurred, whether credentials were stolen or where they went, and the actor.
      Reading across the two first-hand sources: exposure is a download or execution of the replaced release assets between roughly 12:47 UTC and the deletion at about 14:21 UTC on 2026-10-19 (an inference from the two time bases, CEST and UTC); the clean-up deleted the assets, so a host that ran the binary needs secret rotation, not just deletion.
    region_nexus: "global; OVHcloud is a French cloud provider; no source states a Swiss victim or Swiss customers, relevance rests on the transferable pattern (cloud-provider CLI on administrator workstations and CI runners)"
    primary_sector_nexus: "indirect: administrators and CI pipelines of any public body that uses OVHcloud's CLI are exposed to credential theft"
