      Cross-domain overlap: S1's research-lab record `pwn-ai` covers the same disclosure; returned here because heise (S2 essential record) surfaced it first and the sources above are fully fetched. The main agent should merge with S1's item, keeping one entry.
      Exposure: read the running kernel (uname -r on every KVM or microVM host) against the fixed releases for the distribution branch; check whether guests are untrusted or multi-tenant and whether virtio-net or tap devices with offloads are exposed to guests. Detection: kernel logs and host crash or reboot events on hypervisors (the one consequence the sources state); no guest-side signature is given by any source. Post-patch: a reboot or live patch is required (heise: plan a reboot).
      Hardening levers named: the kernel update itself and, for providers, interim mitigations such as Hetzner's eBPF-based one (per heise); nothing configuration-based is documented by the discoverer.
