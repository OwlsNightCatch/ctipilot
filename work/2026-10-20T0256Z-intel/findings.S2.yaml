    summary: |
      Roundcube published security updates for the 1.7 line (1.7.5) and the 1.6 LTS line (1.6.20) on 2026-10-19 and "strongly recommends" updating all productive installations. The release notes list 20 fixes without CVE ids or severity ratings: IMAP command injection via CRLF in the `_uid` parameter of the mail/headers and mail/viewsource actions and in the `_flag` parameter of mail/mark, mail header injection through several parameters (From display name in the bounce action, References / In-Reply-To / Message-ID, forwarded-as-attachment subject, inline-image media type), an SSRF filter (is_local_url) bypass via NAT64 64:ff9b::/96, remote-content-blocking bypasses (SVG SMIL, CSS escapes), CSS scoping bypass, an object-injection primitive in rcube_session::unserialize() via "!"-prefixed session keys, unsafe attachment content passed to ImageMagick and an ImageMagick resource-limit bypass through the GD fallback, a CSRF validation bypass in the mark-as-junk action, an XSS in password-driver error handling, deprecated action aliases bypassing the disabled_actions setting, a Modoboa password-driver flaw that could change another account's password, and an unsafe login name in a SquirrelMail import path. CERT-FR's avis (AVI-1340, 2026-10-19) lists remote code execution, SSRF and indirect XSS for Roundcube before 1.6.20 and 1.7.x before 1.7.5; the vendor notes themselves do not use the term. No exploitation, public proof of concept or KEV listing was found in the sources fetched.
