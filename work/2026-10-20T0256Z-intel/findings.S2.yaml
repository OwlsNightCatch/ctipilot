  - title: "BACS publishes five security classes for authentication methods: static secrets should no longer be used, only session-bound methods resist real-time phishing"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26-tb-authentifizierung-de", publisher: "BACS (NCSC.ch) Im Fokus", date: "2026-10-19", role: "primary" }
      - { url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", publisher: "BACS Technologiebetrachtung (PDF, cover dated September 2026; published with the page of 2026-10-19)", date: "2026-10-19", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (card dated 19. Oktober 2026, parsed from the server-rendered card markup) -> primary: BACS page https://www.bacs.admin.ch/de/26-tb-authentifizierung-de (extract) -> primary: PDF https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf (tools/fetch_source.py pdf, 17,893 chars from 9/18 streams, per-font ToUnicode decode, whitespace broken by extraction)"
    summary: |
      BACS (Federal Office for Cybersecurity) published on 2026-10-19 a technology assessment, "Sicherheitsklassen für Authentifikationsverfahren, -mittel und -dienste" (PDF cover: September 2026). It extends the four levels of the federal IT-Grundschutz (tief, mittel, hoch, hoch+, the last for internal federal use) to authentication methods, tokens and services and adds a star (*) to "mittel" and "hoch" for methods that resist real-time phishing and man-in-the-middle. Result: five classes (tief; mittel and mittel*; hoch and hoch*), orientated on NIST AAL 1-3 but differing in detail. BACS states the classification gives no basis for formal testing or certification and can serve organisations as a basis for security requirements, recommendations and best practices; it deliberately covers only knowledge-based approaches (biometrics, possession-only approaches and physical access control are out of scope) and says a mapping to the eCH-0170 trust levels is neither simple nor sensible.
      Content a defender can act on (from the PDF): "tief" = static secret identical on every authentication (password or cryptographic key), stays "tief" even over TLS or in a password manager; BACS concludes such methods should in principle no longer be used. "mittel" = dynamic authentication information plus at least one further security feature; because the secret is software-protected, technical measures must stop export; "mittel*" additionally needs session binding (the PDF names TLS channel binding per RFC 5056 and RFC 9266, Device Bound Session Credentials and OAuth DPoP) against session hijacking, real-time phishing and Mallory-in-the-middle. "hoch" = additionally a cryptographic key in a hardware module (smartcard, HSM) that cannot be read with reasonable effort, use gated by an extra authentication to the module, the module issued personally via a defined registration process; "hoch*" adds the phishing/MITM resistance. For indirect authentication (SAML/OIDC tokens) "mittel" rules apply and "hoch" additionally requires that authentication at the token issuer was itself "hoch". Stacking does not raise a class: passkeys stay "mittel" when combined with username, password and an SMS code. A footnote on API access says API keys must be protected specially (keychain, KMS or vault), not handed to API clients unnecessarily, not sent in URLs or automatically sent cookies, and short-lived keys and credentials are sensible wherever possible.
      This is non-binding authority guidance with no deadline, so it does not change an obligation; it gives Swiss federal, cantonal and communal defenders a federal reference for grading MFA estates and for the "phishing-resistant" requirement.
    region_nexus: "Switzerland, federal authority guidance usable by cantons and communes"
    primary_sector_nexus: "direct: BACS guidance for the public sector's identity and MFA design (the IT-Grundschutz levels it extends are the federal administration's baseline)"
