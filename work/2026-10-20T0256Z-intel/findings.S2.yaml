      - quote: "All binaries involved have been deleted at 16:21 GMT+2."
        attribution: "OVHcloud maintainer on GitHub issue #300"
        source_url: "https://github.com/ovh/ovhcloud-cli/issues/300"
      - quote: "This release is immutable, so the assets attached to it can be trusted."
        attribution: "OVHcloud maintainer on GitHub issue #300"
        source_url: "https://github.com/ovh/ovhcloud-cli/issues/300"
      - quote: "La version compromise est v0.11.0 v0.12.0 v0.13.0 v0.14.0 v0.15.0."
        attribution: "Octave Klaba (OVHcloud)"
        source_url: "https://x.com/olesovhcom/status/2112225308589834260"
      - quote: "Le hacker a utilisé le compte github d'un des développeurs et a ajouté un binaire dont le job est récupérer les secrets sur le disque."
        attribution: "Octave Klaba (OVHcloud)"
        source_url: "https://x.com/olesovhcom/status/2112225308589834260"
      - quote: "Si vous êtes concernés, merci de changer tous les secrets sur votre disque."
        attribution: "Octave Klaba (OVHcloud)"
        source_url: "https://x.com/olesovhcom/status/2112225308589834260"
    extended_notes: |
      Exposure check (vendor-stated): which hosts ran any of the five versions, above all CI runners and administrator workstations that fetch release assets by tag (install script or direct download) on 2026-10-19; hosts that pinned the SHA-256 of the originally published asset were protected and failed loudly (that is how the reporter caught it).
      Post-clean check: deleting the binary is not enough; rotate API keys, tokens, SSH keys and other secrets present on any host that executed it (Klaba's own instruction).
      Detection concepts tied to telemetry the sources support: CI/CD artifact-integrity logs (checksum mismatch against a pinned digest for an unchanged version number); source-host audit and release API data (assets of an old release replaced weeks after publication by an uploader who never uploaded for that project); binary build metadata (`go version -m` showing vcs.modified=true, a revision newer than the tag, no release version ldflag); endpoint process-creation events for the CLI binary in the 2026-10-19 window followed by credential-file reads or unexpected egress from that process (derived from the vendor's statement that the binary harvests secrets from disk; no IOCs given).
      Hardening levers named in the sources: pin and verify digests, build from the module proxy or tag instead of mutable release assets (the reporter's move), immutable releases and signed tags (OVHcloud's v0.16.0), and the reporter's ask for provenance (artifact attestations or cosign).
      Triage: a legitimate maintainer re-upload (a pipeline re-run) is the lookalike; the discriminators in the issue are the uploader identity, the dirty local build metadata, the weeks-late timing and the checksum change without a version bump.
      Single-first-hand caveat: the scope (0.11.0 vs 0.13.0 as the oldest affected) differs between the GitHub issue and Klaba; a post-mortem is promised.
