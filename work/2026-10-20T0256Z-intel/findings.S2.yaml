    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item of 2026-10-19 09:03Z) -> pivot: heise article (extract) -> primary: discoverer's write-up https://pwn.ai/blog/pwnescape (extract), Vercel https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge (extract), upstream commit https://github.com/torvalds/linux/commit/6785011f8b16abf40b1e9d8b2e332232b3e68822 (extract), Debian tracker https://security-tracker.debian.org/tracker/CVE-2026-99999 (extract); CVE id and fixed-version table checked against the NVD API record (published 2026-10-15), not cited"
    summary: |
      Component: the Linux kernel's IPv4 networking path. A guest that supplies checksum-offload metadata (virtio_net_hdr through tun or packet sockets; CHECKSUM_PARTIAL with an attacker-chosen checksum start) can make the kernel complete the checksum at the wrong place after the IPv4 header was already validated, so skb_checksum_help rewrites the network header (upstream fix "ipv4: validate checksum_start before completing checksum", commit 6785011f8b16; the NVD record lists include/net/ip.h, net/ipv4/ip_output.c, net/xfrm/xfrm_output.c and netfilter files and lists f43798c, "tun: Allow GSO using virtio_net_hdr", as the introducing change, so the flaw reaches back to kernel 2.6.27). The discoverers (pwn.ai, using an LLM-assisted harness) turned it into a repeatable host-memory disclosure, host crash and a guest-to-host escape on their own KVM and Firecracker machines; Vercel, whose $1M sandbox challenge produced the report, confirms the three effects (memory leak into guest packets, host crash with two packets, code execution on the host with full administrator privileges) and says almost every major cloud provider isolates workloads on this kernel layer.
      Rating and fixes: NVD lists the kernel CNA's CVSS 3.1 vector with base score 9.3 (AV:L, scope changed); CISA's SSVC entry of 2026-10-16 reads exploitation none, automatable no, technical impact total. Fixed upstream stable releases per the NVD record: 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57 and 7.2.11 (mainline 7.3). heise reports Debian updates on Monday morning (bookworm 6.1.190-1, trixie 6.12.113-1) and Ubuntu and Red Hat still pending; the Ubuntu tracker snapshot read "Needs evaluation" for all releases. heise reports first hosters rebooting their virtualisation hosts (Netcup) and a Hetzner statement of a temporary, eBPF-based mitigation that detects the attack vector at system level, so Hetzner need not reboot its hypervisors immediately (heise asked IONOS as well but quotes no IONOS statement); heise says hoster customers need not act beyond checking that their virtual servers survive a reboot.
      Exploitation: none in the wild is stated by any source. pwn.ai says it expects exploits "in weaker configurations to arrive in weeks, and exploits working in default hypervisor configurations to arrive in under a month" and suspects other hypervisors are also affected; its part 2 on the primitive-to-host-control step is announced. Exposed: Linux hosts that run untrusted guests (KVM and also Firecracker-class microVMs; hosters and shared sandbox or private-cloud clusters). The host crash effect is a visible consequence (unexplained hypervisor panics or reboots) per Vercel and heise.
    region_nexus: "global; no Swiss victim; Swiss public bodies that run KVM-based private clouds or virtualisation hosts (heise names KVM as a popular VMware alternative) are in the exposed class, which the sources do not state for Switzerland"
    primary_sector_nexus: "indirect: virtualisation hosts in public-sector data centres and hosters serving them"
    sector: "cloud / virtualisation"
