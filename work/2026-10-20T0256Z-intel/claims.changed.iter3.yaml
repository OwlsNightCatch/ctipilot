    kind: cited
    text: "**Detection:** in process-creation telemetry, the signed Software Center executable running from a folder under the user profile's local Programs directory and started by msiexec, which Siemens names as the signal; in image-load and file telemetry, unexpected DLL and data files beside that executable outside the default installation folder; in persistence telemetry, a Software Center start-up entry or scheduled task on a PC that never had the product, and a service-named folder that the malware creates under the same Programs directory ("
    urls: ["https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/"]
  - claim_id: fc72c55174
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "summary"
    kind: frontmatter
    text: "OVHcloud says a hacker used a developer's GitHub account to replace the release binaries of its command-line tool for versions v0.11.0 to v0.15.0 on 2026-10-19 with a build meant to collect secrets from the disk; the first replacement was at about 12:47 UTC and OVHcloud deleted the files at 14:21 UTC after a customer's pinned SHA-256 failed. Anyone who installed or updated the tool from a release asset in that window must rotate every secret on that host; the source tag and the Go module were untouched; OpenSourceMalware has not analysed the payload and OVHcloud says it is still examining the binary."
  - claim_id: 71e64d0295
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "OpenSourceMalware, working from GitHub's server-side records, says no tag was pushed and no release workflow ran, ties the same account's earlier force-pushes carrying a hidden loader (from 2026-03-05) to the GlassWorm campaign while saying that whether the same actor did both is its inference, notes that the project's release tooling replaces existing assets as normal behaviour, and says it has not analysed the payload because the files were deleted before anyone archived them ("
    urls: ["https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool"]
