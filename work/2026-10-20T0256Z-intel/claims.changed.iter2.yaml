claims:
  - claim_id: 785434a12e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Citrix's CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772 (memory overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were exploited before any fix existed; CISA added both to KEV and Citrix lists no workaround. Mandiant, GTIG, Unit 42, Zscaler and Rapid7 describe the compromises: web-server-configuration persistence, web shells, and in one intrusion the SAML crash CVE-2026-88779 chained with CVE-2026-88771 so that the crash handler ran the payload as root, followed by exfiltration of the appliance configuration and key material. An appliance patched after the bulletin therefore still needs a compromise check and its configuration secrets rotated. SAML-configured appliances need the later builds named for CVE-2026-88779 (14.1-73.41 or 13.1-64.28) and identity providers 14.1-73.46 or 13.1-64.29 for CVE-2026-107406; CVE-2026-88773 has a public proof of concept with no exploitation seen."
  - claim_id: 4592d0be99
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 that a software supplier of Publica detected a cyberattack at the end of September, and the supplier PK Softech AG (Reinach BL) says unknown attackers used malware to reach part of its IT infrastructure and that it must be assumed data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and says personal data of insured persons has presumably left, while the AWP agency relays the supplier's position that the volume is rather small and the data may be business data. Blick reports, citing a confidential federal information note, that the Confederation rates the incident as serious and that the security organs of the Confederation are particularly affected, which Blick glosses as the Federal Intelligence Service, the Defence Group and fedpol. The Pensionskasse Stadt Zürich now says personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch to its system, was stolen, and Pensionskasse Post says personal data did leave but not yet whether its insured persons' data is among it; the Bernische Pensionskasse now says, contrary to the supplier's earlier information, that it must be assumed personal data left, the pension consultancy Libera AG says it is also affected without knowing whose data, and the Bernische Lehrerversicherungskasse is still checking. Which fields were taken is still being clarified by each fund, and the access vector and the actor are not public. Cantonal police warn that criminals could use leaked salary and pension data for investment-fraud calls, and the Zurich cantonal fund BVK, a customer since 2011, says it runs the software in its own data centre and is not directly affected."
