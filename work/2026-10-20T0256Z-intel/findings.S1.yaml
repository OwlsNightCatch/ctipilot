  - title: "Rapid7 incident analysis: NetScaler intrusions chain CVE-2026-88771 with the SAML crash CVE-2026-88779, using the call-home crash handler to run the payload as root after reboot"
    sources:
      - { url: "https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/", publisher: "Rapid7", date: "2026-10-19", role: "primary" }
      - { url: "https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html", publisher: "Cloud Software Group / Citrix (bulletin CTX697096)", date: "2026-09-27", role: "corroborating" }
    discovery_trace: "first seen at: Rapid7 blog RSS (not a slice record; found while sweeping Rapid7 for watch-list vendors), fetched with python3 tools/fetch_source.py url --direct https://www.rapid7.com/blog/rss/ -> primary: Rapid7 analysis, URL https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/ -> corroborating: Citrix bulletin CTX697096, URL https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html (states exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated deployments have been observed); CISA KEV (python3 tools/fetch_source.py cisa-kev, catalogue 2026.10.16) lists CVE-2026-88779 added 2026-10-04"
    summary: |
      FACTS (Rapid7, 2026-10-19). Rapid7 analysts investigated an early-October 2026 compromise of a Citrix NetScaler ADC on an affected 14.1 build (build number not given). Its logs show
      CVE-2026-88771, the pre-authentication log-poisoning/RCE flaw, chained with CVE-2026-88779, the separate SAML-parsing crash: attacker-controlled text mimicking a Pitboss crash
      message was inserted into an authentication username, repeated nsaaad crashes and a Pitboss reboot followed, and after the reboot the NetScaler call-home crash handler processed the
      retained text and executed the payload as root, which lets the attacker avoid waiting for the handler's roughly 24-hour cycle. Rapid7 says the repeated crash-and-reboot cycle was
      reused over several days to refresh persistence. After first root execution the operator installed cookie-authenticated PHP web shells behind CSS-looking Apache aliases (answering
      with HTTP 404 bodies), set /bin/sh to mode 6555 so the unprivileged web process gets effective root, and kept access through cron, rc.netscaler, watchdog loops, an outbound
      reverse agent polling every 15 seconds and an HTTP-fronted TCP proxy; its logic synchronises implant files to the HA peer and forces failover so the implanted node stays active.
      A Go reconnaissance tool mapped routes, DNS, LDAP/Active Directory, management services and VMware vCenter from the appliance, and the NetScaler configuration (current and historical),
      HTTP configuration, diagnostics and system backups were staged and exfiltrated, one archive through the web root with an HTTP 200 response of matching size. Rapid7 notes the archive
      can hold encrypted credentials, LDAP/RADIUS bind information, SSL private keys and key-encryption material, and that the activity overlaps public WHIPSHOT/SLAPSHOT reporting; it
      names no actor.
      ANALYST READING. This is the first public incident-response case in the store showing the DoS-class flaw CVE-2026-88779 used as the crash trigger of a root-execution chain, so the
      "denial of service only" reading of that flaw is not safe on appliances that also carry the unpatched log-poisoning flaw; and a patched appliance that was reached still needs the secrets
      above rotated, since the exfiltrated configuration outlives the patch (rotation is the logical consequence of Rapid7's list, not a Rapid7 instruction).
    region_nexus: "global; anonymized victim, no geography given. NetScaler ADC/Gateway is widely deployed in Swiss federal, cantonal and communal remote-access and application delivery"
    primary_sector_nexus: "direct technology match (remote-access and load-balancing appliance class); victim sector not stated"
    sector: "cross-sector"
