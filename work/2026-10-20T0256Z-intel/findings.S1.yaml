        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/"
    extended_notes: |
      Suggested handling: `update` changelog record on 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev (priority already critical); the delta also belongs, in one
      sentence, on 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited, whose headline treats CVE-2026-88779 as a memory-overflow crash. Fields likely to move: summary,
      Detection (post-patch compromise check: rotate NetScaler configuration secrets, LDAP/RADIUS bind accounts, SSL keys and the key-encryption material; check both HA nodes since the
      implant syncs to the peer), Triage, techniques (add the persistence, proxy, discovery and exfiltration classes above), sources (Rapid7 is not cited by either entry today).
      Behavioural hunt concepts from the source (no IOCs): authentication-log entries carrying shell metacharacters plus Pitboss crash-message text; nsaaad crash loops and Pitboss reboots
      followed within seconds by new files on the persistent configuration partition; Apache configuration changes that execute non-PHP extensions as PHP or alias CSS-looking URLs to a
      handler; the setuid/setgid bit on /bin/sh; outbound connections from the appliance to new HTTPS endpoints at fixed 15-second intervals; HA synchronisation commands run outside change
      windows. Single-lab case for the chain detail; the components are independently corroborated (Citrix bulletin: exploits of CVE-2026-88771 observed; CISA KEV lists CVE-2026-88779).
      Rapid7's page also links its earlier ETR on the zero-days and mentions overlap with GTIG's WHIPSHOT/SLAPSHOT campaign already carried by the entry.
