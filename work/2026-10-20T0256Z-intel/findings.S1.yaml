    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-10&toDate=2026-10-20&exploited=true&page=0&size=100 (EUVD-2026-102072 carried exploitedSince 2026-10-19, not in prior_coverage.json) -> pivot: Siemens SSA-580366, URL https://cert-portal.siemens.com/productcert/html/ssa-580366.html (V1.2 2026-10-19 'Added reference to blog post about active exploitation') -> primary: Siemens ProductCERT news post, URL https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/ -> context: Forescout ROMULUS write-up, URL https://www.forescout.com/blog/romulus-analysis-of-a-new-multi-payload-clickfix-delivery-platform/ and Huntress, URL https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"
    summary: |
      FACTS (Siemens ProductCERT, 2026-10-19). Siemens states it validated active exploitation of CVE-2026-110936, an uncontrolled search path (CWE-427)
      DLL side-loading flaw in Siemens Software Center, all versions before V4.0.9.8. Advisory SSA-580366 appeared on 2026-10-15 and was revised to V1.2 on
      2026-10-19 to reference the exploitation notice; Siemens scores the flaw CVSS v4.0 8.4 and v3.1 6.7 (local vector, high privileges required) and says
      existing installations update to V4.0.9.8 on their next start. Siemens says the attackers did not rely on a copy already installed on the victim: they
      used a genuine, validly signed copy of Software Center and placed their own files next to it, and version 3.5.8.7 (the latest at the time) loaded helper
      files from its own folder without checking them. The Siemens binary was not modified, and Siemens says no Siemens system, product or update channel was
      breached. Siemens' warning signs are behavioural: Software Center in the start-up apps or Task Scheduler of a PC that never had it, the signed executable
      running from a user-profile Programs folder and started by msiexec, a malware-created folder under that Programs directory and unexpected data/DLL files
      beside the executable; its advice is to detect on folder and behaviour, not on the file fingerprint, because the file itself is genuine.
      CLAIMS AND CONTEXT. Siemens labels the activity the "Romulus multi-platform ClickFix campaign". Forescout's Vedere Labs published on 2026-10-15 a write-up
      of ROMULUS, a shared multi-payload ClickFix delivery panel found on six servers whose operator is unknown, and says one of its delivery chains used the same
      Stardock DeElevation sideloading package that Huntress reported on 2026-09-28 (Huntress documents a signed host executable launched by msiexec from a
      user-profile Programs folder with unsigned DLLs beside it, and warns to expect "more costumes"). Forescout does not mention Siemens software, so the link
      between Siemens' label and Forescout's platform rests on the shared name. ENISA's EUVD lists the flaw as exploited since 2026-10-19 (the date of Siemens'
      notice); it is not in CISA KEV (catalogue 2026.10.16) and Siemens gives no first-use date or victim geography.
      ANALYST READING (not a source statement). Because the attacker brings the vulnerable signed binary, patching installed copies to V4.0.9.8 does not stop
      the technique; the levers are the ClickFix paste step at the start of the chain and detection of a signed vendor binary executing from a user-writable
      path with unsigned DLLs beside it.
