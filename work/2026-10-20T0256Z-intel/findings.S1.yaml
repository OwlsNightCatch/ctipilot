    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-19&toDate=2026-10-20&fromScore=8.5&toScore=10&page=0&size=100 (EUVD-2026-104458/-104459/-104461, assigner rapid7) -> primary: Rapid7 disclosure, URL https://www.rapid7.com/blog/post/ve-authentication-bypass-remote-code-execution-and-database-read-in-eptura-archibus-fixed/ (also seen in Rapid7's blog RSS fetched with url --direct https://www.rapid7.com/blog/rss/) -> corroborating: Eptura revision history, URL https://knowledge.eptura.com/Archibus/Whats_New_for_Archibus/Revision_History_Overview/Revision_History_for_Archibus_V.2025.02; CVE records read via https://cveawg.mitre.org/api/cve/CVE-2026-107186 (state PUBLISHED 2026-10-19, affected < 2025.02)"
    summary: |
      FACTS (Rapid7, 2026-10-19). Rapid7 disclosed three flaws in Eptura Archibus Web Central, the building, asset, maintenance and real-estate management platform, after a
      coordinated-disclosure process that ended with Eptura asking for and receiving a one-week extension. (1) CVE-2026-107186, CVSS 3.1 8.6: the Java DWR API accepts several batched
      calls on one thread; the pre-authentication-whitelisted SecurityService.isPasswordUppercase call sets the privileged core-user session on the thread-local context, and a second
      call in the same request to workflow.runWorkflowRule then runs under that session, so any workflow rule executes without credentials. (2) CVE-2026-107187, 8.5: the
      AbCommonResources-getDataRecords workflow reads any database table, usernames and passwords included. (3) CVE-2026-107188, 9.6: the AbCommonResources-writeHTMLtoFile workflow writes
      attacker-chosen content to a browsable location with an attacker-chosen extension, so an uploaded JSPX file executes as NT AUTHORITY\Local Service. Chained, they give anyone with
      HTTP access to the server unauthenticated database read and remote code execution; the post includes the DWR request structure (endpoint under /archibus/dwr/call/plaincall/ with a
      callCount=2 batch) and Rapid7 states the issues were found and exploited on a Vector Command customer's Archibus server on 2026-05-25 during its continuous red-team service.
      AFFECTED AND FIXED. The CVE records (assigner Rapid7) list all versions before 2025.02 as affected. Rapid7 recommends upgrading to 2025.02 or later, where the vulnerable DWR method
      moved to a REST API; Eptura's 2025.02 revision history lists "Replace many DWR endpoints with REST". Per Rapid7's timeline Eptura told it on 2026-10-09 that a fix was in
      development for version 2025.01, and on 2026-07-30 that the version Rapid7 first referenced is no longer supported; no Eptura security advisory was found. No in-the-wild exploitation
      is reported and none of the three CVEs is in CISA KEV; EPSS is not yet published.
    region_nexus: "global; Rapid7 names no geography. Archibus is used by public and private owners of large building and real-estate portfolios, which includes public-sector property, university and hospital estates (Rapid7 cites over 16,000 companies using it in 2023)"
