      Suggested handling: new `vulnerability` entry, priority notable (pre-authentication chain to code execution in an internet-facing web application with request-level detail published,
      vendor fix = version upgrade; no exploitation reported; modest installed base in the constituency is unverified). Marked confidence MEDIUM because the vendor has published no
      advisory that was found and the claims rest on the discoverer, which is also the CNA; the CVE records and Eptura's revision history agree on "before 2025.02". One reducing fact for
      exposure: Archibus Web Central is normally an internal application, so internet reachability is the first check; Rapid7's own exploitation was on a customer server it was authorised to test.
      Detection concepts: web or reverse-proxy logs for POSTs to the DWR plaincall endpoint carrying batched calls (callCount greater than 1) that name SecurityService.isPasswordUppercase
      followed by workflow or runWorkflowRule methods (needs request-body logging, i.e. a WAF or proxy that records POST bodies); file-system telemetry for new .jspx/.jsp files in browsable
      Archibus web directories; process-creation telemetry for the Tomcat/Archibus service account (NT AUTHORITY\Local Service) spawning cmd.exe or powershell.exe. Post-patch check: unknown
