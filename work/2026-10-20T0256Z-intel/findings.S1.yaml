    extended_notes: |
      Suggested handling: new `vulnerability` entry, priority notable (vendor-confirmed exploitation, no constituency victim, no KEV; the exploited object is an attacker-shipped
      copy, so there is no inventory "patch now" action beyond updating Software Center). Credibility: single first-party source for the exploitation of Siemens software specifically;
      the delivery pattern (ClickFix -> PowerShell -> silent msiexec install of a trojanized MSI -> signed host + unsigned DLL from the user-profile Programs folder -> HKCU Run and
      scheduled-task persistence) is independently documented by Huntress for Canon and Stardock hosts and by Forescout for ROMULUS. Siemens credits Huntress (Jose Oregon) with
      reporting the CVE; Huntress' own blog listing carries no Siemens post as of 2026-10-20 (WebFetch of https://www.huntress.com/blog), and web search found no independent
      coverage yet (index lag). Siemens' own attribution field is only a campaign label, not an actor.
      Detection concepts (telemetry class first): process-creation events where msiexec.exe (silent install from a user temp path) is followed by a vendor-signed executable running from a
      user-profile Programs folder on a host that never had the vendor product; image-load events (for example Sysmon EID 7) showing unsigned DLLs loaded by that signed host from a
      user-writable path; autorun-key or scheduled-task creation naming a vendor product on hosts without it; at the front of the chain, PowerShell or a shell started from the Run dialog
      or explorer. Hardening: AppLocker or WDAC rules that combine publisher and path (signed vendor binaries may run only from their allow-listed install path), policy removal of the Run
      dialog where the role does not need it, PowerShell constrained language / logging, and ClickFix user awareness.
      Triage discriminator (from Siemens' wording): a real Software Center install versus a copy sitting in the user-profile Programs folder, started by msiexec, with unsigned files beside it
      or start-up entries on a PC that never had the product.
