claims:
  - {claim_id: d857c7bbc3, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Siemens has validated that there is an active exploitation of CVE-2026-110936, a DLL side-loading vulnerability in Siemens Software Center."}
  - {claim_id: 880b0a3e34, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "version 3.5.8.7, the latest version at the time, loaded helper files from its own folder; Threat Actor Attribution: Romulus multi-platform ClickFix campaign; Existing installations update automatically"}
  - {claim_id: d42dd9b568, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-580366.html", passage: "CVSS v4.0 Base Score 8.4; v3.1 6.7 AV:L/PR:H; All versions < V4.0.9.8; epss 0.001350000 (api.first.org 2026-10-19)"}
  - {claim_id: e9451e7435, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Siemens fixed the weakness in version 4.0.9.8 and published advisory SSA-580366 on 15 October."}
  - {claim_id: b0256e3e90, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-580366.html", passage: "CVSS v3.1 6.7 CVSS:3.1/AV:L/AC:L/PR:H; CVSS v4.0 8.4; All versions < V4.0.9.8 affected"}
  - {claim_id: 43a7700343, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "They chose this program as a carrier because it is signed and trusted, and because version 3.5.8.7... The Siemens program was not modified. No Siemens system, product or update channel was breached to our knowledge."}
  - {claim_id: 196854e6e3, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Threat Actor Attribution: Romulus multi-platform ClickFix campaign; The attackers distributed the signed program together with their malicious files outside official channels."}
  - {claim_id: 2f48198e6a, verdict: ok, source_url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat", passage: "installs it silently with msiexec /qn; %LOCALAPPDATA%\\Programs\\...; a User Run key and a scheduled task; Unfortunately, we (and you) should expect more costumes."}
  - {claim_id: 7924282a9a, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Siemens Software Center in the start-up apps or Task Scheduler of a PC that never had it installed; Existing installations update automatically the next time they start."}
  - {claim_id: 38dd60e99d, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Look for SiemensSoftwareCenter.exe running from AppData\\Local\\Programs and started by msiexec; A folder called SM Software Provisioning Service inside AppData\\Local\\Programs is created by the malware"}
  - {claim_id: 219490a4fc, verdict: F3, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Siemens page says 'unexpected DLL files' and 'valid signature' for the program; the word 'unsigned' (files beside it) is not on the Siemens page (it is in Huntress's Canon chain)."}
  - {claim_id: 80828833d9, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "Never paste a command from a web page into Win+R, the Run box or PowerShell.; Update Siemens Software Center to version 4.0.9.8 or later."}
  - {claim_id: a5420554ba, verdict: ok, source_url: "https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", passage: "If found: isolate the PC, stop the process first, then remove the start-up entry and task, and reset passwords; Detect on folder and behaviour, not on the Siemens file fingerprint: the file itself is genuine"}
  - {claim_id: 86d00f3154, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "A downstream user whose CI pinned a SHA-256 caught it within 94 minutes. OVHcloud deleted the files at 14:21 UTC"}
  - {claim_id: 7bc480a070, verdict: ok, source_url: "https://x.com/olesovhcom/status/2112225308589834260", passage: "La version CLI de 14h47 a été compromise... bloquée à 16h21... La version compromise est v0.11.0 v0.12.0 v0.13.0 v0.14.0 v0.15.0... ajouté un binaire dont le job est récupérer les secrets sur le disque"}
  - {claim_id: 91cf72705a, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "You are affected if, between 12:47 and 14:21 UTC on 19 October 2026, you installed or updated the OVHcloud CLI ... install.sh / brew cask / direct download / CI job"}
  - {claim_id: 406102ae5f, verdict: ok, source_url: "https://x.com/olesovhcom/status/2112225308589834260", passage: "Le hacker a utilisé le compte github d'un des développeurs et a ajouté un binaire... La version v0.10.0 et la future 0.16.0 est clean."}
  - {claim_id: 86f074ce67, verdict: ok, source_url: "https://github.com/ovh/ovhcloud-cli/issues/300", passage: "replaced today (2026-10-19, ~12:47–13:12 UTC), weeks after...; HassenBF is not a public member of the ovh org; vcs.modified=true; v0.15.0 tag still points to 760fd72d, and the Go module proxy serves that same commit"}
  - {claim_id: da107b3db6, verdict: ok, source_url: "https://github.com/ovh/ovhcloud-cli/issues/300", passage: "All binaries involved have been deleted at 16:21 GMT+2. ... v0.16.0, tag is signed with my account. This release is immutable"}
  - {claim_id: 2eaeda012f, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "No tag was pushed and no GitHub Actions workflow ran.; Whether the same actor did both is our inference; replace_existing_artifacts: true; we have not analyzed the payload"}
  - {claim_id: b70869c965, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "You are not affected if you used go install..., built from source, pulled the ovhcom/ovhcloud-cli Docker image"}
  - {claim_id: e4b66f79e2, verdict: ok, source_url: "https://github.com/ovh/ovhcloud-cli/issues/300", passage: "Replaced assets (uploader HassenBF); Originally uploaded by amstuta; vcs.modified=true; lacks the -X ...version.Version ldflag"}
  - {claim_id: 23e6f73750, verdict: ok, source_url: "https://x.com/olesovhcom/status/2112225308589834260", passage: "Si vous êtes concernés, merci de changer tous les secrets sur votre disque."}
  - {claim_id: 054784944a, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "Overwriting is a normal operation: release: mode: keep-existing and replace_existing_artifacts: true; the uploader was HassenBF, not the amstuta account that originally published"}
  - {claim_id: 55881c931a, verdict: F3, source_url: "https://github.com/ovh/ovhcloud-cli/issues/300", passage: "Issue #300 says only that binaries were deleted and v0.16.0 is immutable; the secret-rotation advice is in Klaba's X post, and 'ran on 2026-10-19' is wider than the install/update window both sources give"}
  - {claim_id: 6e1d819e0a, verdict: ok, source_url: "https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", passage: "We also don't know how the credentials were taken.; OVHcloud hasn't published what paths it reads or where it sends them."}
  - {claim_id: 2e5d9756fd, verdict: ok, source_url: "https://x.com/olesovhcom/status/2112225308589834260", passage: "ajouté un binaire dont le job est récupérer les secrets sur le disque (derived detection suggestion)"}
  - {claim_id: aa20173e69, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "Authentifikationsverfahren ... mit der Sicherheitsklasse «tief» sollten grundsätzlich nicht mehr eingesetzt werden; Session Binding ... «mittel*»"}
  - {claim_id: 2fbd8720eb, verdict: ok, source_url: "https://www.bacs.admin.ch/de/26-tb-authentifizierung-de", passage: "drei Sicherheitsklassen «tief», «mittel» und «hoch», wobei die beiden Klassen «mittel» und «hoch» noch weiter unterteilt sind; keine Grundlage zur formalen Prüfung oder Zertifizierung"}
  - {claim_id: 17ae5304f8, verdict: ok, source_url: "https://www.bacs.admin.ch/de/26-tb-authentifizierung-de", passage: "in die drei Sicherheitsklassen «tief», «mittel» und «hoch» eingeteilt, wobei die beiden Klassen «mittel» und «hoch» noch weiter unterteilt sind. Für die insgesamt fünf Sicherheitsklassen"}
  - {claim_id: 7df96afee8, verdict: ok, source_url: "https://www.bacs.admin.ch/de/26-tb-authentifizierung-de", passage: "orientiert sich ... an den AAL 1–3 des NIST, ... leicht angepasst und ... Real-time Phishing erweitert; keine Grundlage zur formalen Prüfung oder Zertifizierung ... Grundlage ... für Sicherheitsvorgaben, Empfehlungen"}
  - {claim_id: 285062d9e2, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "ist statisch und bleibt für jeden Authentifikationsvorgang gleich (z. B. Passwort oder kryptografischer Schlüssel). Die Klasse bleibt «tief», selbst wenn die Übertragung ... über ... TLS erfolgt"}
  - {claim_id: 7a37dbbcb2, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "dynamisch (... für jeden Authentifikationsvorgang neu erzeugt) und hängt von mindestens einem weiteren Sicherheitsmerkmal ab; Session Binding ... TLS Channel Binding, DBSC, DPoP; Session Hijacking, Real-time Phishing, MITM"}
  - {claim_id: 87b2073daf, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "die Unterscheidung zwischen «mittel» und «hoch» vor allem beim Einsatz zusätzlicher Hardware für die Speicherung der kryptografischen Schlüssel bei «hoch»"}
  - {claim_id: 647ab24ff6, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "Um vor solchen Angriffen zu schützen, sind Authentifikationsverfahren ... erforderlich, die ein «Session Binding» unterstützen."}
  - {claim_id: 33d81e169d, verdict: ok, source_url: "https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf", passage: "kann von Organisationen und Unternehmen als Grundlage zur Ausarbeitung von sicherheitstechnischen Vorgaben, Empfehlungen und Best Practices verwendet werden; grobe Leitlinie"}
  - {claim_id: c5d93ad033, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "each flaw has a CVSS v4.0 score of 9.2 (Critical); Update to 37.1.0.1, 37.0.5.1, 1.31.7, 1.30.6; Debian tracker bookworm/trixie vulnerable"}
  - {claim_id: 53522b1286, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "F5 published three security advisories on October 14, 2026 ... no public proof-of-concept ... no active exploitation; nginx.org Severity: medium for all three"}
  - {claim_id: 2bfaae12df, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "set aio off; or ssi off; ... named captures ... avoid alias / remove $request_filename; fixes 1.31.7/1.30.6, Plus 37.1.0.1/37.0.5.1 (task is concrete; see F8 on conditional-upgrade framing)"}
  - {claim_id: 04d03e433f, verdict: ok, source_url: "https://ccb.belgium.be/advisories/warning-heap-based-buffer-overflows-nginx-plus-and-nginx-open-source-can-be-exploited", passage: "NGINX Open Source 0.1.29 to 1.30.5 and 1.31.0 to 1.31.6 (CVE-2026-15176); NGINX Plus R33 to R36, 37.0.0 to 37.0.5, and 37.1.0; CVSS 9.2; epss 0.00516 (api.first.org)"}
  - {claim_id: bb9fc87ffd, verdict: ok, source_url: "https://ccb.belgium.be/advisories/warning-heap-based-buffer-overflows-nginx-plus-and-nginx-open-source-can-be-exploited", passage: "NGINX Open Source 1.30.0 to 1.30.5 and 1.31.2 to 1.31.6 (CVE-2026-93479); CVSS 9.2; epss 0.00554"}
  - {claim_id: f2b7376758, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Use-after-free when using asynchronous file I/O (AIO) ... Vulnerable: 0.8.11-1.31.6; Daily CyberSecurity: AIO enabled + SSI include virtual; epss 0.00484"}
  - {claim_id: 1736dde90f, verdict: F3, source_url: "https://nginx.org/en/security_advisories.html", passage: "Page lists FIVE flaws 'Not vulnerable: 1.31.7+, 1.30.6+': CVE-2026-15176, -93479, -95101, -97629, -97205; no 2026-10-14 date on the page (the dated source is https://nginx.org/en/CHANGES-1.30 'Changes with nginx 1.30.6 14 Oct 2026', also five Security items)"}
  - {claim_id: 39a0ce809a, verdict: ok, source_url: "https://ccb.belgium.be/advisories/warning-heap-based-buffer-overflows-nginx-plus-and-nginx-open-source-can-be-exploited", passage: "CVE-2026-15176 is a heap-based buffer overflow in the ngx_http_core_module ... alias ... rewrite ... $request_filename; CVE-2026-93479 ... evaluation of string expressions ... regex capture variables before ... map output variable"}
  - {claim_id: 41822b36e7, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "each flaw has a CVSS v4.0 score of 9.2 (Critical). Unauthenticated attackers can exploit these memory corruption bugs; CCB lists CVSS:4.0/AV:N/AC:H/AT:N/PR:N for the first two"}
  - {claim_id: e27498132f, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-15176", passage: "This may cause a heap buffer overflow in the NGINX worker process leading to a restart. Additionally, attackers can execute code on systems with ASLR disabled or when the attacker can bypass ASLR."}
  - {claim_id: 47b172f7aa, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "Currently, F5 has confirmed no public proof-of-concept exploit code for any of the three flaws. Additionally, there is no active exploitation in the wild"}
  - {claim_id: 31336222e1, verdict: F14, source_url: "https://www.helpnetsecurity.com/2026/05/18/ngnix-vulnerability-exploited-cve-2026-42945/", passage: "VulnCheck's canary systems began flagging exploitiation attempts on May 16, three days after the vulnerability and the PoC had been made public. (article 2026-05-18: 'disclosed last week')"}
  - {claim_id: 35add857c4, verdict: ok, source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1341/", passage: "NGINX Plus versions antérieures à 37.1.0.1 et 37.0.5.1; Date de la première version 19 octobre 2026"}
  - {claim_id: a54f883855, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "CVE-2026-15176 Vulnerable: 0.1.29-1.31.6; CVE-2026-93479 Vulnerable: 1.31.2-1.31.6, 1.30.0-1.30.5; CCB Plus R33 to R36, 37.0.0 to 37.0.5, and 37.1.0 (both CVEs)"}
  - {claim_id: 52d5689d81, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-15176", passage: "bookworm (security) 1.22.1-9+deb12u10 vulnerable; trixie (security) 1.26.3-3+deb13u9 vulnerable; forky, sid 1.30.4-8 fixed"}
  - {claim_id: a49fe0b1ae, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-15176", passage: "may cause a heap buffer overflow in the NGINX worker process leading to a restart"}
  - {claim_id: 009ed8c7ec, verdict: ok, source_url: "https://ccb.belgium.be/advisories/warning-heap-based-buffer-overflows-nginx-plus-and-nginx-open-source-can-be-exploited", passage: "While patching appliances or software to the newest version may protect against future exploitation, it does not remediate historic compromise."}
  - {claim_id: 58b66628e4, verdict: ok, source_url: "https://securityonline.info/f5-patches-three-critical-nginx-vulnerabilities/", passage: "set aio off; or ssi off; ... replace unnamed regex captures with named captures restricted to the regex match block ... avoid using the alias directive ... or remove references to the $request_filename variable"}
  - {claim_id: 2ba189c2e5, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-15176", passage: "forky, sid 1.30.4-8 fixed (distribution package versions differ from upstream)"}
  - {claim_id: 7a72cb00a7, verdict: ok, source_url: "https://www.blick.ch/politik/daten-debakel-beim-bund-sicherheitsorgane-betroffen/jle39rp", passage: "«Besonders betroffen sind die Sicherheitsorgane des Bundes», heisst es in der vertraulichen Informationsnotiz; NZZ: BPK 'dass entgegen vorherigen Informationen der PKS davon ausgegangen werden muss, d"}
  - {claim_id: 369eb4bb92, verdict: ok, source_url: "https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090", passage: "Libera 'weder bestätigt noch ausgeschlossen'; BPK ... Personendaten abgeflossen; cash.ch AWP: 'eher kleine Datenmenge'; NZZ 10-13: BVK Rechenzentrum, 2011"}
  - {claim_id: 41f5ff541c, verdict: ok, source_url: "https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090", passage: "Concrete task derived from PKZH/Publica data lists and cybercrimepolice 'Kenntnis persönlicher Angaben ... kein Beweis'; BPK/Libera statements as quoted"}
  - {claim_id: 3aeb339533, verdict: ok, source_url: "https://www.pkpost.ch/news/263-cyberangriff-bei-softwarelieferant-versichertendaten-moeglicherweise-betroffen", passage: "Ob Daten von Versicherten der Pensionskasse Post betroffen sind, bleibt weiterhin unklar. (action is a written-inquiry task, derived)"}
  - {claim_id: a0e3760c1a, verdict: ok, source_url: "https://www.admin.ch/de/newnsb/FjG4XOIms04s", passage: "Ende September wurde ein externer Softwarelieferant ... Cyberangriffs; weitere Kunden informiert; Bundesanwaltschaft hat Ermittlungen aufgenommen; Keine anderen Bundesstellen pflegen Geschäftsbeziehun"}
  - {claim_id: 1c402b99da, verdict: ok, source_url: "https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG", passage: "Unbekannte haben sich mithilfe von Schadsoftware ... Zugang zu einem Teil unserer IT-Infrastruktur verschafft; muss davon ausgegangen werden, dass Daten ... abgeflossen sind; Art und Umfang ... Gegens"}
  - {claim_id: 07b8882bb5, verdict: ok, source_url: "https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma", passage: "Sie versichert unter anderem Mitarbeitende der Bundesverwaltung und des ETH-Bereichs. Ende 2025 zählte sie rund 70'000 aktive Versicherte und 41'600 Rentenbeziehende."}
  - {claim_id: aa2a173ab6, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "Die weiteren Untersuchungen haben ergeben, dass dabei vermutlich Personendaten ... abgeflossen sind; list: Name ... Zivilstand ... Ehepartner ... IBAN; Dass Ihre persönlichen Daten tatsächlich abgeflo"}
  - {claim_id: aa8badad17, verdict: ok, source_url: "https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss", passage: "Ob tatsächlich Daten der Bundespensionskasse abgeflossen sind, sei noch unklar."}
  - {claim_id: 51e3ab398d, verdict: ok, source_url: "https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma", passage: "Ob Lösegeldforderungen vorliegen ... wollte Publica mit Verweis auf die laufenden Ermittlungen ... nicht sagen."}
  - {claim_id: 99879c5a1a, verdict: ok, source_url: "https://www.admin.ch/de/newnsb/FjG4XOIms04s", passage: "Aktuell prüft das Unternehmen ... in welchem Umfang Daten von Publica betroffen sind."}
  - {claim_id: 79a82b2499, verdict: ok, source_url: "https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf", passage: "Bei der Lieferantin handelt sich um dieselbe Firma, welche auch die Bundespensionskasse Publica beliefert."}
  - {claim_id: 2b5e0a5a12, verdict: ok, source_url: "https://blvk.ch/wp-content/uploads/2026/10/20261008_Cyberangriff-auf-Softwarelieferant-von-der-BLV.pdf", passage: "Ende September wurde ein externer Softwarelieferant der BLVK ... Opfer eines Cyberangriffs (supplier not named; entry says so in sourcing_note)"}
  - {claim_id: b6f63b5769, verdict: ok, source_url: "https://www.pkpost.ch/news/260-cyberangriff-auf-softwarelieferant-der-pensionskasse-post", passage: "Ende September ist ein Cyberangriff auf den Softwarelieferanten PK Softech AG erfolgt."}
  - {claim_id: 1a11eaf884, verdict: ok, source_url: "https://www.pkzh.ch/de/aktuelles/cyberangriff-softech.html", passage: "deuten darauf hin, dass ... auch Personendaten von Versicherten der PKZH entwendet wurden. Diese Daten wurden im Rahmen von Tests für den geplanten Systemwechsel verwendet; Anfang 2027"}
  - {claim_id: a4fa8c16d4, verdict: ok, source_url: "https://www.pkpost.ch/news/263-cyberangriff-bei-softwarelieferant-versichertendaten-moeglicherweise-betroffen", passage: "tatsächlich Personendaten abgeflossen sind. Ob Daten von Versicherten der Pensionskasse Post betroffen sind, bleibt weiterhin unklar."}
