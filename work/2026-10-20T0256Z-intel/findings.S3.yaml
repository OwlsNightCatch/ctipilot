    summary: |
      Blick reports on 2026-10-18 that Federal Councillor Karin Keller-Sutter brought the matter to the Federal Council's Wednesday session (2026-10-14) about the cyberattack on the external software supplier of the federal pension fund Publica; the Finance Department's statement quoted by Blick says neither the Federal Council nor a department supervises Publica. Citing a confidential internal information note, Blick reports that the Confederation internally expects "considerable damage", calls the incident "serious", and warns current and retired federal employees of longer-term consequences, with "the security organs of the Confederation" named as especially affected: the Federal Intelligence Service (NDB), the Defence Group in the VBS and the Federal Office of Police (fedpol). Blick says the cantons were informed because a combination of certain stolen data sets might allow conclusions about Swiss defence capability, and describes internal concern that staff working abroad could be identified by matching stolen federal data with entry lists; that scenario is Blick's and its sources' reading, not an official finding. Publica's own statements quoted in the article say which data and how many people are affected is still being investigated, that it set up a crisis staff, and that it does not speculate on scenarios; the Federal Prosecutor's Office is investigating. Blick adds that clarification may take weeks or months and recalls the 2023 Xplain case, whose follow-up recommendation was that suppliers should receive test data rather than real data.
