    discovery_trace: "first seen at: sans-newsbites, URL https://www.sans.org/newsletters/newsbites/xxviii-77 (issue 77, 2026-10-16, item 'Microsoft and Health-ISAC Disrupt Chinese Criminal Marketplace Platforms') → WebSearch ('Microsoft Digital Crimes Unit Health-ISAC CoGUI Iron Man YAM Store takedown court order Southern District of Florida') → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/global-takedown-hits-network-behind-1-billion-phishing-messages/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/ → partner research: Resecurity, URL https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem → PhishEye (listed in Microsoft's references), URL https://phisheye.com/blog/irontoll-iron-man-phaas-campaign"
    summary: |
      Microsoft Threat Intelligence and the Digital Crimes Unit report on 2026-10-14 a Chinese-language ecosystem it assesses with high confidence was built by Chinese-speaking developers: YAM Store (tracked Storm-3119), an initial access broker that sells accounts, licences and storage in compromised or fraudulently obtained Microsoft and Google tenants, and the developers behind the CoGUI, Haozi and Iron Man System phishing kits (Storm-2990), which Microsoft says enabled over one billion phishing emails and SMS messages to over 75,000 organisations since January 2026. Microsoft describes a five-stage YAM Store pipeline: automated tenant reconnaissance over Tor, takeover through admin panels that use a stolen application client secret in an application-only flow to reset passwords silently, assign education licences and grant privileges, abuse of SharePoint and OneDrive as bulk hosting after the actor self-provisions the PnP Management Shell service principal with broad Graph permissions (including AppCatalog.ReadWrite.All) in a compromised Global Administrator session, DNS and certificate management through Cloudflare, and an automated storefront. It also reports tenants created for fabricated organisations backed by expired or newly registered domains and likely AI-generated content. The Iron Man System kit carries over 2,300 templates for over 139 countries, including local government traffic and parking-fee authorities, law enforcement, healthcare, finance and transport, with geofencing, fake CAPTCHA gates, IP allow and block lists, Telegram bot notification and WebSocket-based live interaction; downstream actors used credential theft, device-code phishing and card fraud. Resecurity, which Microsoft names as industry partner, independently reports 2,360 templates across 130 countries and a self-hosted build registry; Microsoft and Health-ISAC obtained a US court order to seize domains. No source names Switzerland or a Swiss victim; Microsoft names healthcare, financial services, wholesale distribution and IT in Japan, the United States, Australia and India.
