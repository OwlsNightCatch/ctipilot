        attribution: "SOC Prime"
        source_url: "https://socprime.com/blog/cve-2026-99999-analysis/"
    extended_notes: |
      OVERLAP WARNING: this is vulnerability-triage territory (S1 likely sees the CVE through NVD or distro trackers). It is returned here because the primary is a research write-up (pwn.ai) with mechanism detail. The main agent should keep one entry.
      Admiralty suggestion: reliability B (discoverer's own write-up, corroborated by the kernel CVE text and Vercel), credibility 1 for the bug and the leak stage, 2 for the lab-only host-root chain.
      cve_table row: CVE-2026-99999 · Linux kernel IPv4 · CVSS 3.1 9.3 AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H (Ubuntu security page; SOC Prime repeats it; CSO Online says the NVD description lists the fixes) · EPSS 0.00211 (FIRST, 2026-10-19) · KEV no (bridge cisa-kev this run, 1748 entries) · exploited in the wild: no public evidence (SOC Prime, pwn.ai) · fixed: 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57, 7.2.11, mainline 7.3-rc7 (SOC Prime/IT-Connect; distro kernels backport, so check the vendor advisory); Debian bookworm 6.1.190-1, trixie 6.12.113-1 (DSA-6568-1), sid 7.2.11-1 per the tracker; Ubuntu: no release shows a fix on the page fetched 2026-10-20 (last updated 2026-10-15; statuses Needs evaluation / Not in release / Ignored); Red Hat, SUSE not checked · type: untrusted metadata trust inversion / out-of-bounds read, guest-to-host · auth: none, but requires code execution inside a guest that reaches the host network path.
      PREREQUISITES: attacker code running inside a guest VM or sandbox whose traffic traverses the host IPv4 stack with guest-supplied checksum-offload metadata (virtio-net style). Not remotely reachable from the internet. The researcher notes TUN and AF_PACKET scenarios without a VM were also discussed during upstream review.
      EXPOSURE: Linux hosts that run guests with untrusted code. The fix must be on the HOST kernel and the host rebooted into it; patching guest kernels does not help. Verify the running kernel on every hypervisor or sandbox host, because distributions backport fixes without matching the upstream version numbers (SOC Prime).
      DETECTION (concept, from the stated mechanism): unexplained host kernel crashes correlated with guest network activity; on guest-facing virtual interfaces, IPv4 packets or fragments carrying IP options (header length 60 bytes) from guests whose logical payload is tiny. The write-up gives the mechanism, not a detection recipe, so treat the packet-level hunt as an inference. If escape is suspected, treat the host, not just the guest, as compromised and review co-resident workloads and host secrets (SOC Prime guidance).
      HARDENING: patch the host kernel; Vercel's own mitigations were Firecracker jailer restrictions, disabled nested virtualisation and limited host permissions per microVM, which reduce blast radius but do not fix the bug (Vercel recap, SOC Prime).
      DEFENDER TAKEAWAY: public-sector operators of Linux virtualisation or code-execution sandboxes should treat this as a patch-the-host-and-reboot item inside the researcher's stated weeks-to-a-month exploit horizon; organisations on VMware, Hyper-V or Nutanix are not described as affected by any source (not checked).
      The pwn.ai page carries the date 2026-10-20 in its metadata while CSO Online quoted the post on 2026-10-16, so the post was live by the 16th; the date shown is the page metadata, not necessarily first publication. pwn.ai promises a Part 2 on the allocator-sensitive host-write chain.
    borderline: false

