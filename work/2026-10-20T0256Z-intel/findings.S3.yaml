      - { url: "https://www.it-connect.tech/pwnescape-linux-flaw-lets-attackers-escape-a-kvm-vm/", publisher: "IT-Connect", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: socprime, URL https://socprime.com/blog/cve-2026-99999-analysis/ (feed https://socprime.com/blog/feed/ item 2026-10-16) → WebSearch ('PwnEscape pwn.ai Paulos Yibelo Vercel Sandbox Linux kernel skb_checksum_help guest-to-host') → pivot: CSO Online, URL https://www.csoonline.com/article/4236460/linux-kernel-gets-a-fix-for-a-flaw-that-enabled-attackers-to-escape-vms.html → pivot: IT-Connect, URL https://www.it-connect.tech/pwnescape-linux-flaw-lets-attackers-escape-a-kvm-vm/ (surfaced the researcher post link) → primary: https://pwn.ai/blog/pwnescape → Vercel recap https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge → distro status https://security-tracker.debian.org/tracker/CVE-2026-99999 and https://ubuntu.com/security/CVE-2026-99999; KEV catalogue checked via bridge cisa-kev this run (no entry); EPSS via https://api.first.org/data/v1/epss?cve=CVE-2026-99999 (API data, not cited)"
    summary: |
      Paulos Yibelo of pwn.ai found, during Vercel's August 2026 sandbox challenge, that guest-controlled checksum-offload metadata (the pending-checksum state with csum_start and csum_offset) lets a deferred checksum completion write into an IPv4 header the host stack has already parsed. In the research geometry the first header byte changes from 0x45 to 0x4f, so the later fragmentation code treats a 20-byte header as 60 bytes and copies 32 bytes of host memory into the outgoing packet as IP options; the leak repeats for as long as the guest sends packets. The bug is in the Linux networking stack (ip_do_fragment and skb_checksum_help consumers), not in KVM or any hypervisor, and the researcher says it exposes a broader class of "deferred-metadata trust inversion". Demonstrated impact differs by stage: the memory leak ran against Vercel's production sandboxes; a host crash and host-root command execution were shown only on the researcher's own KVM and Firecracker machines configured like Vercel's (selected 64-byte kernel writes, four cold boots), and Vercel reports no access to customer data. The upstream fix, commit 6785011f8b16 "ipv4: validate checksum_start before completing checksum" by Michael S. Tsirkin (Red Hat), reached net.git on 2026-10-08 and mainline on 2026-10-14; its commit message calls it defence in depth and says a more complete validation at input is forthcoming, and the kernel text says others have since reproduced the issue independently. SOC Prime and IT-Connect list first fixed stable releases 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57 and 7.2.11; the Debian tracker confirms bookworm 6.1.190-1 and trixie 6.12.113-1 (DSA-6568-1) fixed, while the Ubuntu page fetched this run shows no release with a fix (statuses are only "Needs evaluation", "Not in release" or "Ignored") and carries the CVSS 3.1 base score 9.3 (vector AV:L/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H). The researcher states that exploits "in weaker configurations" should arrive in weeks and exploits against default hypervisor configurations in under a month. No exploitation in the wild is reported and the CVE is not in the CISA KEV catalogue as fetched this run.
    region_nexus: "global; Linux-based virtualisation hosts and sandboxes anywhere"
    primary_sector_nexus: "indirect: relevant to public-sector operators of Linux KVM, Firecracker or similar hosts that run untrusted or multi-tenant workloads (private clouds, CI runners, malware sandboxes, AI-agent code sandboxes); a local, guest-to-host primitive, not remotely reachable from the internet"
    sector: "cross-sector (virtualisation / cloud infrastructure)"
    cves: [CVE-2026-99999]
    techniques: [T1611]
    affected_products:
