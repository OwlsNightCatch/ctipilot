    discovery_trace: "first seen at: securityaffairs, URL https://securityaffairs.com/ (listing) and feed https://securityaffairs.com/feed (item 'Broadcom Wi-Fi Bug' 2026-10-19) → drilled https://securityaffairs.com/201268/iot/16-year-old-broadcom-wi-fi-bug-lets-attackers-take-over-routers-without-a-password.html → primary: researcher blog https://quentinkaiser.be/security/2026/10/16/one-parser-two-bugs/ → https://qkaiser.github.io/broadcom-wps/ (affected-device list, FAQ) → https://github.com/qkaiser/broadcom-wps (YARA and fingerprinting toolkit README) → corroboration: https://thehackernews.com/2026/10/unpatched-broadcom-wi-fi-flaw-lets.html and https://www.techzine.eu/news/security/145085/broadcom-wpsplinter-vulnerability-leaves-millions-of-belgian-routers-vulnerable/ (found via WebSearch 'Broadcom WPS flaw routers eCos no CVE Kaiser Hexacon')"
    summary: |
      Researcher Quentin Kaiser disclosed on 2026-10-16 (Hexacon, Paris; blog, a public documentation page named "WPSplinter" and a GitHub toolkit) a memory-corruption flaw in Broadcom's proprietary Wi-Fi Protected Setup code, the legacy "WPS Monitor" that reassembles fragmented EAP-WPS messages. The reassembled fragments are not constrained to the destination buffer, and the parser is reachable over the air before association, without the network key and without completing WPS enrollment. Kaiser reports controlled memory disclosure and arbitrary code execution: on an Orange Belgium ASKEY TCG3000 his shellcode read the Wi-Fi pre-shared key from NVRAM and sent it back in 802.11 frames, and on a Proximus Sagemcom-built BBOX3V+ he opened a reverse shell carried in 802.11 frames, so no outbound C2 connection exists to observe. He dates the code to at least 2010, says Broadcom shipped an incomplete patch in 2018 and then recommended moving to hostapd, and says Broadcom refused to assign a CVE (CERT/CC closed its case the same day because Broadcom is its own CNA). eCos-based platforms (BCM3380, BCM3383, BCM33834) therefore have no fix path; Linux-based platforms (BCM3390, BCM65xx, BCM68xx) are fixed only if the device maker switches to hostapd. As of 2026-10-15 none of the tested Belgian gateways had received a patch. His published, explicitly non-exhaustive affected-device list mixes confirmed and "verify firmware" entries and includes Cisco small-business routers and access points (RV110W, RV130W, RV215W, RV340W, WAP121, WAP125, WAP150, WAP361, WAP371, WAP571, WAP571E, WAP581), Netgear CG3100 and CG3700B, Sagemcom F@ST models, Askey TCG3000, Technicolor TC7210 and CGA4233, Nokia G-140W and G-240W series, ZTE F680 and 368N, TP-Link, Zyxel VMG3312, NetComm, Huawei B-series, ARRIS, Arcadyan and others. Kaiser reports no real-world attacks using the flaw (relayed by The Hacker News); the exploits shown are his own and have not been independently reproduced in public. Kaiser frames the class as suited to over-the-air "nearest neighbour" and hotel-network style attacks against devices defenders cannot see into.
    region_nexus: "global; demonstrated only on Belgian ISP gateways, no Swiss operator or Swiss device is named in any source. The device list includes vendor families (Cisco small-business, Netgear, Zyxel, TP-Link, Nokia, ZTE) that Swiss offices may run; Swiss exposure is unverified"
    primary_sector_nexus: "indirect: Wi-Fi access points, branch and home-office gateways and ISP-supplied routers at communal and cantonal sites; a proximity attack, so public-facing offices, hotels used by officials and shared buildings are the relevant exposure"
