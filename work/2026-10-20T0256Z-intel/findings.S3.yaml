  - title: "PwnEscape (CVE-2026-99999): guest-controlled checksum metadata makes the Linux host IPv4 stack rewrite an already-validated header, leaking host memory and, in the researcher's lab, escaping a KVM and Firecracker guest"
    sources:
      - { url: "https://pwn.ai/blog/pwnescape", publisher: "pwn.ai (Paulos Yibelo)", date: "2026-10-20", role: "primary" }
      - { url: "https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge", publisher: "Vercel", date: "2026-10-14", role: "primary" }
