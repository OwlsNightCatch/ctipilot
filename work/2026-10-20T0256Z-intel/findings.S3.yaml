        attribution: "Microsoft Threat Intelligence and Digital Crimes Unit"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/"
      - quote: "Microsoft assesses that the ecosystem is not limited to the abuse of Microsoft services and extends to other providers."
        attribution: "Microsoft Threat Intelligence and Digital Crimes Unit"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/"
      - quote: "Resecurity gained access to Iron Man’s infrastructure and found 2,360 phishing templates impersonating banks, retailers, healthcare providers, transportation authorities, police departments and government agencies across 130 countries."
        attribution: "Resecurity"
        source_url: "https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem"
    extended_notes: |
      WHY THE SINGLE ITEM IS BORDERLINE: no Swiss nexus is stated, the primary (2026-10-14) sits about a day outside this record's 121 h lookback (SANS NewsBites #77 of 2026-10-16 and PhishEye's 2026-10-18 update are inside it), and no entry in the store covers it (prior_coverage grep for CoGUI, YAM Store, Iron Man: none). It carries named clusters and tenant-takeover mechanics a public-sector Microsoft 365 owner can act on, which is why it is returned for the main agent's decision; drop it if the day is crowded.
      EXPOSURE (inference marked): any organisation whose Microsoft 365 or Google tenant has an application client secret that leaked can be taken over without a user session, because the actor uses an application-only flow. Education and non-profit tenant types are the ones YAM Store sells; the sources do not name Swiss schools. Separately, Swiss recipients may receive lures from kits that ship government, police and traffic-fee templates; no source documents Swiss templates.
      DETECTION (from Microsoft's description, telemetry class first): Entra audit and sign-in logs for application-only authentication using an existing application secret followed by silent password resets, licence assignment, and role or permission grants; creation of the PnP Management Shell service principal in a tenant that never used it, with Graph consent that includes AppCatalog.ReadWrite.All and full SharePoint control; unusual bulk uploads and external sharing in SharePoint and OneDrive from a Global Administrator context. Inbound: links to legitimate-looking Microsoft or Google tenant domains hosting phishing pages, geofenced and CAPTCHA-gated, so sandboxes often see nothing. Microsoft lists Entra ID Protection, Defender for Office 365 and Defender XDR alert names but no hunt queries.
      HARDENING (Microsoft): phishing-resistant MFA through Conditional Access for privileged accounts, lock down Global Administrator assignment, restrict MFA and passkey registration to trusted locations and devices, Safe Links applied to internal recipients, network protection, and sign-in prompts that name the application (relevant to device-code phishing). Rotate application client secrets that may have leaked.
      TRIAGE (honest limit, inference): the lure red flags Microsoft lists (urgency, official branding, payment demand for a toll or fine) are generic; a SharePoint or OneDrive link is not itself malicious, so the discriminator would be a link to a tenant the recipient has no relationship with combined with a payment or credential demand.
      Related: the 2026-10-19 entry on ICS calendar-invite phishing and EvilTokens device-code kits covers a different downstream tool; Microsoft says some Storm-2990 customers used device-code phishing too. Suggested Admiralty: reliability A (Microsoft for its own telemetry) with credibility 2 on attribution to Chinese-speaking developers (Microsoft's assessment, partly corroborated by Resecurity infiltration of the seller community), credibility 1 on the existence of the ecosystem and disruption.
