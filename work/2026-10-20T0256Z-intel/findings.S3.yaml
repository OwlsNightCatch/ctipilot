        attribution: "WPSplinter documentation page (Quentin Kaiser)"
        source_url: "https://qkaiser.github.io/broadcom-wps/"
      - quote: "No CVE has been assigned to the flaw, and no fix has been deployed to the affected routers, Kaiser says."
