    extended_notes: |
      SOURCING: all technical claims trace to one first-hand author (blog, documentation page, toolkit and slides are the same researcher); The Hacker News, Techzine and Security Affairs rewrite him and add no independent observation. No vendor or ISP statement exists yet and the working exploits have not been independently reproduced in public. Reliability B (named researcher with prior cable-modem work), credibility 2. Suggested priority notable, not critical.
      CONTRADICTION TO SURFACE: Techzine says users can disable WPS in the modem settings; the researcher's own FAQ says not to assume that removes the parser, and The Hacker News says Kaiser points to no setting that blocks the attack. Treat WPS-off as unproven.
      EXPOSURE: any Wi-Fi AP, router or gateway whose firmware contains Broadcom's legacy WPS Monitor (chip families BCM3380, BCM3383, BCM33834, BCM3390, BCM65xx, BCM68xx), reachable within radio range. A chipset match alone does not prove a given firmware is vulnerable. The toolkit says an AP that does not advertise WPS is not affected. Read the model against the researcher's list, run the published YARA rules over extracted firmware, or run the over-the-air fingerprinting script, which looks for Broadcom proprietary information elements and sends a zero-length fragmented EAP-WPS frame (wps_monitor answers NACK, hostapd answers ACK); it needs a monitor-mode adapter with a suitable driver. Both are triage aids, not confirmations.
      DETECTION (concept, from the stated mechanism): the parser is reached before authentication, so AP association and authentication logs will not show the attack, and the shell the researcher demonstrates rides on 802.11 frames, so egress or DNS telemetry will show no C2. The practical levers are wireless IDS / controller telemetry for unknown stations sending EAP-WPS fragments to the AP, and unexpected AP crashes or reboots. The researcher publishes no network signature. Post-compromise: his proof reads the stored Wi-Fi key from the device and replays it, so a device that may have been exploited should be treated as having leaked its pre-shared key, and that key rotated after the device is replaced or isolated.
      HARDENING: no vendor patch exists for eCos platforms; replacement is the practical option (The Hacker News). For Linux-based devices ask the device maker or ISP in writing whether the firmware moves WPS to hostapd, then verify with the toolkit. Because no CVE exists, CVE-driven vulnerability management will not flag this: it has to be an inventory match.
      DEFENDER TAKEAWAY: a pre-auth, over-the-air code-execution class across ISP gateways and small-business access points with no CVE and no patch is invisible to scanners keyed on CVE ids; match the asset inventory against the researcher's list.
      Related technique context: the researcher cites Volexity's "nearest neighbour" Wi-Fi technique (https://www.volexity.com/blog/2024/11/22/the-nearest-neighbor-attack-how-a-russian-apt-weaponized-nearby-wi-fi-networks-for-covert-access/, not fetched by this agent) and a Microsoft hotel-network report as the attacker use cases; not independently checked here.
    borderline: true
