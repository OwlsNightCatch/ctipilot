  # 4. Microsoft YAM Store / Storm-2990
  # ---------------------------------------------------------------------------
  - title: "Microsoft: Storm-3119 (YAM Store) resells hijacked and fraudulently created Microsoft 365 and Google tenants to operators of the Storm-2990 phishing kits (CoGUI, Haozi, Iron Man System), and the Digital Crimes Unit disrupts the ecosystem"
