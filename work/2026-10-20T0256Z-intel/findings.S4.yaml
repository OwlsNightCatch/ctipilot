  discovery_trace: 'first seen at: bleepingcomputer, feed URL https://www.bleepingcomputer.com/feed/ (item of 2026-10-19 21:24 UTC) -> extract of https://www.bleepingcomputer.com/news/security/wordpress-seo-plugin-rank-math-compromised-to-backdoor-websites/ -> vendor advisory re-read, URL https://rankmath.com/kb/pro-3-0-123-security-incident/ (still dated 2026-10-16, no later revision text) -> Wordfence post https://www.wordfence.com/blog/2026/10/rank-math-seo-pro-3-0-123-malware/ re-read (no new facts)'
  summary: |
    BleepingComputer (2026-10-19) reports that while researching the Rank Math PRO 3.0.123 incident it found a PHP sample on VirusTotal that carries the same indicators Rank Math published (the XOR key, the database-entry name, the cron marker and the administrator-account creation pattern). BleepingComputer's reading is that the file appears to be a first-stage deployment script that creates the 'class-wp-cache-util.php' backdoor named in Rank Math's advisory, and that it can execute commands, modify WordPress databases and steal AWS, Cloudflare, Google Cloud and Azure credentials, SSH keys and other sensitive data; BleepingComputer states it could not confirm whether the sample was distributed through the compromised plugin. The outlet also reports that Rank Math had not answered its questions about the number of potentially affected sites and the initial attack vector by publication time. The vendor advisory itself (2026-10-16) is unchanged in substance: affected downloads between 2026-10-15 20:02 UTC and 2026-10-16 07:12 UTC, clean version 3.0.124, deactivating or updating after compromise does not remove the malware, and credentials the web server can reach should be rotated.
    The cloud-credential and SSH-key theft capability is BleepingComputer's analysis of a sample of unconfirmed provenance, not a vendor-confirmed behaviour of the plugin build; the covered entry (published 2026-10-18) carries no cloud-credential statement.
