- title: 'OVHcloud CLI: release binaries of already-published versions replaced on 2026-10-19 with a secret-stealing build, uploaded through a long-hijacked contributor GitHub account'
  sources:
  - url: https://github.com/ovh/ovhcloud-cli/issues/300
    publisher: GitHub (ovh/ovhcloud-cli issue 300)
    date: '2026-10-19'
    role: primary
  - url: https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool
    publisher: OpenSourceMalware
    date: '2026-10-19'
    role: primary
  - url: https://borncity.com/blog/2026/10/19/cli-von-ovhcloud-war-am-19-10-2026-kompromittiert/
    publisher: Borns IT- und Windows-Blog
    date: '2026-10-19'
    role: corroborating
  discovery_trace: 'first seen at: borncity, URL https://borncity.com/blog/2026/10/19/cli-von-ovhcloud-war-am-19-10-2026-kompromittiert/ (feed https://borncity.com/blog/feed/ item of 2026-10-19 20:47 UTC) -> pivot: GitHub repository releases page https://github.com/ovh/ovhcloud-cli/releases and issue list https://github.com/ovh/ovhcloud-cli/issues -> primary: GitHub issue, URL https://github.com/ovh/ovhcloud-cli/issues/300 -> WebSearch ("OVHcloud" CLI GitHub releases compromised credential stealer Klaba post-mortem) -> third-party forensic analysis: OpenSourceMalware, URL https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool; RuntimeWire https://runtimewire.com/article/ovhcloud-cli-compromised-secrets-october-2026 read as a further relay of the CEO''s statement (not cited; his post is on X)'
  summary: |
    OVHcloud's official command-line tool (repository ovh/ovhcloud-cli) was tampered with on 2026-10-19. A downstream user whose CI pins the SHA-256 of the Linux arm64 archive reported in a public GitHub issue (filed about 13:50 UTC per OpenSourceMalware's timeline; the repository has no private reporting channel) that the release assets of v0.13.0, v0.14.0 and v0.15.0, published weeks earlier, were replaced between about 12:47 and 13:12 UTC by an uploader account that is not a public member of the ovh organisation. The replacement binary carries Go build metadata of a plain local build of a commit from 2026-10-13 with uncommitted changes (dirty tree), without the project's release version flag; the v0.15.0 tag and the Go module proxy still point at the original commit, so builds from source were not affected. An OVHcloud maintainer replied that all binaries involved were deleted at 16:21 CEST (14:21 UTC) and that a new, immutable v0.16.0 with a signed tag was released; a post-mortem is promised 'in the coming days'.
    OVHcloud's CEO Octave Klaba, as relayed by Borncity and RuntimeWire from his post on X, says the attacker used the GitHub account of one of the developers to add a binary whose job is to extract secrets from the disk (quality mediocre but functional), lists v0.11.0 to v0.15.0 as compromised and v0.10.0 and v0.16.0 as clean, and says users who ran it should change every secret stored on the disk. The independent reporter verified v0.13.0 to v0.15.0 only; OpenSourceMalware infers from the assets left on the release pages that v0.11.0 and v0.12.0 were touched in the same pass and that the five main-platform archives plus checksums.txt were swapped on each release, while the i386, Windows arm64 and WASM builds were left alone.
    OpenSourceMalware's forensic reconstruction (its own analysis from GitHub server-side data, not OVHcloud's): no tag was pushed and no release workflow ran, the uploads came from a human contributor account via the ordinary Releases API in about 25 minutes with checksums.txt replaced last so the published hashes matched, and the same account shows scripted history-rewrite force pushes on its public personal repositories from 2026-03-05 carrying a hidden preinstall loader that OpenSourceMalware ties by shared indicators to the GlassWorm developer-targeting campaign. OpenSourceMalware states that whether the same actor did both is its inference. Nobody has analysed the October payload because OVHcloud deleted the replaced binaries before they were archived, so what the binary steals and where it sends it is the vendor's claim only.
    How the credential was taken, whether the release workflow's long-lived token was exposed, and whether any secret was actually exfiltrated are not public.
