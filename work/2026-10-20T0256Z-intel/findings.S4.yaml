- title: 'ConnectWise Cloud Backup (SkyKick) app-credential abuse: Huntress''s 2026-10-19 update bounds the attack window, finds a second tenant with scripted Global Administrator self-grant and secret planting on seemingly random apps, and warns that Graph directory reads leave no audit record'
  sources:
  - url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
    publisher: Huntress
    date: '2026-10-19'
    role: primary
  discovery_trace: 'first seen at: follow-up (2) on the covered ConnectWise entry -> re-read of the living Huntress post (entry-point URL), URL https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access (update stamped 10/19/26 1:30 PM ET) -> ConnectWise Trust Center https://www.connectwise.com/company/trust/advisories returned HTTP 403 on WebFetch, url and extract and a block on jina this run, so ConnectWise''s own latest update could not be re-read; Todyl running post https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app also re-read (no newer entry than already covered)'
  summary: |
    Huntress's update of 2026-10-19 13:30 ET (17:30 UTC) to its living ConnectWise / SkyKick post adds facts the covered entry (last updated 2026-10-19 03:47 UTC) lacks.
    (a) Attack window. Huntress says the malicious application sign-ins were tightly bunched across the morning of 2026-10-15 UTC and that the last confirmed successful sign-in with the vendor credential it observed was at 08:44 UTC that day, after which it saw only failed attempts, in the tenants where it can see sign-in logs. Reviewing application sign-ins across more than 10,000 tenants with ConnectWise applications, it found the single hosting-provider address already named and Microsoft-internal ranges as the only sources of application sign-in activity; other addresses circulating in the community sit in the same provider range and produced only failed password-spray or failed-login activity that Huntress does not believe is related.
    (b) Post-compromise behaviour. Huntress has now identified a second tenant with post-compromise activity (it was not originally a Huntress customer; Huntress saw service-principal sign-in attempts from that tenant towards protected tenants and, working with a partner, got deployed there). In both tenants the activity was fast, scripted and indiscriminate, within two minutes of each other around 03:45 UTC on 2026-10-15: the application granted itself Global Administrator, then planted a new secret on a small number of other applications registered in the tenant to keep a foothold. The choice of applications looked random: the identical flow picked completely different sets in the two tenants, one application present in both was backdoored in only one, and in one tenant the backdoored applications were among the least privileged while far more powerful ones were untouched.
    (c) Visibility limit. Huntress says the access may have been used for Microsoft Graph directory reads, which leave no audit record, and that in the two tenants it reviewed it found no evidence of mailbox or file manipulation or of user or policy changes.
    Note a timing tension inside Huntress's own reporting: its earlier text puts the first Graph token requests at 06:13 to 08:34 UTC on 2026-10-15 and recommends auditing from about 01:00 UTC on 2026-10-15 to 02:00 UTC on 2026-10-16, while this update places the role grant and secret planting around 03:45 UTC; the audit range Huntress recommended covers both.
    Unchanged and still not public: how the credential was obtained, who is behind it, and ConnectWise's restoration time (ConnectWise's own page could not be re-read this run, so any ConnectWise update after 2026-10-19 01:15 UTC is unchecked).
  region_nexus: global; any Microsoft 365 / Entra tenant (including MSP-managed customer tenants) that ever consented a ConnectWise or SkyKick app, public-sector tenants included
