  - quote: OVHcloud deleted the replaced binaries before anyone archived them, so we have not analyzed the payload
    attribution: OpenSourceMalware
    source_url: https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool
  - quote: Der Hacker hat das GitHub-Konto eines der Entwickler genutzt und Binärcode hinzugefügt, dessen Aufgabe es ist, Geheimnisse von der Festplatte zu extrahieren.
    attribution: Borns IT- und Windows-Blog
    source_url: https://borncity.com/blog/2026/10/19/cli-von-ovhcloud-war-am-19-10-2026-kompromittiert/
  extended_notes: |
    Exposure (OpenSourceMalware's reading; OVHcloud has not published channel detail): affected if between about 12:47 and 14:21 UTC on 2026-10-19 the CLI was installed or updated on macOS, Linux x86_64/arm64 or Windows x86_64 through the repository's install script, the Homebrew cask (ovh/tap/ovhcloud-cli), a direct download of a v0.11.0 to v0.15.0 release asset, or a CI job or Dockerfile fetching the release tarball; not affected: go install, builds from source, the ovhcom/ovhcloud-cli Docker image, or installs made before 12:47 UTC that were not updated. Version discrepancy to carry: the reporter verified v0.13.0 to v0.15.0, OVHcloud/Klaba list v0.11.0 to v0.15.0.
    Detection (telemetry class first): (1) software-supply-chain integrity: compare the SHA-256 of any archive fetched on 2026-10-19 with the checksums of the clean v0.16.0 release; a pinned-hash failure on a previously verified asset is how this was caught; (2) artefact inspection: `go version -m` on a retained binary shows vcs.modified=true or a +dirty pseudo-version where a release build has no vcs lines, and the version command prints a pseudo-version instead of the tag; (3) GitHub audit/release API: assets uploaded by an account other than the original publisher, weeks after publication; (4) endpoint process and file-access telemetry for any execution of the CLI on 2026-10-19 followed by reads of credential stores or unusual egress from that process; (5) on build hosts, egress to public blockchain RPC endpoints is an OpenSourceMalware hunt suggestion for the account's earlier loader. Post-compromise: rotate every secret readable on any host that ran the binary (OVHcloud's own guidance, per OpenSourceMalware: change all secrets on the disk), from a different machine, then install v0.16.0 or later.
    Triage: GoReleaser in this project is configured to replace existing artefacts, so a replaced asset alone looks like normal maintenance in audit logs (OpenSourceMalware); the discriminators are uploader identity (not the original publisher, not the release service account), the dirty-tree build metadata and the missing version tag.
    Hardening: immutable releases, signed tags and release attestations (v0.16.0 has them), verifying checksums instead of trusting install scripts (the script does not verify checksums.txt, which was swapped too), least-privilege write access on release repositories, no long-lived PAT in release workflows, alerting on force pushes to long-idle repositories.
    Suggested classification B2 (core facts corroborated by the reporter's capture, the vendor's replies and an independent forensic write-up; payload unanalysed). Pattern link for the composer: the third vendor-distribution-channel compromise in the store this week (AOMEI update channel, Rank Math PRO build, now OVHcloud CLI release assets); the roughly seven-month dwell on the hijacked contributor account is the evolved element.
  borderline: true
  borderline_reason: No Swiss-specific nexus and the constituency's OVHcloud CLI use is unknown; it clears the gate only on the evolved technique (release assets of published versions swapped through a contributor account hijacked for months, secret theft on admin workstations) and the GlassWorm overlap. Strongly sourced (reporter capture, vendor replies, independent forensics), so ship at notable if the composer agrees the developer/admin-workstation lesson earns a slot.
