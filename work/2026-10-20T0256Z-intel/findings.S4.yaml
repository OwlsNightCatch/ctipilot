  extended_notes: |
    Suggested classification: reliability B, credibility 2 (the 'gravierend' assessment rests on one confidential note seen by SonntagsBlick and relayed; the EFD statement confirms the Federal Council briefing but not its content; the NZZ facts are attributed to named organisations).
    Defender angle for the constituency (federal, cantonal and communal bodies with external software suppliers): Publica's own admission of no regular on-site audits, the PKZH case (real insured-person data handed to a supplier as migration-test data for a switch planned for 2027), and NZZ's quoted experts (a pension-fund software supplier rarely needs original data for tests; contractual audit rights; ISO 27001 as a minimum) are the transferable lessons; the Xplain recommendation that suppliers receive test data only is cited by Blick. Hunt/triage hook for staff of NDB, Defence Group and fedpol is organisational, not technical: expect targeted social engineering and travel-related exposure; the sources give no detection artefact.
