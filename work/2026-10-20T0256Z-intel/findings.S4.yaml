  discovery_trace: 'first seen at: WebSearch ("Libera AG PK Softech Cyberangriff Pensionskassen betroffen" and "PK Softech Cyberangriff Pensionskassen Publica neue Informationen Datenabfluss Darknet") while chasing follow-up (2) on the covered PK Softech entry -> pivot: NZZ, URL https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090 -> WebSearch ("Keller-Sutter Bundesrat Publica Datenabfluss Nachrichtendienst Mitarbeitende gefaehrdet PK Softech") -> primary: Blick, URL https://www.blick.ch/politik/daten-debakel-beim-bund-sicherheitsorgane-betroffen/jle39rp -> relays: 20 Minuten URL https://www.20min.ch/story/hackerangriff-fliegen-geheimagenten-auf-beim-bund-schrillen-die-alarmglocken-103651545, Nau.ch URL https://www.nau.ch/news/schweiz/nach-publica-hack-bundesagenten-konnten-im-ausland-enttarnt-werden-67190080; Publica''s own page https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten
    re-fetched, still ''Stand: 14.10.2026'''
  summary: |
    Two developments the covered PK Softech / Publica entry (last updated 2026-10-17) does not carry.

    (1) Federal assessment, as reported. SonntagsBlick (relayed by Blick, 20 Minuten, Nau.ch, watson and Tages-Anzeiger on 2026-10-18) reports from a confidential information note that Finance Minister Keller-Sutter brought to the Federal Council meeting of Wednesday 2026-10-14. According to Blick the Confederation internally expects 'erhebliche Schaeden', calls the incident 'gravierend', tells current and retired federal staff to expect longer-term effects, and names the security organs of the Confederation as particularly affected: the Federal Intelligence Service (NDB), the Defence Group of the VBS and the Federal Office of Police (fedpol). Blick further reports that the cantons were informed and that a combination of stolen record sets might allow conclusions about Switzerland's defence capability; the scenario discussed is that undercover staff could be identified by matching stolen data against entry lists and social media. The Finance Department (EFD) confirms only that the Federal Council was informed on Wednesday and that neither the Federal Council nor a department supervises Publica; Publica says it has set up a crisis staff, is still establishing which data and how many people are affected, and that the clarification can take weeks or months. 20 Minuten adds that it is not confirmed whether such data was actually stolen. The assessment is therefore one outlet's reading of one confidential document, relayed by others, not an official statement of what was taken.

    (2) Customer circle and certainty, per NZZ (2026-10-17). Libera AG, a pension-fund consultancy and administrator that NZZ says likely counts dozens of pension funds among its clients, confirmed on Friday 2026-10-16 that it also works with PK Softech (PKS) and is therefore affected; Libera's CEO says PKS first told it on 2026-10-14 that personal data had flowed out, without knowing which data, so impact on Libera-managed funds or individual insured persons can be neither confirmed nor ruled out. The Bernese Pension Fund (BPK) told NZZ that, contrary to PKS's earlier information, it must now be assumed that personal data left (earlier Bernese statements saw no indication of theft). NZZ says PKS cannot currently state which of its customers are affected, and that Publica concedes it ran no regular on-site security audits at PKS although it had old data deleted at PKS after the Xplain incident. NZZ's figure of 'weit ueber 100 000' people is a possible-exposure estimate that NZZ itself says is unconfirmed.

    Caution on one circulating number: the 111,500 insured persons that Weltwoche (2026-10-18, single weekly-magazine source citing a 'confidential report') presents as exposed equals roughly Publica's whole insured population (about 70,000 active members and 41,500 pensioners per NZZ), not a measured exfiltration count; do not carry it as a theft figure.

    Still not public: access vector, actor, ransom demand, which fields left, and whose records. Police describe the incident as ransomware (already in the entry); PK Softech itself speaks of malware.
