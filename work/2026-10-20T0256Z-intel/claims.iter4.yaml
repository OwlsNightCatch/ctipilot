    text: "OVHcloud's founder says a hacker used the GitHub account of one of its developers to add to the official command-line tool's releases a binary whose job is to retrieve secrets from the disk, that versions v0.11.0 to v0.15.0 are compromised, and that v0.10.0 and v0.16.0 are clean ("
    urls: ["https://x.com/olesovhcom/status/2112225308589834260"]
  - claim_id: 86f074ce67
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "A user whose CI pins a SHA-256 reported on GitHub that the assets of v0.13.0 to v0.15.0 were replaced between about 12:47 and 13:12 UTC, weeks after publication, by an uploader who is not a public member of the ovh organisation, with a local build of a later commit that has uncommitted changes and no release version flag, while the v0.15.0 tag and the Go module proxy still point at the original commit ("
    urls: ["https://github.com/ovh/ovhcloud-cli/issues/300"]
  - claim_id: da107b3db6
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "An OVHcloud maintainer replied that all the binaries involved were deleted at 16:21 (GMT+2) and that v0.16.0, with a signed tag, is an immutable release ("
    urls: ["https://github.com/ovh/ovhcloud-cli/issues/300"]
  - claim_id: 71e64d0295
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "OpenSourceMalware, working from GitHub's server-side records, says no tag was pushed and no release workflow ran, ties the same account's earlier force-pushes carrying a hidden loader (from 2026-03-05) to the GlassWorm campaign while saying that whether the same actor did both is its inference, notes that the project's release tooling replaces existing assets as normal behaviour, and says it has not analysed the payload because the files were deleted before anyone archived them ("
    urls: ["https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool"]
  - claim_id: b70869c965
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "**Exposure:** OpenSourceMalware reads the exposure as an install or update between 12:47 and 14:21 UTC on 2026-10-19 on macOS, Linux (x86_64, arm64) or Windows (x86_64) through the install script, the Homebrew cask, a direct download of a v0.11.0 to v0.15.0 asset or a CI step that fetches the release tarball; go install, builds from source and the vendor's Docker image were not affected ("
    urls: ["https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool"]
  - claim_id: e4b66f79e2
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "**Detection:** an archive whose SHA-256 differs from the original release's for an unchanged version number, which is how the reporter caught it; release-API records of weeks-old assets replaced by an uploader who is not the original publisher; and, on a retained binary, build metadata showing a modified working tree and no release version ("
    urls: ["https://github.com/ovh/ovhcloud-cli/issues/300"]
  - claim_id: 23e6f73750
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "Deleting the binary does not undo a run: OVHcloud says to change all the secrets on the disk ("
    urls: ["https://x.com/olesovhcom/status/2112225308589834260"]
  - claim_id: 054784944a
    entry: 2026-10-20/ovhcloud-cli-release-assets-replaced-secret-stealing-build
    surface: "body"
    kind: cited
    text: "**Triage:** a replaced asset alone is not proof, since the project's release tooling replaces assets routinely; the discriminators are an uploader who is not the original publisher, a modified-tree build without the release version, and a digest that changed without a version bump ("
    urls: ["https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool", "https://github.com/ovh/ovhcloud-cli/issues/300"]
