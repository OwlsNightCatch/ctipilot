    surface: "body"
    kind: cited
    text: "Siemens ProductCERT says it has validated active exploitation of CVE-2026-110936, an uncontrolled-search-path (DLL side-loading) flaw in Siemens Software Center that Siemens fixed in version 4.0.9.8 and described in advisory SSA-580366 of 2026-10-15 ("
    urls: ["https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/"]
