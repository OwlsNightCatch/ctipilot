    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update Software Center to V4.0.9.8 or later wherever it is installed, and hunt for the execution pattern above on every Windows endpoint, since the carrier is delivered with the lure and patching an installed copy does not stop it; the same hunt covers the other signed applications Huntress describes, and the lever at the front of the chain is the paste step into the Run box or PowerShell ("
    urls: ["https://productcert.siemens.com/news/2026/10/19/active-exploitation-of-cve-2026-110936-in-siemens-software-center/", "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
