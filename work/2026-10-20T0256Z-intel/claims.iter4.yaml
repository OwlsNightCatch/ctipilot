    surface: "section 2026-10-20T03:40:32Z"
    kind: cited
    text: "The root execution therefore came through the log-poisoning flaw and the crash handler, with this flaw supplying the reboot, and Rapid7 reports persistence, internal reconnaissance and exfiltration of the appliance configuration after it; the full account is in the CVE-2026-88771 analysis ("
    urls: ["https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/"]
  - claim_id: 3f3bbb603b
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "record 2026-10-20T03:40:32Z"
    kind: record-summary
    text: "Rapid7's incident analysis shows CVE-2026-88779 used as the crash and reboot trigger of a root-execution chain with CVE-2026-88771 on an affected 14.1 NetScaler, with the call-home crash handler running the attacker's payload as root after the reboot; repeated crashes on an appliance not yet patched for CVE-2026-88771 now call for a compromise check."
