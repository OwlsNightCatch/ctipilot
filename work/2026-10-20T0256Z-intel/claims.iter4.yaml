    surface: "body"
    kind: cited
    text: "The advisory scores it CVSS 4.0 8.4 (6.7 on CVSS 3.1, with a local vector and high privileges required) and lists every version before V4.0.9.8 as affected ("
    urls: ["https://cert-portal.siemens.com/productcert/html/ssa-580366.html"]
