    surface: "cves[CVE-2026-110936]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-110936\", \"cvss\": \"8.4 (CVSS 4.0; 6.7 on CVSS 3.1)\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"all versions before V4.0.9.8\", \"fixed\": \"V4.0.9.8 (installed copies update automatically the next time the application starts)\", \"auth\": \"admin-required\", \"vector\": \"local\"}"
  - claim_id: e9451e7435
