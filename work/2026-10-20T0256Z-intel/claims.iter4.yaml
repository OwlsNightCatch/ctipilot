  - claim_id: 880b0a3e34
    entry: 2026-10-20/cve-2026-110936-siemens-software-center-clickfix-sideload
    surface: "summary"
    kind: frontmatter
    text: "Siemens ProductCERT says it validated active exploitation of CVE-2026-110936, a DLL side-loading flaw in Siemens Software Center versions before V4.0.9.8, which it fixed in advisory SSA-580366 of 2026-10-15; installed copies update themselves the next time the application starts. The attackers did not abuse an installed copy: they delivered a genuine, validly signed copy of version 3.5.8.7 with their own files beside it through what Siemens calls the Romulus multi-platform ClickFix campaign, so the check that finds it is behaviour on any Windows PC, not a Software Center inventory."
  - claim_id: d42dd9b568
