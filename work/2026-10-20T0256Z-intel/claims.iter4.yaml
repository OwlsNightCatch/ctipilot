claims:
  - claim_id: 785434a12e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Citrix's CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772 (memory overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were exploited before any fix existed; CISA added both to KEV and Citrix lists no workaround. Mandiant, GTIG, Unit 42, Zscaler and Rapid7 describe the compromises: web-server-configuration persistence, web shells, and in one intrusion the SAML crash CVE-2026-88779 chained with CVE-2026-88771 so that the crash handler ran the payload as root, followed by exfiltration of the appliance configuration and key material. An appliance patched after the bulletin therefore still needs a compromise check and its configuration secrets rotated. SAML-configured appliances need the later builds named for CVE-2026-88779 (14.1-73.41 or 13.1-64.28) and identity providers 14.1-73.46 or 13.1-64.29 for CVE-2026-107406; CVE-2026-88773 has a public proof of concept with no exploitation seen."
  - claim_id: 461650bb8d
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every internet-facing NetScaler ADC/Gateway to 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+) or 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+) now (a SAML-configured appliance needs the later builds named for CVE-2026-88779, and an identity provider 14.1-73.46 or 13.1-64.29); on a 13.1-branch appliance run `show ns variable` first; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop. Capture logs, an instance snapshot where the appliance is virtual, a support bundle and a core dump from each exposed appliance BEFORE patching, since the upgrade can remove forensic evidence of prior exploitation."
  - claim_id: fb79984736
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Run Mandiant's compromise checks, extended by the Unit 42 artifacts described in the update below, Zscaler's (appliance-initiated downloads to unfamiliar addresses, an unexpected executable under /var, a Perl CGI handler added to the web server configuration) and Rapid7's (the setuid bit on /bin/sh, nsaaad crashes followed by Pitboss reboots, an outbound agent polling an external endpoint every 15 seconds), on every NetScaler that was internet-facing and unpatched at any time since early September, patched or not; isolate any hit, check both nodes of an HA pair, halt HA configuration sync until both nodes are validated, and rotate the LDAP and RADIUS bind credentials, SSL private keys and key-encryption material held in the configuration, since Rapid7 saw the configuration and backups staged and exfiltrated."
  - claim_id: 5e4c8a48ee
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[2]"
    kind: frontmatter
    text: "Find any NetScaler ADC or Gateway still on the end-of-life 12.1 or 13.0 branches and decide isolation or replacement now: they receive no security updates and Citrix has not said whether they are affected."
