    text: "After the first root execution the operator installed cookie-authenticated PHP web shells behind Apache aliases that look like CSS files and answer with HTTP 404 bodies, set /bin/sh to mode 6555, and kept access through cron entries, boot scripts, watchdog loops, an outbound agent that polls every 15 seconds and an HTTP-fronted TCP proxy, with logic that synchronises implant files to the HA peer and forces a failover so the implanted node stays active ("
