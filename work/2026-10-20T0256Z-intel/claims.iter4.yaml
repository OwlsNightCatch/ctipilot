    text: "Confirm that every vulnerability scanner, SIEM enrichment rule and ticket keyed on CVE-2026-21589 reports each affected Atlassian instance as open again; where a feed dropped the ID while the record was rejected between 2026-10-16 and 2026-10-19, re-run it so no exploited instance stays reported as closed."
