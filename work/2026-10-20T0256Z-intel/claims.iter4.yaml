    text: "Fixed builds are 14.1-73.37, 13.1-64.23, 14.1-73.37 FIPS and 13.1-37.279 (FIPS/NDcPP); watchTowr flags an upgrade caveat on the 13.1 branch: run `show ns variable` first, and if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop during the upgrade."
