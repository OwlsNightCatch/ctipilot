    surface: "body"
    kind: cited
    text: "Do not read the denial-of-service scoring as a reason to wait: crashes are reported on appliances already on the September builds, code execution through this flaw alone is unconfirmed, and Rapid7 saw the crash used as the reboot trigger of a root-execution chain together with CVE-2026-88771, so repeated crashes on an appliance not yet patched for that flaw warrant its compromise checks ("
    urls: ["https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/"]
  - claim_id: 2589988e41
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every SAML-configured NetScaler as exposed even if it is already on the September fixed builds: upgrade to the .41 and .28 builds or the FIPS builds, move identity-provider appliances on to 14.1-73.46, 13.1-64.29 or the FIPS builds that close CVE-2026-107406, and use the Global Deny List signatures only as a bridge for this flaw."
  - claim_id: 4bb2f66e6f
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "section 2026-10-20T03:40:32Z"
    kind: cited
    text: "Rapid7's incident analysis of an early-October compromise of a NetScaler ADC on an affected 14.1 build shows CVE-2026-88779 used as the crash and reboot condition in a two-flaw sequence with CVE-2026-88771, the pre-authentication log-poisoning flaw that supplies attacker-controlled command text: repeated nsaaad crashes and a Pitboss reboot followed text inserted into an authentication username, and after the reboot the call-home crash handler processed the retained text and executed a payload as root ("
    urls: ["https://www.rapid7.com/blog/post/ra-netscaler-intrusions-chaining-cve-2026-88771-and-cve-2026-88779/"]
  - claim_id: 19a827f47d
