    entry: 2026-10-20/cve-2026-110936-siemens-software-center-clickfix-sideload
    surface: "body"
    kind: cited
    text: "The attackers did not rely on a copy already on the victim's PC: they used a genuine, validly signed copy of Software Center and placed their own files next to it, chosen as a carrier because it is signed and trusted and because version 3.5.8.7, the latest at the time, loaded helper files from its own folder without checking them; the Siemens program itself was not modified, and Siemens says no Siemens system, product or update channel was breached to its knowledge ("
