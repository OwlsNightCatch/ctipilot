    surface: "body"
    kind: cited
    text: "**Exposure:** any Windows PC whose user pasted a command from a web page into the Run box or PowerShell, whether or not Siemens software is installed there, because the attackers bring their own copy; installed Software Center versions before V4.0.9.8 are affected as well until the application starts and updates itself ("
