  - claim_id: 6d282d0af6
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "headline"
    kind: frontmatter
    text: "BACS grades logins in five classes: static secrets should in principle go; session binding resists phishing"
  - claim_id: e6e5b0ded9
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "summary"
    kind: frontmatter
    text: "Switzerland's Federal Office for Cybersecurity (BACS) published on 2026-10-19 a technology assessment that sorts authentication methods, tokens and services into the classes tief, mittel and hoch, with a star on mittel and hoch for resistance to real-time phishing. It says methods in class tief, those built on a secret that is the same at every login, should in principle no longer be used. The classification is non-binding and gives no basis for testing or certification; it is a rough guideline from the federal authority for writing authentication requirements."
  - claim_id: 17ae5304f8
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "BACS published on 2026-10-19 the technology assessment \"Sicherheitsklassen für Authentifikationsverfahren, -mittel und -dienste\", which sorts authentication methods, tokens and services into the three classes tief (low), mittel (medium) and hoch (high), with mittel and hoch each split further, five classes in all ("
    urls: ["https://www.bacs.admin.ch/de/26-tb-authentifizierung-de"]
  - claim_id: 7df96afee8
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "The scheme follows the NIST authentication assurance levels 1 to 3 with slight adjustments and extends them for resistance to real-time phishing; BACS says the classification gives no basis for formal testing or certification and can serve organisations as a basis for security requirements and recommendations ("
    urls: ["https://www.bacs.admin.ch/de/26-tb-authentifizierung-de"]
  - claim_id: 285062d9e2
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "In the assessment, class tief covers any method whose authentication information is static and identical at every login, such as a password or a cryptographic key, and the class does not rise when the secret travels over TLS; BACS concludes that methods in this class should in principle no longer be used ("
    urls: ["https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf"]
  - claim_id: 7a37dbbcb2
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "Class mittel needs authentication information generated anew for each login plus at least one further security feature, and the starred variant additionally needs session binding, which ties the session cryptographically to the authentication information or to the device, network or application; the assessment names TLS channel binding, Device Bound Session Credentials and OAuth DPoP as examples, against session hijacking, real-time phishing and adversary-in-the-middle attacks ("
    urls: ["https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf"]
  - claim_id: 87b2073daf
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "BACS says the difference between mittel and hoch lies mainly in the use of additional hardware to store the cryptographic keys ("
    urls: ["https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf"]
  - claim_id: 5c624043e8
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "Its annex of examples places a password, a static API key and a secret held in a cookie such as a session ID in tief; a password with an SMS code, a software authenticator app, Kerberos tickets, bearer tokens (SAML, OIDC, OAuth, JWT) and synced passkeys in mittel, the passkeys starred; and hardware OTP tokens, hardware certificates in TLS and FIDO2 without synchronisation or key export in hoch, with a footnote that SMS verification should be used only where no better alternative exists ("
    urls: ["https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf"]
  - claim_id: 647ab24ff6
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: cited
    text: "A login that rests on a static secret is class tief, which BACS says should in principle no longer be used, and a login resists real-time phishing and session hijacking only where it is session-bound (the starred classes) ("
    urls: ["https://www.bacs.admin.ch/dam/de/sd-web/vSjpggXgBK2W/Technologiebetrachtung_Authentifikationsverfahren_DE.pdf"]
  - claim_id: 99527e969f
    entry: 2026-10-20/bacs-authentication-security-classes-technology-assessment
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the classification binds no one and sets no deadline; it is a rough guideline (BACS's own term) that cantonal and communal bodies can use when writing authentication requirements."
  - claim_id: c5d93ad033
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "headline"
    kind: frontmatter
    text: "Three configuration-dependent NGINX heap flaws (CVSS 9.2) are fixed in 1.30.6 and 1.31.7; Debian stable is not yet"
  - claim_id: 5427edaf49
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "summary"
    kind: frontmatter
    text: "The nginx 1.30.6 (stable) and 1.31.7 (mainline) releases of 2026-10-14 fix five security flaws, three of them heap-corruption bugs that F5 scores CVSS 4.0 9.2 and an unauthenticated attacker can reach with crafted HTTP requests, but only on configurations that combine alias with rewrite and $request_filename, use a regex map whose captures are referenced before its output variable, or enable asynchronous file I/O with server-side includes; the other two concern HTTP/3 and TLS session ticket key rotation. F5 says the heap flaws restart the worker, with code execution only where ASLR is disabled or bypassed; no exploitation or public proof of concept is reported, nginx.org rates all five medium, and Debian's bookworm and trixie packages are still marked vulnerable."
  - claim_id: 70f5d665fc
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "actions[0]"
    kind: frontmatter
    text: "Run nginx -T on every internet-facing NGINX reverse proxy, load balancer and ingress and upgrade each one whose configuration uses alias with rewrite and $request_filename, a regex map whose captures are referenced before its output variable, or aio together with ssi, HTTP/3 or TLS session ticket key rotation to nginx 1.30.6 or 1.31.7 (NGINX Plus 37.0.5.1 or 37.1.0.1); where the package comes from Debian bookworm or trixie, which the tracker still marks vulnerable, apply F5's configuration workaround until the distribution ships a fix."
