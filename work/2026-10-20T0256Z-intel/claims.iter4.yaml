  - claim_id: e3c16f9515
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "summary"
    kind: frontmatter
    text: "Citrix's bulletin CTX697174 fixes CVE-2026-88779, a memory overflow in NetScaler ADC and Gateway that a network attacker needing no privileges reaches when the appliance is configured as a SAML service provider or identity provider; Citrix says it has observed targeted attacks and scopes the impact to denial of service. Appliances already on the 14.1-73.37 or 13.1-64.23 builds that fixed the September zero-days remain affected and must move to 14.1-73.41, 13.1-64.28 or the FIPS builds, and identity-provider appliances then need 14.1-73.46, 13.1-64.29 or the FIPS builds, which close the further SAML flaw CVE-2026-107406 that Citrix disclosed on 2026-10-08. Reports of code execution on patched honeypots are unconfirmed, and CISA added the flaw to its KEV catalog on 2026-10-04. Rapid7's incident analysis of 2026-10-19 shows the crash used as the reboot trigger of a root-execution chain with CVE-2026-88771 on an affected 14.1 appliance, so repeated crashes on an appliance not yet patched for that flaw call for a compromise check."
  - claim_id: 794568749c
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every SAML-configured NetScaler (`add authentication samlAction` or `add authentication samlIdPProfile`) that is still below 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS or 13.1-37.282, including appliances on the 14.1-73.37 or 13.1-64.23 builds, to at least those builds; identity providers then need the builds named for CVE-2026-107406. Where the upgrade has to wait and NetScaler Console virtual patching is available, confirm with `show appfw signatures` that the Global Deny List signature version is at least v24, which Citrix offers as a bridge for CVE-2026-88779 only."
  - claim_id: 3cc91cf1db
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "Before restarting a SAML-configured NetScaler that has crashed or rebooted repeatedly, preserve its logs and crash artifacts, open a Citrix support case, which Citrix asks for when an appliance is experiencing the impact, and search its authentication logs for shell metacharacters next to Pitboss crash-message text, because Rapid7 saw a crash-and-reboot cycle used to make the call-home crash handler run an attacker's payload as root."
