    extended_notes: |
      Exposure (how a defender reads it). Version: `nginx -v` prints the nginx version (nginx.org command-line documentation); the "Server" response header and error pages also emit it unless server_tokens is turned off (documented default: server_tokens on). Vulnerable if upstream-built nginx is 0.1.29-1.31.6 (15176), 1.30.0-1.30.5 or 1.31.2-1.31.6 (93479), or 0.8.11-1.31.6 (97205), and the configuration matches: `nginx -T` dumps the full effective configuration with includes; look for alias + rewrite + $request_filename (set/return or log_format), regex map whose captures are used in root / log_format / other string expressions, aio on|threads together with ssi on. For distro packages read the distro tracker (Debian trixie / bookworm still vulnerable at 2026-10-20 03:50 UTC). NGINX Plus: 37.0.5.1 / 37.1.0.1 fixed; R33-R36 listed affected without a fixed R-release in EUVD.
      Detection concept (telemetry class first). Process-supervision / error-log telemetry for unexpected nginx worker-process exits and respawn bursts (F5: overflow "leading to a restart"; nginx's own CHANGES describe the analogous crash class as "a segmentation fault might occur in a worker process"), correlated with the preceding unauthenticated requests in the web access log for the affected locations. That the log line reads "exited on signal 11" is general nginx behaviour and is NOT stated by the cited sources. Post-patch compromise check: a worker-memory compromise is not undone by patching (CCB quote above); look for unexpected child processes of nginx workers and for changes to web roots / config written by the nginx user (technique reasoning, not source-stated).
      Triage lookalike (not source-stated, follows from mechanism): worker exits also follow reloads, binary upgrades and OOM kills; the discriminating features are an abnormal-signal exit (SIGSEGV / SIGABRT) from a worker, a burst of them, and a matching affected-configuration pattern; a clean "gracefully shutting down" worker is the benign case.
      Open question for the main agent: F5 K000162416 / K000162607 / K000162608 could not be read on any transport this run (portal shell); if a later run gets F5's own text, re-check the workaround statements and the Plus R-release fix column.
