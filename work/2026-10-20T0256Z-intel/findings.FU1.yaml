    discovery_trace: "first seen at: main-agent hand-over, URL https://roundcube.net/news/2026/10/19/security-updates-1.6.20-and-1.7.5 -> GitHub release notes URL https://github.com/roundcube/roundcubemail/releases/tag/1.7.5 (no CVE ids) -> CERT-FR AVI-1340 URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1340/ -> NVD API keyword search (0 results 2026-10-10..21), ENISA EUVD API search (no 1.7.5 / 1.6.20 records), GitHub security-advisories page for roundcube/roundcubemail (shows none published), NCSC-NL feed (newest NCSC-2026-0438, nothing on Roundcube), BSI WID RSS (250 items 2026-10-16..20, nothing on Roundcube), GitHub repository searches for a PoC (none)"
    summary: |
      FACTS. Roundcube published security updates 1.6.20 (LTS) and 1.7.5 on 2026-10-19; the announcement says both "contain fixes for recently reported security vulnerabilities" and "strongly recommend to update all productive installations of Roundcube 1.6.x and 1.7.x". The 20 security items (identical in the announcement and the 1.7.5 release notes, each credited to a named reporter) include: IMAP command injection via CRLF in the _uid parameter of the mail/headers and mail/viewsource actions; IMAP command injection via CRLF in the _flag parameter of mail/mark; an object-injection primitive in rcube_session::unserialize() via "!"-prefixed session keys; an SSRF filter (is_local_url()) bypass via the NAT64 64:ff9b::/96 range; passing potentially unsafe attachment content into ImageMagick on image resize and an ImageMagick resource-limit bypass through the GD fallback; several mail-header injections (Bounce/resend From display-name, References/In-Reply-To/Message-ID/From, forwarded-as-attachment subject, inline-image data-URI media type); remote-content-blocking bypasses (SVG SMIL "by" attribute, CSS escapes in FuncIRI attributes), a CSS scoping bypass via at-rules, a CSRF validation bypass in mark-as-junk, XSS in password-driver error handling, a Modoboa password-driver flaw that could change another account's password, an alias-login IMAP-host qualification bug, deprecated action aliases bypassing disabled_actions, and unsafe use of a login name in the SquirrelMail import file path. The release notes carry no severity or authentication-state statement per item.
      CVE IDS / SEVERITY: none found now. NVD API keyword search "roundcube" for 2026-10-10..2026-10-21 returns zero records; EUVD search returns no record for 1.6.20 / 1.7.5; the GitHub security-advisories page of roundcube/roundcubemail lists no published advisory ("There aren't any published security advisories"). CERT-FR AVI-1340 (first and last version 2026-10-19) names no CVE and lists the risk classes remote code execution, SSRF, indirect remote code injection (XSS), CSRF and security-policy bypass, affected "versions 1.7.x antérieures à 1.7.5" and "versions antérieures 1.6.20". NCSC-NL (newest advisory NCSC-2026-0438, 2026-10-19) and the BSI WID feed (2026-10-16 to 2026-10-20) carry nothing on Roundcube.
      PoC / EXPLOITATION: none found (GitHub repository searches for Roundcube plus the issue classes or "1.7.5" / "1.6.20" return no repositories; no exploitation report located).
      OBSERVED PATTERN (from EUVD publication dates, not a prediction by any source): CVE ids for the two previous releases appeared on EUVD 8-9 days after release (1.6.17 / 1.7.2 released 2026-07-05, CVEs 2026-07-14; 1.6.18 / 1.7.3 released 2026-08-09, CVEs 2026-08-17), so ids for this release are likely to follow within about a week.
