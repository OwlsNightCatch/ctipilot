cve_dispositions:
  - { cve: "CVE-2026-97629", product: "NGINX OSS / Plus (TLS session ticket key rotation)", cvss: "8.3 (4.0, AC:L/AT:P) / 6.5 (3.1, AC:H)", disposition: "fails the pre-auth >= 9.0 bar (8.3); co-fixed by the same upgrade. Mechanism: with ssl_session_cache shared:name:size and no explicit ssl_session_ticket_key file, one rotated ticket key was left uninitialised, so an unauthenticated remote client can forge a session non-deterministically and bypass client-certificate verification (nginx.org vulnerable 1.23.2-1.31.6; nginx documentation default is ssl_session_cache none, so shared cache is opt-in). Relevant to mTLS deployments; mention inside the trio entry as a same-release fix rather than a separate item." }
  - { cve: "CVE-2026-95101", product: "NGINX OSS / Plus (HTTP/3 ngx_http_v3_module)", cvss: "6.9 (4.0) / 5.3 (3.1)", disposition: "fails the bar (6.9); an unknown HTTP/3 frame part treated as request body can bypass client_max_body_size or inject data into a proxied request when proxy_request_buffering on (F5 names it as the condition; kimmo.cloud tracker says it is the default); nginx.org vulnerable 1.25.0-1.31.6, opt-in via listen ... quic." }
  - { cve: "CVE-2026-94197", product: "NGINX Ingress Controller (ExternalAuth policy / external authentication)", cvss: "8.7 (4.0) / 7.5 (3.1)", disposition: "pre-auth network but below 9.0; unsanitised client-supplied X-Forwarded-Prefix / -URI / X-Original-URI / -Method headers reach the auth_request subrequest, letting an unauthenticated client spoof request attributes the external auth provider evaluates; fixed NIC 5.7.0 (EUVD 5.5.0 <5.7.0). Only matters where ExternalAuth is used; Kubernetes ingress operators should still read it." }
  - { cve: "CVE-2026-104939", product: "NGINX Ingress Controller (externalAuth policy)", cvss: "8.7 (4.0) / 7.5 (3.1)", disposition: "pre-auth network but below 9.0; NIC may mishandle the HTTP response from an OAuth IdP and let an attacker reach protected paths before external authentication completes; fixed NIC 5.7.0 (EUVD 5.6.0 <5.7.0)." }
  - { cve: "CVE-2026-91184", product: "NGINX Gateway Fabric (AuthenticationFilter realm injection)", cvss: "8.7 (4.0) / 8.8 (3.1)", disposition: "fails: authenticated (namespaced PR:L), control-plane issue; a crafted spec.basic.realm / spec.jwt.realm closes the quoted auth_basic directive and injects arbitrary NGINX directives into the shared data-plane config; fixed NGF 2.8.0 (EUVD 2.4.0 <2.8.0). Multi-tenant clusters only." }
  - { cve: "CVE-2026-96615", product: "NGINX Gateway Fabric (NGINX Agent gRPC)", cvss: "7.1 (4.0) / 6.5 (3.1)", disposition: "fails: authenticated namespaced attacker, control plane; impersonating the Agent gRPC connection to read Gateway TLS private keys of other namespaces; fixed NGF 2.8.0." }
  - { cve: "CVE-2026-101019", product: "NGINX JavaScript (njs XML module)", cvss: "8.3 (4.0) / 6.5 (3.1)", disposition: "fails: needs njs XML canonicalisation consumers (nginx-saml with the built-in njs backend confirmed) and a genuinely signed document; signature-validation skip; fixed njs 1.0.2 (EUVD 0.7.10 <1.0.2). nginx without js_import never runs njs." }
  - { cve: "CVE-2026-101025", product: "NGINX JavaScript (njs xml.parse leak)", cvss: "6.9 (4.0) / 5.3 (3.1)", disposition: "fails: availability only (unbounded memory growth from malformed XML in long-lived workers); fixed njs 1.0.2." }
