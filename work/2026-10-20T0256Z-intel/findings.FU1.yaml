    discovery_trace: "first seen at: CERT-FR AVI-1341 (handed in by the main agent), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1341/ (11 CVEs, F5 K000162416 et al.) -> pivot: ccb-belgium listing, URL https://ccb.belgium.be/advisories -> CCB warning URL https://ccb.belgium.be/advisories/warning-heap-based-buffer-overflows-nginx-plus-and-nginx-open-source-can-be-exploited -> primary (vendor project channel): nginx.org security advisories URL https://nginx.org/en/security_advisories.html and CHANGES URL https://nginx.org/en/CHANGES-1.30 -> EUVD API search + EUVD pages (CNA text, KEV/EPSS) -> Debian tracker URL https://security-tracker.debian.org/tracker/CVE-2026-15176 -> precedent: https://cyberstan.co.uk/nginx-rce/ and https://www.helpnetsecurity.com/2026/05/18/ngnix-vulnerability-exploited-cve-2026-42945/. F5's own K-articles (my.f5.com K000162416 / K000162607 / K000162608) return a JavaScript portal shell on extract, WebFetch and jina, so F5's text is read via its CNA record as republished by EUVD / Debian and as relayed by securityonline."
    summary: |
      F5's quarterly notification of 2026-10-14 came with nginx 1.30.6 (stable) and 1.31.7 (mainline), both dated 14 Oct 2026 in nginx's CHANGES files. Three of the nginx core fixes are scored CVSS 4.0 9.2 by F5 as CNA (CVSS 3.1 8.1; vector AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H): CVE-2026-15176, CVE-2026-93479 and CVE-2026-97205. nginx.org lists all five of its core entries from this release, including these three, as "Severity: medium".

      FACTS (vendor / CNA). Common: unauthenticated attacker, crafted HTTP requests, "conditions beyond their control" (AC:H); the F5 CNA text says the overflow "may cause a heap buffer overflow in the NGINX worker process leading to a restart" and that "attackers can execute code on systems with Address Space Layout Randomization (ASLR) disabled or when the attacker can bypass ASLR"; "data plane issue only", no control-plane exposure.
      - CVE-2026-15176 (nginx.org: "Buffer overflow when using alias with rewrite"; CWE-122; ngx_http_core_module; found internally at F5 per the Daily CyberSecurity relay of F5's advisory). Trigger per CNA/CCB: a location that uses alias together with rewrite and a set or return directive referencing $request_filename, or $request_filename used in an access-log format; nginx.org CHANGES: the request URI was changed by rewrite and then mapped to a file path. Opt-in configuration (alias has no default). nginx.org vulnerable range 0.1.29-1.31.6.
      - CVE-2026-93479 (nginx.org: "Buffer overflow in script evaluation"; CWE-122; credit Matt Suiche of Tolmo Inc. in CHANGES, plus, at F5, Mateusz Gierblinski per the kimmo.cloud tracker). Trigger per CNA/CCB: a map directive with regex matching where root or an access-log format references the map's regex capture variables before the map output variable, or a non-cacheable variable in a string expression under certain conditions; CHANGES: string-expression evaluation with variables, affecting document-root calculation and request logging in both the http and stream modules. nginx.org vulnerable range 1.31.2-1.31.6 and 1.30.0-1.30.5, so builds that already carry July's CVE-2026-42533 fix (1.30.4/1.30.5, 1.31.3-1.31.6) are still vulnerable; branches older than 1.30 are not in the range. A distro tracker relaying F5 lists a workaround for the named-capture path only and none for the non-cacheable-variable path.
      - CVE-2026-97205 (nginx.org: "Use-after-free when using asynchronous file I/O (AIO)"; CWE-416; credit cyberlancer). CHANGES: use-after-free "in certain configurations if the SSI page has include virtual commands". Needs aio (on or threads) AND ssi on; nginx documentation gives defaults "aio off" and "ssi off", so both are opt-in. nginx.org vulnerable range 0.8.11-1.31.6. CCB's warning does NOT cover this CVE although it carries the same 9.2 score.
      - Fixed: nginx Open Source 1.30.6 (stable) / 1.31.7 (mainline); nginx.org's "Not vulnerable" line is "1.31.7+, 1.30.6+" for all three and names no fixed release for older branches. NGINX Plus 37.1.0.1 / 37.0.5.1 (CERT-FR, EUVD); EUVD lists Plus R33-R36 as affected with no fixed R-release ("<*"), so R-release users should read F5's K-articles. Companion fixes in the same notification: F5 WAF for NGINX 5.14.2 / 5.16.0, F5 DoS for NGINX 4.11.0, NGINX Instance Manager 2.24.0, NGINX Gateway Fabric 2.8.0, NGINX Ingress Controller 5.7.0, njs 1.0.2 (CERT-FR AVI-1341, Cyber Centre AV26-1049).
      - F5 workarounds as relayed by Daily CyberSecurity and the kimmo.cloud tracker (F5's page itself unreadable): aio off or ssi off (97205); avoid alias in affected locations and avoid $request_filename including in log formats (15176); named captures confined to the matching map block (93479).

      EXPLOITATION STATUS (claims and absences). No in-the-wild exploitation, public PoC or scanning report found for any of the three. EUVD page for each of the three (fetched 2026-10-20): "CISA KEV | Not listed", EU KEV not listed, Shadowserver honeypot sensors "No data"; CISA KEV catalogue as fetched through the bridge (release stamp 2026-10-16T17:15Z) holds none of the 11 CVEs. EPSS (FIRST.org API, 2026-10-19): 0.0052 / 0.0055 / 0.0048 for 15176 / 93479 / 97205 (percentile about 0.43 / 0.45 / 0.40; EUVD shows these as 0.52% / 0.55% / 0.44%). CISA SSVC on the CVE records reads exploitation "none" (NVD API, verification only; relayed by the kimmo.cloud tracker). Daily CyberSecurity states F5 "has confirmed no public proof-of-concept exploit code for any of the three flaws". GitHub repository searches for each CVE id return no PoC (the only hit is a distro patch-status tracker). Nothing found is dated after 2026-10-20 03:50 UTC.

      INFERENCE / ASSESSMENT (mine, flagged). F5's code-execution condition (ASLR disabled or bypassed) should not be read as "DoS only" for the script-evaluation class: Stan Shaw's July write-up on the sibling CVE-2026-42533 says that bug "works with ASLR on, since the info leak primitive defeats it in a single GET request", and CVE-2026-42945 (same engine, needed ASLR disabled) was exploited in the wild within days of its public PoC (VulnCheck via Help Net Security, 2026-05-18). No source says the October trio has an equivalent leak primitive. Against inclusion at critical weight: opt-in configuration, AC:H, nginx.org's own "medium", EPSS about 0.5 %, no PoC. For inclusion: pre-auth, network-reachable, CVSS 9.2, a national authority (CCB) tells readers to patch immediately, nginx is ubiquitous as a reverse proxy in public-sector estates, and distro lag is real (Debian below).

      DISTRO LAG. Debian Security Tracker for CVE-2026-15176: bookworm 1.22.1-9+deb12u9 / deb12u10 (security) and trixie 1.26.3-3+deb13u7 / deb13u9 (security) are "vulnerable"; only forky and sid (1.30.4-8, a Debian backport) are "fixed". An upstream version-number comparison therefore misclassifies distro-patched builds in both directions (1.30.4-8 is fixed although upstream 1.30.4 is not); the distro tracker, not the version string, is the authority. The kimmo.cloud tracker (secondary) reports the same for trixie/bookworm and shows nixpkgs/NixOS channels fixed.
