    extended_notes: |
      Cross-day / cross-jurisdiction pattern this belongs to (the reason it clears the weekly bar
      rather than the daily one): the NIS2 enforcement clock turned across three jurisdictions in
      quick succession. Germany's forbearance ended 31 July 2026 (in-window). The Dutch
      Cyberbeveiligingswet and Wet weerbaarheid kritieke entiteiten enter into force 15 August
      2026, at which point roughly 8,000 Dutch entities acquire registration, duty-of-care,
      reporting and board-accountability obligations, with registration through mijn.ncsc.nl
      (NCSC-NL announcement 2026-07-07, out of window — carry it as a looking-ahead clock, not as
      an item). And the Commission's July 2026 infringement package referred Ireland, Spain,
      France and the Netherlands to the CJEU with a request for financial sanctions over
      incomplete NIS2 transposition (mid-July, out of window; the France/Spain referral is already
      registered as policy:eu-nis2-cjeu-referral-france-spain-2026).
      France remains the largest open gap: the loi résilience was not put on the July 2026
      extraordinary-session agenda, so hemicycle examination slips to September 2026 — roughly
      15,000 French entities and ANSSI's implementing decrees still unlanded. No in-window
      primary for that, so it is context rather than an item.
      Numbers caveat: the ~11,500 registered figure comes from in-window trade reporting, not
      from a BSI publication. The BSI's own page confirms the deadline has expired but publishes
      no registration count. Treat the ratio as reported, not official.

  - title: "AI Act enforcement regime starts 2 August 2026 — and the Digital Omnibus on AI, in force 27 July, moved the high-risk clock to December 2027"
    sources:
      - { url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj", publisher: "EUR-Lex / Official Journal of the European Union", date: "2026-07-24", role: "primary" }
    discovery_trace: >-
      first seen at: WebSearch ("AI Act 2 August 2026 high-risk obligations apply digital omnibus delay adopted status")
      → primary: EUR-Lex ELI record for Regulation (EU) 2026/1744, URL https://eur-lex.europa.eu/eli/reg/2026/1744/oj
    summary: |
      Regulation (EU) 2026/1744 of 8 July 2026 — the "Digital Omnibus on AI" — was published in
      the Official Journal on 24 July 2026 and entered into force on 27 July 2026, the first day
      of this review week, amending the AI Act (Regulation (EU) 2024/1689) days before the AI
      Act's general date of application. Two dates matter for a public-sector defender. First,
      2 August 2026 (the last day of this window) remains the AI Act's general application date:
      the Article 5 prohibitions, the Article 4 AI-literacy duty, transparency and documentation
      requirements, the governance and notified-body machinery, and the member-state penalty and
      market-surveillance regimes all become live and enforceable. Second, the obligations most
      organisations were building toward for that date have moved: Chapter III Sections 1–3
      duties for stand-alone Annex III high-risk systems now apply from 2 December 2027, and for
      AI embedded in products covered by Annex I sectoral harmonisation law from 2 August 2028.
      The omnibus also refines the "safety component" definition to exclude non-safety user
      assistance functions, adds SME/SMC proportionality, simplifies Article 6(3) registration
      for lower-risk systems, adds a new Article 4a legal basis for processing special-category
      data for bias detection, gives the AI Office exclusive supervision of general-purpose AI
      systems and very large online platforms, and strengthens the regulatory-sandbox regime with
      a Union-level option.
      For a Swiss or European public-sector security function the practical reading is: the
      compliance calendar for high-risk classification work just got fifteen months longer, but
      the enforcement, prohibition and transparency layer is live now — and it is live for AI
      systems public authorities themselves deploy in Annex III territory (law enforcement,
      migration, access to essential services, employment). Where a SOC is itself adopting
      agentic tooling, the AI-literacy and transparency duties bite immediately even though the
      high-risk conformity work does not.
    region_nexus: "EU-wide, with extraterritorial reach to Swiss providers and deployers placing AI systems on the EU market or whose output is used in the EU"
    primary_sector_nexus: "direct — public authorities are named deployers in several Annex III use cases"
    sector: "public-sector, healthcare, finance, transport"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities:
      - key: "policy:eu-ai-act-digital-omnibus-2026"
        type: policy
        name: "Digital Omnibus on AI (Regulation (EU) 2026/1744)"
        aliases: ["AI Omnibus", "Regulation (EU) 2026/1744", "AI Act simplification package"]
        summary: >-
          Regulation (EU) 2026/1744 of 8 July 2026, published in the OJ on 24 July 2026 and in
          force from 27 July 2026, amends the AI Act to defer Chapter III high-risk obligations
          to 2 December 2027 (Annex III) and 2 August 2028 (Annex I), while leaving the AI Act's
          2 August 2026 general application date — prohibitions, AI literacy, transparency,
          governance and penalties — untouched (EUR-Lex / Official Journal).
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Sections 1, 2 and 3 of Chapter III…apply by 2 December 2027 for AI systems classified as high-risk pursuant to Article 6(2) and Annex III, and…2 August 2028 for…Article 6(1) and Annex I."
        attribution: "Regulation (EU) 2026/1744, Official Journal of the European Union"
        source_url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"
      - quote: "This Regulation should enter into force as a matter of urgency on the third day following…its publication."
        attribution: "Regulation (EU) 2026/1744, Official Journal of the European Union"
        source_url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"
    extended_notes: |
      Verification note: the single source is the Official Journal text itself — the authoritative
      legal instrument, not a report about one. Treated as an authority primary in the same class
      as a national-CERT self-published advisory; `verification` is recorded as
      SINGLE-SOURCE-NATIONAL-CERT for that reason. If the composer prefers a second anchor, the
      Commission's AI Act policy page would serve but was not fetched in this run.
      Already-in-motion clocks for the looking-ahead list: 2 August 2026 (AI Act general
      application, inside this window's last day), 2 December 2027 (Annex III high-risk),
      2 August 2028 (Annex I embedded high-risk).
      Adjacent track with no in-window movement: the Data Omnibus (GDPR / ePrivacy / NIS2 / DORA),
      which would create a single entry point for cyber-incident notification operated by ENISA
      under NIS2, remains in negotiation. Council and Parliament reached a provisional agreement
      on 7 May 2026; formal adoption was targeted before 2 August 2026 but no adoption was found
      in this window. The proposal's own timetable gives ENISA 18 months (extendable to 24) from
      entry into force to make the portal operational, so a realistic single-entry-point date is
      late 2027 to mid-2028. Worth re-checking next week.

  - title: "CI Fortify: four national cyber authorities publish joint guidance telling critical-infrastructure operators to pre-engineer OT isolation and rehearse running islanded"
    sources:
      - { url: "https://www.cisa.gov/news-events/news/cisa-joins-australia-and-others-publish-guidance-isolate-operational-technology-and-enabling-systems", publisher: "CISA", date: "2026-07-28", role: "primary" }
      - { url: "https://www.cisa.gov/resources-tools/resources/ci-fortify-advice-isolating-vital-systems", publisher: "CISA", date: "2026-07-28", role: "primary" }
      - { url: "https://www.cyber.gov.au/business-government/secure-design/operational-technology-environments/ci-fortify/ci-fortify-advice-for-isolating-vital-systems", publisher: "Australian Signals Directorate — ACSC", date: "2026-07-28", role: "primary" }
    discovery_trace: >-
      first seen at: cisa-news, URL https://www.cisa.gov/news.xml (bridge feed)
      → pivot: CISA news item, URL https://www.cisa.gov/news-events/news/cisa-joins-australia-and-others-publish-guidance-isolate-operational-technology-and-enabling-systems
      → pivot: CISA resource page, URL https://www.cisa.gov/resources-tools/resources/ci-fortify-advice-isolating-vital-systems
      → primary: ASD/ACSC publication page (guidance is ASD-led), URL https://www.cyber.gov.au/business-government/secure-design/operational-technology-environments/ci-fortify/ci-fortify-advice-for-isolating-vital-systems
    summary: |
      CISA, the Australian Signals Directorate's ACSC (which led the work), the UK NCSC and the
      Canadian Centre for Cyber Security jointly published "CI Fortify – Advice for Isolating
      Vital Systems" on 28 July 2026 — the first time the four agencies issued the CI Fortify
      material as a single shared document rather than ASD's national framework (ASD published
      its own version in October 2025). The guidance is aimed at operators of power grids, water
      and wastewater, telecommunications and transport, and its premise is that isolating
      essential OT is an emergency measure that has to be engineered and rehearsed in advance,
      not improvised during an incident. It covers four things: identifying and mapping vital
      systems and every connection into them (enterprise IT, vendor remote access, cloud
      services); building effective separation points that can actually be actuated under
      pressure; graduated isolation planning with regular testing, so an operator can step down
      through partial isolation rather than choosing between fully connected and fully dark; and
      real-world examples of resilience during ransomware attacks, including sustaining essential
      services under degraded conditions through manual or alternative SCADA paths for extended
      periods.
      The defender takeaway is a planning obligation, not a detection one: the question the
      guidance forces is whether an operator can name its separation points, has ever actuated
      them outside a tabletop, and knows how long the essential service survives once the
      enterprise network, the vendor tunnel and the cloud telemetry path are all gone. CISA
      frames the driver as state-sponsored pre-positioning in vital systems for later disruption.
    region_nexus: "Five-Eyes-issued (US, AU, UK, CA) but written for any national critical-infrastructure operator; UK NCSC co-seal makes it a European-authority reference"
    primary_sector_nexus: "indirect for federal administration; direct for the profile's additional sectors"
    sector: "energy, water, transport, telco, healthcare, public-sector"
    cves: []
    techniques: ["T0812", "T0828"]
    affected_products: []
    entity_keys: []
    new_entities:
