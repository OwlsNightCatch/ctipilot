  - title: "European Commission publishes its first Article 26 guidance on applying the Cyber Resilience Act — six weeks before the 11 September vulnerability-reporting clock starts"
    sources:
      - { url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation", publisher: "European Commission — Shaping Europe's digital future", date: "2026-07-27", role: "primary" }
      - { url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp", publisher: "ENISA", date: "2026-07-31", role: "primary" }
      - { url: "https://www.cyberresilienceact.eu/news/commission-cra-application-guidance-published-27-july-2026.html", publisher: "cyberresilienceact.eu", date: "2026-07-27", role: "corroborating" }
    discovery_trace: >-
      first seen at: WebSearch ("\"30 July 2026\" OR \"31 July 2026\" OR \"1 August 2026\" cybersecurity regulation EU Commission implementing act")
      → pivot: cyberresilienceact.eu overview page, URL https://www.cyberresilienceact.eu/commission-guidance.html
      → pivot: cyberresilienceact.eu news item, URL https://www.cyberresilienceact.eu/news/commission-cra-application-guidance-published-27-july-2026.html
      → primary: European Commission library entry, URL https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation
      → primary: ENISA Single Reporting Platform page (page last updated 2026-07-31), URL https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp
    summary: |
      On 27 July 2026 the European Commission published its first official guidance on applying
      Regulation (EU) 2024/2847 (Cyber Resilience Act), document reference C(2026) 5252, issued
      under CRA Article 26. It runs to roughly 84 pages with 67 worked examples, use cases and
      flowcharts, and works through the questions that decide whether a product is in scope at
      all: what counts as a "product with digital elements", where remote data processing
      components sit, when free and open-source software crosses into commercial "making
      available on the market" (and when the lighter open-source-steward regime applies), what a
      "substantial modification" under Article 3(30) is (a post-market change affecting Annex I
      compliance resets the product as newly placed on the market and triggers reassessment),
      how the minimum five-year support period under Article 3(20) is determined, and how the
      important/critical product classes work. The guidance is explicitly non-binding — the
      Commission's own reading, with the regulation text and, once cited in the Official Journal,
      the harmonised standards remaining decisive — but market-surveillance authorities will use
      it as their reference point, and no CRA harmonised standard has yet been cited, so the
      Article 27 presumption of conformity is not yet available to anyone.
      The operationally significant part for defenders is the reporting chapter. Article 14
      obligations start on 11 September 2026: for an actively exploited vulnerability in a
      product with digital elements, or a severe incident affecting its security, the
      manufacturer owes an early warning within 24 hours of becoming aware, a fuller notification
      within 72 hours, and a final report within 14 days of a fix being available (one month
      after the notification for severe incidents). ENISA's page for the Single Reporting
      Platform — last updated 31 July 2026, inside this window — confirms the platform is
      scheduled to be operational on 11 September 2026 and, newly, spells out the onboarding
      mechanics: manufacturers and open-source stewards must create EU Login accounts in advance,
      and the CSIRT coordinator of the member state of main establishment validates the
      representative after first access, in parallel with reporting rather than before it.
      A single report routes to that CSIRT and to ENISA simultaneously, and the receiving CSIRT
      onward-disseminates to CSIRTs in other member states where the product is available.
      Main CRA obligations still apply only from 11 December 2027.
    region_nexus: "EU-wide; directly binds any manufacturer placing digital products on the EU single market, including Swiss suppliers to EU and Swiss public-sector buyers"
    primary_sector_nexus: "indirect — public-sector bodies are buyers and CSIRT recipients rather than obligated manufacturers, but their supplier base is in scope"
    sector: "public-sector, energy, transport, healthcare, finance, telco, manufacturing"
    cves: []
