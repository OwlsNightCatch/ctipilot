        source_url: "https://www.bsi.bund.de/DE/Themen/Regulierte-Wirtschaft/NIS-2-regulierte-Unternehmen/nis-2-regulierte-unternehmen_node.html"
      - quote: "Da die Registrierungen überfällig sind, gehen wir davon aus, dass alle bisher noch nicht registrierten Einrichtungen die Registrierung bis zum 31. Juli 2026 erfolgreich abschließen."
        attribution: "BSI letter of 12 June 2026, quoted by BDO Deutschland"
        source_url: "https://www.bdo.de/de-de/insights/dora/nis-2-bsi-erwartet-ausstehende-registrierungen-bis-ende-juli-2026"
