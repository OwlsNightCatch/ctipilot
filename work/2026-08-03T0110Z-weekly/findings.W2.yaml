        type: policy
        name: "CI Fortify — Advice for isolating vital systems"
        aliases: ["CI Fortify"]
        summary: >-
          Joint guidance published 28 July 2026 by the Australian Signals Directorate's ACSC
          (lead), CISA, the UK NCSC and the Canadian Centre for Cyber Security, telling critical
          infrastructure operators to pre-engineer graduated isolation of vital operational
          technology, map every enterprise/vendor/cloud connection into it, and rehearse running
          essential services islanded for extended periods (CISA / ASD, 2026-07-28).
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This joint guidance, led by ASD, helps critical infrastructure operators protect essential services from escalating cyber threats and ensure continuity of operations during cyber incidents or geopolitical crises."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/cisa-joins-australia-and-others-publish-guidance-isolate-operational-technology-and-enabling-systems"
      - quote: "CISA urges OT owners and operators to maintain robust isolation and recovery plans so that essential services can continue under degraded conditions, enabled through either manual or alternative SCADA paths."
        attribution: "Chris Butera, CISA Acting Executive Assistant Director for Cybersecurity"
        source_url: "https://www.cisa.gov/news-events/news/cisa-joins-australia-and-others-publish-guidance-isolate-operational-technology-and-enabling-systems"
    extended_notes: |
      Why this clears the weekly bar rather than being routine guidance: it lands in the same week
      as two operational entries already in the store — the coordinated OT disruption at 30+
      Minnesota water and wastewater utilities (2026-07-29) and the FBI/EPA reporting on water
      PLC lockouts spreading to seven US states with named controllers and stated EU exposure
      (2026-08-01). The guidance is the obligation-side answer to the week's threat-side reporting:
      the same controller-lockout scenario is exactly the case where graduated isolation and a
      rehearsed manual/alternative SCADA path decide whether the service survives. Cross-day
      pattern, not a standalone advisory.
      Confidence is MEDIUM rather than HIGH only on the precise publication date: the CISA and
      ASD pages carry no in-body date in the fetched renderings, and 28 July 2026 is established
      from the joint CSA release path (ic3.gov/CSA/2026/260728.pdf) plus consistent secondary
      reporting. The substance and the co-sealer list are directly from the fetched CISA pages.
      ATT&CK mapping is ICS-matrix and refers to the adversary behaviour the guidance defends
      against (denial of control / loss of control via reachable OT), not to attacker behaviour
      the document itself describes — the composer should drop the technique ids if it prefers
      to keep policy entries unmapped.

  - title: "NCSC UK pushes forensic observability from good practice to a buying requirement for firewalls and VPN gateways"
    sources:
      - { url: "https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices", publisher: "NCSC UK", date: "2026-07-29", role: "primary" }
    discovery_trace: >-
      first seen at: ncsc-uk, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml (bridge feed)
      → primary: NCSC UK blog post, URL https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices
    summary: |
      On 29 July 2026 the NCSC UK published a follow-up to its 2025 guidance on digital forensics
      and protective-monitoring specifications for producers of network devices and appliances,
      making the ask explicit on both sides of the market: manufacturers should build forensic
      observability into edge devices early in design, and buyers should demand it as standard
      from their edge-device vendors. Forensic observability here is a bundle of concrete
      capabilities — telemetry and logging that survives the event, retrievable configuration
      state, supported memory-acquisition mechanisms, and vendor transparency in the form of
      precise version information and software bills of materials. The NCSC's stated problem is
      that too many firewalls and VPN gateways still force incident responders to fall back on
      unsupported techniques, or to exploit a vulnerability in the appliance in order to get an
      image of it, which is an untenable basis for investigating the device class that has
      carried the year's heaviest exploitation load. It notes that industry progress exists but
      is inconsistent, and cites Sophos's Pacific Rim work as evidence that designing
      observability in at an early stage is practical rather than aspirational.
      The consequence for a defender is procurement leverage and a hunt-readiness gap that can be
      inventoried today: for each internet-facing appliance model in the estate, can an
      investigator obtain volatile state and a supported memory image without vendor escalation,
      does the device emit its own configuration-change and authentication telemetry to an
      external collector, and does the vendor publish an SBOM and exact build identifiers? Where
      the answer is no, that appliance is a forensic blind spot and the finding belongs in the
      next refresh specification, not in the incident retrospective.
