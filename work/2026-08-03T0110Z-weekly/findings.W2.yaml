        source_url: "https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices"
    extended_notes: |
      Cross-week pattern this belongs to: supplier-assurance requirements hardened on three fronts
      in the same seven days — the Commission's CRA guidance (vulnerability handling, SBOM and
      support-period duties on manufacturers), the updated SBOM minimum elements, and this NCSC
      procurement ask. The prior weekly already framed the direction of travel as "cyber assurance
      moving into procurement leverage" (2026-07-26/weekly-w30-eu-procurement-assurance-bars);
      this week the same lever was pulled by a national authority against a specific product
      class rather than by a certification scheme.
      Operational adjacency this week: the store already carries the FortiOS SSL-VPN symlink
      persistence KEV entry (2026-07-28), the Arista VeloCloud Orchestrator exploitation entry
      (2026-07-28), the Cisco Secure FMC static-credential exploitation entry (2026-07-30) and the
      SonicWall credential-stuffing entry (2026-07-30) — four edge-appliance items in the same
      window, which is precisely the device class the NCSC is describing as forensically opaque.
      NCSC UK is on the deployment's single-source carve-out list and is the primary disclosing
      party for its own guidance.

  - title: "Updated SBOM minimum elements published — the baseline European procurement and CRA vulnerability-handling duties will be measured against"
    sources:
      - { url: "https://www.cisa.gov/news-events/news/cisa-and-partners-unveil-updated-software-bill-materials-resource-improves-transparency-security-and", publisher: "CISA", date: "2026-07-29", role: "primary" }
      - { url: "https://media.defense.gov/2026/Jul/29/2003971159/-1/-1/1/CSI_2026_cisa_sbom_minimum_elements_508c.PDF", publisher: "CISA and partners (joint CSI, TLP:CLEAR)", date: "2026-07-28", role: "primary" }
    discovery_trace: >-
      first seen at: cisa-news, URL https://www.cisa.gov/news.xml (bridge feed)
      → pivot: CISA news item, URL https://www.cisa.gov/news-events/news/cisa-and-partners-unveil-updated-software-bill-materials-resource-improves-transparency-security-and
      → primary: joint CSI PDF, URL https://media.defense.gov/2026/Jul/29/2003971159/-1/-1/1/CSI_2026_cisa_sbom_minimum_elements_508c.PDF
    summary: |
      CISA, with other US agencies and international partners, released "2026 Minimum Elements for
      a Software Bill of Materials (SBOM)", replacing the 2021 NTIA minimum elements after a
      public comment period that drew more than 90 submissions. The revision explicitly extends
      scope to all software including open-source, AI software and software-as-a-service, and
      adds new required elements — Component Hash Algorithm, Component License, SBOM Tool Name
      and SBOM Generation Context — while renaming several existing ones for clarity (Author of
      SBOM Data becomes SBOM Author, Supplier Name becomes Component Producer, Version of the
      Component becomes Component Version). The stated intent is machine-readable, scalable
      supply-chain management rather than one-off document exchange.
      The European relevance is not the US provenance but the convergence: CRA Annex I requires
      manufacturers to identify and document components in a software bill of materials as part
      of vulnerability handling, the Commission's 27 July guidance works through those duties,
      and the NCSC UK asked the same week for SBOMs as part of network-device transparency. An
      SBOM that carries component hashes, licences and generation context is the difference
      between being able to answer "are we exposed to this dependency" in minutes and running a
      manual vendor round-robin — which is the exact question this week's Adform tracking-script
      compromise and the npm/AI-toolchain wave keep forcing.
    region_nexus: "US-issued with international partners; consumed in Europe through CRA Annex I SBOM duties and public procurement specifications"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
    cves: []
    techniques: ["T1195.002"]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: >-
      US-led rather than EU/Swiss, and non-binding; included because it resets the SBOM baseline
      that CRA Annex I duties and European procurement specifications converge on in the same
      window. The fetched PDF confirmed TLP:CLEAR and a 28 July 2026 date but the extraction did
      not resolve the named international co-sealers, so the claim of European agency co-seal is
      NOT made. Drop the item if the composer wants the weekly policy section kept strictly to
      European instruments.
    evidence:
      - quote: "The minimum elements in this revision apply to SBOMs for all software, including open-source software, AI software, and software-as-a-service (SaaS)."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/cisa-and-partners-unveil-updated-software-bill-materials-resource-improves-transparency-security-and"
      - quote: "There are several new minimum elements, such as Component Hash Algorithm, Component License, SBOM Tool Name, and SBOM Generation Context."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/cisa-and-partners-unveil-updated-software-bill-materials-resource-improves-transparency-security-and"
    extended_notes: |
      Date caveat: the CISA news page carries no in-body date in the fetched rendering; the joint
      CSI PDF reports 28 July 2026 and the media.defense.gov path segment is 2026/Jul/29. Both
      fall inside the window, so the in-window determination is safe; the exact day is not.

