    affected_products: []
    entity_keys: ["policy:eu-cyber-resilience-act"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Cyber Resilience Act's main obligations apply from 11 December 2027, with reporting obligations already applying as of 11 September 2026."
        attribution: "European Commission"
        source_url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation"
      - quote: "Today's guidance - though non-binding - gives companies the clarity they need to prepare now, confidently and efficiently."
        attribution: "European Commission"
        source_url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation"
      - quote: "The platform is scheduled to be operational by 11 September 2026. This coincides with the date when the mandatory reporting obligations for manufacturers officially enter into application."
        attribution: "ENISA"
        source_url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp"
    extended_notes: |
      Already-in-motion clock for the weekly looking-ahead list: 11 September 2026 — CRA Article
      14 reporting starts and the ENISA Single Reporting Platform is due live. Second clock:
      11 December 2027 — CRA main obligations. Third: no CRA harmonised standard cited in the OJ
      yet, so Article 27 conformity presumption remains unavailable.
      Defender angle rather than compliance angle: from 11 September a European CSIRT receives
      a 24-hour early warning about actively exploited vulnerabilities in products it may itself
      operate, before the vendor has published anything. Swiss and other non-EU CSIRTs are not on
      that distribution list — the routing is CSIRT-of-main-establishment plus ENISA plus CSIRTs
      of member states where the product is available. Worth deciding now how a non-EU SOC learns
      of an in-scope exploited-vulnerability early warning that affects its own estate, and how a
      24-hour manufacturer clock interacts with an existing coordinated-disclosure embargo.
      Ties back to the prior weekly's ENISA procurement-assurance entry
      (2026-07-26/weekly-w30-eu-procurement-assurance-bars): same direction of travel — assurance
      obligations moving from voluntary certification to hard, dated supplier duties. The
      2026-07-24 ENISA EUMSS certification consultation (closes 2026-09-13) is the other live
      clock in that thread and was already covered in W30.
      The Commission's guidance page also links the Digital Omnibus (November 2025) proposal —
      the Data Omnibus track that would create a single entry point for GDPR / NIS2 / DORA
      incident notifications remains in negotiation with no in-window movement found.

  - title: "Germany's extended NIS2 registration deadline lapsed on 31 July 2026 with roughly two-thirds of expected entities still unregistered"
    sources:
      - { url: "https://www.bsi.bund.de/DE/Themen/Regulierte-Wirtschaft/NIS-2-regulierte-Unternehmen/nis-2-regulierte-unternehmen_node.html", publisher: "BSI (Bundesamt für Sicherheit in der Informationstechnik)", date: "2026-08-03", role: "primary" }
      - { url: "https://www.boerse-express.com/news/articles/nis2-frist-endet-heute-tausende-unternehmen-drohen-bussgelder-934345", publisher: "Börse Express", date: "2026-08-01", role: "corroborating" }
      - { url: "https://borncity.com/blog/2026/07/30/das-problem-der-nis-2-registrierungsluecke-meldung-bis-31-juli-2026-moeglich/", publisher: "Born's IT- und Windows-Blog", date: "2026-07-30", role: "corroborating" }
      - { url: "https://www.bdo.de/de-de/insights/dora/nis-2-bsi-erwartet-ausstehende-registrierungen-bis-ende-juli-2026", publisher: "BDO Deutschland", date: "2026-06-19", role: "corroborating" }
    discovery_trace: >-
      first seen at: WebSearch ("NIS2 Umsetzung BSI Registrierung Frist Neuigkeiten Ende Juli 2026 Betreiber kritischer Anlagen")
      → pivot: Born's IT-Blog in-window post, URL https://borncity.com/blog/2026/07/30/das-problem-der-nis-2-registrierungsluecke-meldung-bis-31-juli-2026-moeglich/
      → pivot: BDO Deutschland quoting the BSI letter of 12 June 2026 verbatim, URL https://www.bdo.de/de-de/insights/dora/nis-2-bsi-erwartet-ausstehende-registrierungen-bis-ende-juli-2026
      → pivot: Börse Express deadline-day piece (01.08.2026), URL https://www.boerse-express.com/news/articles/nis2-frist-endet-heute-tausende-unternehmen-drohen-bussgelder-934345
      → primary: BSI's own NIS-2-regulierte-Unternehmen page, URL https://www.bsi.bund.de/DE/Themen/Regulierte-Wirtschaft/NIS-2-regulierte-Unternehmen/nis-2-regulierte-unternehmen_node.html
    summary: |
      Germany's NIS2 transposition (revised BSIG, in force since December 2025) required every
      "besonders wichtige" and "wichtige Einrichtung" to self-register with the BSI. The statutory
      deadline was 6 March 2026; by then well under half of the roughly 29,500 expected entities
      had registered, and in a 12 June 2026 letter to business associations the BSI set a
      forbearance date — "we expect all entities not yet registered to successfully complete
      registration by 31 July 2026" — during which it would hold off on supervisory measures.
      That date fell inside this review week. Reporting on and around deadline day puts the
      registered population at roughly 11,500 of ~29,500, i.e. about two thirds of the regulated
      population still unregistered as the forbearance window closed. The BSI's own page now
      simply states the statutory registration deadline has already expired and instructs
      affected entities to register in the BSI portal immediately.
      Registration is not a formality: it is the act that makes an entity visible to the
      supervisor and is itself an independent fine-triggering offence under § 65 BSIG (reported
      exposure up to EUR 500,000 for the registration breach specifically, with the far larger
      NIS2 ceilings applying to substantive failures, plus management liability). Registration is
      also gated on infrastructure most organisations under-plan for: an ELSTER organisational
      certificate via "Mein Unternehmenskonto" before the BSI portal account can be created, and
      the registration record itself demands IP address ranges and domain inventory — i.e. the
      entity must be able to state its own internet-facing footprint.
      The defender-relevant consequence is that from 1 August the BSI's cooperative phase is over
      and the population it can now approach with supervisory measures is the two thirds that
      never appeared. Every Swiss or European group with a German subsidiary in energy, water,
      transport, health, digital infrastructure, manufacturing, logistics, waste or research at
      or above the 50-employee / EUR 10 m thresholds should treat "are all our German entities
      registered, and who owns the reporting channel" as an answerable question this week, not a
      legal-department backlog item.
    region_nexus: "Germany; direct spillover to Swiss and other European groups with German subsidiaries or German-established entities"
    primary_sector_nexus: "indirect for Swiss federal bodies themselves; direct for constituency operators with German legal entities"
    sector: "energy, water, transport, healthcare, digital-infrastructure, manufacturing, public-sector"
