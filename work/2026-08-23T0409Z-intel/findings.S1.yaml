  - title: "TrueConf Server pre-auth RCE chain (CVE-2026-72529/72530) added to CISA KEV — Head Mare trojanizes the client installer to plant PhantomCore/PhantomGraph backdoors on meeting participants"
    sources:
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA KEV catalog", date: "2026-08-20", role: "primary" }
