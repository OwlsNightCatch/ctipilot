      - quote: "We do not believe the author of arrayref to be acting maliciously"
        attribution: "The Rust Project"
        source_url: "https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/"
    extended_notes: |
      Detection concept: build-time/CI telemetry class — a `cargo build`/`rustc` child process
      initiating outbound network egress, or a compiler-toolchain process spawning and executing a
      downloaded binary from a temp directory, is anomalous and should be alertable in any CI
      environment; correlate with new Registry Run key / LaunchAgent / systemd-unit creation events
      immediately following a build invocation. Hardening: per the Rust Project's own guidance, check
      `~/.cargo/registry/cache` for cached copies of the named malicious crates; pin dependencies via
      Cargo.lock and verify checksums; review CI egress allowlists for build-time network calls, which
      should not normally occur.

  - title: "Three misp-stix vulnerabilities (CVE-2026-77710/77755/77761): a crafted STIX document can crash a MISP import pipeline, inject unvalidated sharing/distribution metadata, or contaminate a later import — fixed only by commits, no tagged release yet"
    sources:
      - { url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8", publisher: "GitHub Security Advisories (MISP/misp-stix)", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-pqpx-w6cx-7q9c", publisher: "GitHub Security Advisories (MISP/misp-stix)", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-q62h-w723-22p2", publisher: "GitHub Security Advisories (MISP/misp-stix)", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/MISP/misp-stix/releases", publisher: "MISP Project", date: "2026-08-22", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd (bridge: enisa-euvd recent lastvulnerabilities) listing CVE-2026-77710/77755/77761 published 2026-08-21 → pivot: GitHub Security Advisories GHSA-65gx-wjvj-88j8, GHSA-pqpx-w6cx-7q9c, GHSA-q62h-w723-22p2 → corroboration: MISP Project releases page, URL https://github.com/MISP/misp-stix/releases (confirms no tagged release yet carries the fixes)"
    summary: |
      Three CVEs disclosed 2026-08-21 against misp-stix, the Python library MISP and other threat-
      intelligence platforms use to convert between MISP and STIX 1/STIX 2 formats — relevant to any
      organization's own CTI ingestion pipeline, including MISP instances run by national CERTs, ISACs
      and sector sharing communities. CVE-2026-77755 (CVSS 8.7, CWE-400) is a denial-of-service: the
      STIX importer called sys.exit() on a parse failure, which raises SystemExit — a subclass of
      BaseException that a standard `except Exception` handler does not catch — letting one malformed
      document kill a long-running importer process outright; separately, the importer read and fully
      materialised a submitted document in memory before validating its type or size, so a large
      crafted document could inflate memory use to 2-7x the input file's size. CVE-2026-77710 (CVSS
      6.9, CWE-915/CWE-807/CWE-20) is a trust-boundary flaw: the import logic decided whether to treat
      an incoming document as a trusted "internal MISP export" — and therefore copy its attribute
      metadata over verbatim — based on signals inside the document itself (MISP-specific tool labels
      for STIX2, the document title for STIX1), both of which an attacker fully controls; a document
      that spoofs those markers gets its x_misp_attributes dictionary copied directly onto imported
      attributes, letting the sender set distribution, sharing_group_id, tags or other MISP-internal
      fields the importing analyst believes came only from the external feed. CVE-2026-77761 (CVSS
      6.3, CWE-459) is a parser state-isolation bug: several STIX1/STIX2 parser components retained
      per-document state (galaxy/cluster data, references, timestamps) across reuse of the same long-
      lived parser instance, so data from one processed document can leak into the MISP event
      generated from the next; integrations that instantiate a fresh parser per file are unaffected.
      All three are fixed only by individual GitHub commits at the time of writing (66119552, e8e732ad,
      3e5e7bda, 66c654b9, ad4f0a65) — the project's own releases page shows no tagged version past
      2026.7.8 that references these CVEs. None of the three advisories records observed exploitation,
      and EPSS sits in the sub-30th percentile for all three (0.06-0.37%). The realistic delivery
      vector is a poisoned STIX document from a compromised or malicious sharing partner, not a direct
      network attack against the MISP instance.
    region_nexus: "global — MISP is developed and widely deployed across European national CERTs, ISACs and sector sharing communities, including within the profile's own constituency"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-77710, CVE-2026-77755, CVE-2026-77761]
    techniques: [T1499]
    affected_products: ["misp-stix"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "moderate severity (max CVSS 8.7), no observed exploitation, EPSS sub-30th-percentile, and no tagged fix release yet (commits only) — but it sits directly in the CTI/SOC tooling supply chain this audience runs, which is the reason for including it despite the otherwise-thin severity profile."
    evidence:
      - quote: "A malformed STIX document could terminate a long-running importer process instead of returning a recoverable parsing error."
        attribution: "GitHub Security Advisory GHSA-65gx-wjvj-88j8"
        source_url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8"
      - quote: "The importer also now enforces an input-size limit before parsing. The default maximum is 100 MB."
        attribution: "GitHub Security Advisory GHSA-65gx-wjvj-88j8"
        source_url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8"
      - quote: "An attacker able to influence documents processed by such a long-lived parser could potentially cause information from one conversion to contaminate a subsequent MISP event."
        attribution: "GitHub Security Advisory GHSA-q62h-w723-22p2"
        source_url: "https://github.com/advisories/GHSA-q62h-w723-22p2"
    extended_notes: |
      Hardening for MISP operators: until a tagged misp-stix release lands, apply the referenced
      commits directly or wrap STIX imports with an external size cap and process-level restart-on-
      crash supervision; audit any automation that reuses a single misp-stix parser instance across
      multiple files (batch import scripts are the likely affected pattern; per-file CLI invocations
      are not). Treat any newly-received STIX bundle's classification/distribution fields as
      requiring the same trust review as the bundle's actual intelligence content.

