      - { key: "malware:phantomcore", type: malware, name: "PhantomCore", aliases: [],
          summary: "Windows backdoor delivered by Head Mare inside a trojanized TrueConf client installer, unpacked to a file masquerading as a Windows CRT runtime stub under %LOCALAPPDATA%\\TrueConf\\Client (Kaspersky ICS CERT, 2026-08-12)." }
      - { key: "malware:phantomgraph", type: malware, name: "PhantomGraph", aliases: [],
          summary: "Two-component backdoor Head Mare installs on compromised TrueConf servers, persisting as Windows services and using a compromised Microsoft OneDrive account's Graph API as its command-and-control channel (Kaspersky ICS CERT, 2026-08-12)." }
    relation_suggestions:
      - { subject: "actor:head-mare", object: "malware:phantomcore",
          basis: "Kaspersky ICS CERT: Head Mare deploys PhantomCore via trojanized TrueConf client installers (Kaspersky, 2026-08-12)" }
      - { subject: "actor:head-mare", object: "malware:phantomgraph",
          basis: "Kaspersky ICS CERT: Head Mare deploys PhantomGraph on compromised TrueConf servers using OneDrive as C2 (Kaspersky, 2026-08-12)" }
