      - { url: "https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-breakout-from-isolated-environment/", publisher: "Kaspersky ICS CERT", date: "2026-08-11", role: "primary" }
      - { url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/", publisher: "Kaspersky ICS CERT", date: "2026-08-12", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-actively-exploited-trueconf-server-flaws/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (CVE-2026-72529/72530 newly listed 2026-08-20) → pivot: TrueConf vendor advisory, URL https://trueconf.com/blog/news/security-fixes-updates-and-advisories → pivot: Kaspersky ICS CERT per-flaw advisories, URL https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-missing-authentication-for-critical-function/ and https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-breakout-from-isolated-environment/ → primary exploitation report: Kaspersky ICS CERT, URL https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/ → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-actively-exploited-trueconf-server-flaws/"
    summary: |
      CISA added CVE-2026-72529 and CVE-2026-72530 to its Known Exploited Vulnerabilities catalog
      on 2026-08-20 with a three-day remediation deadline (2026-09-03 per the catalog; some coverage
      cites 2026-08-23), and ENISA's EU Vulnerability Database independently lists both as exploited
      since 2026-08-20. The chain sits entirely pre-authentication behind TrueConf Server's port
      4307/TCP. CVE-2026-72529 (CVSS 3.1 9.8/CVSS 4.0 9.3, missing authentication for critical
      function, CWE-306) lets a remote unauthenticated caller invoke an undocumented function on
      that port and run an arbitrary script inside the server's isolated code-execution ("sandbox")
      environment. CVE-2026-72530 (CVSS 3.1 9.0/CVSS 4.0 9.5, sandbox escape/code injection) is a
      flaw in that same sandbox's code-generation logic that lets an attacker who already has script
      execution there escape to the underlying host and run arbitrary OS commands with
      NT AUTHORITY\SYSTEM privileges. Both were fixed together in 5.3.9/5.4.9/5.5.5 on 2026-06-18 —
      more than two months before the KEV listing. Kaspersky ICS CERT reports (2026-08-12) that the
      hacktivist-aligned cluster it tracks as Head Mare has chained both flaws since at least July
      2026: replacing the file at TrueConf Server's httpconf/site/public/js/locale.php with a PHP web
      shell, using that shell to reach the TrueConf Server database with elevated privileges and
      remotely run PowerShell, then overwriting the server's own distributed Windows client installer
      (ClientInstFiles/trueconf_windows_client_x64.exe) with a trojanized copy. Meeting participants
      who accept the installer prompt receive the genuine TrueConf client alongside the PhantomCore
      backdoor, unpacked to a file masquerading as a Windows CRT stub
      (%LOCALAPPDATA%\TrueConf\Client\api-ms-win-crt-time-l1-1-0-2.dll). On the server itself, a
      second implant, PhantomGraph, persists as two Windows services and uses a compromised Microsoft
      OneDrive account's Graph API (graph.microsoft.com) as its command-and-control channel; on *nix
      TrueConf servers Head Mare instead installs a hiding backdoor via systemd that listens for
      commands smuggled inside the TrueConf protocol itself. Kaspersky explicitly warns that
      organizations which do not run a TrueConf server of their own are still exposed if their staff
      join a meeting hosted on a compromised third-party or contractor server and accept the client
      update it offers. Targeting observed to date is concentrated on Russian organizations in
      instrumentation, electronics, transportation, energy, IT and software-development sectors; no
      exploitation outside that set has been reported.
    region_nexus: "primarily Russian critical-infrastructure targeting observed to date; global exposure wherever TrueConf Server is internet-reachable on 4307/TCP, including any EU organization whose staff join meetings hosted by a TrueConf-using contractor or partner"
    primary_sector_nexus: "indirect"
