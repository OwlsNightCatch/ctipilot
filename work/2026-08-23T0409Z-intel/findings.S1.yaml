      - quote: "An unauthorized attacker can connect to TrueConf server versions 5.3.X before 5.3.9, 5.4.X before 5.4.9, 5.5.X before 5.5.5...via port 4307/TCP and execute a malicious script on the server by calling an undocumented function."
        attribution: "Kaspersky ICS CERT"
        source_url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/"
      - quote: "Most importantly, during the attack, the attackers replace the TrueConf client distribution file located at C:\\Program Files\\TrueConf Server\\ClientInstFiles\\trueconf_windows_client_x64.exe."
        attribution: "Kaspersky ICS CERT"
        source_url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/"
      - quote: "Even if your organization does not use a TrueConf server, your employees may connect to compromised TrueConf servers of contractors to participate in online meetings and download infected installation packages."
        attribution: "Kaspersky ICS CERT"
        source_url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/"
      - quote: "Resolution: 5.3.9 / 5.4.9 / 5.5.5"
        attribution: "TrueConf"
        source_url: "https://trueconf.com/blog/news/security-fixes-updates-and-advisories"
    extended_notes: |
      Detection concepts (telemetry class first): (1) process-creation/file-write telemetry on the
      TrueConf server for an unexpected write to httpconf/site/public/js/locale.php or to
      ClientInstFiles/trueconf_windows_client_x64.exe outside a vendor-update window; (2) endpoint
      process-creation events showing the TrueConf client installer spawning a DLL load from
      %LOCALAPPDATA%\TrueConf\Client with a filename that mimics a Windows system component; (3)
      network/DNS egress telemetry showing a server process (not a user browser/mail client) making
      outbound HTTPS calls to graph.microsoft.com or login.microsoftonline.com from a TrueConf host —
      anomalous for a videoconferencing appliance; (4) Windows service-creation events (4697/7045) for
      new services on a TrueConf server. Hardening: patch to 5.3.9/5.4.9/5.5.5; do not expose
      4307/TCP to the internet — restrict to a management network; treat any TrueConf server that
      hosted external/contractor participants during the exposure window as compromised until
      forensically cleared, and validate the client installer's signature/hash against the vendor
      before trusting a server-distributed update. No IOCs reproduced here per pipeline policy —
      see the Kaspersky ICS CERT report for the full indicator set if closed-source enrichment is
      needed.

  - title: "CVE-2026-69836 — Microsoft's own Entra ID CVSS-10 deserialization RCE record was marked exploited, then corrected to 'No' within 24 hours, while ENISA's exploited catalogue still disagrees"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69836", publisher: "Microsoft Security Response Center", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-v6wh-624g-vvmv", publisher: "GitHub Security Advisories / NVD mirror", date: "2026-08-21", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/08/21/microsoft-entra-id-vulnerability-cve-2026-69836/", publisher: "Help Net Security", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd (bridge: enisa-euvd recent exploited) listing CVE-2026-69836 with exploitedSince 2026-08-21 → primary: MSRC, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69836 (revision history shows 'Corrected Exploited to No') → corroboration: GitHub Security Advisory, URL https://github.com/advisories/GHSA-v6wh-624g-vvmv → corroboration: Help Net Security, URL https://www.helpnetsecurity.com/2026/08/21/microsoft-entra-id-vulnerability-cve-2026-69836/ (reporting the exploited claim before/without the correction)"
    summary: |
      Microsoft assigned CVE-2026-69836 on 2026-08-20 for a CWE-502 deserialization-of-untrusted-data
      flaw in Entra ID, rated CVSS 3.1 base 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H), described only
      as allowing "an unauthorized attacker to execute code over a network" — no further mechanism
      detail is published. This is a cloud-service CVE under Microsoft's transparency programme: the
      flaw was already fixed on Microsoft's own infrastructure before disclosure, so there is no
      patch, KB article, or configuration change for any Entra ID tenant to apply. The notable part is
      the exploitation field's history. MSRC's own revision log shows a version-1.1 update on
      2026-08-21 titled "Corrected Exploited to No," stating verbatim: "This vulnerability was not
      exploited in the wild. This is an informational change only." That wording implies the record
      briefly stated something other than "No" between the 2026-08-20 publication and the 2026-08-21
      correction — consistent with Help Net Security's same-day coverage, fetched for this report,
      which describes Microsoft as having "confirmed" the flaw "was exploited in the wild" with no
      correction visible at the time that article was written. As of this run, ENISA's EU
      Vulnerability Database still carries CVE-2026-69836 on its exploited-vulnerabilities feed with
      "exploitedSince: 2026-08-21," directly conflicting with MSRC's now-corrected record — and the
      CVSS vector Microsoft itself publishes carries an Exploit Code Maturity sub-metric of "E:U"
      (Unproven), which is itself inconsistent with any exploitation claim. CISA's KEV catalog does
      not list the CVE at all. No independent telemetry-holding party (a research lab, an MDR
      vendor) has published its own exploitation evidence; the vulnerability was credited to a named
      external researcher rather than discovered via observed attack traffic.
    region_nexus: "global — Entra ID underlies the majority of Swiss and European public-sector and enterprise identity infrastructure, though there is nothing for a tenant to act on"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, healthcare, telco"
