        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69836"
    extended_notes: |
      Process note for the composer / verifier: treat the "exploited" fact as CONTRADICTED, not
      confirmed — state both positions and attribute each to its source (MSRC's corrected record vs.
      ENISA EUVD's exploited-since field) rather than asserting either. This is a live instance of the
      "CVE ground truth is unreliable in both directions" pattern this pipeline flagged in 2026-W32
      (fabricated CVEs on one side, unlisted exploited flaws on the other) — here a single vendor
      cloud-CVE record disagreed with itself within 24 hours and a EU catalogue still mirrors the
      earlier state three days later.

  - title: "CVE-2026-16876 — NEC UNIVERGE IX-R/IX-V routers: an unauthenticated WebGUI request runs arbitrary commands when the HTTP(S) server feature is on (CVSS 9.4/9.3)"
    sources:
      - { url: "https://jvn.jp/en/jp/JVN81414813/", publisher: "JVN (Japan Vulnerability Notes / JPCERT-coordinated)", date: "2026-08-21", role: "primary" }
      - { url: "https://jpn.nec.com/univerge/ix-nrv/Support/Security-Info/NV26-005.html", publisher: "NEC Corporation", date: "2026-08-21", role: "primary" }
    discovery_trace: "first seen at: jpcert, URL https://www.jpcert.or.jp/english/index.html → pivot: JVN, URL https://jvn.jp/en/jp/JVN81414813/ → primary vendor advisory: NEC, URL https://jpn.nec.com/univerge/ix-nrv/Support/Security-Info/NV26-005.html (reached via https://jpn.nec.com/univerge/ix-nrv/Support/security_info.html listing)"
    summary: |
      NEC disclosed CVE-2026-16876 (JVN#81414813) on 2026-08-21: a missing-authentication-for-
      critical-function flaw (CWE-306) in the Web console of its UNIVERGE IX-R/IX-V series routers —
      models IX-R2510, IX-R2520, IX-R2530, IX-R2610-4G and IX-V100 — running firmware Ver1.1 through
      Ver1.3 (all builds), Ver1.4.21 through Ver1.4.28 (all builds), or Ver1.5.23. The precondition is
      the device's HTTP(S) server function being enabled — a single `http-server ip enable` or
      `http-server ipv6 enable` configuration line, which simultaneously drives the Web console, PAC-
      file distribution, and NetMeister child-device connection features. With that function on, a
      remote unauthenticated attacker can send a specially crafted message to the Web console and
      execute an arbitrary command with no credential. NEC rates it CVSS 4.0 base 9.3
      (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:L) and CVSS 3.0 base 9.4 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/
      I:H/A:L). Neither NEC nor JVN reports observed exploitation. Fixed in Ver1.4.34 and Ver1.5.29 for
      both the IX-R and IX-V lines. Where the update cannot be applied immediately, NEC's primary
      workaround is to disable the HTTP(S) server function entirely (`no http-server ip enable` /
      `no http-server ipv6 enable`); if even that cannot be done, NEC's fallback advice is to restrict
      the connecting source by IP or MAC address filter, or to move the device's management IP address
      and the TCP 80/443 listener to non-default, "hard to predict" values — an explicit admission that
      obscurity, not access control, is the last-resort mitigation.
    region_nexus: "Japan-market network equipment with international deployment in enterprise and telecom edge networks; relevant to any organization running UNIVERGE IX-series routers with the Web console enabled"
    primary_sector_nexus: "indirect"
    sector: "telco, public-sector"
    cves: [CVE-2026-16876]
    techniques: [T1190]
    affected_products: ["NEC UNIVERGE IX-R2510", "NEC UNIVERGE IX-R2520", "NEC UNIVERGE IX-R2530", "NEC UNIVERGE IX-R2610-4G", "NEC UNIVERGE IX-V100"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "If a remote unauthenticated attacker sends a specially crafted message to the WebGUI...an arbitrary command may be executed."
        attribution: "JVN"
        source_url: "https://jvn.jp/en/jp/JVN81414813/"
      - quote: "攻撃者によって当該製品のWebコンソールに細工したメッセージを送信された場合、認証無しで任意のコマンドを実行される可能性があります。 (If an attacker sends a crafted message to the product's Web console, an arbitrary command may be executed without authentication.)"
        attribution: "NEC Corporation"
        source_url: "https://jpn.nec.com/univerge/ix-nrv/Support/Security-Info/NV26-005.html"
    extended_notes: |
      Detection concept: web/application-access-log telemetry on the router's management interface for
      POST/GET requests to the Web console endpoint from source addresses outside the management VLAN
      — the affected function is triggered whenever the HTTP(S) server is reachable, so any external
      source touching TCP 80/443 (or whatever port it was moved to) on one of these routers is
      inherently suspicious if the console is meant to be internal-only. Hardening: patch to
      Ver1.4.34/1.5.29; disable `http-server ip enable`/`http-server ipv6 enable` unless the Web
      console is actively required; never expose the management interface to the WAN side.

  - title: "Three Rust crates.io packages hijacked via account takeover (arrayref, internment, append-only-vec) — build-time backdoor infrastructure overlaps DPRK's Mastra and axios npm campaigns"
    sources:
      - { url: "https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns", publisher: "Wiz Research", date: "2026-08-20", role: "primary" }
      - { url: "https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/", publisher: "The Rust Project (official blog)", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: wiz-blog, URL https://www.wiz.io/blog → primary: Wiz Research, URL https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns → corroboration: The Rust Project official blog, URL https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/"
    summary: |
      On 2026-08-20 at 07:15 UTC, an attacker who had taken over a crates.io publisher account
      pushed malicious versions of three widely used Rust crates — arrayref 0.3.10, internment 0.8.7,
      and append-only-vec 0.1.9 — each declaring a dependency on a freshly published typosquat crate,
      proc-macro1, impersonating the legitimate build-tooling crate proc-macro2. proc-macro1 carries a
      build.rs script that executes automatically at compile time, before any of the parent crate's
      own code runs: "because build scripts run during compilation, building an affected project was
      sufficient to execute the payload." The script reconstructs a C2 URL from Base64-encoded
      fragments and downloads a platform-specific second-stage payload (Linux x86_64, Windows x86_64,
      macOS x86_64/aarch64), which beacons over HTTPS POST to a fixed URL path, collects hostname/
      username/OS details, enumerates (Wiz states, without decrypting) Chrome/Brave/Edge credential-
      database files, and installs persistence via Registry Run keys on Windows, a LaunchAgent on
      macOS, or a systemd service on Linux, supporting kill/minicfg/startup/runscript commands. Wiz's
      infrastructure analysis found the beacon's URL path was previously used in the Mastra npm
      supply-chain campaign, which Microsoft attributes to DPRK actor Sapphire Sleet; that the
      malware's C2 IP address shares a TLS certificate issuer with Mastra infrastructure; that a
      second C2 IP address associated with victim reports appears in Google Cloud's own reporting on
      the axios npm compromise linked to North Korea; and that both campaigns' infrastructure sits in
      the same Hostwinds /23 IP range. The Rust Security Response Team deleted all three malicious
      crate versions and the malicious dependency crates within 86-107 minutes of publication, locked
      the compromised account, and states explicitly it does not believe the arrayref maintainer
      acted maliciously — the takeover looks like a compromised account or credentials, not an
      insider. Wiz states the payload-hosting infrastructure remained live at time of publication and
      that arrayref alone is present in roughly 35% of all software environments and in three-
      quarters of all environments that use Rust at all, making this one of the broader-reach single-
      package compromises this pipeline has tracked even though the exposure window itself was under
      two hours. No CVE or RUSTSEC advisory identifier has been assigned to the incident.
    region_nexus: "global software supply chain; affects any organization building Rust software, including CI/CD pipelines run by public-sector or critical-infrastructure operators using arrayref or its dependents"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1195.002, T1547.001, T1543.001, T1543.002, T1555.003, T1140]
    affected_products: ["arrayref (Rust crate)", "internment (Rust crate)", "append-only-vec (Rust crate)"]
    entity_keys: [actor:sapphire-sleet, campaign:mastra-easy-day-js-supply-chain]
    new_entities:
