  - title: "UPDATE — a ransomware group (The Gentlemen) claims the previously-disclosed Arbeiterkammer Oberösterreich breach, contradicting the chamber's own 18 August statement that no extortion attempt had occurred"
    sources:
      - { url: "https://www.ransomware.live/id/QVJCRUlURVJLQU1NRVJOQHRoZWdlbnRsZW1lbg==", publisher: "Ransomware.live (The Gentlemen leak-site listing)", date: "2026-08-21", role: "primary" }
