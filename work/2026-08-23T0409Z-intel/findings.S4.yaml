  - title: "Payload ransomware claims a Zurich IT/data-centre provider, and HWZ business-school students and alumni are victim-confirmed among the exposed data"
    sources:
      - { url: "https://insideparadeplatz.ch/2026/08/22/cyber-attacke-konto-daten-von-hwz-studenten-geschnappt/", publisher: "Inside Paradeplatz", date: "2026-08-22", role: "primary" }
      - { url: "https://www.ransomware.live/id/UXVhbGlmbGV4IERhdGFjZW50ZXIgfCBIV1otU3R1ZGllbmduZ2UgKGZoLWh3ei5jaCksIG15ZW5iLmNoLCBldGNAcGF5bG9hZA==", publisher: "Ransomware.live (Payload leak-site listing)", date: "2026-08-20", role: "corroborating" }
    discovery_trace: "first seen at: ransomware.live API, URL https://api.ransomware.live/v2/recentvictims (discovery of a CH-tagged 'Payload' listing for 'Qualiflex Datacenter | HWZ-Studiengänge (fh-hwz.ch), myenb.ch, etc', discovered 2026-08-20) -> pivot: WebSearch (\"HWZ Hochschule Wirtschaft Zürich Cyberangriff Datenleck 2026\") -> primary: Inside Paradeplatz, URL https://insideparadeplatz.ch/2026/08/22/cyber-attacke-konto-daten-von-hwz-studenten-geschnappt/ (victim-side confirmation) -> corroborating re-check: Ransomware.live victim page, URL https://www.ransomware.live/id/UXVhbGlmbGV4IERhdGFjZW50ZXIgfCBIV1otU3R1ZGllbmduZ2UgKGZoLWh3ei5jaCksIG15ZW5iLmNoLCBldGNAcGF5bG9hZA== (actor attribution + scope + claimed data volume)"
    summary: |
      The ransomware group Payload listed "Qualiflex Datacenter | HWZ-Studiengänge (fh-hwz.ch), myenb.ch, etc" on its leak site on 2026-08-20, claiming roughly 490 GB exfiltrated and naming eight affected customer domains of a Swiss IT-services/data-centre provider: fh-hwz.ch (HWZ Hochschule für Wirtschaft Zürich, a Zurich University of Applied Sciences business school), myenb.ch, schelling.ch, kaelteringag.ch, kaeltebucher.ch, cbmswiss.ch, vitabad.ch and ign8.ch. HWZ confirmed on 2026-08-22 (reported by Inside Paradeplatz) that its own analysis of the stolen data found personal information of current students and alumni — names, addresses, phone numbers, student-administration records, bank details, and health-notification (Krankmeldung) data — and stated the compromise occurred "über die Infrastruktur des Dienstleisters" (via the infrastructure of [an external] service provider) rather than HWZ's own systems. Neither HWZ's own statement nor any Swiss outlet found in this run's search names the provider as Qualiflex or attributes the intrusion to the actor Payload; that link exists only in the leak-site listing itself, which nonetheless names the exact domain (fh-hwz.ch) HWZ subsequently confirmed as breached, and the timing (listed 2026-08-20, HWZ statement 2026-08-22) is consistent with a single underlying event. The pattern is a shared-hosting/managed-IT provider compromise reaching multiple independent downstream Swiss organisations at once — a supply-chain-shaped exposure rather than a direct attack on any one victim.
