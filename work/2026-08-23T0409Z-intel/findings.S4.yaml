    extended_notes: |
      Defender takeaway: this is the third-party/MSP-mediated exposure pattern (T1199 Trusted Relationship) — one shared datacenter/IT-services compromise cascading into personal-data exposure at multiple independent downstream organisations that never had a direct intrusion of their own. For any Swiss public-sector body or SME, the actionable question is not "were we breached" but "which of our service providers hold a copy of our data, and would we hear about it within days if they were." No ransomware family, encryption event, or initial-access vector has been disclosed by either the actor or the victim — this remains a data-theft/extortion claim, not a confirmed encryption incident.
