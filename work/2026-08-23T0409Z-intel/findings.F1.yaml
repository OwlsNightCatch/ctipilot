    extended_notes: |
      Additional ATT&CK mapping vs. the surfacing pass: added T1003.001 (LSASS Memory, via comsvcs.dll
      memory dump — confirmed in the Securelist MDR-detection list) and T1572 (Protocol Tunneling, the
      SSH reverse tunnel Kaspersky observed) and T1027 (Obfuscated Files or Information — the
      Base64-encoded PowerShell service-install command Kaspersky says was deliberately split to evade
      EDR). Detection concepts (telemetry class first, unchanged from the surfacing pass plus the
      vendor rule names above): (1) file-write telemetry on the TrueConf server for an unexpected
      write to httpconf/site/public/js/locale.php or to ClientInstFiles/trueconf_windows_client_x64.exe
      outside a vendor-update window; (2) endpoint process-creation events showing the TrueConf client
      installer spawning a DLL load from %LOCALAPPDATA%\TrueConf\Client with a filename mimicking a
      Windows system component; (3) network/DNS egress telemetry showing a SERVER process (not a user
      browser/mail client) making outbound HTTPS calls to graph.microsoft.com or
      login.microsoftonline.com from a TrueConf host, or outbound calls to github.com API endpoints
      from a *nix TrueConf host — both anomalous for a videoconferencing appliance; (4) Windows
      service-creation events (4697/7045) for new services on a TrueConf server; (5) credential-access
      telemetry for comsvcs.dll invoked against lsass.exe (a classic LSASS-dump technique, not specific
      to this campaign but confirmed present here); (6) new outbound SSH client sessions initiated FROM
      a TrueConf server (reverse-tunnel indicator). Hardening unchanged: patch to 5.3.9/5.4.9/5.5.5; do
      not expose 4307/TCP to the internet; treat any TrueConf server that hosted external/contractor
      participants during the exposure window as compromised until forensically cleared; validate the
      client installer's signature against the vendor before trusting a server-distributed update. No
      IOCs reproduced here per pipeline policy.

      Minor sourcing footnote (not a substantive correction): the CISA KEV catalog's own "notes" field
      cites Kaspersky ICS-CERT URLs under the path /advisories/2026/08/11/... , while the live
      Kaspersky pages we fetched are under /vulnerabilities/... — a legacy/alternate path mismatch in
      CISA's notes field, not a broken advisory; both vulnerability pages were reachable at the
      /vulnerabilities/ path used throughout this record.

