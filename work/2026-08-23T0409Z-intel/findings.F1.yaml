      Security Response Team as a precaution (their precise role in this specific incident vs. broader
      squatting infrastructure is not stated by either primary).

      Detection concept (unchanged from S1, reinforced): build-time/CI telemetry — a cargo build/rustc
      child process initiating outbound network egress, or a compiler-toolchain process spawning and
          executing a downloaded binary from a temp directory (/tmp/rust-setup on Unix,
      %TEMP%\rust-setup.ps1 on Windows per Wiz), is anomalous in any CI environment; correlate with new
      Registry Run key / LaunchAgent / systemd user-service creation events immediately following a
      build invocation, and with DNS queries for algorithmically-generated .com domains if the primary
      C2 fails. Hardening: check ~/.cargo/registry/cache for cached copies of the six named crates
      (Wiz's and the Rust Project's find-command are identical); pin dependencies via Cargo.lock; do not
      resolve a sudden multi-version yank on a long-lived crate by blindly upgrading — treat it as an
      investigation trigger per Wiz's explicit recommendation; review new/changed build-dependencies
      entries, particularly networking crates (ureq, reqwest, rustls) with no legitimate reason to phone
      home during a build.

