    discovery_trace: "first seen at: wiz-blog, URL https://www.wiz.io/blog → primary: Wiz Research, URL https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns → corroboration: The Rust Project official blog, URL https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/ → F1 deep-read pivot: extracted Wiz's embedded Next.js __NEXT_DATA__ JSON payload directly (the rendered HTML is a JS-only shell with no server-rendered body) to recover the full DAST article body and its outbound links → pivot: Microsoft Security Blog Mastra write-up, URL https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/ (linked from Wiz's 'Overlap with DPRK Supply Chain Attacks' section) → pivot: Google Cloud / GTIG axios write-up, URL https://cloud.google.com/blog/topics/threat-intelligence/north-korea-threat-actor-targets-axios-npm-package (linked from the same section) → registry cross-check: entities/registry.yaml actor:sapphire-sleet already carries UNC1069 as a registered alias, sourced to AWS Security Blog/CyberScoop (2026-07-29) and Google Cloud/GTIG (2026-07-30), so both vendor-attribution threads Wiz cites resolve to the SAME already-tracked entity, not two unrelated actors"
    summary: |
      DEEP-READ RESULT: findings.S1.yaml's technical description holds up well against the full primary
      text (the malware-behavior description, the 86-107 minute exposure window, and the "no CVE
      assigned" fact are all confirmed verbatim), but the reach statistic needed exact-wording
      correction, one Wiz-issued self-correction was missed, and the attribution chain deserved
      tighter sourcing to the two vendors actually making each claim (Microsoft for Mastra/Sapphire
      Sleet, Google/Mandiant for axios/UNC1069) rather than reading as a single undifferentiated "DPRK
      overlap" claim.

      On 2026-08-20, an attacker who had taken over a crates.io publisher account pushed malicious
      versions of arrayref, internment and append-only-vec to crates.io — NOT simultaneously as the
      surfacing pass implied, but staggered across a 23-minute window: arrayref@0.3.10 published
      2026-08-20T07:15:00Z, internment@0.8.7 at 07:34:07Z, append-only-vec@0.1.9 at 07:37:49Z (all per
      the Rust Project's own blog post, which is also the source of the 07:15 UTC timestamp the
      surfacing pass attached to "the compromise" generally — that timestamp is specifically arrayref's
      publish time, and also happens to match when the Rust team received the initial report). All
      three declared a new build-time dependency on a freshly published typosquat, proc-macro1,
      impersonating the legitimate proc-macro2 crate (154M+ downloads per Wiz); notably, per Wiz,
      proc-macro1 "was the first dependency added to arrayref in its ten-year history" — a strong
      tell that the account, not the code, was compromised. The Rust Security Response Team credits
      discovery to a THIRD PARTY: "We'd like to thank the Research Team at Nextron Systems GmbH for
      initially discovering this and reporting it to us" — a detail the surfacing pass omitted
      entirely. The team deleted all three malicious versions plus proc-macro1 and five further
      attacker-controlled typosquat crates (proc-macro-en, aovine, arone, aronenao, tinymember — all
      versions) with exposure windows of 86 minutes (arrayref), 90 minutes (internment) and 107
      minutes (append-only-vec) — the surfacing pass's "86-107 minutes" range is exactly right — locked
      the compromised publisher account, and states: "We do not believe the author of arrayref to be
      acting maliciously, but their computer or credentials are likely compromised."

      proc-macro1's build.rs script runs automatically at compile time (before any of the parent
      crate's own code executes), reconstructs a C2 URL from Base64-encoded fragments, disables TLS
      certificate validation for its own callback, and downloads a platform-specific second-stage
      payload for x86_64 Linux/Windows/macOS and aarch64 macOS. The implant beacons over HTTPS POST,
      collects hostname/username/OS details and enumerates installed applications, and — per Wiz's own
      published correction to this same article — "queries the browsers' SQLite credential stores
      directly" for Chrome/Brave/Edge but does NOT decrypt or retrieve the actual credential material:
      "A prior version of this piece mistakenly stated that browser credentials were stolen. The
      queries only enumerate saved logins, they do not retrieve the encrypted credential material."
      This is a materially different claim from "collects credentials" and should be described as
      browser-data/saved-login enumeration, not credential theft. The implant persists via a Registry
      Run key (Windows), a LaunchAgent (macOS), or a systemd USER service (Linux — the surfacing pass
      said "systemd service" without the user-scope detail), supports kill / minicfg (reconfigure C2
      and beacon interval) / startup / runscript (execute PowerShell or shell scripts, sync or
      background) commands, and — a capability the surfacing pass did not mention — falls back to a
      Domain Generation Algorithm generating 10 algorithmic .com domains every 5 days if its primary C2
      is unreachable; Wiz states the DGA domains do not currently appear to be registered. Configuration
      is AES-128-GCM encrypted with a hardcoded key; command authentication uses an embedded RSA-2048
      private key.

      CORRECTION (exact wording/population): the reach claim is "arrayref can be found in over 35% of
      all environments. Even more notably, it's used in ¾ of all environments where Rust is present."
      Wiz does not define what population "all environments" is measured over (its own scanning
      customer base is the most likely reading, not a universal claim about all computing environments
      everywhere) — the surfacing pass's "35% of all software environments" and "three-quarters of all
      environments that use Rust at all" are reasonable paraphrases of the same two sentences but should
      not be presented as more precise than Wiz's own unscoped wording; this should ship with the
      population caveat rather than as a flatly stated percentage.

      Attribution, corrected to name each claiming vendor precisely: Wiz's own text states, without a
      hedged confidence qualifier of its own, "The arrayref infrastructure substantially overlaps with
      operations attributed to recent North Korean actors," based on three findings: (1) the arrayref
      beacon's endpoint path was previously used in the Mastra npm supply-chain campaign (140+
      compromised npm packages, June 2026), which MICROSOFT — not Wiz — "assesses with high confidence
      ... is attributable to Sapphire Sleet, a North Korean state actor that primarily targets the
      financial sector" (Microsoft's own wording, verified against its blog); (2) the arrayref C2 IP
      shares a TLS certificate issuer with separate Mastra-campaign infrastructure; (3) a
      victim-reported arrayref C2 IP also appears in GOOGLE THREAT INTELLIGENCE GROUP's (Mandiant's)
      analysis of a March 2026 axios npm compromise, which GTIG "attributes ... to UNC1069, a
      financially motivated North Korea-nexus threat actor active since at least 2018" (verified
      against Google Cloud's own blog); and (4) both the Mastra and axios campaigns' infrastructure sit
      in the same Hostwinds LLC /23 IP range. Notably, UNC1069 is already a registered alias of
      actor:sapphire-sleet in this pipeline's entity registry (via a separate 2026-07-29/30
      Amazon/Google cross-attribution), so Microsoft's Sapphire-Sleet attribution and Mandiant's UNC1069
      attribution point at the SAME tracked cluster rather than two distinct groups whose overlap with
      each other is itself unconfirmed — this strengthens, not weakens, the overall DPRK-nexus read,
      but it should be attributed correctly: Microsoft attributes Mastra; Mandiant/GTIG attributes
      axios; Wiz's own contribution is the infrastructure-overlap observation linking arrayref to both.
      No CVE or RUSTSEC advisory identifier has been assigned to the arrayref incident itself.
