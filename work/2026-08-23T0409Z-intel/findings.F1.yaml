# =====================================================================
# ITEM 1 — TrueConf Server CVE-2026-72529 / CVE-2026-72530 (Head Mare)
# =====================================================================
items:
  - title: "TrueConf Server pre-auth RCE chain (CVE-2026-72529/72530) added to CISA KEV — Head Mare (now tracked as an APT, not hacktivists) trojanizes the client installer to plant PhantomCore/PhantomGraph/PhantomHook/PhantomReact backdoors on meeting participants"
