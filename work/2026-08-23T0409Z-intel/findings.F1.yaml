    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (CVE-2026-72529/72530 newly listed 2026-08-20) → pivot: TrueConf vendor advisory, URL https://trueconf.com/blog/news/security-fixes-updates-and-advisories → pivot: Kaspersky ICS CERT per-flaw advisories, URL https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-missing-authentication-for-critical-function/ and https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-breakout-from-isolated-environment/ → primary exploitation report: Kaspersky ICS CERT, URL https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/ → F1 deep-read pivot: Kaspersky Securelist full technical write-up, URL https://securelist.com/head-mare-targets-trueconf-server-with-phantomcore/120988/ (found via WebSearch \"Head Mare APT Kaspersky Securelist sectors instrumentation electronics transportation energy IT software development\" while checking S1's unsourced sector-list claim) → verification pivot: NVD CVE-2026-72529 / CVE-2026-72530 detail pages (used only to confirm the CNA-submitted CVSS 3.1/4.0 vectors that Kaspersky's own ICS-CERT page failed to render server-side) → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-actively-exploited-trueconf-server-flaws/"
    summary: |
      DEEP-READ RESULT: the underlying technical picture in findings.S1.yaml is accurate on the exploit
      chain and patch versions, but THREE material corrections and several enrichments come from
      reading the primaries in full (see corrections block below for the itemized diffs).

      CISA added CVE-2026-72529 and CVE-2026-72530 to KEV on 2026-08-20. The two CVEs carry
      DIFFERENT remediation deadlines in the catalog itself, not a single shared one: CVE-2026-72529
      (missing authentication, CWE-306) has dueDate 2026-09-03; CVE-2026-72530 (code injection /
      sandbox escape, CWE-94) has dueDate 2026-08-23 (today). Both scores are as the CNA (Kaspersky
      Labs, per NVD's "CVSS information contributed by other sources" attribution) states them:
      CVE-2026-72529 = CVSS 3.1 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) / CVSS 4.0 9.3
      (CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N); CVE-2026-72530 = CVSS 3.1 9.0
      (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H) / CVSS 4.0 9.5
      (CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H). TrueConf's own vendor advisory
      table independently republishes the identical 3.1 vectors and scores, and separately lists the
      internal identifiers: KLCERT-26-057 = CVE-2026-72529 ("Service on 4307/TCP" affected component);
      KLCERT-26-058 = CVE-2026-72530 ("Isolated execution environment / code generation" affected
      component; also carries a Russian BDU identifier, BDU:2026-11247).

      Attack chain, confirmed against Kaspersky's ICS-CERT alert and its companion Securelist deep-dive
      (both dated 2026-08-11/12): an unauthenticated remote attacker connects to TrueConf Server on
      port 4307/TCP (open by default per TrueConf's own documentation) and invokes an undocumented
      function to run a script inside an isolated sandbox where OS-level libraries (io, os, etc.) are
      deliberately unavailable (CVE-2026-72529/KLCERT-26-057). A second flaw in the sandbox's code
      generation logic (CVE-2026-72530/KLCERT-26-058) lets the attacker escape that isolation and
      execute arbitrary OS commands with NT AUTHORITY\SYSTEM privileges. With SYSTEM access the
      attacker overwrites httpconf/site/public/js/locale.php with a PHP web shell and deletes the
      corresponding TrueConf event-log entries. Kaspersky's own internal testing found the underlying
      logic flaw predates the CVE-covered version ranges — "our internal analysis showed that all
      TrueConf server versions released since 2022 are vulnerable" — though the officially listed
      affected range is versions before 5.3, and 5.3.x/5.4.x/5.5.x prior to 5.3.9/5.4.9/5.5.5
      respectively; all three lines were fixed together on 2026-06-18, roughly two months before the
      KEV listing.

      From the web shell the attacker uses PowerShell (via the shell, not a separate RCE) to
      fingerprint the IT environment, gain privileged database access, and — the meeting-attendee
      impact vector — overwrite TrueConf Server's own distributed Windows client installer
      (ClientInstFiles/trueconf_windows_client_x64.exe) with an unsigned trojanized copy; Kaspersky
      confirms the malicious distributions it recovered carried no valid digital signature. Any
      meeting participant with an x64 Windows host who accepts the resulting "download the new
      client" prompt receives the genuine TrueConf client plus the PhantomCore backdoor, unpacked to
      %LOCALAPPDATA%\TrueConf\Client\api-ms-win-crt-time-l1-1-0-2.dll and set to auto-launch via a
      CLSID InprocServer32 registry key. On the compromised server itself, the web shell additionally
      installs PhantomGraph — a Windows-service-persisted (SysExcSvc.dll / SysReadSvc.dll) backdoor
      that Kaspersky states is used as a BACKUP C2 channel (primary post-compromise control stays on
      the web shell + remote PowerShell) over a compromised Microsoft OneDrive account's Graph API
      (graph.microsoft.com); the two DLLs are installed via a single Base64-encoded PowerShell command
      that Kaspersky assesses was deliberately split across the two service installs specifically to
      evade EDR. Kaspersky's Securelist detection-name list also documents credential-access and
      lateral-movement tradecraft not captured in the ICS-CERT alert alone: reconnaissance commands
      (hostname, whoami), an lsass.exe memory dump via the comsvcs.dll technique, and an SSH reverse
      tunnel.

      CORRECTION to the surfacing pass: on *nix TrueConf servers Head Mare installs not one but TWO
      distinct backdoors, both confirmed by Kaspersky's own detection-name list — HEUR:Backdoor.Linux.
      PhantomHook.a (a rootkit that hides its files and, by intercepting TrueConf's own network
      functions, listens for attacker commands smuggled inside the TrueConf protocol itself) AND
      HEUR:Backdoor.Linux.PhantomReact.a, a SEPARATE backdoor that uses GitHub as its command-and-
      control channel. Kaspersky's own report text states this as two back-to-back sentences about
      "*nix systems" ("On *nix servers running TrueConf, the attackers install a backdoor that hides
      its files... Furthermore, on *nix systems, the attackers install a backdoor that uses GitHub as
      a command and control channel"), and the associated YARA rule for the GitHub-C2 backdoor
      (apt_HeadMare_Github_Backdoor) checks for the ELF magic number, confirming it too is a Linux
      binary, not a Windows one. The surfacing pass's summary mentioned only the protocol-smuggling
      rootkit and omitted the GitHub-C2 backdoor entirely.

      CORRECTION: Kaspersky's Securelist write-up explicitly RECLASSIFIES Head Mare, stating "Previously,
      we classified them as hacktivists, but now we define them as an APT group due to the sophistication
      of their TTPs and the absence of destructive activity (encryption, wiping) in the targeted
      infrastructures." The surfacing pass's "hacktivist-aligned cluster" characterization is now Kaspersky's
      OWN SUPERSEDED classification, not its current one.

      CORRECTION (wording): sectors observed to date, per Securelist's exact phrasing, are "instrument
      manufacturing, electronics, transportation, energy, IT, and software development" — the surfacing
      pass wrote "instrumentation" for the first sector, which is not the term Kaspersky uses. Both
      Kaspersky documents describe targeting as exclusively Russian organizations; neither states or
      implies exploitation outside that set, so the surfacing pass's "no exploitation outside Russian
      targeting reported" conclusion stands confirmed on the full read.

      Kaspersky names three concrete KEDR Expert detection-rule identifiers for defenders building
      equivalent logic: unusual_php_file_creation_from_trueconf_process (the locale.php web-shell
      replacement plus TrueConf event-log deletion), unusual_file_creation_from_trueconf (the
      PhantomCore payload drop via the same replaced file), and unsigned_trueconf_installer (the
      trojanized client installer lacking a vendor signature). Kaspersky's MDR service additionally
      monitors: creation of suspicious files by TrueConf Server processes; execution of an unsigned
      TrueConf Client installer; suspicious process chains from TrueConf Client/update executables;
      new library registrations under HKEY_CURRENT_USER\Software\Classes\CLSID; lsass.exe
      reconnaissance and memory-dump activity via comsvcs.dll; and SSH tunnel creation.
    region_nexus: "primarily Russian critical-infrastructure targeting observed to date (Kaspersky names no victims outside Russia in either primary); global exposure wherever TrueConf Server is internet-reachable on 4307/TCP, including any EU organization whose staff join meetings hosted by a TrueConf-using contractor or partner"
