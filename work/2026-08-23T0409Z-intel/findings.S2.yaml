        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-08-21/was-zuerich-zu-mehr-resilienz-beitragen-kann"
    extended_notes: |
      Strategic/budgetary item, not a technical advisory — no attacker behaviour, no CVE, no incident.
