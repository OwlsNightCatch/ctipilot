coverage_gaps:
  - source_id: "STANDING ITEM — Berlin Landesnetz (Senate administrations) compromise"
    reason: >
      Checked every named lead (blogspan.net, itsicherheitnews.de, behoerden-spiegel.de, Tagesspiegel x2,
      therecord.media, wiwo.de, t-online.de, heise.de, audimax.de [403], watson.ch, berlin.de official
      press release, plus fresh WebSearches for 21/22 August updates) and NONE closes the gap the earlier
      fire flagged. STILL BLOCKED — no publishable access-vector/product/CVE/attacker-behaviour detail as
      of this run. Detail found, none sufficient: (1) wiwo.de (18 Aug, citing "Reuters, Sicherheitskreise"
      — anonymous, unconfirmed, and predates the last run's 20 Aug cutoff) reports "ein erfolgreicher
      Cyberangriff ... über eine PDF-Datei mit Schadsoftware, die ein Mitarbeiter in einer E-Mail geöffnet
      hatte" (a successful attack via a malware-laden PDF an employee opened in an email) — never repeated
      or confirmed by BSI/Senate Chancellery/LKA in any source found since. (2) blogspan.net and
      therecord.media (both 18 Aug, RBB-sourced) report only that "a vulnerability in the IT of the
      Senate Administration for Urban Development, Building and Housing" — infrastructure never migrated
      to the central ITDZ — was the entry point, with no product, CVE, or technical mechanism named. (3)
      As of the most recent status found (heise.de, 21 Aug 07:11, and it-boltwise.de, 22 Aug, both citing
      "Stand vom 21. August") both Senate administrations remain isolated from the Landesnetz, forensics
      are ongoing, no restoration timeline is given, no security vendor is named, and officials still
      state only that no sensitive data is known to have leaked. No official (BSI/Senate
      Chancellery/LKA) source names an access surface, product, CVE, or attacker behaviour. Recommend the
      row stays blocked until BSI or the Senate Chancellery issues a technical post-mortem, or the
      wiwo/Reuters PDF-attachment claim is corroborated by a named, authoritative source.
