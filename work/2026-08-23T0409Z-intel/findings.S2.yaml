      - quote: "Un accès non autorisé a touché la messagerie du secrétariat communal de Martigny-Combe, en Valais."
        attribution: "ICTjournal"
        source_url: "https://www.ictjournal.ch/news/2026-08-21/cyberattaque-en-valais-une-messagerie-de-la-commune-de-martigny-combe-compromise"
      - quote: "La commune indique avoir immédiatement bloqué l'accès concerné et mis en œuvre des mesures de sécurisation technique."
        attribution: "ICTjournal"
        source_url: "https://www.ictjournal.ch/news/2026-08-21/cyberattaque-en-valais-une-messagerie-de-la-commune-de-martigny-combe-compromise"
    extended_notes: |
      No source names the access vector (phishing, credential stuffing, or otherwise) or the mail
      platform — this is stated as a gap, not inferred. Second Valais commune incident of 2026 after the
      April 2026 Play ransomware attack on Vétroz (already covered), which may be worth a future
      sector-pattern synthesis if a third Valais commune is hit. techniques[] maps only the confirmed
      mailbox-compromise/collection behaviour; the onward "fraudulent mass message to contacts" step
      (leveraging a trusted government domain to reach third parties) has no dedicated ATT&CK id beyond
      the account-compromise technique already listed.
