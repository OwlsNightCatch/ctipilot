        summary: >
          Unauthorised access to the Valais commune of Martigny-Combe's municipal-secretariat mailbox,
          discovered 18 August 2026; roughly 300 emails with sensitive personal data taken and used to
          send a fraudulent mass message to the commune's contacts; reported to BACS, the cantonal DPO,
          and Valais cantonal police (ICTjournal / Le Nouvelliste, 2026-08-20/21).
    relation_suggestions: []
    verification: MULTI-SOURCE
