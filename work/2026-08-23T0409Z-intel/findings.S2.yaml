  - title: "Canton Zurich government approves a two-year, CHF 1.4m cyber/security resilience action plan — SME contact point building on BACS, drone-technology sovereignty, and input into the new federal security-policy strategy"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-08-21/was-zuerich-zu-mehr-resilienz-beitragen-kann", publisher: "SwissCybersecurity.net", date: "2026-08-21", role: primary }
    discovery_trace: >
      first seen at: WebSearch ("swisscybersecurity.net news August 2026") → primary:
      SwissCybersecurity.net, URL
      https://www.swisscybersecurity.net/news/2026-08-21/was-zuerich-zu-mehr-resilienz-beitragen-kann
      (relaying an official Regierungsrat decision; the Canton Zürich zh.ch press-release page for this
      specific decision could not be located — its news-search filter returned "no results" on fetch).
    summary: |
      The Zurich cantonal government (Regierungsrat) approved an action framework on or around 21 August
      2026 to strengthen the canton's contribution to national resilience against cyber, drone and
      disinformation threats, running autumn 2026 to end-2028 at a cost of CHF 1.4 million (CHF 175,000/
      year for project-management staffing plus CHF 1.08 million for implementation measures), housed in
      the cantonal Office of Economy from October 2026. The plan names three directions: "Sensibilisieren"
      (assess the impact of the security-policy situation on the population and economy, and feed input
      into the Confederation's evolving security-policy strategy), "Schützen" (a central point of contact
      for SMEs on supply-chain cybersecurity, explicitly built to leverage the federal cybersecurity
      office BACS's existing offerings rather than duplicate them, plus work on "technological sovereignty"
      in drone and counter-drone technology), and "Vernetzen" (university-industry knowledge transfer and
      public/private collaboration). The framing cites European airport disruption from drones and rising
      cyberattacks weakening Swiss SMEs as the drivers.
    region_nexus: "Switzerland (Canton Zurich) — home-region policy development"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities:
      - key: "policy:zurich-canton-cyber-resilience-plan-2026"
        type: policy
        name: "Canton Zurich cyber/security resilience action plan (2026-2028)"
        aliases: []
        summary: >
          CHF 1.4m, two-year (autumn 2026-end 2028) Canton Zurich government framework with three
          directions — awareness/federal-strategy input, an SME cybersecurity/supply-chain contact point
          built on BACS's existing offerings plus drone-sovereignty work, and university-industry
          networking (SwissCybersecurity.net, 2026-08-21).
    relation_suggestions: []
