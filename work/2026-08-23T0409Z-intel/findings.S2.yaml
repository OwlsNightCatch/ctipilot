      https://www.bacs.admin.ch/de/im-fokus, and the incidents page moved to
      https://www.bacs.admin.ch/de/aktuelle-vorfaelle. Both new URLs render fine under WebFetch (the
      aktuelle-vorfaelle page is still a Nuxt SPA that returns a JS-only shell to the bridge's direct GET —
