items:
  - title: "Swiss municipality Martigny-Combe (Valais): unauthorised access to the communal email account leads to theft of 300 e-mails and a mass fraudulent message sent to its contacts"
    sources:
      - { url: "https://www.ictjournal.ch/news/2026-08-21/cyberattaque-en-valais-une-messagerie-de-la-commune-de-martigny-combe-compromise", publisher: "ICTjournal", date: "2026-08-21", role: primary }
      - { url: "https://www.lenouvelliste.ch/valais/bas-valais/martigny-district/martigny-combe-commune/cyberattaque-a-la-commune-de-martigny-combe-300-courriels-contenant-des-donnees-sensibles-ont-ete-voles-1511002", publisher: "Le Nouvelliste", date: "2026-08-20", role: corroborating }
      - { url: "https://www.vibration108.ch/martigny-combe-victime-dune-cyberattaque-visant-sa-messagerie-communale/", publisher: "Vibration108 / Radio Chablais", date: "2026-08-20", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("Cyberangriff Gemeinde Kanton Schweiz August 2026") which surfaced
      inside-it.ch's "Erneuter Cyberangriff auf eine Walliser Gemeinde"
      (URL https://www.inside-it.ch/erneuter-cyberangriff-auf-eine-walliser-gemeinde-20260821 — 403'd on
      WebFetch, not retried) → pivot: WebSearch ("Martigny-Combe cyberattaque messagerie email piratage
      août 2026") → primary: ICTjournal, URL
      https://www.ictjournal.ch/news/2026-08-21/cyberattaque-en-valais-une-messagerie-de-la-commune-de-martigny-combe-compromise
      → corroborating: Le Nouvelliste, URL
      https://www.lenouvelliste.ch/valais/bas-valais/martigny-district/martigny-combe-commune/cyberattaque-a-la-commune-de-martigny-combe-300-courriels-contenant-des-donnees-sensibles-ont-ete-voles-1511002
      (fetched via bridge after a WebFetch 403; confirmed the "300 courriels" figure from its
      meta/og:description) → corroborating: Vibration108/Radio Chablais, URL
      https://www.vibration108.ch/martigny-combe-victime-dune-cyberattaque-visant-sa-messagerie-communale/
    summary: |
      The Swiss commune of Martigny-Combe (Valais) discovered on 18 August 2026 that the professional
      mailbox of its municipal secretariat had been accessed without authorisation. The attacker
      retrieved emails from the account — Le Nouvelliste's headline puts the number at 300 messages
      "containing sensitive data" — and used the compromised, trusted municipal account to mass-send a
      fraudulent message to the commune's own contacts on the same day, creating a follow-on phishing /
      identity-theft exposure for everyone who received it. No source names the initial access vector
      (credential phishing, credential stuffing, or a separate compromise) or the mail platform in use.
      The commune blocked the mailbox and put technical remediation measures in place immediately on
      discovery, reported the incident to the federal cybersecurity office (BACS/OFCS — Switzerland's
      renamed NCSC) and to the Valais cantonal data-protection and transparency commissioner, and filed a
      criminal complaint with the Valais cantonal police. This is the second disclosed cyberattack on a
      Valais commune in 2026, after Play ransomware paralysed IT at the commune of Vétroz in April.
    region_nexus: "Switzerland (Valais) — home-region public-sector target"
    primary_sector_nexus: "direct"
