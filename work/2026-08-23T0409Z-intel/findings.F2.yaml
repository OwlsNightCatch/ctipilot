quote_discipline_notes: |
  1) Check Point's page renders several sentence-internal word breaks with HTML non-
     breaking-space entities (&nbsp; / U+00A0) -- almost certainly a WordPress widow-
     prevention artifact. A naive tag-strip (tags -> empty string, per instruction) left
     these as literal U+00A0 bytes, which silently broke `grep -F` against otherwise-
     correct quotes (visually indistinguishable from a normal space in any rendered view).
     Fixed by normalizing U+00A0 -> U+0020 in the stripped text before grep verification --
     confirmed via `cat -A` (showed as `M-BM-` byte pairs) that this was a real encoding
     artifact, not a quote error. Reusable lesson for future quote-discipline passes:
     normalize nbsp before grep, or verification will FALSE-NEGATIVE genuinely-correct
     quotes from WordPress-rendered pages.
  2) Two quotes in findings.S3.yaml are NOT literal substrings of their cited primaries.
     Both read as grammatically smoother versions of the source that drop or alter a
     clause mid-sentence -- classic de-hedging/splicing. Neither is a large distortion of
     meaning, but neither is a literal quote as required. See `corrections_to_S3` under
     item2-spectre-byovd and item1-btr-reforged below for the exact fix (literal substring,
     grep-verified).

attack_id_correction_global: |
  T1562.001 ("Disable or Modify Tools", formerly a Defense-Evasion subtechnique of T1562
  "Impair Defenses") is REVOKED in the pinned attack/enterprise-attack.json (ATT&CK v19.2)
  -- both T1562 and T1562.001 carry revoked=true, revoked_by=T1685. T1685 ("Disable or
  Modify Tools") is the successor: now a stand-alone top-level technique under the
  restructured "defense-impairment" tactic (part of the same v19 Defense-Evasion
  reorganization CLAUDE.md already flags). findings.S3.yaml uses the revoked T1562.001 in
  ALL THREE items reviewed here. Corrected to T1685 in every techniques[] list below --
  the main agent should sanity-check the rest of this run's S1-S4 output for the same drift
  (check_run.py WARNs on unknown/revoked ids, but this confirms the exact revocation before
  that gate runs).
  Separately, findings.S3.yaml's BTR item (item1-btr-reforged) lists T1553.002 ("Subvert
  Trust Controls: Code Signing") -- this is a mismapping, not just a revocation. T1553.002's
  own definition (verified against the pinned dataset) is "adversaries may CREATE, ACQUIRE,
  OR STEAL code signing materials to sign THEIR OWN malware" -- BTR.sys is genuinely,
  unmodified Microsoft-signed; nothing is forged, stolen, or subverted. That absence of
  subversion IS the finding (signature enforcement is irrelevant because the driver never
  needed to lie about its identity). Dropped T1553.002; added T1564.004 ("Hide Artifacts:
  NTFS File Attributes"), which precisely matches the ADS-based (":changelist") config-
  delivery/hiding mechanism that is the article's actual core technique. All other
  technique ids used across the three S3 items (T1190, T1068, T1055.012, T1055.004,
  T1134.001, T1014, T1027, T1003.002, T1555.003, T1071.001, T1505.003, T1136.001, T1105,
  T1543.003) were checked against the pinned dataset and are active (revoked=false,
  deprecated=false) -- no other corrections needed.

items:
  - id: item1-btr-reforged
    title: "Check Point Research: Windows Defender's own boot-time remediation driver (BTR.sys) is a signed, unblockable LOLDriver kernel primitive for arbitrary file/registry operations"
    deep_dive: true
    sources:
      - { url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/", publisher: "Check Point Research", date: "2026-08-20", role: "primary", fetch_method: "bridge:url", status: 200, saved_as: "work/2026-08-23T0409Z-intel/checkpoint-btr-text.txt" }
      - { url: "https://thehackernews.com/2026/08/microsoft-defenders-own-driver-can-be.html", publisher: "The Hacker News", date: "2026-08-21", role: "corroborating", fetch_method: "bridge:url", status: 200, saved_as: "work/2026-08-23T0409Z-intel/hackernews-btr-text.txt" }
    discovery_trace: "carried from findings.S3.yaml (outage-backfill listing walk of research.checkpoint.com, confirmed via WebSearch) -- re-verified this run by direct re-fetch of both cited URLs; both resolved 200 and content matches the S3 discovery."

    what_it_is_and_where_it_ships_from: |
      BTR.sys ("Boot Time Removal Tool") is a genuine, Microsoft-signed Windows Defender
      component, embedded as a PE resource ("BOOTTIMETOOL") inside MpEngine.dll. It is
      dropped to disk under System32\drivers with a randomized 8-character filename
      ([a-z]{8}.sys) ONLY when a Defender remediation action needs a reboot to complete
      (e.g., a locked file must be deleted). It is architecturally a "one-shot" driver:
      loads, executes a queued list of transactions, reports status, and immediately
      requests its own unload. Check Point's researcher (Jiri Vinopal) found it by accident
      during an incident-response investigation -- telemetry that looked like attacker
      kernel-loader tradecraft (randomized driver name, transient service, RC4 routines,
      ADS interaction, self-cleanup) turned out to be this legitimate Defender mechanism,
      which triggered the deeper reverse-engineering effort that produced this research.

    configuration_delivery_and_protection_mechanism: |
      BTR.sys exposes no standard IOCTL interface. Instead, at driver-load time it reads
      the `Args` value of its own transient Service Registry key, which is a file path to
      an NTFS Alternate Data Stream on the driver file itself (e.g.
      `driver.sys:changelist`) -- i.e., the configuration is stored as hidden data attached
      to the driver's own file object, not as a separate visible file. That ADS contains an
      RC4-encrypted binary transaction blob. The RC4 key is a 256-byte value hard-coded in
      the driver's own .rdata section (mechanism, not reproduced here) and Check Point
      confirmed -- across 18 unique Microsoft-signed 64-bit driver builds recovered from
      Winbindex + VirusTotal, spanning every BTR.sys shipped since Windows 7 -- that this
      key is identical in all of them. Integrity is enforced with a modified CRC-32
      variant (the article denotes it "~CRC32"): standard CRC-32 polynomial/init, but the
      final bitwise-inversion step is omitted, so the result is the bitwise complement of a
      normal CRC-32. Each of the four structures in the transaction format (Global Header,
      Global Payload, Item Header, Item Data) carries its OWN independent CRC, reset to the
      initial value each time -- i.e., the checks are non-cumulative and cannot be chained,
      which specifically defeats a tamper approach where modifying one structure's contents
      could be compensated by adjusting a later structure to keep an aggregate checksum
      valid. On success the driver returns 0xC0000056 (STATUS_DELETE_PENDING) rather than
      STATUS_SUCCESS -- an anti-forensics-relevant detail: this specific code is what
      signals the kernel to immediately unload the driver and mark its driver object for
      deletion, so it doesn't linger in memory for a live-response kernel-module enumeration
      to catch.

    action_ids_and_primitives: |
      The RC4-decrypted transaction is a serialized list of "Items," each with a 4-byte
      Action ID. Check Point enumerates and implements six:
        - Action 1 (Delete File): kernel-level deletion that bypasses exclusive file locks.
        - Action 2 (Delete Directory): removes an empty directory.
        - Action 3 (Move/Quarantine): moves a file from a source to a destination path.
          WEAPONIZATION: if the destination path is empty this behaves as a delete; if the
          destination path is attacker-controlled and valid, this becomes an ARBITRARY
          FILE WRITE/MOVE primitive (Check Point's own example: dropping a file into
          System32\drivers).
        - Action 4 (Delete Key): deletes a registry key and its subkeys.
        - Action 5 (Delete Value): deletes a single registry value; parses the target
          string by locating a double-backslash separator between key path and value name
          (a parsing detail Check Point calls out as a "critical finding" -- standard
          single-backslash paths do not work against this parser).
        - Action 6 (Set Value): ARBITRARY REGISTRY WRITE, and can create the key path
          itself if it does not already exist. WEAPONIZATION: usable for persistence (Run
          keys, Services) or to disable security controls (Tamper Protection settings, EDR
          configuration values).
      So of the six, Action 3 is the arbitrary-file-write primitive and Action 6 is the
      arbitrary-registry-write / persistence-creation primitive; both are explicitly named
      as such by Check Point (quotes below).

    why_unblockable_by_signature_or_wdac: |
      BTR.sys is a required, functionally-intended, Microsoft-signed Windows component that
      Defender's own remediation feature depends on -- it is not a third-party driver with
      a discrete, patchable vulnerability. Adding it to the Microsoft Vulnerable Driver
      Blocklist or blocking it via WDAC would break Defender's own legitimate boot-time
      remediation capability for every Windows install, which is why neither control has
      been (or credibly could be) applied to it. Check Point frames this explicitly as the
      textbook "Living-off-the-Land Driver" (LOLDriver) case: unlike BYOVD, which depends on
      a known-vulnerable THIRD-PARTY signed driver that CAN be blocklisted once identified,
      this technique needs no external driver at all -- the tool extracts BTR.sys from the
      machine's own local MpEngine.dll every time, so there is no static third-party binary
      or hash for a blocklist to key on in the first place.

    golden_window_boot_phase_argument: |
      BTR.sys cannot run as SERVICE_BOOT_START (Start=0) -- empirical testing showed it
      fails immediately at that phase because its DriverEntry needs file I/O (reading the
      ADS config, writing its log) and, during Phase 0, the Windows Object Manager has not
      yet established the SystemRoot symbolic link and the storage stack is not fully
      initialized. So the driver must run as SERVICE_SYSTEM_START (Start=1), and Check
      Point stages it in the "Boot Bus Extender" load-order group to land as early as
      possible in Phase 1 -- this exactly mirrors how MpEngine.dll stages it for legitimate
      remediation. Check Point's own boot-time Procmon trace (fully patched Windows 11
      25H2) gives concrete component-loaded/not-loaded state at each phase:
        - Phase 0 (Start=0, Boot): WdBoot.sys (Defender's ELAM boot driver) loads, then
          WdFilter.sys (Defender's minifilter) loads, then Ntfs.sys loads. Security
          filters ARE active here, but "operating in a limited standalone capacity without
          real-time user-mode intelligence" (no MsMpEng.exe yet to feed it policy/cloud
          lookups).
        - Phase 1 ("Golden Window", Start=1, System): BTR.sys loads and executes its
          payload ~0.32 seconds after WdFilter.sys loads; UCPD.sys (User Choice Protection
          driver, also Start=1 but in a lower-priority group) loads ~56 milliseconds AFTER
          BTR.sys -- i.e., BTR.sys preempts UCPD and can modify protected user-choice
          registry keys before UCPD is present to stop it.
        - Phase 2 (Start=2/3, user-mode services via SCM): MpDefenderCoreService.exe loads
          ~34 seconds after BTR.sys finished, then MsMpEng.exe (the actual Defender AV
          service) loads shortly after that -- roughly 34 seconds behind BTR.sys. WdNisDrv
          .sys (network inspection driver) loads nearly 4 minutes after BTR.sys.
      So NOT yet present during the golden window: MsMpEng.exe (user-mode Defender
      service -- the piece that would otherwise lock/self-protect its own binaries),
      UCPD.sys, and WdNisDrv.sys. Present but only in a "dormant"/standalone capacity:
      WdFilter.sys and WdBoot.sys. Check Point's own tests in this window: successful
      deletion of WdFilter.sys, MsMpEng.exe, and WdNisDrv.sys binaries before Defender's
      user-mode service could start (so the service fails to start at all, "preventing
      self-healing, cloud reporting, etc."), and successful deletion of Defender's Service
      Registry keys (e.g., the WdFilter service key) at RUNTIME despite Tamper Protection
      being active, because Tamper Protection is "primarily enforced against user-mode
      processes" and this operation originates from a kernel-mode, signed driver.

    msrc_decision_and_stated_reason: |
      Check Point's own account (not a direct MSRC quote -- MSRC's own words are not quoted
      in either source; this is Check Point's paraphrase of what MSRC communicated back
      after responsible disclosure): "Following responsible disclosure, MSRC confirmed that
      these findings do not meet the criteria for immediate servicing, as the technique
      relies on pre-existing administrative privileges (SeLoadDriverPrivilege)." Check
      Point's own framing of the underlying rationale: "The issue is not a vulnerability in
      the traditional sense, but rather an architectural trust boundary that can be crossed
      if an attacker already has administrative privileges." No CVE has been assigned to
      this finding (verified: zero "CVE-" substrings anywhere in the Check Point article
      body). The Hacker News additionally reports, sourced to Vinopal's own GitHub README
      for the PoC tool (NOT to Check Point's article body, and NOT a Microsoft statement):
      "No patch is planned" -- explicitly caveated by the Hacker News as "a characterization
      Microsoft has not confirmed publicly." Recommend the entry keep these two provenance
      levels distinct: MSRC's servicing decision (Check Point's account, carve-out-grade
      primary) vs. the researcher's own "no patch planned" characterization (HN-relayed,
      unconfirmed by Microsoft).

    itw_status_statement: |
      Check Point Research, in its own article: "During our analysis across all collected
      samples and telemetry sources, we did not observe evidence of real-world abuse of
      BTR.sys in the manner demonstrated in this research. This suggests the technique is
      currently unknown or unused by threat actors, making proactive detection engineering
      feasible before weaponization appears in the wild." This exact sentence is ALSO
      present verbatim on The Hacker News's page (both are grep-confirmed literal matches),
      so it should be attributed directly to Check Point Research as primary, with The
      Hacker News noted only as an independent corroborating re-publication of the same
      Check Point statement -- not as the originating source (S3's evidence entry
      attributed it "(via The Hacker News)", which undersells that it's on Check Point's own
      page too).

    affected_version_range_and_cve: |
      Confirmed: "from Windows 7 Build 7601 (released in 2011), through Windows 8.1 and
      Windows 10 22H2, up to the latest fully updated Windows 11 25H2 (as of July 2026)".
      No CVE exists for this finding. A DIFFERENT, unrelated CVE touches the same driver
      file historically -- see new_details_beyond_S3 below -- but it is not connected to
      this technique.

    detection_concepts_sysmon_ids_verified: |
      All Sysmon/Windows-Event-Log detection concepts the surfacing pass (findings.S3.yaml)
      listed are the ARTICLE'S OWN "Detection Opportunities" section content, verbatim --
      NONE were inferred or added by the S3 surfacing pass. Verified against Check Point's
      own text line-by-line:
        - Event ID 15 (FileCreateStreamHash) -- Check Point's own words: "high fidelity."
          Both legitimate use and abuse create a `:changelist` ADS on the driver file
          (Sysmon captures the encrypted RC4 payload in the Contents field); Check Point's
          stated DIFFERENTIATOR is where the FEEDBACK report is written -- abuse (their PoC)
          directs it to a second ADS on the same driver file, legitimate MpEngine.dll usage
          directs it to a standalone file under a protected ProgramData path. Detection
          logic Check Point states directly: alert on Event ID 15 where TargetFilename ends
          in `.sys:changelist`; secondarily alert on `.dat` streams created on `.sys` files.
        - Event ID 23 (FileDelete) immediately following Event ID 6 (DriverLoad) of a
          BTR.sys-hash binary, with the deleting process attributed to System (PID 4) rather
          than any user-mode tool -- Check Point's own detection logic: correlate PID 4
          deleting security binaries right after a matching DriverLoad.
        - Event ID 6 (DriverLoad) lineage check: legitimate loads are dropped/registered by
          MsMpEng.exe; Check Point's stated abuse indicator is a DriverLoad matching a known
          BTR.sys hash where the file-drop parent/image is OUTSIDE the Defender process tree
          (e.g., cmd.exe, powershell.exe, or an unknown binary).
        - Event ID 12/13 (RegistryEvent) creating a service key whose Args value contains
          `:changelist` and whose Group is "Boot Bus Extender" -- Check Point's stated
          differentiator is the ABSENCE of a corresponding Windows Event ID 7045 ("A
          service was installed"), because legitimate MpEngine.dll usage goes through the
          Service Control Manager (CreateServiceW, which DOES generate 7045), while direct
          registry-key creation + the undocumented NtLoadDriver syscall bypasses the SCM
          entirely and generates no 7045.
        - Event ID 11 (FileCreate) + Event ID 23 (FileDelete) -- rapid create-then-delete of
          `\SystemRoot\Temp\BootClean.log` by System (PID 4); Check Point notes this log
          path is hardcoded in the driver and fires "regardless of the caller."
      Check Point's stated mitigation is explicitly procedural, not a patch: restrict
      SeLoadDriverPrivilege assignment, and build EDR/behavioral rules that flag
      security-vendor driver loads occurring outside the vendor's own expected process
      lineage, "regardless of their digital signature." Check Point's own closing framing
      of the LOLDriver defense gap: the Vulnerable Driver Blocklist / WDAC does not protect
      against functionally-intended drivers like this one; defense-in-depth needs to include
      the CONTEXT of driver loads and ADS creation, not just driver-hash matching.

    new_details_beyond_S3:
      - "Historical precedent on the SAME driver file, different vulnerability: in February 2021, SentinelLabs researcher Kasif Dekel disclosed CVE-2021-24092 -- a LOCAL PRIVILEGE ESCALATION flaw that let a non-administrator overwrite arbitrary files by placing a hard link at the driver's log path; Microsoft patched it 2021-02-09. Per The Hacker News, Dekel's own explanation for why it went undiscovered for years mirrors why BTR.sys draws attention now: the driver is normally absent from disk (dropped with a random name, then purged), so it evades routine static scanning. This is unrelated background context, not part of the current BTR Reforged finding -- flagging so the composer doesn't conflate the two, but it's a legitimate 'this component has drawn scrutiny before' data point for a deep-dive."
      - "The Hacker News frames a comparative historical precedent: FIN7's AvNeutralizer previously demonstrated the same class of technique (a genuinely built-in Windows driver -- Windows' own ProcLaunchMon.sys, alongside the Process Explorer driver -- repurposed as a kernel-mode primitive against endpoint security software, rather than a third-party vulnerable driver). Useful comparative framing for a deep dive: this is not the first time 'weaponize a built-in signed driver instead of BYOVD' has been documented in the wild, though Check Point states it found no ITW abuse of BTR.sys specifically."
      - "The presentation venue (Black Hat USA 2026 main-stage briefing + DEF CON 34, Las Vegas) is sourced to The Hacker News's reporting, NOT to the Check Point article body text -- confirmed via grep that neither 'Black Hat' nor 'DEF CON' appears anywhere in the Check Point page's own text. Not a contradiction (HN is a reputable corroborating source reporting on the talk), just a sourcing-attribution correction: cite HN for the venue fact specifically."
      - "Check Point's own article DOES link out to a public PoC repository (confirmed via href scan of the raw HTML: github.com/Dump-GUY/BTR_CLI, MIT-licensed) -- same repo The Hacker News names in its body text. RECOMMENDATION: do not include this repository link (or the driver-extraction/payload-construction/service-creation command syntax visible in the source) in the published entry -- per the deep-dive instruction ('do not reproduce... exploit steps') and the pipeline's no-operational-detail policy, this crosses from 'behavior description' into 'working tool location.' Mention only that a research PoC exists and has been published under an open-source license, without the URL."
      - "Check Point's own References/outbound links (from the raw HTML, not visible anchor text) also point to: Microsoft's own official Vulnerable-Driver-Blocklist design documentation, the Sysinternals Sysmon download page, the loldrivers.io project, the Winbindex driver-version-lookup tool, and (for unrelated demo-video context) the public mimikatz GitHub repo. None are IOCs; they are the researcher's own citation trail and may be useful color for a deep-dive's further-reading framing, but are not load-bearing claims requiring separate verification."
      - "The RC4 key has reportedly been unchanged for over 15 years across every BTR.sys build Microsoft has shipped since Windows 7 -- Check Point's own words: 'These findings highlight a remarkable consistency in the internal BTR.sys codebase — retaining the same hard-coded RC4 key and configuration structure for over 15 years.' Useful scale/severity color for a deep dive (this is not a recently-introduced weakness)."

