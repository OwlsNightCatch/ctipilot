  - id: item3-agentic-ai
    title: "Cisco Talos: UAT-10147 uses agentic AI end-to-end across exploitation -- vulnerability discovery, exploit-chain construction, payload validation and intrusion documentation"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary", fetch_method: "bridge:url", status: 200, saved_as: "work/2026-08-23T0409Z-intel/talos-agentic-text.txt" }
    discovery_trace: "carried from findings.S3.yaml -- re-verified this run by direct re-fetch; resolved 200, byline 'Joey Chen', published Thursday, August 20, 2026 06:00 (same author and publish-timestamp as the SPECTRE companion post)."

    cve_list_confirmation: |
      Mass-exploitation CVE set, each id grep-confirmed as a LITERAL transcription from
      Talos's own article text (i.e., correctly carried forward from the record that owns
      the claim -- Talos is the one asserting these were the CVEs exploited in this
      campaign):
        - CVE-2022-27925 -- Talos's own description: "an unauthenticated RCE in the Zimbra
          Collaboration Suite." NUANCE (not a transcription error, a characterization
          nuance worth flagging): per Volexity's original August 2022 mass-exploitation
          reporting and CISA AA22-228A, CVE-2022-27925 alone is a Zimbra mboximport
          directory-traversal / arbitrary-file-write flaw that historically required
          authentication; it became unauthenticated RCE only when CHAINED with
          CVE-2022-37042 (an authentication-bypass flaw in MailboxImportServlet). Talos's
          article does not mention CVE-2022-37042 or the chaining requirement -- it simply
          labels CVE-2022-27925 itself "an unauthenticated RCE." This IS the common
          industry shorthand for the pair (many outlets refer to "the Zimbra unauthenticated
          RCE, CVE-2022-27925" for the same reason), so this is not treated as an error in
          transcription, but the entry should not imply CVE-2022-27925 is unauthenticated
          in isolation without at least the option of noting the historical chaining
          nuance if space allows.
        - CVE-2021-23758 -- "an AjaxPro deserialization RCE." Transcribed as stated.
        - CVE-2021-29441 and CVE-2021-29442 -- Talos: "an arbitrary code execution
          vulnerability within the Nacos framework... leverages the ScriptEngineFactory
          Service Provider Interface." WebSearch-corroborated (GitHub Security Lab
          GHSL-2020-325/326, CVE record descriptions): CVE-2021-29441 is a Nacos
          User-Agent authentication-bypass flaw, CVE-2021-29442 is a missing-authentication
          flaw on Nacos's Derby database management endpoint -- both real, both correctly
          numbered, both consistent with Talos's framing that these are chained to reach an
          RCE primitive (auth bypass -> unauthenticated management-endpoint access ->
          script-engine code execution). No transcription concern.
        - CVE-2019-18935 -- "a well-known .NET JSON deserialization vulnerability affecting
          Telerik UI for ASP.NET AJAX." Transcribed as stated; this is a well-known,
          widely-exploited public CVE, consistent with Talos's description.
        - Linux LPE chain: CVE-2022-0995 (Linux kernel watch_queue OOB write), CVE-2021-3156
          ("Baron Samedit" sudo heap overflow), CVE-2015-5287 (ABRT sosreport symlink
          handling), CVE-2015-3246 (libuser roothelper /etc/passwd corruption), CVE-2010-3904
          (Linux kernel RDS protocol rds_page_copy_user arbitrary kernel-memory write),
          CVE-2022-0847 ("Dirty Pipe" pipe-buffer overwrite of read-only files) -- all six
          grep-confirmed as literal transcriptions of Talos's own per-CVE description
          sentences, and all six are well-established, correctly-described public CVEs
          consistent with my own knowledge of each. No id flagged as unconfirmable.

    target_list_scale_claim: |
      Confirmed exact match against S3: approximately 170,000 URLs recovered from the
      actor's C2 open directory, split by the actor into 17 files of ~10,000 URLs each
      "because scanning the entire list at once is inefficient and time consuming." NEW
      DETAIL beyond S3: Talos notes the actor uses the letter "w" as an internal reference
      to the Chinese character "萬" (10,000) in its own list-splitting tooling/commands --
      a Chinese-language operational-tradecraft artifact worth including as corroborating
      color for the "Chinese-speaking adversary" attribution, distinct from the AI-tooling
      findings.

    named_ai_tooling: |
      Confirmed matches against S3: DeepAudit (source-code vulnerability-scanning
      framework, found installed on the actor's OWN management server -- Talos: "we assess
      with high confidence that they intend to use it to identify vulnerabilities within
      target website source code or third-party package libraries" -- NOTE this specific
      claim carries HIGH confidence, a DIFFERENT and higher confidence level than the
      overall campaign-level 'moderate-to-high confidence' assessment; do not conflate the
      two in the entry) and PentestGPT (observed installed on the C2 server, used to
      "dynamically scan web servers and execute relevant proof-of-concept exploits").
      Additionally supporting (not AI tools themselves, but the AI-generated ARTIFACTS
      built around them): the ysoserial.exe .NET deserialization payload generator, and
      badsecrets (open-source tool for looking up leaked/known ASP.NET MachineKey values) --
      both named by Talos as tools the AI-generated playbook instructs the actor to use, not
      themselves AI-driven.

    process_start_finding_and_oob_pivot: |
      This is confirmed as the single most defender-useful item in the piece. Exact wording
      (Talos's own, verified as TWO separate sentences in the source -- see corrections_to_S3
      for the exact splice S3 introduced by merging them): "Time-based blind testing (e.g.,
      ping -n 10 or timeout /t 10) is entirely ineffective for confirming ViewState RCE."
      followed by "Because Process.Start() is asynchronous and returns immediately, no
      execution delay is observable from the HTTP response." The AI-generated playbook's
      documented pivot: out-of-band (OOB) HTTP callbacks via certutil, PowerShell + curl,
      and DNS nslookup polling a webhook.site endpoint to confirm execution. A SEPARATE,
      closely-related finding worth keeping alongside this one: the playbook documents that
      a successful ViewState-deserialization exploit attempt returns HTTP 500 with an
      InvalidCastException (proving the MachineKey was correct and the payload deserialized)
      -- Talos's own framing: "This inverted success condition is a defensive blind spot:
      network monitoring tools that alert on 5xx responses may generate excessive noise,
      while the actual exploit succeeds silently in the error stream." This second point is
      a distinct, equally defender-relevant hunting insight (WAF/error-rate alerting tuned
      to treat ALL 5xx as noise will miss this exact class of successful exploitation) and
      is worth keeping in the entry alongside the Process.Start()/time-based-testing point,
      not folded into it.

    defender_exclusion_and_persistence_steps: |
      Confirmed matches against S3: privilege escalation via a renamed EfsPotato binary
      (staged as "prcc1.rar"), then PowerShell Add-MpPreference -ExclusionPath plus direct
      registry `reg add` writes to
      HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths, targeting
      C:\Windows\SysWOW64\inetsrv and C:\Windows\System32\inetsrv (the standard IIS module
      directories) -- both the PowerShell cmdlet path and the direct-registry path are used
      redundantly. Persistence: a scheduled task disguised as "Google Chrome Start", run at
      highest privileges at every logon, executing the backdoor; separately, a rogue local
      user account is created and added to BOTH the local Administrators group and the
      Remote Desktop Users group for persistent RDP access.

    victim_geography_and_sectors: |
      Confirmed exact match against S3: Brazil, Bolivia, China, Canada, and Vietnam;
      sectors named by Talos: government, universities, media, technology, and gaming.

    confidence_wording_agentic_ai_assessment: |
      Confirmed exact literal quote: "Talos assesses with moderate-to-high confidence that
      UAT-10147 is among an emerging class of financially motivated intrusion operators
      leveraging agentic AI systems to operationalize offensive tradecraft at scale." This
      MUST ship as Talos's assessment at Talos's own stated confidence level
      (moderate-to-high), never flattened to established fact -- confirmed S3 already did
      this correctly for this specific quote (the fabricated splice found in this item is a
      DIFFERENT quote -- see corrections_to_S3).

