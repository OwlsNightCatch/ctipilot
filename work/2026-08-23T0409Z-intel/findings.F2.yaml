  - id: item2-spectre-byovd
    title: "Cisco Talos: UAT-10147's SPECTRE implant unlinks EDR kernel callbacks via BYOVD, using ftrace-based rootkit hiding on Linux"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary", fetch_method: "bridge:url", status: 200, saved_as: "work/2026-08-23T0409Z-intel/talos-spectre-text.txt" }
    discovery_trace: "carried from findings.S3.yaml -- re-verified this run by direct re-fetch; resolved 200, byline 'Joey Chen', published Thursday, August 20, 2026 06:00 (Talos's own timestamp)."

    confirmed_against_primary:
      drivers_and_cves: "RTCore64.sys (MSI, CVE-2019-16098) and DBUtil_2_3.sys (Dell, CVE-2021-21551) -- both confirmed exact-match against S3. Talos's own mechanism description: SPECTRE downloads one of the two from C2, writes it to %TEMP%, installs it as a transient kernel service via the SCM, and opens an IOCTL handle to the device -- i.e., these are the vulnerable-driver arbitrary kernel read/write primitives being reused, not a new vulnerability."
      callback_structures_unlinked_and_blinding: "PspCreateProcessNotifyRoutine, PspCreateThreadNotifyRoutine, PspLoadImageNotifyRoutine -- confirmed exact match. Mechanism (Talos's own words, mechanism only, no addresses/offsets reproduced): SPECTRE uses NtQuerySystemInformation to locate ntoskrnl.exe in kernel address space, then a hardcoded per-build offset table covering 13 Windows versions to calculate the notify-routine array addresses, then performs targeted kernel writes that unlink each registered callback entry from its doubly-linked list. Effect: kernel-callback-dependent EDR is blinded to new PROCESS CREATION, THREAD CREATION, and IMAGE LOAD events 'for the remainder of the session' -- i.e., this is a session-scoped blind spot, not a permanent one; a reboot (or presumably an EDR self-heal/re-registration path Talos does not describe) would restore callback registration."
      edr_products_named: "CrowdStrike Falcon, SentinelOne, Microsoft Defender, named explicitly by Talos, plus an unspecified 'and other well-known EDR vendors' -- do not over-claim beyond these three named products in the entry."
      privilege_escalation_and_credential_theft_talos_words: |
        Privilege escalation: named-pipe impersonation. SPECTRE creates a pipe named
        "\\.\pipe\spectre_<tid>" (note the leading \\.\ prefix -- S3's summary dropped it)
        and acquires a SYSTEM token via ImpersonateNamedPipeClient.
        Credential theft, three distinct mechanisms Talos describes, notably ALL avoiding
        LSASS:
          1. Hive dumping: with SYSTEM privileges, HKLM\SAM\SAM, HKLM\SYSTEM, and
             HKLM\SECURITY are saved to %TEMP% via RegSaveKeyA "for offline NT hash
             extraction" -- Talos's own text names a well-known offline-hash-extraction
             tool at this point but the word is rendered oddly in the source page body
             ("Impact 'secretsdump.py'" -- almost certainly the article intends
             "Impacket's secretsdump.py", a well-known public tool, but the literal source
             text reads "Impact"; flagging as a probable source-side typo rather than
             silently correcting it in a quote -- safe to describe descriptively in prose
             ("a well-known offline NT-hash-extraction tool") without quoting the odd
             fragment).
          2. Vaultdump: spawns cmdkey.exe /list with stdout capture to enumerate Windows
             Credential Manager entries -- Talos's own emphasis: "without any LSASS
             access."
          3. Chromedump: copies Chrome and Edge login-data and Local State files to %TEMP%
             for offline DPAPI decryption -- Talos names the offline-decryption tool as
             SharpChrome (a detail S3's summary omitted; useful for a hunt query on
             companion-tool staging).
      c2_via_ads: "C:\\Windows\\System32\\drivers\\etc\\hosts:cache -- exact path match against S3. Talos's own framing: this lets the actor rotate C2 configuration by modifying the ADS, 'circumventing firewall blocklists without needing to recompile the binary' -- i.e., the technique's specific evasion value is against static/hash-based and recompile-triggered detection, not against ADS-aware EDR telemetry."
      linux_persistence: "Kernel module disguised as acpi_pad.ko (mimicking the legitimate ACPI processor power-management module); systemd unit 'hardware-monitor.service' (description string: 'Hardware Performance Monitor') -- NEW DETAIL beyond S3: the unit is configured with 'Before=sysinit.target', which Talos states ensures the rootkit loads on every boot BEFORE any security tooling initializes -- a boot-ordering persistence primitive worth calling out explicitly in the entry, not just 'a systemd unit'."
      signal_driven_hiding: "Confirmed via kill() syscalls to magic PID 0x7A69 (decimal 31337). Signal 62 = hide process (unlinks task_struct from the kernel PID list, so /proc/<pid> becomes invisible). Signal 36 = hide the module itself (unlinks THIS_MODULE from the kernel module linked list, hiding it from lsmod). Signal 37 = escalate the calling process to UID 0 by directly overwriting its credential structure. NEW DETAIL beyond S3: Signal 35 is a module-load acknowledgement HANDSHAKE (not a hiding/privesc action) -- S3's summary listed only 62/36/37 and omitted this fourth signal; worth including for completeness of the IPC command set, even though it's not itself an evasion primitive."
      ftrace_hooks: "FTRACE_OPS_FL_IPMODIFY redirecting SIX syscall-adjacent entry points -- confirmed exact match against S3's five-name list once tcp4/tcp6 are counted separately: hooked_tcp4_seq_show, hooked_tcp6_seq_show, hooked_tkill, hooked_tgkill, hooked_kill, hooked_getdents64. Talos's own framing of WHY this evades detection: ftrace is a legitimate kernel debugging interface, so hooking through it (rather than patching the syscall table directly) 'produces minimal noise in kernel integrity checks' -- i.e., this specifically targets integrity-checking tools that watch the syscall table but not ftrace registration state."

    ai_assessment_exact_wording_and_confidence:
      rootkit_specific_claim: |
        Talos's exact words (grep-verified literal substring, NOT the S3-as-written splice
        -- see corrections_to_S3 below): "Talos investigated the source code of the Specter
        rootkit and assesses with medium confidence that UAT-10147 leveraged a combination
        of AI-assisted development and human expertise in the creation of this rootkit,
        which is designed to be invoked directly by SPECTRE."
        This MEDIUM-confidence assessment is scoped specifically to the Specter Linux
        ROOTKIT's source code and rests on four pieces of evidence Talos itself lists (all
        four grep-confirmed present in the article; S3's summary captured only three of
        the four):
          1. Documentation structure: the source's opening comment block is a full,
             bulleted feature list with parenthetical technical elaboration that reads like
             "a response to a prompt such as, 'Write a rootkit with the following
             features'" -- Talos's own framing: "It is the AI narrating what it is about to
             produce."
          2. Uniform decorative separators: identical width/formatting applied consistently
             across 10+ logical sections -- "machine-like uniformity."
          3. Pedagogical tone: inline comments explaining basic concepts (taint flags, the
             mechanics of `cat /proc/sys/kernel/tainted`) that "an actual developer... would
             not need to explain... to themselves."
          4. [OMITTED FROM S3's SUMMARY] Multiple redundant methods: three distinct
             approaches explicitly labeled "Method 1," "Method 2," "Method 3" in inline
             comments -- Talos frames this as "a common artifact of AI generation. When
             prompted to be thorough, AI models tend to output all known approaches. In
             contrast, a human developer targeting a specific kernel would simply select and
             implement the single most effective method." Recommend the entry add this
             fourth evidence point; it's a distinctive, defensible signal (multi-method
             completeness reflex) that stands on its own as a hunting/attribution heuristic
             independent of this specific actor.
      broader_unqualified_claim: |
        SEPARATE from the medium-confidence rootkit-specific claim above, Talos also makes
        a broader, un-confidence-qualified statement earlier in the article: "we assess that
        UAT-10147 is gradually incorporating AI-assisted development into its operations,
        likely to support the creation and refinement of tools used across its campaigns.
        Specifically, both its custom-developed backdoor, SPECTRE, and custom-developed
        rootkit, Specter, exhibit indications of AI-assisted development." This extends the
        AI-development suggestion to the SPECTRE BACKDOOR itself, not just the Specter
        rootkit -- but Talos does not enumerate specific evidence for the backdoor the way
        it does for the rootkit. Recommend the entry keep these separate: (a) medium
        confidence, rootkit source code specifically, four enumerated evidence points; (b)
        an unqualified broader assessment that BOTH SPECTRE and Specter show AI-development
        indications, without the same evidentiary enumeration.
      third_distinct_and_lower_confidence_claim: |
        A THIRD, separately-scoped observation (also NOT the medium-confidence rootkit
        claim, and S3's summary conflated this into the same sentence as the rootkit
        assessment): PDB build-path strings inside the actor's custom-compiled EfsPotato and
        RustPotato privilege-escalation tools reference a literal "Desktop\AI\" directory in
        the build environment (e.g., "C:\Users\iis\Desktop\AI\EfsPotatoCpp\..."). Talos's
        own framing carries NO formal confidence qualifier here -- it is described only as
        "a fascinating detail, strongly suggesting that the threat actor may be leveraging
        AI to assist in the development of these tools." This is weaker-worded than the
        rootkit's explicit "medium confidence," and concerns different tools (the Potato
        family, not SPECTRE/Specter) -- recommend NOT presenting this as part of the
        medium-confidence rootkit assessment, as S3's original summary phrasing risked doing
        by listing the PDB-path detail in the same breath as the rootkit's confidence level.
      xshen_attribution_note: |
        NEW DETAIL beyond S3: Talos separately assesses WITH MEDIUM CONFIDENCE (its own
        wording: "we assess with medium confidence to be associated with") that several
        SEO-fraud-related components in this campaign are linked to an actor/developer alias
        Talos calls "x神" ("xshen"), previously mentioned in an earlier Talos post -- basis
        given: PDB path strings embedded in the BadIIS samples and installer referencing
        that alias in Chinese, plus other "X"-branded artifacts (an ASHX config string
        "X-seo", a web-shell "X-ID" HTTP header). This links to the entity registry's
        existing `campaign:cisco-talos-badiis-demo-pdb-maas-isapi-backdoor-lwxat-dragon`
        record (verified present in entities/registry.yaml, no "xshen"/"x神" alias on that
        record yet) -- S3's relation_suggestion linking actor:uat-10147 to that campaign key
        is confirmed accurate and worth keeping; additionally worth flagging to the main
        agent that the registry record could gain "xshen"/"x神" as an alias, though that is
        the main agent's registry-write call, not mine to make.

