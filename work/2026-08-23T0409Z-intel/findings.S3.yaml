  - title: "Cisco Talos: UAT-10147 uses agentic AI end-to-end across exploitation — vulnerability discovery, exploit-chain construction, payload validation and intrusion documentation"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: outage-backfill listing walk of blog.talosintelligence.com, URL https://blog.talosintelligence.com/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/ (confirmed via WebSearch (\"Talos \\\"UAT-10147\\\" SPECTRE BadIIS agentic AI blog\"))"
    summary: |
      Cisco Talos assesses with moderate-to-high confidence that UAT-10147 represents an emerging
      class of financially motivated intrusion operators using agentic AI systems to operationalize
      offensive tradecraft at scale, rather than merely for scripting assistance. Initial access is
      mass exploitation of ~170,000 candidate URLs (split into 17 target lists of ~10,000 each) via
      known CVEs run through Metasploit: CVE-2022-27925 (Zimbra Collaboration Suite unauthenticated
      RCE), CVE-2021-23758 (AjaxPro deserialization RCE), CVE-2021-29441/29442 (Nacos
      ScriptEngineFactory arbitrary code execution), CVE-2019-18935 (Telerik UI for ASP.NET AJAX JSON
      deserialization), and a Linux privilege-escalation set (CVE-2022-0995, CVE-2021-3156,
      CVE-2015-5287, CVE-2015-3246, CVE-2010-3904, CVE-2022-0847). Talos recovered AI-generated
      operational artifacts from actor infrastructure: a 9-section ASP.NET ViewState-deserialization
      RCE playbook documenting ValidationKey/MachineKey extraction via badsecrets, a ysoserial.exe
      TypeConfuseDelegate gadget-chain configuration (with an explicit correction of a mistaken belief
      that .NET 4.8 patches these chains), and — most notably for defenders — a documented lesson that
      time-based blind RCE confirmation (ping -n 10, timeout /t 10) fails against ViewState RCE because
      .NET's Process.Start() returns asynchronously, so the actor pivoted to out-of-band callbacks
      (certutil, PowerShell curl, DNS nslookup, and polling the webhook.site API) to confirm execution.
      Four companion Python scripts generated by AI tooling automate post-exploitation diagnostics
      (baseline write-capability tests, webroot ACL exfiltration, appcmd-based IIS physical-path
      discovery), SPECTRE deployment via ViewState-based certutil download with PowerShell
      Test-Path/Get-Item.Length verification, ASHX web-shell staging through a two-step
      upload-handler-then-payload chain, and structured reconnaissance (webroot enumeration, appcmd
      list site, whoami /priv) via UTF-16-LE Base64-encoded PowerShell. On Windows, the chain also
      elevates via EfsPotato (renamed to evade detection) and then adds
      C:\Windows\SysWOW64\inetsrv and C:\Windows\System32\inetsrv to the Windows Defender exclusion
      list via registry writes and Add-MpPreference, before dropping BadIIS, a rogue local-admin
      account with RDP access, and QuasarRAT/Gh0stCringe/SPECTRE via scheduled tasks disguised as
      "Google Chrome Start". Talos names DeepAudit (a source-code vulnerability-scanning framework)
      and PentestGPT as the actor's AI-driven reconnaissance and exploit-validation tooling. Victims
      span government, university, media, technology and gaming sector servers in Brazil, Bolivia,
      China, Canada and Vietnam.
    region_nexus: "global; the technique class (mass CVE exploitation against internet-facing web/collaboration platforms, AI-accelerated exploit validation and post-exploitation automation) is directly transferable to EU/Swiss public-sector web estates running any of the named vulnerable components"
