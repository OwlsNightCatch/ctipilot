        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "The technique relies on pre-existing administrative privileges (SeLoadDriverPrivilege)."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "During our analysis across all collected samples and telemetry sources, we did not observe evidence of real-world abuse of BTR.sys in the manner demonstrated in this research."
        attribution: "Check Point Research (via The Hacker News)"
        source_url: "https://thehackernews.com/2026/08/microsoft-defenders-own-driver-can-be.html"
    extended_notes: |
      Detection concept from the source (Sysmon-based, IOC-free): Event ID 15 for `.sys:changelist`
      ADS creation where the feedback path targets a secondary ADS rather than a genuinely protected
      path; Event ID 23 for file deletions by the System process (PID 4) immediately following a
      driver load; Event ID 6 for a load of a BTR.sys-hash driver occurring outside Defender's own
      process lineage; Event ID 12/13 for a service key created with a `:changelist` Args value under
      the "Boot Bus Extender" group with no matching Event ID 7045; and Events 11/23 for rapid
      creation/deletion of BootClean.log. Mitigation is procedural, not a patch: restrict
      SeLoadDriverPrivilege assignment and build EDR rules that flag security-vendor driver loads
      occurring outside the vendor's own service lineage.

  - title: "Red Canary's July 2026 threat-tracking round-up: four new top-10 debuts (GraphSpy, Phexia, CastleRAT, EtherRAT) push EtherHiding-style blockchain C2 into the commodity mainstream"
    sources:
      - { url: "https://redcanary.com/blog/threat-intelligence/intelligence-insights-august-2026/", publisher: "Red Canary", date: "2026-08-20", role: "primary" }
      - { url: "https://www.sysdig.com/blog/etherrat-dprk-uses-novel-ethereum-implant-in-react2shell-attacks", publisher: "Sysdig", date: "2025-12-08", role: "corroborating" }
    discovery_trace: "first seen at: redcanary source-id (rotational slice) via RSS, URL https://redcanary.com/feed/ → primary: Red Canary, URL https://redcanary.com/blog/threat-intelligence/intelligence-insights-august-2026/ → corroborating: Sysdig, URL https://www.sysdig.com/blog/etherrat-dprk-uses-novel-ethereum-implant-in-react2shell-attacks (linked from the Red Canary post)"
    summary: |
      Red Canary's monthly threat-tracking round-up (covering July 2026 telemetry, published
      2026-08-20) records four new entrants to its top-10 most-prevalent-threats list, three of them
      sharing a blockchain-based "dead drop resolver" C2 technique (ATT&CK T1102.001) that Google's
      threat-intelligence group previously termed EtherHiding. GraphSpy is an open-source Entra
      ID/Microsoft 365 device-code-phishing tool that runs a local web server presenting a
      browser-based GUI — Red Canary notes this materially lowers the skill bar for AiTM-style Entra ID
      attacks — and can steal Primary Refresh Tokens, register Windows Hello for Business keys, and
      exfiltrate SharePoint/OneDrive/Teams data; it is the third distinct device-code-phishing tool to
      enter Red Canary's top 10 in 2026. Phexia is a macOS RAT/stealer delivered through malicious
      copy-paste ("ClickFix"-style) commands chaining curl → osascript → LaunchAgent persistence, which
      resolves its C2 by querying a specific Polygon smart contract
      (0xA3a603F8a454a9c905b4c579Bb72628F7C15C2A0) via public Polygon RPC endpoints, with Telegram and
      Steam profiles as backup channels. CastleRAT (Python and C variants, delivered via CastleLoader
      and ClearFake precursors) provides keylogging, screen capture and remote shell, and resolves a
      dead drop via steamcommunity.com or adversary-controlled domains. EtherRAT is a Node.js-based RAT
      for both Windows workstations and Linux servers that retrieves C2 URLs from public Ethereum RPC
      smart-contract storage and is delivered via malicious MSI installers disguised with .ini/.tmp/.dat
      extensions; Red Canary notes it has reportedly been distributed as an RMM precursor ahead of
      ransomware deployment. Red Canary's stated mitigation for the whole EtherHiding class is to block
      or tightly monitor egress to public RPC endpoints (it links chainlist.org as the enumeration
      source for that blocklist). Two long-tracked threats exited the top 10 for the first time since
      being added: Atomic Stealer (first exit since August 2025) and NetSupport Manager (first exit
      since September 2024).
    region_nexus: "global; the underlying C2 technique (public blockchain RPC as dead-drop resolver) and the device-code-phishing vector are both directly applicable to any EU/Swiss organization running Microsoft 365/Entra ID or permitting egress to public blockchain RPC endpoints"
