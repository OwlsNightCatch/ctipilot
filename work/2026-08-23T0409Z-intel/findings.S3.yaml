    discovery_trace: "first seen at: kommunaler-notbetrieb-de source-id (rotational slice), URL https://kommunaler-notbetrieb.de/ → pivot: WebSearch (\"Senatsverwaltung Berlin Cyberangriff August 2026 Landesnetz\") → primary: Behörden Spiegel, URL https://www.behoerden-spiegel.de/2026/08/18/cyber-angriff-trifft-zwei-berliner-senatsverwaltungen/ → pivot: WebSearch (\"Berlin Cyberangriff Bezirksämter Wohngeld Verzögerung August 2026\") → primary (fresher, in-window delta): Tagesspiegel, URL https://www.tagesspiegel.de/berlin/wohngeld-larmschutz-halteverbote-diese-folgen-hat-der-hackerangriff-fur-berlinerinnen-und-berliner-15964877.html"
    summary: |
      Two Berlin Senate administrations — Urban Development, Construction and Housing, and Mobility,
      Transport, Climate Protection and Environment — were preventively disconnected from the Berlin
      state network (Landesnetz) on 14 August 2026 after forensic investigation confirmed a
      "compromising of the Berlin state network." Reporting on 20 August 2026 (Tagesspiegel) documents
      the cascading operational impact: because all twelve Berlin district administrations
      (Bezirksämter) depend on the same shared applications hosted by the two disconnected Senate
      administrations, the outage blocked payment processing for over 50,000 households' Wohngeld
      (housing-benefit) claims, blocked the "Bildung und Teilhabe" (education and participation)
      benefit supporting disadvantaged children, halted noise-protection permits, parking-ban/moving-
      permit and scaffold-placement approvals, and stalled building-permit and monument-protection
      applications. Online postal-voting-document requests were briefly unavailable and were restored
      the following morning; Interior Senator Iris Spranger stated election preparation and vote
      counting were unaffected. Later reporting on 22 August (referenced via the kommunaler-notbetrieb.de
      tracker) records the outage cascading to "restrictions in many citizen services" across all
      district offices. Officials cite a malware infection introduced via an opened email attachment
      as the initial-access vector; the Berlin State Criminal Police (LKA), the State Prosecutor's
      Office and the Federal Office for Information Security (BSI) are investigating, and the Senate
      is withholding further technical detail "for investigative-tactical reasons." Governing Mayor Kai
      Wegner said reconnecting the disconnected administrations would likely take several more days as
      of 19–20 August; no fixed recovery date has been given.
