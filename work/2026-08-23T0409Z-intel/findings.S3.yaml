  - title: "Check Point Research: Windows Defender's own boot-time remediation driver (BTR.sys) is a signed, unblockable LOLDriver kernel primitive for arbitrary file/registry operations"
    sources:
      - { url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/", publisher: "Check Point Research", date: "2026-08-20", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/microsoft-defenders-own-driver-can-be.html", publisher: "The Hacker News", date: "2026-08-20", role: "corroborating" }
    discovery_trace: "first seen at: outage-backfill listing walk of research.checkpoint.com, URL https://research.checkpoint.com/ → primary: Check Point Research, URL https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/ (confirmed via WebSearch (\"Check Point Research \\\"BTR Reforged\\\" Defender remediation driver kernel\")) → corroborating: The Hacker News, URL https://thehackernews.com/2026/08/microsoft-defenders-own-driver-can-be.html"
    summary: |
      Check Point Research (researcher Jiří Vinopal), presented at Black Hat USA 2026/DEF CON 34,
      shows that BTR.sys ("Boot-Time Removal Tool"), a Microsoft-signed kernel driver shipped as a PE
      resource inside MpEngine.dll and used by Defender's own boot-time remediation feature, exposes a
      generalized kernel-mode execution primitive once its internal protocol is understood — with no
      software vulnerability exploited. The driver's transaction configuration is delivered as an
      RC4-encrypted binary blob stored in an NTFS Alternate Data Stream on the driver file (e.g.
      driver.sys:changelist); all 18 driver versions the researcher examined share the same hard-coded
      256-byte RC4 key, and integrity is checked with a modified, non-cumulative CRC-32 per structure.
      The decrypted transaction supports six action IDs an attacker can chain in one payload: delete
      file, delete directory, move/quarantine (which becomes an arbitrary-write primitive when the
      destination path is attacker-controlled), delete registry key, delete registry value, and set
      registry value (which can create missing key paths, enabling persistence). BTR.sys cannot be
      added to Microsoft's Vulnerable Driver Blocklist or blocked via WDAC without breaking Defender's
      own legitimate remediation function, because it is a required, functionally-intended Windows
      component carrying a valid signature — a textbook "living-off-the-land driver" (LOLDriver) case
      where signature-based trust fails as a control. The researcher's proof-of-concept, BTR_CLI
      (MIT-licensed on GitHub), automates the full pipeline: extracting the legitimate driver from the
      local MpEngine.dll, generating a correctly-CRC'd RC4-encrypted configuration, staging it in the
      ADS, creating a randomized service/driver entry, and triggering execution via NtLoadDriver or
      boot scheduling, with automatic cleanup including deletion of the driver's own BootClean.log to
      remove forensic traces. A separate "golden window" is identified by configuring the driver as
      SERVICE_SYSTEM_START in the "Boot Bus Extender" service group: at that boot phase, WdFilter.sys
      (Defender's minifilter) is loaded but has no user-mode intelligence yet, MsMpEng.exe has not
      started, and UCPD.sys (User Choice Protection) has not yet loaded, so the filesystem is writable
      while the security service itself is dormant — letting the technique delete AV/EDR binaries
      before they can lock themselves or self-protect. Microsoft's MSRC reviewed the findings and
      confirmed they do not meet servicing criteria because the technique requires pre-existing
      administrative privilege (SeLoadDriverPrivilege); no patch or blocklist update has been issued,
      and the vendor treats it as a privilege-escalation tool, not a vulnerability. Check Point states
      it found no evidence of real-world abuse across its collected samples and telemetry.
    region_nexus: "global; applies to every Windows 7 through Windows 11 25H2 endpoint running Windows Defender, which includes the large majority of EU/Swiss public-sector and CI Windows estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: []
    techniques: [T1562.001, T1553.002, T1027, T1543.003]
    affected_products: ["Microsoft Windows Defender (BTR.sys / Boot-Time Removal Tool, embedded in MpEngine.dll)", "Microsoft Windows 7 through Windows 11 25H2"]
    entity_keys: []
    new_entities:
      - { key: "tool:btr-sys-loldriver-primitive", type: tool, name: "BTR.sys weaponization (BTR Reforged / BTR_CLI)", aliases: ["Boot Time Removal Tool abuse"],
          summary: "Technique and PoC tool (BTR_CLI) that repurposes Microsoft Defender's own signed BTR.sys boot-time remediation driver into a generalized kernel-mode file/registry-operation primitive for AV/EDR neutralization; requires pre-existing admin privilege, no CVE assigned (Check Point Research, 2026-08-20)." }
