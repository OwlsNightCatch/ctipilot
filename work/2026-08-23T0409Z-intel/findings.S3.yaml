  - title: "Cisco Talos: UAT-10147's SPECTRE implant unlinks EDR kernel callbacks via BYOVD, using ftrace-based rootkit hiding on Linux"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: outage-backfill listing walk of blog.talosintelligence.com, URL https://blog.talosintelligence.com/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/ (confirmed via WebSearch (\"Talos \\\"UAT-10147\\\" SPECTRE BadIIS agentic AI blog\"))"
    summary: |
      Cisco Talos disclosed SPECTRE, a cross-platform C backdoor operated by a Chinese-speaking
      intrusion actor it tracks as UAT-10147, targeting compromised IIS and Linux web servers for
      SEO-fraud monetization via BadIIS. The Windows variant implements 45 commands (24 plaintext,
      21 encrypted) and performs BYOVD EDR neutralization: it downloads a vulnerable driver from C2
      (RTCore64.sys, CVE-2019-16098, or DBUtil_2_3.sys, CVE-2021-21551), installs it as a transient
      kernel service, resolves ntoskrnl.exe via NtQuerySystemInformation, and — using a hardcoded
      per-build offset table covering 13 Windows versions — performs targeted kernel writes that
      unlink PspCreateProcessNotifyRoutine, PspCreateThreadNotifyRoutine and PspLoadImageNotifyRoutine
      callback entries from their doubly-linked lists, blinding kernel-callback-dependent EDR (Talos
      names CrowdStrike Falcon, SentinelOne, Microsoft Defender) to process creation, thread creation
      and image-load events. Process injection uses standard hollowing (svchost.exe default), APC
      EarlyBird injection, and automated self-hollowing into RuntimeBroker.exe. Privilege escalation
      abuses named-pipe impersonation (creates \pipe\spectre_<tid>, calls ImpersonateNamedPipeClient
      to acquire a SYSTEM token). Credential theft avoids LSASS entirely: SAM/SYSTEM/SECURITY hive
      dumping via RegSaveKeyA, cmdkey.exe /list enumeration (Vaultdump), and offline Chrome/Edge
      login-data copy for later DPAPI decryption (Chromedump). C2 configuration updates ride an NTFS
      Alternate Data Stream on the hosts file (C:\Windows\System32\drivers\etc\hosts:cache), letting
      the actor rotate C2 without recompiling and without touching a firewall-visible file change. The
      Linux variant (29 plaintext commands) persists via a systemd unit "hardware-monitor.service" and
      a kernel module masquerading as "acpi_pad.ko"; its rootkit uses ftrace with
      FTRACE_OPS_FL_IPMODIFY to redirect syscall entry points (hooked_tcp4/6_seq_show, hooked_kill,
      hooked_tkill, hooked_tgkill, hooked_getdents64) and takes signal-based commands via kill()
      syscalls to a magic PID 31337: signal 62 hides a process (removes its task_struct from the
      kernel PID list), signal 36 hides the module itself (unlinks from the kernel module list), and
      signal 37 escalates the caller to UID 0 by overwriting its credential structure. Talos assesses
      with medium confidence that the Linux rootkit's source incorporated AI-assisted code generation
      — citing a feature-list documentation structure that reads like an LLM's response to "write a
      rootkit with the following features," uniform section formatting, pedagogical inline comments
      explaining basic /proc/sys/kernel/tainted mechanics, and PDB build-path strings referencing
      "C:\Users\*\Desktop\AI\" inside companion EfsPotato/RustPotato privilege-escalation tools. No
      exploitation of a new vulnerability is involved beyond the two named old vulnerable-driver CVEs;
      the finding is entirely behavioral/architectural.
    region_nexus: "global; server-side compromise pattern (IIS/Linux) applicable to any internet-facing web-server estate, including EU/Swiss public-sector and CI web infrastructure"
