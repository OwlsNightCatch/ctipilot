  summary: "Check Point states only 'a driver (internally identified as BTR.sys) appeared on disk under System32\\drivers with a randomized filename and a corresponding randomized service name' and, for the PoC, 'It generates a randomized filename for the driver (e.g., Random.sys)'. The eight-character length is generalised from the single example name in the article (mzqnjtaq). The entry presents it as a property of the mechanism, which is the kind of detail a reader turns into a detection rule."
