- code: F10
  category: quantifier-without-source
  section: deep-dive
  item: "btr-sys-defender-remediation-driver-kernel-primitive"
  url_or_quote: "Check Point recovered eighteen distinct signed 64-bit builds spanning every BTR.sys shipped since Windows 7"
  summary: "The completeness quantifier is the entry's own. Check Point (fetched and grepped this iteration) says: 'Combining these 5 builds with distinct BTR.sys samples (unique SHA-256 hashes) identified on VirusTotal at the time of analysis, and after de-duplication against the Winbindex dataset, we obtained a total of 18 unique 64-bit Microsoft-signed versions (distinct Authentihashes) of the BTR.sys driver.' A best-effort Winbindex+VirusTotal collection is not 'every BTR.sys shipped since Windows 7'; the article's Windows 7-to-11 span refers to the BTR_CLI tool's test matrix, not to sample coverage. The rest of the sentence ('found the hard-coded key identical in all of them') is supported: 'all versions share the same hard-coded 256-byte RC4 key'."
