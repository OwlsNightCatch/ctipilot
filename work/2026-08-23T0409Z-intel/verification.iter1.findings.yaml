  category: editorial-advisory
  section: threat-landscape
  item: "spectre-uat-10147-byovd-edr-callback-unlink; gtig-russia-clusters-app-passwords-whatsapp-linking"
  url_or_quote: "techniques: [..., T1055.012, T1055.004, ...]"
  summary: "Technique ids that the sources support but the body never describes, against the store rule that the body describes each mapped behaviour in plain language. SPECTRE maps T1055.012 (Process Hollowing) and T1055.004 (APC injection) — both genuinely in Talos ('The first is standard process hollowing, which targets \"svchost.exe\" by default. The second is APC EarlyBird injection...') — but the entry's body explicitly sets the command set aside ('The interesting half is not the command set but how each variant makes itself unobservable') and never mentions injection. GTIG maps T1218.005 (Mshta) on the strength of Talos-equivalent wording 'a HEADRUSH sample ... ultimately led to an HTML Application (HTA) downloader', while the body says only 'leading to a scripted downloader'. Either add a clause or drop the id. All 44 technique ids across the eleven entries were checked against the pinned ATT&CK v19.2 dataset: every one is active, none revoked or deprecated, and the T1685 substitution the run made is correct."
- code: F15
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "trueconf-server-kev-head-mare-trojanized-installer"
  url_or_quote: "the group also overwrite a JavaScript file under the server's public web path with a PHP web shell"
  summary: "Minor factual imprecision that could misdirect a hunt. Kaspersky names the file as '…\\public\\js\\locale.php' — a PHP file that happens to live in the js directory, not a JavaScript file. A responder reading this would look for modified .js files. The entry's own action item gets it right ('check the web-accessible script directory for a modified locale.php')."
