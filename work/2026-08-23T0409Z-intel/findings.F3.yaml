  # ============================================================
  # ITEM 4 — GTIG: three Russian espionage clusters abusing
  # WhatsApp device-linking and OAuth device-code flows
  # ============================================================
  - title: "Google Threat Intelligence Group: three distinct Russia-nexus espionage clusters (UNC6293, UNC7005/STORM-2945, UNC5976) abuse app passwords, OAuth device-code flows, and WhatsApp device-linking to compromise personal accounts of diplomats, academics, and defense/think-tank researchers across Europe, Ukraine, and the US"
    date_verdict: >
      Publication date confirmed as 2026-08-20 (byline: "August 20, 2026," authors Gabby
      Roncone and Wesley Shields, Google Threat Intelligence Group) — confirmed both via
      WebFetch and independently via grep -F against the bridge-fetched raw page text. Per the
      spawn instruction's explicit window ("If it is inside 2026-08-20 → now"), this is
      IN-WINDOW. Recommend inclusion as a standalone item.
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia", publisher: "Google Threat Intelligence Group (Gabby Roncone, Wesley Shields)", date: "2026-08-20", role: primary }
    discovery_trace: >
      first seen at: spawn-message-supplied open lead, URL
      https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia
      → primary (no pivot needed — GTIG's own research write-up). Also independently
      surfaced/flagged (but not fetched) by S4 as a dropped-lead-for-S3 candidate this same
      run; F3 fetched and verified it in full per this task's assignment. Fetched directly via
      WebFetch, then via bridge (python3 tools/fetch_source.py url) for full-body grep -F
      verification of all load-bearing quotes and the exact publication date.
    summary: |
      Google Threat Intelligence Group (GTIG) is tracking three distinct suspected
      Russia-nexus cyber-espionage clusters that abuse legitimate authentication workflows —
      rather than malware delivery — as their primary means of account compromise, targeting
      "individuals working in academia, aerospace and defense, governments and think tanks
      across Europe, as well as academia and think tanks within the United States."

      UNC6293 — assessed with moderate confidence as a sub-cluster of ICE RELIC (formerly
      tracked as APT29) responsible for initial access. First reported June 2025 (also by
      Citizen Lab) as an app-password phishing campaign impersonating the US State Department;
      app passwords are account-level passcodes that grant a "less secure" app or device
      access without triggering 2FA — UNC6293 supplies a PDF lure containing screenshots
      instructing victims to create a specifically-named app password (e.g. "ms.state.gov")
      and share it back, defeating 2FA entirely without any malware. As of October 2025 the
      identical lure PDF was still in use; by June 2026 UNC6293 had incorporated OAuth
      phishing, asking targets to share a post-login "verification code" or URL after a
      legitimate authentication to an external provider (observed live at a phishing domain
      "foreignrelations[.]us"). Campaigns are small (typically fewer than five targets at a
      time), diplomatic/conference-themed.

      UNC7005 (aka STORM-2945) — a threat cluster identified February 2026, also assessed
      moderate-confidence as ICE RELIC-linked for initial access, and separately tracked in
      this pipeline's registry as actor:storm-2945 / the CaptiveCrunch hospitality-WiFi
      campaign (this GTIG post ties UNC7005 to that same reported captive-portal activity via
      Reliaquest and Microsoft). UNC7005 runs (a) per-target-unique app-password phishing, (b)
      Microsoft OAuth device-code phishing delivered via emailed links to attacker-controlled
      domains impersonating real conferences — GTIG documents a spoof of the GLOBSEC forum
      (May 2026) reusing a template from an earlier "embassy invite" operation, including
      client-side JS fingerprinting to detect and evade automated scanners/headless browsers
      before ever displaying the device code, and (c) WhatsApp device-linking abuse (May–June
      2026): the victim is prompted for a phone number, which the attacker's own backend uses
      to generate a LEGITIMATE WhatsApp device-link QR/code request that is then displayed to
      the victim with instructions to scan/link it — once linked to the attacker's device, the
      phishing page offers a fake "voice call, encrypted chat, or file share," and if the
      victim joins the fake voice call, malicious JavaScript silently captures live
      microphone/camera via getUserMedia() and exfiltrates the recording to an attacker C2
      endpoint (`/api/code/<session-id>/recording`) when the call is made to appear to "fail."

      UNC5976 — tracked separately since March 2026, assessed distinct from the ICE
      RELIC-linked pair, with an "authentication focus": it purchases file-sharing-themed
      domains, stands up a Google Cloud project per domain, and serves a fake file-share login
      page; a target who clicks "Continue with Google" is sent through a REAL Google OAuth
      consent flow, then redirected to the attacker's own Cloud-project URL, which harvests the
