      TIMELINE (now much more precise than S2's finding): the compromise began around 10
      August 2026, when an employee opened a malicious/contaminated email on the municipal
      secretariat's professional mailbox without noticing (per the commune's external
      IT-security contractor's forensic finding, as reported by Le Nouvelliste). The
      compromise then lay dormant/latent until Tuesday 18 August 2026, when the attacker used
      the compromised mailbox to mass-send a fraudulent message: Le Nouvelliste states "Mardi
      18 août, environ 450 personnes ont reçu un mail frauduleux provenant du secrétariat
      communal de Martigny-Combe" (on Tuesday 18 August, approximately 450 people received a
      fraudulent email from Martigny-Combe's municipal secretariat) — this mass-send is what
      triggered detection. The commune's own official communiqué (20 August 2026, recovered
      directly as a PDF from martigny-combe.ch) confirms detection on 18 August: "L'incident a
      été détecté le 18 août 2026," blocked mailbox access immediately, and engaged external
      specialists. President Emilien Roduit states "à notre connaissance, deux destinataires
      ont cliqué sur le lien frauduleux pour l'instant" (to our knowledge, two recipients have
      clicked the fraudulent link so far). On the stolen-data figure: Le Nouvelliste's own
      reporting (not the commune's official communiqué, which gives no number) states "Dans
      les quelque 300 courriels piratés avec leurs pièces jointes de la messagerie du
      secrétariat communal" (approximately 300 hacked emails, with their attachments, from the
      municipal secretariat's mailbox) — Roduit is quoted characterising these as
      "confidentiels... contenant parfois des données sensibles" (confidential, sometimes
      containing sensitive data), and he does not rule out phishing/identity-theft risk. NOTE:
      the "~300" figure is Le Nouvelliste's own journalistic characterisation ("quelque" =
      "approximately"), not an official number stated in the commune's own communiqué.
      Authorities notified (confirmed independently by both the commune's own PDF communiqué
      and ICTjournal/Le Nouvelliste): the Office fédéral de la cybersécurité (OFCS — the French
      name for BACS, Switzerland's federal cybersecurity office), the Valais cantonal Data
      Protection and Transparency Commissioner (conformément à la LIPDA — the cantonal
      information/data-protection/archiving law), and a criminal complaint filed with Valais
      cantonal police. The commune states a year-long dark-web monitoring watch will be
      maintained for the stolen data, and that internal prevention work continues. The
      commune's data-protection delegate is named in its own communiqué as "ANSAM, Alexis
      Clément" — the press release does not explicitly state that ANSAM is the same "external
      IT-security firm" Le Nouvelliste cites for the forensic vector finding, so this
      connection should not be asserted as confirmed, only that ANSAM is the commune's
      contracted data-protection delegate of record. This is the second disclosed Valais
      commune cyberattack in 2026, after Play ransomware hit Vétroz in April (already covered
      by this pipeline per S2's prior note).
