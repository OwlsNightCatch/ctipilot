notes: |
  Self-evolution flag (repeated from Item 3's extended_notes for visibility):
  tools/fetch_source.py's `url` command corrupts binary (non-UTF-8) files such as PDFs when
  their bytes are piped through the Bash tool's text-mode stdout redirect — the script decodes
  the response body as text (utf-8 with a latin-1 fallback) and writes that Python str to
  stdout, which on a bytes >=0x80 causes a UTF-8 re-encoding that mangles every high byte into
  a 2-byte sequence. The resulting file is still structurally a valid PDF (correct header/xref)
  but every content stream fails to decompress. This was recoverable in this run via a manual
  utf-8-decode + latin-1-encode reversal, cross-checked against a from-scratch PDF
  content-stream extraction, but future runs fetching PDFs via this tool should be aware of
  the pitfall, or the tool should gain a raw-bytes/binary output mode.
