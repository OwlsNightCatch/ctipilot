    extended_notes: |
      SELF-EVOLUTION NOTE (important operational finding): tools/fetch_source.py's `url`
      command corrupts BINARY files (e.g. PDFs) when their bytes are not valid UTF-8. The
      script's fetch_text() tries body.decode("utf-8") and falls back to
      body.decode("latin-1", errors="replace"); for a PDF, this produces a Python str whose
      high bytes (0x80-0xFF) are then re-encoded as UTF-8 by Python's stdout when the Bash
      tool captures/redirects it (`> file.pdf`), silently corrupting every non-ASCII byte
      (each becomes a 2-byte UTF-8 sequence) — the file still parses as a structurally-valid
      PDF (correct header, xref, page count) but every FlateDecode content stream fails to
      decompress and Read-tool rendering comes back blank. I reversed this in this run by
      `data.decode('utf-8')` then `.encode('latin-1')` on the corrupted file, which exactly
      recovers the original bytes (confirmed: FlateDecode streams then decompress correctly,
      and the recovered text was independently cross-checked via two extraction methods).
      RECOMMENDATION: fetch_source.py's `url` command should gain a `--binary`/raw-bytes output
      mode (write sys.stdout.buffer.write(body) instead of decoding to text) for PDF/image/binary
      targets, or the agent-facing docs should flag this pitfall explicitly. Filed here per the
      Self-evolution duty in the agent definition.

