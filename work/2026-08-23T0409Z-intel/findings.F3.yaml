    summary: |
      DEEP-READ VERIFICATION RESULT: S2's conclusion is correct; S3's characterization
      ("officials cite a malware infection introduced via an opened email attachment as the
      initial-access vector") is NOT supported by any source read in this run and should not
      be carried into the entry as attributed to "officials." See decisive_sourcing_verdict
      above for the full quote-level analysis.

      OPERATIONAL CASCADE (confirmed, multi-source): Berlin's Senate Administration for Urban
      Development, Building and Housing, and the Senate Administration for Mobility,
      Transport, Climate Protection and Environment were isolated from the Berlin Landesnetz
      (state network connecting ~600 government sites) on Friday 14 August 2026 after
      forensic work found an "Inkriminierung des Landesnetzes" (compromise of the state
      network); the Senate Chancellery's own press release (17 Aug) names LKA, Staatsanwaltschaft
      Berlin and BSI as involved and an IKT-Notfallkrisenstab (ICT emergency crisis team) under
      the State Commissioner for Information Security. Both administrations remained largely
      offline through the run's freshest status (it-boltwise.de, ~22 Aug: "beide Häuser
      weiterhin vom zentralen Landesnetz isoliert" — both houses remain isolated from the
      central Landesnetz), with no restoration timeline beyond "baldmöglichst" (as soon as
      possible). Because the affected Senate administrations host the backend/Fachanwendungen
      used by Berlin's district offices (Bezirksämter), the disruption cascades to citizen
      services: Wohngeld (housing benefit) and "Bildung und Teilhabe" payments could not be
      disbursed, affecting more than 50,000 households per Tagesspiegel's 20 Aug figure
      (revised upward to "rund 55.000 Haushalte" / cross-referenced against official data of
      "55.480 Haushalte" receiving Wohngeld, per it-boltwise.de's ~22 Aug figure). Also stopped:
      digital permit applications for tree-felling (Baumfällungen), noise-protection permits
      for events (Lärmschutzgenehmigungen), soil-contamination disclosures
      (Bodenbelastungsauskünfte), parking-ban/special-use permits (Halteverbote,
      Sondernutzungen), and construction/heritage-protection applications — Tagesspiegel
      sourced the district-level detail from Marzahn-Hellersdorf's own published list and
      states "Nach Tagesspiegel-Informationen trifft das auch auf die anderen Bezirksämter zu,
      da die Fachanwendungen überall die gleichen sind" (according to Tagesspiegel's own
      reporting, this also applies to the other district offices, since the specialised
      applications are the same everywhere) — IMPORTANT NUANCE: this is Tagesspiegel's own
      inferential reporting, not an official enumeration confirming exactly which or how many
      of Berlin's twelve Bezirke are affected; no source in this run states the figure "twelve"
      explicitly. Postal-voting: on Tuesday 18 August, online applications for postal-voting
      documents (Briefwahlunterlagen) for the 20 September Berlin state election were
      unavailable for several hours; RBB (relayed by Tagesspiegel) attributed this to
      network-wide security scans following the cyberattack consuming bandwidth, but the
      Senate Chancellery "dementierte auf Anfrage des Tagesspiegels einen Zusammenhang"
      (denied any connection when asked by Tagesspiegel); online postal-vote applications
      resumed "seit Mittwochmorgen" (from Wednesday morning, 19 Aug); Interior Senator Iris
      Spranger stated election preparation and counting are not affected and that the
      brief outage gives no grounds for a legal challenge. On data: officials state (Kai
      Wegner, 19 Aug press conference, per berlin.de) that "nach aktuellem Kentnisstand ...
      keine sensiblen Daten abgeflossen" (no sensitive data known to have leaked as of current
      knowledge); separate reporting (via WebSearch synthesis of Handelsblatt-class coverage)
      indicates some data did flow out of the urban-development administration but is
      characterised by officials as data that was already publicly available (Open Data) —
      this is a lower-confidence secondary claim not independently verified against a primary
      in this run. IT-security critic Manuel Atug (quoted 18 Aug, it-daily.net) called Berlin's
      posture in this area "sehr schlecht" (very poorly) equipped and said cybersecurity had
      gotten worse despite claimed improvements, adding that prior expert-hearing
      recommendations were never implemented.
