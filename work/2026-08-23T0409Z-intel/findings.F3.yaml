  # ============================================================
  # ITEM 2 — Payload ransomware claim / Qualiflex Datacenter / HWZ
  # ============================================================
  - title: "Payload ransomware claims a Zurich-area IT/datacenter provider; HWZ confirms student/alumni data theft — DECISIVE SOURCING ANSWER: the 'Qualiflex' provider name is sourced ONLY to the leak-site listing; no journalism independently confirms it, and a competing unverified name (Neovo AG) circulates only in reader-comment speculation"
    decisive_sourcing_verdict: >
      ANSWER: No source other than the Payload leak-site listing itself (ransomware.live)
      connects the name "Qualiflex" (rendered on the listing as "Qualiflex Datacenter") to
      HWZ. Both Swiss press items found (Inside Paradeplatz, 22 Aug, by Lukas Hässig; ictk.ch,
      22 Aug, which explicitly relies on Inside Paradeplatz — "laut der Zürcher
      Online-Newsplattform Insideparadeplatz.ch" / "Dem Bericht von Insideparadeplatz.ch
      zufolge") report ONLY that HWZ blames an unnamed "externer IT-Dienstleister" (external
      IT service provider) and quote HWZ's own letter to students verbatim: "Nach aktuellem
      Untersuchungsstand erfolgte ein Angriff über die Infrastruktur des Dienstleisters" — the
      provider is never named by HWZ or by either outlet's own reporting. Checked directly:
      the string "Qualiflex" appears ZERO times anywhere in the Inside Paradeplatz article
      (body or its 76 reader comments) — confirmed by direct text search of the bridge-fetched
      full page. Separately, and NOT to be published: a reader comment on the Inside
      Paradeplatz article (22.08.2026 08:57, "Rexhep") speculates the provider is "Neovo AG"
      ("👉 Neovo AG"), and a second commenter (22.08.2026 15:14) builds on this, referencing "der
      Payload-Hack" in connection with a "Neovo-Webseite" claim about centralised API
      authentication — this is uncorroborated crowd/forum speculation, weaker even than
      anonymous press sourcing, and must NOT be treated as a naming source per this pipeline's
      sourcing rules (comment-section speculation is at least as unreliable as the
      explicitly-excluded Telegram/X-only sourcing). No BACS/NCSC (Switzerland's renamed
      federal cybersecurity office) statement on this incident was found via WebSearch.
      CONCLUSION: if the provider is named in the entry at all, it must be attributed
      explicitly and only to "the Payload group's own leak-site listing," never stated as an
      independently-confirmed fact, and the "Neovo AG" comment-speculation must not appear.
    sources:
