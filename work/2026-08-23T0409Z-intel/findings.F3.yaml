    summary: |
      DEEP-READ VERIFICATION RESULT: confirms S4's finding and sharpens the sourcing caveat —
      see decisive_sourcing_verdict above. HWZ (Hochschule für Wirtschaft Zürich, a Zurich
      University of Applied Sciences business school) confirmed in a letter to students and
      alumni, reported by Inside Paradeplatz on 22 August 2026, that its own analysis
      identified stolen personal data among data taken in a breach: "Namen, Adressen und
      Telefonnummern, Daten aus der Studienadministration, Bankverbindungen, Daten aus
      Krankmeldungen" (names, addresses, phone numbers, student-administration records, bank
      details, sick-leave/health-notification data) — HWZ states this affects both current
      students and alumni. HWZ attributes the compromise to its external IT service provider's
      infrastructure, not its own systems: "Nach aktuellem Untersuchungsstand erfolgte ein
      Angriff über die Infrastruktur des Dienstleisters," and separately that "die lokale
      IT-Infrastruktur der HWZ" was not affected. HWZ has informed the police ("Man habe die
      Polizei eingeschaltet") and asked recipients not to share unconfirmed information. The
      Payload ransomware group's leak-site listing (ransomware.live, discovered 20 August 2026)
      names the victim as "Qualiflex Datacenter | HWZ-Studiengänge (fh-hwz.ch), myenb.ch, etc,"
      claims ~490GB exfiltrated, and lists eight affected customer domains (fh-hwz.ch, myenb.ch,
      schelling.ch, kaelteringag.ch, kaeltebucher.ch, cbmswiss.ch, vitabad.ch, ign8.ch) — this is
      a shared-hosting/managed-IT-provider compromise reaching multiple independent downstream
      Swiss organisations, consistent with a supply-chain-shaped exposure rather than a direct
      HWZ-specific intrusion. The timing (leak-site listing 20 Aug; HWZ statement to students
      22 Aug) is consistent with a single underlying event, but no source bridges the two by
      name.
