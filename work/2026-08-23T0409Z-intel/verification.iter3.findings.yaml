  item: "2026-08-23/uat-10147-agentic-ai-exploitation-oob-confirmation"
  url_or_quote: "registering a scheduled task named after a browser update routine to run at every logon with highest privileges"
  summary: "Cisco Talos (https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/, re-read this iteration) says the actor establishes persistence 'by creating deceptive scheduled tasks named \"Google Chrome Start\" that run the malware with the highest privileges every time a user logs on'. The task masquerades as a browser START routine, not an update routine. 'every logon' and 'highest privileges' are both correct; only the naming characterisation is wrong, and it is the part a hunter would key on."
