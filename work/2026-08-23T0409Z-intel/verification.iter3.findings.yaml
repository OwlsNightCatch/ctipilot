- code: F5
  category: hallucinated-fact
  section: threat-landscape
  item: "2026-08-23/gtig-russia-clusters-app-passwords-whatsapp-linking"
  url_or_quote: "a fake voice call on the same page silently captures microphone and camera through the browser"
  summary: "'silently' is not in the source and is contradicted by the recovered code it publishes. GTIG (https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia, re-read this iteration) says 'If the target joins the voice call, malicious JavaScript to record target audio and video is triggered. The webpage presents a fake voice call with a ring for a limited amount of time while the audio and video are recorded.' The published startMediaRecording() calls navigator.mediaDevices.getUserMedia (which requires a user permission grant) and then sets selfVideo.srcObject = stream with selfView.style.display = '' — the page shows the victim their own camera feed. The capture is disguised as a call, not silent. The body's own wording is correct and carries no 'silently'; only the summary overstates."
- code: F6
  category: hallucinated-fact
