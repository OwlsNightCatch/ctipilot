  item: "2026-08-23/gtig-russia-clusters-app-passwords-whatsapp-linking"
  url_or_quote: "headline: The authentication workflow is the attack surface: no exploit, no payload, and multi-factor authentication is satisfied rather than bypassed"
  summary: "The headline generalisation contradicts the entry's own action item, which says application-specific passwords 'are the one credential class in this research that defeats multi-factor authentication outright', and the body, which says the app password 'grants access without ever triggering the second factor'. 'Satisfied rather than bypassed' holds for UNC7005's device-code flow and UNC5976's OAuth consent, not for UNC6293's app passwords. Advisory: a scoping clause would resolve it."
