  section: 2026-10-21/aa26-293a-safepay-ransomware-edge-flaws-backup-nas-reset (cves[] and sourcing_note)
  item: "cves[CVE-2020-3259] and cves[CVE-2024-40766]; sourcing_note"
  url_or_quote: "cvss: null (CVE-2020-3259, CVE-2024-40766); \"neither source states affected or fixed versions\""
  summary: "(low confidence) Advisory: the Cisco page the entry now cites carries a CVSS 3.0 base score of 7.5 for CVE-2020-3259 and the SonicWall page SNWLID-2024-0015 carries CVSS v3 9.3 (vector CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:L) for CVE-2024-40766, yet both records keep cvss null. The sourcing_note's 'neither source' refers to the CISA advisory and KEV catalog but the entry now has four sources, two of which do state versions; say so in one clause."
- code: F11
  category: editorial-advisory
  section: 2026-10-21/apt28-hookedge-backdoor-nato-police-shipbuilder-ssh-tunnel (Detection)
  item: "Detection line, ssh.exe clause"
  url_or_quote: "\"ssh.exe started from a user or ProgramData context with an identity file, a remote forward and host-key checking disabled\""
  summary: "(low confidence) Advisory: Symantec's command line runs ssh.exe from C:\\Windows\\System32\\OpenSSH with the identity file under ProgramData; no source says ssh.exe itself ran from a user or ProgramData path. A hunter could read the clause as an image-path filter that would miss it. Reword to the observable arguments (identity file under a writable ProgramData or user path, remote forward, host-key checking disabled) without implying the image location."
- code: F11
  category: editorial-advisory
  section: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins (summary)
  item: "summary, start time attribution"
  url_or_quote: "\"Patchstack and Nethemba report an attacker using those keys since 2026-10-18 15:32 UTC\""
  summary: "(low confidence) Advisory: the 15:32 UTC first-observed time is Patchstack's telemetry (the body cites it to Patchstack alone); Nethemba only relays it in an update and dates the attacks on its own sites to the night of 18 to 19 October. Attribute the time to Patchstack in the summary, as the body does."
- code: F11
  category: editorial-advisory
  section: standing residuals (declined in iterations 1 to 5; may be left)
  item: "em dashes, workflow wording in older changelog text, living-page source records, TeamUpdraft event_date"
  url_or_quote: "Metabase body and older sections (13 em dashes, e.g. 'is ordinary — users mistype addresses'); Metabase 2026-08-19 record summary ('This pipeline covered CVE-2026-72898 on 2026-08-09'); PAN-OS 2026-06-17 record summary ('hits European targets — Arctic Wolf'); Publica page listed as two source records; ConnectWise Trust Center advisories listing as source; TeamUpdraft event_date 2026-10-18"
  summary: "Standing advisories, none introduced by this fire's additions (the additions carry no em dash and no workflow wording). The ConnectWise page answered 403 on extract, WebFetch and jina today and was checked against the saved 2026-10-19 read, which carries the 19 October 01:15 UTC update; the TeamUpdraft event_date is the attack start (Patchstack first observed 2026-10-18 15:32 UTC) and is defensible. An audit sweep can clear the em dashes and the 'This pipeline' phrase."
