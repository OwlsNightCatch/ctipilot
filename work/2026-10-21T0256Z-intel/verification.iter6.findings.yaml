- code: F11
  category: editorial-advisory
  section: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow (summary)
  item: "PK Softech, software supplier of Swiss pension funds ... (summary)"
  url_or_quote: "summary runs 2,204 characters across about six sentences ('The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 ... Tamedia reports, and Inside IT relays, that the Akira ransomware group holds about 100 GB ...')"
  summary: "Advisory (low): the summary contract is 1 to 3 self-contained sentences (TL;DR bullet, RSS and notification text). This fire appended the Akira / ransom clause, the entry's newest and highest-stakes development, at the very end of a 2,204-character accumulated block, now that the entry is priority high. Consider a three-sentence summary that leads with the supplier incident and the Tamedia/Inside IT Akira report (unconfirmed)."
- code: F11
  category: editorial-advisory
  section: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (title)
  item: "CVE-2026-109618 / CVE-2026-109619, PHP: two critical flaws rated CVSS 4.0 9.2 ... are fixed in a release pre-announced for 21 October 14:00 UTC"
  url_or_quote: "\"are fixed in a release pre-announced for 21 October 14:00 UTC\""
  summary: "(low confidence) Advisory: at publication php.net lists no fix (the entry's own cves[].fixed says 'none published as of 2026-10-21' and the tag is no-patch), so 'are fixed in' reads as a past fact in the title. 'are to be fixed in' / 'will be fixed in' matches php.net ('It addresses two critical vulnerabilities')."
