- title: 'Unblu Spark (co-browsing and chat platform): NCSC.ch-assigned CVE-2026-9589 (cross-account configuration read and write, CVSS 4.0 9.3 in Unblu Cloud) and CVE-2026-14933 (co-browsing XSS in the agent''s session) fixed'
