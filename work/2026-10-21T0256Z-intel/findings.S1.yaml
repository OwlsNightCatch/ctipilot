  - quote: SafePay ransomware was among the most active ransomware groups in 2026.
    attribution: CISA et al. (AA26-293A)
    source_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
  - quote: The SafePay threat actors have impacted at least 600 separate victims from multiple critical infrastructure sectors.
    attribution: CISA et al. (AA26-293A)
    source_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
  - quote: SafePay threat actors halt the Volume Shadow Copy Service and reset Network Attached Storage containing victim backup data to initial factory settings to inhibit system recovery attempts
    attribution: CISA et al. (AA26-293A)
    source_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
  exposure: Organisations with internet-facing Cisco ASA or FTD VPN, SonicWall SonicOS or Veeam Backup and Replication servers that predate the fixes for the five CVEs, and any VPN or remote-access account protected by a single password. The advisory gives no affected-version list; take them from each vendor's advisory for the CVE.
  detection: 'Telemetry class: VPN and firewall authentication logs (repeated failures then success, logins from Mullvad exit addresses, new accounts), identity-provider and directory audit logs (administrator group changes, new accounts), process-creation events for PsExec services, WinRM and remote-management tools (ScreenConnect, AnyDesk, TeamViewer) installed outside change windows, file-share enumeration scripts, archive and cloud-sync tools (7-Zip, WinRAR, RClone, WinSCP, b2.exe) run by non-administrative workflows, and backup and NAS audit logs for factory-reset or shadow-copy-service stop events.'
  defender_takeaway: Patch or retire the five CVE-listed products on every internet-reachable edge, require MFA on VPN and administrator accounts, and put backup stores and NAS administration on a separate trust boundary with immutable copies, because stopping shadow copies and factory-resetting the NAS is the step that removes the restore path.
  extended_notes: Also appears in other domains' returns possibly (S4 tracks SafePay leak-site claims); the main agent should merge on actor:safepay. The advisory's ATT&CK table is mapped to ATT&CK v20 (T1685 = Disable or Modify Tools). Advisory states exfiltration to Mega is only an RClone example, not an observed destination.
- title: 'Update on CVE-2026-0257 (PAN-OS GlobalProtect): Unit 42 says Qilin and Inc ransomware operators exploit it, with a pivot from the VPN gateway to vCenter and ESXi and offline credential theft from a domain controller''s virtual disk'
  sources:
  - url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
    publisher: Unit 42 (Palo Alto Networks), Threat Brief, updated 2026-10-20
