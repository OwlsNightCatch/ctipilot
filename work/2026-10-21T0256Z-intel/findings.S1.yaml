  exposure: Tomcat 9.0.0.M1 to 9.0.122, 10.1.0-M1 to 10.1.60 and 11.0.0-M1 to 11.0.26 (and EOL 8.5, 7.0 where still run). Check conf/server.xml and context files for a JNDIRealm with a SASL authentication mechanism other than GSSAPI, for HTTP/2 upgrade or connectors with asynchronous servlets, and for AJP connectors; the running version shows in the Tomcat version banner (catalina version).
  detection: 'Telemetry class: application and access logs. For the realm flaw, successful container-managed logins for accounts whose password was not supplied or with unexpected bind behaviour in LDAP server logs; for the mix-up flaws, user-reported cross-session content and mismatched response sizes in access logs. No flaw-specific indicator is published.'
