  summary: 'Plex announced fixed releases (Plex Media Server 1.43.3, Plex Desktop 1.115.0) in a forum thread on 2026-09-01 and on 2026-10-19 added CVE details and an exploitation notice to the same thread: four flaws that ''chained together'' let an unauthenticated remote attacker run code with the privileges of the server process, 1.43.3.10861 and later are not affected, the flaws are ''actively and widely exploited'', a public proof of concept was released on 2026-10-16, and compromised servers were used to run cryptocurrency miners and proxy software. Plex''s table describes CVE-2026-96652 as an unauthenticated server-side request forgery in the player timeline endpoint, CVE-2026-96654 as access to internal agent functions over the loopback interface, CVE-2026-96655 as disclosure of the server owner''s admin token and CVE-2026-96656 as an arbitrary file write to the Codecs directory through transcoder preferences. CISA added all four to KEV on 2026-10-20 (due dates 2026-10-23 for -96654
    and -96656, 2026-11-03 for -96652 and -96655). The CVE records (CNA: CISA, published 2026-09-23) describe -96655 differently from Plex''s table: as an authenticated SSRF through the /video/:/transcode/universal path parameter, scored CVSS 4.3 to 5.3, with -96652 at 4.3 to 5.3, -96654 at 6.5 to 6.9 and -96656 at 7.2 to 8.6 (admin-only file write executed on load); CISA''s KEV text follows the CVE records. The vendor''s chain claim (unauthenticated to code execution) and the CVE records'' per-flaw privilege requirements are therefore not reconciled in public text. Plex''s compromise checks are unrecognised child processes of the server, unfamiliar .so or .dll files in the Codecs folder, outbound connections to a named proxy-service domain and sustained high CPU while idle; its guidance for a suspect server is a clean rebuild rather than reuse of the old data directory.'
