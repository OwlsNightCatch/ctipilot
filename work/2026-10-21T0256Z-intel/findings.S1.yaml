  summary: 'The Apache Tomcat project made three ''Important'' flaws public on 2026-10-20, fixed in 11.0.27, 10.1.61 and 9.0.123 (release tagged 2026-10-12). CVE-2026-101296: the JNDIRealm bind-credential validation fails open for non-GSSAPI SASL mechanisms, so an attacker could authenticate without the correct password; affects 11.0.0-M1 to 11.0.26, 10.1.0-M1 to 10.1.60 and 9.0.0.M1 to 9.0.122 (EOL 8.5 and 7.0 also affected per the Apache CVE record as mirrored by ENISA EUVD). CVE-2026-101356: incorrect object recycling in HTTP/2 handling of asynchronous servlets can mix requests or responses up between users; affects 11.0.22 to 11.0.26, 10.1.55 to 10.1.60 and 9.0.118 to 9.0.122. CVE-2026-103119: a buffer under-read in AJP lets a large non-blocking write split a response body between the current and the next request on a connection, most likely failing the second request and possibly leaking data from the first; 11.0.0-M25 to 11.0.26 only. ENISA EUVD carries Apache''s scores at 9.1 for
    all three (CVSS 4.0 for -101296, 3.1 for the other two); the Tomcat pages give only the project''s ''Important'' rating. No exploitation or public proof of concept is reported. Reach is limited by configuration: the JNDIRealm flaw needs a JNDI realm configured with a non-GSSAPI SASL mechanism, the mix-up flaw needs HTTP/2 with asynchronous servlets, and the AJP flaw needs an AJP connector.'
