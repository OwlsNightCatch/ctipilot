- title: 'Windows Active Directory Domain Services: unauthenticated network remote code execution CVE-2026-70229 (Critical, CVSS 3.1 8.1, high attack complexity) is rated Exploitation More Likely in Microsoft''s 13 October 2026 updates; not exploited or disclosed'
  sources:
  - url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70229
    publisher: Microsoft Security Response Center (Security Update Guide)
    date: '2026-10-13'
    role: primary
  - url: https://www.bleepingcomputer.com/news/microsoft/microsoft-october-2026-patch-tuesday-fixes-1-411-flaws-3-zero-days/
    publisher: BleepingComputer (Patch Tuesday overview)
    date: '2026-10-13'
    role: corroborating
  discovery_trace: 'first seen at: msrc-update-guide, python3 tools/fetch_source.py msrc cvrf 2026-Oct (saved to disk and parsed: 2,297 CVE rows, Exploitability Assessment field per CVE) -> primary: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70229 (extract fell through to the reader; per-CVE JSON from python3 tools/fetch_source.py msrc cve CVE-2026-70229) -> context: BleepingComputer, URL https://www.bleepingcomputer.com/news/microsoft/microsoft-october-2026-patch-tuesday-fixes-1-411-flaws-3-zero-days/ (WebSearch result, then extract)'
  summary: 'Microsoft''s October 2026 security release of 2026-10-13 fixes CVE-2026-70229, an incorrect-authorization flaw in Active Directory Domain Services that lets an unauthenticated attacker run code on the target by sending a specially crafted packet to an affected service over the network, with no authentication or user interaction; Microsoft rates it Critical, CVSS 3.1 8.1 (attack complexity high: specific network configuration and timing conditions are needed and success has been seen only in limited scenarios), marks it Exploitation More Likely, and records it as neither exploited nor publicly disclosed. It is fixed in the October cumulative updates: for example Windows Server 2025 KB5126646 (build 10.0.26100.33650), Server 2022 KB5126655 (10.0.20348.5761), Server 2019 KB5126651 (10.0.17763.9376), Server 2016 KB5126868 (10.0.14393.9612), Server 2012 R2 KB5126836 and Server 2012 KB5126835, as listed in Microsoft''s per-product remediation table. Of the 109 CVEs in the release that
    Microsoft rates Exploitation More Likely, it and the Exchange fix the store already covers (CVE-2026-70571) are the only unauthenticated remote-code-execution flaws; the rest are local or authenticated elevation-of-privilege flaws, plus the Exchange spoofing flaw CVE-2026-70279. Release context from the CVRF: the one exploited flaw is the Windows Shell Mark of the Web bypass CVE-2026-96951 (covered); two flaws are publicly disclosed (.NET Framework security feature bypass CVE-2026-108398 and a MessagePack-CSharp denial of service CVE-2026-92707); and 19 first-party Critical rows score 9.8 or higher with network vector, low complexity and no privileges or user interaction, all rated Exploitation Less Likely or not applicable (for example Outlook CVE-2026-70242, -70291, -88156, -97016 and -97749, Word CVE-2026-70300, PowerPoint CVE-2026-88178, Message Queuing CVE-2026-100202, QUIC CVE-2026-100219 and -105016, DHCP Server CVE-2026-96934, PostScript printer driver CVE-2026-70147 and -70153,
    Text Shaping CVE-2026-97814 and the cloud-side Azure App Service, Dataverse, Bookings and Partner Center rows), none exploited.'
  region_nexus: global; domain controllers underpin every federal, cantonal and communal Windows estate
  primary_sector_nexus: direct (Active Directory domain controllers)
  sector: public-sector
  cves:
  - CVE-2026-70229
  techniques:
  - T1210
  affected_products:
  - Microsoft Windows Server (Active Directory Domain Services)
  entity_keys:
  - product:microsoft-windows-server
  new_entities:
  - key: product:microsoft-active-directory-domain-services
    type: product
    name: Microsoft Active Directory Domain Services
    aliases:
    - AD DS
    - Active Directory Domain Services
    summary: Windows Server role that provides directory services on domain controllers; CVE-2026-70229 (2026-10-13) is an unauthenticated network RCE that Microsoft rates Exploitation More Likely.
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  confidence_note: Vendor record for its own product (Admiralty A); Exploitation More Likely is Microsoft's prediction, not an observation.
  novelty: new
  borderline: true
  borderline_reason: Published 2026-10-13, outside the window, listed to close the Patch Tuesday completeness duty; attack complexity high, not exploited, not disclosed; the store already carries the same release's Exchange fixes and the Shell zero-day.
  suggested_priority: routine to notable if kept
  evidence:
  - quote: Incorrect authorization in Active Directory Domain Services allows an unauthorized attacker to execute code over a network.
    attribution: Microsoft MSRC
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70229
  - quote: An unauthenticated attacker could exploit this vulnerability by sending a specially crafted packet to an affected service over the network.
    attribution: Microsoft MSRC
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70229
  - quote: Publicly disclosed No Exploited No Exploitability assessment Exploitation More Likely
    attribution: Microsoft MSRC
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70229
  exposure: 'Windows domain controllers (AD DS role) on Server 2012 to 2025 below the October 2026 cumulative update; compare the installed KB or OS build with the fixed builds above (Get-HotFix or the build number from winver). Reachability matters: DCs reachable from untrusted network segments carry the risk.'
  detection: 'Microsoft publishes no indicator. Telemetry class: domain-controller event logs (unexpected LSASS or directory-service crashes and restarts) and process-creation events on DCs with the directory-service process as parent, plus network flow to DC service ports from unexpected segments.'
  defender_takeaway: Put the October cumulative update on domain controllers ahead of member servers, and keep AD DS service ports unreachable from untrusted networks until it is in.
  extended_notes: Parsed from the saved CVRF, not the per-CVE web page, for the release-level counts; the count of 19 and the CVE list are my tally of first-party Critical rows with AV:N/AC:L/PR:N/UI:N and CVSS 9.0 or higher (the CVRF also carries Linux kernel, Chromium, Apache HTTP Server and Go entries that MSRC republishes, excluded here). Windows Server rows rated Important by Microsoft but scored 9.8 (for example IIS CVE-2026-70024, DNS CVE-2026-83869 and -96113, DHCP CVE-2026-96320, RRAS, NPS, LSASS CVE-2026-96219) are Exploitation Less Likely or Unlikely and were not individually reviewed.
