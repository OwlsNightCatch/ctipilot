  exposure: 'Every internet-facing PHP runtime: Apache with mod_php, nginx or Apache with PHP-FPM, container images with PHP, shared-hosting and CMS platforms. Read the version with php -v or phpinfo() or the OS package manager; PHP 8.1 and older are outside upstream support (php.net supported branches: 8.2 to 8.5), so they need a branch upgrade or a backport from the OS vendor. The PHP project has not said which versions are affected; CERT-EU says all from PHP 5 onwards and Sansec says 5.4 or later, both unconfirmed.'
  detection: 'Nothing public yet on the trigger, so no flaw-specific detection exists. For an RCE in the PHP runtime, hunt the generic post-exploitation shape once details are out: web-server or PHP-FPM worker processes spawning shells, interpreters or download tools (process-creation events with parent lineage), new or modified .php files under web roots and upload directories (file-integrity monitoring), and outbound connections initiated by web-server accounts. Web access logs from 14:00 UTC onward are the first place scanner traffic shows (Sansec expects mass attacks within 15 minutes of the release).'
  defender_takeaway: 'Treat 14:00 UTC (16:00 CEST) as a patch-now window: before it, list PHP runtimes and their owners, find PHP 8.1 and older, and agree who restarts PHP-FPM or the web server; CERT-EU advises isolating internet-facing PHP applications from public networks where immediate patching is not possible. Hosting providers and OS vendors apply their own builds, so confirm their schedule rather than assuming it.'
  extended_notes: 'Window arithmetic: sources are fresh (php.net 2026-10-20T20:32Z; CERT-EU feed 2026-10-20 22:33 CEST; Sansec dated 2026-10-21; Wordfence 2026-10-20T22:39Z). The release itself falls at 2026-10-21 14:00 UTC, after this fire. Discrepancy to carry: CERT-EU says all versions from PHP 5 onwards (citing a Mastodon post), Sansec says PHP 5.4 or later; the PHP project states neither. Sansec''s page metadata keywords list session.upload_progress.enabled, session.use_strict_mode and php-fpm, but the article body states no mechanism; this is an unconfirmed hint at best and should not be repeated as a finding. CVE ids: only CERT-EU and Sansec name them; php.net does not, and CVE.org/EUVD returned nothing at fetch time. Sansec''s ''mass attacks within 15 minutes'' is a forecast by a vendor that sells a protection product (Sansec Shield) and is attributed as such. Corroboration independence: the three readers (CERT-EU, Sansec, Wordfence) all trace to the php.net announcement; Sansec
    and CERT-EU add the leak claims.'
- title: 'Oracle October 2026 Critical Patch Update: 1,295 patches, six unauthenticated-network CVSS 10.0 rows (Access Manager, SOA Suite, E-Business Suite Workflow Mailer, JD Edwards Orchestrator) and two WebLogic CVSS 9.8 flaws reachable over HTTP and T3/IIOP'
  sources:
  - url: https://www.oracle.com/security-alerts/cpuoct2026.html
    publisher: Oracle (Critical Patch Update Advisory - October 2026, Rev 1)
    date: '2026-10-20'
    role: primary
  discovery_trace: 'first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-19&toDate=2026-10-21&fromScore=8.5&toScore=10&page=0&size=100 (205 Oracle-assigned records, e.g. EUVD-2026-106486, CVE-2026-91231) -> primary: oracle-cpu record, URL https://www.oracle.com/security-alerts/cpuoct2026.html (python3 tools/fetch_source.py url --direct; the raw HTML risk matrices were parsed into 1,295 rows, matching the advisory''s own count)'
  summary: 'Oracle''s Critical Patch Update of 2026-10-20 (Rev 1) contains 1,295 new security patches. Parsing the 33 risk matrices gives 112 rows scored CVSS 3.1 9.0 or higher, of which 90 rows (73 distinct CVEs) are marked ''Remote Exploit without Auth.'' with network attack vector: 42 rows in Oracle''s own code and 48 rows in third-party components shipped inside Oracle products (OpenSSL, curl, glibc, libxml2, Netty, Apache Mina, Tomcat, Perl and similar). Six rows score 10.0, all unauthenticated and network-reachable: CVE-2026-87337 (Access Manager, Authentication Engine, HTTP; 12.2.1.4.0 and 14.1.2.1.0), CVE-2026-91231 (SOA Suite Adapters, HTTP), CVE-2026-91216 and CVE-2026-91221 (SOA Suite Fabric Layer, T3 and IIOP; 12.2.1.4.0 and 14.1.2.0.0), CVE-2026-101809 (E-Business Suite Workflow Notification Mailer, HTTP; 12.2.3 to 12.2.15) and CVE-2026-91299 (JD Edwards EnterpriseOne Orchestrator, E1 IOT Orchestrator Security, HTTP; 9.2.0.0 to 9.2.26.5). WebLogic Server carries CVE-2026-91323
    (Core, HTTP) and CVE-2026-83399 (Core, T3 and IIOP), both 9.8, plus CVE-2026-87302 (HTTP, 9.1), on 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0 and 15.1.1.0.0; Identity Manager CVE-2026-91408 (End User Self Service, T3 and IIOP, 9.8), Access Manager CVE-2026-87251 (SAML, 9.8) and twelve further SOA Suite, BPM, WebCenter and Data Integrator rows sit at 9.1 to 9.8. A further group scores 9.1 to 9.9 but needs a low-privileged or higher account (for example Essbase, Enterprise Manager for Oracle Database, HTTP Server CVE-2026-87347, several SOA Suite and BPM rows). The advisory states no exploitation and no public disclosure for any row and contains only Oracle''s standing sentence that it receives reports of attempts to exploit already-patched flaws; no third-party exploitation or proof-of-concept report was found for these CVEs. Oracle describes the flaws only through the risk matrix; patch availability documents and the executive summary sit behind My Oracle Support login. This follows the July
    CPU, the August CPU and the September CSPU, each of which carried unauthenticated CVSS 10.0 rows the store already covers.'
  region_nexus: global; Oracle Fusion Middleware, E-Business Suite, JD Edwards and PeopleSoft are common in large administrations' ERP and identity estates (assessment, not a sourced Swiss count)
  primary_sector_nexus: direct where those products run (federal and cantonal ERP, identity and integration platforms)
