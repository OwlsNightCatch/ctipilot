  summary: 'Unblu inc., vendor of the Unblu Spark co-browsing and messaging platform, published two security bulletins whose CVE records NCSC Switzerland assigned as CNA and ENISA''s EUVD listed on 2026-10-20. UBL-2026-002 (CVE-2026-9589; bulletin dated 2026-10-15): the Collaboration Server does not check whether the user reading or changing configuration has access to the entity it belongs to, so a registered user can read or change configuration of other users and, in Unblu Cloud, of other customers'' accounts; with certain non-default configuration-validation settings a registered user can write properties they may not edit in any scope; Unblu rates it 9.3 Critical for Unblu Cloud and 8.9 High on-premises (CVSS 4.0); the bulletin''s fix versions are 8.37.2 and later, the EUVD record lists Unblu Spark 7.0 up to before 8.37.0 as affected, and the CVE text says exploitation needs an authenticated session and no user interaction. UBL-2026-004 (CVE-2026-14933): during embedded co-browsing
    the agent''s browser renders the selected option of dropdown lists as HTML, so a visitor who alters the page can run JavaScript under the agent''s session in the Agent Desk or Single Conversation Desk (CVSS 4.0 8.6 on EUVD); fixed in Unblu Spark 8.35.2-hotfix.0, 8.37.2-hotfix.2, 8.38.2-hotfix.0, 8.39.3 and 7.57.9, with the workaround of setting com.unblu.messenger.embeddedCoBrowsingEnabled to false. Unblu says Unblu Cloud customers need take no action because the fix is deployed there. No exploitation is reported.'
  region_nexus: 'Switzerland: NCSC.ch is the CNA for both CVEs, which points to a Swiss-based vendor (vendor location not checked on its own site)'
