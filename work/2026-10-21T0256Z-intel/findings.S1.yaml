  novelty: new
  suggested_priority: high (patch-now for any exposed WebLogic, SOA Suite, Access Manager or EBS; no exploitation reported)
  evidence:
  - quote: This Critical Patch Update contains 1295 new security patches across the product families listed below.
    attribution: Oracle
    source_url: https://www.oracle.com/security-alerts/cpuoct2026.html
  - quote: Oracle continues to periodically receive reports of attempts to maliciously exploit vulnerabilities for which Oracle has already released security patches.
    attribution: Oracle
    source_url: https://www.oracle.com/security-alerts/cpuoct2026.html
  exposure: WebLogic and SOA Suite hosts that expose T3 or IIOP (7001 and the like) or the HTTP console, Access Manager and Identity Manager front ends, E-Business Suite 12.2.3 to 12.2.15 web tier (Workflow Notification Mailer), JD Edwards EnterpriseOne Orchestrator on 9.2.0.0 to 9.2.26.5. Read the product version from the product's own version command or the inventory; the exposure test is whether the HTTP, T3 or IIOP listener is reachable from an untrusted network. Fixed builds are in the October 2026 CPU patch sets (patch availability documents are login-gated).
  detection: 'Telemetry class: web and application-server access logs and WebLogic/SOA server logs for requests to the affected components from untrusted sources, T3/IIOP connections from unexpected networks (network flow or load-balancer logs), and Java process-creation events (java.exe or java as parent spawning cmd, sh, powershell, curl) on the middleware hosts. Oracle names no indicator, so no flaw-specific signature exists; the generic hunt is for unauthenticated requests that precede new accounts, new deployments or new files on the middleware host.'
  defender_takeaway: Patch the six 10.0 components first wherever they are reachable beyond the management network, then the WebLogic T3/IIOP and HTTP rows; where a patch cannot go in at once, remove T3/IIOP and the console from untrusted networks. Third-party-component rows (OpenSSL, curl, glibc, Mina and similar) ride along in the same patch sets and need no separate action.
  extended_notes: 'Counts are my tally of the parsed risk matrices (rows, not distinct CVEs; one CVE can appear in several products). Row partition first-party versus third-party is by whether the component label ends in a bracketed upstream library name. Oracle''s risk matrix also lists third-party CVEs older than this CPU (for example CVE-2025-15467 in OpenSSL and CVE-2022-45378 in Apache SOAP); their CVSS is Oracle''s reading of the upstream CVE in Oracle''s product context. The Oracle page''s own metadata dates the pre-release at 2026-10-15; the Modification History table reads ''Rev 1. Initial Release.'' dated 2026-October-20. No new Oracle Security Alert exists (latest alert is for CVE-2026-35273 of 2026-06-10). Next Oracle dates per Oracle: CSPU 2026-11-17, CSPU 2026-12-15.'
- title: 'AA26-293A #StopRansomware: SafePay joint advisory from FBI, CISA, USSS, Germany''s LKA Rheinland-Pfalz and UK NCA lists five edge-device and backup-server CVEs and a recovery-sabotage playbook (NAS factory reset, shadow-copy stop)'
  sources:
  - url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a
    publisher: CISA, FBI, USSS, LKA Rheinland-Pfalz, UK NCA (AA26-293A)
    date: '2026-10-20'
    role: primary
