  summary: The PHP security team announced on php.net on 2026-10-20 (20:32 UTC) an upcoming security release scheduled for Wednesday 21 October 2026 at 14:00 UTC (16:00 CEST). It addresses two critical vulnerabilities, both rated CVSS v4.0 9.2, and the team reserves the right to release earlier if details of either become public or exploitation appears; the affected and fixed versions, CVE ids and technical details are to be published with the release. CERT-EU (advisory 2026-018) names the pair CVE-2026-109618 and CVE-2026-109619, says they indicate potential unauthenticated remote code execution, and, citing a social-media post, says they could affect all PHP versions from PHP 5 onwards. Sansec (2026-10-21) states that information on the embargoed bugs leaked on 20 October, that a screenshot of an exploit tool named PHP2Shell, credited to Calif.IO, leaked alongside the advisory with a banner claiming it works against every PHP release from 5.4.0, that watchTowr confirmed they are remote-code-execution
    flaws, and that it expects mass attacks within 15 minutes of the release. These are the claims of Sansec and CERT-EU; the PHP project has published no technical detail, and at fetch time neither CVE id resolved in the CVE API or ENISA EUVD. php.net lists branches 8.2 to 8.5 as supported (newest release 8.5.11 of 2026-09-24), so servers on PHP 8.1 or older cannot expect an upstream fix (Sansec and Wordfence say so), and PHP installed from operating-system packages arrives on the distributor's own schedule (Wordfence). The fix is applied to the PHP runtime on the host or in the container image, not to the CMS or application code, so WordPress, Drupal, TYPO3 or Joomla updates do not change exposure.
  region_nexus: global; PHP underlies most CMS-based web presences, public-sector ones included (assessment, not a sourced Swiss count)
