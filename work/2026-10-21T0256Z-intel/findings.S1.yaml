    publisher: CISA Known Exploited Vulnerabilities catalog (vendor and product names for the five CVEs)
    date: '2026-10-20'
    role: corroborating
  discovery_trace: 'first seen at: cisa-advisories, WebFetch https://www.cisa.gov/news-events/cybersecurity-advisories (listing, item dated 2026-10-20) -> primary: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a (WebFetch summary, then the full text via python3 tools/fetch_source.py cisa page, which fell through to the reader; the PDF mirror returned 403 on the bridge) -> KEV catalogue (python3 tools/fetch_source.py cisa-kev) for the vendor and product behind each CVE'
  summary: CISA, the FBI, the US Secret Service, Germany's Landeskriminalamt Rheinland-Pfalz, the UK National Crime Agency and the UK North West Regional Organised Crime Unit published joint advisory AA26-293A on 2026-10-20, drawing on FBI, USSS and LKA Rheinland-Pfalz investigations as recently as August 2026. It says SafePay has been active since August 2024 across North America, South America, Europe and Australia, was among the most active ransomware groups in 2026 and has impacted at least 600 victims across critical-infrastructure sectors. Initial access is credential theft or guessing, brute force, phished account profiles used over Mullvad VPN addresses against external VPN access, and exploitation of CVE-2020-3259 and CVE-2023-20269 against edge devices plus CVE-2023-27532, CVE-2024-40711 and CVE-2024-40766 against internet-exposed systems through automated scripts; the advisory names no products, and CISA's KEV catalogue lists them as Cisco ASA and Firepower Threat Defense (the
    first two), Veeam Backup and Replication (the next two) and SonicWall SonicOS (the last), all flagged as used in ransomware campaigns. After access the actors create or take over administrator accounts, use PsExec, WinRM, RDP and ScreenConnect, AnyDesk or TeamViewer, enumerate shares with ShareFinder.ps1 and SharpShares, stage data with 7-Zip, WinRAR and RClone and exfiltrate with WinSCP, RClone, FileZilla, Backblaze b2.exe or OneDrive. The distinctive recovery sabotage is stopping the Volume Shadow Copy Service and factory-resetting network-attached storage that holds backups before a ChaCha20 and RSA hybrid encryption that appends .SafePay, followed by phone calls to the victim and leak-site posting. The advisory carries tables of IP addresses, filenames and hashes (not reproduced here) and states the IOCs were observed between November 2024 and August 2026.
  region_nexus: 'Europe and Switzerland: German LKA Rheinland-Pfalz co-authors; the store already tracks a SafePay leak-site listing of the Ticino commune of Manno (entry 2026-09-30) and S4 returned a SafePay leak with an Armasuisse folder'
