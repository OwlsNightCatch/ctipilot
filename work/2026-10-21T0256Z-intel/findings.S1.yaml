    date: '2026-10-20'
    role: corroborating
  discovery_trace: 'first seen at: unit42 feed, URL https://unit42.paloaltonetworks.com/feed/ (item ''Threat Brief: Active Exploitation of PAN-OS CVE-2026-0257 (Updated October 20)'', 2026-10-20 20:30 UTC) -> primary: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/ (extract) -> corroboration: The Register, URL https://www.theregister.com/cyber-crime/2026/10/20/palo-altos-firewall-os-has-been-under-attack-from-multiple-ransomware-groups-since-june/5304226 (WebFetch); KEV catalogue checked via python3 tools/fetch_source.py cisa-kev'
  summary: 'Unit 42''s threat brief on CVE-2026-0257, updated 2026-10-19 and 2026-10-20, says it continues to see attempted exploitation by ransomware operators including Spikey Scorpius (Qilin) and Tarnished Scorpius (Inc), and that it is aware of public reporting that attributes exploitation to actors using Settra ransomware; its investigations have been ongoing since early June 2026 and span education, financial services, healthcare, high technology, hospitality, manufacturing, professional and legal services, government, transportation and logistics, utilities and energy, and retail. Unit 42 describes attackers using the flaw for an initial foothold, bypassing MFA to establish a VPN session, then using dual-use remote-management tools for reconnaissance, RDP and SMB for lateral movement, and staging credential harvesting, exfiltration and ransomware. The reported evolution is a direct pivot to the virtualization layer: in one case attackers moved from the compromised VPN gateway to the
    vCenter management appliance, disabled the execInstalledOnly control on ESXi hosts and used a custom tool for offline credential dumping against a domain controller''s virtual disk (VMDK), which Unit 42 says bypasses in-guest EDR; it also saw this access chained with exploit tools aimed at Veeam backup infrastructure (CVE-2023-27532). The brief adds a configuration warning from Lunar Peak incident response: GlobalProtect profiles mapped to HTTP or HTTPS services on management interfaces can expose the management interface on ports 4443 and 3879 without administrators knowing, and defenders can test this with an out-of-band HTTPS connection to the management IP on those ports. The covered entry already records the Qilin link (Arctic Wolf, 2026-07-20) and the KEV ransomware flag; the new facts are Inc, the Settra mention, the government-sector listing, the hypervisor pivot and the Veeam chaining.'
  region_nexus: global; Swiss federal, cantonal and communal remote access commonly runs on GlobalProtect (assessment); exposure of the vCenter and backup tiers behind a VPN gateway is the new lesson
