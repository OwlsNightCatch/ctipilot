    text: "Unit 42 updated its threat brief on 2026-10-19 and 2026-10-20: it continues to see attempted exploitation by ransomware operators, naming Spikey Scorpius (Qilin) and Tarnished Scorpius (Inc), and says it is aware of public reporting that attributes exploitation to actors using Settra ransomware, which it does not itself confirm ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"]
