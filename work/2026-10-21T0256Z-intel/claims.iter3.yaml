  - claim_id: 85f0c9e535
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 that a software supplier of Publica detected a cyberattack at the end of September, and the supplier PK Softech AG (Reinach BL) says unknown attackers used malware to reach part of its IT infrastructure and that it must be assumed data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and says personal data of insured persons has presumably left, while the AWP agency relays the supplier's position that the volume is rather small and the data may be business data. Blick reports, citing a confidential federal information note, that the Confederation rates the incident as serious and that the security organs of the Confederation are particularly affected, which Blick glosses as the Federal Intelligence Service, the Defence Group and fedpol. The Pensionskasse Stadt Zürich now says personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch to its system, was stolen, and Pensionskasse Post says personal data did leave but not yet whether its insured persons' data is among it; the Bernische Pensionskasse now says, contrary to the supplier's earlier information, that it must be assumed personal data left, the pension consultancy Libera AG says it is also affected without knowing whose data, and the Bernische Lehrerversicherungskasse is still checking. Which fields were taken is still being clarified by each fund and the access vector is not public; Tamedia reports, and Inside IT relays, that the Akira ransomware group holds about 100 GB of the data of well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom, which neither the Confederation nor Publica has confirmed. Cantonal police warn that criminals could use leaked salary and pension data for investment-fraud calls, and the Zurich cantonal fund BVK, a customer since 2011, says it runs the software in its own data centre and is not directly affected."
