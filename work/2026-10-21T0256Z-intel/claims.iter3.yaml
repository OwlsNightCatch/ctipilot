    kind: cited
    text: "The minimum safe point releases are 0.58.24, 0.59.21, 0.60.17, 0.61.11, 0.62.9 and 0.63.5 for their respective branches, and anything on a lower point release of those branches is still vulnerable; installations below version 58 are not affected ("
    urls: ["https://www.metabase.com/blog/security-update"]
