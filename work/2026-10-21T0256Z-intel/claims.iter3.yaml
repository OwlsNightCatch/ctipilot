    surface: "section 2026-10-21T03:45:31Z"
    kind: cited
    text: "The change Unit 42 stresses is a direct pivot to the virtualization layer: in one case the attackers went from the compromised VPN gateway to the vCenter management appliance, disabled the execInstalledOnly security control on ESXi hosts and used a custom tool for offline credential dumping from a domain controller's virtual disk, which bypasses in-guest EDR; it also saw this access chained with exploit tools aimed at Veeam backup infrastructure ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"]
  - claim_id: 4cc3fc137d
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-21T03:45:31Z"
    kind: cited
    text: "The brief adds that GlobalProtect profiles mapped to HTTP or HTTPS services on management interfaces can expose the management interface on ports 4443 and 3879 without the administrators knowing, and that an out-of-band HTTPS connection to the management address on those ports shows whether it is exposed ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"]
  - claim_id: 925e2d2255
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-21T03:45:31Z"
    kind: cited
    text: "The brief dates the flaw's addition to CISA's catalog to 13 May 2026, whereas the catalog's own record says 29 May 2026 ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: e0f4d93aac
