claims:
  - claim_id: 7f5ba0c192
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "headline"
    kind: frontmatter
    text: "Qilin and Inc ransomware exploit the GlobalProtect bypass; one intrusion pivoted to vCenter and ESXi past in-guest EDR"
  - claim_id: d2cf67b8fd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-0257 is a pre-auth VPN authentication bypass in PAN-OS GlobalProtect (CISA KEV; Palo Alto reports limited exploit attempts, and Rapid7 and Unit 42 report successful exploitation): an attacker forges valid auth-override cookies by re-using the GlobalProtect certificate shared with the HTTPS service, with no credentials. CISA's KEV catalog (version 2026.10.04) marks it as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with this bypass. Unit 42 now names Qilin and Inc as exploiting it and describes one intrusion that pivoted from the VPN gateway to vCenter and ESXi and stole domain credentials offline from a domain controller's virtual disk, which in-guest EDR does not see. Patch or disable auth-override cookies, and treat a gateway that was exposed and unpatched as a compromise-assessment target that includes the virtualization and backup tier."
  - claim_id: d9c3c1794e
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every PAN-OS GlobalProtect portal and gateway to the fixed release in Palo Alto's advisory for its train, or disable authentication override cookies or give them a certificate that no other service uses, then force one re-authentication so override cookies regenerate."
  - claim_id: a33be0f90c
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[1]"
    kind: frontmatter
    text: "On every GlobalProtect gateway that was internet-reachable and unpatched at any time since 2026-05-17, treat the network behind it as a ransomware compromise-assessment target: review VPN sessions that authenticated by cookie from unexpected sources, check Windows hosts for the artifacts Arctic Wolf describes (a ransomware payload staged under C:\\\\PerfLogs, a PsExec service, an LSASS dump written through comsvcs.dll to an .odt file, an ntdsutil media copy of the Active Directory database, and cleared event logs), and extend the assessment to the virtualization and backup tier: vCenter and ESXi audit logs for a changed execInstalledOnly setting and for access to a domain controller's virtual disk, and the Veeam backup server, because Unit 42 describes one intrusion that pivoted from the gateway to vCenter and dumped domain credentials offline, which in-guest EDR does not see."
  - claim_id: 4f8f34e447
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Authentication override cookies in PAN-OS GlobalProtect let a portal or gateway issue a cookie that a user presents in place of re-authenticating, and the feature is not enabled by default ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: fed74faf9f
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says the flaw affects firewalls with a GlobalProtect portal or gateway where authentication override cookies are enabled and a specific certificate configuration exists, classes it as CWE-565 (reliance on cookies without validation and integrity checking), and scores it CVSS 4.0 7.8 with exploit maturity Attacked ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 5b54bdc1c7
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Rapid7's analysis is that when the certificate used for the cookies is reused for another feature such as the HTTPS service of the portal or gateway, a remote unauthenticated attacker can discover that certificate's public key, forge an arbitrary cookie that the server decrypts and trusts, and bypass authentication; Rapid7 Labs published a proof-of-concept script that tests for it ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: 6a1582636a
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says it is aware of limited exploit attempts on unpatched devices without mitigations applied ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: fa4de079fd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "); Rapid7 MDR dates the earliest observed exploitation to 17 May 2026 and saw two waves, on 18 May from Vultr-hosted infrastructure and on 21 May from Dromatics Systems, which it believes are likely the same threat actor because of a consistent MAC address ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
