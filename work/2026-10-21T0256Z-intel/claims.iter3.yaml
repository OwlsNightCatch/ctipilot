  - claim_id: 33b0c2f6a6
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "headline"
    kind: frontmatter
    text: "Stolen UpdraftCentral keys install backdoor plugins on WordPress sites; the plugin update alone does not evict them"
  - claim_id: f81ced884b
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "summary"
    kind: frontmatter
    text: "TeamUpdraft, the vendor of the UpdraftPlus backup plugin, says unauthorised access to teamupdraft.com on 17 and 18 October probably exposed its customer database, including UpdraftCentral connection keys, and Patchstack and Nethemba report an attacker using those keys since 2026-10-18 15:32 UTC to install backdoor plugins on connected WordPress sites that create hidden administrators. It is not a flaw in UpdraftPlus: the plugin obeys commands signed with a valid key, a key exists on many sites that never used the service because connecting a teamupdraft.com account ticks the option by default, and the vendor's fix and the discoverer's reading of it disagree on which keys the update removes."
  - claim_id: 293330f725
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "actions[0]"
    kind: frontmatter
    text: "On every WordPress site your organisation, its web agencies or its hosting suppliers run with UpdraftPlus, free or premium, including old municipal, campaign and project sites, check for an UpdraftCentral key (wp option get updraft_central_localkeys, or Settings > UpdraftPlus Backups > Advanced Tools > UpdraftCentral) and delete every key even if nobody remembers using UpdraftCentral, then update to 1.26.13 or 2.26.13 or later; deleting a key stops remote management only, and backups keep working."
  - claim_id: 635f8d49fd
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "actions[1]"
    kind: frontmatter
    text: "On any site where a plugin, must-use plugin or Editor account holding manage_options appears that nobody created, delete the UpdraftCentral key first, then restore the site from a backup taken before 17 October, rotate every administrator and UpdraftCentral password and end all sessions."
