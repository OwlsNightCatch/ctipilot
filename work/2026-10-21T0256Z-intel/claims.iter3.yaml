  - claim_id: b66a005b74
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-21T03:45:31Z"
    kind: cited
    text: "The attackers use the flaw for an initial foothold, bypass multi-factor authentication to establish a VPN session, then run reconnaissance with dual-use remote monitoring and management tools, move over RDP and SMB and stage credential harvesting, exfiltration and ransomware ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"]
