    kind: cited
    text: "Sophos X-Ops independently observed the token requests: on 2026-10-15 a single virtual private server authenticated as the ConnectWise Cloud Backup application and requested app-only Microsoft Graph tokens for about 96 minutes, from 07:11 UTC, in strictly ascending tenant-ID order, one to six minutes apart, using Python HTTP-library user agents, and the sweep included tenants with no active backup subscription ("
