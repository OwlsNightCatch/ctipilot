  - claim_id: 196ed0cb08
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "headline"
    kind: frontmatter
    text: "Eight eMudhra CA keys were guessable; browsers are protected, Go, Python, Rust and curl stacks need updates"
  - claim_id: 31012f48b3
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms now block the intermediates and eMudhra revoked them, but software that keeps its own trust store or does not check revocation stays exposed until updated; Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, and Chrome removes the emSign ECC Root CA - G3 root on 2026-10-27. No exploitation is reported."
  - claim_id: 1217406512
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the trust store or toolchain of every non-browser TLS client that keeps its own CA bundle or does not check revocation (Go 1.27.3 or 1.26.10, Python certifi 2026.10.19, rustls-webpki 0.103.16, webpki-roots 1.0.10, the curl CA bundle of 2026-10-20, the distribution ca-certificates package, container base images) and rebuild images that embed an older bundle, then confirm with curl against the tracker's test host that the client now rejects the certificate; replace before 2026-10-27 every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3."
  - claim_id: f02a1f1b0e
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "cves[CVE-2026-111943]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111943\", \"cvss\": null, \"status\": [\"patch-available\"], \"affected\": \"Go before 1.27.3 and 1.26.10 (crypto/x509 trusted chains through the affected intermediate certificates)\", \"fixed\": \"Go 1.27.3 and 1.26.10\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: ce3a26f02c
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "On 2026-10-17 a researcher reported to the Chrome Root Program, and Mozilla received a report the same day, that the private keys of eight eMudhra subordinate CA certificates were compromised: the keys were generated with insufficient randomness, which lets anyone forge trusted HTTPS certificates to impersonate any website against clients that have not removed trust in those CAs ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/", "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"]
  - claim_id: bb96b3ca17
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "BleepingComputer, citing Mozilla's incident report, says all eight were P-384 keys generated in April 2025 with values below 256, so testing 256 numbers recovers a key, and that eMudhra blames a key-generation script error and found no evidence of end-user certificates ("
    urls: ["https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"]
  - claim_id: 4c17639e15
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "Google reports that no certificates chaining to the six TLS intermediates were logged to Certificate Transparency before it blocked them, so CT-enforcing clients such as Chrome could not have been attacked ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"]
  - claim_id: d17c3173d3
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "); the tracker adds that many clients outside browsers do not enforce CT and that it is not known whether attackers used the flaw against them ("
    urls: ["https://emudhra.we-have-a-problem.com/"]
  - claim_id: 7659f358db
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "Chrome blocked the intermediates on 2026-10-17, Firefox through OneCRL the same day, Apple devices on 2026-10-19 and Microsoft platforms on 2026-10-20, and eMudhra revoked all eight ("
    urls: ["https://emudhra.we-have-a-problem.com/", "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"]
