    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Framework, the laptop manufacturer, told customers that the attackers stole full names, email addresses, login IP addresses, billing and shipping address details, phone numbers and company names, with VAT, EIN and billing email address additionally in scope for its business customers, and said Metabase notified it on 6 August that its instance had been vulnerable and was accessed on 3 August ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: a3f0ea5f43
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Tally, an online form builder, notified users that its Metabase analytics environment was compromised on the same date and that the attackers reached email addresses and password hashes, while its forms and the responses submitted to them are stored separately and were not reached ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: 428343a9c8
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The attack shows up as a call to `POST /api/session/reset_password` returning a 400 status code followed by a call to `GET /api/user/current` returning 200, and Metabase states that finding that pattern in application logs or in Metabase server ingress logs means the instance was likely compromised ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 3d67f476ef
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "After upgrading, the vendor's own follow-up steps for any instance whose reset endpoint was publicly reachable are to revoke every active session by deleting all rows in the `core_session` table, review and delete unrecognised API keys, check administrator accounts for unexpected changes, rotate the credentials for every connected database, and review both data-warehouse logs and Metabase's own activity and query history for unauthorised access ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 48b0f4095e
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The discriminator is what follows it from the same source: an unauthenticated client that is genuinely failing a password reset has no session and cannot then get a 200 from `/api/user/current`, so it is the ordering and the success of the second call that separate exploitation from noise ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: ddc1ae83cb
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "The exposure split is the part defenders need to act on."
