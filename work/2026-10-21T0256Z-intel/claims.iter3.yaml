    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the reason this deserves attention beyond the patch is what a BI platform holds."
  - claim_id: e377f800d4
