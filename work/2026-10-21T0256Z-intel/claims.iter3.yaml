    surface: "body"
    kind: cited
    text: "**Exposure:** any software that keeps its own CA bundle or does not check revocation keeps trusting the intermediates until updated; the tracker lists fixed versions for Python certifi, rustls-webpki, webpki-roots, the curl CA bundle and several distributions' ca-certificates packages, and shows Node.js, Bun and FreeBSD as pending when read ("
    urls: ["https://emudhra.we-have-a-problem.com/"]
  - claim_id: d90f340154
