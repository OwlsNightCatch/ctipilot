  - claim_id: 8d051accc5
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Metabase, an open-source business-intelligence platform run both self-hosted and as a managed cloud service, disclosed on 2026-08-06 that its own Metabase Cloud environment had been attacked by someone using an unknown vulnerability affecting versions 1.58 and above, and that it blocked the endpoints used in the attack before identifying and patching the flaw ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 72c9110b5b
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The mechanism matters more than the platform: an unauthenticated caller injects arbitrary SQL against the Metabase application database, and that yields administrator access to the instance — from which the attacker can change the application configuration, steal the stored credentials Metabase holds for the databases it connects to, read anything reachable through those connections, and export it ("
    urls: ["https://www.metabase.com/blog/security-update", "https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"]
  - claim_id: c4d090067d
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Neither the vendor nor the reporting locates the injection point precisely, but the vendor's stated interim workaround for anyone who cannot upgrade immediately is to block the `/api/session/reset_password` endpoint outright, and its published attack pattern runs through that same route ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 5c59d4f866
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "BleepingComputer, quoting the associated security advisory, reports it is rated critical at CVSS 10.0 with active exploitation confirmed, and that no CVE identifier had been assigned ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: d69ced1daf
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The advisory later assigned CVE-2026-72898, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-08-11 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog"]
