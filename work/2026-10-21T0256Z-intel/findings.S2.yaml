    discovery_trace: "first seen at: srf-news RSS, URL https://www.srf.ch/news/bnf/rss/1646 (item 'Schweizer Luftraum - Skyguide behebt Stoerung - Kapazitaet bei 80 Prozent', 2026-10-20 17:49 CEST; outside my slice, swept as home-region gap-closing) -> extract https://www.srf.ch/news/schweiz/schweizer-luftraum-skyguide-behebt-stoerung-kapazitaet-bei-80-prozent -> WebSearch ('Skyguide Flugsicherung Stoerung Oktober 2026 Kapazitaet 80 Prozent Stabilisierungsphase') -> extract https://www.nau.ch/news/schweiz/technische-storung-bei-skyguide-behoben-67190872 (Keystone-SDA) -> extract https://www.finanzen.ch/nachrichten/aktien/skyguide-reduziert-kapazitat-wegen-technischer-stoerung-1036644344 (AWP). Skyguide's own newsroom (https://www.skyguide.ch/media-centre) is a Nuxt SPA that rendered an empty list on every transport tried, so the company statement is read only through the two wire services."
    summary: |
      Skyguide, the Swiss air navigation service provider, reported on 2026-10-20 a technical fault in the system that generates the radar picture for air traffic controllers and, as a precaution, cut capacity in Swiss airspace by 50 percent; take-offs and landings at Zurich and Geneva were briefly interrupted. By the evening Skyguide said the fault was fixed and the cause identified, raised capacity to 80 percent and kept a 20 percent restriction for a 24-hour stabilisation phase. Keystone-SDA relays Skyguide's statement that there are currently no signs of a cyberattack, and AWP relays the same. The sources do not name the cause, the component or the vendor, and they give no attacker behaviour, so this is a critical-infrastructure availability item whose only security content is a negative statement ("no signs of a cyberattack at present"), attributed to Skyguide.
    region_nexus: "Switzerland; federally owned air navigation infrastructure serving civil and military air traffic"
