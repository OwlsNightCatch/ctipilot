watchlist_sweep:
  duty: sector-lens
  note: "Sector lens applied (Swiss federal, cantonal and communal public sector; emergency services; Armed Forces and suppliers). No product or supplier watchlist is configured. Policy/regulatory watch swept: BACS press releases (newest 2026-10-12), Im Fokus (week 42 only), Aktuelle Vorfaelle (newest 2026-08-18), news.admin.ch (12 newest cards, all 2026-10-20: only the SGC tender is relevant), EDOEB press (newest 2026-09-16), ENISA news (newest 2026-10-16, an ECSC result), EDPB (newest 2026-10-16), EC digital-strategy newsroom, Europol newsroom, OFAC recent actions, ACN (Italy) feed. Result: no change in what Swiss public-sector defenders are obliged or advised to do in the window (no ISG/CSV change, no new BACS obligation, no NIS2/CRA step with a deadline, no sanction or takedown touching named threat infrastructure). The BACS Technologiebetrachtung on authentication (2026-10-19) is already an entry."

candidate_sources:
  - id: bs-ch-medienmitteilungen
    publisher: "Kanton Basel-Stadt, Medienmitteilungen (cantonal government press releases)"
    url: "https://www.bs.ch/medienmitteilungen"
    category: gov
    why: "First-party cantonal incident disclosures that never reach the store before the trade press: the Erziehungsdepartement release of 2026-09-04 (print software patched on the vendor's end-of-August notice, unauthorised access attempts still on 3 September, system fully rebuilt; vendor not named) was read through the Vaud SOC digest six weeks later. Cantonal and communal press rooms are the largest uncovered surface of the home-region lens; the listing route has not been probed, `extract` reads the release page."

coverage_gaps:
  - source_id: apa-ots
    reason: "https://www.ots.at/ returns a Angular shell on `extract` (direct-raw) with no listing; no feed or listing route exists (recipe missing). Not a fetch failure; WebSearch found no in-window Austrian public-body cyber item."
  - source_id: vaud-soc-cyber-threat-review
    reason: "RECIPE CORRECTION. The record note of 2026-10-19 says the September edition was published 2026-09-15 and the October edition is due 2026-10-15 to 2026-10-20. The evidence says otherwise: the page https://www.vd.ch/actualites/actualite/news/26702-revue-des-cybermenaces-septembre-2026 carries a CMS label 'Publie le 15.09.2026' that was copied from the August page (26621), while the PDF https://www.vd.ch/fileadmin/user_upload/organisation/dinf/dsi/fichiers_pdf/securite/SOC_-_Rapport_cybermenaces_-_Septembre_2026.pdf is dated 15.10.2026 (v1.0) and covers September events up to early October. The review named for month M is published about mid-(M+1); the October edition is therefore due about 2026-11-15. Working recipe: `url https://www.vd.ch/cybersecurite` lists every edition (new id 26702), `extract` reads the page summary, `pdf <PDF url>` reads the 29-page report (77,713 chars decoded, per-font ToUnicode)."
  - source_id: tagesanzeiger.ch (Tamedia)
    reason: "`extract` of a Tamedia article falls back to the metered reader and returns only the standfirst and 'In Kuerze' bullets (paywall); enough for the lead facts, not the body."
  - source_id: news-admin-ch
    reason: "`url https://www.news.admin.ch/de/newnsb` returns only the 12 newest cards (cards use <h2>, not <h3>); `?page=N` returns the same page (pagination is client-side), and every department host (vbs/efd/bk/fedpol/ejpd/bit .admin.ch/de/newnsb) serves the same unfiltered list. When one day carries more than 12 releases the rest are unreachable; no department-filtered route was found."
  - source_id: ncc-research
    reason: "`url https://www.nccgroup.com/research-blog/` lists /research/<slug>/ links; `extract` returned a date for only 2 of 7 sampled posts (2026-10-12, 2026-10-06), so in-horizon items cannot be dated reliably from the listing."
  - source_id: enisa
    reason: "Quiet, not a failure (newest 2026-10-16). Observation for the audit: the ENISA Threat Landscape 2026 (ENISA news item dated 2026-09-22, 'Exploring the evolution of the cyber threat landscape: How dependencies weaken our digital resilience') has no store entry; it is outside this window, an annual-report class item."

recipe_notes:
  - "cert-at: the `warnings` feed was quiet (newest 2026-10-15), the `current` feed carried the one in-window item (PHP pre-announcement 2026-10-20 22:29 UTC+1) and `extract` reads the article; the `daily` digest (https://www.cert.at/de/tagesberichte/2026/10/tagesberichte-20102026) is a useful DACH discovery aggregator (it surfaced eMudhra, TeamUpdraft, Unit 42 PAN-OS)."
  - "ncsc-ch-focus / ncsc-ch-incidents / bacs-press: `url <page>` plus a split on class=\"card__content\" with meta-info__item (date) and h3 (title) works for all three (84 / 6 / 161 cards); news.admin.ch uses h2 titles."
  - "edpb: pair each <time datetime=...> with the following /news/<slug>_en href in the `url` body to date the listing."
  - "heise-sec: feed holds 20 items spanning 4 days; in-window 2026-10-20 items were 4."
  - "inside-it-ch: feed https://www.inside-it.ch/rss.xml fine; article bodies are paywalled after the lead (extract returns lead plus teaser noise)."

