  - title: "BACS weekly review, week 42: hotel-booking phishing now targets TWINT and e-banking accounts, with the attackers relaying the bank's second factor in real time"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w42-de", publisher: "BACS / NCSC Switzerland (Swiss Federal Office for Cybersecurity)", date: "2026-10-20", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (bridge `url` card parse, top card dated 20. Oktober 2026, 84 cards) -> primary (no pivot needed): https://www.bacs.admin.ch/de/26w42-de via `extract`"
    summary: |
      BACS's weekly review of 2026-10-20 describes a development of hotel-booking phishing it has reported before. The attackers hold detailed stay data (names, e-mail addresses, booking dates, the booked hotel) that BACS says presumably comes from compromised booking systems, contact former and current guests in the hotel's name from look-alike domains with a cloned hotel site, and promise a 7.5 percent cashback. The cashback flow ends on a faked bank login page; while the victim is led through the "refund", the attackers log in to e-banking in the background and, when the bank asks for the second factor, prompt the victim under a pretext to approve or type it in, in some cases a code generated with a card reader. BACS says the aim is mainly to re-register the TWINT account linked to the bank account to another phone number, and that the method is known from classifieds-platform phishing. This is an awareness-level consumer-fraud item (BACS sources are first-party); its only relevance to a Swiss public-sector SOC is staff awareness and a real-time MFA-relay pattern, and it names no public body.
    region_nexus: "Switzerland (BACS consumer-fraud reporting)"
    primary_sector_nexus: "indirect (staff as private customers; no public-sector victim named)"
    sector: "finance"
    cves: []
    techniques: [T1566.002, T1111, T1657]
    affected_products: ["TWINT", "Swiss e-banking logins"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    classification_hint: "reliability A (BACS is the first-party authority), credibility 2 (single authority report of observed cases, no independent corroboration)"
    novelty: new
    borderline: true
    borderline_reason: "Consumer-fraud awareness; the ncsc-ch-focus record's own audit trail says Im Fokus weekly reviews usually do not clear this deployment's technical-depth bar, and it names no public body. Recommend drop unless the main agent wants a one-line BACS-awareness record."
    evidence:
      - quote: "The perpetrators thereby gain access to customer data of former and current guests and then contact them in the name of the hotel."
        original: "Die Täter erhalten dadurch Zugriff auf Kundendaten früherer und aktueller Gäste und kontaktieren diese anschliessend im Namen des Hotels."
        attribution: "BACS"
        source_url: "https://www.bacs.admin.ch/de/26w42-de"
      - quote: "As soon as the bank requests the second factor, the victims are asked under a pretext to approve or enter the required confirmation."
        original: "Sobald die Bank den zweiten Faktor anfordert, werden die Opfer unter einem Vorwand zur Freigabe oder Eingabe der erforderlichen Bestätigung aufgefordert."
        attribution: "BACS"
        source_url: "https://www.bacs.admin.ch/de/26w42-de"
      - quote: "The criminals above all try to re-register the TWINT account linked to the bank account to another telephone number."
        original: "Die Kriminellen versuchen damit vor allem, das mit dem Bankkonto verknüpfte TWINT-Konto auf eine andere Telefonnummer umzuschreiben."
        attribution: "BACS"
        source_url: "https://www.bacs.admin.ch/de/26w42-de"

  - title: "Swiss Government Cloud: the BIT opens the tender for up to CHF 7 billion across three cloud tiers, open to cantons and communes, awards planned late summer 2027"
    sources:
      - { url: "https://www.news.admin.ch/de/newnsb/vL4DxR3WIhey", publisher: "Swiss Federal Administration (news.admin.ch, BIT release)", date: "2026-10-20", role: "primary" }
      - { url: "https://www.inside-it.ch/bis-zu-7-milliarden-fuer-swiss-government-cloud-20261020", publisher: "Inside IT", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item 'Bis zu 7 Milliarden fuer Swiss Government Cloud', 2026-10-20 10:46 GMT) -> extract https://www.inside-it.ch/bis-zu-7-milliarden-fuer-swiss-government-cloud-20261020 (paywalled lead only) -> primary: federal release found on the news.admin.ch listing (bridge `url` https://www.news.admin.ch/de/newnsb) and read with `extract` https://www.news.admin.ch/de/newnsb/vL4DxR3WIhey"
    summary: |
      On 2026-10-20 the Federal Office of Information Technology and Telecommunication (BIT) published the tender for the Swiss Government Cloud on SIMAP: a hybrid multi-cloud of three tiers, namely a global-reach public cloud (two awardees), a Swiss-only-data-handling public cloud "Enhanced Data Governance" built on open-source solutions (two awardees) and an on-premise private cloud in federal data centres for especially sensitive applications (one awardee). The release says the tender uses criteria from the federal directive on digital sovereignty, caps each provider to one lot, and sets awards for seven years with a 14-year total term; optional volume is up to CHF 2 billion each for lots 1 and 2 and CHF 3 billion for lot 3 (about CHF 7 billion in total), the prequalification phase runs 60 days, awards and contracts are planned for late summer 2027 and first call-offs for late autumn 2027. The BIT says the SGC is designed for the Confederation's needs and that cantons and communes can use it if interested. Nothing in the release changes an obligation or a security control a defender must act on now; it is the procurement start of the federal administration's future hosting platform.
    region_nexus: "Switzerland; federal administration, with cantonal and communal use envisaged"
    primary_sector_nexus: "direct (public-sector hosting platform)"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: ["Swiss Government Cloud (SGC)"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    classification_hint: "reliability A (the procuring federal office, first-party), credibility 2 (single first-party announcement; trade press only relays it)"
    novelty: new
    borderline: true
    borderline_reason: "Policy/procurement awareness that sets no new obligation and no action for defenders today; relevant only as a strategic data-point on where federal, cantonal and communal workloads will be hosted from late 2027. Recommend drop under the do-now bar unless the main agent keeps a short 'routine' policy record."
    evidence:
      - quote: "With the SGC, the Confederation, cantons and communes are in future to be able to provide digital services efficiently, securely and as needed."
        original: "Mit der SGC sollen Bund, Kantone und Gemeinden künftig digitale Leistungen effizient, sicher und bedarfsgerecht bereitstellen können."
        attribution: "Swiss Federal Administration (BIT)"
        source_url: "https://www.news.admin.ch/de/newnsb/vL4DxR3WIhey"
      - quote: "Provided there are no objections with suspensive effect, the award decisions including contract conclusions are to be published in late summer 2027."
        original: "Sofern es keine Einsprachen mit aufschiebender Wirkung gibt, soll im Spätsommer 2027 die Publikation der Zuschläge inklusive Vertragsabschlüsse erfolgen."
        attribution: "Swiss Federal Administration (BIT)"
        source_url: "https://www.news.admin.ch/de/newnsb/vL4DxR3WIhey"
      - quote: "The SGC is designed for the requirements and needs of the Confederation; cantons and communes are also meant to be able to benefit from the offer if interested."
        original: "Die SGC ist für die Anforderungen und Bedürfnisse des Bundes konzipiert, Kantone und Gemeinden sollen bei Interesse ebenfalls vom Angebot profitieren können."
        attribution: "Swiss Federal Administration (BIT)"
        source_url: "https://www.news.admin.ch/de/newnsb/vL4DxR3WIhey"

