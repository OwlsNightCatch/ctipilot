  item: "2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (title, headline, summary, claims 7cd6a435fb and 95c3d20d7f; low confidence)"
  url_or_quote: "headline: \"an exploit tool is reported leaked\"; title: \"with an exploit tool reported leaked\"; summary: \"Sansec reports a leaked exploit tool\""
  summary: "(low confidence) Sansec (https://sansec.io/research/php2shell) says only that \"A screenshot of an exploit tool named PHP2Shell, credited to Calif.IO, leaked alongside the advisory. Its banner claims the tool works against every PHP release from 5.4.0 on.\" The body paragraph states this correctly (\"a screenshot of an exploit tool\") but the title, headline and summary say the tool itself leaked, which reads as a weaponised exploit in circulation. The title also states \"two critical remote-code-execution flaws\" as established although php.net says only \"two critical vulnerabilities\" and RCE rests on CERT-EU's reading of the scores plus Sansec's report of watchTowr. Fix: say a screenshot of an exploit tool is reported leaked, and hedge RCE as reported in the title."
