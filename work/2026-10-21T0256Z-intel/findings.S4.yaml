    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Over the weekend of 17-18 October we identified unauthorised access to the teamupdraft.com website."
        attribution: "TeamUpdraft"
        source_url: "https://teamupdraft.com/blog/security-incident-october-2026/"
      - quote: "We believe our customer database was accessed."
        attribution: "TeamUpdraft"
        source_url: "https://teamupdraft.com/blog/security-incident-october-2026/"
      - quote: "An attacker holding valid UpdraftCentral dashboard keys is installing backdoor plugins on connected WordPress sites."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/"
      - quote: "This is not a vulnerability in UpdraftPlus"
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/"
      - quote: "Connecting a TeamUpdraft.com account is the other, and it happens by default."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/"
      - quote: "the unauthorised access was resolved and an update to UpdraftPlus (1.26.13 and 2.26.13) published just after 10pm BST on the 19th revoked UpdraftCentral connection keys thus blocking any access across that vector"
        attribution: "TeamUpdraft"
        source_url: "https://teamupdraft.com/blog/security-incident-october-2026/"
      - quote: "Even 1.26.13 does not delete keys created on 18 October between 12:07 and 21:00 UTC"
        attribution: "Nethemba"
        source_url: "https://nethemba.com/updraftcentral-backdoor-analysis/"
    extended_notes: |
      Classification hint: victim statement is first-party (A-grade for the breach facts); Patchstack/Nethemba are independent telemetry from their own sites (B). Credibility 1 for the key-theft-to-backdoor chain (three independent observers); the exact fixed-version behaviour is contested (vendor vs Nethemba).
      Detection (telemetry class first): (1) web-server access logs on the WordPress site: POST requests to the site root carrying an UpdraftCentral RPC body whose User-Agent lacks the library version and URL that genuine dashboard traffic carries (Patchstack: genuine traffic looks like 'WordPress/<ver>; class-udrpc.php/2.0; https://teamupdraft.com'); GET requests with a short underscore-prefixed parameter and a 32-character token (the backdoor trigger) mean the backdoor was used, not merely installed. (2) The UpdraftCentral log on the site: 'Command received: plugin.upload_plugin' (and plugin.delete_plugin) with no matching administrator action. (3) File-system/plugin inventory: plugins or must-use plugins nobody installed; Patchstack gives the description line 'Small maintenance toolkit: keeps option storage tidy.' as the most stable file-level marker and 'Site Health Cache' as the most reused name; the later 'hidden' variant hides from the admin plugin list, so inspect disk, not wp-admin. (4) User table: find the backdoor account by capability, not name - an Editor role that also carries manage_options (Patchstack SQL idea over wp_usermeta capabilities). (5) Symptom: HTTP 500 on every uncached request after a plugin install (broken variant) or WordPress error mails naming an unknown plugin.
      Triage / benign lookalikes: a plugin install or removal arriving through UpdraftCentral is legitimate only if the owner did it from their own dashboard; the discriminators are the User-Agent form (library version plus URL present vs absent), a matching administrator session/ticket for the same minute, and the plugin's origin (wordpress.org slug vs a two- or three-word generic name with the identical maintenance-toolkit description). A single HTTP 500 after a plugin update is common and benign on its own; the combination with an unknown plugin and a new Editor account is the signal.
      Post-patch compromise check (the step readers miss): updating UpdraftPlus is not enough. The backdoor plugin, any account it created (it persists after the plugin is removed, with a known password) and, per Nethemba, keys created between 12:07 and 21:00 UTC on 18 October all survive 1.26.13. Delete the UpdraftCentral keys on every site (Patchstack: `wp option get updraft_central_localkeys` shows whether a key exists; UI: Settings > UpdraftPlus Backups > Advanced Tools > UpdraftCentral > Manage existing keys; `wp option delete updraft_central_localkeys` removes them), then hunt plugins, mu-plugins and capability-elevated Editor accounts; restore from a clean backup taken before 17 October if anything is found (TeamUpdraft); rotate administrator passwords and any remote-storage credentials. Do not 'repair' a crashing backdoor plugin. Keep the site on a key-free setup or create the key under an account without install_plugins (Patchstack: that single detail stopped the attack on one analysed site). Nethemba reports that on a site running Wordfence, Patchstack and Cloudflare none of them stopped the validly signed command, and Patchstack notes the cookie login bypasses 2FA, login-attempt limits and login-protection plugins.
      Defender takeaway: audit every WordPress estate, including 'forgotten' municipal and campaign sites, for an UpdraftCentral key even where nobody remembers using UpdraftCentral; IP blocking is not a control (Patchstack saw the source rotate within a day). Wider lesson: a vendor-held management key for customer sites is a standing supply-chain credential; ask WordPress suppliers whether remote-management keys exist and who holds the private half.
