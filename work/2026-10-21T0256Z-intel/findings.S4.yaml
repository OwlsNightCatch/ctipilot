    discovery_trace: "first seen at: inside-it-ch RSS https://www.inside-it.ch/rss.xml (item 'Datenleck bei Publica gefaehrdet auch Sicherheitsbehoerden', 2026-10-20 12:54 GMT, found while sweeping Swiss incident leads; S2 holds inside-it-ch and also logged it) -> extract https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020 -> primary (original report): Tages-Anzeiger/Tamedia, URL https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025 (paywall: only the standfirst and 'In Kuerze' bullets readable) -> primary (victim-side position): Publica, URL https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (status 2026-10-20)"
    summary: |
      UPDATE on the covered entry 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow, whose current text says the access vector, the actor and any ransom demand are not public. DELTA (claims, attributed): Tamedia's Tages-Anzeiger (2026-10-20, 10:26 CEST) says the Akira group stole about one hundred gigabytes of compressed pension-fund data, that data on well over a hundred thousand current and former federal employees is affected, that it includes employees of the security authorities, and that Akira now demands ransom; its standfirst adds that special agents, elite soldiers and former Federal Councillors are among those whose data was taken (that Federal Councillors of 2014 are among them 'steht nicht fest'). Inside IT, summarising the Tamedia investigation, adds: the data sets contain employer details of people working under cover identity for fedpol or the Federal Intelligence Service (NDB); an internal assessment sees a 'danger to life and limb' for individual persons; the NDB is for now forgoing certain operations without recalling agents from abroad; the State Secretariat for Security Policy has already seen first fraudulent contact attempts linked to Publica; State Secretary Markus Mäder set up a task force under federal information-security officer Anne Rivera; the involved federal bodies assume Akira is responsible and that the group is holding the data and threatening to publish or sell it if unpaid; other large pension funds may be affected too. Inside IT states explicitly that neither the Confederation nor Publica has confirmed the perpetrator or the alleged ransom demand.
      FACTS (Publica, status 2026-10-20): whether data actually left Publica's holdings, and whose, is still being investigated; it still has no indication that data was published on the darkweb; it updated its FAQ and advises against responding to contact attempts asking for personal or bank data.
      CONTEXT (Inside IT): Akira was also behind the attack on RUAG's US subsidiary a year ago, where RUAG paid ransom; the Federal Prosecutor's Office, fedpol and BACS warned of stepped-up Akira activity in Switzerland in October 2025.
      Assessment owner: the Akira attribution and the ransom demand rest on Tamedia's sources among 'involved federal bodies' and are not independently confirmed in any source read; treat as a credible-but-unconfirmed claim.
