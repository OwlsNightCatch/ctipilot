  - title: "TeamUpdraft breach: stolen UpdraftCentral cloud keys used to push backdoor plugins to connected WordPress sites (no UpdraftPlus code flaw, no CVE)"
    priority_hint: high
    sources:
      - { url: "https://teamupdraft.com/blog/security-incident-october-2026/", publisher: "TeamUpdraft", date: "2026-10-20", role: "primary" }
      - { url: "https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/", publisher: "Patchstack", date: "2026-10-19", role: "primary" }
      - { url: "https://nethemba.com/updraftcentral-backdoor-analysis/", publisher: "Nethemba", date: "2026-10-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/stolen-updraftcentral-keys-used-to-backdoor-wordpress-sites/", publisher: "BleepingComputer", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (15-item feed, item dated 2026-10-20 21:01 -0400) -> extract https://www.bleepingcomputer.com/news/security/stolen-updraftcentral-keys-used-to-backdoor-wordpress-sites/ -> primary (victim statement): TeamUpdraft, URL https://teamupdraft.com/blog/security-incident-october-2026/ -> primary (discoverer analysis): Nethemba, URL https://nethemba.com/updraftcentral-backdoor-analysis/ -> primary (telemetry write-up): Patchstack, URL https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/"
    summary: |
      FACTS (TeamUpdraft, the victim): the vendor of the UpdraftPlus backup plugin (4M+ active installs per Patchstack) found unauthorised access to teamupdraft.com over 17-18 October 2026 and believes its customer database was read: names, emails, billing addresses, order history, password hashes, two-factor settings and the connection keys for UpdraftCentral, UpdraftVault and UpdraftClone. It says UpdraftPlus plugin files and downloads, backups in customers' own remote storage and self-hosted UpdraftCentral were not affected, and that it reported the incident to the ICO. 
      MECHANISM (Patchstack, Nethemba): this is not a vulnerability in UpdraftPlus. The UpdraftCentral client ships inside every UpdraftPlus copy and, once a site holds a key, executes any command signed with the matching dashboard private key; the attacker, holding keys that leaked from the UpdraftCentral cloud service, sends a signed plugin.upload_plugin command over the plugin's RPC channel (ordinary POST requests to the site root), WordPress installs and activates the supplied plugin, and every site-side check passes. Patchstack saw backdoor installations on a broad set of sites from 2026-10-18 15:32 UTC and counted 99 distinct plugin names; the backdoor wakes on a secret URL parameter carrying a 32-character token, creates an account shown as Editor, then grants it manage_options and install_plugins, and logs the visitor in by setting a cookie directly, so the login form, 2FA and login-protection plugins never run. The account outlives the plugin. Several samples carry a coding error that crashes the site with HTTP 500 on every uncached request; Patchstack warns that repairing such a plugin switches the backdoor on. Nethemba reports a working variant that logs the attacker in as an existing administrator and leaves no database trace, an attacker who re-delivered backdoors after removal (plugin.delete_plugin followed seconds later by a new upload), and probing of removed backdoors on 20 October.
      EXPOSURE (Patchstack): sites hold a key when UpdraftCentral was connected, or when a teamupdraft.com account was logged in from the plugin, because the 'Add this website to UpdraftCentral' checkbox on that screen is ticked by default; keys do not expire (keys from November 2025 still worked in October 2026). BleepingComputer reports an estimate that about 10 percent of UpdraftPlus sites hold a key, around 400,000 websites. 
      DISPUTED/OPEN: TeamUpdraft says UpdraftPlus 1.26.13 / 2.26.13 (published just after 22:00 BST on 19 October) revokes UpdraftCentral connection keys and blocks the vector; Nethemba says 1.26.12/2.26.12 deleted no key (bug) and that even 1.26.13 does not delete keys created on 18 October between 12:07 and 21:00 UTC, which must be removed by hand. Which version first actually revokes everything is therefore contested by the discoverer. How the attacker got into teamupdraft.com is not stated ('closed the access route, deployed a fix for the underlying weakness').
      Prior context (Patchstack): second incident in this channel in five months; June 2026 CVE-2026-10795 (CVSS 8.1) let an attacker forge UpdraftCentral commands without keys on older versions.
    region_nexus: "global (WordPress); no Swiss victim named in any source; Swiss public sites on WordPress that ever used UpdraftPlus with a teamupdraft.com login hold a key"
    primary_sector_nexus: "indirect - supplier/vendor cloud management plane with transferable blast radius; relevant to WordPress-based municipal, cantonal and institutional sites"
    sector: "public-sector (indirect), technology"
    cves: []
    techniques: [T1199, T1136, T1098, T1505.003, T1078]
    affected_products: ["UpdraftPlus", "UpdraftCentral", "UpdraftVault", "UpdraftClone", "WordPress"]
    entity_keys: ["product:wordpress"]
    new_entities:
