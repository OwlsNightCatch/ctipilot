  - title: "eMudhra: private keys of eight intermediate CA certificates were recoverable from the certificates themselves; Mozilla, Chrome, Apple and Microsoft distrust them, but clients that ignore revocation keep trusting until their CA bundle is updated"
    priority_hint: high
    sources:
      - { url: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/", publisher: "Mozilla Security Blog", date: "2026-10-20", role: "primary" }
      - { url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", publisher: "Mozilla CA Program (Bugzilla 2083449)", date: "2026-10-20", role: "primary" }
      - { url: "https://emudhra.we-have-a-problem.com/", publisher: "eMudhra incident tracker (Mozilla's Dennis Jackson, per BleepingComputer)", date: "2026-10-20", role: "primary" }
      - { url: "https://groups.google.com/g/golang-announce/c/66pojueaQek", publisher: "Go project (golang-announce)", date: "2026-10-20", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/", publisher: "BleepingComputer", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (item dated 2026-10-20 20:46 -0400) -> extract https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/ -> primary: Mozilla Security Blog, URL https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/ -> primary: Mozilla Bugzilla 2083449, URL https://bugzilla.mozilla.org/show_bug.cgi?id=2083449 -> primary: tracker, URL https://emudhra.we-have-a-problem.com/ -> vendor advisory for the CVE: golang-announce, URL https://groups.google.com/g/golang-announce/c/66pojueaQek"
    summary: |
      FACTS (Mozilla, the Mozilla CA bug, the tracker): on 2026-10-17 at 20:06 UTC Mozilla received a report from the researcher 'Wayne' that the private keys of eight eMudhra intermediate certificates were compromised, with proof of key control; Mozilla confirmed it, recovered the keys independently at 21:48 UTC and called the generation flaw trivial to exploit. Six intermediates issue TLS certificates and chain to roots trusted by the Chrome, Mozilla, Microsoft and Apple root programs; two are code-signing intermediates trusted by Microsoft; Sectigo cross-signed some of them. BleepingComputer (which verified one published key) reports all eight used P-384 keys generated in April 2025 with private-key values below 256, so anyone could recover them by trying 256 values; eMudhra blames a certificate-generation script error that created a second, weaker key set which was mistakenly selected for signing, and says most of the intermediates were never used in production and it found no evidence of issuance to end users. eMudhra marked the eight certificates revoked (reason caCompromise) at 09:38 UTC on 2026-10-18.
      RESPONSE: Firefox blocked them via OneCRL by 22:59 UTC on 17 October with no browser update needed; Chrome blocked the six TLS intermediates the same day, Apple on 19 October and Microsoft on 20 October (tracker); Mozilla shipped Firefox 158.0.1, ESR 115.43.1 and ESR 153.5.1 for configurations that missed OneCRL and NSS 3.131.1 removes the signing root. Go 1.27.3 and 1.26.10 block the intermediates in crypto/x509 (CVE-2026-111943, Go project).
      RESIDUAL RISK (tracker): the tracker's own assessment is that an attacker holding any of the keys 'could impersonate any website or service' on clients that do not consume revocation data; no CT-log entries exist for these intermediates since April 2025, so CT-enforcing browsers could not have been attacked, but 'we do not know if attackers exploited the flawed key generation to target these clients' (non-browser clients that do not enforce CT). The tracker lists FreeBSD ca_root_nss, Node.js and Bun as still pending an update at the time of fetch and warns that macOS's built-in /usr/bin/curl may keep trusting the intermediates because its bundle does not check revocation.
    region_nexus: "global (public WebPKI trust); no Swiss victim; Swiss organisations' non-browser tooling (Go, curl/openssl-based agents, language runtimes, container images) inherits the affected trust stores"
    primary_sector_nexus: "indirect - infrastructure-trust event affecting every network position-dependent TLS client"
    sector: "technology, all sectors"
    cves: [CVE-2026-111943]
    techniques: [T1557, T1553]
    affected_products: ["emSign Root TLS CA - G3 and emSign Root CS CA - G3 intermediates (EM EV/OV/DV TLS CA G3B and G3C, EM OV CS CA G3B and G3C)", "Mozilla NSS", "Mozilla Firefox", "Go (crypto/x509)", "Python certifi", "curl CA bundle", "Node.js", "Ubuntu ca-certificates", "Debian ca-certificates", "FreeBSD ca_root_nss"]
    entity_keys: ["product:mozilla-firefox"]
    new_entities:
      - { key: "incident:emudhra-intermediate-ca-key-compromise-2026-10", type: incident, name: "eMudhra intermediate CA private-key compromise", aliases: ["eMudhra intermediate certificates compromise", "emSign G3 intermediates", "CVE-2026-111943"], summary: "Eight eMudhra intermediate CA certificates (six TLS, two code-signing) whose P-384 private keys, generated in April 2025, were recoverable from the certificates; reported 2026-10-17, revoked by eMudhra on 2026-10-18 and distrusted by Mozilla, Chrome, Apple and Microsoft; Go tracks it as CVE-2026-111943 (Mozilla, Bugzilla 2083449, 2026-10-20)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On Saturday, October 17, at 20:06 UTC, Mozilla received a report that private keys associated with eight eMudhra intermediate certificates had been compromised."
        attribution: "Mozilla Security Blog"
        source_url: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"
      - quote: "These keys could allow attackers to issue fraudulent HTTPS certificates for websites they do not control."
        attribution: "Mozilla Security Blog"
        source_url: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/"
      - quote: "The private keys for the intermediate certificates were incorrectly generated by the CA. This means that anyone can recover them from the certificates."
        attribution: "eMudhra incident tracker"
        source_url: "https://emudhra.we-have-a-problem.com/"
      - quote: "However, many clients outside of the browser ecosystem do not enforce Certificate Transparency. We do not know if attackers exploited the flawed key generation to target these clients."
        attribution: "eMudhra incident tracker"
        source_url: "https://emudhra.we-have-a-problem.com/"
      - quote: "Mozilla was able to recover the private keys for the impacted certificates independently @ 21:48 UTC"
        attribution: "Mozilla CA Program (Bugzilla 2083449)"
        source_url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"
      - quote: "crypto/x509: mitigation for security concerns with a specific Certificate Authority"
        attribution: "Go project (golang-announce)"
        source_url: "https://groups.google.com/g/golang-announce/c/66pojueaQek"
      - quote: "software that uses its own certificate stores or doesn't check certificate revocations may keep trusting the compromised intermediates until it is updated."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"
    extended_notes: |
      Gate: ships on (a) global significance - a publicly trusted CA hierarchy whose keys anyone could recover. Reliability A for Mozilla/Go primaries; credibility 1 (Mozilla independently recovered the keys; BleepingComputer independently verified one published key).
      Exposure: an attacker needs an on-path position (MITM, DNS or routing control) and a client that (a) trusts the emSign roots or the Sectigo cross-signs and (b) neither consumes revocation (OneCRL/CRLite/CRLSets) nor enforces Certificate Transparency. Browsers on current builds are protected; the exposure sits in server-side agents, CLI tools, language runtimes (Go before 1.27.3 / 1.26.10), container base images and appliances with their own bundle. To check: the tracker's test endpoints (curl against the dv-g3b-emudhra and dv-g3b-aaa-emudhra hosts; a certificate error means the client does not trust the intermediates) and its offline chains.zip with OpenSSL instructions.
      Detection: certificate-validation telemetry - TLS inspection or egress proxy logs, EDR/network sensors recording server certificate chains: flag any observed chain containing an 'EM ... TLS CA - G3B/G3C' or 'EM OV CS CA' intermediate, and any Microsoft code-signing verification event for the two code-signing intermediates; absence of the corresponding CT entries is itself the tell (the tracker says none exist since April 2025), so a chain presented by an internal host that CT monitoring does not know is suspicious. Inventory: which of your fleet images still ship an old ca-certificates package (Ubuntu 20260816ubuntu0.* fixes, Alpine 20261020-r0, certifi 2026.10.19, curl bundle 2026-10-20 are listed by the tracker).
      Hardening: update ca-certificates / NSS / certifi / Go toolchains (Go 1.27.3 or 1.26.10) and rebuild container images; for software with its own store that does not check revocation, distrust the intermediates explicitly; FreeBSD ca_root_nss, Node.js and Bun showed 'pending' in the tracker when fetched, re-check before claiming closure.
      Defender takeaway: the decision that changes is an immediate bundle/toolchain update on non-browser TLS clients, and re-validating that your own TLS-inspection and trust-store pipelines pull from a current Mozilla/OS list - this is a revocation-by-software-update event for everything that does not do online revocation.
      Note: S1 may also surface CVE-2026-111943 from the Go advisory; dedup by CVE.
