        attribution: "BleepingComputer (quoting Zeabur)"
        source_url: "https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/"
      - quote: "Zeabur announced over the weekend that it will shut down its services starting December 1, 2026, and finish by December 31, 2026."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/"
    extended_notes: |
      Classification hint: victim's own detailed report, first-party (A); credibility 2 (single victim account, with its own confirmed/assessed labels, plus BleepingComputer's independent read; no outside forensic party). The attacker's goal ('AI service keys they could use directly') is Zeabur's observation of intent, not a finding.
      Exposure / triage for a customer: any project that kept environment variables on Zeabur and did not migrate them to its own dedicated server after August; any GCP dedicated server (root sign-ins confirmed on 101 servers for 92 users, SSH keys added on 50); Hetzner/DigitalOcean server-management tokens that were in internal code (revoked 2026-10-16 01:09 UTC; whether used 'cannot be confirmed'); n8n/new-api/one-api instances on the shared cluster; the GitHub App private key was read on 2026-10-15 15:05-18:54 UTC with no use found so far (Zeabur asked GitHub for audit logs).
      Detection (telemetry classes): cloud control-plane audit logs - unusual use of admin tokens or cloud access keys from unfamiliar sources, new nodes joining an internal overlay network, bulk reads of secrets stores or databases, root SSH logins and authorized_keys changes on managed servers, creation of VMs and attaching of disk copies in the provider project (Zeabur says it added exactly these alerts); on the customer side - API calls using LLM or SaaS keys that were stored as Zeabur environment variables from unfamiliar IPs, n8n workflow/credential changes, outbound connections from database hosts to unknown external hosts (the planted program in two Tokyo PostgreSQL databases).
      Defender takeaway / hardening: after any vendor or platform breach rotate everything that was readable, not only what the vendor lists, and re-check what rotation itself leaks (a scheduled backup that snapshots the freshly rotated secret defeated Zeabur's rotation within hours); keep admin interfaces off the public internet and give admin tokens expiry; encrypt-at-rest keys must not sit beside the data they protect (n8n encryption key in the container environment).
