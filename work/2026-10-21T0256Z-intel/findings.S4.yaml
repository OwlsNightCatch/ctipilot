      - { key: "product:updraftplus", type: product, name: "UpdraftPlus", aliases: ["UpdraftCentral", "TeamUpdraft UpdraftPlus"], summary: "WordPress backup plugin by TeamUpdraft, 4M+ active installs (Patchstack), whose bundled UpdraftCentral client executes commands signed by dashboard keys." }
    relation_suggestions:
