  - title: "Zeabur: second platform breach in two months exposes 3.2 million stored environment variables and 321,810 accounts through credentials the August rotation missed; the hosting platform will shut down by 31 December"
    priority_hint: notable
    sources:
      - { url: "https://zeabur.com/blogs/october-2026-security-incident", publisher: "Zeabur (preliminary incident report)", date: "2026-10-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/", publisher: "BleepingComputer", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (item dated 2026-10-20 15:33 -0400) -> extract https://www.bleepingcomputer.com/news/security/zeabur-shutting-down-after-second-security-breach-in-two-months/ -> primary (victim): Zeabur, URL https://zeabur.com/blogs/october-2026-security-incident"
    summary: |
      FACTS (Zeabur, the victim, preliminary report, with its own certainty labels confirmed / assessed / cannot be confirmed): on 2026-10-14/15 an attacker used leaked internal credentials to break into the shared cluster, some dedicated servers and internal systems and read the platform database. Path A: AWS keys and shared-cluster admin tokens that were stored in plaintext in a private configuration repository (how they were obtained 'cannot be confirmed'; Zeabur hypothesises a link to the GitHub App private key leaked in the August incident); the cluster admin interface was open to the public internet in 9 regions and the tokens had no expiry; from 12:39 on 14 October the attacker read the settings and secrets of all services, ran commands inside 865 database containers (736 n8n on PostgreSQL, 211 PostgreSQL read table by table, 10 new-api/one-api) and read about 53 production secrets on 15 October, including internal-network admin credentials, a platform-database account and the GitHub App private key. Path B: root sign-ins to 101 GCP dedicated servers using root passwords stored in plaintext in server initialisation settings that an old GCP key could read; SSH keys added on 50 servers; five VMs created in Zeabur's GCP project with 16 copies of customer disks attached. The paths met when the attacker added a node to Zeabur's internal network with the stolen admin credentials and read the platform database with an internal read-only account (8,903 operation records). Confirmed data in the platform database: 3,218,965 environment-variable records (names and values), 321,810 accounts, 566 plaintext zSend API keys; 11,536 platform access tokens were stored only as hashes. Zeabur says the attacker was mainly hunting API keys usable directly, especially keys for AI services, read n8n credentials at scale (602 of 607 checked n8n instances had their encryption key in an environment variable, so stored third-party credentials were effectively plaintext) and tried, unsuccessfully, to call Amazon Bedrock with Zeabur's AWS keys. 
      The lesson Zeabur itself draws (root cause stated by the victim): long-lived admin credentials stored in plaintext and usable from the public internet; the August rotation did not cover the credentials used this time (BleepingComputer quotes Zeabur: admin tokens had no expiry, were not rotated since January 2024 and were left out of the post-August rotation). Credentials rotated mid-incident were also captured by the next scheduled cluster backup and used by the attacker five hours later. An unidentified party had also signed in as root to about 98 of the same servers on 1-5 September (same actor 'cannot be confirmed'), and at least two Tokyo PostgreSQL databases carried a planted program that connected back to an external host.
      BleepingComputer reports Zeabur announced it will wind down: renewals disabled and shared-cluster services paused from 2026-12-01, all dedicated servers and clusters ending by 2026-12-31. 
