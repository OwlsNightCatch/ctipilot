  - title: "PK Softech / Publica (update): Tamedia reports Akira holds about 100 GB of pension-fund data on more than 100,000 current and former federal employees, with intelligence and special-forces staff identifiable, and demands ransom; neither the Confederation nor Publica confirms"
    priority_hint: high
    sources:
