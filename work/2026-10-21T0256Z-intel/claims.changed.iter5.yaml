    text: "CISA, the FBI, the US Secret Service, Germany's LKA Rheinland-Pfalz and UK law enforcement published advisory AA26-293A on 2026-10-20 on SafePay, which they say was among the most active ransomware groups in 2026 and has affected at least 600 victims, in Europe among other regions. Access comes from exposed credentials, brute force and phished account profiles used over Mullvad VPN addresses, and from five known flaws in Cisco ASA and Firepower Threat Defense, Veeam Backup and Replication and SonicWall SonicOS; the distinctive step is stopping the Volume Shadow Copy Service and factory-resetting the network storage that holds backups before encryption."
