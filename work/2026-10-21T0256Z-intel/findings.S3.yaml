  - title: "JPCERT/CC: attack servers behind Japan's wave of web-system data thefts show attackers reverse-engineering public Android apps to find backend APIs, with AI-assisted scanning"
    suggested_kind: threat
    suggested_priority: notable
    priority_reason: "National-CERT primary on a class (app-to-backend API attacks, BOLA/SSRF, admin and BI tools exposed to the internet) that applies to any public-sector mobile app or portal; Macnica's tally shows comparable cases in France and Poland as well as Japan and South Korea."
    sources:
      - { url: "https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html", publisher: "JPCERT/CC Eyes (blog)", date: "2026-10-21", role: "primary" }
      - { url: "https://www.jpcert.or.jp/at/2026/at260030.html", publisher: "JPCERT/CC alert AT-2026-0030", date: "2026-10-08", role: "primary" }
      - { url: "https://cynex.nict.go.jp/library/261013-01.html", publisher: "NICT CYNEX (LETTICE)", date: "2026-10-13", role: "corroborating" }
      - { url: "https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html", publisher: "Macnica Security Research Center", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: malware-news aggregator feed (bulk feed sweep), URL https://malware.news/t/recent-ai-assisted-cyber-attacks-in-japan-investigating-attack-infrastructure-and-techniques/126582 -> primary: JPCERT/CC blog https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html (found via https://blogs.jpcert.or.jp/en/ listing) -> JPCERT/CC alert https://www.jpcert.or.jp/at/2026/at260030.html (linked in the blog) -> NICT https://cynex.nict.go.jp/library/261013-01.html (linked in the blog references) -> Macnica https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html (linked in the alert)"
    summary: |
      FACTS (JPCERT/CC, translated from Japanese for the alert and NICT/Macnica pages): since about September 2026 many Japanese organizations have disclosed personal-data leaks from web systems; JPCERT/CC's alert AT-2026-0030 (2026-10-08, updated 10-09) lists the observed methods: per-target scanning for many known vulnerabilities and theft of configuration and backup files (case A); abuse of administration APIs reached by analysing public smartphone apps for endpoints and keys, then attacking internal APIs (changing user privileges, creating accounts, probing responses with and without headers or malformed tokens, blind NoSQL injection) or using API keys stolen elsewhere (case B); the Metabase SQL injection CVE-2026-72898 (case C); and WAR/JSP web shells on application servers reachable from public web servers (case D, added 10-09). Systems not meant for public use, such as BI tools and employee admin systems, were also hit. JPCERT/CC's blog of 2026-10-21 reports what its infrastructure team found on attack servers: APK files with scripts testing the apps' APIs for SSRF (a Python HTTPS server answering with 302 redirects), the Flutter reverse-engineering tool Blutter and the Android decompiler jadx, and, on a separate server, tooling against web applications, MySQL, Jenkins and email gateways, EDR-evasion attempts and web shells believed deployed in targeted networks; it says it confirmed the attackers used AI to scan for known vulnerabilities and attack via APIs, and that web services for users outside Japan were also targeted. NICT's CYNEX alert (2026-10-13) names the class A2B (App-to-Backend) attack and states the app itself need not be vulnerable: weak authentication, authorization or input validation on the backend suffices.
      CLAIMS AND DISAGREEMENT: Macnica's report (2026-10-16, written with Itochu Cyber and Intelligence and SecureSky Technology) counts 119 publicly disclosed Japanese web-system leaks in 2026 up to 6 October, 81 of them since July, and 99 similar cases in 13 countries in July to September including South Korea 30, France 11 and Poland 8 (Macnica's own tally of public disclosures, not independently verified). Macnica says no log or trace proving AI use was found in the incidents it handled and that no AI-found zero-day had been confirmed - the exploited weaknesses were basic access-control and configuration flaws and known vulnerabilities probed at scale - whereas JPCERT/CC's later blog states AI use was confirmed from attack-server evidence. The two statements differ in date and evidence base; neither names the model or the share of AI use.
    region_nexus: "Japan primarily; South Korea, France and Poland cases per Macnica; no Swiss case reported"
    primary_sector_nexus: "indirect but transferable (public-facing web apps and mobile-app backends of administrations, BI and admin tools exposed to the internet)"
    sector: "cross-sector (consumer web services, libraries, education, ticketing, corporate systems)"
    cves: [CVE-2026-72898]
    techniques: [T1595.002, T1190, T1552.001, T1505.003]
    affected_products: ["Metabase", "Android app backends (API)", "Jenkins", "Java application servers (WAR/JSP deployments)"]
    entity_keys: []
    new_entities:
      - { key: "campaign:japan-web-api-data-theft-wave-2026", type: campaign, name: "Japan web-system and API data-theft wave (2026)", aliases: ["A2B (App-to-Backend) attacks"], summary: "Wave of attacks since about September 2026 against Japanese (and South Korean, French, Polish) web systems and mobile-app backends combining known-vulnerability scanning, APIs found by reverse-engineering public Android apps, stolen API keys, Metabase CVE-2026-72898 and web shells; JPCERT/CC alert AT-2026-0030 and blog of 2026-10-21." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    confidence_note: "technical class HIGH (JPCERT/CC, NICT and Macnica agree); AI-use claim MEDIUM (JPCERT/CC states confirmed, Macnica found no proof earlier)"
    classification_hint: { reliability: A, credibility: 2 }
    novelty: new
    evidence:
      - quote: "We confirmed that the attackers had used AI to scan for known vulnerabilities and carry out attacks via APIs."
        attribution: "JPCERT/CC Eyes (blog)"
        source_url: "https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html"
      - quote: "One notable characteristic of these attacks was that the attackers analyzed Android application packages (APK files) to identify APIs and exploit them"
        attribution: "JPCERT/CC Eyes (blog)"
        source_url: "https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html"
      - quote: "（a）一般公開しているスマートフォンアプリを解析しAPIのエンドポイントやキーを特定する"
        attribution: "JPCERT/CC alert AT-2026-0030"
        source_url: "https://www.jpcert.or.jp/at/2026/at260030.html"
      - quote: "アプリ自体に脆弱性がなくても、バックエンドサーバの認証・認可や入力値の検証などに不備があれば、不正アクセスや個人情報の漏洩につながるおそれがあります。"
        attribution: "NICT CYNEX (LETTICE)"
        source_url: "https://cynex.nict.go.jp/library/261013-01.html"
      - quote: "一連の事案でAIが使われたと断定できるログや痕跡は確認されていません。"
        attribution: "Macnica Security Research Center"
        source_url: "https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html"
    extended_notes: |
      Exposure: any mobile app with a backend API (Android APKs are public and can be decompiled; Flutter apps compile to native libapp.so but are still analysed with Blutter), plus administration, BI and back-office systems that were never meant to face the internet; Metabase instances below the fixed release for CVE-2026-72898 (JPCERT/CC alert AT-2026-0023, 2026-08-14; existing store entry entries/2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally.md).
      Detection (telemetry class first, from JPCERT/CC and Macnica): web and API access logs for one source address making bulk API calls, bursts of 403/404/503 responses, probes for non-existent files or API functions, and extreme volume even with 200 responses; admin-API or privilege-changing calls from unusual addresses; User-Agent values such as curl and python-requests on endpoints meant for the official app; application-server filesystem monitoring for newly written .war and .jsp files (case D); database load, session exhaustion and rising authentication attempts coinciding with traffic bursts; outbound requests from application servers to attacker-controlled redirectors as an SSRF signal. Macnica recommends reviewing roughly the last month of logs and preserving them.
      Hardening (JPCERT/CC and Macnica): do not embed private keys or long-lived credentials in apps (obfuscation does not protect them); enforce server-side authentication and authorization on every endpoint including non-public APIs (BOLA/IDOR); rate limit login, reset, SMS and search functions; validate and restrict destinations and redirects for any API that fetches external URLs (SSRF); give API tokens least privilege and expiry; take admin and BI tools off the internet.
      Defender takeaway: audit the authorization model of every public app backend and every internet-reachable admin/BI tool, and check the last 30 days of API logs for bulk-enumeration patterns; treat embedded API keys in published APKs as already public.
