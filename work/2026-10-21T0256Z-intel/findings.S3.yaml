    borderline_reason: "Primary published 2026-10-15 (outside the 26 h window; seen through the TechNadu lookback); the intrusion at the demo organization is deliberately unpublished; value is one detection idea plus an edge-device exposure list."
    lookback: true
    sources:
      - { url: "https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies", publisher: "GreyNoise", date: "2026-10-15", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-hijack-d-link-ubiquiti-devices-to-resell-your-stolen-bandwidth/", publisher: "BleepingComputer", date: "2026-10-15", role: "corroborating" }
    discovery_trace: "first seen at: technadu, URL https://www.technadu.com/feed/ (item 'Skynox7 Proxyjacking Campaign Hijacks 140+ Edge Devices Across Almost 35 Countries', 2026-10-16) -> WebSearch (\"GreyNoise skynox7 proxyjacking edge devices residential proxy D-Link Ubiquiti SAP\") -> primary: https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies -> corroborating (CVE list, which the primary renders as an image): https://www.bleepingcomputer.com/news/security/hackers-hijack-d-link-ubiquiti-devices-to-resell-your-stolen-bandwidth/"
    summary: |
      FACTS (GreyNoise, 2026-10-15): during a live demonstration, an organization saw GreyNoise-labeled malicious IP addresses in its Entra ID sign-in logs; the addresses looked residential and sat in the geography that made sense for the users, the property GreyNoise says defeats impossible-travel style rules, and the organization then found several users signing in from the same residential address and confirmed a serious intrusion (GreyNoise publishes no details of it). That led GreyNoise to research commercial residential-proxy abuse, where it found an actor it calls skynox7 that had compromised at least 143 edge devices in 34 countries and installed the legitimate Pawns.app bandwidth-sharing client on them to earn payouts, in some cases also adding an SSH key for return access. BleepingComputer, reading GreyNoise's table, lists the exploited flaws as CVE-2024-3272 and CVE-2024-3273 (D-Link ShareCenter NAS), CVE-2021-44228 (Ubiquiti UniFi Video NVR) and CVE-2025-31324 (SAP NetWeaver Visual Composer), with Hikvision and Dahua recorders also targeted without CVEs given. GreyNoise's guidance: detect residential-proxy addresses in authentication logs, scrutinize several enterprise users authenticating from one residential proxy address, and detect deviations beyond geolocation such as device identifier, session identifier and User-Agent mismatches.
      ASSESSMENT/CAVEAT: GreyNoise says a legitimate sign-in can come from an address that is simultaneously proxying unrelated malicious traffic, so the residential-IP signal is a lead, not a verdict; the link between the demo-organization intrusion and skynox7 is not claimed.
    region_nexus: "global (143 devices in 34 countries; no Swiss device count given)"
    primary_sector_nexus: "indirect (edge devices and Entra sign-in monitoring)"
    sector: "cross-sector"
    cves: [CVE-2024-3272, CVE-2024-3273, CVE-2021-44228, CVE-2025-31324]
    techniques: [T1190, T1496.002, T1098.004, T1090.003, T1078.004]
    affected_products: ["D-Link ShareCenter NAS", "Ubiquiti UniFi Video NVR", "SAP NetWeaver Visual Composer", "Hikvision DVR/NVR", "Dahua DVR/NVR", "Microsoft Entra ID sign-in logs"]
    entity_keys: ["product:microsoft-entra-id"]
    new_entities:
      - { key: "actor:skynox7", type: actor, name: "skynox7", aliases: [], summary: "GreyNoise designation for a proxyjacking actor that compromised at least 143 edge devices in 34 countries via D-Link ShareCenter, UniFi Video (Log4Shell) and SAP NetWeaver Visual Composer flaws to install Pawns.app (GreyNoise, 2026-10-15)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "The actor successfully compromised at least 143 devices in 34 countries using exploits for the following vulnerabilities:"
        attribution: "GreyNoise"
        source_url: "https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies"
      - quote: "Detect residential proxy IP addresses in authentication logs, and especially scrutinize scenarios where multiple enterprise users are authenticating from the same residential proxy IP"
        attribution: "GreyNoise"
        source_url: "https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies"
      - quote: "CVE-2024-3272 and CVE-2024-3273 in D-Link ShareCenter NAS"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/hackers-hijack-d-link-ubiquiti-devices-to-resell-your-stolen-bandwidth/"
    extended_notes: |
      Detection (telemetry class first, per GreyNoise): Entra ID sign-in logs enriched with residential-proxy or gray-IP reputation; several distinct users sharing one source address; mismatches in device ID, session ID and User-Agent against each user's baseline. Edge side (derived from the described payload, not a GreyNoise rule): unexpected Pawns.app processes, added SSH authorized_keys entries, and proxy-network traffic from NAS, camera and recorder devices.
      Triage: shared residential or CGNAT addresses can legitimately carry several users of one household or small office; the discriminator GreyNoise gives is several enterprise accounts from one residential address, plus device and session mismatches.
