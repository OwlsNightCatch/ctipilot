  - title: "NorForge: criminals left Cairn AI-agent control panels open, exposing over 1,100 automated attack projects against e-commerce and payment sites at roughly $5 per task"
    suggested_kind: threat
    suggested_priority: notable
    priority_reason: "First view of operator-side tasking for autonomous exploitation agents (targets ranked, verified with Playwright, goal = uploader web shell); builds on the Gambit report already in the store; victims named by Reuters are US/Japan/Australia retailers, so the Swiss link is the threat model (cheap agents reaching web-app RCE in under a day) not a Swiss victim."
    sources:
      - { url: "https://norforge.com/blog/inside_cairn", publisher: "NorForge", date: "2026-10-19", role: "primary" }
      - { url: "https://www.securityweek.com/ai-platform-cairn-abused-to-hack-over-100-organizations/", publisher: "SecurityWeek", date: "2026-10-20", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/10/hackers-use-autonomous-ai-agents-to.html", publisher: "The Hacker News", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews -> https://thehackernews.com/2026/10/hackers-use-autonomous-ai-agents-to.html (also TechNadu feed https://www.technadu.com/feed/ item 'Exposed Cairn AI Hacking Panels Reveal 1,100+ Attack Projects') -> primary: NorForge https://norforge.com/blog/inside_cairn -> corroborating: SecurityWeek https://www.securityweek.com/ai-platform-cairn-abused-to-hack-over-100-organizations/ ; Reuters (named victims) is cited by both outlets but was not fetched"
    summary: |
      FACTS (NorForge, 2026-10-19): scanning for internet-exposed control panels of AI pentesting harnesses (prompted by Gambit Security's September report on Strix, Hermes and Cairn), NorForge found more than 20 Cairn panels that it judges likely malicious and grouped them into three clusters. AIA0001 (Chinese-language, 14 panels, high confidence) holds over 1,100 attack projects aimed mainly at e-commerce and payment infrastructure in the US, Japan and Australia, with the aim of lasting access for later monetisation; tasks tell the agent to find unauthenticated RCE (login SQL injection, unauthenticated endpoints, file upload, deserialization, authentication bypass) and to leave an uploader web shell (an HTML upload form plus move_uploaded_file) rather than a command shell; targets are ranked by traffic and checked with Playwright before being fed to Cairn. AIA0002 (English, 10 panels) steals cards and cryptocurrency from payment services and gray-market sites; AIA0003 (one panel, 59 projects, low confidence) works through large US platforms. The worker name claudecode_deepseek-v4.1-flash in AIA0001 suggests a Claude Code harness driving a DeepSeek model; NorForge estimates about $5 per task. NorForge puts average success near 10 percent, with AIA0001 successes taking a little under 23 hours and about 140 recorded facts per project; one documented chain used unauthorized write access to a memcached session store, unsafe PHP object deserialization and a gadget chain in legacy Zend Framework code, and NorForge confirmed a live uploader shell at one claimed victim and one large US retailer compromise. The panels also expose victims' secrets (hundreds of secrets, 11 percent verified valid by Trufflehog) and appear to expose full administrative control of the harness, which NorForge did not test.
      CLAIMS (relayed): The Hacker News and SecurityWeek, citing Reuters, say the AIA0001 operator breached over 100 companies, naming Deere, SharkNinja and Cummins; the companies told Reuters the damage was limited or still under investigation, and NorForge itself names no victims. Cairn's author told Reuters the tool was not designed for attacks. NorForge assesses all observed activity as financially motivated and notes no sign of state actors, while stating it cannot exclude them.
    region_nexus: "global; victims US, Japan, Australia (AIA0001), African commerce sites (AIA0002); no Swiss victim reported"
    primary_sector_nexus: "indirect (threat-model relevance for public-sector e-commerce, payment and web portals)"
    sector: "retail; e-commerce; payments"
    cves: []
    techniques: [T1595.002, T1190, T1505.003, T1588.007]
    affected_products: ["Magento / Adobe Commerce (StyleSmuggler CVE-2026-75650 PoC in an agent working directory)", "PHP applications with unsafe unserialize and memcached session stores", "Zend Framework (legacy)"]
    entity_keys: ["tool:cairn-exploitation-engine"]
    references_hint: ["2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes"]
    new_entities:
      - { key: "actor:aia0001", type: actor, name: "AIA0001", aliases: [], summary: "NorForge's designation for a Chinese-language activity cluster operating 14 exposed Cairn AI-agent panels with over 1,100 attack projects against e-commerce and payment sites in the US, Japan and Australia, aiming at persistent web-shell access (NorForge, 2026-10-19). Financially motivated per NorForge; no tracked-actor attribution." }
    relation_suggestions:
      - { subject: "actor:aia0001", object: "tool:cairn-exploitation-engine", basis: "NorForge: AIA0001 runs over 1,100 attack projects through exposed Cairn panels (NorForge, 2026-10-19)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    confidence_note: "primary telemetry is NorForge's own scanning of exposed panels; the victim names and the 100-company count rest on Reuters, which was not fetched"
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "More than 20 exposed Cairn panels were identified as likely associated with malicious activity, providing an unusually detailed view of how threat actors select targets, direct autonomous agents, exploit vulnerabilities, and establish persistent access to compromised systems."
        attribution: "NorForge"
        source_url: "https://norforge.com/blog/inside_cairn"
      - quote: "The operation is massive, with over 1100 attack projects spread over the 14 dashboards likely associated with this group."
        attribution: "NorForge"
        source_url: "https://norforge.com/blog/inside_cairn"
      - quote: "the average time from project start to goal met was a little under 23 hours, generating on average 140 facts per project."
        attribution: "NorForge"
        source_url: "https://norforge.com/blog/inside_cairn"
      - quote: "According to the cybersecurity firm, the threat actors were successful in roughly 10% of their attempts."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/ai-platform-cairn-abused-to-hack-over-100-organizations/"
    extended_notes: |
      Exposure: internet-facing PHP web applications with login, upload and unserialize surfaces; session stores (memcached) reachable without authentication; legacy frameworks with known gadget chains. Separately, organizations running AI pentest harnesses (Cairn and similar) should not expose their control panels, because they leak target secrets and administrative control (NorForge found legitimate red-team engagements exposed this way too).
      Detection (derived from the described task: uploader shell, not command shell): web server file-integrity monitoring for new .php files in upload or hidden directories whose code calls move_uploaded_file, followed by HTTP requests to that file; web logs showing unauthenticated POSTs to upload endpoints followed by requests to a freshly created file name such as confirm.php; unauthenticated access to session-store ports (memcached 11211) from outside the application tier. Behaviourally the agent traffic is high-volume, step-by-step probing across SQL injection, file upload, deserialization and authentication-bypass classes against one site over many hours.
      Hardening (derived from the chain described, not NorForge advice): restrict memcached to the application tier, avoid PHP unserialize on session or user-controlled data, patch Magento/Adobe Commerce StyleSmuggler (CVE-2026-75650, tracked elsewhere in the store), and deny web-server write access to executable directories so an uploader cannot persist.
      Defender takeaway: assume web-app flaws of these classes are found and chained within about a day by inexpensive agents; the decision that changes is prioritising authentication, upload and deserialization hardening on public portals over waiting for CVE-level exploit reports.
