  - title: "Symantec: APT28 (Swallowtail) used the HOOKEDGE backdoor against a law-enforcement agency, a naval shipbuilder and an aircraft-engine maker in two NATO states, then stole credentials and tunnelled in over SSH"
    suggested_kind: threat
    suggested_priority: high
    priority_reason: "Government espionage tradecraft with a law-enforcement victim in a NATO state; the post-access steps (SSH key push + remote port forward, self-authentication NTLM capture, in-memory loader) are detectable on any Windows estate, and Recorded Future independently documented the same backdoor family against European government and diplomatic targets."
    sources:
      - { url: "https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets", publisher: "Symantec Threat Hunter Team", date: "2026-10-20", role: "primary" }
      - { url: "https://www.recordedfuture.com/research/bluedelta-targets-with-hookedge", publisher: "Recorded Future Insikt Group", date: "2026-08-27", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/10/russian-apt28-breaches-nato-naval.html", publisher: "The Hacker News", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews (via tools/fetch_source.py feed) -> https://thehackernews.com/2026/10/russian-apt28-breaches-nato-naval.html -> primary: Symantec https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets -> corroborating: Recorded Future Insikt https://www.recordedfuture.com/research/bluedelta-targets-with-hookedge (linked from the Symantec report)"
    summary: |
      FACTS (Symantec Threat Hunter Team, 2026-10-20): the group Symantec tracks as Swallowtail, which it equates with APT28 / Fancy Bear / Forest Blizzard and describes as a GRU unit per the US government, targeted organizations in two NATO member states: a law enforcement agency, a naval shipbuilder and a manufacturer of military aircraft engines (none named). Initial access was a macro-enabled Word document opened from the Outlook attachment cache on 2026-07-24; the obfuscated macro (VBA split into fragments joined at runtime) dropped a VBScript launcher, an HTML auto-submit form pair and a batch script. The HOOKEDGE backdoor then uses a hidden, off-screen Microsoft Edge window (one-pixel size, positioned off-screen, started after killing msedge.exe, inline base64 JavaScript data: URL) as its HTTP client against webhook.site endpoints for tasking and for returning command output. At the shipbuilder, a second stage moved from webhook.site to a dedicated IP over HTTPS with curl; the operators were hands-on-keyboard over about a week, pushed an SSH private key renamed id_rsa and immediately opened an outbound SSH session to their own server with a remote port forward (-R, -N, -f, host-key checking disabled, legacy RSA algorithms enabled) for a persistent tunnel into the internal network, and ran a short PowerShell script that starts an HttpListener on loopback and forces the host to authenticate to it (net use to localhost@8080) to capture NTLM challenge-responses. They also dropped a previously undocumented reflective loader, ld.exe, run with an encrypted file and key given as command-line arguments (decrypts in memory, exported function ExecuteLoader; payload not recovered). Symantec saw activity from the shipbuilder host as late as 2026-09-24 and advises treating a HOOKEDGE hit as a potentially ongoing intrusion.
      CONTEXT (independent): Recorded Future Insikt Group documented HOOKEDGE on 2026-08-27 from campaigns between September 2025 and April 2026 against government and diplomatic organizations in Romania, Spain and Turkiye, assessed with moderate confidence as BlueDelta (overlapping APT28), and recommended blocking macro execution from internet-originated documents plus detection for scheduled-task abuse, headless Microsoft Edge execution and outbound connections to webhook services. Symantec's contribution is the post-access tradecraft and the new victims; the actor naming differs by vendor (Swallowtail vs BlueDelta) and both attribute to APT28 overlap, not to a bare identity.
    region_nexus: "Europe/NATO; law-enforcement victim country unnamed; Swiss federal and cantonal police and defence suppliers are in the same target class (government, defence, law enforcement) as other European victims of this actor"
    primary_sector_nexus: "direct (law-enforcement and government targeting)"
    sector: "government; law-enforcement; defence"
    cves: []
    techniques: [T1566.001, T1204.002, T1059.005, T1059.003, T1564.003, T1102.002, T1105, T1572, T1187, T1620, T1053.005, T1070.004, T1027]
    affected_products: ["Microsoft Word (macros)", "Microsoft Edge", "Windows OpenSSH client"]
    entity_keys: []
    new_entities:
      - { key: "actor:apt28", type: actor, name: "APT28", aliases: ["Fancy Bear", "Forest Blizzard", "BlueDelta", "Swallowtail"], summary: "Russian state-sponsored espionage group that the US government and Recorded Future attribute to GRU; Symantec tracks the HOOKEDGE intrusions as Swallowtail and Recorded Future as BlueDelta (moderate-confidence overlap with APT28), targeting government, defence, diplomatic and law-enforcement organizations in Europe (Symantec, 2026-10-20; Recorded Future, 2026-08-27)." }
      - { key: "malware:hookedge", type: malware, name: "HOOKEDGE", aliases: [], summary: "Lightweight Windows batch-script backdoor delivered through macro-enabled Word documents that uses webhook.site (later a dedicated IP) for tasking and exfiltration and a hidden headless Microsoft Edge window as HTTP client; code and tradecraft overlap with HEADLACE (Recorded Future, 2026-08-27; Symantec, 2026-10-20)." }
    relation_suggestions:
      - { subject: "actor:apt28", object: "malware:hookedge", basis: "Recorded Future assesses with moderate confidence that BlueDelta (overlapping APT28) used HOOKEDGE; Symantec attributes the HOOKEDGE intrusions to Swallowtail, which it equates with APT28 (Recorded Future 2026-08-27; Symantec 2026-10-20)" }
    verification: SINGLE-SOURCE-OTHER
    sourcing_note: "The new victims and the post-access tradecraft rest on Symantec alone (first-hand vendor telemetry); HOOKEDGE and the APT28/BlueDelta context are independently documented by Recorded Future from different telemetry, and The Hacker News relays Symantec's report."
    confidence: HIGH
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "Swallowtail (aka APT28, Fancy Bear, Forest Blizzard), a Russian espionage group, targeted organizations in two NATO member states, including a law enforcement agency, a naval shipbuilder, and a manufacturer of military aircraft engines."
        attribution: "Symantec Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets"
      - quote: "They stole credential material using two separate techniques, opened a persistent SSH tunnel into the organization's internal network and deployed a previously undocumented reflective loader."
        attribution: "Symantec Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets"
      - quote: "Organizations that identify Hookedge indicators in their environment should treat the intrusion as potentially ongoing rather than concluded"
        attribution: "Symantec Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets"
      - quote: "Organizations should prioritize blocking macro execution from internet-originated documents and implementing detection coverage for scheduled task abuse, headless Microsoft Edge execution, and outbound connections to webhook services."
        attribution: "Recorded Future Insikt Group"
        source_url: "https://www.recordedfuture.com/research/bluedelta-targets-with-hookedge"
    extended_notes: |
      Exposure: Windows endpoints that open Office documents from mail and permit macros from the internet; any host with outbound access to webhook.site; OpenSSH client present by default on current Windows (the SSH tunnel uses ssh.exe from System32).
      Detection (telemetry class first): process-creation events with parent lineage - WINWORD.EXE spawning wscript/cscript or cmd, then cmd.exe running taskkill /f /im msedge.exe followed by msedge.exe started with --window-size=1,1 --window-position=10000,10000 and a data:text/html;base64 argument (Sysmon EID 1 / EDR); network/proxy logs for msedge.exe or curl.exe reaching webhook.site or posting to an IP over 443 with -k (certificate checks off); ssh.exe launched from a user or ProgramData context with -i <key> -R <port> -N -f and StrictHostKeyChecking=no, writing to Windows OpenSSH logs / process-creation; a PowerShell HttpListener on localhost followed by net use \\localhost@8080\c$ (process creation plus Windows Security 4776/NTLM authentication events to the local host); creation of id_rsa under C:\ProgramData. Post-compromise check: a HOOKEDGE hit should trigger a credential reset for accounts on that host (NTLM material was captured) and a search for the persistent SSH tunnel and scheduled task, not just removal of the launcher.
      Triage: legitimate headless Edge automation (Playwright, Selenium, test runners) shows Edge started with --headless or a debug port, not a one-pixel off-screen window with an inline data: URL after killing existing Edge; legitimate webhook.site use is by developers testing webhooks, not by Office-spawned scripts.
      Hardening: block macro execution from internet-originated documents (Mark-of-the-Web policy), restrict outbound access to webhook-testing services, and constrain use of ssh.exe by non-administrative users with application control.
      Defender takeaway: for a police or defence environment the decision is to hunt for the post-access chain (key push, SSH remote forward, NTLM self-capture) on any host where a HOOKEDGE launcher appeared, because the intrusion at the shipbuilder outlived the dropper by at least two months.
      Gaps stated by the sources: the ld.exe payload was not recovered; the victim countries and organizations are unnamed; Symantec does not state initial-access victimology for the law-enforcement agency beyond HOOKEDGE presence.
