  - title: "GreyNoise: a product demo found residential-proxy IPs in a customer's Entra ID sign-ins, and a proxyjacking actor (skynox7) hijacked 143 edge devices through old D-Link, UniFi Video and SAP flaws"
    suggested_kind: threat
    suggested_priority: low
    priority_reason: "Commodity proxyjacking on old CVEs; the transferable value is the identity-detection point that residential proxy IPs defeat geolocation rules and that several users signing in from one residential IP is a discriminator."
