    suggested_kind: threat
    suggested_priority: low
    priority_reason: "Single-source, Ukraine-specific targeting with a reused public chain; the transferable parts are the Graylog API trigger and the detection point that the payload runs from a static initializer."
    borderline: true
    borderline_reason: "No Swiss nexus; single source; included only for the Graylog/Log4Shell detection details and because logging servers hold sensitive transaction data in any administration."
    sources:
      - { url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell", publisher: "Hunt.io", date: "2026-10-20", role: "primary" }
    discovery_trace: "first seen at: hunt-io, URL https://hunt.io/blog (WebFetch listing; displayed date Oct 20, 2026) -> primary (no pivot needed): https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
    summary: |
      FACTS (Hunt.io): between May and September 2026 one operator working from a rented server swept Ukrainian address space for a single port and filtered 7,576 live hosts to two by the string "UXP Verifier" (the web interface to the message log of the Cybernetica UXP platform, itself built on X-Road, that Ukraine's national data-exchange system runs on). Hunt.io's AttackCapture indexed the operator's working directory, served over HTTP on port 8888 for 17 hours from 2026-09-03, with the staging server's access log. The recovered chain was a Log4Shell attempt through the Graylog sessions API: a POST to /api/system/sessions with a JNDI string in the username field and the header X-Requested-By: cli (required by Graylog's CSRF control), delivering two serialized CommonsBeanutils2 objects (stage 1 fetches a shell script, stage 2 runs it for a reverse shell); the access log shows the target fetching the stager six seconds after the trigger on at least two Ukrainian hosts. On the documented Graylog host the operator ran aggregate queries over about 6.8 million documents of the data-exchange logs (the query shape showed prior knowledge of the schema) but Hunt.io saw no exfiltration, which it labels absence of evidence rather than proof. Seven of eight exploit trees were unmodified public PoCs; the operator's one original piece of research, a RouterOS SCEP exploit, targeted a binary that does not contain the bug. A FortiGate SSL-VPN was probed 170 times without success.
      ASSESSMENT (Hunt.io): high confidence that two staging servers were run by the same operator; medium confidence the objective was collection; no attribution to a tracked actor. Hunt.io says it shared the findings and recovered victim data with the affected countries' CERTs.
    region_nexus: "Ukraine (target); Swiss nexus none"
    primary_sector_nexus: "indirect (logging and SIEM servers in administrations hold transaction and audit data)"
    sector: "government"
    cves: []
    techniques: [T1595.001, T1190, T1105, T1572]
    affected_products: ["Graylog (Log4Shell-vulnerable builds)", "Cybernetica UXP / X-Road security servers (target identification only)"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "POST requests to /api/system/sessions carrying a ${jndi: substring in the username field, paired with the X-Requested-By: cli header."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
      - quote: "EDR rules written against Runtime.exec call sites in application logic will miss it. A spawned child process is the only reliable signal."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
      - quote: "We do not attribute this activity to a tracked actor."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
    extended_notes: |
      Detection (telemetry class first, per Hunt.io): Graylog web/API access logs for POSTs to /api/system/sessions whose username contains a JNDI lookup and that carry X-Requested-By: cli; process-creation events with the Graylog Java service as parent (the payload runs from the translet's static initializer, so Runtime.exec hooks miss it); outbound connections from the Graylog host to unfamiliar servers on the port combination Hunt.io says has no common legitimate use (8888 staging with 1389 and 8890 for the JNDI listener); the template string ysoserial/payloads/util/Gadgets$StubTransletPayload in payload content.
      Exposure: Graylog servers still on builds vulnerable to Log4Shell and reachable by an attacker; Hunt.io notes the logging server sat in the same /24 as another target.
      Defender takeaway: verify Graylog and any other Java log-processing service is patched for Log4Shell and not internet-reachable; hunt for the child-process signal rather than relying on call-site rules.
