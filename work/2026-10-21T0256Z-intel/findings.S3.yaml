  - title: "Sophos X-Ops IR case: vishing plus SMS-code self-service password reset led to a registered Entra device, Primary Refresh Token sessions, Graph reconnaissance, SharePoint mass download and a ServiceNow user-table export"
    suggested_kind: threat
    suggested_priority: notable
    priority_reason: "Directly applicable to Entra-based administrations: the whole chain starts at the account-recovery flow and moves through federation, with concrete log sources named for each step."
    borderline: true
    borderline_reason: "Published 2026-10-19 (date only), roughly a day before this run's 26 h window opens, and not in the store; included because it is the freshest first-hand Entra identity-intrusion write-up and no earlier fire covered it. A single customer case with no actor attribution."
    recency_note: "source date 2026-10-19; window start 2026-10-20T00:56Z"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion", publisher: "Sophos X-Ops", date: "2026-10-19", role: "primary" }
    discovery_trace: "first seen at: sophos-xops feed, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (via tools/fetch_source.py feed) -> primary (no pivot needed): https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
    summary: |
      FACTS (Sophos X-Ops Incident Response, one customer case): after several employees reported suspicious calls and the organization warned staff by email, one user had already been compromised: the caller impersonated the help desk and obtained the SMS verification code needed to complete a self-service password reset (SSPR); an earlier SSPR attempt from a geographically anomalous address had occurred the day before. Within minutes of the reset the actor registered a new Windows device in Entra ID, used a Primary Refresh Token (PRT) and signed in with Edge from that token-backed context; later federated SAML sign-ins to ServiceNow and Salesforce show MFA as previously satisfied. Observed activity: Microsoft Graph reconnaissance (licence details, organization, tenant relationships, directory role assignments, owned service principals, domains, user counts; visible in Defender's GraphApiAuditEvents), about 100 mail items accessed and roughly 100,000 SharePoint files downloaded (Purview Unified Audit Log), SharePoint searches for credentials, PII and the organization's identity-verification vendor, Teams started, a ServiceNow sys_user export of about 2,500 records plus browsing of the CMDB computer table, and Salesforce access that stopped when Salesforce's own anomaly containment froze the user. The actor created no inbox or forwarding rules or applications; the only cleanup seen was deleting the organization's own vishing-warning email and one other message. Sophos notes the pattern matches Mandiant's description of vishing-led SSO and SaaS data theft by ShinyHunters-linked actors but attributes nothing to any group.
    region_nexus: "unspecified (customer anonymized); technique class applies to any Microsoft 365 / Entra tenant"
    primary_sector_nexus: "direct (Entra-centric administrations: help-desk impersonation and SSPR abuse)"
    sector: "cross-sector (customer unnamed)"
    cves: []
    techniques: [T1566.004, T1078.004, T1098.005, T1213.002, T1114.002, T1087.004, T1069.003, T1213]
    affected_products: ["Microsoft Entra ID (self-service password reset, device registration, Primary Refresh Token)", "Microsoft 365 (Exchange Online, SharePoint, Teams)", "ServiceNow", "Salesforce"]
    entity_keys: ["product:microsoft-entra-id"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "In this case, the entire intrusion was unlocked because the SSPR flow accepted an SMS code the user handed over during a vishing call."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "Telemetry shows that an earlier SSPR initiation occurred from a geographically anomalous IP address the day before the confirmed vishing event."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "Alert on any new device registration within a short window of a password reset, MFA method change, or anomalous sign-in"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "it does not audit the passive viewing of existing messages in chats and channels a user already has access to."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
    extended_notes: |
      Exposure: tenants where SMS or voice codes remain valid SSPR methods (especially for non-admin users with a single required method), where "Register or join devices" is not protected by Conditional Access requiring MFA, and where federated SaaS (ServiceNow, Salesforce) trusts the Entra session. Check in Entra: the SSPR authentication-methods policy, and the Conditional Access user action for registering or joining devices.
      Detection (telemetry class first, per Sophos): Entra audit and sign-in logs - SSPR initiation from anonymizing or out-of-region infrastructure, then a password reset, then a device registration within minutes, then PRT-based sign-ins to other apps with MFA shown as previously satisfied; Defender GraphApiAuditEvents for directory, role and service-principal enumeration from a single user session; Purview SearchQueryInitiatedSharePoint with terms such as password, cred, aws, vpn, ssh or the MFA vendor's name; MailItemsAccessed anomalies on security-awareness mail followed by its deletion; bulk exports of identity, CMDB or CRM tables in federated SaaS (ServiceNow sys_user and cmdb_ci_computer). Gap stated by Sophos: Teams passive reading is not audited.
      Post-compromise check: resetting the password is not containment; revoke sessions and refresh tokens at the identity provider and in every federated SaaS platform, and review devices registered to the identity since the reset.
      Triage: a legitimate user does reset passwords and register devices, but a new Windows device registration within minutes of an SSPR reset from a different network, followed by access to unfamiliar SaaS apps via a token claim rather than an interactive prompt, is the discriminator Sophos names.
      Defender takeaway: move account recovery to phishing-resistant methods (FIDO2, passkeys, Windows Hello for Business) and treat device registration as a privileged operation requiring MFA.
