      - quote: "From there, they disabled security controls on ESXi hypervisors (execInstalledOnly) and used a custom tool to perform offline credential dumping directly against a domain controller's virtual disk (VMDK)."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"
      - quote: "This tactic bypasses in-guest endpoint detection and response (EDR) and security controls, representing a highly sophisticated method for obtaining domain-wide credentials."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"
    extended_notes: |
      Delta for the existing entry: INC (Tarnished Scorpius) added to Qilin, the sector list, the vCenter/ESXi/VMDK pivot and the management-interface exposure check. The existing entry's Detection and Defender-takeaway lines only cover the gateway and the Qilin post-exploitation artifacts.
      Detection (telemetry class first, from the brief): GlobalProtect gateway logs for successful gateway-connected events carrying the public PoC's hard-coded client values (Windows 10 Pro 64-bit OS string, empty user domain) or placeholder host IDs / device names; behind the gateway (derived from the described mechanism, not a Unit 42 rule): hypervisor-layer telemetry - vCenter and ESXi audit logs for a changed execInstalledOnly setting and for domain-controller VMDK files being read or copied outside backup jobs; EDR inside guests will not see the offline dump.
      Hardening/defender takeaway: treat an exposed, unpatched gateway as a trigger to assess vCenter, ESXi and domain-controller virtual disks, not only the firewall; restricting vCenter/ESXi management reachability from VPN-assigned address pools is a derived hardening step, not stated by Unit 42; confirm management-interface exposure on ports 4443 and 3879 as Unit 42 advises.
