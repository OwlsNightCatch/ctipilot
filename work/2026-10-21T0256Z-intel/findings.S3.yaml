  - title: "Unit 42 update on CVE-2026-0257 (PAN-OS GlobalProtect): Qilin and INC operators exploit it, and intrusions pivot from the VPN gateway to vCenter and ESXi to dump domain credentials offline from a domain controller's disk"
    suggested_kind: vulnerability
    suggested_priority: high
    priority_reason: "Fresh exploitation-by-ransomware-affiliates reporting and a new post-exploitation pivot (hypervisor layer) on a flaw already covered; government is among the sectors Unit 42 lists."
