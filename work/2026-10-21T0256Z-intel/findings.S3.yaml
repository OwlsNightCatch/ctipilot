    summary: |
      FACTS (Unit 42 threat brief, updated 2026-10-20 with an October 19 update): Unit 42 reports ransomware operators including Spikey Scorpius (aka Qilin) and Tarnished Scorpius (aka Inc) exploiting the PAN-OS GlobalProtect authentication bypass CVE-2026-0257 to get a foothold, bypass MFA and establish a VPN session; its investigations began in early June 2026 and span education, financial services, healthcare, high technology, hospitality, manufacturing, professional and legal services, government, transport, utilities and retail. After access the actors run internal reconnaissance with dual-use RMM tools, move laterally over RDP and SMB, and stage credential-harvesting, exfiltration and ransomware tooling. Unit 42 calls the pivot to the virtualization layer the most significant change in post-exploitation tradecraft: in one case attackers moved from the compromised gateway to the vCenter management appliance, disabled execInstalledOnly on ESXi hosts, and used a custom tool to dump credentials offline from a domain controller's virtual disk (VMDK), which bypasses in-guest EDR; some actors chained the access with Veeam exploit tooling (CVE-2023-27532).
      CLAIMS: Unit 42 also notes public reporting that attributes exploitation to Settra ransomware users (an X post by ReliaQuest; not independently fetched, not for citation). Source inconsistency: the brief's opening paragraphs still say 'No post-access behavior or lateral movement has been identified as of this time' and that only a small portion of probed devices established VPN sessions, while later sections describe lateral movement and ransomware deployment; the opening text appears to be left over from an earlier version of the brief.
      Management-interface check from the same brief: GlobalProtect profiles mapped to the management interface's HTTP/HTTPS services can expose the management plane on ports 4443 and 3879; Unit 42 says to verify with an out-of-band HTTPS connection to the management IP on those ports.
