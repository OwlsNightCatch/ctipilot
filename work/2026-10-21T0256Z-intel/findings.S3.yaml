  - title: "eMudhra's eight intermediate CA private keys were trivially recoverable (values below 256); every trust store has blocked them and Chrome and Mozilla are now removing the emSign ECC Root CA - G3"
    suggested_kind: incident
    suggested_priority: high
    priority_reason: "Any actor can forge certificates for any website against clients that neither check revocation nor enforce Certificate Transparency; browsers and OS stores are already protected, but Go, Python, Rust, curl, container base images and appliance trust stores need updates, and Chrome's root removal on 2026-10-27 will break sites still chaining to the root."
    sources:
      - { url: "https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/", publisher: "Google Chrome Root Program", date: "2026-10-20", role: "primary" }
      - { url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", publisher: "Mozilla Bugzilla (bug 2083449)", date: "2026-10-18", role: "primary" }
      - { url: "https://emudhra.we-have-a-problem.com/", publisher: "Mozilla CA Program incident tracker (D. Jackson)", date: "2026-10-20", role: "primary" }
      - { url: "https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/", publisher: "Mozilla Security Blog", date: "2026-10-20", role: "corroborating" }
      - { url: "https://groups.google.com/g/golang-announce/c/66pojueaQek", publisher: "Go security announcement", date: "2026-10-20", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/", publisher: "BleepingComputer", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: google-tag feed, URL https://blog.google/security/rss/ (fetched via tools/fetch_source.py feed) -> item https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/ -> pivot: WebSearch (\"eMudhra emSign ECC Root CA G3 subordinate CA private keys weak entropy compromised\" returned nothing on-point) -> pivot: Mozilla Bugzilla REST search (https://bugzilla.mozilla.org/rest/bug?quicksearch=emudhra) -> primary: https://bugzilla.mozilla.org/show_bug.cgi?id=2083449 -> primary: https://emudhra.we-have-a-problem.com/ and Mozilla dev-security-policy post https://groups.google.com/a/mozilla.org/g/dev-security-policy/c/0R3XLJL6FuE/m/VAgSvefvAAAJ -> corroborating: news feeds (THN/BleepingComputer/The Register 2026-10-20) -> Go announcement https://groups.google.com/g/golang-announce/c/66pojueaQek"
    summary: |
      FACTS (Mozilla bug 2083449 and Mozilla's incident tracker): on 2026-10-17 a researcher reported to the Chrome, Apple, Microsoft and Mozilla root programs and to eMudhra that the private keys of eight eMudhra intermediate CA certificates were compromised, with a proof of key control. Mozilla recovered the keys independently within about 100 minutes and found all eight P-384 keys were integers below 256, "effectively all-zeroes apart from the last byte", from a batch of 24 intermediates generated on 2025-04-30; the flaw is in key generation, not in signing. Six are TLS intermediates trusted by the Chrome, Mozilla, Microsoft and Apple root programs, two are code-signing intermediates trusted by Microsoft. Several of the TLS intermediates were also cross-signed by Sectigo, whose cross-sign root is no longer in the Chrome and Mozilla stores but remained trusted in the Microsoft and Apple programs when Sectigo posted; Sectigo reported revoking the cross-signs on 2026-10-19.
      Mitigation timeline: Mozilla OneCRL and Chrome CRLSet blocked the TLS intermediates on 2026-10-17, Apple on 2026-10-19 and Microsoft platforms on 2026-10-20 (Mozilla tracker); eMudhra revoked all eight with reason caCompromise on 2026-10-18. On 2026-10-20 Mozilla stated that several individuals had independently recovered the keys, some publicly, and removed the signing root emSign ECC Root CA - G3 from NSS 3.131.1 so that clients without revocation checking or an intermediate-block mechanism are protected; Chrome committed to the same path with the root removal expected on 2026-10-27, and says it is reviewing eMudhra's remaining CA certificates. Mozilla is not removing emSign Root CA - G1 at this time. eMudhra stopped issuing from all intermediates under the G3 root and estimates about 30,000 certificates (97 percent issued via ACME) need migrating to chains under its RSA G1 root.
      CLAIMS: eMudhra says a key-generation script error produced a second set of weak keys that were mistakenly picked for signing, that the G3B and G3C intermediates were not put into production apart from one DV G3C intermediate (a researcher's timeline says that one was live and has been disabled) and that no end-entity certificates were issued from them, and that its other issuers use different HSM vendors and are not affected (eMudhra in the Mozilla bug). Mozilla's tracker states there are no Certificate Transparency entries for these intermediates, so CT-enforcing browsers could not have been attacked, and that it does not know whether attackers exploited the flaw against non-browser clients that do not enforce CT.
      The open exposure is software with its own trust store or no revocation checking. The tracker lists fixed versions (Go 1.27.3 and 1.26.10 as CVE-2026-111943, Python certifi 2026.10.19, rustls-webpki 0.103.16, webpki-roots 1.0.10, curl CA bundle 2026-10-20, NSS 3.131.1, Electron, Composer ca-bundle, distribution ca-certificates packages) with Node.js, Bun and FreeBSD pending at the time of fetch; the macOS built-in /usr/bin/curl uses /etc/ssl/cert.pem without revocation checking and had not been updated.
    region_nexus: "global; no Switzerland-specific exposure reported - affects any Swiss public-sector client or service whose trust store lacks the intermediate blocks (Go/Python/Rust/Node services, curl on macOS, container base images, appliances, TLS-inspection proxies)"
    primary_sector_nexus: "indirect (all organizations trusting the public Web PKI)"
    sector: "cross-sector"
    cves: [CVE-2026-111943]
    techniques: [T1557, T1649]
    technique_note: "Capability mapping only: no exploitation is reported; T1557 is the abuse the weak keys enable (impersonate a site to intercept TLS), T1649 the forgery of trusted certificates."
    affected_products: ["emSign ECC Root CA - G3 (eMudhra)", "Go crypto/x509", "Mozilla NSS", "Python certifi", "rustls-webpki", "curl CA bundle", "Debian/Ubuntu/Alpine/Fedora ca-certificates"]
    entity_keys: []
    new_entities:
      - { key: "incident:emudhra-intermediate-ca-key-compromise-2026-10", type: incident, name: "eMudhra intermediate CA private-key compromise (October 2026)", aliases: ["eMudhra CA compromise", "emSign ECC Root CA - G3 removal"], summary: "Eight eMudhra P-384 intermediate CA keys generated on 2025-04-30 were trivially recoverable (integers below 256); reported 2026-10-17, revoked 2026-10-18, root emSign ECC Root CA - G3 removed from Mozilla NSS and, from 2026-10-27, the Chrome Root Store (Mozilla bug 2083449; Google Chrome Root Program, 2026-10-20)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: { reliability: A, credibility: 1 }
    novelty: new
    evidence:
      - quote: "The private keys for these certificates were generated with insufficient randomness (i.e., weak cryptographic entropy), enabling anyone to forge trusted HTTPS certificates to impersonate any website against clients that have not yet removed trust in those CAs."
        attribution: "Google Chrome Root Program"
        source_url: "https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"
      - quote: "website operators with certificates chaining to emSign ECC Root CA - G3 must immediately acquire and install a new TLS certificate from another PKI hierarchy included in the Chrome Root Store."
        attribution: "Google Chrome Root Program"
        source_url: "https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"
      - quote: "The 8 impacted keys all used integers less than 256."
        attribution: "Mozilla Bugzilla (bug 2083449)"
        source_url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"
      - quote: "The certificates have been blocked in Firefox and Chrome since the 17th of October, in Apple devices since the 19th and on Microsoft platforms since the 20th."
        attribution: "Mozilla CA Program incident tracker (D. Jackson)"
        source_url: "https://emudhra.we-have-a-problem.com/"
      - quote: "However, many clients outside of the browser ecosystem do not enforce Certificate Transparency. We do not know if attackers exploited the flawed key generation to target these clients."
        attribution: "Mozilla CA Program incident tracker (D. Jackson)"
        source_url: "https://emudhra.we-have-a-problem.com/"
      - quote: "However, software that uses its own certificate stores or doesn't check certificate revocations may keep trusting the compromised intermediates until it is updated."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"
    extended_notes: |
      Exposure: not a patch-a-product item. Defenders can test whether a client still trusts the intermediates with Mozilla's test endpoints (curl https://dv-g3b-emudhra.we-have-a-problem.com/ and https://dv-g3b-aaa-emudhra.we-have-a-problem.com/ - a certificate error means the client is protected, per the tracker); inventory services using their own CA bundles (Go binaries built before 1.27.3/1.26.10, Python certifi, Rust webpki-roots, Node, Electron apps, container images with an old ca-certificates package, macOS /usr/bin/curl). Separately inventory any certificates the organization itself obtained from eMudhra/emSign under the ECC G3 root: they stop validating in Chrome from 2026-10-27 (Mozilla tracker says 97 percent of eMudhra's affected certificates were ACME-issued, so check ACME clients pointed at emSign).
      Detection (derived from the stated mechanism, not a vendor rule): eMudhra says no end-entity certificates were issued from the compromised intermediates, so any TLS server certificate observed on the wire or in proxy/EDR TLS metadata whose chain includes one of the eight intermediates (or their Sectigo cross-signs; serials and hashes are in the tracker's impacted-intermediates.json) is anomalous and should be treated as a forged-certificate/MITM indicator; telemetry class: TLS session metadata (Zeek ssl/x509 logs, TLS-inspection and proxy logs, EDR network events). Because no CT entries exist, CT monitoring will not show forged certificates.
      Triage: legitimate eMudhra customers' certificates chain to other eMudhra intermediates, not these eight; a validation failure for a site using emSign ECC G3 after 2026-10-27 in Chrome is expected breakage, not an attack.
      Defender takeaway: update trust stores and rebuild images on every non-browser stack that does not consume revocation data; do not rely on revocation or CT for those clients.
      DISCREPANCY to surface: Google's post says eight subordinate CAs in its first paragraph and six intermediate CAs later (six are the TLS ones that matter for CT); Mozilla's bug lists the issuer of the intermediates as emSign Root TLS CA - G3 while Google and Mozilla's root-removal decision name emSign ECC Root CA - G3 as the root being removed. The Mozilla tracker says Microsoft platforms blocked the intermediates from 2026-10-20; Microsoft's own advisory was not located.
