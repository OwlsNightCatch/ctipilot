  section: updated-entry
  item: "2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (Detection, Sophos sweep cadence; low confidence)"
  url_or_quote: "the sweep of sign-ins itself, which Sophos saw come from a single virtual private server for about 96 minutes from 07:11 UTC on 2026-10-15, in strictly ascending tenant-ID order, one to six minutes apart"
  summary: "(low confidence) Huntress (cited in the same entry; SpecterOps relays it) says the app authenticated 'between 06:13 and 08:34 UTC' and 'moved through tenants in sorted GUID order, a few seconds apart'; Sophos and Todyl give 07:11 to 08:47 UTC and 1 to 6 minutes apart (their windows are identical to the minute). The entry carries only the Sophos cadence into a detection line and does not say the observers differ, probably because each sees a subset of tenants. A hunter keying on 'one to six minutes' would miss the seconds-apart pattern."
