- code: F11
  category: editorial-advisory
  section: whole-run
  item: "sourcing_note fields of php, emudhra, connectwise, metabase, publica entries"
  url_or_quote: "e.g. PHP: 'absent from the CVE.org record service and ENISA's EUVD when read on 2026-10-21 (03:38 UTC); they are carried because CERT-EU and Sansec both name them'; eMudhra: 'which were not read directly ... Microsoft's own notice was not located'; ConnectWise: \"ConnectWise's own page could not be read after its update\"; Metabase: \"Republik's own page was not read\""
  summary: "Reader-facing sourcing_note carries fetch narration and composition rationale (when/what was read, why a CVE is 'carried') and runs to 5 or more sentences (Publica's is a paragraph block). The rule is two sentences of provenance, nothing else."
