- code: F13
  category: analytical-link-as-fact
  section: updated-entry
  item: "2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen (headline)"
  url_or_quote: "headline: \"Qilin and Inc ransomware exploit the GlobalProtect bypass and pivot to vCenter and ESXi, past in-guest EDR\" ; source https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"
  summary: "Unit 42 says 'Ransomware operators exploiting CVE-2026-0257 include Spikey Scorpius (aka Qilin) and Tarnished Scorpius (aka Inc)' and, separately, 'In one notable case, attackers moved from the compromised VPN gateway to the vCenter management appliance'. No cited source (Unit 42, Arctic Wolf, KEV) ties the vCenter/ESXi pivot to Qilin or Inc; Arctic Wolf's Qilin cases mention Veeam, not vCenter. The headline binds the pivot to the two named groups. Fix: name the groups and the one-case pivot as separate facts (the body section is correctly worded); the Defender takeaway 'target that reaches vCenter, ESXi and the backup server' also generalises one case."
- code: F3
  category: claim-not-supported
  section: new-entry
  item: "2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (Exposure)"
  url_or_quote: "every internet-facing PHP runtime, whether Apache with mod_php, nginx or Apache with PHP-FPM, shared hosting or a container image; the running version is shown by `php -v` or the hosting panel, and on WordPress by the Server section of Site Health ([Wordfence, 2026-10-20](https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/))"
  summary: "The cited Wordfence page carries only the Site Health check (Tools > Site Health > Info > Server). None of php.net, CERT-EU, Sansec or Wordfence mentions mod_php, nginx, PHP-FPM or `php -v` in the body, and no technical detail is public, so no source says every SAPI is exposed. Fix: drop the SAPI enumeration or attribute it as the entry's own reading, and cite only what Wordfence states."
- code: F3
  category: claim-not-supported
  section: new-entry
  item: "2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates (Detection)"
  url_or_quote: "eMudhra reports no end-user certificates issued from the intermediates, so a server certificate chain ... that contains one of the eight intermediates (the tracker lists them with their Sectigo cross-signs) would be a forged-certificate signal; Certificate Transparency monitoring will not show such a certificate because none was logged ([Google, 2026-10-20](https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/))"
  summary: "The one citation is Google, whose post says 'no TLS certificates chaining to these six intermediate CAs were logged to Certificate Transparency (CT) before our blocking action'. It carries neither eMudhra's statement (BleepingComputer, 'no evidence they were used to issue certificates to end users'), nor the tracker's Sectigo cross-sign list, and it counts six TLS intermediates, not eight. Split the clause across its real sources."
- code: F4
  category: hallucinated-fact
  section: new-entry
  item: "2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates (Detection and Triage)"
  url_or_quote: "Detection: \"eMudhra reports no end-user certificates issued from the intermediates\" ; Triage: \"so a chain through one of them is not a customer certificate\""
  summary: "BleepingComputer (the only source for eMudhra's position): 'eMudhra said most of the affected intermediate certificates were never used in production and that it had found no evidence they were used to issue certificates to end users.' 'No evidence' is turned into 'no certificates issued' and then into a discriminator ('is not a customer certificate'); 'most never used in production' implies some were. The Triage line itself says 'found no evidence', so the entry contradicts itself. Fix: keep the hedge and drop or soften the 'is not a customer certificate' conclusion."
- code: F3
  category: claim-not-supported
