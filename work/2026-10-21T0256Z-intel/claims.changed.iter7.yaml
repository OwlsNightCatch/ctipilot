  - claim_id: 55f86aa514
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "summary"
    kind: frontmatter
    text: "TeamUpdraft, the vendor of the UpdraftPlus backup plugin, says unauthorised access to teamupdraft.com on 17 and 18 October probably exposed its customer database, including UpdraftCentral connection keys, and Patchstack and Nethemba report an attacker using those keys to install backdoor plugins on connected WordPress sites, which Patchstack's telemetry dates from 2026-10-18 15:32 UTC, and that create hidden administrators. It is not a flaw in UpdraftPlus: the plugin obeys commands signed with a valid key, a key exists on many sites that never used the service because connecting a teamupdraft.com account ticks the option by default, and the vendor's fix and the discoverer's reading of it disagree on which keys the update removes."
