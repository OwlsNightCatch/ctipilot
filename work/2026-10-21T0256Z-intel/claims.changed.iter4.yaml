    surface: "summary"
    kind: frontmatter
    text: "Oracle's Critical Patch Update of 2026-10-20 carries 1295 new patches. Its risk matrices list 90 rows (73 distinct CVE ids) scored CVSS 3.1 9.0 or higher that need no authentication over the network, among them six at 10.0 in Access Manager, SOA Suite (three), E-Business Suite Workflow Notification Mailer and JD Edwards EnterpriseOne Orchestrator, and two WebLogic Server flaws at 9.8 reachable over HTTP and over T3 and IIOP. The advisory states no exploitation for any row, and it points to My Oracle Support documents for patch availability."
