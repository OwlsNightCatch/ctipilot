    text: "The PHP security team announced on 2026-10-20 a security release for Wednesday 2026-10-21 at 14:00 UTC that fixes two critical flaws, both CVSS 4.0 9.2, and may ship earlier if details leak or exploitation starts. CERT-EU names them CVE-2026-109618 and CVE-2026-109619 and reads them as potential unauthenticated remote code execution, and Sansec reports a leaked screenshot of an exploit tool and expects mass attacks within 15 minutes of the release. The fix goes into the PHP runtime on the host or in the container image, not into any CMS or plugin, and PHP 8.1 and older are outside upstream support."
