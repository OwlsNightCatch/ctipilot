  section: teamupdraft-updraftcentral-stolen-keys-backdoor-plugins (summary and body paragraph 1)
  item: "TeamUpdraft breach: stolen UpdraftCentral connection keys are used to push backdoor plugins ..."
  url_or_quote: "since 2026-10-18 at 15:32 UTC ([Patchstack, 2026-10-19](https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/))"
  summary: "(low confidence) Patchstack's page gives the first observation as '18 October 2026, 15:32' in both the facts table and the timeline, with no timezone; its other timestamps carry UTC ('19 October 2026 8:00 UTC') but this one does not. Only BleepingComputer (listed in sources[], not cited on this clause) says 'started on October 18 at 15:32 UTC'. Cite BleepingComputer beside Patchstack for the UTC reading or drop 'UTC'; same in the summary."
- code: F9
  category: surface-contradiction
  section: connectwise-cloud-backup-skykick-m365-app-credential-abuse (## Improvement - 2026-10-21T03:47:47Z, record summary)
  item: "ConnectWise Cloud Backup (formerly SkyKick): the vendor's Microsoft 365 application credential ..."
  url_or_quote: "a single virtual private server authenticated as the ConnectWise Cloud Backup application and requested app-only Microsoft Graph tokens for about 96 minutes, from 07:11 UTC, in strictly ascending tenant-ID order, one to six minutes apart"
  summary: "(low confidence) Sophos (and Todyl) give 07:11 to 08:47 UTC and 'one to six minutes apart' for the sweep from 144.172.64.128; Huntress, which the entry cites at ten places, says for the same address and day 'between 06:13 and 08:34 UTC. The actor moved through tenants in sorted GUID order, a few seconds apart' (SpecterOps relays it). The entry reports only Sophos's window and cadence, so a reader building a rate-based detection does not see the conflicting Huntress figures. Add a Contradiction line naming both, or attribute the cadence to Sophos and Todyl in terms that show Huntress differs."
