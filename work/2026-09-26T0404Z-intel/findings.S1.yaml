      No technical detail exists yet on a vulnerability class, so the T1190 mapping is an anticipated-vector inference from the product class (internet-facing secure file-transfer/communications gateway) and the vendor's own framing, not a confirmed technique — flag this clearly if composed. Any Swiss public-sector entity running Kiteworks should treat the vendor's shutdown-window advice as the immediate action, update to 9.5.1 if not already current, and watch for a CVE / technical follow-up over the coming days (historically, Cl0p-style file-transfer zero-days are disclosed only after mass exploitation is already under way).
