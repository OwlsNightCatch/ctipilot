  - title: "Kiteworks tells customers worldwide to shut down secure file-transfer servers for a six-hour window after 'credible' law-enforcement zero-day warning"
    sources:
      - { url: "https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html", publisher: "Heise Online", date: "2026-09-25", role: "primary" }
