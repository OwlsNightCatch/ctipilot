  - title: "CVE-2026-65660 — Microsoft SharePoint: a SafeControls parser-desync lets an authenticated attacker forge Register directives to reach RCE via XamlServices deserialization; CISA KEV-listed after Microsoft confirmed observed exploitation (CVSS 8.8)"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-65660", publisher: "Microsoft Security Response Center (MSRC)", date: "2026-09-25", role: "primary" }
      - { url: "https://www.cyber.gc.ca/en/alerts-advisories/al26-023-vulnerability-impacting-microsoft-sharepoint-server-cve-2026-65660", publisher: "Canadian Centre for Cyber Security", date: "2026-09-24", role: "primary" }
      - { url: "https://blog.viettelcybersecurity.com/sharepoint_cve-2026-65660/", publisher: "Viettel Cyber Security (Dinh Ho Anh Khoa)", date: "2026-09-22", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/sharepoint-flaw-initially-listed-as.html", publisher: "The Hacker News", date: "2026-09-22", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (KEV addition dated 2026-09-25, per work/2026-09-26T0404Z-intel/kev-window.txt mandatory-disposition flag) → pivot: The Hacker News, URL https://thehackernews.com/2026/09/sharepoint-flaw-initially-listed-as.html → primary: Microsoft Security Response Center, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-65660 → primary: Canadian Centre for Cyber Security AL26-023, URL https://www.cyber.gc.ca/en/alerts-advisories/al26-023-vulnerability-impacting-microsoft-sharepoint-server-cve-2026-65660 → primary: Viettel Cyber Security technical write-up, URL https://blog.viettelcybersecurity.com/sharepoint_cve-2026-65660/"
    summary: |
      CISA added CVE-2026-65660 (Microsoft SharePoint, CVSS 8.8) to its Known Exploited Vulnerabilities catalog on 2026-09-25; Microsoft's own CVE record was revised the same day to state "As of 9/25/2026, Microsoft had reliable evidence of observed attacks against exploitation of this vulnerability" — a reversal of the original August advisory, which had rated exploitation "Less Likely" and mischaracterized the bug as a spoofing flaw with no integrity/availability impact. The vulnerability sits in SharePoint's ToolPane component: `Microsoft.SharePoint.WebPartPages.ToolPane.GetPartPreviewAndPropertiesFromMarkup()` verifies web-part Register directives against the SafeControls allow-list via `EditingPageParser.VerifyControlOnSafeList()`, but `RegisterDirective.GetHtml()` writes attribute values between double quotes without escaping embedded quote characters. An attacker who can reach the ToolPane page can split a Register directive's `Src` attribute across the quote boundary to smuggle a second, unchecked Register directive into the markup after the SafeControls check has already run — registering an arbitrary .NET class before the tag is parsed. Wrapping `System.Xaml.XamlServices` in a `System.Data.Services.Internal.ExpandedWrapper` and invoking `XamlServices.Parse()` on an `ObjectDataProvider`-based gadget (an in-memory technique that avoids the registry-permission failures that block other `XamlReader`-based deserialization gadgets) yields code execution without touching disk. Viettel Cyber Security researcher Dinh Ho Anh Khoa (the discloser of the original 2025 ToolShell chain) published the full exploit markup and an in-memory webshell technique on 2026-09-22, and separately demonstrated that ToolPane's own authentication check can be bypassed via a distinct, already-patched (9 June 2026) vulnerability to reach pre-authentication RCE on SharePoint servers configured for anonymous page access. Fixed since the August 11 2026 cumulative update: SharePoint Enterprise Server 2016 < 16.0.5565.1001, SharePoint Server 2019 < 16.0.10417.20198, SharePoint Server Subscription Edition < 16.0.19725.20522 (the patch also disables the vulnerable function by default per the researcher); the researcher additionally states unsupported SharePoint 2013 is affected with no fix forthcoming. Microsoft's FAQ describes the base exploitation path as requiring only low-privilege authentication and no user interaction.
    region_nexus: "global; SharePoint Server on-premises is widely deployed across Swiss and EU public-sector collaboration environments, and this is the same researcher/component class behind the 2025 ToolShell mass-exploitation of government SharePoint servers"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-65660]
    techniques: [T1190, T1505.003]
