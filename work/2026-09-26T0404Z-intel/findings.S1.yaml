      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12985", publisher: "NCSC Switzerland — Cyber Security Hub", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12985 (NCSC-CH post created 2026-09-25T13:21:09Z, citing Heise) → primary: Heise Online, URL https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/kiteworks-urges-6-hour-server-shutdown-over-potential-zero-day-attacks/ → corroborating: TechCrunch, URL https://techcrunch.com/2026/09/25/kiteworks-urges-customers-to-shut-down-their-servers-amid-imminent-threat-of-cyberattack/"
    summary: |
      Secure file-transfer/communications vendor Kiteworks (formerly Accellion) emailed customers worldwide on 2026-09-25, urging a precautionary six-hour server shutdown after receiving what CISO Frank Balonis described as "credible threat intelligence from law enforcement indicating an attack on Kiteworks systems may be imminent this weekend." For Central Europe the requested window is 04:00-10:00 CEST on Saturday 2026-09-26 (2026-09-25T22:00Z-2026-09-26T04:00Z in New York terms; worldwide windows span AEST to PDT); Kiteworks recommends shutting systems down earlier still, and even for instances not directly internet-facing, stating it "cannot be said with certainty what potential access routes there might be." No CVE, vulnerability class or exploited component has been disclosed — Kiteworks states "all known vulnerabilities are addressed in our current release, 9.5.1" and frames the notice as preventing exploitation of a vulnerability presently unknown to the vendor, not a response to a confirmed breach ("We are not aware of any compromise of Kiteworks systems"). Kiteworks markets specifically to government bodies and financial institutions in addition to healthcare and enterprise customers; researcher Kevin Beaumont pointed to roughly a thousand internet-facing Kiteworks instances indexed via Shodan. BleepingComputer notes the pattern is structurally identical to the Cl0p group's historical zero-day mass-exploitation of secure file-transfer platforms (Accellion FTA, GoAnywhere MFT, SolarWinds Serv-U, Cleo, MOVEit Transfer) but no actor has been named or confirmed by Kiteworks, the FBI, or CISA (both declined to comment on specifics).
    region_nexus: "global precautionary advisory; the announced shutdown window explicitly covers Central European Time, and Kiteworks names government bodies and financial institutions among its customer base"
