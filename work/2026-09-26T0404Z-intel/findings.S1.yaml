    evidence:
      - quote: "As of 9/25/2026, Microsoft had reliable evidence of observed attacks against exploitation of this vulnerability."
        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-65660"
      - quote: "Chained with other SharePoint vulnerabilities, this vulnerability can achieve pre-authentication remote code execution on SharePoint servers configured to permit anonymous access."
        attribution: "Canadian Centre for Cyber Security, AL26-023"
        source_url: "https://www.cyber.gc.ca/en/alerts-advisories/al26-023-vulnerability-impacting-microsoft-sharepoint-server-cve-2026-65660"
      - quote: "An authenticated attacker with low-level access to an affected server could send a specially crafted request to execute code on the server. User interaction is not required."
        attribution: "Microsoft Security Response Center FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-65660"
    extended_notes: |
      Defenders who triaged this CVE off the original August advisory (spoofing, CVSS 6.5, no C/I/A impact) should re-triage now — the FAQ, CVSS vector (3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) and exploitation status all changed on 2026-09-25/09-11 without a headline vulnerability-class change in most trackers. Detection: no file-based web shell is dropped for the in-memory technique described by Viettel, so EDR/AMSI visibility into IIS w3wp.exe child-process and reflective-assembly-load behavior matters more than file-integrity monitoring of the wwwroot tree; CCCS's alert lists concrete telemetry hooks (unusual SharePoint administrative activity, unexpected web-part/config modifications, suspicious IIS machine-key access, AMSI/Defender SharePoint-exploitation detections). Hardening: enable AMSI integration for SharePoint web applications with Request Body Scan Mode set to Full, restrict/eliminate direct internet exposure of Central Administration and management interfaces, and confirm the June 9 2026 ToolPane-authentication-bypass patch is applied (its absence is what converts this into a pre-auth chain).
    borderline: false
    priority_suggestion: high

