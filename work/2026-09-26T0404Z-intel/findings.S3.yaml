  - title: "Kiteworks (formerly Accellion) tells customers worldwide to shut down every server for six hours on law-enforcement intelligence of an imminent attack, no CVE assigned"
    sources:
      - { url: "https://www.heise.de/news/Bevorstehender-Zero-Day-Angriff-KiteWorks-draengt-Kunden-zur-Serverabschaltung-11466114.html", publisher: "Heise Online", date: "2026-09-25", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/kiteworks-urges-6-hour-server-shutdown-over-potential-zero-day-attacks/", publisher: "BleepingComputer", date: "2026-09-25", role: "primary" }
      - { url: "https://therecord.media/kiteworks-urges-customers-to-stop-using-systems-incident", publisher: "The Record (Recorded Future News)", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/news/Bevorstehender-Zero-Day-Angriff-KiteWorks-draengt-Kunden-zur-Serverabschaltung-11466114.html → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/kiteworks-urges-6-hour-server-shutdown-over-potential-zero-day-attacks/ → corroboration: The Record, URL https://therecord.media/kiteworks-urges-customers-to-stop-using-systems-incident"
    summary: |
      Kiteworks (secure managed-file-transfer and webmail platform used by government agencies, financial
      institutions and enterprises worldwide — Heise names several German state banks, insurers, a media group
      and automotive suppliers as customers) emailed customers on 2026-09-25 urging a precautionary six-hour
      shutdown of every Kiteworks system worldwide, staggered by timezone (Central Europe: Saturday 2026-09-26
      04:00-10:00 local). Kiteworks CISO Frank Balonis told both Heise and Recorded Future News the company
      "received credible threat intelligence from federal intelligence authorities indicating that a threat
      actor may attempt to target some Kiteworks systems for customers," and recommended shutting servers down
      even where they are not directly internet-reachable, since the possible access route is unconfirmed.
      Kiteworks customer support separately told Heise the shutdown is meant "to protect against any potential
      zero-day attacks." No CVE, patch, or technical detail has been published; Kiteworks states all currently
      known vulnerabilities are fixed in the current release, 9.5.1, and frames the advisory as preventative
      rather than a response to a confirmed breach or compromise. Kiteworks was formerly branded Accellion,
      whose FTA file-transfer product was the target of a December 2020 zero-day mass-exploitation campaign
      by the Cl0p group (actor:clop in this store) that hit dozens of organizations including a university and
      a US state auditor's office; watchTowr's Jake Knott (quoted by The Record) frames the current advisory
      as familiar territory given that history, noting "nobody requests that their entire customer base unplug
      production systems over the weekend because of a hunch." No actor or CVE has been named as of this writing.
      Given no technical mechanism is confirmed, defenders should treat this as a precautionary heads-up rather
      than an active-exploitation confirmation, and prioritize verifying patch level (9.5.1) and monitoring
      Kiteworks' own advisory page for any CVE that follows.
    region_nexus: "global; Kiteworks markets explicitly to government/public-sector and financial-institution customers, a profile directly overlapping the Swiss public-sector constituency (secure file transfer / confidential webmail is a common e-government and inter-agency data-exchange tool)"
    primary_sector_nexus: "direct"
