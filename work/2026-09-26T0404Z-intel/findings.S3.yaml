  - title: "Swiss Federal Council orders drafting of a standalone federal Cybersecurity Act (CSG), folding CRA-style product rules, critical-data protection and hosting/cloud-provider duties — plus the existing critical-infrastructure incident-reporting obligation — out of the Information Security Act and into one new law"
    sources:
      - { url: "https://www.netzwoche.ch/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz", publisher: "Netzwoche", date: "2026-09-25", role: "primary" }
      - { url: "https://www.inside-it.ch/schweiz-bekommt-cybersicherheitsgesetz-20260925", publisher: "Inside IT Switzerland", date: "2026-09-25", role: "corroborating" }
      - { url: "https://www.swisscybersecurity.net/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz", publisher: "SwissCybersecurity.net", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS listing, article detail page returned HTTP 429 Vercel Security Checkpoint on drill-down) → pivot: WebSearch (\"admin.ch news Bundesrat Cybersicherheitsgesetz CSG 25.9.2026\") → primary: Netzwoche, URL https://www.netzwoche.ch/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz"
    summary: |
      The Swiss Federal Council on 2026-09-25 instructed the Federal Department of Defence, Civil Protection
      and Sport (VBS) to draft a new standalone "Bundesgesetz über die Cybersicherheit" (Cybersecurity Act,
      CSG), consolidating three pending parliamentary motions the Federal Office for Cybersecurity (BACS) had
      been handling separately as amendments to the existing Information Security Act (ISG): (1) cyber-resilience
      requirements for products with digital elements, explicitly modeled on the EU Cyber Resilience Act,
      including binding obligations for manufacturers, importers and retailers of hardware/software, a market-
      surveillance framework, and a sales ban for unsafe products; (2) special cybersecurity duties to protect
      particularly important digital data; and (3) participation and defense duties for hosting and cloud
      providers. The Federal Council states the standalone-law approach is meant to bundle these cross-cutting
      obligations into a single instrument, easing compliance for internationally active companies already
      subject to the EU CRA. Critically, the existing critical-infrastructure cyber-incident reporting
      obligation — currently anchored in the ISG under BACS's remit — is being moved out of the ISG and into
      the new CSG; the ISG itself will be narrowed to govern only federal-administration information security
      going forward. Existing sector-specific rules (telecoms law, electricity-supply ordinance,
      telecommunications-equipment ordinance) are left untouched; the CSG is framed as supplementing them with
      cross-sector cybersecurity duties. A consultation draft (Vernehmlassungsvorlage) is expected by summer
      2027 — this is a mandate to draft, not yet a bill; no operational obligation exists today.
    region_nexus: "Switzerland — federal, and via the critical-infrastructure reporting-duty relocation, directly touches cantonal/communal operators of critical infrastructure already or soon subject to that duty"
    primary_sector_nexus: "direct"
    sector: "public-sector"
