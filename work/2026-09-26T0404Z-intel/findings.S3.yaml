  - title: "GitLab CE/EE ships an ad-hoc critical patch for 11 vulnerabilities, including two unrelated CVSS 9.9 authenticated RCEs in the CI/CD regular-expression parser/compiler"
    sources:
      - { url: "https://www.heise.de/news/Sicherheitsluecken-GitLab-Server-mit-Schadcode-attackierbar-11465889.html", publisher: "Heise Online", date: "2026-09-25", role: "corroborating" }
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/", publisher: "GitLab", date: "2026-09-23", role: "primary" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/news/Sicherheitsluecken-GitLab-Server-mit-Schadcode-attackierbar-11465889.html → primary: GitLab patch-release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/"
    summary: |
      GitLab shipped Community Edition and Enterprise Edition 19.4.1, 19.3.3 and 19.2.7 on 2026-09-23, an
      ad-hoc critical patch release fixing 11 vulnerabilities. Two are unrelated, independently-discovered
      CVSS 9.9 authenticated remote-code-execution flaws in how GitLab's CI/CD configuration parses a
      user-supplied regular expression: CVE-2026-89078 is a double-free in the regex parser, and CVE-2026-93577
      is an integer overflow in the regex compiler, both letting an authenticated user with only low privileges
      (PR:L in the CVSS vector, no user interaction) execute arbitrary code on the GitLab server via a
      specially-crafted regex placed in a CI/CD configuration file. Both were reported through GitLab's
      HackerOne bug-bounty program by researcher joaxcar; GitLab reports no observed exploitation as of
      publication. The same release fixes CVE-2026-84739 (CVSS 8.7, stored XSS in the merge-request diff
      viewer via unsanitized path components, executes in a victim's browser session on view), and
      CVE-2026-92470 (CVSS 7.7, EE only — the Duo AI job-troubleshooting feature exposes CI/CD variable values
      from debug-mode job traces to unauthorized authenticated users via a missing authorization check). Seven
      further lower-severity issues cover MCP token-scope enforcement (CVE-2026-92874), Direct Transfer
      author-spoofing (CVE-2026-92530), private child-issue disclosure via the Epic Issues REST API
      (CVE-2026-8937), Duo Workflow governance-control bypass (CVE-2026-92529), GraphQL security-policy
      disclosure (CVE-2026-10518), unauthenticated CI job-trace variable disclosure via GraphQL (CVE-2026-4523),
      and an MCP search race condition (CVE-2026-92628). All fixed versions apply back through affected ranges
      starting as early as GitLab 13.11 (the XSS flaw) and 15.11 (the unauthenticated GraphQL disclosure).
      GitLab.com itself is already patched; GitLab Dedicated customers need take no action. This is a distinct
      patch cycle from the CVE-2026-85706 unauthenticated path-traversal flaw this store already tracks (fixed
      in 19.3.2/19.2.6/19.1.8, published 2026-09-10) — the CI/CD-regex RCE pair is new and unrelated.
    region_nexus: "global; self-managed GitLab CE/EE instances are common in public-sector and defense-adjacent software-development environments, including CI/CD pipelines with elevated build-service permissions"
    primary_sector_nexus: "indirect"
