    extended_notes: |
      No CVE or confirmed compromise as of this writing — this is a precautionary vendor/law-enforcement warning,
      not a confirmed incident. Follow-up value: watch for (a) a CVE assignment or confirmed exploitation
      disclosure in the next few days, (b) any Swiss public-sector Kiteworks deployment specifically named, and
      (c) whether Cl0p or another data-theft extortion actor claims credit, which would place this squarely in
      the Accellion/MOVEit/GoAnywhere/Cleo lineage. Given the extremely short fuse (warning and shutdown window
      both fall within ~24 hours of each other) this is a genuinely breaking, high-uncertainty item; treat the
      "zero-day" framing as vendor/customer-support characterization, not a confirmed vulnerability class.
    borderline: true
    borderline_reason: "no CVE, no confirmed exploitation, and no Swiss victim named yet — included because NCSC Switzerland's own Cyber Security Hub already advisoried it same-day and because Kiteworks' government customer base and the MFT-zero-day/data-theft-extortion precedent (Accellion/MOVEit/GoAnywhere/Cleo) make this materially relevant to public-sector defenders even at this early, unconfirmed stage."

  - title: "Swiss Federal Council orders drafting of a standalone federal Cybersecurity Act (CSG), folding the critical-infrastructure incident-reporting duty out of the Information Security Act and aligning product rules with the EU Cyber Resilience Act"
    sources:
      - { url: "https://www.netzwoche.ch/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz", publisher: "Netzwoche", date: "2026-09-25", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz", publisher: "SwissCybersecurity.net", date: "2026-09-25", role: "corroborating" }
      - { url: "https://www.inside-it.ch/schweiz-bekommt-cybersicherheitsgesetz-20260925", publisher: "Inside-IT Switzerland", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS item 'Schweiz bekommt Cybersicherheitsgesetz', published 2026-09-25T10:23:48Z; full article body returned HTTP 429 'Vercel Security Checkpoint' on both extract/jina and plain WebFetch, consistent with this source's documented recurring 429 condition — corroborated instead via independent outlets) → pivot: WebSearch (\"Bundesrat Cybersicherheitsgesetz Schweiz September 2026 Vernehmlassung Händler Hersteller\") → primary: Netzwoche, URL https://www.netzwoche.ch/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz → corroborating: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-09-25/bundesrat-erteilt-auftrag-fuer-neues-cybersicherheitsgesetz → confirmed against official record: NCSC Switzerland (BACS) media-releases archive, URL https://www.bacs.admin.ch/de/medienmitteilungen (dated entry '25. September 2026 — Bundesrat will neues Cybersicherheitsgesetz schaffen', fetched via jina, carries the Federal Council's own official summary text verbatim-matching the trade-press reporting; not cited as a Source per the listing-page rule but used to confirm the story is not fabricated wire copy)"
    summary: |
      Switzerland's Federal Council decided at its session of 2026-09-25 to task the Federal Department of
      Defence, Civil Protection and Sport (VBS) with drafting a consultation proposal (Vernehmlassungsvorlage)
      for a new, standalone federal "Cybersecurity Act" (Bundesgesetz über die Cybersicherheit, CSG), due by
      June 2027 per BACS's own official summary (trade press cites "by summer 2027"). The CSG folds together
      three previously separate parliamentary mandates that BACS had been developing as amendments to the
      existing Information Security Act (ISG, SR 128.1): (1) cyber resilience of products with digital
      elements — binding requirements for manufacturers, importers and retailers of hardware/software,
      a legal basis for market surveillance, and a sales/import ban on insecure products, modelled explicitly
      on the EU Cyber Resilience Act to avoid double compliance burden for internationally active firms already
      subject to the CRA; (2) strengthened protection obligations for particularly important digital data; and
      (3) cybersecurity duties (participation and defence obligations) for hosting and cloud providers. Critically
      for constituency obligations, the Federal Council will also move the existing mandatory cyber-incident
      reporting duty for critical-infrastructure operators — in force under the ISG since 1 April 2025 — out of
      the ISG and into the new CSG; the ISG itself will be narrowed to govern only the information security of
      federal authorities themselves. Sector-specific rules (Telecommunications Act, Electricity Supply Ordinance,
      Telecommunications Installations Ordinance) are left untouched, with the CSG explicitly framed as
      supplementing them with cross-cutting cybersecurity duties. No immediate compliance obligation changes
      today — this is a legislative mandate with a mid-2027 consultation-draft deadline — but it is the clearest
      signal yet of how Switzerland intends to structurally separate "federal-administration information security"
      (ISG) from "third-party/market cybersecurity regulation" (new CSG), and confirms the critical-infrastructure
      incident-reporting duty's future legal home.
    region_nexus: "Switzerland — federal legislative action by the Federal Council (Bundesrat) directly setting the future legal architecture for Swiss cybersecurity regulation, including the critical-infrastructure incident-reporting obligation federal, cantonal and communal administrations and their suppliers already operate under"
    primary_sector_nexus: "direct — restructures the legal basis for the mandatory cyber-incident reporting duty that critical-infrastructure operators (including public-sector bodies) already comply with, and creates new market-surveillance/product-security obligations relevant to any technology supplier serving Swiss government entities"
