    extended_notes: |
      This item directly extends the standing policy watch (Swiss ISG implementation, EU CRA/NIS2 alignment).
      It is distinct from the already-tracked policy:switzerland-isv-federal-isms-deadline-2026 (the ISV Art. 51
      federal-ISMS-by-2027 deadline, which concerns internal federal-administration ISMS build-out under the
      existing ordinance) and from policy:switzerland-sovereign-digital-infrastructure-motion-2026 (the
      sovereign-cloud motion 24.3209) — this is a third, separate legislative track concerning market/product
      regulation and the critical-infrastructure reporting duty's statutory home. Inside-it.ch's full article body
