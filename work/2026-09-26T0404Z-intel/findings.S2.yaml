  - title: "Kiteworks (formerly Accellion) tells customers worldwide to shut down secure-file-transfer servers for six hours over law-enforcement zero-day threat intelligence"
    sources:
      - { url: "https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html", publisher: "heise online", date: "2026-09-25", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/kiteworks-urges-6-hour-server-shutdown-over-potential-zero-day-attacks/", publisher: "BleepingComputer", date: "2026-09-25", role: "corroborating" }
      - { url: "https://techcrunch.com/2026/09/25/kiteworks-urges-customers-to-shut-down-their-servers-amid-imminent-threat-of-cyberattack/", publisher: "TechCrunch", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12985 (NCSC Switzerland Cyber Security Hub advisory, created 2026-09-25T13:21:09Z, citing heise as source advisory) → primary: heise online, URL https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/kiteworks-urges-6-hour-server-shutdown-over-potential-zero-day-attacks/ → corroborating: TechCrunch, URL https://techcrunch.com/2026/09/25/kiteworks-urges-customers-to-shut-down-their-servers-amid-imminent-threat-of-cyberattack/"
    summary: |
      Kiteworks (rebranded from Accellion in late 2021), which sells secure managed file-transfer (MFT) and
      secure-webmail products to enterprises, financial institutions and government organizations, emailed
      customers worldwide on 2026-09-25 urging them to shut down their Kiteworks servers for a precautionary
      six-hour window (Central European time: Saturday 2026-09-26, 04:00-10:00 CEST) after CISO Frank Balonis
      said the company "received credible threat intelligence from law enforcement indicating an attack on
      Kiteworks systems may be imminent this weekend." Kiteworks told both heise (which broke the story after
      obtaining the customer email) and BleepingComputer/TechCrunch that it is "not aware of any compromise of
      Kiteworks systems" and that the advisory is "preventative rather than a response to a confirmed breach";
      it separately confirmed the six-hour shutdown recommendation applies globally by time zone. Kiteworks
      support told heise the shutdown is meant "to protect against any potential zero-day attacks," but neither
      Kiteworks' statement to BleepingComputer/TechCrunch nor the customer notification confirms a zero-day has
      actually been discovered or exploited; the vendor states all currently known vulnerabilities are fixed in
      the current release, 9.5.1. No CVE has been assigned. The precedent class is exactly the one that matters
      for public-sector defenders: MFT/secure-file-transfer platforms (Accellion FTA, Fortra GoAnywhere MFT,
      SolarWinds Serv-U, Cleo, Progress MOVEit Transfer) have repeatedly been the target of pre-authentication
      zero-day exploitation by data-theft extortion actors, most persistently the Cl0p group, which BleepingComputer
      notes is the actor most associated with this attack pattern historically (no attribution has been made for
      this specific warning). TechCrunch cites security researcher Kevin Beaumont's Shodan search showing roughly
      a thousand internet-facing Kiteworks systems online, and reports a healthcare-sector customer that took its
      server down immediately, causing patient-contact disruption — illustrating the operational cost even of the
      precautionary measure alone. Kiteworks markets itself to government customers among its "thousands" of
      clients across healthcare, technology, education, automotive and government sectors.
    region_nexus: "global vendor advisory surfaced and amplified via NCSC Switzerland's Cyber Security Hub; Kiteworks markets to government customers including in the DACH region (heise: 'Auch hierzulande sind grosse Unternehmen betroffen' — large companies in Germany/DACH among customers)"
    primary_sector_nexus: "indirect — Kiteworks/MFT platforms are used by government and public-sector organizations for secure file exchange; the historical MFT-zero-day attack class (Accellion, MOVEit, GoAnywhere, Cleo) has repeatedly hit public-sector and critical-infrastructure victims"
