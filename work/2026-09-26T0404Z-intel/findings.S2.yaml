        attribution: "Bundesamt für Cybersicherheit (BACS), official media-release archive"
        source_url: "https://www.bacs.admin.ch/de/medienmitteilungen"
      - quote: "Geplant seien \"verbindliche Anforderungen für Hersteller, Importeure und Händler von Soft- und Hardware-Produkten\". Ebenfalls definiert werden sollen Grundlagen für die Marktüberwachung und ein Vertriebsverbot für unsichere Produkte."
        attribution: "Netzwoche"
