  - title: "Kiteworks (former Accellion) tells customers worldwide to shut down secure-file-transfer servers for six hours over a weekend after 'credible' law-enforcement threat intelligence of an imminent zero-day attack — no CVE, no confirmed compromise"
    sources:
      - { url: "https://therecord.media/kiteworks-urges-customers-to-stop-using-systems-incident", publisher: "The Record (Recorded Future News)", date: "2026-09-25", role: "primary" }
      - { url: "https://www.heise.de/news/Bevorstehender-Zero-Day-Angriff-KiteWorks-draengt-Kunden-zur-Serverabschaltung-11466114.html", publisher: "heise Security", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (source-id heise-sec), URL https://www.heise.de/security/feed.xml → drilled https://www.heise.de/news/Bevorstehender-Zero-Day-Angriff-KiteWorks-draengt-Kunden-zur-Serverabschaltung-11466114.html → corroborated at therecord (source-id therecord), URL https://therecord.media/feed → drilled https://therecord.media/kiteworks-urges-customers-to-stop-using-systems-incident (which itself credits heise as first to report) → primary: Kiteworks CISO Frank Balonis's own statements to both outlets (no separate vendor advisory URL was found — Kiteworks has issued no public security advisory as of this run, only direct customer email and press statements)"
    summary: |
      Kiteworks (rebranded from Accellion, maker of secure file-transfer and confidential-communication software used by government agencies, financial institutions and firms including Mandiant) emailed customers this week urging a precautionary six-hour shutdown of all Kiteworks systems worldwide on Saturday 2026-09-26 (04:00-10:00 CEST in Central Europe), recommending shutdown even before that window and regardless of whether the server is internet-exposed. CISO Frank Balonis told both heise and The Record the company "received credible threat intelligence from federal intelligence authorities indicating that a threat actor may attempt to target some Kiteworks systems for customers" and that the advisory is preventative, not a response to a confirmed breach: "We are not aware of any compromise of Kiteworks systems... All known vulnerabilities are addressed in our current release, 9.5.1." A Kiteworks support representative separately told heise the concern is a zero-day, without elaborating; no CVE has been assigned or disclosed at time of writing, and Kiteworks would not say which group might be involved. WatchTowr's Jake Knott called the request unusual: "nobody requests that their entire customer base unplug production systems over the weekend because of a hunch." Kiteworks/Accellion has direct historical precedent as a mass-exploitation target: the January 2021 Accellion FTA zero-day (exploited by a Clop-linked actor) breached dozens of high-profile organizations including universities and government-adjacent entities.
    region_nexus: "global — Kiteworks explicitly markets to government agencies and financial institutions, with named customers across German state banks, insurers, automotive suppliers, and Mandiant; the Central-European shutdown window (04:00-10:00 CEST Saturday) directly covers Switzerland"
