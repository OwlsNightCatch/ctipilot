    summary: |
      Dyfed-Powys Police, a Welsh regional police force covering Carmarthenshire, Ceredigion, Pembrokeshire and Powys (more than 500,000 residents, ~2,400 officers and staff), confirmed on 2026-09-25 that it identified a cyberattack on 2026-09-14 that disrupted "some non-emergency systems" including online and email contact channels (since restored) and may have compromised staff information. The force states its investigation has found no evidence that members-of-the-public data was accessed, but staff-data compromise remains under active investigation eleven days after discovery. Emergency 999/101 telephone lines were unaffected and remained isolated throughout. The UK's Information Commissioner's Office (ICO) confirmed it received a breach report from the force and is assessing it; the investigation is led by Tarian, the regional organised-crime unit for southern Wales, with external cybersecurity-specialist support. No party — the force, the ICO, or any leak-site tracker checked this run — has named an access vector, an attacker, or confirmed ransomware/data-theft involvement as of publication.
