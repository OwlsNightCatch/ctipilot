  - title: "DIVD (Dutch Institute for Vulnerability Disclosure) discloses it was breached by what it assesses is an agentic-AI-powered attack — a first for the 7-year-old vuln-disclosure non-profit"
    sources:
      - { url: "https://databreaches.net/2026/09/25/divd-dutch-institute-for-vulnerability-disclosure-investigating-agentic-ai-powered-attack/", publisher: "DataBreaches.net (relaying DIVD's own LinkedIn statement verbatim)", date: "2026-09-25", role: "primary" }
    discovery_trace: "first seen at: databreaches.net (source-id databreaches-net), URL https://databreaches.net/feed/ → drilled https://databreaches.net/2026/09/25/divd-dutch-institute-for-vulnerability-disclosure-investigating-agentic-ai-powered-attack/ → primary: DIVD's own LinkedIn disclosure statement, quoted in full by DataBreaches.net (LinkedIn's own post page, https://www.linkedin.com/posts/divd-nl_security-people-always-say-its-not-a-matter-activity-7508986131779088384-Z7WD, returned only page chrome/no post body on direct fetch — could not independently confirm the quote against LinkedIn's raw markup this run, though the wording is corroborated verbatim across three secondary aggregators: HackNotice, Malware News, and Dutch outlet nieuwsdump.be/Tweakers — the latter two could not be fetched directly, transport failures logged)"
    summary: |
      DIVD, the Dutch Institute for Vulnerability Disclosure — a nearly seven-year-old, 30+-volunteer non-profit that scans the internet for vulnerabilities and coordinates disclosure (known for its role in the 2021 Kaseya VSA ransomware response) — disclosed on 2026-09-25 via its own LinkedIn account that it detected suspicious activity on its infrastructure, investigated, and concluded it had been breached. DIVD states explicitly that this is "an attack we have not seen before," assessing from the modus operandi that it is agentic-AI-powered, though it has not yet named the specific technique or determined full scope. The organization has isolated and blocked access to its infrastructure, engaged a third-party incident-response firm for forensics, notified the Dutch data-protection authority (Autoriteit Persoonsgegevens) and the Dutch NCSC, involved police, and is treating the incident as an assume-breach worst-case scenario pending its next public update, promised for Monday 2026-09-28.
    region_nexus: "Netherlands; the target itself is a globally-referenced vulnerability-disclosure/security-research institution, and the incident is a live case study in a transferable TTP class (agentic-AI-driven intrusion) already recurring across this month's coverage (GTG-20006, Gambit retail-skimmer campaign, CLOSEDQUORUM, the OpenAI/Australia Medicare episode)"
