  - title: "Dyfed-Powys Police (Wales) confirms a cyberattack disrupting internal systems, staff data possibly compromised — no mechanism, actor, or public-data exposure named"
    sources:
      - { url: "https://therecord.media/wales-cyberattack-police-breach", publisher: "The Record (Recorded Future News)", date: "2026-09-25", role: "primary" }
      - { url: "https://www.gbnews.com/news/dyfed-powys-welsh-police-force-suffers-major-cyberattack", publisher: "GB News", date: "2026-09-25", role: "corroborating" }
