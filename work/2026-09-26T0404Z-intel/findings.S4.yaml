      Squarely an S1 "imminent-exploitation profile" candidate (precautionary vendor shutdown ahead of a suspected zero-day, no CVE yet) as much as an S4 disclosure; surfacing here in case S1 did not independently pick it up this run, since the public-sector/government-customer angle and the Accellion/Clop historical precedent are directly relevant to this constituency's defenders (any Swiss public-sector or supplier deployment of Kiteworks should have observed the Saturday shutdown window). No mechanism/CVE confirmed — techniques[] left empty; T1190 (Exploit Public-Facing Application) would be the expected mapping if and when exploitation is confirmed, mirroring the 2021 Accellion FTA precedent, but is not asserted here since no source states current exploitation.
