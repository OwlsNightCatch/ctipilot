          aliases: [], summary: "Misconfigured, unauthenticated Elasticsearch cluster belonging to Nextcloud GmbH exposed 367K internal business records (invoices, contracts, client setup scripts with hardcoded credentials) from 18 to 27 May 2026, discovered and publicly reported by Cybernews on 2026-07-08; exposed data named German state ministry MSB NRW as an affected client." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "On May 18th, our research team discovered an exposed dataset containing 367,000 records. An investigation revealed that the cluster, with nearly 8GB of data, contained internal Nextcloud data."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
      - quote: "The issue was caused by a misconfiguration of our hosting infrastructure and is not related to the Nextcloud solution. No other Nextcloud servers belonging to our customers, partners or other users have been affected by this issue"
        attribution: "Nextcloud spokesperson, quoted by Cybernews"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
      - quote: "Among the external email domains, the team found IONOS and STRATO, two established web hosting providers, as well as German government institutions, such as MSB NRW (Ministry of Schools and Education of the State of North Rhine-Westphalia)."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
    extended_notes: |
      Detection/hardening angle for defenders operating similar Elasticsearch/OpenSearch-backed internal
      tooling: the telemetry class that would have caught this earlier is external attack-surface monitoring
      (continuous internet-facing-asset scanning for unauthenticated management/data ports — Elasticsearch
      defaults to TCP 9200/9300 with no auth unless X-Pack/OpenSearch security is explicitly enabled) rather than
      any host-based control, since the exposure was purely a network-reachability misconfiguration. Hardening
      lever: bind Elasticsearch/OpenSearch clusters to internal-only network interfaces or a VPC, enable
      authentication plugins by default in deployment templates, and treat "hardcoded credentials in
      infrastructure-as-code / setup scripts" as a secrets-management finding to remediate regardless of whether
      the script itself is ever exposed. For organisations that are Nextcloud customers (a meaningful share of
      the EU public sector given its GDPR/data-sovereignty positioning): the actionable takeaway is not a patch,
      but heightened scrutiny of unsolicited invoice- or contract-themed emails referencing Nextcloud or its
      hosting-partner ecosystem (IONOS, STRATO) in the near term, since the leaked material is realistic
      pretexting fodder — this is a T1566 Phishing enablement risk, not a confirmed campaign.
    borderline: true
    borderline_reason: "moderate-severity, no confirmed exploitation, and the exposure sits on Nextcloud's own corporate side rather than customer-operated instances — included primarily for the EU public-sector supplier nexus (named German ministry client) and the transferable Elasticsearch-exposure hardening lesson."
