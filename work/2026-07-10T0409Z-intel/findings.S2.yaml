items:
  - title: "Nextcloud GmbH hosting misconfiguration exposes 367,000 internal records, including German government (MSB NRW) staff email addresses and client setup scripts with hardcoded DB credentials"
    sources:
      - { url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/", publisher: "Cybernews", date: "2026-07-08", role: "primary" }
      - { url: "https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html", publisher: "heise online", date: "2026-07-09", role: "corroborating" }
      - { url: "https://www.inside-it.ch/datenleck-bei-nextcloud-20260709", publisher: "Inside IT Switzerland", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'Datenleck bei Nextcloud', 2026-07-09) → primary: Cybernews, URL https://cybernews.com/security/nextcloud-cloud-provider-data-leak/ (2026-07-08, full disclosure timeline) → corroboration: heise online, URL https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html (2026-07-09, German-market pickup, title/keywords confirmed: Elasticsearch, Fehlkonfiguration, Nextcloud)"
    summary: |
      Cybernews researchers discovered a publicly exposed, unauthenticated Elasticsearch cluster on 18 May 2026
      belonging to Nextcloud GmbH — the German company behind the self-hosted collaboration platform positioned
      as part of "Euro-Office", a European alternative to Microsoft 365/Google Workspace increasingly cited for
      public-sector and GDPR-sensitive deployments. The exposure is a hosting-infrastructure misconfiguration on
      Nextcloud's own corporate systems, not a vulnerability in the open-source Nextcloud server software, and
      no customer-operated Nextcloud instances were affected. The cluster held 7.92 GB / ~367,000 records in a
      single index of internal business data: unencrypted invoices (exposing employee and client email addresses,
      including partner-hosting-provider staff at IONOS and STRATO, and — notably — email addresses belonging to
      MSB NRW, the Ministry of Schools and Education of the German state of North Rhine-Westphalia), signed
      contracts and partnership terms, .eml files with full email content, beta-feature signup lists (full names
      and work emails), and shell/Python setup-and-management scripts written for client deployments, some
      containing hardcoded database credentials. Nextcloud closed the exposure two days after Cybernews' initial
      contact (25-27 May 2026) and reported the incident to its state data-protection authority; the company
      states it found no evidence of unauthorized access beyond the researchers' own discovery, though an
      unauthenticated, internet-reachable Elasticsearch index is exactly the kind of target continuously found by
      automated internet-wide scanning (Shodan/Censys-class tooling), so prior undetected access cannot be ruled
      out. Cybernews' own risk assessment: the leaked invoices/contracts/email content give an attacker
      ready-made pretexting material to impersonate Nextcloud or a named client in convincing spearphishing, and
      the exposed client setup scripts — while not sufficient alone for a full compromise — could help an
      attacker infer a specific customer's Nextcloud deployment architecture to look for exploitable
      misconfigurations. The nearly two-month gap between discovery (18 May) and this public report (8 July)
      reflects Cybernews' standard responsible-disclosure/vendor-response cycle, not a stale story.
    region_nexus: "Germany (Nextcloud GmbH headquartered in Berlin); direct exposure of a German state-ministry (NRW) email domain; EU-wide relevance given Nextcloud's positioning as a public-sector Euro-Office/GDPR-aligned alternative"
    primary_sector_nexus: "direct — exposed data names a German public-sector body (MSB NRW) as a client whose staff email addresses were in the leaked invoices"
    sector: "public-sector, technology-supplier"
    cves: []
    techniques: ["T1596.005", "T1566"]
    affected_products: ["Nextcloud GmbH hosting infrastructure (corporate Elasticsearch cluster) — NOT the Nextcloud Server open-source product"]
    entity_keys: []
