- code: F4
  category: hallucinated-fact
  section: nextcloud-gmbh-elasticsearch-exposure-msb-nrw
  item: "Nextcloud GmbH Elasticsearch exposure"
  url_or_quote: "evidence[] quote \"The issue was caused by a misconfiguration of our hosting infrastructure and is not related to the Nextcloud solution. No other Nextcloud servers belonging to our customers, partners or other users have been affected by this issue.\" — publisher: \"heise online\""
  summary: "Evidence quote is verbatim but mis-attributed. It is NOT present in the heise page (heise's actual wording: 'Other Nextcloud servers of our customers, partners, or other users are not affected by this problem.'). The exact quoted string is a Nextcloud-spokesperson statement published by Cybernews (verified verbatim in cybernews.com/security/nextcloud-cloud-provider-data-leak/). Fix: change the evidence record publisher from 'heise online' to 'Cybernews'."
- code: F5
  category: missing-citation
  section: citrixbleed-2-dragonforce-iab-kill-chain-stac3725
  item: "CitrixBleed 2 (CVE-2025-5777) STAC3725 IAB kill chain"
  url_or_quote: "cves[].fixed \"14.1-47.46, 13.1-59.19, 13.1-FIPS/NDcPP 13.1-37.236, 12.1-FIPS 12.1-55.328\" (also repeated verbatim in action #1)"
  summary: "The specific fixed-build version strings are stated in frontmatter cves[].fixed and in action #1 ('Patch every internet-facing NetScaler ADC/Gateway to at least 14.1-47.46 / 13.1-59.19 ...') but appear in NONE of the three cited sources. Huntress (primary) only says 'patch to the latest software version' (confirmed via jina full-text); IT Security Guru and the Sophos QEMU post do not carry build numbers. The builds are accurate/canonical, but an actionable patch-target directed at a SOC needs a source. Fix: add the Citrix/NetScaler PSIRT security bulletin (CTX advisory for CVE-2025-5777) as a corroborating source."
- code: F11
  category: editorial-advisory
  section: odido-shinyhunters-vishing-dutch-police-attribution
  item: "Odido ShinyHunters breach — Dutch police attribution (update)"
  url_or_quote: "update_of: 2026-06-26/shinyhunters-used-a-single-vishing-call-into-the-company-s-i"
  summary: "ADVISORY (defensible either way). The update_of target is the Madison Square Garden ShinyHunters vishing entry — a DIFFERENT incident/victim. Odido is a distinct, never-previously-covered incident (NL telco, Feb 2026 breach). Store precedent publishes each new ShinyHunters victim (MSG, Carnival, 7-Eleven, Medtronic, NAIC) as a STANDALONE new incident entry, not update_of each other; rule 4b asks that an update_of target be 'genuinely the same story.' The body is a clean delta and the registry links incident:odido -> actor:shinyhunters correctly, so this is a judgment call — but consider re-issuing Odido as a standalone new incident (priority notable), or confirm the update_of MSG framing is intended. Not publish-blocking."
