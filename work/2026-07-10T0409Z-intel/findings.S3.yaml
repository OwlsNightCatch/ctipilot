      - quote: "At the end of Q2 2026, Sonatype Research reached 1.8 million malicious packages logged."
        attribution: "Sonatype"
        source_url: "https://www.sonatype.com/blog/q2-2026-open-source-malware-index-attackers-abuse-developer-trust"
      - quote: "Modern open source malware often executes during installation, build, or CI/CD automation rather than waiting for application runtime."
        attribution: "Sonatype"
        source_url: "https://www.sonatype.com/blog/q2-2026-open-source-malware-index-attackers-abuse-developer-trust"
      - quote: "Nearly 87% of all non-npm malicious package activity occurred in just two ecosystems: PyPI (48.5%) and NuGet (38.0%)."
        attribution: "Sonatype"
