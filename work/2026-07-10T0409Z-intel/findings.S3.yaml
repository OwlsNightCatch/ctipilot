    extended_notes: |
      Hardening takeaway: scanning must cover the build/CI stage (SCA at install-time, not just at the deployed-artifact stage), since the reported execution point is preinstall/postinstall/binding.gyp — a fully built and running application can be clean while the build pipeline that produced it was already compromised.

  - title: "SentinelLabs: China-nexus and India-nexus (Bitter/TAG-179) espionage actors independently compromised Pakistani police infrastructure, weaponising a citizen-facing Complaint Management System as a watering hole"
    sources:
      - { url: "https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/", publisher: "SentinelLabs (SentinelOne)", date: "2026-07-09", role: "primary" }
      - { url: "https://tribune.com.pk/story/2617353/china-india-linked-hacking-groups-targeted-pakistani-law-enforcement-report-says", publisher: "The Express Tribune", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"SentinelLabs SentinelOne research July 2026\") → primary: SentinelLabs, URL https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/ → pivot: The Express Tribune, URL https://tribune.com.pk/story/2617353/china-india-linked-hacking-groups-targeted-pakistani-law-enforcement-report-says"
    summary: |
      SentinelLabs documented sustained, independent cyberespionage (Feb 2024-Apr 2026) by both a suspected China-nexus actor and an India-nexus actor (TAG-179, aka Mysterious Elephant / Bitter / APT-C-08) against the same set of Pakistani law-enforcement bodies — Balochistan Police, Khyber Pakhtunkhwa Police, Islamabad Police and the Punjab Safe Cities Authority — each pursuing its own stakes in Pakistan's internal-security picture. Initial access came through compromised network appliances and web-application servers; the notable technique is that the China-nexus actor planted implants directly in the Balochistan Police's public-facing Complaint Management System (CMS), a portal used by both police staff and ordinary citizens, turning trusted e-government infrastructure into a malware-delivery watering hole. Two CMS implant variants were deployed: a Rust stager and a .NET executable masquerading as security/portal-update software (`cms_plugin.exe`, both variants downloading from 193.42.25[.]65 and displaying "Update Complete! Please refresh the page" to the victim); the .NET variant reflectively loads AsyncRAT configured against its own separate C2 infrastructure. China-nexus tradecraft also included PlugX and ShadowPad backdoors; the India-nexus actor (Bitter/TAG-179) used Remcos; both used Cobalt Strike as commodity tooling. SentinelOne ties the CMS-implant samples to a Chinese-speaking developer via a shared `D:\codedome` build-path artefact. SentinelOne's own framing: "multiple cyberespionage actors operate against law enforcement institutions of a single state — the convergence itself is a signal of target value" (Aleksandar Milenkoski). China's embassy denied wrongdoing; Khyber Pakhtunkhwa Police stated no core system was confirmed compromised.
    region_nexus: "South Asia (Pakistan) — no direct Swiss/European nexus; surfaced for the transferable technique class"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: ["T1189", "T1584.004", "T1620", "T1027", "T1071.001"]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:bitter", type: actor, name: "Bitter", aliases: ["TAG-179", "Mysterious Elephant", "APT-C-08"], summary: "India-nexus espionage actor observed by SentinelLabs deploying Remcos against Pakistani law-enforcement targets 2024-2026, also tracked by Kaspersky under 'Mysterious Elephant' (SentinelLabs, 2026-07-09)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Targets Pakistani law-enforcement systems with no direct Swiss/European nexus; included because the technique class — a nation-state actor weaponising a citizen-facing e-government CMS/complaint portal as a watering hole reaching both staff and the public via a disguised 'update' lure with reflectively-loaded RAT — is directly transferable to any government running similar public-facing e-services infrastructure, including Swiss/EU public-sector portals."
    evidence:
      - quote: "A suspected China-nexus actor planted implants in one of the web applications, which serves both police staff and citizens, weaponizing a tool of Pakistan's police digitalization against its users."
        attribution: "SentinelLabs"
        source_url: "https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/"
      - quote: "These indicators point to a Chinese-speaking developer behind the samples linked by the `D:\\codedome` prefix, including the one deployed on the Balochistan Police CMS application."
        attribution: "SentinelLabs"
        source_url: "https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/"
      - quote: "Multiple cyberespionage actors operate against law enforcement institutions of a single state, the convergence itself is a signal of target value."
        attribution: "Aleksandar Milenkoski, SentinelOne (via The Express Tribune)"
        source_url: "https://tribune.com.pk/story/2617353/china-india-linked-hacking-groups-targeted-pakistani-law-enforcement-report-says"
    extended_notes: |
      Triage/hunt takeaway generalisable beyond this incident: any public-facing government portal that also serves internal staff is a watering-hole target of equal value to a direct internal-network intrusion — monitor for unexpected executable downloads or "update" prompts served from portal-adjacent infrastructure, and treat citizen-facing e-government CMS instances as Tier-1 assets for integrity monitoring, not just availability monitoring.

