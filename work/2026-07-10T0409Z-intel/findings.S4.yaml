    extended_notes: |
      CERT.LV's published network-indicator table (IPs for the Sliver C2 servers, generic C2, and Proton VPN egress) is deliberately NOT reproduced here per the no-IOC policy; defenders with a CERT.LV relationship (SOC/ABS services) receive the indicators directly, and the technique classes (Sliver C2, VPN-based egress, tunnelling-service abuse) are the transferable, non-IOC part of the disclosure. CERT.LV's hardening recommendation list is unusually thorough (full external/internal asset inventory before defense is possible; mandatory 2FA on all externally exposed authenticated services; particular attention to anything unpatched >1 year; DMZ/corporate segmentation beyond VLAN-only; per-user unique SSH keys with password auth disabled; SPN/service-account review; out-of-band SIEM/log retention that survives encryption or log-wiping; STIG/Microsoft Security Baselines; AppLocker allow-listing; Zero Trust assume-breach posture) and is a good source for a future deep-dive on Baltic-state ransomware hardening guidance.

  - title: "Nextcloud GmbH's own hosting infrastructure — not the open-source software — leaks 367K internal records via a misconfigured public Elasticsearch cluster, exposing client setup scripts with hardcoded database credentials and German government contacts"
    sources:
      - { url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/", publisher: "Cybernews", date: "2026-07-08", role: "primary" }
      - { url: "https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html", publisher: "heise online (Germany)", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: news.risky.biz (Risky Bulletin, RSS), URL https://news.risky.biz/rss/ → drilled article URL https://news.risky.biz/risky-bulletin-india-bans-app-used-to-hack-e-rickshaws-in-viral-videos/ → pivot: Cybernews (discoverer), URL https://cybernews.com/security/nextcloud-cloud-provider-data-leak/ (primary) → corroboration: WebSearch (\"Nextcloud data leak Elasticsearch 367,000 records July 2026\") → heise online, URL https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html — also corroborated in Swiss press via inside-it.ch RSS listing (https://www.inside-it.ch/rss.xml, item \"Datenleck bei Nextcloud\", 2026-07-09; full article fetch 403'd on both direct and jina transports, logged as coverage gap)"
    summary: |
      Cybernews researchers discovered a publicly reachable, unauthenticated Elasticsearch cluster (~7.9 GB, ~367,000 records) belonging to Nextcloud GmbH's own hosting/business infrastructure — not the Nextcloud open-source collaboration software, and not any customer-operated Nextcloud server. The cluster was live from at least 18 May until it was closed on 27 May 2026 (a ~9-day exposure window from discovery to closure). Exposed, and in many cases unencrypted, records included client invoices and contracts naming business-partnership terms, internal and client email correspondence with headers and timestamps, and — the most operationally significant category — shell and Python scripts that Nextcloud GmbH built to set up and manage the product for its clients, some of which contained hardcoded database credentials. Named exposed parties in the invoice/contact data include hosting providers IONOS and STRATO and German government bodies such as North Rhine-Westphalia's Ministry of Schools and Education (MSB NRW). Nextcloud confirmed the root cause as a hosting-infrastructure misconfiguration, stated no other customer-operated Nextcloud servers were affected, and reported the incident to the responsible German data-protection supervisory authority; the company says it has no evidence the exposed data was accessed by a third party before closure. The relevance for public-sector defenders: Nextcloud is actively marketed and adopted as the "Euro-Office" sovereign-cloud alternative to Microsoft 365/SharePoint across EU public administration (e.g., the German state of Mecklenburg-Vorpommern's ongoing SharePoint-to-Nextcloud migration), so exposure of client-specific setup scripts and hardcoded credentials from Nextcloud's own vendor-side infrastructure is a supply-chain-adjacent risk to any public-sector tenant whose onboarding scripts or contract details were among the leaked files, even though the leak itself involved no compromise of the software or customer servers.
    region_nexus: "Germany/EU — Nextcloud GmbH is a German company; named exposed contacts include German government institutions (MSB NRW), and Nextcloud is positioned as the sovereign-cloud alternative for EU public-sector digital-sovereignty initiatives"
    primary_sector_nexus: "direct"
    sector: "public-sector"
