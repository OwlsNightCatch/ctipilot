    discovery_trace: "first seen at: darkreading (RSS), URL https://www.darkreading.com/rss.xml — headline reference to FortiBleed/Nextcloud only, no LVM mention → pivot: WebSearch (\"Latvia LVM ransomware CERT.LV\") — actually first surfaced via therecord.media RSS listing (webfetch) → pivot: The Record, URL https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware → primary: CERT.LV, URL https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija and https://cert.lv/lv/2026/07/cert-lv-rekomendacijas-infrastrukturas-kiberdrosibas-noturibas-uzlabosanai-pret-kiberuzbrukumiem → additional corroboration: BNN News, URL https://bnn-news.com/hacker-remained-undetected-in-latvijas-valsts-mezi-system-for-several-days-281634 → additional corroboration: NRA.lv, URL https://nra.lv/tehnologijas/525072-lvm-skaidro-kiberuzbrukuma-iespejamibu.htm"
    summary: |
      CERT.LV (Latvia's national CERT) confirms a foreign, financially motivated ransomware group breached AS "Latvijas valsts meži" (LVM), Latvia's state-owned forestry company, via T1190 Exploit Public-Facing Application against a system LVM's own IT director says had gone roughly two years without a security update (he declined to name the affected software). Initial access was gained 11 June 2026 but the actor stayed dormant for ~11 days before detonating on the night of 22-23 June — Prime Minister Andris Kulbergs publicly stated no detection tooling existed to catch the intervening abnormal activity, and CERT.LV separately flagged a gap in LVM's compliance with Latvia's National Cybersecurity Law. The actor exfiltrated 44 GB (internal documents, email, LVM's business IT project code repositories, digital certificates/keys, and user passwords plus their hash values) before the extortion attempt; CERT.LV's incident recommendations state all authentication material tied to the affected infrastructure must be treated as compromised and rotated (T1078 Valid Accounts). CERT.LV's published network-indicator table for the intrusion names Sliver C2 (open-source red-team command-and-control framework) alongside generic C2 servers and Proton VPN egress as the observed infrastructure (T1071 Application Layer Protocol), and separately warns defenders that legitimate-looking tunnelling services (Cloudflare Tunnel, Microsoft Dev Tunnels, ngrok-class tunnels) are a class of traffic worth treating as suspicious for this campaign profile. During incident analysis CERT.LV found the same actor had also gained unauthorised access to at least one server at AS Olpha (formerly Olainfarm), a Latvian essential-services provider — data there was not encrypted, but forensic log deletion was observed (T1070 Indicator Removal), a technically separate but contemporaneous intrusion by the same group. CERT.LV states the group has run comparable operations against other companies and state institutions in NATO and EU member states, and is continuing to probe Latvian public- and private-sector infrastructure for new footholds — a direct shared-threat signal for other European critical-infrastructure/government operators, not a Latvia-only event. A ransom demand of roughly 0.1% of annual revenue (>€600,000) for a decryption key was reported by an independent security researcher who made direct contact with the actor; LVM says it received no formal ransom demand and would refuse to pay regardless. As of 8 July, ~two-thirds of LVM's contracted service customers still lacked access to affected systems and the LVM GEO mapping platform remained only partially restored, over two weeks post-detonation. A notable side-note: LVM had been separately developing enhancements to Latvia's electronic voter-registration system (ETVR) in an isolated environment; CERT.LV performed a line-by-line diff of every code delivery to the State Digital Development Agency and confirmed no unauthorised modification — election-system integrity was unaffected.
    region_nexus: "Latvia (EU/NATO member state); CERT.LV explicitly states the same actor has targeted other NATO/EU member-state companies and state institutions and continues probing Latvian infrastructure — a cross-border shared-threat signal for European CI/government operators generally"
