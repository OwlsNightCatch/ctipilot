          summary: "ShinyHunters breach of Dutch telecom operator Odido (and its Ben brand): a vishing call impersonating IT staff convinced a customer-service employee to authenticate into a spoofed corporate portal, harvesting credentials used to bulk-exfiltrate 6.2M+ customer records (initial intrusion 5 February 2026, confirmed by Odido's CEO in May 2026; Dutch police announced strong indications of Dutch-national involvement in the caller's voice, 9 July 2026)." }
