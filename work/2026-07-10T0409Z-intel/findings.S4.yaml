          summary: "Misconfigured, publicly exposed Elasticsearch cluster belonging to Nextcloud GmbH's own hosting/business infrastructure exposed ~367,000 internal records — invoices, contracts, client setup scripts with hardcoded database credentials, and internal/client email — for roughly nine days in May 2026; discovered and disclosed by Cybernews. The open-source Nextcloud software and customer-operated servers were not affected (Cybernews/heise online, 2026-07-08)." }
