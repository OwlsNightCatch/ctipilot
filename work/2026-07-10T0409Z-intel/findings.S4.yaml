  - title: "CERT.LV: Latvia's state forestry operator LVM breached via a 2-year-unpatched exposed system; same ransomware actor hits essential-services provider Olpha with log-wiping intrusion — CERT.LV flags the group as active against other EU/NATO state institutions"
