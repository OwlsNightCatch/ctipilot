  - title: "Dutch police: ShinyHunters' Odido telecom breach used a vishing call impersonating IT staff to plant a spoofed corporate login portal; investigation now points to Dutch-national involvement"
    sources:
      - { url: "https://www.politie.nl/nieuws/2026/juli/8/onderzoek-naar-hack-odido-wijst-op-mogelijke-betrokkenheid-nederlanders.html", publisher: "Politie (Dutch National Police)", date: "2026-07-09", role: "primary" }
      - { url: "https://nos.nl/artikel/2622288-bellende-odido-hacker-vermoedelijk-nederlander-politie-dreigt-stem-openbaar-te-maken", publisher: "NOS (Dutch public broadcaster)", date: "2026-07-09", role: "corroborating" }
      - { url: "https://nos.nl/artikel/2614128-odido-ontdekte-pas-na-bericht-van-hackers-dat-klantgegevens-waren-gestolen", publisher: "NOS (Dutch public broadcaster)", date: "2026-05-12", role: "corroborating (background TTP detail, Odido CEO on-record)" }
      - { url: "https://nos.nl/artikel/2602080-hack-bij-odido-gegevens-miljoenen-klanten-in-handen-van-criminelen", publisher: "NOS (Dutch public broadcaster)", date: "2026-02-12", role: "corroborating (original breach disclosure)" }
    discovery_trace: "first seen at: news.risky.biz (Risky Bulletin, RSS), URL https://news.risky.biz/rss/ → drilled article URL https://news.risky.biz/risky-bulletin-india-bans-app-used-to-hack-e-rickshaws-in-viral-videos/ (item: \"Police suspect Dutch national involved in Odido hack\") → primary: Politie (Dutch National Police), URL https://www.politie.nl/nieuws/2026/juli/8/onderzoek-naar-hack-odido-wijst-op-mogelijke-betrokkenheid-nederlanders.html → pivot: WebSearch (\"Odido hack politie phishing telefoongesprek klantenservice juli 2026\") → NOS, URL https://nos.nl/artikel/2622288-bellende-odido-hacker-vermoedelijk-nederlander-politie-dreigt-stem-openbaar-te-maken → background pivot: NOS, URL https://nos.nl/artikel/2614128-odido-ontdekte-pas-na-bericht-van-hackers-dat-klantgegevens-waren-gestolen and https://nos.nl/artikel/2602080-hack-bij-odido-gegevens-miljoenen-klanten-in-handen-van-criminelen"
    summary: |
      Dutch National Police (Team High Tech Crime) announced 9 July that its investigation into the February 2026 breach of Dutch telecom operator Odido (and its Ben brand) has produced "strong indications" of Dutch-national involvement, based on forensic voice analysis of a call recorded at the time of the intrusion. The underlying technique, confirmed on-record in May by Odido CEO Tisha van Lammeren: a caller from ShinyHunters (registry: actor:shinyhunters) phoned an Odido customer-service employee, impersonated Odido IT-department staff (T1656 Impersonation), and via a voice-phishing pretext (T1566.004 Spearphishing Voice) persuaded the employee to authenticate into a spoofed copy of the corporate work environment — harvesting that employee's real login credentials (T1078 Valid Accounts) for the customer-contact system. Odido blocked the compromised account within an hour of noticing the intrusion, but by then the operators had already bulk-downloaded a database of 6.2 million customer records (full name, address, phone number, customer number, email, bank account number, date of birth, and passport/driver's-licence numbers with validity dates) — Van Lammeren said the company was "extremely surprised by the speed" of the exfiltration (T1213 Data from Information Repositories). Critically, neither Odido's internal team nor an external cybersecurity firm detected the data theft itself during same-day incident response on 5 February; it surfaced only when ShinyHunters directly notified the company two days later that customer data had been stolen — Van Lammeren: "the hackers have good techniques for that; it happens in the background, and we didn't see it." Odido refused to pay, and ShinyHunters published the dataset on the dark web in March, at which point Odido discovered business-customer data (not just Ben/Odido consumer accounts) had also been taken. The Dutch Data Protection Authority (Autoriteit Persoonsgegevens) has two open investigations — into whether Odido's customer-system security was adequate, and whether it retained (former) customer data longer than legally permitted. The 9 July update: police have recorded the vishing caller's voice, assess it as very likely a genuine human speaker (while noting synthetic-voice spoofing "can never be 100% ruled out"), and are publicly appealing for the caller to surrender within a few weeks or have the recording released.
    region_nexus: "Netherlands (EU) — national police investigation into a telecom-sector breach, Dutch Data Protection Authority (AP) has two open regulatory inquiries"
