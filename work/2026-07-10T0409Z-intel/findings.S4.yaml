    extended_notes: |
      This is the same vishing-into-identity-platform kill chain already covered for ShinyHunters' breach of Madison Square Garden (2026-06-26 entry) — a repeat confirmation that the actor runs this exact playbook (voice call impersonating internal IT → victim self-authenticates into an attacker-controlled portal → credential theft → rapid bulk export) across sector-diverse targets (entertainment venue operator, EU telecom). Worth flagging to identity/helpdesk teams specifically: no software vulnerability was exploited in either case — the control that would have stopped this is helpdesk-callback verification / out-of-band identity confirmation before any credential entry prompted by an inbound call.

