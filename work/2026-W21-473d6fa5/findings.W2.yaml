    summary: |
      Council Regulation (EU) 2026/506, adopted 23 April 2026 as part of the 20th Russia sanctions
      package amending Regulation 833/2014, adds a prohibition in Article 5n on providing "managed
      security services" to the Government of Russia and to legal entities established in Russia,
      effective 25 May 2026 — within this reporting window. The prohibition is defined broadly to
      cover "a service provided to a third party consisting of carrying out, or providing assistance
      for, activities relating to cybersecurity risk management, such as incident handling, penetration
      testing, security audits and consulting, including expert advice, related to technical support."
      The prohibition extends to EU-incorporated MSSPs supplying Russian subsidiaries unless a
      national-competent-authority licence is obtained; the Belarusian sanctions regime was harmonised
      in parallel. No European Commission interpretative guidance on the managed-security-services
      prohibition had been published as of 24 May 2026 — law-firm analyses note this gap and advise
      conservative reading of scope until guidance arrives. Switzerland's Federal Department of Economic
      Affairs, Education and Research (EAER) announced on 22 May 2026 (effective 22 May at 23:00 CET)
      that Switzerland adopts most of the EU 20th package: 115 individuals/entities added to asset-freeze
      lists, 20 Russian banks and 7 third-country financial intermediaries placed under transaction bans,
      and participation in RUBx / digital-ruble crypto transactions prohibited from 26 May 2026.
      Switzerland deferred certain financial, energy and trade-sector measures for later review; the
      press release does not confirm whether the managed-security-services prohibition was adopted in
      Swiss law simultaneously — this gap requires SECO confirmation. EU organisations (including
      Swiss entities aligned to the EU package) that provide any incident-response, penetration-testing,
      security-audit or consulting services to Russian counterparties must have wound down those
      engagements as of 25 May. Defender action: MSSP and IR contracts with any Russian-law-entity
      clients require immediate legal-counsel review; SOC-manager obligation reporting should verify
      no active tooling (EDR agents, SIEM forwarders, ticketing) is being serviced to a Russian entity.
