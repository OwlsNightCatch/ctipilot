    extended_notes: |
      Legal instrument: Council Regulation (EU) 2026/506 amending Regulation (EU) 833/2014.
      Official Journal reference cited by Squire Patton Boggs: http://data.europa.eu/eli/reg/2026/506/oj
      Swiss Fedlex references: https://www.fedlex.admin.ch/eli/oc/2026/235 (Russia ordinance update),
      https://www.fedlex.admin.ch/eli/oc/2026/233 (Belarus ordinance update).
      The managed-security-services prohibition sits alongside other Article 5n professional-services
      restrictions already in force (accounting, IT consultancy, market research, legal advisory etc.).
      Swiss SECO has historically adopted EU service prohibitions from the Russia package in sequential
      steps — the managed-security-services prohibition may follow in a subsequent SECO ordinance amendment.
      Interpretative guidance from the EC on scope of the prohibition is pending.

