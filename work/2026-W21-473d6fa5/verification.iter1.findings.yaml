  item: "EU 20th Russia sanctions package — managed-security-services prohibition (Art. 5n)"
  url_or_quote: "Council Regulation (EU) 2026/506 introduces an Article 5n prohibition on providing \"managed security services\""
  summary: "Cited Squire Patton Boggs source confirms regulation number (EU) 2026/506 but states the operative MSS prohibition is Article 2f(1a), not 5n (5n(1)(i) appears only in a string of related articles). Greenberg Traurig (also cited) gives neither identifier. Brief asserts 'Article 5n' as the operative provision; cited sources do not support that. Fix: change to Article 2f(1a) per Squire Patton Boggs, or drop the article number."
