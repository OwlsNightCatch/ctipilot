items:
  - title: "ANNUAL REPORT — Verizon 2026 DBIR: vulnerability exploitation overtakes credential theft as #1 breach vector for first time in 19 years; patching median regresses to 43 days"
    sources:
      - url: "https://www.verizon.com/about/news/breach-industry-wide-dbir-finds"
        publisher: "Verizon"
        date: "2026-05-19"
        role: "primary"
      - url: "https://www.securityweek.com/verizon-dbir-2026-vulnerability-exploitation-overtakes-credential-theft-as-top-breach-vector/"
        publisher: "SecurityWeek"
        date: "2026-05-20"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/20/verizon-2026-dbir-findings/"
        publisher: "Help Net Security"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: >
      first seen at: WebSearch ("Verizon DBIR 2026 vulnerability exploitation May 2026")
      → pivot: Verizon press release, URL https://www.verizon.com/about/news/breach-industry-wide-dbir-finds (pub 2026-05-19)
      → corroborating: SecurityWeek article URL https://www.securityweek.com/verizon-dbir-2026-vulnerability-exploitation-overtakes-credential-theft-as-top-breach-vector/ (pub 2026-05-20)
      → corroborating: Help Net Security URL https://www.helpnetsecurity.com/2026/05/20/verizon-2026-dbir-findings/ (pub 2026-05-20)
    summary: |
      Verizon published its 19th annual Data Breach Investigations Report on 19 May 2026, analysing 31,000+ incidents
      and 22,000+ confirmed breaches across 145 countries between November 2024 and October 2025. For the first time
      in the report's history, vulnerability exploitation (31%) has overtaken credential theft (13%) as the most
      common initial access vector — a structural shift attributable in part to AI-assisted weaponisation compressing
      the attack-to-exploit window from months to hours. The median time for full patching regressed to 43 days
      (from 32 days the year prior), and organisations remediated only 26% of CISA KEV-listed vulnerabilities (down
      from 38%), against a backdrop of 50% more critical bugs requiring remediation than the previous dataset year.
      Ransomware appeared in 48% of confirmed breaches (up from 44%), though the median ransom paid fell below
      $140,000 and only 31% of victims paid. Third-party involvement in breaches climbed 60%, now accounting for
      48% of all incidents; only 23% of third-party organisations fully remediated missing MFA on cloud accounts,
      with 50% of weak-password and permission-misconfiguration findings in third-party environments taking more
      than eight months to resolve. Social engineering over voice and text messages was 40% more successful than
      email; Shadow AI (unapproved AI tooling) tripled as a data-loss action, representing the third most common
      data-loss vector. The DBIR full PDF is available at
      https://www.verizon.com/business/resources/T1ae/reports/2026-dbir-data-breach-investigations-report.pdf.
    ch_eu_nexus: "global; European and Swiss public-sector organisations are direct consumers of the patching
      performance and third-party-breach statistics; 50% increase in critical bug volume is directly relevant to
      EU NIS2 patch-obligation timelines"
    public_sector_nexus: "direct — patching lag and KEV remediation rates apply to public-sector IT estates;
      third-party/supply-chain statistic mirrors supplier-risk posture of cantonal and federal IT providers"
    sector: "cross-sector"
    cves: []
    actors_campaigns_malware: ["Lapsus$", "ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Approximately 31% of the breaches were the result of unpatched vulnerabilities being exploited.
          Credential abuse, which was the top entry point in last year's DBIR, accounted for 13% of the breaches."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/verizon-dbir-2026-vulnerability-exploitation-overtakes-credential-theft-as-top-breach-vector/"
      - quote: "The median time for full patching increased to 43 days in 2025, up from 32 days in the previous year.
          According to the report, organizations patched only 26% of the security defects in CISA's Known Exploited
          Vulnerabilities (KEV) catalog last year, a drop from 38% in 2024."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/verizon-dbir-2026-vulnerability-exploitation-overtakes-credential-theft-as-top-breach-vector/"
      - quote: "An increased reliance on third-party software and services has expanded organizations' attack surface and
          led to a 60% increase in breaches with third-party involvement last year, reaching 48% of the total."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/verizon-dbir-2026-vulnerability-exploitation-overtakes-credential-theft-as-top-breach-vector/"
    extended_notes: |
      Defender hunting/hardening angles arising from the structural shift to vuln exploitation:
      - Detection: EDR telemetry and proxy logs for exploit-traffic patterns against KEV-listed endpoints
        (web application CVEs, edge-device CVEs) during the widened 43-day patching window.
      - Hardening: NIS2 Art. 21(2)(e) mandates patch processes; the DBIR regression in KEV coverage
        (26%, down from 38%) directly raises supervisory-audit risk for public-sector entities bound by NIS2.
      - Third-party risk: only 23% of third-party cloud vendors fully remediated MFA gaps; this underpins
        enforcement of supply-chain MFA attestation in procurement cycles (DORA Art. 25 for financial entities;
        NIS2 Art. 21(2)(d) for public-sector supply chains).
      - The infostealer-to-ransomware pipeline stat (half of victims had credential leaks within 95 days of
        compromise) supports SIEM correlation of infostealer-exfiltration alerts as leading indicators of
        imminent ransomware deployment — a 95-day attribution/hunting window.
      - Shadow AI as the third most common data-loss action: data-classification and DLP controls should
        explicitly scope AI submission endpoints (upload APIs for LLM services).

  - title: "TeamPCP / Mini Shai-Hulud: CSA two-wave consolidated synthesis + GitHub official post-incident blog (both in-window)"
    sources:
      - url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-shai-hulud-megalodon-supply-chain-cascade/"
        publisher: "Cloud Security Alliance (CSA) Lab Space"
        date: "2026-05-22"
        role: "primary"
      - url: "https://github.blog/security/investigating-unauthorized-access-to-githubs-internal-repositories/"
        publisher: "GitHub Security Blog"
        date: "2026-05-20"
        role: "primary"
    discovery_trace: >
      first seen at: WebSearch ("TeamPCP Shai-Hulud Megalodon SLSA Sigstore GitHub consolidated vendor analysis May 22 23 24 2026")
      → pivot: CSA Lab Space research note, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-shai-hulud-megalodon-supply-chain-cascade/ (pub 2026-05-22)
      → pivot: GitHub blog feed via bridge:feed, URL https://github.blog/feed/ → item "Investigating unauthorized access to GitHub-owned repositories", URL https://github.blog/security/investigating-unauthorized-access-to-githubs-internal-repositories/ (pub 2026-05-20)
    summary: |
      Two new in-window synthesis documents close out the week's Shai-Hulud/Megalodon coverage.

      The Cloud Security Alliance published a formal research note on 2026-05-22 framing the full campaign as a
      "two-wave AI developer supply chain attack." Wave 1 (Mini Shai-Hulud, April 29 – May 12): the worm hijacked
      TanStack's GitHub Actions runner via a pull_request_target trigger + GitHub Actions cache poisoning chain,
      extracted a live OIDC token from runner process memory using `/proc/PID/mem` reads, obtained a Sigstore
      signing certificate from Fulcio, and produced SLSA Build Level 3 provenance attestations for 404 malicious
      package versions across 172 packages (CVE-2026-45321, CVSS 9.6). This invalidated SLSA BL3 attestation as
      a sufficient integrity gate (the pipeline was compromised, not the attestation protocol). Wave 2 (Megalodon,
      May 18): 5,718 malicious commits pushed to 5,561 GitHub repos in under six hours using forged CI bot
      identities (build-bot, auto-ci) and templated commit messages ("ci: add build optimization step"), harvesting
      AWS IAM, GCP/Azure IMDS, SSH, Docker auth, `.npmrc`, `.netrc`, Kubernetes configs, Vault tokens, and Terraform
      state. CSA attribution links Megalodon explicitly to TeamPCP. The open-sourcing of the worm on May 12 has
      converted the capability into commodity infrastructure for any technically capable actor.

      Separately, GitHub published its first official post-incident blog on 2026-05-20 confirming compromise of
      an employee device via the poisoned Nx Console VS Code extension (GHSA-c9j4-9m59-847w), exfiltration of
      approximately 3,800 internal repositories, immediate endpoint isolation, secret rotation, and commitment to a
      fuller incident report. No customer data outside GitHub-internal repositories was found to be impacted as of
      publication. GitHub has not yet published the fuller post-incident report as of 2026-05-24.
    ch_eu_nexus: "global; npm/PyPI are universal; Swiss federal software procurement and cantonally-operated
      CI/CD pipelines installing affected packages (TanStack, AntV, Guardrails AI, durabletask) are in scope"
    public_sector_nexus: "direct — Swiss and EU public-sector CI/CD pipelines using npm/PyPI or GitHub Actions
      are exposed; SLSA L3 attestation is a key trust control in emerging EU software-supply-chain compliance"
    sector: "software supply chain, public sector, telco, finance"
    cves: ["CVE-2026-45321"]
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud", "Megalodon", "Shai-Hulud worm"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-05-22
    evidence:
      - quote: "In May 2026, the threat actor TeamPCP executed two coordinated attack waves against the AI developer
          supply chain, each exploiting a distinct layer of the software delivery pipeline within a span of three weeks."
        attribution: "Cloud Security Alliance"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-shai-hulud-megalodon-supply-chain-cascade/"
      - quote: "Mini Shai-Hulud represents the first publicly documented instance of hijacking trusted build pipelines
          themselves to generate attestation-bearing malicious artifacts — a technique with profound implications for
          the entire software supply chain trust model."
        attribution: "Cloud Security Alliance"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-shai-hulud-megalodon-supply-chain-cascade/"
      - quote: "GitHub detected and contained a compromise of an employee device on May 18, 2026. The attacker
          exfiltrated approximately 3,800 GitHub-internal repositories."
        attribution: "GitHub Security Blog"
        source_url: "https://github.blog/security/investigating-unauthorized-access-to-githubs-internal-repositories/"
    extended_notes: |
      Defender hardening from CSA synthesis:
      - `pull_request_target` runs with write access even when triggered by a fork PR — disable or isolate
        in CI workflow permissions (`permissions: contents: read` etc.).
      - GitHub Actions OIDC token extracted from runner process memory: scope OIDC audience claims tightly;
        implement `permissions: id-token: none` on workflows that do not require it.
      - SLSA Build Level 4 (hermetic, reproducible builds in isolated envs) would mitigate the WL3 bypass;
        migration is currently multi-year given ecosystem adoption rates.
      - Sigstore Rekor transparency log is a detection surface: audit unexpected signing events from your
        own pipeline identity in Rekor's public log.
      - For the Megalodon vector: Git commit author/committer fields are free-text and unverified — do not
        treat them as authentication signals. Detect via repo-level contributor allow-list policy or GitHub's
        push rules ("bypass actors" audit log events).
      - GitHub's commitment to a fuller incident report remains outstanding as of 2026-05-24.

