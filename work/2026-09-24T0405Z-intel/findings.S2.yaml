    discovery_trace: "first seen at: WebSearch (\"Machelen gemeente cyberaanval september 2026\") → primary: VRT NWS, URL https://www.vrt.be/vrtnws/nl/2026/09/23/dan-toch-persoonsgegevens-gestolen-bij-cyberaanval-op-gemeentebe/ → corroborating: ITdaily, URL https://itdaily.be/nieuws/beveiliging/gemeente-machelen-getroffen-door-cyberaanval-via-phishing/ → background: VRT NWS's own 2026-09-14 initial report, URL https://www.vrt.be/vrtnws/nl/2026/09/14/cyberaanval-treft-dienstverlening-van-gemeente-machelen-vermoe/"
    summary: |
      A phishing-based intrusion took the Belgian municipality of Machelen's (Flemish Brabant) server offline from 11 September 2026, closing physical counters and disabling municipal email while the website, e-counter, care-home and daycare systems kept running on separate infrastructure. Mayor Jean-Pierre De Groef initially told VRT NWS on 14 September that a first look found no evidence personal data had leaked. On 23 September, VRT NWS and ITdaily both reported that continued forensic investigation, run jointly by the municipality's IT staff and external specialists, has now confirmed resident personal data WAS stolen; the exact data categories and the number and identity of affected residents remain under investigation, and the mayor stresses not every resident's data was taken. No ransomware group or extortion claim has surfaced publicly at time of writing, and neither report names an attacker or malware family. The case is a direct parallel to the pattern already seen at other European communal administrations this quarter (Berlin's Landesnetz, French commune Libercourt, Swiss commune Martigny-Combe): a phishing click reaching a shared administrative network, followed by a premature "no data leaked" public statement that a longer forensic pass overturns — a sequencing risk any Swiss cantonal or communal IT/communications team should build into its own incident playbook (don't commit publicly to a no-data-theft finding before log retention and forensic scope are exhausted).
    region_nexus: "EU (Belgium, Flemish Brabant) — transferable lesson for Swiss cantonal/communal administrations, which sit at the centre of this deployment's constituency"
