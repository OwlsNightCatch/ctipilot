    techniques: [T1055.004, T1055.012, T1003.001, T1555.003, T1547.001, T1053.005, T1546.003, T1567.004, T1685]
    affected_products: ["Microsoft Windows", "Google Chrome", "Microsoft Edge", "Mozilla Firefox", "MetaMask", "Exodus"]
