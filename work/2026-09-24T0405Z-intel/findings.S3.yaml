    new_entities:
      - { key: "malware:closedquorum", type: malware, name: "CLOSEDQUORUM", aliases: ["BALZAK"],
          summary: "64-bit Go Windows implant that delegates C2 action-selection to a plurality vote among up to four commercial LLM providers (DeepSeek, Qwen, Mistral, Gemini) instead of an attacker-run server; capabilities are LSASS/browser/crypto-wallet credential theft, Early Bird APC injection or process hollowing, and triple persistence (Registry Run key, scheduled task, WMI event subscription), with results relayed and data exfiltrated via a Discord webhook. Discovered by Cisco Talos via its CAIRN toolkit; no confirmed in-the-wild deployment (Cisco Talos, 2026-09-22)."
      - { key: "tool:cairn", type: tool, name: "CAIRN (Cognitive Artifact Intelligence Research Network)", aliases: [],
          summary: "Cisco Talos' open-source research toolkit, released 2026-09-22, for discovering and tracking AI-integrated malware; used to find CLOSEDQUORUM (Cisco Talos, 2026-09-22)." }
    relation_suggestions:
      - { subject: "malware:closedquorum", object: "tool:cairn", basis: "Talos: \"CLOSEDQUORUM, a malware binary discovered through Cisco Talos' CAIRN project\" (Cisco Talos, 2026-09-22)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CLOSEDQUORUM, a malware binary discovered through Cisco Talos' CAIRN project, exhibits fully autonomous command and control (C2). While we do not have confirmation of in-the-wild deployment, artifacts from the binary were used to connect the developer to postings on criminal forums related to carding, dating back to 2025."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"
      - quote: "CLOSEDQUORUM is, to our knowledge, the first publicly documented Windows implant to apply this model to tactical command and control (C2)."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"
      - quote: "Talos said defenders should watch for behavior rather than block the domains of the AI services. Legitimate programs may contact DeepSeek, Mistral, Gemini, Discord, or OpenRouter... Far fewer would contact several of them while also accessing LSASS, injecting code into suspended processes, or creating WMI persistence."
        attribution: "The Hacker News, relaying Cisco Talos"
        source_url: "https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html"
    extended_notes: |
      Detection framing per Talos: this is explicitly NOT a domain/IP blocklist problem, since the "C2 infrastructure" is legitimate commercial AI-provider endpoints thousands of benign applications call daily; the actionable signal is the co-occurrence pattern — AI-service traffic from a Windows binary with no legitimate reason to call multiple LLM providers within a short window, combined with LSASS access, injection into a suspended process, new WMI persistence, or Discord webhook traffic from the same host/process — plus a randomized 5-15 minute polling cadence chosen to evade short sandbox runs. Prompt content itself is only visible with TLS inspection or to the AI provider, so a network-only vantage point sees only the fact of repeated multi-provider calls, not their content. Robustness note worth surfacing to hunters: the tie-break order is fixed (DeepSeek wins ties), and total provider failure causes a sleep-retry rather than a default action — both are deterministic behaviors a detection rule or honeypot interaction could exploit. Talos frames CLOSEDQUORUM as the first documented example of "effort displacement" (a full attack-phase decision handed to AI rather than just AI-assisted tooling), contrasting it with CERT-UA's July 2025 LAMEHUG (which had an AI model write commands for a fixed task, not choose the task). No CVE applies — this is malware capability, not a vulnerability.
  - title: "ShinyHunters hijacks Clop's dark-web leak site via an unauthenticated Grav CMS file-upload flaw, then claims a still-unconfirmed Oracle PeopleSoft zero-day let it breach the FBI's own network"
    sources:
