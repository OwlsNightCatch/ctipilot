    extended_notes: |
      Fact/claim discipline is the whole story here: CONFIRMED facts are the Clop-site defacement (BleepingComputer directly observed it), the FBIjobs.gov defacement and subsequent takedown to a maintenance page (multiple outlets observed the live site state), and the FBI's own statement that it is investigating. UNVERIFIED CLAIMS, all sourced only to ShinyHunters itself, are: the existence and mechanism of the PeopleSoft zero-day, the AWS GovCloud lateral movement, the 2-3TB volume, the specific compromised services (Criminal Justice/HR/Medlink), and the theft of Clop's source code/logs/onion keys. 404 Media's partial verification (DOJ-consistent phone numbers in a small sample) supports that SOME real personnel data changed hands but does not confirm the RCE claim or full scope. Cato Networks (quoted by The Hacker News) flags the actor's own post timestamp (Sept 23, vs. US news breaking Sept 22) as a soft operational-timezone clue pointing toward Asia, explicitly caveated as non-definitive. Defender takeaway for a public-sector reader: this is a live, still-unfolding zero-day claim against Oracle PeopleSoft, a product class commonly used for HR/payroll/recruitment portals — any organization running an internet-facing PeopleSoft component (especially a recruitment/jobs-portal instance, matching the FBI's own entry point) should watch Oracle's own security-alert channel for an emergency PeopleSoft advisory in the coming days and treat unexplained PeopleSoft process activity or outbound connections as a priority hunt lead until the vendor confirms or denies the claim. No CVE exists yet for the claimed zero-day, so nothing here should be treated as validated vulnerability intelligence — it is exclusively attacker self-reporting at this stage, carried at MEDIUM confidence because of the volume and reliability of press corroboration on the surrounding facts (defacements, FBI statement) even though the core technical claim remains unconfirmed.
