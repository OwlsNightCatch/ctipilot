items:
  - title: "CLOSEDQUORUM: Cisco Talos documents the first Windows implant that delegates its next action to a vote among four commercial AI models"
    sources:
      - { url: "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/", publisher: "Cisco Talos", date: "2026-09-22", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html", publisher: "The Hacker News", date: "2026-09-23", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new malware research technical analysis September 23 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html → primary: Cisco Talos, URL https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"
    summary: |
      Cisco Talos disclosed CLOSEDQUORUM on 2026-09-22, a 64-bit Go-compiled Windows implant it says is, to its knowledge, "the first publicly documented Windows implant" to delegate tactical command-and-control decisions to a panel of up to four commercial LLM providers (DeepSeek, Qwen, Mistral, Google Gemini) rather than an attacker-run C2 server. On each cycle the implant's ModelOrchestrator queries each provider with a system prompt ("You are an advanced malware strategist. Provide ONLY executable decisions.") plus host context (hostname, OS/architecture, admin status), and each model must return one of four typed actions — steal, inject, persist, move (unimplemented in the public build) — via a fixed JSON schema; malformed or off-schema responses are discarded. interModelDiscussion() tallies plurality votes across the providers' Decision fields and executes the winner; on a tie, a hardcoded preference order (DeepSeek > Qwen > Mistral > Gemini) decides, and if every provider fails to return a valid decision the implant sleeps and retries rather than defaulting to an action. steal simultaneously dumps LSASS memory (SeDebugPrivilege + MiniDumpWriteDump), harvests Chrome/Edge/Firefox saved credentials, and pulls MetaMask/Exodus/Ethereum wallet data; inject uses Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing if a model selects that exploit type; persist lays down three parallel mechanisms — a Windows-Update-themed Registry Run-key value, a scheduled task, and a WMI permanent event subscription firing every 60 seconds via a script written to a Temp-path .ps1 file. Every model decision, its stated reasoning, and staged/stolen data are relayed through a Discord webhook, with exfiltrated files AES-256-GCM encrypted, base64-encoded and split into ~1,900-byte chunks posted at one-second intervals. Talos found the malware via CAIRN, a new open-source toolkit it released the same day for tracking AI-integrated malware, and dates the analysed build to 2026-06-17 (with a prior alias, BALZAK, renamed 2026-07-03); code artefacts tie the developer to 2025-era carding-forum activity. Talos states plainly it has "no confirmation of in-the-wild deployment," and the public distribution build ships placeholder API keys and a dummy Discord webhook, so no end-to-end run has been observed — this is a capability demonstration Talos is flagging pre-emptively, not a confirmed active campaign.
    region_nexus: "global — no reported Swiss or regional targeting; capability-class disclosure relevant to any Windows enterprise estate"
    primary_sector_nexus: "indirect"
    sector: null
