    discovery_trace: "first seen at: socradar (rotation source), URL https://socradar.io/blog/ → drilled: https://socradar.io/blog/clop-hack-shinyhunters-hijacks-data-leak-site/ → pivot: WebSearch (\"ShinyHunters FBI jobs website breach Oracle PeopleSoft September 2026\") and WebSearch (\"ShinyHunters defaces Clop leak site Grav CMS vulnerability\") → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/ and https://www.bleepingcomputer.com/news/security/shinyhunters-claims-fbi-hack-data-theft-in-peoplesoft-zero-day-breach/ → corroborating: The Hacker News, 404 Media, CyberInsider, SC Media"
    summary: |
      ShinyHunters (actor:shinyhunters) began an intrusion the night of 2026-09-18 against Clop's own Tor data-leak site, which BleepingComputer confirms was defaced and independently verified the uploaded proof file was live on Clop's infrastructure. ShinyHunters told BleepingComputer it exploited "an unauthenticated file upload vulnerability in Grav CMS" (the flat-file PHP CMS running Clop's site; no CVE has been publicly attributed to the exploited flaw) to upload a taunting text file, then fully defaced the site with ShinyHunters' Umbreon-logo ASCII art. ShinyHunters further claims — unverified by BleepingComputer — it gained full server access and stole Grav CMS source code and plugins, all of /var/log (potentially exposing authentication history and visitor IPs), and the private keys to Clop's Tor onion service, which if genuine would let ShinyHunters reproduce Clop's existing onion address on infrastructure it controls. ShinyHunters is using the access to extort Clop itself, demanding an eight-figure Bitcoin sum and threatening to publish Clop's own Oracle E-Business Suite (CVE-2025-61882) extortion-campaign records — victim names, ransom amounts, wallet addresses; Clop responded on 2026-09-21 with a message posted to its own hijacked site asking to reopen contact through a different channel, without addressing the demands. Separately, and by ShinyHunters' own account related to the same feud, the group claims that on the night of 2026-09-21 it discovered and immediately exploited a new, still-undisclosed pre-authentication remote-code-execution zero-day in Oracle PeopleSoft against FBI infrastructure, entering via a component under the /PSEMHUB/ path on the FBI's recruitment site (apply.fbijobs.gov), then moving laterally into FBI-managed AWS GovCloud infrastructure and allegedly exfiltrating 2-3TB of data before defacing apply.fbijobs.gov with the same "seized" banner used against Clop; the FBI took the site offline (it now shows a maintenance page) and told Reuters and BleepingComputer only that it "is aware of claims regarding unauthorized activity affecting FBIjobs.gov and is currently investigating" — it has not confirmed a breach, the zero-day, or any data theft. 404 Media, which first reported the claim, says it independently verified that phone numbers in a ~5,000-record sample ShinyHunters supplied correspond to real US Department of Justice personnel, though this does not confirm the claimed RCE mechanism or the full 2-3TB volume. ShinyHunters frames the FBI intrusion as retaliation for a May 2026 FBI/IC3 PSA (PSA260515) naming the group, and separately told BleepingComputer it is now exploiting the same alleged PeopleSoft zero-day against other organizations including Fortune 500 companies — its third documented wave of PeopleSoft exploitation after a confirmed campaign using CVE-2026-35273 against the education sector in June 2026 (campaign:shinyhunters-peoplesoft-2026).
    region_nexus: "global — victims are a US federal law-enforcement agency and a rival ransomware operation; no Swiss-specific targeting reported, but Oracle PeopleSoft is widely deployed in government HR/payroll/administrative systems generally, including the kind of estate this constituency runs"
