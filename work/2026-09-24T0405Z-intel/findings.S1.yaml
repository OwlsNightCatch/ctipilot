        attribution: "SolarWinds (official release notes, CVE-2026-28324)"
        source_url: "https://documentation.solarwinds.com/en/success_center/orionplatform/content/release_notes/hco_2026-2-3_release_notes.htm"
      - quote: "SolarWinds Observability Self-Hosted was found to be affected by an unauthenticated remote code execution vulnerability stemming from deserialization of untrusted data when the application is configured to use a specific communication mode."
        attribution: "SolarWinds (official release notes, CVE-2026-28325)"
        source_url: "https://documentation.solarwinds.com/en/success_center/orionplatform/content/release_notes/hco_2026-2-3_release_notes.htm"
