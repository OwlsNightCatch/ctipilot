    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories → advisory https://advisories.ncsc.nl/advisory?id=NCSC-2026-0388 → corroborating: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1215/ → primary: SolarWinds' own release notes, URL https://documentation.solarwinds.com/en/success_center/orionplatform/content/release_notes/hco_2026-2-3_release_notes.htm (the SolarWinds trust-center advisory pages themselves 403'd on every transport tried: direct, trafilatura, and jina reader) → corroborating detail: GBHackers and SecurityOnline, URLs as above → verified: NVD REST API"
    summary: |
      SolarWinds released Observability Self-Hosted 2026.2.3 on 2026-09-22 fixing two unauthenticated remote-code-execution vulnerabilities, both reported by researcher Kai Huang of Armadin through responsible disclosure. CVE-2026-28324 (CVSS 9.8) stems from insufficient integrity checks and affects installations running in a non-default, non-secure configuration; SolarWinds has not published the specific communication mode or component involved beyond "non-default and non-secure configuration." CVE-2026-28325 (CVSS 8.8) is a deserialization-of-untrusted-data flaw (CWE-502) that requires the application to be configured to use "a specific communication mode" — plausibly related to the Web Performance Monitor (WPM) player communication channel, since the same release simultaneously converts passive (server-initiated) WPM players to active (player-initiated) communication and issues remotely-installed passive players a randomly generated strong password on upgrade, a change the release notes frame as a "critical update advisory" alongside the CVE fixes. Both NCSC-NL and CERT-FR flagged the advisory the day after release (2026-09-23). Neither vendor nor either national CERT reports active exploitation or public PoC as of this writing; SolarWinds has a documented history of both supply-chain (SUNBURST, 2020) and rapidly-weaponised RCE flaws (Web Help Desk, Serv-U) in this product family, and unauthenticated RCE against internet-reachable monitoring infrastructure is a high-value initial-access target.
    region_nexus: "global; any organization running SolarWinds Observability Self-Hosted (formerly Orion-platform-based monitoring), a common enterprise/government network-monitoring deployment"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-28324", "CVE-2026-28325"]
    techniques: ["T1190"]
    affected_products: ["SolarWinds Observability Self-Hosted"]
