items:
  - title: "WordPress Core CVE-2026-87902 — unauthenticated page-template path traversal to conditional RCE, already commoditised with a named Nuclei template and confirmed file-write attempts (CVSS4.0 9.2)"
    sources:
      - { url: "https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-7hp8-65ch-5whp", publisher: "WordPress Security Team (official GHSA advisory)", date: "2026-09-22", role: "primary" }
      - { url: "https://ressl.ch/blog/cve-2026-87902-wordpress/", publisher: "Robert Ressl (discovering researcher)", date: "2026-09-22", role: "primary" }
      - { url: "https://patchstack.com/articles/cve-2026-87902-attackers-started-probing-wordpress-sites-hours-after-the-patch/", publisher: "Patchstack", date: "2026-09-23", role: "primary" }
      - { url: "https://www.wordfence.com/blog/2026/09/psa-critical-unauthenticated-path-traversal-vulnerability-patched-in-wordpress-core/", publisher: "Wordfence Threat Intelligence", date: "2026-09-22", role: "corroborating" }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-87902", publisher: "NVD (API JSON — the nvd.nist.gov HTML page is a JS-only SPA that returns an empty shell; the REST API at services.nvd.nist.gov is directly reachable and returns the full CVE record)", date: "2026-09-22", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"WordPress CVE-2026-87902 local file inclusion theme\") → pivot: ressl.ch (discoverer's own write-up), URL https://ressl.ch/blog/cve-2026-87902-wordpress/ → pivot: Patchstack exploitation-telemetry follow-up, URL https://patchstack.com/articles/cve-2026-87902-attackers-started-probing-wordpress-sites-hours-after-the-patch/ → pivot: Wordfence PSA, URL https://www.wordfence.com/blog/2026/09/psa-critical-unauthenticated-path-traversal-vulnerability-patched-in-wordpress-core/ → primary: WordPress's own GHSA advisory, URL https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-7hp8-65ch-5whp → verified: NVD REST API, URL https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-87902"
    summary: |
      WordPress Core's page-template resolution contains an unauthenticated local-file-inclusion primitive that, under specific theme and server conditions, reaches remote code execution. get_page_template() builds a template candidate as "page-{urldecode(pagename)}.php" from the public, POST-or-GET 'pagename' query variable; WordPress's own slug sanitiser preserves percent-encoded octets while only rewriting literal dots/slashes, so a double-encoded traversal sequence (e.g. %252e%252e) survives sanitisation and is only decoded into live "../" syntax by get_page_template()'s own urldecode() call. locate_template() then joins the candidate to the active theme path and checks only that the file exists and is readable — it never confirms the resolved path stays inside the theme directory. Exploitation requires (1) the active parent/child theme to contain a top-level directory whose name starts with "page-" (the advisory names legacy Twenty Twelve/Twenty Fourteen and third-party themes Neve, Hestia and Sydney) and (2) a readable local .php file with useful behaviour when included — the discoverer's and Patchstack's chain both use PHP's pearcmd.php (present in the official wordpress:php8.3-apache Docker image and default cPanel PHP<8.5 installs) with register_argc_argv=On, which exposes the query string to the included script as $argv, letting an attacker issue pearcmd's "config-create" action to write an attacker-controlled PHP file to /tmp or /var/tmp — arbitrary code execution as the web-server account. Affects every WordPress Core release from 4.7.0 through 7.1.1; fixed in 7.1.2 (7.x) with security backports to every branch down to 4.7.37. Patchstack observed the first exploitation attempt within hours of the 2026-09-22 patch (11:49 UTC, same day) and documents escalation over the following day from reconnaissance-only probing to confirmed file-write (pearcmd config-create) attempts, with two dedicated user agents (cve-2026-87902-poc/1.0, nuclei-cve-2026-87902/1.0) — including a named public Nuclei template — now in general circulation and traffic running at more than 10x the first-evening volume.
    region_nexus: "global; any internet-facing WordPress install, including Swiss public-sector/communal sites built on WordPress"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-87902"]
    techniques: ["T1190"]
    affected_products: ["WordPress Core"]
    entity_keys: ["product:wordpress-core"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attackers are now including `pearcmd.php` and using it to write PHP files to disk, and public scanning tooling for this CVE is in circulation."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/cve-2026-87902-attackers-started-probing-wordpress-sites-hours-after-the-patch/"
      - quote: "A named Nuclei template means this is no longer a handful of operators working from the patch diff. It is in general circulation and anyone can point it at a host list."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/cve-2026-87902-attackers-started-probing-wordpress-sites-hours-after-the-patch/"
      - quote: "An unauthenticated attacker can make `get_page_template()` page-template resolution include a chosen readable local `.php` file outside the active theme directories. If relevant pre-conditions for both the server and the active theme are met, this can lead to RCE."
        attribution: "WordPress Security Team (GHSA-7hp8-65ch-5whp)"
        source_url: "https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-7hp8-65ch-5whp"
      - quote: "the vulnerable behavior is in WordPress Core, requires no account, and can be reached over the internet"
        attribution: "Wordfence Threat Intelligence"
        source_url: "https://www.wordfence.com/blog/2026/09/psa-critical-unauthenticated-path-traversal-vulnerability-patched-in-wordpress-core/"
    extended_notes: |
      Detection (telemetry-class first): web/app access-log analysis for the query-parameter pairing 'pagename' + 'page_id' arriving together at the site root or /index.php (Patchstack: this pairing "rarely appears together in ordinary traffic"), a 'pagename' value containing %2e%2e or %252e%252e (single or double URL-encoding), a 'pagename' value beginning with 'templates%2f' or another 'page-' directory name, and any request containing 'pearcmd', '+config-show' or '+config-create'. The two commoditised user agents (cve-2026-87902-poc/1.0, nuclei-cve-2026-87902/1.0) are a coarse but real signal; most traffic spoofs a normal browser UA so absence of these strings is not reassuring. Host-side: check /tmp and /var/tmp for unexpected .php files — presence means a stage-three write succeeded and the host must be treated as compromised, not merely probed. A 200 response returning OPML/RSS-feed content (wp-links-opml.php, wp-includes/feed-rss2.php) from what should be a normal page URL is the sign a stage-one probe worked and confirms a vulnerable window even without further action. Hardening: update to the branch-appropriate fixed release (7.1.2 down to 4.7.37 — every affected branch has a patched release, no forced major-version jump). Interim mitigation: reject traversal sequences (%2e%2e literal or encoded) in the 'pagename' parameter at the WAF/reverse-proxy layer (a legitimate page slug never contains one). Disabling register_argc_argv for web-facing PHP does not fix the underlying inclusion but breaks the pearcmd escalation path specifically, turning a code-execution primitive back into an information-disclosure-only bug — worth doing immediately on any host that cannot patch same-day. Triage/benign-lookalike: ordinary WordPress page requests never carry a 'pagename' value with encoded traversal syntax, and 'pagename' + 'page_id' co-occurring is itself anomalous, so the false-positive rate on these signatures should be very low.

  - title: "CVE-2026-28324 / CVE-2026-28325 — SolarWinds Observability Self-Hosted: two unauthenticated remote-code-execution flaws (integrity-check bypass CVSS 9.8, deserialization of untrusted data CVSS 8.8), patched same-day disclosure, no confirmed exploitation yet"
    sources:
