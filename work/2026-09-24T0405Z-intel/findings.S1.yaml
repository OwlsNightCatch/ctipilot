        attribution: "GBHackers"
        source_url: "https://gbhackers.com/solarwinds-observability-flaws/"
    extended_notes: |
      Detection: SolarWinds has not published attack signatures; given the deserialization flaw's likely tie to WPM player communication, prioritise reviewing which WPM players (main-polling-engine default, remote passive, remote active) are internet-reachable and monitor SolarWinds platform/service logs for unexpected inbound connections to WPM-player communication ports from unrecognised hosts, plus unexpected process spawns under the SolarWinds Platform service account following any such connection. Hardening: upgrade to 2026.2.3 via Settings > My Deployment; remove unnecessary internet exposure of SolarWinds management/communication services; audit for any deployment running "non-default and non-secure" communication settings (SolarWinds does not enumerate which settings qualify — treat any deviation from the vendor-recommended secure defaults, particularly around WPM player communication mode, as in scope); note that this upgrade also silently reconfigures passive WPM players to active mode and issues new passwords to remote passive players, which operators should account for in change-management. No workaround is documented short of patching.

  - title: "GitLab CI/CD regex parser CVE-2026-89078 (double free) / CVE-2026-93577 (integer overflow): authenticated crafted-regex-in-pipeline-config reaches server-side code execution (CVSS 9.9), part of a wider critical patch release"
    sources:
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/", publisher: "GitLab (official critical patch release notes)", date: "2026-09-23", role: "primary" }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-89078", publisher: "NVD (API JSON)", date: "2026-09-24", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, bridge `enisa-euvd recent criticals` → primary: GitLab's own critical-patch-release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/ → verified: NVD REST API"
    summary: |
      GitLab shipped a critical patch release (19.4.1, 19.3.3, 19.2.7) on 2026-09-23 fixing eight vulnerabilities, the two most severe of which are memory-corruption bugs in GitLab's regular-expression handling for CI/CD configuration: CVE-2026-89078, a double-free when parsing a specially crafted regular expression in a CI/CD configuration, and CVE-2026-93577, an integer overflow when compiling a specially crafted regular expression in the same context — both CVSS 3.1 9.9 (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H, scope changed), both reported by the same HackerOne researcher (joaxcar), and both requiring only low-privileged authenticated access (i.e., a user able to author or modify .gitlab-ci.yml, which default self-managed configurations often grant to any project Developer). GitLab's advisory withholds further technical detail under its standard 90-day disclosure embargo. No exploitation is reported; GitLab.com is already patched and GitLab Dedicated customers need no action, so exposure is limited to self-managed CE/EE instances (all versions from 19.2 before 19.2.7, 19.3 before 19.3.3, and 19.4 before 19.4.1) not yet upgraded. This is a distinct vulnerability class (regex-engine memory corruption) from the unauthenticated path-traversal/file-read CVE-2026-85706 chain this store already tracks from GitLab's 2026-09-10 release — same vendor, same week's cadence of hardening releases, different root cause.
