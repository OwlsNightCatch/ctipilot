      Detection: GitLab withholds the vulnerable code path until the 90-day embargo lifts, so no concrete telemetry hook is available yet; in the interim, monitor for unusual gitlab-rails/gitlab-ci-service worker process crashes or restarts correlated with CI/CD pipeline-config changes from low-privileged accounts, and audit which roles can create/modify .gitlab-ci.yml on self-managed instances (Developer role and above, by GitLab's default RBAC). Hardening: upgrade self-managed CE/EE to 19.4.1 / 19.3.3 / 19.2.7 immediately; restrict CI/CD configuration-authoring permission to trusted maintainers where feasible as defense in depth pending patching.

  - title: "Unauthenticated pre-auth enumeration of Entra ID users, registered MFA methods and admin accounts via Microsoft's own public Self-Service Password Reset (SSPR) portal — public tool (ResetSpy) released"
    sources:
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal", publisher: "LevelBlue (Trustwave) SpiderLabs", date: "2026-09-23", role: "primary" }
    discovery_trace: "first seen at: trustwave-spiderlabs, URL https://www.levelblue.com/blogs/spiderlabs-blog → primary: LevelBlue SpiderLabs post, URL https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal (no pivot needed — original research)"
    summary: |
      LevelBlue (Trustwave) SpiderLabs documents that Microsoft's public, unauthenticated Self-Service Password Reset (SSPR) portal at passwordreset.microsoftonline.com leaks tenant-account and MFA-registration information usable for reconnaissance against any Entra ID tenant that has SSPR enabled. Submitting an email address via the portal's ASP.NET UpdatePanel POST returns a "CurrentViewName" hidden field that discloses server-side state: "ViewMultigateUserControl" confirms the account exists and lists its registered second factors (via visible vs. display:none radio rows in the method-selection screen); named SSPR-policy-error views (ViewSsprNotEnabledInUserPolicy/SSPR_0011, ViewUserNotMemberOfScopedAccessGroup/SSPR_0013, etc.) also confirm the account exists even when SSPR itself is unavailable to it, because the server only reaches those policy checks after resolving the username in the directory — only a true "ViewUserIdentifierVerification" bounce means not-found. Because Microsoft enforces SSPR for administrator accounts regardless of tenant-wide policy, any account that reaches method-selection while the broader tenant has SSPR disabled for standard users is very likely a privileged role account, and its registered factors (SMS vs. authenticator app vs. alternate-email OTP) are visible too — letting an attacker pre-select privileged, weak-MFA targets before any credential attack. Microsoft removed the portal's visual CAPTCHA in August 2026, replacing it with backend throttling/behavioural abuse detection. The author released a public tool, ResetSpy (github.com/mlcsec/ResetSpy), that automates bulk enumeration with per-request UA rotation (16 realistic UA strings) and jitter to reduce fingerprinting, flagging accounts as PROTECTED / WEAK ONLY / NO METHODS. No CVE is assigned — this is abuse of a legitimate, publicly documented Microsoft feature, not a code vulnerability.
    region_nexus: "global; any organization using Microsoft Entra ID with SSPR enabled, including Swiss government bodies on Microsoft 365/Entra ID"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: ["T1589.002", "T1087.004"]
    affected_products: ["Microsoft Entra ID"]
    entity_keys: ["product:microsoft-entra-id"]
    new_entities:
      - { key: "tool:resetspy", type: tool, name: "ResetSpy", aliases: [], summary: "Public reconnaissance tool (github.com/mlcsec/ResetSpy) automating bulk unauthenticated enumeration of Entra ID account existence, registered MFA methods and likely-admin status via Microsoft's public SSPR portal, with UA rotation and jitter to reduce fingerprinting (LevelBlue SpiderLabs / Matthew Coady, 2026-09-23)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Importantly, every non-\"ViewUserIdentifierVerification\" response — including \"SSPR_0011\", \"SSPR_0013\", and the guest/federated not-available response — is confirmation that the account exists. The server only reaches those policy checks after successfully resolving the username in the directory."
        attribution: "LevelBlue SpiderLabs (Matthew Coady)"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"
      - quote: "Microsoft enforces SSPR for administrator accounts regardless of the tenant-wide SSPR policy. If an organization has disabled SSPR for standard users, standard accounts return \"ViewSsprNotEnabledInUserPolicy\" (SSPR_0011). Admin accounts bypass this check entirely and proceed to method enumeration regardless."
        attribution: "LevelBlue SpiderLabs (Matthew Coady)"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"
    extended_notes: |
      Detection (telemetry class first): Entra ID / Azure AD sign-in and self-service password-reset audit logs — specifically SSPR activity events with status "user is not member of the password reset users group" or other named SSPR error codes recurring across many distinct usernames from a single source in a short window, with no subsequent completed password reset. Volume/velocity anomalies (many SSPR lookups, few or no completions) are the discriminator from legitimate self-service use. Benign lookalike: a genuine user forgetting their password generates exactly one SSPR lookup that is normally followed by a completed reset — bulk lookups with no completions is the anomalous pattern, not the lookups alone. Hardening: scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population; remove alternate-email-OTP and security-question options from permitted SSPR methods, requiring authenticator-app or phone verification as the floor; enforce phishing-resistant MFA (FIDO2/certificate-based) specifically on privileged/admin roles, since Microsoft cannot let admin accounts opt out of SSPR exposure at the platform level — this is the one control that neutralises what the technique reveals about those accounts.

