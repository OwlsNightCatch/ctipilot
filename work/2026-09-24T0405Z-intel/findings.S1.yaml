notes_for_main_agent: |
  Process improvement (self-evolution): the NVD web page at nvd.nist.gov/vuln/detail/<CVE> is a JS-only Angular SPA that returns an empty shell to every direct-fetch transport tried this run (direct, trafilatura, jina reader all returned the same empty <app-root> shell). However, the NVD REST API at https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=<CVE> is reachable via a plain unauthenticated GET (verified this run for 5 CVEs, ~2s response time, no rate-limit issues at low volume) and returns the full structured CVE record (publication date, CVSS vectors, affected-version ranges, description) in JSON. This is a much better verification path than the SPA and should be added to tools/fetch_source.py as a documented recipe (e.g. `nvd cve <CVE-ID>`) so future research/verification sub-agents don't have to rediscover this — add a short delay (~1-2s) between calls if querying several CVEs to stay well under NVD's public rate limit.

  Two other IBM Security Bulletins surfaced via NCSC-NL's bundled advisory NCSC-2026-0392 (IBM MQ CVE-2026-10747, CVSS 10.0 heap overflow, published by IBM 2026-09-14; IBM Langflow OSS CVE-2026-79724/85025/81204 etc., published by IBM 2026-09-08) were investigated and DROPPED per the recency rule: both underlying IBM disclosures are more than a week old and NCSC-NL's 2026-09-23 advisory is purely a same-day bundling/republication with no fresh exploitation evidence — the reader already had every chance to see these when IBM first published. Flagging in case NCSC-NL's late bundling behaviour recurs and a future run needs the same judgment call.

  Adobe Connect (9 CVEs, CVE-2026-75682 CVSS 9.9 SQLi-to-RCE) and Adobe Experience Manager Forms JEE (6 CVEs, CVE-2026-75745 CVSS 9.8 unauthenticated RCE) both appeared fresh via NCSC-NL on 2026-09-23 (NCSC-2026-0391, NCSC-2026-0390) with no exploitation reported by Adobe. Time-boxed out of this run given the two items already included cover the highest-value new signal; worth a follow-up if AEM Forms shows exploitation activity, given AEM's history of real-world targeting against public-sector web-forms deployments.
