  - title: "The Gentlemen ransomware (Storm-2697 / RaaS): self-propagating Go encryptor with Curve25519/XChaCha20 per-file keys and simultaneous worm lateral movement — 478 claimed victims including EU sectors"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-05-28"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog feed (threat-intelligence topic), title: The Gentlemen ransomware: Dissecting a self-propagating Go encryptor, 2026-05-28 → primary (no pivot needed): Microsoft Threat Intelligence blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/ → corroborating: THN article 2026-06-11 reporting 478 victims, URL https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
    summary: |
      Microsoft Threat Intelligence published a full technical dissection of The Gentlemen ransomware, a Go-based RaaS operated by Storm-2697 with affiliates including initial-access brokers recruited via BreachForums. The encryptor uses per-file ephemeral Curve25519 key pairs with XChaCha20 stream cipher (64 KB chunks, per-chunk nonce XOR'd by chunk index); decryption requires the operator's Curve25519 private key combined with the ephemeral public key appended to each encrypted file after a `--eph--` marker. The self-propagation module (`--spread` argument, accepting explicit domain/user:password or current-session token) turns the single-host encryptor into a network-propagating worm simultaneously using network shares, scheduled tasks, remote process execution, and credential-based lateral movement — all coordinated per reachable target. The `--full` mode spawns two child processes: one as SYSTEM via a scheduled task named `gentlemen_system` (encrypting local drives) and one as current user for UNC network shares (`--shares`). Defense evasion: Garble obfuscation, disables Windows Defender real-time monitoring, enables SMBv1, modifies registry for anonymous share access, and sets LOCKER_BACKGROUND=1 env var to distinguish background worker from initial invocation. Persistence via two scheduled tasks (`UpdateSystem`, `UpdateUser`) and Run registry keys. As of June 11 the ransomware has claimed 478 victims across education, transportation, healthcare, and financial industries in Europe, North America, South America, Africa, and Asia. MITRE ATT&CK: T1486 (Data Encrypted for Impact), T1021.002 (SMB/Windows Admin Shares), T1053.005 (Scheduled Task), T1562.001 (Disable Security Tools), T1543 (Create or Modify System Process). Detection: Sysmon EID 1 for child processes spawning with `--spread`, `--full`, `--system` args from unusual parent; EID 11 for bulk file creation with non-standard extensions; scheduled task creation named `gentlemen_system`/`UpdateSystem`/`UpdateUser`; registry Run key modifications; volume shadow copy deletion (`vssadmin delete`).
    ch_eu_nexus: "direct — European victims confirmed across education, healthcare, transport; matches sectors heavily present in Swiss and EU public-sector environments"
    public_sector_nexus: "direct — education and healthcare named as impacted sectors"
    sector: "education, healthcare, transportation, finance"
    cves: []
    actors_campaigns_malware: ["Storm-2697", "The Gentlemen ransomware"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Microsoft Threat Intelligence tracks the operators behind the ransomware as Storm-2697, a financially motivated threat actor that manages the RaaS platform known as 'The Gentlemen' while affiliates carry out attacks."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
      - quote: "When enabled with the --spread argument, it turns the malware from a single-host encryptor into a self-propagating worm that attempts to deploy its encryptor to every reachable system on the network."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
    extended_notes: |
      The in-window novelty hook is not the May 28 Microsoft publication (which shipped before the 36h window) but the June 11 THN report confirming 478 victims claimed via the leak site, and the DFIR Report Flash Alert from May 11 documenting full intrusion chains (EtherRAT → TukTuk C2 → Gentlemen). The Microsoft blog's technical depth is the primary research value. THN 2026-06-11 is the in-window corroborating escalation. The 478-victim count and BreachForums recruiting make this a developing story worth flagging as an escalating threat to EU sectors.

  - title: "GreatXML: unpatched Windows BitLocker bypass via Defender offline-scan XML files — public PoC, no CVE, no patch"
    sources:
      - url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
        publisher: "SecurityWeek"
        date: "2026-06-11"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/new-greatxml-exploit-bypasses-windows.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), title: New GreatXML Exploit Bypasses Windows BitLocker via Recovery Partition XML Files, 2026-06-11 → primary: SecurityWeek article, URL https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/ → corroborating: THN article same date"
    summary: |
      Researcher Nightmare Eclipse (also known as Chaotic Eclipse / MSNightmare) released a public proof-of-concept named GreatXML on June 11, 2026 — one day after releasing RoguePlanet (a separate Microsoft Defender LPE to SYSTEM, covered in the 2026-06-11 daily). GreatXML exploits a vulnerability in Microsoft Defender's offline scan functionality to bypass BitLocker and gain a SYSTEM-privilege command shell in Windows Recovery Environment (WinRE). The attack vector: copying two XML files (`unattend.xml` at the recovery partition root and `Recovery/WindowsRE/ReAgent.xml`) to the recovery partition, then rebooting into WinRE by holding Shift + Restart. The precondition is that Defender offline scanning has been initiated at least once on the target — which is a default user action triggered by Microsoft's own threat remediation guidance. If offline scan was never run, an attacker with code execution access can trivially trigger it. No CVE has been assigned and no patch exists as of disclosure. This follows a pattern: Nightmare Eclipse has released a series of Windows zero-days (BlueHammer, RedSun, UnDefend, GreenPlasma, YellowKey/CVE-2026-45585 — the last batch patched in June Patch Tuesday) after public disagreements with Microsoft over researcher treatment in its disclosure programmes. The attack requires write access to the recovery partition, achievable via any local code execution or brief physical access. MITRE ATT&CK: T1542.001 (Pre-OS Boot: System Firmware), T1543 (Create or Modify System Process). Detection: monitor recovery partition writes for `unattend.xml` or modifications to `ReAgent.xml`; WinRE invocations from the Shift+Restart path in Windows event logs; EDR alerts for unusual XML parser spawning WinRE bootstrap processes.
    ch_eu_nexus: "global — affects all Windows endpoints with Defender offline scan previously initiated; directly relevant to Swiss/EU organisations running Defender as primary AV"
    public_sector_nexus: "indirect — no direct public-sector targeting but Windows/Defender ubiquitous in CH/EU public-sector endpoints"
    sector: "all sectors — Windows endpoint"
    cves: []
    actors_campaigns_malware: ["Nightmare Eclipse", "GreatXML", "RoguePlanet"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Named GreatXML, the fresh exploit allows users to bypass BitLocker and spawn a command prompt with SYSTEM privileges while in Recovery Mode. The PoC exploit includes an XML file and a Recovery folder (containing another XML) that need to be copied to the root of the computer's recovery partition."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
      - quote: "Any Windows machine becomes vulnerable to GreatXML as soon as Defender's offline scanning is initiated."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"

  - title: "npm v12 security breaking changes: install scripts and non-registry sources require explicit opt-in — direct response to Shai-Hulud/TeamPCP supply-chain wave"
    sources:
      - url: "https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/"
        publisher: "GitHub Changelog"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/github-announces-npm-security-changes-to-tackle-supply-chain-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), title: GitHub to Disable npm Install Scripts by Default to Stop Supply Chain Attacks, 2026-06-11 → pivot: GitHub Changelog primary source, URL https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/ → corroborating: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/github-announces-npm-security-changes-to-tackle-supply-chain-attacks/"
    summary: |
      GitHub announced on June 9 that npm v12 (expected July 2026) will disable dependency install scripts (`preinstall`, `install`, `postinstall`, including native `node-gyp` builds triggered by a `binding.gyp` file without explicit script declaration) by default. This is the most operationally significant npm security change in the package manager's history and is a direct structural response to the Shai-Hulud/TeamPCP/Miasma/IronWorm supply-chain wave that has dominated the threat landscape since late May 2026. Additional breaking changes: Git dependencies require `--allow-git`; remote URL packages require `--allow-remote`. Upgrade path: organisations should move to npm 11.16.0 now, run `npm install` to see deprecation warnings, and use `npm approve-scripts --allow-scripts-pending` to enumerate and selectively approve scripts in their dependency trees. The change aligns npm with Yarn, pnpm, and Bun, all of which block install scripts by default. Defender takeaway: prior to npm v12 shipping, audit `package.json` dependency trees for packages with install scripts and review them now; restrict `npm install` in CI/CD pipelines; use Sigstore/provenance for npm packages in GitHub Actions workflows.
    ch_eu_nexus: "global — npm is ubiquitous in Swiss/EU software development, public-sector DevOps pipelines, and SaaS products; supply-chain exposure directly relevant to CH/EU defenders running Node.js build infrastructure"
    public_sector_nexus: "indirect — affects development and CI/CD pipelines; public-sector software development and procurement"
    sector: "technology, software supply chain, all sectors using Node.js"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Shai-Hulud", "IronWorm", "Miasma"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Our next npm major version, v12, introduces security-related default changes to npm install. All these changes are available behind warnings in npm today on 11.16.0 or newer, so you can prepare your projects now."
        attribution: "GitHub Changelog"
        source_url: "https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/"
      - quote: "GitHub has announced that npm v12, expected next month, will introduce several security-focused changes aimed at blocking supply-chain attacks abusing behaviors triggered by the 'npm install' command."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/github-announces-npm-security-changes-to-tackle-supply-chain-attacks/"

  - title: "OpenClaw AI agent indirect prompt injection via message objects (Imperva) and agent phishing via email channels (Varonis) — both patched in v2026.4.23, broader agentic-AI attack class"
    sources:
      - url: "https://www.imperva.com/blog/compromise-openclaw-with-prompt-injections-in-message-objects/"
        publisher: "Imperva Threat Research"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.varonis.com/blog/openclaw-phishing"
        publisher: "Varonis"
        date: "2026-06-09"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/new-attacks-trick-openclaw-ai-agent.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), title: New Attacks Trick OpenClaw AI Agent Into Running Code and Leaking Secrets, 2026-06-11 → pivot: Imperva primary research, URL https://www.imperva.com/blog/compromise-openclaw-with-prompt-injections-in-message-objects/ → pivot: Varonis primary research, URL https://www.varonis.com/blog/openclaw-phishing → corroborating: THN"
    summary: |
      Two independent research teams published coordinated findings on indirect prompt injection and agent phishing against OpenClaw, the popular self-hosted AI agent platform that integrates with messaging systems (WhatsApp, Telegram, Slack), file systems, APIs, and external services. Imperva (Yohann Sillam, June 10) demonstrated that shared contact names, vCard fields, and location pins pass directly into the LLM prompt without any untrusted-content boundary — a vector distinct from well-trained web-content injection. A crafted contact with 65 whitespace characters padding followed by a `python3 setup.py` execution command was invisible to the victim in the OpenClaw UI (name truncated) but executed successfully when the victim shared the contact with their agent. Varonis (Itay Yashar, June 9) demonstrated "agent phishing" — a plain email from a plausible sender asking the agent to forward AWS IAM keys and SSH credentials to an external address — exploiting the agent's lack of sender-identity verification before acting. Both teams confirmed that OpenClaw's default Memory persistence means a single successful injection can persist instructions across sessions. Fix shipped in OpenClaw v2026.4.23 (moves contact names, vCard fields, and location labels out of the inline prompt body into a separate untrusted-metadata channel). The broader detection problem: prompt injection is structurally unsolved; unlike tool integrations (where MCP provides a trust boundary), no standard governs how messaging objects are serialised before reaching an LLM, and enterprises deploying AI agents inside email and messaging infrastructure are systematically exposed to this class. MITRE ATT&CK: T1566.004 (Spearphishing via Service — agentic channel), T1059 (Command and Scripting Interpreter via agent execution). Defender guidance: pin OpenClaw to v2026.4.23 or later; audit which AI agents have mailbox access with send permissions; treat agent-executed actions as a new category of privileged operation requiring approval workflows.
    ch_eu_nexus: "global — OpenClaw widely deployed in EU organisations; agentic-AI deployment is accelerating across Swiss/EU public and private sector; identity and data-exfiltration risk directly applicable"
    public_sector_nexus: "indirect — relevant to any organisation deploying AI agents with access to sensitive data or communication channels"
    sector: "technology, AI/ML platform, all sectors"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "In each case, the injected instruction was invisible to the victim, crossed the trust boundary into the authenticated user context, and triggered execution of attacker-controlled code. Combined with OpenClaw's default memory persistence, a single piece of viral content could silently compromise environments if not properly sandboxed."
        attribution: "Imperva Threat Research"
        source_url: "https://www.imperva.com/blog/compromise-openclaw-with-prompt-injections-in-message-objects/"
      - quote: "We built a test agent on the platform, gave it a mailbox full of synthetic business data, and watched a single plain email talk it into forwarding mock AWS keys and a fake customer export to an outside address."
        attribution: "Varonis"
        source_url: "https://www.varonis.com/blog/openclaw-phishing"

  - title: "OceanLotus / APT32 domestic espionage pivot: SPECTRALVIPER backdoor via FireAnt MetaKit supply-chain compromise targeting Vietnamese stock investors and construction firm (ESET)"
    sources:
      - url: "https://www.welivesecurity.com/en/eset-research/oceanlotus-external-espionage-domestic-targeting/"
        publisher: "ESET Research (WeLiveSecurity)"
        date: "2026-06-11"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/oceanlotus-hits-vietnam-investors-with.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), title: OceanLotus Hits Vietnam Investors With SPECTRALVIPER in FireAnt Attack, 2026-06-11 → primary: ESET Research / WeLiveSecurity, URL https://www.welivesecurity.com/en/eset-research/oceanlotus-external-espionage-domestic-targeting/ → corroborating: THN"
    summary: |
      ESET Research published a detailed analysis on June 11, 2026 tracking OceanLotus (APT32, Vietnam-aligned) campaigns from mid-2024 through early 2026. Two distinct SPECTRALVIPER-delivered intrusions are documented. Campaign 1 (mid-2024 to February 2026): a prolonged espionage operation against a Vietnamese infrastructure and transport construction corporation, likely via RCE exploitation of a public-facing Microsoft SQL Server. Campaign 2 (October 2025 to March 2026): a software supply-chain attack compromising the update server of FireAnt MetaKit, a Vietnamese stock investment platform. The update configuration file (`http://metakit.fireant.vn/Software/version.xml`) lacked any integrity validation and used unencrypted HTTP, making update files trivially replaceable. OceanLotus replaced the legitimate `Metakit.exe` update binary with a malicious downloader that performed host reconnaissance and staged SPECTRALVIPER delivery selectively (only a small subset of exposed investors received the backdoor), indicating investigative targeting rather than mass compromise. ESET made multiple disclosure attempts to FireAnt with no response. SPECTRALVIPER is a modular backdoor with process hollowing and COM hijacking capability. The strategic shift is assessed by ESET as linked to Vietnam's ongoing securities market reform investigations and domestic anti-corruption efforts. MITRE ATT&CK: T1195.002 (Compromise Software Supply Chain), T1190 (Exploit Public-Facing Application — SQL Server), T1055.012 (Process Hollowing — SPECTRALVIPER), T1546.015 (COM Object Hijacking). Defender relevance: any organisation deploying Vietnamese software with auto-update mechanisms over unencrypted HTTP is at risk from this class of attack; the pattern (unsigned update over HTTP, no version.xml integrity check) is common across regional software vendors globally.
    ch_eu_nexus: "indirect — OceanLotus primarily targets Asia-Pacific; the supply-chain attack method (update server compromise, no integrity check, HTTP delivery) is applicable globally and relevant to Swiss/EU software supply-chain risk assessments"
    public_sector_nexus: "indirect — espionage targeting infrastructure corporations; selective victim delivery suggests intelligence gathering rather than broad disruption"
    sector: "finance (stock investment), infrastructure, construction"
    cves: []
    actors_campaigns_malware: ["OceanLotus", "APT32", "SPECTRALVIPER"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "From October 2025 to March 2026, OceanLotus carried out a supply-chain attack leveraging FireAnt Metakit, a software platform widely used by stock investors in Vietnam... the update configuration file at http://metakit.fireant.vn/Software/version.xml lacks any integrity validation mechanism."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/oceanlotus-external-espionage-domestic-targeting/"

