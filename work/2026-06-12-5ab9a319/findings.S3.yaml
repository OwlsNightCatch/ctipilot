        role: "corroborating"
    discovery_trace: "first seen at: mandiant-gtig feed (feeds.feedburner.com/threatintelligence/pvexyqv7v0v), title: ShinyHunters Targets Education Sector with Oracle PeopleSoft Exploit, 2026-06-11 → primary: Google/Mandiant GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/ → pivot: Oracle PSIRT advisory, URL https://www.oracle.com/security-alerts/alert-cve-2026-35273.html → corroborating: SecurityWeek, HelpNetSecurity, BleepingComputer"
    summary: |
      CVE-2026-35273 (CVSS 9.8) is an unauthenticated remote code execution vulnerability in the Environment Management component of Oracle PeopleSoft Enterprise PeopleTools, reachable over HTTP with no authentication and no user interaction required. The attack surface is the Environment Management Hub (PSEMHUB) endpoint exposed by PeopleSoft installations. Mandiant and Google GTIG (UNC6240, attributed to ShinyHunters) observed active exploitation between May 27 and June 9, 2026 — well before Oracle's out-of-band advisory shipped on June 10, making the entire campaign a zero-day window. Mandiant notified more than 100 organisations whose IP addresses correlated with potentially vulnerable PSEMHUB endpoints; 68% operated in higher education, mostly in the United States, though European institutions also use PeopleSoft extensively for student information and HR systems. Post-exploitation tradecraft includes a lateral movement script (victim_fanout.sh) that sprays SSH credentials against internal hosts harvested from /etc/hosts, drops a README-IF-YOU-SEE-THIS-YOUVE-BEEN-HACKED.TXT marker in PeopleSoft directories, and stages a 40 GB+ data exfiltration. Confirmed victim disclosures include the University of Nottingham (personal data of hundreds of thousands of students). Oracle shipped an out-of-band patch on June 10; organisations should apply immediately. Detection: web-server access logs for anomalous HTTP POST/GET to PSEMHUB paths; lateral movement in auth logs for SSH spray from the PeopleSoft application server. All PeopleSoft deployments lacking network controls on PSEMHUB are at risk.
    ch_eu_nexus: "direct — PeopleSoft is deployed across European universities, cantonal administrations, and HR systems; PSEMHUB often internet-facing; European victims plausible given breadth of Mandiant notification"
    public_sector_nexus: "direct — higher education (68% of targeted orgs); broader public-sector HCM/ERP deployments"
    sector: "education, public-sector, finance, HR"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["UNC6240", "ShinyHunters"]
    verification: MULTI-SOURCE
