    summary: |
      CVE-2026-26142 is a Critical (CVSS 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N) unauthenticated remote code execution
      vulnerability in Nuance PowerScribe — a radiology reporting and workflow platform widely deployed in hospital
      imaging departments. The root cause is CWE-502 (Deserialization of Untrusted Data): the application deserialises
      attacker-controlled input without proper validation, enabling code execution over the network without
      authentication or user interaction. Microsoft rates exploitation as "Less Likely" and no in-the-wild
      exploitation has been reported. Patch available via June 2026 Patch Tuesday (2026-06-09). Technique class:
      T1190 (Exploit Public-Facing Application), with the specific sink being the deserialization handler.
      Healthcare sector relevance is high — radiology departments integrating PowerScribe with PACS/RIS infrastructure
      may have the service exposed on internal clinical networks. Detection: monitor for unexpected processes spawned
      by the PowerScribe application server; review IIS / application server logs for unusual deserialization
      requests; EDR telemetry for child processes of PowerScribe worker processes. Hardening: apply June 2026
      cumulative update; restrict network access to PowerScribe ports to known clinical-network subnets; consider
      WAF rules blocking known Java/C# deserialization gadget payloads on the relevant API endpoints.
    ch_eu_nexus: "direct; Nuance PowerScribe is used in Swiss university hospitals and EU healthcare systems for radiology reporting; unauthenticated RCE in a clinical application is high priority"
