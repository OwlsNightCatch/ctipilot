    summary: |
      CVE-2026-45657 is a Critical (CVSS 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N) Windows Kernel remote code execution
      vulnerability triggered via specially crafted network traffic. The root cause is CWE-416 (Use After Free) with
      an additional CWE-122 (Heap-based Buffer Overflow) component, located in the Windows kernel's TCP/IP data
      processing path. Microsoft's FAQ states an attacker sends specially crafted network packets that trigger a flaw
      in how the kernel processes certain TCP/IP data, potentially allowing code execution with SYSTEM-level
      privileges without authentication or user interaction. Microsoft rates exploitation as "Less Likely"; no
      in-the-wild exploitation reported as of patch release. Patch available via June 2026 Patch Tuesday (2026-06-09).
      Technique class: T1190 (Exploit Public-Facing Application — network-reachable kernel path), T1068
      (Exploitation for Privilege Escalation — SYSTEM-level outcome). Detection: no direct kernel UAF telemetry in
      standard logging; rely on EDR kernel-level exploit detection for heap-spray / UAF patterns in tcpip.sys;
      network monitoring for anomalous TCP/IP packet crafting patterns from unexpected source addresses. Hardening:
      apply June 2026 cumulative update immediately; perimeter firewall rules restricting direct exposure of Windows
      hosts' raw TCP/IP stack to untrusted networks; consider Windows Defender Exploit Guard memory protections.
    ch_eu_nexus: "direct; any network-exposed Windows host (servers, workstations) in Swiss/EU public-sector environments is potentially in scope; unauthenticated network-exploitable kernel RCE is an immediate patching priority"
