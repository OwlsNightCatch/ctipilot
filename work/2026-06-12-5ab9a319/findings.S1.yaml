        attribution: "CISA BOD 26-04"
        source_url: "https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"
      - quote: "This Directive evolves upon CISA's KEV catalog and increases mission readiness across the federal government by efficiently prioritizing high-risk vulnerabilities for timely action, while deferring action against low-risk vulnerabilities."
        attribution: "CISA BOD 26-04"
        source_url: "https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"
    extended_notes: |
      The directive is significant beyond US government: it signals that the "treat all KEV entries equally" model
      is being replaced by risk-tiered triage. EU defenders using BOD 22-01 KEV additions as a uniform trigger
      for patching SLAs should evaluate whether a tiered approach better fits their risk posture, especially for
      on-premises legacy systems where flat 14-day KEV patching can create operational disruption.

