    discovery_trace: "first seen at: cisa-directives bridge URL https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk → primary: CISA BOD page URL https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk → corroborating announcement URL https://www.cisa.gov/news-events/news/patch-smarter-not-harder"
    summary: |
      CISA issued Binding Operational Directive 26-04 (BOD 26-04) on June 10, 2026, superseding and revoking both
      BOD 19-02 (Vulnerability Remediation Requirements for Internet-Accessible Systems, April 2019) and BOD 22-01
      (Reducing the Significant Risk of Known Exploited Vulnerabilities, November 2021). The directive is binding
      on all US Federal Civilian Executive Branch (FCEB) agencies. Key operational change: rather than a flat
      "patch all KEV entries within 14 days" rule from BOD 22-01, BOD 26-04 introduces risk-tiered remediation
      timelines based on CVSS severity, exploitation status (KEV listing), and whether assets are internet-accessible.
      Phase I requirements are effective immediately: agencies must establish KEV remediation processes, ensure
      all assets (including RFC 1918 / RFC 4193 addresses) are in the CDM Federal Dashboard, and report compliance
      to CISA. Within 60 days CISA will publish machine-level asset-tagging data-schema requirements. Vulnrichment
      CVE metadata integration is explicitly called out. For Swiss and EU public-sector readers, BOD 26-04 is not
      directly binding but sets a best-practice benchmark for risk-prioritised vulnerability management that aligns
      with the EU NIS2 Directive's vulnerability handling obligations (Art. 21). Swiss NCSC's own guidance on
      vulnerability management is likely to track a similar tiered approach. Technique class (defender framing):
      this directive defines the US government's operational patch-prioritisation model — the tiered timelines table
      is a reference framework European public-sector defenders can adapt for their own patch governance.
    ch_eu_nexus: "indirect; US federal directive but sets benchmark for EU NIS2 Art. 21 vulnerability management; Swiss federal agencies and EU public bodies may align their own SLAs to similar tier structures"
    public_sector_nexus: "direct (US federal, benchmark relevance for EU)"
    sector: "public sector, all"
