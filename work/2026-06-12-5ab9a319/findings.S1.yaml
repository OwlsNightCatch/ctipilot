  - title: "MariaDB CVE-2026-49261 CVSS 10.0: Galera cluster wsrep_notify_cmd OS command injection via shell-metacharacter injection"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-11"
        role: "primary"
      - url: "https://securityonline.info/mariadb-security-flaw-cvss-10/"
        publisher: "SecurityOnline"
        date: "2026-06-07"
        role: "corroborating"
      - url: "https://mariadb.com/docs/server/security/cve/community-server"
        publisher: "MariaDB Docs"
        date: "2026-06-07"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12627 (bridge ncsc-csh post 12627) → corroborated at securityonline.info URL https://securityonline.info/mariadb-security-flaw-cvss-10/ → vendor docs URL https://mariadb.com/docs/server/security/cve/community-server"
    summary: |
      CVE-2026-49261 is a CVSS 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) OS command injection in MariaDB Server
      when configured as part of a Galera cluster with wsrep_notify_cmd enabled. The vulnerable code path builds the
      notification-command shell string by directly interpolating the wsrep_node_name and incoming-address fields
      supplied by cluster peers — without sanitising shell metacharacters. A malicious or compromised cluster member
      that announces a node name containing metacharacters can therefore cause arbitrary OS commands to execute on
      every cluster member that has the notification command configured, with the privileges of the MariaDB process
      (typically the mysql or mariadb OS user). Exploitation is unauthenticated from the Galera replication network
      perspective but requires membership in the Galera cluster or the ability to inject Galera protocol messages on
      the replication port (default TCP 4567). NCSC-CH rates exploitation status as UNKNOWN; no public PoC is
      referenced. Vendor patches released for all active branches. JIRA ticket MDEV-39721 provides the code-level
      detail. Affected: Community < 11.8.8 / 11.4.12 / 10.11.18 / 10.6.27; Enterprise < 11.8.6-4 / 11.4.10-8 /
      10.6.25-22. Technique class: T1059 (Command and Scripting Interpreter — OS shell invocation via injection into
      wsrep_notify_cmd). Detection: look for unexpected child processes spawned by the mariadbd / mysqld parent;
      audit wsrep_notify_cmd value in my.cnf; alert on network connections from unexpected Galera peers on TCP 4567.
      Hardening: patch immediately; if Galera is not in use disable wsrep_on; enforce firewall rules limiting TCP 4567
      to known cluster peers only.
    ch_eu_nexus: "direct; MariaDB is widely deployed in Swiss and EU public-sector database tiers, particularly as the MySQL-compatible backend for LAMP stacks and SaaS platforms"
    public_sector_nexus: "direct"
    sector: "all, database infrastructure"
    cves: [CVE-2026-49261]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "MariaDB Server, when running as part of a Galera cluster with a notification command configured (wsrep_notify_cmd), builds that command by inserting the cluster members' node names and addresses directly into a string that is then executed by the system shell, without validating or escaping them."
        attribution: "NCSC-CH Security Hub (post 12627)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
      - quote: "CVE-2026-49261 CVSS3.1: 10.0 (CRITICAL) — MariaDB Community Server (Versions < (11.8.8, 11.4.12, 10.11.18, 10.6.27) are vulnerable)"
        attribution: "NCSC-CH Security Hub (post 12627)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
    extended_notes: |
      The JIRA ticket MDEV-39721 is public and describes the code path in detail. Defenders should query their
      asset inventories for any MariaDB instances running with wsrep_on=ON and wsrep_notify_cmd set, as these are
      the exact conditions needed for exploitation. Enterprise environments may have auto-failover scripts that set
      wsrep_notify_cmd to a shell script path — all such instances are vulnerable until patched.

  - title: "GreatXML zero-day: Nightmare Eclipse BitLocker bypass via WinRE unattend.xml, PoC public, no patch"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
        publisher: "SecurityWeek"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12622 (bridge ncsc-csh post 12622) → corroborated at securityweek.com URL https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
    summary: |
      Security researcher Nightmare Eclipse (previously responsible for the April–May zero-day series BlueHammer,
      RedSun, UnDefend, YellowKey, GreenPlasma, and RoguePlanet) published a new Windows BitLocker bypass on June
      11, 2026, dubbed GreatXML. The exploit targets the Windows Recovery Environment (WinRE) partition — specifically
      the unattend.xml file used during the recovery/repair boot sequence. When WinRE is invoked (e.g. via repeated
      failed boots or manual "Repair this PC"), the exploit causes a command prompt with SYSTEM-level privileges to
      spawn, fully bypassing BitLocker's drive encryption without requiring the BitLocker recovery key. The
      prerequisite is physical access or the ability to trigger a recovery boot (e.g. an admin account that can
      initiate repair). PoC is hosted at https://github.com/MSNightmare/GreatXML (note: this URL is a public
      GitHub repository). No CVE assigned and no Microsoft patch available as of June 11 2026. This is distinct from
      RoguePlanet (Defender TOCTOU privilege escalation — already covered in the June 10 brief). Technique class:
      T1542.001 (Pre-OS Boot: System Firmware / Recovery Environment abuse) or T1006 (Direct Volume Access via WinRE
      boot path). Detection: monitor for processes spawned from the WinRE environment outside of legitimate recovery
      sessions; audit WinRE partition for unauthorised unattend.xml modifications via `reagentc /info` and
      integrity tooling. Hardening: until patched, consider disabling WinRE on high-value targets (`reagentc /disable`
      — tradeoff: lose OS recovery capability); restrict physical access to assets with sensitive BitLocker-protected
      volumes; ensure Secure Boot is enforced and BIOS is password-protected.
    ch_eu_nexus: "direct; Windows endpoints with BitLocker are standard in Swiss and EU public-sector endpoint configurations; physical-access exploitation is relevant to laptop/workstation fleet security"
    public_sector_nexus: "direct"
    sector: "all, endpoint security"
    cves: []
    actors_campaigns_malware: ["Nightmare Eclipse (researcher)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Security researcher Nightmare Eclipse has released a new Windows BitLocker bypass. Named GreatXML, the exploit allows users to bypass BitLocker and spawn a command prompt with SYSTEM privileges while in Recovery Mode."
        attribution: "NCSC-CH Security Hub (post 12622)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
      - quote: "Current exploitation status: Proof of Concept Available, no patch available"
        attribution: "NCSC-CH Security Hub (post 12622)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
    extended_notes: |
      This is part of an ongoing series of zero-days from the same researcher; NCSC-CH has been tracking them since
      April 2026 (see post 12508 for BlueHammer/RedSun/UnDefend and post 12574 for YellowKey/GreenPlasma). Two from
      this series (YellowKey CVE-2026-45585 and GreenPlasma CVE-2026-50507) received patches in the June 2026 Patch
      Tuesday (June 9). RoguePlanet (Defender TOCTOU) and GreatXML (BitLocker/WinRE) remain unpatched. The researcher
      hosts PoCs at git.churchofmalware.org/Nightmare_Eclipse/ following a GitHub ban.

  - title: "The Gentlemen ransomware (Storm-2697): Go-based self-propagating worm expands to 478 victims across 66 countries"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
        publisher: "KrebsOnSecurity"
        date: "2026-06-10"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
        publisher: "Microsoft Security Blog"
        date: "2026-05-28"
        role: "background"
      - url: "https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"
        publisher: "Check Point Research"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: krebs RSS feed URL https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/ → corroborated at THN URL https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html → background: Microsoft Security Blog URL https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/ → additional corroboration: Check Point Research URL https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"
    summary: |
      The Gentlemen is a ransomware-as-a-service group tracked by Microsoft as Storm-2697, operating a Go-language
      encryptor that self-propagates via a --spread argument invoking SMB lateral movement and credential harvesting.
      The RaaS model offers affiliates a 90/10 split (affiliate keeps 90%). As of June 10–11 2026, the group claims
      478 victims across 66 countries, including victims in Germany — making it directly relevant to EU/DACH
      defenders. Microsoft's May 28 technical blog identified the worm's Go binary structure, the --spread command
      line argument driving lateral movement via SMB shares and scheduled-task deployment, and its use of
      Windows API calls for encryption. Krebs (June 10) identified the group's operational infrastructure and
      principal operator identity. Check Point Research (June 9) published additional technical analysis. The
      group is assessed as operating from a jurisdiction with limited law-enforcement cooperation. Technique class:
      T1486 (Data Encrypted for Impact), T1570 (Lateral Tool Transfer via SMB), T1053.005 (Scheduled Task — used for
      persistence and lateral execution), T1078 (Valid Accounts — credential harvesting prior to spread).
      Detection: parent-process chains where a binary named with random-looking strings spawns cmd.exe or
      powershell.exe with --spread-related arguments; lateral SMB connections originating from non-standard
      processes; scheduled tasks created by non-admin processes on remote hosts (Event ID 4698); EDR telemetry
      for Go-compiled binary heuristics (large statically linked EXEs, Goroutine stack patterns). Hardening:
      SMB signing enforcement (GPO: Microsoft network server: Digitally sign communications always), restrict
      SMB lateral movement via Windows Defender Firewall rules, ensure LAPS/PAM for credential hygiene to
      limit credential-harvesting success.
    ch_eu_nexus: "direct; German victims confirmed; EU-wide RaaS campaign with 66-country spread; Swiss and EU public-sector organisations at risk"
    public_sector_nexus: "indirect (general enterprise/public sector targeting)"
    sector: "all sectors"
    cves: []
    actors_campaigns_malware: ["Storm-2697", "The Gentlemen (ransomware)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Who Runs the Ransomware Group The Gentlemen — Microsoft tracks the group as Storm-2697"
        attribution: "KrebsOnSecurity"
        source_url: "https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
      - quote: "The Gentlemen Ransomware Claims 478 Victims Across 66 Countries"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
    extended_notes: |
      The --spread argument is the key worm mechanism — defenders hunting for lateral movement should look for
      the parent process (the Gentlemen encryptor) spawning net.exe, cmd.exe or PowerShell with SMB-related
      arguments, or creating scheduled tasks on remote shares. The Go binary structure means standard AV
      signatures for PE-format malware may be less effective; EDR behavioural detections are primary.
      The 90/10 affiliate model is unusually affiliate-favourable and likely driving rapid expansion.

