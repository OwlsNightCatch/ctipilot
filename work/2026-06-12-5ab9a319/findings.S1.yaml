    summary: |
      CVE-2026-47643 is a CVSS 9.8 (AV:N/AC:L/PR:N/UI:N) remote code execution vulnerability in Azure Stack Edge —
      Microsoft's hybrid cloud appliance for on-premises edge compute. The root cause is CWE-73 (External Control of
      File Name or Path): a file upload endpoint does not restrict the attacker-controlled file name/path parameter,
      allowing an unauthenticated attacker to write files outside the intended directory (path traversal). Writing to
      certain paths achieves code execution on the appliance. Microsoft rates exploitation as "Unlikely" and no
      in-the-wild exploitation is reported. Patch available via June 2026 Patch Tuesday (2026-06-09); customer
      action required to apply the update. Technique class: T1190 (Exploit Public-Facing Application), T1505.003
      (Server Software Component: Web Shell — file write to webroot or equivalent enabling code execution).
      Azure Stack Edge is used in Swiss and EU public-sector edge/OT deployments (e.g. factory floor, government
      data centres). Detection: monitor Azure Stack Edge management interface access logs for unexpected file upload
      requests; look for files created outside designated upload directories; review EDR telemetry on the appliance's
      OS layer for unexpected process spawning from the web management service. Hardening: apply the June 2026
      update; restrict Azure Stack Edge management interface to trusted admin networks via firewall; if the management
      port is Internet-exposed, apply URL-based access restrictions immediately.
    ch_eu_nexus: "direct; Azure Stack Edge is deployed in Swiss and EU public-sector edge-compute and OT integration scenarios; unauthenticated file-write-to-RCE on a hybrid cloud appliance is high priority"
    public_sector_nexus: "direct"
