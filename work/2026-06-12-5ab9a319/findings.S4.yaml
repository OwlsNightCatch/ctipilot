  - title: "The Gentlemen ransomware operator identified as Izhevsk-based Russian national Alexander Yapaev (aka Hastalamuerte / Zeta88) — Krebs + PRODAFT attribution; 332 victims since mid-2025"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
        publisher: "Krebs on Security"
        date: "2026-06-10"
        role: "primary"
    discovery_trace: "first seen at: krebs RSS feed, URL https://krebsonsecurity.com/feed/ → primary: Krebs Breadcrumbs article, URL https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
    summary: |
      On 10 June 2026, Krebs on Security published a Breadcrumbs attribution analysis identifying the suspected administrator
      of The Gentlemen ransomware-as-a-service operation. Using forum OPSEC data from Intel 471, Constella Intelligence,
      Epieos, and Flashpoint, Krebs traces the operator's forum handle "Hastalamuerte" (later Zeta88) to Alexander
      Andreevich Yapaev, a 36-year-old resident of Izhevsk, Russia (capital of Udmurtia), who lists himself as head of
      B2B marketing at Uralenergo Udmurtia. Check Point Research (May 2026) confirmed Hastalamuerte/Zeta88 as the
      administrator and primary operator who assembles the locker, manages the RaaS panel, and receives 10% of all ransoms
      (affiliates receive up to 90%). PRODAFT (updated 11 June) corroborated the attribution "with high confidence" in a
      detailed writeup, adding that Yapaev supplies affiliates with initial access including Fortinet SSL-VPN credentials
      obtained through brute-force or from the group's own leak database, and uses AI tools for both malware development
      and post-exploitation assistance. The Gentlemen has claimed at least 332 published victims since mid-2025, with 240+
      in 2026 alone, operating multi-OS lockers (Windows, Linux, NAS, BSD in Go; ESXi in C). Geographic victim
      concentration: US, UK, Germany, Australia, Romania. The group uses Tox P2P for victim negotiations and Twitter/X
      for public pressure on non-payers.
    ch_eu_nexus: "Germany is among the top victim countries per Check Point's SystemBC C2 telemetry; UK also heavily represented. The group's 90% affiliate model has attracted former LockBit, Qilin, and Medusa affiliates, expanding European operations."
    public_sector_nexus: "indirect — corporate and organizational targeting; sector spread includes public-adjacent entities"
    sector: "ransomware, multi-sector"
    cves: []
    actors_campaigns_malware: ["The Gentlemen", "Hastalamuerte", "Zeta88", "SystemBC"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The cyber intelligence firm Intel 471 shows that the user Hastalamuerte is a Russian and English speaking person who registered on almost a dozen cybercrime forums between 2019 and the present day."
        attribution: "Krebs on Security"
