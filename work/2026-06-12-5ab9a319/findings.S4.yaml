items:
  - title: "ShinyHunters (UNC6240) exploits Oracle PeopleSoft zero-day (CVE-2026-35273) to breach University of Nottingham — 455,000 students and alumni, 40 GB exfiltrated, ICO notified"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/nottingham-university-data-breach-affects-over-450-000-students/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "primary"
      - url: "https://therecord.media/university-of-nottingham-cyber-incident-shiny-hunters"
        publisher: "The Record"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
        publisher: "University of Nottingham (victim statement)"
        date: "2026-06-11"
        role: "primary-victim-disclosure"
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit"
        publisher: "Mandiant / Google Cloud (GTIG)"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/security/nottingham-university-data-breach-affects-over-450-000-students/ → primary victim disclosure: University of Nottingham, URL https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident → Mandiant GTIG attribution: URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit"
    summary: |
      The University of Nottingham confirmed on 11 June 2026 that ShinyHunters (tracked as UNC6240 by Mandiant) breached
      its student records system via the Oracle PeopleSoft zero-day CVE-2026-35273 (CVSS 9.8, unauthenticated RCE in the
      PeopleTools Environment Management Hub / PSEMHUB component, affecting versions 8.61 and 8.62). Mandiant dates the
      campaign between 27 May and 9 June; Oracle did not issue its out-of-band advisory until 10 June, so the vulnerability
      was a zero-day for the entire intrusion window. The threat actor allegedly compromised over 100 organisations including
      universities in the UK, US, and Asia, staging post-exploitation through five sequential IP addresses running Python's
      SimpleHTTP server on port 8888, deploying custom MeshCentral remote-management agents disguised as Microsoft Azure
      binaries, with C2 at azurenetfiles.net. At Nottingham, approximately 40 GB was exfiltrated including 455,000 unique
      email addresses along with names, addresses, phone numbers, ethnicities, disabilities, passport numbers, academic
      enrolments, and tuition payment records across the UK, Malaysia and China campuses. ShinyHunters claimed credit on its
      extortion site and demanded payment. The university filed reports with Action Fraud and the ICO; Have I Been Pwned
      ingested the 10 GB released dataset. The ICO confirmed it is "assessing the information provided."
    ch_eu_nexus: "UK higher education sector; University of Nottingham Malaysia and China campuses also affected. The CVE-2026-35273 campaign hit education and enterprise organisations globally. Oracle PeopleSoft is used by a number of European public universities."
    public_sector_nexus: "direct — university is a public institution; ICO notified"
    sector: "education, public-sector"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-11"
    evidence:
      - quote: "The University of Nottingham has been the victim of a cyber incident and a significant amount of data in our student record system has been accessed by an external third party."
        attribution: "University of Nottingham (victim statement)"
        source_url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
      - quote: "ShinyHunters claimed responsibility for the attack, saying they had stolen around 40 GB of the institution's data, which included billing and payment records, credit card and payment details, and student finance data. The criminal crew further claimed that the University of Nottingham's Malaysia and China campuses were also compromised."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/nottingham-university-data-breach-affects-over-450-000-students/"
      - quote: "Google's Mandiant attributes it to the group it tracks as UNC6240, and dates the activity between May 27 and June 9. Oracle did not publish its advisory until June 10, so the bug was a zero-day the entire time."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html"
    extended_notes: |
      Detection: monitor for anomalous HTTP requests to /PSEMHUB/ paths, SimpleHTTP server on port 8888 (Sysmon EID 1, network
      listen events), and new scheduled tasks or services named after Azure components that resolve to external IPs. The domain
      azurenetfiles.net is a known C2 but per policy no IOCs in the brief. Defenders who have not applied the Oracle out-of-band
      patch for CVE-2026-35273 on any PeopleSoft instance should treat patching as P0 given the live campaign. This item
      is an UPDATE to the ShinyHunters Oracle PeopleSoft campaign covered in the 2026-06-11 brief; the Nottingham victim
      statement and ICO notification constitute a material new development in the same campaign window.

  - title: "AudiA6 ransomware crypto-laundering service dismantled — $389 M in Bitcoin laundered since 2021, two charged in Philadelphia, Switzerland and 12 other countries participating"
    sources:
      - url: "https://www.secretservice.gov/newsroom/releases/2026/06/two-charged-connection-cryptocurrency-money-laundering-service-allegedly"
        publisher: "US Secret Service / DOJ (Philadelphia)"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.europol.europa.eu/media-press/newsroom/news/ransomware-gangs-cut-eur-336-million-audia6-crypto-laundering-pipeline"
        publisher: "Europol"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/legal/authorities-dismantle-audia6-ransomware-crypto-laundering-service/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/legal/authorities-dismantle-audia6-ransomware-crypto-laundering-service/ → primary: USSS press release, URL https://www.secretservice.gov/newsroom/releases/2026/06/two-charged-connection-cryptocurrency-money-laundering-service-allegedly → corroborating primary: Europol newsroom, URL https://www.europol.europa.eu/media-press/newsroom/news/ransomware-gangs-cut-eur-336-million-audia6-crypto-laundering-pipeline"
    summary: |
      On 11 June 2026, a coordinated international operation led by the US Secret Service (Cyber Investigative Section),
      IRS-CI, Europol, and Eurojust dismantled AudiA6, one of the most-trusted ransomware crypto-laundering services
      operating since 2021. Participants included Australia, Canada, France, Georgia, Germany, Iceland, Japan, Poland,
      Switzerland, and the United Kingdom. Two Ukrainian/Russian nationals — Ruslan Igorevich Tkachuk (37) and Alexander
      Vladimirovich Ledenev (25), both resident in Batumi, Georgia — were arrested and charged in the Eastern District of
      Pennsylvania with conspiracy to launder monetary instruments and sting money laundering; the US Attorney's Office will
      seek extradition. Blockchain analysis identified approximately 10,333 BTC (~$389.7 M at transaction-time values)
      deposited to AudiA6 wallets from 2021 onwards, with ~393 BTC directly traceable to darknet markets, ransomware
      organisations, and cybercrime services. The service charged a 3–10% commission to accept criminal proceeds,
      route them through complex transaction chains via thousands of fraudulent exchange accounts opened with stolen
      identities, and return "cleaned" funds within roughly one hour. AudiA6 advertised on the Dark2Web cybercrime forum
      (also seized). Infrastructure targeted across the US, Iceland, Germany, and France; Telegram channels blocked;
      cryptocurrency assets frozen; devices seized. Europol assessed AudiA6 as linked to over 15 separate international
      cybercrime investigations.
    ch_eu_nexus: "Switzerland is a named participating country in the takedown; several EU member states (Germany, France, Poland, Iceland) contributed infrastructure seizures. AudiA6 laundered proceeds from ransomware groups that have targeted EU and Swiss organisations."
    public_sector_nexus: "indirect — ransomware groups serviced by AudiA6 have targeted EU/CH public sector"
    sector: "financial-crime, law-enforcement, ransomware-ecosystem"
    cves: []
    actors_campaigns_malware: ["AudiA6", "Dark2Web"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Ruslan Igorevich Tkachuk, 37, and Alexander Vladimirovich Ledenev, 25, both residing in Batumi, Republic of Georgia, were arrested on Wednesday and charged by criminal complaint with one count of conspiracy to launder monetary instruments and one count of sting money laundering, arising from their alleged operation of 'AudiA6,' a cryptocurrency money laundering service believed responsible for laundering more than $389 million in cryptocurrency."
        attribution: "US Secret Service / DOJ Philadelphia"
        source_url: "https://www.secretservice.gov/newsroom/releases/2026/06/two-charged-connection-cryptocurrency-money-laundering-service-allegedly"
      - quote: "The takedown resulted from parallel investigations by the United States Secret Service, Internal Revenue Service Criminal Investigation, Europol, Eurojust, and other international law enforcement partners, including Australia, Canada, France, Georgia, Germany, Iceland, Japan, Poland, Switzerland, and the United Kingdom."
        attribution: "US Secret Service / DOJ Philadelphia"
        source_url: "https://www.secretservice.gov/newsroom/releases/2026/06/two-charged-connection-cryptocurrency-money-laundering-service-allegedly"
    extended_notes: |
      The arrest in Poland of a Ukrainian national in September 2025 triggered the subsequent chain of forensic investigation.
      For defenders: the disruption of AudiA6 removes one financial-infrastructure layer used to monetise ransomware campaigns
      targeting EU and CH organisations. Incident responders should note that recovery of blockchain transaction records
      and seized servers may assist in attributing prior ransomware payouts to victim organisations.

  - title: "South Korea's PIPC levies record W624.7 billion (~$409 M) fine on Coupang for 37.5-million-person data breach and unauthorised cross-site tracking"
    sources:
      - url: "https://www.koreaherald.com/article/10769731"
        publisher: "The Korea Herald"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/south-korea-hits-coupang-with-record-409-million-fine-over-data-breach/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/security/south-korea-hits-coupang-with-record-409-million-fine-over-data-breach/ → primary: Korea Herald regulatory reporting, URL https://www.koreaherald.com/article/10769731"
    summary: |
      South Korea's Personal Information Protection Commission (PIPC) approved on 10 June 2026 a record fine of
      624.68 billion won (~$409 M USD) against e-commerce platform Coupang (NYSE: CPNG) following a data breach that
      exposed personal information of approximately 37.5 million people — roughly two-thirds of the Korean population.
      The breach, which began as early as April 2025 and ran undetected for approximately five months until November 2025,
      involved a former employee (Chinese national) who stole an authentication signing key and used it to gain unauthorised
      access. The PIPC found multiple failures: inadequate signing-key management, weak access controls, failure to notify
      affected individuals, failure to delete personal data per retention obligations, failure to ensure CPO independence,
      and obstruction of the regulator's inquiry. The principal fine of 423.58 billion won covers the breach itself; a
      separate 201.11 billion won was imposed for unlawfully collecting online activity records (URLs, visit histories,
      IP addresses) from 11.17 million users across third-party websites without consent. The fine eclipses South Korea's
      previous record (SK Telecom, ~$88 M in August 2025 after a hacking incident). Coupang stated it will contest the
      ruling through legal proceedings. The PIPC also separately fined Coupang Fulfillment Services 248 million won for
      misuse of sensitive employee data (body weight records submitted in litigation, and journalists placed on an employment
      blacklist).
    ch_eu_nexus: "APAC precedent with direct relevance to GDPR DPA enforcement posture; the PIPC penalty (3.2% of estimated revenue) exceeds most EU GDPR fines issued to date except Meta €1.2 B (2023). The PIPC fine methodology (combining breach penalty + separate tracking/consent penalty) mirrors the CNIL and Irish DPC multi-violation approach."
    public_sector_nexus: "none — commercial company"
    sector: "e-commerce, privacy-regulation"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "South Korea's privacy watchdog imposed a record 624.68 billion won ($409 million) fine on Coupang over a massive data breach and unauthorized tracking of users' online activity."
        attribution: "The Korea Herald"
        source_url: "https://www.koreaherald.com/article/10769731"
      - quote: "The regulator said Coupang's security lapses led to the leak of personal information belonging to some 37.5 million people, raising the scale from an earlier government-led probe in February that found 33.67 million compromised records."
        attribution: "The Korea Herald"
        source_url: "https://www.koreaherald.com/article/10769731"
    extended_notes: |
      PIPC enforcement detail: the PIPC ordered Coupang to (1) strengthen data security controls, (2) notify affected
      non-members, (3) give the CPO greater independence and authority. The US State Department noted it will maintain
      a nondiscriminatory policy toward US companies. Comparable GDPR DPA precedent: the scale (37.5 M records, signing-key
      compromise, 5-month detection gap) maps to GDPR Article 32 (technical/organisational security measures) and
      Articles 33–34 (breach notification obligations). For EU/CH defenders the case reinforces the importance of
      privileged-credential rotation, authentication-key inventory, and sub-30-day breach-detection SLAs.

  - title: "Maine Attorney General breach portal abused to file fraudulent disclosures for VRChat (2.4 M claimed) and Discord — both companies deny breach, structural validation gap exposed"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/maine-breach-portal-abused-to-publish-fake-data-breach-disclosures/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.malwarebytes.com/blog/data-breaches/2026/06/data-of-2-4-million-vrchat-users-stolen"
        publisher: "Malwarebytes"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/security/maine-breach-portal-abused-to-publish-fake-data-breach-disclosures/ → corroborating: Malwarebytes, URL https://www.malwarebytes.com/blog/data-breaches/2026/06/data-of-2-4-million-vrchat-users-stolen"
    summary: |
      On 11 June 2026, BleepingComputer reported that Maine's official data-breach notification portal (maintained by the
      Maine Office of the Attorney General) had been used to file fraudulent breach disclosures, exploiting the portal's
      lack of pre-publication identity validation. Two notable fake filings appeared: one claiming VRChat had exposed
      2.4 million users' data via a cloud environment compromise, and one claiming a Discord breach affecting 10 million
      users. VRChat's Head of Community explicitly denied the filing: "VRChat did not submit this Notice of Data Incident,
      and the employee/email cited does not exist. We have no reason to believe that our data or systems have been
      compromised." Discord also denied its filing showed red flags (no matching employee name, generic description).
      The Maine AG's Office acknowledged the issue and planned to remove the false notices. The portal allows any person
      to submit a breach notification that is immediately published without independent verification. The structural flaw
      enables a threat actor or harassment campaign to generate instant negative press for a target company, interfere
      with share prices for public companies, or create legal ambiguity around actual breach obligations.
    ch_eu_nexus: "Procedural precedent: highlights the absence of authentication/verification gates on state-level breach notification portals in the US; EU GDPR Article 33/34 notifications flow through DPA systems that require authenticated filer identity (unlike Maine's open portal), but the trust-exploitation pattern could be adapted to other low-verification notification channels. Relevant for defenders evaluating incident-response workflows."
    public_sector_nexus: "none — affects gaming platform companies; regulatory integrity issue"
    sector: "gaming, privacy-compliance"
