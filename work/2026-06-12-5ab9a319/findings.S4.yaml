  - title: "CISA issues BOD 26-04 — risk-tiered federal patch mandate: all-four-criteria KEV vulns require 3-day remediation; supersedes BOD 22-01"
    sources:
      - url: "https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"
        publisher: "CISA (US Government)"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.cisa.gov/news-events/news/patch-smarter-not-harder"
        publisher: "CISA"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/cisa-tells-govt-agencies-to-patch-critical-exploited-flaws-in-3-days/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/security/cisa-tells-govt-agencies-to-patch-critical-exploited-flaws-in-3-days/ → primary: CISA directive page, URL https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk → primary companion blog: URL https://www.cisa.gov/news-events/news/patch-smarter-not-harder"
    summary: |
      CISA issued Binding Operational Directive 26-04, "Prioritizing Security Updates Based on Risk," on 10 June 2026,
      superseding and revoking BOD 19-02 (2019) and BOD 22-01 (2021). The directive applies to all Federal Civilian
      Executive Branch (FCEB) agencies and mandates a four-criterion risk tiering model: (1) Asset Exposure — is the
      vulnerable asset publicly internet-accessible; (2) KEV Status — is the CVE on CISA's Known Exploited Vulnerabilities
      catalog; (3) Exploit Automation — can an adversary fully automate exploitation; (4) Technical Impact — does
      exploitation yield total vs. partial control. Vulnerabilities meeting all four criteria must be remediated within
      three calendar days, with a mandatory forensic triage to assess whether systems were already compromised before
      patching. Lower-risk vulnerabilities may be deferred to the next system upgrade cycle. CISA cited AI-assisted
      exploitation acceleration as a key driver, noting Verizon's 2026 DBIR found only 26% of KEV-listed vulnerabilities
      were fully remediated in 2025, with median time-to-remediation rising to 43 days. Phase I is immediate; Phase II
      (60-day): update vulnerability management processes and align to the CVE database and KEV catalog; Phase III
      (180-day): full compliance with the tiered timelines plus metadata tagging of all publicly reachable assets.
    ch_eu_nexus: "Direct US federal applicability; the three-day timeline and four-criterion framework represent a best-practice template applicable to European NIS2 Articles 21(2) and Swiss ISDS security-measure obligations. EU NIS2 Article 23 incident notification (24 h) is faster than BOD 26-04 patching timelines, so the directive's framework adds a companion vulnerability-management layer that EU CISOs can map to their own risk-tiering decisions."
    public_sector_nexus: "direct — US federal agencies; strong relevance to EU/CH public sector vulnerability management programmes"
    sector: "public-sector, vulnerability-management, policy"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Cyber threat actors exploit unpatched vulnerabilities, and their use of AI may further narrow the time defenders have to react between patch release and possible exploitation."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"
      - quote: "Per Verizon's 2026 Data Breach Investigations Report, only 26% of vulnerabilities on CISA's Known Exploited Vulnerabilities (KEV) Catalog were fully remediated by organizations in 2025, a drop from the previous year's 38%. The median time for full resolution rose to 43 days."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/news/patch-smarter-not-harder"
    extended_notes: |
      The directive's practical implication for EU/CH defenders: a vulnerability that is (a) internet-exposed, (b) on KEV,
      (c) automatable, and (d) yields total control — e.g. recent Cisco SD-WAN CVE-2026-20245, Ivanti Sentry CVE-2026-10520,
      Check Point CVE-2026-50751 — requires three-day turnaround for US federal agencies. European NIS2-covered entities
      should benchmark their current SLA against this. CISA noted that in one large FCEB agency pilot, only 1% of
      vulnerability instances fell into the three-day category, with over 60% deferred — meaning risk-tiering dramatically
      reduces operational burden while concentrating effort on what matters.

