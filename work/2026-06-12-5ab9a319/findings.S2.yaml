      - quote: "Gentlemen ransomware operation (tracked as Phantom Mantis) has claimed 478 victims since March 2025 ... The ransomware, written in Go and obfuscated with Garble, features a --spread argument enabling self-propagating worm capabilities across networks."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
      - quote: "Its distinctive capability involves aggressive self-propagation utilizing 21 independent lateral movement techniques spanning PsExec, WMIC, scheduled tasks, Windows services, PowerShell remoting, and WMI"
        attribution: "Microsoft Security Blog"
