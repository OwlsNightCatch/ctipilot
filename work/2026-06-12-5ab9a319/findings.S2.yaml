    extended_notes: |
      The in-window fresh signal is the Krebs deanonymisation piece (June 10) and the THN 478-victim update (June 11). The Microsoft and Check Point analyses (May 2026) provide the deep technical baseline; both are within the 72-hour developing_window allowance and flagged as background. The group's internal Rocket.Chat system was breached and leaked in May 2026, exposing affiliate TTPs and victim negotiation logs.

  - title: "GitHub npm v12 (July 2026): install lifecycle scripts disabled by default — closes largest npm code-execution surface"
    sources:
      - url: "https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/"
        publisher: "GitHub Changelog"
        date: "2026-06-09"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/github-to-disable-npm-install-scripts.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: inside-it-ch RSS feed (URL https://www.inside-it.ch/github-verschaerft-npm-sicherheitsstandards-20260611) → corroboration: THN feed item, URL https://thehackernews.com/2026/06/github-to-disable-npm-install-scripts.html → primary: GitHub Changelog, URL https://github.blog/changelog/2026-06-09-upcoming-breaking-changes-for-npm-v12/"
    summary: |
      GitHub announced on 9 June 2026 that npm v12 (expected July 2026) will disable install-time lifecycle scripts (`preinstall`, `install`, `postinstall`) by default for all transitive dependencies. This closes what GitHub describes as "the single largest code-execution surface in the npm ecosystem" — the automatic execution of arbitrary scripts from every package in a dependency tree at install time, which has been the primary attack vector for supply-chain malware families including IronWorm, Phantom Gyp, and hundreds of credential-stealer packages. Under the new model, users must explicitly run `npm approve-scripts` to whitelist packages whose scripts may execute; Git dependencies and remote URL dependencies are also blocked unless `--allow-git` / `--allow-remote` flags are set. An existing bypass where `.npmrc` configuration could override `--ignore-scripts` is also fixed. The change is a breaking change; organisations with CI/CD pipelines and private registry workflows must audit and update npm install invocations before July 2026. The inside-it.ch Swiss IT trade press covered this on the same day as THN, confirming broad visibility in the Swiss developer community. MITRE relevance: T1195.002 (Compromise Software Supply Chain / Downstream Artifacts), T1059.001 (PowerShell / Script Execution). Hardening action for CH/EU SOC and DevSecOps teams: audit CI/CD for `npm install` invocations without `--ignore-scripts`; plan migration to npm v12 approval workflow before July; review package lock files for packages with known install scripts.
    ch_eu_nexus: "Swiss IT trade press (inside-it.ch) covered this independently; directly affects Swiss and EU developer/DevSecOps environments"
    public_sector_nexus: "indirect — relevant to public-sector dev teams and CI/CD pipelines"
    sector: "technology, software-supply-chain"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "\"npm install\" command previously executed scripts from all transitive dependencies automatically, creating a major attack surface—described as 'the single largest code-execution surface in the npm ecosystem.' The update requires explicit user approval via `npm approve-scripts` before scripts execute."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/github-to-disable-npm-install-scripts.html"

  - title: "CVE-2026-25089 — Fortinet FortiSandbox: unauthenticated OS command injection (CVSS 9.1), CCB Belgium and NCSC-NL issue advisories"
    sources:
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0189"
        publisher: "NCSC-NL"
        date: "2026-06-11"
        role: "primary"
      - url: "https://ccb.belgium.be/advisories/warning-fortinet-addresses-critical-command-injection-vulnerability-fortisandbox-patch"
        publisher: "CCB Belgium"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: advisories-ncsc-nl bridge (ncsc-nl recent 10), NCSC-2026-0189 → primary: NCSC-NL advisory URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0189 → corroborating: CCB Belgium advisory URL https://ccb.belgium.be/advisories/warning-fortinet-addresses-critical-command-injection-vulnerability-fortisandbox-patch"
    summary: |
      Fortinet patched CVE-2026-25089 (CVSS 9.1 Critical, CWE-78) in FortiSandbox on 9 June 2026 under internal reference FG-IR-26-141. The vulnerability is an OS command injection in the FortiSandbox web interface's "start VNC" feature: the VNC launch handler accepts JSON input that is passed to the underlying OS without sanitisation. A remote unauthenticated attacker can send a specially crafted HTTP request to trigger second-order command injection and execute arbitrary OS commands with the privileges of the FortiSandbox process. The flaw affects FortiSandbox 5.0.0–5.0.5, 4.4.0–4.4.8, FortiSandbox Cloud 5.0.4–5.0.5, and FortiSandbox PaaS 5.0.4–5.0.5. Patches are available in FortiSandbox 5.0.6, 4.4.9, and corresponding Cloud/PaaS versions. Both CCB Belgium and NCSC-NL published advisories on 11 June 2026, the former with "patch immediately" urgency. The webinterface is not intended for public-facing exposure; NCSC-NL notes the vulnerability's prerequisites require the management interface to be internet-accessible, which it is not in compliant deployments. EU/CH nexus: FortiSandbox is deployed widely in European enterprise and public-sector SOC environments for dynamic malware analysis; a compromised FortiSandbox gives attackers visibility into all files submitted for analysis. T1190 (Exploit Public-Facing Application); T1059.004 (Unix Shell). Detection: monitor FortiSandbox web-UI access logs for anomalous requests to VNC-management endpoints; alert on unexpected subprocess spawning from the FortiSandbox service account. Hardening: restrict management interface to internal networks only; upgrade to patched versions; apply FortiGuard IPS signatures.
    ch_eu_nexus: "CCB Belgium and NCSC-NL both issued advisories; FortiSandbox deployed in EU/CH SOC environments for malware sandbox analysis"
    public_sector_nexus: "direct — FortiSandbox commonly deployed in public-sector SOC and government network security stacks"
    sector: "public-sector, technology, all-sectors"
    cves: [CVE-2026-25089]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Niet-geauthenticeerde aanvallers willekeurige OS-commando's uitvoeren door speciaal vervaardigde HTTP-verzoeken te sturen [unauthenticated attackers can execute arbitrary OS commands by sending specially crafted HTTP requests]"
        attribution: "NCSC-NL NCSC-2026-0189 (Dutch)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0189"
    extended_notes: |
      Vulnerability was discovered internally by Adham El Karn of Fortinet's Product Security team. No public PoC and no exploitation in the wild reported as of 2026-06-11. The web management interface should be placed behind a dedicated management VLAN with no internet exposure per Fortinet hardening guide.

