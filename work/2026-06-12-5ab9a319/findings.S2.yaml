  - title: "CVE-2026-49261 — MariaDB Galera cluster wsrep_notify_cmd shell injection: CVSS 10.0, all active LTS series affected"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
        publisher: "NCSC-CH GovCERT / CSH"
        date: "2026-06-11"
        role: "primary"
      - url: "https://mariadb.org/mariadb-community-server-corrective-releases/"
        publisher: "MariaDB Foundation"
        date: "2026-06-02"
        role: "primary"
      - url: "https://securityonline.info/mariadb-security-flaw-cvss-10/"
        publisher: "Security Online"
        date: "2026-06-07"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12627 (bridge ncsc-csh recent 15) → primary: MariaDB Foundation corrective-releases post, URL https://mariadb.org/mariadb-community-server-corrective-releases/ → corroborating: Security Online, URL https://securityonline.info/mariadb-security-flaw-cvss-10/"
    summary: |
      CVE-2026-49261 (CVSS 3.1: 10.0 CRITICAL) is a shell-injection flaw in MariaDB's Galera cluster replication subsystem. When wsrep_notify_cmd is configured, the cluster-member notification command is built by string-concatenating peer-supplied node names (wsrep_node_name) and incoming-addresses (wsrep_node_incoming_address) directly into a shell command string without sanitisation. A malicious or compromised Galera peer that announces a node name containing shell metacharacters (e.g. `;`, `$(...)`, backticks) causes every other cluster member with wsrep_notify_cmd configured to execute attacker-controlled OS commands with the privileges of the mariadbd process (typically root or mysql). Two companion flaws CVE-2026-48165 and CVE-2026-48163 (both CVSS 8.0) add similar parameter-injection surfaces in the wsrep SST (State Snapshot Transfer) handshake. MariaDB rated exploitation prerequisites as unknown but the JIRA ticket (MDEV-39721) and CSH advisory confirm the attack path is cluster-internal, requiring no external credential. Patched in Community Server 11.8.8, 11.4.12, 10.11.18, 10.6.27 (released 2026-05-26/27) and Enterprise Server 11.8.6-4, 11.4.10-8, 10.6.25-22. NCSC-CH published its advisory on 2026-06-11, prompting immediate upgrade guidance for Swiss and EU public-sector environments running database clusters on MariaDB. Detection: monitor for unexpected child processes of the mariadbd PID (Sysmon EID 1 with parent-image filter) and for unauthorised shell spawns (bash/sh/dash) originating from the database service user. Hardening: omit wsrep_notify_cmd unless strictly needed; restrict Galera communication ports (4567/4568/4444) to trusted peer subnets; upgrade to patched versions immediately.
    ch_eu_nexus: "MariaDB is widely deployed in Swiss cantonal and federal public-sector database clusters, EU cloud and SaaS deployments (Nextcloud, Mattermost, many LAMP-stack government portals)"
    public_sector_nexus: "direct — shared database engine for Swiss federal and cantonal portals"
    sector: "public-sector, technology, cloud"
    cves: [CVE-2026-49261, CVE-2026-48165, CVE-2026-48163]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "MariaDB Server, when running as part of a Galera cluster with a notification command configured (wsrep_notify_cmd), builds that command by inserting the cluster members' node names and addresses directly into a string that is then executed by the system shell, without validating or escaping them."
        attribution: "NCSC-CH GovCERT / CSH post 12627"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
      - quote: "a perfect 10.0 CVSS score, likely enabling unauthenticated remote code execution ... Administrators must apply official vendor patches immediately"
        attribution: "Security Online"
        source_url: "https://securityonline.info/mariadb-security-flaw-cvss-10/"
    extended_notes: |
      GitHub security advisories: GHSA-3p3m-4x7c-p4pw (CVE-2026-49261), GHSA-7v3p-h23x-8hwv (CVE-2026-48165), GHSA-rpgv-q6gv-684r (CVE-2026-48163). Exploitation requires cluster membership (i.e., attacker has already compromised a Galera peer or can inject crafted SST/IST messages at the network layer). No exploitation in the wild confirmed as of 2026-06-11.

  - title: "GreatXML: Nightmare Eclipse drops unpatched BitLocker bypass — systems with prior Defender Offline scan history are vulnerable"
    sources:
      - url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
        publisher: "SecurityWeek"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.theregister.com/security/2026/06/11/nightmare-eclipse-drops-claimed-bitlocker-bypass-for-microsoft-windows/5254371"
        publisher: "The Register"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
        publisher: "NCSC-CH GovCERT / CSH"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12622 (bridge ncsc-csh recent 15) → WebSearch 'GreatXML BitLocker bypass SYSTEM privileges Nightmare Eclipse Windows June 2026' → primary: SecurityWeek, URL https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/ → corroborating: The Register, URL https://www.theregister.com/security/2026/06/11/nightmare-eclipse-drops-claimed-bitlocker-bypass-for-microsoft-windows/5254371"
    summary: |
      On 11 June 2026, researcher Nightmare Eclipse (also known as Chaotic Eclipse) publicly released GreatXML, a claimed BitLocker bypass exploit that has no CVE and no vendor patch. The attack targets the Windows Recovery Environment (WinRE): it abuses Microsoft Defender Offline's behaviour of loading configuration from the recovery partition. An attacker copies a crafted unattend.xml and a Recovery directory containing a second malformed XML to the root of the recovery partition; on the next WinRE reboot, the Defender Offline scan path processes these files and reportedly spawns a SYSTEM command prompt while the volume is decrypted — bypassing BitLocker's full-volume encryption. The researcher claims all systems where a Defender Offline scan has been initiated at least once are vulnerable. Independent researcher Will Dormann noted a prerequisite not initially disclosed: triggering the initial Defender Offline scan requires local administrator credentials, which would already permit disabling BitLocker directly — raising the practical severity bar considerably. Context: GreatXML is the sixth public zero-day from this researcher since April 2026 (BlueHammer, RedSun, UnDefend, YellowKey, GreenPlasma/RoguePlanet, GreatXML); Microsoft patched YellowKey (CVE-2026-45585) on June 9 Patch Tuesday. PoC: https://github.com/MSNightmare/GreatXML. No CVE assigned; no patch available as of 2026-06-12. Detection: monitor for unusual processes spawned during WinRE / Defender Offline execution; audit recovery-partition file modifications (Event ID 4663 on the recovery partition if accessible). Hardening: enforce Secure Boot with a custom PK; require TPM + PIN for BitLocker; review recovery-partition contents; restrict administrative share access (`C$`, `D$`) on endpoints.
    ch_eu_nexus: "global; directly relevant to Swiss/EU government endpoints and disk-encrypted workstations; Windows endpoints across EU public-sector environments"
    public_sector_nexus: "direct — full-disk encryption bypass on Windows public-sector workstations"
    sector: "public-sector, all sectors"
    cves: []
    actors_campaigns_malware: ["Nightmare Eclipse / Chaotic Eclipse"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "All systems on which an offline scan was initiated at least once automatically become vulnerable."
        attribution: "SecurityWeek (quoting Nightmare Eclipse)"
        source_url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/"
      - quote: "the writeup 'flawed,' noting that triggering a Defender Offline scan requires existing Windows login and admin credentials"
        attribution: "The Register (quoting researcher Will Dormann)"
        source_url: "https://www.theregister.com/security/2026/06/11/nightmare-eclipse-drops-claimed-bitlocker-bypass-for-microsoft-windows/5254371"
    extended_notes: |
      Prior Nightmare Eclipse disclosures in June: RoguePlanet (Defender TOCTOU SYSTEM shell, covered 2026-06-11 brief) and earlier April/May disclosures. The CSH post 12622 is the NCSC-CH aggregator tracking the full series with linked PoC repositories. Microsoft has not assigned a CVE for GreatXML as of publication. The researcher announced on their blog that additional disclosures are planned for July 14 2026.

  - title: "ShinyHunters / UNC6240 exploits Oracle PeopleSoft zero-day CVE-2026-35273 (CVSS 9.8) against 100+ organisations — 68% higher education; University of Nottingham breach confirmed (455,000 records)"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
        publisher: "Google Cloud / Mandiant GTIG"
        date: "2026-06-11"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.oracle.com/security-alerts/alert-cve-2026-35273.html"
        publisher: "Oracle PSIRT"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('ShinyHunters Oracle PeopleSoft zero-day CVE June 2026' via THN feed) → primary: Google Cloud / Mandiant GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/ → corroborating: THN, URL https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html → corroborating: Oracle PSIRT alert, URL https://www.oracle.com/security-alerts/alert-cve-2026-35273.html (403 — see note)"
    summary: |
      UNC6240 (ShinyHunters) exploited CVE-2026-35273, a pre-authentication remote code execution vulnerability (CVSS 9.8) in Oracle PeopleSoft Enterprise PeopleTools, as a zero-day from 27 May to 9 June 2026. The flaw resides in the PeopleSoft Environment Management Hub (PSEMHUB) component (PeopleTools versions 8.61 and 8.62) and requires only network reachability to the management hub endpoint — no credentials. Following exploitation, UNC6240 deployed customised MeshCentral agent binaries disguised as Microsoft Azure NetApp Files services (masquerading C2 domain: `azurenetfiles.net`, WebSocket path `wss://azurenetfiles.net:443/agent.ashx`) for persistent remote access. A lateral movement script named `[victim_abbreviation]_fanout.sh` executed SSH credential spraying across internal networks. Over 100 organisations were breached; 68% were higher education institutions. Stolen data was published to the ShinyHunters Data Leak Site on 9 June 2026; the University of Nottingham confirmed exposure of approximately 455,000 records including names, addresses, and passport data. Oracle patched the vulnerability by 11 June and issued an out-of-cycle security alert. EU/CH nexus: numerous European universities and research institutions run PeopleSoft ERP for student information systems, HR, and finance; those on 8.61/8.62 with internet-facing PSEMHUB are at direct risk. T1190 (Exploit Public-Facing Application); T1059.004 (Unix Shell); T1071.001 (Web Protocols C2). Detection: monitor PSEMHUB access logs for anomalous requests to Environment Management endpoints; alert on unexpected child processes spawned by PeopleSoft application server processes; hunt for new service registrations using Azure-themed names (azurenetfiles.net). Patch to PeopleTools 8.61.x / 8.62.x patched build or apply Oracle's out-of-cycle advisory immediately.
    ch_eu_nexus: "University of Nottingham (UK) confirmed 455,000-record breach; European universities widely deploy PeopleSoft; PeopleSoft is used by Swiss cantonal universities and polytechnics"
    public_sector_nexus: "direct — higher education and research public sector, EU data exfiltration"
    sector: "education, public-sector, higher-education"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["UNC6240", "ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "UNC6240 (ShinyHunters) exploited CVE-2026-35273, a critical remote code execution vulnerability (CVSS 9.8) in Oracle PeopleSoft's Environment Management component, as a zero-day between May 27-June 9, 2026 ... deployed customized MeshCentral agents disguised as Azure services"
        attribution: "Google Cloud / Mandiant GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/"
      - quote: "resulted in data exfiltration from over 100 organizations, with 68% being higher education institutions ... University of Nottingham confirmed breach exposure of approximately 455,000 records"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/shinyhunters-exploits-oracle-peoplesoft.html"
    extended_notes: |
      Oracle PSIRT returned HTTP 403 to WebFetch. The Mandiant GTIG blog is the primary technical write-up. PeopleSoft PSEMHUB ports (default: 8443/9043) should be firewall-restricted to internal management networks only as an immediate mitigation pending patch. The University of Nottingham disclosure was via HaveIBeenPwned (breach registered). Active exploitation window: May 27 - June 9, 2026 (zero-day period).

  - title: "The Gentlemen ransomware (Storm-2697 / Phantom Mantis / LARVA-368): self-propagating Go worm with 21 lateral-movement chains, European victims confirmed in DE, FR, UK — operator deanonymised as Alexander Andreevich Yapaev"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/"
        publisher: "Krebs on Security"
        date: "2026-06-10"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html"
        publisher: "The Hacker News"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
        publisher: "Microsoft Security Blog"
        date: "2026-05-28"
        role: "corroborating"
      - url: "https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"
        publisher: "Check Point Research"
        date: "2026-05-13"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('The Gentlemen ransomware Europe victims June 2026') → THN feed item https://thehackernews.com/2026/06/the-gentlemen-ransomware-claims-478.html → Krebs primary (deanonymisation) https://krebsonsecurity.com/2026/06/who-runs-the-ransomware-group-the-gentlemen/ → Microsoft Security Blog (technical dissection) https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/ → Check Point Research (OSINT + TTPs) https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"
    summary: |
      The Gentlemen is a rapidly ascending RaaS platform (tracked by Microsoft as Storm-2697, by PRODAFT as Phantom Mantis / LARVA-368) that has claimed 478 public victims since March 2025, making it the second-most-active ransomware group globally by victim count. On 10 June 2026, Krebs on Security published an OSINT investigation pointing to Alexander Andreevich Yapaev, a Russian citizen, as the group's administrator (aliases: hastalamuerte, zeta88) based on corroborating data from Constella Intelligence, Flashpoint, Intel 471, and KELA. European victims confirmed by the group's DLS include organisations in Germany, France, and the United Kingdom (Synergy France, UK Electronics); Germany and the UK rank among the top five most-targeted countries. The ransomware is written in Go and obfuscated with Garble; its primary differentiator is `--spread` mode enabling self-propagating worm behaviour: 21 independent lateral movement techniques spanning PsExec (via C$ admin share), WMIC, scheduled tasks (user and SYSTEM contexts), Windows services, PowerShell remoting (Invoke-Command), and WMI. Encryption uses per-file Curve25519 ECDH + XChaCha20 with a variable encryption fraction (default 27%, `--ultrafast` drops to 0.9% for speed). Initial access: exploitation of Fortinet FortiGate (CVE-2024-55591) and Cisco VPN appliances, credential brute-forcing, NTLM relay (RelayKing-Depth), and access-broker relationships. EDR evasion: ETW (Event Tracing for Windows) manipulation via Titanis, NTDLL unhooking, hardware breakpoint removal, EDRStartupHinder + gfreeze + glinker toolkit, and BYOVD. Post-compromise tools: NetExec, TaskHound, PrivHound, CertiHound, KslDump/KslKatz for credential harvesting, MANSPIDER for share discovery, and Velociraptor repurposed as C2. Detection: Sysmon EID 1 for unusual child-process trees from PsExec/WMIC parent processes; EID 4688 for scheduled-task creation (TaskHound) and service creation (SYSTEM context); EDR alert on NTDLL unhooking patterns; monitor for shadow copy deletion (`vssadmin delete shadows`); hunt for .umc16h extension on file share scan. Hardening: disable SMBv1, block lateral PsExec/WMIC via ASR rules, enforce Tamper Protection, enable Controlled Folder Access.
    ch_eu_nexus: "Germany and France confirmed victims on DLS; UK victim (Software consultancy) credentials reused in follow-on attacks; CH not explicitly named but within scope of European targeting"
    public_sector_nexus: "indirect — primarily private sector targets but ransomware TTPs transferable; public sector (education, healthcare, transport) explicitly listed in Microsoft's sector analysis"
    sector: "all-sectors, education, healthcare, finance, transport"
