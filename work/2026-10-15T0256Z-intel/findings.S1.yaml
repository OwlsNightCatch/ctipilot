    date: '2026-10-13'
    role: primary
  discovery_trace: 'first seen at: msrc-update-guide, ''python3 tools/fetch_source.py msrc cvrf 2026-Oct'' (45 MB CVRF saved
    to disk, parsed for Threats type 1 exploitability strings and CVSS base scores: 1760 vulnerability records) -> ''msrc
    cve CVE-2026-108398'' and CVRF Notes/Remediations for CVE-2026-70242, -100202, -100219 and others -> corroboration: Rapid7
    (cited by the existing 2026-10-14 Windows entry), URL https://www.rapid7.com/blog/post/em-patch-tuesday-october-2026/
    ; ZDI review, URL https://www.thezdi.com/blog/2026/10/13/the-october-2026-security-update-review'
  summary: 'The October 2026 Microsoft release (1,760 CVRF records; Rapid7 counts 1,413 own-product CVEs, ZDI 1,415) carries
    exactly one exploited flaw, the Windows Shell Mark of the Web bypass CVE-2026-96951 that has its own entry, and two publicly
    disclosed ones: CVE-2026-108398, a .NET Framework security feature bypass (untrusted search path, CWE-426, CVSS 8.8, local)
    that lets an attacker with a foothold register a malicious .NET assembly for loading by a protected process and so bypass
    Windows Defender Application Control, and CVE-2026-92707, a MessagePack-CSharp denial of service (5.3) released by a third
    party; Microsoft rates neither exploited. Beyond those, the release holds 67 Microsoft-product CVEs scored 9.0 or higher,
    all of them network-vector and 18 rated Critical by Microsoft; all but three cloud-service items carry Microsoft''s ''Exploitation
    Less Likely'' (55) or ''Unlikely'' (8) rating, and the one ''More Likely'' network item is the Exchange spoofing CVE-2026-70279
    already covered by the Exchange entry. The ones a reader should look at first are five Outlook remote code execution flaws
    (CVE-2026-70242, -97749, -97016, -88156, -70291, all CVSS 9.8; Microsoft rates four of them Critical and gives CVE-2026-88156
    no severity label) for which Microsoft says viewing the message in the Reading Pane suffices with no user interaction;
    for CVE-2026-70291 and -88156 the Office LTSC for Mac 2021 and 2024 updates were not yet available. Then the Windows server-role
    set at 9.8: Message Queuing (CVE-2026-100202, Critical), QUIC (CVE-2026-100219 and -105016, Critical), DHCP Server (CVE-2026-96320,
    -96934), DNS (-83869, -96113), RRAS (-85792, -85809), NPS (-100222, -85806), IIS (-70024), the PostScript printer driver
    (-70147, -70153, Critical), LSASS (-96219) and Active Directory Domain Services CVE-2026-70229 (Critical 8.1, attack complexity
    high, Exploitation More Likely). Rapid7 also notes Microsoft listed no Edge CVEs for the first 13 days of October, so
    defenders cannot map recent Edge updates to CVEs.'
