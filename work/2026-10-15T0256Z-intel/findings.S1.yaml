- title: 'Censys on the French supermarket refrigeration attacks: the exposed Danfoss StoreView (AK-SM 800A) controllers mostly
    run firmware vulnerable to three published 2025 CVEs, and operators are disconnecting rather than patching'
  sources:
  - url: https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/
    publisher: Censys Research
    date: '2026-10-14'
    role: primary
  - url: https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-03-01/
    publisher: Danfoss (DSA-2025-03-01, CVE-2025-41450)
    date: '2025-03-24'
    role: corroborating
  discovery_trace: 'first seen at: censys-blog, URL https://censys.com/feed/ (feed 8, direct, item dated 2026-10-14 19:39
    ''Frostbitten in France: A Danfoss StoreView Internet Exposure Report'') -> primary: https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/
    (extract)'
  summary: 'Censys''s 2026-10-14 exposure report on the Danfoss controllers hijacked in the French supermarket attacks (covered
    by the 2026-10-13 incident entry) adds what that entry lacks: the candidate vulnerabilities and fixed firmware. It says
    Danfoss has not confirmed the initial access vector but that most affected controllers were old models without security
    updates or newer ones on outdated firmware, and that Danfoss patched three AK-SM 800A flaws more than a year earlier:
    CVE-2025-41450 (March 2025; Censys describes an unauthenticated login as administrator with a code computed from the current
    calendar date, whereas Danfoss''s own advisory DSA-2025-03-01 describes an authentication flaw that lets an attacker generate
    a web report disclosing internal IP addresses, usernames and store names, fixed in version 4.2), CVE-2025-41451 and CVE-2025-41452
    (August 2025, post-authentication command injection and web-server configuration injection, fixed in 4.3.1); Censys says
    Claroty showed in August 2026 how 41450 and 41451 chain to remote code execution. Censys maps firmware by the login page''s
    Last-Modified date: below 4.2 carries all three flaws, 4.2.4 fixed the date-based login but not the other two, and 4.3.1
    or later fixes all three; globally ten of twelve top countries have more than 60 percent of exposed hosts below 4.3.1
    (Poland 81 percent, Romania 80 percent), and in France the exposed StoreView population fell about 71 percent in three
    days with patched and unpatched units disappearing at the same rate, meaning units were taken offline rather than patched.
    Censys names no actor.'
  region_nexus: France (primary); global exposure; the existing entry carries the NCSC Switzerland advisory
  primary_sector_nexus: indirect (building and refrigeration control systems; Swiss exposure not quantified by this report)
  sector: retail
  cves:
  - CVE-2025-41450
  - CVE-2025-41451
  - CVE-2025-41452
  techniques:
  - T1190
  affected_products:
  - Danfoss AK-SM 800A
  - Danfoss StoreView
  entity_keys:
  - product:danfoss-ak-sm-800a
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  suggested_priority: unchanged (high)
  evidence:
  - quote: Install the latest patch with number 4.2 to remediate this vulnerability.
    attribution: Danfoss (DSA-2025-03-01)
    source_url: https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-03-01/
  - quote: While Danfoss has not confirmed the exact initial access vector, it says most affected controllers were either
      older models that no longer received security updates or newer models running outdated firmware.
    attribution: Censys Research
    source_url: https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/
  - quote: Instead, every group shrank by roughly the same amount, about 70%.
    attribution: Censys Research
    source_url: https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/
  extended_notes: 'DELTA vs the existing entry (updated 2026-10-14T03:44Z, which says no source names the flaw): Censys names
    CVE-2025-41450/41451/41452 as the published, patched flaws on the affected controller family and gives the firmware fix
    level (4.3.1), but explicitly does not claim they were the attack path. That distinction must be kept: the claim is Censys''s
    analysis of exposure, not Danfoss''s or CERT-FR''s confirmation. Danfoss''s own advisory for CVE-2025-41450 (DSA-2025-03-01,
    2025-03-24, update log 2025-09-01) describes only an authentication flaw that lets an attacker generate a web report disclosing
    internal IP addresses, usernames and store names, fixed in 4.2; the admin-login-by-date-code description in the Censys
    report is Censys''s (via Claroty''s August 2026 research) and is not in Danfoss''s advisory text. Check_run note: the
    existing entry''s cves[] is empty; adding the three 2025 CVEs would need their own CVE-record sources. The exposure counts
    (France 1,825 to 537 hosts, 11 to 14 October) are Censys''s scan data and are a snapshot, not an inventory of compromise.'
