    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-101956
  extended_notes: 'AFFECTED / FIXED per Juniper CNA records (read from the structured fields; each record names its own affected
    ranges): CVE-2026-101956 Junos OS 25.2 < 25.2R2-S2, 25.4 < 25.4R1-S3, 26.2 < 26.2R1-S2, condition ''[ system services
    web-management ... ]'', fixed 25.2R2-S2, 25.4R1-S3, 25.4R2, 26.2R1-S2, 26.2R2, 26.4R1 and later. CVE-2026-101986 (JSA112187)
    affects Junos OS below 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3, 26.2R1-S2 and the matching
    -EVO trains of Junos OS Evolved (23.2R2-S7.7-EVO, 23.4R2-S8.11-EVO, 24.2R2-S5.6-EVO, 24.4R2-S5-EVO, 25.2R2-S2-EVO, 25.4R1-S3-EVO,
    26.2R1-S2-EVO), condition web-management configured, no workaround. CVE-2026-101954 (JSA112187): Junos OS 25.2/25.4/26.2
    trains as for 101956 plus Evolved 25.2/25.4/26.2 and the 23.4X100, 25.2X100 and 25.4X300 trains; fixed list includes the
    older 23.2R2-S7.7 to 24.4R2-S5 builds named in the record. CVE-2026-101983: stack overflow in httpd, condition ''[ system
    services web-management https virtual-domain <name> mtls ]''. CVE-2026-102182 (JSA112196): MX Series kmd, IKE certificate-based
    packets. CVE-2026-33792 (JSA112186): SRX srxpfe, GRE tunnel configured. Routing daemon records (JSA112187): CVE-2026-33789
    (BMP enabled, workaround disable BMP or avoid ''family inet flow''), CVE-2026-33796 (BMP route monitoring), CVE-2026-101990
    (flowspec re-advertisement), CVE-2026-102178 (BGP update-threading with flowspec), CVE-2026-101982 (EVPN-VPWS peer); on
    Junos OS the peer-triggered overflows reach root code execution, on Junos OS Evolved several only crash rpd. CVE-2026-102031
    (JSA112250): Junos OS Evolved, a low-privileged TACACS+ user reaches root when authorization refresh is configured. CVE-2026-101967
    (JSA112250, PTX bootzd zero-touch provisioning) needs an attacker on the management LAN. The fixed trains Juniper names
    are 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3/25.4R2, 26.2R1-S2/26.2R2 and 26.4R1 (EVO suffix
    for Evolved). EXPOSURE: first question is whether J-Web (the web-management service) is enabled and on which interfaces;
    the configuration anchor Juniper publishes is the ''system services web-management'' hierarchy, and for the daemon overflows
    the hierarchies BMP station, BGP flow family, EVPN-VPWS, service-deployment servers, security-intelligence url and GRE
    tunnel, which also name which boxes are exposed. Peer-triggered rpd issues require the attacker to be (or spoof) a configured
    BGP/BMP peer, so they are bounded by session authentication and filtering, unlike the three J-Web paths. DETECTION CONCEPT:
    management-plane HTTP/HTTPS access logs and J-Web authentication/session logs (requests reaching J-Web CGI paths without
    a preceding login, new root commands or commits not tied to an admin session), plus commit and configuration-change audit
    (a takeover through the NETCONF session handling would show as unexplained commits); routing-daemon crashes (core files,
    rpd restarts, BGP session resets) as a precursor signal for the overflow family. These are derived from the stated mechanism,
    not published by Juniper. HARDENING: disable J-Web where unused or restrict it to a management network (Juniper lists
    no workaround for the J-Web flaws, so upgrade is the fix), upgrade to the fixed trains, apply peer filtering for BGP/BMP/flowspec.
    CONTEXT: the bundle is very large (EUVD shows 153 records for Juniper on 2026-10-14; the first 100 are scored 5 to 9.3
    by CVSS 4.0); not every record is serious and the main agent should treat the J-Web trio plus the unauthenticated SRX/MX
    overflows as the actionable core. No previous Juniper entry exists in the store. CISA KEV does not list any of these CVEs
    at 2026-10-14.'
  suggested_action: List Junos devices with J-Web enabled and reachable from anything beyond a dedicated management network,
    move them to the fixed train for their branch, and until then restrict or disable J-Web.
