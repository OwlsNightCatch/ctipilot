- title: 'Microsoft October 2026 Patch Tuesday beyond the Windows Shell zero-day: five no-interaction Outlook preview-pane
    RCEs and about 60 unauthenticated network CVSS 9.0+ flaws, none exploited, two publicly disclosed'
