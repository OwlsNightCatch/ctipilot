  summary: 'Palo Alto Networks published CVE-2026-0322 on 2026-10-14: a code injection (CWE-94) in the PAN-OS management interface
    that lets an authenticated attacker with network access execute code as root on PA-Series and VM-Series firewalls and
    on Panorama (virtual and M-Series); Cloud NGFW and Prisma Access are not affected and no special configuration is needed.
    The advisory tags it ATTACKED and states that very limited exploitation has been observed against the management interface,
    and its FAQ lists three attacker source addresses (not reproduced here). CISA added it to KEV the same day. Palo Alto
    scores it CVSS-BT 8.6 (CVSS-B 8.6; 8.5 if management access is restricted to a jump box), urgency highest, with risk greatest
    where the management interface is reachable from the internet. There is no workaround. Fixes ship per branch (for example
    12.2.4, 12.1.10-h2, 11.2.13-h3, 11.1.16-h3, 10.2.18-h12); the 11.2.16 build is listed with an ETA of 10/15, so 11.2.14
    and 11.2.15 customers have no fixed build yet. Threat Prevention IDs 510046 and 510047 give only limited coverage and
    need SSL decryption plus management traffic routed through a data-plane port. The advisory does not say how the attackers
    obtained the credentials the flaw requires, when exploitation began or who is behind it; BleepingComputer says it asked
    Palo Alto those questions.'
  region_nexus: global; internet-reachable PAN-OS management interfaces are the exposure, no source names Swiss victims
