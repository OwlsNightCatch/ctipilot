    and that it is exploited in the wild in September and October 2026. A hoster reported on the project tracker (issue 354,
    dated 2026-09-11) that several Nextcloud servers were compromised from 2026-09-10 through requests to apps/richdocumentscode/proxy.php
    that smuggle shell command substitution in the request path, with the attacker then writing PHP web shells into the app
    directory and later searching the server for password-manager databases and cryptocurrency wallet files; a second administrator
    reported the same, noticing it because Nextcloud's integrity check failed on an unexpected PHP file. Collabora's maintainers
    answered on the issue that it affects only the Development Edition and only the 'Built-in CODE Server' deployment mode
    that downloads a local AppImage; standalone Collabora Online, Docker or distribution-packaged Collabora and hosted Collabora
    are not affected. A Nextcloud forum post noted on 2026-10-03 that no warning or CVE existed yet. The CVE and GitHub advisory
    followed on 2026-10-14 (CVSS 4.0 9.2, CWE-78, CISA ADP SSVC exploitation none/automatable no at the time of its record),
