- id: juniper-sirt
  publisher: Juniper Networks SIRT security advisories (JSA)
  url: https://supportportal.juniper.net/
  category: vulns / vendor-psirt
  why: 'No record covers Juniper although Junos is standard network-perimeter gear and the 2026-10-14 bundle was 153 records
    with unauthenticated J-Web root paths. The JSA pages are a JavaScript-only portal (WebFetch and extract both returned
    only the shell), so the working recipe is indirect: enumerate with EUVD (https://euvdservices.enisa.europa.eu/api/search?fromDate=D-1&toDate=D%2B1&vendor=Juniper&page=0&size=100
    read with ''url --direct'') and read the vendor''s own CNA data with ''url https://cveawg.mitre.org/api/cve/<CVE>'' (affected
    ranges, config condition, workaround, exploitation statement, solutions, JSA id).'
- id: f5-security-advisories
  publisher: F5 Security Advisories (my.f5.com K-articles) and NGINX security notes
  url: https://my.f5.com/manage/s/article/K000162608
  category: vulns / vendor-psirt
  why: The 2026-10-14 F5 quarterly notification (three NGINX CVEs at CVSS 4.0 9.2) is only reachable through the CVE records
    because my.f5.com returns a JavaScript shell on extract; no F5 record exists in sources.json. Same CVE-record recipe as
    Juniper. EUVD vendor=F5 returned zero rows (the vendor filter needs F5's exact EUVD spelling), so enumeration should go
    through the date plus score query.
