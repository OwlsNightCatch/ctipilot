    attribution: NCSC-NL (NCSC-2026-0429, Dutch)
    source_url: https://advisories.ncsc.nl/advisory?id=NCSC-2026-0429
  extended_notes: 'EXPOSURE (Cisco): both physical and virtual Secure Email Gateway running a vulnerable AsyncOS release AND
    (a) File Reputation enabled and assigned to a mail policy (web UI: Mail Policies > Incoming/Outgoing Mail Policies > Advanced
    Malware Protection > ''Enable File Reputation'' per policy) AND (b) Content Scanner Tools earlier than 25.3.0.5525 (CLI:
    contentscannerstatus). Fixed: Content Scanner Tools 25.3.0.5525 or later (CLI contentscannerupdate, or Security Services
    > Service Updates > automatic updates; no restart), AsyncOS 15.5.5-014 for 15.5, 16.5.0-780 for 16.5, 16.0 ''migrate to
    a fixed release''; Cisco recommends everyone below 16.5 move to 16.5.0-780. Secure Email Cloud Gateway: no customer action,
    Cisco already deployed the fixed Content Scanner Tools. Secure Email and Web Manager and Secure Web Appliance not vulnerable.
    POST-PATCH COMPROMISE CHECK (Cisco): the fix does not evict an attacker already at root. Cisco documents a self-check:
    grep ''System Security'' in system_logs (cluster: every member); the three outcomes are ''Suspected compromise indicator
    was found'' (compromise, follow Cisco''s recommendations / TAC), ''Security scan did not complete'' (contact TAC, not
    a clean result) and ''No compromise indicator was found''. Root access lets an attacker remove evidence, so Cisco says
    to cross-check network and firewall logs outside the appliance for unexpected uploads from the device to external addresses
    or downloads from unknown addresses. Physical appliance: contact TAC with remote access enabled. Virtual appliance: record
    forensics BEFORE upgrading, deploy a new VM on a fixed release, rebuild the configuration WITHOUT importing old configuration
    files, renew credentials and cryptographic material. Clusters: SSH key pairs used between cluster members can be read
    on a compromised member, so Cisco says to restore EVERY member of a cluster that contains a compromised appliance. DETECTION
    CONCEPT: mail-gateway process/file-write telemetry is unavailable to most defenders (root appliance), so the portable
    hunt is egress and flow data from the gateway''s management and mail interfaces (new outbound destinations, uploads, downloads),
    plus Cisco''s on-box system_logs ''System Security'' lines. HARDENING: separate mail and management interfaces, filter
    management traffic, disable HTTP on the admin portal, send logs off-box (all from Cisco''s general recommendations). CONTEXT:
    the previous exploited flaw in the same product (CVE-2026-76461, SQL injection in email parsing, KEV 2026-09-14) has its
    own entry; its fixed builds were 15.5.5-014, 16.0.4-302 and 16.5.0-780, while for this CVE Cisco lists 16.0 as ''migrate''
    and offers the Content Scanner Tools route to all supported releases. No source attributes this exploitation to an actor.
    Shadowserver tracks nearly 300 internet-exposed gateways per BleepingComputer; it cannot say how many are honeypots or
    already patched. CISA KEV row: dateAdded 2026-10-14, due 2026-10-17, knownRansomwareCampaignUse Unknown, forensicTriage
    Yes (BOD 26-04 forensic triage requirement).'
  suggested_action: Run contentscannerstatus on every Secure Email Gateway now and update Content Scanner Tools to 25.3.0.5525
    or later (no restart); then run the system_logs 'System Security' self-check on each node and review gateway egress logs,
    and for a virtual appliance with a hit preserve forensics before any upgrade.
