  extended_notes: 'EXPOSURE: Nextcloud servers with the app ''Collabora Online - Built-in CODE Server'' (richdocumentscode)
    installed at 26.4.302 or older; check the installed app version in the Nextcloud apps page or occ app:list. NOT affected
    (Nextcloud forum and Collabora maintainers): installations that use the richdocuments connector with a standalone Collabora
    (Docker, distribution package, hosted such as IONOS, Hostinger, Cloud42) and no richdocumentscode. Fixed in richdocumentscode
    26.4.303 (the diff between 26.4.302 and 26.4.303 changes the way the app starts Collabora via a PHP exec, per the forum
    post). A related earlier flaw, CVE-2025-66208, is explicitly a different vulnerability. BEHAVIORAL MANIFESTATION (hoster''s
    report): web-server access-log requests to apps/richdocumentscode/proxy.php?status whose path component carries command-substitution
    syntax and obfuscated whitespace, with encoded parent-directory sequences; the commands are base64-decoded and piped to
    a shell, write a small PHP file into the app directory and make outbound callbacks to a request-capture service; the dropped
    PHP web shell is then called with a command parameter. Later hands-on activity was filesystem discovery for credential
    stores and wallet files; the hoster saw no archive or exfiltration commands but notes the web-server account can read
    everything it can reach. POST-PATCH COMPROMISE CHECK: updating the app does not remove an already planted shell; look
    for unexpected .php files in the richdocumentscode app directory (the second reporter was alerted by Nextcloud''s own
    code-integrity check), review web access logs back to at least early September for the proxy.php pattern, and treat secrets
    readable by the web-server account (config.php, database credentials, stored credentials) as exposed on any hit. TRIAGE:
    a benign request to proxy.php?status is a normal capability probe by the app itself; the discriminating features are shell
    metacharacters or encoded path traversal in the request path and any PHP file in the app directory that is not part of
    the shipped release. CAVEATS: the issue''s own dates read 2026-09-10/11; the forum post carries 2026-10-03; exploitation
    scale beyond ''multiple independent installations'' is not quantified; Collabora''s maintainers said on the issue that
    more updates would follow and that they had been stuck behind a record advisory backlog for some days. The publication
    of CVE and GitHub advisory fell inside this run''s window (2026-10-14), which is the hook for the entry.'
  suggested_action: Check every Nextcloud server for the richdocumentscode app; update it to 26.4.303 or later (or move to
    a standalone Collabora), then search the app directory for unexpected PHP files and the web logs for proxy.php requests
    carrying shell syntax before treating the server as clean.
