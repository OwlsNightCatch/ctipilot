  extended_notes: 'VERSIONS (Fortinet tables read in full): FG-IR-26-185 CVE-2026-107656 FortiSandbox 5.2 not affected; 5.0.0-5.0.6
    upgrade to 5.0.7 or above; 4.4.0-4.4.9 upgrade to 4.4.10 or above; FortiSandbox PaaS 5.0.0-5.0.6 fix 5.0.7, 4.4 all versions
    migrate. FG-IR-26-180 CVE-2026-106173 FortiSIEM 7.6 not affected; 7.5.0 upgrade to 7.5.1 or above; FortiSIEM Cloud not
    affected; discovered internally. Other FortiSandbox items in the batch: FG-IR-26-179 (CVE-2026-106172, hard-coded cryptographic
    key in the Fabric API, unauthenticated access to some endpoints, 4.9; 5.2.0-5.2.1 fix 5.2.2, 5.0.0-5.0.6 fix 5.0.7, 4.4
    migrate) and FG-IR-26-176 (CVE-2026-106170, privileged persistent GUI/CLI denial of service, 4.8). Fortinet''s own Known
    Exploited field reads No on each of FG-IR-26-176 to -185 (metadata box read for every one of them). EXPOSURE: FortiSandbox
    appliance or VM with the GUI reachable from networks an attacker can touch (the flaw is in the web management interface)
    on 4.4.x or 5.0.x; FortiSIEM exactly 7.5.0 with the phQueryMaster service port (TCP 27918) reachable from outside the
    collector/supervisor trust zone. DETECTION CONCEPT (derived from mechanism): web-management access logs showing authenticated-only
    GUI paths served to sessions without a login; unexpected new files or processes spawned by the FortiSIEM query-master
    service and unexpected inbound connections to TCP 27918. HARDENING: upgrade; until upgraded restrict TCP 27918 (Fortinet''s
    stated control for FortiSIEM) and keep the FortiSandbox management GUI off untrusted networks. DATING: Fortinet dates
    the advisories 2026-10-13; the primary pages do not show a time of day, and NCSC-NL and CERT-FR relayed them on 2026-10-14,
