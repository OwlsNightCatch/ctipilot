  summary: CVE-2026-110447 covers an OS command injection in proxy.php of the Collabora Online Built-in CODE Server, the richdocumentscode
    app that Nextcloud installations use to run Collabora locally; versions up to 26.4.302 are affected and 26.4.303 fixes
