  summary: 'Fortinet''s 2026-10-13 advisory batch (FG-IR-26-176 to -185) has two unauthenticated critical entries. FG-IR-26-185:
    an authentication bypass using an alternate path or channel (CWE-288) in the FortiSandbox GUI lets a remote unauthenticated
    attacker bypass authentication via crafted HTTP requests and run unauthorised code or commands (Fortinet CVSS 9.6, 9.8
    in NCSC-NL''s CVE list, CVE-2026-107656); affected FortiSandbox 5.0.0 to 5.0.6 and 4.4.0 to 4.4.9 (and PaaS 5.0.x; 4.4
    PaaS migrates), fixed in 5.0.7 and 4.4.10, FortiSandbox 5.2 not affected. FG-IR-26-180: a path traversal (CWE-22) in the
    FortiSIEM grpc phQueryMaster service lets an unauthenticated attacker execute unauthorised code or commands via crafted
    packets (CVSS 9.4, CVE-2026-106173); only FortiSIEM 7.5.0 is affected (7.6 and FortiSIEM Cloud are not), fixed in 7.5.1,
    and restricting access to TCP port 27918 prevents the issue. Fortinet marks both Known Exploited: No; both were found
    internally (FG-IR-26-185 was also reported externally by TrendAI Research). The same batch adds lower-rated FortiSandbox
    issues (a hard-coded-key API access flaw CVE-2026-106172, a persistent GUI denial of service CVE-2026-106170), authenticated
    SQL injection in FortiAnalyzer and FortiManager (7.9), a FortiManager fgfmd command injection that needs a cluster node''s
    certificate and private key (5.3), a FortiMail webmail SQL injection (7.7) and several denial-of-service items; none is
    reported exploited. FortiSandbox had three flaws exploited in June 2026 (registry campaign key campaign:fortisandbox-triple-active-exploitation),
    which raises the weight of an unauthenticated GUI bypass in the same product.'
