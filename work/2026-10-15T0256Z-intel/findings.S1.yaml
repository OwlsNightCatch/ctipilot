  summary: 'Cisco disclosed CVE-2026-76519 on 2026-10-14: in the Advanced Malware Protection (AMP) feature of Cisco Secure
    Email Gateway, improper handling of email attachments (relative path traversal, CWE-23) lets an unauthenticated remote
    attacker who sends a crafted attachment through the device write arbitrary files on the underlying OS and execute commands
    as root. Cisco rates it CVSS 3.1 9.8 and states that in October 2026 its PSIRT became aware of active exploitation; CISA
    added it to KEV the same day. Only devices with the File Reputation service enabled and assigned to a mail policy AND
    Content Scanner Tools older than 25.3.0.5525 are exposed; Cisco ships the fix inside the Content Scanner Tools package
    for every supported AsyncOS release (no software upgrade or restart), plus AsyncOS 15.5.5-014 and 16.5.0-780 (16.0 must
    migrate). There is no workaround. Secure Email and Web Manager and Secure Web Appliance are not affected. Cisco says it
    hardened Secure Email Cloud and contacted cloud customers where it found indicators of compromise; it names no actor and
    shares no victim count. This is the second exploited unauthenticated root flaw in this product line in about four weeks
    (CVE-2026-76461, covered 2026-09-15), reachable through the same mail-in path rather than a management interface.'
  region_nexus: global; mail security gateways front most administrations' inbound mail, no source names Swiss victims
  primary_sector_nexus: indirect (common perimeter mail gateway class in public-sector mail flow; deployment in Swiss administrations
