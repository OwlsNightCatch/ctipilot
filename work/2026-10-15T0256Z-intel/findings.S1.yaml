self_evolution_notes:
- 'CVE Services API read: ''python3 tools/fetch_source.py url https://cveawg.mitre.org/api/cve/<CVE>'' returns the CNA''s
  own record (affected ranges per train, configuration condition, workaround, exploitation statement, solutions, advisory
  id) and CISA''s ADP SSVC fields; it is the only readable vendor record for JavaScript-only portals (Juniper JSA, F5 K-articles)
  and a free cross-check for any CVE the same day it is published.'
- '''extract'' on a JavaScript portal (supportportal.juniper.net, my.f5.com) returns the raw HTML with a multi-kilobyte Content-Security-Policy
  header (''direct-raw''); pipe it through ''head -c'' or skip it and use the CVE record instead.'
- '''extract'' on advisories.ncsc.nl falls back to the jina reader; ''ncsc-nl csaf <NCSC-id>'' returns the same advisory (Dutch
  notes, CVE list, CVSS) as structured JSON with no reader credit.'
- 'KEV rows now carry forensicTriage (BOD 26-04); 84 catalogue rows are flagged Yes, including all three 2026-10-14 additions
  that this run returned, so a ''forensicTriage: Yes'' KEV addition is a prompt to put the vendor''s compromise self-check
  in the entry''s Detection line.'
- Microsoft's CVRF now exceeds 1,700 records per month and includes third-party CVEs (Linux kernel, Apache, Go) without an
  exploitability string; counting 'CVSS 9+' on the raw file overstates Microsoft-product risk, filter on the Threats type
  1 string first.
