  summary: 'Juniper''s 2026-10-14 security bulletin bundle runs to 153 CVE records (ENISA EUVD count for the day). The critical-class
    entries, all rated CVSS 3.1 9.8 by Juniper, are: (1) CVE-2026-101956 (JSA112188), an improper-authentication flaw in J-Web
    that lets an unauthenticated remote attacker run Junos commands as root; Junos OS 25.2 before 25.2R2-S2, 25.4 before 25.4R1-S3
    and 26.2 before 26.2R1-S2, requires the web-management service to be configured, no workaround. (2) CVE-2026-101986 (JSA112187),
    a J-Web authentication bypass that executes CGI content with elevated privileges through a crafted HTTP request, Junos
    OS and Junos OS Evolved across every supported train. (3) CVE-2026-101954 (JSA112187), J-Web/NETCONF session handling
    that gives an unauthenticated network attacker root-level configuration access and full device takeover (Junos OS 25.2,
    25.4, 26.2 and Evolved). Also at 9.8: CVE-2026-101983, a stack overflow in the httpd process reachable when a J-Web virtual
    domain with mTLS is configured (unauthenticated remote code execution); CVE-2026-102182 (JSA112196), a stack overflow
    in the kmd daemon on MX Series triggered by IKE certificate-based packets (unauthenticated, code execution as root); CVE-2026-33792
    (JSA112186), a stack overflow in the SRX srxpfe process reachable on a configured GRE tunnel (root code execution or DoS);
    and a family of routing-daemon stack overflows that a configured BGP, BMP, flowspec or EVPN peer can trigger (CVE-2026-33789,
    -33796, -101990, -102178, -101982), with root code execution on Junos OS. Further SRX flaws (SVR, UTM, Security Intelligence
    feeds) and a Junos OS Evolved TACACS+ command injection sit at 8.1 to 9.8 and need specific configuration. Juniper SIRT
    states for each record it is not aware of malicious exploitation, and CISA''s ADP record for CVE-2026-101956 reads exploitation
    none, automatable yes, technical impact total. This reading rests on Juniper''s own CNA records and the ENISA mirror;
    no CERT or press corroboration had appeared yet, and the JSA portal pages are JavaScript-only.'
