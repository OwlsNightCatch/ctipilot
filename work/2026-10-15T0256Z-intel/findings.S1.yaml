    365 Apps per the Office security releases page; Office LTSC for Mac 2021/2024 updates not yet available for -70291 and
    -88156 (MSRC FAQ: customers will be notified through a revision). MSRC FAQ for all five: ''Simply viewing the message
    in the Outlook Reading Pane could trigger the vulnerability, without the recipient opening the message or clicking anything
    in it.'' Windows server-role CVEs: the fix is the 2026-10-13 cumulative update for each supported Windows and Server release
    (KB5126835/5126836/5126868/5126651/5126657/5126655/5126646/5126653/5127646/5127648 per MSRC remediation rows; KB5126836
    for Server 2012 R2). Windows Server 2012 receives no patch for CVE-2026-96951 per Rapid7, and Server 2012/2012 R2 ESU
    Year 3 ends 2026-10-14. NETWORK-ROLE MECHANISMS (MSRC FAQ text): MSMQ: a specially crafted message sent over the network
    to the MSMQ service triggers memory corruption; QUIC, DHCP Server and the other service CVEs: an unauthenticated attacker
    sends a specially crafted packet to the affected service, no authentication or interaction. CVE-2026-70229 (AD DS): attack
    complexity high (''particular network configurations and timing conditions''). TRIAGE GUIDANCE (analysis): the CVSS 9.8
    values are Microsoft''s network-vector scores; reachability depends on the role being enabled (MSMQ, DHCP Server, DNS,
    RRAS, NPS, IIS, iSCSI target) and on exposure beyond the internal network, so the exposure filter is ''is the role installed
    and reachable'', not the OS version. Microsoft also introduced non-binding ''risk cohorts'' groupings this month (ZDI).
    ZDI observes that discovery volume is scaling faster than exploitation and advises patching what is proven, prioritized
    and public. EXCLUDED FROM THIS ITEM: CVE-2026-96951 (exploited, own entry), the Exchange CVEs (own entry), the Apache
    HTTP Server, Go, and Linux-kernel CVEs that appear in the same CVRF because Azure Linux and other Microsoft distributions
    republish them (CVE-2026-56153/56154/57941/59797 and the CVE-2026-98xxx kernel series), and the three Azure cloud-service
    items scored 9.6 to 9.8 (Azure SRE Agent, Azure App Service, Dataverse) for which Microsoft''s rating is N/A and the fix
    is service-side.'
