  extended_notes: 'AFFECTED / FIXED (PAN PSIRT product table, read in full): PAN-OS 12.2 < 12.2.4; 12.1 < 12.1.4-h12, < 12.1.7-h8,
    < 12.1.10-h2; 11.2 < 11.2.4-h22, < 11.2.7-h21, < 11.2.10-h15, < 11.2.13-h3, < 11.2.16 (11.2.16 ''ETA: 10/15''); 11.1 <
    11.1.4-h37, < 11.1.6-h39, < 11.1.7-h11, < 11.1.10-h35, < 11.1.13-h15, < 11.1.16-h3; 10.2 < 10.2.7-h38, < 10.2.10-h41,
    < 10.2.13-h26, < 10.2.16-h11, < 10.2.18-h12; all older unsupported PAN-OS versions affected, upgrade to a supported fixed
    version. Solution table: per minor line, the listed hotfix train or the newest maintenance release (11.2.14 through 11.2.15
    -> 11.2.16 or later). EXPOSURE: any PA-Series, VM-Series firewall or Panorama (virtual or M-Series) whose management interface
    (MGT port or a data-plane interface with a management profile) accepts connections from networks an attacker can reach;
    Palo Alto''s best-practice guidance is internal-trusted-IP-only management and its own mitigation is a single jump box
    (CVSS drops 8.6 to 8.5, i.e. not a fix). WHAT THE ADVISORY DOES NOT SAY: how credentials were obtained (the flaw is post-authentication,
    so exploitation implies valid or stolen management credentials, a stated prerequisite rather than a described tactic),
    first-exploitation date, attribution, victim types. Discovered internally by Palo Alto Networks product security (named
    in BleepingComputer: Suraj Siddharudh). DETECTION CONCEPT (derived from the stated mechanism, not from the advisory):
    authentication and session telemetry for the management interface (successful administrator logins from addresses outside
    the management allow-list, logins immediately followed by configuration or commit activity), plus management-plane access
    logs against the three source addresses Palo Alto publishes in the advisory FAQ. HARDENING: restrict management-interface
    access to trusted internal addresses or a jump box; where the management port cannot be moved, Threat IDs 510046 and 510047
    (Applications and Threats content 9159-10287 or later) give limited coverage but only when the management traffic is routed
    through a data-plane port, the inbound certificate is replaced and the traffic is decrypted for inspection. Palo Alto
    itself states the limited coverage is not a substitute for the fixed version. CISA KEV row: dateAdded 2026-10-14, due
    2026-10-17, knownRansomwareCampaignUse Unknown, forensicTriage Yes. The same 2026-10-14 PAN advisory batch also carries
    PAN-OS CVE-2026-0320 (authenticated admin command injection, medium), CVE-2026-0319 and CVE-2026-0321/0318 (medium denial
    of service or input handling) and a Chromium monthly bulletin (PAN-SA-2026-0013); none is reported exploited.'
  suggested_action: Confirm no PAN-OS or Panorama management interface is reachable from the internet or an untrusted segment,
    then upgrade each unit to the fixed build for its branch (11.2.14/11.2.15 units wait for 11.2.16, due 2026-10-15) and
    review management-interface logins against the three addresses in the advisory FAQ.
