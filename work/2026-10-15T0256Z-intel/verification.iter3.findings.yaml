  item: "2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce"
  url_or_quote: "Other administrators report the same compromise, one noticing it because Nextcloud's integrity check failed on an unexpected PHP file, and one reports that the request still reached proxy.php after the app was deactivated"
  summary: "(low confidence) Issue 354 (https://github.com/CollaboraOnline/richdocumentscode/issues/354) attributes both facts to ONE commenter, UlliDieckmann: 2026-09-11 'Exactly the same happened to me. Fortunatly I updeted nextcloud so the integrity check failed as a php file called shx13a86.php was created' and 2026-09-14 'The http request from above still uses proxy.php from the deactivated app' (the same 14 Sep comment also opens 'I upgraded to 26.4.303 and the app is still activated', so the 'deactivated' remark is internally inconsistent). 'one ... and one' reads as two administrators. Fix: 'one administrator noticed it through a failed integrity check and later reported ...', or drop the deactivated-app clause now that Collabora's own advisory carries 'not sufficient to disable the app'."
