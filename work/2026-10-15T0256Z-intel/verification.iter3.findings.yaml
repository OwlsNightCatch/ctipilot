  item: "2026-10-15/fake-watchguard-vpn-client-site-credential-capture"
  url_or_quote: "leaving endpoint tools nothing to flag"
  summary: "(low confidence) Title and Detection ('the endpoint sees nothing malicious') overstate Huntress (https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing), which says 'there's no trojanized installer or malicious DLL for security defenses to flag' but also 'Huntress Managed Defender flagged the incident 21 seconds after the malicious domain loaded' (the entry's own body repeats this). An endpoint product did flag the activity. Fix: 'leaving no malicious file for endpoint tools to flag' and 'no malicious file or process, so the signal is in web proxy and DNS telemetry (Managed Defender did flag the browsing activity)'."
