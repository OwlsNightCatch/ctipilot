items:
  # -------------------------------------------------------------------------
  - title: "PK Softech supplier incident, Stadt Zürich pension fund: PKZH says it is not yet a PK Softech customer but is checking whether data from migration tests was in the attacked environment; SRF lists the City of Zurich fund among the potentially affected funds"
    overlap_with: "S4 item 'PK Softech supplier incident, developments of 2026-10-13/14' (same development, independently found; S4 also carries Publica's 2026-10-14 'no darkweb sign' status block). MERGE into one changelog record on the existing entry. S2 additions: SRF 2026-10-14 as an independent media corroboration, SRF 2026-10-10 on the mechanism, and the explicit contradiction below."
    sources:
      - { url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html", publisher: "Pensionskasse Stadt Zürich (PKZH)", date: "2026-10-13", role: "primary" }
      - { url: "https://www.srf.ch/news/schweiz/hackerangriffe-auf-firmen-gibt-es-mehr-cyberangriffe-auf-schweizer-unternehmen", publisher: "SRF", date: "2026-10-14", role: "corroborating" }
      - { url: "https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen", publisher: "SRF", date: "2026-10-10", role: "corroborating" }
      - { url: "https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG", publisher: "PK Softech AG", date: "2026-10-08", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'Cyberangriff auf Pensionskassen-Lieferant zieht Kreise', 2026-10-14T12:41:21Z, feed description read verbatim) -> article https://www.inside-it.ch/cyberangriff-auf-pensionskassen-lieferant-zieht-kreise-20261014 UNREADABLE (HTTP 429 Vercel Security Checkpoint on extract, url --direct, jina and WebFetch, one attempt each) -> pivot: pkzh.ch homepage https://www.pkzh.ch/de.html (top-news label 'Cyberangriff PK Softech', 13. Oktober 2026) -> primary: https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html -> independent corroboration: SRF 2026-10-14 (found via srf-news sitemap https://www.srf.ch/new-news-sitemap and https://www.srf.ch/news/schweiz listing) and SRF 2026-10-10 (found via WebSearch 'PK Softech Cyberangriff Pensionskassen Lieferant Datenabfluss Oktober 2026')."
    summary: |
      The Pensionskasse Stadt Zürich (PKZH), the municipal pension fund of the City of Zurich, published a notice on
      2026-10-13 saying that PK Softech AG, the supplier already covered in this incident, was hit at the end of
      September; that the PKZH currently runs on another vendor's administration system and that its move onto the
      PK Softech administration system is planned for early 2027, so the attack does not touch the system it uses
      today; and that it is still clarifying whether PKZH data is affected because of tests carried out ahead of that
      switch. It stresses that insured persons' pension assets are not affected. SRF's explainer of 2026-10-14 says
      several funds are potentially affected "darunter jene der Migros, der Post, des Bundes und der Stadt Zürich",
      per SRF's reading of other media, and adds that a software company attacked is one whose programs the funds use
      for customer administration. That blanket description is the outlet's simplification: PKZH's own notice says it is
      not yet a user, so the two statements differ on whether the City of Zurich fund's production system is
      concerned, and PKZH's own, narrower statement is the one to carry. SRF's 2026-10-10 explainer (security expert Marc
      Ruef, scip AG) gives the mechanism that fits the PKZH case as an expert opinion, not a finding about this
      incident: a supplier can receive data from live operations during tests or maintenance, including real insured
      persons' details, because anonymising test data is laborious and error-prone. Inside IT's 2026-10-14 teaser
      (RSS description only, article unreadable) adds that the BVK, the Canton of Zurich's pension fund, "gibt
      Entwarnung"; no BVK statement was found on bvk.ch (homepage and news listing checked), so that is an attributed,
      unverified claim. Still not public in any source read: the access vector, the actor, which fund's data is
      in what was copied. For Swiss public bodies mid-migration onto a supplier platform, the delta is the exposure
      class: a prospective customer's test or migration data can be in a supplier's environment before go-live.
    region_nexus: "Switzerland: communal (City of Zurich pension fund PKZH) in addition to the federal and cantonal funds already covered"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1199]
    affected_products: []
    entity_keys: ["incident:pk-softech-publica-cyberattack-2026-09"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_suggestion: "A2 (PKZH is a first-party notice by the owner of the statement; SRF corroborates that the fund is named among potentially affected ones but with a blanket description that PKZH's own notice narrows)"
    novelty: "update-of:2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    evidence:
      - quote: "Die PKZH klärt derzeit ab, ob aufgrund von Tests im Hinblick auf den Wechsel auch Daten der PKZH betroffen sind."
        attribution: "Pensionskasse Stadt Zürich (PKZH)"
        source_url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html"
      - quote: "Der Wechsel auf das Verwaltungssystem von PK Softech AG ist für Anfang 2027 vorgesehen."
        attribution: "Pensionskasse Stadt Zürich (PKZH)"
        source_url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html"
      - quote: "Verschiedene Pensionskassen sind potenziell von einem Datenklau betroffen, darunter jene der Migros, der Post, des Bundes und der Stadt Zürich, wie verschiedene Medien berichten."
        attribution: "SRF"
        source_url: "https://www.srf.ch/news/schweiz/hackerangriffe-auf-firmen-gibt-es-mehr-cyberangriffe-auf-schweizer-unternehmen"
      - quote: "Dabei kommt es vor, dass er Daten aus dem laufenden Betrieb erhält, also Angaben zu echten Versicherten."
        attribution: "SRF"
        source_url: "https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen"
    extended_notes: |
      Inside IT's article (https://www.inside-it.ch/cyberangriff-auf-pensionskassen-lieferant-zieht-kreise-20261014,
      RSS item published 2026-10-14T12:41:21Z) is deliberately NOT in sources: its body was unreadable on every
      transport. Its feed description reads verbatim: "Die Pensionskasse Stadt Zürich muss inmitten der Migration auf
      die Lösung von PK Softech einen möglichen Datenabfluss prüfen. Die BVK gibt unterdessen Entwarnung." The BPK
      director's earlier remark (Plattform J / Keystone-SDA 2026-10-09) that "zahlreiche andere Pensionskassen"
      are affected remains consistent with the widening picture. The existing entry's action (ask the supplier in
      writing what data of yours it holds) gains a concrete case: PKZH's data exposure, if any, arises from
      migration-test data, not from operating the system.

  # -------------------------------------------------------------------------
  - title: "Offerz (Swiss online voucher shop): copy of 115,000 customers' order data in a less-monitored test environment accessed 2026-10-07, found 2026-10-09; EDÖB and BACS informed"
    borderline: true
    borderline_reason: "No public-sector nexus and a consumer webshop, vector not stated. Returned only because it is the second Swiss incident in this fortnight (after PK Softech/PKZH) where a copy of real customer data sat in a test or migration environment that was monitored less than production, an exposure class that applies to any Swiss body whose external IT provider builds or migrates systems. The main agent may fold one sentence into the PK Softech entry or drop it."
    sources:
      - { url: "https://www.blick.ch/wirtschaft/hackerangriff-auf-onlinehaendler-offerz-115000-kunden-betroffen/jq5xb9b", publisher: "Blick", date: "2026-10-14", role: "primary" }
      - { url: "https://www.cash.ch/news/hackerangriff-auf-onlinehandler-offerz-115000-kundendaten-betroffen-976767", publisher: "cash.ch (AWP)", date: "2026-10-14", role: "corroborating" }
    discovery_trace: "first seen at: cash-ch-awp sitemap-news, URL https://www.cash.ch/sitemap-news.xml (2026-10-14T21:30:01 item) -> article https://www.cash.ch/news/hackerangriff-auf-onlinehandler-offerz-115000-kundendaten-betroffen-976767 (AWP, cites Blick) -> primary-adjacent: Blick, URL https://www.blick.ch/wirtschaft/hackerangriff-auf-onlinehaendler-offerz-115000-kunden-betroffen/jq5xb9b (found via blick-ch news sitemap https://www.blick.ch/news.xml, 2026-10-14T15:11:53, and quotes Offerz's own customer e-mail). Offerz's own site notice was searched for on https://www.offerz.ch/ (homepage 388 KB read, no incident text on the landing page), so the company statement is read only as quoted by Blick and AWP."
    summary: |
      Blick reported on 2026-10-14 (AWP relayed it) that unknown parties accessed a test environment of the Swiss
      voucher and gift-card webshop Offerz.ch in the night of 2026-10-07; Offerz found the access on the morning of
      2026-10-09. The environment held a copy of the shop's order data from January 2026: names, home and e-mail
      addresses, phone numbers, IP addresses and the payment-method type; Offerz says passwords and payment data were
      not in it. Offerz says it cannot prove the data left but assumes so, forced a password reset as a precaution,
      filed a criminal complaint and informed the EDÖB and the BACS. Per Offerz's own explanation as quoted by Blick,
      the copy was made during technical work, stored in cloud storage the test environment could reach, and should
      have been deleted afterwards; an external IT service provider operates the servers and develops the shop, and
      the test environment "war nicht im gleichen Mass überwacht wie die Produktivsysteme", which Offerz gives as
      the reason the access went unnoticed for about two days. Offerz also says its systems are the target of
      "massive Hackversuche" that continue. Vector, actor and any exfiltration remain unconfirmed.
    region_nexus: "Switzerland: private e-commerce, no public-sector customer base stated"
    primary_sector_nexus: "indirect"
    sector: "retail"
    cves: []
    techniques: []
    technique_note: "No ATT&CK id is evidence-bound: the sources do not state how the test environment was reached. T1530 (Data from Cloud Storage) is plausible given the cloud-storage copy but is not stated, so it is not proposed."
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:offerz-test-environment-order-data-2026-10", type: incident, name: "Offerz test-environment order-data breach (October 2026)", aliases: [],
          summary: "Access on 2026-10-07 to a test environment of the Swiss webshop Offerz.ch holding a January 2026 copy of order data of about 115,000 customers (names, addresses, phone numbers, IP addresses, payment-method type); found on 2026-10-09, reported by Blick on 2026-10-14; Offerz informed the EDÖB and BACS (Blick, AWP/cash.ch, 2026-10-14)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Die Testumgebung war nicht im gleichen Mass überwacht wie die Produktivsysteme"
        attribution: "Blick"
        source_url: "https://www.blick.ch/wirtschaft/hackerangriff-auf-onlinehaendler-offerz-115000-kunden-betroffen/jq5xb9b"
      - quote: "Der Zugriff erfolgte in der Nacht des 7. Oktober 2026 und wurde am Morgen des 9. Oktober 2026 entdeckt."
        attribution: "cash.ch (AWP)"
        source_url: "https://www.cash.ch/news/hackerangriff-auf-onlinehandler-offerz-115000-kundendaten-betroffen-976767"
      - quote: "Die Datei hätte nach Abschluss der Arbeiten gelöscht werden müssen."
        attribution: "cash.ch (AWP)"
        source_url: "https://www.cash.ch/news/hackerangriff-auf-onlinehandler-offerz-115000-kundendaten-betroffen-976767"

