    surface: "body"
    kind: cited
    text: "**Defender takeaway:** confirm Content Scanner Tools 25.3.0.5525 or later on every gateway today, since automatic updates deliver it and only gateways with updates disabled need the manual update, and run the log check on every one; for a virtual appliance with a compromise indicator, Cisco says to keep forensic data before upgrading, because upgrading a compromised instance destroys it, then deploy a new virtual machine on a fixed release, rebuild the configuration without importing an old file and renew credentials and cryptographic material (a physical appliance goes to Cisco TAC), and strongly recommends restoring every member of a cluster that contains a compromised appliance, since the cluster's SSH private keys could be accessed ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
