  - claim_id: 8d65451885
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-15T03:49:00Z"
    kind: record-summary
    text: "Censys's exposure report of 2026-10-14 points to three published 2025 AK-SM 800A flaws that Danfoss patched more than a year earlier and gives their firmware boundaries (4.3.1 or later fixes all three; Danfoss has not confirmed the vector), and shows exposed French controllers falling about 71 percent in three days with patched and unpatched builds leaving at the same rate, which Censys reads as operators taking units offline rather than patching."
  - claim_id: 3f9f19eb0e
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "immediate_action"
    kind: frontmatter
    text: "Verify Content Scanner Tools 25.3.0.5525 or later on every Cisco Secure Email Gateway and run Cisco's compromise check today: An unauthenticated attacker who sends one crafted attachment through a gateway with File Reputation enabled gets root, Cisco confirms exploitation, and no workaround exists. Update Content Scanner Tools (no restart) on every gateway that has automatic updates disabled, then check system_logs on every cluster member for Cisco's \"System Security\" messages; Cisco strongly recommends restoring a compromised appliance and every member of its cluster, because the cluster's SSH private keys could be accessed."
  - claim_id: 055843c769
