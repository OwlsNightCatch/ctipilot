    discovery_trace: "first seen at: WebSearch (\"Microsoft Threat Intelligence blog October 2026 new campaign\") surfaced the 2026-10-14 post → confirmed via bridge msft-secblog recent 12 (feed https://www.microsoft.com/en-us/security/blog/feed/) → primary: Microsoft post, URL https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/ → pivot to the partner named in it: Resecurity, URL https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem (first-hand: bought a licence and ran the kit in a lab). Not in the S3 slice (Microsoft blog is another domain's record); returned because it is in-window and new to the store."
    summary: |
      Microsoft Threat Intelligence and its Digital Crimes Unit describe a Chinese-language phishing supply chain and say the DCU, with law enforcement and partners, facilitated a disruption of its main developers and infrastructure. Three commercially licensed phishing-as-a-service kits, CoGUI (aka NX or FA), Haozi (aka Phoenix) and Iron Man System, are tracked as Storm-2990; Microsoft says they were developed by Chinese-speaking actors and have facilitated over one billion phishing emails and SMS messages to over 75,000 organisations worldwide since January 2026. The kits are sold through YAM Store (Storm-3119), which Microsoft calls an initial access broker: it hijacks Microsoft 365 and Azure for Education tenants, and Google environments, and resells the stolen accounts, licences and storage. Microsoft's five-stage pipeline: automated tenant reconnaissance (Flask tooling, via Tor); takeover through app-only admin panels that use a stolen application client secret to reset passwords silently (no forced change at next sign-in), assign education licences and grant privileged attributes; sign-in to a compromised Global Administrator account and self-provisioning of the PnP Management Shell service principal with broad Microsoft Graph permissions (including AppCatalog.ReadWrite.All) and full SharePoint API control, so SharePoint/OneDrive can be used as bulk hosting; a Cloudflare-fronted DNS platform for phishing domains; and a storefront paid via Alipay, WeChat Pay and USDT. Storm-3119 also automates the discovery of expired organisation names to reuse their legitimate customer information, and separately creates fraudulent organisations with supporting websites, likely using AI-generated content. Microsoft says Iron Man System ships over 2,335 templates for over 139 countries (Resecurity counts 2,360 templates across 130 countries) impersonating local government (traffic and parking fines), police, healthcare, finance, transport and retail brands, with geofencing, fake CAPTCHA gates, IP block lists, Telegram-bot alerts and a WebSocket channel that lets the operator steer the victim live. Downstream buyers used credential phishing, device-code phishing and card fraud. Microsoft names healthcare, finance, wholesale distribution and IT in Japan, the US, Australia and India as the observed victim set and says the activity "could affect any organization"; no Swiss victim or Swiss-specific lure is stated by either source. Resecurity, which bought a licence and ran the kit in an isolated lab, reports 911 published build versions and a lab instance impersonating a European parking-fine operator, and its page text cites a template added on 1 October 2026 (the page metadata says 2026-09-11, so it was evidently updated at or after the 2026-10-14 coordinated release).
    region_nexus: "global; kit templates cover 130-139 countries including local-government fine/parking and police lures; no Swiss-specific statement in either source"
    primary_sector_nexus: "indirect (generic mail and SMS lures against public authorities; compromised .edu/.org tenants as sending infrastructure; M365 Global Administrator takeover pattern)"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002, T1078.004, T1098.003, T1136.003, T1528, T1583.001]
    affected_products: ["Microsoft 365", "Microsoft Entra ID", "Microsoft Graph", "SharePoint Online", "Google Workspace"]
