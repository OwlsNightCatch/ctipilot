  # 3. ARTEX agentic pentest framework abused against South Korean financial firms
  # ------------------------------------------------------------------
  - title: "ARTEX: a Chinese-speaking, financially motivated operator drives an open-source agentic pentest framework against South Korean financial firms' peripheral web apps and exfiltrates PII of about 67,000 people (Zscaler, CrowdStrike)"
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean", publisher: "Zscaler ThreatLabz", date: "2026-10-14", role: "primary" }
      - { url: "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/", publisher: "CrowdStrike Intelligence", date: "2026-10-07", role: "primary" }
      - { url: "https://www.sans.org/newsletters/newsbites/xxviii-76", publisher: "SANS NewsBites (practitioner commentary)", date: "2026-10-13", role: "corroborating" }
    discovery_trace: "first seen at: zscaler-threatlabz, feed https://www.zscaler.com/blogs/feeds/security-research (item dated 2026-10-14T23:20Z) → primary (no pivot needed): https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean (extract) → pivot: Check Point weekly bulletin https://research.checkpoint.com/2026/12th-october-threat-intelligence-report/ (fetched, lead only) linked CrowdStrike → corroborating primary: https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/ (extract; page date metadata 2026-10-13 is the modified date, the raw page says published October 07, 2026) → SANS NewsBites https://www.sans.org/newsletters/newsbites/xxviii-76 (fetched via WebSearch-discovered issue URL)."
    summary: |
      Two telemetry-holding labs independently describe a campaign that ran from late September to early October 2026 against several South Korean financial institutions, with ARTEX, a recently released open-source agentic penetration-testing framework developed in China, driving the intrusions. CrowdStrike found actor-controlled open directories holding Claude Code session histories, ARTEX configuration and memory files, and Zscaler describes the harness (planner, worker agents, reporting) and the outcome: exploitation of peripheral internet-facing web applications outside core banking, namely customer-facing inquiry portals and employee-facing mobile-application back ends, through SQL injection and authentication bypass, and exfiltration of full names, phone numbers, annual income and loan limits for approximately 67,000 individuals (Zscaler; the number of affected organisations is unconfirmed, CrowdStrike). Both labs report the same backends: DeepSeek v4.1-flash as primary LLM, with GLM-5.3 (Zhipu) and Grok 4.6 as supplementary reasoning models; CrowdStrike adds a two-server architecture and likely access to DeepSeek through an API reseller, and that the operator used Claude Code sessions to ask where Korean breach data is sold. Zscaler notes ARTEX's default scope blocklist excludes government and education domains but not financial institutions, and that the developer closed the source after the abuse became public (forks and earlier downloads remain). Attribution is hedged by both: CrowdStrike says the actor is unnamed and "likely a Chinese speaker and financially motivated" (moderate confidence); Zscaler assesses a financially motivated Chinese-speaking actor with moderate confidence. CrowdStrike also recovered personal details of a possible operator from a prompt but says they cannot be definitively tied to the actor. The technique class matters more than the geography: LLM-driven tooling is lowering the cost of finding and chaining ordinary web flaws (injection, missing server-side authorisation) on the least-hardened internet-facing portals of an organisation.
    region_nexus: "South Korea (financial sector); technique class applies to any organisation's peripheral web applications"
    primary_sector_nexus: "indirect (same weak points as citizen and partner portals, inquiry forms and mobile-app back ends of public bodies); no Swiss victim"
    sector: "financial-services"
    cves: []
    techniques: [T1190, T1595.002, T1588.007]
    affected_products: ["ARTEX (open-source agentic pentest framework)", "customer-facing inquiry portals and employee mobile-app back ends (unnamed)"]
    entity_keys: ["product:anthropic-claude-code"]
    new_entities:
      - { key: "tool:artex", type: tool, name: "ARTEX", aliases: [],
          summary: "Open-source agentic penetration-testing framework developed in China (GitHub developer 'Autumn-27' per Zscaler) that orchestrates multiple LLM backends to automate reconnaissance, exploitation and reporting; abused against South Korean financial institutions in late September to early October 2026, after which the developer closed the source (Zscaler, 2026-10-14; CrowdStrike, 2026-10-07)." }
    relation_suggestions: []
    related_entries:
      - "2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system"
      - "2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan"
      - "2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ARTEX is an open source agentic penetration testing framework developed in China that uses large language models (LLMs) to automate reconnaissance and exploitation tasks."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean"
      - quote: "The threat actor exploited peripheral internet-facing web applications, including customer-facing inquiry portals and employee-facing mobile application backends."
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean"
      - quote: "While this activity has not been attributed to a named adversary, the threat actor is likely a Chinese speaker and financially motivated."
        attribution: "CrowdStrike Intelligence"
        source_url: "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"
    extended_notes: |
      - Defender levers stated by Zscaler: alert on sequential lookups and unusually high numbers of records accessed per session on partner and employee portals, rate-limit affected endpoints, enforce server-side authorisation and return only the fields an operation needs; repeat authorisation testing as applications change; treat open-source pentest harnesses as hostile code if you use one (isolate from production, no production credentials, enforce scope in configuration and code rather than prompts, review forks before execution).
      - Zscaler's behavioural-indicator table (flagged by Zscaler as leads to investigate alongside other evidence, not detections on their own): high-frequency automated requests with sequential enumeration against login and search endpoints; bulk outbound transfers of structured personal and financial data over HTTPS; unexpected .aspx or .jsp files in odd web paths (web-shell check); egress from servers to LLM provider APIs (anthropic, deepseek, bigmodel, x.ai). The last one is a post-compromise-tooling hunt only if the server has no business reason to call an LLM API.
      - SANS NewsBites 2026-10-13 carries the CrowdStrike item, with an editor noting "at least 68,000 people" were affected; treat as press arithmetic, not a primary figure (Zscaler says approximately 67,000).
      - The CrowdStrike post is dated 2026-10-07 (outside the 26 h window); Zscaler's 2026-10-14 post is the in-window delta and adds the 67,000 figure, the guardrail-scope detail, the developer's closure of the source and the portal-hardening guidance.
    borderline: false
    classification_hint: "B1 (two independent labs, consistent on backends, timing and attribution hedging)"

