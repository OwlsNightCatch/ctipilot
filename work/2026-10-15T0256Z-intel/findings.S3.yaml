        attribution: "Resecurity"
        source_url: "https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem"
    extended_notes: |
      Triage-relevant mechanics a composer can use (all from the Microsoft post unless stated):
      - Exposure: any Microsoft 365 / Entra tenant. The identity-side hunt is for the tenant-takeover behaviours Storm-3119 uses (app-only authentication with a stolen client secret, silent password resets, a self-provisioned PnP Management Shell service principal holding broad Graph and SharePoint permissions, unexpected education licence assignment). Microsoft's own recommended hardening: lock down Global Administrator roles (least privilege), phishing-resistant MFA and passkeys via Conditional Access for privileged accounts, restrict MFA/passkey registration to trusted locations and devices, Safe Links applied to internal recipients.
      - Device-code phishing is named as a downstream technique; Microsoft notes the Entra sign-in prompt that names the application being authorised (since 2021) is often missing from phishing sign-ins. A control that blocks or restricts the device-code flow is the hardening lever for tenants that do not need it (not stated by Microsoft in these words; composer should not attribute it).
      - Benign-lookalike discriminator is limited: the lures are ordinary urgency-style fine/toll/parking/police themes; the kit-side tells are geofenced or CAPTCHA-gated pages that do not load for scanners, and live operator-in-the-loop credential entry (Telegram real-time alerts). No Swiss-specific lure or victim is stated by either source.
      - Both sources are vendor/partner telemetry; the DCU disruption details sit behind aka.ms/YamCOGUIIronMan and a Microsoft On the Issues post (not fetched). Treat the disruption as Microsoft's claim; neither source says the infrastructure is gone for good (Resecurity says builds were published within the week of its report).
      - Count discrepancy to preserve: Microsoft 2,335+ templates / 139+ countries vs Resecurity 2,360 templates / 130 countries.
    borderline: true
    borderline_reason: "Not Swiss-specific and the named victim sectors are healthcare, finance, wholesale and IT in JP/US/AU/IN; included because the tenant-takeover pipeline (PnP Management Shell service principal, app-only password resets) and the local-government/police lure templates are concrete for a Microsoft-365-heavy public sector. Main agent to weigh against PD-11. Another sub-agent (S2 law-enforcement / S4) may surface the same Microsoft post; fold on the entity keys."
    classification_hint: "B2 (Microsoft first-party telemetry plus Resecurity's independent first-hand lab work)"

