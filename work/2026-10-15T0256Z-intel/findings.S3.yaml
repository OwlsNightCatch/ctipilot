      - quote: "self-provisions the PnP Management Shell service principal"
        attribution: "Microsoft Threat Intelligence / Digital Crimes Unit"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/"
