  # 1. Microsoft DCU / Resecurity: Storm-2990 phishing kits + Storm-3119 YAM Store
  # ------------------------------------------------------------------
  - title: "Storm-2990 / Storm-3119 (YAM Store): a Chinese-language phishing-kit ecosystem built on hijacked Microsoft 365 and Google tenants, disrupted by Microsoft DCU after over one billion messages"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/", publisher: "Microsoft Threat Intelligence / Digital Crimes Unit", date: "2026-10-14", role: "primary" }
