    discovery_trace: "first seen at: helpnetsecurity, front page https://www.helpnetsecurity.com/ (extract; dated anchor .../2026/10/13/slugfest-npm-trusted-publishing-flaw/) → article https://www.helpnetsecurity.com/2026/10/13/slugfest-npm-trusted-publishing-flaw/ (extract; links the GitHub changelog, no Bloom link) → pivot: GitHub changelog https://github.blog/changelog/2026-10-02-unvalidated-npm-trusted-publishing-configurations-now-expire/ (extract) → WebSearch (\"bloom.security npm trusted publishing slug claimable repository package takeover provenance attestation\", extended) → primary: Bloom write-up https://bloom.security/blog/slugfest-millions-of-ai-agents-download-exposed-npm-packages (extract)."
    summary: |
      Bloom Security reports that npm's Trusted Publishing, generally available since July 2025 and meant to replace long-lived publish tokens, identified the permitted GitHub repository only by its owner/repo name (the "slug") and the workflow file name, and recorded GitHub's permanent numeric repository and owner IDs only after a binding's first successful publish. If the bound repository was renamed, transferred or deleted, or its owner account was renamed or deleted before that first publish, the slug became claimable: an attacker creates a repository at the freed name, adds a workflow file with the matching name, requests a GitHub OIDC token and exchanges it at npm for a short-lived publish credential, with no maintainer credential or account touched. A release published this way carries a valid Sigstore provenance attestation naming the attacker's repository. Bloom says it demonstrated the attack end to end on an npm scope and repositories it controls, scanned the registry and counted more than 1,500 exposed packages with over 10 million total downloads (and more than a million a month), and that npm's GitLab trusted-publishing integration has the same weakness; it does not publish the package list. Bloom reported through GitHub's HackerOne programme on 2026-06-06 (validated 2026-06-09, last reply 2026-07-08, then silence) and found a fix in place when it re-tested before publishing. GitHub's changelog of 2026-10-02 says unvalidated trusted-publishing configurations now expire 48 hours after creation and can no longer authorise publishing, that a configuration is validated and exempt from expiry after its first successful publish, and that npm now also rejects trusted-publishing tokens from GitHub Actions issue_comment events. Help Net Security reports that GitHub's statement does not say whether configurations created before the change were bound retroactively, and that Bloom's researcher says it is unknown whether anyone exploited the flaw in the wild. GitHub already retires repository names with more than 100 clones in the week before an owner rename or deletion, which protects some packages. Bloom frames the finding around AI coding agents, estimating from customer telemetry about 70 agent-installed packages a month per endpoint and close to 350 on developer machines; that figure is a vendor claim from a vendor that sells agent-install controls.
    region_nexus: "global (npm ecosystem); applies to any Swiss body or supplier that publishes or consumes npm packages"
    primary_sector_nexus: "indirect (software supply chain of suppliers and in-house development teams)"
    sector: "technology"
    cves: []
    techniques: [T1195.002]
    affected_products: ["npm Trusted Publishing (GitHub Actions OIDC)", "npm trusted publishing with GitLab CI/CD"]
    entity_keys: ["product:npm", "product:github-actions"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "It records the repository’s address, such as bloom/repository, instead of the permanent ID GitHub assigns it, at least until a version is first published from that repository."
        attribution: "Bloom Security"
        source_url: "https://bloom.security/blog/slugfest-millions-of-ai-agents-download-exposed-npm-packages"
      - quote: "Unvalidated npm trusted publishing configurations now expire 48 hours after creation and can no longer authorize publishing."
        attribution: "GitHub Changelog"
        source_url: "https://github.blog/changelog/2026-10-02-unvalidated-npm-trusted-publishing-configurations-now-expire/"
      - quote: "Myers said it is unknown whether anyone exploited the flaw in the wild."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/10/13/slugfest-npm-trusted-publishing-flaw/"
    extended_notes: |
      - Maintainer hardening (Bloom, Help Net Security): run npm trust list for each package and confirm every listed repository still resolves to one you control; delete and re-create any binding that points at a renamed or transferred repository; remove the binding before deleting a repository.
      - Consumer-side check (Help Net Security): verify that a package's provenance attestation names the repository the project is supposed to come from; a valid attestation alone is not proof (the attacker's release also carries one).
      - Open question to preserve: whether bindings created before 2026-10-02 are covered retroactively is not stated by GitHub; Bloom says the same weakness exists in npm's GitLab integration. No in-the-wild exploitation is known.
      - Precondition detail: the attack needs a binding whose repository never published (once a publish occurs the immutable ID is recorded), so the exposed set is configurations created but unused.
    borderline: true
    borderline_reason: "No in-the-wild exploitation known and a fix is in place; relevance to the constituency is only via suppliers and in-house teams that publish npm packages. Concrete hardening step exists (npm trust list), so returned for the main agent to weigh against PD-11."
    classification_hint: "B2 (primary researcher write-up plus GitHub's own changelog and a trade-press report quoting GitHub; the 1,500-package count is Bloom's alone)"

