      - { subject: "actor:storm-2990", object: "tool:iron-man-system-phishing-kit",
          basis: "Microsoft tracks the developers of the Iron Man System, CoGUI and Haozi kits together as Storm-2990 (Microsoft, 2026-10-14)" }
