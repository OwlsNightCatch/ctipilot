      Check Point Research's assessment of the LiteLLM gateway (tested on 1.77.7) explains how a missing role check chains into full compromise for any authenticated user, including the baseline Internal User role. The POST /config/update handler depends only on the generic key-authentication dependency and never checks for the PROXY_ADMIN role, and UI session tokens, which carry the special litellm-dashboard team, are routed to a permissive UI-route allowlist that uses startswith matching on "/config", so /config/update is reachable. Through that one endpoint Check Point shows three paths: arbitrary file read by injecting UI_LOGO_PATH into the process environment and calling /get_image; administrator takeover by overwriting UI_USERNAME and UI_PASSWORD; and remote code execution by registering a pass-through endpoint whose target starts with s3:// or gcs://, which makes get_instance_fn download a Python file and run it with exec_module. A separate SSRF (CVE-2026-59823) lets an authenticated caller put an api_base inside the user_config request parameter, which the is_request_body_safe guard did not inspect, redirecting the proxy's provider call to a host of the caller's choosing and leaking the provider API key. Check Point also notes password hashes exposed to low-privilege users and stored as a single unsalted hash. The missing-authorisation flaw is CVE-2026-35029, which SEC Consult had published on 2026-02-24 for 1.81.12 (with a file-read and environment-exfiltration route through pass-through endpoints), so Check Point's new detail is the RCE and admin-takeover paths and the root cause; the SSRF's vendor advisory (GHSA-hx8v-g79f-8w5f) lists affected versions up to 1.83.8, patched in 1.83.9, released 2026-04-17, and states that exploitation requires a valid virtual key. Check Point says all findings are resolved as of 1.83.9; no source here reports in-the-wild exploitation of these two CVEs.
    region_nexus: "global (self-hosted AI gateway)"
    primary_sector_nexus: "indirect (organisations self-hosting an LLM gateway; no Swiss deployment stated)"
    sector: "technology"
    cves: [CVE-2026-35029, CVE-2026-59823]
    techniques: [T1190, T1059.006, T1552.001]
    affected_products: ["LiteLLM Proxy (BerriAI)"]
    entity_keys: ["product:litellm"]
    new_entities: []
    relation_suggestions: []
    related_entries:
      - "2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i"
      - "2026-06-09/cve-2026-42271-berriai-litellm-low-privilege-command-injecti"
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The most significant issues stemmed from a missing authorization check on the /config/update endpoint"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/when-llm-gateways-go-wrong-findings-from-litellm/"
      - quote: "Upgrade to 1.83.9 or later (released 2026-04-17)."
        attribution: "BerriAI LiteLLM GitHub Security Advisory"
        source_url: "https://github.com/BerriAI/litellm/security/advisories/GHSA-hx8v-g79f-8w5f"
      - quote: "low-privileged users can access this endpoint without restriction"
        attribution: "SEC Consult"
        source_url: "https://sec-consult.com/vulnerability-lab/advisory/broken-access-control-in-config-endpoint-in-litellm/"
    extended_notes: |
      - Patch state discrepancy to resolve before composing: SEC Consult lists CVE-2026-35029 as fixed in v1.83.0-nightly / affecting up to 1.83.0; the GHSA for CVE-2026-59823 lists <= 1.83.8 affected and 1.83.9 patched. Upgrade to 1.83.9 or later covers both; Check Point states 1.83.9.
      - Exposure check: the management plane (UI and /config/update) reachable by any authenticated LiteLLM user; self-hosted LiteLLM versions below 1.83.9. Post-patch compromise check: look for changes to the proxy's stored configuration (environment variables such as UI_USERNAME, UI_PASSWORD, UI_LOGO_PATH; pass-through endpoints with s3:// or gcs:// targets) and outbound fetches from the proxy host to object storage it should not use; rotate provider API keys held by the proxy if any non-admin account was untrusted.
      - The store already carries several LiteLLM entries (pre-auth SQL injection, low-privilege command injection, Obsidian three-CVE chain, callback-hook forgery, a botnet scanning for LiteLLM); this is a fourth distinct low-privilege-to-RCE route on the same product, but Check Point's disclosure is a write-up of flaws fixed in April.
    borderline: true
    borderline_reason: "Write-up of flaws fixed in April (1.83.9 released 2026-04-17; CVE-2026-35029 first disclosed by SEC Consult 2026-02-24), authenticated-user prerequisite, no exploitation reported, and the store already has five LiteLLM entries. Returned only because the RCE/admin-takeover chain and route-prefix root cause are new detail; main agent likely to drop."
    classification_hint: "B2 (original research with a vendor advisory confirming the fix)"

