  # 2. Huntress: fake WatchGuard VPN download site harvests SSL VPN credentials, then serves the real signed installer
  # ------------------------------------------------------------------
  - title: "Fake VPN-client download sites now harvest the SSL VPN server, login and password in the browser and then hand over the genuine signed installer, leaving endpoint tools nothing to flag (Huntress)"
    sources:
      - { url: "https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing", publisher: "Huntress", date: "2026-10-13", role: "primary" }
      - { url: "https://www.watchguard.com/wgrd-security-hub/secplicity-blog/ongoing-widespread-credential-harvesting-campaign-targets-vpn", publisher: "WatchGuard Secplicity", date: "2026-01-13", role: "background" }
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/03/12/storm-2561-uses-seo-poisoning-to-distribute-fake-vpn-clients-for-credential-theft/", publisher: "Microsoft Threat Intelligence", date: "2026-03-12", role: "background" }
    discovery_trace: "first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (item dated 2026-10-13T21:00Z) → primary (no pivot needed): https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing (extract) → pivots from its Background paragraph: WatchGuard Secplicity https://www.watchguard.com/wgrd-security-hub/secplicity-blog/ongoing-widespread-credential-harvesting-campaign-targets-vpn and Microsoft https://www.microsoft.com/en-us/security/blog/2026/03/12/storm-2561-uses-seo-poisoning-to-distribute-fake-vpn-clients-for-credential-theft/ (both fetched with extract)."
    summary: |
      Huntress's SOC investigated an incident on 2026-10-07 in which an administrator at a managed service provider searched Bing for a misspelled "watchguard vpn download" and clicked through the standard bing.com/ck/a result redirect to a lookalike site titled "WatchGuard Firebox VPN Client" (Huntress classes it as SEO poisoning rather than malvertising). Choosing any download option opens a modal that asks for Server, Login and Password, which is plausible because the genuine Mobile VPN with SSL client asks for the same three values at connect time. The capture logic is one unobfuscated JavaScript file of about 150 lines that posts the JSON to a separate collector domain; the first submission is always rejected with an "incorrect data" message so the victim re-types or tries a second credential set, and only after the second submission does the page fetch the real, validly Authenticode-signed WatchGuard installer from WatchGuard's own CDN. Because nothing malicious is delivered, endpoint controls have no file to detect, and few reputation engines flagged either domain (Huntress: seven VirusTotal vendors on the lure, two on the collector, as of 2026-10-08). Huntress Managed Defender flagged the session 21 seconds after the lookalike domain loaded and, in this case, browser history showed no download, so the user probably did not finish both rounds, but may have typed credentials in the first. The lure domain was re-registered on 2026-08-22 and the collector on 2026-09-14; the lure domain was already listed in WatchGuard's January 2026 research, which found lookalike infrastructure for 15 products, mostly VPN and remote-access clients (WatchGuard, F5 BIG-IP, FortiClient, SonicWall NetExtender, Sophos Connect with live credential theft, plus Cisco AnyConnect, Palo Alto GlobalProtect, Check Point, Citrix, Ivanti, OpenConnect and others staged) and assessed it as a likely ransomware-affiliate access source; Microsoft attributed a wider iteration to Storm-2561 in March 2026. Huntress says the available evidence does not establish that the 2026 re-registration is run by the same operators and does not itself attribute the October activity to Storm-2561.
    region_nexus: "global; vendor-agnostic across SSL VPN products used by public-sector networks (Fortinet FortiClient, Cisco AnyConnect, GlobalProtect, Check Point, Citrix, Ivanti, SonicWall, F5)"
    primary_sector_nexus: "direct-relevant technique class (administrators and staff of public bodies and their MSPs fetch VPN clients by search engine); no Swiss victim stated"
    sector: "public-sector"
    cves: []
    techniques: [T1608.006, T1583.001]
    affected_products: ["WatchGuard Mobile VPN with SSL", "WatchGuard Firebox SSL VPN", "FortiClient VPN", "SonicWall NetExtender", "Sophos Connect", "F5 BIG-IP Edge Client"]
    entity_keys: ["product:watchguard-firebox", "product:fortinet-forticlient"]
    new_entities:
      - { key: "actor:storm-2561", type: actor, name: "Storm-2561", aliases: [],
          summary: "Microsoft designation for a financially motivated cluster active since May 2025 that uses SEO poisoning and vendor impersonation to distribute trojanised VPN clients that steal credentials (Microsoft, 2026-03-12); Huntress does not attribute its 2026-10 WatchGuard lookalike incident to this cluster." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Rather than downloading a fake client, the domain instead downloads a genuine, validly signed WatchGuard installer."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"
      - quote: "The phishing logic lives in a single file, `popup.js`, about 150 lines of plain, unobfuscated JavaScript."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"
      - quote: "Monitor for SSL VPN logins from hosting providers, unfamiliar ASNs, or countries where the account has never connected from."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"
      - quote: "Based on the aforementioned reporting, it’s likely this is a ransomware affiliate using these credentials to gain a foothold in networks with the intent to deploy ransomware, such as Akira."
        attribution: "WatchGuard Secplicity"
        source_url: "https://www.watchguard.com/wgrd-security-hub/secplicity-blog/ongoing-widespread-credential-harvesting-campaign-targets-vpn"
    extended_notes: |
      - Exposure: any organisation whose administrators or MSP staff download VPN or remote-access clients from a search engine; the January WatchGuard research lists lookalike infrastructure for 15 products and live credential theft for five (WatchGuard, F5 BIG-IP, FortiClient, SonicWall NetExtender, Sophos Connect).
      - Detection (telemetry classes): web proxy / DNS logs for visits to recently registered lookalike domains of VPN vendors reached through a search-engine redirect (bing.com/ck/a click-through); a browser POST of server/login/password JSON to an unrelated domain from a "download" page; VPN gateway authentication logs for logins from hosting-provider ASNs or never-seen countries after such a visit (Huntress). Post-incident (Huntress): reset the password for every account the user may have typed into the page and treat the VPN endpoint named in the "Server" field as known to the attacker; the first submission is forced to fail, so assume two credential sets may have been captured.
      - Triage discriminator (follows from the described mechanism): the genuine client asks for server/login/password when it connects; a web page that asks for them BEFORE serving a download is the tell. The final installer is the genuine signed one, so a hash or signature check on the downloaded file does not clear the session.
      - Hardening named by Huntress: enforce MFA on the VPN; publish and bookmark official VPN-client download links (for WatchGuard, software.watchguard.com) in client documentation; block the lookalike domains.
      - ATT&CK note: ATT&CK has no exact technique for a search-delivered credential-harvest form that is not an email lure; only the infrastructure and SEO-poisoning techniques are mapped. Do not map T1078/T1133 (follow-on VPN login is not observed in this incident).
    borderline: false
    classification_hint: "B2 (Huntress first-hand SOC incident; the campaign class is corroborated by WatchGuard and Microsoft, the specific 2026-10 iteration by Huntress alone)"

