claims:
  - claim_id: 58421f047c
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "headline"
    kind: frontmatter
    text: "Exploited Nextcloud Collabora CODE app flaw: disabling the app does not help; update to 26.4.303 or remove it"
  - claim_id: 2f0a946c62
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-110447 is an OS command injection in proxy.php of the Collabora Online Built-in CODE Server, the richdocumentscode app that runs Collabora inside Nextcloud; versions before 26.4.303 are affected, the GitHub advisory record says it was exploited in the wild in September and October 2026, and a hoster reported web shells on its Nextcloud servers on 2026-09-11. Disabling the app does not stop the request, so it must be updated to 26.4.303 or removed; standalone Collabora Online servers are not affected."
  - claim_id: f2956de500
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the Collabora Online Built-in CODE Server app (richdocumentscode) to 26.4.303 or remove it on every Nextcloud server that runs it; disabling the app does not stop the request, and on Nextcloud 29 or older, which is end of life, upgrade Nextcloud or remove the app."
  - claim_id: 112efb9b62
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "On each such server, search the web access logs back to at least early September 2026 for requests to apps/richdocumentscode/proxy.php that carry $( or an encoded .. in the path, and the app directory for PHP files that are not part of the release; on a hit, treat every secret the web server account can read as exposed and rotate it."
  - claim_id: 388a8233bc
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "cves[CVE-2026-110447]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-110447\", \"cvss\": \"9.2\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"Collabora Online Built-in CODE Server (the richdocumentscode app for Nextcloud) before 26.4.303, exploitable while the built-in CODE server is not running (after a restart, an upgrade or a crash)\", \"fixed\": \"26.4.303 or later; removing the app also closes it, disabling it does not; on Nextcloud 29 or older (end of life) upgrade Nextcloud or remove the app\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: b769d05530
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "Collabora's own advisory, published 2026-10-14, says users of Nextcloud with the Collabora Online Built-in CODE Server app (richdocumentscode) can be vulnerable through proxy.php: a request can run an operating system command as the web server user, the attack works only while the built-in CODE server is not running (after a restart, an upgrade or a crash), and disabling the app is not sufficient, it must be upgraded to 26.4.303 or later or removed ("
    urls: ["https://github.com/CollaboraOnline/online/security/advisories/GHSA-g3vx-3m76-fghh"]
  - claim_id: 7f8a35d176
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "Users of end-of-life Nextcloud 29 or older should upgrade Nextcloud or remove the app, standalone Collabora Online servers are not affected, and the fix for CVE-2025-66208 does not prevent this flaw ("
    urls: ["https://github.com/CollaboraOnline/online/security/advisories/GHSA-g3vx-3m76-fghh"]
  - claim_id: d0343b6de6
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "The GitHub Advisory Database record for CVE-2026-110447 says it was exploited in the wild in September and October 2026 ("
    urls: ["https://github.com/advisories/GHSA-f97p-r72q-64h2"]
  - claim_id: e470b0fdbb
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "Field reports came first: on 2026-09-11 a hoster reported on the app's issue tracker that several Nextcloud servers running richdocumentscode 26.4.302 had been compromised since the previous day through requests to proxy.php that carried shell command substitution and an encoded path traversal, with base64 payloads decoded and run through a shell to create PHP web shells in the app directory; on one server the attacker then searched for password-manager databases and cryptocurrency-wallet files, and the reviewed requests showed no archiving or upload commands ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: 0ee96e6b83
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "Other administrators report the same compromise, one noticing it because Nextcloud's integrity check failed on an unexpected PHP file, and one reports that the request still reached proxy.php after the app was deactivated ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: f692ce310d
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "The maintainers answered that the flaw affects only the Development Edition in the Built-in CODE Server mode that downloads a local AppImage, and that leftover web-shell files must be removed after upgrading ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: c56a31dc0b
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "A Nextcloud forum post of 2026-10-03 told users to update, saying that as far as the poster knew no CVE existed ("
    urls: ["https://help.nextcloud.com/t/to-collabora-built-in-user-update-asap/250516"]
  - claim_id: f09485325b
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** a Nextcloud server with the \"Collabora Online - Built-in CODE Server\" app at 26.4.302 or older, including one patched for CVE-2025-66208; a restart, an upgrade or a crash that stops the built-in CODE server opens the window, and deactivating the app does not close it ("
    urls: ["https://github.com/CollaboraOnline/online/security/advisories/GHSA-g3vx-3m76-fghh"]
  - claim_id: 4a35c24fa9
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "**Detection:** in web access logs, requests to the app's proxy.php whose path carries `$(` command substitution and an encoded `..`; in file telemetry, unexpected PHP files in the app directory, which Nextcloud's integrity check flagged on a compromised server; in process telemetry, the web server account starting a shell that decodes base64 and calls out with curl or wget to an external service ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: 586f6a5359
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "The web shell survives the update, so the post-patch check is the same file and process search, and the reporter says secrets available to the web server account must be treated as potentially affected ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: 65b2172e9c
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update the app to 26.4.303 or remove it on every Nextcloud server that has it, because disabling it does not stop the request, and on Nextcloud 29 or older upgrade Nextcloud or remove the app ("
    urls: ["https://github.com/CollaboraOnline/online/security/advisories/GHSA-g3vx-3m76-fghh"]
  - claim_id: 3ed1b5c9c7
    entry: 2026-10-15/cve-2026-110447-collabora-code-server-nextcloud-rce
    surface: "body"
    kind: cited
    text: "); then search for dropped PHP files and the request pattern back to at least early September 2026, and on a hit rotate whatever the web server account can read ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
