    surface: "body"
    kind: cited
    text: "For a controller that may have been taken over, CERT-FR's sequence is to remove the internet exposure, factory-reset the unit, restore access only through a secure VPN or protected network, reconfigure it and apply the maker's practices, which for Danfoss means updating the firmware, setting the security level to Strict and confirming the default passwords were changed ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/"]
