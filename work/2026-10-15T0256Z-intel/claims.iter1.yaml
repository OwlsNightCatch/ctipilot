claims:
  - claim_id: 1e357e2b07
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with the Bernische Pensionskasse or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope, because the Bernische Pensionskasse says it has no indication of theft but cannot exclude it and the Bernische Lehrerversicherungskasse is still checking whether and to what extent its data is affected."
  - claim_id: 5543a5d49d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment and what it holds: the Bernische Pensionskasse says it sees no indication of theft, the Bernische Lehrerversicherungskasse and Pensionskasse Post say the scope is under review, the Pensionskasse Stadt Zürich, not yet a customer, is checking whether data from its migration tests was affected, Publica says personal data has presumably left, and the supplier says data must be assumed to have left."
  - claim_id: d36fd4d837
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-15T03:48:00Z"
    kind: cited
    text: "The first communal pension fund has commented, and its position differs from the others: the Pensionskasse Stadt Zürich (PKZH), the City of Zurich's fund, says in a notice dated 2026-10-13 that PK Softech was hit at the end of September, that it currently works with another software provider and plans to move to PK Softech's administration system in early 2027, so the attack does not touch the system it uses today, and that it is still clarifying whether, because of tests carried out ahead of that switch, PKZH data is also affected ("
    urls: ["https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html"]
  - claim_id: ad35591d8a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-15T03:48:00Z"
    kind: cited
