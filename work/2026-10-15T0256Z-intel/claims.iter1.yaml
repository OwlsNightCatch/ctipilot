  - claim_id: 620559b995
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "headline"
    kind: frontmatter
    text: "Cisco's mail gateway has a second exploited root flaw in four weeks; the fix ships as a Content Scanner Tools update"
  - claim_id: d191538f56
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory of 2026-10-14 fixes CVE-2026-76519, a relative path traversal in the Advanced Malware Protection (file reputation) path of Cisco Secure Email Gateway that lets an unauthenticated attacker who sends one crafted attachment through the device write files and run commands as root (CVSS 9.8); Cisco says its PSIRT became aware of exploitation in October 2026, and CISA listed the flaw in KEV the same day. Only gateways with File Reputation enabled on a mail policy and Content Scanner Tools earlier than 25.3.0.5525 are exposed; there is no workaround, and the fix ships as a Content Scanner Tools update that needs no restart or upgrade, and in AsyncOS 15.5.5-014 and 16.5.0-780."
  - claim_id: b40e7e8b8b
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "immediate_action"
    kind: frontmatter
    text: "Verify Content Scanner Tools 25.3.0.5525 or later on every Cisco Secure Email Gateway and run Cisco's compromise check today: An unauthenticated attacker who sends one crafted attachment through a gateway with File Reputation enabled gets root, Cisco confirms exploitation, and no workaround exists. Update Content Scanner Tools (no restart) on every gateway that has automatic updates disabled, then check system_logs on every cluster member for Cisco's \"System Security\" messages; a compromised appliance must be rebuilt, and so must every member of its cluster, because the cluster's SSH private keys can be read."
  - claim_id: 8f1c235d2f
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "actions[0]"
    kind: frontmatter
    text: "Run contentscannerstatus on every Cisco Secure Email Gateway that has File Reputation enabled in a mail policy and update Content Scanner Tools to 25.3.0.5525 or later with contentscannerupdate wherever automatic updates are off; the update needs no restart."
  - claim_id: 4108442b3f
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such gateway, and on each member of a cluster, run grep \"System Security\" system_logs now: on a suspected-compromise message keep the forensic data before upgrading, then follow Cisco's recovery steps (a new virtual machine on a fixed release with a fresh configuration and renewed credentials for a virtual appliance, Cisco TAC for a physical one) for every member of that cluster."
  - claim_id: bc80d8c33a
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "cves[CVE-2026-76519]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-76519\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Cisco Secure Email Gateway (physical and virtual) with the File Reputation service enabled and assigned to a mail policy and Content Scanner Tools earlier than 25.3.0.5525\", \"fixed\": \"Content Scanner Tools 25.3.0.5525 or later (no software upgrade or restart); AsyncOS 15.5.5-014 (15.5), 16.5.0-780 (16.5); 16.0 must migrate to a fixed release; no workaround\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
