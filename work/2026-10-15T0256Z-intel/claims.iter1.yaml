    text: "Palo Alto Networks' advisory of 2026-10-14 fixes CVE-2026-0322, a code injection in the PAN-OS management interface that lets an authenticated attacker with network access run code as root on PA-Series and VM-Series firewalls and on Panorama; the advisory is tagged as attacked and reports very limited exploitation, and CISA listed the flaw in KEV the same day. There is no workaround, the risk is highest where the management interface is reachable from the internet, and the 11.2.16 build is listed with an ETA of 2026-10-15, so units on 11.2.14 and 11.2.15 had no fixed build at publication."
