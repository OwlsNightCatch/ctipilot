    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "headline"
    kind: frontmatter
    text: "Huntress: a lookalike VPN-client site harvests credentials, then hands over the real signed installer"
  - claim_id: d63a8b5ef9
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a lookalike WatchGuard VPN download site, reached on 2026-10-07 by an administrator at a managed service provider through a Bing search result, that asks for the SSL VPN server, login and password, rejects the first submission so the victim types again, and only then downloads the genuine, validly signed WatchGuard installer from WatchGuard's own CDN. No malware is delivered, so endpoint controls have no file to flag, and few reputation engines flagged the domains."
  - claim_id: 4ef6d677e6
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Huntress's SOC investigated an incident on 2026-10-07 in which an administrator at a managed service provider searched Bing for a misspelled \"watchguard vpn download\" and clicked through the standard Bing result redirect to a lookalike site titled \"WatchGuard Firebox VPN Client\", which Huntress classes as search-engine poisoning rather than malvertising ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: acc3129f81
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Choosing any download option opens a pop-up asking for Server, Login and Password; one unobfuscated JavaScript file of about 150 lines posts the typed values as JSON to a separate collector domain, tagged as the first or second attempt, and always rejects the first submission with an \"incorrect data\" message so that the victim types again or tries a second set of credentials ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: e0151a8036
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Only after the second submission does the page fetch the real WatchGuard Mobile VPN with SSL installer from WatchGuard's own CDN, an Authenticode-signed file whose digest Huntress recomputed and found unmodified, so there is no trojanized installer or malicious DLL for endpoint defenses to flag ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 5400528fb4
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "The victim's browser history showed no download in the observed window, so Huntress judges the user probably did not finish both rounds but may have typed credentials in the first, and Managed Defender flagged the incident 21 seconds after the lookalike domain loaded ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 59b7aa1512
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Both domains were registered within the previous two months, few reputation engines flagged either as of 2026-10-08, and the lure domain was offline by 2026-10-13 ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: cb86631a86
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Huntress places the iteration in a campaign that WatchGuard's Secplicity team described in January 2026 as lookalike download sites for WatchGuard, F5, Fortinet, SonicWall and Sophos clients, and that Microsoft tied in March 2026 to a financially motivated actor it tracks as Storm-2561; the new element is that the fake client is gone from the middle ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: dda2c5a9b3
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Exposure:** administrators and users who find an SSL VPN client through a web search, which includes managed-service staff who connect to many customers' gateways; the lure here impersonates WatchGuard, and Huntress describes the same campaign against clients of five vendors ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 46d2c80468
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Detection:** the endpoint sees nothing malicious, so the signal is in web proxy and DNS telemetry (a visit that arrives from a search-result redirect to a domain that is not the vendor's, followed by a JSON POST to a second, recently registered domain) and in VPN gateway authentication logs; Huntress advises watching for SSL VPN logins from hosting providers, unfamiliar ASNs and countries where the account has never connected ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 3d9c9e6fec
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** if a user typed VPN credentials into a page found through search, reset every affected account and treat the VPN endpoint those credentials belong to as known to the attacker; enforce multi-factor authentication on the VPN, and publish and bookmark the official client download links in internal documentation so staff do not search for them ("
