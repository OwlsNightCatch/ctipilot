items:
  - title: "PK Softech supplier incident, developments of 2026-10-13/14: Publica reports no sign of darkweb publication; Pensionskasse Stadt Zürich says it is not a current customer but is checking whether data from its migration tests was in the affected environment"
    sources:
      - { url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html", publisher: "Pensionskasse Stadt Zürich (PKZH)", date: "2026-10-13", role: "primary" }
      - { url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", publisher: "Publica (Pensionskasse des Bundes)", date: "2026-10-14", role: "primary" }
    discovery_trace: "first seen at: extract of https://www.inside-it.ch/ (homepage listing, 2026-10-14 teaser 'Cyberangriff auf Pensionskassen-Lieferant zieht Kreise'; the same teaser read in the RSS feed https://www.inside-it.ch/rss.xml) -> article https://www.inside-it.ch/cyberangriff-auf-pensionskassen-lieferant-zieht-kreise-20261014 UNREADABLE (Vercel Security Checkpoint HTTP 429 on extract, bridge url, jina fallback and WebFetch) -> pivot: pkzh.ch homepage https://www.pkzh.ch/de.html (its top-news item 'Cyberangriff PK Softech', 13. Oktober 2026) -> primary: https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html -> re-read the existing entry's primary https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten, which now carries a 'Stand: 14.10.2026' block. Also re-read https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG (unchanged since 2026-10-08)."
    summary: |
      Two first-party notices add to the covered PK Softech/Publica supplier incident. Publica's page now carries a status block 'Stand: 14.10.2026' stating that it currently has no indications that data from the cyberattack on its software supplier has been published on the darkweb, and that it keeps monitoring; its 2026-10-08 data-class list (name, date of birth, AHV number, address, contact details, salary/insured earnings, civil status, partner details, IBAN) is unchanged. The Pensionskasse Stadt Zürich (PKZH, the city of Zurich's public pension fund, about 41,000 insured and 21,000 pension recipients per its own homepage) says in a notice dated 2026-10-13 that PK Softech was hit at the end of September, that the PKZH currently runs on another vendor's administration system, that its switch to the PK Softech system is planned for early 2027 and that the attack therefore does not touch its production system; it is still clarifying whether data of the PKZH is affected because of tests carried out ahead of the switch, and says the attack does not touch the insured persons' pension assets. The new fact for defenders is the shape of the exposure: a supplier can hold copies of a prospective customer's data for migration testing, so bodies mid-migration onto a supplier platform should ask what test data the supplier holds. Inside IT's 2026-10-14 teaser (RSS, article body unreadable) adds that the BVK, the Canton of Zurich's pension fund, 'gives the all-clear'; no BVK notice was found on bvk.ch (homepage and news listing checked), so that claim is unverified here. Still not public in any source read: the access vector, the actor, which data belongs to which fund, whether a ransom was demanded.
    region_nexus: "Switzerland: federal (Publica), cantonal and communal (PKZH, city of Zurich) public pension funds served by one supplier"
    primary_sector_nexus: "direct"
    sector: "public-sector"
