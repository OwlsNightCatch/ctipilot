  - title: "Mandurah SES (Western Australia): The Gentlemen list a State Emergency Service unit; the unit confirms unauthorised access to one server of pre-2022 records after a state SOC notification, and data is now published"
    sources:
      - { url: "https://www.cyberdaily.au/security/14294-exclusive-mandurah-ses-confirms-operations-unaffected-by-ransomware-attack", publisher: "Cyber Daily", date: "2026-10-13", role: "primary" }
    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/countrycyberattacks/AU (record 'Mandurah State Emergency Service (Mandurah SES)', added 2026-10-14, press link to Cyber Daily) -> primary-by-relay: https://www.cyberdaily.au/security/14294-exclusive-mandurah-ses-confirms-operations-unaffected-by-ransomware-attack (quotes a unit spokesman). WebSearch ('Mandurah SES cyber security incident WASOC DFES statement ransomware The Gentlemen') surfaced only third-party trackers (SOCRadar), no DFES or WASOC statement."
    summary: |
      Cyber Daily reports that The Gentlemen ransomware group has listed the Mandurah State Emergency Service unit of Western Australia's volunteer SES on its leak site. A unit spokesman told the outlet that the Office of Digital Government's WA Cyber Security Operations Centre (WASOC) notified the unit on 5 October 2026 of unauthorised access to one of its servers; the server held only historical records from before 2022, there is no evidence that other systems were affected, operations are unaffected, and the Department of Fire and Emergency Services is supporting the response. The unit says further data was published online as of 13 October and that past and present members are being contacted. Cyber Daily describes the published material as several compressed backup archives plus a backup folder of historical operations and planning data. The leak-site claim is the group's; the unauthorised access and the notification path are the unit's own statement. The access vector is not stated. No victim statement attributes the intrusion to the group.
    region_nexus: "Australia (no Swiss nexus); emergency-service sector peer; actor with Swiss-public-body history (The Gentlemen)"
    primary_sector_nexus: "indirect (sector peer: emergency services)"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["actor:thegentlemen"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Victim-confirmed emergency-service incident by an actor the store already tracks against Swiss and DACH public-sector suppliers (Ixa Systems, FTAPI), but no vector, historical-records server only, operations unaffected, and no Swiss or constituency nexus: weakest grounds are PD-11(c) same-actor read-across, which the incident floor then undercuts. Likely a drop; returned so the call is auditable."
    evidence:
      - quote: "The Gentlemen ransomware group has struck another Australian victim, this time listing Western Australia’s Mandurah State Emergency Service (Mandurah SES) unit on its darknet leak site."
        attribution: "Cyber Daily"
        source_url: "https://www.cyberdaily.au/security/14294-exclusive-mandurah-ses-confirms-operations-unaffected-by-ransomware-attack"
      - quote: "WA Cyber Security Operations (WASOC) provided notification on 5 October 2026 that Mandurah SES had experienced a cyber security incident involving unauthorised access to one of its servers"
        attribution: "Cyber Daily (quoting a Mandurah SES spokesman)"
        source_url: "https://www.cyberdaily.au/security/14294-exclusive-mandurah-ses-confirms-operations-unaffected-by-ransomware-attack"
      - quote: "Mandurah SES is also aware that further data has been published online as of 13 October."
        attribution: "Cyber Daily"
        source_url: "https://www.cyberdaily.au/security/14294-exclusive-mandurah-ses-confirms-operations-unaffected-by-ransomware-attack"
    extended_notes: |
      Suggested Admiralty: B2 for the victim-confirmed access, B3 for the group attribution of the listing (the leak-site claim is the group's own). The detection path (a state SOC notified a small volunteer unit) is the only transferable element: a central government SOC, not the victim, saw the compromise first. Registry: actor:thegentlemen already tracks the group (also Storm-2697, Phantom Mantis).
