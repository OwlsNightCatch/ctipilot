        attribution: "Publica (Pensionskasse des Bundes)"
        source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"
      - quote: "Der Wechsel auf das Verwaltungssystem von PK Softech AG ist für Anfang 2027 vorgesehen."
        attribution: "Pensionskasse Stadt Zürich (PKZH)"
        source_url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html"
