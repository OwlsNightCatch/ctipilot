        attribution: "Pensionskasse Stadt Zürich (PKZH)"
        source_url: "https://www.pkzh.ch/de/aktuelles/news/cyberangriff-PK-softech.html"
    extended_notes: |
      Update shape, not a new entry: the store already carries 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow (last changes 2026-10-10, 2026-10-13). The delta is (1) Publica's 2026-10-14 darkweb statement, (2) the PKZH notice, the first communal (city) fund in the incident and the first source describing a supplier holding migration-test data of a not-yet-live customer. Suggested Admiralty: A2 (two first-party notices, each the owner of its own statement; the 'no darkweb sign' line is an absence-of-evidence statement by the fund itself). The Inside IT teaser quote, for the record, reads 'Die Pensionskasse Stadt Zürich muss inmitten der Migration auf die Lösung von PK Softech einen möglichen Datenabfluss prüfen. Die BVK gibt unterdessen Entwarnung.' (RSS item published 2026-10-14T12:41:21Z); it is deliberately NOT listed as a source because its article URL returned the 429 checkpoint on every transport. The existing entry's action to ask the supplier in writing whether the body's data was in the affected environment gains weight for any Swiss body that is mid-migration onto PK Softech software.
  - title: "Wolsfeld (Eifelkreis Bitburg-Prüm, Rhineland-Palatinate): Koblenz prosecutors confirm hackers accessed several computers at a fire-service operations centre; unplugged and replaced, back in service the same weekend"
    sources:
      - { url: "https://www.swr.de/swraktuell-radio/info-date-am-morgen-2026-10-14-koalition-legt-streit-um-zuckersteuer-bei-100.html", publisher: "SWR (Info-Date am Morgen, 2026-10-14)", date: "2026-10-14", role: "primary" }
    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/countrycyberattacks/DE (record 'Centre de commandement des pompiers de Wolsfeld', added 2026-10-14, press link to SWR) -> primary-by-relay: https://www.swr.de/swraktuell-radio/info-date-am-morgen-2026-10-14-koalition-legt-streit-um-zuckersteuer-bei-100.html (SWR morning roundup relaying the Generalstaatsanwaltschaft Koblenz). Six WebSearch reformulations (DE) found no second report and no Generalstaatsanwaltschaft press release."
    summary: |
      SWR reports on 2026-10-14 that the Generalstaatsanwaltschaft Koblenz confirmed a cyberattack over the weekend of 10-11 October on the fire-service operations centre in Wolsfeld in the Eifelkreis Bitburg-Prüm, and that investigations are running. According to the prosecutors, the attackers gained access to several computers; a person responsible for the centre received a phone message during the night that the server was offline, and on site found the foreign access. The affected devices were taken off the network and replaced, so the centre was reachable again by Sunday. The actor is unknown. The behavioural facts are limited to the detection path (an offline-server alert led to on-site discovery of unauthorised access on several hosts) and the containment (devices removed and replaced); the vector, the data affected and any extortion claim are not public. Single source: one public-broadcaster radio roundup relaying the prosecutor's statement.
