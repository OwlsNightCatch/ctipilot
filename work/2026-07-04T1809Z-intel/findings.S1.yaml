    extended_notes: |
      Detection concept: LPE via epoll race leaves little forensic trace (reported to rarely trigger KASAN,
      the kernel's primary memory-error detector). Hunt for unprivileged processes rapidly opening/closing
      paired epoll file descriptors (e.g. via auditd syscall auditing on epoll_create1/epoll_ctl/close with
      tight timing loops), and for unexplained root-shell spawns from non-privileged parent processes on
      multi-tenant Linux hosts, CI/CD runners, and shared hosting boxes (EDR process-lineage alerting).
      MITRE ATT&CK: T1068 Exploitation for Privilege Escalation (local, kernel-level). Hardening: apply the
      vendor/distro kernel backport carrying upstream commit a6dc643c6931 as soon as it ships; until then,
      treat as an LPE risk primarily on systems where untrusted or lower-privileged local users have shell
      access — audit and minimise the population of local/SSH/CI-runner accounts on affected kernels, since
      no config-level workaround exists (epoll cannot be disabled). One outlet (The Hacker News) notes the
      related, earlier bug CVE-2026-43074 in the same code area was found by an AI research tool
      (Anthropic's "Mythos"), with Bad Epoll being the narrower-window variant it missed — flagged here as
      context, not independently verified by this agent against Anthropic's own disclosure.
    borderline: true
    borderline_reason: "no confirmed in-the-wild exploitation and requires local access (not pre-auth/network); included because of the public ~99%-reliable PoC, near-universal kernel/Android exposure, and imminent-exploitation profile (unpatched-by-most-distros LPE with public PoC) that the S1 mission specifically calls out."
