items:
  - title: "\"Bad Epoll\" (CVE-2026-46242) — Linux kernel epoll use-after-free race gives unprivileged local users near-guaranteed root; hits Android"
    sources:
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-46242", publisher: "NVD (kernel.org-sourced CNA record)", date: "2026-05-30", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/new-bad-epoll-linux-kernel-flaw-lets.html", publisher: "The Hacker News", date: "2026-07-03", role: "corroborating" }
      - { url: "https://latesthackingnews.com/2026/07/04/bad-epoll-vulnerability/", publisher: "Latest Hacking News", date: "2026-07-04", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"CVE-2026 actively exploited vulnerability July 4 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/new-bad-epoll-linux-kernel-flaw-lets.html → pivot: Latest Hacking News, URL https://latesthackingnews.com/2026/07/04/bad-epoll-vulnerability/ → primary: NVD/kernel.org CVE record, URL https://nvd.nist.gov/vuln/detail/CVE-2026-46242 (references git.kernel.org fix commits)"
    summary: |
      CVE-2026-46242 ("Bad Epoll", CVSS 3.1 7.8, CWE-416 Use-After-Free) is a race condition in the Linux
      kernel's eventpoll subsystem, in the ep_remove() / ep_remove_file() path: the kernel clears the
      file->f_ep pointer under a lock but continues using the same file object inside the critical
      section, and a concurrent release path can free the watched struct eventpoll while it is still
      being dereferenced (CWE-416). The published proof-of-concept sets up two epoll file descriptors that
      monitor each other and closes both near-simultaneously to land inside a narrow (reported as
      six-instruction) timing window; researcher Jaeyoung Chung's write-up and PoC (github.com/J-jaeyoung/bad-epoll)
      report roughly 99% reliability escalating an unprivileged local account to root without crashing the
      kernel, and claim the exploit can also be used to escape Chrome's renderer sandbox. Affected kernels
      are 6.4 and newer that lack the fix; Android devices on 6.6-series kernels are affected, while Pixel 8
      devices on 6.1-based kernels predate the vulnerable code path. The upstream fix (commit a6dc643c6931,
      referencing kernel.org commits 2de4db145b29, 9324de74a3a5, ced39b6a8062, ef4ca02e9536) landed
      upstream on 24 April 2026, but distribution and device-vendor backports are still catching up —
      Debian's tracker reportedly marks bullseye/bookworm as not-affected (vulnerable code absent) while
      newer branches still need the fix applied. No workaround exists because epoll cannot be disabled
      without breaking core OS/browser functionality. As of the cited reporting, CISA's KEV catalog does
      not list this CVE and no in-the-wild exploitation has been confirmed — this is a public-PoC LPE, not
      a confirmed active-exploitation case.
