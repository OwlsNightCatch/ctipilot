    extended_notes: |
      DETECTION/HARDENING FOR MAIN AGENT COMPOSITION:
      - Technique class: local privilege escalation via kernel memory corruption, CWE-416 Use-After-Free
        in a kernel subsystem — maps to MITRE ATT&CK T1068 (Exploitation for Privilege Escalation),
        https://attack.mitre.org/techniques/T1068/. Prerequisite: unprivileged local code execution
        (attacker must already be able to run code as any local user, e.g. via a web-facing app account,
        container escape starting point, or — per press reporting — a Chrome renderer-sandbox foothold
        from a separate browser bug). No remote/pre-auth vector by itself.
      - Vulnerable component: fs/eventpoll.c, function ep_remove() — race between file->f_ep clearing
        under file->f_lock and a concurrent __fput()/eventpoll_release_file() path; exploit primitive
        turns an 8-byte UAF write into a cross-cache UAF on a struct file, then uses
        /proc/self/fdinfo to leak kernel addresses before a ROP-based privilege escalation (per press
        summaries of the researcher's write-up — not independently verified against the write-up itself
        in this pass since the repo was not cited as a source).
      - Affected/patched precision: introduced by upstream commit 58c9b016e128 (April 2023); fixed by
        a6dc643c6931 landing in mainline 2026-04-24. Ubuntu: linux, linux-aws, linux-azure,
        linux-azure-fde, linux-gcp, linux-oracle, linux-nvidia, linux-raspi and HWE/OEM/FIPS variants
        across 24.04 LTS, 25.10, 26.04 LTS need the backport. Debian: bullseye (5.10.223-1 / 5.10.259-1)
        and bookworm (6.1.170-3 / 6.1.176-1) are marked not-affected/fixed; trixie needed 6.12.86-1 /
        6.12.94-1; forky/sid fixed at 7.0.13-1 / 7.0.14-1 (kernel 7.0.10-1 or 7.1-rc1 carries the fix
        upstream). No config toggle or module unload mitigates this — epoll cannot be disabled — so
        patching/backport verification is the only lever.
      - Defender takeaway: verify distro kernel package version against the vendor tracker entries
        above rather than relying on the "6.4+" mainline cutout, since backport ranges vary. Because
        exploitation requires only unprivileged local code execution and there is no config-based
        mitigation, treat any newly-provisioned Linux 6.4+/Android 6.6+ fleet element as requiring the
        kernel update on the same cadence as any other confirmed-fixed LPE; hunt-wise there is no
        vendor-published detection signature (kernelCTF PoC only) — EDR/kernel-crash-log monitoring for
        anomalous eventpoll/fdinfo access patterns from unprivileged processes is the only generic
        behavioural angle available from public information, and no source in this pass supplied a
        concrete telemetry hook (Sysmon/auditd rule) for it.
      - This is explicitly NOT a fresh 0-day being patched now — the kernel fix has been in mainline
        since 2026-04-24. The in-window news event is Chung's public write-up + working exploit release,
        which is what changes the *actionability* calculus (a working, reliable local-root PoC is now
        public) even though the underlying flaw was already fixed almost 10 weeks ago. Recommend framing
        the entry as "public PoC/exploit-detail release for an already-patched kernel LPE" rather than
        "newly disclosed vulnerability."
