    summary: |
      CVE-2026-46242 ("Bad Epoll", CWE-416, CVSS 7.8) is a use-after-free in the Linux kernel epoll
      subsystem's ep_remove() (fs/eventpoll.c): the function clears file->f_ep under file->f_lock but
      continues operating on the file object inside the critical section (hlist_del_rcu() /
      spin_unlock()); a concurrent __fput() can observe a transient NULL, skip
      eventpoll_release_file(), and free a struct eventpoll that is still referenced, corrupting kernel
      memory via an attacker-controllable kmem_cache_free() against the wrong slab cache. The bug and a
      sibling race (CVE-2026-43074, caught earlier by Anthropic's "Mythos" model per press reporting)
      were both introduced by the same 2023 epoll commit. Researcher Jaeyoung Chung (PhD, Seoul National
      University CompSec Lab) reported the bug to the kernel security team on 2026-02-17; a first patch
      attempt was incomplete and the correct fix landed in mainline on 2026-04-24 (commit a6dc643c6931).
      This week's news wave (2026-07-03/04) is driven by Chung's public root-cause write-up and a working
      kernelCTF exploit achieving ~99% reliability by widening a ~6-instruction race window — NOT by a
      new patch or new in-the-wild activity. Affects mainline Linux >=6.4 and distro kernels built on
      that baseline; Debian bullseye/bookworm are unaffected/already fixed, trixie/forky required a
      point-release bump; Ubuntu lists linux, linux-aws, linux-azure, linux-gcp, linux-oracle,
      linux-raspi and HWE/OEM/FIPS variants across 24.04/25.10/26.04 as needing the fix. Android devices
      on 6.6-series+ kernels (per press reporting) are also implicated because epoll cannot be disabled.
      No vendor, CERT, or researcher has reported in-the-wild exploitation; the only public exploit code
      is the kernelCTF submission, and the CVE is not present in the CISA KEV catalog as of 2026-07-04.
