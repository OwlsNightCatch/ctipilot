  - title: "Black Hat USA 2026 identity horizon: two logical Kerberos flaws (KerberLoss / ResetNightmare) that take a low-privileged AD user to full domain takeover got a full public write-up and a working PoC this week — patched in spring, but the exploitation detail is now open"
    sources:
      - { url: "https://www.semperis.com/blog/identity-crisis-novel-vulnerabilities-leading-to-kerberos-downgrade-dos-and-full-domain-takeover/", publisher: "Semperis", date: "2026-08-05", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Black Hat USA 2026 Active Directory Entra Kerberos identity attack research disclosure primary blog\") → Semperis primary, URL https://www.semperis.com/blog/identity-crisis-novel-vulnerabilities-leading-to-kerberos-downgrade-dos-and-full-domain-takeover/"
    summary: |
      At Black Hat USA 2026, Shai Laron (Semperis) published the full technical detail and a
      proof-of-concept for two logical Active Directory flaws that turn a low-privileged foothold
      into domain compromise. KerberLoss (CVE-2026-25177) abuses unfilterable Unicode characters to
      defeat Service Principal Name uniqueness checks: with only WriteSPN on any computer or user
      object, an attacker plants a duplicate SPN the DC's LDAP layer cannot filter, causing Kerberos
      tickets to be encrypted under the wrong key (denial of service, KRB_AP_ERR_MODIFIED), forcing a
      Kerberos→NTLM authentication downgrade, or enabling SPN-jacking for constrained-delegation abuse.
      ResetNightmare (CVE-2026-27912) abuses the Kerberos password-change protocol (RFC 3244): a
      low-privileged user sets their UPN to a target admin's sAMAccountName, requests a TGT with the
      NT-ENTERPRISE name type, and — because the password-change flow needs only a TGT and carries no
      intervening TGS-REQ where PAC_REQUESTOR_SID is validated — resets their own password while
      carrying the target's name, then authenticates as the admin. Microsoft patched KerberLoss in the
      March 2026 update and ResetNightmare in April 2026, both as Important elevation-of-privilege
      fixes; there is no reported in-the-wild use. The strategic significance for an AD-defending
      public-sector estate is timing: the exploitation mechanics and a runnable PoC are now fully
      public against flaws many estates have not yet patched, and both classes (SPN/UPN collision) leave
      no obvious signature beyond directory-object modification.
    region_nexus: "global; every Swiss/EU public-sector and CI organisation running on-prem Active Directory is in scope"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector"
    cves: [CVE-2026-25177, CVE-2026-27912]
    techniques: [T1558, T1078.002, T1484, T1207]
    affected_products: ["Microsoft Active Directory", "Windows Server", "Kerberos"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "KerberLoss (CVE-2026-25177) and ResetNightmare (CVE-2026-27912) ... each vulnerability taking a unique approach to causing identity confusion on domain controllers."
        attribution: "Semperis"
        source_url: "https://www.semperis.com/blog/identity-crisis-novel-vulnerabilities-leading-to-kerberos-downgrade-dos-and-full-domain-takeover/"
      - quote: "Remember the patch we examined before: The TGS-REQ is where the PAC_REQUESTOR_SID validation occurs."
        attribution: "Semperis"
        source_url: "https://www.semperis.com/blog/identity-crisis-novel-vulnerabilities-leading-to-kerberos-downgrade-dos-and-full-domain-takeover/"
    extended_notes: |
      Detection: KerberLoss — audit for objects with hidden/unfilterable Unicode characters in SPN
      values and for UPN/SPN uniqueness verification being disabled. ResetNightmare — Security-log
      Event ID 5136 for a UPN modification that matches another account's sAMAccountName, and password
      resets immediately following such a change. Both patched (Mar/Apr 2026 Patch Tuesday) — the
      hardening lever is simply confirming those updates are applied on all DCs. PoC:
      github.com/Semperis-Community/ResetNightmare. Single-source (Semperis is the discovering lab and
      Black Hat presenter); CVE ids verify on MSRC/NVD. Certighost (CVE-2026-54121, AD CS DC
      impersonation) surfaced in the same Black Hat AD-identity cluster but its primary write-up is
      dated 2026-07-24 (patched 2026-07-14) — out of window; not returned.

  - title: "Passkey/WebAuthn attack surface converged from four directions in one week — and the newest, unpatched angle is enterprise: Black Hat research shows an already-signed-in Windows session can silently sign Entra ID assertions with the victim's Windows Hello key"
    sources:
      - { url: "https://dirkjanm.io/borrowing-windows-hello-keys/", publisher: "Dirk-jan Mollema (dirkjanm.io)", date: "2026-08-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/malware-can-abuse-windows-hello-for.html", publisher: "The Hacker News", date: "2026-08-07", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"passkey WebAuthn FIDO2 attack research August 2026 vendor response\") → darkreading lead (403 on fetch) → WebSearch (\"SpecterOps passkey ... Black Hat 2026\") surfaced DSInternals + dirkjanm → The Hacker News, URL https://thehackernews.com/2026/08/malware-can-abuse-windows-hello-for.html → primary: Dirk-jan Mollema, URL https://dirkjanm.io/borrowing-windows-hello-keys/"
    summary: |
      This is the convergence question posed for the week, and the evidence supports calling it a
      documented convergence rather than a two-item coincidence: in ISO-week 2026-W32 at least four
      independent pieces of work attacked the passkey/WebAuthn control — the phishing-resistant
      authenticator public-sector identity programmes are being pushed toward — from different ends.
      Two the pipeline already covered: Unit 42's "Pass-ta-key" (2026-08-03; unprivileged endpoint
      malware forges Chrome/Google-synced passkey assertions and can steal the security-domain secret
      that decrypts every synced passkey) and GTIG's UNC6671 vishing whose pretext is an urgent FIDO2
      passkey enrolment (2026-08-05..07). Two more landed at Black Hat USA 2026 this week and target the
      ENTERPRISE authenticator — Windows Hello for Business and Microsoft Entra ID. Dirk-jan Mollema
      showed that malware in an already-signed-in session can call the Passport Key Storage Provider to
      sign data with the WHfB private key with no PIN or biometric prompt (it works off cached ticket
      data), and that the Entra-issued WebAuthn challenge "is not bound to a session, a user or even a
      tenant" and stays valid five minutes — so an attacker requests the challenge on their own host,
      has the victim machine sign it, and replays the assertion; FIDO2-authenticated tokens lacking a
      device-ID claim then let the attacker register a rogue device and pull a 90-day Primary Refresh
      Token. Microsoft did not assign a CVE or patch this, calling it "a consequence of how WHFB works."
      Separately, Michael Grafnetter's "Pass-the-Passkey" Black Hat talk covers a related class, and
      the event-log passkey-data-exposure element was assigned CVE-2026-34348 and closed by Microsoft on
      2026-07-14. The horizon shift for defenders: passkeys remain strong against remote phishing, but a
      compromised endpoint or a social-engineered enrolment now has multiple published paths to abuse
      them, and the strongest enterprise path (session-key borrowing to Entra) is unpatched by design.
    region_nexus: "global; directly relevant to Swiss/EU public-sector and CI organisations rolling out Entra ID / Windows Hello for Business or Google-synced passkeys as phishing-resistant MFA"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector"
    cves: [CVE-2026-34348]
    techniques: [T1556.006, T1606.002, T1528, T1098.005, T1550.001]
    affected_products: ["Microsoft Entra ID", "Windows Hello for Business", "Google Password Manager", "Chrome", "FIDO2"]
    entity_keys: [actor:unc6671]
    new_entities:
      - { key: "trend:passkey-webauthn-attack-surface-2026-08", type: campaign, name: "Passkey / WebAuthn attack-surface disclosure convergence (2026-08)",
          aliases: ["Pass-ta-key", "Pass-the-Passkey", "Borrowing Windows Hello keys"],
          summary: "Cluster of independent 2026-W32 research and criminal activity attacking passkey/WebAuthn authenticators from multiple angles — Unit 42 Pass-ta-key (Chrome/Google synced passkeys), GTIG UNC6671 passkey-enrolment vishing, and Black Hat USA 2026 Windows Hello for Business / Entra ID assertion-borrowing work by Dirk-jan Mollema (no CVE, unpatched by design) and Michael Grafnetter's Pass-the-Passkey (CVE-2026-34348, patched 2026-07-14). Convergence surfaced by ctipilot weekly W1 2026-08-09." }
    relation_suggestions:
      - { subject: "actor:unc6671", object: "trend:passkey-webauthn-attack-surface-2026-08",
          basis: "GTIG: UNC6671's current vishing pretext is an urgent order to enroll a FIDO2 passkey / re-enroll MFA (GTIG, 2026-08-06), placing the campaign inside the week's passkey-attack convergence" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The challenge is not bound to a session, a user or even a tenant, so we can request it on our attacker host and then use the WHFB key on the victim machine"
        attribution: "Dirk-jan Mollema"
        source_url: "https://dirkjanm.io/borrowing-windows-hello-keys/"
      - quote: "calling these native functions from for example PowerShell does not prompt the user for a PIN or biometric authentication at all, but works based on cached data."
        attribution: "Dirk-jan Mollema"
        source_url: "https://dirkjanm.io/borrowing-windows-hello-keys/"
      - quote: "malware already running in a signed-in Windows session can silently use the victim's Windows Hello for Business key to authenticate to Microsoft Entra ID"
        attribution: "The Hacker News (reporting Mollema's research)"
        source_url: "https://thehackernews.com/2026/08/malware-can-abuse-windows-hello-for.html"
    extended_notes: |
      Precision on attribution and CVE state, because two Black Hat talks are involved and the reporting
      blurs them: (a) Mollema's WHfB→Entra assertion-borrowing has NO CVE and Microsoft declined to patch
      it as a design consequence — this is the unpatched enterprise path; ROADtools winhello_assertion
      tooling is public. (b) Grafnetter's "Pass-the-Passkey" event-log passkey-data-exposure element is
      CVE-2026-34348, patched 2026-07-14 (in-window disclosure at Black Hat, months-old patch). Do NOT
      state Microsoft patched the assertion-borrowing behaviour. Detection: hunt for WebAuthn/Entra
      sign-ins from a device/location that never held the key; anomalous device-registration events
      followed by PRT issuance; Windows Hello key use with no corresponding interactive-logon PIN/biometric
      prompt. Hardening levers named by the research: bind assertions to device/session, require device-ID
      claims on FIDO2 tokens, tighten device-registration policy in Entra. The convergence is real but
      should not be overstated: passkeys are still resistant to remote credential phishing — every one of
      these paths presupposes either endpoint compromise or a successful enrolment social-engineer.

  - title: "Unit 42 quantifies a detection blind spot: nearly half of malware C2 skips DNS entirely and dials a hard-coded IP, so DNS-only egress monitoring never sees it"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-04", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Black Hat USA 2026 research briefing disclosure\") → virtualizationreview roundup, URL https://virtualizationreview.com/articles/2026/08/05/black-hat-usa-2026-research-roundup-ai-speeds-up-the-old-attacks.aspx → primary: Unit 42, URL https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/"
    summary: |
      Unit 42 analysed over 4 million Advanced WildFire dynamic-analysis reports across a 30-day period
      and measured how often malware command-and-control avoids DNS altogether. Among samples showing any
      C2 activity, 45.32% made at least one direct-to-IP (D2IP) connection with no preceding DNS query,
      and D2IP accounts for 23.17% of all C2 connection attempts — while only about 1% of benign samples
      establish comparable connections to untrusted IPs. The defensive implication is the load-bearing
      point for a SOC: DNS-based controls (RPZ, DNS firewalling, sinkholing, protective DNS such as the
      services several EU public-sector networks operate) are structurally blind to hard-coded-IP C2,
      which spans ransomware, botnets and exfiltration. Unit 42 proposes a firewall-level enforcement
      model (Zero Trust IP) that verifies outbound connections were sanctioned by a preceding DNS
      response, but the transferable takeaway needs no product: the discriminator between this malware
      class and benign traffic is an outbound session to an external IP with no prior name resolution —
      a hunt any egress-logging estate can run.
    region_nexus: "global; a detection-engineering finding directly applicable to any Swiss/EU SOC relying on protective-DNS or DNS-firewall egress controls"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
    cves: []
    techniques: [T1071, T1571, T1095, T1590.005]
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Almost half (45.32%) of malware samples with any command-and-control (C2) activity made at least one direct-to-IP (D2IP) address connection."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/"
      - quote: "Measured as a fraction of all C2 connection attempts, D2IP traffic accounts for 23.17% of the total."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/"
    extended_notes: |
      Detection concept for the entry's Triage line: outbound TCP/UDP session to an external, non-CDN,
      non-allowlisted IP with no preceding DNS A/AAAA resolution in the same host's recent DNS telemetry.
      Benign lookalikes that share the telemetry: NTP, some update/telemetry agents, hard-coded public
      resolvers (1.1.1.1/8.8.8.8), and P2P/WebRTC — discriminate on destination reputation, port, and
      whether the process normally resolves names. Single-source (Unit 42 telemetry claim); confidence
      MEDIUM because the percentages rest on one vendor's sandbox population and "malware C2" labelling.

  - title: "US water-sector PLC lockout campaign — W32 status: media confirm 12 states and a 300,000-customer boil-water advisory in Georgia, yet the FBI/EPA still decline public attribution while every technical signal points at internet-exposed Rockwell MicroLogix PLCs"
    sources:
      - { url: "https://thehackernews.com/2026/07/coordinated-cyberattack-targets-30.html", publisher: "The Hacker News", date: "2026-07", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Minnesota water utility PLC lockout August 2026 EPA WaterISAC FBI attribution states\") → Tenable RSO consolidation (bridge-fetched), URL https://www.tenable.com/blog/coordinated-cyberattack-on-minnesota-water-utilities-what-you-need-to-know → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/coordinated-cyberattack-targets-30.html"
    summary: |
      Status delta on the water-sector PLC lockout campaign this pipeline covered at twelve states on
      2026-08-06 and the prior weekly framed for European exposure. In-window developments: CBS
      independently confirmed the 12-state scope on 2026-08-06 (after ABC on 2026-08-04); CISA reported
      on 2026-07-30 that the broader campaign has led to boil-water notices and extended manual operation;
      and in Georgia the Clayton County Water Authority suffered a pressure drop that triggered a
      boil-water advisory for roughly 300,000 customers in the Atlanta area — the largest single
      population impact disclosed so far. The FBI/EPA joint PSA (Alert I-073026-PSA, 2026-07-30) names
      Rockwell Automation MicroLogix 1100/1400 PLCs as the targeted devices and reports operational
      effects including pressure loss and flooding, but still attributes only to "malicious cyber actors."
      That attribution gap is itself the week's signal: technical consolidation (Tenable's RSO team) ties
      the targeted-device profile and PLC-lockout tradecraft to the IRGC-linked CyberAv3ngers activity
      documented in CISA AA26-097A, and media report an Iran connection under investigation, but no US
      authority has made that attribution public. For European water utilities the transferable lesson is
      unchanged and urgent: the entire campaign relies on PLCs reachable directly from the internet with
      weak or default access control — no novel exploit or custom malware — so the mitigation is exposure
      reduction, not patching.
    region_nexus: "US incident with direct transferable relevance to EU/Swiss water and wastewater operators running internet-exposed PLC/HMI (prior weekly counted 4,117 exposed Siemens S7-1200, 86% in four EU countries)"
    primary_sector_nexus: "direct"
    sector: "water, critical-infrastructure, public-sector"
    cves: []
    techniques: [T0812, T0836, T0855, T0813, T1133]
    affected_products: ["Rockwell Automation MicroLogix 1100", "Rockwell Automation MicroLogix 1400"]
    entity_keys: [incident:minnesota-water-utilities-coordinated-cyberattack-2026-07, actor:cyberav3ngers]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: update-of:2026-08-06/water-plc-lockouts-twelve-states-named-utility-confirms
    evidence:
      - quote: "at least 12 states have reportedly been affected according to an ABC News report published on August 4. On August 6, CBS News independently confirmed the 12-state scope."
        attribution: "Tenable Research Special Operations"
        source_url: "https://thehackernews.com/2026/07/coordinated-cyberattack-targets-30.html"
    borderline: true
    borderline_reason: "daily already covered 12 states on 08-06; the in-window delta (Georgia 300k boil-water, persistent attribution gap) is real but incremental — flagged for the main agent to weigh as update-of vs. fold into the weekly water-sector horizon section"
    extended_notes: |
      Primary-source caveat: the Tenable RSO consolidation blog was the richest in-window source and was
      bridge-fetched successfully, but it is a secondary/analysis source; the FBI/EPA PSA (I-073026-PSA)
      and CISA AA26-097A are the authorities. CISA AA26-097A's last substantive update is dated
