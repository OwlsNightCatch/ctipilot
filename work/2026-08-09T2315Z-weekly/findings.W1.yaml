  - title: "npm supply-chain wave — week-level status: the keyv/cacheable compromise is CHAINDROP, and eight vendors converged on it in 48 hours; Socket adds a revocation-triggered dead-man's switch that has to be hunted before any credential rotation"
    sources:
      - { url: "https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain", publisher: "Socket Threat Research", date: "2026-08-04", role: "primary" }
      - { url: "https://securitylabs.datadoghq.com/articles/npm-worm-compromises-popular-npm-packages/", publisher: "Datadog Security Labs", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: socket-dev-blog (slice), URL https://socket.dev/blog → drilled keyv/cacheable post, URL https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain → WebSearch confirmed cross-vendor convergence (Snyk, Wiz, Aikido, Orca, Cloudsmith, safedep) → Datadog forensic timeline, URL https://securitylabs.datadoghq.com/articles/npm-worm-compromises-popular-npm-packages/"
    summary: |
      Week-level consolidation of the npm developer-supply-chain wave this pipeline already
      covered as CHAINDROP (Elastic, 2026-08-06; Unit 42, 2026-08-08). The 2026-08-04
      keyv/cacheable compromise reported independently by Socket, Datadog, Snyk, Wiz, Aikido,
      Orca, Cloudsmith and safedep IS that same event — the Shai-Hulud-lineage worm entered
      through the compromised jaredwray maintainer account and spread from keyv and cacheable
      into other maintainers' packages. Socket puts the campaign at ~444 package names and
      the wider reporting at 2,234 poisoned versions; Socket detected malicious artifacts an
      average of 5 min 18 s after publication. Two week-level deltas beyond the daily entries.
      First, an operational hunt-order that inverts the usual incident-response reflex: Socket
      documents a host-level dead-man's switch (a gh-token-monitor LaunchAgent on macOS / systemd
      user service with loginctl enable-linger on Linux) whose watcher polls the GitHub API with
      the stolen token every 60 s and, the moment that token returns an HTTP 4xx — i.e. the moment
      a defender revokes or rotates it — runs `eval` on a remote-supplied handler string. Rotating
      credentials before removing that persistence is itself the trigger. Second, the cross-vendor
      convergence hardens the strategic lesson the daily entries opened: provenance attests build
      integrity, not source integrity — keyv@6.0.0 shipped a passing, genuine Sigstore/Rekor
      attestation because the legitimate release workflow built already-trojanized source, so a
      valid provenance signature is not evidence the source was clean.
    region_nexus: "global; npm/CI credential theft directly exposes any Swiss/EU public-sector or CI developer or build pipeline pulling these foundational packages (keyv sits under eslint→file-entry-cache→flat-cache, so most victims never install it directly)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology, cross-sector"
