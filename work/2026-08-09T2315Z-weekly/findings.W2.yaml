  - title: "CI Fortify: CISA, ASD ACSC, NCSC UK and the Canadian Centre for Cyber Security publish joint OT-isolation guidance for sustaining critical infrastructure during a cyber crisis"
    sources:
      - { url: "https://www.cyber.gov.au/business-government/secure-design/operational-technology-environments/ci-fortify/ci-fortify-advice-for-isolating-vital-systems", publisher: "Australian Signals Directorate's Australian Cyber Security Centre (ASD ACSC) — lead author", date: "2026-07-28", role: "primary" }
