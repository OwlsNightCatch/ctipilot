  - title: "NCSC UK: forensic observability should become a procurement criterion for network edge devices — international reference architecture in development"
    sources:
      - { url: "https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices", publisher: "NCSC UK", date: "2026-07-29", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md (row surfaced by 2026-08-03T0110Z-weekly, never published) → primary: NCSC UK blog post, URL https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices (page metadata: datePublished 29 July 2026, dateModified 4 August 2026)"
    summary: |
      NCSC UK published a blog post, "Making forensic observability the norm for network devices," authored
      by Chris A, its Technical Director for Networking and Infrastructure (published 29 July 2026; page
      metadata shows a dateModified of 4 August 2026 with no substantive change noted). The backlog task's
      characterisation is confirmed: the post frames forensic observability — "telemetry, logging,
      configuration state, and the ability to collect forensic data from both memory and data at rest" — as
      a property edge devices (firewalls, VPN gateways, other network appliances sitting at trust
      boundaries) should ship with by design, "rather than relying on reverse engineering, or specialist
      vulnerability research – as is still often the case." It explicitly frames buyer behaviour as the
      forcing function: "Buyers: If your edge devices don't have this feature, push for it. The fastest
      route to widespread adoption may be for customers to ask for these capabilities as standard" — and
      Sophos, quoted as an industry example reflecting on its Pacific Rim campaign findings, states it is
      "using it to guide our own firewall roadmap, and we'd encourage anyone buying a firewall to make it
      part of their evaluation criteria." On the "international reference architecture in progress"
      characterisation: the post states "the NCSC has been working with international partners to develop a
      reference architecture for forensic observability in network appliances and similar devices. The goal
      is to describe a practical approach that vendors can adopt to provide safe, reliable forensic access
      while maintaining strong security boundaries" — confirmed as in-development, not yet published. The
      post builds on NCSC UK's 2025 "Guidance on digital forensics and protective monitoring specifications
      for producers of network devices and appliances," which described the capabilities manufacturers
      should build in; this post is the follow-up progress report plus a direct call to buyers. Three
      misconceptions are explicitly rebutted: that observability features help attackers (rebutted —
      "structured logging, authenticated collection mechanisms, and clearly defined forensic interfaces are
      safer than forcing investigators to rely on undocumented behaviour"); that customers dislike
      transparency (rebutted — CI operators "consistently ask vendors for better visibility"); and that it
      is too hard to implement (rebutted with cited industry examples).
