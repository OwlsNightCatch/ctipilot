    extended_notes: |
      Sourcing note on why the timetable is easy to get wrong (matching the concern behind this backlog
      row's re-verification requirement): the amendment operates as a surgical replace-in-place on Article
      113's THIRD paragraph only (points a, c replaced; point d added; point b untouched); the SECOND
      paragraph's headline "2 August 2026" sentence is never edited, so a reader who stops at that sentence
      concludes the general date is unchanged when in practice almost every substantive high-risk-AI
      obligation that mattered on that date has been carved out and deferred. A consolidated, amendment-
      applied version of the AI Act was not available on EUR-Lex or the Commission's own AI Act Service Desk
      at the time of this fetch (2026-08-09) — both still show the original, pre-2026/1744 wording — so any
      downstream compliance tooling reading from those pages will misstate the applicable date until they
      catch up.

