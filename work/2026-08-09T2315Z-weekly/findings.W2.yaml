  - title: "Netherlands' Cyberbeveiligingswet (NIS2 transposition) enters into force 15 August 2026, replacing the Wbni for 8,000+ organisations across 18 sectors with mandatory NCSC entity-register registration from that date"
    sources:
      - { url: "https://www.rijksoverheid.nl/actueel/nieuws/2026/07/07/cyberbeveiligingswet-en-wet-weerbaarheid-kritieke-entiteiten-vanaf-15-augustus-2026-van-kracht", publisher: "Rijksoverheid (Dutch national government, Ministerie van Justitie en Veiligheid)", date: "2026-07-07", role: "primary" }
      - { url: "https://www.ncsc.nl/cyberbeveiligingswet-nis2", publisher: "NCSC-NL", date: "2026-08-09", role: "primary" }
    discovery_trace: "first seen at: assigned task 3 (forward-dated obligations already in motion) → primary: Rijksoverheid.nl official news announcement, URL https://www.rijksoverheid.nl/actueel/nieuws/2026/07/07/cyberbeveiligingswet-en-wet-weerbaarheid-kritieke-entiteiten-vanaf-15-augustus-2026-van-kracht → corroborating primary: NCSC-NL's own Cyberbeveiligingswet/NIS2 explainer page, URL https://www.ncsc.nl/cyberbeveiligingswet-nis2"
    summary: |
      The Dutch Eerste Kamer (Senate) approved the Cyberbeveiligingswet (Cbw, the Dutch NIS2 transposition
      law) and the Wet weerbaarheid kritieke entiteiten (Wwke, the Dutch CER-directive transposition) on 7
      July 2026; both enter into force on 15 August 2026 per the government's own announcement and per
      NCSC-NL's own page, independently confirming the date. The Cbw replaces the existing Wet beveiliging
      netwerk- en informatiesystemen (Wbni) and applies to organisations providing essential or important
      services across 18 named sectors including energy, drinking water, digital infrastructure, healthcare,
      government and transport — "ruim 8000 organisaties" (over 8,000 organisations) per the government's own
      figure. From 15 August 2026, in-scope organisations face four new duties: (1) a registration duty —
      register in the national entity register via NCSC-NL (mijn.ncsc.nl); NCSC-NL's own page states
      registration "is per 15 augustus verplicht" (mandatory as of 15 August) and urges organisations not to
      wait, since the underlying risks already exist regardless of the law's entry into force; (2) a duty of
      care — implement measures to manage network/information-system security risks and to prevent or limit
      incident impact; (3) an incident-notification duty — report significant incidents to the organisation's
      CSIRT and competent authority within statutory timeframes via the notification portal; and (4) board-
      level accountability — management bears ultimate responsibility for cyber-risk management and must
      complete adequate training to assess risks and security measures. Organisations are themselves
      responsible for determining whether they fall in scope. The companion Wwke applies to roughly 500
      organisations across a broader critical-sector list (energy, transport, banking, financial-market
      infrastructure, healthcare, drinking water, waste water, digital infrastructure, government, space,
      food production/processing/distribution, and others) that a competent minister formally designates as
      critical entities.
