  - title: "EU AI Act timetable rewritten by the Digital Omnibus on AI (Regulation (EU) 2026/1744): Annex III high-risk obligations pushed from 2 August 2026 to 2 December 2027, Annex I embedded systems to 2 August 2028"
    sources:
      - { url: "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng/xhtml", publisher: "EUR-Lex / Official Journal of the European Union", date: "2026-07-24", role: "primary" }
      - { url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng/xhtml", publisher: "EUR-Lex / Official Journal of the European Union (original AI Act text, for comparison)", date: "2024-07-12", role: "corroborating" }
      - { url: "https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113", publisher: "European Commission AI Act Service Desk (Article 113 explorer page — NOTE: not yet updated to reflect the 2026/1744 amendment at time of fetch)", date: "2026-08-09", role: "corroborating" }
    discovery_trace: "first seen at: state/coverage_backlog.md (row surfaced by 2026-08-03T0110Z-weekly, never published) → primary: EUR-Lex consolidated regulation text, URL https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng/xhtml → cross-check: EUR-Lex original AI Act (2024/1689) full text, URL https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng/xhtml → cross-check: European Commission's own AI Act Service Desk explorer page (found NOT yet updated), URL https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113"
    summary: |
      Regulation (EU) 2026/1744 ("Digital Omnibus on AI"), dated 8 July 2026, published in the Official Journal
      24 July 2026 and in force from 27 July 2026, amends Regulation (EU) 2024/1689 (the AI Act) in three places
      relevant to timing, all inside Article 113's third paragraph. Point 40 of the amending regulation states
      verbatim: "in Article 113, the third paragraph is amended as follows: (a) point (a) is replaced by the
      following: 'Chapters I and II shall apply from 2 February 2025, with the exception of Article 5(1), first
      subparagraph, points (ba) and (bb), and Article 5(1a) and (1b) which shall apply from 2 December 2026;'
      ... (b) point (c) is replaced by the following: 'Chapter III, Sections 1, 2, and 3, with the exception of
      Article 6(5), shall apply from: (i) 2 December 2027 as regards AI systems classified as high-risk pursuant
      to Article 6(2) and Annex III; and (ii) 2 August 2028 as regards AI systems classified as high-risk pursuant
      to Article 6(1) and Annex I;' ... (c) the following point is added: '(d) Articles 102 to 110 shall apply
      from 27 July 2026.'" Point (b) of the third paragraph (Chapter III Section 4, Chapter V, Chapter VII,
      Chapter XII and Article 78 from 2 August 2025, excepting Article 101) is untouched. Article 113's second
      paragraph — "It shall apply from 2 August 2026" — is also untouched as text, but its practical scope is now
      narrowed by the expanded carve-outs in the third paragraph. Net effect for defenders and compliance
      functions: the obligations for standalone high-risk AI systems under Annex III (biometrics, employment,
      education, migration, access to essential services, law enforcement, etc.) — which under the ORIGINAL 2024
      text were due to apply from the general 2 August 2026 date — are now deferred to 2 December 2027, a
      16-month postponement that landed six days before they would otherwise have taken effect. High-risk systems
      embedded as safety components in already-regulated products (Article 6(1) / Annex I) — previously due
      2 August 2027 under the original point (c) — are pushed one further year to 2 August 2028. A new point (d)
      brings the AI Act's sectoral-law amendment articles (102–110, covering aviation, machinery, etc.) into
      application immediately from the omnibus's own entry into force (27 July 2026) rather than waiting for the
      general date. Separately (context, not the timetable change), the same omnibus inserts two new prohibited
      practices into Article 5(1) — non-consensual intimate-image/deepfake generation (new point (ba)) and
      CSAM-adjacent material under Directive 2011/93/EU (new point (bb)) — which apply from 2 December 2026 rather than
      the Chapter I/II general February 2025 date. The European Commission's own AI Act Service Desk explorer
      page for Article 113, fetched during this run, still displays the pre-amendment text (general 2 August 2026
      date, old three-point structure) — the Commission's public-facing consolidated view has not caught up with
      the legal text it itself published five days earlier.
    region_nexus: "EU-wide (Regulation, directly applicable in all member states) and EEA; indirect but material for Swiss entities placing AI systems on the EU market or embedded in EU-regulated products"
