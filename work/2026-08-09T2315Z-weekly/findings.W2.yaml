    discovery_trace: "first seen at: state/coverage_backlog.md (row surfaced by 2026-08-03T0110Z-weekly, never published) → primary: ASD ACSC guidance page (First published: 28 Jul 2026), URL https://www.cyber.gov.au/business-government/secure-design/operational-technology-environments/ci-fortify/ci-fortify-advice-for-isolating-vital-systems → co-primary: CISA resource page, URL https://www.cisa.gov/resources-tools/resources/ci-fortify-advice-isolating-vital-systems → corroborating: CISA press announcement, URL https://www.cisa.gov/news-events/news/cisa-joins-australia-and-others-publish-guidance-isolate-operational-technology-and-enabling-systems"
    summary: |
      CISA, the Australian Signals Directorate's ACSC (lead author), the UK's NCSC and the Canadian Centre
      for Cyber Security jointly published "CI Fortify — Advice for isolating vital systems" (ASD ACSC:
      first published and last updated 28 July 2026; CISA announcement same date). The guidance's own "At a
      glance" framing: "This CI Fortify guide helps critical infrastructure organisations improve their
      cyber resilience... explains how organisations can isolate critical operational technology (OT) and
      supporting systems from other networks during cyber incidents or periods of increased cyber threat."
      It gives critical-infrastructure operators — explicitly naming energy, water and transport among the
      sectors targeted by state-sponsored actors "to prevent adversaries from executing cyberattacks, to
      contain ongoing threats, and to facilitate the restoration of compromised systems" — a structured,
      six-step method: (1) identify vital systems and networks required to deliver the critical service, (2)
      identify dependent "critical customers" (e.g. military infrastructure, lifeline services) and set
      service-delivery targets, (3) classify networks/hosts by criticality and trust level, (4) build
      dedicated OT capability by eliminating cross-dependencies with non-OT systems (shared AD/DNS/DHCP,
      shared hypervisors/SANs, shared PKI, shared time-sync services are named as common coupling points),
      (5) implement physical separation and isolation (distinguishing "physical separation" — no shared
      active infrastructure — from "isolation" — the ability to disconnect and operate independently), and
      (6) create and test a graduated isolation plan. For distributed CI that cannot achieve full physical
      isolation, the guidance requires treating any carrier-provided link as untrusted/hostile and mandates
      link-layer (MACsec) or network-layer (IPsec/GETVPN/DMVPN) encryption implemented on a dedicated
      encryption device rather than relying on any encryption built into the OT device itself, plus
      management-plane hardening per ASD's edge-device-hardening guidance and NCSC UK's Privileged Access
      Workstation guidance. For an operator, the concrete change is procedural and architectural rather than
      a product to deploy: build and rehearse a documented, progressively-executable isolation plan with
      total isolation of the most vital systems as the end state, and remove the OT estate's silent
      dependencies on shared corporate infrastructure before an incident forces the question.
    region_nexus: "Global (US/AU/UK/CA co-authored), directly transferable to Swiss and EU critical-infrastructure operators in the same named sectors"
