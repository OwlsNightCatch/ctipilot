  - title: "Swiss federal administrative units face a 1 January 2027 statutory deadline to have built their own ISMS, per the Informationssicherheitsverordnung's own three-year transition clause"
    sources:
      - { url: "https://www.fedlex.admin.ch/eli/cc/2023/735/de", publisher: "Fedlex (Swiss Confederation official legislation portal) — Informationssicherheitsverordnung (ISV), SR 128.1", date: "2023-11-08", role: "primary" }
      - { url: "https://www.infosec.ch/beratung/informationssicherheit/das-informationssicherheitsgesetz-des-bundes-isg/", publisher: "Swiss Infosec AG (practitioner summary, corroborating the practical framing of the ISV's staged transition dates)", date: "2026-08-09", role: "corroborating" }
    discovery_trace: "first seen at: assigned task 3 (any other dated Swiss cyber obligation falling due in 2026-Q4) via WebSearch (\"BACS ISMS Frist 31. Dezember 2026 kritische Infrastruktur Betreiber Informationssicherheitsverordnung\") → pivot: Swiss Infosec AG practitioner page citing 'Bis 31. Dezember 2026: Aufbau ISMS' as an ISV-defined transition deadline, URL https://www.infosec.ch/beratung/informationssicherheit/das-informationssicherheitsgesetz-des-bundes-isg/ → primary: the ISV ordinance text itself on Fedlex, URL https://www.fedlex.admin.ch/eli/cc/2023/735/de"
    summary: |
      This is a correction and precision-narrowing of a claim circulating in Swiss practitioner commentary,
      verified directly against the Informationssicherheitsverordnung (ISV, SR 128.1) text on Fedlex.
      Practitioner sources (e.g. Swiss Infosec AG) describe an ISV-defined transition timeline including "Bis
      31. Dezember 2026: Aufbau ISMS" (build the ISMS by 31 December 2026) in a context that reads as if it
      applies broadly to organisations subject to the Informationssicherheitsgesetz. The ISV's own text (Art.
      51, "Übergangsbestimmungen") states more narrowly: "Die Verwaltungseinheiten nach Artikel 2 Absatz 1
      Buchstabe c müssen ihr ISMS (Art. 5) innert drei Jahren nach Inkrafttreten dieser Verordnung aufbauen"
      (the administrative units referred to in Article 2 paragraph 1 letter c must build their ISMS, per
      Article 5, within three years of this ordinance's entry into force). Article 52 confirms the ordinance
      "tritt am 1. Januar 2024 in Kraft" (enters into force on 1 January 2024) — so the statutory ISMS
      build-out deadline for these units is three years later, i.e. 1 January 2027 (the "by 31 December 2026"
      framing in commentary is the same deadline expressed inclusively). Critically, the addressee named in
      Article 51(4) is "Verwaltungseinheiten nach Artikel 2 Absatz 1 Buchstabe c" — a defined category of
      FEDERAL ADMINISTRATIVE UNITS under the ISV's own scope provision — not private-sector critical-
      infrastructure operators generally; the ISV instrument fetched in this run governs the Confederation's
      own administration (the Bundesverwaltung), and each such unit "erstellen je ein Informationssicherheits-
      Managementsystem (ISMS)" (Art. 5) with annual objective-setting and independent review at least every
      three years (Art. 5 paras 2–3). Other transition milestones in the same Article 51 confirm a staged
      build-out already partly elapsed: classification catalogues (Art. 17) were due within one year of entry
      into force (i.e. by 1 January 2025), and pre-ordinance NCSC-issued IT-security requirements/exceptions
      remain valid for at most three years post-entry-into-force (i.e. until 1 January 2027, the same date).
      For a Swiss federal SOC, the calendar fact worth carrying is precise and internal: federal
      administrative units that have not yet completed their own ISMS have roughly five months left as of this
      run to do so before the statutory transition period under their own governing ordinance closes.
