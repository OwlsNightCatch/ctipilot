    discovery_trace: "first seen at: state/coverage_backlog.md (row surfaced by 2026-08-03T0110Z-weekly, never published) → primary: CISA resource page (Publish Date: July 29, 2026), URL https://www.cisa.gov/resources-tools/resources/2026-minimum-elements-software-bill-materials-sbom → primary: full guidance document (23 pages, TLP:CLEAR), URL https://www.cisa.gov/sites/default/files/2026-07/2026_cisa_sbom_minimum_elements_508c.pdf"
    summary: |
      CISA, the NSA, the FBI and 15 international co-authoring agencies (ASD's ACSC, Canada's Cyber Centre,
      Czechia's NÚKIB, France's ANSSI, Germany's BSI, India's CERT-In, Italy's ACN, Japan's METI, Korea's
      NCO/NIS/NCSC-equivalent, KISA, Netherlands' NCSC-NL, New Zealand's NCSC-NZ, Poland's NASK and Ukraine's
      NBU) published version 2.1 (Publication: 29 July 2026) of the "Minimum Elements for a Software Bill of
      Materials," updating and replacing NTIA's 2021 original after incorporating "feedback from more than 90
      comments received during the public comment period." Confirmed against the document text: the revision
      "applies to SBOMs for all software, including open-source software, AI software, and software-as-a-
      service (SaaS)" — this is a scope-clarification statement rather than a set of AI/SaaS-specific new
      data fields; the document is explicit that "this document does not introduce additional elements for
      SBOMs for AI systems," instead noting that AI/SaaS discussions are ongoing and pointing to the separate
      G7-authored "Software Bill of Materials for AI – Minimum Elements" guidance (May 2026) for the AI-
      specific angle. New required data-field elements confirmed from the document's own "Notable Updates"
      and Appendix B change log: SBOM Author Signature, SBOM Data Format Name, SBOM Data Format Version, SBOM
      Generation Context, SBOM Tool Name, SBOM Tool Version, SBOM Version, Component Hash Value, Component
      Hash Algorithm, and Component License — matching the backlog task's characterisation exactly. Component
      Hash Value is defined as "the output generated from applying a cryptographic hash algorithm to an
      executable component artifact," with the paired Component Hash Algorithm element documenting which
      algorithm was used (SBOM authors are directed to IANA Hash Function Textual Names, with the algorithm
      itself expected to be one "approved by a relevant authority, such as NIST"); Component License captures
      license identifiers (SPDX identifiers preferred where possible) including any proprietary license
      conditions. Two existing elements were substantively updated rather than newly added: "Component
      Identifiers" (Major Update) now explicitly supports CPE, PURL, UUIDs, commit hashes and intrinsic
      identifiers (OmniBOR, SWHID) with a requirement to include all applicable identifiers when more than one
      exists; "SBOM Author" also carries a Major Update. Renamed fields carried over from 2021 for clarity
      (noted in the announcement, not independently re-verified against the full elements table in this run):
      "Author of SBOM Data" to "SBOM Author," "Supplier Name" to "Component Producer," "Version of the
      Component" to "Component Version."
