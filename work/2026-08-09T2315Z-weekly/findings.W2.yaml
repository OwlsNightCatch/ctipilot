  - title: "CISA, NSA, FBI and 15 international partners publish 2026 SBOM Minimum Elements: scope confirmed for open source, AI and SaaS software; Component Hash, Component License, SBOM Tool Name and SBOM Generation Context added as required elements"
    sources:
      - { url: "https://www.cisa.gov/sites/default/files/2026-07/2026_cisa_sbom_minimum_elements_508c.pdf", publisher: "CISA / NSA / FBI / 15 international co-authors (ASD ACSC, Canadian Centre, NÚKIB, ANSSI, BSI, CERT-In, ACN, METI, NCO, NIS/NCSC, KISA, NCSC-NL, NCSC-NZ, NASK, NBU)", date: "2026-07-29", role: "primary" }
