items:
  - title: "European Commission publishes its first official Cyber Resilience Act application guidance — 67 practical examples on scope, substantial modification and the 11 September Article 14 reporting duty"
    sources:
      - { url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation", publisher: "European Commission — Shaping Europe's Digital Future", date: "2026-07-27", role: "primary" }
      - { url: "https://www.hunton.com/privacy-and-cybersecurity-law-blog/european-commission-issues-guidance-on-the-cyber-resilience-act", publisher: "Hunton Andrews Kurth — Privacy and Cybersecurity Law Blog", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Cyber Resilience Act news this week August 2026\") → primary: European Commission, URL https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation → corroborating: Hunton Andrews Kurth, URL https://www.hunton.com/privacy-and-cybersecurity-law-blog/european-commission-issues-guidance-on-the-cyber-resilience-act"
    summary: |
      On 2026-07-27 the European Commission published Communication C(2026) 5252 with its first official
      practical guidance (with a detailed annex) on applying the Cyber Resilience Act (CRA), running to roughly
      80 pages and 67 worked examples plus flowcharts and use cases. The guidance is non-binding but is the
      Commission's authoritative interpretive position on questions vendors and public-sector procurement teams
      have been raising: which products fall in scope (including remote data-processing / SaaS-adjacent
      "products with digital elements" and free/open-source software), what counts as a "substantial
      modification" that restarts conformity obligations, how support-period duration should be determined, and
      how the reporting and risk-assessment obligations operate in practice. It gives particular attention to
      microenterprises and SMEs to reduce disproportionate compliance burden. The document lands six weeks
      ahead of the CRA's first hard operational clock already tracked by this pipeline: from 2026-09-11, Article
      14 requires manufacturers of products with digital elements to notify ENISA/the competent CSIRT of an
      actively exploited vulnerability within 24 hours of becoming aware of it, a fuller notification within 72
      hours, and a final report within 14 days. For a Swiss federal SOC, the guidance's scope clarifications
      (SaaS/remote-processing inclusion, OSS treatment) directly affect which of the constituency's EU-market
      software and hardware suppliers must stand up a 24-hour exploited-vulnerability reporting capability
      before mid-September, and the "substantial modification" clarification affects when a supplier's
      update/patch practice re-triggers conformity assessment.
    region_nexus: "EU-wide; directly affects EU-market suppliers to Swiss/European public-sector and CI customers"
    primary_sector_nexus: "indirect — supplier-compliance and procurement-assurance impact on public-sector technology suppliers"
    sector: "public-sector, cross-sector (software/hardware supply chain)"
