  - title: "Italy's Garante fines the Città Metropolitana di Sassari for a misconfigured document-protocol system that exposed a manager's disciplinary file to 29 unauthorized staff"
    sources:
      - { url: "https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10275843", publisher: "Garante per la protezione dei dati personali (Italian DPA) — Newsletter", date: "2026-07-29", role: "primary" }
      - { url: "https://www.garanteprivacy.it/garante/doc.jsp?ID=10266034", publisher: "Garante per la protezione dei dati personali — Provvedimento", date: "2026-06-11", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Garante privacy sanzione agosto 2026\") → pivot: Garante newsletter of 29 July 2026, URL https://www.garanteprivacy.it/home/docweb/-/docweb-display/docweb/10275843 → primary: Garante decision page, URL https://www.garanteprivacy.it/garante/doc.jsp?ID=10266034"
    summary: |
      Italy's data-protection authority (Garante) publicly disclosed, via its 2026-07-29 newsletter, a
      decision it adopted on 2026-06-11 sanctioning the Città Metropolitana di Sassari (a provincial/metropolitan
      government body) €12,000 (reducible to €6,000 on early settlement) for a misconfigured electronic
      document-management / protocol system. Between 25 and 29 March 2025 the system's visibility/access-level
      configuration was incoherent with staff roles: seven employees were erroneously assigned "protocol
      operator" profiles they should not have held, and as a structural consequence a reserved memorandum from
      the Interim Commissioner to the General Secretary — concerning a potential disciplinary proceeding against
      a named manager — became visible to roughly 29 unauthorized staff. The Garante found violations of GDPR
      Article 5 (integrity/confidentiality), Article 6 (lawful basis), Articles 9/10 (special-category and
      criminal/disciplinary data), and Article 25 (data protection by design), characterising the failure as
      organisation-wide rather than a one-off error. Note the timing explicitly: the underlying misconfiguration
      and decision are from 2025/June 2026 respectively — the newsletter disclosure is the fresh, in-window fact.
      The transferable lesson for public-sector document-management/e-protocollo systems (a very common
      architecture across Swiss and European cantonal/communal administration) is that default-broad or
      role-drift-tolerant visibility configuration in protocol/workflow systems is now an enforced GDPR Article
      25 failure mode, not just a hygiene recommendation, and that internal HR/disciplinary correspondence
      routed through such systems needs explicit, role-audited access scoping rather than reliance on default
      profiles.
    region_nexus: "Italy (EU public-sector body); directly transferable to Swiss cantonal/communal document-management systems"
