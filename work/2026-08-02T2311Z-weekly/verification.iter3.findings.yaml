  item: "weekly-w31-open-source-supply-chain-status"
  url_or_quote: "crediting the axios compromise to the cluster it tracks as UNC1069 - already a registered alias on the same actor record"
  summary: "The entry's headline thesis ('two vendors independently attribute the axios compromise to the same DPRK cluster') turns on SAPPHIRE SLEET == UNC1069, which neither cited primary states: GTIG says 'attributes the activity to North Korean actor MIDNIGHT NEPTUNE (formerly known as UNC1069)' with zero occurrences of 'SAPPHIRE SLEET', and AWS never says UNC1069. The mapping IS carried by CyberScoop, already in sources[] as corroborating -- 'Security researchers track the group under several names, including UNC1069, Sapphire Sleet and Stardust Chollima' -- and entities/registry.yaml records exactly that provenance, but the CyberScoop URL is never cited inline. Cite https://cyberscoop.com/amazon-north-korea-open-source-software-attacks/ at the alias clause and note GTIG's current cryptonym is MIDNIGHT NEPTUNE with UNC1069 as its former name."
