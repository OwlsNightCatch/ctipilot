  item: "weekly-w31-water-plc-lockouts-european-exposure"
  url_or_quote: "with impact falling on field equipment - cellular-connected gear at water towers and lift stations - rather than treatment processes"
  summary: "StateScoop scopes that to one city only: 'In Plymouth's case, the attack was limited to \"equipment connected via cellular communications\" at two city water towers and \"multiple\" lift stations.' Its own standfirst says 'disrupted water treatment plants in at least 30 communities' and its Braham example is a plant outage ('its water plant was \"offline for an unknown reason\"'). What generalises on the page is water quality, not the impact class. Attribute the field-equipment scoping to Plymouth or reduce the general claim to water quality being unaffected. The 30+ count and the 26-27 July dating are supported and need no change."
