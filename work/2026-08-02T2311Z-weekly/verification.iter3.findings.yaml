  item: "weekly-w31-valid-credentials-and-the-platforms-own-tools"
  url_or_quote: "Four of this week's five European incidents began with an account that was supposed to work."
  summary: "The SonicWall credential-stuffing campaign is counted as one of the five European incidents with no source support. Huntress attaches no geography ('30 organizations', 'unrelated organizations'); CyberScoop states the opposite of targeting -- 'the attacks were broad and opportunistic, hitting various SonicWall devices, rather than targeting specific types of organizations'. The frontmatter summary, title ('nearly every confirmed European public-sector incident') and headline inherit it. Recount the European set as four and carry SonicWall as the un-localised remote-access instance of the same mechanism."
