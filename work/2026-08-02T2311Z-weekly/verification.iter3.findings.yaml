  item: "weekly-w31-russian-state-nexus-government-mail-and-travel"
  url_or_quote: "https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/"
  summary: "Two mapped ids name behaviours the body never describes, and Microsoft supplies both with detection-grade depth the entry dropped. T1204.004 (Malicious Copy and Paste): body's only delivery description is 'a fake browser or operating-system update prompt', while Microsoft says 'Educate users to recognize ClickFix-style prompts, fake verification checks, and paste-and-run instructions as malicious, especially when they invoke command interpreters or script hosts such as cmd.exe, PowerShell, rundll32.exe, or mshta.exe'. T1539: body omits cookie theft and reads against it ('replay SSO sessions without browser cookies'), while Microsoft describes CornFlake's 'ChromeKatz-derived module supporting live cookie extraction from process memory (Chromium browsers) and stored password extraction from on-disk databases, including Chrome App-Bound Encryption (ABE) bypass and Firefox NSS/SDR decryption'. Describe both in the body (Triage is the natural home for the script-host lineage), which also earns the two mapped ids."
