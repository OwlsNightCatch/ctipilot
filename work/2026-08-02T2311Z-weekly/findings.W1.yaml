    summary: |
      The mission brief explicitly calls for a status re-check of actor:shinyhunters. This week's delta is Health-ISAC's 2026-07-24 sector advisory, which formalises — for the healthcare sector specifically, but written generically enough to apply to any SSO-centralised enterprise — the intrusion chain this pipeline has watched ShinyHunters run repeatedly: voice-phishing aimed at helpdesk staff, an MFA reset, password reset or device re-enrolment performed with no out-of-band identity proofing, takeover of the Entra, Okta or Google SSO account, then pivoting into every connected SaaS platform for bulk data-theft extortion with no encryption stage. The advisory's explicit framing is that "SSO [should be treated] as Tier 0 against ShinyHunters" — i.e. protected like a domain controller — and it deliberately declines to name or tally victims, directing defenders at the repeatable pattern rather than a leaderboard. Brinks Home separately confirmed an intrusion detected 2026-07-20 (alarm-monitoring unaffected) that ShinyHunters claims began with the same Entra vishing chain, a claim Brinks Home has not confirmed. On the actor's other active claim, it added Ernst & Young to its leak site on 2026-07-27, asserting to BleepingComputer that the stolen credentials from EY's already-disclosed third-party ITSM breach "allowed it into EY's Jira, GitHub and Azure environments" — a scope far beyond the support-ticket attachments EY itself acknowledged, and BleepingComputer states it "cannot verify the actor's assertions." The transferable point for any organisation outsourcing IT helpdesk/ticketing is the claimed pivot itself: credentials held by a support platform should be scoped defensively as reaching everything they can authenticate to, not just the tickets they were provisioned for, regardless of whether this specific claim is ever confirmed.
