  - title: "Minnesota water-utility PLC attack status: FBI/EPA confirm seven US states and name the exact controllers, Censys quantifies 4,117 internet-exposed Siemens S7-1200 units concentrated 86% in four EU countries, and a private researcher's CyberAv3ngers suspicion remains unconfirmed by any government agency"
