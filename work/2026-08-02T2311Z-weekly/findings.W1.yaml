  - title: "GTIG's supply-chain mitigation report quantifies a 1,444% YoY jump in malicious open-source packages and corroborates Amazon's DPRK axios attribution under its new MIDNIGHT NEPTUNE name — the npm/AI-toolchain wave keeps escalating in scale, not just technique"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise/", publisher: "Google Cloud Blog (GTIG)", date: "2026-07-30", role: "primary" }
      - { url: "https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/", publisher: "AWS Security Blog", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: mandiant-gtig RSS feed, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (item published 2026-07-30) -> primary: GTIG post, URL https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise/ -> cross-referenced against this pipeline's own 2026-07-30 entry on Amazon's Sapphire Sleet attribution, primary URL https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/"
    summary: |
      GTIG published defender-facing mitigation guidance on 2026-07-30 stating it "assesses with high confidence that the growth in very large-scale, open-source supply chain compromise campaigns, including use of worms and iterative compromises in 2025 and early 2026, represent a significant expansion" versus prior years, quantifying a 1,444% increase in malicious open-source packages from 2024 to 2025. Two named clusters extend the npm/developer-ecosystem wave this pipeline has tracked since W28: UNC6780 ("TeamPCP" — already a registered entity here as actor:teampcp) abused the `pull_request_target` GitHub Actions trigger across PyPI, npm and Docker Hub to obtain base-repository secrets and write permissions; and MIDNIGHT NEPTUNE (GTIG's new name for UNC1069) is credited with the axios compromise, the same npm package Amazon separately attributed on 2026-07-29 to a DPRK cluster it names SAPPHIRE SLEET/STARDUST CHOLLIMA/BlueNoroff — UNC1069 is already a registered alias on that entity, so this is independent cross-vendor corroboration of the same attribution under a different tracking name. GTIG separately details UNC4899's compromise of a web3 developer's workstation to inject code into the SAFE wallet frontend, causing a $1.4B cryptocurrency theft — illustrating that traditional (non-open-source) supply-chain compromise remains rare but retains outsized blast radius. GTIG explicitly names AI-assisted development ("vibe coding") as an accelerant on both sides: attackers use AI to scale planning and package-poisoning, and AI/ML package repositories plus the Model Context Protocol ecosystem are now compromise targets in their own right.
      Concrete mitigation levers GTIG recommends and that a Tier 2/3 team can action now: enforce `minimumReleaseAge` cooldowns of at least 1,440 minutes (24 hours) on npm/pnpm installs so a freshly-poisoned package is quarantined before broad adoption; move to federated OIDC tokens and FIDO2-backed SSH instead of long-lived PATs; run CI/CD on ephemeral runners; and audit any GitHub Actions workflow using `pull_request_target` for the specific credential-scope abuse UNC6780 exploited.
    region_nexus: "global — axios (100M+ weekly downloads) and the GitHub Actions supply-chain pattern are ubiquitous in Swiss/EU public-sector and CI build pipelines"
