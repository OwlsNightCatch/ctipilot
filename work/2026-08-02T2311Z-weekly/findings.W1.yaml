    summary: |
      The FBI and EPA issued a joint Public Service Announcement on 2026-07-30 (the pipeline's daily coverage already carries this, dated 2026-08-01) confirming that, since 27 July 2026, water and wastewater utilities in "at least seven states" have reported PLC-lockout incidents, and naming the targeted hardware specifically as Rockwell Automation/Allen-Bradley MicroLogix 1100 and 1400 series controllers. The attacker technique is unauthenticated remote access followed by IP-address and password changes, producing loss of monitoring/control ("loss of view") rather than confirmed unsafe water conditions; the advisory records "at least one organization reported modified PLC project files after noticing ladder logic discrepancies" and operational effects including pressure loss and flooding at some sites. FBI/EPA explicitly caution that "similar considerations should also be made with other branded PLCs" beyond the observed Rockwell devices.
      The genuinely new horizon-level fact this week is the European exposure quantification: Censys ARC's same-day research note (2026-07-30) — prompted by the same advisory but scanning a different vendor family, Siemens SIMATIC S7-1200 — found 4,117 internet-exposed hosts fingerprinting as that controller, with "Greece, Spain, Italy, and Austria together account[ing] for 86.0% of total" exposure, "each dominated by that nation's leading mobile carrier rather than fixed-line or hosting providers." This directly quantifies the constituency's own OT exposure surface for the same class of device the US incident targeted, independent of any US attribution question. On attribution, government position remains that "Neither CISA, FBI, nor EPA has made official attribution claims"; Tenable's private assessment (reported by The Register, 2026-07-29) that "the operational pattern is consistent with [CyberAv3ngers'] previous raids" given the timing relative to CISA's 22 July PLC advisory (AA26-097A) is explicitly an unconfirmed analyst hypothesis, not an established attribution, and should be carried as such.
