      This pipeline's dailies already logged both disclosures individually (2026-07-31); the horizon-level fact is that they landed on the same day and describe two distinct, independently-operating Russian state clusters converging on the same target class — government and diplomatic personnel who either self-host webmail or travel internationally — via mechanisms that both survive routine remediation. Proofpoint attributed active exploitation of CVE-2026-42897, an Outlook Web Access stored-XSS Microsoft disclosed 2026-05-14 and CISA KEV-listed the next day, to TA488 (LAUNDRY BEAR/Void Blizzard), the same actor a 16-nation joint advisory (AA26-204A, 2026-07-23) had already exposed running a parallel Zimbra webmail campaign since July 2025. Opening a crafted OWA message runs "OWAReaper," an in-reading-pane JavaScript implant with no host file that steals OAuth tokens through mailbox add-ins and grants the Exchange "Default" alias Owner permission on every mail folder — access that Proofpoint states "survives credential rotation and device re-imaging." Separately, Microsoft disclosed CaptiveCrunch on 2026-07-31, attributed to Storm-2945, "an operational sub-cluster of the SVR-attributed actor Midnight Blizzard," which since May 2026 has manipulated DNS/HTTP traffic on hospitality captive portals worldwide to serve ClickFix-style fake update prompts delivering CornFlake (a Go RAT with a self-healing watchdog) and ChocoShell (an in-memory PowerShell stealer taking M365 SSO tokens, browser cookies and Wi-Fi credentials), with device-code phishing added to some landing pages since 16 July. Both clusters explicitly target travelling government/diplomatic staff, and both establish persistence mechanisms (an application-specific password; a redundant, self-restoring RAT) that a straightforward patch or credential reset does not remove — the operational implication for CH/EU government defenders is that eviction from either intrusion path requires an active hunt for the persistence artefact, not just closing the entry vector.
