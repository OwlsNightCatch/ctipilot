    discovery_trace: "first seen at: mandiant-gtig RSS feed, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (fetched item published 2026-07-30) -> primary: GTIG naming-system post, URL https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system (dated 2026-07-24, page carries an explicit 'Updated July 30, 2026' revision note) -> corroboration: WebSearch (\"new threat actor cluster named this week August 2026 Mandiant CrowdStrike\") -> SecurityWeek, URL https://www.securityweek.com/google-adopts-new-threat-actor-naming-system/ (2026-07-28)"
    summary: |
      Google Threat Intelligence Group (GTIG) published a unified two-word cryptonym naming schema on 2026-07-24, with the article carrying an explicit "Updated July 30, 2026" revision note that falls inside this window, and independent corroboration from SecurityWeek on 2026-07-28. The schema replaces Mandiant's sequential APT/FIN/UNC numbering (and folds in Google TAG's separate tracking) with a memorable first word plus a second word denoting nexus: CASTLE (PRC), ION (Iran), NEPTUNE (North Korea), RELIC (Russia), COMET (financially motivated). GTIG states it has "initially prioritized renaming several dozen of the most active groups" on a rolling basis, and that "previous names will remain indexed and searchable" with MITRE ATT&CK mappings and vendor aliases preserved — this is a supplementary naming layer, not a wholesale retirement of existing identifiers, and UNC designations continue for uncategorized clusters.
      Renames directly touching actors this pipeline tracks: APT44/Sandworm -> SANDWORM RELIC (SecurityWeek independently confirms this exact mapping); APT34/OilRig -> SOLAR ION; APT29/Cozy Bear/Midnight Blizzard's parent cluster -> ICE RELIC; Turla Team -> TURLA RELIC (this pipeline tracks Turla under actor:secretblizzard, Microsoft's name); APT42 -> CALANQUE ION; UNC1069/MASAN (the DPRK cluster Amazon separately attributed the axios/debug/chalk npm compromises to as SAPPHIRE SLEET, 2026-07-29) -> MIDNIGHT NEPTUNE. GTIG's own 2026-07-30 supply-chain post uses "ICE RELIC (formerly known as APT29)" and "MIDNIGHT NEPTUNE" in running text, confirming the new names are already live in GTIG's own reporting rather than announced-but-unused.
    region_nexus: "global — the renamed roster includes multiple actors with standing Swiss/European government and CI targeting (Sandworm, Turla/Secret Blizzard, OilRig/Cavern Manticore, APT29/Midnight Blizzard)"
