  - title: "Russia's state-nexus email/travel espionage status: TA458/LAUNDRY BEAR weaponise a second webmail zero-day (Exchange OWA, CVE-2026-42897) while a separate SVR sub-cluster (Storm-2945/Midnight Blizzard) hijacks hotel captive portals worldwide — two independently-run Russian intrusion sets converged on 'the traveling or self-hosted-mail government user' this week"
