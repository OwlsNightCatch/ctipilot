    discovery_trace: "first seen at: this pipeline's own 2026-07-31 daily coverage (already fetched in prior runs) -> re-examined together for weekly synthesis: Proofpoint TA488/OWAReaper, URL https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit -> Microsoft CaptiveCrunch/Storm-2945, URL https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/"
