  - title: "CRA milestone: Conformity Assessment Body notification provisions apply from 11 June 2026; reporting obligations (Article 14) from 11 September 2026"
    sources:
      - url: "https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
        publisher: "European Commission (DG CONNECT)"
        date: "2026-05-17"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('EU Cyber Resilience Act implementing acts delegated regulations May 2026') → primary: EC CRA implementation fact page, URL https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
    summary: |
      Two CRA enforcement milestones fall within the next 120 days. Chapter IV provisions on notification of Conformity Assessment Bodies (CABs) become applicable on 11 June 2026 — manufacturers seeking CRA conformity certification for critical digital products will be able to use designated CABs from that date, and Member States must have designated notifying authorities by then. Article 14 reporting obligations (manufacturers reporting actively exploited vulnerabilities and severe security incidents to national CSIRTs within 24 hours, with a 72-hour notification for the incident report) apply from 11 September 2026. First standardisation deliverables (horizontal and product-specific standards) are expected Q3 2026. The Q4 2026 delegated act on EUCC presumption of conformity with CRA requirements is pending. Full application of CRA is 11 December 2027. Delegated Regulation (EU) 2026/881 on delayed dissemination of sensitive notifications was published 20 April 2026 and specifies the circumstances under which a CSIRT may delay public disclosure of a vulnerability notification on cybersecurity grounds. Swiss product manufacturers supplying EU markets and operators of digital infrastructure procuring connected products need to verify their supply chain for CRA-scope products before September 2026.
    ch_eu_nexus: "EU-wide; affects Swiss product manufacturers and ICT procurement by Swiss/EU public-sector entities"
    public_sector_nexus: "direct — Article 14 reporting flows to national CSIRTs, affecting public-sector ICT procurement and CSIRT/SOC teams"
    sector: "cross-sector, ICT supply chain"
