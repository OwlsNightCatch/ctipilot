        date: "2026-04-01"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EU NIS2 transposition 2026 May member state law enforcement infringement') → primary: EC NIS2 transposition page, URL https://digital-strategy.ec.europa.eu/en/policies/nis-transposition → WebSearch ('EU Commission infringement NIS2 transposition decision May 2026 Court of Justice referral')"
    summary: |
      As of the current run date (2026-05-17), 21 of 27 EU Member States have transposed NIS2 into national law. Six member states remain partially or fully untransposed. The European Commission sent reasoned opinions to 19 member states in May 2025, with a two-month response window; non-compliant states face Court of Justice referral. The EC's May 2025 reasoned opinions are now one year old without public Court of Justice referral announcements, suggesting most of those 19 have either completed transposition or are in active dialogue with the Commission. The W19 items on Polish NIS2 transposition (in force 3 April 2026) and Polish ABW water-sector recommendations remain valid; Poland's transposition is now complete. Swiss operators connected to EU supply chains under NIS2 essential or important entity obligations of EU customers are affected indirectly by the varying enforcement postures across member states. The status of outstanding NIS2 infringement referrals should be tracked as a pending item — no Court of Justice referral was announced this week.
