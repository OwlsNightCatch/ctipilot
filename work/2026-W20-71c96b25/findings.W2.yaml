  - title: "CISA KEV additions W20 window: CVE-2026-42897 (Microsoft Exchange XSS active exploitation, deadline 2026-05-29) and CVE-2026-20182 (Cisco SD-WAN, deadline 2026-05-17)"
    sources:
      - url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
        publisher: "CISA"
        date: "2026-05-15"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12577"
        publisher: "NCSC.ch Security Hub"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: bridge:cisa-kev → filtered to window 2026-05-10 to 2026-05-17 → two additions found: CVE-2026-42897 (2026-05-15) and CVE-2026-20182 (2026-05-14) → NCSC-CH Security Hub ID 12577 corroborates CVE-2026-42897"
    summary: |
      Two KEV additions fall within the 2026-W20 window. CVE-2026-42897 (Microsoft Exchange Server / Exchange Server SE XSS resulting in arbitrary code execution via crafted email opened in Outlook Web Access, CVSS 8.1) was added to KEV on 2026-05-15 with a federal remediation deadline of 2026-05-29. Exploitation requires the victim to open a specially crafted email in OWA — a low bar for phishing-enabled threat actors. Microsoft has not yet released a full patch; temporary mitigations include enabling EEMS (Exchange Emergency Mitigation Service) or running the EOMT script. CVE-2026-20182 (Cisco Catalyst SD-WAN authentication bypass, KEV-added 2026-05-14, deadline 2026-05-17 — today) was covered in daily 2026-05-15 via CISA ED-26-03. Both CVEs are relevant to Swiss and EU public-sector entities operating on-premises Exchange deployments or Cisco SD-WAN infrastructure. Exchange OWA phishing exploitation maps to T1190 (Exploit Public-Facing Application) and T1059.007 (JavaScript). Detection: Exchange HTTPERR logs for anomalous OWA POST requests; EDR telemetry for w3wp.exe spawning unusual child processes.
    ch_eu_nexus: "global with direct relevance to CH/EU public-sector Exchange and SD-WAN operators"
    public_sector_nexus: "direct — on-premises Exchange is prevalent in Swiss and EU public-sector environments"
    sector: "cross-sector, public-sector"
    cves: [CVE-2026-42897, CVE-2026-20182]
