  - title: "UPDATE: ENISA CVE Root — four new CNAs onboarded under ENISA Root (2026-05-06); specific CNA names not publicly disclosed"
    sources:
      - url: "https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root"
        publisher: "ENISA"
        date: "2026-05-06"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('ENISA CVE Numbering Authority CNA Root 2026 May new CNAs disclosed') → primary: ENISA news page, URL https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root (published 2026-05-06)"
    summary: |
      On 6 May 2026, ENISA announced that four organisations have newly joined the CVE Program as CNAs under ENISA Root, with seven additional existing European CNAs having transferred from MITRE Root to ENISA Root. ENISA's announcement does not name the four new CNAs. ENISA became CVE Root for European entities in November 2025. There are currently over 90 European CNAs that can voluntarily transfer; 510 CNAs total globally from 42 countries participate in the program. ENISA's CVE Root scope covers entities within its mandate, including vulnerabilities discovered by or reported to EU CSIRTs. The CCOO quoted that "frontier AI models are accelerating vulnerability discovery and exploitation" as justification for strengthening EU vulnerability management capacity. This resolves the W19 dedup item: the 4 CNAs have been confirmed as onboarded but their identities remain undisclosed in public channels.
    ch_eu_nexus: "EU-wide; strengthens the European vulnerability disclosure ecosystem under NIS2 Article 12 (coordinated vulnerability disclosure) obligations"
    public_sector_nexus: "direct — ENISA's CVE Root scope covers EU CSIRT network members, including member-state national CSIRTs"
