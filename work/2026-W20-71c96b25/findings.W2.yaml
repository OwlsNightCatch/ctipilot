  - title: "DORA first oversight cycle 2026 — ESAs begin Joint Examination Team (JET) activities for 19 designated critical ICT third-party providers (CTPPs)"
    sources:
      - url: "https://www.esma.europa.eu/press-news/esma-news/european-supervisory-authorities-designate-critical-ict-third-party-providers"
        publisher: "ESMA"
        date: "2025-11-19"
        role: "primary"
      - url: "https://legal.pwc.de/en/news/articles/esas-publish-first-list-of-critical-ict-third-party-providers-under-dora"
        publisher: "PwC Legal"
        date: "2026-01-15"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('DORA critical third-party ICT provider oversight ESA designation 2026') → primary: ESMA press release on CTPP designation, URL https://www.esma.europa.eu/press-news/esma-news/european-supervisory-authorities-designate-critical-ict-third-party-providers"
    summary: |
      The ESAs (EBA, EIOPA, ESMA) designated 19 critical ICT third-party providers (CTPPs) in November 2025 and the first complete DORA oversight cycle is underway in 2026. Joint Examination Teams (JETs) established in Q1 2026 are conducting initial examination activities that may result in recommendations and follow-ups. From a defender perspective: financial-sector entities using the 19 designated CTPPs are now subject to enhanced regulatory scrutiny of their contractual ICT arrangements, subcontracting chains, and incident-reporting flows under DORA Articles 26–44. The designated CTPPs are themselves subject to direct ESA oversight, including required cooperation with JET examinations, and are expected to demonstrate ICT risk management governance, resilience testing (TLPT for critical-function systems), and supply-chain transparency. Swiss financial institutions supervised by FINMA that use EU-designated CTPPs should confirm that their contractual arrangements comply with DORA Chapter V (ICT third-party risk management) as enforced via EU subsidiaries.
    ch_eu_nexus: "EU-wide; Swiss financial institutions with EU operations or using EU-designated CTPPs face indirect obligations"
