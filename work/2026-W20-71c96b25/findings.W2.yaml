  - title: "NIS2 transposition: Commission May 2025 reasoned opinions to 19 member states; Court of Justice referral possible for non-compliant states — status update as of May 2026"
    sources:
      - url: "https://digital-strategy.ec.europa.eu/en/policies/nis-transposition"
        publisher: "European Commission (DG CONNECT)"
        date: "2026-05-17"
        role: "primary"
