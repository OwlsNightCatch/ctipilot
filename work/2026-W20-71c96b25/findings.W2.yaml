  - title: "EDPB 2026 Coordinated Enforcement (CEF 2026) — 25 EEA data-protection authorities launch simultaneous GDPR transparency and information-obligation investigations"
    sources:
      - url: "https://www.edpb.europa.eu/news/news/2026/cef-2026-edpb-launches-coordinated-enforcement-action-transparency-and-information_en"
        publisher: "EDPB"
        date: "2026-01-01"
        role: "primary"
      - url: "https://compliancehub.wiki/edpb-2026-coordinated-enforcement-transparency-gdpr/"
        publisher: "ComplianceHub.Wiki"
        date: "2026-05-11"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EDPB coordinated enforcement transparency 2026 update privacy notice review') → primary: EDPB CEF 2026 news page, URL https://www.edpb.europa.eu/news/news/2026/cef-2026-edpb-launches-coordinated-enforcement-action-transparency-and-information_en"
    summary: |
      Twenty-five data protection authorities across the EEA simultaneously launched investigations examining compliance with GDPR Articles 12–14 (transparency and information obligations) as CEF 2026. Investigations focus on how organisations communicate their data collection, use, and sharing practices to data subjects — including the specificity required on third-country transfers, retention periods, and automated decision-making. Swiss public-sector entities operating under the Swiss revised Data Protection Act (revDSG, in force September 2023) face parallel expectations, since Swiss DPA enforcement also focuses on transparency obligations. Enforcement decisions from CEF 2026 are expected in the second half of 2026 and could establish EU-wide precedent on the required granularity of privacy notices — particularly regarding identification of individual third countries for data transfers and naming of each algorithmic profiling system where Article 13(2)(f) automated-decision disclosure applies. Entities operating cross-border EU/CH data flows should audit their privacy notices against the CEF 2026 focus areas before decisions land.
    ch_eu_nexus: "EU-wide; Swiss entities with EU operations or EU personal data processing face parallel revDSG scrutiny"
    public_sector_nexus: "direct — public bodies are major processors of personal data; government portals, HR systems, and social-services platforms are in scope"
    sector: "cross-sector, public-sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
