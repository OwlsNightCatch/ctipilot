  - title: "KRITIS-DachG registration deadline 17 July 2026 approaches — German public-administration operators of critical facilities must register with BBK/BSI within 61 days"
    sources:
      - url: "https://www.luther-lawfirm.com/en/newsroom/blog/detail/kritis-dachgesetz-in-kraft-neue-pflichten-hohe-bussgelder-und-viele-offene-fragen-fuer-betreiber-kritischer-anlagen"
        publisher: "Luther Lawfirm"
        date: "2026-05-01"
        role: "primary"
      - url: "https://www.aoshearman.com/en/insights/critical-infrastructure-new-legislation-in-germany-and-its-practical-impact"
        publisher: "A&O Shearman"
        date: "2026-04-15"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('BSI Germany KRITIS-DachG registration 17 July 2026 public administration critical infrastructure') → primary: Luther Lawfirm advisory, URL https://www.luther-lawfirm.com/en/newsroom/blog/detail/kritis-dachgesetz-in-kraft-neue-pflichten-hohe-bussgelder-und-viele-offene-fragen-fuer-betreiber-kritischer-anlagen"
    summary: |
      The KRITIS-DachG (Kritis-Dachgesetz, Germany's critical infrastructure umbrella act) entered into force and the initial registration deadline of 17 July 2026 is now 61 days away. Operators of critical facilities in scope — including public-administration entities operating infrastructure in the sectors of energy, transport, finance, IT/telecommunications, space-ground infrastructure, and public administration — must register with the Federal Office of Civil Protection and Disaster Assistance (BBK) via an electronic platform jointly operated with the BSI. Registration requires: operator name, legal form, commercial register number, address including public IP ranges, sector/industry classification, and critical-facility contact details. Violations constitute an administrative offence punishable by fines up to EUR 500,000. Public-sector IT departments in Germany should verify whether their IT and OT infrastructure qualifies as a "critical facility" under the KRITIS-DachG sector thresholds, register before 17 July 2026 or within 3 months of later qualification, and identify which services they must report under the act's disruption-reporting obligations to BBK/BSI (24-hour initial notification, 72-hour detailed report). Swiss federal entities with German subsidiaries or cross-border infrastructure should verify German subsidiary obligations.
    ch_eu_nexus: "Germany (with indirect relevance for cross-border CH/DE infrastructure operators)"
    public_sector_nexus: "direct — public-administration sector is explicitly in scope as one of the KRITIS-DachG regulated sectors"
    sector: "public-sector, energy, transport, IT/telecommunications"
