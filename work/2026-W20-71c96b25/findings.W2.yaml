  - title: "EU Digital Omnibus AI Act deal — high-risk Annex III compliance deadline extended to 2 December 2027; Annex I (product-embedded AI) to 2 August 2028"
    sources:
      - url: "https://techpolicy.press/what-the-eu-ai-omnibus-deal-changes-for-the-ai-act-and-what-lies-ahead/"
        publisher: "TechPolicy.Press"
        date: "2026-05-08"
        role: "primary"
      - url: "https://www.lexology.com/library/detail.aspx?g=34c6a42f-af33-4189-a32c-dc2e3d7a109f"
        publisher: "Lexology (Stephenson Harwood)"
        date: "2026-05-08"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EU Cybersecurity Package NIS2 amendment COM 2026 13 Cybersecurity Act 2 PQC update') → WebSearch ('European Commission AI Act Article 6 guidance published May 2026') → Council of the EU press release found via search → primary: TechPolicy.Press, URL https://techpolicy.press/what-the-eu-ai-omnibus-deal-changes-for-the-ai-act-and-what-lies-ahead/ (published 2026-05-08)"
    summary: |
      On 7 May 2026, the EU Parliament and Council of the EU reached a provisional political agreement under the Digital Omnibus package to amend the AI Act. The headline change for operators running high-risk AI systems (Article 6(2) + Annex III — biometrics, critical infrastructure, education, employment, law enforcement, border management) is that the compliance deadline shifts from 2 August 2026 to 2 December 2027, giving an additional 16 months. High-risk systems embedded in regulated products under Annex I (medical devices, machinery) receive even more runway — to 2 August 2028. The co-legislators acknowledged that harmonised technical standards and Commission guidance required for conformity assessments do not yet exist in final form. For AI security teams, the cybersecurity obligations under Articles 8–15 (robustness against adversarial attacks including prompt injection, data poisoning, and model extraction; mandatory logging; CE marking; EU database registration) still apply from 2 December 2027 for Annex III systems. Separately, the deal adds a new prohibited practice covering AI systems generating non-consensual sexual content (including CSAM), effective 2 December 2026, and clarifies AI Office competence boundaries versus national authorities for GPAI models. Formal adoption is expected before the original 2 August 2026 deadline. Swiss and EU public-sector entities deploying AI for recruitment, benefits decisions, risk scoring, or law-enforcement analytics need to update their compliance roadmaps accordingly.
    ch_eu_nexus: "EU-wide; Swiss public-sector entities deploying AI in Annex III use cases (employment screening, benefit assessment, law enforcement analytics) should note the revised deadline"
    public_sector_nexus: "direct — Annex III explicitly covers public administration AI use in law enforcement, border management, and essential public services"
    sector: "public-sector, finance, healthcare, law enforcement"
    cves: []
    actors_campaigns_malware: []
