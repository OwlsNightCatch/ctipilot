    summary: |
      Microsoft Threat Intelligence's 2026-05-14 deep-dive confirms Kazuar (attributed to Secret
      Blizzard / Turla, FSB Center 16, aliases: VENOMOUS BEAR, Snake, Uroburos, Blue Python,
      ATG26) has evolved from a classic C2 backdoor into a three-module P2P botnet: Kernel
      (coordinator node, maintains botnet state and leadership election), Bridge (C2 relay proxy,
      communicates upstream via HTTP/WebSocket/Exchange Web Services to avoid direct C2 contact),
      and Worker (task executor, performs credential and file exfiltration). Leadership election
      minimises external traffic to reduce detection surface. The Record confirms targeting of
      government ministries, embassies, and defence departments across Europe and Central Asia;
      historical overlap with Aqua Blizzard (Storm-0861) infrastructure. No named European victims
      disclosed; TTPs consistent with long-term persistent collection campaigns. Detection focus:
      Windows Mailslot and Windows Messaging IPC between processes (anomalous cross-process
      messaging to system processes), EWS usage from non-mail-client processes (4771/4769 Kerberos
      events on Exchange hosts), Exchange Web Services enumeration from non-mail-user-agent HTTP
      clients.
    ch_eu_nexus: "European government, diplomatic, and defense sectors explicitly in scope per Microsoft analysis"
    public_sector_nexus: "high — government, diplomatic"
    sector: "government, defense, diplomatic"
