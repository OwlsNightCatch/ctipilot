    summary: |
      Following the May 4 Rocket backend DB leak (attributed to a breach of hosting provider
      4VPS), administrator zeta88/hastalamuerte announced a full communications-infrastructure
      overhaul — new NAS deployment and new locker upgrades — signalling no intent to cease
      operations. The operation maintained ~332 victims in H1 2026, ranking second in global
      RaaS activity. Check Point documented initial access via CVE-2024-55591 (FortiOS
      management interface auth bypass, ITW since Nov 2024) and CVE-2025-32433 (Erlang SSH
      in Cisco context); post-access chain includes RelayKing-based NTLM relay (CVE-2025-33073),
      AD enumeration, EDR disablement, and GPO-deployed locker. A Canadian firm (Bedrock Safeguard)
      published a decryptor exploiting Go's failure to zero ephemeral XChaCha20/X25519 private
      key material from goroutine stacks post-use; 35/35 files decrypted in testing. The operator
      claims to have patched the binary. Affiliates show no evidence of forking; the core nine-person
      structure remains intact per leaked chats. Detection: process memory dumps on ransomware-
      impacted Go binaries may recover ephemeral private keys for decryption without paying ransom.
    ch_eu_nexus: "global; CVE-2024-55591 affected Fortinet devices prevalent in Swiss public-sector perimeters"
