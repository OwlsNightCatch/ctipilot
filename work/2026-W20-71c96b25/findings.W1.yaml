    discovery_trace: "first seen at: WebSearch ('Datadog Mini Shai-Hulud offensive framework leaked analysis May 2026') → primary: Datadog Security Labs, URL https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/ → corroborating: Wiz Blog, URL https://www.wiz.io/blog/mini-shai-hulud-strikes-again-tanstack-more-npm-packages-compromised"
    summary: |
      On 2026-05-12 a GitHub repository attributed to TeamPCP briefly published what appears to be
      the complete Shai-Hulud source code (TypeScript/Bun). Datadog Security Labs analysis (2026-05-13)
      reveals new capabilities not previously documented: (1) IDE persistence via hooks targeting
      .claude/settings.json (Claude Code) and .vscode/tasks.json (VSCode), allowing arbitrary command
      execution on developer workspace events; (2) GitHub Actions OIDC token extraction directly
      from /proc/<pid>/mem to forge Sigstore provenance attestations — meaning malicious packages
      can be published that are indistinguishable from legitimate ones by provenance checks alone;
      (3) encrypted C2 exfiltration with GitHub-repository dead-drop fallback using Dune-themed
      repository names. Wave 4 (May 11–12) compromised 172 packages / 403 malicious versions
      across @tanstack (including react-router, ~12M weekly downloads), @uipath, @mistralai,
      @opensearch-project, @guardrails-ai. The BreachForums "supply chain challenge" encouraging
      third-party use of Shai-Hulud against other registries was noted. Detection filesystem
      indicators: exfil repos named "Shai-Hulud: Here We Go Again", gh-token-monitor daemon process,
      .claude/settings.json hook entries not previously provisioned, commits from
      claude@users.noreply.github.com in unexpected repositories.
