    discovery_trace: "first seen at: enisa-euvd (bridge enisa-euvd recent criticals), EUVD-2026-35868, reference https://www.veeam.com/kb4869 → vendor advisory fetched via bridge https://www.veeam.com/kb4869 → NVD https://nvd.nist.gov/vuln/detail/CVE-2026-44963"
    summary: |
      CVE-2026-44963 (CVSS v4.0 9.4, CWE-502 Deserialization of Untrusted Data) allows an authenticated domain
      user to achieve remote code execution on the Veeam Backup Server. The vulnerability affects Veeam Backup
      and Replication 12.3.2.4465 and all earlier version-12 builds, but only on domain-joined backup servers;
      workgroup-joined servers are unaffected. Fixed in Veeam Backup and Replication 12.3.2.4854, released
      2026-06-09. Version 13.x is not affected due to architectural changes. The bug was discovered by Sina
      Kheirkhah of WatchTowr (the same researcher behind multiple Ivanti and SolarWinds findings this year).
      Veeam environments are a high-value ransomware target because compromising the backup server removes the
      primary recovery path. Although current status is no known exploitation, Veeam RCEs have historically seen
      rapid ransomware operator weaponization.
    ch_eu_nexus: "Direct — Veeam Backup and Replication is the dominant backup solution in Swiss and EU enterprise environments; domain-joined deployment is the default"
    public_sector_nexus: "direct"
    sector: "all sectors — Veeam widely deployed across public and private sector"
    cves: [CVE-2026-44963]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A vulnerability allowing remote code execution (RCE) on the Backup Server by an authenticated domain user."
        attribution: "Veeam KB4869"
        source_url: "https://www.veeam.com/kb4869"
      - quote: "Veeam Backup & Replication 12.3.2.4465 and all earlier version 12 builds. Note: Domain-joined backup servers only; workgroup servers are unaffected."
        attribution: "Veeam KB4869"
        source_url: "https://www.veeam.com/kb4869"
    extended_notes: |
      MITRE ATT&CK: T1210 Exploitation of Remote Services; T1486 Data Encrypted for Impact (ransomware
      follow-on). Detection: Veeam API server logs for deserialization activity from unexpected source IPs or
      user accounts; Windows Security Event 4688 (new process creation) from Veeam service account launching
      unexpected child processes; Sysmon EID 1 parent VeeamBackupSvc.exe spawning cmd.exe/powershell.exe/
      wscript.exe. Hardening: update to 12.3.2.4854 immediately; if immediate patching is blocked,
      consider removing the backup server from the domain (accepts a workgroup-only architecture per
      https://bp.veeam.com/security/Design-and-implementation/Hardening/Workgroup_or_Domain.html).

  - title: "CVE-2026-11645 — Google Chromium V8 out-of-bounds read/write: sandbox escape exploited in the wild, added to CISA KEV"
    sources:
      - url: "https://chromereleases.googleblog.com/2026/06/stable-channel-update-for-desktop_0153744567.html"
        publisher: "Google Chrome Releases"
        date: "2026-06-08"
        role: "vendor-advisory"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-11645"
        publisher: "NVD"
        date: "2026-06-08"
        role: "corroborating"
    discovery_trace: "first seen at: cisa-kev bridge (dateAdded 2026-06-09) → notes field contained https://chromereleases.googleblog.com/2026/06/stable-channel-update-for-desktop_0153744567.html → fetched via WebFetch → NVD entry https://nvd.nist.gov/vuln/detail/CVE-2026-11645"
    summary: |
      CVE-2026-11645 is an out-of-bounds read and write in the V8 JavaScript engine (Google Chrome's JIT
      compiler/interpreter) in versions prior to 149.0.7827.103. Exploitation via a crafted HTML page enables
      arbitrary code execution inside the browser sandbox. The CISA KEV entry notes the vulnerability "could
      affect multiple web browsers that utilize Chromium, including Google Chrome, Microsoft Edge, and Opera."
      The bug class (CWE-787 / CWE-125) in V8 is a classic sandbox escape precursor — an OOB write at a
      controlled offset allows an attacker to corrupt adjacent heap objects (e.g., ArrayBuffer backing store
      pointers) to gain read/write primitives that escape the Blink renderer sandbox. CISA added the CVE to KEV
      on 2026-06-09 with a federal remediation deadline of 2026-06-23. NVD CVSS is 8.8 (HIGH, AV:N/AC:L/PR:N/
      UI:R) reflecting the one-click exploit model. Chrome 149.0.7827.103 patches the bug.
    ch_eu_nexus: "Global; relevant to any EU/Swiss government desktop with Chrome or Chromium-based browser"
    public_sector_nexus: "direct — government workstations widely use Chrome or Edge (Chromium-based)"
    sector: "all sectors — browser present on virtually all endpoints"
    cves: [CVE-2026-11645]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Out of bounds read and write in V8 in Google Chrome prior to 149.0.7827.103 allowed a remote attacker to execute arbitrary code inside a sandbox via a crafted HTML page."
        attribution: "NVD"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-11645"
      - quote: "Google Chromium V8 out-of-bounds read and write vulnerability that could allow a remote attacker to execute arbitrary code inside a sandbox via a crafted HTML page. This vulnerability could affect multiple web browsers that utilize Chromium"
        attribution: "CISA KEV"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    extended_notes: |
      MITRE ATT&CK: T1189 Drive-By Compromise; T1203 Exploitation for Client Execution. Detection: EDR telemetry
      for Chrome process spawning unexpected child processes or creating PowerShell/cmd child processes; memory
      forensics looking for RWX page allocations in V8 heap region outside normal JIT code cache. Hardening:
      update Chrome/Chromium/Edge to 149.0.7827.103+; enable Chrome's Memory Tagging Extension (MTE) on
      supported ARM hardware; deploy JavaScript restriction GPO or browser isolation for high-risk endpoints.

  - title: "Ghost-Sender: Microsoft Exchange Online architecture flaw enables universal SMTP spoofing bypassing SPF/DKIM/DMARC when third-party MX is configured"
    sources:
      - url: "https://labs.infoguard.ch/posts/ghost-sender/"
        publisher: "InfoGuard Labs (Switzerland)"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12619"
        publisher: "NCSC Switzerland GovCERT"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 10) post ID 12619 → primary: InfoGuard Labs https://labs.infoguard.ch/posts/ghost-sender/ → corroborating: ghost-sender.com demo site"
    summary: |
      InfoGuard Labs (a Swiss security research organisation) disclosed "Ghost-Sender," a configuration flaw in
      Microsoft Exchange Online (EXO) affecting tenants using a third-party or on-premises mail server as their
      inbound MX record. When an external MX is in the path and no proper inbound Partner Connector or transport
      quarantine rule is configured, an attacker who knows the target domain can connect directly to the tenant's
      *.mail.protection.outlook.com SMTP endpoint and relay arbitrary messages that present as originating from
      any internal or external sender — bypassing SPF (policy marks as fail), DKIM (no signature), and DMARC
      (fail with p=quarantine/reject but EXO still delivers). Over 20% of sampled vulnerable Exchange Online
      deployments lack mitigation. Microsoft Support confirmed active abuse. A proof-of-concept tester is live
      at ghost-sender.com. No CVE identifier has been assigned; this is an architectural misconfiguration, not
      a code vulnerability. Microsoft has published guidance in the Exchange Tech Community, and InfoGuard provides
      step-by-step remediation.
    ch_eu_nexus: "Direct — InfoGuard is a Swiss security firm; NCSC Switzerland issued an advisory; affects Swiss government and private-sector tenants using third-party mail gateways in front of Exchange Online (a common hybrid configuration at federal and cantonal level)"
    public_sector_nexus: "direct"
    sector: "all sectors — Exchange Online is dominant email platform in EU public sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Exchange Online accepts unauthenticated inbound mail when external MX records are used without proper connector/transport rule configuration. Authentication Mechanisms Bypassed: SPF (fail), DKIM (none), DMARC (fail with action=oreject)"
        attribution: "InfoGuard Labs"
        source_url: "https://labs.infoguard.ch/posts/ghost-sender/"
      - quote: "Spoofed emails bypass SPF, DKIM, and DMARC validations, delivering directly to inboxes while displaying legitimate profile pictures for internal users."
        attribution: "NCSC Switzerland GovCERT"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12619"
    extended_notes: |
      MITRE ATT&CK: T1566.002 Spearphishing Link; T1586.002 Compromise Email Account (impersonation vector).
      Detection: Exchange Online Message Trace for messages where the P1 MAIL FROM domain does not match the
      sending IP's SPF record AND the P2 From header matches an internal sender; DMARC aggregate report anomalies
      where p=reject domains still show delivered messages; Microsoft Defender for Office 365 alert on "Spoof
      intelligence" events; EOP message header analysis for x-ms-exchange-skipsafelinksprocessing or
      X-Forefront-Antispam-Report lines showing SFV:SKIP on messages from unexpected relay IPs. Remediation:
      (1) Add an inbound connector of type "Partner" with TLS certificate-based authentication for the third-party
      mail filter; (2) Create a transport rule that quarantines or rejects messages arriving at the direct
      *.mail.protection.outlook.com SMTP endpoint that do not carry the gateway's relay header; (3) Review
      Microsoft Security Score config analyzer at https://security.microsoft.com/configurationAnalyzer.
      The Exchange Tech Community post https://techcommunity.microsoft.com/blog/exchange/direct-send-vs-sending-directly-to-an-exchange-online-tenant/4439865 documents the "direct send" vector and mitigation.

