    summary: |
      Arista Extensible Operating System (EOS) contains an incomplete comparison / missing factors vulnerability
      (CWE-1023) in its tunnel decapsulation logic. When a VXLAN, decap-group, or GRE tunnel decapsulation
      configuration is present, the switch will incorrectly decapsulate and forward tunneled packets whose
      destination IP matches the configured decapsulation IP, even when they originate from unexpected sources
      or carry otherwise-invalid encapsulation. This can enable an attacker to inject traffic into a VXLAN
      fabric by sending specially crafted encapsulated frames, potentially bypassing network segmentation
      controls. CISA added the CVE to KEV on 2026-06-09 with a federal remediation deadline of 2026-06-23.
      Arista published Security Advisory 0137 on 2026-05-05. The vulnerability is rated "Unknown" for ransomware
      campaign use in KEV.
    ch_eu_nexus: "Relevant to Swiss and EU datacenter operators using Arista EOS for datacenter fabric (cloud spine-leaf architectures), including financial-sector and government datacenter environments"
    public_sector_nexus: "indirect"
    sector: "datacenter networking, telco, financial sector"
    cves: [CVE-2026-7473]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Arista Extensible Operating System (EOS) contains an incomplete comparison with missing factors vulnerability when the switch incorrectly decapsulate and forwards other unexpected tunneled packet with a destination IP matching its configured decapsulation IP."
        attribution: "CISA KEV"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    extended_notes: |
      MITRE ATT&CK: T1599 Network Boundary Bridging; T1599.001 Network Address Translation Traversal. Detection:
      EOS syslog for unexpected tunnel decapsulation events; network-level anomaly detection for VXLAN traffic
      originating from non-authorised VTEP IPs; BGP EVPN control-plane audit for unexpected VTEP registrations.
      Hardening: apply Arista patch per SA-0137; restrict decapsulation source IP validation via access-list;
      enable VXLAN source-validation on VTEP interfaces.

