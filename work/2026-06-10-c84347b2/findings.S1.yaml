items:
  - title: "June 2026 Patch Tuesday: Microsoft patches 198 CVEs including HTTP.sys pre-auth RCE (CVE-2026-47291, CVSS 9.8) and publicly-disclosed HTTP/2 compression bomb"
    sources:
      - url: "https://www.rapid7.com/blog/post/em-patch-tuesday-june-2026"
        publisher: "Rapid7"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.tenable.com/blog/microsofts-june-2026-patch-tuesday-addresses-198-cves-cve-2026-49160-cve-2026-50507"
        publisher: "Tenable"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://isc.sans.edu/diary/rss/33064"
        publisher: "SANS ISC"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://msrc.microsoft.com/update-guide/releaseNote/2026-Jun"
        publisher: "Microsoft MSRC"
        date: "2026-06-09"
        role: "vendor-advisory"
    discovery_trace: "first seen at: rapid7-research, URL https://www.rapid7.com/rss.xml (feed) → primary: Rapid7 Patch Tuesday blog https://www.rapid7.com/blog/post/em-patch-tuesday-june-2026 → corroborating: Tenable https://www.tenable.com/blog/microsofts-june-2026-patch-tuesday-addresses-198-cves-cve-2026-49160-cve-2026-50507 → vendor: MSRC API (bridge:msrc release 2026-Jun)"
    summary: |
      Microsoft's June 2026 Patch Tuesday is the largest in program history at 198 CVEs (32 Critical, 166 Important),
      not counting 360 Chromium browser CVEs now excluded from MSRC enumeration. The headline pre-auth RCE is
      CVE-2026-47291 in HTTP.sys (CVSS 9.8, CWE-190 integer overflow + CWE-122 heap overflow): an unauthenticated
      attacker sends an oversized HTTP request to any Windows web server running http.sys (IIS, WinRM, etc.) triggering
      an integer wraparound into a heap write, yielding remote code execution. Microsoft rates exploitation "More
      Likely." Pre-patch mitigation is to set MaxRequestBytes in
      HKLM\SYSTEM\CurrentControlSet\Services\HTTP\Parameters to ≤ 16384 bytes. Three zero-days are publicly
      disclosed (not yet exploited): CVE-2026-49160 (HTTP.sys HTTP/2 compression bomb DoS, the IIS variant of
      CVE-2026-49975 previously patched in nginx/Apache; now MSRC assigns MaxHeadersCount registry mitigation),
      CVE-2026-50507 (BitLocker physical-bypass requiring attacker physical access), and CVE-2026-45586 (Windows
      CTFMON EoP). Independent researcher "Nightmare Eclipse" contributed uncoordinated PoC disclosures for
      CVE-2026-33825, CVE-2026-45585, CVE-2026-45498, CVE-2026-41091 (Defender EoP + Secure Boot bypass) plus
      two unpatched EoP bugs (MiniPlasma, GreenPlasma) and a new one (RoguePlanet — Defender SYSTEM EoP).
      The VSCode EoP CVE-2026-47281 (CVSS 9.6) is triggered by opening a malicious .code-workspace file and
      escalates to SYSTEM via missing authorization in the extension host. SharePoint 2016/2019 exits mainstream
      support July 14, 2026 with no ESU option.
    ch_eu_nexus: "EU-wide; HTTP.sys present in all Windows Server IIS deployments; Swiss federal IT environments run IIS-based services on Windows Server"
    public_sector_nexus: "direct — IIS/WinRM widely deployed on Windows Server in public-sector environments; BitLocker bypass relevant to unattended kiosks and laptop theft"
    sector: "all sectors — Windows Server ubiquitous"
    cves:
      - CVE-2026-47291
      - CVE-2026-49160
      - CVE-2026-50507
      - CVE-2026-45586
      - CVE-2026-44815
      - CVE-2026-47643
      - CVE-2026-47281
    actors_campaigns_malware: ["Nightmare Eclipse"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Integer overflow or wraparound in Windows HTTP.sys allows an unauthorized attacker to execute code over a network."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/releaseNote/2026-Jun"
      - quote: "In most situations, an unauthenticated attacker could send a specially crafted packet to a targeted server utilizing the HTTP Protocol Stack (http.sys) to process packets."
        attribution: "Microsoft MSRC (CVE-2026-47291 FAQ)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-47291"
      - quote: "Microsoft today released patches for 204 vulnerabilities. 38 of these vulnerabilities are considered critical, and three have been disclosed before today."
        attribution: "SANS ISC"
        source_url: "https://isc.sans.edu/diary/rss/33064"
    extended_notes: |
      DHCP Client Service RCE (CVE-2026-44815, CVSS 9.8, CWE-121 stack overflow): unauthenticated rogue DHCP
      server triggers overflow when victim Windows client calls DhcpGetOriginalSubnetMask API. Exploitation rated
      "Less Likely." Mitigation: review and restrict apps calling that API. Azure Stack Edge RCE
      (CVE-2026-47643, CVSS 9.8): path traversal in file upload — attacker crafts a file upload request with
      path escape sequences causing file writes outside intended directory. Windows Kernel RCE (CVE-2026-45657,
      CVSS 9.8, CWE-416 UAF + CWE-122): network-reachable use-after-free + heap overflow in kernel. TCP/IP EoP
      (CVE-2026-42904, CVSS 9.6). SQL Server 2016 enters ESU-only support July 14 — environments need upgrade
      planning.
      Detection: HTTP.sys overflow signatures in IIS logs (abnormally large request headers), Windows Event
      Log 5120 (failed resource allocation). For BitLocker bypass, audit physical access logs and consider
      enabling Secure Boot enforcement via GPO Computer Configuration > Windows Settings > Security Settings >
      System Services. VSCode workspace file execution: Sysmon EID 1 with parent vscode.exe child node.exe or
      cmd.exe; alert on .code-workspace file creation from external sources.

  - title: "CVE-2026-10520 — Ivanti Sentry pre-auth OS command injection (CVSS 10.0), PoC published by watchTowr"
    sources:
      - url: "https://labs.watchtowr.com/more-evidence-that-words-dont-mean-what-we-thought-they-meant-ivanti-sentry-pre-auth-os-command-injection-cve-2026-10520/"
        publisher: "watchTowr Labs"
        date: "2026-06-10"
        role: "primary"
      - url: "https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Sentry-CVE-2026-10520-CVE-2026-10523?language=en_US"
        publisher: "Ivanti PSIRT"
        date: "2026-06-09"
        role: "vendor-advisory"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-10520"
        publisher: "NVD"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: watchtowr (RSS feed https://labs.watchtowr.com/rss/) → per-article URL https://labs.watchtowr.com/more-evidence-that-words-dont-mean-what-we-thought-they-meant-ivanti-sentry-pre-auth-os-command-injection-cve-2026-10520/ → vendor advisory https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Sentry-CVE-2026-10520-CVE-2026-10523 → NVD https://nvd.nist.gov/vuln/detail/CVE-2026-10520"
    summary: |
      CVE-2026-10520 is a CVSS 10.0 pre-authenticated OS command injection in Ivanti Sentry (formerly MobileIron
      Sentry), the EMM/MDM enforcement gateway that proxies email and applications to managed devices. The
      vulnerable endpoint is /mics/api/v2/sentry/mics-config/handleMessage, served by the MICS (Multi-Instance
      Configuration Service) admin API on port 8443. The ConfigServiceController.handleMessage() method in
      mics-core-10.5.1-R10.5.1.jar accepts XML-formatted payloads containing commandexec blocks; the reqandres
      field is passed without validation through ConfigRequestProcessor.handleExecute() into
      CommonUtilities.executeNativeCommand(), which invokes native system commands — yielding root-level RCE
      with zero authentication. watchTowr published a full technical write-up and a public PoC on GitHub
      (watchtowrlabs/watchTowr-vs-Ivanti-Sentry-RCE-CVE-2026-10520-CVE-2026-10523) on 2026-06-10. The companion
      CVE-2026-10523 is also in the advisory. Ivanti has released patches: R10.5.2, R10.6.2, and R10.7.1.
      Sentry frequently guards Microsoft Exchange backend access and is widely deployed in government MDM
      environments.
    ch_eu_nexus: "Direct — Ivanti Sentry widely deployed in Swiss and EU government MDM/EMM environments; NIS2-regulated organisations use Sentry to enforce managed device email access"
    public_sector_nexus: "direct — Sentry is a reference MDM gateway in several Swiss federal IT deployments"
    sector: "government, healthcare, enterprise IT, finance"
    cves: [CVE-2026-10520, CVE-2026-10523]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An OS Command Injection vulnerability in Ivanti Sentry before the R10.5.2, R10.6.2 and R10.7.1 versions allows a remote unauthenticated user to achieve root-level remote code execution"
        attribution: "NVD / Ivanti CNA"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-10520"
      - quote: "The vulnerable endpoint `/mics/api/v2/sentry/mics-config/handleMessage` accepts user-supplied message parameters that are parsed as MICS configuration commands and passed to backend system-level operations."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/more-evidence-that-words-dont-mean-what-we-thought-they-meant-ivanti-sentry-pre-auth-os-command-injection-cve-2026-10520/"
    extended_notes: |
      MITRE ATT&CK: T1190 Exploit Public-Facing Application; T1059.004 Unix Shell. Detection: IDS/WAF rule
      for POST to /mics/api/v2/sentry/mics-config/handleMessage from non-management CIDR; Sysmon EID 1 on
      Sentry host watching for java parent process spawning /bin/sh or /bin/bash with commandexec arguments;
      kernel audit log for execve() calls from the Tomcat JVM process user. Hardening: restrict MICS admin
      interface (port 8443) to known management IPs via firewall rule; disable MICS if not required; update to
      R10.5.2 / R10.6.2 / R10.7.1 immediately given PoC is public. CVE-2026-10523 (companion bug in same advisory)
      warrants separate review from the vendor advisory. GitHub PoC: https://github.com/watchtowrlabs/watchTowr-vs-Ivanti-Sentry-RCE-CVE-2026-10520-CVE-2026-10523

  - title: "CVE-2026-44748 / CVE-2026-27671 — SAP June 2026 Patch Day: SAML XML Signature Wrapping (CVSS 9.9) and RFC memory corruption (CVSS 9.8) in NetWeaver ABAP"
    sources:
      - url: "https://onapsis.com/blog/sap-security-patch-day-june-2026"
        publisher: "Onapsis Research Labs"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12620"
        publisher: "NCSC Switzerland GovCERT"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://support.sap.com/en/my-support/knowledge-base/security-notes-news/june-2026.html"
        publisher: "SAP"
        date: "2026-06-09"
        role: "vendor-advisory"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 10) post ID 12620 → primary: Onapsis SAP Patch Day blog https://onapsis.com/blog/sap-security-patch-day-june-2026 → vendor: SAP Security Patch Day page https://support.sap.com/en/my-support/knowledge-base/security-notes-news/june-2026.html"
    summary: |
      SAP's June 2026 Patch Day includes twenty security notes of which six are HotNews (CVSS ≥ 9.0). The two
      most critical affect NetWeaver AS ABAP and ABAP Platform. CVE-2026-44748 (CVSS 9.9) is an XML Signature
      Wrapping (XSW) attack against the SAML authentication handler: an authenticated attacker can send a
      modified SAML assertion where the signed envelope contains legitimate identity data but the processed
      element is replaced with attacker-controlled identity information, enabling privilege escalation or account
      takeover without breaking the signature validation. CVE-2026-27671 (CVSS 9.8) is memory corruption via
      improper RFC protocol validation — an unauthenticated attacker sends crafted RFC requests triggering
      memory management flaws in the NetWeaver kernel (SAP Note 3746332). CVE-2026-40128 (CVSS 9.0) is a path
      traversal in NetWeaver AS Java Web Container allowing unauthenticated directory manipulation. CVE-2026-22732
      (CVSS 9.1) is a Spring Security header-stripping bug in Commerce Cloud and Data Hub where HTTP security
      response headers (including X-Frame-Options, Strict-Transport-Security) may not be written under certain
      conditions. SAP patches are deployed via the SAP Support Portal.
    ch_eu_nexus: "Direct — SAP NetWeaver ABAP/Java is the backbone ERP platform for Swiss federal departments, cantonal administrations, and large EU public-sector bodies under NIS2"
    public_sector_nexus: "direct"
    sector: "public sector, finance, manufacturing, energy, healthcare — all SAP ABAP deployments"
    cves:
      - CVE-2026-44748
      - CVE-2026-27671
      - CVE-2026-40128
      - CVE-2026-22732
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "XML Signature Wrapping vulnerability in SAML Authentication of NetWeaver AS ABAP and ABAP Platform leading to unauthorized data access — CVSS 9.9"
        attribution: "Onapsis Research Labs"
        source_url: "https://onapsis.com/blog/sap-security-patch-day-june-2026"
      - quote: "Successful exploitation allows attackers to bypass security mechanisms, access sensitive data, or induce denial-of-service conditions via network access."
        attribution: "NCSC Switzerland GovCERT"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12620"
    extended_notes: |
      MITRE ATT&CK: T1078.004 (Cloud Accounts / SAP identity abuse) for CVE-2026-44748; T1190 for RFC/ABAP
      kernel attacks. SAP ABAP SAML XSW detection: SIEM alert on saml2 log entries where RelayState or Subject
      NameID changes between request and processed assertion; SAP Security Audit Log (SM20) event class DU for
      SAML-token-related events; RFC gateway log for unexpected function module calls from external RFC clients.
      Hardening: apply SAP Notes 3746332 (RFC memory fix) and the SAML note; enable RFC gateway ACLs
      (gw/acl_mode=1); apply SAP Secure Network Communications (SNC) for all RFC connections.

  - title: "CVE-2026-44963 — Veeam Backup and Replication 12.3.2: authenticated domain-user deserialization RCE on Backup Server (CVSS 9.4)"
    sources:
      - url: "https://www.veeam.com/kb4869"
        publisher: "Veeam"
        date: "2026-06-09"
        role: "vendor-advisory"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-44963"
