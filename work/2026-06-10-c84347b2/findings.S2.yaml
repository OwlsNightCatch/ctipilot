  - title: "SAP June 2026 Patch Day: CVE-2026-44748 SAML XML Signature Wrapping (CVSS 9.9) in NetWeaver AS ABAP spans SAP_BASIS 702-919"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12620"
        publisher: "NCSC-CH GovCERT"
        date: "2026-06-09"
        role: "primary"
      - url: "https://support.sap.com/en/my-support/knowledge-base/security-notes-news/june-2026.html"
        publisher: "SAP"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://onapsis.com/blog/sap-security-patch-day-june-2026"
        publisher: "Onapsis"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/sap-fixes-critical-flaws-in-netweaver-and-commerce-cloud/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.securityweek.com/sap-patches-critical-netweaver-commerce-vulnerabilities/"
        publisher: "SecurityWeek"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://ccb.belgium.be/advisories/warning-sap-addresses-critical-vulnerabilities-affecting-multiple-sap-products-patch"
        publisher: "Centre for Cybersecurity Belgium (CCB)"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12620
      (bridge:ncsc-csh recent 10) → pivot: SAP PSIRT advisory at
      https://support.sap.com/en/my-support/knowledge-base/security-notes-news/june-2026.html
      → corroborated by Onapsis https://onapsis.com/blog/sap-security-patch-day-june-2026
      and BleepingComputer https://www.bleepingcomputer.com/news/security/sap-fixes-critical-flaws-in-netweaver-and-commerce-cloud/
    summary: |
      SAP's June 2026 Patch Day (9 June) addressed 15 new security notes including four
      critical-severity flaws. The highest-severity issue is CVE-2026-44748 (CVSS 9.9):
      an XML Signature Wrapping (XSW) vulnerability in SAP NetWeaver AS ABAP and ABAP
      Platform affecting SAP_BASIS versions 702 through 919. An attacker with low
      privileges can obtain a legitimately signed XML message, modify it (e.g. altering
      identity attributes or group memberships), and replay it to bypass SAML assertion
      validation — leading to unauthorized data access and privilege escalation across
      enterprise systems. The span of affected SAP_BASIS versions makes the patch
      footprint unusually broad. NCSC-CH's advisory (post 12620) lists three additional
      critical CVEs: CVE-2026-27671 (CVSS 9.8 — memory corruption via improper RFC
      protocol validation in NetWeaver/ABAP kernels, exploitable unauthenticated);
      CVE-2026-22732 (CVSS 9.1 — missing HTTP response headers in Spring Security
      affecting Commerce Cloud and Data Hub); and CVE-2026-40128 (CVSS 9.0 — path
      traversal in NetWeaver AS Java Web Container allowing directory manipulation and
      information disclosure). Exploitation status is listed as UNKNOWN for all four
      critical CVEs — no in-the-wild exploitation confirmed at time of publication.
      CCB Belgium issued a parallel "patch immediately" advisory targeting public-sector
      operators in Belgian government.
    ch_eu_nexus: >
      SAP is the dominant ERP platform across EU central governments, cantonal
      administrations and federal bodies in Switzerland; NCSC-CH published its own
      advisory (post 12620) for Swiss federal operators; CCB Belgium issued a public-
      sector advisory; SAP_BASIS 702-919 spans installations from ~2010 through 2026.
    public_sector_nexus: "direct"
    sector: "government, finance, enterprise"
    cves:
      - CVE-2026-44748
      - CVE-2026-27671
      - CVE-2026-22732
      - CVE-2026-40128
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-44748 CVSS3.1: 9.9 (CRITICAL) - XML Signature Wrapping issue in SAML Authentication of NetWeaver AS ABAP and ABAP Platform leading to unauthorized data access."
        attribution: "NCSC-CH GovCERT"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12620"
      - quote: "SAP NetWeaver AS ABAP and ABAP Platform affected by two critical HotNews Notes."
        attribution: "Onapsis"
        source_url: "https://onapsis.com/blog/sap-security-patch-day-june-2026"
      - quote: "CVE-2026-44748 lets a low-privileged attacker forge signed SAML assertions and bypass authentication assurance"
        attribution: "CVE-2026-44748 WebSearch summary"
        source_url: "https://cve.threatint.eu/CVE/CVE-2026-44748"
    extended_notes: |
      Defender take-away: SAP recommends applying the SAML XML Signature fix (Security
      Note for CVE-2026-44748) across all SAP_BASIS versions as priority. Temporary
      workaround: disable SAML authentication in NetWeaver AS ABAP if operationally
      feasible. For CVE-2026-27671 (RFC memory corruption), the fix is in the SAP kernel
      patches distributed via SAP ONE Support Launchpad. Detection: SAP Application Server
      ABAP system logs (SM20) and RFC connection audit logs surface unexpected inbound
      RFC connections; SIEM correlation of SM20 against change-event SM37 batch jobs can
      surface abuse. The broad SAP_BASIS version range means even organisations on older
      supported versions (702 = SAP ECC 6.0 era) must patch.

  - title: "CVE-2026-47895 — strongSwan libstrongswan double-free in identity cloning: unauthenticated RCE via EAP on all versions since 4.3.3, patch in 6.0.7"
    sources:
      - url: "https://www.strongswan.org/blog/2026/06/08/strongswan-vulnerability-(cve-2026-47895).html"
        publisher: "strongSwan Project"
        date: "2026-06-08"
        role: "primary"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1832"
        publisher: "BSI CERT-Bund"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: >
      first seen at: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1832
      (bridge:bsi-rss then bridge:bsi-csaf WID-SEC-2026-1832) → primary: strongSwan project blog
      https://www.strongswan.org/blog/2026/06/08/strongswan-vulnerability-(cve-2026-47895).html
    summary: |
      The strongSwan project disclosed CVE-2026-47895 on 8 June 2026 (fixed in 6.0.7):
      a double-free in the `clone()` method of the `identification_t` class in
      libstrongswan. The bug lies in a check for `this->encoded.len` (non-zero) but not
      for `this->encoded.ptr` (non-NULL): when an identity's binary encoding is empty
      but non-NULL (produced by `chunk_from_hex()` on empty input such as a `@#` prefix
      with no trailing bytes), both the original and cloned object point to the same heap
      allocation, causing a double-free once the clone is destroyed. On glibc systems
      (which always return a unique non-NULL pointer for zero-length `malloc()` calls —
      explicitly NOT returning NULL as some implementations might), this is reliably
      triggerable. The exploitable path is the EAP identity exchange: after completing
      an EAP-Identity exchange, the server immediately clones and stores the identity in
      an `auth_cfg_t` object; when authentication fails (likely for a crafted empty
      identity), the IKE SA is torn down and the double-free fires. All EAP methods
      that internally exchange a username/identity are potentially vulnerable (the report
      specifically names EAP-Identity, EAP-TTLS sub-identity, and XAuth with `xauth-eap`
      plugin). This is a pre-authentication RCE bug against any strongSwan IKEv2 server
      with EAP authentication enabled. Affected: strongSwan >= 4.3.3 (all versions to
      current). Fix: upgrade to 6.0.7. BSI published WID-SEC-2026-1832 on 9 June.
    ch_eu_nexus: >
      strongSwan is the canonical IPsec/IKEv2 implementation for Linux in CH/EU public
      infrastructure, federal VPN gateways, and enterprise edge devices; originated at
      ETH Zurich (HESSO / Swiss academic lineage). BSI Germany confirmed EU impact in
      WID-SEC-2026-1832 (9 Jun 2026).
    public_sector_nexus: "direct"
    sector: "government, enterprise, telco, education"
    cves:
      - CVE-2026-47895
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A vulnerability in libstrongswan related to the cloning of certain identities was discovered in strongSwan that can result in a double-free and potentially remote code execution. All versions since 4.3.3 are affected."
        attribution: "strongSwan Project"
        source_url: "https://www.strongswan.org/blog/2026/06/08/strongswan-vulnerability-(cve-2026-47895).html"
      - quote: "The latter makes this exploitable for unauthenticated remote attackers. After completing an EAP-Identity exchange, the identity gets immediately cloned and stored in an auth_cfg_t object. This causes a double-free once the IKE SA is destroyed when the authentication failed"
        attribution: "strongSwan Project"
        source_url: "https://www.strongswan.org/blog/2026/06/08/strongswan-vulnerability-(cve-2026-47895).html"
    extended_notes: |
      Detection: Network-layer — anomalous IKEv2 EAP-Identity exchanges with empty or
      malformed EAP-Identity payloads (type 1 in the EAP header, zero-length username),
      especially from unauthenticated initiators that rapidly cycle through multiple SAs.
      Host-based: `charon` (strongSwan IKEv2 daemon) crash/restart events in syslog or
      systemd journal; SIGSEGV or SIGABRT in `/var/log/syslog` tagged with `charon`.
      Hardening: Upgrade to strongSwan 6.0.7 immediately. If upgrade is not immediately
      feasible, disable EAP-based authentication methods in `ipsec.conf` / `swanctl.conf`
      as a temporary workaround (requires IKEv2 peers to use certificate-only auth).
      Distro patches: Debian, Ubuntu, Fedora, Alpine, and similar Linux distributions
      should follow their own advisory cycles — users should check distro security
      channels rather than waiting solely for upstream release.

  - title: "TYPO3 Core June 2026: 13 CVEs in versions 10.4 ELTS through 14.3 LTS — XSS, RCE, privilege escalation, and open redirect"
    sources:
