    extended_notes: |
      Patch path: Operators on ELTS branches (10.4, 11.5, 12.4) require an ELTS
      subscription for security updates — those without a subscription should accelerate
      migration to 13.4 LTS or 14.3 LTS. Detection of exploitation for the XSS chain
      (SA-2026-006): unusual TYPO3 Backend session events in the TYPO3 log
      (`sys_log`) combined with JavaScript execution indicators in frontend output;
      WAF rules blocking script injection in the `tx_form` and `EXT:felogin` parameter
      namespaces are relevant. For RCE vectors (where authenticated): monitor TYPO3
      Backend scheduler / Extbase dispatcher actions that spawn subprocess calls
      (Sysmon EID 1, parent `php-fpm`/`nginx`/`apache2`).

  - title: "Ghost-Sender: Exchange Online arbitrary email spoofing bypasses SPF/DKIM/DMARC on tenants using third-party MX — no vendor patch, InfoGuard (Swiss)"
    sources:
      - url: "https://labs.infoguard.ch/posts/ghost-sender/"
        publisher: "InfoGuard Labs"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12619"
        publisher: "NCSC-CH GovCERT"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://gbhackers.com/ghost-sender-flaw-exposes-exchange-online-users/"
        publisher: "GBHackers"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12619
      (bridge:ncsc-csh recent 10, post 12619) → primary: InfoGuard Labs
      https://labs.infoguard.ch/posts/ghost-sender/ → corroborated by GBHackers
      https://gbhackers.com/ghost-sender-flaw-exposes-exchange-online-users/
    summary: |
      Swiss security firm InfoGuard Labs disclosed "Ghost-Sender" on 9 June 2026: a
      configuration-layer email spoofing weakness in Microsoft Exchange Online that
      affects tenants routing inbound mail through a third-party spam filter or email
      gateway (i.e., where the published MX record points to a non-Microsoft service).
      In such deployments, Exchange Online's inbound connector enforces filtering only
      on the MX path; an attacker who sends directly to the tenant's
      `<domain>.mail.protection.outlook.com` endpoint bypasses the external filter
      entirely. Because Exchange accepts the direct delivery, SPF (which permits
      Microsoft's IP ranges), DKIM (no key mismatch on the spoofed From header), and
      DMARC (evaluated on the envelope-from which the attacker controls) all pass —
      spoofed mail arrives in the target inbox with no authentication warnings and
      renders with the legitimate sender's profile picture. The ghost-sender.com
      testing tool confirms the attack surface. Microsoft classified the issue as a
      "known architectural limitation" as of 29 May 2026 and has not issued a
      platform-level fix. InfoGuard tested more than 20% of Exchange Online domains
      in bug bounty scope and found them vulnerable; nearly half of organisations using
      external MX lacked the required mitigations. The attack enables high-fidelity
      BEC/CEO-fraud campaigns and spear-phishing impersonation of any internal or
      external sender, including Swiss federal department addresses and cantonal CISO
      mailboxes, against employees of any organisation relying on the third-party filter
      architecture.
    ch_eu_nexus: >
      Swiss origin (InfoGuard Baar/Steinhausen, CH); NCSC-CH published its own advisory
      (post 12619) targeting Swiss federal and cantonal administrators; the affected
      architecture (Exchange Online + Barracuda/Proofpoint/Mimecast external MX) is the
      dominant model in Swiss and EU public-sector Microsoft 365 deployments.
    public_sector_nexus: "direct"
    sector: "government, all sectors using Exchange Online with external MX"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A configuration flaw, dubbed 'Ghost-Sender', has been identified in Microsoft Exchange Online that affects tenants utilizing third-party mail filters. This weakness allows unauthorized attackers to spoof emails from any internal or external sender, completely bypassing SPF, DKIM, and DMARC validations."
        attribution: "NCSC-CH GovCERT"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12619"
      - quote: "No vendor patches available"
        attribution: "NCSC-CH GovCERT"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12619"
      - quote: "Ghost-Sender Flaw Exposes Exchange Online Users to Sender Spoofing Attacks"
        attribution: "GBHackers"
        source_url: "https://gbhackers.com/ghost-sender-flaw-exposes-exchange-online-users/"
    extended_notes: |
      Two confirmed mitigations per InfoGuard: (1) Create an Exchange Online inbound
      connector of type "Partner" (or "On-premises") with a wildcard domain match and
      restrict delivery to approved IP ranges or a pinned TLS certificate — this causes
      Exchange Online to require TLS and IP authentication on inbound mail, blocking
      direct-to-MX injections from unexpected sources. (2) Deploy a priority-0 mail flow
      rule (transport rule) that quarantines or rejects all inbound mail that does NOT
      carry the `X-MS-Exchange-Organization-AuthAs: Internal` header AND does NOT
      originate from the approved external filter IPs. Detection: Exchange Online
      Message Trace (admin.exchange.microsoft.com → Mail Flow → Message Trace) filtered
      for messages where received connector = `Default Frontend <servername>` (i.e.
      directly received by Exchange Online transport, bypassing the expected partner
      connector); SIEM alerts on the `ReceivedConnectorId` Unified Audit Log field when
      it deviates from the configured external-filter connector. Organisations should
      also check whether the `Enhanced Filtering for Connectors` feature
      (aka "skip-listing") is properly configured so that Exchange Online sees the
      original sending IP through the external filter, not just the filter's IP.

  - title: "NCSC-CH Week 23 (9 June 2026): Job-seeker targeting surge — phishing via fake interview confirmations, identity theft via freight forwarder impersonation, LinkedIn infostealer via poisoned GitHub repositories"
    sources:
      - url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_23.html"
        publisher: "NCSC Switzerland"
        date: "2026-06-09"
        role: "primary"
    discovery_trace: >
      first seen at: ncsc-ch-focus (WebFetch URL
      https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_23.html
      via bridge), then confirmed with direct bridge URL fetch → primary: same page
      (no pivot needed)
    summary: |
      NCSC Switzerland's Week 23 report (published 9 June 2026) documents a coordinated
      surge in cybercriminal targeting of job seekers across Switzerland using three
      distinct technique chains. Chain 1 — Phishing via fake interview confirmations:
      criminals send fraudulent confirmation emails for supposed interviews at legitimate-
      sounding Swiss employers, embedding links to a fake Google account login page
      that harvests Google credentials (T1566.002 Spearphishing Link, T1078 Valid
      Accounts). Chain 2 — Identity theft via freight forwarder impersonation: fraudulent
      job offers requiring identity documents for "onboarding"; criminals use stolen
      Swiss identity documents to order goods online (parcel forwarding / reshipping
      fraud). Chain 3 — Infostealer delivery via LinkedIn: compromised LinkedIn recruiter
      profiles contact candidates and direct them to download "technical assessment" or
      "onboarding" GitHub repositories containing infostealer malware targeting crypto
      wallets, browser cookies, and saved credentials (T1566.003 Spearphishing via
      Service, T1059.001 PowerShell/scripting, T1555 Credentials from Password Stores).
      NCSC notes that job seekers' urgency to respond and unfamiliarity with new employer
      processes are systematically exploited to lower vigilance. This report is new and
      distinct from the Week 22 report (booking.com/WhatsApp phishing, covered 2026-06-04).
    ch_eu_nexus: "Direct Switzerland nexus — NCSC-CH weekly report covering incidents reported to the Swiss national CERT."
    public_sector_nexus: "indirect — but public-sector HR/recruitment processes and job portals are a likely vector"
    sector: "all sectors (targeting individuals in job-seeking contexts)"
    cves: []
    actors_campaigns_malware:
      - "infostealer (unnamed, GitHub delivery)"
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Job seekers are increasingly being targeted by cybercriminals. The hope of landing a new job, along with the associated willingness to react quickly and engage with unfamiliar procedures, lowers vigilance. Attackers exploit this systematically, deploying their entire arsenal – from phishing and classic scams to the distribution of malware."
        attribution: "NCSC Switzerland"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_23.html"
    extended_notes: |
      Detection for defenders responsible for user-awareness: the LinkedIn→GitHub
      infostealer chain requires attention from HR/talent teams and employees in job-
      search mode. The GitHub repository delivery mimics a common legitimate pattern
      (sharing code challenges or onboarding scripts via GitHub). Detection signal:
      `git clone` or GitHub file downloads executed from corporate endpoints within
      minutes of a LinkedIn connection/message (Sysmon EID 1: parent process
      `GitHubDesktop.exe`, `git.exe`, or `python.exe` from a recently-cloned directory;
      unusual child processes spawned). Employee awareness: verify recruiter identities
      through official company channels before downloading any code or entering
      credentials.

  - title: "CRA UPDATE: June 11 notifying-authority designation deadline arrives — first operational CRA milestone"
    sources:
      - url: "https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
        publisher: "European Commission Digital Strategy"
        date: "2026-06-10"
        role: "primary"
    discovery_trace: >
      first seen at: WebSearch ("CRA Cyber Resilience Act June 11 2026 notifying authority
      designation deadline update") → pivot: European Commission Digital Strategy page
      https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation
    summary: |
      11 June 2026 is the first mandatory operational milestone under the EU Cyber
      Resilience Act (CRA): EU member states must have designated their notifying
      authority — the national body responsible for assessing, designating, and notifying
      conformity assessment bodies (CABs) for higher-risk CRA product categories — by
      this date. Chapter IV of the CRA (notification of conformity assessment bodies)
      enters force on 11 June 2026. Member states that have not yet made their
      designation are in breach as of today (2026-06-10). The practical implication is
      that manufacturers of Class II and Class III CRA products (higher-risk embedded/
      IoT devices) can now begin engaging notified CABs for third-party conformity
      assessment; the first notified bodies are expected to be operational by
      December 2026. This is the upstream gate for the full CRA applicability
      (11 December 2027) and the September 2026 incident-reporting obligations milestone.
      No official Commission communique on member-state non-compliance has been published
      as of 2026-06-10.
    ch_eu_nexus: "Direct EU nexus — CRA is EU law; Switzerland (not EU member) monitors for potential equivalence under bilateral digital accords."
    public_sector_nexus: "indirect — but public-sector procurement of connected devices is directly affected"
    sector: "government, technology, OT/ICS, IoT manufacturers"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: "update-to-prior:2026-W23"
    evidence:
      - quote: "Chapter IV on the notification of conformity assessment bodies will apply from 11 June 2026, whereas reporting obligations set out in Article 14 apply from 11 September 2026."
        attribution: "EU CRA FAQ/Implementation page summary"
        source_url: "https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
    extended_notes: |
      This is the UPDATE shape for the CRA item first covered in the W23 weekly brief
      (2026-W23, section weekly-policy). The material delta: the deadline is now
      TODAY (2026-06-11 by end-of-day). No fresh Commission announcement was found
      confirming specific member-state designations — only the general regulatory
      deadline is confirmed via the EC implementation factpage. If the main agent finds
