    discovery_trace: >
      first seen at: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1835
      (bridge:bsi-rss then bridge:bsi-csaf WID-SEC-2026-1835) → primary: TYPO3 security
      advisories https://typo3.org/security/advisory/typo3-core-sa-2026-006
    summary: |
      TYPO3 published 13 security advisories (TYPO3-CORE-SA-2026-006 through -019, with
      SA-017 resequenced) on 8 June 2026 addressing vulnerabilities across all supported
      branches: 10.4 ELTS (< 10.4.57 ELTS), 11.5 ELTS (< 11.5.51 ELTS), 12.4 ELTS
      (< 12.4.46 ELTS), 13.4 LTS (< 13.4.31 LTS), and 14.3 LTS (< 14.3.3 LTS). BSI
      CERT-Bund catalogued these collectively as WID-SEC-2026-1835 (HIGH severity) on
      9 June. CVEs assigned include CVE-2026-11607, CVE-2026-47343 through CVE-2026-47352,
      CVE-2026-49738, CVE-2026-49740 through CVE-2026-49742. Per the TYPO3 advisory
      titles available, the batch addresses: XSS bypassing HTML Sanitizer
      (TYPO3-CORE-SA-2026-006), authenticated remote code execution, privilege escalation,
      open redirect, and multiple other security-restriction bypasses.
      TYPO3 is the dominant open-source CMS for German-speaking public-sector websites
      (federal ministries, cantonal websites, university portals across DACH). The broad
      version span (10.4 ELTS through 14.3 LTS) means every production TYPO3 deployment
      has at least one CVE in this batch. Exploitation status: UNKNOWN (no active
      exploitation confirmed at disclosure).
    ch_eu_nexus: >
      TYPO3 is the most widely deployed CMS in Swiss and German public-sector web
      infrastructure, including federal department websites, cantonal administrations,
      municipal portals, and many higher-education institutions across DACH.
