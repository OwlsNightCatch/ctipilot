  - title: "Check Point Research: impersonation-TDS-click-hijacking ecosystem delivers SessionGate, RemusStealer, and AnimateClipper to security-tool searchers"
    sources:
      - { url: "https://research.checkpoint.com/2026/impersonation-click-hijacking-and-tds-inside-a-malware-distribution-ecosystem/", publisher: "Check Point Research", date: "2026-06-03", role: "primary" }
    discovery_trace: "first seen at: Check Point Research RSS feed https://research.checkpoint.com/feed/ → primary (no pivot needed, CPR is the research author): https://research.checkpoint.com/2026/impersonation-click-hijacking-and-tds-inside-a-malware-distribution-ecosystem/"
    summary: |
      Check Point Research documented a large-scale malware distribution operation that impersonates open-source security tools (Ghidra, dnSpy, ILSpy) using CloudFront-hosted JavaScript to intercept download clicks and route victims through a multi-stage Traffic Distribution System. The TDS enforces geographic, device-type, VPN-presence, and frequency-cap filtering before delivering one of three payloads: SessionGate (multi-stage loader with AES-encrypted modules and per-session payload generation), RemusStealer (infostealer targeting 20+ browsers, 220+ crypto wallet extensions, 77 password-manager extensions, and 18 2FA tools), or AnimateClipper (clipboard hijacker with BNB Smart Chain testnet on-chain C2). The operation exploits legitimate ad-tech infrastructure for traffic acquisition and enforces strict anti-analysis measures including VPN/datacenter filtering and one-time key release semantics, making sandbox analysis difficult. RemusStealer was observed advertised on Russian underground forums by "RemusStealer" in February 2026. The primary targeting is security researchers and developers who search for trusted open-source tools — a social-engineering channel that bypasses typical phishing awareness training. Detection: process-creation events showing `ghidra` / `dnspy` / `ilspy` download-then-execute chains via browser child processes; DNS lookups for CloudFront-hosted lookalike domains; clipboard API calls from unexpected processes (AnimateClipper); browser extension scanning for known wallet-stealer signatures.
    ch_eu_nexus: "global — security researchers and developers in CH/EU targeted; Swiss security firms using Ghidra/dnSpy/ILSpy for malware analysis are in scope"
    public_sector_nexus: "indirect — public-sector SOC analysts and malware reverse engineers use these tools"
    sector: "security research, financial (crypto), technology"
    cves: []
    actors_campaigns_malware: ["SessionGate", "RemusStealer", "AnimateClipper"]
