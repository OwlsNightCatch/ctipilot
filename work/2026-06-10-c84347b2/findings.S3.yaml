    novelty: new
    evidence:
      - quote: "Researchers documented a large-scale operation impersonating open-source tools (Ghidra, dnSpy, ILSpy) using CloudFront-hosted JavaScript to intercept download clicks and route users through a gated Traffic Distribution System."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/impersonation-click-hijacking-and-tds-inside-a-malware-distribution-ecosystem/"
    extended_notes: |
