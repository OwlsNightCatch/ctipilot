    summary: |
      Veeam patched CVE-2026-44963 (CVSS v4 9.4, Critical) in Backup & Replication on June 9, 2026, affecting all version 12 builds up to and including 12.3.2.4465. The vulnerability allows any authenticated domain user — the account does not require elevated privileges within Veeam — to execute arbitrary code remotely on the Backup Server when it is domain-joined. Researcher Sina Kheirkhah of watchTowr discovered and reported the flaw. Version 13.x is unaffected due to architectural changes. Patch is version 12.3.2.4854. No active exploitation confirmed at time of disclosure, but Veeam backup infrastructure is a perennial ransomware pre-encryption target (attackers disable or corrupt backup repositories before deploying ransomware). Detection: anomalous RPC or Veeam API calls from domain service accounts not associated with backup jobs; Veeam Backup Server process spawning unexpected child processes; network connections from backup server to unusual internal hosts. Hardening: restrict Veeam Backup Server domain membership to a dedicated OU with tightly scoped GPO; apply principle of least privilege to domain accounts with Veeam access; upgrade to 12.3.2.4854 or 13.x immediately.
    ch_eu_nexus: "global — Veeam is the dominant backup solution for European enterprise; ransomware operations targeting EU organisations routinely target backup infrastructure first"
    public_sector_nexus: "direct — Veeam is widely used in Swiss cantonal IT and EU public-sector backup environments"
