  - title: "Unit 42: cloud logging defense evasion — attacker techniques for blinding AWS CloudTrail and Google Cloud Logging, with concrete SIEM detection alert mappings"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/cloud-logging-defense-evasion/", publisher: "Unit 42", date: "2026-06-09", role: "primary" }
    discovery_trace: "first seen at: unit42 RSS feed https://unit42.paloaltonetworks.com/feed/ → primary (no pivot needed): https://unit42.paloaltonetworks.com/cloud-logging-defense-evasion/"
    summary: |
      Unit 42 researcher Yahav Festinger catalogues seven cloud logging attack categories across AWS CloudTrail and Google Cloud Logging — five for defense evasion and two for attacker visibility. Evasion techniques include: stopping CloudTrail trails (`StopLogging` API call), deleting S3/GCS storage destinations, removing log routing sinks (GCP log routers), impairing customer-managed encryption keys (CMEK) to render logs unreadable, and log poisoning to forge benign-looking entries masking malicious activity. Visibility techniques allow adversaries to redirect logs to attacker-controlled accounts via cross-account delivery, enabling long-term reconnaissance of defender detection activity. The research maps each technique to specific Cortex XDR analytic alert names — useful as detection engineering reference for non-Cortex environments. Core hardening: enable S3 Object Lock / GCS locked log bucket retention (immutable retention); restrict `cloudtrail:StopLogging`, `cloudtrail:DeleteTrail`, `logging.sinks.delete` via IAM policies; monitor for `cloudtrail:UpdateTrail` modifying KMS key associations; alert on any modification to KMS key policies affecting CloudTrail encryption. For detection: CloudTrail Management Events for `StopLogging`, `DeleteTrail`, `UpdateTrail`; GCP `AuditLog` for `logging.sinks.delete` / `logging.sinks.update`; AWS Config change detection on Trail resources.
    ch_eu_nexus: "global — relevant for any EU/CH organisation using AWS or Google Cloud; EU financial services and public cloud users directly in scope"
    public_sector_nexus: "indirect — EU public sector increasingly on AWS/GCP; cloud logging integrity is a NIS2 incident-detection requirement"
