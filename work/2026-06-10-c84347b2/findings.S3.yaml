      Corroborating secondary reference: Fullstory blog linked in CPR article at https://www.fullstory.com/blog/inside-a-global-campaign-hijacking-open-source-project-identities/ — but not independently fetched.
      MITRE: T1566 (impersonation sites), T1204 (user execution via click interception), T1140 (deobfuscation), T1555 (credentials from password managers), T1185 (browser info discovery), T1111 (MFA interception via 2FA extension targeting).

