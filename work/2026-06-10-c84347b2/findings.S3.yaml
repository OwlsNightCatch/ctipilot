  - title: "Veeam Backup & Replication CVE-2026-44963 (CVSS 9.4): authenticated domain user to RCE on backup server — watchTowr researcher, patched in 12.3.2.4854"
    sources:
      - { url: "https://www.veeam.com/kb4869", publisher: "Veeam KB", date: "2026-06-09", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/veeam-backup-replication-rce-flaw-lets.html", publisher: "The Hacker News", date: "2026-06-09", role: "corroborating" }
