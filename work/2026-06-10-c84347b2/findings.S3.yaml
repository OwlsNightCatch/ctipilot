    discovery_trace: "first seen at: TrendMicro Research feed https://feeds.feedburner.com/TrendMicroResearch → primary: Trend Micro article https://www.trendmicro.com/en_us/research/26/f/old-winrar-flaw-fuels-attacks-on-ukraine.html → corroborating: THN https://thehackernews.com/2026/06/winrar-flaw-exploited-by-russia-aligned.html"
    summary: |
      Trend Micro documents two concurrent Russia-aligned campaigns still exploiting CVE-2025-8088 — a path traversal via NTFS Alternate Data Streams in WinRAR patched in July 2025 — nearly a year after the fix shipped. Earth Dahu (Gamaredon / UAC-0010) delivers an HTA-to-VBScript chain that drops espionage modules including GammaPhish/GammaLoad/GammaSteel. SHADOW-EARTH-066 (UAC-0226) deploys GIFTEDCROOK via crafted RAR archives with decoy PDFs and hidden ADS payloads that extract to the Startup folder, executing PowerShell in-memory DLL loaders to steal passwords, cookies, and documents from Chrome, Edge, Opera, and Firefox. Both actors have adapted C2 exfiltration away from Telegram following Russia's block in February 2026, now routing to dedicated C2 servers. The continued exploitation of a patched vulnerability underscores the scale of unmanaged WinRAR installs in Ukrainian government and defence sectors. Detection: `wscript.exe` / `mshta.exe` spawned from archive-extraction events; Startup folder (`%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup`) writes via Sysmon EID 11; PowerShell `-EncodedCommand` or in-memory reflection loading (EID 4104 script-block logging); browser credential path access anomalies.
    ch_eu_nexus: "Ukraine primary, but Earth Dahu / Gamaredon have previously targeted European defence-industrial base and government entities; CVE-2025-8088 affects any unpatched WinRAR globally"
    public_sector_nexus: "direct — Ukrainian government and defence primary; EU defence-adjacent environments secondary"
