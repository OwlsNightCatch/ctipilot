  - title: "Windows HTTP.sys CVE-2026-47291: integer overflow to unauthenticated network RCE (CVSS 9.8, Critical) — June Patch Tuesday; registry mitigation available"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-47291", publisher: "Microsoft MSRC", date: "2026-06-09", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/em-patch-tuesday-june-2026", publisher: "Rapid7", date: "2026-06-09", role: "corroborating" }
    discovery_trace: "first seen at: msrc-release bridge subcommand (June 2026 release, filtered for high-CVSS/exploited) → primary: MSRC OData API / human URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-47291 → corroborating: Rapid7 Patch Tuesday analysis https://www.rapid7.com/blog/post/em-patch-tuesday-june-2026"
    summary: |
      CVE-2026-47291 is a critical, unauthenticated network RCE (CVSS 9.8) in the Windows HTTP Protocol Stack (HTTP.sys) caused by an integer overflow / wraparound (CWE-190) triggering a heap-based buffer overflow (CWE-122). An attacker sends a specially crafted packet to any server running HTTP.sys (IIS, WinRM, WinRM-HTTPS, WMI over HTTP, Remote Management, and many other Windows services) without any authentication. Rated "Exploitation More Likely" by Microsoft. Partial pre-patch mitigation: systems where `HKLM\SYSTEM\CurrentControlSet\Services\HTTP\Parameters\MaxRequestBytes` is at or below the default (16384 bytes / 16 KB) are not impacted; organisations that have raised this value above ~65 KB are exposed and should either patch or reset the registry value. Applies to all currently supported Windows Server and Windows Client versions. Detection: network-layer IDS/WAF for malformed HTTP/1.x packets with oversized request headers to Windows services; event log monitoring for HTTP.sys crashes (BSOD, Event ID 1001) or abnormal process spawning from `ntoskrnl.exe` / `http.sys` context. Priority patch target for any organisation hosting IIS, WinRM, or REST APIs directly on Windows Server.
    ch_eu_nexus: "global — affects all supported Windows Server versions; EU public-sector Windows Server deployments running IIS or WinRM exposed to internal or external networks are affected"
    public_sector_nexus: "direct — Windows Server / IIS pervasive across Swiss cantonal and EU government infrastructure"
    sector: "all — Windows Server infrastructure"
    cves: [CVE-2026-47291]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Integer overflow or wraparound in Windows HTTP.sys allows an unauthorized attacker to execute code over a network. Systems using the default value (16384 bytes / 16 KB) are not impacted by this vulnerability."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-47291"
      - quote: "HTTP.sys Remote Code Execution — No public disclosure; Exploitation More Likely; Critical impact on web services"
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/em-patch-tuesday-june-2026"
    extended_notes: |
      Registry workaround: Set `HKLM\SYSTEM\CurrentControlSet\Services\HTTP\Parameters\MaxRequestBytes` to 16384 (default) or 65534 maximum; restart HTTP service (`net stop http /y && net start http`).
      June 2026 Patch Tuesday also includes CVE-2026-44815 (DHCP Client Service RCE, CVSS 9.8, "Less Likely") and CVE-2026-42904 (Windows TCP/IP EoP, CVSS 9.6), plus three publicly disclosed vulns: CVE-2026-50507 (BitLocker bypass, 6.8), CVE-2026-49160 (HTTP.sys DoS, 7.5, AI-discovered), and CVE-2026-45586 (CTFMON EoP, 7.8). None confirmed exploited in the wild at publication. Total release: 200 Microsoft CVEs + 360 Chromium CVEs.

