        attribution: "Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/cloud-logging-defense-evasion/"
    extended_notes: |
      [SINGLE-SOURCE — HIGH reliability vendor primary researcher, Unit 42].
      MITRE ATT&CK mapping: T1562.008 (Impair Defenses: Disable or Modify Cloud Logs), T1070 (Indicator Removal), T1530 (Data from Cloud Storage).
      Cortex XDR alert names provided as detection reference: "AWS-CloudTrail-has-been-stopped", "AWS-CloudTrail-modification", "GCP-logging-sink-modification", "GCP-Logging-Bucket-Deletion", "CloudTrail-logging-deletion", "GCP-logging-sink-deletion", "Logging-was-impaired-via-external-encryption-key", "Suspicious-activity-on-logging-bucket".

  - title: "Red Canary: Microsoft Entra Agent ID assistive-agent abuse — OBO OAuth flow enables delegated phishing from compromised AI agent context"
    sources:
      - { url: "https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-assistive-agents/", publisher: "Red Canary", date: "2026-06-08", role: "primary" }
    discovery_trace: "first seen at: Red Canary RSS feed https://www.redcanary.com/feed/ → primary (no pivot needed, Red Canary is the research author): https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-assistive-agents/"
    summary: |
      Red Canary's third article in its Entra ID AI-agent threat series examines the On-Behalf-Of (OBO) OAuth flow exploited through assistive AI agents. When an agent blueprint is configured with `access_agent` scope and granted broad permissions (Mail.Send, Mail.ReadWrite, Group.Read.All, MailboxSettings.ReadWrite), a compromised or malicious agent can send phishing emails via Microsoft Graph API with full delegated authority — appearing to originate from the impersonated legitimate user. The attack is stealthy because standard user sign-in and Exchange audit logs show the agent acting on behalf of the user, not an attacker. Three correlated log sources are required to detect it: MicrosoftGraphActivityLogs (look for `Agent.agentType = agenticAppInstance AND Agent.agentSubjectType = notAgentic`), AADNonInteractiveUserSignInLogs, and Exchange Purview audit logs. The `ClientRequestId` can be cross-correlated across Graph and Exchange logs to reconstruct the full send chain. Red Canary also notes the ConsentFix technique (localhost redirect URI exploitation for consent phishing) as a vector for initially granting overbroad permissions. Defenders should audit Entra agent blueprint permission grants for dangerous scope combinations; restrict agents to principle of least privilege; and build detection on the `Agent.*` fields now available in Entra audit logs.
    ch_eu_nexus: "global — Microsoft 365 / Entra ID pervasive across CH and EU public sector; AI agent features are increasingly enabled in Microsoft 365 Copilot deployments"
    public_sector_nexus: "direct — Microsoft 365 is the dominant productivity suite in Swiss cantonal and federal government"
    sector: "government, financial, enterprise technology"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Key identifier: Agent.agentType == agenticAppInstance AND Agent.agentSubjectType == notAgentic indicates OBO flow activity. The case study demonstrates an agent sending phishing emails using Graph API's sendMail endpoint with delegated permissions including Mail.Send and Mail.ReadWrite scopes."
        attribution: "Red Canary"
        source_url: "https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-assistive-agents/"
    extended_notes: |
      [SINGLE-SOURCE — HIGH reliability original research].
      MITRE ATT&CK: T1199 (Trusted Relationship via agent impersonation), T1566.002 (Phishing: Spearphishing Link if payload included), T1078.004 (Cloud Accounts — OBO token abuse).
      Detection hunt queries: MicrosoftGraphActivityLogs for `Agent.parentAppId` with dangerous scope combinations; AADNonInteractiveUserSignInLogs for `Agent.agentType = agenticAppInstance`; Exchange Purview for `POST /beta/users/[user]/microsoft.graph.sendMail` from external recipients.
      Microsoft has blocked some dangerous permissions for agents at the platform level (`Graph permissions blocked for agents`), but custom agent blueprints with `AllPrincipals` consent type can still gain access through admin-granted consent.

  - title: "Dragos Q1 2026 Industrial Ransomware Analysis: 1,020 incidents, Qilin leads with 198, manufacturing 62%, and The Gentleman RaaS surges 4x against European energy"
    sources:
      - { url: "https://www.dragos.com/dragos-industrial-ransomware-analysis-q1-2026", publisher: "Dragos", date: "2026-06-03", role: "primary" }
    discovery_trace: "first seen at: risky.biz RSS feed linked reference → pivot: Dragos report page https://www.dragos.com/dragos-industrial-ransomware-analysis-q1-2026 → primary (no further pivot)"
    summary: |
      Dragos' Q1 2026 Industrial Ransomware Analysis (published June 3) documents 1,020 ransomware incidents against industrial organisations globally, with manufacturing at 62% of victims. The top five RaaS ecosystems by volume were Qilin (198), Akira (100), The Gentleman (83, quadrupled from Q4 2025), LockBit 5.0 (71), and Play (53). The Gentleman specifically targeted European energy infrastructure: Romanian coal producer Complexul Energetic Oltenia (December 2025), Romanian national water authority Apele Române (~1,000 systems), and Romanian oil pipeline operator Conpet (February 2026, ~1 TB alleged). Most attacks targeted enterprise IT systems adjacent to OT rather than ICS-specific malware; OT/SCADA processes remained unaffected in documented cases but operational disruption occurred in multiple instances. Dominant attack vectors: exploitation of internet-facing services, compromised credentials from infostealers, and VPN infrastructure abuse — not ICS-protocol-level attacks. Remote management tools (AnyDesk, SimpleHelp, Atera, Level, N-able, ConnectWise ScreenConnect) were abused post-compromise for persistence and lateral movement. ICS engineering firms (90 incidents) and equipment manufacturers (49 incidents) were disproportionately targeted as indirect routes to operator networks. Q1 2026 also saw a notable Iranian-linked RaaS — Pay2Key — intensify operations following the July 2025 Israel-Iran conflict resumption.
    ch_eu_nexus: "direct EU relevance — Romanian energy infrastructure heavily targeted; European manufacturing (25% of global incidents) affected; ICS engineering firms serving Swiss/EU critical infrastructure are lateral-access targets"
