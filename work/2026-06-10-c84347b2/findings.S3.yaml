  - title: "Hades PyPI campaign: 19 packages poisoned with .pth startup-hook to deliver Bun-based credential stealer targeting developer cloud, AI, and VCS secrets"
    sources:
      - { url: "https://thehackernews.com/2026/06/hades-pypi-attack-19-packages-poisoned.html", publisher: "The Hacker News", date: "2026-06-09", role: "primary" }
      - { url: "https://socket.dev/blog/shai-hulud-descends-to-hades-miasma-pypi-wave", publisher: "Socket.dev", date: "2026-06-07", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS, URL https://feeds.feedburner.com/TheHackersNews → pivot: The Hacker News article https://thehackernews.com/2026/06/hades-pypi-attack-19-packages-poisoned.html → primary: Socket.dev analysis https://socket.dev/blog/shai-hulud-descends-to-hades-miasma-pypi-wave"
    summary: |
      The Hades campaign — a third extension of the Mini Shai-Hulud/Miasma supply-chain worm lineage — targeted PyPI with 37 malicious wheel artifacts across 19 packages. The attack exploits Python's site module startup mechanism: malicious `*-setup.pth` files execute automatically on interpreter startup without requiring any import statement. The payload downloads the Bun JavaScript runtime (v1.3.13) from GitHub and runs a triple-encrypted (AES-GCM / PBKDF2-SHA256 / gzip) JavaScript `_index.js`, which sweeps developer credentials including GitHub tokens and Actions secrets, npm/PyPI/RubyGems/JFrog credentials, AWS/GCP/Azure access keys, Kubernetes configurations, Docker configs, Vault tokens, SSH keys, `.env` files, and AI tool configurations (Claude/MCP/Cline/Aider/Copilot). A secondary cluster uses obfuscated import hooks in `__init__.py` with novel prompt-injection techniques targeting LLM-based security scanners. Exfiltration uses GitHub repository commits keyed with campaign markers. The campaign also installs backdoor configurations in AI coding-assistant workspace folders, making future AI agent sessions execute attacker instructions. Affected packages included scientific/bioinformatics packages (`napari-ufish`, `spateo-release`, `dynamo-release`, `ufish`, `coolbox`) as well as developer tooling; all have been removed. Defenders should hunt `_setup.pth` file creation events (`site-packages/**/*.pth`), Bun binary downloads from `github.com/oven-sh/bun`, and sentinel file creation at `$TMPDIR/.bun_ran` via process-creation telemetry (Sysmon EID 1 with parent `python`/`pip`).
    ch_eu_nexus: "direct — affects European developers using PyPI; bioinformatics packages suggest academic/research institute targeting consistent with Swiss university environments; AI coding-agent config injection affects developers using Claude, Copilot, and similar tools"
    public_sector_nexus: "indirect — developer-toolchain supply chain; research institute and university environments in scope via bioinformatics packages"
    sector: "software supply chain, technology, research/academic"
    cves: []
    actors_campaigns_malware: ["Hades", "Mini Shai-Hulud", "Miasma"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Miasma supply chain campaign has sparked a fresh attack wave called Hades, this time involving 37 malicious wheel artifacts across 19 packages in the Python Package Index (PyPI) registry"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/hades-pypi-attack-19-packages-poisoned.html"
      - quote: "Socket identified 37 malicious wheels across 19 PyPI packages that exploit Python's `.pth` startup mechanism to execute obfuscated JavaScript payloads via the Bun runtime"
        attribution: "Socket.dev"
        source_url: "https://socket.dev/blog/shai-hulud-descends-to-hades-miasma-pypi-wave"
    extended_notes: |
      Technique linkage: T1547.013 (Boot/Logon Initialization via .pth site module), T1059.007 (JavaScript via Bun), T1555 (Credentials from Password Stores), T1083 (File and Directory Discovery).
      The bioinformatics cluster (embiggen, ensmallen, gpsea, mflux-streamlit, nhmpy, ppkt2synergy, pyphetools) specifically targets research institutions. Swiss universities running research compute environments with PyPI dependencies should audit recently installed packages.
      The Miasma/Shai-Hulud/Hades multi-front campaign now spans npm, PyPI, and GitHub, with the same actor also targeting Microsoft GitHub repositories (73 disabled). Long-running campaign rule applies — consolidate to UPDATE if re-reporting within a week.

  - title: "PAN-OS CVE-2026-0257: GlobalProtect authentication-bypass actively exploited — authentication override cookie forgery via TLS certificate public-key extraction"
    sources:
      - { url: "https://security.paloaltonetworks.com/CVE-2026-0257", publisher: "Palo Alto Networks PSIRT", date: "2026-05-13 (updated 2026-06-03)", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/", publisher: "Rapid7", date: "2026-05-29 (updated 2026-06-03)", role: "corroborating" }
      - { url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/", publisher: "Unit 42", date: "2026-06-09", role: "corroborating" }
    discovery_trace: "first seen at: unit42 feed, URL https://unit42.paloaltonetworks.com/feed/ → primary: Palo Alto PSIRT advisory https://security.paloaltonetworks.com/CVE-2026-0257 → corroborating: Rapid7 ETR https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"
    summary: |
      CVE-2026-0257 is an authentication bypass in PAN-OS GlobalProtect portal and gateway components rooted in reliance on cookies without integrity checking (CWE-565). When the authentication override cookie feature is enabled and the encryption certificate is shared with another function (e.g., HTTPS admin access), an attacker can extract the certificate's public key from the TLS handshake and forge valid authentication override cookies, bypassing authentication entirely and establishing VPN sessions as unauthenticated remote users. The bug requires no credentials but does require network-level access to the GlobalProtect portal/gateway and specific misconfiguration (shared certificate). Rapid7 observed successful exploitation starting May 17, 2026 from low-cost hosting provider IPs. Unit 42's June 9 update confirms a limited number of probed devices successfully established gateway-connected sessions, with hardcoded PoC-derived indicators (MAC addresses `aa:bb:cc:dd:ee:ff`, hostname `WINDOWS-LAPTOP-001`, empty domain field). CISA added to KEV on May 29, 2026. PAN-OS 10.2, 11.1, 11.2, 12.1 and Prisma Access 10.2.0/11.2.0 are affected; patched in 12.1.7+, 11.2.12+, 11.1.15+, 10.2.18-h6+, Prisma Access 10.2.10-h36+/11.2.7-h13+. Workaround: disable authentication override OR use a dedicated certificate exclusively for override cookies. Detection: GlobalProtect gateway session logs for auth-method=cookie from unexpected source IPs; IKE/SSL-VPN authentication-method anomalies; PAN-OS system logs for unusual session establishment with known PoC indicator values.
    ch_eu_nexus: "global — affects all PAN-OS GlobalProtect deployments; EU public sector and Swiss federal infrastructure commonly use PAN-OS for remote-access VPN; CRN NCSC-CH GovCERT should be consulted for local observations"
    public_sector_nexus: "direct — PAN-OS is widely deployed in public-sector remote access VPN stacks across CH/EU"
    sector: "government, financial, critical infrastructure, telco"
