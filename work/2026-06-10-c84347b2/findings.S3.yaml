  - title: "WinRAR CVE-2025-8088 path traversal via NTFS ADS still exploited by Earth Dahu (Gamaredon) and SHADOW-EARTH-066 (UAC-0226) against Ukraine — unpatched instances remain active attack surface nearly a year after fix"
    sources:
