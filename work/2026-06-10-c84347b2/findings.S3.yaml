  - title: "Ivanti Sentry CVE-2026-10520 / CVE-2026-10523: pre-auth OS command injection (CVSS 10.0) and authentication bypass — watchTowr publishes full technical analysis with PoC"
    sources:
      - { url: "https://labs.watchtowr.com/more-evidence-that-words-dont-mean-what-we-thought-they-meant-ivanti-sentry-pre-auth-os-command-injection-cve-2026-10520/", publisher: "watchTowr Labs", date: "2026-06-10", role: "primary" }
    discovery_trace: "first seen at: watchTowr Labs RSS feed https://labs.watchtowr.com/rss/ → primary (no further pivot needed, watchTowr is the original researcher): https://labs.watchtowr.com/more-evidence-that-words-dont-mean-what-we-thought-they-meant-ivanti-sentry-pre-auth-os-command-injection-cve-2026-10520/"
    summary: |
      watchTowr today (June 10) published a full technical analysis and PoC for two Ivanti Sentry vulnerabilities patched in R10.5.2 / R10.6.2 / R10.7.1. CVE-2026-10520 (CVSS 10.0) is a pre-authentication OS command injection in the `/mics/api/v2/sentry/mics-config/handleMessage` endpoint. The vulnerability stems from unsanitised XML input passed to the `handleExecute()` method, which processes the `reqandres` field in a `commandexec` XML block via reflection-based native command execution — achieving root-level RCE with no credentials. CVE-2026-10523 is a companion authentication bypass (CWE-288) enabling unauthenticated access to create administrative accounts. The Sentry product serves as a gateway/policy enforcement point for Ivanti UEM deployments (MobileIron/Ivanti EPMM); compromise gives an attacker network gateway-level access to managed devices. PoC code is available on GitHub at `watchtowrlabs/watchTowr-vs-Ivanti-Sentry-RCE-CVE-2026-10520-CVE-2026-10523`. No exploitation in the wild reported at time of publication, but the PoC publication dramatically shortens the window before exploitation begins — patch or restrict network access to MICS API immediately. Detection: WAF/IDS rules for POST to `/mics/api/v2/sentry/mics-config/handleMessage` from untrusted sources; Sentry application logs for unexpected `commandexec` XML payloads; EDR/SIEM for `java` spawning `bash`/`sh` processes on Sentry servers.
    ch_eu_nexus: "global — Ivanti Sentry/MobileIron Sentry is deployed in enterprise and public-sector MDM environments across CH/EU; affects all versions before R10.5.2, R10.6.2, R10.7.1"
    public_sector_nexus: "direct — MDM/UEM gateways are common in Swiss cantonal and federal IT for mobile device management"
    sector: "enterprise IT, government, healthcare, education"
