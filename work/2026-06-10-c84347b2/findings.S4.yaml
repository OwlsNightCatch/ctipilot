        attribution: "DINUM (official press notice, in French)"
        source_url: "https://www.numerique.gouv.fr/sinformer/espace-presse/incident-tchap/"
      - quote: "Sur les plus de 825 000 agents inscrits, 73 467 agents seraient concernés par cet incident, soit moins de 9 % des utilisateurs inscrits."
        attribution: "DINUM (official press notice, in French)"
        source_url: "https://www.numerique.gouv.fr/sinformer/espace-presse/incident-tchap/"
      - quote: "The attacker says entry came through social-engineering an account on Tchap's education environment, and that a directory-search function allowed user enumeration across the service."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/09/tchap-french-government-secure-messaging-platform-breach/"
    extended_notes: |
      Technical note: Tchap is a fork of Element/Matrix with server-side encryption for at-rest storage
      but standard Matrix E2EE for private room messages. The federated sharding (separate homeservers
      for education, defence, general government) is a partial isolation measure. The attacker explicitly
      noted access was limited to the education shard directly, but used it to pivot via the global
      directory. Matrix's user directory endpoint /_matrix/client/v3/user_directory/search is accessible
      to authenticated users across the federation — this is a known Matrix architecture consideration.
      The alleged unauthenticated media download claim (no token required for media URLs if you have
      the media ID) would, if accurate, constitute a Matrix content-repository access control failure
      (CVE-unassigned at time of writing).

  - title: "Meta Instagram AI support tool (High Touch Support / HTS) abuse lets unauthenticated actors reset any account password — 20,225 accounts hijacked over 7 weeks, Maine AG notification filed June 8"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/meta-ai-support-data-breach-affects-20-000-instagram-accounts/"
        publisher: "BleepingComputer"
        date: "2026-06-08"
        role: "primary"
      - url: "https://securityaffairs.com/193307/ai/meta-ai-recovery-tool-flaw-exposed-20000-instagram-accounts.html"
        publisher: "Security Affairs"
        date: "2026-06-08"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('data breach disclosure incident 2026-06-09 2026-06-10 site:bleepingcomputer.com') → pivot: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/meta-ai-support-data-breach-affects-20-000-instagram-accounts/ (published June 8) → primary: Maine AG filing (cited within BleepingComputer article; BleepingComputer + Security Affairs both serve as corroborating sources)"
    summary: |
      Meta filed a data breach notification with the Maine Attorney General on June 8, 2026, disclosing
      that a logic flaw in its AI-powered account recovery tool ("High Touch Support" / HTS) allowed
      unauthorised actors to hijack 20,225 Instagram accounts between April 17 and May 31, 2026 (seven
      weeks before discovery).

      Technical flaw: HTS was designed to help locked-out users regain account access via AI-assisted
      support. A flaw in a separate code path bypassed ownership verification: when a user requested a
      password reset through HTS and provided an email address not previously linked to the target
      account, the system sent the password reset link to the attacker-controlled address rather than
      the account owner's address. No prior knowledge of the victim's existing email, phone number,
      or current password was required. The confused-deputy pattern is the core issue — the AI acted
      on the requester's provided email without confirming it matched the registered account email.

      Attack method: Attackers submitted reset requests to HTS, provided attacker-controlled email
      addresses, received the password reset links, and completed account takeover. Some attackers
      used VPNs to spoof account-holder geographic locations. No sophisticated technical exploitation
      was required — the vulnerability was entirely logic-based in the AI support workflow.

      Account takeovers were not limited to ordinary accounts: victims included the dormant Obama White
      House account, the retailer Sephora, and US Space Force Chief Master Sergeant John Bentivegna.
      Affected accounts with two-factor authentication enabled were protected against full takeover
      even when the password reset link was obtained.

      Meta's response: Discovered the vulnerability on May 31. Immediately disabled HTS and removed
      the vulnerable code path. Invalidated existing pending password reset links. Filed Maine AG
      notification June 8; will notify affected users electronically on June 19, 2026. Recommends
      enabling 2FA.

      Defender relevance: Represents a category of AI-assisted support automation risk — logic-flow
      bypasses that exploit "helpful" AI behaviour to circumvent identity verification steps that
      would otherwise be enforced in traditional support workflows. Organisations deploying AI-powered
      help-desk or account recovery systems should audit whether AI decision paths can be induced to
      act on attacker-supplied email/identity claims without cross-checking against authoritative
      account records. MITRE ATT&CK: T1078 Valid Accounts (account recovery abuse), T1556 Modify
      Authentication Process (AI support tool manipulation).

    ch_eu_nexus: "Global; EU persons among those notified. Swiss/EU organisations using Meta platforms for official communications (Instagram business accounts, WhatsApp integrations) should audit whether institutional accounts include 2FA."
    public_sector_nexus: "indirect — one confirmed victim was a US Space Force official account; general population impact"
    sector: "technology, media, public-sector"
