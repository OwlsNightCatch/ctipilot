items:
  - title: "French government Tchap messaging platform compromised via hijacked account — 73,467 civil servants affected, CNIL notified"
    sources:
      - url: "https://www.numerique.gouv.fr/sinformer/espace-presse/incident-tchap/"
        publisher: "DINUM (Direction interministérielle du numérique)"
        date: "2026-06-08"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/french-govt-messaging-service-breached-in-account-hijacking-attack/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/09/tchap-french-government-secure-messaging-platform-breach/"
        publisher: "Help Net Security"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.theregister.com/security/2026/06/09/france-probes-compromise-of-gov-messaging-platform-after-account-hijack/5252717"
        publisher: "The Register"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer (security news listing scan), URL https://www.bleepingcomputer.com/news/security/french-govt-messaging-service-breached-in-account-hijacking-attack/ → primary: DINUM official press notice, URL https://www.numerique.gouv.fr/sinformer/espace-presse/incident-tchap/"
    summary: |
      On June 7, 2026, ANSSI (France's national cybersecurity agency) detected a security incident on
      Tchap — the French government's sovereign encrypted messaging platform built on the Matrix protocol,
      used by 825,000 civil servants across all French ministries and public agencies. DINUM published
      its official disclosure on June 8.

      Attack vector: A single Tchap user account was compromised via "usurpation de compte" (account
      impersonation / account takeover). The attacker claims to have achieved initial access by social-
      engineering an account on Tchap's education shard (matrix.agent.education.tchap.gouv.fr). From
      that foothold, the attacker exploited Tchap's directory-search functionality to enumerate user
      metadata across the service, and allegedly extracted hardcoded LDAP credentials from a PowerShell
      script shared on the platform by a French tax authority regional director.

      DINUM's confirmed scope: 73,467 agents (< 9% of 825,000 registered users) affected. Data
      potentially exposed per DINUM's official statement: name, first name, email address, employing
      entity (organisation), and avatar. Private conversations protected by Matrix's end-to-end
      encryption were NOT accessible via a compromised user account — only public chat room content
      was exposed (public rooms are by design unencrypted and accessible to all Tchap users).

      The alleged attacker (identity unverified) claimed to have scraped approximately 643,459 messages,
      876 chat rooms with message history, 59,386 media files totalling 13.51 GB, and over 73,000 user
      account records. The attacker also claims that all media ever shared on Tchap across all shards is
      downloadable without an authentication token once a media ID is known from message history — an
      unauthenticated media-retrieval vulnerability that, if confirmed, would significantly expand the
      true exposure surface. These broader claims have not been independently verified.

      DINUM has notified CNIL (France's data protection authority) of the personal data potentially
      compromised. The compromised account was immediately blocked. Investigations to identify the
      attack method and full data exfiltration scope are ongoing.

      Defender relevance: Any organisation running a Matrix homeserver or federating with Tchap should
      audit whether guest or public-room content was accessible. The technique (account takeover →
      directory enumeration → bulk user metadata scrape) is a generic threat to any Matrix deployment.
      Government organisations using Tchap for sensitive internal comms should verify all communications
      were conducted in private (E2EE) rooms, not public rooms. Watch for follow-on phishing using
      Tchap user metadata (name + email + organisational affiliation) as input.

    ch_eu_nexus: "Direct EU nexus — French sovereign government messaging platform, 73,467 French civil servants affected. CNIL notified. France is GDPR jurisdiction. Tchap used across all French ministries including those with pan-EU policy roles. Similar Matrix-based government messaging deployments exist in Germany (BwMessenger, Element for public sector), Switzerland (Element CH-government), and other EU member states — shared architecture risk."
    public_sector_nexus: "direct — target is a French government-operated sovereign messaging infrastructure"
    sector: "government, public-sector"
