  section: entries/2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc (actions[0]; body Defender takeaway)
  item: "look for scripts that differ from the product defaults ... where either is found, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation"
  url_or_quote: "https://www.security.com/threat-intelligence/power-management-software-attack-vector"
  summary: "Residual of iteration 1. Symantec ties the krbtgt advice to finding the intrusion's techniques and indicators ('Review the techniques and indicators in this document. If you find them, assume Active Directory credentials are exposed and plan a krbtgt reset'); its audit advice is 'Treat any unknown scripts as hostile and review the console's event-to-command assignments'. The product's documented feature (cited from CyberPower) is user-programmed event-action scripts, so a legitimate custom script differs from the defaults and would trigger a krbtgt reset under the action's wording. Split the two steps: audit and review for deviations, and plan the reset only where the techniques or indicators are found."
