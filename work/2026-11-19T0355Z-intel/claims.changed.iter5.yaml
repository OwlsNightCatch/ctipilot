    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Securifera described CVE-2026-90817 on 2026-09-27, a five-step chain in Vanderbilt's REDCap research-data platform that turns a request to a public survey into code execution on the server without authentication, given a valid public survey hash (CVSS 3.1 9.8). Unit 42 reported it exploited on 2026-10-07 to install Monero miners behind a transient web shell, with cron, SSH-key and shell-profile persistence, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-18. The fixed builds are 16.0.49 LTS, 17.3.10 LTS and 17.4.4 Standard."
