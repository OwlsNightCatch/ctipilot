  - claim_id: 4ed7de9707
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "Obsidian Security published a privilege-escalation-to-RCE chain in LiteLLM (BerriAI), the widely self-hosted AI gateway that proxies 100+ LLM providers behind one OpenAI-compatible API ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce", "https://thehackernews.com/2026/06/litellm-vulnerability-chain-lets-low.html"]
  - claim_id: b0d134ed18
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "CVE-2026-40217 (RCE) ends it: LiteLLM's advisory says the sandbox around custom-code guardrails can be escaped using bytecode-level techniques, giving arbitrary code execution in the proxy process, which runs as root in the default Docker image, and that POST /guardrails/test_custom_code needs a proxy-admin credential in default configurations ("
    urls: ["https://github.com/BerriAI/litellm/security/advisories/GHSA-wxxx-gvqv-xp7p"]
  - claim_id: cd061b7277
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "); Obsidian also ties CVE-2026-40217 to the production routes POST /guardrails and PUT /guardrails/{id}, which run user code with exec(), while the vendor's workaround names only the test endpoint ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: d0c3c53e81
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "VulnCheck scores CVE-2026-47102 at CVSS 8.8 (3.1) ("
    urls: ["https://thehackernews.com/2026/06/litellm-vulnerability-chain-lets-low.html"]
  - claim_id: 5c3689a360
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "), and Obsidian rates the chained impact CVSS 9.9; chained, a default low-privilege account reaches the master key, the salt key decrypting stored secrets, the database URL and every configured provider API key, and can rewrite responses delivered to downstream AI agents (\"man-in-the-gateway\") ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: 5c9a7c9b9d
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "CISA added CVE-2026-40217 to its Known Exploited Vulnerabilities catalog on 2026-11-18 on evidence of active exploitation; the alert names no actor or victim and does not say whether attackers held an administrator credential or used the other two flaws ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: bf4a27dec3
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "**Exposure:** any LiteLLM proxy before v1.83.14-stable that untrusted or low-privilege users can reach: the guardrail endpoint needs a proxy-admin credential by default, and the chain's privilege escalation gives any authenticated user that role ("
    urls: ["https://github.com/BerriAI/litellm/security/advisories/GHSA-wxxx-gvqv-xp7p", "https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: 0bbbb5c8f2
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "**Detection:** proxy access logs for POST requests to /guardrails/test_custom_code, POST /guardrails and PUT /guardrails/{id}, for /key/generate calls that carry `allowed_routes`, and for /user/update and /user/bulk_update calls that set `user_role` to `proxy_admin` ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: 802dfb72e7
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to v1.83.14-stable or later, the first release with the complete fix set ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: c5b1b7cabf
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "), and block the guardrail endpoint at the reverse proxy until then, as LiteLLM's advisory says ("
    urls: ["https://github.com/BerriAI/litellm/security/advisories/GHSA-wxxx-gvqv-xp7p"]
  - claim_id: 22c3437f04
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: cited
    text: "); where exposure is suspected, rotate every provider API key, the database credentials and any MCP tokens stored in the proxy and audit every Custom Code Guardrail, the callbacks loaded under litellm_settings.callbacks and the holders of proxy_admin, as Obsidian advises ("
    urls: ["https://www.obsidiansecurity.com/blog/litellm-privilege-escalation-rce"]
  - claim_id: da8a517c20
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: uncited
    text: "The chain starts with CVE-2026-47101 (authorization bypass): the key-generation endpoint accepts a caller-supplied `allowed_routes` without checking the caller's role, so an `internal_user` can mint a key reaching admin routes."
  - claim_id: a229451f8a
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: uncited
    text: "CVE-2026-47102 (privilege escalation) follows: `/user/update` lacks field-level authorization, letting any authenticated user set their own `user_role` to `proxy_admin`."
  - claim_id: 36f250585a
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "body"
    kind: uncited
    text: "The chain is fixed in v1.83.14-stable, the first release that Obsidian says contains the complete fix set."
  - claim_id: bdc080346e
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "section 2026-11-19T05:04:59Z"
    kind: cited
    text: "CISA added CVE-2026-40217 to its Known Exploited Vulnerabilities catalog on 2026-11-18 on evidence of active exploitation it does not describe ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: c105e38879
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "section 2026-11-19T05:04:59Z"
    kind: cited
    text: "LiteLLM's own advisory describes the flaw as a sandbox escape using bytecode-level techniques at POST /guardrails/test_custom_code that gives code execution in the proxy process, root in the default Docker image, requires a proxy-admin credential in default configurations, rates it Moderate at CVSS 4.0 5.9 and offers blocking the endpoint at the reverse proxy as the workaround; it names 1.83.11 as the fix in its text and 1.83.10 in its patched-versions field ("
    urls: ["https://github.com/BerriAI/litellm/security/advisories/GHSA-wxxx-gvqv-xp7p"]
  - claim_id: 2b91c98d26
    entry: 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i
    surface: "record 2026-11-19T05:04:59Z"
    kind: record-summary
    text: "CISA added the LiteLLM guardrail sandbox escape CVE-2026-40217, the last step of Obsidian Security's chain, to its Known Exploited Vulnerabilities catalog on 2026-11-18; LiteLLM's own advisory now supplies the description, the proxy-admin prerequisite, the CVSS 4.0 5.9 score and the endpoint block."
