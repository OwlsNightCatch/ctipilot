  - claim_id: 7cfa7f60b3
    entry: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write
    surface: "summary"
    kind: frontmatter
    text: "Synology said on 2026-10-29 that threat actors are exploiting a vulnerability patched in December 2024 to encrypt and extort devices on outdated DSM, naming no CVE and pointing to Synology-SA-24:20, while the Chinese vendor 360 identifies the ransomware as C3RB3R, a Cerber variant, and says it got in through CVE-2026-13684 and CVE-2026-13639, the two unauthenticated CVSS 9.8 flaws of Synology-SA-26:13 (fixed in DSM 7.4-90075, 7.3.2-86009-4, 7.2.2-72806-9 and 7.2.1-69057-12, with no mitigation). CISA added CVE-2024-10441, the lead flaw of SA-24:20, to its Known Exploited Vulnerabilities catalog on 2026-11-18, which supports Synology's pointer, while no source corroborates 360's naming of the two September flaws; a DSM that is current on both advisories is out of scope on either."
  - claim_id: 101485bb94
    entry: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Synology DSM to the fixed build of its branch now (7.4-90075, 7.3.2-86009-4, 7.2.2-72806-9 or 7.2.1-69057-12, and 7.2-64570-4, 7.1.1-42962-7 or 6.2.4-25556-8 on the branches for which SA-26:13 names no fix; on DSM 7.1, 7.2 and 6.2 those builds close only the SA-24:20 flaws, so also move to a branch with an SA-26:13 fix), taking the management interface of any NAS that is reachable from the internet offline first, because Synology confirms ransomware is exploiting outdated DSM, CISA lists CVE-2024-10441 as exploited and Synology lists no mitigation for the September flaws."
  - claim_id: bd491e6c32
    entry: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write
    surface: "actions[1]"
    kind: frontmatter
    text: "On every NAS that was reachable from the internet on an older build, look in its shares for files renamed to .L0CK3D and for read-me3.txt notes, and isolate any hit."
