  - claim_id: 12e6b21693
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "summary"
    kind: frontmatter
    text: "Airlock (Ergon) published CVE-2026-19707 on 2026-11-18: attacker-controlled HTML in a backend response can overflow a buffer in the Smart Form Protection feature of Airlock Gateway 8.5.0 to 8.5.2 and 8.6.0, possibly causing denial of service or remote code execution against the gateway, when the feature is enabled on a mapping whose backend returns certain multi-byte HTML character references (CVSS 4.0 9.5, high attack complexity). The fix is in 8.5.3 and 8.6.1, no source reports exploitation, and Airlock says a compromised gateway could also affect the protection of the other backends behind it."
  - claim_id: 0eb21be90b
    entry: 2026-11-19/airlock-gateway-cve-2026-19707-smart-form-protection
    surface: "actions[0]"
    kind: frontmatter
    text: "Move every Airlock Gateway running 8.5.0 through 8.5.2 to 8.5.3 and every one running 8.6.0 to 8.6.1, starting with gateways that have Smart Form Protection enabled on a mapping whose backend serves user-supplied HTML, because Airlock says one backend response can crash or take over the gateway that protects every backend behind it."
