    kind: frontmatter
    text: "Drupal published SA-CORE-2026-017 (CVE-2026-132165, Critical 18 of 25) and SA-CORE-2026-018 (CVE-2026-132166, Moderately critical, not directly exploitable) on 2026-11-18: under specific conditions an attacker can use the installer to attempt to reinstall Drupal, which can lead to site takeover or remote code execution. Fixed in 11.4.13, 11.3.22 and 10.6.22, the only workaround is securing the installer, and no source reports exploitation, although the Security Team had warned that exploits might be developed within hours or days."
