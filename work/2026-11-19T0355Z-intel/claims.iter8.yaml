  - claim_id: 277f9ce9c3
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "summary"
    kind: frontmatter
    text: "HPE Networking's bulletin HPESBNW05162 of 2026-10-22 fixes 76 CVEs (72 in its first release, four added and one id replaced in revision 2 of 2026-11-17) in AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways and access points, 33 of them at CVSS 3.1 9.0 or higher and 19 of those reachable over the network without authentication (eight at 10.0). HPE found the flaws through internal research, knows of no public discussion or exploit code, and strongly urges patching; its only workaround is to confine the CLI and web management interfaces to a dedicated segment behind firewall policy."
  - claim_id: f461a4b7e9
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every HPE Networking (Aruba) Mobility Conductor, Controller, Gateway and access point on AOS-10 or AOS-8 to the fixed build of its train (10.8.1.2, 10.7.2.7, 10.4.1.14, 8.13.3.1 or 8.10.0.24; AP-5xx access points in a FIPS-compliant environment need the AOS-8.13.3.2-FIPS build or later), and until then confine the CLI and web management interfaces to a dedicated layer 2 segment or VLAN behind firewall policy, as HPE advises."
