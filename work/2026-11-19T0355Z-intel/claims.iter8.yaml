    text: "Upgrade every REDCap server to 16.0.49 LTS, 17.3.10 LTS or 17.4.4 Standard and, on any server that was internet-reachable on an older build, check for transient Blade-template files under the web temp cache, crontabs, the authorized_keys of every account, ~/.profile and Monero miner processes, treating a hit as a server compromise, because Unit 42 saw the chain used for mining with persistence that an upgrade does not remove."
