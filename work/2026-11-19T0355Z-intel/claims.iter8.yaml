    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "headline"
    kind: frontmatter
    text: "Symantec: attacker ran SYSTEM commands on a domain controller through CyberPower PowerPanel Business, then took ntds.dit"
  - claim_id: ed8e9fdbe2
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "summary"
    kind: frontmatter
    text: "Symantec analysed an intrusion in which the attacker used CyberPower PowerPanel Business, UPS-management software, as an execution channel on a Windows domain controller: scripts placed in the product's extcmd folder run through the ppbed.exe service as SYSTEM, and the operator iterated scripts until ntds.dit was exported with ntdsutil ifm and esentutl /vss, then side-loaded an implant. Symantec does not say how the attacker reached the console (public advisories or stolen administrator credentials could give that access) and names no actor."
  - claim_id: 7a61d177e5
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "actions[0]"
    kind: frontmatter
    text: "On every host that runs CyberPower PowerPanel Business, domain controllers first, compare the extcmd and temp\\\\profile\\\\extcmd folders with the product defaults and compare the extcmd folders and the console's event-to-command assignments with what administrators configured and treat unknown scripts as hostile; where the techniques Symantec lists are found (ntdsutil or esentutl on a domain controller, scripts staged under extcmd that no administrator configured, a side-loaded implant), assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation, because Symantec saw this channel used to export ntds.dit from a domain controller."
  - claim_id: 1ee3c52cc5
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "Symantec analysed an intrusion in which the attacker used CyberPower PowerPanel Business (PPB), software that manages UPS devices, as the execution channel on a Windows domain controller ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: c702d15ce5
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "Scripts placed in the product's extcmd folder and staged first under temp\\profile\\extcmd, are run by the PPB service ppbed.exe as SYSTEM, so the commands of the chain have ppbed.exe as their ancestor and the lineage runs ppbed.exe, cmd.exe, powershell.exe and then the implant ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: 5dedccdab1
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "The attacker pushed the scripts to the PPB web service endpoint /local/rest/v1/file/upload on TCP port 3052, worked hands-on, iterating scripts until ntds.dit was exported with ntdsutil ifm and esentutl /vss, and then side-loaded the implant, an old trusted executable paired with an unknown DLL in a user-profile path ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
