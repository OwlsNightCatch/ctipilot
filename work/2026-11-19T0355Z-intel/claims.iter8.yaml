    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "**Detection:** process-creation lineage with ppbed.exe as the ancestor of cmd.exe or powershell.exe, every script staged under extcmd, whatever its name, certutil downloads and decodes, curl downloads and powershell -ep bypass loading .NET code in memory, inbound requests to TCP 3052 from addresses that do not administer the UPS, and on a domain controller ntdsutil, esentutl and new shadow copies; an unexpected DLL next to a trusted binary in a user-profile path marks the side-loaded implant ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: 99bb1976df
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "**Triage:** the activity looks like a power-management product launching cmd.exe, which defenders may dismiss as a routine power-related recovery process; scripts or event-to-command assignments that no administrator configured, children that are not shutdown or notification routines (which follows from the mechanism) and the absence of a preceding power event separate it from benign use ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
