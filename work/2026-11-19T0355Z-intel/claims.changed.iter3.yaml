    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Search every ASP.NET WebForms application's Web.config and bin directory for Idunno.AntiCsrf by name, not by file hash because recompiled copies keep the flaw, remove the module and its DLL and replace it with a supported anti-forgery mechanism; on any server that ran it while internet-reachable, check IIS logs for POSTs to .aspx pages that returned 302 or 500 with unusually large request sizes and, where there is evidence of exploitation, rotate the machineKey, encryption keys and database credentials in Web.config and applicationHost.config, treating an internet-reachable server that ran the module as a candidate for the same rotation as a precaution beyond Mandiant's condition, since Mandiant observed exploitation and no patch exists."
