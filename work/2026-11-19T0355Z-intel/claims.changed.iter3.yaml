    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "headline"
    kind: frontmatter
    text: "NGINX nginx2root: five unauthenticated flaws reach worker RCE, Rapid7 PoC public; update 1.31.9, 1.30.7 or Plus 37.3.0.1"
  - claim_id: f621e664d0
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five unauthenticated memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, and NCSC.ch and Rapid7 the HTTP/2 pair. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings."
