  - claim_id: ee1ae24466
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "actions[0]"
    kind: frontmatter
    text: "On every host that runs CyberPower PowerPanel Business, domain controllers first, compare the extcmd and temp\\\\profile\\\\extcmd folders with the product defaults and compare the extcmd folders and the console's event-to-command assignments with what administrators configured and treat unknown scripts as hostile; where the techniques Symantec lists are found (children of ppbed.exe that are not shutdown or notification routines with no preceding power event, ntdsutil or esentutl on a domain controller, a side-loaded implant), assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation, because Symantec saw this channel used to export ntds.dit from a domain controller."
  - claim_id: c702d15ce5
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "Scripts placed in the product's extcmd folder and staged first under temp\\profile\\extcmd, are run by the PPB service ppbed.exe as SYSTEM, so the commands of the chain have ppbed.exe as their ancestor and the lineage runs ppbed.exe, cmd.exe, powershell.exe and then the implant ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: 5dedccdab1
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "body"
    kind: cited
    text: "The attacker pushed the scripts to the PPB web service endpoint /local/rest/v1/file/upload on TCP port 3052, worked hands-on, iterating scripts until ntds.dit was exported with ntdsutil ifm and esentutl /vss, and then side-loaded the implant, an old trusted executable paired with an unknown DLL in a user-profile path ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
