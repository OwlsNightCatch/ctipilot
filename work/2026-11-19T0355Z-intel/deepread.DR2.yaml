  reader_delta:
  - 'The pre-announced release shipped on 2026-11-18 as TWO advisories. SA-CORE-2026-017 (CVE-2026-132165, Critical 18/25, AC:Complex/A:None/CI:All/II:All/E:Proof/TD:Uncommon) is the anonymous-reachable flaw: core ships install.php and, under
    unspecified specific conditions, an attacker can use the installer to attempt to reinstall Drupal, leading to site takeover or RCE. SA-CORE-2026-018 (CVE-2026-132166, Moderately critical 14/25, AC:Complex/A:Admin/E:Theoretical) is a gadget
    chain, not directly exploitable, usable only when a separate flaw lets an attacker pass unsafe input to unserialize().'
  - Both share affected "<10.6.22 || >=11.0.0 <11.3.22 || >=11.4.0 <11.4.13" and the same fixes 11.4.13, 11.3.22, 10.6.22; 11.2.x and below and 10.5.x and below are end-of-life with no security coverage.
  - 'Only workaround offered, for every branch: follow Drupal''s instructions for securing the installer. Drupal says SOME exploit paths are mitigated if the web server cannot write to or change permissions on settings.php (so non-writable settings.php
    is not a full mitigation). NCSC-NL reads the flaw as exploitable when the installer was not correctly secured or removed after the initial installation (NCSC-NL reading, not Drupal text).'
  - Drupal Steward already protects known attack vectors of SA-017 (Steward statement absent from SA-018). SA-017 was found by Anthropic's OSS Scanner (ANT-2026-GMRPK0BU).
