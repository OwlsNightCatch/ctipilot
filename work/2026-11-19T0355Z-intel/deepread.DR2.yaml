  - CISA added CVE-2024-10441 to KEV on 2026-11-18 (dueDate 2026-11-21 under BOD 26-04, knownRansomwareCampaignUse "Unknown", forensicTriage "Yes", CWE-116), citing "evidence of active exploitation" without describing it. This is the first authority
    statement of exploitation for any Synology CVE in the C3RB3R story and it is consistent with Synology's own 2026-10-29 pointer to SA-24:20 (the KEV notes link the same advisory).
  - 'It does NOT corroborate the 360 claim: CVE-2026-13684, CVE-2026-13639, CVE-2026-13673 and CVE-2026-6205 are not in KEV (catalogue 2026.11.18). CISA does not mention ransomware or C3RB3R; any link between the KEV addition and C3RB3R is the
    reader''s inference (timing: 20 days after Synology''s notice).'
  - 'Synology''s own pages are unchanged: SA-24:20 (Last Updated 2025-03-28) and the C3RB3R notice still name no CVE. SA-24:20 lists Mitigation: None.'
  - 'Observation, not a finding: Synology says the exploited flaw was "patched in December 2024"; SA-24:20 fixed the CVE-2024-10441 branches named in its per-CVE text (7.2, 7.2.1, 7.2.2 and BSM 1.1) from 2024-11-05 (7.2.1 on 2024-11-12), and
