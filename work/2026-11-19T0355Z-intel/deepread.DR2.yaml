    now: 'Neither SA page mentions pre-releases (grep -c beta = 0 on both); keep that clause attributed to the PSA only. For end-of-life lines the SAs offer no EOL-specific mitigation: they state 11.2.x and below / 10.5.x and below "do not receive
      security coverage" and the only interim step (all branches) is securing the installer.'
