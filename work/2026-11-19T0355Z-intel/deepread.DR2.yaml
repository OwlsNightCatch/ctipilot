  reader_delta:
  - 'Revision 2 (2026-11-17T16:00Z, final) replaced CVE-2026-79845 with CVE-2026-95787 (same AOS-10 PAPI authentication bypass, CVSS 3.1 10.0 CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N; affected 10.8.0.0-10.8.1.1, 10.7.0.0-10.7.2.6, 10.4.0.0-10.4.1.13;
    fixed 10.8.1.2, 10.7.2.7, 10.4.1.14 - field-for-field identical to the stored CVE-2026-79845 record), added CVE-2026-95788, -95789, -95790, -95791 "inadvertently omitted from Revision 1 due to an editorial error", and added a FIPS note: customers
    operating AP-5xx access points in a FIPS-compliant environment must upgrade to AOS 8.13.3.2 FIPS or later. The CSAF now has 76 vulnerability records (72 before).'
  - 'The FIPS build is a new fixed line for AOS-8: the CSAF adds product AOS-8.13.3.2-FIPS ("HPE Networking ArubaOS (AOS-8) FIPS") to product_status.fixed of ALL 49 CVE records that affect AOS-8, and each vendor_fix text now reads "AOS-8.13.x.x
    FIPS: 8.13.3.2 FIPS and above(*)". The entry''s fixed-build list and action text do not name it.'
  - 'Counts are unchanged because the replacement is also a 10.0: 33 of 76 at CVSS 3.1 >= 9.0 (10.0: 8, 9.8: 10, 9.6: 10, 9.4: 1, 9.3: 4), 19 of those AV:N/PR:N, 14 AV:A. The four added CVEs are all below 9.0: CVE-2026-95788 7.1 (AV:A/PR:N, DoS,
    AOS-10 and AOS-8), CVE-2026-95789 7.2 (AV:N/PR:H command injection, both), CVE-2026-95790 6.5 (AV:N/PR:L authorization bypass, AOS-8 controllers only), CVE-2026-95791 4.9 (AV:N/PR:H arbitrary file read, both). HPE exploitation statement is
    verbatim unchanged ("not aware of any public discussion or exploit code ... as of the release date of this advisory"); the advisory does not say it was re-assessed at revision 2.'
