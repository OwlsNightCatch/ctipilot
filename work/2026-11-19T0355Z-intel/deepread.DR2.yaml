    role: corroborating
    transport: bridge enisa-euvd advisory
    published: datePublished Nov 6, 2026; dateUpdated Nov 18, 2026; exploitedSince Nov 18, 2026
  reader_delta:
  - 'Does the entry already state exploitation? YES, of the CVE: summary "the same flaw is exploited against N-able N-central servers that embed Axis" and the 2026-11-13 update, sourced to Huntback (mining-pool rig count), Previdian (honeypot)
    and BleepingComputer. It also says "No source reports exploitation of Confluence." That sentence is STILL TRUE: KEV names no product.'
  - 'What the KEV listing adds: (1) the first authority statement of exploitation for CVE-2026-90436 itself (CISA, dateAdded 2026-11-18); (2) a federal due date 2026-11-21 (3 days) and forensicTriage "Yes", i.e. CISA expects a compromise check,
    which matches Atlassian''s unexplained request to check instances; (3) CISA''s own note that the flaw "could affect an open-source component, third-party library, protocol, or proprietary implementation that could be used by different products"
    and that the product could be end-of-life, "Users are advised to discontinue use and/or transition to a supported version"; (4) knownRansomwareCampaignUse Unknown. EUVD mirrors it (exploitedSince 2026-11-18, CVSS 3.1 9.8 from the Apache CNA,
    alias GHSA-988f-c54m-f8jj); FIRST EPSS 0.01128.'
  - 'What the Apache EOL/no-fix statement adds beyond the entry: the entry already carries "does not expect to release an Axis 1.x fix" and the unauthenticated SOAP-fault class instantiation. Missing and worth one sentence: the fault is parsed
    before any per-service handler chain runs, so authentication handlers configured on a service do not protect against it; RCE needs a suitable class on the application classpath (a gadget precondition); remedy is migrate to Axis 2/Java or
    a self-built Axis with commit 41f3b4e8d04e310ca81f86b92630ab2c11d608bd; the CVE is flagged "UNSUPPORTED WHEN ASSIGNED"; finder OKIOK (José Apari-Pantigozo). Net: exposure generalises to ANY product bundling Axis 1.x (Confluence DC with Remote
    API, N-central, others); for Confluence the Remote API toggle and 9.2.28 remain the levers.'
  - 'Atlassian advisory re-read 2026-11-19: unchanged (no exploitation statement: grep -c exploit = 0), still "Atlassian cannot confirm if your instances have been affected ... check all affected instances for evidence of compromise", fixed 9.2.28.'
