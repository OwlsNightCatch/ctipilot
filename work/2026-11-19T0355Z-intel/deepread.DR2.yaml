  reader_delta:
  - 'Cisco (v1.1, Interim, 2026-11-18): 13 products affected, every fixed release "TBD": Catalyst Center, Smart PHY, Connected Mobile Experiences 11.2, Secure Network Analytics 7.6.0, Secure Workload, Cisco IQ Virtual Appliance v1.3.2, Smart
    Software Manager On-Prem, Native Broadband Network Gateway (cnBNG), Optical Network Planner (26.4.1 and later only), Services as Code - Common Automation Framework, Splunk AppDynamics On-Premises Virtual Appliance 27.1.0, Ultra Cloud Core
    - Subscriber Microservices Infrastructure, Intersight Virtual Appliance. Under investigation: IOS XE, UCS Central. Not affected: Catalyst SD-WAN Controller/Manager/Validator, ISE, IOS XR, Nexus Dashboard, NX-OS, ASA, FMC, FTD, UCS Director.
    No workarounds. PoC known to Cisco PSIRT; no malicious use known (as of 2026-11-18 21:16 GMT).'
  - 'Fortinet FG-IR-26-278 (published 2026-11-18, severity High, CVSSv3 8.1, Known Exploited: No): NO product is confirmed affected; the page says it is "currently investigating the impact"; 50 distinct products are listed "under investigation"
    (51 lines, FortiSandbox PaaS twice) incl. FortiMail, FortiManager, FortiAnalyzer, FortiAuthenticator, FortiSIEM, FortiSandbox, FortiNAC-F, FortiPAM, FortiClient EMS, FortiSOAR, FortiADC, FortiSwitch NMS, FortiVoice; 25 products confirmed
    not impacted incl. FortiOS, FortiProxy, FortiWeb, FortiNAC (note: FortiNAC-F is under investigation, FortiNAC is not impacted). No fixed builds.'
  - 'BACS warnung-java-2-de (18 Nov) adds what the 17 Nov page lacked: the Calif product list, operators must clarify other Java software (banking software, industry applications) with suppliers, internal systems must be checked too, outbound-connection
    attack path (per Calif), restart + container rebuild + verify the running application uses the corrected Java, confirm remediation of externally run services, interim measures do not replace updates, and "Ein Sicherheits-Update beseitigt
    keine bereits erfolgte Kompromittierung." The same compromise sentence exists in English on hub post 13198 ("Updating does not remove an existing compromise.").'
