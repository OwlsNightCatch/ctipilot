  - 'CISA added CVE-2026-40217 to KEV on 2026-11-18 (dueDate 2026-12-02, forensicTriage "No", ransomware use Unknown, CWE-420), on unspecified evidence of active exploitation; KEV description: "bytecode rewriting at the /guardrails/test_custom_code
    URI". EPSS 0.1702 (percentile 0.97134, FIRST 2026-11-18). CVE-2026-47101 and CVE-2026-47102 are NOT in KEV.'
  - 'LiteLLM''s own advisory GHSA-wxxx-gvqv-xp7p: POST /guardrails/test_custom_code runs user-supplied Python in a hand-rolled sandbox that can be escaped with bytecode-level techniques, giving arbitrary code execution in the proxy process, which
    runs as root in the default Docker image; reaching it needs a proxy-admin credential in default configurations; workaround: block POST /guardrails/test_custom_code at the reverse proxy or API gateway. Vendor severity Moderate, CVSS 4.0 5.9
    (AV:N/AC:H/AT:N/PR:H/VC:L/VI:L/VA:H), CWE-913.'
  - 'The vendor advisory is internally inconsistent on the fixed version: prose says "Fixed in 1.83.11" (RestrictedPython replaces the sandbox) while the structured fields say affected ">= 1.81.8, < 1.83.10", patched ">= 1.83.10" and link "Patched
    release: v1.83.10-stable" (release page dated 2026-04-27); the v1.83.11-stable tag page returned 404. The entry''s stricter ">= 1.83.14" (Obsidian''s chain fix) covers either.'
  - KEV does not say whether attackers hold admin credentials or chain CVE-2026-47101/-47102; the entry's "any LiteLLM user into root" framing is Obsidian's chain claim, the KEV fact is only about the final-stage flaw.
