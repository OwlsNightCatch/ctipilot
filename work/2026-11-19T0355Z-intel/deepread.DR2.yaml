  new_sources:
  - url: https://status.optimizely.com/incidents/ftw0fh9wx43z
    role: primary (vendor)
    transport: extract + url --direct
    published: statement "Posted Nov 18, 2026 - 14:49 UTC" (the entry cites the earlier "Posted Nov 17, 2026 - 01:02 UTC")
  - url: https://www.zscaler.com/blogs/security-research/attackers-exploit-optimizely-flaw-inject-malicious-javascript
    role: primary (ThreatLabz)
    transport: extract + url --direct
    published: page datePublished 2026-11-18 (S3 noted feed pubDate Thu 19 Nov 00:45 GMT; feed not re-fetched)
  - url: https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/
    role: already cited; re-read for its 17 Nov 09:17 UTC update
    transport: extract
    published: 2026-11-16 (update 2026-11-17 09:17 UTC)
  reader_delta:
  - 'Optimizely''s 18 Nov statement names the flaw LOCATION and effect: a flaw in the Web Experimentation account signup flow, used to impersonate users on targeted customer accounts and insert malicious JavaScript into customers'' projects.
    It also says: detected on the day the activity began, delivery of the code blocked and the vulnerability closed within three hours of detection, injected code removed from all affected projects, "No malicious code remains in our systems",
    "This was not a credentials breach", incident limited to Web Experimentation, "Less than 5% of our customers were impacted", every Web Experimentation customer contacted directly. It still gives no CVE, no CWE, no detection timestamp and
    no absolute count.'
  - 'Zscaler ThreatLabz (2026-11-18): the signup-flow flaw gave unauthorized write access to the Project JavaScript (projectJS) field of multiple customer projects; modified snippets were served from Optimizely''s CDN (cdn.optimizely.com) and
    in some cases customer domains; ThreatLabz counts more than 450 unique domains and more than 3,000 URLs serving the malicious script (vantage and time window not stated: telemetry/sensor/time window all 0 hits), spanning 12 sector labels
    incl. Airlines and Travel, Banking and Finance, Telecommunications; this "suggest[s] a broader impact" than Report URI''s 178 organisations. Guidance for Optimizely customers: audit every Project JavaScript field; review recent changes, user
    activity, account creation events and administrative access; reset admin credentials; rotate API/session tokens/integration keys; enforce MFA; run CSP in enforcement mode with reporting.'
  - 'Provenance trap: Zscaler writes that Optimizely "ended active sessions, revoked tokens, reset access for affected accounts" - the current status page does NOT say that (revoked = 0, "active sessions" = 0; it says "taken steps to secure affected
    user accounts" in the 17 Nov post). Carry those steps only as Zscaler''s wording, not as an Optimizely statement.'
  - 'Timeline tension (Report URI update, 2026-11-17 09:17 UTC): "As of 16 Nov 23:11 UTC we observed that all infected Optimizely files were cleaned, and have remained clean since." First injection seen 04:21 UTC 16 Nov; mass clean-up 20:40-21:10;
    so the final-clean time is 23:11 UTC, which the entry does not carry. Optimizely''s "closed within three hours of detection" cannot be placed on that timeline because the status page gives no detection time.'
