  # ---------------------------------------------------------------- A9 (borderline)
  - title: "CVE-2026-110486, Eclipse Mosquitto 2.1.0 to 2.1.2: an out-of-bounds write in the built-in websockets implementation gives unauthenticated remote code execution on brokers with a websockets listener; fixed in 2.1.3 per the GHSA and 2.1.4 per the maintainer's announcement (CVSS 9.8 per the EUVD record)"
    suggested_priority: low
    lookback: true
    borderline: true
    borderline_reason: "Pre-auth critical, but only Mosquitto 2.1.0 to 2.1.2 with the built-in websockets listener (not libwebsockets builds), no PoC or exploitation reported; MQTT brokers appear in IoT, building and smart-city estates (not sourced for Swiss administrations)."
    sources:
      - { url: "https://github.com/eclipse-mosquitto/mosquitto/security/advisories/GHSA-6j8m-r32v-4h38", publisher: "Eclipse Mosquitto GHSA-6j8m-r32v-4h38", date: "2026-11-17", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/11/17/14", publisher: "oss-security (maintainer Roger Light announcement)", date: "2026-11-17", role: "primary" }
    discovery_trace: "first seen at: oss-security daily index, URL https://www.openwall.com/lists/oss-security/2026/11/17/ (message 14) and ENISA EUVD critical-score window search row EUVD-2026-128524 -> primary: GHSA URL https://github.com/eclipse-mosquitto/mosquitto/security/advisories/GHSA-6j8m-r32v-4h38"
    summary: |
      Mosquitto 2.1.0 to 2.1.2, configured with a websockets listener that uses the built-in websockets implementation, mishandles empty WebSocket data frames: net__read_ws() returns the number of framing bytes consumed for a zero-length payload and the MQTT packet reader
      treats that as a payload byte count, so a remote client advances the read position over uninitialised heap memory (an out-of-bounds write and potential remote code execution, per the GHSA; critical, pre-authentication, per the maintainer). The mitigation is to stop using websockets listeners or to build with libwebsockets.
