    extended_notes: |
      Exposure. Version: `nginx -v`, but distributions backport (XINT: Ubuntu 22.04 reports 1.18.0 with a patched package suffix), so compare the full
      package version with the distribution advisory. 123007 and 123633 also need the HTTP/2 module (`nginx -V` shows --with-http_v2_module) and HTTP/2 enabled on
      a listener (http2 on, or the legacy http2 parameter on listen); 123633 additionally needs proxying to an upstream; 121810 needs HTTP/3 (QUIC); 113425 needs the
      mail module with auth_http; 123634 needs resolver plus a request-derived proxy_pass with mirror or SSI.
      Fix mechanics. XINT: after installing, restart nginx or complete a live binary upgrade; a configuration reload alone does not replace the running executable.
      Mitigations before patching: http2 off on each affected server block (blocks only 123007 and 123633; services that need native gRPC lose HTTP/2); remove
      request-time DNS lookups for 123634; disable HTTP/3 for 121810; restrict mail-proxy access for 113425.
      Detection concepts (telemetry class first). (1) Process-creation / audit records for execve or execveat by the nginx worker UID: a worker has no reason to start /bin/sh
      or any program (XINT's auditd rule on euid of the worker, key nginx_worker_exec; the same signal in EDR as a child process of the nginx worker). (2) Web server
      error log and crash artefacts: repeated 'worker process exited on signal 11' and core dumps (XINT: a failed attempt can crash a worker). (3) Network flow / socket
      statistics on 443: one long-lived TLS connection from one source whose received bytes grow very fast while nginx sends little, plus many short TLS connections from
      the same source; WINDOW_UPDATE and RST_STREAM frames are not logged as requests and are encrypted, so the access log shows little (XINT suggests a log_format with
      $connection and $connection_requests to compare logged request length with received bytes).
      Triage. Benign lookalikes: worker exits from ordinary faults, large uploads (inbound-heavy single connection) and long-lived gRPC streams; XINT stresses that each
      weak signal has a normal cause and only a program started by a worker is the clear sign. Rapid7 says its PoC is a lab demonstration that likely fails on a busy worker or behind a proxy.
      Post-patch check: none documented by the sources beyond the worker-exec and crash records above; XINT notes an empty audit result cannot rule out earlier compromise.
      Source conflicts held open: nginx.org rates 123633, 123634 and 121810 medium while F5 and Wiz score them CVSS 4.0 9.2; Rapid7 lists NGINX Plus 37.0.0 to 37.0.7.1 fixed in 37.0.8.1 and
      37.1.0 to 37.2.0.1 fixed in 37.3.0.1 with R34 to R36 unfixed, Wiz lists 37.0.7.1 and 37.2.0.1 for 123633 and 37.0.8.1 and 37.3.0.1 for 123007; nginx.org gives the mail-proxy range as
      0.5.33 to 1.31.8 while Xint lists 0.5.15. F5's own K-articles (K000163926, K000163928, K000163925, K000163927, K000163931) could not be rendered by any transport.
      Other fixed issues in the same release that are not code execution: CVE-2026-118899 (infinite loop on TLS 1.3 request-body read, 8.7 DoS), CVE-2026-120993, CVE-2026-125283,
      CVE-2026-123640, CVE-2026-120967.

