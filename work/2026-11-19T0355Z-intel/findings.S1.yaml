    summary: |
      F5's 2026-11-18 release, which also carries the NGINX fixes, lists BIG-IP data-plane flaws that an unauthenticated network sender can
      reach: CVE-2026-121805 (an iRule that uses PEM::subscriber), CVE-2026-120285 (an HTTP profile plus an iRule that uses PSC::ip_address),
      CVE-2026-120722 (an iRule that uses DNS::scrape), CVE-2026-120292 (an HTTP profile plus an iRule using MR::message route),
      CVE-2026-116953 (an iRule using GENERICMESSAGE::route) and CVE-2026-123637 (BIG-IP APM with a per-request policy that includes the
      Client Information agent and Endpoint Security agents). F5's CNA text for each says undisclosed requests can make the Traffic
      Management Microkernel terminate and may lead to remote code execution; traffic is disrupted while TMM restarts and there is no control-plane
      exposure. Each is CVSS 4.0 9.3 (AV:N/AC:L/AT:N/PR:N/UI:N). CVE-2026-120718 (BIG-IP iControl REST) lets an attacker who holds a token extend its
      lifetime unless the owner deletes it (9.2, control plane only). Affected products per CERT-FR: BIG-IP 17.1.x, 17.5.x and 21.1.x, BIG-IP Next for
      Kubernetes 2.2 to 2.4, BIG-IP Next CNF and BIG-IQ 8.4.x; fixed builds named by CERT-FR are BIG-IP 17.1.3.6.0.14.20-ENG and 17.1.3.7.0.21.4-ENG, 17.5.1.10.0.80.35-ENG
      and 17.5.1.11.0.61.12-ENG, 21.1.0.4.0.19.3-ENG, BNK 2.2.5-EHF1, 2.3.4-EHF1, 2.4.2-EHF1 and BIG-IQ 8.4.2.3; the EUVD record for the iControl flaw gives 17.1.3.6, 17.5.1.10 and 21.1.0.2. No exploitation is
