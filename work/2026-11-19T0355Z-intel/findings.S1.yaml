    discovery_trace: "first seen at: ENISA EUVD critical-score window search, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-17&toDate=2026-11-19&page=0&size=100 (EUVD-2026-129432, Idunno AntiCsrf, assigner Mandiant, CVSS 4.0 9.3 with threat metric E:A) -> primary: Mandiant disclosure URL https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md (named in the record's references; extract served it in full). WebSearch ('Idunno.AntiCsrf CVE-2026-131914 Mandiant deserialization actively exploited ASP.NET WebForms') found no second source: the CVE is hours old."
    summary: |
      Mandiant published advisory MNDT-2026-0048 and CVE-2026-131914 on 2026-11-18 (the EUVD record is dated 2026-11-19 01:29 UTC) for Idunno.AntiCsrf, a defunct open-source ASP.NET WebForms anti-CSRF HTTP module (last release 0.9.1 Beta, December 2008, hosted on the retired CodePlex). In the module's PreRequestHandlerExecute step, any POST to a System.Web.UI.Page handler that does not opt out
      (ISuppressCsrfCheck or [SuppressCsrfCheck]) is processed before the page lifecycle: once a non-empty CSRF cookie and a non-empty CSRF form field exist, the module deserializes the form field with a parameterless ObjectStateFormatter, which applies no MAC, signature, encryption or binder, so a Base64-encoded .NET gadget chain in the form field executes code inside the IIS worker process (w3wp.exe).
      One unauthenticated POST suffices, even to an anonymously reachable page without a server form. The module then raises its CSRF error, so the response is an HTTP 302 or 500. Mandiant's text says active exploitation in the wild has been observed; the root-cause analysis was done by Google's FLARE team during an incident response (2026-11-04) and Mandiant assigned the CVE for public awareness on 2026-11-11 (it is the CNA).
      There is no vendor or maintainer patch; Mandiant says to remove the module and replace it with a supported anti-forgery mechanism, and gives a post-compromise checklist. Mandiant names no actor and no victim count.
    region_nexus: "global; footprint in Swiss administrations unknown (legacy ASP.NET WebForms applications that still carry the 2008-era module)"
    primary_sector_nexus: "indirect: only applications that bundle the module; the sources give no usage figure"
    sector: "public-sector"
    cves: [CVE-2026-131914]
    techniques: [T1190]
    affected_products: ["Idunno.AntiCsrf (Idunno.AntiCsrf.dll)", "Microsoft ASP.NET WebForms applications using it"]
    entity_keys: []
    new_entities:
      - { key: "product:idunno-anticsrf", type: product, name: "Idunno.AntiCsrf", aliases: ["AntiCSRF (CodePlex)", "Idunno.AntiCsrf.AntiCsrfModule"], summary: "Abandoned ASP.NET WebForms double-submit-cookie anti-CSRF module (0.9.1 Beta, 2008); CVE-2026-131914 (unkeyed ObjectStateFormatter deserialization, unauthenticated code execution as the IIS worker, no patch) was published by Mandiant on 2026-11-18 with a statement that exploitation in the wild has been observed." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Active exploitation in the wild has been observed."
        attribution: "Mandiant (MNDT-2026-0048)"
        source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"
      - quote: "Exploitation requires only a single HTTP POST request with no prior authentication or valid CSRF token."
        attribution: "Mandiant (MNDT-2026-0048)"
        source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"
      - quote: "has no active maintainer or official patch available."
        attribution: "Mandiant (MNDT-2026-0048)"
        source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md"
    extended_notes: |
      Exposure: any ASP.NET WebForms application whose Web.config registers Idunno.AntiCsrf.AntiCsrfModule in httpModules or modules (or whose bin directory holds Idunno.AntiCsrf.dll), including internally recompiled copies, which keep the sink (Mandiant: search Web.config and bin by name, not by file hash).
      Detection concepts: IIS logs for anomalous POST requests to .aspx endpoints that return HTTP 302 or 500 with an unusually large request size (cs-bytes, where logged), carrying the configured CSRF cookie (default name __CSRFCOOKIE) and an oversized Base64 value in the CSRF form field (default name __CSRFTOKEN); process-creation telemetry for children of w3wp.exe (shells, scripting hosts, download tools) on the IIS host.
      Triage: a legitimate post carries a GUID in the CSRF cookie and a short token that matches it; a long Base64 .NET-serialized blob in the form field with a non-GUID cookie value is the abnormal shape (derived from the mechanism Mandiant describes, not an observed signature).
      Post-patch (no patch exists): after removing the module, Mandiant says environments with evidence of exploitation should rotate every secret in Web.config and applicationHost.config (machineKey keys, encryption keys, database credentials) and inspect the webroot for unauthorised files.
      Single-source note: Mandiant is both discoverer, CNA and the only exploitation observer; the ENISA record repeats its text. The CVE was hours old at collection time.

