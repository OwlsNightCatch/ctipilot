  note: "profile configures no product watchlist; the sweep is a no-op, as the spawn message says"

candidate_sources:
  - id: nginx-security-advisories
    publisher: "nginx.org security advisories page (F5 / nginx project)"
    url: "https://nginx.org/en/security_advisories.html"
    category: vendor-psirt
    why: "Project primary for a web server and proxy under much of the public sector; `extract` reads it in full with per-CVE vulnerable and fixed ranges and severity words; F5's own K-articles (my.f5.com) are an SPA no transport renders, so this page is the only readable primary. On 2026-11-18 it carried the nginx2root CVEs (CVE-2026-123007 and four more) that reached the pipeline through oss-security and the Dutch and Swiss authorities."
  - id: roundcube-news
    publisher: "Roundcube Project news"
    url: "https://roundcube.net/news/"
    category: vendor-psirt
    why: "Project primary for a webmail front end common in cantonal and communal administrations; `extract` reads the dated listing and each announcement in full; the 2026-11-09 security release (1.6.21 and 1.7.6) reached the pipeline only through an oss-security relay of 2026-11-18."
  - id: securifera-blog
    publisher: "Securifera (security research blog and CNA advisories)"
    url: "https://www.securifera.com/blog/"
    category: research
    why: "Discoverer-written root-cause write-ups with working PoCs (REDCap CVE-2026-90817, ClamAV CVE-2026-20217, FatPipe, OpenEye); `extract` reads listing and posts; the REDCap flaw entered KEV 2026-11-18 with the discoverer's post as the only technical primary."

coverage_gaps:
  - source_id: belden-psirt
    reason: "https://www.belden.com/security answers 403 to url --direct, extract and WebFetch, and the jina pool is exhausted (HTTP 402); the hirschmann-support.belden.com knowledge base is a Salesforce SPA shell. Working partial recipe: the advisory PDFs sit on assets.belden.com and `python3 tools/fetch_source.py pdf <assets.belden.com PDF URL>` reads them (PSIRT-6 dated 2026-09-09 and PSIRT-7 dated 2026-06-19 read in full); discovery has to go through WebSearch (queries returned PSIRT-2 to PSIRT-7, none dated in the lookback). No Belden advisory newer than 2026-09-09 was found. Candidate stays; not promoted."
  - source_id: my.f5.com (F5 K-articles)
    reason: "recipe missing: K000163925 to -935, K000164058 render as a Salesforce Lightning shell to extract and WebFetch; F5 content reached the run through nginx.org (NGINX), CERT-FR CERTFR-2026-AVI-1567 and the ENISA EUVD record (BIG-IP, CNA text)."
  - source_id: support.hpe.com (HPE bulletin pages)
    reason: "docDisplay pages return an IAM login shell to extract and WebFetch; the working route is the CSAF JSON (https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json via `url --direct`), whose tracking.revision_history is the revision signal. The hpe-networking-psirt record already points at the CSAF host."
  - source_id: advisories-ncsc-nl
    reason: "recipe note: `extract https://advisories.ncsc.nl/advisory?id=NCSC-2026-0506` returned a 'Redirecting...' stub from a cached snapshot, while the final URL `https://advisories.ncsc.nl/2026/ncsc-2026-0506.html` reads in full; the `advisory?id=` form worked for NCSC-2026-0507 and -0491. Prefer the /YYYY/ncsc-YYYY-NNNN.html path."
  - source_id: dell-security-advisories
    reason: "https://www.dell.com/support/security/en-us renders only 'Loading...'; individual DSA kbdoc pages extract in full (DSA-2026-479 read). New DSAs can only be enumerated through the ENISA EUVD score search."
  - source_id: airlock.com / juniper support portal
    reason: "https://www.airlock.com/security-advisories answers HTTP 400 (cookie check) to url and extract and returns a disclosure-policy page to WebFetch; the Juniper JSA119568 article is an SPA shell; both reached the run only through relays (ENISA EUVD, CERT-FR)."
  - source_id: atlassian-security-advisories
    reason: "the listing page is a 2026-05-11 snapshot without the November bulletin; the Atlassian Security Bulletin of 2026-11-17 was not located by WebSearch; NCSC-NL NCSC-2026-0496 was read instead."
  - source_id: esentire
    reason: "https://www.esentire.com/security-advisories extracts as a marketing page with no advisory items (no listing transport); WebSearch not repeated for it."
  - source_id: cisa csaf-recent
    reason: "`cisa csaf-recent` returned 25 of 4,011 rows, all legacy ids (icsa-23-*, icsa-24-*, icsa-25-*) stamped 2026-11-18T15:34 and 17:34, i.e. a bulk re-publish, and no 2026 advisory; so no new ICS advisory could be confirmed or ruled out for the window from that feed."
  - source_id: ibm-support-security-bulletins
    reason: "no listing transport; the record's recipe (ENISA EUVD score search for IBM rows) found no IBM row at 9.0+ for 2026-11-17 to 2026-11-19."

