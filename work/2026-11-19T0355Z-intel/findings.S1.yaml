      Exposure: any REDCap server with a public survey (version 13.3.0 or later below 16.0.49 LTS, 17.3.10 LTS and 17.4.4 Standard). The version is read from the REDCap Control Center; the CNA lists those three builds as the fixed ones (the REDCap Community release notes are login-only and were not read).
      SecurityWeek (relaying GTIG) notes REDCap lets administrators run legacy versions side by side with the current one, so after the upgrade confirm no older redcap_v* version directory remains reachable.
      Detection concepts: web access logs for POST requests to survey URLs whose __passthru parameter is double URL-encoded and that carry a Data Import route or an fname form field holding a php://filter stream
      (php://filter with dechunk, per Securifera's write-up); file-integrity records for the BladeOne compiled-template cache under the REDCap temp directory (a .bladec file rewritten outside a normal view compile);
      leftover uploads with a .php.csv suffix in the web temp directory; PHP worker processes that start shells or interpreters (EDR parent lineage). Securifera's PoC restores the cache afterwards, so a clean cache does not prove no exploitation.
      Triage: a legitimate public survey request never carries a php:// wrapper in fname or a double-encoded __passthru route.
      Mitigation before the upgrade: OpenCVE (aggregator, not vendor) suggests disabling or restricting the public survey feature; this is not a vendor statement.
      Source conflict held open: pentest-tools reports 'CISA KEV: No' as of its 2026-10-23 snapshot, consistent with the 2026-11-18 addition; OpenCVE (2026-11-18) still said not in KEV.
      CISA gives no exploitation detail, so the listing is the only exploitation evidence; ENISA's exploitedSince field (2026-11-18) is derived from it.

