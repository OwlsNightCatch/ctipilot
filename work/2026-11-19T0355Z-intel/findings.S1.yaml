    summary: |
      Broadcom's notice CA20261117-01 of 2026-11-17 lists 11 CVEs in AutoSys Workload Automation (the Workload Control Center web tier and the AutoSys engine native clients) and rates the notice Critical at CVSS 4.0 9.3. Three need no authentication and no user interaction over the network:
      CVE-2026-126551 (a hard-coded cryptographic key in WCC lets an unauthenticated remote attacker execute code on managed System Agent hosts; WCC 12.1.x through 24.2.00), CVE-2026-126552 (in older releases a WCC configuration endpoint was reachable without authentication and allows OS command execution on the WCC server; 12.1.x through 24.0.01) and
      CVE-2026-126553 (in older releases a WCC endpoint deserialized untrusted data and allows command execution on the WCC server; 12.1.x through 24.0.01). CVE-2026-126547 (missing authorization, unauthenticated agent control operations, 7.8) is also unauthenticated. Authenticated flaws include a command injection in the WCC Forecast reporting feature (CVE-2026-126558, 8.7, on the AE server host) and session identifiers and credentials written to logs (CVE-2026-126550, 8.6; CVE-2026-126549, 5.1).
