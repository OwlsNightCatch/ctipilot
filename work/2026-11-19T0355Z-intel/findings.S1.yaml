    summary: |
      F5 and the nginx project published on 2026-11-18 a security release that fixes ten flaws, five of them memory-corruption bugs
      that five independent discovery teams (Wiz, Rapid7, Xint, and Ikotas Labs and Metnir per Wiz) report can end in code execution
      as the nginx worker without authentication. CVE-2026-123007 (HTTP/2 flow control: cancelling queued DATA frames refunds too much
      send-window credit, then repeated WINDOW_UPDATE frames push the unsigned h2c->send_window counter into an invalid length and an
      oversized copy reads and writes worker memory) exists in every release from 1.9.5 through 1.31.8 and needs only HTTP/2 to be
      enabled; Wiz demonstrated code execution on a server that serves static files. CVE-2026-123633 (HTTP/2 connection freed while a
      request is still running, only when requests are proxied to an upstream and worker connection slots run low) dates from 1.19.7.
      The other three do not depend on HTTP/2: CVE-2026-123634 (resolver use-after-free, needs a resolver, a request-derived
      proxy_pass destination and a subrequest source such as mirror or SSI), CVE-2026-121810 (HTTP/3 with requests forwarded to an
      upstream) and CVE-2026-113425 (mail proxy with auth_http). F5 scores each of the five CVSS 4.0 9.2 and says code execution needs
      ASLR disabled or bypassed; nginx.org itself labels 123007 "major", 113425 "major" and 123633, 123634 and 121810 "medium".
      Rapid7 published a working proof of concept for CVE-2026-123007 against a Docker image running nginx 1.31.8 and states the
      exploit needs about 128 GB of HTTP/2 traffic (a demo run took 2.5 minutes; Rapid7 puts the transfer at about 2 minutes on 10 Gbit/s and 17 minutes on 1 Gbit/s, and out of reach below roughly
      300 Mbit/s because of nginx's one-hour connection lifetime), depends on an x86-64 glibc EVEX/YMM memcpy selected from the avx512f
      and avx512vl CPU features, and will likely fail through a proxy or on a long-running worker. Xint chained 123007 with a separate,
      still unreleased Linux SCTP privilege-escalation flaw to reach root and escape a container. Fixed releases: nginx 1.31.9
      (mainline) and 1.30.7 (stable); NGINX Plus 37.3.0.1 and 37.0.8.1, and per Rapid7 no fix for Plus R34 to R36. No source reports
      exploitation; NCSC.ch rates exploitation unknown with a PoC available and NCSC-NL expects large-scale exploitation once PoC
      code circulates.
    region_nexus: "global; NCSC.ch Cyber Security Hub advisory 13203 (2026-11-18) and NCSC-NL High advisory, so the Swiss and Dutch authorities both treat it as priority"
    primary_sector_nexus: "direct: nginx is a common reverse proxy, ingress and web front end in public-sector estates; the product footprint in Swiss administrations is not sourced"
