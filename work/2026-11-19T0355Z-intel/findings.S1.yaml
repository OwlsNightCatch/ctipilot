      fault detail's exceptionName element and, when a String data element is present, instantiates it through its String constructor before checking it is an AxisFault; loading alone runs the static initializer; with a suitable class on the classpath this gives remote code execution, and the fault is parsed before any per-service authentication handler runs. All Axis 1.x through 1.4 are affected, the project
      does not expect to release a fixed Axis 1.x, recommends migrating to Axis 2/Java and points to a patch commit (41f3b4e8d04e310ca81f86b92630ab2c11d608bd) for self-built copies. The stored Confluence entry says no source reports Confluence exploitation but the same flaw is exploited against N-able N-central; the KEV listing is CISA's exploitation statement for the Axis flaw itself, without naming a product.
