  # ---------------------------------------------------------------- A6
  - title: "CVE-2026-99288 NoisyTCP: a Linux kernel TCP established-lookup race present since 2015 lets a remote unauthenticated sender panic a host through an ordinary listening socket and, with a harder race, reach a use-after-free; fixed by kernel commit 4e2b3ef19e0e (2026-11-03), Debian DSA-6628-1 and DLA-4906-1 ship fixes; no general public exploit"
    suggested_priority: notable
    lookback: true
    sources:
      - { url: "https://www.openwall.com/lists/oss-security/2026/11/15/2", publisher: "oss-security (discoverer Hyunwoo Kim, sent 2026-11-16 01:00 +0900 after embargo expiry)", date: "2026-11-15", role: "primary" }
      - { url: "https://github.com/V4bel/NoisyTCP", publisher: "V4bel NoisyTCP advisory repository (discoverer)", date: "2026-11-15", role: "primary" }
      - { url: "https://security-tracker.debian.org/tracker/CVE-2026-99288", publisher: "Debian Security Tracker (fix status)", date: "2026-11-18", role: "corroborating" }
    discovery_trace: "first seen at: oss-security daily index, URL https://www.openwall.com/lists/oss-security/2026/11/15/ (rotational record oss-security, lookback 168 h) -> primary: message URL https://www.openwall.com/lists/oss-security/2026/11/15/2 -> pivot: GitHub URL https://github.com/V4bel/NoisyTCP -> corroboration: Debian tracker URL https://security-tracker.debian.org/tracker/CVE-2026-99288"
    summary: |
      Hyunwoo Kim disclosed NoisyTCP after the linux-distros embargo expired. Established-socket lookups in the Linux TCP stack are lockless and their slab caches are SLAB_TYPESAFE_BY_RCU; the lookup takes a reference
      and re-checks the tuple but does not check that the object is still hashed, so a stale lookup can return a new SYN-cookie request socket that has a NULL listener. The receive path then dereferences the NULL pointer and the host panics
      (a reliable remote denial of service); a second path ends in a use-after-free but needs nested races and is hard to hit. The trigger needs a server with two or more RX queues or RPS, because packet processing must be split across
      CPUs by the receive-hash difference between IPv4 fragments and ordinary TCP packets; it works against a plain listen() socket, so default nginx, Apache or SSH servers on Linux qualify. The discoverer measured 5 seconds to 2 minutes against such servers on QEMU/KVM
      and about 14 hours against a quiet bare-metal server with 8 RX queues. The flaw was introduced by commit 079096f103fa (2015-10-03) and fixed by 4e2b3ef19e0e (2026-11-03). Mitigations stated by the discoverer: disable SYN cookies
      with net.ipv4.tcp_syncookies=0 in each network namespace (this lowers SYN-flood protection), or reduce the receiving interface to one RX queue and disable RPS and RFS. Debian lists fixes in bookworm (kernel 6.1.192-1, DLA-4906-1) and trixie (6.12.117-1, DSA-6628-1).
      The discoverer states he has only a limited, lab-specific exploit for VM servers and is still researching a general one; no exploitation in the wild is reported.
    region_nexus: "global"
    primary_sector_nexus: "indirect: Linux hosts that terminate TCP directly (web, mail, SSH, proxy), and container hosts, where the discoverer notes a kernel panic takes down every container"
    sector: "public-sector"
    cves: [CVE-2026-99288]
    techniques: [T1190, T1499]
    affected_products: ["Linux kernel"]
    entity_keys: ["product:linux-kernel"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    related_entries: ["2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root"]
    evidence:
      - quote: "it can be triggered pre-auth and remotely against servers that TCP packets sent by an attacker can reach directly, such as Nginx, Apache, and SSH servers running with their \"default\" configuration."
        attribution: "Hyunwoo Kim (oss-security)"
        source_url: "https://www.openwall.com/lists/oss-security/2026/11/15/2"
      - quote: "Fixed: 4e2b3ef19e0e (2026-11-03)"
        attribution: "Hyunwoo Kim (oss-security)"
        source_url: "https://www.openwall.com/lists/oss-security/2026/11/15/2"
      - quote: "Applying the 4e2b3ef19e0e patch is the priority"
        attribution: "Hyunwoo Kim (oss-security)"
        source_url: "https://www.openwall.com/lists/oss-security/2026/11/15/2"
    extended_notes: |
      Exposure: any Linux kernel before the fix that receives TCP from untrusted senders on a NIC with two or more RX queues or with RPS/RFS enabled; check `uname -r` against the distribution kernel advisory (Debian bookworm 6.1.192-1, trixie 6.12.117-1; other distributions not read).
      Detection: kernel logs and crash dumps (journal of the previous boot, pstore, kdump) with 'kernel NULL pointer dereference' and a tcp_v4_rcv frame, host reboots on internet-facing servers without an operator cause, and bursts of IPv4 fragment plus TCP packets toward one listening port from one source.
      Triage: a single panic is not proof of attack (the same oops signature appears from unrelated bugs); the stated race needs sustained traffic, minutes on a VM.
      Bug class overlap: separate from the covered CVE-2026-98432 TCP use-after-free (different commit and trigger).
      nginx2root note: the undisclosed Linux SCTP local privilege-escalation flaw Xint chains with nginx is a different kernel bug that is not yet patched (oss-security 2026-11-18, Rich Felker, quoting nginx2root.com; anyone not needing SCTP can block loading of the module).

