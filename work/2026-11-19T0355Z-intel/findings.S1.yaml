    summary: |
      CISA added CVE-2026-90817 to the KEV catalogue on 2026-11-18 on evidence of active exploitation that it does not describe (no actor, victim
      or telemetry; due date 2026-11-21 under BOD 26-04). The flaw is in Vanderbilt's REDCap research-data platform from 13.3.0 on. Securifera, which
      found it and acts as the CNA, explains a chain of five faults: the public survey handler validates __passthru in two forms so a double-encoded value
      reaches the root index.php dispatcher and, with it, the DataImportController route; the project user-rights object is built before the survey respondent
      identity exists and an undefined SUPER_USER constant counts as super-user, so the public context gets the Data Import privilege and the POST CSRF check is skipped
      because NOAUTH is defined; the Data Import commit path trusts POST[fname] as a local path or PHP stream; the CSV byte-order-mark cleanup writes the changed
      bytes back to the same stream, so a php://filter chain becomes a controlled file overwrite; and a predictable, worker-writable BladeOne compiled-template cache
      (APP_PATH_TEMP/cache, reachable through the ParcelController:show route without login) is then included as PHP. The attacker needs only a valid public survey hash, no
      account, session, role or CSRF token. The CNA record scores CVSS 3.1 9.8 and names upgrades to REDCap 16.0.49 LTS, 17.3.10 LTS or 17.4.4 Standard. Securifera's PoC has been on
      GitHub since 2026-10-01. Separately, Google's June 2026 reporting (via SecurityWeek) describes a China-linked cluster, UNC6508, compromising internet-facing legacy REDCap servers
      since 2023; no source ties CVE-2026-90817 to that cluster.
