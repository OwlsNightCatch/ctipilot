new_recipe_notes:
  - "ENISA EUVD: `url --direct 'https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-17&toDate=2026-11-19&page=N&size=100'` returned 222 records over three pages (100 per page, page index 0 to 2) and `enisaid?id=EUVD-...` returns the CNA text, vector and exploitedSince; record `description` text is the vendor's, which is how the Airlock, F5 and Dell CVE texts were read when the vendor pages were walled."
  - "HPE advisories: the CSAF JSON's document.tracking.revision_history is the cheapest check that a published bulletin changed (HPESBNW05162 revision 2 replaced a CVE id and added four)."
  - "Revision scan shortcut: Cisco advisories carry a 'Version Description Section Status Date' table in the extract; Drupal SA pages expose the CVE id and risk vector only in the raw HTML (`url --direct`), not in the trafilatura text."
