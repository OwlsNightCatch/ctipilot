    summary: |
      Airlock, the Ergon web-application firewall and API gateway vendor, published CVE-2026-19707 on 2026-11-18 (it is the CNA). A bug in Airlock Gateway 8.5.2 and earlier (the record names 8.5.0 to 8.5.2) and 8.6.0 lets attacker-controlled HTML in a backend response exploit the Smart Form Protection feature, possibly causing denial of service or remote code execution against the gateway; fixed in 8.5.3 and 8.6.1.
