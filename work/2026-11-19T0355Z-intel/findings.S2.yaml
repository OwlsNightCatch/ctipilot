  - title: "Canton Bern: the Information and Cybersecurity Act (ICSG) and its ordinance took effect on 2026-11-01 - cantonal offices must report cyberattacks within 24 hours (72 hours for personal-data incidents) through a cantonal platform that forwards to BACS"
    sources:
      - { url: "https://ch.headtopics.com/news/kanton-bern-verscharft-cybersicherheitsgesetz-nach-89952284", publisher: "SRF News relay on headtopics (aggregator copy of an SRF report; the SRF original was not found)", date: "2026-11-18", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-09-11/update-berner-cybersicherheitsgesetz-kommt-im-november", publisher: "Netzwoche (update of 2026-09-11 quoting the Regierungsrat communiqué)", date: "2026-09-11", role: "corroborating" }
      - { url: "https://www.plattformj.ch/artikel/246599/", publisher: "Plattform J (regional press, relays the Regierungsrat communiqué)", date: "2026-10-22", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('Cyberangriff Schweiz Gemeinde Kanton Verwaltung Hackerangriff 18. November 2026', extended) → pivot: headtopics SRF relay, URL https://ch.headtopics.com/news/kanton-bern-verscharft-cybersicherheitsgesetz-nach-89952284 → WebSearch ('SRF Kanton Bern Cybersicherheitsgesetz Meldepflicht 24 Stunden …') → pivot: Netzwoche, URL https://www.netzwoche.ch/news/2026-09-11/update-berner-cybersicherheitsgesetz-kommt-im-november → pivot: Plattform J, URL https://www.plattformj.ch/artikel/246599/; the Bern Regierungsrat communiqué itself (be.ch) and the Gesetzessammlung text were not found"
    summary: |
      Per the Bern Regierungsrat communiqué as relayed by Netzwoche (update of 2026-09-11) and Plattform J, the ICSG and the Verordnung über die Informations- und Datensicherheit entered into force on 2026-11-01, with transition periods of up to three years depending on the provision. Cantonal offices must report cyberattacks and security incidents within 24 hours, and within 72 hours where personal data is affected; reports go through a cantonal platform and are passed to the federal BACS where necessary. Each ICT resource is rated before commissioning into one of four protection levels: the two lower levels need only a uniform baseline ('Grundschutz BE'), the two higher levels a security and data-protection concept. Information is classified only where unauthorised knowledge would harm the canton's interests. The sources disagree on reach: Netzwoche quotes the Regierungsrat that these and further basic provisions bind not only cantonal authorities but also communes, parish bodies and other bearers of public tasks, while Plattform J says communes only have to apply the data-security principles of the ICSG and need not classify their own information, with further requirements only where they work with cantonal or federal applications. An SRF report relayed on 2026-11-18, which opens with attackers taking control of the cooling systems of a butcher shop in Köniz, adds that Aargau will open a cyber coordination office for communes, citizens and business next year and has piloted preparedness tests with BACS that other cantons can use from 2027. Whether the 24-hour duty binds communes is not settled by the fetched sources.
