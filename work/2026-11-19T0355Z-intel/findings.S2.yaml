    extended_notes: |
      Transferable lessons (analyst reading, not source statements): (1) containment here was Internet isolation of individual servers followed by a rebuild from scratch of the six servers carrying the ~20 applications, which cost availability but kept the rest of the administration working; (2) an application the canton had already replaced (the tax calculator) was among the affected, which points a hunt at superseded or legacy applications still reachable on cantonal servers, though no source says it was the entry point; (3) the BORS emergency-services IT was separate and reported unaffected, while Alertswiss was used as the precaution channel for a possible emergency-number restriction, a pattern other cantons and emergency services can rehearse; (4) the canton states the activity is intrusion-oriented, not DDoS, so availability controls alone do not address it.
      Source conflict to surface: Volksstimme's sub-heading says the emergency numbers 'ausgefallen' and that it is unclear whether the outage is connected to the attack, while the Landeskanzlei spokesman says the numbers were reachable at all times and the Alertswiss notice was precautionary. Report the canton's statement as the statement of record and the Volksstimme framing as the contrary reading.
      Unknowns: initial access, attacker, data theft, ransomware, restoration time. The 2026-11-18 evening canton update page (baselland.ch .../landeskanzlei/medienmitteilungen/update-zum-cyberangriff-...) is unreadable on every transport; its text is taken from the nau.ch and Polizeiticker relays. The Basler Zeitung article (bazonline.ch, 2026-11-18, quotes 'Heftiger, breit angelegter Angriff') is paywalled and was not read. Worth a follow-up in the next fires; a canton status page at bl.ch carries the live updates.
