        source_url: "https://cert.europa.eu/publications/security-advisories/2026-022/"
      - quote: "All five vulnerabilities can lead to unauthenticated code execution with the privileges of the NGINX worker process"
        attribution: "CERT-EU"
        source_url: "https://cert.europa.eu/publications/security-advisories/2026-022/"
      - quote: "NGINX Open Source 1.31.9 bzw. 1.30.7"
        attribution: "CERT.at"
        source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar"
      - quote: "Für NGINX Plus R33 bis R36 sind derzeit keine Updates verfügbar."
        attribution: "CERT.at"
        source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar"
      - quote: "Leveraging CVE-2026-123007 for RCE requires a significant amount of network traffic to be transmitted, approximately 128 GB of HTTP/2 data."
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed"
      - quote: "Each one leads to remote code execution on its own, but they affect different configurations."
        attribution: "Xint"
        source_url: "https://xint.io/blog/nginx2root-remote-code-execution"
    extended_notes: |
      Detection concept (CERT-EU): NGINX error-log lines of the form 'worker process … exited on signal' mark crashes and therefore exploitation attempts, but are not a high-fidelity indicator of successful code execution; confirm with process-creation telemetry for children of the NGINX worker. Exposure check: NGINX version (nginx -v) against 1.30.7 / 1.31.9, and the listen directives for http2, quic (HTTP/3), resolver with proxy_pass built from request data, and mail proxy with auth_http; NGINX Plus builds per CERT.at.
      Discrepancies to carry, not average: (a) CVE count (NCSC.ch two, CERT.at four, CERT-FR two, CERT-EU five, heise ten fixed in the release); (b) fixed NGINX Plus builds differ between CERT.at (37.3.0.1, 37.0.8.1) and heise (37.2.0.1, 37.0.7.1) - the CERT.at reading, which says 37.2.0.1 / 37.0.7.1 still carry CVE-2026-123007 and CVE-2026-121810, is the vendor-derived one; (c) first affected release for the mail-proxy flaw is 0.5.33 in CERT.at and 0.5.15 in Xint; (d) CERT-FR's affected-version list prints Plus 37.x as '3.1.x / 3.7.x' (apparent typo). my.f5.com K000163925-K000163935 are the vendor primaries and should be read by S1 through another transport. CVE-2026-123633 and CVE-2026-123007 are the two NCSC.ch lists with CVSS 4.0 9.2.
