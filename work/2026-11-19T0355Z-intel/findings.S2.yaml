    summary: |
      The Landeskanzlei of Basel-Landschaft states that diverse cyberattacks on the cantonal IT infrastructure have been under way since Sunday 2026-11-15; the cybersecurity sub-staff (Teilstab Cybersicherheit) of the cantonal command staff took countermeasures and isolated individual servers from the Internet, so outages in cantonal digital applications were possible (canton communiqué, 2026-11-18). In an evening update the canton said the attacks affect about 20 cantonal applications, for example the already-replaced tax calculator, that these run on six servers which are being reinstalled, and that the rescue and security organisations (BORS) confirmed their IT systems were never affected (Keystone-SDA via nau.ch; Polizeiticker relaying the Polizei BL channel). In the night to Wednesday the canton had sent an Alertswiss notice that the emergency numbers 112, 117 and 118 might be restricted and withdrew it after a few hours; government spokesman Nic Kaufmann says the numbers were reachable at all times and the notice was a precaution because it was unclear whether further servers had to be isolated (Keystone-SDA). The second Landschreiber told Volksstimme (2026-11-19) that the activity is not a flooding attack on web servers but an attempt to penetrate the canton's systems, that origin and perpetrators are still under analysis, that some departments work without the isolated servers and their applications, and that no restoration time is known. No source reports ransomware, data theft, an extortion claim or an attributed actor; OnlineReports notes that a link to the October PHP flaws, when Basel-Stadt took cantonal websites offline on 21 October, is not established.
