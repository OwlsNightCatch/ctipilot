    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge `ncsc-csh recent 25` (post 13203 created 2026-11-18T16:40Z) → corroboration: cert-at warnings feed https://www.cert.at/cert-at.de.warnings.rss_2.0.xml → cert-eu `recent 15` (2026-022) → cert-fr alerte feed (ALE-017) → advisories-ncsc-nl `recent 25` (NCSC-2026-0506, `ncsc-nl csaf`) → heise-sec feed → primary research: Rapid7 post and Xint post named in the NCSC-CH references; F5 vendor page https://my.f5.com/manage/s/article/K000163926 fetched but unreadable (JS shell on extract)"
    summary: |
      F5 published fixes on 2026-11-18 for NGINX Open Source and NGINX Plus flaws that Xint found and calls nginx2root. Per CERT-EU and CERT.at five paths (CVE-2026-123007, CVE-2026-123633, CVE-2026-121810, CVE-2026-123634, CVE-2026-113425) each lead to unauthenticated code execution with the privileges of the NGINX worker process (the NCSC.ch advisory names only the first two; CERT.at lists four and omits CVE-2026-123634; heise counts ten CVEs fixed in the release). They differ by configuration: CVE-2026-123007 needs only HTTP/2 enabled on a listener (an integer underflow in the connection send_window handling, present since NGINX 1.9.5); CVE-2026-123633 needs HTTP/2 with requests forwarded to an upstream and few free worker connections; CVE-2026-121810 needs HTTP/3 with an upstream; CVE-2026-123634 needs a resolver, a request-derived proxy_pass destination and mirror (or another subrequest feature) per Xint; CVE-2026-113425 needs the mail proxy with auth_http. F5 scores each CVSS 3.1 8.1 and CVSS 4.0 9.2 (CERT.at), CERT-EU quotes 8.1. Rapid7 published a proof of concept for CVE-2026-123007 against a linux/amd64 NGINX 1.31.8 container and says exploitation needs about 128 GB of HTTP/2 data (minutes on a 10 Gbit/s path, impossible below roughly 300 Mbit/s because of the one-hour default connection lifetime), that a proxied HTTP/2 connection will likely not retransmit the required frames, and that its method depends on an x86-64 glibc EVEX/YMM memcpy path chosen at runtime; Xint chained it with a Linux kernel SCTP flaw to root on the host including a Docker container escape. CERT-EU states that no exploitation in the wild has been reported; NCSC.ch lists the exploitation status as unknown with a proof of concept available; NCSC-NL expected a public proof of concept shortly and large-scale exploitation after it. Fixed: NGINX Open Source 1.31.9 and 1.30.7, NGINX Plus 37.3.0.1 and 37.0.8.1 (CERT.at); NGINX Plus 37.2.0.1 and 37.0.7.1 already carry the fix for CVE-2026-123633 (and, by CERT.at's affected ranges, CVE-2026-113425) but remain affected by CVE-2026-123007 and CVE-2026-121810, while heise lists them as the fixed Plus builds; NGINX Plus R33 to R36 have no update yet. Temporary: removing http2 from the listen directives (or http2 off) blocks CVE-2026-123007 and CVE-2026-123633 only; restrict mail listeners to trusted networks for CVE-2026-113425; F5 names no mitigation for the HTTP/3 and resolver paths.
