claims:
  - {claim_id: 34f8596905, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-022/", passage: "F5 published an advisory addressing five vulnerabilities in NGINX that allow an unauthenticated remote attacker to execute code with the privileges of the NGINX worker process"}
  - {claim_id: d38e46036c, verdict: ok, source_url: "https://advisories.ncsc.nl/2026/ncsc-2026-0506.html", passage: "NCSC-NL lists CVE-2026-113425, -121810, -123007, -123633, -123634 each CVSS (v4) 9.2; NCSC.ch 13203 and Wiz score the two HTTP/2 CVEs 9.2; Rapid7 scores CVE-2026-123007 9.2 (Critical)"}
  - {claim_id: 58857518c3, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "After installing the update, restart nginx or complete a supported live binary upgrade. A configuration reload alone does not replace the running executable."}
  - {claim_id: ce283802a2, verdict: ok, source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", passage: "NGINX Plus 37.1.0 - 37.2.0.1 fixed 37.3.0.1; 37.0.0 - 37.0.7.1 fixed 37.0.8.1; R34 - R36 None; OSS 1.31.0-1.31.8 fixed 1.31.9; 1.9.5-1.30.6 fixed 1.30.7"}
  - {claim_id: 4f7aaf5498, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "NGINX Plus 37.2.0.1 und 37.0.7.1 enthalten bereits einen Fix fuer CVE-2026-123633; R34 bis R36 (alle vier Schwachstellen); Wiz lists 123633 fixed 37.0.7.1; 37.2.0.1"}
  - {claim_id: b5436d25cc, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Use-after-free during response processing in resolver, CVE-2026-123634, Not vulnerable: 1.31.9+, 1.30.7+, Vulnerable: 0.6.18-1.31.8"}
  - {claim_id: 0ccd2da0b6, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "CVE-2026-123007 und CVE-2026-121810: 37.1.0 bis 37.2.0.1 sowie 37.0.0 bis 37.0.7.1; R34 bis R36 (alle vier Schwachstellen); Fuer NGINX Plus R33 bis R36 sind derzeit keine Updates verfuegbar"}
  - {claim_id: ec5df3ec64, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "CVE-2026-113425: 37.1.0 bis 37.2.0 sowie 37.0.0 bis 37.0.7; R33 (nur CVE-2026-113425); R34 bis R36 (alle vier); Plus 37.3.0.1 bzw. 37.0.8.1 fixes; R33-R36 no updates"}
  - {claim_id: babd5a2744, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Per-CVE entries Not vulnerable: 1.31.9+, 1.30.7+ for CVE-2026-123634, -123007, -121810, -123633, -113425; page carries no dateline (date from CERT-EU/Rapid7 release date 2026-11-18)"}
  - {claim_id: d01c24268e, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-022/", passage: "All five vulnerabilities can lead to unauthenticated code execution with the privileges of the NGINX worker process"}
  - {claim_id: 40b77e2fda, verdict: ok, source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", passage: "A remote, unauthenticated client can exploit this error by cancelling queued response data, then make nginx use an invalid length when copying a later response."}
  - {claim_id: c6e2ace250, verdict: ok, source_url: "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities", passage: "Our testing of CVE-2026-123007 demonstrated code execution on NGINX serving ordinary static files, without a backend application or third-party modules."}
  - {claim_id: cf1fd003a2, verdict: ok, source_url: "https://github.com/sfewer-r7/CVE-2026-123007", passage: "PoC will likely fail against a vulnerable NGINX server which has multiple concurrent clients; Rapid7 blog: approximately 128 GB of HTTP/2 data; target nginx 1.31.8"}
  - {claim_id: cc3603fe76, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "Rapid7: execution as the master process or root has not been established; CERT.at: ASLR deaktiviert oder umgangen werden kann, laut F5; Wiz: attackers can use either vulnerabilities for memory read..."}
  - {claim_id: 7ca1b2f6c2, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13203", passage: "Current exploitation status: UNKNOWN, Proof-of-Concept Available; CERT-EU: no exploitation in the wild has been reported yet; NCSC-NL expects large-scale exploitation once PoC code available"}
  - {claim_id: a8942d3a07, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Not vulnerable: 1.31.9+, 1.30.7+"}
  - {claim_id: a809d7d960, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "F5 stellt Updates bereit, die alle vier Schwachstellen beheben: NGINX Plus 37.3.0.1 bzw. 37.0.8.1; 37.2.0.1 und 37.0.7.1 ... weiterhin von CVE-2026-123007 und CVE-2026-121810 betroffen"}
  - {claim_id: 8ebf218fed, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "nginx.org Vulnerable: 1.9.5, 1.19.7, 0.6.18, 1.25.0, 0.5.33 to 1.31.8; Xint: resolver + request-derived proxy_pass + mirror (SSI may reach the same bug); mail proxy using proxy on and auth_http"}
  - {claim_id: 673b9baa5e, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "A backport can fix a vulnerability without changing the version reported by `nginx -v`. Only the distribution's full package version changes."}
  - {claim_id: 62589ae8d5, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "A program started by an nginx worker is the clearest sign of a successful attack; CERT-EU: worker exits in the error log are an indication of exploitation attempts, not high-fidelity RCE indicator"}
  - {claim_id: d0acd58306, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "It sends a large number of WINDOW_UPDATE frames over one long-lived connection, so bytes_received keeps climbing while nginx sends little back. It also opens many short TLS connections from the sam..."}
  - {claim_id: b68ef3030d, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "If you see both ... and there is no legitimate explanation, such as a large upload, block the source; the signs below are weaker, and each one can have a normal cause on its own"}
  - {claim_id: 929f2fddc2, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "Disabling HTTP/2 addresses only two of the five; Xint 3.3.2 fixed upstream group instead of request-time DNS lookups; 3.3.3 remove QUIC listeners; 3.3.4 bind or firewall mail listeners"}
  - {claim_id: 629d272dc8, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "We chained this vulnerability with a separate flaw in the Linux kernel's SCTP subsystem to gain root ... escaped a Docker container; Until a kernel patch is available ... install sctp /bin/false"}
  - {claim_id: 9c73b9cecc, verdict: ok, source_url: "https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog", passage: "CISA KEV 2026-11-18: CVE-2026-40217 BerriAI LiteLLM Unprotected Alternate Channel Vulnerability, based on evidence of active exploitation; LiteLLM GHSA: sandbox escape ... runs as root in the defau..."}
  - {claim_id: a87245c212, verdict: ok, source_url: "https://github.com/BerriAI/litellm/security/advisories/GHSA-wxxx-gvqv-xp7p", passage: "Reaching the endpoint requires a proxy-admin credential in default configurations; workaround block POST /guardrails/test_custom_code at your reverse proxy; Obsidian: v1.83.14-stable closes the ent..."}
