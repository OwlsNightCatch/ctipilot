  - {claim_id: 4ed7de9707, verdict: ok, source_url: "https://thehackernews.com/2026/06/litellm-vulnerability-chain-lets-low.html", passage: "LiteLLM is a widely deployed open-source AI gateway that brokers calls to more than 100 model providers behind one OpenAI-compatible interface."}
