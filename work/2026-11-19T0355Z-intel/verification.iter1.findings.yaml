  summary: 'The cited sources give interim measures for the rest: Xint 3.3.2 (fixed upstream group instead of request-time DNS lookups for CVE-2026-123634), 3.3.3 (remove QUIC listeners and http3 for CVE-2026-121810), 3.3.4 (bind or firewall the mail listeners for CVE-2026-113425); CERT.at: ''Als Mitigation fuer CVE-2026-113425 empfiehlt F5, die Mail-Listener auf vertrauenswuerdige Netzwerke zu beschraenken''; F5''s CNA workarounds for CVE-2026-123634 (''Avoid using SSI or mirror directives ...'') and CVE-2026-113425 (''Restrict listeners to trusted networks''). A reader who cannot patch is told only about two of five.'
