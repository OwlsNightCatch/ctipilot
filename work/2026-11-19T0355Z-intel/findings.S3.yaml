      Blackpoint's Adversary Pursuit Group assesses with high confidence that the previously unnamed RAT delivered through the ROMULUS ClickFix platform (Huntress, 2026-09-28; Forescout Vedere Labs, 2026-10-15) is CNCMachineRMS, the family LevelBlue SpiderLabs documented in August as the payload of a BabaDeda chain, on a matching payload hash, family-specific strings and storage structures. The recovered chain: an obfuscated PowerShell stager fetches an MSI (decimal-notation IP in the URL), strips the Mark of the Web and runs it silently through msiexec.exe; the MSI masquerades as a Stardock tool, hides itself from the installed-programs list and launches a signed Stardock executable whose companion library has been altered to import a malicious DLL; that DLL reads a payload hidden inside the compressed data of a System.Net.Http NuGet package entry, decodes about 341 KB of shellcode with a position-dependent XOR and runs it through the EnumSystemCodePagesW callback. Persistence is a Run key plus a scheduled task, and the RAT adds persistent remote access, surveillance, reconnaissance and further payload execution; Blackpoint saw no post-exploitation. The ROMULUS platform also delivers LegionLoader through a separate chain. Blackpoint says the findings support shared tooling across the BabaDeda and ROMULUS ecosystems but do not establish a shared operator, and assesses that delivery platforms of this kind will keep being offered over the next 12 months.
    region_nexus: "global; no victim region named"
    primary_sector_nexus: "indirect: business and MSP environments (Blackpoint); ClickFix lures reach any office worker"
    sector: "cross-sector"
    cves: []
    techniques: [T1204.002, T1059.001, T1218.007, T1574.001, T1620, T1547.001, T1053.005, T1071.004, T1036.005]
    affected_products: ["Stardock (abused signed installer components)", "Microsoft Windows Installer"]
    entity_keys: ["malware:cncmachinerms"]
    new_entities:
