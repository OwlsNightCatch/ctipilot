    relation_suggestions:
      - { subject: "campaign:romulus-clickfix-delivery-platform-2026", object: "malware:cncmachinerms", basis: "Blackpoint APG assesses with high confidence the unnamed RAT delivered through the ROMULUS Stardock chain is CNCMachineRMS (matching payload hash, strings and storage structures)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "A family-naming and chain-linking contribution on commodity ClickFix delivery; no victim, sector or post-exploitation, and the Huntress and Forescout chains it builds on are not in the cited sources of this run. Kept for the behavioural detection list (PowerShell to msiexec with MotW removal, ARPSYSTEMCOMPONENT-hidden installs, sideloading from user-writable paths, non-browser DoH)."
    evidence:
      - quote: "Blackpoint’s APG assesses with high confidence that the unnamed RAT delivered through the ROMULUS Stardock chain is CNCMachineRMS."
        attribution: "Blackpoint Cyber Adversary Pursuit Group"
        source_url: "https://blackpointcyber.com/blog/romulus-cncmachinerms/"
      - quote: "Defenders should prioritize recurring behaviors, including PowerShell to MSI execution, dependency sideloading from user-writable paths, combined Run Key and scheduled task persistence, and non-browser DNS over HTTPS traffic."
        attribution: "Blackpoint Cyber Adversary Pursuit Group"
        source_url: "https://blackpointcyber.com/blog/romulus-cncmachinerms/"
    extended_notes: |
      Blackpoint states the linkage "does not establish a shared or connected operator" between BabaDeda and ROMULUS users; do not upgrade it. Techniques T1218.007 (msiexec), T1053.005 (scheduled task) and T1071.004 (DoH-based C2 is listed as a defender priority, not described as CNCMachineRMS's observed C2) should be checked against the composer's evidence before mirroring; drop T1071.004 if only the 'non-browser DoH' defender note supports it. Admiralty hint: B, credibility 2 (independent reverse engineering that agrees with LevelBlue's earlier family research).
