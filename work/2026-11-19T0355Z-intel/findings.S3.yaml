      FACT vs CLAIM. Facts (Kaspersky telemetry and reverse engineering): loader variants and dates (C in April, .NET in June, Rust in September 2026), command set, driver module behaviour, C2 discovery via GitHub, CloudFront C2 hosting. Claims: AuditTeam's leak-site victim list (a criminal claim; DeXpose and dbdigest are leak-site trackers, reliability C, and only establish that the group's brand exists since March 2026). Inference (Kaspersky): LLM-assisted development from uniform injection-command scaffolding and plaintext function names before hashing. Not stated: initial access vector, any Italian or Finnish victim's name or sector, dwell time.
