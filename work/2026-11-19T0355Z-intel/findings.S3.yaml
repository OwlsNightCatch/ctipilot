  - title: "CyberPower PowerPanel Business used as a SYSTEM remote shell on a domain controller: Symantec traces ntds.dit extraction and a side-loaded implant back to the UPS management service"
    sources:
      - { url: "https://www.security.com/threat-intelligence/power-management-software-attack-vector", publisher: "Symantec Threat Intelligence (security.com)", date: "2026-11-18", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-24-123-01", publisher: "CISA (ICSA-24-123-01, last revised 2025-08-12)", date: "2025-08-12", role: "corroborating" }
      - { url: "https://zuso.ai/advisory/za-2023-02", publisher: "ZUSO ART advisory ZA-2023-02 (CVE-2023-25132)", date: "2023-03-31", role: "corroborating" }
    discovery_trace: "first seen at: malware-news (slice record), feed https://malware.news/latest.rss?page=0..6 item 'Behind the Power Outage: Unmasking a New Intrusion Vector in Enterprise Infrastructure Tools', URL https://malware.news/t/behind-the-power-outage-unmasking-a-new-intrusion-vector-in-enterprise-infrastructure-tools/127416 (carries Article Link) → primary: Symantec, extract of https://www.security.com/threat-intelligence/power-management-software-attack-vector → pivot: Symantec's 'Public advisories' link, extract of https://zuso.ai/advisory/za-2023-02 → pivot: WebSearch ('CyberPower PowerPanel Business vulnerability hard-coded credentials default administrator password CVE advisory') → CISA ICS advisory, WebFetch of https://www.cisa.gov/news-events/ics-advisories/icsa-24-123-01"
    summary: |
      Symantec's Threat Intelligence team analysed an intrusion in which the attacker used CyberPower PowerPanel Business (PPB), UPS-management software installed on a Windows domain controller, as the execution channel. PPB has a documented event-action feature: a .cmd file placed in an extcmd folder is run by the PPB service (ppbed.exe, started by services.exe, running as SYSTEM) when a power event fires. The attacker placed their own scripts there through the product's web console (embedded Tomcat on TCP 3052, upload endpoint /local/rest/v1/file/upload), so every command carries ppbed.exe as its ancestor and no new service, scheduled task or memory-corruption exploit was needed. The scripts, named pp plus five random lowercase letters, were used as a general remote shell: certutil for reachability tests and decoding of staged base64 binaries, curl to pull tools, a PowerShell reflective load of a .NET assembly, and a .NET antivirus killer. For Active Directory theft the operator iterated several script versions until an ntdsutil "ifm" export of ntds.dit worked, then switched to esentutl /vss from a shadow copy plus a SYSTEM-hive save. A long-running implant (upnpcont.exe, a name of a Microsoft UPnP component, in a SYSTEM-profile AppData path) was then launched through the same channel and side-loads a DLL (atl.dll) from its own directory; its process tree leads back to ppbed.exe. Symantec has not attributed the activity, saw no exfiltration or final payload, and does not say how the console was reached; it points to public PPB advisories (hard-coded credentials, default administrator password, file-upload path traversal) or stolen administrator credentials. CISA's ICSA-24-123-01 independently documents hard-coded credentials, a hard-coded JWT signing key and a ZIP-import path traversal in PPB 4.9.0 and earlier (fixed in 4.10.1), and ZUSO's CVE-2023-25132 describes an unrestricted upload in default.cmd in PPB 4.8.6 and earlier; none of these is tied to the victim's version by any source.
    region_nexus: "global; no victim country or sector named by Symantec. UPS-management software of this class sits on domain controllers, hypervisors and file servers in small and mid-size public and private networks (cantonal and communal IT included)."
    primary_sector_nexus: "indirect: infrastructure-management software on privileged Windows servers is common in public-sector estates; no public-sector victim reported"
    sector: "cross-sector"
    cves: []
    techniques: [T1072, T1059.003, T1059.001, T1105, T1140, T1620, T1003.003, T1574.001, T1685]
    affected_products: ["CyberPower PowerPanel Business"]
    entity_keys: []
    new_entities:
      - { key: "incident:cyberpower-powerpanel-dc-intrusion-2026-11", type: incident, name: "CyberPower PowerPanel Business domain-controller intrusion (Symantec, 2026-11)", aliases: [], summary: "Intrusion in which an attacker used the PowerPanel Business UPS-management service (ppbed.exe, extcmd event scripts) as a SYSTEM execution channel on a Windows domain controller to extract ntds.dit and launch a DLL side-loaded implant; unattributed (Symantec, 2026-11-18)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "PPB can run a script (a .cmd file in an extcmd folder) when a power-related event such as a voltage sag or outage is detected."
        attribution: "Symantec Threat Intelligence (security.com)"
        source_url: "https://www.security.com/threat-intelligence/power-management-software-attack-vector"
      - quote: "The commands in this attack chain have ppbed.exe as their ancestor and run as SYSTEM."
        attribution: "Symantec Threat Intelligence (security.com)"
        source_url: "https://www.security.com/threat-intelligence/power-management-software-attack-vector"
      - quote: "While we have not attributed this activity to a known actor, the interactive development of a data collection script during the attack points to a threat actor with live-human presence at the keyboard."
        attribution: "Symantec Threat Intelligence (security.com)"
        source_url: "https://www.security.com/threat-intelligence/power-management-software-attack-vector"
      - quote: "If you find them, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation."
        attribution: "Symantec Threat Intelligence (security.com)"
        source_url: "https://www.security.com/threat-intelligence/power-management-software-attack-vector"
    extended_notes: |
      FACT vs CLAIM vs INFERENCE. Facts (Symantec's own telemetry): the scripts-in-extcmd execution path, the upload endpoint and port, the command set, the ntdsutil to esentutl pivot, the implant lineage back to ppbed.exe. Not stated by any source: the PPB version on the victim, the entry vector to the console, the sector or country of the victim, whether credentials were then used. Symantec's "no attribution, no exfiltration or ransomware seen" means the domain compromise is an access-stage observation, not a completed impact.
      EXPOSURE (vendor/source-documented): PPB web console on TCP 3052; Symantec's advice is to locate every PPB console instance and restrict 3052 to named administrator hosts, change the default administrator password and patch. CISA ICSA-24-123-01: PowerPanel Business 4.9.0 and prior affected, "Update to v4.10.1 or later version"; CISA records no public exploitation at its last revision (2025-08-12), which this intrusion post-dates. ZUSO ZA-2023-02: CVE-2023-25132 (default.cmd unrestricted upload, PPB for Windows/Linux/macOS 4.8.6 and earlier, CVSS 3.1 9.1 per ZUSO).
      DETECTION concept (telemetry class first): (1) process-creation with parent lineage: ppbed.exe spawning cmd.exe/powershell.exe that then runs certutil -urlcache/-decode, curl, ntdsutil, esentutl /vss, vssadmin create shadow, robocopy; Windows 4688 or Sysmon EID 1; (2) file-creation under the PPB install tree: script files appearing in ...\temp\profile\extcmd\ and Tomcat upload temp files in web-server\work\tomcat\localhost\local, names matching pp?????.cmd; (3) network: inbound requests to TCP 3052 from hosts other than named administrators, outbound connections from a DC to unfamiliar hosts after a PPB request; (4) a signed Microsoft-named binary (upnpcont.exe) running from a SYSTEM-profile AppData directory and loading an unsigned/unknown DLL from the same folder; (5) object-access auditing on ntds.dit and shadow-copy creation on a DC outside backup windows.
      POST-COMPROMISE CHECK: Symantec's own guidance: audit extcmd and temp\profile\extcmd on every PPB host against product defaults, treat unknown scripts as hostile, review the console's event-to-command assignments; if found, assume AD credentials exposed and plan krbtgt reset plus wider rotation.
      TRIAGE: benign lookalike is the product's intended behaviour: PPB launching scripts from extcmd on a power event looks like "a power-management product launching cmd.exe, which defenders may dismiss as a standard power-related recovery process" (Symantec). Discriminator that follows from the source: what the child commands do (certutil decode, ntdsutil, esentutl, PowerShell reflective load) and whether any power event preceded them, not that ppbed.exe is the parent.
      MITRE mapping notes: T1072 for the management-console script execution channel (Symantec likens PPB to RMM tools); T1620 for the in-memory .NET load; T1574.001 (DLL side-loading, successor of revoked T1574.002) for upnpcont.exe + atl.dll; T1685 (successor of revoked T1562.001) for the .NET antivirus killer wupd.exe that Symantec flags as a killav; T1003.003 for ntdsutil/esentutl. Admiralty hint: B (Symantec first-hand telemetry), credibility 2 (single-source for the intrusion; product weakness class is multi-source).
  - title: "tcherber: Cyderes finds an access broker's FortiGate and SonicWall VPN toolkit that tunnels in with default or guessed credentials and runs automated LDAP and SMB enumeration, with a live bot panel and ENIGMA Locker artifacts"
    sources:
      - { url: "https://www.cyderes.com/howler-cell/exposing-tcherber", publisher: "Cyderes Howler Cell", date: "2026-11-17", role: "primary" }
      - { url: "https://www.vmray.com/news/one-leftover-build-path-links-an-infostealer-a-remote-access-tool-and-a-ransomware-family/", publisher: "VMRay Labs", date: "2026-09-01", role: "corroborating" }
    discovery_trace: "first seen at: malware-news (slice record), feed https://malware.news/latest.rss?page=1..6 item 'Exposing tcherber: VPN Access Brokerage, Custom Malware, & C2 Panel', URL https://malware.news/t/exposing-tcherber-vpn-access-brokerage-custom-malware-c2-panel/127368 → primary: Cyderes Howler Cell (also a slice record cyderes-howler-cell), extract and raw url of https://www.cyderes.com/howler-cell/exposing-tcherber → pivot: Cyderes' own link to VMRay, extract (jina fallback) of https://www.vmray.com/news/one-leftover-build-path-links-an-infostealer-a-remote-access-tool-and-a-ransomware-family/"
    summary: |
      Cyderes' Howler Cell followed a Rust loader delivered as a fake Windows Update installer back, through a build-path string (/home/tcherber/) in the Rust binaries, to a Go toolkit, a credential database and operational logs of an initial access broker. The toolkit wraps OpenConnect (--protocol=fortinet) for FortiGate and NetExtender for SonicWall, brings the tunnel up, parses the routes and DNS servers the VPN hands out, then runs a NetExec-style LDAP enumeration of users, groups, domain structure and domain controllers, followed by SMB host and share enumeration and credential validation; the orchestrator runs this chain without operator input. The recovered master credential file holds more than 500 FortiGate VPN entries across multiple countries, a mix of default credentials (guest, admin, test) and organisation-specific passwords, which Cyderes reads as brute-force harvesting plus credential-dump sourcing; operational logs show successful root-level tunnels into multiple victim environments in May and June 2026, held for multi-hour sessions. Cyderes also reached an unauthenticated panel with 178 active bots and September 2026 builds, and found forum adverts for VPN access, custom C2, loader and crypting services with an explicit CIS exclusion, from which it assesses a combined access-broker and malware-as-a-service operation with Russian-language tooling. The loader chain adds a Rust stealer (browser, FTP, mail, VPN client, wallet and file theft, sent by Telegram and to the operator's backend), an HVNC implant with AMSI and ETW patching and a fodhelper UAC bypass, and an ENIGMA Locker ransomware build that kills processes and services, deletes shadow copies and clears event logs. VMRay Labs independently linked the same build path to Zer0day Stealer, an HVNC tool and ENIGMA Locker on 2026-09-01. Cyderes does not name victims, sectors or countries, and gives no CVE: the VPN access described rests on weak, default and reused credentials, not on a disclosed flaw.
    region_nexus: "global; credential database spans multiple unnamed countries; forum advert excludes CIS countries (Cyderes). No Swiss or EU victim named."
    primary_sector_nexus: "direct technology exposure: FortiGate and SonicWall SSL-VPN gateways are the standard remote-access layer in federal, cantonal and communal networks; no public-sector victim reported"
    sector: "cross-sector"
    cves: []
    techniques: [T1133, T1078.001, T1087.002, T1018, T1135, T1046, T1204.002, T1036.005, T1685, T1486]
    affected_products: ["Fortinet FortiGate (SSL VPN)", "SonicWall SSL VPN (NetExtender)"]
    entity_keys: ["product:fortinet-fortios", "product:sonicwall-ssl-vpn"]
    new_entities:
      - { key: "actor:tcherber", type: actor, name: "tcherber", aliases: [], summary: "Handle Cyderes Howler Cell derives from the /home/tcherber/ build path in Rust malware; assessed as an initial access broker and malware-as-a-service operator (FortiGate/SonicWall VPN access, Zer0day Stealer, Rust HVNC, ENIGMA Locker); VMRay independently linked the build path to the same families (Cyderes, 2026-11-17; VMRay, 2026-09-01)." }
      - { key: "malware:enigma-locker", type: malware, name: "ENIGMA Locker", aliases: ["ENIGMA"], summary: "Ransomware family (ChaCha12 file encryption with ECIES-wrapped key material, _README_ENIGMA.txt note, Run-key persistence with a watchdog) sharing a developer build path with Zer0day Stealer and an HVNC tool (Cyderes, 2026-11-17; VMRay, 2026-09-01)." }
      - { key: "malware:zer0day-stealer", type: malware, name: "Zer0day Stealer", aliases: ["Zer0day Framework"], summary: "Rust information stealer reporting to a backend Cyderes calls the Zer0day Framework, delivered by a fake Windows Update installer and a Rust loader; build path links it to the tcherber toolset (Cyderes, 2026-11-17; VMRay, 2026-09-01)." }
    relation_suggestions:
      - { subject: "actor:tcherber", object: "malware:zer0day-stealer", basis: "Cyderes: the /home/tcherber/ build path in the Rust stealer, HVNC and Enigma binaries is the pivot linking them to one developer; VMRay (2026-09-01) independently linked the path to the same stealer" }
      - { subject: "actor:tcherber", object: "malware:enigma-locker", basis: "Cyderes and VMRay both report the /home/tcherber/ build path inside the ENIGMA Locker ransomware" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "together with VPN connection records showing successful root-level network tunnels into multiple victim environments during May and June 2026"
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/exposing-tcherber"
      - quote: "Contains a mix of default credentials (guest:guest, admin:admin, test:test) and organization-specific passwords, indicating both brute-force harvesting and credential dump sourcing."
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/exposing-tcherber"
      - quote: "FortiGate VPN client wrapper using OpenConnect with --protocol=fortinet."
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/exposing-tcherber"
      - quote: "That path is the thread."
        attribution: "VMRay Labs"
        source_url: "https://www.vmray.com/news/one-leftover-build-path-links-an-infostealer-a-remote-access-tool-and-a-ransomware-family/"
    extended_notes: |
      FACT vs CLAIM vs INFERENCE. Facts (Cyderes reverse engineering of recovered files): toolkit file inventory and orchestration order; credential-file format; default-credential mix. Inferences (Cyderes, labelled): "brute-force harvesting and credential dump sourcing"; the operator is both an IAB and a MaaS seller (based on forum posts sharing a Tox contact and capability match with the toolkit); Russian-speaking operator (UI strings, CIS exclusion). VMRay corroborates only the build-path link between stealer, HVNC and ENIGMA Locker, not the VPN-brokerage activity. Cyderes does not say how the 500+ entries were obtained, whether any entry is still valid, or which victims were tunnelled into.
      EXPOSURE: any FortiGate or SonicWall SSL-VPN portal reachable from the internet that still accepts a local or reused account with a default or weak password (guest, admin, test) or without MFA; the toolkit takes ip:port:login:password lines, so non-standard ports do not help.
      DETECTION concept (telemetry class first; all derived from the recovered toolkit's behaviour): (1) VPN gateway authentication and session logs: successful logins for guest/admin/test or other local accounts, repeated reconnects at roughly 30-second intervals from one source (the wrapper's reconnect loop), OpenConnect or NetExtender-class clients where the fleet is Forticlient-only, long multi-hour sessions; (2) within about 20 seconds of a tunnel coming up, from the VPN-assigned address: route/DNS lookups followed by a full LDAP enumeration of users, groups, trusts and domain controllers (domain-controller LDAP query logging, Windows 4624 type 3 from the VPN pool), then SMB host/share enumeration (5140/5145) and credential validation across many hosts; (3) the delivery-side chain for the stealer: a fake Windows Update installer dropping scripts into C:\Users\Public, a Defender exclusion for that folder, a certutil decode of a certificate-looking file into svchost.exe, short-lived scheduled tasks and an HKCU Run value named SecurityHealth.
      HARDENING: retire local or default accounts on SSL-VPN, enforce MFA and certificate-based or SAML-backed identities, restrict management and portal exposure, alert on VPN-pool addresses that enumerate LDAP broadly.
      TRIAGE: legitimate VPN users also reconnect and may run OpenConnect on Linux workstations; the discriminators the source supports are the account (default/guest/test), the immediate LDAP and SMB sweep from the VPN address, and the absence of a normal client posture. Admiralty hint: B (Cyderes first-hand reverse engineering), credibility 2 (VMRay corroborates the malware link; the brokerage activity is single-source).
  - title: "UAT-12643: Talos finds a Go RAT that reads its C2 from Solana transaction memos, pairs it with LOLBin loaders and survives a Windows 'Reset this PC' through WinRE OEM scripts"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/", publisher: "Cisco Talos", date: "2026-11-18", role: "primary" }
      - { url: "https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/", publisher: "Cisco Talos", date: "2026-11-18", role: "primary" }
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/dont-fear-repo-unkdeaddrop-phishing-campaign-targets-developers-steal", publisher: "Proofpoint", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "first seen at: talos (standing lab check), feed https://blog.talosintelligence.com/rss/ items of 2026-11-18 (UAT-12643 and 'The challenge of defending against bulletproof dead drops on public blockchains') → primary: Talos, extract of both post URLs → pivot: Talos' own link to the Overlord/UNK_DeadDrop reporting, extract of https://www.proofpoint.com/us/blog/threat-insight/dont-fear-repo-unkdeaddrop-phishing-campaign-targets-developers-steal (confirms Overlord is an open-source Go C2 framework)"
    summary: |
      Cisco Talos found an exposed staging server of a financially motivated cluster it tracks as UAT-12643 and assesses, with low confidence, as North Korea-aligned on TTP overlap. Delivery is by three loader types whose own delivery to victims Talos did not observe: LNK files posing as PDFs that download with the signed Windows Defender utility MpCmdRun.exe -DownloadFile or with certutil -urlcache, a JavaScript HTA run by mshta.exe that writes to %TEMP% through ADODB.Stream, and an MSBuild project with an inline C# task compiled in memory. The payloads are the Go modular Overlord RAT (35 commands: keylogging, webcam and audio capture, file operations, reverse SOCKS pivot, reflective plugin loading), a public Python stealer (Good Game) and a multi-currency clipboard hijacker. Overlord discovers its WebSocket C2 by walking a wallet's Solana transaction history and decrypting the one memo of exactly 43 characters, so the operator re-points every implant with one transaction and no domain takedown helps. The RAT also sets itself critical with NtSetInformationProcess (ProcessBreakOnTermination) so killing it bluescreens the host, and persists in an HKCU Run value and in WinRE: it writes a randomly named payload and a batch file to the Recovery\OEM folder and patches ResetConfig.xml, so a Reset this PC runs it before the OS is restored. Stolen archives go to a file-sharing service and a Discord webhook posts the victim fingerprint. Victimology is inferred from the stealer's keyword harvesting (English, French, Spanish, Portuguese file names), the lures (finance statements, Viber and softphone installers) and crypto/gaming themes: Talos says Europe is potentially targeted and does not name a victim. A companion Talos post argues that blockchain dead drops (Bitcoin, EVM contracts via EtherHiding, TRON, Solana memo) defeat domain blocklists and sinkholing and recommends monitoring outbound JSON-RPC and endpoint memory instead. Proofpoint documented Overlord, an open-source Go C2 framework, in an earlier developer-targeting campaign (UNK_DeadDrop, 2026-06-05).
    region_nexus: "Europe potentially (Talos: file-name keywords in English, French, Spanish, Portuguese); no named victim country"
    primary_sector_nexus: "indirect: finance/accounting staff and VoIP softphone operators named as lure targets; techniques (MpCmdRun/certutil/MSBuild/mshta loaders, WinRE persistence, blockchain C2) transfer to any Windows estate"
    sector: "finance"
    cves: []
    techniques: [T1204.002, T1218.005, T1127.001, T1105, T1547.001, T1102.001, T1071.001, T1567.002, T1567.004, T1555.003, T1056.001, T1113, T1090, T1620, T1497.001]
    affected_products: ["Microsoft Windows", "Microsoft Defender Antivirus (MpCmdRun.exe abused)", "Windows Recovery Environment"]
    entity_keys: ["tool:overlord-rat", "campaign:unk-deaddrop-2026"]
    new_entities:
      - { key: "actor:uat-12643", type: actor, name: "UAT-12643", aliases: [], summary: "Cisco Talos designation for a financially motivated cluster using the Overlord RAT with Solana-memo C2, LOLBin loaders and the Good Game stealer, assessed with low confidence as North Korea-aligned (Talos, 2026-11-18)." }
      - { key: "tool:good-game-stealer", type: tool, name: "Good Game stealer", aliases: ["GoodGame"], summary: "Public Python infostealer (version 1.1.2, PyInstaller-packed) harvesting browser, Discord, Roblox, wallet and game-launcher data and keyword-filtered documents; used by UAT-12643 (Cisco Talos, 2026-11-18)." }
    relation_suggestions:
      - { subject: "actor:uat-12643", object: "tool:overlord-rat", basis: "Talos: UAT-12643 uses the Overlord RAT as one of its payloads, with a Solana-memo C2 resilience routine" }
      - { subject: "actor:uat-12643", object: "campaign:unk-deaddrop-2026", basis: "Talos notes UNK_DeadDrop employed the Overlord RAT in earlier campaigns (Proofpoint, June 2026) as one of the TTP overlaps behind its low-confidence North Korea-aligned assessment; an overlap, not an attribution" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Constituency nexus is weak: financially motivated, crypto/gaming/VoIP-themed lures, Europe only 'potentially' and by keyword inference. Kept because the tradecraft is transferable and detection-relevant (WinRE OEM persistence that survives device reset, Solana-memo dead-drop C2 that domain blocklists cannot reach, signed-binary LNK loaders)."
    evidence:
      - quote: "The Overlord RAT implements a command-and-control (C2) resilience technique in which encrypted server URLs are embedded in Solana blockchain transaction memos."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "Talos assesses with low confidence that UAT-12643 is a North Korea-aligned advanced persistent threat (APT) actor"
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "ensuring the implant survives a full system reset."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "Modern cybersecurity requires a fundamental shift away from static domain blocklists toward monitoring anomalous outbound JSON-RPC traffic, analyzing endpoint memory, and treating blockchain infrastructure as an active threat communication channel."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/"
    extended_notes: |
      FACT vs INFERENCE. Facts (Talos reverse engineering of an exposed server): loader types, the 43-character memo filter, Recovery\OEM and ResetConfig.xml handling, ProcessBreakOnTermination, exfiltration via file-sharing upload plus webhook. Inferences (Talos, labelled): low-confidence North Korea-aligned; potential European targeting; target verticals from lure names. Talos did not observe how the initial files reach victims.
      DETECTION concept (telemetry class first): (1) process creation with parent lineage: MpCmdRun.exe with -DownloadFile launched from a user shortcut, certutil -urlcache -f from an LNK, mshta.exe spawning scripting-host downloads, msbuild.exe compiling an inline task from a user-writable path with a BITS-impersonating user agent in the proxy log; (2) registry/file artifacts: modification of ResetConfig.xml and new files under Recovery\OEM on an end-user device, an HKCU Run value pointing into the user's AppData Network folder, a binary named RuntimeBroker.exe outside System32; (3) network: workstation processes issuing JSON-RPC calls (getSignatures/getTransaction for Solana, eth_call for EVM) to public blockchain RPC endpoints, and outbound uploads to a file-sharing site followed by a Discord webhook post; (4) a process holding SeDebugPrivilege that calls NtSetInformationProcess to mark itself critical, visible as an unexplained CRITICAL_PROCESS_DIED stop code.
      HARDENING: block or alert on MpCmdRun.exe -DownloadFile and certutil -urlcache from non-admin contexts; constrain mshta.exe and msbuild.exe for standard users (WDAC/AppLocker); treat WinRE configuration as monitored state and re-image rather than 'reset' a suspect device.
      TRIAGE: certutil, MSBuild and MpCmdRun are legitimate admin tools; the discriminator is user-level shortcut parentage plus an external download to a user-writable path. Legitimate blockchain RPC traffic is expected from crypto-related business apps only. Admiralty hint: B, credibility 2 (Talos first-hand; Overlord framework and port reuse corroborated by Proofpoint; attribution is low-confidence).
