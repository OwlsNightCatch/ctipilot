  - title: "Hostile Inference: ZDI chains Docker Desktop's unauthenticated Model Runner API into host file writes and code execution on macOS and Windows; fixed in Docker Desktop 4.61.0 and later"
    sources:
      - { url: "https://www.thezdi.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes", publisher: "Zero Day Initiative", date: "2026-11-18", role: "primary" }
    discovery_trace: "first seen at: malware-news (slice record), feed https://malware.news/latest.rss?page=0 item 'Hostile Inference: Exploiting Docker Model Runner for Container Escapes', URL https://malware.news/t/hostile-inference-exploiting-docker-model-runner-for-container-escapes/127445 → WebSearch ('\"Hostile Inference\" Exploiting Docker Model Runner for Container Escapes zerodayinitiative.com blog', no primary found) → primary: ZDI blog Squarespace feed https://www.zerodayinitiative.com/blog/?format=rss (item link on thezdi.com, published 2026-11-18 17:23 UTC), extract of https://www.thezdi.com/blog/2026/11/17/hostile-inference-exploiting-docker-model-runner-for-container-escapes"
    summary: |
      Zero Day Initiative describes a container-to-host chain in Docker Desktop for macOS and Windows built around Docker Model Runner (DMR), the local-model feature. DMR's REST API is unauthenticated and reachable from any container at its internal DNS name; its /engines/_configure endpoint appends caller-supplied runtime flags to the llama.cpp server command line (ZDI-26-150 / CVE-2026-28400, reported 2025-11-05, Docker confirmed the fix 2026-03-03). Because on macOS and Windows the inference process runs on the host as a child of the Docker Backend with the user's privileges, inside a Seatbelt (macOS) or Job Object (Windows) sandbox, the argument injection gives host file read and write, ZDI shows how to control the written content through log output, and the payoff is arbitrary host code execution through Docker Extensions. By default a stock container can only corrupt the Docker Desktop VM data disk (a denial of service on macOS); code execution needs non-default configurations. ZDI adds a macOS Seatbelt sandbox escape (ZDI-26-451, public advisory 2026-07-23, fixed by a tightened profile merged 2026-02-27) and a WSL2 VM-to-host pivot through Docker Extensions (ZDI-26-258) that abuses the backend socket to toggle the marketplace-only extensions flag from inside the VM. Per ZDI, Docker Desktop users received the fixed DMR in version 4.61.0 and later. No exploitation in the wild is reported.
