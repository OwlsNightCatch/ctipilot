  vendor_channel_results:
  - 'Not applicable: no CVE and no vendor advisory; the access rests on credentials. Neither Fortinet nor SonicWall statements
    were sought (Cyderes names no CVE, no FortiOS version, no MFA discussion: verified by grep).'
  facts:
    vulnerable_component_and_path: No vulnerability. Credential-based access to internet-facing FortiGate (OpenConnect --protocol=fortinet
      wrapper forti_vpn.go) and SonicWall (NetExtender wrapper sonik.go) SSL-VPN portals using ip:port:login:password lists.
    prerequisites:
      auth_state: valid VPN credentials (local or reused accounts, default guest/admin/test mix and organisation-specific
        passwords per Cyderes)
      exposure: portal reachable from the internet; non-standard ports do not help (list carries the port)
      mfa: Cyderes says nothing about MFA (absence verified)
    affected_and_fixed: Not applicable (no CVE, no versions in Cyderes).
    cvss: Not applicable.
    exploitation_status: 'Cyderes (2026-11-17): operational logs show successful root-level VPN tunnels into multiple victim
      organisations during May and June 2026, held for multi-hour sessions; live unauthenticated C2 panel with 178 bots and
      September 2026 builds; assessed Russian-speaking IAB + MaaS operation ongoing as of September 2026. Victims, sectors,
      countries not named. How the toolkit/credential file was exposed is not stated (OSINT pivot on the handle across threat-intel
      platforms and code repositories). Attribution evidence: build path /home/tcherber/ in Rust (and Go module path) artefacts,
      shared Tox contact in forum adverts, Russian-language tooling; Cyderes itself notes it cannot say whether one machine
      or several share the username. VMRay (2026-09-01) independently linked the path to Zer0day Stealer, an HVNC tool ("likely"
      same developer) and ENIGMA Locker; VMRay says nothing about VPN brokerage.'
    telemetry_for_detection:
    - 'VPN gateway authentication/session logs: successful logins for guest/admin/test or other local accounts; reconnect
      loop roughly every 30 s from one source (FortiGate wrapper); NetExtender-class client against SonicWall with exponential
      backoff to 5 minutes; OpenConnect client against a FortiGate (Cyderes tool descriptions).'
    - 'After tunnel establishment: a 20 s stabilisation wait, then route/DNS parsing and an LDAP enumeration of users, groups,
      domain structure and domain controllers from the VPN-assigned address (orchestrator chain); SMB host/share enumeration,
      credential validation (NetExec-style) and port scanning are manual operator tools (Cyderes) - hunt them but do not assume
      they are automatic.'
    - 'Endpoint delivery chain (separate from the VPN access): fake Windows Update installer dropping setup.ps1/run.bat to
      C:\Users\Public, short-lived scheduled tasks (S0, MU), Defender exclusion for C:\Users\Public, certutil decode of a
      certificate-like file into svchost.exe, HKCU Run value SecurityHealth; HVNC with AMSI/ETW RET patch, fodhelper UAC bypass;
      ENIGMA Locker shadow-copy deletion and event-log clearing.'
    triage_benign_lookalike: 'Mechanism-derived only (Cyderes gives none): legitimate VPN users also reconnect and some run
      OpenConnect; the source-supported discriminators are the account (default/guest/test), a broad LDAP sweep from the VPN
      pool address within seconds of tunnel establishment, and (for manual follow-up) SMB share enumeration from that address.
      Omit as a firm Triage line unless the composer labels it as mechanism-derived.'
    post_patch_compromise_checks: No patch applies. Cyderes recommends VPN credential audits across FortiGate and SonicWall
      appliances; a credential-list hit implies review of sessions from May-June 2026 onward (Cyderes dates the activity)
      - inference, not stated.
    mitigations: 'Cyderes: prioritise VPN credential audits. Retiring local/default accounts and enforcing MFA are analyst
      hardening levers (not stated in the source).'
