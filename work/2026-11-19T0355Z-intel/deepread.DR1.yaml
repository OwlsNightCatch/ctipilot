  vendor_channel_results:
  - 'REDCap release notes/advisory live in REDCap Community, which is open only to registered REDCap administrators ("A login
    is required to access Community."): not readable. The only vendor statement obtained is relayed in the Unit 42 file: REDCap
    says it released an update within two days of learning of the flaw in September.'
  facts:
    vulnerable_component_and_path: 'Five chained defects (Securifera): (1) public survey handler __passthru validated in two
      decoded forms, double-encoded value reaches the root index.php dispatcher with attacker-chosen route; (2) project user-rights
      object built before respondent identity exists, undefined SUPER_USER treated as super-user so the public context gets
      data_import_tool (DataImportController:index) and the POST CSRF check is skipped because NOAUTH is defined; (3) Data
      Import commit path trusts POST[fname] as a local path or PHP stream; (4) CSV byte-order-mark cleanup writes changed
      bytes back to the same stream, turning a php://filter chain into a controlled file overwrite; (5) predictable worker-writable
      BladeOne compiled-template cache under APP_PATH_TEMP/cache (deterministic .bladec for view parcel.show) is included
      as PHP via the public ParcelController:show route. CWE-94 and CWE-73 (CNA, KEV).'
    prerequisites:
      auth_state: none (no account, project membership, session, role or CSRF token)
      exposure: a REDCap server reachable from the attacker with a valid public survey hash (hash is shared for participant
        recruitment; SentinelOne aggregator says "often shared broadly" - aggregator, not used)
      version: 13.3.0 and higher (CNA); REDCap source is distributed to consortium members only (Securifera used a leaked
        copy)
    affected_and_fixed:
      affected: 'CNA: REDCap 13.3.0 and higher, no stated upper bound; defaultStatus unknown; no per-branch matrix for 14.x/15.x/16.0.x/17.x.'
      fixed_per_CNA: '16.0.49 (LTS), 17.3.10 (LTS), 17.4.4 (Standard) - CNA versions list marks each "unaffected"; CNA solution:
        "Upgrade to REDCap 16.0.49 LTS, 17.3.10 LTS, or 17.4.4 Standard Release, as applicable."'
      last_affected_builds_per_aggregator: 'pentest-tools (2026-10-23): through 16.0.48 LTS, 17.3.9 LTS and 17.4.3 Standard
        (aggregator, consistent with the CNA fixed builds)'
      vendor_release_notes: 'login-only (not read); vendor update date implied by Unit 42-relayed REDCap statement: September
        2026, within two days of notification'
      EOL_branches: 'CNA names no end-of-life branch; any REDCap installation older than the three fixed builds and not on
        LTS 16.0.x/17.3.x or Standard 17.4.x has no stated fix: upgrade to a listed build.'
    cvss_as_stated_by_cna: CVSS 3.1 9.8 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (Securifera CNA); no CVSS 4.0
      in the record. EPSS in EUVD 3.75 (scale as printed; OpenCVE reads 3%).
    cisa_catalog_wording:
      vulnerabilityName: Vanderbilt University Research Electronic Data Capture (REDCap) Code Injection Vulnerability
      shortDescription: Vanderbilt University Research Electronic Data Capture (REDCap) contains a code injection vulnerability
        which could allow an unauthenticated attacker to execute arbitrary code on the server. An attacker could exploit this
        via crafted HTTP requests that access an unintended controller route from a public survey context and supply a crafted
        file-path or stream parameter during data import processing. Exploitation requires knowledge of a valid public survey
        hash.
      dateAdded: '2026-11-18'
      dueDate: '2026-11-21'
      knownRansomwareCampaignUse: Unknown
      forensicTriage: 'Yes'
      cwes:
      - CWE-73
      - CWE-94
      alert_clause: '"...based on evidence of active exploitation" (CISA alert 2026-11-18; the alert page itself states no
        due date; the KEV record does)'
      cisa_adp_ssvc: Exploitation active, Automatable yes, Technical Impact total (timestamp 2026-11-18T20:42:19Z)
    exploitation_status: 'CONFIRMED ITW. CISA KEV addition 2026-11-18 (no actor/victim detail). NEW: Palo Alto Networks Unit
      42 timely-threat-intel file dated 2026-10-07 states "Attackers are actively exploiting CVE-2026-90817": unauthenticated
      POST to a public survey URL with a double-encoded __passthru and route=DataImportController:index, transient Blade-template
      web shell under temp/cache, in-memory bash cradle, payload disguised as a JPEG, XMRig (Monero) miner, >=4 live workers;
      no actor named; REDCap vendor statement relayed. CVE-2026-90817 is NOT tied to UNC6508 by any source read. PoC: Securifera
      repository public since 2026-10-01; Securifera blog 2026-09-27 gives full technique; pentest-tools shows a Nuclei detection
      and a second PoC repository.'
    telemetry_for_detection:
    - 'Web access logs (POST to /surveys/ URLs): query string carrying __passthru with a double-percent-encoded index.php
      (e.g. %2569ndex.php) and a route parameter naming DataImportController (Unit 42 request shape; legitimate passthrough
      only allows PdfController:index per Securifera) plus a POST field fname carrying a php:// stream URI (Securifera mechanism).'
    - 'File-integrity records on the REDCap temp/cache directory: a .bladec compiled template rewritten outside normal view
      compile (Securifera, Unit 42); leftover uploads with a .php.csv suffix in the web temp directory (Securifera).'
    - 'Process creation with parent lineage: php-fpm/web server worker spawning bash/sh with a Base64 cradle, curl/wget-style
      downloads piped to bash, binaries run via exec -a with syslog-themed names (Unit 42).'
    - 'Persistence artefacts: new crontab entries, appended authorized_keys entries across user profiles, modified ~/.profile,
      HISTFILE unset / bash history purged (Unit 42). A clean Blade cache does not prove no exploitation (Securifera PoC self-cleans).'
    triage_benign_lookalike: 'Mechanism-supported only: public survey requests do not legitimately name DataImportController
      or carry an index.php passthrough (only PdfController:index is intended) and do not carry php:// URIs in fname; any
      survey request that does is the exploit shape. No benign lookalike is documented by the sources.'
    post_patch_compromise_checks: 'Source-stated persistence to hunt after upgrading: crontabs, ~/.profile, authorized_keys
      for all users, leftover miner staging directories and processes, cleared history (Unit 42). CISA KEV record sets forensicTriage
      Yes (CISA forensic-triage requirements under BOD 26-04 apply to federal agencies). SecurityWeek/GTIG legacy-version
      side-by-side concern (from earlier finding) was NOT re-read here.'
    mitigations: 'Upgrade to a CNA-listed build. No vendor workaround read. Aggregators (OpenCVE, SentinelOne) suggest restricting/disabling
      public surveys or WAF rules: not vendor statements, SentinelOne page is a generic AI-style summary and misdescribes
      the mechanism, leads only.'
