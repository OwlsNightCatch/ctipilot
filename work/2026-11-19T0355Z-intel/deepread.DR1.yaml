  vendor_channel_results:
  - 'CyberPower product page states the feature: "External Command Scripts - This function allows user-programmable command
    executions to customize event action based on individual needs." No CyberPower advisory about this intrusion or about
    extcmd hardening was found; Symantec does not say CyberPower was notified. No CVE exists for the abuse itself: it is the
    documented feature.'
  facts:
    vulnerable_component_and_path: 'Not a memory-corruption bug: abuse of the PowerPanel Business (PPB) event-action "command
      file" feature. A .cmd file placed in the extcmd folder of the PPB install (staged first in ...\CyberPower PowerPanel
      Business\temp\profile\extcmd\) is run with cmd /c by the PPB service ppbed.exe (starts under services.exe, runs as S-1-5-18
      SYSTEM) when the event action fires; the attacker pushed scripts through the PPB web console (embedded Tomcat, TCP 3052,
      REST endpoint /local/rest/v1/file/upload, uploads pass through web-server\work\tomcat\localhost\local) and used them
      as a remote shell.'
    prerequisites:
      auth_state: 'console access required; how the attacker obtained it is NOT established. Symantec: public PPB advisories
        (hard-coded credentials, default administrator password, file-upload path traversal) "or stolen administrator credentials"
        could provide the access.'
      exposure: 'PPB console reachable on TCP 3052 from the attacker position (Symantec: do not expose to internet, other
        servers or user networks); PPB typically sits on hypervisors, database/file servers and domain controllers'
      version: 'victim PPB version NOT stated by Symantec (grep: no version number in body)'
    affected_and_fixed:
      this_intrusion: no version given; no CVE tied to it by any source
      related_documented_weaknesses: 'CISA ICSA-24-123-01 (Claroty): PowerPanel Business 4.9.0 and prior affected (hard-coded
        password CVE-2024-34025, hard-coded JWT key CVE-2024-33625, ZIP import path traversal CVE-2024-33615 and others),
        CyberPower fix: update to v4.10.1 or later. ZUSO ZA-2023-02: CVE-2023-25132 default.cmd unrestricted upload, PPB for
        Windows/Linux/macOS v4.8.6 and earlier.'
      fixed: v4.10.1 or later for the 2024 CISA set (per CISA); ZUSO lists mitigations as vendor download pages only
      EOL_branches: not stated by any source
    cvss_as_stated: None for the abused feature. CISA ICSA-24-123-01 (CVSS v3 9.8 / v4 9.3 for CVE-2024-34025, -33625, -32053,
      -32047; 8.8/8.7 for path traversal and SQL injection) and ZUSO CVE-2023-25132 (vector printed 3.1 AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H
      9.1; the page labels the row "CVSS 4.0 Base" but the vector is 3.1) are context only.
    exploitation_status: 'In-the-wild intrusion analysed by Symantec (published 2026-11-18): hands-on-keyboard operator; ntds.dit
      extracted via ntdsutil ifm then esentutl /vss; side-loaded implant. Unattributed; no exfiltration or ransomware seen;
      intrusion date, victim sector and country not stated. CISA ICS advisory (last revised 2025-08-12) said no public exploitation
      reported for the 2024 CVEs; this Symantec report post-dates it.'
    telemetry_for_detection:
    - 'Process creation with parent lineage (Windows 4688 / Sysmon EID 1 style): ppbed.exe -> cmd.exe -> {certutil -urlcache/-decode,
      curl, powershell -ep bypass reflective load, ntdsutil ifm, esentutl /vss, vssadmin create shadow, robocopy, netstat};
      implant chain ppbed.exe -> cmd.exe -> powershell.exe -> upnpcont.exe; collection children vssadmin.exe <- powershell.exe
      <- upnpcont.exe <- powershell.exe <- cmd.exe <- ppbed.exe <- services.exe (Symantec).'
    - 'File creation under the PPB install tree: pp?????.cmd (pp + five random lowercase letters) in temp\profile\extcmd and
      extcmd; Tomcat upload_<random>.tmp in web-server\work\tomcat\localhost\local (Symantec).'
    - 'Network: inbound requests to TCP 3052 /local/rest/v1/file/upload from hosts other than named administrators (Symantec
      endpoint, recommendation to restrict 3052).'
    - 'DLL side-loading shape: a Microsoft-UPnP-named executable (upnpcont.exe) in a SYSTEM-profile AppData path loading an
      unknown atl.dll from its own folder (Symantec).'
    - 'AD collection artefacts: ntds.dit export directory from ntdsutil ifm, SYSTEM hive save, esentutl copy from a shadow
      copy, new shadow copy on a DC outside backup windows (Symantec describes the commands).'
    triage_benign_lookalike: 'Source-supported: the process tree looks like a power-management product launching cmd.exe,
      which "defenders may dismiss as a standard power-related recovery process" (Symantec). Discriminators Symantec supports:
      scripts in extcmd that differ from product defaults, script names pp+5 letters, children that run certutil/ntdsutil/esentutl/PowerShell
      rather than a shutdown or notification routine, and no power event preceding them (Symantec: the attacker "did not use
      their access for triggering actions from power events"). The last point is a mechanism observation for this incident,
      not a general rule.'
    post_patch_compromise_checks: 'Symantec: audit extcmd and temp\profile\extcmd on every PPB host against product defaults,
      treat unknown scripts as hostile, review the console event-to-command assignments; if found, assume AD credentials exposed
      and plan a krbtgt reset and wider credential rotation. Patching PPB does not remove already-staged scripts or the implant.'
    mitigations: Restrict TCP 3052 to named administrator hosts; change the default administrator password; patch; treat power-management
      software as high-value assets with unique credentials and process-level monitoring (Symantec).
