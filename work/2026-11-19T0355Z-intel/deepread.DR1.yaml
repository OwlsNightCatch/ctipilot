  vendor_channel_results:
  - 'Project channel: the original home was CodePlex (retired). The CNA/Mandiant reference https://codeplexarchive.org/project/AntiCSRF;
    fetched, it returns only a basic-auth challenge ("the site now requires a basic authentication") - the page says nothing
    about the project. I did not use the credentials the page prints. The Wayback copy cited by Mandiant could not be read
    (WebFetch refuses web.archive.org; direct GET: connection reset). Probes of nuget.org/packages/Idunno.AntiCsrf and github.com/blowdart/AntiCSRF
    returned 404 (guessed URLs, not citable, and they only show those locations do not exist). A NuGet package named "AntiCSRF"
    1.0.1 (HMAC-based, 2017) is a different, unrelated project; not linked to Idunno by any source.'
  - 'Maintainer/patch status: the only statement is Mandiant (CNA): "has no active maintainer or official patch available".
    No maintainer notice, repository or registry page was reachable that says otherwise or confirms.'
  facts:
    vulnerable_component_and_path: 'Idunno.AntiCsrf.dll 0.9.1.0 / 0.9.1 Beta, class Idunno.AntiCsrf.AntiCsrfModule (IHttpModule),
      event PreRequestHandlerExecute: for any System.Web.UI.Page handler not implementing ISuppressCsrfCheck / [SuppressCsrfCheck],
      once the CSRF cookie and the CSRF form field are both non-empty the module runs new ObjectStateFormatter().Deserialize(Request.Form[formFieldName])
      before comparing to the cookie. Parameterless ObjectStateFormatter = no MAC/signature/encryption/machineKey, no binder.
      Defaults: cookie __CSRFCOOKIE, field __CSRFTOKEN (detectionResult RaiseException). Runs after the pipeline-level AuthenticateRequest/AuthorizeRequest
      stages (pages protected by pipeline authorization reject anonymous requests earlier) but before IHttpHandler.ProcessRequest
      and the Page lifecycle (Page_Load), so anonymously reachable .aspx pages and pages that enforce session checks inside
      Page_Load are exposed; the page needs no <form runat="server">. CWE-502.'
    prerequisites:
      auth_state: 'none for anonymously reachable pages: single POST, any non-empty cookie value, no valid CSRF token (pipeline-level
        authorization that denies anonymous requests earlier in the ASP.NET pipeline blocks it)'
      configuration: application registers the module in httpModules/modules (or bin holds the DLL), including internally
        recompiled copies; page handler must be a System.Web.UI.Page without the suppress opt-out
      exposure: any anonymously reachable .aspx page, or any page relying on session checks inside Page_Load
    affected_and_fixed:
      affected: 'CNA: <= 0.9.1.0 and <= 0.9.1 Beta; defaultStatus affected; Mandiant: only public builds are 0.9.1.0 official
        2008 build and rebuilds of the CodePlex 0.9.1 Beta source'
      fixed: NONE. No vendor/maintainer patch; project defunct since December 2008 (Mandiant). The only remediation is removal
        and replacement.
      EOL_branches: every version is unfixed (single abandoned release line).
    cvss_as_stated_by_cna: 'CVSS 4.0 9.3 CRITICAL CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:A (CVSS-BT:
      base plus threat metric E:A, exploitMaturity ATTACKED). No 3.1 score. EPSS 0.0 in EUVD at publication.'
    exploitation_status: 'Mandiant (CNA, with Mandiant IR/Google FLARE root-cause during an incident response on 2026-11-04)
      states: "Active exploitation in the wild has been observed." Advisory published 2026-11-18; CVE record 2026-11-19T01:29Z.
      No actor, victim count, date range or post-exploitation chain given. CONFLICT in the record set: CISA-ADP vulnrichment
      SSVC at 2026-11-19T01:39:42Z says Exploitation "none" (Automatable yes, Technical Impact total), the CNA text and E:A
      say attacked; the CNA short description does not itself mention exploitation. Not in CISA KEV (2026.11.18 catalogue).
      As-of 2026-11-19 ~05:00Z; single exploitation observer is Mandiant.'
    telemetry_for_detection:
    - 'IIS logs: POST to .aspx endpoints returning HTTP 302 or HTTP 500 with elevated cs-bytes (where logged) (Mandiant).
      The module raises its CSRF error right after the sink: 302 (redirect/customErrors) or 500 (customErrors Off).'
    - 'Request shape: CSRF cookie present with a non-GUID value (module only checks non-empty on this path) and an oversized
      Base64 CSRF form field (legitimate field is a serialized GUID string per the module) - mechanism-derived.'
    - 'Process creation with parent w3wp.exe (shells, scripting hosts, downloaders) on the IIS host: code runs in the w3wp.exe
      context (Mandiant).'
    - 'Config/inventory: Web.config httpModules/modules and bin for Idunno.AntiCsrf / AntiCsrfModule by name, not by file
      hash (Mandiant).'
    triage_benign_lookalike: 'Mechanism-derived (Mandiant describes how legitimate tokens are generated): a legitimate POST
      carries the module-issued GUID cookie and a short serialized-GUID form field; a long Base64 .NET-serialized blob with
      a non-GUID cookie is the abnormal shape. 302/500 responses on .aspx POSTs also occur for ordinary CSRF-check failures,
      so the discriminator is request-size/token shape plus w3wp child processes, not the status code. This is an inference
      from the mechanism, not an observed signature.'
    post_patch_compromise_checks: 'No patch exists. Mandiant: environments with evidence of exploitation should rotate all
      secrets in Web.config and applicationHost.config (machineKey keys, encryption keys, database credentials) and inspect
      webroots for unauthorized files.'
    mitigations: Remove the module registrations, the csrfSettings section/element, code references to ISuppressCsrfCheck/[SuppressCsrfCheck]
      and the DLL; replace with System.Web.Helpers.AntiForgery, Page.ViewStateUserKey with MAC-verified/encrypted ViewState,
      or ASP.NET Core IAntiforgery (Mandiant).
