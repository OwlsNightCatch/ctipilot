    reporter.go; nmap.go, netexec_scaner.go (credential validation), smb_info.go and sonik.go are "not called by the orchestrator
    and are intended for manual use by the operator".'
  - 'S3 says the LDAP enumeration covers "users, groups, trusts and domain controllers": Cyderes lists "users, groups, domain
    structure, domain controllers"; "trusts" is not in the source.'
  - 'S3: "the VPN access described rests on weak, default and reused credentials, not on a disclosed flaw": Cyderes gives
    no CVE and infers "brute-force harvesting and credential dump sourcing"; however the relayed forum advert also claims
    an "exploit toolkit" for FortiGate/Cisco/Citrix access. Treat "no flaw" as "no flaw identified by Cyderes", not as established.'
  - 'S3: "500+ entries" and "guest, admin, test" confirmed; Cyderes does not say how many entries are valid or still valid
