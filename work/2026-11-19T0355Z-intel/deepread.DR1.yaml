  facts:
    vulnerable_component_and_path:
      CVE-2026-123007: 'ngx_http_v2_module, HTTP/2 connection send_window (h2c->send_window, size_t). ngx_http_v2_filter_cleanup()
        refunds queued-DATA credit to the connection window without an upper-bound check; a later WINDOW_UPDATE check in ngx_http_v2_state_window_update()
        underflows (unsigned), the counter reaches a value that converts to a negative off_t length in ngx_http_v2_send_chain(),
        ngx_http_v2_filter_get_shadow() makes last < pos, and ngx_ssl_send_chain() memcpy copies a huge count: OOB read/write
        on the worker heap (CWE-191 then CWE-787 per CNA). Source: Rapid7, Xint, CNA.'
      CVE-2026-123633: 'ngx_http_v2_module: an HTTP/2 connection with an active stream stays in the reusable-connection queue
        (set while a HEADERS frame is incomplete); when worker_connections runs low and a proxied request opens an upstream
        connection, ngx_drain_connections() closes that very connection and frees the request pool, then upstream code continues
        on freed memory (CWE-416). Source: Xint, Wiz, CNA.'
      CVE-2026-123634: 'nginx resolver (ngx_resolver.c waiting list): a handler frees another resolver context of the same
        request (mirror/SSI subrequest resolving the same proxy_pass name) while the list walk still holds it; CWE-416. Needs
        resolver + request-derived proxy_pass + mirror/SSI. Source: Xint, CNA.'
      CVE-2026-121810: 'ngx_http_v3_module (QUIC): parent QUIC connection re-queued as reusable during stream creation; the
        request upstream connect then frees its own request (CWE-416). Source: Xint, CNA.'
      CVE-2026-113425: 'ngx_mail_proxy_module (mail proxy, auth_http lookup): client connection closed while the auth_http
        connection still points at the freed session (CWE-416). Source: Xint, CNA.'
    prerequisites:
      auth_state: 'None for all five (CNA: remote unauthenticated; Xint lab for 113425: "Authentication None").'
      configuration: '123007: HTTP/2 enabled on a listener (static files suffice, Wiz). 123633: HTTP/2 + proxying to an upstream
        + worker nearly out of worker_connections. 123634: resolver + request-derived proxy_pass + SSI or mirror subrequest.
        121810: HTTP/3/QUIC + requests forwarded to an upstream. 113425: mail proxy with auth_http. F5 text for every CVE:
        no control-plane exposure; data plane only.'
      memory_safety_conditions: 'Code execution (vs worker crash/restart) needs ASLR disabled or bypassed (F5 CNA). Wiz and
        Xint demonstrated ASLR bypass via the bug itself. Rapid7 PoC additionally needs ~128 GB of HTTP/2 traffic, x86-64
        glibc EVEX/YMM memcpy (avx512f+avx512vl) and fails behind a proxy or on a long-lived/busy worker (Rapid7 README/blog).
        Execution context: nginx worker, not master/root (Rapid7).'
    affected_and_fixed:
      NGINX Open Source mainline 1.31.x: affected 1.31.0 to 1.31.8; fixed 1.31.9 (nginx.org CHANGES 18 Nov 2026; nginx.org
        advisories; F5 CNA lessThan 1.31.9).
      NGINX Open Source stable 1.30.x: affected 1.30.0 to 1.30.6; fixed 1.30.7 (nginx.org CHANGES-1.30 18 Nov 2026; CNA lessThan
        1.30.7).
      NGINX Open Source older branches (<1.30.0, i.e. 1.29.x and earlier): 'inside the nginx.org "Vulnerable" ranges (first
        affected per CVE: 123007 1.9.5; 123633 1.19.7; 123634 0.6.18; 121810 1.25.0; 113425 0.5.33). NO fix exists on those
        branches; the only fixed lines are 1.31.9+ and 1.30.7+. F5 states versions past End of Technical Support are not evaluated.
        Distribution packages may backport (nginx -v does not show it, Xint).'
      NGINX Plus 37.x: '123007/123634/121810/113425 (F5 CNA): 37.1.0 to <37.3.0.1 -> 37.3.0.1; 37.0.0 to <37.0.8.1 -> 37.0.8.1.
        123633 (F5 CNA): 37.1.0.1 to <37.2.0.1 and 37.0.0.1 to <37.0.7.1, so 37.2.0.1 and 37.0.7.1 already fix 123633 but
        remain affected by the other four. Rapid7 and CERT.at agree for 123007 (fixed 37.3.0.1/37.0.8.1; 37.2.0.1/37.0.7.1
        still affected).'
      NGINX Plus R-releases: 'F5 CNA lists R33 as affected with no fixed build (lessThan *) for all five; Rapid7: R34-R36
        None; CERT-EU: R34, R35, R36 also affected; CERT.at: R34-R36 for four CVEs and R33 only for 113425; "no updates available
        for R33 to R36" (CERT.at). Treat R33-R36 as unfixed; upgrade to a fixed 37.x.'
      Not evaluated: 'F5 Distributed Cloud and NGINX One Console: CERT.at says F5 has not yet clarified (not re-verified;
        F5 pages unreadable).'
    cvss_as_stated_by_cna:
      F5 CNA (identical for all five): CVSS 3.1 8.1 CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H; CVSS 4.0 9.2 CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N
      discoverer_difference: Rapid7 prints the CVSS 4.0 vector for 123007 with AT:P (score still 9.2). nginx.org grades only
        123007 and 113425 "major" (and 118899) and 123633/123634/121810 "medium"; nginx CHANGES words 123007 as "segmentation
        fault in a worker process, or might have potential other impact". CERT-EU and CERT.at cite 3.1 8.1; NCSC-NL cites
        v4 9.2.
    exploitation_status: 'As of 2026-11-19 ~05:00Z: no source reports exploitation. CERT-EU (2026-11-18): "no exploitation
      in the wild has been reported yet". NCSC.ch hub 13203 (2026-11-18): "UNKNOWN, Proof-of-Concept Available". Rapid7 PoC
      for 123007 public since 2026-11-18 (lab Docker only); Wiz withheld its exploits; Xint withheld final steps. Not in CISA
      KEV (catalogVersion 2026.11.18 released 2026-11-18T19:17:41Z; grep of cveID for all five = 0). NCSC-NL predicts large-scale
      exploitation once PoC code is public (prediction, not observation). Precedent (context only, different CVE): CVE-2026-42945
      was exploited within days in May 2026 per VulnCheck via Help Net Security.'
    telemetry_for_detection:
    - 'Process creation / Linux audit execve+execveat where euid = nginx worker UID (parent = nginx worker): a worker never
      legitimately spawns programs (Xint auditd rule, key nginx_worker_exec). This is the only clear sign of successful code
      execution.'
    - 'nginx error log "worker process ... exited on signal" (signal 11) and core dumps: marks failed attempts (CERT-EU, Xint);
      weak signal.'
    - 'Network flow / socket statistics on the HTTP/2 TLS port: one long-lived connection from one source with fast-growing
      bytes_received and small bytes_sent plus many short TLS connections from the same source; WINDOW_UPDATE/RST_STREAM are
      encrypted and not logged as requests, so compare logged request_length per $connection with bytes_received (Xint log_format
      with $connection, $connection_requests).'
    - 'Wiz: rules on long-standing HTTP/2 connections sending large amounts of data.'
    triage_benign_lookalike: 'Source-supported discriminators only: an inbound-heavy long connection can be a legitimate large
      upload (Xint: "such as a large upload"); worker crashes occur for unrelated reasons (Xint); any one weak signal has
      a normal cause, a program started by a worker does not. Rapid7: its PoC likely fails on a busy worker, so absence of
      the full 128 GB pattern does not clear a host. No honest discriminator for crash-only events beyond correlation.'
    post_patch_compromise_checks: Install then RESTART nginx or complete a live binary upgrade (reload does not replace the
      running executable); close old workers still in "worker process is shutting down" after a mitigation reload (Xint).
      The audit rule only records after installation; an empty result cannot rule out earlier compromise (Xint). No source
      documents persistence artefacts.
    mitigations: '123007+123633: http2 off / remove http2 from listen (blocks only these two; breaks native gRPC) (Xint, CERT-EU,
      NCSC.ch). 123634: avoid SSI/mirror and variable proxied server names (F5 CNA workaround); fixed upstream instead of
      request-derived proxy_pass (Xint). 121810: remove QUIC listeners/http3 off (Xint; F5 names none per CERT.at). 113425:
      restrict mail listeners to trusted networks (F5 CNA workaround).'
    chain_not_in_the_wild: 'Xint lab chain: nginx worker code execution + separate Linux kernel SCTP use-after-free (introduced
      v4.15, unpatched at publication) = root on host and Docker escape. Mitigation named by Xint: block sctp module load
      on hosts that do not use SCTP.'
