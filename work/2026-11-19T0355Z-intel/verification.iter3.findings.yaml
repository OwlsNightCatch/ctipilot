- code: F4
  category: hallucinated-fact
  section: entries/2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc (body Defender takeaway, Triage, actions[0])
  item: "CyberPower PowerPanel Business as a SYSTEM script channel on a domain controller"
  url_or_quote: "Defender takeaway: 'where the audit finds a deviation, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation'; Triage: 'scripts that differ from the product defaults, children that are not shutdown or notification routines and the absence of a preceding power event separate it from benign use'; actions[0]: 'where the techniques Symantec lists are found (children of ppbed.exe that are not shutdown or notification routines with no preceding power event, ...)'"
  summary: "Residual of iteration 2 F4 #3: only actions[0] was changed. Symantec ties the reset to its own techniques and indicators ('Review the techniques and indicators in this document. If you find them, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation') and says 'Treat any unknown scripts as hostile' for the audit. The body takeaway still triggers the krbtgt reset on an audit 'deviation', the Triage line still calls a deviation from product defaults a benign/malicious discriminator although the vendor page lists 'External Command Scripts ... user-programmable command executions' as a normal feature, and the action presents 'children of ppbed.exe that are not shutdown or notification routines with no preceding power event' as a technique Symantec lists (it is the entry's own filter). Align the takeaway with Symantec's trigger and drop or relabel the entry-derived filter."
