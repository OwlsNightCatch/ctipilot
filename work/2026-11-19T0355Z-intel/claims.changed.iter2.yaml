  - claim_id: 9722ced2b8
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five unauthenticated memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to code execution with the privileges of the worker process; NCSC.ch, NCSC-NL and Rapid7 score them CVSS 4.0 9.2. The fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, while NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings."
  - claim_id: 295c9fe4c0
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Rapid7 published a working proof of concept for CVE-2026-123007 against nginx 1.31.8 in a Linux x86-64 container; the exploit needs about 128 GB of HTTP/2 traffic and likely fails with several concurrent clients ("
    urls: ["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", "https://github.com/sfewer-r7/CVE-2026-123007"]
  - claim_id: a5e43793aa
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Rapid7 says execution has the worker's permissions and that execution as the master process or root is not established, Wiz says ASLR does not protect against these flaws because attackers can use them to read memory before executing code, and Wiz withholds its exploits ("
    urls: ["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities"]
  - claim_id: 929f2fddc2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update and restart nginx, because a configuration reload does not replace the running executable; disabling HTTP/2 on exposed listeners blocks only the two HTTP/2 flaws, and Xint gives interim measures for the others: a fixed upstream group in place of request-time DNS lookups for CVE-2026-123634, no QUIC listeners for CVE-2026-121810 and bound or firewalled mail listeners for CVE-2026-113425 ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 629d272dc8
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
