    kind: cited
    text: "Scripts placed in the product's extcmd folder, named pp followed by five random lowercase letters and staged first under temp\\profile\\extcmd, are run by the PPB service ppbed.exe as SYSTEM, so the commands of the chain have ppbed.exe as their ancestor and the lineage runs ppbed.exe, cmd.exe, powershell.exe and then the implant ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
