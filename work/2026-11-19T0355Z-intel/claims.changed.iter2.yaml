    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
    surface: "actions[0]"
    kind: frontmatter
    text: "On every host that runs CyberPower PowerPanel Business, domain controllers first, compare the extcmd and temp\\\\profile\\\\extcmd folders with the product defaults and look for scripts that differ from the product defaults and for children of ppbed.exe that are not shutdown or notification routines with no preceding power event; where either is found, assume Active Directory credentials are exposed and plan a krbtgt reset and wider credential rotation, because Symantec saw this channel used to export ntds.dit from a domain controller."
  - claim_id: c88a16d08d
