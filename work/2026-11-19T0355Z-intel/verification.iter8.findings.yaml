  section: entries/2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce (update section 2026-11-19T05:03:07Z)
  item: "Java4Shell update section, new Tenable sentence"
  url_or_quote: "so hosts on those distributions have no vendor build yet"
  summary: "(low confidence) The clause follows 'Debian had fixed only its unstable branch'; Tenable says 'As of November 18, Red Hat and Ubuntu had not released fixes, and Debian had fixed only its unstable branch', so a Debian unstable host does have a vendor build and the gloss is broader than the page. Reword to 'no stable-branch vendor build' or drop the 'so' clause. Every other part of the sentence (Red Hat, Ubuntu, Debian, Keycloak -XX:-UseBASE64Intrinsics, images 26.8.2-1 and 26.8.2-2) matches the Tenable page."
