  category: editorial-advisory
  section: entries/2026-11-19/tcherber-access-broker-fortigate-sonicwall-vpn-ldap-sweep (scope)
  item: "tcherber entry scope"
  url_or_quote: "https://www.cyderes.com/howler-cell/exposing-tcherber"
  summary: "(low confidence) The entry covers only the VPN access-brokerage toolkit. The same Cyderes report also describes the operator's Rust loader, stealer, HVNC implant, Enigma encryptor and a C2 panel showing 178 bots with 'the actor's infrastructure remains active'; the entry reaches them only through the VMRay sentence and the entity link. A scope choice the main agent may leave; if widened, one sentence naming the follow-on payload classes and the live panel would tell a responder what follows a VPN foothold from this broker."
- code: F11
  category: editorial-advisory
  section: entries/2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws (sourcing_note)
  item: "nginx sourcing_note wording"
  url_or_quote: "CERT-EU quotes CVSS 3.1 8.1 for the flaws ... CERT-EU, Rapid7 and CERT.at give R34 to R36 for them"
  summary: "(low confidence) The CERT-EU page says 'with a CVSS score of 8.1' and never names the scale (3.1 comes from CERT.at and the CNA record), and Rapid7's remediation table covers CVE-2026-123007 only ('NGINX Plus | R34 - R36 | None'), not 'them' (CVE-2026-123633 as well). Harmless to the recorded values; drop '3.1' or attribute it to CERT.at, and say Rapid7 for CVE-2026-123007."
