    entry: 2026-11-19/redcap-cve-2026-90817-unauth-survey-rce-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Securifera disclosed CVE-2026-90817 on 2026-09-20, a five-step chain in Vanderbilt's REDCap research-data platform that turns a request to a public survey into code execution on the server without authentication, given a valid public survey hash (CVSS 3.1 9.8). Unit 42 reported it exploited on 2026-10-07 to install Monero miners behind a transient web shell, with cron, SSH-key and shell-profile persistence, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-18. The fixed builds are 16.0.49 LTS, 17.3.10 LTS and 17.4.4 Standard."
  - claim_id: c9bbedfb41
    entry: 2026-11-19/idunno-anticsrf-cve-2026-131914-exploited-no-patch-w3wp-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Search every ASP.NET WebForms application's Web.config and bin directory for Idunno.AntiCsrf by name, not by file hash because recompiled copies keep the flaw, and remove the module and its DLL, replacing it with a supported anti-forgery mechanism; on any server with evidence of exploitation, such as IIS requests to .aspx pages that returned 302 or 500 with unusually large request sizes, rotate the machineKey, encryption keys and database credentials in Web.config and applicationHost.config, because Mandiant observed exploitation and no patch exists."
