    surface: "body"
    kind: cited
    text: "Symantec does not say how the attacker reached the console; public advisories or stolen administrator credentials could give that access, and it names no actor, victim sector or product version ("
    urls: ["https://www.security.com/threat-intelligence/power-management-software-attack-vector"]
  - claim_id: 99bb1976df
    entry: 2026-11-19/cyberpower-powerpanel-business-system-shell-on-dc
