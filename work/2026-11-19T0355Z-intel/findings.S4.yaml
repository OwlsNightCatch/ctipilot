  - title: "Wellington IT (credit-union platform supplier, Ireland and Northern Ireland): an authorization flaw abused by one automated client with a valid member login, five million requests on 2026-10-02 to 04, saved-payee records retrieved, request logs missing, credit unions told six weeks later"
    sources:
