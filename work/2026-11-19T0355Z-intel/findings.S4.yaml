    summary: |
      Police statement (2026-11-17): the administration of the municipality of Neuried is the target of a cyberattack; unknown actors gained unauthorised access to parts of the IT infrastructure; after the disruption on the morning of Tuesday 2026-11-17 the municipality took its IT systems completely offline and filed a criminal complaint that afternoon; the actors left a message in files of the administration network asking to be contacted; the Kripo secures traces and checks whether data was stolen; the public prosecutor is involved. dpa on 2026-11-18, quoting the municipality: e-mail can be neither sent nor received, the website was off for a time and is back, internal systems stay offline, mayor Tobias Uhrich calls it an extortion attempt and says the municipality made no contact with the criminals, data was restored and there has been no data loss so far, whether data was copied or stolen is still being examined, and the administration hopes to use its systems normally again by Friday 2026-11-20. No source names an actor, a ransomware family, the access vector or an IT service provider, and none says the data was encrypted.
