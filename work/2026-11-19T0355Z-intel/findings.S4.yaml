    summary: |
      Facts from TfL's statement, as reproduced by three outlets that trace to the same TfL release (one independent origin): on 2026-11-16 TfL became aware that Oyster photocard customers were receiving e-mails asking them to create an account although they already had one; AOL UK adds that the e-mails originated from TfL's own system but were generated as a result of the compromise. TfL took the photocard website offline (it stays offline, so online applications and renewals are suspended), now believes about 265,000 photocard customers may have had account details compromised, and says its current assessment is that no passwords, bank or payment card details, journey information, or names and dates of birth of children with a Zip Oyster card were taken; it advises all photocard customers to change password and security question and answer, and has told the ICO. The affected accounts are Zip Oyster (ages 5 to 16+), 18+ Student, 18-25 Care Leaver, 60+ London, Apprentice and Veterans photocards, so the population includes minors, care leavers and veterans. TfL's e-mail to customers lists name, e-mail, phone, home address, date of birth and security question and answer as compromised. No vector or actor is stated, and no source ties this to TfL's September 2024 intrusion (the registry holds incident:tfl-scattered-spider-2024). Defender-side reading, not stated by TfL: the first signal was customers noticing legitimate-looking enrolment e-mails sent by the authority's own system, so unexpected volume of a transactional-mail template (account creation, reset) and customer reports are an early-warning telemetry class for citizen portals.
