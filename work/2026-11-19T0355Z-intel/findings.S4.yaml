    discovery_trace: "first seen at: bleepingcomputer, feed (python3 tools/fetch_source.py feed https://www.bleepingcomputer.com/feed/ 20), item URL https://www.bleepingcomputer.com/news/security/data-breach-impacts-40-irish-credit-unions-in-reported-it-provider-hack/ -> pivot: RTE URL https://www.rte.ie/news/2026/1118/1599645-credit-union-data-breach-assessed/ and https://www.rte.ie/news/business/2026/1117/1599594-supected-data-breach-at-credit-unions/ -> pivot: Irish Examiner URL https://www.irishexaminer.com/news/arid-41938989.html (reads the supplier's notice) -> primary customer notice: Capital Credit Union URL https://capitalcu.ie/important-information-for-members-cybersecurity-incident/ (gov.ie statement page not readable, extract failed)"
    summary: |
      Facts from Wellington IT's own correspondence as relayed by the Irish Examiner, and from a customer notice by Capital Credit Union: the Belfast supplier, whose online-banking platform serves about 50 credit unions (43 in Ireland), told customers on Monday 2026-11-16 that an automated script made five million requests that exploited an "authorisation flaw" on its platform between 2 and 4 October, using a valid member login, and retrieved saved-payee records (payee name, IBAN and BIC, sort code, payment reference, in a limited number of cases an address); member balances, accounts and login credentials were not retrieved. The flaw was closed on 6 October. The supplier's first investigation concluded "no exposure"; its engineers revised that on Sunday 2026-11-15; the logs that would show which records were requested are not available, so every saved payee in the period is treated as affected. The supplier says a credit union told it on the previous Friday that extortion e-mails had been sent to it and several others, which had been filtered to junk mail and not seen by the supplier before. Reported by RTE: the DPC received roughly 40 breach notifications and the Central Bank is engaged; Minister of State Robert Troy called the delay in informing credit unions a major concern and "not acceptable" (BleepingComputer). No actor is named. Defender-side reading, not stated by the sources: the observable signal was one session issuing millions of requests against record-retrieval endpoints, which request-level logging would have shown and which the missing logs prevented the supplier from scoping.
