self_evolution_notes:
  - "WebSearch standard mode returned stale or generic pages for the Swiss cantonal-incident queries; the same query in extended mode, naming the canton plus two unique features of the event (Notruf, Entwarnung), surfaced the day's reports (swissinfo/Keystone-SDA, Bajour, OnlineReports, Prime News, 20 Minuten, watson) and then the baselland.ch permalink. For home-region incident discovery, use inside-it-ch RSS as the lead and extended-mode in-language searches to reach the primaries."
  - "baselland.ch: the press-release listing answers 403 on extract and WebFetch, but a press-release permalink found through search resolves with `extract`; recipe for the canton's own releases is search for the permalink, then extract."
  - "The jina reader pool is exhausted (every key HTTP 402, anonymous tier 401), so hosts that block direct extract (cnil.fr 503, tfl.gov.uk 403, databreaches.net article pages 403) have no working transport this fire."
  - "ransomware.live /country/CH rows can be mis-tagged (the 2026-11-15 row 'Clinica Suiza Lab' is a Peruvian clinic); check the victim before counting a Swiss claim."
