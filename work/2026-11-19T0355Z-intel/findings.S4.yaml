    summary: |
      Facts as stated by the canton: since Sunday 2026-11-15 the IT infrastructure of the Basel-Landschaft cantonal administration has been the target of several cyberattacks (Landeskanzlei press release, morning of 2026-11-18). The cyber sub-staff (Teilstab Cybersicherheit) of the cantonal command staff is deployed and has isolated individual servers from the internet, so outages in cantonal digital applications are possible. An evening update, relayed by Keystone-SDA, says the attacks affect about 20 cantonal applications (for example the since-replaced tax calculator), all run on six servers that are being reinstalled; the police, ambulance and fire organisations (BORS) confirmed their IT systems were never affected. Overnight into 2026-11-18 Alertswiss warned that 112, 117 and 118 might be limited; the warning was lifted within hours. Government spokesman Nic Kaufmann says the numbers were reachable at all times and the warning was a precaution because it was unclear whether more servers would have to be isolated and whether telephony would be touched; Bajour adds that alternative numbers were published through Alertswiss in case the regular ones failed. One outlet (Basler Zeitung) wrote that the police emergency numbers were disturbed by technical problems, which contradicts the canton's account. What no source states: the initial-access vector, the actor, whether data was stolen or encrypted, or any ransom demand; Bajour quotes the Landeskanzlei that it is still unclear who is behind the attacks. OnlineReports notes that no link is established to the 2026-10-21 precautionary shutdown of Basel-Stadt cantonal websites after PHP vulnerabilities. Observable response pattern for defenders: network isolation of the servers that host the affected applications followed by a clean reinstall of those servers (host rebuild, not clean-up), and publication of alternative emergency numbers through the national alerting channel as a continuity measure while administrative telephony was in doubt.
