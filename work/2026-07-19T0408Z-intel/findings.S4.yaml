  - title: "[BORDERLINE] Unconfirmed dark-web claim of a 2.1M-line SFR (French telecom) internal-tool data extraction — contradicts an SFR statement that appears to be recycled from a December 2025 breach"
    sources:
      - { url: "https://www.cyberattaque.org/sfr-21-millions-de-clients-fibre-en-fuite-apres-lacces-a-un-outil-interne/", publisher: "Cyberattaque.org", date: "2026-07-17", role: "primary" }
      - { url: "https://www.dpo-partage.fr/fuite-de-donnees-sfr-et-la-vague-de-juillet-2026/", publisher: "DPO Partage (RGPD/DPO advisory blog)", date: "2026-07-18", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"SFR fuite de données juillet 2026 revendication piratage\") -> Cyberattaque.org, URL https://www.cyberattaque.org/sfr-21-millions-de-clients-fibre-en-fuite-apres-lacces-a-un-outil-interne/ -> corroborating (status check, same unconfirmed claim, one day later): DPO Partage, URL https://www.dpo-partage.fr/fuite-de-donnees-sfr-et-la-vague-de-juillet-2026/"
    summary: |
      An actor claimed on 2026-07-17 to have extracted ~2,104,093 rows from SFR's internal fixed-line operations tool "NOVA" (customer identity, precise address/geolocation down to building/floor/staircase, phone numbers, fiber/box technical metadata including MAC addresses and optical-network topology). The claim states extraction began 2026-06-30 and was interrupted by SFR's monitoring before completion; no passwords or banking data are claimed. As of the freshest source found (2026-07-18), this remains an UNCONFIRMED leak-site-style claim — "Au 17 juillet 2026, il s'agit d'une revendication... Le volume annoncé et l'authenticité complète des données restent à vérifier" (DPO Partage, 2026-07-18). CAUTION: an initial WebSearch synthesis reported "SFR confirmed" the breach using a quote ("un accès non autorisé a récemment affecté un outil informatique utilisé pour gérer les interventions...") that on verification traces to a DIFFERENT, earlier SFR breach disclosure from December 2025 (ChannelNews, 2025-12-18, itself SFR's third breach disclosed within 2025) — i.e. a likely recycled-quote/aggregator conflation, not a same-day SFR confirmation of the NOVA claim. No SFR statement specific to the July 2026 NOVA claim was located. Neither claim nor any SFR statement about it appears in prior_coverage.json.
