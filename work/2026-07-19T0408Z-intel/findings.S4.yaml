  - title: "Ernst & Young discloses breach of a third-party IT support-ticket platform used by its tax practice, exposing client tax and financial documents"
    sources:
      - { url: "https://oag.ca.gov/ecrime/databreach/reports/sb24-626542", publisher: "California Office of the Attorney General (breach-notification filing)", date: "2026-07-15", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/", publisher: "BleepingComputer", date: "2026-07-17", role: "primary" }
      - { url: "https://cyberinsider.com/ey-says-client-tax-data-exposed-in-third-party-it-software-breach/", publisher: "CyberInsider", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/ -> pivot: WebSearch (\"California Attorney General breach notification Ernst Young Ernst LLP July 2026\") -> primary: California OAG breach-notification record, URL https://oag.ca.gov/ecrime/databreach/reports/sb24-626542 (confirmed correct record by matching breach dates 03/28/2026-04/23/2026 and filing date 07/15/2026 against the CA OAG master list at https://oag.ca.gov/privacy/databreach/list; note an earlier, unrelated 2023 EY/CA-OAG record (sb24-587852) was initially surfaced by search and discarded as a recycled-news false match before the correct 2026 record was confirmed)"
    summary: |
      Ernst & Young LLP (EY), one of the "Big Four" accounting/audit/tax/consulting networks (406,000 employees, $53.2B global revenue, operations in 150+ countries including a large Swiss and EU audit/tax practice), filed a breach notification with the California and Vermont Attorneys General on 2026-07-15 (notification letters dated 2026-07-13). EY states it detected anomalous activity on a third-party IT service-management (ITSM) platform used by its tax practice on 2026-04-23, and determined via an external forensics firm that an unauthorized third party had accessed the platform between 2026-03-28 and 2026-04-12 (a roughly two-week dwell window, discovered ~6 weeks after the intrusion ended) and downloaded documents belonging to multiple tax clients. The platform is used to manage IT support tickets for tax-engagement work; tickets submitted through it may carry attached documents containing client personal and financial information used to prepare tax filings (per a Vermont AG filing, potentially including Social Security numbers and financial-account/payment-card details). EY has not disclosed the initial access vector, named the compromised third-party platform, stated how many individuals are affected, or said whether non-US clients are impacted. No extortion or ransomware group has claimed the intrusion as of publication. EY is offering 24 months of Experian identity-monitoring/restoration to affected individuals (enrollment deadline 2026-10-31).
      Transferable lesson: sensitive client documents routinely accumulate as attachments inside third-party SaaS/ITSM support-ticket systems used by IT-support staff — a data-exposure surface that DLP and data-classification programs frequently miss because the platform is neither the primary case-management system nor customer-facing. Any organization (including public-sector bodies) that outsources IT helpdesk/ticketing to a third-party platform should inventory what sensitive attachments flow through support tickets and apply the same access-governance and retention controls as the primary systems those tickets reference.
    region_nexus: "EY is a global Big Four network with a substantial Swiss and EU audit/tax/consulting practice; this specific breach notification was filed with US state regulators (California, Vermont) and the disclosed scope is not stated to be US-only or global — EY has not said whether non-US clients are affected"
