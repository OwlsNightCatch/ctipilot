  - title: "Abbott's second, disputed cyber incident: a LabCentral customer-portal breach via compromised customer credentials and API-endpoint exfiltration"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/", publisher: "BleepingComputer", date: "2026-07-17", role: "primary" }
      - { url: "https://finance.yahoo.com/healthcare/articles/abbott-investigates-two-separate-cyber-230207385.html", publisher: "Reuters (via Yahoo Finance)", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/ -> corroborating: WebSearch (\"Abbott LabCentral portal breach data theft extortion\") -> Reuters wire via Yahoo Finance, URL https://finance.yahoo.com/healthcare/articles/abbott-investigates-two-separate-cyber-230207385.html"
    summary: |
      This is a delta on the existing entry about Abbott's confirmed Cancer Diagnostics/Exact Sciences incident (ShinyHunters, Entra ID SSO vishing) — BleepingComputer's 2026-07-17 follow-up reveals Abbott is investigating a SECOND, mechanically distinct incident. A threat actor calling itself "ShadowByt3$" told BleepingComputer it breached Abbott's Core Laboratory diagnostics business through the externally-facing LabCentral customer portal using compromised customer credentials, after identifying an unspecified "weak point" in the environment — i.e. valid-account abuse against a customer-facing portal, not the Entra SSO vishing chain used in the first incident. The actor claims initial access on 2026-07-04, followed by slow, automated exfiltration via the portal's API endpoints (rather than bulk document download) to evade detection. Claimed stolen data: CE manufacturing certificates, operating manuals, technical specifications, regulatory documentation, product-requirement archives, calibrator value assignments and assay files — the actor states no customer PII was taken. Abbott confirmed to BleepingComputer it is "aware of the 'potential' cyber incident" but disputes the actor's characterization, stating LabCentral "houses publicly available technical product reference documents... and does not contain proprietary/sensitive customer or business information." Neither this actor nor ShinyHunters has published any stolen data as of the source date. Registry cross-reference: the "ShadowByt3$" handle previously surfaced in this pipeline against Nintendo's third-party HR-survey SaaS TinyPulse (entity incident:nintendo-tinypulse-shadowbyt3, first_seen 2026-06-20) — same extortion handle, same modus operandi of targeting a third-party/externally-facing SaaS portal.
      Transferable lesson: customer-facing self-service portals (technical-documentation portals, partner extranets) are frequently treated as low-sensitivity because their primary content is "public" reference material — but they still sit behind an authenticated API surface reachable with compromised customer credentials, and slow/low-and-slow API-endpoint scraping (vs. bulk export) is a detection-evasion pattern worth a specific hunt (anomalous per-account API call volume/cadence against document-retrieval endpoints, not just bulk-download alerting).
    region_nexus: "Abbott is a global medtech/diagnostics manufacturer whose laboratory diagnostic systems are deployed in Swiss and EU hospital/clinical-lab estates"
