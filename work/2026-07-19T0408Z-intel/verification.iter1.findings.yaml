- code: F14
  category: quantifier-without-source
  section: incidents
  item: "Ernst & Young — third-party ITSM support-ticket platform breach"
  url_or_quote: "\"a roughly two-week dwell window discovered about six weeks after the intrusion ended\" / \"The ~6-week gap between the intruder losing access and EY detecting it\" / sourcing_note \"the ~6-week detection lag (detected 2026-04-23)\""
  summary: "Entry's own dates are access-ended 2026-04-12 and detected 2026-04-23 = ~11 days (~1.5 weeks). The '~6-week' gap appears 3x (sourcing_note, body para 1, Defender takeaway) and is unsupported; CyberInsider says detection came 'weeks later' / ~two-to-three weeks and BleepingComputer 'more than a week' after 04-12. Six weeks contradicts the entry's own arithmetic. Replace with ~11 days / ~1.5 weeks in all three places."
- code: F4
  category: hallucinated-fact
  section: incidents
  item: "ANCPI Romania cadastre cyberattack — ByteToBreach"
  url_or_quote: "body: \"Poland among the EU-member governments hit\"; summary: \"a documented history of hitting EU-member government bodies including Poland\""
  summary: "Cited source (KELA) describes Poland only as 'a bank in Poland' (private-sector financial institution) — 'Most of his leaks appeared legitimate... with some organizations, such as a bank in Poland, acknowledging the breaches.' KELA names only Romania (ANCPI) as an EU-member GOVERNMENT victim. The entry mischaracterises the Poland victim as a government body; no cited source supports 'Poland among the EU-member governments hit'. Reframe (e.g. cross-country victimology incl. a bank in Poland; ANCPI is the government registry hit)."
- code: F3
  category: claim-not-supported
  section: incidents
  item: "ANCPI Romania cadastre cyberattack — ByteToBreach"
  url_or_quote: "body: \"and to have deployed a ransomware variant and begun deleting available backups ([Help Net Security, 2026-07-16])\""
  summary: "The 'begun deleting available backups' clause is inline-cited only to Help Net Security, which does not state the attacker deleted backups (its only backup mention is ANCPI infra 'lacking adequate backup provisions' and backups as generic exfil targets). The claim IS supported by Public Record ('a inceput sa stearga backup-urile disponibile'), which the entry also cites. Repoint the inline citation for this clause to Public Record; sourcing_note likewise overstates that Help Net relays the backup-deletion claim."
- code: F3
  category: claim-not-supported
  section: incidents
  item: "ANCPI Romania cadastre cyberattack — ByteToBreach"
  url_or_quote: "body: \"Public Record's investigation additionally reports that ANCPI's contracted 'cybersecurity' vendor supplied only software licensing rather than active monitoring\""
  summary: "Public Record's actual reporting is that the ANCPI security contract REQUIRED active services (24/7 call-centre, on-site personnel, annual audits); the vendor representative merely CLAIMED his firm was 'just a license provider' ('ca si cum cumparati licente Microsoft de pe eMAG'), which Public Record frames as contradicting the contract. The entry presents the vendor's contested self-characterisation as established fact and inverts the source's point. Re-read Public Record and reframe as a disputed governance gap (contract required monitoring; vendor now disclaims), not a settled 'supplied only licensing' fact. Main agent should re-verify the Romanian source directly."
