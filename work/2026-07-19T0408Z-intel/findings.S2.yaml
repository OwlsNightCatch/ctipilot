    extended_notes: |
      Individual sub-incident dates (15-17 July) sit just outside a strict 24h floor from this
      run's window start; included because the consolidated wrap-up publishing the resolution
      timeline and the cross-incident pattern is itself dated 18 July (in-window), and because the
      Netze-BW/Stuttgart-Netze meter-contractor breach is a fresh, distinct data point (not
      previously covered) directly extending the already-covered IWB Basel third-party-provider
      pattern into Germany. The main agent may reasonably choose to split this into two entries
      (DDoS/availability cluster vs. meter-contractor supply-chain breach) given they are unrelated
      per the sources' own framing — no single actor or campaign connects them.
    borderline: true
    borderline_reason: "Individual incident dates mostly precede the strict 24h window; anchored on the in-window 18 July wrap-up and the previously-uncovered Netze BW/Stuttgart Netze meter-contractor breach specifically. No attacker attribution links the sub-incidents — presented as a same-week cluster, not a coordinated campaign, per the sources."

  - title: "SFR (French telco): criminal claims a second 2026 data-theft incident via an internal tool, unconfirmed by the operator — thousands of fibre customers' technical/network data allegedly taken"
    sources:
      - { url: "https://www.usine-digitale.fr/telecoms/altice/sfr/cybersecurite-sfr-victime-dune-fuite-de-donnees-personnelles-de-ses-clients-un-an-apres-la-precedente.66MORRZXEBAVXN3AUXSN5WZO64.html", publisher: "L'Usine Digitale", date: "2026-07-17 20:16", role: "primary" }
      - { url: "https://www.dpo-partage.fr/fuite-de-donnees-sfr-et-la-vague-de-juillet-2026/", publisher: "DPO Partage", date: "2026-07-18", role: "corroborating" }
      - { url: "https://www.cyberattaque.org/sfr-21-millions-de-clients-fibre-en-fuite-apres-lacces-a-un-outil-interne/", publisher: "Cyberattaque.org (independent observatory)", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"cyberattaque administration collectivité France juillet 2026\") -> lead: SFR fuite données wave -> WebSearch (\"SFR fuite données NOVA outil interne 2 millions clients\") -> primary: L'Usine Digitale, URL https://www.usine-digitale.fr/telecoms/altice/sfr/cybersecurite-sfr-victime-dune-fuite-de-donnees-personnelles-de-ses-clients-un-an-apres-la-precedente.66MORRZXEBAVXN3AUXSN5WZO64.html -> corroborating: DPO Partage, URL https://www.dpo-partage.fr/fuite-de-donnees-sfr-et-la-vague-de-juillet-2026/ -> corroborating: Cyberattaque.org, URL https://www.cyberattaque.org/sfr-21-millions-de-clients-fibre-en-fuite-apres-lacces-a-un-outil-interne/"
    summary: |
      A criminal actor claims to have accessed several of French telecom operator SFR's internal
      tools, including an interface named "NOVA", and to have automated extraction of a partial
      customer database — 2,104,093 rows — mostly covering fixed/fibre-internet subscribers (some
      records also carry linked mobile-account data). The claimed extraction began 30 June 2026 and
      was reportedly detected and stopped by SFR's own monitoring before the claim surfaced on 17
      July. Sample records show name, first name, mobile number, customer category and account
      address, plus extensive fibre-network technical data — box/ONT serial numbers, GPS coordinates,
      OLT references, optical splice-point identifiers and cable-topology detail — no passwords,
      IBANs or card data in the disclosed sample. As of the most recent reporting (18 July), SFR has
      issued no public confirmation; this is a criminal claim only, corroborated in the sense that
      independent French trade/observer press verified and re-reported the claim's content, not that
      the claim's truth is established. Analysts covering the story frame the likely root cause as an
      access-governance and logging failure at the internal-tool level (over-broad account
      permissions, insufficient audit logging) rather than a perimeter breach — this is SFR's second
      reported customer-data exposure in roughly a year (the prior, confirmed incident, December
      2025, involved a different internal tool used for fibre-connection field operations).
    region_nexus: "France (EU) — telco sector, home-region-adjacent"
    primary_sector_nexus: "indirect"
