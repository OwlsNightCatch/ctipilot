  - title: "Romania's cadastre/land-registry authority ANCPI: multi-day cyberattack with claimed ransomware deployment and GitLab source-code theft, attributed to data-leak operator ByteToBreach"
    sources:
      - { url: "https://publicrecord.ro/2026/07/17/atac-cibernetic-ancpi/", publisher: "Public Record (RO investigative outlet)", date: "2026-07-17", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/07/16/romania-ancpi-cyber-attack/", publisher: "Help Net Security", date: "2026-07-16", role: "corroborating" }
      - { url: "https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/", publisher: "KELA Cyber (threat-intel research)", date: "2026-07-17 (updated; orig. Nov 2025)", role: "corroborating (actor attribution)" }
    discovery_trace: "first seen at: WebSearch (\"Cyberangriff Behörde Verwaltung heute 19. Juli 2026\") -> heise.de Cybercrime listing lead (konbriefing.com summary) -> WebSearch (\"ANCPI cyberattack e-Terra Romania cadastru atac cibernetic iulie 2026\") -> primary: Public Record, URL https://publicrecord.ro/2026/07/17/atac-cibernetic-ancpi/ -> corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/07/16/romania-ancpi-cyber-attack/ -> corroborating: KELA Cyber, URL https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/"
    summary: |
      Romania's National Agency for Cadastre and Real Estate Publicity (ANCPI) — the government
      authority operating the national land-registry/cadastre system used by citizens, notaries,
      lawyers, banks and other authorities for property transactions — suffered what it calls the
      largest technical disruption in its history starting Tuesday 14 July 2026. All IT systems,
      including the e-Terra cadastral application, RENNS, and institutional email, went down; ANCPI
      initially described the outage as a "technical incident" before confirming it was a cyberattack.
      As of the latest reporting (Friday 17 July), systems remained unavailable pending the security
      investigation — a developing, still-unresolved incident. A threat actor using the alias
      "ByteToBreach" posted the data for sale on a dark-web forum on 15 July, claiming to hold
      Romanian-citizen data extracted from ANCPI databases, a copied GitLab server with the source
      code for e-Terra and RENNS, and to have deployed a ransomware variant plus begun deleting
      available backups. ANCPI states the data it administers "has not been compromised as a result
      of this incident" — a claim not yet reconciled with the attacker's evidence. KELA (Israeli
      threat-intel firm) assesses ByteToBreach as a persistent data-leak operator active since June
      2025, likely identifiable as an individual from Oran, Algeria, whose documented victim list
      spans government, banking, airline, healthcare and university targets across Ukraine,
      Kazakhstan, Cyprus, Poland, Chile, Uzbekistan, the US, Romania and Singapore — i.e. an actor
      with a track record of hitting EU-member government bodies (Poland), not solely opportunistic.
      Public Record's investigation additionally found the agency's contracted cybersecurity vendor
      supplied only software licensing rather than active monitoring, and notes a near-identical prior
      incident at Romania's National Water Administration (ANAR) in December 2025 serviced by the same
      vendor network — a recurring public-sector/critical-infrastructure vendor-oversight gap.
    region_nexus: "Romania (EU member state) — direct EU public-sector nexus; ByteToBreach's victimology also includes Poland government targets"
    primary_sector_nexus: "direct"
    sector: "public-sector, water (via the ANAR precedent)"
    cves: []
    techniques: [T1190, T1078, T1110, T1486, T1490, T1213]
    affected_products: ["ANCPI e-Terra cadastral/land-registry application", "RENNS", "GitLab (self-hosted instance)"]
    entity_keys: []
    new_entities:
      - { key: "actor:bytetobreach", type: actor, name: "ByteToBreach", aliases: [],
          summary: "Persistent data-leak/extortion operator active since June 2025, active on dark-web forums, Telegram and a WordPress site; KELA assesses likely identity as an individual from Oran, Algeria. Uses cloud/corporate-infrastructure vulnerability exploitation, infostealer/phishing-harvested credential reuse and brute force for initial access; victimology spans government, banking, airline, healthcare and university targets in Ukraine, Kazakhstan, Cyprus, Poland, Chile, Uzbekistan, the US, Romania and Singapore (KELA, updated 2026-07-17)." }
      - { key: "incident:ancpi-romania-cyberattack-2026-07", type: incident, name: "ANCPI (Romania cadastre/land-registry agency) cyberattack, July 2026",
          summary: "Multi-day outage of Romania's national cadastre/land-registry systems (e-Terra, RENNS, email) beginning 14 July 2026, attributed to ByteToBreach, who claims citizen-data theft, GitLab source-code theft and ransomware deployment; ANCPI disputes data compromise. Still unresolved as of 17 July 2026 (Public Record, Help Net Security, KELA)." }
    relation_suggestions:
      - { subject: "actor:bytetobreach", object: "incident:ancpi-romania-cyberattack-2026-07",
          basis: "Public Record / Help Net Security: ByteToBreach claimed responsibility on a dark-web forum and posted ANCPI data for sale" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "ANCPI stated that the data administered through its IT systems has not been compromised as a result of this incident."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/07/16/romania-ancpi-cyber-attack/"
      - quote: "They claim to have compromised data of Romanian citizens and various ANCPI databases, made a copy of the agency's GitLab servers and the source code contained within, and deployed ransomware."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/07/16/romania-ancpi-cyber-attack/"
      - quote: "Exploiting known vulnerabilities in cloud and corporate infrastructure, reusing stolen credentials harvested from infostealers and phishing, and at times resorting to brute force"
        attribution: "KELA Cyber"
        source_url: "https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/"
    extended_notes: |
      Defender takeaway: this is a live, unresolved government-agency incident with a named,
      tracked actor whose stated initial-access mix (public-facing vuln exploitation, infostealer/
      phishing-harvested credential reuse, brute force) is entirely generic/transferable — hunt
      guidance should focus on the technique classes (anomalous auth from stolen-credential reuse,
      brute-force lockout/anomaly patterns on public-facing admin panels, unexpected GitLab/source-
      -control API pulls) rather than any single IOC. The vendor-oversight failure (contracted
      "cybersecurity provider" supplying only software licenses, no active monitoring) recurring
      across two Romanian public-sector/CI incidents (ANCPI and the Dec-2025 ANAR water-authority
      attack) is a concrete, auditable lesson for any public-sector body relying on a third-party
      "security" contract: verify the contract's actual scope (monitoring/detection vs. mere
      licensing) rather than assuming vendor name implies coverage. Given the still-unresolved status,
      expect this to develop further (data-authenticity confirmation, victim-notification obligations,
      possible EU/CERT-EU involvement) — flag for update-of follow-up.
    borderline: false

  - title: "German public-sector and energy-grid targets hit by a cluster of separate incidents in mid-July 2026 — Wiesbaden DDoS, Netze BW/Stuttgart Netze meter-installer supply-chain breach"
    sources:
      - { url: "https://www.ad-hoc-news.de/wissenschaft/cyberangriffe-auf-staedte-ddos-welle-trifft-wiesbaden-muelheim-mainz/69792955", publisher: "ad-hoc-news.de", date: "2026-07-18 08:18", role: "primary (wrap-up/synthesis, in-window)" }
