    extended_notes: |
      Include with caution: this is an unconfirmed criminal claim, not a victim-confirmed breach —
      analogous in evidentiary weight to how the Nayax/"The Syndicate" claim was previously handled
      (claim reported, framed as unproven, tracked for a confirming/denying update). Root-cause
      framing (excess internal-tool permissions + weak audit logging enabling large-scale automated
      extraction by an authenticated-but-over-privileged internal actor/account) is a transferable
      governance lesson for any org running internal case-management/network-operations tooling
      with broad read access to customer records, independent of whether this specific claim is
      ultimately confirmed. No technical detail on how the "NOVA" access itself was obtained (stolen
      credentials vs. insider vs. app vulnerability) was available in any fetched source — do not
      assume a mechanism beyond "internal tool access."
    borderline: true
    borderline_reason: "Unconfirmed criminal claim only; SFR has issued no public statement as of the freshest (18 July) reporting found. Included for the sector nexus (telco) and the repeat-pattern governance lesson, not as an established breach."
