  - title: "SharePoint July 2026 exploitation cluster: CISA's AMSI/Defender signature names and the IIS machine-key-theft persistence chain"
    sources:
      - { url: "https://www.resecurity.com/blog/article/from-web-request-to-domain-compromise-understanding-the-july-2026-sharepoint-attacks", publisher: "Resecurity", date: "2026-07-18", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations", publisher: "CISA", date: "2026-07-16 (update)", role: "primary" }
    discovery_trace: "first seen at: resecurity (source-list standard-tier), URL https://www.resecurity.com/blog → drilled article, URL https://www.resecurity.com/blog/article/from-web-request-to-domain-compromise-understanding-the-july-2026-sharepoint-attacks → primary technical authority: CISA Alert, URL https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations (last updated 2026-07-16, carries the AMSI/MDAV signature names Resecurity's synthesis draws on)"
    summary: |
      Technical/detection enrichment on the already-covered on-prem SharePoint Server
      exploitation cluster (CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, CVE-2026-58644 —
      all CISA KEV-listed and confirmed exploited; CVE-2026-55040 and CVE-2026-50522 disclosed
      but not yet confirmed exploited). CISA's alert (last updated 2026-07-16) states these
      vulnerabilities are being used for RCE and "post-exploitation activities, such as
      stealing Internet Information Services (IIS) machine keys and performing deserialization
      techniques, to gain persistence and deploy malware" — i.e. the ToolShell-lineage
      playbook: an initial webshell drop into a `_layouts`-reachable path, theft of the
      ASP.NET machine validation/decryption keys, and offline forging of ViewState / forms-auth
      tickets that remain valid after the initiating vulnerability is patched (patching alone
      does not revoke stolen keys). CISA names four concrete AMSI/Microsoft Defender Antivirus
      signatures organizations should hunt for: `Exploit:Script/SuspSignoutReqBody.A` (request
      body, SharePoint Subscription Edition only), `Exploit:Script/ToolPaneAuthBypass.A`
      (request header scanning) and `.C` (RCE coverage) on 2016/2019/Subscription, and
      `Backdoor:MSIL/LeakFang.A!dha` (post-exploitation, IIS-protected-secrets access).
      Resecurity's 2026-07-18 write-up walks the same chain in a fictional "Operation
      FarmKey" illustrative case study (explicitly labelled as such, not an observed incident
      — excluded from the technical claims above) but usefully consolidates concrete
      telemetry to hunt: `w3wp.exe` spawning `cmd.exe`/`powershell.exe`/`csc.exe`, new
      `.aspx`/`.dll` files under `TEMPLATE\LAYOUTS`, and IIS Configuration/Operational Event
      ID 29 (new global module registered in `applicationHost.config` — the persistence
      mechanism that survives an application-pool recycle). CISA's hardening guidance: before
      rotating machine keys, hunt for and remediate machine-key harvesters first (rotating
      keys without doing so lets the attacker steal the new ones too); avoid exposing
      SharePoint Servers directly to the internet; require AMSI "Full Mode" request-body
      scanning.
    region_nexus: "global; on-premises SharePoint Server is widely deployed across Swiss/EU government and public-administration back offices"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-56164, CVE-2026-58644, CVE-2026-45659, CVE-2026-32201, CVE-2026-55040, CVE-2026-50522]
    techniques: [T1190, T1505.003, T1505.004, T1606.001]
    affected_products: ["Microsoft SharePoint Server 2016", "Microsoft SharePoint Server 2019", "Microsoft SharePoint Server Subscription Edition"]
