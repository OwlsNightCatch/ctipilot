    evidence:
      - quote: "These vulnerabilities affect all supported on-premises SharePoint Server versions (Subscription Edition, 2019, and 2016) and involve establishing remote code execution (RCE) and post-exploitation activities, such as stealing Internet Information Services (IIS) machine keys and performing deserialization techniques, to gain persistence and deploy malware."
        attribution: "CISA Alert (updated 2026-07-16)"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
      - quote: "AMSI: Exploit:Script/SuspSignoutReqBody.A – request body scanning; SharePoint Server Subscription only; Microsoft has blocked observed attempts."
        attribution: "CISA Alert (updated 2026-07-16)"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
      - quote: "Before rotating IIS machine keys, hunt for and remediate any intrusion artifacts, including machine-key harvesters, that could allow for the keys to be stolen again."
        attribution: "CISA Alert (updated 2026-07-16)"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
    extended_notes: |
      Sourcing note: Resecurity is a standard-tier, Admiralty-C source (marketing tone,
      corroborate before sole-citing per sources.json) and its "Operation FarmKey" case study
      is explicitly fictional/illustrative — I deliberately excluded that narrative from the
      summary's factual claims and anchored every load-bearing technical fact to CISA's own
      alert text instead. The CISA alert's own last-update timestamp (2026-07-16) is 2-3 days
      before this run's 24h window; I'm treating this as the "vendor/authority advisory from
      2-3 days ago carrying detection specifics not yet surfaced in the brief" exception,
      with Resecurity's 2026-07-18 write-up as the fresh trigger that surfaced it. Given the
      mixed source tier, marked confidence MEDIUM rather than HIGH.

