items:
  - title: "@fastify/http-proxy prefix-rewrite bypass lets attackers reach hidden upstream paths via a URL-encoded proxy prefix (CVE-2026-16117, CVSS 10.0)"
    sources:
      - { url: "https://github.com/fastify/fastify-http-proxy/security/advisories/GHSA-mx7v-qhg9-2mvv", publisher: "GitHub Security Advisory (OpenJS Foundation CNA)", date: "2026-07-18", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-16117", publisher: "NVD", date: "2026-07-18", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvd.enisa.europa.eu/ (via bridge `enisa-euvd recent criticals`, record EUVD-2026-45379) → primary: GitHub Security Advisory, URL https://github.com/fastify/fastify-http-proxy/security/advisories/GHSA-mx7v-qhg9-2mvv → confirmed: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-16117"
    summary: |
      @fastify/http-proxy (the official Fastify plugin for reverse-proxying requests to an
      upstream service, commonly used to build Node.js API gateways) versions up to and
      including 11.5.0 fail to rewrite the request prefix when the prefix segment is
      URL-encoded. Fastify's router URL-decodes paths for route matching (so a request to
      `/%61pi/*` still matches a route registered under `/api/*`), but `request.url` retains
      the original encoded form, and the plugin's prefix-rewrite step performs a literal
      string replace against the decoded prefix — which then fails to match the still-encoded
      URL. The result: a crafted request that encodes one or more characters of the configured
      prefix matches the proxy route but skips the rewrite, so the raw encoded path is
      forwarded to the upstream unchanged; the upstream then decodes it and serves whatever
      path it names — reaching internal or administrative endpoints the gateway operator
      believed were hidden behind `rewritePrefix`. No authentication or user interaction is
      required (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N = 10.0). No workaround exists;
      the only fix is upgrading to 11.6.0. No public exploitation has been reported as of
      2026-07-18. Relevant to any organization — including public-sector API gateways — that
      relies on `@fastify/http-proxy`'s `rewritePrefix` to expose only a subset of an upstream
      service's paths through a public-facing proxy.
    region_nexus: "global; affects any Node.js-based API gateway/reverse-proxy deployment, including Swiss/EU public-sector web-service front ends built on Fastify"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco, general IT infrastructure"
    cves: [CVE-2026-16117]
    techniques: [T1190]
    affected_products: ["@fastify/http-proxy (npm package)"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Fastify's router URL-decodes paths for route matching, so `/%61pi/*` matches a route registered under `/api/*`, but `request.url` retains the encoded form and the literal `String.replace(prefix, rewritePrefix)` fails to match."
        attribution: "@fastify/http-proxy GHSA-mx7v-qhg9-2mvv"
        source_url: "https://github.com/fastify/fastify-http-proxy/security/advisories/GHSA-mx7v-qhg9-2mvv"
      - quote: "Applications that rely on `rewritePrefix` to isolate upstream paths behind a public prefix are exposed to path-restriction bypass."
        attribution: "@fastify/http-proxy GHSA-mx7v-qhg9-2mvv"
        source_url: "https://github.com/fastify/fastify-http-proxy/security/advisories/GHSA-mx7v-qhg9-2mvv"
    extended_notes: |
      Discovered via ENISA EUVD's "criticals" listing sweep (CVSS 9.0-10.0), which also
      surfaced two other fresh (2026-07-18) high-CVSS GHSA records I evaluated and dropped:
      CVE-2026-9323 (urwid Python TUI library, web-display-backend session-ID prediction +
      /tmp FIFO enumeration — real but the vulnerable web-display feature is rarely exposed
      in production, so relevance is low) and CVE-2025-71392 (SurrealDB SurrealQL injection
      via backup export/import, CVSS 9.4) — the latter's underlying GHSA advisory is dated
      2025-04-10; EUVD only backfilled/republished the record on 2026-07-18, so it is NOT a
      fresh disclosure (recycled-news trap avoided) and was dropped as stale.

  - title: "WordPress wp2shell pre-auth RCE chain (CVE-2026-63030/CVE-2026-60137): watchTowr reports early indications of in-the-wild exploitation, a day after the PoC went public"
    sources:
      - { url: "https://cyberinsider.com/wordpress-releases-emergency-update-for-critical-wp2shell-rce-flaw/", publisher: "CyberInsider", date: "2026-07-18", role: "primary" }
      - { url: "https://www.wordfence.com/blog/2026/07/psa-wordpress-core-patched-unauthenticated-remote-code-execution-vulnerability-chain/", publisher: "Wordfence", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"'proof of concept' exploit released critical vulnerability July 18 2026\") → pivot: CyberInsider, URL https://cyberinsider.com/wordpress-releases-emergency-update-for-critical-wp2shell-rce-flaw/ → corroboration: Wordfence, URL https://www.wordfence.com/blog/2026/07/psa-wordpress-core-patched-unauthenticated-remote-code-execution-vulnerability-chain/ (confirms a customer firewall rule shipped 2026-07-17 but does not itself confirm ITW exploitation) → claim source named by CyberInsider: watchTowr CEO Benjamin Harris"
    summary: |
      Delta on the already-covered wp2shell WordPress-core pre-auth RCE chain (REST API
      batch-endpoint route confusion, CVE-2026-63030, chained with a WP_Query SQL injection,
      CVE-2026-60137; fixed out-of-band in 7.0.2/6.9.5/6.8.6 on 2026-07-17). The prior entry
      recorded "no confirmed in-the-wild exploitation as of 2026-07-18." That has moved:
      watchTowr CEO Benjamin Harris is quoted (2026-07-18) saying the company is "already
      seeing PoC exploits for wp2shell in circulation and the first indications of
      in-the-wild exploitation" — a claim, not yet an independently-confirmed fact (no CISA
      KEV addition, no named victim, no independent telemetry source corroborates it as of
      this run). Wordfence separately confirms it shipped a WAF rule to Premium/Care/Response
      customers on 2026-07-17 specifically to block attacks against this RCE (Free-tier users
      get the same rule 2026-08-16) — a defensive measure consistent with anticipated/observed
      attack activity, but not itself an ITW-exploitation confirmation. The vulnerability
      remains unauthenticated, no-plugins-required, reachable against any stock WordPress 6.9.0
      through 7.0.1 install; the interim WAF mitigation is to block both `/wp-json/batch/v1`
      and `?rest_route=/batch/v1` (blocking only the former leaves the query-string route open).
    region_nexus: "global; WordPress is heavily used across Swiss/EU public-sector, education and municipal websites"
