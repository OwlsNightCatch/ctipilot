  - title: "ClickLock Stealer — a macOS ClickFix infostealer that force-kills every visible process every 210ms until the victim types their login password, targeting Europe (>50% of victims), North America and MEA"
    sources:
      - { url: "https://www.group-ib.com/blog/clicklock-stealer-macos-malware/", publisher: "Group-IB Threat Intelligence", date: "2026-07-16", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-clicklock-macos-malware-traps-users-into-revealing-login-password/", publisher: "BleepingComputer", date: "2026-07-16", role: "corroborating" }
      - { url: "https://www.forbes.com/sites/daveywinder/2026/07/18/app-killing-mac-malware-triggers-83-hour-password-entry-loop/", publisher: "Forbes", date: "2026-07-18", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new malware analysis \\\"published July 18\\\" 2026\") → pivot: Forbes, URL https://www.forbes.com/sites/daveywinder/2026/07/18/app-killing-mac-malware-triggers-83-hour-password-entry-loop/ (fresh in-window pickup, 2026-07-18) → primary: Group-IB Threat Intelligence (original discovering research), URL https://www.group-ib.com/blog/clicklock-stealer-macos-malware/ (2026-07-16, curated S3 source) → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/new-clicklock-macos-malware-traps-users-into-revealing-login-password/ (2026-07-16)"
    summary: |
      Group-IB Threat Intelligence discovered a previously undocumented macOS stealer, named ClickLock Stealer, uploaded to VirusTotal on 9 June 2026 with zero AV detections at analysis time. The malware is delivered via a ClickFix-style social-engineering page (a fake Cloudflare "verifying you are not a bot" banner instructing the victim to paste a command into Terminal) and requires no exploit and no elevated privilege — the entire compromise runs at the logged-in user's own privilege level. The orchestrator script.sh disables SIGINT, hides the cursor, renders a fake Cloudflare progress-bar animation as cover, and pulls four modules from compromised WordPress infrastructure and a Telegram-controlled backdoor: a credential stealer, a Keychain stealer, a crypto-focused stealer, and a modified GSocket-based backdoor (persistent gs-netcat reverse shell disguised as an iCloud process). It first attempts a soft osascript-built fake macOS password dialog validated locally via `dscl /Local/Default -authonly` (so only a correct password is ever exfiltrated); if the victim cancels, two LaunchAgents (com.authirity.plist, com.chromer.plist) are installed for persistence, and on next login the credential-stealer module force-kills every visible application (Finder, Dock, SystemUIServer, NotificationCenter) every 210 milliseconds — for up to 83 hours per public reporting — leaving only the password dialog on screen until the victim complies. A parallel module uses the identical kill-loop technique to force approval of a genuine macOS Keychain authorization dialog, capturing Chrome's Safe Storage AES key, while a ~6-hour NotificationCenter-suppression loop blocks Gatekeeper/security alerts. The data harvester archives browser credentials (8 browsers), 31 crypto-wallet browser extensions, 7 password-manager extensions, 8 desktop wallets, blockchain addresses across 6 chains, macOS Keychain, shell history and FTP credentials into a ZIP exfiltrated to a Telegram bot; all modules except the backdoor self-delete and timestomp afterward. Group-IB assesses with high confidence the malware is/will be distributed via ClickFix phishing pages (citing prior Cloudflare-, Claude-, and disk-cleaning-themed ClickFix lures reported by Malwarebytes and Microsoft) and notes the code structure suggests active development. Telemetry shows at least 100 victims across 33 countries, with more than 50% located in Europe, active since roughly May 2026 — direct relevance to the Swiss/European constituency given the regional concentration.
    region_nexus: "Europe is the largest victim region (>50% of identified victims per Group-IB telemetry), followed by North America and MEA — direct relevance to Swiss/European macOS-using constituents (crypto holders and any user with browser-saved credentials/password-manager vaults)."
    primary_sector_nexus: "indirect — targets individual macOS users (crypto holders, credential/password-manager users) rather than a specific sector; relevant to any organisation issuing macOS endpoints to staff, including public-sector and critical-infrastructure environments."
    sector: "cross-sector, public-sector"
