    extended_notes: |
      Group-IB's own post already includes a full MITRE ATT&CK mapping table and an extensive detection/hardening section (osascript spawning password dialogs with non-standard icon paths; rapid repeated pkill/killall targeting Finder/Dock/SystemUIServer/NotificationCenter at sub-second intervals as a discriminator with "no legitimate use case"; `security find-generic-password` invoked from shell/non-browser parents; bulk access to browser-profile directories followed by outbound connections to api.telegram.org; curl-piped-to-bash patterns with misleading extensions .jpg/.txt/.css; LaunchAgent creation by shell processes combined with launchctl load). Benign-lookalike guidance from the source: legitimate Keychain queries come from the requesting application itself, not a bash process — that is Group-IB's own stated discriminator for the `security find-generic-password` telemetry hook. No IOCs carried forward per policy (domains/hashes omitted).
  - title: "SharePoint July 2026 exploitation cluster gets a full technical kill-chain breakdown — CISA names official AMSI/MDAV detection signatures for the machineKey-theft → ViewState-forgery → SQL-farm-account lateral-movement path"
    sources:
      - { url: "https://www.resecurity.com/blog/article/from-web-request-to-domain-compromise-understanding-the-july-2026-sharepoint-attacks", publisher: "Resecurity", date: "2026-07-18", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations", publisher: "CISA", date: "2026-07-16 (updated)", role: "corroborating" }
    discovery_trace: "first seen at: resecurity, URL https://www.resecurity.com/blog (listing) → https://www.resecurity.com/blog/article/from-web-request-to-domain-compromise-understanding-the-july-2026-sharepoint-attacks (2026-07-18, curated S3 source) → corroborating pivot: CISA Alert (bridge cisa page), URL https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations (updated 2026-07-16, adds CVE-2026-58644 to KEV and names official AMSI/MDAV detection signatures)"
    summary: |
      Building on the already-tracked July 2026 on-premises SharePoint Server exploitation wave (CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, CVE-2026-58644 — all four confirmed exploited per CISA, all four now KEV-listed as of 16 July), Resecurity published a step-by-step technical walkthrough of the full attack chain from initial web request to domain-wide compromise, and CISA's alert (silently updated 16 July to add CVE-2026-58644 to KEV) names, for the first time in this run's coverage, the specific AMSI and Defender detection-signature identifiers deployed against it. Initial access exploits the auth-bypass/deserialization flaws to reach RCE inside the IIS worker process (w3wp.exe); the attacker then deploys an ASP.NET web shell (commonly named spinstall0.aspx and renamed variants) and uses .NET reflection to read the private `_ValidationKey`/`_DecryptionKey` fields off `MachineKeySection`, exfiltrating the IIS machineKey material. With the stolen validation/decryption keys the attacker forges ViewState payloads offline and/or registers a malicious native IIS module in applicationHost.config/web.config for persistence beyond a single patch cycle. The critical escalation step: the SharePoint farm service account holds `dbcreator`, `securityadmin` and `db_owner` SQL Server roles across all SharePoint content/configuration databases by design, so an attacker who reaches that account can query every SharePoint database and pivot toward Active Directory — collapsing a single-server RCE into a farm-wide and potentially domain-wide compromise. CISA's alert (Acknowledgements: "Microsoft contributed to this Alert") names concrete, vendor-published detection signatures: AMSI `Exploit:Script/SuspSignoutReqBody.A` (SharePoint Server Subscription Edition only, request-body scanning), AMSI `Exploit:Script/ToolPaneAuthBypass.A` (request-header scanning, all three on-prem versions) and `.C` (RCE coverage, all three versions), and Microsoft Defender Antivirus `Backdoor:MSIL/LeakFang.A!dha` (post-exploitation/IIS-secret-theft alert) — none of which appeared in this run's prior three SharePoint entries. CISA explicitly warns that machine keys must not simply be rotated without first hunting for and removing any machine-key harvester, since a persistent harvester will just re-steal a freshly rotated key.
    region_nexus: "global; on-premises SharePoint Server is common in EU/Swiss public-sector and enterprise document-management estates — the farm-account SQL-role escalation path applies to any on-prem SharePoint farm regardless of geography."
    primary_sector_nexus: "direct — on-premises collaboration/document-management infrastructure is widely deployed across public-sector and critical-infrastructure back offices."
    sector: "public-sector, cross-sector"
