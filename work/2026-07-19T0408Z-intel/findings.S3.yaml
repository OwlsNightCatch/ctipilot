      CVE-2026-32201 and CVE-2026-45659 were already KEV-listed from earlier in the year (14 Apr and 1 Jul respectively per CISA) and CVE-2026-56164 / CVE-2026-58644 are already tracked in this store's prior coverage (2026-07-14 and 2026-07-15/07-17 entries) at the "patched"/"exploited" level; this item's value-add is exclusively the exploitation-chain depth (machineKey-theft-via-reflection → ViewState forgery → SQL-farm-account lateral movement) and the named AMSI/MDAV detection-signature identifiers, neither of which appeared in the three prior SharePoint entries this run's dedup index carries. Resecurity is a reliability-C source per the source list (originates research but corroborate before citing as sole source) — corroborated here against CISA's own alert (an A-tier national/government authority for its own advisory) for the detection-signature and CVE-status claims, and against multiple independently-observed CVE numbers matching MITRE/CVE.org records looked up during this run.
