- entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
  verdict: imprecision
  defects:
  - where: frontmatter cves[CVE-2026-20236].cvss and body paragraph 2
    claim: 9.0 (CVSS 3.1, highest score of the worst underlying flaw in the CWE-682 class; attack complexity high)
    defect: (low confidence) The entry follows the Snort 3 advisory table, but Cisco's own CVE record for CVE-2026-20236 carries 7.5 (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H), a divergence the entry does not surface.
    ground_truth: 'Advisory table: "CVE-2026-20236 9.0 CWE-682 Incorrect calculation"; CVE.org CNA (cisco) metrics: baseScore 7.5, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H (CVE-2026-20043 carries 9.0 AC:H in both).'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-20236
    fix: Keep 9.0 as the advisory-group figure and add that the CVE record lists 7.5.
    class: imprecision
