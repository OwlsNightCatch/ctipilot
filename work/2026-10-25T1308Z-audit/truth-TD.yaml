    fix: Date the source 2026-10-21 (updated 2026-10-22), or accept as a timezone artifact.
    class: imprecision
- entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
  verdict: clean
  defects: []
  scope: 'carry-forward (narrow): clause "Claroty documents seventeen of them"'
  note: 'Supported. Claroty Team82 post (2026-08-09) lists 20 related disclosures: 17 at CVSS 8.0, each an OS command injection exploitable by an authenticated attacker, plus CVE-2026-24663 (9.0, unauthenticated), CVE-2026-25085 (8.6) and CVE-2026-21718 (10.0, authentication bypass); the clause cites the Claroty URL correctly.'
- entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
  verdict: factual-error
  defects:
  - where: evidence[] (Previdian)
    claim: Yes. Previdian tracks this CVE as a known exploited vulnerability.
    defect: 'Not a contiguous passage of the cited page: it splices "Yes." with a reworded clause ("tracks" for "lists"); the page text is one sentence longer.'
    ground_truth: '"Yes. Exploitation attempts have been reported for this vulnerability. Previdian lists it as a known exploited vulnerability. Also reported by third-party sources. Confidence is high."'
    ground_truth_url: https://previdian.com/CVE-2026-85097
    fix: Replace the quote with the contiguous "Previdian lists it as a known exploited vulnerability."
    class: factual-error
  - where: sources[] / body citations (Previdian date)
    claim: Previdian lists it as exploited in the wild and links public proof-of-concept code ([Previdian, 2026-10-08])
    defect: (low confidence) 2026-10-08 is the CVE publication date on the page; the exploitation listing is dated 2026-10-12 and the proof-of-concept entries 2026-10-10 to 2026-10-15, so the citation date predates the content it is cited for.
    ground_truth: 'Page: "Published 08 Oct 2026 / Exploitation Attempts Reported 12 Oct 2026"; "Added to Previdian KEV Feed ... 2026-10-12 09:42 UTC"; GitHub PoC entries created 2026-10-10 to 2026-10-15.'
    ground_truth_url: https://previdian.com/CVE-2026-85097
    fix: Label the Previdian source with the date of the cited content (2026-10-12) or say "as of 2026-10-19".
    class: imprecision
  scope: 'carry-forward (narrow): 4.0.2 clause and source date; Previdian evidence quote'
  note: '4.0.2 clause confirmed: the Bricksforge changelog has a 4.0.2 block dated "13. October 2026" ("The upload check introduced in 4.0.1 could refuse a perfectly normal image, roughly one in sixty"; REST endpoints tightened) and a 4.0.1 block dated "8. October 2026" whose text matches the other two evidence quotes verbatim; the 2026-10-13 label is the changelog''s latest block date. The pre-pass lead on the Previdian quote is confirmed.'
