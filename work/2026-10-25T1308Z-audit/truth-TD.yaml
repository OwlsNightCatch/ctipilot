- entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
  verdict: imprecision
  defects:
  - where: frontmatter cves[CVE-2026-114625].status, tags
    claim: 'status: [exploited, patch-available]'
    defect: CISA added CVE-2026-114625 to the KEV catalog on 2026-10-23 (due 2026-10-26); the entry, published before the addition, carries no cisa-kev status or tag and no record of it.
    ground_truth: 'KEV record: cveID CVE-2026-114625, vendorProject Arista, product VeloCloud Orchestrator, dateAdded 2026-10-23, dueDate 2026-10-26, notes cite Arista advisory 0199.'
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Append an update record adding cisa-kev to cves[].status and tags, citing the KEV catalog.
    class: imprecision
- entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
  verdict: imprecision
  defects:
  - where: sources[] date, body citations, event_date
    claim: NetScaler Product Security (Citrix Tech Zone) date 2026-10-22
    defect: (low confidence) The Tech Zone post's publication timestamp is 2026-10-21T22:23+02:00; 2026-10-22 is its "last updated" date, so the source date and event_date are one day late.
    ground_truth: '"Published Time: 2026-10-21T22:23:00+02:00 ... Last updated on: October 22, 2026 (Pacific Daylight Time)".'
