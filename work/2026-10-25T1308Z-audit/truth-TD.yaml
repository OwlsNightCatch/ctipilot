entries:
- entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
  verdict: imprecision
  defects:
  - where: summary; body paragraph 3
    claim: Laptop maker Framework and form builder Tally were the first to confirm customer data was taken, on 2026-08-03. / Those two were the first confirmed victims.
    defect: No cited source says Framework and Tally were the first to confirm; 2026-08-03 is the intrusion date Framework gave (confirmation came 6-7 August), and the entry's own 2026-08-19 section lists n8n and Kilo Code in the same first wave (Kilo Code's own post is dated 2026-08-07, n8n's 2026-08-08).
    ground_truth: 'BleepingComputer: "Framework said Metabase notified the company on August 6 that its instance had been vulnerable to the zero-day and accessed by the attacker on August 3." It does not say the two were first. n8n: "The unauthorised activity took place on 3 August 2026". Kilo: "The incident at Metabase occurred over a period of approximately 4 hours on August 2, 2026."'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/
    fix: Drop "first" or attribute it ("the first two reported by BleepingComputer on 2026-08-07") and move "2026-08-03" to the intrusion ("accessed on 2026-08-03").
    class: imprecision
  - where: body paragraph 1 and Update 2026-08-12 (CVE assignment, KEV)
    claim: The advisory later assigned CVE-2026-72898, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-08-11 / CISA added the CVE to its Known Exploited Vulnerabilities catalog on 2026-08-11 with a 14 August due date ([CISA, 2026-08-11])
    defect: The CVE was reserved and published by CISA as CNA on 2026-08-10, not assigned by the Metabase advisory; and the cited CISA alert page carries no due date (the 14 August date is in the KEV catalog record).
    ground_truth: 'CVE.org record: assignerShortName "cisa-cg", dateReserved 2026-08-10T17:20:39Z, datePublished 2026-08-10T17:55:54Z. CISA alert lists "CVE-2026-72898 Metabase SQL Injection Vulnerability" with no due date; KEV catalog record: dateAdded 2026-08-11, dueDate 2026-08-14.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-72898
    fix: Say CISA (as CNA) published CVE-2026-72898 on 2026-08-10 and added it to KEV on 2026-08-11; cite the KEV catalog for the 14 August due date or drop it.
    class: imprecision
  - where: Update 2026-08-19T05:02:00Z (VenariX paragraphs); sources[] VenariX date
    claim: states that "This brings the number of publicly confirmed downstream organizations tracked by VenariX to nine" ([VenariX, 2026-08-17]); n8n's investigation found the attacker queried 136 records ...; Framework confirmed customer data was stolen ... with payment information not included; Kilo Code's included names, email addresses, billing addresses, location data and, for a subset of users, partial or full prompts
    defect: The cited VenariX page no longer contains the quoted sentence or any of the per-victim detail (n8n 136 records/bcrypt, Framework payment exclusion, Kilo Code data categories); the page is dated 2026-08-10 and now shows "Updated Aug 24" with fifteen incidents, so the "[VenariX, 2026-08-17]" label and the verbatim quote cannot be confirmed at the URL. The facts themselves are true per the victims' own posts.
    ground_truth: 'VenariX page today: published 2026-08-10, "Updated Aug 24", "tied to fifteen publicly confirmed incidents"; no "136", "bcrypt", "location data" or "prompts". n8n: "136 records containing names and email addresses were accessed ... Five of these records contained bcrypt-hashed passwords of n8n Cloud accounts". Kilo: "partial or full prompts or user data (such as name, email address, billing address, and/or location)".'
    ground_truth_url: https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments
    fix: Cite the n8n and Kilo Code posts (and Framework's notice) for the victim detail, and mark the "nine" figure as the earlier version of the VenariX page; label the VenariX source 2026-08-10 (updated 2026-08-24).
    class: imprecision
  - where: Update 2026-08-19T05:02:00Z (Bits of Gold)
    claim: Bits of Gold separately disclosed on 2026-08-17 that an attacker gained unauthorized access to a third-party data analytics network
    defect: Bits of Gold published its notice on Sunday 2026-08-16; 2026-08-17 is the date of the DataBreaches.net/CoinDesk reports.
    ground_truth: 'DataBreaches.net (posted Aug 17): the company "reported the security breach on Sunday"; the Bits of Gold post is dated 2026-08-16.'
    ground_truth_url: https://blog.bitsofgold.co.il/security-update-august-26/
    fix: Change to "disclosed on 2026-08-16".
    class: imprecision
  - where: Update 2026-09-27T04:38:00Z (Shipup)
    claim: ran a Metabase instance that was compromised through the same CVE-2026-72898 unauthenticated SQL injection, with unauthorized access to the Shipup instance confirmed between 31 July and 17 August 2026 ... Cyberattaque.org had already separately documented Printemps, Citadium, Aroma-Zone, Micromania and Easypara ... Carrefour states no banking data or passwords were affected, and neither its own site, customer accounts nor internal systems were compromised
    defect: 'Three hedges are dropped: the source says Shipup''s compromise is "linked to" the Metabase campaign and that unauthorised access "had been possible" in the window (not confirmed); the Cyberattaque.org page names only Micromania and Easypara, the other three appear only on French Breaches; and "site, accounts, internal systems not compromised" is the outlets'' reading ("nothing in the communication suggests"), not a Carrefour statement.'
    ground_truth: 'Cyberattaque.org: "La compromission de Shipup est liée à une importante campagne de cyberattaques ayant ciblé Metabase"; "des accès non autorisés avaient été possibles entre le 31 juillet et le 17 août 2026"; "rien dans la communication consultée ne laisse penser que le site, les comptes clients ou les systèmes internes du groupe aient été compromis". French Breaches: "Des incidents similaires ont notamment été documentés concernant Printemps, Citadium, Aroma-Zone, Micromania et Easypara."'
    ground_truth_url: https://www.cyberattaque.org/carrefour-des-donnees-clients-exposees-apres-la-cyberattaque-de-son-prestataire/
    fix: Write "linked to the same campaign" and "access was possible between 31 July and 17 August"; attribute the three extra retailers to French Breaches; say the outlets read the communication as showing no compromise of Carrefour's own systems.
    class: imprecision
  - where: body paragraph 1 vs Update 2026-08-19 and sources (supersession)
    claim: Neither the vendor nor the reporting locates the injection point precisely
    defect: (low confidence) Later reporting cited in the same entry places the SQL injection in the password-reset endpoint, and the CVE record Metabase's flaw is tracked under names the /reset_password endpoint; the main analysis was not reconciled with it.
    ground_truth: 'CVE.org description: "inject arbitrary SQL via the ''/reset_password'' database endpoint"; VenariX: "a critical, CVSS 10 SQL injection vulnerability in Metabase''s password-reset functionality".'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-72898
    fix: State that, since the CVE publication, the injection is reported at the password-reset endpoint.
    class: imprecision
  - where: frontmatter techniques[]
    claim: T1552.001
    defect: (low confidence) T1552.001 is Credentials In Files; the sources say Metabase holds the connection credentials in its application database (retrieved by SQL injection), not in files; T1552 alone is supported.
    ground_truth: 'Metabase: "inject arbitrary SQL against the Metabase application database ... steal stored credentials for your connected databases".'
    ground_truth_url: https://www.metabase.com/blog/security-update
    fix: Drop T1552.001 or map the credential theft to a database-credential technique.
    class: imprecision
- entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  verdict: imprecision
  defects:
