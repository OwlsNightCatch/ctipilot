- title: 'Traefik GHSA-hrpp-p4fc-wwf8 (2026-10-21): ForwardAuth with an NTLM or Negotiate auth server lets an unauthenticated client reuse another user''s authenticated connection; fixed in 2.11.60 and 3.7.16, 3.0 to 3.6 end
    of life; judgement: drop'
  novelty: new
  borderline: true
  borderline_reason: Not in any run record. High-severity authentication bypass, but it needs ForwardAuth in front of a connection-bound auth server (NTLM or SPNEGO/Kerberos such as IIS Windows authentication), the extracted
    advisory text carries no CVSS or CVE id, no exploitation or proof of concept is reported; relevant only to Windows-authentication intranet applications published through Traefik. Reopen on a CVE id with a score or exploitation.
  sources:
  - url: https://github.com/traefik/traefik/security/advisories/GHSA-hrpp-p4fc-wwf8
    publisher: Traefik (GitHub security advisory GHSA-hrpp-p4fc-wwf8)
    date: '2026-10-21'
    role: primary
  - url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1356/
    publisher: CERT-FR (CERTFR-2026-AVI-1356, Vulnerabilite dans Traefik)
    date: '2026-10-21'
    role: corroborating
  discovery_trace: 'first seen at: anssi-fr `cert-fr avis-recent` https://www.cert.ssi.gouv.fr/avis/feed/ (CERTFR-2026-AVI-1356, 2026-10-21) -> per-advisory page (extract) -> primary: https://github.com/traefik/traefik/security/advisories/GHSA-hrpp-p4fc-wwf8
    (extract)'
  summary: Traefik's ForwardAuth middleware sends authentication subrequests through a connection pool shared by every client, so when the authentication server uses a connection-bound scheme (NTLM or SPNEGO/Kerberos Negotiate,
    for example IIS Windows authentication) a connection already authenticated by one user can be reused for another client's subrequest, and an unauthenticated client can receive a success response carrying that user's identity
    headers and reach the backend as that user. In Traefik 3.7 the same applies to external auth requests for the Kubernetes Ingress NGINX provider's auth-url annotation. The advisory is distinct from four earlier GHSA ids
    that isolated connection-bound authentication on the backend proxy paths only. Fixed in 2.11.60 and 3.7.16; v3.0 to v3.6 are end of life, affected and unpatched on their own line, so those users must move to 2.11.60 or
    3.7.16. CERT-FR lists it as a confidentiality and security-policy bypass.
