  extended_notes: 'Detection concept for the NAS class: web-server access and PHP error logs on the NAS (requests returning HTTP 500 or PHP out-of-memory messages in bursts), unexpected child processes of the PHP worker or
    web server, new files under web roots or application directories, and unexpected admin logins in QuLog Center or DSM logs; hardening lever is the vendor''s: no internet exposure, VPN, management ports restricted. The advisory
    timing matters for the PHP entry''s ''update the runtime'' action: for these devices the runtime update arrives as a firmware or package update, not a PHP version bump.'
