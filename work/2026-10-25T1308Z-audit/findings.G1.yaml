- title: 'TianoCore EDK2 PXE driver (GHSA-99cj-7hg9-mp4m, BSI WID-SEC-2026-4136, 2026-10-22): unauthenticated ICMP error messages during PXE boot corrupt DXE memory and can execute code before Secure Boot; fix is firmware-vendor
    dependent; judgement: drop'
  novelty: new
  borderline: true
  borderline_reason: Pre-boot code execution reachable by an unauthenticated network attacker during the PXE-boot window is a notable class (BSI rates it hoch), but exposure is limited to machines that PXE-boot, the fix reaches
    fleets as vendor firmware with no dates, no exploitation, no CVSS in the extracted text; no constituency exposure is established. Reopen on a firmware vendor advisory naming common server or PC lines or on exploitation.
  sources:
  - url: https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m
    publisher: TianoCore EDK2 (GitHub security advisory GHSA-99cj-7hg9-mp4m)
    date: '2026-10-22'
    role: primary
  discovery_trace: 'first seen at: bsi-de RSS (WID-SEC-2026-4136, [NEU] [hoch], 2026-10-23 10:45 GMT) -> `bsi-csaf WID-SEC-2026-4136` (reference to the GHSA, CSAF initial release 2026-10-22T22:00Z) -> primary: https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m
    (extract; the advisory''s own publication date is not shown, the BSI release date is used)'
  summary: 'During PXE boot over IPv4 or IPv6 the PXE Base Code driver (NetworkPkg/UefiPxeBcDxe) copies received ICMP error messages into a fixed 504-byte field with incorrect bounds handling in both the IPv4 and IPv6 handlers,
    so an unauthenticated attacker who can deliver a unicast ICMP error message to the client from any network distance can corrupt DXE-phase memory; a deterministic crash hangs OS provisioning, and an attacker who knows the
    firmware build can plant a counterfeit event in the same packet and have attacker bytes dispatched in ring 0 before Secure Boot or measured boot checks anything. The exposure window is the duration of the PXE boot. The
    fix is pull request 13302 in EDK2; fleets receive it only through firmware vendors. Credit: Alex Matrosov (Anthropic) and Dan Holmes-Mitra (Google).'
  region_nexus: global
  primary_sector_nexus: indirect
  sector: unspecified
  cves:
