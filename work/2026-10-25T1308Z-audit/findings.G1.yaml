- title: 'QNAP and Synology publish critical PHP2Shell advisories: QNAP QTS, QuTS hero and QuTScloud fixed builds of 2026-10-23, Note Station, QNE, QVR and TVR OS still unfixed; Synology PHP and application packages fixed,
