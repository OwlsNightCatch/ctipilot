  discovery_trace: 'first seen at: oracle-cpu https://www.oracle.com/security-alerts/cpuoct2026.html (risk-matrix tally by python over the 1295 rows: 112 rows at CVSS 9.0 or higher, 90 unauthenticated over the network, 73
    distinct ids, matching the entry''s counts; row CVE-2026-101767 is not among the entry''s cves[]) -> run-record lead: runs/2026-10-24/2026-10-24T0255Z-intel.md borderline-drop line (Oracle E-Business Suite CVE-2026-101767,
    Horizon3 write-up) -> WebSearch (''horizon3.ai attack research Oracle EBS Thin Client Framework SQL injection APPS user CVE-2026-101767'', allowed_domains horizon3.ai) -> primary: https://horizon3.ai/attack-research/vulnerabilities/cve-2026-101767/
    (extract)'
  summary: 'Oracle''s October 2026 CPU (2026-10-20) lists CVE-2026-101767 in Oracle Application Object Library (Core component) of E-Business Suite 12.2.3 to 12.2.15 at CVSS 3.1 9.8, unauthenticated over HTTP. Horizon3.ai,
    which reported it on 2026-07-24, published a write-up the same day: the flaw is in the Thin Client Framework servlet at /OA_HTML/AppsTCFServer (oracle.apps.fnd.tcf.SocketServer), ''permitted through the default EBS URL
    firewall configuration'', and gives unauthenticated SQL execution as the APPS database user that chains to operating-system commands as the EBS application account. Horizon3 names the exposure (internet-facing web tiers
    most directly; internal deployments if the servlet is reachable from another segment), an interim mitigation (remove the servlet path from the EBS URL firewall allowlist and restrict the web tier to trusted networks, which
    ''reduce exposure but do not replace patching'') and behavioural indicators: unauthenticated POSTs to the servlet that instantiate the Gantt data-server class followed by backend database activity, SQL reconnaissance (database
    version, current user, directory objects) shortly after unauthenticated web requests, and the oracle account spawning a shell through the Concurrent Manager. The covered CPU entry (no updates, ''no proof of concept found
    on 2026-10-21'') carries eleven ids and does not mention this row, the write-up or the EBS mitigation. The same risk matrices also hold pre-authentication 9.8 rows the entry does not name: Oracle APEX CVE-2026-101521 over
    HTTPS (24.1.0-24.1.21, 24.2.0-24.2.20, 26.1.0-26.1.4), the Database component''s OpenSSL row CVE-2026-75803 over TLS (19.3-19.32, 23.4.0-23.26.3), Secure Backup CVE-2026-101484 over TCP, PeopleSoft PeopleTools CVE-2026-33466
    over HTTP, Solaris CVE-2026-60432 and CVE-2026-101537, and further WebCenter, BPM, Data Integrator and SOA rows; Oracle reports no exploitation for any of them. EPSS (FIRST, 2026-10-24) is low for all of these (CVE-2026-101767
    0.0049, CVE-2026-101521 0.0052, CVE-2026-75803 0.0023).'
