  discovery_trace: 'first seen at: news lead security.nl RSS https://www.security.nl/rss/headlines.xml (headline ''QNAP adviseert offline halen NAS-systemen wegens PHP2Shell'', 2026-10-22) -> pivot: security.nl posting https://www.security.nl/posting/958512/QNAP+adviseert+offline+halen+NAS-systemen+wegens+PHP2Shell
    (extract) -> primary: QNAP QSA-26-18 https://www.qnap.com/en/security-advisory/qsa-26-18 (extract served via the reader) and QNAP statement (extract) ; Synology found by WebSearch (''PHP2Shell vendor advisory Synology
    DSM Zyxel Sophos Barracuda affected CVE-2026-109618 appliance'') -> WebFetch of Synology''s advisory index -> primary https://www.synology.com/security/advisory/Synology_SA_26_14 (extract)'
  summary: 'Neither NAS vendor appears in the PHP2Shell entries. QNAP''s QSA-26-18 (released 2026-10-22, severity Critical) lists QTS 6.1.0 and 5.2.11 and earlier, QuTS hero h6.1.0, h6.0.x and h5.2.11 and earlier, QuTScloud
    c5.2.9 and earlier, QuMagie 2.10.1 and earlier, Note Station 3 3.9.14 and earlier, QNE (ADRA) 1.0.7 and earlier, QVR Surveillance 3.0.3 and earlier (ARM32 models) and TVR OS 1.0.4 and earlier as affected by CVE-2026-109618
    and CVE-2026-109619, both triggerable before any application-level authentication. Revision V1.1 of 2026-10-24 marks QTS, QuTS hero and QuTScloud resolved with builds dated 2026-10-23 (QTS 6.1.0.3656, QTS 5.2.11.3661,
    QuTS hero h6.1.0.3656, h6.0.2.3656, h5.2.11.3661, QuTScloud c5.2.9.3661), while Note Station 3, QNE (ADRA), QVR Surveillance and TVR OS are still ''Fixing'' with no date and QuMagie 2.10.1 and earlier is named in the affected-products
    header but has no row in the fixed-version table. QNAP''s advisory says it has no reports of exploitation targeting QNAP products, but its statement of 2026-10-22 says the PSIRT ''has observed scanning activity and exploitation
    attempts targeting these vulnerabilities in the wild'' and blocked attempts against its website, store and cloud services; until a build is installed the guidance is to keep the device off the internet (no port forwarding
    or UPnP, myQNAPcloud Link off, VPN for remote access, management ports limited to trusted subnets) and to review QuLog Center for unexpected logins; PHP inside Container Station containers or third-party apps is not covered
    by QNAP updates. Synology''s Synology-SA-26:14 (2026-10-22, Critical, Resolved) rates both CVEs CVSS 3.1 9.8 and lists fixed packages: Synology Calendar 3.0.4-21435, Mail Station 30000002.3.19-20333, and PHP package builds
    7.4.33-0131, 8.0.30-0122, 8.1.34-0120, 8.2.35-0171, 8.3.36-0051 and 8.4.27-0051; the PHP 7.3 package is end of life and gets no fix. Synology says the PHP built into the DSM operating system is not exposed to external
    attack surfaces and its exploitation risk is very low, so the exposure sits in the optional PHP and web packages (Web Station sites, Calendar, Mail Station). Both are the same runtime flaws the PHP entry covers; the new
    facts are the NAS-class products, the fixed-build identifiers and QNAP''s unfixed application list.'
  region_nexus: global; NAS devices from both vendors are common in small organisations; no source ties them to a Swiss public body, the relevance runs through the Swiss PHP2Shell exposure the PHP entry documents
