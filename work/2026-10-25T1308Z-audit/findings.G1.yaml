- source_id: connectwise-trust-center
  reason: 403 on direct GET, extract (reader relayed an upstream block) and WebFetch; unreachable on every transport, same as the three previous fires. Real failure, covered_anyway false for the primary advisory page.
- source_id: bsi-de
  reason: 'bsi-rss returns only the newest 250 items (2026-10-22T12:13Z to 2026-10-23T11:25Z), too few for a 168 h sweep; recipe note: use CERT-FR and NCSC-NL for whole-window coverage and bsi-csaf per id for detail.'
- source_id: enisa-euvd
  reason: '`recent exploited|criticals|lastvulnerabilities` return 4 records each; recipe note: cross-check ids from KEV and vendor lists with `advisory <EUVD id>` (works, carries exploitedSince and epss) instead of relying
    on the lists.'
- source_id: drupal-security
  reason: 'recipe change: `extract` of per-SA pages (sa-core-2026-014 read cleanly on 2026-10-16) now returns drupal.org''s Client Challenge page (served via direct-raw, also sequentially); the RSS feed carries each advisory''s
    full summary and WebFetch reads the page: use the feed, then WebFetch.'
- source_id: chrome-releases
  reason: 'recipe note: the feed''s item links are http://; `extract` refuses http, rewrite to https:// (chromereleases.googleblog.com) before extracting.'
- source_id: msrc-update-guide
  reason: 'recipe improvement: `msrc recent 30` returns only Linux CVEs added to the monthly release; the post-publication-revision signal (incomplete fix, rescoring, exploited flag changes) is only in `msrc cvrf <release>`
    RevisionHistory (50 MB JSON) or `msrc cve <CVE>` revisions; scan descriptions other than ''Information published'' (found CVE-2026-70197).'
- source_id: paloalto-psirt
  reason: 'recipe improvement: the RSS pubDate follows the latest revision, and https://security.paloaltonetworks.com/json/<CVE> carries the dated timeline; comparing a PSIRT item''s pubDate with the covering entry''s last
    update detects revisions such as the 2026-10-25T05:25Z PHP2Shell one.'
- source_id: cisa-directives
  reason: WebFetch lists six directives without dates; no recency signal available from the listing.
