    url)'
  summary: The covered entry (last updated 2026-10-24T03:37:34Z) is titled 'no fixed release' and says the first PAN-OS hotfixes, 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16, carry an estimated date of 2026-10-26. Palo Alto's
    own timeline now records a revision at 2026-10-25T05:25Z that updated the FAQ and 'removed the ETA for 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16'. In the Product Status table those three builds now appear as '>= 10.2.18-h13',
    '>= 11.1.16-h4' and '>= 11.2.10-h16' with no date annotation, while every other fixed build keeps an ETA between 10/27 and 10/30 (12.2.4-h1 10/28; 12.1.4-h13 10/29, 12.1.7-h11 10/28, 12.1.10-h3 10/30; 11.2.4-h23 10/30,
    11.2.7-h23 10/29, 11.2.13-h4 10/27, 11.2.16-h1 10/28; 11.1.4-h38 10/29, 11.1.6-h40 10/29, 11.1.7-h12 10/30, 11.1.10-h36 10/28, 11.1.13-h16 10/27; 10.2.7-h39 10/30, 10.2.10-h42 10/29, 10.2.13-h27 10/27, 10.2.16-h12 10/28).
    The page does not say in words that the three builds are downloadable and its Solution text still reads that the issue 'will be fixed in the upcoming releases', so availability is an inference from the table convention
    and needs a check on the support portal. The FAQ now also states that current analysis shows no impact of CVE-2026-115560 (the PHP code-execution path the October releases do not fix) on PAN-OS NGFW and Panorama. Palo
