  summary: 'Pillow 13.0.0, released 2026-10-16, fixes CVE-2026-112900 (EPS images are opened by passing the file name to Ghostscript without validation, so an attacker-chosen file name can run commands on hosts with gs installed;
    Pillow 2.6.0 to 12.3.0; maintainers: moderate, CVE record: 9.2), CVE-2026-112393 (heap overflow when saving a compressed TIFF to memory, present since 2013; the reporters crashed the process and reached code execution
    only with a second address-leak flaw; CVE record 9.2), and CVE-2026-112403 (lossless JPEG thumbnail overflow, crash only; CVE record 9.2), plus two maintainer-critical fixes (stale image data after a mode change, and JPEG-decoding
    overflows including an FPX path shown to run a command from one Image.open() call when olefile is installed). The Hacker News reports that none of the flaws is known to be under attack and that CISA''s CVE-record analysis
    marks no known exploitation for the EPS flaw and a public proof of concept for the TIFF one. Upgrading to 13.0.0 (which drops Python 3.10) fixes all; stopgaps are keeping gs off upload-processing hosts, avoiding draft()
    and thumbnail() on untrusted JPEGs, and treating in-memory TIFF saves of user images as sensitive. EPSS for CVE-2026-112900 is 0.0043.'
