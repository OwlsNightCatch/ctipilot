  - claim_id: 0349ed86d5
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "summary"
    kind: frontmatter
    text: "The nginx 1.30.6 (stable) and 1.31.7 (mainline) releases of 2026-10-14 fix five security flaws, three of them heap-corruption bugs that F5 scores CVSS 4.0 9.2 and an unauthenticated attacker can reach with crafted HTTP requests, but only on configurations that combine alias with rewrite and $request_filename, use a regex map whose captures are referenced before its output variable, or enable asynchronous file I/O with server-side includes; the other two concern HTTP/3 and TLS session ticket key rotation. F5 says the heap flaws restart the worker, with code execution only where ASLR is disabled or bypassed; no exploitation or public proof of concept is reported, nginx.org rates all five medium, and Debian fixed trixie with DSA-6575-1 while its bookworm package is still marked vulnerable."
  - claim_id: 6a9d7c2f7d
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "section 2026-10-25T14:03:33Z"
    kind: cited
    text: "Debian fixed the five flaws in trixie with DSA-6575-1, which ships nginx 1.26.3-3+deb13u10 in trixie-security ("
    urls: ["https://security-tracker.debian.org/tracker/DSA-6575-1"]
  - claim_id: 467fc34571
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
