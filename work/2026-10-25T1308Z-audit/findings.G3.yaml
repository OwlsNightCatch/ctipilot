    type: campaign
    name: Operation FlashHole
    aliases: []
    summary: Kaspersky name for a Lazarus campaign abusing INISAFE CrossWeb EX in South Korea with a GitHub-API C2 downloader (Securelist, 2026-10-21).
  relation_suggestions:
  - subject: campaign:operation-flashhole
    object: actor:lazarus-group
    basis: Kaspersky attributes Operation FlashHole to the Lazarus Group (Securelist, 2026-10-21)
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
