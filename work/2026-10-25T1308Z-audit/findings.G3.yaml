    primary: https://nordlayer.com/intelligence/ransomware-statistics/ (the page is a rolling quarterly page marked "Last updated: October 2026")'
  summary: |
    Nord Security counted 2,894 ransomware incidents on 200+ monitored leak sites in July to September 2026, 8.6% above Q2 and nearly 50% above Q3 2025, with The Gentlemen (383) ahead of Qilin (363) by 20, each with more than three times the victims of any group below them; the United States accounts for 805 incidents and two in three victims had 200 employees or fewer. Nord attributes the rise to affiliates regrouping after the LockBit, BlackCat and RansomHub disruptions, says The Gentlemen's founder is a former top Qilin affiliate who split over an unpaid cut and offers a 90% share, that both groups enter through stolen credentials and exposed VPNs, that The Gentlemen rely on in-house tooling built to kill security software and Qilin uses AI for personalised phishing, and that more groups skip encryption for data-theft extortion. Leak-site counts are claims, not confirmed victims; the Infosecurity article gives no European, Swiss or government breakdown.
  region_nexus: global; US 805 incidents; no Swiss or EU split in the coverage
  primary_sector_nexus: none stated
  sector: other
  cves: []
  techniques: []
  affected_products: []
  entity_keys:
  - actor:thegentlemen
  new_entities: []
  verification: MULTI-SOURCE
  confidence: MEDIUM
  classification_hint: C2 (vendor statistics from leak-site claims, relayed by trade press)
  novelty: new
  borderline: true
  borderline_reason: 'Periodic vendor statistics from leak-site claims: no technique, vector or constituency figure; useful only as ranking context
