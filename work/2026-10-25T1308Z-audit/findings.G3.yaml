  borderline_reason: |
    South Korea only: the abused software is mandatory Korean online-banking and e-government security middleware that Swiss estates do not run; no European victim. Transferable detection concepts only: GitHub API issue and file traffic as C2 from non-developer hosts, and DLL side-loading under a legitimate-looking system DLL name.
  evidence:
