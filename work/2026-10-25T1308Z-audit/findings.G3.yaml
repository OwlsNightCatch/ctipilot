items:
- title: 'Sophos X-Ops IR case: vishing for an SMS reset code, a freshly registered Entra device with a Primary Refresh Token, Graph reconnaissance
    and a ServiceNow user-table export from one compromised Microsoft 365 identity'
  sources:
  - url: https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
    publisher: Sophos X-Ops
    date: '2026-10-19'
    role: primary
  - url: https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft
    publisher: Mandiant / Google Threat Intelligence
    date: '2026-01-31'
    role: background
  discovery_trace: 'first seen at: sophos-xops, feed https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (item dated 2026-10-19) ->
    primary (no pivot needed): https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
    -> background pivot (Sophos cites it for the same vishing-to-SSO-to-SaaS pattern): https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft'
  summary: |
    Sophos X-Ops Incident Response describes a customer intrusion in which a caller impersonated the help desk, obtained the SMS verification code of a self-service password reset (SSPR) flow from one employee, and reset the password from attacker infrastructure (an earlier SSPR initiation from an anomalous address the day before may have been probing). Within minutes the actor registered a new Windows device in Entra ID and used its Primary Refresh Token for sign-ins, so later federated SAML sign-ins to Salesforce and ServiceNow showed MFA as previously satisfied. From that single identity the actor ran Graph API reconnaissance (licence details, organization, tenant relationships, transitive directory-role assignments, owned service principals, verified domains), searched SharePoint for terms such as password, cred, aws, vpn and ssh (plus the name of the organisation's own identity-verification vendor) and downloaded roughly 100,000 SharePoint files, and exported the ServiceNow sys_user table (about 2,500 records) while browsing the CMDB computer table; Salesforce's own anomaly containment froze that session. No inbox rules, forwarding or new applications were created; the only cleanup was deleting the organisation's own vishing-warning email from the mailbox. Sophos notes that Teams message reads are not audited and assesses that no single step was novel, the assembly (vishing at the front, federated SaaS pivot at the back) being the point. Single customer case; Mandiant described the same vishing-to-SSO-to-SaaS pattern in January 2026.
  region_nexus: global; no Swiss victim; the exposed pattern is any Microsoft 365 / Entra tenant with SMS-based SSPR and help-desk-assisted resets
  primary_sector_nexus: indirect (generic public-sector M365/Entra estate)
  sector: public-sector
  cves: []
  techniques:
  - T1566.004
  - T1684.001
  - T1078.004
  - T1098.005
  - T1087.004
  - T1213.002
  - T1114.002
  - T1567
  - T1070.008
  - T1552.001
