- title: 'Google: Chrome Enhanced Protection now flags ClickFix commands at copy time and adds Gemini-based scam verdicts'
  sources:
  - url: https://blog.google/security/our-latest-defenses-against-evolving-web-scams/
    publisher: Google Chrome Security
    date: '2026-10-20'
    role: primary
  discovery_trace: 'first seen at: google-tag slice record, feed https://blog.google/security/rss/ (read directly; item dated 2026-10-20 17:00)
    -> primary (no pivot needed): https://blog.google/security/our-latest-defenses-against-evolving-web-scams/'
  summary: |
    Google describes 2026 additions to Safe Browsing Enhanced Protection in Chrome: two-tier suspicious and dangerous site warnings, a server-side Gemini model that scores page content (brand, intent, scam likeliness) for tech-support, fake antivirus and fake browser-update scams, and a ClickFix control: when an Enhanced Protection user copies a command that looks like a ClickFix script, the clipboard payload is scrubbed of personal data and sent to Safe Browsing, and a dangerous verdict produces a warning. Google says ClickFix commands almost always call living-off-the-land binaries and that moving the download from the browser to the terminal sidesteps Chrome's download protections; the feature is described as high precision to avoid disrupting developers, and page text is sent to the server only for high-confidence scam indicators and processed ephemerally.
  region_nexus: global
  primary_sector_nexus: indirect (browser hardening lever)
  sector: public-sector
  cves: []
  techniques:
  - T1204.004
  affected_products:
  - Google Chrome
  entity_keys: []
  new_entities: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  classification_hint: A2 (vendor describing its own product feature)
  novelty: new
  borderline: true
  borderline_reason: |
    A vendor feature announcement, not threat research: the lever applies only where Enhanced Protection is enabled (a Chrome Enterprise policy choice that sends URLs, and for ClickFix verdicts clipboard text and page text, to Google, which a government data-protection review may not accept), and no store entry mentions it. At most a hardening line on the ClickFix material; no actors, victims or telemetry.
  evidence:
  - quote: To combat this technique, Chrome now detects when an Enhanced Protection user is tricked into copying suspicious commands.
    attribution: Google Chrome Security
    source_url: https://blog.google/security/our-latest-defenses-against-evolving-web-scams/
  - quote: attackers completely sidestep existing Chrome and Safe Browsing download protections
    attribution: Google Chrome Security
    source_url: https://blog.google/security/our-latest-defenses-against-evolving-web-scams/
