- title: 'Kaspersky: Lazarus Operation FlashHole abuses CrossWeb EX in South Korea with a GitHub-issue C2 downloader and an in-memory chain'
  sources:
  - url: https://securelist.com/lazarus-operation-flashhole/121541/
    publisher: Kaspersky GReAT (Securelist)
    date: '2026-10-21'
    role: primary
  discovery_trace: 'first seen at: kaspersky-securelist, feed https://securelist.com/feed/ (item dated 2026-10-21) -> primary (no pivot needed):
    https://securelist.com/lazarus-operation-flashhole/121541/'
  summary: |
    Kaspersky analyses Operation FlashHole, a Lazarus campaign first answered in January 2026 whose earliest evidence dates to July 2025: spear-phishing links to AI-generated portfolio and résumé pages hosted on GitHub Pages lead to a mandatory South Korean financial security program (INISAFE CrossWeb EX) spawning fsquirt.exe with injected shellcode (TechHub), then persistence through DLL side-loading as mscoree.dll (TouchHub, TouchShift) and in-memory deployment of the Cubridge orchestrator, ClientHub and LPEClient. TechHub's C2 uses a private GitHub repository through the GitHub API (issues as handshake and status, files named by host ID for encrypted exchange). Kaspersky found at least three victims in South Korean software, construction and wired communication equipment manufacturing. Kaspersky attributes the operation to Lazarus and links the tooling to Mandiant's CLOUDBURST/SIDESHOW and ESET's NickelLoader/LightlessCan.
  region_nexus: South Korea only
  primary_sector_nexus: none
  sector: other
  cves: []
  techniques:
  - T1189
  - T1566.002
  - T1574.001
  - T1102
  - T1620
  - T1105
  affected_products:
  - INISAFE CrossWeb EX
  entity_keys:
  - actor:lazarus-group
  new_entities:
