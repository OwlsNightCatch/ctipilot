- 'WebSearch is not date-aware: queries for October 2026 research returned mostly older material, so the feed and listing sweep is the effective
  collection path; searches were useful only for confirming periodic-report publication dates.'
- A sweep of the Microsoft whole-blog feed catches security research that the Threat Intelligence topic page omits; consider making it the msft-ti
  record recipe.
- 'extract on raw-HTML hosts (hadrian, team-cymru, helpnet, ibm, reliaquest, bitdefender) returns a full HTML body: parse anchors rather than
  printing it.'
