  - product:microsoft-entra-id
  - product:microsoft-365
  - product:microsoft-sharepoint-online
  - product:microsoft-exchange-online
  - product:servicenow
  - product:salesforce
  new_entities: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  classification_hint: B2 (first-hand IR case from a telemetry-holding vendor, single source; pattern corroborated at class level by Mandiant,
    January 2026)
  novelty: new
  borderline: true
  borderline_reason: |
    The 2026-10-21, 2026-10-22 and 2026-10-23 intel fires each returned it from S3 and dropped it as one customer case of a well-known pattern. The audit may reverse that: the write-up gives concrete Entra/M365 telemetry hooks and levers a public-sector tenant can act on (SMS/voice removed from SSPR for non-admins, Conditional Access on 'register or join devices', alert on device registration shortly after a reset, hunts in GraphApiAuditEvents, SearchQueryInitiatedSharePoint and bulk-export events in federated SaaS), and no published entry covers SSPR abuse. Recommended disposition if reopened: notable, vulnerability-free threat entry, Admiralty B2.
  evidence:
  - quote: Approximately 100,000 unique SharePoint files downloaded
    attribution: Sophos X-Ops
    source_url: https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
  - quote: Alert on any new device registration within a short window of a password reset, MFA method change, or anomalous sign-in
    attribution: Sophos X-Ops
    source_url: https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
  - quote: it does not audit the passive viewing of existing messages in chats and channels a user already has access to
    attribution: Sophos X-Ops
    source_url: https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
  - quote: No single step in this intrusion was novel.
    attribution: Sophos X-Ops
    source_url: https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion
  extended_notes: |
    Exposure: tenants where SSPR accepts SMS, voice or email OTP for non-admin users and where device registration is not gated by Conditional Access with MFA; check the SSPR authentication-method policy and the 'Register or join devices' user action. Detection (telemetry class first): Entra audit log (SSPR completion followed within minutes by a device registration), Entra sign-in log (PRT-satisfied sign-ins and SAML sign-ins to downstream apps with MFA 'previously satisfied' from a session that has never used them), Defender XDR GraphApiAuditEvents (directory, role and service-principal enumeration from one user session), Purview unified audit log (SearchQueryInitiatedSharePoint with credential-themed terms, bulk file downloads, MailItemsAccessed, deletion of the organisation's own security-awareness mail), and federated-SaaS audit logs (bulk export of identity or CMDB tables). Triage: a user enrolling a genuine new laptop also registers a device after a reset; the discriminators are an SSPR or sign-in from an address, ASN or country never seen for that user, no corresponding managed-enrolment record, and Graph enumeration or bulk SharePoint reads within the same session. Containment: revoke sessions and refresh tokens at the identity provider and in every federated SaaS platform, not only reset the password. Sophos's detections and ITDR checks are product marketing and were left out.
- title: Microsoft Threat Intelligence confirms the LiteLLM 1.107.0 collector ran on Windows and macOS endpoints and publishes behavioural hunts
    and recovery order
  update_target: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
    publisher: Microsoft Threat Intelligence (Microsoft Security Blog)
    date: '2026-10-23'
    role: primary
  discovery_trace: 'first seen at: msft-ti slice record, WebFetch https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (the
    TI topic page did NOT list this post; latest there was the 2026-10-21 ARTEX post) -> pivot: whole-blog feed https://www.microsoft.com/en-us/security/blog/feed/
    (via tools/fetch_source.py feed) listed it dated 2026-10-23 -> primary: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/'
  summary: |
    The published entry rests on Socket, Wiz, Aikido and the maintainers' own posts. Microsoft's 2026-10-23 analysis adds first-party endpoint telemetry: the recovered collector's discovery, encryption and outbound-connection behaviour was observed on Windows and macOS endpoints (in one Windows example a routine Python invocation to install an unrelated dependency activated it), so exposure is not limited to Linux gateways and containers, and developer workstations and build agents on any OS that started Python with the package installed are in scope. It describes the two startup paths (a .pth path-extension file that imports a collector, and a Unix-oriented sitecustomize loader that polls a GitHub-hosted pointer and would fetch and execute Python from the server it names; Microsoft says retrieval and execution were not confirmed), the collector's AES-256-CBC archive with an RSA-4096 OAEP-wrapped key staged through OpenSSL in temporary directories with a distinctive prefix, a single-run marker and environment-variable gate, and an HTTP POST labelled as a health check. It gives behavioural hunts (OpenSSL public-key encryption with that staging prefix, an inline 'python -c' that queries the proxy's credential and model tables and suppresses output, connections to the collector host) and Defender detection names, maps the persistence to Python Startup Hooks (T1546.018), and states that removing the package or a release tag is not sufficient recovery: isolate, do not start python or pip inside the suspect environment, inspect from a clean machine, rebuild, rotate every reachable credential from a clean machine and revoke sessions rather than assume rotation ends them. Microsoft has not determined how the attacker first reached the upstream environment and defers to the maintainers' account.
  region_nexus: global; developer and CI estates, including Swiss public-sector software teams using LiteLLM or Python tooling
  primary_sector_nexus: indirect
  sector: public-sector
  cves: []
  techniques:
  - T1195.001
  - T1546.018
  - T1059.006
  - T1552.001
  - T1560.001
  - T1041
  - T1027.013
  - T1140
  - T1555.003
  affected_products:
  - LiteLLM
  entity_keys:
  - product:litellm
  - product:berriai-litellm
  new_entities: []
  verification: MULTI-SOURCE
  confidence: HIGH
  classification_hint: 'A/B1 as an addition: Microsoft is a telemetry-holding first-hand analyst; the compromise is corroborated by Socket, Wiz,
    Aikido and the maintainers'
  novelty: update-of:2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
  what_is_new: |
    Windows and macOS endpoint execution confirmed (the entry's Exposure and Detection read as container and Linux oriented); Microsoft's behavioural hunts (OpenSSL staging with a distinctive prefix, inline python -c database collection) and Defender detection names; T1546.018 mapping; vendor recovery order (rebuild, revoke sessions); an independent third-party confirmation that start-up alone can activate the collector without importing LiteLLM.
  evidence:
  - quote: Endpoint observations on Windows and macOS matched the recovered collector’s discovery, encryption, and outbound-connection behavior.
    attribution: Microsoft Threat Intelligence
    source_url: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
  - quote: In one Windows example, a routine Python invocation to install an unrelated dependency activated the collector.
    attribution: Microsoft Threat Intelligence
    source_url: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
  - quote: Removing the package or a release tag is not sufficient recovery.
    attribution: Microsoft Threat Intelligence
    source_url: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
  - quote: Do not run python, pip, or other commands that invoke the affected interpreter during evidence collection
    attribution: Microsoft Threat Intelligence
    source_url: https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
  extended_notes: |
    Suggested changelog record type: improvement (or update with a reader-facing section). Detection (telemetry class first): process-creation events with parent lineage for OpenSSL public-key encryption whose command line stages files in a temporary directory with a '.pc_' prefix, python processes started with an inline -c program that names LiteLLM proxy credential and model tables and suppresses output, file events for startup files in the Python library directory outside the package directory, and DNS/proxy logs for the collector host. Triage: package presence alone is not a verdict; Microsoft says to correlate hashes, Python process ancestry, the encryption staging, network destination and later identity use.
- title: 'Wazza: a multi-stage Microsoft 365 device-code phishing kit delivered by PDF lures from compromised mailboxes, tracked since July 2026'
  sources:
  - url: https://www.levelblue.com/blogs/spiderlabs-blog/inside-wazza-a-newly-observed-device-code-phishing-kit-targeting-microsoft-365-accounts
    publisher: LevelBlue SpiderLabs
    date: '2026-10-20'
    role: primary
  - url: https://thehackernews.com/2026/10/wazza-phishkit-targets-banking.html
    publisher: The Hacker News (ANY.RUN-contributed)
    date: '2026-10-08'
    role: corroborating
  - url: https://www.huntress.com/blog/unboxing-phishing-kits
    publisher: Huntress
    date: '2026-10-22'
    role: background
  discovery_trace: 'first seen at: extra probe of trustwave-spiderlabs (not in the G3 slice), extract https://www.levelblue.com/blogs/spiderlabs-blog
    (item dated 2026-10-20; the 2026-10-23 S1 findings note it as "S3 scope" and no S3 fire returned or dropped it) -> primary: https://www.levelblue.com/blogs/spiderlabs-blog/inside-wazza-a-newly-observed-device-code-phishing-kit-targeting-microsoft-365-accounts
    -> corroborating pivot (LevelBlue cites it): https://thehackernews.com/2026/10/wazza-phishkit-targets-banking.html (ANY.RUN, 2026-10-08, outside
    the window)'
  summary: |
    LevelBlue SpiderLabs tracks multiple waves of Wazza, active since at least early July 2026 and ongoing: emails from compromised mailboxes carry business-themed PDFs (mostly images with SharePoint branding and hyperlink annotations) whose links lead, directly or through a Google Sites page that embeds attacker content, to a staging script that picks one of 19 brand themes, gates visitors (WebDriver, headless and DevTools checks, a Cloudflare Turnstile challenge, token minting, decoy corporate homepages shown to anyone who fails the routing checks) and finally redirects to a Cloudflare Workers-hosted page presenting an Adobe, DocuSign or OneDrive style 'document verification code'. That page asks Microsoft's OAuth device-authorization endpoint for a real device code, shows it to the victim and polls its backend until the authentication completes, so the operator ends with the victim's tokens instead of a password; a later wave renamed its routing sub-domains and removed some routing checks. The earlier ANY.RUN analysis, relayed by The Hacker News on 2026-10-08, says banking, manufacturing and government organisations in the US, Europe and Australia were targeted (vendor-contributed article; no victim counts and no actor named by either source). Huntress, writing about device-code phishing in general on 2026-10-22, says the vast majority of Microsoft environments do not need the device-code flow, which is the standing hardening lever.
  region_nexus: US, Europe and Australia per ANY.RUN; decoy homepages use European-sounding business personas (private bank, law firm, clinic);
    no Swiss victim named
  primary_sector_nexus: indirect (government among targeted sectors per ANY.RUN)
  sector: public-sector
  cves: []
  techniques:
  - T1566.001
  - T1566.002
  - T1528
  - T1078.004
  - T1204.001
  - T1583.006
  affected_products:
  - Microsoft Entra ID
  - Microsoft 365
  entity_keys:
  - product:microsoft-entra-id
  - product:microsoft-365
  new_entities:
  - key: tool:wazza-phishing-kit
    type: tool
    name: Wazza phishing kit
    aliases:
    - Wazza
    summary: Multi-stage Microsoft 365 device-code phishing kit using PDF lures, Google Sites and Cloudflare Workers staging, tracked since July
      2026 (LevelBlue SpiderLabs, 2026-10-20; ANY.RUN, 2026-10-08).
  verification: MULTI-SOURCE
  confidence: MEDIUM
  classification_hint: B2
  novelty: new
  borderline: true
  borderline_reason: |
    Device-code phishing as a technique class is already in the store (EvilTokens, Kali365, the 2026-10-19 calendar-invite and 2026-10-23 token-spray entries); LevelBlue's detection section is URL, parameter and infrastructure level (IOC-grade), neither source names an actor or a Swiss victim, and the government-targeting claim comes from a vendor-contributed article. Worth a short notable entry or a changelog record on a device-code entry only if the audit wants the kit named; the hardening lever (block the device-code flow in Conditional Access) is already carried elsewhere.
  evidence:
  - quote: Active since at least early July 2026 and ongoing as of writing.
    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/inside-wazza-a-newly-observed-device-code-phishing-kit-targeting-microsoft-365-accounts
  - quote: abuses Microsoft OAuth device authorization to obtain a verification code and direct the victim through the authentication process.
    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/inside-wazza-a-newly-observed-device-code-phishing-kit-targeting-microsoft-365-accounts
  - quote: The phishing emails we identified originated from compromised email accounts and contain business-themed PDF lures with malicious links.
    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/inside-wazza-a-newly-observed-device-code-phishing-kit-targeting-microsoft-365-accounts
  - quote: Restrict or block device-code authentication where possible.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/unboxing-phishing-kits
  extended_notes: |
    Detection (telemetry class first): Entra sign-in logs showing the device-code authentication flow for users who never use it, from addresses unrelated to the user, minutes after a PDF-bearing mail from an external or compromised sender; mail-flow and proxy logs for PDF attachments whose links go to Google Sites pages or very long randomised Cloudflare Workers host names; browsers requesting a device-code page followed by a Microsoft device-login visit. Triage: legitimate device-code use is kiosk, CLI and TV-style sign-in, so the discriminator is a user with no such device sign-in in their history and a document-themed lure context. No IOCs retained.
- title: 'Semperis: Iran-linked Prince of Persia (Infy) resumes after a three-month pause with new C2 hosting, including US shared hosting for
    its Tornado second stage'
  sources:
  - url: https://www.semperis.com/blog/prince-of-persia-threat-group-hiding-in-plain-sight/
    publisher: Semperis Research
    date: '2026-10-22'
    role: primary
  - url: https://www.infosecurity-magazine.com/news/iranian-hacking-group-hosting-c2/
    publisher: Infosecurity Magazine
    date: '2026-10-22'
    role: corroborating
  discovery_trace: 'first seen at: infosec-magazine, feed https://www.infosecurity-magazine.com/rss/news/ item "Iranian Hacking Group Found Hosting
    C2 Infrastructure in the US" (2026-10-22) -> pivot: https://www.infosecurity-magazine.com/news/iranian-hacking-group-hosting-c2/ (fetched,
    single outbound link) -> primary: https://www.semperis.com/blog/prince-of-persia-threat-group-hiding-in-plain-sight/'
  summary: |
    Semperis (Tomer Bar, formerly SafeBreach Labs) reports that the Iran-linked Prince of Persia group (Infy; first-stage Foudre, second-stage Tonnerre, newest Tornado) went dark from March 2026, the longest gap in about two decades, resumed exfiltration on 2026-05-27, abandoned its long-used European hosting ranges, and for the first time in a decade placed a Tornado second-stage C2 on US shared hosting (from July 2026), then began a Cloudflare-fronted one in August. Tornado, first reported by SafeBreach in February 2026 and delivered through one-day exploits such as WinRAR, uses HTTPS plus the Telegram bot API as C2, a domain-generation algorithm, blockchain-field C2 re-routing and RSA signature checks that lock out sinkholing; Tonnerre exfiltrated more than 1,800 files from one masked victim in the first week of activity. Semperis says victim numbers remain low and describes targets as Iranian dissidents and public and private organisations in the US, Europe and the Middle East; it infers (cannot prove) that the pause reflects geopolitical downtime tied to the US-Iran conflict. Mitigation advice is generic: update operating systems and monitor unusual Telegram traffic.
  region_nexus: Europe among named target regions; no Swiss victim, sector or vector named
  primary_sector_nexus: indirect
