  summary: |
    Zimperium describes two Android evidence sources: Delegated Scope, which lets an MDM grant a security application access to Security Logging (process starts with file hashes, adb shell commands) and Network Logging (package-attributed DNS) on managed devices, and Intrusion Logging, introduced in 2026 under Android Advanced Protection, which on supported devices (initially Pixel with Android 16 or later) lets an opted-in owner keep encrypted security, DNS and connection logs for twelve months and share them for analysis (Amnesty International's Security Lab was a design partner); the setting must be enabled before an incident. It applies both to its RatHat case (an Android threat that combines Accessibility abuse with Wireless Debugging self-pairing to reach a UID 2000 shell and stage daemons outside the app lifecycle; Zimperium's first RatHat analysis is dated 2026-09-16, outside the window). Product-flavoured blog.
