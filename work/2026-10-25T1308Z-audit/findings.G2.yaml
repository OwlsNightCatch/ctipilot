    attribution: Inside IT
    source_url: https://www.inside-it.ch/thurgauer-medienwerkstatt-meldet-cybervorfall-20261023
  - quote: Im Darknet hat sich die Ransomware-Gruppe Akira zu dem Angriff auf die Medienwerkstatt bekannt. Sie behauptet, 130 Gigabyte an Daten erbeutet zu haben.
    attribution: Inside IT
