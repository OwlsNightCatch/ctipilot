    attribution: heise security
    source_url: https://www.heise.de/news/GoDaddy-widerruft-Hunderttausende-Zertifikate-aufgrund-formaler-Fehler-11496900.html
  - quote: Diese Frist lief am 18. Oktober aus; zu dem Zeitpunkt hatte GoDaddy weniger als die Hälfte der Zertifikate widerrufen.
    attribution: heise security
    source_url: https://www.heise.de/news/GoDaddy-widerruft-Hunderttausende-Zertifikate-aufgrund-formaler-Fehler-11496900.html
