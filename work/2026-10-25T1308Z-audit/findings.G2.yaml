- title: Medienwerkstatt (Sulgen TG, Mattenbach group), a media and production service provider, confirms a cyber incident first seen on 2026-10-09; Akira lists it
    with a 130 GB claim
  sources:
  - url: https://www.inside-it.ch/thurgauer-medienwerkstatt-meldet-cybervorfall-20261023
    publisher: Inside IT
    date: '2026-10-23'
    role: primary
  - url: https://www.ransomware.live/id/TWVkaWVud2Vya3N0YXR0QGFraXJh
    publisher: Ransomware.live (leak-site tracker, claim only)
    date: '2026-10-22'
    role: corroborating
  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item thurgauer-medienwerkstatt-meldet-cybervorfall-20261023) → primary:
    Inside IT article relaying the company website statement, URL https://www.inside-it.ch/thurgauer-medienwerkstatt-meldet-cybervorfall-20261023 → pivot: ransomware.live
    recentvictims API, URL https://api.ransomware.live/v2/recentvictims → claim page, URL https://www.ransomware.live/id/TWVkaWVud2Vya3N0YXR0QGFraXJh ; the company''s
    own statement page was not reachable (medienwerkstatt.ch connection reset on the direct transport, empty on extract) and WebSearch ("Medienwerkstatt Sulgen Cybervorfall
    Mitteilung Mattenbach-Gruppe") found nothing'
  summary: Inside IT, relaying the company's own website notice, reports that Medienwerkstatt detected unusual activity on 2026-10-09, cut the affected IT systems
    from the network, started a forensic investigation, and found that attackers copied business contact data, production and order data and image files; the company
    says only the Sulgen site is affected, has told the Federal Data Protection Commissioner and the police, is informing affected customers directly, has restored
    the systems and operations from backups, and says it made no concessions to the attackers. The company does not name an actor or a demand. On the leak site, the
    Akira group lists Medienwerkstatt and claims 130 GB of names, addresses, phone numbers, customer data and contracts; Ransomware.live first saw the listing on
    2026-10-22. That is a claim by the criminals, corroborated only as far as the company confirms an intrusion and data copying. The access vector, dwell time and
    whether encryption occurred are not stated, and no source says the firm serves public bodies.
  region_nexus: switzerland (canton of Thurgau)
  primary_sector_nexus: indirect
  sector: media-and-printing services (private)
  cves: []
  techniques:
  - T1657
  affected_products: []
