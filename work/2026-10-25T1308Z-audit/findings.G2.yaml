    → pivot: heise, URL https://www.heise.de/news/Massenhaft-AfD-Daten-widerrechtlich-migriert-11493666.html'
  summary: 'heise reports a hacktivist leak of internal AfD (German political party) communication: a 280 GB data set with about 420,000 emails from ten mailboxes
    (among them the party arbitration court and the federal office), more than 41,000 PDFs and SQL database dumps, published as a torrent and on a searchable site.
    The party confirmed on 2026-10-20 that a hosting provider was attacked at the start of September and that large amounts of data left, and the BSI is in contact
    with the party. heise reported on 2026-10-21 that the Berlin data protection authority had received no loss notification and on 2026-10-23 that the party has
    since notified it. Two anonymous people told Zeit Online they were behind it and that the party''s hundreds of domains and systems gave them several entry points;
    the perpetrators'' statement as relayed by heise says an outdated website was the way in, which is their claim and not the party''s account. heise quotes a security
    consultant who sees hacktivism, not an insider. These are claims by the perpetrators and statements by the victim; there is no vendor or CVE and no public-sector
    body is affected.'
