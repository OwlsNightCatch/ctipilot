  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022) → primary:
    Inside IT article, URL https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022 → pivot: WebSearch ("Neuchâtel SIEN PHP sites désactivés
    ne.ch communes faille") → Yle, URL https://yle.fi/a/74-20252600 → Reuters via Devdiscourse, URL https://www.devdiscourse.com/article/international/3995811-french-prefecture-websites-taken-offline-temporarily-amid-wait-for-php-fix-interior-ministry-says
    → AFP via Khaleej Times, URL https://www.khaleejtimes.com/world/us-spy-agency-worldwide-website-updates-cybersecurity-flaws → SwissCybersecurity.net update, URL
    https://www.swisscybersecurity.net/news/2026-10-21/kritische-php-sicherheitsluecken-machen-websites-angreifbar'
  summary: 'The published PHP2Shell entry carries the Basel-Stadt, Cyon, University of Geneva and UK government precautions but not the other cantonal and European
    ones in the sources read here. Inside IT reports, from the canton''s own communication, that Neuchâtel deactivated all PHP-based websites, ne.ch and numerous
    communal sites included, that the cantonal IT department SIEN applied the fix, and that ne.ch was to be reachable again the same evening. Yle reports that Finland''s
    Government ICT Centre Valtori began taking public government web services offline on 2026-10-21 before the patches existed, and Reuters carries the French Interior
    Ministry''s statement that prefecture websites were taken offline pending the patch. AFP reports that the US NSA urged organisations to take websites offline
    if they cannot fix at once, which matches the EU joint statement the entry already cites. SwissCybersecurity.net adds Risikomonitor''s 2026-10-22 scan of roughly
    690,000 servers with a Swiss connection, with a little over 23,000 (about 3.5 percent) still affected; Inside IT''s reading of the same tracker at its research
    time on 2026-10-22 shows 20,231 of 576,549 checked servers (3.5 percent) still affected, so the two counts differ in sample and time and neither is like for like.
    The decision value is marginal: the entry already tells readers to update every PHP host and to take unpatched ones off the network; these items add precedent
    for Swiss cantonal and communal operators and no new technique.'
  region_nexus: switzerland (canton of Neuchâtel and its communes); europe (Finland, France)
