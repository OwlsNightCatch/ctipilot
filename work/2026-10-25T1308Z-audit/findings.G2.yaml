- title: GoDaddy must revoke 404,607 TLS certificates (Starfield DV hierarchies, customers of Host Europe and DomainFactory) because the certificate policy text did
    not match them; the five-day deadline lapsed on 2026-10-18
  sources:
  - url: https://www.heise.de/news/GoDaddy-widerruft-Hunderttausende-Zertifikate-aufgrund-formaler-Fehler-11496900.html
    publisher: heise security
    date: '2026-10-22'
    role: primary
  discovery_trace: 'first seen at: heise-sec RSS, URL https://www.heise.de/security/feed.xml (item GoDaddy-widerruft-Hunderttausende-Zertifikate-aufgrund-formaler-Fehler-11496900)
    → primary: heise article, URL https://www.heise.de/news/GoDaddy-widerruft-Hunderttausende-Zertifikate-aufgrund-formaler-Fehler-11496900.html'
  summary: 'heise reports that GoDaddy is recalling 404,607 certificates that are technically sound but do not match its CP/CPS documentation, across eight hierarchies,
    mostly domain-validated certificates under the Starfield R1 DV and G2 DV hierarchies issued to customers of the German hosting brands Host Europe and DomainFactory.
    Under the CA/Browser Forum baseline requirements a certificate must be revoked within five days; that deadline expired on 2026-10-18 with fewer than half revoked,
    and GoDaddy opened a second incident report on 2026-10-16 to document the breach of the deadline. GoDaddy told heise it had already issued replacements for all
    affected Host Europe and DomainFactory customers and replaced old ones automatically where possible, with customers given until the evening of 2026-10-21 to swap
    the rest. There is no attacker behaviour: the defender consequence is TLS failures on sites whose certificate was not replaced.'
  region_nexus: global; germany (Host Europe, DomainFactory)
  primary_sector_nexus: indirect
  sector: digital infrastructure (WebPKI)
  cves: []
  techniques: []
  affected_products:
  - GoDaddy TLS certificates (Starfield DV)
  entity_keys: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: new
  evidence:
