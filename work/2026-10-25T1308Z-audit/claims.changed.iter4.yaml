  - claim_id: 00e5273012
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "summary"
    kind: frontmatter
    text: "QNAP's advisory QSA-26-18 says the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2) affect the PHP in the web components of QTS, QuTS hero, QuTScloud and several QNAP applications and can be triggered before any application-level authentication. Fixed QTS, QuTS hero and QuTScloud builds dated 2026-10-23 are out; Note Station 3, QNE (ADRA), QVR Surveillance (ARM32) and TVR OS have no fix yet, QuMagie is listed as affected without a fix row, and QNAP says to keep devices off the internet until fixes ship. QNAP has seen scanning and exploitation attempts against the flaws in the wild but no reports of exploitation targeting its products. Synology's advisory fixes its PHP packages (except the end-of-life PHP 7.3), Mail Station and Calendar and rates the PHP built into DSM as not exposed."
