    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-29T22:50:37Z"
    kind: uncited
    text: "The dispute over what left Dodo's warehouses is the point this entry has made since August: the reach of a compromised Metabase instance is whatever its stored connections reach, and the vendor's statement of what the BI tool itself held does not bound it."
