    surface: "body"
    kind: derived
    text: "**Defender takeaway:** apply the October 2026 update to the six 10.0 components first wherever they are reachable beyond the management network, then to the WebLogic and Identity Manager rows; where a patch cannot go in at once, take T3, IIOP and the administration console off untrusted networks."
  - claim_id: 8ef7cc8d93
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "headline"
    kind: frontmatter
    text: "GitLab's critical patch fixes an unauthenticated CVSS 10.0 RCE in Org-mode rendering; no exploitation reported"
  - claim_id: ff3170fa0d
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0), an integer overflow in regular-expression handling that lets an unauthenticated user run code on a self-managed GitLab server as the git user; GitLab's own detection write-ups place it in the rendering of .org files, which needs only a public project that can hold the payload. Every version from 7.0 before 18.11.13, 19.0.10, 19.1.9, 19.2.9, 19.3.6, 19.4.3 and 19.5.1 is affected, so instances on the 19.4.2, 19.3.5 and 19.2.8 builds that closed the earlier regular-expression flaws still need this release. The bug sits in Ruby's own regular-expression engine, which Ruby fixed on 2026-10-23 in 4.0.9, 3.4.12 and 3.3.13, so any Ruby application that compiles attacker-controlled patterns is exposed to it. GitLab does not report exploitation."
  - claim_id: a68c978495
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed GitLab CE and EE instance to 19.5.1, 19.4.3, 19.3.6 or the backport for its line (19.2.9, 19.1.9, 19.0.10, 18.11.13) now, internet-reachable instances and instances with public projects first; builds 19.4.2, 19.3.5 and 19.2.8 are still affected."
  - claim_id: 4a3ba969fd
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "cves[CVE-2026-110264]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-110264\", \"cvss\": \"10.0 (CVSS 3.1)\", \"status\": [\"patch-available\"], \"affected\": \"all versions from 7.0 before 18.11.13, 19.0 before 19.0.10, 19.1 before 19.1.9, 19.2 before 19.2.9, 19.3 before 19.3.6, 19.4 before 19.4.3, and 19.5 before 19.5.1\", \"fixed\": \"19.5.1, 19.4.3, 19.3.6, 19.2.9, 19.1.9, 19.0.10, 18.11.13; the underlying Ruby fix is in Ruby 4.0.9, 3.4.12 and 3.3.13 (Ruby 4.0.8 lacks it)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4e8083216e
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "GitLab's ad-hoc critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0), an integer overflow while compiling a specially crafted regular expression that could let an unauthenticated user execute code on the GitLab server ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-1-released/"]
  - claim_id: aa22e8a7fc
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "GitLab's detection write-ups place the flaw in the rendering of Org-mode files: the org-ruby gem builds a regular expression from a custom TODO keyword in a .org file, a keyword with more than 32,767 repeats makes the Onigmo engine write out of bounds when it matches, and with heap grooming that becomes command execution as the git user ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: 9aee3df290
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "The attack needs no authentication, only one public project that can hold the .org payload ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: d35e14a8bc
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "Affected are all versions from 7.0 before 18.11.13, 19.0 before 19.0.10, 19.1 before 19.1.9, 19.2 before 19.2.9, 19.3 before 19.3.6, 19.4 before 19.4.3 and 19.5 before 19.5.1; GitLab.com is already patched, and GitLab Dedicated tenants on 19.3.5-internal0, 19.4.2-internal0 or later need no action ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-1-released/"]
  - claim_id: b9b221124c
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "The builds 19.4.2, 19.3.5 and 19.2.8 from GitLab's earlier regular-expression fixes do not contain this fix ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/onigmo_native_worker_crash.md"]
  - claim_id: 734d07c1ad
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "GitLab does not state that the flaw is exploited, and its patch notes and detection pages mention no public proof of concept ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-1-released/"]
  - claim_id: f102532879
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "The bug is in Ruby's Onigmo regular-expression engine: the Ruby project released 4.0.9, 3.4.12 and 3.3.13 on 2026-10-23 with the fix, the release of 4.0.8 lacks the fix for this flaw, and GitLab fixed its own servers by patching the Ruby it ships ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 3a0bf9811e
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** self-managed GitLab CE and EE on the versions above; the vulnerable path is reached when GitLab renders a .org file, so an instance with public projects, or one where untrusted users can create them, is the exposed shape, and until patching GitLab advises reducing public visibility ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: c8d8f2859d
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "A Ruby application outside GitLab is exposed to the same bug when it compiles a regular expression from a string an attacker controls, through Regexp.new, Regexp.union, Regexp.compile or interpolation into a regexp literal; applications that only use patterns written by their own developers are not affected ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 2a998b9dd0
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "**Detection:** GitLab's two detections key on, first, five or more render timeouts from the Org-mode renderer on .org files from one client within 30 minutes in the Rails exceptions log, with the request that actually crashes a worker visible only as a 502 on the .org blob route in the Workhorse log, and second, a native Ruby crash report in the Puma error log whose backtrace runs through org-ruby or Onigmo frames ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: 88078e1b17
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "In repository content, scan each suspect checkout for .org files with an oversized TODO-keyword line, and in the Rails request log look for editor preview requests whose file_path ends in .org while the URL names another file type, which forces the Org renderer ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: d36f819c80
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "A successful exploit is quiet and does not reliably crash, so the absence of a hit never clears an instance ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/onigmo_native_worker_crash.md"]
  - claim_id: 30d90c8203
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "On an exposed, unpatched instance, hunt for unexpected child processes of Puma, new files owned by git in the temporary directory, outbound connections and changed crontabs or SSH keys for the git user, and treat the secrets, CI/CD variables, runner tokens and access tokens the git user can read as at risk ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: f332aacc64
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "**Triage:** a reader of documentation .org files renders each file once and quickly, while an attack produces a burst of timeouts from one client over a few minutes ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: 7bd301c0e8
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "); a worker crash with no accompanying render burst from one client is more likely a benign parser bug than an attack ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/onigmo_native_worker_crash.md"]
  - claim_id: 7eda42bfc0
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to the fixed build of the instance's line now, internet-reachable instances and those with public projects first; an instance that moved to 19.4.2, 19.3.5 or 19.2.8 for the earlier flaws is not yet fixed for this one ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-1-released/"]
  - claim_id: ad1736321f
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "For other Ruby applications that compile attacker-controlled patterns, Ruby recommends upgrading to 4.0.9, 3.4.12 or 3.3.13 or later, or avoiding compiling such patterns, and says neither Regexp.timeout nor a pattern-length limit reliably protects; Ruby has not requested CVE identifiers of its own for now and tells operators to track the issues under GitLab's identifiers ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 98ce50ca35
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "The Ruby project published an advisory on 2026-10-23 and released Ruby 4.0.9, 3.4.12 and 3.3.13 with fixes for the bugs in its Onigmo regular-expression engine behind four GitLab flaws: CVE-2026-89078 (a double free when parsing a pattern fails after an alternation), CVE-2026-93577 and CVE-2026-97229 (an integer overflow in the size of a compiled pattern) and CVE-2026-110264 (an overflow of internal IDs in a pattern with many repeats) ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 3f2abc8e12
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "Ruby's table gives the first release of each series that carries each fix: the fix for CVE-2026-110264 first appears in 4.0.9, so 4.0.8 is not enough, and 3.4.12 and 3.3.13 carry all of them; GitLab fixed its own servers by patching the Ruby it ships ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 8b5f1865e7
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "The advisory widens the exposure beyond GitLab to any Ruby application that compiles a regular expression from a string an attacker controls, says Regexp.timeout does not protect against these bugs and that limiting pattern length does not reliably protect, and says Ruby has not requested CVE identifiers of its own and that operators should track the issues under GitLab's identifiers ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: cca79639da
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "record 2026-10-24T03:42:57Z"
    kind: record-summary
    text: "Ruby released 4.0.9, 3.4.12 and 3.3.13 on 2026-10-23 with fixes for the regular-expression engine bugs behind four GitLab flaws, this one included; any Ruby application that compiles attacker-controlled patterns is exposed to them, and Ruby has requested no CVE identifiers of its own."
