    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "After command execution as the zimbra account, Microsoft observed, across its cases and not necessarily on every host, JSP web shells written to publicly served directories after temporarily opening write permission, with copies on peer mailbox nodes, and reverse shells built from a named pipe and `openssl s_client`; a privilege escalation that used a symlinked log file to take ownership of the sudo PAM configuration, added a `pam_exec` hook and created a NOPASSWD sudoers entry for the zimbra account; a systemd unit named like a Zimbra logging component with timestamps matched to existing services; theft of Zimbra's service credentials with `zmlocalconfig -s`, followed by authenticated LDAP queries for the pre-authentication key, the auth-token key and the two-factor secret attribute; and SSH and rsync movement across the cluster with Zimbra's own SSH identity ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: baec9bbacb
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "Microsoft's remediation is to upgrade to 10.1.20 or later, remove the zimbra-snmp package or disable SNMP notifications and restrict SNMP and SMTP to trusted hosts, rotate all domain `zimbraPreAuthKey` values, review systemd units, and hunt for JSP files on every mailbox node ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 86740d1c11
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "Zimbra's 10.1.21 release of 2026-09-24 also fixes unauthenticated prediction of password-recovery codes that could reset a user's password, WebDAV acceptance of pre-MFA tokens, and OnlyOffice-integration flaws including file write to remote code execution ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21"]
  - claim_id: ef3340a4b0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "); the table lists no CVE or score for the recovery-code and WebDAV fixes ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"]
  - claim_id: 88161f6cca
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "), and NCSC Switzerland published an advisory for the release on 2026-10-01 with exploitation status unknown ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13022"]
  - claim_id: fd11a8366d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "CSIRT Italia reports, in bulletin BL01/261005/CSIRT-ITA, multiple compromises of internet-exposed Zimbra servers handled in the Italian national context, mostly through CVE-2026-73570 and to a lesser extent through older flaws on unpatched or end-of-life instances ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: b14bcbb329
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In two CVE-2026-73570 cases exploitation ended in ransomware: on an 8.7.11 instance the attacker opened an interactive reverse shell and irreversibly encrypted many files on one node, and in a second case of unspecified version an ELock-family ransomware executable was dropped; both servers had the optional zimbra-snmp package, and the evidence does not tie the two cases to one actor or payload ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: abcae7f6af
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Three further cases installed cryptominers, one on 10.1.19 with a crontab entry for the zimbra user that ran a payload from a temporary directory ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: eb5b1a6833
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In one case the exploit fetched a payload from external staging infrastructure and ran a Perl script directly in memory without writing files, with an attempted connection to a presumed IRC command-and-control server and no post-compromise activity found ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 47f51f72e4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In two cases web shells were planted in the directories the web service exposes: on a 10.1.4 instance the attackers left JSP web shells, including ones managed with Behinder, and exfiltrated the LDAP database, the mailbox list and the credential hashes, and on another instance several JSP web shells took mail down for 48 hours for more than 6,000 mailboxes with no data theft documented ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 2914a15532
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "The two cases share five command-and-control addresses and similar JSP constructs, but ACN says the evidence does not let it attribute both to the same actor ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: afdb20f32f
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "ACN also describes a CentOS server turned into an SSH brute-force source after a write test in the Jetty public directory, with CVE-2026-73570 as the presumed but unconfirmed entry, and an end-of-life server whose mailbox passwords were all reset by the attacker through an undetermined vector ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 9fa1404dbd
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Older flaws (CVE-2024-45519, CVE-2022-41352, CVE-2022-27925, CVE-2022-37042 and CVE-2023-38750) account for the remaining cases on unpatched or unsupported lines, including a further ransomware case on an 8.8.15 instance ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 1b80f7f9c2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "ACN says nearly all affected systems lacked applicable patches or ran unsupported branches, that in several cases the attackers persisted without root by staying in the zimbra application user's context, and that it found no evidence of successful intrusions on regularly updated instances ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 9e18021abb
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Its mitigations are to update, to disable or remove the zimbra-snmp package where patching has to wait, to inspect the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, to look for SNMP exploit scripts under /opt/zimbra/data/tmp and for JSP files or stray text files in the Jetty public directory, to check /tmp and /var/tmp for droppers, miners and ransomware payloads, to rotate all mailbox and administrative credentials where web shells or anomalies are found, to keep the administrative port TCP 7071 and unneeded SOAP interfaces off the public internet, and to filter egress from the Zimbra servers, including IRC and TCP 8801 ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 9b3ff11a8d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Elastic Security Labs reproduced the exploit chain in its lab and describes it stage by stage: an SMTP client sends a recipient address with an unclosed angle bracket, Postfix logs it to /var/log/zimbra.log as an illegal-address warning, Zimbra's bundled Swatchdog daemon matches a log line of the form \"Service status change: <host> <service> changed from stopped to running\", and the notification routine places the service field into a Perl backtick string that /bin/sh runs, giving code execution as the zimbra user, who can read every mailbox and send as any local identity ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 931a653196
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Its practical finding is that several public proofs of concept write a payload that Swatchdog never matches, so a failed test looks like a patched server; Elastic's own proof of concept proves execution with an out-of-band callback that changes nothing on disk, and it says upgrading to 10.1.20 or later is the only complete fix ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: ee70f03795
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Its detection is a process sequence on one host within 30 seconds, a shell started by the Perl Swatchdog script with snmptrap in its command line followed by any child of that shell other than snmptrap; on a healthy host the notification shell starts only snmptrap, so any other child is the discriminator ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 055e3c71b4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Where exploitation is found, Elastic lists standard indicators of remote code execution, phishing mail originating from the server, compromise of local databases, signing keys and LDAP exports, and less direct surfaces beyond the mail store ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 42c044ead2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-02T04:54:58Z"
    kind: record-summary
    text: "Microsoft Threat Intelligence published first-hand analysis of confirmed intrusions: probing of the injection point from 2026-07-28, before the 2026-08-13 disclosure, then web shells, root escalation, theft of Zimbra's authentication keys and cluster-wide movement, with the injection signature to hunt for. The 10.1.21 release, which also fixes unauthenticated password-recovery code prediction, and NCSC-CH's advisory of 2026-10-01 are added. CISA's KEV listing of 2026-08-21, not recorded before, is added; the 10.1.20 release date is corrected to 2026-07-20, the EPSS score is refreshed to 0.117 (FIRST, 2026-10-01), ENISA's 18 August date is its EU KEV listing, and the actions now ask for a compromise check as well as the upgrade."
  - claim_id: 444ab763c4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-06T05:00:00Z"
    kind: record-summary
    text: "CSIRT Italia's bulletin of 2026-10-05 reports compromises of exposed Zimbra servers through CVE-2026-73570 that ended in ELock-family ransomware, cryptomining, web shells with theft of the LDAP database and credential hashes, and a 48-hour mail outage for more than 6,000 mailboxes, and found no intrusion on regularly updated instances. Its host checks (the zimbra user's crontab and authorized_keys, JSP files in the Jetty public directory, droppers in temporary directories, egress) are added to the compromise check."
  - claim_id: 14cef2c6a0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-21T08:12:17Z"
    kind: record-summary
    text: "EPSS refreshed from 0.117 (FIRST, 2026-10-01) to 0.717 (FIRST, 2026-10-20); the score rose on 2026-10-06 and the sourcing note now dates it 2026-10-20."
  - claim_id: 2a18f230f6
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-24T03:44:32Z"
    kind: record-summary
    text: "Elastic Security Labs reproduced the chain and found that several public proofs of concept never trigger it, so a failed test does not show a host is patched; its process-lineage detection for the Swatchdog notification path is added to the detection guidance."
  - claim_id: a18414d101
