    surface: "section 2026-09-27T04:38:00Z"
    kind: uncited
    text: "The downstream count grows again, and through a further intermediary this entry had not yet named."
  - claim_id: 991569ed63
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-27T04:38:00Z"
    kind: uncited
    text: "The exposed categories match the pattern this campaign has shown throughout: names, email addresses and phone numbers; Carrefour states no banking data or passwords were affected, and neither its own site, customer accounts nor internal systems were compromised, consistent with the exposure being limited to data it had shared with Shipup for delivery notifications."
  - claim_id: 441d5be163
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-27T04:38:00Z"
    kind: uncited
    text: "Carrefour has not disclosed the exact number of customers affected or confirmed whether the exposure window matches Shipup's own 31 July-17 August dates."
  - claim_id: f7cd4519f3
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-27T04:38:00Z"
    kind: uncited
    text: "Shipup is a new entry in this campaign's chain of intermediary vendors, distinct from the data warehouses and analytics platforms this entry's earlier coverage described (n8n, Kilo Code and the others connected directly to a compromised Metabase instance): here, the retail brands are themselves downstream of a vendor that was downstream of the Metabase flaw, a second hop the credential-rotation and log-review guidance in this entry's original analysis already covers, since it applies to any instance that was reachable and unpatched during the exploitation window regardless of how many contractual layers separate the ultimate data subject from the compromised application."
  - claim_id: 210ed6338c
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-27T13:28:04Z"
    kind: uncited
