  - claim_id: 7b359d2e66
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "summary"
    kind: frontmatter
    text: "Arista's Security Advisory 0199 of 2026-10-22 fixes CVE-2026-114625 (CVSS 3.1 9.9) in on-premises VeloCloud Orchestrator: any authenticated user, down to the lowest built-in tenant role, can gain operator privileges and reach functions meant for internal use only, and Arista says the flaw is known to be actively exploited. Fixed releases are 5.2.3.18, 6.1.3.10 and 6.4.2.12; hosted and dedicated Orchestrators were already patched, and Arista names no actor, victim count or start date."
  - claim_id: cceca42731
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every on-premises VeloCloud Orchestrator to 5.2.3.18, 6.1.3.10 or 6.4.2.12 (or later in its train) now and, until then, restrict its web interface to trusted administrative networks; before upgrading, preserve the web access, application, system and database logs and the file-system timestamps, then check the host for backdoor daemons, web shells and unexpected outbound traffic."
