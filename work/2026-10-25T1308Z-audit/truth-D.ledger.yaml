  - claim_id: 81258f6475
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-08-12T04:46:30Z"
    kind: record-summary
    text: "Metabase's unauthenticated SQL-injection zero-day, covered here on 2026-08-09 when no CVE existed, has been assigned CVE-2026-72898 in GitHub Security Advisory GHSA-vwf4-m7j8-wcjf at CVSS 3.1 10.0, and CISA added it to the Known Exploited Vulnerabilities catalog on 2026-08-11. The advisory publishes affected ranges per release line and confirms active exploitation in Metabase's own words. For self-hosted instances nothing about the exposure changed — but the flaw is now visible to every scanner, SBOM pipeline and CVE-keyed patch process that could not see it a week ago."
  - claim_id: e6aed4bf26
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-08-19T05:02:00Z"
    kind: record-summary
    text: "A tracker maintained by VenariX, updated 2026-08-17, now counts nine publicly confirmed organisations whose compromised Metabase environments were used to reach connected data warehouses — n8n, Framework, Tally and Kilo Code, joined on 2026-08-17 by Stocksy United Co-op, ShipMonk, Checkly, Cypress.io and Bits of Gold. This pipeline covered CVE-2026-72898 on 2026-08-09 and 2026-08-12 as an exploited CVSS 10.0 unauthenticated SQL injection in the password-reset endpoint; the delta is the downstream pattern. Because Metabase stores the credentials for every database it connects to, administrative access to the application yields those credentials, and Metabase's own guidance is that patching does not invalidate credentials already exposed. Metabase also published a two-request log pattern that indicates a given instance was compromised."
  - claim_id: fde4144060
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-09-27T04:38:00Z"
    kind: record-summary
    text: "The downstream victim list grows again through a further intermediary: Shipup, a French package-tracking platform used by 700+ e-commerce brands, was compromised through the same vulnerability, and at least six of its retail clients, including Carrefour, Printemps, Citadium, Aroma-Zone, Micromania and Easypara, have since notified their own customers of exposed contact data."
  - claim_id: 07e1549983
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-09-27T13:28:04Z"
    kind: record-summary
    text: "The Shipup section claimed the 31 July to 17 August access window was the same one this entry's earlier coverage had already established for the campaign. It was not: the earlier coverage says \"since at least 3 August\", three days later, so the Shipup window widens the campaign's known exposure period rather than confirming it. The sentence now states that difference instead of asserting agreement. Recorded for the audit trail and not otherwise fixable: the changelog record of the same day declared a change to the evidence list that its commit did not make."
  - claim_id: 461331fbcf
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-09-29T22:50:37Z"
    kind: record-summary
    text: "VenariX's tracker now counts fifteen publicly confirmed downstream incidents, up from nine, adding Privy, Paradigm Connect Asia, Statista, Dodo Payments, Marsello and LEGO Certified Stores South Africa. It attributes two of them, at Statista and Dodo Payments, to the Dire Wolf ransomware and extortion group exploiting self-hosted Metabase, and suspects fourteen more targets. Dodo Payments' own disclosure confirms a self-hosted Metabase instance breached through CVE-2026-72898. The title, the summary and the main analysis no longer describe the flaw as having no CVE or Framework and Tally as its only victims."
  - claim_id: c8eb0a9b65
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "record 2026-10-21T03:48:34Z"
    kind: record-summary
    text: "A Swiss victim: Republik, a Swiss online magazine, says attackers used the Metabase flaw against its own installation from August until the tool failed on 2026-10-14, retrieved the records of all registered users and reported the incident to the federal data protection commissioner; it had not subscribed to the vendor's security warnings."
