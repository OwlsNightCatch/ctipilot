    surface: "section 2026-09-27T04:38:00Z"
    kind: cited
    text: "At least six of Shipup's retail clients have since notified their own customers of exposure: Carrefour notified some customers in early September, and Cyberattaque.org had already separately documented Printemps, Citadium, Aroma-Zone, Micromania and Easypara as affected through the same Shipup compromise ("
    urls: ["https://www.cyberattaque.org/carrefour-des-donnees-clients-exposees-apres-la-cyberattaque-de-son-prestataire/", "https://frenchbreaches.com/alertes/carrefour-shipup-muixw7rd535cstgrh65"]
