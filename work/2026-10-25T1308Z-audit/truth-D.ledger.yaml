claims:
  - claim_id: 641cba5690
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "headline"
    kind: frontmatter
    text: "Metabase Cloud was breached through its own 0-day; self-hosted instances stay vulnerable until manually upgraded"
  - claim_id: 4d66f8f08f
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "summary"
    kind: frontmatter
    text: "Metabase disclosed on 2026-08-06 that its Metabase Cloud platform was attacked through a previously unknown vulnerability in versions 1.58 and above: an unauthenticated attacker injects arbitrary SQL against the application database and obtains administrator access to the instance, from which they can rewrite configuration, steal the stored credentials for every connected database and export the data those connections reach. The only interim workaround the vendor offers is to block the /api/session/reset_password endpoint, which is also where its published attack pattern runs. Cloud instances were patched by the vendor; self-hosted deployments stay vulnerable until manually upgraded to 0.58.24, 0.59.21, 0.60.17, 0.61.11, 0.62.9 or 0.63.5. Laptop maker Framework and form builder Tally were the first to confirm customer data was taken, on 2026-08-03. The flaw went a week without a CVE identifier before it was assigned CVE-2026-72898 and added to CISA's KEV catalog on 2026-08-11. VenariX now tracks fifteen publicly confirmed downstream incidents and ties two of them, at Statista and Dodo Payments, to the Dire Wolf extortion group working against self-hosted instances."
  - claim_id: 253af3ba3a
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-hosted Metabase to at least 0.58.24 / 0.59.21 / 0.60.17 / 0.61.11 / 0.62.9 / 0.63.5, then, for any instance that was reachable and unpatched during the exploitation window, revoke all active sessions by clearing the core_session table, delete unrecognised API keys, and rotate the credentials for every connected database and warehouse, not just the Metabase admin credentials, because the upgrade does not invalidate what was already retrieved."
  - claim_id: 670977b4de
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "actions[1]"
    kind: frontmatter
    text: "Search Metabase application or reverse-proxy ingress logs across the entire pre-upgrade exposure window for a POST to /api/session/reset_password returning HTTP 400 immediately followed by a GET to /api/user/current returning HTTP 200 from the same source; Metabase states that sequence indicates the instance was likely compromised."
  - claim_id: 6835c95288
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "cves[CVE-2026-72898]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-72898\", \"cvss\": \"10.0\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Metabase Cloud and self-hosted releases in the 58 through 63 branches\", \"fixed\": \"latest patched release for each affected self-hosted branch; Metabase Cloud patched by the vendor\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 8d051accc5
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Metabase, an open-source business-intelligence platform run both self-hosted and as a managed cloud service, disclosed on 2026-08-06 that its own Metabase Cloud environment had been attacked by someone using an unknown vulnerability affecting versions 1.58 and above, and that it blocked the endpoints used in the attack before identifying and patching the flaw ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: d4fbd327d9
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The mechanism matters more than the platform: an unauthenticated caller injects arbitrary SQL against the Metabase application database, and that yields administrator access to the instance, from which the attacker can change the application configuration, steal the stored credentials Metabase holds for the databases it connects to, read anything reachable through those connections, and export it ("
    urls: ["https://www.metabase.com/blog/security-update", "https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"]
  - claim_id: c4d090067d
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Neither the vendor nor the reporting locates the injection point precisely, but the vendor's stated interim workaround for anyone who cannot upgrade immediately is to block the `/api/session/reset_password` endpoint outright, and its published attack pattern runs through that same route ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 5c59d4f866
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "BleepingComputer, quoting the associated security advisory, reports it is rated critical at CVSS 10.0 with active exploitation confirmed, and that no CVE identifier had been assigned ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: d69ced1daf
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The advisory later assigned CVE-2026-72898, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-08-11 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog"]
  - claim_id: 2ef90aa5e6
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Metabase Cloud customers were upgraded and patched by the vendor, while self-hosted instances remain vulnerable until an administrator upgrades them by hand ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: fed3a82581
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The minimum safe point releases are 0.58.24, 0.59.21, 0.60.17, 0.61.11, 0.62.9 and 0.63.5 for their respective branches, and anything on a lower point release of those branches is still vulnerable; installations below version 58 are not affected ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: fed056a037
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Framework, the laptop manufacturer, told customers that the attackers stole full names, email addresses, login IP addresses, billing and shipping address details, phone numbers and company names, with VAT, EIN and billing email address additionally in scope for its business customers, and said Metabase notified it on 6 August that its instance had been vulnerable and was accessed on 3 August ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: a3f0ea5f43
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "Tally, an online form builder, notified users that its Metabase analytics environment was compromised on the same date and that the attackers reached email addresses and password hashes, while its forms and the responses submitted to them are stored separately and were not reached ("
    urls: ["https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"]
  - claim_id: 428343a9c8
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The attack shows up as a call to `POST /api/session/reset_password` returning a 400 status code followed by a call to `GET /api/user/current` returning 200, and Metabase states that finding that pattern in application logs or in Metabase server ingress logs means the instance was likely compromised ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 3d67f476ef
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "After upgrading, the vendor's own follow-up steps for any instance whose reset endpoint was publicly reachable are to revoke every active session by deleting all rows in the `core_session` table, review and delete unrecognised API keys, check administrator accounts for unexpected changes, rotate the credentials for every connected database, and review both data-warehouse logs and Metabase's own activity and query history for unauthorised access ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: 48b0f4095e
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: cited
    text: "The discriminator is what follows it from the same source: an unauthenticated client that is genuinely failing a password reset has no session and cannot then get a 200 from `/api/user/current`, so it is the ordering and the success of the second call that separate exploitation from noise ("
    urls: ["https://www.metabase.com/blog/security-update"]
  - claim_id: ddc1ae83cb
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "The exposure split is the part defenders need to act on."
  - claim_id: e53a0e73c8
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "Two organisations have confirmed data theft from their own instances."
  - claim_id: 6a43faa229
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "Those two were the first confirmed victims."
  - claim_id: 9644d231b3
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "VenariX's tracker has since counted fifteen downstream incidents, set out in the updates below."
  - claim_id: 3e547edb05
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: uncited
    text: "Detection is unusually well specified for a flaw that went its first week without a CVE, because the vendor published the request sequence rather than indicators."
  - claim_id: 5a0bce4704
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the reason this deserves attention beyond the patch is what a BI platform holds."
  - claim_id: e377f800d4
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "Metabase sits in front of production data warehouses with standing credentials for each one, so administrator access converts directly into read access across every system it was ever pointed at."
  - claim_id: 807cf783bf
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "Any self-hosted instance that was internet-reachable on an affected point release before the upgrade needs the credential rotation and the log review, not just the version bump."
  - claim_id: ee2d006823
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "The week without a CVE is a process lesson worth naming internally: while exploitation was already under way, an asset patched on the strength of CVE feeds, KEV listings or scanner findings got no signal for this at all."
  - claim_id: 401a13ea7a
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "body"
    kind: derived
    text: "**Triage:** a 400 on the password-reset route is ordinary — users mistype addresses and reset flows reject malformed requests all day, and on its own the 400 means nothing."
  - claim_id: 5fc8a1129e
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: cited
    text: "GitHub Security Advisory GHSA-vwf4-m7j8-wcjf assigns CVE-2026-72898 with a CVSS 3.1 base score of 10.0 (`AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H`), and Metabase's own advisory text states that \"Metabase has confirmed active exploitation of this vulnerability\" and that the flaw \"allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database, which can give them administrator access to the instance\" ("
    urls: ["https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"]
  - claim_id: 5d1f1ff7d4
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: cited
    text: "CISA added the CVE to its Known Exploited Vulnerabilities catalog on 2026-08-11 with a 14 August due date ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog"]
  - claim_id: 01d5b2c302
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: cited
    text: "The advisory lists the affected ranges per release line as `>= x.58.0 < x.58.23`, `>= x.59.0 < x.59.20`, `>= x.60.0 < x.60.16`, `>= x.61.0 < x.61.10`, `>= x.62.0 < x.62.8` and `>= x.63.0 < x.63.3`, and names the patched versions separately as x.58.24, x.59.21, x.60.17, x.61.11, x.62.9 and x.63.5 — note the two lists do not meet, so a build sitting between an affected upper bound and its patched release is not described either way and should be treated as needing the named patched version ("
    urls: ["https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"]
  - claim_id: 8b7dcc2344
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "The entry on Metabase's unauthenticated SQL-injection zero-day closed on the observation that no CVE identifier had been assigned, so a purely CVE-driven patch process would not surface the exposure at all."
  - claim_id: eb2e501752
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "That gap is now closed in both directions."
  - claim_id: f8f81a5384
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "The second half of the delta is the affected-version matrix, which the vendor's original blog post did not carry in this form."
  - claim_id: f3c66f280e
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "That turns \"upgrade Metabase\" into a query an asset inventory can answer, and it is what a scanner needed in order to report anything at all."
  - claim_id: d3ea3c1a49
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "Nothing here changes the exposure of an instance that has not been upgraded — the exploitation window has been open since at least 3 August per the earlier coverage, and the interim control is unchanged: block the `/api/session/reset_password` endpoint if an upgrade cannot happen immediately."
  - claim_id: 9efc30c238
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "What changed is visibility, and that is the operationally useful part."
  - claim_id: 2de752e2d5
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "An organisation whose vulnerability management runs off CVE identifiers, SBOM matching or KEV feeds got no signal on this flaw for over a week while it was being exploited; the same tooling will now produce a finding on the next scan cycle."
  - claim_id: ca31168ae3
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-12T04:46:30Z"
    kind: uncited
    text: "The advisory's post-upgrade guidance also stands and is worth re-reading against what an attacker with administrator access would already have taken: revoke active sessions, audit API keys and administrator accounts, and rotate the stored credentials for every connected data source, because those credentials are what an instance-level compromise reaches."
  - claim_id: a36e81e450
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "A tracker maintained by VenariX, first published 2026-08-10 and updated 2026-08-17, states that \"This brings the number of publicly confirmed downstream organizations tracked by VenariX to nine\" ("
    urls: ["https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"]
  - claim_id: 3afd6df0c7
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "Metabase stores the connection configuration, including credentials, for every external database and warehouse it queries; an attacker who reaches administrative context in the application can therefore read those stored credentials and query or export whatever they reach ("
    urls: ["https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"]
  - claim_id: 4d5ea1f074
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "Tally's exposure covered email addresses and password hashes while form content was stored separately and unaffected, and Kilo Code's included names, email addresses, billing addresses, location data and, for a subset of users, partial or full prompts ("
    urls: ["https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"]
  - claim_id: e85d51cbc6
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "Of the newly added names, Bits of Gold separately disclosed on 2026-08-17 that an attacker gained unauthorized access to a third-party data analytics network and obtained names, national ID numbers and emails for roughly 200,000 customers ("
    urls: ["https://databreaches.net/2026/08/17/israels-largest-crypto-broker-bits-of-gold-hit-by-data-breach-affecting-200000-customers/"]
  - claim_id: c07f4ddba9
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "Metabase's own guidance, as VenariX relays it, is that \"Credential rotation is especially important if exploitation is suspected, because patching the application does not invalidate credentials that may already have been exposed\" ("
    urls: ["https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"]
  - claim_id: 182f302c51
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: cited
    text: "Metabase identified a recurring two-request pattern associated with exploitation — a POST to `/api/session/reset_password` returning HTTP 400, immediately followed by a GET to `/api/user/current` returning HTTP 200 — and \"Metabase states that this pattern in application or ingress logs indicates that the instance was likely compromised\" ("
    urls: ["https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"]
  - claim_id: 2270fcc07b
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The count of downstream victims is now the story."
  - claim_id: c114bb6756
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The earlier entries covered the flaw itself: an unauthenticated SQL injection reachable at the password-reset endpoint, CVSS 10.0, exploited, catalogued as such on 2026-08-11."
  - claim_id: 70e47258b0
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The mechanism behind the growing list is a property of business-intelligence tooling rather than of this bug."
  - claim_id: d1103df740
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The blast radius of any given instance is set entirely by what it was wired to — VenariX's own framing is that a deployment connected only to a restricted reporting database is a materially different incident from one connected to a production warehouse, which is the assessment question a defender should be answering first."
  - claim_id: b36c6b0320
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The victim disclosures show the range. n8n's investigation found the attacker queried 136 records containing names and email addresses, five of which also carried bcrypt password hashes tied to n8n Cloud accounts, and reported that the queries returned a variable set of rows, which prevented it from determining exactly which individual records were returned."
  - claim_id: c1cbf2c247
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "Framework confirmed customer data was stolen including names, email addresses, phone numbers, login IP addresses and billing and shipping addresses, with payment information not included."
  - claim_id: 7edd82c3c2
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "The operational point is the one most likely to be got wrong in a remediation ticket."
  - claim_id: 028ff2fe0c
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "An estate that upgraded Metabase and closed the ticket has fixed the injection and left the attacker holding working warehouse credentials."
  - claim_id: 4403967a66
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "Metabase's fuller recommendation set for potentially exposed instances is to revoke active sessions, review administrator accounts and API keys, rotate credentials for connected databases, and review both Metabase and warehouse logs; where an immediate upgrade is impossible it recommends temporarily blocking access to the reset-password endpoint."
  - claim_id: 75a3137ad7
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "Detection has an unusually crisp anchor for a SQL-injection flaw, because the vendor published one."
  - claim_id: 529741c702
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: uncited
    text: "Beyond that, the investigative surface is Metabase's own query history, database and warehouse audit logs, administrator accounts, API keys, and any unexpected use of the stored connection credentials — the last being where a compromise that started in the BI tier becomes visible in the warehouse tier."
  - claim_id: 8850a569e5
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: derived
    text: "**Triage:** a failed password reset followed by a session check is not by itself unusual in a web application's logs, which is exactly why the ordered pair matters rather than either request alone — a genuine failed reset does not produce an authenticated `/api/user/current` success on the same session immediately afterwards."
  - claim_id: 68ebf8a1b7
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-08-19T05:02:00Z"
    kind: derived
    text: "Downstream, the discriminator for warehouse activity is whether queries arriving under the Metabase service credential match the dashboards and questions that credential is actually used for: bulk selects against tables no saved question references, or access at hours the reporting schedule does not run, are the signal, while high query volume under that identity is normal by design."
  - claim_id: 4ac25d2040
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-09-27T04:38:00Z"
    kind: cited
    text: "Shipup, a French platform used by more than 700 e-commerce brands to send delivery-tracking notifications and post-purchase communications, ran a Metabase instance that was compromised through the same CVE-2026-72898 unauthenticated SQL injection, with unauthorized access to the Shipup instance confirmed between 31 July and 17 August 2026, a window that starts earlier than the \"since at least 3 August\" this entry's own earlier coverage had established for the campaign ("
