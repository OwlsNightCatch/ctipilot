    kind: derived
    text: "Watch web and application-server access logs and the WebLogic and SOA server logs for requests to the affected components from untrusted sources, T3 and IIOP connections from unexpected networks in flow or load-balancer logs, and Java process-creation events where the middleware process spawns a shell, an interpreter or a download tool."
