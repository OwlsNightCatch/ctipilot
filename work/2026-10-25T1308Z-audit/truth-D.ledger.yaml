  - claim_id: 3c299d1e2a
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, which BFMTV reports as a remotely forced defrost at hundreds of stores. CERT-FR's alert, last revised on 2026-10-16, reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, says campaigns are probably still running and that a factory reset alone does not protect an unpatched end-of-life unit, and in its current text tells owners to check the whole configuration, defrost ranges included, and to restart or otherwise factory-reset a compromised Danfoss unit. NCSC Switzerland rates the activity actively exploited, and Copeland's own bulletin of 14 October, carried in a Dixell France guide that CERT-FR links, acknowledges a vulnerability on a discontinued, end-of-life generation of XWEB EVO controllers and says to remove every XWEB EVO from the public internet at once. Danfoss says most affected units are legacy products or current AK-SM800A units on outdated firmware. ANSSI's director general told the French Senate on 2026-10-21 that elementary flaws were exploited, starting with controllers directly on the internet, administered without particular protection, and weak passwords, rather than vulnerabilities researchers had published; no source names an actor, and the Paris prosecutor is investigating."
  - claim_id: 9912db25de
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: c633e1dacb
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges included, against the intended one; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
