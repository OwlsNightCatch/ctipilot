    surface: "summary"
    kind: frontmatter
    text: "Cisco's disclosure of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8), which lets an unauthenticated attacker who holds persistent cookies run operating-system commands as root on Expressway-C and Expressway-E that are configured in a cluster; X15.5.3 and earlier get X15.5.20, X14 and earlier must migrate, and there is no workaround. Hardening releases ship the same day for the Unified CM family and Unity Connection (up to 9.8, fixed in 15SU5), and for Snort 3 in Secure Firewall Threat Defense and related products (9.0); Cisco knows of no malicious use of any of them."
