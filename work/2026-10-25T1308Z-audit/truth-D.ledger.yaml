    surface: "section 2026-10-21T03:48:34Z"
    kind: cited
    text: "The attackers certainly retrieved the records of all registered users, at least names and email addresses and in part date of birth and gender, and demonstrably sampled postal addresses, comments and votes; Republik reported the incident to the Federal Data Protection and Information Commissioner on 2026-10-15 ("
