  - claim_id: 6063247d08
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "headline"
    kind: frontmatter
    text: "Required LDAP and SMB signing did not stop NTLM relay: a re-authenticated session kept the attacker's key"
  - claim_id: ff41861731
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "summary"
    kind: frontmatter
    text: "SpecterOps (LDAP, 2026-10-23) and Blackfield (SMB, 2026-10-21) independently show that a domain controller or file server that requires signing still accepts a relayed NTLM authentication when the attacker first opens a signed session of its own and then re-authenticates it as the victim, so the session keeps a signing key the attacker knows. Microsoft fixed the SMB variant in September 2026 and the LDAP variant in the 2026-10-13 cumulative update; SpecterOps reports no reply to its report and Blackfield found no CVE for the SMB change; public tooling exists and neither researcher reports use in attacks."
  - claim_id: c2030f122e
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm that every domain controller has the cumulative update of 2026-10-13 and every Windows server the September 2026 one for its Windows release (SpecterOps names KB5126646, the October update for Windows Server 2025, and KB5122882, the September update for Windows Server 2022; other releases have their own packages), then list the computer accounts whose msDS-AllowedToActOnBehalfOfOtherIdentity or msDS-KeyCredentialLink holds a value nobody set, because patching does not remove what a relay already wrote."
  - claim_id: 4e672d4c85
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "For LDAP, the attacker signs a session to a domain controller with valid credentials or, where accepted, an anonymous NTLM context, coerces a victim over SMB, and sends the victim's relayed authentication with a malicious LDAP modification in one SASL record signed with the attacker's key; the controller checks the signature once, switches to the victim's identity and runs the modification with the victim's rights ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 110d203f16
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "The tested controller enforced LDAP signing and channel binding and the attack still worked over 389/TCP; the demonstration writes the resource-based constrained delegation attribute, and relaying a domain controller's machine account to another controller leads to DCSync and domain compromise ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 7bb1392fb1
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "Blackfield shows the SMB counterpart: a server keeps the original signing key on re-authentication without checking that the identity matches, so on any host that requires SMB signing, domain controllers included, a relayed privileged authentication yields a privileged session still signed with the low-privilege key, provided the attacker can capture or coerce that authentication ("
    urls: ["https://blackfield.ch/blog/defeating-enforced-smb-signing/"]
  - claim_id: 6c287ae50c
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "SpecterOps reported the LDAP flaw to Microsoft on 2026-10-06, received no response, and says the fix shipped in the 2026-10-13 cumulative update, KB5126646, while the SMB variant was patched quietly in September 2026 (KB5122882) ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: cfa8802ea1
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "KB5126646 is the October update for Windows Server 2025 and KB5122882 the September update for Windows Server 2022 ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows-server/2026/10/kb5126646-windows-server-2025-security-update", "https://support.microsoft.com/en-us/servicing/os/windows-server/2026/09/kb5122882-windows-server-2022-security-update"]
  - claim_id: 866b1a06e3
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "Blackfield found no CVE or KB note for the SMB change, says similar changes seem to have reached the other supported versions in the following weeks without having traced every build, and warns that one or two end-of-life versions may never receive it ("
    urls: ["https://blackfield.ch/blog/defeating-enforced-smb-signing/"]
  - claim_id: b697056228
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "Both publish tooling; neither reports use in attacks ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", "https://blackfield.ch/blog/defeating-enforced-smb-signing/"]
  - claim_id: e002b9a190
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows Server domain controllers and SMB servers without the September 2026 (SMB) or 2026-10-13 (LDAP) cumulative update of their release; SpecterOps tested Server 2016 domain controllers and above and says every Server 2022 and 2025 domain controller it tested accepted the relay with LDAP signing required ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 7d6aa19d4b
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "The LDAP variant needs a signed session the attacker controls, a victim coerced to authenticate over SMB and LDAP reachable on 389/TCP ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 5484946765
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "The demonstration ends in an LDAP modification of msDS-AllowedToActOnBehalfOfOtherIdentity on the victim's own computer object, and msDS-KeyCredentialLink (shadow credentials) is the other write ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 6b6c2641ff
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "SpecterOps also advises enforcing LDAP signing and channel binding together, restricting LDAP on 389/TCP where possible and reducing NTLM; Blackfield says SMB signing stays necessary but is not sufficient ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", "https://blackfield.ch/blog/defeating-enforced-smb-signing/"]
  - claim_id: 0d9f4de87a
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: uncited
    text: "SpecterOps and Blackfield show that NTLM relay to a server that requires signing works again when the attacker first owns a signed session and then re-authenticates it with the victim's identity, so the session keeps the attacker's signing key."
  - claim_id: eb1a44d5cd
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: derived
    text: "**Detection:** neither researcher publishes detection guidance."
  - claim_id: 0b63ad45ad
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: derived
    text: "Patching does not remove values a relay already wrote."
  - claim_id: 6cc4a8f694
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** confirm that every domain controller runs the 2026-10-13 cumulative update of its Windows release and every Windows server the September one, because required signing did not stop this relay before them."
