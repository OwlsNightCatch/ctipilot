  - claim_id: f418c4142e
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "section 2026-10-21T03:48:34Z"
    kind: cited
    text: "Republik, a Swiss online magazine, reported that an unauthorised access that had been going on since August ended on Wednesday 2026-10-14, when one of its analysis tools stopped working and it took its own Metabase installation offline; its statement says the vulnerability had been known since 6 August and that the magazine failed to take countermeasures in good time ("
