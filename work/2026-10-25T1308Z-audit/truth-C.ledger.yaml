    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows estates whose users can open email attachments from outside and whose egress to arbitrary internet peers is not filtered; there is no product vulnerability, and ESET has not seen the backdoor anywhere else ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
