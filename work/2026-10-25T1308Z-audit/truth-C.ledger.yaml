    surface: "record 2026-09-29T04:35:00Z"
    kind: record-summary
    text: "watchTowr Labs published a full root-cause analysis on 2026-09-28: the vulnerable component for CVE-2026-88771 is ns_monuploadd_err.pl, a crash-log-monitoring script, not the nsppe packet engine historically named in NetScaler CVEs, and the trigger is not limited to the SSLVPN login form: any endpoint or port that logs attacker-controlled header data can poison the log the script later parses. watchTowr also confirms per-CVE exploitation status across the bulletin (only CVE-2026-88771 and CVE-2026-88772 exploited; the rest patched but not reported exploited, matching this entry's existing table) and published a public detection tool. NCSC-CH, NCSC-UK and CERT-FR each issued same-day advisories confirming active exploitation."
