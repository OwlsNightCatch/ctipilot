    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE Networking's bulletin HPESBNW05162 (initial release 2026-10-22) fixes 72 CVEs in the wireless operating systems AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways managed by HPE Networking Central, AOS-10 access points (AOS-AP) and AOS-8 Instant access points (AOS-IAP) ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: 97cb0f205e
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "By the CSAF's CVSS 3.1 scores, 34 of the 72 rate 9.0 or higher (eight at 10.0, ten at 9.8, eleven at 9.6, one at 9.4 and four at 9.3); the 19 rated 10.0, 9.8 or 9.4 need network access and no privileges, and the other 15 are reachable from the adjacent network ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: fd2e8ad9d4
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named mechanisms include authentication bypasses and command injection in the AOS-10 interface and in the PAPI protocol, a buffer overflow and a command injection in the AOS-8 PAPI protocol that arrive as crafted packets on its UDP port, an authentication bypass in the AOS-8 SSH daemon, and SQL injection in the web-based management interface ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: e6aa9ff8d9
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE says the flaws were generally found by its internal security research, that it is not aware of public discussion or exploit code as of the release, and that customers are strongly urged to patch; for some of the critical rows exploitation also needs preconditions outside the attacker's control, which the bulletin does not itemise ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 5f590caa09
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The bulletin text names AOS-10 10.8.x up to 10.8.1.1, 10.7.x up to 10.7.2.6 and 10.4.x up to 10.4.1.13, and AOS-8 8.13.x up to 8.13.3.0 and 8.10.x up to 8.10.0.23, while the machine-readable CSAF lists wider known-affected ranges, AOS-10 10.8.0.0 to 10.8.1.1, 10.6.0.0 to 10.7.2.6 and 10.3.0.0 to 10.4.1.13, and AOS-8 8.12.0.0 to 8.13.3.0 and 8.10.0.0 to 8.10.0.23, which take in the 10.6, 10.3 and 8.12 branches the text omits, so treat the CSAF ranges as the scope; fixed builds are AOS-10.8.1.2, 10.7.2.7 and 10.4.1.14 and AOS-8.13.3.1 and 8.10.0.24 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: c51c980674
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE's workaround is to restrict the CLI and web-based management interfaces to a dedicated layer 2 segment or VLAN, controlled by firewall policies at layer 3 and above with accounting controls ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: 261be57b90
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Exposure:** any HPE Networking mobility conductor, controller, gateway, access point or virtual machine that runs a listed version; HPE says every compatible hardware model is affected and that its own hardware list is illustrative only, so the check is the software version, not the model ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: f352ffd2ad
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named surfaces are the CLI and web management interfaces and the PAPI access-point management protocol on UDP port 8211 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 32c3c155bf
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE publishes no detection guidance, so no post-compromise check is defined ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: eb833bc476
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade controllers, gateways and access points to the fixed build of their train, management and PAPI-exposed units first, and apply the management-segment restriction at once where the upgrade has to wait; HPE says it is not aware of public discussion or exploit code, so the order follows exposure of the management and access-point protocol paths rather than a known campaign ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: e3e7d8b753
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: derived
    text: "**Detection:** management-plane access and accounting logs for logins and sessions from outside the management segment, and network flow data for PAPI traffic on UDP 8211 or controller management ports from segments that carry users or guests."
  - claim_id: ef2a4e456f
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "headline"
    kind: frontmatter
    text: "LiteLLM 1.107.0 on PyPI and in the official images stole cloud and AI credentials; removing the package does not stop it"
  - claim_id: 310099361e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-21 LiteLLM 1.107.0, the open-source LLM gateway, shipped with malicious Python startup files in all seven PyPI wheels (live 11:39 to 13:23 UTC) and in the official GHCR and Docker Hub images behind the v1.107.0, latest, main-latest and main-stable tags (11:46 to 14:20 UTC); they run a credential stealer at every Python start and start a background loader that could execute code fetched from an attacker-chosen host, though Socket saw its pointer empty at 13:01 UTC. The maintainers' root-cause post of 2026-10-23 says a master key committed to a public repository on 2026-05-27 and never revoked gave the attacker, from 2026-10-10, a GitHub organization owner's CLI token, with which it stole two maintainers' tokens and, on 2026-10-21, overrode branch protection to build the release from a look-alike repository; Socket independently found secret-stealing workflows running on 2026-10-10. Wiz saw stolen AWS instance-role credentials tested about 4.5 hours after exfiltration; PyPI and the registries removed the release the same day and the maintainers say to pin 1.106.2 or an explicit earlier version."
  - claim_id: f5289e861e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every host, build agent and container that installed litellm 1.107.0 from PyPI between 11:39 and 13:23 UTC on 2026-10-21, or pulled the v1.107.0, latest, main-latest or main-stable tag of the official GHCR or Docker Hub LiteLLM images between 11:46 and 14:20 UTC; treat each as compromised, inspect it with tooling that does not start Python in the affected environment, rebuild it from a reviewed artifact pinned to 1.106.2 or an image digest, and rotate every cloud, Kubernetes, registry, SSH, database and AI-provider credential it could read, including the provider keys stored in a LiteLLM proxy database."
