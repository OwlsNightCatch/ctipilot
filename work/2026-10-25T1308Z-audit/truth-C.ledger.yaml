    text: "Node2Shell: crafted Brotli data runs code in Node.js; update the runtime and the PyPI Brotli packages"
  - claim_id: c559576f02
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "Node.js released 22.23.4, 24.22.1 and 26.12.1 on 2026-10-21 to fix CVE-2026-111497, an out-of-bounds write in its bundled Brotli decoder that can lead to remote code execution, and Imperva ran code through it against the official Node.js 24.22.0 image via fetch() and Express 5 or body-parser 2 request bodies. The flaw is in the upstream Brotli library, so the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (fixed in 1.2.1.0) carry it too; no source reports exploitation."
  - claim_id: 164f373b11
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images, which a package inventory misses, and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; move any application on an end-of-life Node.js line to a supported release."
  - claim_id: 100c14e1a0
