    surface: "section 2026-10-02T04:56:31Z"
    kind: cited
    text: "Between 2026-09-04 and 2026-09-24 the DTLS exploitation delivered web shells as .deb packages that the actor repeatedly fetched from the appliance's `/vpn/scripts/linux/` client-installer folder, rotating infrastructure over that period; the recovered PHP web shell offers command execution, file download and upload over an RC4-encrypted channel and uses the appliance's SUID helper for privilege escalation ("
