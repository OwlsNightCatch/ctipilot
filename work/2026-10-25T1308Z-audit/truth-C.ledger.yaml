    text: "ESET: a backdoor reaches its C2 through the Yggdrasil mesh; Sandworm wiped the victim two months after UAC-0099 got in"
  - claim_id: 65b4a45bd6
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "summary"
    kind: frontmatter
    text: "ESET reports that UAC-0099 gained access to a Ukrainian grain logistics company on 2025-07-16 with a spearphishing attachment and a day later deployed MythicRatatoskr, a Go backdoor whose command server sits inside the Yggdrasil mesh network, reached through public peers; on 2025-09-17 the SDelete utility was deployed through Group Policy, which ESET assesses with high confidence as Sandworm after UAC-0099 handed off the access. ESET names blocking the public peer addresses as a viable mitigation."
  - claim_id: 3a96db0a64
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "ESET reports that on 2025-07-16 UAC-0099 gained access to a Ukrainian grain logistics company through a spearphishing attachment: a scheduled task ran a PowerShell payload, the MATCHBOIL downloader deployed the MATCHWOK backdoor, and the next day a previously undocumented Go backdoor, MythicRatatoskr, arrived, which ESET ties to that chain with high confidence because of the timing ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
