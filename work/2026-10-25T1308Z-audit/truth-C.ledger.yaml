    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "Legitimate clients have no reason to send crash-message text in a request field, so such a log line is the signal rather than a benign lookalike."
