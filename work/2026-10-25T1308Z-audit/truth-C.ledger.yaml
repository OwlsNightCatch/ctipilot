    surface: "record 2026-09-30T04:50:00Z"
    kind: record-summary
    text: "Google's Mandiant and GTIG report the exploitation campaign has run since at least early September, with government among the impacted sectors in North America and Europe, and describe post-exploitation web-server-configuration persistence, the WHIPSHOT web shell and the SLAPSHOT tunneler; eSentire places CVE-2026-88771 exploitation from 5 September. watchTowr published the CVE-2026-88772 root cause and NCSC Switzerland now lists a proof of concept for both flaws. Mandiant's interim controls (disable DTLS, block UDP/443 upstream) cover CVE-2026-88772 only, NetScaler 12.1 and 13.0 are end of life with no fix, and a shared municipal operator in Rhineland-Palatinate shut down citizen-service systems statewide as a precaution, a shutdown heise links to these NetScaler updates while the operators name no vendor."
