    text: "Citrix published a second NetScaler bulletin on 2026-10-03, CTX697174, for CVE-2026-88779, a memory overflow reachable when the appliance is configured as a SAML service provider or identity provider; Citrix says it has observed targeted attacks and scopes the impact to denial of service ("
