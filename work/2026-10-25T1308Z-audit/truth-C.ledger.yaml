    text: "A Go tool recovered from the appliance mapped routes, DNS, LDAP and Active Directory, management services and VMware vCenter, and the configuration, historical configurations and system backups were staged and exfiltrated, one archive through the web root; Rapid7 says the archive can hold encrypted credentials, LDAP and RADIUS bind information, SSL private keys and key-encryption material ("
