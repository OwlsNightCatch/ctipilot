    surface: "section 2026-09-30T04:50:00Z"
    kind: cited
    text: "By telemetry class: appliance web-server configuration containing handler or alias directives that point public paths at script directories; script content in the client plug-in and media directories, which should hold compiled clients and static assets; 404 responses with multi-kilobyte bodies or long processing times on media paths; the setuid bit on /bin/sh; lock and port-pointer files in the temp directory; and, for CVE-2026-88772, a DTLS handshake-failure \"Internal Error\" line in the syslog, and packet-engine termination or watchdog \"NOT restarting\" lines in the FreeBSD system log, which NetScaler does not forward to a SIEM by default ("
