    surface: "section 2026-10-02T04:56:31Z"
    kind: cited
    text: "Its earliest observed activity is on 2026-08-21: requests for an admin-UI stylesheet and a Gateway language resource that those two hosts and a third address then repeated against more than 100 other systems on 21 and 22 August, which Unit 42 reads as version fingerprinting ("
