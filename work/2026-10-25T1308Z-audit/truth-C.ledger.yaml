    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "For CVE-2026-88772, GTIG names a DTLS handshake-failure \"Internal Error\" line in the syslog, which successful exploitation produced, and packet-engine termination or watchdog \"NOT restarting\" lines in the FreeBSD system log, which NetScaler does not forward to a SIEM by default."
