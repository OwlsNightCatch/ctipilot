    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "SonntagsBlick reports that Federal Councillor Karin Keller-Sutter brought information on the supplier incident to the Federal Council's meeting of Wednesday 2026-10-14, and that a confidential information note says the Confederation internally expects \"considerable damage\", calls the incident \"serious\" and tells current and retired federal staff to expect longer-term effects (translated from German;"
