    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "The Bernische Pensionskasse told the NZZ that, contrary to the supplier's earlier information, it must be assumed that personal data left, which replaces its earlier statement that it had no indication of theft, and PK Softech cannot currently say which of its customers are affected ("
    urls: ["https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090"]
