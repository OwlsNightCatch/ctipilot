    kind: cited
    text: "TeamUpdraft says unauthorised access to teamupdraft.com on 17 and 18 October and that it believes its customer database was accessed, which holds connection keys for UpdraftCentral, UpdraftVault and UpdraftClone; it says UpdraftPlus plugin files and downloads were not affected, that the attacker used a compromised key to access its site, and that there is no evidence the attacker still has access, and it suspects, without giving evidence, that the attacker used AI to accelerate the attack ("
    urls: ["https://teamupdraft.com/blog/security-incident-october-2026/"]
