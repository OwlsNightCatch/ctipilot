    text: "**Exposure:** any Entra tenant where users can sign in to Microsoft 365 from unmanaged networks and Conditional Access does not require MFA or block for all users, all cloud apps and all client app types unconditionally, or where the device-code flow is open; Huntress names no victim, sector or country ("
