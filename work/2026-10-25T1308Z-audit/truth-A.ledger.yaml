    text: "**Detection:** in Entra sign-in logs, OAuth2:Token and Cmsi:Cmsi requests from hosting infrastructure that use the Microsoft Office or Authentication Broker client with a `node` or bare `Mozilla/5.0` user agent, above all those that touch user mailboxes or the Device Registration Service; in the Entra audit log, device registrations from hosting addresses with the DESKTOP-plus-eight-hex name shape and MFA methods deleted and re-added within minutes; in Exchange audit data, inbox rules with the short names described above, especially created through the REST API ("
