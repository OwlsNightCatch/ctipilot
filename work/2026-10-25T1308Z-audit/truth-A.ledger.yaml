    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reported on 2026-10-20 that the Akira ransomware group stole about one hundred gigabytes of compressed pension fund data, that data on well over a hundred thousand current and former federal employees is affected, that special agents and elite soldiers could be identified from it, and that Akira now demands ransom (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025"]
  - claim_id: f2a1e33984
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Inside IT, summarising the investigation, adds that the data sets contain employer details of people who work under a cover identity for fedpol or the Federal Intelligence Service (NDB), that an internal assessment sees a danger to life and limb for individual persons, that the NDB is forgoing certain operations for now without recalling agents from abroad, that the State Secretariat for Security Policy has already seen first fraudulent contact attempts connected with Publica, and that State Secretary Markus Mäder set up a task force under the federal information security officer Anne Rivera (translated from German;"
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: 821d2da577
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "It says the involved federal bodies assume Akira is responsible and that the group holds the data and threatens to publish or sell it if unpaid, and that at that date neither the Confederation nor Publica had confirmed the perpetrator or an alleged ransom demand ("
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: f1638fc8af
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Inside IT recalls that Akira was also behind the attack on a US subsidiary of the state-owned arms company Ruag a year ago, where Ruag paid the ransom, and that the Federal Prosecutor's Office, fedpol and the Federal Office for Cybersecurity warned in October 2025 of stepped-up Akira activity in Switzerland ("
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: fc67fee2bc
