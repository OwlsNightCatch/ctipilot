    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-20T03:39:20Z"
    kind: uncited
    text: "The access vector, the actor and any ransom demand were not public in any source read as of that date."
