    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "headline"
    kind: frontmatter
    text: "Three configuration-dependent NGINX heap flaws (CVSS 9.2) are fixed in 1.30.6 and 1.31.7; Debian stable is not yet"
  - claim_id: 5427edaf49
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "summary"
    kind: frontmatter
    text: "The nginx 1.30.6 (stable) and 1.31.7 (mainline) releases of 2026-10-14 fix five security flaws, three of them heap-corruption bugs that F5 scores CVSS 4.0 9.2 and an unauthenticated attacker can reach with crafted HTTP requests, but only on configurations that combine alias with rewrite and $request_filename, use a regex map whose captures are referenced before its output variable, or enable asynchronous file I/O with server-side includes; the other two concern HTTP/3 and TLS session ticket key rotation. F5 says the heap flaws restart the worker, with code execution only where ASLR is disabled or bypassed; no exploitation or public proof of concept is reported, nginx.org rates all five medium, and Debian's bookworm and trixie packages are still marked vulnerable."
  - claim_id: 70f5d665fc
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "actions[0]"
    kind: frontmatter
