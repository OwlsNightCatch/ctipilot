  - claim_id: 33fa4c30d5
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The Register reports that Atlassian emailed customers on Monday pointing to the advisory ("
    urls: ["https://www.theregister.com/security/2026/10/06/atlassian-warns-of-critical-file-access-flaw-in-its-datacenter-products/5301284"]
  - claim_id: 3d75b18b2c
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The CVE record for this ID was marked rejected on 2026-10-16 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: 9b328575e3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "), while Atlassian's advisory still uses the ID and lists the same fixed versions ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 9858684506
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The fixed versions are Bitbucket Data Center 9.4.26, 10.2.8 and 10.5.1; Confluence Data Center 9.2.26 and 10.2.19; Jira Service Management Data Center 5.12.40, 10.3.26 and 11.3.12; Jira Software Data Center 9.12.40, 10.3.26 and 11.3.12; Bamboo Data Center 10.2.24 and 12.1.12; Crowd Data Center 6.3.7, 7.0.3, 7.1.7 and 7.2.4; and Crucible and Fisheye 4.9.15 ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 209be358fc
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Atlassian's Confluence ticket adds that versions past end of life may also be affected ("
    urls: ["https://jira.atlassian.com/browse/CONFSERVER-104488"]
  - claim_id: 08cbda72f7
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "), and its Crowd ticket lists the same fixed Crowd builds ("
    urls: ["https://jira.atlassian.com/browse/CWD-6610"]
  - claim_id: 8964c60351
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Until a patch is applied, Atlassian says to remove the instance from the internet where possible, including instances that require user authentication, or to block at a web application firewall or proxy any URL that carries '..' directly next to a slash, backslash or '::' in plain or percent-encoded form; it also gives a Tomcat RewriteValve rule for Confluence, Jira Service Management, Jira Software, Bamboo and Crowd and a urlrewrite.xml rule for Bitbucket ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 8e5b87b4d3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "**Exposure:** every self-managed Data Center installation of the eight products on a version below the fixed ones, internet-facing instances first, because Atlassian asks that even instances requiring user authentication be taken off the internet until patched; Atlassian Cloud customers need do nothing ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 0d1ff41bed
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Jira instances integrated with Crowd carry a plaintext application password in a configuration file under the readable web root, so a file read can end in administrator access there; watchTowr demonstrated this on Jira only ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 7209ad98ba
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Atlassian says to URL-decode each request line (up to two decoding passes) and look for '..' directly next to '/', '\\' or '::', or to search the raw lines with its regular expression; it cannot confirm whether any instance was affected and asks customers to check every affected instance for evidence of compromise ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: d821652bd6
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The public attempts use the paths from watchTowr's write-up: resource-download URLs under the Jira, Confluence and Bitbucket plugin paths with '..::' sequences ahead of a WEB-INF file such as web.xml or urlrewrite.xml, and SANS ISC notes the target file must exist, which is why web.xml, present in every Tomcat application, is the probe of choice ("
    urls: ["https://isc.sans.edu/diary/33406"]
  - claim_id: 97b52b27ab
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The CVE record was rejected on 2026-10-16 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: 4393f6c4dc
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: ") and ENISA's database shows it restored on 2026-10-19 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-92807"]
  - claim_id: 2efa9318c1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Detection:** web server and reverse-proxy access logs."
  - claim_id: 44d979d010
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "Upgrading does not undo a read of the Crowd credential, so Crowd's own audit records of new users and changed group memberships are the post-patch check for Jira instances integrated with Crowd."
  - claim_id: c135c5aa04
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every Jira instance integrated with Crowd and review Crowd for accounts created since the exposure began, because the flaw's mechanics are public, exploitation attempts have been observed since 2026-10-06, CISA lists the flaw as actively exploited and Atlassian cannot confirm that any instance is unaffected."
  - claim_id: 3dcf25afeb
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "watchTowr Labs published the root cause on 2026-10-06 after comparing a vulnerable and a fixed build of the web-resource library that Jira, Confluence and Bitbucket share: its router converts a double colon in a request path into a slash before it resolves a plugin resource, so a traversal written with double colons leaves the resource directory through a deprecated relative-path resolver that is still reachable ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 271682d615
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr says it cannot leave the Tomcat context but can read any file within the application server, and it shows working requests against Jira, Confluence and Bitbucket, with Bitbucket blocking one configuration file but not another under WEB-INF ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 621b2eb53e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "The impact it demonstrates depends on the configuration: where Jira is integrated with Crowd, the crowd.properties file under WEB-INF stores the application name and its password in plaintext, and with those watchTowr reached Crowd's REST interface in its lab, created a user and added it to the Jira administrators group; it adds that a Crowd IP allow-list would make this harder ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 84f41acadc
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr also published a Detection Artifact Generator on GitHub that sends the traversal to Jira, Confluence and Bitbucket hosts to test whether they are vulnerable ("
    urls: ["https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589"]
  - claim_id: 86dc1ef10c
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "Atlassian's Crowd ticket lists the same fixed builds as the advisory, 7.1.7 for the 7.1 line ("
    urls: ["https://jira.atlassian.com/browse/CWD-6610"]
  - claim_id: 62016b7208
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: uncited
    text: "Neither watchTowr's post nor Atlassian's advisory of 2026-10-05 reports exploitation in the wild."
  - claim_id: c114787a76
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "Previdian, which runs a honeypot network, told BleepingComputer that its sensors began recording attempts within two hours of that publication, and that a Nuclei template has since been released that makes scanning for vulnerable systems easier; it expects exploitation to rise significantly over the coming days and weeks ("
    urls: ["https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-atlassian-flaw-after-public-poc-release/"]
  - claim_id: a0a8d0fe9d
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "As recorded on 2026-10-08, Previdian's telemetry page showed at least 129 attempts from at least 22 source addresses in eight countries across three sensors, from 2026-10-06 to 2026-10-08, and listed the flaw as not in CISA's KEV catalog ("
    urls: ["https://previdian.com/CVE-2026-21589"]
  - claim_id: 2fe8ecd5fd
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "Its timeline still lists the first sensor observation at 21:55 UTC on 2026-10-06, about five hours after watchTowr's post of 17:01 UTC, which is later than the two-hours figure ("
    urls: ["https://previdian.com/CVE-2026-21589", "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: f2a94c3272
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "The SANS Internet Storm Center says its own honeypots began receiving attempts on 2026-10-06 with the URLs from watchTowr's write-up against Jira, Confluence and Bitbucket resource paths, that every source address belongs to one cloud hosting provider, and that it believes a single actor is behind them ("
    urls: ["https://isc.sans.edu/diary/33406"]
  - claim_id: 061f34ef21
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "The Canadian Cyber Centre updated its bulletin on 2026-10-07 to say that open-source reporting indicates the flaw is being exploited in the wild ("
    urls: ["https://cyber.gc.ca/en/alerts-advisories/atlassian-security-advisory-av26-1002"]
  - claim_id: c0605d3ec3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "), while NCSC Switzerland's advisory, edited on 2026-10-07 to add the public proof of concept, then listed the status as proof of concept available without reporting exploitation ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13032"]
  - claim_id: 108bc81cf8
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: uncited
    text: "Exploitation attempts began on 2026-10-06, the day watchTowr published."
  - claim_id: 09ec8eafce
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-08T04:56:05Z"
    kind: uncited
    text: "Neither honeypot operator reports a successful compromise."
  - claim_id: 9577e17e7d
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "CISA added CVE-2026-21589 to its Known Exploited Vulnerabilities catalog on 2026-10-15, \"based on evidence of active exploitation\" ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/15/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: 2461132a0f
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "Previdian's page, updated 2026-10-16, now counts 607 attempts from 65 unique addresses in 20 countries across five sensors between 2026-10-06 and 2026-10-15, and lists the flaw as in the CISA catalog ("
    urls: ["https://previdian.com/CVE-2026-21589"]
  - claim_id: 5e65563e3b
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "NCSC Switzerland edited its advisory on 2026-10-12 to list the status as proof of concept available and actively exploited, citing the attempts Previdian recorded on its honeypot sensors ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13032"]
  - claim_id: 1e2ef2e3b0
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: uncited
    text: "The alert does not say what the evidence is, who is exploiting the flaw or whether any attempt succeeded, so neither CISA nor the honeypot operators report a compromise."
  - claim_id: bbba55bcb5
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The same record still lists exploitation since 2026-10-15 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: e12de6d4be
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The flaw itself is unchanged: Atlassian's advisory, as read on 2026-10-17, still uses the ID, lists the same fixed versions and carries no note of the rejection ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 5b0c3b9ae9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "ENISA's EUVD record EUVD-2026-92807 for CVE-2026-21589, which names Atlassian as the assigner, was updated at 20:39 UTC on 2026-10-16 and now describes the record only as \"This CVE's publication may have been a false positive or a mistake."
  - claim_id: 44f05dc644
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "No source read says why the record was rejected or whether a replacement ID will follow."
  - claim_id: 02bdb3d1f9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "The consequence is for tooling: a scanner plugin, SIEM enrichment rule or ticket keyed on the ID, or on a feed that drops rejected IDs, can stop reporting a flaw that is exploited, so track it by Atlassian's advisory and the fixed versions above until a replacement ID appears."
  - claim_id: 8cdd64fe3e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-20T03:41:18Z"
    kind: cited
    text: "ENISA's EUVD record EUVD-2026-92807 for CVE-2026-21589, which named Atlassian as the assigner and carried the rejection sentence from 2026-10-16, was updated at 18:26 UTC on 2026-10-19 and again carries the full vulnerability description and the fixed versions instead of the rejection text; it still lists exploitation since 2026-10-15 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-92807"]
  - claim_id: 6de78ac3aa
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-20T03:41:18Z"
    kind: cited
    text: "Atlassian's advisory, read on 2026-10-20, is unchanged: it uses the same ID, lists the same fixed versions and carries no note on the record's status ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 70105e07c7
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-20T03:41:18Z"
    kind: uncited
    text: "No source read says why the record was rejected or why it was restored, and no replacement ID exists."
  - claim_id: df82e5f121
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-20T03:41:18Z"
    kind: uncited
    text: "The consequence is for tooling: a scanner plugin, SIEM enrichment rule or ticket keyed on the ID, or on a feed that excludes rejected IDs, may have dropped this exploited flaw between 2026-10-16 and 2026-10-19, so re-run them to be sure no affected Data Center instance stays reported as closed."
  - claim_id: cbe21f23ae
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-07T04:50:00Z"
    kind: record-summary
    text: "watchTowr Labs published the root cause (a path-separator substitution in the web-resource library shared by Jira, Confluence and Bitbucket), the request shape and a runnable checker on 2026-10-06, and shows that where Jira is integrated with Crowd the file read exposes a plaintext Crowd application password that gives administrator access to Crowd for that application. The flaw moves from a patch-now issue with unpublished mechanics to one with public mechanics and a Crowd credential to rotate; no exploitation is reported. Atlassian's Crowd ticket lists the same fixed builds as the advisory."
  - claim_id: 2b1cd38343
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-08T04:56:05Z"
    kind: record-summary
    text: "Exploitation attempts began on 2026-10-06, the day watchTowr published its write-up and proof of concept: Previdian's sensors have recorded at least 129 attempts from at least 22 addresses in eight countries, SANS ISC recorded similar attempts against Jira, Confluence and Bitbucket on its own honeypots, all from one cloud provider, and a Nuclei template exists; the Canadian Cyber Centre's bulletin now cites open-source reporting of in-the-wild exploitation. The status moves from patch-available to exploited, with no compromise reported and the flaw not listed in CISA's KEV catalog on Previdian's page."
  - claim_id: 624b386e65
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-16T04:11:30Z"
    kind: record-summary
    text: "CISA added CVE-2026-21589 to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, which moves the flaw from honeypot-observed attempts to government-confirmed exploitation; CISA names neither the evidence, the actor nor any victim, and neither CISA nor the honeypot operators report a compromise; Previdian's honeypot count has grown to 607 attempts from 65 addresses in 20 countries, and NCSC Switzerland has listed the flaw as actively exploited since 2026-10-12."
  - claim_id: 895406e954
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-17T03:34:00Z"
    kind: record-summary
    text: "Atlassian, the assigner, rejected the CVE record for CVE-2026-21589 on 2026-10-16, giving only the generic reason that its publication may have been a false positive or a mistake; ENISA's EUVD record mirrors it and still lists exploitation since 2026-10-15. Atlassian's advisory still uses the ID with the same fixed versions, and no source says why the record was rejected or whether a replacement ID will follow, so tooling keyed on the ID can lose track of an exploited flaw."
  - claim_id: d981af0ad1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-20T03:41:18Z"
    kind: record-summary
    text: "ENISA's EUVD record for CVE-2026-21589, which carried the rejection sentence from 2026-10-16, was updated on 2026-10-19 and again carries the full vulnerability description and the fixed versions; exploitation since 2026-10-15 is still listed and Atlassian's advisory is unchanged. Tooling keyed on the ID may have dropped the flaw while the record was rejected and should be re-run."
