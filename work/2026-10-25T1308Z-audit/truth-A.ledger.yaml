    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "Publica concedes that it did not carry out regular on-site security audits at PK Softech, although after the Xplain incident it had old data deleted there ("
    urls: ["https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090"]
