    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "The note says the security organs of the Confederation are particularly affected, which Blick glosses as the Federal Intelligence Service (NDB), the Defence Group in the VBS department and the Federal Office of Police (fedpol) ("
    urls: ["https://www.blick.ch/politik/daten-debakel-beim-bund-sicherheitsorgane-betroffen/jle39rp"]
