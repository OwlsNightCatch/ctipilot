    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "headline"
    kind: frontmatter
    text: "Stolen UpdraftCentral keys install backdoor plugins on WordPress sites; the plugin update alone does not evict them"
  - claim_id: 67aff10b45
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "summary"
    kind: frontmatter
    text: "TeamUpdraft, the vendor of the UpdraftPlus backup plugin, says unauthorised access to teamupdraft.com on 17 and 18 October probably exposed its customer database, including UpdraftCentral connection keys, and Patchstack and Nethemba report an attacker using those keys to install backdoor plugins on connected WordPress sites, which Patchstack's telemetry dates from 2026-10-18 15:32 (it gives no time zone), and that create hidden administrators. It is not a flaw in UpdraftPlus: the plugin obeys commands signed with a valid key, a key exists on many sites that never used the service because connecting a teamupdraft.com account ticks the option by default, and the update disconnects only connections made before 13:07 BST (12:07 UTC) on 18 October, so keys created later that day have to be deleted by hand. TeamUpdraft says the attacker used a compromised key to enter its own site, and Nethemba saw the stolen keys used again on 2026-10-21, after 1.26.13 shipped."
  - claim_id: 293330f725
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "actions[0]"
    kind: frontmatter
    text: "On every WordPress site your organisation, its web agencies or its hosting suppliers run with UpdraftPlus, free or premium, including old municipal, campaign and project sites, check for an UpdraftCentral key (wp option get updraft_central_localkeys, or Settings > UpdraftPlus Backups > Advanced Tools > UpdraftCentral) and delete every key even if nobody remembers using UpdraftCentral, then update to 1.26.13 or 2.26.13 or later; deleting a key stops remote management only, and backups keep working."
  - claim_id: 57f979ad73
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "actions[1]"
    kind: frontmatter
    text: "On any site where a plugin, must-use plugin or Editor account holding manage_options appears that nobody created, delete the UpdraftCentral key first, then restore the site from a backup taken before 17 October, rotate every administrator and UpdraftCentral password, the teamupdraft.com account password (which UpdraftPlus Premium can leave stored in the site database and its backups) and end all sessions."
  - claim_id: 6720ae6c14
