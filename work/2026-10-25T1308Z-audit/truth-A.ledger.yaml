    kind: cited
    text: "Publica's page, updated on 2026-10-20, says it is still examining whether data left its holdings and whose, still has no indication that data was published on the darkweb, and has updated its list of questions and answers ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: f57ea57b73
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "Netzwoche updated its running story on 2026-10-21, relaying the paywalled article that Tamedia's Tages-Anzeiger published on 2026-10-20: the Federal Council and the security authorities now assume that data on practically all current and former employees of the Confederation and of federally affiliated bodies left, among them federal judges, former Federal Council members (the sitting members are said to be spared), intelligence-service staff, elite soldiers and cleaning staff (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025", "https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: f227a4555d
