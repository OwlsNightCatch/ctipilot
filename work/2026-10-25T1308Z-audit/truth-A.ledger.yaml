    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "Blick adds, from its own information, that the cantons were also informed because a combination of certain stolen data sets may allow conclusions about Swiss defence capability, and that the Confederation warns internally that some employees could be recognised and questioned by the authorities of another country ("
    urls: ["https://www.blick.ch/politik/daten-debakel-beim-bund-sicherheitsorgane-betroffen/jle39rp"]
  - claim_id: 928caeb7c4
