    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "The Finance Department confirms only that the Federal Council was informed on Wednesday and says neither the Federal Council nor a department supervises Publica; Publica says it set up a crisis staff and is still establishing which data and how many people are affected ("
    urls: ["https://www.blick.ch/politik/daten-debakel-beim-bund-sicherheitsorgane-betroffen/jle39rp"]
  - claim_id: f8b5c86916
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-20T03:39:20Z"
    kind: cited
    text: "The NZZ reports that the pension consultancy Libera AG confirmed on Friday 2026-10-16 that it also works with PK Softech and is therefore affected, and that PK Softech first told Libera on 2026-10-14 that personal data had also left, without knowing which; Libera can neither confirm nor rule out that the funds it manages or individual insured persons are affected ("
