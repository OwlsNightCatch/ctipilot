  - claim_id: 6271f75800
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "headline"
    kind: frontmatter
    text: "Three configuration-dependent NGINX heap flaws (CVSS 9.2) are fixed in 1.30.6, 1.31.7 and Debian trixie, not bookworm"
  - claim_id: b05a4936ff
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "summary"
    kind: frontmatter
    text: "The nginx 1.30.6 (stable) and 1.31.7 (mainline) releases of 2026-10-14 fix five security flaws, three of them heap-corruption bugs that F5 scores CVSS 4.0 9.2 and an unauthenticated attacker can reach with crafted HTTP requests, but only on configurations that combine alias with rewrite and $request_filename, use a regex map whose captures are referenced before its output variable, or enable asynchronous file I/O with server-side includes; the other two concern HTTP/3 and TLS session ticket key rotation. F5 says the heap flaws restart the worker, with code execution only where ASLR is disabled or bypassed; no exploitation or public proof of concept is reported, nginx.org rates all five medium, and Debian fixed trixie with DSA-6575-1 on 2026-10-21 while its bookworm package is still marked vulnerable."
  - claim_id: c75b39f07d
    entry: 2026-10-20/nginx-three-unauth-heap-corruption-flaws-fixed-1-30-6
    surface: "actions[0]"
    kind: frontmatter
    text: "Run nginx -T on every internet-facing NGINX reverse proxy, load balancer and ingress and upgrade each one whose configuration uses alias with rewrite and $request_filename, a regex map whose captures are referenced before its output variable, or aio together with ssi, HTTP/3 or TLS session ticket key rotation to nginx 1.30.6 or 1.31.7 (NGINX Plus 37.0.5.1 or 37.1.0.1); where the package comes from Debian trixie, install the DSA-6575-1 update (1.26.3-3+deb13u10); on bookworm, which the tracker still marks vulnerable, apply F5's configuration workaround until the distribution ships a fix."
  - claim_id: b50e911107
