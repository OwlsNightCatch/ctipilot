  - claim_id: efbc3ea851
    entry: 2026-10-25/qnap-synology-php2shell-nas-fixes-four-qnap-products-unfixed
    surface: "summary"
    kind: frontmatter
    text: "QNAP's advisory QSA-26-18 says the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2) affect the PHP in the web components of QTS, QuTS hero, QuTScloud and several QNAP applications and can be triggered before any application-level authentication. Fixed QTS, QuTS hero and QuTScloud builds dated 2026-10-23 are out; Note Station 3, QNE (ADRA), QVR Surveillance (ARM32) and TVR OS have no fix yet, and QNAP says to keep devices off the internet until they do. QNAP has seen scanning and exploitation attempts against the flaws in the wild but no reports of exploitation targeting its products. Synology's advisory fixes its PHP packages, Mail Station and Calendar and rates the PHP built into DSM as not exposed."
  - claim_id: 1eddad3df5
    entry: 2026-10-25/qnap-synology-php2shell-nas-fixes-four-qnap-products-unfixed
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every QNAP NAS on QTS, QuTS hero or QuTScloud to the builds of 2026-10-23 (QTS 6.1.0.3656 or 5.2.11.3661, QuTS hero h6.1.0.3656, h6.0.2.3656 or h5.2.11.3661, QuTScloud c5.2.9.3661), and take any QNAP device running Note Station 3, QNE, QVR Surveillance or TVR OS off the internet until QNAP lists a fix."
