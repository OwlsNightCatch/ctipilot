  - claim_id: 1fcd58374a
    entry: 2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally
    surface: "summary"
    kind: frontmatter
    text: "Metabase disclosed on 2026-08-06 that its Metabase Cloud platform was attacked through a previously unknown vulnerability in versions 1.58 and above: an unauthenticated attacker injects arbitrary SQL against the application database and obtains administrator access to the instance, from which they can rewrite configuration, steal the stored credentials for every connected database and export the data those connections reach. The only interim workaround the vendor offers is to block the /api/session/reset_password endpoint, which is also where its published attack pattern runs. Cloud instances were patched by the vendor; self-hosted deployments stay vulnerable until manually upgraded to 0.58.24, 0.59.21, 0.60.17, 0.61.11, 0.62.9 or 0.63.5. Laptop maker Framework and form builder Tally confirmed customer data was taken from instances accessed on 2026-08-03. The flaw had no CVE identifier at disclosure; it is now tracked as CVE-2026-72898, which CISA added to its KEV catalog on 2026-08-11. VenariX now tracks fifteen publicly confirmed downstream incidents and ties two of them, at Statista and Dodo Payments, to the Dire Wolf extortion group working against self-hosted instances."
