- entry: 2026-10-20/cve-2026-110936-siemens-software-center-clickfix-sideload
  verdict: imprecision
  defects:
  - where: cves[CVE-2026-110936].status and tags
    claim: 'status: [exploited, patch-available]'
    defect: 'The status omits the CISA KEV listing: CISA added CVE-2026-110936 to the KEV catalog on 2026-10-20, so status (and the cisa-kev tag) is incomplete against the current KEV record.'
    ground_truth: 'KEV: cveID CVE-2026-110936, Siemens Software Center, ''Siemens Software Center Uncontrolled Search Path Element Vulnerability'', dateAdded 2026-10-20.'
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: Add cisa-kev to cves[].status and tags through an update record that cites the KEV listing.
    class: imprecision
