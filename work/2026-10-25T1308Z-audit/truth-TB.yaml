    defect: 'Omission: the per-CVE vendor advisories publish scores that the records leave null.'
    ground_truth: 'FG-IR-25-910 (CVE ID CVE-2025-64446): Severity Critical, CVSSv3 Score 9.8, temporal 9.4. FG-IR-19-007 (CVE-2019-6693): Severity Medium, CVSSv3 Score 4.3, temporal 4.2, Attack Type Authenticated.'
    ground_truth_url: https://fortiguard.fortinet.com/psirt/FG-IR-25-910
