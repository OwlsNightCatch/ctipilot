entries:
- entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
  verdict: imprecision
  defects:
  - where: evidence[5] (VulnCheck)
    claim: was successful on x86-64 platforms with ASLR enabled
    defect: 'The quote is not a contiguous passage of the live VulnCheck page: the page was edited after publication (the Wayback snapshot of 2026-10-23 08:20:27Z still carries the exact words; the substance
      of the entry text is unchanged and still supported).'
    ground_truth: 'Live page: "Our initial exploit leveraged a VulnCheck-discovered memory leak chained into RCE on PHP 8.4.26 on x86-64 platforms with ASLR enabled and `display_errors=off`, the recommended
      production configuration." Archived 2026-10-23 08:20Z version: "Our initial exploit leveraged a confirmed memory leak chained into RCE on PHP 8.4.26 and was successful on x86-64 platforms with ASLR
      enabled and display_errors=off".'
    ground_truth_url: https://www.vulncheck.com/blog/php2shell-vulnerabilities
    fix: Replace the quotation with the live fragment "chained into RCE on PHP 8.4.26 on x86-64 platforms with ASLR enabled" (or drop it) in a correction record; the body wording ("holds a weaponized exploit
      ... successful on x86-64 with ASLR enabled and display_errors off") can stay.
    class: imprecision
  - where: body paragraph 2 (products that embed PHP) and Palo Alto sentence
    claim: Palo Alto Networks lists PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected, with hotfixes scheduled for 2026-10-26 to 2026-10-30
    defect: 'Stale as of 2026-10-25: Palo Alto removed the ETA for three hotfix builds, so "scheduled for 2026-10-26" no longer describes the table; the remaining ETAs run 2026-10-27 to 2026-10-30.'
    ground_truth: 'Advisory timeline: "2026-10-25 Updated the Frequently Asked question (FAQ) section. Also, removed the ETA for 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16"; table rows ">= 10.2.18-h13", ">=
      11.1.16-h4", ">= 11.2.10-h16" carry no ETA, other builds keep ETAs 10/27 to 10/30. The advisory is now "Updated 2026-10-25".'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-109618
    fix: 'Next update record: hotfixes for 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16 are listed without a date as of 2026-10-25 (i.e. released), remaining PAN-OS hotfixes 2026-10-27 to 2026-10-30.'
    class: imprecision
  - where: section "Update — 2026-10-22T03:45:26Z", attack-traffic paragraph
    claim: no source reports a confirmed compromise
    defect: '(low confidence) Undated present-tense statement that the 2026-10-24 section supersedes: Unit 42 (updated 2026-10-23) reports a successful intrusion of a European government entity.'
    ground_truth: 'Unit 42: "In one case, the attackers targeted a government entity in Europe and within two hours of the initial exploitation they had successfully accessed password hashes and multi-factor
      authentication secrets."'
    ground_truth_url: https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/
    fix: Qualify as "as of 2026-10-22" (the section is a dated history; the 2026-10-24 section already carries the correction).
    class: imprecision
  - where: sources[] Publica publisher label
    claim: Publica (status page, status as of 2026-10-21)
    defect: (low confidence) The cited status block is headed 22.10.2026, not 2026-10-21; the outage itself was 2026-10-21, which the body states correctly.
    ground_truth: 'Page: "Status as of 22.10.2026 ... publica.ch outage: no connection with the cyber attack ... unavailable on the afternoon of Wednesday, 21 October 2026 ... Since 6.30 pm, publica.ch
      has been available again."'
    ground_truth_url: https://www.publica.ch/en/cyber-attack-software-supplier
    fix: Label the source "status as of 2026-10-22".
    class: imprecision
- entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
  verdict: imprecision
  defects:
  - where: evidence[3] (Unit 42)
    claim: Ransomware operators exploiting CVE-2026-0257 include Spikey Scorpius (aka Qilin) and Tarnished Scorpius (aka Inc).
    defect: 'Not a contiguous passage of the live Unit 42 brief: the brief was copyedited on 2026-10-23 (after the entry''s 2026-10-21 update); the Wayback snapshot of 2026-10-22 carries the exact words.
      Substance unchanged.'
    ground_truth: 'Live page: "Ransomware operators exploiting the May 2026 CVE-2026-0257 include Spikey Scorpius (aka Qilin) and Tarnished Scorpius (aka Inc)." Footer: "Updated October 23, 2026, at 11:15
      a.m. PT to add clarifying copyedits."'
    ground_truth_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
    fix: Re-quote as "Ransomware operators exploiting the May 2026 CVE-2026-0257 include Spikey Scorpius (aka Qilin) and Tarnished Scorpius (aka Inc)." in a metadata correction.
    class: imprecision
  - where: section "Update — 2026-06-10T05:00:16Z", second sentence
    claim: The bug (CWE-565, reliance on a cookie without integrity checking) lets an attacker extract the encryption certificate's public key from the TLS handshake and forge authentication-override cookies
      ... ([Rapid7, 2026-05-29])
    defect: 'True fact, mis-attributed citation: the CWE-565 label is in the Palo Alto advisory; the Rapid7 page has no CWE reference and no "TLS handshake" wording (it says an attacker can discover the
      certificate public key and forge cookies; its PoC retrieves the certificate chain of the HTTPS service).'
    ground_truth: 'Palo Alto advisory: "CWE-565 Reliance on Cookies without Validation and Integrity Checking". Rapid7: "a remote unauthenticated attacker can discover the public key for that certificate
      ... forge and encrypt arbitrary authentication override cookies".'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Cite the Palo Alto advisory for the CWE-565 clause and keep Rapid7 for the forged-cookie mechanism.
    class: imprecision
- entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
  verdict: imprecision
  defects:
  - where: updates[] record 2026-10-23T03:43:28Z summary (and record 2026-10-25 "the same stop-gap again")
    claim: replacing blocked.certs or enabling revocation checking is the stop-gap
    defect: '(low confidence) No page readable today names blocked.certs: OpenJDK''s and Oracle''s current guidance is to delete four cacerts aliases or enable revocation checking; the earlier OpenJDK wording
      is not retrievable (earliest Wayback snapshot 2026-10-24 21:04Z), and the record''s "the tracker lists the fixed builds" is not in the 2026-10-23 section it summarises. The 2026-10-25 record''s "the
      same stop-gap again" then points at a stop-gap that has changed.'
    ground_truth: 'openjdk.org/emudhra and ops.java/emudhra: "Remove the relevant root certificates ... emsignrootcag1, emsignrootcag2, emsigneccrootcag3, comodoaaaca" or "Check for revoked certificates";
      no mention of blocked.certs.'
    ground_truth_url: https://openjdk.org/emudhra
    fix: Record summaries are append-only; if corrected at all, state in the next update that the earlier blocked.certs stop-gap was replaced by alias deletion or revocation checking.
    class: imprecision
