- entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
  verdict: factual-error
  defects:
  - where: summary, title, headline and body paragraph 1
    claim: no fixed build is released, hotfixes for each PAN-OS train carry estimated dates from 2026-10-26 to 2026-10-30
    defect: 'Stale as of 2026-10-25 (one day after the entry''s last update): the vendor removed the ETA for three hotfix builds, which its table then lists without a date, i.e. as available; "no fixed
      build is released" and "hotfixes ... due 26 to 30 October" no longer match the vendor channel.'
    ground_truth: 'Timeline: "2026-10-25 Updated the Frequently Asked question (FAQ) section. Also, removed the ETA for 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16". Table: ">= 11.2.10-h16", ">= 11.1.16-h4",
      ">= 10.2.18-h13" without ETA; other builds keep ETAs 10/27 to 10/30. Solution text still says "will be fixed in the upcoming releases" (boilerplate). The download portal is login-gated, so availability
      is inferred from the table.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-109618
    fix: 'Update record: 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16 are listed as fixed without an ETA on 2026-10-25, remaining hotfixes 2026-10-27 to 2026-10-30; adjust title, headline and summary.'
    class: factual-error
  - where: cves[CVE-2026-109618] and cves[CVE-2026-109619] status and fixed; tags
    claim: 'status: [no-patch, mitigation-only]; fixed: "none released; hotfix ETAs ... 11.2.10-h16 (10/26) ... 11.1.16-h4 (10/26) ... 10.2.18-h13 (10/26)"; tags: [..., no-patch]'
    defect: 'Stale as of 2026-10-25: those three builds no longer carry an ETA, so the no-patch status and the 10/26 ETAs are outdated for the 10.2, 11.1 and 11.2 trains.'
    ground_truth: 'Same advisory table: ">= 11.2.10-h16", ">= 11.1.16-h4", ">= 10.2.18-h13" (no ETA); remaining builds 12.2.4-h1 (10/28), 12.1.4-h13 (10/29), 12.1.7-h11 (10/28), 12.1.10-h3 (10/30), 11.2.4-h23
      (10/30), 11.2.7-h23 (10/29), 11.2.13-h4 (10/27), 11.2.16-h1 (10/28), 11.1.4-h38 (10/29), 11.1.6-h40 (10/29), 11.1.7-h12 (10/30), 11.1.10-h36 (10/28), 11.1.13-h16 (10/27), 10.2.7-h39 (10/30), 10.2.10-h42
      (10/29), 10.2.13-h27 (10/27), 10.2.16-h12 (10/28) unchanged.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-109618
    fix: Set status to patch-available for the three trains (or per-train wording), drop the no-patch tag, move the three builds from ETA list to fixed list.
    class: factual-error
  - where: Defender takeaway
    claim: its revision of 2026-10-23 schedules the first PAN-OS hotfixes for 2026-10-26 (10.2.18-h13, 11.1.16-h4 and 11.2.10-h16) and the rest by 2026-10-30, so install the hotfix of each train when it
      is released
    defect: 'Stale as of 2026-10-25: the first three hotfixes are listed without an ETA, so the action "install when released" can already be taken for 10.2, 11.1 and 11.2.'
    ground_truth: 'Timeline 2026-10-25: "removed the ETA for 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16".'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-109618
    fix: 'Rewrite: install 10.2.18-h13, 11.1.16-h4 or 11.2.10-h16 now where the train matches; the remaining builds follow 2026-10-27 to 2026-10-30.'
    class: factual-error
- entry: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
