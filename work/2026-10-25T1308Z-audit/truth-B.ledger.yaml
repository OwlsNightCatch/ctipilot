    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33549 is an SMB Direct integer underflow that needs an RDMA interface, a writable share and an SMB Direct client, and its proof of concept crashes the kernel ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 6ec3c01a0c
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI scores both 9.0, and Red Hat Enterprise Linux does not include ksmbd by default ("
    urls: ["https://thehackernews.com/2026/10/two-cvss-90-linux-ksmbd-rce-flaws.html"]
  - claim_id: 7690f8da85
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "For ksmbd, look for the ksmbd module, the ksmbd.mountd daemon and a kernel-owned listener on TCP 445 ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 01fedf99f6
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Detection:** the exploit is one unprivileged process that unshares into new user and network namespaces and writes sysctls, brings up an nlmon interface, installs XFRM state over netlink, adds an nftables NFQUEUE rule, attaches a tc pedit action with a redirect and then calls splice() into a socket on the loopback address; Sysdig says nothing legitimate does all of that from one unprivileged process, so syscall-level runtime telemetry sees it ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 80704de0d2
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** restrict unprivileged user namespaces where nothing depends on them (Sysdig says user.max_user_namespaces=0 should block the public exploit, untested by TuxCare, and breaks rootless containers and some build tooling), do not rely on Ubuntu's AppArmor restriction, set seccomp RuntimeDefault on Kubernetes pods and patch the day the distribution ships the fix; unload ksmbd where unused and keep TCP 445 to trusted networks where it must stay ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 4c510d79bc
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: uncited
    text: "Two reports concern ksmbd, the kernel's own SMB server, not Samba."
  - claim_id: 5f8a837f60
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: uncited
    text: "The other two reports, a vmwgfx and an nvmet flaw, have only titles public."
  - claim_id: 6172cd1d10
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: derived
    text: "**Exposure:** a Linux host where a local user or workload can run code and unprivileged user namespaces are on (shared hosting, CI runners, container nodes, login nodes) on the distributions above."
  - claim_id: c7d620b5e1
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
