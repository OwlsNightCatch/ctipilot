    surface: "body"
    kind: cited
    text: "Symantec's Threat Hunter Team reports that Swallowtail, which it equates with APT28, Fancy Bear and Forest Blizzard, targeted organizations in two NATO member states: a law-enforcement agency, a naval shipbuilder and a manufacturer of military aircraft engines, none named ("
    urls: ["https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets"]
  - claim_id: 52f101903c
    entry: 2026-10-21/apt28-hookedge-backdoor-nato-police-shipbuilder-ssh-tunnel
    surface: "body"
    kind: cited
    text: "Recorded Future had documented the HOOKEDGE backdoor in August, from campaigns between late September 2025 and early April 2026 against government and diplomatic organizations in Romania, Spain and Turkiye, and assesses with moderate confidence that BlueDelta, which overlaps APT28, is behind it ("
    urls: ["https://www.recordedfuture.com/research/bluedelta-targets-with-hookedge"]
  - claim_id: 71c45ddebc
    entry: 2026-10-21/apt28-hookedge-backdoor-nato-police-shipbuilder-ssh-tunnel
    surface: "body"
    kind: cited
    text: "At the shipbuilder the vector was a macro-enabled Word document opened from the Outlook attachment cache on 2026-07-24, so it arrived by email; its macro dropped a VBScript launcher, an HTML pair that auto-submits a hidden form to a webhook endpoint and a batch script ("
    urls: ["https://www.security.com/threat-intelligence/swallowtail-russia-nato-targets"]
  - claim_id: bd2a7ab733
    entry: 2026-10-21/apt28-hookedge-backdoor-nato-police-shipbuilder-ssh-tunnel
    surface: "body"
    kind: cited
    text: "The batch script kills any running Microsoft Edge and restarts it as a one-pixel, off-screen window carrying an inline script instead of a URL, so the browser fetches the next task from the public webhook.site service, and the batch script then runs the task and uploads its output to the same endpoint ("
