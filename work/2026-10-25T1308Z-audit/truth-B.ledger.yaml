    text: "Symantec: APT28's hidden-Edge backdoor hit law-enforcement and defence targets; at a shipbuilder it added an SSH tunnel"
  - claim_id: 648934281e
    entry: 2026-10-21/apt28-hookedge-backdoor-nato-police-shipbuilder-ssh-tunnel
    surface: "summary"
    kind: frontmatter
    text: "Symantec reports that APT28, which it tracks as Swallowtail, used the HOOKEDGE backdoor against a law-enforcement agency, a naval shipbuilder and a military aircraft-engine manufacturer in two NATO member states, none named. A macro-enabled Word document started a script chain that uses a hidden, off-screen Microsoft Edge window as its HTTP client against a public webhook service; at the shipbuilder the operators then pushed an SSH private key for a persistent tunnel, captured NTLM handshakes from the host itself and ran a previously undocumented in-memory loader, in an intrusion that lasted at least two months. Recorded Future had documented HOOKEDGE against government and diplomatic targets in Romania, Spain and Turkiye in August."
  - claim_id: 2dc676a001
