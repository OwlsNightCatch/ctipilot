    text: "Palo Alto publishes no flaw-specific indicator and reports no exploitation of its products, so no post-compromise check is defined yet ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 6ae44a4753
