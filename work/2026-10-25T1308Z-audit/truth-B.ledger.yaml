    surface: "body"
    kind: cited
    text: "**Defender takeaway:** move management access behind a jump box or trusted internal addresses now, and remove management profiles from dataplane interfaces that face untrusted networks; Palo Alto lists no workaround beyond that restriction and the Threat Prevention coverage; its revision of 2026-10-23 schedules the first PAN-OS hotfixes for 2026-10-26 (10.2.18-h13, 11.1.16-h4 and 11.2.10-h16) and the rest by 2026-10-30, so install the hotfix of each train when it is released, while the advisory's note and mitigation text cover PAN-OS and Panorama together and its table no longer distinguishes Panorama, so apply the same management-access restriction to Panorama ("
