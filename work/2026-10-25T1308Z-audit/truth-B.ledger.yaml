    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "Wiz Research reports an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors throughout October 2026, focused on Okta, Entra and Cognito and on Microsoft 365 integrations, with most attempts failing ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: a88f89c6d6
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "It describes the log signatures of the agent: source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, fabricated OAuth callback values, unsigned JWTs tried against more than 60 SSO route variants in two minutes, account-recovery and sign-up calls, and password-spray bursts of 20 to 60 minutes against Entra and Okta with a unique user agent per burst and a median gap of one second between attempts ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: d81618e283
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
