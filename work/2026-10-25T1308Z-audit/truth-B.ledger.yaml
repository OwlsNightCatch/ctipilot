    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: cited
    text: "Palo Alto describes the flaws as remote code execution but scores their impact on its own product CVSS-B 8.7 (severity high, urgency moderate), with high availability impact and none on confidentiality or integrity, against a vendor-level 9.2 with high impact on all three, and says the risk is highest where management access is allowed from external addresses on the internet; restricting management to a single jump box lowers its rating to 7.1, and it is not aware of any malicious exploitation against its products ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 760be63d0b
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: cited
    text: "Unit 42 says it has seen proof of concept of the PHP flaws ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 5017f012e2
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: cited
    text: "Until fixes ship, Palo Alto recommends restricting management access to trusted internal addresses and offers Threat Prevention coverage (Threat IDs 543004 and 97622 to 97625 and twenty further IDs from 97643 to 97678, Applications and Threats content versions 9162, 9163, 9164 and later) that applies only when management traffic is routed through a dataplane interface, the certificate for inbound management traffic has been replaced, inbound management traffic is decrypted so the firewall can inspect it, and threat prevention is enabled on that traffic ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 90da930d67
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: cited
    text: "**Exposure:** every PAN-OS firewall and Panorama appliance, whatever the configuration, through its management web interface; the service is reachable from the internet where the management port, or a dataplane interface carrying a management profile, answers HTTPS or XML API requests from outside the administrator range ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 5ac3648885
