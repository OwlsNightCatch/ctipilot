    surface: "cves[CVE-2026-0257]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-0257\", \"cvss\": \"7.8\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"PAN-OS 12.1, 11.2, 11.1 and 10.2 below the fixed builds, with a GlobalProtect portal or gateway where authentication override cookies are enabled and a specific certificate configuration exists; Prisma Access 11.2 and 10.2 below the fixed builds\", \"fixed\": \"12.1.4-h6, 12.1.7; 11.2.4-h17, 11.2.7-h14, 11.2.10-h7, 11.2.12; 11.1.4-h33, 11.1.6-h32, 11.1.7-h6, 11.1.10-h25, 11.1.13-h5, 11.1.15; 10.2.7-h34, 10.2.10-h36, 10.2.13-h21, 10.2.16-h7, 10.2.18-h6; Prisma Access 11.2.7-h13, 10.2.10-h36\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
