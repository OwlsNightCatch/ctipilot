  - claim_id: 7f5ba0c192
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "headline"
    kind: frontmatter
    text: "Qilin and Inc ransomware exploit the GlobalProtect bypass; one intrusion pivoted to vCenter and ESXi past in-guest EDR"
  - claim_id: d2cf67b8fd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-0257 is a pre-auth VPN authentication bypass in PAN-OS GlobalProtect (CISA KEV; Palo Alto reports limited exploit attempts, and Rapid7 and Unit 42 report successful exploitation): an attacker forges valid auth-override cookies by re-using the GlobalProtect certificate shared with the HTTPS service, with no credentials. CISA's KEV catalog (version 2026.10.04) marks it as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with this bypass. Unit 42 now names Qilin and Inc as exploiting it and describes one intrusion that pivoted from the VPN gateway to vCenter and ESXi and stole domain credentials offline from a domain controller's virtual disk, which in-guest EDR does not see. Patch or disable auth-override cookies, and treat a gateway that was exposed and unpatched as a compromise-assessment target that includes the virtualization and backup tier."
  - claim_id: 523d4caf16
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every PAN-OS GlobalProtect portal and gateway to the fixed build in Palo Alto's advisory for its minor release (users then re-authenticate once, because the fixed firewall regenerates the override cookie), or until then disable Authentication Override or give the cookies a certificate that no other feature uses."
  - claim_id: a33be0f90c
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[1]"
    kind: frontmatter
    text: "On every GlobalProtect gateway that was internet-reachable and unpatched at any time since 2026-05-17, treat the network behind it as a ransomware compromise-assessment target: review VPN sessions that authenticated by cookie from unexpected sources, check Windows hosts for the artifacts Arctic Wolf describes (a ransomware payload staged under C:\\\\PerfLogs, a PsExec service, an LSASS dump written through comsvcs.dll to an .odt file, an ntdsutil media copy of the Active Directory database, and cleared event logs), and extend the assessment to the virtualization and backup tier: vCenter and ESXi audit logs for a changed execInstalledOnly setting and for access to a domain controller's virtual disk, and the Veeam backup server, because Unit 42 describes one intrusion that pivoted from the gateway to vCenter and dumped domain credentials offline, which in-guest EDR does not see."
  - claim_id: e39612156f
