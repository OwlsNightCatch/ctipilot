    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "headline"
    kind: frontmatter
    text: "Public root exploit for a Linux page-cache write that gets past the Dirty Frag fix; no CVE and no merged fix yet"
  - claim_id: 065a572f54
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro's Zero Day Initiative copied public Linux kernel lists on five kernel reports on 2026-10-21 before any fix was merged, and Sysdig ranks ZDI-CAN-33367 as the one to act on: a local privilege escalation through skb_zerocopy() that gets past the Dirty Frag fix, with a public exploit that TuxCare reproduced as root on AlmaLinux 8 to 10, CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04. A reviewed patch is on netdev but not merged, none of the six reports has a CVE, and two ksmbd reports that ZDI scores CVSS 9.0 matter only where the in-kernel SMB server runs; no exploitation in the wild is reported."
  - claim_id: f9dc4d5c20
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "On 2026-10-21 Trend Micro's Zero Day Initiative sent five Linux kernel reports and copied public mailing lists on every one, several with no fix in any released kernel; none of the six reports, a ConnMan one included, has a CVE ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: fbeaabd1ad
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33367 matters most: skb_zerocopy() moves shared page-cache pages into a new socket buffer without the marker the Dirty Frag fix added, so IPsec ESP decrypts in place and an unprivileged local user writes attacker bytes into the cached copy of a read-only file, which gives root through a setuid binary or /etc/passwd; the public exploit needs unprivileged user namespaces and networking modules such as nlmon and act_pedit ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 5f430738ec
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "TuxCare reproduced a root shell on AlmaLinux 8 to 10 (Dirty Frag fix installed), CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04 (AppArmor user-namespace restriction bypassed) ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: fb554b0300
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "A reviewed patch is on netdev but not merged, TuxCare says no fix has been merged upstream or shipped in a distribution kernel, and a kernel with only the fix for CVE-2026-90049, a bug in the same function, is not covered ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", "https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/"]
  - claim_id: 9071d816e7
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "TuxCare's rebootless KernelCare patch is out for EL10, with EL9 in review, EL8 in progress and Debian and Ubuntu not started ("
    urls: ["https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/"]
  - claim_id: 0fc27842b3
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33774 is a pre-authentication race in the SMB1 or SMB2 handler choice: its public proof of concept leaks 28 bytes of kernel heap per attempt and can crash the kernel, ZDI labels it remote code execution, nothing public shows code execution, and a fix is queued in ksmbd-for-next ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", "https://www.phoronix.com/news/LKML-New-Trend-Vulnerabilities"]
