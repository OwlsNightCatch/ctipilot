  - claim_id: 8e69156052
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The PHP project released PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix two critical vulnerabilities that can allow unauthenticated remote code execution, CVE-2026-109618 and CVE-2026-109619, both CVSS 4.0 9.2, and urges all PHP users to update immediately ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5", "https://www.php.net/archive/2026.php#2026-10-20-1"]
  - claim_id: 4e8cfc4fcd
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Sources date the release between 13:30 UTC (CERT-EU) and 14:00 UTC (Sansec), with ENISA giving 13:40 UTC, against the 14:00 UTC the project had announced the day before ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-018/", "https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities", "https://sansec.io/research/php2shell", "https://www.php.net/archive/2026.php#2026-10-20-1"]
  - claim_id: 66ae9cbe01
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109618 is memory corruption when PHP handles an out-of-memory error: it aborts the request with longjmp() while internal request data is only partly initialised, and request cleanup then treats the invalid data as valid ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w"]
  - claim_id: 35f3424034
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109619 is stale global state: request-owned state survives a fatal error after its memory is freed, and a later request on the same worker uses it ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: ead4c57df5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Every PHP installation serving web requests is at risk, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP and LiteSpeed; the project rates mod_php highest, with a demonstrated exploit where an unauthenticated request can trigger the attack before any application code runs ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5"]
  - claim_id: 302ee087a5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The confirmed impact is unauthenticated code execution as the web worker account, validated against mod_php with default settings, and for the second flaw against both mod_php and FPM through session upload progress, which is on by default and needs no session_start() call ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w", "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: 7840f1377b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The advisory for the second flaw also lists heap use-after-free and memory disclosure among the confirmed impacts ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: 9d0b645a06
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and Sansec says the leaked worker memory can hold passwords, session tokens, API keys and TLS private keys from other requests, though it assigns the upload-progress memory disclosure to CVE-2026-109618 while the PHP advisories list memory disclosure and session upload progress under CVE-2026-109619, and both put the fatal-backtrace path under CVE-2026-109619; the PHP advisories are the authority on which flaw is which ("
    urls: ["https://sansec.io/research/php2shell"]
  - claim_id: 36d2e337ea
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Sansec relays that Calif demonstrated unauthenticated code execution against Magento, WordPress, Drupal, Joomla, MediaWiki, Roundcube, phpMyAdmin, Nextcloud and Laravel ("
    urls: ["https://sansec.io/research/php2shell"]
