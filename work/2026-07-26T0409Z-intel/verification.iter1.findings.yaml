  summary: >
    The evidence[] quote (and the identical inline body quote) is not a contiguous verbatim substring
    of the depthfirst primary. The source reads: "A normal authenticated user able to create or push to
    a project and view the resulting commit diff could commit an .ipynb file" (verified in the on-disk
    extract work/2026-07-26T0409Z-intel/depthfirst-gitlab.html). The entry dropped "normal" and changed
    "A normal" to "an", so the quoted text does not appear on the page as written. Fix: use the exact
    substring, e.g. "authenticated user able to create or push to a project and view the resulting commit
    diff could commit an .ipynb file" or restore "A normal authenticated user ...". Low severity (meaning
    preserved) but evidence[] quotes are rendered as verbatim and must be copyable unchanged.
