items:
  - title: "depthfirst chains two Ruby JSON-parser memory-corruption bugs into unauthenticated-feeling GitLab RCE via the Jupyter-notebook diff renderer — no CVE assigned"
    sources:
      - { url: "https://depthfirst.com/research/going-depthfirst-achieving-gitlab-rce-via-two-ruby-memory-corruption-vulnerabilities", publisher: "depthfirst (research)", date: "2026-07-24", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html", publisher: "The Hacker News", date: "2026-07-25", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"threat research blog post July 25 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html → primary: depthfirst research post, URL https://depthfirst.com/research/going-depthfirst-achieving-gitlab-rce-via-two-ruby-memory-corruption-vulnerabilities"
    summary: |
      depthfirst (a security-research vendor running an automated vulnerability-discovery
      system, the "Open Defense Initiative") disclosed a remote-code-execution chain
      reaching GitLab CE/EE through its bundled `ipynbdiff` gem, which invokes
      `Oj::Parser.usual.parse` — the native-C implementation of the Oj Ruby JSON parser —
      inside a long-lived Puma worker whenever a repository's commit diff includes a
      `.ipynb` (Jupyter notebook) file. Two Oj memory-safety bugs (present in Oj for
      ~5 years) are chained: an unchecked 16-bit key-length narrowing truncates an
      oversized (~65,535-byte) JSON object key to 29 bytes and returns/discloses a live
      heap pointer that GitLab's notebook-diff renderer prints into the diff output
      (used to locate libc in memory); and an unchecked nesting-stack overflow in
      `Oj::Parser.usual.parse` gives a write primitive that redirects a parser callback
      / function pointer to `system()`. The whole chain requires only an authenticated
      GitLab user with push access to any project — no admin rights, no CI/runner
      access, and no victim interaction: the attacker commits two crafted notebooks and
      requests the commit diff (`GET /<project>/-/commit/<sha>/diffs_stream`). Affected:
      GitLab CE/EE 15.2.0-18.10.7, 18.11.0-18.11.4, and 19.0.0-19.0.1. GitLab quietly
      bumped the Oj dependency to the fixed release on 2026-06-10 without flagging it as
      a security fix (no entry in GitLab's security-fix table, no CVE, no CVSS score),
      creating a 44-day silent-patch window before depthfirst's working PoC (GitHub:
      wupco/gitlab-rce-demo) was published on 2026-07-24. No in-the-wild exploitation
      is reported — this is a disclosed researcher PoC, not observed attacker activity.
      Fixed in GitLab 18.10.8, 18.11.5 and 19.0.2; depthfirst states neither GitLab nor
      depthfirst offers a workaround for instances that cannot upgrade immediately.
    region_nexus: "global; any self-managed GitLab CE/EE instance (incl. Swiss/EU public-sector and CI DevOps estates) in the affected version range"
    primary_sector_nexus: "indirect — GitLab is widely used as internal DevOps/CI infrastructure across public-sector and critical-infrastructure engineering teams"
    sector: "public-sector, energy, telco, finance (any org self-hosting GitLab CE/EE)"
