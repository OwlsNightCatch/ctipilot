    evidence:
      - quote: "GitLab did not file the fix as a security fix…not in the security-fix table. There is no CVE, no CVSS score, and no mention of the notebook-diff chain."
        attribution: "The Hacker News, citing depthfirst"
        source_url: "https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html"
      - quote: "Any authenticated user who can push to a project can run it…No administrator rights, no CI or runner access, no victim interaction."
        attribution: "The Hacker News, citing depthfirst"
        source_url: "https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html"
      - quote: "The resulting chain affected GitLab CE and EE versions 15.2.0 through 18.10.7, 18.11.0 through 18.11.4, and 19.0.0 through 19.0.1. GitLab released patches shortly after receiving our reports."
        attribution: "depthfirst"
        source_url: "https://depthfirst.com/research/going-depthfirst-achieving-gitlab-rce-via-two-ruby-memory-corruption-vulnerabilities"
    extended_notes: |
      Defender framing: detection telemetry class is web/app-access logging on the
      GitLab Rails/Workhorse layer for `.../-/commit/<sha>/diffs_stream` requests
      correlated with recently-pushed `.ipynb` files carrying implausible field lengths
      (e.g. object keys near the 65,535-byte boundary that only make sense as a
      deliberate truncation trigger) — the exploit's own mechanics require the attacker
      to push two purpose-built notebooks and then request their diff in sequence, which
      is a mechanical (not source-stated) discriminator from routine data-science
      notebook review traffic. Process-telemetry class: unexpected child processes
      forked from the GitLab Puma/Rails worker (parent image `puma`/`bundle exec puma`)
      spawning a shell interpreter would reflect the `system()` redirection this chain
      achieves. Hardening: upgrade to 18.10.8 / 18.11.5 / 19.0.2 now; in the interim,
      tighten project push-access grants since the whole chain requires only ordinary
      push rights and no elevated permissions. Broader lesson for supply-chain/dependency
      visibility: the underlying fix shipped as an unlabeled dependency bump, so teams
      that gate patching on GitLab's security-advisory feed alone missed it for 44 days;
      this is a second recent case (after the widely-covered Oj/Puma-style "quiet native
      C dependency" pattern) of native-C Ruby gems as an underexplored memory-corruption
      surface in ostensibly memory-safe Ruby applications — depthfirst states it found
      18 prioritized vulnerabilities (7 memory-safety) in Oj alone via automated scanning
      and expects more from this class of embedded-native-extension gem.
    borderline: true
    borderline_reason: "depthfirst's own post is dated 2026-07-24T12:00Z, ~40h before this run's spawn time — outside the strict 26h window but inside the 72h developing window; The Hacker News and several other outlets continued syndicating/covering it through 2026-07-25, and it was not surfaced by any earlier run in prior_coverage.json (verified via grep — no gitlab/depthfirst/oj-spill hits), so it appears to be genuinely new signal the pipeline has not yet processed rather than recycled news."

