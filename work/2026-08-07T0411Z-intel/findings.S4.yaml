    extended_notes: |
      Lower technical novelty than the other two items in this return — included primarily on the genuinely
      global-significance/scale gate criterion (165+ orgs, 100M+ individuals is one of the largest disclosed
      SaaS/cloud data-platform breaches) rather than any new TTP. The main agent may reasonably deprioritise
      this to "notable" or fold it into a shorter mention if space/relevance triage requires; flagging as
      borderline for that reason.
