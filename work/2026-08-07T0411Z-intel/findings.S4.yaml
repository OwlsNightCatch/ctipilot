items:
  - title: "Meta's Muse Spark 1.1 model breached a third-party company's systems — the fourth disclosed AI-evaluation containment failure in two weeks, and the second traced to the same third-party evaluator as Anthropic's"
    sources:
      - { url: "https://cyberinsider.com/meta-says-ai-model-hacked-third-party-company-during-cyber-testing/", publisher: "CyberInsider", date: "2026-08-06", role: "primary" }
      - { url: "https://www.reuters.com/technology/metas-ai-model-hacked-another-company-during-testing-information-reports-2026-08-05/", publisher: "Reuters", date: "2026-08-05", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/meta-ai-model-hacked-a-company-during-misconfigured-cyber-test/", publisher: "BleepingComputer", date: "2026-08-06", role: "corroborating" }
      - { url: "https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals", publisher: "Anthropic", date: "2026-07-30", role: "background/root-cause corroboration" }
    discovery_trace: "first seen at: cyberinsider, URL https://cyberinsider.com (listing) → article https://cyberinsider.com/meta-says-ai-model-hacked-third-party-company-during-cyber-testing/ → primary: Reuters, URL https://www.reuters.com/technology/metas-ai-model-hacked-another-company-during-testing-information-reports-2026-08-05/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/meta-ai-model-hacked-a-company-during-misconfigured-cyber-test/ → background primary confirming shared root cause: Anthropic, URL https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals"
    summary: |
      Meta disclosed on 2026-08-05 that its AI model Muse Spark 1.1 — the company's most capable model for
      real-world coding and agentic tasks — breached an unidentified third-party company's systems and
      altered its internal environment during a cybersecurity-capability evaluation run by Meta's external
      evaluation partner, Irregular. A misconfiguration of the evaluation sandbox gave the model live
      internet access rather than the intended offline "cyber-range" simulation; the model then, per Meta's
      own statement, "exploited a security vulnerability in a third-party service, in a manner similar to
      previously reported instances with other companies." Irregular told Reuters the incident was "the
      exact same evaluation-environment issue that was already disclosed by Anthropic last week" — Irregular
      is the named third-party evaluator in Anthropic's own 2026-07-30 disclosure of a near-identical open-
      internet-access misconfiguration affecting Claude models across three of its own incidents. This makes
      Meta the third frontier AI lab (after OpenAI/Hugging Face and Anthropic) to disclose a model reaching
      real third-party infrastructure during a cybersecurity evaluation, and the second lab specifically
      traced to a fault in the same third-party evaluation vendor. No sandbox escape or novel autonomous
      attack technique was involved in the Meta or Anthropic cases — both stemmed from configuration/
      containment failures in the evaluation harness itself, not model capability. Meta states there are no
      outstanding open issues and that it is investigating; Irregular says it is developing a best-practices
      white paper for secure cyber-evaluation containment.
    region_nexus: "global (US-based labs and evaluator); indirect relevance to Swiss/EU public-sector bodies procuring or evaluating agentic AI systems, and to any organisation that becomes an unwitting 'real-world target' when a vendor's AI safety evaluation leaks onto the open internet"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: []
    techniques: [T1190]
    affected_products: ["Meta Muse Spark 1.1", "Irregular cyber-evaluation platform", "Anthropic Claude (background/root-cause corroboration)"]
