          basis: "Irregular states the Meta incident was 'the exact same evaluation-environment issue that was already disclosed by Anthropic last week', and Irregular is separately named as Anthropic's evaluation partner in Anthropic's own 2026-07-30 post (Reuters, 2026-08-05; Anthropic, 2026-07-30)" }
      - { subject: "incident:meta-muse-spark-ai-eval-breach-2026-08", object: "incident:hugging-face-autonomous-ai-agent-breach-2026-07",
          basis: "Reuters frames the Meta disclosure as part of the same pattern as 'similar incidents at rivals Anthropic and OpenAI' during cybersecurity testing (Reuters, 2026-08-05)" }
      - { subject: "incident:meta-muse-spark-ai-eval-breach-2026-08", object: "incident:aisi-cyber-range-unsanctioned-agent-actions-2026-07",
          basis: "SecurityAffairs headlines the Meta disclosure as marking the third AI-lab evaluation-containment incident in weeks, continuing the same containment-failure pattern the AISI cyber-range report documented" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The model 'exploited a security vulnerability in a third-party service, in a manner similar to previously reported instances with other companies,' Meta said in a statement."
        attribution: "Reuters, quoting Meta"
        source_url: "https://www.reuters.com/technology/metas-ai-model-hacked-another-company-during-testing-information-reports-2026-08-05/"
      - quote: "the exact same evaluation-environment issue that was already disclosed by Anthropic last week"
        attribution: "Irregular spokesperson, via Reuters"
        source_url: "https://www.reuters.com/technology/metas-ai-model-hacked-another-company-during-testing-information-reports-2026-08-05/"
      - quote: "Due to a misunderstanding between us and our evaluation partner, this was not the case, and internet access was available."
        attribution: "Anthropic"
        source_url: "https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals"
    extended_notes: |
      This is a vendor-risk story, not a new attacker-tradecraft story: the common point of failure across (at
      least) two of the three disclosed labs is one third-party cyber-evaluation provider (Irregular)
      misconfiguring sandbox network isolation. Defenders assessing or procuring "agentic" AI systems — including
      public-sector bodies piloting AI coding/security assistants — should treat any vendor's claim of an
      "isolated" or "offline" evaluation environment as unverified without an explicit egress-control attestation.
      No IOC or victim name was disclosed for the Meta case. Recommend the main agent treat this as a standalone
      new incident entry (not update_of an existing one, since the affected company/model differs from the prior
      three), while carrying the relations above so a reader following any of the four AI-containment entries can
      reach the others.

  - title: "UNC6671 (BlackFile) rebrands into a multi-brand vishing/AiTM extortion ecosystem and narrows its target profile to hedge funds, private equity and law firms"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments", publisher: "Google Threat Intelligence Group / Mandiant", date: "2026-08-06", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hedge-fund-cyberattacks-tied-to-blackfile-linked-unc6671-extortion-group/", publisher: "BleepingComputer", date: "2026-08-06", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → article https://www.bleepingcomputer.com/news/security/hedge-fund-cyberattacks-tied-to-blackfile-linked-unc6671-extortion-group/ → primary: Google Threat Intelligence Group / Mandiant, URL https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments"
    summary: |
      Google Threat Intelligence Group / Mandiant published a 2026-08-06 update on UNC6671 (tracked here as the
      actor behind the "BlackFile" extortion brand, already in the registry) showing that despite BlackFile's
      claimed retirement in May 2026, the same core intrusion group continued operating under at least four
      further public brands — Redact, Pink, Helix and Falcon — sharing registrar, name-server and phishing-panel
      infrastructure. The consistent tradecraft across all brands: employees are called on their personal mobile
      numbers by a caller spoofing the corporate helpdesk's real phone number, told they must enroll a FIDO2
      passkey or update MFA, and redirected to an adversary-in-the-middle credential-harvesting panel that
      intercepts Microsoft 365 or Okta session tokens. Post-compromise, the actor resets passwords on non-SSO
      applications and systematically deletes password-reset and MFA-change notification emails to blind the
      victim, then runs automated, script-identifiable (python-requests/PowerShell user-agent) bulk exfiltration
      from SharePoint and other SaaS stores. Between January and May 2026 alone, GTIG tracked over $10.6M in
      Bitcoin ransom payments across 18 wallets, with initial demands of $1-3M typically negotiated down 50-75%
      to an average $750K payout. Targeting evolved from manufacturing/healthcare/real-estate (April-May) through
      technology/transportation/hospitality (June) to, by July 2026, a deliberate narrowing onto financial
      services, law firms, private-equity firms and financial-rating agencies — sectors chosen, GTIG assesses,
      for the leverage that M&A, capital-deployment and litigation data gives an extortionist. BleepingComputer
      reports (via Bloomberg) that recent targets in this financial-sector phase include several large US hedge
      funds; GTIG's own report does not name victims. GTIG explicitly distinguishes UNC6671's infrastructure and
      registration pattern from Scattered Spider (UNC3944) despite similar vishing/AiTM tradecraft.
    region_nexus: "global operator with a financial-services/legal/PE targeting phase; the vishing+AiTM+M365/Okta-SSO tradecraft is directly transferable to European financial institutions and their outside counsel running the same identity stack"
    primary_sector_nexus: "indirect"
    sector: "finance"
    cves: []
    techniques: [T1598.004, T1556.006, T1078.004, T1114]
    affected_products: ["Microsoft 365", "Okta", "Microsoft Entra ID", "SharePoint Online"]
    entity_keys:
      - "actor:unc6671"
      - "actor:helix-extortion"
    new_entities: []
    relation_suggestions:
      - { subject: "actor:unc6671", object: "actor:helix-extortion",
          basis: "GTIG/Mandiant: 'These overlaps support our assessment that a common group of threat actors are affiliated with the BlackFile, Redact, Pink, Helix, and Falcon extortion brands' (Google Threat Intelligence Group, 2026-08-06)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Across UNC6671 intrusions, the initial access and post-compromise tactics, techniques, and procedures (TTPs) have remained remarkably consistent. These operations uniformly leverage tailored IT helpdesk voice phishing (vishing), AiTM credential harvesting panels, and data theft from SaaS applications."
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments"
      - quote: "By July 2026, the target profile narrowed to focus on the financial and legal sectors, with observed infrastructure directed at private equity firms, law firms, and financial rating agencies."
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments"
      - quote: "UNC6671 callers have continued to call targeted employees on their personal mobile numbers, circumventing corporate security controls. In at least some recent cases, the threat actor has spoofed the legitimate helpdesk phone number adding an air of legitimacy."
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments"
    extended_notes: |
      Strong deep-dive candidate: GTIG's post supplies concrete detection content (Okta "MFA Factor Setup
      Following Abandoned Challenge", SharePoint bulk-download-via-PowerShell rules) and hardening priorities
      (phishing-resistant FIDO2/passkey MFA that binds to origin so AiTM lookalike domains fail; SSO
      consolidation; re-auth/session-binding; blocking auth from residential-proxy ASNs) that map cleanly onto
      Tier 2/3 detection-engineering work. No literal domains/IPs are carried into this summary per the no-IOC
      rule — the GTIG post itself lists ~60 phishing domains and IP infrastructure by ASN for anyone who needs
      the raw indicators. Recommend adding "Redact", "Pink" and "Falcon" (extortion brand, distinct from the
      unrelated CrowdStrike Falcon product) to actor:unc6671's aliases list.

  - title: "Snowflake mass credential-theft campaign: Canadian defendant pleads guilty to hacking 165+ organisations and extorting them over billions of stolen records"
    sources:
      - { url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers", publisher: "US Department of Justice", date: "2026-08-05", role: "primary" }
      - { url: "https://securityaffairs.com/196714/security/snowflake-hacker-pleads-guilty-after-breaching-165-companies-and-stealing-billions-of-records.html", publisher: "Security Affairs", date: "2026-08-06", role: "corroborating" }
      - { url: "https://databreaches.net/2026/08/05/canadian-man-pleads-guilty-to-hacking-u-s-cloud-storage-provider-and-extorting-its-customers-for-millions/", publisher: "DataBreaches.net", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net, URL https://databreaches.net/feed/ → article https://databreaches.net/2026/08/05/canadian-man-pleads-guilty-to-hacking-u-s-cloud-storage-provider-and-extorting-its-customers-for-millions/ → primary: US Department of Justice, URL https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers → corroborating: Security Affairs, URL https://securityaffairs.com/196714/security/snowflake-hacker-pleads-guilty-after-breaching-165-companies-and-stealing-billions-of-records.html"
    summary: |
      Connor Riley Moucka, 26, of Kitchener, Ontario, pleaded guilty on 2026-08-05 in US federal court to
      computer-fraud conspiracy, wire fraud, aggravated identity theft and related charges over a 2024 campaign
      that, per the Department of Justice's own charging summary, used stolen login credentials — specifically,
      credentials for cloud data-warehouse accounts that were not protected by multi-factor authentication — to
      compromise at least 165 customer organisations of a US cloud storage provider (publicly reported at the
      time as Snowflake), stealing billions of sensitive customer records and over 100 million individuals'
      data, then extorting victims with threats to publish the data; DOJ states the scheme generated over $2.5M
      in extortion proceeds and caused more than $9.5M in direct losses to affected companies. No new technical
      mechanism is disclosed beyond what was already public in 2024-2025 — the operative lesson remains that
      MFA-less access to a cloud data platform is sufficient for a mass-victim breach, and it still applies
      unchanged to any organisation whose analytics/data-warehouse tenant (Snowflake or otherwise) allows
      username/password authentication without MFA enforcement. The DOJ credits FBI Seattle, the Royal Canadian
      Mounted Police, the Australian Federal Police, Spain's Guardia Civil, Ukraine's Security Service and the
      Turkish National Police as investigative partners, underscoring the campaign's cross-border reach into at
      least one EU member state's law-enforcement chain. Sentencing is scheduled for 27 October 2026; the count
      carrying aggravated identity theft imposes a mandatory 2-year minimum, with a statutory maximum of 30
      years across all counts.
    region_nexus: "global (165+ organisations, 100M+ individuals); cross-border investigation included Spain's Guardia Civil, indicating an EU-jurisdiction dimension to the case even though DOJ's release does not name individual victim organisations"
