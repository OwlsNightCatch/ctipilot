      - { url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL", publisher: "Federal IT Steering Body (admin.ch, original victim statement)", date: "2026-08-04", role: "corroborating" }
    discovery_trace: >
      first seen at: WebSearch ("SharePoint Schweiz Behörde Cyberangriff August 2026") ->
      pivot: WebSearch ("NCSC BACS SharePoint CVE Schwachstelle August 2026") surfaced
      securityaffairs.com and bleepingcomputer.com coverage -> primary: BleepingComputer,
      URL https://www.bleepingcomputer.com/news/security/swiss-government-sharepoint-breach-compromised-200-accounts/
      (confirmed datePublished 2026-08-06T14:14:19-04:00 / 2026-08-06T18:14:19Z via page
      JSON-LD) -> corroboration: Security Affairs and The Record, both 2026-08-04, and the
      original admin.ch victim statement.
    summary: |
      This is an update on the already-tracked BIT/FOITT Swiss federal SharePoint breach
      (~200 accounts, entry 2026-08-05/bit-foitt-swiss-federal-sharepoint-breach-200-accounts).
      Neither the Swiss federal government's own statement nor Canton Graubünden's followed
      disclosure has named a CVE. BleepingComputer's 2026-08-06 follow-up is the first
      in-window source to narrow the candidate vulnerability set for the Swiss federal
      case specifically: "The attack potentially involved CVE-2026-56164, a SharePoint
      privilege escalation vulnerability, or CVE-2026-50522, a critical remote code
      execution flaw," both patched in Microsoft's July 2026 Patch Tuesday and both already
      on CISA's KEV catalog from the broader on-premises SharePoint exploitation wave this
      pipeline covered extensively in 2026-W30 (the wave that also produced machine-key
      theft as a persistence mechanism surviving the patch). The article is explicit that
      this is unconfirmed press inference from the known July SharePoint KEV set, not a
      victim or authority confirmation: "It remains unclear whether either vulnerability
      was used in the Swiss government attack." No new information on data exfiltration
      (still denied beyond the compromised credentials), no attacker attribution, and no
      mention of Canton Graubünden as linked to the same CVE pair.
