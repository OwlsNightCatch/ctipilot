      - { url: "https://github.com/keycloak/keycloak/security/advisories/GHSA-3692-rrj9-24qw", publisher: "Keycloak / Red Hat (GitHub Security Advisories)", date: "2026-08-06", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-16443", publisher: "NVD/NIST", date: "2026-08-06", role: "corroborating" }
    discovery_trace: >
      first seen at: cert-fr (S2 essential-domain-adjacent authority, exercised via
      the cert-fr bridge subcommand), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0976/
      (avis-recent listing, then drilled the advisory detail page) -> primary: Keycloak/Red
      Hat's own GitHub Security Advisories for each of the seven CVEs, URLs
      https://github.com/keycloak/keycloak/security/advisories/GHSA-f8m4-v488-rmrm (SAML
      signature bypass, CVE-2026-16443), GHSA-95rm-h7g9-rhcf (DCR type-swap privesc,
      CVE-2026-15572), GHSA-95cx-vmr5-3cmr (DCR role forgery, CVE-2026-16102),
      GHSA-2888-g6qc-w4mj (PathMatcher authz bypass, CVE-2026-15573),
      GHSA-fgq2-hxm5-8xg2 (SAML IdP-initiated broker-login bypass, CVE-2026-16442),
      GHSA-hmr6-pxx9-552p (LDAP DN-boundary bypass, CVE-2026-16071),
      GHSA-3692-rrj9-24qw (unbounded metric-cardinality DoS, CVE-2026-16100) ->
      corroboration: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-16443 (description
      text matches the GitHub advisory verbatim).
    summary: |
      CERT-FR's advisory CERTFR-2026-AVI-0976 (06 August 2026) relays seven CVEs Keycloak's
      maintainers disclosed the same day in org.keycloak:keycloak-services, the core
      identity-brokering engine behind Keycloak / Red Hat Build of Keycloak (RHBK) — an
      open-source IAM/SSO platform widely deployed for federated login and e-government
      portals across the Swiss/EU public sector. All affect versions before 26.4.14 / 26.6.5
      / 26.7.1 (fixed in those releases). The most severe class is identity-protocol abuse
      at the broker layer: CVE-2026-16443 (CVSS 3.1 7.4, AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N)
      is a SAML-broker metadata-import flaw — when importing an identity-provider's SAML
      metadata that lacks explicit key-usage attributes, Keycloak silently disables SAML
      response signature validation even though a signing certificate was supplied. Per
      Keycloak's own advisory: "This issue allows an unauthenticated attacker to forge a
      SAML response and gain unauthorized access to a user account by knowing their external
      identifier." A sibling, CVE-2026-16442 (CVSS 7.4 High), covers a SAML IdP-initiated
      broker-login flow that bypasses the "link-only" restriction meant to stop unlinked
      accounts from authenticating that way (GitHub's rendered description text for this
      specific advisory is a verified duplicate/rendering artifact from a different advisory
      in the same batch; only the title, CVSS vector and version data could be confirmed).
      Two further High-severity flaws are privilege-escalation paths through Dynamic Client
      Registration (DCR): CVE-2026-16102 (CVSS 8.1) lets an attacker with a standard account
      and a limited Initial Access Token abuse a default DCR policy's mis-validated claim path
      for User Property mappers to forge administrative roles into their own access token —
      Keycloak's advisory states this "allows the attacker to take over other clients, steal
      confidential secrets, and potentially gain full administrative control over the realm."
      CVE-2026-15572 (CVSS 8.8) lets a client-registration-privileged attacker register an
      allowed protocol-mapper type with benign config, then swap it for a restricted,
      admin-role-hardcoding mapper type without the swap being re-validated, again reaching
      full realm admin. CVE-2026-15573 (CVSS 8.1) is a PathMatcher URL-normalization flaw in
      Authorization Services — trailing slashes or matrix parameters let an authenticated
      user reach administrative/restricted paths under a weaker policy than intended.
      CVE-2026-16071 (CVSS 5.4) lets a delegated LDAP administrator's entry-DN search escape
      the configured search-base boundary and pull in directory entries (and import them
      into local storage) from outside the intended scope. CVE-2026-16100 (CVSS 6.5) is an
      authenticated resource-exhaustion path via unbounded Prometheus metric-label
      cardinality from attacker-controlled error text in user-event metrics. No public exploit
      code or in-the-wild exploitation is reported for any of the seven as of this advisory.
    region_nexus: "Switzerland and EU — CERT-FR (France) advisory; Keycloak is a widely-deployed open-source IAM/SSO platform underpinning federated-login and e-government portals across the Swiss/European public sector and beyond."
