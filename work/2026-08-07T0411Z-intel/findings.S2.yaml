  - title: "CERT-FR relays seven Keycloak identity-broker CVEs, including a SAML signature-validation bypass that lets an unauthenticated attacker forge a login as any known user"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0976/", publisher: "CERT-FR (ANSSI)", date: "2026-08-06", role: "primary" }
