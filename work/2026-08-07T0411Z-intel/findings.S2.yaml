        attribution: "Keycloak / Red Hat GHSA-95rm-h7g9-rhcf (CVE-2026-15572)"
        source_url: "https://github.com/keycloak/keycloak/security/advisories/GHSA-95rm-h7g9-rhcf"
    extended_notes: |
      Detection/hunt framing for the SOC: for CVE-2026-16443/-16442, hunt identity-provider
      audit logs (Keycloak admin events / SAML broker login events) for successful SAML
      broker logins whose asserted NameID/external identifier does not correspond to a
      session the IdP itself can attest — i.e. correlate Keycloak's broker-login success
      events against the upstream IdP's own auth logs for the same timeframe; a forged
      SAML response has no matching upstream IdP session. For the DCR privilege-escalation
      pair (CVE-2026-16102/CVE-2026-15572), review Dynamic Client Registration audit trails
      for protocol-mapper or user-property-mapper configuration changes on client
      registrations that were not accompanied by an admin-console session — DCR abuse
      happens over the registration API, not the admin UI. Hardening: patch to 26.4.14 /
      26.6.5 / 26.7.1; for SAML brokers specifically, audit configured identity providers
      for metadata imported without explicit key-usage attributes and re-validate signing
      certificates are enforced post-patch; restrict Dynamic Client Registration to
      Initial-Access-Token holders who need it, and review existing DCR-created clients for
      unexpected protocol mappers carrying hardcoded realm-admin or client-admin roles.
      Triage note: routine Keycloak upgrades or IdP metadata refreshes will not by themselves
      produce these telemetry signatures — the discriminator is a broker-login success event
      with no corresponding upstream IdP authentication, or a DCR-managed client whose
      protocol-mapper configuration changed without a matching admin action.
