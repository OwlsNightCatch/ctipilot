items:
  - title: "Adobe Campaign Classic APSB26-120 — a second wave of unauthenticated CVSS-10.0 RCE flaws (SSRF, template-engine injection, SQL injection) supersedes last week's build-9398 fix"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0278", publisher: "NCSC-NL", date: "2026-08-06", role: "primary" }
      - { url: "https://helpx.adobe.com/security/products/campaign/apsb26-120.html", publisher: "Adobe PSIRT (APSB26-120)", date: "2026-08-03", role: "primary" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (item NCSC-2026-0278, published 2026-08-06T08:41:41Z) → primary: Adobe PSIRT, URL https://helpx.adobe.com/security/products/campaign/apsb26-120.html → verified individual CVE mechanics on NVD (CVE-2026-48331, CVE-2026-48323, CVE-2026-48330) for description/scope/CPE range, not cited as a Source"
    summary: |
      Adobe's APSB26-120 (published 2026-08-03, surfaced to this window via a fresh NCSC-NL advisory on 2026-08-06 that explicitly notes it is NOT an update of the prior NCSC-2026-0273/APSB26-114 bulletin but a separate, newly found set) fixes seven vulnerabilities in on-premise Adobe Campaign Classic (ACC) v7, patched in build 7.4.3.9399. Three are unauthenticated, no-user-interaction, CVSS 3.1 10.0 flaws with changed scope, each independently sufficient for compromise: CVE-2026-48331 (CWE-918 SSRF, NVD: "could result in privilege escalation"), CVE-2026-48323 (CWE-1336 improper neutralization of template-engine syntax, NVD: "could result in arbitrary code execution in the context of the current user"), and CVE-2026-48330 (CWE-89 SQL injection, NVD: "could result in arbitrary code execution"). The remaining four require some precondition: CVE-2026-48326 (CWE-89 SQLi, CVSS 9.9, authenticated), CVE-2026-48333 (CWE-863 incorrect authorization → privilege escalation, CVSS 9.8, unauthenticated), CVE-2026-48317 (CWE-95 eval injection → RCE, CVSS 9.6, authenticated), and CVE-2026-48399 (CWE-657 secure-design violation → security-feature bypass, CVSS 7.5). NVD lists the vulnerable range as ACC versions up to and including 7.4.2, plus 7.4.3 builds 9394/9396/9397/9398 — i.e. every build up to and including the one Adobe shipped one week earlier (build 9398, APSB26-114, 2026-07-29) to fix the previous wave's CVE-2026-48449/-48448. Adobe assigns APSB26-120 its highest severity/priority rating and states it is "not aware of any exploits in the wild for any of the issues addressed in these updates"; the bulletin applies only to fully on-premise deployments and the on-premise components of hybrid deployments — Adobe-hosted instances were already remediated. This is the third distinct wave of critical unauthenticated-RCE-class disclosures against this Adobe Campaign/ColdFusion product line since 2026-07-02 (APSB26-68/69, then APSB26-114, now APSB26-120), each independently rated Adobe's top priority.
    region_nexus: "global; on-premise/hybrid Adobe Campaign Classic deployments include EU/CH public-sector and enterprise marketing/CRM estates"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: [CVE-2026-48331, CVE-2026-48323, CVE-2026-48330, CVE-2026-48326, CVE-2026-48333, CVE-2026-48317, CVE-2026-48399]
    techniques: [T1190]
    affected_products: ["Adobe Campaign Classic v7"]
    entity_keys: ["trend:adobe-coldfusion-campaign-apsb26-68-69"]
