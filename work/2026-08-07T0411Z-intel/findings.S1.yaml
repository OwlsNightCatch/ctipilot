        attribution: "NCSC-NL (NCSC-2026-0278)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0278"
      - quote: "Adobe is not aware of any exploits in the wild for any of the issues addressed in these updates."
        attribution: "Adobe PSIRT (APSB26-120)"
        source_url: "https://helpx.adobe.com/security/products/campaign/apsb26-120.html"
      - quote: "Adobe Campaign Classic (ACC) is affected by a Server-Side Request Forgery (SSRF) vulnerability that could result in privilege escalation. Exploitation of this issue does not require user interaction. Scope is changed."
        attribution: "NVD (CVE-2026-48331 description, sourced from Adobe)"
        source_url: "https://helpx.adobe.com/security/products/campaign/apsb26-120.html"
    extended_notes: |
      Relates to but is NOT an update_of 2026-08-02/adobe-campaign-classic-apsb26-114-cvss10-unauth-rce (different CVE set, same product, same "Priority 1 / not aware of exploitation" pattern). Any organisation that treated build 9398 (last week's fix) as the end state is still exposed to three independent unauthenticated RCE-class vectors until it applies build 9399. Detection/hunt: with no public PoC yet, defenders should treat internet-reachable on-prem ACC instances as needing a version check against build 9399 rather than waiting for exploitation telemetry; log review should focus on anomalous outbound HTTP from the ACC application-server process (SSRF indicator class) and unexpected child-process spawns from the ACC web/template-rendering service (template-injection RCE indicator class) — no vendor-neutral IOC is available since Adobe reports no observed exploitation.
      Inclusion-bar limb: "its own mechanics force the timeline" — three independent, unauthenticated, no-interaction CVSS-10.0 paths to code execution/privilege escalation on an internet-facing on-prem enterprise platform, superseding a patch applied only one week earlier, Adobe's own top-priority rating.
