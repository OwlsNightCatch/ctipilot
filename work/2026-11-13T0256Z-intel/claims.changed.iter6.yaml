    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "summary"
    kind: frontmatter
    text: "Cloud Software Group's bulletin CTX697305 of 2026-11-12 fixes 28 flaws in customer-managed NetScaler ADC and Gateway, 9 of them scored CVSS 4.0 9.0 or above; CVE-2026-120868 (9.3) needs no feature or authentication and affects every deployment in default configuration, and CVE-2026-107412 (9.5) reaches Gateway and AAA virtual servers. The fixed builds are 14.1-73.57, 13.1-64.39, 14.1-73.58 FIPS and 13.1-37.293, and bulletin CTX697320 fixes an unauthenticated NetScaler Console authentication bypass in 14.1-74.34; the bulletins describe the impact as unpredictable behaviour or denial of service, offer no workaround and state no exploitation status, while CERT-EU writes that Citrix reports none and no source reports an attack."
