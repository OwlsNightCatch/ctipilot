    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "actions[0]"
    kind: frontmatter
    text: "In every GitHub organisation you or your suppliers administer, search for pull requests titled \"docs: dependency audit notes\" and for commits titled \"ci: refresh build cache\", \"ci: restore\", \"ci: cleanup\", \"chore: add ci helper\" or \"chore: add dependency audit workflow\"; for each account that pushed one, revoke its tokens, rotate every secret its workflows could read and remove the AWS trust-policy changes, access keys and Azure federated credentials the stealer created, because the persistence is designed to outlast rotation."
