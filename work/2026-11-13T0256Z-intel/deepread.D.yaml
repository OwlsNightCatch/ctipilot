  caveats:
  - The ConnectWise Trust Center advisory (https://www.connectwise.com/company/trust/advisories) was not readable (403 on every transport per S1); ConnectWise statements about 400 environments, the passphrase and 'later traced it back to RMM+' reach us only through The Record's quotation; the CNA record is read directly. I did not re-try the Trust Center (one WebFetch retry already spent by S1).
  - Blackpoint's own blog does not contain the sentence 'the exploit targets CVE-2026-84869 and that the existing patch successfully blocks it'; that sentence is quoted by The Record from the researchers (Decker and Beal). The blog's own wording is 'attempts a Guest-to-Host file execution technique associated with CVE-2026-84869', 'did not achieve reverse execution or demonstrate a patch bypass'. The blog is dated 2026-11-12 on the page metadata and 'DATE PUBLISHED November 11, 2026' at its foot.
  - The Record headline/lede ('nearly 50 organizations') uses the Huntress count of 48 organisations; the entry's '288 endpoints at 48 customers' is unchanged. BleepingComputer's earlier figure was 286 endpoints at 47 organisations and six compromised MSPs (superseded by Huntress's own update of 288/48).
  - Huntress's page was read in full (update of 2026-11-11 23:34 ET plus original post); no later update is on it. The earlier entry's statement that ConnectWise 'had not identified an initial access vector' is attributed to the 2026-11-11 advisory; The Record's 2026-11-12 text says ConnectWise believes the activity is related to RMM+ abuse, which is a stated belief, not a confirmed vector.
  - Two descriptions of the extension's defect (blank key in two versions vs static default secret in all versions) and ConnectWise's 'passphrase configured by the partner' are all printed above exactly as sources state them; nothing here reconciles them. A default that is blank in 1.0.31/1.0.32 and a 'static API secret by default' are different claims about the same configuration item.
  - No IOC is carried; Huntress and Blackpoint list indicators (not reproduced).
  suggested_record_type: 'update (new reader-facing facts: a CNA CVE with an all-versions/no-fix scope, ConnectWise''s later narrowing to RMM+, an independent Blackpoint analysis, and a source conflict on the access mechanism)'
  priority_change: 'no (high stays: confirmed deployments at 48 organisations via MSP tooling; initial access unresolved)'
  actions_change: 'yes, wording only: replace ''disable the five named extensions ... RMM+ versions 1.0.31 and 1.0.32 first'' by ConnectWise''s CNA instruction (disable RMM+ immediately, verify it stays disabled, do not re-enable or reinstall; other four extensions per the 2026-11-11 advisory) and add ''verify ScreenConnect Host and Guest clients are at 26.6.5 or later'' (ConnectWise bulletin; Blackpoint names 26.6.5.9742).'
- entry_id: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
  old_statements_superseded:
  - where_in_entry: frontmatter summary, last sentence
    old_text: Red Hat has fixed RHEL 9 and 10, whereas Debian bookworm, trixie and forky are still listed vulnerable.
    now_true: Debian bookworm is fixed in apache2 2.4.71-1~deb12u1 (DLA-4902-1) and trixie in 2.4.71-1~deb13u1 (DSA-6620-1), sid in 2.4.71-1; forky (2.4.69-1) is still listed vulnerable. Ubuntu USN-9090-1 (2026-11-12) fixes 20.04 ESM, 22.04, 24.04, 26.04 and 26.10; Alpine 3.21 to 3.24 and edge have 2.4.71-r0; SUSE is 'Pending' with no announcement; Red Hat also lists EUS streams, and JBoss Core Services and Hardened Images as Affected with no fix.
  - where_in_entry: frontmatter headline
    old_text: 'Apache httpd mod_http2 RCE: update to 2.4.71 or drop h2/h2c from Protocols; Debian stable has no fix yet'
    now_true: Debian stable (bookworm via LTS, trixie) has a fix; the 'no fix yet' clause no longer applies to Debian (still true for forky, SUSE, Red Hat JBCS and Hardened Images).
  - where_in_entry: body paragraph 4, last clause
    old_text: the Debian tracker lists bookworm, trixie and forky as vulnerable with only the unstable release fixed
    now_true: see the first item; the tracker now has fixed rows for bookworm (security) and trixie (security).
  - where_in_entry: frontmatter actions[0], 'where no fixed package exists yet, as on Debian bookworm and trixie'
    old_text: where no fixed package exists yet, as on Debian bookworm and trixie, remove h2 and h2c from the Protocols directive until one does
    now_true: Debian bookworm/trixie packages exist; the h2/h2c removal remains the vendor/researcher workaround where no fixed package exists (SUSE pending, Debian forky, Red Hat JBoss Core Services and Hardened Images).
  - where_in_entry: frontmatter sourcing_note and evidence[3] (Wiz quote), body paragraph 2
    old_text: Wiz said none was available at publication; Red Hat says public research demonstrated a reliable exploit but links none, and no such research was located / As of the time of this blog’s publication, no exploit is available and there are no reports of exploitation in the wild.
    now_true: 'A public researcher repository (page metadata 2026-11-12) now reproduces heap corruption and child-process crashes on 2.4.70 in an instrumented lab; Wordfence (2026-11-12) says the posted test ''does not demonstrate remote command execution'' and that Red Hat''s advisory links no code-execution demonstration. The Wiz quote is correct as of its own 2026-11-11 publication but no longer describes the public record: a crash/corruption test is public; a code-execution exploit is still not shown by any source read, and no source reports exploitation.'
  - where_in_entry: body, Detection paragraph
    old_text: as an inference from the flaw class, not a source statement, watch for httpd child-process crashes in the error log and for shells or interpreters started by an httpd worker.
    now_true: 'The researcher''s repository sources the crash signal: the corruption shows as child-process crashes (SEGV in the allocator and stream code) and, in their instrumented build, an assertion abort in the HTTP/2 worker-done path; the repository also names the request shape (body-less HTTP/2 request with Content-Type, no Content-Length, 79 regular headers). Production (non-sanitizer) crash output is not shown by any source. Shells or interpreters from an httpd worker remain an inference.'
