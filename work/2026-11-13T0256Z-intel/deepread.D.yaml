- entry_id: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
  old_statements_superseded:
  - where_in_entry: frontmatter summary, last sentence; body paragraph 2, last sentence
    old_text: The sk makes no statement on exploitation of Check Point products, and CISA lists both flaws as exploited. / CISA lists both PHP flaws as exploited since 2026-10-26, and the sk makes no statement on exploitation of Check Point gateways
    now_true: Check Point Research (2026-11-12) reports exploitation of unpatched Check Point gateways from 2026-10-30 (PHP2Shell, then CVE-2026-123039 for root), and sk1000362 states 'a couple of dozen customers'. sk1000302 itself (modified 2026-11-12) still carries no exploitation sentence (read in full; no occurrence of 'exploit' and no mention of CVE-2026-123039). The CISA KEV listing is still PHP-generic.
  - where_in_entry: frontmatter cves[].fixed (both CVEs), summary and body paragraph 3
    old_text: release-specific hotfix packages, also planned for the Jumbo Hotfix Accumulators of 2026-11-11; Spark R82.00.11 (build 998002823) and R81.10.17 (build 996004992) / For the gateway packages the fix is also planned for the Jumbo Hotfix Accumulators of 2026-11-11, and Spark has R82.00.11 (build 998002823) and R81.10.17 (build 996004992)
    now_true: 'sk1000302 (2026-11-12) says ''This problem was fixed'' and names Jumbo Hotfix Accumulator R82.20 take 14, R82.10 take 52, R82 take 132, R81.20 take 174 as containing the fix; no ''planned'' wording and no 2026-11-11 date remain on the page. Spark: R82.00.11 ''starting from B998002843'' and R81.10.17 ''starting from B996005005'' in the Solution list, while the hotfix download tables still print builds 998002823 and 996004992 (the page does not explain the difference).'
  - where_in_entry: 'frontmatter sourcing_note; verification: single-source'
    old_text: the page carries no exploitation statement and no post-compromise check, and the CISA listing of both flaws concerns PHP generally, not Check Point gateways
    now_true: sk1000302 still has neither; but sk1000362 carries a vendor compromise-check procedure for CVE-2026-123039 and a vendor exploitation statement, and Check Point Research documents the intrusion chain. All three are Check Point documents, so they are one assessor; no independent third-party confirmation of exploitation of Check Point gateways was read (Dream Security's PAN-OS post is context, not corroboration).
  - where_in_entry: body, Detection paragraph
    old_text: Check Point publishes no indicator and no post-compromise check. The web daemon's access logs for the portal paths, shells or downloads started by the gateway's web process, and outbound connections that the gateway itself initiates are the telemetry to review ... this is an inference, since the sk does not describe the attack.
    now_true: 'Check Point now describes the attack (CPR) and gives a log-based check for the escalation (sk1000362: /var/log/dynamicCli.log). Observable behaviours are sourced below (portal session-file artefacts, hundreds of Apache/PHP worker segfaults, new template files, root-level commands lacking the Clish wrapper, a root-run process relaunched from the boot persistence directory, a listener on all interfaces, SSH from the gateway to ESXi as vpxuser). The inference wording can be replaced by these sourced items.'
  - where_in_entry: body, Defender takeaway
    old_text: treat a gateway that was exposed and unpatched as needing a compromise check, because Check Point's page does not say whether patching removes a foothold.
    now_true: 'Check Point Research says TSGA has ''backup and snapshot persistence'' and relaunches itself from the boot persistence directory, and sk1000362 says its fix only ''blocks and logs unauthenticated calls'' (it removes nothing already installed): a gateway that was exposed before the Jumbo is a compromise-check case independent of the patch.'
  - where_in_entry: body, Exposure line
    old_text: a gateway with none of them is outside the scope Check Point states
    now_true: True for the two PHP flaws only. CVE-2026-123039 (local, post-foothold) affects Force firewalls, management and log servers, Multi-Domain servers and Maestro on R81, R81.10 (end of support), R81.20, R82, R82.10, R82.20 regardless of which portal features run; Spark and Smart-1 Cloud are not affected. A host with an attacker already on it needs the Jumbo or the dynamic_server mitigation.
  - where_in_entry: title, headline, affected_products, entities, cves[]
    old_text: 'title and cves[] name only CVE-2026-109618 / CVE-2026-109619; affected_products: Check Point Force Firewalls, Check Point Spark Firewalls, Check Point Cloud Firewall'
    now_true: CVE-2026-123039 is the root-escalation half of the observed chain; affected products add Check Point management and log servers, Multi-Domain Security Management, and Maestro Orchestrator (sk1000362).
  - where_in_entry: frontmatter priority; actions[0]
    old_text: 'priority: notable / ''Install the Check Point hotfix for your release on every gateway ... apply Check Point''s cp-httpd.conf mitigation, which you remove before installing it.'''
    now_true: Exploitation of an internet-facing edge device with a destructive follow-on stage is confirmed by the vendor; the action text should say which package closes which flaw (only Jumbo takes are listed for CVE-2026-123039).
