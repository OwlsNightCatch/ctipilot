- entry_id: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
  old_statements_superseded:
  - where_in_entry: frontmatter title and summary; body paragraph 2
    old_text: Huntress links the activity to the RMM+ extension, whose versions 1.0.31 and 1.0.32 accepted a blank access key / whose versions 1.0.31 and 1.0.32 accepted a blank access key and bypass ScreenConnect's accounts and MFA, while ConnectWise had not identified an initial access vector and disabled five third-party extensions in about 400 partner environments
    now_true: 'Still Huntress''s description (kept attributed). Added: ConnectWise''s own CNA record CVE-2026-127063 (CVSS 4.0 9.3) describes a static API secret by default in all RMM+ versions, not a blank key in two versions; ConnectWise (via The Record) now says it believes the activity relates to abuse of an independent third-party extension, ''later traced it back to RMM+'', and that the extension''s API ''is protected by a passphrase configured by the partner during setup''. The sources are NOT reconciled here; see conflicts.'
  - where_in_entry: body paragraph 2, ConnectWise sentence
    old_text: ConnectWise suspects the actor used independent third-party extensions that partners may have added, and disabled five (Labtech Plus, RMM Plus, RMM+, RMM Plus Password Link and RMM+ Password Link) in about 400 partner environments; on-premises customers must disable them by hand
    now_true: 'Per The Record, the ~400 figure is environments ''with at least one independently developed third-party extension from the RMM+ family installed'' and ConnectWise ''disabled RMM+ in the 400 customer environments''; the five-extension list is the 2026-11-11 advisory''s initial list, which ConnectWise later narrowed to RMM+. The CNA record''s on-premises instruction names RMM+ only: disable immediately, verify it stays disabled, do not re-enable or reinstall.'
  - where_in_entry: body paragraph 2, Huntress sentence
    old_text: Huntress says ConnectWise had not yet identified an initial access vector or the full scope
    now_true: Same Huntress statement stands for 2026-11-11; on 2026-11-12 a Huntress spokesperson told The Record it 'hasn't seen evidence of a new vulnerability' and that 'it's still unclear how the attacker got panel access', pointing to compromised credentials or hijacked operator sessions, while Huntress's own update names the blank-key flaw. Blackpoint calls the extensions' role in first panel access 'a separate, unresolved question'.
  - where_in_entry: 'frontmatter cves: []'
    old_text: 'cves: []'
    now_true: CVE-2026-127063 (DataComm RMM+ extension, CVSS 4.0 9.3, all extension versions, no fixed version). Separate record CVE-2026-84869 (ScreenConnect Host/Guest client file-transfer flaw, KEV since 2026-09-11, fixed 26.6.5) is what Blackpoint says RelayTrap's reverse-transfer step targets; it is not stated by any source to be the initial-access route.
  - where_in_entry: body, Exposure line
    old_text: an RMM+ extension at version 1.0.31 or 1.0.32 with RMMPlus.AccessKey left blank is the condition Huntress describes
    now_true: ConnectWise's CNA record scopes the exposure to every RMM+ extension version that keeps the default API secret ('All extension versions' in EUVD); Huntress's blank-key condition (1.0.31, 1.0.32) is a narrower statement from a different source. Both are reportable as stated.
  - where_in_entry: 'frontmatter sourcing_note; verification: multi-source'
    old_text: ConnectWise's advisory was not readable, so its statements come from the sentences BleepingComputer quotes, written before that update
    now_true: ConnectWise's CNA disclosure (GitHub repository ConnectWise-Advisories/Disclosures) is directly readable and quoted; the Trust Center advisory page itself is still unreadable on every transport (403, per S1). The Record adds later ConnectWise statements (400 environments with RMM+-family extensions; passphrase wording; traced to RMM+). Blackpoint adds an independent technical analysis.
  - where_in_entry: body, Defender takeaway and actions[0]
    old_text: remove or disable RMM+ and the other four extensions ... RMM+ versions 1.0.31 and 1.0.32 first because they accept a blank access key
    now_true: ConnectWise's instruction for on-premises is to disable RMM+ immediately, verify it remains disabled, and not re-enable or reinstall it pending guidance; Blackpoint additionally advises verifying that ScreenConnect Host and Guest clients are at 26.6.5.9742 or later (CVE-2026-84869) and to use an isolated response channel, not an interactive session, for suspected hosts.
