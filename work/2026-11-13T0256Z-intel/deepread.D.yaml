    - publisher: Huntress blog update (2026-11-11 23:34 ET)
      stated: 'But versions 1.0.31 and 1.0.32 contained a serious authentication flaw: if an administrator had never configured the extension''s access key, RMM+ would accept a blank one.'
      saved_body: D-2-huntress.txt
    - publisher: ConnectWise statement quoted by The Record (2026-11-12)
      stated: Access to that API is protected by a passphrase configured by the partner during setup.
      saved_body: D-2-therecord.txt
    - publisher: Huntress spokesperson quoted by The Record (2026-11-12)
      stated: Huntress hasn’t seen evidence of a new vulnerability, but it’s still unclear how the attacker got panel access. Current telemetry points to compromised credentials or hijacked operator sessions to gain initial access
      saved_body: D-2-therecord.txt
    - publisher: Blackpoint Cyber (2026-11-12)
      stated: Their possible role in obtaining the first management-panel access remains a separate, unresolved question.
      saved_body: D-2-blackpoint.txt
  - topic: Is CVE-2026-84869 involved, and how
    statements:
    - publisher: The Record, paraphrasing Huntress and other researchers
      stated: Huntress and several other researchers said the attack campaign may be tied to a ConnectWise vulnerability discovered in September — CVE-2026-84869.
      saved_body: D-2-therecord.txt
    - publisher: Blackpoint researchers quoted by The Record
      stated: Our testing confirmed that the exploit targets CVE-2026-84869 and that the existing patch successfully blocks it
      saved_body: D-2-therecord.txt
    - publisher: Blackpoint Cyber blog (2026-11-12)
      stated: APG found no indication of an unauthenticated, internet-facing execution path against arbitrary ScreenConnect servers.
      saved_body: D-2-blackpoint.txt
    - publisher: Huntress via BleepingComputer (2026-11-11)
      stated: This appears to be abuse of legitimate functionality, aided using custom-built tooling that is, in some cases, compiled on the fly on the victim’s computer,
      saved_body: D-2-bleeping.txt
  - topic: Did the technician-workstation stage succeed anywhere
    statements:
    - publisher: ConnectWise via BleepingComputer (2026-11-11)
      stated: ConnectWise also said it has received reports of technician workstations being compromised during interactive ScreenConnect sessions, but these reports are still being confirmed.
      saved_body: D-2-bleeping.txt
    - publisher: Huntress
      stated: To date we have not observed a successful jump from an infected endpoint to a technician workstation, or from that workstation to other endpoints.
      saved_body: D-2-huntress.txt
    - publisher: Blackpoint Cyber
      stated: Blackpoint’s SOC observed unauthorized deployments, but did not observe successful Guest-to-Host propagation.
      saved_body: D-2-blackpoint.txt
  - topic: How many extensions are in scope
    statements:
    - publisher: ConnectWise via BleepingComputer (2026-11-11)
      stated: While the initial access method remains unconfirmed, our initial assessment suggests the activity may involve a threat actor’s abuse of independent third-party extensions installed in partner environments.
