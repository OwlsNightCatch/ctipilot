  caveats:
  - The repository page was read through extract (trafilatura); Wordfence's page was read through the jina reader fallback of extract (Published Time 2026-11-12T14:39:17+00:00); both are saved. The repository's own date comes from page metadata (2026-11-12), not from a commit I read.
  - The researcher's evidence is an instrumented lab (AddressSanitizer / ThreadSanitizer) on Debian bookworm, prefork MPM, cleartext h2c, built from upstream tarballs. It demonstrates a race and heap corruption/crash on 2.4.70 and a clean 2.4.71; the repo's table lists no code-execution result. Its description 'potential remote code execution' is the researcher's stated impact class, not a demonstrated outcome. I did not read the repository's evidence files, and the PoC code itself is not reproduced here.
  - Red Hat's sentence 'public research has demonstrated a reliable exploit against a default-configured server' is unchanged on its 2026-11-11 page; Wordfence says that advisory links no code-execution demonstration. Both statements are reported as made. The repository is a crash/corruption lab, so it does not by itself settle which is right.
  - Ubuntu's CVE page (updated 12 November 2026) shows 'Needs evaluation' for every release even though USN-9090-1 of the same date lists package versions for the five releases it covers; report both as printed. USN-9090-1 also lists packages for 18.04, 16.04 and 14.04 ESM, but its CVE-2026-119618 paragraph says the issue only affected 20.04, 22.04, 24.04, 26.04 and 26.10.
  - 'SUSE page: ''Overall state of this security issue: Pending''; several older SLE rows read ''Not affected''. No SUSE fixed version exists to cite.'
  - Debian's tracker pages were read on 2026-11-13 (page metadata carries no date); DLA-4902-1 also lists about twenty other apache2 CVEs. The Debian pages themselves do not carry a publication date I could read, so the 2026-11-13 date is the read date.
  - Red Hat API output lists fix_state 'Affected' for JBoss Core Services and Hardened Images on the lines adjacent to the product_name/package_name lines quoted (the state line is not contiguous with them in the saved body).
  - 'Not checked this run: the ENISA EUVD and CISA KEV state for this CVE beyond S1''s findings (S1: not in KEV; EPSS 0.00398).'
  suggested_record_type: update (Debian and other distribution fixes change who still needs the workaround; a public crash test changes the exploit-status wording)
  priority_change: 'no (notable stays: no exploitation reported; public test shows crash, not code execution). Reconsider only if a code-execution demonstration or KEV listing appears.'
  actions_change: 'yes, wording only: drop ''as on Debian bookworm and trixie'' from actions[0] and name the remaining unfixed products (Debian forky, SUSE, Red Hat JBoss Core Services and Hardened Images); add the Debian and Ubuntu fixed versions to the fix list.'
- entry_id: 2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix
  old_statements_superseded:
  - where_in_entry: frontmatter title, headline, summary; cves[0].affected
    old_text: 'Microsoft .NET: an out-of-band release fixes a Brotli decoder flaw ... in 8.0.33, 9.0.22 and 10.0.14 / affected: ''.NET 8 before 8.0.33, .NET 9 before 9.0.22, .NET 10 before 10.0.14 and .NET 11 before Release Candidate 3 (runtime and NativeAOT packages); .NET Framework is not affected'''
    now_true: 'Microsoft''s record (revision 7, 2026-11-12) now also lists the Windows operating system as affected, with the November 2026 cumulative updates as the fix: Windows 10 21H2 and 22H2 (ESU), 1809; Windows 11 23H2, 24H2, 25H2, 26H1, 26H2; Windows Server 2019, 2022, 2025 (Server Core included), with KB and build numbers below; it also lists PowerShell 7.4/7.5/7.6, Visual Studio 2019/2022/2026 and the .NET SDK rows. The .NET-runtime fix versions are unchanged; the ''not affected: .NET Framework'' statement is the entry''s own text from the .NET blog, and the record''s description remains .NET-worded. The record names no Windows component.'
  - where_in_entry: frontmatter summary, last sentence; body paragraph 1; Update 2026-10-28 section
    old_text: although Microsoft's record still said not exploited on 2026-10-25 / Microsoft scores it CVSS 3.1 8.1, marked it publicly disclosed and not exploited on 2026-10-25, and rates it Exploitation More Likely / Microsoft's own record marked the flaw not exploited on 2026-10-25
    now_true: 'Unchanged on revision 7 of 2026-11-12: the record still says exploited ''No'', publicly disclosed ''Yes'', Exploitation More Likely, CVSS 3.1 8.1 with temporal vector E:U/RL:O/RC:C, record severity Critical, impact Elevation of Privilege; CISA KEV lists the CVE (as ''Google Brotli Unchecked Return Value Vulnerability'') since 2026-10-27 with due date 2026-11-10. The Microsoft statement is now dated 2026-11-12 (latest revision), not only 2026-10-25.'
  - where_in_entry: frontmatter actions[0]; body 'Defender takeaway'
    old_text: Install .NET 8.0.33, 9.0.22 or 10.0.14 (11 Release Candidate 3 for the preview) on every host that runs .NET applications ... because a runtime update on the host does not change a bundled runtime.
    now_true: Windows hosts also need the November 2026 cumulative update for their branch (the record's rows); this is a separate fix path from the .NET runtime update. Whether the Windows fix addresses a different code path from the .NET runtime is not stated by the record.
  - where_in_entry: frontmatter affected_products and entities
    old_text: 'affected_products: Microsoft .NET, Microsoft ASP.NET Core, Microsoft Visual Studio'
    now_true: add Microsoft Windows and Windows Server (record rows), PowerShell (rows 7.4, 7.5, 7.6) and the Azure Linux packages named in the record.
