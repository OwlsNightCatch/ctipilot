- cveawg.mitre.org/api/cve/<id> answers through `url --direct` with the CVE JSON 5 record (HTTP 404 = no published record yet); useful for batch consistency checks against vendor bulletins (found the seven-id collision in CTX697305).
- 'MSRC: `msrc cvrf 2026-Nov` returns the full 31 MB CVRF in under a minute; per-CVE Remediations carry KB and FixedBuild, Threats carry the Exploited/Publicly Disclosed/exploitability string. `msrc release` is capped at 500 of 1511 rows, so Exchange rows are found by CVRF product tree or by an OData `contains(cveTitle,''Exchange Server'')` filter through fetch_source._msrc_fetch_strict_json.'
