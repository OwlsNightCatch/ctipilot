  exchange_2016_2019_statement:
    exact_wording_release_post: Exchange Server 2016 and 2019 are no longer tested for vulnerabilities and there are no updates released. If you are using those versions of Exchange, you should consider them *permanently vulnerable* and should upgrade your organization immediately.
    where: 'Exchange Team Blog ''Released: November 2026 Exchange Server Security Updates'', 2026-11-10 (section ''Looking for Exchange 2016 and 2019 information?'' and the FAQ); the italics are the blog''s emphasis; The Register''s 2026-11-12 article is two days after the post and quotes it.'
    precursor: 'Exchange Team Blog 2026-10-13: ''This does not mean that those versions are not vulnerable to future security issues. We will stop testing Exchange 2016 and 2019 for vulnerabilities.'''
  cve_116928_vs_covered_entry:
    answer: 'CVE-2026-116928 is not a CVE of Exchange 2016/2019 or of Exchange SE: MSRC''s record names only Windows 10/11 and Windows Server 2016, 2019, 2022 and 2025 and its fix is the Windows cumulative update (KB5131291 Server 2016, KB5131085 Server 2019, KB5131090 Server 2022, KB5131080 Server 2025), not the Exchange SU. MSRC states the flaw is in ''the Windows Search component used by Microsoft Exchange Server'' reached when Exchange indexes an inbound attachment. So the covered entry is consistent: its fix instruction (November cumulative update on every Exchange server) is a Windows update instruction, and it applies to Exchange 2016/2019 servers because they run on a supported Windows Server release that gets the Windows update (inference by DR-A from the product list; Microsoft does not mention Exchange 2016/2019 in this record). What the covered entry does not say, and the composer may add: (1) the nine Exchange-product CVEs of the November SU exist, are fixed only in SE (KB5133453,
      build 15.02.2562.057), and none is marked exploited or disclosed; (2) 2016/2019 receive no Exchange fixes at all and Microsoft says to treat them as permanently vulnerable; (3) NCSC-CH''s Patch Tuesday advisory words the Exchange link as ''patches are for Windows OS, affecting Exchange Subscription Edition'', which could be read as excluding 2016/2019 hosts, whereas the MSRC FAQ does not name an Exchange version; (4) Microsoft''s note that the November Windows Server updates also fix the instability some Exchange servers showed after the October Windows updates.'
    unknowns: 'Windows Server 2012/2012 R2 are not in the 116928 product list (out of Windows support; Exchange 2016 can still run there): the saved record is silent, so no statement is made for them. Whether Windows Search runs on every Exchange server (and so whether the indexing path is reachable on each) is not stated by any source read.'
  exploitation_status:
    as_of: 2026-11-13T03:50Z
    summary: No Exchange CVE of the November SU (nine) and not CVE-2026-116928 is marked exploited or publicly disclosed in MSRC's records (live SUG records and the CVRF, all at revision 1.0 from 2026-11-10); none is in CISA KEV (catalogue 2026.11.10). Microsoft rates CVE-2026-118207 'Exploitation More Likely' and CVE-2026-118149 'Exploitation Unlikely', all others 'Less Likely'. The Register and NCSC-CH report no exploitation. This is an assessment of fresh patches, not a claim about unpatched 2016/2019 servers, which Microsoft no longer tests.
    sources:
    - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-118207
    - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-116928
    - https://www.theregister.com/saas/2026/11/12/microsoft-exchange-server-2016-and-2019-enter-their-permanently-vulnerable-era/5309401
    - https://security-hub.ncsc.admin.ch/#/posts/13169
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  workarounds: 'None; the remedy is KB5133453 on Exchange SE and the Windows cumulative update on every server hosting Exchange. For 2016/2019: Microsoft''s only stated remedy is to upgrade to Exchange SE immediately.'
