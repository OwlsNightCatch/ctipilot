  techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    behaviour: unauthenticated network request carrying a crafted serialized object to an exposed Windchill or FlexPLM server (CWE-502)
  - id: T1505.003
    name: Web Shell
    behaviour: NOT supported for CVE-2026-126325; documented only for the earlier CVE-2026-12569 campaign (persistent JSP web shells under the Windchill login directory, per PTC); use only if a source later reports post-exploitation for this CVE
  exposure:
  - Windchill and FlexPLM instances reachable over the network; self-hosted only (PTC-hosted tenants already patched).
  - Eleven Windchill release lines and ten FlexPLM release lines are listed; a defender checks the installed release line against the list and then the patch status against CS483249 behind the PTC login.
  - NCSC-CH names 'network access to the exposed Windchill or FlexPLM system' as the prerequisite.
  detection:
  - 'No source gives a detection for CVE-2026-126325. Behavioural hunt from PTC''s CVE-2026-12569 change log (not stated for this CVE): POST requests to .jsp files under the Windchill login path, which legitimate Windchill traffic does not make; new .jsp files in the login code directory; large multi-megabyte POST responses from JSP files in the application tier. Presented as post-patch compromise check guidance by analogy only.'
  triage: []
  caveats:
  - PTC's advisory CS483249 is behind the eSupport login (S1 flagged the same; confirmed again by extract on 2026-11-13). Everything about affected releases comes from PTC's own CVE record; everything about the patch comes from PTC's Trust Center sentence and NCSC-CH/THN relays. Fixed versions per branch are unknown.
  - 'BSI tags the advisory [UNGEPATCHT] in its feed (item published 2026-11-12 12:27 UTC) while PTC says a patch exists. Timing correction to S2''s note that ''the status moved during the day'': PTC''s Trust Center change-log entry announcing the patch is dated 2026-11-11 10:30 AM ET (15:30 UTC), about 21 hours BEFORE BSI''s feed item, so the tag did not lag a same-day change; the most likely reading (inference, no source explains the tag) is that BSI''s inputs (GHSA and EUVD, both 2026-11-11, per BSI''s own reference list) carried no fixed-version data. The patch date is therefore 2026-11-11, not 2026-11-12 (the date of the NCSC-CH and THN reports). Report both signals.'
  - 'Recipe note: S1/S2 recorded the PTC Trust Center page as WebFetch 403; `fetch_source.py extract` reads it in full on 2026-11-13 (31 KB, change log from 2026-06-18 to 2026-11-11). Only CS483249 itself is login-gated.'
  - The Trust Center page's metadata date reads 2026-09-07 because it is a living page; the change-log entry used is dated 2026-11-11 10:30 AM ET.
  - Windchill is a PLM product used in manufacturing, aerospace and defence supply chains; none of the readable sources names a public-sector victim or deployment. Swiss relevance rests on NCSC-CH having published its own advisory and on the product line's 2026 exploitation history.
  - The earlier campaign's IOCs (IPs, web-shell names, header, hashes) appear in PTC's Trust Center page; none is reproduced in this record.
  - CVSS and CVE data were read from the CVE Services JSON (cveawg.mitre.org) and EUVD; the main agent should cite EUVD or PTC rather than a per-CVE NVD/MITRE page, which check_run rejects.
  techniques_note: T1190 is the only mapping the sources support for this CVE.
