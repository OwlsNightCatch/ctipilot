  - id: T1566.001
    name: Spearphishing Attachment
    behaviour: CVE-2026-116928 delivery vector (a crafted attachment in inbound mail that Exchange indexes automatically); the attacker needs no user action, so T1190 is the primary mapping
  exposure:
  - Exchange SE RTM below build 15.02.2562.057 (KB5133453 / SU12); Microsoft's tool for inventorying which servers are behind is the Exchange Server Health Checker.
  - 'Every on-premises Exchange 2016 or 2019 server: no fix, no testing, Microsoft: ''permanently vulnerable''. Exchange Online customers with hybrid servers still must patch those servers, management-only hosts included.'
  - 'CVE-2026-116928: any Exchange server (any version) running on an unpatched Windows Server 2016/2019/2022/2025 that receives inbound mail.'
  detection:
  - 'Microsoft documents no detection for these rows. Post-install check the vendor gives: reboot and confirm every Exchange service started (services in a disabled state mean the installation was interrupted).'
  - 'Inference (not a source statement): with nothing exploited, detection is inventory-grade: build numbers per server versus 15.02.2562.057 and the installed Windows cumulative update; content-indexing or transport worker crashes after inbound mail with unusual attachments for CVE-2026-116928 (the covered entry already says this).'
  triage: []
  caveats:
  - 'Timing: Microsoft''s release post and the MSRC records are dated 2026-11-10 (page markup: 11/10/2026, 6:17:17 PM, timezone not stated), three days before ''today'' (2026-11-13); the fresh items are The Register''s 2026-11-12 14:55 UTC article (which gives the ''permanently vulnerable'' wording its news hook) and NCSC-CH''s earlier 2026-11-11 advisory. Recency anchoring for a composer: the Register piece plus the SU''s 2016/2019 consequence are the new development; the Patch Tuesday entry covering CVE-2026-116928 is already in the store, so this is an update to or a companion of that entry, not a duplicate of it.'
  - The Exchange Team post's table of SU builds did not render in the extract; the build and KB come from the CVRF/SUG FixedBuild field and KB5133453's page.
  - MSRC human pages (msrc.microsoft.com/update-guide/...) are script-built; data was read through api.msrc.microsoft.com (SUG v2 per-CVE, affectedProduct, and the 2026-Nov CVRF, revision 234 of the release document at 2026-11-12T01:49Z) and the human URL is the citation.
  - 'MSRC''s October rows still named Exchange 2016 CU23 and 2019 CU14/CU15 (e.g. CVE-2026-70571, Critical RCE, CVSS 8.1; CVE-2026-70279 spoofing 9.3), so the November rows are the first month without them: absence of a 2016/2019 row is a testing policy, not a vulnerability finding.'
  - CVE-2026-118207 carries Microsoft severity Critical although the score is 8.8 and it needs a low-privilege account; The Register calls it 'critical'.
  - Microsoft's note on the Windows update instability says it affects 'any version of Exchange'.
