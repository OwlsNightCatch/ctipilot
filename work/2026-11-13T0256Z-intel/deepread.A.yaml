  - id: T1190
    name: Exploit Public-Facing Application
    behaviour: CVE-2026-118207 and the other authenticated Exchange RCE/EoP rows reached over the network by an attacker with a mailbox-level account; CVE-2026-116928 reached by inbound mail with no authentication
  - id: T1068
