  exploitation_status:
    as_of: 2026-11-13T03:50Z
    summary: 'No source reports exploitation or a public proof of concept for any of the 29 CVEs (28 ADC/Gateway rows + Console). Provenance matters: the two Citrix bulletins contain no exploitation statement at all; the ''no exploitation, no confirmed public PoC'' wording is CERT-EU''s (attributed to the vendor through a reference [1] that CERT-EU''s reference list does not include) and heise''s (''seitens Citrix keine Berichte''); NCSC-CH lists the status as UNKNOWN. None is in CISA KEV (catalogue 2026.11.10). No watchTowr or other public technical analysis of these rows was found (labs feed newest post 2026-11-05; watchtowr.com/intelligence lists no November NetScaler item; WebSearch for CVE ids and bulletin id returned nothing on-point).'
    sources:
    - https://cert.europa.eu/publications/security-advisories/2026-020/
    - https://www.heise.de/news/Angreifer-koennen-Citrix-NetScaler-ADC-und-NetScaler-Gateway-lahmlegen-11522940.html
    - https://security-hub.ncsc.admin.ch/#/posts/13175
    - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    - https://labs.watchtowr.com/rss/
    context_not_this_cve: KEV holds six NetScaler CVEs added in 2026 (Mar 30 to Oct 4); watchTowr is credited on this bulletin and published write-ups for earlier 2026 NetScaler rows (labs feed titles for CVE-2026-88771 on 2026-09-28 and CVE-2026-88772 on 2026-09-29). That makes a public analysis plausible; it is an assessment, not a reported fact.
  workarounds: 'None stated in either bulletin (searched). The bulletin offers per-CVE configuration checks to decide which rows apply; the only remedy is the upgrade. CERT-EU: upgrade, internet-facing Gateway and AAA appliances first. NCSC-CH: ''Vendor patches available'' as the sole mitigation.'
  techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    behaviour: unauthenticated network requests to an internet-reachable Gateway/AAA/load-balancing virtual server (CVE-2026-120868 in default configuration; CVE-2026-107412 and the feature-dependent rows) and, for CVE-2026-120869, to the NetScaler Console management interface
  - id: T1499.004
    name: Application or System Exploitation (Endpoint DoS)
    behaviour: the bulletin text says every memory-overflow row can end in denial of service; a crash or reboot loop (CVE-2026-111345) is the documented outcome
  - id: T1552.001
    name: Credentials In Files
    behaviour: 'CVE-2026-111348: authentication material written to /var/log/httperror.log after a logout, readable by a local low-privileged user (mapping is DR-A''s; the bulletin gives no ATT&CK ids)'
  exposure:
  - 'CVE-2026-120868: every unpatched customer-managed ADC/Gateway, no feature needed (bulletin).'
  - 'CVE-2026-107412, -111342, -111343, -111344, -120864 (and the authentication-action rows -107413/-107414/-107415/-111340/-111341): the appliance acts as Gateway (SSL VPN, ICA Proxy, CVPN, RDP Proxy) or AAA virtual server, or has the named authentication action; bulletin gives grep patterns such as ''add vpn vserver'', ''add authentication vserver'', ''add authentication samlAction''.'
  - Other rows depend on a named feature (SMPP, DNS/DoH, PUSH, RTSP/SIP ALG, GSLB MEP, HTTP/2, HTTP/3 QUIC, ECH or SafeNet HSM key, AppFW, B64DECODE policy expressions, Diameter/SIP-TCP/MQTT/RADIUS load balancing, BGP without TCP-MD5).
  - 'CVE-2026-120863: needs a path from an untrusted host to NSIP or NSIP6.'
  - 'Console: reachability of the NetScaler Console IP (bulletin vector: adjacent; CVE record: network).'
  - Customer-managed only; Secure Private Access Hybrid uses NetScaler instances that must be upgraded.
  detection:
  - No source states a detection method or a post-patch compromise check. CVE-2026-111348 means /var/log/httperror.log can hold authentication material on appliances where a logout occurred; whether the fix scrubs earlier entries is not stated.
  - 'Inference (DR-A, not a source statement): the stated impact is crash/denial of service, so the observable on a vulnerable appliance would be unexplained packet-engine restarts, core files or reboots after inbound traffic to a Gateway/AAA virtual server.'
  triage: []
  caveats:
  - 'CITATION: the per-id CVE List URLs in this record are evidence URLs read through the CVE Services API; check_run rejects NVD/MITRE per-CVE pages as sources, so cite the Citrix bulletins and describe the CVE List observation in prose (EUVD-2026-102489, https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-102489, is a citable database record showing CVE-2026-111345 as a Trudesk flaw).'
  - 'ID ANOMALY: seven bulletin rows (CVE-2026-111343 to -111349: authentication request overflow, Endpoint Analysis, reboot loop, HTTP/2, B64DECODE, httperror.log credential log, AppFW decompression) carry ids that the CVE List and EUVD already assign to VulnCheck records for unrelated products (pig, APITable, Trudesk, ZenTao PMS, go-ldap-admin, Likeshop, Craftplan; published 2026-10-15). Eight more rows (CVE-2026-120860 to -120867) had no CVE List record at 03:41Z. Of the 28 ADC/Gateway rows only 13 resolved to NetScaler-CNA records (7 collide, 8 had no record); the Console id resolves correctly. The bulletin row text, not the id, identifies those seven rows until Citrix corrects the bulletin or the CVE List; scanner/ticket matching on id will mis-assign them. No source comments on the cause.'
  - 'CVSS conflict (Console): bulletin 9.4 AV:A SC:H/SI:H/SA:H vs CVE record and EUVD 9.3 AV:N SC:L/SI:L/SA:L (both by Citrix as CNA). The vendor bulletin is the vendor''s operative statement; the record is what scanners ingest.'
  - 'CVSS note: the bulletin text calls the impact ''unpredictable or erroneous behavior or Denial of Service'' while the vectors score C/I/A High on ten rows (CERT-EU makes the same observation). Whether code execution is feasible is not stated by any source; do not state RCE.'
  - Citrix's community blog announcing the monthly NetScaler security release program (cited by heise) answered HTTP 403 on direct fetch and WebFetch and 'all transports failed' on extract; the cadence statement rests on heise alone. Next release date is therefore not confirmed from the primary.
  - The 'extract' body of CTX697305 drops the config-check lists under CVE-2026-111342/-111343 and carries none for -111345, -111348, -120863 (the server-rendered HTML text confirms -111342 and -111343 use the same Gateway/AAA patterns; none of the three has its own list).
  - Bulletin CTX697305 is a script-built page; text read from the server-rendered /external/article/CTX697305 view, the kbsearch URL is the canonical citation.
  - Two sibling Citrix bulletins of the same day (Secure Access Client for Windows CVE-2026-118268; Linux client fix in 26.10.4) were seen by S1 and are outside this follow-up.
