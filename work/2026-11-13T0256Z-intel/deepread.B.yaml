  - 'Single source: Group-IB is the only party that holds the directory; no independent write-up or victim statement was found (two searches), and Group-IB itself says it could not attribute the activity.'
  - 'Publication date: the page JSON-LD gives datePublished 2026-11-11T07:07:52Z and dateModified 2026-11-12T13:35:52Z; the RSS item is dated 2026-11-11. About 44 h before this run started, so just outside a 26 h window; the report text read
    is the post-modification version, and what changed on 2026-11-12 is unknown.'
  - Most operations rest on shell-history commands; 422 of 457 files were not recovered; outcomes are mostly unconfirmed (Group-IB marks which ones are).
  - The report is a vendor blog with product pitches; the data was assessed as legitimate with high confidence by Group-IB (cross-referencing across three files, tool-installation struggles, realistic mistakes, sampled targets verified as real).
  - 'No IOCs carried: the report lists server addresses, file hashes, file names and a Hikvision bypass token; all omitted.'
  - The Swiss lines are the report's only Swiss content (3 mentions); do not write that Swiss organisations were compromised or that the S3 repository belonged to a Swiss public body.
  - 'CVE-2024-55591 is a January 2025 vulnerability (CISA KEV since 2025-01-14, ransomware use Known): the finding is operator tradecraft and a target list, not a new flaw.'
  - Fortinet's version table is for the whole PSIRT (CVE-2024-55591 and CVE-2025-24472); per-CVE ranges are not separated in the text read.
