- trafilatura extract of a GitHub pull request page drops the PR body; the GitHub REST API (api.github.com/.../pulls/N, .../issues/N, .../commits) through the bridge url subcommand returns it (public, unauthenticated).
- VulnCheck advisory pages do not carry the disclosure timeline; the CVE Program JSON (cveawg.mitre.org/api/cve/<id>) does.
