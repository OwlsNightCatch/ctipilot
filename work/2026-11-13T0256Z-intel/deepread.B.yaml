  fortios_chain:
  - step: 1
    what: Mass scanning/exploitation with a modified watchTowr PoC for CVE-2024-55591 (batch scanning, per-target logging, results reporting); the PoC is a Python script with a Russian-language comment.
    claim_ids:
    - I4-14
    - I4-15
  - step: 2
    what: On success the script creates an administrator named "service" with the super_admin profile (a fixed name, whereas the intrusions Fortinet describes show random-looking account names).
    claim_ids:
    - I4-16
    - I4-44
    - I4-45
  - step: 3
    what: 'Results files list devices reported vulnerable: about 600 in Turkey (hospitals, industry, municipalities), 16 Ukraine, 14 Azerbaijan, 1 Algeria; further target lists exist for other countries.'
    claim_ids:
    - I4-17
    - I4-18
  - step: 4
    what: A stolen configuration of a Romanian organisation (FortiGate 81F, header FGT81F-7.0.11) carries the "service" account; the operator extracted 10 cleartext VPN passwords from it and the shell history shows subsequent VPN connection attempts
      and internal scanning; success unconfirmed.
    claim_ids:
    - I4-19
    - I4-20
    - I4-21
  fortios_versions:
    cve: CVE-2024-55591 (Fortinet PSIRT FG-IR-24-535, published 2025-01-14, updated 2025-03-31; the same PSIRT also covers CVE-2025-24472 added 2025-02-11, and its version table is not split per CVE in the text read)
    affected_and_fixed:
    - product: FortiOS 7.0
      affected: 7.0.0 through 7.0.16
      fixed: 7.0.17 or above
      claim_ids:
      - I4-24
    - product: FortiProxy 7.2
      affected: 7.2.0 through 7.2.12
      fixed: 7.2.13 or above
      claim_ids:
      - I4-29
    - product: FortiProxy 7.0
      affected: 7.0.0 through 7.0.19
      fixed: 7.0.20 or above
      claim_ids:
      - I4-30
    not_affected:
    - product: FortiOS 7.6
      claim_ids:
      - I4-25
    - product: FortiOS 7.4
      claim_ids:
      - I4-26
    - product: FortiOS 7.2
      claim_ids:
      - I4-27
    - product: FortiOS 6.4
      claim_ids:
      - I4-28
    - product: FortiProxy 7.6
      claim_ids:
      - I4-31
    - product: FortiProxy 7.4
      claim_ids:
      - I4-32
    - product: FortiProxy 2.0
      claim_ids:
      - I4-33
    workarounds:
    - fact: Disable the HTTP/HTTPS administrative interface, or limit reach with local-in policies (preferred over trusthost); for the CSF requests issue disable Security Fabric.
      claim_ids:
      - I4-34
      - I4-35
      - I4-36
    kev:
      fact: CISA KEV lists CVE-2024-55591, added 2025-01-14, with ransomware campaign use flagged "Known" (bridge JSON, catalogVersion 2026.11.10).
      claim_ids:
      - I4-39
      - I4-40
    fortinet_exploitation_statement:
      fact: Fortinet's PSIRT says reports show exploitation in the wild.
      claim_ids:
      - I4-23
    observation_by_this_agent: The configuration header quoted by Group-IB reads FGT81F-7.0.11; FortiOS 7.0.11 falls inside the Fortinet-listed affected range 7.0.0 through 7.0.16. Neither source states that this device was vulnerable at the
      time; it is a juxtaposition of two quoted facts.
    group_ib_does_not_state_fortios_versions: true
  swiss_element:
    group_ib_states:
    - fact: A file fgate_ch.json of 4,725 FortiGate scanning targets, labelled Switzerland.
      claim_ids:
      - I4-52
    - fact: 'Group-IB on that list (with the Korean and Irish ones): "These lists identify scanning targets but do not confirm vulnerability or successful exploitation."'
      claim_ids:
      - I4-53
    - fact: Switzerland is one of 15 countries Group-IB says the evidence shows FortiGate-related targeting in; other country lists were seen in the directory listing but not recovered.
      claim_ids:
      - I4-54
    - fact: 'In the table of additional operations: "S3 backup infiltration: Restic commands with AWS credentials accessing S3 repository at Swiss domain. Production snapshots enumerated." Period May-June 2025.'
      claim_ids:
      - I4-55
      - I4-56
    - fact: The report's key-discoveries bullet calls it "S3 backup access" among "additional apparent operations".
      claim_ids:
      - I4-57
    - fact: 'Report-wide limitation: for several operations the evidence is limited to recorded commands and does not confirm success, access or exfiltration unless stated.'
      claim_ids:
      - I4-12
    - fact: 'Group-IB''s S3 hardening advice: scope backup keys, keep them and restic repository passwords off general-purpose hosts, alert on repository access from unfamiliar IPs via S3 server access logs or CloudTrail data events.'
      claim_ids:
      - I4-58
    - fact: Sampled target IPs (not stated to include the Swiss list) were confirmed as real infrastructure running the claimed services.
      claim_ids:
      - I4-59
    group_ib_does_not_state:
    - 'That any Swiss FortiGate was vulnerable, compromised or accessed: the Swiss list is a scanning-target list; the vulnerable-device results files named in the report cover Turkey, Ukraine, Azerbaijan and Algeria only.'
    - Which Swiss organisations or sectors are on the list, whether any is a public body, or when the list was generated.
    - 'What the "Swiss domain" of the S3 repository is: no organisation, domain name or sector is given, nor whether "Swiss domain" means a .ch name or Swiss hosting; the report does not say how the AWS credentials were obtained, whether the
      access succeeded beyond "production snapshots enumerated", whether anything was copied, or whether the owner was notified.'
    - A link between the Swiss FortiGate list and the S3 repository activity; they appear in different parts of the report (a file list and an operations table) and the S3 activity is dated May-June 2025.
    - 'That Switzerland was the focus: the report''s stated focus is European organisations including defence, aviation and critical infrastructure, with Ukrainian targets prominent.'
    count_of_swiss_mentions_in_report: '3 (files table, campaign #1 paragraph, operations table); the directory listing also contains the file names fgate_ch.json, a file named ch_ca under chfrt/ and a file restic.txt (unrecovered, no description).'
    claim_ids_for_absences:
    - I4-19
    - I4-17
    quote_precisely:
    - I4-55
    - I4-53
  attribution:
    group_ib_position: 'No actor link: DarkLunnen is Group-IB''s own designation for an unclassified operator; no known actor, nationality or state affiliation established; no reliably identifying information in the recovered data.'
    indicators_without_attribution:
    - 'Linguistic indicators: Group-IB says Russian appears to have been the operator''s working language (Cyrillic keyboard-layout slips in shell history; a Russian comment in the modified exploit). Group-IB does not treat this as attribution.'
    - 'Targeting focus: European organisations including defence, aviation and critical infrastructure; Ukrainian defence and aviation among apparent targets (attempted source-code collection, success unconfirmed).'
    - 'Infrastructure: a Latvian hosting provider and a US-hosted Oracle Cloud staging server; SSH hops via Netherlands, US, Thailand, France. Group-IB asks the community for overlaps.'
    alternative_explanations: none offered by Group-IB; the report invites collaboration on attribution.
    claim_ids:
    - I4-05
    - I4-06
    - I4-07
    - I4-08
    - I4-09
  group_ib_guidance:
    fortigate:
    - fact: Patch FortiOS/FortiProxy against CVE-2024-55591, take HTTP/HTTPS admin off internet-facing interfaces, local-in policies for management addresses.
      claim_ids:
      - I4-46
    - fact: 'Hunt on patched devices too: a patch does not remove an account already created; look for an admin "service" with super_admin and any unexplained admin account or configuration change.'
      claim_ids:
      - I4-47
      - I4-48
    - fact: 'FortiGate event logs: jsconsole activity (Fortinet lists super_admin logins and admin creation through jsconsole as indicators).'
      claim_ids:
      - I4-49
      - I4-41
      - I4-42
    - fact: 'Assume the configuration was read on an exposed vulnerable device: rotate VPN, admin, IPsec PSK, LDAP/RADIUS secrets, review VPN logs, enforce MFA.'
      claim_ids:
      - I4-50
    - fact: Enable private data encryption (off by default; otherwise stored secrets are decryptable offline).
      claim_ids:
      - I4-51
    other:
    - fact: 'Tunnelling web shells on Exchange/web tiers: unfamiliar .aspx/.ashx/.jsp, w3wp.exe connections to internal hosts on 445/3389/5985, long-lived or high-volume POSTs to one page.'
      claim_ids:
      - I4-67
    - fact: VNC off the internet, segment OT.
      claim_ids:
      - I4-68
    - fact: S3 backup pattern (see Swiss element).
      claim_ids:
      - I4-58
