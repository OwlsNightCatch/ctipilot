  title: 'Dixell/Copeland XWEB EVO (end-of-service refrigeration supervision web controller): VulnCheck CNA cluster of 2026-11-12, 14 CVEs of which seven are CVSS 4.0 9.2-9.3'
  window_note: VulnCheck, EUVD and CVE Program records were published 2026-11-12 19:34-20:07 UTC (about 7-8 h before the run started); some records were updated through 2026-11-13 00:40 UTC. In window.
  claims:
  - claim: 'CVE-2026-124007: pre-auth OS command injection via the password field (hashpass invocation in login.lua, cleanout.lua, api.lua; root through the setuid wlua interpreter); affected XWEB EVO before 5.6.2.'
    source_url: https://www.vulncheck.com/advisories/dixell-copeland-xweb-evo-pre-auth-os-command-injection-via-password-field
    publisher: VulnCheck (CNA advisory CVE-2026-124007)
    source_date: '2026-11-12'
    passage: XWEB EVO before 5.6.2 contains a pre-authentication OS command injection vulnerability that allows unauthenticated remote attackers to execute arbitrary commands by injecting shell metacharacters into the password field.
    body_file: bodies/B-1-vulncheck-124007.txt
    id: I1-01
  - claim: 'Same record: the injection reaches root because wlua is setuid.'
    source_url: https://www.vulncheck.com/advisories/dixell-copeland-xweb-evo-pre-auth-os-command-injection-via-password-field
    publisher: VulnCheck (CNA advisory CVE-2026-124007)
    source_date: '2026-11-12'
    passage: to achieve root-level command execution via the setuid wlua interpreter.
    body_file: bodies/B-1-vulncheck-124007.txt
    id: I1-02
  - claim: Same record names the end-of-service date; credit goes to the independent finder.
    source_url: https://www.vulncheck.com/advisories/dixell-copeland-xweb-evo-pre-auth-os-command-injection-via-password-field
    publisher: VulnCheck (CNA advisory CVE-2026-124007)
    source_date: '2026-11-12'
    passage: This product line reached it's end of service date in March 2026.
    body_file: bodies/B-1-vulncheck-124007.txt
    id: I1-03
  - claim: Finder credit on every record of the cluster read.
