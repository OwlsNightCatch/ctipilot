  observable_behaviours_in_order:
  - step: 0
    phase: Access (origin unknown)
    what: Valid stolen GitHub tokens (personal access tokens, bot-account tokens, tokens issued through the Fly.io GitHub App, and in one victim-reported case a leaked GitHub CLI OAuth token) are used exactly as a developer would; no GitHub Actions
      bug is exploited.
    claim_ids:
    - I3-02
    - I3-48
    - I3-54
    - I3-100
  - step: 1
    phase: Probe
    what: 'From about 12:45 UTC on 2026-11-10 (Aikido) a harmless pull request titled "docs: dependency audit notes" (body "Routine dependency audit notes") is opened from a branch wfx-docs, adding docs/wfx-audit.md; it only proves write access.'
    claim_ids:
    - I3-16
    - I3-17
    - I3-18
  - step: 2
    phase: Payload push
    what: 'A single shell script of about 1,500 lines is pushed where the token and repository setup let it run: (a) two steps added to an existing workflow, commit "ci: refresh build cache" (the most common, 21,000+ commits by 2026-11-12); (b)
      appended to an existing shell script CI already runs (update.sh, tests/retry_env.sh), same commit message; (c) a new workflow build-audit-<6 chars>.yml on a throwaway chore/<8 chars> branch, commit "chore: add dependency audit workflow";
      (d) hidden .ci-<6 chars>.sh at the repo root plus a package.json edit so an npm script (postinstall in 11 of the samples) runs it, two "chore: add ci helper" commits.'
    claim_ids:
    - I3-19
    - I3-20
    - I3-24
    - I3-21
    - I3-22
    - I3-23
  - step: 3
    phase: Execution and collection (on the runner or the developer machine)
    what: Every Actions secret and variable via toJSON(secrets)/toJSON(vars), the GITHUB_TOKEN, the memory of the Runner.Worker process (so script/npm-hook copies need no workflow change), process environments, credential files (AWS, Azure, GCP,
      Docker, Kubernetes, npm, PyPI, SSH, Vault), AI-provider keys, a repository snapshot with recent history and artifacts, and on self-hosted runners cloud instance-metadata credentials.
    claim_ids:
    - I3-30
    - I3-31
    - I3-32
    - I3-33
  - step: 4
    phase: Escalation
    what: The job OIDC token opens AWS, GCP and Azure sessions; chains into further AWS roles named in the repository; impersonates GCP service accounts; replays cached Azure CLI refresh tokens for Microsoft Graph and Key Vault.
    claim_ids:
    - I3-34
  - step: 5
    phase: Persistence designed to outlast rotation
    what: 'AWS: assumed-role trust policy rewritten to a wildcard principal and iam:CreateAccessKey tried for IAM users. Azure: federated identity credential named wfx-ci-<n> added to Azure AD applications so repository workflows sign in with
      no stored secret. Forged passing required status checks: present in the code; StepSecurity found it off in all 101 copies, Aikido describes it as active (see conflicts).'
    claim_ids:
    - I3-35
    - I3-36
    - I3-37
    - I3-38
    - I3-39
  - step: 6
    phase: Exfiltration
    what: Gzipped archive by HTTP POST to collection servers from 2026-11-10; from 2026-11-12 (first sample 01:10 UTC, Telegram-only from about 05:30 UTC) to a Telegram chat through bot tokens, with no collection IP in the payload. Channels that
      use GitHub itself (Actions cache, step summary, artifact wfx-loot-<run id>) existed but were off in every copy StepSecurity examined.
    claim_ids:
    - I3-43
    - I3-45
    - I3-46
    - I3-44
  - step: 7
    phase: Cleanup
    what: 'Within about a minute the attacker pushes a revert commit ("ci: restore", sometimes "ci: cleanup") and deletes the workflow run with its logs, leaving a gap in the run numbers; where the run was not deleted the public log still shows
      the stealer''s own status lines.'
    claim_ids:
    - I3-26
    - I3-27
    - I3-28
    - I3-29
    - I3-72
  - step: 8
    phase: Downstream spread
    what: Automated publishing carried the payload into one Packagist package version and two Go module tags (workflow file only); the npm hook runs on any machine that installs dependencies during the window.
    claim_ids:
    - I3-73
    - I3-74
    - I3-96
