        CVE-2026-124009, CVE-2026-124011, CVE-2026-124013, CVE-2026-124014, CVE-2026-124015. 5.8.8 is the upper bound the CNA recorded; no source says it is the last release, and the vendor says no further updates exist after 2026-03-16.'
      claim_ids:
      - I1-33
      - I1-36
    - question: Can an operator actually obtain 5.6.2, 5.7.0 or 5.8.8?
      answer: 'Not from the vendor page read on 2026-11-13: it lists EVO packages only up to 5.2.3 (2018/07/09). The vendor end-of-support bulletin says no firmware or security updates are released after 2026-03-16. Dixell France nevertheless
        tells operators to install "the latest version for your model" from that page. No source read explains where 5.6.2 to 5.8.8 were distributed. The CNA ranges put 5.2.3, the newest version on the vendor page, inside the affected range of
        10 of 14 records.'
      claim_ids:
      - I1-43
      - I1-45
      - I1-35
    - question: What is observable from the ranges alone (not a source statement)?
      answer: -124012, -124011, -124013 and -124015 start at 5.6.2, which the ranges make the first release carrying the daily_password mechanism and the pre-login sysinfo disclosure; the old hard-coded password and the unescaped-argument CGIs
        end at 5.6.2. Flagged as reading of the CNA data by this agent.
      claim_ids: []
  exploitation_status:
    as_of: '2026-11-13'
    exploited_in_the_wild: No source read reports exploitation of any of the 14 CVEs. VulnCheck, EUVD, GHSA, CVE.org and the vendor say nothing about exploitation.
    public_poc: None found. GitHub Advisory Database (unreviewed mirror of -124007) says "No known source code"; three WebSearch queries (CVE id, finder handle, "XWEB EVO" PoC/write-up) returned only the February 2026 XWEB PRO research (a different
      product line) and no EVO write-up; the finder is credited on the records but no write-up by the finder was found.
    epss: EUVD gives EPSS 0.0 on the records read
    cisa_kev: Not listed (KEV JSON via the bridge, catalogVersion 2026.11.10, contains no Copeland, Dixell or XWEB entry)
    vendor_position: Copeland PSIRT acknowledged receipt on 2026-10-19 and on 2026-11-05 said that, given EOS status, it will not do a comparative analysis against previously disclosed vulnerabilities (CVE record timeline). No vendor advisory
      for these CVEs was found.
    claim_ids:
    - I1-67
    - I1-68
    - I1-27
  campaign_tie:
    question: Which sources, if any, tie XWEB EVO (and these CVEs) to the Danfoss/Copeland/Dixell refrigeration campaign or to the CERT-FR / NCSC.ch / BACS warnings?
    short_answer: 'No source ties these CVEs to the campaign: no read source says a campaign-compromised unit was an XWEB EVO, that any of the 2026-11-12 CVEs was used, or that the CVE cluster relates to the warnings; the CNA records never mention
      the campaign. XWEB EVO is tied to the campaign only at the level of remediation guidance: Copeland''s bulletin of 14 October 2026 (carried in the Dixell France PDF that CERT-FR links) is addressed to XWEB EVO, NCSC.ch echoes it, and BACS
      lists "Copeland/Dixell XWEB" as potentially affected.'
    ties_found:
    - source: Copeland bulletin of 2026-10-14 inside the Dixell France PDF, linked from the CERT-FR alert Documentation section
      what: Acknowledges "the vulnerability identified" on an end-of-life XWEB EVO generation; tells operators to remove all XWEB EVO from the public internet immediately and restore if needed; the whole recovery procedure is written for XWEB
        EVO.
      kind: remediation guidance addressed to EVO, no statement that EVO units were compromised
      claim_ids:
      - I1-47
      - I1-49
      - I1-50
      - I1-51
    - source: NCSC.ch / BACS Cyber Security Hub advisory 13054, update of 2026-11-06
      what: Says the updated CERT-FR alert identifies Copeland/Dixell XWEB and that Copeland's guidance "specifically addresses end-of-service XWEB EVO systems". Also says the public information does not establish a common attack method or confirm
        exploitation of the Danfoss CVEs it lists.
      kind: echo of the vendor guidance; explicit non-confirmation of exploitation of the listed (Danfoss) CVEs
      claim_ids:
      - I1-52
      - I1-53
    - source: BACS public warning, 2026-11-10 (German)
      what: Identifies Copeland/Dixell XWEB as "potentially affected" and refers to protection and migration measures for older unsupported systems, with a link to the CERT-FR alert.
      kind: warning at product-family level; no EVO/PRO split
      claim_ids:
      - I1-54
    - source: CERT-FR alert CERTFR-2026-ALE-012
      what: Lists "Copeland xweb" and "Dixell xweb" as affected systems and knows of numerous compromises; names neither EVO nor PRO, no CVE, no entry vector.
      kind: product-family level
      claim_ids:
      - I1-50
    no_tie_found:
    - The only compromised-unit event log read (Ransom-ISAC, 2026-11-02) concerns an XWEB Pro 1.9.0, not an EVO.
    - Forescout's Shodan count (7,075 Copeland/Dixell XWEB services) is not split by EVO and PRO on the page read.
    - The VulnCheck, EUVD, GHSA and CVE.org records say nothing about the refrigeration campaign; the records carry only the end-of-service note.
    - 'Dates: Copeland''s acknowledgement is dated 2026-10-14, five days BEFORE VulnCheck reported to Copeland PSIRT (2026-10-19). No source says which vulnerability Copeland''s bulletin refers to; do not equate it with the VulnCheck cluster.'
    - 'Juxtaposition only, no source links them: the vendor''s temporary-access procedure asks for the XWEB EVO date and the MAC address shown on the login page, which are the same two inputs the CNA says derive the daily Administrator password
      (CVE-2026-124005/-124012).'
    claim_ids_no_tie:
    - I1-55
    - I1-56
  techniques:
  - id: T1190
    name: Exploit Public-Facing Application
    behavior: Unauthenticated command injection and authentication flaws in the XWEB EVO web interface (login.lua, cleanout.lua, api.lua, xwconsole.cgi, config.lua).
    basis: mapping from the CNA descriptions; no source gives ATT&CK ids
  - id: T1078.001
    name: Default Accounts
    behavior: Hard-coded Administrator backdoor credential (CVE-2026-124004); vendor-documented factory Admin account on XWEB PRO and EVO (Dixell France).
    basis: mapping from CNA description and the Dixell France guide
  - id: T1078
    name: Valid Accounts
    behavior: Administrator code-of-the-day and Linux root password derived offline from MAC address and date (CVE-2026-124005, -124006, -124012), then used as ordinary logins.
    basis: mapping
  - id: T1059.004
    name: Unix Shell
    behavior: Shell metacharacters injected into hashpass, popen() and system() argument strings.
    basis: mapping
  - id: T1548.001
    name: Setuid and Setgid
    behavior: Injected commands run as root because wlua and the CGIs (xwconsole.cgi, xwbackup.cgi, xwrestore.cgi) are setuid-root.
    basis: mapping from the CNA descriptions
  - id: T1565.001
    name: Stored Data Manipulation
    behavior: 'Adjacent CVE-2026-124014: unauthenticated write of /etc/xwebconfig.json (configuration tampering).'
    basis: mapping, adjacent CVE only
  exposure:
  - fact: 'Affected: XWEB EVO, the web supervisor of Copeland/Dixell refrigeration and cold-chain equipment, sold until October 2023 and end of software support since 2026-03-16.'
    claim_ids:
    - I1-34
    - I1-39
  - fact: 'How to tell: from outside the site network, browse to the site public IP; the XWEB login page must not appear (vendor guide). The MAC address shows on the login page via CTRL+ALT.'
    claim_ids:
    - I1-57
    - I1-63
  - fact: 'Vendor: no port forwarding, no DMZ, no direct public IP for EVO units; use a VPN. Even the March 2024 best-practice bulletin said never to expose the control system to the internet.'
    claim_ids:
    - I1-59
    - I1-41
  - fact: Scale of internet exposure is not known for EVO specifically; Forescout counted 7,075 Copeland/Dixell XWEB services in October without an EVO/PRO split.
    claim_ids:
    - I1-56
  detection:
  - fact: 'No source gives EVO-specific log artefacts or detection content for the cluster. The vendor recovery procedure is the only post-compromise check: user list and profiles, alarm categories/levels/recipients with a test alarm, device
      parameters (setpoints, alarm thresholds, defrost), a fresh off-box backup.'
    claim_ids:
    - I1-60
    - I1-61
    - I1-62
  - fact: 'CERT-FR: a factory reset alone is insufficient on an unpatched end-of-life unit (persistence goes, the device stays vulnerable).'
    claim_ids:
    - I1-64
  triage:
  - fact: 'Vendor: XWEB EVO has no configurable password policy but locks an account for 5 minutes after 5 wrong entries in 5 minutes. Inference (not a source statement): derived-credential and hard-coded-password logins are single requests,
      so a successful Administrator login with no preceding failures is consistent with those flaws rather than guessing.'
    claim_ids:
    - I1-65
    - I1-66
    - I1-11
    inference: true
  caveats:
  - 'Single CNA source: VulnCheck assigned all 14 CVEs and wrote the descriptions; the EUVD, GitHub Advisory Database and CVE.org entries repeat the same text and are not independent. The finder (credited) published no separate write-up that
    was found.'
  - 'The vendor neither confirms nor disputes the cluster in anything read: Copeland PSIRT acknowledged receipt (2026-10-19) and later said it would not do a comparative analysis because of end-of-service status (2026-11-05).'
  - CVSS values are the CNA's own (CVSS 4.0 9.2 to 9.3 for the seven; the CNA also gives CVSS 3.1 of 8.1 to 9.8); no NVD or vendor score exists. AT:P (attack requirements present) is why the daily-password and hashpass records score 9.2 rather
    than 9.3.
  - Fixed releases 5.6.2 and 5.7.0 and the 5.8.8 upper bound exist only as CNA range boundaries; the vendor download page lists nothing above 5.2.3 and the vendor says no updates after 2026-03-16 (see versions.resolution).
  - XWEB EVO is a different product line from XWEB PRO (Claroty Team82 / CISA ICSA-26-057-10, fixed in PRO firmware 1.13, already in the store as 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce). Do not merge the CVE lists.
  - The hard-coded credential string and the derivation inputs are named or implied in the CNA text; they are deliberately not carried (credential-grade detail, no defender value beyond the CVE id).
  - The seven adjacent records (-124003, -124008, -124009, -124011, -124013, -124014, -124015) are in the same cluster; the task named seven, the cluster is 14.
  - The EUVD JSON API URL is the fetched source; the human EUVD page was not fetched. The CVE Program JSON is the only place carrying the disclosure timeline but is an NVD/MITRE-class per-CVE page that check_run forbids as a cited source.
