  hardening:
  - fact: Inventory the CLFS authentication Mode value across the estate to size the exposed population (0 or 1).
    claim_ids:
    - I2-48
  - fact: 'Do not disable CLFS authentication as a workaround (Mode 2): it re-exposes the older memory-corruption bug class; the README author says the same.'
    claim_ids:
    - I2-49
    - I2-52
  - fact: 'Restrict untrusted local code execution: application control and script control.'
    claim_ids:
    - I2-50
  - fact: Treat the missing advisory as no fix; expect further releases from the same researcher (Cyderes counts sixteen public releases in roughly thirty-one weeks and notes Patch-Tuesday release timing in June to September and now November).
    claim_ids:
    - I2-51
    - I2-57
    - I2-58
  - fact: 'Do not run the public PoC on production hosts to "test": the README recommends doing so, and it spawns a SYSTEM shell (no source says it is safe; BleepingComputer readers questioned it).'
    claim_ids:
    - I2-17
    inference: true
  triage:
  - fact: 'Discriminator offered by Cyderes: hid.dll under C:\Program Files\Common Files\microsoft shared\ink does not ship with Windows, so any creation there is a successful write regardless of variant; the Defender signature-update RPC from
      outside the Defender service tree and a hid.dll creation are "rare enough in a typical estate to alert on rather than hunt".'
    claim_ids:
    - I2-40
    - I2-42
  - fact: Benign lookalikes are not described by any source (osk.exe, consent.exe and conhost.exe are ordinary Windows processes; the discriminators are the hidden relaunch by an unexpected parent, a DLL load from the ink directory, and a SYSTEM
      conhost on the interactive desktop right after a hid.dll write).
    claim_ids:
    - I2-41
    inference: true
  conflicts:
  - topic: Mode value labels
    detail: 'Microsoft and Cyderes: Mode 0 = enforcement, 1 = learning. BleepingComputer writes "0 or 1 (learning mode or enforcement mode)" and Shield53 writes "value 0 (learning mode) or 1 (enforcement mode)": both reverse the labels. The numeric
      scope (0 or 1) is the same in every source.'
    claim_ids:
    - I2-19
    - I2-54
    - I2-55
  - topic: Breadth of exposure
    detail: 'Researcher: about 80 percent of Windows installations; Cyderes: low confidence, no data. Microsoft KB: the mitigation exists only in Windows 11 25H2 and Windows Server 2025 updates from 2025-10-28; Cyderes: "ships enabled on current
      Windows versions". The README says systems older than 90 days are "definitely vulnerable"; Microsoft says systems past 90 days of learning move to enforcement (still Mode 0, in scope), and new installs start in enforcement.'
    claim_ids:
    - I2-30
    - I2-23
    - I2-28
    - I2-29
  - topic: AV/EDR disable
    detail: 'README and BleepingComputer: the technique "can be used to turn off any antivirus/EDR". Cyderes reproduced only the SYSTEM shell and describes Defender as the bait handler; it does not confirm an AV/EDR disable on other products.'
    claim_ids:
    - I2-36
    - I2-11
  - topic: Researcher identity
    detail: BleepingComputer and Shield53 name a real individual; Cyderes uses handles only ("a single researcher operating under a rotating set of handles"). Do not carry a personal name.
    claim_ids: []
  - topic: Reproduction coverage
    detail: Only Cyderes reports its own reproduction (SYSTEM shell); the other write-ups re-report the README. No source says which Windows build Cyderes used.
    claim_ids:
    - I2-11
  techniques:
  - id: T1068
    name: Exploitation for Privilege Escalation
    behavior: 'Logic flaw in the CLFS authentication-file creation path: Defender, coerced through its signature-update RPC and object-manager symbolic links, makes clfs.sys create the .cnpf file as SYSTEM at an attacker-chosen path.'
    basis: Cyderes mapping
  - id: T1574.001
    name: DLL (Hijack Execution Flow)
    behavior: Planted hid.dll in the Common Files\microsoft shared\ink directory is loaded by consent.exe started as SYSTEM through a runas request, spawning a SYSTEM conhost.exe on the interactive desktop.
    basis: Cyderes mapping
  - id: T1070.004
    name: File Deletion
    behavior: Transacted delete of the planted hid.dll and termination of consent.exe after the SYSTEM shell is up.
    basis: Cyderes mapping
  - id: T1106
    name: Native API
    behavior: DeviceIoControl to the CLFS device, native object-manager symbolic links and the Defender RPC method.
    basis: Cyderes mapping
  caveats:
  - Cyderes is the only source with its own technical reproduction; BleepingComputer, SecurityOnline, Shield53 and Cyber Press re-report the README (Cyderes' reference list names SecurityOnline). The README is the exploit author's own claim.
  - Nothing here is a Microsoft statement about SignDrop; the Microsoft pages (KB 5056852, 2024 blog) document the mitigation only.
  - 'Local privilege escalation only: it needs prior code execution as a standard user; no remote vector.'
  - The 80 percent exposure figure is unverified; the narrowest documented population is Windows 11 25H2 / Server 2025 with updates from 2025-10-28 or later (Microsoft), which is this agent's juxtaposition, not a source statement.
  - The Nightmare-Eclipse cluster counts (sixteen releases, ninth Howler Cell report) are Cyderes' tally; the store already carries earlier drops (actor:nightmare-eclipse).
  - 'No IOCs carried: file name and registry path are behavioural artefacts quoted from the analysis, not attacker infrastructure; mirror hostnames and the payload hash are omitted.'
  exposure:
  - fact: Windows 11 25H2 and Windows Server 2025 hosts with CLFS authentication Mode 0 or 1 are the documented in-scope population; check the registry value per host. Older Windows builds without the mitigation are not described by any source
