  defender_checks:
  - telemetry_class: source-control data (pull requests, branches, commits)
    check: 'Search all org repositories for pull requests titled "docs: dependency audit notes", branches wfx-docs, chore/<8 chars> and ci-check-<4 digits>, and commits since 2026-11-10 titled "ci: refresh build cache", "ci: restore", "ci: cleanup",
      "chore: add ci helper", "chore: add dependency audit workflow"; note which account pushed them (that account''s tokens are stolen).'
    claim_ids:
    - I3-89
    - I3-90
    - I3-91
  - telemetry_class: CI run history
    check: Look for a gap in the Actions run numbers directly after such a commit (a deleted run); if a run survived, its log lines show what the stealer collected.
    claim_ids:
    - I3-28
    - I3-29
  - telemetry_class: GitHub audit log
    check: GitHub documents an organisation audit-log event workflows.delete_workflow_run ("A workflow run was deleted.") with fields including run_number and the acting token; search it for deletions around the attacker commits. This is GitHub
      documentation, not an incident source.
    claim_ids:
    - I3-97
    - I3-98
    - I3-99
  - telemetry_class: GitHub API / token provenance
    check: A probe PR's API record carries performed_via_github_app when it was made through a GitHub App token (the Fly.io app in StepSecurity's 173 cases); review OAuth app grants and PAT use of any account that opened a probe PR.
    claim_ids:
    - I3-49
    - I3-95
  - telemetry_class: cloud control-plane audit logs
    check: 'AWS: CloudTrail AssumeRole/AssumeRoleWithWebIdentity with session names starting wfx- followed by CreateAccessKey or UpdateAssumeRolePolicy; role trust policies with a wildcard principal. Azure: federated identity credentials named
      wfx-ci-* on app registrations. GCP: GenerateAccessToken and SignJwt through the GitHub workload identity pool.'
    claim_ids:
    - I3-92
    - I3-93
    - I3-94
    - I3-36
  - telemetry_class: runner egress
    check: Egress allowlist stops both the HTTP-server and the Telegram configurations because neither a bare IP nor api.telegram.org belongs in a normal build.
    claim_ids:
    - I3-44
  - telemetry_class: package and developer-machine data
    check: Check composer.lock and go.sum for the listed versions; anyone who ran npm install while a hook commit was live ran the stealer locally.
    claim_ids:
    - I3-75
    - I3-96
  hardening:
  - fact: Automation accounts with write access, and especially branch-protection bypass rights, are as valuable to this attacker as maintainers; review whether bots need bypass at all.
    claim_ids:
    - I3-68
    - I3-95
  - fact: Required status checks should be pinned to their source GitHub App (rulesets) so a check posted by a workflow token cannot stand in.
    claim_ids:
    - I3-42
  - fact: 'Rotation alone is not enough where the payload ran: remove the AWS wildcard trust policies, created access keys and Azure wfx-ci-* federated credentials; secrets rotated after the first wave were stolen again in 1,838 repositories
      (Endor Labs).'
    claim_ids:
    - I3-35
    - I3-15
  techniques:
  - id: T1195.002
    name: Compromise Software Supply Chain
    behavior: Stealer committed to repositories and CI configuration; automated publishing carried it into a Packagist version and two Go module tags.
    basis: mapping from StepSecurity/Aikido; no source gives ATT&CK ids
  - id: T1550.001
    name: Application Access Token
    behavior: Stolen GitHub personal access tokens, bot tokens, GitHub App (Fly.io) user tokens and a leaked GitHub CLI OAuth token used to act as the developer.
    basis: mapping
  - id: T1078.004
    name: Cloud Accounts
    behavior: OIDC-minted AWS, GCP and Azure sessions; stolen GitHub (SaaS) accounts.
    basis: mapping
  - id: T1059.004
    name: Unix Shell
    behavior: The stealer is a roughly 1,500-line shell script run from workflows, shell scripts or npm hooks.
    basis: mapping
  - id: T1552.001
    name: Credentials In Files
    behavior: Credential files for AWS, Azure, GCP, Docker, Kubernetes, npm, PyPI, SSH and Vault, .env/.pem/.kdbx files (Aikido).
    basis: mapping
  - id: T1552.005
    name: Cloud Instance Metadata API
    behavior: Instance-metadata credentials on self-hosted runners.
    basis: mapping
  - id: T1213.003
    name: Code Repositories
    behavior: Snapshot of the repository, recent history and workflow artifacts.
    basis: mapping
  - id: T1098.001
    name: Additional Cloud Credentials
    behavior: iam:CreateAccessKey for IAM users; Azure AD federated identity credential wfx-ci-<n>.
    basis: mapping
  - id: T1098.003
    name: Additional Cloud Roles
    behavior: AWS assumed-role trust policy rewritten to a wildcard principal.
    basis: mapping
  - id: T1070
    name: Indicator Removal
    behavior: Revert commits and deletion of workflow runs and logs.
    basis: mapping
  - id: T1567
    name: Exfiltration Over Web Service
    behavior: HTTP POST of the archive, then Telegram Bot API uploads.
    basis: mapping
  technique_note: The runner-memory scan of Runner.Worker is described but no source names the mechanism (for example /proc), so no OS-credential-dumping id is asserted.
  caveats:
  - Two independent labs (StepSecurity, Aikido) plus Endor Labs and the victims' own repository records agree on the core activity; the figures differ by method and time (see conflicts and counts).
  - Exfiltration indicators change between payload versions; no IOCs are carried here (the sources list servers, a Telegram chat, bot IDs, hashes and a callback token).
  - StepSecurity's protection section is a vendor product description and is not carried as defender guidance.
  - 'The WebdriverIO PR #16444 body is the contributor''s text; StepSecurity''s issue #16446 is vendor-authored and therefore not independent of the StepSecurity post.'
  - The BleepingComputer line on GSA, French-government and Fortune 100 accounts has no stated source and was not found elsewhere; do not carry it as fact.
  - No Swiss victim is named in any source read; whether Swiss public bodies host or build from affected repositories is unknown.
  - 'Name: StepSecurity "WFX Phantom"; Aikido and BleepingComputer "wfx-loot"; the actor''s own script label is "wfx".'
  - The GitHub documentation passage on the audit-log event is generic documentation added by this agent for a telemetry anchor; no incident source names that event.
  exposure:
  - fact: Any account or bot with write access to repositories you own or build from whose token may have been exposed (PAT, OAuth grant, GitHub App user token including the Fly.io app, leaked GitHub CLI token), and any build of such a repository
      that runs with cloud OIDC trust or long-lived secrets; branch-protection bypass for bots raises the risk.
    claim_ids:
    - I3-68
    - I3-95
    - I3-09
  detection:
  - fact: See defender_checks (source-control, run-history, audit-log, token, cloud control-plane, egress, package data).
    claim_ids: []
  triage:
  - fact: 'A probe PR alone (harmless file docs/wfx-audit.md) proves the opening token had write access, not that the payload ran; the payload-ran signal is a commit with one of the named messages plus a missing run number. StepSecurity issue
      #16446 states the probe alone does not establish release or CI-secret compromise.'
    claim_ids:
    - I3-18
    - I3-66
  - fact: 'A legitimate revert or "ci: restore"-style commit pushed by a bot seconds after an unexplained commit is the attacker''s cleanup pattern; ordinary dependency-audit or cache commits do not pair with a deleted run.'
    claim_ids:
    - I3-26
    - I3-27
    inference: true
