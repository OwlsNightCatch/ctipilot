  same_campaign_check:
    question: Is BleepingComputer's 2026-11-12 "4,800 GitHub accounts compromised for cloud credentials" (wfx-loot) the same campaign as StepSecurity's WFX Phantom?
    what_each_source_says: 'BleepingComputer reports Aikido''s research and calls the campaign "wfx-loot"; StepSecurity calls it "WFX Phantom". Both describe: start on 2026-11-10; a probe PR titled "docs: dependency audit notes" (StepSecurity
      and Aikido both name the branch wfx-docs); a stealer script of about 1,500 lines that self-designates "wfx"; delivery by workflow edit, new workflow on a short-lived branch or npm install hook; cloud-credential theft and persistence; revert
      and workflow-run deletion; the same affected packages (Packagist digitalelvis/neuronai-studio 3.14.3 and Go onuragtas/docker-env v1.0.278 and v1.0.280); overlap with the October GhostAction wave. StepSecurity''s post itself lists an artifact
      named wfx-loot-<run id>.'
    reading: By the identifiers both sources state (probe title, branch, script size, start date, affected packages, GhostAction overlap) they describe the same observable activity; BleepingComputer and Aikido do not cite StepSecurity and use
      their own names and counts (4,837 accounts and 61,764 repositories versus 63,000+ probe PRs). This is a reading of matching stated artefacts, not a statement by either source that the two names are one campaign; the composer should state
      "also tracked as wfx-loot by Aikido" with attribution if used.
    claim_ids:
    - I3-82
    - I3-83
    - I3-84
    - I3-85
    - I3-80
    - I3-81
    unverified_in_bleepingcomputer:
      claim: Some compromised accounts belonged to Fortune 100 organisations, the US General Services Administration, the French government, Nextcloud and WebdriverIO.
      status: No source stated and not found in the Aikido, StepSecurity, Endor Labs, SecurityWeek or CSA texts read; Nextcloud and WebdriverIO are corroborated by their own repositories, the GSA, French-government and Fortune 100 parts are not.
        Do not carry without a primary.
      claim_ids:
      - I3-87
  conflicts:
  - topic: Forged passing status checks
    detail: 'StepSecurity: the capability exists but is turned off in all 101 copies examined. Aikido: the payload posts forged "success" status checks early in the run so branch protection is cleared. The CSA note reports both. Plausible reconciliation
      (not stated by either): different payload versions or configurations.'
    claim_ids:
    - I3-38
    - I3-39
    - I3-41
    - I3-40
  - topic: Exfiltration channel
    detail: 'Aikido and BleepingComputer (and the first StepSecurity samples): HTTP POST to two servers only. StepSecurity and Endor Labs: Telegram added 2026-11-12 (first sample 01:10 UTC; Telegram-only from about 05:30 UTC per StepSecurity;
      Endor Labs says v5 sends a copy to Telegram on every run). Time-dependent, not contradictory, but a blocklist built from the November 10 servers misses the newer copies.'
    claim_ids:
