- code: F4
  category: hallucinated-fact
  section: darklunnen-group-ib-fortios-super-admin-swiss-scan-list
  item: "title"
  url_or_quote: "... restic access to an S3 backup repository at a 'Swiss domain'; Group-IB confirms no Swiss victim"
  summary: "Group-IB never says no Swiss victim exists. It says the scanning lists 'do not confirm vulnerability or successful exploitation' and that for several operations (incl. the Swiss S3 restic row with 'Production snapshots enumerated') the evidence is limited to recorded commands and 'does not independently confirm successful exploitation, unauthorized access, or data exfiltration'. The body's own wording ('no source says that a Swiss organisation was compromised') is right; the title overstates. Replace with 'Group-IB does not confirm any Swiss victim'."
