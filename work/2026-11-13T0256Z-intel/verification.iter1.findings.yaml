  category: claim-not-supported
  section: citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
  item: "NetScaler CTX697305 (2026-11-13)"
  url_or_quote: "Seven rows (the authentication request overflow, Endpoint Analysis, a reboot loop, HTTP/2, the B64DECODE expression, credentials written to a log and the Application Firewall decompression row) carry ids that ENISA's database already assigns to unrelated products ([ENISA EUVD, 2026-10-15](https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-102489))"
  summary: "The cited record EUVD-2026-102489 carries only CVE-2026-111345 (Trudesk). The other six colliding ids resolve to EUVD-2026-102487 (111343, pig), 102488 (111344, APITable), 102490 (111346, ZenTao), 102491 (111347, go-ldap-admin), 102492 (111348, Likeshop), 102493 (111349, Craftplan). Cite those records (or cveawg CVE records) or narrow the clause to the one row the page carries. Claim 029d4f967d."
