  item: "summary and evidence[] quote 8"
  url_or_quote: "and Huntress says a fully patched server should be treated as vulnerable (summary); evidence: 'A fully patched N-central server should be treated as vulnerable. There is no fix available at the time of writing.' (Huntress (updates of 2026-11-12))"
