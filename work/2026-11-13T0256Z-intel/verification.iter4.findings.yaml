  section: citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws (sourcing_note, cves[])
  item: "Citrix NetScaler ADC and Gateway: 28 memory-safety flaws fixed on 2026-11-12"
  url_or_quote: "sourcing_note: 'Seven bulletin rows (CVE-2026-111343 to CVE-2026-111349) carry ids that the CVE List and ENISA's database already assign to records for unrelated products ... so the seven colliding ids are not carried in the CVE records here.' Cited bulletin https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"
  summary: "The bulletin was revised after the run captured it (cached capture: 'Modified 11-12-2026 04:52', rows 111343-111349, history 'Initial Publication' only; live page now 'Modified 11-12-2026 20:27' with history '2026-11-12 | Fixed a typo in CVE numbers CVE-2026-111333, CVE-2026-111334, CVE-2026-111335, CVE-2026-111336, CVE-2026-111337, CVE-2026-111338, CVE-2026-111339' and the table rows carrying those ids). cveawg.mitre.org returns CVE_RECORD_DNE for 111333-111339, so there is no collision any more; the note now describes ids the cited page no longer carries. Fix: rewrite the note (the bulletin first printed seven ids that collided with unrelated products and corrected them on 2026-11-12) and update the run-record note that says the seven ids 'collide with unrelated products ... and were left out of cves[]'."
