  summary: "The single citation ends a sentence that chains the PHP-flaw scope (Mobile Access Portal, SSL Network Extender, SAML realm VPN, captive portal, UserCheck, Zero Phishing; R81.20-R82.20 and Spark) with the CVE-2026-123039 scope. sk1000362 carries only the second (Force firewalls, Security Management and Log Servers, Multi-Domain, Maestro; 'Non-affected Products: Check Point Spark Firewalls, Smart-1 Cloud'); the PHP scope is on sk1000302. Add the sk1000302 citation to the first clause."
