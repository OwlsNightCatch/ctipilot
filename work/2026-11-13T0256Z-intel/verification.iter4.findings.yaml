  item: "**Exposure:** for the PHP flaws, a gateway on a listed release with at least one of the six portal or VPN features in use; for CVE-2026-123039, a Force gateway, management or log server, Multi-Domain server or Maestro on R81 to R82.20 below those Jumbo takes ([Check Point, 2026-11-12](https://support.checkpoint.com/results/sk/sk1000362))"
