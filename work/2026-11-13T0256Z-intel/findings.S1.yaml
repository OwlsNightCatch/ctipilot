    extended_notes: |
      Defender angle. Exposure: read the build with `show ns version` and the NetScaler configuration for the per-CVE preconditions the bulletin lists; CVE-2026-120868 needs no feature, so every unpatched appliance is in scope regardless of configuration; CVE-2026-107412, CVE-2026-111344, CVE-2026-120864 and the authentication-action rows are in scope where the appliance is a Gateway or AAA vserver; CVE-2026-120863 needs a path to NSIP/NSIP6, so the management address should not be reachable from untrusted hosts. The Console bulletin gives the precondition as access to the Console IP (adjacent vector in the vendor score), so keep the Console on a management network and upgrade to 14.1-74.34. Fixed builds: ADC/Gateway 14.1-73.57 and later, 13.1-64.39 and later, 14.1-FIPS 14.1-73.58 FIPS and later, 13.1-FIPS and 13.1-NDcPP 13.1-37.293 and later; Console 14.1-74.34 and later. CVE-2026-111348 means that an appliance on which any logout occurred holds authentication material in httperror.log, which matters for anyone who can read that log (support bundles included). Nothing in the bulletins says an attacker already in would be evicted by the patch; a post-patch compromise check is not stated by the source. Context from the store and the feed, not from the bulletin: watchTowr, whose researchers are credited, published pre-auth write-ups for earlier NetScaler flaws (CVE-2026-88771, CVE-2026-88772, CVE-2026-8451; labs.watchtowr.com feed read 2026-11-13), so a public analysis of these rows is plausible soon; that is an assessment, not a reported fact. Detection concept, as an inference from the flaw class and not a source statement: repeated packet-engine process restarts, core files and unexplained appliance reboots following inbound traffic to a Gateway/AAA virtual server. The labs.watchtowr.com feed carried no post inside the 26 h window, so no public watchTowr analysis of these rows existed when the feed was read.
