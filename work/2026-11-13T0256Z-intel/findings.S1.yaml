      ConnectWise, acting as CNA, published CVE-2026-127063 on 2026-11-12 for the third-party DataComm RMM+ extension for ScreenConnect: it "uses a static API secret by default"; where the default is kept, "unauthorized requests may be accepted, including requests to send commands to managed agents". The record scores CVSS 4.0 9.3 (network, low complexity, no privileges), lists all extension versions as affected, states that the ScreenConnect server and client are not affected, and says "No fixed RMM+ version has been announced. Disabling the extension is the current mitigation." For cloud-hosted ScreenConnect, ConnectWise "disabled and removed" the affected RMM+ extensions; on-premises, the instruction is to disable RMM+ immediately, verify that it stays disabled and not to re-enable or reinstall it pending further guidance. This is the first vendor-side CVE for the extension that Huntress ties to the 2026-11-11 mass client deployment; Huntress describes the flaw as a blank default access key in versions 1.0.31 and 1.0.32, while the CNA record speaks of a static default secret in all versions, so the two descriptions differ on whether the default is blank or a fixed string; both end in unauthenticated command delivery to managed agents. ConnectWise's own record does not mention the SCKit incident.
