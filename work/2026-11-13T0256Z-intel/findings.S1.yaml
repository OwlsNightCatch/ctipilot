candidate_sources:
  - id: connectwise-advisories-disclosures
    publisher: "ConnectWise-Advisories/Disclosures (ConnectWise CNA disclosure repository on GitHub)"
    url: "https://github.com/ConnectWise-Advisories/Disclosures"
    category: vendor-psirt
    why: "ConnectWise publishes its CNA disclosures (ScreenConnect, third-party extensions) here; https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-127063 read through extract on 2026-11-13 while every transport to https://www.connectwise.com/company/trust/advisories (the connectwise-trust-center record) returned 403 or a blocked-challenge; EUVD lists the repository as the reference of the CNA record. Suggest it as the working recipe for the connectwise-trust-center record."
  - id: azul-payara-release-notes
    publisher: "Azul Payara (release notes and security fixes)"
    url: "https://docs.azul.com/payara/release-notes/release-notes-7.6.0.html"
    category: vendor-psirt
    why: "First-party release notes list the Security Fixes per Payara line (FISH ids) and the CNA records of CVE-2026-110003 and CVE-2026-90908 reference them; extract reads the pages cleanly; Payara is a Jakarta EE application server with no source record."
coverage_gaps:
  - source_id: connectwise-trust-center
    reason: "https://www.connectwise.com/company/trust/advisories answers 403 on extract, url --direct, url, jina (reader relays the upstream block) and WebFetch (2026-11-13, one retry each). Working alternative found: the ConnectWise CNA disclosure repository https://github.com/ConnectWise-Advisories/Disclosures (extract reads it); recipe suggestion: add it as the fetch target for the record."
  - source_id: picus-security-blog
    reason: "recipe fix: https://www.picussecurity.com/resource/blog now returns 404; `extract https://www.picussecurity.com/resource` lists the posts (titles only, undated in the listing, newest featured items 2026-10); no in-window security content found."
  - source_id: citrix-netscaler-security-bulletins
    reason: "not in this slice, recipe observation: support.citrix.com bulletin pages are a script-built application (extract returns a Loading shell; the jina reader worked on 2026-11-13 after three exhausted keys rotated, WebFetch returned the shell). `python3 tools/fetch_source.py url --direct https://support.citrix.com/external/article/CTX697305` returns the full server-rendered bulletin (affected versions, acknowledgement, changelog) with no reader; the per-CVE table of long bulletins is only in the SPA text (jina)."
  - source_id: hub.ivanti.com
    reason: "Ivanti advisory pages (https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-CSA-CVE-2026-121683) are a Salesforce script shell on WebFetch and jina ('Loading', 'CSS Error'); no transport read them; fixed CSA build remains unconfirmed."
  - source_id: ptc-support
    reason: "https://www.ptc.com/en/support/article/CS483249 redirects to a login page (extract); no public advisory text."
  - source_id: fortinet-psirt
    reason: "feed read (20 items cap, all dated 2026-11-10); the feed carries no revision information, so pending-fix checks need the per-advisory page (extract works)."
  - source_id: ncsc-csh
    reason: "`ncsc-csh recent 12` returned no parsable items in this run (not in the S1 slice; reported as an observation for S2)."
  - source_id: stray-files
    reason: "a shell-variable slip wrote 18 scratch files to the filesystem root (/nextjs.json, /nextjs.err, /qnap.json, /qnap.err, /ruby.json, /ruby.err, /yeswehack.json, /yeswehack.err, /znuny.html, /znuny.err, /qnap_news.html, /qnap_news.err, /picus.txt, /picus.err, /depthfirst.html, /depthfirst.err, /atlassian.txt, /atlassian.err); the removal was blocked by the safety check and left for the operator; nothing in the repo is affected."
fetch_failures:
  - id: connectwise-trust-center
    url_tried: "https://www.connectwise.com/company/trust/advisories"
    fetch_method: "bridge:extract, bridge:url --direct, bridge:url, bridge:jina, webfetch"
    status_code: 403
    error_class: transport-403
    error_message: "fetch_source: upstream HTTP 403 for https://www.connectwise.com/company/trust/advisories; reader proxy relayed an upstream block/challenge; WebFetch: The server returned HTTP 403 Forbidden"
    attempted_methods: [extract, url --direct, url, jina, webfetch]
    mitigation_applied: "read the ConnectWise CNA disclosure repository on GitHub for the in-window CVE (CVE-2026-127063); the Trust Center advisory listing itself was not read"
    covered_anyway: false
