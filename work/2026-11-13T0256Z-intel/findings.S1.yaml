    discovery_trace: "first seen at: enisa-euvd bridge, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-11&toDate=2026-11-13&size=100 (EUVD-2026-124331 and -124332, assigner Payara, published 2026-11-12 08:43Z and 08:53Z) -> pivot: EUVD records https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-124331 and ...?id=EUVD-2026-124332 (their reference lists name five Azul release-notes pages) -> primary: https://docs.azul.com/payara/release-notes/release-notes-7.6.0.html and https://docs.azul.com/payara/version/6/release-notes/release-notes-6.44.0.html (extract; the 5.93.0 and 4.1.2.191.61 pages carry the same Security Fixes list). The GitHub advisory pages for the two GHSA ids were not reachable under the repository path tried and are not cited."
    summary: |
      Azul's Payara CNA published CVE-2026-110003 and CVE-2026-90908 on 2026-11-12. CVE-2026-110003: the administration REST interface lets a remote unauthenticated attacker "bypass secure-admin remote-access restrictions by supplying an arbitrary value in the X-GlassFish-authToken HTTP header"; the header's presence waives the remote-rejection check before the token is validated, an invalid token falls through to password authentication, which succeeds without credentials "on default domains configured with an empty administrative password", and the result is arbitrary administrative commands, "equivalent to complete compromise of the server". CVE-2026-90908: the GenericAdminAuthenticator lets a remote unauthenticated attacker bypass JMX/RMI administrative access restrictions "by spoofing the client host address", which can grant administrative access to the MBean server and lead to remote code execution; Payara Micro is affected only when its JMX connector is enabled. Both score CVSS 4.0 9.3 (network, low complexity, no privileges). The release notes of Payara 7.6.0, 6.44.0, 5.93.0 and 4.1.2.191.61 list the Security Fixes FISH-14190 "Remote Code Execution in JMX" and FISH-14855 "Remote Admin Authentication Bypass via Unvalidated Auth Token Header", and the community release 7.2026.11 is the fixed line for 7.2024.1.Alpha1 to 7.2026.11. The EUVD version ranges also list Payara lines as affected up to 5.2022.5, 5.201.2 and 6.2025.11 (older enterprise and community numbering) with no fixed release in those lines. The records state no exploitation and no public proof of concept; the exposure is the administration endpoint (the REST admin interface and the JMX connector), not the application ports.
