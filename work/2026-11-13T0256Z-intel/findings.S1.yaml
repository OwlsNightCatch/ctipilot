    summary: |
      Linux kernel CVE-2026-99999 (fix: "ipv4: validate checksum_start before completing checksum", mainline commit 6785011f8b16, fixed stable kernels 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57 and 7.2.11) lets a guest that controls virtio-net checksum metadata make the host kernel rewrite an IPv4 header after validation; the Linux CNA scores it CVSS 3.1 9.3 with a local vector (a malicious microVM or guest VM), Red Hat 8.8 (PR:L). The change since the earlier fires is public exploitation detail: pwn.ai's PwnEscape post (modified 2026-11-13) walks the primitive from bounded host-memory disclosure to a full guest-to-host escape, and its Part 2 (Firecracker) shows the guest locating the live Firecracker process through EPT, reverse-map and image-mapper resolvers and taking over a vCPU thread to run attacker-chosen code as root on the host in the authors' owned-host setup; the post says the release bundle contains the final helper source, JSONL resolver records, host capture, recovery manifest and four preserved read-only resolver binaries, and notes that adapting the last stage to another build needs a new validation of that binary's code signatures. This is the lab-demonstrated exploit chain the earlier reopen condition ('public exploit') pointed at, for Firecracker and, per the authors, for the researchers' own KVM setup and "many other hypervisor environments"; the authors also say provider-specific coordination stays unpublished. No exploitation in the wild is reported by any source read: CISA's KEV catalogue (version 2026.11.10) does not list the CVE, and CISA-ADP recorded SSVC Exploitation none on 2026-10-16 (per the 2026-10-20 fire); Red Hat's CVE page says it "tracks this flaw as a KEV active-exploit case" while all its product streams are marked affected with fixes pending, a wording that contradicts CISA's catalogue and should be read as Red Hat's internal tracking label until Red Hat explains it. Red Hat lists a mitigation for QEMU guests: remove the virtio-net device and re-add it with csum=off. Debian lists fixes in DSA-6568-1 and the LTS advisories DLA-4841-1 and DLA-4850-1. Exposure is limited to hosts that run untrusted guests (multi-tenant virtualisation, microVM and sandbox platforms) with a vulnerable kernel.
