    summary: |
      VulnCheck, as CNA, published a cluster of critical records for XWEB EVO, a Dixell/Copeland web supervisory controller for refrigeration and cold-chain equipment whose product line reached end of service in March 2026. CVE-2026-124007 (CVSS 4.0 9.2): pre-authentication OS command injection through the password field, unescaped in the hashpass invocation of login.lua, cleanout.lua and api.lua, giving root through the setuid wlua interpreter, fixed in 5.6.2. CVE-2026-124002 (9.3): the same class through the username field in versions 5.2.3 to before 5.7.0. CVE-2026-124010 (9.3): root command injection through the setuid xwconsole.cgi 'sh' parameter passed to popen(), before 5.6.2. CVE-2026-124004 (9.3): hard-coded backdoor credential "xwebevonewgeneration" for the built-in Administrator, before 5.6.2. CVE-2026-124012 (9.2), CVE-2026-124005 (9.2) and CVE-2026-124006 (9.2): the Administrator code-of-the-day and the Linux root password are derivable from the device MAC address and the date (root credential identical across units before 5.7.0, MAC-derived afterwards), in versions through 5.8.8, with no fixed version named. EUVD gives EPSS 0.0 and no exploitation; no exposure count is published. The ENISA record references the vendor's end-of-service bulletin and software-update page.
    region_nexus: "global; operational technology in refrigeration and cold chain (hospital, food, logistics); the French supermarket refrigeration case already in the store is a different vendor (Danfoss)"
