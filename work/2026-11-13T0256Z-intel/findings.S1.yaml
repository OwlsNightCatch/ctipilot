    - "CISA KEV (bridge cisa-kev, catalogue 2026.11.10, 1779 entries): newest dateAdded is 2026-11-10 (Outlook CVE-2026-124194, Openwave Webtop CVE-2026-111793, Cisco BroadWorks CVE-2026-20320, Barracuda CVE-2026-111560 and CVE-2026-116606, Chromium CVE-2026-125350); nothing dated 2026-11-12 or later. Of the 2026-11-09/10 rows, Openwave Webtop Media Transcoder, Cisco BroadWorks (CVE-2026-20320, EUVD exploited list EUVD-2026-62586) and GPUStack (CVE-2026-102895) are in no entry; Openwave and BroadWorks were borderline-dropped by earlier S1 fires and GPUStack was returned by the 2026-11-10 fire without becoming an entry (work/2026-11-12T0255Z-intel/findings.S1.yaml records each), and no new source or delta appeared for them, so they are not re-returned."
    - "KEV ransomware flags: checked every CVE of the 14-day prior-coverage index against the catalogue's knownRansomwareCampaignUse; none of the covered CVEs carries 'Known', so no flip."
    - "ENISA EUVD exploited list (api/exploitedvulnerabilities) holds four records: BroadWorks (EUVD-2026-62586), Barracuda (EUVD-2026-115148), Chrome (EUVD-2026-121390), Outlook (EUVD-2026-122310); all covered or previously dispositioned."
  patch_tuesday_2026_11_msrc:
    - "Release 2026-Nov, 1127 SUG rows (third-party Azure Linux rows included): exploited = CVE-2026-124194 only (Outlook spoofing, covered, KEV); publiclyDisclosed = none among Windows rows (CVE-2026-92707 MessagePack-CSharp DoS, 2026-Oct release, disclosed, 5.3, dropped: low impact); CVE-2026-111497 revised 2026-11-12 (returned as update-of)."
    - "CVSS 3.1 9.8, pre-auth network, E:U, no exploitation or disclosure: the seven rows in the covered entry (CVE-2026-85844 Kerberos, -116928 Search, -88218 DNS, -88243 DHCP Server, -119958 LDAP, -88234 iSCSI, -116945 SQL Server) are covered. Not covered, dropped with reason: CVE-2026-112967 Xbox Live Networking Service, -96157 Media Foundation, -96067 and -96078 Color Management, -95901 and -95882 DirectMusic (9.8, heap/integer overflow in client media and graphics components, E:U, no exploitation or disclosure, fixed by the same cumulative update; the covered entry already says these rows exist), -95962 VFP RCE (9.0, AC:H)."
    - "Dropped as authenticated or cloud-side: CVE-2026-120002 SharePoint Server EoP and -109467 Azure DevOps Server RCE (9.9, PR:L, E:U), -80095 and -109454 SharePoint (9.0, PR:L, UI:R), -118740 Aspire (9.1), -114146 ASP.NET Core EoP (9.0), -120779 Visual Studio Code RCE (9.6, UI:R), -119990 Azure OpenAI, -114160 Azure Managed Grafana, -114162 Graph (cloud services, no customer action in the table), CVE-2026-48509 MessagePack-CSharp (9.1, third-party row)."
    - "MSRC revised-CVE sweep ($filter=latestRevisionDate ge 2026-11-10, 300 rows): only CVE-2026-111497 (Windows rows, returned), the 2026-11-11 metadata refresh of the .NET, ASP.NET Core, Aspire and Visual Studio rows, and third-party Azure Linux rows; CVE-2026-44815 and CVE-2026-45465 (June 2026 rows revised 2026-11-10) carry no exploitation or disclosure."
  other_scheduled_releases_in_window:
    - "Palo Alto (rss, 2026-11-11): CVE-2026-0323 to -0331 and -0250, PAN-OS monthly bundle, all severity LOW or MEDIUM (CVE-2026-0330 authenticated RCE in Panorama, MEDIUM), plus PAN-SA-2026-0014 Chromium monthly (HIGH): none exploited, none pre-auth critical; dropped. The Brotli portfolio page (CVE-2026-111497) was revised 2026-11-09 only to add Cortex XCor, IoT Security and Prisma SaaS to its remediated section, no PAN-OS change (every PAN-OS hotfix was already released per the store)."
    - "Fortinet (feed, newest FG-IR-26-268 etc., all 2026-11-10): covered by the 2026-10-23 entry; FG-IR-26-219 (FortiAnalyzer/FortiManager CVE-2026-126170) still reads 'Upgrade to upcoming 8.0.3' and FG-IR-26-202 (FortiMail CVE-2026-126150) 'upcoming 7.2.10' when fetched 2026-11-13: pending fixes unchanged, no update to return."
    - "Chrome (chromereleases stable-updates label page): 157.0.8103.78/.79 with 83 security fixes and five Critical use-after-free bugs is already in the CVE-2026-125350 entry; Chrome 158 early-stable builds (Android 158.0.8127.36, iOS 158.0.8127.35) announced 2026-11-12, desktop 158 not yet announced; nothing new."
    - "Citrix 2026-11-12 bulletins CTX697305, CTX697320, CTX697280 and CTX697281: returned (first item). Atlassian monthly bulletin falls on the third Tuesday, 2026-11-17: not yet due. Ivanti five advisories of 2026-11-10 and SAP/Adobe/Siemens Patch Day: already covered (Ivanti delta returned as update-of)."
  advisory_revisions_checked:
    - "Fortinet FortiAnalyzer/FortiManager 8.0.3 and FortiMail 7.2.10: still 'upcoming' (see above), unchanged."
    - "Trend Micro KA-0024802: revised 2026-11-12, returned as update-of (Deep Discovery Analyzer ETA 2026-11-18)."
    - "Mitel MISA-2026-0010: Revision 5.0, last updated 2026-11-04, unchanged (extract of the Mitel page)."
    - "Siemens SSA-242944 and SSA-678870: both still V1.0, no update after 2026-11-10; SSA-045512 V1.2 unchanged. CISA republished Siemens Brotli and PHP2Shell advisories as ICSA-26-316-01 to -05 on 2026-11-12: -02, -03, -04 and -05 restate content already in the store (Desigo/Gridscale, Industrial Edge, RUGGEDCOM APE1808), -01 is the Spectrum Power item returned above."
    - "Vates VSA-2026-062 (Xen Orchestra): page unchanged ('Updated 2026-11-10', CVSS 'Not available yet'); no CVE id in EUVD search for 'Xen Orchestra' 2026-11-08 to 2026-11-13 nor via WebSearch: still no CVE."
    - "Ivanti CSA fixed build: unreadable at Ivanti; secondary source says 5.0.8.1 (returned as a low-confidence update-of)."
    - "Xerox XRX26-016 stays at v6 on the bulletins page (security.business.xerox.com/en-us/documents/bulletins/); XRX26-017 and -018 (patches that reduce exposure for EC7836, EC7856, WorkCentre 3655/3655i and AltaLink C80xx/B80xx/EC80xx, dated 2026-11-05) are the 'exposure-reducing patches' the store entry describes; XRX26-019 (FreeFlow Print Server v9 Solaris patch cluster, 2026-11-09) is routine; no Fiery bulletin appeared yet (Fiery due 9-23 Nov): nothing to return."
    - "Plone hotfix thread (2026-11-10): no CVE ids published yet (page re-read; WebSearch finds none)."
    - "Apache httpd mod_http2: Debian fixed packages appeared (returned as update-of)."
    - "Siemens IoT2050 SSA-834709, Publica/PK Softech, eMudhra, Certighost, Chrome entries: no new vendor revision found in this run's sources; not re-checked beyond the slice."
  dropped_candidates:
    - "CVE-2026-122006 Rails Active Storage (9.8, unauthenticated arbitrary file write and read via ImageMagick coders, fixed 8.0.5.2 and 8.1.4.1): GitHub advisory GHSA-f3w6-w445-fwh9 is dated 2026-11-04; EUVD ingested it 2026-11-12; nine days old with no fresh development, outside the window."
    - "ManageEngine DDI Central CVE-2026-19422 (9.1, unauthenticated DNS/DHCP change through agent-sync API impersonation, fixed in build 6301), ServiceDesk Plus CVE-2026-12507 and M365 Manager Plus CVE-2026-12591 (authenticated, 9.1 and 9.9): niche or authenticated; dropped."
    - "PTC Windchill and FlexPLM CVE-2026-126325 (RCE through deserialization, 4.0 9.2 AC:H, EUVD 2026-11-11): PTC's advisory CS483249 requires a login (extract returns the login page); EUVD is the only source; PLM product with no constituency link; dropped."
    - "Red Hat Quay CVE-2026-123710 and CVE-2026-110697, Checkmk CVE-2026-121374, -118965, -120495 (authenticated), MISP modules CVE-2026-127046 and -127016, SOGo CVE-2026-127131 and -127111 (rate limiting), Linksys EA8100, Joomla jDownloads CVE-2026-117551 (10.0 file-upload RCE, extension), WordPress plugin rows: reviewed in the EUVD critical-score list, no exploitation or constituency link; dropped."
    - "Action1 digest claim that Gitea CVE-2026-117685 is an exploited unauthenticated zero-day: the CVE record (Gitea CNA, 2026-11-01) describes an authenticated OCI blob-mount confusion; claim not supported, dropped."
    - "Chrome CVE-2026-106378 (macOS GPU sandbox escape step, fixed in Chrome 155, pwn.ai post): needs prior code execution in the GPU process; not returned."
    - "N-able N-central, Synology DSM, Confluence DC, Barracuda ESG, SonicWall and other covered ground: no delta found in the sources read."
