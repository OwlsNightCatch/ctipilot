    summary: |
      Cloud Software Group published bulletin CTX697305 on 2026-11-12 for customer-managed NetScaler ADC and NetScaler Gateway with 28 CVEs, all memory-safety or input-handling flaws that the bulletin describes as unpredictable behaviour or denial of service, while its CVSS 4.0 vectors score confidentiality, integrity and availability impact High on the top rows (an inference for a defender: the vendor scores more than a crash). The row that matters most is CVE-2026-120868, a memory overflow in packet processing with the precondition "All NetScaler ADC and NetScaler Gateway deployments (Default configuration / No additional feature required)", CVSS 4.0 9.3 with no authentication or user interaction. CVE-2026-107412 (9.5, attack requirements present) covers several memory overflows on appliances configured as Gateway (SSL VPN, ICA Proxy, CVPN, RDP Proxy) or AAA virtual server, which CERT-EU says are reachable without authentication. Further rows at 9.3 depend on a feature: SMPP load-balancing vserver (CVE-2026-107407), DNS recursion and DNS-over-HTTPS load balancing (CVE-2026-107408, -107409), PUSH vserver (CVE-2026-107410), Email OTP action (CVE-2026-107415), Endpoint Analysis on VPN/AAA vservers (CVE-2026-111344) and ICA proxy HDX (CVE-2026-120864); the 8.7 rows include SAML, WebAuth, LDAP, client-certificate and KBA authentication, HTTP/2, HTTP/3 (QUIC), Base64 B64DECODE policies, GSLB/MEP, SIP/RTSP ALG, Diameter/SIP-TCP/MQTT/RADIUS load balancing, TLS 1.3 with ECH or SafeNet HSM keys, and CVE-2026-120863 in the management plane (reachable through NSIP/NSIP6). Two lower rows are worth knowing: CVE-2026-111348 writes sensitive authentication material to /var/log/httperror.log after any logout (local read), and CVE-2026-111345 is a reboot-loop condition. Affected: 14.1 before 14.1-73.57, 13.1 before 13.1-64.39, NetScaler ADC FIPS before 14.1-73.58 FIPS, and ADC FIPS and NDcPP before 13.1-37.293; Secure Private Access Hybrid deployments that use NetScaler instances are affected too, and Citrix-managed cloud services are upgraded by Cloud Software Group. The bulletin carries per-CVE configuration greps (for example `add vpn vserver .*`, `add authentication vserver .*`, `add authentication samlAction`, `add lb vserver .* SMPP`) to decide which rows apply. Separately, bulletin CTX697320 fixes CVE-2026-120869 in NetScaler Console 14.1 before 14.1-74.34: an unauthenticated attacker can bypass authentication controls to access restricted resources, precondition "Access to Citrix NetScaler Console IP"; the bulletin scores it CVSS 4.0 9.4 with an adjacent-network vector, whereas the CVE record and EUVD carry 9.3 with a network vector (the per-CVE bulletin is the authority; the discrepancy matters for how exposed a Console must be). Citrix and CERT-EU report no exploitation and CERT-EU says no public proof of concept is confirmed. Acknowledged: Michael Tucker and Chew Keong Tan (XOR team, JPMorgan Chase), Himanshu Anand and Sina Kheirkhah of watchTowr, and Cloud Software Group's own Product Security team through AI-assisted code analysis; the Console flaw was found by that internal team. Two further bulletins of the same day fix local privilege escalation in the Citrix Secure Access Client for Windows (CVE-2026-118268, fixed in 26.11.1.6, CVSS 4.0 8.5) and a vulnerability in the Linux client (fixed in 26.10.4).
