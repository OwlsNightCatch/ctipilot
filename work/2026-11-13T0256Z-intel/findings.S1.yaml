        attribution: "ENISA EUVD (Payara CNA record CVE-2026-110003)"
        source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-124331"
      - quote: "spoofing the client host address"
        attribution: "ENISA EUVD (Payara CNA record CVE-2026-90908)"
        source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-124332"
    extended_notes: |
      Defender angle (from the records): exposure is the Payara administration REST interface and, for Payara Micro, an enabled JMX connector; check whether `asadmin` secure-admin is enabled and whether the admin password on default domains is still empty (the record says the REST bypass succeeds on default domains with an empty administrative password). Hardening: keep the admin port off untrusted networks and set an administrative password regardless of the patch. The release notes also list 'Remove Vulnerable CAs from Payara Trust Store' (FISH-15019), which fits the eMudhra CA removals covered elsewhere in the store; the notes do not name the CAs. Detection concept, an inference from the flaw class: HTTP requests to the admin REST interface carrying an X-GlassFish-authToken header from non-administrator addresses, and unexpected JMX/RMI connections to the Payara host.
