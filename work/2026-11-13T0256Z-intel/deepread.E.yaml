    summary: |
      Check Point's sk1000302 now reads lastModified 2026-11-12 and its Solution section says the fix is included in the Jumbo Hotfix Accumulators: R82.20 starting from Take 14, R82.10 from Take 52, R82 from Take 132 and R81.20 from Take 174, and in Spark Firewalls R82.00.11 starting from build B998002843 and R81.10.17 starting from build B996005005; the stand-alone hotfix download remains for customers who do not upgrade and is stated as compatible with all Jumbo takes, requires a reboot, and must be installed on each gateway, cluster member, security-group member or standalone server.
      The published entry records the Jumbo fix as 'planned for the Jumbo Hotfix Accumulators of 2026-11-11' and the Spark fixed builds as 998002823 (R82.00.11) and 996004992 (R81.10.17); the page now names different Spark build numbers (B998002843, B996005005) - a Spark unit on the older build numbers should be re-checked against the sk. The R81.20 Mobile Access condition on the page is unchanged: the standalone hotfix must sit on Jumbo Take 166 or higher where the Mobile Access Portal is used, and R81.20 Take 174 now includes the fix.
      The page still carries no exploitation statement for Check Point gateways, the affected-feature list (Mobile Access Portal, SSL Network Extender VPN, SAML-realm VPN, Identity Awareness captive portal, UserCheck, Zero Phishing) is unchanged, and the last dated note remains 2026-10-29 (R81.10 hotfix). No new CVE; CERT-FR's avis restates the same CVE-2026-109618 / CVE-2026-109619 (CVSS 9.2 per Check Point).
      Caveat: the exact date within 2026-11-12 on which the Solution section changed is not on the page (no dated note for it); the delta is established by comparing the page to the published entry.
