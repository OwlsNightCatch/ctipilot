  - id: "gpustack"
    what: "SANS ISC diary 33514 (2026-11-12): exploit attempts against GPUStack authentication bypass CVE-2026-102895"
    disposition: below-bar
    clause: "Product-class check only: GPUStack is an open-source GPU-cluster manager for AI workloads; the diary shows no Swiss public-sector or other constituency product class, so constituency relevance is nil on this evidence. Facts if the main agent wants a one-line mention: the flaw IS exploited (CISA KEV added 2026-11-09, due 2026-11-12; GHSA says exploited in the wild against v2.1.1 with attacker-created custom backends running reverse shells; ISC sees header-spoofing probes in-window), but no entry exists in the store and the 2026-11-10 fire already returned it without publication. The in-window ISC probe observation is a fresh scanning datapoint, not a delta that changes constituency relevance."
    borderline: true
    facts:
      cve: "CVE-2026-102895 (CWE-287/290/346), GPUStack before 2.2.0; fixed 2.2.0 (loopback auto-admin path removed, client-IP and forwarding-header handling hardened); GHSA-gj9m-f8ph-pmhr published 2026-07-31"
      mechanism: "get_current_user (gpustack/api/auth.py) treats a request whose source is loopback as the built-in administrator when force_auth_localhost is False (default); source can appear loopback either because a same-host reverse proxy is the TCP peer or via a forged X-GPUStack-Real-IP: 127.0.0.1 header"
      impact: "unauthenticated admin: user/model changes, persistent admin API-key creation, worker and cloud-provider secret disclosure, code execution through POST /v2/inference-backends/from-yaml"
      exploitation: "CISA KEV (dateAdded 2026-11-09, knownRansomwareCampaignUse Unknown); GHSA: observed exploited in the wild against a v2.1.1 deployment; SANS ISC 2026-11-12: probes sending the spoofed header against a honeypot, same source also looking for /v1/models-style AI endpoints"
      cvss: "not stated on the pages read (CVE assigned 2026-11-04 per ISC)"
      techniques: [T1190]
    sources:
      - { url: "https://isc.sans.edu/diary/rss/33514", publisher: "SANS Internet Storm Center", date: "2026-11-12", role: "primary", body_file: "E-8-sans-isc-gpustack-33514.txt" }
      - { url: "https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr", publisher: "GPUStack project (GitHub security advisory)", date: "2026-07-31", role: "primary", body_file: "E-8-gpustack-ghsa.txt" }
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA Known Exploited Vulnerabilities catalog", date: "2026-11-09", role: "corroborating", body_file: "E-8-kev.json" }
    evidence:
      - { quote: "CVE-2026-102895 is a trivial authentication-bypass vulnerability.", attribution: "SANS ISC", source_url: "https://isc.sans.edu/diary/rss/33514", body_file: "E-8-sans-isc-gpustack-33514.txt" }
      - { quote: "This vulnerability has been observed exploited in the wild against a v2.1.1", attribution: "GPUStack GHSA", source_url: "https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr", body_file: "E-8-gpustack-ghsa.txt" }
      - { quote: "GPUStack contains an improper authentication vulnerability which could allow unauthenticated administrative access, including user and model changes, persistent administrator API-key creation, disclosure of worker and cloud-provider secrets, and code execution through POST /v2/inference-backends/from-yaml.", attribution: "CISA KEV", source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", body_file: "E-8-kev.json" }
