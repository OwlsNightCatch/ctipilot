    exposure_facts: "Components: MX-ONE Service Node Manager (SNM) and Provisioning Manager (PM). Affected builds 8.0 (8.0.0.33) to 8.2 SP1 (8.2.1.0.14) of supported releases; end-of-support versions are not assessed by Mitel. Attack position per Mitel: network access from the LAN to the SNM/PM management interfaces, no credentials for the bypass. Defenders can read the installed MX-ONE release from the PBX administration and check that the hotfix level is 8.2 SP0 HF5 or 8.2 SP1 HF2 (or later); whether the SNM/PM web interfaces are reachable from user or guest VLANs, partner networks or the internet is the exposure question the vendor text leaves open."
    detection_facts: "The sources give no indicators, no exploitation statement and no post-compromise check. Inference only (not source-stated): after an unauthenticated administrative takeover, review SNM/PM web access logs for requests to administrative functions without a preceding login, new or changed administrator accounts, changes to PBX routing and service configuration, and operating-system commands run under the management service account."
