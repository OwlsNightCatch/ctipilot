    borderline_reason: "Unauthenticated auth bypass to administrative access at CVSS 9.4 on a PBX/UC platform, but Mitel scopes the attacker to 'LAN network access', no CVE assigned, no exploitation stated, supported-version hotfixes available. Clears the unauthenticated-admin-takeover leg of the bar; whether it is internet-facing is deployment-dependent, so the main agent should weigh notable vs high."
