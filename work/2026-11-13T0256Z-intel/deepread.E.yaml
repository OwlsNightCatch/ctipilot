    suggested_priority_note: "Raise to high only if the constituency runs MX-ONE with the Service Node Manager / Provisioning Manager web interfaces reachable from untrusted segments; Mitel's own text limits the attacker to LAN access."
    novelty: new
    sources:
      - { url: "https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0011", publisher: "Mitel PSIRT (MISA-2026-0011)", date: "2026-11-11", role: "primary", body_file: "E-1-mitel-misa-2026-0011.txt" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1516/", publisher: "CERT-FR (CERTFR-2026-AVI-1516)", date: "2026-11-12", role: "corroborating", body_file: "E-certfr-1516.txt" }
    discovery_trace: "first seen at: S2 lead list (work/2026-11-13T0256Z-intel/findings.S2.yaml, CERT-FR 2026-11-12 avis list) -> CERT-FR feed via `cert-fr avis-recent 60` (dated 2026-11-12) -> avis page https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1516/ (extract) -> primary: Mitel PSIRT https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0011 (extract; listing page https://www.mitel.com/support/security-advisories shows it as MISA-2026-0011, 'CVEs requested', critical)"
    summary: |
      Mitel PSIRT's MISA-2026-0011 (first issue and last update 2026-11-11, revision 1.0) covers three flaws in MiVoice MX-ONE, tracked only by Mitel's internal ids because the CVE ids are requested but not yet assigned.
      MTLVULN-1860, the one that matters, is an authentication bypass in the Service Node Manager component: an unauthenticated attacker with LAN network access can obtain unauthorized administrative access and view and modify PBX telephony routing and service configuration (CVSS 3.1 9.4 Critical, AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H).
      MTLVULN-1859 is a command injection in the Service Node Manager through insufficient parameter sanitization, requiring administrative privileges, giving operating-system command execution as the management service account (8.2 High, PR:H, scope changed); MTLVULN-1858 is an improper-authorization information disclosure in the Provisioning Manager for an authenticated attacker of any privilege level with internal LAN access to read system configuration data (6.5 Medium).
      Mitel states that exploiting them together can significantly amplify the impact, potentially resulting in a critical severity; read together, the unauthenticated bypass in the Service Node Manager hands over the administrative position the command injection otherwise needs.
      Affected: MiVoice MX-ONE 8.0 (8.0.0.33) to 8.2 SP1 (8.2.1.0.14), supported versions only. Fix: the MX-ONE PM/SNM hot fixes 8.2 SP0 HF5 and 8.2 SP1 HF2 or later, or an upgrade to a later release; the issues are corrected in MX-ONE 8.3 once available. Mitel's KB000129185 carries the detail and sits behind partner or customer login.
      The Mitel page states no exploitation, and CERT-FR's avis (which lists remote arbitrary code execution, confidentiality and security-policy-bypass risks) adds none. CERT-FR's affected-version wording ('8.0.0.33 postérieures à 8.2.1.0.14 et antérieures aux correctifs') reads inverted next to Mitel's table; Mitel's range is the authority.
      Context for the main agent: this is the second MX-ONE authentication-bypass advisory in a year (MISA-2025-0009, CVE-2025-67822, Provisioning Manager, also Critical, listed on the same Mitel index) and part of a dense 2026 Mitel stream (MiCollab MISA-2026-0002/0005/0006 critical, OpenScape MISA-2026-0009 high); the store covers Mitel MiCollab (2026-07-24) and the Brotli row (2026-11-07) but no MX-ONE.
