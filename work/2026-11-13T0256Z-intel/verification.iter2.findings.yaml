  item: "Citrix NetScaler ADC and Gateway: 28 memory-safety flaws ... (claim 4565681074)"
  url_or_quote: "Seven rows (the authentication request overflow, Endpoint Analysis, a reboot loop, HTTP/2, the B64DECODE expression, credentials written to a log and an Application Firewall decompression row) carry ids that collide with unrelated products in the CVE database, one of them a Trudesk flaw in ENISA's record ([ENISA EUVD, 2026-10-15](https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-102489))"
  summary: "The cited record EUVD-2026-102489 carries only CVE-2026-111345 (Trudesk, aliases CVE-2026-111345 / GHSA-xm42-mhff-286m). The other six collisions are true but sit on records the entry does not cite: CVE-2026-111343 EUVD-2026-102487 (pig), 111344 EUVD-2026-102488 (APITable), 111346 EUVD-2026-102490 (ZenTao), 111347 EUVD-2026-102491 (go-ldap-admin), 111348 EUVD-2026-102492 (Likeshop), 111349 EUVD-2026-102493 (Craftplan), all fetched via euvdservices.enisa.europa.eu/api/search?text=<CVE>. The iteration-1 remediation narrowed only the tail clause; the sentence still asserts seven collisions on one citation. Fix: cite the other six EUVD records (add to sources[]) or reduce the sentence to the one cited record and leave the seven-row count to the sourcing_note."
