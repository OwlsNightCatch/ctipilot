    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13175 (python3 tools/fetch_source.py ncsc-csh recent 25; created 2026-11-12T15:50Z) → CERT-EU recent (cert-eu recent 10) item 2026-020, URL https://cert.europa.eu/publications/security-advisories/2026-020/ (fetched with extract: affected and fixed version table) → NCSC-NL ncsc-nl recent 20 item NCSC-2026-0491, read with ncsc-nl csaf NCSC-2026-0491 (references CTX697305, CTX697280, CTX697320) → heise drill https://www.heise.de/news/Angreifer-koennen-Citrix-NetScaler-ADC-und-NetScaler-Gateway-lahmlegen-11522940.html. The vendor bulletin CTX697305 on support.citrix.com is a JS shell on every transport tried (extract, WebFetch), and the Citrix community post on the new release programme answered 403 on every transport, so vendor wording is read only through the four documents above."
    summary: |
      On 2026-11-12 Cloud Software Group published bulletins for NetScaler ADC and Gateway fixing 28 memory flaws (heise: nine of the 28 count as critical). CERT-EU reads the bulletin as follows: CVE-2026-120868 (CVSS 9.3) is a memory overflow in core packet processing that needs no special feature and no authentication and affects every deployment, default configuration included; CVE-2026-107412 (CVSS 9.5) covers several memory overflows reachable without authentication on appliances configured as a Gateway (SSL VPN, ICA Proxy, CVPN or RDP Proxy) or as an AAA virtual server. The other flaws depend on features such as SAML, WebAuth, LDAP, Email OTP and client-certificate authentication, DNS-over-HTTPS, HTTP/2, HTTP/3 (QUIC), SMPP, RTSP, BGP routing and the Application Firewall; NCSC Switzerland also lists CVE-2026-107407 (SMPP), CVE-2026-107408 (DNS load balancing with recursive resolution), CVE-2026-107409 (DNS-over-HTTPS load balancing) and CVE-2026-107410 (NetScaler Push). CERT-EU notes that ten flaws score high on confidentiality, integrity and availability although the vendor describes the impact only as unpredictable behaviour or denial of service. Affected: 14.1 before 14.1-73.57, 13.1 before 13.1-64.39, NetScaler ADC FIPS before 14.1-73.58 FIPS, and ADC FIPS and NDcPP before 13.1-37.293; hybrid Secure Private Access environments with NetScaler instances are affected, and Citrix updates its own managed cloud services (heise, NCSC Switzerland). Citrix reports no exploitation and no public proof of concept has been confirmed (CERT-EU); NCSC Switzerland rates exploitation as unknown. NCSC-NL's advisory adds fixes for the Citrix Secure Access Client for Windows (CVE-2026-118268, per the bulletin title) and NetScaler Console (CVE-2026-120869), and says the set includes authentication bypass and privilege escalation to SYSTEM rights on a Windows system. Heise reports that Citrix announced a fixed monthly security release cycle close to Patch Tuesday, starting with this release, with out-of-band updates for active exploitation, and that some flaws were found with AI-assisted code analysis (Citrix's own post could not be read). The class matters because NetScaler Gateway and AAA servers face the internet and Citrix confirmed exploitation of two critical RCEs in its 2026-09-27 bulletin (CERT-EU advisory 2026-014); CERT-EU asks for Gateway and AAA appliances to be upgraded first.
    region_nexus: "global; internet-facing remote-access and authentication front ends used by public administrations in Europe; NCSC Switzerland published its own advisory"
