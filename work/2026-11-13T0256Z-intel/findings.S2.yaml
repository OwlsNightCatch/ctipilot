    summary: |
      The Record reported on 2026-11-09 that Mittwald CM Service, a North Rhine-Westphalian hosting provider for web agencies, disclosed on Saturday 2026-11-07 that hackers had compromised 56 customer projects after going undetected on its systems for eight days, through a flaw in the Model Context Protocol (MCP) server that lets customers connect AI assistants to its mStudio management platform; the managing director said the logs showed the attacker moved extremely fast, in some cases seconds between steps, and that it is unclear whether the flaw was in Mittwald's code or in open-source MCP libraries; the company supplied no other evidence of AI involvement. The operator's status page for 2026-11-12 says the attackers resumed attacks the night before, that it switched off the customer centre, mStudio and all SSH connections as a precaution, that the customers' websites and mailboxes stay reachable, and that the customer centre and mStudio are planned to return by 11:00 on 2026-11-13. The status page states the attackers exploited a vulnerability and compromised the company website, which was taken offline; heise reports that a tipster claimed a defacement and that the company told heise the website was taken offline by Mittwald as a precaution and was not taken over or defaced, so the two company statements disagree. Mittwald calls the attackers professional actors using automated AI systems (its own assessment). No Swiss customer or public body is mentioned. Transferable points for the constituency: an agent-integration endpoint (MCP server) operated by a hosting or SaaS supplier as an initial-access path, and supplier management planes switched off for days.
