      Likely also surfaced by the S1 vulnerability domain (CERT-EU, NCSC-NL and NCSC Switzerland are all essential records here); the main agent should merge. Prior store entries cover the earlier NetScaler SAML overflows (CVE-2026-88779 exploited, CVE-2026-107406) and the PHP2Shell management-GUI fixes; this release is a separate set of CVEs, so the new entry should reference them rather than update them. Exposure check hooks from the sources: which appliances are configured as Gateway or AAA virtual servers, and the running build against the fixed builds above. The vendor bulletin text itself was not readable; CVSS values come from CERT-EU and heise, not from the vendor page.

