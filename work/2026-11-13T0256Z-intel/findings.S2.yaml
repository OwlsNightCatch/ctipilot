  - title: "Citrix NetScaler ADC and Gateway: 28 memory flaws fixed on 2026-11-12, among them CVE-2026-120868 (CVSS 9.3) in core packet processing in every deployment and CVE-2026-107412 (CVSS 9.5) reachable without authentication on Gateway and AAA virtual servers; no exploitation reported"
    sources:
