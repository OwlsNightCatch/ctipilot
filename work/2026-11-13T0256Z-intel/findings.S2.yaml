    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed item 2026-11-12T15:19Z) → drilled with extract https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html → primary report: Spiegel, URL https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b (only the lead is readable, S+). Swiss background found by WebSearch (Schweiz Pager Alarmierung Feuerwehr Rettungsdienst POCSAG unverschlüsselt ...) → https://www.beobachter.ch/burger-verwaltung/datenschutz-sensible-notrufdaten-im-netz (read via the reader transport; published 2018-08-28). Further WebSearch for a third Saxony outlet found none."
    summary: |
      Spiegel reported on 2026-11-11 that unauthorised persons have for years been able to read, in a social network, the emergency messages sent to mobile pagers of fire brigades, rescue services and civil protection in Saxony; according to its lead, the messages contained diagnoses, names and addresses of patients, hundreds flow in per day, and the area named is mainly greater Leipzig, the district of Zwickau, the Vogtlandkreis and the Erzgebirgskreis. heise online, citing Spiegel, adds that the units apparently use the POCSAG radio protocol, which has no encryption of its own and needs it added on top, and that Spiegel says the Saxon networks use IDEA from 1990, regarded as outdated for its 64-bit block size; per the informant, the keys are available in online forums (a claim, relayed by Spiegel). The informant told the Saxon interior ministry and the LKA at the end of October and went to the media after getting no answer. The LKA Sachsen cybercrime contact point told heise on 2026-11-12 that it learned of the incident on 2026-10-31 and opened investigations immediately, and gave no figures; the number of people affected and the volume of data are unknown. Some rescue services have already reacted: the Rettungszweckverband Südwestsachsen now sends operation information without patient names and house numbers (Spiegel, via heise). How the messages reach the social network (passive radio reception versus an insider or gateway leak) is not stated by either source.
      Swiss background, not a new Swiss case: Beobachter reported in 2018 that ambulance and fire services across Switzerland sent pager messages unencrypted, and that a freely accessible website then showed current pager messages with patient names and addresses. No source read for this finding describes the current Swiss practice.
    region_nexus: "Germany (neighbouring state); transferable to Swiss blue-light organisations that alert by pager; no Swiss case reported by these sources"
