      - { url: "https://www.cyberattaque.org/ministere-des-affaires-etrangeres-une-cyberattaque-expose-les-donnees-personnelles-dagents-et-dusagers/", publisher: "Cyberattaque.org (press reading of the report, foreign ministry portal)", date: "2026-11-12", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/cti/feed/ (feed recipe from the record note; item CERTFR-2026-CTI-010 dated 2026-11-12) → primary: https://www.cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-010/ (page carries only the intro) → report PDF https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf read with fetch_source.py pdf (9 pages, text extracted). Cross-read: cyberattaque.org (cyberattaque.org feed, record cyberattaque-org) press articles of 2026-11-12 on the education and foreign-ministry parts. WebSearch (REACTIV octobre 2026 ...) found no other outlet yet."
    summary: |
      ANSSI/CERT-FR's second REACTIV situation report (CERTFR-2026-CTI-010, published 2026-11-12, covering October) says 64 new data breaches were reported to the agency since the first report of 2026-09-30, five of them at ministries or bodies under their supervision, and notes a significant fall in breaches detected or claimed at ministry level. ANSSI states that every breach exploits weaknesses already listed in September (missing or weak MFA, subcontracting and supply chain, accounts compromised through infostealers, IDOR flaws, development and configuration defects) and that the new cases showed no other weakness. The recurring technique it names is the reuse of stolen secrets to log in to ministry applications and extract the data they host through legitimate access; the first containment step it gives is to renew compromised or suspected authentication secrets, followed by systematic strong authentication, strict control of privileged accounts and tighter access filtering against exfiltration.
      Incident updates in the report: the education ministry reported incidents at 25 of 30 académies between July and September, with an iterative method (valid credentials, privileged accounts, new accesses, exfiltration of directories, application databases and mailboxes, and lateral movement towards other entities over the interministerial state network RIE), and no new breach since the September report. The foreign ministry's library portal was entered on 2026-10-20 with technical accounts stolen earlier from a compromised server (about 100 users' data accessed, privilege-escalation attempts blocked). The biodiversity office's hunting-licence portal exposed data of more than 1,000 people, minors included, through an IDOR on its payment API on 2026-10-04. At France Travail a sale of data of more than 60,000 agents and professionals was claimed on a criminal forum on 2026-10-08; the report states that the compromise of an agent account, with the second factor (SMS) validated, allowed the exfiltration on 2026-09-26. The family-allowance funds' VACAF platform lost about 1.2 million files between 2026-10-08 and 10-10 to partner-account credentials from infostealers without 2FA combined with an IDOR URL exposing dossier identifiers; the service is offline until a penetration test and 2FA are in place. At the agriculture ministry, VPN certificates identified as compromised after a marker share gave no access because MFA stopped the login. The agency for services and payment saw its DEFI portal compromised on 2026-09-30 through a spoofed account and a vulnerability (30,500 users notified), after PROFIL and PUMA in August. ANSSI says the figures are provisional and that the investigations are closely coordinated with the judicial inquiries. The report is the French national authority's account of root causes behind a wave of breaches at public bodies; the same weaknesses (partner and supplier accounts without MFA, infostealer credentials, IDOR in citizen portals, SMS as the only second factor) are the ones to check in cantonal and communal portals and supplier chains.
    region_nexus: "France (neighbouring state); the root causes are transferable to Swiss federal, cantonal and communal portals and supplier chains"
