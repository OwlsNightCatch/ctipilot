      Exposure/triage hooks the sources support: the exposure class is any alerting chain that puts personal or health data in POCSAG text and relies on no encryption or on a weak, shared-key scheme; the one mitigation named by a source is payload minimisation (operation location and type without names and house numbers). Passive reception leaves no victim-side telemetry, so the exposure becomes visible only when someone republishes the content (inference from the mechanism, not stated by the sources). The Beobachter background is dated 2018 and must be framed as such; whether Swiss cantonal dispatch centres still send names or diagnoses over pager is not established by anything read here. Spiegel is paywalled (S+); only the lead and the heise relay were read.

