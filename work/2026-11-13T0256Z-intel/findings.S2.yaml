    discovery_trace: "first seen at: srf-news RSS probe (python3 tools/fetch_source.py feed https://www.srf.ch/news/bnf/rss/1646 12; item 2026-11-13T00:39Z), URL https://www.srf.ch/news/wirtschaft/software-riese-microsoft-stundenlanger-ausfall-beeintraechtigt-outlook-und-teams → WebSearch (Microsoft 365 Störung Outlook Teams Copilot ...) found no dated outlet → BleepingComputer feed (item 2026-11-12T20:15Z) URL https://www.bleepingcomputer.com/news/microsoft/massive-microsoft-365-outage-disrupts-outlook-teams-copilot-worldwide/ (quotes the admin-center advisory MO1550821). The Microsoft admin-center advisory and Microsoft's status posts are not public pages and the status posts are on X, so Microsoft's wording is read only through the two outlets."
    summary: |
      BleepingComputer reports that a Microsoft 365 incident tracked as MO1550821 began on 2026-11-12 at 13:26 ET (18:26 UTC): customers may be unable to connect to Exchange Online, Microsoft Teams, SharePoint Online, Microsoft 365 Copilot and Microsoft Defender XDR, and users in any region can be affected. Microsoft first blamed elevated infrastructure load, then said the load came not from more traffic but from a number of servers unexpectedly unavailable, straining the rest; it paused deployments, redistributed traffic and restarted servers, later said recovery efforts had not given the expected relief because a core process on affected servers was becoming overwhelmed and capacity was lost, and was checking whether reverting a small number of recent configuration updates would speed recovery; at 18:57 ET (23:57 UTC) it saw limited recovery. SRF reports on 2026-11-13 that Microsoft has been fighting worldwide disruptions since Thursday evening, that several hundred reports reached the Swiss disruption portal allestörungen.ch, that report numbers are falling, and that Microsoft attributes the fault to a problem during automated system checks on servers. Neither source reports an attack. The point for defenders is availability and detection coverage: Defender XDR was among the affected services, and mail and Teams are the usual incident-communication paths, so organizations running on Microsoft 365 had a window with reduced visibility and no usual out-of-band channel. The final end of the outage and any post-incident report were not available at the time of reading.
    region_nexus: "global; SRF reports several hundred reports on the Swiss disruption portal allestörungen.ch; no source states which Swiss public bodies were affected"
