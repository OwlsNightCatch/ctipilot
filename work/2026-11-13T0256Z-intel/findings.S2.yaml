  - title: "ANSSI's second REACTIV situation report: 64 new data breaches at French state services in October, all through the weaknesses of the first report, with the education ministry hit at 25 of 30 académies and reuse of stolen credentials as the recurring technique"
    sources:
      - { url: "https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf", publisher: "ANSSI / CERT-FR (CERTFR-2026-CTI-010, report PDF)", date: "2026-11-12", role: "primary" }
