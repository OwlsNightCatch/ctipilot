    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Bislang ist es den Angreifern gelungen, eine Sicherheitslücke auszunutzen und unsere Unternehmenswebseite zu kompromittieren."
        attribution: "mittwald status page"
        source_url: "https://www.mittwald-status.de/incidents/255116"
      - quote: "Zugriff auf unsere internen Systeme konnten wir bislang nicht feststellen"
        attribution: "mittwald status page"
        source_url: "https://www.mittwald-status.de/incidents/255116"
      - quote: "read access tokens belonging to customers who used it and went on to compromise"
        attribution: "webhosting.today"
        source_url: "https://webhosting.today/2026/11/09/mittwald-traces-a-breach-of-56-customer-projects-to-its-mcp-server/"
      - quote: "Mittwald provided no other evidence of AI involvement."
        attribution: "The Record"
        source_url: "https://therecord.media/cyberattack-germany-ai-mittwald"
    extended_notes: |
      Why it clears the gate: a control plane that exposes an MCP server holding customers' session tokens became the
      initial-access path into customers' hosting projects (a vendor-side AI-assistant integration as the pivot), with the
      operator's own assessment of AI-paced tooling. Telemetry hooks that follow from the stated mechanism: provider/control-plane
      audit logs for new API keys, project tokens, SSH keys and SSH users created after 2026-10-27, and for logins to the panel
      or SSH from sources that never used it before; any customer who used the MCP server since 2026-10-27 should treat the
      token as taken. The detection gap (eight days from first exploitation to detection; diversion tactics drew attention
      first) is the lesson. The second wave (2026-11-12) is described only by Mittwald's status page and heise; the company
      denies the defacement claim. Mittwald hosted-site continuity was not affected. The php2shell precautionary shutdown of all
      customer projects that heise mentions is a separate earlier event (PHP2Shell is covered by other entries).

