    discovery_trace: "first seen at: fuitesinfos, URL https://fuitesinfos.fr/articles (MEAE library-portal item citing ANSSI's 2026-11-12 'point de situation') -> pivot: cyberattaque.org, URL https://www.cyberattaque.org/education-nationale-25-academies-sur-30-visees-par-des-cyberattaques-lanssi-revele-lampleur-des-intrusions/ -> pivot: CERT-FR CTI listing, URL https://www.cert.ssi.gouv.fr/cti/ and feed https://www.cert.ssi.gouv.fr/cti/feed/ -> primary: CERTFR-2026-CTI-010 page https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-010/ and PDF https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf (read with `pdf`)"
    summary: |
      ANSSI's second situation report on its REACTIV operation (published 2026-11-12, titled "octobre 2026") says 64 new
      data breaches reached it since the first report of 2026-09-30, of which only five concern ministries or bodies under
      their authority, and that ministry-side breaches detected or claimed dropped significantly. It states that all of them
      exploit the weaknesses named in September (missing or weak MFA, subcontracting and supply chain, infostealer-compromised
      accounts, IDOR flaws, development and configuration defects) and that its investigations converge on one technique:
      stolen secrets reused to reach ministerial applications, which lets the attacker extract the hosted data "légitimement".
      ANSSI's first containment step is renewing compromised or suspected authentication secrets, followed by systematic strong
      authentication, strict control of privileged accounts and tighter filtering to stop exfiltration. Incident updates: the
      Éducation nationale reported incidents at 25 of 30 académies between July and September with an iterative attacker mode
      (valid credentials, privileged accounts, new accesses, exfiltration of directories, application databases and mailboxes,
      lateral movement to other entities over the interministerial network RIE) and no new breach since the September report;
      the foreign ministry's library portal was entered (detected 2026-10-20) through technical accounts stolen earlier from a
      compromised server, about 100 users, privilege-escalation attempts blocked; the OFB hunting-licence exam portal exposed
      more than 1,000 people, minors included, through an IDOR on its payment API on 2026-10-04 and the data was published the
      same day; France Travail data of more than 60,000 agents and professionals was offered on a forum on 2026-10-08 after an
      agent account was compromised "with validation of the second factor (SMS)" on 2026-09-26; the CAF holiday-aid platform
      VACAF lost about 1.2 million files to automated extraction on 8-10 October through partner credentials from infostealers
      without 2FA plus an IDOR URL; the ASP (payment agency) had two portals compromised in August and its trainee-pay portal
      DEFI on 2026-09-30 through a spoofed account and a vulnerability (30,500 users notified); at the agriculture ministry,
      compromised VPN certificates were stopped by multi-factor authentication. ANSSI notes its figures are provisional.
    region_nexus: "europe (France, neighbour of Switzerland); cross-border read-across for federal, cantonal and communal portals that run partner or citizen accounts"
    primary_sector_nexus: "direct (public sector: national administration portals, social-benefit platforms, education)"
    sector: "public-sector"
    cves: []
    techniques: [T1078, T1190, T1199, T1114]
