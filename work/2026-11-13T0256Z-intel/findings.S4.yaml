  - title: "ScreenConnect SCKit campaign: Blackpoint's reverse engineering (via The Record) says the toolkit includes an exploit for CVE-2026-84869 and operator-session hijacking, at odds with Huntress's RMM+ blank-key explanation; ConnectWise says RMM+ was disabled in about 400 partner environments"
    sources:
