  - title: "Fireworks AI (inference platform) breached twice in October, once through internal credentials and once through a third-party cloud provider; Notion's AI chat transcripts for its Insights feature (<1% of workspaces) were among the data, held at Fireworks despite a zero-retention commitment"
    sources:
