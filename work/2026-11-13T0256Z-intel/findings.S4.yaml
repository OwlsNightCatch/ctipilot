    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (entry 'Notion AIのチャット記録が委託先から流出した可能性' https://piyolog.hatenadiary.jp/entry/2026/11/11/125745) -> WebSearch ('Notion security incident Fireworks AI Notion AI chat records advisory November 2026') -> pivot: BleepingComputer https://www.bleepingcomputer.com/news/security/fireworks-ai-discloses-new-breach-after-cloud-provider-hack/ -> primary: Fireworks bulletins https://fireworks.ai/security/bulletins/october-2026-security-incident-update and https://fireworks.ai/security/bulletins/october-2026-security-incident; Notion https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor and https://notion.com/help/security-incident-involving-a-third-party-ai-vendor"
    summary: |
      Fireworks AI, a hosted inference and fine-tuning platform, disclosed on 2026-10-09 that on 2026-10-06 an unauthorised
      party used internal Fireworks credentials to read environment variables used in evaluation jobs in a limited number of
      customer accounts, capturing API keys and tokens stored as secrets. Its update of 2026-11-09 widens that: account and
      billing information was reached, and for a limited set of accounts secrets, datasets and incomplete model weights too;
      Fireworks says the evidence links the activity to a financially motivated cybercriminal group in the LLMjacking trade
      (selling stolen model-access tokens to illicit routing gateways) without naming it. A second path: a third-party cloud
      provider that hosted Fireworks R&D machines had a security incident on 2026-10-23, and on 10-24 the unauthorised party
      used it to reach development machines and run an unauthorised workload that led to more customer data impact; Fireworks
      reports no further successful access to the customer platform as of 10-25 and says inference, its training SDK and Nexus
      (zero data retention by default) were not affected. Notion, a customer, says Fireworks told it on 2026-11-02 (a small
      synthetic dataset), 11-06 (possible customer data) and 11-08 (the final dataset), that the data held Notion AI chat
      transcripts used for its Insights feature, mostly unattributable and under 1% of workspaces, that it cut its connection
      on 11-03, revoked Notion API keys found inside affected messages on 11-11 and reported third-party API keys found in
      them to their issuers on 11-12; Notion says Fireworks had committed contractually to zero data retention but "data was
      retained from the Fireworks endpoints that we used", and that Insights was outside its own ZDR customer promise. Piyolog
      adds that Fireworks says it works with customers including Notion and Cursor (as reported, not read at the source).
