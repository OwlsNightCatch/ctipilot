        attribution: "ANSSI / CERT-FR (CERTFR-2026-CTI-010 report page)"
        source_url: "https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-010/"
      - quote: "la réutilisation de secrets volés pour accéder à des applications ministérielles"
        attribution: "ANSSI / CERT-FR (report PDF, line breaks in the extracted text)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf"
