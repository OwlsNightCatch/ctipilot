  - title: "Mittwald (German web hoster): an attacker used a flaw in the provider's own MCP server (the AI-assistant interface to its mStudio panel) to read customers' session tokens and compromise 56 hosting projects; a second attack wave on 2026-11-12 took customer centre, mStudio and SSH offline"
    sources:
