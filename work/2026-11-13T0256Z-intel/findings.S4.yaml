        attribution: "ANSSI / CERT-FR (report PDF, VACAF paragraph)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf"
      - quote: "avec validation du second facteur (SMS), du compte d’un agent"
        attribution: "ANSSI / CERT-FR (report PDF, France Travail paragraph)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf"
      - quote: "révèle que 25 des 30 académies françaises ont été visées par des incidents de sécurité entre juillet et septembre 2026"
        attribution: "Cyberattaque.org"
        source_url: "https://www.cyberattaque.org/education-nationale-25-academies-sur-30-visees-par-des-cyberattaques-lanssi-revele-lampleur-des-intrusions/"
    extended_notes: |
      Material delta over the covered entry (which describes the first report of 2026-09-30, 99 breaches since 2026-08-01):
      the second report's one-sentence technique statement, the 64 new events / 5 ministry-side drop, the new named cases
      (MEAE, OFB, France Travail, CAF VACAF, ASP) and the Éducation nationale lateral-movement-over-RIE statement. The
      France Travail case is the one to read against SMS-based second factors: ANSSI says the agent account was compromised
      with the SMS factor validated and does not say how the factor was obtained. Hunt/harden hooks that follow mechanically
      from the stated mechanisms (not from ANSSI wording): partner/service-account sign-ins without MFA from new ASNs or
      devices; application access logs showing sequential or enumerated object identifiers from one account (IDOR); mailbox
      access by accounts after a credential reset. ANSSI itself names rotation of compromised secrets, MFA, privileged-account
      control and egress filtering. Cross-reads the Swiss pension-supplier and cantonal-platform incidents already covered
      (partner credentials, IDOR-style exposure of public portals). cyberattaque.org and Fuites Infos only re-read the ANSSI
      report, so this is one source, the authority's own. Extraction caveat: the PDF text layer splits some figures across line
      breaks ("6\n4 nouvelles violations", "60\n000 agents"); the numbers above are read as 64 and 60,000 and should be
      checked against the PDF rendering before composing.

