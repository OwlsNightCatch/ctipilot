    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'Angriff über MCP-Server: Webhoster Mittwald im Krisenmodus') -> pivot: heise article https://www.heise.de/news/Angriff-ueber-MCP-Server-Webhoster-Mittwald-im-Krisenmodus-11522728.html -> primary: Mittwald status page https://www.mittwald-status.de/incidents/255116; WebSearch ('Mittwald MCP-Server Cyberangriff 5. November Sicherheitsvorfall Hoster Kunden betroffen') -> The Record https://therecord.media/cyberattack-germany-ai-mittwald and webhosting.today https://webhosting.today/2026/11/09/mittwald-traces-a-breach-of-56-customer-projects-to-its-mcp-server/ (Mittwald's own blog post of 2026-11-07 returned 404 on 2026-11-13: https://www.mittwald.de/blog/mittwald/sicherheitsvorfall-am-mcp-server)"
    summary: |
      Mittwald, a North Rhine-Westphalian hosting provider for web agencies, said in a blog post on 2026-11-07 (now offline;
      reported by The Record and webhosting.today) that an attacker exploited a flaw in its Model Context Protocol (MCP) server,
      the interface that lets customers connect AI assistants to its mStudio management platform, on 2026-10-27, read the
      access tokens of customers who used it and went on to compromise 56 customer projects. Per Mittwald's timeline the
      attacker first tested the flaw on 2026-10-21, moved around as an ordinary customer from 10-23 (test accounts, extensions,
      simple injection attempts), exploited the flaw five minutes after registering another account on 10-27, and was detected
      only on 2026-11-04. The company says the attacker read session tokens, not passwords, that logs show steps seconds apart
      which it reads as AI tooling (The Record: no other evidence of AI involvement was offered, and it is unclear whether the
      flaw lies in Mittwald's code or in open-source MCP libraries), and that customers who never used the MCP server are not
      affected. The MCP server stays offline. On 2026-11-12 Mittwald's status page reported renewed attacks: attackers
      exploited a security hole to compromise the company website (taken offline; Mittwald denies a tipster's defacement
      claim), and as a precaution the customer centre, mStudio and all SSH connections were switched off; hosted websites and
      mailboxes stay reachable, no access to internal systems has been established, and reopening was targeted for 2026-11-13
      11:00. Guidance to affected customers: change the mStudio password and enable 2FA, review API keys, project tokens, SSH
      keys and SSH users, renew credentials for third-party services stored in the projects and inform the project's other users.
    region_nexus: "germany (NRW); DACH hosting supplier class — whether Swiss or other public bodies' sites sit at Mittwald is not established by the sources"
    primary_sector_nexus: "indirect (hosting supplier to web agencies; public-sector sites built by agencies are plausible customers but unstated)"
    sector: "technology"
    cves: []
    techniques: [T1190, T1528, T1550.001]
    affected_products: ["mittwald mStudio", "mittwald MCP server"]
    entity_keys: []
    new_entities:
