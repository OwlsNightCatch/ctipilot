  - title: "CNIL imposes ten simplified sanctions (EUR 3,000 to 20,000) on French local authorities and one public body for cybersecurity failings: no admin MFA, permanent and shared-account vendor access, weak logging, flat networks, unsupported server operating systems"
    sources:
      - { url: "https://cnil.fr/fr/node/169128", publisher: "CNIL (communiqué, resolves to https://cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/", publisher: "ZATAZ", date: "2026-11-09", role: "corroborating" }
    discovery_trace: "first seen at: zataz, URL https://www.zataz.com/feed/ (item 'Cybersécurité : la CNIL sanctionne dix collectivités') -> pivot: ZATAZ article https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/ -> WebSearch ('CNIL sanctions dix collectivités cybersécurité procédure simplifiée amendes communiqué cnil.fr novembre 2026') -> primary: CNIL https://cnil.fr/fr/node/169128"
    summary: |
      On 2026-11-09 the CNIL announced ten simplified-procedure sanctions against local authorities (communes, departments,
      regions) and one public body, fines from EUR 3,000 to 20,000 (the legal maximum for that procedure), the outcome of its
      2025 control theme on local-authority cybersecurity, which also looked at their service providers. The Article 32 GDPR
      failings it lists: remote authentication (notably teleworking) not robust enough for privileged users, with no
      multi-factor authentication for administrators; vendors such as software publishers able to reach the authority's network
      permanently rather than case by case, or through accounts shared among several employees; ineffective anomaly detection
      (incomplete logging, or no real-time or short-term review of logs); insufficient network segmentation that could spread a
      breach across segments; servers on operating systems no longer maintained by their publisher; weak passwords, sent in clear
      to users or stored insecurely. Some inspected authorities had already suffered breaches that adequate measures could have
      prevented. Several decisions also fault the absence of a security accreditation (homologation) required by the French
      RGS before putting citizen-facing systems into service, and the absence of a data-protection impact assessment for school
      and holiday-activity portals for parents and for public-road video surveillance. The CNIL says more procedures are open
      and ties this to the coming NIS2 obligations for local authorities.
    region_nexus: "france (GDPR / Informatique et Libertés); the failings are a benchmark list for Swiss cantonal and communal administrations, which are not under the GDPR"
    primary_sector_nexus: "direct (public-sector: communes, departments, regions and their IT suppliers)"
    sector: "public-sector"
