      - { url: "https://www.huntress.com/blog/sckit-worm-rogue-screenconnect", publisher: "Huntress (updated 2026-11-11 23:34 ET)", date: "2026-11-12", role: "corroborating" }
    discovery_trace: "first seen at: therecord feed, URL https://therecord.media/feed (item 'ConnectWise investigates ScreenConnect breaches after reports of incidents at nearly 50 organizations') -> pivot: The Record article https://therecord.media/connectwise-screenconnect-breaches-third-party-tool -> pivot: Huntress blog https://www.huntress.com/blog/sckit-worm-rogue-screenconnect (update paragraph); WebSearch for a Blackpoint primary ('Blackpoint Cyber ScreenConnect CVE-2026-84869 toolkit reverse engineered operator session hijack November 2026') found none, so the Blackpoint statement rests on The Record alone"
    summary: |
      Since the covered entry (Huntress: Run Command pushed a rogue second client and SCKit to 288+ endpoints at 48
      organisations on 2026-11-11, RMM+ 1.0.31/1.0.32 accepting a blank access key), The Record reports two further points.
      ConnectWise says it identified about 400 partner environments with at least one RMM+-family extension, that presence alone
      does not establish compromise, that the extensions expose an API able to execute remote commands protected only by a
      passphrase the partner sets, that it disabled RMM+ in those environments and asks on-premises customers to disable it
      themselves, that threat actors deployed additional remote-access software and that technician workstations may have been
      compromised during interactive connections; it adds that disabling extensions and resetting credentials alone may not
      remove software, persistence or access already established. Blackpoint Cyber, per The Record, reverse engineered the
      toolkit, says it exploits CVE-2026-84869 (the file-transfer flaw CISA listed as exploited in September) and also hijacks
      authenticated operator sessions to push code through legitimate ScreenConnect features, and that a fully patched client
      blocked the exploit, so those hit were likely unpatched. That is a different explanation from Huntress's RMM+ blank-key
      finding and from the Huntress spokesperson's earlier line that it saw no new vulnerability and suspected stolen credentials
      or hijacked operator sessions; the initial-access vector is therefore still not settled in the sources.
