  - title: "Saxony: alert messages to fire, rescue and civil-protection pagers, carrying patient names, addresses and diagnoses, have for years been readable and posted on a social network; LKA Saxony investigates (Spiegel, heise)"
    sources:
      - { url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html", publisher: "heise online", date: "2026-11-12", role: "primary" }
      - { url: "https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b", publisher: "DER SPIEGEL (S+, paywalled; standfirst only read)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268", publisher: "Beobachter (2018 background on unencrypted Swiss pager alerts)", date: "2018-08-28", role: "background" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'Pager-Panne in Sachsen') -> pivot: heise article https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html -> primary (original report): Spiegel https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b (paywalled); Swiss context via WebSearch ('Notrufdaten Pager Sachsen Telegram Mastodon ...') -> Beobachter https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268"
    summary: |
      Spiegel reported on 2026-11-11 (heise followed on 11-12 with its own question to the Saxon LKA) that unauthorised people
      have for several years been able to read, in a social network, the alert messages sent to the pagers of fire services,
      rescue services and civil protection in Saxony, hundreds a day, mainly the Leipzig area, the districts of Zwickau, the
      Vogtland and the Erzgebirge; per Spiegel the messages contained diagnoses and the names and addresses of patients. The
      pagers use the POCSAG radio protocol, which has no encryption of its own and needs it added; according to Spiegel the
      Saxon networks use IDEA (1990, 64-bit block size, regarded as obsolete) and, per the informant, the keys are available in
      online forums. The informant told the Saxon interior ministry and the LKA at the end of October, got no reply and went to
      the press; the LKA's cybercrime contact point says it learned of the incident on 2026-10-31, opened investigations at
      once, and gives no number of people affected or data lost. The Rettungszweckverband Südwestsachsen now sends operational
      information without patient names and house numbers (Spiegel via heise). How the messages are captured and published is
      not described beyond radio reception; the interior ministry's position is not in the sources read. Background, not a
      current statement: in 2018 Beobachter reported that fire and rescue pagers across Switzerland were unencrypted, with
      Schutz & Rettung Zürich encrypting only the path to the transmitter and planning full encryption by 2019; no source read
      says what the Swiss position is today.
    region_nexus: "germany (Saxony); transferable to Swiss cantonal alerting (pager, POCSAG) — Swiss status today not established by sources"
    primary_sector_nexus: "direct (emergency services: fire, rescue, civil protection)"
    sector: "public-sector"
    cves: []
    techniques: [T1040]
    affected_products: ["POCSAG pager alerting (Saxon fire, rescue and civil-protection networks)"]
    entity_keys: []
    new_entities:
      - { key: "incident:saxony-pager-alert-patient-data-exposure-2026-11", type: incident, name: "Saxony emergency-service pager alert exposure (November 2026)", aliases: ["Pager-Panne in Sachsen"], summary: "Reported by Spiegel on 2026-11-11 and heise on 2026-11-12: alert messages to Saxon fire, rescue and civil-protection pagers, with patient diagnoses, names and addresses, readable and posted on a social network for years; LKA Saxony investigating since 2026-10-31." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Unbefugte konnten offenbar jahrelang Funkmeldungen sächsischer Rettungsdienste und Feuerwehren mitlesen. Nach SPIEGEL-Informationen enthielten sie Diagnosen, Namen und Adressen von Patienten. Das LKA ermittelt."
        attribution: "DER SPIEGEL"
        source_url: "https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b"
      - quote: "können Unbefugte seit einigen Jahren in einem sozialen Netzwerk mitlesen, welche Notfallmeldungen an mobile Pager der Feuerwehren, Rettungsdienste und des Katastrophenschutzes geschickt werden."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"
      - quote: "Eine Verschlüsselung sieht das Protokoll selbst aber nicht vor."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"
      - quote: "dass man am 31. Oktober von dem Vorfall erfahren habe"
        attribution: "heise online (LKA Sachsen ZAC statement)"
        source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"
    extended_notes: |
      Exposure question for a defender: which alerting chain does each fire/EMS/civil-protection body use (POCSAG pagers,
      alerting gateway, dispatch-centre text fields), is any of it encrypted end to end, and what free-text fields (patient
      name, house number, diagnosis) go into the message. The sources name no vendor, product or CVE. Mitigation visible in
      the story: strip patient names and house numbers from the pager text (Rettungszweckverband Südwestsachsen). Detection
      is by definition outside the network: the data is captured by radio reception, so the only checks are
      what the message contains and whether the transmission is encrypted with a current cipher; a public search of the open
      web/social platforms for the dispatch centre's own message patterns is what the informant effectively did. ATT&CK
      T1040 is the closest-fit mapping (passive interception), the matrix has no radio-specific technique. An earlier covered
      analogue is the NHS Blood and Transplant unencrypted pager entry (2026-08-15/nhsbt-transplant-data-unencrypted-pager-network,
      registry incident:nhs-blood-transplant-pager-breach-2026-08): suggest it in references[]. Single original reporter (Spiegel,
      paywalled, informant-based); heise adds the LKA's own confirmation that it is investigating, not confirmation of content.

