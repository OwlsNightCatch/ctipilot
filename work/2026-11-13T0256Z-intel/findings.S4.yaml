  - title: "ANSSI's second REACTIV situation report (CERTFR-2026-CTI-010, 2026-11-12): 64 new state data breaches since 30 September, one recurring technique (reuse of stolen secrets), and new cases at the foreign ministry, OFB, France Travail, the CAF and the ASP"
