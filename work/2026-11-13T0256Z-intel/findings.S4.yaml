        attribution: "CNIL"
        source_url: "https://cnil.fr/fr/node/169128"
      - quote: "certains prestataires extérieurs (par exemple, des éditeurs de logiciels) pouvaient accéder au réseau des collectivités de manière permanente, sans y être autorisés au cas par cas, ou via des comptes partagés entre plusieurs salariés"
        attribution: "CNIL"
