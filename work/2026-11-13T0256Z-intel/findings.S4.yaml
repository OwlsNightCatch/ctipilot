    discovery_trace: "first seen at: therecord, URL https://therecord.media/feed (item 'Feds announce seizure of $1.2 billion from Binance theft; also takedown of FaceStealer tools') -> primary attempt: WebSearch ('FaceStealer North Korea DOJ FBI disrupt cloud infrastructure $400 million Zoom Teams deepfake justice.gov' and '\"FaceStealer\" North Korea FBI') found no FBI or DOJ document -> The Record article https://therecord.media/stolen-binance-crypto-recovered-doj-facestealer-disrupted (reports a DOJ/FBI announcement and press call)"
    summary: |
      The Record reports that the FBI and Justice Department, on a press call this week, said they disrupted cloud infrastructure
      North Korean hackers used for a social-engineering scheme called "FaceStealer", which they say stole more than USD 400
      million in cryptocurrency over 18 months, and obtained a warrant to seize more than 900 webcam videos of victims. Per the
      FBI and DOJ, the attackers send Calendly invitations to Zoom or Teams meetings from accounts stolen from earlier
      victims; the links lead to fake domains with malware, sometimes compromising the target before the meeting; in the
      meeting, pre-recorded videos of past victims make it look crowded, the target's webcam is recorded for use against their
      contacts, AI deepfakes of known crypto figures were used in some cases, and a fake technical error (for example "you
      cannot be heard") offers a "fix" that installs a browser cookie harvester, keyloggers, screen capturers and a backdoor.
      Victim accounts on Telegram, LinkedIn, Slack and Discord are hijacked to approach their contacts, sometimes months
      later. The scheme targets the cryptocurrency industry and open-source developers; the FBI cites attempts against maintainers on npm and Rust crates and a near
      miss against a maintainer of a significant JavaScript library. An FBI agent told The Record it is unclear whether
      FaceStealer was used in the Binance theft; the same announcement says the DOJ obtained authorisation to seize or restrain
      more than USD 1.2 billion of the Binance proceeds (part of USD 2.7 billion frozen) and Binance and the FBI attribute that
      theft to TraderTraitor.
