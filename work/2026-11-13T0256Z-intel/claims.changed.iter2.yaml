    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "summary"
    kind: frontmatter
    text: "The Apache HTTP Server project released 2.4.71 on 2026-11-11 to fix CVE-2026-119618, a race in mod_http2 that it rates critical and says can lead to remote code execution in versions 2.4.55 through 2.4.70; Red Hat adds that it is unauthenticated, affects only servers with HTTP/2 enabled through the Protocols directive, and that public research has demonstrated a reliable exploit, while no source reports exploitation. Red Hat has fixed RHEL 9 and 10, Debian bookworm and trixie and Alpine ship 2.4.71 packages, Ubuntu has shipped backported fixes, while a researcher's public test reproduces crashes on 2.4.70 and, per Wordfence, does not show code execution."
