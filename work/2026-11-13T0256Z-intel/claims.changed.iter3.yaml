  - claim_id: 4df4e1a6fc
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "The chain is a logic bug with no memory corruption: CLFS containers are created through Object Manager symbolic links, an oplock on a bait file confirms that Microsoft Defender has engaged, a call to Defender's signature-update RPC makes clfs.sys create its .cnpf authentication-signature file as SYSTEM at an attacker-chosen path, here hid.dll in the Common Files\\microsoft shared\\ink directory, a file that does not ship in that directory; the content is replaced with a payload DLL and a runas request makes consent.exe load it, which starts a SYSTEM conhost.exe on the user's desktop ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
  - claim_id: 9eab64e809
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: derived
    text: "**Detection:** file-creation telemetry for hid.dll in the ink directory, which Cyderes ranks highest because the file does not ship in that directory; the Defender signature-update RPC called from a process outside the Defender service tree; symbolic-link churn under \\BaseNamedObjects\\Restricted\\ correlated with Defender RPC activity; consent.exe loading a DLL from the ink directory; and a SYSTEM conhost.exe on the interactive desktop right after a hid.dll write."
