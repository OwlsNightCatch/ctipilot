  - claim_id: 38b1e7cd82
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-11-09 says Apache Axis, which Confluence uses for its XML-RPC and SOAP APIs, has a critical remote-code-execution flaw (CVE-2026-90436, CVSS 4.0 9.3, no privileges or user interaction), exploitable in Confluence Data Center 1.x to 9.x only when the Remote API setting is enabled, which it is not by default. The fix is 9.2.28; the workaround is to clear the Remote API checkbox without a restart; Atlassian cannot confirm whether instances were affected and asks teams to check them; no source reports exploitation of Confluence, but the same flaw is exploited against N-able N-central servers that embed Axis."
  - claim_id: b00946a27d
    entry: 2026-11-11/confluence-dc-cve-2026-90436-apache-axis-remote-api-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** a Data Center instance on any 9.x or earlier release, with 9.2.28 the only fixed version listed, whose Remote API (XML-RPC & SOAP) setting is ticked; the setting sits under General Configuration, Further Configuration."
