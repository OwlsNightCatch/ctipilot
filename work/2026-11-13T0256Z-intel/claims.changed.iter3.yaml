    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.8 (CVSS 3.1, Siemens)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\", \"no-patch\"], \"affected\": \"Siemens Desigo CC V8 and V9, all versions; Siemens SIMATIC WinCC V7/V8, WinCC Unified (PC Runtime, for Industrial Edge, SIQENCE), WinCC Runtime Professional, WinCC Companion, WinCC OA V3.20 below V3.20 P17.1 and V3.21, User Management Component, TIA Administrator, BRAUMAT and SISTAR V8.2 Update 1 to below Update 5, COMOS Walkinside, Project Server Web Administration Tool and the SIMATIC Profiling Tool, and Teamcenter V2412 to V2606, the Opcenter family, Process Preparation X, HyperLynx, PADS and Xpedition products, Innexis Architecture Native Acceleration 2026, Insights Hub, PAVE360 Automotive 2026 and Simcenter Executable Digital Twin and Studio, all versions unless a bound is given (Siemens lists Polarion and seven other software products as not affected); Siemens Gridscale X DSA V5.3 up to but excluding V5.4 and Gridscale X PSS®E below V36.8.0; Industrial Edge Management Applications, Common Configurator and the configurator applications below their fixed versions; Mitel MiVoice Business 10.6.0.7 and earlier, MiVoice Business Solution Virtual Instance up to the build Mitel lists, OpenScape SBC V11R3.4.4 and earlier, OpenScape SESAP V2 R1.1.9 and earlier, OpenScape Contact Center V12R0 to V12R0FR7, OpenScape Xpert V9 R0.2.0 and earlier, OpenScape Endpoint Management V1 R2.5.1 and earlier; Cisco Duo Network Gateway and RoomOS, which Cisco's combined advisory lists in a table with no per-CVE column, below the builds it lists; Apple iOS and iPadOS, macOS, watchOS, visionOS and HomeView Software releases before the versions below\", \"fixed\": \"Desigo CC: latest .NET security updates via Windows Update; WinCC OA V3.20 P17.1, BRAUMAT and SISTAR V8.2 Update 5, no fix planned for the SIMATIC Profiling Tool and no fix available for the other products added on 2026-11-10 (SSA-242944 pr