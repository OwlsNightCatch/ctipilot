  - claim_id: 9d18f607b3
    entry: 2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix
    surface: "summary"
    kind: frontmatter
    text: "Microsoft released .NET 8.0.33, 9.0.22, 10.0.14 and 11 Release Candidate 3 out of band on 2026-10-25 to fix the Brotli decoder flaw CVE-2026-111497 (CVSS 3.1 8.1, publicly disclosed, rated Exploitation More Likely) and to deliver the corrected fixes for CVE-2026-70197 (Windows sockets memory corruption, CVSS 3.1 8.1) and CVE-2026-102870 (Blazor debugger), which the 2026-10-13 release did not fully address. Brotli exposure needs an application that decompresses attacker-controlled Brotli data, which ASP.NET Core and HttpClient do not do by default; CISA lists CVE-2026-111497 as exploited since 2026-10-27, although Microsoft's record still said not exploited on 2026-10-25 and no source reports an attack on .NET. Microsoft's record, revised on 2026-11-12, also lists Windows 10, Windows 11 and Windows Server 2019 to 2025 as affected, with the November 2026 cumulative updates as the fix."
  - claim_id: 2e6ba5a49d
    entry: 2026-10-26/cve-2026-111497-microsoft-net-oob-update-brotli-sockets-fix
    surface: "actions[0]"
    kind: frontmatter
    text: "Install .NET 8.0.33, 9.0.22 or 10.0.14 (11 Release Candidate 3 for the preview) on every host that runs .NET applications, including Windows hosts already updated on 2026-10-13, which still carry CVE-2026-70197; rebuild and republish self-contained applications and rebuild container images from the updated .NET images, because a runtime update on the host does not change a bundled runtime; install the November 2026 Windows cumulative update of each branch (KB5131096, KB5131085, KB5131090, KB5131080, KB5131087, KB5132061 or KB5132059) on every Windows endpoint and server, because Microsoft's record now lists Windows as affected and CISA lists the flaw as exploited."
