    text: "Group-IB: DarkLunnen's FortiOS chain leaves a 'service' super_admin; Swiss FortiGates are scan targets only"
  - claim_id: 6d8d1eb673
    entry: 2026-11-13/darklunnen-group-ib-fortios-super-admin-swiss-scan-list
    surface: "summary"
    kind: frontmatter
    text: "Group-IB found an open directory on a Latvian server that documents more than 14 months of operations against Europe by an operator it tracks as DarkLunnen and links to no known actor: a modified public exploit for FortiOS CVE-2024-55591 that creates an administrator named service with super_admin privileges, among other tools. Group-IB recovered a list of 4,725 Swiss FortiGate scanning targets, which it says does not confirm vulnerability or exploitation, and restic commands that accessed an S3 backup repository at a Swiss domain in May and June 2025, without naming an organisation or confirming success."
  - claim_id: d408955108
    entry: 2026-11-13/darklunnen-group-ib-fortios-super-admin-swiss-scan-list
    surface: "actions[0]"
    kind: frontmatter
    text: "On every FortiGate on FortiOS 7.0 below 7.0.17 (and FortiProxy 7.2 below 7.2.13 or 7.0 below 7.0.20) take the HTTP/HTTPS administrative interface off internet-facing interfaces, and on any unit whose interface was ever reachable list the administrators for an account named service or any unexplained super_admin account and review jsconsole logins; where one is found rotate every secret stored in the configuration, because a patch does not remove an account that already exists."
  - claim_id: 33e8728583
    entry: 2026-11-13/darklunnen-group-ib-fortios-super-admin-swiss-scan-list
    surface: "body"
    kind: cited
    text: "Group-IB reports that in late July 2026 it found an open directory on a Latvian server that held the operator's /root/ directory, 457 files of which 35 were recovered, and documents more than 14 months of operations against Europe by an operator it tracks as DarkLunnen; Group-IB links it to no known actor and does not establish nationality or state affiliation ("
    urls: ["https://www.group-ib.com/blog/offensive-cyber-operations-europe/"]
  - claim_id: f9d32d2e96
