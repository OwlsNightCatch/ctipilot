    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "summary"
    kind: frontmatter
    text: "Between 2026-10-27 and 2026-11-10 Siemens, Mitel and Cisco listed affected products in advisories that cover the Brotli decoder flaw CVE-2026-111497: Siemens names Desigo CC V8 and V9 (remedy: the latest .NET security updates), Gridscale X DSA V5.3 and Gridscale X PSS®E below V36.8.0 (fixed in V5.4 and V36.8.0), Industrial Edge, where Common Configurator has no fix, and, in two interim advisories of 2026-11-10, 15 industrial products including SIMATIC WinCC V7/V8, WinCC Unified, the User Management Component and TIA Administrator and 28 software products including Teamcenter and the Opcenter family, nearly all with no fix; Mitel names MiVoice Business and five OpenScape products with updates planned and workaround articles for three; Cisco's combined advisory lists Duo Network Gateway (3.4.2) and RoomOS among its products with fixes, a longer list of which is dated up to 2027, without saying which of its CVEs each fix addresses. Cisco says it is not aware of malicious use against any Cisco product, and CISA lists the flaw as exploited. Apple fixed the flaw on 2026-11-09 in iOS and iPadOS 27.2.1 and 26.7.3, macOS Golden Gate 27.2.1, Tahoe 26.7.3 and Sequoia 15.8.3, watchOS 27.2.1 and visionOS 27.2.1."
