    entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
    surface: "summary"
    kind: frontmatter
    text: "Check Point Research reports that from 2026-10-30 an attacker exploited unpatched Check Point gateways through the Mobile Access portal with PHP2Shell (CVE-2026-109618 and CVE-2026-109619), escalated to root with CVE-2026-123039 (CVSS 7.8, a local flaw in the dynamic_server process that Check Point says was exploited against a couple of dozen customers), installed a backdoor that survives patching and in the first wave deleted files on a VMware ESXi host. The fix for both is in Jumbo Hotfix Accumulator R81.20 take 174, R82 take 132, R82.10 take 52 and R82.20 take 14 or later, with none listed for R81.10 or R81, and the standalone PHP hotfix is not stated to cover CVE-2026-123039; sk1000302 itself carries no statement on exploitation."
  - claim_id: 25ad0f57f2
