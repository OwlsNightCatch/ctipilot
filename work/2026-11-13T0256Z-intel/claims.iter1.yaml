    kind: cited
    text: "**Exposure:** a FortiOS 7.0 device below 7.0.17, or a FortiProxy below its fixed release, whose HTTP/HTTPS administrative interface was ever reachable from the internet; a device exposed while vulnerable can carry an account that patching does not remove ("
