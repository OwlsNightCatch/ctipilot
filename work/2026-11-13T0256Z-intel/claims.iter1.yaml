    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "headline"
    kind: frontmatter
    text: "Saxony: emergency pager messages with patient data readable in a social network for years; LKA investigates"
  - claim_id: ddf5b750ca
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "summary"
    kind: frontmatter
    text: "Spiegel and heise report that unauthorised persons have apparently for years been able to read in a social network the dispatch messages sent to pagers of fire brigades, rescue services and civil protection in Saxony, hundreds a day, which according to Spiegel contained patient diagnoses, names and addresses. The state police's cybercrime contact point learned of it on 2026-10-31 and is investigating; heise says the units apparently use POCSAG pagers, which have no encryption of their own, and no source says how the messages reached the social network."
  - claim_id: 6e03bd718e
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: cited
    text: "Spiegel reported on 2026-11-11 and heise followed on 2026-11-12 that unauthorised persons have apparently for years been able to read in a social network the dispatch messages sent to the mobile pagers of fire brigades, rescue services and civil protection in Saxony, hundreds a day, mainly from the Leipzig area and the districts of Zwickau, Vogtland and Erzgebirge ("
    urls: ["https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"]
  - claim_id: de8c96327c
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: cited
    text: "According to Spiegel the messages contained diagnoses, names and addresses of patients ("
    urls: ["https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b"]
  - claim_id: 2f0cf9015e
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: cited
    text: "The state police's cybercrime contact point told heise that it learned of the incident on 2026-10-31 and opened investigations immediately, and that how many people are affected and how much data has leaked is unclear (translated from German); one rescue association now sends dispatch information without patient names or house numbers ("
    urls: ["https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"]
  - claim_id: 84a9478fde
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: cited
    text: "heise says the units apparently use pagers on the POCSAG radio protocol, which provides no encryption of its own, and Spiegel says the Saxon networks use the IDEA cipher of 1990, which heise notes is regarded as outdated for its 64-bit block size, with the keys available in online forums according to an informant (translated from German); no source states how the messages reached the social network ("
    urls: ["https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"]
  - claim_id: 5aae218d40
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: cited
    text: "**Exposure:** an organisation that alerts staff by pager, where the protection depends on a cipher added to the radio link and the alert text carries patient name, address or health state; the content of the alert decides the harm, which is why one service has already removed names and house numbers ("
    urls: ["https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html"]
  - claim_id: b8bc29413c
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: derived
    text: "The sources read make no statement on Swiss emergency-service paging."
  - claim_id: 9b8921c5a9
    entry: 2026-11-13/saxony-emergency-pager-messages-readable-on-social-network
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** ask the alerting provider which cipher protects the pager traffic and what the alert texts contain, and keep patient identifiers out of the alert text."
  - claim_id: 119d6fb7e4
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "headline"
    kind: frontmatter
    text: "Huntress: device-code phishing posing as a Teams booking skips URL reputation checks; hunt Cmsi:Cmsi sign-ins"
  - claim_id: ad1b784665
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a mid-October 2026 intrusion in which a spear-phish impersonating a company executive led, through a Safe Links-wrapped Google share link that sidestepped URL reputation checks, to a fake Microsoft Teams meeting scheduler whose 'Booking Reference' is a Microsoft device code, with a phishing kit shipped as AES-256-GCM ciphertext that the browser decrypts and a fallback that restarts the device-code session when MFA is required. The account had no MFA enrolled and the captured session was replayed from a residential proxy, showing as a device-code (Cmsi:Cmsi) sign-in followed by programmatic user agents; Huntress names no victim country and no Swiss link."
  - claim_id: 4d01d3aa1a
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "In mid-October a Huntress SOC saw an employee of a construction company receive a spear-phishing email from a typosquatted domain impersonating another company's senior vice president; the link in the mail was wrapped by Microsoft Safe Links and pointed to a Google share link that redirected server-side to the lure page, so the mail body held the Google link and not the lure domain, which Huntress says sidestepped URL reputation checks for email security ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: dd887f391d
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "The page posed as a Microsoft Teams meeting scheduler, and behind it the backend started a Microsoft device-code sign-in; the \"Booking Reference\" shown to the victim is the device code, which the victim enters in a genuine Microsoft sign-in window ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: d60e46d8cd
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "The kit is shipped as AES-256-GCM ciphertext that the browser decrypts, so that to an email scanner or crawler that does not run JavaScript the page is an encrypted blob; if Microsoft answers AADSTS50076 or interaction_required because MFA is required, the kit starts a new device-code session and restarts the flow ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: ca68dee4c0
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "After the victim finished, the attacker held a session token and the device-code login (Cmsi:Cmsi) was routed through a residential proxy; the compromised account had no MFA enrolled and was used from an unmanaged device, and Huntress saw no post-compromise activity ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: 91fcdc0711
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "**Detection:** in Entra sign-in logs, a successful device-code authentication shown as Cmsi:Cmsi, programmatic user agents such as python-requests and node afterwards (often only in the non-interactive log), and a change of ASN and region inside the same session ID; in mail and proxy telemetry, a Google share link that redirects to a freshly registered lookalike domain ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: e3711765dd
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
    kind: cited
    text: "**Triage:** Huntress treats a device-code prompt that follows a link, a booking request or another unexpected interaction as suspicious, and the captured session shows up as a replay from another ASN and region within one session ("
    urls: ["https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing"]
  - claim_id: 123847149a
    entry: 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
    surface: "body"
