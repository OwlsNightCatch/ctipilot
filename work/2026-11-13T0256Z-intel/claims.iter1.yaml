    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "headline"
    kind: frontmatter
    text: "ScreenConnect: rogue clients on 288+ endpoints; RMM+ extension CVE-2026-127063 has no fix, disable it"
  - claim_id: e23680af84
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "summary"
    kind: frontmatter
    text: "Huntress saw an operator use access to several cloud-hosted ScreenConnect panels on 2026-11-11 to run Run Command as SYSTEM on groups of managed endpoints, installing an attacker-controlled second ScreenConnect client and the SCKit toolkit on at least 288 hosts at 48 organisations within 90 minutes; Sophos independently saw the same client deployments. Huntress later said the activity seems related to the third-party RMM+ extension, whose versions 1.0.31 and 1.0.32 accepted a blank access key; ConnectWise's CNA record CVE-2026-127063 (CVSS 4.0 9.3) says the extension uses a static API secret by default, names no fix and gives disabling as the mitigation, while a Huntress spokesperson says the panel-access vector is still unclear and Blackpoint calls the extensions' role unresolved."
  - claim_id: b65619515e
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ScreenConnect instance your organisation or its IT providers run, disable the RMM+ extension immediately, verify it stays disabled and do not re-enable or reinstall it (on-premises instances by hand; ConnectWise removed it from cloud-hosted ones), review Run Command and Toolbox history and the instance audit logs for executions nobody started, including before 2026-11-11, and check managed endpoints for a second ScreenConnect client service; open no interactive session to a suspect host, use EDR live response or WinRM, because a session can trigger the toolkit to spread to the technician's workstation."
  - claim_id: 09473488cd
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "cves[CVE-2026-127063]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-127063\", \"cvss\": \"9.3 (CVSS 4.0, ConnectWise as CNA)\", \"status\": [\"no-patch\", \"mitigation-only\"], \"affected\": \"DataComm RMM+ extension for ConnectWise ScreenConnect, all versions that keep the default API secret (Huntress: versions 1.0.31 and 1.0.32 with a blank key); the ScreenConnect server and client are not affected\", \"fixed\": \"none announced; ConnectWise disabled and removed the extension from cloud-hosted instances; on-premises: disable it immediately, verify it stays disabled, do not re-enable or reinstall\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4d9aac4e4d
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "On 2026-11-11 Huntress observed an operator using access to several cloud-hosted ScreenConnect panels to run commands as SYSTEM on groups of managed endpoints through the Run Command feature, hitting at least 288 hosts at 48 organisations that use Huntress within 90 minutes ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 925858725e
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Each host checked for a ScreenConnect client, silently installed an attacker-controlled one, wrote a dropper and fetched SCKit, a 16-file toolkit delivered encrypted whose decryption values the server issues against the requesting machine's UUID ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
