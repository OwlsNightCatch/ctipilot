    text: "On every gateway that ran Mobile Access, SSL Network Extender, SAML-realm VPN, the captive portal, UserCheck or Zero Phishing before the hotfix, search /var/log/dynamicCli.log for commands that do not use the legitimate Clish wrapper and the Mobile Access login-template directory for PHP files nobody deployed, and treat a hit as a compromise, because the implant has backup and snapshot persistence and one attacker moved from a gateway to an ESXi host."
