    text: "WFX Phantom: stolen GitHub tokens push a CI stealer; cloud persistence survives rotation; check for probe PRs"
  - claim_id: 5f25d8be1c
    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "summary"
    kind: frontmatter
    text: "StepSecurity and Aikido report that from 2026-11-10 an attacker uses stolen GitHub tokens, not a GitHub Actions bug, to open probe pull requests titled \"docs: dependency audit notes\" and then push a stealer script into workflows, CI scripts or npm hooks where the token's permissions allow, taking Actions secrets, runner memory and cloud credentials, planting AWS and Azure persistence and deleting the workflow runs. Counts differ by lab and time (more than 63,000 probes; at least 1,835 repositories where the payload ran); how the tokens were obtained is unknown, and no Swiss victim is named."
  - claim_id: 320f686f26
    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "actions[0]"
    kind: frontmatter
    text: "In every GitHub organisation your teams or suppliers administer, search for pull requests titled \"docs: dependency audit notes\" and commits since 2026-11-10 titled \"ci: refresh build cache\", \"ci: restore\", \"ci: cleanup\", \"chore: add ci helper\" or \"chore: add dependency audit workflow\"; revoke the tokens of every account that pushed one, and where the payload ran rotate every secret the workflow could read and remove AWS role trust-policy changes, created access keys and Azure federated credentials named wfx-ci, because the stealer plants persistence that outlasts rotation."
  - claim_id: a604e434c1
    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "body"
    kind: cited
    text: "StepSecurity reports that from 2026-11-10 an attacker uses stolen GitHub tokens of real developer and bot accounts, as a developer would, not a bug in GitHub Actions, to push a CI secret stealer into repositories those tokens can write to ("
