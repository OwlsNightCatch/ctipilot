  - claim_id: 2b19148b38
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "summary"
    kind: frontmatter
    text: "ANSSI's situation report of 2026-09-30 for its REACTIV operation counts 99 data breaches reported to it by French state services since 2026-08-01, 67 confirmed, and names the recurring causes: mass exploitation of the Metabase SQL injection CVE-2026-72898 (nine ministry instances compromised), infostealer-harvested credentials used on exposed services without a second factor, IDOR flaws, missing or weak MFA, and compromise through a supplier. The figures are provisional. ANSSI's second report of 2026-11-12 counts 64 new breaches brought to its attention since then, five at ministries or supervised bodies, says all exploit the weaknesses already listed and names the reuse of stolen secrets as the technique."
  - claim_id: 334910563c
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "ANSSI published the first situation report of its REACTIV operation on 2026-09-30, set up after the Prime Minister asked on 2026-09-01 for a reinforced response capability for state services, including the power to have ministries take urgent measures within tight deadlines ("
    urls: ["https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-006/"]
  - claim_id: 64da9f6912
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "Since 2026-08-01, 99 data breaches have been reported to ANSSI, 67 of them confirmed and 32 of those still being handled by the agency, and the report says its figures are provisional ("
    urls: ["https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf"]
  - claim_id: 9ac30ce228
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "It names the recurring causes: mass exploitation of the Metabase SQL injection CVE-2026-72898 since early August, with nine ministry instances compromised and a fix available since 2026-08-06; credentials stolen by infostealers on personal devices used for work, or taken from earlier breaches, that opened exposed services without a second factor; IDOR flaws, sometimes combined with other weaknesses, that allowed mass document exfiltration; missing or weak MFA, an email second factor counting as weak; compromise by rebound through a supplier that held ministry data; and, less often, missing authorization checks, SQL injection and exposed files ("
    urls: ["https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf"]
  - claim_id: 11006a1d3d
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "ANSSI asked all ministries to inventory their Metabase instances and verify they are updated ("
    urls: ["https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf"]
  - claim_id: e39243022d
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "ANSSI's second report, published on 2026-11-12, counts 64 further breaches brought to its attention since 2026-09-30, five of them at ministries or bodies under their supervision, and says they all exploit the weaknesses already listed in September, naming the reuse of stolen secrets to reach ministry applications as the technique, with renewing compromised secrets as the first containment step ("
    urls: ["https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf"]
  - claim_id: 2aa49540f4
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "The report's incident summaries show the shape of the losses: a compromised Tchap account of an Education nationale agent was used to read public and private rooms it already had access to and the conversations were exfiltrated; a claimed IDOR data leak on a Service national universel portal would expose 275,000 users and is still under investigation; and the compromise of the subcontractor of the operator of a TRACFIN reporting portal's support module led to exfiltration of the contact data of 136 reporting entities and the content of 213 support requests, after which the administration ended its relationship with that supplier ("
    urls: ["https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf"]
  - claim_id: adbf23f668
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: cited
    text: "**Exposure:** internet-facing public-sector services where staff or supplier accounts sign in with a password only or an email second factor, portals whose object identifiers are not checked against the caller's authorization, suppliers that hold your data, and any Metabase instance not upgraded since 2026-08-06 ("
    urls: ["https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf"]
  - claim_id: 2e044a3586
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: derived
    text: "**Detection:** the report gives no detection guidance of its own; its causes map to authentication logs on exposed services for first-time or unfamiliar logins on accounts without strong MFA, web access logs for sequential identifier enumeration, and access by supplier accounts to your data stores."
  - claim_id: 6d1fe86df3
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** test your own estate against the six causes, in particular which exposed services accept password-only or email-second-factor logins, which portals lack object-level authorization checks and which suppliers hold your data; the report shows breaches at national scale arising from these ordinary weaknesses and one patched flaw, not from new techniques."
  - claim_id: f7ffae836a
