    surface: "body"
    kind: cited
    text: "The main campaign used a modified watchTowr proof of concept for FortiOS CVE-2024-55591, designed to create a backdoor super-admin account named service ("
    urls: ["https://www.group-ib.com/blog/offensive-cyber-operations-europe/"]
  - claim_id: d0bfeb6101
    entry: 2026-11-13/darklunnen-group-ib-fortios-super-admin-swiss-scan-list
    surface: "body"
    kind: cited
