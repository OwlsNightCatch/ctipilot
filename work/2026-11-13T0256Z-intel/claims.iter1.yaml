    urls: ["https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf"]
  - claim_id: 69833874d9
    entry: 2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
    surface: "section 2026-11-13T04:05:15Z"
    kind: uncited
    text: "The new cases it describes: stolen technical accounts reused against a foreign-ministry library portal after a server compromise; an IDOR flaw in the payment API of a public registration portal for the hunting-licence exam, exposing more than a thousand people; an agent's France Travail account compromised with the SMS second factor validated, with the data of more than 60,000 agents and professionals claimed on a forum; and partner-account credentials from infostealers without two-factor authentication, combined with an IDOR flaw on a URL exposing file identifiers, which let attackers extract close to 1.2 million files from the CAF's VACAF service in three days."
