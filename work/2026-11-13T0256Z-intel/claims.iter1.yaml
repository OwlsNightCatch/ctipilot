    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "headline"
    kind: frontmatter
    text: "Apache httpd mod_http2 RCE: update to 2.4.71 or drop h2/h2c from Protocols; Debian, Ubuntu, Alpine fixed"
  - claim_id: 23da04d928
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "summary"
    kind: frontmatter
    text: "The Apache HTTP Server project released 2.4.71 on 2026-11-11 to fix CVE-2026-119618, a race in mod_http2 that it rates critical and says can lead to remote code execution in versions 2.4.55 through 2.4.70; Red Hat adds that it is unauthenticated, affects only servers with HTTP/2 enabled through the Protocols directive, and that public research has demonstrated a reliable exploit, while no source reports exploitation. Red Hat has fixed RHEL 9 and 10 and Debian bookworm and trixie, Ubuntu and Alpine ship 2.4.71 packages, while a researcher's public test reproduces crashes on 2.4.70 and, per Wordfence, does not show code execution."
  - claim_id: 1068585a2b
    entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Apache HTTP Server that loads mod_http2, update to 2.4.71 or to your distribution's fixed package (Debian bookworm 2.4.71-1~deb12u1 or trixie 2.4.71-1~deb13u1, Ubuntu per USN-9090-1, Alpine 2.4.71-r0, RHEL 9 mod_http2 2.0.26-7.el9_9.1, RHEL 10 mod_http2 2.0.29-5.el10_3.1) and restart it; where no fixed package exists yet, as on Debian forky and SUSE, remove h2 and h2c from the Protocols directive until one does, because Red Hat reports an unauthenticated code-execution path and a public exploit, though it rates its RHEL 9 and 10 packages Important rather than Critical for their harder exploitation."
