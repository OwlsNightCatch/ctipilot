    kind: frontmatter
    text: "{\"id\": \"CVE-2026-120869\", \"cvss\": \"9.4 (CVSS 4.0, bulletin, adjacent vector; the CVE record says 9.3 with a network vector)\", \"status\": [\"patch-available\"], \"affected\": \"NetScaler Console before 14.1-74.34\", \"fixed\": \"NetScaler Console 14.1-74.34\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 3b4b9ba4f7
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "Cloud Software Group's bulletin CTX697305 of 2026-11-12 fixes 28 memory-safety and input-handling flaws in customer-managed NetScaler ADC and NetScaler Gateway ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: fddaa49436
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "The bulletin describes the impact as unpredictable or erroneous behaviour or denial of service, while its CVSS 4.0 vectors score confidentiality, integrity and availability impact High on ten rows, and no source says that code execution is possible ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-020/"]
  - claim_id: 363e076254
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "The row that applies everywhere is CVE-2026-120868 (9.3), a memory overflow in packet processing with the precondition \"All NetScaler ADC and NetScaler Gateway deployments (Default configuration / No additional feature required)\" and no authentication or user interaction ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 0cff86abfa
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-107412 (9.5, attack requirements present) covers several overflows on an appliance configured as a Gateway (SSL VPN, ICA Proxy, CVPN or RDP Proxy) or an AAA virtual server, which CERT-EU, citing the vendor, says can be reached without authentication ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-020/"]
  - claim_id: 940d851511
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "); further rows at 9.3 or 8.7 each depend on one configured feature, such as an SMPP, DNS-over-HTTPS or PUSH virtual server or a SAML, WebAuth, email OTP, certificate or LDAP authentication action, and CVE-2026-120863 needs only a path from an untrusted host to the management address NSIP or NSIP6 ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 53ae2bcf50
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "Bulletin CTX697320 fixes CVE-2026-120869, an unauthenticated authentication bypass on the NetScaler Console, scored 9.4 with an adjacent vector in the bulletin ("
    urls: ["https://support.citrix.com/external/article/CTX697320/citrix-netscaler-console-security-bullet.html"]
  - claim_id: d471091ef7
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: ") and 9.3 with a network vector in ENISA's record ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-124482"]
  - claim_id: 85aeb474bd
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "The fixed builds are 14.1-73.57, 13.1-64.39, 14.1-73.58 FIPS and 13.1-37.293 for 13.1-FIPS and 13.1-NDcPP, and 14.1-74.34 for the Console; Secure Private Access Hybrid deployments must upgrade their NetScaler instances ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: b7f4d0aea5
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "CERT-EU writes that Citrix reports no exploitation and no confirmed public proof of concept ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-020/"]
  - claim_id: d18029a86f
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "), NCSC Switzerland lists the exploitation status as unknown ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13175"]
  - claim_id: 029d4f967d
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "Seven rows (the authentication request overflow, Endpoint Analysis, a reboot loop, HTTP/2, the B64DECODE expression, credentials written to a log and the Application Firewall decompression row) carry ids that ENISA's database already assigns to unrelated products ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-102489"]
  - claim_id: cec679f121
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "**Exposure:** every customer-managed NetScaler ADC or Gateway below the fixed build of its branch is in scope for CVE-2026-120868 whatever its configuration; the other rows apply where the named feature is configured, which the bulletin tells you to find with configuration searches such as `add vpn vserver`, `add authentication vserver` or `add authentication samlAction` ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 765b9ac95b
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "Where a logout had occurred, /var/log/httperror.log can hold authentication material (one of the rows), so limit who can read that file and support bundles ("
    urls: ["https://support.citrix.com/external/article/CTX697305/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: f3b78d0e53
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade internet-facing Gateway and AAA appliances first, then every other ADC, to the fixed build of the branch, because CVE-2026-120868 needs no feature and the bulletins offer nothing but the upgrade ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-020/"]
  - claim_id: cc51e4ea6f
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: uncited
    text: "Neither bulletin states an exploitation status, a workaround or a mitigation."
  - claim_id: 5899423eb6
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: derived
    text: "**Detection:** no source states a detection method or a check for compromise."
  - claim_id: 77d6431f3f
    entry: 2026-11-13/citrix-netscaler-adc-gateway-ctx697305-28-memory-flaws
    surface: "body"
    kind: derived
    text: "The stated impact is a crash or denial of service, so unexplained packet-engine restarts, core files or reboots after inbound traffic to a Gateway or AAA virtual server are the telemetry to review; this is an inference, not a source statement."
  - claim_id: 5fbf49fa72
