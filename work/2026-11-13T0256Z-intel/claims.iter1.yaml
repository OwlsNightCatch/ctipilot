    surface: "actions[0]"
    kind: frontmatter
    text: "Install a Jumbo Hotfix Accumulator at or above R81.20 take 174, R82 take 132, R82.10 take 52 or R82.20 take 14 on every Check Point gateway, management server, log server, Multi-Domain server and Maestro, because it carries both the PHP2Shell fix and the fix for CVE-2026-123039, and until it is in apply the cp-httpd.conf mitigation and stop the dynamic_server process; replace R81.10 and R81 systems, for which no fix for CVE-2026-123039 is listed."
