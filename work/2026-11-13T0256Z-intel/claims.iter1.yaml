    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "headline"
    kind: frontmatter
    text: "SignDrop: public Windows LPE to SYSTEM through CLFS and Defender; no CVE or patch; check CLFS authentication Mode"
  - claim_id: a7c960af4a
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "summary"
    kind: frontmatter
    text: "Cyderes Howler Cell reproduced SignDrop, a Windows local privilege escalation from a standard user to SYSTEM that was published on GitHub on 2026-11-10, the day of Patch Tuesday, with no coordinated disclosure, no CVE and no patch. It makes Defender's signature-update RPC and symbolic links get clfs.sys to write a SYSTEM-owned authentication file where the attacker chooses, so it applies where the CLFS authentication Mode is 0 or 1; no exploitation is reported, Microsoft has not commented, and the researcher's claim that about 80% of Windows installations are exposed is unsubstantiated."
  - claim_id: c9a338f9ea
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "Cyderes Howler Cell reports that the exploit was published on 2026-11-10 under a GitHub handle, the same day as November Patch Tuesday, with no coordinated disclosure, no CVE and no patch, and that its team reproduced a SYSTEM shell from a standard user session ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
  - claim_id: ad47dfcd1b
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "The chain is a logic bug with no memory corruption: CLFS containers are created through Object Manager symbolic links, an oplock on a bait file confirms that Microsoft Defender has engaged, a call to Defender's signature-update RPC makes clfs.sys create its .cnpf authentication-signature file as SYSTEM at an attacker-chosen path, here hid.dll in the Common Files\\microsoft shared\\ink directory, a file that does not ship with Windows; the content is replaced with a payload DLL and a runas request makes consent.exe load it, which starts a SYSTEM conhost.exe on the user's desktop ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
  - claim_id: 22a4f9be0b
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "It applies where the CLFS authentication Mode value, under HKLM\\SYSTEM\\CurrentControlSet\\Services\\CLFS\\Authentication, is 0 or 1; the researcher says Mode 2 or 3 is not vulnerable ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
  - claim_id: 71828305e5
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "Cyderes says the feature ships enabled on current Windows versions and that the researcher tested Windows 11 26H2 and experimental builds of Windows 11 and Windows Server 2025; the researcher's estimate that 80% of Windows installations are vulnerable has no data behind it ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
  - claim_id: 4e982877fc
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "The researcher adds that, because the privileged file creation appears to come from the antimalware engine's own process, the technique can be used against any antimalware engine's self-defense; that claim rests on his statement alone ("
    urls: ["https://www.bleepingcomputer.com/news/security/new-windows-signdrop-zero-day-gives-hackers-system-privileges/"]
