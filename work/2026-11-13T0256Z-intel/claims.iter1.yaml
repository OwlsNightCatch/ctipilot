  - claim_id: 6485c5498f
    entry: 2026-11-13/darklunnen-group-ib-fortios-super-admin-swiss-scan-list
    surface: "body"
    kind: cited
    text: "**Detection:** in FortiGate event logs, an administrator named service with the super_admin profile, any unexplained administrator or local user, and super_admin logins or account creation through the jsconsole interface, which Fortinet lists among its indicators; in VPN logs, logins with accounts whose secrets sat in an exposed configuration ("
