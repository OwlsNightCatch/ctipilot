  - claim_id: 11cd01a8d5
    entry: 2026-11-13/dixell-copeland-xweb-evo-vulncheck-cves-end-of-service
    surface: "summary"
    kind: frontmatter
    text: "VulnCheck, as CNA, published 14 CVEs on 2026-11-12 for XWEB EVO, the end-of-service Copeland and Dixell web supervisor for refrigeration and cold-chain equipment, seven of them scored CVSS 4.0 9.2 to 9.3: unauthenticated command injection that runs as root, a hard-coded Administrator password, and Administrator and root passwords computed from the device MAC address and date. Copeland ended software support on 2026-03-16 and ships no security fixes, and on 2026-10-14 it told operators to remove all XWEB EVO units from the public internet; no source reports exploitation of these CVEs or ties them to the refrigeration attacks that French and Swiss authorities warn about."
  - claim_id: 71638b0dc1
    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "actions[0]"
    kind: frontmatter
    text: "In every GitHub organisation you or your suppliers administer, search for pull requests titled \"docs: dependency audit notes\" and for commits whose messages match the campaign's CI messages; for each account that pushed one, revoke its tokens, rotate every secret its workflows could read and remove the AWS trust-policy changes, access keys and Azure federated credentials the stealer created, because the persistence is designed to outlast rotation."
  - claim_id: f79e2c9782
    entry: 2026-11-13/wfx-phantom-github-actions-ci-secret-stealer-stolen-tokens
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat the account behind any probe or payload commit as compromised and revoke its tokens; where the payload ran, rotation is not enough because the persistence is designed to outlast it, and Endor Labs says secrets rotated after the first wave were likely stolen again in 1,838 repositories ("
    urls: ["https://www.endorlabs.com/learn/github-actions-supply-chain-attack-targeting-ci-secrets-at-scale"]
