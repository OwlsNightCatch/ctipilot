    passage: l’ANSSI a publié le 20 octobre un retour d’expérience8 sur les violations de données applicatives.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: ANSSI published on 20 October a lessons-learned report on application data breaches.
  - claim: 'ANSSI work: structured remediation plans with ministries based on the roadmap and technical requirements derived from REACTIV investigations and audits.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
