  reading_notes:
    pdf_text_layer: 'pdf subcommand extracted 15,774 chars; the layer splits digits across lines (e.g. ''6'' / ''4 nouvelles''). Body saved with newlines removed and spaces collapsed (bodies/C-4-anssi-pdf-norm.txt). The HTML report page carries only the intro (no figures), so figures were checked against the rendered PDF pages: page 3 (64 / 5 / 70%) and page 7 (60 000 / 1,2 million) verified visually. Other figures (25 of 30, 30 500, plus de mille, 20 octobre) read from the text layer without split digits.'
    first_report_pdf: CERTFR-2026-CTI-006 text layer is unreadable (only 'x' glyphs from the pdf subcommand; pdftotext 96 bytes). Pages 3-6 were read from rendered images; the comparison passages are my transcription (bodies/C-4-anssi-006-visual-transcription.txt), flagged as such in each claim.
  headline_figures_verbatim:
    new_breaches_since_2026_09_30: 64 nouvelles violations de données ont été portées à la connaissance de l’ANSSI
    of_which_ministries_or_supervised_bodies: 5 concernent des ministères ou des organismes sous tutelle
    ministry_perimeter_trend: une baisse importante du nombre de violations de données détectées ou revendiquées depuis le dernier point de situation
    roadmap_2026_progress: atteint 70% d’avancement au plan interministériel
    single_technique_statement: la réutilisation de secrets volés pour accéder à des applications ministérielles permettant aux attaquants d’extraire de manière légitime les données qu’elles hébergent
  recommendations_by_anssi:
  - Renew authentication secrets that are compromised or suspected to be (first containment action).
  - 'Reinforce account protection: systematic strong authentication, strict control of privileged accounts.'
  - Harden access filtering to prevent data exfiltration.
  - Strengthen the security of applications, notably services exposed to the internet or third-party networks; ANSSI lessons-learned report on application data breaches of 20 October (CERTFR-2026-CTI-008).
  - Structured remediation plans with ministries based on the 2026-2027 roadmap and its technical requirements (minimum security baseline).
  - 'Per-case: CAF VACAF re-launch conditioned on a penetration test and a two-factor mechanism; ASP hardening of portals plus better supervision and detection; Education: administration-access hardening, data-flow supervision, application securing.'
