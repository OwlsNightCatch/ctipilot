  new_relative_to_covered_entry:
  - 'Second-report headline figures (64 new, 5 ministries/supervised bodies, significant decrease in the ministry perimeter, 70% roadmap progress); the first report''s 99 / 67 confirmed / 32 in handling are not updated into a cumulative total, and the second report gives no confirmed/claimed split: do not add 99 + 64.'
  - Weakness list reduced to five categories; Metabase and CVE-2026-72898 are not mentioned anywhere in the second report ('Les nouvelles violations de données n’ont pas souligné l’usage d’autres faiblesses'); the first report's six bullets included Metabase.
  - A single technique statement (reuse of stolen secrets) and a stated first containment action (renew secrets) with account-protection and egress-filtering follow-ups.
  - Cases above (five new, all tagged [NOUVEAU], plus Agriculture/DGFiP/BNUM updates).
  - Education escalated from 'plus d’une dizaine d’académies' (since July) to 25 of 30 (July-September), now with the RIE lateral-movement statement; ANSSI also says no new breach has been observed since the September report, so the growth is in the incident count for July-September, not new post-September breaches. GAIA (4.35 million teachers) and the Tchap case are not repeated.
  - ANSSI reports significant MFA progress and one positive MFA case (Agriculture).
  old_entry_flags:
  - flag: scope wording
    detail: Old entry title/summary say 99 breaches 'reported against French state services' / 'reported to it by French state services'. The first report (page 3) says only 'violations de données ont été portées à la connaissance de l’ANSSI'; the second report uses the same wording for 64 events of which only 5 concern ministries or supervised bodies. The 99 are therefore not shown to be confined to state services; candidate correction of the old entry's wording (the primary's scope is 'brought to ANSSI's attention').
  - flag: no contradiction found
    detail: The old entry's cause list (Metabase, infostealers, IDOR, MFA, supplier, development/config) is consistent with the second report's five-item list; the old entry's 'email second factor counting as weak' is consistent with, and not contradicted by, the new France Travail case (an SMS second factor was validated).
  - flag: old-entry headline framing
    detail: Old headline emphasises Metabase; the second report does not repeat it, which is context for the update, not an error.
  techniques:
  - id: T1078
    behaviour: Reuse of stolen secrets (valid accounts, partner and technical accounts, privileged accounts) - ANSSI's single technique statement
  - id: T1190
    behaviour: IDOR exploitation of public-facing portals (OFB payment API, VACAF URL, ASP DEFI vulnerability)
  - id: T1114
    behaviour: Mailboxes accessed and exfiltrated for any compromised account (Education, impact list)
  - id: T1199
    behaviour: 'Optional: first report''s supplier-rebound theme; the second report''s partner-account case (VACAF) is credential reuse rather than a stated supplier compromise - composer''s call'
  techniques_all_checked_active_in_pin: true
  techniques_note: Lateral movement over the RIE has no source-stated technique; leave unmapped. Mapping is the research agent's; ANSSI states no ATT&CK ids.
  exposure:
  - Internet-facing state portals and applications where staff, partner or technical accounts have no strong second factor or an SMS/e-mail one, and portals whose object identifiers are not checked against the caller (IDOR).
  - Public-sector entities in the same weakness classes (no Swiss nexus is stated by ANSSI).
  detection:
  - 'ANSSI states no detection guidance of its own; its cases imply authentication logs for sign-ins on accounts without strong MFA, web access logs for sequential or parameterised object-identifier enumeration and bulk automated extraction (VACAF: automated extraction over two days), marker sharing (Agriculture: compromised VPN certificates found via shared markers), and review of technical/partner account use. Do not present these as ANSSI statements.'
  triage: []
  caveats:
  - ANSSI itself says the figures are subject to change and are not a perfectly exhaustive view of the situation at any date.
  - The 64 count is of events brought to ANSSI's attention; only 5 concern ministries or supervised bodies; the report does not break down the other 59 or say how many are confirmed.
  - Digits in the PDF text layer were split; figures on pages 3 and 7 verified against rendered page images; the HTML report page does not carry the figures; no press reading of the 64/5 figures exists yet (cyberattaque.org covers only Education; searches found no other outlet).
  - The first report's PDF text is unreadable; comparison passages are my transcription from page images.
  - ANSSI defines IDOR as 'Indirect Object Reference' (footnote 5, same as in the first report); the usual expansion is Insecure Direct Object Reference; do not repeat the expansion in the entry.
  - Report page metadata date reads 2024-04-08 (site template); the feed gives 2026-11-12 and the content matches.
  - The report page URL cited in the brief (cert.ssi.gouv.fr) is also served as cert.cyber.gouv.fr (the feed's canonical link); both fetched.
