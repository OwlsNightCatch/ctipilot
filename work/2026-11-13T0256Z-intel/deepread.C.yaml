  exposure:
  - 'Organisations that alert staff by POCSAG pagers: the protocol carries no encryption of its own (heise); protection exists only if an add-on cipher is configured, and per Spiegel''s informant the IDEA keys used in Saxony are obtainable in online forums.'
  - 'Content risk is set by what the dispatch system puts in the alert text: patient name, address and health state (Spiegel/heise); one service already removed names and house numbers.'
