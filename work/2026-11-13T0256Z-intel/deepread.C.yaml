    passage: Wer in den vergangenen Wochen auf Google zu Unfällen in der Ostschweiz, der Innerschweiz, im Tessin oder in der Romandie recherchierte, stiess unversehens auf eine frei zugängliche Website mit den aktuellsten Pager-Meldungen – unverschlüsselt und mit intimsten Details über Patienten und Opfer.
    body_file: bodies/C-1-beobachter-notrufdaten.txt
    passage_en: Anyone who researched accidents in eastern Switzerland, central Switzerland, Ticino or Romandie on Google in recent weeks unexpectedly came across a freely accessible website with the latest pager messages, unencrypted and with the most intimate details about patients and victims.
  - claim: 'Swiss BACKGROUND (2018): Schutz & Rettung Zürich said messages were encrypted only from the sending device to the radio mast.'
