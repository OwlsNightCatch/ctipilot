    summary: Dispatch messages sent to pagers of Saxon fire brigades, rescue services and civil protection, containing patient diagnoses, names and addresses per Spiegel, were apparently readable by unauthorised parties in a social network for years; LKA Sachsen investigates (Spiegel 2026-11-11, heise 2026-11-12).
  classification_suggestion:
    reliability: B
    credibility: '2'
    reason: Spiegel is original reporting (informant), heise adds the LKA's own acknowledgement of an investigation; content details are still unverified by any authority and rest on one informant.
  priority_suggestion:
    value: notable
    reason: Neighbouring-state emergency services; the exposure class (paging without effective encryption) is documented for Switzerland in 2018 and no current Swiss status was found; no Swiss incident confirmed, so not high.
  sources_fetched_log:
  - heise via extract (trafilatura-direct)
  - Spiegel via extract (teaser) and url --direct (metadata)
  - Beobachter via extract (served via jina)
