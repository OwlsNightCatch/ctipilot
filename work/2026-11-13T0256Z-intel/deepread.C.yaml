items:
- id: C1
  item: Saxony emergency pager message exposure
  novelty: new
  suggested_kind: incident
  suggested_title_stub: 'Saxony: dispatch messages to emergency-service pagers apparently readable by unauthorised parties in a social network for years, LKA investigating'
  event_dates:
    spiegel_report_published: 2026-11-11T15:31+01:00 (paywalled S+)
    heise_published: '2026-11-12'
    lka_zac_learned_of_incident: 2026-10-31 (LKA statement to heise)
    informant_alerted_interior_ministry_and_LKA: end of October (Spiegel via heise); no reply received per informant
    exposure_start: not dated; 'seit einigen Jahren' / 'offenbar seit Jahren' (heise), 'jahrelang' (Spiegel teaser)
  claims:
  - claim: 'Spiegel (2026-11-11, paywalled; teaser readable): unauthorised parties apparently could read radio messages of Saxon rescue services and fire brigades for years; according to Spiegel''s information they contained diagnoses, names and addresses of patients; the LKA is investigating.'
    source_url: https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b
    publisher: DER SPIEGEL (Marcel Rosenbach), paywalled S+ article, teaser only readable
    source_date: '2026-11-11'
    passage: Unbefugte konnten offenbar jahrelang Funkmeldungen sächsischer Rettungsdienste und Feuerwehren mitlesen. Nach SPIEGEL-Informationen enthielten sie Diagnosen, Namen und Adressen von Patienten. Das LKA ermittelt.
    body_file: bodies/C-1-spiegel-pager-teaser.txt
    passage_en: Unauthorised persons apparently could read radio messages of Saxon rescue services and fire brigades for years. According to SPIEGEL information they contained diagnoses, names and addresses of patients. The LKA is investigating.
  - claim: 'Spiegel publication timestamp: 2026-11-11T15:31+01:00 (headline ''Gesundheitsdaten geleakt: Massive Panne bei sächsischen Notrufdiensten''; isAccessibleForFree false).'
    source_url: https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b
    publisher: DER SPIEGEL (Marcel Rosenbach), paywalled S+ article, teaser only readable
    source_date: '2026-11-11'
    passage: 'datePublished: 2026-11-11T15:31:00+01:00'
    body_file: bodies/C-1-spiegel-pager-teaser.txt
  - claim: 'Where it was readable and since when (Spiegel via heise): in ''a social network'' (not named), for some years; messages go to mobile pagers of fire brigades, rescue services and civil protection.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: können Unbefugte seit einigen Jahren in einem sozialen Netzwerk mitlesen, welche Notfallmeldungen an mobile Pager der Feuerwehren, Rettungsdienste und des Katastrophenschutzes geschickt werden
    body_file: bodies/C-1-heise-pager.txt
    passage_en: unauthorised persons have for some years been able to read along in a social network which emergency messages are sent to mobile pagers of fire brigades, rescue services and civil protection
  - claim: heise's lead sentence words the duration as 'apparently for years' and the action as intercepted and put online.
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: In Sachsen allerdings sind offenbar seit Jahren genau solche vertraulichen Notrufdaten abgefangen und ins Netz gestellt worden.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: In Saxony, however, exactly such confidential emergency-call data have apparently been intercepted and put online for years.
  - claim: 'Scale per Spiegel via heise: hundreds of messages flow in there every day.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Hunderte Meldungen fließen laut dem Bericht dort täglich ein.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: According to the report, hundreds of messages flow in there every day.
  - claim: 'Regions named (Spiegel via heise, ''vor allem'' = mainly): Greater Leipzig area, district Zwickau, Vogtlandkreis, Erzgebirgskreis.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Vor allem der Großraum Leipzig sowie der Landkreis Zwickau, der Vogtlandkreis und der Erzgebirgskreis seien von dem Datenleck betroffen, heißt es.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: Above all the Greater Leipzig area as well as the district of Zwickau, the Vogtland district and the Erzgebirge district are said to be affected by the data leak.
  - claim: 'Informant: told the Saxon interior ministry and the LKA at the end of October, got no response, then went to the media (Spiegel via heise).'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Das Magazin bezieht sich unter anderem auf einen Informanten, der Ende Oktober das sächsische Innenministerium und das Landeskriminalamt informiert, aber keine Rückmeldung bekommen und sich daraufhin an die Medien gewandt habe.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: The magazine relies among other things on an informant who informed the Saxon interior ministry and the State Criminal Police Office at the end of October, received no reply and then turned to the media.
  - claim: 'Spiegel (via heise): the LKA is already investigating.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Laut Spiegel ermittelt das LKA bereits.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: According to Spiegel the LKA is already investigating.
  - claim: 'Mitigation already taken by one service (Spiegel via heise): Rettungszweckverband Südwestsachsen now sends dispatch information without patient names and without house numbers.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Beim Rettungszweckverband Südwestsachsen etwa würden Einsatz-Infos derzeit nur noch ohne Namen der Patienten und ohne Hausnummern übermittelt.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: At the Rettungszweckverband Südwestsachsen, for example, dispatch information is currently transmitted only without patient names and without house numbers.
  - claim: 'LKA Sachsen statement (to heise, Thursday 2026-11-12): its Central Contact Point Cybercrime (ZAC) learned of the incident on 31 October.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Auf eine Anfrage von heise online teilt die zuständige Zentrale Ansprechstelle Cybercrime des Landeskriminalamts (ZAC) am Donnerstag mit, dass man am 31. Oktober von dem Vorfall erfahren habe.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: In response to a request from heise online the responsible Central Contact Point Cybercrime of the State Criminal Police Office (ZAC) said on Thursday that it learned of the incident on 31 October.
  - claim: 'LKA Sachsen: investigations were started immediately (spokesperson).'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Es seien umgehend Ermittlungen eingeleitet worden, sagt ein Sprecher des LKA Sachsen.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: Investigations were initiated immediately, says a spokesperson of the LKA Saxony.
  - claim: 'LKA/heise: number of affected persons and volume of leaked data unknown; no further information because of the ongoing investigation.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Wie viele Betroffene es gibt und wie viele Daten abgeflossen sind, ist unklar. Aufgrund der laufenden Ermittlungen würden keine weiteren Auskünfte erteilt.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: How many people are affected and how much data has leaked is unclear. Because of the ongoing investigation no further information would be given.
  - claim: 'Technology (heise, hedged ''offenbar''): the affected dispatch units use pagers on the POCSAG radio protocol.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Die betroffenen Einsatzstellen verwenden offenbar Funkmeldeempfänger, die das sogenannte Pocsag-Funkprotokoll zur Übertragung einsetzen.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: The affected dispatch units apparently use radio pagers that use the so-called POCSAG radio protocol for transmission.
  - claim: 'heise: POCSAG itself provides no encryption; it must be added separately.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Eine Verschlüsselung sieht das Protokoll selbst aber nicht vor. Sie muss zusätzlich umgesetzt werden.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: The protocol itself, however, does not provide for encryption. It must be implemented additionally.
  - claim: 'Only stated technical cause (Spiegel via heise): Saxon networks use IDEA encryption from 1990, regarded as outdated for its 64-bit block size.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: In den sächsischen Netzen kommt laut Spiegel das Verfahren IDEA von 1990 zum Einsatz, das wegen seiner geringen Blockgröße von 64 Bit als veraltet gilt.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: According to Spiegel, the IDEA method of 1990 is used in the Saxon networks, which is considered obsolete because of its small block size of 64 bits.
  - claim: 'Informant''s claim (Spiegel via heise): the required keys are available in online forums.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Die nötigen Schlüssel sind dem Informanten zufolge in Onlineforen erhältlich.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: According to the informant the necessary keys are available in online forums.
  - claim: 'heise''s historical context: Austria precedent 17 years ago (users coupled a PC sound card to a radio scanner and copied pager texts); many German BOS users have moved to TETRA, which has encryption on board. No statement on other German states or on Switzerland in the article.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
    source_date: '2026-11-12'
    passage: Aus Kostengründen verzichteten vor 17 Jahren unter anderem Einsatzstellen in Österreich auf aktive Tetra-Pager, woraufhin ein Nutzer seine PC-Soundkarte mit einem Funkscanner koppelte und die Pager-Texte kopierte.
    body_file: bodies/C-1-heise-pager.txt
    passage_en: For cost reasons, 17 years ago dispatch units in Austria, among others, did without active TETRA pagers, whereupon a user coupled his PC sound card to a radio scanner and copied the pager texts.
  - claim: 'heise on message sensitivity (framing, not a Saxon content finding): name, address and health state of a patient.'
    source_url: https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html
    publisher: heise online (Jörg Breithut)
