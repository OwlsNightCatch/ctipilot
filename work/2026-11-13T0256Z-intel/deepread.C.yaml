  - claim: ANSSI 20 October lessons-learned report reference.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
