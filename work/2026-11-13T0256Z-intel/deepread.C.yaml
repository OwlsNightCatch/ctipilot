  attack_flow_with_telemetry:
  - step: 1
    what: Spear-phishing email from a typosquatted lookalike domain impersonating the senior vice president of a real construction-sector company; lure domain mail set up with Zoho Mail (SPF + Zoho verification TXT).
    telemetry_class: Mail flow / mail-gateway logs (sender domain age and lookalike, SPF/DKIM results), threat-intel on newly registered domains.
    source: Huntress
  - step: 2
    what: Link in the mail wrapped by Microsoft Safe Links, pointing to a Google short link (share.google), then a google.com share URL, then the lure page; three redirects server-side at the same instant. The mail body held the share.google link, not the lure domain.
    telemetry_class: 'Safe Links / URL-click telemetry, web proxy and DNS logs (share.google to lookalike-domain redirect). Huntress: this ''sidestepped URL reputation checks for email security''.'
    source: Huntress
  - step: 3
    what: '''Microsoft Teams Meeting Scheduler'' lure page with the SVP''s name and headshot, an ''Introductory call'' pitch (supply partnership), date/time/duration pickers and a Continue button; lure directories named for booking a Teams meeting.'
    telemetry_class: Web proxy / secure web gateway logs for the lookalike domain (Teams-themed path names); nothing is sent to a backend until Continue is clicked.
    source: Huntress
  - step: 4
    what: The real phishing kit ships as AES-256-GCM ciphertext with key and IV in the same page; the browser decrypts it with WebCrypto and writes the result over the page; hooks route API calls to the backend.
    telemetry_class: Evades static scanners and non-JavaScript crawlers; visible only to endpoint/browser-side detection or a sandbox that executes the page.
    source: Huntress
  - step: 5
    what: On Continue the page POSTs to a backend start endpoint (visitor country in headers), the backend starts a real Microsoft device-code sign-in and returns the user code, shown to the victim as a 'Booking Reference'; 'Copy' or 'Confirm Meeting' copies it and opens a pop-up with Microsoft's genuine device-login page; a countdown adds pressure; on success the pop-up closes, 'Verification complete' shows and the victim is redirected to a legitimate-looking Calendly booking page.
    telemetry_class: 'Proxy logs (POST to a non-Microsoft backend path ending in device/start); Entra sign-in logs record the device-code authentication (Huntress: the `Cmsi:Cmsi` login, Microsoft Authentication Broker).'
    source: Huntress
  - step: 6
    what: 'MFA fallback: if Microsoft returns AADSTS50076 or interaction_required (MFA required), the kit tells the victim ''For your security, please verify your account again'', starts a new device-code session and shows a new code; a ''WinHello'' stage can show a fake Microsoft window (''To continue, we need to complete an additional verification on this device'').'
    telemetry_class: 'Entra sign-in logs: repeated device-code authentication attempts for the same user in a short window (inference from the mechanism; Huntress does not name this as a log pattern). The error codes are returned to the attacker''s backend polling the token endpoint, Huntress does not say they appear in the victim''s sign-in log.'
    source: Huntress (mechanism); log visibility is not stated
  - step: 7
    what: 'Token use: after the session token was obtained the `Cmsi:Cmsi` login to Microsoft Authentication Broker appeared; the device-code login was routed through a residential callback proxy (a New Orleans home address); programmatic user agents (python-requests, node) followed in the sign-in logs; the captured session was replayed from attacker infrastructure and ''the ASN and region changed inside the same session ID''; the account had no MFA enrolled and was used from a non-compliant, unmanaged device.'
    telemetry_class: 'Entra sign-in logs (interactive and non-interactive: Huntress says programmatic user agents often appear only in the non-interactive logs), session-ID ASN/region change, device compliance/management state, Conditional Access evaluation.'
    source: Huntress
  - step: 8
    what: 'Post-compromise actions: none observed. Huntress contained the incident ''barring the attack from escalating''. Huntress lists what to check after a confirmed compromise: rogue MFA methods, unrecognized registered devices, unauthorized app consents, suspicious mailbox rules, suspicious outbound mail.'
    telemetry_class: Entra audit logs (auth-method and device registration changes, app consents), mailbox rule and outbound mail logs.
    source: Huntress
  sign_in_log_artefacts_verbatim:
  - Cmsi:Cmsi
  - Device code (Cmsi:Cmsi)
  - Subsequent Programmatic User Agents such as python-requests and node in the sign in logs
  - Appears both in interactive and non-interactive sign-in logs. Often times programmatic user agents only appear in non-interactive sign-in logs
  - the ASN and region changed inside the same session ID
  - AADSTS50076
  - interaction_required
  detection_and_hardening_statements:
    huntress_verbatim: Restrict or monitor device-code authentication where it is not required via conditional access, enable additional complex conditional access policies, enforce phishing-resistant MFA, and investigate unfamiliar OAuth and device sign-ins, especially from unmanaged devices, new regions, or residential proxy infrastructure.
    conditional_access_device_code_blocking: Huntress only says 'restrict or monitor device-code authentication where it is not required via conditional access'; it names no specific policy setting and does not describe the Authentication flows condition. The Microsoft Learn policy documents (Authentication flows condition, device code flow block) are already cited in the covered Vaud entry.
    user_side: Treat unexpected device-code prompts as suspicious, especially after a link, booking request or unexpected interaction; verify through known contacts before entering any code.
  triage:
  - 'Huntress''s discriminator: a device-code prompt that follows a link, a booking request or another unexpected interaction. No benign-lookalike discussion beyond that; Huntress does not describe legitimate device-code use.'
  - 'Entra: a device-code (Cmsi:Cmsi) authentication by a user with no device that needs it, followed by programmatic user agents or an ASN/region change within the same session ID.'
  victim_sector_and_region: Construction industry (employee at one company; impersonated company in the same sector). Country not stated. The residential proxy was in New Orleans (US), which says nothing about the victim's location. No Swiss, European or public-sector nexus stated.
  comparison_with_covered_entry_vaud:
    covered_entry: 2026-11-05/vaud-m365-device-code-phishing-campaign-romandie
    covered_entry_basis: 'Canton of Vaud notice (2026-11-04): a campaign in French-speaking Switzerland, several organisations affected, mail lures (invoice/document/verification) with links on workers.dev subdomains, no actor, kit, count, sector or start date.'
    huntress_adds:
    - 'A single named-in-aggregate incident with the full sequence: executive-impersonation mail, Safe Links-wrapped Google share link, Teams ''meeting scheduler'' pretext, device code disguised as a ''Booking Reference'', copy-to-clipboard, genuine Microsoft device-login pop-up, Calendly redirect.'
    - 'Kit mechanics the Vaud notice lacks: AES-256-GCM ciphertext decrypted in the browser with WebCrypto, MFA-required fallback that restarts the device-code session, optional fake ''WinHello'' verification pop-up.'
    - 'Sign-in log artefacts: Cmsi:Cmsi (Microsoft Authentication Broker) device-code login, programmatic user agents, residential-proxy origin, ASN/region change within one session ID, account without MFA on an unmanaged device.'
    - 'Detection angle: scanners miss the page (redirect via share.google, encrypted blob), so Entra sign-in telemetry is the place to catch it.'
    no_link_stated: Huntress does not mention Vaud, Romandie, workers.dev or Switzerland, and does not say the two campaigns are connected; treat them as separate observations of the same technique class.
    huntress_context: Huntress notes the earlier Railway-based Microsoft 365 token-replay campaign (March 2026) and that most earlier lures were a PDF with a 'verification code' (registry key campaign:railway-device-code-phishing-m365-2026 exists).
  status_as_of_2026_11_13: Observed in one incident mid-October, contained by Huntress; Huntress reports no post-compromise activity. No CVE. No scale or campaign-wide figures given.
  techniques:
  - id: T1566.002
    behaviour: 'Spearphishing link: executive-impersonation mail with a Safe Links-wrapped Google share link'
    source_stated: true
  - id: T1204.001
    behaviour: Victim clicks the link and completes the booking flow, copying and entering the device code
    source_stated: true
  - id: T1528
    behaviour: Device-code flow hands the actor access tokens for the Microsoft Authentication Broker client
    source_stated: true
  - id: T1078.004
    behaviour: Compromised M365 account (no MFA enrolled) used from an unmanaged device
    source_stated: true
  - id: T1550.004
    behaviour: Huntress maps replay of the captured session (ASN/region change inside the same session ID); arguably T1550.001 for a device-code token, but only T1550.004 is source-stated
    source_stated: true
  - id: T1027.013
    behaviour: Phishing kit shipped as AES-256-GCM ciphertext decrypted in the browser
    source_stated: true
  - id: T1684.001
    behaviour: Impersonation of a real executive (name, title, headshot) and Teams/Microsoft branding
    source_stated: true
  - id: T1090
    behaviour: Residential callback proxy for the device-code login
    source_stated: true
  - id: T1583.001
    behaviour: Typosquatted domain registered eight days before the incident
    source_stated: true
  - id: T1608.005
    behaviour: Teams-themed lure directories staged on the typosquatted domain
    source_stated: true
  - id: T1539
    behaviour: Huntress maps 'session token captured through the relayed Cmsi:Cmsi flow'; weakly supported by a device-code mechanism (no cookie theft described) - suggest omitting
    source_stated: true
  - id: T1557
    behaviour: Huntress maps a callback proxy relaying authentication; weakly supported, device-code phishing is not a credential relay - suggest omitting
    source_stated: true
