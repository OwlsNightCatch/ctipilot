  findings:
    what_is_exposed: 'Emergency dispatch messages sent to mobile pagers of fire brigades, rescue services and civil protection (heise). Spiegel teaser: the messages contained diagnoses, names and addresses of patients. heise frames sensitivity as patient name, address and health state. Message classes beyond these (e.g. police, location-only alarms) are not stated in the readable text.'
    where_readable: '''in a social network'' (heise: ''in einem sozialen Netzwerk''); platform not named in the readable text. How the messages got there (radio interception with a decoder, a feed from a network operator, other) is not stated in the readable text; heise''s verbs are ''abgefangen und ins Netz gestellt'' (intercepted and put online) and ''abgefischt''.'
    since_when: 'Not dated. Wording by source: Spiegel teaser ''jahrelang'' (for years); heise lead ''offenbar seit Jahren''; heise body ''seit einigen Jahren'' (for some years).'
    scale: '''Hunderte Meldungen fließen laut dem Bericht dort täglich ein'' (hundreds of messages a day, Spiegel via heise). LKA: how many people are affected and how much data leaked is unclear.'
    regions_services_named: 'Mainly Greater Leipzig, Landkreis Zwickau, Vogtlandkreis, Erzgebirgskreis (Spiegel via heise). Rettungszweckverband Südwestsachsen named as having already reduced content (no patient names, no house numbers). Services: fire brigades, rescue services, civil protection.'
    who_investigates: LKA Sachsen; its Central Contact Point Cybercrime (ZAC) says it learned of the incident on 31 October and opened investigations immediately; no further information because of the ongoing investigation. No statement from the Saxon interior ministry or the Saxon data protection authority in the readable sources.
    technical_cause_stated: 'Only what heise relays: the units ''apparently'' use POCSAG pagers; POCSAG has no encryption of its own, encryption must be added; per Spiegel the Saxon networks use IDEA (1990), regarded as outdated for its 64-bit block size; per the informant (a claim) the needed keys are available in online forums. heise does not say the traffic was unencrypted in Saxony; it says an outdated cipher is in use and that keys are allegedly obtainable. No source states the root cause of the exposure.'
    other_german_states_or_switzerland: 'None. heise names no other state and no Swiss entity; it only gives the Austria 2009-era precedent (17 years ago: PC sound card coupled to a radio scanner copied pager texts) and notes that many German BOS users moved to TETRA (encryption on board).'
    mitigation_reported: 'Rettungszweckverband Südwestsachsen: dispatch information currently sent without patient names and without house numbers (Spiegel via heise).'
