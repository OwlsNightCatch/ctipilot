  caveats:
  - 'Spiegel article is paywalled (S+): only headline, standfirst and metadata were readable (teaser saved as bodies/C-1-spiegel-pager-teaser.txt); everything else attributed to Spiegel is heise''s relay of it.'
  - The 'social network' is not named, and the readable text does not say how messages reach it.
  - '''Hundreds a day'' is Spiegel''s figure via heise; the LKA says affected persons and data volume are unclear.'
  - No source dates the start of the exposure; 'for years' is the sources' own wording.
  - The IDEA / forum-keys statement rests on an informant's claim relayed by Spiegel; heise hedges the POCSAG use with 'offenbar'.
  - No LKA Sachsen or Saxon police press release was located; the LKA statement exists only as relayed by heise (response to heise's inquiry on Thursday 2026-11-12).
  - No other outlet with original reporting on the Saxon case was found by 14 searches (WebSearch index may simply lag a 1-2 day old story); heise is the only readable source.
