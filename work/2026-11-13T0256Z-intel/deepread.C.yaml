- id: C4
  item: ANSSI REACTIV second situation report (October 2026), CERTFR-2026-CTI-010
  novelty: update-of:2026-10-02/anssi-reactiv-situation-report-99-state-data-breaches
  suggested_kind: research
  event_dates:
    report_published: 2026-11-12 (CERT-FR feed title '(12 novembre 2026)')
    previous_report: 2026-09-30 (CERTFR-2026-CTI-006)
  claims:
  - claim: 'Report identity/date: CERT-FR feed lists ''Point de situation de l’opération REACTIV – octobre 2026 (12 novembre 2026)''.'
    source_url: https://www.cert.ssi.gouv.fr/cti/feed/
    publisher: CERT-FR CTI feed
    source_date: '2026-11-12'
    passage: 'title: Point de situation de l’opération REACTIV – octobre 2026 (12 novembre 2026)'
    body_file: bodies/C-4-anssi-feed-snippet.txt
    passage_en: Situation report of the REACTIV operation – October 2026 (12 November 2026)
  - claim: 'Report page: this is the second situation report; it reflects ongoing investigations and the figures may change and cannot be a perfectly exhaustive view.'
    source_url: https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-010/
    publisher: ANSSI / CERT-FR (report page)
    source_date: '2026-11-12'
    passage: Le présent document est le deuxième point de situation qui reflète des travaux d’investigation en cours et des incidents qui évoluent.
    body_file: bodies/C-4-anssi-page.txt
    passage_en: This document is the second situation report, which reflects ongoing investigation work and incidents that are evolving.
  - claim: 'Headline figure: 64 new data breaches brought to ANSSI''s attention since 2026-09-30.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Depuis le 30 septembre 2026, date du dernier point de situation, 64 nouvelles violations de données ont été portées à la connaissance de l’ANSSI.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: Since 30 September 2026, the date of the last situation report, 64 new data breaches have been brought to ANSSI's attention.
  - claim: Of these security events, 5 concern ministries or bodies under their supervision and are being handled by the victims with ANSSI's support.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: 5 concernent des ministères ou des organismes sous tutelle et sont en cours de traitement par les victimes avec l’appui de l’ANSSI
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: 5 concern ministries or bodies under their supervision and are being handled by the victims with ANSSI's support
  - claim: Within the ministries' perimeter ANSSI stresses a significant decrease in breaches detected or claimed since the last report.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Sur le périmètre des ministères, l’ANSSI souligne une baisse importante du nombre de violations de données détectées ou revendiquées depuis le dernier point de situation.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: Within the ministries' perimeter, ANSSI stresses a significant decrease in the number of data breaches detected or claimed since the last situation report.
  - claim: All breaches exploit weaknesses already mentioned in the September report.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: L’ensemble des violations de données exploitent des faiblesses et vulnérabilités déjà mentionnées dans le point de situation de septembre
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: All the data breaches exploit weaknesses and vulnerabilities already mentioned in the September situation report
  - claim: The five recurring weaknesses as listed (no Metabase, no CVE named).
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Absence de double authentification (MFA) ou authentification faible ; • Sous-traitance et chaîne d’approvisionnement ; • Compromission de comptes par le biais d’infostealers4 ; • Vulnérabilités de type IDOR5 ; • Défauts de développement et de configuration.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: Absence of two-factor authentication (MFA) or weak authentication; subcontracting and supply chain; account compromise via infostealers; IDOR-type vulnerabilities; development and configuration defects.
  - claim: New breaches did not point to other weaknesses; progress on securing measures is significant, notably MFA deployment.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Les nouvelles violations de données n’ont pas souligné l’usage d’autres faiblesses ou vulnérabilités6. Si ces vulnérabilités restent d’actualité, il est à noter que les progrès sur les mesures de sécurisation sont significatifs, notamment sur la mise en œuvre du MFA.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: The new data breaches did not highlight the use of other weaknesses or vulnerabilities. While these vulnerabilities remain current, it should be noted that progress on securing measures is significant, notably on MFA implementation.
  - claim: Roadmap 2026 objectives are at 70% interministerial progress.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: La réalisation d’ensemble des objectifs 2026 de la feuille de route des efforts prioritaires en matière de sécurité numérique de l’État 2026-2027 progresse notablement et atteint 70% d’avancement au plan interministériel.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: Overall delivery of the 2026 objectives of the roadmap of priority efforts for the State's digital security 2026-2027 is progressing notably and reaches 70% progress at interministerial level.
  - claim: ANSSI footnote defines IDOR as 'Indirect Object Reference' (the usual expansion is Insecure Direct Object Reference) and includes directory traversal.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Une vulnérabilité de type IDOR (Indirect Object Reference) permet d’accéder à un objet sans authentification, après une première authentification avec un compte qui n’est normalement pas autorisé à accéder aux données.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: An IDOR (Indirect Object Reference) vulnerability allows access to an object without authentication, after a first authentication with an account that is not normally authorised to access the data.
  - claim: Main impact remains exfiltration of personal data observed in October.
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: L’exfiltration de données personnelles demeure l’impact principal des violations de données observées en octobre
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: The exfiltration of personal data remains the main impact of the data breaches observed in October
  - claim: 'Impact class: mailbox content - mailboxes accessed and exfiltrated for any compromised account.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: 'Contenus de messagerie : Boîtes aux lettres accédées et exfiltrées pour tout compte compromis'
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: 'Mailbox content: mailboxes accessed and exfiltrated for any compromised account'
  - claim: 'THE single technique statement: reuse of stolen secrets to access ministerial applications, letting attackers legitimately extract the data they host.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: 'convergent vers une technique récurrente : la réutilisation de secrets volés pour accéder à des applications ministérielles permettant aux attaquants d’extraire de manière légitime les données qu’elles hébergent.'
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: 'converge on a recurring technique: the reuse of stolen secrets to access ministerial applications, allowing attackers to extract the data they host in a legitimate manner.'
  - claim: 'ANSSI recommendation 1: first containment action is to renew authentication secrets that are compromised or suspected to be.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: la première action d’endiguement consiste à renouveler les secrets d'authentification, compromis ou suspectés de l'être.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: the first containment action is to renew the authentication secrets that are compromised or suspected of being so.
  - claim: 'ANSSI recommendation 2: accompany it with stronger account protection (systematic strong authentication, strict control of privileged accounts) and hardened access filtering to prevent exfiltration.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: Cette action doit s'accompagner d'une protection renforcée des comptes — mise en place systématique d’une authentification forte7 et un contrôle strict des comptes à privilèges — ainsi que du durcissement du filtrage des accès pour empêcher l'exfiltration des données.
    body_file: bodies/C-4-anssi-pdf-norm.txt
    passage_en: This action must be accompanied by reinforced account protection - systematic implementation of strong authentication and strict control of privileged accounts - as well as hardening of access filtering to prevent data exfiltration.
  - claim: 'ANSSI recommendation 3: strengthen application security, notably for services exposed to the internet or third-party networks; ANSSI published a lessons-learned report on application data breaches on 20 October (CERTFR-2026-CTI-008).'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
    publisher: ANSSI / CERT-FR (CERTFR-2026-CTI-010, REACTIV point de situation octobre 2026)
    source_date: '2026-11-12'
    passage: renforcer la sécurité des applications notamment pour les services exposés à internet ou des réseaux tiers.
    body_file: bodies/C-4-anssi-pdf-norm.txt
