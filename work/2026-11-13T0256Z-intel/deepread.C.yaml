  caveats:
  - Single source (Huntress), first-hand SOC telemetry on one incident; Huntress names no victim, country or scale.
  - Huntress's ATT&CK table says the account 'had no MFA enrolled' while the kit has an MFA-required fallback; the fallback is a kit capability, whether it fired in this incident is not stated.
  - The phishing and backend domains and the share-link identifier are in Huntress's IOC table; omitted here (no IOCs).
  - Whether the AADSTS50076 / interaction_required codes surface in the victim's own sign-in log is not stated.
  - No detection rule or Conditional Access policy detail is given beyond the general statement.
