  what_is_claimed_exploited:
    flaw_chain: 'The 4EverAble2Shell chain published by the researcher on 2026-11-12: initial code execution as the ''nable'' service account through the Apache Axis 1.x SOAP-fault deserialization flaw CVE-2026-90436 on the Axis SOAP endpoint under /dms/services/ServerUI, then a separate N-central root privilege escalation (maintenance-helper symlink abuse: setLDFileOwner on a flag file symlinked to ServerChild.sh, then serverControl to run it as root). The privilege-escalation flaw has no CVE yet; Previdian tracks it as VULN-2026-0009.'
    not_the_exploited_ones: 'The seven CVEs fixed in HF2 (CVE-2026-125883, -125881, -125878, -125882, -125879, -91000, -125880, i.e. the Able2Shell set) are NOT the exploited chain. For the Able2Shell phase only scanning/probing was reported (N-able status page; Beazley and Previdian honeypots 2026-11-09/10); no confirmed compromise as of 2026-11-10 per Huntress/Beazley/N-able. None of the seven is in CISA KEV (Tenable as of 2026-11-12). Agent2Shell (researcher claim: 10+ flaws, SYSTEM on Windows agents) has no reported exploitation.'
    by_whom: One unnamed operator behind a single source address (Huntback, Previdian); mining payload (XMRig); Huntback ties the pool wallet to 631 rigs and to exploits of Jpom, FreePBX, MLflow, Apache Flink, PaperCut, SFTPGo and AJ-Report. No named threat actor (Tenable, as of 2026-11-12).
    scale: 'At least 21 production N-central servers mining for the operator at 12:50 UTC on 2026-11-12 (Huntback, from the pool''s public rig list plus HTTPS checks of the addresses): 19 on build 2026.4.1.26 (HF2), 1 on 2025.3.1.9, 1 build not stated. Countries: US 9, South Africa 4, Canada 4, UK 1, Germany 1, France 1, Sweden 1. No Swiss server in the list. Three servers share one MSP''s address block. Addresses not published.'
    attempts_vs_success: 'Previdian honeypot: 2 attempts, 1 source, full chain attempted (attempts only). Huntback: successful compromises evidenced by active miners on production servers. watchTowr (X post, via THN): probes against builds with the Legacy API enabled.'
  exploitation_status_as_of_2026_11_13:
    itw_exploitation: Confirmed by independent sensor sets for attempts (Huntback decoys, Previdian honeypot, watchTowr via THN) and by Huntback for successful compromise of at least 21 production servers; reported by BleepingComputer (2026-11-12 19:51 UTC) and Tenable (updated 2026-11-12). Not confirmed by the vendor or by any victim.
    vendor_position: 'N-able dashboard event 202613 (start 2026-11-12 16:00 UTC, status Identified, Major Outage; page ''Last Updated: Nov 13, 2026 03:35:22 UTC''): ''we have seen no signs of compromise. We are continuing to monitor closely and will provide updates as needed.'' Earlier version of the 11-12 notice (event 202609, quoted by THN and Huntress): the issue ''depends on a non-default configuration in which the Legacy API is turned on and exposed to the public internet''; hosted environments not affected. N-able''s statement therefore post-dates and contradicts Huntback''s 12:50 UTC report.'
    hotfix: 'No fix for the 11-12 chain. HF2 (build 2026.4.1.26, 2026-11-10) is the latest N-central release listed on status.n-able.com/release-notes as of 2026-11-13 02:35 GMT (newest listed item is PME 2.14.4 of 2026-11-12). N-able says a follow-up hotfix will be released and that it is ''developing additional remediation''. Huntress (11-12): ''A fully patched N-central server should be treated as vulnerable. There is no fix available at the time of writing.'''
    cve_2026_90436_fix: 'Apache: Axis 1.x is EOL and ''The Apache Axis project does not expect to create an Axis 1.x release fixing this problem''; only a source commit exists. THN quotes Previdian as saying patches were released on 2026-11-06; the Apache post speaks of a commit, not a release.'
    cisa_kev: 'Not listed. CISA KEV fetched via the bridge on 2026-11-13: newest dateAdded 2026-11-10; no CVE-2026-90436 and none of the seven HF2 CVEs; earlier N-central KEV entries unchanged (CVE-2026-86218, -18556, -18577, CVE-2025-8876, -8875). Tenable and Previdian state the same.'
    mitigation_stated: Disable the Legacy API (default off) on on-premises servers and keep it off the internet (N-able, Huntress); N-able turned off the Intune integration (hosted) and deactivated it for on-premises customers where it could; keep upgrading Agents and then Probes per HF2 guidance. The researcher (via Huntress) says the exploit only works with the Legacy API on; Huntback does not say whether the 21 victims had it on. Whether Legacy API was the enabling condition on the compromised servers is unknown.
  cve_table:
  - cve: CVE-2026-90436
    product: Apache Axis 1.x as embedded in N-able N-central (on-premises)
    cvss: '9.8 (THN/Previdian figure; the Apache CNA post says only ''Severity: critical'')'
    epss: null
    kev: false
    exploited: true
    affected: Apache Axis 1.x through 1.4 (EOL); N-central 2026.4.1.26 (HF2) tested by the researcher and compromised in the wild per Huntback; full N-central affected-version range not verified (Previdian)
    fixed: 'None: Apache does not plan an Axis 1.x release (source commit only); N-able has no fix for the 4EverAble2Shell chain as of 2026-11-13'
    type: rce (unauthenticated class instantiation via SOAP fault exceptionName)
    vector: network
    auth: none
    source: https://openwall.com/lists/oss-security/2026/11/06/12 (Apache CNA post, 2026-11-06)
  - cve: (none assigned) VULN-2026-0009 (Previdian id)
    product: N-able N-central
    cvss: 9.8 (Previdian estimate for the chain)
    epss: null
    kev: false
    exploited: true
    affected: 2026.4.1.26 (HF2) tested; range not verified
    fixed: None as of 2026-11-13
    type: local privilege escalation to root (maintenance-helper symlink abuse), chained after Axis RCE
    vector: network (chain)
    auth: none (chain)
    source: https://previdian.com/VULN-2026-0009
  techniques:
  - id: T1190
    behaviour: Unauthenticated SOAP request to the Axis endpoint of an internet-exposed N-central server (CVE-2026-90436)
  - id: T1068
    behaviour: Root escalation through the N-central maintenance helper (symlink + setLDFileOwner, then serverControl)
  - id: T1059.004
    behaviour: Shell command and piped script execution (download-and-run installer, Python stage)
  - id: T1105
    behaviour: Miner installer and binary fetched from an operator-controlled server
  - id: T1496.001
    behaviour: XMRig Monero miner on about half the CPU cores, low-and-slow
  - id: T1543.002
    behaviour: Persistence through a systemd unit
  - id: T1053.003
    behaviour: Persistence through user crontab or /etc/cron.d fallback
  - id: T1070.004
    behaviour: Stage two restores the original script, deletes the symlink and backup
  techniques_all_checked_active_in_pin: true
  techniques_note: Mappings are the research agent's, tied to behaviours Huntback describes; no source states ATT&CK ids for this chain. Existing entry already carries T1190, T1059, T1068, T1136, T1552, T1070.
  exposure:
  - 'On-premises N-central servers (hosted servers: N-able says not affected by the Legacy-API chain, though its later notice applies protections to hosted too). Researcher tested 2026.4.1.26 (HF2); Huntback saw compromised servers on HF2 and one on 2025.3.1.9.'
  - 'Condition per N-able and the researcher: Legacy API turned on and reachable (off by default). Huntback does not say whether it was on for the 21 victims. N-able KB for disabling it: ''How to Disable Legacy API settings on On-Premises N-central servers'' (URL surfaced on the N-able dashboard, not fetched).'
  - 'Huntback: the compromised servers were production MSP-branded servers; a compromised N-central server holds remote-management access to the customers behind it (Huntback, BleepingComputer).'
  detection:
  - 'Web server / reverse proxy logs: POSTs to the Axis SOAP endpoint under /dms/services/ServerUI whose body is a SOAP fault carrying an exceptionName element (Huntback names the class jline.internal.TerminalLineSettings; Huntress: the PoC receives an HTTP 500).'
  - 'Host: a symlink at the N-central flag file path, serverchild-* backup/script/output files in the N-central tmp directory, a transient change of the ServerChild.sh owner (maintenance-helper invocations setLDFileOwner then serverControl noop --wait), a new xvd.service systemd unit, a crontab line tagged # xvkeep or /etc/cron.d/xvd, a miner process hidden under /tmp/.xvd or /var/tmp/.xvd with CPU use at about half the cores, outbound connections to a mining pool and to an operator payload host (Huntback).'
  - 'Post-patch compromise check: Hotfix 2 does not evict or prevent this; Huntback: ''Treat a hit as a full compromise''.'
  triage: []
  caveats:
  - 'Conflict: N-able says it has ''seen no signs of compromise'' (dashboard event 202613, still showing at 2026-11-13 03:35 UTC) while Huntback (12:50 UTC 2026-11-12) lists 21 servers actively mining; N-able''s statement may simply not reflect the Huntback data, and N-able has not responded publicly in the sources read.'
  - Huntback's compromise count is an inference from a public mining-pool rig list and ordinary HTTPS checks of the labelled addresses; no victim or vendor confirmation; addresses unpublished; Tenable notes Huntback does not say whether the Legacy API was enabled.
  - BleepingComputer writes 'all 21 hosted N-central installations'; Huntback describes MSP-branded production servers and N-able says hosted is not affected by this chain, so 'hosted' is probably loose wording (treat as unresolved).
  - THN (earlier on 2026-11-12) said 'no evidence of successful exploitation as of writing'; Huntback/BleepingComputer/Tenable supersede it. Huntress's own 11-12 6:30 AM ET note ('has not observed exploitation ... in our partners' environments') pre-dates the Huntback report.
  - Previdian's page times differ slightly from BleepingComputer's ('approximately 08:30 UTC' vs sensors 08:24 / first 09:45 UTC); Previdian counts only 2 attempts from 1 IP.
  - BleepingComputer says Previdian tracks 'the N-central privilege escalation flaw' as VULN-2026-0009 while Previdian's page describes the whole 4EverAble2Shell chain under that id.
  - The researcher's claims (Agent2Shell, 10+ flaws, SYSTEM on agents) are unverified by N-able; Huntress had not confirmed Agent2Shell's Legacy API dependence.
  - 'N-able dashboard text read through the jina reader (the page is script-rendered; extract returns an empty shell; three of the reader''s keys were exhausted before one worked); event ids shift: THN/Huntress cite event 202609, the live 11-12 update is event 202613; the 202609 URL now serves the dashboard home. N-able''s blog post ''update-on-n-central-2026-4-hf2-and-ongoing-security-response'' (linked from the dashboard) was unreadable on all rungs.'
  - No Swiss victim or Swiss-specific statement found; Huntback's 21 contain none.
  - The researcher's GitHub repository (PoC code) was deliberately not fetched or linked; X posts by the researcher and watchTowr are not citable.
