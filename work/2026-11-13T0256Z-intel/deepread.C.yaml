    passage_en: From July to September 2026, the Ministry of National Education reported various security incidents targeting 25 of the 30 académies with operational impacts of varying criticality.
  - claim: 'Education: lateral movements were evidenced; the attacker accessed several decentralised national services and exfiltrated data.'
    source_url: https://www.cert.cyber.gouv.fr/uploads/CERTFR-2026-CTI-010.pdf
