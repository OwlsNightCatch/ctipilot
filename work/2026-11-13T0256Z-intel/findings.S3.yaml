      Defender takeaways the source supports: FortiOS CVE-2024-55591 is an old (January 2025) authentication bypass, so the first check is patch level and exposure of the HTTP/HTTPS administrative interface; on devices that were ever exposed while vulnerable, look for an administrator named "service" with the super_admin profile, any unexplained admin account or configuration change, and jsconsole activity in FortiGate event logs (Group-IB cites Fortinet's indicator list); assume the configuration was read and rotate local VPN passwords, administrator passwords, IPsec pre-shared keys and LDAP/RADIUS secrets, then review VPN logins and enforce MFA; enable FortiOS private data encryption (off by default, so stored secrets use the system default key and can be decrypted offline). For Exchange and web tiers: tunnelling web shells show as unfamiliar .aspx/.ashx/.jsp files, w3wp.exe opening connections to internal hosts on 445, 3389 or 5985, and long-lived high-volume POSTs to one page. For Hikvision: requests carrying the known CVE-2017-7921 bypass token in the auth parameter. Group-IB says the Swiss lists are scanning targets only; no source says any Swiss organisation was compromised, and the Swiss S3 repository is named only as a domain in shell history (not identified).
