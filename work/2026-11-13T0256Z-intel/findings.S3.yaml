    discovery_trace: "first seen at: checkpoint-research, feed https://research.checkpoint.com/feed/ (feed subcommand, newest item 2026-11-12) -> drilled: https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/ (extract) -> pivot: CVE link https://support.checkpoint.com/results/sk/sk1000362 (url bridge; the advisory text sits in the page's embedded JSON, not in the rendered HTML) -> pivot: https://support.checkpoint.com/results/sk/sk1000302 (url bridge, same embedded JSON) -> context: https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers (cited by the Check Point post, extract)"
    summary: |
      Check Point Research reports that from 2026-10-30, about a week after the PHP fix became available, an attacker scanned and exploited unpatched Check Point Security Gateways that expose the Mobile Access portal, using PHP2Shell (CVE-2026-109618 / CVE-2026-109619) for initial access and then CVE-2026-123039 for root. The first wave (2026-10-30) targeted Israeli organisations and included destructive activity; a broader second wave on 2026-11-02 hit organisations across several countries and sectors, with no destruction seen and no clear sector preference. In the investigated intrusion the attacker escalated from the portal service account to root through the DynamicCLI interface, wrote PHP web shells (zz*.tpl files in the portal's templates directory, later replaced by a fuller shell that takes a hardcoded key and writes uploads to /tmp/.up.tpl), started the TSGA passive backdoor (/tmp/CPconfigdaemon, relaunching itself as slot_CPconfigdaemon in the boot persistence directory) with an embedded TSProxy library (/lib/libcpfwcommon.so) injected into appliance processes, ran the open-source gogo scanner on the gateway, moved over SSH to a VMware ESXi host with the vpxuser service account, ran the destroy_v6 wiper there and left DREAM_ANNEXATION.txt notes. Check Point's own advisory for CVE-2026-123039 (CVSS 7.8: the root dynamic_server process listens on a world-writable /tmp/dynamic_socket and runs whatever a local caller sends) states that Check Point "observed an active exploit of this vulnerability against a couple of dozen customers"; it lists Force firewalls, management and log servers, Multi-Domain servers and Maestro on R81, R81.10, R81.20, R82, R82.10 and R82.20 as affected, Spark firewalls and Smart-1 Cloud as not affected, and the fix in Jumbo Hotfix Accumulator R82.20 take 14, R82.10 take 52, R82 take 132 and R81.20 take 174 (the same takes carry the PHP2Shell fix per sk1000302). Check Point says TSGA and TSProxy are modified variants of PhiliKit (documented by ESET, which associated it with UNC5221) sharing code, configuration and cryptographic material, but that the evidence does not allow a high-confidence assessment of the operation: the same actor, an initial-access broker, a false flag and a smokescreen for the destructive stage all remain plausible. Check Point notes that the wiper note uses the Dream Security brand and that Dream had recently published PHP2Shell research on PAN-OS, and says the timing raises, but the evidence does not establish, retaliation as a motive.
    region_nexus: "global; first wave Israeli organisations, second wave multi-country (Check Point does not name other countries); no source names Swiss victims"
    primary_sector_nexus: "direct for any public body running Check Point gateways with the Mobile Access portal or SSL VPN web interfaces exposed; no sector preference observed by Check Point"
