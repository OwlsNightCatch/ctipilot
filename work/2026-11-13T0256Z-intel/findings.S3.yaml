  - title: "AI-assisted intrusion at a US retailer: Symantec and Carbon Black see an operator relay command output to an AI model, then move from a SolarWinds Orion host to a second server within about 10 minutes by reading the bundled RabbitMQ Erlang cookie"
    sources:
      - { url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer", publisher: "Symantec and Carbon Black Threat Hunter Team", date: "2026-11-12", role: "primary" }
    discovery_trace: "first seen at: malware-news, feed https://malware.news/latest.rss?page=0 (topic 'How AI Revived a Stalled Attack on a U.S. Retailer', 2026-11-12 11:21 UTC; its summary carries the originating link) -> primary: https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer (extract)"
    summary: |
      Symantec and Carbon Black describe a September 2026 intrusion at a US retail organisation, one of dozens of AI-assisted attacks the team has investigated since May 2026 (most in September), in which the attackers' hand-typed commands on a compromised web server were all terminated by security software until the commands changed character: for almost two hours they submitted long, error-free PowerShell scripts with labelled output sections and comments that read as a model's reasoning. Symantec assesses the AI assistance with high confidence and an operator relaying output to an AI tool (rather than an autonomous agent) with moderate confidence, from gaps never shorter than seven seconds and the absence of scanner bursts or fixed-interval beaconing; the model or service could not be identified. Within about 10 minutes of first querying the SolarWinds Orion service on the web server the attackers read the Erlang cookie of the RabbitMQ message broker bundled with Orion, ran Orion's own erl.exe with that cookie to call the broker node on a second web server and run an OS command (encoded as decimal character codes), then harvested SAM, SYSTEM and SECURITY hives. Earlier activity on three SQL Server hosts ran cmd.exe under sqlservr.exe (most likely xp_cmdshell) from 2026-09-18; on the IIS web server cmd.exe ran under w3wp.exe, ASP web shells were written into the application's images folder, an EfsPotato exploit was compiled on the host with csc.exe for SYSTEM, and blocked DLL side-loading sets (a signed Bitdefender executable with log.dll, a G DATA executable with ask.dll) were relaunched through a tool called BreakChain that breaks the w3wp.exe parent link. Later steps included Zabbix agent key theft, searches for NTDS.dit, GPP cpassword and LAPS passwords, sa-account password guessing across SQL Servers and a password sprayer. Symantec assesses the attackers as most likely financially motivated (searches of point-of-sale scripts for passwords), found no data theft or encryption, notes that none of the second-phase techniques were new, and says a staging address matches one in Gambit Security's 2026-09-22 report on an AI-agent retail campaign (possible link, not stated by Gambit) and that loader files and staging server overlap an August 2026 intrusion at another organisation without signs of AI assistance.
    region_nexus: "US retailer; no EU or Swiss victim named; three further AI-assisted cases outlined (Vietnam university, East African ICT provider, South Asian hydroelectric company)"
    primary_sector_nexus: "indirect: IIS, SQL Server and SolarWinds Orion estates; the lateral-movement path through the bundled RabbitMQ node is portable to any Orion host"
    sector: "retail (victim); technique cross-sector"
    cves: []
    techniques: [T1505.003, T1505.001, T1059.001, T1068, T1574.001, T1003.002, T1552.001, T1110.003, T1572, T1134.004]
    affected_products: ["SolarWinds Orion", "Microsoft SQL Server", "Microsoft IIS", "RabbitMQ (bundled with SolarWinds Orion)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Symantec assesses the AI assistance with high confidence and the operator-in-the-loop model with moderate confidence."
        attribution: "Symantec and Carbon Black"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
      - quote: "About 10 minutes after first querying the victim's SolarWinds Orion monitoring software, the attackers had used a component bundled with it to run commands on a second server."
        attribution: "Symantec and Carbon Black"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
      - quote: "None of the techniques used in this second phase of the attack were new."
        attribution: "Symantec and Carbon Black"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
    extended_notes: |
      Detection concepts the source supports (telemetry class first): process-creation events with parent lineage on SQL Server hosts (cmd.exe under sqlservr.exe) and on IIS hosts (cmd.exe or PowerShell under w3wp.exe); the Orion-bundled erl.exe launched with -sname, -setcookie and an -eval rpc:call(... os,cmd ...) argument outside normal Orion operation, and reads of .erlang.cookie; PowerShell Invoke-WebRequest downloads into ProgramData followed by repeated relaunch of the same blocked binary five times in 20 minutes (the hand-typed phase); certutil decoding plus csc.exe compiling source from ProgramData (the EfsPotato build); a ProgramData executable named w3wp.exe or an mmc.exe used as launcher; WMI-launched processes that no longer descend from w3wp.exe; registry-hive saves (SAM, SYSTEM, SECURITY) to ProgramData subfolders; searches for NTDS.dit, SYSVOL cpassword and LAPS attributes. The AI-assist signature itself is behavioural: bursts of multi-section scripts with banner-labelled output (for example '=== ... ===') and no typos, 7+ second gaps, comments stating hypotheses.
      Hardening visible in the source: restrict RabbitMQ/Erlang distribution on Orion hosts and protect the Erlang cookie, remove SQL logins with sysadmin that applications do not need and disable xp_cmdshell, keep credentials and FTP/WinSCP/PuTTY settings out of web-server accounts. Symantec says the technique list is old and the change is speed and reliability, not novelty; keep the framing as an assessment owned by Symantec.
