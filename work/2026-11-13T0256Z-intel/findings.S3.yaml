    summary: |
      Unit 42 reports that from August to September 2026 Chinese-speaking attackers used a customised fork of the open-source Cairn AI penetration-testing framework, paired with Zhipu GLM 5.2 (13 operations) and DeepSeek V4 Flash/Pro (8 and 4 operations), to run 25 autonomous operations against at least 19 organisations, concentrated in three categories (seven in the semiconductor and advanced-manufacturing supply chain, three in defence and defence policy and four in human-rights and civil-society bodies). The operator supplied a root domain and a one-line goal in Chinese (obtain substantive high-value access such as web shell, SSH, source code, keys, credentials, ideally into the internal network); Cairn then planned three to seven stages, ran a reason-and-explore loop against a shared fact-intent graph for 20 minutes to more than 50 hours, and the attackers prepended a Chinese authorisation preamble and generated an AUTHORIZATION.md per operation, which neither model refused. Unit 42 confirmed unauthorised access or data retrieval at 10 organisations: weak-password spraying against an internet-facing application server that yielded dozens of valid credentials, an unauthenticated cloud-storage write that overwrote a live standards-ballot document, a brute-forced production credential valid across accounts followed by new administrator accounts and a persistent API token, an unauthenticated account-creation bypass on a content-management system (more than a million member records), and an open registration endpoint exposing about 500 user records including .mil and .gov domains. Unit 42 assesses with moderate confidence a China-nexus intelligence-collection campaign (cluster CL-STA-1238, from Chinese-language artefacts, exclusively Chinese models and target selection) and judges the operator likely a single person or small team; it stresses that the exploited weaknesses were known (authentication bypasses, insecure direct object references, mass-assignment privilege escalation, weak or default credentials, exposed cloud APIs, dated public CVEs) and that autonomous AI raises the volume and coverage of exploitation, not its complexity.
