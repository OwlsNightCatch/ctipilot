  - title: "Check Point Research confirms PHP2Shell exploitation of Mobile Access gateways from 2026-10-30, chained with root escalation CVE-2026-123039 (vendor: exploited against 'a couple of dozen customers'), TSGA and TSProxy implants and an ESXi wiper"
