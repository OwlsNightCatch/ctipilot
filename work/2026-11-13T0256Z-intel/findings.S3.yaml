mmits across 28 WebdriverIO repositories with no WebdriverIO package release affected. Affected published artefacts StepSecurity lists are three packages (a Packagist package version and two Go module tags/pseudo-versions); StepSecurity notes overlap with the GhostAction wave (three samples landed in a leftover security-audit.yml that still reported to the October collection server) and a PolinRider-style VS Code task, but says neither overlap proves a single actor.
