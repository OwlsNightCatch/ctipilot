    summary: |
      Elastic Security Labs tracks REF3364, a Linux cryptomining intrusion in which an attacker reached three GPU hosts through an exposed Ray job agent that accepted job submissions without authentication (the Ray head-node dashboard listened only on loopback, the job agent did not): external probes from 2026-10-22, an nvidia-smi job that sent the GPU inventory out on 2026-10-24 and a Python reverse-shell job on 2026-10-25, after which an SSH key was added to the Ray session account's authorized_keys and root was obtained. The toolkit, staged under /opt/vadi_, comprises SANSAR (a Rust orchestrator that runs XMRig for CPU and SRBMiner-MULTI for GPU, receives 16 command types over Tor with obfs4 and WebTunnel bridge support and starts interactive shells with history disabled), a modified libnvidia-ml.so.1 that makes nvidia-smi report 0% GPU utilisation and random 36-46 degree and 100-200 watt readings (installed over the original with a backup at /usr/lib/.libnvidia-ml.so.1.backup), an ftrace-based rootkit module acpi_thermal_mgr built through DKMS and loaded again at boot from the initramfs (it hides selected processes, directory entries and TCP/UDP socket entries) and a separate backdoor, netns, registered as a systemd service, that reads its controller IPv4 address from an Ethereum smart contract through public RPC services and opens reverse shells on command with no authentication. Elastic ends with advice to check who can submit jobs to GPU/AI clusters and whether GPU monitoring libraries were modified, and publishes YARA rules for SANSAR and netns.
