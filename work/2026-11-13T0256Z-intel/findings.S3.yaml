  - title: "SignDrop: public, unpatched Windows CLFS local privilege escalation to SYSTEM that abuses Microsoft's own CLFS authentication mitigation through Defender's signature-update RPC; no CVE, no patch, no exploitation reported"
    sources:
      - { url: "https://www.cyderes.com/howler-cell/signdrop-zero-day", publisher: "Cyderes Howler Cell", date: "2026-11-12", role: "primary" }
      - { url: "https://github.com/MSNightmare/SignDrop", publisher: "MSNightmare (Nightmare-Eclipse), PoC repository README", date: "2026-11-10", role: "corroborating" }
    discovery_trace: "first seen at: malware-news, feed https://malware.news/latest.rss?page=0 (item 'SignDrop Zero-Day Turns Windows CLFS Defense Into Privilege Escalation', 2026-11-12 13:45 UTC, its summary carries the originating link) -> primary: https://www.cyderes.com/howler-cell/signdrop-zero-day (extract, then WebFetch for the detection table) -> corroborating: https://github.com/MSNightmare/SignDrop (WebFetch of the repository page; no exploit code read)"
    summary: |
      Cyderes Howler Cell reports that the Nightmare-Eclipse researcher (GitHub handle MSNightmare) published SignDrop on 2026-11-10, the day of November Patch Tuesday, with no coordinated disclosure, no CVE and no patch, and that its team reproduced a SYSTEM shell from a standard user session. The chain is a logic bug with no memory corruption: CLFS containers are created through Object Manager symbolic links, an oplock on a bait file confirms that Microsoft Defender has engaged, a call to Defender's signature-update RPC makes clfs.sys create its .cnpf authentication-signature file as SYSTEM at an attacker-chosen path (hid.dll in the Common Files\microsoft shared\ink directory, a file that does not ship with Windows), the file content is replaced with a payload DLL, and a runas request makes consent.exe load it, spawning a SYSTEM conhost.exe on the user's desktop. Hosts where the CLFS Authentication Mode registry value is 0 or 1 are in scope (the README says 2 or 3 are not vulnerable); the researcher's claim that about 80% of Windows installations are vulnerable is unsubstantiated, and the README lists testing on Windows 11 26H2 and Windows Server 2025. Cyderes found no confirmed in-the-wild exploitation as of 2026-11-10 and Microsoft had made no advisory or public comment as of 2026-11-11; Cyderes says turning CLFS authentication off is not a remedy because it re-exposes the older CLFS memory-corruption primitives. This is Howler Cell's ninth report on the cluster, which Cyderes counts at sixteen public zero-day releases across seven months (the first on 2026-04-03).
    region_nexus: "global"
    primary_sector_nexus: "indirect: any Windows 11 / Server 2025 estate; requires local code execution first"
    sector: "cross-sector"
    cves: []
    techniques: [T1068, T1574.001, T1070.004]
    affected_products: ["Microsoft Windows 11", "Microsoft Windows Server 2025", "Microsoft Defender"]
    entity_keys: ["actor:nightmare-eclipse", "product:microsoft-windows", "product:microsoft-defender-antivirus"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The exploit was published on November 10, 2026, under the MSNightmare handle on GitHub. No coordinated disclosure, no CVE, no patch."
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/signdrop-zero-day"
      - quote: "No confirmed in-the-wild exploitation has been identified as of November 10, 2026."
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/signdrop-zero-day"
      - quote: "Disabling the mitigation is not a viable remediation."
        attribution: "Cyderes Howler Cell"
        source_url: "https://www.cyderes.com/howler-cell/signdrop-zero-day"
      - quote: "If it's set to 0 or 1 then you're vulnerable."
        attribution: "MSNightmare README"
        source_url: "https://github.com/MSNightmare/SignDrop"
    extended_notes: |
      Same cluster as the store's earlier Nightmare-Eclipse entries (ShieldBreak, LegacyHive, GreatXML and others) and as the Defender-chain drops; novelty new because SignDrop has no entry yet (prior_coverage contains none).
      Detection (telemetry class first; Cyderes ranks the first two as highest signal and says no event IDs are given): file-creation telemetry for hid.dll written under C:\Program Files\Common Files\microsoft shared\ink\ by a SYSTEM-context write (the file does not ship with Windows; the exploit deletes it afterwards, so retain file-create and image-load telemetry); Defender signature-update RPC (Proc42_ServerMpUpdateEngineSignature) called by a process outside the Defender service tree; MpEngine.dll created outside Defender installation paths; Object Manager symbolic-link creation or repointing under \BaseNamedObjects\Restricted\ (including a link named mpasbase.vdm) correlated with Defender RPC activity; consent.exe loading a DLL from the ink directory or terminating without user action; a SYSTEM conhost.exe on the interactive desktop shortly after a hid.dll write; osk.exe terminated and relaunched hidden by a user process; DeviceIoControl 0x8007A808 to CLFS from a user process; the %TEMP%\SigDrop_<GUID> folder is a tripwire for the unmodified PoC only.
      Hardening: inventory HKLM\SYSTEM\CurrentControlSet\Services\CLFS\Authentication Mode across the estate to size the exposed population (0 or 1), restrict untrusted local code execution with application control and script control, do not disable CLFS authentication, and treat the absence of a Microsoft advisory as no fix; expect follow-up releases from the same researcher.
      Cyderes' own caveat: the 80% exposure figure is the researcher's and unverified; exposure conditions are broad. SecurityOnline, listed in Cyderes' references, returned HTTP 503 to WebFetch and is not cited.

