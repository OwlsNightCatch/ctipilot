    extended_notes: |
      Delta against the existing entry 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways: that entry says sk1000302 makes no statement on exploitation of Check Point products. Exploitation against Check Point gateways is now confirmed by the vendor's own research and by sk1000362, and the chain adds a root escalation, a persistent implant and a destructive stage. Suggested priority: high (exploited edge device with a wiper stage). The post names no Swiss victim.
      Exposure (from sk1000302, last modified 2026-11-12): Force, Spark and Cloud firewalls that use Mobile Access (not on Spark), Remote Access VPN with SSL Network Extender (not on Spark), SAML-realm VPN authentication, the Identity Awareness captive portal, UserCheck or Zero Phishing; R81.20, R82, R82.10, R82.20 supported, R80 to R81.10 end of support; sk1000302 also gives a cp-httpd.conf mitigation that denies multipart Content-Type requests until the hotfix is installed. For CVE-2026-123039 (sk1000362) the attacker already needs local code execution; the vendor mitigation is to stop dynamic_server (dbset process:dynamic_server, dbset :save), which breaks the Dynamic CLI commands listed in its sk144112.
      Detection (telemetry class first): web-server and portal crash telemetry (Check Point saw hundreds of segmentation faults in the portal's Apache/PHP workers), PHP session files containing the upload_progress_pwn marker under the Mobile Access temp directory, new zz*.tpl files and a challenge_render.tpl in the portal templates directory, root-level commands in /var/log/dynamicCli.log without the expected Clish wrapper ("Received =" lines; sk1000362 gives the grep), after the fix "Rejected connection from unauthorized uid" lines (a non-zero or unexpected uid means a blocked escalation attempt) and /tmp/dynamic_socket mode 0660 instead of 0777, an unexpected process named slot_CPconfigdaemon, a listener on TCP 11072 on all interfaces, the gogo scanner on the gateway, SSH from the gateway to ESXi hosts as vpxuser (ESXi authentication logs) and mass file deletion plus DREAM_ANNEXATION.txt on ESXi. Post-patch compromise check: Check Point describes TSGA as having backup and snapshot persistence, so a patched or restored gateway can still carry the implant; the zz*.tpl shells and a hidden /tmp/.bd.log are further artefacts. No hashes or addresses are carried here.
      Attribution handling: Check Point lists three observations that do not fit a China-nexus actor (destructive operation, Israel focus with a Hebrew wiper note, the Philistine-derived internal name) against infrastructure on LightNode VPS and activity concentrated 00:00-09:00 UTC; report it as Check Point's open assessment, not an actor attribution.
      Related but separate: Dream Security and Unit 42 on PHP2Shell chained with a kernel LPE against PAN-OS (already covered in entry 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release).

