    summary: |
      In late July 2026 Group-IB found an open directory on a Latvian server that exposed the operator's /root/ directory (457 files, 35 recovered, 3.1 GB) and documented more than 14 months of operations against Europe; Group-IB tracks the operator as DarkLunnen, has not linked it to any known actor and does not establish nationality or state affiliation. The main campaign used a modified watchTowr proof of concept for FortiOS CVE-2024-55591 that, on success, creates an administrator named "service" with the super_admin profile; recovered scan results list about 600 vulnerable devices in Turkey (hospitals, industry, municipalities), 16 in Ukraine, 14 in Azerbaijan and 1 in Algeria, and a stolen FortiGate 81F configuration from a Romanian organisation carries the same account and yielded 10 cleartext VPN passwords. Group-IB also recovered FortiGate target lists for Switzerland (4,725 targets), South Korea and Ireland, which it says identify scanning targets and do not confirm vulnerability or exploitation, and the shell history includes restic commands with AWS credentials that enumerated production snapshots in an S3 backup repository at a Swiss domain (May-June 2025). Other recorded activity: a VNC brute-force run over 5,775 reachable endpoints (about a quarter with HMI-like or ICS-like desktop names), Hikvision CVE-2017-7921 checks against 12,183 Ukrainian and Polish addresses, reGeorg/Neo-reGeorg/suo5 tunnelling web shells on Exchange servers in the US and Europe (June 2025 to January 2026), NetExec and NTLM-hash use against a German organisation (14-16 July 2026), Roundcube CVE-2025-49113 attempts and a Sliver server set up in July 2026. Most operations rest on recorded commands only; 422 files, among them a Sliver database, a Kerberos golden ticket and credential databases, were not recovered.
    region_nexus: "Europe-wide targeting; direct Swiss element (4,725 FortiGate scanning targets, S3 backup repository at a Swiss domain); Group-IB gives no evidence that a Swiss device was exploited"
