      Hardening the source gives: restrict or block the device-code flow with Conditional Access where it is not needed, further conditional-access policies, phishing-resistant MFA, treat unexpected "enter this code" prompts as suspicious and verify through a known contact. The compromised account had no MFA enrolled (ATT&CK table row in the post). No IOCs carried.

