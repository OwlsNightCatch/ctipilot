      Akamai's Larry Cashdollar analysed one sample of a Windows remote access trojan and stealer kit that he names StrikeStub after its embedded StrikeStub/1.0 user agent, reached from a ClickFix "Verify you are human" page on a compromised .ch website (the page names it) that copies a hidden PowerShell download-and-run command to the clipboard for the victim to paste into the Run dialog. The 1.4 MB MinGW/GCC-built PE masquerades as RuntimeBroker.exe with a fake Microsoft version resource and manifest (the real RuntimeBroker.exe is built with MSVC, so GCC/libstdc++ exception-handling symbols are a static differentiator), drops a second identity as \Microsoft\WindowsUpdate.exe in the user's Startup folder and also persists through the Run key, protects almost all strings with a compile-time XOR scheme keyed with a Fibonacci-hashing multiplier (67 strings recovered), and talks to its C2 over a WebSocket (WinHTTP) with an enrollment-challenge and hello handshake, the C2 address coming from a runtime config that Akamai did not recover. Recovered capabilities are keylogging, hidden VNC (HVNC) with keyboard, cursor and display selection, webcam and live screen capture, clipboard monitoring, an embedded binder that drops and launches further payloads, browser credential theft (DPAPI for Chromium variants, profile cloning for locked Firefox databases) and an anti-multi-instance mutex. Akamai assesses it as a likely malware-as-a-service builder kit comparable to DcRat/AsyncRAT derivatives and lists open items: 169 of 236 decode sites unresolved, the C2 config not found and a companion sample not yet checked.
    region_nexus: "delivery page hosted on a compromised Swiss (.ch) website; no victim named"
    primary_sector_nexus: "indirect: ClickFix against Windows desktops in any sector"
    sector: "cross-sector"
    cves: []
    techniques: [T1204.004, T1059.001, T1036.005, T1547.001, T1056.001, T1021.005, T1555.003, T1115, T1071.001]
    affected_products: ["Microsoft Windows"]
    entity_keys: []
    new_entities:
      - { key: "malware:strikestub", type: malware, name: "StrikeStub", aliases: [], summary: "Modular Windows RAT and stealer kit (HVNC, keylogger, webcam and screen capture, clipboard monitor, binder, browser credential theft, WebSocket C2) named by Akamai after its StrikeStub/1.0 user agent, spread through a ClickFix page and masquerading as RuntimeBroker.exe and WindowsUpdate.exe; assessed as a likely malware-as-a-service builder kit (Akamai, 2026-11-12)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "single-sample static analysis with open items (C2 not recovered), commodity ClickFix delivery already well covered; kept only for the compromised .ch delivery site and the concrete masquerading and persistence hooks"
    evidence:
      - quote: "The ClickFix malware is a full-featured, modular Windows remote access trojan (RAT) and stealer kit likely distributed as malware as a service (MaaS)"
        attribution: "Akamai"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/strikestub-clickfix-powershell-malware-modular-rat"
      - quote: "The embedded User-Agent string StrikeStub/1.0 strongly points to the actual family or builder product name."
        attribution: "Akamai"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/strikestub-clickfix-powershell-malware-modular-rat"
    extended_notes: |
      Detection (telemetry class first): process-creation events for powershell with a hidden window and Invoke-WebRequest launched from the Run dialog (explorer.exe parent) followed by an executable in %TEMP%; a process whose image is named RuntimeBroker.exe outside C:\Windows\System32 or whose file is not Microsoft-signed, and a WindowsUpdate.exe under the user's Startup\Programs\Microsoft folder; Run-key creation pointing to the same; a signed-vendor-looking binary making WinHTTP WebSocket upgrades to a non-Microsoft host; browser profile directories copied while the browser runs; HVNC shows as a hidden desktop created by a non-system process. Benign lookalike: genuine RuntimeBroker.exe runs from System32 with Microsoft signing and MSVC build; the discriminators are path, signature and parent. Hardening: ClickFix is stopped by blocking or logging Win+R launches of PowerShell where feasible and by training; keep the compromised-site angle in mind for web-filter reputation (a legitimate .ch site serving the lure). No IOCs carried (the post names the lure site and the download host; omitted).

  # ------------------------------------------------------------------ 10
  - title: "CVE-2026-126187, React Server Components Flight transport (react-server-dom-webpack, -parcel and -turbopack 19.0.0 to 19.0.8, 19.1.0 to 19.1.9, 19.2.0 to 19.2.8, 19.3.0): a silently starved binary row lets crafted typed-array payloads smuggle a module row and run code, CVSS 4.0 9.5; fixed in 19.0.9, 19.1.10, 19.2.9 and 19.3.1, vendor calls the trigger conditions extremely rare, no exploitation reported"
    sources:
      - { url: "https://www.stepsecurity.io/blog/cve-2026-126187-react-flight-rce", publisher: "StepSecurity", date: "2026-11-12", role: "primary" }
      - { url: "https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3", publisher: "React (GitHub security advisory GHSA-xqc2-xf4c-x3h3)", date: "2026-10-14", role: "corroborating" }
    discovery_trace: "first seen at: stepsecurity-blog, feed https://www.stepsecurity.io/blog/rss.xml (item 'CVE-2026-126187: React Server Components Flaw Lets Attackers Execute Code Through Smuggled Flight Rows', Thu, 12 Nov 2026 15:00 GMT) -> drilled: https://www.stepsecurity.io/blog/cve-2026-126187-react-flight-rce (extract; links the advisory) -> primary: https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3 (WebFetch, then extract and url to verify the quote and the date)"
    summary: |
      StepSecurity analyses CVE-2026-126187, an unauthenticated remote code execution in the Flight transport of React Server Components (CWE-502, CVSS 4.0 9.5, network, no privileges, with preconditions), for which the React advisory GHSA-xqc2-xf4c-x3h3 lists react-server-dom-webpack, -parcel and -turbopack 19.0.0-19.0.8, 19.1.0-19.1.9, 19.2.0-19.2.8 and 19.3.0 as affected and 19.0.9, 19.1.10, 19.2.9 and 19.3.1 as fixed; most applications pull these packages in transitively through an RSC framework such as Next.js, React Router framework mode or a Vite RSC plugin, and client-only React applications and applications with no RSC-capable framework are not affected. StepSecurity's reconstruction from the five backport pull requests says the writer, for typed arrays above 2,048 bytes, hands the application's own ArrayBuffer to the destination without copying, so a consumer that transfers the backing store leaves a binary row header promising bytes that never arrive; the client parser then consumes the following rows as payload, resynchronises inside attacker-controlled bytes and executes a smuggled module row. The advisory names the precondition that a response transports multiple typed arrays alongside an attacker-controlled value and calls it extremely rare; StepSecurity says which production consumers detach backing stores is deployment-specific and that it reproduced the chain end to end only in a lab. No source reports exploitation or a public exploit; StepSecurity notes this is the second serious Flight bug in twelve months (after CVE-2025-55182, CVSS 10.0).
    region_nexus: "global"
    primary_sector_nexus: "indirect: web portals and e-government applications built on Next.js or other RSC frameworks"
    sector: "cross-sector"
    cves: [CVE-2026-126187]
    techniques: [T1190]
    affected_products: ["react-server-dom-webpack", "react-server-dom-parcel", "react-server-dom-turbopack", "Next.js (transitively)", "React Router (framework mode)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "vulnerability item that belongs to S1 (returned here because StepSecurity is in the S3 slice); CVSS 9.5 and widely deployed stack, but the advisory calls the trigger 'extremely rare', no exploitation or PoC is reported, and the advisory's published date is unresolved"
    evidence:
      - quote: "The bug is unauthenticated remote code execution in React Server Components (RSC)."
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/cve-2026-126187-react-flight-rce"
      - quote: "This only affects extremely rare cases where responses transport multiple typed arrays and an attacker-controlled value."
        attribution: "React advisory GHSA-xqc2-xf4c-x3h3"
        source_url: "https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3"
    extended_notes: |
      Date discrepancy to resolve before anything is composed: StepSecurity says the React team published the CVE and shipped fixes on 2026-11-10, but the GitHub advisory page itself carries a timestamp of 2026-10-14T17:08:26Z (page datetime attribute, extract metadata 2026-10-14), so the advisory may be about four weeks older than StepSecurity's post. S1 should read the advisory and the fixed releases directly (CCCS also issued a React advisory AV26-1152 on 2026-11-12 per the malware.news feed, not fetched here).
      Exposure check the source gives: npm ls react-server-dom-webpack react-server-dom-parcel react-server-dom-turbopack and a grep of package-lock.json; the resolved version, not the declared one, matters. Interim mitigation per the fix guidance: never transport multiple views of one ArrayBuffer in RSC payloads (copy with slice() before rendering). Corruption signature StepSecurity names: a binary Flight row (id:o<len>) whose declared length exceeds the bytes that follow in a response, and clients logging 'Connection closed' after responses with large typed arrays. The patched parser still executes a deliberately corrupted stream; the fix relies on a writer-side invariant.

