  - title: "Device-code phishing hidden in a fake Microsoft Teams meeting-booking flow: Huntress traces a spear-phish through a Google short link to a WebCrypto-decrypted kit that re-prompts on MFA and replays the token through a residential proxy, against a Microsoft 365 account with no MFA enrolled"
    sources:
      - { url: "https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing", publisher: "Huntress", date: "2026-11-12", role: "primary" }
    discovery_trace: "first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (newest item 2026-11-12 was SCKit; this post was not yet in the feed) -> WebFetch of the blog listing https://www.huntress.com/blog (listed 'Crafty Microsoft Teams Booking Flow Disguises Device Code Phishing', November 12, 2026) -> primary: https://www.huntress.com/blog/crafty-microsoft-teams-booking-flow-disguises-device-code-phishing (extract)"
    summary: |
      Huntress describes a mid-October 2026 intrusion at a construction-industry company in which a spear-phishing email impersonating a senior vice president (from a typosquatted domain registered eight days earlier) led, through a Microsoft Safe Links-wrapped Google short link that Huntress says sidestepped URL-reputation checks, to a "Microsoft Teams Meeting Scheduler" page. Behind the page the kit started a Microsoft device-code sign-in and showed the resulting user code as a "Booking Reference"; clicking "Confirm Meeting" copied it to the clipboard and opened Microsoft's real device-login page, so entering the code authorised the attacker's session, after which the victim was redirected to a genuine-looking Calendly page. The kit ships as AES-256-GCM ciphertext decrypted in the browser (a non-JavaScript scanner sees an encrypted blob), shows a fake "additional verification" pop-up when the backend supplies a mirror URL, and, if Microsoft returns AADSTS50076 or interaction_required because MFA is required, restarts the device-code flow and shows the victim a new code. After the victim entered the code the attacker's Microsoft Authentication Broker (Cmsi:Cmsi) device-code sign-in succeeded, routed through a residential callback proxy, from an unmanaged non-compliant device against an account that had no MFA enrolled; Huntress contained the incident before escalation. Programmatic user agents such as python-requests and node appeared in the later sign-in logs, often only in the non-interactive log.
    region_nexus: "global; observed at a company in the construction industry (country not stated); the technique class matches the device-code phishing campaign that Canton Vaud warned of for Romandie on 2026-11-04"
    primary_sector_nexus: "direct for any Microsoft 365 tenant that permits the device-code flow; nothing in the post is sector-specific"
