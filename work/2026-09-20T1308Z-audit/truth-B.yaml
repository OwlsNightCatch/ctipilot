- entry: entries/2026-09-19/waterplum-contagious-interview-joint-advisory-scale.md
  verdict: imprecision
  defect: >
    All four evidence[] quotes, the "313 General Bureau of the Munitions Industry Department"
    attribution, the "laptop farm" first-in-Japan claim, the five named malware families, the
    extortion/defacement anecdotes, and the BfV "also in Germany" translated claim were verified.
    The PDF (ic3.gov/CSA/2026/260918.pdf) extracts with a systematic character-shift artifact in
    this tool chain that drops all embedded numerals (30,000 / 100 / 7,000 / 313 / 1.7 billion all
    vanish from the extracted text, e.g. "haveinfectedatleast[GAP]devicesinmorethan[GAP]countries"),
    so the specific figures could not be confirmed directly from the PDF text itself; they were
    independently corroborated via therecord.media ("at least 30,000 devices across 100 countries
    ... about 7,000 cryptocurrency wallets") and multiple other outlets confirming "$10.7 million"
    and "313 General Bureau," so the entry's numbers are correct notwithstanding the PDF-extraction
    gap. Note therecord.media itself states "more than $10.5 million" (vs. the entry's $10.7M/1.7bn
    JPY figure cited to the FBI/IC3 PDF directly) — a minor discrepancy on The Record's side, not
    the entry's, since $10.7M is independently confirmed by Forbes and other outlets as the
    advisory's own figure. Also present: 14 em dash characters (house-style note, non-reader-visible
    per render-time dedash).
  ground_truth: >
    therecord.media (2026-09-18, fetched 2026-09-20) confirms "at least 30,000 devices across 100
    countries" and "about 7,000 cryptocurrency wallets"; the decoded IC3 PDF text confirms the "313
    General Bureau of the Munitions Industry Department" attribution sentence and the "laptop farm"
    sentence verbatim (numerals aside). No factual correction needed to the entry's figures.
  ground_truth_url: "https://therecord.media/north-korean-hackers-infect-thousands-of-devices-waterplum-scheme"
