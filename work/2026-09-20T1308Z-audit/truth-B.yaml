- entry: entries/2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain.md
  verdict: factual-error
  defect: >
    Title, summary and body all state Sansec found the ClickFix/backdoor payload reached "up to
    100,000 customer sites" ("an upper-bound count," per the body's own gloss). Sansec's article
    states the opposite direction: "Brevo served malware to visitors of its own site and more than
    100 thousand customer sites" (linked to a live publicwww.com site-count search) — a LOWER bound,
    not an upper one. "Up to 100,000" and "more than 100,000" are not interchangeable: the entry
    systematically inverts Sansec's own quantifier direction across three surfaces (title, summary,
    body), understating the scope Sansec actually reported. All other claims (the 15:01-20:30 UTC /
    5h29 impact window, the 16:07 UTC JS-file-append timing, the Aug 25 SSL-cert dating of attacker
    access, all four evidence[] quotes, the Sept 10 SSO-incident/Trezor cross-reference) verified
    verbatim against Brevo's write-up, Sansec and BleepingComputer. Also present: 4 em dash
    characters (house-style note, non-reader-visible per render-time dedash).
  ground_truth: >
    Sansec (sansec.io/research/brevo-supply-chain-attack, fetched 2026-09-20): "On 14 September,
    Brevo served malware to visitors of its own site and more than 100 thousand customer sites,"
    linking to a live publicwww.com count of sites embedding "brevo.com" | "sibforms.com" |
    "sibautomation.com". The entry should state "more than 100,000" (or "at least 100,000"), not
    "up to 100,000."
  ground_truth_url: "https://sansec.io/research/brevo-supply-chain-attack"

- entry: entries/2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat.md
  verdict: factual-error
  defect: >
    All three CVEs' CVSS scores (including the dual kernel-CNA/NVD-re-score notation), fixed-kernel
    version tables, and both NVD-attributed evidence[] quotes verified letter-for-letter against
    live NVD JSON for CVE-2025-39682, CVE-2025-39964 and CVE-2026-53266, and against the live CISA
    KEV catalog (all three still listed, dateAdded 2026-09-18 matches). However the sourcing_note's
    claim — "no vendor (Red Hat, Ubuntu, Debian, SUSE) ... adds exploitation detail beyond
    re-listing the fixed kernel builds" — is contradicted by Red Hat's own advisory pages for all
    three CVEs. The Hacker News (2026-09-19, thehackernews.com/2026/09/cisa-flags-three-linux-kernel.html)
    reports Red Hat updated all three advisories "as of September 19, 2026, at 2 a.m. UTC to
    acknowledge active exploitation," quoting Red Hat: "This CVE is high risk and there are known
    public exploits leveraging this vulnerability." I independently confirmed this exact string is
    served in the client-side message catalog of access.redhat.com/security/cve/cve-2025-39682 (the
    known_exploit_vulnerability i18n key), consistent with the exploit-status banner The Hacker News
    describes; I could not execute the page's client-side rendering to confirm the flag is toggled
    true for this specific CVE, so this sub-point is (low confidence), but The Hacker News's specific,
    dated, on-topic quote naming these exact three CVE URLs is itself sufficient to contradict the
    sourcing_note's blanket "no vendor adds exploitation detail" claim. Red Hat's 2 a.m. UTC update
    also precedes this entry's own discovered_at (04:33 UTC same day), so the claim was already
    stale at publication, not merely overtaken since. This also weakens the single-source-national-cert
    framing: Red Hat is a second party independently acknowledging exploitation, not merely
    re-listing fixed builds. Also present: 12 em dash characters (house-style note).
  ground_truth: >
    The Hacker News (2026-09-19, fetched 2026-09-20): "Red Hat has updated the advisories for all
    the flaws as of September 19, 2026, at 2 a.m. UTC to acknowledge active exploitation. 'This CVE
    is high risk and there are known public exploits leveraging this vulnerability,' Red Hat said."
    This directly names access.redhat.com/security/cve/cve-2025-39682, cve-2026-53266 and
    cve-2025-39964 as the updated pages. The sourcing_note and verification rationale should be
    revised to reflect Red Hat's corroboration rather than treating CISA as the sole disclosing
    party with no vendor exploitation detail.
  ground_truth_url: "https://thehackernews.com/2026/09/cisa-flags-three-linux-kernel.html"

