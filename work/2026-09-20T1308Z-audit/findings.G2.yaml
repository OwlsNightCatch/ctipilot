items:
  - title: "France's AFPA (national adult-training agency) confirms a data-extraction incident via a third-party accommodation-management tool, potentially exposing up to 1.7 million people — the same actor who exposed 101 AFPA accounts a month earlier"
    sources:
      - { url: "https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-15", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8", publisher: "FrenchBreaches", date: "2026-09-19", role: "primary" }
    discovery_trace: "first seen at: watch-item re-check per audit spawn (Afpa bare leak-site claim, standing since 2026-09-13 audit) → WebSearch (\"Afpa cyberattaque confirmée 2026\") → pivot: FrenchBreaches, URL https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8 (2026-09-16 base article, updated 2026-09-19 with AFPA's own confirmation) → primary: Cyberattaque.org, URL https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/ (2026-09-15, carries AFPA's own statement verbatim and the third-party-tool detail FrenchBreaches' base article lacked)"
    summary: |
      The Agence nationale pour la formation professionnelle des adultes (AFPA), a French national public
      agency for adult vocational training, confirmed on 2026-09-15 that it had identified a potential data
      extraction after two separate criminal-forum claims published 24 hours apart in mid-September: xMetah
      claimed 971,420 records, and Cybernox — the same actor who had exposed 101 AFPA accounts and an
      administrator access a month earlier — claimed 1,732,811 rows of user data spanning 2006-2026 (names,
      dates of birth, postal addresses, phone numbers). Cybernox's own claim attributes access to an IDOR
      (Insecure Direct Object Reference) flaw; AFPA has not confirmed that specific technical claim but states
      its own investigation traced a "potential extraction" to a flaw in the tool AFPA uses to manage
      accommodation bookings for trainees, which is hosted by an external third-party vendor outside AFPA's own
      information system — meaning AFPA's core IS and services are stated as unaffected. AFPA has not
      established whether the two criminals' datasets overlap, so the two claimed volumes should not be summed.
      A follow-up FrenchBreaches update dated 2026-09-19 confirms AFPA maintains that "a priori" no sensitive
      data (financial, health) is involved. This is the fourth confirmed or claimed French public-sector data
      exposure via a third-party-hosted tool or stolen credential this audit window has tracked (alongside the
      already-covered DGFiP, Éducation nationale and Ministère de la Transition écologique incidents), and the
      actor (Cybernox) is already tracked in the registry against the DGFiP-adjacent SDIS fire-and-rescue data-leak
      campaign — a recurring actor working the French public-sector/vendor-trust-boundary seam.
    region_nexus: "France (EU neighbour); no direct Swiss nexus, but same transferable pattern (third-party-hosted tool holding a public agency's PII, exploited/claimed via a web-application flaw) already recurring against French public-sector bodies this window"
    primary_sector_nexus: "indirect — public-sector vendor/third-party-tool exposure pattern transferable to Swiss cantonal/communal administrations using outsourced SaaS tools for citizen- or trainee-facing services"
    sector: "public-sector"
    cves: []
