      - quote: "L'AFPA ne confirme pas précisément ce scénario technique, mais indique avoir identifié lors de ses premières investigations une potentielle extraction liée à une faille sur un outil utilisé pour gérer les hébergements."
        attribution: "Cyberattaque.org"
        source_url: "https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/"
      - quote: "L'AFPA confirme le piratage revendiqué par deux hackers, pouvant concerner jusqu'à 1,7 million de personnes, tout en affirmant qu'« a priori » aucune donnée sensible n'est concernée."
        attribution: "FrenchBreaches (update, 2026-09-19)"
        source_url: "https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8"
    extended_notes: |
      Not attributed to any of this window's already-tracked France public-sector actors (ZeroBytes, Epsilon
      collective) — Cybernox is a distinct, already-registered actor. Worth a future-run watch: whether the
      "third-party tool exploited via unconfirmed IDOR" pattern recurs against a fourth French public body,
      which would justify a standalone TTP/trend write-up rather than one-off incident entries.
    coverage: "GAP"

  - title: "Switzerland's federal data-protection authority (EDÖB) and privatim publish joint guidance on digital surveillance (cameras, IR sensors, radar) of patients and care recipients in cantonal hospitals and care facilities"
    sources:
      - { url: "https://www.edoeb.admin.ch/de/newnsb/tbRqnj30sW2P", publisher: "EDÖB (Swiss Federal Data Protection and Information Commissioner)", date: "2026-09-16", role: "primary" }
      - { url: "https://www.privatim.ch/de/digitale-ueberwachung-in-pflegeeinrichtungen-edoeb-und-privatim-veroeffentlichen-gemeinsamen-leitfaden/", publisher: "privatim (Swiss Conference of Data Protection Commissioners)", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch RSS feed lead (netzwoche.ch/swisscybersecurity.net headline \"EDÖB veröffentlicht Leitfaden zur digitalen Überwachung in Pflegeeinrichtungen\", 17.09.2026) → WebSearch (\"EDÖB Leitfaden digitale Überwachung Pflegeeinrichtungen September 2026\") → primary: EDÖB, URL https://www.edoeb.admin.ch/de/newnsb/tbRqnj30sW2P"
    summary: |
      Switzerland's Federal Data Protection and Information Commissioner (EDÖB/FDPIC), jointly with privatim
      (the conference of Swiss cantonal data-protection commissioners), published guidance on 2026-09-16 for
      digital surveillance of patients and care recipients in hospitals, care homes and similar institutions —
      direct real-time video, indirect (position pictograms) or event-triggered (e.g. fall-detection) camera,
      infrared or radar systems. The guidance draws a legality distinction directly relevant to Swiss public-
      sector defenders: public institutions with a public mandate (cantonal hospitals, care homes with a public
      mandate) are bound by the legality principle and must have such surveillance explicitly grounded in
      cantonal law, whereas private institutions without a public mandate rely on compliance with the federal
      Data Protection Act (DSG) — patient consent alone is neither necessary nor sufficient to legitimise
      surveillance in either case, though the person must be informed of purpose and effects. The guidance also
      sets purpose-limitation, proportionality/subsidiarity (event-triggered or indirect surveillance preferred
      over continuous real-time video), privacy-by-design/data-security, and documentation/re-evaluation
      requirements. This is a compliance-obligation change for any Swiss cantonal hospital, public care
      institution or their technology suppliers currently deploying or evaluating patient-monitoring camera/
      sensor/radar systems.
    region_nexus: "Switzerland — federal authority (EDÖB) acting for its own jurisdiction, explicitly naming cantonal hospitals (Kantonsspitäler) and publicly-mandated care institutions"
    primary_sector_nexus: "direct — Swiss public-sector healthcare/care institutions and their technology suppliers"
    sector: "public-sector"
    cves: []
