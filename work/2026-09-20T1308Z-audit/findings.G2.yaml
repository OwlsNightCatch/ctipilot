          aliases: [],
          summary: "Joint guidance from Switzerland's federal data-protection authority and the cantonal data-protection commissioners' conference on the legal requirements (legality, purpose limitation, proportionality, privacy-by-design) for camera/IR/radar patient-monitoring systems in hospitals and care homes." }
