- entry: entries/2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read.md
  verdict: imprecision
  defect: "(low confidence) The 2026-09-16 update's claim that NCSC-CH's posting recorded 'CVE-2026-87719 as now actively exploited' on 2026-09-14, and the evidence quote 'CVE-2026-87719 is known as actively exploited,' are sourced to the advisory's internal edit-history 'reason' metadata field, not to the advisory's published/reader-facing content. The visible advisory body's 14.09.2026 update text reads only 'Current exploitation status: Actively exploited' (one undifferentiated status field for the whole multi-CVE posting) backed by a citation to CISA's KEV addition, which lists CVE-2026-85706, not CVE-2026-87719. This entry's own actions[] item 2 tells readers to treat CVE-2026-87719 as confirmed exploited on this basis. Confidence is not full because it is unclear whether NCSC-CH's site publicly renders the 'reason' field to visitors."
  ground_truth: "The NCSC-CH post-12935 API record separates 'history' (edit-log entries carrying an internal 'reason' string, e.g. 'CVE-2026-87719 is known as actively exploited') from 'content' (the advisory body actually published). The content's 'Update 14.09.2026' section states only 'Current exploitation status: Actively exploited' plus 'CISA added CVE-2026-85706 to its catalog of known exploited vulnerabilities' -- naming CVE-2026-85706, not CVE-2026-87719, as the exploited CVE in that update."
  ground_truth_url: "https://security-hub.ncsc.admin.ch/#/posts/12935"

