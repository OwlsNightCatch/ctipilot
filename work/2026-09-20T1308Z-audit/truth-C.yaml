- entry: entries/2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha.md
  verdict: imprecision
  defect: "techniques[] carries T1567.004 (Exfiltration Over Webhook) but no behavior described anywhere in the entry (original body or the 2026-09-19 update) matches webhook-based exfiltration -- the entry only narrates exfiltration via gem-push/publish. The cited primary source's own webhook-exfiltration finding is never mentioned in the entry's prose, so the technique mapping has no supporting behavior in the body (cti-verification check 4b)."
  ground_truth: "rubyhack.ai's appendix section 'The agents attempted to use RubyGems' webhook system to store data' describes a distinct webhook-based data-storage/exfiltration technique (encoding stolen data into webhook URLs), separate from the gem-push exfiltration flow the entry's body actually describes; nothing in the entry's text supports the T1567.004 (webhook) mapping specifically."
  ground_truth_url: "https://rubyhack.ai/"

- entry: entries/2026-06-09/cve-2026-42271-berriai-litellm-low-privilege-command-injecti.md
  verdict: imprecision
  defect: "(1) cves[].epss is null for both CVE-2026-42271 and CVE-2026-48710 despite both having current, materially high EPSS scores (a KEV-listed, actively-exploited CVE at the 99.7th percentile) -- the null understates urgency to a reader scanning frontmatter. (2) The 2026-09-06 internal correction rewrote CVE-2026-48710's cvss/vector/auth fields to match 'Starlette's own GitHub Security Advisory' (GHSA-86qp-5c8j-p5mr), but that advisory was never added to sources[] or cited anywhere in reader-facing text -- it is named only inside the internal (non-rendered) correction summary, so a reader of the published entry has no path to the authority backing CVE-2026-48710's data."
  ground_truth: "GHSA-v4p8-mg3p-g94g's own live EPSS panel reads 83.594% (100th percentile bucket); FIRST.org confirms epss=0.83594 for CVE-2026-42271 and epss=0.36257 for CVE-2026-48710 (both as_of 2026-09-19). Kludex/starlette's GHSA-86qp-5c8j-p5mr (CVSS 6.5, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N) is the actual authority for CVE-2026-48710's cvss/vector/auth fields and does not appear in the entry's sources[] list."
  ground_truth_url: "https://github.com/advisories/GHSA-v4p8-mg3p-g94g ; https://api.first.org/data/v1/epss?cve=CVE-2026-42271 ; https://github.com/Kludex/starlette/security/advisories/GHSA-86qp-5c8j-p5mr"

- entry: entries/2026-07-24/laundry-bear-zimbra-zero-click-cve-2025-66376.md
  verdict: imprecision
  defect: "The sentence 'Targeting spans the Defence Industrial Base, federal and local government, education, energy, law enforcement, media and NGOs across NATO states, with Ukraine used as an earlier testbed' is cited to NCSC-UK, 2026-07-23, but this exact sector list and the Ukraine-testbed framing are verbatim from CISA's advisory AA26-204A (already cited elsewhere in the same entry), not established as coming from NCSC-UK's own page (whose body content could not be retrieved to independently confirm it repeats the same list). A true fact cited to the wrong co-cited source (adjacency, check 2d)."
  ground_truth: "CISA AA26-204A's 'Targeting details' section lists: 'the Defense Industrial Base (DIB), the federal and local government, education, energy, law enforcement, media, non-governmental organizations, and technology,' and a separate paragraph states Russian actors 'target Ukrainian users first-both as a priority target and as a testbench... before broader global deployment' -- the exact facts the entry attributes to NCSC-UK."
