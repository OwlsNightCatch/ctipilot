- entry: entries/2026-08-04/cve-2026-20079-cisco-secure-fmc-auth-bypass-root-hotfix.md
  verdict: factual-error
  defect: "The cves[] 'fixed' field for CVE-2026-20079 ('Per-train hot fixes: 7.0 GB-7.0.9.1-3, 7.2 HL-7.2.11.1-4, 7.4 HG-7.4.7.1-3, 7.6 CY-7.6.5.1-2, 7.7 AM-7.7.12.1-2, 10.0 P-10.0.1.1-2') and actions[] item 1 (which instructs readers to install those hot fixes) are stale as of today. Cisco's own advisory was revised to 2.6 on 2026-09-16 -- the same day as the September hardening-release bundle this entry's own 2026-09-18 update covers for CVE-2026-20324/CVE-2026-20242 -- replacing the hot fixes with proper hardening releases for this same CVE, a change the entry's most recent update missed."
  ground_truth: "Cisco's cisco-sa-onprem-fmc-authbypass-5JPp45V2 revision history now reads '2.6 | Replaced hot fixes with the security hardening releases | Fixed Software | Final | 2026-SEP-16', with the Fixed Releases table updated to: FTD/FMC 7.0 and earlier -> 7.0.10, 7.2 -> 7.2.12, 7.4 -> 7.4.8, 7.6 -> 7.6.6, 7.7 -> 7.7.13, 10.0 -> 10.0.2, 10.1 -> 10.1.0, with the note 'Previously, hot fixes were provided to remediate this vulnerability... Cisco recommends that customers upgrade devices to the appropriate hardening release.'"
  ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2"

