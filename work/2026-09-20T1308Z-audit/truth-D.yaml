- entry: entries/2026-09-09/windows-september-2026-two-exploited-lpe-zero-days-kev.md
  verdict: imprecision
  defect: >
    Two citation-adjacency (misattribution) defects in the main body, both in the sentence
    for CVE-2026-85880 and its neighbor. (1) The clause "it affects only the legacy/long-support
    line, Windows 10 and Windows Server 2012 through 2022, and not Windows 11 or Server 2025" is
    cited to BleepingComputer ("https://www.bleepingcomputer.com/news/microsoft/microsoft-september-2026-patch-tuesday-fixes-966-flaws-2-zero-days/"),
    but that article's CVE-2026-85880 section contains only the vulnerability title, the MSRC
    description quote, and researcher credits — no affected-version/build list at all; the
    per-version affected list is not this source's fact. (2) The parenthetical researcher-credit
    clause "(its own Threat Intelligence Center with Romain Deperne for the Update Stack bug;
    Volexity and Proofpoint for the ALPC bug)" sits in a sentence whose only citation is the Zero
    Day Initiative blog post; the full ZDI post text contains no mention of Volexity, Proofpoint,
    Deperne, or MSTIC/"Threat Intelligence Center" anywhere — those names come from BleepingComputer,
    which is cited earlier in the same paragraph for a different clause but not for this one.
    Both underlying facts are independently confirmed true (see ground_truth) — this is a
    misattributed/missing citation, not a factual error. Minor secondary note: the two cves[].affected
    frontmatter strings (which render on the entry page) each contain an em dash ("— the newest
    generation" / "— the legacy/long-support line only"); low-severity style point only, per the
    explicit em-dash check requested for this pass.
  ground_truth: >
    All facts stated are correct. CVE-2026-81963 (Windows Update Stack EoP): MSRC baseScore 7.8,
    severity Important, exploited=Yes, description "Improper link resolution before file access
    ('link following') in Windows Update Stack allows an authorized attacker to elevate privileges
    locally," vectorString CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H/E:F/RL:O/RC:C (E:F confirmed),
    affected products per MSRC's September 2026 CVRF ProductTree/ProductStatuses are exactly
    Windows Server 2025, Windows 11 23H2/24H2/25H2/26H1 (ARM64 and x64) — matches the entry exactly.
    CVE-2026-85880 (Windows ALPC EoP): MSRC baseScore 7.8, severity Important, exploited=Yes,
    description "Heap-based buffer overflow in Windows ALPC allows an authorized attacker to elevate
    privileges locally," FAQ text verbatim matches the entry's evidence[] quote; affected products per
    the same CVRF are exactly Windows 10 1607/1809/21H2/22H2 and Windows Server 2012/2012 R2/2016/2019/2022
    (no Windows 11, no Server 2025) — matches the entry exactly, but the correct citation for this
    fact is Microsoft's own per-CVE record/CVRF product list, not BleepingComputer. Both CVEs are
    confirmed on the live CISA KEV catalog with dateAdded 2026-09-08 (catalogVersion 2026.09.18),
    matching the entry's KEV claim. BleepingComputer's "record-breaking 966 flaws" and Zero Day
    Initiative's "nearly 1,000 CVEs coming out from Microsoft" are both verbatim quotes present in
    their respective articles, and researcher credit ("Romain Deperne and the Microsoft Threat
    Intelligence Centre (MSTIC)" for CVE-2026-81963; "Volexity and Mark Kelly, David Galazin, Jeremy
    Hedges with Proofpoint" for CVE-2026-85880) is stated verbatim by BleepingComputer, not ZDI. The
    2026-09-13 correction record accurately describes the prior "roughly 1,170" error (unsupported by
    either source then cited — MSRC and ZDI) and the fix to 966 cited to BleepingComputer is correct
    and now properly re-cited in the body (the pre-correction diff shows the leading sentence
    originally cited only MSRC+ZDI for the total-count clause; the correction moved the BleepingComputer
    citation onto that clause, which is the right fix). techniques: [T1068] ("Exploitation for
    Privilege Escalation") is active/non-revoked in the pinned attack/enterprise-attack.json and
    matches the described SYSTEM-elevation behavior. classification {reliability: A, credibility: 1}
    is consistent with two vendor-PSIRT/government primaries plus two corroborating research/news
    sources. No IOCs, no homepage/listing/NVD-MITRE-per-CVE source patterns present.
  ground_truth_url: "https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability/CVE-2026-85880"
