- entry: entries/2026-09-17/aepd-first-ai-agent-breach-notification.md
  verdict: imprecision
  defect: >
    (low confidence) verification: single-source-national-cert is applied to Spain's AEPD, a data
    protection regulator. The org profile's enumerated "National-CERT single-source carve-out
    list" names CCN-CERT as Spain's carve-out authority, not AEPD; AEPD is not on that list. The
    pipeline's broader PD-5 rule in prompts/cti-run.md ("a high-reliability national CERT /
    government authority as primary disclosing party for its own jurisdiction") arguably covers
    AEPD as a government authority disclosing its own regulatory process, so this may be a
    defensible reading rather than a hard error -- flagging for the main agent to confirm which
    document governs. All substantive facts (both evidence[] quotes, Perez Bes's title, the
    CCN-CERT BP/36 citation, AEPD's four practical conclusions) verified verbatim against AEPD's
    own blog post and heise online's corroborating pickup.
  ground_truth: >
    Org profile carve-out list: "NCSC-CH, GovCERT.ch, CERT-EU, ENISA, BSI, ANSSI/CERT-FR,
    NCSC-UK, NCSC-NL, CISA, CCN-CERT, AGID-CSIRT-IT, CERT.at, CERT-PL" -- AEPD is absent; CCN-CERT
    is Spain's listed authority. cti-run.md's carve-out text is worded more broadly ("national
    CERT / government authority").
  ground_truth_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"

- entry: entries/2026-09-17/ddrop-dram-interposer-defeats-confidential-computing.md
  verdict: imprecision
  defect: >
    (low confidence) techniques: [T1200, T1553] -- T1553 "Subvert Trust Controls" is a stretch
    mapping: ATT&CK's T1553 subtechniques (Gatekeeper Bypass, Code Signing, Install Root
    Certificate, Reduce Key Space, Mark-of-the-Web Bypass) describe local software trust-control
    bypasses, not forging a hardware-backed remote-attestation report via physical DRAM-bus
    tampering. The parent-technique definition is broad enough to arguably fit, but no cited
    source frames DDRop's attestation forgery in those terms.
  ground_truth: >
    ddropattack.eu's own case study describes the mechanism as SEPT-write corruption forging a
    TDX launch measurement/attestation report, not a code-signing, Gatekeeper, or root-certificate
    bypass. All other claims (cost, mechanism, TDX/SEV-SNP scope, Intel/AMD vendor responses,
    Platform Owner Endorsements, next-gen memory-encryption plans) verified verbatim against
    ddropattack.eu, Intel's and AMD's own advisories, and heise Security.
  ground_truth_url: "https://ddropattack.eu/"

