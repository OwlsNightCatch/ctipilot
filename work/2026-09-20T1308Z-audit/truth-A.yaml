- entry: entries/2026-09-17/cve-2026-58704-google-pixel-modem-zero-click-eop.md
  verdict: imprecision
  defect: >
    The entry frames the flaw as reachable "with no additional execution privileges and no user
    interaction needed for exploitation" without ever stating the access-vector prerequisite the
    same cited MITRE CVE record gives: the CNA description says the escalation is "remote
    (proximal/adjacent)", and the CISA-ADP Vulnrichment CVSS vector on the same record is
    AV:ADJACENT_NETWORK (8.8), meaning the attacker needs radio-level/cellular-network adjacency
    (e.g. a rogue base station), not unqualified remote reachability. The entry's sourcing_note
    correctly explains why no CVSS is transcribed but never surfaces the AV:A detail itself,
    which changes the real-world exploitability/threat-model framing for a Tier 2 responder.
  ground_truth: >
    MITRE CVE record CNA description: "This could lead to remote (proximal/adjacent) escalation
    of privilege with no additional execution privileges needed." ADP metrics block:
    vectorString "CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", attackVector
    "ADJACENT_NETWORK". All other claims (bug ID A-484011314, High/Modem classification, KEV
    dateAdded 2026-09-16/dueDate 2026-09-19, TechCrunch quotes, surveillance-vendor framing) verified.
  ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-58704"

