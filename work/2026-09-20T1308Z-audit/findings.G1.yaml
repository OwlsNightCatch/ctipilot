items:
  - title: "Oracle's new September 2026 Critical Security Patch Update ships five unauthenticated CVSS 10.0 RCEs across WebLogic Server, Access Manager, Forms, Internet Directory and Platform Security for Java — a wholly uncovered advisory class"
    sources:
      - { url: "https://www.oracle.com/security-alerts/cspusep2026.html", publisher: "Oracle", date: "2026-09-15", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0372", publisher: "NCSC-NL (advisory NCSC-2026-0372, Fusion Middleware)", date: "2026-09-16", role: "corroborating" }
      - { url: "https://www.oracle.com/security-alerts/", publisher: "Oracle Security Alerts index", date: "2026-09-20", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0372/-0373/-0374/-0375/-0376/-0377/-0378/-0379/-0380/-0381, all published 2026-09-16, relaying an Oracle patch batch not attributable in the RSS text to a known quarterly CPU month) -> pivot: Oracle Security Alerts index, URL https://www.oracle.com/security-alerts/ (revealed Oracle quietly started a second, higher-frequency \"Critical Security Patch Update\" (CSPU) line in May 2026, released on the third Tuesday of Feb/Mar/May/Jun/Aug/Sep/Nov/Dec, distinct from and complementing the quarterly Jan/Apr/Jul/Oct CPU) -> primary: Oracle CSPU September 2026 bulletin, URL https://www.oracle.com/security-alerts/cspusep2026.html (Rev 1, 15 September 2026; risk-matrix confirms the five CVSS 10.0 entries)."
    summary: |
      Independent research (not from a KEV/CERT trigger) surfaced that Oracle has, since May 2026, quietly run a second
      "Critical Security Patch Update" (CSPU) release line alongside its long-standing quarterly Critical Patch Update
      (CPU, third Tuesday of Jan/Apr/Jul/Oct) -- CSPUs land on the third Tuesday of Feb/Mar/May/Jun/Aug/Sep/Nov/Dec.
      Neither the store's 14-day prior-coverage index nor its store-wide CVE index (1123 ids) contains a single Oracle,
      WebLogic, or Fusion Middleware entry, so this entire release class -- eight-plus prior CSPU/CPU editions since
      May -- has never been researched by any daily fire, and September's edition (Rev 1, 15 September 2026, relayed
      by NCSC-NL as advisory NCSC-2026-0372 on 2026-09-16) falls inside this window.
      September's CSPU fixes 153 CVEs in Oracle Fusion Middleware alone (66 rated Critical, 78 remotely exploitable
      without authentication) plus large batches across E-Business Suite (159 CVEs), Communications (31), Siebel CRM
      (63), Hyperion (102) and more. Five CVEs carry the maximum CVSS 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) and
      require no authentication over the network: CVE-2026-83021 in Oracle WebLogic Server's Web Container component
      (HTTP, versions 12.2.1.4.0, 14.1.1.0.0, 14.1.2.0.0), CVE-2026-71133 in Oracle Access Manager's Authentication
      Engine (HTTP, 12.2.1.4.0/14.1.2.1.0), CVE-2026-83099 in Oracle Forms Services/C-S/Charmode (HTTP,
      12.2.1.19.0/14.1.2.0.0), CVE-2026-83059 in Oracle Internet Directory's OID LDAP Server (LDAP,
      12.2.1.4.0/14.1.2.1.0), and CVE-2026-83020 in Oracle Platform Security for Java's centralized third-party jars
      (HTTP, 12.2.1.4.0/14.1.2.0.0). Oracle discloses no exploitation-technique detail (standard PSIRT practice) and
      states only its boilerplate historical warning that patched vulnerabilities are periodically targeted after the
      fact; no CVE-specific in-the-wild exploitation is claimed for this batch as of 2026-09-20. The mechanics
      themselves force the timeline regardless: an unauthenticated, network-reachable, single-flaw path to full
      confidentiality/integrity/availability compromise of internet- or intranet-facing middleware is precisely
      WebLogic Server's historical fast-weaponization profile (its pre-auth deserialization RCEs have repeatedly been
      diffed and mass-scanned within days of prior CPU releases), and the same profile applies to Access
      Manager/Forms/OID, all of which back Swiss public-sector legacy applications, SSO and directory services.
    region_nexus: "global; Oracle Fusion Middleware, E-Business Suite, PeopleSoft and WebLogic Server are widely deployed as legacy back-office and SSO/identity infrastructure across public-sector estates, including in Switzerland"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-83021, CVE-2026-71133, CVE-2026-83099, CVE-2026-83059, CVE-2026-83020]
    techniques: [T1190]
    affected_products: ["Oracle WebLogic Server", "Oracle Access Manager", "Oracle Forms", "Oracle Internet Directory", "Oracle Platform Security for Java", "Oracle Fusion Middleware"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This Critical Security Patch Update contains 153 new security patches for Oracle Fusion Middleware.  78 of these vulnerabilities may be remotely exploitable without authentication"
        attribution: "Oracle"
        source_url: "https://www.oracle.com/security-alerts/cspusep2026.html"
      - quote: "A Critical Security Patch Update provides targeted, high-priority security fixes in a smaller, more focused format... Critical Security Patch Updates complement Oracle's existing quarterly cumulative Critical Patch Updates (CPUs)."
        attribution: "Oracle"
        source_url: "https://www.oracle.com/security-alerts/"
    extended_notes: |
      This is a genuine coverage gap, not a single CVE the daily fires happened to miss: Oracle's entire second,
      higher-frequency CSPU release line (running monthly-ish since May 2026: May, Jun, Aug, Sep so far) has never
      been in any daily fire's source slice or resulted in a store entry, and the store's CVE index has zero Oracle
      hits at all. Recommend the main agent/operator add an Oracle CSPU/CPU tracking line to the S1 source slice
      (the existing "oracle-cpu" source record only names the quarterly CPU page; its "standard"/bridge fetch note
      should be updated to also enumerate CSPU editions from the same index page) so future editions (next: 17
      November 2026, per Oracle's own posted schedule) are not missed again. CVSS 10.0 unauthenticated network RCE
      is present but Oracle's own advisory does not claim exploitation for any of the five headline CVEs as of this
      window, hence MEDIUM confidence and a `high`-leaning, not `critical`-leaning, severity read; recommend the main
      agent treat this as `priority: high` pending any exploitation confirmation.
    coverage: "GAP"

  - title: "Cisco's 16 September 2026 bundled advisory notice (79 CVEs across ISE, ASA/FTD/FMC, Nexus Dashboard, BroadWorks and ThousandEyes) — independently traced in full; correctly a non-gap"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP", publisher: "Cisco (Advance Notification for Publication of September 16, 2026, Security Advisories)", date: "2026-09-16", role: "primary" }
