      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc2-multivulns-HXgcqRG", publisher: "Cisco PSIRT", date: "2026-09-16", role: "corroborating" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmcftd-sftun-multivulns-WGVHOrN3", publisher: "Cisco PSIRT", date: "2026-09-16", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0382", publisher: "NCSC-NL (Cisco ISE advisory NCSC-2026-0382)", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12954 (\"Cisco: patches multiple Critical vulnerabilities across their products\", 2026-09-17, referencing cisco-sa-notice-jfxK98ZP) -> primary: Cisco's own bundle notice, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP -> pivoted into the six named sub-advisories (hardening-asaftdfmc, hardening-ndw1, fmc-mulivulns, fmc2-multivulns, fmcftd-sftun-multivulns) individually to check CVSS vectors, privilege prerequisites and exploitation status for every CVE not already in an existing store entry."
    summary: |
      This is Cisco's semi-annual internally-discovered "hardening release" disclosure across Identity Services
      Engine, ASA/FTD/Secure FMC, Nexus Dashboard, BroadWorks and ThousandEyes -- 79 distinct CVE identifiers on one
      notification page. The store already carries the two items with confirmed active exploitation from this same
      effort: CVE-2026-76460 (ISE unauthenticated API auth bypass to root) and the March-disclosed CVE-2026-20079 /
      July-disclosed CVE-2026-20316 Secure FMC pair, plus the two newest FMC hardening CVEs Cisco called out by name
      (CVE-2026-20324 sftunnel file write, CVE-2026-20242 Java deserialization) via the 2026-08-04 entry's 2026-09-18
      changelog. Independent inspection of every remaining CVE group not already covered confirms none clears the
      inclusion bar: the ASA/FTD/FMC "Hardening Release: September 2026" bundle (CVE-2026-20329/30/31/32/33/34/35/36,
      CVSS 9.9) requires PR:L (an existing low-privilege session) per its own CVSS vector; the FMC "Multiple
      Vulnerabilities" group (CVE-2026-20340/41/42/43/44, CVSS 9.1, reported by NATO's own Cyber Security Centre)
      requires PR:H; the FMC session-forgery group (CVE-2026-76412/13/20, CVSS 9.0) is unauthenticated but AC:H
      (session forgery/impersonation, not a direct single-request compromise); the sftunnel group (CVE-2026-20295/23,
      CVSS 8.6 High) is availability-only DoS; and the entirely separate Nexus Dashboard "Hardening Release" bundle
      (CVE-2026-20360/61/22/25/26, CVE-2026-76409, CVSS 9.9) again requires PR:L. Every one of these advisories
      states verbatim that Cisco PSIRT "is not aware of any public announcements or malicious use," and the bundle's
      own summary confirms only the two already-tracked flaws are the ones "known to be actively exploited." This is
      Cisco's normal (twice-yearly) internal-review patch cadence and is correctly out of scope beyond what the store
      already carries.
