  - title: "ISC BIND 9 — two unauthenticated remote crash vulnerabilities (CVE-2026-77692, CVE-2026-76163); DoS-only, correctly not urgent"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12956", publisher: "NCSC Switzerland (GovCERT.ch CSH advisory)", date: "2026-09-18", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12956 (published 2026-09-18) -> primary is the same NCSC-CH post, which cites ISC's own bind9 release notes (bind9.readthedocs.io) as the vendor source; those release-note pages were not independently re-fetched given the DoS-only, unexploited severity profile assessed sufficient from the NCSC-CH advisory text and CVSS vectors it reproduces."
    summary: |
      ISC fixed 14 vulnerabilities in BIND 9 (branches 9.20/9.21), two of which are remotely triggerable by an
      unauthenticated attacker without needing to control a DNS zone of their own: CVE-2026-77692 (CVSS 7.5,
      unauthenticated crash via a single malformed DoH SIG(0) request) and CVE-2026-76163 (CVSS 7.5, assertion
      failure/crash via a crafted TKEY query on options-less configurations). NCSC-CH records "current exploitation
      status: UNKNOWN" and the impact for both is denial-of-service (server crash), not code execution or data
      compromise. Vendor patches are available; no workaround is documented in the advisory.
    region_nexus: "global"
