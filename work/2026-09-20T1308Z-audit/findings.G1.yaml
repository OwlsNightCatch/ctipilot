  - title: "Palo Alto Networks PAN-OS XML-processing buffer overflow (CVE-2026-0310) — high severity but unexploited and high-complexity; correctly not urgent"
    sources:
      - { url: "https://security.paloaltonetworks.com/CVE-2026-0310", publisher: "Palo Alto Networks PSIRT", date: "2026-09-09", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0369", publisher: "NCSC-NL (advisory NCSC-2026-0369)", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0369, published 2026-09-15) -> primary: Palo Alto Networks PSIRT, URL https://security.paloaltonetworks.com/CVE-2026-0310 (first published 2026-09-09)."
    summary: |
      A buffer overflow in PAN-OS's XML-processing functionality (CVE-2026-0310) lets an unauthenticated attacker with
      network access to the management web or dataplane interface cause a denial-of-service on VM-Series firewalls, or
      execute arbitrary code with root privileges on PA-Series hardware firewalls; Panorama and Prisma Access/Cloud
      NGFW carry a reduced-severity variant. No special configuration is required for exposure. Palo Alto's own
      severity read is HIGH with CVSS-BT 7.2 (CVSS-B 9.2, vector AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H) -- attack
      complexity is HIGH, distinguishing this from a trivial single-request compromise. Palo Alto states explicitly:
      "Palo Alto Networks is not aware of any malicious exploitation of this issue." The vendor advisory itself
      predates this audit window (first published 2026-09-09, four days before the 2026-09-13 window start); NCSC-NL's
      relay on 2026-09-15 falls inside the window but adds no new technical or exploitation information. Fixed in
      PAN-OS 12.2.3, 12.1.10 (or the listed hotfix trains), 11.2.13-h2, 11.1.16-h2 and 10.2.18-h10; no workaround
      exists short of restricting management-interface access.
    region_nexus: "global; PAN-OS firewalls are a common perimeter product in enterprise and government networks"
