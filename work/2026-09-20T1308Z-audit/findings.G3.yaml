          summary: "APT group active since at least 2023, originally focused on Asia, now confirmed by Kaspersky GERT (2026-09-16) targeting Russian organizations via compromised VPN credentials and a VIEWSTATE-injected Exchange backdoor." }
      - { key: "malware:ghostcontainer", type: malware, name: "GhostContainer", aliases: [],
          summary: ".NET Exchange-server backdoor deployed via ASP.NET VIEWSTATE parameter injection using stolen Exchange machine keys and a ysoserial GhostWebShell gadget; blinds AMSI/Event Logging by patching amsi.dll/ntdll.dll addresses. Attributed to NightEagle (Kaspersky Securelist, 2026-09-16; first documented by Kaspersky in an earlier 2025 report)." }
