    extended_notes: |
      Not present in prior_coverage.json or entities/registry.yaml. GhostContainer was reportedly first documented by Kaspersky in an earlier standalone 2025 post (linked in-article: securelist.com/ghostcontainer/116953/) — that predates this deployment's store and is out of this run's window, so only the new NightEagle/Russia-targeting delta and the tunneling-technique details are being surfaced now.
