    extended_notes: |
      Not covered elsewhere in prior_coverage.json. actor:thegentlemen and actor:qilin are both existing registry keys (confirmed via entities/registry.yaml grep) — no new entity registration needed. Talos's credential-theft-from-mounted-backup technique (VHDX mount via CIFS -> copy ntds.dit/SAM offline -> secretsdump.py -> rclone to Wasabi) is a variant of T1003.003 worth a detection note: monitor for CIFS mounts of backup shares followed by libguestfs-tools/qemu-utils/nbd-client installation and rclone process creation with cloud-storage destinations.
    coverage: GAP

  - title: "NightEagle (APT-Q-95) pivots to Russian targets, tunnels RDP over Microsoft's own legitimate dev-tunnels service, and extracts DCSync credentials after exploiting BlueKeep"
    sources:
      - { url: "https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/", publisher: "Kaspersky Securelist (GERT)", date: "2026-09-16", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist, URL https://securelist.com/feed/ (listing) → primary: Kaspersky Securelist, URL https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/ (published 2026-09-16T10:00:11Z per RSS)"
    summary: |
      Kaspersky's Global Emergency Response Team documents a NightEagle (aka APT-Q-95) campaign, active since 2023 and previously focused on Asia, now confirmed against Russian organizations. Initial access used compromised VPN credentials, with connections originating from Cloudflare WARP-tunnel IPs and European VPS ranges. On Microsoft Exchange servers, the group deploys the GhostContainer backdoor (a .NET assembly with Stub/App_Web_843e75cf5b63/App_Web_8c9b251fb5b3 classes) via VIEWSTATE parameter injection — extracting the Exchange ASP.NET machine keys, forging a serialized payload with the ysoserial GhostWebShell gadget, and reusing a CVE-2020-0688 exploit component; the backdoor tampers with amsi.dll and ntdll.dll addresses to blind AMSI and Windows Event Logging. For traffic redirection the group abuses Microsoft's own legitimate dev-tunnels service (*.devtunnels.ms) to expose port 3389 (RDP) outward, then layers rdp2tcp — a public RDP-virtual-channel TCP tunneling tool — inside that RDP session; rdp2tcp's presence is detectable via Windows event IDs 132/148 in Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational.evtx, where the RemoteFX channel name reads "rdp2tcp" or a random string instead of a legitimate RDS channel name. Tooling and payloads are staged on GitHub repositories disguised with mismatched legitimate-sounding names (e.g. adobe_32.exe, 1c-office-plugin.exe, trueconf-broker.exe). For lateral movement and privilege escalation, NightEagle exploited CVE-2019-0708 (BlueKeep) to create and elevate a local account, used Impacket's atexec to set scheduled netsh portproxy rules for internal pivoting, and requested Kerberos tickets with a non-standard Forwardable/Proxiable/Renewable flag combination before executing DCSync (replicating the Domain-Password AD object) to dump domain credentials.
    region_nexus: "Campaign newly confirmed against Russian organizations; the abused legitimate-service tunneling technique (Microsoft dev tunnels + rdp2tcp) and the GhostContainer VIEWSTATE-injection Exchange backdoor are directly relevant to any organization running on-prem Exchange and permitting outbound HTTPS to *.devtunnels.ms."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2020-0688", "CVE-2019-0708"]
    techniques: [T1078, T1190, T1505.003, T1027, T1562.006, T1090, T1572, T1036.005, T1210, T1053.002, T1090.001, T1558, T1003.006]
    affected_products: ["Microsoft Exchange Server"]
    entity_keys: []
    new_entities:
