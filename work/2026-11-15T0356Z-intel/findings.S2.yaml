  - title: "Saxony: dispatch messages of fire, rescue and civil-protection pagers, with patient names, addresses and diagnoses, were readable by unauthorised persons on a social network for years; Saxon LKA investigates"
    borderline: true
    borderline_reason: >
      Emergency-services lens is core constituency and the lesson transfers (Swiss Sanität/Feuerwehr paging was reported
      unencrypted end-to-end in 2018), but the freshest sources are 2026-11-11 (Spiegel) and 2026-11-12 (heise), i.e. outside
      the 28 h window (inside the 72 h developing window) and no in-window development was found. Current Swiss status is
      NOT verified. Main agent decides; a two-sentence entry or a drop are both defensible.
    sources:
      - { url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html", publisher: "heise online", date: "2026-11-12", role: "primary" }
      - { url: "https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b", publisher: "DER SPIEGEL (S+, only teaser readable)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.beobachter.ch/burger-verwaltung/datenschutz-sensible-notrufdaten-im-netz", publisher: "Beobachter (Swiss background, article of 2018-08-28)", date: "2018-08-28", role: "context" }
    discovery_trace: >
      first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed item 2026-11-12T15:19Z "Pager-Panne in Sachsen") →
      pivot: heise article, URL https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html →
      primary: DER SPIEGEL, URL https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b (S+ paywall, teaser only) →
      Swiss background found by WebSearch ("Sachsen Notruf Pager Datenpanne Telegram Rettungszweckverband Südwestsachsen Patientennamen") → Beobachter, URL https://www.beobachter.ch/burger-verwaltung/datenschutz-sensible-notrufdaten-im-netz
    summary: |
      Facts as reported by heise, which relays Spiegel and adds its own enquiry to Saxony's Landeskriminalamt: unauthorised persons have for
      several years been able to read, on a social network, the emergency messages sent to mobile pagers of fire brigades, rescue services
      and civil protection in Saxony; hundreds of messages a day are said to flow in, mainly from the Leipzig area and the districts of
      Zwickau, Vogtland and Erzgebirge. Spiegel says the messages carried diagnoses, names and addresses of patients. The affected services
      appear to use the POCSAG paging protocol, which has no encryption of its own; per Spiegel the Saxon networks add the IDEA cipher of
      1990, regarded as outdated because of its 64-bit block size, and the informant says the keys are available in online forums. The
      informant told Saxony's interior ministry and the LKA at the end of October and got no reply before going to the media; the LKA's
      cybercrime contact point (ZAC) told heise it learned of the incident on 31 October and opened investigations at once, and gives no
      figures on affected persons or volume. The Rettungszweckverband Südwestsachsen now sends dispatch information without patient names
      and house numbers. Claim versus fact: the existence of the feed and its content rest on the informant and Spiegel's reading; the LKA
      confirms only that it knows of the incident and investigates. No source states how the radio traffic reaches the social network
      (passive reception of the broadcast is the obvious mechanism for an unencrypted or weakly encrypted POCSAG channel, but that is an
      analyst inference, not a sourced statement). Swiss context from Beobachter (2018-08-28): Sanität and Feuerwehr across Switzerland
      then paged unencrypted; Schutz & Rettung Zürich dispatched ZH, SH, SZ and ZG over pager, with encryption only from the transmitter to
      the radio mast and end-to-end encryption technically not yet possible; the Swiss Beobachter found a public website listing current
      Swiss pager messages with patient names; SRZ then expected full encryption in the course of 2019. Whether that rollout happened and
      what Swiss services page today is not established by any source fetched here.
    region_nexus: "Germany (Saxony); indirect Swiss relevance — Swiss Sanität/Feuerwehr paging was reported unencrypted end-to-end in 2018; current Swiss state unverified"
    primary_sector_nexus: "direct to the emergency-services constituency (fire and rescue, emergency medical services, civil protection)"
    sector: "public-sector"
    cves: []
    techniques: [T1040]
    technique_note: "T1040 Network Sniffing is the nearest ATT&CK fit for passive interception of an unencrypted broadcast channel; ATT&CK has no radio-specific technique and no source maps it."
