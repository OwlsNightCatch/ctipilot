  - title: "Microsoft 365 outage 2026-11-12/13: Outlook, Teams, SharePoint and Copilot down worldwide for many hours; Microsoft says a network-capacity upgrade caused it, not an attack; Swiss federal administration reports only minor performance issues"
    borderline: true
    borderline_reason: >
