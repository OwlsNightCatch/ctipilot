    extended_notes: |
      Exposure (what a Swiss emergency organisation can check, all derived from the sources' mechanism): whether the free text of alarm
      messages sent through your pager network carries patient names, house numbers or diagnoses; whether the paging channel is
      encrypted end to end or only between transmitter and mast; which cipher and key management the network uses (heise: 64-bit-block
      IDEA, keys said to circulate). Hardening named by the sources: strip patient identifiers from the paged text (what Rettungszweckverband
      Südwestsachsen did), move to a better-protected channel (heise notes many German BOS moved to TETRA, which has encryption on board).
      Detection: no source describes one; reception of a broadcast is passive, so the sending side sees nothing (analyst inference);
      the only observable is the republication of your own region's alarm texts on the web. Triage: not applicable (no endpoint telemetry).
      The Spiegel body is paywalled (S+): only its teaser was read, so every Spiegel-specific detail comes through heise's account.
      Beobachter's 2018 figures describe Zurich-dispatched cantons only and are historical.

