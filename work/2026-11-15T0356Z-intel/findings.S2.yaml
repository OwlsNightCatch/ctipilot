      kept only as a public-sector availability / SaaS-concentration data point (ETH Zurich and other Swiss institutions affected, federal administration
      largely not) with an in-window resolution report (tagesschau 2026-11-14). Likely drop unless the brief carries a resilience note.
    sources:
