      Kind hint for the composer: policy / law-enforcement action (standing policy watch), not a threat entry. Detection concept that follows from the
      sources: Gootloader-style delivery shows up as downloads of document-named archives or scripts from compromised third-party websites reached by
      search; credential-exposure notifications from Shadowserver / HIBP-style feeds are the practical hook for a public-sector SOC (check whether
