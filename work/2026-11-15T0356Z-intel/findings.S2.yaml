      first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (items 2026-11-13T10:23Z and T16:03Z) →
      corroboration: tagesschau feed, URL https://www.tagesschau.de/xml/rss2/ (item 2026-11-14T11:17+01:00 "Microsoft: Systeme nach Störung komplett wiederhergestellt") →
      primary: Microsoft's own statements are relayed by both outlets (Microsoft status page and X posts were not fetched; WebSearch for a Microsoft post-incident report found none)
    summary: |
      tagesschau reports on 2026-11-14 that Microsoft says all systems are running again after a large outage of Microsoft 365 cloud services that began
      on Thursday evening and hit Outlook, Teams, calendars and video meetings, the Copilot assistant and third-party AI interfaces, with effects on
      companies and authorities worldwide; the Australian intelligence service and federal police reported outages, the US House of Representatives
      reported restrictions, and BSI said the German federal administration was essentially unaffected. Microsoft's explanation, as tagesschau relays
      it, is a self-inflicted problem and no cyberattack or AI activity: a flaw introduced by an earlier network-capacity upgrade surfaced after recent
      network changes. Inside IT (Keystone-SDA, AWP) adds the Swiss picture: Swiss companies and public institutions such as ETH Zurich had Outlook,
      Teams and SharePoint problems, the Swiss federal administration (about 44,000 staff) reported only minor performance problems in individual
      applications and unaffected e-mail, and Microsoft said there was no indication of a cyberattack. Date discrepancy to carry: Inside IT writes
      "Donnerstag, 13. November" but 13 November 2026 is a Friday; tagesschau dates the start to Thursday evening (12 November).
    region_nexus: "global, with Swiss public-sector impact (ETH Zurich; federal administration only minor)"
