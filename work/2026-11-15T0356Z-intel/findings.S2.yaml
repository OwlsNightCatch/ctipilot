      - { url: "https://www.heise.de/news/Operation-Endgame-Weltweiter-Schlag-gegen-Cybercrime-11524460.html", publisher: "heise online", date: "2026-11-13", role: "corroborating" }
      - { url: "https://www.inside-it.ch/europol-legt-drei-malware-netzwerke-lahm-20261113", publisher: "Inside IT", date: "2026-11-13", role: "corroborating" }
    discovery_trace: >
      first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed item 2026-11-13T13:32Z "Operation Endgame: Weltweiter Schlag gegen Cybercrime") →
      corroboration: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 2026-11-13T12:29Z "Europol legt drei Malware-Netzwerke lahm") →
      primary: Europol press release, URL https://www.europol.europa.eu/media-press/newsroom/news/64-million-victim-datasets-secured-in-international-operation-against-malware-networks
      (JS application; the page's meta description, JSON-LD dates and og:title were read from the raw HTML, the body did not render)
    summary: |
      Europol says that, with global partners, it dismantled the criminal infrastructure behind the Gootloader, CastleRAT and StealC malware,
      and that law enforcement seized 235 servers and 257 domains (Europol meta description; its title speaks of 6.4 million victim datasets
      secured). The detail below is from heise and Inside IT reading the release: Gootloader, a dropper/loader usually delivered as fake legal
      documents on compromised, often WordPress, websites, lost 14 servers and 218 domains and 681 infected websites were cleaned; CastleRAT,
      a remote-access trojan known since 2025 that the sources say was used in ransomware intrusions, lost 120 servers and 39 domains; StealC,
      an infostealer, lost 102 servers, and Inside IT adds that the investigation into that infrastructure has run since June 2026 (heise: the
      round follows the June round that also hit SocGholish). More than 6 million stolen credentials were found in the criminal
      infrastructure; the data were shared with Have I Been Pwned, DIVD, CheckjeHack, NoMoreLeaks, Sekoia, the Shadowserver Foundation and
      the Dutch NCSC so that victims can be notified (heise). Europol advises WordPress operators to renew credentials, enable
      multi-factor authentication and patch known flaws. Inside IT counts nine participating countries, naming Germany, the Netherlands,
      the United Kingdom and the United States, with Eurojust coordinating; heise names Europe, Canada and the United States and the German BKA;
      neither names Switzerland. Assessment: the value for defenders is the victim-notification path (credential-exposure feeds such as Shadowserver
      and HIBP domain monitoring) and the WordPress clean-up, not new technique detail; no source gives malware behaviour beyond the one-line descriptions above.
    region_nexus: "EU / global law-enforcement action; Switzerland not named as a participant; Swiss organisations may appear in the notified victim data (not stated)"
    primary_sector_nexus: "indirect — credential exposure and compromised-WordPress lures affect any public-sector web estate and staff mailboxes"
    sector: "public-sector"
    cves: []
    techniques: [T1189, T1204.002, T1555]
    technique_note: "T1189/T1204.002 from heise's description of Gootloader (fake legal documents on compromised websites); T1555 from StealC 'Zugangsdaten und Passwörter' (generic credential theft; the sources do not name browsers)."
    affected_products: ["WordPress"]
