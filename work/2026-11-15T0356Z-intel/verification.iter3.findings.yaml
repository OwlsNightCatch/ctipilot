- code: F3
  category: claim-not-supported
  section: polinrider-forged-commits-npm-hijacks-fake-recruiter
  item: "PolinRider: a North Korea-linked loader reaches developers through force-pushed forged commits ..."
  url_or_quote: "the same wallet appears in GitGuardian's GhostAction report, which Sonatype says does not establish a shared operator"
  summary: "(low confidence) 'the same wallet' binds back to 'a hard-coded Ethereum wallet' of the Apiiro-cited clause, but the Sonatype page ties GitGuardian's GhostAction report only to its own wallet ('This exact wallet appears in GitGuardian's October 27, 2026 report'), the 0x1eEf wallet of the 12 hijacked npm releases. Apiiro's table lists three Ethereum wallets for the family (0xa322 for A4-A11, 0x1eEf for the fake-font wave, 0x33ff) and says the fake-font wave 'reads a different wallet, 0x1eEf' from the original; the loader Apiiro decodes reads 0xa322. Fix: say 'the wallet in the hijacked npm releases also appears in GitGuardian's GhostAction report', as the registry relation already does."
- code: F11
  category: editorial-advisory
  section: screenconnect-crypto-bait-guest-sessions-118-servers
  item: "An MSP asked about them on 2026-11-12; ... and to register a guest client needs the server's relay address, which is embedded in that server's guest installer."
  url_or_quote: "and to register a guest client needs the server's relay address"
  summary: "Ungrammatical clause after the iteration-2 edit (the infinitive 'to register a guest client' has no subject for 'needs'). Huntress: 'To register, a guest client needs a ScreenConnect server's relay address, which is embedded in that server's guest installer.' Suggest 'and a guest client needs the server's relay address, embedded in that server's guest installer, to register.' Facts are correct."
- code: F11
  category: editorial-advisory
  section: cursor-marketplace-claude-code-extension-ssh-backdoor
  item: "Fireworks' bulletin of 2026-11-09 describes its own intrusion, which it links to a financially motivated group that sells access to language models (\"LLMjacking\"), and a second incident on 2026-10-23 and 2026-10-24 ..."
  url_or_quote: "https://fireworks.ai/security/bulletins/october-2026-security-incident-update"
