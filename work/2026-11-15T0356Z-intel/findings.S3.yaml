  - title: "AMD SEV-SNP: Mior (CVE-2026-0462) and Skyfall (CVE-2026-40671) from ETH Zurich let a malicious hypervisor read or forge confidential-VM state; fixes are host-side firmware and BIOS updates through December 2026"
    sources:
      - { url: "https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3059.html", publisher: "AMD", date: "2026-11-10", role: "primary" }
      - { url: "https://skyfall-attack.github.io/", publisher: "SKYFALL research team (ETH Zurich and co-authors)", date: "2026-11-10", role: "primary" }
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-mior-skyfall-sev-snp-confidential-ai-20261/", publisher: "Cloud Security Alliance Lab Space", date: "2026-11-14", role: "background" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ (extract of the listing; note dated 2026-11-14) -> CSA note https://labs.cloudsecurityalliance.org/research/csa-research-note-mior-skyfall-sev-snp-confidential-ai-20261/ -> primary: AMD bulletin, URL https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3059.html ; research site https://skyfall-attack.github.io/"
    summary: |
      AMD's bulletin AMD-SB-3059 (10 November) covers CVE-2026-0462, in which insufficient access-control granularity in SEV firmware lets a malicious hypervisor redirect MMIO access and so break guest-memory integrity; it applies to SEV-SNP only (not SEV or SEV-ES), scored CVSS 4.0 5.9, reported by ETH Zurich researchers. The SEV firmware mitigation (for example 1.3A.4 on EPYC 9004 and 8004, 1.3A.0A on 9005 and 8005, 1.3A.03 on 7003) was released on 2026-08-12 and the platform-initialisation BIOS packages are planned for December 2026, embedded parts for February 2027; each row names a mitigation bit and the SNP TCB value an attestation verifier should require. The second attack, Skyfall (CVE-2026-40671, builds on AMD's Transient Scheduler Attacks), is a microarchitectural data sampling attack that, per its authors, extracts SEV-SNP guest state, decrypted microcode patches and protected SMM memory; AMD assigned the CVE and released microcode (the AMD-SB-3061 bulletin was not fetched). CSA's secondary note adds that both attacks assume an attacker with hypervisor control, that tenants cannot patch from inside the guest, and that attestation verifiers should reject reports from platforms below the fixed TCB level; I did not independently verify the 1,000-of-1,000 trial figure CSA attributes to the Mior authors.
