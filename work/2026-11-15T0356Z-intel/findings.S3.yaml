        source_url: "https://projectzero.google/2026/11/disclosure-policy.html"
    extended_notes: |
      Why it matters to defenders (the source's claim, not mine): the policy owner assumes attackers can exploit from the patch as soon as it ships, so the interval a defender can safely wait after a vendor fix, and the gap between a Project Zero report and public details, both shrink on a published schedule (90 days now, 60 from 2027-02-02, 30 from 2028-01-03). This is a policy item with no technique content; it changes how long an organisation can plan to wait after a fix and when public bug details will appear. Project Zero is the owner of its own policy, so a single primary source is acceptable; it is not on the national-CERT carve-out list. The prior-coverage index has no entry on this. If the composer judges it below the relevance bar for a constituency brief, drop; I rate it notable only for organisations that set patch SLAs from vendor severity or assume a soak period. Suggested rating A2 (authoritative on its own policy; no corroboration needed for what it announces), priority routine.
  - title: "Elastic: SANSAR Linux cryptomining toolkit reached three GPU hosts through an unauthenticated Ray job agent and hides with a DKMS kernel rootkit and a falsified GPU-utilisation library"
    sources:
      - { url: "https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware", publisher: "Elastic Security Labs", date: "2026-11-12", role: "primary" }
    discovery_trace: "first seen at: elastic-seclabs, feed https://www.elastic.co/security-labs/rss/feed.xml (item dated 2026-11-12T10:48) -> primary (no pivot needed): https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware"
    summary: |
      Elastic Security Labs tracks REF3364, a Linux cryptomining intrusion in which attackers reached three GPU hosts through an exposed Ray job agent: the dashboard on the head node listened only on loopback, but the job agent stayed reachable from the internet and accepted job submissions without authentication. Between 22 and 25 October the logs show external probing, a submitted job that ran nvidia-smi and sent the GPU inventory out, and a Python reverse-shell job; the attacker then added an SSH key to the account that owned the Ray session and, after obtaining root, staged a Rust orchestrator (SANSAR) that takes commands over Tor and supervises XMRig and SRBMiner, built a kernel module through DKMS with an initramfs loader so the rootkit reloads at boot, replaced the NVIDIA Management Library with a wrapper that falsifies GPU readings (nvidia-smi reports 0 percent utilisation) and registered a separate backdoor that fetches its server address from an Ethereum smart contract. Elastic reports no data theft; the motive observed is mining.
