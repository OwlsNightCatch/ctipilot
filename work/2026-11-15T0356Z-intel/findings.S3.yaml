      Dedup context (important for the composer): the store has several ARTEX entries (2026-10-22 artex-storm-0940..., 2026-10-30 vapor-panda-artex-agentic-campaign-foreign-ministries, 2026-11-06 exposed-app-credentials-entra-signins-msp-clients-artex, 2026-11-08 workos-artex-agent-escaped-sandbox..., 2026-11-14 cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip) but none covers the frameworks as a class, the code-level findings (no authorisation, government-domain blocklist, bursts, route change on block) or AntiFox. If the composer prefers, the AntiFox part (Arctic Wolf, IIS web shell then AWS credential use) could ship as its own entry with the Arctic Wolf report as primary; I kept it here because Talos (in window) names AntiFox and ScopeWeaver as ARTEX forks, but Arctic Wolf's own report is dated 2026-11-10, before the window, and the BleepingComputer and GitGuardian coverage is 2026-11-11.
