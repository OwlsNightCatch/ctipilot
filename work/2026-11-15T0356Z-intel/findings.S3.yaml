      Detection concepts the source supports: Ray job-submission logs showing a submitted job that runs nvidia-smi or opens a reverse shell from an external address; new authorized_keys entries for the Ray service account; a DKMS module build and initramfs change on a GPU host; a replaced NVML library; a mismatch between kernel-log GPU context or power activity and reported 0 percent utilisation (Elastic: the kernel log recorded the miner starting while nvidia-smi showed nothing). Hardening lever: do not expose the Ray job agent (not only the dashboard), require authentication in front of it. Elastic's IOC tables omitted. Dropped to borderline because the constituency exposure is narrow.
