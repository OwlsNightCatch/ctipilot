    entity_keys: ["actor:sapphire-sleet"]
    new_entities:
      - { key: "campaign:facestealer", type: campaign, name: "FaceStealer", aliases: [], summary: "FBI's name for a North Korean social-engineering scheme in which hijacked messaging accounts invite targets to fake Zoom or Teams meetings that replay stolen victim webcam video and stage an audio fault whose 'fix' installs malware; more than USD 400 million stolen in about 18 months and over 900 victim videos seized (FBI FLASH AC-111226-MS and DOJ, 2026-11-12)." }
    relation_suggestions:
      - { subject: "campaign:facestealer", object: "actor:sapphire-sleet", basis: "FBI attributes FaceStealer to North Korean state-sponsored hackers publicly known as Sapphire Sleet, UNC1069, BlueNoroff, APT38 and Stardust Chollima (FBI FLASH and DOJ, 2026-11-12)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Pursuant to a federal warrant, the FBI seized over 900 webcam videos of FaceStealer victims."
        attribution: "US Department of Justice"
        source_url: "https://www.justice.gov/opa/pr/justice-department-announces-actions-disrupt-north-koreas-massive-theft-cryptocurrency"
      - quote: "North Korean hackers known publicly by the names Sapphire Sleet, UNC1069, Dangerous Password, CryptoCore, Advanced Persistent Threat 38 (APT38), BlueNoroff, and Stardust Chollima have lured targets with invitations to video meetings delivered from accounts stolen from prior victims."
        attribution: "US Department of Justice"
        source_url: "https://www.justice.gov/opa/pr/justice-department-announces-actions-disrupt-north-koreas-massive-theft-cryptocurrency"
      - quote: "If prompted for an update while using a video chat service, do not run scripts or copy code into the command line or terminal to update the client."
        attribution: "FBI"
        source_url: "https://www.ic3.gov/CSA/2026/261112.pdf"
      - quote: "In several reported cases, the hackers stole cryptocurrency and hijacked communication accounts, months to over a year after the initial compromise"
        attribution: "FBI"
        source_url: "https://www.ic3.gov/CSA/2026/261112.pdf"
      - quote: "Instead, BlueNoroff spent the next six months meticulously changing almost every red-flag “tell” a target can see, but changed almost nothing about how the intrusion itself works."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/"
      - quote: "treat any request to run a command, script, shortcut, or workflow as a red flag, however polished the interaction looks, and confirm unusual requests through a separate, out-of-band known-good channel."
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/"
    extended_notes: |
      Provenance: FBI FLASH and the DOJ release are the same government's two documents of one action, so count them as one authority source; Arctic Wolf Labs (first-hand access to the operator's media library) is an independent primary, and CyberScoop is independent press. The FBI is not on the national-CERT carve-out list, but it owns this advisory. The PDF text extraction was clean after whitespace normalisation; the FBI's own FaceStealer page (fbi.gov/facestealer) was not readable.
      Exposure: staff or contractors who accept meeting invitations from known contacts on Telegram, LinkedIn, Slack or Discord, join through a link rather than the installed client, and have an installed client or terminal on a work device; open-source maintainers with registry or repository publish rights.
      Detection concepts (telemetry class first; the FLASH carries mostly IOCs, omitted): web/proxy and DNS logs for meeting domains that imitate Zoom or Teams (typosquats) reached from a messaging-app referral; endpoint process creation where a browser or meeting client is followed within minutes by a terminal, PowerShell or osascript launched from a pasted command; messaging-account takeover signs (new device login, changed recovery contact, all sessions closed); browser cookie-store access by a non-browser process; for maintainers, new publish events or dependency changes from a session shortly after such a meeting. The FLASH's own hardening list: join with the official client and an invite code rather than a web link, keep the webcam off until you see and hear the inviter, never run a script or paste code to 'update' a meeting client, confirm meetings out-of-band, enable MFA, login alerts and expiring messages on messaging apps. If compromised: secure and rotate credentials and sessions, tell contacts and employer, and note the FBI says failure to notify insulates the scheme.
      Transferable lesson is the ClickFix-style fix prompt inside a trusted-person meeting, plus the use of a victim's contacts and real video. Relevance to the constituency is indirect; I kept it as a new item because it is an authority-issued advisory with a specific, defensible control set, but S2 or S4 may also return the DOJ action, so dedup on campaign:facestealer. Suggested rating A1 for the source facts (authority, corroborated by independent press), priority notable.
  - title: "Project Zero moves to 'Full 90' disclosure now, 'Full 60' on 2 February 2027 and 'Full 30' on 3 January 2028, drops the grace period, and treats zero patch-to-exploit time as a reasonable attacker model"
    sources:
      - { url: "https://projectzero.google/2026/11/disclosure-policy.html", publisher: "Google Project Zero", date: "2026-11-13", role: "primary" }
      - { url: "https://projectzero.google/2026/10/emergency-patching.html", publisher: "Google Project Zero", date: "2026-10-06", role: "background" }
    discovery_trace: "first seen at: extra research-feed sweep of Project Zero, feed https://projectzero.google/feed.xml (item 'Policy and Disclosure: 2026 Edition', 2026-11-13) -> primary (no pivot needed): https://projectzero.google/2026/11/disclosure-policy.html -> background: https://projectzero.google/2026/10/emergency-patching.html"
    summary: |
      Project Zero announced a new vulnerability disclosure policy, 'Full X': vulnerabilities are disclosed X days after they are reported to the vendor. Effective immediately the policy is Full 90 (the old '90 + 30' grace and soak period is gone); it becomes Full 60 on 2 February 2027 and Full 30 on 3 January 2028. Most special cases, including the grace period and the variant policy, are removed. The remaining exceptions are vulnerabilities actively exploited in the wild (handled under Google's application-security disclosure policy), vulnerabilities already public, and disclosures a vendor requests. Project Zero's stated reasoning: LLMs have sped up both finding and exploiting vulnerabilities and raised the chance that several parties find the same bug, so the old remediation timeline is 'clearly insufficient'; attackers can derive bug details from a patch so quickly that 'zero patch-to-exploitation time is a reasonable, though imperfect, model of attacker behavior', which makes patch soak time meaningless; the volume of its reports has risen to several vulnerabilities a week in targets that once yielded a few a year. It asks vendors to cut the patch gap (the time between a fix and the user installing it) and to prepare non-patch protection, pointing to its October post on emergency-patching systems. Project Zero keeps tracking whether bugs are fixed but no longer makes that a decision point. Hardware issues may still receive exceptions, as Spectre and Meltdown did.
    region_nexus: "global; affects every organisation that consumes Google, Apple, Microsoft and other vendors' products reported through Project Zero"
    primary_sector_nexus: "indirect (patch-management obligations and timelines for all administrations)"
    sector: "multi"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
