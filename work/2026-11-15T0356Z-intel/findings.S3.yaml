    discovery_trace: "first seen at: extra research-feed sweep, stepsecurity-blog feed https://www.stepsecurity.io/blog/rss.xml (item dated 2026-11-12T15:00) -> primary: React GitHub advisory, URL https://github.com/facebook/react/security/advisories/GHSA-xqc2-xf4c-x3h3"
    summary: |
      The React team published CVE-2026-126187 (GHSA-xqc2-xf4c-x3h3; CWE-502; CVSS 4.0 9.5 per StepSecurity) for unauthenticated remote code execution in the React Server Components Flight transport, affecting react-server-dom-webpack, react-server-dom-parcel and react-server-dom-turbopack 19.0.0-19.0.8, 19.1.0-19.1.9, 19.2.0-19.2.8 and 19.3.0; fixed in 19.0.9, 19.1.10, 19.2.9 and 19.3.1, shipped 10 November. The advisory says it only affects extremely rare cases where one response carries multiple typed arrays and an attacker-controlled value; apps without a server or without an RSC-capable framework, bundler or plugin are not affected. StepSecurity's reconstruction from the five backport pull requests: the Flight writer wraps a large typed array's live ArrayBuffer without copying, a skipped zero-length chunk leaves a header promising bytes that never follow, and the parser then resynchronises on attacker-influenced bytes so a module reference executes; a matching version only identifies a dependency to review, not proof the runtime preconditions hold. It is the second serious Flight bug in twelve months (CVE-2025-55182, CVSS 10.0, December 2025).
