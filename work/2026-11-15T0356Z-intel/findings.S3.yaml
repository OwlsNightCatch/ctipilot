  - title: "React Server Components: CVE-2026-126187 unauthenticated code execution in the Flight transport (CVSS 4.0 9.5) fixed in 19.0.9, 19.1.10, 19.2.9 and 19.3.1; conditions are rare and no exploitation is reported"
    sources:
