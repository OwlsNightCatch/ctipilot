  - title: "FBI and DOJ: North Korea's 'FaceStealer' lures targets into fake Zoom and Teams meetings with hijacked contacts and recorded victim video, then has them paste a 'fix'; 900+ victim webcam recordings and cloud infrastructure seized"
    sources:
      - { url: "https://www.ic3.gov/CSA/2026/261112.pdf", publisher: "FBI (FLASH AC-111226-MS)", date: "2026-11-12", role: "primary" }
      - { url: "https://www.justice.gov/opa/pr/justice-department-announces-actions-disrupt-north-koreas-massive-theft-cryptocurrency", publisher: "US Department of Justice", date: "2026-11-12", role: "primary" }
      - { url: "https://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/", publisher: "Arctic Wolf Labs", date: "2026-11-12", role: "primary" }
      - { url: "https://cyberscoop.com/us-seizes-north-korea-hacking-infrastructure-binance/", publisher: "CyberScoop", date: "2026-11-13", role: "corroborating" }
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-facestealer-deepfake-meeting-intrusion-202/", publisher: "Cloud Security Alliance Lab Space", date: "2026-11-14", role: "background" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ (extract of the listing; note dated 2026-11-14) -> CSA note https://labs.cloudsecurityalliance.org/research/csa-research-note-facestealer-deepfake-meeting-intrusion-202/ (a re-report; its cited primaries followed) -> primary: FBI FLASH, URL https://www.ic3.gov/CSA/2026/261112.pdf (read with the bridge pdf subcommand; the fbi.gov page returned HTTP 403 on every transport) -> primary: DOJ, URL https://www.justice.gov/opa/pr/justice-department-announces-actions-disrupt-north-koreas-massive-theft-cryptocurrency ; cyberscoop feed https://cyberscoop.com/feed/ -> corroborating: https://cyberscoop.com/us-seizes-north-korea-hacking-infrastructure-binance/ ; FLASH acknowledgements name Arctic Wolf -> candidate-source probe of https://arcticwolf.com/resources/blog/feed/ -> independent primary: Arctic Wolf Labs, URL https://arcticwolf.com/resources/blog/still-in-the-meeting-bluenoroff-six-months-on/"
    summary: |
      On 12 November the FBI published FLASH AC-111226-MS (TLP:CLEAR) and the Department of Justice announced the seizure of cloud infrastructure behind a North Korean social-engineering scheme the FBI calls FaceStealer. The FBI attributes it to the cluster publicly tracked as Sapphire Sleet, UNC1069, Dangerous Password, CryptoCore, APT38, BlueNoroff and Stardust Chollima, and says it has stolen more than USD 400 million over about 18 months and attempted to compromise the open-source supply chain. The FBI-described cycle: a compromised first victim's Telegram or other messaging account is taken over (the actors log in from another device, change the recovery contact and close the victim's sessions) and used, with its chat history, to invite the victim's contacts to a meeting; shortly before the time a link to a typosquatted Zoom or Teams domain is sent, often after a Calendly invitation without a meeting link; the fake meeting plays prerecorded webcam video of earlier victims and the target's own webcam is recorded from the first click; a staged audio problem leads the target to click an 'update', run a script or paste a command into a terminal, which installs a cookie harvester, keyloggers, screen capture and a backdoor, and the new victim feeds the next round. Theft has followed months to over a year after infection, as the actors wait for wallet balances to grow. Deepfakes of well-known crypto figures are an emerging supplement, but the FBI says the scheme 'overwhelmingly' relies on genuine stolen video. Developers and maintainers are targeted for supply-chain reach: a maintainer of a JavaScript library with tens of millions of weekly downloads was lured into a fake Teams meeting this year and malicious dependencies were staged before responders stopped it, and the FBI knows of attempts against npm and Rust-crate maintainers. The FBI seized more than 900 victim webcam videos under a federal warrant and named Arctic Wolf, JUMPSEC and Microsoft Threat Intelligence as contributors of technical reporting; the DOJ release also covers a separate action on funds stolen from Binance (USD 1.2 billion seized or restrained of USD 2.7 billion frozen), already covered by the 2026-11-04 Binance entry.
      Arctic Wolf Labs (2026-11-12), independent of the FBI document though credited by it, adds what it saw through access to the operator's own media library: targets prepared grew from over 400 in April (100 verified) in 20 countries to 677 individuals in 58 countries, 84 percent founders and C-suite (counts are who was prepared against, not confirmed compromises); lure material now also comes from screen-recorded YouTube interviews and conference talks, so a target's likeness and voice can be faked without compromising them; video is made with a chain of generative-AI services and Arctic Wolf judged deepfakes by provenance, not by eye; and the meeting is no longer the only lure: shared financial documents, a fake Chrome PDF-viewer 'update' (an AppleScript download on macOS, pasted commands on Windows and Linux ending in a fake 'Update Complete' dialog), fake media players, identity-verification prompts, hardware-wallet access and security-audit workflows all end in the same step of running a 'fix'. Arctic Wolf says the brands and visuals keep changing while the mechanism (PowerShell, curl-piped and osascript execution of a pasted command) does not, and calls that user-run step the most reliable place to disrupt.
    region_nexus: "global; FBI audience is the crypto and Web3 industry and open-source maintainers; no Swiss victim named"
    primary_sector_nexus: "indirect (transferable social-engineering and ClickFix tradecraft against any staff who meet external contacts by video, and against developers with repository or registry rights)"
    sector: "multi"
    cves: []
    techniques: [T1078, T1534, T1566.003, T1583.001, T1204.004, T1125, T1056.001, T1539, T1113, T1195.002, T1657]
