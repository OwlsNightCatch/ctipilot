    summary: |
      Two telemetry-holding labs published the same week on agentic offensive frameworks, from different angles. Elastic read the source of ARTEX, CyberStrikeAI, Cairn, PentAGI and HexStrike (more than 60,000 GitHub stars between them, all already seen in intrusions per Elastic, citing Google GTIG for four of them) and states: none enforces authorisation in code by default; three tell the model it is authorised; the only restrictions active by default are blocklists for government domains in ARTEX and CyberStrikeAI and for education domains in ARTEX; ARTEX's own scope mechanism was removed; Cairn sidelines a refusing worker for five seconds and hands the task to another. Behaviour is a loop of bursts: GTIG measured ARTEX execution bursts of roughly two to 25 seconds, while NorForge saw one cluster's successful projects average just under 23 hours, so bursts have to be joined over a long lookback. When blocked, ARTEX and CyberStrikeAI change route (new addresses, User-Agents, free proxies in the target's country, then Tor), and GTIG relaying Wiz reports a cluster tracked as UNC7228 falling back to open proxies; Elastic therefore says detections keyed on what is requested outlast those keyed on source address or framework fingerprint, and ARTEX's developers logged about 390 commits in ten and a half weeks, so strings change faster than behaviour.
      Elastic's detection concepts: tempo per identity (count distinct sensitive actions per identity and issuing role in short windows) and sequence across sessions (join discovery, secret access and remote execution under the same role or address); an ES|QL hunt that normalises User-Agents into tool families and flags a source address using three or more families with 20 or more requests in a minute across web, proxy and cloud audit logs, which needs baselining against build systems, admins using the AWS CLI and shared NAT. Per-framework defaults are listed (scanners such as nuclei, httpx, katana, ffuf and sqlmap run by three parallel ARTEX workers; named User-Agents; new accounts registered on your applications followed by sign-ins from several sessions; a PentAGI host listening on TCP 28000-29999 that reports to its vendor every three hours; HexStrike's Python server on port 8888); Elastic notes any of these can change in the next release. Revocation lags: an Entra access token issued before an account is disabled generally stays valid for 60 to 90 minutes unless continuous access evaluation applies (Exchange, Teams, SharePoint; for service principals only Microsoft Graph), and AWS role-session revocation leaves IAM users' long-term keys alone.
      Talos (2026-11-13) adds ecosystem facts: more than 2,500 ARTEX-associated server addresses, with tools seen concurrently on them ranked by frequency (ScopeWeaver, AntiFox, CyberStrikeAI, PentAGI, ScopeSentry, VShell, Nessus, Interactsh, Acunetix, Fscan, NPS, AdaptixC2, Mimikatz, Cobalt Strike, Gophish, Chisel; Talos says co-occurrence does not prove ARTEX invoked each), more than 700 reachable PentAGI instances, ScopeWeaver as a localised derivative of ARTEX translated into English and Korean, and AntiFox as a delivery-enhanced version. Unit 42 (2026-11-11) counted 1,323 internet-facing hosts running CyberStrikeAI and 609 running ARTEX in October. Arctic Wolf (2026-11-10), the primary for AntiFox, tied Alibaba Cloud-hosted AntiFox interfaces to intrusions that began either with a compromised internet-facing IIS application (w3wp.exe creating an ASPX web shell and running commands; the flaw was not identified) or a valid AWS credential of unknown origin, then ran hundreds of API calls in about 30 minutes, mostly denied but with successful discovery and a successful GetSecretValue on a production secret, and separate S3 read, copy and delete operations.
