    relation_suggestions:
      - { subject: "campaign:polinrider", object: "campaign:contagious-interview", basis: "JFrog titles its AccuraSoftHire research 'Contagious Interview' and says its indicators are similar to North Korea-attributed campaigns PolinRider and ClickFake (JFrog, 2026-11-09); Apiiro describes the .env payload pattern as that of North Korea's fake job-interview repositories (Apiiro, 2026-11-09)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    evidence:
      - quote: "Apiiro research found the worm, PolinRider, in at least 7,609 GitHub repos owned by 2,330 accounts."
        attribution: "Apiiro"
        source_url: "https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"
      - quote: "Cleaning up doesn't stop it. 1,949 repos were infected again after they were publicly listed"
        attribution: "Apiiro"
        source_url: "https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"
      - quote: "Two packages the interview task used were installable for about five and seven months, until npm replaced them on November 12 and 13."
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines"
      - quote: "JFrog found no link between AccuraSoftHire and the Binance intrusion."
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines"
      - quote: "Blocking an individual server therefore does not disable the loader's ability to discover a replacement."
        attribution: "Sonatype Research"
        source_url: "https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages"
    extended_notes: |
      Exposure (sources): any developer or CI runner that builds an infected checkout (cloning alone runs nothing; npm run dev, build or lint loads the config, as do agents), any GitHub or npm token on a machine that ran an assignment, a recruiter "driver" command or an infected build, and any repository the owner can write to.
      Hunt and detection concepts the sources give (telemetry class first): (1) repository content: a semicolon followed by 200 or more spaces in a JS or TS build config (Apiiro's git grep), 40 or more consecutive \u00XX escapes, public chain-RPC hostnames in non-Web3 code next to a detached spawn, code that turns a transaction recipient into bytes; (2) GitHub Activity view / push log: force-pushes whose commit is dated days or weeks before the push, and read the diff of any force-push, not the message; (3) .vscode/tasks.json entries with runOn folderOpen that run node on files under fonts/, npm scripts beginning 'node init &&', a committed .env whose AUTH_API_KEY decodes to a URL; (4) egress: public Ethereum, BSC, TRON or Aptos RPC calls from CI runners and build containers, plain-HTTP fetches on TCP 443 (Sonatype: paths /0x/cls and /0x/ls); (5) browser: an extension loaded from a folder named job-new-alerts and a native-messaging host registered by a PowerShell script (JFrog).
      Post-cleanup check: removing the loader does not revoke the stolen access; rotate every GitHub and npm token the machine could reach, review deploy keys, Actions secrets, CI runs and releases since the infection (Apiiro). Hardening levers: block public chain RPC from CI and build containers; open unfamiliar repositories in VS Code Restricted Mode, which does not run automatic tasks; package cooldowns catch the short-lived look-alikes but not the two that lasted months (StepSecurity); never run interview assignments on a work machine.
      Triage lookalike: Web3 front-end code legitimately calls public RPC endpoints; the discriminator is a non-Web3 project, a detached node child process and an eval of fetched JavaScript at build time (Apiiro). Dedup note: GhostAction (entry 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft) borrowed this launcher (GitGuardian, 2026-10-27); this is the loader's own campaign, so a new entry with that entry in references[] rather than an update. Count caveats: every Apiiro number is a lower bound from its census (one pass 17 Oct, one code search 28 Oct); StepSecurity's npm download counts include mirrors and scanners.
      Suggested rating: Apiiro and JFrog are first-hand research (B); independent corroboration from Sonatype and StepSecurity makes credibility 1-2 (B1 or B2). Suggested priority notable.
  - title: "Huntress: 2,223 crypto-exchange-named fake guest sessions sit in 118 self-hosted ScreenConnect consoles, apparently bait for technicians whose clients are older than 26.6.5"
    sources:
      - { url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect", publisher: "Huntress", date: "2026-11-14", role: "primary" }
    discovery_trace: "first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (item dated 2026-11-14T01:50) -> primary (no pivot needed): https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect ; WebSearch (\"ScreenConnect fake sessions crypto exchange names KUCOIN-SRV unauthorized guest sessions MSP servers\", \"ScreenConnect unauthorized Access sessions crypto-named hosts Huntress 118 servers 2,223 fake sessions\", \"ScreenConnect Access fake guest sessions Binance Kucoin Reddit hacked please help ConnectWise statement November 2026\") found no independent report; the Reddit thread Huntress cites sits behind an anti-bot interstitial; ConnectWise's 2026-09-08 bulletin returned HTTP 403 on every transport"
    summary: |
      On 12 November an MSP asked Huntress about unfamiliar always-online machines named after crypto exchanges in its self-hosted ScreenConnect console. The MSP's server itself was clean (no web shells, child processes or new accounts). Huntress then collected the ScreenConnect session database from the Huntress-protected servers it could reach and counted 2,223 fake sessions on 118 servers across 109 accounts, enrolled between 3 and 13 November; the first server's Access installer had been publicly downloadable, which ScreenConnect allows without authentication by design. Names combine an exchange or crypto word with a role word (a pattern like KUCOIN-SRV or BACKUP-PROBIT); there are over 1,000 distinct names, each with a trading-desktop thumbnail, and about 98 percent of connections came from one IONOS-hosted address. Huntress saw no malicious activity from the sessions: the file and command events came from technicians, a few of whom opened a fake for under 30 seconds, and in one case a technician used the send-text feature twice, which ScreenConnect does not log. The operator revisited the servers every 151 seconds on the 29 servers with complete history, keeping sessions online.
      Huntress's leading hypothesis, stated as unobserved: the fakes are bait for a technician to connect so that a malicious guest can use the client-side file-transfer flaw CVE-2026-84869 (fixed in 26.6.5), which makes an unpatched technician workstation accept and run files without asking. It has not seen a crypto-named system push or run a file. Huntress also rules out the public suggestion that the fakes are a Joe Sandbox detonation, because the sessions send no key, reuse seven screenshot families and randomise hardware details, and revisited 100+ servers in the same order daily. Huntress found no overlap with the published SCKit indicators, so this is not the SCKit worm. Note an internal count inconsistency in the post (2,223 fake sessions in the background, 2,408 unauthorized guest sessions in the names paragraph; different snapshots).
    region_nexus: "global; MSPs and organisations running self-hosted ScreenConnect, including Swiss municipalities and public bodies that rely on IT providers for remote support"
    primary_sector_nexus: "direct (IT providers and administrations that run self-hosted remote-support consoles); no sector targeting stated"
    sector: "technology"
    cves: [CVE-2026-84869]
    techniques: [T1219.002, T1036.005, T1133]
    affected_products: ["ConnectWise ScreenConnect"]
    entity_keys: ["product:connectwise-screenconnect", "malware:sckit", "incident:screenconnect-sckit-msp-compromise-2026-11"]
    new_entities:
      - { key: "campaign:screenconnect-crypto-bait-sessions-2026-11", type: campaign, name: "ScreenConnect crypto-exchange bait sessions", aliases: [], summary: "Unattributed enrolment of thousands of fake guest sessions named after crypto exchanges into self-hosted ScreenConnect consoles from 3 November 2026, which Huntress hypothesises is bait for technicians running clients older than 26.6.5 and has seen used for nothing so far (Huntress, 2026-11-14)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "As of this writing, we've found 2,223 fake sessions on 118 servers across 109 MSP and organization accounts."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"
      - quote: "In our investigations, we found no evidence of any sort of malicious activity coming from these unauthorized sessions."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"
      - quote: "We haven't found any overlap between the crypto-bait fakes and the published SCKit indicators."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"
      - quote: "This is our leading hypothesis, but it's important to note that we have not observed the guest sessions being used this way."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"
    extended_notes: |
      Exposure: a self-hosted ScreenConnect server whose Access installer link is public or leaked, and any technician host client older than 26.6.5 (the build that blocks the CVE-2026-84869 transfer); read client versions from server session history (Huntress).
      Detection (telemetry class first): server database / session history: new guest sessions with ClientType 1 (Windows) and an empty guest public key, guest version 25.3.4.9288 claimed by every fake, empty company or site fields, crypto-site thumbnails; web or relay logs: many new Access guests from one external address in a short window; technician workstation process creation: ScreenConnect.WindowsClient.exe starting cmd.exe, powershell.exe, wscript.exe or msiexec.exe on a file under Documents\*\Temp\ (the host-side shape of CVE-2026-84869 exploitation, Huntress). Post-check: before deleting fakes, preserve App_Data\Session.db and its WAL file; compare technician-side versus guest-side events, because a fake alone shows reachability not exposure; if an unpatched client joined, inspect that workstation's ScreenConnect Temp and Startup folders and process history; treat text sent through send-text as possibly exposed credentials.
      Hardening levers: upgrade host clients to 26.6.5 or later (or remove TransferFiles from roles and session groups per ConnectWise's advisory), keep Access installer links private and rebuild leaked installers, restrict installer and web access, bar technicians from joining sessions they cannot tie to a customer, park unfamiliar sessions in a group technicians do not routinely browse.
      Triage lookalike (per Huntress): malware-analysis sandboxes detonating a ScreenConnect installer also create guest sessions; discriminators are that sandbox sessions send a key and JPEG screenshots of the analysis VM, while these send no key, reuse seven screenshot families and randomise hardware and OS details.
      Dedup note: store already has entries 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints and 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer; Huntress explicitly separates this from SCKit, so I return it as a new finding that should reference both (CVE-2026-84869 is covered by the second entry, so a new entry must declare it in references[]). Alternative for the composer: an update on the CVE-2026-84869 entry; I judge a new entry better because the observable (fake guest sessions in the console) and the action list differ. Single-source: no independent report found, the Reddit thread Huntress cites could not be read. Suggested rating B2, priority notable.
  - title: "Huntress: attackers abuse publicly exposed GeoVision camera software at 13 organisations, disable Defender with a vulnerable driver and IFEO hijacks, and run a miner whose loader finds its server through the BitTorrent DHT"
    sources:
      - { url: "https://www.huntress.com/blog/geovision-camera-software-xmrig-cryptominer", publisher: "Huntress", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (item dated 2026-11-13T14:00) -> primary (no pivot needed): https://www.huntress.com/blog/geovision-camera-software-xmrig-cryptominer ; WebSearch (\"GeoVision GeoStartupAgentService.exe XMRig Huntress exposed GeoVision attack November 2026\") found no other reporting and no GeoVision advisory"
    summary: |
      The Huntress SOC saw widespread malicious activity this week stemming from GeoVision webcam software, mostly between 8 and 10 November, across ten accounts and 13 organisations in various industries. Every malicious process descended from GeoStartupAgentService.exe, often as NT AUTHORITY\SYSTEM, and a Shodan search of the affected external addresses indicated publicly exposed GeoVision devices or management interfaces. Huntress names no CVE and does not say how code execution was obtained; it only says internet-exposed software gave the foothold. Observed chain: the GeoVision service spawns cmd.exe running a PowerShell download cradle; script a runs in memory and checks whether Defender is active; script b is written to disk and run through WMI, downloads a known vulnerable kernel driver (wsftprm.sys, saved as kvckiller.sys; bring-your-own-vulnerable-driver) to tamper with security products, and sets three Image File Execution Options Debugger values that redirect MsMpEng.exe, SecurityHealthService.exe and SecurityHealthSystray.exe to systray.exe; script c fetches a Go loader (update.exe) that embeds a BitTorrent Mainline DHT client and a PKARR resolver, so the operator can move servers without registering a domain, and creates scheduled tasks named PackageUpdater (every 15 minutes) and PackageUpdater_Startup that restart it; the loader then downloads XMRig. The motive observed is cryptomining; no data theft or ransomware is reported.
    region_nexus: "global; GeoVision is a Taiwanese video-surveillance and access-control vendor; no region or country stated for the 13 organisations"
    primary_sector_nexus: "indirect (physical-security cameras and access control at public buildings and critical sites are common GeoVision deployments; Huntress names no sector)"
    sector: "multi"
    cves: []
    techniques: [T1190, T1059.003, T1059.001, T1047, T1105, T1685, T1112, T1546.012, T1053.005, T1568, T1496.001]
    affected_products: ["GeoVision camera management software (GeoStartupAgentService.exe, WebCamServer.exe)"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "We have seen malicious activity across ten accounts and 13 organizations (all across various industries)."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/geovision-camera-software-xmrig-cryptominer"
      - quote: "All malicious activity stemmed from `GeoStartupAgentService.exe`; across many endpoints, the activity was run under the `NT AUTHORITY\\SYSTEM` account."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/geovision-camera-software-xmrig-cryptominer"
      - quote: "Organizations should treat camera management applications and software as part of the enterprise attack surface."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/geovision-camera-software-xmrig-cryptominer"
    extended_notes: |
      Exposure: a Windows host running GeoVision camera or access-control management software (GeoStartupAgentService.exe, WebCamServer.exe) reachable from the internet; Huntress's recommended lever is to remove public access and put the management interfaces behind a VPN or an allow-list.
      Detection (telemetry class first): process creation with parent lineage: cmd.exe or powershell.exe spawned by GeoStartupAgentService.exe, especially as SYSTEM; registry: new Image File Execution Options Debugger values for MsMpEng.exe, SecurityHealthService.exe and SecurityHealthSystray.exe; driver load: wsftprm.sys or a renamed copy (kvckiller.sys); scheduled tasks named PackageUpdater or PackageUpdater_Startup and update.exe run from the SYSTEM profile; network (Huntress's static-analysis suggestions): DNS queries to public resolvers made by a process other than the system DNS client, outbound UDP DHT traffic on port 6881 or similar from WebCamServer.exe, schtasks /Create launched by update.exe. If activity is found, isolate and preserve evidence before removing files.
      Gaps stated or implied: the initial-access flaw is not named (no CVE, no advisory found), the number of accounts is inconsistent inside the post (ten accounts in the text, nine in the ATT&CK table), and no GeoVision statement exists. Related store entry: 2026-07-09 Talos GeoVision disclosure (GV-I/O Box 4E, GeoWebPlayer) concerns different products; do not infer a link. Huntress also links an earlier camera-management-software compromise post (https://www.huntress.com/blog/camera-management-software-compromise-malware, not fetched). Suggested rating B2, priority notable-to-routine.
  - title: "Unit 42: CL-STA-1238 ran the open-source Cairn agent framework on Chinese AI models against 19 organisations in 25 operations; 10 were breached through authentication, access-control and default-credential flaws"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/", publisher: "Unit 42 (Palo Alto Networks)", date: "2026-11-12", role: "primary" }
      - { url: "https://norforge.com/blog/inside_cairn", publisher: "NorForge", date: "2026-10-19", role: "corroborating" }
      - { url: "https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex", publisher: "Elastic Security Labs", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: unit42, feed https://unit42.paloaltonetworks.com/feed/ (item dated 2026-11-12T15:00) -> primary (no pivot needed): https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/ ; WebSearch (\"Cairn AI penetration testing framework CL-STA-1238 GLM DeepSeek semiconductor defense civil society Unit 42\") found no independent coverage of CL-STA-1238 -> pivot: Elastic, URL https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex (links NorForge) -> corroborating: NorForge, URL https://norforge.com/blog/inside_cairn"
    summary: |
      Unit 42 reports that from August to September 2026 Chinese-speaking operators used Cairn, an open-source framework in which AI-driven workers plan and execute against a shared 'blackboard' of facts and intents, to run 25 autonomous operations against at least 19 organisations, and confirmed unauthorised access or data retrieval at 10. The operators paired a customised Cairn fork, hosted in Hong Kong, with the Chinese models Zhipu GLM 5.2 and DeepSeek V4 Flash and Pro (13, 8 and 4 operations; the stronger model was used for repeat attempts on targets that resisted), a skill pack not present upstream, a Chinese-language preamble asserting that all tasks are authorised and forbidding refusal, and a generated AUTHORIZATION.md per operation; neither model refused. Each task was seeded with a root domain and a one-line goal such as obtaining high-value access to a webshell, SSH, source, keys or credentials, ideally an internal-network foothold; against one semiconductor-equipment supplier the task already carried VPN gateway addresses, group names and shared group passwords, which Unit 42 reads as pre-gathered intelligence. Operations ran from 20 minutes to more than 50 hours.
      Targets: seven organisations across the semiconductor and advanced-manufacturing supply chain, three in defence and defence policy (a space technology company, a defence-analytics vendor, a policy think tank) and four civil-society bodies. Confirmed outcomes: weak-password spraying against an internet-facing application server of a standards organisation, which gave dozens of valid credentials and internal directory data, plus an unauthenticated cloud-storage write that overwrote a live standards-ballot document; a brute-forced production credential on a partner-integration application that was valid across accounts, followed by new administrator accounts and a persistent API token; an unauthenticated account-creation bypass on a content management system that minted valid sessions and exposed more than one million member records; an open backend registration endpoint on a defence-policy identity platform that exposed about 500 user records including .mil and .gov accounts. Unit 42 stresses that the flaws were known classes (authentication bypass, insecure direct object references, mass-assignment privilege escalation, weak and default credentials, exposed cloud APIs, dated public CVEs): AI raised the volume and coverage of exploitation, not its complexity.
      Attribution is Unit 42's moderate-confidence assessment of a China-nexus intelligence-collection campaign, tracked as CL-STA-1238, resting on Chinese-language artefacts, exclusive use of Chinese models and a target set matching Chinese state priorities; those are circumstantial lines, and the post does not discuss a Chinese-speaking criminal alternative. Independent context: NorForge (2026-10-19) found more than 20 exposed Cairn panels linked to malicious use and one Chinese-language cluster with over 1,100 attack projects across 14 dashboards, a different observation that does not name the same actor.
    region_nexus: "global; no Swiss or European victim named; targets are US-centred defence policy, semiconductor supply chain and civil-society organisations"
    primary_sector_nexus: "indirect (defence-policy and standards bodies, a defence-analytics vendor; identity and registration weaknesses transfer to any public web portal)"
    sector: "multi"
