  - title: "PolinRider: a DPRK-linked loader reaches developers through the fake-interview company AccuraSoftHire, hijacked npm releases and force-pushed forged commits in 7,609 GitHub repositories, and its server address lives in an Ethereum wallet"
    sources:
      - { url: "https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits", publisher: "Apiiro", date: "2026-11-09", role: "primary" }
      - { url: "https://research.jfrog.com/post/accurasofthire-fake-interview/", publisher: "JFrog Security Research", date: "2026-11-09", role: "primary" }
      - { url: "https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines", publisher: "StepSecurity", date: "2026-11-13", role: "corroborating" }
      - { url: "https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages", publisher: "Sonatype Research", date: "2026-11-04", role: "corroborating" }
      - { url: "https://socket.dev/blog/polinrider-github-packagist", publisher: "Socket", date: "2026-09-17", role: "background" }
      - { url: "https://blog.gitguardian.com/ghostaction-x-polinrider/", publisher: "GitGuardian", date: "2026-10-27", role: "background" }
    discovery_trace: "first seen at: apiiro-research, URL https://apiiro.com/blog/ (extract of the listing, card 'Under Your Name: Inside PolinRider ...', 2026-11-09) -> primary: Apiiro, URL https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits -> pivot: StepSecurity (extra feed sweep https://www.stepsecurity.io/blog/rss.xml), URL https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines -> primary: JFrog, URL https://research.jfrog.com/post/accurasofthire-fake-interview/ -> corroborating: Sonatype, URL https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages ; WebSearch (\"PolinRider worm forged GitHub commits Ethereum wallet loader North Korea 7,609 repos\") -> Socket, URL https://socket.dev/blog/polinrider-github-packagist ; GitGuardian, URL https://blog.gitguardian.com/ghostaction-x-polinrider/ (already an entry source of the GhostAction entry)"
    summary: |
      One North Korea-linked loader family, tracked as PolinRider, now reaches developers by three routes that share one trait: nothing runs at npm install, so install-script scanners see nothing, and the server address is read from the latest transaction of an Ethereum wallet, so blocking one server changes nothing.
      Route 1, a fake employer. JFrog traced a decoy company, AccuraSoftHire, with a careers site, Indeed and Glassdoor ads and ID-verified LinkedIn recruiters. Its React take-home test loads look-alike Tailwind CSS plugins whose build step runs the loader, a "camera driver" installed from a one-line curl command, and a "job alerts" browser extension loaded unpacked with a native-messaging host. JFrog found no link to the Binance intrusion, which began with the same lure class. StepSecurity then read the npm records: two look-alike packages stayed installable for about 169 and 211 days until npm replaced them on 12-13 November; the careers site went offline on 11 November, but JFrog found the same task from April under an earlier hiring account.
      Route 2, hijacked packages: Sonatype confirmed the same loader family in 12 releases of 10 hijacked npm packages on 3-4 November.
      Route 3, the repository worm. Apiiro's census found the loader in at least 7,609 repositories of 2,330 accounts (a lower bound, its own counts); between 27 October and 6 November it was pushed into 2,040 repositories. Using stolen GitHub access it force-pushes a copy of a commit the owner already made, keeping author, message and timestamps, with the loader appended after hundreds of spaces to a build config (tailwind.config.js, postcss.config.mjs, eslint.config.mjs). Apiiro read GitHub's push log: in 4,402 of 4,460 resolvable injection pushes the replaced commit was clean, and 94 percent of 9,990 pushes carried a commit dated more than an hour before the push, so git log looks normal. Cleaning up does not evict it: 1,949 repositories were infected again after being publicly listed, because the stolen token still worked. The newest variant adds a .vscode/tasks.json task with runOn folderOpen, so opening the folder in VS Code is enough; Apiiro counts 293 infected repositories that carry coding-agent configuration, which runs dev, build and lint.
      Attribution is by others' assessment: Apiiro and Socket call it North Korea-linked, JFrog says its indicators resemble campaigns attributed to North Korea this year (PolinRider and ClickFake), and Apiiro reports OpenSourceMalware tracing the chain to BeaverTail and InvisibleFerret. Observed second-stage capabilities (Apiiro, v1 stage): skips CI sandboxes, runs JavaScript or shell over socket.io, reads the clipboard, uploads files, plants a loader in VS Code, Cursor, Discord and GitHub Desktop; credential theft covers browser, wallet, SSH, cloud and git credentials (StepSecurity citing OpenSourceMalware).
    region_nexus: "global; developers on GitHub and npm in any region, including Swiss public-sector development teams that publish or consume open-source code"
    primary_sector_nexus: "indirect; software supply chain and developer workstations"
