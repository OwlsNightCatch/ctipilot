  - claim_id: d11dae3702
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "summary"
    kind: frontmatter
    text: "Huntress counted 2,223 unauthorized guest sessions on 118 self-hosted ScreenConnect servers at 109 MSP and organisation accounts, enrolled between 2026-11-03 and 2026-11-13 and named after crypto exchanges; on the 29 servers with complete history an operator revisited every 151 seconds to keep them online. Huntress's leading hypothesis, which it has not observed, is that they are bait for a technician with a client older than 26.6.5 to connect, so that CVE-2026-84869 runs a file on the technician's workstation; it saw no malicious activity from the sessions and found no overlap with the SCKit indicators."
  - claim_id: ac9688f81c
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "actions[0]"
    kind: frontmatter
    text: "On every self-hosted ScreenConnect server your organisation or its IT providers run, list guest sessions with an exchange-and-role name or empty company or site fields, copy App_Data\\\\Session.db and its WAL file before deleting any, and where a technician connected to one from a client older than 26.6.5, inspect that workstation's ScreenConnect Temp and Startup folders and process history and treat text sent through the session as exposed credentials, because Huntress suspects the sessions are bait for the file-transfer flaw CVE-2026-84869."
  - claim_id: a5d384e521
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade technician host clients to 26.6.5 or later, keep Access installer links private and rebuild leaked ones, restrict installer and web access where supported, bar technicians from joining sessions they cannot tie to a customer, and move unfamiliar sessions into a group technicians do not browse; in Huntress's hypothesis the target is a technician client below 26.6.5 ("
    urls: ["https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"]
  - claim_id: febf55dcc2
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: uncited
    text: "An MSP asked about them on 2026-11-12; its own server showed no web shells, suspicious child processes or new accounts, and the first Access installer Huntress examined was publicly downloadable, which ScreenConnect allows without authentication by design, and a guest client needs only the relay address embedded in the server's guest installer to register."
  - claim_id: bc39e1437e
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: derived
    text: "**Detection:** in the server session database, new guest sessions with ClientType 1 (Windows), an empty guest public key, empty company or site fields and crypto-site thumbnails (guest version 25.3.4.9288 is context, not unique on its own); in web or relay logs, many new Access guests from one external address in a short window; on technician workstations, `ScreenConnect.WindowsClient.exe` starting `cmd.exe`, `powershell.exe`, `wscript.exe` or `msiexec.exe` on a file under a Documents Temp folder, which Huntress calls the host-side shape of CVE-2026-84869 exploitation."
