claims:
  - claim_id: 9e4d635241
    entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor
    surface: "summary"
    kind: frontmatter
    text: "Between about 09:27 and 20:35 UTC on 2026-10-29 the Cursor VS Code Extension Marketplace served a modified copy of Anthropic's Claude Code extension, versions 2.1.312 and 2.1.313 for macOS and Windows, that appends an attacker's SSH key to authorized_keys, tries to enable SSH and open a reverse tunnel, and installs persistence that outlives the extension; coding errors made the SSH step fail on most standard-user hosts, so Cursor says the attacker could not log in there. Cursor's report of 2026-11-13 says the chain began with an access key it had issued to its vendor Fireworks AI, exposed by Fireworks, which gave the attacker a storage bucket of coding-agent traces holding some unredacted credentials, and that a stolen credential from the exposed data let the attacker write the extension straight onto the marketplace cache; Cursor says this was not a vulnerability in Anthropic's product."
  - claim_id: a64cf4bd99
    entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor
    surface: "record 2026-11-15T04:24:16Z"
    kind: record-summary
    text: "Cursor's own report of 2026-11-13 gives the origin the entry lacked: an access key Cursor issued to its vendor Fireworks AI was exposed, the attacker copied a bucket of coding-agent traces holding some unredacted credentials, and a stolen credential let it write the extension onto the marketplace cache; Open VSX never carried it and the last attacker activity, on 2026-11-01, was blocked."
  - claim_id: 48003b69c4
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "summary"
    kind: frontmatter
    text: "Apiiro found the PolinRider loader in at least 7,609 GitHub repositories owned by 2,330 accounts, where stolen GitHub access force-pushes a copy of the owner's own commit, with the same author, message and date, plus a loader hidden after hundreds of spaces in a build configuration file. Sonatype found the same loader in 12 hijacked npm releases and JFrog in a fake employer's take-home test and scripted camera check; none relies on an npm install script, the server address is read from an Ethereum wallet, and removing the code does not revoke the access that pushed it."
