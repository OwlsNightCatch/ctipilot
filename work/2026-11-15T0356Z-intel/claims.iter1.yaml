    kind: cited
    text: "Apiiro's checks are a semicolon followed by 200 or more spaces on any branch, a `.vscode/tasks.json` task with `runOn` set to `folderOpen` that runs node, and force-pushes in the GitHub Activity view whose commit is dated days before the push ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"]
  - claim_id: 028852b8c5
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "**Detection:** in process telemetry, a detached node child with no console started from a build script, editor or package entrypoint; in egress telemetry, build hosts and CI runners resolving public blockchain RPC endpoints and then making plain HTTP requests on port 443 to a bare IP address; in GitHub audit telemetry, force-pushes whose replacement commit repeats the replaced commit's author and message ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits", "https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages"]
  - claim_id: bb53529c25
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "**Triage:** blockchain developers legitimately call public RPC endpoints; the discriminator is a build or lint process in a project with no Web3 purpose doing so and then spawning a detached node child ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"]
  - claim_id: 440d94f55f
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat a machine or runner that built an infected checkout as compromised and rotate what it could reach, because the stolen access, not the file, reinfects; run take-home tests from unknown recruiters only in a throwaway virtual machine with no tokens or keys, and block public blockchain RPC from CI runners ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits", "https://research.jfrog.com/post/accurasofthire-fake-interview/"]
  - claim_id: 43c51283c1
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: uncited
    text: "Three routes share one trait: nothing runs at install time."
  - claim_id: 557be82a81
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: uncited
    text: "Forged commits: with stolen GitHub access the worm force-pushes a copy of a commit the owner already made, with the same author, message and date, plus a loader hidden after hundreds of spaces in a build configuration file; in 94% of 9,990 injection pushes the copy claims to be more than an hour older than the push, so `git log` shows an old commit under the owner's name."
  - claim_id: c3ca78d2ee
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: derived
    text: "**Exposure:** any developer machine, CI runner or coding agent that builds or opens a checkout the worm reached, installs one of the hijacked npm packages, or runs a take-home from an unverified recruiter."
