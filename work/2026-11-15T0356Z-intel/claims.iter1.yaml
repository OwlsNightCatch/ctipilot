  - claim_id: b5e3e9607c
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "headline"
    kind: frontmatter
    text: "PolinRider: forged backdated commits, npm hijacks and a fake recruiter run a loader at build or folder open"
  - claim_id: 79b1b6f3e3
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "summary"
    kind: frontmatter
    text: "Apiiro found the PolinRider loader in at least 7,609 GitHub repositories owned by 2,330 accounts, where stolen GitHub access force-pushes a copy of the owner's own commit, with the same author, message and date, plus a loader hidden after hundreds of spaces in a build configuration file. Sonatype found the same loader in 12 hijacked npm releases and JFrog in a fake employer's take-home test and scripted camera check; nothing runs at install time, the server address is read from an Ethereum wallet, and removing the code does not revoke the access that pushed it."
  - claim_id: 20d21b7c02
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "actions[0]"
    kind: frontmatter
    text: "Search every branch of your organisation's and suppliers' GitHub repositories for a semicolon followed by 200 or more spaces in JavaScript, TypeScript and build configuration files, and for .vscode/tasks.json tasks that run node when a folder opens; on any hit, rotate every GitHub and npm token reachable from the developer machines and CI runners that built the repository and review force-pushes, deploy keys, Actions secrets and releases since the infection, because deleting the loader does not revoke the access that pushed it."
  - claim_id: 5e683b1b2e
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "Apiiro calls PolinRider a North Korea-linked worm and found it in at least 7,609 GitHub repositories owned by 2,330 accounts, mostly developers' own ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"]
  - claim_id: 047037d146
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "Cloning runs nothing, building the project or running its dev, build or lint scripts loads the file, and in the newest wave opening the folder in VS Code is enough ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"]
  - claim_id: 2253c7cf12
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "Hijacked npm releases: Sonatype found concealed loaders in 12 releases across 10 hijacked packages with no install or postinstall hook, so disabling install scripts does not help ("
    urls: ["https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages"]
