  - claim_id: 9cccde94de
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: uncited
    text: "Entry was an SSL-VPN account without MFA that succeeded on the first attempt from an unusual country; neither egress address appears in any earlier failed login, so the credential was most likely held beforehand."
  - claim_id: 0747d443be
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: uncited
    text: "Within the hour the actor ran an anonymous SMB sweep, three Kerberoast-style service-ticket requests (the KDC logged an RC4 and DES downgrade against an AES-only account) and hundreds of failed SMB logons against a domain controller, then used a dormant, weak-password local administrator on an end-of-life Windows Server 2003 SQL host that allowed null sessions."
  - claim_id: 9503da9bcb
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
