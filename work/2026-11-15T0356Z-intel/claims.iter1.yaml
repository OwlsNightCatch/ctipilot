claims:
  - claim_id: 0310d71496
    entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor
    surface: "summary"
    kind: frontmatter
    text: "Between about 09:27 and 20:35 UTC on 2026-10-29 the Cursor VS Code Extension Marketplace served a modified copy of Anthropic's Claude Code extension, versions 2.1.312 and 2.1.313 for macOS and Windows, that appends an attacker's SSH key to authorized_keys, tries to enable SSH and open a reverse tunnel, and installs persistence that outlives the extension; coding errors made the SSH step fail on most standard-user hosts, so Cursor and Sophos say the attacker could not log in there. Cursor's report of 2026-11-13 says the chain began with an access key it had issued to its vendor Fireworks AI, exposed by Fireworks, which gave the attacker a storage bucket of coding-agent traces holding some unredacted credentials, and that a credential from those traces let the attacker write the extension straight onto the marketplace cache; Cursor says this was not a vulnerability in Anthropic's product."
  - claim_id: bf3000a313
    entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor
    surface: "actions[0]"
    kind: frontmatter
    text: "On every developer endpoint that runs Cursor, check extension-install telemetry for Anthropic.claude-code 2.1.312 or 2.1.313 installed between 09:27 and 20:35 UTC on 2026-10-29; where it is found, isolate the host, remove the unauthorized SSH key, the persistence and any running tunnel process, because uninstalling the extension removes none of them, and rotate every credential reachable from the host from a trusted system."
  - claim_id: 55ba7502cc
    entry: 2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor
    surface: "actions[1]"
    kind: frontmatter
    text: "Ask the admin of every Cursor team your organisation uses whether Cursor's email listing exposed keys arrived, and rotate every key it lists, because Cursor says coding-agent traces from sessions outside Privacy Mode held unredacted credentials."
