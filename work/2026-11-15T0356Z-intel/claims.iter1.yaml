    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "Cleanup does not hold: 1,949 repositories were infected again after being publicly listed because the stolen access still worked, and Apiiro counts roughly 2,300 developers whose push access, tokens and machines were reached ("
    urls: ["https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits"]
  - claim_id: dcdc76c8e3
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
