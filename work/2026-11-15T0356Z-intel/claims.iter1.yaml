    kind: cited
    text: "A fake employer: JFrog traced AccuraSoftHire, a decoy recruiter with a careers site, job ads and ID-verified LinkedIn recruiters, whose take-home loads a look-alike npm package and whose scripted camera check fails and hands the candidate a command that installs the same loader ("
    urls: ["https://research.jfrog.com/post/accurasofthire-fake-interview/"]
