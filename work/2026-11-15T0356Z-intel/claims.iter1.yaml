    urls: ["https://www.stepsecurity.io/blog/accurasofthire-fake-interview-developer-machines"]
  - claim_id: f3efc6e5cb
    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "body"
    kind: cited
    text: "The loader reads the newest transaction of a hard-coded Ethereum wallet, decodes two IPv4 addresses from its recipient field and fetches two stages over plain HTTP on port 443, so blocking one server changes nothing; the same wallet appears in GitGuardian's GhostAction report, which Sonatype says does not establish a shared operator ("
    urls: ["https://www.sonatype.com/blog/polinrider-loader-reappears-in-hijacked-npm-packages"]
