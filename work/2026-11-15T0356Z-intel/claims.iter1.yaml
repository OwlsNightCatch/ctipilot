    kind: frontmatter
    text: "Ransom-ISAC: Gentlemen affiliate went VPN without MFA to Domain Admin in an hour; GPO locker failed on replication"
  - claim_id: 91afdb7b37
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "summary"
    kind: frontmatter
    text: "Ransom-ISAC's incident-response report describes an early-August 2026 intrusion by a Gentlemen ransomware affiliate that began with an SSL-VPN account without MFA and reached Domain Admin in under an hour through a dormant local administrator on an end-of-life Windows Server 2003 host, then used a Rust credential harvester and the EtherRAT implant. The locker's GPO disabled antivirus across the estate but the task that runs it never reached clients because of a replication race, so it ran on one host; the report names the telemetry at each step. Single source, no victim named."
  - claim_id: 90c0b316c7
