  - claim_id: 0b6f26f76f
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "summary"
    kind: frontmatter
    text: "Huntress counted 2,223 unauthorized guest sessions on 118 self-hosted ScreenConnect servers at 109 MSP and organisation accounts, enrolled between 2026-11-03 and 2026-11-13 and named after crypto exchanges, which an operator keeps online by revisiting the servers every 151 seconds. Huntress's leading hypothesis, which it has not observed, is that they are bait for a technician with a client older than 26.6.5 to connect, so that CVE-2026-84869 runs a file on the technician's workstation; it saw no malicious activity from the sessions and found no overlap with the SCKit indicators."
  - claim_id: f158f1c889
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "actions[0]"
    kind: frontmatter
    text: "On every self-hosted ScreenConnect server your organisation or its IT providers run, list guest sessions with an exchange-and-role name, empty company or site fields or guest version 25.3.4.9288, copy App_Data\\\\Session.db and its WAL file before deleting any, and where a technician connected to one from a client older than 26.6.5, inspect that workstation's ScreenConnect Temp and Startup folders and process history and treat text sent through the session as exposed credentials, because Huntress suspects the sessions are bait for the file-transfer flaw CVE-2026-84869."
