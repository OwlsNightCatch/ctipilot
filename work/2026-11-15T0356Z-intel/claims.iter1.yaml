    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: uncited
    text: "An MSP asked about them on 2026-11-12; its own server showed no web shells, suspicious child processes or new accounts, and the first Access installer Huntress examined was publicly downloadable, which ScreenConnect allows without authentication by design, so a guest installer is all an operator needs to register guests."
  - claim_id: f450534f94
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: uncited
    text: "Huntress saw no malicious activity from the sessions: technicians who opened them mostly stayed under 30 seconds, and in one case a technician used the send-text feature, which ScreenConnect does not log, so Huntress treated it as a possible credential exposure."
  - claim_id: 8e338ad06b
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: uncited
    text: "It rejects the public suggestion that the sessions are a malware sandbox detonating installers."
  - claim_id: d3eb9e374a
    entry: 2026-11-15/screenconnect-crypto-bait-guest-sessions-118-servers
    surface: "body"
    kind: derived
    text: "**Detection:** in the server session database, new guest sessions with ClientType 1 (Windows), an empty guest public key, guest version 25.3.4.9288, empty company or site fields and crypto-site thumbnails; in web or relay logs, many new Access guests from one external address in a short window; on technician workstations, `ScreenConnect.WindowsClient.exe` starting `cmd.exe`, `powershell.exe`, `wscript.exe` or `msiexec.exe` on a file under a Documents Temp folder, which Huntress calls the host-side shape of CVE-2026-84869 exploitation."
  - claim_id: 5410abd99a
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
