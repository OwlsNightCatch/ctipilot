  - title: "jDownloads 4.1.8, Joomla download manager: front-end thumbnail upload runs PHP (CVE-2026-117551, CVSS 4.0 10.0, needs upload permission) and four more CVEs; every version to 4.1.7 affected, older lines have no fix"
    sources:
      - { url: "https://mysites.guru/blog/jdownloads-4-1-8-security-release/", publisher: "mySites.guru", date: "2026-11-12", role: "primary" }
      - { url: "https://www.jdownloads.com/index.php/news/jdownloads-v4-1-8-stable-security-update-released.html", publisher: "jDownloads (vendor release note)", date: "2026-11-12", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-117551", publisher: "CVE record (Joomla CNA; CISA ADP SSVC block)", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: mysites-guru, URL https://mysites.guru/rss.xml (feed item 'jDownloads 4.1.8 Fixes a Critical File Upload RCE and Eight More Security Issues', 2026-11-12T13:59Z, rotational lookback) -> primary: extract of https://mysites.guru/blog/jdownloads-4-1-8-security-release/ -> pivot: vendor note https://www.jdownloads.com/index.php/news/jdownloads-v4-1-8-stable-security-update-released.html -> pivot: CVE record https://cveawg.mitre.org/api/cve/CVE-2026-117551"
    lookback: true
    summary: |
      jDownloads, a third-party download manager for Joomla, shipped 4.1.8 on 2026-11-12 for Joomla 5 and 6 with
      nine listed security changes; the Joomla CNA published five CVE records for it the same day. The worst,
      CVE-2026-117551, is an unrestricted file upload (CWE-434) in the front-end thumbnail upload: per the CNA
      record, "insufficient validation of frontend thumbnail uploads allowed users with upload permission to place
      executable files on the server", which gives PHP code execution; the CNA scores it CVSS 4.0 10.0 with no
      privileges required, while its own text and mySites.guru say the attacker needs upload permission, so reach
      depends on which user groups a site allows to upload from the front end. The other four are an SSRF through
      redirects in external-download processing (CVE-2026-117543, 8.9, needs a high-privilege account), a download
      permission bypass (CVE-2026-117544, 8.2), publication of submissions without approval (CVE-2026-117550, 7.1,
      any logged-in account) and an authenticated path traversal (CVE-2026-117542, 5.1). All five records give 1.0.0
      to 4.1.7 as affected and 4.1.8 as the only fixed release; mySites.guru adds that 4.0.x, 3.9 and older lines
      have no fix on their own line. Four further changes have no CVE yet, among them a 4.1.x scan page that ran
      without a login and showed the scan's secret key (mySites.guru's own score 6.9); the update does not rotate
      that key, so it must be rotated by hand (vendor and mySites.guru say the same). No source reports
      exploitation: CISA's ADP SSVC entry of 2026-11-12 reads Exploitation none, Automatable yes, Technical Impact
      total; mySites.guru's rendering of the vector carries E:A, which the CNA record does not (exploit maturity not
      defined), so that letter should not be read as an attack report. EPSS 0.0044. This is a different flaw from
      CVE-2026-61900 (unauthenticated upload endpoint removed in 4.1.6): a site that updated for that one is still
      exposed until 4.1.8.
    region_nexus: "global; Joomla sites incl. communal and cantonal web presences possible, Swiss footprint unverified"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-117551, CVE-2026-117543, CVE-2026-117544, CVE-2026-117550, CVE-2026-117542]
    techniques: [T1190, T1505.003]
    affected_products: ["jDownloads extension for Joomla"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "CVSS 10.0 RCE in a popular Joomla extension, from the Joomla third-party-extension stream the audits have repeatedly recovered misses from (mysites-guru record), but it needs upload permission (site configuration dependent), no exploitation is reported (CISA ADP SSVC none, EPSS 0.004) and the Swiss footprint is unknown; drop unless the main agent wants stream continuity. Sibling posts of 2026-11-12/13 on the same feed (AcyMailing 11.1.2 seven authorisation flaws, worst 8.8 forced unsubscribe, no RCE or SQLi; Joomill Autolanguage stored XSS; Kunena stored XSS) were dropped."
    evidence:
      - quote: "Front-end thumbnail uploads were not validated properly, so a user with upload permission could place an executable file on the server and run PHP code."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/jdownloads-4-1-8-security-release/"
      - quote: "This release fixes multiple security issues and improves file-management stability."
        attribution: "jDownloads (vendor release note)"
        source_url: "https://www.jdownloads.com/index.php/news/jdownloads-v4-1-8-stable-security-update-released.html"
    extended_notes: |
      Exposure: Joomla 5 or 6 sites running jDownloads 4.1.7 or earlier (read the installed version from the component
      itself, not only the Joomla updater, per mySites.guru's note for other extensions), where front-end upload is
      allowed to groups that include untrusted users. Detection concept (derived from the stated mechanism, not from
      a source): new script-type files in the component's thumbnail or upload directories and web-server requests that
      fetch them; after updating, rotate the scan key. Hardening lever: update to 4.1.8, restrict front-end upload
      permission to trusted groups, block script execution in upload directories at the web server.

