items:
  - title: "Cursor's own incident report gives the origin of the marketplace compromise: an access key it issued to the AI infrastructure provider Fireworks was exposed, a shared storage bucket held coding-agent traces with unredacted credentials, and a credential from them let the attacker put the tampered Claude Code copies on the marketplace cache"
    sources:
      - { url: "https://cursor.com/blog/security-incident-update", publisher: "Cursor (An update on our recent security incident)", date: "2026-11-13", role: "primary" }
      - { url: "https://fireworks.ai/security/bulletins/october-2026-security-incident-update", publisher: "Fireworks AI (Update on October 2026 security incident)", date: "2026-11-09", role: "primary" }
      - { url: "https://fireworks.ai/security/bulletins/october-2026-security-incident", publisher: "Fireworks AI (Fireworks October 2026 security incident)", date: "2026-10-10", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/", publisher: "BleepingComputer", date: "2026-11-14", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch-adjacent news sweep, BleepingComputer feed URL https://www.bleepingcomputer.com/feed/ (item 'Cursor confirms security breach led to malicious Claude Code extension', 2026-11-14T12:27Z) -> pivot: article https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/ -> primary: https://cursor.com/blog/security-incident-update (published 2026-11-13) -> pivot: Fireworks listing https://fireworks.ai/security/bulletins (WebFetch, hrefs) -> primary: https://fireworks.ai/security/bulletins/october-2026-security-incident-update and https://fireworks.ai/security/bulletins/october-2026-security-incident"
    summary: |
      Cursor's incident report of 2026-11-13 answers the question the covered entry
      (2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor) says no source answered, how the attacker
      could publish under Anthropic's name. Cursor states: an access key it had issued to Fireworks, a third-party
      model training and inference provider, was exposed by Fireworks; the attacker used it to copy data from a
      read-only storage bucket Cursor used to share data with Fireworks; the bucket held historical coding-agent
      traces (mostly 2025, from sessions not in Privacy Mode, which Cursor was permitted to use for model training)
      and a small number of the traces carried unredacted credentials (under 0.01% of customers had API credentials
      exposed, under 0.05% of users had traces exposed, by Cursor's count). With those credentials the attacker
      reached select SaaS tools and took archived non-production repositories, limited support data and email
      conversations, usage metrics and contact details, summaries of some agent conversations, and credentials
      users had sent to Cursor support. On 2026-10-29 a credential taken from that data let the attacker place the
      tampered copies of Anthropic's Claude Code extension (2.1.312 and 2.1.313) directly on the cache that serves
      the Cursor marketplace; Cursor says Open VSX never held the malware, Anthropic did not publish the copy, and
      at most 5,000 users who requested those cached versions on 2026-10-29 may have received it. Cursor says the
      last attacker activity it saw was on 2026-11-01 and was blocked, that no release signing keys were exposed,
      and that it shipped Cursor from a separate code-hosting system the attacker never reached. It moved all
      inference off Fireworks, rotated every credential it found exposed and, as a precaution, all credentials in
      use internally, and rebuilt the marketplace. Fireworks' own bulletins (2026-10-10, updated 2026-11-09) are
      the other end of the chain: it identified unauthorised use of internal credentials on 2026-10-06, later found
      impact to account and billing information and, for a limited set of accounts, to secrets, datasets and
      incomplete models, and reports a second event in which a third-party cloud provider hosting its R&D machines
      had an incident on 2026-10-23 that the unauthorised party used on 2026-10-24 to reach development machines.
      Fireworks says the evidence indicates links to a financially motivated LLMjacking group and points to the
      2026-11-02 Google/Mandiant LLMjacking post. Assessment boundary: neither Cursor nor Fireworks names an actor
      for the extension publication, Fireworks' pages never mention Cursor, and the Cursor-Fireworks link rests on
      Cursor's statement that Fireworks exposed the key; an LLMjacking motive (selling model access) does not by
      itself explain an SSH-backdoor extension, so the two should not be merged into one cluster.
    region_nexus: "global; AI coding assistant and AI infrastructure supply chain; Swiss public-sector nexus indirect (developers and technology suppliers using Cursor)"
    primary_sector_nexus: "indirect"
