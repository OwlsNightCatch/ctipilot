    extended_notes: |
      Delta for the existing entry: root cause and data-exposure chain (new), Cursor's containment statement
      (last attacker activity 2026-11-01), the second-hand credential exposure (traces and support-sent
      credentials; affected users notified directly, no notice means not in the traces), and the Fireworks side.
      Exposure line material: Cursor users who ran coding-agent sessions in 2025 with Privacy Mode off and had
      secrets in the agent context, anyone who sent credentials to Cursor support, and anyone who installed or
      updated Anthropic.claude-code 2.1.312 or 2.1.313 from the Cursor marketplace on 2026-10-29 (Cursor: uninstalling alone may not be enough).
      Detection concept (telemetry class first, assessment from the stated mechanism): usage of API keys and
      tokens that were present in agent sessions or support threads (cloud and SaaS audit logs, key-usage
      logs) from unfamiliar locations after 2026-10 until rotated; Cursor says it asked issuing services to revoke
      the credentials it identified. Supplier-risk takeaway: a tool vendor's data-sharing bucket with an AI
      vendor, plus unredacted secrets in agent traces, became the path to the vendor's marketplace; hold AI
      assistant vendors to the same credential-scoping and network-restriction questions as other suppliers.
      Overlap note: this is incident-shaped and S4 may surface the same story; the 2026-11-09 LLMjacking entry
      (2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale) covers the GTIG report Fireworks cites,
      but Fireworks does not name UNC6993, so no actor relation is suggested.

  - title: "Fortinet's Node2Shell advisory FG-IR-26-187 (CVE-2026-111497, Brotli decoder) still lists 11 products as under investigation on its 2026-11-13 revision, among them FortiPAM, FortiEDR, FortiVoice, FortiFone and the FortiSwitch family, with no fixed version or workaround, while CISA lists the flaw as exploited"
    sources:
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-187", publisher: "Fortinet PSIRT (FG-IR-26-187, Node2Shell CVEs)", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: fortinet-psirt, URL https://filestore.fortinet.com/fortiguard/rss/ir.xml (feed read with N=80; FG-IR-26-187 listed 'Node2Shell CVEs', CVSSv3 9.8, 'Revised on 2026-11-13', link https://fortiguard.fortinet.com/psirt/FG-IR-26-187) -> primary (no pivot needed): extract and WebFetch of https://fortiguard.fortinet.com/psirt/FG-IR-26-187"
    summary: |
      Fortinet's advisory FG-IR-26-187, first published 2026-10-26 and revised on 2026-11-13, covers ten Node.js
      CVEs under the name Node2Shell, including CVE-2026-111497 ("A flaw in Node.js can cause Node.js Brotli
      decoder out-of-bounds write permits remote code execution", affecting Node.js 26.x, 24.x and 22.x). The
      page states "Fortinet is currently investigating the impact of these CVEs over Fortinet Products" and lists
      eleven products still under investigation: FortiDAST, FortiEDR, FortiFone, FortiPAM, FortiRecon, FortiSandbox
      PaaS, FortiSwitch, FortiSwitch NMS, FortiSwitchAX, FortiSwitchAX-Chassis and FortiVoice. A long list of
      products is marked not impacted (FortiOS, FortiMail, FortiManager, FortiAnalyzer, FortiAuthenticator,
      FortiClient EMS, FortiSIEM, FortiNAC and FortiSandbox among them, 64 distinct names by count of the page);
      the revision timeline on the page shows the not-impacted list being extended on 2026-10-28, -29, -30,
      2026-11-03, -05, -06 and -13. FortiSwitchAX appears in both lists, a contradiction on the page itself. The
      advisory carries no fixed version, solution or workaround section; its header (read through WebFetch) gives
      CVSSv3 9.8, temporal 9.0, attack type unauthenticated, and "Known Exploited: No", which differs from CISA's
      KEV listing of CVE-2026-111497 (added 2026-10-27, already in the covered entries). The two statements are
      about different things: Fortinet reports on its own products, CISA on the flaw in the wild. EPSS 0.83.
      The covered Brotli vendor-impact entry lists Siemens, Mitel, Cisco and Apple and does not mention Fortinet.
    region_nexus: "global; Fortinet is widely deployed in Swiss administrations (FortiOS and FortiMail are confirmed not impacted; FortiPAM, FortiEDR and FortiVoice are still open)"
