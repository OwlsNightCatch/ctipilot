    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-31/cursor-marketplace-claude-code-extension-ssh-backdoor"
    suggested_record:
      type: update
      fields: [summary, body, sources, evidence, entities, techniques]
      delta: "Root cause, scope of data theft, marketplace-cache mechanics, last attacker activity (2026-11-01) and remediation from Cursor's own report; the prior text's statement that no source says how the attacker published under Anthropic's name is now answered by Cursor itself."
      suggested_classification: "reliability A (first-party incident report), credibility 2 (first-party; the Fireworks bulletin and Wiz independently describe the upstream vendor breach but not Cursor's chain)"
    evidence:
      - { quote: "An attacker obtained an access key we had issued to Fireworks.", attribution: "Cursor (incident report)", source_url: "https://cursor.com/blog/security-incident-update" }
      - { quote: "On October 29, using a stolen credential from the exposed data from our internal system, the attacker placed malicious, unauthorized copies of Anthropic's Claude Code extension directly on the cache used to serve the Cursor VS Code extension marketplace.", attribution: "Cursor (incident report)", source_url: "https://cursor.com/blog/security-incident-update" }
      - { quote: "The marketplace source, Open VSX, never had the malware.", attribution: "Cursor (incident report)", source_url: "https://cursor.com/blog/security-incident-update" }
      - { quote: "The last attacker activity we have seen was on November 1, and it was blocked.", attribution: "Cursor (incident report)", source_url: "https://cursor.com/blog/security-incident-update" }
    extended_notes: |
      Exposure/Detection angle the sources support: the exposed asset was data shared with an AI vendor (agent traces from non-Privacy-Mode sessions) that held live credentials, so the check for any organisation is which vendor-shared buckets or exports contain agent or support transcripts with secrets, and whether vendor-issued keys are network-restricted. For Cursor users who installed 2.1.312 or 2.1.313 the earlier post-patch advice stands (uninstall alone is not enough). Cursor's page says it will update the post if anything changes.
