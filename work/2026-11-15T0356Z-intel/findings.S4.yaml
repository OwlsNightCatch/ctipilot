  - title: "Saxony: radio pager alerts of fire brigades, ambulance services and civil protection, with patient names, addresses and diagnoses, were readable by outsiders for years and mirrored in a social network; the LKA investigates"
    sources:
      - { url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html", publisher: "heise online", date: "2026-11-12", role: "primary" }
