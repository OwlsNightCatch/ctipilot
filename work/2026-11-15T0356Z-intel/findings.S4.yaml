  - title: "Cursor's own incident report of 2026-11-13: the marketplace extension compromise started with an access key exposed at its AI vendor Fireworks, and a stolen credential let the attacker write straight into the marketplace cache"
    sources:
      - { url: "https://cursor.com/blog/security-incident-update", publisher: "Cursor (incident report)", date: "2026-11-13", role: "primary" }
      - { url: "https://fireworks.ai/security/bulletins/october-2026-security-incident-update", publisher: "Fireworks AI (security bulletin update)", date: "2026-11-09", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/", publisher: "BleepingComputer", date: "2026-11-14", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed, item https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/) -> primary: Cursor incident report, URL https://cursor.com/blog/security-incident-update -> upstream: Fireworks bulletin, URL https://fireworks.ai/security/bulletins/october-2026-security-incident-update -> context: Wiz, URL https://www.wiz.io/blog/black-october-for-ai-developer-platforms"
    summary: |
      Cursor's incident report of 2026-11-13 answers the question the covered entry leaves open (how the attacker published under Anthropic's name). Cursor says an attacker obtained an access key it had issued to its vendor Fireworks, which Fireworks had exposed, and used it to copy data from a read-only storage bucket Cursor used to share data with Fireworks. The bucket held mostly 2025 coding-agent traces from sessions not in Privacy Mode; a small number contained unredacted credentials (under 0.01% of customers had API credentials exposed, under 0.05% of users had traces exposed). With those credentials the attacker reached select SaaS tools and took archived non-production source repositories (some with business contact data), limited support data and e-mail, product usage metrics and contact details, summaries of some agent conversations, and credentials users had sent to support. On 2026-10-29, using a stolen credential from that data, the attacker placed copies of Anthropic's Claude Code extension directly on the cache that serves the Cursor extension marketplace; Cursor states Anthropic's product was not vulnerable, Open VSX never held the malware, at most 5,000 users who requested the cached versions could have received it, and it was online about 11 hours. Cursor says its monitoring found the activity, that the last attacker activity was on 2026-11-01 and was blocked, that releases ship from a separate code-hosting system the attacker never reached and no release signing keys were exposed, and that it moved inference away from Fireworks, rotated every credential it found and then all credentials across internal systems, rebuilt the marketplace, restricted network access for service-provider credentials where possible and added secret scanning. The incident is one of a wave Wiz calls Black October (see separate item).
    region_nexus: "global; NCSC Switzerland's Cyber Security Hub already carried the 2026-10-29 extension notice (post 13121 per the covered entry)"
    primary_sector_nexus: "indirect (developer tooling used by public-sector software teams and suppliers)"
    sector: "technology"
    cves: []
    techniques: [T1078.004, T1530, T1552.001, T1195.002]
    affected_products: ["Cursor", "Anthropic Claude Code (extension copy served from Cursor marketplace)", "Fireworks AI"]
    entity_keys: ["incident:cursor-claude-code-extension-compromise-2026-10", "product:cursor", "product:anthropic-claude-code"]
    new_entities:
      - { key: "incident:fireworks-ai-security-incidents-2026-10", type: incident, name: "Fireworks AI security incidents (October 2026)", aliases: ["Fireworks AI breach"], summary: "Two October 2026 intrusions at the AI inference platform Fireworks AI: unauthorised use of internal credentials from 2026-10-06 that exposed customer secrets stored as environment variables in evaluation jobs, and a 2026-10-24 intrusion through a third-party cloud provider hosting its R&D machines that also reached billing data, datasets and incomplete model weights (Fireworks AI, 2026-10-10 and 2026-11-09)." }
    relation_suggestions:
