    summary: |
      Fireworks AI, an inference platform, disclosed on 2026-10-10 that on 2026-10-06 it found unauthorised use of internal credentials through which a third party read environment variables, including API keys and tokens stored as secrets, used in evaluation jobs in a limited number of customer accounts. Its update of 2026-11-09, written with Palo Alto Networks Unit 42, adds account and billing data and, for a limited set of accounts, secrets, datasets and incomplete model weights, and a second intrusion: a third-party cloud provider that hosted Fireworks R&D machines had an incident on 2026-10-23, and on 2026-10-24 the intruder used it to reach Fireworks development machines and run an unauthorised workload. Fireworks states the evidence links to a financially motivated group selling tokens for LLM access to illicit routing gateways, known as LLMjacking (the vendor's assessment); it reports no impact to its zero-data-retention inference, training SDK and Nexus services. Downstream, Cursor's 2026-11-13 report traces its marketplace compromise to an access key issued to Fireworks (separate update item), and BleepingComputer reports that Notion disclosed AI chat transcripts of a small number of workspaces were exposed through Fireworks. Wiz, which calls the wider wave Black October, lists incidents since early October at Fireworks, Railway, Zeabur, Lightning AI, OpenCode, Warp, Brev, Trigger.dev, Chainstack, kernel.sh, Tensorlake, NEAR AI and others, says Fireworks, Zeabur and Lightning attribute their root causes to credential access and that all public reports describe targeted hunting of stored environment variables that grant AI access, and observed stolen cloud keys used for Bedrock model calls within about 30 minutes of the vendor-side credential access, with roughly 800,000 and 1.7 million calls in two cases (over USD 100,000 at list price). Wiz links the key use to LLM-resale infrastructure but says it cannot establish that the resellers performed the intrusions.
