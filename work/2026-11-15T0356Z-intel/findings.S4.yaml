  # ---------------------------------------------------------------------------
  - title: "The Gentlemen affiliate, from SSL-VPN account without MFA to Domain Admin in under an hour: Ransom-ISAC's incident-response report shows the domain-wide GPO locker failing on replication lag while the antivirus-disabling policy still applied"
    sources:
      - { url: "https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/", publisher: "Ransom-ISAC", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: ransom-isac, URL https://ransom-isac.org/blog/ (listing via extract; post link found with url --direct https://ransom-isac.org/blog/) -> primary (no pivot needed): https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"
    summary: |
      Ransom-ISAC's report of 2026-11-13, from a single incident-response engagement (images of two domain controllers, event logs of 41 hosts, firewall logs), reconstructs an early-August 2026 intrusion by an affiliate of The Gentlemen ransomware group into a small company. Entry was a valid SSL-VPN account without MFA that succeeded on the first attempt from an unusual country; neither of the attacker's egress addresses appears in any earlier failed login, which Ransom-ISAC reads as the credential being held in advance. Within the hour the actor ran a scripted anonymous SMB sweep, a failed Kerberoast with RC4 downgrade and a burst of failed SMB logons against a domain controller, then used a dormant weak-password local administrator account on an end-of-life Windows Server 2003 SQL host that allowed null sessions; a Domain Admin session on the domain controller opened less than an hour after the first login, which Ransom-ISAC attributes to Domain Admin credentials on that host (it could not prove the step). From that session the actor pushed tools with a transfer pattern resembling evil-winrm: a Rust credential harvester packed with a licensed Enigma Protector (it takes system secrets including the DPAPI domain backup key and browser-saved secrets) and EtherRAT, the Node.js implant that reads its command-and-control address from an Ethereum smart contract (a different contract and operator wallet from earlier public reporting; the implant never reached its C2). Data left through the VPN tunnel over about two days of a weekend. The locker, run on a domain controller in domain-wide mode, built a GPO linked enforced at the domain root and the Domain Controllers container with eight registry values disabling antivirus and a Preferences scheduled task in SYSVOL; a call that registers the Preferences client-side extension reached a domain controller where the new GPO had not yet replicated, the script suppressed the error, so the task never reached clients: antivirus was disabled estate-wide but the locker ran on one host, which wiped its own logs. Attribution to The Gentlemen rests on ransom-note, file-footer and file-extension traits plus a claim of responsibility. Single source (Ransom-ISAC, reliability C), no victim named.
    region_nexus: "unspecified (victim confidential); Gentlemen has a Swiss supplier-to-authorities case in the store (FTAPI)"
    primary_sector_nexus: "indirect (same ransomware affiliate ecosystem that hit a Swiss supplier; generic VPN/legacy-host/GPO pattern)"
    sector: "unspecified (small company)"
    cves: []
    techniques: [T1133, T1078, T1135, T1558.003, T1110, T1078.003, T1078.002, T1021.006, T1105, T1003, T1555, T1547.001, T1048, T1484.001, T1685, T1685.005, T1486]
    affected_products: []
    entity_keys: ["actor:thegentlemen", "malware:etherrat"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "single-victim, out-of-nexus DFIR write-up from a reliability-C community source, also likely to be returned by S3; kept for the same-actor read (The Gentlemen already touched a Swiss authority supplier) and the defender-useful failure mode of GPO-based deployment under replication lag with concrete GPO, VPN and legacy-host detection points"
    evidence:
      - { quote: "Access came through a valid SSL-VPN credential without MFA.", attribution: "Ransom-ISAC", source_url: "https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/" }
      - { quote: "The locker's domain-wide mode most likely failed because of a replication race.", attribution: "Ransom-ISAC", source_url: "https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/" }
      - { quote: "Everything here comes from a single incident response engagement.", attribution: "Ransom-ISAC", source_url: "https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/" }
    extended_notes: |
      Detection points the report gives, by telemetry class: authentication/KDC logs (a KDC warning for RC4 or DES advertised against an AES-only service account, i.e. a Kerberoast etype downgrade; bursts of SMB logon failures from one client including expired-password answers that reveal valid credentials; null-session logons with random sixteen-character workstation names followed by a dormant local account logon on a legacy host); directory/GPO change records (a new GPO linked enforced at the domain root, a Preferences scheduled-task file written into SYSVOL outside the management console, a change to a new GPO's client-side-extension attribute; RSAT or GPMC installed on a server that never had them); endpoint (a Run value named like a browser updater on a host with no such product, node.exe fed its script on standard input by a node.exe parent on a server, a server resolving three or more of seven public Ethereum RPC providers, antivirus preference changes that disable real-time monitoring, the security log cleared together with every other channel, shadow-copy plus change-journal deletion on one host); VPN logs (sessions held to maximum duration with immediate reconnection and large outbound volume from one account). Benign lookalikes the report names: scanners and inventory tools for the anonymous SMB sweep, legacy applications for null sessions, administrators for RSAT/GPO tooling, developers for Node.js and Ethereum RPC lookups (hence server-only scoping), backups and remote workers for long VPN transfers. Hardening levers: MFA on every SSL-VPN account, retire or isolate the Windows Server 2003 host, remove dormant local admin accounts, and keep Domain Admin accounts off legacy hosts.
