    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed, item https://www.bleepingcomputer.com/news/security/german-military-drone-operations-disrupted-by-cyberattack/) -> pivot: Der Spiegel, URL https://www.spiegel.de/politik/massiver-cyberangriff-auf-drohnenhersteller-quantum-systems-a-354b0289-2281-4af6-a532-ee03b45d8b30 (teaser only) -> WebSearch (\"Quantum Systems Cyberangriff Drohnenhersteller Bundeswehr\", allowed_domains heise/golem/handelsblatt/t-online/theregister) -> The Register, Handelsblatt, t-online. The company statement (https://quantum-systems.com/news/cyberattack-defeated/) returned HTTP 403 to every transport and is not cited."
    summary: |
      Quantum Systems, the Gilching (Munich) maker of reconnaissance and interceptor drones used by the Bundeswehr and supplied to Ukraine, published a statement on 2026-11-12 that it had detected an incident caused by "hostile actors" at the end of October and that operating its unmanned systems carries no risk for end users (company statement as relayed by BleepingComputer, The Register and Handelsblatt; its page was not retrievable). Der Spiegel, the Süddeutsche Zeitung and the Financial Times, citing unnamed internal sources, report the access was a malicious update to QBase, the ground-control and mission-planning software, planted on the vendor's internal update server; BleepingComputer adds that the unscheduled update raised alarms inside the company and that it is unclear how many customers installed it. The Register, relaying Der Spiegel, says the update reached servers of the German military and other customers but did not directly infect the drones; the company told Reuters the Bundeswehr was the only customer that grounded its systems as a precaution, and the drones are flying again. The Generalstaatsanwaltschaft Bamberg (Zentralstelle Cybercrime) and the Bavarian LKA investigate against persons unknown, and the Verfassungsschutz, the military counterintelligence MAD and the BSI are reported to be involved. No actor is named: Quantum says it was targeted because of its Ukraine support (its own assessment) and Handelsblatt notes nobody has publicly said whether Russia or a Russian group is responsible. Unreported: how the update server was reached, the payload and function of the update, and how many installations received it. Assessment (this agent): a software-supply-chain compromise of a defence supplier's update channel, relevant to any armed-forces or civil-protection body that runs supplier ground-station software on networks with other systems.
