    summary: |
      Mittwald, a hosting provider in Espelkamp (North Rhine-Westphalia), says it noticed foreign access on 2026-11-04 that came in through its own MCP (Model Context Protocol) server, took that server offline, and on 5 November temporarily restricted its customer portal, SSH connections, extensions and ordering system; heise and Born report the restrictions were lifted step by step until 7 November. On 2026-11-12 the company reported that the attackers had resumed, had exploited a security vulnerability to compromise its corporate website (Mittwald says it took the site offline itself and denies an informant's claim to heise that it was defaced), and that as a precaution it switched off the customer centre, the mStudio portal and all SSH connections; it says the attackers are professional and use automated AI systems, which is the company's claim with no evidence shown, that it found no access to internal systems and that customer-hosted websites and mailboxes stayed reachable. On 2026-11-13 it restored mStudio, SSH, the customer centre and the website, added a CAPTCHA and e-mail two-factor step to the portal login, states there is no foreign access any more and promises a post-mortem. No source names the vulnerability, the MCP server product, or an actor, and heise adds that Mittwald had also shut down all customer projects as a precaution during the PHP2Shell wave.
