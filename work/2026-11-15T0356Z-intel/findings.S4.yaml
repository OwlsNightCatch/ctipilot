      - { url: "https://www.beobachter.ch/burger-verwaltung/datenschutz-sensible-notrufdaten-im-netz", publisher: "Beobachter (2018 background)", date: "2018-08-28", role: "background" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html) -> primary: Der Spiegel, URL https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b (S+ teaser) -> WebSearch (\"Sachsen Pager Notrufmeldungen Datenleck POCSAG Rettungsdienst Feuerwehr Innenministerium LKA\") -> Freie Presse; Swiss background from WebSearch (\"Sachsen Notruf Pager Daten abgegriffen ...\") -> Beobachter, fetched with WebFetch"
    summary: |
      Der Spiegel reported on 2026-11-11 that unauthorised people could for years read radio messages sent to the pagers of Saxon fire brigades, ambulance services and civil-protection units, and that the messages contained diagnoses, names and addresses of patients. heise (2026-11-12), drawing on Spiegel and an informant, reports that hundreds of messages a day are republished in a social network, mainly for the Leipzig area and the districts of Zwickau, Vogtland and Erzgebirge; that the pagers use the POCSAG protocol, which has no encryption of its own, that the Saxon networks use the 1990 IDEA cipher, considered obsolete because of its 64-bit block size, and that according to the informant the keys are available in online forums; and that the informant told the Saxon interior ministry and the LKA at the end of October without a reply. The LKA's cybercrime contact point told heise it learned of the incident on 31 October and opened an investigation, giving no figures. Freie Presse (2026-11-13) adds accident, heart-attack and apparent suicide-announcement alerts with addresses. One rescue association, the Rettungszweckverband Südwestsachsen, now sends alerts without patient names and house numbers (heise). The cipher, key and mirroring claims come from an informant relayed by Spiegel and heise; the LKA confirmed only the report and the investigation. Swiss background, not an incident: Beobachter reported on 2018-08-28 that ambulance and fire services across Switzerland communicated by unencrypted pager, that a public website listed live alerts from several Swiss regions, and that Schutz & Rettung Zürich expected end-to-end encryption to the pager in 2019; whether Swiss alerting has changed since is not established by any source read here.
    region_nexus: "Germany (Saxony); Swiss emergency-services lens through the 2018 Swiss precedent, no Swiss exposure reported in 2026"
    primary_sector_nexus: "direct lens: emergency services (fire and rescue, EMS, civil protection)"
    sector: "emergency-services"
    cves: []
    techniques: [T1040]
    affected_products: ["POCSAG paging networks (IDEA-encrypted per informant)"]
    entity_keys: []
    new_entities:
      - { key: "incident:saxony-emergency-pager-alert-exposure-2026-11", type: incident, name: "Saxony emergency pager alert exposure (November 2026)", aliases: ["Pager-Panne Sachsen"], summary: "Reported 2026-11-11 by Der Spiegel: outsiders could for years read POCSAG pager alerts of Saxon fire brigades, ambulance services and civil protection, including patient names, addresses and diagnoses, and the alerts were republished in a social network; the Saxon LKA investigates (Der Spiegel, 2026-11-11; heise, 2026-11-12)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    recency_note: "Der Spiegel 2026-11-11, heise 2026-11-12, Freie Presse 2026-11-13 are 1 to 3 days before the 28 h window; the story is absent from prior_coverage.json."
    borderline: true
    borderline_reason: "freshest source ~1.5 days outside window_hours; no Swiss exposure reported in 2026; kept because emergency services are a named constituency, the exposure class (patient data on weakly protected alerting channels) is transferable and unchecked, and the registry already tracks the sibling NHSBT pager case (incident:nhs-blood-transplant-pager-breach-2026-08)"
    evidence:
      - { quote: "In Sachsen allerdings sind offenbar seit Jahren genau solche vertraulichen Notrufdaten abgefangen und ins Netz gestellt worden.", attribution: "heise online", source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html" }
      - { quote: "In den sächsischen Netzen kommt laut Spiegel das Verfahren IDEA von 1990 zum Einsatz, das wegen seiner geringen Blockgröße von 64 Bit als veraltet gilt.", attribution: "heise online", source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html" }
      - { quote: "Die nötigen Schlüssel sind dem Informanten zufolge in Onlineforen erhältlich.", attribution: "heise online", source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html" }
      - { quote: "Unbefugte konnten offenbar jahrelang Funkmeldungen sächsischer Rettungsdienste und Feuerwehren mitlesen.", attribution: "DER SPIEGEL (paywalled; teaser read)", source_url: "https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b" }
      - { quote: "Allerdings: Sanität und Feuerwehr kommunizieren in der ganzen Schweiz unverschlüsselt über ihre Pager.", attribution: "Beobachter (2018 background)", source_url: "https://www.beobachter.ch/burger-verwaltung/datenschutz-sensible-notrufdaten-im-netz" }
    extended_notes: |
      Exposure line the sources support: any alerting channel that carries free-text patient or caller data over paging (POCSAG has no native encryption; encryption must be added and the cipher and key handling matter). The check is whether alert text contains names, addresses or diagnoses, whether encryption runs to the receiver or only between transmitter and mast, and which cipher and key lifecycle is used. The only mitigation named for 2026 is payload minimisation (no patient names or house numbers, Rettungszweckverband Südwestsachsen). Passive radio interception leaves no victim-side telemetry; the NHSBT entry notes the same property for pager broadcasts. ATT&CK mapping follows the NHSBT precedent (T1040 as the nearest analogue).
