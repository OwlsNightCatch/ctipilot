        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/08/04/cisa-adds-three-known-exploited-vulnerabilities-catalog"
      - quote: "An error in the fix for CVE-2026-29146 allowed the EncryptInterceptor to be bypassed."
        attribution: "Apache Software Foundation (Tomcat security team)"
        source_url: "https://tomcat.apache.org/security-11.html"
      - quote: "Messages that have not been properly decrypted can still be accepted and passed through the system."
        attribution: "Field Effect"
        source_url: "https://fieldeffect.com/blog/public-exploit-code-apache-tomcat-flaw"
    extended_notes: |
      Defender vantage: this is the third pattern in a fortnight where a fix itself created the
      exposure (CVE-2026-18577 was an incomplete patch for CVE-2026-18556; CVE-2025-68686 bypassed
      the FortiOS symlink fix). Here the regression is a fail-open: the security control (encrypted
      cluster transport) stopped rejecting what it could not verify. Asset teams should note that
      Tomcat is very often embedded — the exposure is not limited to org-managed Tomcat installs but
      extends to appliances and COTS products that ship a Tomcat runtime with clustering enabled.
      Apache's own page dates the fix to 2026-04-04 with public disclosure 2026-04-09; the
      lists.apache.org announcement thread linked from EUVD (https://lists.apache.org/thread/9510k5p5zdvt9pkkgtyp85mvwxo2qrly)
      renders as a JS shell and was not readable this run.

  - title: "CVE-2026-18574 — Check Point Security Management: unauthenticated management-authentication bypass to arbitrary command execution, no fix for EoS versions"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0965/", publisher: "CERT-FR / ANSSI", date: "2026-08-04", role: "primary" }
      - { url: "https://support.checkpoint.com/results/sk/sk185222", publisher: "Check Point Software Technologies", date: "2026-08-03", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2628", publisher: "BSI CERT-Bund", date: "2026-08-04", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr, bridge `cert-fr avis-recent 15` → CERTFR-2026-AVI-0965 (04 août 2026), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0965/ → primary (vendor): Check Point sk185222, URL https://support.checkpoint.com/results/sk/sk185222 (SPA; full body recovered from the Next.js data route https://support.checkpoint.com/_next/data/qfIT1FE0sMobyOnl2MXEb/results/sk/sk185222.json) → corroboration: bsi-de, `bsi-rss` → WID-SEC-2026-2628, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2628 (body via `bsi-csaf WID-SEC-2026-2628`)"
    summary: |
      Check Point disclosed CVE-2026-18574 in sk185222 (created 2026-08-01, last modified 2026-08-03,
      severity High); CERT-FR issued CERTFR-2026-AVI-0965 and BSI issued WID-SEC-2026-2628 on
      2026-08-04. Check Point's own wording: "An unauthenticated attacker may be able to bypass
      Management authentication and execute arbitrary commands on the Security Management Server.
      Successful exploitation could result in full compromise of the Security Management system."
      BSI frames the same flaw as a remote, anonymous attacker bypassing security controls and
      executing arbitrary code.
      Affected products are the Security Management Server and the Multi-Domain Security Management
      Server (MDS) — the central policy authority for an estate of Check Point gateways, holding
      policy, object database, administrator accounts and SIC trust material. Affected versions:
      R81.20, R82, R82.10, plus R80, R80.10, R80.20, R80.30, R80.40, R81 and R81.10, all of which
      Check Point marks End of Support. Fixes exist only for the supported trains: Jumbo Hotfix
      Accumulator R81.20 from Take 161, R82 from Take 122, R82.10 from Take 40. There is no fix for
      the EoS versions — for those estates the only answer is upgrade or network containment.
      Smart-1 Cloud customers are stated to be already protected.
      Exploitation prerequisite is network reachability of the management server: Check Point notes
      "Environments that do not restrict Trusted Clients (GUI clients) or that expose Management
      services to untrusted networks may have increased exposure." Check Point states the issue was
      found internally and that it has "no indication of active exploits" — take that as the vendor's
      claim as of 2026-08-03, not as a guarantee, given that CVE-2026-16232 (SmartConsole
      authentication bypass) went from disclosure to KEV-confirmed exploitation inside days in July.
      Detection concept: authentication and management-plane logs on the Security Management Server —
      SmartConsole/CPM login events from source addresses outside the Trusted Clients allowlist, and
      administrative API/CLI activity (policy install, object modification, administrator creation)
      that does not correlate with a preceding interactive administrator login, are the observable
      sequence. Because this reaches command execution, host process-creation telemetry on the
      management server showing shells or interpreters spawned by the management daemons (cpm, fwm,
      cpca) is the second anchor. Triage note: legitimate automation (CI-driven policy pushes,
      Ansible/API integrations, Smart-1 management jobs) produces API activity without an interactive
      login too — discriminate on source address against the Trusted Clients definition, the API key
      identity in use, and whether the activity falls in a scheduled window.
      Hardening: apply the Jumbo HFA Takes above; restrict Trusted Clients in SmartConsole under
      Manage & Settings > Permissions & Administrators > Trusted Clients to authorised hosts and
      subnets and never "Any"; restrict management access by firewall policy to trusted administrative
      workstations; confirm implied rules protecting control connections are enabled.
    region_nexus: "global; Check Point management servers are heavily deployed across Swiss and European government, cantonal administration and critical-infrastructure networks"
