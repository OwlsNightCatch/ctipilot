  - title: "CVE-2026-34486 — Apache Tomcat Tribes EncryptInterceptor fail-open crosses into confirmed exploitation (CISA KEV, 2026-08-04)"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/04/cisa-adds-three-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-08-04", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisaid/EUVD-2026-21056", publisher: "ENISA EUVD", date: "2026-08-04", role: "corroborating" }
      - { url: "https://tomcat.apache.org/security-11.html", publisher: "Apache Software Foundation (Tomcat security team)", date: "2026-04-09", role: "corroborating" }
      - { url: "https://fieldeffect.com/blog/public-exploit-code-apache-tomcat-flaw", publisher: "Field Effect", date: "2026-05-28", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, bridge `python3 tools/fetch_source.py cisa-kev` — CVE-2026-34486 newly listed with dateAdded 2026-08-04 → pivot: CISA KEV-addition alert, URL https://www.cisa.gov/news-events/alerts/2026/08/04/cisa-adds-three-known-exploited-vulnerabilities-catalog → pivot: enisa-euvd, `enisa-euvd recent exploited` → EUVD-2026-21056 exploitedSince 2026-08-04, URL https://euvd.enisa.europa.eu/enisaid/EUVD-2026-21056 → primary (vendor): Apache Tomcat security page, URL https://tomcat.apache.org/security-11.html → pivot: WebSearch (\"CVE-2026-34486 Apache Tomcat EncryptInterceptor exploited\") → Field Effect PoC-availability write-up, URL https://fieldeffect.com/blog/public-exploit-code-apache-tomcat-flaw"
    summary: |
      CISA added CVE-2026-34486 to the Known Exploited Vulnerabilities catalog on 2026-08-04 with a
      2026-08-07 remediation due date, and ENISA's EUVD independently flags the record
      exploitedSince 2026-08-04. The flaw is a fail-open regression in Apache Tomcat's Tribes
      clustering stack: the Tomcat security team states "An error in the fix for CVE-2026-29146
      allowed the EncryptInterceptor to be bypassed." The March/April 2026 fix for CVE-2026-29146
      (EncryptInterceptor defaulting to CBC, exploitable as a padding oracle) changed decryption
      error handling so that a message whose decryption fails is no longer discarded — Field Effect
      records that "Messages that have not been properly decrypted can still be accepted and passed
      through the system." Because the Tribes channel deserializes cluster messages, attacker-supplied
      plaintext reaches the Java deserialization routine, and a usable gadget on the classpath turns
      the cluster receiver into unauthenticated remote code execution.
      Preconditions are specific and worth checking before triaging: Tomcat clustering must be
      enabled, the Tribes NioReceiver must be network-reachable (default TCP/4000), and
      EncryptInterceptor must be configured — that is, the very deployments that turned encryption
      ON for session replication are the exposed ones. Affected: Tomcat 9.0.0.M1–9.0.116,
      10.1.0-M1–10.1.53, 11.0.0-M1–11.0.20; fixed in 9.0.117, 10.1.54, 11.0.21 (released 2026-04-04,
      made public 2026-04-09). CVSS 3.1 base 7.5; EUVD records EPSS 42.63. Public PoC code has been
      on GitHub since roughly late May 2026, and CrowdStrike's in-window 2026 Threat Hunting Report
      (covered 2026-08-04) puts 88% of public-PoC exploitation inside 48 hours — this one took
      ~10 weeks, which is what makes the KEV listing the news rather than the CVE.
      No vendor or research lab has published named-cluster telemetry for the exploitation; CISA's
      KEV listing and EUVD's exploited flag are the only exploitation assertions available, and
      EUVD's flag may derive from KEV rather than being independent. Treat "who is exploiting it"
      as unknown.
      Detection concept: Tribes membership and receiver activity is normally a fixed, small mesh of
      known cluster peers — network-flow and firewall telemetry showing TCP/4000 (or the configured
      Receiver port) sessions from any source outside the declared cluster membership list is the
      cleanest signal, since there is no legitimate reason for a non-member to speak Tribes.
      On the host, process-creation events with a Tomcat/Catalina JVM as parent spawning a shell
      (sh, bash, cmd.exe, powershell.exe) are the deserialization-gadget payoff. Application-log
      telemetry: EncryptInterceptor decryption-failure entries in catalina.out that are followed by
      successful message processing rather than a discard are the mechanism itself firing.
      Hardening: patch to 9.0.117 / 10.1.54 / 11.0.21; independently, bind the Tribes Receiver to a
      dedicated management/replication VLAN and firewall TCP/4000 to declared cluster members only —
      the CVE only matters where the receiver is reachable.
    region_nexus: "global; Tomcat is ubiquitous in European public-sector Java estates (e-government portals, Alfresco/Liferay/Confluence-class stacks, vendor appliances embedding Tomcat)"
    primary_sector_nexus: "direct — public-sector web application platforms commonly run clustered Tomcat for session replication"
    sector: "public-sector, finance, healthcare, telco"
    cves: [CVE-2026-34486, CVE-2026-29146]
    techniques: [T1190, T1210]
    affected_products: ["Apache Tomcat"]
