    extended_notes: |
      Context the composer should carry: this is the third distinct authentication-bypass disclosure
      in the Check Point management stack inside roughly two weeks, and the pattern is consistent —
      CVE-2026-16232 (SmartConsole, KEV 2026-07-22, root-caused to a caller-supplied SIC
      distinguished name being trusted), CVE-2026-62144/-62145 (Security Management siblings,
      2026-07-25), now CVE-2026-18574. Prior coverage: 2026-07-23/check-point-smartconsole-auth-bypass-cve-2026-16232,
      2026-07-25/check-point-mgmt-cve-2026-62144-62145-siblings, 2026-07-29/check-point-cve-2026-16232-sic-dn-substitution-root-cause.
      CVE-2026-18574 is a distinct CVE with its own sk and its own Jumbo Takes, so it is a new item,
      not an update — but the composer may reasonably reference the earlier entries.
      The EoS gap is the sharpest operational fact: R80.x/R81/R81.10 estates get no patch at all.
      RECIPE NOTE for sources.json (checkpoint support): support.checkpoint.com/results/sk/<skid>
