      (this run: qfIT1FE0sMobyOnl2MXEb). Cite the human sk URL; read the body from the data route.

  - title: "Traefik 3.7.10 / 3.6.25 / 2.11.54 — three multi-tenancy isolation failures in the Kubernetes providers, including cross-namespace backend hijacking"
    sources:
      - { url: "https://github.com/traefik/traefik/security/advisories/GHSA-fgjj-px3w-67xx", publisher: "Traefik Labs (GitHub Security Advisory)", date: "2026-08-03", role: "primary" }
      - { url: "https://github.com/traefik/traefik/security/advisories/GHSA-62fc-8686-hfmq", publisher: "Traefik Labs (GitHub Security Advisory)", date: "2026-08-03", role: "primary" }
      - { url: "https://github.com/traefik/traefik/security/advisories/GHSA-6765-c87h-8mrf", publisher: "Traefik Labs (GitHub Security Advisory)", date: "2026-08-03", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0964/", publisher: "CERT-FR / ANSSI", date: "2026-08-04", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr, bridge `cert-fr avis-recent 15` → CERTFR-2026-AVI-0964 \"Multiples vulnérabilités dans Traefik\" (04 août 2026), URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0964/ → primaries via the advisory's Documentation section: https://github.com/traefik/traefik/security/advisories/GHSA-fgjj-px3w-67xx , https://github.com/traefik/traefik/security/advisories/GHSA-62fc-8686-hfmq , https://github.com/traefik/traefik/security/advisories/GHSA-6765-c87h-8mrf (all three fetched)"
    summary: |
      Traefik published three security advisories on 2026-08-03, fixed in v3.7.10, v3.6.25 and
      v2.11.54; CERT-FR relayed them as CERTFR-2026-AVI-0964 on 2026-08-04. None carries a CVE id
      yet. All three break tenant isolation in a shared ingress — the exact deployment shape used by
      Swiss and European public-sector shared Kubernetes platforms where several agencies or
      departments run namespaces behind one cluster ingress.
      The most serious (GHSA-fgjj-px3w-67xx, CVSS 4.0 base 7.6 High) is a route identity collision in
      the Kubernetes Gateway API provider. Traefik builds router and service identities by
      hyphen-concatenating route namespace, route name, Gateway identity, entry point and rule index;
      because Kubernetes object names may themselves contain hyphens, that construction is not
      injective. Two HTTPRoute/GRPCRoute/TCPRoute/TLSRoute objects in different namespaces, attached
      to the same shared Gateway with equivalent match rules, can resolve to the same identity, and
      the merge uses maps.Copy without collision detection: "Two distinct Routes attached to the same
      Gateway with equivalent match rules can therefore produce the same identity, and the Route
      loaded later silently overwrites the earlier one." The result is that a tenant who can name
      their own Route objects can silently take over another namespace's traffic — a hijack that is
      invisible to the victim tenant because their own manifests remain unchanged. Affected v3.0.0–
      v3.6.24 and v3.7.0–v3.7.9.
      The second (GHSA-62fc-8686-hfmq, CVSS 4.0 base 4.8 Moderate) is an allowCrossNamespace=false
      bypass in the Kubernetes CRD provider. The guard that rejects cross-namespace @kubernetescrd
      references for middlewares, TLS options and ServersTransport was never applied to TraefikService
      backendRefs in pkg/provider/kubernetes/crd/kubernetes_http.go (nameAndService), so for names
      containing an @ separator only the crossProviderNamespaces allowlist is consulted "and that
      check returns true by default." A namespace-scoped tenant can therefore bind their router to
      another tenant's TraefikService backend. Affected v2 ≤ 2.11.53, v3.0–v3.6 ≤ 3.6.24, v3.7 ≤ 3.7.9.
      The third (GHSA-6765-c87h-8mrf, CVSS 4.0 base 2.1 Low) is a BasicAuth singleflight key
      collision in pkg/middlewares/auth/basic_auth.go: the deduplication key concatenates password
      and stored secret without a delimiter, so an unconfigured username supplied with password
      P||H collides with a legitimate (P, H) pair and inherits its verification result. Where
      headerField is configured, that lets a low-privilege authenticated user present an arbitrary
      identity to the backend. Affected v3.6.11–v3.6.24 and v3.7.0–v3.7.9; the fix prefixes the key
      with the password length.
      Detection concept: the Gateway API and CRD issues manifest in the control plane, not the data
      plane — Kubernetes audit records for HTTPRoute/GRPCRoute/TCPRoute/TLSRoute and TraefikService
      create/update events originating from a tenant service account, correlated against Traefik's
      own configuration-reload logs, are the observable pair. A route whose object name introduces
      an extra hyphen segment, or a router referencing a service with an @kubernetescrd suffix from
      a foreign namespace, is the specific artefact. Data-plane corroboration: a sudden shift in
      backend destination for an established host/path in ingress access logs with no corresponding
      change in the owning namespace's manifests. Triage note: legitimate GitOps controllers
      (Argo CD, Flux) also create and mutate Route objects continuously — discriminate on whether the
      acting identity is the platform's reconciler service account or a tenant's, and on whether the
      resulting router crosses a namespace boundary.
      Hardening: upgrade to 3.7.10 / 3.6.25 / 2.11.54; where a shared Gateway serves multiple tenants,
      enforce naming conventions or admission policy (e.g. Kyverno/Gatekeeper) that forbid tenant
      Route names capable of colliding, and keep providers.kubernetesCRD.allowCrossNamespace at its
      default false while recognising that, pre-patch, that setting did not cover TraefikService
      backendRefs.
    region_nexus: "global; directly relevant to Swiss and European shared public-sector Kubernetes / container platforms operating multi-tenant ingress"
    primary_sector_nexus: "direct — multi-tenant government container platforms"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1557, T1078, T1548]
    affected_products: ["Traefik Proxy"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Two distinct Routes attached to the same Gateway with equivalent match rules can therefore produce the same identity, and the Route loaded later silently overwrites the earlier one"
        attribution: "Traefik Labs (GHSA-fgjj-px3w-67xx)"
        source_url: "https://github.com/traefik/traefik/security/advisories/GHSA-fgjj-px3w-67xx"
      - quote: "In a shared Gateway deployment, a Route author can hijack requests belonging to another namespace when the object names admit a collision."
        attribution: "Traefik Labs (GHSA-fgjj-px3w-67xx)"
        source_url: "https://github.com/traefik/traefik/security/advisories/GHSA-fgjj-px3w-67xx"
      - quote: "For names that contain an `@` separator (that is, `@kubernetescrd` cross-namespace references) it applies only the `crossProviderNamespaces` allowlist check, and that check returns `true` by default."
        attribution: "Traefik Labs (GHSA-62fc-8686-hfmq)"
        source_url: "https://github.com/traefik/traefik/security/advisories/GHSA-62fc-8686-hfmq"
    extended_notes: |
      Thematic link the composer may want: all three are the same class the 2026-08-02 weekly
      already named — code accepting an attacker-influenceable value as proof of identity. Here the
      "identity" is a concatenated string key rather than a credential, and the failure is a
      collision rather than a forgery, but the defensive lesson is identical: delimiter-free
      concatenation is not an identity function. No CVE ids assigned at time of writing; track the
      GHSA ids.
    borderline: false

  - title: "CVE-2026-9198 — the second Langflow pre-auth RCE path (auto_login → validate/code) added to CISA KEV"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/04/cisa-adds-three-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-08-04", role: "primary" }
      - { url: "https://www.ibm.com/support/pages/node/7278927", publisher: "IBM PSIRT", date: "2026-07-02", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, bridge `cisa-kev` — CVE-2026-9198 dateAdded 2026-08-04 → pivot: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/08/04/cisa-adds-three-known-exploited-vulnerabilities-catalog → pivot: enisa-euvd `recent exploited` → EUVD-2026-45236 exploitedSince 2026-08-04, references IBM bulletin → primary (vendor): IBM security bulletin, URL https://www.ibm.com/support/pages/node/7278927"
    summary: |
      CISA added CVE-2026-9198 (IBM Langflow, code injection) to the KEV catalog on 2026-08-04 with a
      2026-08-07 due date; EUVD marks EUVD-2026-45236 exploitedSince the same day. This is a
      *different* Langflow RCE path from the ones already covered: where CVE-2026-0770 abused
      exec_globals and CVE-2026-14499 needed 1.10.2, CVE-2026-9198 chains /api/v1/auto_login — which
      mints a SUPERUSER token to any unauthenticated network caller — with /api/v1/validate/code,
      which executes submitted Python during function definition via decorators, default arguments
      and annotations. IBM's bulletin (2026-07-02, CVSS 3.1 base 9.8,
      AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) states the chain yields full RCE on default deployments and
      that remediation is Langflow OSS 1.10.1; note the pipeline's own 2026-07-26 correction that
      1.10.2 is the true endpoint for the sibling CVE-2026-14499, so 1.10.2 remains the version to
      target. Affected: Langflow OSS 1.0.0 through 1.10.0.
      Operationally this closes the loop on a surface a Swiss/EU SOC should already have inventoried:
      Langflow instances are AI-workflow builders that teams stand up on internal or cloud VMs, often
      internet-exposed by accident, and the auto_login default means there is no credential to brute
      force. Detection concept: web/application access logs for unauthenticated POSTs to
      /api/v1/auto_login immediately followed by /api/v1/validate/code from the same source is the
      full chain in two log lines; on the host, process-creation telemetry showing a python/uvicorn
      Langflow parent spawning a shell is the payoff. Hardening: upgrade to 1.10.2, and where the
      deployment cannot be patched immediately, block /api/v1/auto_login and /api/v1/validate/code at
      the reverse proxy and remove any internet exposure.
    region_nexus: "global; exposure is wherever teams have stood up Langflow for AI workflow prototyping"
    primary_sector_nexus: "indirect — affects public-sector and research organisations experimenting with LLM orchestration"
