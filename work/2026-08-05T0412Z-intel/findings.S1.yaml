  - title: "NCSC-CH advises on actively exploited Microsoft Power Pages / Dataverse anonymous-access misconfiguration"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12823", publisher: "NCSC Switzerland / GovCERT.ch (Cyber Security Hub)", date: "2026-08-04", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge `ncsc-csh recent 12` → post id 12823, TLP:CLEAR, created 2026-08-04T08:32:49Z, URL https://security-hub.ncsc.admin.ch/#/posts/12823 → the post's own primary reference is https://venarix.com/blog/exfilsquad-targets-misconfigured-microsoft-power-pages-portals (not re-fetched this run; already the basis of prior coverage)"
    summary: |
      Switzerland's NCSC published a TLP:CLEAR advisory on 2026-08-04 stating that a Microsoft
      Power Pages misconfiguration is being actively exploited to exfiltrate sensitive data from
      Dataverse. NCSC-CH's own wording: portals are vulnerable when the "Anonymous Users" web role is
      granted excessive read permissions on Dataverse tables, making the data publicly readable by
      unauthenticated users; it records the current exploitation status as "Actively Exploited" and
      names Microsoft Power Pages and Microsoft Power Apps Portals as affected. Recommended actions
      are to disable anonymous access, review table permissions, disable unnecessary Web API and
      OData feeds, and validate endpoint restrictions from an unauthenticated browser session.
      The underlying campaign (ExfilSquad against misconfigured Power Pages portals, incl. the UK
      PNLD/DfE disclosures) is already covered; the in-window delta is that the Swiss home authority
      has now issued its own advisory, which converts this from foreign-incident reporting into a
      standing configuration-review obligation for Swiss cantonal and federal Power Pages estates.
      Detection concept as the advisory frames it is verification rather than alerting: enumerate
      public-facing Power Pages sites, then request their Web API / OData endpoints from an
      unauthenticated session and compare the returned table set against what the portal is supposed
      to expose.
    region_nexus: "Switzerland — home-authority advisory; applies to any Swiss public-sector Power Pages / Power Apps Portals deployment"
    primary_sector_nexus: "direct — Swiss cantonal and federal e-government portals are a common Power Pages use case"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1530]
    affected_products: ["Microsoft Power Pages", "Microsoft Power Apps Portals"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: update-of:2026-08-04/pnld-confirms-breach-exfilsquad-power-pages-dataverse-path
    evidence:
      - quote: "Unauthenticated attackers can access and exfiltrate sensitive personal, financial, and organizational data from public-facing portals via exposed Dataverse tables."
        attribution: "NCSC Switzerland / GovCERT.ch"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12823"
      - quote: "Current exploitation status: Actively Exploited"
        attribution: "NCSC Switzerland / GovCERT.ch"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12823"
    borderline: true
    borderline_reason: "the campaign itself is covered twice already (2026-07-31, 2026-08-04); the delta is the Swiss home authority formally advising its constituency — high home-region value but S2 may surface the same item"

