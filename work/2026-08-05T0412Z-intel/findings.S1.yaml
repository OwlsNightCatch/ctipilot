      (the 1.10.1-is-not-the-endpoint correction), and 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev.
      The delta is narrow but real: a distinct CVE for a distinct endpoint chain now carries a
      confirmed-exploitation label, which changes the patch argument from "one known-exploited path"
      to "the whole pre-auth surface of this product is being worked".

  - title: "ICSMA-26-216-01 — Thermo Fisher Applied Biosystems genetic analyzers: DNA result files can be edited without integrity checking"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-medical-advisories/icsma-26-216-01", publisher: "CISA", date: "2026-08-04", role: "primary" }
    discovery_trace: "first seen at: cisa-advisories, bridge `cisa feed https://www.cisa.gov/cybersecurity-advisories/all.xml` → newest item ICSMA-26-216-01 (day-of-year 216 = 2026-08-04) → primary: CISA ICS medical advisory, URL https://www.cisa.gov/news-events/ics-medical-advisories/icsma-26-216-01 (fetched via `cisa page`)"
    summary: |
      CISA published ICSMA-26-216-01 on 2026-08-04 covering CVE-2026-17583 in Thermo Fisher Applied
      Biosystems genetic analyzers. The finding is a missing integrity check (CWE-353): the .fsa and
      .hid instrument output files can be edited after the fact, so an attacker with access to the
      data-collection workstation or its file store can alter DNA data and produce inaccurate test
      results. CVSS 3.1 base 8.4 (AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), CVSS 4.0 base 8.2 — local
      attack vector, no privileges and no user interaction required once the attacker is on the box.
      Affected: Applied Biosystems 3500/3500xL Data Collection Software <=4.0.2, 3730/3730xL <=5.0.2,
      SeqStudio Genetic Analyzer <=1.2.5, SeqStudio Flex <=1.2.0, GeneMapper ID-X <=v1.7.3,
      3130 Series <=4.1, ABI PRISM 3100/3100-Avant <=2.0, ABI PRISM 310 <=3.1. CISA lists no vendor
      patch in the advisory body; its recommendations are network-exposure minimisation and defence in
      depth. Reported by Nathaniel Adams, Laura Gaydosh-Combs and Kevin Dyer.
      Why a Swiss/European public-sector SOC should care despite the local attack vector: these are
      the capillary-electrophoresis platforms used by forensic-science institutes (police and
      judicial forensics) and by clinical and public-health genomics labs. This is an
      evidence-integrity problem, not a confidentiality one — the impact is a falsified forensic or
      clinical result, which is a legal and public-trust exposure rather than a data-breach exposure.
      Detection concept: file-integrity monitoring on the .fsa/.hid output directories, and
      file-modification audit events (write/rename on result files after the run that produced them
      completed) are the direct signal; correlate with interactive logon and removable-media events on
      the data-collection workstation. Hardening: isolate analyser workstations on a dedicated lab
      VLAN with no internet path, restrict interactive logon to named lab operators, and — the real
      control here — hold result files in an append-only or cryptographically signed archive so that
      post-hoc edits are detectable rather than relying on the instrument software.
    region_nexus: "global (CISA advisory, deployment worldwide); Swiss and European forensic-science institutes and clinical genomics labs run these platforms"
    primary_sector_nexus: "indirect — public-sector forensic/judicial laboratories and public-health genomics sit inside the constituency"
    sector: "healthcare, public-sector"
