        attribution: "VBS"
        source_url: "https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21"
      - quote: "Am 9. und 10. Oktober 2025 wurde bei der RUAG LLC, einer Tochtergesellschaft der RUAG MRO Holding AG, ein Ransomware-Angriff der Hackergruppe AKIRA festgestellt."
        attribution: "VBS"
        source_url: "https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21"
      - quote: "Nach Einschätzung des VBS wurden politische und reputationsbezogene Auswirkungen sowie weitere übergeordnete Interessen nicht ausreichend berücksichtigt."
        attribution: "VBS"
        source_url: "https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21"
      - quote: "Das VBS und der Bund halten unverändert an ihrer Empfehlung fest, im Falle von Cyber-Angriffen kein Lösegeld zu bezahlen."
        attribution: "VBS"
        source_url: "https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21"
      - quote: "Eine genaue Summe nannte er nicht. Sie sei aber 'gering' gewesen."
        attribution: "SRF"
        source_url: "https://www.srf.ch/news/schweiz/nach-cyberangriff-loesegeldzahlung-der-ruag-an-hackergruppe-war-gesetzeskonform"
    extended_notes: |
      Why this matters beyond RUAG, for a Swiss/European public-sector and CI readership:

      1. It establishes, in writing and from the owner department itself, that a Swiss federally-owned company
         paying a ransomware crew is a corporate-governance decision, not a matter requiring the Confederation's
         prior consent — while the Confederation's standing recommendation not to pay is reaffirmed in the same
         document. Anyone drafting or reviewing a ransom-decision playbook for a state-owned entity, a cantonal
         utility or a CI operator now has a concrete precedent for how that tension is resolved in practice.
      2. The named failure mode is subsidiary escalation. The incident happened at a US subsidiary; the weaknesses
         RUAG MRO itself identified are escalation processes at subsidiaries, IT governance that did not properly
         involve the group IT lead, crisis-communication processes, and minimum IT security requirements at group
         level. That is the transferable lesson: group-level incident governance that stops at the parent's own
         perimeter, and minimum security baselines that are not enforced down into subsidiaries, is where this went
         wrong — not the encryption event.
      3. The owner-notification duty is the second named failure: the Federal Council's strategic objectives require
         the owner to be informed before public communication, and this sequencing was not honoured. For a federal SOC
         this is a reminder that notification obligations in an incident are ordered, not merely present.

      Kind guidance for the composer: this reads most naturally as `policy` (an ownership/oversight finding with
      standing consequences) rather than `incident` — the underlying October-2025 incident is context, and the news
      is the department's finding. If composed as `incident`, the two techniques mapped here (T1486 ransomware
      encryption, T1657 financial theft / extortion) are what the sources support; neither source describes the
      intrusion vector, dwell time or tooling, so nothing further should be mapped.

  - title: "Liechtenstein VwbP breach update — forensics identify a potential entry point, confirm the register was hit in isolation, and pin down exactly which identity fields were taken"
    sources:
      - { url: "https://www.presseportal.ch/de/pm/100000148/100941523", publisher: "Regierung des Fürstentums Liechtenstein", date: "2026-08-04", role: "primary" }
      - { url: "https://landesspiegel.li/2026/08/cyberangriff-auf-stiftungsregister-regierung-identifiziert-moegliches-einfallstor/", publisher: "Landesspiegel (Liechtenstein)", date: "2026-08-04", role: "corroborating" }
    discovery_trace: >-
      first seen at: WebSearch ("Liechtenstein Regierung Medienkonferenz 4. August 2026 VwbP Cyberangriff
      Erkenntnisse") → primary: Government of Liechtenstein media release of 2026-08-04 14:16,
      URL https://www.presseportal.ch/de/pm/100000148/100941523 (fetched raw via tools/fetch_source.py url) →
      corroboration: Landesspiegel,
      URL https://landesspiegel.li/2026/08/cyberangriff-auf-stiftungsregister-regierung-identifiziert-moegliches-einfallstor/
    summary: |
      At a media conference on 2026-08-04 the Government of Liechtenstein published the first substantive forensic
      update on the breach of the Verzeichnis wirtschaftlich berechtigter Personen (VwbP), the national
      beneficial-ownership register, and it closes the biggest gap in the prior reporting: "Ein erster Hinweis auf ein
      mögliches Einfallstor des Angriffs wurde identifiziert" — a first indication of a possible entry point has been
      identified, with detailed evaluation still running. The government characterises the event as "ein gezielter
      Angriff auf hohem technischem Niveau auf eine hochkomplexe Sicherheitsstruktur" (a targeted attack at a high
      technical level against a highly complex security structure) and states that preliminary results show the VwbP
      was attacked in a targeted and isolated fashion: no unlawful access attempts were registered against the
      Landesverwaltung's servers or its other systems, even though further systems holding sensitive data were still
      pulled off the network as a precaution and put through comprehensive security checks. The second material
      addition is the exact shape of the stolen dataset, which changes how the downstream social-engineering risk
      should be modelled: the register holds the name of the Rechtsträger plus surname, first name, date of birth,
      nationality and country of residence of the beneficial owners; "Eine Adresse oder Telefonnummer wird nicht
      erfasst", and no financial data — turnover, assets, dividends — is recorded, so no conclusions about assets or
      finances can be drawn from the taken data. Because the register holds no contact details, individual GDPR
      notification cannot be executed directly: the Amt für Justiz will notify the Rechtsträger, who will in turn
      notify their beneficial owners, and a public information desk opened on 2026-08-04 at 16:00. The Amt für Justiz
      filed a criminal complaint against persons unknown over the weekend; law-enforcement authorities have opened an
      investigation and are evaluating digital traces in cooperation with European authorities. Head of Government
      Brigitte Haas frames the target explicitly as an EU compliance instrument: the VwbP exists to implement the 5th
      EU Anti-Money-Laundering Directive, and "Der Angriff auf uns ist auch ein Angriff auf internationale
      Compliance-Standards."
    region_nexus: "liechtenstein / DACH — a national register built to implement the 5th EU AMLD; the administered structures and their fiduciaries are largely Swiss and European"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance"
    cves: []
    techniques: [T1213]
    affected_products: []
    entity_keys: ["incident:liechtenstein-vwbp-register-breach-2026-07"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach"
    evidence:
      - quote: "Ein erster Hinweis auf ein mögliches Einfallstor des Angriffs wurde identifiziert."
        attribution: "Regierung des Fürstentums Liechtenstein"
        source_url: "https://www.presseportal.ch/de/pm/100000148/100941523"
      - quote: "Es war ein gezielter Angriff auf hohem technischem Niveau auf eine hochkomplexe Sicherheitsstruktur."
        attribution: "Regierung des Fürstentums Liechtenstein"
        source_url: "https://www.presseportal.ch/de/pm/100000148/100941523"
      - quote: "Weder zu den Servern der Landesverwaltung noch zu weiteren Systemen der Landesverwaltung wurden gemäss aktuellem Kenntnisstand widerrechtliche Zugriffsversuche registriert."
        attribution: "Regierung des Fürstentums Liechtenstein"
        source_url: "https://www.presseportal.ch/de/pm/100000148/100941523"
      - quote: "Im Verzeichnis sind Name des Rechtsträgers sowie Name, Vorname, Geburtsdatum, Staatsangehörigkeit und Wohnsitzstaat der wirtschaftlich berechtigten Personen aufgeführt. Eine Adresse oder Telefonnummer wird nicht erfasst."
        attribution: "Regierung des Fürstentums Liechtenstein"
        source_url: "https://www.presseportal.ch/de/pm/100000148/100941523"
      - quote: "Banksysteme, Kundengelder, Vermögenswerte, Transaktionsdaten oder Bankkundendaten sind nicht betroffen."
        attribution: "Landesspiegel"
        source_url: "https://landesspiegel.li/2026/08/cyberangriff-auf-stiftungsregister-regierung-identifiziert-moegliches-einfallstor/"
    extended_notes: |
      DELTA vs the existing entry `2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach`, which
      explicitly recorded "No initial-access vector has been disclosed":
      1. A potential entry point HAS now been identified (not yet characterised publicly).
      2. The isolation claim is now stated positively — no unlawful access attempts registered against the
         Landesverwaltung's servers or other systems, which is stronger than the earlier "no further attacks could be
         established".
      3. The exact field list is now public, and it REFINES the prior entry's pretexting assessment rather than
         repeating it. The prior entry warned of pretexted contact citing verifiable register facts; the government
         now confirms the register holds no addresses, phone numbers or e-mail addresses and no financial data. The
         practical consequence: the attacker gets an identity-verification kit (legal-entity name + full name + date
         of birth + nationality + country of residence) but not a contact list. That profile fits KYC/identity
         impersonation and account-recovery abuse against fiduciaries, banks and trustees far better than it fits
         direct mass phishing of the beneficial owners themselves, because the attacker must first source contact
         details elsewhere.
      4. The notification mechanics are themselves a defensive signal worth publishing: because the register holds no
         contact data, notification is being routed Amt für Justiz → Rechtsträger → beneficial owner. That two-hop
         chain is exactly the pattern a social engineer can imitate, and it lands in the inboxes of Swiss and
         European trustees and advisers over the coming days. Fiduciary and banking constituents should expect
         genuine breach notifications and forged ones to arrive in the same window.
      5. Criminal complaint filed against persons unknown; digital traces being pursued with European authorities.

      Landesspiegel additionally reports that the government referenced comparable incidents in Luxembourg and France;
      that comparison is the outlet's rendering of the media conference and is NOT in the government's written
      release, so it should be attributed to Landesspiegel or dropped rather than stated as fact.

  - title: "CVE-2026-18574 — a fourth authentication bypass in the Check Point management plane: unauthenticated command execution on Security Management and Multi-Domain Management servers"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2628", publisher: "BSI CERT-Bund (WID-SEC-2026-2628)", date: "2026-08-03", role: "primary" }
