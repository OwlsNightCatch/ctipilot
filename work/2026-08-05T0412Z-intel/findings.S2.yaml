  - title: "Compass Security ships Pipeleek v1 and documents a live Renovate autodiscovery misconfiguration that turns a dependency bot into a lateral-movement path across a self-hosted GitLab"
    sources:
      - { url: "https://blog.compass-security.com/2026/08/pipeleek-v1-release/", publisher: "Compass Security (Switzerland)", date: "2026-08-04", role: "primary" }
    discovery_trace: >-
      first seen at: compass-security feed (source id compass-security), URL
      https://blog.compass-security.com/feed/ (fetched via tools/fetch_source.py feed) → primary: the release post,
      URL https://blog.compass-security.com/2026/08/pipeleek-v1-release/
    summary: |
      The Swiss lab Compass Security released v1 of Pipeleek, a CI/CD secrets scanner that now covers GitLab, GitHub,
      Bitbucket, Azure DevOps, Gitea, CircleCI and Jenkins, hunting credentials left in pipeline logs and build
      artifacts (T1552.001) — "Pipeleek covers leaked credentials in pipeline logs and artifacts". The defensively
      interesting part of the release is not the scanner but the attack path it now automates and documents:
      misconfigured Renovate dependency-bot autodiscovery. Where a self-hosted Renovate instance runs with
      autodiscovery enabled, "the bot finds all repositories it has access to" — including a repository an attacker
      controls — and the post shows that this can be turned into branch-protection bypass and lateral movement across
      the GitLab instance, using a real-world example from the Tor Project's GitLab. The release also adds GitLab
      CI/CD variable and secure-file harvesting, runner-exploitation automation, and a deliberately vulnerable GitLab
      Attack Lab for exercising the chain. For European public-sector and research estates — which lean heavily on
      self-hosted GitLab with automated dependency updating — the actionable question this raises is narrow and
      checkable: does your Renovate bot run with autodiscovery on, and what is the full set of projects its token can
      reach? The lab's own framing is the summary: "One leaked pipeline secret can snowball into broader GitLab
      compromise."
    region_nexus: "switzerland (Swiss research lab); applies to any self-hosted GitLab estate, heavily represented in European public-sector and research"
    primary_sector_nexus: "indirect"
    sector: "public-sector, education"
    cves: []
    techniques: [T1552.001, T1195.001, T1213.003]
    affected_products: ["GitLab", "Renovate"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: >-
      A tool release rather than a threat report, and single-sourced. Returned because the Renovate autodiscovery
      misconfiguration it documents is a real, checkable exposure class in self-hosted GitLab estates (with a named
      real-world example) and the source is a home-region primary research lab. Drop if the run needs the space.
    evidence:
      - quote: "Pipeleek covers leaked credentials in pipeline logs and artifacts."
        attribution: "Compass Security"
        source_url: "https://blog.compass-security.com/2026/08/pipeleek-v1-release/"
      - quote: "The bot finds all repositories it has access to"
        attribution: "Compass Security"
        source_url: "https://blog.compass-security.com/2026/08/pipeleek-v1-release/"
      - quote: "One leaked pipeline secret can snowball into broader GitLab compromise."
        attribution: "Compass Security"
        source_url: "https://blog.compass-security.com/2026/08/pipeleek-v1-release/"
    extended_notes: |
      No IOCs and no rule code in the source, so nothing of that kind to carry. Hardening levers the post's mechanism
      implies directly: scope the Renovate bot token to an explicit project allowlist rather than instance-wide
      autodiscovery; treat the bot identity as a privileged service account subject to the same branch-protection
      rules as humans; mask/rotate CI variables and secure files reachable by that token. Detection concept: CI audit
      logs showing the dependency bot enumerating or acting on projects outside its intended scope, and
      merge/branch-protection bypass events attributed to the bot identity.

      Composer note: this is arguably S3 (research) rather than S2 (home region / sector); it reached S2 because
      compass-security sits in the S2 slice as a Swiss primary. Coordinate with S3 before composing.

