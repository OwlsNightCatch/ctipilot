    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Im Rahmen der Analyse des Vorfalls wurde festgestellt, dass rund 200 Konten kompromittiert wurden."
        attribution: "Der Bundesrat / BIT"
        source_url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL"
      - quote: "Der Cyberangriff wurde durch bisher unbekannte Akteure ausgeführt, welche mutmasslich durch die Ausnutzung dieser Schwachstellen in der SharePoint-Software ermöglicht wurde."
        attribution: "Der Bundesrat / BIT"
        source_url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL"
      - quote: "Am Dienstag, 28. Juli, haben Sicherheitsspezialistinnen und -spezialisten Auffälligkeiten auf den SharePoint-Servern des BIT bemerkt."
        attribution: "Der Bundesrat / BIT"
        source_url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL"
      - quote: "attackers exploiting the flaws were extracting machine keys from Microsoft's Internet Information Services (IIS)"
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities"
      - quote: "post-exploitation activities, such as stealing Internet Information Services (IIS) machine keys and performing deserialization techniques, to gain persistence and deploy malware"
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
    extended_notes: |
      DEDUP NOTE — deliberately no `cves`. Prior coverage already carries the vulnerability side:
      `2026-07-22/cve-2026-50522-sharepoint-machine-key-theft-exploited` (CVE-2026-50522, machine-key theft for
      forged authentication). This item is the INCIDENT, not the CVE. No cited source names a specific CVE for the
      BIT intrusion — admin.ch says only "Mitte Juli hat Microsoft mehrere Schwachstellen in SharePoint bekannt
      gegeben" and The Record says "critical SharePoint vulnerabilities released in July's Patch Tuesday". Listing a
      CVE here would (a) over-claim beyond the sources and (b) trip the CVE-level duplicate FAIL. For context only,
      the CISA alert names the actively exploited July SharePoint set as CVE-2026-32201, CVE-2026-45659,
      CVE-2026-56164, CVE-2026-58644 and CVE-2026-50522, all against on-prem SharePoint Subscription Edition / 2019 /
      2016, plus CVE-2026-55040 as disclosed-but-not-known-exploited.

      TECHNIQUE PROVENANCE — T1190 and T1078 are what BIT's own statement supports (presumed exploitation of the
      SharePoint flaws; compromise of ~200 user and technical account credentials). T1552.004 and T1606 are the
      campaign-level post-exploitation chain stated by The Record and CISA for this exploitation wave, not
      independently confirmed for BIT; the composer should attribute them to those sources rather than to BIT.

      DETECTION / HUNT CONCEPTS (behavioural, from the mechanism the cited sources describe, no IOCs):
      - Web/app access logs on SharePoint front-ends: unauthenticated POSTs to SharePoint admin/ToolPane-class
        endpoints, and request bodies/headers that trip the AMSI signature classes CISA names
        (Exploit:Script/ToolPaneAuthBypass.*, Exploit:Script/SuspSignoutReqBody.A) — the presence of an AMSI hit on a
        SharePoint web application is the cheapest positive signal available.
      - Process-creation telemetry with parent lineage on SharePoint/IIS hosts: any child process under the IIS
        worker (w3wp.exe) hosting a SharePoint application pool — script interpreters, encoded command lines,
        certificate/keyfile utilities — is anomalous on a healthy SharePoint server.
      - Persistence/config artefacts: reads or exports of the ASP.NET machineKey material (web.config /
        SharePoint farm key store); any process touching that material outside a documented farm operation.
      - Authentication logs after the patch: successful authentications carrying valid but unexpected session
        tokens, and use of technical/service accounts from source hosts or at times inconsistent with their normal
        automation pattern — this is the signal that a forged-token or credential-reuse follow-on is running.
      - Egress: SharePoint/IIS hosts initiating outbound connections; a document/collaboration server is a
        destination, not usually a client.

      TRIAGE / BENIGN LOOKALIKES: SharePoint farm maintenance, Microsoft update installers and backup agents also
      spawn child processes under IIS-adjacent service accounts and also read farm configuration. Discriminators the
      sources support: whether the activity sits inside a scheduled maintenance window, whether the parent is the
      SharePoint timer/admin service rather than the internet-facing application pool worker, whether the binary is
      signed and in its expected path, and whether the same technical account is being used from more than its one
      expected source host.

      HARDENING LEVER: patching alone does not evict this chain. The named lever is machine-key rotation on the
      SharePoint farm plus a credential reset for every account that touched the server, which is exactly the pair
      BIT executed (password reset for all ~200 accounts, then a full preventive rebuild of the servers). CISA's
      alert additionally names enabling AMSI integration for every SharePoint web application, in Full Mode for
      Request Body Scan Mode where feasible.

      SWISS REGULATORY ANGLE worth surfacing for the constituency: BIT states it met the Informationssicherheitsgesetz
      (ISG) reporting deadline to BACS and SEPOS, and then went further by pushing technical indicators to Swiss
      critical-infrastructure operators via the BACS platform. That is the federal reporting duty operating as
      designed and is a useful reference point for cantonal and CI operators modelling their own ISG obligations.

  - title: "Swiss Defence Department closes its RUAG MRO review: the Akira ransom payment was lawful, but the risk weighing and the owner notification were not — federal no-ransom position unchanged"
    sources:
      - { url: "https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21", publisher: "Eidgenössisches Departement für Verteidigung, Bevölkerungsschutz und Sport (VBS)", date: "2026-08-04", role: "primary" }
      - { url: "https://www.srf.ch/news/schweiz/nach-cyberangriff-loesegeldzahlung-der-ruag-an-hackergruppe-war-gesetzeskonform", publisher: "SRF", date: "2026-08-04", role: "corroborating" }
    discovery_trace: >-
      first seen at: inside-it.ch RSS feed (source id inside-it-ch, recipe fix — see fetch note),
      URL https://www.inside-it.ch/rss.xml, item "VBS legitimiert Lösegeldzahlung durch Ruag" (2026-08-04 12:16 GMT;
      the article page itself 403s and is NOT cited) → pivot: WebSearch
      ("VBS Untersuchung Ruag Lösegeldzahlung Akira Ransomware Bericht") → primary: VBS media release,
      URL https://www.vbs.admin.ch/de/newnsb/5bBC1HPXGI21 (fetched raw via tools/fetch_source.py url) →
      corroboration: SRF, URL https://www.srf.ch/news/schweiz/nach-cyberangriff-loesegeldzahlung-der-ruag-an-hackergruppe-war-gesetzeskonform
    summary: |
      On 2026-08-04 the Swiss Defence Department (VBS) published the result of its review into how RUAG MRO handled the
      Akira ransomware attack on its US subsidiary RUAG LLC, detected on 9–10 October 2025, in which data was stolen
      from the subsidiary's systems and a ransom was subsequently paid. The finding is a first for a Swiss
      federally-owned defence group: the VBS concludes that RUAG MRO checked the lawfulness of a ransom payment under
      applicable US law before paying, that as a company organised under private law the decision sat with its own
      corporate bodies, that no prior consent from the Confederation as owner was required, and that "keine
      Anhaltspunkte für eine Rechtsverletzung bestehen" (no indications of a legal violation). SRF reports RUAG
      leadership described the amount paid as "gering" (small) without naming a figure. The criticism is governance,
      not legality. The VBS holds that RUAG MRO's opportunity-and-risk weighing was oriented mainly on legal and
      economic considerations and that "politische und reputationsbezogene Auswirkungen sowie weitere übergeordnete
      Interessen nicht ausreichend berücksichtigt" were insufficiently accounted for, and that the Federal Council's
      strategic objectives for RUAG MRO require the owner to be informed before public communication — which did not
      happen in a coordinated way. RUAG MRO's own post-incident analysis identified escalation processes at
      subsidiaries, IT governance including the group IT lead, crisis-communication processes and minimum IT security
      requirements as the weak points, and is remediating them with reporting duties to GS-VBS and the Federal Finance
      Administration. The Confederation as owner additionally directs RUAG MRO to review its protective measures and
      processes together with the Bundesamt für Cybersicherheit (BACS), remediate gaps, and have its overall adequacy
      of protection against cyber incidents assessed. No further ownership-law measures are being taken. Crucially for
      every other Swiss operator: "Das VBS und der Bund halten unverändert an ihrer Empfehlung fest, im Falle von
      Cyber-Angriffen kein Lösegeld zu bezahlen" — the federal recommendation not to pay stands, and the finding of
      lawfulness is explicitly not an endorsement.
    region_nexus: "switzerland — federally-owned defence group and the Confederation as owner; the incident itself occurred at a US subsidiary"
    primary_sector_nexus: "direct"
    sector: "public-sector, defence"
    cves: []
    techniques: [T1486, T1657]
    affected_products: []
