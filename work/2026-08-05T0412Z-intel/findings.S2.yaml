items:
  - title: "Swiss Federal Office for IT and Telecommunications (BIT) confirms SharePoint Server intrusion — ~200 federal accounts compromised while patching was already under way"
    sources:
      - { url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL", publisher: "Der Bundesrat / Bundesamt für Informatik und Telekommunikation (BIT)", date: "2026-08-04", role: "primary" }
      - { url: "https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities", publisher: "The Record (Recorded Future News)", date: "2026-08-04", role: "corroborating" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations", publisher: "CISA", date: "2026-07-14", role: "corroborating" }
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-009/", publisher: "CERT-EU", date: "2026-07-23", role: "corroborating" }
    discovery_trace: >-
      first seen at: WebSearch ("Cyberangriff Schweiz Gemeinde Verwaltung August 2026 Daten") →
      pivot: admin.ch federal news item, URL https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL (fetched raw via
      tools/fetch_source.py url — full German body) → primary: the Federal Council / BIT media release itself (no
      further pivot needed; BIT is the disclosing party) → corroboration pivot: WebSearch
      ("BIT SharePoint Cyberangriff Bundesverwaltung 200 Konten kompromittiert") → The Record,
      URL https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities → context pivot:
      CISA alert named in The Record's body, URL
      https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations
      (fetched via bridge `cisa page`) → context pivot: CERT-EU advisory 2026-009,
      URL https://cert.europa.eu/publications/security-advisories/2026-009/ (enumerated via bridge `cert-eu recent 8`)
    summary: |
      Switzerland's Bundesamt für Informatik und Telekommunikation (BIT) — the federal IT service provider that runs
      the Confederation's own data centres — disclosed on 2026-08-04 that its on-premises Microsoft SharePoint Servers
      were compromised and that roughly 200 accounts, both human user accounts and technical (service) accounts, had
      their credentials taken. BIT states the intrusion was carried out by "bisher unbekannte Akteure" and was
      "mutmasslich durch die Ausnutzung dieser Schwachstellen in der SharePoint-Software ermöglicht" — the SharePoint
      flaws Microsoft disclosed in mid-July 2026 (T1190). The timeline is the operationally important part: BIT began
      installing the July security updates immediately after release, yet security staff noticed anomalies on the
      SharePoint servers on Tuesday 28 July, blocked internet access to SharePoint and closed the vulnerabilities on
      confirmation, and only on Friday 31 July established during forensics that account credentials had been
      compromised. That is a three-day gap between "we are patching" and "they were already inside", and a further
      three-day gap to credential-compromise confirmation. Passwords were reset immediately; the affected servers are
      being rebuilt from scratch as a precaution; internet access to SharePoint for users outside the federal
      administration stays blocked until the rebuild completes, while federal staff retain internal access.
      BIT says there is no indication that data beyond those credentials was exfiltrated and notes that confidential
      information and specially protected personal data are not permitted on the SharePoint platform. The Record adds
      the campaign-level mechanism that explains why a rebuild rather than a patch was chosen: in this exploitation
      wave "attackers exploiting the flaws were extracting machine keys from Microsoft's Internet Information Services
      (IIS)", which lets them forge valid ASP.NET session tokens (T1552.004 → T1606) and retain access after patching
      unless the keys are rotated — the same post-exploitation behaviour CISA describes in its SharePoint hardening
      alert. The compromised credentials themselves are the follow-on risk: ~200 federal user and technical accounts
      are a ready supply of valid accounts (T1078) for lateral use, and technical/service accounts in particular are
      the ones least likely to be covered by interactive-logon MFA. BIT reported the incident to the Bundesamt für
      Cybersicherheit (BACS) and the Staatssekretariat für Sicherheitspolitik (SEPOS) within the deadline set by the
      Informationssicherheitsgesetz (ISG), and proactively pushed all relevant technical indicators to Swiss critical-
      infrastructure operators through the BACS platform. BACS and Microsoft are supporting the analysis, which is
      still running.
    region_nexus: "switzerland — the Swiss federal administration's own IT service provider; Europe-wide relevance for any government estate running on-prem SharePoint"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1078, T1552.004, T1606]
    affected_products: ["Microsoft SharePoint Server"]
    entity_keys: []
