    discovery_trace: >-
      first seen at: bsi-de RSS (source id bsi-de), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss —
      item "[NEU] [hoch] Check Point Security Management: Schwachstelle ermöglicht Umgehen von Sicherheitsvorkehrungen
      und Codeausführung" (2026-08-04 09:01 GMT) → pivot: structured advisory body via bridge `bsi-csaf
      WID-SEC-2026-2628`, cited page URL
      https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2628 → primary pivot: vendor advisory
      named in the CSAF references, URL https://support.checkpoint.com/results/sk/sk185222 (page is a JS shell; the
      document title verbatim reads "sk185222 - CVE-2026-18574 - Management Authentication Bypass",
      "Applies to: Multi-Domain Security Management, Security Management") → corroboration: CERT-FR advisory
      enumerated via bridge `cert-fr avis-recent 12`, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0965/ →
      corroboration: heise via feed https://www.heise.de/security/rss/news.rdf → article
      https://www.heise.de/news/Check-Point-Angreifer-koennen-Security-Management-Server-uebernehmen-11398187.html
    summary: |
      Check Point disclosed CVE-2026-18574 on 2026-08-03 in sk185222: an authentication bypass in the Check Point
      management plane that lets a remote, unauthenticated attacker with network reach to the management server
      bypass Management authentication and execute arbitrary commands (T1190). It applies to Security Management and
      Multi-Domain Security Management servers. BSI CERT-Bund published WID-SEC-2026-2628 the same day with the
      version boundaries: Security Management Server before R82.10 Take 40, before R82 Take 122, and before R81.20
      Take 161 are affected, with those three Takes as the fixed versions delivered through the Jumbo Hotfix
      Accumulator. CERT-FR issued CERTFR-2026-AVI-0965 on 2026-08-04 describing the effect as remote arbitrary code
      execution plus a security-policy bypass. Check Point states the flaw was found internally and heise reports that
      as of publication the vendor has no indication of exploitation — "Bislang gibt es seitens des Softwareherstellers
      keine Hinweise, dass Angreifer die Schwachstelle bereits ausnutzen" — with IP filtering in front of the
      management interface named as the interim mitigation. The reason this belongs in a European public-sector brief
      despite being a routine-looking advisory is cumulative: this is the fourth authentication bypass in the same
      Check Point management stack inside two weeks, following CVE-2026-16232 (SmartConsole admin authentication
      bypass, confirmed exploited in the wild) and the CVE-2026-62144 / CVE-2026-62145 pair. A Security Management
      server is the control point for every gateway, policy and configuration in the estate, so a pre-auth bypass
      there is a whole-perimeter compromise, and the single stated precondition — network access to the management
      interface — is precisely what a correctly segmented management network removes.
    region_nexus: "global; Check Point management servers are widely deployed across Swiss and European public-sector and CI network estates"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, finance, telco"
    cves: [CVE-2026-18574]
    techniques: [T1190]
    affected_products: ["Check Point Security Management", "Check Point Multi-Domain Security Management"]
