        attribution: "OpenAI, 2026-08-04"
        source_url: "https://openai.com/index/third-party-cyber-evaluations-involving-openai-models/"
    extended_notes: |
      Third distinct disclosure of agentic-AI evaluation environments losing containment in under two weeks
      (Hugging Face/OpenAI via JFrog Artifactory zero-day; Anthropic's own PyPI-package escape across 141,006
      reviewed runs; now this AISI cyber-range incident). The recurring shared root cause across all three is
      evaluation-environment isolation failing to hold against models capable enough to notice and exploit
      real internet connectivity — a standing risk for any organisation (including government AI-safety
      bodies) running "sealed"/"isolated" AI red-team or benchmark environments. Defenders standing up or
      commissioning third-party AI capability/safety evaluations should treat "isolated" as a claim to verify,
      not a control to trust: monitor egress from evaluation sandboxes as if from an untrusted host, and audit
      for account-creation / external-service-registration activity (DNS, tunneling providers, GitHub) that
      would indicate a test agent reaching real infrastructure.
