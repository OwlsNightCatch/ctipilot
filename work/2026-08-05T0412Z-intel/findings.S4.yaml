  - title: "ByteToBreach — the actor who wiped Romania's land registry — breaches Hungary's State Treasury (MVH) via a ~2017-vintage unpatched Oracle WebLogic server, reaching 116 VMs and 229 TB"
    sources:
      - { url: "https://news.risky.biz/risky-bulletin-hacker-breaches-hungarys-state-treasury/", publisher: "Risky Bulletin (Risky Business Media)", date: "2026-08-05", role: primary }
      - { url: "https://telex.hu/techtud/2026/08/03/magyar-allamkincstar-nki-kiberbiztonsag-kibertamadas-naih-bytetobreach", publisher: "Telex.hu (Hungarian original reporting)", date: "2026-08-03", role: primary }
      - { url: "https://telex.hu/techtud/2026/08/02/magyar-allamkincstar-nemzeti-kifizeto-ugynokseg-kibertamadas-orosz-szerver-titkositott-allomanyok", publisher: "Telex.hu", date: "2026-08-02", role: corroborating }
      - { url: "https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/", publisher: "KELA (threat-intelligence vendor)", date: "2026-07-17", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"BACS NCSC Bund Cyberangriff Sharepoint BIT Stellungnahme August 2026\" — Risky Bulletin surfaced separately via its standard-rotation feed) → risky.biz feed, URL https://news.risky.biz/rss/ (item https://news.risky.biz/risky-bulletin-hacker-breaches-hungarys-state-treasury/) → primary: Telex.hu, URL https://telex.hu/techtud/2026/08/03/magyar-allamkincstar-nki-kiberbiztonsag-kibertamadas-naih-bytetobreach → background: KELA, URL https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/"
    summary: |
      The same self-described financially-motivated intruder tracked in this pipeline's registry as
      actor:bytetobreach (KELA assesses likely an individual from Oran, Algeria; previously attributed to
      the multi-day July 2026 outage/data-theft/backup-destruction at Romania's ANCPI land-registry systems)
      has hit a second European government body: Hungary's State Treasury (Magyar Államkincstár), specifically
      its Agricultural and Rural Development Office (MVH). Hungarian outlet Telex.hu reports the intrusion
      occurred in late July 2026 and was confirmed by Treasury officials to local journalists over the weekend
      of 2026-08-01/02. Per Telex.hu's technical sourcing (cybersecurity experts reviewing screenshots the
      attacker leaked), the entry point was an unpatched, near-decade-old Oracle WebLogic Server vulnerability
      — Telex.hu links directly to Oracle's October 2017 Critical Patch Update page, though no specific CVE
      number is named in the reporting (the October 2017 WebLogic CPU is most widely associated with
      CVE-2017-10271, the WLS-WSAT XMLDecoder deserialization RCE, one of the most persistently exploited
      WebLogic flaws on record — this CVE attribution is this pipeline's contextual inference from the CPU
      reference, not a fact stated by Telex.hu). From that foothold the attacker escalated to full Windows
      domain-administrator privileges, reportedly reaching 116 virtual machines and 229 TB of data, and
      encrypted files on employee workstations with ransomware. Treasury officials state customer/citizen
      data was not affected and dispute the attacker's own (unconfirmed) claim of a Russian-server connection;
      ByteToBreach denies making a ransom demand and states the motive was financial. Hungary's National
      Cybersecurity Institute is investigating; affected servers were disconnected on discovery. KELA's prior
      research (referenced by Risky Bulletin) separately doxxed the actor's likely real identity following
      the Romania incident.
    region_nexus: "Hungary (EU member state, national government financial/agricultural authority — direct European public-sector victim); same actor previously hit Romania's ANCPI"
