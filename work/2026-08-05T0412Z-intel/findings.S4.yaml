        attribution: "The Record (Recorded Future News), 2026-08-04"
        source_url: "https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities"
    extended_notes: |
      This is the materialisation, against a Swiss federal victim, of the exact risk this pipeline already
      flagged operationally on 2026-07-22 for CVE-2026-50522 (SharePoint pre-auth deserialization RCE with
      IIS machine-key theft for persistent forged authentication) — no Swiss source names the CVE, so treat
      the linkage as circumstantial pending an official BACS/NCSC-CH advisory. Detection concept (telemetry
      class first): IIS/SharePoint web-server logs for anomalous POST bodies to `/_trust/default.aspx`
      carrying serialized .NET object payloads; authentication/session logs for SharePoint-issued tokens
      or ViewState validating against a machine key absent from the current IIS worker-process
      configuration (signal of key reuse from outside the environment). Hardening: any org that patched the
      July SharePoint cluster without rotating IIS machine keys and without an eviction pass for planted
      persistence should treat itself as still exposed — patch-then-rotate ordering matters (rotating before
      evicting a resident harvester lets it re-harvest the new keys). No NCSC-CH Security Hub post on this
      specific incident was found in this run's fetch of the CSH API (most recent 15 posts checked,
      newest 2026-08-04, none referencing FOITT/BIT by name) — worth a follow-up fetch as one may land later.
