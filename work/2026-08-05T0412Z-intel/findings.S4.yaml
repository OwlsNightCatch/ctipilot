      - { url: "https://www.20min.ch/story/200-konten-betroffen-cyberangriff-auf-sharepoint-server-des-bundes-konten-gesperrt-103612935", publisher: "20 Minuten", date: "2026-08-04", role: corroborating }
      - { url: "https://databreaches.net/2026/08/04/swiss-federal-it-office-hit-by-cyberattack/", publisher: "DataBreaches.net", date: "2026-08-04", role: corroborating }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (item https://databreaches.net/2026/08/04/swiss-federal-it-office-hit-by-cyberattack/) → pivot: WebSearch (\"FOITT Bundesamt Informatik Cyberangriff SharePoint August 2026\") → pivot: swissinfo.ch, URL https://www.swissinfo.ch/eng/various/cyberattack-on-the-federal-office-for-information-technologys-sharepoint-server/91843136 → pivot: therecord.media, URL https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities → pivot: 20min.ch, URL https://www.20min.ch/story/200-konten-betroffen-cyberangriff-auf-sharepoint-server-des-bundes-konten-gesperrt-103612935 → primary: admin.ch press release, URL https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL"
    summary: |
      Switzerland's Federal Office of Information Technology, Systems and Telecommunication (BIT/FOITT)
      disclosed on 2026-08-04 that a cyberattack compromised roughly 200 user and technical accounts on
      on-premises SharePoint servers running in federal data centres. Per the Federal Chancellery's own
      press release, security specialists detected anomalies on 28 July 2026; internet access was blocked
      and the vulnerabilities closed the same day; analysis on 31 July 2026 confirmed ~200 compromised
      accounts and passwords were reset. FOITT states the attack presumably exploited Microsoft SharePoint
      vulnerabilities Microsoft disclosed in mid-July 2026, and that BIT was supported by the Federal
      Cybersecurity Office (BACS) and Microsoft in the investigation. The Record's reporting adds technical
      mechanics consistent with the machine-key-theft pattern this pipeline already covered for
      CVE-2026-50522 (2026-07-22): attackers reportedly extracted IIS machine keys and used them to forge
      session tokens, which would grant access surviving a simple patch unless keys are rotated — though no
      Swiss source names a specific CVE, so this connection is contextual inference, not a confirmed fact.
      No evidence of data exfiltration has been found to date; SharePoint is stated to not host confidential
      or especially sensitive personal data by federal policy. Internet access for external-to-the-federal-
      administration users remains blocked pending server rebuild; internal federal staff retain document
      access via alternative channels. Per Swiss reporting, BIT met its Information Security Act (ISG)
      notification duty to BACS and the State Secretariat for Security Policy (SEPOS), and proactively
      shared technical indicators with Swiss critical-infrastructure operators via the BACS platform.
