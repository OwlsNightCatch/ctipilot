    extended_notes: |
      Confidence set to MEDIUM rather than HIGH because: (1) the precise CVE is not named by any source —
      only an Oracle October-2017 CPU reference, so the exact vulnerable WebLogic component/function cannot
      be pinned to vendor precision; (2) scope figures (116 VMs, 229 TB) come from a Hungarian outlet's
      cybersecurity-expert analysis of attacker-leaked screenshots, not an official Treasury statement, so
      treat as a claim under review rather than confirmed fact; (3) the Russian-server-origin claim is
      explicitly disputed by the attacker and not independently confirmed either way. What IS well-corroborated
      across both Telex.hu pieces and Risky Bulletin: victim identity (Hungarian State Treasury/MVH), attacker
      handle (ByteToBreach), and the WebLogic entry-vector class. Defender takeaway: nearly decade-old,
      publicly-patched Oracle WebLogic RCEs remain a live path to full domain compromise at government bodies
      years after patches shipped — this is a patch-hygiene/asset-inventory finding, not a novel technique;
      any organisation running internet-facing legacy WebLogic instances (a common shadow-IT/legacy-integration
      risk in public-sector environments) should confirm October-2017-and-later CPU patch levels and treat
      an unpatched instance as equivalent to a confirmed-exploited exposure given this actor's demonstrated,
      repeated cross-border targeting of European government registries/treasuries.
