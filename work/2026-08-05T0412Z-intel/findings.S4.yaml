  - title: "Cyberattack compromises ~200 accounts on Swiss federal government SharePoint servers, exploiting mid-July-disclosed vulnerabilities"
    sources:
      - { url: "https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL", publisher: "Swiss Federal Chancellery (admin.ch press release)", date: "2026-08-04", role: primary }
