  # ============================================================================
  # ITEM 3 — Cisco Talos: JWR phishing framework
  # ============================================================================
  - title: "Cisco Talos: JWR — a real-time, operator-puppeteered PhaaS framework assessed as a variant of 'The Outsider,' delivered via SMS smishing across Southeast Asia and the Middle East"
    sources:
      - { url: "https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/", publisher: "Cisco Talos (Chetan Raghuprasad)", date: "2026-08-13", role: "primary" }
    discovery_trace: >
      Assigned primary for Phase 4 deep-read. Re-fetched in full via `python3
      tools/fetch_source.py url https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/`
      (raw HTML, direct 200) — this is Talos's own first-hand technical analysis and is the
      terminal primary; no further pivot performed (this is a deep-read task, not a discovery
      sweep).
    summary: |
      Cisco Talos published (13 Aug 2026, Chetan Raghuprasad) a technical dissection of an
      undocumented phishing framework its developer internally branded "JWR." Talos's exact
      confidence language: "Talos assesses with medium confidence that the JWR phishing
      framework is a variant of 'The Outsider,' a phishing-as-a-service (PhaaS) platform, based
      on several similarities in the client engine scripts and functionalities of the two PhaaS
      platforms." The Outsider is described as operated by a Chinese-speaking actor Talos calls
      "Outsider Enterprise," and Talos separately notes that in June 2026 the FBI announced a
      technical takedown of the Outsider PhaaS platform (operating since 2023) via a joint
      operation named "Ghost Hook" — but because the Outsider kit was sold as a self-service
      product over the operator's Telegram channels, Talos infers other Chinese-speaking actors
      likely operate independent variants, JWR plausibly among them. [Composer check: the
      entity registry already carries campaign:outsider-phaas-gemini-2026 ("Outsider PhaaS" —
      China-based PhaaS weaponizing Gemini, target of a Google lawsuit) — same platform name,
      but that entry's sourced facts (Gemini abuse, Google lawsuit) do not overlap with what
      Talos states here (FBI takedown "Ghost Hook," Telegram self-service sales); verify before
      merging whether these are the same tracked entity documented via two different
      enforcement actions, or two distinct "Outsider"-named platforms, before assigning the
      entity_key.]
      Real-time WebSocket mechanism: rather than a static credential-logging page, JWR keeps an
      AES-CTR encrypted WebSocket open between the victim's browser and the threat actor's C2
      for the full session. Architecture splits into a "Host Bridge" module (an IIFE running in
      the parent phishing page — typically a replica of a legitimate checkout/login page — that
      relays data into a child iframe and owns the WebSocket) and a Vue.js 2.x "victim
      application" (window.vm = new Vue({el: '#app', ...})) that renders across 44 phishing HTML
      pages and executes more than 40 distinct C2-issued instructions. Each input field's
      keystrokes stream to the operator live, "allowing the actor to view partial card numbers,
      partial passwords, and partial verification codes as the victim types, without needing to
      wait for the victim to click any submit button" — i.e. the operator sees and can react to
      data before form submission. Instructions are deduplicated client-side via a
      JwrExecutedInstructions history (capped at 50 entries, trimmed to the most recent 30) to
      prevent double-execution; each processed instruction is acknowledged back to C2 in the
      format {type:"instructionAck", instruction_id:, cvv_id:}.
      MFA/2FA-code-on-demand behavior, precisely: during a live card-capture session, once the
      operator accepts the entered card data, "the operator sends one of the instructions:
      to_sms, to_2fa, to_pin, or to_app, directing the victim to a verification page to confirm
      their identity with a one-time code" — the operator chooses which verification channel to
      demand in real time based on what the victim's account/bank actually uses. A rejected code
      re-prompts via tip_fail; an accepted one proceeds to to_success, exfiltrating the full
      accumulated data object and redirecting the victim to the real site. A separate
      instruction, updata_2fa, lets the operator "silently inject/display an OTP code supplied
      by the operator" without victim-visible navigation — used for a different flow than the
      request-and-wait to_2fa/to_sms/to_pin/to_app sequence.
      Impersonated brands: "The client-side engine of the framework impersonates login, and
      checkout flows of several payment gateways, including Shopify, PayPal, Apple, Klarna, and
      banks." Purpose-built Shopify integration reads the cart_data URL parameter (a signed JSON
      blob Shopify itself passes between checkout steps) to derive the WebSocket's base URL from
      a legitimate-looking Shopify checkout domain and reconstruct an accurate fake cart
      (products, quantities, prices, totals) — a WooCommerce integration exists alongside it.
      Delivery campaign observed: "Cisco Talos observed an attacker utilizing an SMS phishing
      technique, sending SMS related to toll or road-pricing fees, postal or courier fees lures
      that contain a malicious URL targeting potential victims." Victimology is multi-country
      smishing rather than single-target: lures impersonating a national land-transport
      authority/road-toll portal (consistent with an unpaid-toll lure in Singapore), a national
      postal service ("parcel held pending a customs or delivery fee"), an electronic
      toll-collection system in the UAE, and a regional courier brand used across several
      Southeast Asian countries (undelivered-parcel / cash-on-delivery theme).
      Anti-analysis: "The host bridge incorporates an anti-analysis check, which serves as a
      one-time execution guard that performs a self-referential .toString().search() call
      against a backtracking regex. This check detects whether a debugger has attached the
      function to modify its apparent source." A decoy variable is also scattered through the
      code specifically to mislead static-analysis tooling. Operator-facing status messages are
      entirely in Simplified Chinese (Talos gives examples: "正在填写PayPal登录账号" / filling in
      PayPal login account; "进入2FA验证页, 请发送验证, 等待用户提交" / entering 2FA verification
      page, waiting for submission), which Talos states indicates a Chinese-speaking operator.
      Comparative note: Talos found JWR shares NO code-level implementation with three other
      Chinese-speaking-ecosystem PhaaS kits it compared it against — Lucid, Darcula, and
      Lighthouse — despite behavioral-level similarity (live operator puppeteering, OTP/2FA
      interception paired with card capture, multi-brand templating at scale) across all four,
      which Talos frames as tradecraft-lineage consistency rather than shared code.
      Defender-facing observables Talos names in a "Coverage" section: a ClamAV signature and
      five Snort2/Snort3 SIDs (rule-code content — per this deployment's no-rule-code policy,
      composer should note only that Talos ships detection coverage, not reproduce the
      signature/SID identifiers verbatim in the entry body).
    region_nexus: "Southeast Asia and Middle East targeting (Singapore, UAE, regional Southeast Asian courier brands) — no direct Swiss/European victim nexus stated; relevance to this constituency is the transferable PhaaS/real-time-session-hijack TTP class (live operator control of MFA prompts), a technique applicable against any region's payment/banking customers"
    primary_sector_nexus: "indirect (finance/payments-adjacent — targets consumer banking, PayPal, and e-commerce checkout credentials rather than institutional/government targets directly)"
    sector: "finance, telco (SMS delivery vector), general consumer-facing payment/e-commerce"
