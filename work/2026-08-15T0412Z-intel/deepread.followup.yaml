  # ============================================================================
  # ITEM 1 — watchTowr Labs: Citrix NetScaler CVE-2026-8452 pre-auth RCE (THE DEEP DIVE)
  # ============================================================================
  - title: "watchTowr Labs: Citrix NetScaler CVE-2026-8452 heap overflow in SAML SignedInfo canonicalization — pre-auth root RCE behind a CVSS 8.8 'DoS' rating"
    sources:
      - { url: "https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/", publisher: "watchTowr Labs", date: "2026-08-14", role: "primary" }
