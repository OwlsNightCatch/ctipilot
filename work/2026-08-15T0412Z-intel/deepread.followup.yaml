      Detection concept (telemetry class → anchor): outbound WebSocket connections from a
      browser session to a non-brand domain immediately following navigation from an SMS-lure
      URL is the class of observable; the WebSocket path pattern
      webSocket/QT/{sessionId}/{static-suffix} and REST beacon paths under api/open/* (addClick,
      getSyncSettings, pollInstruction, the_final_interface, addCvv) are the framework's fixed
      endpoint-naming convention Talos documents — useful for web-proxy/DNS log hunting in
      vendor-neutral terms (a fixed, unbranded REST path structure co-located with a payment-
      brand-impersonating page body is the discriminator). Triage/benign-lookalike note: Talos
      states the framework specifically engineers its WebSocket origin to "seem to originate
      from a legitimate Shopify domain" by deriving the connection's base URL from Shopify's own
      cart_data parameter — meaning domain/origin alone is an insufficient discriminator for
