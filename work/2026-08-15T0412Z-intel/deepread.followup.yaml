    discovery_trace: >
      Assigned primary for Phase 4 deep-read (already surfaced by this run's S1/S2 domains).
      Re-fetched in full via `python3 tools/fetch_source.py url
      https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/`
      (raw HTML, 65,601 bytes, saved to watchtowr_raw.txt) → pivoted to Citrix's own advisory
      CTX696604 at https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696604
      (JS-only Angular SPA shell — both the bridge fetch and a WebFetch retry returned only
      "Loading..."; unreadable this run, jina reader pool exhausted per run instructions) →
      corroborated the official CVE description/CVSS/version data instead via NVD's own CNA
      pages for CVE-2026-8452 and CVE-2026-8451 (fetched directly, `nvd.nist.gov/vuln/detail/…`)
      → WebSearch ("CTX696604 CVE-2026-8452 CVE-2026-8451 NetScaler") surfaced Beazley
      Security's advisory recap, fetched via WebFetch for the CVE-2026-8451 SAML-IdP
      memory-overread technical detail → fetched watchTowr's own sibling post on CVE-2026-8451
      ("CitrixBleed To Infinity And Beyond") to check whether it claims in-the-wild
      exploitation → fetched NCSC-CH's own advisory record (id 12739) via the ncsc-csh bridge
      subcommand to resolve the exploitation-status question authoritatively for the
      home-region CERT.
    summary: |
      watchTowr Labs (Sina Kheirkhah) published a full technical writeup on 2026-08-14 of a
      heap-overflow-to-root-RCE chain in Citrix NetScaler ADC/Gateway that Citrix's own advisory
      classifies only as a "Memory overflow ... leading to unpredictable or erroneous behavior
      and Denial of Service" (NVD's verbatim CVE-2026-8452 description; CVSS 8.8). watchTowr
      demonstrates the same bug is fully weaponizable as unauthenticated remote code execution
      to root — the vendor/NVD severity label is a significant understatement of real-world risk.
      Root cause: during SAML signature canonicalization, the nsppe binary (NetScaler's
      packet-processing engine) copies the attacker-controlled PrefixList attribute of the
      InclusiveNamespaces child element inside a SAML <SignedInfo> block into a fixed-size
      global buffer with no bounds check. An oversized PrefixList value overflows the buffer
      linearly into the header of the adjacent chunk in NetScaler's nsb network-buffer pool
      (fixed 0x980-byte stride), corrupting that neighbor's data-pointer field (offset +0x50)
      and freelist-link field (+0x60). Because splitPktInner later retrieves that chunk and
      calls memcpy using the corrupted data pointer as destination — adjusted by an
      attacker-controlled length — the bug becomes a fully attacker-controlled write-what-where
      primitive (both the source, from the same PrefixList chunk, and destination are attacker
      data). watchTowr byte-mapped the header fields using self-describing N%07d markers to
      determine which payload byte lands in which field, without any prior symbol recovery
      beyond a partial GDB session. With no ASLR and a non-PIE, executable-heap binary,
      watchTowr overwrote the tx_pkt_complete_fptr function pointer inside pe_tx_pkt to redirect
      execution into shellcode on the (always fixed-address, RWX) heap, dropped a PHP webshell,
      and — because nsppe crashing triggers a full appliance reboot via a "pitboss" watchdog
      process that wipes any dropped file — neutralized the SIGSEGV/SIGBUS signal handlers with
      additional shellcode so that pitboss only respawns nsppe instead of rebooting the box,
      letting the webshell survive. Since nsppe runs as root but the webserver executing the
      webshell runs as "nobody", watchTowr set the SUID bit on /bin/sh from the root shellcode
      to get a root-EUID command shell through the webshell. The entire chain is pre-authentication.
      Exploitation prerequisite: the appliance must be configured to use SAML as either a Service
      Provider (SP) or an Identity Provider (IdP) — separately, NVD's own CVE-2026-8452
      description frames the same precondition at the deployment-construct level as "configured
      as a Gateway (SSL VPN, ICA Proxy, CVPN, RDP Proxy) or AAA virtual server" (both framings
      describe the same reachable code path: any Gateway/AAA-vserver auth flow using SAML).
      Affected: NetScaler ADC/Gateway 14.1 before 14.1-72.61, 13.1 before 13.1-63.18 (FIPS/NDcPP
      variants patch to slightly different build numbers per Citrix — 14.1-72.61 FIPS, and
      13.1-37.272 for the FIPS/NDcPP 13.1 branch, per Beazley's advisory recap of CTX696604).
      Both already fixed in the same June/July 2026 CTX696604 release that patched the sibling
      flaw CVE-2026-8451.
      CVE numbering is watchTowr's OWN best guess, not confirmed: watchTowr states plainly they
      cannot be certain the bug they analyzed is CVE-2026-8452 ("typical Citrix shenanigans...
      prevent us from doing so") — their inference rests only on the NVD description matching
      "Memory Overflow" and one credited researcher's employer. NCSC-CH's own advisory (updated
      2026-08-14) hedges identically, describing the watchTowr post as "likely related to
      CVE-2026-8452" rather than confirmed.
      Relationship to CVE-2026-8451: both CVEs were patched together in the same CTX696604
      bulletin (which also covers CVE-2026-8655, CVE-2026-10816, CVE-2026-10817,
      CVE-2026-13474 — six CVEs total) and both received independent watchTowr writeups.
      CVE-2026-8451 is a DIFFERENT, unrelated bug class: a pre-auth memory-OVERREAD (not
      overflow) in the SAML IdP's XML attribute parser (AssertionConsumerServiceURL, unquoted
      attribute values not properly terminated) that leaks process memory into the NSC_TASS
      response cookie — a "CitrixBleed"-style information-disclosure bug, reachable only when
      configured as SAML IdP specifically (narrower precondition than 8452's SP-or-IdP).
      IMPORTANT EXPLOITATION-STATUS CORRECTION: CVE-2026-8451 IS reported as actively
      exploited — NCSC-CH's own advisory (id 12739, updated 2026-08-14) states verbatim
      "Current exploitation status: Actively Exploited, Proof of Concept Available" and cites
      SecurityWeek's "New CitrixBleed Vulnerability Exploited Immediately After Public
      Disclosure" as corroboration. CVE-2026-8452 (the RCE chain that is the subject of THIS
      watchTowr post) has NO reported in-the-wild exploitation from any source fetched this run:
      watchTowr's own CVE-2026-8452 post never mentions "wild"/"exploited" at all; SentinelOne's
      vulnerability-database page states explicitly "No public exploit code or proof-of-concept
      has been published, and the vulnerability is not currently listed in the CISA Known
      Exploited Vulnerabilities catalog"; NCSC-CH's own "CVEs IN THIS ADVISORY" list only names
      CVE-2026-8451, not CVE-2026-8452. Composer note: do not conflate the two — the confirmed
      ITW exploitation belongs to the SIBLING info-leak bug (8451), not to the RCE chain
      (8452) this watchTowr post is about.
      Detection/telemetry observables watchTowr documents (process/crash behavior, no IOCs):
      an oversized SAML <SignedInfo>/PrefixList payload first manifests as a SIGBUS (not
      SIGSEGV — watchTowr notes this is FreeBSD-specific behavior for invalid memory accesses,
      relevant since NetScaler's OS base is FreeBSD) inside ns_memcpy_avx, NOT at the point of
      the actual overflow — the corrupted allocator metadata only triggers a crash later when
      the smashed freelist chunk is reused. A successful full chain additionally produces: an
      nsppe process crash/restart WITHOUT a full appliance reboot (the intended NetScaler
      failure mode on an nsppe crash is a full box reboot via the "pitboss" watchdog; the
      exploit specifically suppresses that by tearing down nsppe's SIGSEGV/SIGBUS signal
      handlers via the sigaction syscall, so "pitboss decided to simply respawn nsppe" instead
      of rebooting — an anomalous NetScaler error-log entry watchTowr describes but the
      literal string is a screenshot in the article and not machine-extractable this run); a
      PHP webshell file written to disk (unspecified path in the extractable text — described
      only as "the following path" against a code block); and if successful end-to-end, a
      spawned root-EUID shell via SUID /bin/sh invoked through the webshell.
