        source_url: "https://www.sentinelone.com/vulnerability-database/cve-2026-8452/"
    extended_notes: |
      Both CVE-2026-8451 and CVE-2026-8452 carry CVSS v4.0 base score 8.8 (HIGH) per NVD's own
      CNA-sourced metrics (confirmed by direct fetch of both NVD pages: cvss4-cna-panel-score
      "8.8 HIGH" appears on both records). CWE-119 (improper restriction of operations within
      memory-buffer bounds) is the classification for CVE-2026-8452 per SentinelOne's
      vulnerability-database page.
      Citrix's own KB article CTX696604 could NOT be read directly this run — both a bridge
      fetch (`tools/fetch_source.py url`) and a WebFetch retry returned only the Angular SPA's
      "Loading..." boot shell (200 OK, but zero rendered content; not a 403/anti-bot challenge,
      so the bridge's jina-fallback-on-challenge logic never triggers on this host). Flag for
      the operator: support.citrix.com KB pages need a dedicated bridge recipe (this is at
      least the second run to hit this exact SPA-shell pattern on a Citrix advisory — S2's
      findings this same run logged the identical failure). NVD's own CNA-sourced description/
      CVSS pages were a fully adequate substitute for the classification/scoring facts.
      Composer accuracy checklist: (1) do not state the RCE chain has been exploited in the
      wild — no source claims this; (2) do not omit that the SIBLING bug CVE-2026-8451 (not
      the RCE) IS actively exploited per NCSC-CH; (3) the CVE-2026-8452 identifier itself is
      watchTowr's inference, not vendor-confirmed — render this with appropriate hedging
      ("believed to be" / "assessed as", not a bare assertion); (4) watchTowr's own post never
      names or links CVE-2026-8451 — the sibling relationship is established here via the
      shared CTX696604 bulletin + NCSC-CH's advisory + watchTowr's own companion post, not via
      the CVE-2026-8452 post itself.
      Detection concept (telemetry class → anchor): monitor SAML AuthnRequest/Response bodies
      at NetScaler Gateway/AAA-vserver SAML endpoints for anomalously large
      InclusiveNamespaces/PrefixList XML attribute values inside a <SignedInfo> block; watch
      NetScaler system/error logs for unexpected nsppe process restarts NOT accompanied by a
      full appliance reboot event (the anomalous signature this exploit specifically produces,
      per watchTowr's description of pitboss's altered behavior) correlated in time with
      inbound SAML authentication attempts; if host-level EDR/process telemetry is available on
      the appliance, a spawned /bin/sh child of the web server process (normally "nobody") with
      an unexpected root EUID, or any web-server-spawned shell at all, is a strong
      post-exploitation indicator since NetScaler's web server does not spawn shells in normal
      operation. Hardening: confirm every NetScaler instance is patched to 14.1-72.61 / 13.1-63.18
      (or the FIPS/NDcPP-specific build for those variants) or later; where patch level cannot
      be immediately confirmed, restrict/disable unauthenticated external exposure of the
      Gateway/AAA-vserver SAML SP/IdP endpoint until verified.

  # ============================================================================
  # ITEM 2 — Kaspersky Securelist: HoneyMyte / CoolClient kernel-mode driver
  # ============================================================================
  - title: "Kaspersky GReAT: HoneyMyte (Mustang Panda) upgrades CoolClient backdoor with a signed kernel-mode rootkit driver (msagent.sys)"
    sources:
      - { url: "https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/", publisher: "Kaspersky Securelist (GReAT, author Fareed Radzi)", date: "2026-08-14", role: "primary" }
    discovery_trace: >
      Assigned primary for Phase 4 deep-read. Re-fetched in full via `python3
      tools/fetch_source.py url https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/`
      (raw HTML, direct 200, no anti-bot fallback needed) — no further pivot required; this is
      Kaspersky's own first-hand GReAT technical analysis and is the terminal primary.
    summary: |
      Kaspersky's GReAT team published (14 Aug 2026) a technical analysis of a new variant of
      the CoolClient backdoor — attributed to HoneyMyte — that adds a kernel-mode Windows
      rootkit driver. Kaspersky's OWN alias statement: "CoolClient is a backdoor family
      attributed to the HoneyMyte APT group (also known as Mustang Panda)". Kaspersky does NOT
      state any other alias (Bronze President / Earth Preta / Red Delta / Basin / Red Lich /
      Stately Taurus are NOT mentioned anywhere in this article) — composer must not assert
      those aliases on this source's authority even though other trackers commonly group them
      under the same cluster.
      Deployment chain: HoneyMyte used PlugX as the initial post-compromise implant in the
      observed Myanmar intrusion, adding Microsoft Defender folder/file exclusions via wmic for
      a fake "Windows Defender" install directory, then dropping a renamed legitimate Sangfor
      executable (Sang.exe → defender.exe) as a DLL-sideloading host for the first-stage loader
      libngs.dll. Persistence via a SYSTEM-privileged scheduled task launching defender.exe at
      startup. The multi-stage user-mode chain (libngs.dll → decrypts/loads loadcert.ini →
      injects into synchost.exe → decrypts cert.ini as the final C2 implant) is consistent with
      prior CoolClient variants Kaspersky (2025) and Sophos (2022)/Trend Micro (2023) previously
      documented, with the new report noting the injection target changed from write.exe to
      synchost.exe.
      Kernel-mode driver deployment preconditions: CoolClient checks for full access to the
      Service Control Manager (SCM) and the presence of SeTcbPrivilege before extracting an
      embedded LZMA-compressed driver from loadcert.ini and writing it to disk as msagent.sys
      (co-located with cert.ini, e.g. C:\Program Files\Microsoft\Windows Defender\msagent.sys),
      then installing/starting it as a service named "msagent". Administrator privileges are a
      prerequisite reached via a UAC-bypass technique combining RPC-based process creation
      (targeting winver.exe then computerdefaults.exe via the local ncalrpc endpoint) with
      PPID spoofing (via PROC_THREAD_ATTRIBUTE_PARENT_PROCESS/UpdateProcThreadAttribute),
      described by Kaspersky as similar to a technique documented by Google Project Zero.
      Driver communication: the user-mode component opens \\.\msagent and issues
      DeviceIoControl requests against a device object \Device\ToolTool (symlink
      \DosDevices\ToolTool). The driver implements 33 total IOCTL handlers, though the analyzed
      sample invokes only three during normal execution: 0x222120 (register the CoolClient
      process as trusted/protected), 0x2221E0 (register the C2 IPv4 address, used to filter it
      out of Nsiproxy-returned network data so security tools don't see the malware's own C2
      connections), and 0x2220F0 (register filesystem/registry paths for protection/hiding).
      The remaining 30 unused-by-this-sample handlers span: enable/disable-rootkit toggling,
      protection-entry query/removal, shellcode injection into a target process via
      NtCreateThreadEx, kernel-module hiding by unlinking PsLoadedModuleList entries, file
      deletion, embedded-buffer decrypt-and-write-to-disk, encrypted-file read/decrypt, image
      section unmapping, process termination by PID, Protected-Process-Light (PPL) removal,
      registry value creation/modification, process hide/restore via active-process-list
      unlink/relink, module hide/restore, kernel notification-callback enumerate/disable/
      restore, manual secondary-driver loading, and — most notably for detection/hunt purposes
      — a handler that writes to an arbitrary kernel address (0x2221BC).
      Stealth mechanisms: three kernel callback types registered at init (ObRegisterCallbacks
      at altitude 1203 for process/thread-handle-open interception protecting the injected
      synchost.exe process; PsSetCreateProcessNotifyRoutineEx + PsSetLoadImageNotifyRoutine for
      process/image tracking); a filesystem minifilter (FltRegisterFilter, dynamically-assigned
      altitude with retry-on-conflict) that denies access to protected paths; a registry
      callback (CmRegisterCallbackEx, altitude 320000) that strips protected keys/values from
      enumeration results and returns STATUS_ACCESS_DENIED on direct access attempts (processes
      registered via IOCTL 0x222120 bypass this filtering); and a hook installed on the
      Nsiproxy driver (via ObReferenceObjectByName on \Driver\Nsiproxy, replacing a handler
      pointer) that strips the malware's registered C2 IPv4 addresses from network information
      returned to user-mode tools.
      Certificate: the driver IS digitally signed — with an expired 2013-era commercial
      code-signing certificate issued to "Nanjing Ranyi Technology Co., Ltd." (serial 3E 62 DC
      5D 8D 61 2A 26 33 E7 6B DF D6 07 19 DD, valid Aug 2013-Sep 2014). Kaspersky found OTHER
      older malicious drivers signed with the SAME certificate (compiled ~2013) but states no
      evidence linking those to this CoolClient campaign. The embedded PDB path contains
      Chinese-language developer-environment strings ("Nanjing Laboratory" / "Zhang Xuejie
      Yunnan m") that Kaspersky's OSINT could not tie to a known organization/developer/actor.
      Prior documentation: no earlier "CoolClient driver" existed — Kaspersky states this
      kernel-mode component is "previously undocumented" for CoolClient specifically; HoneyMyte
      had previously fielded kernel-mode functionality only in a DIFFERENT malware family,
      ToneShell, to which this driver's design is described as "comparable."
      Victimology: confirmed intrusions in Myanmar, Mongolia, Pakistan, and Russia, "including
      confirmed government entities" — consistently as a secondary backdoor deployed after a
      PlugX foothold.
    region_nexus: "Asia-focused (Myanmar, Mongolia, Pakistan, Russia) — no direct Swiss/European nexus; relevance to this constituency is as a transferable kernel-rootkit TTP profile (driver-based process/file/registry/network-artifact hiding via ObRegisterCallbacks/minifilter/registry-callback/Nsiproxy-hook) rather than regional targeting"
