  - title: "German BKA / Brazilian Federal Police arrest seven over a November 2023 payment-provider vulnerability that let attackers drain €30M from Commerzbank customer accounts"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-arrested-over-30m-bank-fraud-exploiting-service-provider-flaw/", publisher: "BleepingComputer", date: "2026-08-14", role: "primary" }
