  - title: "Threema and its Swiss colocation partner Nine hit by a sustained, adaptive DDoS campaign — availability-only impact, but a reminder that attacking the hosting layer bypasses app-level DDoS defenses"
    sources:
      - { url: "https://threema.com/en/blog/outage-august-2026", publisher: "Threema GmbH", date: "2026-08-14", role: "primary" }
      - { url: "https://cyberinsider.com/threema-messenger-says-ddos-attacks-disrupted-its-service-for-two-days/", publisher: "CyberInsider", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: WebFetch cyberinsider.com listing, URL https://cyberinsider.com → primary: Threema GmbH blog, URL https://threema.com/en/blog/outage-august-2026"
    summary: |
      Swiss end-to-end-encrypted messenger Threema disclosed on 2026-08-14 that a series of large-scale, adaptive DDoS attacks targeted both Threema's own infrastructure and its Swiss colocation partner Nine this week, making it unclear whether Threema was the primary target or one of several. The attacks caused a full outage Tuesday 19:30-23:30 CEST and intermittent brief interruptions through Wednesday morning before normal operations resumed at 12:23. Threema states the attacks continuously varied their traffic sources and patterns, complicating mitigation ("a cat-and-mouse game"), and explicitly notes this pattern "may be the case with state actors" without attributing this specific incident to one. Threema OnPrem customers (self-hosted instances) were unaffected. Threema confirms the incident affected only service availability, not system security or user data, and has since activated upstream DDoS filtering. The transferable point: attacking a provider's colocation/hosting partner directly, rather than only the application layer, sidesteps app-level DDoS mitigations that assume the attack surface is limited to the service's own edge.
    region_nexus: "Switzerland — home-region core nexus (Swiss messaging/telco infrastructure)"
    primary_sector_nexus: "indirect"
    sector: "telco"
    cves: []
    techniques: [T1498]
    affected_products: ["Threema"]
