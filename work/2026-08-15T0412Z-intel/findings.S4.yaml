    summary: |
      Brazil's Federal Police, supported by Germany's BKA, launched "Operation Klonen" (Operação Klonen) on 2026-08-13/14, executing 21 search-and-seizure warrants across seven Brazilian cities and arresting four suspects under preventive detention, while three further suspects face prosecution in Spain and Bulgaria. The case traces to November 2023: attackers exploited a software vulnerability introduced by a faulty update at a German bank's payment and transaction-processing service provider, enabling numerous unauthorized direct-debit withdrawals from German online banking accounts over a four-day window, with losses of roughly €30 million ($34.6M). Brazilian media identified the affected institution as Commerzbank, which confirmed to BleepingComputer that clients were impacted but that "there was no financial loss to customers" because the bank absorbed the fraud. Stolen funds were laundered through pass-through accounts, shell companies, payment institutions, virtual-asset platforms and payment cards issued without the account holders' consent, moved primarily to Brazil with a smaller share cashed out across four European countries; one arrested suspect used the proceeds to fund a 2024 political campaign. This is a supply-chain/vendor-risk lesson for the finance sector: the exploited weakness sat in the payment-processing service provider's software update, not in the bank's own systems.
