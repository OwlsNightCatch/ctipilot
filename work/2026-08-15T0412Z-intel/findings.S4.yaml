      Following the deliberate criminal intrusion at Polish EHR processor MyDr already tracked in this store, Poland's Deputy Prime Minister and Minister of Digital Affairs Krzysztof Gawkowski confirmed on 2026-08-12, after a Joint Cybersecurity Operations Center meeting, that the stolen database totals roughly 19 million people and over 2TB — calling it "one of the largest incidents in Poland's history" — moving the scale from MyDr's own hedged "cannot yet state what was taken" to an official government-confirmed figure. Poland's data protection authority (UODO) issued a public statement clarifying that the GDPR/RODO notification obligation to affected individuals rests with the individual healthcare-facility data controllers who used MyDr's processor services, not with MyDr itself, and that controllers must notify without undue delay (target: within 72 hours of discovering the breach) — the exact processor/controller structural gap the earlier entry identified, now regulator-documented rather than just journalist-observed. Zaufana Trzecia Strona additionally reports that MyDr, as a processor, cannot lawfully hand its data to NASK's national breach-checking portal (bezpiecznedane.gov.pl) without UODO authorization, meaning citizens cannot yet self-check exposure through that channel; a prosecutor could compel and forward the data via criminal procedure, which has not yet occurred. Officials state no indication of state-actor (e.g. Russian) involvement; financial motivation is assessed as more likely.
