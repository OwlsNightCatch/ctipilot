      Defender takeaway: the access path was credential theft of BOTH an internal staff account and an external "authorized third party" account (contractor/partner access into a government tax system) — not a software vulnerability. Detection class: authentication/session-log anomalies on privileged government-system accounts (impossible-travel, off-hours access, third-party/vendor account usage outside its normal scope) rather than a patchable CVE. Hardening lever: scope and time-box third-party/contractor access to government financial-data systems, and monitor for anomalous bulk data extraction from tax-record query interfaces. Fact/claim discipline matters here: the confirmed scope (678K) and the attacker's unconfirmed follow-on claim (2.04M cadastral records, MFA bypass, retained access) must not be conflated — DGFiP explicitly disputes the retained-access claim.
