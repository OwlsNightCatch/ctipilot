  - title: "French tax authority DGFiP confirms 678,000-record breach via stolen agent and third-party credentials — then the same attacker claims a second, unconfirmed cadastral-data intrusion"
    sources:
      - { url: "https://presse.economie.gouv.fr/acces-illegitime-au-systeme-dinformation-de-la-direction-generale-des-finances-publiques/", publisher: "Ministère de l'Économie et des Finances (French government)", date: "2026-08-14", role: "primary" }
