      - { url: "https://databreaches.net/2026/08/14/france-investigates-tax-authority-breach-after-hacker-claims-600000-victims/", publisher: "The Record (via DataBreaches.net)", date: "2026-08-14", role: "corroborating" }
      - { url: "https://cyberinsider.com/french-tax-agency-confirms-breach-as-hacker-claims-2-million-victims/", publisher: "CyberInsider", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net, URL https://databreaches.net/feed/ (item: France investigates tax authority breach after hacker claims 600,000 victims, 2026-08-14) → primary: Ministère de l'Économie et des Finances press release, URL https://presse.economie.gouv.fr/acces-illegitime-au-systeme-dinformation-de-la-direction-generale-des-finances-publiques/ → corroborating: The Register, URL https://www.theregister.com/security/2026/08/14/french_tax_authority_admits_data_heist_after_crook_touts_2m_records/5287885"
    summary: |
      France's Ministry of Economy and Finance confirmed on 2026-08-14 that an attacker gained unauthorized access to the Direction générale des Finances publiques (DGFiP, the national tax authority) information system, using stolen credentials belonging to a DGFiP agent and to an authorized third party ("usurpations d'identifiants d'un agent de la DGFIP et d'un tiers habilité") — a Trusted Relationship / Valid Accounts access path rather than a software exploit. The access window ran from an unstated start until it was detected and severed at the end of June 2026 during an internal audit; the government confirms extraction of data on 678,000 individuals and businesses, including tax reference income, family quotient, withholding rates, cadastral property data, and business SIREN identifiers. DGFiP notified CNIL immediately on discovery. The public disclosure was forced by an attacker using the alias "ZeroBytes", who advertised the stolen dataset on a cybercrime forum on 2026-08-12, additionally claiming an MFA-bypass technique and continued (retained) access to DGFiP systems — a claim the government explicitly disputes. Hours after the government's confirmation, ZeroBytes separately claimed a second, distinct compromise of a cadastral-registry service, asserting exfiltration of 252,149 lines representing roughly 2,041,778 people; this second claim is unconfirmed and not addressed in the government's statement, and no source has verified it independently. This is the latest in a recurring 2026 pattern of French government-system compromises (Éducation nationale, ANTS, Tchap messenger, France's secure-ID agency) each via distinct access paths.
