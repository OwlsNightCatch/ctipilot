  - title: "NHS Blood and Transplant sent transplant patients' medical data over an unencrypted 1980s pager network for years — BBC investigation forces disclosure"
    sources:
      - { url: "https://www.bbc.co.uk/news/articles/clyj92j210do", publisher: "BBC News", date: "2026-08-14", role: "primary" }
      - { url: "https://www.digit.fyi/nhsbt-data-breach/", publisher: "Digit.fyi", date: "2026-08-14", role: "corroborating" }
      - { url: "https://databreaches.net/2026/08/14/nhs-admits-data-breach-by-sending-patient-data-via-pagers/", publisher: "DataBreaches.net", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net, URL https://databreaches.net/feed/ (item: NHS admits data breach by sending patient data via pagers, 2026-08-14) → primary: BBC News investigation, URL https://www.bbc.co.uk/news/articles/clyj92j210do → corroborating: Digit.fyi, URL https://www.digit.fyi/nhsbt-data-breach/"
    summary: |
      A BBC investigation revealed that NHS Blood and Transplant (NHSBT), which coordinates organ transplants across the UK, routinely sent sensitive transplant-patient data over an unencrypted pager (POCSAG-class one-way radio broadcast) network to hospital transplant teams, unaware the channel lacked encryption. Transmitted data included organ-availability details, recipient names, dates of birth, tissue-match scores and immunosuppression risk factors (cRF). NHSBT acknowledged this constitutes a data breach only after the BBC alerted it, reported the incident to the UK Information Commissioner's Office, and has since stopped sending patient data via pagers. Because pager broadcasts are one-way and recipients cannot be tracked, NHSBT states it cannot determine whether the unencrypted transmissions were intercepted or by how many devices. Then-Health Secretary Matt Hancock ordered NHS England to stop using pagers by 2021, but parts of the organization continued. The BBC also found the pager network carried unencrypted messages beyond NHSBT — from North West Ambulance Service and Northern Ireland Ambulance Service, and other ambulance/fire-service traffic — including mental-health incident details, medication information, and a case referencing a suicide attempt, over a 10-day sample period. The paging-network operator states it provides encrypted paging and secure-messaging options, that deployment choice is the customer's, and that it has no visibility into transmitted content; it advises customers not to send sensitive data over radio.
    region_nexus: "United Kingdom — European neighbour, direct healthcare-sector relevance"
    primary_sector_nexus: "indirect"
    sector: "healthcare"
    cves: []
    techniques: [T1040]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:nhs-blood-transplant-pager-breach-2026-08", type: incident, name: "NHS Blood and Transplant unencrypted pager data exposure", aliases: ["NHSBT pager breach"], summary: "BBC investigation (2026-08-14) found NHS Blood and Transplant routinely sent transplant-patient medical data over an unencrypted legacy pager network; NHSBT confirmed the breach to the BBC and notified the ICO." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The sensitive medical data of transplant patients from across the UK was routinely sent over an unencrypted pager network, an NHS service has admitted."
        attribution: "BBC News"
        source_url: "https://www.bbc.co.uk/news/articles/clyj92j210do"
      - quote: "We accept it was a data breach... We were surprised that these messages were not encrypted, and that vulnerability was there."
        attribution: "Anthony Clarkson, Head of Organ Transplantation, NHS Blood and Transplant (to BBC)"
        source_url: "https://www.bbc.co.uk/news/articles/clyj92j210do"
      - quote: "Recipients of pager messages cannot be tracked, therefore NHSBT said it was unclear whether the unencrypted information was accessed or how many people may have been affected."
        attribution: "BBC News"
        source_url: "https://www.bbc.co.uk/news/articles/clyj92j210do"
    extended_notes: |
      Transferable lesson for any healthcare org still running legacy paging/telemetry infrastructure alongside modern IT: POCSAG-class pager broadcasts are plaintext, unauthenticated, one-way, and interceptable with commodity SDR hardware within the transmitter's broadcast radius (a whole building, or with enough gain a wider area) — there is no audit log of who received a message, so an org cannot retrospectively scope exposure the way it could for a logged system. Detection class: this isn't detectable after the fact via telemetry (no log exists); the actionable control is an asset inventory sweep for any surviving pager/legacy-radio channels carrying PII/PHI and migration to encrypted messaging, which is exactly the "legacy technology" caveat the UK Department for Health names as still requiring RODO/GDPR-equivalent secure handling.
    borderline: false

