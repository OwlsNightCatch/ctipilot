- title: Unauthenticated SQL injection in GeoServer's jsonArrayContains OGC filter is under active exploitation
    with no CVE and no patch yet
  sources:
  - url: https://security-hub.ncsc.admin.ch/#/posts/12844
    publisher: NCSC Switzerland (GovCERT.ch) — Cyber Security Hub
    date: '2026-08-14'
    role: primary
  - url: https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html
    publisher: The Hacker News
    date: '2026-08-13'
    role: corroborating
