    publisher: SecurityWeek
    date: '2026-08-14'
    role: corroborating
  - url: https://fieldeffect.com/blog/early-exploitation-attempts-observed-geoserver-zero-day
    publisher: Field Effect
    date: '2026-08-13'
    role: corroborating
  - url: https://github.com/geoserver/geoserver/security/advisories/GHSA-7g5f-wrx8-5ccf
    publisher: GeoServer / GitHub Security Advisories (historical fix reference, CVE-2023-25157)
    date: '2023-02-21'
    role: background
  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12844
    -> primary: The Hacker News, URL https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html
    -> corroborating: SecurityWeek, URL https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/
    -> corroborating: Field Effect, URL https://fieldeffect.com/blog/early-exploitation-attempts-observed-geoserver-zero-day
    -> background: GitHub GHSA-7g5f-wrx8-5ccf (2023 predecessor fix touching the same jsonArrayContains
    filter), URL https://github.com/geoserver/geoserver/security/advisories/GHSA-7g5f-wrx8-5ccf'
  summary: 'NCSC Switzerland''s Cyber Security Hub published an advisory on 2026-08-14 flagging active
    exploitation of an unpatched SQL-injection zero-day in GeoServer, the open-source geospatial data
    platform widely used by government, cantonal/communal and utility GIS and land-registry services.
    The flaw was first disclosed by researcher @q1uf3ng on X on 2026-08-12 and sits in the jsonArrayContains
    OGC filter expression (used by WFS/WMS/WCS query interfaces to test whether a JSON array field contains
    a value): user-supplied filter arguments are concatenated into the backend SQL query without adequate
    sanitisation, letting an unauthenticated remote attacker alter the query''s logic. GeoServer already
    fixed jsonArrayContains once, for PostGIS and Oracle DataStores, in CVE-2023-25157 (CVSS 9.8, 2023);
    this new zero-day is a fresh, unpatched bypass reachable in additional configurations, with reporting
    again naming PostGIS/Oracle JDBC stores and separately flagging H2-backed deployments (whose default
    administrative account is literally named ''sa'') as a path to full remote code execution via database-specific
    command-execution features — and, per NCSC-CH, potentially reachable via Microsoft SQL Server backends
    as well. No CVE has been assigned and no vendor patch exists as of publication. WatchTowr reports
    hundreds of scanning/probing requests from a small pool of source IPs beginning within hours of public
    disclosure, currently triggering database errors rather than confirmed compromise — but GeoServer
    has a documented history of exploitation at internet scale, including a 2024 breach of a U.S. federal
    agency via the earlier CVE-2024-36401.'
  region_nexus: global; GeoServer is commonly deployed by Swiss and EU government/cantonal/communal GIS,
    land-registry and utility-asset-mapping services — direct home-authority relevance via NCSC-CH's own
    advisory
  primary_sector_nexus: direct
  sector: public-sector, energy, water, transport
  cves: []
  techniques:
  - T1190
  affected_products:
  - GeoServer
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: 'Current exploitation status: Actively Exploited, Proof of Concept Available'
    attribution: NCSC Switzerland (GovCERT.ch) Cyber Security Hub
    source_url: https://security-hub.ncsc.admin.ch/#/posts/12844
  - quote: Within hours of public disclosure, we began observing exploitation attempts and have recorded
      hundreds of attempts originating from a small number of source IP addresses.
    attribution: watchTowr, via SecurityWeek
    source_url: https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/
  - quote: GeoServer jsonArrayContains unauthorized SQL injection, and in the case of the sa [system administrator]
      database, it's naturally possible to achieve RCE.
    attribution: researcher @q1uf3ng, via The Hacker News
    source_url: https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html
  extended_notes: 'No CVE/CVSS assigned as of this run — track for a follow-up entry once GeoServer/MITRE
    assigns an identifier and a patched version ships. Detection concept: unauthenticated WFS/WMS/WCS
    requests carrying jsonArrayContains filter expressions with SQL metacharacters or stacked-query syntax
    in the filter argument; database error-log spikes (syntax errors, unexpected type casts) on the GeoServer
    service account; for H2-backed deployments, unexpected OS process spawns from the Java process hosting
    GeoServer. Hardening: restrict GeoServer''s WFS/WMS/WCS endpoints from the open internet, disable
    jsonArrayContains-capable filters where not required, and if using H2, disable the H2 console/remote-command
    features. Benign lookalike: legitimate GIS clients constructing jsonArrayContains filters for normal
    attribute queries — the discriminator is malformed/oversized filter arguments containing quote characters
    or SQL keywords rather than well-formed JSON-path values.'
- title: Unauthenticated root-level OS command injection in Haiwell's internet-facing IoT HMI gateway
    (CVE-2026-19188, CVSS 10.0)
  sources:
  - url: https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-225-02.json
    publisher: CISA (ICS Advisory icsa-26-225-02, CSAF structured document)
    date: '2026-08-13'
    role: primary
  discovery_trace: 'first seen at: cisa-advisories (bridge cisa csaf-recent listing), URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/changes.csv
    -> primary: CISA ICS advisory icsa-26-225-02 CSAF document, URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-225-02.json
    (human-readable mirror at https://www.cisa.gov/news-events/ics-advisories/icsa-26-225-02, unreachable
    this run — jina reader pool exhausted, see coverage gap)'
  summary: 'CISA published ICS advisory icsa-26-225-02 on 2026-08-13 for a maximum-severity OS command
    injection (CWE-78) in the Haiwell IoT Cloud HMI Gateway, a China-headquartered vendor''s human-machine-interface/SCADA
    gateway product that CISA states is deployed worldwide across the energy, critical-manufacturing,
    and water-and-wastewater sectors. The flaw lives in the gateway''s Net Check diagnostic feature, reachable
    via the /setting endpoint: the cmdPing Socket.io event accepts a user-controlled argument and passes
    it unsanitised to the underlying OS shell, letting a remote, unauthenticated attacker inject and execute
    arbitrary OS commands with root privileges. CISA rates it CVSS v3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H)
    and CVSS v4.0 also full-severity (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H). The only
    affected version on record is 3.40.1.12; Haiwell has shipped a fix in Scada-v3.50.1.19. No exploitation
    has been confirmed yet, but the bug requires no authentication, no user interaction, and only network
    reachability to the management interface — an imminent-exploitation profile for any internet-exposed
    unit.'
  region_nexus: worldwide deployment per CISA; relevant wherever Swiss/EU energy, water or manufacturing
    operators use Haiwell IoT HMI gateways for remote SCADA access
  primary_sector_nexus: indirect
  sector: energy, water, critical manufacturing
  cves:
  - CVE-2026-19188
  techniques:
  - T1190
  affected_products:
  - Haiwell IoT Cloud HMI Gateway
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-NATIONAL-CERT
  confidence: HIGH
  novelty: new
  evidence:
  - quote: A critical OS command injection vulnerability has been identified in the Haiwell IoT Cloud
      HMI Gateway product. The vulnerability exists in the Net Check feature accessible via the /setting
      endpoint. The cmdPing Socket.io event fails to properly sanitize user-supplied input before passing
      it to the underlying operating system, allowing an attacker to inject and execute arbitrary OS commands
      with root privileges
    attribution: CISA (ICS advisory icsa-26-225-02)
    source_url: https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-225-02.json
  - quote: Successful exploitation of this vulnerability may allow an attacker to inject and execute arbitrary
      OS commands with root privileges.
    attribution: CISA (ICS advisory icsa-26-225-02)
    source_url: https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-225-02.json
  extended_notes: 'Detection concept: unauthenticated Socket.io connections to the gateway''s /setting
    endpoint invoking cmdPing with hostname/argument fields containing shell metacharacters (;, |, `,
    $()); unexpected root-owned child processes spawned by the Haiwell gateway service process; outbound
    connections initiated from the gateway process shortly after inbound Socket.io traffic. Hardening:
    apply Scada-v3.50.1.19; per CISA''s standard OT guidance, do not expose the gateway management interface
    to the internet, place it behind a firewall/VPN, and segment SCADA networks from business IT.'
- title: Fortinet patches an unauthenticated FortiWeb admin-console bypass and an FGFM device-impersonation
    flaw in FortiManager
  sources:
  - url: https://www.fortiguard.com/psirt/FG-IR-26-158
    publisher: Fortinet PSIRT (FG-IR-26-158)
    date: '2026-08-12'
    role: primary
  - url: https://www.fortiguard.com/psirt/FG-IR-26-157
    publisher: Fortinet PSIRT (FG-IR-26-157)
    date: '2026-08-12'
    role: primary
  - url: https://www.fortiguard.com/psirt/FG-IR-26-160
    publisher: Fortinet PSIRT (FG-IR-26-160)
    date: '2026-08-12'
    role: primary
  - url: https://advisories.ncsc.nl/rss/advisories
    publisher: NCSC-NL (advisories NCSC-2026-0300 FortiWeb, NCSC-2026-0299 FortiManager)
    date: '2026-08-13'
    role: corroborating
  - url: https://www.securityweek.com/fortinet-patches-authentication-flaws-in-fortiweb-and-fortimanager/
    publisher: SecurityWeek
    date: '2026-08-13'
    role: corroborating
  discovery_trace: 'first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0300/0299,
    published 2026-08-13) -> primary: Fortinet PSIRT, URL https://www.fortiguard.com/psirt/FG-IR-26-158
    and https://www.fortiguard.com/psirt/FG-IR-26-157 and https://www.fortiguard.com/psirt/FG-IR-26-160
    -> corroborating: SecurityWeek, URL https://www.securityweek.com/fortinet-patches-authentication-flaws-in-fortiweb-and-fortimanager/'
  summary: 'Fortinet published three PSIRT advisories on 2026-08-12, relayed by NCSC-NL on 2026-08-13.
    CVE-2026-26035 (CVSS 8.8, CWE-287 Improper Authentication, FG-IR-26-158) is a FortiWeb bug: when Remote
    RADIUS Type Admin authentication is configured with the non-default ''Wildcard'' option enabled, a
    remote unauthenticated attacker can log into the FortiWeb GUI/CLI with an arbitrary username and password.
    It affects FortiWeb 7.0.0-7.0.12, 7.2.0-7.2.12, 7.4.0-7.4.11, 7.6.0-7.6.6 and 8.0.0-8.0.2; fixed in
    7.2.13, 7.4.12, 7.6.7 and 8.0.3. CVE-2026-70466 (CVSS 4.8, CWE-184, FG-IR-26-157) is an incomplete-disallowed-input-list
    gap that lets an unauthenticated attacker bypass FortiWeb WAF policies via specially crafted requests;
    Fortinet shipped an interim virtual patch (FG-VD-10009598.0day, FMWP DB update 26.071) ahead of the
    code fix in 7.6.6/8.0.3, credited to researcher Rui Xi (@Cycloctane, Beijing University of Posts and
    Telecommunications). CVE-2026-70468 (CVSS 7.3, CWE-288, FG-IR-26-160) lets a remote unauthenticated
    attacker holding a valid certificate impersonate any FortiGate managed by a FortiManager instance
    that has the fgfm-peercert-withoutsn CLI option enabled, via crafted FGFM protocol requests — affecting
    FortiManager/FortiManager Cloud 7.2.5-7.2.9, 7.4.3-7.4.5 and 7.6.1, fixed in 7.2.10, 7.4.6 and 7.6.2
    (workaround: disable fgfm-peercert-withoutsn). Fortinet states none of the three is known to be exploited
    in the wild, but Fortinet edge products have a sustained recent history of rapid post-disclosure exploitation
    — this pipeline covered a Gunra ransomware FortiOS MFA-bypass backdoor abusing an unrelated FortiOS
    flaw on 2026-08-11 — so patching ahead of any public PoC is the operative recommendation.'
  region_nexus: global; FortiWeb/FortiManager are commonly deployed by Swiss/EU public-sector and critical-infrastructure
    operators for edge WAF and centralised firewall-fleet management
  primary_sector_nexus: indirect
  sector: public-sector, energy, finance, telco, healthcare
  cves:
  - CVE-2026-26035
  - CVE-2026-70466
  - CVE-2026-70468
  techniques:
  - T1190
  affected_products:
  - Fortinet FortiWeb
  - Fortinet FortiManager
  - Fortinet FortiManager Cloud
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: An Improper Authentication vulnerability [CWE-287] in the FortiWeb Remote Radius Type Admin
      Authentication configured with specific, non-default settings may allow a remote unauthenticated
      attacker to login into the Fortiweb GUI/CLI with a random username and password
    attribution: Fortinet PSIRT (FG-IR-26-158)
    source_url: https://www.fortiguard.com/psirt/FG-IR-26-158
  - quote: An incomplete list of disallowed inputs [CWE-184] in FortiWeb WAF may allow an unauthenticated
      attacker to bypass policies via specifically crafted requests.
    attribution: Fortinet PSIRT (FG-IR-26-157)
    source_url: https://www.fortiguard.com/psirt/FG-IR-26-157
  - quote: An Authentication Bypass Using an Alternate Path or Channel vulnerability in FortiManager and
      FortiManager Cloud may allow a remote unauthenticated attacker to impersonate any FortiGate managed
      by the FortiManager
    attribution: Fortinet PSIRT (FG-IR-26-160)
    source_url: https://www.fortiguard.com/psirt/FG-IR-26-160
  extended_notes: 'Detection concept: FortiWeb admin-login events (auth logs) succeeding against RADIUS-configured
    accounts with usernames not present in the RADIUS server''s known account list; FGFM protocol session
    establishments to a FortiManager from a source presenting a valid-but-unexpected client certificate
    serial. Hardening: disable the RADIUS ''Wildcard'' admin option on FortiWeb unless required and upgrade;
    disable fgfm-peercert-withoutsn on FortiManager; apply the FMWP virtual patch immediately, then upgrade
    to the fixed FortiWeb build.'
