  discovery_trace: 'first seen at: cisa-advisories (bridge cisa csaf-recent listing), URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/changes.csv
    -> primary: CISA ICS advisory icsa-26-225-05 CSAF document, URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-225-05.json'
  summary: 'CISA published icsa-26-225-05 on 2026-08-13 for four vulnerabilities in ANDRITZ HIPASE-250
    (formerly 250 SCALA), an energy-sector process-control HMI, affecting versions <=7.20. CVE-2026-65309
    (CVSS 7.5) stores and transmits user passwords in a reversible format instead of a one-way hash. CVE-2026-65310
    (CVSS 7.5) exposes the device''s data/configuration endpoint with no authentication and permissive
    CORS in its default configuration. CVE-2026-65311 (CVSS 5.3) exposes an undocumented HTTP endpoint
    that changes the server''s logging level/target without authentication. CVE-2026-65313 (CVSS 8.1,
    CWE-798) is the most operationally significant: the provisioning script used when installing HIPASE-250
    engineering workstations sets a fixed, hard-coded x11vnc password identical across every deployed
    workstation, so recovering one customer''s credential compromises all of them. ANDRITZ fixed all four
    in V8.00.00 (released 2024-12) and V8.15.00 (released 2026-07) — the fixes substantially predate this
    CISA disclosure, meaning any operator still on <=7.20 has been running exposed for an extended period.
    No exploitation has been reported.'
