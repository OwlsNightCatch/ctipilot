- title: GitLab patches a path-traversal RCE in its package registry and a CI/CD pipeline authorization
    bypass, plus 12 other flaws
  sources:
  - url: https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-2-released/
    publisher: GitLab (official patch-release notes, 19.2.2/19.1.4/19.0.6)
    date: '2026-08-12'
    role: primary
  - url: https://advisories.ncsc.nl/rss/advisories
    publisher: NCSC-NL (advisory NCSC-2026-0297)
    date: '2026-08-13'
    role: corroborating
  discovery_trace: 'first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0297,
    published 2026-08-13) -> primary: GitLab official patch-release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-2-released/'
  summary: 'GitLab shipped 19.2.2, 19.1.4 and 19.0.6 on 2026-08-12 (relayed by NCSC-NL on 2026-08-13),
    fixing 14 vulnerabilities across Community and Enterprise Edition. The standout is CVE-2026-10053
    (CVSS 8.5): an authenticated user can achieve remote code execution via a path-traversal flaw in the
    package registry, affecting installations from 18.8 onward. CVE-2026-15423 (CVSS 8.5) lets a lower-privileged
    developer run a CI/CD pipeline on a protected branch without the push permission normally required
    to do so, via an authorization gap in the pipeline API. Two stored-XSS bugs in Analytics Dashboards
    — CVE-2026-15217 and CVE-2026-15216 (both CVSS 8.7) — round out the high-severity set, alongside an
    EE-only Duo Workflow Service authorization bypass (CVE-2026-19228, CVSS 8.5) and a CI manual-job-confirmation-modal
    XSS (CVE-2026-16627, CVSS 7.7). The remaining CVEs are medium/low-severity missing-authorization or
    incorrect-authorization gaps in the merge-request, external-status-check, npm dist-tag and GitLab
    Duo settings APIs (CVSS 3.3-5.3). GitLab.com is already patched and GitLab Dedicated customers need
    no action; self-managed CE/EE instances must apply the update directly. No exploitation has been reported
    for any of the 14 CVEs.'
