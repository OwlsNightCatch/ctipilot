  discovery_trace: 'first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0301,
    published 2026-08-14) -> primary: IBM Support security bulletins, URL https://www.ibm.com/support/pages/node/7283282
    (CVE-2026-16860), https://www.ibm.com/support/pages/security-bulletin-ibm-i-affected-multiple-vulnerabilities-debug-server
    (Debug Server bundle), https://www.ibm.com/support/pages/node/7283289 (SQL bundle)'
  summary: 'NCSC-NL relayed IBM''s IBM i security-bulletin batch on 2026-08-14 (NCSC-2026-0301). The standout
    is CVE-2026-16860 (CVSS 9.9, CWE-427 Uncontrolled Search Path Element): a remote authenticated attacker
    can achieve arbitrary code execution because IBM i resolves a search-path element without adequate
    control, giving a lower-privileged authenticated session a path/library-hijack primitive with full-compromise
    impact (CVSS vector AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:L). It affects IBM i 7.3, 7.4, 7.5 and 7.6;
    fixed via PTFs SJ10882 (7.3), SJ10881 (7.4), SJ10880 (7.5) and SJ10879 (7.6). In the same cycle IBM
    shipped a five-CVE Debug Server bundle: CVE-2026-17083 (CVSS 9.8, stack-based buffer overflow, unauthenticated
    RCE), CVE-2026-17082 (8.8, improper validation leading to privilege escalation), CVE-2026-16907 (7.6,
    bounds-check bypass, authenticated RCE), CVE-2026-17271 (7.5, improper input validation DoS) and CVE-2026-17248
    (7.1, OS command injection DoS) — plus a separate seven-CVE SQL bundle (CVE-2026-17109, -17110, -17111,
    -17222, -17418, -17419, -17420) covering SQL injection and privilege-management flaws, and a standalone
    CVE-2026-6936 (6.5, uncontrolled recursion DoS in the Integrated Language Environment compiler). No
    exploitation has been reported for any of these; the co-occurrence of two CVSS >=9.8 remote/authenticated
    RCE bugs in a single release makes this a priority patch cycle for the platform.'
  region_nexus: global; IBM i (AS/400-lineage midrange systems) remains in production at some European
    finance and public-sector back-office operations
