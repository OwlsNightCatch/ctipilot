  summary: CISA published icsa-26-225-14 on 2026-08-13 for CVE-2026-34491 (CVSS 8.0, CWE-79), a persistent
    cross-site-scripting flaw in the Johnson Controls Metasys building-automation-system web UI. CISA
    names Critical Manufacturing, Commercial Facilities, Government Services and Facilities, Transportation
    Systems and Energy as the affected critical-infrastructure sectors — Metasys is widely deployed as
    the HVAC/building-automation controller in government office buildings. A low-privilege user can inject
    a crafted URL-borne XSS payload that persists across logins and executes in the context of any user,
    including administrators, who subsequently views the affected page. Metasys 15.0 was already patched
    on 2026-03-25 and Metasys 16.0 was never affected; Metasys 14.1.5 had a fix forecast for 2026-07-15.
    Metasys 12 and 13 are end-of-support and will NOT receive a fix at all — Johnson Controls' only guidance
    for those versions is compensating network controls (restrict the Metasys UI to trusted networks,
    segment building-automation systems from the corporate IT network, put a WAF in front of the UI, apply
    CSP/security headers, monitor UI access logs for suspicious URL patterns). Metasys 11 and earlier
    are unaffected (the bug was introduced at version 12).
