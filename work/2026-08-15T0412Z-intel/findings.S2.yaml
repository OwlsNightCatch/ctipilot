    evidence:
      - quote: "During signature canonicalization, earlier versions of the NetScaler solution copy attacker-controlled data from the SAML message's ds:SignedInfo element into a fixed-size global buffer, without checking whether it actually fits."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/"
      - quote: "This vulnerability is reachable when the Netscaler appliance is configured to use SAML as either a Service Provider (SP) or an Identity Provider (IdP)."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/"
      - quote: "Update 14.08.2026 A new technical analysis, likely related to CVE-2026-8452, was published by Watchtowr"
        attribution: "NCSC-CH Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12739"
    extended_notes: |
      Citrix's own advisory (CTX696604) describes CVE-2026-8452 as "Memory overflow vulnerability leading to
      unpredictable or erroneous behavior and Denial of Service" with precondition "Gateway (SSL VPN, ICA Proxy,
      CVPN, RDP Proxy) or AAA virtual server" (CVSS 8.8) — I could not fetch this Citrix page directly (it is a
      JS-only SPA shell; the jina reader pool was exhausted for this whole run — every key returned HTTP 402
      "balance exhausted" — so I could not force the reader fallback either). I corroborated the CVE/version/
      precondition data via Kraft Kennedy's advisory recap instead. Flag for the operator: consider a dedicated
      Citrix support.citrix.com KB bridge recipe (structured endpoint or a cached-mirror workaround), since this
      SPA pattern will recur on every future Citrix advisory.
      Detection concept (telemetry class → anchor): monitor SAML authentication endpoint request logs (AAA
      vserver / Gateway login) for anomalously long InclusiveNamespaces PrefixList / SignedInfo XML attribute
      values in inbound SAML AuthnRequest/Response bodies; watch for unexpected nsppe process restarts or core
      dumps correlated with SAML auth attempts (a plausible failed-exploitation signal); if any host-level
      telemetry is available on the appliance, a spawned /bin/sh or unexpected child process from the packet-
      processing engine is a strong post-exploitation indicator (NetScaler itself never spawns a shell in normal
      operation). Hardening: confirm every NetScaler instance is on 14.1-72.61 / 13.1-63.18 or later; where patch
      level cannot be immediately confirmed, restrict or disable external unauthenticated exposure of the AAA/
      Gateway SAML endpoint until verified.
      This is a vulnerability-class finding surfaced through the home-region CERT's own advisory feed (per this
      run's explicit instruction to check `ncsc-csh recent 20`) — it may also be picked up independently by the
      S1 (active threats & trending vulns) sub-agent from the same run; flagging for composer awareness in case
      of cross-domain overlap.
