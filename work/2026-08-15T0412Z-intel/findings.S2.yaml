  - title: "watchTowr shows a Citrix NetScaler bug Citrix rated 'DoS' is actually pre-auth RCE (CVE-2026-8452) — NCSC-CH updates its live advisory the same day"
    sources:
      - { url: "https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/", publisher: "watchTowr Labs", date: "2026-08-14", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12739", publisher: "NCSC-CH Cyber Security Hub", date: "2026-08-14", role: "primary" }
      - { url: "https://www.kraftkennedy.com/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-8451-cve-2026-8452-cve-2026-8655-cve-2026-10816-cve-2026-10817-and-cve-2026-13474/", publisher: "Kraft Kennedy (Citrix advisory CTX696604 recap)", date: "2026-06-30", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-csh (NCSC-CH Cyber Security Hub bridge, `python3 tools/fetch_source.py ncsc-csh recent 20`), URL https://security-hub.ncsc.admin.ch/#/posts/12739 (advisory originally published 2026-07-03, updated 2026-08-14 with 'A new technical analysis, likely related to CVE-2026-8452, was published by Watchtowr') → primary: watchTowr Labs, URL https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/ → corroborating: Citrix's own advisory CTX696604 (JS-rendered SPA, unreadable directly this run — jina reader pool exhausted; content confirmed instead via Kraft Kennedy's advisory recap), URL https://www.kraftkennedy.com/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-8451-cve-2026-8452-cve-2026-8655-cve-2026-10816-cve-2026-10817-and-cve-2026-13474/"
    summary: |
      On 14 August 2026 watchTowr Labs published research showing that CVE-2026-8452 — a NetScaler ADC/Gateway
      flaw Citrix rated CVSS 8.8 and classified only as a memory-overflow Denial-of-Service when it patched the
      bug alongside the sibling flaw CVE-2026-8451 (SAML IdP memory disclosure) in its June/July 2026 release —
      is in fact exploitable as unauthenticated remote code execution. Root cause: a heap buffer overflow during
      SAML signature canonicalization. The nsppe packet-processing binary copies the attacker-controlled
      PrefixList attribute of the InclusiveNamespaces element inside a SAML ds:SignedInfo block into a
      fixed-size global buffer without a bounds check; an oversized PrefixList overflows into adjacent heap
      allocator-metadata and corrupts a data pointer that is later dereferenced by memcpy, giving a
      write-what-where primitive. Because the NetScaler heap segment is executable and lacks standard memory
      protections, watchTowr chained this into shellcode execution on the RWX heap, deployed a PHP webshell,
      neutralised the crash-triggered-reboot signal handler, and obtained a SUID /bin/sh for root — entirely
      pre-authentication. Exploitation requires only that the appliance is configured as a Gateway (SSL VPN,
      ICA Proxy, CVPN, RDP Proxy) or an AAA virtual server handling SAML SP/IdP authentication — a very common
      configuration for Swiss and European government and enterprise remote-access deployments. Affected:
      NetScaler ADC/Gateway 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18; both are already fixed in the
      same release that patched CVE-2026-8451 (which was itself reported as actively exploited immediately
      after its own disclosure — per NCSC-CH's original 3 July 2026 advisory). No in-the-wild exploitation of
      the RCE chain specifically has been reported as of this research's publication. NCSC-CH's Cyber Security
      Hub — the home-region authority's own advisory for these CVEs — was updated on 14 August 2026 to cite
      watchTowr's new finding. The operational point for defenders: instances that installed the June/July
      patch are already protected against this chain, but organisations that triaged CVE-2026-8452 as "just a
      DoS" and deprioritised it now have concrete evidence the underlying bug was pre-auth RCE all along —
      patch-verification sweeps should not rely on the original vendor severity label alone.
    region_nexus: "global vulnerability; NetScaler Gateway/AAA vserver SAML authentication is a common remote-access configuration in Swiss and European government and enterprise networks; flagged in-window by NCSC-CH's own Cyber Security Hub advisory"
    primary_sector_nexus: "direct (public-sector and CI remote-access infrastructure commonly uses NetScaler Gateway)"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
