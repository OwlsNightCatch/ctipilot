  - title: "Unpatched GeoServer SQL-injection zero-day under active exploitation within hours of disclosure — no CVE, no vendor fix; widely used in European government geoportals"
    sources:
      - { url: "https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/", publisher: "SecurityWeek", date: "2026-08-14", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html", publisher: "The Hacker News", date: "2026-08-13", role: "corroborating" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12844", publisher: "NCSC-CH Cyber Security Hub", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-csh (NCSC-CH Cyber Security Hub bridge, `python3 tools/fetch_source.py ncsc-csh recent 20`), URL https://security-hub.ncsc.admin.ch/#/posts/12844 → primary: SecurityWeek, URL https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html (both citing the original disclosure at https://x.com/q1uf3ng/status/2087490992723407096)"
    summary: |
      NCSC-CH's Cyber Security Hub flagged an unpatched GeoServer zero-day on 14 August 2026: an unauthenticated
      SQL injection in the jsonArrayContains filter function (an OGC Filter/CQL expression used to test whether
      a JSON array field contains a given value) that fails to sanitise user-supplied arguments before they are
      encoded into backend database queries. On GeoServer instances backed by PostGIS or Oracle JDBC data
      stores, the injection can escalate to arbitrary SQL execution and — per watchTowr's Jake Knott, quoted by
      The Hacker News — to remote code execution under certain database configurations (e.g. an administrator-
      privileged database account, reachable via H2/other embedded-DB deployments). The flaw was first publicly
      disclosed by researcher @q1uf3ng on X on 12 August 2026 at 10:46 UTC, with an alleged PoC posted to
      GitHub; exploitation attempts began within hours, and SecurityWeek/The Hacker News (citing a threat-
      intelligence/exposure-management vendor) recorded hundreds of scanning/exploitation attempts from a small
      pool of source IP addresses by 13-14 August. No CVE has been assigned and no vendor (OSGeo) patch is
      available as of publication. GeoServer has a documented history of KEV-listed flaws (e.g. CVE-2024-36401),
      fitting a recurring targeting pattern for the platform. GeoServer underpins many European government
      geoportals and INSPIRE-Directive spatial-data infrastructure — municipal/cantonal GIS, land-registry and
      environmental-agency mapping services commonly run on it — giving this zero-day direct relevance to Swiss
      and EU public-sector operators even though no CH/EU victim has been named publicly.
    region_nexus: "global zero-day; GeoServer is widely deployed by European government geoportals and INSPIRE-Directive spatial-data infrastructure (municipal/cantonal GIS, land-registry, environmental agencies)"
    primary_sector_nexus: "direct (public-sector GIS/geoportal infrastructure)"
