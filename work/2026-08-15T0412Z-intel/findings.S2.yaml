        attribution: "SecurityWeek (citing a threat-intelligence vendor)"
        source_url: "https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/"
      - quote: "With no patch currently available and exploitation already underway, organizations running GeoServer should take this vulnerability seriously"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/hackers-exploiting-unpatched-geoserver-zero-day/"
      - quote: "This latest vulnerability could ultimately lead to remote code execution"
        attribution: "Jake Knott, watchTowr (via The Hacker News)"
        source_url: "https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html"
    extended_notes: |
      Detection concept: monitor GeoServer WFS/WMS access logs (and any reverse proxy in front of it) for
      jsonArrayContains parameters inside incoming OGC Filter/CQL expressions containing SQL metacharacters or
      unusually long/structured payloads; on the PostGIS/Oracle backend, watch for anomalous queries issued
      from the GeoServer service account outside expected filter syntax; process-creation telemetry on the
      GeoServer host for any child process spawned from the Java/Tomcat/Jetty process running GeoServer is a
      strong RCE indicator (GeoServer itself should never spawn a shell). Hardening: no vendor patch exists yet
      — restrict/firewall public exposure of GeoServer WFS/WMS and admin endpoints, disable the
      jsonArrayContains-capable filter functionality where not operationally required, and monitor OSGeo's
      advisory channel for a fix.
      Confidence set to MEDIUM rather than HIGH: no CVE assigned, disclosure originates from a single
      researcher's X/Twitter post with an alleged (unverified by me) PoC, and "hundreds of attempts" is
      vendor-sourced telemetry relayed through the press rather than a primary vendor/CERT confirmation.
      Same cross-domain-overlap caveat as the NetScaler item above: sourced via NCSC-CH's advisory feed per
      this run's explicit instruction, but content sits mostly in S1's vulnerability-tracking lane.
    borderline: true
    borderline_reason: "vulnerability-class item, no CVE yet, single-researcher disclosure; included for its home-authority sourcing and active-exploitation-with-no-patch profile, but may duplicate an S1 finding this run."

