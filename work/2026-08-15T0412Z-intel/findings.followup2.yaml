      pipeline has two adjacent entries in the last 7 days: 2026-08-06
      "litellm-callback-hook-post-inference-tool-call-forgery" (different LiteLLM technique, gateway-admin
      abuse of callback hooks — unrelated mechanism, same product) and 2026-08-08
      "wiz-cloud-threat-highlights-h1-2026-ai-toolchain-exposure" (names LiteLLM's four H1-2026 security
      events and entity actor:teampcp). Cross-reference both by id in the composed entry's body/`references`
      rather than `update_of`, since neither covered the 2,500-org/Trivy-attribution claim specifically.

      CVE bookkeeping flag for the main agent / next quality audit: NVD's CVE-2026-33634 record (confirmed
      directly on nvd.nist.gov, quoted above) unambiguously describes the Trivy/trivy-action/setup-trivy/
      LiteLLM ecosystem compromise, with CPE ranges for aquasec:trivy 0.69.4, aquasec:trivy_action (<0.35.0),
      aquasec:setup-trivy (<0.2.6), litellm:litellm 1.82.7/1.82.8, and telnyx:telnyx 4.87.1/4.87.2 (the wider
      TeamPCP campaign also hit the Telnyx Python SDK per SOCRadar). However, `state/cves_seen.json` currently
      has CVE-2026-33634 attached to a DIFFERENT prior entry: "Checkmarx Jenkins AST plugin backdoor
      (TeamPCP/UNC6780 supply-chain compromise, SANDCLOCK credential stealer, CVSS 9.4)", first_seen
      2026-05-12, primary_source_url checkmarx.com/blog/ongoing-security-updates/. Checkmarx's Jenkins AST
      plugin is NOT in CVE-2026-33634's NVD CPE configuration list, so this looks like a mis-citation in the
      2026-05-12 entry (possibly the correct CVE for the Checkmarx incident was a different, unassigned-at-the-time
      identifier, or a citation slip) rather than a legitimate dual-use of the same CVE id — worth a
      quality-audit look, not something to silently fix here. Do not let this cause the current, verified
      citation of CVE-2026-33634 (for the Trivy/LiteLLM ecosystem compromise, which is what NVD's own
      description says the CVE covers) to be treated as a duplicate of the Checkmarx story — they are
      different incidents.

