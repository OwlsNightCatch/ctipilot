    summary: |
      The claim holds and is strongly corroborated. SOCRadar published a row-level re-analysis (2026-08-13,
      picked up by SecurityWeek 2026-08-14) of the leaked exposure dataset behind the widely reported
      "2,500+ organization LiteLLM supply-chain breach." Of 2,188 organization records carrying attributable
      identifiers (the 2,500+ headline figure includes records without them), 2,085 — 95% — show data-collection
      activity that ended *before* March 24, 2026, the day TeamPCP's two poisoned litellm==1.82.7/1.82.8 PyPI
      releases went live (10:39–~11:19 UTC, roughly 40 minutes). The earliest collection record in the dataset
      is timestamped March 19 at 18:05 UTC — 18 minutes after Aqua Security's own advisory places the
      malicious Trivy v0.69.4 build's publication at 17:47 UTC (force-push of 76/77 trivy-action tags and all
      7 setup-trivy tags began at 17:43). A second activity surge tracks March 22 15:43 UTC to March 23
      01:40 UTC, exactly the window Docker's own blog gives for malicious Trivy images tagged 0.69.5/0.69.6
      being live on Docker Hub. The dataset's final record, March 24 20:09 UTC, sits ~9 hours after PyPI
      quarantined the LiteLLM packages — SOCRadar reads this as the .pth persistence payload continuing to
      run on already-infected hosts after the infection source was gone, not new compromise activity.
      Root cause, confirmed independently by the vendor: Aqua Security's own incident advisory (updated
      through 2026-04-01) states a threat actor exploited a `pull_request_target` misconfiguration in Trivy's
      GitHub Actions workflows in late February 2026, stole a privileged PAT, and — after Aqua's March 1
      credential rotation turned out to be non-atomic and left residual access — used surviving access on
      March 19 to force-push 76 of 77 `aquasecurity/trivy-action` version tags and all 7 `aquasecurity/setup-trivy`
      tags to malicious commits (GitHub's "Immutable release" badge did not prevent this; only full-commit-SHA
      pinning does), while simultaneously building and publishing a backdoored Trivy v0.69.4 binary/image.
      LiteLLM's own CI pipeline pulled Trivy unpinned as a security-scanning dependency; the poisoned scanner
      flowed into LiteLLM's build automatically. LiteLLM/BerriAI's own security-update post (2026-03-27,
      last updated) confirms this upstream link and states the attacker then bypassed LiteLLM's normal
      release workflow and uploaded the two malicious PyPI packages directly, via a suspected-compromised
      maintainer PyPI account. The ecosystem compromise (Trivy binary + trivy-action + setup-trivy, and the
      two malicious LiteLLM PyPI releases that resulted from it) is tracked as CVE-2026-33634, CVSS v4.0 9.4,
      added to CISA's KEV catalog on 2026-03-26 per SOCRadar and NVD. There is no separate CVE for the LiteLLM
      package poisoning itself — NVD's CVE-2026-33634 record already spans the `aquasecurity/trivy`,
      `aquasecurity/trivy-action`, `aquasecurity/setup-trivy`, and `litellm` (1.82.7/1.82.8) product ranges
      as one ecosystem-compromise record; SOCRadar explicitly notes this is unrelated to a separate June-2026
      LiteLLM authentication-bypass RCE (CVE-2026-48710/CVE-2026-42271, a Starlette Host-header issue), which
      should not be confused with this supply-chain incident.
      A concrete, independent confirmation of impact beyond the reconstructed exposure dataset: CERT-EU's own
      incident blog states the European Commission's "europa.eu" AWS-hosted web platform was compromised via
      this exact vector — a threat actor "acquired an Amazon Web Services (AWS) secret (an API key) on
      March 19 through the Trivy supply chain compromise," used TruffleHog for follow-on secret discovery,
      and exfiltrated ~91.7 GB (340 GB uncompressed) of data later published by ShinyHunters on its leak site,
      affecting at least 29 other EU Union entities beyond the Commission's own 42 internal clients. CERT-EU
      assesses this with high confidence based on timing, targeted-resource match, and confirmed use of a
      compromised Trivy version. This is the clearest concrete evidence that the upstream Trivy compromise —
      not the 40-minute LiteLLM PyPI window — is what actually mattered for blast radius, and it lands squarely
      in this constituency's core (an EU-level public institution).
      Defender correction: an organization that audited only "did we run litellm==1.82.7/1.82.8 on
      2026-03-24" believes it is clear. The corrected finding says that check is necessary but not sufficient.
      The audit surface that actually matters is (1) any use of `aquasecurity/trivy-action` or
      `aquasecurity/setup-trivy` referenced by mutable version tag rather than pinned commit SHA between
      2026-02-27 and 2026-03-20; (2) any pull of `aquasec/trivy` Docker Hub images tagged `0.69.4`, `0.69.5`,
      `0.69.6`, or `latest` between 2026-03-19 18:24 UTC and 2026-03-23 01:36 UTC (Docker's own confirmed
      window); and (3) treating every credential reachable by an affected CI/CD runner — cloud IMDS-issued
      keys, SSH/Kubernetes/service-account tokens, package-publishing tokens (npm, PyPI, container registries),
      and application/database secrets — as exposed from the Trivy stage onward, not just from the LiteLLM
      stage. SOCRadar and Aqua both explicitly warn that pinning to a mutable tag, even one carrying GitHub's
      "Immutable" release badge, was not a control here; only full-commit-SHA pinning holds.
