  item: "2026-08-15/fortiweb-radius-wildcard-bypass-fortimanager-fgfm"
  url_or_quote: "Fortinet offers a virtual patch through its intrusion-prevention database in the interim."
  summary: "FG-IR-26-157's rendered advisory states: 'Virtual Patch named \"FG-VD-10009598.0day.\" is available in FMWP db update 26.071.' FMWP is FortiWeb's own signature database, not Fortinet's intrusion-prevention database (a separate service), and the concrete lever a defender would act on — the FMWP db version 26.071 — dropped out of the sentence. Naming the database and the version would make the mitigation actionable for the three branches that have no fixed build."
