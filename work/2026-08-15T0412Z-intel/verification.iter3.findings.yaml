  item: "2026-08-15/geoserver-jsonarraycontains-unauth-sqli-zeroday-exploited"
  url_or_quote: "summary: 'is under active exploitation'; body: 'attackers began exploiting it the same day'"
  summary: "Two cited sources qualify the observed activity in a way the entry never relays. The Hacker News quotes watchTowr's Jake Knott directly: 'Currently, we're seeing attackers probe to identify vulnerable systems across the internet, triggering errors and not proceeding further.' Field Effect states 'The observed activity consisted primarily of scanning and probing for vulnerable systems. Public reporting has not described confirmed compromises associated with this vulnerability as of August 13, 2026.' SecurityWeek carries the same ('no follow-up activity has been observed'). One clause distinguishing mass probing from confirmed compromise materially changes how a reader triages an unpatchable exposure."
