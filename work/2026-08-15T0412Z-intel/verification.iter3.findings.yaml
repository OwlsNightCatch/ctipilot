  summary: "NetScaler's own CVE records for both CVE-2026-8452 and CVE-2026-8451 additionally list '14.1 FIPS' before 72.61 and '13.1 FIPS and NDcPP' before 37.272 as affected. A FIPS/NDcPP appliance — a plausible build in a Swiss federal or critical-infrastructure estate — has a different fixed build (13.1-37.272), so the deep dive's verify-your-version action gives that operator a version boundary that does not exist for their train. Add the FIPS/NDcPP builds to the affected/fixed strings."
