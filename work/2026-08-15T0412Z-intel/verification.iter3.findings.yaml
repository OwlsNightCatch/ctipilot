  item: "Supply-chain scope correction: Trivy, not LiteLLM, behind the 2,500-organisation compromise"
  url_or_quote: "https://www.securityweek.com/trivy-not-litellm-behind-the-2500-org-compromise/ (datePublished 2026-08-14T11:35:23Z)"
  summary: "In-window (2026-08-14) and unaddressed in both the run record's coverage-gaps list and triage.json's drop list. SOCRadar's re-analysis of the per-organisation records finds 2,085 of 2,188 identified organisations (95%) had credential collection end before the poisoned LiteLLM packages were published, tracing them instead to the upstream Aqua Security Trivy build compromise on Docker Hub; earliest collection 18 minutes after the malicious Trivy build went live. This pipeline has carried LiteLLM twice in-window-adjacent (2026-08-06, 2026-08-08) and the correction changes which tool a CI/CD estate must audit. Suggested query: 'SOCRadar Trivy LiteLLM 2500 organizations TeamPCP March 2026 compromise timeline'."
- code: F9
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "2026-08-15/fortiweb-radius-wildcard-bypass-fortimanager-fgfm — sourcing note on CVE-2026-70465"
  url_or_quote: "sourcing_note: 'the NVD entry for the same flaw carries a higher base score, and the assigning authority's number is the one that travels with the CVE'"
  summary: "Advisory only — the note is not false but implies a scoring disagreement where there is none. NVD's 8.1 for CVE-2026-70465 is sourced to psirt@fortinet.com with vector CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H — Fortinet's own base vector. Fortinet's 7.3 is that same vector with the temporal metrics E:P/RL:O/RC:C applied. Saying so in one clause ('7.3 is Fortinet's temporal-adjusted score for the same 8.1 base vector') would stop a reader concluding the two authorities scored the flaw differently."
