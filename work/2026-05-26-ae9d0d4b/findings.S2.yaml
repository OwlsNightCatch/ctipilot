items:
  - title: "GTIG: Chinese-language PhaaS platforms now delivering OTP-relay MFA bypass via RCS/iMessage — EU-reaching scale confirmed, Japan primary target"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/"
        publisher: "Google Threat Intelligence Group (Mandiant)"
        date: "2026-05-25"
        role: "primary"
    discovery_trace: "first seen at: mandiant-gtig feed (https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v), published 2026-05-25 → primary: GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/"
    summary: |
      Google Threat Intelligence Group published 25 May 2026 a detailed analysis of at least 13 Chinese-language phishing-as-a-service (PhaaS) platforms, with a case study on "YY Lai Yu" (YY来鱼). Core capability shared across platforms: real-time OTP relay using live admin panels that intercept one-time passcodes the victim enters and simultaneously trigger an OTP request on the attacker's device — a full adversary-in-the-middle MFA bypass without requiring a reverse-proxy infrastructure. Delivery now exploits RCS (Rich Communication Services) and iMessage because end-to-end encryption on both protocols bypasses carrier-level SMS filtering, rendering telco-level defences ineffective. AI-powered page generation (Puppeteer-driven site cloning) produces per-campaign unique HTML/JS to defeat signature-based phishing detection. The kits also support digital wallet tokenization: stolen card credentials + intercepted OTP are used to provision contactless payment tokens for high-value transactions and ATM withdrawals. Geographic targeting spans 119 countries; the Europe, Americas, Australia, and Middle East are explicitly listed as targeted regions. While primary template coverage is Japan-focused (400+ financial/rail/gaming templates), the infrastructure is generic and operators rent it to any buyer — GTIG observed capabilities being used against non-Chinese organizations globally. UNC5814 is linked to the Darcula PhaaS platform in this ecosystem. Defenders relying on TOTP/SMS-based MFA as the sole second factor are not protected against these kits; FIDO2/WebAuthn hardware tokens or phishing-resistant passkeys are the recommended countermeasure. Risk-based step-up authentication during card provisioning events and device-fingerprint checks by issuing banks reduce wallet-tokenization exposure.
    ch_eu_nexus: "Europe explicitly listed as targeted region; infrastructure generic — any European financial, public-sector portal, or e-government service protected only by TOTP/SMS MFA is in scope"
    public_sector_nexus: "indirect — PhaaS kits target credential+OTP for web portals; Swiss/EU e-government single sign-on portals (e.g. eIAM, AHV ID) and financial regulators are target archetypes"
    sector: "finance, government, retail"
    cves: []
    actors_campaigns_malware:
      - "UNC5814"
      - "YY Lai Yu (YY来鱼)"
      - "Darcula PhaaS"
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Real-time interception allows the actor to simultaneously enter the OTP into a spoof page on their device, enabling them to complete the authentication process before the OTP expires."
        attribution: "Google Threat Intelligence Group (Mandiant)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/"
      - quote: "Darcula PhaaS leverages RCS and iMessage to send smishing messages because end-to-end encryption prevents carrier-level filtering of content."
        attribution: "Google Threat Intelligence Group (Mandiant)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/chinese-language-phishing-services/"
    extended_notes: |
      Detection angle: outbound connections from browser to unexpected domains during active authentication flows (MITM proxy C2); anomalous OTP consumption patterns (OTP used immediately after issuance, from a different ASN than the login session); contactless-payment provisioning events immediately after credential submission from an unrecognized device. Hunt: correlate OIDC/SAML session IP against prior session IP — an AiTM relay will show the victim's original IP on the phishing page but the attacker's IP on the SSO side. Hardening: FIDO2 WebAuthn removes OTP relay risk entirely; for environments that cannot deploy FIDO2, enforce session-bound MFA (login-session binding) so OTP cannot be replayed from a different IP.

