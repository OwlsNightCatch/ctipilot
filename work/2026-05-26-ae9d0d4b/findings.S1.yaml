    novelty: new
    evidence:
      - quote: "Attackers are distributing ACR Stealer malware through counterfeit Claude download pages, often promoted via malicious Google search ads hosted on sites.google.com"
        attribution: "SANS ISC"
        source_url: "https://isc.sans.edu/diary/33018"

  - title: "UPDATE: TeamPCP / Mini Shai-Hulud supply chain worm — @antv npm ecosystem wave (639 malicious versions, 42 forged Sigstore badges), durabletask Linux disk-wiper stage, and full framework open-sourced on GitHub creating copycat wave"
    sources:
      - url: "https://isc.sans.edu/diary/33016"
        publisher: "SANS Internet Storm Center"
        date: "2026-05-25"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/mini-shai-hulud-pushes-malicious-antv.html"
        publisher: "The Hacker News"
        date: "2026-05-23"
        role: "corroborating"
    discovery_trace: "first seen at: sans-isc feed, URL https://isc.sans.edu/rssfeed.xml (item published 2026-05-25T13:26:06Z) → primary (no pivot needed): https://isc.sans.edu/diary/33016"
    summary: |
      SANS ISC handler Kenneth Hartman documents TeamPCP / Mini Shai-Hulud activity through 2026-05-24, adding three material new developments not present in prior coverage: (1) The @antv npm ecosystem wave pushed 639 malicious versions across 323 packages, including echarts-for-react (~1.1M weekly downloads) and size-sensor (~4.2M weekly downloads); 42 packages displayed forged Sigstore verification badges in the npm UI — undermining the supply-chain integrity mechanism. (2) Three versions of `durabletask` (1.4.1–1.4.3) on PyPI — Microsoft's official Azure Durable Functions SDK — were poisoned; the second-stage payload reportedly includes a Linux disk wiper, expanding the campaign's destructive capability beyond credential theft. (3) The complete TeamPCP framework was published to GitHub on 2026-05-22, with copycat forks appearing within hours, creating attribution noise and commoditising the attack framework. Teams attributed UNC6780 as a potential cluster designation. Defender takeaways: all echarts-for-react / size-sensor @antv builds from the affected window must be treated as compromised; Sigstore badge display should never substitute for independent SLSA provenance verification; durabletask consumers should audit pipeline logs for unexpected network outbound or wiper-class disk operations; Sysmon EID 11 for unexpected file deletion patterns, EID 3 for anomalous `node` / `python` network beacons from build workers.
    ch_eu_nexus: "global CI/CD pipelines; European public-sector organisations using npm/@antv packages (echarts-for-react is widely used in dashboards and analytics), Azure Durable Functions users"
