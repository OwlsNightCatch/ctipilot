  - title: "UPDATE: CVE-2026-9256 (nginx-poolslip) — second NGINX ngx_http_rewrite_module heap overflow with remote ASLR bypass PoC; affects systems patched for NGINX Rift (CVE-2026-42945), patch requires upgrade to 1.30.2+ / 1.31.1+"
    sources:
      - url: "https://nginx.org/en/security_advisories.html"
        publisher: "NGINX / F5"
        date: "2026-05-22"
        role: "primary"
      - url: "https://securityonline.info/nginx-poolslip-zero-day-aslr-bypass-remote-code-execution/"
        publisher: "SecurityOnline / Daily CyberSecurity"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: nginx-advisory page, URL https://nginx.org/en/security_advisories.html (fetched this run) showing CVE-2026-9256 advisory (F5 K000161377, published 2026-05-22) → search pivot for exploit details → securityonline.info corroboration"
    summary: |
      CVE-2026-9256 (CVSS v4.0: 9.2, CWE-122 Heap-based Buffer Overflow) is a distinct second heap overflow in NGINX's `ngx_http_rewrite_module`, disclosed by F5 on 2026-05-22, affecting Open Source NGINX 0.1.17–1.31.0 and NGINX Plus R32–R36. Unlike CVE-2026-42945 (NGINX Rift), which triggers when unnamed PCRE captures are used before a rewrite/if/set directive, CVE-2026-9256 (nginx-poolslip) triggers when overlapping PCRE capture groups (e.g. `^/((.*))$`) reference multiple captures (`$1$2`) in a redirect or arguments context. Both require specific rewrite configurations; default nginx deployments without complex rewrite rules are not directly exploitable for RCE. The critical distinction from NGINX Rift is the remote ASLR bypass: NebSec researchers demonstrated a PoC video showing full exploitation against a hardened NGINX 1.31.0 host using ~300 crafted HTTP requests to probe the heap layout (Heap Feng Shui) followed by precise memory-offset leakage — neutralising ASLR without local access. Patch: NGINX Open Source must be updated to ≥1.30.2 (stable) or ≥1.31.1 (mainline); NGINX Plus to R36 P5 / R32 P7 or R37.0.1.1. Sites that patched for NGINX Rift by updating to 1.31.0 are still vulnerable and must re-upgrade. Workaround: replace unnamed PCRE captures with named captures (e.g. `(?<user_id>[0-9]+)`) in all rewrite rules — eliminates the overlapping-capture trigger condition.
    ch_eu_nexus: "global; ~5.7M internet-exposed NGINX servers; all EU/CH public-sector reverse proxies, API gateways, and web servers using NGINX with complex rewrite configurations"
    public_sector_nexus: "indirect — NGINX widely used in public-sector web infrastructure"
    sector: "cross-sector"
    cves: ["CVE-2026-9256", "CVE-2026-42945"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-17"
    evidence:
      - quote: "Buffer overflow in the ngx_http_rewrite_module. Not vulnerable: 1.31.1+, 1.30.2+. Vulnerable: 0.1.17-1.31.0"
        attribution: "NGINX / F5"
        source_url: "https://nginx.org/en/security_advisories.html"
      - quote: "What distinguishes nginx-poolslip from a conventional DoS flaw is its fully demonstrated, multi-stage remote ASLR bypass, with researchers publishing a proof-of-concept video showing exploitation against a fully hardened Linux server running NGINX 1.31.0"
        attribution: "SecurityOnline / Daily CyberSecurity"
        source_url: "https://securityonline.info/nginx-poolslip-zero-day-aslr-bypass-remote-code-execution/"

