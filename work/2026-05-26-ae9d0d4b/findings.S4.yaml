  - title: "Oncology Institute files SEC Item 1.05 8-K on third-party TriZetto Provider Solutions breach — 3.4 M patient records at risk across multiple US healthcare providers"
    sources:
      - url: "https://www.securityweek.com/oncology-institute-discloses-third-party-data-breach/"
        publisher: "SecurityWeek"
        date: "2026-05-25"
        role: "primary"
