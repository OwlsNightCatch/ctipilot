        role: "primary"
      - url: "https://www.troyhunt.com/weekly-update-505/"
        publisher: "Troy Hunt"
        date: "2026-05-24"
        role: "corroborating"
    discovery_trace: >
      first seen at: WebSearch ("Charter Communications ShinyHunters deadline May 27 2026") →
      pivot: CyberInsider article (2026-05-23) confirmed Charter acknowledgement →
      corroboration: Troy Hunt Weekly Update 505 (2026-05-24) confirmed ShinyHunters resumed activity listing Charter and DentaQuest with the same May 27 deadline
    summary: |
      ShinyHunters listed Charter Communications (NASDAQ: CHTR; consumer brand: Spectrum) on their leak site on or around 2026-05-23, claiming theft of over 42 million PII records and setting a May 27, 2026 payment deadline — after which Charter's position in the Salesforce-credential campaign would be escalated to public data release. As of 2026-05-26 (today), Charter has confirmed it is "investigating the incident and coordinating with authorities" and asserts that "no sensitive personal information (PI) or customer proprietary network information (CPNI) was exfiltrated." The data has not yet been leaked.

      No SEC Form 8-K Item 1.05 has been filed by Charter as of this run. Troy Hunt (Weekly Update 505, 2026-05-24) placed Charter's listing alongside DentaQuest (dental benefits administrator) as part of ShinyHunters' resumed campaign after going quiet post-Instructure ransom.

      Defender context: ShinyHunters' campaign targets Salesforce environments via vishing → credential harvesting → Okta/M365/Salesforce lateral movement (Google GTIG UNC6661/UNC6671 clusters, January 2026). The 42M-record claim is unverified; Charter's denial of CPNI exfiltration is notable given the telecoms-specific regulatory sensitivity of that data class under the FCC. Charter has not confirmed any Salesforce-specific breach vector.

      **Note (prior coverage):** This story was covered in the 2026-05-25 brief. Today's delta: the May 27 deadline has not yet elapsed, data has not been released, no 8-K has been filed. If data is released or an 8-K filed on/after May 27, that is the next material delta.
