      - quote: "On May 20, 2026, Kroll, the third-party administrator for the Vendor, notified the Company that the Vendor had detected unauthorized access by a third party to certain information systems of the Company, including systems affecting data of patients"
        attribution: "SEC EDGAR filing summary (search aggregator)"
        source_url: "https://efts.sec.gov/LATEST/search-index?q=%22Item+1.05%22&forms=8-K"
    extended_notes: |
      The Oncology Institute's 8-K is the latest in a series of healthcare organisations disclosing impact from the TriZetto breach long after the vendor first began notifying in December 2025. The pattern — voluntary Item 8.01 non-material disclosure first, then Item 1.05 material confirmation months later — reflects the 4-day materiality clock starting only when the company determines materiality, not when the vendor discloses. This is a live gap in the SEC cyber-disclosure rule that the Debevoise & Plimpton 8-K tracker (published 2026-05-21) notes: 50 issuers used the voluntary Item 8.01 path, of which only 5 graduated to Item 1.05.

  - title: "UPDATE: Charter Communications / ShinyHunters — May 27, 2026 leak deadline passes tomorrow; data not yet released, no SEC 8-K filed"
    sources:
      - url: "https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/"
        publisher: "CyberInsider"
