        role: "background"
    discovery_trace: >
      first seen at: sec-edgar bridge (subcommand sec-edgar 8k 2026-05-14 2026-05-26 1.05) returning Oncology Institute, Inc. (CIK 0001799191) 8-K filing dated 2026-05-22 →
      pivot: WebSearch confirmed SecurityWeek article dated 2026-05-25 reporting on the filing →
      primary: SecurityWeek article https://www.securityweek.com/oncology-institute-discloses-third-party-data-breach/ (fetched via bridge) →
      corroboration: BleepingComputer article on TriZetto breach (March 2026, background) confirms vendor context
    summary: |
      The Oncology Institute, Inc. (NASDAQ: TOI), a US oncology care provider, filed an SEC Form 8-K under Item 1.05 on 2026-05-22, disclosing that on 2026-05-20 it received notification from Kroll (acting as third-party administrator for the unnamed vendor) that the vendor had detected unauthorized access to systems containing patient data. The disclosure follows a voluntary Item 8.01 filing in November 2025 — at that time the vendor could not confirm patient data compromise; the May 2026 notification confirms it can.

      The vendor is widely reported to be TriZetto Provider Solutions (a Cognizant subsidiary), which disclosed in early 2026 that attackers had unauthorized access to its web portal from November 2024 through October 2, 2025 (11 months undetected), ultimately exposing 3,433,965 individuals' PHI. Compromised data fields: patient and insured names, addresses, dates of birth, Social Security numbers, Medicare beneficiary identifiers, health insurance member IDs, insurer names, and dependent information. Payment cards and bank accounts were not in scope.

      TriZetto provides claims management and eligibility-verification software to approximately 70,000 US healthcare organisations including hospital systems, physician practices, and insurers. Affected downstream organisations span dozens of US providers, with OCHIN (an HIT subcontractor) used as an additional vector. The vendor set up a patient portal administered by Kroll for affected individual notifications and is offering 12 months of Kroll credit monitoring.

      Defender takeaway: This is a textbook third-party breach path (TPRM gap) where a healthcare SaaS vendor's web portal was the attack surface. Defenders at any organisation using TriZetto should verify their Business Associate Agreement status, check for a notification from Kroll at tpsincident.kroll.com, and review any data-sharing flows to TriZetto for scope. MITRE ATT&CK T1190 (Exploit Public-Facing Application) is the most likely initial access vector given the web-portal context, with T1005 (Data from Local System) for the 11-month dwell/exfiltration phase. Detection opportunity: audit logs for TriZetto portal access anomalies; review downstream HIPAA BAA inventory.
    ch_eu_nexus: "US-centred; indirect EU/Swiss relevance through HIPAA-to-GDPR parallel: multi-month dwell in third-party SaaS vendor's portal illustrates why GDPR Article 32 and NIS2 Article 21 demand explicit third-party supply-chain security assessments"
    public_sector_nexus: "Medicaid and government-programme patient records in scope through TriZetto's work for federally funded programmes"
