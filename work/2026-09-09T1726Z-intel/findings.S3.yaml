        summary: "Calif's AI-assisted proof-of-concept zero-click worm that hijacks WeChat accounts via an incoming VoIP call, exploiting an undisclosed memory-corruption bug in WeChat's VoIP call-signaling stack on both Android and iOS; reported to Tencent 2026-07-24, client-side fix shipped 2026-08-21, Tencent server-side block confirmed by Calif 2026-08-28, publicly disclosed by Calif 2026-09-08."
