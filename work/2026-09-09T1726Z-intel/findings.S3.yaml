    region_nexus: "global — WeChat 1.4B+ MAU, overwhelmingly China/diaspora; negligible direct Swiss public-sector footprint. Transferable: zero-click-via-trusted-contact worm pattern applies to any messaging/collaboration platform (Teams, Signal, WhatsApp)"
    evidence:
      - quote: "The victim does not need to answer the call, or interact with their phone at all. Even if they do answer, they hear nothing, and the exploit still succeeds."
        attribution: "Calif"
        source_url: "https://calif.io/research/weworm"
      - quote: "Working with AI, our team found the bug and wrote the first remote code execution (RCE) exploit in about two days. Building the worm took one more week."
        attribution: "Calif (quoted by Help Net Security)"
        source_url: "https://www.helpnetsecurity.com/2026/09/08/wechat-weworm-vulnerability-exploit-account-hijacking/"
      - quote: "Checks on 8 September found no CVE identifier for the flaw and no advisory on Tencent's security response site, which lists the latest announcement as April 2022."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/09/wechat-zero-click-worm-took-over.html"
    extended_notes: |
      Not exploited in the wild — responsibly-disclosed offensive-security research. Memory-corruption bug in
      WeChat's VoIP call-signaling stack; exploit fires while the call rings, needs no answer; declining within
      a few seconds blocks that attempt but the attacker redials. No privilege prerequisite beyond being on the
      victim's contact list; a first compromised contact inherits WeChat's saved-contact trust and can call
      further victims (hop-to-hop propagation demonstrated across three devices). Full account takeover per hop
      in seconds. Reported to Tencent 2026-07-24; client updates Android 8.0.77 / iOS 8.0.76 (2026-08-21);
      Calif states Tencent added a server-side block for all users by 2026-08-28. No CVE assigned, no Tencent
      public advisory — so affected-version range and whether the underlying bug (vs Calif's specific exploit)
      is fixed cannot be independently confirmed. Calif notes the WeChat takeover can be chained with its own
      separate OEMpocalypse Android-kernel root chain (2026-08-31) to full device control.
    borderline: false

