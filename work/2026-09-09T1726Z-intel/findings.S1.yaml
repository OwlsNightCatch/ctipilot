    cve_table:
      CVE-2026-81963:
        cvss: 7.8
        vector_cvss: "AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
        cwe: "CWE-59 improper link resolution before file access (link following) + CWE-284 improper access control"
        component: "Windows Update Stack"
        type: lpe
        affected: "Windows Server 2025; Windows 11 23H2/24H2/25H2/26H1 (newest generation)"
        fixed: "KB5122871 (Server 2025); KB5124008 (Win11 24H2/25H2); KB5122880 (Win11 23H2); KB5124012 (Win11 26H1)"
        credit: "Romain Deperne; Microsoft Threat Intelligence Center (MSTIC)"
        temporal: "E:F (functional exploit exists) per Microsoft CVSS temporal"
      CVE-2026-85880:
        cvss: 7.8
        vector_cvss: "AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
        cwe: "CWE-122 heap-based buffer overflow + CWE-908 use of uninitialized resource"
        component: "Windows ALPC (Advanced Local Procedure Call)"
        type: lpe
        note: "AppContainer sandbox escape — 'An attacker who can execute code in a low-privilege AppContainer could exploit this vulnerability locally to escape the sandbox and elevate privileges. No additional user interaction is required.'"
        affected: "Windows 10 1607/1809/21H2/22H2; Windows Server 2012/2012 R2/2016/2019/2022 (legacy/long-support line only; NOT Win11 or Server 2025)"
        fixed: "KB5123065 (Server 2012); KB5123066 (Server 2012 R2); KB5123099 (1607/Server 2016); KB5122876 (1809/Server 2019); KB5122878 (21H2/22H2); KB5122882 (Server 2022)"
        credit: "Volexity; Proofpoint (Mark Kelly, David Galazin, Jeremy Hedges)"
    evidence:
      - quote: "Improper link resolution before file access ('link following') in Windows Update Stack allows an authorized attacker to elevate privileges locally."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-81963"
      - quote: "An attacker who can execute code in a low-privilege AppContainer could exploit this vulnerability locally to escape the sandbox and elevate privileges on the affected system. No additional user interaction is required."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85880"
      - quote: "This is the first bug being exploited in the wild, but we know little about how broadly that exploitation is. The bug itself is a privilege escalation in the Update Stack, which is worrisome, but I doubt the automatic update process itself is compromised. More likely is that this bug is being combined with a code execution bug to spread malware or ransomware. Patch this one quickly."
        attribution: "Zero Day Initiative (Dustin Childs)"
        source_url: "https://www.zerodayinitiative.com/blog/2026/9/8/the-september-2026-security-update-review"
    extended_notes: |
      Both are post-foothold LPE primitives, not remote-entry vectors: the actionable telemetry class is
      process-creation and privilege-token events following a lower-privilege code-execution event on the
      same host. CVE-2026-81963 surfaces around the Update Orchestrator / Update Stack service context
      (wuauclt.exe / usoclient.exe lineage); CVE-2026-85880 surfaces as an AppContainer-sandboxed process
      acquiring a higher-integrity token or spawning a non-sandboxed child. Neither Microsoft nor the
      credited researchers (MSTIC; Volexity/Proofpoint) published IOCs, a named intrusion cluster, or a
      targeting profile — a real evidentiary gap. No workaround exists for either CWE class; the September
      cumulative updates are the only mitigation. CISA KEV due date 2026-09-22 (US FCEB, BOD 26-04) — a US
      compliance date, not the operational driver; the operational driver is confirmed active exploitation.
      Microsoft's CVRF for this release marks exactly these two of ~1,170 fixed CVEs as exploited.
      Separately flagged but NOT at the confirmed-exploitation bar: CVE-2026-69676 (Windows Kerberos RCE,
      capture-replay auth bypass, CVSS 8.8) rated "Exploitation More Likely" — monitor on DCs, do not publish.
