items:
  - title: "September 2026 Patch Tuesday: two actively exploited Windows local-privilege-escalation zero-days added to CISA KEV — Windows Update Stack link-following (CVE-2026-81963) and Windows ALPC heap overflow (CVE-2026-85880)"
