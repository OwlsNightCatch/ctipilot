items:
  - title: "CVE-2026-77956 — ash_ai (Elixir Ash Framework AI extension): unauthenticated remote code execution via EEx evaluation of LLM prompt content (CVSS 10.0)"
    sources:
      - { url: "https://github.com/ash-project/ash_ai/security/advisories/GHSA-2g59-hg7m-qc83", publisher: "ash-project (GitHub Security Advisory, maintainer disclosure)", date: "2026-08-31", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/EUVD-2026-68303", publisher: "ENISA EU Vulnerability Database (EUVD-2026-68303)", date: "2026-08-31", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, via bridge subcommand `enisa-euvd recent criticals` (entry EUVD-2026-68303, citation URL https://euvd.enisa.europa.eu/enisa/EUVD-2026-68303) → primary: GitHub Security Advisory, URL https://github.com/ash-project/ash_ai/security/advisories/GHSA-2g59-hg7m-qc83 → verified: NVD CVE API record https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-77956 (published 2026-08-31T01:16:49Z; used for identifier verification only, not cited as a Source per the NVD/MITRE per-CVE-page citation ban)"
    summary: |
      ash_ai — the AI/LLM-agent extension for the Elixir Ash Framework — ships an unauthenticated remote-code-execution
      flaw in AshAi.Actions.Prompt (lib/ash_ai/actions/prompt.ex, function build_context/3). Every non-ReqLLM.Context
      prompt is rendered through EEx.eval_string/2 — EEx is not string interpolation, a "template" is compiled and
      executed Elixir source. The documented function-based prompt form `prompt: fn input, context -> ... end` is
      meant to let a generic Ash action build prompt content from its own arguments; when that content derives from
      untrusted request data (the natural implementation shown in the vendor's own PoC — a plain HTTP form field
      mapped straight into the prompt), an unauthenticated caller's text such as `<%= System.cmd("sh", ["-c","..."]) %>`
      is compiled and executed on the BEAM node before any LLM call is even made. The vendor's own three
      `# sobelow_skip ["RCE.EEx"]` annotations in the module silenced the static-analysis scanner rather than
      mitigating the flaw. Only the `ReqLLM.Context` return form bypasses EEx and is unaffected. CVSS 4.0 base score
      10.0 (AV:N/AC:L/AT:N/PR:N/UI:N, full C/I/A both vuln and subsequent system), CWE-94. Affects ash_ai from 0.1.0
      up to (not including) 1.0.0; fixed in 1.0.0 (commit e9948254b5659c1143b73dc2f59f457931e64514), which stops
      evaluating function-supplied prompt content as EEx and evaluates only statically configured (compile-time
      literal) templates. Published 2026-08-31; no in-the-wild exploitation reported by any source, but the maintainer
      advisory itself ships a complete, working HTTP-triggered PoC (Bandit/Plug endpoint, Mix.install script), so a
      working exploit chain is public from disclosure. This is a new instance of a pattern already recurring in this
      constituency's threat picture — untrusted input reaching an LLM-agent framework's code-evaluation surface —
      distinct from, but conceptually adjacent to, the agentic-AI framework and evaluation-sandbox incidents already
      tracked (Hugging Face, Taiwan government agentic-AI intrusion, GTIG AVDH).
    region_nexus: "global — open-source Hex.pm/GitHub package (ash-project/ash_ai); no Swiss-specific deployment confirmed by any source"
    primary_sector_nexus: "indirect — relevant wherever an Ash Framework (Elixir/Phoenix ecosystem) service exposes an ash_ai prompt action to untrusted input; adoption inside Swiss public-sector stacks not confirmed by any source"
    sector: "public-sector"
    cves: ["CVE-2026-77956"]
    techniques: ["T1190"]
    affected_products: ["ash_ai (Elixir Ash Framework AI extension, Hex package ash_ai / GitHub ash-project/ash_ai)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "AshAi.Actions.Prompt runs every non-ReqLLM.Context prompt through EEx.eval_string/2 (lib/ash_ai/actions/prompt.ex:512 for the string form, 521-522 for the {system, user} tuple, 542/550/555 for the message-list forms). EEx is not string interpolation — a template is Elixir source"
        attribution: "ash-project (GitHub Security Advisory GHSA-2g59-hg7m-qc83)"
        source_url: "https://github.com/ash-project/ash_ai/security/advisories/GHSA-2g59-hg7m-qc83"
      - quote: "That hands end-user text directly to EEx.eval_string/2. Nothing in the module escapes, sanitizes, or restricts the template; the only related markers are three # sobelow_skip [\"RCE.EEx\"] annotations (lines 487, 503, 536), which silence the scanner rather than mitigate the issue."
        attribution: "ash-project (GitHub Security Advisory GHSA-2g59-hg7m-qc83)"
        source_url: "https://github.com/ash-project/ash_ai/security/advisories/GHSA-2g59-hg7m-qc83"
      - quote: "Remote code execution in the application's BEAM node. Anyone running an ash_ai prompt action behind an HTTP or other untrusted boundary whose prompt function incorporates request data is affected; no authentication or special privileges are required."
        attribution: "ash-project (GitHub Security Advisory GHSA-2g59-hg7m-qc83)"
        source_url: "https://github.com/ash-project/ash_ai/security/advisories/GHSA-2g59-hg7m-qc83"
    extended_notes: |
      Detection concept (telemetry class first, platform anchor second): (1) application/web-access-log inspection
      of any ash_ai-backed prompt-action endpoint's request bodies for EEx delimiter sequences (`<%=`, `<%`, `%>`)
      co-occurring with Elixir stdlib call names (System.cmd, File., Code.eval_string, :os.cmd) — ordinary free-text
      user input is the benign lookalike, so the discriminator is a delimited, syntactically valid Elixir call
      inside the field, not the mere presence of angle brackets. (2) process-creation telemetry on hosts running a
      BEAM VM (beam.smp / erlang parent process): a shell (sh/bash) or OS command spawned directly from beam.smp
      with no intervening deployment/ops tooling is anomalous for an Ash/Phoenix web service and is the actionable
      EDR signal, since a successful exploit runs entirely inside the interpreter's memory before optionally
      shelling out. Hardening: upgrade to ash_ai >= 1.0.0; as an interim/compensating control, audit every use of
      the function-based `prompt: fn input, context -> ... end` DSL form for any code path that folds action
      arguments (i.e., anything ultimately derived from an HTTP request) into the returned prompt content, and
      either move to the vendor's now-safe static-template form or strip/refuse EEx-special characters before the
      content reaches the prompt action. No workaround exists that leaves the function-based dynamic-prompt form
      itself safe pre-patch.
    borderline: true
    borderline_reason: >
      Genuine unauthenticated CVSS 10.0 RCE with a public working PoC, freshly disclosed (published
      2026-08-31, roughly 3 hours before this research run) and independently corroborated (GHSA plus
      ENISA EUVD) — but the affected ecosystem (Elixir Ash Framework AI-agent extension) is niche
      relative to the technology stacks typically deployed in Swiss federal, cantonal and communal
      administration, and no source confirms any Swiss public-sector or supplier deployment. Included
      on the strength of the vulnerability class (untrusted input reaching an LLM-agent framework's
      template/code-evaluation layer), directly relevant to this constituency's growing agentic-AI
      exposure already tracked in prior entries; main agent should weigh stack relevance against
      novelty of class when setting priority.

