items:
  - title: "Manchester Airports Group breach: FulcrumSec claims 86GB stolen via Iterable API credentials exposed in client-side JavaScript, scope wider than MAG's own disclosure"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/fulcrumsec-claims-manchester-airports-hack-theft-of-86-gb-of-data/", publisher: "BleepingComputer", date: "2026-08-30", role: "primary" }
      - { url: "https://securityaffairs.com/198143/cyber-crime/extortion-group-fulcrumsec-claims-86gb-manchester-airports-group-data-theft.html", publisher: "Security Affairs", date: "2026-08-30", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs (essential/rotation slice), URL https://securityaffairs.com/ -> homepage headline -> primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/fulcrumsec-claims-manchester-airports-hack-theft-of-86-gb-of-data/ -> corroborating: Security Affairs full article, URL https://securityaffairs.com/198143/cyber-crime/extortion-group-fulcrumsec-claims-86gb-manchester-airports-group-data-theft.html"
    summary: |
      This is a material development on the already-tracked Manchester Airports Group (MAG) breach
      (disclosed 2026-08-27, ~8.7M customers). The extortion group FulcrumSec has now claimed
      responsibility and told BleepingComputer it stole approximately 86GB of data, considerably
      more detailed than MAG's original disclosure suggested. FulcrumSec says it obtained access
      using airport-specific Iterable (marketing-platform) API credentials exposed in client-side
      JavaScript -- code that runs in the customer's browser, so anyone inspecting network calls or
      page source with developer tools could read the credentials. BleepingComputer validated a
      sample record against a real traveller's known purchase history (matching Fast Track bookings,
      arrival times, terminal, amounts paid) and reports a ~21.5GB Manchester customer export
      combining identifiers, historical booking activity and marketing classifications, plus a claim
      of nearly 200,000 records tied to upcoming travel through the rest of 2026 (dates, times,
      booking details linked to PII) -- none of which BleepingComputer could independently verify in
      scope. MAG has not addressed the specific claims (exposed credentials, 86GB figure, future-
      travel data) and continues to point to its existing customer-notification statement; no
      payment-card or banking data is reported exposed. The defender-relevant lesson is the initial-
      access class: a third-party marketing/analytics SaaS API key shipped in front-end JS is
      effectively a public credential once the page is inspectable, independent of any server-side
      hardening.
    region_nexus: "United Kingdom; third-party SaaS (marketing-platform) API-key exposure pattern transferable to any organisation using client-side-embedded API keys, including government digital-service front-ends"
    primary_sector_nexus: "indirect"
    sector: "transportation/critical-infrastructure (private operator)"
    cves: []
    techniques: [T1552.001, T1213]
    affected_products: []
    entity_keys: ["incident:manchester-airports-group-data-breach-2026-08"]
