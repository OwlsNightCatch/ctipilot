          summary: "Recurring series of data-theft claims and confirmed breaches against French departmental fire-and-rescue services (SDIS) since July 2026, attributed to multiple criminal forum handles (ChimeraZ, Cybernox, AplaGroup); a new wave hit seven more SDIS in late August 2026, and SDIS du Gard's board president confirmed the intrusion and theft of personnel ID documents and bank details (ZATAZ, Objectif Gard, 2026-08-30)." }
