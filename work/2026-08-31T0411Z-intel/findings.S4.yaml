        attribution: "MAG spokesperson, via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fulcrumsec-claims-manchester-airports-hack-theft-of-86-gb-of-data/"
    extended_notes: |
      Component/prerequisite detail for defenders: the exposure class is "secret shipped in a
      first-party web app's client-side bundle" -- not a CVE, not a misconfigured cloud bucket.
      Any organisation embedding a third-party marketing/analytics/booking-platform API key
      directly in browser-delivered JS (rather than proxying calls through a backend that holds
      the credential server-side) should treat that key as effectively public. Hunt/detect angle:
      review outbound API call patterns from public web front-ends for tokens/keys visible in
      Network tab or bundled JS; verify with the vendor (Iterable in this case) whether the key
      scope can be restricted to write-only/track-only actions instead of full read access to
      customer records.

  - title: "ZeroBytes claims third French government platform in three months: ~148.9M rows from Zéro Logement Vacant (beta.gouv.fr) via a compromised Metabase admin session and a cleartext production database password"
    sources:
      - { url: "https://www.zataz.com/zero-logement-vacant-vise-par-une-fuite-massive/", publisher: "ZATAZ.COM (Damien Bancal)", date: "2026-08-30", role: "primary" }
      - { url: "https://www.clubic.com/actualite-627343-zero-logement-vacant-pirate-148-9-millions-de-lignes-de-donnees-revendiquees-par-zerobytes.html", publisher: "Clubic (Mélina Loupia)", date: "2026-08-30", role: "primary" }
    discovery_trace: "first seen at: zataz-feed (rotation slice), URL https://www.zataz.com/feed/ -> article URL https://www.zataz.com/zero-logement-vacant-vise-par-une-fuite-massive/ -> corroborating/independent: Clubic, URL https://www.clubic.com/actualite-627343-zero-logement-vacant-pirate-148-9-millions-de-lignes-de-donnees-revendiquees-par-zerobytes.html (which itself cites FrenchBreaches and Cyberattaque.org as further independent trackers)"
    summary: |
      The actor known as ZeroBytes -- already tracked in this store for the June/July DGFiP
      (French tax authority) credential intrusion and the claimed Ministry of National Education
      leak -- claims a third French public-sector platform compromise in three months: Zéro
      Logement Vacant, a housing-vacancy tool built and operated by La Fabrique numérique
      (Ministry of Ecological Transition) together with the Agence nationale de l'habitat, hosted
      on beta.gouv.fr and used by municipal/collectivité housing officers. Per the actor's own
      account (relayed by ZATAZ and independently by Clubic, which also cites FrenchBreaches and
      Cyberattaque.org), initial access was a valid Metabase (open-source BI tool) superuser
      session, which exposed the platform's full Metabase configuration: connected databases,
      accounts, permissions, saved queries/dashboards and stored secrets, plus the ability to run
      native SQL against every connected database from within the tool. Metabase's at-rest secret
      encryption was reportedly disabled, and the actor says a production PostgreSQL password was
      stored in plaintext in a database-connection's description field, retrieved via a call to
      Metabase's admin API. That password gave a direct, Metabase-independent read connection to
      the production PostgreSQL instance (hosted at French cloud provider Clever Cloud) -- so
      deleting the compromised Metabase accounts afterwards did not cut off access; the actor says
      the PostgreSQL credentials stayed valid until rotated. Thirteen dashboards were reportedly
      exposed with no authentication at all, some leaking email/bcrypt-hash pairs, and a JWT
      signing key was allegedly recoverable from platform settings. The claimed haul totals
      148,929,194 raw rows: ~82M from a national property-owner table and ~67M from a 2024
      DGFiP/DataFoncier national file (names, dates of birth, addresses, tax/property identifiers),
      plus ~3,500 municipal-agent accounts (bcrypt hashes, session tokens, OAuth records) and
      several thousand unique emails/phone numbers. Deduplicated by individual identifier, the
      actor states ~48M distinct people; by name+DOB, ~71M. The platform was taken offline after
      the intrusion was discovered; no government confirmation of scope was located at research
      time, but the platform takedown is a de facto acknowledgement an incident occurred. This
      is the same actor's third strike against French government digital infrastructure since
      June 2026 (DGFiP, then the Ministry of National Education, now Zéro Logement Vacant),
      arriving one week after the French Prime Minister ordered ANSSI to stand up a dedicated
      cyber crisis unit in response to the preceding two incidents.
    region_nexus: "France; a national e-government/BI-tooling exposure pattern (BI-tool admin session + cleartext production credential stored inside the BI tool's own connection config) directly transferable to any government's internal analytics/BI deployments, including Swiss federal/cantonal e-government (agov-style) services"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1078, T1552.001, T1213]
    affected_products: ["Metabase"]
    entity_keys: ["actor:zerobytes", "incident:france-dgfip-tax-breach-2026-08", "incident:france-education-ministry-breach-2026-07"]
    new_entities:
      - { key: "incident:zero-logement-vacant-breach-2026-08", type: incident, name: "Zéro Logement Vacant data breach (France, 2026)", aliases: [],
          summary: "ZeroBytes claims compromise of the French government's Zéro Logement Vacant housing-vacancy platform (beta.gouv.fr) on 2026-08-25 via a Metabase administrator session and a cleartext PostgreSQL production password, exfiltrating ~148.9M raw rows including DGFiP/DataFoncier property-owner records covering an estimated 48-71M individuals; platform taken offline (ZATAZ, Clubic, 2026-08-30)." }
    relation_suggestions:
      - { subject: "incident:zero-logement-vacant-breach-2026-08", object: "actor:zerobytes",
          basis: "Clubic: 'ZeroBytes revendique depuis hier, le piratage du service public Zéro Logement Vacant' -- the group itself claims the breach on a criminal forum (Clubic, 2026-08-30)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Selon son récit, l'accès initial aurait été obtenu via une session administrateur Metabase valide."
        attribution: "ZATAZ.COM (Damien Bancal) -- EN: 'According to his account, initial access was obtained via a valid Metabase administrator session.'"
        source_url: "https://www.zataz.com/zero-logement-vacant-vise-par-une-fuite-massive/"
      - quote: "le mot de passe PostgreSQL de production aurait été conservé en clair dans le champ de description d'une connexion à la base"
        attribution: "ZATAZ.COM (Damien Bancal) -- EN: 'the production PostgreSQL password was allegedly stored in plaintext in the description field of a database connection'"
        source_url: "https://www.zataz.com/zero-logement-vacant-vise-par-une-fuite-massive/"
      - quote: "ZeroBytes frappe un troisième service public en trois mois"
        attribution: "Clubic (Mélina Loupia) -- EN: 'ZeroBytes strikes a third public service in three months'"
        source_url: "https://www.clubic.com/actualite-627343-zero-logement-vacant-pirate-148-9-millions-de-lignes-de-donnees-revendiquees-par-zerobytes.html"
    extended_notes: |
      Prerequisite/mechanism detail for defenders operating Metabase or comparable BI tools
      against production data: (1) do not store raw database credentials in free-text fields
      (connection "description"/"notes") readable via the tool's own admin API; (2) enable
      at-rest secret encryption for the BI tool's connection-credential store; (3) treat BI-tool
      admin-session compromise as equivalent to full read access on every connected data source,
      not merely the tool's own metadata; (4) rotate the actual database credential (not just the
      BI-tool account) immediately upon any suspected BI-platform compromise, since deleting the
      compromised accounts alone does not invalidate an already-exfiltrated database password;
      (5) audit BI dashboards for anonymous/unauthenticated public sharing -- 13 dashboards here
      were reportedly reachable with no authentication at all. Hunt angle: Metabase admin-API
      calls (`/api/database`, `/api/user`) from unfamiliar source IPs/sessions; unexpected native
      SQL query execution through the BI tool's query editor rather than its dashboard layer.

  - title: "New wave of French departmental fire-and-rescue-service (SDIS) data-leak claims hits seven more units; SDIS du Gard's board confirms intrusion and theft of staff ID copies and bank details"
    sources:
      - { url: "https://www.zataz.com/un-pirate-cible-a-nouveau-les-sdis-francais/", publisher: "ZATAZ.COM (Damien Bancal)", date: "2026-08-30", role: "primary" }
      - { url: "https://www.objectifgard.com/faits-divers/gard-cyberattaque-chez-les-pompiers-des-donnees-personnelles-sensibles-derobees-168493.php", publisher: "Objectif Gard", date: "2026-08-30", role: "primary" }
    discovery_trace: "first seen at: zataz-feed (rotation slice), URL https://www.zataz.com/feed/ -> article URL https://www.zataz.com/un-pirate-cible-a-nouveau-les-sdis-francais/ -> pivot for victim confirmation: WebSearch (\"SDIS piratage données pompiers août 2026 Somme Essonne Bas-Rhin\") -> Objectif Gard, URL https://www.objectifgard.com/faits-divers/gard-cyberattaque-chez-les-pompiers-des-donnees-personnelles-sensibles-derobees-168493.php"
    summary: |
      Over the last weekend of August 2026 a criminal actor published fresh data-leak claims
      against seven more French Services départementaux d'incendie et de secours (SDIS --
      departmental fire and rescue services): Somme, Essonne, Bas-Rhin, Bouches-du-Rhône, Gard,
      Vosges and Moselle. This extends a campaign ZATAZ first documented in late July 2026 against
      five other SDIS (Aisne, Alpes-de-Haute-Provence, Landes, Marne, Alpes-Maritimes), attributed
      across different postings to three separate forum handles: ChimeraZ, Cybernox and AplaGroup.
      Crucially, this is not merely a criminal claim: contacted directly by Objectif Gard on
      2026-08-30, the president of SDIS du Gard's governing board confirmed the cyberattack and
      theft of personal data on personnel, including copies of identity documents and bank
      details -- full scope and intrusion method still under investigation. The July wave (per
      FrenchBreaches' independent analysis) totalled at least 4,878 claimed personnel/records and
      ~35GB of internal documents across four quantifiable SDIS, plus a claimed administrator-level
      access to 17 named SDIS applications (incident mapping, wildfire surveillance, weather feeds,
      GIS tools) at SDIS de l'Aisne with no confirmed exfiltration volume. No common intrusion
      vector across the SDIS has been established; each publication appears to be a distinct claim
      rather than one coordinated technical compromise. The pattern that matters for defenders is
      not any single leak's volume but the aggregation risk: personnel identity, rank, assignment,
      hierarchical role, contact details and (in some cases) technical/infrastructure access,
      accumulated across repeated incidents against the same category of organisation, builds a
      reconnaissance dataset usable for targeted phishing, impersonation or infrastructure mapping
      against emergency-services personnel specifically -- the same organisational category as
      Swiss cantonal fire/rescue services within this constituency's core.
    region_nexus: "France; French departmental fire-and-rescue services (SDIS) -- directly analogous organisational category to Swiss cantonal/communal fire and rescue services within the profiled constituency's core (emergency services)"
    primary_sector_nexus: "direct"
