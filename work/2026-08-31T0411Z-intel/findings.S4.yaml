          summary: "Financially motivated data-extortion group active since 2025 that steals corporate data and threatens publication rather than encrypting victim systems; previously claimed LexisNexis, Novo Nordisk, Global Schools Group and Avnet, and claimed the Manchester Airports Group breach on 2026-08-30 (BleepingComputer, 2026-08-30)." }
    relation_suggestions:
      - { subject: "incident:manchester-airports-group-data-breach-2026-08", object: "actor:fulcrumsec",
          basis: "BleepingComputer: FulcrumSec claimed responsibility for the attack and shared samples of the allegedly stolen data as evidence (BleepingComputer, 2026-08-30)" }
