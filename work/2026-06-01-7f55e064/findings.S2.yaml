        attribution: "Osservatorio Nessuno — Morpheus technical analysis"
        source_url: "https://osservatorionessuno.org/blog/2026/04/morpheus-a-new-spyware-linked-to-ips-intelligence/"
      - quote: "Italian prosecutors authorised approximately 5,200 trojan-based interceptions in 2024 alone, yet oversight remains inadequate—targets cannot determine which vendor created the tool, which authority deployed it, or whether proper authorization existed"
        attribution: "EDRi — Inside Italy's low-cost spyware economy"
        source_url: "https://edri.org/our-work/inside-italys-low-cost-spyware-economy/"
    extended_notes: |
      Detection approach for Android device fleets in EU/CH public-sector MDM environments:
      - Enrol MDM alert policy: any Accessibility Service grant from an APK not on the approved-app
        list → quarantine device and alert SOC (T1418 Mobile Device Management abuse).
      - Mobile Threat Defence (MTD) integration: Morpheus specifically kills Bitdefender, Sophos,
        Avast, AVG, Malwarebytes. Any process termination of registered MTD agent within 30 seconds
        of a new APK installation is a high-confidence indicator.
      - Overlay permission (SYSTEM_ALERT_WINDOW) from a non-Play-Store-sourced APK on a
        government device is a critical alert condition.
      - Network: C2 pattern *.game-host.org; verify via DNS-over-HTTPS or encrypted DNS logs.
        Historical C2 IPs (from Osservatorio Nessuno report): 109.239.245.172, 195.120.31.91,
        212.210.1.211, 217.56.196.66. Avoid publishing as IOCs; use as threat-hunt seeds only.
      Hardening:
      - Enforce Android Enterprise Fully Managed Device mode (no user-installed APKs).
      - Disable ADB over network (`adb tcpip`) via MDM policy.
      - Google's March 2026 Play Protect update restricts Accessibility Service abuse for
        sideloaded apps; ensure Play Protect remains enabled and un-killable.
      EU regulatory angle: EP June 16 debate may produce a Commission of Inquiry; Swiss FADP
      (Datenschutzgesetz) and ISG (Informationssicherheitsgesetz) may be relevant if Swiss
      agencies procure similar tools. Watchlist for COPASIR-style oversight body recommendations.

