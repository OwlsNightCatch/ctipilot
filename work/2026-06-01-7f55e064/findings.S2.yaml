    summary: |
      EDRi and Italian NGO Osservatorio Nessuno disclosed in late May 2026 that Italy operates a
      commercially active low-cost surveillance software market, largely invisible alongside
      headline vendors such as NSO Group and Paragon. Two products were technically dissected:
      Morpheus, linked to IPS Intelligence (IPS Public Security S.p.A.), and Spyrtacus, actively
      developed by SIO S.p.A. Both tools infect Android devices without zero-day exploits:
      instead they abuse Android Accessibility Services (T1418 — Software Discovery / T1421 on
      mobile), overlay permissions (SYSTEM_ALERT_WINDOW), and Android Debug Bridge (ADB) to
      silently self-grant dangerous permissions. Morpheus specifically spoofs biometric-prompt
      overlays on top of WhatsApp's account-linking screen to pair unauthorised devices, records
      audio/video, disables camera and microphone privacy indicators via device_config ADB
      commands, and actively kills mobile AV products (Bitdefender, Sophos, Avast, Malwarebytes).
      The Italian Ministry of Justice's own statistics record 5,200 trojan-based interceptions
      authorised by prosecutors in 2024 alone — a volume far exceeding any other EU member state —
      and prosecutors pay as little as a few euros per day. No centralised oversight exists: judges
      operate at local level, targets cannot determine which vendor created the tool or whether
      proper legal authorisation existed, and Italian export controls remain largely unenforced.
      Paragon Solutions (Graphite) is a separate higher-tier vendor also operating in Italy under
      contract to AISE and AISI; that contract was terminated after public disclosure. The European
      Parliament is scheduled to debate the combined Paragon and domestic-vendor spyware scandal on
      16 June 2026; EDRi and civil-society groups are pushing for a Commission of Inquiry and
      mandatory EU-wide proportionality rules. Swiss/EU public-sector relevance: EU institutions
      and Swiss government bodies deploy Android devices managed via MDM platforms; Morpheus's
      infection vector (social-engineering via fake carrier update SMS or impersonated app) requires
      only user-initiated click and will evade standard Play Protect because these APKs are
      side-loaded via carrier cooperation or direct delivery. Detection-relevant behaviours:
      Accessibility Service granted to untrusted package; SYSTEM_ALERT_WINDOW combined with overlay
      activity on messaging apps; adb shell device_config set commands from untrusted source;
      known C2 pattern *.game-host.org resolved to IP ranges attributed to IPS Intelligence in RIPE.
