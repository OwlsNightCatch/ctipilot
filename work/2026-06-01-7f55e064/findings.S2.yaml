    discovery_trace: |
      first seen at: ncsc-nl feed (bridge subcommand ncsc-nl recent 10), listing item NCSC-2026-0172 published 2026-05-30T10:52:02Z →
      fetched CSAF via bridge subcommand ncsc-nl csaf NCSC-2026-0172 →
      vendor advisory URL extracted from CSAF references section: https://security.paloaltonetworks.com/CVE-2026-0257 →
      exploitation evidence URL: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    summary: |
      NCSC-NL issued advisory NCSC-2026-0172 on 2026-05-30T10:52Z for CVE-2026-0257 — the
      pre-auth authentication bypass in PAN-OS GlobalProtect portal and gateway components (already
      covered in the May 30 daily brief). The NCSC-NL advisory explicitly adds EU/Dutch public-sector
      context: "given the availability of PoC code, the general interest of attackers in edge
      devices, and the access that attackers obtain via this vulnerability, NCSC expects that the
      scale of exploitation will increase in the coming period." Root cause per the CSAF advisory:
      CWE-565 (Reliance on Cookies without Validation and Integrity Checking) — authentication
      override cookies are encrypted with the portal or gateway certificate; certificate reuse
      across portals/gateways allows the override cookie from one component to be accepted by
      another. Prerequisite: "Generate cookie for authentication override" or "Accept cookie for
      authentication override" must be enabled, AND the same HTTPS certificate must be reused
      across components. Fresh delta on the May 30 coverage: NCSC-NL now formally tracking the
      exploitation trajectory and Dutch public-sector operators are under formal national advisory
      to patch immediately.
    ch_eu_nexus: "direct — NCSC-NL advisory issued to Dutch public-sector operators; PAN-OS GlobalProtect widely deployed across EU/CH government network perimeters"
    public_sector_nexus: "direct"
