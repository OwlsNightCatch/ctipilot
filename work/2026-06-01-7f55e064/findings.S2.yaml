        attribution: "NCSC-NL NCSC-2026-0172 (Dutch: 'Given the availability of PoC code, the general interest of attackers in edge devices, and the access that attackers obtain via this vulnerability, NCSC expects the scale of exploitation to increase in the coming period')"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0172"
    extended_notes: |
      Detection / hunt: PAN-OS Traffic logs — GlobalProtect gateway authentication events where
      the source IP and pre-auth session do not match expected client profile. Look for
      `authentication bypass` events in `globalprotect.log` on Panorama. For Sysmon-instrumented
      jump hosts: auth events to internal network segments originating from the VPN IP pool shortly
      after a successful GP authentication without a matching pre-existing session.
      Hardening: disable "Generate cookie for authentication override" and "Accept cookie for
      authentication override" unless operationally required; ensure separate certificates are used
      for each portal and gateway component. NCSC-NL recommends checking Rapid7-published
      indicators of compromise in the referenced Rapid7 ETR blog post.

