        attribution: "Risky Biz News"
        source_url: "https://news.risky.biz/risky-bulletin-russia-greatly-expands-sorm-surveillance-requirements/"
    extended_notes: |
      PostHog is open-source (MIT-licensed) with a large self-hosted deployment base in addition to its managed EU/US Cloud. The EU Cloud data-residency offering processes event streams, session recordings, feature-flag state, and funnels from production applications — making a cloud-credential compromise a high-value lateral movement stepping stone into customer application contexts. Detection notes for defenders using PostHog: (1) monitor CloudTrail or equivalent for unexpected IAM key usage from PostHog's managed infrastructure IP ranges; (2) review any cross-account IAM trust relationships or role-chaining from PostHog's AWS account IDs; (3) if self-hosting, verify that the PostHog ingestion endpoint is not accessible without authentication from the broader internet (T1190). PostHog's incident response was swift (< 6h from discovery to resolved) and the company's transparency via public status updates is positive — the public incident page confirmed the exploit was researcher-disclosed, not observed wild exploitation. Incident date: May 30, 2026.

