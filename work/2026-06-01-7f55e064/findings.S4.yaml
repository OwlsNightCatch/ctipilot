      - { url: "https://news.risky.biz/risky-bulletin-russia-greatly-expands-sorm-surveillance-requirements/", publisher: "Risky Biz News (Catalin Cimpanu)", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: risky-biz-rss, URL https://news.risky.biz/risky-bulletin-russia-greatly-expands-sorm-surveillance-requirements/ (June 1, 2026 bulletin mentioning PostHog breach) → primary: PostHog official incident status, URL https://www.posthogstatus.com/incidents/01KSV6HJYKG5QJAP8HVTSQVSM1"
    summary: |
      On May 30, 2026 (01:03 UTC), PostHog — a widely deployed open-source developer analytics platform used across EU and US cloud environments — disclosed an active security incident after a security research team confirmed an exploit in one of its AWS environments. PostHog immediately rotated all AWS credentials, causing temporary degraded performance across both its US Cloud and EU Cloud app deployments. The incident affected exports, reverse proxy services, and other dependent services. PostHog stated no keys were publicly accessible at the time and no customer data was compromised. By 07:16 UTC the same day, PostHog marked the incident resolved and confirmed the vulnerability had been patched. PostHog did not disclose the specific exploit vector, the name of the research team, or the CVE (if assigned). The incident is notable for defenders because PostHog ingests application telemetry, session recordings, and feature-flag state across production SaaS environments — a compromise would yield high-fidelity behavioural data on end users. Defenders integrating PostHog via its EU Cloud should verify IAM permission scopes on AWS resources exposed to PostHog's hosted infrastructure, and review whether PostHog's data-residency boundaries match their assumed threat model.
    ch_eu_nexus: "direct — PostHog EU Cloud (EU-resident data processing) was impacted; PostHog is used by European startups and enterprises including those in CH/EU fintech, healthtech, and SaaS sectors"
    public_sector_nexus: "indirect — PostHog is primarily a commercial SaaS analytics platform; public-sector digital services that self-host or use the EU Cloud offering should review integration credential scopes"
    sector: "SaaS / cloud services, any sector using PostHog analytics"
