  summary: Publica's event page now carries a status stamp of 2026-10-29 and links its second newsletter to insured persons, dated 2026-10-22, neither of which the store's entry cites. In the newsletter
    Publica says its software supplier was hit by a ransomware attack at the end of September, that the hacker group Akira 'is being associated with' the attack (pointing to BACS's note on Akira), and,
    in the same document, that it does not know whether ransom demands were made or anyone is being extorted, which it leaves to the Federal Prosecutor's investigation. It says it still does not know which
    data left, whose it is or how many people are affected, and that it may never gain certainty. The supplier held data because tests are run before releases, and the supplier confirmed to Publica the
    deletion of old data on the test environment. The page's FAQ states that Publica filed a criminal complaint against unknown persons with the Federal Prosecutor's Office on 2026-10-15 and that the test
    environment at the supplier is separate from Publica's productive system. The 2026-10-29 status repeats that Publica has no indications that data from the attack was published on the darkweb, that its
    productive systems are unaffected, and adds that pension purchases can be made through the myPublica portal or by form. The store's entry attributes the Akira link to press reports (Tamedia, Inside
    IT, 20 Minuten) and says neither the Confederation nor Publica confirms it; Publica's own wording is an association, not a confirmation, so the delta is that the fund itself now names the group.
