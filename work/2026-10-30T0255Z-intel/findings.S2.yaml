    (links the EFK page) -> primary: EFK audit page https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/'
  summary: 'The Swiss Federal Audit Office (EFK) published on 2026-10-21 its audit of the security and usability of Microsoft 365, which the Federal Chancellery''s digital-transformation sector (BK-DTI)
    introduced across the federal administration by the end of 2025 and the Federal Office of Information Technology (BIT) operates: 54,000 workplaces, a 14-month migration from October 2024, 57 M365 services
    released for the standard service. EFK finds the platform built to the Chancellery''s architecture guidelines and Microsoft good practice, with changes rolled in through an established process and safeguards
    adequate for the currently restrictive use. Its open points are: BK-DTI and BIT must define which of M365''s security-landscape analytics are monitored systematically; tenant configuration is only partly
    automated, so BIT should automate it as far as possible (the report suggests Desired State Configuration, which compares settings with a reference and corrects drift); BK-DTI has not defined how often
    compliance with security standards is checked or how to react; and the backup required on the administration''s own systems is still being built. Per Netzwoche and ICTjournal, which read the full report:
    only unclassified information may be processed in M365; the full-backup solution''s administration console was hosted in the United States against federal requirements; the interim M365 Backup service
    raises dependence on Microsoft, because without a connection to M365 no backup would be available; BIT says in its response that it has meanwhile put a local solution into production; customer-managed
    keys are planned; and Microsoft can ship some changes without a Message Center notice, a residual risk EFK notes without a recommendation. These are audit recommendations to the federal administration,
    not binding rules.'
  region_nexus: 'Switzerland: federal administration (BK-DTI, BIT); transferable to cantonal and communal M365 tenants'
