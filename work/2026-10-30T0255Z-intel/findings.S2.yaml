  summary: 'privatim, the conference of the Swiss data-protection commissioners, published a revised guidance sheet on cloud-specific risks and measures, version 3.02 dated 2026-10-02 and announced on its
    site on 2026-10-13; it replaces version 3.0 of 2022-02-03. The sheet restates that a public body stays fully responsible when it outsources processing, and that it must reduce risks in five areas to
    a tolerable level or forgo the cloud service: contract design, processing locations including foreign-authority access, confidentiality with encryption and key management, telemetry and log data about
    the users of the service, and sub-processors. For particularly sensitive personal data it requires the public body itself to encrypt and the keys to be available only to that body; provider-side encryption
    is to be considered only if no intolerable fundamental-rights risk results, with keys usable only on the body''s express consent and key access logged. It states that outsourcing particularly sensitive
    or secrecy-bound personal data to SaaS of large international providers such as Microsoft, Google, AWS and SAP is inadmissible in most cases because of the intolerable risk, referring to privatim''s
    resolution of 2025-11-18, and that access by a CLOUD-Act-bound provider on a US request would count as an unlawful disclosure to third parties under Swiss law. Telemetry and log data the service generates
    about the body''s users must be treated with the same care and contractual terms as the content data. Top management is expected to confirm in writing that it understands the risks and accepts the residual
    risk, a data-protection impact assessment is required, and risk analysis and measures go to the data-protection authority for prior consultation. The sheet cites a BACS technology assessment of 2026-05-28
    for key handling. Which passages are new compared with v3.0 is not stated in the sources read, apart from the two post-2022 references named above.'
  region_nexus: 'Switzerland: cantonal and communal public bodies (privatim is the conference of the Swiss data-protection authorities) and, through the same data-protection logic, the federal administration'
