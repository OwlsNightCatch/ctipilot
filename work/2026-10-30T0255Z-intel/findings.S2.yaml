  - quote: The administration console of this solution is hosted in the USA and thus contradicts the Confederation's own requirements, the EFK writes.
    original: Allerdings werde die Administrationskonsole dieser Lösung in den USA gehostet und stehe damit im Widerspruch zu den bundeseigenen Vorgaben, schreibt die EFK.
    attribution: Netzwoche (reading the EFK report)
    source_url: https://www.netzwoche.ch/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern
  - quote: Therefore BIT, in consultation with the DTI sector, must create a local backup as quickly as possible and then test restoration regularly.
    original: Deshalb müsse das BIT in Absprache mit dem Bereich DTI ein lokales Back-up so schnell wie möglich erstellen und danach die Wiederherstellung regelmässig testen.
    attribution: Netzwoche (reading the EFK report)
    source_url: https://www.netzwoche.ch/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern
  - quote: If the connection to M365 were lost, no backup would be available any more, the audit body warns.
    original: En cas de perte de connexion à M365, aucune sauvegarde ne serait plus disponible, avertit l’organe de contrôle.
    attribution: ICTjournal (reading the EFK report)
    source_url: https://www.ictjournal.ch/etudes/2026-10-26/la-confederation-appelee-a-renforcer-la-sauvegarde-de-ses-donnees-sur-microsoft
  extended_notes: 'Dates: EFK page and admin.ch press release 2026-10-21; Netzwoche 2026-10-22; ICTjournal 2026-10-26 (inside its 121 h lookback; the story is 9 days old at this fire). Audit period February
    to April 2026 (Netzwoche, ICTjournal). Defender reading sourced from the report as relayed: independent M365 backup with regular restore tests (EFK asks BIT for a local solution and regular restore
    testing; BIT says one is in production), a named monitored subset of M365''s security analytics, configuration-drift control against a reference (DSC), a fixed cadence for reviewing security-relevant
    tenant settings, customer-managed keys as a planned second step, and use of Microsoft''s Service Trust Portal audit material, which EFK says the Confederation does not evaluate systematically. Related
    but not the same story: DVS/Eraneos study on replacing M365 (Netzwoche 2026-10-29) is a cost and sovereignty study and was dropped. Registry already carries incident:ch-efk-federal-cyber-governance-audit
    (a different EFK audit). Suggested rating: reliability A, credibility 2.'
