  extended_notes: 'Dates: the document is dated 2026-10-02 (header ''V3.02 / 02.10.2026''); privatim''s own announcement is dated 2026-10-13 (feed pubDate Tue, 13 Oct 2026 12:44:00 +0000 and the FR page''s
    visible date ''mardi, 13 octobre 2026''); dcod.ch relayed it on 2026-10-27, which is why it surfaces now through dcod''s 121 h lookback. dcod.ch''s own sentence that the revision ''hardened'' use is
    its framing; the ''inadmissible in most cases'' wording in the sheet is attributed in a footnote to privatim''s resolution of 2025-11-18, so it is not new in this revision. Defender reading (sourced
    from the sheet): the five risk areas map onto things a cantonal or communal CISO can ask of a SaaS or hosting provider in writing: who holds the keys, where support staff access from (access from abroad
    counts as foreign processing), whether telemetry and logs are covered by the same contract, a sub-processor list with prior notice and a termination right, security-incident and change notifications
    to the public body, audit rights and audit reports on request, and an exit process fixed at signature. PDF caveat: the bridge pdf text of the DE and FR PDFs carries stray spaces and hyphen breaks; the
    evidence originals above were chosen because they match literally after whitespace normalisation. Suggested rating: reliability A (issuing body), credibility 2. Not an obligation created by a rule-maker:
    it is the conference''s reading of data-protection law for its members'' bodies; whether a given canton binds itself to it is not stated in the sources read.'
