    urls: ["https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html"]
  - claim_id: badf0d84e1
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: cited
    text: "CISA lists the flaw as exploited and NCSC Switzerland reports active exploitation, so an instance reachable on an affected version needs a compromise assessment as well as the upgrade; Rapid7's interim controls (restrict anonymous access to public projects and stop untrusted users creating or writing to public projects) reduce exposure only to the path it demonstrated ("
