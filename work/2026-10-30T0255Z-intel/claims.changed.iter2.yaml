    surface: "body"
    kind: cited
    text: "Alpine saw the attack as crashes of GitLab worker processes after crafted CI configurations from a newly registered account, with 502 errors and failed CI jobs, and notes that a successful exploit would leave no crash and no trace in the web logs ("
