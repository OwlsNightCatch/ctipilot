  - claim_id: 23c66a4d0a
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-12 fixes CVE-2026-97229 (CVSS 3.1 10.0), an integer overflow in the CI/CD regular-expression compiler that lets code run on the server as the git user through a crafted expression in a CI/CD configuration. CISA listed it as exploited on 2026-10-29 and NCSC Switzerland reports active exploitation on the strength of Alpine Linux's account of a newly registered account that crashed its GitLab 19.3.4 workers eight times on 2026-10-20 and 21, after which Alpine rebuilt the instance because it could not rule out code execution; GitLab's fix is a patch to the Ruby bundled in its own packages and images, so an installation with its own Ruby needs Ruby 3.3.13, 3.4.12 or 4.0.9 as well. Self-managed CE and EE from 19.2 before 19.2.8, 19.3 before 19.3.5 and 19.4 before 19.4.2 are affected, Rapid7 published a proof of concept on 2026-10-13, and the path it demonstrated needs push access to a public project."
  - claim_id: c68279b76c
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed GitLab CE and EE instance on 19.2, 19.3 or 19.4 to 19.2.8, 19.3.5 or 19.4.2 now, internet-reachable instances and instances that allow open sign-up or public projects first, because CISA lists the flaw as exploited and NCSC Switzerland reports active exploitation; where GitLab runs on its own Ruby (a source install or a container image that does not use GitLab's packages) also install Ruby 3.3.13, 3.4.12 or 4.0.9, because the fix is a Ruby patch that only GitLab's official packages carry. On any instance that was reachable on an affected version, run the six detections GitLab published on its release page and treat the CI/CD variables, runner registration tokens and deploy keys of any hit, or of an instance where compromise cannot be ruled out, as exposed."
