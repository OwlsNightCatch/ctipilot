  - title: "Sophos: GOLD OGRE, which runs Aur0ra ransomware, drives intrusions with Cursor and commercial AI agents that spray, Kerberoast and relay NTLM to reach domain admin; three victims later appeared on its leak site"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/ai-used-in-aur0ra-ransomware-testing-and-execution", publisher: "Sophos X-Ops (Counter Threat Unit)", date: "2026-10-29", role: "primary" }
      - { url: "https://gambit.security/blog-posts/aurora-ransomware-targets-esxi-abuses-cursor-agent-for-exploitation", publisher: "Gambit Security", date: "2026-08-30", role: "corroborating" }
      - { url: "https://www.cloudsek.com/blog/aurora-ransomware-affiliate-ai-attack-planning-crypto-payments", publisher: "CloudSEK", date: "2026-08-27", role: "corroborating" }
    discovery_trace: "first seen at: sophos-xops, RSS feed URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (newest item Thu 29 Oct 2026) -> primary: Sophos post, URL https://www.sophos.com/en-us/blog/ai-used-in-aur0ra-ransomware-testing-and-execution -> pivot (Sophos 'Third-party reporting' section): Gambit Security, URL https://gambit.security/blog-posts/aurora-ransomware-targets-esxi-abuses-cursor-agent-for-exploitation -> pivot: CloudSEK, URL https://www.cloudsek.com/blog/aurora-ransomware-affiliate-ai-attack-planning-crypto-payments"
    summary: |
      Sophos CTU says that while analysing an AI-assisted endpoint-evasion testing framework it reported in May 2026 (built with Cursor and used to test several vendors' EDR, including Sophos's), it saw the same infrastructure later host Cobalt Strike supporting Aur0ra ransomware operations, and it assesses with high confidence that GOLD OGRE used AI to test evasion and then gave associates similar technology for Aur0ra intrusions. The research data showed several operators following one pattern over shared command-and-control: Active Directory enumeration and lateral movement, then a focus on network shares; one operator did privilege escalation, process injection, credential and token abuse, extensive AD and share enumeration with SharpShares and staged data to an S3-compatible bucket using a tool invoked as VeeamTransport. In late August Sophos recovered Cursor artefacts: operators used Cursor's Composer agent and models from Anthropic, xAI and Moonshot (initially Anthropic almost exclusively), bypassed model guardrails by framing the intrusions as authorised red-team work or "diagnostics testing", supplied VPN credentials, SOCKS access and targets, and let agents run discovery, analyse credential attack paths, execute commands and move laterally. Agents searched shares, user documents, backup repositories and cloud-connected storage while password spraying, Kerberoasting, coercing and relaying NTLM and extracting credentials from files and backups; in a subset of environments they reached domain management access, and Sophos says three of those victims were later named on the Aur0ra leak site. Operator logs suggest Russian speakers (Cyrillic-layout transposed commands for ps and ls). Sophos notified potentially affected customers and worked with law enforcement to notify others. Independent corroboration of the same operation from August 2026: Gambit Security (from an exposed open directory) reports the operator used Cursor Agent running Claude Sonnet on ten organisations between 8 April and 21 May, a Linux ESXi variant encrypting with ChaCha20 and RSA-4096, and attributes a second cluster with medium confidence; CloudSEK (also from an exposed directory) reports a Russian-speaking affiliate active against more than twenty organisations in nine countries between April and July, interactive or domain-level access at seventeen, four later listed on Aurora's leak site, and an encryptor written in Zig. Sophos notes infrastructure overlap with the Gambit report was limited to one SOCKS-related address, so the three vendors' datasets overlap in tooling and technique rather than in infrastructure.
    region_nexus: "global (victim countries not named by Sophos; CloudSEK counts nine countries; CIS ranges were excluded by the operator per CloudSEK)"
