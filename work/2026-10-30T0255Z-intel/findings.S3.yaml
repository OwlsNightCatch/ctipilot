    extended_notes: |
      Highest-relevance item of this sweep for a government constituency: foreign-ministry and presidency targeting in Europe, and the Greek case shows the mechanism (stale mail-server directory export with unrotated authentication keys plus VPN material from a mailbox and an old leak). Recommended as its own threat entry that declares the ARTEX/Storm-0940 entry (2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse) in references[]; it is a distinct actor and campaign, not a revision of the Microsoft finding. Hardening levers CrowdStrike names: enforce SAML signature validation, require IMDSv2, restrict cloud-role command-execution permissions, rotate signing and pre-authentication keys after any exposure including keys in old backups or exports, keep EDR on every host including servers thought unreachable. Hunt markers CrowdStrike lists (behavioural): artx or artex strings in command lines, artx-prefixed cloud roles, administration-command comments starting art18-, and a ProgramData artx5v directory. Detection concept: web-server logs for SAML endpoints accepting unsigned assertions; metadata-service requests from application hosts; legitimate-looking game-overlay binaries renamed svchost.exe loading graphics-hook DLLs. CrowdStrike's own wording: the activity is human-directed with agents run in parallel. Admiralty suggestion B2.
