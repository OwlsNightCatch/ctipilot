  - title: "CrowdStrike: VAPOR PANDA ran the ARTEX agent framework against more than 200 organisations from 17 October, including foreign ministries in Europe and a Greek government entity, and deployed BLOODALCHEMY through a renamed GameHook binary"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/", publisher: "CrowdStrike", date: "2026-10-29", role: "primary" }
    discovery_trace: "first seen at: crowdstrike, feed URL https://www.crowdstrike.com/en-us/blog/feed (additional-feeds sweep; newest item 'VAPOR PANDA Uses AI-Driven ARTEX to Scale a Global Espionage Campaign', Oct 29 2026) -> primary (no pivot needed): CrowdStrike post, URL https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/ (fetched with extract)"
    summary: |
      CrowdStrike OverWatch reports that from 17 October 2026 a single ARTEX controller, which CrowdStrike Intelligence links to VAPOR PANDA infrastructure, directed exploitation against entities in at least 14 countries over 11 days; it intermittently exposed tooling, target files and agent transcripts, which is how CrowdStrike saw the engagements. Named targets include foreign ministries in Latin America, Europe, Asia and the Middle East, a Middle East interior ministry, one European country's foreign ministry, presidency, prime minister's office and defence, justice, finance and intelligence entities, 19 US pharmaceutical, semiconductor, defence, nuclear and financial organisations, and telecommunications providers in the US, Belgium and the Philippines; post-exploitation was confirmed at nine organisations and password spraying and credential scanning hit at least 12 more, including US think tanks and government entities in Europe. VAPOR PANDA ran ARTEX mainly on the Chinese DeepSeek model plus a second commercial model CrowdStrike could not confirm; one intrusion consumed about 1.4 billion planning-agent input tokens. A human operator issued instructions in Chinese and timestamps were in China Standard Time. Tradecraft per CrowdStrike: at a US pharmaceutical firm the agent chained an unsigned SAML assertion with an XML external entity flaw to query the cloud instance metadata service and obtain a role able to run administration commands on thousands of instances; at another it deployed web shells, abused an unauthenticated orchestration service for root in a container environment, read LAPS passwords and abused resource-based constrained delegation; against a Greek government entity the operator supplied a 2022 directory export from the mail server whose authentication keys had likely never been rotated, the agent forged an administrator token, read mailboxes and used VPN configurations from a sent-mail folder plus a client key from a May 2024 leak to reach the internal network. The operator also told the agents to find domain Windows hosts without the CrowdStrike Falcon sensor (judged from tasklist and folder listings). At the Middle East interior ministry and a Latin American foreign ministry the actor loaded the BLOODALCHEMY backdoor (first documented October 2023) with a legitimate GameHook binary renamed to svchost.exe that loads a malicious DLL, which decrypts a configuration payload file. CrowdStrike states this campaign is separate from the Storm-0940 ARTEX activity Microsoft reported, and assesses it is VAPOR PANDA's first observed use of AI-driven tooling and a broadening into pharmaceuticals, semiconductors, nuclear, defence and foreign ministries; VAPOR PANDA has targeted government, think tanks, energy and extractive organisations in Europe, North America, Oceania and the UK since 2021. Single-vendor report from CrowdStrike's own telemetry and recovered controller transcripts; the attribution to VAPOR PANDA is CrowdStrike's assessment from infrastructure and malware links, and no second independent source was available yet.
    region_nexus: "Europe and global; a European foreign ministry and presidency, a Greek government entity and European government password-spraying targets are named; Swiss entities are not named"
    primary_sector_nexus: "direct (foreign ministries, presidencies, interior and finance ministries and government entities are the stated targets)"
