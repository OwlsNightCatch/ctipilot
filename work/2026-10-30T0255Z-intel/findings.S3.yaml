  - title: "Cyble: INJ3CTOR3's FreePBX implant now uploads 17 configuration files of trunk, AMI, database and mail-relay secrets, so cleaning the host no longer ends the toll-fraud exposure"
    sources:
      - { url: "https://cyble.com/blog/hijacked-pbx-to-stolen-trunk-inj3ctor3s-campaign/", publisher: "Cyble Research & Intelligence Labs", date: "2026-10-28", role: "primary" }
    discovery_trace: "first seen at: malware-news, feed URL https://malware.news/latest.rss?page=3 (item 'From Hijacked PBX to Stolen Trunk: INJ3CTOR3's Campaign Evolves', 28 Oct 2026 05:51 UTC, lookback 146 h) -> primary: Cyble CRIL post, URL https://cyble.com/blog/hijacked-pbx-to-stolen-trunk-inj3ctor3s-campaign/ (link named in the malware.news copy; fetched with extract)"
    summary: |
      Cyble Research & Intelligence Labs (CRIL) compared its April 2026 artefacts, behind its May report on the JOMANGY PHP web shell used by INJ3CTOR3 against Asterisk-based phone systems, with a 9 September collection from the operator's two staging hosts. The infection and persistence code is nearly unchanged, but the installer script now uploads 17 hand-listed configuration files covering FreePBX, Issabel and Elastix layouts to both staging hosts, repeated every minute while the host stays infected: Asterisk SIP and PJSIP trunk and extension files, manager.conf (AMI users), the freepbx, amportal, issabel and elastix configuration files (database and AMI passwords) and Postfix's SASL password file. A stolen trunk secret lets the operator register to the carrier from any machine and place calls as the victim without touching the PBX, unless the carrier restricts the trunk to the victim's addresses, so removing the implant stops only the web-shell route. Cyble warns that rotating credentials on a still-infected host hands the new secrets to the operator, so rotate trunk secrets with the carrier, every AMI user, the AMPDBPASS and MySQL root passwords and the SMTP relay account only after the host is clean. Other changes: web-shell watermark and gate hash now differ per build, so hunts built on the May values miss current infections (Cyble says behavioural detections still apply); the takeover script grew from 367 to 620 lines mostly to remove rival actors' implants and SSH keys; the FreePBX panel button forges an administrator session through FreePBX's own class without any password, so changing the admin password does not stop it; and a seven-line .htaccess under the admin views directory lets requests whose path begins with an encoded space or tab reach the web shell, so the access log records the requested path, not the file that answered, and a filename search can find nothing on an infected host. Trunks written straight into Asterisk custom configuration files carry calls but do not appear in the FreePBX console. Cyble's detection advice: alert on outbound HTTP POSTs from a PBX to unexpected paths or hosts (egress allow-listing closes the channel), and on carrier-side trunk registrations from outside your own ranges, premium or international destinations, off-hours calling and unusual concurrency, with spend caps and destination blocks. Cyble says the staging hosts stopped responding in late September, that infected PBXs still try to upload every minute to addresses that could be reassigned, that it saw the upload commands in code but never captured one in transit and holds no victim list, and it urges law enforcement and national CERTs to work with the hosting providers to preserve data and sinkhole the addresses. Single vendor; INJ3CTOR3 has been documented since 2020 by Check Point, Unit 42, Fortinet and Cyble.
