  - title: "ANNUAL REPORT — Cisco Talos IR trends Q3 2026: public administration tied with finance as most-targeted sector; vishing-to-RMM and EDR killing in a quarter where ransomware reached 27% of engagements"
    sources:
      - { url: "https://blog.talosintelligence.com/ir-trends-q3-2026/", publisher: "Cisco Talos", date: "2026-10-29", role: "primary" }
    discovery_trace: "first seen at: talos, RSS feed URL https://blog.talosintelligence.com/rss/ (newest item Thu 29 Oct 2026 14:00 GMT, majors sweep) -> primary (no pivot needed): Talos post, URL https://blog.talosintelligence.com/ir-trends-q3-2026/ (fetched with extract)"
    summary: |
      Quarterly report from Cisco Talos Incident Response (first-hand engagement data, so the percentages describe Talos IR's own customer base, not the wider population). Phishing was the leading initial-access technique at 37% of engagements (down from over 50% the previous quarter) and included voice phishing in which the caller impersonates the IT help desk to get the victim to allow remote access through a legitimate remote-management (RMM) tool; exploitation of public-facing applications was second at 33%, mostly edge devices such as security gateways and remote network-management interfaces. Ransomware and pre-ransomware cases were 27% of engagements, up from a maximum of 20% in the previous four quarters; named families were The Gentlemen, Qilin, Rhysida and the closed group Interlock, plus a new variant, VYPR, which Talos calls operationally immature (no leak site when seen, Conti-derived source with minimal changes, multi-day exfiltration, an unusually large number of vulnerable drivers deployed to kill EDR). The VYPR intrusion started with a Microsoft Quick Assist session obtained by vishing, after which the RMM software ran PowerShell that pulled an MSI; Talos names MeshAgent, Rclone, PsExec, an IP scanner and mstsc as tools. Interlock operators tried to uninstall Cisco Secure Endpoint, used PsExec and taskkill to stop security services and integrity checkers (cscm.exe, sfc.exe), disabled Defender real-time protection and cleared event logs; Talos notes earlier Interlock use of a malicious WDAC policy to kill EDR. Talos says it attributed most telecom espionage intrusions "with high confidence" to China state-sponsored actors including Salt Typhoon, entering through valid credentials and CVE-2023-20198 in web management interfaces, then using native device features (VPN, traffic mirroring, management protocols), creating privileged accounts and disabling logging. On AI, Talos describes an insider hired under false credentials who installed GitHub Copilot CLI and Claude Code (no malicious activity found) and a compromised macOS endpoint, infected through a trojanized application, that was scripted to scrape keychain credentials tied to Claude Code. Targeting: financial and public administration each 18% of engagements, health care third. Most common weaknesses: insufficient logging (over 40% of engagements), credential and secret management (33%), missing or weak authentication and MFA (33%). Talos recommends at least 90 days of centralised retention, phishing-resistant MFA (FIDO2/WebAuthn), restricting self-service MFA enrolment and blocking legacy authentication.
    region_nexus: "global (Talos IR customer base; no regional split in the post); Swiss nexus is sector-level only"
    primary_sector_nexus: "direct (public administration named as a most-targeted sector alongside finance)"
