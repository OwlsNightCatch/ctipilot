    discovery_trace: "first seen at: msft-ti via `msft-secblog recent 30` (newest item 2026-10-29 16:00 UTC, majors sweep) -> primary (no pivot needed): Microsoft Security Blog post, URL https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/ (fetched with extract)"
    summary: |
      Microsoft Threat Intelligence assesses overall AI adoption by North Korean threat actors as high and places them in four stages: Jade Sleet, Coral Sleet and Jasper Sleet operationalized (AI embedded in all workflows), Diamond Sleet, Onyx Sleet, Pearl Sleet and Sapphire Sleet accelerating, Emerald Sleet expanding, none emerging. New facts: since late October 2026 Onyx Sleet and Pearl Sleet have used the open-source agentic penetration-testing framework ARTEX in operations (the same framework behind the Storm-0940 and VAPOR PANDA reporting); since April 2026 Coral Sleet has run a workflow to trojanize private GitHub repositories and feed them into its malware chain, which Microsoft says was highly likely built with an AI development platform; Sapphire Sleet likely used AI in the August 2026 Rust software compromise, with malware that used dynamic .NET compilation in post-exploitation, most likely for defence evasion; Jade Sleet ran job-themed outreach through three front companies in one week (8 to 12 June 2026) posing as recruiters for a spoofed AI blockchain-intelligence firm; Onyx Sleet produced over 100 target-specific PDF lures in August and September 2026, with metadata showing dozens created within minutes; Diamond Sleet returned to oil and gas targeting since August 2026 for the first time since 2023, widened to communications and internet-policy bodies, kept targeting defence, and built fake communications-technology front companies aimed at telecommunications firms. Microsoft states AI-enabled operations remain human-directed and not autonomous, and that actors target cryptocurrency and finance, IT firms and software supply chains, government entities and education. Guidance is generic (block device-code flow, scrutinise staffing-company employees and remote hires, Defender and Entra detections); Microsoft lists actor-named Defender alerts, Entra sign-in alerts for suspected Jasper Sleet entities and ProcmacSteal detections for the Rust compromise. Single vendor, first-party telemetry; the post gives no victim counts and no Swiss or European nexus.
    region_nexus: "global; government entities named as one target class, no European or Swiss nexus stated"
    primary_sector_nexus: "indirect (government entities and software supply chains are named target classes; developers and recruiters are the lure audience)"
