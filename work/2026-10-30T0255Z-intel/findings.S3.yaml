      S1 (vulnerability) domain item returned as a safety net: it was not in the prior-coverage index and S1's progress file had not listed it when this was written; the main agent should dedupe against S1. Narrow race condition, so exposure is limited to sites mid full-package update, but exploitation attempts are reported. Exposure: read the version in Dashboard > Updates or wp-includes/version.php; check that background auto-updates reached 7.1.4 or the branch fix, and that wp-content/upgrade is not web-readable (deny the path at the web server). Post-exposure checks Wordfence lists: requests to PHP files under wp-content/upgrade in access logs, unfamiliar administrator accounts, unexpected plugins or PHP files. The mapping is T1190 only; no post-exploitation is reported. Admiralty suggestion A/B reliability, credibility 2.
