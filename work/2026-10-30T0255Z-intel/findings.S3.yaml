  - title: "EDK II PXE driver flaw CVE-2026-97631: an unauthenticated ICMP error message during network boot corrupts DXE memory and can run code before Secure Boot; overlaps S1 (vulnerability domain)"
    sources:
      - { url: "https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m", publisher: "TianoCore EDK II project (GitHub security advisory)", date: "2026-10-22", role: "primary" }
      - { url: "https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/", publisher: "Ars Technica", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: malware-news, feed URL https://malware.news/latest.rss?page=3 (Eclypsium copy of the Ars Technica article, 27 Oct 2026 23:25 UTC) and golem-security, feed URL https://rss.golem.de/rss.php?tp=sec&feed=RSS2.0 (28 Oct 2026) -> pivot: Ars Technica article, URL https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/ -> primary: TianoCore advisory GHSA-99cj-7hg9-mp4m, URL https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m (named in the Ars article)"
    summary: |
      The TianoCore EDK II advisory 'Pre-boot RCE in EDK II PXE driver' says that while a machine is PXE-booting over IPv4 or IPv6, an unauthenticated network attacker who can deliver ICMP error messages to it can corrupt DXE-phase memory and execute arbitrary code before the operating system loads and before Secure Boot or measured boot has verified or measured any OS component. Mechanism: the PXE Base Code driver (NetworkPkg/UefiPxeBcDxe) keeps an ICMP-error receive request open and copies each message into the fixed 504-byte Mode.IcmpError field of its private context; the IPv4 and IPv6 handlers (PxeBcIcmpErrorDpcHandle and PxeBcIcmp6ErrorDpcHandle) mishandle bounds, copying beyond the field and advancing the destination by the cumulative length, so an oversized message overwrites adjacent data; nothing earlier restricts message length. Impact per the advisory: deterministic corruption and a DXE-core exception on the next ICMP error, hanging the boot (denial of OS provisioning or recovery), and, for an attacker who knows the target firmware build, a counterfeit event planted in the same packet so that CoreSignalEvent dispatches attacker-supplied bytes in ring 0; the attacker needs only a unicast ICMP error addressed to the client from any network distance and the exposure window is the duration of the PXE boot. The fix is pull request 13302; credit goes to Alex Matrosov (Anthropic) and Dan Holmes-Mitra (Google). Ars Technica gives the identifier CVE-2026-97631 and a severity of 9.5 out of 10, says the discoverers had arranged coordinated disclosure for January, that AMI's public pull request last month detailed the flaw and carried a fix, which prompted TianoCore's advisory, and that firmware patching across server vendors and cloud providers is slow. The two sources read do not report exploitation and name no fixed vendor firmware versions; affected scope is EDK II-based firmware with PXE or HTTP network boot active, depending on each vendor's update.
    region_nexus: "global; server and appliance firmware in data centres"
    primary_sector_nexus: "indirect (servers in government data centres that PXE-boot for provisioning or recovery)"
    sector: "cross-sector"
    cves: [CVE-2026-97631]
    techniques: [T1542]
    affected_products: ["TianoCore EDK II (NetworkPkg UefiPxeBcDxe)", "UEFI firmware derived from EDK II"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "S1 (vulnerability) domain item; the advisory page metadata says 2026-10-22 and the Ars Technica coverage is 2026-10-27, so it sits outside the 26 h window; included because no entry covers firmware network-boot exposure and fixes depend on vendor firmware releases"
    evidence:
      - { quote: "an unauthenticated network attacker who can deliver ICMP error messages to it can corrupt DXE-phase memory and execute arbitrary code before the operating system loads", attribution: "TianoCore EDK II project (GitHub security advisory)", source_url: "https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m" }
    extended_notes: |
      Technique mapping is loose (T1542 Pre-OS Boot: the entry's reading, the advisory states pre-OS code execution but no persistence). Defender takeaway: inventory where PXE or HTTP network boot is enabled on servers and appliances and disable it where unused; track vendor firmware advisories for the EDK II ICMP fix; treat PXE and provisioning VLANs as segments where unsolicited ICMP error messages should not reach clients. Detection is largely out of reach (pre-OS), so the lever is exposure reduction and firmware patching. Admiralty suggestion A/B reliability, credibility 2.
