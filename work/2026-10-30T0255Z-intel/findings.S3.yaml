      - { quote: "The most serious is an unauthenticated race condition in the Core update process that can lead to remote code execution.", attribution: "Wordfence", source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/" }
      - { quote: "During the first 21 hours, we recorded more than 18,500 requests targeting staged `setup-config.php` installer paths.", attribution: "Wordfence", source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/" }
