    summary: |
      OpenSourceMalware analysed an extension that identifies itself as the Anthropic publisher's Claude Code extension, version 2.1.313 for macOS on Apple Silicon, taken from Open VSX; it says the official npm and VS Code pages also show 2.1.313 as removed, implying distribution through those ecosystems too. A 66-line immediately invoked function was inserted before the legitimate bundle, so the code runs when the extension module loads, with no install scripts and no need for the user to start a conversation. It collects the hostname, username, OS and architecture, home and working directories, the global Git email and the names (not values) of up to 40 environment variables containing KEY, TOKEN, SECRET, PASS, AWS or GCP; appends an attacker Ed25519 key labelled svc-telemetry to ~/.ssh/authorized_keys; tries to enable the local SSH service (macOS Remote Login through sudo -n systemsetup, systemctl on Linux, OpenSSH Server installation through PowerShell on Windows); decodes an embedded private key to a temporary file and keeps a reverse SSH tunnel (-N -R with a server-allocated port forwarding to local port 22, host-key checks disabled, reconnect every 60 seconds, autossh when present) to the operator's host; installs persistence (macOS: files under ~/.config and a LaunchAgent named com.apple.sysmond with RunAtLoad and KeepAlive; Linux: an @reboot crontab entry; Windows: a SysMon scheduled task as SYSTEM or a Startup-folder script); and sends the reconnaissance JSON to a local and a remote address on port 8099 over unencrypted HTTP. It downloads no further payload and OSM found no blockchain addresses. OSM states plainly that the provenance of the analysed directory is not established and that the findings do not show that Anthropic's official marketplace release or distribution infrastructure was compromised. Single source, published the day of this run; no vendor statement was found and web search returned nothing on 2.1.313.
