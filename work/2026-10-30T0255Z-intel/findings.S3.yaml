  - title: "WordPress 7.1.4 fixes an unauthenticated upgrade-window RCE in core 4.7 to 7.1.3 and Wordfence already sees about 18,500 probing requests; overlaps S1 (vulnerability domain)"
    sources:
      - { url: "https://wordpress.org/news/2026/10/wordpress-7-1-4/", publisher: "WordPress.org (WordPress Security Team)", date: "2026-10-28", role: "primary" }
      - { url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/", publisher: "Wordfence", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: wordfence, RSS feed URL https://www.wordfence.com/feed/ (additional-feeds sweep; item 'WordPress 7.1.4 Patches Unauthenticated Upgrade-Window RCE; Exploitation Attempts Detected After Release', Thu 29 Oct 2026 21:58 UTC) -> primary: WordPress.org announcement, URL https://wordpress.org/news/2026/10/wordpress-7-1-4/ (extract) -> corroboration: Wordfence post, URL https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"
    summary: |
      WordPress released 7.1.4 on 28 October 2026 as a short-cycle security release; the project's announcement lists, among others, a weakness in the upgrade process that can lead to remote code execution during the upgrade window (credited to Umut Bayram), several stored XSS issues (one in privacy data-removal requests reported by Anthropic), Interactivity API issues including a stored denial of service, and a stated total of 22 vulnerabilities, with backports for older branches. Wordfence, which scores the upgrade-window flaw CVSS 8.1, says core 4.7 through 7.1.3 is affected: during a full-package core update the new files are unpacked into a predictable directory under wp-content/upgrade that includes the installer, and on servers where that directory is web-accessible an unauthenticated attacker who requests the installer at the right moment can progress to PHP code execution. Preconditions per Wordfence: a full-package update (which contains the installer), web and PHP access to the staging tree, a predictable or discovered staging path and winning a race that normally lasts seconds, so attack complexity is high but repeated polling improves the odds. Fixed releases listed include 7.1.4, 7.0.8, 6.9.11, 6.8.12 and 6.7.11 down to 4.7.39; WordPress 4.6 and earlier get no fix. The fix randomises the staging directory, adds an index guard and prevents unsafe promotion of staged configuration data. Wordfence reports its new firewall rule's first match arrived nine minutes after deployment and, in the first 21 hours, more than 18,500 requests aimed at staged setup-config.php installer paths, with two large sources polling small groups of sites for roughly 14.5 hours, and says some probes used the exact vulnerable layout; the Wordfence rule reaches free-tier users only on 27 November, and the rule needs the firewall's extended protection because the request goes straight to a PHP file. Neither source gives a CVE identifier for the flaw. Wordfence also notes the release updates bundled root certificates after the eMudhra revocation.
