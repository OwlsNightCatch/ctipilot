    summary: |
      Lumen's Black Lotus Labs says it tracked a Volt Typhoon covert access network it calls Silent Train for about three years (first seen November 2023, weeks before the first KV-botnet disruption; activity rose after the second disruption in January 2024), notified hundreds of victims and used that visibility to identify four confirmed and one likely zero-day campaign against endpoint-management, network-management, out-of-band and SD-WAN platforms. Silent Train is not a persistent botnet: operators exploit exposed web interfaces on SOHO, IoT and enterprise devices on demand, chain four to six hops (a VPS outside the US, a second VPS, compromised non-US SOHO or IoT devices, then a compromised US device as exit), deploy only temporary SSH services, keys and living-off-the-land tools, and remove all artefacts afterwards; chains were built in under two minutes and sessions averaged about four hours. Black Lotus Labs counts more than 27 exploited device classes (TP-Link, Netgear Orbi, Intelbras, Ruckus, SATO, Zyxel, Cambium, and later Fortinet, Cisco, PRTG, Mirth Connect and CyberPanel), observes fixed roles per device type (Intelbras only as overseas relays, Netgear Orbi as US hops) and, from early 2025, longer-lived enterprise platforms (one to three months) as final hops; reverse tunnels through Chisel and FRP appeared alongside SSH chaining. Operator activity fell Monday to Friday between 09:00 and 22:00 China Standard Time with pauses at Chinese New Year. The zero-day campaigns Lumen describes: Quest KACE (moderate-confidence assessment, more than 30 victims, declined after Quest's October 2025 fixes; the actor stayed on the KACE server and used its admin functions to harvest and exfiltrate credentials), Versa Director (CVE-2024-39717 per THN; in-memory JAR web shell), N-able N-central (CVE-2025-8875 and CVE-2025-8876), Cisco Catalyst SD-WAN (CVE-2026-20127, exploited by late 2025 and continuing after Cisco's February 2026 disclosure) and VeloCloud Orchestrator (CVE-2026-16812, Arista advisory). Post-incident work with partners found in-memory web shells, credential harvesting, abuse of native endpoint-control and remote file-transfer features, and altered or erased logs. Through the same network Black Lotus Labs also saw targeting of ManageEngine, Ivanti, F5, Check Point, Palo Alto, ServiceNow and ArcGIS but says its telemetry could not always separate known from undisclosed vulnerabilities. Victims: telecommunications, government, defence contractors, satellite and mission-critical communications, MSPs and IT firms, universities with defence ties and critical infrastructure including water, energy, rail, maritime, aviation and emergency services, concentrated in Hawaii, California and Texas. Attribution maker: Lumen attributes the network to Volt Typhoon from its own backbone telemetry, victim notifications and incident-response work; Cisco Talos independently assesses overlap between UAT-11473's infrastructure and Silent Train (already in the store). Anonymous-source claims in Nextgov about Energy Department facilities are not corroborated by Lumen.
