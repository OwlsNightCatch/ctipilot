  - title: "Group-IB: MadApe is a previously undocumented Microsoft device-code phishing kit with German-language SharePoint-style PDF lures across 155 root domains"
    sources:
      - { url: "https://www.group-ib.com/blog/madape-microsoft-device-code-phishing-kit/", publisher: "Group-IB", date: "2026-10-29", role: "primary" }
    discovery_trace: "first seen at: group-ib, RSS feed URL https://www.group-ib.com/blog/rss.xml (additional-feeds sweep; item 'MadApe: The Code That Opens the Door', Thu 29 Oct 2026 07:32) -> primary (no pivot needed): Group-IB post, URL https://www.group-ib.com/blog/madape-microsoft-device-code-phishing-kit/ (fetched with extract)"
    summary: |
      Group-IB Threat Intelligence describes MadApe, a device-code phishing kit it found no earlier public description of. The chain: a phishing email carries a PDF styled as a SharePoint file-share notice; its link leads to an intermediary page (a SharePoint-themed access page or a human-verification gate) whose redirect target can be configured per deployment; the next page shows a device code, copies it to the clipboard when clicked and reports the interaction to the kit's backend, then sends the victim to the genuine Microsoft device-login portal to paste the code and sign in, so the attacker's session is created on Microsoft's own infrastructure and no password is captured on a phishing page. Templates impersonate SharePoint, OneDrive, Teams, Adobe Acrobat, DocuSign and Microsoft sign-in while sharing the same JavaScript and backend endpoints; PDF lures and intermediary pages exist in English, German, Portuguese and Hebrew, with Hebrew emails seen first. Group-IB's dataset has 155 root domains, 97 of which carried device-code components; 117 of 154 analysed domains were registered between mid-June and late August 2026, 86% at one registrar, and the operator panel login names the kit. Group-IB's detection and hardening advice: inventory legitimate device-code use via the Authentication Protocol filter in Entra sign-in logs, block the device-code flow with a Conditional Access policy using the Authentication flows condition (report-only first), keep Continuous Access Evaluation on, hunt for device-code sign-ins from unfamiliar apps or locations and for interrupted attempts followed by success, and look in proxy or DNS telemetry for the kit's code-status endpoints; after confirmed compromise revoke sessions and refresh tokens and review application permissions, since session revocation may not invalidate every issued token. Single vendor; no victim sector or count given.
    region_nexus: "global; German-language lures are present, which puts German-speaking Swiss users in the lure audience (Group-IB names no victims or countries)"
