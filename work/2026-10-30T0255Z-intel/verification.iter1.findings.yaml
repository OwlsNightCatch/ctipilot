  item: "2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce (update record 2026-10-30T03:52:05Z, sourcing_note, run-record note)"
  url_or_quote: "record summary: \"no source names an actor, a victim or an entry path\"; sourcing_note: \"no source names the exploiter, a victim or an entry path\""
  summary: "Contradicted by the entry's own cited NCSC Switzerland advisory (https://security-hub.ncsc.admin.ch/#/posts/13051, history 'Added reports of exploitation attempts', 2026-10-29): '**update 29.10.2026** Current exploitation status: Active exploitation - Alpine Linux reported exploitation attempts of CVE-2026-97229'. Alpine's post (https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html, 2026-10-28) names a victim (its own GitLab, 19.3.4) and an entry path (newly registered account sending crafted CI configurations, 8 worker crashes). Fix through a correction record on the entry; the run-record sentence that GitLab 'stays high because no source names an exploiter or an entry path' rests on the same false premise."
- code: F8
  category: needs-more-research
  section: updated-entry
  item: "2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce (actions[0], Defender takeaway, update section)"
  url_or_quote: "\"upgrade to 19.4.2, 19.3.5 or 19.2.8 now\""
  summary: "The update misses the first-hand exploitation report and two actionable consequences that the run's own S1 deep read held (ruby-lang.org news 2026-10-23; KEV note 'Other products can potentially be affected by the same underlying Ruby/Onigmo Integer Overflow issue'). (a) Alpine Linux, 2026-10-28: 'Upgrading to GitLab 19.3.6 on October 22 didn't fix the vulnerability. The fix isn't in GitLab's own code but in a patch to Ruby, which GitLab applies only in its official packages'; source or custom-image installs need Ruby 3.3.13, 3.4.12 or 4.0.9. (b) GitLab's 2026-10-21 release 19.5.1/19.4.3/19.3.6/19.2.9 fixes a further CVSS 10 regex-compiler RCE (CVE-2026-110264, entry 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce); the action sends readers to the older 19.4.2/19.3.5/19.2.8 builds and the entry has references: []. (c) Observable behaviour from Alpine (new account, crafted CI config, worker crashes and 502s, container image download) belongs in Detection. Suggested query: 'Alpine Linux GitLab security incident CVE-2026-97229'."
