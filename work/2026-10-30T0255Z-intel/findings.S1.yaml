        attribution: "WordPress.org HelpHub (Version 7.1.4)"
        source_url: "https://wordpress.org/documentation/wordpress-version/version-7-1-4/"
      - quote: "WordPress Core is vulnerable to Remote Code Execution in versions 4.7 through 7.1.3."
        attribution: "Wordfence"
        source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"
      - quote: "Wordfence telemetry shows that threat actors are already actively attempting to exploit the vulnerability."
        attribution: "Wordfence"
        source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"
      - quote: "we recorded more than 18,500 requests targeting staged"
        attribution: "Wordfence"
        source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"
      - quote: "In lab environments, the vulnerable staging directory normally remained available for only seconds."
        attribution: "Wordfence"
        source_url: "https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"
      - quote: "The exception is a race condition in the upgrade process that ends in remote code execution with no account at all."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-7-1-4-security-release/"
    extended_notes: |
      Exposure: WordPress sites on any release from 4.7 (Wordfence) up to the version before the fix for their branch (patched: 4.7.39, 4.8.34, 4.9.35, 5.0.31, 5.1.28, 5.2.30, 5.3.27, 5.4.25, 5.5.24, 5.6.23, 5.7.21, 5.8.19, 5.9.20, 6.0.18, 6.1.16, 6.2.15, 6.3.14, 6.4.14, 6.5.14, 6.6.11, 6.7.11, 6.8.12, 6.9.11, 7.0.8, 7.1.4; 4.6 and earlier get no update). The attack needs a full-package core update running at that moment, the installer files in the staging tree, a predictable or discovered staging path, and public web and PHP access to wp-content/upgrade; the window re-opens on every update including unattended ones (Patchstack), and the exposed installer file is setup-config.php in the extracted full WordPress package. Check: Dashboard > Updates or wp-includes/version.php; from outside, wp-content/upgrade/ should return 403 or an empty index page, never a directory listing.
      Interim hardening (Patchstack/Exploit Bulletin summary, vendor-neutral): deny web access to wp-content/upgrade at the web server and turn off directory listing before running updates; WordPress's own fix is the update. Wordfence notes its rule needs the firewall's Extended Protection because the request goes straight to a PHP file without loading WordPress, so a PHP-level firewall does not see it (Patchstack makes the same point).
      Detection: web access logs for requests to PHP files below wp-content/upgrade/ (specifically setup-config.php under a staged wordpress copy) from sources with no authenticated session, repeated polling against the same few sites over hours; after the window, unexpected PHP files, new administrator accounts or plugins, and a wp-config.php that points at an unfamiliar database (Wordfence's post-incident list: unexpected requests to PHP files beneath wp-content/upgrade, unfamiliar administrator accounts, unexpected plugins, PHP files you did not place there).
      Triage: probes against a path that does not exist (no update running) are noise and fail with 404; a request that returns 200 from a staged installer while an update was actually running is the case to treat as a compromise lead.
      Defender takeaway: confirm the site really reached the patched release rather than assuming auto-update ran; where updates are triggered manually from the admin, block the upgrade directory first.
      Gap: exploitation evidence is Wordfence-only (attempts, not compromises) while Patchstack calls the race impractical; the affected range differs by source; no CVE id yet. Re-check the CVE assignment and any second telemetry holder on the next fire.

