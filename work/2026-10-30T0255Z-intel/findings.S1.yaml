    discovery_trace: "first seen at: cisa-kev bridge, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (CVE-2026-76418 dateAdded 2026-10-29, notes name the Cisco advisory) + work/2026-10-30T0255Z-intel/kev-window.txt -> primary: Cisco PSIRT advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75 (fetched from the cisco-psirt RSS item of 2026-10-28 19:15 UTC; CVE id read from the advisory HTML) -> EUVD API (exploitedSince 2026-10-29) -> ANSSI avis 1412 and BSI WID-SEC-2026-4238 as in-window authority relays"
    summary: |
      Cisco's advisory of 2026-10-28 (cisco-sa-asaftd-tunnel-dos-s6mgkb75) describes CVE-2026-76418 (CVSS 3.1 8.6, vector AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H; CWE-690 unchecked return value to NULL pointer dereference; bug CSCwx26625): logic errors when secondary authentication is configured on a tunnel group let an unauthenticated remote attacker reload an ASA or FTD device by sending a crafted request when connecting to the SSL remote access VPN. Cisco states that in October 2026 its PSIRT became aware of active exploitation; it names no actor, victim or volume. CISA added the flaw to the Known Exploited Vulnerabilities catalog on 2026-10-29 (due date 2026-11-01), ENISA's EUVD records exploitedSince 2026-10-29 (EPSS 0.0 at read time), and ANSSI states that Cisco reports active exploitation. A device is exposed when it runs a vulnerable ASA or FTD release, the SSL VPN login service is reachable (webvpn enabled on an interface), and secondary-authentication-server-group is set on a tunnel group; the check covers every tunnel group including DefaultWEBVPNGroup, also when tunnel-group-list is disabled, and a successful VPN login is not required to reach the affected path. Cisco lists no workaround but a mitigation: remove secondary authentication from the user-configured tunnel groups and from DefaultWEBVPNGroup (if DefaultWEBVPNGroup does not use it, disable the tunnel group list), at the cost of a weaker VPN login. Fixed releases (first fixed per branch): ASA 9.16 and earlier 9.16.4.104, 9.18 9.18.4.96, 9.20 9.20.4.50, 9.22 9.22.3.200, 9.23 9.23.1.48, 9.24 9.24.1.27 or 9.24.10.1; FTD 7.0 and earlier 7.0.11, 7.2 7.2.13, 7.4 7.4.9, 7.6 7.6.7, 7.7 7.7.14, 10.0 10.0.3, 10.1 10.1.1. Cisco credits Eric Fernald, who found it while resolving a TAC case. This is a different CVE and trigger from the August 2026 exploited ASA/FTD SSL VPN denial of service CVE-2026-20349 (HTTP request error checking), which the store already carries.
    region_nexus: "global; Cisco ASA/FTD remote-access VPN gateways at internet-facing perimeters, including Swiss public-sector networks that terminate VPN on these appliances"
