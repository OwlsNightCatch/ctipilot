        source_url: "https://www.anthropic.com/research/discovering-vulnerabilities-with-claude"
      - quote: "In our proof of concept, it takes 48 minutes to leak a kernel pointer and another five minutes to reach the shell command execution."
        attribution: "Anthropic (research post)"
        source_url: "https://www.anthropic.com/research/discovering-vulnerabilities-with-claude"
      - quote: "As of October 29, Ubuntu and RHEL have not released a fixed kernel."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html"
      - quote: "As of October 29, none of the vendor advisories, the CVE record, or Anthropic's post reports attacks using the flaw."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html"
      - quote: "Mitigation for this issue is either not available or the currently available options do not meet the Red Hat Product Security criteria comprising ease of use and deployment, applicability to widespread installation base, or stability."
        attribution: "Red Hat (CVE page)"
        source_url: "https://access.redhat.com/security/cve/cve-2026-98432"
      - quote: "24.04 LTS noble | Vulnerable work in progress in 6.8.0-149.149"
        attribution: "Ubuntu Security (CVE page, last updated 29 October 2026)"
        source_url: "https://ubuntu.com/security/CVE-2026-98432"
      - quote: "Successful exploitation allows unauthenticated attackers to execute arbitrary commands as root via network access or intentionally crash the affected system."
        attribution: "NCSC Switzerland (Security Hub advisory 13120)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13120"
    extended_notes: |
      Exposure: the bug sits in the IPv4 TCP passive-open path, so any Linux host that accepts inbound IPv4 TCP connections on a kernel from 4.4 up to the fixed releases is in scope for the kernel CNA's rating (distros backport, so version strings alone mislead; read the distro tracker for the installed kernel package). Anthropic's demonstrated root chain targeted servers with a multipath TCP listener, an application has to request MPTCP when it opens its socket; neither the CVE record nor Red Hat/Oracle/SUSE say whether servers without MPTCP can be taken over the same way. Kernel CNA CVSS assumes an attacker who sends a connection request carrying IPv4 Record Route or Timestamp options and then resends it to win the race (THN's reading of the CNA rationale); the related request-socket-migration path needs net.ipv4.tcp_migrate_req=1 or a BPF_SK_REUSEPORT_SELECT_OR_MIGRATE program (kernel record).
      Mitigations: none published. Red Hat says no available mitigation meets its criteria; THN notes that no advisory says whether disabling multipath TCP or dropping inbound connection requests that carry IP options at the edge would lower the risk, so treat both as unverified. The kernel team recommends updating to the latest stable kernel and does not support cherry-picking single fixes.
      Detection concept (none published by any source; mechanism-based): network telemetry showing inbound IPv4 TCP SYNs with IP options set (Record Route, Timestamp) and repeated SYN retransmissions to a listening service, from one external source, at high volume over tens of minutes; host-side kernel crash or oops reports from the TCP stack on exposed servers. A lost race fails only the handshake, so an attacker's retries may leave only connection noise.
      Triage: IP options on SYNs are rare in ordinary traffic and many edge devices drop them; SYN retransmissions alone are common benign noise (packet loss), so the discriminator is retransmitted SYNs that also carry IP options.
      Defender takeaway: install the fixed kernel where the distro has shipped it (Debian, Oracle, SUSE, Amazon per the vendor pages), track Ubuntu and RHEL for the fix, and until then prefer reducing direct internet exposure of Linux TCP listeners (MPTCP-enabled ones first) over assuming a mitigation exists.
      Note for the composer: Anthropic is the vendor of the model family that wrote this exploit; the claim is attributed to Anthropic's own post and has not been reproduced by an independent party in the sources read.

  # ---------------------------------------------------------------- 4. WordPress core upgrade-window RCE (NEW)
  - title: "WordPress core 7.1.4 (2026-10-28): an unauthenticated race in the update staging directory can lead to remote code execution during a core update; Wordfence reports exploitation attempts, no CVE is assigned in the sources, backports fix 4.7 to 7.0"
    sources:
