  - title: "CVE-2026-76418, Cisco Secure Firewall ASA and FTD: a remote-access SSL VPN denial of service that needs secondary authentication on a tunnel group is exploited and on CISA KEV; fixed in ASA 9.16.4.104 / 9.18.4.96 / 9.20.4.50 / 9.22.3.200 / 9.23.1.48 / 9.24.1.27 and FTD 7.0.11 to 10.1.1; no workaround, mitigation is to remove secondary authentication (CVSS 8.6)"
