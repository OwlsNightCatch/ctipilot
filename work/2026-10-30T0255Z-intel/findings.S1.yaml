        attribution: "Cisco PSIRT (cisco-sa-asaftd-tunnel-dos-s6mgkb75)"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"
      - quote: "There are no workarounds that address this vulnerability. However, there is a mitigation, which is to disable secondary authentication on any user-configured tunnel group list or on the default tunnel group,"
        attribution: "Cisco PSIRT (cisco-sa-asaftd-tunnel-dos-s6mgkb75)"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"
      - quote: "Cisco indique que la vulnérabilité CVE-2026-76418 est activement exploitée."
        attribution: "ANSSI / CERT-FR (CERTFR-2026-AVI-1412)"
        source_url: "https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1412/"
    extended_notes: |
      Exposure (Cisco-documented): running configuration contains the webvpn keyword with SSL VPN enabled on at least one interface; then check tunnel-group-list enable and every tunnel group (including DefaultWEBVPNGroup) for secondary-authentication-server-group. If tunnel-group-list is absent or removed, still check DefaultWEBVPNGroup, because disabling the group list does not remove exposure when that default group uses secondary authentication. On FTD, read the deployed Remote Access VPN policy and the resulting device running configuration in FMC or FDM (Devices > VPN > Remote Access). Cisco confirms Secure FMC, Cloud-delivered Firewall, cdFMC and Secure Access are not vulnerable. Cisco Software Checker lists the first fixed release per installed version.
      Detection concept (derived from the stated mechanism, Cisco and CISA publish no indicators): unexpected reload or crash events on ASA/FTD units (HA failover pairs flapping, uptime resets, crashinfo/traceback files created) that coincide with remote-access SSL VPN connection attempts from external addresses that never completed a login; external availability monitoring of the VPN portal. CISA's catalog entry for this CVE has forensicTriage = No (CISA's BOD 26-04 implementation guidance asks for compromise checks for entries flagged Yes; the GitLab entry added the same day is flagged Yes).
      Triage: a reload on its own matches many benign causes (upgrade, HA event, hardware fault); the sources publish no discriminator beyond the mechanism, so a reload with a preceding burst of unauthenticated SSL VPN connection attempts from one external source, on a unit with secondary authentication configured, is the pattern worth escalating to Cisco TAC with the crash file.
      Defender takeaway: upgrade to the fixed release for the installed train; until then remove secondary authentication from the affected tunnel groups only after weighing the lower VPN login assurance, and treat repeat reloads as an exploitation lead.
      Context: second exploited ASA/FTD remote-access DoS in about eleven weeks (CVE-2026-20349 in August).

