      - { url: "https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1420/", publisher: "ANSSI / CERT-FR (CERTFR-2026-AVI-1420)", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: wordfence (rotational record, lookback), `feed https://www.wordfence.com/feed/ 15` item of 2026-10-29T21:58Z -> `extract` of https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/ (served via the reader) -> primary: WordPress.org https://wordpress.org/news/2026/10/wordpress-7-1-4/ and HelpHub https://wordpress.org/documentation/wordpress-version/version-7-1-4/ -> Wordfence Intelligence record -> Patchstack https://patchstack.com/articles/wordpress-7-1-4-security-release/ (found through The Exploit Bulletin https://buttondown.com/exploit-bulletin/archive/the-exploit-bulletin-thursday-october-29-2026-3/, discovery only) -> ANSSI CERTFR-2026-AVI-1420"
    lookback: false
    summary: |
      WordPress 7.1.4, released on 2026-10-28 with same-day backports for every supported branch down to 4.7.39 (patched releases listed by Wordfence: 4.7.39 to 7.0.8 and 7.1.4), fixes 22 vulnerabilities across 17 advisories; one is unauthenticated. WordPress describes it as a weakness in the upgrade process that can lead to remote code execution during the upgrade window, reported by Umut Bayram (Picus Security). Per Wordfence and Patchstack, a full-package core update unpacks the new files into a predictable directory below wp-content/upgrade that, on many servers, is web-accessible and contains the WordPress installer, so an unauthenticated visitor who requests the installer at the right moment (for seconds on a lab install) can reach code execution; the attacker must win a race, hence Wordfence rates it CVSS 3.1 8.1 with high attack complexity and Patchstack describes it as not practical to exploit. 7.1.4 randomizes the staging directory, adds an index guard and prevents unsafe promotion of staged configuration data. Exploitation evidence is a single telemetry holder's: Wordfence (2026-10-29) reports that its firewall rule, deployed 2026-10-28 20:30 UTC for paying customers, matched within nine minutes and that it recorded more than 18,500 requests in 21 hours against staged setup-config.php installer paths, with two large sources polling small groups of sites for about 14.5 hours; Patchstack's analysis of 2026-10-28 predates that telemetry, scores the bug AC:H and says it would not call it practical to exploit, and a newsletter summary of 2026-10-29 says its material reports no exploitation. No source reports a confirmed compromise. The sources also differ on the affected range (Wordfence: 4.7 through 7.1.3 with backports to 4.7; Patchstack: the vulnerable code dates back to WordPress 2.8). No CVE id appears in the WordPress announcement, HelpHub, Wordfence's record or Patchstack. The other 21 fixes need a Contributor/Author/Editor account except an unauthenticated disclosure of unpublished Customizer changesets, and the release also updates bundled root certificates after the eMudhra revocation.
    region_nexus: "global; WordPress core runs many cantonal, communal and institutional websites; background auto-updates normally apply the security release"
    primary_sector_nexus: "direct (WordPress class on public-sector web estates; no Swiss victim reported)"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products: ["WordPress Core"]
    entity_keys: ["product:wordpress-core"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    admiralty_hint: "B3 (vendor and two WordPress-security labs agree on the bug; exploitation attempts are Wordfence-only telemetry and Patchstack, which predates it, calls the bug impractical; no CVE yet)"
    priority_hint: "notable to high: unauthenticated RCE class in core on sites that run full-package updates with a web-reachable upgrade directory, attempts reported by one telemetry holder, auto-update coverage mitigates; complexity high"
    evidence:
      - quote: "A weakness in the WordPress upgrade process which can lead to remote code execution during the upgrade window, reported by"
        attribution: "WordPress.org (WordPress 7.1.4 security release)"
