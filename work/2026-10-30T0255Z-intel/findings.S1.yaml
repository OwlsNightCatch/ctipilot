    evidence:
      - quote: "Another cpu can concurrently process a retransmitted SYN for the same request socket, and send a SYNACK from tcp_check_req()."
        attribution: "Linux kernel CVE team (linux-cve-announce)"
        source_url: "https://lists.openwall.net/linux-cve-announce/2026/10/15/1"
