    discovery_trace: "first seen at: ncsc-ch-security-hub, `ncsc-csh recent 20`, post https://security-hub.ncsc.admin.ch/#/posts/13120 (created 2026-10-29T18:15Z, exploitation status UNKNOWN) -> primary: Linux kernel CVE announcement https://lists.openwall.net/linux-cve-announce/2026/10/15/1 and kernel CVE record https://kernel.googlesource.com/pub/scm/linux/security/vulns/+/refs/heads/master/cve/published/2026/CVE-2026-98432.mbox -> Anthropic post https://www.anthropic.com/research/discovering-vulnerabilities-with-claude (named in the NCSC advisory) -> THN https://thehackernews.com/2026/10/linux-kernel-tcp-flaw-with-98-cvss.html -> Red Hat / Ubuntu / SUSE CVE pages and Red Hat CSAF VEX https://security.access.redhat.com/data/csaf/v2/vex/2026/cve-2026-98432.json -> EUVD API"
    summary: |
      CVE-2026-98432 is a use-after-free race in the Linux kernel's IPv4 TCP handshake code: tcp_v4_syn_recv_sock() hands ownership of the request socket's IP options to the child socket without copying them, so when another CPU processes a retransmitted SYN for the same request socket and builds a SYNACK, the options can be freed under it (a plain kfree in inet_sock_destruct and in the request-socket destructor; the fix switches them to kfree_rcu). The kernel CVE team published the CVE on 2026-10-15, added a CVSS 3.1 score of 9.8 (AV:N/AC:L/PR:N/UI:N) on 2026-10-24, and lists the bug as introduced in 4.4 and fixed in 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56, 7.2.10 and 7.3; IPv6 is not affected by this first issue. On 2026-10-27 Anthropic reported that its model wrote an exploit that lets a remote attacker without credentials run commands as root on Linux servers with a multipath TCP (MPTCP) listener: the race is used first to leak a kernel pointer in an over-read reply and defeat KASLR (48 minutes in its proof of concept), then to overwrite a callback pointer (five more minutes); a lost race only fails that handshake, so retries are possible. The exploit code, kernel build and configuration are not published, and the CVE text itself does not mention MPTCP. Vendors score it lower than the kernel CNA because they rate attack complexity high (Red Hat advisory file 8.1 with its CVE page still 5.9 on 2026-10-29, Oracle and SUSE 8.1, Amazon 7.0). Fix availability on 2026-10-29/30 differs: Debian (trixie 6.12.113-1, DSA-6568-1; bookworm DLA-4841-1 and DLA-4850-1), Oracle Linux and UEK (ELSA-2026-500397 to 500399), Amazon Linux 2023 kernel6.18 and kernel6.12 have fixed packages, and SUSE's page read on 2026-10-30 lists released kernel packages for SLES 16.0, SLES 15 SP4 to SP6 LTSS, SLE Micro 5.3 to 5.5, Micro 6.2 and Leap 16.0 (SUSE-SU-2026:24386-1 and 24422-1, published 2026-10-29) while SLES 15 SP7 is still affected or in progress (THN's table of 2026-10-29 showed several of those SUSE lines as still in testing); Ubuntu 22.04, 24.04, 26.04 and 26.10 are 'work in progress' with Ubuntu 16.04 to 20.04 vulnerable, and RHEL 8, 9, 10 and OpenShift 4 are 'deferred to a future update' with no date. No source reports exploitation in the wild (NCSC Switzerland: UNKNOWN; THN: none in vendor advisories, the CVE record or Anthropic's post; not on CISA KEV as of CIRCL's 2026-10-28 copy), and EUVD lists no exploitedSince (EPSS 0.39 percent as EUVD reports it).
    region_nexus: "global; Ubuntu and RHEL servers with internet-facing TCP listeners, including Swiss public-sector Linux estates"
    primary_sector_nexus: "direct (Linux server class; no Swiss victim reported)"
