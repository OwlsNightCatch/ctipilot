    surface: "body"
    kind: cited
    text: "Cisco lists no workaround; its mitigation is to remove secondary authentication from the tunnel group, which lowers the security posture of the remote access VPN, or, where DefaultWEBVPNGroup does not use secondary authentication, to disable the tunnel group list with `no tunnel-group-list enable` ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: 9bb049e1db
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "Cisco confirms that Secure FMC, Cloud-delivered Firewall, cdFMC and Secure Access are not affected ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: fc2a58f717
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "On FTD, read the deployed remote access VPN policy and the resulting configuration in FMC or FDM (Devices > VPN > Remote Access) ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-tunnel-dos-s6mgkb75"]
  - claim_id: 48079aee2c
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "**Exposure:** an ASA or FTD unit below the first fixed release of its branch whose running configuration has `webvpn` enabled on an interface and `secondary-authentication-server-group` on any tunnel group; the default tunnel group DefaultWEBVPNGroup counts even when the tunnel group list is disabled."
  - claim_id: a7af0bee68
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "**Detection:** neither Cisco nor CISA publishes an indicator."
  - claim_id: 1aebd210d6
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "The mechanism points at device availability telemetry: unexpected reloads, HA failover flaps, uptime resets and crash files on units that terminate the remote access VPN, read against VPN authentication logs for connection attempts from external addresses that never complete a login."
  - claim_id: 59253db218
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "**Triage:** a reload also follows upgrades, HA events and hardware faults; a reload that coincides with unauthenticated SSL VPN connection attempts from an external address is the pattern the stated mechanism produces."
  - claim_id: 4492058f16
    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade the units that terminate remote access SSL VPN with secondary authentication this week, perimeter units first; Cisco states denial of service as the only impact, so patching leaves no further step, and removing secondary authentication as a stop-gap trades an outage risk for a weaker VPN login."
  - claim_id: 5f7189bc52
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "headline"
    kind: frontmatter
    text: "WordPress 7.1.4 fixes an unauthenticated upgrade-window RCE race; Wordfence sees probing, so confirm the auto-update ran"
  - claim_id: 8e0107c6b2
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "summary"
    kind: frontmatter
    text: "WordPress 7.1.4 of 2026-10-28 fixes a weakness in the core upgrade process that lets an unauthenticated attacker reach the staged installer and run code on the server during a full-package core update, in versions 4.7 to 7.1.3, with backports for every branch down to 4.7. Wordfence reports more than 18,500 probing requests in the first 21 hours, while Patchstack calls the race hard to win and says it needs a web-reachable staging directory; no source gives a CVE identifier."
  - claim_id: cb3cccb701
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm in Dashboard > Updates that every WordPress site your organisation, its web agencies or its hosting suppliers run is on 7.1.4 or the fixed release of its branch, and deny web access to wp-content/upgrade/ in the web server configuration of each, because the race can be probed during any full-package core update and a PHP-level firewall does not run for that request."
  - claim_id: 67d4530c04
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "WordPress 7.1.4, released on 2026-10-28, fixes a weakness in the upgrade process that can lead to remote code execution during the upgrade window, and backports follow for every branch that receives security fixes, currently through 4.7 ("
    urls: ["https://wordpress.org/news/2026/10/wordpress-7-1-4/"]
  - claim_id: d3d78d5882
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "); WordPress's release documentation counts 22 vulnerabilities, as Wordfence reports ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: ea242b9b6a
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "During a core update with a complete package, the new files are unpacked into a predictable directory under `wp-content/upgrade`; the temporary copy includes the installer, and an unauthenticated attacker who requests it at the right moment can interact with the staged copy and reach PHP code execution ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: b8957b44af
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Wordfence scores it CVSS 8.1 for versions 4.7 through 7.1.3 and states that the attack complexity is high, because the attacker needs web access to the staging tree and must win a race that lasted only seconds in its lab ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 73df295a6f
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Patchstack reads the same flaw as needing `wp-content/upgrade/` to be reachable over the web, notes that the sink dates back to WordPress 2.8 and that the window returns on every update, unattended ones included, and would not call it practical to exploit ("
    urls: ["https://patchstack.com/articles/wordpress-7-1-4-security-release/"]
  - claim_id: ce97543ed8
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Wordfence reports that its new firewall rule matched within nine minutes of deployment and that it recorded more than 18,500 requests for staged `setup-config.php` installer paths in the first 21 hours, with two large sources polling small groups of sites for about 14.5 hours, which it reads as attempts to catch the update window ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 25fa785e87
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "The fix randomises the staging directory, adds an index guard and prevents unsafe promotion of staged configuration data ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: f3631bb31b
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "Most sites receive the release through automatic background updates, which Wordfence says should be checked rather than assumed ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: 427b050a67
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Exposure:** any WordPress site on 4.7 to 7.1.3 that runs a full-package core update, automatic ones included, with `wp-content/upgrade/` reachable from the internet; Dashboard > Updates shows the running version, and the fixed releases are 7.1.4 and the backport of each branch (7.0.8, 6.9.11, 6.8.12, 6.7.11, 6.6.11 and the earlier branches listed by Wordfence down to 4.7.39) ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: ce368e7fe9
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "**Detection:** in web server access logs, requests under `wp-content/upgrade/` and for `setup-config.php` inside a staging directory, repeated from one source against a few sites as Wordfence saw ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
