    surface: "body"
    kind: cited
    text: "**Defender takeaway:** confirm that the automatic update completed on every site instead of assuming it, and deny web access to `wp-content/upgrade/` at the web server, because a PHP-level firewall cannot block the request: the staged copy loads from its own files ("
