    surface: "body"
    kind: cited
    text: "Cisco's advisory, revised on 2026-10-28 to link Talos's post, says its PSIRT is aware of limited exploitation ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk"]
  - claim_id: c4a5a4d9bc
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "Lumen's Black Lotus Labs reported on 2026-10-28 that Volt Typhoon had exploited the flaw since late 2025 and after Cisco's February disclosure ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: ffdb5ff0d6
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "), and Talos assesses with high confidence that UAT-11473's operating infrastructure overlaps considerably with Volt Typhoon's Silent Train network ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: ae7f09e661
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "The actor edits the runit launchers of sshd and of a look-alike aaamgr service and remounts /rootfs.rw executable: the sshd launcher starts a script that injects the PolyFlame library into every running vdaemon process by ptrace, and the aaamgr launcher runs a packed PolyFlame loader directly ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: e47c7cb407
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "PolyFlame is tasked in-band over the control-plane traffic and offers a command, file-write and file-read backdoor and an intermediate command relay; Talos recovered no hardcoded address, port or domain ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: 6286636ece
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "A second component, LittleFilch, hooks SSL_read in vdaemon and collects peer system addresses and 32-byte values Talos assesses to be OMP-distributed IPsec data-plane keys, writing them RSA-encrypted to /var/tmp ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: 671b25accb
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "Talos lists observed targeting as space and satellite services, defense and aerospace technology, and policy research, calls the activity historical and does not say how many controllers were affected ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: ae73a757cb
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "**Exposure:** every Catalyst SD-WAN Controller, Manager and Validator regardless of configuration, on-premises or in Cisco's hosted clouds, on a release below the first fixed one in the advisory's table; Cisco says controllers with ports exposed to the internet are at risk ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk"]
  - claim_id: 1c956b655a
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "**Detection:** on the controller's authentication log, Cisco says to audit /var/log/auth.log for accepted public-key logins of the vmanage-admin account from addresses that are not among the configured System IPs, and to validate control-connection peering events, those of peer type vmanage first, against maintenance windows and asset inventory ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk"]
  - claim_id: 651cf80410
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "On the host, Talos names modified runit run scripts that remount the overlay root executable and start a background script, an aaamgr service that runs a compiled, packed ELF, extra libraries mapped into vdaemon with ptrace activity against it and encrypted staging files under /var/tmp ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: d7699ef169
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "Cisco asks for admin-tech files and a TAC case when compromise is suspected ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk"]
  - claim_id: 03238eee64
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: cited
    text: "**Triage:** an aaamgr service that runs as a compiled ELF is the discriminator, because the legitimate component is a Python package and does not normally appear that way ("
    urls: ["https://blog.talosintelligence.com/uat-11473-keydrift/"]
  - claim_id: 1d14585cac
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
    surface: "body"
    kind: uncited
    text: "KeyDrift runs inside the control-plane daemon."
  - claim_id: 6cb065fe00
    entry: 2026-10-29/keydrift-uat-11473-cisco-sd-wan-controllers-cve-2026-20127
