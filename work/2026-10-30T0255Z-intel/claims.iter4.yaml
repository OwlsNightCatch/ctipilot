    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "headline"
    kind: frontmatter
    text: "Talos IR Q3: public administration tied for most targeted; vishing into RMM and EDR killing mark the ransomware cases"
  - claim_id: 054a90b974
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos Incident Response's Q3 2026 trends report names public administration, tied with finance at 18 percent of engagements, as the most targeted sector, and puts phishing first and public-facing application exploitation second among initial-access techniques. Its ransomware cases (27 percent of engagements) show help-desk vishing that leads the victim to allow remote access through a legitimate remote-management tool, and operators who uninstall or terminate EDR, including with vulnerable drivers."
  - claim_id: 502d6186e2
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Cisco Talos Incident Response reports that in Q3 2026 financial organisations made up 18 percent of its engagements, tying with public administration as the most targeted sector ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 5d5fb04d9f
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Phishing was the leading initial-access technique at 37 percent of engagements and exploitation of public-facing applications second at 33 percent; the phishing cases include numerous actors who phone the victim as the IT help desk to get remote access allowed through a legitimate remote monitoring and management (RMM) tool ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 0ef6927db1
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Ransomware and pre-ransomware cases were 27 percent of engagements, with The Gentlemen, Qilin, Rhysida and the closed group Interlock among the families and a new variant, VYPR, that Talos calls operationally immature: it had no leak site when seen, reused leaked Conti-derived source code and exfiltrated over several days ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: fe593e0624
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "The VYPR intrusion began with a vishing call that had the user start a Microsoft Quick Assist session; the actor then used RMM software that ran PowerShell to download and install an MSI from a remote address, with MeshAgent, Rclone, PsExec, an IP scanner and mstsc as tools, and disabled EDR with several vulnerable drivers ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 69a51ff213
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Interlock operators repeatedly tried to uninstall Cisco Secure Endpoint, used PsExec and taskkill to end security services and integrity checkers, turned off Windows Defender real-time protection and cleared event logs ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 4171e64d38
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: cited
    text: "Talos names insufficient logging (over 40 percent of engagements), weak credential and secret handling, and absent or incomplete MFA as the most common weaknesses, and recommends centralised logging with at least 90 days of retention ("
    urls: ["https://blog.talosintelligence.com/ir-trends-q3-2026/"]
  - claim_id: 9305422677
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Exposure:** an organisation whose help desk or staff can be reached by phone and whose endpoints permit Quick Assist or an unapproved RMM agent; Talos names public administration among the most targeted sectors in its caseload."
  - claim_id: f552fe8e54
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Detection:** in process-creation and software-install telemetry, an RMM or Quick Assist session started after an inbound call, followed by PowerShell run under the RMM agent that downloads an installer from an external address; in endpoint and service-control telemetry, attempts to uninstall the EDR agent, PsExec or taskkill ending security services, Defender real-time protection switched off, vulnerable kernel drivers loaded, and event logs cleared."
  - claim_id: 28ef4edcb4
    entry: 2026-10-30/cisco-talos-ir-trends-q3-2026-public-administration
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a remote-support session that nobody at the help desk started as the vishing signal and inventory which RMM tools and Quick Assist are permitted on endpoints; alert on EDR uninstall and security-service termination as a ransomware precursor; and centralise logs with the 90-day minimum retention Talos recommends, because actors delete logs on the endpoint."
  - claim_id: 181c9ef83a
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "headline"
    kind: frontmatter
    text: "CrowdStrike: VAPOR PANDA runs ARTEX against 200+ organisations, European foreign ministries among them"
  - claim_id: 60fb6b1252
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "summary"
    kind: frontmatter
    text: "CrowdStrike reports that from 2026-10-17 the China-nexus actor VAPOR PANDA used the ARTEX agent framework, driven mainly by the DeepSeek model, against more than 200 organisations worldwide, with the controller CrowdStrike saw directing exploitation in at least 14 countries, including foreign ministries in Europe, a European country's presidency, prime minister's office and defence, justice, finance and intelligence entities, and a Greek government entity. CrowdStrike confirmed post-exploitation at nine organisations, with the BLOODALCHEMY backdoor loaded by a renamed legitimate binary, and says this campaign is separate from the Storm-0940 ARTEX activity Microsoft reported."
  - claim_id: ebc494f9d1
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "CrowdStrike OverWatch reports that from 2026-10-17 a single ARTEX controller linked to VAPOR PANDA infrastructure directed exploitation against entities in at least 14 countries over 11 days, and that the campaign reached more than 200 organisations, including foreign ministries in Europe ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 1145427791
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "One engagement focused on a single European country, its foreign ministry, presidency, prime minister's office and defence, justice, finance and intelligence entities, and another targeted 19 US organisations in pharmaceuticals, semiconductors, defence, nuclear and finance ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 002a090ac9
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "CrowdStrike confirmed post-exploitation at nine organisations and password spraying and credential scanning against at least 12 more, among them government entities in Europe ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: dcb9e3f342
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "CrowdStrike states that the campaign is separate from the Storm-0940 ARTEX activity Microsoft reported and is VAPOR PANDA's first observed use of AI-driven tooling ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 39131a2293
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "The framework ran mainly on the DeepSeek model, with a human operator steering the agents at decision points while they pursued web, cloud, container, Active Directory, mail and VPN paths in parallel ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 31e25fe2b0
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "In transcripts at a US pharmaceutical company the agent chained an unsigned SAML assertion with an XML external entity flaw to query the cloud instance metadata service and obtain a role that could issue administration commands to thousands of instances; at a second it deployed web shells, abused an unauthenticated orchestration service for root in a container environment, read LAPS passwords and abused resource-based constrained delegation ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: bcd73ca11c
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "Against a Greek government entity the operator supplied a 2022 directory export from the mail server whose authentication keys had likely not been rotated; the agent forged an administrator token, read mailboxes and used VPN configurations from a user's sent mail, with a VPN client key the operator described as coming from a May 2024 email leak, to reach the internal network ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: bb1953c9a7
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "The operator also told the agents to find domain Windows hosts without the CrowdStrike Falcon sensor ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 7d19b5568d
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "At a Middle East interior ministry and a Latin American foreign ministry the actor loaded the BLOODALCHEMY backdoor through a legitimate GameHook binary renamed svchost.exe that loads a malicious DLL ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: dd4c89e41e
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: cited
    text: "**Detection:** telemetry classes are authentication logs (password spraying and credential scanning against many accounts, an administrator token minted outside the identity provider, VPN logins that use a configuration or key from an old mailbox or leak), cloud control-plane audit (administration commands issued to many instances through the cloud systems manager, instance metadata queries from an application), process lineage (a legitimate GameHook binary renamed svchost.exe loading a malicious DLL) and endpoint inventory queries for hosts without the security agent; CrowdStrike lists ARTEX-named command-line parameters, cloud roles and a directory under ProgramData as hunt markers ("
    urls: ["https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/"]
  - claim_id: 1ac3015b87
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: uncited
    text: "No Swiss target is named."
  - claim_id: f08aee5a98
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: derived
    text: "**Exposure:** government, mail, identity and VPN estates where a directory export or backup holding authentication keys has never been rotated, SAML service providers that accept unsigned assertions, and cloud instances that still allow instance metadata service version 1; CrowdStrike names foreign ministries and government entities in Europe among the targets."
  - claim_id: 4c1794aac3
    entry: 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** rotate keys held in old directory exports and backups, require signed SAML assertions and IMDSv2, and hunt authentication and cloud audit logs for the parallel, many-target pattern an operator-steered agent produces; CrowdStrike expects China-nexus actors to keep adopting agent frameworks."
  - claim_id: 22e1c2e4f7
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "headline"
    kind: frontmatter
    text: "Lumen: Volt Typhoon's Silent Train relay chains fronted zero-days against SD-WAN, N-central and KACE"
  - claim_id: bae37f8ee9
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "summary"
    kind: frontmatter
    text: "Lumen's Black Lotus Labs reports that Volt Typhoon ran exploitation, credential access and exfiltration through Silent Train, rotating chains of compromised SOHO, IoT and enterprise devices that it rebuilt for each operation, and that its monitoring uncovered one likely and four confirmed zero-day campaigns against endpoint and network management platforms and SD-WAN orchestrators, among them Cisco Catalyst SD-WAN, N-able N-central and Arista VeloCloud Orchestrator. The reported victims are US-centred and the report names no Swiss or European victim."
  - claim_id: 848dcdb576
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "Lumen's Black Lotus Labs reports that Volt Typhoon used a covert framework it calls Silent Train, first seen in late 2023, for the phases that need protection: exploitation, credential access, data exfiltration and continued access to victims ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: c569779b70
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "A session starts from a virtual private server outside the US, passes through compromised non-US SOHO and IoT devices and leaves through a compromised US device before the victim; more than 27 device classes were enrolled, from TP-Link routers and Netgear Orbi devices to Fortinet appliances and CyberPanel servers, and the enterprise platforms stayed in chains for one to three months as final hops ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 3063dd435b
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "The operators exploit exposed web interfaces on the relay devices and deploy only what chained SSH needs, namely temporary SSH services, keys, configuration files and living-off-the-land utilities, with reverse tunnels over open-source proxies in later variants; sessions averaged about four hours, and at the end the operators removed all artifacts and dismantled the chain ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 06dc40dd8a
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "Lumen says its monitoring helped identify one likely and four confirmed zero-day campaigns against endpoint and network management platforms and SD-WAN orchestrators: Quest KACE, where the activity looked like an undisclosed flaw, affected more than 30 victims and fell after Quest's October 2025 updates (a moderate-confidence assessment); Versa Director in 2024; the N-able N-central flaws CVE-2025-8875 and CVE-2025-8876; Cisco Catalyst SD-WAN through CVE-2026-20127, exploited by late 2025 and after Cisco's February 2026 disclosure; and Arista VeloCloud Orchestrator through the zero-day later designated CVE-2026-16812 ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 7584a5d463
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "Post-incident analysis found in-memory webshells, credential harvesting and abuse of native platform features such as endpoint control and remote file transfers, and in several cases erased or altered logs ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 22e16e3e99
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "The victims it names are US government, telecommunications, defence-industrial, managed-service and critical-infrastructure organisations, concentrated in Hawaii, California and Texas, and it names no European or Swiss victim ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 43d4a35294
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "The Hacker News carries the same findings from a report Lumen shared with it ("
    urls: ["https://thehackernews.com/2026/10/volt-typhoon-used-covert-silent-train.html"]
  - claim_id: 8e8a5be871
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: cited
    text: "**Detection:** telemetry classes are administrative logins, API calls, remote file transfers and configuration changes on management platforms outside normal administration hours or workflow, in-memory web shells that leave no file on disk, and, on edge devices, temporary SSH services, unfamiliar keys and outbound reverse tunnels to unfamiliar upstream hosts ("
    urls: ["https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework"]
  - claim_id: 2f4def9ccc
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: derived
    text: "**Exposure:** internet-reachable management and control-plane platforms (endpoint management, SD-WAN controllers and orchestrators, out-of-band administration), and edge devices with exposed web interfaces, which can be enrolled as relay hops without any data of the owner being the target."
  - claim_id: 5576bacf48
    entry: 2026-10-30/silent-train-volt-typhoon-relay-network-zero-days
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** restrict the administrative interfaces of management and control-plane platforms to a VPN, jump host or management network and prioritise their patching, as Lumen advises, and treat an edge device that shows temporary SSH services or reverse tunnels as a possible relay in someone else's intrusion chain."
  - claim_id: 344170af63
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "headline"
    kind: frontmatter
    text: "privatim cloud guidance v3.02: public bodies keep their own keys for sensitive data; big-vendor SaaS mostly out"
  - claim_id: abbbfaedde
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "summary"
    kind: frontmatter
    text: "privatim, the conference of the Swiss data-protection authorities, revised its guidance on cloud-specific risks for public bodies on 2026-10-02 (version 3.02, replacing the version of 3 February 2022). For particularly sensitive personal data the public body must encrypt with keys only it can use, outsourcing such data or data under a statutory duty of confidentiality to standard SaaS from large international providers is in most cases inadmissible, and the body's top management is to confirm the residual risk in writing."
  - claim_id: 128ba7131e
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "privatim, the conference of the Swiss data-protection authorities, dates version 3.02 of its guidance \"Cloud-specific risks and measures\" to 2 October 2026 ("
    urls: ["https://www.privatim.ch/wp-content/uploads/2026/10/privatim_Cloud-Merkblatt_v3_02_20261002_def_DE.pdf"]
  - claim_id: 90c5cca355
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "); it replaces the version of 3 February 2022 ("
    urls: ["https://dcod.ch/2026/10/27/privatim-usage-du-cloud/"]
  - claim_id: 73dc0c7439
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "For particularly sensitive personal data the public body must encrypt, the keys may be available only to it, and outsourcing such data, or data under a statutory duty of confidentiality, to SaaS from large international providers, with Microsoft, Google, AWS and SAP named, is in most cases inadmissible because of the untenable risk ("
    urls: ["https://www.privatim.ch/wp-content/uploads/2026/10/privatim_Cloud-Merkblatt_v3_02_20261002_def_DE.pdf"]
  - claim_id: 6566355dfd
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "Keys may stay with the provider only where no untenable risk follows and the provider is bound by contract to use them only with the body's express consent and to log every access ("
    urls: ["https://www.privatim.ch/wp-content/uploads/2026/10/privatim_Cloud-Merkblatt_v3_02_20261002_def_DE.pdf"]
  - claim_id: c53002a115
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "The body, or its top management, is to confirm in writing that it has understood the risks and accepts the residual risk, and data the cloud services generate about their users, such as telemetry and logging data, is to be treated with the same care and contract terms as the content data ("
    urls: ["https://www.privatim.ch/wp-content/uploads/2026/10/privatim_Cloud-Merkblatt_v3_02_20261002_def_DE.pdf"]
  - claim_id: e644de9607
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: cited
    text: "The five risk areas are contract design, places of processing including foreign authority access, confidentiality with encryption and key management, user data, and sub-processors ("
    urls: ["https://www.privatim.ch/wp-content/uploads/2026/10/privatim_Cloud-Merkblatt_v3_02_20261002_def_DE.pdf"]
  - claim_id: c361f6c438
    entry: 2026-10-30/privatim-cloud-merkblatt-v3-02-own-keys-saas-residual-risk
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the guidance addresses public bodies subject to Swiss data-protection law; a body that runs or plans standard SaaS from the named providers for sensitive or secrecy-bound data is advised to keep its own encryption keys, to have top management sign the residual risk, and to hold provider telemetry and logs about its users to the same contract terms."
