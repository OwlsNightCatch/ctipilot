    entry: 2026-10-30/cve-2026-76418-cisco-asa-ftd-ssl-vpn-reload-exploited
    surface: "body"
    kind: cited
    text: "The first fixed releases are ASA 9.16.4.104 (for 9.16 and earlier), 9.18.4.96, 9.20.4.50, 9.22.3.200, 9.23.1.48, 9.24.1.27 and 9.24.10.1, and FTD 7.0.11 (for 7.0 and earlier), 7.2.13, 7.4.9, 7.6.7, 7.7.14, 10.0.3 and 10.1.1 ("
