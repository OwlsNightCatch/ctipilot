    text: "{\"id\": \"CVE-2026-97229\", \"cvss\": \"10.0 (CVSS 3.1)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\", \"poc-public\"], \"affected\": \"self-managed GitLab CE/EE: 19.2 before 19.2.8, 19.3 before 19.3.5, 19.4 before 19.4.2; GitLab rates it as needing no privileges, while the path Rapid7 demonstrated needs push access to a public project\", \"fixed\": \"19.2.8; 19.3.5; 19.4.2\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: dc53e6cb6f
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: cited
    text: "GitLab's critical patch release of 2026-10-12 (19.4.2, 19.3.5 and 19.2.8) fixes CVE-2026-97229, an integer overflow in the CI/CD regular-expression compiler that, \"under certain conditions\", could allow an unauthenticated user to execute arbitrary code on the GitLab server through a specially crafted regular expression in a CI/CD configuration; GitLab scores it CVSS 3.1 10.0 with no privileges required ("
