    text: "**Defender takeaway:** upgrade to the fixed releases and restrict the control components' management ports, then treat any controller that was internet-reachable on a vulnerable release as a compromise-assessment target, because Lumen dates exploitation of the flaw to late 2025, before Cisco's February disclosure, and the implant runs in the process that handles the fabric's control sessions."
