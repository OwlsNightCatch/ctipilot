- code: F9
  category: surface-contradiction
  section: vulnerability
  item: "2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race"
  url_or_quote: "actions[0] and Defender takeaway: \"deny web access to wp-content/upgrade/ in the web server configuration of each, because the race can be probed during any full-package core update and a PHP-level firewall does not run for that request\" / \"because a PHP-level firewall cannot block the request: the staged copy loads from its own files ([Patchstack, 2026-10-28])\""
  summary: "Two cited sources disagree on whether a PHP-level firewall can stop this request and the entry states only Patchstack's side as fact. Patchstack (https://patchstack.com/articles/wordpress-7-1-4-security-release/): \"A PHP firewall cannot block it. The extracted copy loads WordPress from its own files, and the official zip ships no `mu-plugins` directory, so the site's firewall never runs for that request.\" Wordfence (https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/, cited in the same entry, fetched this iteration): \"Sites using Wordfence should verify that the firewall is optimized with Extended Protection, which allows the firewall to run before direct PHP requests reach the requested file\", and it shipped a blocking rule for exactly this request. A pre-PHP (auto-prepend) firewall therefore does run for it. The recommended web-server deny is unaffected; add a Contradiction line or narrow the wording to firewalls loaded by WordPress itself (mu-plugin or plugin based), and say that Wordfence reports its rule is effective only with Extended Protection enabled (changelog record naming actions and body)."
