    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "record 2026-10-30T03:52:05Z"
    kind: record-summary
    text: "CISA added CVE-2026-97229 to the Known Exploited Vulnerabilities catalog on 2026-10-29 and NCSC Switzerland updated its advisory the same day to active exploitation, citing Alpine Linux's report that a newly registered account crashed its GitLab 19.3.4 workers eight times on 2026-10-20 and 21, after which Alpine rebuilt the instance. Alpine also found that GitLab's fix is a patch to the Ruby bundled in its own packages and images, so an installation with its own Ruby needs Ruby 3.3.13, 3.4.12 or 4.0.9 as well, and GitLab's builds of 2026-10-21 also fix a second CVSS 10 flaw, CVE-2026-110264. The CVE record moves to exploited and KEV-listed, the summary, detection, takeaway and action are rewritten, and the superseded status lines are removed."
