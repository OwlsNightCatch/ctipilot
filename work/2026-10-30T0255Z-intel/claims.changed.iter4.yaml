    kind: frontmatter
    text: "Upgrade every self-managed GitLab CE and EE instance on 19.2, 19.3 or 19.4 to 19.2.8, 19.3.5 or 19.4.2 now, preferably to 19.2.9, 19.3.6, 19.4.3 or 19.5.1, which also fix CVE-2026-110264, internet-reachable instances and instances that allow open sign-up or public projects first, because CISA lists the flaw as exploited and NCSC Switzerland reports active exploitation; where GitLab runs on its own Ruby (a source install or a container image that does not use GitLab's packages) also install Ruby 3.3.13, 3.4.12 or 4.0.9, because the fix is a Ruby patch that only GitLab's official packages carry. On any instance that was reachable on an affected version, run the six detections GitLab published on its release page and treat the CI/CD variables, runner registration tokens and deploy keys of any hit, or of an instance where compromise cannot be ruled out, as exposed."
