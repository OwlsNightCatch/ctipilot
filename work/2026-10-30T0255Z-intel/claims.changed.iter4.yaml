    surface: "summary"
    kind: frontmatter
    text: "CrowdStrike reports that from 2026-10-17 the China-nexus actor VAPOR PANDA used the ARTEX agent framework, driven mainly by the DeepSeek model, against more than 200 organisations worldwide, with the controller CrowdStrike saw directing exploitation in at least 14 countries, including foreign ministries in Europe, a European country's presidency, prime minister's office and defence, justice, finance and intelligence entities, and a Greek government entity. CrowdStrike confirmed post-exploitation at nine organisations, with the BLOODALCHEMY backdoor loaded by a renamed legitimate binary, and says this campaign is separate from the Storm-0940 ARTEX activity Microsoft reported."
