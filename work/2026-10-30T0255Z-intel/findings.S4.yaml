    evidence:
      - quote: "One of our third party providers was compromised, and we have referred this to relevant law enforcement."
        attribution: "Polymarket"
        source_url: "https://status.polymarket.com/cmvtuswgi00221bkzps7w21pt"
      - quote: "A script associated with performance monitoring contains code to access trading sessions, sell positions, and redirect assets."
        attribution: "Hudson Rock (InfoStealers)"
        source_url: "https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/"
      - quote: "The number of affected users, aggregate losses attributable to this incident, and the initial compromise mechanism remain unresolved."
        attribution: "Hudson Rock (InfoStealers)"
        source_url: "https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/"
      - quote: "DebugBear has since confirmed that it is investigating an ongoing security incident and warned customers to remove its monitoring JavaScript from their websites."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/polymarket-halts-trading-after-crypto-draining-script-breach-25m-traced/"
    exposure: "Any site that embeds DebugBear's real-user-monitoring script: DebugBear's own instruction to customers is to remove the embed code. Whether any Swiss or public-sector site does is not in the sources."
    detection: "Telemetry class: web-property inventory and content-security-policy allowlists (script-src and connect-src entries naming the vendor's hosts), page-template or tag-manager inventories, and CSP violation reports. A change to the script served from a vendor host leaves no trace in the site's own build, so the signal is in what the browser loaded, not in the deployment history. Analyst suggestion; the sources state only that the policy allowed the vendor host and that Polymarket removed the integration."
    defender_takeaway: "Analyst reading: a third-party script allowed on a page where users hold an authenticated session runs with that session's authority; pages that can move assets or data are the place to cut third-party embeds first, and the vendor's all-clear is needed before re-adding."
    extended_notes: |
      Polymarket's own earlier front-end supply-chain incident of June 2026 appeared in search results (not fetched in this run), so this is at least the second third-party-script event at the same platform; do not cite it without fetching.

