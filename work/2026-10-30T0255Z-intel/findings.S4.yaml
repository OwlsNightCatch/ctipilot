    verification: MULTI-SOURCE
    sourcing_note: "Victim statement (Polymarket) plus two independent analyses of the script (Hudson Rock, BleepingComputer); DebugBear's own statement is on X and is carried only through BleepingComputer."
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2 }
    priority_hint: routine
