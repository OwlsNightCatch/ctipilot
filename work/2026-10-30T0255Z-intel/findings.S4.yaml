  - title: "Polymarket and DebugBear: a compromised performance-monitoring provider served wallet-draining script to a live trading site; DebugBear tells customers to remove its embed"
    borderline: true
    borderline_reason: "Victim statement plus two independent technical readings and a vendor-stated mitigation, but no Swiss or public-sector customer is known; clears PD-11(b)/(d) only as a transferable third-party-script lesson and an imminent shared exposure for any site embedding the vendor's script. Main agent to decide."
    sources:
      - { url: "https://status.polymarket.com/cmvtuswgi00221bkzps7w21pt", publisher: "Polymarket status page (victim statement)", date: "2026-10-29", role: "primary" }
      - { url: "https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/", publisher: "Hudson Rock (InfoStealers)", date: "2026-10-29", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/polymarket-halts-trading-after-crypto-draining-script-breach-25m-traced/", publisher: "BleepingComputer (independent analysis of the script; relays DebugBear's statement)", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed fetch 2026-10-30, item https://www.bleepingcomputer.com/news/security/polymarket-halts-trading-after-crypto-draining-script-breach-25m-traced/) → primary: Polymarket status page https://status.polymarket.com/cmvtuswgi00221bkzps7w21pt → primary: Hudson Rock analysis https://www.infostealers.com/article/polymarket-breach-alert-wallet-draining-code-found-in-a-third-party-script/ (linked from the BleepingComputer article). DebugBear's own statement is a post on X, not fetched; its website returned a Cloudflare origin error (1016) when fetched at 2026-10-30T03:09Z."
    summary: |
      Polymarket, a prediction-market platform, put its exchange into cancel-only mode on 2026-10-29, halted trading for about an hour and states on its status page that "one of our third party providers was compromised", that it referred the matter to law enforcement and that affected users "will be made whole". Hudson Rock and BleepingComputer independently retrieved the script involved: it was served from the DebugBear real-user-monitoring (RUM) service's own content-delivery host, reads the site's stored authentication context, locates the page's existing trading client and signer, then tries to sell the user's positions or move assets to an attacker wallet. BleepingComputer found the script also used a DebugBear data host for instructions and for sending back account, wallet and balance details, which raises the question of how much of DebugBear's infrastructure the attackers controlled; Hudson Rock reports a build-metadata commit in which Polymarket removed the DebugBear script and a scan showing the site's content-security policy had allowed the vendor's host. DebugBear told its customers through X that it is "impacted by an ongoing security incident" and asked every RUM customer to remove the embed code from their sites, and its website was unreachable with a Cloudflare error when fetched on 2026-10-30. About $2.5 million moved from the suspected attacker wallet according to BleepingComputer's tracing, a figure Hudson Rock says is not a verified loss total; how DebugBear was compromised, how many users were hit and the total loss are not established, and no actor is named.
    region_nexus: "global; no Swiss customer of DebugBear is named by any source"
    primary_sector_nexus: "indirect: the class (third-party monitoring or analytics script on pages where users hold an authenticated session) applies to e-government and e-banking portals; no source says any public-sector site embeds the vendor"
    sector: "financial / crypto-asset trading platform"
