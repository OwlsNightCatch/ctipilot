    extended_notes: |
      Defender-vantage / detection angle: PWNYOURHOME is a zero-click, no-user-interaction chain — there is no
      phishing artefact or user action to hunt for on the endpoint side. The realistic detection surface for
      similarly-targeted high-risk individuals (parliamentarians, diplomats, journalists, NGO staff) is
      forensic triage tooling (MVT — Mobile Verification Toolkit — the same open-source tool Citizen Lab uses)
      run proactively against iOS sysdiagnose/backup artefacts, plus enrolment in Apple's Lockdown Mode and
      threat-notification program for at-risk officials. Hardening lever: mandating Lockdown Mode (or
      equivalent MDM-enforced hardened configuration disabling HomeKit/iMessage rich-content parsing) for
      government-issued devices held by individuals in oversight/inquiry roles handling sensitive material.
      This is the same forensic method (device imaging + IOC/log correlation) Citizen Lab used in the
      Cellebrite/Pivovarov case already tracked in the registry (incident:cellebrite-ufed-russia-pivovarov),
      and continues a running 2026 pattern of Citizen Lab publishing mercenary-spyware forensic findings
      naming EU institutional targets.
