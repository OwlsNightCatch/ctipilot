items:
  - title: "Citizen Lab: MEP investigating spyware abuse was himself hacked with Pegasus via PWNYOURHOME zero-click in 2022-2023"
    sources:
      - { url: "https://citizenlab.ca/research/member-of-committee-investigating-spyware-hacked-with-pegasus/", publisher: "Citizen Lab", date: "2026-07-03", role: primary }
      - { url: "https://therecord.media/pegasus-spyware-european-parliament-pega-committee-member", publisher: "The Record (Recorded Future News)", date: "2026-07-03", role: corroborating }
    discovery_trace: "first seen at: therecord (RSS feed), URL https://therecord.media/feed → primary: Citizen Lab, URL https://citizenlab.ca/research/member-of-committee-investigating-spyware-hacked-with-pegasus/"
    summary: |
      Citizen Lab forensically confirmed that the iPhone of Stelios Kouloglou, a former MEP who sat on the
      European Parliament's PEGA Committee (the inquiry into commercial spyware abuse), was infected with
      NSO Group's Pegasus spyware on two occasions — 21 October 2022 and 6-7 March 2023 — while he served
      on the committee. The device was running iOS 15.5 at the time of both infections. The 2022 infection
      used the PWNYOURHOME zero-click chain: the attacker sent a specially crafted NSKeyedArchive object
      that landed in the HomeKit daemon, followed by malicious content processed by MessagesBlastDoorService
      (iMessage's sandboxed attachment-parsing service) — a technique class distinct from earlier
      NSO chains that abused iMessage directly. Citizen Lab does not attribute the intrusion to a specific
      government and explicitly states it found no indication the Greek government was responsible, but
      notes the same targeting infrastructure/email overlaps with a previously documented Pegasus campaign
      against Russian- and Belarusian-speaking exiled journalists and opposition figures in Europe —
      suggesting a single Pegasus customer with multi-country spying authorization. Because Kouloglou sat on
      the committee investigating exactly this class of abuse, the intrusion would have given the operator
      visibility into confidential PEGA Committee deliberations and documents, raising EU parliamentary
      privilege and confidentiality concerns.
    region_nexus: "Europe — European Parliament (PEGA Committee); overlap with a campaign against Russian/Belarusian-speaking targets inside the EU"
