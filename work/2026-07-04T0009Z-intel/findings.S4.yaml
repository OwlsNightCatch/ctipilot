  - title: "Sysdig documents JADEPUFFER — the first fully autonomous, LLM-driven ransomware operation, via Langflow CVE-2025-3248"
    sources:
      - { url: "https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion", publisher: "Sysdig Threat Research Team", date: "2026-07-01", role: "primary" }
