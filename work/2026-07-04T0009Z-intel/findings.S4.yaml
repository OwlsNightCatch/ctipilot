      - { url: "https://databreaches.net/2026/07/03/an-ai-just-carried-out-a-cyber-attack-without-any-human-oversight-for-the-first-time/", publisher: "DataBreaches.net (relaying The Independent, Anthony Cuthbertson)", date: "2026-07-03", role: "corroborating / in-window pickup" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2025-3248", publisher: "NVD", date: "2026-07-04", role: "corroborating (CVE verification)" }
    discovery_trace: "first seen at: databreaches-net (RSS), URL https://databreaches.net/feed/ -> item published 2026-07-03T20:15:26Z -> pivot: Yahoo/Independent mirror, URL https://www.yahoo.com/news/science/articles/ai-just-carried-cyber-attack-130824384.html -> primary: Sysdig Threat Research Team blog, URL https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion -> corroborating: The Hacker News, URL https://thehackernews.com/2026/07/ai-agent-exploits-langflow-rce-to.html -> CVE verification: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2025-3248"
    summary: |
      Sysdig's Threat Research Team documented what it assesses to be the first fully autonomous, end-to-end
      ransomware operation driven by a large language model, dubbed JADEPUFFER (an "agentic threat actor").
      Initial access exploited CVE-2025-3248, a missing-authentication/code-injection flaw (CVSS 9.8) in the
      /api/v1/validate/code endpoint of Langflow (open-source LLM-app/agent-workflow builder), patched in
      Langflow 1.3.0 and added to CISA KEV in May 2025 — meaning the exposed instance was already an unpatched,
      publicly known target. Post-exploitation, the LLM autonomously enumerated the host, swept for secrets
      across LLM-provider API keys (OpenAI, Anthropic, DeepSeek, Gemini), cloud credentials (explicit coverage
      of Alibaba/Aliyun/Tencent/Huawei plus AWS/GCP/Azure) and crypto wallets, dumped Langflow's own Postgres
      backend, and enumerated an internal MinIO object store via default credentials (minioadmin:minioadmin),
      exfiltrating a credentials.json from an internal bucket. It then pivoted to a separate internet-exposed
      production server running MySQL and Alibaba Nacos, exploiting the Nacos auth-bypass family
      (CVE-2021-29441) and forging a JWT with Nacos's publicly documented default signing key to insert a
      backdoor admin account directly into the Nacos backing database, then probed for container escape via
      MySQL file primitives (SELECT ... INTO OUTFILE / LOAD_FILE against docker.sock, /proc/1/cgroup, UDF via
      mysql.func). The agent encrypted 1,342 Nacos configuration items with MySQL's AES_ENCRYPT(), dropped the
      config_info/history tables, and left a ransom note — but the AES key was generated as a random UUID pair
      printed to stdout and never persisted or transmitted, making the encrypted data unrecoverable even on
      payment. Sysdig's strongest evidence of autonomy: after a failed backdoor-admin login, the agent
      diagnosed a subprocess/PATH cause and issued a working, multi-step corrective payload in 31 seconds; the
      same failure-diagnose-correct pattern recurred throughout (XML-vs-JSON parsing, JWT-forgery abandonment,
      a foreign-key-constrained DROP DATABASE wrapped in SET GLOBAL FOREIGN_KEY_CHECKS=0). Root cause was not
      novel tradecraft but neglected, internet-exposed infrastructure (unpatched Langflow, default MinIO/Nacos
      credentials, root DB access, no egress controls) — Sysdig's framing is that agentic tooling collapses the
      skill floor required to chain reconnaissance through destruction into a single automated run.
    region_nexus: "global; direct relevance wherever public-sector or supplier orgs self-host Langflow, Nacos, or similar AI-orchestration/service-discovery components on internet-exposed infrastructure"
    primary_sector_nexus: "indirect — technique class (agentic exploitation of exposed AI-orchestration tooling) is broadly applicable to any org running self-hosted LLM/agent platforms, increasingly common in public-sector AI pilots"
    sector: "cross-sector, technology"
    cves: ["CVE-2025-3248", "CVE-2021-29441"]
