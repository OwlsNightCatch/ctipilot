  - title: "Google/FBI/Lumen/Shadowserver disrupt NetNut (Popa) residential-proxy botnet — ~2 million Badbox 2.0-infected smart TVs and streaming boxes"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks", publisher: "Google Threat Intelligence Group (GTIG)", date: "2026-07-02", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/netnut-proxy-network-disrupted-2-million-infected-devices-cut-off/", publisher: "BleepingComputer", date: "2026-07-03", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (webfetch listing), URL https://www.bleepingcomputer.com/news/security/ -> article URL https://www.bleepingcomputer.com/news/security/netnut-proxy-network-disrupted-2-million-infected-devices-cut-off/ (published 2026-07-03) -> primary: Google Threat Intelligence Group blog, URL https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks (published 2026-07-02)"
    summary: |
      Google's Threat Intelligence Group (GTIG), coordinating with the FBI, Lumen Technologies and The
      Shadowserver Foundation, disrupted NetNut (also tracked as "Popa"), a residential-proxy botnet GTIG
      estimates controls at least 2 million infected devices worldwide, predominantly Android-based smart TVs
      and streaming/set-top boxes compromised via trojanized applications carrying the Badbox 2.0 malware
      family. Google disabled Google accounts and infrastructure used for NetNut command-and-control, shared
      technical intelligence with ecosystem partners, and used Google Play Protect to block apps bundling
      NetNut SDKs; the FBI separately seized the netnut.com domain. GTIG reports that in a single week in June
      2026 it observed 316 distinct threat clusters — including both cybercriminal and espionage actors —
      routing traffic through suspected NetNut exit nodes to mask malicious activity behind residential IP
      space, underscoring the proxy-network layer as shared criminal/state-actor infrastructure rather than a
      single-group tool. This is the same Popa/Vo1d-plugin botnet Krebs/Qurium research tied to
      Alarum/NetNut in late June 2026 (tracked in the registry as campaign:popa-vo1d-residential-proxy-botnet);
      this action is the law-enforcement/industry disruption of that tracked infrastructure. Google itself
      cautions the takedown reduced available device pools "by millions" but that individual proxy operators
      can appear resilient and rival operators may absorb displaced capacity.
    region_nexus: "global — residential-proxy exit-node infrastructure is used to mask traffic from any region, including against EU/Swiss-facing targets; relevant to any org doing IP-reputation-based blocking or fraud/anomaly detection keyed on residential ASNs"
    primary_sector_nexus: "indirect — proxy-botnet infrastructure is used broadly across cybercriminal and espionage-actor traffic, not sector-specific"
    sector: "cross-sector, telecom/consumer-IoT"
    cves: []
    entity_keys: ["campaign:popa-vo1d-residential-proxy-botnet"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:campaign:popa-vo1d-residential-proxy-botnet"
    evidence:
      - quote: "Google Threat Intelligence Group (GTIG) estimates the size of the NetNut network to be at least 2 million devices, distributed across the world."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks"
      - quote: "We believe our coordinated actions have caused significant degradation to NetNut's proxy network and its business operations, reducing the available pool of devices for the proxy operator by millions."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks"
      - quote: "In a single week during June 2026, GTIG observed 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks"
    extended_notes: |
      Defender-relevant hunt angle: residential-proxy exit-node traffic (Badbox 2.0-class botnets) is used to
      defeat geo/IP-reputation-based fraud and abuse controls; SOC teams doing IP-reputation allow/deny-listing
      or anomaly detection on "residential" ASN traffic should treat this disruption as temporary attrition,
      not elimination, of that traffic class per Google's own caveat about rival-operator capacity absorption.
      No CVE / no MITRE ATT&CK technique specific to this item beyond general botnet C2 (T1584.005 Compromise
      Infrastructure: Botnet) and proxyware abuse (T1090.003 Multi-hop Proxy) as the operational technique the
      botnet enables for downstream actors.

