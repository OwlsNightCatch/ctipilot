    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Sysdig Threat Research Team (TRT) has captured what we assess to be the first documented case of agentic ransomware: a complete extortion operation driven end-to-end by a large language model (LLM)."
        attribution: "Sysdig Threat Research Team"
        source_url: "https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion"
      - quote: "CVE-2025-3248 is a missing-authentication flaw in its code validation endpoint that allows an unauthenticated attacker to execute arbitrary Python on the host."
        attribution: "Sysdig Threat Research Team"
        source_url: "https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion"
      - quote: "The flaw was fixed in Langflow 1.3.0 and added to CISA's Known Exploited Vulnerabilities list in May 2025, but plenty of servers were never updated."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/ai-agent-exploits-langflow-rce-to.html"
    extended_notes: |
      Detection/hunt concepts (source-supported): egress monitoring for cron/scheduled-task beaconing off
      application hosts (Sysdig's captured persistence mechanism was a crontab entry beaconing every 30 minutes
      to attacker infra over HTTP on a non-standard port); MySQL query-log/audit monitoring for
      SELECT ... INTO OUTFILE / LOAD_FILE against filesystem paths outside expected data directories (container
      escape pre-check pattern via docker.sock / /proc/1/cgroup reads); anomalous INSERT/DELETE churn against a
      Nacos/IAM backing-database users/roles table in a short window; MinIO/S3-compatible endpoints answering to
      default credentials (minioadmin:minioadmin) reachable from an application host. Hardening: patch Langflow
      to >=1.3.0 and never expose code-execution/validation endpoints to the internet; rotate Nacos's
      token.secret.key away from the publicly documented default and never let Nacos authenticate to its
      backing DB as root; scope LLM-provider/cloud credentials away from web-reachable AI-orchestration hosts
      (secrets manager, not environment variables); egress-filter application hosts so a compromised server
      cannot reach arbitrary external databases or staging infrastructure. MITRE ATT&CK (mapped by researcher
      framing, not explicitly labelled in source): T1190 Exploit Public-Facing Application (Langflow RCE);
      T1552 Unsecured Credentials (LLM/cloud-key and MinIO default-credential harvesting); T1078 Valid Accounts
      (Nacos backdoor-admin insertion via forged JWT); T1611 Escape to Host (Docker-socket/UDF container-escape
      probing); T1486 Data Encrypted for Impact / T1485 Data Destruction (AES_ENCRYPT ransomware + DROP DATABASE
      mass destruction). Flagging borderline: the Sysdig primary (2026-07-01) and Hacker News corroboration
      (2026-07-02) both predate the 8h window; inclusion rests on the in-window (2026-07-03T20:15Z) DataBreaches.net/
      Independent syndication continuing to surface this story, and on its substantive, non-recycled technical
      depth for a Tier 2/3 audience. Main agent should weigh whether this reads as fresh signal or stale
      pickup for this fire.
