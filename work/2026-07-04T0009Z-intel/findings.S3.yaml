      - quote: "The phishing kit deploys a seven-layer anti-analysis system combining client-side behavioral verification with XOR-encrypted payloads."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/"
      - quote: "EvilTokens is the first PhaaS to offer AI-augmented post-compromise tooling. The integration of LLM-driven automation significantly reduces the attacker's processing time and lowers the entry barrier for threat actors."
        attribution: "Sekoia"
        source_url: "https://www.sekoia.com/blog/eviltokens-an-ai-augmented-phishing-as-a-service-for-automating-bec-fraud-part-2"
    extended_notes: |
      MITRE ATT&CK techniques Talos maps: T1566.002 (Spearphishing Link), T1528 (Steal Application
      Access Token), T1098.001 (Additional Cloud Credentials), T1114.002 (Remote Email Collection),
      T1550.001 (Use Alternate Authentication Material), T1531 (Account Access Removal), T1583.006
      (Acquire Infrastructure: Web Services), T1027 (Obfuscated Files or Information), T1497.001
      (Virtualization/Sandbox Evasion: System Checks). Detection angle for defenders: device-code flows
      are legitimate in Entra ID (used for CLI/limited-input-device sign-in) — hunt for anomalous device-code
      grants via Entra ID sign-in logs (non-interactive sign-ins correlated with unusual client apps/user
      agents), and for PRT-broker registration events outside managed-device enrollment baselines.
      Hardening lever: Conditional Access policies restricting/blocking the device-code authentication flow
      to only where operationally required (Microsoft added CA support for blocking this flow), plus
      phishing-resistant MFA (FIDO2/Windows Hello for Business) which does not eliminate device-code abuse
      but narrows where it can be chained.
