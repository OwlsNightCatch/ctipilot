  - title: "Kaspersky names \"Armored Likho\": new APT using AI-assisted loaders and Python BusySnake Stealer against government and power-sector targets in Russia, Brazil, Kazakhstan"
    sources:
      - { url: "https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/", publisher: "Kaspersky / Securelist", date: "2026-07-03", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/armored-likho-targets-government.html", publisher: "The Hacker News", date: "2026-07-03", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"site:thehackernews.com 2026/07/03\") → https://thehackernews.com/2026/07/armored-likho-targets-government.html → primary: Kaspersky/Securelist, URL https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/ (RSS pubDate confirmed via https://securelist.com/feed/)"
    summary: |
      Kaspersky designated a previously undocumented cluster "Armored Likho" (circumstantial overlap with
      the group Kaspersky separately tracks as "Eagle Werewolf"), running an active spear-phishing campaign
      against government agencies and electric-power-sector organizations in Russia, Brazil, and Kazakhstan.
      Initial access is a RAR-archived EXE dropper delivered via phishing lures themed as government/social
      program notices (T1566.001 Spearphishing Attachment); a second observed chain abuses ZDI-CAN-25373,
      a Windows .LNK display-spoofing flaw that lets attackers hide malicious command-line arguments behind
      whitespace/line-break padding in the shortcut's target field. The payload is BusySnake Stealer, a
      previously unreported Python-based infostealer targeting Windows, obfuscated/encrypted with PyArmor
      Pro 9.2.0 and using a bytecode-decrypt-on-call / re-encrypt-after-call scheme to frustrate static and
      dynamic analysis. Capabilities include browser credential/cookie theft (Chrome/Chromium/Firefox),
      cryptocurrency-wallet harvesting, Telegram Desktop credential theft, clipboard/file/screenshot
      collection, and a built-in reverse-SSH tunneling module functionally equivalent to the group's
      earlier Go2Tunnel tool — Kaspersky cites this tool-lineage overlap plus architectural similarity to
      the AquilaRAT RAT as the attribution basis linking Armored Likho to the known "Eagle Werewolf"/AquilaRAT
      cluster. Persistence is established via VBScript-launched scheduled tasks. Kaspersky notes indications
      that first-stage loader/stager code was likely AI-assisted (redundant comments, boilerplate code
      structure).
    region_nexus: "Russia, Brazil, Kazakhstan (named victims); technique set (LNK spoofing via ZDI-CAN-25373, PyArmor-obfuscated Python stealers) is portable to any government/critical-infrastructure target and relevant to EU/CH threat-hunting baselines"
    primary_sector_nexus: "primary"
    sector: "public-sector / government, energy / electric-power"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "actor:armored-likho", type: actor, name: "Armored Likho",
          aliases: ["Eagle Werewolf (circumstantial overlap, per Kaspersky)"],
          summary: "Newly designated APT cluster (Kaspersky, 2026-07-03) spear-phishing government and electric-power-sector targets in Russia, Brazil and Kazakhstan with the Python-based BusySnake Stealer; tool overlap (Go2Tunnel-equivalent module, AquilaRAT architecture) links it to the group Kaspersky separately tracks as Eagle Werewolf." }
      - { key: "tool:busysnake-stealer", type: malware, name: "BusySnake Stealer",
          aliases: [],
          summary: "Previously undocumented Python-based Windows infostealer (PyArmor Pro 9.2.0 obfuscated) deployed by Armored Likho; harvests browser/crypto-wallet/Telegram credentials and includes a built-in reverse-SSH tunneling module (Kaspersky, 2026-07-03)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Armored Likho blends financially motivated campaigns targeting private individuals with targeted cyber-espionage aimed at organizations. Their toolkit features obfuscated, modular RATs and infostealers specifically engineered to bypass dynamic analysis."
        attribution: "Kaspersky / Securelist"
        source_url: "https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/"
      - quote: "The group leveraged the ZDI-CAN-25373 shortcut vulnerability to conceal the contents of their command line. This flaw allows the attackers to use spaces or line breaks to hide execution parameters."
        attribution: "Kaspersky / Securelist"
        source_url: "https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/"
      - quote: "In previously identified campaigns, the group used the Go2Tunnel tool designed to create reverse SSH tunnels. In BusySnake Stealer, similar functionality is implemented as a built-in feature."
        attribution: "Kaspersky / Securelist"
        source_url: "https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/"
    extended_notes: |
      Detection angle: hunt for scheduled-task creation chained from VBScript execution shortly after an
      LNK/RAR attachment is opened from a mail-client parent process (Sysmon EID 1 process-creation with
      parent wscript.exe/cscript.exe → schtasks.exe; EID 11 file-create for .lnk in Downloads/Temp with a
      target field containing embedded whitespace/line-break padding, the ZDI-CAN-25373 signature).
      Hardening lever: Windows LNK target-path validation / disabling shell icon preview for
      untrusted-zone shortcuts; ensure MOTW propagation and Defender ASR rules blocking Office-spawned
      child processes from executing scripting hosts. No CVE number was assigned by Kaspersky for
      ZDI-CAN-25373 in this article (referenced only by ZDI candidate ID); flagged for the main agent to
      resolve to a CVE if one exists before use in frontmatter cves[].
    borderline: true
    borderline_reason: "Primary (Kaspersky/Securelist RSS pubDate confirmed) published 2026-07-03T10:00:33Z, ~14h before this run's 8h window opened at ~2026-07-03T16:09Z — closest-to-window substantive research item found this run but still outside the strict cutoff."
