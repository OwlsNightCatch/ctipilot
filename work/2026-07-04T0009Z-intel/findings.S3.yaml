  - title: "Cisco Talos: ARToken — an EvilTokens affiliate panel automating device-code phishing and PRT theft against Microsoft 365"
    sources:
      - { url: "https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/", publisher: "Cisco Talos", date: "2026-07-01", role: "primary" }
      - { url: "https://www.sekoia.com/blog/eviltokens-an-ai-augmented-phishing-as-a-service-for-automating-bec-fraud-part-2", publisher: "Sekoia", date: "2026-04-07", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"blog.talosintelligence.com July 2026 new research\") → listing https://blog.talosintelligence.com/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/ → corroborating background: Sekoia, URL https://www.sekoia.com/blog/eviltokens-an-ai-augmented-phishing-as-a-service-for-automating-bec-fraud-part-2"
    summary: |
      Cisco Talos published a deep-dive on ARToken, an affiliate operator panel built on top of the
      EvilTokens phishing-as-a-service (PhaaS) platform (first documented by Sekoia in April 2026),
      exposing 80+ backend API endpoints for device-code phishing against Microsoft 365 tenants (RFC
      8628 OAuth 2.0 device-authorization-grant abuse, T1566.002 lure → T1528 Steal Application Access
      Token). Captured tokens are escalated to Primary Refresh Token (PRT) acquisition via "broker" mode
      (T1550.001 Use Alternate Authentication Material), giving persistent access to Microsoft 365/Entra
      ID resources that survives a victim password reset — MFA is bypassed entirely because the flow
      never presents a credential prompt to intercept. The panel bundles BEC tooling (mailbox browsing via
      a built-in Outlook-style UI, T1114.002), SharePoint/OneDrive file browsing and exfiltration, and a
      seven-layer anti-analysis stack (mouse-movement/timing behavioral checks, device fingerprinting,
      XOR-encrypted payload delivery) intended to defeat automated sandbox triage (T1497.001). Talos
      documents 500+ Cloudflare Workers domains tied to the wider EvilTokens infrastructure and a
      subscription-affiliate pricing model ($1,500 one-time plus $500/month), indicating a maturing
      criminal-service economy around identity-token theft rather than a one-off phishing kit. Talos
      published IOCs on GitHub for network blocking and hunting.
    region_nexus: "global; any Microsoft 365 / Entra ID tenant, including EU/CH public-sector deployments, is a viable target for the underlying device-code phishing technique"
    primary_sector_nexus: "indirect"
    sector: "cross-sector, technology, public-sector (any Microsoft 365 tenant)"
