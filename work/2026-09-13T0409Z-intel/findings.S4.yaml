items:
  - title: "Revolut discloses customer KYC/identity data handed to an attacker who impersonated a government agency using its own genuine email domain — no system was breached, the request simply looked authentic"
    sources:
      - { url: "https://techcrunch.com/2026/09/12/revolut-confirms-customer-data-breach-through-fake-government-requests/", publisher: "TechCrunch", date: "2026-09-12", role: "primary" }
      - { url: "https://securityaffairs.com/198922/data-breach/revolut-exposed-kyc-data-after-fraudulent-government-email-passed-security-checks.html", publisher: "Security Affairs", date: "2026-09-12", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs, URL https://securityaffairs.com/ (homepage extract, article teaser) → primary: TechCrunch, URL https://techcrunch.com/2026/09/12/revolut-confirms-customer-data-breach-through-fake-government-requests/ → corroborating full write-up: Security Affairs, URL https://securityaffairs.com/198922/data-breach/revolut-exposed-kyc-data-after-fraudulent-government-email-passed-security-checks.html (quotes Revolut's own customer notification directly) → further corroboration via WebSearch (\"Revolut KYC breach fake government email September 2026\"): The Block, CryptoTimes, 247WallSt, BNO News all independently confirmed the same customer-notification text on 2026-09-12"
    summary: |
      Revolut confirmed on 2026-09-12 that it disclosed sensitive customer data to an unauthorized
      third party after receiving fraudulent information requests sent from an email account
      operating inside a genuine government agency's own domain infrastructure — Security Affairs
      assesses the attacker either registered a rogue mailbox within that domain or compromised an
      existing one. Because the message carried valid domain-authentication credentials for that
      domain, Revolut's compliance/KYC-response process treated it as an authentic official request
      and fulfilled it: exposed data included full name, date of birth, occupation, postal/email
      address, phone number, passport/driver's-licence copies, verification selfies, IBAN/account
      statements, withdrawal records and full transaction history including Bitcoin. No Revolut
      system was compromised and no malware was involved — the entire "breach" was a successful
      social-engineering compromise of the legal/regulatory data-request channel, not a technical
      intrusion. Revolut says a "limited" number of customers were affected and declines to name the
      government agency, the country, or the customer count; crypto-investigator ZachXBT assesses
      the operation was targeted at high-net-worth individuals for detailed identity/crypto-history
      profiling rather than bulk data theft. Revolut discovered the fraud only when it independently
      contacted the agency to verify the request and was told the agency never sent it; it has since
      blocked the sending mailbox, notified the agency, law enforcement and financial regulators.
      The transferable lesson: any organisation whose legal/compliance team fulfils data requests
      based on domain-level email authenticity alone (SPF/DKIM/DMARC-style trust in "this really is
      that domain") is exposed to the same class of attack once an adversary controls (or spoofs
      convincingly enough into) a single mailbox on a trusted government or law-enforcement domain —
      a pattern with obvious relevance to any authority that itself issues legal data requests to
      third parties (banks, telcos, cloud/ISPs) as part of investigations, since compromise of that
      authority's own mail infrastructure could be used to defraud third parties in its name.
    region_nexus: "global (UK-headquartered fintech, 80M+ customers, EU/UK banking licenses); no Swiss nexus confirmed, but Revolut operates in Switzerland and the technique targets a process (verifying inbound legal/government data requests) any Swiss public-sector authority issuing such requests, or any org receiving requests purportedly from Swiss authorities, must also defend"
