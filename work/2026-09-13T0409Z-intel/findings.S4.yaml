    extended_notes: |
      Not a technical intrusion and no CVE — this is a process/verification failure in a
      legal-data-request handling workflow, closely related in shape to the "fake Emergency Data
      Request" (EDR) fraud pattern that previously hit Discord, Apple, Meta and Snap (attacker
      obtains or spoofs law-enforcement email access and submits an urgent, seemingly-authentic
      legal request that bypasses the normal warrant/subpoena verification a company would apply).
      Here the same pattern is documented for the first time (in this run's search) against a
      major fintech's KYC/AML compliance channel rather than a social platform's law-enforcement
      portal. Defender takeaway for any org (public or private) that operates a legal/regulatory
      data-request intake process: treat inbound "official" requests as requiring OUT-OF-BAND
      verification (a callback to a directory-listed number, not a reply to the same channel, and
      never trust email-domain authentication alone as proof of institutional authority) regardless
      of how convincing the sending domain looks; log and periodically audit which staff can
      approve bulk/sensitive data releases against a legal-request queue, since this is exactly the
      chokepoint the attacker targeted.
