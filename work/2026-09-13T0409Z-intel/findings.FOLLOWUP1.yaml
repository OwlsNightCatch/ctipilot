    summary: |
      Cisco Talos published a report (2026-09-09) confirming in-the-wild abuse of both CVE-2026-20079 (CVSS 10.0
      unauthenticated auth-bypass-to-root, the subject of the existing 2026-08-04 entry) and CVE-2026-20316 (the
      KEV-listed static-credential flaw) by three named post-compromise clusters on Cisco Secure FMC instances.
      UAT-12197 exploited CVE-2026-20079 alone, planting a JSP web shell in the CSM Tomcat webroot and a JAR-based
      command executor (cmd.jar) used to query the FMC's internal MDB database (`SELECT name, auth_data FROM users`)
      for credential theft. UAT-11823 — assessed by Talos with high confidence to have exploited BOTH CVE-2026-20079
      and CVE-2026-20316, and stated by Talos to "overlap in tooling with the Sandworm APT actor" (a tooling-overlap
      assessment, not a firm identity claim) — replaced the `license.tmp` file with a malicious Makeself package
      executed as root via `package_info.pl --lsm`, established a Netcat reverse shell, exfiltrated managed-device
      configurations, and ultimately deployed a variant of Cyclops Blink, the modular ELF implant the US/UK
      previously attributed to Sandworm (2022, WatchGuard Firebox/ASUS routers). UAT-11988, entering via the
      CVE-2026-20316 static credential alone, conducted extensive AD/MySQL credential harvesting and domain
      enumeration entirely through legitimate FMC tooling used in living-off-the-land fashion, staged a Python
      SOCKS5 proxy and reverse-SSH tunnel forwarding LDAP/LDAPS/Kerberos/SMB/NetBIOS/WinRM, then deployed Impacket,
      Invoke-TheHash and custom AV killers before deploying Qilin ransomware — Talos states the actor's "subsequent
      actions and TTPs... were consistent with those of Qilin ransomware affiliates" (a TTP-consistency assessment,
      not a definitive Qilin-affiliate identity claim). Cisco's own advisory was separately revised to v2.5 on
      2026-09-09 to add: "In August 2026, the Cisco PSIRT became aware of active exploitation of this vulnerability"
      — confirming exploitation Cisco had not previously stated, matching but predating the existing entry's
      2026-09-10 KEV-addition update. Cisco confirms a comprehensive Secure FMC/ASA/FTD hardening release, bundling
      these hotfixes with additional internally discovered vulnerabilities, is scheduled to publish 2026-09-16 (not
      yet published as of this run).
    region_nexus: "global; directly relevant to the Swiss public-sector constituency given widespread Cisco Secure Firewall deployments across government/critical-infrastructure networks, and given Sandworm's documented history of targeting European government and critical-infrastructure networks (including the CERT-Polska/UK-EU-attributed December 2025 Polish grid sabotage already in this store)"
