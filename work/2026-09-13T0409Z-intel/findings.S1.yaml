        attribution: "Volexity"
        source_url: "https://www.volexity.com/blog/2026/09/09/mind-the-patch-gap-multiple-chinese-threat-actors-chain-0-day-exploits-in-chrome-windows/"
    extended_notes: |
      Defender takeaways not previously captured in the entry: (1) benign-lookalike discriminator — legitimate chrome.exe does not spawn cmd.exe/curl chains or msiexec.exe installs from a browser-process context; a child process of chrome.exe executing curl to fetch and run an .exe, or an unexplained msiexec.exe beaconing outbound over HTTPS to a per-hostname path, is the observable signature of the sandbox-escape stage. (2) Chrome extension integrity: organizations should enforce ExtensionInstallBlocklist/ExtensionInstallAllowlist policy rather than relying on Secure Preferences tamper-resistance alone, since the legacy-MAC fallback (default-enabled as of 2026-09-08 unless compiling Chromium from source) can be defeated to smuggle in an unauthorized extension. (3) Hunt for the scheduled task name "Windows Scheduled System" recurring at 5-minute intervals as a GRIMWEDGE-chain persistence indicator. (4) All three patches were already available before this Volexity report (Chrome 152/153, Microsoft's September cumulative), so the do-now action for any org that has not yet closed the September Patch Tuesday / Chrome update gap remains unchanged from the parent entry — this update is about the sector-targeting and mechanism detail, not a new remediation deadline.

  - title: "GitLab's 19.3.2/19.2.6/19.1.8 patch release also fixed a CVSS 9.9 authenticated deserialization flaw exposing Advanced Search credentials, and a CVSS 8.5 RCE via crafted Git project import — both confirmed by NCSC Switzerland alongside the already-tracked path traversal"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12935", publisher: "NCSC Switzerland (GovCERT.ch) Cyber Security Hub", date: "2026-09-11", role: "primary" }
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/", publisher: "GitLab", date: "2026-09-10", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12935 (bridge: ncsc-csh recent 20, fetched 2026-09-13) → primary: GitLab's own patch-release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/ (cited as the Source Advisory in the NCSC-CH post)"
    summary: |
      This is a material update to the existing entry for CVE-2026-85706 (GitLab CE/EE unauthenticated path-traversal file read, CVSS 10.0, already KEV-listed and under confirmed exploitation). The same 2026-09-10 patch release (19.3.2 / 19.2.6 / 19.1.8) that fixed CVE-2026-85706 also fixed two further vulnerabilities not previously recorded in the entry, one of them independently confirmed critical by NCSC Switzerland's own advisory (dated 2026-09-11, titled jointly for both CVEs):
      CVE-2026-87719 (CVSS 3.1: 9.9, GitLab EE only) is an insecure-deserialization flaw in the GraphQL subscription serializer: an authenticated user who holds Duo Chat access can supply a specially crafted GraphQL subscription argument to bypass serialization and perform a server-side object lookup, obtaining Advanced Search instance configuration and sensitive stored credentials. NCSC-CH's advisory states the impact includes exposure of "Advanced Search configurations and stored credentials." Affected: GitLab EE all versions from 18.3 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.
      CVE-2026-88765 (CVSS 3.1: 8.5, GitLab EE only, vendor-sourced only — not covered in the NCSC-CH advisory) is a buffer overflow in the Unicode-conversion wrapper used by Advanced Search indexing: an authenticated user can trigger remote code execution by importing a specially crafted Git project export that overflows the conversion buffer during indexing. Affected: GitLab EE all versions from 12.3 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2 — a substantially longer exposure window than the other two flaws given its 12.3 starting point.
      No confirmed in-the-wild exploitation is reported for either of these two CVEs; only CVE-2026-85706 (the path-traversal flaw already in the entry) is KEV-listed and confirmed exploited. Fix for all three, plus a long tail of lower-severity CVEs in the same release (SAML SSO bypass, CI/CD variable-scope escapes, XSS, DoS), is the same upgrade already recommended in the entry: 19.3.2 / 19.2.6 / 19.1.8.
