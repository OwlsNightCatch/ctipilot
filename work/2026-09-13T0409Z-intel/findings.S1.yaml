    evidence:
      - quote: "CVE-2026-85706 CVSS3.1: 10.0 (CRITICAL) - Unauthenticated path traversal enabling arbitrary file read via repository commits API\nCVE-2026-87719 CVSS3.1: 9.9 (CRITICAL) - Insecure deserialization exposing credentials via GraphQL subscription serializer"
        attribution: "NCSC Switzerland (GovCERT.ch) Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12935"
      - quote: "GitLab has remediated an issue that, under certain conditions, could allow an authenticated user with Duo Chat access to obtain Advanced Search instance configurations and sensitive credentials using a specially crafted GraphQL subscription argument to bypass serialization and perform server object lookup."
        attribution: "GitLab"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/"
      - quote: "GitLab has remediated an issue that, under certain conditions, could allow an authenticated user to achieve remote code execution by importing a specially crafted Git project export to overflow the Unicode conversion buffer used in Advanced Search indexing."
        attribution: "GitLab"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/"
    extended_notes: |
      CVE-2026-88765's affected-version floor (18.7... for CE — actually EE from 12.3) is notably older than the other two flaws in this release (18.3 and 18.7 respectively), meaning any EE instance that has deferred upgrades for a long period carries the largest exposure window for this specific RCE path. CVE-2026-88765 is sourced only from GitLab's own release notes (not corroborated by the NCSC-CH advisory, which named only CVE-2026-85706 and CVE-2026-87719); treat its severity/scope as vendor-single-source pending independent confirmation. Detection angle: audit logs for GraphQL subscription requests with abnormal argument shapes targeting Advanced Search, and for Advanced Search reindex operations immediately following a Git project import from an external/untrusted source.

