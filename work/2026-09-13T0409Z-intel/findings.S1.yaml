items:
  - title: "BlueMoon exploit kit: NCSC Switzerland confirms Government among targeted sectors; Volexity names a fourth operator (UTA0560) and details the full three-CVE Chrome/Windows chain plus two new backdoors"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12936", publisher: "NCSC Switzerland (GovCERT.ch) Cyber Security Hub", date: "2026-09-12", role: "primary" }
      - { url: "https://www.volexity.com/blog/2026/09/09/mind-the-patch-gap-multiple-chinese-threat-actors-chain-0-day-exploits-in-chrome-windows/", publisher: "Volexity", date: "2026-09-09", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12936 (bridge: ncsc-csh recent 20, fetched 2026-09-13) → primary: Volexity, URL https://www.volexity.com/blog/2026/09/09/mind-the-patch-gap-multiple-chinese-threat-actors-chain-0-day-exploits-in-chrome-windows/ (linked from the NCSC-CH post's References section)"
    summary: |
      This is a material update to the existing BlueMoon exploit-kit entry (2026-09-10), sourced from an NCSC Switzerland advisory published 2026-09-12 (in-window) and the Volexity technical write-up it cites (2026-09-09). NCSC-CH's own post states "no reported cases in CH so far" but lists Government among the targeted verticals (alongside NGO, Consulting, Finance, Mining, Commodity Trading) and names a fourth cluster: Volexity tracked UTA0560 exploiting the chain against NGOs from 2026-09-01, separate from Proofpoint's three clusters already in the entry.
      Volexity's write-up supplies the missing middle link in the exploit chain and full mechanism detail. The chain is three CVEs, not two: CVE-2026-85046 (Chrome V8 type confusion) grants arbitrary read/write in the V8 sandbox; CVE-2026-87491 (a WebAssembly defect) escapes the V8 sandbox; CVE-2026-85880, a previously unreported flaw in Windows RtlpCreateServerAcl, is a kernel local-privilege-escalation that lets the exploit escape Chrome's sandboxed renderer and inject code into the browser process itself — all three ship byte-for-byte identical shellcode across both observed operators. The p2 (kernel LPE) stage is conditional: it only fires if the process is not already elevated and the Windows build is in a specific target set (Win10 1809–22H2, Server 2022, Win11 21H2); builds above 22000 are rejected. Delivery is a reflected XSS on a legitimate US university website (UTA0560) or two attacker-registered domains fronted by Cloudflare Tunnels (JungleBamboo/APT31/TA412, already tracked in the entry), reached via spearphishing that dual-targets a victim's work and personal email addresses.
      UTA0560's post-exploitation payload is GRIMWEDGE, a sub-250-line JScript backdoor that runs in-memory as an eval()'d string inside msiexec.exe, delivered via a signed-binary DLL-sideloading dropper (msgbox.exe) and a per-victim beacon URL keyed on hostname (https://<C2>/%COMPUTERNAME%.txt); it supports ten commands (recon, directory listing, file create/delete/read, process list/kill, command execution, chunked file upload) and persists via a scheduled task ("Windows Scheduled System") that re-runs the sideloading chain every five minutes. JungleBamboo's payload chain (SUPERSTOMP → LONGTALE) is a distinct technique: SUPERSTOMP tampers with Chrome's Secure Preferences file to install a malicious extension impersonating "Google Gemini" (extension ID ckiknalbeplpcpofpnabcnhjcegckfei) by stripping the per-preference and super_encrypted_hash integrity values and forging valid legacy-HMAC values, exploiting Chrome's default legacy-MAC fallback (disabled only when compiling Chromium from source); Chrome then re-authenticates the tampered state under its own newer integrity scheme. The resulting LONGTALE extension keylogs every keystroke and form/clipboard value across all tabs with no sensitive-field suppression, steals all cookies plus localStorage/sessionStorage tokens, takes keyword-triggered screenshots, and exfiltrates collected data roughly every 30 seconds; it deliberately has no remote-code-execution command, sufficient for JungleBamboo's stated credential-theft and surveillance objective.
      All three CVEs are patched (Chrome 152.0.7977.82/.83 for CVE-2026-85046, Chrome 153 for CVE-2026-87491, Microsoft's September 2026 cumulative update for CVE-2026-85880); persistence mechanisms (malicious extension, DLL sideloading, scheduled tasks) survive an OS/browser patch untouched and require separate remediation.
    region_nexus: "global espionage targeting (NGO, government, consulting, finance, mining, commodity trading); NCSC-CH explicitly assessed no Swiss victims reported so far, but Government is named among targeted verticals"
