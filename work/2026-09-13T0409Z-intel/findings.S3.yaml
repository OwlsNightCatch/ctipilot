    extended_notes: |
      Not a technical vulnerability finding — an interview/analysis piece about the vulnerability-disclosure ecosystem itself. Included because it gives vulnerability-management and detection-engineering teams a concrete, named framework for triaging the flood of CVE-bearing vendor bulletins they receive: the "stunt cryptography" profile is a multi-step, lab-only precondition chain, no named real-world attacker after public disclosure, and disproportionate marketing (dedicated name/logo/website) relative to attacker cost-benefit. Practical takeaway for a Tier 2/3 triage workflow: weight a CVE's remediation priority by whether any of these markers are present, and expect vendor-severity ratings on such findings to be contested or revised. Single-source (heise's exclusive Q&A with Gutmann); the OpenSSL Conference speaker page independently confirms the referenced talk and topic are genuine (not fabricated framing) but does not itself corroborate the specific dollar figures or case studies, which rest on Gutmann's own account.
