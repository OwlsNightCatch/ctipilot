items:
  - title: "Peter Gutmann names 'stunt cryptography' — CVE disclosures engineered for academic visibility that cost open-source projects tens to hundreds of thousands of dollars to refute"
    sources:
      - { url: "https://www.heise.de/news/Interview-Zehntausende-US-Dollar-Schaden-durch-aufgeblaehte-Sicherheitswarnungen-11443876.html", publisher: "heise online (Wolf Hosbach, interview with Peter Gutmann)", date: "2026-09-12", role: "primary" }
      - { url: "https://openssl-conference.org/speaker-peter-gutmann", publisher: "OpenSSL Conference 2026 (Prague, 13-15 Oct) speaker page", date: "2026-04-17", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → primary: heise online interview with Peter Gutmann, URL https://www.heise.de/news/Interview-Zehntausende-US-Dollar-Schaden-durch-aufgeblaehte-Sicherheitswarnungen-11443876.html → corroboration: OpenSSL Conference 2026 speaker page confirming the referenced talk 'The Cost of Stunt Cryptography' is a genuine, scheduled session, URL https://openssl-conference.org/speaker-peter-gutmann"
    summary: |
      Cryptographer Peter Gutmann (PGP co-author, cryptlib maintainer, University of Auckland) gave heise online an interview ahead of his October 2026 OpenSSL Conference talk "The Cost of Stunt Cryptography," describing a pattern relevant to vulnerability-management triage: security researchers increasingly craft CVE submissions optimized for conference acceptance and media attention rather than real-world exploitability, and open-source maintainers cannot dismiss them because a CVE ID, once assigned, propagates unconditionally into every downstream scanner and compliance checklist. He names SWEET32 (an attack requiring the attacker's own code already running in the victim's browser, encrypting 785GB of the attacker's own traffic to recover a single HTTP cookie), EFAIL (works only under narrow preconditions), and academic paper CVE-2023-51767 (step one: as root, send SIGSTOP to sshd — a precondition that already grants full control, making the remaining "attack" moot) as examples of exploits with real names, logos and dedicated websites but no named real-world attacker. Gutmann quantifies the downstream cost: a CVE against FIPS-140-validated code typically forces a $30,000-50,000, three-to-six-month revalidation — and because the CVE ID is platform-independent, it simultaneously invalidates every downstream vendor's own certification built on that same validated code, most of which is itself a rebrand of someone else's evaluation. GnuPG spent roughly three person-weeks refuting the "GPGFail" claims, none of which proved to be an exploitable vulnerability. Compliance regimes such as PCI DSS impose fixed 30-day (critical/high) and 90-day (other) remediation windows regardless of whether the underlying finding is real, and Gutmann cites a case where a low-severity CVE flagged against the curl.exe bundled with Windows led administrators to delete the file from System32 — triggering Windows Update's tamper detection and causing it to refuse service. His proposed mitigations: let the affected project, not the CVE submitter, set severity (including a "not applicable" or explicit "vanity" rating); larger projects should become their own CVE Numbering Authority to filter frivolous submissions pre-publication; and formally disputing a CVE is slow and largely thankless — OpenSSH's dispute of CVE-2023-51767 succeeded, but the unambiguously incorrect CVE-2016-2427 has sat in "disputed" status for years because no appeals timeframe exists.
    region_nexus: "global; directly relevant to any organization running FIPS-validated cryptographic modules or subject to fixed-SLA vulnerability-remediation compliance regimes (e.g., PCI DSS-equivalent obligations)"
