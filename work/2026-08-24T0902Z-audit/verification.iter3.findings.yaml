  url_or_quote: "\"no CVE identifier has been assigned to it\" (summary, body) / \"The second flaw carries no CVE identifier as of this run, which is why cves[] holds one record and not two\" (sourcing_note) / \"plus an unidentified flaw in 4.4.20\" (title) / \"the second flaw has no identifier to track\" (defender takeaway) — cited source https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/"
  summary: >-
    The cited CERT-FR advisory now states the opposite. Fetched this iteration via
    tools/fetch_source.py url: the Documentation block reads "Référence CVE CVE-2026-77806
    https://www.cve.org/CVERecord?id=CVE-2026-77806" and the version history reads
    "le 24 août 2026 — Ajout de l'identifiant CVE-2026-77806". The identifier itself was
    published before this run, not today: the CVE record (cveawg.mitre.org, fetched this
    iteration) carries datePublished 2026-08-21T13:37:43Z, description "SPIP before 4.4.21
    allows unauthenticated remote attackers to execute arbitrary code, as exploited in the
    wild in August 2026. This is related to code injection via an X-Spip-Filtre HTTP request
    header that is mishandled by analyse_resultat_skel", CVSS 3.1 base 9.8, and references the
    4.4.21 bulletin — i.e. it is unambiguously the second flaw. The entry's negative claim is
    false as published, its cves[] carries one record where two now exist, and the "no
    identifier to track" argument in the defender takeaway rests on it. Same claim to fix in
    docs/audits/2026-08-24-weekly-quality-audit.md ("no identifier has been assigned to the
    second flaw", published-misses bullet) and its watch-item row ("SPIP second flaw has no
    identifier — NEW — open"), plus the matching state/coverage_backlog.md row. The CERT-FR
    advisory is a citable authority for the identifier; the CVE page is not.
