- entry: entries/2026-08-12/wesco-exfilsquad-crm-confirmation-dispute.md
  verdict: imprecision
  defect: >
    techniques[] includes T1078.004 (Cloud Accounts), which names abuse of a valid/stolen
    cloud-account credential. The entry's own body explicitly describes the access mechanism as
    an "over-permissioned anonymous web role" and attributes read activity "to the anonymous or
    portal service identity rather than to a named user" — i.e. no credential theft or valid-account
    abuse is described anywhere in the entry. T1190 (Exploit Public-Facing Application), which better
    matches an unauthenticated/misconfigured-portal read, is not in techniques[] at all. All facts and
    quotes in the entry (BleepingComputer, 2026-08-11) were verified verbatim and are accurate; this is
    a technique-mapping mismatch, not a factual error in the narrative.
  ground_truth: >
    BleepingComputer (fetched) confirms Wesco's statement and the Power Pages/Dynamics 365 hedging
    exactly as quoted; it does not describe any credential compromise, which is consistent with the
    entry's own "anonymous web role" framing that T1078.004 contradicts.
  ground_truth_url: "https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/"

