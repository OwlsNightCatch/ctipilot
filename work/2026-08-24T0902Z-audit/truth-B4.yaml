- entry: entries/2026-08-13/cve-2026-45659-sharepoint-kev-ransomware-use-flagged.md
  verdict: imprecision
  defect: >
    The frontmatter cves[].fixed and the body both state the flaw was "patched by Microsoft on
    2026-05-21" / "fixed: Microsoft security updates of 2026-05-21" (a claim inherited verbatim from the
    original 2026-07-02 entry this one updates). Independent reporting on the patch date is inconsistent:
    a May 2026 TheHackerNews article states the SharePoint KB update pages show a "May 12, 2026" release
    date for the relevant SharePoint builds, while HelpNetSecurity's 2026-05-26 article (cited by the
    original entry) only says the fix was "addressed by updates that were released in May 2026" with no
    specific date, and separately states Microsoft's advisory was corrected on 27 May because the CVE was
    initially omitted from the May release notes. The entry's own cited primary for the date, MSRC's
    per-CVE page, could not be fetched in this environment (JS-only SPA; jina reader balance exhausted on
    every configured key) so the specific "05-21" figure could not be independently confirmed or refuted
    against its stated source. This is not proven wrong, but it is asserted with a precision the reachable
    corroborating sources do not support, and three different dates (12th, 21st, 27th) circulate across
    the ecosystem for what is effectively the same event.
  ground_truth: >
    HelpNetSecurity (2026-05-26): "Microsoft has updated the advisory to say that CVE-2026-45659 was
    addressed by updates that were released in May 2026" — no specific day given in the reachable text.
    TheHackerNews (May 2026 article): KB pages show "May 12, 2026" as the security-update release date.
    MSRC's own CVE-2026-45659 page (the entry's actual cited authority for "2026-05-21") returned only a
    client-side-rendered shell to both direct fetch and the jina reader in this environment and could not
    be read.
  ground_truth_url: "https://www.helpnetsecurity.com/2026/05/26/sharepoint-vulnerability-cve-2026-45659/"

