- entry: entries/2026-08-16/weekly-w33-disclosure-to-exploitation-interval-collapsed.md
  verdict: factual-error
  defect: >
    The entry states GeoServer's jsonArrayContains SQL injection had "no patch" / "no fix" as of
    publication (discovered_at 2026-08-16T23:50Z), both in the summary ("a GeoServer SQL injection with
    no CVE and no patch drew hundreds of exploitation attempts") and in the Defender takeaway
    ("NCSC-CH's own Cyber Security Hub advisory on the GeoServer flaw, published 14 August, reached Swiss
    operators while no fix existed to apply"). GeoServer released fixed versions 3.0.1, 2.28.5 and 2.27.6
    on 2026-08-14 — the same day as the NCSC-CH advisory and two days before this entry's publication —
    explicitly to resolve "Unauthenticated SQL injection in the jsonArrayContains filter function against
    PostGIS layers". The NCSC-CH advisory itself was edited on 2026-08-17 to add the fixed-version links,
    confirming the fix predates this entry's publication. The "no CVE" half of the claim still holds (only
    a GHSA id, GHSA-mqjf-5f49-2fjh, was assigned).
  ground_truth: >
    GeoServer 3.0.1 / 2.28.5 / 2.27.6, released 2026-08-14, fix the jsonArrayContains SQL injection ("This
    release addresses security vulnerabilities and is an urgent update for production systems... This
    releases includes the GeoTools 35.1 resolution of the above SQL Injection vulnerability").
  ground_truth_url: https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html

