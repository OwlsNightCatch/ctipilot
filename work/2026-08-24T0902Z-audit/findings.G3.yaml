    novelty: "update-of:2026-08-10/forescout-rockwell-plc-exposure-census-cellular-carrier-path"
    borderline: true
    borderline_reason: "genuine additive hardening/detection delta (protocol baselining, key-switch discipline, run/program-mode governance) on an already-heavily-tracked story rather than new facts about the campaign itself — main agent should judge whether this clears the update-of bar or is too incremental to publish separately"
    evidence:
      - quote: "Turn off the physical or software key switch that enables remote programming, so a remote session can't push new logic even if credentials are compromised."
        attribution: "Nozomi Networks Labs"
        source_url: "https://www.nozominetworks.com/blog/what-the-fbi-epa-plc-warning-means-for-water-utilities"
