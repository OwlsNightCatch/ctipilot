  - title: "DeadLock ransomware: a Curve25519 encryptor with resource-throttled dispatch and three-method Windows event-log wipe, deployed by Lynx/INC-ecosystem affiliates"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware/", publisher: "Microsoft Threat Intelligence", date: "2026-08-10", role: primary }
    discovery_trace: "first seen at: msft-ti (source-id), URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (listing sweep) → primary: Microsoft, URL https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware/ (datePublished 2026-08-10T15:00:00Z confirmed in page JSON-LD)"
    summary: |
      Microsoft Threat Intelligence profiles DeadLock, an emerging financially-motivated ransomware operation
      first observed July 2025, deployed by multiple groups including an affiliate shared with the Lynx and INC
      Ransom ecosystems (already-registered entity actor:incransom, alias Lynx). By July 2026 the group's leak
      site had published 80+ victims, over half in Europe, spanning IT, mining, transportation/logistics,
      manufacturing, hospitality and consumer goods across Europe, Asia, North America, South America and
      Africa. Its resilience play is decentralized recovery/negotiation infrastructure combining the Session
      messaging network with blockchain-backed storage for leak-hosting and negotiation resources. The Windows
      encryptor decodes an embedded config with an 8-byte XOR key, self-deletes if the system UI/default
      language matches an exclusion list, and — when invoked with a specific target-path argument — skips all
      preparation and jumps straight to encryption (the sample failed to self-elevate in Microsoft's dynamic
      analysis, so full preparation requires an already-elevated launch context). Before encrypting, it empties
      the recycle bin on every drive with no prompt, kills processes/services that could interfere with file
      access or detection, and applies three complementary Windows Event Log anti-forensic techniques together
      (API-based clearing, registry manipulation to disable future logging, and full channel enumeration) so
      that every log channel — including third-party and custom diagnostic channels — is cleared, disabled and
      access-locked. Encryption uses Curve25519 ECDH (with a non-standard SEC1 key-format prefix) and is
      dispatched by a per-drive monitoring thread that polls system resource utilization against hard thresholds
      before releasing each new file for encryption — gating new dispatch (not in-flight files) to keep the
      host's resource profile looking normal and avoid triggering hang/alert behavior. Thread count scales to
      2x CPU core count.
    region_nexus: "explicit majority-Europe victim base (>50% of 80+ named victims)"
    primary_sector_nexus: "indirect (IT, transportation/logistics, manufacturing named; no direct public-sector/energy/water/healthcare/finance/telco victim named in the source)"
    sector: "transport, manufacturing"
    cves: []
    techniques: [T1486, T1490, T1070.001, T1489, T1112, T1027]
    affected_products: []
    entity_keys: ["actor:incransom"]
    new_entities:
      - { key: "malware:deadlock-ransomware", type: malware, name: "DeadLock", aliases: [], summary: "Financially-motivated ransomware first observed July 2025, deployed by affiliates shared with the Lynx/INC Ransom ecosystem; uses Session messenger + blockchain-backed storage for decentralized leak/negotiation infrastructure, Curve25519 ECDH encryption, and three-method Windows Event Log anti-forensics (Microsoft Threat Intelligence, 2026-08-10)." }
    relation_suggestions:
      - { subject: "malware:deadlock-ransomware", object: "actor:incransom", basis: "Microsoft: 'Microsoft has observed DeadLock ransomware being deployed by multiple groups including an affiliate of the Lynx and INC ransomware ecosystems' (Microsoft Threat Intelligence, 2026-08-10)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: high
    novelty: new
    evidence:
      - quote: "Microsoft has observed DeadLock ransomware being deployed by multiple groups including an affiliate of the Lynx and INC ransomware ecosystems."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware/"
      - quote: "the malware employs three complementary methods that collectively ensure every event log channel on the system is cleared of existing entries, disabled from recording future events, and has its access permissions locked down"
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware/"
      - quote: "This mechanism, worker threads already encrypting files are not interrupted, and only the dispatch of new files is gated."
        attribution: "Microsoft Threat Intelligence"
