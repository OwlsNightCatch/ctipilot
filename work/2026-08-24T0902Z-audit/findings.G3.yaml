  - title: "ClickFix-to-Deno: 500+ compromised WordPress sites stage an infostealer through winget-installed Deno runtime instead of a traditional loader"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/clickfix-campaign-abuses-deno-runtime-for-infostealer-delivery", publisher: "Sophos X-Ops / Secureworks CTU", date: "2026-08-11", role: primary }
    discovery_trace: "first seen at: sophos-xops (source-id), URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (RSS listing sweep) → primary: Sophos, URL https://www.sophos.com/en-us/blog/clickfix-campaign-abuses-deno-runtime-for-infostealer-delivery"
    summary: |
      Sophos Counter Threat Unit (published 2026-08-11) documents a ClickFix campaign injecting malicious
      JavaScript into more than 500 compromised WordPress sites (identified via two attacker domains,
      columbnezhjdq[.]com and webstizkgao[.]com — the latter registered five days before the former, both
      registered June 2026). The injected script performs browser-environment checks before presenting a
      fake-verification ClickFix lure that instructs the victim to run a PowerShell command via Windows
      Terminal. That command triggers an MSI-based staging chain writing two scripts to the user's AppData
      directory; those scripts use the native Windows package manager (winget.exe) to install the Deno
      JavaScript/TypeScript runtime, then invoke the legitimate deno.exe to fetch and execute a remote
      JavaScript payload from attacker infrastructure — avoiding a traditional malware loader entirely. Deno
      then orchestrates further PowerShell execution, system reconnaissance, and persistence via a registry Run
      key that invokes JavaScript through a headless conhost.exe process. The JavaScript chain delivers a
      Python-based payload (install.pyc, run via pythonw.exe) that Sophos confirmed is an infostealer collecting
      system information, browser and extension data, cryptocurrency wallet information and keystrokes, with
      additional anti-analysis/system-profiling behavior observed in telemetry.
