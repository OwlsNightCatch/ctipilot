  - title: "Nozomi's water-utility PLC-lockout hardening guidance: run/program-mode discipline, key-switch disable, and Modbus/DNP3/EtherNet/IP baselining"
    sources:
      - { url: "https://www.nozominetworks.com/blog/what-the-fbi-epa-plc-warning-means-for-water-utilities", publisher: "Nozomi Networks Labs", date: "2026-08-12", role: primary }
    discovery_trace: "first seen at: nozomi-networks (source-id), URL https://www.nozominetworks.com/blog (listing sweep, alphabetical/undated) → primary: Nozomi, URL https://www.nozominetworks.com/blog/what-the-fbi-epa-plc-warning-means-for-water-utilities (JSON-LD datePublished 'Aug 12, 2026' confirmed)"
    summary: |
      Nozomi Networks Labs (published 2026-08-12) responds to the FBI/EPA joint PSA on the ongoing water-utility
      PLC-lockout campaign already tracked by this pipeline (twelve-plus US states, internet-exposed PLCs, IP
      address and password changes locking operators out) with concrete hardening guidance beyond what prior
      entries captured. Recommendations: disconnect any PLC that does not need a permanent internet connection
      and suspend remote-support connectivity while the campaign is active; disable the physical or software key
      switch that enables remote programming, so a remote session cannot push new logic even with valid stolen
      credentials; audit every internet-facing PLC for default/reused credentials; treat program/remote mode as
      a deliberate, logged, temporary state used only for validated updates rather than a standing mode (a mode
      switch locks in whatever project file is currently loaded); apply deny-by-default IT/OT firewall policy
      plus unique per-site credentials and access paths, since the FBI noted shared integrator-provided network
      architectures may be letting one technique succeed repeatedly across victims; and baseline normal
      Modbus/DNP3/EtherNet/IP traffic (what a SCADA master normally polls, which function codes are normal) to
      catch reconnaissance/access-stage intrusion before it escalates to ladder-logic tampering. Nozomi also
      states that the FBI PSA identifies rapid reversion to manual control as the single most effective
      mitigation once a PLC is compromised — contingent on operators having tested that procedure recently.
    region_nexus: "US-specific campaign detail, but the hardening guidance (protocol-baseline detection, key-switch discipline, deny-by-default IT/OT segmentation) is directly transferable to European water-utility OT estates"
    primary_sector_nexus: "indirect"
    sector: "water"
