  - title: "Crypting-as-a-service market mapped: Insikt Group profiles 24 providers, VIP Crypt's Delphi in-memory loader, and the AV/EDR-evasion feature set buyers shop for"
    sources:
      - { url: "https://www.recordedfuture.com/research/malware-crypting-services-threat-actors", publisher: "Recorded Future Insikt Group", date: "2026-08-13", role: primary }
    discovery_trace: "first seen at: recordedfuture-insikt (source-id), URL https://www.recordedfuture.com/feed (recipe recovery attempt this run) → primary: Recorded Future, URL https://www.recordedfuture.com/research/malware-crypting-services-threat-actors"
    summary: |
      Recorded Future's Insikt Group (published 2026-08-13) analyzed 24 threat actors advertising crypting
      services/products over the past year, mapping a competitive, reputation-driven, Windows-payload-focused
      criminal market. Mature providers bundle payload wrapping, in-memory execution, anti-analysis checks,
      process injection, persistence options, delivery packaging and post-detection re-crypting ("cleaning")
      into tiered subscriptions priced on file volume/type and duration. Advertised capabilities include AES-256
      payload encryption, runtime in-memory decryption, junk-code injection, per-build polymorphism, execution
      guardrails against VM/sandbox/debugger environments, Sleep-API-based execution delay, Windows Defender and
      SmartScreen bypasses, AV-kill functionality, protected registry keys, AMSI bypass, ETW patching, syscall
      unhooking/direct syscalls, and process-injection methods spanning DLL injection, process hollowing, APC
      injection, CLR injection, reflective .NET assembly loading and .NET Profiling API abuse. Persistence
      options advertised include DLL and COM hijacking. As a case study, Insikt Group details "mrlapis" (active
      since ~2011), whose VIP Crypt 3.0 service (announced June 2023 on the Exploit forum) is sold via a
      subscription model with FTPS-based sample delivery, automatic re-crypting every ten minutes, and claimed
      full-undetectable (FUD) status against multiple AV engines; a recent VIP Crypt sample analyzed by Insikt
      is a multi-stage Delphi-based loader using resource-based payload storage, segmented data with
      non-functional padding, staged decoding, in-memory execution and manual PE mapping to conceal and load the
      final payload. Named evasion targets across the surveyed market include Windows Defender, SmartScreen,
      Kaspersky, ESET, Bitdefender, Norton, Avast, AVG, Malwarebytes, Trend Micro, CrowdStrike, SentinelOne and
      Carbon Black — flagged by Insikt as provider-advertised claims requiring corroboration via sample analysis
      or telemetry.
    region_nexus: "global — crime-as-a-service market underpinning malware delivered against any region, including Europe"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance"
    cves: []
    techniques: [T1027, T1027.002, T1055, T1055.012, T1055.001, T1574.001, T1574.002, T1620, T1562.001, T1497.001, T1027.011]
