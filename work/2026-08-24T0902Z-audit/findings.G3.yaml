  - title: "Dragos Q2 2026 Industrial Ransomware Analysis: 1,140 incidents, no ICS Kill-Chain Stage 2, and a Teams-TURN-relay C2 first"
    sources:
      - { url: "https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026", publisher: "Dragos", date: "2026-08-10", role: primary }
    discovery_trace: "first seen at: dragos (source-id), URL https://www.dragos.com/blog/ (listing sweep, no per-card dates) → primary: Dragos, URL https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026 (per-post JSON-LD datePublished confirms 2026-08-10)"
    summary: |
      Dragos's Q2 2026 quarterly industrial ransomware report (published 2026-08-10, in-window) records 1,140
      ransomware incidents against industrial organizations worldwide, up 12% from Q1's 1,020, with NO case
      reaching Stage 2 of the ICS Cyber Kill Chain or direct control-system manipulation — impact is via
      enterprise IT/ERP/virtualization loss cascading into OT. Qilin remains most active (Palo Alto appliances,
      a Check Point Remote Access VPN auth-bypass, browser-stored credential harvesting); Akira ranks second
      (compromised VPN devices, and in one case abused hypervisor access to spin up a new VM to stage/launch
      the encryptor). The Gentlemen's leaked "Rocket" database (analyzed by Check Point) named an operator
      "zeta88" and exposed a revenue-sharing/victim-intelligence-reuse model; initial access via Fortinet
      FortiGate and Cisco edge devices, AD recon, certificate abuse, EDR evasion; ransomware supports
      Windows/Linux/NAS/BSD/ESXi. DragonForce fielded Backdoor.Turn, described as the first malware to abuse
      Microsoft Teams' TURN relay infrastructure for C2, alongside a Huawei driver zero-day and continued
      SimpleHelp exploitation against MSPs. Chaos ransomware bifurcated: a financially-motivated RaaS branch,
      and a MuddyWater (Iran MOIS) espionage branch using the Chaos brand as cover, harvesting credentials via
      Microsoft Teams social engineering with no encryption deployed. Silent Ransom Group (Luna Moth/UNC3753)
      escalated to in-person office visits (FBI FLASH, late May) with USB-based access; Mandiant documented full
      access-to-theft within a single business day. Law enforcement highlights: a First VPN takedown (33
      servers/27 countries), an Operation Endgame phase disrupting SocGholish/Amadey/StealC (15-24 June), and US
      Treasury sanctions on Nobitex and three other Iranian crypto platforms tied to IRGC-affiliated ransomware
      payment processing.
