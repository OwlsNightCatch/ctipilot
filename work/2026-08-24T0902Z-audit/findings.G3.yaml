  - title: "Kimwolf v7: Android/IoT DDoS botnet moves C2 resolution onto Ethereum Name Service and mimics Chrome's HTTP/2 fingerprint to beat DDoS mitigation"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/kimwolf-v7-botnet-malware/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-11", role: primary }
      - { url: "https://securityaffairs.com/197070/malware/kimwolf-v7-hides-ddos-traffic-behind-chrome-fingerprints-and-ethereum.html", publisher: "Security Affairs", date: "2026-08-14", role: corroborating }
    discovery_trace: "first seen at: unit42 (source-id), URL https://unit42.paloaltonetworks.com/ (listing sweep) → WebSearch (\"unit42 Kimwolf v7 botnet paloaltonetworks\") to confirm the exact slug → primary: Unit 42, URL https://unit42.paloaltonetworks.com/kimwolf-v7-botnet-malware/"
    summary: |
      Unit 42 documents Kimwolf v7, a new version of an Android/IoT DDoS botnet (companion codebase to the
      Linux-targeting AISURU family, same operators) discovered 2026-02-03 via threat hunting following public
      disclosures by XLab, Synthient, Infoblox and Cloudflare, and published 2026-08-11. The botnet propagates
      by abusing residential-proxy services to reach unauthenticated Android Debug Bridge (ADB) instances
      exposed on port 5555 on Android TV boxes/set-top boxes — no credential or exploit needed once the proxy
      tunnels into the local network. Kimwolf v7 shifts C2 resolution onto the blockchain: the statically-linked
      ARM ELF binary (Android NDK/Clang/Bionic libc, BoringSSL, nghttp2) hard-codes five public Ethereum RPC
      endpoints, queried in PRNG-shuffled order to resolve Ethereum Name Service (ENS) domain records that yield
      the C2 address — five-way redundancy that complicates blocking. The new DDoS payload is an HTTP/2 flood
      that constructs complete Chrome browser fingerprints, making the traffic difficult to distinguish from
      legitimate browsing at the protocol/header level. v7 also strips all scanning, exploitation and
      brute-force code from the binary (now externalized to separate loaders), leaving 15 numbered DDoS methods
      across OSI layers 3-7. Infrastructure pivoting on a shared SSH host key found 22 IPs presenting the
      identical key between 2025-12-18 and 2026-02-03.
    region_nexus: "global — any network with internet-reachable Android TV/set-top boxes or exposed ADB is a recruitment target; DDoS capacity is a shared availability risk for European critical-infrastructure/telco defenders"
    primary_sector_nexus: "indirect"
    sector: "telco"
    cves: []
    techniques: [T1499, T1071.001, T1584.005, T1027.002]
    affected_products: ["Android TV boxes / set-top boxes (unauthenticated ADB on port 5555)"]
    entity_keys: []
    new_entities:
      - { key: "malware:kimwolf", type: malware, name: "Kimwolf", aliases: [], summary: "Android/IoT DDoS botnet targeting Android TV boxes/set-top boxes via unauthenticated ADB; v7 (Unit 42, 2026-08-11) resolves C2 via Ethereum Name Service queries against public Ethereum RPC endpoints and floods HTTP/2 with full Chrome browser fingerprints. Companion codebase to the AISURU Linux-IoT botnet under the same operators." }
