      activity tracked since late July 2026, anchored by Taiwan's Ministry of Digital Affairs confirming a
      near-autonomous AI cyberattack in July 2026 in which autonomous agents mapped 21 connected government
      systems, compromised 85 accounts, and exfiltrated more than 2,564 personnel records over roughly four
      days. The cluster also folds in JADEPUFFER (already-registered entity: Sysdig's LLM-driven ransomware
      operator that entered via Langflow CVE-2025-3248 for automated database extortion) and a new
      Chinese-speaking operator Tenable calls knaithe/KnYuan, which Unit 42 assesses with moderate confidence
      uses the same AI-agent framework for autonomous vulnerability scanning. Tenable's stated common thread
      across every incident in the cluster is identity and authentication exposure — discoverable federation
      endpoints, weak credentials, and misconfigured SSO — as the condition autonomous agents exploit at
      machine speed, positioning Tenable One / exposure management as the mitigating control.
