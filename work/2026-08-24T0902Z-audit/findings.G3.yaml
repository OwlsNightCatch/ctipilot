  - title: "Aeternum: a botnet loader moves C2 entirely onto Polygon blockchain smart contracts, no domains or servers to take down"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/aeternum-blockchain-c2-analysis/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-10", role: primary }
    discovery_trace: "first seen at: unit42 (source-id), URL https://unit42.paloaltonetworks.com/ (listing sweep) → WebSearch (\"unit42 Aeternum blockchain C2 paloaltonetworks Permanent Threat\") to confirm the exact slug → primary: Unit 42, URL https://unit42.paloaltonetworks.com/aeternum-blockchain-c2-analysis/"
    summary: |
      Unit 42 analyzes Aeternum, a C++ botnet loader (published 2026-08-10) that replaces centralized C2
      infrastructure entirely with Polygon blockchain smart contracts: infected devices continuously poll public
      Ethereum-compatible RPC endpoints to read encrypted and plain-text operator instructions written directly
      into on-chain smart-contract state, rather than resolving a domain or contacting a server. One analyzed
      sample used 22 distinct smart-contract addresses during C2 communications and could not be traced back to
      deobfuscated hard-coded addresses, implying dynamic address rotation. The loader uses a substandard
      self-salting-password encryption scheme (already partially broken by prior research the post builds on),
      and some samples run plain-text C2 commands. Downloader activity also pulled staged artefacts from GitHub
      repositories — including a legitimate PuTTY binary alongside a malicious DLL from an October 2025 commit —
      creating a supply-chain risk where attackers could swap the referenced filenames for malware at any time.
      Investigated payloads link Aeternum to a Telegram-distributed Python malware family and a blended
      XWorm RAT / XMRig cryptominer payload set; the loader includes VM-detection and AV-scanning evasion.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "telco, finance"
    cves: []
    techniques: [T1071.001, T1027, T1497.001, T1027.002]
