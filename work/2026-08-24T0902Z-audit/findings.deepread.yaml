  # 3. GeoServer jsonArrayContains — correction entry, patch timeline
  # =========================================================================
  - title: "CORRECTION: GeoServer jsonArrayContains SQL injection (GHSA-mqjf-5f49-2fjh / CVE-2026-76904) — fixed versions were live from 2026-08-14, not 'unpatched'; GHSA's own prose 'Patches' list is wrong for two of three branches"
    sources:
      - { url: "https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html", publisher: "GeoServer project (vendor)", date: "2026-08-14", role: "primary" }
      - { url: "https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-2-28-5-released.html", publisher: "GeoServer project (vendor)", date: "2026-08-14", role: "primary" }
      - { url: "https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-2-27-6-released.html", publisher: "GeoServer project (vendor)", date: "2026-08-14", role: "primary" }
      - { url: "https://api.osv.dev/v1/vulns/GHSA-mqjf-5f49-2fjh", publisher: "GitHub Security Advisory GHSA-mqjf-5f49-2fjh, mirrored via OSV.dev (github.com itself egress-blocked in this environment)", date: "2026-08-21", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12844", publisher: "NCSC-CH (security-hub)", date: "2026-08-14 (created) / 2026-08-17 (edited)", role: "corroborating" }
    discovery_trace: "first seen at: assigned reading list, URL https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html (no pivot needed — vendor primary) → cross-check: sibling vendor posts for the 2.x branches, URL https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-2-28-5-released.html and URL https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-2-27-6-released.html → primary: GHSA structured record via OSV mirror, URL https://api.osv.dev/v1/vulns/GHSA-mqjf-5f49-2fjh (github.com direct fetch blocked in this environment, per task instruction) → corroboration/timeline: NCSC-CH post, URL https://security-hub.ncsc.admin.ch/#/posts/12844"
    summary: |
      Exact, dated patch timeline (all three GeoServer releases carry the SAME post-meta date on their own
      pages: "Aug 14, 2026 • Jody Garnett"):

        - GeoServer 3.0.1 — published 2026-08-14 — "made in conjunction with GeoTools 35.1"
        - GeoServer 2.28.5 — published 2026-08-14 — "made in conjunction with GeoTools 34.5"
        - GeoServer 2.27.6 — published 2026-08-14 — "made in conjunction with GeoTools 33.6"

      GHSA-mqjf-5f49-2fjh's own OSV-normalized "affected" ranges (the authoritative structured field, not
      its prose) agree with GeoServer's own dates: fixed in GeoTools 35.1, 34.5, and 33.6 respectively — and
      the GHSA's own References section links to the GitHub release tags 33.6, 34.5, and 35.1 (not 33.5/34.4).

      DISCREPANCY TO CORRECT: the GHSA's own prose "Patches" section reads verbatim: "Patches — GeoTools
      35.1, GeoTools 33.5, GeoTools 34.4" — this is WRONG for two of the three branches (should read 33.6
      and 34.5, not 33.5 and 34.4), contradicted by the GHSA's own structured affected/fixed-version data,
      its own linked GitHub release tags, AND GeoServer's own vendor release posts. If a prior pass or entry
      cited "33.5"/"34.4" as the fixed GeoTools versions, that is the error to correct — the true fixed
      versions are 33.6, 34.5, 35.1.

      GHSA's Mitigation section, quoted VERBATIM IN FULL (note the section's own internal contradiction —
      it says "No mitigation is available" and then immediately lists one): "### Mitigation\n\nNo mitigation
      is available:\n\n* To limit scope of SQL Injection the PostGIS connection pool should be configured
      with limited rights."

      CVE status: CVE-2026-76904 IS now assigned (confirmed via the GHSA's own `aliases` field on OSV,
      `"aliases": ["CVE-2026-76904"]`). GHSA-mqjf-5f49-2fjh itself was published/github_reviewed at
      2026-08-21T20:25:41Z — SEVEN DAYS after the fixed versions actually shipped (2026-08-14). CWE-89 (SQL
      Injection), severity CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (no numeric base score
      field returned by OSV, only the vector string).

      Mechanism per the GHSA's own Summary: "An SQL Injection Vulnerability has been found when executing
      OGC Filters with PostGIS DataStore implementation: jsonArrayContains function. Requires PostGIS 12 or
      greater with a String or JSON field. For PostGIS 12 and greater jsonArrayContains(<column>, <pointer>,
      <value>) function writes <value> into generated SQL without escaping." Affected package:
      org.geotools.jdbc:gt-jdbc-postgis.

      NCSC-CH's own timeline (its post history log, verbatim from the post's own metadata) shows a THREE-DAY
      lag between GeoServer's actual fix (2026-08-14) and NCSC-CH catching up: the post was created
      2026-08-14T08:17:21Z under the title "GeoServer: Potential Zero-Day SQL Injection" citing a
      SecurityWeek report of ACTIVE EXPLOITATION OF AN UNPATCHED FLAW and stating "No patch is currently
      available; organizations should monitor for a vendor fix" — even though GeoServer's own fixed releases
      carry that SAME calendar date. NCSC-CH's post was then edited 2026-08-17T12:35:20Z ("Updated with
      fixed versions") to append links to the three GeoServer releases and note the GHSA identifier. GeoServer's
      own post explains the compressed timeline: "unfortunately the issue was subject to public disclosure
      prior to our intended release schedule" — implying the emergency release on 2026-08-14 was itself a
      forced-early response to the same public disclosure/exploitation wave NCSC-CH was reporting that day,
      and GeoServer's own coordinated-disclosure plan did not survive contact with the leak.
