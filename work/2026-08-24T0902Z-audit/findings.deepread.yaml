  # 1. SPIP CVE-2026-77647 — universal pre-auth RCE
  # =========================================================================
  - title: "SPIP CVE-2026-77647 — pre-auth RCE via var_export()/<?php-tag mis-detection, fixed in 4.4.20 then a second occurrence of the same bug class fixed three days later in 4.4.21 (no CVE yet for the second flaw)"
    sources:
