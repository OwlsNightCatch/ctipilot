  # =========================================================================
  # 4. GitLab CVE-2026-19478 — exploitation delta
  # =========================================================================
  - title: "GitLab CVE-2026-19478 (CVSS 9.4) — unauthenticated GraphQL directive code injection; watchTowr's honeypots caught first exploitation attempts two days after the emergency patch, no confirmed successful compromise reported"
    sources:
      - { url: "https://www.securityweek.com/critical-gitlab-flaw-exploited-shortly-after-disclosure/", publisher: "SecurityWeek", date: "2026-08-20", role: "primary" }
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-4-released/", publisher: "GitLab (vendor patch-release notes)", date: "2026-08-17", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/gitlab-cve-2026-19478-comes-under.html", publisher: "The Hacker News", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: assigned reading list, URL https://www.securityweek.com/critical-gitlab-flaw-exploited-shortly-after-disclosure/ (no pivot needed for the exploitation-observation claim) → pivot: GitLab's own patch-release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-4-released/ (found via GitLab's docs site, not linked directly from the SecurityWeek article) → corroboration: The Hacker News, URL https://thehackernews.com/2026/08/gitlab-cve-2026-19478-comes-under.html"
    summary: |
      GitLab's own patch-release page (docs.gitlab.com, dated 2026-08-17) states this was an ad-hoc critical
      patch (outside the normal twice-monthly Wednesday cadence) shipping versions 19.2.4, 19.1.6, 19.0.8,
      18.11.11 for CE/EE. Two CVEs were fixed together:

        - CVE-2026-19478 — "Code Injection issue via GraphQL directive impacts GitLab CE/EE" — GitLab's own
          text: "GitLab has remediated an issue that under certain conditions could allow an unauthenticated
          user to remotely modify or delete public projects and user data via a GraphQL directive." Impacted
          versions (GitLab's own precise range): "all versions from 18.2 before 18.11.11, 19.0 before
          19.0.8, 19.1 before 19.1.6, and 19.2 before 19.2.4." CVSS 9.4, vector
          CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H (GitLab's own scoring, linked to GitLab's own CVSS
          calculator explainer). Reported via HackerOne by researcher "hiimguardian."
        - CVE-2026-19650 — CSRF in the GraphQL multiplex query handler, same affected-version range, CVSS
          7.1 (AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:L), reported by "kreep" via HackerOne. (Companion fix in the
          same release; not the flaw under active exploitation per the sources below.)

      Exploitation observation: watchTowr (attack-surface-management/offensive-research firm), per
      SecurityWeek and The Hacker News (principal researcher Jake Knott quoted in both), reproduced the
      vulnerability "within minutes of its disclosure" using only GitLab's own advisory text and the code
      diff in the fix — no public PoC was available. WatchTowr's OWN HONEYPOT NETWORK then caught the FIRST
      in-the-wild exploitation attempts on Wednesday 2026-08-19 — two calendar days after the 2026-08-17
      patch. No watchTowr-authored blog post for this specific CVE was locatable (searched; only press
      quotes found) — treat watchTowr's findings here as press-relayed rather than a fetched primary
      write-up; SecurityWeek/THN quote the researcher directly and by name, which is the strongest available
      substitute.

      Distinguishing attempts from successful compromise: NEITHER source reports a confirmed successful
      compromise distinct from probing — both frame the finding strictly as "in-the-wild exploitation
      attempts against watchTowr's honeypots" / "probes," with the detection guidance itself confirming this
      framing: "Organizations that haven't patched yet should hunt through web logs for requests containing
      '@gl_introduced,' and look for signs of probes or attempted exploitation." No named victim organization
      or confirmed data-loss incident is cited in either source.

      Vulnerable surface: unauthenticated access to the `/api/graphql` endpoint on self-managed instances
      with public repositories, via the `@gl_introduced` GraphQL directive. Impact per SecurityWeek/THN:
      attacker can forge merge records (make an unreviewed change appear reviewed/signed-off), delete
      repositories, rewrite project state, manipulate audit logs, and ban project maintainers — all via a
      single unauthenticated HTTP request. No named threat-actor cluster; SecurityWeek attributes the
      compressed disclosure-to-exploitation window generically to "AI-enabled attackers" as a trend
      commentary, not a specific cluster.
    region_nexus: "global (GitLab self-managed instances); relevant to any self-managed GitLab CE/EE with public repositories, including public-sector code-hosting"
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco"
    cves: ["CVE-2026-19478", "CVE-2026-19650"]
    techniques: ["T1190"]
    affected_products: ["GitLab Community Edition (CE)", "GitLab Enterprise Edition (EE)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:<prior GitLab CVE-2026-19478 disclosure entry, if one exists — main agent to match>"
    evidence:
      - quote: "GitLab has remediated an issue that under certain conditions could allow an unauthenticated user to remotely modify or delete public projects and user data via a GraphQL directive."
        attribution: "GitLab (vendor patch-release notes)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-4-released/"
      - quote: "Impacted Versions: GitLab CE/EE: all versions from 18.2 before 18.11.11, 19.0 before 19.0.8, 19.1 before 19.1.6, and 19.2 before 19.2.4"
        attribution: "GitLab (vendor patch-release notes)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-2-4-released/"
      - quote: "Whilst no public exploit code is available, WatchTowr was able to reproduce the vulnerability within minutes of its disclosure."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/critical-gitlab-flaw-exploited-shortly-after-disclosure/"
      - quote: "On Wednesday, WatchTowr warned that its honeypot network has already caught the first in-the-wild exploitation attempts."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/critical-gitlab-flaw-exploited-shortly-after-disclosure/"
      - quote: "Organizations that haven't patched yet should hunt through web logs for requests containing '@gl_introduced,' and look for signs of probes or attempted exploitation."
        attribution: "watchTowr, via The Hacker News"
        source_url: "https://thehackernews.com/2026/08/gitlab-cve-2026-19478-comes-under.html"
    extended_notes: |
      Detection concept for defenders: telemetry class = web/application access logs on the GraphQL
      endpoint; concrete anchor = search access/app logs for POST requests to /api/graphql whose body
      contains the literal string "@gl_introduced" from unauthenticated/unexpected source IPs, especially
      against projects with public visibility. Hardening lever: restrict unauthenticated access to
      /api/graphql or remove public-repository visibility on self-managed instances that cannot patch
      immediately; GitLab.com/GitLab Dedicated were already patched and required no customer action per
      GitLab's own notes.
    borderline: false

  # =========================================================================
  # 5. VMware vCenter CVE-2026-59310 — KEV addition + attribution delta
  # =========================================================================
  - title: "VMware vCenter CVE-2026-59310 (path traversal, CVSS 9.8) added to CISA KEV — QUIRSO assesses with MODERATE CONFIDENCE a suspected China-nexus actor, same report also ties the campaign to a Babuk-derived ransomware payload"
    sources:
      - { url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", publisher: "CISA KEV catalog (fetched via structured API)", date: "2026-08-18", role: "primary" }
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017", publisher: "Broadcom/VMware PSIRT (VMSA-2026-0006 / VMSA-2026-0006.1)", date: "2026-07-29 (initial) / 2026-08-03 (revision .1)", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html", publisher: "The Hacker News, extensively quoting named QUIRSO researchers", date: "2026-08-24", role: "primary-by-quotation" }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-59310", publisher: "NVD", date: "2026-08-19", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/critical-vmware-vcenter-rce-flaw-exploited-for-reverse-ssh-access/", publisher: "BleepingComputer", date: "2026-08-13", role: "corroborating (earlier reverse_ssh wave, pre-attribution)" }
    discovery_trace: "first seen at: assigned reading list, structured fetch via `python3 tools/fetch_source.py cisa-kev`, citation URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → pivot: Broadcom advisory named in the KEV record's own notes field, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017 → pivot: The Hacker News roundup, URL https://thehackernews.com/2026/08/critical-macos-sharepoint-vcenter-and.html → primary: the roundup's own linked deep-dive article on this specific attribution, URL https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html → attempted further pivot to QUIRSO's own Medium primary (linked from that THN article) FAILED — see coverage_gaps."
    summary: |
      CISA KEV record (fetched fresh from the structured catalog): cveID CVE-2026-59310, vendorProject
      Broadcom, product VMware vCenter, vulnerabilityName "Broadcom VMware vCenter Path Traversal
      Vulnerability," dateAdded 2026-08-18, dueDate 2026-08-21 (an unusually short 3-day remediation window),
      knownRansomwareCampaignUse "Unknown" (CISA's own KEV field — note this is CISA's formal designation,
      distinct from the Babuk-derived-ransomware finding below which comes from a different party and had
      not been folded into CISA's KEV field as of the dateAdded/fetch time), CWE-22 (Path Traversal).

      Broadcom's own advisory (VMSA-2026-0006, initial publication 2026-07-29, revised to .1 on 2026-08-03
      to add 8.0 U2f express patches) states, verbatim: "VMware vCenter contains a directory traversal
      vulnerability in the Syslog server. Broadcom has evaluated the severity of this issue to be in the
      Critical severity range with a maximum CVSSv3 base score of 9.8" (vector
      CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). "Known Attack Vectors: A malicious actor with network
      access to vCenter may exploit this issue to execute arbitrary code." No workaround exists ("Workarounds:
      None"). Fixed-version response matrix (Broadcom's own table, applies to BOTH CVE-2026-59309 [a
      companion vCenter auth-bypass fixed in the same advisory] and CVE-2026-59310 together):
        - vCenter 9.1.x.x → fixed in 9.1.0.0300 (cumulative; 9.1.0.0200 first addressed the companion
          CVE-2026-59309, but 9.1.0.0300 is the current recommended build)
        - vCenter 9.0.x.x → fixed in 9.0.2.0100
        - vCenter 8.0 (U3 branch) → fixed in 8.0 U3k
        - vCenter 8.0 (U2 branch) → fixed in 8.0 U2f (this express patch only became available 2026-08-03,
          5 days after the initial 2026-07-29 advisory)
      NVD's record confirms the same CVSS score/vector sourced verbatim from security@vmware.com (no
      divergence) and additionally lists VMware Cloud Foundation (9.1.x.x/9.0.x.x/5.x), vSphere Foundation
      (9.1.x.x/9.0.x.x), Telco Cloud Infrastructure (3.0), and Telco Cloud Platform (5.1.x/5.0.x/4.x/3.0) as
      affected products beyond standalone vCenter — broadening the footprint for any org running VCF/vSphere
      Foundation bundles rather than standalone vCenter.

      Attribution delta: German incident-response company QUIRSO (researchers Maike Orlikowski, Çağatay
      Yürekli, and Denis Szadkowski) is the SOLE source for both the China-nexus attribution and the Babuk
      ransomware finding — they are the SAME PARTY's assessment, from the same investigation, published on
      QUIRSO's own Medium blog (which I could not fetch directly — see coverage_gaps — but which is quoted
      extensively and verbatim, with named individual researchers, by The Hacker News). QUIRSO's own stated
      confidence language: "assessed with moderate confidence that the exploitation campaign aimed at
      CVE-2026-59310 is operated by a Chinese-speaking threat actor, likely working in the UTC+08:00 time
      zone." Their stated evidence basis (direct quote): "the convergence of Chinese-language artifacts in
      attacker-created scripts, apparent reuse of research from a Chinese security publication, repeated
      operational use of Chinese-language tools and management software, victimology excluding mainland
      China, and activity patterns compatible with UTC+08:00 working hours." No actor codename assigned by
      QUIRSO — treat as an unnamed, moderate-confidence attribution, single-source (no second research firm
      corroborates the China-nexus claim in the sources I could reach).

      Scale/timeline: activity began 5 calendar days after the 2026-07-29 disclosure; QUIRSO's team first
      observed compromised systems contacting attacker infrastructure on 2026-08-03; 361 unique victim IPs
      across 47 countries identified (Germany 55, US 41, Turkey 38, Iran 26, France 25 — the highest
      counts). Mechanism chain per QUIRSO (via THN): the cron daemon (crond) logged a malformed cron file
      named to mirror the CVE id and the vCSA syslog naming convention, placed under /etc/cron.d (a
      privileged execution location) via abuse of the vCSA syslog server itself; at least one such file
      executed and dropped a backdoor ("linuxFile," alias systemlog/linux_x86) that communicates over an
      unencrypted WebSocket transport with its own application-layer crypto and XOR-obfuscated C2 address,
      and persists via systemd + cron. The actor additionally: set cron jobs impersonating legitimate VMware
      service names (vmware-vpxd-stats-*, vmware-perf-collect-*, vmware-perf-sync-*) to add SSH keys, drop a
      JSP web shell ("vmware-perf-update.jsp"), and create new privileged accounts (including one added to
      the vSphere SSO Administrators group); created a sudoers.d entry granting the "perfcharts" service
      account unrestricted passwordless root sudo; harvested vmdir credentials via the registry or VMware's
      own vmafd Python module (GetMachineName/GetMachinePassword/GetDomainName) to perform privileged
      directory modifications; and used the vSphere API for discovery before deploying an architecture-
      specific reverse_ssh binary via a shell-script downloader. On at least one analyzed system, the attack
      culminated in ransomware on ESXi hosts encrypting files with the ".babyk" extension — "typically
      associated with Babuk-derived ransomware" — which QUIRSO explicitly says may have been "selected
      opportunistically or even intentionally to confuse attribution efforts," and which QUIRSO's own
      researcher (Szadkowski) characterizes as more likely a smokescreen to destroy ESXi log telemetry than
      the campaign's primary objective; QUIRSO states it "cannot assess at this stage if the ransomware
      strain was deployed across other compromised systems" (single-system analysis).

      Direct quote on root-cause severity: "Exploitation of CVE-2026-59310 provided the actor with
      immediate, non-interactive code execution in a root context on the vCenter Server appliance ...
      giving the actor unrestricted access to the underlying VCSA without first having to compromise an
      unprivileged local account and escalate from it" — i.e. no privilege-escalation step was needed; the
      path-traversal RCE itself lands as root.
