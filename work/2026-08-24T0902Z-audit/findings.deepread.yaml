      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/", publisher: "CERT-FR / ANSSI", date: "2026-08-21", role: "primary" }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-77647", publisher: "NVD (mirroring MITRE CNA record)", date: "2026-08-21", role: "primary" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-77647", publisher: "MITRE CVE Program (CNA record)", date: "2026-08-20", role: "primary" }
      - { url: "https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/", publisher: "TheHackerWire (AI-generated CVE-tracker aggregator — see note)", date: "2026-08-20", role: "corroborating-low-value" }
    discovery_trace: "first seen at: assigned reading list, URL https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr → pivot: CERT-FR advisory, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/ → primary: MITRE CVE record, URL https://cveawg.mitre.org/api/cve/CVE-2026-77647 and NVD mirror, URL https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-77647 → pivot: SPIP's own follow-up bulletin, URL https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html?lang=fr (found by following the CERT-FR advisory's own Documentation link) → corroboration attempt: TheHackerWire, URL https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/ (AI-generated re-summary of the same NVD record, no independent value)."
    summary: |
      IMPORTANT CORRECTION TO THE TASK'S FRAMING: CVE-2026-77647 and CERT-FR advisory CERTFR-2026-AVI-1063
      do NOT describe the same fix. There were two distinct pre-auth RCE flaws in the same SPIP subsystem,
      patched three days apart:

      Flaw #1 — fixed in SPIP 4.4.20 (released 2026-08-17). This is the flaw CVE-2026-77647 covers. MITRE's
      own CNA description: "SPIP before 4.4.20 allows unauthenticated remote attackers to execute arbitrary
      code, as exploited in the wild in August 2026. This is related to incorrect identification of <?php
      blocks, and var_export's mishandling of certain cases such as presence of a '<' character." CWE-94
      (Code Injection). CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), scored by the CNA (cve@mitre.org)
      — NVD mirrors this score verbatim (vulnStatus "Received", i.e. NVD has not independently re-analyzed
      it). CISA's SSVC ADP layer records "exploitation: none" as of 2026-08-21, which is at odds with the
      vendor's own "exploitation attempts already observed in the wild" language — flag this exploitation-
      status divergence for the reader (CISA's automated triage vs. the vendor's direct statement).
      Mechanism per SPIP's own blog: attacker-controlled input containing a malformed <?php tag or a literal
      '<' character can escape its intended data context inside var_export()-generated output and be
      interpreted as executable PHP by the server — the exact injection endpoint/parameter is not named in
      either the vendor bulletin or the CVE record. No public PoC found. Debian filed a security-announce
      entry (linked from the CVE record but the page itself sits behind a proof-of-work anti-bot challenge
      we could not solve — see coverage_gaps) presumably prompting the CVE assignment three days after the
      silent 4.4.20 fix.

      Flaw #2 — fixed in SPIP 4.4.21 (released 2026-08-20), covered by CERT-FR's CERTFR-2026-AVI-1063
      (published 2026-08-21, sourced from "Bulletin de sécurité SPIP du 20 août 2026" i.e. the 4.4.21 post).
      SPIP's own 4.4.21 announcement states verbatim: "Cette version corrige une vulnérabilité universelle
      (sans conditions) pré-authentification RCE qui touche la version 4.4.20 de SPIP" — i.e. this second,
      same-class pre-auth RCE specifically affects SPIP 4.4.20 (the version that was supposed to be the fix
      for flaw #1). This reads as either an incomplete fix in 4.4.20 or a second occurrence of the identical
      bug class (mis-detection of <?php blocks / var_export mishandling of '<') that 4.4.20 did not close.
      CERT-FR's advisory lists NO CVE identifier for this second flaw as of 2026-08-21 (checked the advisory's
      structured fields directly — "Systèmes affectés: SPIP versions antérieures à 4.4.21", no CVE field
      present). As of this research pass (2026-08-24) I found no separate CVE assigned to the 4.4.21 fix.

      Both vendor bulletins state, verbatim: "Cette faille n'est pas prise en charge par l'écran de sécurité"
      (this flaw is not covered by the [built-in input-filtering] security screen) — mechanically this means
      SPIP's centralized request-sanitization layer, which pattern-matches GET/POST parameters for known-bad
      injection sequences before requests reach application code, has no rule that catches this particular
      class of bug because the injection does not manifest as a recognizable raw pattern in the request — it
      is a serialization-time mishandling inside var_export()'s output-generation logic, which the security
      screen (a request-time filter) never inspects. That structural gap is why the same bug class resurfaced
      three days after the first "fix."

      Operational takeaway for defenders: an estate that patched only to 4.4.20 (believing CVE-2026-77647
      closed) remained exploitable via the second flaw until 4.4.21. Both vendor bulletins and CERT-FR state
      exploitation attempts were already observed in the wild before each release; SPIP is the dominant CMS
      for French-speaking public administration (tracked in this deployment's registry as
      trend:spip-2026-rce-wave — "wide EU/CH Francophone government deployment"), so the Aug 17 / Aug 20
      double-release matters directly for Suisse romande public-sector sites.
