  ground_truth: "Sophos X-Ops (19 Aug) confirms every figure exactly — 86 cases tagged, 34 confirmed on review, 4 added by analyst investigation, 38 total, 30 AI software impersonation, 26 using the Claude brand, 35 under malicious targeting of AI, review period 2 July 2025 to 29 June 2026 — plus the Beagle DLL-sideloading backdoor from a fake Claude site, the mshta-then-PowerShell chain and the AI-assistant browser extensions, and carries the quoted framing sentence verbatim. Huntress MacSync (17 Aug) confirms the sponsored-ad path to a shared conversation on the genuine claude.ai domain displayed as 'Apple Support', the curl-into-Terminal instruction, the 1,442-byte polymorphic zsh loader, six stages, the server-side AppleScript stealer behind an API-key gate, the Mach-O RAT with a LaunchAgent named after an existing updater, the separately signed screen-recording helper and three trojanised wallet apps; both Huntress quotes are verbatim, including the full 'A recovery phrase doesn't work like that; there is nothing to revoke or reset, nothing to stop the access.' Eight techniques active in v19.2; no indicators carried."
