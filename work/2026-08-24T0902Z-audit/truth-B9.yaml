- entry: entries/2026-08-23/weekly-w34-netntlmv1-now-cracks-on-a-cpu-in-twenty-minutes.md
  verdict: clean
  defect: null
  ground_truth: "Sophos X-Ops 'Hunting the Undead' (datePublished 2026-08-17, matching the citation) states the headline figure verbatim — 'The same downgrade lookup that previously occupied GPUs for up to eight hours now completes in under 20 minutes on a single server, and faster across a small cluster, without consuming a single GPU cycle.' — and the entry carries it as Sophos's own measurement rather than as an independent result. The hardware class and conditions are stated as the entry reports them: ~144 million DES/s scalar and ~2.1 billion DES/s bitsliced 'on a single 64-core EPYC' (15x), key schedule '85% of the scalar cost', precompute 45 minutes to about three, end-to-end timings measured 'on a small cluster of dual-CPU, 64-core EPYC systems' with the sorted tables on local NVMe, Mandiant's 2026 table set of 4,096 files of roughly 2 GB covering the full 2^56 keyspace (~9 TB), the released dependency-free C toolset, and the unchanged precondition — 'you need the captured v1 hash with the static challenge ... sometimes you can, and sometimes you can't', with GPUs as the fallback. Second evidence quote verbatim. Three techniques active in v19.2."
  ground_truth_url: https://www.sophos.com/en-us/blog/accelerating-netntlmv1-lookups-without-gpus
