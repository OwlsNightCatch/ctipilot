- entry: entries/2026-08-23/weekly-w34-c2-rendezvous-moved-to-services-you-cannot-block.md
  verdict: clean
  defect: null
  ground_truth: "Red Canary's August round-up (July telemetry) confirms four new entrants (GraphSpy, Phexia, CastleRAT, EtherRAT) of which three resolve via dead drop and two via public blockchain smart contracts (Phexia on Polygon RPC, EtherRAT on Ethereum RPC at a predefined contract, CastleRAT via adversary domains or a gaming-community domain), the 2023 first-reporting date and three of the top ten using the technique; the quoted sentence is a verbatim contiguous prefix of Red Canary's own sentence. Acronis (13 Aug) confirms SHEETCORD using the Google Sheets API v4 with a hardcoded GCP service account and per-victim tabs, and GitHub Gists as the second carrier. Bitdefender confirms the Google Drive command folder with in-memory plugins (DriveSilkRAT) and cookie/ETag header C2 (CookiETagRAT). Check Point (18 Aug) confirms close to 2,000 compromised WordPress domains used to spread malware, control infected machines and store stolen documents, with wp-content/mu-plugins loading on every request and not appearing in the Plugins UI. Five techniques active in v19.2."
