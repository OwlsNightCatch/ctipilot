  ground_truth: "Talos UAT-10147 (20 Aug) confirms the ~170,000-URL list split into 17 files of ~10,000, the nine-section AI-generated ViewState playbook with four companion Python scripts, the museum of patched initial-access flaws (CVE-2022-27925 Zimbra, CVE-2021-23758 AjaxPro, CVE-2021-29441/29442 Nacos, CVE-2019-18935 Telerik), the moderate-to-high-confidence emerging-class assessment, DeepAudit on the management server and PentestGPT on the C2, the redundant Add-MpPreference plus reg-add exclusion writes, and the '5xx blind spot' quote verbatim. Recorded Future confirms 1,100+ companies, 60+ applications a day, at least 22 personas, the face-swap photo service and operators repeating chatbot answers verbatim even when wrong. Bitdefender (19 Aug) carries both evidence quotes verbatim and confirms seven RAT families, medium-confidence China nexus, the Go test functions, the 0123456789abcdef key and the change_this_key field. Sophos (19 Aug) confirms the 'assistant with a human in control' finding across 38 cases. The five-agency PDF was again not text-extractable this pass, and the entry already discloses that its content is carried from BleepingComputer's reporting with inline attribution — sampled, not a finding. Five techniques active in v19.2."
