- entry: entries/2026-08-23/weekly-w34-ncsc-uk-agentic-ai-control-baseline.md
  verdict: imprecision
  defect: "The title and headline claim a first — 'the first authority-issued technical control baseline for an organisation's own agentic-AI deployments' and 'the first national-authority answer to how do we secure the agents we are deploying' — which NCSC UK does not claim and which the record contradicts: the Australian Signals Directorate's ACSC published 'Careful adoption of agentic AI services' on 1 May 2026 with sandbox-environment, agent-identity/credential, logging-and-oversight and red-teaming recommendations, and NCSC's own further-reading list links it."
  ground_truth: "NCSC UK blog of 20 August 2026 verifies every substantive claim and all four evidence quotes verbatim, including 'The NCSC has been researching and experimenting in this area for some time and is working with partners to develop formal guidance which will build upon, and ultimately supersede, this blog.', the credential-restriction sentence, 'Agentic AI activity should be treated as a form of user activity.' and 'Where possible, logs should be immutable so you can trust them during an investigation.' — plus seven considerations, the four-level network-sandbox model ending at no external access with the model hosted locally, the three human-oversight tiers, the five sandbox-boundary axes (execution, network, compute, credentials, data), named individuals or groups accountable, inclusion in 24/7 monitoring and incident response, the pull-the-plug requirement, and the ETSI EN 304 223 further-reading item. The ACSC page (first published and last updated 01 May 2026) is the earlier national-authority publication that the 'first' claim overlooks."
  ground_truth_url: https://www.cyber.gov.au/business-government/secure-design/artificial-intelligence/careful-adoption-of-agentic-ai-services
- entry: entries/2026-08-23/weekly-w34-looking-ahead.md
  verdict: clean
  defect: null
  ground_truth: "Every dated item verifies against the body that made it. European Commission CRA page (last update 27 July 2026): entered into force 10 December 2024, main obligations from 11 December 2027, 'reporting obligations to apply as of 11 September 2026', practical guidance published 27 July 2026 — and 11 September is nineteen days from 23 August. 20 Minuten: 'Das Gericht will das Urteil am Donnerstag, 10. September, fällen.' OSV record for CVE-2026-77710 (published 2026-08-21): last_affected 2026.7.8 with two individual commits and no tagged release. Berlin.de EN (23 Aug): both departments reconnected with continuously increased monitoring and the investigation continuing, no vector stated. ReliaQuest (18 Aug): high-confidence expansion in the coming weeks, moderate-confidence copycat adoption. NCSC UK (20 Aug): interim, to be superseded, no date given. Empty techniques[] is correct for this kind."
