- entry: entries/2026-08-23/martigny-combe-valais-communal-mailbox-compromise.md
  verdict: imprecision
  defect: "classification.credibility 1 (confirmed by other sources) overstates the corroboration: every fact that distinguishes this entry — the 10 August compromise, the eight-day dwell, the malicious email, ~300 stolen mails, ~450 recipients, two clicks, the year-long watch — rests on Le Nouvelliste alone, and the only corroborating outlet cited (ICTjournal) reproduces the commune's communiqué, which carries none of them; credibility 2 is the defensible code."
