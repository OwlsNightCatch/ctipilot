- entry: entries/2026-08-23/weekly-w34-exploited-is-now-a-per-authority-opinion.md
  verdict: factual-error
  defect: "The entry asserts three times that Microsoft's record for CVE-2026-33824 was unrevised — 'the IKE record unrevised since 14 April', 'has not been revised since it was published on 14 April 2026', and 'two Microsoft records this week were four and five weeks past their last revision' — but MSRC revised that record on 2026-08-20, two days after the KEV listing and three days before this entry published; separately, the clause 'neither does the research firm whose analysis both authorities relay' is attached to the CERT-EU advisory, which relays no research firm at all (its single reference is the Citrix KB) and makes no exploitation statement whatsoever."
  ground_truth: "MSRC CVE-2026-33824: releaseDate 2026-04-14, latestRevisionDate 2026-08-20, revision 1.1 = 'Added clarifying information to the mitigation. This is an informational change only.', Exploited: No, 'Exploitation Less Likely', CVSS 9.8 — so the vendor touched the record after CISA catalogued it and still recorded No, which strengthens the entry's thesis while falsifying its stated revision facts (and the 14 April → 21 August gap is four months, not four weeks). Everything else in the entry checks out exactly: CVE-2026-55040 is genuinely unrevised (latestRevisionDate 2026-07-14, Exploited No, impersonation FAQ); CVE-2026-69836 revision 1.1 of 2026-08-21 reads 'Corrected **Exploited** to **No**. This vulnerability was not exploited in the wild. This is an informational change only.' at CVSS 10.0 and is absent from KEV; EUVD-2026-63693 shows dateUpdated 22 Aug 2026, exploitedSince 21 Aug 2026 and the MSRC page as its only reference; KEV v2026.08.21 confirms both 2026-08-18 catalogue dates and the quoted vulnerability descriptions; NCSC-CH post 12863 was edited 2026-08-21 to 'Current exploitation status: Actively exploited' citing one x.com post; CERT-EU 2026-010 (19 Aug) carries CVE-2026-19490 at 9.3 and the SAML/build boundary."
  ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability/CVE-2026-33824
- entry: entries/2026-08-23/weekly-w34-berlin-landesnetz-nine-days-no-vector.md
  verdict: imprecision
  defect: "The title states Berlin's state network 'was compromised on 14 August', but no cited source dates the compromise — 14 August is when the forensic finding led to the two departments being isolated ('Angriff wurde am Freitag festgestellt'); the entry's own summary and body get this right, so only the title conflates detection with intrusion date."
  ground_truth: "Senatskanzlei release of 17.08.2026 carries both German evidence quotes verbatim, including 'Aus ermittlungstaktischen Gründen können derzeit keine weiteren konkreten Informationen zu Ausmaß und Hintergründen gegeben werden.', names LKA / Staatsanwaltschaft Berlin / BSI and the IKT-Notfallkrisenstab under the Landesbevollmächtigter für Informationssicherheit, records the isolation 'seit vergangenem Freitag', and states no vector, product, CVE, malware or actor. Berlin.de (dpa/BerlinOnline, 19 Aug) confirms Wegner's 'Berlin wurde Opfer eines Hackerangriffs', 'war ernst und ist ernst', no sensitive data outflow on current knowledge, phone-only reachability, Wohngeld application and disbursement unavailable, and Spranger on the 20 September election. Berlin.de EN (23 Aug) carries the reconnection quote verbatim plus continuously increased monitoring and the education-and-participation benefits. Tagesspiegel (23 Aug) carries 'die Auszahlung des Wohngelds an mehr als 50.000 berechtigte Haushalte nicht möglich'. The absence claim holds: none of the four sources states a vector, and nothing published through 24 August falsifies it. Empty techniques[] is correct for this kind."
