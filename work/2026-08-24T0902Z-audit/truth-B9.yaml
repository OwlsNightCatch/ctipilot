- entry: entries/2026-08-23/weekly-w34-three-ways-to-take-the-agent-off-the-board.md
  verdict: clean
  defect: null
  ground_truth: "Huntress (12 Aug) carries 'For the entire Safe Mode window, the host had no working EDR, and AV was blinded' and confirms SonicWall SSL VPN without MFA, AnyDesk as a service, the SafeBoot\\Network\\AnyDesk registry add, the msconfig-forced reboot and the domain controller. Talos (20 Aug) carries the callback-unlink sentence verbatim and confirms RTCore64.sys (MSI) and DBUtil_2_3.sys (Dell), a 13-version offset table, the process/thread/image-load callback classes and CrowdStrike Falcon, SentinelOne and Microsoft Defender by name. Check Point (20 Aug) carries both quoted sentences verbatim — the 'signed Microsoft remediation driver ... without exploits, vulnerabilities, or memory corruption' abstract question and the WDAC blocklist recommendation — plus BOOTTIMETOOL extraction from MpEngine.dll under a randomised [a-z]{8}.sys name, the RC4 job list in an alternate data stream, six action types, MSRC declining on SeLoadDriverPrivilege grounds, no observed real-world abuse, and the Event ID 7045 / process-lineage / feedback-path separators. The WDAC quote fails a naive substring test only because BTR.sys is a <code> element followed by a space before the period — an HTML-extraction artefact, not a quote defect."
