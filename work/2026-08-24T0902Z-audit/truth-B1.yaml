- entry: entries/2026-08-09/weekly-w32-open-source-supply-chain-status.md
  verdict: clean
  defect: null
  ground_truth: "Socket's 4 August post carries both evidence[] quotes as literal substrings, including the dead-man's-switch instruction 'Before rotating any credential, hunt for and remove the host-level dead-man's switch. Revocation is its trigger...' and the provenance sentence. Mechanics all match: preinstall hook setup.mjs, standalone Bun runtime, obfuscated second stage, cloud/CI credential harvesting, republishing via the stolen npm token; persistence as a macOS LaunchAgent (com.user.gh-token-monitor) or a Linux systemd user service with loginctl enable-linger; watcher polling the GitHub API 'every 60 seconds' (entry: 'roughly once a minute') and eval'ing a remote handler on HTTP 4xx; keyv reached transitively so 'most affected users never install any of them directly'; malicious artefacts detected an average of 5m18s after publication (entry: 'within hours'). Unit 42's CHAINDROP analysis independently confirms the runner-OIDC-to-publish-credential path, the Fulcio/Rekor signing chain and the explicit 'This is not forged provenance.' The body's inline Socket quote reads as a mismatch only because HTML extraction pads '( setup.mjs )' — an artefact. T1543.001/T1543.002/T1552.001/T1078.004/T1071.004/T1195.002 all active and all matched to described behaviour."
  ground_truth_url: "https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain"
- entry: entries/2026-08-09/weekly-w32-passkeys-attacked-from-three-directions.md
  verdict: clean
  defect: null
  ground_truth: "Both dirkjanm.io evidence[] quotes are literal substrings, including 'The challenge is not bound to a session, a user or even a tenant...' and the PowerShell/no-PIN-prompt sentence; the page carries no CVE and does cover the device-ID claim and refresh-token consequence. Unit 42's passwordless research confirms all three attack legs: the UV-flag-unset forged assertion via the device identity key, re-enrolment registering an attacker-generated UV key because 'The cloud authenticator does not validate the attestation of newly registered UV keys', and the 32-byte security domain secret with 'there is no way to rotate or revoke the SDS'. GTIG confirms UNC6671 behind BlackFile plus exactly four later brands (Redact, Pink, Helix, Falcon), vishing to employees' personal mobile devices, spoofing of the legitimate helpdesk number, the 'urgent helpdesk mandate to enable FIDO2 passkeys or update multi-factor authentication enrollment' pretext, and AiTM credential/MFA interception. All five techniques active in v19.2."
  ground_truth_url: "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"
