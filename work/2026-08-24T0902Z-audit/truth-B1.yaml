- entry: entries/2026-08-09/weekly-w32-kerberos-identity-confusion-poc-public.md
  verdict: imprecision
  defect: "'At Black Hat USA 2026' is asserted as fact in both the summary and the opening body sentence, but neither cited source states it: the Semperis blog post contains no occurrence of 'Black Hat', 'BHUSA' or 'briefing' anywhere, and the NVD API record obviously carries none. The claim is independently true, so this is a sourcing gap rather than a factual error — but as published, the conference framing on which the whole 'what changed this week' argument rests is uncited."
  ground_truth: "Semperis' own press release 'Semperis Takes Center Stage at Black Hat USA' places the company at Black Hat USA, 4-6 August 2026, Mandalay Bay, with researcher Shai Laron briefing on KerberLoss (CVE-2026-25177) and ResetNightmare (CVE-2026-27912) — so the fact holds, it is just not on either cited page. Everything else verifies exactly: NVD gives CVE-2026-25177 CVSS 3.1 base 8.8, published 2026-03-10, 'Improper restriction of names for files and other resources in Active Directory Domain Services allows an authorized attacker to elevate privileges over a network'; CVE-2026-27912 CVSS 3.1 base 8.0, published 2026-04-14, 'Improper authorization in Windows Kerberos allows an authorized attacker to elevate privileges over an adjacent network'. Both Semperis evidence[] quotes are literal substrings; the page confirms the NT-ENTERPRISE name type, 'The TGS-REQ is where the PAC_REQUESTOR_SID validation occurs' (the body lowercases the leading 'The' as a quotation convention), the WriteSPN hardening lever, the NTLM fallback, and a published PowerShell tool on GitHub implementing the full ResetNightmare flow — which supports 'runnable proof-of-concept'."
  ground_truth_url: "https://www.semperis.com/press-release/semperis-takes-center-stage-at-black-hat-usa/"
