- entry: entries/2026-08-10/cve-2026-66066-rapid7-metasploit-module-weaponisation.md
  verdict: imprecision
  defect: >
    The frontmatter cves[].affected field ("< 7.2.3.2, >= 8.0 < 8.0.5.1, >= 8.1 < 8.1.3.1") omits an
    entire affected branch that Rapid7's own emergent-threat-response post explicitly documents as
    having NO fixed release: "Rails 6.0.0 through 6.1.7.10 may be affected when Active Storage is
    configured to use Vips... Rails has not published fixed releases for branches earlier than 7.2, so
    affected applications on those branches should migrate to a supported fixed branch or apply the
    applicable workaround." The entry's own body evidence quote already names the two tested 6.x
    builds (6.0.6.1, 6.1.7.10) as reproduced-vulnerable, so the omission is not that the fact was
    unknown to the entry — it dropped out of the frontmatter's affected range and the body never states
    that this branch has no vendor fix at all, which changes the guidance for any Rails 6.x-with-Vips
    shop (upgrade is not an option; only the workaround is).
  ground_truth: >
    Rapid7's ETR post states Rails 6.0-6.1.7.10 (under non-default Vips config) is affected with no
    fixed release published, requiring migration to a supported branch or the VIPS_BLOCK_UNTRUSTED
    workaround — a materially different remediation path than the "patch-available" status implies for
    the rest of the CVE record.
  ground_truth_url: "https://www.rapid7.com/blog/post/etr-kindarails2shell-cve-2026-66066-critical-arbitrary-file-read-and-possible-remote-code-execution-in-ruby-on-rails/"
- entry: entries/2026-08-10/cve-2026-33824-ikeext-double-free-root-cause-published.md
  verdict: clean
  defect: null
  ground_truth: >
    0patch's blog confirms both quoted passages verbatim (the ikeext.dll/IkeReinjectReassembledPacket
    root-cause description and the "recreated a POC from the official patch" line). Third-party
    aggregators (SentinelOne, ZDI, feedly/OpenCVE via search) independently corroborate CVSS 9.8, the
