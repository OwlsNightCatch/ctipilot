- entry: entries/2026-08-10/bindcloak-rtlqueueworkitem-reflective-loading.md
  verdict: imprecision
  defect: >
    verification is set to "multi-source" but the entry's own sourcing_note states Kaspersky's
    OctLurk article corroborates only the family-relationship assessment, not any claim about
    BINDCLOAK itself (its loading tradecraft, host-ID derivation, command set, or the Middle-East
    targeting expansion) — every one of those is sourced to Zscaler alone. This is the identical
    situation the batch's cve-2026-33824 entry encountered with its own second source (Microsoft
    corroborating only the CVE's existence/CVSS, not the function-level root cause) — that entry
    correctly resolved it to "verification: single-source"; this entry did not apply the same rule
    for functionally the same reason, an inconsistency between two entries in the same batch rather
    than a wrong fact. All quoted technical claims (RtlQueueWorkItem/LoadLibraryW evasion rationale,
    high-confidence OctLurk-variant assessment, July 2026 Middle-East-energy expansion) verified
    verbatim against Zscaler's post.
  ground_truth: >
    Zscaler's Part 2 post is the sole source for BINDCLOAK's own findings; Kaspersky's securelist.com
    OctLurk/SilkLurk report (2026-07-30) documents a related-but-distinct family against Central
    Asian/Syrian government targets and does not mention BINDCLOAK, matching the entry's own
    sourcing_note. The technical content itself is accurately reported.
  ground_truth_url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"
