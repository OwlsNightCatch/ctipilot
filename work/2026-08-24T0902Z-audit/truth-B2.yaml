    jina credit pool exhausted) so the exact Windows-Server version-range boundary (entry states
    2016-2025) could not be independently re-verified against Microsoft's own page in this pass; no
    contradicting primary source was found, so this is not scored as a defect. verification is
    correctly set to "single-source" despite two sources cited, consistent with the sourcing_note's
    reasoning that Microsoft corroborates only the CVE's existence/CVSS, not the function-level detail
    — this is the correct handling that the bindcloak entry in this same batch did not apply.
  ground_truth_url: "https://0patch.com/blog/micropatches-released-for-windows-ike-service-extensions"
