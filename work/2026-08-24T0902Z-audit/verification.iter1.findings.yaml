  url_or_quote: "an unauthenticated remote code execution flaw arising from incorrect identification of `<?php` blocks combined with `var_export()`'s mishandling of certain inputs, notably a literal `<` character ([SPIP, 2026-08-17](https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr))"
  summary: "Fetched the 4.4.20 bulletin via tools/fetch_source.py url. Its entire security text is: 'La version 4.4.20 corrige une faille de securite signalee anonymement via l'ANSSI', 'Cette version corrige une vulnerabilite universelle (sans conditions) pre-authentification RCE qui touche toutes les versions de SPIP', 'Cette faille n'est pas prise en charge par l'ecran de securite', plus a bugfix list (spip_interdire_cache, Bigup, Dist). The strings var_export, <?php and '<' do not appear. Neither does the 4.4.21 bulletin (its list names safe_export_env(), not var_export) nor CERTFR-2026-AVI-1063 carry the mechanism. The mechanism IS true - it is the CVE-2026-77647 record's own description - so the fix is to attribute it the way the entry's own summary already attributes the exploitation status ('whose CVE record states'), or drop it. The dependent sentence 'the defect is a serialisation-time mishandling inside output generation' inherits the same gap."
