  item: "2026-08-24/spip-4-4-20-and-4-4-21-two-preauth-rce-security-screen-blind"
  url_or_quote: "classification: {reliability: A, credibility: 1} ... CERT-FR's advisory is the citable authority for the active-exploitation statement on the second flaw"
  summary: "Every substantive fact in the entry has exactly one assessor - the vendor. CERTFR-2026-AVI-1063, fetched this iteration, lists a single Source ('Bulletin de securite SPIP du 20 aout 2026'), a single Documentation link (the 4.4.21 bulletin), and attributes exploitation explicitly to the vendor: 'L'editeur indique que cette vulnerabilite est activement exploitee.' So CERT-FR is a second publisher of the vendor's assessment, not a second assessor - which is the 'one assessor, several publishers' pattern this run's own report lists as a live composition drift ('Classification over-award (4)'). credibility: 2 is the consistent code; reliability A is correct. Note the sourcing_note also needs its 'citable authority for the active-exploitation statement' clause softened, since the 4.4.21 bulletin states exploitation directly ('des tentatives d'exploitation de la faille ont deja ete constatees dans la nature')."
