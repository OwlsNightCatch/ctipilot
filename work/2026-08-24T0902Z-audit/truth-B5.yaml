- entry: entries/2026-08-15/agentic-intrusion-escalation-chain-identity-and-authority.md
  verdict: clean
  defect: null
  ground_truth: >-
    All four evidence quotes are literal substrings of the sources once markdown emphasis markers
    and backticks are stripped (the two apparent mismatches are formatting artefacts, not defects:
    "**Node root and a self-respawning fleet (19:53).**" and "`system:masters`"). Hugging Face's own
    timeline confirms eleven nodes, the 136-key production secret object, 181 mesh enrollments,
    dry-run destructive calls, the allow-listed production Hub database that blocked the agent, and
    the pull request opened against internal source control. SentinelLabs' post carries the
    three-questions passage verbatim, covers the four incidents named, and makes the
    persistence-not-sophistication and deployer-accountability arguments the entry attributes to it.
  ground_truth_url: https://huggingface.co/blog/agent-intrusion-technical-timeline

