- entry: entries/2026-08-15/fortiweb-radius-wildcard-bypass-fortimanager-fgfm.md
  verdict: imprecision
  defect: >-
    The entry asserts a FortiWeb 7.0 branch ("7.0.0-7.0.12", fixed "7.0.13 ... upcoming") for
    CVE-2026-26035 and "the 7.4, 7.2 and 7.0 branches at all versions" for CVE-2026-70466, and tells
    readers that "an estate on either [7.2 or 7.0] has no patch to install today"; neither cited
    Fortinet advisory carries a 7.0 branch, and FG-IR-26-158 presents 7.2.13 as an available upgrade
    path rather than an upcoming build. The entry's stated basis (Fortinet's CSAF record) is not
    citable under the source-pattern rule and could not be re-fetched from any reachable Fortinet
    endpoint in this pass (filestore/fortiguard CSAF paths returned 404/422), so the divergence is
    recorded as unverifiable rather than refuted. Everything else in the entry checks out: CVE ids,
    CVSS 8.8 / 7.3 / 4.8 / 7.3, CWE-287 / 288 / 184 / 120, the FortiManager and FortiClient version
    tables, the fgfm-peercert-withoutsn and Wildcard workarounds, the FG-VD-10009598.0day / FMWP
    26.071 virtual patch, and the SecurityWeek eight-vulnerability count and no-exploitation line.
  ground_truth: >-
    FG-IR-26-158 (CVE-2026-26035, CVSS 8.8, CWE-287) lists FortiWeb 8.0.0-8.0.2 -> 8.0.3,
    7.6.0-7.6.6 -> 7.6.7, 7.4.0-7.4.11 -> 7.4.12, 7.2.0-7.2.12 -> "7.2.13 or above"; no 7.0 branch
    appears. FG-IR-26-157 (CVE-2026-70466, CVSS 4.8, CWE-184) lists 8.0.0-8.0.2 -> 8.0.3,
    7.6.0-7.6.5 -> 7.6.6, and 7.4 / 7.2 "all versions - migrate"; no 7.0 branch appears.
  ground_truth_url: https://www.fortiguard.com/psirt/FG-IR-26-158

