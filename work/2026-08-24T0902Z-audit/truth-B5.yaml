- entry: entries/2026-08-15/netscaler-saml-signedinfo-overflow-preauth-root-rce-not-dos.md
  verdict: clean
  defect: null
  ground_truth: >-
    Correction claim confirmed on both sides. The vendor-CNA CVE record for CVE-2026-8452 reads
    "Memory overflow vulnerability NetScaler ADC and NetScaler Gateway leading to unpredictable or
    erroneous behavior and Denial of Service if the appliance is configured as a Gateway (SSL VPN,
    ICA Proxy, CVPN, RDP Proxy) or AAA virtual server", CVSS 4.0 base 8.8, affected ADC/Gateway 14.1
    <72.61 and 13.1 <63.18 plus 14.1 FIPS <72.61 and 13.1 FIPS/NDcPP <37.272 - matching the entry's
    version strings and both CVSS figures exactly. watchTowr's post carries every quoted sentence
    verbatim and ends in a root shell pre-authentication. NCSC-CH post 12739 carries "Actively
    Exploited, Proof of Concept Available" and "A new technical analysis, likely related to
    CVE-2026-8452, was published by Watchtowr" verbatim, was created 2026-07-03 and edited
    2026-08-14, and records the SAML IdP precondition for CVE-2026-8451 (CVSS 4.0 8.8). Citrix
    CTX696604 does render as an empty client-side application shell, exactly as the sourcing note
    states.
  ground_truth_url: https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/

