  - title: "SUEZ Eau France (water utility, 10M+ customers) discloses client data exposure — including RIB/IBAN and identity documents — via a technical service provider's breach"
    sources:
      - { url: "https://fuitesinfos.fr/article/2026-08-20-suez-eau-france", publisher: "Fuites Infos", date: "2026-08-20", role: "primary" }
      - { url: "https://www.cyberattaque.org/suez-les-donnees-clients-en-fuite-apres-une-cyberattaque-chez-un-prestataire/", publisher: "Cyberattaque.org", date: "2026-08-20", role: "corroborating" }
      - { url: "https://frenchbreaches.com/alertes/suez-eau-france-mt20mo6pymh9k6m7wzf", publisher: "FrenchBreaches", date: "2026-08-20", role: "corroborating" }
    discovery_trace: "first seen at: cyberattaque-org listing sweep, URL https://www.cyberattaque.org/type/attaque/ -> primary: Fuites Infos, URL https://fuitesinfos.fr/article/2026-08-20-suez-eau-france"
    summary: |
      SUEZ Eau France — the French water-and-wastewater arm of the SUEZ group,
      serving over 10 million users — notified customers around 2026-08-20 of a
      data exposure originating at "one of its technical service providers"
      (unnamed in reporting reviewed) that suffered its own cyberattack, enabling
      access to and extraction of data subsequently made partly accessible online.
      Exposed categories per the client notification: full name, email, phone
      number, contract-related administrative documents, and in some cases identity
      documents, photographs, and banking coordinates (RIB/IBAN). SUEZ states it
      cannot yet confirm that every notified individual's data was actually stolen,
      and has not disclosed a victim count or a precise exposure timeframe. This is
      a first-party client notification (reproduced as an image by Fuites Infos and
      independently reported by two further French outlets — MULTI-SOURCE by
      publication count, though all three ultimately reproduce the same
      notification letter rather than adding independent reporting) rather than a
      leak-site claim, so it clears the fake-news-guard bar as a victim disclosure.
      Relevant to the deployment's "water" additional sector and to the recurring
      2026-W33/W34 theme (already tracked in this pipeline's own synthesis entries)
      of third-party/processor access paths displacing notification duties onto
      organisations holding no facts about what happened.
    region_nexus: "France (EU); SUEZ operates water/waste infrastructure across multiple European and international markets"
    primary_sector_nexus: "indirect (additional sector: water)"
