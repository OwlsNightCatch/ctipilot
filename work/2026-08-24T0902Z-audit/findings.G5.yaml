items:
  - title: "NCSC Switzerland (BACS) H1 2026 semi-annual report: 79 ransomware reports stagnant but fragmenting, 200 mandatory critical-infrastructure notifications, no targeted cyber-sabotage against CI observed"
    sources:
      - { url: "https://www.bacs.admin.ch/de/hjb-2026-1-mm-de", publisher: "BACS (Bundesamt für Cybersicherheit / Swiss federal cybersecurity authority, formerly NCSC.ch)", date: "2026-08-24", role: "primary" }
      - { url: "https://www.bacs.admin.ch/de/im-fokus", publisher: "BACS — Im Fokus listing", date: "2026-08-24", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus -> primary (no pivot needed): https://www.bacs.admin.ch/de/hjb-2026-1-mm-de (page body verified via direct bridge fetch of the Nuxt state payload, not just the WebFetch summary)"
    summary: |
      Switzerland's federal cybersecurity authority (BACS, the renamed NCSC.ch)
      published its semi-annual report for H1 2026 (January-June) on 2026-08-24.
      BACS received 27,128 voluntary incident reports and 200 mandatory reports under
      the critical-infrastructure reporting duty in force since 2025-04-01. Mandatory
      reports break down 19.4% public administration, 18.6% IT/telecom by sector, and
      by attack type: hacking ~26%, credential theft 13.5%, data exfiltration 12.7%,
      DDoS 12.7%. Ransomware/extortion reports stagnated numerically at 79 (flat
      vs. H2 2025's 57, though BACS frames it as stagnation rather than growth) "but
      showed a clear tendency toward diversification and fragmentation of ransomware
      families" — i.e. affiliate/RaaS churn continuing rather than concentration
      around a single dominant brand. BACS states explicitly that Switzerland has not
      yet seen targeted cyber-sabotage against critical infrastructure, but warns
      Swiss organisations to keep building resilience given the country's economic
      and political entanglement with other Western states in an increasingly
      hostile threat environment, illustrating the point with a case study of an
      incident in Poland. Separately, the report credits the phone-number labelling
      mandate (extended to mobile numbers on 2026-07-01) with cutting fraudulent
      calls impersonating authorities by more than 75% in July 2026 (from 400+/month
      to under 100). BACS also flags systematic attacker use of AI for personalised
      social-engineering content as a named trend line for the half-year.
    region_nexus: "Switzerland (home region) — national CI-reporting-duty statistics"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector (national CI reporting duty covers all critical-infrastructure operators)"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Im ersten Halbjahr gingen beim Bundesamt für Cybersicherheit (BACS) 27'128 freiwillige Meldungen und 200 Meldungen im Rahmen der Meldepflicht zu Angriffen auf kritische Infrastrukturen ein."
        attribution: "BACS (Bundesamt für Cybersicherheit)"
        source_url: "https://www.bacs.admin.ch/de/hjb-2026-1-mm-de"
      - quote: "Ransomware-Angriffen stagnierten bei 79, zeigten aber eine deutliche Tendenz zur Diversifizierung und Fragmentierung der Ransomware-Familien."
        attribution: "BACS (Bundesamt für Cybersicherheit)"
        source_url: "https://www.bacs.admin.ch/de/hjb-2026-1-mm-de"
      - quote: "Zwar gab es bislang keine gezielte Cybersabotage gegen kritische Infrastrukturen. Jedoch müssen sich Schweizer Organisationen aufgrund der Nähe der Schweiz zu anderen westlichen Staaten und aufgrund ihrer wirtschaftlichen und politischen Verflechtung weiterhin darauf einstellen, ihre Widerstandsfähigkeit in einem zunehmend feindseligen Cyberbedrohungsumfeld zu behaupten."
        attribution: "BACS (Bundesamt für Cybersicherheit)"
        source_url: "https://www.bacs.admin.ch/de/hjb-2026-1-mm-de"
      - quote: "Die meisten Meldungen stammen aus dem Verwaltungssektor (19.4 %) und von Unternehmen in der IT und Telekommunikation (18.6 %). Bei den gemeldeten Angriffsarten dominierten Hacking-Vorfälle (rund 26 %), gefolgt vom Diebstahl von Zugangsdaten (13.5 %) und Meldungen zu Datenabflüssen und DDoS-Angriffen (je 12.7 %)."
        attribution: "BACS (Bundesamt für Cybersicherheit)"
        source_url: "https://www.bacs.admin.ch/de/hjb-2026-1-mm-de"
    extended_notes: |
      Full PDF report (BACS-HJB-2026-1_DE.pdf, not machine-text-extractable via the
      bridge — binary/image-heavy PDF) is linked from the press release for anyone
      needing the complete document: https://www.bacs.admin.ch/dam/de/sd-web/Wiv5nsS1J6-l/BACS-HJB-2026-1_DE.pdf
      TIMING CAVEAT: publication date is 2026-08-24 with no time-of-day recorded on
      the page; the audit window closes 2026-08-24T09:00Z and this sweep started
      2026-08-24T09:02Z (Swiss local time ~11:02 CEST), so the report was already
      live when fetched but its exact publish timestamp relative to the 09:00Z
      boundary could not be confirmed — worth a sanity check before the main agent
      finalises the window classification. This is exactly the kind of periodic/
      statistical report that would otherwise land in a W1 weekly sweep; flagging
      here because it published inside this sweep's assigned window and carries
      ransomware/incident statistics squarely in G5's remit.
    borderline: false

  - title: "France's Protection Civile (national civil-defence volunteer association) discloses a March 2026 eProtec platform breach affecting 525,000+ volunteer/former-volunteer records including minors' data — discovered by the organisation only in mid-August"
    sources:
      - { url: "https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html", publisher: "France Info (French public broadcaster)", date: "2026-08-21", role: "primary" }
      - { url: "https://www.cnews.fr/france/2026-08-21/cyberattaque-la-protection-civile-affirme-avoir-ete-visee-par-un-vol-de-donnes-en", publisher: "CNEWS", date: "2026-08-21", role: "corroborating" }
      - { url: "https://frenchbreaches.com/alertes/protection-civile-mt27j64epv2smy5m0g", publisher: "FrenchBreaches", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Schweiz Cyberangriff Datenleck Gemeinde Kanton August 2026\" / \"Protection Civile eProtec fuite données 2026\") -> primary: France Info, URL https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html"
    summary: |
      La Protection Civile (France's national civil-defence/emergency-response
      volunteer federation) announced on 2026-08-21 that its eProtec volunteer-
      management platform was compromised, with the intrusion itself dating to
      March 2026. Frenchbreaches.com first surfaced the leaked dataset; the
      organisation states it only learned of the March compromise on 2026-08-18 —
      a five-month dwell/detection gap for the underlying access, followed by a
      three-day gap to public disclosure. Estimated 525,000+ affected profiles
      (the organisation notes "many duplicates" in the leaked file, so the true
      unique-victim count is lower and undetermined). Data categories: civil-status
      data, phone numbers, profession, assignment/section, status, and profile
      photographs; data belonging to minor volunteers is explicitly confirmed
      included. No data belonging to people the Protection Civile has physically
      assisted (i.e. emergency-service beneficiaries) is implicated — exposure is
      limited to the volunteer/personnel side. No attack vector or root cause has
      been disclosed. The organisation filed a criminal complaint with the Paris
      prosecutor's cybercrime section (BL2C/OFAC-equivalent for cyber) rather than
      confirming CNIL notification in the reporting reviewed. This is directly on
      the same theme this pipeline's own 2026-08-23 weekly synthesis
      ("weekly-w34-the-disclosure-arrived-the-facts-did-not") already tracked for
      the same ISO week — Austria, Latvia, Spain and Switzerland (twice) — but
      Protection Civile is a sixth, France-nexus instance of an identical
      structural pattern (disclosing organisation cannot yet state scope; long
      undetected dwell time on the access) that the published synthesis did not
      include.
    region_nexus: "France (EU home-region-adjacent); national civil-protection/emergency-services volunteer federation"
    primary_sector_nexus: "indirect (public-safety/emergency-response volunteer organisation, not core federal/cantonal administration, but structurally the same government-adjacent civil-protection function)"
    sector: "public-sector, emergency services"
    cves: []
    techniques: ["T1078 Valid Accounts"]
    affected_products: ["eProtec"]
    entity_keys: []
    new_entities:
