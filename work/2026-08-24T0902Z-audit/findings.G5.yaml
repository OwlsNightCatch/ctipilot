    outcome: |
      BLOCTEL: RESOLVED. DGCCRF (Direction générale de la concurrence, de la consommation
      et de la répression des fraudes — the French government consumer-protection
      authority, A-reliability first-party source for its own jurisdiction) published a
      press release on 2026-08-12 confirming the leak: a cybercriminal fraudulently
      accessed a professional (Consoprotec) account and obtained files totalling 3
      million phone numbers, of which 600,000 belonged to Bloctel opt-out registrants;
      no other personal data was exposed; the compromised account was blocked; CNIL was
      notified. This is a first-party government confirmation and clears the resolution
      condition. NOTE: the confirming source is dated 2026-08-12, which falls inside the
      prior sweep's 2026-08-09 -> 2026-08-16 window, not this G5 sweep's own
      2026-08-16 -> 2026-08-24 window — flagging for cross-check against whichever
