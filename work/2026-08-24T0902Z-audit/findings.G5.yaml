    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "violation de données à caractère personnel"
        attribution: "France Info, quoting Protection Civile's own statement"
        source_url: "https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html"
      - quote: "Aucune donnée piratée n'appartient à des personnes à qui la Protection civile a porté secours"
        attribution: "Protection Civile, via France Info"
        source_url: "https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html"
      - quote: "A ce stade, les investigations ne permettent pas de déterminer si l'ensemble de ces données a effectivement été consulté ou extrait"
        attribution: "Protection Civile, via France Info"
        source_url: "https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/la-protection-civile-annonce-avoir-ete-visee-par-une-cyberattaque-en-mars_8156621.html"
    extended_notes: |
      Confidence marked MEDIUM rather than HIGH because scope (exact unique victim
