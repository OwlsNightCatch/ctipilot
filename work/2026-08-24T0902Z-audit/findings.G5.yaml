      AFPA: STILL UNRESOLVED / stays closed. No AFPA or ministry statement found since
      2026-08-09; every hit (cyberattaque.org, frenchbreaches.com) still traces to the
      original 2026-08-07 Cybernox claim describing exposure limited to the AFPABox
      community-forum application (101 accounts, admin-interface credentials), with
      explicit statements that nothing establishes compromise of AFPA's main information
