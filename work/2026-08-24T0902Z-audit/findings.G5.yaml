  - title: "Considered and dropped (documented, not shipped): DINUM / cloud.numerique.gouv.fr leak-site claim and Capgemini Engineering/Altran Everest ransomware claim"
    sources:
      - { url: "https://www.cyberattaque.org/dinum-31-544-lignes-liees-au-cloud-de-letat-en-fuite/", publisher: "Cyberattaque.org", date: "2026-08-22", role: "primary" }
      - { url: "https://www.cyberattaque.org/capgemini-altran-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: cyberattaque-org listing sweep, URL https://www.cyberattaque.org/type/attaque/ -> corroboration search: WebSearch (\"DINUM cloud.numerique.gouv.fr confirmation officielle fuite communiqué\"; \"Capgemini Altran Everest ransomware 2026\") -> no first-party confirmation found for either"
    summary: |
      Two French leak-site/extortion claims surfaced this window that carry
      government/public-sector-supplier relevance but fail the fake-news guard on
      current evidence, logged here for audit completeness rather than shipped:
      (1) DINUM — actor "0xSec" claims to have published data from
      cloud.numerique.gouv.fr, the French interministerial digital directorate's
      state-cloud platform, spotted 2026-08-22: 31,544 CSV rows including public-
      contract/transaction data and metadata on state-funded AI programmes. No
      DINUM or government confirmation found; reporting itself notes some of the
      data may overlap with information DINUM already publishes as part of its
      cloud-strategy transparency commitments, undercutting the claim's novelty.
      Distinct from DINUM's confirmed, already-disclosed HubEE (Jan 2026) and Tchap
      (June 2026) incidents. (2) Capgemini Engineering/Altran — the Everest
      ransomware group listed Capgemini Engineering on 2026-08-20, claiming 13.08 GB
      / 722,470 files of historical Altran-era data (source code, public-sector
      project documentation, HR/consultant records). No encryption, exfiltration, or
      operational-disruption evidence has been produced by the actor, Capgemini has
      not confirmed, and multiple breach-monitoring outlets note a pattern of
      recently unverified or fabricated Everest listings, directly echoing this
      pipeline's own prior ExfilSquad credibility-reversal precedent. Both would
      warrant republishing on a first-party statement or A/B-grade confirmation;
      recommend tracking as watch items analogous to Bloctel/Afpa above rather than
      dropping outright, given the government/public-sector-supplier data classes
      claimed in each.
    region_nexus: "France (EU)"
    primary_sector_nexus: "indirect (government cloud infrastructure; IT/engineering supplier to public-sector clients)"
