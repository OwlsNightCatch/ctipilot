- entry: entries/2026-08-19/cve-2026-18963-keycloak-reset-credentials-account-takeover.md
  verdict: imprecision
  defect: >-
    The entry's second remediation pillar — "one affected product has no fix at all", carried in
    the headline ("one affected Red Hat product has no fix at all"), the summary, the cves[]
    affected/fixed fields and action 2 — rests on Red Hat's structured product state recording
    keycloak-services as "Affected" with no erratum in the JBoss EAP Expansion Pack. Red Hat's
    machine-readable record now shows that row as "Not affected", i.e. no product in scope lacks
    a fix. A vendor flip from Affected to Not affected after analysis is the most likely
    explanation and no archived snapshot exists to date the change, so this is recorded as
    imprecision rather than error; the RHSSO 7 "Not affected" half of the same sentence is
    correct. Separately, the entry offers a reverse-proxy compensating control without noting
    that Red Hat publishes its own mitigation (disable Forgot password per realm).
