  - title: "Splunk Enterprise August 2026 Security Hardening Release: 55 CVEs including an unauthenticated embedded-report session-hijack path and a privileged SPL-to-full-system-credential-store escalation"
    sources:
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-0801", publisher: "Splunk (vendor PSIRT)", date: "2026-08-19", role: primary }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1056/", publisher: "CERT-FR / ANSSI", date: "2026-08-20", role: corroborating }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0322", publisher: "NCSC-NL", date: "2026-08-21", role: corroborating }
    discovery_trace: >
      first seen at: advisories-ncsc-nl (RSS feed https://advisories.ncsc.nl/rss/advisories), item "NCSC-2026-0322
      ... Kwetsbaarheden verholpen in Splunk Enterprise" (2026-08-21) → cross-checked against cert-fr avis-recent
      listing, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1056/ ("Multiples vulnérabilités dans les
      produits Splunk", 2026-08-20) → pivot: WebSearch ("Splunk Enterprise security advisory August 2026 10.4.2
      10.2.6 10.0.9 9.4.14 CVE") → primary: Splunk's own advisory, URL
      https://advisory.splunk.com/advisories/SVD-2026-0801
    summary: |
      Splunk published its August 2026 Security Hardening Release (SVD-2026-0801) on 2026-08-19, patching 55 CVEs
      (CVE-2026-76251 through CVE-2026-76355) across Splunk Enterprise 10.4.0-10.4.1, 10.2.0-10.2.5,
      10.0.0-10.0.8 and 9.4.0-9.4.13, plus Splunk Secure Gateway; fixed in 10.4.2, 10.2.6, 10.0.9 and 9.4.14.
      The most severe class (CVSS 9.4, CVE-2026-76310/-76311/-76312) is an improper-access-control chain in the
      Embedded Reports feature: Splunk's own advisory states an unauthenticated user who holds an embedded-report
      token can download the report's search-job dispatch archive via the REST API, recover session material from
      it, and use that material to access everything the report owner can see — the embedded-report access model
      never restricted the REST dispatch-archive download path. A second high-value class requires only the
      widely-granted schedule_search role capability: a user with that capability can run arbitrary SPL commands
      at the highest system privilege level and read every credential in Splunk's credential store, a privilege
      jump from a routine scheduling permission to full system and credential-store compromise. Separately, a
      companion advisory (SVD-2026-0802, referenced in the same release) remediates 33 third-party-package CVEs
      via Go and golang-grpc upgrades. No exploitation is reported for either flaw class.
    region_nexus: "global; Splunk is widely deployed as SIEM/log-management tooling inside the constituency's own SOC and IT estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, energy, healthcare, telco"
    cves: [CVE-2026-76310, CVE-2026-76311, CVE-2026-76312]
    techniques: [T1190, T1068]
    affected_products: ["Splunk Enterprise", "Splunk Secure Gateway"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An unauthenticated user who has an embedded report token could download the associated search job dispatch archive, recover session material, and use it to access all relevant data available to the report owner."
        attribution: "Splunk"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0801"
      - quote: "Upgrade Splunk Enterprise to versions 10.4.2, 10.2.6, 10.0.9, and 9.4.14, or higher."
        attribution: "Splunk"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0801"
    extended_notes: |
      Genuine gap: neither SVD-2026-0801 nor any of its CVEs appears in prior_coverage.json for the window,
      despite CERT-FR (avis-recent, essential-tier) and NCSC-NL both carrying it in-window. Distinct from the
      already-covered June 2026 KEV entry CVE-2026-20253 (unrelated PostgreSQL-sidecar pre-auth RCE, patched
      months earlier) — do not conflate the two Splunk stories.

