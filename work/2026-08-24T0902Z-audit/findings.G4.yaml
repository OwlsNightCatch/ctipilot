        attribution: "SPIP project"
        source_url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr"
      - quote: "Il est impératif de mettre très rapidement votre site à jour, des tentatives d'exploitation de la faille ont déjà été constatées dans la nature."
        attribution: "SPIP project"
        source_url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr"
      - quote: "Cette faille n'est pas prise en charge par l'écran de sécurité."
        attribution: "SPIP project"
        source_url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr"
      - quote: "L'éditeur indique que cette vulnérabilité est activement exploitée."
        attribution: "CERT-FR / ANSSI"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/"
    extended_notes: |
      This is a genuine gap in the audit window: not present anywhere in prior_coverage.json for 2026-08-16 to
      2026-08-24 despite two independent A-reliability primaries (SPIP itself, CERT-FR) and clean corroboration.
      SPIP's install base in Swiss francophone cantonal/communal sites is plausible but unverified this run —
      worth a targeted watchlist note for that constituency.

  - title: "Cisco Crosswork and Secure Workload: nine CVEs from an internal security review, four at CVSS 10.0/9.9 unauthenticated"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-crosswork-UzDTU9Vh", publisher: "Cisco PSIRT", date: "2026-08-19", role: primary }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-csw1-shSvndWP", publisher: "Cisco PSIRT", date: "2026-08-19", role: primary }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0323", publisher: "NCSC-NL", date: "2026-08-21", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub (bridge ncsc-csh recent), citation URL
      https://security-hub.ncsc.admin.ch/#/posts/12867 ("[Advisory] Cisco: Multiple Critical Vulnerabilities in
      Crosswork and Secure Workload", 2026-08-21) → pivot: Cisco PSIRT advisory, URL
      https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-crosswork-UzDTU9Vh
      → pivot: companion Cisco PSIRT advisory, URL
      https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-csw1-shSvndWP
      → cross-checked against the Cisco PSIRT RSS feed (advance-notification digest for 2026-08-19) and against
      NCSC-NL's own advisory NCSC-2026-0323, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0323
    summary: |
      Cisco published two software-hardening advisories on 2026-08-19, both the product of internal security
      reviews rather than external reports. Crosswork Data Gateway, Network Controller, Planning and Workflow
      Manager (all ≤ 7.2.1 / ≤ 2.1.1) carry CVE-2026-20030 (SQL injection, CWE-89, CVSS 10.0), CVE-2026-20357
      (missing authentication for a critical function, CWE-306, CVSS 10.0), CVE-2026-20358 (external control of
      file system, CWE-73, CVSS 10.0) and CVE-2026-20359 (insufficiently protected credentials, CWE-522, CVSS
      9.9) — network-reachable, no authentication or user interaction required per Cisco's own CVSS vectors.
      Secure Workload (SaaS and on-premises, ≤ 3.10.9.1 / ≤ 4.0.4.16) carries five companion CVEs
      (CVE-2026-20231 CWE-74 injection CVSS 9.9; CVE-2026-20315 CWE-284 improper access control CVSS 10.0;
      CVE-2026-20317 CWE-287 improper authentication CVSS 10.0; CVE-2026-20318 CWE-20 path traversal CVSS 9.6;
      CVE-2026-20319 CWE-119 buffer overflow CVSS 7.5). Cisco states none of these nine flaws is known to be
      exploited and there are no workarounds — upgrade is the only remediation. The same 2026-08-19 PSIRT batch
      also shipped a lower-severity Cisco BroadWorks blind XXE (CVE-2026-20320, CVSS 7.5, unauthenticated
      configuration-file disclosure via the OCI-P provisioning interface) plus Medium-rated Unified Intelligence
      Center SQLi, RoomOS stack overflow and Industrial Ethernet 1000 XSS/DoS items — all authenticated or
      requiring physical access, so this entry's operational urgency rests on the two Critical hardening
      releases.
    region_nexus: "global; Crosswork/Secure Workload are enterprise network-orchestration and microsegmentation platforms deployed across telco and large-enterprise networks including EU/CH operators"
    primary_sector_nexus: "indirect"
    sector: "telco, finance, energy"
    cves: [CVE-2026-20030, CVE-2026-20357, CVE-2026-20358, CVE-2026-20359, CVE-2026-20231, CVE-2026-20315, CVE-2026-20317, CVE-2026-20318, CVE-2026-20319, CVE-2026-20320]
    techniques: [T1190]
    affected_products: ["Cisco Crosswork Data Gateway", "Cisco Crosswork Network Controller", "Cisco Crosswork Planning", "Cisco Crosswork Workflow Manager", "Cisco Secure Workload", "Cisco BroadWorks"]
