  - title: "SPIP CMS: a universal pre-auth RCE, unpatched by SPIP's own security screen, actively exploited within days of the 4.4.20 fix (CVE-2026-77647)"
    sources:
      - { url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr", publisher: "SPIP project (vendor blog)", date: "2026-08-17", role: primary }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/", publisher: "CERT-FR / ANSSI", date: "2026-08-21", role: primary }
      - { url: "https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/", publisher: "TheHackerWire", date: "2026-08-20", role: corroborating }
    discovery_trace: >
      first seen at: cert-fr (anssi-fr source-id), URL https://www.cert.ssi.gouv.fr/avis/feed/ (avis-recent listing,
      "Vulnérabilité dans SPIP (21 août 2026)") → pivot: CERT-FR advisory detail, URL
      https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/ (confirms "L'éditeur indique que cette vulnérabilité
      est activement exploitée") → pivot: WebSearch ("SPIP CMS vulnerability actively exploited August 2026 RCE CVE")
      → TheHackerWire, URL https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/ → pivot: WebSearch
      ("SPIP.net sécurité 4.4.20 correctif faille critique exécution code") → primary: SPIP project's own blog, URL
      https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html?lang=fr
    summary: |
      SPIP, the PHP CMS used extensively by French government agencies, municipalities, media and francophone
      institutions (including francophone Swiss sites), shipped 4.4.20 on 2026-08-17 to fix a universal,
      no-precondition, pre-authentication remote code execution flaw that affects every SPIP version and is
      NOT caught by SPIP's built-in "écran de sécurité" (security screen) protection layer. The bug was reported
      anonymously through ANSSI's vulnerability-declaration channel. Root cause per aggregator reporting tracking
      the CVE (TheHackerWire, corroborating the vendor's own severity language): incorrect identification of
      <?php blocks combined with a mishandling in var_export() of input containing a literal '<' character lets
      attacker-controlled data escape its intended context and be interpreted as executable PHP, yielding
      unauthenticated RCE. SPIP's own release note states plainly that exploitation attempts have already been
      observed in the wild ("des tentatives d'exploitation de la faille ont déjà été constatées dans la nature").
      CERT-FR published its own advisory on 2026-08-21 (four days after the fix) explicitly stating the publisher
      reports active exploitation. No version range is excluded — every branch is affected; upgrade to 4.4.20 is
      the only remediation, there is no workaround since the flaw bypasses the product's own security-screen
      mitigation layer.
    region_nexus: "France (home authority ANSSI/CERT-FR); francophone Switzerland and Belgium plausibly exposed given SPIP's regional public-sector/media footprint"
    primary_sector_nexus: "direct"
    sector: "public-sector, media"
    cves: [CVE-2026-77647]
    techniques: [T1190]
    affected_products: ["SPIP CMS"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
