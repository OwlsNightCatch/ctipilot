      4.1.64 then twice more inside three days (final: 4.1.66, one of the follow-up fixes itself scored 8.6);
      and Sourcerer up to 13.x executed PHP from page content it could not trace to a verified source
      (CVE-2026-74253, CVSS 10.0), fixed in 14.0.0. A third, iCagenda Calendar module 4.0.12 (CVE-2026-67365,
      CVSS 9.2), fixed an unauthenticated SQL injection. None of the vendor posts report observed in-the-wild
      exploitation for these three; mySites.guru's own site notes it found and reported all three findings
      itself as part of its ongoing coordinated-disclosure programme across the Joomla extension ecosystem
      (already the subject of tracked prior pipeline coverage on other extensions from the same wave — SP Page
      Builder, RSFiles!, Phoca Download, iCagenda's own earlier CVE-2026-48939).
    region_nexus: "global; Joomla extension ecosystem, moderate EU public-sector footprint"
