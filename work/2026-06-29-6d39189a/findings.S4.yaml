  - title: "KDDI ISP email platform breach exposes up to 14.22 million subscriber accounts across six Japanese ISPs"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
        publisher: "BleepingComputer"
        date: "2026-06-28"
        role: "primary"
      - url: "https://securityaffairs.com/180019/data-breach/kddi-data-breach-impacts-14-2-million-isp-customers.html"
        publisher: "SecurityAffairs"
        date: "2026-06-28"
        role: "corroborating"
    discovery_trace: "first seen at: databreaches-net feed (bridge:feed https://databreaches.net/feed/), item dated 2026-06-28 → pivot: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/ → corroboration: SecurityAffairs https://securityaffairs.com/180019/data-breach/kddi-data-breach-impacts-14-2-million-isp-customers.html"
    summary: |
      KDDI, Japan's second-largest mobile carrier, disclosed on June 23, 2026 (Japanese) and June 28, 2026 (English press) that a breach of a third-party software platform used to manage ISP email accounts exposed up to 14.22 million subscriber email login credentials across six affiliated ISPs: STNet, JCOM, Chubu Telecommunications, NIFTY, BIGLOBE, and a sixth unnamed ISP. The incident was detected on June 17, 2026, with an attacker exploiting a vulnerability in the ISP email management system operated by a third-party vendor. Exfiltrated data includes email addresses and passwords (some hashed or encrypted, with specifics not disclosed). KDDI notified Japan's Personal Information Protection Commission (PIPC) and Ministry of Internal Affairs and Communications. No threat actor has been named. Affected users have been advised to change passwords and enable multi-factor authentication. The attack vector — a supply-chain/third-party software vulnerability giving access to a mass ISP email management platform — is a significant signal for infrastructure defenders: any multi-ISP shared management plane represents a single point of compromise enabling credential theft at scale. Detection: monitor for anomalous bulk authentication attempts using ISP-domain email credentials in identity logs; alert on MFA bypass patterns for email accounts. Hardening: enforce MFA on all ISP email accounts; audit third-party vendor access to subscriber management systems.
    ch_eu_nexus: "global; no direct CH/EU public-sector nexus, but the attack pattern (third-party platform breach → multi-ISP credential exposure) is directly relevant to European telco and public ISP infrastructure operators"
    public_sector_nexus: "indirect — ISP infrastructure; some affected subscriber base may include government/public-sector email users"
    sector: "telco, ISP"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "KDDI has disclosed a data breach that exposed the personal information of up to 14.22 million customers of various internet service providers (ISPs) it operates"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
      - quote: "The company says the threat actor exploited a vulnerability in its ISP email management system to access the data"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
    extended_notes: |
      The breach illustrates how shared service platforms in the telco sector create systemic risk: a single vendor vulnerability enabled access to subscriber account data across six separate ISPs simultaneously. For defenders in European telco and ISP environments, this pattern maps to T1190 (Exploit Public-Facing Application) against third-party managed services. PIPC notification was required under Japan's Act on the Protection of Personal Information. No ransomware or data-leak site involvement reported. KDDI has indicated it is reviewing its vendor security posture.

  - title: "AssuranceAmerica Managing General Agency breach affects more than 1.1 million insurance customers in seven US states"
    sources:
      - url: "https://databreaches.net/2026/06/28/assuranceamerica-breach-may-have-affected-more-than-1-1-million-people-in-seven-states/"
        publisher: "databreaches.net"
        date: "2026-06-28"
        role: "primary"
      - url: "https://www.prnewswire.com/news-releases/assuranceamerica-managing-general-agency-llc-notifies-consumers-of-data-security-incident-302488312.html"
        publisher: "PRNewswire"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: databreaches-net feed (bridge:feed https://databreaches.net/feed/), item dated 2026-06-28 → primary article URL (bridge:url attempt returned 403 — used feed summary + WebSearch) → PRNewswire corroboration via WebSearch query 'AssuranceAmerica data breach 2026' → prnewswire.com notice https://www.prnewswire.com/news-releases/assuranceamerica-managing-general-agency-llc-notifies-consumers-of-data-security-incident-302488312.html"
    summary: |
      AssuranceAmerica Managing General Agency LLC, an Atlanta-based insurance administrator, disclosed a data security incident that may have affected more than 1.1 million individuals across seven US states (California, Massachusetts, Nebraska, South Carolina, Texas, Vermont, Washington). The incident occurred March 16–17, 2026, when attackers targeted a single employee's credentials and exfiltrated files containing auto insurance policyholder data. AssuranceAmerica completed its file review on June 15, 2026, and sent breach notifications to affected state attorneys general approximately June 26–27. Exposed data includes: full names, auto insurance policy information, driver/vehicle information, driver's license numbers, Tax IDs (ITIN), and Social Security Numbers. No threat actor or ransomware group has been named. The attack vector — single-employee credential compromise enabling bulk data exfiltration from insurance management systems — is a classic pre-ransomware access pattern. Detection: monitor for bulk file-access events tied to a single user account in insurance management platforms; alert on anomalous data staging and exfiltration (large outbound transfers from management servers). Hardening: enforce MFA and privileged-access review for insurance admin platforms; conduct data-minimisation audits on policyholder record stores.
    ch_eu_nexus: "US domestic; no direct CH/EU nexus, but relevant to European insurance sector defenders tracking credential-compromise → bulk-exfiltration patterns"
    public_sector_nexus: "indirect — private insurance sector"
    sector: "insurance, finance"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "AssuranceAmerica Managing General Agency LLC is notifying more than 1.1 million individuals in seven states about a data security incident"
        attribution: "databreaches.net"
        source_url: "https://databreaches.net/2026/06/28/assuranceamerica-breach-may-have-affected-more-than-1-1-million-people-in-seven-states/"
      - quote: "The incident occurred on March 16 and 17, 2026, when a targeted attack on a single employee resulted in data exfiltration"
        attribution: "databreaches.net"
        source_url: "https://databreaches.net/2026/06/28/assuranceamerica-breach-may-have-affected-more-than-1-1-million-people-in-seven-states/"
    extended_notes: |
      The 90-day gap between incident (March 16-17) and notifications (late June) is notable — the file review completion date of June 15 suggests the organisation required three months to scope the breach, consistent with insurance sector norms but longer than GDPR's 72-hour notification window. Affected US states are all high-privacy-standard jurisdictions with mandatory notification laws. The SSN/Tax ID exposure creates identity theft risk requiring credit monitoring offers to affected individuals. No evidence of ransomware deployment or dark-web data posting reported at time of disclosure.

