items:
  - title: "StrikeShark: Chinese-nexus loader deploys Cobalt Strike via Perfect DLL Hijacking and API hook-based evasion"
    sources:
      - url: "https://securelist.com/strikeshark-campaign/120326/"
        publisher: "Kaspersky Securelist"
        date: "2026-06-24"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/new-sharkloader-malware-deploys-cobalt.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed (filtered 2026-06-27+ items) → THN article 2026-06-26 17:49 IST (12:19 UTC) — outside 36h window BUT Kaspersky primary from 2026-06-24; NOTE: THN article is outside strict 36h window (cutoff 2026-06-27T16:00Z); item DEMOTED — included as contextual, recency borderline"
    recency_note: "Primary (Kaspersky 2026-06-24) and corroborating (THN 2026-06-26 12:19 UTC) both outside strict 36h window. Demoted to coverage_gap or contextual only — DO NOT include as primary finding."
    status: "DEMOTED_OUTSIDE_WINDOW"
    summary: |
      Kaspersky published a detailed analysis of the StrikeShark campaign on June 24, documenting a previously undocumented
      loader called SharkLoader that delivers Cobalt Strike Beacon. The actor (assessed as Chinese-speaking, low confidence,
      no prior APT cluster match) gained initial access by exploiting a wide range of known vulnerabilities in internet-facing
      appliances: Microsoft Exchange (CVE-2021-26855 ProxyLogon, CVE-2022-41082), Openfire (CVE-2023-32315), GeoServer
      (CVE-2024-36401), F5 BIG-IP (CVE-2023-46747), Fortinet FortiOS (CVE-2024-21762, CVE-2022-40684), Cisco IOS XE
      (CVE-2023-20198), and others. The loader implements a novel "Perfect DLL Hijacking" technique that bypasses the Windows
      loader lock by directly manipulating undocumented loader structures (LdrpLoaderLock, LdrpWorkInProgress) to release
      the critical section before thread creation, avoiding the standard thread-in-loader-lock deadlock that defeats naive
      DLL injection. SharkLoader DLLs use Blowfish-ECB and AES-128 encryption; the encrypted beacon payload is stored as
      a file with the PE header stripped. Post-loading, 30+ API hooks are installed via Microsoft Detours to redirect
      VirtualAlloc/VirtualProtect/CreateProcess to NT direct syscalls (bypassing user-mode API monitoring), stub ETW event
      writers (EtwEventWrite, EventWriteEx) to suppress telemetry, and hook Sleep to flip Cobalt Strike Beacon memory from
      RWX to RW between execution cycles (defeating memory-scan based detection). PPID spoofing redirects child process
      creation to svchost.exe. Targets include diplomatic and government entities across Indonesia, Taiwan, Lebanon, Syria,
      Colombia, North Macedonia, Nepal, and Serbia.
    ch_eu_nexus: "global; Serbia and North Macedonia (EU candidate states) among confirmed victims"
    public_sector_nexus: "direct — government and diplomatic entities confirmed victimised"
    sector: "government, diplomatic, software development"
    cves: [CVE-2021-26855, CVE-2022-41082, CVE-2023-32315, CVE-2024-36401, CVE-2023-46747, CVE-2024-21762, CVE-2023-20198]
    actors_campaigns_malware: ["SharkLoader", "StrikeShark", "Cobalt Strike Beacon"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "SharkLoader implements Perfect DLL Hijacking to bypass the Windows loader lock by resolving undocumented loader structures LdrpLoaderLock and LdrpWorkInProgress"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/strikeshark-campaign/120326/"
      - quote: "SyncRes.dat installs 30+ API hooks via Microsoft Detours redirecting VirtualAlloc/VirtualProtect to NT direct syscalls and stubbing ETW event writers"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/strikeshark-campaign/120326/"
    extended_notes: |
      Detection vantage: Sysmon EID 7 (image loaded) for SystemSettings.dll loaded into SystemSettings.exe; Sysmon EID 10
      (process access) for the loader lock manipulation pattern; EDR telemetry for direct NT syscall stubs (no ntdll trampoline
      — look for syscall stubs that do not originate from ntdll.dll address space); Windows Security EID 4688 with parent
      image SystemSettings.exe spawning svchost.exe (PPID spoof). The ETW hook-stub pattern is detectable by ETW provider
      integrity checks (Elastic, CrowdStrike, SentinelOne all hook at kernel ETW callback level above user-mode stubs).
      MITRE: T1190 (initial access via public-facing app), T1574.001 (DLL side-loading via SystemSettings.exe),
      T1562.001 (ETW impair-defenses — EtwEventWrite stubbing), T1055.012 (process hollowing / direct syscall injection),
      T1134.004 (PPID spoofing to svchost.exe).

  - title: "AI coding-agent indirect prompt injection via DNS TXT payload: Mozilla 0DIN 'Clone This Repo and I Own Your Machine'"
    sources:
      - url: "https://0din.ai/blog/clone-this-repo-and-i-own-your-machine"
        publisher: "Mozilla 0DIN"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/clean-github-repo-tricks-ai-coding-agents-into-running-malware/"
        publisher: "BleepingComputer"
        date: "2026-06-27"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/news/security/clean-github-repo-tricks-ai-coding-agents-into-running-malware/ (2026-06-27 14:22 UTC, in-window) → primary: Mozilla 0DIN blog https://0din.ai/blog/clone-this-repo-and-i-own-your-machine (2026-06-15, outside window — BC coverage is the in-window source)"
    recency_note: "BleepingComputer coverage (2026-06-27 14:22 UTC) is in-window. Underlying research published 2026-06-15. Related but distinct from CVE-2026-12957 (Amazon Q MCP config — covered 2026-06-27)."
    status: "INCLUDE"
    summary: |
      Mozilla's Zero Day Investigative Network (0DIN) published research on a multi-stage indirect prompt injection attack
      targeting AI coding agents such as Claude Code. A malicious GitHub repository contains three cooperating components:
      (1) clean, plausible setup instructions directing the user to install a Python package; (2) the package itself, which
      is designed to fail at runtime, emitting an error message that instructs the runtime to execute `python3 -m axiom init`;
      (3) the `axiom init` handler, which issues a DNS TXT lookup to an attacker-controlled domain and executes the returned
      record value as a shell command. The attack chain achieves three levels of indirection — error message → DNS resolution
      → shell execution — with no malicious code present in the repository itself (passing naive static analysis). The agent
      never "decides" to open a shell; it interprets each step as normal error recovery. The technique exploits the agent's
      tendency to autonomously execute suggested remediation commands, bypassing explicit user approval on each sub-step. No
      CVE has been assigned; the attack is a class of agentic behaviour-exploitation rather than a single software vulnerability.
      Defenders operating environments where AI coding agents have repository access (CI/CD pipelines, developer workstations
      with Claude Code / GitHub Copilot Workspace / Cursor) should treat this as a supply-chain risk requiring agent permission
      controls, mandatory human-in-the-loop for network-dependent init steps, and DNS monitoring for TXT record queries
      originating from agent processes.
    ch_eu_nexus: "global; relevant to Swiss public-sector and private-sector DevOps teams using AI coding assistants"
    public_sector_nexus: "indirect — public-sector DevOps / developer workstations using AI coding agents"
    sector: "software development, CI/CD, developer tooling"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Claude Code never decided to open a shell. It decided to fix an error. The reverse shell is three indirection steps away from anything Claude Code actually evaluated"
        attribution: "Mozilla 0DIN"
        source_url: "https://0din.ai/blog/clone-this-repo-and-i-own-your-machine"
      - quote: "A seemingly benign GitHub repository contains three components: clean setup instructions, a Python package that triggers an error message, and an initialization command that fetches and executes a DNS TXT record controlled by attackers"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/clean-github-repo-tricks-ai-coding-agents-into-running-malware/"
    extended_notes: |
      This is the second AI coding-agent supply-chain research item in two consecutive days (2026-06-27 covered Amazon Q
      Developer CVE-2026-12957 — MCP config auto-load). The techniques are complementary: the Amazon Q issue exploited
      automatic MCP server config loading; this 0DIN issue exploits agentic error-recovery autonomy with out-of-band payload
      retrieval. Both attack classes are relevant to any AI coding agent that can run shell commands. Detection: DNS monitoring
      for TXT record queries originating from developer-tooling process trees (node, python, pip) during repository setup;
      EDR parent-child chain for agent process spawning unexpected shell children; network egress monitoring for DNS TXT
      RR types from developer workstations. Hardening: enforce interactive-mode or human-in-the-loop for every external
      network call made by agent-executed init scripts; treat DNS TXT query capability as requiring explicit scope approval.
      MITRE: T1566 (phishing via malicious repo link in job posting / tutorial), T1071.004 (DNS — C2 via TXT record),
      T1059.004 (Unix shell execution via agent-driven error recovery).

  - title: "KDDI email platform breach exposes up to 14.22 million email credentials across six Japanese ISPs"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
        publisher: "BleepingComputer"
