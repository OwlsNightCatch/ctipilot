        publisher: "SecurityAffairs"
        date: "2026-06-28"
        role: "corroborating"
      - url: "https://infosecurity-magazine.com/news/kddi-breach-japanese-telcos/"
        publisher: "Infosecurity Magazine"
        date: "2026-06-28"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/ (2026-06-28 14:13 UTC, in-window) → corroborating: SecurityAffairs https://securityaffairs.com/194387/data-breach/kddi-data-breach-impacts-up-to-14-2-million-email-accounts-at-six-isps.html (2026-06-28) → underlying KDDI disclosure ~2026-06-24 (japantimes.co.jp — HTTP 402 paywall)"
    recency_note: "English-language coverage peaked 2026-06-28 (in-window). Underlying KDDI corporate announcement ~2026-06-24. The Register first English coverage ~2026-06-24 (outside window). BleepingComputer June 28 coverage constitutes an in-window source."
    status: "INCLUDE"
    summary: |
      Japanese telecommunications provider KDDI disclosed that attackers exploited vulnerabilities in third-party software
      integrated into its centralised ISP email management platform, gaining unauthorised access detected on approximately
      June 17, 2026. The breach potentially exposed email addresses and passwords for up to 14.22 million subscriber accounts
      across six ISPs operating on the shared platform: STNet, KDDI Web Communications, JCOM, Chubu Telecommunications,
      Nifty, and Biglobe. KDDI stated some passwords were stored in hashed or encrypted form; the 14.22 million figure is
      a worst-case estimate pending forensic completion. No specific CVE for the exploited third-party software vulnerability
      has been publicly disclosed. The incident illustrates the credential-exposure risk profile of managed shared-service
      email platforms where a single vulnerable dependency serves multiple ISP tenants. For Swiss and European defenders,
      the relevant threat model is the subsequent credential-stuffing risk: compromised email credentials from ISP-managed
      mailboxes propagate directly into phishing-as-initial-access campaigns targeting EU public-sector users whose external
      communication addresses are on ISP-managed domains.
    ch_eu_nexus: "indirect — Japanese breach; risk to EU/CH defenders via credential-stuffing and phishing using leaked email credential pairs"
    public_sector_nexus: "indirect — email credential theft enables phishing against public-sector users"
    sector: "telco, ISP, managed email services"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "KDDI said its investigation found that a threat actor exploited vulnerabilities in third-party software integrated into the email management system"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
      - quote: "The breach potentially exposed email addresses and passwords for up to 14.22 million subscriber accounts across six ISPs"
        attribution: "SecurityAffairs"
        source_url: "https://securityaffairs.com/194387/data-breach/kddi-data-breach-impacts-up-to-14-2-million-email-accounts-at-six-isps.html"
    extended_notes: |
      No CVE for the third-party software vulnerability has been disclosed. The shared-platform architecture (multiple ISP
      tenants on one email management system) is the key amplifier: a single vulnerability in the shared dependency produced
      a multi-ISP blast radius. Relevance to Swiss defenders: KDDI email credentials will appear in credential-stuffing
      lists and dark-web markets; priority for defenders monitoring external-facing authentication systems for anomalous
      login patterns from Japanese ISP email address spaces. Sector: telco/ISP managed email — the attack surface is the
      third-party ISP email management platform, not individual end-user mail clients.

