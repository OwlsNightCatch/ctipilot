        source_url: "https://threats.wiz.io/all-incidents/cryptojacking-campaign-targeting-k8s-clusters"
      - quote: "The vulnerability allows any authenticated user to achieve remote code execution (RCE) on the server by creating a pull request with a malicious branch name that injects the --exec flag into git rebase during the 'Rebase before merging' merge operation. A fix is available in Gogs 0.14.3, released June 7, 2026."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
    extended_notes: |
      Confidence rated MEDIUM rather than HIGH because: (1) the Wiz Threat Research entry is a threat-landscape tracker page rather than a full technical write-up, and the primary researcher attribution is not stated; (2) the Rapid7 Gogs disclosure dates to May 28 (before the campaign activity window), so the link between CVE-2026-52806 and this specific K8s campaign is stated by Wiz but not independently corroborated by a second source covering the combined Gogs+Argo+K8s pivot. No named threat-actor cluster is attributed. The campaign scope (thousands of hosts, 300+ nodes) is from the Wiz tracker and not independently validated. Defenders in EU public-sector environments running Gogs or Argo Workflows should prioritise patching regardless.

      Note on Gogs default-config risk: Gogs defaults to `DISABLE_REGISTRATION = false` and `MAX_CREATION_LIMIT = -1`, meaning any internet-facing instance with open registration allows an external attacker to self-register and immediately weaponize CVE-2026-52806 without needing existing credentials. ~1,141 internet-facing instances visible on Shodan at Rapid7 disclosure time; internal deployments likely much larger.

