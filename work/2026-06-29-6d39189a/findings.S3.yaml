      - url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
        publisher: "Rapid7 Labs"
        date: "2026-05-28"
        role: "corroborating"
        note: "Primary Gogs CVE-2026-52806 disclosure; referenced as exploitation vector in campaign"
      - url: "https://github.com/argoproj/argo-workflows/security/advisories"
        publisher: "Argo Workflows maintainers (GitHub GHSA)"
        date: "2026-06-10"
        role: "corroborating"
        note: "Argo Workflows security advisories index confirming known vulnerabilities used as access vector"
    discovery_trace: "first seen at: wiz-blog RSS feed, URL https://www.wiz.io/api/feed/cloud-threat-landscape/rss.xml → primary: Wiz Threat Research incident page, URL https://threats.wiz.io/all-incidents/cryptojacking-campaign-targeting-k8s-clusters (last edited Jun 28 2026) → corroborating: Rapid7 Labs Gogs CVE-2026-52806 disclosure URL https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
    summary: |
      A cryptojacking campaign active June 13-23, 2026 compromised thousands of Linux hosts, with primary focus on large managed Kubernetes clusters. Attackers combined two initial-access paths: (1) vulnerabilities in Argo Workflows (including the incomplete-fix chain tracked via GHSA-3775-99mw-8rp4 / CVE-2026-31892 covering ArtifactGC.PodSpecPatch bypass of Strict/Secure templateReferencing) and (2) CVE-2026-52806, a CVSSv4 9.4 argument-injection RCE in Gogs (all versions prior to 0.14.3) where a malicious pull-request branch name injects `--exec` into `git rebase`, running arbitrary commands as the Gogs server process. Once inside a cluster node, attackers stole Kubernetes service account tokens and used them to schedule workloads on over 300 additional nodes, achieving lateral movement via privileged container escape (T1611). Deployed payloads included cryptominers and data exfiltration tooling (T1496, T1041). The Wiz incident entry designates actor as "Unknown"; the C2 framework used is "Realm C2". Gogs patch (0.14.3) was released June 7, 2026; Argo Workflows patched CVE-2026-31892 incomplete-fix in June 10 advisory. The Wiz incident page was finalised and last edited June 28, 2026, indicating fresh confirmation/closure of the campaign scope.

      Technique mapping: T1190 (Exploit Public-Facing Application — Argo Workflows, Gogs), T1078.004 (Cloud Accounts — stolen K8s service account tokens), T1610 (Deploy Container — cryptominer workloads), T1611 (Escape to Host — privileged container escape), T1496 (Resource Hijacking — cryptomining), T1041 (Exfiltration over C2 Channel).

      Detection posture: Defenders should monitor for unexpected Argo Workflow submissions from non-standard service accounts (Argo audit logs, K8s API server audit log `verb=create, resource=workflows.argoproj.io`), `git rebase` child processes spawned by the Gogs service user, Kubernetes API calls to `POST /api/v1/namespaces/{ns}/pods` from unexpected service account tokens (K8s audit log event `objectRef.resource=pods, user.username != expected`), and container escape indicators (Sysmon EID 1 with parent namespace mismatch, `kubectl exec` from unusual callers, `nsenter`/`chroot` in container context). Hardening: upgrade Gogs to 0.14.3 or set `DISABLE_REGISTRATION = true` and `MAX_CREATION_LIMIT = 0`; apply complete Argo Workflows patch chain including June 10 GHSA-48p8-g2fx-3wwm; audit K8s RBAC to eliminate default service accounts with cluster-admin or node-escalation permissions; disable privileged containers via Pod Security Admission (enforce: restricted).
    ch_eu_nexus: "Global; K8s and DevOps infrastructure widely deployed by EU public-sector organisations; Gogs used in some government and research-institution internal git hosting; Argo Workflows common in data-pipeline and CI/CD contexts"
    public_sector_nexus: "indirect — self-hosted Gogs and Argo Workflows instances in research institutions and government CI/CD pipelines are within scope"
