    extended_notes: |
      No attacker named, no confirmed record count, no confirmed exfiltration (vs. mere access) — all explicitly left open by Salt as of 2026-09-14. The ambiguity over whether "peripheral system" means an internal Salt system or a connected third-party/partner system is unresolved by any source; do not assume a supply-chain vector. Distinct from Salt's unrelated May 2026 DDoS-driven fixed-line outage (swisscybersecurity.net, 2026-05-18), which is a separate, already-concluded incident and not part of this item. Given the CI-operator reporting duty and the scale of the dark-web listing (~1.09M records, per Brinztech, unconfirmed by Salt), this is worth a follow-up check in a later fire for a record-count confirmation, an EDÖB/FDPIC filing reference, or a named attacker/vector.
