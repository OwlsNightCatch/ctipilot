  - title: "Salt (Swiss mobile operator) confirms misuse of existing access to a 'peripheral system'; up to 1.09 million customer records reportedly at risk"
    sources:
      - { url: "https://www.blick.ch/wirtschaft/persoenliche-informationen-betroffen-salt-bestaetigt-moegliches-datenleck-was-wir-wissen-und-was-nicht-id22252605.html", publisher: "Blick", date: "2026-09-12", role: "primary" }
      - { url: "https://www.20min.ch/story/datenleck-salt-bestaetigt-moeglichen-sicherheitsvorfall-viele-fragen-offen-103631643", publisher: "20 Minuten", date: "2026-09-11", role: "primary" }
      - { url: "https://www.watson.ch/schweiz/mobile/695101274-datenleck-salt-bestaetigt-vorfall-kunden-berichten-von-anrufen", publisher: "Watson", date: "2026-09-12", role: "corroborating" }
      - { url: "https://www.ad-hoc-news.de/wissenschaft/salt-sicherheitsvorfall-1-09-millionen-kundendaten-gefaehrdet/70089442", publisher: "ad-hoc-news.de", date: "2026-09-11", role: "corroborating" }
      - { url: "https://www.inside-it.ch/salt-warnt-vor-moeglichem-datenleck-20260914", publisher: "Inside IT Switzerland", date: "2026-09-14", role: "corroborating (continuing Swiss trade-press coverage in-window; article body itself returned HTTP 429 on every transport tried, RSS teaser only)" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS item 'Salt warnt vor möglichem Datenleck', published 2026-09-14T12:40:24Z) → article body 429'd on every transport (extract/jina, bridge url, direct) → pivot via WebSearch (\"Salt Schweiz Datenleck Kunden Cybervorfall\") → primary: Blick, URL https://www.blick.ch/wirtschaft/persoenliche-informationen-betroffen-salt-bestaetigt-moegliches-datenleck-was-wir-wissen-und-was-nicht-id22252605.html → corroborating: 20 Minuten, URL https://www.20min.ch/story/datenleck-salt-bestaetigt-moeglichen-sicherheitsvorfall-viele-fragen-offen-103631643 → corroborating: Watson, URL https://www.watson.ch/schweiz/mobile/695101274-datenleck-salt-bestaetigt-vorfall-kunden-berichten-von-anrufen"
    summary: |
      Salt, Switzerland's second-largest mobile network operator (a telecom designated as critical-infrastructure and subject to Switzerland's 24-hour cyber-incident reporting duty to BACS), confirmed to Swiss press on 2026-09-11/12 a security incident it characterizes as "indications of misuse of an existing access to a peripheral system" (Hinweise auf die missbräuchliche Nutzung eines bestehenden Zugangs zu einem "peripheren System") rather than a hack or unauthorized intrusion into its core systems. Salt spokesperson Viola Lebel states the affected access was immediately secured and that this peripheral system had only limited data reach. Potentially affected data: customer first/last names, postal addresses, mobile numbers, dates of birth and email addresses; Salt explicitly states passwords, banking data and customer usage/transaction records were not affected. Salt has declined to confirm or deny a breach-tracking portal's (Brinztech) figure of roughly 1.09 million customer records offered for sale on the dark web from around late August 2026, and has not disclosed the misuse window, whether data was actually copied/exfiltrated (vs. merely viewed), or the identity of any attacker. Salt states it has informed affected customers and "the responsible authorities." Customers are already reporting a rise in unsolicited/fraudulent phone calls since the disclosure, consistent with abuse of leaked phone numbers for vishing. Coverage continues in-window via Inside IT Switzerland (2026-09-14).
    region_nexus: "Switzerland (direct) — Salt is a nationwide Swiss mobile network operator regulated as critical telecom infrastructure with a mandatory 24h incident-reporting duty to the Federal Office for Cybersecurity (BACS)"
    primary_sector_nexus: "indirect — Salt is a widely-used telecom supplier to Swiss residents and organizations including public-sector staff; the personal-data exposure (name/DOB/address/phone/email) creates a vishing/phishing enablement risk against its subscriber base"
    sector: "telecommunications"
