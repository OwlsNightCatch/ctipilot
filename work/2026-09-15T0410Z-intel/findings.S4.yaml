    summary: |
      The French commune of Bruguières (Haute-Garonne) announced that Familea, the shared SaaS "portail famille" platform it uses for parent/family administrative services, was hit by a cyberattack; Familea's hosting provider cut all external access to the platform's servers as a precautionary containment measure while investigating. No data exfiltration has been announced and the shutdown is explicitly framed as preventive; no attacker or ransomware group has been named. Familea serves roughly 1,600 municipalities, associations and private structures across France with over 5,000 deployed licenses, so the blast radius, if the compromise turns out to be at the shared-platform level rather than Bruguières-specific, could extend to many other French local governments — a supplier/shared-SaaS concentration-risk pattern directly analogous to shared e-government platforms used by Swiss cantonal/communal administrations.
    region_nexus: "France (out-of-nexus) — no Swiss involvement; included on a shared-municipal-SaaS-provider concentration-risk basis"
    primary_sector_nexus: "indirect — French communal government nexus, structurally analogous to Swiss communal e-government shared-service platforms"
    sector: "public-sector (municipal, France)"
