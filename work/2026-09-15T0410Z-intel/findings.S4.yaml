  - title: "Familea (French municipal family-services SaaS platform, ~1,600 client collectivities) confirms a cyberattack on its provider; portals for at least one commune (Bruguières) forced offline as a precaution — no data-theft or actor confirmed yet"
    sources:
      - { url: "https://www.cyberattaque.org/familea-bruguieres-cyberattaque-les-portails-familles-inaccessibles/", publisher: "Cyberattaque.org", date: "2026-09-14", role: "primary" }
