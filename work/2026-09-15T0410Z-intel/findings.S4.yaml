      - quote: "Nach Angaben des Unternehmens handelt es sich bei dem Vorfall ausdrücklich nicht um einen Hackerangriff im herkömmlichen Sinne."
        attribution: "ad-hoc-news.de"
        source_url: "https://www.ad-hoc-news.de/wissenschaft/salt-sicherheitsvorfall-1-09-millionen-kundendaten-gefaehrdet/70089442"
