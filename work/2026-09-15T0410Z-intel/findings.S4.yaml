    summary: |
      The store already carries this finding as entry 2026-09-13/revolut-fake-government-request-kyc-breach (published from TechCrunch's 2026-09-12 primary). This item is an update candidate only, surfaced because entities/registry.yaml already carries the matching key (incident:revolut-fake-government-request-breach-2026-09) and prior_coverage.json confirms the entry exists. Two potential deltas found this run: (1) fresh, independent Admiralty-B corroboration (BleepingComputer, Help Net Security, Malwarebytes Labs, all 2026-09-14) beyond the original TechCrunch-only sourcing; and (2) an unconfirmed claim, relayed by Help Net Security/Malwarebytes from a Telegram post by on-chain investigator ZachXBT and Reddit chatter, that a group is now leaking data "purportedly belonging to VIP clients" and demanding payment — this is social-media-sourced and NOT independently confirmed by Revolut or any Admiralty A/B outlet as of this run, so it fails PD-6 on its own and should be carried, if at all, explicitly hedged as an unconfirmed claim, not a fact. Separately, this run found that the underlying technique — a criminal using a compromised or spoofed law-enforcement/government email domain to submit a fraudulent "emergency data request" and obtain user data without a warrant — is a known, named fraud class (FBI warning, 2024; TechCrunch, Bitdefender, Kodex reporting) that has previously hit Meta, Apple, Google, Snap, Twitter/X and Discord, and is now sold as a criminal service (~$100 for how-to kits, $1,000-$3,000 per successful request per 2024-2026 reporting); Revolut is a new fintech victim of an already-productized technique class, which may be worth adding as historical/background context to the existing entry.
