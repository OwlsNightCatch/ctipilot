    summary: |
      Cisco's PSIRT disclosed CVE-2026-76461 (CVSS 3.1 9.8, CWE-89) on 2026-09-14: a SQL injection
      in the email-parsing logic of AsyncOS for Cisco Secure Email Gateway (ESA), reachable by an
      unauthenticated remote attacker who sends a single crafted email containing malicious SQL
      statements through the device. Successful exploitation executes arbitrary SQL statements that
      in turn execute arbitrary OS commands with root privileges on the underlying operating system
      — Cisco's own detection guidance instructs administrators to grep mail_logs for the pattern
      "COPY.*TO PROGRAM", which points at the same PostgreSQL COPY-TO-PROGRAM OS-command-execution
      primitive documented in other 2026 SQLi-to-RCE chains (e.g. Sangoma Switchvox CVE-2026-9586;
      this parallel is this agent's own technical inference from Cisco's published grep pattern, not
      a Cisco statement). Cisco states plainly: "In September 2026, the Cisco PSIRT became aware of
      active exploitation of this vulnerability," and that the flaw "was found during the resolution
      of a Cisco TAC support case" — i.e. discovered through a real customer compromise, not
      internal testing. There is no workaround; the only fix is upgrading. All Cisco Secure Email
      Gateway physical and virtual appliances are affected regardless of configuration; Cisco Secure
      Email and Web Manager and Secure Web Appliance are confirmed NOT affected. Fixed in AsyncOS
      15.5.5-014 (for 15.5 and earlier), 16.0.4-302 (for 16.0), and 16.5.0-780 (for 16.5, the release
      Cisco "strongly recommends" migrating to). Cisco has already upgraded all Secure Email Cloud
      instances and directly contacted Cloud customers on whose devices indicators of compromise
      were found. CISA added the CVE to its Known Exploited Vulnerabilities catalog on 2026-09-14
      with an unusually aggressive three-day remediation due date (2026-09-17) and flagged it for
      Forensic Triage Requirements. The same day, Cisco published a companion "Security Hardening
      Release" advisory for the same product line bundling five further internally-discovered
      vulnerability classes it found via internal review "as well as frontier AI models" — path
      traversal (CVE-2026-76440, CVSS 9.8), improper access control (CVE-2026-76441, CVSS 9.8),
      uncontrolled resource consumption (CVE-2026-20353, CVSS 9.8), an injection-class CWE-707
      grouping (CVE-2026-76443, CVSS 9.8, the same CWE class as the exploited flaw, though Cisco
      states this grouped CVE is not itself known to be exploited) and an input-validation issue
      (CVE-2026-76442, CVSS 7.5) — all patched in the identical software releases (also
      15.5.5-006/16.5.0-429 for Secure Email and Web Manager). Administrators upgrading against
      CVE-2026-76461 close all six CVEs with the same action.
