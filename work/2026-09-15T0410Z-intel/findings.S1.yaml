    extended_notes: |
      Priority set to critical: unauthenticated remote root RCE on an internet-facing mail
      gateway, confirmed active exploitation (Cisco PSIRT direct statement + CISA KEV + ENISA EUVD
      exploitedSince 2026-09-14), CVSS 9.8, no workaround, and CISA's unusually short 3-day KEV
      remediation window (added 2026-09-14, due 2026-09-17) versus KEV's normal ~2-3 week window
      for non-ransomware-linked entries — signalling CISA assesses urgency above the median KEV
      addition. Cisco's disclosure that the flaw was found "during the resolution of a Cisco TAC
      support case" (i.e. a real customer's compromise investigation), combined with directly
      notifying Secure Email Cloud customers where indicators of compromise were found, indicates
      Cisco has firsthand incident telemetry behind this advisory beyond a generic "aware of active
      exploitation" boilerplate. No named threat actor or cluster is given by any source checked.
      Detection: hunt mail_logs (and firewall/network logs external to the appliance, since an
      attacker with root can remove local evidence) for SQL-injection-shaped log entries,
      specifically the COPY-TO-PROGRAM pattern Cisco names; also watch for unexpected outbound
      uploads/downloads from the appliance to external IPs. Hardening: Cisco's own general
      recommendations (separate mail/management network interfaces, restrict appliance reachability
      to known hosts, disable HTTP for the admin portal, disable unneeded network services) reduce
      the appliance's exposure but do not substitute for patching, since there is no workaround for
      the SQLi itself.
    actions:
      - "Upgrade every Cisco Secure Email Gateway (physical and virtual) to AsyncOS 15.5.5-014, 16.0.4-302, or 16.5.0-780 (Cisco's recommended target) immediately — the same upgrade also closes the five companion hardening-release CVEs (CVE-2026-76440/76441/76442/76443, CVE-2026-20353) disclosed the same day."
      - "Run Cisco's published detection command against every ESA/cluster device's mail_logs — grep -i \"COPY.*TO PROGRAM\" — and cross-check firewall/network logs external to the appliance for unexpected outbound connections, since a successful exploit grants root and attackers may have removed local log evidence."
      - "For Cisco Secure Email Cloud customers: confirm directly with Cisco whether your instance is among those where indicators of compromise were identified — Cisco states it has already proactively contacted affected Cloud customers."
