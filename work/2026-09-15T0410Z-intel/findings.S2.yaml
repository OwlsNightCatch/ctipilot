    extended_notes: |
      Distinct from the unrelated 15 May 2026 Salt DDoS/landline-outage incident (netzwoche.ch/inside-it.ch,
      2026-05-18) — not previously tracked in the entity registry (grepped, no match) — this is a new, separate
      incident touching customer PII rather than availability. Mechanism remains genuinely underspecified by the
      vendor: "peripheral system" is Salt's own vague framing and could denote an internal subsidiary system, a
      third-party/outsourced CRM or marketing platform, or a partner-integration endpoint — this run found no
      source (Swiss or German-language) that resolves that ambiguity, so techniques[] is deliberately narrow
      (T1078 Valid Accounts, the only mechanism-class Salt's own wording supports: misuse of an existing/legitimate
      access grant). Do not expand to a supply-chain/third-party mapping without a source stating the system was
      externally operated. A useful follow-up angle for a later fire: whether BACS's own Cyber Security Hub or
      "Aktuelle Vorfälle" page ever publishes a Salt-specific bulletin (checked fresh this run via jina — no mention
      as of 2026-09-14) and whether Salt or a regulator later confirms record count / exploitation window.
