    discovery_trace: "first seen at: inside-it-ch (essential S2 source), RSS item \"Salt warnt vor möglichem Datenleck\" (https://www.inside-it.ch/salt-warnt-vor-moeglichem-datenleck-20260914) fetched via https://www.inside-it.ch/rss.xml on 2026-09-14 — the article body itself returned the same persistent Vercel/jina 429 \"Security Checkpoint\" condition already logged against this host on the open coverage-backlog row (Insel Gruppe lead) → pivoted via WebSearch (\"Salt Schweiz Datenleck Kunden Cybervorfall September 2026\") → primary: Salt's own customer notice, URL https://www.salt.ch/fr/datainfo → corroborated independently by 20 Minuten (URL https://www.20min.ch/story/datenleck-salt-bestaetigt-moeglichen-sicherheitsvorfall-viele-fragen-offen-103631643), Blick (URL https://www.blick.ch/wirtschaft/persoenliche-informationen-betroffen-salt-bestaetigt-moegliches-datenleck-was-wir-wissen-und-was-nicht-id22252605.html), watson.ch (URL https://www.watson.ch/schweiz/mobile/695101274-datenleck-salt-bestaetigt-vorfall-kunden-berichten-von-anrufen) and ad-hoc-news.de (URL https://www.ad-hoc-news.de/wissenschaft/salt-sicherheitsvorfall-1-09-millionen-kundendaten-gefaehrdet/70089442)."
    summary: |
      Salt Mobile SA — Switzerland's third-largest mobile network operator and, as a telecommunications provider, a
      designated critical-infrastructure operator subject to NCSC Switzerland's (BACS) 24-hour mandatory cyber-incident
      reporting obligation — confirmed on its own customer-notice page (salt.ch/fr/datainfo, dated 2026-09-11) a
      security incident after online allegations of a possible Salt customer data leak surfaced. Salt states its
      investigation ruled out an intrusion into Salt's own systems ("Ein unbefugter Zugriff auf die Systeme von Salt
      konnte ausgeschlossen werden") and instead identified misuse of an existing, already-provisioned access
      credential to a "peripheral system" ("une utilisation abusive d'un accès existant à un système périphérique") —
      Salt has not named what that peripheral system is or whether it is internally or externally operated/hosted.
      Because that system's access to Salt data is described as limited, Salt states passwords, banking details and
      customer-usage-history data cannot be affected; the personal-data categories that could be affected are limited
      to first/last name, postal address, mobile phone number, date of birth and email address. Salt notified affected
      customers and "the relevant authorities" (per 20 Minuten) but as of 2026-09-14 has not confirmed the number of
      affected individuals, the exploitation window, or whether data was actually exfiltrated/published. A dark-web
      monitoring service (Brinztech, cited by multiple Swiss outlets, itself unverified by this run) had reported in
      late August 2026 an "illegal sales campaign" for a dataset of roughly 1.09 million records attributed to Salt
      Mobile; Salt "will neither confirm nor deny" that figure. Customers report a spike in unsolicited/fraudulent
      calls referencing personal details in the days preceding disclosure. No ransomware group or named threat actor
      has claimed the intrusion; no CVE or specific initial-access vulnerability has been disclosed.
    region_nexus: "Switzerland (home region) — Salt is a Swiss-domiciled, BACS-designated critical-infrastructure telecom operator; a data-exposure event at a national mobile carrier is directly relevant to Swiss public-sector defenders both as a supplier dependency (government mobile subscriptions, emergency/administrative communications routed via Salt) and as a live illustration of the mandatory 24h critical-infrastructure incident-reporting regime in practice."
