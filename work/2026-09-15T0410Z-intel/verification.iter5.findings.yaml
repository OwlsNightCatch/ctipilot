  summary: "Same misclassification as the Salt entry, and iteration 4 explicitly propagated it here citing 'the Salt entry's already-verified convention' as the model to match -- but that convention is itself wrong per store precedent (single-source-victim, see paired finding). Set verification: single-source-victim."
- code: F8
  category: needs-more-research
  section: trending-vulnerabilities
  item: "cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
  url_or_quote: "\"Cisco shipped a companion 'Security Hardening Release' advisory ... bundling five further internally-discovered vulnerabilities that Cisco groups by CWE class ... a path-traversal grouping (CVE-2026-76440, CVSS 9.8) ...\""
  summary: "Cisco's hardening advisory (fetched this iteration) states explicitly: 'The CVSS score that is assigned to each CVE ID represents the maximum potential severity of the single most impactful underlying vulnerability within that specific CWE category' -- i.e. the identical 9.8 scores across four unrelated CWE groupings are an assigned ceiling, not four independently-confirmed 9.8 bugs. The entry drops this caveat, which a Tier 2 reader needs to correctly weigh 'five more 9.8s' against the single confirmed-exploited 9.8."
