- code: F3
  category: claim-not-supported
  section: active-threats
  item: "swiss-bitcoin-pay-neuchatel-internal-systems-breach"
  url_or_quote: "\"a Neuchâtel-based non-custodial Bitcoin payment processor used by more than 1,000 merchants across 21 countries, disclosed on its official account on 2026-09-14 that ... ([Swiss Bitcoin Pay, 2026-09-14](https://x.com/SwissBitcoinPay/status/2099473448162488618))\""
  summary: "The sentence's only citation (the X post) does not carry the 'more than 1,000 merchants across 21 countries' clause fetched verbatim from x.com/SwissBitcoinPay/status/2099473448162488618: no merchant/country count anywhere in the post. That fact belongs to the co-cited Bitcoin.com News article ('The firm's website claims the application is leveraged by more than 1,000 merchants in 21 countries.'), which is cited elsewhere in the entry but not adjacent to this clause — classic citation-adjacency splice."
- code: F4
  category: hallucinated-fact
  section: active-threats
  item: "salt-mobile-peripheral-system-data-incident"
  url_or_quote: "headline: \"Switzerland's third-largest mobile operator rules out a hack but confirms customer data exposure through a vague 'peripheral system'\""
  summary: "Headline states settled-fact exposure ('confirms customer data exposure') while every cited source hedges: Salt's own notice says the listed categories are only 'susceptibles d'être concernées' (may be concerned) and the entry's own summary correctly says 'potentially exposing'. Fetched https://www.salt.ch/fr/datainfo directly this iteration: no unhedged confirmation of exposure appears anywhere on the page. Same overstatement class iteration 4 already fixed on the Swiss Bitcoin Pay title/headline, left unfixed here."
- code: F4
  category: hallucinated-fact
  section: entities-registry
  item: "entities/registry.yaml key incident:swiss-bitcoin-pay-internal-systems-breach-2026-09"
  url_or_quote: "\"Swiss Bitcoin Pay disclosed on 2026-09-14 that a malicious user likely gained access to its internal systems, exposing customer email addresses, Bitcoin wallet addresses, IBANs, transaction history and hashed passwords...\""
  summary: "(low-moderate confidence) The registry entity's summary asserts settled 'exposing ... hashed passwords' while the now-hedged entry (post iteration-4 fix) and the primary X post both say only 'may have accessed'/'may have been accessed'. The registry record was not updated to match the entry's corrected hedging, leaving a drifted, overstated summary that feeds future runs' dedup context."
- code: F12
  category: single-source-flag-missing
  section: active-threats
  item: "salt-mobile-peripheral-system-data-incident"
  url_or_quote: "verification: multi-source / sourcing_note: \"Salt is the only party who has looked at the incident directly; every outlet cited repeats Salt's own customer notice and spokesperson statement rather than offering independent forensic assessment...\""
  summary: "The entry's own sourcing_note describes the textbook single-source-victim pattern (one assessor, several relaying publishers), but verification is set to multi-source. Store precedent for the identical pattern (entries/2026-07-29/uvvg-arad-romania-university-cyberattack-qilin-claim.md — 1 primary + 3 corroborating, all relaying one university press release — and entries/2026-08-24/reliaquest-vishing-mfa-push-device-trust-contained.md, entries/2026-08-28/suez-eau-france-supplier-breach.md, entries/2026-08-06/canton-graubuenden-sharepoint-server-breach.md) all use verification: single-source-victim for this exact shape. prompts/cti-run.md's own rule: 'Default: >=2 independent reputable sources -> verification: multi-source' — Blick/20 Minuten/watson.ch are not independent of Salt's statement, they relay it. Set verification: single-source-victim (sourcing_note can stay as-is)."
