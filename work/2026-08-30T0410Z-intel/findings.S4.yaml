items:
  - title: "Rhysida ransomware/extortion group named behind Berlin state-government (Land Berlin) network compromise — phishing access, 5.7-5.79 TB exfiltrated, EUR ~2m ransom demand, Senate refuses to pay"
    sources:
      - { url: "https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html", publisher: "Der Tagesspiegel", date: "2026-08-28", role: "primary" }
      - { url: "https://www.heise.de/news/30-Bitcoin-oder-Leak-Ransomware-Bande-erpresst-Berlin-11434325.html", publisher: "heise Security", date: "2026-08-29", role: "primary" }
      - { url: "https://www.rbb24.de/politik/beitrag/2026/08/berlin-hackerangriff-landesnetz-loesegeld-forderung-erpresser.html", publisher: "rbb24 (Rundfunk Berlin-Brandenburg, public broadcaster)", date: "2026-08-29", role: "primary" }
      - { url: "https://securityaffairs.com/198064/cyber-crime/rhysida-ransomware-group-targets-berlin-government-ahead-of-vote.html", publisher: "Security Affairs (Pierluigi Paganini)", date: "2026-08-29", role: "corroborating" }
      - { url: "https://borncity.com/news/berlin-cyberangriff-rhysida-fordert-2-millionen-euro-fuer-57-tb-daten/", publisher: "BornCity", date: "2026-08-29", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (S4 essential source, RSS), URL https://www.heise.de/security/feed.xml → article https://www.heise.de/news/30-Bitcoin-oder-Leak-Ransomware-Bande-erpresst-Berlin-11434325.html → pivot: Der Tagesspiegel (own investigative reporting, names the phishing access vector), URL https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html → pivot: rbb24 (first outlet to report the ransom demand, 27 Aug), URL https://www.rbb24.de/politik/beitrag/2026/08/berlin-hackerangriff-landesnetz-loesegeld-forderung-erpresser.html → pivot: Security Affairs (English-language synthesis citing Rhysida's own leak-site posting and the Reuters joint statement), URL https://securityaffairs.com/198064/cyber-crime/rhysida-ransomware-group-targets-berlin-government-ahead-of-vote.html → pivot: BornCity (data-category breakdown), URL https://borncity.com/news/berlin-cyberangriff-rhysida-fordert-2-millionen-euro-fuer-57-tb-daten/"
    summary: |
      This closes a gap this pipeline's coverage backlog has tracked as blocked for seven consecutive fires (state/coverage_backlog.md, opened 2026-08-20): the compromise of Berlin's shared state administrative network ("Landesnetz"), first disclosed 2026-08-17, now has both a named actor and a first-reported access vector. Der Tagesspiegel's own reporting ("Tagesspiegel-Informationen zufolge") states the attackers gained access to the state network when an employee clicked a phishing email ("Zugang zum Landesnetz verschafften sich die Täter offenbar durch den Klick eines Mitarbeiters auf eine Phishing-Mail") — the first source in this pipeline's tracking of this incident to name any access vector at all. Data exfiltration ran from at least 7 August to 12 August 2026 (a fact the Senate Chancellery itself confirmed), a week before the affected Senate departments (Mobility/Transport/Climate/Environment and Urban Development) were disconnected from the network on 14 August as a containment measure. Der Spiegel reported, and multiple German outlets (heise, Tagesspiegel, BornCity) relayed, that the ransomware group Rhysida is behind the attack; Rhysida's own Tor leak site independently posted an entry titled "Berlin, Germany" on 28 August claiming 5.79 TB of data across roughly 1.44 million files, including personal data on ~12,076 individuals (16,389 email addresses, 11,963 phone numbers, 148 IBANs), more than 5,000 personnel files, disciplinary and court records, KRITIS-related vulnerability analyses concerning Berlin's water supply, Bundesrat committee protocols, and plaintext credentials for internal systems (Security Affairs). Rhysida demanded 30 Bitcoin (~EUR 2 million) with a one-week ultimatum from Friday 28 August; Berlin's governing mayor Kai Wegner and interior senator Iris Spranger jointly confirmed the extortion attempt and publicly refused to pay ("Das Land Berlin wird sich nicht erpressen lassen"). Interior Senator Spranger states the election-relevant portion of the network is unaffected and no data has flowed from it, ahead of the 20 September Abgeordnetenhaus election. Whether the affected systems were also encrypted (not just exfiltrated) is disputed between sources: BornCity states "Experten identifizierten die Ransomware Rhysida als das Werkzeug, mit dem die Systeme verschlüsselt und die Daten entwendet wurden" (unattributed to a named expert), while Tagesspiegel and Security Affairs describe the incident only in terms of data theft and extortion without confirming encryption — this claim should be treated as unconfirmed pending an official technical disclosure. CrowdStrike is conducting the forensic investigation across all Senate departments and state agencies (multi-week effort per Tagesspiegel); Germany's BSI and the state data-protection commissioner are also involved. No indication of state-actor involvement, per Tagesspiegel's sources.
    region_nexus: "Direct DACH/home-region-adjacent nexus — a German Land (state) government network compromise, the largest cyber incident Berlin has experienced according to rbb24's own sources; transferable to Swiss cantonal/federal shared-network architectures given the single-employee-phish-to-shared-network-wide blast radius the incident demonstrates. Rhysida is a previously tracked actor in this store (registry: incident:rhysida-claims-stuttgart-municipal-data-5btc-city-denies-confirmed-incident, another German municipal target claimed May 2026), underscoring the group's sustained interest in DACH public-sector targets."
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1566, T1657]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:rhysida", type: actor, name: "Rhysida", aliases: [],
          summary: "Ransomware-as-a-service extortion group active since at least May 2023; per the November 2023 CISA/FBI/MS-ISAC joint advisory (AA23-319A, referenced via Security Affairs), Rhysida's typical initial-access techniques are compromised VPN credentials at organizations lacking MFA, exploitation of the Zerologon vulnerability (CVE-2020-1472), and phishing. Prior named victims include the British Library (2023), Chile's army, and — already tracked in this registry — a May 2026 claim against Landeshauptstadt Stuttgart (incident:rhysida-claims-stuttgart-municipal-data-5btc-city-denies-confirmed-incident, which the city denied as a confirmed incident)." }
      - { key: "incident:berlin-landesnetz-rhysida-extortion-2026-08", type: incident, name: "Berlin Land government (Landesnetz) Rhysida extortion",
          aliases: ["Berlin state network cyberattack", "Berlin Senatsverwaltung Cyberangriff"],
          summary: "Compromise of Berlin's shared state administrative network first disclosed 2026-08-17; data exfiltrated 7-12 August 2026; Rhysida claimed the attack on its leak site 28 August demanding 30 BTC (~EUR 2m), which Berlin's government publicly refused to pay. Tagesspiegel's own reporting names a phishing email click by an employee as the access vector." }
    relation_suggestions:
      - { subject: "incident:berlin-landesnetz-rhysida-extortion-2026-08", object: "actor:rhysida",
          basis: "Der Spiegel reports (relayed by heise and Tagesspiegel) that the ransomware Rhysida was used in the attack; Rhysida's own Tor leak site independently posted a 'Berlin, Germany' claim on 2026-08-28 matching the same data volume (Security Affairs, 2026-08-29). Attribution is media-sourced/self-claimed, not confirmed by Berlin authorities, who declined on 2026-08-29 to name the attackers 'aus ermittlungstaktischen Gründen'." }
    verification: MULTI-SOURCE
    confidence: HIGH
