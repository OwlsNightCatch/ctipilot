    evidence:
      - quote: "Zugang zum Landesnetz verschafften sich die Täter offenbar durch den Klick eines Mitarbeiters auf eine Phishing-Mail."
        attribution: "Der Tagesspiegel (own reporting, 'Tagesspiegel-Informationen zufolge')"
        source_url: "https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html"
      - quote: "„Das Land Berlin wird sich nicht erpressen lassen“"
        attribution: "Kai Wegner, Regierender Bürgermeister von Berlin (via Der Tagesspiegel / rbb24)"
        source_url: "https://www.rbb24.de/politik/beitrag/2026/08/berlin-hackerangriff-landesnetz-loesegeld-forderung-erpresser.html"
      - quote: "The ransomware group Rhysida claimed responsibility on its leak site August 28, posting an entry titled simply “Berlin, Germany” and claiming 5.79 terabytes of data across roughly 1.44 million files, with personal information on 12,076 individuals allegedly included."
        attribution: "Security Affairs (Pierluigi Paganini)"
        source_url: "https://securityaffairs.com/198064/cyber-crime/rhysida-ransomware-group-targets-berlin-government-ahead-of-vote.html"
      - quote: "Wie das Magazin berichtete, soll bei dem Angriff die Ransomware – also eine Schadsoftware – Rhysida verwendet worden sein."
        attribution: "Der Tagesspiegel, citing Der Spiegel"
        source_url: "https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html"
    extended_notes: |
      Detection/hardening framing for the composer: the confirmed mechanism is (1) email-based phishing reaching an end-user inbox (telemetry class: mail-flow/attachment-sandboxing logs, and endpoint process-creation events for the payload the click triggered — neither source states what ran after the click) and (2) a multi-day bulk data exfiltration (telemetry class: network egress/DLP anomaly detection for sustained high-volume outbound transfer over the 7-12 August window) that went undetected for a week before the network was isolated. The single-employee-click-to-shared-network-wide blast radius (one compromised Land ministry's network segment giving access broad enough to threaten KRITIS-adjacent water-supply vulnerability analyses and Bundesrat records held by a different department) is itself the transferable lesson for any DACH public-sector shared-network architecture: segment administrative domains so one credential/endpoint compromise cannot reach unrelated ministries' sensitive holdings. Rhysida's known (but NOT confirmed for this incident) alternate entry vectors per the CISA/FBI/MS-ISAC advisory — compromised VPN credentials without MFA, and unpatched Zerologon (CVE-2020-1472) — are the group's documented playbook and worth a hygiene check (MFA on all remote access, Zerologon patch/secure-channel enforcement verified) independent of what caused this specific intrusion. The encryption-vs-exfiltration-only question is a live discrepancy between BornCity (claims encryption) and every other source (describes only data theft/extortion) — recommend NOT asserting T1486 Data Encrypted for Impact until an official/technical source confirms it; I have deliberately left it out of `techniques[]`.
    borderline: false

  - title: "ShinyHunters breaches McKesson (largest US pharmaceutical distributor) via vishing → compromised Okta SSO → Salesforce/Snowflake exfiltration; $55.2m ransom demand, help-desk-impersonation domain pattern"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/", publisher: "BleepingComputer (Lawrence Abrams)", date: "2026-08-28", role: "primary" }
      - { url: "https://www.mckesson.com/utility/cybersecurity/customer-cybersecurity-information-center/", publisher: "McKesson Corporation (victim statement)", date: "2026-08-28", role: "primary" }
      - { url: "https://www.sec.gov/Archives/edgar/data/927653/000092765326000247/mck-20260825.htm", publisher: "McKesson Corporation SEC Form 8-K", date: "2026-08-28", role: "primary" }
      - { url: "https://cybernews.com/news/mckesson-breached-shinyhunters-claims-284m-records/", publisher: "Cybernews", date: "2026-08-29", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"ShinyHunters McKesson data breach 284 million patient records\") — surfaced from the S4 cyberinsider.com sweep, which first reported the story → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/ → primary: McKesson's own customer notice, URL https://www.mckesson.com/utility/cybersecurity/customer-cybersecurity-information-center/ → primary: McKesson SEC 8-K, URL https://www.sec.gov/Archives/edgar/data/927653/000092765326000247/mck-20260825.htm → corroborating: Cybernews, URL https://cybernews.com/news/mckesson-breached-shinyhunters-claims-284m-records/"
    summary: |
      McKesson Corporation — the largest US pharmaceutical and medical-supply distributor — discovered a cybersecurity incident on 25 August 2026 and disclosed it via a Form 8-K on 28 August; its own customer notice confirms "unauthorized access to certain third-party applications and the exfiltration of certain data" specifically affecting "a subset of customers within our Oncology & Multispecialty and Medical-Surgical business units" (McKesson, victim statement). The ShinyHunters extortion group (registry: actor:shinyhunters, alias UNC6240) told BleepingComputer it conducted voice-phishing (vishing) social-engineering calls against multiple McKesson employees, compromising their Okta single sign-on accounts, and then used that SSO access to reach McKesson's Salesforce and Snowflake environments — fully compromising Salesforce (including support cases) and exfiltrating roughly 1 TB from Snowflake over four days (21-25 August). ShinyHunters claims ~284 million Snowflake records containing patient identifiers, Social Security numbers, Medicaid numbers, medical-record numbers, medication/allergy data, and information on deceased/terminally ill patients — but clarified to BleepingComputer that this is a raw record/line count, not a unique-patient count, and that it has not yet fully analyzed the data. BleepingComputer independently learned (from a source other than ShinyHunters) that the campaign used a domain following the pattern `<company-name>[.]claims` to impersonate McKesson's help desk/IT team — a domain-registration pattern ReliaQuest's Threat Research team had already documented as a widespread ShinyHunters technique against multiple named targets (company-abbreviation + `.claims` TLD). ShinyHunters says it demanded $55,236,150 with a 72-hour deadline on 25 August and received no response or negotiation from McKesson. This is one of at least six healthcare/health-tech organizations (alongside Medtronic, DentaQuest, iRhythm, OneMedical, AdaptHealth) that BleepingComputer reports have been hit by the same ShinyHunters wave that Health-ISAC recently warned about; McKesson has not itself named ShinyHunters or confirmed any of the group's technical claims about vishing, Okta, or the specific record count.
    region_nexus: "No direct Swiss/EU nexus — McKesson is a US company and the disclosed victim scope is US business units. Included for TTP transferability (PD-11b/c): the vishing-to-Okta-SSO-to-Salesforce/Snowflake chain is a technique class directly applicable to any organization (including EU/Swiss public-sector bodies) that federates SaaS platforms behind an SSO/IdP tenant, and ShinyHunters is an already-tracked actor in this store with confirmed EU targeting history (registry: incident:odido-telecom-breach-netherlands-2026 — a nearly identical vishing-into-SSO-portal chain against a Dutch telecom operator, Feb 2026)."
    primary_sector_nexus: "no"
    sector: "healthcare"
    cves: []
    techniques: [T1566.004, T1078.004, T1657]
    affected_products: ["Okta (single sign-on / identity provider)", "Salesforce", "Snowflake"]
    entity_keys: ["actor:shinyhunters"]
    new_entities:
      - { key: "incident:mckesson-shinyhunters-breach-2026-08", type: incident, name: "McKesson ShinyHunters breach (August 2026)",
          aliases: [],
          summary: "McKesson Corporation discovered a cybersecurity incident 2026-08-25 involving unauthorized access to third-party applications and data exfiltration from a subset of its Oncology & Multispecialty and Medical-Surgical customers. ShinyHunters claims responsibility, describing vishing against employees leading to compromised Okta SSO accounts and subsequent exfiltration from Salesforce and Snowflake; ~284 million patient-related data records (not unique patients) claimed stolen, with a $55.2m ransom demand McKesson did not respond to (BleepingComputer, McKesson victim statement, SEC 8-K)." }
    relation_suggestions:
      - { subject: "incident:mckesson-shinyhunters-breach-2026-08", object: "actor:shinyhunters",
          basis: "ShinyHunters told BleepingComputer directly that it was behind the attack and described the vishing/Okta/Salesforce/Snowflake mechanism (self-claimed, not independently confirmed by McKesson, which has not named an actor)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Based on our investigation thus far, including assessments by leading cybersecurity industry experts supporting our response, we’ve confirmed that the unauthorized access to certain third-party applications and the exfiltration of certain data was associated with a subset of customers within our Oncology & Multispecialty and Medical-Surgical business units."
        attribution: "McKesson Corporation (victim statement, Francisco Fraga, EVP/CIO/CTO)"
        source_url: "https://www.mckesson.com/utility/cybersecurity/customer-cybersecurity-information-center/"
      - quote: "ShinyHunters told BleepingComputer that the vishing attacks led to the compromise of multiple employees' Okta single sign-on accounts, which they then used to access the company's Salesforce and Snowflake environments."
        attribution: "BleepingComputer (Lawrence Abrams)"
        source_url: "https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/"
      - quote: "The group says it contacted McKesson after completing the data theft on August 25 and demanded a $55,236,150 ransom, giving the company 72 hours to respond. According to ShinyHunters, McKesson did not respond to or negotiate over the ransom demand."
        attribution: "BleepingComputer (Lawrence Abrams)"
        source_url: "https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/"
    extended_notes: |
      Detection/hardening framing for the composer: telemetry class 1 is identity-provider/SSO audit logs (Okta system log) — anomalous MFA-reset or new-device-registration events immediately following a helpdesk contact, especially outside normal change-management workflow; benign lookalike is a genuine self-service password reset, discriminated by the absence of an out-of-band identity-verification step before the reset. Telemetry class 2 is SaaS/data-platform audit logs (Salesforce Setup Audit Trail, Snowflake QUERY_HISTORY/ACCESS_HISTORY) — bulk export or unusually large query volume from a newly-authenticated session. Hardening: phishing-resistant/FIDO2 MFA that vishing cannot relay, mandatory out-of-band callback verification for any helpdesk-initiated credential or MFA-factor reset, and Conditional Access policies that block new-device sign-in to high-value SaaS tenants without a secondary verification step. The domain-registration pattern ShinyHunters uses (target company name/abbreviation + the `.claims` TLD, impersonating the company's own IT/helpdesk) is described here as a technique class per ReliaQuest's own tracking, not as a specific indicator to block — no literal domain is carried in this finding per the no-IOC rule; a defender-facing brief could still usefully note that monitoring newly-registered domains under `.claims` (and other uncommon TLDs) containing the organization's own name is a cheap detection lever specific to this actor's current campaign shape.
    borderline: false

