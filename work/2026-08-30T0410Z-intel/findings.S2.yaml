      This is an update-in-substance to a story the store has never been able to publish as an entry (entity incident:berlin-landesnetz-compromise-2026-08 exists in the registry but has no entries/*.md file — confirmed by direct search of entries/ and runs/ for "landesnetz"/"berlin", which turned up only run-record mentions across 2026-08-20 through 2026-08-29, never a published entry). Recommend the main agent treat this as a genuinely new entry (novelty: new) rather than update-of, since no prior entry exists to append a changelog to — only a registry stub. Flag for the main agent: the access-vector claim is investigative-journalism sourced ("Tagesspiegel-Informationen zufolge"), not an official BSI/Senate technical disclosure, so word it as a claim, not an established fact, in the entry body. If a later run gets an on-record BSI/Senate confirmation of the phishing vector or the Rhysida attribution, that would be the changelog delta to append.
