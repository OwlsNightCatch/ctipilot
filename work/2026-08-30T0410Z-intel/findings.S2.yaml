    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → article https://www.heise.de/news/30-Bitcoin-oder-Leak-Ransomware-Bande-erpresst-Berlin-11434325.html (heise relaying Der Spiegel's Rhysida attribution and ransom-demand reporting) → pivot: WebSearch (\"Berlin Cyberangriff Rhysida Wegner Erpressung Senat\") → primary: Der Tagesspiegel's own investigative reporting, URL https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html (first source naming the phishing access vector) → corroborating: Berliner Zeitung, URL https://www.berliner-zeitung.de/article/cyberangriff-auf-berliner-senat-wegner-bestaetigt-erpressungsversuch-10337926 (independently reports Wegner's own confirmation of the extortion attempt)"
    summary: |
      The registry already tracks incident:berlin-landesnetz-compromise-2026-08 (compromise of Berlin's shared state Landesnetz, confirmed 2026-08-17, two Senate departments isolated 14-23 August) with the explicit note that no authority had named an access vector, product or CVE across seven prior research passes. Two developments in-window finally move that forward, though neither is an official authority statement — both trace to investigative journalism, not a BSI/Senate technical disclosure.
      First: Governing Mayor Kai Wegner (CDU) and Interior Senator Iris Spranger confirmed on 2026-08-28, after an extraordinary Senate session, that Berlin is the target of an active extortion attempt ("Das Land Berlin wird sich nicht erpressen lassen") — the Senate's first on-the-record acknowledgment that this is extortion, not merely a "cyberattack." Der Spiegel (relayed by heise) reports, citing "Sicherheitskreise" (security circles), that the ransomware group behind the attack is Rhysida — the same RaaS operator that hit the British Library in 2023 and claimed a Stuttgart municipal breach earlier in 2026. The demand is 30 BTC (~EUR 2 million); if unpaid, Rhysida threatens to publish roughly 5.7-5.8 TB of data via its darknet leak site, with an ultimatum running to the following Friday. Contact was made both via darknet leak-site posting and by direct personal outreach to a Berlin state secretary.
      Second and more significant for defenders: Der Tagesspiegel's own investigative reporting ("Tagesspiegel-Informationen zufolge") states plainly that "Zugang zum Landesnetz verschafften sich die Täter offenbar durch den Klick eines Mitarbeiters auf eine Phishing-Mail" — the attackers apparently gained access to the Landesnetz through an employee's click on a phishing email. This is the first access-vector claim of any kind since the incident became public on 2026-08-14, and it finally supplies a mappable ATT&CK technique (phishing-driven initial access) for what has so far been an entry the pipeline could not publish because it failed the incident-entry ATT&CK-mapping gate. The claim is NOT confirmed by the Senate or BSI — it is Tagesspiegel's own sourcing, presented without an on-record official. Authorities reportedly hold indications the actor is a group "die in der Vergangenheit durch ähnliche Attacken aufgefallen ist" (has previously drawn attention through similar attacks) — consistent with, but not an official confirmation of, the Rhysida attribution — and state there is no indication of state-actor involvement.
      Additional technical/operational detail from Tagesspiegel: data exfiltration from the Senate Department for Transport was first reported internally on 7 August 2026, but the department was not disconnected from the network until 14 August — a 7-day gap the Senate has not explained. A second, separate data-exfiltration event was confirmed on 26 August in the Senate Department for Mobility, Transport, Climate Protection and Environment, with the Senate Chancellery unable to rule out personal or other non-public data being affected. Between 100,000 and 200,000 individual records were copied in total, including roughly 80,000 administrative-offense (Ordnungswidrigkeiten) case files, 46,500+ contracts, materials described as touching critical-infrastructure documentation, emergency plans, judiciary records, and close to 6,000 files of login credentials. CrowdStrike is conducting the technical investigation across every Senate department and state agency network-wide (a scan the Tagesspiegel source expects to take "several more days"), and staff report continuing operational degradation weeks after the two affected departments were nominally reconnected on 23 August — including many employees now working over private internet connections because the corporate network remains impaired, which the reporting itself flags as a new, self-inflicted security exposure. Interior Senator Spranger stated the election environment (Abgeordnetenhaus vote) is unaffected and no election-relevant data has been exfiltrated.
      Defender relevance for this constituency: this is a shared, cross-departmental government network (a "Landesnetz" architecture closely analogous to a Swiss cantonal or federal shared administrative network) compromised via user-driven phishing, with a week-plus dwell time before detection/containment and the exfiltration of documents in categories (critical-infrastructure inventories, emergency/continuity plans, judiciary material) that would be equally damaging if held by a Swiss cantonal or federal administration. The extended remediation timeline (two weeks post-containment and the network still degraded enough to push staff onto unmanaged private connections) is itself a transferable lesson on incident-response planning for shared-network government IT.
