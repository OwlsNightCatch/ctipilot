  - title: "CVE-2026-45585 'YellowKey' — Windows BitLocker bypass via WinRE autofstx.exe; physical-access zero-day, no permanent patch yet, TPM+PIN mitigates current PoC"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585", publisher: "Microsoft MSRC", date: "2026-05-20", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12574", publisher: "NCSC-CH Security Hub", date: "2026-05-14", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0165", publisher: "NCSC-NL", date: "2026-05-20", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/05/20/yellowkey-bitlocker-mitigation-cve-2026-45585/", publisher: "Help Net Security", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12574 → primary: Microsoft MSRC, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585 → corroborating: NCSC-NL CSAF, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0165"
    summary: |
      CVE-2026-45585, publicly named YellowKey, is a BitLocker security-feature-bypass in the Windows Recovery Environment (WinRE). Disclosed by researcher Chaotic Eclipse (Nightmare-Eclipse), the vulnerability is located in the autofstx.exe component loaded by WinRE's BootExecute processing path. An attacker with physical access and the ability to boot into WinRE (or modify the EFI partition/USB) places specially crafted FsTx files, which triggers autofstx.exe to spawn a command shell with unrestricted access to the BitLocker-protected volume — without requiring the BitLocker PIN or TPM validation. The NCSC-CH advisory notes that the flaw "is not in the encryption itself, but in the recovery environment that surrounds BitLocker." A public PoC is available on GitHub (github.com/Nightmare-Eclipse/YellowKey). Affected platforms: Windows 11 24H2, 25H2, 26H1 (x64), Windows Server 2025 and Server Core 2025 — Microsoft has not released a permanent patch. Microsoft's interim remediation requires manually modifying the WinRE image on each device to remove the autofstx.exe BootExecute value, then re-sealing the image. Switching from TPM-only to TPM+PIN configuration mitigates the currently public PoC (researcher states an unpublished workaround may bypass this). Exploitation status: PoC available, no confirmed in-the-wild abuse as of disclosure. For EU public-sector environments, this is relevant to laptop deployments with encrypted drives (field staff, mobile workers, sensitive-data endpoints) where physical theft or border seizure scenarios are modelled in the threat profile.
    ch_eu_nexus: "affects all Windows 11 and Windows Server 2025 deployments across Switzerland and the EU; particularly relevant for mobile workforce and classified-data environments where physical access threat is modelled"
    public_sector_nexus: "direct — Windows-deployed governments, field agencies, law enforcement, defence with BitLocker-protected endpoints"
    sector: "government, defence, finance, healthcare"
    cves: [CVE-2026-45585]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Microsoft is tracking the YellowKey flaw under CVE-2026-45585 and shared mitigation measures to defend against potential attacks."
        attribution: "NCSC-CH Security Hub (update 20.05.2026)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12574"
      - quote: "De kwetsbaarheid betreft een security feature bypass in Windows, bekend als 'YellowKey'. Er is een proof of concept beschikbaar die aantoont hoe de kwetsbaarheid kan worden misbruikt. De kwetsbaarheid zit niet in de encryptie zelf, maar in de herstelomgeving die BitLocker omringt."
        attribution: "NCSC-NL (translation: The vulnerability is a security feature bypass in Windows, known as 'YellowKey'. A PoC is available demonstrating how the vulnerability can be exploited. The flaw is not in the encryption itself, but in the recovery environment surrounding BitLocker.)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0165"

  - title: "ICO fines South Staffordshire Water £963,900 — Cl0p ransomware phishing → 20-month dwell → 633,887 records exfiltrated; enforcement signals tougher UK utility cyber oversight"
    sources:
      - { url: "https://ico.org.uk/action-weve-taken/enforcement/2026/05/south-staffordshire-plc-and-south-staffordshire-water-plc/", publisher: "UK ICO", date: "2026-05-11", role: "primary" }
      - { url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/", publisher: "UK ICO News", date: "2026-05-11", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/05/11/ico-south-staffordshire-cyberattack-fine/", publisher: "Help Net Security", date: "2026-05-11", role: "corroborating" }
    discovery_trace: "first seen at: ico-uk enforcement bridge (sitemap), URL https://ico.org.uk/action-weve-taken/enforcement/2026/05/south-staffordshire-plc-and-south-staffordshire-water-plc/ → WebSearch confirmed: ICO news release URL https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/ → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/05/11/ico-south-staffordshire-cyberattack-fine/"
    summary: |
      The UK ICO issued a £963,900 (approx. €1.1M) penalty on 7 May 2026 against South Staffordshire Plc and South Staffordshire Water Plc for infringement of Articles 5(1)(f) and 32(1) of UK GDPR, arising from a 2022 ransomware intrusion attributed to Cl0p. The attack chain began with a successful phishing email against South Staffordshire's IT infrastructure in approximately September 2020. The attacker maintained persistent access through the environment for approximately 20 months before escalating to domain administrator privileges in May 2022 and extracting the personal data of 633,887 customers. Key ICO findings documented in enforcement action: only 5% of the IT environment was monitored; active use of Windows Server 2003 (end of support since 2015); unpatched critical systems with inadequate vulnerability management; and limited privilege-separation controls that enabled the escalation to domain administrator. The breach triggered Cl0p's ransomware deployment and ultimately resulted in the data appearing on the dark web. South Staffordshire made an early admission of liability, receiving a 40% penalty reduction from the original calculated sum. This enforcement outcome is significant for EU regulators and public-sector IT defenders: it documents the full ICO evidentiary standard for inadequate monitoring coverage, legacy OS retention, and absent vulnerability management in critical national infrastructure, establishing precedent applicable to NIS2 supervisory proceedings under ENISA and EU member-state CAs.
    ch_eu_nexus: "UK enforcement action; directly relevant to EU NIS2 enforcement framework, OFEV/ENSI Swiss critical infrastructure operators, and any water/energy utility operating under NIS2"
    public_sector_nexus: "direct — critical national infrastructure enforcement, applicable to water, energy, and public utility operators across the EU"
    sector: "utilities, water, critical infrastructure"
    cves: []
    actors_campaigns_malware: ["Cl0p"]
