  - title: "TeamPCP 'Mini Shai-Hulud' npm/PyPI worm — first supply chain attack with valid SLSA Build Level 3 provenance; NHS England issues first government alert; 170+ packages, 500M+ downloads at risk"
    sources:
      - { url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem", publisher: "StepSecurity", date: "2026-05-11", role: "primary" }
      - { url: "https://isc.sans.edu/diary/rss/32994", publisher: "SANS ISC (Kenneth Hartman)", date: "2026-05-18", role: "corroborating" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12558", publisher: "NCSC-CH Security Hub", date: "2026-05-12", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12558 → primary: StepSecurity, URL https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem → corroborating: SANS ISC, URL https://isc.sans.edu/diary/rss/32994 → corroborating: WebSearch confirmed NHS England alert at https://digital.nhs.uk/cyber-alerts/2026/cc-4781"
    summary: |
      Beginning 2026-05-11 at 19:20 UTC, the TeamPCP threat cluster deployed the Mini Shai-Hulud worm, publishing 84 malicious npm artifacts across 42 @tanstack packages in approximately six minutes, including @tanstack/react-router (~12M weekly downloads). The worm propagated to packages from Mistral AI, UiPath, OpenSearch, Guardrails AI, and others, reaching approximately 170 compromised npm and PyPI packages with combined cumulative downloads exceeding 500 million. This is the third TeamPCP compromise of Checkmarx in three months (Checkmarx Jenkins AST plugin version 2026.5.09, exposure window 2026-05-09 01:25 to 2026-05-10 08:47 UTC, was the concurrent campaign strand). The defining novelty of this wave is that malicious versions carried valid SLSA Build Level 3 provenance attestations — the attacker never stole npm credentials, instead hijacking TanStack's legitimate CI/CD pipeline's trusted OIDC identity mid-workflow, making the provenance attestation genuine. This invalidates "has valid provenance attestation" as a sufficient integrity check. The credential-harvesting payload targets GitHub Actions runner process memory (via /proc/{pid}/mem on Linux), AWS IMDSv2 IAM role credentials, ECS/Fargate task credentials, local HashiCorp Vault socket, over 100 file paths covering cloud credentials, SSH keys, git config, AI tool configs, crypto wallets, and VPN configs, plus all GitHub Actions workflow secrets. Persistence hooks inject into .vscode/tasks.json (folderOpen task) and .claude/settings.json (SessionStart hook). A destructive payload fires with 1-in-6 probability on systems matching Israeli or Iranian locales, performing rm -rf ~/. A dead-man switch in a monitoring service revokes GitHub tokens and triggers the wipe if tokens are revoked without first sanitising the host. CVE-2026-45321 assigned (CVSS 9.6 per THN; GHSA-g7cv-rxg3-hmpx per Snyk). NHS England issued government alert CC-4781. CISA issued no public advisory. Remediation: pin and lockfile-verify exact dependency hashes; do not rely on provenance attestation alone; audit .vscode/tasks.json and .claude/settings.json on developer endpoints.
    ch_eu_nexus: "global supply chain attack; European development organisations, research institutions, and public-sector DevOps teams using TanStack/React, UiPath automation, or Mistral AI integrations are in scope; NHS England government alert directly relevant to EU public-sector CI/CD posture assessment"
    public_sector_nexus: "indirect — targets developer workstations and CI/CD pipelines; public-sector development shops using affected packages at risk"
    sector: "technology, government, healthcare, finance"
    cves: [CVE-2026-45321]
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "this is the first documented npm supply chain attack shipping malware with valid SLSA Build Level 3 provenance attestations"
        attribution: "SANS ISC (Kenneth Hartman, citing Wiz, StepSecurity, Snyk)"
        source_url: "https://isc.sans.edu/diary/rss/32994"
      - quote: "NHS England issued the campaign's first government alert; CISA stayed silent."
        attribution: "SANS ISC (Kenneth Hartman)"
        source_url: "https://isc.sans.edu/diary/rss/32994"
