  - title: "Cisco Secure Workload CVE-2026-20223 — CVSS 10.0 unauthenticated Site Admin API access via internal REST endpoints, SaaS and on-prem; no workaround"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-csw-pnbsa-g8WEnuy", publisher: "Cisco PSIRT", date: "2026-05-20", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12588", publisher: "NCSC-CH Security Hub", date: "2026-05-21", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/05/21/cisco-serves-up-yet-another-perfect-10-bug-with-secure-workload-admin-flaw/5244012", publisher: "The Register", date: "2026-05-21", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12588 → primary: Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-csw-pnbsa-g8WEnuy → corroborating: The Register, URL https://www.theregister.com/security/2026/05/21/cisco-serves-up-yet-another-perfect-10-bug-with-secure-workload-admin-flaw/5244012"
    summary: |
      CVE-2026-20223 (CVSS 10.0 Critical) is an authentication bypass in the internal REST APIs of Cisco Secure Workload (formerly Tetration), a microsegmentation platform used in enterprise data centre and cloud environments. The flaw is rooted in insufficient validation and authentication when accessing internal REST API endpoints — Cisco's description confirms "an attacker could exploit this vulnerability if they are able to send a crafted API request to an affected endpoint." A successful exploit grants the remote unauthenticated attacker Site Admin privileges, allowing cross-tenant access, read of sensitive configuration data (including policy and workload telemetry), and modification of tenant configurations across isolated environments. The vulnerability affects both SaaS-hosted and on-premises deployments of Secure Workload Cluster Software. Attack vector is NETWORK, complexity LOW, no authentication required, no user interaction — the full CVSS 10.0 profile. There are no workarounds; Cisco remediated SaaS deployments automatically. On-prem targets must upgrade: version 4.0 → 4.0.3.17; version 3.10 → 3.10.8.3; version 3.9 and earlier must migrate to a supported release. Exploitation status is unknown as of disclosure (2026-05-20 / 2026-05-21 NCSC-CH advisory). Public-sector data-centre deployments running Secure Workload on-prem for microsegmentation should treat this as high-priority given the zero-auth, CVSS-max profile.
    ch_eu_nexus: "global; Cisco Secure Workload is deployed in EU enterprise and public-sector data centres for microsegmentation — on-prem deployments require manual remediation"
    public_sector_nexus: "indirect — microsegmentation platform used in critical infrastructure and large-org data centres"
    sector: "government, finance, telco, healthcare, critical infrastructure"
    cves: [CVE-2026-20223]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
