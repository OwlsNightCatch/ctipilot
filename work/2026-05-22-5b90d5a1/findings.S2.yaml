  - title: "Microsoft Incident Response: HPE Operations Agent / HPOM trusted-channel intrusion — third-party IT provider compromise enabling 123-day dwell, malicious network provider DLL on DC, LSA password filter, ngrok C2"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/", publisher: "Microsoft Security Blog / DART", date: "2026-05-12", role: "primary" }
    discovery_trace: "first seen at: msft-ti (Microsoft Security Blog RSS feed, msft-secblog bridge), URL https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/ → primary (no pivot needed, this is the DART incident report itself)"
    summary: |
      Microsoft Incident Response's DART team published a detailed anatomy of a 123-day intrusion conducted entirely through legitimate trusted channels — no exploit-based initial access, no novel malware. Initial access was via a compromised third-party IT services provider that had management delegation over the victim's HPE Operations Manager (HPOM) / HPE Operations Agent (HPE OA) infrastructure monitoring platform (MITRE ATT&CK T1199 Trusted Relationship). The threat actor executed VBScripts (abc003.vbs) through HPOM directly onto domain controllers and web servers, blending with routine automation. Key TTPs documented: (1) Credential interception — mslogon.dll registered as a Windows network provider on the domain controller by adding it to the HKLM\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order Notification Package key; NPLogonNotify and NPPasswordChangeNotify APIs captured cleartext credentials during interactive sign-in and password change, writing them to C:\Users\Public\Music\abc123c.d. (2) Password filter — passms.dll registered in the LSA Notification Packages registry value; PasswordFilter() API captured all credentials during password changes at LSASS level, double-encoded (Base64 + custom), written to C:\ProgramData\WindowsUpdateService\UpdateDir\Ipd. (3) Exfiltration — msupdate.dll transferred captured credentials via SMB to remote shares (filename icon02.jpeg for stealth) and via SMTP with subject "Update Service." (4) Persistence and lateral movement — Errors.aspx and modified Signoff.aspx web shells on internet-facing web servers; ngrok tunnels deployed on internal servers with outbound internet access, exposing RDP via encrypted channels bypassing perimeter firewall. (5) Discovery — VBScripts performed AD enumeration without requiring EDR-visible process chains. Dwell: 123 days from first access to IR engagement. The victim's web servers lacked EDR, making forensic reconstruction of web shell origin uncertain. Applicable detection: hunt for unsigned DLLs in HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages (Sysmon EID 13, registry value modification) and HKLM\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order (same); alert on ngrok.exe process creation (Sysmon EID 1); alert on outbound SMB to non-domain hosts. Hardening: require signed DLLs for LSA notification packages (Credential Guard); enforce third-party management access through Privileged Access Workstations with just-in-time access rather than persistent delegation.
    ch_eu_nexus: "global; intrusion pattern directly applicable to EU public-sector environments using outsourced IT management with HPOM/SCOM/similar enterprise monitoring platforms — a common model in Swiss federal IT, German state IT, and EU institutions"
    public_sector_nexus: "direct — third-party IT outsourcing model is ubiquitous in EU public sector; HPE OA/HPOM is deployed across large government IT environments"
    sector: "government, finance, critical infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: "SINGLE-SOURCE — MICROSOFT-DART-INCIDENT-REPORT (national CERT / vendor primary IR disclosure carve-out applies)"
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The threat actor, operating HPOM, executed VBScripts on multiple servers, including the web server and a domain controller."
        attribution: "Microsoft Incident Response (DART)"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"
      - quote: "The threat actor registered a legitimate network provider named mslogon on the domain controller DC01 through the same HP OA to hijack the authentication process."
        attribution: "Microsoft Incident Response (DART)"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"
      - quote: "passms.dll, was registered in the Windows authentication process by adding it to the Local Security Authority (LSA) notification package configuration"
        attribution: "Microsoft Incident Response (DART)"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/undermining-the-trust-boundary-investigating-a-stealthy-intrusion-through-third-party-compromise/"

  - title: "Fortinet FortiAuthenticator CVE-2026-44277 (CVSS 9.8) and FortiSandbox CVE-2026-26083 (CVSS 9.1) — unauthenticated RCE via Web UI / API; no exploitation observed"
    sources:
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-128", publisher: "Fortinet PSIRT", date: "2026-05-13", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12569", publisher: "NCSC-CH Security Hub", date: "2026-05-13", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12569 → primary: Fortinet PSIRT FG-IR-26-128 at https://fortiguard.fortinet.com/psirt/FG-IR-26-128"
    summary: |
      Fortinet released patches on 2026-05-13 addressing two critical vulnerabilities in network security appliances widely deployed across EU public sector and financial services. CVE-2026-44277 (CVSS 9.8, CWE-284 Improper Access Control) affects FortiAuthenticator, the enterprise multi-factor authentication and identity management appliance: an unauthenticated remote attacker can exploit this via a crafted HTTP request to the management API or Web UI to execute arbitrary OS commands with the privileges of the application. CVE-2026-26083 (CVSS 9.1, CWE-306 Missing Authorization) affects FortiSandbox and FortiSandbox PaaS: the same attack pattern — unauthenticated HTTP request to the Web UI — enables arbitrary code execution. Both require only network access to the management interface; no authentication or prior foothold is needed. Exploitation status: unknown as of advisory publication. Vendor patches are available for both products; NCSC-CH and CERT-FR both published in-window advisories. Defenders should prioritise patching or restricting management interface access (firewall rules or administrative VLAN segregation) for both products, particularly for FortiAuthenticator deployments, which sit in MFA critical paths — a compromised FortiAuthenticator can be leveraged to bypass MFA enforcement entirely or generate fraudulent tokens.
    ch_eu_nexus: "Fortinet products are heavily deployed across EU public sector, defence, banking and telecoms; FortiAuthenticator is a common MFA infrastructure component in Swiss government and EU institutions"
    public_sector_nexus: "direct — FortiAuthenticator is used for public-sector MFA and identity management; FortiSandbox for email and file detonation"
    sector: "government, finance, defence, telco"
    cves: [CVE-2026-44277, CVE-2026-26083]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Unauthenticated attackers can achieve full system compromise by executing unauthorized commands via specially crafted HTTP requests to vulnerable management interfaces."
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12569"

  - title: "SAP May 2026 Patch Day — CVE-2026-34260 SQL injection in S/4HANA (CVSS 9.6) and CVE-2026-34263 unauthenticated RCE in Commerce Cloud (CVSS 9.6)"
    sources:
      - { url: "https://support.sap.com/en/my-support/knowledge-base/security-notes-news/may-2026.html", publisher: "SAP Security Notes", date: "2026-05-12", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12565", publisher: "NCSC-CH Security Hub", date: "2026-05-12", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12565 → primary: SAP Security Notes May 2026, URL https://support.sap.com/en/my-support/knowledge-base/security-notes-news/may-2026.html"
    summary: |
      SAP's May 2026 Security Patch Day included two critical-severity vulnerabilities relevant to EU public-sector ERP environments. CVE-2026-34260 (CVSS 9.6) is a SQL injection in SAP S/4HANA: an authenticated attacker with basic access can inject arbitrary SQL into database queries, leading to unauthorized access to sensitive ERP data including financial records, supplier/contract data, personnel records, and procurement information. CVE-2026-34263 (CVSS 9.6) is a missing authentication check in SAP Commerce Cloud: an unauthenticated remote attacker can reach service endpoints directly and execute arbitrary server-side code — no authentication required. The NCSC-CH advisory noted that CVE-2026-34263 requires only network access to the vulnerable services. Both require vendor patches; no workarounds are specified. SAP S/4HANA is deployed extensively as the ERP backbone of Swiss federal departments, German state governments, and EU institutions; Commerce Cloud is used by government e-procurement portals and public-facing citizen service portals. Defenders in SAP environments should apply May 2026 security notes immediately, prioritising CVE-2026-34263 due to its zero-auth RCE profile.
    ch_eu_nexus: "SAP is the dominant ERP platform for Swiss federal agencies, cantonal governments, and EU institutions; both flaws are directly relevant to public-sector ERP operators"
    public_sector_nexus: "direct — SAP S/4HANA is deployed across Swiss and EU governments as the primary ERP/financial management system"
    sector: "government, finance, ERP"
    cves: [CVE-2026-34260, CVE-2026-34263]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation allows attackers to gain unauthorized access to sensitive database information, execute arbitrary server-side code, or compromise the availability of affected enterprise applications."
        attribution: "NCSC-CH Security Hub"
