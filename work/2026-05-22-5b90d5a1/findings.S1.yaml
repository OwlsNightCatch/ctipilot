    discovery_trace: "first seen at: msrc bridge (msrc release 2026-May filtered for baseScore>=9.0) → three CVSS 10.0 cloud-service CVEs added 2026-05-21 → per-CVE detail via msrc cve for each"
    summary: |
      The May 2026 Patch Tuesday release (published 2026-05-21) includes three CVSS 10.0 cloud-service vulnerabilities, all already mitigated server-side by Microsoft with no action required by customers:

      - CVE-2026-42901 (Microsoft Entra ID Elevation of Privilege, CVSS 10.0, CWE-346 Origin Validation Error): An unauthenticated network attacker can elevate privileges in Entra ID. This is a cloud-side flaw; Microsoft has applied the remediation. Per the "Toward greater transparency: Unveiling Cloud Service CVEs" initiative, Microsoft published it to provide visibility.

      - CVE-2026-47280 (Azure Resource Manager Elevation of Privilege, CVSS 10.0): No user action required; Microsoft has fully mitigated server-side.

      - CVE-2026-23652 (Microsoft Power Pages Remote Code Execution, CVSS 10.0): Cloud-only, already remediated by Microsoft.

      Additionally, CVE-2026-40411 (Azure Virtual Network Gateway RCE, CVSS 9.9) and CVE-2026-42823 (Azure Logic Apps EoP, CVSS 9.9) were also addressed in this release, all cloud-side with no customer action required.

      Context: While CVSS 10.0 values look alarming, these cloud CVEs follow the transparent-disclosure pattern and carry no customer-side patch requirement. The practical value is awareness for organizations leveraging ENTRA/Azure RM/Power Pages in their zero-trust architecture reviews. No exploitation detected; not in CISA KEV at time of writing.
    ch_eu_nexus: "EU cloud consumers of Microsoft Azure / Entra ID / Power Pages / Azure Resource Manager."
