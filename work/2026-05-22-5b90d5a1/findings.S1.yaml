items:
  - title: "CISA KEV: Langflow CORS/token-hijack chain (CVE-2025-34291) and Trend Micro Apex One directory traversal (CVE-2026-34926) added 2026-05-21 — both exploited in the wild"
    sources:
      - url: "https://www.cisa.gov/news-events/alerts/2026/05/21/cisa-adds-two-known-exploited-vulnerabilities-catalog"
        publisher: "CISA"
        date: "2026-05-21"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2025-34291"
        publisher: "NVD/NIST"
        date: "2026-05-21"
        role: "corroborating"
      - url: "https://www.jpcert.or.jp/english/at/2026/at260014.html"
        publisher: "JPCERT/CC"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://www.hkcert.org/security-bulletin/trend-micro-apex-one-multiple-vulnerabilities_20260522"
        publisher: "HKCERT"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://success.trendmicro.com/en-US/solution/KA-0023430"
        publisher: "Trend Micro"
        date: "2026-05-21"
        role: "vendor"
    discovery_trace: "first seen at: cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (catalogVersion 2026.05.21) → CVE-2025-34291 dateAdded 2026-05-21 → NVD primary for Langflow, URL https://nvd.nist.gov/vuln/detail/CVE-2025-34291; CVE-2026-34926 dateAdded 2026-05-21 → JPCERT primary alert URL https://www.jpcert.or.jp/english/at/2026/at260014.html → HKCERT corroborating URL https://www.hkcert.org/security-bulletin/trend-micro-apex-one-multiple-vulnerabilities_20260522"
    summary: |
      CISA added two CVEs to its KEV catalog on 2026-05-21 with a June 4 remediation deadline for federal agencies.

      CVE-2025-34291 (Langflow, CVSS 4.0: 9.4 / CVSS 3.1: 8.8): An overly permissive CORS configuration (`allow_origins='*'` with `allow_credentials=True`) combined with a `SameSite=None` refresh token cookie allows a malicious webpage to perform cross-origin requests with the authenticated user's credentials, reaching the `/api/v1/auth/refresh` endpoint and obtaining access tokens that can call all authenticated endpoints — including the code-execution functionality of the AI workflow platform. Exploitation requires only victim browser navigation to an attacker-controlled page. Active exploitation was first confirmed 2026-01-23; Trend Micro documented deployment of the Flodric botnet through compromised Langflow instances. Affected: Langflow <= 1.6.9. Fixed: Langflow 1.7.0 (default CORS policy changed) and 1.9.3 (explicit fix). Technique: `T1190 Exploit Public-Facing Application`; CORS bypass for CSRF-style token theft.

      CVE-2026-34926 (Trend Micro Apex One On-Premise, CVSS 6.7 / CWE-23 directory traversal): A pre-authenticated local attacker can traverse the server's directory to modify a key table, injecting malicious code that Apex One deploys to all managed agents. Apex One On-Premise sits in a privileged position as an enterprise-wide endpoint-security management console; a compromised console propagates attacker code to the entire managed fleet via the product's own update mechanism. JPCERT/CC confirmed exploitation in the wild on 2026-05-21. Affected: Apex One 2019 (On-Premise) server and agent builds below 17079. Fixed: server/agent build 17079, per Trend Micro KA-0023430. The SaaS variant (`Apex One as a Service`) is not vulnerable to CVE-2026-34926.

      Defender takeaways: (1) Langflow — block internet exposure of Langflow instances; enforce HTTPS-only + restrictive CORS; verify auto-update to >= 1.7.0 / 1.9.3; hunt for anomalous Python/subprocess execution spawned from the Langflow process tree (Sysmon EID 1, parent `langflow-backend` or `uvicorn`). (2) Trend Micro Apex One — patch On-Premise servers to build 17079 immediately; treat the Apex One server host as Tier 0 since it can push code to all agents; review Apex One audit logs for unexpected key-table modifications and agent-update dispatch events.
    ch_eu_nexus: "Global; EU public-sector and enterprise endpoints using Trend Micro Apex One On-Premise. Langflow increasingly deployed in AI/ML research and automation pipelines within government digital-transformation initiatives."
    public_sector_nexus: "indirect for Langflow (AI workflow automation); direct for Apex One (endpoint security platform widely used in enterprise and government)"
    sector: "all-sectors (endpoint security, AI/ML platforms)"
    cves: [CVE-2025-34291, CVE-2026-34926]
    actors_campaigns_malware: ["Flodric botnet"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
