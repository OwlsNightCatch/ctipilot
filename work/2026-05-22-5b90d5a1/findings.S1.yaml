  - title: "Cisco Secure Workload CVSS 10.0 — unauthenticated REST API allows cross-tenant Site Admin access (CVE-2026-20223)"
    sources:
      - url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-csw-pnbsa-g8WEnuy"
        publisher: "Cisco PSIRT"
        date: "2026-05-20"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/cisco-patches-cvss-100-secure-workload.html"
        publisher: "The Hacker News"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://www.theregister.com/security/2026/05/21/cisco-serves-up-yet-another-perfect-10-bug-with-secure-workload-admin-flaw/5244012"
        publisher: "The Register"
        date: "2026-05-21"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/cisco-patches-cvss-100-secure-workload.html → pivot to Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-csw-pnbsa-g8WEnuy → corroborated by The Register URL https://www.theregister.com/security/2026/05/21/cisco-serves-up-yet-another-perfect-10-bug-with-secure-workload-admin-flaw/5244012"
    summary: |
      Cisco disclosed CVE-2026-20223 on 2026-05-20, a CVSS 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) flaw in Cisco Secure Workload (formerly Tetration). The vulnerability is in access validation of internal REST API endpoints: insufficient validation allows an unauthenticated remote attacker to send a crafted HTTP request to an internal REST API endpoint and obtain Site Admin-level privileges. The attack requires no authentication, no user interaction, and no prior foothold — a single crafted API request is sufficient. A successful exploit allows the attacker to read sensitive data and make configuration changes across all tenant boundaries, effectively giving full visibility into and control over multi-tenant datacenter and cloud workload segmentation policy.

      Cisco Secure Workload is deployed on-premises in enterprise datacenters (SaaS variant is also confirmed affected). This is not the same CVE as the previously reported Cisco Catalyst SD-WAN authentication bypass (CVE-2026-20182). Cisco stated no active exploitation was observed at disclosure. Attack surface: internal REST API endpoint reachable by network-adjacent or internet-exposed deployment.

      Affected versions: Cisco Secure Workload Cluster Software 3.9.x and earlier (no fix — must migrate), 3.10.x (fix: 3.10.8.3), 4.0.x (fix: 4.0.3.17). No workaround exists; patching is the only remediation. Technique: `T1190 Exploit Public-Facing Application`.

      Defender takeaways: Immediately restrict network access to the Secure Workload REST API management plane to trusted management networks; block untrusted external access to Cisco Secure Workload's management interface. Apply patches for versions 3.10 and 4.0. Migrate from 3.9 and earlier. Enumerate API access logs for unexpected calls to Site Admin-level endpoints as a hunt signal.
    ch_eu_nexus: "Global; affects enterprises and government agencies using Cisco Secure Workload for datacenter segmentation — relevant to Swiss and EU public-sector hybrid-cloud and on-premise deployments."
    public_sector_nexus: "indirect"
    sector: "enterprise IT, datacenters, financial services, government"
    cves: [CVE-2026-20223]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
