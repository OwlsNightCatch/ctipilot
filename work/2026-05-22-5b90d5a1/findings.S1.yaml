    evidence:
      - quote: "This vulnerability is due to insufficient validation and authentication when accessing REST API endpoints. An attacker could exploit this vulnerability if they are able to send a crafted API request to an affected endpoint. A successful exploit could allow the attacker to read sensitive information and make configuration changes across tenant boundaries with the privileges of the Site Admin user."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-csw-pnbsa-g8WEnuy"

  - title: "Showboat/JFMBackdoor: Chinese espionage cluster Red Lamassu (Calypso) targeting telecoms with shared Linux/Windows implant pair since 2022 — PwC and Lumen disclosure"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-target-telcos-with-new-linux-windows-malware/"
        publisher: "BleepingComputer"
        date: "2026-05-21"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/showboat-linux-malware-hits-middle-east.html"
        publisher: "The Hacker News"
        date: "2026-05-21"
        role: "corroborating"
      - url: "https://www.darkreading.com/threat-intelligence/chinese-apts-linux-backdoor-telco-attacks"
        publisher: "Dark Reading"
        date: "2026-05-21"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/showboat-linux-malware-hits-middle-east.html → pivot to BleepingComputer primary, URL https://www.bleepingcomputer.com/news/security/chinese-hackers-target-telcos-with-new-linux-windows-malware/ → corroborated by Dark Reading, URL https://www.darkreading.com/threat-intelligence/chinese-apts-linux-backdoor-telco-attacks"
    summary: |
      PwC Threat Intelligence and Lumen Black Lotus Labs published jointly on 2026-05-21 the first full technical disclosure of Showboat and JFMBackdoor — a Linux/Windows implant pair deployed by the Chinese espionage cluster Red Lamassu (also tracked as Calypso). The campaign has targeted telecommunications providers since at least mid-2022, with confirmed victims including a Middle East ISP, an ISP in Afghanistan, and entities in Azerbaijan, the U.S., and Ukraine.

      Showboat is a modular post-exploitation ELF binary (kworker masquerade) that provides: (1) remote shell (`T1059.004 Unix Shell`), (2) bidirectional file transfer, (3) SOCKS5 proxy to tunnel traffic through compromised telco infrastructure to internal network segments (`T1090.001 Internal Proxy`), and (4) a `hide` command that retrieves payloads from external sites (Pastebin, forums) as a dead-drop resolver (`T1102.001 Dead Drop Resolver`). Showboat contacts a C2 server, gathers system information, and returns it in a PNG field as Base64-encoded encrypted data to blend with image traffic (`T1001.002 Steganography` / covert channel). C2 infrastructure includes IP addresses geolocated to Chengdu, Sichuan, consistent with patterns seen in prior Red Lamassu campaigns.

      JFMBackdoor (Windows counterpart) enables complementary persistence on Windows endpoints. The initial access vector was identified via an ELF binary uploaded to VirusTotal in May 2025; initial access likely via exploitation of public-facing services given the long-running nature of the campaign.

      Defender takeaways: Hunt for `kworker`-masquerading ELF processes with anomalous network connections to non-local IPs; review netflow/EDR telemetry for unexpected SOCKS5 tunnel establishment from Linux telecom servers; look for processes retrieving content from Pastebin-like external sites (web proxy logs filtered to text/code-hosting sites from server processes). Correlate with any prior PlugX or ShadowPad infrastructure sightings given shared C2 node pools per the PwC/Lumen analysis.
    ch_eu_nexus: "EU telco sector; campaign targets ISPs and carriers globally. EU telecom operators are within scope of Red Lamassu's documented targeting pattern."
    public_sector_nexus: "indirect — national carriers and ISPs that underpin public communications infrastructure"
    sector: "telecommunications"
    cves: []
    actors_campaigns_malware: ["Red Lamassu", "Calypso", "Showboat", "JFMBackdoor"]
