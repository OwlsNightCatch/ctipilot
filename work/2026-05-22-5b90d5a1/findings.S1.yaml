  - title: "Microsoft Defender actively exploited: CVE-2026-41091 (link-following LPE) and CVE-2026-45498 (DoS) — both confirmed exploited, out-of-band Defender engine update issued"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091"
        publisher: "Microsoft MSRC"
        date: "2026-05-19"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45498"
        publisher: "Microsoft MSRC"
        date: "2026-05-19"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/microsoft-warns-of-two-actively.html"
        publisher: "The Hacker News"
        date: "2026-05-21"
        role: "corroborating"
    discovery_trace: "first seen at: msrc bridge (msrc release 2026-May), CVE-2026-41091 exploited=Yes, publiclyDisclosed=Yes → MSRC per-CVE detail via msrc cve CVE-2026-41091 → corroborated by THN URL https://thehackernews.com/2026/05/microsoft-warns-of-two-actively.html"
    summary: |
      Microsoft confirmed active exploitation of two Microsoft Defender vulnerabilities with the 2026-05-19 out-of-band Defender engine update. Both are now publicly disclosed.

      CVE-2026-41091 (CVSS 7.8, CWE-59 Improper Link Resolution / Link Following): An authorized local attacker abuses Windows Defender's `MsMpEng.exe` service's improper symbolic-link resolution during file-system operations to elevate privileges locally to `NT AUTHORITY\SYSTEM`. Attack vector: `AV:L/AC:L/PR:L/UI:N` — requires local access with standard-user privileges, no UI interaction. This is a classic TOCTOU-style LPE abusing the privileged antimalware process. Technique: `T1068 Exploitation for Privilege Escalation`. Fixed in Defender Antimalware Platform version 4.18.26040.7. Last vulnerable version: 4.18.26030.3011.

      CVE-2026-45498 (CVSS 4.0, no CWE assigned): A local, unauthenticated attacker (`AV:L/AC:L/PR:N/UI:N`) can cause a DoS condition in the Defender engine. Attack surface is lower-risk individually but was observed exploited alongside CVE-2026-41091. Fixed in same Defender Antimalware Platform 4.18.26040.7 update. Defender distributes engine updates via Windows Update / WSUS / Intune automatically; environments with delayed auto-update or air-gapped Defender deployments are at risk.

      Defender takeaways: Verify Defender Antimalware Platform version >= 4.18.26040.7 on all endpoints via `Get-MpComputerStatus` (PowerShell) checking `AMProductVersion`. Hunt for anomalous SYSTEM-level process spawns from `MsMpEng.exe` (Sysmon EID 1, parent `MsMpEng.exe`, child token elevated). Ensure Defender definition update channels are functioning correctly (check for `4663` events on sensitive paths if SACL-enabled).
    ch_eu_nexus: "Universal Windows endpoint coverage; affects all Windows systems with active Defender Antimalware Platform."
    public_sector_nexus: "direct — Microsoft Defender is the default endpoint protection on all Windows systems including government endpoints"
    sector: "all-sectors (endpoint security)"
    cves: [CVE-2026-41091, CVE-2026-45498]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
