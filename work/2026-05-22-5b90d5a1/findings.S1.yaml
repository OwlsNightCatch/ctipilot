        attribution: "CISA KEV"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
      - quote: "Trend Micro Incorporated has reported that attacks exploiting the relative path traversal vulnerability in TrendAI Apex One(On Premise) (CVE-2026-34926) have been observed in the wild."
        attribution: "JPCERT/CC"
        source_url: "https://www.jpcert.or.jp/english/at/2026/at260014.html"
      - quote: "CVE-2026-34926 is being exploited in the wild. A pre-authenticated local attacker could modify a key table on the server to inject malicious code to deploy to agents on affected installations."
        attribution: "HKCERT"
