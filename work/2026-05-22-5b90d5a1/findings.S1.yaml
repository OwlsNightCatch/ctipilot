  - title: "Microsoft Entra ID / Azure CVE cluster: May 2026 Patch Tuesday includes three CVSS 10.0 cloud-service EoP/RCE CVEs (CVE-2026-42901, CVE-2026-47280, CVE-2026-23652) — already mitigated server-side, no customer action needed"
    sources:
