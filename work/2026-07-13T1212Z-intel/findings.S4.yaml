    summary: |
      Progress Software told all customers running ShareFile Storage Zone Controller (SZC) — the on-premises, internet-facing hybrid component that bridges ShareFile's cloud authentication plane to customer-managed storage — to manually shut down the Windows server hosting it, citing "a credible external security threat." The directive, issued 2026-07-10, disabled cloud-side account access for affected tenants as an additional precaution; per Progress's own statement there is "no indication of unauthorized access to any Progress ShareFile accounts or data" to date. Three days on (status.sharefile.com still shows the Storage Zone Controller service as non-operational and "Investigating" as of this run), Progress has disclosed neither a CVE, a root cause, nor a patch or safe-restart timeline — the shutdown-not-patch instruction is itself the signal that no fix yet exists. Only on-premises SZC deployments are affected; cloud-only ShareFile accounts are unaffected. This is the same on-prem MFT-adjacent architecture class (Citrix/Progress ShareFile, MOVEit, GoAnywhere, Cleo) that has produced mass pre-auth exploitation events before. Background: watchTowr Labs disclosed a chainable pre-auth RCE in this exact component in April 2026 — CVE-2026-2699 (CWE-698 Execution-After-Redirect auth bypass in /ConfigService/Admin.aspx, where Response.Redirect() is called with terminate=false so the "authenticated" admin code path keeps executing after the 302) combined with CVE-2026-2701 (the bypassed admin panel lets an attacker repoint the storage repository at the web root and upload a ZIP with unzip=true, which does not strip .aspx extensions, yielding a webshell) — patched in SZC 5.12.4 (2026-03-10); watchTowr counted roughly 30,000 internet-facing SZC instances at disclosure time. Progress has NOT stated whether the July "credible external threat" is connected to this chain or to any other previously reported issue — treat the two as separate facts until Progress says otherwise, but any organisation still on SZC 5.x below 5.12.4 should treat this as a compounding risk regardless.
    region_nexus: "global; on-premises SZC deployments are common in EU/CH public-sector, finance and healthcare organisations using ShareFile for managed file transfer"
