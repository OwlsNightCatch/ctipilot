      Detection/hardening framing for the composer: telemetry class is web-application-log + process-creation on the SZC host (IIS worker process spawning cmd.exe/powershell.exe, unexpected .aspx files appearing under the web root, ConfigService/Admin.aspx hits with a 302 immediately followed by admin-API calls from the same source). Hardening lever regardless of whether the July threat proves related to CVE-2026-2699/2701: confirm SZC is at 5.12.4+ (5.x branch) or on the unaffected 6.x .NET Core branch, and — per the vendor's own current instruction — take internet-facing SZC instances offline until Progress publishes a resolution. Historical parallel: Citrix (prior owner) took the same product offline in 2023 over CVE-2023-24489 (also actively exploited). This is a "watch for a material update" item — flag for a same-day follow-up entry if Progress discloses a CVE, confirms exploitation, or restores service.
