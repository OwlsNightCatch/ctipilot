    new_entities:
      - { key: "campaign:the-quarry-phaas", type: campaign, name: "The Quarry phishing-as-a-service ecosystem", aliases: [], summary: "Telegram-distributed PhaaS ecosystem run by operator 'RockyBelling', active since April 2025 and reselling Evilginx-derived AiTM/device-code phishing tooling to an estimated ~200 operators; documented by SOCRadar (2026-06) and independently corroborated by Lexfo's exposure of three of its downstream operators (2026-07-13)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker running a live Microsoft 365 phishing operation left a Python web server listening on a public port with directory listing switched on."
        attribution: "The Hacker News (citing Lexfo)"
        source_url: "https://thehackernews.com/2026/07/misconfigured-server-reveals-three.html"
      - quote: "The attack generates a real device code, wraps it in an Authenticator-themed lure page, and tells the target to enter it at the genuine microsoft.com/devicelogin."
        attribution: "The Hacker News (citing Lexfo)"
        source_url: "https://thehackernews.com/2026/07/misconfigured-server-reveals-three.html"
      - quote: "saroula01's Device Code Flow campaign ran undetected for over a year, accumulating 218 confirmed victims across 12 countries, with tokens silently auto-refreshed in the background."
        attribution: "Lexfo"
        source_url: "https://blog.lexfo.fr/opendir-to-phishing-operator.html"
      - quote: "All three operators built functional MFA-bypass infrastructure from public GitHub repositories with minimal customization, using AI-assisted development."
        attribution: "Lexfo"
        source_url: "https://blog.lexfo.fr/opendir-to-phishing-operator.html"
    extended_notes: |
      Triage-relevant framing for the composer: two distinct attack classes need two distinct defences. (1) Against Evilginx-style AiTM reverse-proxy relay: origin-bound authentication (FIDO2/passkeys) defeats session-cookie relay outright since the credential is cryptographically bound to the legitimate origin. (2) Against OAuth device-code abuse: Conditional Access policies must explicitly block the device-code authorization grant flow except for narrowly-scoped, input-constrained hardware (kiosks, IoT) that genuinely need it — device-code abuse is a distinct primitive from password/MFA phishing and is not stopped by "require MFA" policies alone, since the victim's real MFA challenge is what the operator's backend is riding on. Detection concept (telemetry class: Entra ID / Azure AD sign-in and token-issuance logs): alert on device-code grant_type token requests originating from source IPs inconsistent with the named user's normal geolocation/ASN, especially against the well-documented first-party "Microsoft Office" public client ID that legitimate device-code flows and this abuse pattern both use — the anomaly signal is the source-IP/velocity mismatch, not the client ID itself (that ID is Microsoft's own, not attacker infrastructure). No IOCs (domains/IPs/hashes/Telegram bot IDs) carried forward from the source per policy; the AI-assisted-development angle is included as a detection-relevant behavioural observation (attacker tradecraft artifacts), not as an indictment of any AI vendor.
