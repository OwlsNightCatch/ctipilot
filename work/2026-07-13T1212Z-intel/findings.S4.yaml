    summary: |
      The EU Council and the UK government announced coordinated sanctions on 2026-07-13 against Russian military- and security-service-linked cyber operators, and the UK's NCSC simultaneously published a joint advisory with 11 other countries' cyber authorities (Australia, Canada, Czech Republic, Denmark, Estonia, Finland, France, Italy, New Zealand, Poland, Sweden, plus the US) on a specific router-hunting tradecraft. The EU sanctioned 9 individuals and 4 entities; the UK separately designated 24 individuals and entities, including senior GRU figures (Vyacheslav Stafeyev, Ivan Senin, Ivan Kasyanenko) accused of directing GRU cyber/hybrid operations, IMPULS (accused of recruiting hackers from Russian universities for GRU Unit 29155's cyber division), operators tied to the Lumma Stealer infostealer (2,100+ UK victims in six months, credentials used for espionage), and Rybar LLC (state-linked disinformation/election-interference in Moldova and Armenia). The Council of the EU publicly named the FSB's 16th Centre — which it states controls several cyber threat groups including Turla (tracked here as actor:secretblizzard) — as running government- and critical-infrastructure-focused espionage against France, Germany, Poland, Cyprus, the Netherlands, Austria, Slovakia, Romania and Finland since 2010, and linked Turla to "a recent failed strike" on Poland's energy grid that could have cut power to roughly 500,000 people in winter. Attribution note (hold both, do not merge): this Turla attribution for the Poland grid incident, made today by the EU Council/UK government, sits alongside earlier reporting — ESET research cited by BleepingComputer in January 2026 — that attributed the same late-December-2025 attack on ~30 Polish energy facilities and the DynoWiper data-wiping malware used in it to a different, GRU-linked cluster, Sandworm (aka APT44/Seashell Blizzard/UAC-0113). Separately, Poland also reported blocking a cyberattack on its National Centre for Nuclear Research (NCBJ). The NCSC-led joint advisory, published the same day, names "FSB Centre 16" cyber actors (aliased across the advisory ecosystem as Berserk Bear, Energetic Bear, Crouching Yeti, Dragonfly, Ghost Blizzard and — in CISA/FBI reporting — Static Tundra) as opportunistically scanning the internet for routers configured with default or weak SNMP community strings (SNMPv1/v2 transmit these in plaintext), then using that access to exfiltrate device configurations via TFTP, and separately exploiting the seven-year-old CVE-2018-0171 in Cisco Smart Install (SMI) on end-of-life, unpatched networking gear. Targeted sectors named: communications, defence, energy, financial services, government and healthcare — directly overlapping the constituency's core and additional sectors. Mitigations recommended: migrate to SNMPv3 (or disable legacy SNMP outright), enforce strong unique device credentials, and restrict management-protocol access via ACLs.
