  - title: "Attacker's own OPSEC failure exposes three separate M365 AiTM/device-code phishing operations — AI-assisted kit development and a concrete Entra device-code hunt pivot"
    sources:
      - { url: "https://thehackernews.com/2026/07/misconfigured-server-reveals-three.html", publisher: "The Hacker News", date: "2026-07-13", role: "corroborating" }
      - { url: "https://blog.lexfo.fr/opendir-to-phishing-operator.html", publisher: "Lexfo", date: "2026-07-13", role: "primary" }
      - { url: "https://socradar.io/blog/the-quarry-phaas-irs-ssa-phishing/", publisher: "SOCRadar", date: "2026-06", role: "corroborating" }
    discovery_trace: "first seen at: hackernews (S4 slice), URL https://thehackernews.com/2026/07/misconfigured-server-reveals-three.html → primary: Lexfo research blog, URL https://blog.lexfo.fr/opendir-to-phishing-operator.html → corroborating: SOCRadar (The Quarry PhaaS ecosystem), URL https://socradar.io/blog/the-quarry-phaas-irs-ssa-phishing/"
    summary: |
      French security firm Lexfo pivoted from a single OPSEC failure — a phishing operator left a Python HTTP server (python3 -m http.server) publicly listening with directory listing enabled, and the enabling command sat in the server's readable .bash_history — into a full exposure of three independent, unrelated Microsoft 365 phishing operations, all built as customised forks of the open-source Evilginx adversary-in-the-middle (AiTM) reverse-proxy framework. Two operators ran classic AiTM credential/session-cookie relay kits (one pairing a custom bulk-mail tool with 2FA-secret/session capture against ~2 confirmed corporate victims since March 2026; a second — "red-queen" — adding Subresource-Integrity-check evasion via HTML attribute renaming and a URL-rewriting engine, with captured Microsoft ESTSAUTHPERSISTENT session cookies carrying roughly a one-year validity window). The third and largest ("black-queen") abused Microsoft Entra ID's legitimate OAuth device-code authentication flow: it requests a genuine device code from Microsoft, presents it inside a spoofed Authenticator-branded lure, and instructs the victim to enter it at the real microsoft.com/devicelogin — so the victim completes an authentic Microsoft login and MFA challenge, while the operator's backend polls the token endpoint and captures the resulting valid, MFA-satisfied access/refresh token pair with no password ever touching the phishing page. That kit ran undetected for over 13 months (June 2025-July 2026), capturing 218 distinct accounts across 12 countries, roughly 94% of them corporate mailboxes, with auto-refresh enabled on the stolen tokens (some refreshed as many as 25 times). All three kits were built with minimal customisation on top of public GitHub Evilginx forks, and Lexfo found direct evidence of AI-assisted development across all three — including verbatim leftover AI-coding-session transcripts and git commits carrying AI-model co-author metadata — illustrating how low the technical bar for a functional MFA-bypassing AiTM/device-code kit has fallen. The kits connect to a broader Telegram-distributed phishing-as-a-service ecosystem ("The Quarry", independently documented by SOCRadar in June 2026) that resells this tooling to an estimated ~200 operators.
    region_nexus: "international (12 countries); confirmed corporate victims include French organisations"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1566.002, T1557, T1539, T1528]
