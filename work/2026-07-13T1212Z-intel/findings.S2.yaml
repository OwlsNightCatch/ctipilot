          summary: "Coordinated destructive cyberattack on 29 December 2025 against 30+ Polish wind/photovoltaic grid-connection substations and a large combined heat-and-power plant serving ~500,000 customers; RTU/HMI/protection-relay firmware damage and wiper malware (blocked by EDR at the CHP plant); formally attributed to FSB Centre 16/Static Tundra by CERT Polska, UK and EU on 2026-07-13 (CERT Polska, 2026-01; NCSC-UK/UK Gov, 2026-07-13)." }
    relation_suggestions:
      - { subject: "actor:static-tundra", object: "incident:poland-energy-grid-attack-2025-12-29",
          basis: "CERT Polska: infrastructure overlap analysis 'shows a high degree of overlap with the infrastructure used by the activity cluster publicly known as Static Tundra... Berserk Bear... Ghost Blizzard... and Dragonfly' for the 29 Dec 2025 attack (CERT Polska, 2026-01, formally attributed 2026-07-13)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This reckless attack failed but could have caused 500,000 citizens to lose electricity in the depths of winter."
        attribution: "UK Government (FCDO)"
        source_url: "https://www.gov.uk/government/news/uk-and-eu-strike-russian-cyber-networks-with-new-sanctions"
      - quote: "This is, however, the first publicly described destructive activity attributed to this activity cluster."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/"
      - quote: "Static Tundra has been observed making initial access to devices via SNMP, leveraging a community string that was either compromised in a previous attack or guessed... insecure community strings of \"anonymous\" and \"public\" with read-write permissions."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/static-tundra/"
    extended_notes: |
      Detection: telemetry classes to prioritise are (1) authentication/session logs and AAA/TACACS+ logs on network devices for unexplained gaps or a drop in normal logging volume (Static Tundra tampers with TACACS+ config to blind logging); (2) SNMP traffic to/from management interfaces, watching for unexpected write operations (SetRequest with community strings, or use of CISCO-CONFIG-COPY-MIB) especially where the source IP is spoofed or inconsistent with known management stations; (3) NetFlow/traffic-profile baselining for new GRE tunnel endpoints or unexplained volumetric shifts to unfamiliar destinations; (4) unusually large or non-empty .bash_history-equivalent artifacts and unexpected local-account creation on network gear. Hardening: disable Cisco Smart Install (`no vstack`) on every device where CVE-2018-0171 cannot be patched immediately; migrate to SNMPv3 and disable SNMPv1/v2c community-string auth; enforce complex, unique community strings; disable Telnet (VTY `transport input ssh` / `transport output none`); centralise device configuration as the source of truth rather than trusting device-resident config; verify ACLs restrict all management protocols (SNMP/SSH/HTTP/NETCONF) to known management-station ranges. Especially relevant for Swiss/EU energy and telco operators given the explicit Poland-grid attribution and the advisory's direct naming of "energy" and "government" as primary target sectors.
  - title: "Swiss Armed Forces' Cyber Command migrates off Microsoft 365 to sovereign open-source OpenDesk by October, citing US CLOUD Act risk"
    sources:
      - { url: "https://www.inside-it.ch/kommando-cyber-verabschiedet-sich-von-microsoft-20260713", publisher: "Inside IT Switzerland", date: "2026-07-13", role: "primary (Swiss trade-press anchor, publication date in-window)" }
      - { url: "https://www.heise.de/en/news/Swiss-Army-breaks-with-Microsoft-Cyber-Command-relies-on-Open-Source-11361516.html", publisher: "heise online (EN)", date: "2026-07-10", role: "corroborating (fuller technical/policy detail)" }
      - { url: "https://www.republik.ch/2026/07/09/die-cyber-spezialisten-des-bundes-kehren-microsoft-den-ruecken", publisher: "Republik", date: "2026-07-09", role: "corroborating (originating investigative report, cited by heise)" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'Kommando Cyber verabschiedet sich von Microsoft', published 2026-07-13T12:13Z) → pivot: WebSearch (\"Kommando Cyber Schweiz Microsoft 365 Opendesk Cloud Act Oktober 2026\") because the inside-it.ch article itself 403'd both direct and jina-reader fetch → corroborating: heise online EN translation, URL https://www.heise.de/en/news/Swiss-Army-breaks-with-Microsoft-Cyber-Command-relies-on-Open-Source-11361516.html → originating source cited by heise: Republik, URL https://www.republik.ch/2026/07/09/die-cyber-spezialisten-des-bundes-kehren-microsoft-den-ruecken"
    summary: |
      The Swiss Armed Forces' Cyber Command and its Cyber and Electromagnetic Actions (CEA) sub-unit are migrating all workstations off Microsoft 365 onto the open-source OpenDesk suite (developed by Germany's Zentrum für digitale Souveränität/Zendis) by October 2026, per reporting picked up by the Swiss trade outlet Inside IT on 2026-07-13 (following an original investigation by Republik on 2026-07-09 and heise coverage on 2026-07-10). Cyber Command chief Simon Müller is quoted stating that as long as providers remain subject to the US CLOUD Act, Microsoft 365 is unusable "for certain military contexts," citing the risk of compelled or hidden data disclosure to US authorities. The decision draws on a 2024 Swiss law requiring federal-government bodies to make in-house authority software source-available, from which the army had previously exempted itself; Cyber Command is now voluntarily adopting the open-source line. Reporting cites parallel precedent: Austria's Bundesheer migrating to LibreOffice, and Germany's Bundeswehr IT house BWI signing a framework agreement with Zendis for OpenDesk. The Federal Chancellery is separately conducting its own feasibility study on a broader civilian migration away from M365. Swiss civil-administration trials (Zurich) found OpenDesk still has gaps versus M365 (desktop-app parity, telephony integration, migration cost clarity) that matter less for an IT-literate specialist unit running its own data centres.
