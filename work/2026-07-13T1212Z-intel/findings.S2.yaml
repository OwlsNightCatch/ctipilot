          summary: "Russian FSB Centre 16 cyber-espionage cluster specialising in long-term compromise of unpatched/end-of-life network devices (Cisco IOS Smart Install CVE-2018-0171, SNMP weak-credential abuse, SYNful Knock implant) for configuration exfiltration and persistent access; formally attributed by CERT Polska/UK/EU on 2026-07-13 to the first publicly documented destructive attack by this cluster, the 29 December 2025 sabotage of Polish wind/photovoltaic grid substations and a combined heat-and-power plant." }
