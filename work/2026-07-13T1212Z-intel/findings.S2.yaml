    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 'Progress warnt Admins: ShareFile deaktivieren', 2026-07-13) → pivot: heise EN translation, URL https://www.heise.de/en/news/Progress-warns-admins-Deactivate-ShareFile-11362439.html → pivot: WebSearch (\"Progress ShareFile Storage Zone Controller security threat shutdown July 2026\") → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/progress-urges-sharefile-customers-to-shut-down-servers-over-credible-threat/ → corroborating: TheHackerNews, URL https://thehackernews.com/2026/07/urgent-progress-tells-sharefile.html → status confirmation: Progress ShareFile Status Page, URL https://status.sharefile.com/ → technical background/prior disclosure: watchTowr Labs, URL https://labs.watchtowr.com/youre-not-supposed-to-sharefile-with-everyone-progress-sharefile-pre-auth-rce-chain-cve-2026-2699-cve-2026-2701/"
    summary: |
      Progress Software has ordered every customer running an on-premises ShareFile Storage Zone Controller (SZC) — the self-hosted IIS component that lets ShareFile's SaaS front end store files on customer-controlled storage (local filesystem, SMB, SharePoint, S3/Azure buckets) rather than Progress's cloud — to physically shut down the Windows servers hosting it, citing "a credible external security threat" first notified to customers on 2026-07-10 via email (screenshotted to r/sysadmin) and still listed as an unresolved incident on the vendor status page as of 2026-07-13. Progress states it has no indication of unauthorized account or data access but has not disclosed the technical nature of the threat, whether any SZC has been compromised, or a patch/return-to-service timeline; the mitigation offered is full shutdown, not an update, which multiple outlets read as evidence no fix currently exists. This sits on top of a pre-auth RCE chain watchTowr Labs disclosed in April 2026 in the same component: CVE-2026-2699 (CVSS 9.8) is an authentication bypass in `/ConfigService/Admin.aspx` caused by a CWE-698 Execution-After-Redirect bug — the code calls `Response.Redirect(path, false)` (the `false` suppresses `CompleteRequest`), so the admin page's body still renders and its "Join existing Zone" functionality executes even though the browser is told to redirect to the login page; from there an attacker can rewrite the `Primary Zone Controller` field without re-supplying the old passphrase. CVE-2026-2701 (CVSS 9.1) chains from that access: the `Network Share Location` field's validation (`ValidateStorageLocation`) only checks that the supplied path is writable/deletable, so an attacker can point the storage repository at the IIS webroot (e.g. `C:\inetpub\wwwroot\ShareFile\StorageCenter\documentum`) and, after working around filename-randomization/extension-stripping in the standard upload path, land an ASPX web shell for full RCE. Both were fixed in Storage Zone Controller 5.12.4 (5.x branch only; the 6.x .NET-Core branch was unaffected); watchTowr scanning found roughly 30,000 internet-visible SZC instances at disclosure time, and Shadowserver's more recent count puts ~784 still internet-exposed, concentrated in the US and Germany. Progress has not said whether the current shutdown order is driven by continued exploitation of the (patched but widely un-upgraded) CVE-2026-2699/2701 chain or a separate, undisclosed issue.
    region_nexus: "global; Shadowserver's exposure count for the underlying component concentrates in the US and Germany, giving this direct home-region relevance"
