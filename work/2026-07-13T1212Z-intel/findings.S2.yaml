    extended_notes: |
      Detection/hunt angle: since Progress has not confirmed a mechanism, defenders running SZC 5.x should treat the CWE-698 chain as the working hypothesis and hunt for (a) IIS access-log requests to /ConfigService/Admin.aspx followed by 200-status responses instead of the expected 302-with-redirect-honoured behaviour, (b) unexpected modifications to Zone/Primary-Zone-Controller/Storage-Repository configuration fields outside of change windows, (c) w3wp.exe (IIS worker process) spawning cmd.exe/powershell.exe, and (d) any .aspx file appearing under the StorageCenter webroot subdirectories (documentum, cifs, sp) that isn't part of the vendor's shipped file set. Hardening: upgrade to 5.12.4+ or migrate to the 6.x .NET-Core branch (architecturally unaffected by this chain); if the vendor's shutdown order applies to your instance, do not simply restart until Progress confirms scope — no patch has been named for the current threat as of this run.
  - title: "FSB Centre 16 (Static Tundra/Berserk Bear/Energetic Bear) router-hijacking campaign: 12-country joint advisory, formal Poland energy-grid attribution and coordinated UK/EU sanctions"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting", publisher: "NCSC-UK", date: "2026-07-13", role: "primary" }
      - { url: "https://www.gov.uk/government/news/uk-and-eu-strike-russian-cyber-networks-with-new-sanctions", publisher: "UK Government (FCDO)", date: "2026-07-13", role: "primary" }
      - { url: "https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/", publisher: "CERT Polska", date: "2026-01", role: "primary (technical incident report)" }
      - { url: "https://blog.talosintelligence.com/static-tundra/", publisher: "Cisco Talos", date: "2025-08-20", role: "background/technical (actor profile referenced by the joint advisory)" }
    discovery_trace: "first seen at: ncsc-uk, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml (item 'UK and Allies urge critical sectors to improve defences against Russian intelligence targeting', published 2026-07-13T12:00Z) → primary: NCSC-UK advisory page, URL https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting → pivot: WebSearch (\"FSB Centre 16 Static Tundra Poland energy grid attribution December 2025 sanctions July 2026\") → primary: UK Government sanctions announcement, URL https://www.gov.uk/government/news/uk-and-eu-strike-russian-cyber-networks-with-new-sanctions → primary: CERT Polska's own January 2026 incident report on the underlying attack, URL https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/ → background: Cisco Talos's original Static Tundra actor profile, URL https://blog.talosintelligence.com/static-tundra/"
    summary: |
      On 2026-07-13, NCSC-UK and 17 other agencies from 12 countries (Australia, Canada, Czech Republic, Denmark, Estonia, Finland, France, Italy, New Zealand, Poland, Sweden, US) co-sealed a joint advisory ("Improve Router Hygiene to Protect Against Russian State-Sponsored Targeting") on FSB Centre 16 — publicly tracked as Static Tundra (Cisco Talos), Berserk Bear/Energetic Bear (CrowdStrike/FBI), Ghost Blizzard (Microsoft), Dragonfly (Symantec) and Crouching Yeti — opportunistically compromising internet-facing routers and network devices across communications, defence, energy, financial services, government and healthcare sectors globally. The group's primary access vector is scanning the internet (historically via Shodan/Censys-style scan data) for devices still exposing default or weak SNMP community strings (observed values include "public" and "anonymous" with read-write permission) and, separately, aggressively exploiting the seven-year-old Cisco IOS/IOS XE Smart Install vulnerability CVE-2018-0171 on unpatched or end-of-life devices — using the exploit to enable a local TFTP server (`tftp-server nvram:startup-config`) and pull the startup configuration, which frequently discloses further credentials and SNMP strings. Once inside, the actor uses SNMP itself (sometimes with spoofed source addresses to defeat ACLs, since SNMP is connectionless) to modify running configuration, create local privileged accounts, enable Telnet, and exfiltrate device configs via the CISCO-CONFIG-COPY-MIB over TFTP/RCP; persistence has historically included the SYNful Knock Cisco IOS firmware implant (activated by a "magic packet" crafted TCP SYN), and defense evasion includes tampering with TACACS+ logging and rewriting ACLs to whitelist attacker infrastructure. Collection is achieved by standing up GRE tunnels that redirect victim traffic of interest to attacker-controlled infrastructure and by pulling NetFlow data. The same-day announcement package also included, for the first time, a formal UK/EU attribution of the destructive 29 December 2025 attack on Polish energy infrastructure to this cluster: CERT Polska's own incident report (first published January 2026, now formally attributed) describes coordinated destructive attacks against 30+ wind/photovoltaic grid-connection substations (RTUs, HMIs and protection relays had firmware damaged or system files deleted) and a large combined-heat-and-power plant supplying near half a million customers (wiper malware deployment blocked at the CHP plant by the operator's EDR before detonation); CERT Polska attributed the activity to Static Tundra/Berserk Bear/Ghost Blizzard/Dragonfly based on VPS, router and anonymizing-infrastructure overlap, and called it the first publicly documented destructive operation by this normally espionage-focused cluster. On the same day, the UK sanctioned 24 individuals/entities and the EU sanctioned 9 individuals plus 4 entities, covering GRU senior leadership, GRU Unit 29155's hacker-recruitment front company IMPULS, Lumma Stealer credential-theft operators (cited with at least 2,100 UK victims in six months), and the disinformation outlet Rybar LLC.
    region_nexus: "direct: formal attribution names a December 2025 attack on Poland's (EU member state) energy grid; the joint advisory explicitly covers EU/allied critical-infrastructure sectors and was co-sealed by France, Italy, Estonia, Finland, Sweden, Denmark, Czech Republic and Poland"
    primary_sector_nexus: "direct"
    sector: "energy, communications/telco, defence, financial services, government/public-sector, healthcare"
