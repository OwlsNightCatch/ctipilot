  - title: "FSB Centre 16 (Static Tundra / Berserk Bear) router-hygiene exploitation: joint 12-nation advisory + formal UK/EU attribution and sanctions for the Dec-2025 Poland energy-grid sabotage"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting", publisher: "NCSC-UK", date: "2026-07-13", role: primary }
