    evidence:
      - quote: "Centre 16, also known as Berserk Bear, Energetic Bear, Crouching Yeti, Dragonfly, Ghost Blizzard and Static Tundra, has been seen hunting for vulnerable routers by scanning the internet."
        attribution: "NCSC-UK"
        source_url: "https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting"
      - quote: "The UK together with EU member states has also today formally attributed the December 2025 attack on Poland's energy grid to Russia's FSB Centre 16."
        attribution: "NCSC-UK"
        source_url: "https://www.ncsc.gov.uk/news/uk-and-allies-urge-critical-sectors-to-improve-defences-against-russian-intelligence-targeting"
      - quote: "Analysis of the infrastructure used in the attack - including compromised VPS servers, routers, traffic patterns, and characteristics of anonymizing infrastructure - shows a high degree of overlap with the infrastructure used by the activity cluster publicly known as \"Static Tundra\" (Cisco), \"Berserk Bear\" (CrowdStrike), \"Ghost Blizzard\" (Microsoft), and \"Dragonfly\" (Symantec)... This is, however, the first publicly described destructive activity attributed to this activity cluster."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/"
      - quote: "The actors scan for Internet IP ranges with active Simple Network Management Protocol (SNMP) agents that accept common or default community strings for authentication"
        attribution: "NSA/CISA/FBI/DC3 joint Cybersecurity Advisory"
        source_url: "https://media.defense.gov/2026/Jul/09/2003959498/-1/-1/1/CSA_IMPROVE_ROUTER_HYGIENE.PDF"
      - quote: "This reckless attack failed but could have caused 500,000 citizens to lose electricity in the depths of winter."
        attribution: "UK Government (FCDO)"
        source_url: "https://www.gov.uk/government/news/uk-and-eu-strike-russian-cyber-networks-with-new-sanctions"
    extended_notes: |
      Suggested kind: threat (with an incident/policy facet for the attribution+sanctions angle). Mitigations stated in the joint advisory, tied to the specific mechanism: disable Cisco Smart Install on all devices; migrate to SNMPv3 with authPriv at the strongest supported encryption and disable SNMPv1/v2 (or, if legacy SNMP is unavoidable, rotate default community strings and enforce read-only); use Cisco password hashing type 8 (avoid types 0/4/7 — insecure or plaintext); monitor for logins using local (non-centralized) accounts; build a MIB allow-list and alert on inbound SNMP Set-Requests carrying the named OIDs; restrict management-protocol access via ACLs (preferably out-of-band) and deny inbound UDP/69 (TFTP), TCP/4786 (SMI), UDP 161/162 (SNMP) and TCP/UDP 10161/10162 (SNMPv3) at the edge unless mission-critical. Detection telemetry class: network flow/firewall logs for inbound SNMP Set-Requests and outbound TFTP to non-management destinations; device syslog for unexpected "config copy" / running-config-to-file events; IDS signatures keyed on the OIDs above. This item deliberately keeps the CVE list narrow (CVE-2018-0171, CVE-2008-4128) — these are the only CVEs the joint advisory itself names; the primary exploitation vector (SNMP default-credential abuse) carries no CVE by nature (misconfiguration, not a code defect).
    watchlist: []
    borderline: false

  - title: "WAGO I/O System Field devices: undocumented early-boot diagnostic interface allows unauthenticated full system compromise (CVE-2026-4769, CERT@VDE)"
    sources:
      - { url: "https://www.certvde.com/en/advisories/VDE-2026-031/", publisher: "CERT@VDE (Germany, OT/ICS coordinating CERT)", date: "2026-07-13", role: primary }
      - { url: "https://euvd.enisa.europa.eu/", publisher: "ENISA EU Vulnerability Database (EUVD-2026-43297)", date: "2026-07-13", role: corroborating }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvd.enisa.europa.eu/ (bridge: enisa-euvd recent lastvulnerabilities, entry EUVD-2026-43297 published 2026-07-13T09:31Z) → primary: CERT@VDE advisory VDE-2026-031, URL https://www.certvde.com/en/advisories/VDE-2026-031/ (no pivot needed — CERT@VDE is the coordinating national-CERT-class authority for this vendor advisory)"
    summary: |
      CERT@VDE (Germany's OT/ICS coordinating CERT, acting as CNA) published advisory VDE-2026-031 / CVE-2026-4769 on 2026-07-13 for WAGO System I/O Field series devices (model numbers 0765-110x/120x/150x/210x/2102/410x/420x/450x, all variant "/0100-0000"). Certain devices activate an undocumented internal diagnostic capability during the initial boot sequence — functionality that is not part of the publicly documented feature set — which is reachable without authentication for a brief window before the main operating environment and its security mechanisms become fully active (CWE-912 Hidden Functionality). If network access is available during that early-boot window, an unauthenticated remote attacker can interact with internal system processes normally protected during regular operation, resulting in what CERT@VDE's EUVD entry describes as "full system compromise." CVSS 3.1 vector as published: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (network-reachable, low complexity, no privileges or user interaction, high impact to confidentiality/integrity/availability); ENISA EUVD lists a CVSS 4.0 base score of 9.3. No exploitation has been reported and EPSS is listed at 0.0. WAGO has released fixed firmware per model (1.2.1.100 for 0765-110x/410x; 1.2.7.100 for 0765-120x/420x; 1.2.7.103 for 0765-150x/450x; 1.2.1.102 for 0765-2101; 1.2.5.101 for 0765-2102). WAGO I/O System Field devices are modular fieldbus I/O couplers used in industrial automation and building-management deployments, including energy and water-utility OT environments within the constituency's additional sectors.
    region_nexus: "global vendor advisory (WAGO GmbH & Co. KG, Germany); relevant to Swiss/EU industrial-automation, energy and water OT estates running these I/O couplers"
    primary_sector_nexus: "indirect — OT/ICS relevance to energy and water sectors (additional sectors), not core public-sector"
    sector: "energy, water"
    cves: [CVE-2026-4769]
    techniques: [T1190]
    affected_products: ["WAGO I/O System Field 0765-110x/0100-0000", "WAGO I/O System Field 0765-120x/0100-0000", "WAGO I/O System Field 0765-150x/0100-0000", "WAGO I/O System Field 0765-2101/0100-0000", "WAGO I/O System Field 0765-2102/0100-0000", "WAGO I/O System Field 0765-410x/0100-0000", "WAGO I/O System Field 0765-420x/0100-0000", "WAGO I/O System Field 0765-450x/0100-0000"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Certain devices in the WAGO System I/O Field series activate an internal diagnostic capability during the initial startup sequence. This functionality is not formally documented and becomes accessible without authentication for a brief period in the early boot phase. During this window, an unauthenticated remote attacker can gain access to the internal system processes, resulting in full system compromise."
        attribution: "CERT@VDE / ENISA EUVD"
        source_url: "https://www.certvde.com/en/advisories/VDE-2026-031/"
    extended_notes: |
      Suggested kind: vulnerability. No exploitation observed; included on imminent-exploitation profile (unauthenticated, network-reachable, full-compromise impact, CWE-912 hidden functionality, OT-relevant, patch available) rather than confirmed ITW activity — priority should be notable, not high/critical. Detection: OT network monitoring for unexpected connections to these devices' management/diagnostic ports coinciding with a device power-cycle/reboot event (correlate reboot/power-event logs with new inbound sessions in the same time window); hardening: apply the listed firmware updates and, until then, restrict network reachability to these devices (especially during planned maintenance reboots) via VLAN/ACL segmentation from any untrusted network segment.
    watchlist: []
    borderline: true
    borderline_reason: "moderate real-world exploitability (narrow early-boot attack window, no confirmed exploitation, EPSS 0.0) but included given unauthenticated full-compromise impact on an OT/ICS product class relevant to the energy/water additional sectors and a same-day national-CERT primary"

