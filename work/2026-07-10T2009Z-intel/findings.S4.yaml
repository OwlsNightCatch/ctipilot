      - { key: "incident:digitalmint-sygnia-ir-negotiator-blackcat-insider-2023", type: incident, name: "DigitalMint/Sygnia ransomware-negotiator insider conspiracy",
          aliases: [], summary: "Three US incident-response/negotiation professionals (two from DigitalMint, one from Sygnia) convicted for colluding with BlackCat/ALPHV affiliates 2023-2026: leaking client negotiating positions to maximize ransoms and independently deploying BlackCat against additional victims; ~$75.3M and ~$1.2M extorted respectively; $10M in assets seized from the lead defendant (DOJ, 2026-07-09)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Instead, Martino betrayed them, fed their confidential negotiating positions to ransomware criminals, and helped squeeze them for more money."
        attribution: "US Department of Justice"
        source_url: "https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison"
      - quote: "Keep denying our offers and I will let you know once I find out the max the[y] want to pay"
        attribution: "Angelo Martino, quoted by CyberScoop"
        source_url: "https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/"
      - quote: "To date, law enforcement has seized $10 million of assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat."
        attribution: "US Department of Justice"
        source_url: "https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison"
    extended_notes: |
      Framed for the S4 gate around the transferable governance lesson (criterion b): third-party ransomware IR/negotiation vendors are a trust
      boundary that can itself be compromised from the inside, not just a mitigant. Two earlier DOJ actions in this same conspiracy
      (co-conspirators Martin and Goldberg, sentenced ~May 2026) are referenced in the DOJ release's own "related" links but fall outside this
      run's 24h window — background only, not separately itemized. No Swiss/EU victim named in either the DOJ release or corroborating press;
      included solely because the lesson (vet and structurally firewall external IR/negotiation engagements — confidentiality compartmentalization,
      independent oversight of negotiator conduct, insurance-limit information hygiene) is squarely relevant to any SOC/CISO who might engage
      such a vendor, and DigitalMint/Sygnia both serve international (including European) clients.
    borderline: true
    borderline_reason: "no Swiss/EU victim or actor nexus; included for the transferable third-party-IR-vendor-trust lesson (gate criterion b) — main agent should confirm inclusion is wanted given the strict S4 gate."

