  - title: "DOJ: a DigitalMint ransomware negotiator ran a double-agent scheme against his own clients for BlackCat/ALPHV — third insider-corruption sentencing in the incident-response industry"
    sources:
      - { url: "https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison", publisher: "US Department of Justice, Office of Public Affairs", date: "2026-07-09", role: "primary" }
      - { url: "https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/", publisher: "CyberScoop", date: "2026-07-10", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/ransomware-negotiator-gets-70-months-in.html", publisher: "The Hacker News", date: "2026-07-10", role: "corroborating" }
    discovery_trace: "first seen at: cyberscoop (feed https://cyberscoop.com/feed/), URL https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/ → primary: DOJ OPA, URL https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/ransomware-negotiator-gets-70-months-in.html"
    summary: |
      DOJ announced on 2026-07-09 that Angelo John Martino III, 41, a ransomware negotiator employed by US incident-response/negotiation firm
      DigitalMint, was sentenced to 70 months for running a double-agent scheme against the very clients who hired him. Beginning April 2023,
      Martino was paid by BlackCat/ALPHV ransomware affiliates to leak his employer's clients' confidential negotiating positions and cyber-
      insurance policy limits back to the attackers — letting the ransomware operators "know once I find out the max the[y] want to pay" (DOJ
      quotes his own message) — across five victims, netting a combined $75.3M in maximized extortion. Separately, between April and November
      2023, Martino recruited a DigitalMint colleague (Kevin Tyler Martin) and a then-incident-response manager at a second IR firm, Sygnia
      (Ryan Clifford Goldberg), to independently deploy BlackCat ransomware against five additional US victims, extracting roughly $1.2–1.3M in
      Bitcoin from one; the three split the ransom and laundered it. Martin and Goldberg were already sentenced to 4 years each in an earlier
      DOJ action this year. Law enforcement has seized $10M in assets from Martino to date (crypto, vehicles, a food truck, a luxury fishing
      boat). This is now the third IR/negotiation professional convicted in this specific BlackCat-affiliated conspiracy, spanning two named
      US IR vendors (DigitalMint, Sygnia) — a pattern, not an isolated rogue employee.
    region_nexus: "US prosecution, US victim companies; the underlying risk — a hired incident-response/ransomware-negotiation vendor's own staff colluding with the attacker to inflate the ransom or independently deploy ransomware — is a generic third-party-trust exposure for any organization (including Swiss/EU CI and government bodies) that engages external IR/negotiation firms, several of which (including Sygnia) operate internationally."
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1486]
    affected_products: []
