items:
  - title: "CISA publishes its own post-mortem on the May contractor AWS GovCloud key leak — zero-trust-for-dev-environments and repo-upload EDR gating named as the fixes"
    sources:
      - { url: "https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident", publisher: "CISA (Cybersecurity and Infrastructure Security Agency)", date: "2026-07-09", role: "primary" }
      - { url: "https://cyberscoop.com/cisa-credential-leak-forensic-report/", publisher: "CyberScoop", date: "2026-07-10", role: "corroborating" }
      - { url: "https://www.infosecurity-magazine.com/news/cisa-incident-response-exposed-aws/", publisher: "Infosecurity Magazine", date: "2026-07-10", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/news/cisa-incident-response-exposed-aws/ → primary: CISA, URL https://www.cisa.gov/news-events/news/lessons-cisas-cyber-incident → corroborating: CyberScoop, URL https://cyberscoop.com/cisa-credential-leak-forensic-report/"
    summary: |
      CISA published its own after-action report on 2026-07-09 for the incident first disclosed in May 2026 (already tracked in the registry as
      incident:cisa-nightwing-contractor-aws-govcloud-keys-exposed-github, first_seen 2026-05-19): a contractor uploaded a copy of CISA's build-and-deployment
      repository — including CISA's Infrastructure-as-Code, build code, and both admin and build AWS GovCloud credentials — to a personal (non-official)
      GitHub account "for the purpose of creating cloud infrastructure autonomously." A security researcher whose company continuously scans public code
      repositories (GitGuardian) found the exposure and, after an ambiguous multi-channel reporting attempt (email to the contractor, CISA's vulnerability-
      disclosure platform, then a journalist), CISA's OCIO began incident response on Friday 15 May: the public repo was taken offline and preserved, the
      dev environment was taken offline, the individual's access was revoked, and — critically — CISA rotated ALL credentials across every environment
      where the individual held admin rights, not just the exposed ones. Forensic log review found the leaked credentials were never used outside CISA's
      own environments and no customer/mission data was exposed. CISA's self-assessed gaps: users could upload to public repositories at all (fix: gate
      uploads through the EDR agent rather than a policy-only control); "no repository should contain secrets, yet secrets made it into CISA private
      repositories" (fix: full secret rotation + a new secrets-detection/management action plan); no GitHub/cloud incident playbook existed at the time;
      reporting channels for incidents against CISA itself (as opposed to against CISA's constituents) were not clearly separated from the VDP intended for
      third-party vulnerabilities; and cryptographic key rotation "took longer than anticipated" given CISA's federal/industry interconnections — CISA
      explicitly calls out key-rotation agility as an under-tested capability worth exercising in advance.
    region_nexus: "US federal agency (CISA); the named gaps — personal-repo uploads of IaC/build credentials, secret sprawl in private repos, absent GitHub/cloud incident playbooks, slow cross-environment key rotation — are generic DevSecOps/cloud-governance failure modes directly transferable to any Swiss/EU public-sector or CI operator running its own CI/CD and IaC pipelines."
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
