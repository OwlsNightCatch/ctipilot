      own post-mortem/reflection content, which is materially new relative to the original breaking-news disclosure). If no earlier entry
      exists (e.g. it broke outside the pipeline's coverage at the time), treat as new. Framed here around the transferable hardening lesson
      per the S4 relevance gate criterion (b), not around CISA specifically.
