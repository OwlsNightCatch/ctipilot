  - title: "Open WebUI's six broken-access-control CVEs since November 2025 form one recurring authorization-architecture pattern, not six isolated bugs"
    sources:
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-open-webui-access-control-cves-20260710-cs/", publisher: "Cloud Security Alliance (CSA Labs)", date: "2026-07-10", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-hp5m-24vp-vq2q", publisher: "GitHub Security Advisories (open-webui/open-webui)", date: "2026-05", role: "corroborating" }
      - { url: "https://github.com/advisories/GHSA-4r4w-2wgp-w7cj", publisher: "GitHub Security Advisories (open-webui/open-webui)", date: "2026-06", role: "corroborating" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-open-webui-access-control-cves-20260710-cs/ -> pivot: GitHub Security Advisories, URL https://github.com/advisories/GHSA-hp5m-24vp-vq2q and URL https://github.com/advisories/GHSA-4r4w-2wgp-w7cj (both independently fetched and confirmed this run; a third attempt to independently verify Cato Networks' CVE-2025-64496 write-up returned only a cookie-consent shell on both WebFetch and jina reader and was dropped from Sources per source-link discipline)"
    summary: |
      CSA Labs synthesizes six distinct broken-access-control CVEs disclosed in the self-hosted Open WebUI LLM front-end between November 2025 and June 2026 into a single architectural pattern: authorization decided ad hoc per-endpoint rather than through one centrally enforced policy layer. The most severe, CVE-2025-64496 (CVSS 7.3, Cato Networks/Vitaly Simonovich), chains a Direct Connections client-side flaw -- the client evaluates server-sent events of type "execute" via JavaScript's `new Function()`, treating output from an attacker-controlled model server as executable code in the victim's authenticated browser session -- with the workspace.tools feature's unsandboxed Python `exec()`, letting a hostile model server escalate from session-token theft to full RCE on the Open WebUI host for any session holding the workspace.tools permission (patched 0.6.35). Four more affect the 0.9.x line: CVE-2026-44556 (CVSS 7.1) lets any authenticated user reach any model configured on the instance via the `/api/openai/responses` proxy, which validates only session state, not per-model access grants; CVE-2026-44557 (CVSS 4.3) exposes the full knowledge-base metadata collection to any logged-in user via an incomplete collection-name allowlist; CVE-2026-44564 (CVSS 5.4) lets a read-only Socket.IO collaboration-room member emit `ydoc:document:update` events because the handler checks room membership, not write permission; CVE-2026-54015 (CVSS 6.4) is a prompt-version-history IDOR where the endpoint validates the parent prompt-ID in the URL but not the caller-supplied history-ID, enabling cross-prompt read/delete. CVE-2025-63681 (CVSS 2.1, unauthorized task cancellation via `/api/tasks/stop/`) remains unpatched as of publication. Fixed versions: 0.6.35 (CVE-2025-64496), 0.9.0 (CVE-2026-44556, CVE-2026-44557, CVE-2026-44564), 0.9.6 (CVE-2026-54015).
    region_nexus: "global; Open WebUI is widely self-hosted by security-conscious teams (incl. public-sector/research bodies) wanting to keep LLM interactions off third-party SaaS"
    primary_sector_nexus: "indirect"
    sector: "public-sector, education, technology"
    cves: ["CVE-2025-64496", "CVE-2026-44556", "CVE-2026-44557", "CVE-2026-44564", "CVE-2026-54015", "CVE-2025-63681"]
