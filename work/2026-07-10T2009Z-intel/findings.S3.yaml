        attribution: "Cloud Security Alliance (CSA Labs), citing Cato Networks"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-open-webui-access-control-cves-20260710-cs/"
      - quote: "CVE-2025-63681 ... remains unpatched as of this writing; upgrading to the latest version does not close this cluster's exposure completely"
        attribution: "Cloud Security Alliance (CSA Labs)"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-open-webui-access-control-cves-20260710-cs/"
      - quote: "Every feature Open WebUI has added since late 2025 ... has needed its own bespoke answer to that question, and in five documented cases the answer implemented was incomplete."
        attribution: "Cloud Security Alliance (CSA Labs)"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-open-webui-access-control-cves-20260710-cs/"
    extended_notes: |
      Detection/hardening: confirm instances run >= 0.9.6; audit which accounts hold `workspace.tools` (the permission that converts client-side token theft into server-side RCE) and revoke from any account not authoring executable functions; disable/restrict Direct Connections to only fully-trusted model servers; place the admin interface and API behind an authenticating reverse proxy / SSO gateway / VPN rather than exposing directly, since CVE-2025-63681 has no released patch and the underlying engineering pattern (authorization decided per-endpoint) means further instances of the same class are plausible. Log and alert on the OpenAI proxy router, task-management, and Socket.IO collaboration endpoints for authenticated users reaching resources outside expected scope.
