    summary: |
      SOCRadar's Threat Intelligence Team found a Python SimpleHTTPServer instance left open with no authentication for 22 days on a US-hosted VPS, exposing the complete toolkit, target lists, bash history, and C2 configuration of a webshell access-brokerage operation it names WP-SHELLSTORM. The crew built automated scanners that fired 27 weaponized CVEs at ~1.4 million domains (WordPress and Joomla plugin targets pulled from FOFA), with the Breeze Cache Cleaner plugin flaw (CVE-2026-3844) the single most productive exploit -- fired at 45,000+ targets, backdooring 17,000+ of them -- followed by a ThemeREX Addons vulnerability. Backdoors deployed include a heavily obfuscated `down.php` PHP webshell (BestShell derivative) and Godzilla-framework variants; a second, parallel track uses the Nacos authentication-bypass CVE-2021-29441 plus JDumpSpider to extract cloud credentials and database connection strings from Java heap dumps on Apache Nacos / XXL-Job / Spring Boot infrastructure, and drops the SNOWLIGHT WebSocket dropper and the VShell implant (VShell is separately tracked in China-nexus intrusion sets such as UNC5174) with process-masquerading capabilities. Victim-count estimates diverge between the two independent research teams -- SOCRadar counts ~5,700 currently live webshells; Ctrl-Alt-Intel's separate deduplicated analysis (cited by The Hacker News) found 25,195 sites with confirmed or validated compromise evidence -- both agree the operation is financially motivated cybercrime rather than nation-state espionage, assessed with Chinese-speaking operator attribution from handle/language artifacts in the exposed toolkit.
    region_nexus: "global; any self-hosted WordPress/Joomla estate or exposed Apache Nacos/XXL-Job/Spring Boot instance in Swiss/EU public-sector and SME environments is a candidate target given the FOFA-sourced, breadth-first targeting model"
