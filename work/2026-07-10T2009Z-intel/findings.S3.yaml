    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-forg365-ai-phishing-service-20260710-csa-s/ -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/new-forg365-phishing-platform-uses-ai-to-target-microsoft-365-accounts/ -> primary: ZeroBEC, URL https://zerobec.com/blog/inside-forg365-telegram-distributed-sneaky2fa-style-phaas"
    summary: |
      ZeroBEC documented Forg365, a Telegram-distributed, commercially maintained ($400/month, $3,800/year, 5-day trial) Microsoft 365 phishing-as-a-service platform that packages two independent credential-theft paths behind one operator panel (currently hosted at logfriend[.]com/login): a device-authorization-grant (RFC 8628) branch that shows a Microsoft-styled verification-code page and drives the legitimate Microsoft Authentication Broker flow, and an AiTM branch that classifies inbound traffic via route tokens/session cookies to decide whether to serve the phishing page or a benign decoy. Both paths converge on a valid, MFA-satisfied OAuth refresh token or session cookie because the victim -- not the attacker -- completes the real Microsoft authentication. The panel folds an AI lure-drafting assistant directly into the same console used to manage SMTP rotation (Amazon SES), OAuth-app configuration, AES-encrypted/anti-bot SVG redirectors, token vaulting, and a keyword-alert mailbox-monitoring feature. Persistence after initial compromise is handled by a companion browser extension, ForgCookie (Chrome/Edge/Brave), which silently triggers OAuth flows to refresh the stolen Microsoft SSO cookie before it expires, so operator access survives without the victim re-authenticating. ZeroBEC's Entra telemetry traced device-code activity to a Comcast/Xfinity residential IP and a Forg365 backend node hosted in Kyiv, Ukraine that later performed Microsoft Graph device-registration calls. ZeroBEC assesses Forg365 as a "Kali365-class" platform (functional overlap with the FBI-profiled Kali365 and with Sneaky2FA) but found no evidence of common ownership. This is a distinct commercial kit from the Huntress-documented "Railway"/EvilTokens device-code campaign covered earlier today -- same abused primitive, different operator and product.
    region_nexus: "global; Microsoft 365 is the dominant productivity/identity platform across Swiss and EU public-sector and critical-infrastructure tenants"
