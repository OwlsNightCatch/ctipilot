  - title: "Wiz's autonomous 'Red Agent' and XBOW show production-speed AI pentesting finding real BOLA/SSRF/JWT-alg:none flaws that manual testing missed"
    sources:
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-autonomous-red-team-agent-findings-2026/", publisher: "Cloud Security Alliance (CSA Labs)", date: "2026-07-10", role: "primary (synthesis)" }
      - { url: "https://www.wiz.io/blog/red-agent-pov-bola", publisher: "Wiz", date: "2026-06-29", role: "primary" }
      - { url: "https://www.wiz.io/blog/introducing-the-wiz-red-agent", publisher: "Wiz", date: "2026-04-22", role: "corroborating" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-autonomous-red-team-agent-findings-2026/ -> primary: Wiz, URL https://www.wiz.io/blog/red-agent-pov-bola"
    summary: |
      CSA Labs synthesizes Wiz's own case-study disclosures about its commercial autonomous pentesting agent "Red Agent" (public preview since 2026-04-22) with XBOW's independently developed autonomous agent, both of which reason over live application logic rather than replaying static payloads. In its most detailed disclosed case, Wiz's Red Agent found a critical broken object-level authorization (BOLA) flaw in a major airline's public GraphQL booking API within 15 minutes and with no credentials: it parsed client-side JavaScript to learn the session-acquisition flow, minted an anonymous session via two API calls, then abused GraphQL's built-in introspection to enumerate 514 queries and 428 mutations reachable from that session. Submitting sequential integer booking IDs to resolvers that checked session validity but never checked per-object entitlement returned complete, unredacted passenger records (name, DOB, contact details, masked payment data, up to two years of itineraries) -- and the same anonymous session carried write access sufficient to cancel bookings or reroute passengers. Aggregate Red Agent statistics across ~1,000 customer environments in its first month: access-control failures (the BOLA class) were 54% of all findings; exposed secrets accounted for 61% of critical/high-severity findings; SQL injection findings were >52% critical/high; and among JWT bypasses specifically, 63.9% involved the trivially-fixable `alg:none` signature-verification bypass. XBOW, operating independently against real HackerOne bug-bounty targets, reached #1 on HackerOne's US researcher leaderboard (nearly 1,060 submitted reports, 130 resolved, 303 validated) and, in a separate benchmark, matched a 20-year veteran pentester's 85% solve rate on a 104-challenge suite in 28 minutes versus the human's ~40 hours.
    region_nexus: "global; directly relevant to any org running public-facing GraphQL/REST APIs, cloud-hosted services, or JWT-based auth -- the vulnerability classes found (BOLA, SSRF, JWT alg:none) are commodity misconfigurations, not novel techniques"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, transport, technology"
    cves: []
    techniques: [T1190, T1552.005]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "tool:wiz-red-agent", type: tool, name: "Wiz Red Agent", aliases: [],
          summary: "Wiz's autonomous AI pentesting agent (public preview since 2026-04-22) that reasons over live application logic to discover and validate exploitable vulnerabilities in production without a human directing each step; reported >17,000 findings across ~1,000 customer environments in its first month (Wiz, 2026)." }
      - { key: "tool:xbow", type: tool, name: "XBOW", aliases: [],
          summary: "Independently developed autonomous penetration-testing agent that reached #1 on HackerOne's US researcher leaderboard submitting real vulnerability reports against production bug-bounty targets, and matched a veteran human pentester's benchmark solve rate in a fraction of the time (XBOW, 2026)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Downstream API resolvers failed to validate these roles when processing data requests."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/red-agent-pov-bola"
      - quote: "By submitting sequential booking numbers to these unprotected resolvers, the Red Agent gained unauthenticated access to the passenger database."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/red-agent-pov-bola"
      - quote: "Access control failures ... accounted for 54 percent of all discoveries ... Exposed secrets ... made up 61 percent of the findings rated critical or high severity ... 63.9 percent involved the alg:none misconfiguration"
        attribution: "Cloud Security Alliance (CSA Labs), citing Wiz aggregate data"
        source_url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-autonomous-red-team-agent-findings-2026/"
