      Detection: audit Entra sign-in logs for device-code authentication events (Microsoft Graph sign-in logs, "Authentication Requirement" / device-code client-id patterns); block via Conditional Access "Authentication Flows" condition -> Device Code Flow -> Grant: Block, unless a legitimate CLI/shared-device use case requires it. For the AiTM path, watch for anomalous OAuth app consent grants and new mailbox forwarding rules immediately following a sign-in, and for browser-extension installs matching ForgCookie's SSO-cookie-refresh behavior on managed endpoints. Any account with suspected compromise needs `revokeSignInSessions` (Entra ID) -- a password reset alone does not invalidate a device-code-derived refresh token or an AiTM-stolen session cookie. Benign lookalike: legitimate device-code use is real (CLI tools, smart-TV apps, headless devices) -- the discriminator is a verification-code prompt reached via an unsolicited phone call/lure rather than a user-initiated CLI login flow.
