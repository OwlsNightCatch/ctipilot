items:
  - title: "Siemens SICAM A8000/EGS/S8000 grid-protection RTUs: four vulnerabilities including insecure firmware-signature validation and an OPC UA default that disables all security"
    sources:
      - { url: "https://cert-portal.siemens.com/productcert/html/ssa-229470.html", publisher: "Siemens ProductCERT (SSA-229470)", date: "2026-07-09", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0860/", publisher: "CERT-FR / ANSSI (CERTFR-2026-AVI-0860)", date: "2026-07-10", role: "primary" }
    discovery_trace: "first seen at: cert-fr-avis (essential source), URL https://www.cert.ssi.gouv.fr/avis/feed/ -> avis page https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0860/ -> primary: Siemens ProductCERT advisory SSA-229470, URL https://cert-portal.siemens.com/productcert/html/ssa-229470.html"
    summary: |
      Siemens patched four vulnerabilities (SSA-229470, published 2026-07-09) in the SICORE and CPCI85
      firmware/base-system components used across the SICAM A8000 (CP-8010/CP-8012, CP-8031/CP-8050),
      SICAM EGS and SICAM S8000 product lines -- remote terminal units and protection/automation
      controllers Siemens explicitly frames for "critical power systems (e.g. TSOs or DSOs)". CERT-FR
      (ANSSI) republished the advisory as CERTFR-2026-AVI-0860 on 2026-07-10, giving this an in-window,
      home-region-authority citation on top of the vendor primary. CVE-2026-54798 (CVSS 3.1: 6.5 / 4.0:
      7.1, CWE-489 Active Debug Code) exposes a debugging interface via HTTP endpoints that an
      authenticated attacker can use to crash the web process (DoS). CVE-2026-54799 (CVSS 3.1: 6.7 /
      4.0: 8.4, CWE-489) is a flaw in the firmware-update mechanism's signature-validation process --
      a local attacker with high privileges can install malicious firmware for persistent code execution
      and full device compromise. CVE-2026-54800 (CVSS 3.1: 4.8 / 4.0: 6.3, CWE-1188) ships with OPC UA
      security mechanisms disabled by default in the shipped configuration, letting a network attacker
      (no privileges, high attack complexity) gain unauthorized access to control functions over the
      OPC UA interface. CVE-2026-54801 (CVSS 3.1: 7.2 / 4.0: 8.6, CWE-620 Unverified Password Change) is
      insufficient validation of authentication credentials when the web API processes administrative
      account modifications, letting an authenticated attacker bypass controls and gain unauthorized
      admin-level access. All four are fixed in CPCI85 >= V26.20 and SICORE >= V26.20.0; no exploitation
      in the wild is claimed by either Siemens or CERT-FR. Given the OT/energy-sector deployment context
      (secondary protection / RTU firmware on the power-grid boundary), this is directly relevant to the
      organization's energy-sector coverage even absent confirmed exploitation.
    region_nexus: "European home-region relevance via CERT-FR (ANSSI) republication; SICAM A8000/EGS/S8000 RTUs are deployed at TSOs/DSOs across Europe including Switzerland"
    primary_sector_nexus: "indirect"
    sector: "energy"
    cves: [CVE-2026-54798, CVE-2026-54799, CVE-2026-54800, CVE-2026-54801]
    techniques: [T1499, T1601, T1210, T1098]
    affected_products:
      - "Siemens SICAM A8000 CP-8010/CP-8012 (SICORE firmware)"
      - "Siemens SICAM A8000 CP-8031/CP-8050 (CPCI85 firmware)"
      - "Siemens SICAM EGS (CPCI85 firmware)"
      - "Siemens SICAM S8000 (SICORE firmware)"
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The affected application contains a vulnerability in its firmware update mechanism's signature validation process. This could allow an attacker to install malicious firmware, leading to persistent code execution and system compromise."
        attribution: "Siemens ProductCERT (SSA-229470)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-229470.html"
      - quote: "The affected application contains insufficient validation of authentication credentials when processing administrative account modifications through the web API. This could allow an authenticated attacker to bypass security controls and gain unauthorized elevated privileges."
        attribution: "Siemens ProductCERT (SSA-229470)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-229470.html"
      - quote: "Operators of critical power systems (e.g. TSOs or DSOs) worldwide are usually required by regulations to build resilience into the power grids by applying multi-level redundant secondary protection schemes."
        attribution: "Siemens ProductCERT (SSA-229470)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-229470.html"
    extended_notes: |
      No CISA KEV / active-exploitation claim found for any of the four CVEs as of this run. Product
      description: "CPCI85 is a robust, high-performance central processing and communication unit used
      as a component within SICAM A8000 CP-8031/CP-8050 Devices and SICAM EGS. SICORE is the underlying
      engine responsible for executing critical functions within SICAM A8000 CP-8010/CP-8012 devices and
      the SICAM S8000." Firmware-update packages: CP-8031/CP-8050 Package V26.20
      (https://support.industry.siemens.com/cs/ww/en/view/109804985/), SICAM EGS Package V26.20
      (https://support.industry.siemens.com/cs/document/109972536/), CP-8010/CP-8012 Package V26.20
      (https://support.industry.siemens.com/cs/ww/en/view/109972894/), SICAM S8000 Package V26.20
      (https://support.industry.siemens.com/cs/document/109818240).

  - title: "NCSC-CH flags a Zimbra Classic Web Client stored-code-execution flaw fixed in ZCS 10.1.19 (no CVE yet, exploitation status unknown)"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12757", publisher: "NCSC-CH / GovCERT.ch Cyber Security Hub", date: "2026-07-10", role: "primary" }
      - { url: "https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-19/", publisher: "Zimbra (vendor blog, patch release notes)", date: "2026-07-07", role: "primary" }
      - { url: "https://www.heise.de/news/Zimbra-Collaboration-Suite-Kritische-Luecke-macht-Classic-Web-Client-angreifbar-11356522.html", publisher: "heise online", date: "2026-07-07", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub (essential source), URL https://security-hub.ncsc.admin.ch/#/posts/12757 -> primary: Zimbra vendor blog, URL https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-19/ -> corroborating: heise.de, URL https://www.heise.de/news/Zimbra-Collaboration-Suite-Kritische-Luecke-macht-Classic-Web-Client-angreifbar-11356522.html"
    summary: |
      NCSC-CH's Cyber Security Hub published an advisory on 2026-07-10 (12:45 UTC) flagging a Zimbra
      Collaboration Suite (ZCS) Classic Web Client vulnerability that Zimbra itself patched on 2026-07-07
      in ZCS 10.1.19, with heise.de covering it the same day as a stored cross-site-scripting issue.
      A specially crafted email, when opened by a victim in the (legacy) Classic Web Client, can run
      attacker-supplied script in the webmail session -- NCSC-CH states this "allows unauthenticated
      remote attackers to access session data, account settings, and mailbox contents when a victim
      opens a malicious email." No CVE identifier has been assigned by either Zimbra or NCSC-CH as of
      this run, and NCSC-CH lists exploitation status as "UNKNOWN" (no confirmed in-the-wild abuse).
      Only the Classic Web Client is affected -- the Modern Client is not impacted, and Zimbra/heise
      recommend switching end users to the Modern Client as an interim mitigation ahead of upgrading to
      10.1.19. Zimbra webmail remains in use across a number of European public-sector, postal and
      telecom operators, which is why NCSC-CH's own advisory choice to surface a client-side, unrated
      (no-CVE) issue is itself a useful signal for that constituency even though severity/exploitation
      confirmation is thin.
    region_nexus: "Switzerland (NCSC-CH primary advisory); Zimbra webmail is deployed across European public-sector, postal and telecom organizations more broadly"
    primary_sector_nexus: "direct"
    sector: "public-sector, telco"
    cves: []
    techniques: [T1189]
    affected_products:
      - "Zimbra Collaboration Suite (ZCS) Classic Web Client"
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "no CVE assigned, exploitation status explicitly UNKNOWN, and the affected component (Classic Web Client) is a legacy client Zimbra is steering users away from -- surfaced primarily because NCSC-CH chose to publish it as a national-authority advisory today, which is itself the org-relevant signal."
    evidence:
      - quote: "Successful exploitation allows unauthenticated remote attackers to access session data, account settings, and mailbox contents when a victim opens a malicious email."
        attribution: "NCSC-CH Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12757"
      - quote: "Current exploitation status: UNKNOWN"
        attribution: "NCSC-CH Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12757"
      - quote: "Any customer using the Classic Web Client should upgrade to ZCS v10.1.19 as soon as possible"
        attribution: "Zimbra (vendor blog)"
        source_url: "https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-19/"
    extended_notes: |
      Prerequisites: user must open a specially crafted malicious email while using the Classic Web
      Client (Zimbra's older, non-default webmail UI). No privileges required by the attacker; requires
      victim interaction (opening the email). Patched version: ZCS 10.1.19 (released 2026-07-07).
