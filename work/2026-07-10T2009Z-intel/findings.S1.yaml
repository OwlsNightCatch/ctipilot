    discovery_trace: "first seen at: cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → CVE-2026-48939 newly listed (dateAdded 2026-07-10, not present in earlier runs today) → corroborating: CISA's own dated alert, URL https://www.cisa.gov/news-events/alerts/2026/07/10/cisa-adds-two-known-exploited-vulnerabilities-catalog (confirms exactly two additions today: CVE-2026-48939 and the already-covered CVE-2026-56291) → primary technical write-up: mySites.guru, URL https://mysites.guru/blog/icagenda-zero-day-file-upload-rce/ → corroborating: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-48939 → corroborating PoC: GitHub, URL https://github.com/Polosss/By-Poloss..-..CVE-2026-48939"
    summary: |
      CISA added CVE-2026-48939 to the KEV catalog today (2026-07-10, confirmed via CISA's own dated alert naming exactly two additions), covering iCagenda, a widely used Joomla events/calendar extension. The flaw is in the extension's public-facing frontend event-submission ("register for event") controller: the file-attachment upload feature enforced access restrictions only at the view layer, not the controller layer, and applied no file-extension allow-list, so any unauthenticated visitor could POST a PHP file through the public submission form. Uploaded files land directly under the web root at /images/icagenda/frontend/attachments/, where they are immediately executable as PHP — a classic unrestricted-file-upload-to-RCE chain (CWE-434). Affected versions run 3.2.1–3.9.14 and 4.0.0–4.0.7; iCagenda shipped fixes as 3.9.15 and 4.0.8 on 2026-06-15/16, moving upload validation onto Joomla's own MediaHelper allow-list (rejecting .php and other dangerous extensions) and relocating access enforcement to the controller. Per the researcher who first documented it (mySites.guru), the flaw was already being exploited in the wild before any fix existed — a genuine zero-day — with log evidence showing a purpose-built scanning client (user agent `icagenda-batch/1.0`) grabbing a session, POSTing the malicious upload to the submission endpoint, then immediately fetching the dropped shell. CVSS 4.0 is 10.0 (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:A/AU:Y/U:Red); CVSS 3.1 is 9.8. A public PoC (GitHub, Polosss/By-Poloss..-..CVE-2026-48939; also shinthink/CVE-2026-48939) is available. CISA's due date for FCEB remediation is 2026-07-13.
    region_nexus: "global (any Joomla site running the iCagenda calendar/booking extension); relevant to Swiss/EU public-sector and municipal websites that commonly run Joomla-based event/booking portals"
