    extended_notes: |
      Detection concept (telemetry class first): web/application access logs on the Joomla frontend — look for anonymous-session POST requests to the com_icagenda front-end event-submission/upload endpoint immediately followed by a GET request fetching a .php path under /images/icagenda/frontend/attachments/ (or any web-writable uploads directory outside the deployed application baseline). The `icagenda-batch/1.0` user-agent string the researcher observed is a concrete but trivially evadable indicator of the specific scanning tool; the durable discriminator is file-integrity monitoring on upload directories flagging any newly created executable-extension file. Process-telemetry angle: the PHP-FPM/Apache worker serving that uploaded file spawning a shell child process shortly after being requested is a strong post-exploitation signal.
      Triage / benign-lookalike: on a patched (4.0.8/3.9.15) instance, MediaHelper's allow-list means legitimate event submissions can only ever attach non-executable types (images, PDFs, docs) — so on an unpatched instance, ANY .php (or double-extension, e.g. .php.jpg) file appearing under the iCagenda attachments path is not something a legitimate calendar/event submission could produce, making it a clean discriminator once the attachments-directory baseline is known.
      Hardening: patch to 4.0.8 (current branch) or 3.9.15 (legacy branch) immediately — this was exploited before a fix existed, so patching alone does not retroactively remediate a prior compromise. If immediate patching isn't possible, disable or remove the public event-submission/attachment feature, or block anonymous POSTs to the submission endpoint at a WAF/reverse proxy. Any Joomla site with iCagenda installed should be checked for pre-existing shells under /images/icagenda/frontend/attachments/ regardless of current patch status, given the confirmed pre-patch zero-day exploitation window.
