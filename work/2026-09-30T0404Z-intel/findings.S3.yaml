    for an RMM product not on the approved list; inbound Windows Firewall allow rules created by an installer. Benign lookalike: sanctioned MSP/RMM enrolment; discriminators are the approved-publisher list,
    the installer''s file name versus its product, execution from Downloads after an email/web click, and the absence of a change ticket. Hardening: application control (WDAC/AppLocker publisher rules)
