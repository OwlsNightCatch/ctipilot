- title: 'ANNUAL REPORT - ENISA Threat Landscape 2026: public administration is the most targeted EU sector at 31.8% of incidents, 81.8% of them DDoS, and ransomware claims against public administration
    fall mainly on municipalities'
  sources:
  - url: https://www.enisa.europa.eu/publications/enisa-threat-landscape-2026
    publisher: ENISA
    date: '2026-09-22'
    role: primary
  - url: https://www.helpnetsecurity.com/2026/09/24/enisa-eu-cyber-threats-report/
    publisher: Help Net Security
    date: '2026-09-24'
    role: corroborating
  discovery_trace: 'first seen at: WebSearch ("ENISA Threat Landscape 2026 report published public administration most targeted sector") -> primary: ENISA publication page https://www.enisa.europa.eu/publications/enisa-threat-landscape-2026
    (report PDF https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf fetched with the pdf transport; text font-mangled, so statistics are cited from Help Net
    Security''s reading) -> corroboration: Help Net Security https://www.helpnetsecurity.com/2026/09/24/enisa-eu-cyber-threats-report/'
  summary: ENISA's Threat Landscape 2026, published 2026-09-22, analyses incidents and events observed between 1 January and 31 December 2025; Help Net Security's reading of it reports 8,257 incidents,
    of which DDoS made up 51.3% and unauthorised access 39.5%, with hacktivists linked to much of the DDoS activity against government websites. Public administration was the most affected sector at 31.8%
    of incidents (business services 8.5%, transport 8%, manufacturing 6.9%, finance and banking 5.6%); DDoS represented 81.8% of incidents affecting public administration, tied to elections, law-enforcement
    operations, Russia's war against Ukraine and Middle East conflicts. Among financially motivated incidents affecting public administration, data breaches were 38.4% and ransomware claims 36%, the latter
    primarily affecting municipalities; ENISA cites a ransomware attack on a Swedish IT supplier that disrupted human-resources reporting for around 200 municipalities and regional authorities as an example
    of supplier concentration risk. State-linked groups continued to target ministries, diplomatic organisations and other government institutions for espionage. Phishing accounted for 77.8% of identified
    social-engineering techniques, ClickFix use increased, vulnerability exploitation was 60.4% of the small subset (5.2%) of unauthorised-access incidents with an identified intrusion method, messaging
    platforms such as Signal and WhatsApp were used for personalised contact leading victims through legitimate authentication flows, and AI was used for phishing, reconnaissance, scripting and post-exploitation.
    The figures are open-source-dominated (with anonymised member-state input), so they describe reported incident mix rather than true prevalence.
