  extended_notes: 'Behavioural hunt concepts tied to telemetry classes: process-creation events with parent lineage (conhost.exe launching curl; ssh.exe with PermitLocalCommand=yes and LocalCommand=cmd.exe;
    control.exe fetching a remote path), scheduled-task creation events (three tasks with network-component-style names, one WebDAV UNC target), registry writes under HKCU\Software\Classes with an unusual
    extension key, mail-flow (password-protected archives whose password is an image; VHDX/ISO/LNK inside archives; sender local-part carrying an organisation name on an unrelated domain; bulk ''initial
    contact'' invitations naming think tanks). Hardening levers named by Microsoft: phishing-resistant authentication and Conditional Access, Safe Links/Attachments with ZAP, network protection, and restricting
    outbound SSH from workstations to what the business needs; also block or open-in-sandbox VHDX in mail. Benign lookalikes: legitimate think-tank event invitations (discriminators: sender domain vs the
    named organisation, no follow-up archive, no scheduled-task creation afterwards). Linked context: Microsoft says Proofpoint reported the DarkSword iOS link variant in March (see the separate DarkSword
    item); Volexity''s Dec 2025 report on Russian actors spoofing European security events is not cited by Microsoft and is not asserted to be this actor.'
