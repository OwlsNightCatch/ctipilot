- title: 'NeedyMantis: modular China-aligned post-compromise implant sideloaded through look-alike Poedit/curl/Vim/TightVNC bundles, found by pivoting from the DAEMON Tools compromise'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
    publisher: Microsoft Threat Intelligence
    date: '2026-09-28'
    role: primary
  - url: https://thehackernews.com/2026/09/hackers-use-needymantis-to-maintain.html
    publisher: The Hacker News
    date: '2026-09-29'
    role: corroborating
  discovery_trace: 'first seen at: Microsoft Security Blog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ (fetched via tools/fetch_source.py feed) -> primary: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
    -> corroboration: The Hacker News https://thehackernews.com/2026/09/hackers-use-needymantis-to-maintain.html'
  summary: 'Microsoft Threat Intelligence (2026-09-28) describes NeedyMantis, a modular post-compromise malware family seen in a limited number of targeted operations against telecommunications organisations,
    universities, medical nonprofits, intergovernmental organisations and government contractors, active since at least October 2025. Microsoft found it by pivoting on indicators from Kaspersky''s DAEMON
    Tools supply-chain investigation; Storm-3069, its designator for the DAEMON Tools compromise activity, is one operator, Microsoft has not attributed Storm-3069 to a Chinese state actor, and it says
    the activity aligns with China-based actors'' interests and selective deployment but has not determined whether one or several operators use the malware. NeedyMantis is deployed after access exists:
    a legitimate program (Poedit''s WinSparkle updater, curl, Vim, TightVNC, or DLLs posing as Office, Broadcom, Intel and NVIDIA components) ships with a malicious DLL named after a library it loads and
    a same-named encrypted archive; in one intrusion an operator used Impacket during hands-on activity to copy the bundle from a network share and run it. Stage one sideloads and extracts a second-stage
    loader that is shellcode disguised as a .ps1 file; the main component reads a configuration stored in a file named like dnsapi.dll and a WebSocket communications component named like ws2_32.dll. C2
    starts as an HTTPS GET carrying compressed, Base64-encoded host details in a Set-Cookie header, then upgrades to WebSockets with a custom 44-byte binary header, a key exchange that RC4-encrypts a buffer
    beginning with ''google.com'', a hard-coded firefox/21.0 user agent and a mutex of the form <username>-<process name>; commands load and unload modules and dispatch data to them, but the module capabilities
    remain unconfirmed. Stage-one anti-analysis includes obfuscated stack strings and two anti-debugger checks.'
