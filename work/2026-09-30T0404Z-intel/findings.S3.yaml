    role: primary
  - url: https://thehackernews.com/2026/09/french-tax-data-theft-using-stolen.html
    publisher: The Hacker News
    date: '2026-09-29'
    role: corroborating
  discovery_trace: 'first seen at: thehackernews.com feed, URL https://thehackernews.com/2026/09/french-tax-data-theft-using-stolen.html -> primary: ANSSI news page linking the report PDF, URL https://cyber.gouv.fr/actualites/lanssi-publie-le-rapport-dincident-sur-les-cyberattaques-ayant-touche-la-dgfip/
    (report PDF https://cyber.gouv.fr/documents/821/20260923_NP_TLPCLEAR_ANSSI_Rapport_incident_DGFIP.pdf fetched with the pdf transport; text partially font-mangled, so quotes are taken from the HTML page)'
  summary: 'France''s ANSSI delivered its audit of the DGFiP tax-authority intrusions to the Prime Minister on 2026-09-24 and published it on 2026-09-29; it reconstructs two exfiltration waves between May
    and August 2026, one against the impots.gouv.fr platform (claimed 08-12) and one against land-registry data (claimed 08-13). ANSSI''s own summary names three failures. Identity: attackers stole and
    used legitimate DGFiP credentials whose theft followed their use on personal equipment, combined with no strong authentication on the portals that reach sensitive resources. Architecture: sensitive
    applications were exposed to the Internet or reachable from the inter-ministry network (RIE) without segmentation, so lateral movement was possible from a third-party body''s resources (the Education
    ministry in this case). Detection: neither wave was detected by DGFiP''s or ANSSI''s monitoring; DGFiP''s SOC did not supervise one of the portals used to exfiltrate and nothing correlated the suspicious
    signals, while ANSSI''s sensors sit only at RIE and Internet entry/exit points, it has no application-log access and it had no relevant network indicators or threat-specific rules. The Hacker News''
    reading of the full report adds detail worth verifying against the PDF: the credentials were probably infostealer-harvested from computers DGFiP did not manage; two portals asked for a password only;
    a June password reset addressed the alert on the staff email/HR portal but did not end the attacker''s open session on a second portal, so scraping continued for almost 16 more hours; 11 GB moved in
    three days without a volume alert and no per-user request quotas existed; the land-registry route bypassed an emailed one-time code through a possibly compromised partner (land-surveyor) computer. ANSSI''s
    recommendations, as summarised by THN: revoke every active session on all applications whenever a password is reset, review a compromised account''s activity from the likely compromise date, use MFA
    whose second factor survives password theft (an emailed code is not enough if the same password opens the mailbox), monitor every business application in a SIEM with quotas on records, requests and
    data volume, and refuse personal devices for work resources. THN also contrasts this with the ministry''s August statement that the theft escaped detection ''because of the sophistication of the attack''
    and reports that ANSSI''s report calls the attack unsophisticated (a characterisation not visible on the ANSSI news page itself). THN cites roughly 350,000 individuals and 250,000 businesses for the
    E-Contact data and about 435,000 households for the land-registry data (attributed to the DGFiP FAQs and a Senate note); the earlier entry carries a 678,000 figure that the composer should reconcile.'
