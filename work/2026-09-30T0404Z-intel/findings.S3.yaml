- title: 'VUSec''s Branch Target Reuse (BTR): a Spectre-v2 variant on JIT engines that leaks Linux kernel memory through unprivileged cBPF on default-protected Intel systems; kernel mitigations already
    merged'
  sources:
  - url: https://www.vusec.net/projects/btr
    publisher: VUSec (VU Amsterdam) with Scuola Superiore Sant'Anna
    date: '2026-09-29'
    role: primary
  - url: https://thehackernews.com/2026/09/new-spectre-v2-btr-attack-leaks-linux.html
    publisher: The Hacker News
    date: '2026-09-29'
    role: corroborating
  discovery_trace: 'first seen at: BleepingComputer feed, URL https://www.bleepingcomputer.com/feed/ (fetched via tools/fetch_source.py feed; title ''New Spectre v2 attack variant leaks Linux root password
    hash in minutes'') -> pivot: The Hacker News https://thehackernews.com/2026/09/new-spectre-v2-btr-attack-leaks-linux.html -> primary: VUSec project page https://www.vusec.net/projects/btr'
  summary: 'VUSec and Scuola Superiore Sant''Anna researchers (CCS 2026 paper; project page 2026-09-29) disclose Branch Target Reuse, a Spectre-v2 variant in which stale indirect-branch-predictor entries
    outlive freed JIT code, so that when the code cache is repopulated a branch can speculatively jump to an obsolete offset, a ''speculative execute-after-free'' primitive that bypasses software Spectre
    hardening or reaches misaligned gadgets. They analysed Linux classic BPF (cBPF), Oracle GraalVM and Mozilla SpiderMonkey and confirmed the predictor behaviour on every CPU tested, covering Intel, AMD
    and Arm. Two end-to-end exploits against the Linux kernel leak arbitrary kernel memory at about 8 bytes per second on a fully patched modern Intel system with default protections; the demo walks the
    kernel task list and page tables to recover the root password hash of an ''su'' process within minutes, and a second variant defeats cBPF constant blinding (bpf_jit_harden, off by default) by encoding
    bytes in forward-jump offsets. cBPF remains available to unprivileged programs (socket filters, seccomp, packet filtering used by Docker and Chrome), so the prerequisite is the ability to run unprivileged
    code on the host. A SpiderMonkey proof of concept using WebAssembly literal pools is feasible (tens of bytes per second estimated) but not yet a browser exploit, because Firefox has not fully deployed
    site isolation; GraalVM leakage is currently limited by compilation and GC activity. Mitigations: Linux upstream added an x86 IBPB flush on all cores when a cBPF/eBPF region is reused and discourages
    such reuse (CVE-2026-64507) plus JIT-spraying hardening (CVE-2026-64508); Oracle randomises JIT code-cache locations; Mozilla is prioritising site isolation; hardware vendors say IBPB-type mechanisms
    already exist and mitigation belongs in software. No in-the-wild exploitation is reported.'
  region_nexus: global; hardware and OS class issue
  primary_sector_nexus: indirect
