  summary: 'Malwarebytes (2026-09-29) analysed a fake Apple-styled ''iPhone Duo'' preorder page (Apple opens iPhone Duo preorders only on 16 October, per Malwarebytes) that uses the leaked DarkSword iOS
    exploit chain, which Malwarebytes says matches the chain Google described in March and Apple has since patched. Non-Safari browsers get a ''Browser Restricted'' notice and iPhones are steered into Safari;
    an invisible frame checks the iOS version and loads matching code, and the attempt starts on page load without a form submission, tap or download (the visible form does not even send the entered data).
