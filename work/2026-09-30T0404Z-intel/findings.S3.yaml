    items, Notes, messages, call history, contacts, voicemail, email, calendar and location caches and photo thumbnails, accepts server commands (directory listing, file retrieval, JavaScript execution)
    and deletes diagnostic reports; Malwarebytes found no mechanism that survives a reboot. Malwarebytes analysed the captured code only and did not test it on an iPhone or observe data leaving one. Targeted
    versions: the chain iVerify analysed in March covered iOS 18.4 through 18.6.2 (iVerify then estimated up to 270 million devices; Malwarebytes states that is not a current count) and the page''s files
    also carry code for older iOS versions; Apple says updated devices are protected against the reported attacks. Context from a second source: Microsoft''s 2026-09-29 Star Blizzard report states that
    one March campaign delivered a link to DarkSword iOS backdoor installation and that Proofpoint reported it, so the chain moved from a state-aligned operator to a commodity scam lure within months.'
