  extended_notes: 'Delta on the 2026-08-15 DGFiP entry (which rested on the ministry''s statement and press reporting): the authority''s own root-cause analysis replaces the ''sophistication'' explanation
    with weak login protection, poor network separation and monitoring gaps. Transferable hunt/hardening concepts for Swiss administrations: (1) on every password reset also kill all sessions/tokens on
    every portal, not just the alerting one; (2) alert on volume, per-user request rate and night-time/VPN/foreign-ASN combinations against business applications, since each alone is noisy; (3) treat infostealer-log
    intelligence as a stream that needs same-day, session-revoking response; (4) segment sensitive applications inside shared government networks so a compromised peer body cannot reach them; (5) block
    personal devices from work portals or enforce phishing-resistant MFA on password-only portals. Benign lookalike for the ''automated scraping'' signal: sanctioned bulk-lookup use by partner professions
    (notaries, surveyors) through a partner portal; discriminators are session origin, request cadence and one-request-per-page patterns. Caveat: the PDF text extraction is font-mangled, so THN-attributed
    details were not independently read in the PDF; the composer should keep them attributed to THN or re-read the PDF.'
- title: 'Star Blizzard''s RedFlick: mass-mailed think-tank event invitations, compromised-website senders and a single-click scheduled-task chain to the CosmicPulse backdoor'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
    publisher: Microsoft Threat Intelligence
