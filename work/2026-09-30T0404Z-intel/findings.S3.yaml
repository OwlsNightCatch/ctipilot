  summary: 'On Sunday afternoon 2026-09-27 the communal operating data centres in Rhineland-Palatinate (Mainz and Koblenz, per SWR as quoted by Born) took systems offline as a precaution after a security
    notice rated ''highly critical'' for an IT product used in communal data centres, and on Monday 2026-09-28 citizens were turned away; the state''s three communal associations (Landkreistag, Gemeinde-
    und Städtebund, Städtetag) said all communal administrations in the state were affected and stressed it was ''not a successful cyberattack but a precaution to protect the data until the vulnerability
    is closed''. Centrally operated procedures were unavailable: resident-registration offices, passport and ID-card offices, vehicle-registration authorities, registry offices, weapons administration and
    school-administration programs; the associations say personal data is not endangered. Mainz and Kaiserslautern reported regular service again on the morning of 09-29, and the data centres expected normal
    operation that Tuesday. The associations did not name the product. heise assessed that the trigger was ''probably'' the IT teams applying Citrix NetScaler updates released that weekend and added that
    connection to its text after publication; Born''s blog draws the same link and reports, from reader messages only, that NRW''s SIT and the city of Potsdam also shut systems down. The transferable point
    is operational: with warnings of two unpatched NetScaler zero-days circulating privately from the weekend of 26-27 September, shared communal hosting was switched off pre-emptively across an entire
    federal state for about a day and a half, which is the failure-mode trade-off a Swiss canton or communal IT provider faces for centrally hosted citizen-facing applications.'
