    role: primary
  discovery_trace: 'first seen at: Microsoft Security Blog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ (fetched via tools/fetch_source.py feed) -> primary: https://www.microsoft.com/en-us/security/blog/2026/09/29/beyond-source-code-a-path-to-the-keys-to-the-kingdom/
    (blog also links the Q3 2026 Cyberattack Series report PDF, fetched via the pdf transport: https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/bade/documents/products-and-services/en-us/security/Cyberattacks-Series-Report-Q3-2026.pdf;
    its readable text repeats the blog and adds the SSPR-monitoring guidance)'
  summary: 'Microsoft''s Defender Experts incident-response team (DART) describes a malware-less, exploit-less intrusion by Storm-3068 (Microsoft''s designator; no attribution offered) in its Q3 2026 Cyberattack
    Series report and blog of 2026-09-29. The actor obtained access to a user account through a successful self-service password reset (SSPR) and then took full control of the identity by registering its
    own authentication methods; the sources do not say how the reset challenge was passed. With that persistent access it used legitimate administrative tools and scripts to enumerate Azure DevOps repositories,
    projects, pipelines and deployment environments, then created a malicious pipeline that deployed a kube agent and jobs harvesting kubeconfig files, the pipeline being authorised to access more than
    50 resources. It also modified pipeline scripts to install the Atera remote-management agent and download the Chisel tunnelling utility, which was used to proxy Kubernetes API traffic and open a reverse
    tunnel to an external address, and it committed seven stolen kubeconfig files to a repository. Investigators reconstructed the sequence from Azure DevOps audit logs and Git version history. Microsoft''s
    recommendations: monitor SSPR activity for high volumes of resets from one IP address or against many users, keep administrative and privileged accounts out of SSPR or protect them with strong (phishing-resistant)
    authentication, enforce branch protection and pull-request approvals, restrict direct commits to critical branches, limit who can create, modify or execute pipelines, and apply least privilege across
    identity, DevOps and cloud. Not stated: victim sector or region, dates, and whether the actor actually used the stolen cluster credentials.'
