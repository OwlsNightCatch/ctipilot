- title: Phishing delivers a legitimately signed MSP360 RMM installer that silently pulls in ScreenConnect as a redundant channel; a Faronics agent was used the same way
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
    publisher: Microsoft Defender Experts
    date: '2026-09-29'
    role: primary
  discovery_trace: 'first seen at: Microsoft Security Blog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ (fetched via tools/fetch_source.py feed) -> primary (no pivot needed): https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/'
  summary: 'Microsoft Defender Experts (2026-09-29) describe July 2026 phishing campaigns across industries that deliver a legitimate, digitally signed MSP360 RMM 2.5.0.67 installer under deceptive file
    names (meeting invitations, Zoom/Google Meet and Adobe Acrobat installers, RSVP e-cards, job offers, signature requests, DHL notices and an ''SSA.GOV statement'' name). Landing pages impersonate document-sharing,
    invitation, Adobe and Zoom pages, and the payload is hosted on attacker infrastructure, compromised websites and legitimate services (Amazon S3, Cloudflare R2, Dropbox, GitLab, Supabase), so infrastructure
    rotates while the installer stays the same. After UAC elevation the installer registers two Windows services, adds autorun entries and an inbound UDP allow rule for the agent in Windows Firewall; the
    newly installed RMM agent then launches PowerShell that downloads ClientSetup.msi and installs ConnectWise ScreenConnect silently (msiexec /qn), giving the actor a second, independent remote-access
    channel. Through ScreenConnect''s RunFile function the actor staged and ran tools from a ScreenConnect temp directory under the user''s Documents (or OneDrive Documents): utilities that hide the mouse
    cursor, banners and control-panel entries, executables named like Windows Security, Defender or Phone Link components, and browser password/bookmark viewers, supporting credential access and information
    collection. Separate July activity used Faronics Deploy Agent as the first RMM before dropping ScreenConnect. Microsoft did not observe exploitation of ScreenConnect itself, and the activity is unattributed.
    Failed UAC elevation ended the installation before persistence was set, which is a natural blocking point.'
