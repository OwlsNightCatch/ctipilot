    -> corroboration: GreyNoise https://www.greynoise.io/blog/swarming-against-citrix-0-day-exploitation, BleepingComputer https://www.bleepingcomputer.com/news/security/hackers-exploit-citrix-netscaler-zero-day-to-deploy-web-shells/,
    watchTowr https://labs.watchtowr.com/here-we-go-again-citrix-netscaler-dtls-preauth-memory-overflow-cve-2026-88772/'
  summary: 'Mandiant Consulting and GTIG (2026-09-29) report in-the-wild exploitation of CVE-2026-88772, the NetScaler ADC/Gateway pre-authentication DTLS memory-corruption flaw, with the earliest exploitation
    known to Mandiant on 2026-09-03, roughly three weeks before Citrix''s 2026-09-27 bulletin. Mandiant says dozens of organizations in North America and Europe (government, financial services, technology,
    education, telecom, legal and professional services) were likely impacted, attributes the campaign to ''advanced and suspected state-sponsored threat actors'' without naming a cluster, holds no exploit
    code, and warns that new evidence may widen the timeline. Exploitation is delivered over UDP/443 as malformed or fragmented DTLS handshake records that corrupt heap memory in the packet processing engine
    (NSPPE) and run shellcode as root on the FreeBSD base; it leaves a DTLSv1.0 ''Handshake failure-Internal Error'' SSL log line and NSPPE ''exit with orphan rings'' plus ''pitboss ... NOT restarting NSPPE''
    entries in /var/log/messages. Post-exploitation, an installer web shell rewrites /etc/httpd.conf so non-script extensions (.deb, .sig) run as PHP, in one variant with an AliasMatch that maps requests
    for /vpn/media/*.ico onto .sig files in the client-plug-in scripts directory; sets the setuid bit on /bin/sh to keep root for later web-service requests; scrubs its own path from /etc/crontab; and reboots
    the appliance to apply the change. Commands ride in custom HTTP request headers as Base64 and answers come back under spoofed 404 responses. Two custom tools follow: WHIPSHOT, a PHP web shell, relays
    over loopback to SLAPSHOT, a Python TCP tunneler (JSON open/push/pull/exch/close/ping actions, single-instance file lock, idle self-exit) that Mandiant saw used for internal reconnaissance and credential
    theft in at least one intrusion. GreyNoise separately caught a 2026-09-24 attempt on a Swarm sensor showing the same setuid-plus-handler playbook (a hidden PHP file routed through a fake CSS alias)
    with no foothold gained, and watchTowr published its own technical analysis of the DTLS overflow on 2026-09-29. Mandiant expects broad opportunistic exploitation by a variety of actors, and states that
    edge devices without EDR coverage remain the preferred access point.'
