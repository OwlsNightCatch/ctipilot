  extended_notes: 'Recency caveat: Microsoft published 2026-09-28T15:00Z, about eleven hours before the 26 h window opens; The Hacker News (09-29 00:05Z), Infosecurity Magazine (09-29 13:30Z) and Dark Reading
    (09-29 15:12Z, listed in their feeds, not fetched) covered it inside the window and no store entry covers it. It sits inside the 72 h developing window; the composer may treat it as first coverage.
    Detection concepts: image-load events where a signed application in an unusual folder (ProgramData subdirectories, Program Files\Poedit) loads an unsigned DLL from its own directory whose name matches
    a common library (WinSparkle, libcurl, vim64, dbghelp, jli, nvml); a same-named extensionless or unusual-extension archive beside the DLL; DLL files named dnsapi.dll or ws2_32.dll outside System32;
    Impacket-style remote execution and file copy from a share preceding first execution; outbound HTTPS followed by a WebSocket upgrade carrying a system-information cookie and an outdated Firefox user
    agent. Hardening: block/alert on unsigned DLL loads by signed apps outside standard install paths (WDAC/App Control), restrict SMB write access to shares used for staging, EDR block mode, network protection.
    Benign lookalike: legitimate portable installations of Poedit/curl/Vim/TightVNC (discriminators: signature on the DLL, install path, presence of an unexplained archive). Connection to the DAEMON Tools
    compromise that the store already tracks (EU governments were targeted there): Microsoft''s link is analytic (indicator pivot), not proof of shared operators.'
