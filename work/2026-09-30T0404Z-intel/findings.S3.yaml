    source_url: https://cyberscoop.com/citrix-netscaler-zero-day-attacks-three-weeks-undetected/
  extended_notes: 'Update of the existing 2026-09-28 NetScaler entry: adds Mandiant''s earliest-exploitation date (09-03, versus GreyNoise''s 09-24 sighting and Citrix''s 09-27 disclosure), the named post-exploitation
    toolkit, the concrete persistence mechanism and the hunting/containment guidance. Overlaps S1''s domain; surfaced because the primary is in-window and materially changes the compromise-assessment scope
    (analyst inference: an appliance patched after 09-27 may already have been compromised, since exploitation began at least three weeks earlier). Detection concepts by telemetry class: appliance configuration
    integrity (httpd.conf AddHandler/AddType/AliasMatch entries pointing non-script extensions or /vpn/media, /vpn/theme, /vpn/images paths at script directories); file inventory of client plug-in and web-asset
    directories (any ASCII/PHP file where only compiled clients or static assets belong); web access logs (404s with large response bodies or long processing time on media/script paths; truncated-line gaps
    consistent with a log wiper); httperror logs (parse errors for disguised extensions); shell history (nsshutdown -R, httpd -k restart outside change windows); process listing (Python with nohup and a
    loopback pointer file in /tmp); SUID bit on /bin/sh. Mandiant''s containment order: patch to 14.1-73.37+ / 13.1-64.23+ (FIPS/NDcPP variants have their own builds), isolate suspected nodes, halt HA configuration
    sync until both nodes are validated (a compromised node can replicate a modified httpd.conf), default-deny egress from the appliance, VM snapshot with memory before reboot, then rotate credentials only
    after patching (LDAP bind, RADIUS, TACACS, SNMP, NITRO/API, TLS keys) and terminate active Gateway/ICA sessions; audit StoreFront, Delivery Controllers and downstream hosts for interactive logons, RDP
    and credential dumping. Interim controls (CVE-2026-88772 only): disable DTLS where not needed and block inbound UDP/443 upstream of the appliance rather than with local ACLs. Not stated by Mandiant:
    victim names, the actor cluster, whether CVE-2026-88771 and CVE-2026-88772 are used by the same operator (CyberScoop notes it is unclear). Source ratings: Mandiant/GTIG first-hand IR telemetry (B/A),
    corroborated by independent GreyNoise sensor data.'
- title: 'ANSSI''s DGFiP incident report: infostealer-grade staff passwords on password-only portals, an unsegmented inter-ministry network and a SOC whose password reset left the attacker''s session open'
  sources:
  - url: https://cyber.gouv.fr/actualites/lanssi-publie-le-rapport-dincident-sur-les-cyberattaques-ayant-touche-la-dgfip/
    publisher: ANSSI (cyber.gouv.fr)
