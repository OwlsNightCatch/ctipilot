    role: corroborating
  discovery_trace: 'first seen at: Microsoft Security Blog feed, URL https://www.microsoft.com/en-us/security/blog/feed/ (fetched via tools/fetch_source.py feed) -> primary: https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
    -> corroboration: CyberScoop https://cyberscoop.com/microsoft-star-blizzard-redflick-phishing-campaigns/, The Hacker News https://thehackernews.com/2026/09/russias-star-blizzard-targets-100.html'
  summary: 'Microsoft Threat Intelligence (2026-09-29) reports that the Russian FSB Center 18-attributed actor it tracks as Star Blizzard (attribution per CISA advisory AA23-341A, cited by Microsoft) moved
    in 2026 from purely targeted spear-phishing to also running at least 13 large-scale campaigns of tens to hundreds of emails each, which Microsoft assesses reflects a mass-mailing platform. Targets are
    NGOs, think tanks, governments, diplomatic and multilateral bodies, financial organisations and Ukrainian users; Microsoft counts over 100 affected organisations, primarily in the US and UK, and names
    no Swiss victim. Lures are invitations to closed-door roundtables that borrow real think-tank names (IISS, Atlantic Council, Chatham House and others), often written to look like internal mail from
    the target''s own organisation; the first mail has no attachment, and on reply the actor sends a password-protected RAR/ZIP with the password shown as an image. Since March the sending accounts sit
    on WordPress and cPanel sites that Microsoft assesses with high confidence the actor compromised, replacing free Proton/Microsoft consumer mailboxes. The delivery chain changed three times: mid-January
    a VHDX in the ZIP whose LNK impersonates a PDF, runs a hidden BAT, and abuses ssh.exe with PermitLocalCommand to fetch an MSI that creates a scheduled task launching control.exe against a remote Control
    Panel applet (the CosmicPulse downloader, publicly NOROBOT/BAITSWITCH, which installs the Python backdoor CosmicPulse, publicly YESROBOT, with its AES key stored under an HKCU\Software\Classes registry
    key); from April three scheduled tasks named to resemble network components, one executing a remote payload through a WebDAV UNC path; from July an LNK that uses conhost.exe and curl to download a decoy
    PDF whose embedded Base64 blob (found by a magic header) is decoded by PowerShell to fetch the next MSI. This ''RedFlick'' flow replaces the ClickFix chains used through 2025 and needs one user interaction.
    One March campaign instead delivered a link to the DarkSword iOS exploit kit, which Microsoft says Proofpoint reported. Attribution, tooling names and the mass-mailing-platform inference are Microsoft''s;
    CyberScoop lists SEABORGIUM, Callisto Group, TA446 and COLDRIVER as other names for the actor.'
