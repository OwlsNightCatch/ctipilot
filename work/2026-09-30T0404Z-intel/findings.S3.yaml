    it to a dotted IP, so rules matching dotted addresses miss it), decodes two layers of integer-array obfuscation in memory, and silently installs an MSI (msiexec /qn) disguised as an ''Advanced Printer
    Configuration Reader'' that is hidden from Programs and Features. The MSI launches a legitimately Canon-signed application from a fake product folder under %LOCALAPPDATA%\Programs, which sideloads a
    patched Canon DLL importing a malicious DLL; that DLL decodes a loader hidden in a WAV file (valid RIFF header, ciphertext after an offset), whose position-independent shellcode patches AMSI, hosts
    the .NET CLR in memory, unhooks ntdll and checks for VM drivers before decrypting a homemade encrypted archive of 1,128 entries that holds a persistence script and a RAT (remote desktop, audio and camera
    capture, file search, host recon, additional payloads). Persistence is an HKCU Run value plus a scheduled task, both named ''Canon Configuration Reader''. Huntress'' SOC responded to at least 40 incidents
    from the Google Sites domain and confirmed two came through a Custom GPT; OpenAI removed the first GPT by 2026-09-25, a second linked to the campaign was live on 09-27 and still active when Huntress
    published. A later wave swapped the host application to a Stardock-signed one and the server also hosted a third installer name, so Huntress expects further signed-application costumes. Huntress notes
    the earlier variants of this abuse pattern (shared ChatGPT/Grok conversations, Claude artifacts) and that these lures typically live hours to days before takedown; the malicious instructions sit on
    the legitimate chatgpt.com domain.'
