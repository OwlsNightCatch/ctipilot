- title: MCP Python SDK OAuth client can be steered by a malicious MCP server into sending its client secret, authorization code and PKCE verifier to an attacker's token endpoint (GHSA-qx49-fqc8-xw99)
  sources:
  - url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-qx49-fqc8-xw99
    publisher: MCP Python SDK maintainers (GitHub Security Advisory)
    date: '2026-09-28'
    role: primary
  - url: https://cycode.com/blog/mcp-python-sdk-oauth-account-takeover/
    publisher: Cycode
    date: '2026-09-28'
    role: primary
  - url: https://thehackernews.com/2026/09/official-mcp-python-sdk-flaw-can-let.html
    publisher: The Hacker News
    date: '2026-09-29'
    role: corroborating
  discovery_trace: 'first seen at: The Hacker News feed, URL https://feeds.feedburner.com/TheHackersNews (fetched via tools/fetch_source.py feed) -> pivot: The Hacker News article https://thehackernews.com/2026/09/official-mcp-python-sdk-flaw-can-let.html
    -> primary: GitHub advisory https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-qx49-fqc8-xw99 and discoverer write-up https://cycode.com/blog/mcp-python-sdk-oauth-account-takeover/'
  summary: 'The maintainers of the official MCP Python SDK published advisory GHSA-qx49-fqc8-xw99 (2026-09-28; discovered and written up by Cycode) for a flaw in the SDK''s OAuth client (mcp.client.auth):
    the authorization-server metadata issuer was not validated on every discovery path and stored or pre-provisioned client credentials were not bound to the authorization server they belong to. A malicious
    or compromised MCP server can therefore name its own authorization server, or serve metadata presenting the user''s real server as issuer while pointing the token endpoint elsewhere, and receive the
    client_secret, authorization code and PKCE code_verifier (or a signed client assertion for the private-key-JWT provider) meant for the real login service, which lets it obtain a valid access token;
    with the interactive provider the user still sees the genuine login page. Affected: SDK 1.9.1 through 1.29.1 on every path and 2.0.0 through 2.1.1 when the server publishes no protected-resource metadata
    or answers 403 insufficient_scope, for applications using the HTTP MCP client with OAuthClientProvider, ClientCredentialsOAuthProvider, PrivateKeyJWTOAuthProvider or the deprecated 1.x RFC7523OAuthClientProvider
    that may connect to servers they do not fully control; MCP servers built with the SDK, stdio clients and clients that attach their own tokens are not affected. Fixed in 1.30.0 and 2.2.0, but for the
    client-credentials and private-key-JWT providers upgrading changes nothing until the application passes issuer= explicitly (the warning is a DeprecationWarning that Python hides by default), and the
    deprecated 1.x provider has no such option. Rated CVSS 7.5 for the unattended providers and 6.5 for the interactive one; The Hacker News reports no CVE assigned as of 2026-09-29. No exploitation in
    the wild is reported.'
  region_nexus: global; developer tooling for AI-agent integrations
  primary_sector_nexus: indirect
  sector:
  - technology
  cves: []
  techniques:
  - T1528
  affected_products:
  - MCP Python SDK (mcp)
  entity_keys:
  - product:model-context-protocol-mcp
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  borderline: true
  borderline_reason: AI-integration library flaw with no CVE and no exploitation; relevant only to organisations building MCP clients against third-party servers; upgrade plus issuer= is the whole task
  evidence:
  - quote: A malicious or compromised MCP server could therefore direct them to a token endpoint of its choosing
    attribution: MCP Python SDK maintainers
    source_url: https://github.com/modelcontextprotocol/python-sdk/security/advisories/GHSA-qx49-fqc8-xw99
  - quote: No CVE had been assigned as of September 29.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/09/official-mcp-python-sdk-flaw-can-let.html
  - quote: A malicious MCP server tricked the SDK into sending login credentials to the attacker instead of the real login provider.
    attribution: Cycode
    source_url: https://cycode.com/blog/mcp-python-sdk-oauth-account-takeover/
  extended_notes: 'Detection/hardening concepts: inventory applications using the mcp package as an HTTP client with OAuth providers; pin the authorization server (issuer=) for machine-to-machine providers;
    clear stored OAuth client registrations once after upgrading because older ones are not bound to an issuer; rotate client secrets and signing keys for any client that connected to a server outside your
    control; egress logging for token-endpoint hosts that differ from the configured identity provider.'
