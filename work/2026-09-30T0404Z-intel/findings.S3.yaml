    process-creation with powershell.exe launching msiexec.exe /i on a GUID-named MSI in %TEMP% with /qn /norestart; a signed third-party application executing from a product folder under %LOCALAPPDATA%\Programs
    that is not a real vendor install, especially when msiexec started it; an HKCU Run value and scheduled task that share one name and reappear when deleted; unsigned DLLs (or one with a mismatched header
