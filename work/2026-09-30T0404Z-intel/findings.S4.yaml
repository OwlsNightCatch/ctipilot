    summary: |
      The Municipio of Manno (Ticino) published a signed notice on 2026-09-16 stating that on
      4 August 2026 part of the commune's servers suffered a cyberattack that resulted in encryption of the data.
      The commune isolated the affected server; per the notice (text is font-shifted in the PDF and was decoded
      by us) data and operations were restored "nel corso del pomeriggio" (within that afternoon) from existing
      backups. The case was reported to the competent authorities and a criminal complaint against persons unknown
      was filed; the notice tells residents to be wary of unexpected letters/e-mails demanding urgent payments or
      personal/financial data and to verify via official channels. The notice names no actor, access vector, data-theft
      finding or ransom demand. On 2026-09-28 (about seven weeks after the encryption) the SafePay extortion group
      listed manno.ch on its leak site (Ransomware.live discovery timestamp 2026-09-28 08:34 UTC); the tracker shows
      no data volume or samples. Per WebSearch result text of an inside-it.ch article dated 2026-09-29 (unfetchable,
      not citable), SafePay claims an unspecified dataset from the administration and threatens publication within
      three to four days, i.e. roughly 2026-10-01/02 — treat as an unverified claim by the criminals; the commune's
      own statement says nothing about exfiltration. Ransomware.live lists 578 SafePay claims since 2024-11-19, of
      which 8 Swiss; five of those Swiss listings fall in September 2026: ara-lyss.ch (2026-09-15; the Gemeindeverband
      ARA-Region Lyss-Limpachtal wastewater-treatment operator, canton Bern — no victim statement or press pickup
      found; ara-lyss.ch itself returns 403 to every transport), stoecklin-kuechen.ch (2026-09-15), and lfgholding.com,
      bio-strath.com and manno.ch (2026-09-28). Those other Swiss listings are claim-only and are NOT asserted here.
