    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, 'Automated AI agent used to breach cybersecurity nonprofit DIVD', 2026-09-29 11:39) -> BleepingComputer article URL https://www.bleepingcomputer.com/news/security/automated-ai-agent-used-to-breach-cybersecurity-nonprofit-divd/ -> primary: DIVD post https://www.divd.nl/newsroom/articles/when-no-if/ and DIVD LinkedIn update https://www.linkedin.com/posts/in-every-crisis-you-work-with-whatever-you-share-7510363577375993856--zPB/ (both fetched via extract)"
    summary: |
      Backlog row (j) waited for DIVD's promised technical follow-up. DIVD's 2026-09-28 update (LinkedIn) adds: the
      team has "a pretty good idea of how they got in, by exploiting a technical vulnerability", but cannot share
      details because that could interfere with the investigation or create more victims, and it was "not Citrix
      Netscaler"; there is no link to any known public threat actor or to a former volunteer; worst-case scenarios
      (targeted crown-jewel theft vs smash-and-grab) cannot be excluded yet. DIVD describes the attack as "loud and very
      very messy": an agent that decided each next step itself at machine speed, with "sloppy logic", which
