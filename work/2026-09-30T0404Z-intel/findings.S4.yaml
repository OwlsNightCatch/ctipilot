    extended_notes: |
      Behavior/telemetry for the entry's Triage line: the actor's claimed chain (extract the Ruby application
      'master key', forge a session cookie, obtain remote code execution) is consistent with a signed/encrypted
      session-cookie secret being recoverable through injection, but no source names the framework or confirms the
      chain; the victim's own remedy list (rotation of application keys and service passwords, new application servers)
      is at least consistent with secret theft.
      Hunt/hardening concept (class level, derived from the claimed mechanism — not source-stated): rotate the application secret and invalidate all sessions after any SQLi
      exposure; monitor for sessions signed with the rotated-out secret, unusual PDF-renderer/child-process spawns from the
      web app, and long-duration timing-probe request patterns against a single parameter in access logs. Defender
      relevance for public-sector reader: any SaaS invoicing/accounting supplier's token and bank-account data can seed
      invoice-fraud (bank-detail-change) against the supplier's customers — Fakturownia itself warns of this.

