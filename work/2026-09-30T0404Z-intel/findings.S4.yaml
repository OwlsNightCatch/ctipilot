    summary: |
      ABC News (2026-09-29), quoting a U.S. defense official, reports that the DMDC breach affected 2.76 million living
      people and another 294,000 who are deceased (about 3.05 million), replacing the second-hand 'approximately
      four million' that two unnamed people gave Military Times and which the existing entry carries as the only scale
      figure. The official's statement describes 'unauthorized access of personally identifiable information by a small
      number of unauthorized users between October 2025 and July 2026', immediately remediated on discovery; DoD sees no
      evidence of misuse and offers identity-protection and credit-monitoring resources. ABC repeats that DMDC holds more
      than 60 million personnel records and that the exposed files included job details of military and civilian
      personnel. No vulnerability class, access vector or actor has been disclosed. The same ABC piece adds that the FBI
      sent employees a notice on 2026-09-25 saying it is operating as if every FBI employee's personal information was
      compromised in the fbijobs.gov breach and has begun notifying affected employees (already-covered separate entry).
