recipe_notes_for_sources_json:
  - "ransomware-live: besides /v2/recentvictims, `https://api.ransomware.live/v2/recentcyberattacks` (records with press title/summary/link/added date) and `https://api.ransomware.live/v2/groupvictims/<group>` (full per-group history, e.g. safepay = 578 records) work via `fetch_source.py url`; recentcyberattacks surfaced FTAPI (press-confirmed) that recentvictims did not, so it is the better nexus filter for confirmed incidents."
  - "zaufana-trzecia-strona: bridge `url` on the homepage lists posts with dates (text) and hrefs (/post/<slug>/); `extract <post-URL>` reads article bodies cleanly. Recipe confirmed 2026-09-30."
  - "piyolog: `extract https://piyolog.hatenadiary.jp/archive` gives dated one-paragraph summaries of the newest ~20 posts; homepage extract returns only the top post."
  - "ico-uk: sitemap recipe confirmed; https://ico.org.uk/sitemap.xml (5.2 MB) via `url --direct`; filter loc by /news-and-blogs/2026/ and /enforcement/2026/ against lastmod."
