    summary: |
      Fakturownia (a large Polish cloud invoicing/accounting service) published a notice on 2026-09-29 stating it
      detected unauthorised access to its servers on 2026-09-28 after "an unauthorised person exploited a
      vulnerability in the system"; it blocked access, is rotating application keys and service passwords, launched new
      application servers, engaged external specialists and reported to the police cybercrime bureau (CBZC), CERT
      Polska and the data-protection president. Data that may have been accessed: account data of all users and their
      counterparties, invoices issued before 2023 (partly), password hashes, session/API/integration tokens generated
      by Fakturownia, bank accounts and payment data, and application system keys and passwords; KSeF (national
      e-invoicing) integrations, other integrations and card data were not affected, and no data was deleted (all
      victim statements). Zaufana Trzecia Strona (which the actor uses as its contact point) received 'credible
      information' that the same actor 'Fingerprint' behind the two medical-sector breaches (MyDr, Medyc) is responsible,
      saw three screenshots supporting access (application folder, a customer-list slice, an exported-database file
      listing) and relays the actor's own claims: 6 TB of invoices stolen (ZTS could not verify) and an entry chain of a
      time-based oracle to extract the Ruby application master key, then a forged cookie giving remote code
      execution — ZTS's own reading is that this is probably time-based blind SQL injection. The actor says it did not
      wipe logs so the company could learn. Caveat: ZTS's paraphrase of the notice lists 'additional safeguards including
      PDF generation', a phrase absent from the notice text fetched at 04:30Z on 2026-09-30 (the page may have been
      edited). Sector nexus is Poland/EU SaaS supplier to SMEs; no Swiss or public-sector customer link is stated.
