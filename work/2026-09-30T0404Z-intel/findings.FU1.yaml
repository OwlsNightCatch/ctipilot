not_established:
  - "SafePay's CLAIM OF STOLEN DATA in the criminals' own words: the leak-site post carries no dataset description in any captured tracker artefact (screenshot / API / record page). The only assertion that SafePay 'claims to have stolen an unspecified dataset from the administration' comes from inside-it.ch (2026-09-29), whose article body could not be read (HTTP 429 Vercel checkpoint on extract/WebFetch this pass too; jina pool exhausted; web.archive.org / archive.ph connection reset by the egress proxy). It is known only from WebSearch result summaries (3 differently-worded queries returned the same summary: 'claiming to have stolen an unspecified dataset ... threatens to publish within three to four days on the Darknet') — a search-engine paraphrase, not a fetched-page quote, so it must NOT be cited or quoted."
  - "A second, independent readable outlet for the theft claim / deadline: none. Every WebSearch (IT/DE/FR, RSI/tio/CdT/laRegione/ticinonews/Netzwoche/watson/20min/SRF) returned inside-it as the only article on Manno + SafePay. The tio.ch 'attacco informatico' topic page lists no Manno item. RSI/tio/CdT/laRegione feed and search-page probes returned nothing (guessed feed/search URLs 404 or JS shells — a recipe gap, not a source finding)."
  - "The stated publication deadline as text: only E1 (timer in an image) and the inside-it paraphrase ('drei bis vier Tage'). Consistent with each other (3d 11h at capture, i.e. ~3.5 days) but neither is a citable text quote."
  - "Whether data was actually exfiltrated, what dataset, and whether SafePay published after the countdown: unknown; the timer expires ~2026-10-01, i.e. after this run."
  - "Whether the commune knew of/commented on the SafePay listing: no statement found."
