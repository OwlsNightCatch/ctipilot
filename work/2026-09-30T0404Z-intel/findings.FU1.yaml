items:
  - title: "Manno (TI) — follow-up on SafePay listing: countdown visible on the leak post; theft claim and deadline text not independently readable"
    novelty: "update-of:2026-09-30/manno-ti-commune-ransomware-safepay-claim"
    verification: "SINGLE-SOURCE-OTHER (tracker screenshot + tracker API; inside-it corroborates only the encryption/ransomware label via RSS)"
    confidence: MEDIUM
    sources:
      - { url: "https://api.ransomware.live/v2/searchvictims/manno", publisher: "Ransomware.live API", date: "2026-09-28", role: "primary" }
      - { url: "https://www.ransomware.live/id/bWFubm8uY2hAc2FmZXBheQ==", publisher: "Ransomware.live", date: "2026-09-28", role: "primary" }
      - { url: "https://images.ransomware.live/victims/f3088f998bbeff85d009320e373f4c58.png", publisher: "Ransomware.live (leak-post screenshot)", date: "2026-09-28", role: "corroborating", note: "image; not a text quote" }
      - { url: "https://www.inside-it.ch/rss.xml", publisher: "inside-it.ch (RSS teaser)", date: "2026-09-29", role: "corroborating", note: "encryption/ransomware label only" }
      - { url: "https://www.manno.ch", publisher: "Comune di Manno", date: "2026-09-29", role: "corroborating", note: "no update after 16 Sep notice" }
    summary_suggestion: |
      What may be stated (facts): the SafePay leak-site post for manno.ch shows a countdown timer (about 3 d 11 h at the time ransomware.live captured it on 2026-09-28) and a purely generic description of the commune; the tracker records no data volume and no press link. inside-it.ch (2026-09-29) describes the incident as ransomware by a "Ransomware-Bande" and the commune restoring from backup. A theft claim by SafePay ("unspecified dataset") and a "three to four days" publication window are reported by inside-it per search-result summaries only — the article body was unreadable to this pipeline — so the entry should either omit them or state them as "reportedly (inside-it.ch, not read in full)". Do NOT put the inside-it paraphrase in quotation marks or Evidence.
      Defender takeaway supported by fetched evidence only: a countdown means the criminals are running double-extortion pressure; the timer expires ~2026-10-01, so watch for a data-publication event on the next fires. Whether data was exfiltrated is unconfirmed by the commune.
    entity_keys: ["actor:safepay", "incident:manno-ti-commune-ransomware-2026-08"]
    borderline: false
