  item: "2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning"
  url_or_quote: "The release does not say whether self-hosted instances need customer-side action, so the written question to Kiteworks Support is the open task."
  summary: "(low confidence) Kiteworks' 2026-09-27 release, already cited in the 2026-09-29 update, carries the notice 'Customers with self-hosted Advanced Forms should contact Customer Support for assistance.' The 2026-09-30 takeaway and actions[0] never mention this direct vendor instruction; true for the 2026-09-28 release quoted, but the action could cite the 27 September notice instead of framing the support question as the entry's own idea."
