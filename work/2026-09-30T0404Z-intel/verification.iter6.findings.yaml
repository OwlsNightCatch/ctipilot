  item: "2026-09-30/star-blizzard-redflick-cosmicpulse-single-click-chain"
  url_or_quote: "Since March the sending accounts sit on WordPress and cPanel websites, replacing free Proton and Microsoft consumer mailboxes"
  summary: "(low confidence) Microsoft scopes the compromised-website senders to the large-scale campaigns and says the actor 'also continues using email from free providers such as Proton ... particularly in Evilginx spear-phishing operations observed throughout 2026'; 'replacing' reads as actor-wide. Likewise the frontmatter summary attaches 'sent from accounts on compromised WordPress and cPanel websites' and think-tank invitations to 'at least 13' campaigns, although the January-February campaigns targeted Ukr.net users with tax-audit and fine lures and the websites appear only from March. Advisory wording tweak (add 'in these campaigns')."
