  item: "2026-09-30/storm-3068-sspr-azure-devops-kubeconfig-theft"
  url_or_quote: "build-agent egress shows a reverse tunnel to an external address ([Microsoft Defender Experts, 2026-09-29](https://www.microsoft.com/en-us/security/blog/2026/09/29/beyond-source-code-a-path-to-the-keys-to-the-kingdom/))"
  summary: "(low confidence) The blog and the Q3 2026 PDF say Chisel commands 'establish a reverse tunnel to an external IP address' and 'reverse tunnels to external infrastructure'; neither names build-agent egress as the place it surfaces. It is a reasonable detection inference but is cited as if Microsoft's; consider marking it as the entry's own reading or dropping the vantage point."
