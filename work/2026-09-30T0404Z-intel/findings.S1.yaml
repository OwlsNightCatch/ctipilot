    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev; catalog 2026.09.29, dateAdded 2026-09-29, CVE-2026-86950) and mechanical diff in work/2026-09-30T0404Z-intel/kev-window.txt -> pivot: apple-security, URL https://support.apple.com/en-us/100100 (release index: iOS/iPadOS 26.7.1, macOS Tahoe 26.7.1, macOS Sequoia 15.8.1 rows with CVE entries; iOS/macOS/watchOS/visionOS 27.0.1 'no published CVE entries') -> primary: Apple advisories, URLs https://support.apple.com/en-us/149226 , https://support.apple.com/en-us/149228 , https://support.apple.com/en-us/149229 -> corroborating: SecurityWeek (WebSearch 'CVE-2026-86950 Apple out-of-bounds write exploited') URL https://www.securityweek.com/apple-patches-meta-reported-zero-day-linked-to-extremely-sophisticated-attack/ ; The Hacker News URL https://thehackernews.com/2026/09/apple-patches-coregraphics-flaw.html ; ENISA EUVD record EUVD-2026-88445 via bridge enisa-euvd (exploited list)"
    summary: |
      Facts (Apple advisories, released 2026-09-28): CVE-2026-86950 is an out-of-bounds write (CWE-787) in the
      CoreGraphics component; "processing a maliciously crafted file may lead to arbitrary code execution". Apple
      states it "is aware of a report that this issue may have been exploited in an extremely sophisticated attack
      against specific targeted individuals on versions of iOS before iOS 27". Fixed with improved bounds checking in
      iOS 26.7.1 / iPadOS 26.7.1 (iPhone 11 and later; iPad Pro 12.9-inch 3rd gen+, Pro 11-inch 1st gen+, Air 3rd gen+,
      iPad 8th gen+, mini 5th gen+), macOS Tahoe 26.7.1 and macOS Sequoia 15.8.1. Credit: Meta Product Security.
      CISA added the CVE to KEV on 2026-09-29 (due 2026-10-02, three days; the KEV row carries forensicTriage=Yes,
      i.e. CISA's BOD 26-04 forensic-triage requirement applies). ENISA EUVD records EUVD-2026-88445, CVSS 3.1 8.8
      (AV:N/AC:L/PR:N/UI:R), EPSS 0.81, exploited-since 2026-09-29.
      What the sources do NOT say: delivery vector, number of victims, first exploitation date, whether macOS was
      actually attacked (Apple's exploitation sentence is phrased about iOS), and whether iOS 18.x / older-branch
      devices or macOS Sonoma are affected (no fix is listed for those branches; absence of a listing is not a
      statement of non-exposure). The iOS 27 / macOS Golden Gate 27 releases (2026-09-14) and the 27.0.1 updates list
      no fix note for this CVE; SecurityWeek reads that as iOS 27 / Golden Gate 27 not being affected (SecurityWeek's
      assessment, consistent with Apple's "before iOS 27" wording).
      Claims/inferences (attributed): SecurityWeek infers that because CoreGraphics does 2D graphics and PDF rendering,
      the file could arrive via web pages, email attachments or messaging apps where automatic previews could allow
      zero-click exploitation (inference, no delivery evidence published). Meta told SecurityWeek it routinely reports
      third-party bugs and did not say whether WhatsApp was involved; SecurityWeek notes the 2025 precedent of a
      WhatsApp flaw chained with an Apple ImageIO zero-day (CVE-2025-55177 + CVE-2025-43300).
      Defender takeaways: attack class is a file-parsing client-side exploit against a mobile OS used by targeted
      individuals (mercenary-spyware profile); no IOCs or behavioural detections have been published by Apple, Meta
      or CISA, so the actionable lever is version compliance. Telemetry: MDM / device-inventory OS-version reports
      for iPhone/iPad still on the iOS 26 branch below 26.7.1 (iOS 27 is stated as outside the exploited range) and
      Macs on Tahoe below 26.7.1 / Sequoia below 15.8.1. Devices that cannot leave an older branch (iPhone XS/XR class capped at iOS 18.x)
      have no fix listed - track separately.
      Triage lookalike: none applicable (no behavioural signature published); do not infer compromise from version
      state alone - KEV forensic-triage language is about assessing exposed high-risk users, not about a known
      indicator.
