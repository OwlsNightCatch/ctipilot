  # ---------------------------------------------------------------------------
  # 4. BORDERLINE: WatchGuard AP pre-auth API session + command injection (NCSC-CH advisory 13007)
  # ---------------------------------------------------------------------------
  - title: "WatchGuard AP firmware below 3.4.8: unauthenticated API-session acquisition (CVE-2026-101891) chains with OS command injection in the internal management API (CVE-2026-86102); NCSC-CH advisory, no known exploitation"
    sources:
      - { url: "https://psirt.watchguard.com/CVE-2026-101891/", publisher: "WatchGuard PSIRT", date: "2026-09-28", role: "primary" }
      - { url: "https://psirt.watchguard.com/CVE-2026-86102/", publisher: "WatchGuard PSIRT", date: "2026-09-28", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13007", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-09-29", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec listing WebFetch of https://www.heise.de/security/Alerts (WatchGuard AP item 2026-09-29 07:57) and bridge 'ncsc-csh recent 20' -> primary: NCSC-CH post 13007 (bridge ncsc-csh post 13007, citation URL https://security-hub.ncsc.admin.ch/#/posts/13007) -> primary: WatchGuard PSIRT URLs https://psirt.watchguard.com/CVE-2026-101891/ and https://psirt.watchguard.com/CVE-2026-86102/"
    summary: |
      Facts (WatchGuard PSIRT, published 2026-09-28): an improper access control flaw (CVE-2026-101891) in an internal
      API service on WatchGuard Access Points lets an unauthenticated attacker with network access to the AP obtain a
      valid API session; an OS command injection (CVE-2026-86102) in the internal management API lets an attacker with
      network access execute arbitrary shell commands on the underlying OS. Affected: WatchGuard AP >= 1.0 and < 3.4.8;
      fixed in AP firmware 3.4.8. WatchGuard states it "is not aware of any exploitation of this vulnerability in the
      wild" (both pages); both discovered internally / by named researchers. NCSC-CH (2026-09-29) rates both CVSS 4.0
      9.3, describes the pair as an attack chain (session acquisition then command injection) and lists exploitation
      status as unknown; it also mentions a third flaw (CVE-2026-87969) needing authenticated administrator access to
      the diagnostic CLI, which is not in the WatchGuard pages fetched.
      Prerequisite is network reachability of the AP's management API, not internet exposure by design; the practical
      exposure is wired/wireless client segments or management VLANs where APs are reachable from user devices.
      Defender takeaways: inventory WatchGuard APs and their firmware; move to 3.4.8; keep AP management interfaces on
      an isolated management network. Telemetry: firewall/NetFlow for client-VLAN-to-AP management-port connections,
      AP configuration/audit logs for unexpected API sessions, and unexpected outbound connections from AP
      management addresses.
    region_nexus: "global; WatchGuard hardware appears in Swiss SME and public-sector networks (share not established from sources); Swiss authority advisory published"
