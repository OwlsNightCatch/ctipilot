    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "Pre-auth chain to command execution (CVSS 4.0 9.3) with a Swiss national-authority advisory, but no known exploitation, no public technical detail and AP management planes are usually not internet-exposed - regular patch-cycle territory unless the composer wants the NCSC-CH-advised awareness item."
    evidence:
      - quote: "An improper access control vulnerability in an internal API service on WatchGuard Access Points allows an unauthenticated attacker with network access to the AP to obtain a valid API session."
        attribution: "WatchGuard PSIRT"
        source_url: "https://psirt.watchguard.com/CVE-2026-101891/"
      - quote: "WatchGuard is not aware of any exploitation of this vulnerability in the wild."
        attribution: "WatchGuard PSIRT"
