  # ---------------------------------------------------------------------------
  # 5. BORDERLINE: Zimbra 10.1.21 security release (unauthenticated password-reset code prediction)
  # ---------------------------------------------------------------------------
  - title: "Zimbra Collaboration 10.1.21: unauthenticated password-recovery code prediction (account takeover), WebDAV pre-MFA token acceptance, OnlyOffice-integration RCE and a batch of stored XSS; most CVEs still unassigned"
    sources:
      - { url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories", publisher: "Zimbra Security Advisories (vendor)", date: "2026-09-24", role: "primary" }
      - { url: "https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21", publisher: "Zimbra 10.1.21 release notes (vendor)", date: "2026-09-24", role: "primary" }
      - { url: "https://www.heise.de/news/Groupware-Zimbra-Update-schliesst-zahlreiche-Sicherheitsluecken-11468996.html", publisher: "heise security", date: "2026-09-29", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec listing WebFetch of https://www.heise.de/security/Alerts (Zimbra item 2026-09-29 08:31) -> pivot: heise article WebFetch URL https://www.heise.de/news/Groupware-Zimbra-Update-schliesst-zahlreiche-Sicherheitsluecken-11468996.html -> primary: Zimbra Security Advisories wiki URL https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories and release notes URL https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21 (release date 2026-09-24)"
    summary: |
      Facts (Zimbra advisory table, release 10.1.21 dated 2026-09-24; heise reported it 2026-09-29): the release fixes
      a flaw in the self-service password-recovery mechanism that "could allow an unauthenticated attacker to predict
      recovery codes and reset a user's password" (no CVE yet, reported by Hyunwoo Kim and Himanshu Anand); WebDAV
      authentication now rejects pre-MFA tokens (previously a token issued before MFA completion could reach WebDAV;
      Redtail Technology); two OnlyOffice-integration issues - unauthorized file write leading to remote code execution
      "under specific conditions" and a server-side JavaScript injection letting an authenticated user execute commands
      (the latter credited to the Vatican City State Governorate SOC); several stored XSS in the Classic and Modern web
      clients (two with CVEs, CVE-2026-66911 and CVE-2026-66912, reporter CERT.PL); OpenJDK 17.0.19. CVSS scores and
      most CVE identifiers are still "TBD". No source reports exploitation. heise notes Zimbra is a frequent target of
      criminal and state-intelligence actors (heise's context, not evidence for these bugs).
      Note the store already carries a 2026-08-20 entry on the exploited Zimbra SNMP command injection (CVE-2026-73570,
      fixed 10.1.20); 10.1.21 is the next cumulative release and is required for the password-recovery and WebDAV fixes.
      Defender takeaways: Zimbra operators should move to 10.1.21 (the fixes are in the same cumulative release as the
      earlier 10.1.20 SNMP fix); telemetry: password-recovery / reset-request volume and source-IP patterns on the
      webmail front end, reset events for accounts followed by first logins from new networks, and WebDAV (DAV
      endpoint) access by sessions that never completed MFA.
    region_nexus: "global; Zimbra is used by European public bodies (share for Switzerland not established from sources)"
