    summary: |
      Facts (CISA advisory and CSAF, released 2026-09-29, reporter an anonymous researcher): the RouterOS web
      management service contains an integer underflow (CWE-191) in HTTP request-body handling that is reachable before
      authentication; an unauthenticated network attacker can achieve arbitrary code execution as root or a denial of
      service "using a single crafted request". CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N). CISA states no known public
      exploitation has been reported to CISA. Affected per CISA: RouterOS versions below 7.24; remediation text says
      "update RouterOS to version 7.23 or later" - the two statements are inconsistent (7.23.x is a long-term branch
      below 7.24) and MikroTik's own September security page and the 7.24.3 / 7.23.6 changelogs do not name this CVE
      (they carry generic "www - improve stability" lines), so the exact fixed build per branch is not established from
      primary vendor text. SecurityOnline states fixed releases 7.24.2 and 7.23.4 "also close the MikroTrick flaws" - a
      secondary reading that does not source the mapping. Gap: no vendor advisory, no PoC, no exposure count.
      Context: RouterOS already has an entry for the actively exploited SSH chain (CVE-2026-67279 / CVE-2026-86060,
      fixed 6.49.21 / 7.23.4 / 7.24.2) and the WWW/WWW-SSL and SSH services are the same exposure class; this is a
      distinct CVE in a different service (the WebFig-family unauth file read CVE-2026-67281 is also a separate bug).
      Defender takeaways: the management-plane hardening that already answers MikroTrick (management services only on
      a trusted management network / VPN, WWW/WWW-SSL/SSH/bandwidth-test not reachable from untrusted networks)
