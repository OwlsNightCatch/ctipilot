  # ---------------------------------------------------------------------------
  # 6. BORDERLINE UPDATE-GAP: F5 BIG-IP APM public PoC never reflected in the store entry (outside window)
  # ---------------------------------------------------------------------------
  - title: "UPDATE (store gap, source outside the 72 h window) - F5 BIG-IP APM CVE-2026-94127: watchTowr published the root cause and a working trigger on 2026-09-23; the existing entry has no changelog and never mentions public exploit availability"
    sources:
      - { url: "https://labs.watchtowr.com/is-this-a-joke-in-the-auth-header-f5-big-ip-unauth-heap-overflow-to-rce-cve-2026-94127/", publisher: "watchTowr Labs", date: "2026-09-23", role: "primary" }
      - { url: "https://securityonline.info/exploited-f5-big-ip-rce-vulnerability-poc/", publisher: "SecurityOnline / Daily CyberSecurity", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('watchTowr OR \"public PoC\" CVE-2026-94127 F5 BIG-IP APM OAuth exploit released') -> pivot: SecurityOnline URL https://securityonline.info/exploited-f5-big-ip-rce-vulnerability-poc/ -> primary: watchTowr Labs (found via feed https://labs.watchtowr.com/rss/) URL https://labs.watchtowr.com/is-this-a-joke-in-the-auth-header-f5-big-ip-unauth-heap-overflow-to-rce-cve-2026-94127/"
    summary: |
      Existing entry (2026-09-23, updated_at null, no changelog) reports F5's exploited APM OAuth heap overflow but
      contains no statement on exploit availability. watchTowr's 2026-09-23 write-up reverse-engineers the patch: the
      fix adds a header-size check (0x4100) before copying an Authorization header into a heap buffer on the
      OAuth UserInfo path, so an over-long Authorization header sent to the OAuth UserInfo endpoint overflows the
      buffer on the TMM data plane, and the post shows a route from crash to shell via a TMM restart script.
      SecurityOnline (2026-09-25) states researchers "publicly disclosed full technical details and a working
      proof-of-concept exploit". Effect for defenders: the exploit barrier for a KEV-listed, already-exploited edge
      RCE is gone; exposure is limited to virtual servers with both an APM access policy and an OAuth profile. This is
      outside the 72 h developing window - flagged for the audit/composer as a coverage gap rather than a fresh
      development; no fresh delta found in-window.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-94127]
    techniques: [T1190]
    affected_products: ["F5 BIG-IP Access Policy Manager (APM)"]
    entity_keys: ["product:f5-big-ip-access-policy-manager-apm"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-09-23/cve-2026-94127-f5-big-ip-apm-oauth-heap-overflow-rce"
    borderline: true
    borderline_reason: "Freshest source is 2026-09-23/25 (outside window_hours and developing_window_hours); include only as a low-cost changelog record if the composer/audit wants the entry to carry PoC status."
    evidence:
      - quote: "It is simple: before the patch, there was no size check before copying the value to the heap buffer, and now there is one."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/is-this-a-joke-in-the-auth-header-f5-big-ip-unauth-heap-overflow-to-rce-cve-2026-94127/"

