    discovery_trace: "first seen at: greynoise bridge (python3 tools/fetch_source.py extract https://www.greynoise.io/blog -> 'Swarming Against Citrix 0-Day Exploitation') and rapid7-research feed (https://www.rapid7.com/rss.xml -> Citrix ETR post 2026-09-28, already-covered ground) -> WebSearch ('Citrix NetScaler CVE-2026-88771 exploitation update September 29 2026 attackers compromised appliances') -> pivot: Help Net Security URL https://www.helpnetsecurity.com/2026/09/29/netscaler-zero-day-exploitation-escalates-into-mass-attacks-cve-2026-88771/ -> pivot: WebSearch ('Google Threat Intelligence Mandiant NetScaler CVE-2026-88771 webshell exploitation cluster UNC') -> primary: Google Cloud Blog (GTIG/Mandiant) URL https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances ; NCSC-CH bridge (ncsc-csh recent 8 -> post 13005 history: 'added article and PoC for CVE-2026-88772') -> primary: watchTowr Labs URL https://labs.watchtowr.com/here-we-go-again-citrix-netscaler-dtls-preauth-memory-overflow-cve-2026-88772/ ; eSentire URL and CERT-EU blog URL as listed; Censys advisory URL https://censys.com/advisory/cve-2026-10747-2/ (page slug is a reused IBM-MQ slug; content is the Citrix advisory)"
    summary: |
      Delta versus the existing entry (last changelog 2026-09-29T04:35Z, which covered watchTowr's CVE-2026-88771 root
      cause): everything below is new since then.
      1) Exploitation window and scope. Google GTIG/Mandiant (2026-09-29) attributes in-the-wild exploitation of
      CVE-2026-88772 (pre-auth DTLS record parsing in the NetScaler packet engine, heap corruption to root-level
      shellcode on the FreeBSD base; GTIG states it does not possess exploit code and reasons from frontline telemetry)
      to a campaign "ongoing since at least early September", likely affecting government, financial-services,
      technology, education and legal/professional-services organisations in North America and Europe. eSentire TRU
      independently reports CVE-2026-88771 exploited against NetScaler Gateway appliances from 2026-09-05, more than
      three weeks before disclosure, and GreyNoise recorded a pre-disclosure attempt on 2026-09-24 whose post-exploitation
      playbook it revealed. No source attributes the activity to a named actor (CERT-EU, Google, eSentire each say so or
      omit it); Kevin Beaumont's suggestion of an espionage motive is relayed by eSentire and Help Net Security and is
      not a sourced attribution.
      2) Post-exploitation behaviour (GTIG, eSentire, GreyNoise and CERT-EU converge). An installer web shell edits the
      appliance web-server configuration to enable PHP and to register non-script file extensions (.deb, .sig; GreyNoise:
      a dot-file behind an alias) as PHP handlers, and adds an AliasMatch so requests for non-existent image/CSS/icon
      paths under /vpn/media/ execute a shell staged in the VPN client-plugin directory
      (/var/netscaler/gui/vpn/scripts/linux). The shells return HTTP 404 while taking base64 commands from custom
      request headers (NSC_CLIENTTYPE / HTTP_NSC_LDAP per GTIG/eSentire), set the setuid bit on /bin/sh, scrub
      references to the staging directory from /etc/crontab, and force an appliance restart to activate the change.
      GTIG names two custom tools: WHIPSHOT (PHP web shell that relays to a local proxy) and SLAPSHOT (Python TCP
      tunneler bound to an ephemeral loopback port with lock/port files in /tmp, JSON-over-length-prefix protocol, idle
      self-termination); in at least one intrusion the actor routed traffic through it for manual internal
      reconnaissance and credential theft; GTIG describes the toolset as facilitating internal reconnaissance, lateral
      movement and credential harvesting. CERT-EU's investigation started from NetScaler logs at the European Court of
      Auditors and the European Central Bank that showed base64-encoded bash in the HTTP User-Agent, plus
      authentication-log lines containing "PPE missed too many heartbeats"; the trigger is the crash-log script
      ns_monuploadd_err.pl (already in the entry).
      3) Exploit availability. watchTowr published a root-cause analysis and a Detection Artifact Generator for
      CVE-2026-88772 on 2026-09-29: DTLS handshake reassembly keeps almost the whole record for each one-byte fragment,
      so 120 records leave roughly 174 KB in a buffer chain that a NSPPE routine copies into a 35,840-byte scratch buffer
      in .bss without a size check; nsppe has no PIE, no stack canary and no RELRO (ROP to mprotect then shellcode in
      watchTowr's lab). DTLS listens on UDP 443 in the GTIG campaign (9462/UDP in watchTowr's lab config). NCSC-CH's
      advisory now lists a proof of concept for both CVEs (edited 2026-09-29). The existing entry records only a
      public detection tool for 88771 and no exploit-availability statement for 88772; Help Net Security's morning
      2026-09-29 text still said no public PoC existed for 88772, so the change landed later that day.
      4) Escalation to mass exploitation. Help Net Security (2026-09-29) reports the activity moved from stealthy
      targeting to "spray and pray" exploitation fuelled by the 88771 root-cause analysis and PoC (Lupovis sensor
      claim: opportunistic internet-wide attempts within minutes of watchTowr's release). Kevin Beaumont's social-media
      statements as relayed by Help Net Security - fewer than 10% of exposed hosts patched, more than 100 victim
      organisations each with a unique web shell - are unverified claims from a single researcher.
      5) Exposure. Censys counts 42,735 NetScaler ADC/Gateway hosts (2026-09-28): US 32%, Germany 13%, and
      Netherlands, UK and Switzerland roughly 4% each (about 1,700 Swiss hosts, derived, not a stated Censys figure;
      a count of instances, not confirmed-vulnerable). Palo Alto Xpanse counted 50,277 potentially vulnerable instances
      on 2026-09-27. Tenable notes the bulletin lists fixes only for 14.1 and 13.1; NetScaler 12.1 and 13.0 are end of
      life and Citrix has not said whether they are affected - the existing entry does not mention EOL branches.
      6) Mitigation nuance. GTIG describes DTLS-disable on Gateway virtual servers and blocking inbound UDP/443 upstream
      as compensating controls for CVE-2026-88772 ONLY ("should not be relied on to mitigate CVE-2026-88771"); the
      existing entry says no workaround exists (Citrix's position). GTIG also advises halting HA configuration sync
      until both nodes are validated (a modified httpd.conf replicates to the standby), restricting appliance egress,
      and checking that VPX appliances do not share Layer 2 with hypervisor management.
      Hunt/detection concepts (vendor-neutral telemetry first): appliance web-server config integrity (handler,
      php_flag and alias directives pointing public paths at script directories); file-type audit of client-plug-in and
      media directories (ASCII/PHP content under binary-package extensions); web access logs for 404 responses on
      media/icon paths with abnormal response size or duration; web error logs for parse errors on non-script
      extensions; syslog for DTLS handshake failure ("Internal Error") followed by packet-engine termination and a
      watchdog "NOT restarting" line; presence of loopback tunneler lock/port files in /tmp; SUID bit on /bin/sh;
      forced restarts and manual web-server restarts in the shell log. Benign lookalike for the DTLS artefacts:
      isolated handshake failures from scanners or misbehaving VPN clients without the follow-on process-termination
      line and without config drift.
    region_nexus: "global; Swiss exposure ~4% of ~42.7k hosts per Censys; NCSC-CH advisory 13005 applies; GTIG lists government victims in Europe"
