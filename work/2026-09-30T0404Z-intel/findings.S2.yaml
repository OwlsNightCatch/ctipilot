  - title: "Manno (TI) communal administration: ransomware encrypted part of the commune's servers on 2026-08-04; Safepay leak-site listing on 2026-09-28 is the first public tie to an actor"
    sources:
      - { url: "https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico.html", publisher: "Comune di Manno (Municipio), notice 'Attacco informatico server comunale'", date: "2026-09-16", role: "primary" }
      - { url: "https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico/sidebar/0/items/0/file/Pubblicazione%20avviso%20attacco%20informatico.pdf.pdf", publisher: "Comune di Manno (Municipio), PDF 'Avviso attacco informatico'", date: "2026-09-16", role: "primary" }
      - { url: "https://www.ransomware.live/id/bWFubm8uY2hAc2FmZXBheQ==", publisher: "Ransomware.live (leak-site tracker; claim only)", date: "2026-09-28", role: "corroborating" }
      - { url: "https://www.inside-it.ch/tessiner-gemeinde-wird-opfer-von-cyberkriminellen-20260929", publisher: "Inside IT (article body unreadable in-run: HTTP 429 Vercel checkpoint; only the RSS teaser from https://www.inside-it.ch/rss.xml was read)", date: "2026-09-29", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml -> item 'Tessiner Gemeinde wird Opfer von Cyberkriminellen' (2026-09-29T12:54Z), article page HTTP 429 on extract and WebFetch -> WebSearch (\"Manno comune ransomware Safepay\") -> pivot: Ransomware.live, URL https://www.ransomware.live/id/bWFubm8uY2hAc2FmZXBheQ== (listing discovered 2026-09-28 08:34 UTC) -> pivot: https://www.manno.ch homepage (Comunicati list) -> primary: victim notice https://www.manno.ch/manno/Informazione/albo-comunale/2026/09/Attacco-informatico.html and its PDF"
    summary: |
      Facts (Comune di Manno, notice dated 2026-09-16, text of the attached PDF): on 4 August 2026 part of the commune's
      servers suffered an attack that encrypted data; the commune isolated the affected server, restored data and
      operations from existing backups, reported the case to the competent authorities and filed a criminal complaint
      against unknown persons; residents are warned to distrust unexpected letters or messages demanding urgent payments
      or personal/financial data and to use only official channels. The notice names no actor and no intrusion vector.
      Claim (not victim-confirmed): Ransomware.live recorded on 2026-09-28 08:34 UTC that manno.ch was listed by the
      Safepay ransomware group; Inside IT's 2026-09-29 teaser reports a ransomware gang attacking the commune's servers
      and encrypting part of the data, with a rapid return to normal operations thanks to a backup (the article body,
      which per WebSearch-relayed text adds Safepay's exfiltration claim and a publication countdown, could not be read
      here). Whether the leak-site listing concerns the same 4 August event is the leak-site operator's implication, not
      something Manno's notice states. Unknowns: initial-access vector, whether data left the network, ISG reporting
      status. Timeline shape worth carrying: encryption 2026-08-04, public notice 2026-09-16 (six weeks later), leak-site
      listing 2026-09-28 (eight weeks later). Transferable lesson for cantonal and communal defenders: a tested backup
      and immediate server isolation turned an encryption event into hours of downtime, but the double-extortion
      listing arrives weeks later regardless, so exfiltration assessment must not be closed on the strength of a clean
      restore.
