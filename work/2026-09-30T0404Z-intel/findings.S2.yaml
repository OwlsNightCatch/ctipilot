      - quote: "Il pagamento delle singole ricerche, spiega il Dipartimento, fungerà anche da barriera tecnica e finanziaria contro lo scraping"
        attribution: "Ticinonline (Dipartimento delle istituzioni)"
        source_url: "https://www.tio.ch/ticino/attualita/1953115/dati-cantone-elenco-targhe-cambia"
      - quote: "I meccanismi di protezione dei portali, che limitavano il numero di interrogazioni effettuabili, sono stati intenzionalmente aggirati."
        attribution: "Corriere del Ticino"
        source_url: "https://www.cdt.ch/news/sottratti-nomi-e-indirizzi-dalle-targhe-lattacco-raggiunge-anche-il-ticino-438324"
      - quote: "definisce quanto accaduto un caso di «mass scraping»"
        attribution: "Corriere del Ticino, quoting the Ufficio federale della cibersicurezza (UFCS/NCSC-CH)"
        source_url: "https://www.cdt.ch/news/sottratti-nomi-e-indirizzi-dalle-targhe-lattacco-raggiunge-anche-il-ticino-438324"
      - quote: "Come gli altri Cantoni coinvolti, anche il Ticino non intende cedere a richieste di riscatto."
        attribution: "RSI"
        source_url: "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Fuga-di-dati-sui-veicoli-colpito-anche-il-Ticino--4056336.html"
    extended_notes: |
      Defender takeaway tied to the mechanism (public lookup form, per-user rate limit bypassed by automation): a
      per-identity limit alone is not an anti-scraping control (the existing entry already says so); per-query cost is
      the lever Ticino chose. Telemetry class for cantonal portal owners: web/app access logs for high-volume lookups
      distributed across many client identities. No action items.

