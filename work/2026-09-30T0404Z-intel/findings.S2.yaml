  - title: "UPDATE — Rhineland-Palatinate: shared municipal data centres took centrally hosted citizen-service systems offline for all 194 municipal administrations on 2026-09-27 after a critical vulnerability disclosure that heise ties to the NetScaler zero-days"
    sources:
      - { url: "https://www.ak-kurier.de/akkurier/www/artikel/176375-kommunale-rechenzentren-schalten-fachverfahren-vorsorglich-ab", publisher: "ZIDKOR press release of 2026-09-28 (as reprinted by AK-Kurier, updated 2026-09-29)", date: "2026-09-28", role: "primary" }
      - { url: "https://www.rhein-zeitung.de/rheinland-pfalz/it-sicherheitsluecke-erste-staedte-melden-ende-der-stoerung_arid-4158892.html", publisher: "Rhein-Zeitung / dpa (Landkreistag, Gemeinde- und Städtebund, Städtetag statement; Mainz city administration)", date: "2026-09-29", role: "corroborating" }
      - { url: "https://www.heise.de/news/IT-Stoerung-trifft-Kommunalverwaltungen-in-Rheinland-Pfalz-11469044.html", publisher: "heise online (ties the trigger to the Citrix NetScaler zero-days; inference)", date: "2026-09-29", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml -> 'IT-Störung trifft Kommunalverwaltungen in Rheinland-Pfalz' (2026-09-29T06:40Z), URL https://www.heise.de/news/IT-Stoerung-trifft-Kommunalverwaltungen-in-Rheinland-Pfalz-11469044.html -> WebSearch (\"Rheinland-Pfalz Kommunalverwaltungen IT-Störung Verwaltungsnetz Sicherheitslücke Betriebsrechenzentren\") -> primary: ZIDKOR press release via https://www.ak-kurier.de/akkurier/www/artikel/176375-kommunale-rechenzentren-schalten-fachverfahren-vorsorglich-ab; dpa/Rhein-Zeitung as second source. heise's linked Rhein-Lahn-Kreis notice returned only an empty page body (not cited)."
    summary: |
      Facts (ZIDKOR press release, 2026-09-28): the two operating data centres of the Rhineland-Palatinate municipal IT
      association ZIDKOR (KDZ Mainz and KGRZ Koblenz) shut down certain IT systems as a precaution on Sunday afternoon,
      2026-09-27, after a security vulnerability became known over the weekend and was then confirmed; they were
      installing the vendor's patches. All 194 full-time administered municipalities, cities and counties were affected
      via the centrally operated specialist applications: resident registration, passport and ID-card offices, vehicle
      registration, civil-registry offices, weapons registration and school administration; services relying on them
      could not be delivered or only in part, and there were no central instructions, each administration ran its own
      continuity process. The operators and the three municipal associations state it was not a successful cyberattack
      and that personal data were not at risk. Dpa (2026-09-29): Mainz and Kaiserslautern were fully available again on
      the morning of 2026-09-29; Mainz describes the trigger as a security notice rated highly critical for an IT product
      used in the municipal data centres; the data centres expected normal operation by Tuesday.
      Inference (heise, not the operators): the product was probably Citrix NetScaler, because updates for the two
      exploited NetScaler zero-days (CVE-2026-88771, CVE-2026-88772) had been released the same weekend. Neither the
      ZIDKOR release nor dpa names a vendor or CVE; the tie is heise's and heise added it in an edit.
      Why it matters here: a shared municipal operator concentrating the citizen-facing specialist applications of a
      whole state made "take it offline, patch, verify, reopen" the response to a critical edge-device zero-day, at the
      cost of roughly two days of degraded services statewide. That is the operational shape Swiss cantonal IT offices
      and communal service providers face with a shared NetScaler/Gateway front end; no Swiss public-sector NetScaler
      outage or compromise was found in this window (WebSearch, NCSC-CH Security Hub and incidents page).
    region_nexus: "germany (Rhineland-Palatinate), neighbouring the DACH constituency; transferable to Swiss cantonal/communal shared-service operators"
    primary_sector_nexus: "direct-analogue (municipal shared IT operator serving registry, ID, vehicle-registration and civil-registry services)"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products: []
    entity_keys: ["product:citrix-netscaler"]
    new_entities:
      - { key: "incident:zidkor-rlp-municipal-precautionary-shutdown-2026-09", type: incident, name: "Rhineland-Palatinate municipal data centres precautionary shutdown, 27-29 September 2026", aliases: [], summary: "ZIDKOR data centres (KDZ Mainz, KGRZ Koblenz) took central specialist applications of all 194 municipal administrations offline on 2026-09-27 after a critical vulnerability disclosure (heise ties it to the NetScaler zero-days); no successful attack reported (ZIDKOR, dpa, heise, 2026-09-28/29)." }
    relation_suggestions:
      - { subject: "incident:zidkor-rlp-municipal-precautionary-shutdown-2026-09", object: "product:citrix-netscaler", basis: "heise online assesses the trigger was probably the NetScaler updates released the same weekend; the operators do not name the product (suggest related-to, not exploits)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_hint: { reliability: B, credibility: 2, note: "operator statement + dpa agree on the facts; vendor tie is a single-outlet inference" }
    novelty: "update-of:2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev"
    evidence:
      - quote: "haben am Sonntagnachmittag, 27. September 2026, bestimmte IT-Systeme vorsorglich heruntergefahren."
        attribution: "ZIDKOR (press release, 2026-09-28)"
        source_url: "https://www.ak-kurier.de/akkurier/www/artikel/176375-kommunale-rechenzentren-schalten-fachverfahren-vorsorglich-ab"
      - quote: "Ein erfolgreicher Cyberangriff liegt nach Angaben der kommunalen Rechenzentren nicht vor"
        attribution: "ZIDKOR (press release, 2026-09-28)"
        source_url: "https://www.ak-kurier.de/akkurier/www/artikel/176375-kommunale-rechenzentren-schalten-fachverfahren-vorsorglich-ab"
      - quote: "Es handelt sich nicht um einen erfolgreichen Cyberangriff, sondern um eine Vorsichtsmaßnahme, um die Daten zu schützen, bis die Lücke geschlossen ist"
        attribution: "Landkreistag, Gemeinde- und Städtebund, Städtetag Rheinland-Pfalz (via dpa)"
        source_url: "https://www.rhein-zeitung.de/rheinland-pfalz/it-sicherheitsluecke-erste-staedte-melden-ende-der-stoerung_arid-4158892.html"
      - quote: "Wahrscheinlich haben die IT-Teams die Citrix-Netscaler-Software auf aktuellen Stand gebracht."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/IT-Stoerung-trifft-Kommunalverwaltungen-in-Rheinland-Pfalz-11469044.html"
    extended_notes: |
      Composer options: (a) fold into S1's Citrix update (its 2026-09-29 delta list has no operational-impact item), or
      (b) ship as a distinct short incident-style entry with references[] to the Citrix entry (no CVE is named in the
      operators' own sources, so the CVE-overlap gate should not trigger; if the vendor tie is kept, keep the
      "heise assesses" wording). Behavioural takeaway, not a detection: shared operators need a pre-agreed
      shutdown-and-verify runbook and a dependency map from citizen services to the edge devices that front them; the
      ZIDKOR statement shows there was no central instruction and each municipality improvised its continuity plan.
      Not an action item. Suggested priority: notable, only as an operational-impact delta on a critical entry.

  - title: "UPDATE — Ticino becomes the seventh canton in the vehicle-owner lookup scraping campaign; NCSC-CH calls it 'mass scraping'; Ticino will switch to paid per-query eAutoindex lookups on 2026-11-01 as an anti-scraping control"
    sources:
      - { url: "https://www.tio.ch/ticino/attualita/1953115/dati-cantone-elenco-targhe-cambia", publisher: "Ticinonline (announcement by the cantonal Sezione della circolazione)", date: "2026-09-28", role: "primary" }
      - { url: "https://www.cdt.ch/news/sottratti-nomi-e-indirizzi-dalle-targhe-lattacco-raggiunge-anche-il-ticino-438324", publisher: "Corriere del Ticino (quotes NCSC-CH / UFCS)", date: "2026-09-03", role: "corroborating" }
      - { url: "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Fuga-di-dati-sui-veicoli-colpito-anche-il-Ticino--4056336.html", publisher: "RSI (Ticino disclosure; page metadata 2026-08-28, audio items dated 2026-09-03)", date: "2026-09-03", role: "corroborating" }
      - { url: "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Targhe-la-ricerca-di-dati-sar%C3%A0-pi%C3%B9-sicura-e-a-pagamento--4117186.html", publisher: "RSI (paid eAutoindex from 2026-11-01)", date: "2026-09-28", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"attacco informatico Ticino comune OR cantone OR polizia settembre 2026 ransomware\") -> pivot: CdT, URL https://www.cdt.ch/news/sottratti-nomi-e-indirizzi-dalle-targhe-lattacco-raggiunge-anche-il-ticino-438324 -> pivot: RSI, URL https://www.rsi.ch/info/ticino-grigioni-e-insubria/Targhe-la-ricerca-di-dati-sar%C3%A0-pi%C3%B9-sicura-e-a-pagamento--4117186.html -> primary: cantonal announcement relayed by Ticinonline, URL https://www.tio.ch/ticino/attualita/1953115/dati-cantone-elenco-targhe-cambia; store match found by Grep of entries/ (entries/2026-08-29/swiss-cantons-eautoindex-vehicle-registry-data-harvesting.md, no changelog record, Ticino absent from its body)"
    summary: |
      Delta versus the existing entry (2026-08-29, five eAutoIndex cantons plus Valais, no changelog, Ticino absent):
      1) Ticino is a further victim. Per the cantonal Sezione della circolazione (RSI, CdT, ~2026-09-03) the same kind of
      automated bulk collection reached the "Elenco targhe Cantone Ticino" plate-lookup page: plate number, name and
      address of vehicle holders, with the mechanisms limiting the number of queries deliberately bypassed; holders who
      had asked for blocking were not affected; there was no intrusion into cantonal IT systems; the Department of
      Institutions filed a criminal complaint against unknown persons with the public prosecutor, disabled the page as a
      precaution, and (like the other cantons) does not intend to give in to ransom demands.
      2) NCSC-CH characterisation (Corriere del Ticino, quoting the federal cybersecurity office): "mass scraping",
      i.e. automated large-scale collection; "attack" refers only to the author having bypassed the per-user query
      limits; the office says the data could feed financially motivated social-engineering campaigns. CdT's standfirst
      adds that the office confirms identical ransom demands, suggesting linked episodes (CdT's summary; not seen in the
      quoted body).
      3) Countermeasure (announced 2026-09-28): from 2026-11-01 Ticino moves to the inter-cantonal eAutoindex platform
      and single lookups become paid; the department says payment per lookup also acts as a technical and financial
      barrier against scraping, making automated extraction of large volumes harder. Data of holders who blocked
      publication stays unavailable, also through the new system. This is a deliberate economic control on top of
      rate limits, which the original incident showed to be bypassable.
      Recency note: the freshest source is dated 2026-09-28 (outside the 26 h window, inside the previous run's window
      where it was not picked up); the Ticino victim disclosure dates from ~2026-09-03. Returned because it is a
      Swiss cantonal-government campaign delta on a HIGH-priority entry with no changelog; drop if the recency bar is
      applied strictly.
