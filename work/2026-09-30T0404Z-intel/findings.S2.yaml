backlog_recheck:
  - row: "SRG SSR / SRF cyberattack (SRF statement 2026-09-28)"
    status: "holds — no newer primary statement found since SRG's own release of 2026-09-28; no actor claim located"
    detail: |
      Primary: SRG SSR release 'SRG von Cybervorfall betroffen' (2026-09-28): unauthorised persons accessed data of SRF
      staff; affected accesses deactivated ("Zugänge"), additional security measures; "Nach aktuellem Kenntnisstand sind
      keine weiteren unberechtigten Zugriffe erfolgt, der Vorfall ist unter Kontrolle"; data outflow of contact and
      organisational data from 2020 for around 340 current and former SRF employees, mostly today's "Information"
      offering unit; names, functions, business and partly private contact details; no indication of passwords,
      financial or bank data, journalistic sources, research data or communication content; affected persons informed
      directly; authorities informed, criminal complaint filed; internal and external experts investigating causes and
      scope; "keine Hinweise ... veröffentlicht oder missbräuchlich verwendet". Not disclosed: access vector, root cause,
      actor. Scope has not widened in any source read up to 2026-09-30 (Swiss press 2026-09-28/29, ictjournal 2026-09-29
      repeat the release). No leak-site listing, ransom demand or NCSC-CH note was found (NCSC-CH incidents page and
      Security Hub checked 2026-09-30). Inference (mine, no owner): the 2020 vintage of the data points to a legacy
      dataset or archive rather than current HR systems; the release does not say so.
    urls:
      - "https://www.srgssr.ch/de/news-medien/news/srg-von-cybervorfall-betroffen"
      - "https://www.srf.ch/news/schweiz/zugriff-auf-daten-srg-von-cybervorfall-betroffen"
      - "https://www.itmagazine.ch/artikel/88102/Datenklau_bei_der_SRG.html"
      - "https://www.netzwoche.ch/news/2026-09-28/cyberkriminelle-stehlen-daten-von-srf-mitarbeitenden"
      - "https://www.ictjournal.ch/news/2026-09-29/des-cybercriminels-derobent-des-donnees-de-collaborateurs-de-la-srf"
    quotes:
