  - title: "ANNUAL REPORT — ENISA Threat Landscape 2026: public administration remains the most targeted EU sector; ransomware most impactful; vulnerabilities behind 60% of attributable intrusion vectors"
    sources:
      - { url: "https://www.enisa.europa.eu/news/exploring-the-evolution-of-the-cyber-threat-landscape-how-dependencies-weaken-our-digital-resilience", publisher: "ENISA", date: "2026-09-22", role: "primary" }
      - { url: "https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf", publisher: "ENISA (full report PDF; text extraction fragmentary, not used for quotes)", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: enisa, URL https://www.enisa.europa.eu/news (extract; featured-news block lists the report) -> primary: ENISA news item https://www.enisa.europa.eu/news/exploring-the-evolution-of-the-cyber-threat-landscape-how-dependencies-weaken-our-digital-resilience and the report PDF; WebSearch (\"ENISA Threat Landscape 2026 report public administration most targeted sector\") located the PDF URL; no store entry found (Grep entries/ for ENISA threat landscape)"
    summary: |
      ENISA's 2026 edition analyses incidents observed 2025-01-01 to 2025-12-31 from open sources plus anonymised
      Member-State information. Headline findings per ENISA: ransomware remains the most short-term impactful incident
      type; hacktivist-led DDoS campaigns against essential entities continue to follow geopolitical developments;
      public administration continues to be the most targeted sector; social engineering, notably phishing kits and the
      ClickFix technique, stays the common enabler; among unauthorised-access incidents where an intrusion vector could
      be identified (5%), 60% leveraged a vulnerability (N-day and 0-day); threat groups reuse tools and techniques,
      collaborate, and target dependencies (supply-chain and third-party attacks); AI models are expected to be used
      increasingly in malicious operations. Relevance to the constituency: an authoritative EU-wide corroboration that
      the public sector is the top target and that exploited vulnerabilities dominate identifiable entry; Switzerland is
      not an EU Member State and is only named in a participant listing in the PDF.
    region_nexus: "eu-wide; Switzerland outside scope but same threat distribution assumed by NCSC-CH's own reporting"
    primary_sector_nexus: "direct (public administration named most targeted sector)"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    classification_hint: { reliability: A, credibility: 2, note: "ENISA is the authority for its own report; the 32% public-administration share cited by secondary coverage was NOT verified against the PDF and is not carried" }
    novelty: new
    borderline: true
    borderline_reason: "published 2026-09-22, 8 days outside the window (ENISA lookback 26 h); no store entry; returned only as a late catch of an annual flagship for the audit/composer to decide"
    evidence:
