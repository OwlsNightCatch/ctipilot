      - { quote: "Der SRG liegen derzeit keine Hinweise darauf vor, dass die Daten veröffentlicht oder missbräuchlich verwendet wurden.", attribution: "SRG SSR", source_url: "https://www.srgssr.ch/de/news-medien/news/srg-von-cybervorfall-betroffen" }
