    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge subcommand ncsc-csh recent 30, post #12577 published 2026-05-15T11:25:18Z → primary: Microsoft MSRC via msrc cve CVE-2026-42897 (MSRC API) + BleepingComputer article URL https://www.bleepingcomputer.com/news/microsoft/microsoft-warns-of-exchange-zero-day-flaw-exploited-in-attacks/ → corroborated by NCSC-NL CSAF NCSC-2026-0159 and BSI WID-SEC-2026-1536"
    summary: |
      CVE-2026-42897 (CWE-79, CVSS 8.1) is a stored/reflected cross-site scripting flaw in Microsoft Exchange Server's Outlook Web Access (OWA) component, classified by Microsoft as a spoofing vulnerability. The attack vector requires an unauthenticated attacker to send a specially crafted email; when the target opens that email in OWA, arbitrary JavaScript executes in the victim's browser context, enabling session token theft, impersonation, phishing-redirect, and lateral pivoting via Exchange-mediated workflows (e.g., re-sending crafted messages to internal users).

      Microsoft confirmed active in-the-wild exploitation as of 2026-05-14 but has not attributed the activity to a named cluster or disclosed scale. There is no permanent patch; the fix does not appear in the May 2026 Patch Tuesday bundle. Microsoft's interim mitigation is the Exchange Emergency Mitigation Service (EEMS), which ships enabled by default on Exchange Server 2016 and later and can be verified/triggered manually via the Exchange Management Shell. The EEMS mitigation blocks the specific attack path without requiring a restart.

      Affected versions: Exchange Server 2016, 2019, and Subscription Edition (SE). Exchange Online is NOT affected. CISA added CVE-2026-42897 to the Known Exploited Vulnerabilities catalog on 2026-05-15 with a federal remediation deadline of 2026-05-29. NCSC-NL, BSI, and NCSC-CH all published advisories on 2026-05-15 confirming the exploitation status and directing organisations to apply the EEMS mitigation immediately.

      Detection surface: web-server access logs for OWA `/owa/` endpoints, anomalous JavaScript-injection patterns in Exchange audit logs (EAL), Defender XDR alert "Suspicious Exchange Web Shell Activity" or equivalent EDR telemetry on webshell execution chains spawned from `w3wp.exe` (IIS worker) in the Exchange application pool. Hunt for `Get-Mitigation` PowerShell invocations against Exchange that did not originate from an authorised admin account.

      NCSC-CH EEMS hardening step: run `Get-ExchangeDiagnosticInfo -Server <name> -Process MSExchangeHMWorker -Component EemsMitigation -SettingName MitigationsApplied` and confirm the relevant mitigation rule appears in the output.
    ch_eu_nexus: "global; on-premises Exchange Server is widely deployed in Swiss and broader EU public-sector, cantonal government, healthcare, and legal/financial environments; NCSC-CH and NCSC-NL issued in-window advisories"
    public_sector_nexus: "direct — on-premises Exchange Server is the dominant on-premises email platform in CH/EU public-sector organisations that have not completed migration to Exchange Online"
