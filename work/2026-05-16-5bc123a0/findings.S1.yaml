  - title: "Microsoft Exchange Server CVE-2026-42897 — OWA stored XSS actively exploited, no permanent patch yet (KEV deadline 2026-05-29)"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-14"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12577"
        publisher: "NCSC Switzerland Cyber Security Hub"
