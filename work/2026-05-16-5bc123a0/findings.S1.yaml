        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-warns-of-exchange-zero-day-flaw-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
        publisher: "Help Net Security"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0159"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1536"
        publisher: "BSI / CERT-Bund"
        date: "2026-05-14"
        role: "corroborating"
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, bridge ncsc-csh recent 30 → post id 12577
      (https://security-hub.ncsc.admin.ch/#/posts/12577) → CISA KEV bridge confirms
      dateAdded=2026-05-15 → MSRC API msrc cve CVE-2026-42897 confirms exploited=Yes,
      no patch link → primary: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897;
      corroborated by NCSC-NL NCSC-2026-0159, BSI WID-SEC-2026-1536, BleepingComputer, Help Net Security
    summary: |
      CVE-2026-42897 (CWE-79, CVSS 3.1: 8.1 HIGH, temporal 7.5) is a stored cross-site scripting
      flaw in Microsoft Exchange Server's Outlook Web Access (OWA) component. An unauthenticated
      attacker sends a specially crafted email; when the recipient opens it in OWA and certain
      browser-interaction conditions are met, arbitrary JavaScript executes in the victim's browser
      context, enabling session token theft, content spoofing, and further lateral phishing from
      a trusted sender context. Microsoft confirmed active in-the-wild exploitation on 2026-05-14,
      two days after May 2026 Patch Tuesday, and notes no permanent security update is yet ready.
      Affected on-premises versions: Exchange Server 2016 (all CU levels), Exchange Server 2019
      (all CU levels), Exchange Server Subscription Edition (SE) (all CU levels). Exchange Online
      is NOT affected. CISA added to KEV on 2026-05-15 with federal remediation deadline 2026-05-29.
      Temporary mitigation M2 was deployed via the Exchange Emergency Mitigation Service (EEMS),
      which is enabled by default; operators of air-gapped Exchange servers must apply the
      Exchange on-premises Mitigation Tool (EOMT) manually via Exchange Management Shell.
      Exchange 2016 and 2019 permanent updates will only be available to customers enrolled in
      the Period 2 Exchange Server ESU programme; Exchange SE will receive a publicly available SU.
      Attack class: T1566.001 Spearphishing Attachment / T1059.007 JavaScript (browser-side),
      T1185 Browser Session Hijacking. Detection: Exchange HttpProxy / W3SVC IIS access logs for
      anomalous OWA requests with injected script fragments; EDR process-tree alerts showing browser
      spawning unexpected child processes; Exchange EEMS audit log for M2 application status.
    ch_eu_nexus: "Global; on-premises Exchange is prevalent in Swiss federal agencies, cantonal administrations, and EU member-state public-sector mail infrastructure"
    public_sector_nexus: "HIGH — on-premises Exchange is standard in Swiss/EU government environments; EEMS auto-mitigation may not apply to air-gapped networks"
    sector: "government, public-sector, finance, healthcare, education, telco"
    cves: [CVE-2026-42897]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Exploitation Detected"
        attribution: "Microsoft MSRC (MSRC API exploited field)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
      - quote: "An attacker could exploit this issue by sending a specially crafted email to a user. If the user opens the email in Outlook Web Access and certain interaction conditions are met, arbitrary JavaScript can be executed in the browser context."
        attribution: "Microsoft MSRC FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
      - quote: "Microsoft is supplying a temporary mitigation for this vulnerability through the Exchange Emergency Mitigation Service. We are working on developing and testing a more permanent fix."
        attribution: "Microsoft MSRC FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
      - quote: "Current exploitation status: Actively Exploited"
        attribution: "NCSC Switzerland Cyber Security Hub post 12577"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12577"
    extended_notes: |
      The MSRC CVSS vector CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N/E:F/RL:O/RC:C reflects
      user interaction requirement but no authentication — a network-deliverable email requires only
      the victim to open OWA. The C:H/I:H indicates session compromise + content tampering potential.
      Microsoft classifies severity as Critical despite the 8.1 base score; the "Critical" label
      likely reflects the EEMS workaround availability reducing exploitability. No attribution to a
      named threat cluster published as of this run. Exchange 2016 / 2019 ESU enrolment requirement
      for the permanent patch is an operational risk: operators unaware of their ESU status may
      receive no update notification.

  - title: "Exim MTA CVE-2026-45185 (Dead.Letter) — unauthenticated heap UAF RCE via BDAT/GnuTLS, CVSS 9.8, patch in 4.99.3"
    sources:
      - url: "https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"
        publisher: "Exim Project (official advisory EXIM-Security-2026-05-01.1)"
        date: "2026-05-12"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/new-critical-exim-mailer-flaw-allows-remote-code-execution/"
        publisher: "BleepingComputer"
        date: "2026-05-13"
        role: "corroborating"
      - url: "https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"
        publisher: "XBOW Security"
        date: "2026-05-12"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0163"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-45185"
        publisher: "NVD/MITRE"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: >
      first seen at: advisories-ncsc-nl bridge ncsc-nl recent 20 → NCSC-2026-0163
      (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0163) → csaf reference
      https://exim.org/static/doc/security/CVE-2026-45185.txt (404) →
      fetched https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt
      (200) = official advisory → corroborated BleepingComputer, xbow.com, NVD
    summary: |
      CVE-2026-45185 (CVSS 9.8 CRITICAL, CWE-416 Use-After-Free) is a remotely exploitable heap
      corruption flaw in Exim's BDAT (CHUNKING SMTP extension) body-parsing code path, triggered
      only when the TLS backend is GnuTLS (builds using OpenSSL are NOT affected). During BDAT
      body transfer, if a TLS client sends a close_notify alert before completing the body and
      then transmits a final cleartext byte on the same TCP connection, Exim writes into a buffer
      already freed during TLS session teardown, corrupting the allocator's internal state. An
      attacker needs only network access and ability to establish a TLS connection advertising
      STARTTLS + CHUNKING — no prior authentication, no account. Exim versions 4.97 through 4.99.2
      are affected; 4.99.3 (released 2026-05-12) contains the fix, which resets the input
      processing stack on receipt of a TLS close_notify during an active BDAT transfer.
      Discovered by Federico Kirschbaum (XBOW Security) via an AI-assisted seven-day research
      challenge. Exploitation status: no in-the-wild exploitation confirmed at time of publishing;
      PoC details were withheld for the coordinated disclosure window. Exim is the most widely
      deployed MTA on internet-facing Linux mail servers (Debian, Ubuntu, Kali default). NCSC-NL
      rated impact HIGH. BSI flagged via WID-SEC-2026-1527 (NGINX advisory same day; Exim advisory
      published 2026-05-15). Attack class: T1190 Exploit Public-Facing Application, with potential
      post-exploit T1505.003 Web Shell / T1059.004 Unix Shell if mail-server process can write to
      web-accessible paths. Detection: network IDS signatures for BDAT body followed by unexpected
      TLS close_notify + cleartext byte on same TCP session; Exim access logs for CHUNKING
      negotiation anomalies; monitor for unexpected child processes (shell, curl, wget) forked from
      the Exim daemon (EID analogues in auditd: execve syscall with ppid=exim PID). Hardening:
      upgrade to Exim 4.99.3 immediately; if GnuTLS build cannot be upgraded, disable CHUNKING
      extension in Exim config (chunking_advertise_hosts = !*) as a temporary workaround.
    ch_eu_nexus: "High — Exim is the default MTA on Debian/Ubuntu, common in Swiss/EU cantonal and municipal mail infrastructure"
    public_sector_nexus: "MEDIUM-HIGH — government agencies running self-hosted GnuTLS-linked Exim are exposed"
    sector: "government, hosting providers, ISPs, education, healthcare"
    cves: [CVE-2026-45185]
    actors_campaigns_malware: ["XBOW (researcher, not threat actor)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A remotely reachable memory corruption issue was discovered in Exim's GnuTLS backend. The vulnerability is triggered during BDAT message body handling when a client sends a TLS close_notify alert before the body transfer is complete."
        attribution: "Exim official advisory EXIM-Security-2026-05-01.1"
        source_url: "https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"
      - quote: "All Exim versions from 4.97 up to and including 4.99.2 are affected. This vulnerability only impacts builds that use USE_GNUTLS=yes."
        attribution: "Exim official advisory EXIM-Security-2026-05-01.1"
        source_url: "https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"
      - quote: "There is no known mitigation other than upgrading."
        attribution: "Exim official advisory EXIM-Security-2026-05-01.1"
        source_url: "https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"
    extended_notes: |
      The XBOW write-up describes this as a seven-day human+AI exploit development challenge run
      during the coordinated disclosure window. Full PoC exploit was NOT published at disclosure time,
      but the primitive (one-byte write into freed allocator metadata) is documented in enough detail
      that independent weaponisation is plausible for skilled actors. Prioritise mail server upgrade
      over other workarounds; the CHUNKING disable workaround only works if CHUNKING is the only
      delivery path (some large senders mandate it). Check Exim build flags via
      `exim --version` or `strings /usr/sbin/exim | grep -i gnutls`.

  - title: "F5 BIG-IP / BIG-IQ May 2026 quarterly security notification — multiple authenticated RCE, command injection, SSH-key disclosure across iControl REST/SOAP, TMM, APM, WAF"
    sources:
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0162"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "primary"
      - url: "https://my.f5.com/manage/s/article/K000160932"
        publisher: "F5 Networks Quarterly Security Notification May 2026"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: >
      first seen at: advisories-ncsc-nl bridge ncsc-nl recent 20 → NCSC-2026-0162
      (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0162) → CSAF references list
      multiple F5 K-articles including K000160932 (quarterly notification) → primary:
      NCSC-NL advisory with F5 references; F5 K-article attempted (SPA/auth wall)
    summary: |
      F5 published its May 2026 quarterly BIG-IP and BIG-IQ security notification, addressing
      vulnerabilities across iControl REST, iControl SOAP, TMOS Shell (tmsh), Traffic Management
      Microkernel (TMM), Configuration utility, Advanced WAF, Application Security Manager (ASM),
      Policy Enforcement Manager (PEM), DNS, Access Policy Manager (APM), and SSL Orchestrator.
      NCSC-NL flagged the advisory on 2026-05-15 with severity HIGH. Key vulnerability classes:
      directory traversal (CWE-22/35), OS command injection (CWE-78) achievable by authenticated
      Manager/Resource Administrator/Administrator roles that can modify configuration objects and
      escalate to arbitrary command execution with elevated privileges; SSH private key exposure
      via API responses and audit logs (CWE-312/532); cross-account information leaks; incorrect
      privilege assignment (CWE-266/267) enabling privilege escalation; stack-based buffer overflow
      (CWE-121) in specific TMM processing paths; and use-after-free (CWE-416) variants in APM.
      Multiple vulnerabilities require only authenticated access with lower-privilege roles, making
      them high-value for post-authentication privilege escalation chains on BIG-IP management
      interfaces. Exploitation prerequisites vary — some require Appliance Mode, SSL, HTTP/2, SIP,
      LDAP, or SNMP configuration. No in-the-wild exploitation confirmed in this notification cycle.
      Attack class: T1068 Exploitation for Privilege Escalation (post-auth command injection),
      T1552.004 Private Keys (SSH key exposure via API). Detection: iControl REST audit logs for
      unexpected configuration modification events from low-privilege accounts; tmsh audit logs for
      unusual command patterns; SNMP/API monitoring for unexpected role escalation. Hardening: apply
      F5 May 2026 quarterly fixes per K000160932; restrict iControl REST/SOAP access to management
      VLAN only; disable unused modules (PEM, SSL Orchestrator) if not required.
    ch_eu_nexus: "Global; F5 BIG-IP is widely deployed as a load balancer and WAF in Swiss financial institutions, telecoms, and large EU public-sector entities"
    public_sector_nexus: "MEDIUM — BIG-IP is common in large cantonal and federal agency network perimeters"
    sector: "finance, telco, government, healthcare, hosting"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Exploitatie vereist doorgaans geauthenticeerde toegang met rollen variërend van Manager, Resource Administrator tot Administrator. Sommige kwetsbaarheden maken het mogelijk om configuratieobjecten te wijzigen, wat kan leiden tot het uitvoeren van willekeurige commando's met verhoogde privileges."
        attribution: "NCSC-NL advisory NCSC-2026-0162 (Dutch; translation: Exploitation typically requires authenticated access with roles ranging from Manager, Resource Administrator to Administrator. Some vulnerabilities allow modification of configuration objects, which can lead to execution of arbitrary commands with elevated privileges.)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0162"
    extended_notes: |
      The NCSC-NL CSAF lists more than 30 distinct CWE classes across this batch. Individual CVE
      numbers were not surfaced in the NCSC-NL CSAF excerpt reviewed; the F5 K000160932 quarterly
      notification portal page requires an authenticated myF5 session to enumerate per-CVE detail.
      Operators should check the F5 quarterly notification directly for affected version matrices.
      A separate ongoing exploitation story for CVE-2025-53521 (F5 BIG-IP APM, critical, actively
      exploited in March 2026) is distinct from this May 2026 quarterly batch.

  - title: "AMD CPU OP Cache Corruption (AMD-SB-7052 / CVE-2025-54518 range) — improper SoC resource isolation on Zen 2 CPUs, mitigated via May 2026 Windows update and Fedora/Xen patches"
    sources:
      - url: "https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7052.html"
        publisher: "AMD Product Security"
        date: "2026-05-12"
        role: "primary"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0158"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: >
      first seen at: advisories-ncsc-nl bridge ncsc-nl recent 20 → NCSC-2026-0158
      (https://advisories.ncsc.nl/advisory?id=NCSC-2026-0158) → CSAF reference
      https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7052.html →
      attempted bridge url fetch (SPA; title extracted) → WebSearch confirmed
      CWE-1189 Improper Isolation of Shared Resources on SoC, Zen 2 affected
    summary: |
      AMD disclosed AMD-SB-7052 (CWE-1189: Improper Isolation of Shared Resources on SoC)
      affecting Zen 2-based processor models. The vulnerability involves corruption of the CPU
      operation (micro-op/OP) cache that can cause incorrect instructions to execute at a higher
      privilege level. A local attacker — one with code execution on the target system — can
      potentially exploit this to achieve privilege escalation or break hypervisor-level isolation
      boundaries. NCSC-NL flagged the advisory on 2026-05-15. Mitigation is delivered as a
      microcode update incorporated into the Microsoft May 2026 Patch Tuesday cumulative update
      for Windows (same release window as CVE-2026-41089/41096 Patch Tuesday set, already covered
      2026-05-13). Other OS vendors (Fedora, Xen) are releasing separate updates — Fedora
      FEDORA-2026-7b2b7837b6 and FEDORA-2026-8b2957222f confirmed; xenbits.xen.org/xsa/advisory-490.html
      published for hypervisor environments. Lenovo also published a product security advisory
      (LEN-216977) for affected ThinkPad/ThinkStation/Workstation models.
      Attack class: T1068 Exploitation for Privilege Escalation, with potential impact on
      confidential-computing workloads if exploited in virtualisation contexts. Detection:
      verify microcode version via `rdmsr 0x8b` or OS equivalent; check Windows update KB for
      May 2026 AMD microcode inclusion; verify Xen XSA-490 applied in hypervisor deployments.
      Hardening: apply May 2026 Windows cumulative update; apply Fedora or distro-specific kernel
      + microcode updates for Linux hypervisors; apply Xen XSA-490 for bare-metal hypervisor
      operators; consult Lenovo LEN-216977 for hardware-specific BIOS/UEFI guidance.
    ch_eu_nexus: "Global; Zen 2 CPUs are prevalent across enterprise workstations and server deployments in Swiss/EU data centres"
    public_sector_nexus: "MEDIUM — affects Zen 2 systems in government and university compute environments"
    sector: "government, finance, education, hosting, cloud"
    cves: [CVE-2025-54518]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "De kwetsbaarheid betreft bepaalde AMD processors. Een lokale kwaadwillende kan de kwetsbaarheid misbruiken om willekeurige code uit te voeren op het systeem."
        attribution: "NCSC-NL advisory NCSC-2026-0158 (Dutch; translation: The vulnerability affects certain AMD processors. A local malicious actor can exploit the vulnerability to execute arbitrary code on the system.)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0158"
      - quote: "De mitigatie is opgenomen in de Windows update van mei 2026 die beschikbaar is gesteld om de kwetsbaarheid te verhelpen voor windows-gebaseerde systemen. Overige OS-vendors brengen eigen updates uit."
        attribution: "NCSC-NL advisory NCSC-2026-0158 (Dutch; translation: The mitigation is included in the May 2026 Windows update. Other OS vendors are releasing their own updates.)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0158"
    extended_notes: |
      The precise CVE ID range for AMD-SB-7052 was not enumerated in sources available during this
      run; the bulletin page is an SPA that could not be fully parsed. The Zen 2 affectedness is
      confirmed by the WebSearch summary. This is a local-only attack vector, which limits
      immediate external risk, but in shared multi-tenant and virtualisation environments (VDI,
      cloud hosted VMs, university compute labs) the guest-to-hypervisor escalation potential
      elevates urgency.

