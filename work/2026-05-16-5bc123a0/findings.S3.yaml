      MITRE ATT&CK: T1566.004 (Phishing: Vishing), T1557 (Adversary-in-the-Middle), T1556 (Modify Authentication Process — new MFA device registration), T1550 (Use Alternate Authentication Material — session cookie reuse), T1528 (Steal Application Access Token), T1087 (Account Discovery — Entra directory dumps), T1020 (Automated Exfiltration via Graph API). Detection specifics: SharePoint audit log `FileAccessed` with `AppAccessContext.ClientAppId = d3590ed6-52b3-4102-aeff-aad2292ab01c` AND user-agent containing `python-requests` or `PowerShell`; Okta event type `system.multifactor.factor.setup` without preceding user-initiated session; auth from anonymised IP / commercial VPN not in user's established pattern. Hardening: Conditional Access policies requiring compliant managed device for Graph API access; FIDO2 mandatory for cloud admin accounts; restrict SharePoint API access to managed device compliance.

  - title: "node-ipc npm supply chain backdoor: three versions hijacked via expired-domain account takeover, 90+ cloud credential categories exfiltrated over DNS TXT (Socket primary, May 14)"
    sources:
      - url: "https://socket.dev/blog/node-ipc-package-compromised"
        publisher: "Socket Security"
        date: "2026-05-14"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html"
        publisher: "The Hacker News"
        date: "2026-05-14"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews (bridge subcommand feed https://feeds.feedburner.com/TheHackersNews) → pivot: THN article URL https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html → primary: Socket Security, URL https://socket.dev/blog/node-ipc-package-compromised"
    summary: |
      Socket Security disclosed on 2026-05-14 that three versions of the `node-ipc` npm package — 9.1.6, 9.2.3, and 12.0.1 — contain a credential-stealer and backdoor, added by a malicious publisher account (`atiertant`) that gained control via expired-email-domain takeover of the original maintainer's account. The malicious payload is an obfuscated IIFE appended to `node-ipc.cjs` (CommonJS bundle), activating via `setImmediate()` on module load; the ESM entrypoint is unaffected. Capabilities include host fingerprinting, enumeration and exfiltration of ~90 credential categories: AWS/Azure/GCP/OCI/DigitalOcean/Hetzner/Fly/Vercel configuration files, SSH keys, Kubernetes service account tokens, npm/Git tokens, Terraform state, `.env` files, shell history, and macOS Keychain databases. Exfiltration uses DNS TXT queries (~29,400 per 500 KiB archive) to `bt[.]node[.]js`, with data XOR-encoded against SHA-256 keystream, base64-encoded, then character-substituted; bootstrap C2 at `sh[.]azurestaticprovider[.]net:443` (IP: 37.16.75.69). Version 12.0.1 additionally contains SHA-256 fingerprint verification targeting specific projects. Socket's AI scanner detected the malicious publish within ~3 minutes. The attack also spans historical versions (10.1.1, 10.1.2, 11.0.0, 11.1.0). Immediate action: audit `node-ipc` transitive dependencies across the build graph; rotate all secrets accessible from developer workstations and CI/CD runners.
    ch_eu_nexus: "Global; Swiss and European public-sector development teams using CI/CD pipelines with npm dependencies transitively pulling node-ipc are in scope. Any developer workstation that loaded a malicious version will have exposed cloud credentials."
    public_sector_nexus: "indirect"
    sector: "technology, software development, government IT"
    cves: []
    actors_campaigns_malware:
      - "atiertant (malicious npm publisher)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Socket's AI scanner detected the newly published malicious versions within roughly three minutes of publication, classifying the activity as malware."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/node-ipc-package-compromised"
      - quote: "The malware harvests approximately 90 credential categories including AWS, Google Cloud, Microsoft Azure credentials; SSH keys and Kubernetes tokens; GitHub CLI configurations; Claude AI and Kiro IDE settings; Terraform state files and database passwords; Shell history."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html"
    extended_notes: |
      MITRE ATT&CK: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain), T1555 (Credentials from Password Stores), T1083 (File and Directory Discovery), T1048.003 (Exfiltration Over Alternative Protocol — DNS TXT). Detection: hunt for DNS queries to `bt.node.js` or `sh.azurestaticprovider.net` from developer workstations and CI runners; monitor for unexpected `setImmediate` chains in node process trees spawning DNS resolution at unusual volume; use dependency-audit tools (Socket.dev GitHub app, npm audit --audit-level=critical) to flag post-publish metadata changes. Hardening: enforce npm package locking with `npm ci`; use `--ignore-scripts` flag in CI; pin to known-good hash digests; monitor npm token rotation telemetry.

