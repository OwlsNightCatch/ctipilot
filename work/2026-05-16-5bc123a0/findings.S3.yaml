    discovery_trace: "first seen at: msft-secblog (bridge subcommand msft-secblog recent threat-intelligence) → primary: Microsoft Threat Intelligence blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/14/kazuar-anatomy-of-a-nation-state-botnet/ → corroborating: THN, URL https://thehackernews.com/2026/05/turla-turns-kazuar-backdoor-into.html"
    summary: |
      Microsoft Threat Intelligence published a comprehensive 4,590-word technical analysis on 2026-05-14 of Kazuar's evolution from a traditional .NET backdoor into a modular peer-to-peer botnet attributed to Russia's Secret Blizzard (FSB Center 16, also tracked as Turla, VENOMOUS BEAR, Uroburos, Blue Python, ATG26). The botnet now comprises three specialised modules — Kernel (central coordinator, leadership election via Mailslot, C2 management), Bridge (proxy between leader Kernel and C2 infrastructure), and Worker (data harvesting tasks) — with inter-module IPC over Windows Messaging or Mailslot, and inter-module serialisation via Google Protocol Buffers. A leadership-election algorithm based on uptime divided by reboot count ensures only one Kernel per infected network communicates externally; non-leader Kernels enter SILENT mode. External C2 channels include HTTP, WebSocket Secure (WSS), and Exchange Web Services (EWS) — abusing the target's own email infrastructure as a covert channel. Configuration spans ~150 types across eight categories including AMSI/WLDP/ETW bypass switches, exfiltration time-windows (default 08:00–20:00 weekdays), keylogging buffer sizes, screenshot capture, and MAPI email monitoring. Anti-analysis checks include sandbox-DLL detection, canary-file probing, and anti-dump protections. The Pelmeni dropper embeds payloads encrypted with the target hostname, preventing execution outside the intended environment. Data staging uses a working directory partitioned by function (keylogger output, screenshot captures, harvested files). Primary targets include ministries of foreign affairs, embassies, defence departments, and defence contractors with emphasis on Europe, Central Asia, and Ukraine. Defender guidance: deploy ASR rules blocking obfuscated-script execution and PSExec/WMI process creation; enable EDR in block mode with tamper protection; audit LSA notification package DLLs for unsigned entries; hunt for Mailslot-based election traffic and anomalous EWS authentication patterns.
    ch_eu_nexus: "Direct — Russia's Secret Blizzard (FSB Center 16) specifically targets European government ministries, embassies, and defence contractors as primary victim set; European organisations in diplomatic, defence, and public administration sectors are the documented primary target profile."
