  - title: "Unit 42: Gremlin Stealer evolves with .NET resource-file obfuscation, crypto-clipper, and WebSocket session-hijack modules — financial credentials and session tokens targeted"
    sources:
      - url: "https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"
