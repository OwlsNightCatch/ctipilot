      MITRE ATT&CK: T1095 (Non-Application Layer Protocol — Mailslot IPC), T1071.001 (Web Protocols — HTTP/WSS C2), T1114.002 (Email Collection — EWS/MAPI), T1056.001 (Keylogging), T1113 (Screen Capture), T1027 (Obfuscated Files — hostname-bound encryption), T1083 (File and Directory Discovery), T1082 (System Information Discovery). Detection hunt: unsigned LSA notification package DLLs under HKLM\SYSTEM\CurrentControlSet\Control\Lsa; Mailslot creation events on DCs from non-standard processes; anomalous EWS impersonation or programmatic EWS access from non-Exchange processes; Sysmon EID 17/18 for named-pipe activity with unusual parent images.

  - title: "UNC6671 (BlackFile) vishing-driven AiTM extortion operation: SSO bypass, programmatic SharePoint exfiltration (1M+ files), probable rebrand announced — GTIG deep-dive"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"
        publisher: "Google Threat Intelligence Group (GTIG)"
        date: "2026-05-15"
        role: "primary"
    discovery_trace: "first seen at: mandiant-gtig (bridge subcommand feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v) → primary: GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"
    summary: |
      GTIG published a detailed analysis on 2026-05-15 of UNC6671, operating under the "BlackFile" brand since February 2026. The actor targets Microsoft 365 and Okta environments via a real-time vishing + AiTM chain: callers impersonate internal IT helpdesk on victims' personal phones, direct targets to attacker-registered lookalike SSO portals (`<org>.enrollms[.]com`, `<org>.passkeyms[.]com` — Tucows-registered), capture credentials and MFA tokens live, and immediately register a new MFA device for persistent access (T1556 — Modify Authentication Process). Post-compromise exfiltration uses Python `requests` and PowerShell scripts against Microsoft Graph API and direct SharePoint file-stream URLs; data volume reaching 1M+ files per victim. User-agent mismatches (`python-requests/2.28.1`, `WindowsPowerShell/5.1` spoofing ClientAppId `d3590ed6-52b3-4102-aeff-aad2292ab01c` — Microsoft Office) and the `FileAccessed` vs `FileDownloaded` audit-log distinction are key detection signals. Targets span M365/SharePoint/OneDrive, Okta, Salesforce, Zendesk, ServiceNow. Geographic focus: North America, Australia, UK. Extortion demands evolved from millions to low-six-figures with aggressive escalation (spam, C-suite voicemails, swatting). The BlackFile DLS went offline late April 2026 and relaunched 2026-05-11 with a shutdown announcement, signalling probable rebrand rather than cessation. GTIG explicitly distinguishes UNC6671 from ShinyHunters (UNC6240). Defender priorities: enforce FIDO2-resistant MFA (eliminate SMS/push); monitor Okta `system.multifactor.factor.setup` events preceded by auth failures; alert on `FileAccessed` bulk events from scripting user-agents; flag authentication from commercial VPNs anomalous to user geography.
    ch_eu_nexus: "Indirect — organisation headquartered in North America/AU/UK; EU subsidiaries and SaaS-connected European data pipelines are in scope for the exfiltration model. Vishing social engineering is language-agnostic and applicable to EU-based SSO environments."
    public_sector_nexus: "indirect"
    sector: "finance, technology, healthcare, professional services"
    cves: []
