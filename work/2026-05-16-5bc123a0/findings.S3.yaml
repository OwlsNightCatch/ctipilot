        attribution: "Google Threat Intelligence Group (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"
      - quote: "1M+ individual files exfiltrated from single victim… tens of thousands of rapid SharePoint file interactions"
