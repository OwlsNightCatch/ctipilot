    summary: |
      Microsoft disclosed CVE-2026-42897 on 2026-05-14 (May 2026 Patch Tuesday), rating it CVSS 8.1 (temporal 7.5, vector AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N). CWE-79 (Improper Neutralization of Input / XSS) in Outlook Web Access allows an unauthenticated network attacker to execute arbitrary JavaScript in a victim's browser when the victim opens a specially crafted email under specific interaction conditions, enabling spoofing attacks with high-confidentiality and high-integrity impact. Microsoft has marked `exploited: Yes` with status "Exploitation Detected" and `severity: Critical`. Affected: Exchange Server 2016, 2019, and Subscription Edition (all current update levels). Exchange Online is unaffected. No permanent patch is yet available — Microsoft is using the Exchange Emergency Mitigation Service (EEMS) to deliver an automatic URL-rewrite mitigation (enabled by default); organisations without EEMS connectivity can deploy the Exchange On-Premises Mitigation Tool (EOMT) via PowerShell for air-gapped environments. Defenders should verify EEMS is enabled (`Get-ExchangeDiagnosticInfo -Server <server> -Process EdgeTransport -Component ResourceThrottling`), audit Outlook Web Access access logs for XSS payloads in email-viewing interactions, and monitor for unusual JavaScript execution in OWA context.
