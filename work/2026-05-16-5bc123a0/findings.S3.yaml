    discovery_trace: "first seen at: unit42 (bridge subcommand feed https://unit42.paloaltonetworks.com/feed/) → primary: Unit 42 blog, URL https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"
    summary: |
      Unit 42 published on 2026-05-15 an analysis of evolved Gremlin stealer variants incorporating three new capability tiers. Obfuscation: payloads embed encrypted strings in .NET resource sections (XOR-keyed), with identifier renaming to single/double characters and a string-decoder function (`_003CModule_003E.c()`) that resolves values at runtime — defeating static signature analysis of string literals. Crypto-clipper: real-time clipboard monitoring via `SetClipboardViewer`/`WM_DRAWCLIPBOARD` chain, substituting cryptocurrency wallet addresses with attacker-controlled ones (Bitcoin, Ethereum wallet regex patterns). Session hijack module: WebSocket-based component reads active browser process memory to extract session tokens directly from Chrome-based browser processes, bypassing cookie encryption. Credential scope: browser cookies, session tokens, saved passwords, payment-card details, FTP/VPN credentials, Discord tokens (dedicated regex-validated scanner), clipboard content, and cryptocurrency wallet files. C2: HTTPS POST exfiltration to a private web panel at 37th octet `194.87.92.109/i.php`; secondary Telegram Bot API channel. Data staged in ZIP archives named by victim IP. No attribution to a named threat actor cluster. Affected platform: Windows with Chrome-based browsers and crypto-wallet software.
    ch_eu_nexus: "Global; Swiss and European users of cryptocurrency wallets and Chrome-based browsers are in scope. Crypto-clipper and session-hijack capabilities are platform-agnostic within Windows environments."
    public_sector_nexus: "indirect"
    sector: "finance, cryptocurrency, technology"
    cves: []
    actors_campaigns_malware:
      - "Gremlin Stealer"
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Payloads embedded in .NET Resource sections with XOR encryption... Crypto Clipper: real-time clipboard monitoring replacing victim cryptocurrency wallet addresses with attacker-controlled ones... Session Hijacking: WebSocket-based module intercepting active browser sessions directly from running processes."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"
    extended_notes: |
      MITRE ATT&CK: T1027.002 (Obfuscated Files — Software Packing / resource embedding), T1115 (Clipboard Data), T1555.003 (Credentials from Web Browsers), T1185 (Browser Session Hijacking). Detection: Sysmon EID 10 (process access) targeting `chrome.exe`, `msedge.exe`, `brave.exe` from unexpected parent processes; clipboard hook registration via SetClipboardViewer from non-standard binaries; DNS/network connections to `194.87.92.109` or Telegram API from non-browser processes. Hardening: deploy browser isolation for high-value sessions; enable Chrome's `--enable-features=EncryptedClientHello` and cookie-theft mitigations; audit clipboard access APIs in EDR telemetry.

  - title: "SentinelOne: Living Off the Pipeline — CI/CD subversion taxonomy with three real-world intrusion case studies including TeamCity, GitLab service-account pivot, and Contagious Interview"
    sources:
      - url: "https://www.sentinelone.com/blog/living-off-the-pipeline-defending-against-ci-cd-subversion/"
        publisher: "SentinelOne"
        date: "2026-05-15"
        role: "primary"
    discovery_trace: "first seen at: sentinellabs (bridge subcommand feed https://www.sentinelone.com/feed/) → primary: SentinelOne blog, URL https://www.sentinelone.com/blog/living-off-the-pipeline-defending-against-ci-cd-subversion/"
    summary: |
      SentinelOne published on 2026-05-15 a practitioner-focused taxonomy of CI/CD pipeline subversion techniques, illustrated with three real case studies. Case 1: unpatched TeamCity server (CVE-2023-42793) exploited to deploy backdoors via privileged build tasks, remaining undetected for 12+ months. Case 2: GitLab service-account token compromise enabling creation of malicious Ansible playbooks automatically executed by pipelines — demonstrating how service-account over-privilege translates directly to code execution on production systems. Case 3: Contagious Interview campaign using fraudulent job offers directing victims to fake skill-assessment sites deploying malware silently on developer workstations. Additional vectors covered: attacker-registered GitHub self-hosted runners ("Sha1-Hulud" pattern), repository-discussion-comment workflow triggers, dependency poisoning with reconnaissance preinstall scripts, and maintainer-account compromise appending malicious code. Defender monitoring priorities: unexpected build-runner registrations or unusual naming; new/modified pipelines from service accounts; suspicious child-process spawn from build agents (especially `cmd.exe`, `powershell.exe`, `curl`, `wget` without established baseline); credential access and reverse tunnel establishment from build infrastructure; secrets introduced via workflow config modifications.
    ch_eu_nexus: "Global; Swiss public-sector DevOps teams and European government IT delivery pipelines using JetBrains TeamCity, GitLab, or GitHub Actions are specifically in scope — all three platforms cited in cases."
    public_sector_nexus: "indirect"
    sector: "technology, software development, government IT"
    cves: [CVE-2023-42793]
    actors_campaigns_malware:
      - "Contagious Interview"
      - "Sha1-Hulud"
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Exploited TeamCity instance (CVE-2023-42793) remained undetected 12+ months, deploying backdoors through privileged build tasks... GitLab token compromise enabled creation of malicious Ansible playbooks automatically executed by CI/CD pipelines."
        attribution: "SentinelOne"
        source_url: "https://www.sentinelone.com/blog/living-off-the-pipeline-defending-against-ci-cd-subversion/"
    extended_notes: |
      MITRE ATT&CK: T1195.002 (Supply Chain Compromise), T1547 (Persistence — rogue runner registration), T1555 (Credential Harvesting from pipeline secrets), T1204 (User Execution — social engineering via fake job offers), T1072 (Software Deployment Tools — Ansible abuse). Detection specifics: monitor GitHub/GitLab audit logs for `runner.registered` events with unfamiliar names or from unexpected IP ranges; alert on `workflow_run` triggers from repository discussion comments; cross-reference secrets-injection patterns with SBOM dependency audits. Note: Sha1-Hulud campaign referenced here predates Mini Shai-Hulud (TeamPCP); distinct actor/campaign, same runner-registration technique.

