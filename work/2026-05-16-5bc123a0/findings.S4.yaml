  - title: "OpenClaw 'Claw Chain' (CVE-2026-44112 / CVE-2026-44115 / CVE-2026-44118 / CVE-2026-44113) — four chained flaws in AI agent platform enable sandbox escape, privilege escalation, and credential exfiltration; 245,000 public instances"
    sources:
      - url: "https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"
        publisher: "Cyera Research"
        date: "2026-05-15"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/four-openclaw-flaws-enable-data-theft.html"
        publisher: "The Hacker News"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (TheHackersNews RSS), URL https://feeds.feedburner.com/TheHackersNews item 'Four OpenClaw Flaws Enable Data Theft, Privilege Escalation, and Persistence' → drill: https://thehackernews.com/2026/05/four-openclaw-flaws-enable-data-theft.html → primary: Cyera Research blog, URL https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"
    summary: |
      Cyera Research disclosed four chained vulnerabilities in OpenClaw, an autonomous AI agent platform (launched late 2025, also known as Clawdbot), affecting all versions prior to the 2026-04-23 patch release. The four CVEs — collectively dubbed "Claw Chain" — can be chained to achieve a full sandbox-escape → credential-harvest → privilege-escalation → persistence sequence that mimics normal agent behaviour, making detection by conventional controls significantly harder.

      CVE-2026-44112 (CVSS 9.6, CRITICAL): TOCTOU race condition in the OpenShell managed sandbox backend. An attacker with code execution inside the sandbox (via malicious plugin, prompt injection, or supply-chain input) can race the filesystem write path to redirect writes outside the intended mount root, enabling host-filesystem tampering and backdoor placement. CVE-2026-44115 (CVSS 8.8, HIGH): Incomplete allowlist validation in OpenClaw's command parser; shell expansion tokens embedded in environment variable names bypass the validation gate, leaking API keys, tokens, and credentials at execution time. CVE-2026-44118 (CVSS 7.8, HIGH): OpenClaw trusts a client-controlled senderIsOwner flag in MCP loopback messages without validating against the authenticated session, allowing privilege escalation to owner-level agent control. CVE-2026-44113 (CVSS 7.7, HIGH): Companion TOCTOU read escape enabling file disclosure outside the sandbox root.

      Patch: OpenClaw 2026.4.22 (released 2026-04-23, GitHub Security Advisories GHSA-5h3g-6xhh-rg6p, GHSA-wppj-c6mr-83jj, GHSA-r6xh-pqhr-v4xh, GHSA-x3h8-jrgh-p8jx). Exposure: approximately 65,000 (Shodan) to 180,000 (ZoomEye) publicly accessible instances, totalling an estimated 245,000 exposed servers. Exploitation prerequisites: code execution within the OpenShell sandbox — achievable via malicious plugin installation, prompt injection into the agent context, or supply-chain compromise of an OpenClaw plugin. Detection: monitor for agent process writing files outside designated sandbox mount directories; alert on MCP loopback messages with senderIsOwner=true from sources not matching the authenticated session owner; alert on environment-variable expansion in command strings at agent execution.
    ch_eu_nexus: "Global; EU public-sector AI pilots using OpenClaw or similar autonomous-agent platforms are potentially in scope. OpenClaw has known integrations with Microsoft Agent 365, an enterprise integration used by EU government and corporate deployments."
    public_sector_nexus: "indirect — AI agent platforms increasingly adopted in public-sector automation pilots"
    sector: "technology, AI-platforms, all-sectors"
    cves: ["CVE-2026-44112", "CVE-2026-44115", "CVE-2026-44118", "CVE-2026-44113"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "By weaponizing the agent's own privileges, an adversary moves through data access, privilege escalation, and persistence -- using the agent as their hands inside the environment, with each step looking like normal agent behavior to traditional controls"
        attribution: "Cyera Research"
        source_url: "https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"
      - quote: "With ~65,000 (Shodan) and ~180,000 (Zoomeye) publicly accessible OpenClaw instances as of May 2026, this exposure surface is immediate and broad."
        attribution: "Cyera Research"
        source_url: "https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"

  - title: "Cushman & Wakefield vishing breach confirmed — ShinyHunters publishes 50 GB Salesforce dataset (310,400 accounts) after ransom deadline passes; Qilin separately lists victim"
    sources:
      - url: "https://www.cyberdaily.au/security/13553-real-estate-giant-cushman-wakefield-confirms-cyber-incident-qilin-and-shinyhunters-claim-attack"
        publisher: "Cyber Daily"
        date: "2026-05-05"
        role: "primary"
      - url: "https://cybernews.com/news/cushman-wakefield-shinyhunters-salesforce-breach-claim/"
        publisher: "CyberNews"
        date: "2026-05-05"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Cushman Wakefield ShinyHunters breach Salesforce May 2026') → pivot: CyberNews article, URL https://cybernews.com/news/cushman-wakefield-shinyhunters-salesforce-breach-claim/ → primary: Cyber Daily breach confirmation URL https://www.cyberdaily.au/security/13553-real-estate-giant-cushman-wakefield-confirms-cyber-incident-qilin-and-shinyhunters-claim-attack → note: The Register URL https://www.theregister.com/2026/05/05/cushman_wakefield/ confirmed same story"
    summary: |
      Cushman & Wakefield, a US-headquartered global real estate services firm (a Fortune 500 company managing properties and transactions worth hundreds of billions annually), confirmed a data breach stemming from a vishing (voice phishing) attack that began approximately 2026-05-01. ShinyHunters claimed it called one employee, impersonated internal IT or a trusted vendor, and convinced the employee to hand over Salesforce credentials or connect an attacker-controlled tool to the company's Salesforce environment, yielding access to 500,000+ Salesforce records containing customer PII, leasing pipeline data, broker contacts, building owner records, and internal corporate communications. The company set a ransom deadline of 2026-05-06; when negotiations collapsed, ShinyHunters published the full 50 GB dataset. Have I Been Pwned indexed the breach on 2026-05-12 confirming 310,400 affected accounts. Qilin independently listed Cushman & Wakefield on its data-leak site on 2026-05-04, suggesting a separate intrusion or resold initial access. The company confirmed the incident as "limited" and stated systems and operations continue normally; it did not confirm or deny the scope of data claimed by the attackers.

      Note: This item is borderline with respect to the 36-hour window (initial disclosure 2026-05-05, HIBP indexing 2026-05-12). Included because it is an in-window development (HIBP indexing) on a story not yet covered in prior briefs.
    ch_eu_nexus: "Global real estate; EU clients and counterparties of Cushman & Wakefield commercial property operations may have PII in the leaked dataset. The firm operates extensively in Switzerland, Germany, France, and across EU real estate markets."
    public_sector_nexus: "indirect — public-sector real estate and facilities transactions may be in scope"
    sector: "real-estate, financial-services"
    cves: []
    actors_campaigns_malware: ["ShinyHunters", "Qilin"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Cushman & Wakefield recently became aware of a limited data security incident due to vishing. We have activated our response protocols, including taking steps to contain the unauthorised activity"
        attribution: "Cyber Daily (citing company statement)"
        source_url: "https://www.cyberdaily.au/security/13553-real-estate-giant-cushman-wakefield-confirms-cyber-incident-qilin-and-shinyhunters-claim-attack"
    extended_notes: |
      The Cushman & Wakefield breach exemplifies the vishing-to-CRM-platform attack chain that ShinyHunters has now deployed against multiple enterprise targets (Canvas/Instructure, Cushman & Wakefield). The Salesforce-as-exfiltration-target pattern — where vishing yields CRM credentials rather than network access, bypassing EDR — is an emerging gap in enterprise security programmes that focus on endpoint and network controls but treat SaaS access as inherently trusted once credentials are validated. Defenders should review Salesforce event monitoring for unusual bulk record downloads, anomalous API client registrations, and out-of-country login events as indicators of this attack pattern.

