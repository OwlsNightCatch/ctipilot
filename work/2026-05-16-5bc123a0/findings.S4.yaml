items:
  - title: "node-ipc npm supply-chain compromise — expired domain used to hijack maintainer account, credential-stealing IIFE injected into 822 K-weekly-download package"
    sources:
      - url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack"
        publisher: "StepSecurity"
        date: "2026-05-14"
        role: "primary"
      - url: "https://www.csoonline.com/article/4171926/expired-domain-leads-to-supply-chain-attack-on-node-ipc-npm-package.html"
        publisher: "CSO Online"
        date: "2026-05-14"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html"
        publisher: "The Hacker News"
        date: "2026-05-14"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (TheHackersNews RSS), URL https://feeds.feedburner.com/TheHackersNews → drill: https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html → primary: StepSecurity analysis, URL https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack → corroborating: CSO Online, URL https://www.csoonline.com/article/4171926/expired-domain-leads-to-supply-chain-attack-on-node-ipc-npm-package.html"
    summary: |
      On 2026-05-14, three malicious versions of the node-ipc npm package (9.1.6, 9.2.3, 12.0.1) were simultaneously published by rogue account "atiertant", whose associated email domain (atlantis-software.net) had expired in January 2025. The attacker re-registered the domain on 2026-05-07 via Namecheap, used it to execute a password reset on the npm account, and then published the backdoored versions. The attack vector exploits npm's lack of domain-expiry monitoring for maintainer email addresses.

      The malicious payload is an 80 KB obfuscated Immediately Invoked Function Expression (IIFE) appended to node-ipc.cjs that executes unconditionally on every require('node-ipc'). Four-layer obfuscation is used: string array shuffling, control-flow flattening, dead code injection, and custom base-16 encoding with reversed nibbles. The payload forks a daemon via setImmediate(), enumerates 90-127 file-path patterns covering AWS credentials, Azure tokens, GCP keys, SSH private keys, Kubernetes configs, GitHub tokens, Terraform state, database connection strings, and shell histories. All collected data is compressed into a GZIP archive and exfiltrated via two simultaneous channels: HTTPS POST to fake Azure domain sh.azurestaticprovider[.]net:443 and DNS TXT record queries encoding chunks to a C2 IP (37.16.75.69). Version 12.0.1 includes a SHA-256 fingerprinting gate targeting specific high-value projects; 9.x versions fire universally. The 9.x releases are entirely fabricated (the legitimate 9.x line never included a CommonJS bundle), which is a file-size anomaly indicator: 117 KB vs. 37 KB for a clean install.

      Socket's AI scanner flagged the malware within approximately 3 minutes of publication. Node-ipc was pulled from the registry after detection. Defenders should audit CI/CD and developer workstations for node-ipc@9.1.6, 9.2.3, or 12.0.1 installed between 2026-05-14 00:00 UTC and 2026-05-14 end-of-day; treat any match as a full developer-secrets compromise requiring rotation of all credentials accessible from the build environment. Detection hunt: DNS egress to *.bt.node.js suffix; HTTPS connections to sh.azurestaticprovider[.]net or 37.16.75.69; staging artefacts under $TMPDIR/nt-<PID>/; process environment containing __ntw=1.
    ch_eu_nexus: "Global; EU developers and CI/CD environments that depend on node-ipc are at risk. The package has 822K weekly downloads and is a transitive dependency of 424+ projects including Vue CLI, webpack tooling, and various DevOps utilities widely used in Swiss and European public-sector CI pipelines."
    public_sector_nexus: "indirect — public-sector DevOps environments using Node.js toolchains are affected if node-ipc was installed in the compromised window"
    sector: "technology, software-development, all-sectors"
    cves: []
    actors_campaigns_malware: ["atiertant (rogue maintainer account)", "unnamed threat actor"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The attacker exploited a dormant maintainer account (atiertant) whose email domain (atlantis-software.net) had expired in January 2025. By re-registering the expired domain and setting up an email server, the attacker executed a password reset on the npm account"
        attribution: "CSO Online"
        source_url: "https://www.csoonline.com/article/4171926/expired-domain-leads-to-supply-chain-attack-on-node-ipc-npm-package.html"
      - quote: "The payload executes via an Immediately Invoked Function Expression (IIFE) appended to node-ipc.cjs that fires unconditionally when the module is required. The attack employs four-layer obfuscation"
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/node-ipc-npm-supply-chain-attack"
      - quote: "harvests credentials, SSH keys, cloud tokens, and AI tool configurations from the local environment"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/stealer-backdoor-found-in-3-node-ipc.html"
    extended_notes: |
      This attack shares the expired-domain-for-maintainer-hijack pattern with the PyPI "malware-curation" supply-chain attack from 2025. The IIFE-not-lifecycle-hook evasion specifically bypasses npm audit hooks and Snyk/OWASP Dependency Check's install-hook scanning. The DNS TXT exfil method bypasses corporate DNS logging by overriding local resolvers with public DNS (8.8.8.8). The SHA-256 project fingerprinting in version 12.0.1 suggests a targeted component aimed at specific high-value organisations, with the 9.x versions acting as broad harvesting net.

  - title: "CVE-2026-42897 — Microsoft Exchange Server XSS zero-day actively exploited via crafted email; no patch yet, Emergency Mitigation Service auto-applied"
    sources:
      - url: "https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
        publisher: "Help Net Security"
        date: "2026-05-15"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-15"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html"
        publisher: "The Hacker News"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (TheHackersNews RSS), URL https://feeds.feedburner.com/TheHackersNews item 'On-Prem Microsoft Exchange Server CVE-2026-42897 Exploited via Crafted Email' → drill: https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html → primary: MSRC advisory URL https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-42897 (confirmed via outbound links) → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
    summary: |
      CVE-2026-42897 (CVSS 8.1) is a cross-site scripting (XSS) flaw — CWE-79 improper neutralisation of input during web page generation — in the Outlook Web Access (OWA) component of on-premises Microsoft Exchange Server. An unauthenticated attacker delivers a specially crafted email to a target; when the user opens the message in OWA, arbitrary JavaScript executes in the browser context of the authenticated OWA session. Microsoft confirmed active in-the-wild exploitation as of the 2026-05-15 disclosure, though it has not yet identified the specific threat actor, exploitation scale, or post-XSS kill chain.

      Affected: Exchange Server Subscription Edition RTM, Exchange 2019 (all cumulative updates), Exchange 2016 CU23. Exchange Online is not affected. No permanent patch has been issued. Microsoft's Exchange Emergency Mitigation Service (EEMS), enabled by default, automatically applies a URL-rewrite rule that blocks the crafted request format; admins who have disabled EEMS must apply the EOMT script manually (aka.ms/UnifiedEOMT). Permanent security updates are forthcoming for Exchange SE RTM, Exchange 2016 CU23, and Exchange 2019 CU14/CU15; Exchange 2016/2019 fixes will be limited to organisations enrolled in the Period 2 Extended Security Update (ESU) programme.

      Detection: hunt for anomalous OWA session behaviour — JavaScript executing under the OWA web context, outbound HTTP/HTTPS from the Exchange front-end (W3SVC) process to external hosts, IIS access-log entries for OWA URL patterns with unusual query strings. Email-gateway telemetry: flag emails with HTML bodies that embed encoded JavaScript in specific OWA-targeted URI patterns.
    ch_eu_nexus: "EU and Switzerland maintain substantial on-premises Exchange Server deployments in public-sector, healthcare, and cantonal/municipal environments. Exchange 2016 and 2019 are particularly prevalent in organisations that have not migrated to Exchange Online."
    public_sector_nexus: "direct — on-premises Exchange Server is widely deployed across Swiss Confederation, cantonal government, and EU public-sector environments"
    sector: "all-sectors, government, healthcare, education"
    cves: ["CVE-2026-42897"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker could exploit this issue by sending a specially crafted email to a user. If the user opens the email in Outlook Web Access and certain interaction conditions are met, arbitrary JavaScript can be executed in the browser context."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
      - quote: "Microsoft tagged this with 'Exploitation Detected' assessment. However, 'There are currently no details on how the vulnerability is being exploited, the identity of the threat actor behind the activity, or the scale of such efforts.'"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html"
    extended_notes: |
      This disclosure pattern — actively exploited XSS in Exchange OWA delivered by email — is consistent with prior Exchange-targeting campaigns (ProxyLogon 2021, HAFNIUM; ProxyShell 2021). The EEMS auto-mitigation is the key differentiator from prior Exchange zero-days; admins who disabled EEMS for compliance or operational reasons are exposed with no alternative mitigation except blocking external OWA access at the perimeter. The Period 2 ESU constraint means organisations on Exchange 2016/2019 without ESU enrolment will not receive a patch.

  - title: "Dream Market administrator Owe Martin Andresen arrested in Germany; US indicts on six money-laundering counts after cryptocurrency and physical-gold OPSEC failures"
    sources:
      - url: "https://therecord.media/dream-market-admin-arrested-in-germany"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-14"
        role: "primary"
      - url: "https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet"
        publisher: "US DEA"
        date: "2026-05-13"
        role: "primary"
      - url: "https://darkwebinformer.com/german-national-indicted-over-money-laundering-tied-to-defunct-dream-market-darknet-marketplace/"
        publisher: "Dark Web Informer"
        date: "2026-05-13"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Dream Market admin charged OPSEC failure 2026') → pivot: The Record, URL https://therecord.media/dream-market-admin-arrested-in-germany → pivot: DEA press release, URL https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet → corroborating: Dark Web Informer, URL https://darkwebinformer.com/german-national-indicted-over-money-laundering-tied-to-defunct-dream-market-darknet-marketplace/"
    summary: |
      Owe Martin Andresen, 49, a German national alleged by US and German prosecutors to be "Speedstepper" — the lead administrator of the Dream Market darknet marketplace (2013-2019) — was arrested in Germany on 2026-05-07 in a coordinated operation by the BKA, IRS-CI Cyber Crimes Unit, DEA Miami, USPIS, FBI, HSI, and Zentrale Kriminalinspektion Oldenburg. A US federal grand jury had returned an indictment on 2026-01-13 in the Northern District of Georgia charging Andresen with six counts of international concealment money laundering and six counts of concealment money laundering (maximum 240 years in aggregate; German charges carry up to 5 years).

      The OPSEC failures that enabled identification after seven years at large were operational rather than technical. First, in late 2022, Andresen allegedly accessed Dream Market's dormant cryptocurrency wallets — an action traceable to the original private keys — and consolidated the contents into a single wallet. Second, in August 2023, he used an Atlanta-based cryptocurrency service to purchase gold bars and had them shipped directly to his home address in Germany. Seizures at arrest included approximately $1.7 million in gold bars, $23,000 cash, and crypto holdings worth approximately $1.2 million. Three prior co-administrators ("Oxymonster", "KITT3N", "GOWRON") had previously been convicted.

      For defenders and EU law-enforcement liaisons: this case demonstrates that law-enforcement attribution of darknet operators increasingly relies on post-cessation financial behaviour rather than on-platform OPSEC, and that cryptocurrency-to-physical-asset conversion through regulated services creates prosecutable trails years after the underlying offence.
    ch_eu_nexus: "Switzerland and Europe: Dream Market was a major narcotics marketplace with EU user base. The BKA and Zentrale Kriminalinspektion Oldenburg were lead German investigating agencies. The arrest has direct implications for European law-enforcement liaison operations."
    public_sector_nexus: "indirect — law enforcement and public-sector cybercrime intelligence relevance"
    sector: "law-enforcement, cybercrime"
    cves: []
    actors_campaigns_malware: ["Dream Market", "Speedstepper (Owe Martin Andresen)"]
    verification: MULTI-SOURCE
