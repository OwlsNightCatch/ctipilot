sources_recipe_notes:
- 'bacs.admin.ch: `url --direct https://www.bacs.admin.ch/de/<medienmitteilungen|im-fokus|aktuelle-vorfaelle>` + split on `class="card card--default card--clickable` still works (card titles come back wrapped in `<!--[--><h3 class="">`); `extract` on /de/<slug> returns clean body with date metadata. Slug pattern for fresh items is /de/26-<topic>-de or /de/26wNN-de.'
- 'inside-it.ch: `url --direct <article>` NEXT_DATA path props.pageProps.post.post.managed.published.elements[*].data.rawState.blocks[*].text still yields the full body (title/date keys at that path return None, the feed carries them).'
- 'publica.ch incident page: the dated ''Stand'' accordions are collapsed in `extract`; use `url --direct` and strip tags to read them.'
- 'baselland.ch: direct 403 on all pages; `extract` works only through the jina fallback (keys nearly all 402 exhausted; one still served the listing and the 2026-11-18 release).'
- eid.admin.ch / bj.admin.ch e-ID pages in `extract` return stale (2024/2025) cached text; use Netzwoche/ICTjournal for current e-ID news.
