  discovery_trace: 'first seen at: nextgov-fcw, URL https://www.nextgov.com/rss/cybersecurity/ (feed, 25 items, rotational lookback 168 h) → drill: the two articles above (extract). Nextgov cites The New York Times (2026-11-24, spy-agency networks) and CNN (2026-11-20, FBI hacked again) as first reporters; neither was fetched. WebSearch ("FBI National Crime Information Center NCIC breach hack investigating November 2026", "CIA ODNI NGA OSINT system breach ARTEX New York Times …") found no second source in the search index.'
  summary: 'Nextgov reports two US federal intrusions. First, the FBI''s National Crime Information Center (NCIC), the database US police use to share information on wanted and missing people, protection orders and stolen property: CNN first reported the breach on 2026-11-20, and Nextgov says the US President acknowledged it on Saturday 2026-11-21 while the perpetrators and the accessed data remain unknown; state, local, tribal and territorial users had received no formal FBI communication, per an anonymous law-enforcement representative, and an Illumio executive notes that investigators must also consider whether records were altered. Second, on 2026-11-24 (NYT first reporting) the CIA and ODNI discovered a breach of an unclassified system used to analyse public and commercially available information; per one person familiar it did not touch classified systems and was resolved, and NYT reports NGA was affected concurrently. Nextgov states that ARTEX, the AI penetration-testing agent, ''is
    believed to have been used in the breach'' and that hackers recently used ARTEX in a low-impact intrusion into the Defense Department''s Cyber Defense Command, per two people familiar; whether the three events coincide is unclear. All of this rests on anonymous sources; no vector, actor or data volume is public. Transferable points for Swiss defenders: integrity (not only confidentiality) of national police data is the stated concern for NCIC, and the ARTEX link adds to the signal the BACS reported the same day (first confirmed AI-agent attacks in Switzerland).'
  region_nexus: united states (no Swiss victim; transferable to Swiss police and federal intelligence/administration IT)
  primary_sector_nexus: 'indirect: national police-database integrity (cf. Swiss police systems) and government AI-agent intrusion trend'
