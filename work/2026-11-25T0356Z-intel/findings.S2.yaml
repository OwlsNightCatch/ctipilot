- title: 'BACS (NCSC.ch): first confirmed attacks with AI agents against Swiss companies and critical-infrastructure operators in at least two sectors; every known case ended in a successful compromise'
  sources:
  - url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
    publisher: BACS / NCSC.ch (Im Fokus)
    date: '2026-11-24'
    role: primary
  discovery_trace: 'first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (listing via `url --direct`, card dated 24. November 2026, href /de/26-ki-agenten-1-de) → primary: https://www.bacs.admin.ch/de/26-ki-agenten-1-de (read with `extract`, trafilatura-direct, metadata date 2026-11-24). WebSearch ("BACS KI-Agenten Cyberangriffe erste bestätigte Fälle Schweiz ARTEX CyberStrikeAI kritische Infrastrukturen" and "NCSC Schweiz KI-Agenten Cyberangriffe erstmals bestätigt …") found no second outlet yet (the page is hours old).'
  summary: 'On 2026-11-24 the Swiss Federal Office for Cybersecurity (BACS / NCSC.ch) published a warning that, for the first time, it has received reports of attacks on companies in Switzerland carried out with the help of an AI agent; the victims are several companies and operators of critical infrastructure in at least two sectors, and in every case known to the BACS the use of AI agents led to a successful compromise of the victim''s IT systems. The BACS says the attackers used what it calls ''agentic offensive frameworks'': AI agents that independently search for weaknesses, choose attack tools, evaluate the results and plan and execute the next steps. These are dual-use tools (also used by penetration testers). As a general description of what such agents do, the BACS says they exploit, for example, default or easily guessable passwords and known flaws in software or in internet-connected systems; this is not a statement of how the Swiss victims were compromised. It says the agents
    need a fraction of the time a human would and can switch to other known attack methods when they meet a defence. The BACS also states that the number of internet-reachable AI agents such as ''ARTEX'' or ''CyberStrikeAI'' has almost doubled since October 2026 and expects a cluster of fast, successful attacks against all kinds of organisations. It does not say which framework was used in the confirmed Swiss cases, names no victim or sector, and says it shares technical indicators for detecting such tools with critical-infrastructure operators (not in the public text). Recommendations: restrict internet-exposed systems (geo-blocking or IP allow-lists); apply critical updates to internet-reachable systems as fast as possible and at the latest after 24 hours; protect every internet-reachable internal resource (webmail, VPN) with MFA or passkeys without exception; least privilege; detect deviations in the behaviour and data volume of identities, applications and workloads; run regular penetration
    tests.'
  region_nexus: switzerland (national authority's own reporting; confirmed Swiss victims, unnamed)
  primary_sector_nexus: 'adjacent-to-direct: critical-infrastructure operators in at least two unnamed sectors are among the victims; the Swiss public sector shares the exposure profile (internet-facing systems, default or guessable passwords, unpatched known flaws) but no administration is named'
  sector: critical-infrastructure / cross-sector (public sector in the same threat model)
