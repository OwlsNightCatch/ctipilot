- title: 'BACS weekly review 47: fraudsters mine company websites (staff directories filterable by function, reference-customer lists) for payroll-diversion requests to HR and fake ''site will be blocked'' payment demands to a vendor''s customers'
  sources:
  - url: https://www.bacs.admin.ch/de/26w47-de
    publisher: BACS / NCSC.ch (Wochenrückblick 47)
    date: '2026-11-24'
    role: primary
  discovery_trace: 'first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (listing via `url --direct`, card dated 24. November 2026) → primary: https://www.bacs.admin.ch/de/26w47-de (extract, metadata date 2026-11-24)'
  summary: 'The BACS weekly review of 2026-11-24 describes two current fraud patterns built on information companies publish themselves. In the first, attackers pose as employees and ask HR staff to change the bank account for salary payments to one the attackers control; the attackers relied on a company website where staff could be searched and filtered by function, which identified the right HR contacts. In the second, a Swiss IT service provider listed its reference customers on its website; the attackers wrote to those customers claiming that the website operated by the provider would soon be blocked or restricted unless a payment was made immediately, which looked plausible because the business relationship was real; earlier cases first asked for open invoices and then for payments to an allegedly new account. The BACS notes the same pattern could be used to push malware, harvest credentials or other confidential information. Recommendations: review the contact, staff and customer
    information published on your website and publish only what is business-necessary; train staff on CEO fraud, invoice fraud and social engineering; verify unusual payment or technical requests through a known, independent channel; treat time pressure as a warning sign. No technical indicators; the review''s weekly report-count statistics are linked, not quoted.'
  region_nexus: switzerland (BACS cases reported by Swiss companies)
  primary_sector_nexus: 'indirect: public administrations commonly publish staff directories by function and supplier reference lists, the data the two cases used'
  sector: cross-sector (companies; applies to public administrations' published directories)
