    attribution: BACS / NCSC.ch (Wochenrückblick 47)
    source_url: https://www.bacs.admin.ch/de/26w47-de
  extended_notes: Fraud-awareness level; the store has covered BACS weekly reviews only when they carried threat substance (weeks 22, 23, 25, 38). The 'week 46' review of 2026-11-17 (PHP-vulnerability bait phishing aimed at website admin credentials; phishing built from a household-staff platform's leaked AHV numbers) is 8 days old and was not returned.
