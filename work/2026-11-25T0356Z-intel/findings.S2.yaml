  novelty: update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
  evidence:
  - quote: In den vergangenen Tagen wurden dem BACS erstmals Cyberangriffe gegen Unternehmen in der Schweiz gemeldet, bei welchen der Angriff mit Unterstützung eines KI-Agenten durchgeführt worden sind.
    attribution: BACS / NCSC.ch (Im Fokus)
    source_url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
  - quote: In allen dem BACS bekannten Cyberangriffen führte der Einsatz von KI-Agenten zu einer erfolgreichen Kompromittierung der IT-Systeme des Opfers.
    attribution: BACS / NCSC.ch (Im Fokus)
    source_url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
  - quote: Zudem hat sich die Anzahl über das Internet erreichbarer KI-Agenten wie «ARTEX» oder «CyberStrikeAI» seit Oktober 2026 nahezu verdoppelt.
    attribution: BACS / NCSC.ch (Im Fokus)
    source_url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
  - quote: Kritische Sicherheitsupdates für über das Internet erreichbare Systeme sollten schnellstmöglich, jedoch spätestens nach 24 Stunden eingespielt werden.
    attribution: BACS / NCSC.ch (Im Fokus)
    source_url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
  extended_notes: 'WHY THIS IS AN UPDATE, NOT A NEW FINDING: the store''s ARTEX entry (2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse) already carries the line that on 2026-11-02 Roman Hüssy, co-head of GovCERT at the BACS, said at Gohack26 that no case of autonomous AI agents hacking someone had been reported to the office so far (Netzwoche, 2026-11-02). The BACS statement of 2026-11-24 supersedes that: first confirmed Swiss cases, with named exposure growth of ARTEX/CyberStrikeAI instances. CAUTION ON WORDING: the BACS names ARTEX and CyberStrikeAI only as examples of publicly reachable AI agents whose count has almost doubled; it does NOT state that either was used in the confirmed Swiss cases (''Agentic Offensive Frameworks'' is its generic term). Do not write ''ARTEX was used against Swiss victims''. Defender vantage: the exposure classes the BACS names generically (default or guessable passwords, known flaws, internet-exposed systems) are the same ones SOCRadar''s
    BabidiGhost report (store entry 2026-11-24/babidighost-jailbroken-ai-agent-belgium-france-switzerland) and Datadog/Microsoft ARTEX reporting describe; a 24-hour patch target for internet-reachable critical updates is the BACS''s own concrete number. Suggested priority: high (national authority, confirmed Swiss victims including critical-infrastructure operators, expectation of more). Suggested record type on the ARTEX entry: update (reader-facing delta, moves updated_at); fields likely title/headline/summary/sources/evidence/body. If the composer prefers a standalone entry, it must declare the ARTEX entry in references[] (CVE-less, so the CVE-overlap rule does not bite). The techniques[] mapping follows the BACS''s general description of agent behaviour (autonomous vulnerability search, default/guessable passwords, known flaws on internet-facing systems), not a stated access path of the confirmed cases. Not in the public text: sectors, victim count, the technical indicators the BACS
    shares with critical-infrastructure operators via its closed channel.'
- title: Publica's board commissions an independent external investigation of its supplier selection, data handling and security controls after the PK Softech attack; procedure to be set by end of January, first report by end of March 2027
  sources:
  - url: https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten
    publisher: Publica (incident page, Stand 24.11.2026)
    date: '2026-11-24'
    role: primary
  - url: https://www.watson.ch/digital/bern/990288108-publica-laesst-nach-hackerangriff-externe-untersuchung-durchfuehren
    publisher: watson.ch (Keystone-SDA)
    date: '2026-11-19'
    role: corroborating
  discovery_trace: 'first seen at: watson-ch-digital, URL https://www.watson.ch/digital (listing via `url --direct`, rotational lookback 168 h) → drill: https://www.watson.ch/digital/bern/990288108-publica-laesst-nach-hackerangriff-externe-untersuchung-durchfuehren (extract; SDA text of 2026-11-19, links Publica''s release of Thursday 2026-11-19) → primary: Publica incident page https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (updated ''Stand: 24.11.2026''; the Stand-19.11 text is only in the raw HTML (`url --direct`), the `extract` body shows the heading without the text). The release URL linked by watson (https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferant-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen) answered 404 to the bridge, so it is not cited. Searches ("Publica PK Softech Akira Datenabfluss Pensionskasse Bund", "Publica lässt Umgang mit Personendaten und Sicherheitskontrollen extern untersuchen …")
    surfaced only October coverage.'
  summary: 'Publica, the pension fund of the Swiss Confederation, announced on 2026-11-19 that its Kassenkommission (governing board) has decided to commission an independent investigation in connection with the cyberattack on its software supplier PK Softech AG; the tender for the external examiner is running. According to the Keystone-SDA text relaying Publica''s release, the investigation covers four areas: the selection of the software supplier and the data-protection and access-permission requirements agreed with it; the handling of personal data; security requirements and the effectiveness of the existing controls; and leadership and oversight (responsibilities, information paths and decision processes between the board, its committees and the executive office). The procedure is to be fixed by the end of January and a first report is planned by the end of March 2027; criminal investigations and examinations at the supplier are expressly outside it (the Federal Prosecutor''s Office
    and the data-protection commissioner EDÖB are responsible for those). On the same incident page Publica updated its status on 2026-11-24: it has no indication that data from the attack was published on the darkweb and keeps monitoring. Publica also sent its third newsletter to insured persons on 2026-11-19. The store''s entry already carries the supplier''s, Publica''s, the EDÖB''s and the Federal Prosecutor''s positions up to 2026-11-12 (and an audit correction of 2026-11-15); the external investigation and the 2026-11-24 darkweb status are not in it.'
  region_nexus: 'switzerland (federal level: Publica insures federal and federally affiliated staff)'
  primary_sector_nexus: 'direct: Swiss federal public sector and a supplier-governance case (third-party data handling by a pension fund''s software vendor)'
