    attribution: watson.ch (Keystone-SDA)
    source_url: https://www.watson.ch/digital/bern/990288108-publica-laesst-nach-hackerangriff-externe-untersuchung-durchfuehren
  extended_notes: 'Delta only; no new technical fact about the intrusion. Value for defenders is the governance lens: the examiner is told to look at supplier selection and the data-protection / access-permission requirements agreed with the vendor, which is the control point where a purchaser (federal, cantonal or communal) decides what production-like data a supplier may hold (the store entry records that PK Softech apparently kept data it had promised in writing to delete, and that the City of Zurich fund PKZH had handed over test data). Recency: Publica''s announcement and release are dated 2026-11-19 (about 6 days before this run); the item is returned because it was found through the watson.ch 168-hour rotational lookback and because Publica''s page was updated in-window on 2026-11-24. Suggested record type: update (reader-facing; the entry already has a long update history). Do not carry the Akira attribution or the data volume as fact: those remain press-sourced (Tages-Anzeiger/Tamedia,
    as the entry states).'
- title: 'US federal intrusions reported by Nextgov: the FBI''s NCIC national police database (acknowledged by the US President, scope unclear) and an unclassified CIA/ODNI/NGA open-source-intelligence system, where ARTEX is believed to have been used'
