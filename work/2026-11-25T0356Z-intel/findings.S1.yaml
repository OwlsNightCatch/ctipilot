  # ------------------------------------------------------------------
  - title: "GeoServer: advisories published 2026-11-23 disclose an unauthenticated remote-code-execution chain in five separately fixed steps (data-directory path leak, service-security bypass with service=x/WFS, WFS GetFeatureById XML injection, predictable remember-me key, JDBC deserialization) plus further unauthenticated SSRF and XXE flaws; fixed in 2.27.7, 2.28.6 and 3.0.2, which have been out since 17 October to 2 November"
    sources:
      - { url: "https://github.com/geoserver/geoserver/security/advisories/GHSA-hgm3-wq4h-8vvq", publisher: "GeoServer project (GHSA-hgm3-wq4h-8vvq, CVE-2026-129245)", date: "2026-11-23", role: "primary" }
