    discovery_trace: "first seen at: ncsc-ch-security-hub (python3 tools/fetch_source.py ncsc-csh recent 15), URL https://security-hub.ncsc.admin.ch/#/posts/13238 → primary: Broadcom VMSA-2026-0011, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626 → Broadcom Q&A, URL https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md → KB463535, URL https://knowledge.broadcom.com/external/article/463535/manual-interim-workaround-for-cve2026123.html; BSI WID-SEC-2026-4769 seen in the bsi-rss feed 2026-11-24 12:37 UTC and read through bsi-csaf; CCCS AV26-1203 listed in the cccs feed"
    summary: |
      Broadcom's VMSA-2026-0011 of 2026-11-24 (Critical, CVSS 3.1 3.4 to 9.8, 23 CVEs) fixes vCenter, ESX, Workstation, Fusion, VMware Tools and Avi Load Balancer. The headline vCenter flaw is CVE-2026-123903, an authentication bypass in the VMware Directory Service: per Broadcom, "a malicious actor with network access to vCenter may exploit this issue to bypass authentication and gain unauthorized access to the system"; CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N), no workaround, reported independently by Qianxin's sglab, depthfirst and ThreatBook. Broadcom's Q&A says it is "a new and distinct issue" from CVE-2026-123890 (VMSA-2026-0009, exploited per GTIG). On ESX, CVE-2026-123910 (heap out-of-bounds write) and CVE-2026-123911 (use-after-free) in the I/O filter service let an attacker with network access to the host execute code on it (CVSS 9.8 each, credited to CrowdStrike and to DEVCORE with ZDI); Broadcom's KB463535 gives an interim workaround for ESXi 8.x, where the IOFilterVP service listens on port 9080 and should be reachable only from the vCenter address. CVE-2026-123912 (XHCI USB out-of-bounds write, 9.3 on Workstation and Fusion) lets a guest administrator run code as the VMX process, contained to the VMX sandbox on ESX, where CVE-2026-123913 (VMkernel stack overflow, 8.2) lets that foothold escalate. Further vCenter items need prior access: CVE-2026-123904 file write as root through a malicious backup archive (7.5), CVE-2026-123905 to -123907 Directory Service denial of service (7.5), CVE-2026-123908 vpxd service-account escalation (6.7). Broadcom's advisory is silent on exploitation, NCSC.ch lists the exploitation status as unknown and the Hacker News notes that Broadcom makes no mention of any of them being exploited; the earlier vCenter bypass in the same component was exploited from September, which is the reason to patch ahead of public detail. Fixed builds are in the cve_table; vCenter or ESX 7.0 has no public fix, and ESX 9.0 still lacks a patch for CVE-2026-123914 and CVE-2026-123915 (Patch Pending).
    region_nexus: "global; vSphere is common in Swiss federal, cantonal and communal data centres"
    primary_sector_nexus: "direct (public-sector virtualisation estates)"
    sector: "public-sector"
    cves: [CVE-2026-123903, CVE-2026-123910, CVE-2026-123911, CVE-2026-123912, CVE-2026-123904, CVE-2026-123913, CVE-2026-123908]
