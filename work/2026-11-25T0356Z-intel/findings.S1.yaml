  - title: "VMSA-2026-0011: Broadcom fixes 23 flaws in ESX, vCenter, Workstation, Fusion, Tools and Avi, among them a second, distinct vCenter Directory Service authentication bypass (CVE-2026-123903, CVSS 9.8, no workaround) and two network-reachable ESX code-execution flaws in the I/O filter service (CVE-2026-123910 and CVE-2026-123911, CVSS 9.8); no exploitation reported"
