      - { url: "https://cyber.gc.ca/en/alerts-advisories/erlang-security-advisory-av26-1204", publisher: "Canadian Centre for Cyber Security (AV26-1204)", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: cccs-alerts feed (python3 tools/fetch_source.py feed https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en 10), 'Erlang security advisory (AV26-1204)' 2026-11-24T19:59Z, URL https://cyber.gc.ca/en/alerts-advisories/erlang-security-advisory-av26-1204 → primary: erlang/otp GitHub security advisories via the GitHub REST API and GHSA page URL https://github.com/erlang/otp/security/advisories/GHSA-7mff-v332-665j → CVE record https://cveawg.mitre.org/api/cve/CVE-2026-124286"
    summary: |
      The Erlang/OTP project and its CNA (EEF) published ten advisories on 2026-11-24, one rated Critical: CVE-2026-124286 (CVSS 4.0 9.1, AV:N/AC:L/AT:P/PR:N) in the ssl application. When a server sends no Certificate message and a ServerKeyExchange without a signature, ssl_handshake reports the signature algorithm as anonymous and verify_signature returns true for it, so a TLS 1.2 or DTLS client completes the handshake for the ecdhe_rsa, ecdhe_ecdsa, dhe_rsa and dhe_dss key exchanges; certificate path validation, verify_fun and the hostname check do not run, and ssl:connect returns {ok, Socket} even with verify_peer set. An on-path attacker can therefore impersonate any server to an affected client and read and modify all traffic; TLS 1.3 clients, servers and suites without a ServerKeyExchange are not affected. Default client configurations are exposed because they offer TLS 1.2. Affected: OTP from 17.0 before 27.3.4.14, 28.5.0.9 and 29.0.3 (ssl from 5.3.4 before 11.2.12.10, 11.6.0.8 and 11.7.3); the project notes the fix reached OTP 29 and 27 earlier as a hardening change and was missed on the 28 track. Workaround: restrict clients to TLS 1.3. The other nine advisories are Medium to High denial-of-service and parser flaws (SNMP BER decoding, binary_to_term, xmerl, inets). No exploitation is reported and the attacker needs a network position.
