      - { url: "https://github.com/geoserver/geoserver/security/advisories/GHSA-4v26-c537-jvxc", publisher: "GeoServer project (GHSA-4v26-c537-jvxc, CVE-2026-129244)", date: "2026-11-23", role: "primary" }
      - { url: "https://github.com/geoserver/geoserver/releases/tag/2.28.6", publisher: "GeoServer project (release 2.28.6)", date: "2026-11-02", role: "corroborating" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4767", publisher: "BSI CERT-Bund (WID-SEC-2026-4767)", date: "2026-11-24", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de bsi-rss feed 2026-11-24 12:37 UTC, [NEU] [hoch] 'GeoServer: Mehrere Schwachstellen' WID-SEC-2026-4767 (python3 tools/fetch_source.py bsi-rss, then bsi-csaf WID-SEC-2026-4767) → primary: GeoServer GitHub security advisories listing read through the GitHub REST API (https://api.github.com/repos/geoserver/geoserver/security-advisories) and each cited GHSA page via extract → release pages https://github.com/geoserver/geoserver/releases/tag/3.0.2, /2.28.6 and /2.27.7 for the fix dates"
    summary: |
      Between 22:08 and 22:14 UTC on 2026-11-23 the GeoServer project published 17 GitHub security advisories for the 2.27.7, 2.28.6 and 3.0.2 releases, which had shipped on 2026-10-18, 2026-11-02 and 2026-10-17 with the fixes listed as ordinary changes. The critical one, GHSA-hgm3-wq4h-8vvq (CVE-2026-129245), says it "was reported as step 4 of an unauthenticated remote command execution chain" and that, at the CVE Numbering Authority's request, each step is fixed and tracked separately: (1) CVE-2026-129244, a WFS stored-query exception that discloses the data-directory path to an unauthenticated user; (2) CVE-2026-129243, service-security rules bypassed by a prefixed service name such as x/WFS, so anonymous users can create and delete WFS stored queries; (3) CVE-2026-120705, an unauthenticated WFS GetFeatureById XML injection (CVSS 3.1 8.6) that reads a local file readable by the GeoServer process and fetches an attacker-chosen URL; (4) CVE-2026-129245, a remember-me cookie signed with a key that defaults to the string shipped in the release data directory, so anyone with the key and an administrator password digest can forge an administrator login; (5) CVE-2026-129242, JDBC user and role services that deserialize property values from an uploaded HSQLDB database, giving an administrator code execution as the GeoServer process. The advisories also cover unauthenticated SSRF in WPS (CVE-2026-120701 CVSS 7.5, CVE-2026-120706), unauthenticated SSRF and file read in printing (CVE-2026-120709), unauthenticated style management in OGC API Styles (CVE-2026-129294), unauthenticated XXE and SSRF through xsi:schemaLocation (CVE-2025-53607, CVSS 8.2, fixed earlier in 2.27.6, 2.28.4 and 3.0.0), and trust of forwarded headers in GeoFence and ACL source-IP rules (CVE-2026-120707, CVE-2026-120708). The advisories name no exploitation; with each step of the chain now public, a GeoServer left on a release older than the fixed ones is the exposed case.
