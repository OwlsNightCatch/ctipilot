      - quote: "A malicious actor with network access to ESX may execute code on the host."
        attribution: "Broadcom (VMSA-2026-0011)"
        source_url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626"
      - quote: "CVE-2026-123903 is a new and distinct issue."
        attribution: "Broadcom (VMSA-2026-0011 Questions and Answers)"
        source_url: "https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md"
      - quote: "Only the vCenter Server IP address should be allowed to communicate to port 9080."
        attribution: "Broadcom (KB463535)"
        source_url: "https://knowledge.broadcom.com/external/article/463535/manual-interim-workaround-for-cve2026123.html"
      - quote: "While Broadcom makes no mention of any of the newly disclosed flaws as being exploited in the wild, it's essential that customers apply the updates for optimal protection."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/vmware-vcenter-hit-by-another-critical.html"
    extended_notes: |
      EXPOSURE and version read: vCenter build is on the vSphere Client Summary tab or in PowerCLI after Connect-VIServer ($global:DefaultVIServer.Build and .Version); ESX hosts show it with Get-VMHost | Select-Object Name, Version, Build (Broadcom Q&A). The Directory Service flaws are in vCenter itself and are present whether or not Enhanced Linked Mode is used (Q&A). The vSAN Witness Appliance runs ESX and is affected. Telco Cloud Platform and Telco Cloud Infrastructure carry the fix through KB463501.
      FIXED VERSIONS (Broadcom response matrix): vCenter 9.1.x fixed 9.1.2; 9.0.x fixed 9.0.2.0300 (the Q&A calls it the 9.0.2 express patch); 8.0 fixed 8.0 U3m (already enough if applied for VMSA-2026-0009); 7.0 no public fix (extended-support customers contact Broadcom Support); VMware Cloud Foundation 5.x fixed 5.2.5 through the asynchronous patch process KB88287. ESX 9.1.x fixed ESXi-9.1.2.0-25946735; 9.0.x fixed ESXi-9.0.2.0200-25953133 for CVE-2026-123910 to -123913 and -123916, with CVE-2026-123914 and -123915 marked Patch Pending; 8.0 fixed ESXi80U3m-25926933 (CVE-2026-123910 and -123911 workaround KB463535); 7.0 no public fix. Workstation and Fusion 25H2 fixed 26H1u1. VMware Tools 13.1.10 for 13.x and 12.5.6 for 12.x and 11.x (12.4.11 for 32-bit Windows); open-vm-tools through Linux vendors; updating vCenter or ESX does not update Tools inside guests. Avi Load Balancer 32.1.4 fixes all eight Avi issues (scores 3.4 to 6.7, administrative access needed). Fixes are cumulative and not eligible for vCenter Quick Patch or ESX Live Patch; ESX updates need a host reboot and the XHCI and guest-RPC fixes reach a VM only after its VMX restarts (power cycle or vMotion to an updated host). Broadcom rates CVE-2026-123912 9.3 for Workstation and Fusion and 8.4 for ESX in the matrix while its Q&A says 8.5 for ESX; both are quoted from the vendor.
      WORKAROUND (ESXi 8.x only, CVE-2026-123910 and -123911, KB463535): esxcli network firewall ruleset set -r iofiltervp --allowed-all false, then esxcli network firewall ruleset allowedip add -r iofiltervp -i <vCenter address>, verified with esxcli network firewall ruleset allowedip list -r iofiltervp. Broadcom's Q&A says this limits only a small part of the advisory and may affect cluster operation, so patching is the stated path. Mitigation for CVE-2026-123904: restrict write access to the vCenter backup repository to the backup account and the repository administrators.
      DETECTION: Broadcom publishes no indicators and its advisory does not mention exploitation, so the hooks are mechanical: telemetry on network flows to TCP 9080 of ESXi 8.x hosts from anything but the vCenter address; vCenter and Directory Service authentication and SSO audit records for administrator sessions or accounts that have no matching login event or change ticket; writes to the backup repository share by accounts other than the vCenter backup account. Post-patch: because the sibling vmdir bypass CVE-2026-123890 was exploited from September, treat a vCenter whose Directory Service was reachable beyond the management network as a candidate for the same compromise review as in the existing entry.
      RELATED ADVISORIES: Broadcom's Q&A says VMSA-2026-0010 is a separate advisory with a workaround and a planned Express Patch; it could not be located on any transport this run (Broadcom's advisory index is a script-rendered listing, the GitHub supplement path for 0010 returns 404), so it is an open lead. VMSA-2026-0009 (SDDC Manager) fixes are not part of 0011: SDDC Manager needs its own update (9.1.1.0200, 9.0.2.0100, 5.2.5).
      The CVE records for CVE-2026-123903 and the ESX CVEs were not yet published at read time (cveawg returned CVE_RECORD_DNE), so ids and scores come from Broadcom's advisory, which is the CNA source.

