  - title: "Erlang/OTP ssl: a TLS 1.2 or DTLS client configured for full server authentication completes the handshake when a man-in-the-middle sends no certificate and an unsigned key exchange (CVE-2026-124286, rated Critical by the project, CVSS 4.0 9.1); fixed in OTP 29.0.3, 28.5.0.9 and 27.3.4.14"
