- code: F11
  category: editorial-advisory
  section: body
  item: "rejetto-hfs-session-forgery-prng-rce-cve-2026-61500 (Detection line, claim c0a4f15904)"
  url_or_quote: "a short burst of repeated login requests from one source immediately followed by an authenticated, admin-privileged session with no preceding legitimate credential-setting event"
  summary: "(advisory, low confidence) The GreyNoise citation at the end of the sentence carries 'several logins in succession', forged admin requests 'minutes later', the cookie flag, command hooks and the authorized_keys append; it does not say the logins came from one source or that no credential-setting event preceded the session. Both are inference from the mechanism (login 'without a password'); mark them as the entry's reading or trim."
