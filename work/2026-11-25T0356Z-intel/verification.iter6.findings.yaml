- code: F3
  category: claim-not-supported
  section: body
  item: "vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig (Detection, appliance-log clause; claim 3df35edf0b)"
  url_or_quote: "a new local administrator and SSH enablement in the vAPI endpoint access log"
  summary: "(low confidence) Rapid7 (https://www.rapid7.com/blog/post/ra-rapid7-analysis-vmware-vcenter-srp-authentication-bypass-to-root-cve-2026-123890) says endpoint-access.log 'contains our POST /rest/com/vmware/cis/session, PUT /rest/appliance/access/ssh, PUT /rest/appliance/access/shell' requests, but 'An HTTP 200 on a settings request does not reveal which value was applied, so the appliance management log supplies the next part of the sequence'; the enablement itself (access.ssh.set(enable=True)) is in applmgmt.log. The access log shows a request to the SSH setting, not SSH enablement. Reword to 'a request to the SSH access setting in the vAPI endpoint access log and the enablement in the appliance management log'."
- code: F5
  category: missing-citation
  section: body
  item: "rejetto-hfs-session-forgery-prng-rce-cve-2026-61500 (first paragraph, claim 981a038750)"
  url_or_quote: "HFS's built-in `server_code` configuration feature (arbitrary server-side script)"
  summary: "(low confidence) The parenthetical gloss is carried by none of the entry's cited pages: VulnCheck says only 'remote code execution via the server_code configuration feature', the Rejetto release notes name no feature, and GreyNoise says 'HFS server_code feature' without describing it. Drop the parenthetical or cite a page that describes server_code."
- code: F11
  category: editorial-advisory
  section: changelog
  item: "rejetto-hfs-session-forgery-prng-rce-cve-2026-61500 (updates[] record vs ## Update section)"
  url_or_quote: "The entry now carries only CVE-2026-61500, the flaw its cited sources describe."
  summary: "(advisory, low confidence) The record summary states a field-level fact (the five companion CVE records and the 'six-CVE chain' wording were removed) that the Update section never tells the reader, and the sentence narrates the entry's contents rather than the delta. Either state the withdrawal in one cited sentence in the section (the cited advisory page carries only CVE-2026-61500) or drop the sentence from the record summary."
