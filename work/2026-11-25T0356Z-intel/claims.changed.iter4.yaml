  - claim_id: 6fbdf2e981
    entry: 2026-11-25/greynoise-gt13-check-point-management-servers
    surface: "body"
    kind: uncited
    text: "The actor planted an SSH key on its relay, and GreyNoise concludes from scp deliveries that each compromised device holds the matching private key; it also ran Nmap and a Chisel reverse proxy, used at least 30 Python scripts with victim-themed credential lists, and probed NetScaler, Ivanti Connect Secure, vCenter, Exchange, Oracle TNS assets and domain controllers without any stated success."
  - claim_id: b8bbdf210a
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 tracked more than ten campaigns between July and September 2026 in which different attackers pointed autonomous AI agents at targets in sectors including government, logistics, manufacturing and education. Every campaign began with a web shell on a vulnerable web application, after which the agent did reconnaissance, credential harvesting, privilege escalation and lateral movement mostly with single-use scripts and no compiled implants. Unit 42 reports no new technique but measurable traces: a median gap of 1.4 seconds between commands in a subset of attacks (23.9 seconds in the human phase), section headers such as ===[Title]=== in every campaign, and 40 to 100 unique Base64 payloads per session."
  - claim_id: 42b88d8097
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "The agents probed defences: the same find command ran on six endpoints excluding three different security vendors, and one agent applied strace to the Microsoft Defender for Endpoint daemon ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/"]
  - claim_id: 2c2a4d992a
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "The traces: a median gap of 1.4 seconds between commands once an agent took over, against 23.9 seconds in the human phase of a subset of attacks; about 800 unique commands in 140 minutes in one case and more than 8,000 over 12 days in another; section headers such as ===[Title]=== in shell commands and scripts in every campaign and step-by-step reasoning notes in more than half; 40 to 100 unique, target-tailored Base64 payloads per session; and no compiled implants, the arsenal being in most cases simple single-use scripts such as PHP web shells, PowerShell WMI backdoors and Python credential harvesters."
  - claim_id: 0c58dd1b30
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Detection:** in process-lineage telemetry, shells and scripts spawned through a web shell's `sh -c` interface in bursts seconds apart, with ===[Title]=== headers or reasoning-style comments and many unique Base64 payloads; the same enumeration command across hosts excluding security-product directories, and tracing of the endpoint-security daemon; on cloud workloads, a switch to IMDSv2 token requests after IMDSv1 is blocked."
  - claim_id: 145a05b756
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every ESX host to ESXi-9.1.2.0-25946735, ESXi-9.0.2.0200-25953133 or ESXi80U3m-25926933 and, on ESX 8.x hosts that must wait, restrict TCP 9080 on the host firewall to the vCenter Server address as KB463535 describes, because CVE-2026-123910 and CVE-2026-123911 give code execution from network access and the restriction resolves only a small portion of the advisory's issues."
