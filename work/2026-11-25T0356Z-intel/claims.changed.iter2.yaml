  - claim_id: dcf428fdb3
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "summary"
    kind: frontmatter
    text: "Splunk's SVD-2026-1103 of 2026-11-18 fixes 38 flaws in Splunk Enterprise, among them unauthenticated authentication bypasses in the REST API that rest on an empty shared secret: CVE-2026-76536 (CVSS 3.1 9.4, reads and changes clustering configuration on a standalone instance) and CVE-2026-76535 (9.1, runs search queries as an authenticated user), plus three rows at 7.5, two on an empty or factory-default shared key and one that crashes splunkd. Splunk lists fixes in 10.6.1, 10.4.5, 10.2.9, 10.0.12 and 9.4.17 and a workaround of setting a non-empty pass4SymmKey; it does not say an empty secret is the out-of-the-box state, and no source reports exploitation."
  - claim_id: fc4cb218c3
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "actions[0]"
    kind: frontmatter
    text: "Set a strong pass4SymmKey of at least 12 characters in the [clustering] stanza of etc/system/local/server.conf on every Splunk Enterprise instance below the fixed versions (the same value on every node that participates in the service), restart it, remove the RapidDiag app where it is not needed and upgrade to 10.6.1, 10.4.5, 10.2.9, 10.0.12 or 9.4.17, instances whose management API is reachable from user or internet networks first, because the unauthenticated REST bypasses accept an empty shared secret."
  - claim_id: a86fcabca4
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "Three further unauthenticated rows are rated 7.5: CVE-2026-131192 gives access to live event data from the indexing pipeline on a standalone instance or a search head that is not an indexer cluster member, on an empty shared key, and CVE-2026-131190 exposes RapidDiag process metadata and a log file inventory through endpoints that accept a factory-default shared key, and a third lets an unauthenticated user crash the Splunk daemon through the S2S data-forwarding receiver, for which Splunk lists no workaround ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: 1cdf48b057
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "For CVE-2026-76535 Splunk says to set a non-empty pass4SymmKey in server.conf, using the same value on each node that participates in the service, and restart; for CVE-2026-76536 the workaround is a strong, unique pass4SymmKey of at least 12 characters in the [clustering] stanza of server.conf, standalone instances included, followed by a restart; CVE-2026-131190 is closed by turning off or removing the RapidDiag app ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
