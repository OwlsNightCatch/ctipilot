claims:
  - claim_id: 085f7777cd
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "headline"
    kind: frontmatter
    text: "Rejetto HFS pre-auth session forgery reaches code execution and is exploited since 2026-10-02; update to 3.2.1"
  - claim_id: 3da1014bbf
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "summary"
    kind: frontmatter
    text: "Rejetto HFS (HTTP File Server) 3.0.0–3.2.0 derives its session-cookie signing key from JavaScript's Math.random() and leaks that generator's outputs to unauthenticated clients, letting an attacker forge an administrator session and reach RCE via the server_code feature (CVE-2026-61500, CVSS 9.3). Fixed in 3.2.1 (2026-07-13). GreyNoise reports an actor exploited it from 2026-10-02 to take over an unpatched HFS server and keep it as a relay in an intrusion campaign, so any exposed instance on an older build needs the upgrade and a compromise check."
  - claim_id: 84331b791f
