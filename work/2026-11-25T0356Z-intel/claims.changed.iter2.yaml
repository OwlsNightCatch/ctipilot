    surface: "body"
    kind: cited
    text: "VulnCheck disclosed CVE-2026-61500 in Rejetto HFS (HTTP File Server) 3.0.0 through 3.2.0, fixed in 3.2.1 on 2026-07-13 ("
    urls: ["https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key"]
  - claim_id: 1b5ff8d20a
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "record 2026-11-25T04:48:00Z"
    kind: record-summary
    text: "GreyNoise reports that an actor exploited CVE-2026-61500 on an unpatched Rejetto HFS server from 2026-10-02, forging the admin cookie and keeping the host as a relay for an intrusion campaign; VulnCheck had warned of reconnaissance against the flaw the same day."
