  - claim_id: 9af0755e28
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "Google Threat Intelligence Group and Mandiant say ARMORY CASTLE, a suspected PRC-nexus actor, exploited it from early September 2026 with its BONESAW utility, in one intrusion ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/"]
  - claim_id: 9face43e2d
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "The cause is a session-key disclosure over DCE/RPC in the rpc_srp_verifier service on TCP 2012: the SRP key getter checks neither that the caller authenticated nor that it owns the verifier, and the RPC context handles are predictable UUIDv1 values, so an attacker needs only network access to TCP 2012 and an existing SSO principal name ("
    urls: ["https://www.rapid7.com/blog/post/ra-rapid7-analysis-vmware-vcenter-srp-authentication-bypass-to-root-cve-2026-123890"]
  - claim_id: 11076ff3a0
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "Rapid7 chained the administrator session to a root shell on vCenter 8.0.2.00400 and describes a Metasploit module that does the whole chain; the module is in an open public pull request ("
    urls: ["https://www.rapid7.com/blog/post/ra-rapid7-analysis-vmware-vcenter-srp-authentication-bypass-to-root-cve-2026-123890", "https://github.com/rapid7/metasploit-framework/pull/22173"]
  - claim_id: 1f618bded2
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "In GTIG's intrusion the actor then forged administrator SAML assertions after extracting the SAML signing key, switched SSH on through the appliance management API and reached ESXi hosts, where it planted an authorized_keys entry and extracted domain data from Windows guest disks ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/"]
