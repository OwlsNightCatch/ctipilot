  item: "entities/registry.yaml actor:gt13 (the GT13 entry's entity record, added this run)"
  url_or_quote: "GreyNoise does not attribute it and believes, without proof, that it used LLM and agentic tooling."
  summary: "(low confidence) GreyNoise's page (https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign) says 'we believe that like most modern attacks, the actor used LLMs and agentic systems' and 'We suspect the GT13 actor has a mature AI-enabled offensive apparatus'; it never says 'without proof'. The 'unconfirmed' reading is BleepingComputer's ('the use of AI in this campaign remains unconfirmed'). The entry body had this wording removed in iteration 4 for the same reason; the registry summary (rendered on the entity page) still carries it. Say 'believes it used LLM and agentic tooling; BleepingComputer notes the use of AI remains unconfirmed'."
