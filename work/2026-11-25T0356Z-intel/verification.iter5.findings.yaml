  section: frontmatter
  item: "optimjack-poisoned-vendor-scripts-skimmer-iphone-router cves[CVE-2026-132224].auth"
  url_or_quote: "auth: post-auth"
  summary: "(low confidence) No page the section cites states an authentication requirement: Optimizely's status page says the third party 'used it to impersonate users on targeted customer accounts', its incident report says 'They exploited a flaw that let them act as administrator users without those users' credentials', and the KEV row says the flaw 'could allow an attacker to impersonate existing customer users'. Only the MITRE CNA CVSS 4.0 vector in the CVE record (PR:L) supports post-auth, and that record is not a listed source. The vocabulary forces a value; keep it but add one sentence to sourcing_note that the auth value follows the CVE record's CVSS 4.0 vector (low privileges required), which none of the listed pages states (do not cite the per-CVE record as a source)."
