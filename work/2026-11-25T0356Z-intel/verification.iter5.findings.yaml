  item: "rejetto-hfs-session-forgery-prng-rce-cve-2026-61500 (whole entry, updated this run)"
  url_or_quote: "**Defender takeaway:** treat any internet-reachable HFS instance below 3.2.1 as possibly compromised ... In HFS request logs, the recovery-then-forge sequence shows as ... **Triage:** a genuine admin login issues a `Set-Cookie` ..."
  summary: "(low confidence) The entry now reports exploitation (a post-patch compromise check is the decision), but it carries no standalone **Exposure:** or **Detection:** line; detection and a Triage discriminator are buried inside one Defender takeaway paragraph. VulnCheck (affected range 3.0.0 to below 3.2.1) and GreyNoise (forged cookie, command hooks, SSH key appended to root's authorized_keys, server_code) support both lines. Split into labelled lines so the site and triage agents can lift them."
