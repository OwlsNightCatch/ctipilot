  - claim_id: 2a3b8a03c0
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "summary"
    kind: frontmatter
    text: "The GeoServer project published a batch of security advisories on 2026-11-23, most for flaws fixed in 3.0.2, 2.28.6 and 2.27.7, and five of them chain an anonymous WFS request to code execution: a path disclosure, a service-security bypass with a prefixed service name, an XML injection, a predictable remember-me key that forges an administrator session (critical, CVSS 4.0 9.2) and a JDBC deserialization. The reporter, who says it works on a default installation, published a full-chain proof of concept the same night; the project announced the fixed releases on 2026-10-19 and no source reports exploitation."
