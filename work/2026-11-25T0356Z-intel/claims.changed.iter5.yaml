  - claim_id: 59ac51550d
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "The traces: a median gap of 1.4 seconds between commands once an agent took over, against 23.9 seconds in the human phase of a subset of attacks; about 800 unique commands in 140 minutes in one case; section headers such as ===[Title]=== in shell commands and scripts in every campaign and step-by-step reasoning notes in more than half; 40 to 100 unique, target-tailored Base64 payloads per session; and no compiled implants, the arsenal being in most cases simple single-use scripts such as PHP web shells, PowerShell WMI backdoors and Python credential harvesters."
  - claim_id: e9bf0e0109
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "The Copy Fail Linux kernel exploit recurred across several organisations; in one case an agent tried the public PwnKit and CVE-2024-1086 binaries, then wrote custom C on the target and rewrote the exploit in Python, and Unit 42 saw agents try five techniques in sequence when earlier ones failed."
  - claim_id: 48b84074b2
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Triage:** Base64 commands and reconnaissance appear in human-operated intrusions; Unit 42's discriminators are the volume and uniqueness of payloads, the command cadence and the headers, which it says rarely appear in human-operated attacks except with pre-coded scripts."
