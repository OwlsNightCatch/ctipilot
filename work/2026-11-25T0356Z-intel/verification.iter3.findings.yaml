  section: greynoise-gt13-check-point-management-servers (body paragraph 3, first sentence)
  item: "GT13 planted SSH key (claim e6893644e7)"
  url_or_quote: "The actor planted an SSH key so that each compromised device holds the private key matching one on the relay"
  summary: "(low confidence) GreyNoise: 'Each file was delivered from victim infrastructure, showing that each of the compromised devices hold the SSH private key that matches the public key planted on the hop.' The public key was planted on the relay (appended to /root/.ssh/authorized_keys on the HFS server) and the devices' private-key possession is GreyNoise's inference from scp deliveries; the entry states a purpose ('so that') and reads as if a key was planted on the devices. Reword to attribute the inference."
