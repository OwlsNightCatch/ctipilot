  discovery_trace: 'first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ -> article https://www.bleepingcomputer.com/news/security/european-commission-confirms-data-theft-in-eu-academy-breach/ -> pivot: Euronews 2026-11-19 and 2026-11-23, URLs https://www.euronews.com/2026/11/19/eu-commission-hit-by-large-scale-cyberattack-with-data-leakage-unknown and https://www.euronews.com/2026/11/23/exclusive-china-backed-hackers-suspected-behind-ongoing-eu-commission-cyberattack -> pivot: CERT-EU ARTEX blog https://www.cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex -> primary: Commission EU Academy notice https://academy.europa.eu/moodle-maintenance.html (cross-confirmed on SecurityWeek https://www.securityweek.com/european-commission-uncovers-data-breach-in-cyberattack-investigation/ and Security Affairs, both read from the main security-news feed sweep)'
  summary: 'On Monday 2026-11-23 the European Commission''s spokesperson confirmed that the intrusion first disclosed on 2026-11-19 (detected 2026-10-22; the Sysper HR platform and other staff applications were taken offline) has produced a confirmed personal-data leak: names and email addresses of EU Academy users, the Commission''s public learning platform for people outside the institution. Public access to EU Academy is disabled, the EDPS has been notified, and the Commission''s own notice (JRC unit S.2 named as data controller) warns of spearphishing, impersonation and spam instead of contacting users individually because the scale of the leak is still being established. The spokesperson described a cyber campaign ''via an AI assisted tool'' without naming it; the tool name ARTEX comes from Politico (relayed by TNW and ITdaily), which reports that CERT-EU identified it, and CERT-EU''s 2026-11-05 ARTEX advisory states that it saw AI-driven activity against its own constituency that ''highly
    likely'' involved ARTEX. The Commission has not attributed the activity. Euronews, citing two anonymous sources, reports an internal suspicion of a China-backed network (''Panda'' is the internal codename), reasoning from the attack''s sophistication and ARTEX use, that the actor was probing how far it could get rather than targeting specific systems, and that the intrusion was still spreading through Commission IT as of 2026-11-23; that is an unconfirmed press claim, not an assessment the Commission or CERT-EU has published. Not established in any source: the initial-access vector, which systems besides EU Academy lost data, and whether Sysper or the medical-reimbursement system (JSIS) staff data was taken; as of 2026-11-19 the Commission said it had found no evidence of a data breach affecting staff as a whole. Unresolved discrepancy: the same Commission notice also announces a planned rebuild with the platform offline from 2026-11-11 to 2027-01-14 and new accounts required, while
    Euronews says the site was taken offline on Saturday 2026-11-21 because of the incident.'
  region_nexus: EU institution (Brussels); Europe-wide public-sector relevance. Switzerland is a non-EU neighbour; EU Academy is open to external users, so Swiss public-sector staff in EU programmes could hold accounts (inference, no source says so).
  primary_sector_nexus: 'direct-adjacent: government institution; same ARTEX agentic tooling already documented against European government and foreign-ministry targets in earlier entries'
