    role: corroborating
  discovery_trace: 'first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ (item ''Hackers compromise Check Point Servers in 22 organizations'') -> article https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/ -> primary: GreyNoise, URL https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign (second sighting: SecurityWeek feed, URL https://www.securityweek.com/feed/ -> https://www.securityweek.com/check-point-security-management-servers-hacked-in-ai-assisted-campaign/)'
  summary: 'GreyNoise (2026-11-23) reports an intrusion campaign it tracks as GT13 against Check Point Security Management servers: attack activity observed 2026-10-02 to 2026-11-02, at least 22 organisations in 17 countries (United Kingdom, Ireland, France, Netherlands, Greece, Germany, Austria, Bulgaria, Poland, India, Thailand, Vietnam, South Korea, Hong Kong, China, Australia, United States; Switzerland is not listed) across financial services, energy, government, transportation, mining, engineering and manufacturing. GreyNoise states it could not determine when or how the actor first reached the Check Point servers. It did observe the actor run management tasks against them with a script for CVE-2026-16232 (the SmartConsole authentication bypass that Check Point patched in July after zero-day exploitation), copy the firewall database, credentials and the internal CA, create a new certificate and unload security policies, and probe NetScaler, Ivanti Connect Secure, vCenter, Exchange,
    Oracle TNS and domain controllers from inside the victim network. The operational relay was a separate Rejetto HFS server taken over through CVE-2026-61500 (the actor recovered the session-cookie signing key from repeated logins and forged an admin cookie), on which it appended an SSH key, ran a Chisel reverse proxy and used Nmap, Impacket and Paramiko-based Python tooling, with password lists themed to the victim. A bulk certificate-management task issued on 2026-10-26 to 24 compromised servers failed; its result files on the relay are how GreyNoise identified and notified victims. On 2026-11-02 the actor self-checked and mitigated the Linux IPv4 use-after-free (CVE-2026-98432) on its relay to keep other actors out. GreyNoise does not attribute GT13 and says it has too little information to assess motive or nation of origin; it ''suspects'' a mature AI-enabled offensive apparatus from behaviour and timing (an assessment, with the use of AI unconfirmed). BleepingComputer''s wording that
    the activity ''resembled cyberespionage operations'' is the outlet''s framing, not GreyNoise''s stated assessment. GreyNoise lost visibility on 2026-11-02, expects the campaign to be ongoing because of persistent access, and says it is notifying victims through government partners and CERTs; BleepingComputer reports Check Point had not yet said which flaw gave initial access.'
  region_nexus: Global; no Swiss victim named, but Germany, Austria and France (all Swiss neighbours) and 'government' as a victim sector are listed. No source quantifies Swiss exposure.
  primary_sector_nexus: 'direct-adjacent: government among victim sectors; management plane of a perimeter-firewall estate'
  sector: multi-sector
  cves:
  - CVE-2026-16232
  - CVE-2026-61500
  - CVE-2026-98432
