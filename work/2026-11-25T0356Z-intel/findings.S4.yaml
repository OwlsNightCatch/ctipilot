  summary: 'France''s civil aviation safety directorate (DSAC, part of the DGAC under the transport ministry) e-mailed users of its online fee-payment site, per Fuites Infos and French Breaches (both reading the notification; Fuites Infos also cites Ouest-France), that the site suffered a cyberattack between 2026-11-05 and 2026-11-09 and that the data of all accounts and of everyone who ordered without creating an account leaked. Leaked fields listed in the notification: identity, birth date and gender, postal and e-mail addresses, phone and fax numbers, company name and VAT number, account creation and last-login dates, encrypted passwords, IP addresses used for orders, order numbers, dates, amounts and contents, plus partial payment-card data (card type, partial number, expiry, holder, a ''cryptogramme'' field, payment results; DSAC says six of sixteen card digits are never stored and no full card number leaked). The DGAC''s subcontractor, which operates the site, shut its servers down
    on discovery; DSAC says the password-encryption key was renewed, a code audit was launched, the intrusion was ended and the platform will reopen safely. Not disclosed: the number of people affected, the actor, the entry method, and whether the ''cryptogramme'' is a card security code or only a verification artefact. Pattern worth noting for Swiss administrations: a state authority''s citizen-facing portal operated by an external provider, with payment data stored on it, is the exposed asset; the Austrian foreign ministry (website run by an external provider, intrusion 2026-11-12/13, reported 2026-11-20/21) and the PK Softech and Publica case already in the store follow the same shape.'
