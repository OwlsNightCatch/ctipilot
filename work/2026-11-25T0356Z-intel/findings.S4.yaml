  techniques_basis: T1190 (CVE-2026-16232 and CVE-2026-61500 exploitation); T1606.001 forged HFS admin session cookie; T1098.004 SSH key appended to root authorized_keys on the relay; T1572 Chisel reverse proxy; T1046 Nmap scanning; T1110.003 victim-themed password lists sprayed over SSH and a portal; T1584.004 compromised HFS server used as operational relay; T1686.002 unloading firewall security policies on the managed gateways (T1562.004 is revoked in the pinned ATT&CK dataset, successor T1686).
