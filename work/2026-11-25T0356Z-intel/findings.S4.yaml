  discovery_trace: 'first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ (item ''New Inception extortion gang launches large-scale vishing campaign'') -> article https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign/ -> primary: Okta, URL https://www.okta.com/en-se/blog/threat-intelligence/former_shinyhunters_cluster_moves_to_new_inception_site/ -> primary: ReversingLabs, URL https://www.reversinglabs.com/blog/threat-researchers-notebook-sso-vishing-campaign-associated-with-emerging-inception-extortion-group (the first extract attempt on the http:// link inside the BleepingComputer article was refused by the bridge, HTTPS-only; the https:// URL worked)'
  summary: 'Okta Threat Intelligence (2026-11-23) assesses that its cluster O-UNC-053, active since March 2026 and previously associated with the ShinyHunters leak site, has ''very likely changed their brand affiliation'' to a new INCEPTION leak site that went live around 2026-11-16/17; it says it cannot judge whether the cluster runs that site itself or partners with another extortion actor. ReversingLabs (2026-11-23) independently maps the infrastructure: 21 domains with direct evidence of an SSO phishing kit, legal-themed lookalikes of corporate authentication services (mainly Okta, also NetIQ/OpenText Access Manager), registered without mail DNS records because victims are walked to them by phone, Cloudflare-fronted, with a filter that forwards any visitor the kit is not set up for to the organisation''s real sign-in page. Per Okta the kit harvests the username and password and then prompts for MFA factors while the caller coaches the victim into reading out one-time codes or approving
    push requests; it cannot defeat FIDO2/WebAuthn passkeys or Okta FastPass. Okta says operators rotate phishing-domain themes every four to six weeks and the ''legal'' theme began in late October 2026. The leak site claims seven organisations (AMD, Cigna Healthcare, Henry Schein, Paychex, PepsiCo, AutoZone, Lucid Motors); these are the criminals'' claims, none has confirmed a breach, and ReversingLabs finds further lookalike domains for brands that have not been listed. INCEPTION publicly denies any link to earlier groups. Separately, BleepingComputer verified that a new ShinyHunters Tor site launched 2026-11-23 signed its announcements with revoked 2020 ShinyHunters PGP keys, which it says does not prove the same operators are back. Okta''s victim sectors (technology, healthcare, biotechnology, finance, insurance, entertainment, gaming, retail, transport, hospitality, legal) do not include government.'
