  confidence_note: One first-hand telemetry holder (GreyNoise sensors and captured relay data, a B-grade research lab); BleepingComputer and SecurityWeek re-report it and are not independent. Check Point had not commented at BleepingComputer's publication. Detail is specific (timestamps, tooling, per-step artefacts), which supports HIGH confidence in the observed behaviour but not in attribution or intent.
  suggested_classification:
    reliability: B
    credibility: '2'
    note: single telemetry-holding lab, no independent confirmation yet
  suggested_priority: high
  novelty: new
  novelty_note: Distinct finding (an intrusion campaign) that builds on two stored CVE entries (CVE-2026-16232 and CVE-2026-98432), so a new entry must list them in references[]; alternatively the main agent may record the campaign as a changelog update on the CVE-2026-16232 entry (the 2026-07-23 entry carries only the July zero-day exploitation).
  evidence:
  - quote: impacting at least 22 distinct organizations globally.
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
  - quote: The GT13 adversary had access to the victim Check Point Security Management Servers before they compromised the HFS server. We could not determine when or how the attacker gained access to those Check Point assets.
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
  - quote: We do not attribute GT13 to any known or publicly tracked threat group at this time.
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
  - quote: Our visibility into this attack activity stopped around November 2nd, 2026, but given the actor’s persistent access to victim Check Point devices, we expect that this intrusion campaign is ongoing.
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
  - quote: Threat intelligence firm GreyNoise detected the activity, noting that it resembled cyberespionage operations, although the attacker's motivation could not be conclusively determined.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/
  extended_notes: 'Exposure: a Check Point Security Management or Multi-Domain server whose SmartConsole/API/Gaia portal is reachable from untrusted networks, particularly one that ran an unpatched build while CVE-2026-16232 was exploited (July onward; stored entry has the affected R81.10 to R82.10 branches and the Jumbo hotfix); GreyNoise could not show how the access began, so absence of the July flaw does not clear a server. Detection (telemetry class first): management-server audit/administration logs for script-run or API tasks from unexpected source addresses or accounts; unscheduled certificate operations on the management server (new certificates minted, internal CA exported or copied); security policy unload or uninstall events on managed gateways; outbound SSH/scp from the management server to unfamiliar hosts, new keys in root authorized_keys, and unexpected entries in /etc/ld.so.preload on the appliance (GreyNoise saw an error that may indicate an implant); Chisel or Python tooling
    running on an appliance. Post-patch compromise check: patching CVE-2026-16232 does not evict an actor who already holds the management server; treat exfiltrated credentials, the internal CA and firewall configuration as compromised (rotate administrator credentials and certificates, review policy-install history) and hunt for lateral movement toward NetScaler, Ivanti, vCenter, Exchange and domain controllers. Also check any Rejetto HFS instance for session forgery (CVE-2026-61500). Hardening: restrict management-plane reachability (Trusted Clients, management VLAN/VPN only), apply the July Jumbo hotfix, and patch the other named edge products. Cross-domain note: S1 (exploitation) and S3 (GreyNoise research) may also surface this.'
- title: 'Radware Cloud WAF: an internal management API reachable from the internet without authentication exposed customer contact data and, for some customers, log-export credentials for AWS S3, Azure Blob and SFTP'
  sources:
  - url: https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/
    publisher: BleepingComputer (reading Radware root-cause analysis)
    date: '2026-11-24'
    role: primary
  discovery_trace: 'first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ -> article https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/ -> primary not reachable: Radware has published no statement (BleepingComputer, 2026-11-24); WebSearch (''Radware Cloud WAF management API breach customer log export credentials'' and an extended variant) returned only rewrites of the BleepingComputer article (dev.to, urgent.news, mlq.ai, thetechhacker), which are not independent'
  summary: 'BleepingComputer obtained Radware''s root-cause analysis (shared by an anonymous source) of an incident on 2026-11-19: an unauthorised party reached an internal-only Cloud WAF management API that was exposed to the public internet without authentication. Radware says the confirmed exposure is customer contact details and, for a subset of customers, the credentials configured for Cloud WAF log export into their own storage (AWS S3 keys, Azure Blob keys or SAS tokens, SFTP credentials). It states it detected the activity ten hours after the first access, blocked the originating IP address and the API, and revoked and replaced all internal account credentials; it reports no impact on WAF traffic inspection, certificates, end-user data, customer application traffic or the cloud DDoS service, and no evidence of changed customer security policies. Radware strongly advises AppSec (WAF, BOT) customers to rotate log-export credentials and review storage access logs from at least 2026-11-19,
    and says it has already received customer reports of AWS alerts for an unfamiliar IP address trying to reach log-export buckets, so at least some of the exposed credentials were tried. As of BleepingComputer''s report Radware had made no public statement and filed no SEC report, the number of affected customers is undisclosed, and the question whether exposed keys were used beyond those attempts remains under investigation. Single-source: the only account is the vendor''s own RCA as relayed by one outlet.'
  region_nexus: Global vendor (Tel Aviv-based; 12,500+ enterprise and carrier customers per BleepingComputer); no Swiss customer named. Relevance is for any Swiss body running Radware Cloud WAF with log export enabled.
  primary_sector_nexus: 'indirect: security-service supplier incident; exposed secrets live in the customer''s own cloud storage'
  sector: multi-sector
  cves: []
  techniques:
  - T1190
  - T1552
  - T1530
  techniques_basis: T1190 exposed management API with no authentication; T1552 stored log-export credentials read from the platform; T1530 attempted access to customer log-export buckets (customer AWS alerts for an unfamiliar IP).
  affected_products:
  - 'Radware Cloud WAF (AppSec: WAF, BOT)'
  entity_keys: []
