    source_url: https://www.euronews.com/2026/11/23/exclusive-china-backed-hackers-suspected-behind-ongoing-eu-commission-cyberattack
  - quote: CERT-EU has observed similar instances of AI-driven activities against its constituency. These activities highly likely involved the use of ARTEX.
    attribution: CERT-EU
    source_url: https://www.cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex
  - quote: Potentially affected individuals have not been informed directly.
    attribution: SecurityWeek
    source_url: https://www.securityweek.com/european-commission-uncovers-data-breach-in-cyberattack-investigation/
  extended_notes: 'Exposure: any internet-reachable service an operator forgot (management panels, error-verbose endpoints, long-tail misconfigurations); CERT-EU''s reading of ARTEX is that it tests large numbers of low-complexity misconfigurations and chains minor findings, with no hard scope enforcement, and that the original author withdrew the repository in October 2026 so circulating copies are independent forks. Detection (CERT-EU''s guidance, telemetry class first): web/application and WAF access logs showing machine-paced sequential probing of many endpoints from one source followed by exploitation of a misconfiguration; privileged and administrator account activity anomalies; EDR alerts on privilege escalation after a web-tier foothold. Hunt framing from CERT-EU is ''automated scanning patterns, specific tool signatures'' in your own logging. Post-incident check for EU Academy account holders: expect targeted phishing that cites EU Academy or Commission activity; names plus email
    addresses are the confirmed fields. Hardening levers named by CERT-EU: shrink internet exposure to what must be exposed, isolate management/control panels from the internet, prioritise emergency patching of exposed assets, sanitise error responses from internet-facing devices, put a WAF in front, and keep non-severe findings in the remediation cycle so agentic tooling cannot chain them. Cross-domain note: S2 (home region and EU public sector) and S3 (ARTEX research) may also return this; the Commission notice and the 2026-11-23 spokesperson briefing are the in-window primaries.'
- title: 'GreyNoise GT13: an AI-assisted actor with persistent access to Check Point Security Management servers at 22 organisations in 17 countries, government among them, relaying through a hijacked Rejetto HFS server'
  sources:
  - url: https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
    publisher: GreyNoise
    date: '2026-11-23'
    role: primary
