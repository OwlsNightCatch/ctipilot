    attribution: Okta Threat Intelligence
    source_url: https://www.okta.com/en-se/blog/threat-intelligence/former_shinyhunters_cluster_moves_to_new_inception_site/
  - quote: These listings represent unverified claims made by the adversary rather than independently confirmed breaches.
    attribution: ReversingLabs
    source_url: https://www.reversinglabs.com/blog/threat-researchers-notebook-sso-vishing-campaign-associated-with-emerging-inception-extortion-group
  - quote: The existence of these domains is not proof that those firms have been breached, or even targeted yet, and none have recently disclosed cyberattacks or other related incidents.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign/
  extended_notes: 'Exposure: organisations whose users sign in through Okta or NetIQ/OpenText Access Manager and whose help desk or staff accept inbound calls asking for urgent password resets. Detection (telemetry class first): identity-provider logs showing a password reset or new MFA factor enrolment followed within minutes by sign-in from a new device or unfamiliar network, and approvals of push or code challenges that the user did not initiate; web proxy and DNS logs for newly registered ''legal-<organisation>'' style lookalikes of your tenant name (ReversingLabs says logs back to 2026-10-21 are worth reviewing); certificate-transparency monitoring for brand-themed legal domains; mail controls do not help because the lures are web-only and phone-delivered. Triage: a legitimate password reset also produces a reset event plus a new-device sign-in, but it normally originates from a help-desk ticket you can match and a managed device; the discriminator is a reset or factor enrolment the
    user cannot tie to a ticket, followed by SaaS data-export activity. Hardening: phishing-resistant authenticators (passkeys, FIDO2, FastPass) enforced for sensitive apps, device-assurance and network-zone policies, and out-of-band caller verification at the help desk.'
