  evidence:
  - quote: On 19 November 2026, an unauthorized party accessed an internal-only Cloud WAF management API that was reachable from the Public Internet without requiring authentication,
    attribution: Radware (root cause analysis, via BleepingComputer)
    source_url: https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/
  - quote: The confirmed information potentially accessed includes customer contact details, and for a subset of customers, the credentials configured for log export into their self-managed storage (AWS S3, Azure Blob Storage, or SFTP).
    attribution: Radware (root cause analysis, via BleepingComputer)
    source_url: https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/
  - quote: it has already received reports from customers about AWS alerts for an unfamiliar IP address attempting to access their log-export buckets
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/
  - quote: Radware has yet to issue a public statement regarding the incident or file a breach report with the US Securities and Exchange Commission.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/
  extended_notes: 'Exposure: customers of Radware Cloud WAF AppSec (WAF, BOT) with the log-export feature pointed at self-managed AWS S3, Azure Blob Storage or SFTP; check the Radware portal for log-export configuration. Detection (telemetry class first): storage-side access records (S3 server access logs or CloudTrail data events, Azure Storage diagnostic logs, SFTP authentication logs) for list/read/write by the log-export principal from addresses outside Radware''s normal egress since 2026-11-19; cloud-provider anomaly alerts on that principal. Post-incident check: rotating the key is necessary but not sufficient; confirm the exported log objects were not read or altered and that the bucket policy restricts the principal to write-only on the one prefix and, where supported, to Radware source ranges. Hardening: least-privilege write-only credentials for log export, short-lived tokens where the destination supports it, storage-side source-IP restrictions.'
