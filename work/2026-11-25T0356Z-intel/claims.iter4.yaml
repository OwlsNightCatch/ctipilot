  - claim_id: efcc2bed23
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "summary"
    kind: frontmatter
    text: "Broadcom's advisory VMSA-2026-0009 of 2026-11-19 fixes CVE-2026-123890, an authentication bypass in the VMware Directory Service of vCenter that needs only network access to vCenter (CVSS 3.1 9.8), with no workaround and, in Broadcom's words, an emergency change. Google Threat Intelligence Group and Mandiant say ARMORY CASTLE, a suspected PRC-nexus actor, exploited it from early September 2026 to move from a compromised remote-support appliance to vCenter, forge administrator SAML sessions and extract domain-controller data from guest virtual disks on ESXi; Broadcom's advisory does not state exploitation. Fixed builds for this flaw are 8.0 U3m, 9.0.2.0200, 9.1.1.0200 and VMware Cloud Foundation 5.2.5, but a second Directory Service bypass fixed on 2026-11-24 leaves 9.1.1.0200 and 9.0.2.0200 affected (9.1.2, 9.0.2.0300 and 8.0 U3m cover both). Rapid7 published a root-cause analysis and a Metasploit module is in a public pull request; vCenter 7.0 has no public fix."
  - claim_id: 3322e5d718
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every vCenter Server to 9.1.2, 9.0.2.0300 or 8.0 U3m (VMware Cloud Foundation 5.x to 5.2.5 through KB88287), which fix this flaw and the second Directory Service bypass of 2026-11-24, now as an emergency change, and until it is in, drop inbound TCP 2012 to vCenter from every address that is not an allowlisted management host, as Google's hardening guidance lists, after testing because TCP 2012 is the vCenter SSO control-interface RPC, because GTIG reports exploitation since early September and Broadcom lists no workaround."
  - claim_id: a3e79325ec
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[1]"
    kind: frontmatter
    text: "On every vCenter that was reachable from an internal host before the update, list the SSO and local administrators on vsphere.local that nobody created, review the SSO signing material and ESXi authorized_keys files, because the actor extracted the SAML signing key and created accounts, which updating does not undo."
