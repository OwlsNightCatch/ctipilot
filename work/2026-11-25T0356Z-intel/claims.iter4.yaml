    surface: "body"
    kind: cited
    text: "Broadcom's release notes disagree with its response matrices in places: the vCenter 9.1.2 notes list only four vCenter CVEs, not the authentication bypass that the matrix says 9.1.2 fixes ("
    urls: ["https://techdocs.broadcom.com/us/en/vmware-cis/vcf/vcf-9-0-and-later/9-1/release-notes/vmware-cloud-foundation-9-1-2-0-release-notes/vcenter-9-1-2-0-release-notes.html"]
