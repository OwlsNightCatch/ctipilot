    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "Broadcom's VMSA-2026-0011 of 2026-11-24 fixes 23 flaws across vCenter, ESX, Workstation, Fusion, VMware Tools and Avi Load Balancer, rated Critical, and Broadcom's questions and answers treat the issues as an emergency change ("
    urls: ["https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md"]
  - claim_id: a007b2bfda
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-123903 is an authentication bypass in vCenter's VMware Directory Service, CVSS 3.1 9.8, reachable with network access to vCenter and no credentials, with no workaround; Broadcom calls it a new and distinct issue from the exploited CVE-2026-123890 in the same component ("
    urls: ["https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md", "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626"]
  - claim_id: 9b541864ac
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-123910 (heap out-of-bounds write) and CVE-2026-123911 (use-after-free) are flaws in the ESX I/O filter service, each 9.8 with network access to the host, and CVE-2026-123912 is an out-of-bounds write in the XHCI USB controller that gives code execution as the VMX process to an administrator inside a virtual machine, CVSS 9.3 in Workstation and Fusion and 8.4 in ESX ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626"]
  - claim_id: 09b3b06905
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "Fixed builds: vCenter 9.1.2, 9.0.2.0300 and 8.0 U3m, VMware Cloud Foundation 5.x through 5.2.5 (KB88287), with no public fix for vCenter 7.0 or ESX 7.0; ESX ESXi-9.1.2.0-25946735, ESXi-9.0.2.0200-25953133 and ESXi80U3m-25926933; Workstation and Fusion 26H1u1 ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626"]
  - claim_id: 984170a506
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "Broadcom says a vCenter on 8.0 U3m from the earlier advisory needs no further update but vCenter 9.1.x does, and for 9.0.x the fixed version in the new advisory (9.0.2.0300) governs, so 9.1.1.0200 and 9.0.2.0200 do not carry the fix ("
    urls: ["https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md"]
  - claim_id: 94d588f387
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: cited
    text: "For ESX 8.x only, KB463535 restricts TCP 9080, where the I/O filter service listens, to the vCenter address; Broadcom says limiting access to the service resolves only a small portion of the issues in the advisory and may affect cluster operation, and tells customers to apply the updates ("
    urls: ["https://knowledge.broadcom.com/external/article/463535/manual-interim-workaround-for-cve2026123.html", "https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md"]
