    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "headline"
    kind: frontmatter
    text: "Unit 42: AI agents behind web shells in 10+ campaigns; hunt 1.4 s command gaps and ===[Title]=== headers"
  - claim_id: b8bbdf210a
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 tracked more than ten campaigns between July and September 2026 in which different attackers pointed autonomous AI agents at targets in sectors including government, logistics, manufacturing and education. Every campaign began with a web shell on a vulnerable web application, after which the agent did reconnaissance, credential harvesting, privilege escalation and lateral movement mostly with single-use scripts and no compiled implants. Unit 42 reports no new technique but measurable traces: a median gap of 1.4 seconds between commands in a subset of attacks (23.9 seconds in the human phase), section headers such as ===[Title]=== in every campaign, and 40 to 100 unique Base64 payloads per session."
  - claim_id: dc401ef2d0
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "Every campaign began with a web shell deployed through a vulnerable web application, typically supplied by the human operator, after which the agent did reconnaissance, credential harvesting, privilege escalation and lateral movement; Unit 42 names no product, CVE or flaw class for the entry vectors and says the novelty was speed and efficiency, not technique ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/"]
  - claim_id: 42b88d8097
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "The agents probed defences: the same find command ran on six endpoints excluding three different security vendors, and one agent applied strace to the Microsoft Defender for Endpoint daemon ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/"]
  - claim_id: 6f108b6444
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "In one AWS case it switched to IMDSv2 token acquisition after IMDSv1 was blocked and enumerated 20 services across eight regions; in another it pushed web shells to more than 40 locations on a Windows IIS server within 26 minutes, and Unit 42 describes another agent that found a vendor's GitLab credentials on a victim's web server and tried to brute-force access to that GitLab instance, exploiting no GitLab flaw ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/"]
  - claim_id: fdb8718383
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "Unit 42 found no behavioural marker tying the activity to a model or framework; a command-and-control address in one campaign also hosted a CyberStrikeAI instance, from which it infers the orchestration platform ("
    urls: ["https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/"]
  - claim_id: c390ec97f0
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: cited
    text: "ReliaQuest saw only a credential-gated CyberStrikeAI login page on a staging host and could not determine whether the tool played a part in its own incident ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 9f0bcf9a07
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "Unit 42 tracked more than ten global campaigns between July and September 2026 in which different attackers deployed autonomous AI agents, against sectors including government, logistics, manufacturing, agriculture and education."
  - claim_id: 2c2a4d992a
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "The traces: a median gap of 1.4 seconds between commands once an agent took over, against 23.9 seconds in the human phase of a subset of attacks; about 800 unique commands in 140 minutes in one case and more than 8,000 over 12 days in another; section headers such as ===[Title]=== in shell commands and scripts in every campaign and step-by-step reasoning notes in more than half; 40 to 100 unique, target-tailored Base64 payloads per session; and no compiled implants, the arsenal being in most cases simple single-use scripts such as PHP web shells, PowerShell WMI backdoors and Python credential harvesters."
  - claim_id: 21b9a41537
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: uncited
    text: "When a pre-built privilege-escalation exploit failed (Copy Fail, PwnKit and CVE-2024-1086 among them) the agent tried the next public binary, then compiled custom C on the target, then rewrote the exploit in Python."
  - claim_id: 9967d6b2b0
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Exposure:** internet-facing web servers that host a vulnerable web application; Unit 42 does not name the applications."
  - claim_id: 0c58dd1b30
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Detection:** in process-lineage telemetry, shells and scripts spawned through a web shell's `sh -c` interface in bursts seconds apart, with ===[Title]=== headers or reasoning-style comments and many unique Base64 payloads; the same enumeration command across hosts excluding security-product directories, and tracing of the endpoint-security daemon; on cloud workloads, a switch to IMDSv2 token requests after IMDSv1 is blocked."
  - claim_id: b753b0a779
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Triage:** Base64 commands and reconnaissance also appear in human-operated intrusions; Unit 42's discriminators are the volume and uniqueness of payloads, the command cadence and the headers, which it says rarely appear in human-operated attacks except with pre-coded scripts."
  - claim_id: 4c5d5ecba0
    entry: 2026-11-25/unit42-agentic-ai-attackers-web-shell-footholds
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** hunt web-server hosts for these traces, looking for volumes of single-use scripts rather than malware families, and close the web-tier entry first; enforce MFA, sign-in rate limiting and source-address restriction on services whose credentials sit on web servers, as Unit 42 advises for GitLab."
