  - claim_id: 483e5b15b5
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** any vCenter Server reachable over the network, with the build shown in the appliance's version summary, and any ESX host whose I/O filter service port is reachable; on ESX 8.x that service listens on TCP 9080 and KB463535 says only vCenter should reach it."
  - claim_id: 7f1780f325
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: derived
    text: "**Detection:** Broadcom publishes no indicators."
  - claim_id: 6c92a063f5
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: derived
    text: "Flows to TCP 9080 on ESX hosts from any address other than the vCenter Server are outside the pattern KB463535 describes, and administrator sessions or account changes on a vCenter that was reachable before patching deserve the review described for the earlier Directory Service bypass."
  - claim_id: dfefd27a92
    entry: 2026-11-25/vmsa-2026-0011-vcenter-bypass-esx-io-filter-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat it as the emergency change Broadcom describes: move vCenter and ESX to the builds above, re-patch any 9.x vCenter that stopped at the earlier advisory's build, and keep management interfaces and the ESX I/O filter port off untrusted networks until then; vCenter 7.0 and ESX 7.0 have no public fix and Broadcom directs extended-support customers to its support, so isolation is the interim lever there."
  - claim_id: 4ccc06e7ce
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "headline"
    kind: frontmatter
    text: "GeoServer: five-step unauthenticated chain to code execution has a public PoC; update to 3.0.2, 2.28.6 or 2.27.7"
  - claim_id: 2a262c3681
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "summary"
    kind: frontmatter
    text: "The GeoServer project published a batch of security advisories on 2026-11-23, most for flaws fixed in 3.0.2, 2.28.6 and 2.27.7, and five of them chain an anonymous WFS request to code execution: a path disclosure, a service-security bypass with a prefixed service name, an XML injection, a predictable remember-me key that forges an administrator session (critical, CVSS 4.0 9.2) and a JDBC deserialization. The reporter, who says it works on a default installation, published a full-chain proof of concept the same night; the fixed releases have been out since October and early November and no source reports exploitation."
  - claim_id: f4f65806e2
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every internet-reachable GeoServer to 3.0.2, 2.28.6 or 2.27.7 (2.27 is end of life, so plan the move to a supported line) and, where that waits, remove rememberme from the web filter chain under Security > Authentication, block requests whose service parameter contains a slash at a proxy in front of GeoServer and restrict WFS for anonymous users, because a public proof of concept chains five steps from an anonymous request to code execution on a default installation."
