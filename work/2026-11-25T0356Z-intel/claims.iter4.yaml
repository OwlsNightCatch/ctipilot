    text: "); the project says the 2.27 series has reached end of life ("
    urls: ["https://geoserver.org/announcements/vulnerability/2026/10/19/geoserver-2-27-7-released.html"]
  - claim_id: 1f6a0d06f8
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "**Exposure:** GeoServer on the affected builds with WFS reachable by anonymous users and the REST API reachable; the reporter says it works on a default installation, with the stock admin account enabled in the default user service and, for its payload, a Linux host, and that the chain read the live key, so it never depended on the shipped value and a rotated key alone does not close it ("
    urls: ["https://cryptocat.me/blog/research/analysis/geoserver_preauth_rce/"]
