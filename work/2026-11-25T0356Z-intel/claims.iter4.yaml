    surface: "summary"
    kind: frontmatter
    text: "Switzerland's Federal Office for Cyber Security (BACS) said on 2026-11-24 that it has for the first time received reports of attacks on Swiss companies and critical-infrastructure operators in at least two sectors that were carried out with the support of an AI agent, and that in every case known to it the agent led to a successful compromise of the victim's IT systems. It names no framework, case count, sector or entry point for the Swiss cases, says the number of internet-reachable agents such as ARTEX and CyberStrikeAI has almost doubled since October 2026, and recommends critical updates on internet-reachable systems within 24 hours."
