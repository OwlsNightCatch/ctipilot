    kind: cited
    text: "); the fixed releases use a random per-node key and invalidate existing remember-me cookies on upgrade ("
    urls: ["https://github.com/geoserver/geoserver/security/advisories/GHSA-hgm3-wq4h-8vvq"]
  - claim_id: 795b93357d
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "**Detection:** in web access logs, WFS requests whose service parameter contains a slash such as x/WFS, and stored queries you did not create under the data directory's wfs/query and workspaces/*/wfs/query folders ("
    urls: ["https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj"]
  - claim_id: 185100a647
