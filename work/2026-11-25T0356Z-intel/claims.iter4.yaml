  - claim_id: 4edf05e1c2
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "Splunk's advisory SVD-2026-1103 of 2026-11-18 fixes 38 flaws in Splunk Enterprise, two rated Critical and unauthenticated ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: 172d826d06
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "CVE-2026-76536 (CVSS 3.1 9.4) lets an unauthenticated user use an empty clustering shared secret to read and modify clustering configuration through the cluster configuration REST endpoint on a standalone instance with clustering turned off, and CVE-2026-76535 (9.1) lets an unauthenticated user run arbitrary SPL searches through RapidDiag task collection as an authenticated user, because Splunk Enterprise accepts an empty shared secret on those requests ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: a86fcabca4
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "Three further unauthenticated rows are rated 7.5: CVE-2026-131192 gives access to live event data from the indexing pipeline on a standalone instance or a search head that is not an indexer cluster member, on an empty shared key, and CVE-2026-131190 exposes RapidDiag process metadata and a log file inventory through endpoints that accept a factory-default shared key, and a third lets an unauthenticated user crash the Splunk daemon through the S2S data-forwarding receiver, for which Splunk lists no workaround ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: b020281b03
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "Splunk lists fixes in 10.6.1, 10.4.5, 10.2.9, 10.0.12 and 9.4.17, with CVE-2026-76536 and CVE-2026-131190 not listed for the 10.6 branch ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: 1cdf48b057
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "For CVE-2026-76535 Splunk says to set a non-empty pass4SymmKey in server.conf, using the same value on each node that participates in the service, and restart; for CVE-2026-76536 the workaround is a strong, unique pass4SymmKey of at least 12 characters in the [clustering] stanza of server.conf, standalone instances included, followed by a restart; CVE-2026-131190 is closed by turning off or removing the RapidDiag app ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1103"]
  - claim_id: 68a15b5191
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: cited
    text: "The advisory does not mention exploitation; NCSC-NL rates the likelihood medium and the damage high ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0512"]
  - claim_id: 173808d43d
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: derived
    text: "**Exposure:** a Splunk Enterprise instance whose pass4SymmKey is empty or unset and whose management REST API can be reached by an untrusted host; Splunk does not say an empty secret is the default on a stock install, so the effective value in server.conf is the thing to read on each instance, and Splunk Cloud impact is not addressed in the advisory."
  - claim_id: 4ed4e0d268
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** set a non-empty pass4SymmKey on every Splunk Enterprise instance now, since that is the workaround for the two Critical rows, and take the upgrade at the next window if the management API is internal; instances reachable from user or internet networks are the ones to do first."
