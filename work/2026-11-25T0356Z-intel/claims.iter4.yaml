  - claim_id: d6998425d2
    entry: 2026-11-25/greynoise-gt13-check-point-management-servers
    surface: "summary"
    kind: frontmatter
    text: "GreyNoise reports that an actor it tracks as GT13 had persistent access to at least 24 Check Point Security Management servers at 22 organisations in 17 named countries and territories (Switzerland is not among them), government among seven sectors, with confirmed activity from 2026-10-17 to 2026-11-02. The actor used a script for the SmartConsole authentication bypass CVE-2026-16232, which Check Point confirms and which has been fixed since July, to launch more than 100 management tasks that copied the firewall database and the internal certificate authority. GreyNoise does not know how the actor first got in or who it is, and expects the campaign to be ongoing."
  - claim_id: 9495a5bf05
    entry: 2026-11-25/greynoise-gt13-check-point-management-servers
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Check Point Security Management and Multi-Domain Security Management server, confirm the Jumbo Hotfix Accumulator is installed (R82.10 from Take 36, R82 from Take 118, R81.20 from Take 158), limit Trusted Clients to named administrator addresses, then search the Audit Logs View for \"Authentication method: Password based application token\" and for any unrecognised administrator name or source address; on a hit, treat the server as compromised, check /etc/ld.so.preload and unfamiliar SSH private keys and treat the firewall database, the internal CA and stored credentials as stolen, because GreyNoise saw the actor copy them from multiple servers and a patch does not evict that access."
  - claim_id: b74f585a68
