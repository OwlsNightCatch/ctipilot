    kind: cited
    text: "The GeoServer project published a batch of security advisories on 2026-11-23, most for flaws fixed in 3.0.2, 2.28.6 and 2.27.7, which the project had announced on 2026-10-19 as an important upgrade for production systems ("
    urls: ["https://geoserver.org/vulnerability/2026/11/23/cve-update.html", "https://geoserver.org/announcements/vulnerability/2026/10/19/geoserver-3-0-2-released.html"]
  - claim_id: 67adc2cd67
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "Five chain, in the order the project gives: a WFS stored-query exception that discloses the data directory path (CVE-2026-129244), service-security rules bypassed with a prefixed service name such as x/WFS so anonymous users can create stored queries (CVE-2026-129243), an unauthenticated WFS GetFeatureById XML injection (CVE-2026-120705), a predictable remember-me key that allows administrator session forgery (CVE-2026-129245, critical) and deserialization in the JDBC user and role services (CVE-2026-129242, administrator required) ("
    urls: ["https://geoserver.org/vulnerability/2026/11/23/cve-update.html", "https://github.com/geoserver/geoserver/security/advisories/GHSA-rv5g-g2r9-58rj"]
  - claim_id: c9f70f1420
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "The project says the critical advisory was first reported as step 4 of an unauthenticated remote command execution chain and that each step was given its own CVE at the CVE Numbering Authority's request ("
    urls: ["https://github.com/geoserver/geoserver/security/advisories/GHSA-hgm3-wq4h-8vvq"]
  - claim_id: fae06c1b46
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "The reporter says the chain gives unauthenticated remote command execution on a default installation: the service-name bypass lets an anonymous stored query read the files that hold the remember-me key and an administrator password digest, which forges an administrator session ("
    urls: ["https://cryptocat.me/blog/research/analysis/geoserver_preauth_rce/"]
  - claim_id: 7778d8d143
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
    surface: "body"
    kind: cited
    text: "Affected are 3.0.0 to 3.0.1, 2.28.0 to 2.28.5 and 2.27.6 and earlier, with 3.0.2, 2.28.6 and 2.27.7 as the fixed releases ("
    urls: ["https://github.com/geoserver/geoserver/security/advisories/GHSA-hgm3-wq4h-8vvq"]
  - claim_id: 07b5cd3c6e
    entry: 2026-11-25/geoserver-five-step-unauthenticated-rce-chain-public-poc
