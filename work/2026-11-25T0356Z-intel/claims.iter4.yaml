  - claim_id: 981a038750
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: cited
    text: "The headline flaw, CVE-2026-61500 (CVSS 4.0 9.3, CWE-338 weak PRNG), derives the session-cookie signing key from JavaScript's non-cryptographic `Math.random()` and leaks outputs of that same generator to unauthenticated clients on the login endpoint; an attacker who collects a small number of login responses can reconstruct the generator's internal state, recover the signing key and forge a valid administrator session cookie, reaching full admin access and code execution through HFS's built-in `server_code` configuration feature (arbitrary server-side script), with no authentication or user interaction ("
    urls: ["https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key"]
  - claim_id: 04cc966307
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: cited
    text: "Exploitation is reported: VulnCheck warned on 2026-10-02 of small-scale reconnaissance against CVE-2026-61500 that hit its canaries ("
    urls: ["https://www.securityweek.com/exploitation-hits-rejetto-hfs-vulnerability-discovered-by-ai/"]
  - claim_id: 316073bc64
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: cited
    text: "), and GreyNoise observed an actor forge the admin cookie on an unpatched HFS server from 2026-10-02 and keep it as a relay ("
    urls: ["https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign"]
  - claim_id: ec79e94e4f
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat any internet-reachable HFS instance below 3.2.1 as possibly compromised now that exploitation is reported; the primitive is a forged admin cookie, not a memory-corruption craft, so weaponisation is cheap."
  - claim_id: 3da9760851
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: derived
    text: "In HFS request logs, the recovery-then-forge sequence shows as a short burst of repeated login requests from one source immediately followed by an authenticated, admin-privileged session with no preceding legitimate credential-setting event, then privileged actions such as `server_code` edits, command hooks or an SSH key appended to root's authorized_keys from that session, as GreyNoise saw, with a forged cookie carrying a flag that lets it work from any source address."
  - claim_id: 669506c7c7
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: derived
    text: "**Triage:** a genuine admin login issues a `Set-Cookie` from the server before any privileged action; a forged session presents a valid-looking admin cookie the server never issued and is typically preceded by a cluster of login probes used to recover the generator state, either signal alone is weak, the sequence is the tell."
  - claim_id: 67a385a059
    entry: 2026-07-13/rejetto-hfs-session-forgery-prng-rce-cve-2026-61500
    surface: "body"
    kind: derived
    text: "Hardening: upgrade to 3.2.1; if that must wait, keep the admin interface off the public internet and disable `server_code`."
