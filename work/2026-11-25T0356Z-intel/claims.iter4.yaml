  - claim_id: dcf428fdb3
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "summary"
    kind: frontmatter
    text: "Splunk's SVD-2026-1103 of 2026-11-18 fixes 38 flaws in Splunk Enterprise, among them unauthenticated authentication bypasses in the REST API that rest on an empty shared secret: CVE-2026-76536 (CVSS 3.1 9.4, reads and changes clustering configuration on a standalone instance) and CVE-2026-76535 (9.1, runs search queries as an authenticated user), plus three rows at 7.5, two on an empty or factory-default shared key and one that crashes splunkd. Splunk lists fixes in 10.6.1, 10.4.5, 10.2.9, 10.0.12 and 9.4.17 and a workaround of setting a non-empty pass4SymmKey; it does not say an empty secret is the out-of-the-box state, and no source reports exploitation."
  - claim_id: 777ce60624
    entry: 2026-11-25/splunk-enterprise-svd-2026-1103-empty-shared-secret
    surface: "actions[0]"
    kind: frontmatter
    text: "Set a strong pass4SymmKey of at least 12 characters in server.conf on every Splunk Enterprise instance below the fixed versions (the [clustering] stanza for CVE-2026-76536 and CVE-2026-131192; Splunk names no stanza for CVE-2026-76535), with the same value on every node that participates in the service, restart it, remove the RapidDiag app where it is not needed and upgrade to 10.6.1, 10.4.5, 10.2.9, 10.0.12 or 9.4.17, instances whose management API is reachable from user or internet networks first, because the unauthenticated REST bypasses accept an empty shared secret."
