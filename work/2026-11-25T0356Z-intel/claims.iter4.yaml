    text: "Broadcom's VMSA-2026-0011 of 2026-11-24 fixes 23 flaws, among them CVE-2026-123903, a second authentication bypass in vCenter's Directory Service that needs only network access (CVSS 3.1 9.8, no workaround), and CVE-2026-123910 and CVE-2026-123911, I/O filter service flaws in ESX that give code execution from network access (9.8 each). vCenter 9.1.2, 9.0.2.0300 and 8.0 U3m fix the vCenter flaw, so a 9.x vCenter already on the build that fixed the exploited CVE-2026-123890 (9.1.1.0200 or 9.0.2.0200) is still affected; no source reports exploitation of these 23 flaws."
