    surface: "body"
    kind: cited
    text: "), and the questions and answers score CVE-2026-123912 at 8.5 for ESX where the response matrix prints 8.4, and Broadcom names the advisory as the source of truth for affected versions and patches ("
    urls: ["https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0011/README.md"]
