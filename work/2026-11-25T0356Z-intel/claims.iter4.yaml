    kind: cited
    text: "); in REST access logs, an administrator session that uploads a database file and creates a JDBC user group service ("
    urls: ["https://github.com/geoserver/geoserver/security/advisories/GHSA-9wf2-fcgq-vxhq"]
  - claim_id: ea314a555d
