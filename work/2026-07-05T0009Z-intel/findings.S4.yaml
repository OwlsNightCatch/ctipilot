    extended_notes: |
      Defender-relevant lessons for a public-sector SOC even though the victim is a US county: (1) initial access
      was plain credential brute force against a generic/service account with no MFA and no VPN gating — the same
      primitive that would defeat many cantonal/federal remote-access setups if MFA enforcement has gaps; hunt for
      repeated authentication failures against shared/service accounts followed by a single success (T1110.001/
      T1110.003), especially on externally reachable RDP/VPN/webmail/AD FS endpoints. (2) This is a pure data-theft
      extortion model with zero encryption — victim organizations and IR playbooks tuned to detect "ransomware"
      via file-encryption telemetry (mass rename/entropy spikes) will miss it; the detectable signal is large
      abnormal outbound data volume / unusual access to case-management or prosecutorial file shares, not crypto
      activity. (3) Ransom-ISAC's explicit non-verifiability of "proof of deletion" is a reusable negotiation-policy
      point for any public-sector legal/incident-response team facing a similar demand. No IOCs; no ransom-payment
      endorsement implied. The exact identity/confirmation of the county victim is not on-record from either party
      in the cited primary — treat that specific attribution as a researcher inference (Ransom-ISAC ties the case
      to public prior Union County, Ohio breach notices from May 2025), not a victim-confirmed fact.
