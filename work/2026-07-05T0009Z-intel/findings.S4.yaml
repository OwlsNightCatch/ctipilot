items:
  - title: "Ransom-ISAC case study: US county government paid $1M to data-only extortion group Kairos after a brute-force credential intrusion"
    sources:
      - { url: "https://ransom-isac.org/blog/kairos-ransomware-data-extortion-case-study/", publisher: "Ransom-ISAC", date: "2026-07-03", role: "primary" }
      - { url: "https://securityaffairs.com/194750/security/u-s-government-agency-paid-1m-to-data-extortion-group-kairos.html", publisher: "Security Affairs", date: "2026-07-04", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/us-government-entity-paid-kairos-group.html", publisher: "The Hacker News", date: "2026-07-04", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs (webfetch listing), URL https://securityaffairs.com/ → primary: Ransom-ISAC report, URL https://ransom-isac.org/blog/kairos-ransomware-data-extortion-case-study/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/us-government-entity-paid-kairos-group.html"
    summary: |
      Ransom-ISAC published a post-incident case study (2026-07-03, syndicated by Security Affairs and The Hacker
      News on 2026-07-04) reconstructing a data-theft extortion case against a US county government (evidence
      points to Union County, Ohio, per the report and prior public breach notices, though neither the county nor
      the group has confirmed the link on-record in this report). The actor, self-styled "Kairos," gained initial
      access on 19 May 2025 via a brute-force credential attack against a generic account with no MFA and no VPN
      restriction (T1110 Brute Force / T1078 Valid Accounts) — Kairos itself told the victim "We accessed your
      network using a bruteforce attack." No ransomware encryptor, locker binary, or payload has ever been
      obtained or independently verified for this actor — Kairos operates purely as data-theft-and-leak extortion
      (T1567 Exfiltration to leak site) without deploying an encryption payload, exfiltrating roughly 2 TB / 1.6
      million files including prosecutorial records, SSNs, financial data and biometric material. Negotiation ran
      ~28 days: Kairos opened at $3M, the victim countered $100K→$430K, Kairos dropped to $2M and then fixed a
      final $1M deadline; the victim paid ~9.44 BTC on 13 June 2025. Ransom-ISAC's blockchain tracing shows the
      payment splitting within hours into a "Main Guy" (6.61 BTC) and "Helper" (2.83 BTC) wallet, routed through
      ByBit, OKX and the Russian exchange BELQI. The group's backend leak-site infrastructure (hosted on Virtual
      Systems LLC / AS30860 in Ukraine) was later seized, with a notice attributed to Ukraine's Security Service
      (SBU) Cyber Department displayed on the server. Ransom-ISAC explicitly flags that "the provided 'proof of
      deletion' was not technically verifiable" and should not be treated as evidence the stolen data was destroyed.
    region_nexus: "United States (public-sector/county government victim); transferable lesson for EU/CH public-sector"
