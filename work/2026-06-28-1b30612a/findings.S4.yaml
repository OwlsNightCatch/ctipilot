    discovery_trace: "first seen at: sec-edgar bridge subcommand `sec-edgar 8k 2026-06-24 2026-06-28 1.05` → SEC EDGAR filing index https://www.sec.gov/Archives/edgar/data/1641601/000119312526282946/ → secondary article at StockTitan at https://www.stocktitan.net/sec-filings/RVRF/8-k-river-financial-corp-reports-material-event-3e0a30b705d5.html → confirmed via WebSearch"
    summary: |
      River Financial Corp (NASDAQ: RVRF), a US Bitcoin financial services provider, filed an SEC Form 8-K Item 1.05 on 25 June 2026 disclosing a material cybersecurity incident. On or about 16 June 2026, an unauthorised threat actor gained access to River Financial's network environment and deployed ransomware across portions of its server environment. The company identified the attack on approximately 19 June 2026 (three-day dwell time between intrusion and detection). River promptly took containment measures including disabling affected administrative accounts and taking impacted systems offline. A third-party forensic firm is investigating the nature, scope, and data exposure. River has not yet determined whether any personally identifiable information was subject to unauthorised access or exfiltration; an amended 8-K is pending. Certain operations have been impacted. This is a standard ransomware intrusion disclosure under the SEC's Item 1.05 rules (4-business-day deadline); the amended filing will carry exfiltration findings.
    ch_eu_nexus: "indirect — US Bitcoin financial services; disclosure pattern relevant to EU/Swiss financial institutions under DORA ICT-incident reporting obligations which follow a comparable timeline structure"
    public_sector_nexus: "indirect"
    sector: "finance, cryptocurrency"
