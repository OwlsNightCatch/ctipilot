    novelty: new
    evidence:
      - quote: "Tata Electronics said it detected the breach 'a few weeks ago' and has since taken measures to address the incident. 'The incident has had no impact on operations across businesses, which remain unaffected,' the company said."
        attribution: "The Record, citing Tata Electronics statement"
