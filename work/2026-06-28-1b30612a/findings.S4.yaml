  - title: "NAIC PeopleSoft Oracle zero-day breach: ShinyHunters publishes 3.1 TB of US insurance regulatory data; investment designations suspended"
    sources:
      - url: "https://content.naic.org/about/security-update"
        publisher: "NAIC (National Association of Insurance Commissioners)"
        date: "2026-06-27"
        role: "primary — official victim statement"
      - url: "https://www.insurancejournal.com/news/national/2026/06/25/875334.htm"
        publisher: "Insurance Journal"
        date: "2026-06-25"
        role: "corroborating — data published online confirmed"
      - url: "https://www.techradar.com/pro/security/naic-confirms-data-breach-with-shinyhunters-claiming-3-1tb-of-data-stolen-in-oracle-zero-day-attack"
        publisher: "TechRadar"
        date: "2026-06-26"
        role: "corroborating — attack vector and scope detail"
      - url: "https://www.insurancebusinessmag.com/us/news/cyber/naic-confirms-peoplesoft-breach-as-cybercriminals-target-insurance-regulators-580134.aspx"
        publisher: "Insurance Business Mag"
        date: "2026-06-24"
        role: "corroborating — 14-day zero-day window detail"
    discovery_trace: "first seen at: databreaches-net, feed https://databreaches.net/feed/ item dated 2026-06-27 → primary: NAIC official victim statement at https://content.naic.org/about/security-update → corroborating Insurance Journal 2026-06-25 confirming data published online → TechRadar 2026-06-26 for technical detail"
    summary: |
      NAIC (the US standard-setting body governing 50-state insurance regulators) detected unauthorised access on 11 June 2026 via an Oracle PeopleSoft zero-day vulnerability — a flaw that was unknown to Oracle and software users at the time of exploitation, leaving a 14-day gap between breach and vendor advisory. The attacker used PeopleSoft as a pivot to gain temporary access to NAIC data storage areas; that access path has since been blocked and remediated. The FBI and external cybersecurity forensics are engaged. ShinyHunters (UNC6240) claimed responsibility on 18 June and by 25 June confirmed it had published the data online. The published corpus includes 3.1 TB / 105,000+ files: 264,000+ insurer statutory financial-reporting PDFs covering property, casualty, health, and life carriers (2017–2024); ~45,000 files from credit-rating agencies (Moody's, Fitch, S&P, Kroll, DBRS, AM Best, Egan-Jones, HR Ratings) including rating determinations; and potentially some technical logs or configuration information. The NAIC states that NIPR, Teammate, SBS, employee PII, EFT data, risk-based capital data, policyholder data, and producer data were not accessed, and that ShinyHunters' claim to have taken SERFF, OPTins, UCAA, EDP, and RDC was not confirmed by forensics. Operational consequence: several credit-rating agencies have paused their data feeds to NAIC, forcing NAIC to temporarily suspend assigning investment-risk designations to insurer portfolios — a structural disruption to US insurance-sector solvency monitoring. The incident is part of a broader Oracle PeopleSoft zero-day campaign affecting 100+ organisations.
    ch_eu_nexus: "indirect — EU/Swiss re-insurance groups and rating agencies whose US subsidiaries use NAIC's systems or whose rating-agency data is in the corpus. Oracle PeopleSoft zero-day campaign affected multiple global organisations; any EU/CH entity running PeopleSoft HR/finance should check patch status."
    public_sector_nexus: "direct — NAIC is the US regulatory standard-setter for 50 state insurance departments; its systems are de-facto public regulatory infrastructure. European insurance regulators (EIOPA, national NCAs) that exchange data with NAIC should assess exposure."
    sector: "finance, insurance, public-sector"
    cves: []
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Unauthorized access to a portion of the NAIC's environment was identified on June 11 via an Oracle PeopleSoft vulnerability. While in PeopleSoft, the unauthorized party was able to obtain information needed to gain temporary access to certain data storage areas."
        attribution: "NAIC official security update"
        source_url: "https://content.naic.org/about/security-update"
      - quote: "The incident resulted from a broad campaign to exploit a vulnerability in PeopleSoft that was unknown to the developer or software users at the time, otherwise known as a 'zero-day vulnerability,' which affected multiple organizations."
        attribution: "NAIC official security update"
        source_url: "https://content.naic.org/about/security-update"
      - quote: "Due to the incident, certain credit rating agencies have paused their data feeds and consequently, the NAIC has temporarily suspended assigning designations to insurer investments."
        attribution: "NAIC official security update"
        source_url: "https://content.naic.org/about/security-update"
    extended_notes: |
      Technique class: T1190 (Exploit Public-Facing Application — Oracle PeopleSoft zero-day), T1078 (Valid Accounts — PeopleSoft credential/session abuse to pivot to storage), T1567 (Exfiltration Over Web Service). Detection opportunity: PeopleSoft application-tier access logs for anomalous inter-service token use; DLP rules on bulk export of financial PDF/CSV repositories; SIEM correlation for off-hours large-volume data staging from PeopleSoft integration accounts. Hardening: Oracle PeopleSoft patch status should be verified against the in-the-wild zero-day campaign; segment PeopleSoft data-lake access with least-privilege service accounts; alert on bulk export volumes from PeopleSoft data-bus endpoints. Swiss/EU angle: EIOPA and national insurance supervisors that have cross-border data exchanges with NAIC, or whose regulated entities use NAIC data services (e.g. AM Best, Fitch) should treat the rating-agency data feeds as potentially tampered until NAIC confirms full integrity restoration.

  - title: "Jaguar Land Rover ransomware (August 2025): UK Cyber Monitoring Centre designates 'Category 3 Systemic Event'; NYT investigation links Russian state-linked group"
    sources:
      - url: "https://techcrunch.com/2026/06/26/russian-hackers-were-behind-2-5-billion-hack-of-jaguar-land-rover-report/"
        publisher: "TechCrunch"
        date: "2026-06-26"
        role: "primary — summary of NYT investigation findings"
      - url: "https://thenextweb.com/news/jaguar-land-rover-hack-russian-hackers-nyt-investigation"
        publisher: "The Next Web"
        date: "2026-06-26"
        role: "corroborating — independent coverage of same NYT investigation"
    discovery_trace: "first seen at: databreaches-net, feed https://databreaches.net/feed/ item dated 2026-06-26 → primary (investigation summary): TechCrunch 2026-06-26 → corroborating: The Next Web 2026-06-26"
    summary: |
      A New York Times investigation published on 26 June 2026 — the in-window source — provides the first named attribution for the August–October 2025 ransomware attack on Jaguar Land Rover (JLR). Investigators including the FBI, UK National Crime Agency, NCSC, Google Mandiant, and Palo Alto Networks now attribute the core intrusion to a Russian state-linked criminal group; Microsoft tracked and named the group to investigators. However, the UK government has not yet made the attribution official, and investigators cannot establish whether the group acted on direct Kremlin orders, with tacit approval, or independently. The attack began 31 August 2025, halted JLR manufacturing for approximately six weeks (production fell to levels not seen since 1952), and disrupted over 5,000 supply-chain businesses. The UK Cyber Monitoring Centre (CMC) rated it a "Category 3 Systemic Event" — its highest tier — estimating UK economic damage at £1.9 billion (~$2.5 billion), surpassing WannaCry's 2017 impact on British institutions. A separate Jordanian actor ("Rey") was also found inside JLR networks independently, illustrating multi-actor opportunistic access to the same victim. Investigators see the attack as possible retaliation for UK support of Ukraine. The UK government subsequently provided a £2 billion support package for JLR.
    ch_eu_nexus: "significant — JLR employs ~36,000 in the UK with major supply-chain exposure across German, Slovak, and Slovenian automotive sub-suppliers. Attribution to Russian state-linked actors with geopolitical motivation has direct relevance to EU/Swiss defense-industrial and automotive sector resilience planning."
    public_sector_nexus: "indirect — supply-chain systemic event affecting critical UK manufacturing sector; government bailout precedent; EU NIS2 cross-border systemic-risk implications"
    sector: "manufacturing, automotive, critical infrastructure"
    cves: []
    actors_campaigns_malware: ["Russian state-linked criminal group (unnamed)", "Rey (Jordanian independent actor)"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Russian hackers were behind last year's devastating cyberattack on Jaguar Land Rover, according to a New York Times investigation published Thursday. However, investigators have not determined whether the hackers were working directly for Vladimir Putin's government, were independent criminals, or were operating with the government's tacit approval."
        attribution: "TechCrunch, citing NYT investigation"
        source_url: "https://techcrunch.com/2026/06/26/russian-hackers-were-behind-2-5-billion-hack-of-jaguar-land-rover-report/"
      - quote: "The Cyber Monitoring Centre designated the incident a 'category 3 systemic event' — its highest tier — surpassing even WannaCry's 2017 damage to British institutions."
        attribution: "The Next Web"
        source_url: "https://thenextweb.com/news/jaguar-land-rover-hack-russian-hackers-nyt-investigation"
    extended_notes: |
      Confidence is MEDIUM rather than HIGH because: (1) the primary source is a journalism investigation relayed through aggregators, not a CERT advisory or government attribution statement; (2) the UK government has not officially attributed. The findings may be accurate but the attribution chain (NYT investigation → TechCrunch/TNW summaries) carries journalism confidence, not government-grade. Detection/hardening relevance: the pattern (Russian GRU/SVR-adjacent criminal actors leveraging enterprise ransomware against NATO-aligned manufacturers) is consistent with established TTP clusters. EU/Swiss manufacturing and defense-industrial companies should treat this as threat-actor signal for sector-targeted Russian ransomware-adjacent operations. The multi-actor simultaneous access finding (Russian group + independent Jordanian actor) underscores that once a victim is partially compromised, additional opportunistic actors can move in via separate vectors — evidence of an under-protected perimeter rather than purely targeted.

  - title: "Tata Electronics supply-chain breach: World Leaks (Hunters International rebrand) publishes 200,000+ files including Apple and Tesla documents"
    sources:
      - url: "https://therecord.media/tata-electronics-confirms-cyberattack"
        publisher: "The Record (Recorded Future News)"
        date: "2026-06-24"
        role: "primary — victim disclosure via statement to Recorded Future News"
      - url: "https://techcrunch.com/2026/06/22/tata-electronics-a-major-tech-supplier-to-apple-and-tesla-confirms-data-breach/"
        publisher: "TechCrunch"
        date: "2026-06-22"
        role: "corroborating — independent coverage of victim statement and World Leaks publication"
    discovery_trace: "first seen at: WebSearch query 'site:therecord.media breach disclosure incident 2026 June 27 28' → The Record article 2026-06-24 at https://therecord.media/tata-electronics-confirms-cyberattack → corroborating: TechCrunch 2026-06-22 at https://techcrunch.com/2026/06/22/tata-electronics-a-major-tech-supplier-to-apple-and-tesla-confirms-data-breach/"
    summary: |
      Tata Electronics, a major Tier 1 supplier to Apple (assembles iPhone models in India) and Tesla (manufactures components, plus announced partnerships with Qualcomm and ASML) confirmed to Recorded Future News on 24 June 2026 that it detected a cybersecurity incident "a few weeks ago." The extortion group World Leaks — widely assessed as a rebrand of Hunters International ransomware (emerged early 2025) — published what it claims are 200,000+ files totalling 630+ GB of data stolen from Tata Electronics. Samples reviewed by researchers include Apple supplier specifications (folders labelled "com.apple.factorydata", material specification documents), and Tesla manufacturing documents including a "NV36 Chargeport Controller — North America" folder and a 2023 "TRADE SECRET" reference to Tesla Project Highland (the Model 3 redesign). Tata Electronics declined to confirm whether client data was exposed or whether a ransom demand was received; a source familiar with Apple told media it had received a ransom demand related to the incident. Tata declined to quantify affected individuals or organisations. This is a supply-chain exfiltration pattern: the breach of a large electronics manufacturer cascades into confidential IP exposure for its technology-sector clients.
    ch_eu_nexus: "indirect — ASML (Dutch, EU) named as a Tata partner in the compromised entity; any EU technology-sector firm with Tata Electronics as a supplier should review what confidential data was shared. Swiss precision-component manufacturers in the same supply-chain tier should take note of the World Leaks / Hunters International targeting pattern against global electronics supply chains."
    public_sector_nexus: "indirect — IP theft from defense-adjacent semiconductor supply chain; ASML is critical to EU semiconductor sovereignty"
    sector: "technology, manufacturing, semiconductors"
    cves: []
    actors_campaigns_malware: ["World Leaks", "Hunters International"]
    verification: MULTI-SOURCE
