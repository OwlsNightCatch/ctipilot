  - title: "KDDI shared email-hosting platform breach exposes up to 14.22 million mailbox credentials across six Japanese ISPs — third-party software zero-day vector"
    sources:
      - url: "https://www.japantimes.co.jp/business/2026/06/24/companies/kddi-data-breach-cyberattack/"
        publisher: "The Japan Times"
        date: "2026-06-24"
        role: "primary — Japanese-language primary, English edition; cites KDDI statement"
      - url: "https://www.infosecurity-magazine.com/news/kddi-breach-japanese-telcos/"
        publisher: "Infosecurity Magazine"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: infosecurity-magazine RSS feed item dated 2026-06-24 → primary: Japan Times 2026-06-24 at https://www.japantimes.co.jp/business/2026/06/24/companies/kddi-data-breach-cyberattack/ → corroborating: Infosecurity Magazine 2026-06-24 at https://www.infosecurity-magazine.com/news/kddi-breach-japanese-telcos/"
    summary: |
      KDDI Corporation, Japan's second-largest telecommunications operator, disclosed on 24 June 2026 that threat actors exploited a vulnerability in third-party software integrated into its managed email service, gaining unauthorised access detected on 17 June 2026. The compromised email-hosting platform is shared across KDDI's own service and six ISPs it provides managed services to: STNet, KDDI Web Communications, JCOM, Chubu Telecommunications, Nifty, and BIGLOBE. Up to 14.22 million mailboxes may have had email addresses and passwords exposed; some passwords were stored in hashed or encrypted form. KDDI immediately modified the affected system and deployed protective measures after identifying the entry point. The company is cooperating with Japan's Personal Information Protection Commission and the Ministry of Internal Affairs and Communications. Affected customers are strongly advised to change email passwords. No attacker attribution has been published. This is a structural multi-tenant shared-platform breach pattern: a single upstream vendor's vulnerability cascades into credential exposure across its downstream ISP customers — a topology increasingly common in European white-label ISP and hosting markets.
    ch_eu_nexus: "indirect — structural pattern directly relevant to Swiss/EU ISP and cloud-hosting consolidation. Any Swiss or European telco or hosting provider using shared managed email infrastructure from a third-party should review the segregation and credential-storage practices of that shared platform."
    public_sector_nexus: "indirect — Japanese telco/ISP sector; pattern transferable to EU/CH shared public-sector IT hosting environments"
    sector: "telco, ISP, technology"
