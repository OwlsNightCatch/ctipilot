      - quote: "The disclosure follows claims by the extortion group World Leaks that it obtained and published confidential files allegedly stolen from Tata Electronics. The breach is the latest attack linked to World Leaks, a cybercriminal operation that emerged in early 2025 after rebranding from the Hunters International ransomware group."
        attribution: "The Record"
