  - title: "River Financial Corp (RVRF) SEC 8-K Item 1.05: ransomware intrusion on 16 June 2026; Bitcoin services provider discloses material cybersecurity incident"
    sources:
      - url: "https://www.stocktitan.net/sec-filings/RVRF/8-k-river-financial-corp-reports-material-event-3e0a30b705d5.html"
        publisher: "StockTitan (SEC 8-K summary)"
        date: "2026-06-25"
