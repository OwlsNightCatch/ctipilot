- code: F3
  category: claim-not-supported
  section: active-threats
  item: "NYT investigation gives first named attribution for the Jaguar Land Rover ransomware attack"
  url_or_quote: "\"The Cyber Monitoring Centre designated the incident a 'category 3 systemic event' — its highest tier — surpassing even WannaCry's 2017 damage to British institutions.\" (attributed to The Next Web)"
  summary: "Neither cited source supports 'Category 3 systemic event'/'highest tier'/'surpassing WannaCry'. The Next Web phrase-search returned NONE for 'category 3'/'systemic event'/'WannaCry'; TechCrunch does not mention the CMC at all. The Evidence quote attributed to The Next Web is fabricated. The Next Web DOES support the £1.9bn + 5,000-supply-chain figures. Fix: drop the Category-3/highest-tier/WannaCry wording across §0/§1/§7 and replace the fabricated Evidence quote with the genuine Next Web sentence, OR add+cite the CMC's own published Category-3 assessment."
