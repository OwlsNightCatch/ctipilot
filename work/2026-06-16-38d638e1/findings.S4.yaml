items:
  - title: "UPDATE: ShinyHunters claims Council of Europe breach via Oracle PeopleSoft CVE-2026-35273 — 297 GB of HR/payroll data, June 16 leak deadline"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
        publisher: "BleepingComputer"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.theregister.com/cyber-crime/2026/06/15/council-of-europe-hacked-in-shinyhunters-peoplesoft-heist/5255757"
        publisher: "The Register"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
        publisher: "SecurityWeek"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer (feed), URL https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/ → primary (same article); corroborated via The Register and SecurityWeek"
    summary: |
      ShinyHunters listed the Council of Europe (Strasbourg) on their extortion site on or around 14 June 2026,
      claiming theft of 297 GB encompassing 429,000 files from the institution's HR, payroll, and administrative
      systems — including 409,000 payslips spanning 2011–2026 for 10,000+ staff, 3,700 personnel files, 14,000+
      CVs, and salary/bank-account/tax/social-security/medical records. The Council stated it is "currently
      investigating the matter and assessing the situation" with no further comment. The Register and SecurityWeek
      confirm the attack vector as CVE-2026-35273, the Oracle PeopleSoft Environment Management Hub zero-day
      already attributed to ShinyHunters/UNC6240 across 100+ global organisations (confirmed by Google GTIG).
      ShinyHunters set June 16 as the contact-or-leak deadline. The Council of Europe is not an EU institution
      (it is the 46-member-state intergovernmental body hosting the European Court of Human Rights); its HR data
      covers staff across all 46 member states including all EU states and Switzerland. This is a material UPDATE
      on the PeopleSoft/ShinyHunters campaign originally covered 12–13 June — confirming European intergovernmental
      body exposure and extending the known victim list with the highest-profile European public-sector target yet.
    ch_eu_nexus: "direct — Council of Europe spans all 46 member states including Switzerland and all EU members; HR data for staff of all nationalities affected"
    public_sector_nexus: "direct — intergovernmental public body"
    sector: "public-administration, international-organisations"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-13"
    evidence:
      - quote: "ShinyHunters claims to have breached the Council of Europe, threatening to release nearly 297 GB of stolen data including payroll records for over 10,000 employees, CVs, contract documents, and personal information spanning 2011-2026"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
      - quote: "ShinyHunters exploited CVE-2026-35273, a zero-day vulnerability in Oracle PeopleSoft, to breach the Council of Europe and over 100 other organizations"
        attribution: "The Register"
        source_url: "https://www.theregister.com/cyber-crime/2026/06/15/council-of-europe-hacked-in-shinyhunters-peoplesoft-heist/5255757"
    extended_notes: |
      The Council of Europe is headquartered in Strasbourg and employs approximately 2,000 staff across multiple
      bodies (Secretariat, Parliamentary Assembly, EDQM, Court of Human Rights). Affected data spans current and
      former staff, contractors, and job applicants. The EDQM (European Directorate for the Quality of Medicines)
      is the European pharmacopoeial authority — its personnel file inclusion has implications for pharmaceutical
      standards governance. The June 16 leak deadline falls today (run date). Swiss nationals work across CoE
      bodies and Switzerland is a full member state. Defender note: CVE-2026-35273 patch (Oracle out-of-band,
      confirmed June 12) should be treated as incident-response-level if not yet applied; Salesforce Aura-connected
      PeopleSoft instances should be audited for lateral access paths.

  - title: "UNC6508 (PRC-nexus) targets North American medical, military, and AI research via REDCap — InfiniteRed malware, Google Workspace compliance-rule exfiltration (GTIG primary)"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
        publisher: "Google Threat Intelligence Group (GTIG)"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-breach-redcap-servers-steal-medical-research/"
        publisher: "BleepingComputer"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/15/chinese-hackers-redcap-medical-research-institutions-breach/"
        publisher: "Help Net Security"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed, URL https://thehackernews.com/2026/06/chinese-hackers-abused-google-workspace.html → pivot: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/chinese-hackers-breach-redcap-servers-steal-medical-research/ → primary: Google GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
    summary: |
      Google GTIG disclosed on 15 June a PRC-nexus espionage campaign (tracked as UNC6508) that operated
      undetected in North American medical research, academic, and military health networks from September 2023
      through November 2025. Initial access: internet-facing REDCap (Research Electronic Data Capture) servers
      exploited to deploy INFINITERED, a custom three-component malware. Component 1 intercepts the REDCap
      software-upgrade process for persistence (GUID delimiter b49e334d-9c01-463e-9bc5-00a6920fb66e).
      Component 2 harvests credentials via POST-request capture, storing them with an "xc32038474a" prefix in
      legitimate REDCap database tables. Component 3 is a backdoor communicating via HTTP Cookie parameters.
      After pivoting to domain administrator, UNC6508 created a Google Workspace content compliance rule named
      "Patroit" (T1114.003 Email Forwarding Rule) to silently BCC-forward emails matching keywords covering AI,
      cyber operations, uncrewed vehicle systems, defence intelligence, and pathogen surveillance to an
      attacker-controlled Gmail account (now disabled). GTIG notified multiple US and Canadian organisations
      and disrupted attacker infrastructure. REDCap is deployed at hundreds of research institutions in Europe
      including Swiss university hospitals and research networks (ISPM, CHUV, USZ, KSA, Inselspital all use
      REDCap for clinical trial management). MITRE: T1190 (REDCap exploitation), T1505.003 (web shell), T1554
      (compromise client software binary), T1056.003 (web portal credential capture), T1114.003 (email
      forwarding rule), T1567 (exfiltration over web service), T1090.003 (multi-hop proxy).
    ch_eu_nexus: "high — REDCap is deployed at Swiss and EU university hospital and clinical research networks; attack TTP of weaponising Google Workspace compliance rules replicable against EU cloud tenants"
    public_sector_nexus: "direct — targets include academic and public-health research institutions"
    sector: "healthcare, education, defense, research"
    cves: []
    actors_campaigns_malware: ["UNC6508", "INFINITERED"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "UNC6508, a PRC-nexus threat actor, conducting a sophisticated espionage campaign against North American medical research institutions, academic centers, and military health entities beginning in September 2023 and continuing through November 2025"
        attribution: "Google Threat Intelligence Group (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
      - quote: "UNC6508 created a compliance rule named 'Patroit' to match keywords and email address patterns in sent or received emails. These messages were then silently BCC-forwarded to an attacker-controlled Gmail address"
        attribution: "Google Threat Intelligence Group (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
    extended_notes: |
      Defender detection angles: (1) REDCap upgrade-interception — monitor REDCap upgrade-related file hashes
      against known-good baselines; REDCap update logs for anomalous GUID insertion. (2) Credential harvesting
      — inspect REDCap database session tables for entries prefixed 'xc32038474a'. (3) Google Workspace audit:
      Workspace Admin audit logs → Reports → Email Log Search → filter on content compliance rules for
      recently-created rules with external forwarding destinations, especially rules created after staff changes
      or privilege escalations. (4) Multi-hop proxy chaining through US residential IPs / compromised ASUS
      routers — anomalous admin logins from ISP residential IP ranges are a detection hook.
      Google Workspace hardening: enforce 2SV / Advanced Protection for admin accounts, implement Device Bound
      Session Credentials, enable Context-Aware Access policies, and restrict content compliance rule creation
      to a named group of admins.
      REDCap is used by ISPM Bern, CHUV Lausanne, University Hospital Zurich, and Kantonsspital Aarau among
      others — European institutions should audit their REDCap instances for INFINITERED indicators and
      Google Workspace compliance rules immediately.

  - title: "iRhythm Holdings (SEC 8-K Item 1.05): social engineering compromises third-party business applications, PHI and PII exfiltrated, extortion demand received — filed 15 June"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/0001388658/000138865826000055/irtc-20260610.htm"
        publisher: "SEC EDGAR — iRhythm Holdings 8-K"
        date: "2026-06-15"
        role: "primary"
    discovery_trace: "first seen at: SEC EDGAR bridge subcommand (sec-edgar 8k 2026-06-14 2026-06-16 1.05) → primary: SEC EDGAR filing index at https://www.sec.gov/Archives/edgar/data/1388658/000138865826000055/ → 8-K document at https://www.sec.gov/Archives/edgar/data/0001388658/000138865826000055/irtc-20260610.htm"
    summary: |
      iRhythm Holdings (NASDAQ: IRTC), a cardiac-monitoring medical device company making the Zio wearable
      patch used by hundreds of thousands of patients, filed a Form 8-K Item 1.05 (Material Cybersecurity
      Incident) on 15 June 2026. On 8 June 2026, the company identified unauthorised activity involving data
      in certain third-party-hosted business applications. On 9 June, a threat actor communicated demands for
      payment in exchange for not publicly disclosing "proprietary data, patient protected health information
      [PHI] and other personal information." The company confirmed data was exfiltrated and determined on 10
      June that the incident is material based on data volume. The attack vector is stated as social engineering
      against third-party-hosted business applications — not a vulnerability in iRhythm's own clinical systems
      or medical device infrastructure. The company's Zio monitoring systems, clinical data systems, and
      patient-safety infrastructure were not impacted; the company does not store individual financial or
      payment card information. Investigation is ongoing; no attribution, no patient count, no data categories
      confirmed. This is a single-source item (direct SEC primary filing) — no independent journalism
      corroboration found in-window. The filing is direct US primary regulator disclosure with high reliability.
    ch_eu_nexus: "indirect — Zio patches are used across EU including CH; under GDPR any PHI for EU patients would trigger Article 33 notification; this SEC filing is the public disclosure trigger"
    public_sector_nexus: "indirect — healthcare patients include public insurance beneficiaries"
    sector: "healthcare, medtech"
    cves: []
    actors_campaigns_malware: []
    verification: "SINGLE-SOURCE (SEC EDGAR primary — national regulator filing)"
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the Company received communications from a threat actor claiming to have obtained sensitive information, including proprietary data, patient protected health information and other personal information. The communications from the threat actor demanded payment in exchange for not publicly disclosing this information."
        attribution: "iRhythm Holdings 8-K (SEC EDGAR)"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001388658/000138865826000055/irtc-20260610.htm"
      - quote: "the affected data was obtained through social engineering and is from certain third-party-hosted business applications"
        attribution: "iRhythm Holdings 8-K (SEC EDGAR)"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001388658/000138865826000055/irtc-20260610.htm"
    extended_notes: |
      iRhythm is headquartered in San Francisco (IRTC on NASDAQ). The Zio patch is a wearable cardiac
      biosensor used for ambulatory ECG monitoring — patients wear it for up to 14 days during atrial
      fibrillation diagnosis. The company has a significant EU commercial presence. The social-engineering
      vector against third-party-hosted business applications is consistent with recent credential-phishing
      and SaaS-platform abuse campaigns. Pattern matches broader Coinbase Cartel / ShinyHunters SaaS
      data theft campaigns that have targeted Salesforce and similar CRM/business application tenants.
      Defenders: (a) audit identity federation and API access grants to third-party SaaS platforms for
      MFA gaps; (b) review data-sharing agreements with third-party application vendors for PHI handling
      obligations; (c) ensure HIPAA Business Associate Agreements explicitly require breach notification
      within 60 days; (d) for EU-facing operations, prepare Art. 33 DPA notification (72h clock starts
      from when you "become aware").

  - title: "Awesome Motive CDN supply-chain attack: UpdraftPlus vulnerability exploited to steal CDN API key, JavaScript poisoned on OptinMonster/TrustPulse/PushEngage — rogue WordPress admin accounts planted on 1.2M sites"
    sources:
      - url: "https://optinmonster.com/security-incident-tampered-script-served-via-optinmonster-and-trustpulse/"
        publisher: "OptinMonster / Awesome Motive (vendor disclosure)"
        date: "2026-06-13"
        role: "primary"
      - url: "https://sansec.io/research/optinmonster-supply-chain-attack"
        publisher: "Sansec"
        date: "2026-06-15"
        role: "primary"
      - url: "https://patchstack.com/articles/supply-chain-attack-on-optinmonster-trustpulse-and-pushengage-tampered-cdn-scripts-auto-creating-rogue-admins/"
        publisher: "Patchstack"
        date: "2026-06-14"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/optinmonster-wordpress-plugin-hacked-in-cdn-supply-chain-attack/"
        publisher: "BleepingComputer"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed item, URL https://www.bleepingcomputer.com/news/security/optinmonster-wordpress-plugin-hacked-in-cdn-supply-chain-attack/ → pivot: Sansec primary research, URL https://sansec.io/research/optinmonster-supply-chain-attack → vendor advisory at https://optinmonster.com/security-incident-tampered-script-served-via-optinmonster-and-trustpulse/"
    summary: |
      Between approximately 22:17 UTC on 12 June and 14 June 2026, attackers tampered with JavaScript SDK
      files served through Awesome Motive's CDN to users of OptinMonster, TrustPulse, and PushEngage — three
      widely deployed WordPress conversion-optimisation and push-notification plugins with a combined install
      base exceeding 1.2 million active sites. Awesome Motive confirmed the initial access vector: the attacker
      exploited a vulnerability in UpdraftPlus (the backup plugin, CVE-2026-10795 or a related flaw) on
      OptinMonster's marketing server, extracting a CDN API key. The injected payload executed inside
      authenticated administrator browser sessions: it harvested the admin's WordPress nonce, used it to
      create a hidden rogue admin account (username pattern: "developer_api1" or "dev_xxxxxx"), and installed
      a self-concealing backdoor plugin named "Content Delivery Helper" or "Database Optimizer" that exposes
      web-shell endpoints and unauthenticated code-execution capability. Credential exfiltration used XOR
      encryption (key jX9kM2nP4qR6sT8v) to a C2 at tidio[.]cc. Sansec identified five CDN endpoint files
      compromised across OptinMonster, TrustPulse and PushEngage CDN domains. Awesome Motive rotated CDN
      API credentials and re-remediated the marketing site. PushEngage CDN nodes continued serving malicious
      payload until 14 June. Patchstack blocked 271 exploitation attempts across 13 monitored sites from 81
      IPs. Attacker attribution: unknown (infrastructure at AS214036 / Ultahost).
    ch_eu_nexus: "global; Swiss public-sector websites and EU government web presences running WordPress with OptinMonster/TrustPulse for citizen engagement forms are in scope"
    public_sector_nexus: "indirect — public-sector WordPress sites using these plugins may be affected"
    sector: "technology, web-hosting, public-administration"
    cves: [CVE-2026-10795]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker exploited a vulnerability in UpdraftPlus to access OptinMonster's marketing website server, obtaining a CDN API key. They used this to serve tampered JavaScript files for approximately 'a few hours on June 12, 2026 (UTC).'"
        attribution: "OptinMonster / Awesome Motive"
        source_url: "https://optinmonster.com/security-incident-tampered-script-served-via-optinmonster-and-trustpulse/"
      - quote: "The payload created rogue administrator accounts (developer_api1 and randomized dev_xxxxxx identities) and deployed self-hiding backdoor plugins disguised as 'Content Delivery Helper' or 'Database Optimizer'"
        attribution: "Sansec"
        source_url: "https://sansec.io/research/optinmonster-supply-chain-attack"
    extended_notes: |
      The UpdraftPlus CVE-2026-10795 covered in the 14 June brief (unauthenticated auth bypass yielding RCE in
      versions <= 1.26.4) is the stated root cause of the CDN key theft. This is a real-world exploitation
      chain from an advisory-tier vulnerability to a supply-chain attack affecting >1.2M WordPress sites.
      Detection and remediation actions for WordPress site administrators:
      (1) Audit user accounts: check wp_users for 'developer_api1' or any 'dev_[hex]' usernames created
          between June 12 and June 15; scan filesystem (not wp-admin plugin list) for 'content-delivery-helper'
          or 'database-optimizer' plugin directories — these hide from the admin dashboard.
      (2) Check for web-shell files: audit wp-content/plugins/ for recently-created .php files with
          eval(base64_decode()) or system() calls; log file timestamp comparisons against package manifests.
      (3) Verify CDN-delivered scripts: if OptinMonster/TrustPulse/PushEngage version < current, update
          immediately; compare cached CDN JS hashes against current vendor-published hashes.
      (4) Rotate all WP admin passwords and application credentials if admin was logged in on June 12-14.
      MITRE: T1195.002 (Compromise Software Supply Chain), T1098.001 (Additional Cloud Credentials via
      nonce abuse), T1505.003 (Web Shell via backdoor plugin).

  - title: "UPDATE: Novo Nordisk incident update — pseudonymised clinical-trial data exfiltrated; non-pseudonymised HCP data confirmed; no patient identifiers exposed"
    sources:
      - url: "https://www.novonordisk.com/news-and-media/latest-news/incident-update.html"
        publisher: "Novo Nordisk (victim statement)"
        date: "2026-06-15"
        role: "primary"
      - url: "https://securityaffairs.com/193650/security/novo-nordisk-confirms-data-theft-what-attackers-took-and-what-they-didnt.html"
        publisher: "SecurityAffairs"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: SecurityAffairs RSS feed, URL https://securityaffairs.com/193650/security/novo-nordisk-confirms-data-theft-what-attackers-took-and-what-they-didnt.html → primary: Novo Nordisk incident update page, URL https://www.novonordisk.com/news-and-media/latest-news/incident-update.html"
    summary: |
      Novo Nordisk published a dedicated incident-update page on 15 June confirming the scope of the breach
      first disclosed 11 June. For clinical trial patients: data exfiltrated included pseudonymised patient IDs,
      biomarkers, health/immunogenicity data, demographic information, and lifestyle factors — direct patient
      identifiers (names, contact details) were not in the exfiltrated set, and Novo Nordisk assesses "no
      immediate risks for our patients." For healthcare professionals enrolled in trials: data was not
      pseudonymised, exposing names, professional registration numbers, contact details (phone, WhatsApp),
      email addresses, and office locations. The company is conducting an investigation with external
      cybersecurity experts, has temporarily taken certain internal systems offline, and is in contact with
      relevant authorities. No threat actor has claimed responsibility. This update is operationally relevant
      because it clarifies the GDPR Article 33/34 notification risk: the HCP data exposure is non-pseudonymised
      personal data triggering notification obligations, while patient trial data may have mitigated GDPR
      risk due to pseudonymisation.
    ch_eu_nexus: "direct — Novo Nordisk is a Danish/EU company; GDPR Article 33 notification obligations apply to HCP data; Swiss DSG notification may apply for CH-resident HCPs"
    public_sector_nexus: "indirect — clinical trial participants include public hospital patients"
    sector: "healthcare, pharmaceuticals"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-13"
    evidence:
      - quote: "Exposed clinical trial data included pseudonymized patient identifiers, biomarkers, health/immunogenicity data, demographic information, and lifestyle factors—but not direct patient identifiers like names"
        attribution: "Novo Nordisk incident update"
        source_url: "https://www.novonordisk.com/news-and-media/latest-news/incident-update.html"
      - quote: "Healthcare providers faced greater risk with non-pseudonymized exposure of names, registration numbers, contact details, and office locations"
        attribution: "Novo Nordisk incident update"
        source_url: "https://www.novonordisk.com/news-and-media/latest-news/incident-update.html"

