  - title: "LiteLLM three-CVE chain: low-privilege user escalates to proxy_admin and achieves RCE on AI gateway server — all provider keys and agent traffic exposed (CVE-2026-47101, CVE-2026-47102, CVE-2026-40217)"
    sources:
      - url: "https://obsidiansecurity.com/blog/litellm-privilege-escalation-rce"
        publisher: "Obsidian Security"
        date: "2026-06-15"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/litellm-vulnerability-chain-lets-low.html"
        publisher: "The Hacker News"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'LiteLLM Vulnerability Chain Lets Low-Privilege Users Take Over AI Gateway Servers', https://thehackernews.com/2026/06/litellm-vulnerability-chain-lets-low.html (2026-06-15) → primary: Obsidian Security research blog, URL https://obsidiansecurity.com/blog/litellm-privilege-escalation-rce"
    summary: |
      Obsidian Security published on June 15 a full three-CVE privilege escalation and remote code execution chain in LiteLLM (maintained by BerriAI), the widely deployed open-source AI gateway proxy that brokers calls to OpenAI, Anthropic, Gemini, Azure, Bedrock and 100+ other LLM providers behind a single OpenAI-compatible interface. The chain: (1) CVE-2026-47101 (authorization bypass): the /key/generate endpoint accepts caller-supplied allowed_routes without validating the caller's role, so any internal_user can mint an API key with allowed_routes: ["/*"] to reach admin-only endpoints; (2) CVE-2026-47102 (privilege escalation, CVSS 8.7–8.8): the /user/update endpoint lacks field-level authorisation, allowing any authenticated user to set their own user_role to "proxy_admin"; (3) CVE-2026-40217 (sandbox escape / RCE): the Custom Code Guardrails feature executes attacker-supplied Python code via exec() without suppressing __builtins__, so a full builtins module is available including __import__ and eval — enabling reverse shells and arbitrary file access. The chained CVSS is 9.9. A successful attacker gains: the master key, the salt key decrypting stored credentials, the database URL, all configured provider API keys (enabling unlimited LLM use billed to the victim), and the ability to inject malicious callbacks that rewrite LLM responses to downstream AI agents without detection. An independently discovered regex bypass (X41 D-Sec) also defeated the test-endpoint guardrail via Python bytecode. Patch: v1.83.14-stable (released April 25 2026 but widely undeployed as of Obsidian's June 15 disclosure). Detection: audit LiteLLM /config/update, /user/update, and /key/generate endpoint logs for requests from accounts that should not have admin role; alert on custom guardrail code submissions containing bytecode, import statements, or reversed strings; EDR process-tree monitoring for Python exec() spawning shell processes from the LiteLLM process context. Hardening: upgrade to v1.83.14-stable immediately; rotate all provider API keys if any version < 1.83.14 was exposed to untrusted users; disable Custom Code Guardrails if not in use; enforce network-level restriction of LiteLLM admin endpoints to trusted IPs only.
    ch_eu_nexus: "global — LiteLLM is widely used in EU public-sector and research AI deployments; any institution building AI workflows over LiteLLM is at risk"
    public_sector_nexus: "indirect — government and research AI infrastructure increasingly centralises on gateway proxies; a compromised AI gateway is both a data-theft and agent-manipulation vector"
    sector: "technology, cross-sector AI deployments"
