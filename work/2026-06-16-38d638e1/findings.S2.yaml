  - title: "WordPress supply chain compromise hits 1.2 million sites via Awesome Motive CDN — OptinMonster, TrustPulse, PushEngage plugins backdoored to auto-create rogue admins"
    sources:
      - url: "https://sansec.io/research/optinmonster-supply-chain-attack"
        publisher: "Sansec"
        date: "2026-06-13"
        role: "primary"
      - url: "https://patchstack.com/articles/supply-chain-attack-on-optinmonster-trustpulse-and-pushengage-tampered-cdn-scripts-auto-creating-rogue-admins/"
        publisher: "Patchstack"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/popular-wordpress-plugin-scripts.html"
        publisher: "The Hacker News"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'Popular WordPress Plugin Scripts Tampered to Plant Hidden Backdoors on Sites', https://thehackernews.com/2026/06/popular-wordpress-plugin-scripts.html (2026-06-15) → primary: Sansec Forensics Team research, URL https://sansec.io/research/optinmonster-supply-chain-attack → corroborating: Patchstack https://patchstack.com/articles/supply-chain-attack-on-optinmonster-trustpulse-and-pushengage-tampered-cdn-scripts-auto-creating-rogue-admins/"
    summary: |
      Sansec Forensics detected a supply chain compromise affecting three popular WordPress marketing plugins — OptinMonster (1.2M+ sites), TrustPulse, and PushEngage — all operated by Awesome Motive. Malicious JavaScript was injected into the CDN-served api.min.js files shared by all three plugins on June 12 22:17 UTC, with last verified presence on June 12 22:42 UTC; PushEngage CDN edges still served the injected code as late as June 13 19:02 UTC, with clean by June 14. The attack vector was the Awesome Motive shared CDN infrastructure, not the WordPress.org plugin repository itself, meaning standard "update your plugins" guidance provides false reassurance for the post-compromise window. The malicious JavaScript waited for a logged-in administrator, then silently created a hidden admin account and installed a self-hiding backdoor plugin (observed disguises: "Content Delivery Helper" and "Database Optimizer"). The installed backdoor hid from WordPress admin lists, update checks, and API responses. New credentials were exfiltrated to tidio.cc — a lookalike domain for the legitimate tidio.com chat platform. T1195.001 (Supply Chain Compromise: Software Dependencies), T1098 (Account Manipulation), T1027.005 (Indicator Removal from Tools). Detection: monitor WordPress site audit logs (e.g., WP Activity Log) for unexpected admin-role user creation; scan for plugins hidden from the standard plugin list via `SELECT * FROM wp_options WHERE option_name='active_plugins'` vs. filesystem enumeration; audit loaded WordPress plugins against the filesystem directly; look for outbound HTTP requests to tidio.cc from web servers in WAF/proxy logs. Hardening: enforce Content Security Policy restricting JS loads to known CDN origins; implement admin-action monitoring; review recently created admin accounts on any site using these three plugins.
    ch_eu_nexus: "global; directly affects European public-sector and NGO websites running WordPress with these plugins — very common in government communication departments"
    public_sector_nexus: "indirect — many European public-sector websites use WordPress with marketing plugins; an admin backdoor on a government information site is a credential and trust risk"
    sector: "technology, public administration (indirect), cross-sector"
