  - title: "UPDATE: ShinyHunters breach Council of Europe via CVE-2026-35273 Oracle PeopleSoft — 297 GB HR/payroll data, June 16 leak deadline"
    sources:
      - url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
        publisher: "SecurityWeek"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.theregister.com/cyber-crime/2026/06/15/council-of-europe-hacked-in-shinyhunters-peoplesoft-heist/5255757"
        publisher: "The Register"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
        publisher: "BleepingComputer"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EU European public sector data breach cyber incident June 14 15 16 2026') → primary: SecurityWeek article URL https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/ → corroborating: The Register https://www.theregister.com/cyber-crime/2026/06/15/council-of-europe-hacked-in-shinyhunters-peoplesoft-heist/5255757 → corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
    summary: |
      ShinyHunters (tracked as UNC6240 by Mandiant/Google GTIG) claimed on June 14–15 to have breached the Council of Europe — the pan-European human-rights body seated in Strasbourg — via exploitation of CVE-2026-35273, the Oracle PeopleSoft Environment Management Hub unauthenticated RCE (CVSS 9.8) previously reported as a zero-day in the broader 100+ victim campaign. The group claims to hold 297 GB across 429,000 files, including 409,000+ payslips (2011–2026) for 10,000+ current and former staff, 3,700 personnel records, 14,000 CVs, and HR documents containing names, addresses, dates of birth, phone numbers, employee IDs, salary data, bank account details, tax and social security numbers, and medical records. The Council of Europe confirmed in a statement to The Register and BleepingComputer that it "is currently investigating the matter and assessing the situation" — it has not confirmed data exfiltration. ShinyHunters set a June 16, 2026 deadline for contact before publishing the alleged dataset. The Council of Europe's systems run PeopleSoft for HR/payroll; the attack vector is consistent with Google GTIG's documentation that exploitation of the /PSEMHUB/hub endpoint as a zero-day began at least as early as May 27, 2026. This is now the second named major EU institution breach in 2026 following the March 2026 European Commission compromise. The initial access vector T1190 (Exploit Public-Facing Application) via unauthenticated HTTP to the PSEMHUB servlet is identical to the education-sector campaign covered earlier; defenders should treat any externally reachable PeopleSoft Environment Management Hub as compromised pending forensic review.
    ch_eu_nexus: "Direct — Council of Europe is a Strasbourg-headquartered body with 46 European member states including Switzerland; breach affects staff data of EU/EEA governments' liaison personnel"
    public_sector_nexus: "direct"
    sector: "government, public administration"
    cves: [CVE-2026-35273]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
