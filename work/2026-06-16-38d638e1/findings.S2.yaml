  - title: "SearchLeak CVE-2026-42824: one-click Microsoft 365 Copilot exfiltration — emails, MFA codes, OTPs and SharePoint files stolen via parameter-to-prompt injection, rendering race, and Bing SSRF CSP bypass (patched)"
    sources:
      - url: "https://www.varonis.com/blog/searchleak"
        publisher: "Varonis Threat Labs"
        date: "2026-06-15"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/one-click-microsoft-365-copilot-flaw.html"
        publisher: "The Hacker News"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42824"
        publisher: "Microsoft MSRC"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'One-Click Microsoft 365 Copilot Flaw Could Have Let Attackers Steal Emails, Files, and MFA Codes', https://thehackernews.com/2026/06/one-click-microsoft-365-copilot-flaw.html (2026-06-15) → primary: Varonis Threat Labs research blog, URL https://www.varonis.com/blog/searchleak → corroborating: Microsoft MSRC advisory https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42824"
    summary: |
      Varonis Threat Labs researcher Dolev Taler published a three-stage vulnerability chain in Microsoft 365 Copilot Enterprise Search on June 15, 2026. The chain (CVE-2026-42824, CVSS Microsoft 6.5 / NVD 7.5, patched server-side with no customer action required): (1) Parameter-to-Prompt Injection: the URL q parameter in Copilot Enterprise Search is passed directly to Copilot as executable instructions, not a sanitised search query; (2) HTML Rendering Race Condition: Copilot wraps output in <code> blocks after sanitisation, but the browser renders streamed content before the sanitiser runs — an injected <img> tag fires an HTTP request before neutralisation; (3) CSP Bypass via Bing SSRF: the *.bing.com domain is allowlisted in Copilot's Content Security Policy; Bing's "Search by Image" endpoint performs server-side URL fetches, effectively acting as an SSRF relay that exfiltrates stolen data in the URL path, bypassing client-side CSP enforcement. A victim simply clicks a crafted link to a real microsoft.com domain — no further interaction required. Exfiltrable data: email subjects and bodies (including OTPs, MFA activation codes, password-reset links), calendar entries (attendees, agendas, meeting notes), and all SharePoint/OneDrive files indexed by Copilot (earnings reports, salary data, acquisition plans). Microsoft patched this as a server-side configuration change; no customer-side action is required for currently patched instances. For defenders: the attack is now patched, but the class of vulnerability (AI prompt-injection via URL parameters, streaming-render race, SSRF-relay CSP bypass) will recur in other AI-augmented enterprise applications. Monitor Copilot Search URLs in proxy/DLP logs for HTML-tag-encoded payloads in the q parameter as a detection heuristic. Mapping: T1566.002 (Spearphishing Link as delivery), T1190 (Exploit Public-Facing Application — indirect, the Copilot endpoint), T1048 (Exfiltration Over Alternative Protocol — via Bing SSRF).
    ch_eu_nexus: "global — Microsoft 365 Copilot Enterprise is widely deployed in Swiss federal and EU public-sector organisations; the patched vulnerability is immediately relevant for any organisation that accepted suspicious email links during the unpatched window"
    public_sector_nexus: "direct — Microsoft 365 Copilot Enterprise is a government productivity tool; email containing MFA codes and salary data is a canonical public-sector target"
    sector: "government, financial services, technology, cross-sector"
    cves: [CVE-2026-42824]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A single click on a trusted Microsoft link could have let an attacker pull emails, calendar details, and indexed files out of Microsoft 365 Copilot Enterprise Search"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/one-click-microsoft-365-copilot-flaw.html"
      - quote: "The CSP allowlist for *.bing.com enabled exfiltration through Bing's 'Search by Image' endpoint, which fetches URLs server-side, bypassing browser-level CSP restrictions"
        attribution: "Varonis Threat Labs"
        source_url: "https://www.varonis.com/blog/searchleak"
      - quote: "Microsoft mitigated this backend vulnerability; customers require no action. No active exploitation observed."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/one-click-microsoft-365-copilot-flaw.html"
    extended_notes: |
      The three-bug SearchLeak chain is a textbook illustration of how AI-augmented enterprise applications create novel attack surface: the prompt-injection entry point is unique to the LLM layer, the streaming-render race is unique to the real-time Copilot response renderer, and the SSRF CSP bypass exploits a CSP allowlist that was originally created to support legitimate Bing integration. None of these three components would constitute a vulnerability individually; the chain emerges from their interaction. Defenders building detection rules for Copilot Enterprise should monitor the proxy or CASB logs for anomalous Copilot URLs with encoded HTML in query parameters, and for outbound requests from Bing's image-search endpoints carrying large URL paths to non-Bing-owned domains.

