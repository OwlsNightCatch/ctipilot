      - quote: "Malware adds admin accounts and hidden backdoor to sites using OptinMonster, TrustPulse or PushEngage plugins"
        attribution: "Sansec"
        source_url: "https://sansec.io/research/optinmonster-supply-chain-attack"
      - quote: "A supply chain attack against three popular WordPress marketing plugins (OptinMonster, TrustPulse, and PushEngage) was discovered, injecting malicious JavaScript into shared CDN scripts that silently created admin accounts and installed hidden backdoor plugins"
