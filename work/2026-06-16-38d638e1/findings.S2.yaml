        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
      - quote: "ShinyHunters exploited a zero-day vulnerability in Oracle PeopleSoft (CVE-2026-35273) to breach the Council of Europe and over 100 other organizations"
        attribution: "The Register"
        source_url: "https://www.theregister.com/cyber-crime/2026/06/15/council-of-europe-hacked-in-shinyhunters-peoplesoft-heist/5255757"
