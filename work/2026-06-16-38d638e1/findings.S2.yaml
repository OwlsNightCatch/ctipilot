        source_url: "https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
    extended_notes: |
      Attack surface: the /PSEMHUB/hub and /PSIGW/HttpListeningConnector HTTP endpoints, accessible without authentication when the PeopleSoft Environment Management Hub is internet-facing. Detection: web-server access logs showing POST/GET to /PSEMHUB/* from non-administrative IPs; check for unexpected outbound connections from the PeopleSoft application server. Hardening: block external perimeter access to /PSEMHUB/* and /PSIGW/HttpListeningConnector as temporary measure pending Oracle patch deployment. NCSC-CH Security Hub post 12631 (June 15) also flags this CVE as actively exploited. The Council of Europe is not an EU institution (it is independent), but all 46 European members — including Switzerland — have liaison staff whose HR records may be implicated.

  - title: "Velvet Ant 'Operation Highland': China-nexus group implants nine PAM and OpenSSH backdoor variants in air-gapped critical infrastructure network — 10-year dwell time"
    sources:
      - url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/"
        publisher: "Sygnia"
        date: "2026-06-08"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/15/velvet-ant-backdoored-authentication-persistence/"
        publisher: "Help Net Security"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'China-Linked Hackers Backdoored Linux Login Software to Hide for Nearly a Decade', https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html (2026-06-12) → primary: Sygnia research blog, URL https://www.sygnia.co/blog/operation-highland-velvet-ant/ → corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/ → corroborating: Help Net Security https://www.helpnetsecurity.com/2026/06/15/velvet-ant-backdoored-authentication-persistence/"
    summary: |
      Sygnia published a full forensic write-up ("Operation Highland") on June 8, 2026, documenting a China-nexus intrusion where the threat group Velvet Ant — previously seen abusing F5 BIG-IP appliances (2024) and Cisco NX-OS zero-day CVE-2024-20399 (2024) — maintained undetected access to a large organisation's air-gapped critical infrastructure network from at least 2016 to 2026, a minimum 10-year dwell time. The attack followed three stages: (1) Velvet Ant deployed a modified GS-Netcat binary named "auditdb" in /usr/sbin/ with its argv[0] overwritten to "[khubd]" to masquerade as a kernel thread, establishing a reverse shell to GSRN relay infrastructure; (2) a custom SOCKS5 proxy disguised as "smbd -D" enabled lateral movement through the IT network; Nginx was configured with FastCGI (fcgiwrap) to pass HTTP POST parameters to a binary named "uptime" that then established SSH sessions into the isolated critical infrastructure segment without any direct C2 connectivity to that segment; (3) in the most technically significant stage, Sygnia identified nine distinct backdoored pam_unix.so variants and trojanized OpenSSH binaries (ssh, sshd, scp) — each compiled separately — replacing the legitimate authentication stack on compromised hosts. The malicious PAM modules accepted hardcoded backdoor passwords and/or harvested legitimate credentials to hidden files. The trojanized sshd logged all credentials and commands; the modified ssh binary included a hidden "-d" flag to suppress its own credential logging during attacker operations. The net effect: every administrative action across compromised hosts was fully observable, and persistence survived password resets, making conventional containment measures ineffective. The target organisation sector is not disclosed. MITRE ATT&CK: T1556 (Modify Authentication Process), T1021.004 (SSH), T1090 (Proxy), T1027 (Obfuscated Files), T1036.005 (Masquerading: Match Legitimate Name/Location). Detection: file integrity monitoring (FIM) on /lib/security/pam_unix.so, /usr/sbin/sshd, /usr/bin/ssh, /usr/bin/scp with hash comparison against known-good binaries; package manager consistency checks (`rpm -V openssh` / `dpkg --verify openssh-server`); Syslog/auth.log for authentication events from processes that don't match the expected OpenSSH binary hash; look for hidden files in /tmp or /var with sequential timestamp patterns consistent with keylog accumulation. Hardening: deploy EDR with file integrity monitoring on authentication binaries; enforce immutable-backup restoration procedures tested offline; never use live-patching paths that bypass FIM.
    ch_eu_nexus: "global; critical infrastructure protection lessons directly applicable to Swiss federal and EU public-sector environments with isolated OT/ICS networks"
    public_sector_nexus: "indirect — critical infrastructure operator, sector undisclosed but pattern targets energy/transport/telecom"
    sector: "critical infrastructure, OT/ICS adjacent"
    cves: []
    actors_campaigns_malware: ["Velvet Ant", "GS-Netcat (modified)", "VELVETSHELL"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "PAM modules and OpenSSH binaries were replaced with backdoored versions across multiple hosts — the attacker controlled the full authentication stack"
        attribution: "Sygnia"
        source_url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/"
      - quote: "The modified SSH binaries included a custom flag to disable their own credential logging — the attacker actively managed their forensic footprint during live operations"
        attribution: "Sygnia"
        source_url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/"
      - quote: "Chinese hackers hijack auth flow, spy on isolated network for a decade"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/"
    extended_notes: |
      Velvet Ant's escalation pattern is operationally important: F5 BIG-IP (2024) → Cisco NX-OS (2024, CVE-2024-20399) → authentication stack (2026). Each time a foothold is threatened the group moves to a less-monitored component. Operation Highland is the logical endpoint: instead of exploiting individual services, the group now owns the mechanism that authenticates access to all of them. The remediation challenge highlighted by Sygnia is acute for defenders: you cannot "delete and validate" when the component being remediated is the same one used for remote admin access. Pre-built offline recovery images with known-good binaries are the required mitigation for critical environments.

  - title: "UNC6508/INFINITERED: China-nexus espionage group targets medical, academic, and military research via backdoored REDCap servers and Google Workspace compliance-rule exfiltration"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
        publisher: "Google GTIG"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/15/chinese-hackers-redcap-medical-research-institutions-breach/"
        publisher: "Help Net Security"
        date: "2026-06-15"
        role: "corroborating"
      - url: "https://www.securityweek.com/chinese-hackers-target-medical-military-and-ai-research-in-north-america/"
        publisher: "SecurityWeek"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'Chinese Hackers Abused Google Workspace Rules to Steal Research and Defense Emails', https://thehackernews.com/2026/06/chinese-hackers-abused-google-workspace.html (2026-06-16) → primary: Google GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research → corroborating: Help Net Security https://www.helpnetsecurity.com/2026/06/15/chinese-hackers-redcap-medical-research-institutions-breach/ → corroborating: SecurityWeek https://www.securityweek.com/chinese-hackers-target-medical-military-and-ai-research-in-north-america/"
    summary: |
      Google's Threat Intelligence Group published June 15 findings attributing a multi-year espionage campaign to UNC6508, a China-nexus threat cluster with intelligence priorities consistent with PRC state requirements. The group compromised REDCap servers (the widely deployed clinical/academic research database platform) at North American medical, military health, academic, and regulatory organisations between September 2023 and November 2025. After three months of low-profile presence following initial access via vulnerable legacy REDCap versions plus a "help.php" web shell, UNC6508 deployed INFINITERED — a modular implant that trojans REDCap's upgrade mechanism to persist across updates, harvests credentials from REDCap login pages, and provides a cookie-based backdoor supporting shell execution, file operations, SQL queries, and credential exfiltration. The novel exfiltration technique: UNC6508 created a Google Workspace content compliance rule named "Patriot" that silently BCCs any email matching approximately 150 military-, technology-, and medical-research-related keywords to an attacker-controlled Gmail account — abusing a legitimate admin feature (T1114.003: Email Forwarding Rule abuse). The declared intelligence priorities extend beyond healthcare to cover national security, AI research, drones, cyber-offensive research, defense technology, naval assets, and diplomatic entities. While the disclosed victims are North American, the attack class has direct relevance to Swiss and European research hospitals, university medical centres, and defence-linked academic institutions operating REDCap. Detection: anomalous Google Workspace audit log entries showing creation of content compliance rules (Admin SDK Reports API events) by non-IT-admin accounts; monitor for new BCC rules particularly those with keyword lists; for REDCap specifically, file integrity monitoring on the upgrade pipeline directory and login page handlers. Hardening: enforce Google Workspace Super Admin MFA, audit existing compliance rules, restrict REDCap upgrade access to isolated deployment accounts.
    ch_eu_nexus: "indirect — stated targets are North American; the attack class and targets (academic medical research, military health) directly map to Swiss and European institutions running REDCap; Google Workspace compliance-rule abuse is a cross-border technique"
    public_sector_nexus: "indirect — university medical centres and national health research bodies are public entities in most EU/CH jurisdictions"
    sector: "healthcare, academic, defense"
    cves: []
    actors_campaigns_malware: ["UNC6508", "INFINITERED"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "UNC6508 abused a legitimate Google Workspace content compliance feature to silently BCC matching emails to an attacker-controlled Gmail address"
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/15/chinese-hackers-redcap-medical-research-institutions-breach/"
      - quote: "The threat actor exploited externally facing REDCap servers and deployed custom malware named INFINITERED to capture legitimate REDCap login credentials"
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/15/chinese-hackers-redcap-medical-research-institutions-breach/"
      - quote: "UNC6508 is an espionage-motivated threat cluster with priorities that align with historic PRC state-sponsored espionage trends"
        attribution: "Google GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research"
    extended_notes: |
      REDCap is used across Swiss and European academic hospitals and research institutions (UniversityHospitals, NFP projects, EPFL, ETH Zürich biomedical data programs). The INFINITERED dropper's upgrade-interception technique — hooking the REDCap auto-update path — is a persistence mechanism unique to this platform and distinct from standard web shell implants: standard file-integrity scanning of the web root will not catch it if monitoring does not include the upgrade-staging directory. The Google Workspace BCC-rule exfiltration technique is particularly insidious because the rule appears as a legitimate administrative item in the Google Admin console and generates no alert on the user-facing side.

  - title: "DPRK UNK_DeadDrop / Famous Chollima: phishing campaign weaponises VS Code tasks.json and Packagist/npm packages to infect developer environments — EU targets confirmed (France, Germany, Netherlands)"
    sources:
      - url: "https://www.proofpoint.com/us/blog/threat-insight/dont-fear-repo-unkdeaddrop-phishing-campaign-targets-developers-steal"
        publisher: "Proofpoint"
        date: "2026-06-15"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/north-korean-hackers-are-turning.html"
        publisher: "The Hacker News"
        date: "2026-06-16"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed item 'North Korean Hackers Are Turning Developer Tools Into Malware Delivery Channels', https://thehackernews.com/2026/06/north-korean-hackers-are-turning.html (2026-06-16) → primary: Proofpoint threat-insight blog, URL https://www.proofpoint.com/us/blog/threat-insight/dont-fear-repo-unkdeaddrop-phishing-campaign-targets-developers-steal"
    summary: |
      Proofpoint published June 15 findings on a North Korea-aligned campaign tracked as UNK_DeadDrop — related to but distinct from the canonical Contagious Interview / Famous Chollima cluster — that sent 250+ targeted phishing emails to approximately 100 organisations in finance, cryptocurrency, education, and technology over a six-week period in April–May 2026. The primary delivery is emails with links to actor-controlled GitHub or GitLab repositories posed as legitimate coding assessments, cryptocurrency projects, or Foundry toolkit testing. The repositories contain a hidden .vscode/tasks.json file with the "runOn: folderOpen" setting, which triggers a loader silently when the workspace is opened in VS Code or Cursor IDE. The loader delivers: on Linux/macOS, Overlord (open-source Go-based C2 framework with browser-credential-stealing and crypto-wallet-stealing modules); on Windows, a Node.js pipeline with DPAPI bypass and elevated COM escalation for credential theft. A parallel Packagist vector ("roberts/leads") targets PHP developers. VS Code extensions masquerading as Google services provide persistence and execute commands via a C2 at 23.137.105.75:5173. European targets are confirmed: Proofpoint attributes victims across France, Germany, and the Netherlands in addition to the predominantly US-based set, including technology and financial services firms. MITRE ATT&CK: T1566.002 (Spearphishing Link), T1204.001 (Malicious Link), T1195.001 (Supply Chain Compromise — Software Dependencies), T1056 (Input Capture / credential theft via browserlogin module), T1552.001 (Credentials in Files). Detection: VS Code workspace .vscode/tasks.json files with "runOn: folderOpen" and shell/cmd invocations; unexpected child processes spawned from the Code.exe or Cursor.exe parent (specifically bash, sh, cmd, wscript launching from editor process); Endpoint telemetry for the Overlord C2 beacon pattern (Go HTTP long-poll to non-code-repository external IPs); hunting for malicious VSIX extension installations via VS Code extension host process. Hardening: disable "runOn: folderOpen" workspace tasks in VS Code policy ("security.workspace.trust.enabled": true); restrict VSIX extension installation to approved publisher list via enterprise policy; scan npm/Packagist dependencies for postinstall hooks before first build.
    ch_eu_nexus: "direct — European targets in France, Germany, and the Netherlands confirmed; financial and technology sector organisations are the primary EU victims"
    public_sector_nexus: "indirect — academic and technology sector victims; DPRK credential theft targets any organisation with valuable IP or cryptocurrency access"
    sector: "finance, technology, education, cryptocurrency"
