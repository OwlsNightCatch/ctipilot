        publisher: "phpBB"
        date: "2026-06-06"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-48611"
        publisher: "NVD"
        date: "2026-06-08"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec RSS feed (https://www.heise.de/security/feed.xml), 2026-06-15 item 'phpBB: Kritische Sicherheitslücke ermöglicht Kompromittierung' → primary: Pentest-Tools.com research at https://pentest-tools.com/research/phpbb-authentication-bypass → corroborating: phpBB community announcement + NVD"
    summary: |
      Pentest-Tools.com researcher Dan Stefan Alexandru disclosed two critical authentication
      vulnerabilities in phpBB, the open-source forum software with millions of deployments
      across European universities, municipalities, and community organisations. CVE-2026-48611
      (CVSS 9.4, CWE-305: Authentication Bypass by Primary Weakness) affects all phpBB versions
      3.1.0 through 3.3.16 and 4.0.0-alpha — a range spanning over 10 years of releases. A
      single unauthenticated HTTP request exploiting a flaw in the OAuth integration code
      path (reachable even when OAuth is not configured) returns a valid session for any target
      account, requiring only the target's username (publicly visible on most phpBB installs
      via the member list). CVE-2026-48612 (CVSS 8.3, CWE-352: CSRF) chains a CSRF weakness
      with missing OAuth state validation for boards that have Google, Facebook, or Bitly OAuth
      enabled, allowing session hijacking of logged-in users via a malicious link. Both issues
      are fixed in phpBB 3.3.17 (released June 6, 2026). The 4.0.0 alpha branch has a
      separate fix committed to its development branch.
    ch_eu_nexus: >
      phpBB is widely deployed by Swiss universities, cantonal community portals, European
      public-sector departments, and civil-society organisations for structured forum
      communications. The unauthenticated admin takeover with only a username makes
      CVE-2026-48611 a high-priority emergency-patch item for any internet-reachable phpBB
      instance in government or academic environments.
    public_sector_nexus: "indirect"
    sector: "public-sector, education, non-profit"
    cves: ["CVE-2026-48611", "CVE-2026-48612"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-48611 (CVSS 9.4) is an unauthenticated authentication bypass affecting default installations (auth_method=db) requiring only a single HTTP request and a known username."
        attribution: "Pentest-Tools.com"
        source_url: "https://pentest-tools.com/research/phpbb-authentication-bypass"
      - quote: "All versions from 3.1.0 to 3.3.16 (which covers over 10 years of phpBB releases) contain a critical vulnerability CVE-2026-48611."
        attribution: "Pentest-Tools.com / Infosecurity Magazine search result"
        source_url: "https://pentest-tools.com/research/phpbb-authentication-bypass"
    extended_notes: |
      MITRE ATT&CK: T1078.002 (Valid Accounts: Domain Accounts — authentication bypass yields
      privileged session), T1548 (Abuse Elevation Control — unauthenticated escalation to admin).
      Affected versions: phpBB 3.1.0–3.3.16 and 4.0.0 alpha (all auth methods; OAuth does not
      need to be enabled). Fixed: phpBB 3.3.17 (June 6, 2026). Detection: web server access
      logs — flag POST requests to phpBB's OAuth callback endpoint (`/ucp.php?mode=login&logintype=oauth`)
      with forged `code` parameters from unauthenticated sessions; alert on admin-level actions
      (settings changes, plugin installs) immediately after OAuth-path requests without a
      prior OAuth-authorised session. Hardening: upgrade to 3.3.17 immediately; if upgrade
      is delayed, temporarily disable the OAuth integration even if it is not in use (remove
      the oauth-enabled config flag).

  - title: "UPDATE: ShinyHunters claims 297 GB breach of Council of Europe (HR, payroll, parliamentary data) — linked to CVE-2026-35273 Oracle PeopleSoft chain"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
        publisher: "BleepingComputer"
        date: "2026-06-15"
        role: "primary"
      - url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
        publisher: "SecurityWeek"
        date: "2026-06-15"
        role: "corroborating"
    discovery_trace: "first seen at: securityweek RSS feed (https://www.securityweek.com/feed/), published 2026-06-15 → primary: BleepingComputer article at https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/ → corroborating: SecurityWeek article"
    summary: |
      ShinyHunters (UNC6240) claimed on June 14, 2026 to have breached the Council of Europe
      and exfiltrated approximately 297 GB of data from multiple departments including the
      Secretariat, HR Directorate, Parliamentary Assembly, and the EDQM (European Directorate
      for the Quality of Medicines). The claimed dataset includes 429,000 files spanning payroll
      records for 10,000+ employees (2011–2026), 14,000+ CVs, contracts, purchase orders,
      and HR records containing names, dates of birth, addresses, bank account details, tax
      and social security data, and medical records. The threat actor threatened to release
      the data publicly on June 16 if contacted. The Council of Europe confirmed it is
      investigating and has "no further comment." The Register reports the breach was
      achieved via the Oracle PeopleSoft CVE-2026-35273 zero-day already exploited across
      100+ organisations (previously covered). This is a material new development on a prior
      story: ShinyHunters' PeopleSoft campaign now has a direct EU institution victim.
    ch_eu_nexus: >
      The Council of Europe (Strasbourg) represents 46 European member states, including
      Switzerland. A confirmed breach of payroll and HR records for 10,000+ employees, including
      medical and banking data, is a Category I personal-data breach under GDPR and the CoE's
      own data protection convention. All 46 member states should treat relevant personnel
      data held by the CoE as potentially compromised pending the investigation outcome.
    public_sector_nexus: "direct"
    sector: "public-sector, multilateral organisation"
    cves: ["CVE-2026-35273"]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: update-to-prior:2026-06-13
    evidence:
      - quote: "ShinyHunters claimed to have breached the Council of Europe and exfiltrated approximately 297 GB of data from multiple departments including HR, Secretariat, and Parliamentary Assembly. The group threatened data release on June 16, 2026."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/council-of-europe-investigates-shinyhunters-data-breach-claims/"
      - quote: "The Council of Europe stated: 'We are currently investigating the matter and assessing the situation. We have no further comment to make at this stage'."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/shinyhunters-claims-council-of-europe-hack/"
    extended_notes: |
      Confidence is MEDIUM because the Council of Europe has not confirmed the breach, and
      ShinyHunters claims (like all ransomware/extortion-group leak-site claims) require victim
      or independent verification. The PeopleSoft attack vector is consistent with UNC6240's
      confirmed 100+ victim campaign (CVE-2026-35273, covered June 12-13). Defenders at
      organisations whose HR/payroll data is stored with the CoE should prepare for potential
      notification. The June 16 leak deadline means confirmation or denial should be available
      within the next brief cycle.

