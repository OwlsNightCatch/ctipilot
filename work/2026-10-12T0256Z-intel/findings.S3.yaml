    borderline_reason: "The iOS exploit chain itself is an already weighed and borderline-dropped lead (2026-10-10 fire: patched in iOS 18.7.3 and 26.3, Chinese-language wallet-theft operations); what is new is Report URI's 2026-10-09 expired-domain delivery path, a single-researcher finding (the ecomtrack.io hijack has no independent report; THN is a relay). Worth an entry only for the public-sector web-hygiene lesson (dead third-party script tags on government sites). Report URI sells a JavaScript-integrity product, so its remediation text is partly marketing."
