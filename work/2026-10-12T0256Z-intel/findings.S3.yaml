    discovery_trace: "first seen at: the wider news-feed sweep, The Hacker News feed, URL https://feeds.feedburner.com/TheHackersNews (item 2026-10-11 04:24Z 'P7 DarkSword iOS Exploit Kit Adds Crypto Wallet Data Theft and Remote Commands') -> https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html -> pivot: iVerify, URL https://www.iverify.com/blog/darksword-variant-threat-research -> pivot: Report URI feed https://blog.report-uri.com/rss/ -> primary: https://blog.report-uri.com/abandoned-analytics-domain-funnels-store-visitors-to-darksword-iphone-exploits/ (carries the 2026-10-09 update matching the implant to iVerify's P7 samples) -> Censys URL https://censys.com/blog/darksword-coruna-open-directory-finding-report/ -> GTIG URL https://cloud.google.com/blog/topics/threat-intelligence/darksword-ios-exploit-chain (patch scope); WebSearch ('ecomtrack.io expired domain re-registered tag hijack redirect DarkSword chainmate.top') found no independent report of the ecomtrack.io hijack itself."
    summary: |
      FACTS (Report URI, first-hand): ecomtrack.io, the domain of a defunct Czech e-commerce analytics product, was re-registered on 15 September 2026 after it expired, and the vendor's
      async script tag, still sitting in the themes of stores that had stopped thinking about it, started serving a roughly 2 KB redirector. The script cloaks itself from a long list of
      crawlers and headless browsers, fingerprints the device, POSTs the details back, and the server answers only some visitors: in Report URI's testing datacentre and VPN addresses
      consistently received empty responses, and some residential clients received a payload on the first request and nothing on later ones. A returned URL is followed through a
      no-referrer meta refresh to a traffic broker on another re-registered dead domain (scanners are sent to a random YouTube video or google.com), which sells the visitor to one of at least
      three buyers: a German-language investment-scam page, an online casino, and a fake 'AI crypto trading' site. The last loads a hidden page that checks for Safari on iOS 18.4.0 to
      18.7.2 and, on a match, loads an exploit chain with no further interaction. Report URI identifies the chain as DarkSword from Google's published hunting rule, matching source-path
      artefacts and a helper function; it did not test the recovered chain against real iPhones and found no infrastructure overlap with the campaigns in Google's report. The same kit also
      runs from a second dead lead-generation SDK domain re-registered in August and from a domain injected into hacked WordPress sites, which Report URI reads as an operator collecting dead
      domains and turning them into traffic. Report URI's 2026-10-09 update says the implant matches P7 DarkSword, the variant iVerify documented on 2026-10-08, with two embedded modules
      byte-for-byte identical to iVerify's samples.
      CLAIMS AND ASSESSMENTS (owners named): iVerify (device-side first-hand, from an August customer infection and Validin hunting) assesses that P7 reduces on-device footprint, adds on-device
      keychain and crypto-wallet theft and two-way C2 polling, and that its authors invested real effort rather than producing an LLM-assisted copy. Report URI assesses a financial motive from the
      crypto lure and wallet targeting, without attributing an operator. Censys (open-directory capture) assesses a separate Chinese-speaking exploitation-as-a-service operation and says the
      operator is developing an iOS 26 chain around a JavaScriptCore type confusion (CVE-2026-31001) that is unfinished and not deployed, so 26.x must not be reported as a live capability.
      PATCH SCOPE: GTIG states DarkSword supports iOS 18.4 through 18.7 and that all its vulnerabilities were patched with iOS 26.3 (most earlier); Censys states the 18.x chains are patched in
      iOS 18.7.3 and 26.3; Report URI notes the loader's targeting range (to 18.7.2) is not a confirmed exploitable range and that Google reports two later-stage vulnerabilities patched in 18.7.2.
      Background (Proofpoint via THN, March 2026): the Russian state-linked Star Blizzard (TA446) used leaked DarkSword against iOS targets in a spear-phishing campaign; that is separate from this
      criminal delivery path.
      WHY IT MAY MATTER HERE: the transferable lesson is the web-hygiene class, not the iOS chain. Any public-sector site, municipal portal or shop-style service that still embeds a vendor tag
      whose vendor has closed can be turned into a drive-by delivery point when the domain lapses, and the visitors are the constituency's own citizens and staff. The iOS exposure for a managed
      fleet is small if devices are on iOS 18.7.3 or 26.3 and later.
    region_nexus: "global; online stores worldwide (Czech origin of the dead product, German-language scam buyer). No Swiss site named by any source."
