        attribution: "Censys"
        source_url: "https://censys.com/blog/darksword-coruna-open-directory-finding-report/"
      - quote: "all vulnerabilities were patched with the release of iOS 26.3 (although most were patched prior)"
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/darksword-ios-exploit-chain"
    extended_notes: |
      Exposure (what a source states or follows mechanically): any site whose templates, CMS themes or tag manager still reference a third-party script host for a vendor that no longer exists
      (Report URI: 'the tag sitting on your site didn't' go away with the product); for devices, Safari on iOS 18.4.0 to 18.7.2 per the loader's check, with the fixed builds named by Censys
      (18.7.3 and 26.3) and by GTIG (26.3). Detection concept: (1) web-property telemetry: an inventory of every script src host across public pages, joined with registration-age and
      registrant-change data for each host, flags a lapsed-and-reregistered vendor domain; Content Security Policy report-only violations for script-src show a new or changed host in the browser
      before any user complaint; (2) egress and proxy telemetry from managed browsers: a page load that pulls a script from a long-dead vendor host and then follows a no-referrer meta-refresh
      chain through newly registered domains to an unrelated page is the discriminating sequence; (3) mobile: MDM inventory of iOS versions below 18.7.3/26.3, and iVerify's on-device
      artefacts for P7 (keychain-dump staging files and a debug log in the system tmp directory, localStorage markers set by the exploit loader to stop re-exploitation). Cloaking means
      server-side scanners from datacentre ranges see nothing; only residential or device-like clients get a payload, so a clean crawl proves nothing (Report URI). Hardening: remove script tags
      for products no longer used (Report URI's own recommendation); strict script-src allowlist; tag-manager governance with an owner per tag; Lockdown Mode where a device cannot update
      (GTIG). Not stated by any source: Swiss or public-sector sites carrying the tag, the number of stores still embedding it, or exploitation observed against government devices.
      Open question for the main agent: whether to fold this into a new web-hygiene entry or drop it; there is no existing store entry on third-party-script domain lapses. IOC-class
      material (domains, hashes, C2) exists in the sources and is deliberately not carried.
