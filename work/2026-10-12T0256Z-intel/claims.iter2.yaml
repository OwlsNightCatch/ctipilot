    kind: cited
    text: "), but the vendor's upload fix ships in 4.0.1, the release after 4.0.0 of 2026-09-17, and its changelog gives no affected range, so whether 4.0.0 is affected is not stated ("
    urls: ["https://bricksforge.io/version-changelog/"]
  - claim_id: 307ced663b
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Bricksforge is not in the wordpress.org plugin directory, so no public version statistics exist, and updates come with an annual licence, so a site with a lapsed licence may not receive the fix ("
    urls: ["https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/"]
  - claim_id: 852a790a44
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** in web server and WordPress access logs, POST requests to `/wp-json/bricksforge/v1/form_submit` or to admin-ajax with the `bricksforge_form_submit` action that carry a `temporaryFileUploads` value pairing an image path with a PHP-extension destination, preceded by a call to the nonce endpoint and repeated with changing extensions, case or encodings, from 2026-10-07 onward; in file-integrity and endpoint telemetry, new PHP files in the WordPress uploads tree, the plugin's temporary upload folder first, and web requests to them ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: e3d687e863
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Patchstack says a site that ran a vulnerable version without protection should have its historical logs and the host reviewed for unexpected PHP files, unusual application activity and unauthorized changes ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: a5a5973273
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Web adds a check of the user list for unknown administrator accounts ("
    urls: ["https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/"]
  - claim_id: 8eb630de75
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update every Bricksforge site to 4.0.1, or to 3.1.8.10 on the 3.x line, now; where that is not possible, deactivate Pro Forms or the plugin and block PHP execution in the uploads directory ("
    urls: ["https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/"]
  - claim_id: d907c014ed
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "On a site that was reachable and unpatched since 2026-10-07, run the log and file search above, and if code turns up restore from a backup older than 2026-10-07 and change all passwords ("
    urls: ["https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/"]
