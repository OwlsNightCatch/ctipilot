claims:
  - claim_id: e9d18cc62a
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "headline"
    kind: frontmatter
    text: "Bricksforge's Pro Forms upload flaw is exploited without login since 7 October; fixed in 4.0.1 and 3.1.8.10"
  - claim_id: 700f8dc9f3
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "summary"
    kind: frontmatter
    text: "Patchstack reports that CVE-2026-85097, an unauthenticated arbitrary file upload in the Pro Forms module of Bricksforge, a paid WordPress add-on for the Bricks page builder, has been exploited since 2026-10-07: an attacker with no account gets a PHP file written to the uploads directory and executed, on every version up to and including 3.1.8.9 with Pro Forms active, of about 6,000 active installations. Bricksforge's changelog of 2026-10-08 lists the fix in 4.0.1 and Patchstack names 3.1.8.10 for the 3.x line; the exploitation report rests on Patchstack's telemetry."
  - claim_id: 790a20db9a
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every WordPress site that your organisation, its web agencies or its hosting suppliers run with Bricksforge and update it to version 4.0.1 (3.1.8.10 on the 3.x line) now, treating any site that was reachable and unpatched since 2026-10-07 as one to search for dropped PHP files."
  - claim_id: 13e1ab47fb
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "cves[CVE-2026-85097]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-85097\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"poc-public\", \"patch-available\"], \"affected\": \"Bricksforge versions up to and including 3.1.8.9\", \"fixed\": \"release 4.0.1 (vendor changelog); build 3.1.8.10 on the 3.x line (Patchstack)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 2c660455d2
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Bricksforge's Pro Forms module checks a file's type when it is first uploaded but trusts the file metadata the client sends when the form is submitted, in particular the `url` field of the `temporaryFileUploads` parameter ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: 52c6b9d81e
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "An attacker obtains a nonce from the unauthenticated `bricksforge_regenerate_nonce` AJAX endpoint, uploads a GIF/PHP polyglot that passes the type check, then submits a form whose `file` path names that image and whose `url` ends in a PHP extension; the plugin writes the image's content to the PHP path and one request to it executes the code ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: 4a64c1e32d
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Versions up to and including 3.1.8.9 are affected ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: 58edf5f9e3
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
