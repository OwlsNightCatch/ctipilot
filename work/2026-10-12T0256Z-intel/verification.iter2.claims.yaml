claims:
  - {claim_id: e9d18cc62a, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "This vulnerability is currently being targeted in the wild. ... A fix is available in version 3.1.8.10 (Dr. Web adds 4.0.1 of 8 October)"}
  - {claim_id: 700f8dc9f3, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Exploitation Status | Active exploitation observed; 'activity first observed on October 7, 2026'; 6K badge; changelog 4.0.1 8 October 2026 (see advisory F11 on summary vs 'no confirmed compromise')"}
  - {claim_id: 790a20db9a, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Spielen Sie Version 4.0.1 ein, in der älteren Reihe mindestens 3.1.8.10 ... Durchsuchen Sie den Upload-Ordner ... nach PHP-Dateien"}
  - {claim_id: 13e1ab47fb, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "CVSS 3.1: 9,8, vergeben von Wordfence; Patchstack vergibt 10,0 ... Anfällig sind alle Versionen bis einschließlich 3.1.8.9 (CVE record: baseScore 9.8, lessThanOrEqual 3.1.8.9)"}
  - {claim_id: 2c660455d2, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Bricksforge validates a file's MIME type when it is first uploaded. ... it trusts the file metadata the client sends. ... it does not validate the `url` field inside the `temporaryFileUploads` parameter."}
  - {claim_id: 52c6b9d81e, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Request a valid nonce from the unauthenticated `bricksforge_regenerate_nonce` AJAX endpoint. Upload a GIF/PHP polyglot ... the `url` ends in a PHP extension. ... When that file is requested, the server executes"}
  - {claim_id: 4a64c1e32d, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "It affects Bricksforge versions up to and including 3.1.8.9."}
  - {claim_id: 58edf5f9e3, verdict: ok, source_url: "https://bricksforge.io/version-changelog/", passage: "4.0.1 8. October 2026 Security fix for the Pro Forms file upload: A security issue in the Pro Forms file upload has been fixed."}
  - {claim_id: 0f2d2c64bf, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Version 3.1.8.10 nennt Patchstack als Korrektur, der öffentliche Changelog führt bisher nur 4.0.1. (changelog page read: no 3.1.8.10 entry)"}
  - {claim_id: e597f76e91, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "CVSS 3.1: 9,8, vergeben von Wordfence; Patchstack vergibt 10,0"}
  - {claim_id: 3bc2403769, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "First Observed Exploitation | October 7, 2026, 21:47:17 UTC; 'We recorded 63 unique source IPs'; 'automated exploitation ... do not, on their own, attribute the activity to a single threat actor'"}
  - {claim_id: e55530c8ff, verdict: F14, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Page says 'Our telemetry shows active exploitation attempts' and 'Exploitation Status | Active exploitation observed'; it makes no statement about confirmed or unconfirmed compromise. Web-shell sentence is supported."}
  - {claim_id: 0fde247681, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Patchstack zählt rund 6.000 aktive Installationen."}
  - {claim_id: dba294bc98, verdict: ok, source_url: "https://previdian.com/CVE-2026-85097", passage: "Exploit status | PoC available; Previdian records an exploitation-related signal (poc available)."}
  - {claim_id: 37274b52a6, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Im Katalog der US-Behörde CISA für aktiv ausgenutzte Lücken fehlt der Eintrag bislang. (KEV catalogue 2026.10.08 read: no CVE-2026-85097)"}
  - {claim_id: 1e404e119c, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Affected Versions | ≤ 3.1.8.9"}
  - {claim_id: 0c107880e5, verdict: ok, source_url: "https://bricksforge.io/version-changelog/", passage: "It affects every site with Pro Forms active, including sites whose forms use no upload fields, so updating is strongly recommended."}
  - {claim_id: b9a2b6051b, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Anfällig sind alle Versionen bis einschließlich 3.1.8.9."}
  - {claim_id: 0dbb69764b, verdict: ok, source_url: "https://bricksforge.io/version-changelog/", passage: "4.0.0 17. September 2026 ... 4.0.1 8. October 2026; neither entry states an affected range; 4.0.0 'Includes all hardening and fixes from the 3.x line'."}
  - {claim_id: 307ced663b, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Bricksforge steht nicht im Plugin-Verzeichnis von wordpress.org, eine öffentliche Versionsstatistik fehlt deshalb. Plugin-Updates gehören bei Bricksforge zur Jahreslizenz."}
  - {claim_id: 852a790a44, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "POST /wp-json/bricksforge/v1/form_submit ... /wp-admin/admin-ajax.php with the `bricksforge_form_submit` action; image path paired with PHP-related destination URL; Unexpected PHP files in .../bricksforge/tmp/"}
  - {claim_id: e3d687e863, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "If a site ran a vulnerable version without protection, review historical logs and the host itself for unexpected PHP files, unusual application activity, and unauthorized changes."}
  - {claim_id: a5a5973273, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Prüfen Sie unter Benutzer, ob unbekannte Admin-Konten existieren."}
  - {claim_id: 8eb630de75, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Abschalten: ... deaktivieren Sie Pro Forms oder die ganze Erweiterung. PHP sperren: Untersagen Sie ... die Ausführung von PHP-Dateien im Upload-Ordner."}
  - {claim_id: d907c014ed, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Finden Sie Schadcode, spielen Sie eine Sicherung aus der Zeit vor dem 7. Oktober ein und ändern Sie alle Passwörter."}
  - {claim_id: e9807b1e85, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment ('Dr. Web' citation tail of the Dr. Web-cited 'Web adds a check of the user list' sentence); same source passage as a5a5973273"}
  - {claim_id: 3e4530af58, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment of the CVSS sentence; cited immediately after; Dr. Web: 'CVSS 3.1: 9,8, vergeben von Wordfence; Patchstack vergibt 10,0'"}
  - {claim_id: fdb86cc056, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment of the installation-count sentence; cited to Dr. Web: 'Patchstack zählt rund 6.000 aktive Installationen.'"}
  - {claim_id: 25df2c317c, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Anfällig sind alle Versionen bis einschließlich 3.1.8.9."}
  - {claim_id: 9297cd5247, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Bricksforge steht nicht im Plugin-Verzeichnis von wordpress.org ... Bei ausgelaufener Lizenz kommt die Korrektur womöglich gar nicht an."}
  - {claim_id: 7cb444c592, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Prüfen Sie unter Benutzer, ob unbekannte Admin-Konten existieren."}
  - {claim_id: 53fb7cad70, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Spielen Sie Version 4.0.1 ein, in der älteren Reihe mindestens 3.1.8.10. ... Abschalten ... PHP sperren"}
  - {claim_id: c8c924030d, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Neu aufsetzen: Finden Sie Schadcode, spielen Sie eine Sicherung aus der Zeit vor dem 7. Oktober ein und ändern Sie alle Passwörter."}
