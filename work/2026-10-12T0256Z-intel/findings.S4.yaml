  - title: "IDC Frontier / IDCF Cloud: fourth report (2026-10-09) sets out the response organisation, with SoftBank's corporate division as the customer channel"
    sources:
      - { url: "https://www.idcf.jp/news/topics/20261009001", publisher: "IDC Frontier (fourth report, Japanese)", date: "2026-10-09", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"IDCフロンティア ランサムウェア 第4報 東日本リージョン1 復旧状況\") (the search itself found only reports 1-3) -> IDC Frontier news listing https://www.idcf.jp/news/ (extract showed the fourth-report headline; WebFetch of the same page returned the hrefs) -> primary: https://www.idcf.jp/news/topics/20261009001"
    summary: |
      IDC Frontier's fourth report (2026-10-09) lists the response set-up for the IDCF Cloud incident: an emergency task force set up at 09:00 on 2026-10-07 together with parent SoftBank; SoftBank's corporate division is the customer contact, offering backup-procedure guidance and proposals for a migration environment, and starting or stopping customers' virtual servers on request; IDC Frontier's engineers work on the investigation and recovery plan with an external security specialist firm; reports and consultations with the supervising ministries and police are under way; IDCF Cloud TypeS (formerly White Cloud ASPIRE) and IDCF Private Cloud are outside the incident (already in the entry). The report states no new technical fact: no intrusion route, no actor, no restoration date. The covered entry's takeaway (customer-held backups are the only recovery path, per the third report) stands unchanged.
    region_nexus: "Japan (APAC); entry already covers local-government customers"
    primary_sector_nexus: "indirect: supplier-concentration lesson for public-sector hosting, already the entry's takeaway"
    sector: "technology / cloud hosting; public-sector customers"
