  - title: "ShinyHunters / FBI jobs portal: the FBI arrests a Canadian ransomware-negotiation executive in the case; the group says it will not release the stolen FBI data"
    sources:
      - { url: "https://krebsonsecurity.com/2026/10/fbi-arrests-founder-of-ransomware-negotiation-firm/", publisher: "KrebsOnSecurity", date: "2026-10-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/cyber-exec-arrested-in-case-allegedly-tied-to-shinyhunters-hackers/", publisher: "BleepingComputer", date: "2026-10-10", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/fbi-arrests-another-suspected-shinyhunters-hacker-after-agency-breach/", publisher: "BleepingComputer (FBI Director statement as relayed)", date: "2026-10-09", role: "corroborating" }
      - { url: "https://therecord.media/shinyhunters-arrest-fbi-data-breach-investigation", publisher: "The Record", date: "2026-10-09", role: "corroborating" }
      - { url: "https://databreaches.net/2026/10/10/fbi-announces-yet-another-arrest-allegedly-connected-to-the-fbi-jobs-hack/", publisher: "DataBreaches.net (discovery; quotes Krebs)", date: "2026-10-10", role: "discovery" }
    discovery_trace: "first seen at: databreaches-net (slice record), feed https://databreaches.net/feed/ -> post https://databreaches.net/2026/10/10/fbi-announces-yet-another-arrest-allegedly-connected-to-the-fbi-jobs-hack/ (quotes Krebs) -> primary: KrebsOnSecurity https://krebsonsecurity.com/2026/10/fbi-arrests-founder-of-ransomware-negotiation-firm/ (court docket links CourtListener) -> corroboration: BleepingComputer feed https://www.bleepingcomputer.com/feed/ -> https://www.bleepingcomputer.com/news/security/cyber-exec-arrested-in-case-allegedly-tied-to-shinyhunters-hackers/ and https://www.bleepingcomputer.com/news/security/fbi-arrests-another-suspected-shinyhunters-hacker-after-agency-breach/; The Record feed https://therecord.media/feed -> https://therecord.media/shinyhunters-arrest-fbi-data-breach-investigation"
    summary: |
      Development inside the 72 h developing window on a covered entry (FBI jobs portal / ShinyHunters). FACTS: on Friday
      2026-10-09 FBI Director Kash Patel announced that agents "arrested another suspected co-conspirator of the ShinyHunters
      group" (BleepingComputer, The Record); the New York Times reports the suspect is a Canadian national arrested in
      Pennsylvania (relayed by BleepingComputer and The Record). KrebsOnSecurity, citing multiple sources and federal court records, links the arrest to
      Edward Dubrovsky (associated with CyberSteward, which Politico, as relayed by BleepingComputer, calls a trade name of the Canadian
      firm Cypfer, both helping organisations negotiate and send extortion payments, while Krebs describes CyberSteward as
      another Canadian firm; Cypfer's spokesperson told Krebs he was a managing
      director, not a founder, until November 2025). Federal court records show an Edward "Dobrovsky" arrested on 2026-10-08 in Pennsylvania on cyber-extortion and conspiracy charges, the case moved
      on 2026-10-09 to the Eastern District of Texas, the core complaint is sealed, and the docket lists conspiracy to threaten to
      impair the confidentiality of information with intent to extort and Hobbs Act extortion. CLAIMS / OPEN: the FBI has not
      confirmed the identity or that he is the co-conspirator Patel meant (BleepingComputer); Krebs's sources say charges against
      principals at other ransomware-negotiation companies may be forthcoming; charges are allegations. ShinyHunters, per
      The Record, told several outlets it would not release the stolen FBI information and did not want to escalate the feud with
      the FBI, and posted that it would not remain active on Telegram much longer because members were reportedly arrested (a
      criminal group's statement, not a guarantee the data stays unpublished). The Record adds the FBI has taken down much of
      the group's infrastructure over two weeks. ASSESSMENT BOUNDARY: no source ties the arrest to any Swiss victim; the
      defender-side consequence is limited to incident-response vendor due diligence and extortion-handling playbooks.
    region_nexus: "global / US; no Swiss link in the sources (ShinyHunters has listed Swiss companies on leak sites, covered elsewhere)"
    primary_sector_nexus: "indirect: shared ShinyHunters threat (SaaS data-theft extortion) and the trust position of third-party negotiators in public-sector incident response"
    sector: "public-sector (US federal law enforcement as victim); incident-response / negotiation services"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["actor:shinyhunters", "incident:shinyhunters-fbi-peoplesoft-breach-claim-2026-09", "campaign:shinyhunters-peoplesoft-2026"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: "update-of:2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim"
    borderline: true
    borderline_reason: "Genuinely new development on a covered entry (the entry records the Dutch and Jordan detentions and the contractor patch failure, not this arrest or the group's no-release statement), but it adds no detection or hardening; worth a short changelog record at most, as law-enforcement posture and IR-vendor scrutiny."
    evidence:
      - quote: "arrested another suspected co-conspirator of the ShinyHunters group"
        attribution: "FBI Director Kash Patel (statement as relayed by BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-arrests-another-suspected-shinyhunters-hacker-after-agency-breach/"
      - quote: "Federal court records show that on October 8, an Edward Dobrovsky (note the slight misspelling of the last name) was arrested in Pennsylvania on cyber extortion and conspiracy charges."
        attribution: "KrebsOnSecurity"
        source_url: "https://krebsonsecurity.com/2026/10/fbi-arrests-founder-of-ransomware-negotiation-firm/"
      - quote: "While the FBI has not publicly confirmed that Dubrovsky is the suspected ShinyHunters co-conspirator, KrebsOnSecurity reports that multiple sources linked Dubrovsky's arrest to the ShinyHunters investigation."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/cyber-exec-arrested-in-case-allegedly-tied-to-shinyhunters-hackers/"
      - quote: "ShinyHunters told several news outlets in messages that it would not release the stolen information and did not want to escalate the feud with the FBI"
        attribution: "The Record"
        source_url: "https://therecord.media/shinyhunters-arrest-fbi-data-breach-investigation"
      - quote: "charges against principals at other companies that specialize in ransomware negotiation may be forthcoming"
        attribution: "KrebsOnSecurity (anonymous sources)"
        source_url: "https://krebsonsecurity.com/2026/10/fbi-arrests-founder-of-ransomware-negotiation-firm/"
    extended_notes: |
      Fact / claim / inference split for the composer: facts = the FBI statement, the court-docket entries (Krebs and
      BleepingComputer read CourtListener), the NYT-relayed Canadian-national-in-Pennsylvania detail; claims = ShinyHunters'
      no-release and Telegram statements, Krebs's anonymous-source link of the negotiator to the case and the "may be
      forthcoming" charges; inference = none carried. Do not name the arrested man as a ShinyHunters member: only the FBI
      director's co-conspirator phrasing and unconfirmed source reports tie the two. Detection/hardening content: none new.
      The group's own posture note (Telegram exit) relates to the entry's existing extortion-posture reading.

