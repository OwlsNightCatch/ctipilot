  # ------------------------------------------------------------------ 1
  - title: "Ricardo (SMG Swiss Marketplace Group): a server vulnerability exposed names, postal addresses and phone numbers of about 890,000 accounts of Switzerland's largest online marketplace"
    sources:
      - { url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/", publisher: "SMG Swiss Marketplace Group (victim's own media release)", date: "2026-10-09", role: "primary" }
      - { url: "https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-ricardo-meldet-datenleck-bei-890-000-konten", publisher: "SRF (relays SMG release plus SMG spokesperson answers to AWP and SRF)", date: "2026-10-09", role: "corroborating" }
      - { url: "https://www.inside-it.ch/cybervorfall-bei-online-auktionshaus-ricardo-20261009", publisher: "Inside IT", date: "2026-10-09", role: "corroborating" }
      - { url: "https://www.netzwoche.ch/news/2026-10-09/ricardo-meldet-datenabfluss-bei-890000-userkonten", publisher: "Netzwoche", date: "2026-10-09", role: "corroborating" }
      - { url: "https://www.cash.ch/news/smg-ricardo-daten-von-890000-nutzern-durch-sicherheitslucke-offengelegt-975463", publisher: "cash.ch (AWP wire)", date: "2026-10-09", role: "corroborating" }
      - { url: "https://borncity.com/blog/2026/10/11/cybervorfall-bei-schweizer-auktionsplattform-ricardo/", publisher: "Borns IT- und Windows-Blog (discovery lead, post dated 2026-10-10 22:40Z)", date: "2026-10-10", role: "discovery" }
    discovery_trace: "first seen at: borncity (slice record, lookback 74 h), feed https://borncity.com/blog/feed/ -> post https://borncity.com/blog/2026/10/11/cybervorfall-bei-schweizer-auktionsplattform-ricardo/ (it links the release) -> primary: SMG media release https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/ -> corroboration: SRF https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-ricardo-meldet-datenleck-bei-890-000-konten (reached via WebSearch (\"Ricardo Cybervorfall Auktionsplattform Oktober 2026\")), Inside IT https://www.inside-it.ch/cybervorfall-bei-online-auktionshaus-ricardo-20261009 (via feed https://www.inside-it.ch/rss.xml), Netzwoche and cash.ch (via WebSearch (\"Ricardo Datenleck 890000 Konten Phishing Warnung BACS EDÖB Hackergruppe\"))"
    summary: |
      FACTS (SMG Swiss Marketplace Group, Ricardo's parent, in its own release of 2026-10-09): Ricardo detected suspicious
      activity on its servers on 2026-10-07, closed the security vulnerability that allowed the access, and its investigation
      established that personal data relating to about 890,000 user accounts was exposed, limited to names, postal addresses and
      telephone numbers (company names for business users); email addresses and passwords were not affected. Ricardo says it
      informs the affected users directly, has notified the Swiss Federal Data Protection and Information Commissioner (FDPIC /
      EDÖB), will file a criminal complaint and will report the incident to the National Cyber Security Centre (BACS). An SMG
      spokesperson told SRF there has so far been no extortion and no ransom demand, that the data was never freely accessible,
      and advised caution toward unexpected post, calls, SMS or WhatsApp asking for credit-card, bank or Twint credentials.
      CONTRADICTION left open by the sources: the release's lead sentence says Ricardo "has identified unauthorised access to
      personal data linked to orders on its platform" (Netzwoche and cash.ch repeat it), whereas SRF quotes the spokesperson
      saying no unauthorised access to personal data linked to orders was found; no source resolves which describes the
      accessed tables. NOT STATED by any source: the vulnerability class or component, the attacker or any claim of
      responsibility (no leak-site listing found: ransomware.live searchvictims returned no match), the dwell time before
      2026-10-07, or whether the data has been published or sold. The incident-floor reading is therefore: a home-region
      disclosure with impact but no access vector, actor or behaviour beyond the impact.
    region_nexus: "Switzerland (home region): largest Swiss online marketplace; FDPIC notified, BACS report announced"
    primary_sector_nexus: "indirect: about 890,000 Swiss accounts (names, postal addresses, phone numbers) are phishing, smishing and vishing fuel against Swiss residents, public-sector staff among them; no source breaks the accounts down by employer"
    sector: "retail / e-commerce platform (consumer marketplace)"
    cves: []
    techniques: [T1190]   # inferred only from "the security vulnerability that allowed this access"; no source names the vector, so treat as the weakest-supported mapping
    affected_products: ["Ricardo (ricardo.ch online marketplace)"]
    entity_keys: []
    new_entities:
      - { key: "incident:ricardo-smg-data-exposure-2026-10", type: incident, name: "Ricardo / SMG data exposure (October 2026)", aliases: ["Ricardo Datenabfluss 890'000 Konten"],
          summary: "SMG Swiss Marketplace Group disclosed on 2026-10-09 that a server vulnerability exposed names, postal addresses and phone numbers of about 890,000 Ricardo accounts, detected 2026-10-07 (SMG release, 2026-10-09)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER   # the victim's own disclosure (A-grade for its own incident), relayed by four Swiss outlets; no independent observation of the intrusion exists
    confidence: MEDIUM
    classification_suggestion: { reliability: A, credibility: 2 }
    novelty: new
    lookback: true     # primary disclosure is 2026-10-09 (outside the 26 h window); first surfaced by borncity's 74 h lookback (post of 2026-10-10 22:40Z)
    borderline: true
    borderline_reason: "Clears PD-11 only on home-region nexus; it falls under the incident floor (no vector, actor or behaviour beyond the impact), so at most a routine entry of two sentences plus its transfer ground (accurate name + address + phone for 890k Swiss accounts raises targeted-phishing pretext quality). The vulnerability class is unstated, so techniques[] is the weakest-supported mapping."
    evidence:
      - quote: "The exposed data was limited to names, postal addresses and telephone numbers and, for business users, company names."
        attribution: "SMG Swiss Marketplace Group (media release)"
        source_url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
      - quote: "Ricardo detected suspicious activity on its servers on 7 October 2026 and initiated immediate technical measures to secure its systems."
        attribution: "SMG Swiss Marketplace Group (media release)"
        source_url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
      - quote: "Auch habe der Cyberangriff bislang weder eine Erpressung noch Lösegeldforderungen zur Folge gehabt, so die Sprecherin."
        attribution: "SRF"
        source_url: "https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-ricardo-meldet-datenleck-bei-890-000-konten"
      - quote: "Ricardo, part of SMG Swiss Marketplace Group, has identified unauthorised access to personal data linked to orders on its platform."
        attribution: "SMG Swiss Marketplace Group (media release; lead sentence, in tension with the SRF spokesperson quote)"
        source_url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
      - quote: "Und es sei kein unbefugter Zugriff auf personenbezogene Daten festgestellt worden, die mit Bestellungen auf der Plattform verknüpft gewesen seien."
        attribution: "SRF (SMG spokesperson to AWP, as relayed)"
        source_url: "https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-ricardo-meldet-datenleck-bei-890-000-konten"
    extended_notes: |
      Triage-ready lines the sources support: Exposure: private and business Ricardo account holders; Ricardo is notifying
      them directly, so a recipient of that notice (or an organisation whose staff use Ricardo) can scope exposure; the exposed
      fields are limited to name, postal address, phone number and, for business accounts, company name. Detection: no
      technical indicator is public; the defender-side consequence is on the inbound-contact telemetry class (mail, SMS and
      telephony reports) where pretexts quoting a real name, address and phone number, or Ricardo-themed messages, arrive;
      BACS and cybercrimepolice.ch separately warned (before this incident) about Ricardo-themed Twint/bank-login phishing, a
      separate campaign no source links to the breach. Takeaway: brief staff that unexpected post, calls, SMS or WhatsApp
      messages using accurate personal details are plausible pretexts. Registry: SMG is not a registered entity; proposing the
      incident key only.
      Wire-timing note: SMG release 2026-10-09 (afternoon, AWP flash 14:15), SRF the same day; the 72 h-old disclosure reached
      this fire only through borncity's lookback. No Oct 10-12 development found (no actor claim, no BACS statement).

