claims:
  - {claim_id: e9d18cc62a, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "This vulnerability is currently being targeted in the wild. ... Our telemetry shows active exploitation attempts ... first observed on October 7, 2026, at 21:47 UTC. Fixed 4.0.1 / 3.1.8.10 per Dr. Web: Die Korrektur steckt in den Versionen 3.1.8.10 und 4.0.1."}
  - {claim_id: 55ce06b82d, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Patchstack zählt rund 6.000 aktive Installationen; kostenpflichtige Erweiterung für den WordPress-Page-Builder Bricks; Anfällig sind alle Versionen bis einschließlich 3.1.8.9."}
  - {claim_id: 278466af41, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Spielen Sie Version 4.0.1 ein, in der älteren Reihe mindestens 3.1.8.10. ... deaktivieren Sie Pro Forms oder die ganze Erweiterung. ... Untersagen Sie per Serverkonfiguration die Ausführung von PHP-Dateien im Upload-Ordner."}
  - {claim_id: ee9a93e0eb, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Finden Sie Schadcode, spielen Sie eine Sicherung aus der Zeit vor dem 7. Oktober ein und ändern Sie alle Passwörter."}
  - {claim_id: 2529d661ea, verdict: ok, source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-85097", passage: "CNA Wordfence baseScore 9.8, AV:N/AC:L/PR:N/UI:N; affected lessThanOrEqual 3.1.8.9; Patchstack table: Fixed Version 3.1.8.10; vendor changelog 4.0.1 (8 October 2026). FIRST EPSS 0.003120000."}
  - {claim_id: 2c660455d2, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Bricksforge validates a file's MIME type when it is first uploaded. When a form is later submitted, however, it trusts the file metadata the client sends. In particular, it does not validate the url field inside the temporaryFileUploads parameter."}
  - {claim_id: 52c6b9d81e, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "1. Request a valid nonce from the unauthenticated bricksforge_regenerate_nonce AJAX endpoint. 2. Upload a GIF/PHP polyglot ... 3. Submit a form where the file path points to that validated image, but the url ends in a PHP extension. 4. ... places the file's contents at the PHP location."}
  - {claim_id: 08f1b3d475, verdict: ok, source_url: "https://bricksforge.io/version-changelog/", passage: "4.0.1, 8. October 2026: A security issue in the Pro Forms file upload has been fixed. It affects every site with Pro Forms active, including sites whose forms use no upload fields, so updating is strongly recommended."}
  - {claim_id: 0f2d2c64bf, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Version 3.1.8.10 nennt Patchstack als Korrektur, der öffentliche Changelog führt bisher nur 4.0.1. (changelog page read: no 3.1.8.10 section)"}
  - {claim_id: fd64e94e9d, verdict: F3, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "CVSS 3.1: 9,8, vergeben von Wordfence; Patchstack vergibt 10,0 -- the page does not say Wordfence is the CVE's assigner/CNA (true per the CVE record, which is not cited). Low confidence."}
  - {claim_id: 885d7d4527, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Patchstack zählt rund 6.000 aktive Installationen."}
  - {claim_id: 13f20c388a, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "From there, an attacker can deploy web shells, modify site content, read sensitive data, and establish persistent access."}
  - {claim_id: e06e55210e, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Im Katalog der US-Behörde CISA für aktiv ausgenutzte Lücken fehlt der Eintrag bislang. (CISA KEV catalogue 2026.10.08 read: CVE-2026-85097 absent.) See finding F14 on the adjoining 'none of the cited sources reports a confirmed compromise'."}
  - {claim_id: dcda687793, verdict: F3, source_url: "https://bricksforge.io/version-changelog/", passage: "Changelog 4.0.1 says only: It affects every site with Pro Forms active, including sites whose forms use no upload fields. The bound 'up to and including 3.1.8.9' is not on the changelog page (it comes from Patchstack/Dr. Web). Low severity adjacency."}
  - {claim_id: 307ced663b, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Bricksforge steht nicht im Plugin-Verzeichnis von wordpress.org, eine öffentliche Versionsstatistik fehlt deshalb. Plugin-Updates gehören bei Bricksforge zur Jahreslizenz. Bei ausgelaufener Lizenz kommt die Korrektur womöglich gar nicht an."}
  - {claim_id: b79e763523, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Requests to /wp-json/bricksforge/v1/form_submit that contain a temporaryFileUploads parameter. ... Calls to the bricksforge_regenerate_nonce AJAX action ... Repeated form submissions cycling through file extensions, encodings ... Unexpected PHP files in /wp-content/uploads/bricksforge/tmp/ or any other uploads directory"}
  - {claim_id: e3d687e863, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "If a site ran a vulnerable version without protection, review historical logs and the host itself for unexpected PHP files, unusual application activity, and unauthorized changes."}
  - {claim_id: a5a5973273, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Prüfen Sie unter Benutzer, ob unbekannte Admin-Konten existieren."}
  - {claim_id: ba29eeb3fe, verdict: ok, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "The key signature is the mismatch: the server-side path is an image, and the destination URL is a PHP file."}
  - {claim_id: 8eb630de75, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Aktualisieren: Spielen Sie Version 4.0.1 ein, in der älteren Reihe mindestens 3.1.8.10. Abschalten: ... deaktivieren Sie Pro Forms oder die ganze Erweiterung. PHP sperren: Untersagen Sie per Serverkonfiguration die Ausführung von PHP-Dateien im Upload-Ordner."}
  - {claim_id: d907c014ed, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Finden Sie Schadcode, spielen Sie eine Sicherung aus der Zeit vor dem 7. Oktober ein und ändern Sie alle Passwörter."}
  - {claim_id: 258f0526a2, verdict: F5, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Fact is true (It affects Bricksforge versions up to and including 3.1.8.9) but the entry sentence carries no inline citation."}
  - {claim_id: e9807b1e85, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment: closing citation of the KEV sentence; Im Katalog der US-Behörde CISA ... fehlt der Eintrag bislang."}
  - {claim_id: 100d6ea5cb, verdict: F3, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Same clause as fd64e94e9d: the Dr. Web page says 'vergeben von Wordfence' for the 9.8 score, not that Wordfence is the CVE's assigner. Low confidence."}
  - {claim_id: 24a502efff, verdict: F5, source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", passage: "Facts are on the Patchstack page (21:47:17 UTC; We recorded 63 unique source IPs; Both patterns point to automated exploitation ... do not ... attribute) but the sentence has no inline citation."}
  - {claim_id: 913edccf63, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment: Patchstack zählt rund 6.000 aktive Installationen."}
  - {claim_id: 94b6a086d2, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Ledger fragment: fehlt der Eintrag bislang (KEV)."}
  - {claim_id: 9297cd5247, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Bricksforge steht nicht im Plugin-Verzeichnis von wordpress.org, eine öffentliche Versionsstatistik fehlt deshalb. Plugin-Updates gehören bei Bricksforge zur Jahreslizenz."}
  - {claim_id: 7cb444c592, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Prüfen Sie unter Benutzer, ob unbekannte Admin-Konten existieren."}
  - {claim_id: 53fb7cad70, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Spielen Sie Version 4.0.1 ein, in der älteren Reihe mindestens 3.1.8.10. ... Untersagen Sie per Serverkonfiguration die Ausführung von PHP-Dateien im Upload-Ordner."}
  - {claim_id: c8c924030d, verdict: ok, source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", passage: "Finden Sie Schadcode, spielen Sie eine Sicherung aus der Zeit vor dem 7. Oktober ein und ändern Sie alle Passwörter."}
