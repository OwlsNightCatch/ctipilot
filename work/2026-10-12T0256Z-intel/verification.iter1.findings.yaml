  category: surface-contradiction
  section: body
  item: "2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited"
  url_or_quote: "Versions up to and including 3.1.8.9 are affected. ... update every Bricksforge site to 4.0.1, or to 3.1.8.10 on the 3.x line"
  summary: "The cited sources leave version 4.0.0 (released 2026-09-17, now the current major) unaccounted for. Patchstack, the CVE record and Dr. Web bound the flaw at <= 3.1.8.9 and name 3.1.8.10 as the 3.x fix; the vendor changelog ships the upload fix only in 4.0.1 and says it 'affects every site with Pro Forms active'; the 4.0.0 changelog says only 'Includes all hardening and fixes from the 3.x line' (3.1.8.10 post-dates it). A reader on 4.0.0 cannot tell from Exposure whether they are exposed. Add a Contradiction/uncertainty line: no source states whether 4.0.0 is affected, the vendor's fix landed in 4.0.1. The PoC script author (unreliable) writes 'Fixed in 4.0.0', a third reading."
