  item: "2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited"
  url_or_quote: "POST requests to the plugin's form-submit REST route or its admin-ajax form-submit action"
  summary: "(low confidence) The Detection line names the parameter and the nonce action but not the route and action themselves, which Patchstack gives (POST /wp-json/bricksforge/v1/form_submit; admin-ajax action bricksforge_form_submit). These are the vulnerable plugin's own endpoints, not attacker indicators, and are the first string a hunter greps. Name them. Also 95% of captured requests paired a .gif or .png server-side path with the PHP destination."
