  url_or_quote: "(absent) public exploit availability"
  summary: "A public mass-exploitation script exists: GitHub search for CVE-2026-85097 returns one repository (created 2026-10-10T04:51:32Z, description 'Bricksforge <= 3.1.8.9 Unauthenticated Arbitrary File Upload') whose contents API lists README.md and poc.py (33,478 bytes); the head of poc.py documents the nonce -> form_file_upload -> form_submit chain and a '-i targets.txt -t 20' mass mode. S1's findings noted the repository and left it uninspected. Previdian (https://previdian.com/CVE-2026-85097) and TheHackerWire tag it 'PoC available'. The entry says nothing about a public exploit; cves[].status lacks poc-public. Add one sentence (cite Previdian's page rather than the repository URL) and consider the status value. Read only, not run."
