  - claim_id: b79e763523
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** in web server and WordPress access logs, POST requests to the plugin's form-submit REST route or its admin-ajax form-submit action that carry a `temporaryFileUploads` value pairing an image path with a PHP-extension destination, preceded by a call to the nonce endpoint and repeated with changing extensions or encodings, from 2026-10-07 onward; in file-integrity and endpoint telemetry, new PHP files in the WordPress uploads tree, the plugin's temporary upload folder first, and web requests to them ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
  - claim_id: e3d687e863
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "body"
    kind: cited
    text: "Patchstack says a site that ran a vulnerable version without protection should have its historical logs and the host reviewed for unexpected PHP files, unusual application activity and unauthorized changes ("
    urls: ["https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/"]
