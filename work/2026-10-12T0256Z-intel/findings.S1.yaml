items:
  - title: "CVE-2026-85097, Bricksforge for WordPress: an unauthenticated upload-to-PHP flaw in the Pro Forms module is exploited since 7 October; fixed in 3.1.8.10 and 4.0.1"
    sources:
      - { url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", publisher: "Patchstack", date: "2026-10-08", role: "primary" }
      - { url: "https://bricksforge.io/version-changelog/", publisher: "Bricksforge (vendor changelog, 4.0.1 of 2026-10-08)", date: "2026-10-08", role: "corroborating" }
      - { url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/", publisher: "Dr. Web (drweb.de)", date: "2026-10-09", role: "corroborating" }
    discovery_trace: >
      first seen at: patchstack, feed https://patchstack.com/feed/ (item 'Critical Unauthenticated Arbitrary File Upload Vulnerability Exploited in Bricksforge Plugin', 2026-10-08T11:28Z, inside the record's 124 h lookback)
      -> primary: Patchstack article https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/ (fetched with extract)
      -> WebSearch ("Bricksforge CVE-2026-85097 exploited unauthenticated file upload WordPress") -> corroborating: Dr. Web https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/
      -> vendor: https://bricksforge.io/version-changelog/ (4.0.1). CVE record checked on the CVE Program API (state PUBLISHED, CNA Wordfence, published 2026-10-08T06:42Z, CVSS 3.1 9.8, affected <= 3.1.8.9).
      The 2026-10-11 S1 had flagged this item as outside its slice and absent from the store.
    summary: |
      Patchstack reports that Bricksforge, a paid WordPress add-on for the Bricks page builder that is sold outside the wordpress.org directory, has an unauthenticated arbitrary file upload in its Pro Forms module (CVE-2026-85097, versions up to and including 3.1.8.9). The form-submission handler checks a file's MIME type at first upload but later trusts the client-supplied temporaryFileUploads metadata, in particular its url field: an attacker obtains a nonce from the plugin's unauthenticated bricksforge_regenerate_nonce AJAX endpoint, uploads a GIF/PHP polyglot that passes the type check, then submits a form whose file path names that image and whose url ends in a PHP extension, and the plugin writes the image's content to the PHP path, where one request executes it. Patchstack states its telemetry first recorded exploitation attempts on 2026-10-07 at 21:47 UTC, from 63 distinct source addresses; all but one request used the REST route /wp-json/bricksforge/v1/form_submit and one used the admin-ajax bricksforge_form_submit action; 95 percent of captured requests named a .gif or .png server-side path; one cluster of 44 addresses sent identical payloads within seconds and three addresses tried 25 spellings of the PHP extension; some payloads aimed at files named login_admin_*.php in the regular uploads directory. Patchstack does not attribute the activity and calls it automated. The vendor's changelog of 2026-10-08 lists 4.0.1 with a Pro Forms upload fix that affects every site with Pro Forms active, even if no form has an upload field; Patchstack names 3.1.8.10 as the fixed build of the 3.x line, which the vendor changelog does not list (Dr. Web points out that updates depend on an active annual licence). CVSS is 10.0 per Patchstack and 9.8 on the Wordfence CNA record; EPSS 0.0031 on 2026-10-11 (FIRST). Patchstack counts about 6,000 active installations; it is the third serious Bricksforge flaw in five weeks (Dr. Web, citing Patchstack's history); the flaw is not in CISA's KEV catalogue (catalogue 2026.10.08 read in this run). Exploitation rests on Patchstack's telemetry alone; no second sensor owner, CERT or the vendor reports it.
    region_nexus: "global; vendor based in Saarbruecken (Germany), Dr. Web is a German-language outlet; no Swiss public-sector deployment shown"
    primary_sector_nexus: "indirect (WordPress sites of agencies, communes or institutions built with Bricks would be exposed; no source names any)"
    sector: "technology"
    cves: [CVE-2026-85097]
    techniques: [T1190, T1505.003]
    affected_products: ["Bricksforge (WordPress plugin)"]
    entity_keys: []
    new_entities:
      - { key: "product:bricksforge", type: product, name: "Bricksforge", aliases: [], summary: "Paid WordPress add-on for the Bricks page builder (forms, animations, email designer); developed in Saarbruecken, about 6,000 active installations per Patchstack; CVE-2026-85097 (Pro Forms upload) exploited from 2026-10-07 (Patchstack, 2026-10-08)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER   # exploitation: Patchstack telemetry only (Dr. Web restates it); the fix, affected range and CVE record are independently confirmed by the vendor changelog and the CVE record
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "exploited pre-auth RCE with CVSS 9.8 to 10.0, but a small paid-plugin footprint (about 6,000 sites), exploitation known from one telemetry owner, and no Swiss public-sector deployment shown; the 2026-10-11 S1 raised the same item against the FunnelKit precedent (a 40,000-store skimmer) and it was not published"
    evidence:
      - { quote: "This vulnerability is currently being targeted in the wild.", attribution: "Patchstack", source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/" }
      - { quote: "Our telemetry shows active exploitation attempts targeting Bricksforge installations", attribution: "Patchstack", source_url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/" }
      - { quote: "It affects every site with Pro Forms active, including sites whose forms use no upload fields, so updating is strongly recommended.", attribution: "Bricksforge (vendor changelog)", source_url: "https://bricksforge.io/version-changelog/" }
      - { quote: "Patchstack beobachtet seit dem 7. Oktober automatisierte Angriffe von 63 verschiedenen IP-Adressen.", attribution: "Dr. Web", source_url: "https://www.drweb.de/bricksforge-sicherheitsluecke-upload-aktiv-ausgenutzt/" }
    extended_notes: |
      Exposure: WordPress sites with Bricksforge up to and including 3.1.8.9 and the Pro Forms module active; the REST route and the admin-ajax action must be reachable from the internet (they are on any public site). Bricksforge is not in the wordpress.org directory, so no public version statistics exist and updates depend on the licence (Dr. Web).
      Detection (telemetry class first): web-server and WordPress access logs for POST requests to the form-submit REST route or the bricksforge_form_submit admin-ajax action whose temporaryFileUploads value pairs a server path ending .gif or .png with a url ending in a PHP-family extension (php, php5, php7, php8, phtml, pht, phtm, phps; mixed case; URL-encoded and double-encoded forms), dated since 2026-10-07; file-integrity or endpoint telemetry for new PHP files under wp-content/uploads, in particular the bricksforge/tmp folder and names starting login_admin; unknown administrator accounts (Dr. Web points to hidden-admin tradecraft seen in the Ninja Forms campaign). Post-patch: updating does not remove an uploaded file; if PHP files or unknown admins are found, restore from a backup older than 2026-10-07 and rotate passwords (Dr. Web).
      Triage: a legitimate form upload keeps path and url on the same image extension; Patchstack's stated signature is the mismatch between an image server-side path and a PHP destination url.
      Hardening: disable Pro Forms or the plugin until updated; deny PHP execution in wp-content/uploads (Dr. Web); Patchstack ships a mitigation rule for its customers. Patchstack's article also lists source addresses; omitted here (no IOCs).
      Dedup: CVE-2026-85097 is absent from the store CVE index; no entry mentions Bricksforge.

