      -> corroborating: CERT-FR https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1268/ (listed in the cert-fr avis-recent feed).
    summary: |
      Google's Stable channel update of 2026-10-06 moves desktop Chrome to 155.0.8059.39/.40 on Windows and Mac and 155.0.8059.39 on Linux and states that it includes 247 security fixes; counting the post's severity labels gives 4 Critical, 53 High, 122 Medium and 68 Low. The Critical entries are use-after-free flaws in Chromecast (CVE-2026-106382), the Browser process (CVE-2026-106197), Navigation (CVE-2026-106358) and Track (CVE-2026-106347); two of those reports credit Xinyang Ge (Anthropic) 'assisted by Claude'. The post carries no statement that any of the flaws is exploited in the wild, and Google says bug details may stay restricted until most users have updated. CERT-FR listed the release the next day with the risk 'not specified by the editor' and the fixed builds. FIRST EPSS is about 0.004 for CVE-2026-106197 and CVE-2026-106358 (2026-10-11). The previous fires dropped Chrome 155 for the missing exploitation signal (2026-10-10 run record); it is returned here only because the Chrome Releases record is a rotational lookback source and 247 fixes with four Critical is an unusually large batch.
