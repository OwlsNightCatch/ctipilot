  - title: "Public 'PoC available' flags on the NetScaler SAML overflow CVE-2026-107406 and the MikroTik RouterOS flaw CVE-2026-84411 rest on README-only exploit-sale repositories, not working exploit code"
    sources:
      - { url: "https://previdian.com/CVE-2026-107406", publisher: "Previdian", date: "2026-10-08", role: "primary" }
      - { url: "https://previdian.com/CVE-2026-84411", publisher: "Previdian", date: "2026-10-02", role: "corroborating" }
      - { url: "https://support.citrix.com/external/article/CTX697191/citrix-netscaler-adc-and-citrix-netscale.html", publisher: "Citrix (CTX697191)", date: "2026-10-08", role: "corroborating" }
      - { url: "https://mikrotik.com/supportsec/cve-2026-84411", publisher: "MikroTik", date: "2026-10-06", role: "corroborating" }
    discovery_trace: >
      first seen at: Previdian per-CVE page https://previdian.com/CVE-2026-107406 (fetched with extract while re-checking the covered entries' exploitation status; the page reads 'Previdian records an exploitation-related signal (poc available)')
      -> own artefact check: GitHub REST API search for each identifier via `fetch_source.py url --direct "https://api.github.com/search/repositories?q=<CVE>"` (4 repositories for CVE-2026-107406, 2 for CVE-2026-84411) and the contents API plus raw README of the candidate repositories; no code was downloaded or run
      -> vendor statements: https://support.citrix.com/external/article/CTX697191/... and https://mikrotik.com/supportsec/cve-2026-84411.
    summary: |
      Previdian's pages for CVE-2026-107406 (NetScaler SAML overflow, Citrix bulletin CTX697191 of 2026-10-08, CVSS 4.0 9.5) and CVE-2026-84411 (RouterOS web-management integer underflow, MikroTik page of 2026-10-06) tag both as 'PoC available' while recording no exploitation observation, and neither CVE is in CISA's KEV catalogue (catalogue 2026.10.08). Citrix's own blog of 2026-10-08 says it is 'not aware of any unmitigated exploits' of CVE-2026-107406. The repositories that GitHub search returns for the two identifiers were created between 2026-10-09 and 2026-10-11 and have no stars: for CVE-2026-107406 two of them hold one README of about 2 KB each, with near-identical text, that describes a SAML heap overflow and an exploit script and ends with a 'Contact / Purchase' block (a different e-mail address in each, plus a shortened-link 'Download'), a third has an unrelated description (not inspected further) and a fourth is described as a read-only checker for the earlier CTX697096 flaws (18 stars, not inspected); for CVE-2026-84411 the one repository holds a 4.8 KB README documenting a Python script the repository does not contain. The pattern is exploit-sale or malware-lure pages, which commonly follow a disclosure within hours, not a published proof of concept. Defenders and vulnerability-management tooling that escalate on 'PoC available' should treat both flags as unverified, nobody should fetch or run those repositories, and prioritisation should stay on the patch state and on exposure (NetScaler appliances configured as SAML SP or IdP; RouterOS web interface reachable from untrusted networks).
    region_nexus: "global; NetScaler and RouterOS are both internet-facing edge products in Swiss public-sector networks"
