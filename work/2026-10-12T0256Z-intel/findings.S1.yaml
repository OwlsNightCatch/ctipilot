coverage_gaps:
  - source_id: chrome-releases
    reason: "RECIPE FIX (works): `python3 tools/fetch_source.py feed https://feeds.feedburner.com/GoogleChromeReleases 25` (direct, dated, 25 items). The blogspot feed https://chromereleases.googleblog.com/feeds/posts/default answers HTTP 302 to http://feeds.feedburner.com/GoogleChromeReleases, which the tool refuses to follow. The feed's per-post links are http:// and fail every transport; rewrite to https:// and `extract` reads them (trafilatura-direct). Suggest rss_url = https://feeds.feedburner.com/GoogleChromeReleases and fetch_method rss."
  - source_id: fortinet-psirt
    reason: "RECIPE NOTE: `feed https://filestore.fortinet.com/fortiguard/rss/ir.xml 15` read direct this run (method direct, 15 items with dates), not through the reader as the 2026-10-11 note said; the item list carries advisory-creation dates only, so revisions still need the advisory page's Timeline block (`extract https://fortiguard.fortinet.com/psirt/FG-IR-26-NNN` read it directly)."
  - source_id: ccb-belgium
    reason: "RECIPE FIX (works): `python3 tools/fetch_source.py url https://ccb.belgium.be/advisories` returns the server-rendered listing with hrefs /advisories/<slug> and dd/mm/yyyy dates, and `extract <advisory URL>` reads each warning (title, 'Last update', affected versions, CVSS, vendor link) directly. WebFetch returns 403. The 2026-09-10 'no advisory list surfaced' note is obsolete."
  - source_id: cisa-advisories
    reason: "RECIPE CONFIRMED: WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories returns 10 items per page with title, date, type and href when the prompt asks for them; `cisa csaf-recent` returned 25 ICS items (newest 2026-10-08)."
  - source_id: msrc-update-guide
    reason: "RECIPE CONFIRMED: `msrc cvrf 2026-Oct` returns the whole release; each Vulnerability's Threats entry of Type 1 carries 'Publicly Disclosed:..;Exploited:..;Latest Software Release:..', which is the structured exploitation field (the CVRF also lists third-party CVEs Microsoft redistributes, so filter on that field and the 8-CVE release notes table)."
  - source_id: advisories-ncsc-nl
    reason: "no gap; the newest advisory is NCSC-2026-0412 (2026-10-09T08:15Z), nothing over the weekend."
  - source_id: extract-reader (cost note, no single record)
    reason: "COST NOTE: `extract` fell through to the jina reader (credit, one key rotated on HTTP 402) on community.citrix.com, psirt.global.sonicwall.com and source.android.com; every other page read with trafilatura-direct. Not a failure; avoid re-fetching those three hosts when the earlier read suffices."
  - source_id: github-api (technique, not a source record)
    reason: "SELF-EVOLUTION SUGGESTION: `python3 tools/fetch_source.py url --direct 'https://api.github.com/search/repositories?q=<CVE>&sort=updated'` works unauthenticated and, with the repo contents API (`/repos/<owner>/<repo>/contents`) and the raw README, separates a real public exploit (code files) from exploit-sale or lure repositories (README only, 'Contact / Purchase', shortened-link download). It is a cheap gate for any 'PoC available' claim before it raises an item's priority; Previdian's 'PoC available' tag does not distinguish them."

