      - { quote: "Previdian records an exploitation-related signal (poc available). This CVE has not been added as a known exploited vulnerability.", attribution: "Previdian", source_url: "https://previdian.com/CVE-2026-84411" }
    extended_notes: |
      Own-observation record for the main agent's re-check only; do NOT publish the repository names (attacker-adjacent): CVE-2026-107406 candidates ApexBreach/CVE-2026-107406-Poc (created 2026-10-09), ctroy999/CVE-2026-107406 (2026-10-11), techupdate24/citrix-netscaler-rce-cve-2026-107406 (2026-10-09, unrelated description); CVE-2026-84411 candidate maxprog-svg/CVE-2026-84411 (2026-10-10, contents API lists README.md only). A fourth hit, ThomasPoppelgaard/netscaler-ctx697096-checker, is described as a read-only checker for the earlier CTX697096 CVEs (18 stars); it was not inspected and is not claimed to be benign or malicious. A search for CVE-2026-102255 (SonicWall) and CVE-2026-85542 (Guardium) returned no repositories; CVE-2026-85097 (Bricksforge) returned one repository with a 33 KB poc.py created 2026-10-10 (not inspected; a working public exploit is therefore plausible for that CVE and is not claimed here). EPSS (FIRST, 2026-10-11): CVE-2026-107406 0.0047, CVE-2026-84411 0.0095.
      The two covered entries do not claim a public PoC, so nothing in them is wrong; this is context for readers who meet the 'PoC available' tag elsewhere.

