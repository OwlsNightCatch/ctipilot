  - claim_id: 068a0eaed9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "PaperCut NG and PaperCut MF (all versions) carry an unauthenticated remote-code-execution chain, CVE-2026-81578 (auth bypass, CVSS4.0 8.8) and CVE-2026-82078 (unsafe dynamic class loading, CVSS4.0 9.4), that PaperCut confirmed under active exploitation on 2026-08-27, before any CVE or patch existed. Fully tested maintenance releases 26.0.5, 25.0.13 and 24.1.10 (10 September 2026) replace the emergency patches and are the vendor's recommended build (the September bulletin, revised 2026-10-13, now names 24.1.11 for v24); servers still on Emergency Patch Release 1 or 2 need to upgrade now. There is no fix for v23 and earlier, and Huntress estimated on 28 August that 47% of the PaperCut installs it tracks ran v23 or older. GreyNoise now documents an AI-agent-orchestrated mass-exploitation campaign against this same chain, compromising at least 440 instances across 395 identified organizations since 31 August 2026, reaching full domain admin in as little as five minutes via legacy Active Directory escalation paths. watchTowr's write-up of 2026-10-09 shows the 28 August emergency build could still be taken without authentication through the Setup Wizard forms, and names CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor lists as fixed in 26.0.5, 25.0.13 and 24.1.10. Hunt.io's recovery of the attacker's open directories (2026-10-15) adds a second route to code execution through PaperCut's XML-RPC API, usable when its address allowlist is too permissive or no explicit token is set, a cron-kept reverse SOCKS tunnel, and live pivots into 45 victims, with Switzerland among the countries listed."
  - claim_id: d0b538a9d2
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Before patching or restarting an internet-facing server, preserve the server/logs directory and process tree; check server.log for the two vendor-documented error strings and for an unexplained gap or truncation, check server.log and derby.log for an in-memory Derby database booted under an attacker-chosen name, and hunt for a Windows service named \"Remote Access Service\" running SimpleService.exe (SimpleHelp) or an unexpected AnyDesk install, as PaperCut's own published incident data names both as an observed post-compromise access method."
