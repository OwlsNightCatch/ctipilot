claims:
  - claim_id: 50ba36042c
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Claroty Team82 disclosed 23 vulnerabilities (21 high) in Copeland XWEB300D/500D/500B PRO supervisory refrigeration controllers. Three chain to unauthenticated root RCE: an auth-bypass logic flaw in the Lua authentication handler, a deterministic admin-password generator derivable offline from the device's MAC address and current date, and an unauthenticated OS command injection via the libraries installation route. 18 further, authenticated-only command-injection flaws score CVSS 8.0 each, and CISA's advisory adds two low-severity unauthenticated flaws. Copeland fixed all 23 in firmware v1.13; no source read reports exploitation of these flaws, but CERT-FR's alert of 2026-10-13 now reports numerous compromises of Copeland xweb refrigeration controllers without naming models, flaws or the entry vector."
