  - claim_id: 69c0ba8ec6
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "One of the three pre-auth paths is a deterministic admin-password generator: the credential is derived via a key-derivation function from a hardcoded firmware seed identical across the product line, plus the device's MAC address and the current date — both obtainable via unauthenticated public endpoints — so once an attacker has those two values, valid admin credentials can be computed offline: \"because the seed values are identical across the product line and the variables (MAC address and date) can be obtained via unauthenticated public endpoints, an adversary can reconstruct the entire derivation chain offline\" ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: 704aec52fb
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Eighteen further CVEs (all listed above) are OS command-injection flaws across API/CGI endpoints (contacts import, firmware update, device templates, network/Wi-Fi configuration, the Modbus debug tool, the SMS service settings and others), each requiring prior authentication and each scored CVSS 8.0; Claroty documents seventeen of them and CISA's advisory adds CVE-2026-3037, injected through the MBird SMS service URL or code on the utility route ("
    urls: ["https://www.cisa.gov/news-events/ics-advisories/icsa-26-057-10"]
  - claim_id: e38708e735
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "CISA also lists two low-severity flaws reachable without authentication: an arbitrary file read (CVE-2026-22877, CVSS 3.7) and a stack-based buffer overflow in an API route that terminates the program (CVE-2026-20797, CVSS 4.3) ("
    urls: ["https://www.cisa.gov/news-events/ics-advisories/icsa-26-057-10"]
  - claim_id: ceeb5190ae
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty Team82 disclosed 23 vulnerabilities (21 rated high) in Copeland XWEB300D/500D/500B PRO supervisory refrigeration controllers (firmware ≤1.12.1), which manage field devices such as the XR60CX controller over Modbus on an RS-485 serial network in commercial refrigeration and cold-chain deployments."
  - claim_id: 92b5271664
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty built a live physical demonstration: from an internet-exposed XWEB controller, an attacker works out the connected field controller's Modbus register addresses, many of which are not publicly documented, from the XR60CX datasheet and protocol analysis, and can set the temperature shown on the XR60CX display to any value while silently disabling cooling — spoiled food, or compromised temperature-sensitive medical supplies for pharmaceutical cold-chain."
