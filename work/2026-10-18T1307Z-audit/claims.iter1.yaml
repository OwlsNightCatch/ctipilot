  - claim_id: 6677834624
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "headline"
    kind: frontmatter
    text: "Calendar-invite phishing spreads: Outlook and Gmail add the lure on their own and keep it after the email is deleted"
  - claim_id: 02a604f7ed
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "summary"
    kind: frontmatter
    text: "Netcraft reports that phishing lures delivered as ICS calendar files, adopted by widespread campaigns of the EvilTokens Microsoft 365 token-stealing kit, are now spreading to low-effort scams. Outlook with Exchange Online (desktop, web and mobile) and Gmail with Google Calendar add such an invite to the calendar automatically as tentative and keep it after the email is deleted, so purging the message leaves the lure in place. EvilTokens invites posed as meetings, alerts or voicemail and led to a device-code page that has the victim authorise an attacker's device through OAuth; Sublime Security, quoted by The Guardian, reports exponential growth in calendar phishing."
  - claim_id: a6ec8dfaef
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "Netcraft reports that attackers send phishing lures as ICS calendar files because the \"text/calendar\" type is treated as low risk by major email clients, and that the mail client's normal invite handling then places the lure in the victim's calendar with no user interaction, often keeping it there after the original email is deleted ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: 034881fff3
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "In Netcraft's client table, Outlook desktop, Outlook on the web and Outlook Mobile with Exchange Online and Gmail with Google Calendar add the event automatically, mark it tentative and keep it after the email is deleted, Apple Calendar connected to Exchange Online often does the same, and Apple Mail with iCloud does not add it ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: eaa7f75f31
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "Campaigns using the EvilTokens toolkit, which steals Microsoft 365 tokens, used ICS invites disguised as meetings, alerts or voicemail notifications; the link leads to a page that gives the user a device code and tells them to enter it on Microsoft's device authorization page, which grants an attacker's device access to the account through OAuth ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: 2d7e32d55e
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "Netcraft now also sees smaller scams carrying ordinary phishing content inside ICS files ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: 286de49387
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "Sublime Security reports \"exponential growth\" in calendar phishing, with lures such as voicemail notices, payment receipts and renewal warnings that link to fake Microsoft, Google or PayPal logins or give a phone number, and Cofense says some senders use legitimate platforms such as Zoom to send the invitations, so filtering those platforms would also block real meetings ("
    urls: ["https://www.theguardian.com/money/2026/oct/11/calendar-phishing-scam-meeting-renewal-google-microsoft-paypal"]
  - claim_id: d1857cd187
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "**Exposure:** users of Outlook with Exchange Online and of Gmail with Google Calendar, whose clients add external invites to the calendar on their own ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: 79f77fb61b
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "**Detection:** Netcraft names no telemetry; from the delivery path it describes, the traces are inbound external messages carrying a calendar part or ICS attachment in mail-flow logs, tentative events from external organizers the user never accepted in calendar audit logs, and, for the EvilTokens variant, a device-code sign-in to the account shortly after such an event ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: 488f4fc5e3
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "When responding to a reported phish of this kind, remove the calendar entry as well as the email, because the entry persists after the email is deleted ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
  - claim_id: d0a5a20f08
    entry: 2026-10-19/ics-calendar-invite-phishing-auto-added-outlook-gmail
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat email-attached invites as part of the phishing attack surface: review whether the mail client settings add invites from outside the organization automatically for staff who do not expect them, and extend phishing guidance and purge procedures to calendar entries for those who do ("
    urls: ["https://www.netcraft.com/blog/how-attackers-get-into-your-calendar-the-easy-way"]
