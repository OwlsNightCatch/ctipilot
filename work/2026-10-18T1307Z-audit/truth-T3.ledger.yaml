    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** install the October cumulative update now, ahead of the monthly cycle, on endpoints that open mail and web downloads first; because the tag is the control that failed, attachment blocking and mail-gateway detonation remain the compensating layer until the update is deployed, and Rapid7 reports no patch for Windows Server 2012."
  - claim_id: de239e471f
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "headline"
    kind: frontmatter
    text: "Exchange October updates fix an unauthenticated email-borne RCE; 2016 and 2019 get their last update, and only with ESU"
  - claim_id: 65c42bb728
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's 2026-10-13 Exchange security updates fix CVE-2026-70571, a stack-based buffer overflow that an unauthenticated attacker can trigger with a crafted email (Critical, CVSS 8.1 with high attack complexity, Exploitation More Likely, not exploited), and CVE-2026-70279, a 9.3 cross-site scripting flaw that lets an attacker act as an administrator who clicks a crafted link. October is the last month Exchange 2016 and 2019 customers enrolled in the Period 2 ESU receive newly released updates, and organisations without ESU have no 2016 or 2019 update at all. Microsoft's Exchange Team says the October Windows Server updates (KB5126646, KB5126655, KB5126651, KB5126868) can make Exchange servers unstable, with OWA failures, growing mail queues and lost DAG quorum, whether or not the Exchange update is installed; it advises against uninstalling them and on 2026-10-17 gave a registry workaround."
  - claim_id: 995dce7823
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the October 2026 Exchange security update on every Exchange server and on every machine that has the Exchange Management Tools; on Exchange 2016 and 2019 servers that are not covered by the Period 2 ESU, decide now between enrolling (it only gets an organisation current through this release) and moving to Exchange Subscription Edition, because after October Microsoft ships updates for Subscription Edition only."
  - claim_id: 66dbe21eb8
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Exchange server that has the October 2026 Windows Server update installed, do not uninstall it; where OWA fails with MapiExceptionMdbOffline, mail queues grow or a DAG member cannot reach quorum, set the registry value EpmapSavedContextCap (REG_DWORD) under HKLM\\\\SOFTWARE\\\\Microsoft\\\\Rpc to 65536, reboot, and raise the limit if the failure recurs."
