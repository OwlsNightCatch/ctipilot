    surface: "summary"
    kind: frontmatter
    text: "Google's GTIG and ManageEngine's METAL report that a cluster tracked as UNC7017 altered two configuration files on AOMEI's update servers for five to ten minutes at a time between April and July 2026, so any Backupper or AnyViewer client that polled during a window downloaded and ran the CROSSROAD downloader, which installed the SHINYROAD backdoor beside a signed Radmin binary. No software flaw is involved, GTIG names Switzerland among 11 victim countries, and the vendor's server-side repair does not clean a host that already ran the downloader, so installations need an endpoint hunt covering April to July 2026."
