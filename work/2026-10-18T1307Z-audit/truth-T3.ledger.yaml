  - claim_id: 649c4c4f05
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: cited
    text: "ColdFusion 2025 up to 2025.0.13 and 2023 up to 2023.0.25 are affected and 2025.0.14 and 2023.0.26 fix them; the bulletin lists five network flaws that need no privileges at CVSS 9.0 or above: an unrestricted file upload leading to arbitrary code execution (CVE-2026-105899, 10.0), a server-side request forgery rated privilege escalation (CVE-2026-106622, 10.0), an input-validation flaw leading to code execution (CVE-2026-106624, 9.8), a code injection rated privilege escalation (CVE-2026-106621, 9.1) and a further input-validation code-execution flaw (CVE-2026-106619, 9.0, high complexity), besides code-execution flaws that need a low-privileged account at 9.9 ("
    urls: ["https://www.adobe.com/trust/security/products/coldfusion/apsb26-144"]
  - claim_id: 3be29debd3
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: cited
    text: "Experience Manager APSB26-152 covers Cloud Service 2026.9.28187 and earlier, 6.5 up to Service Pack 25 and 6.5 LTS up to Service Pack 3: three incorrect-authorization flaws that lead to arbitrary code execution are scored 10.0 with no privileges required (CVE-2026-90532, CVE-2026-48383, CVE-2026-48382), fixed by Cloud Service 2026.9.28386 and, on 6.5 and 6.5 LTS, by per-issue hotfixes, and Adobe is not aware of exploits of these either ("
    urls: ["https://www.adobe.com/trust/security/products/experience-manager/apsb26-152"]
  - claim_id: 3f17464d94
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: cited
    text: "Commerce and Magento APSB26-153 fixes a template-engine injection leading to code execution (CVE-2026-103849, 10.0, which Adobe marks as needing no authentication) and an incorrect-authorization code-execution flaw (CVE-2026-92909, 9.8, which Adobe's note tags B2B) in builds up to the 2026-sep release; the fixes are the 2026-oct builds, Adobe Commerce B2B has its own 2026-oct builds, Magento Open Source gets them for 2.4.9, 2.4.8 and 2.4.7, and Adobe asks customers to apply the CVE-2026-75650 hotfix from its September APSB26-146 update as well, and Adobe is likewise not aware of exploits ("
    urls: ["https://www.adobe.com/trust/security/products/commerce/apsb26-153"]
  - claim_id: 159f485acd
