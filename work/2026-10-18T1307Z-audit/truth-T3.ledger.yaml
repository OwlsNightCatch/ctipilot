claims:
  - claim_id: e9d18cc62a
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "headline"
    kind: frontmatter
    text: "Bricksforge's Pro Forms upload flaw is exploited without login since 7 October; fixed in 4.0.1 and 3.1.8.10"
  - claim_id: 0b2f82434d
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "summary"
    kind: frontmatter
    text: "Patchstack reports that CVE-2026-85097, an unauthenticated arbitrary file upload in the Pro Forms module of Bricksforge, a paid WordPress add-on for the Bricks page builder, has been targeted in the wild since 2026-10-07: it lets an attacker with no account get a PHP file written to the uploads directory and executed, on versions up to and including 3.1.8.9 with Pro Forms active (about 6,000 active installations). Bricksforge's changelog of 2026-10-08 lists the fix in 4.0.1 and Patchstack names 3.1.8.10 for the 3.x line; the exploitation report rests on Patchstack's telemetry."
  - claim_id: 790a20db9a
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every WordPress site that your organisation, its web agencies or its hosting suppliers run with Bricksforge and update it to version 4.0.1 (3.1.8.10 on the 3.x line) now, treating any site that was reachable and unpatched since 2026-10-07 as one to search for dropped PHP files."
  - claim_id: 13e1ab47fb
    entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
    surface: "cves[CVE-2026-85097]"
