    surface: "section 2026-10-16T04:10:00Z"
    kind: cited
    text: "Its list of secrets to treat as compromised is wider than a password reset: the LDAP and Active Directory secrets, every certificate on the appliance (machine, user-authentication, code-signing and the TLS certificate of the exposed interface), the administration password, stored API keys, the passwords of local accounts including the service accounts used for authentication servers, the Kerberos tickets and other authentication material of those service accounts, and the licence-server authentication ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-013/"]
  - claim_id: 79cba9fd22
