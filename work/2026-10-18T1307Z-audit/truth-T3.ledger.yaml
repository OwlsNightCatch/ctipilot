    surface: "cves[CVE-2026-97229]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-97229\", \"cvss\": \"10.0 (CVSS 3.1)\", \"status\": [\"patch-available\", \"poc-public\"], \"affected\": \"self-managed GitLab CE/EE: 19.2 before 19.2.8, 19.3 before 19.3.5, 19.4 before 19.4.2; GitLab rates it as needing no privileges, while the path Rapid7 demonstrated needs push access to a public project\", \"fixed\": \"19.2.8; 19.3.5; 19.4.2\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
