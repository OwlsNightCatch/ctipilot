    text: "); then search for dropped PHP files and the request pattern back to at least early September 2026, and on a hit rotate whatever the web server account can read ("
    urls: ["https://github.com/CollaboraOnline/richdocumentscode/issues/354"]
  - claim_id: 3af59f4689
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "headline"
    kind: frontmatter
    text: "Huntress: a lookalike VPN-client site harvests credentials, then hands over the real signed installer"
  - claim_id: d63a8b5ef9
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a lookalike WatchGuard VPN download site, reached on 2026-10-07 by an administrator at a managed service provider through a Bing search result, that asks for the SSL VPN server, login and password, rejects the first submission so the victim types again, and only then downloads the genuine, validly signed WatchGuard installer from WatchGuard's own CDN. No malware is delivered, so endpoint controls have no file to flag, and few reputation engines flagged the domains."
  - claim_id: cf864b47ad
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Huntress's SOC investigated an incident on 2026-10-07 in which an administrator at a managed service provider searched Bing for a WatchGuard VPN download with a typo in the query and clicked through the standard Bing result redirect to a lookalike site titled \"WatchGuard Firebox VPN Client\", which Huntress classes as search-engine poisoning rather than malvertising ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: acc3129f81
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Choosing any download option opens a pop-up asking for Server, Login and Password; one unobfuscated JavaScript file of about 150 lines posts the typed values as JSON to a separate collector domain, tagged as the first or second attempt, and always rejects the first submission with an \"incorrect data\" message so that the victim types again or tries a second set of credentials ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: e0151a8036
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Only after the second submission does the page fetch the real WatchGuard Mobile VPN with SSL installer from WatchGuard's own CDN, an Authenticode-signed file whose digest Huntress recomputed and found unmodified, so there is no trojanized installer or malicious DLL for endpoint defenses to flag ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 5400528fb4
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "The victim's browser history showed no download in the observed window, so Huntress judges the user probably did not finish both rounds but may have typed credentials in the first, and Managed Defender flagged the incident 21 seconds after the lookalike domain loaded ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 59b7aa1512
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Both domains were registered within the previous two months, few reputation engines flagged either as of 2026-10-08, and the lure domain was offline by 2026-10-13 ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: cb86631a86
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "Huntress places the iteration in a campaign that WatchGuard's Secplicity team described in January 2026 as lookalike download sites for WatchGuard, F5, Fortinet, SonicWall and Sophos clients, and that Microsoft tied in March 2026 to a financially motivated actor it tracks as Storm-2561; the new element is that the fake client is gone from the middle ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 47c76f05fc
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Exposure:** administrators and users who find an SSL VPN client through a web search, as an administrator at a managed service provider did here; the lure here impersonates WatchGuard, and Huntress describes the same campaign against clients of five vendors ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 1dd3e8f3a3
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Detection:** no malicious file or process reaches the endpoint, so the signal is in web proxy and DNS telemetry (a visit that arrives from a search-result redirect to a domain that is not the vendor's, followed by a JSON POST to a second, recently registered domain; Huntress's Managed Defender did flag the browsing activity) and in VPN gateway authentication logs; Huntress advises watching for SSL VPN logins from hosting providers, unfamiliar ASNs and countries where the account has never connected ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 3d9c9e6fec
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** if a user typed VPN credentials into a page found through search, reset every affected account and treat the VPN endpoint those credentials belong to as known to the attacker; enforce multi-factor authentication on the VPN, and publish and bookmark the official client download links in internal documentation so staff do not search for them ("
    urls: ["https://www.huntress.com/blog/fake-watchguard-vpn-credential-phishing"]
  - claim_id: 4cb1b1d53c
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: derived
    text: "The credentials of any VPN account typed into such a page, and the gateway address with them, are in the attacker's hands."
  - claim_id: 48a251d2f4
    entry: 2026-10-15/fake-watchguard-vpn-client-site-credential-capture
    surface: "body"
    kind: derived
    text: "**Triage:** a genuine VPN client also asks for server, login and password, but only inside the installed client at connect time; a browser form that collects the three values before any installer has run, on a domain that is not the vendor's, is the signal."
  - claim_id: 66d14700b2
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "headline"
    kind: frontmatter
    text: "BeyondTrust patches an exploited Remote Support zero-day; the actor's persistence survives reboot and reset"
  - claim_id: d359d0f6ee
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "summary"
    kind: frontmatter
    text: "BeyondTrust's advisory BT26-05 of 2026-10-15 fixes CVE-2026-102764, an improper origin validation in an internal messaging component of Remote Support that lets a remote attacker perform file operations on the appliance without authenticating; all versions up to 26.2.3 are affected. Google's Threat Intelligence Group found ARMORY CASTLE, a suspected PRC-nexus espionage actor formerly tracked as UNC5221, exploiting it as a zero-day in late August 2026, leaving a web shell, a root-SUID shell and a sudoers entry that survive reboot and configuration reset, so a patched appliance that was exposed still needs a compromise check, and a rebuild where its status is confirmed or unknown."
  - claim_id: d840e31042
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch BeyondTrust Remote Support now, review every appliance exposed since late August and rebuild any with confirmed or unknown compromise status: BeyondTrust and Google's Threat Intelligence Group confirm that an unauthenticated flaw in Remote Support (all versions up to 26.2.3) was exploited as a zero-day from late August 2026, GTIG attributing it to a suspected China-nexus espionage actor, and GTIG warns organizations to prepare for widespread exploitation now that the flaw is public. Apply the BT26-05-RS patch to every self-hosted appliance (builds older than 24.3.1 must be upgraded first). The actor's persistence survives reboot and configuration reset and it deletes on-appliance logs, so snapshot and collect off-box logs from any appliance that was internet-reachable on an affected build, then redeploy from a clean patched image any whose compromise status is confirmed or unknown and rotate everything it held."
  - claim_id: 728cafa9a2
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the BT26-05-RS patch to every self-hosted BeyondTrust Remote Support appliance now and confirm in the /appliance interface that it is installed (a build older than 24.3.1 must be upgraded first, which closes the hole but does not undo earlier exposure); apply it to self-hosted Privileged Remote Access appliances too, which BeyondTrust patched as a precaution."
  - claim_id: a8bcae3088
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "actions[1]"
    kind: frontmatter
    text: "For every appliance that was internet-reachable on a build up to 26.2.3 at any time since late August 2026: before any change, snapshot a virtual appliance with memory and export its disk, and collect the off-box syslog, reverse-proxy or WAF and perimeter firewall logs because the actor deletes on-appliance logs; then redeploy from a clean, fully patched image every appliance whose compromise status is confirmed or unknown, and rotate the credentials it held in dependency order, including the Remote Support Vault and any credential typed into a support session."
