    surface: "section 2026-10-16T04:10:00Z"
    kind: cited
    text: "CERT-FR adds that running Ivanti's external Integrity Checker Tool needs physical access to the appliance and can interrupt service, and that some threats survive a factory reset ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-013/"]
  - claim_id: dd49634026
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "section 2026-10-16T04:10:00Z"
    kind: cited
    text: "Its affected-systems list names the 22.8Rx builds before 22.8R2.5, the 25.1.1.x builds before 25.1.1.2 and the 25.1.3.x builds before 25.1.3.1 and does not list a 25.1.2.x line; by counting 25.1.3.x builds before 25.1.3.1 as affected it includes 25.1.3.0, a build that Rapid7's table lists as resolved ("
