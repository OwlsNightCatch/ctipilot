    text: "Rank Math says some copies of its WordPress plugin Rank Math PRO 3.0.123, downloaded or updated between 2026-10-15 20:02 UTC and 2026-10-16 07:12 UTC, contained malware that could compromise a site once the plugin is activated, and it released 3.0.124 as the clean build. The malware can recreate a hidden backdoor on page visits and may leave administrator accounts, scheduled tasks and files outside the plugin, so an affected site needs the plugin folder and persistence removed in a set order, a restore or cleanup, and rotation of every credential the site could reach; how the vendor's distribution was compromised and who is behind it are not disclosed."
