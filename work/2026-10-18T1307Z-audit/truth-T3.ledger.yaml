    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "It names no victim or country and does not say how the web shells were first placed; the recovered tools include a custom Go scanner for CVE-2025-55182 (React2Shell) ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 4fe190693a
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "The scripts carry conversational, step-by-step comments in the style of an AI model, which Unit 42 reads as LLM-generated code or an AI agent's work, an inference rather than a confirmed finding ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 5dd88ebdd4
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "On the hosts, the attackers ran PHP web shells under the php-fpm parent process and rewrote auto_prepend_file in every PHP configuration under /etc/php/ and /opt/plesk/php/, so a planted file runs first ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 9be99b79f7
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "They replaced a .bashrc with a copy that, in one instance, aliases sudo to a fake password prompt that logs the input, searched configuration and history files for credentials, escalated with LinPEAS and the public PwnKit exploit (CVE-2021-4034), left root-SUID shells under hidden names and injected an SSH key into authorized_keys ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: a08a2fdb80
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "They moved laterally with sshpass and hard-coded credentials and through an MSSQL double hop using xp_cmdshell, and kept access with SysGoRAT, a Go trojan that takes commands over WebSocket, plus the revsocks and pysoxy proxies and GSocket's gs-netcat, which ran from /dev/shm under a fake kernel-thread process name ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 2d5aebc570
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "On government mail servers they enumerated /var/qmail/mailnames/, counted mails in Maildir folders to pick targets and searched mail headers for social-media messages; they tried to exfiltrate database dumps over netcat and to public file-hosting platforms, to delete authentication, history, mail and system logs and to kill endpoint security processes, timestomped scripts with touch -t, and planted a red-team marker string and a pentest-style password to pass as an authorised exercise ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: b6690a4819
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "**Exposure:** Linux web and mail hosting estates of government or state-affiliated bodies, in particular Plesk-managed PHP stacks and their /var/qmail/mailnames/ mail directories, which the attackers enumerated and searched; the report does not say how the attackers got in ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: ae5bc16b7b
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Detection:** from the described behaviour: file-integrity monitoring on PHP configuration directories for any auto_prepend_file that points outside the application tree; shells or interpreters spawned by php-fpm or web server workers; writes to shell startup files, authorized_keys and any new sudo alias; PHP or web-server access to the mail store; new systemd units, five-minute cron entries and hidden-name SUID-root binaries; outbound WebSocket, GSocket or file-hosting connections from servers; touch -t changes, bursts of deleted history and mail logs, and pkill sequences that name EDR agents."
  - claim_id: 4605e29058
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Triage:** Plesk or PHP hardening can legitimately set auto_prepend_file and administrators do define sudo aliases; the report supports these discriminators: a prepended file with a vendor-like name outside the application tree, an alias that prompts for and logs the password, a log file named after another product, and red-team marker strings that no change record explains."
  - claim_id: 47dc15c1d7
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** audit every PHP configuration for auto_prepend_file, privileged accounts' startup files for a sudo alias and authorized_keys for unknown keys, and the file system for root-SUID binaries under hidden names; ship authentication, mail and web logs off-host so local log cleanup cannot erase them; patch PwnKit and keep Linux EDR self-protection alerting."
