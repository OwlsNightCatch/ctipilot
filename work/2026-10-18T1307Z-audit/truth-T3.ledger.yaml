    surface: "body"
    kind: derived
    text: "**Triage:** ordinary CI jobs run shells under the runners; only a shell spawned by the GitLab application server processes themselves matches this flaw, not one started inside a runner job; an anonymous CI lint request is ordinary on its own, and the signal is one aimed at a project that a newly created or little-used account has just pushed a CI configuration to."
