    text: "Microsoft says that installing the October 2026 Exchange updates is not required for the issues to occur, and that it is investigating with its Windows partners; the notice names no workaround or fix ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/released-october-2026-exchange-server-security-updates/4563014"]
  - claim_id: 1b9eca9a6a
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "section 2026-10-17T03:36:30Z"
    kind: cited
    text: "Since 2026-10-13 it has seen reports of OWA failing with MapiExceptionMdbOffline (hr=0x80004005, ec=1142; event ID 1006 in the Application log), mail queues growing during the day, DAG members unable to reach quorum and a reboot helping only temporarily; Exchange 2016, 2019 and Subscription Edition can all be affected ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382"]
  - claim_id: 96c2a2e7d9
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "section 2026-10-17T03:36:30Z"
    kind: cited
    text: "It says the issues are not related to installing the October 2026 Exchange security updates and that any Exchange version running on an affected Windows build can be hit; KB5126646 (Windows Server 2025), KB5126655 (2022), KB5126651 (2019) and KB5126868 (2016) can cause the failures after some time, and the impact varies with Exchange load, so some servers may never see a problem ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382"]
  - claim_id: adfbae2bf0
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "section 2026-10-17T03:36:30Z"
    kind: cited
    text: "Microsoft's recommendation is not to uninstall the October 2026 Windows Server updates and, from an elevated command prompt on the Exchange server, to set the registry value EpmapSavedContextCap (REG_DWORD) under `HKLM\\SOFTWARE\\Microsoft\\Rpc` to 65536, reboot, monitor, and raise the limit if the problem recurs; it says this has solved the customer cases it has assisted ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382"]
  - claim_id: 09ad2cabb9
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "section 2026-10-17T03:36:30Z"
    kind: uncited
    text: "Microsoft's Exchange Team has published guidance for Exchange servers that become unstable after the October 2026 Windows Server updates."
  - claim_id: b2e2044631
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "record 2026-10-16T04:10:30Z"
    kind: record-summary
    text: "Microsoft's Exchange Team added a notice on 2026-10-15 that installing the October 2026 Windows Server updates (KB5126646, KB5126655, KB5126651, KB5126868) can make Exchange OWA fail with MapiExceptionMdbOffline and mail queues grow, that installing the Exchange update is not required for the failure, and that it is investigating with its Windows partners."
  - claim_id: 855832e2e3
    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "record 2026-10-17T03:36:30Z"
    kind: record-summary
    text: "Microsoft's Exchange Team now gives a workaround for the instability that the October 2026 Windows Server updates can cause on Exchange servers: it advises against uninstalling them and says setting the registry value EpmapSavedContextCap to 65536 and rebooting has solved the cases it assisted. It adds that DAG members losing quorum are among the reported symptoms and that the Exchange security updates are not the cause."
  - claim_id: a5f047c87d
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "headline"
    kind: frontmatter
    text: "Adobe fixes unauthenticated CVSS 10.0 flaws in ColdFusion, Experience Manager and Commerce; no exploitation known"
  - claim_id: 7e437576ad
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "summary"
    kind: frontmatter
    text: "Adobe's 2026-10-13 bulletins fix five unauthenticated network flaws at CVSS 9.0 to 10.0 in ColdFusion 2025 and 2023 (fixed in 2025.0.14 and 2023.0.26), three unauthenticated CVSS 10.0 code-execution flaws in Experience Manager (Cloud Service 2026.9.28386 or per-issue hotfixes) and two code-execution flaws (CVSS 10.0 and 9.8) in Adobe Commerce and Magento Open Source (2026-oct builds). Adobe says it knows of no exploitation of any of them; each needs no account, so exposure rather than exploitation status decides the order. Sansec reproduced four code-execution routes for the Commerce flaw CVE-2026-103849 within 24 hours of the fix, sees no exploitation yet, and warns that a Composer install keeps the vulnerable base version until the 2026-oct release or Adobe's isolated patch is applied."
  - claim_id: 9585426940
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every internet-facing ColdFusion server to 2025.0.14 or 2023.0.26, every AEM instance to Cloud Service 2026.9.28386 or the per-issue hotfixes for 6.5 Service Pack 25 and 6.5 LTS Service Pack 3, and Adobe Commerce and Magento Open Source to the 2026-oct build of the installed 2.4.x line (together with the CVE-2026-75650 hotfix from the September APSB26-146 update where it is missing); on a Composer-installed Commerce or Magento store apply the 2026-oct release or Adobe's isolated patch explicitly, because the base version stays vulnerable; Magento Open Source 2.4.6 has no listed fix."
