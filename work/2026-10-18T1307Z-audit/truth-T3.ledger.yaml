    surface: "body"
    kind: cited
    text: "A Composer-installed Commerce or Magento store needs the 2026-oct release or Adobe's isolated patch applied explicitly ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: 08bc408349
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: uncited
    text: "Adobe's 2026-10-13 bulletins put critical fixes into three server products: ColdFusion, Experience Manager and Commerce."
  - claim_id: bf6903ee45
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: derived
    text: "**Exposure:** ColdFusion 2025 and 2023, Experience Manager Cloud Service, 6.5 and 6.5 LTS, and Adobe Commerce or Magento Open Source 2.4.x that untrusted networks can reach; none of the flaws named by CVE id above needs an account."
  - claim_id: 6560b11c1f
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: derived
    text: "**Detection:** Adobe publishes no exploit behavior."
  - claim_id: 619f204c26
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: derived
    text: "As an inference from the flaw classes: after unexpected requests to upload or administrative endpoints, look for new script files in web-accessible directories (the upload flaw), and for outbound requests from the application server to internal addresses (the request forgery)."
  - claim_id: d3aa84df6d
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update internet-facing ColdFusion, Experience Manager and Commerce or Magento instances first, because the flaws need no login and the order is set by exposure; Adobe reports no exploitation as of 2026-10-13."
  - claim_id: 370927ac26
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "section 2026-10-16T04:13:30Z"
    kind: cited
    text: "Sansec reports that it reproduced four different attack routes to code execution for the Commerce and Magento template-engine flaw CVE-2026-103849 within 24 hours of Adobe's fix and expects threat actors to do the same, and that it has not seen attacks on live stores ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: 923d5ce5f9
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "section 2026-10-16T04:13:30Z"
    kind: cited
    text: "It describes the flaw as a second-pass directive injection like September's StyleSmuggler, where attacker-controlled data in a child template can still be signed and re-scanned at the root level so that a smuggled block directive runs inside Magento's rendering, and says Adobe's October patch replaces that generic re-scan with registered placeholders ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: 2790674bfb
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "section 2026-10-16T04:13:30Z"
    kind: cited
    text: "Sansec questions Adobe's priority 2 rating for the Commerce bulletin, a 30-day patch window, because StyleSmuggler went from a priority 1 hotfix to mass exploitation in three days and it judges BlockStrap to be of similar complexity ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: 42bc87efb8
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "section 2026-10-16T04:13:30Z"
    kind: cited
    text: "Two cautions for the patch: a plain Composer install still has the vulnerable base version, so the 2026-oct release or Adobe's isolated patch must be applied, and BlockStrap and StyleSmuggler are separate fixes, so the September hotfix for CVE-2026-75650 has to stay in place as well ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: c092891fc7
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "section 2026-10-16T04:13:30Z"
    kind: cited
    text: "Sansec lists Adobe Commerce up to 2.4.9, Adobe Commerce B2B up to 1.5.3 and Magento Open Source up to 2.4.9 as affected ("
    urls: ["https://sansec.io/research/blockstrap-magento-rce"]
  - claim_id: 17f182ff92
    entry: 2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical
    surface: "record 2026-10-16T04:13:30Z"
    kind: record-summary
    text: "Sansec reproduced four code-execution routes for the Commerce and Magento flaw CVE-2026-103849 within 24 hours of Adobe's fix and expects attackers to do the same, though it has seen no attacks on live stores; it says a plain Composer install keeps the vulnerable base version until the 2026-oct release or Adobe's isolated patch is applied, and that the September StyleSmuggler hotfix must stay in place because the two fixes are separate."
  - claim_id: 11e0ba3e6a
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "headline"
    kind: frontmatter
    text: "German portal vendor reports an exploited zero-day and calls it AI-driven; police neither confirm nor deny that"
  - claim_id: ba908dce98
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "summary"
    kind: frontmatter
    text: "Innocon, the Tangermünde developer of the \"digitales Rathaus\" citizen portal, said in an MDR report of 2026-10-13 that attackers found and exploited a vulnerability it did not know of in its software, run for Tangerhütte on systems of the state municipal IT provider KID; the portal was taken offline in September and four more communes pulled theirs as a precaution. Innocon says the attackers reached only test accounts and took no real data, and classifies the intrusion as AI-driven because of command speed and on-host tool development, which is the vendor's reading: the state criminal police can neither confirm nor deny it. No CVE, product version or fix is named."
  - claim_id: 9b2b64fbea
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "MDR AKTUELL reports on 2026-10-13 that the vendor of Tangerhütte's \"digitales Rathaus\" citizen portal says attackers found and exploited a vulnerability in its software that the vendor did not know of and for which no security update existed ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: f2105bb010
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The portal, an app-based service that went online in 2020, was taken offline in September, and MDR Sachsen-Anhalt reported on 2026-09-16 that the municipality said it had repelled an attack and gave no technical detail ("
    urls: ["https://www.mdr.de/nachrichten/sachsen-anhalt/stendal/stendal/digitales-rathaus-cyber-sicherheit-hacker-,tangerhuette-it-angriff-100.html"]
  - claim_id: 5d1c66cd58
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The software runs on systems that the state municipal IT provider KID operates for Tangerhütte; an IT employee noticed irregularities in the morning after the attack began at night, the server was isolated and cut from the internet, and the vendor analysed the secured logs on an offline notebook ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 1f98d3be0c
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "Innocon told other affected communes, four of which also took their portals offline as a precaution although there was no sign of an attack on them, and says the attackers reached only test accounts and took no real data ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 9c02235d3f
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "Citizens could use the services only on paper for weeks ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: fd8cc60ae5
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The vendor classifies the intrusion as AI-driven for two reasons: commands were executed faster than copy-and-paste would allow, and the follow-on steps were not prepared in advance but developed on the city's server during the attack, whereas human attackers normally upload their own code and do not change it ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 361e57d49d
