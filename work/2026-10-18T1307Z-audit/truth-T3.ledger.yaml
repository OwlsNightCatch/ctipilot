    surface: "body"
    kind: derived
    text: "**Detection:** Microsoft, CISA and Rapid7 name no actor, payload or victims and no source describes the exploit's behavior, so this is a hunt hypothesis that follows from the mechanism: the failed control is the Mark of the Web tag, so there is no warning dialog for a user to report."
