    text: "The unfixed root-escalation step of the chain now has its own identifier, CVE-2026-111357, published 2026-10-15, and the Canadian Cyber Centre says open-source reporting indicates it is exploited in the wild; its description names only 22.8R2.4 as affected, says the step was exploited in the wild in October 2026 and states no fixed build, so scanners, SIEM enrichment and tickets can now follow the step by ID."
