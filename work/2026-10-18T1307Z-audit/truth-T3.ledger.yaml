    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "headline"
    kind: frontmatter
    text: "Citizen Lab: spyware delivery through targeted ads, with defence and government networks among the impressions"
  - claim_id: 3fbf274fdf
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "summary"
    kind: frontmatter
    text: "Citizen Lab and Confiant report that Discover-Tech, an ad-tech firm, serves targeted ads whose code decides per device whether to return JavaScript, and that for chosen devices the chain hands off to servers Citizen Lab links with high confidence to Candiru spyware; at least 45 devices at Al Jazeera were targeted in 2024 and 2025. Citizen Lab's bidding data shows Discover-Tech ads on networks of defence ministries, armed forces, national cyber agencies and NATO, though an impression alone does not prove infection, and neither report mentions Switzerland."
  - claim_id: febfdcb400
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "Citizen Lab reports that in 2024 and 2025 at least 45 devices at the news network Al Jazeera were targeted in zero-click attacks that it links with high confidence to Candiru spyware delivered through ads bought by Discover-Tech, an Israeli firm that presents itself as an ad company ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: c9e355747b
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "An ad carries a script tag that calls Discover-Tech's ad-decision server with the user's cookie or mobile advertising identifier; the server decides, apparently from the source address and the identifiers, whether the device is eligible, and returns JavaScript only if so and a zero-byte response otherwise, which keeps malicious code and pointers to it out of what ad vendors can inspect ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: d757adb702
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "In Al Jazeera's network logs an infected device first contacted Discover-Tech infrastructure, which indicates an ad impression, then a Candiru validator server that checks the device, and finally a Candiru command-and-control server; a Windows implant that Al Jazeera isolated from a compromised device and Citizen Lab analysed persists through COM hijacking ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: 1e5236fc42
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "Confiant, working from ad-delivery telemetry from April to September 2026, describes a cloaked payload that fingerprints the device and opens an encrypted channel, and found a hand-off to Candiru-attributed infrastructure, with Belgium by far the most targeted country at 56 percent of the global hits in the period; it has not captured a full exploit chain ("
    urls: ["https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming"]
  - claim_id: a6120c0131
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "Citizen Lab's analysis of four billion Discover-Tech bidding records shows ads on almost 200,000 websites and apps in four months, including on devices in networks of defence ministries, armed forces, national cyber agencies and intergovernmental organizations such as NATO; an impression alone does not prove targeting or infection ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: d3678e78eb
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "Google, IAB Europe, Beeswax, Vungle (Liftoff) and Eskimi disconnected Discover-Tech after the disclosure ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: c49af8ba2d
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "**Exposure:** any device that renders third-party ads in a browser or an app, on staff whose phones or workstations an espionage buyer would want, such as defence, security and diplomatic staff; no source reports an infection in Switzerland, and neither report mentions it ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: 3ce9bea0d2
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "**Detection:** in per-device web-proxy, DNS and egress logs the reported signature is contact with Discover-Tech infrastructure, which marks an ad impression, followed by a connection to a validator server and finally to a command-and-control server, the sequence seen in Al Jazeera's network logs ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: 82718f4deb
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "Confiant adds that the ad-delivered SDK resolves an operator-chosen domain over DNS-over-HTTPS and reaches it by raw IP, so it never appears as a plaintext DNS query or connection hostname and stays invisible to DNS-based monitoring and blocklists ("
    urls: ["https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming"]
  - claim_id: 2c787b48eb
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "**Triage:** ordinary ad tags also call identifier-bearing endpoints and sync user IDs; the reported discriminators are the eligibility gating, with an empty reply for ineligible devices and code only for chosen ones, and the validator-then-command-and-control sequence ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: e35f12051f
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** the delivery is zero-click and needs no user action, and Citizen Lab says there is currently no consistently safe way to expose users and networks to targeted ads; its control is to block online advertising at the organization's gateway and on work-issued and edge devices ("
    urls: ["https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"]
  - claim_id: a8ceaf8991
    entry: 2026-10-16/adfection-candiru-spyware-zero-click-ad-delivery
    surface: "body"
    kind: derived
    text: "On a Windows endpoint, the implant Citizen Lab analysed persists through COM hijacking, so a new COM registration that points at an unfamiliar DLL is the artifact to look for."
