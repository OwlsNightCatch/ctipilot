    text: "**Detection:** GitLab and NCSC publish no indicators, so this is a hunt for the mechanism: in process-creation telemetry, shells, interpreters or network tools started as children of the GitLab application server processes, and in GitLab's audit and application logs, recently created or changed CI/CD configurations that carry unusual regular expressions, from accounts or addresses that have not used the instance before."
