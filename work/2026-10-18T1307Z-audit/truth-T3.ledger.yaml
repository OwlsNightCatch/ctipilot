    surface: "body"
    kind: derived
    text: "Look at mail gateway, chat and endpoint file-origin telemetry for internet-origin files, archives and shortcuts that execute without the usual download warning, and at process lineage from `explorer.exe` into scripting interpreters and living-off-the-land binaries shortly after a mail or browser download."
