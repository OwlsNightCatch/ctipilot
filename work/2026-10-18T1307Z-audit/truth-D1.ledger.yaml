    surface: "record 2026-07-31T04:09:14Z"
    kind: record-summary
    text: "Proofpoint attributed active exploitation of CVE-2026-42897 — the Outlook Web Access stored-XSS flaw Microsoft disclosed on 2026-05-14 and CISA KEV-listed on 2026-05-15 — to TA488 (LAUNDRY BEAR / Void Blizzard), the Russian state-supported email-espionage actor that 16 nations jointly exposed on 2026-07-23 over a parallel Zimbra campaign. Merely opening a crafted message in OWA executes \"OWAReaper\", a JavaScript implant that runs entirely in the reading pane with no host file, harvests browser-autofilled OWA credentials, steals OAuth tokens through mailbox add-ins, and grants the Exchange \"Default\" alias Owner permission on every mail folder — server-side access that survives credential rotation and device re-imaging. Affected: on-premises Exchange Server 2016/2019/SE at any update level; Exchange Online is not in scope. The permanent fix is the July 2026 Exchange Security Update, and installing it does not remove the earlier mitigation artifacts."
