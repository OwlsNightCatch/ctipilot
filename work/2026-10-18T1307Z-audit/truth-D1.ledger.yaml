    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "record 2026-08-30T13:12:06Z"
    kind: record-summary
    text: "A first source-reliability rating, plus a serialization repair. The first action string was written as a double-quoted YAML scalar containing both a Windows-style path and escaped inner quotes, so a standards-compliant YAML parser rejected the whole frontmatter document; this repo's own lenient parser had always read the intended value. Re-quoted single so the backslash and the inner quotes stay literal. The stored value is byte-identical before and after, and no reader-facing text, claim or field value changed. The entry also carried no Admiralty rating, predating the always-classified gate; A1 is recorded, matching its sourcing: Microsoft's own advisory for its own product is A, and Proofpoint's independent analysis of the implant alongside Microsoft's disclosure is two parties who looked, so credibility 1."
