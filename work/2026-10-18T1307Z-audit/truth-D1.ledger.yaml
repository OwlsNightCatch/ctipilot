  - claim_id: f18dd238a9
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Exchange Server CVE-2026-42897 (OWA stored XSS, actively exploited, CISA KEV) — Exchange Team Blog update confirms the EM Service auto-mitigation requires outbound HTTPS connectivity from the Exchange host to officemitigations.microsoft.com. Segmented or air-gapped Exchange 2016 / 2019 / SE environments that block this egress path will not have received the automatic URL-Rewrite mitigation and remain exposed; no permanent patch is available yet (Microsoft Exchange Team Blog, 2026-05-17; Microsoft MSRC)."
  - claim_id: d0817bf8e6
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "immediate_action"
    kind: frontmatter
    text: "Verify Exchange Emergency Mitigation Service health and `officemitigations.microsoft.com` connectivity: CVE-2026-42897 is an actively-exploited OWA stored-XSS with no permanent patch; the EM Service auto-applies the URL-Rewrite mitigation M2.1.x only if outbound HTTPS to officemitigations.microsoft.com is reachable from each Exchange Mailbox server. Segmented or restricted-egress on-premises Exchange 2016 / 2019 / SE estates may be silently unprotected."
  - claim_id: 27b2586fc8
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "actions[0]"
    kind: frontmatter
    text: "**Verify Exchange Emergency Mitigation Service health on every on-premises Mailbox role.** Run `Get-ExchangeDiagnosticInfo -Server <server> -Process EdgeTransport -Component EmergencyMitigation` against each Exchange 2016 / 2019 / SE host; confirm `Status: Active` and rule M2.1.x is applied. On segmented hosts that block outbound HTTPS to `officemitigations.microsoft.com`, manually apply via `.\\EOMT.ps1 -CVE \"CVE-2026-42897\"` from an elevated Exchange Management Shell. No permanent patch yet; CISA KEV-listed and actively exploited."
  - claim_id: 14d9800c7f
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "actions[1]"
    kind: frontmatter
    text: "Install the July 2026 Exchange Security Update on every on-premises Exchange 2016/2019/SE server, then explicitly remove the earlier CVE-2026-42897 mitigation — the EEMS M2.1.0 IIS rules or the EOMT script rollback — because the update does not remove either automatically."
  - claim_id: 2946113ae1
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
