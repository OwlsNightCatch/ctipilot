    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "WordPress underpins a large share of cantonal, municipal and agency web estates, so any public-sector site still running Everest Forms Pro ≤ 1.9.12 is exposed to a fully unauthenticated site takeover today — the patch existing for three months does not help a site that never applied it."
  - claim_id: 75a0b485a8
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "The only input handling applied is `sanitize_text_field()`, which strips tags and normalises whitespace but does **not** escape single quotes or PHP syntax metacharacters."
  - claim_id: 2e3f98ca2e
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "An unauthenticated attacker who submits a form containing a calculation field can therefore inject a single quote to terminate the intended string literal, append arbitrary PHP, and comment out the trailing remainder of the generated expression with `//`."
  - claim_id: 4577c9b490
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "Because the sink is `eval()`, this is direct code execution in the WordPress PHP context — no file write, no upload, no authentication."
  - claim_id: 81df0b05c8
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "The CVE prerequisite is narrow but common: the form must include the Calculation Addon."
