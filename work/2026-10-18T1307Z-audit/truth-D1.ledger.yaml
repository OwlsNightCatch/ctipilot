    surface: "body"
    kind: uncited
    text: "CVE-2026-26030 (CWE-94, CVSS 9.9) is a code-injection flaw in the Python SDK's `InMemoryVectorStore` filter function."
  - claim_id: fb2132c836
    entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    surface: "body"
    kind: uncited
    text: "An f-string composes the LINQ-like filter expression directly from an LLM-controlled parameter rather than parameterising it; the SDK applies a blocklist validator that an attacker bypasses with the well-known `__class__.__bases__[0].__subclasses__()` class-hierarchy traversal pattern, escaping the validator and yielding `os.system`-equivalent execution on the host running the agent."
  - claim_id: bbb844a769
    entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    surface: "body"
    kind: uncited
    text: "Affected versions: Python SDK < 1.39.4."
  - claim_id: d3ab491fd5
    entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    surface: "body"
    kind: uncited
    text: "CVE-2026-25592 (CWE-22, CVSS 9.9) is a class-design flaw in the .NET SDK: `SessionsPythonPlugin.DownloadFileAsync` and `SessionsPythonPlugin.UploadFileAsync` carry a `[KernelFunction]` attribute that should not have been applied — the LLM can therefore call those methods directly with attacker-chosen path arguments, yielding an arbitrary file-write primitive that breaks containment from the Azure Container Apps Python sessions sandbox into the host filesystem of the agent process."
  - claim_id: bcbd93d3c9
    entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    surface: "body"
    kind: uncited
    text: "Affected versions: .NET SDK < 1.71.0."
