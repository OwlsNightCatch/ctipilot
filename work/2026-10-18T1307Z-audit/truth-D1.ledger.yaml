  - claim_id: 8e41179505
    entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Semantic Kernel CVE-2026-26030 (Python SDK, CVSS 9.9) and CVE-2026-25592 (.NET SDK, CVSS 9.9) — prompt-injection-to-RCE in the AI agent orchestration framework that backs Azure AI Foundry, Copilot Studio and many self-hosted agents. Class-hierarchy traversal bypasses the Python InMemoryVectorStore blocklist filter; an unintended kernel_function attribute on SessionsPythonPlugin.DownloadFileAsync / UploadFileAsync yields arbitrary file write in the .NET SDK. Public PoC for the Python flaw; patch in Python ≥1.39.4 / .NET ≥1.71.0. Full breakdown in § 5."
