    entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    surface: "summary"
    kind: frontmatter
    text: "Windows BitLocker \"YellowKey\" zero-day (no CVE) bypasses TPM-only disk encryption via WinRE NTFS transaction replay; working PoC is public; no patch available; add BitLocker pre-boot PIN to close the current PoC (BleepingComputer, 2026-05-13)."
  - claim_id: e49a22e725
    entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    surface: "actions[0]"
    kind: frontmatter
    text: "**Enforce BitLocker pre-boot PIN on all managed Windows laptops and enforce BIOS/UEFI boot password** — YellowKey (no CVE) bypasses TPM-only BitLocker via WinRE with a public PoC. Group Policy path: `Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives > Require additional authentication at startup` → Enable + require PIN. Disable WinRE access where operationally viable (`reagentc /disable`)."
  - claim_id: 566688a254
    entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    surface: "actions[1]"
    kind: frontmatter
    text: "**Add BitLocker PIN / password protector to TPM-only-protected endpoints (CVE-2026-45585 / YellowKey).** Microsoft's WinRE `BootExecute` registry mitigation is per-device and fragile under Windows feature updates that re-stage WinRE; the PIN/password protector closes the bypass regardless of WinRE state. Public PoC, no patch ([MSRC CVE-2026-45585](https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45585))."
