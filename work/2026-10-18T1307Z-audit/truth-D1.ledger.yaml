    kind: uncited
    text: "**Attack chain.** From the limited disclosure, the operationally credible kill chain is:"
  - claim_id: 082a87bc92
    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "**EEMS — what it does, when it doesn't apply.** The Exchange Emergency Mitigation Service is a small Windows service installed by the Exchange setup process on Exchange 2016 CU22 / Exchange 2019 CU11 and later; it polls a Microsoft-hosted Office Config Service endpoint hourly for new mitigation rules and applies URL-rewrite rules to the IIS configuration when one matches the server's installed Exchange version."
  - claim_id: cd0309c696
    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "EEMS does **not** apply automatically in the following operationally common configurations: (a) Exchange Server 2013, on which EEMS is not available; (b) Exchange servers with no outbound HTTPS connectivity to `officeclient.microsoft.com` (air-gapped networks, segmented DMZs, environments with strict egress controls); (c) Exchange servers where EEMS has been manually disabled (`Set-OrganizationConfig -MitigationsEnabled $false`, `Set-Server -MitigationsEnabled $false`, or via Group Policy); (d) Exchange servers that have been hardened with custom IIS rewrite rules that conflict with the EEMS rule placement."
  - claim_id: 9f0c4ab5b8
    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "For all four cases, operators must run the Exchange On-Premises Mitigation Tool (EOMT) — downloadable from `aka.ms/UnifiedEOMT` — via the Exchange Management Shell as Administrator, which applies the same URL-rewrite Mitigation M2 manually."
  - claim_id: b6d02f440a
    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "**EEMS verification — what to actually run on every Exchange server.** The canonical check is:"
  - claim_id: dea60e93e5
    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "- `Get-ExchangeDiagnosticInfo -Server <server> -Process MSExchangeHMWorker -Component EemsMitigation -SettingName MitigationsApplied` and confirm the Mitigation M2 identifier published in the MSRC advisory appears in the output. - `Get-OrganizationConfig | Select-Object MitigationsEnabled` and `Get-Server <server> | Select-Object MitigationsEnabled` should both return `True`. - IIS Manager → Default Web Site → URL Rewrite should show the EEMS-injected rewrite rule corresponding to CVE-2026-42897."
  - claim_id: 82611f7285
