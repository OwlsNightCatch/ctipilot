    entry: 2026-05-16/cve-2026-42897-microsoft-exchange-server-2016-2019-se-stored
    surface: "actions[0]"
    kind: frontmatter
    text: "**Verify EEMS Mitigation M2 deployed on every on-premises Exchange Server 2016 / 2019 / SE — and apply EOMT manually on air-gapped / EEMS-disconnected / hardened servers.** CVE-2026-42897 is actively exploited with no permanent patch; EEMS auto-applies the URL-rewrite mitigation only on Exchange 2016 SP1+ with outbound HTTPS to `officeclient.microsoft.com`. Run `Get-ExchangeDiagnosticInfo -Server <name> -Process MSExchangeHMWorker -Component EemsMitigation -SettingName MitigationsApplied` on every Exchange server; where the M2 identifier is absent, download and execute EOMT from `aka.ms/UnifiedEOMT` as Administrator. Then look back to 2026-05-09 in IIS access logs on the front-end Exchange role for `/owa/` URLs with script-injection payloads — EEMS prevents future exploitation, not prior."
