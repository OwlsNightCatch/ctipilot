    entry: 2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou
    surface: "body"
    kind: uncited
    text: "- **IIS access logs (front-end Exchange role)** — `/owa/` URLs with `<script>`, `javascript:`, or HTML-encoded equivalents in query strings; OWA URLs with anomalous referrer headers from external mail-rendering paths. - **Exchange transport logs** — emails with HTML bodies that embed encoded JavaScript fragments delivered to mailboxes whose owners are OWA users (cross-correlate with `Get-CASMailbox -OWAEnabled $true`). - **EDR telemetry on Exchange front-end servers** — `w3wp.exe` (IIS worker process, Exchange app pool) spawning unexpected children (`cmd.exe`, `powershell.exe`, `cscript.exe`, browser launchers) is the post-exploitation tell of XSS-to-execution chains observed in prior Exchange compromises. - **Exchange Application Event Log EID 4 (`MSExchange Management`)** — for EEMS mitigation-state changes; flag any disable / re-enable cycle that does not correspond to a documented change. - **OWA session anomalies** — `Get-MailboxAuditLog` for unusual mailbox-folder reads or message-send activity from sessions whose source IP differs from the user's established pattern."
