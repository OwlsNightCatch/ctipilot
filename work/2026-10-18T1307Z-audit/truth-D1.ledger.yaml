    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "), and the mitigation is no longer the remediation — the July 2026 Security Update is, with the mitigation now something that must be actively torn down ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146"]
  - claim_id: 04aa795d34
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "NCSC-CH appended the Proofpoint reporting to its own advisory on 2026-07-30 ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/12577"]
  - claim_id: 753d51d296
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Proofpoint assesses OWAReaper as an evolution of that campaign's ZimReaper payload, citing shared code including an identical invisible-element sizing and error-handling pattern ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit"]
  - claim_id: a2b8967f3a
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "The permanent fix is the July 2026 Security Update, available as Exchange SE RTM publicly and for Exchange 2019 CU14/CU15 and Exchange 2016 CU23 only through the Period 2 Extended Security Update programme; organisations that were enrolled only in Period 1, which ended in April 2026, do not receive it ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146"]
  - claim_id: 1c166302ba
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Microsoft's own vulnerability record scores the flaw 8.1 and marks it exploited ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897"]
  - claim_id: 73f85d9d96
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "The known operational side effects of the mitigation era — broken OWA calendar printing, inline-image rendering problems, OWA-light failing, and false-unhealthy calendar-proxy health alerts — only clear once both steps are done, so a server left on mitigation-only status keeps them indefinitely ("
    urls: ["https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"]
  - claim_id: 5dc982c990
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The May entry tracked CVE-2026-42897 as an Exchange OWA flaw whose interim protection depended on the EM Service auto-mitigation."
  - claim_id: 4fb83e17c1
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The actor is TA488, which Microsoft tracks as Void Blizzard and which this pipeline registers as LAUNDRY BEAR — the same Russian state-supported email-espionage actor a 16-nation joint advisory exposed on 2026-07-23 for its Zimbra campaign."
  - claim_id: 72d73eca81
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Campaign activity began 2026-07-22 against government, telecommunications, finance, hospitality and aerospace targets across the US and Europe, using deliberately banal lure subjects with no call to action — Proofpoint reads the unusual breadth as intentional blending with bulk mail."
  - claim_id: 112e3be519
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Its stated infrastructure-creation date of March 2026 precedes Microsoft's May disclosure by two months, which is the basis for its assessment that zero-day use is feasible; that is an inference from infrastructure dating, not a confirmed finding."
  - claim_id: af01cebd5c
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Execution.** The flaw is a failure to sanitise HTML in the message body, so a loader script in an `onload=` handler reassembles a Base64 fragment from the rest of the message and evaluates it — no link click and no attachment open, only viewing the message in OWA."
  - claim_id: 2a41fd468d
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The exploit and payload fragments are hidden inside the message's social-media icon elements, with next-stage data placed after `#` fragment markers where the browser's Base64 image parser stops reading, so the payload is not visible to casual inspection of the HTML."
  - claim_id: 75e54220ba
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "On execution OWAReaper first rewrites the delivered message server-side to strip the exploit content and suppresses OWA pop-ups and right-click, then enumerates the victim's address, username and settings."
  - claim_id: 0736ad20e0
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Credential and token theft.** It creates two invisible input elements and waits for the browser's own autofill to populate them with the saved OWA username and password."
  - claim_id: bdcc0b462b
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Separately it enumerates installed Outlook add-ins holding ReadWriteMailbox permission and, where one exists, abuses it to call `GetClientAccessToken` and obtain OAuth tokens."
  - claim_id: 0089581a58
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Persistence, in three independent layers.** Client-side, the implant writes an AES-encrypted copy of itself and a decryption wrapper into browser localStorage under a settings field of the legitimate `PageDataPayload.OwaUserDefaultSettings` key, which OWA itself evaluates during its own sync-restore flow — so every ordinary OWA tab-open re-launches it with no separate loader."
  - claim_id: d1f4bfe2b2
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "A second client-side layer adds a hidden iframe to messages cached in OWA's offline IndexedDB store, so opening the cached message re-infects an endpoint even after a full re-image."
  - claim_id: 4cb0f00086
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The third is server-side and is the one that matters most: the implant calls `UpdateFolder` to grant Owner-level permission on every mail folder to the low-privilege \"Default\" preset alias that exists in every Exchange organisation."
  - claim_id: b2496384ef
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Proofpoint is explicit that this \"requires deliberate removal from the Exchange server\" and that credential rotation and re-imaging will not evict it."
  - claim_id: 8f35486e0a
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Command and control.** Two channels, both over infrastructure defenders generally trust."
  - claim_id: 4c8d40de57
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The implant polls GitHub's public Commit Search API every 24 hours for crafted commit messages containing the target's own email address, decrypting matches to a four-character command header that selects toolkit replacement, C2-domain rotation, or one-off code execution; in parallel it re-parses cached inbound messages every five minutes for the same command structure."
  - claim_id: 47ae7674f5
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Exfiltration runs primarily over HTTPS with encrypted URI paths, either relayed through a set of legitimate image-CDN domains or sent directly to the actor-controlled server when those proxies fail; if the HTTPS method fails altogether, the implant switches to DNS label tunnelling, packing the data into the subdomain labels of ordinary DNS queries for an actor-controlled domain."
  - claim_id: 91a2956511
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Notably, Proofpoint states there is no mass mailbox exfiltration here, unlike the Zimbra campaign — which is why this entry maps browser-session and credential-access behaviour rather than bulk email collection."
  - claim_id: 01c44fdef4
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Installing the update does not remove a previously applied mitigation: administrators who used the EM Service must remove the M2.1.0 IIS rules through the documented rollback, and those who ran the downloadable mitigation script must run its rollback."
  - claim_id: 0c6bffc209
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Detection.** The highest-value signal is in mailbox audit and Exchange Web Services telemetry: a folder-permission change granting Owner rights to the \"Default\" alias, applied across many folders of one mailbox in quick succession."
  - claim_id: 9d58ff26a5
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Client-side, monitor for writes to the OWA user-default-settings localStorage key outside the browser's own sync flow, and for OWA sessions in which invisible form inputs are created and immediately populated."
  - claim_id: e894389ec1
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "On the network side, two egress patterns stand out from a mail client's normal behaviour: repeated polling of a public source-code hosting search API on a roughly daily cadence, and DNS queries with the label-length and entropy profile of tunnelled data."
  - claim_id: 305c4fa9da
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "**Triage:** OWA legitimately reads and writes its own settings keys constantly, so the presence of localStorage activity is not the signal — the discriminator is the specific settings-field path carrying an encrypted blob, and its correlation with a message open."
  - claim_id: ccae4c0b55
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "For the server-side artifact the discrimination is cleaner: administrators do grant folder permissions, but they grant them to named users or groups for a specific folder, not Owner rights to the built-in \"Default\" alias across an entire mailbox."
  - claim_id: 0f4a73d7c9
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "Treat any such grant as compromise until proven otherwise."
  - claim_id: eb93ccd36a
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "**Defender takeaway:** for any on-premises Exchange estate, \"we patched in May\" is the wrong answer to this one — May shipped a mitigation, July shipped the fix, and the mitigation has to be dismantled by hand afterwards."
  - claim_id: aa8e82fe7c
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "Because the actor's durable foothold is a mailbox permission rather than anything on the endpoint, an organisation that patches, resets passwords and re-images the affected workstation can still be read indefinitely; the folder-permission audit is the part that actually evicts them."
  - claim_id: f3d7cd84e4
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "This entry now carries a source-reliability rating, which it predates: **A1** on the NATO Admiralty scale."
  - claim_id: 7e30c6f0e7
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "The letter reflects Microsoft's own advisory for its own product, the number reflects independent corroboration, since Proofpoint analysed the implant separately from Microsoft's disclosure and NCSC-CH restated that analysis for its own constituency."
  - claim_id: d040f294e5
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "Nothing in the assessment or the remediation guidance changes; the rating makes explicit what the sourcing already supported."
  - claim_id: 04d9609ee6
