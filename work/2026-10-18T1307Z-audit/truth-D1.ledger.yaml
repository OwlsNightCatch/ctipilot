  - claim_id: eb9479aa5a
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "**Observed exploitation chain.** The dominant in-the-wild payload uses the code-execution primitive to call WordPress's own `wp_insert_user()` and create a rogue account with the `administrator` role — converting a single unauthenticated POST into persistent privileged access to the site, from which attackers typically install webshells, SEO-spam injectors or redirect malware."
  - claim_id: 83d9f0f6fb
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "**Detection concepts (no IOCs).** The highest-fidelity signal is unexpected administrator-account creation: hunt WordPress `user_register` events that assign the `administrator` role, and reconcile the live admin-user list against a known-good baseline — any account you cannot attribute to a person or process is suspect."
  - claim_id: 98aa6d96c5
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "At the request layer, alert on POSTs to the form-handling endpoints (`admin-ajax.php` and the plugin's AJAX actions) whose parameters contain PHP-syntax artefacts such as stray single quotes followed by function-call tokens or trailing `//` comment markers."
  - claim_id: 5d6159a57e
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "Post-exploitation, watch for new or modified PHP files in `wp-content/` and for outbound requests from the web host that correlate with webshell or SEO-spam behaviour."
  - claim_id: 5fee02bc67
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "These are behavioural concepts, not signatures — tune to your own form traffic."
  - claim_id: 1636c02573
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "**Hardening.** Update Everest Forms Pro to **1.9.13 or later** immediately; if you cannot patch on the spot, disable the Calculation Addon (the vulnerable code path) or take affected forms offline, and audit for already-created rogue admin accounts before re-enabling."
  - claim_id: f2fec079b4
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "A WAF rule blocking PHP-metacharacter patterns in form-submission parameters is a reasonable compensating control, but it is mitigation, not a fix."
  - claim_id: 26595f88f2
    entry: 2026-06-08/cve-2026-3300-unauthenticated-eval-injection-in-a-commercial
    surface: "body"
    kind: uncited
    text: "More broadly, this CVE is an argument for maintaining an inventory of commercial plugins and their versions across your WordPress estate and wiring plugin-update monitoring into change management — the recurring failure mode here is not the vulnerability class but the months-long gap between a vendor fix and its deployment."
