  - claim_id: d196d63a7e
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Semantic Kernel is the open-source orchestration SDK behind Azure AI Foundry, Copilot Studio, and a growing fraction of self-hosted enterprise AI agents in EU government modernisation pilots."
  - claim_id: 2e8f38fe00
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Where prompt injection has previously been treated as a *content* problem (LLM produces wrong text), CVE-2026-26030 and CVE-2026-25592 promote it to a *host* problem: an attacker who can inject text the agent reads — via user input, RAG-retrieved documents, tool outputs, or email indexed by an automation — escapes the agent's logical boundary and runs code on the agent process's host."
  - claim_id: 126e43520f
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The deployment surface inside an EU public-sector tenant is exactly the place where an LLM-driven workflow has access to sensitive data sources (case-management systems, HR repositories, classified-by-policy documents)."
  - claim_id: 0dd41aa489
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The two CVEs together demonstrate that **agentic-AI tool authorisation is a security boundary, not a convenience abstraction**."
  - claim_id: 3d4bc057ae
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Affected:** Microsoft Semantic Kernel Python SDK < 1.39.4."
  - claim_id: 4edda7ac7b
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Class:** CWE-94 Improper Control of Generation of Code ('Code Injection')."
  - claim_id: 5d89d341a8
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The Python SDK's `InMemoryVectorStore` filter function composes its LINQ-like filter expression by f-string interpolation of an LLM-controlled parameter rather than parameterising the value into the filter AST."
  - claim_id: 2952e1e825
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The SDK applies a string-blocklist validator to reject obvious dangerous tokens (e.g."
  - claim_id: ab77958f84
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "`eval`, `exec`, `os.system`), but the validator is a denylist on the *literal text*, not a sandboxed evaluation."
  - claim_id: 0eccdcec01
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The attacker bypasses it via the standard Python class-hierarchy traversal pattern:"
  - claim_id: 8cb1f186c6
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "```python \"\".__class__.__bases__[0].__subclasses__()[<index>](\"...\") ```"
  - claim_id: 3c3f723eb0
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "— walking `object`'s subclass list to reach an arbitrary class that exposes a method capable of running shell commands (typically `subprocess.Popen` or a `os` reference reached via reflection)."
  - claim_id: 876b9b123b
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Once the validator is fooled, the f-string interpolation completes and Python evaluates the resulting expression in the agent process's context."
  - claim_id: 47333e9972
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Exploitation prerequisites.** The agent must (a) use the in-memory vector store backing for a Search Plugin or analogous component (default for self-hosted Semantic Kernel agents until a customer wires in a different vector backend), and (b) the attacker must have an injection vector into the prompt context."
  - claim_id: a2a6edfd27
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "In practice, indirect prompt injection via retrieved documents or tool output is sufficient; a direct user-input vector is not required."
  - claim_id: ff8cbe784f
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Public PoC.** Microsoft's research post references the public proof-of-concept in the `amiteliahu/AIAgentCTF` GitHub repository."
  - claim_id: 1ca8199642
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Affected:** Microsoft Semantic Kernel .NET SDK < 1.71.0."
  - claim_id: c54159f1b5
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "**Class:** CWE-22 Path Traversal (effectively, an unintended sandbox-escape path)."
  - claim_id: d4538eef55
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The `SessionsPythonPlugin` integrates Azure Container Apps Python sessions as an agent-callable code-execution sandbox."
  - claim_id: dec5c45bad
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Two of its methods — `DownloadFileAsync` and `UploadFileAsync` — were mistakenly annotated with `[KernelFunction]`."
  - claim_id: 28a6bb90ed
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The decoration tells the kernel that the method is callable by the LLM as a tool."
  - claim_id: 6b012c0319
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Combined, the LLM can therefore (a) call `UploadFileAsync` to write attacker-chosen bytes to an attacker-chosen path *on the host running the agent process*, escaping the Container Apps Python session entirely; and (b) call `DownloadFileAsync` symmetrically to read host-side files back into the agent context."
  - claim_id: 9d745c593b
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The intended design exposed only *sandboxed* file operations against the Container Apps session filesystem; the attribute application broke containment."
  - claim_id: d727293f9d
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The attack surface is any Semantic Kernel .NET agent that loads `SessionsPythonPlugin`."
  - claim_id: eb8376eead
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "As with the Python flaw, the LLM can be steered into invoking these methods through indirect prompt injection — no explicit tool-call permission grant from the user is required at runtime if the agent has been configured to allow plugin invocation autonomously."
  - claim_id: 56379f6d9d
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Both flaws stem from a shared design weakness: **an agent framework that treats LLM-controlled values as input to executable abstractions without explicit validation at the boundary**."
  - claim_id: ce2da4e0e2
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The Python flaw uses string interpolation (the LLM's value is interpolated into code); the .NET flaw uses attribute application (LLM-callable surface is over-broad because of mis-tagged methods)."
  - claim_id: 4fa8cf9ff1
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Both bypass any of the existing prompt-side mitigations (output filtering, response classifiers, \"let the LLM judge\" patterns) because the dangerous operation occurs *inside the SDK*, not in the model's text."
  - claim_id: ee7ade1528
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Microsoft's research framing — \"prompts become shells\" — is the correct mental model for defenders: any place an agent framework converts an LLM-supplied value into a code-execution-adjacent operation (filter expression, tool dispatch, plugin parameter, file path, SQL, shell command) requires the same defensive treatment as a user-supplied parameter on a public-facing web endpoint."
  - claim_id: 5a843c1db3
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The same class of bug is highly likely to exist in **LangChain**, **CrewAI**, **AutoGen**, **Haystack**, **LlamaIndex**, and other agent frameworks; defenders should not assume Microsoft Semantic Kernel is uniquely affected."
  - claim_id: 2165d619e6
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "- **Process ancestry anomalies for AI agent frameworks.** Sysmon EID 1 with parent-image filters covering `python.exe` / `dotnet.exe` invocations from `python` virtualenv paths or .NET app-host paths under typical Semantic Kernel deployment directories — alert when those processes spawn shells (`bash`, `cmd.exe`, `powershell.exe`), file utilities (`mv`, `cp`, `tar`), or network tools (`curl`, `wget`, `ssh`, `nc`). - **EDR detections for unexpected shell-spawning by `python` / `dotnet` agent processes.** EDR vendors classify this under hunt-pack categories such as \"interpreter spawning shell\" and \"agent framework lateral move\". - **File-creation events outside the expected sandbox path.** For .NET agents using `SessionsPythonPlugin`, alert on file creation by the agent process anywhere outside the Container Apps Python sessions mount; for Python agents, alert on file creation outside the configured agent working directory. - **Agent-side telemetry: log and audit every tool / plugin invocation with parameters.** Many self-hosted agent deployments do not log plugin-method calls because the LLM provider's API logs the *prompt and response* but not the agent-side dispatcher's tool-call traffic."
  - claim_id: f68713284f
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Add structured logging at the dispatcher layer."
  - claim_id: f613401110
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "- **Patch first.** Upgrade Python SDK to **≥ 1.39.4** and .NET SDK to **≥ 1.71.0**."
  - claim_id: be36f21153
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "The patched releases also include the upstream test additions covering the bypass patterns. - **If immediate upgrade is blocked, implement a Function Invocation Filter** (the SDK-supported hook documented in the Microsoft research post) to allowlist the methods and parameters that may be called."
  - claim_id: 89aa3f550e
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "This neutralises the unintended-`[KernelFunction]` exposure on the .NET side and reduces the Python-side blast radius even if the validator is bypassed. - **Audit every `[KernelFunction]`-decorated method in your codebase** for parameter types that are paths, file handles, raw strings later interpolated into code, SQL fragments, or URLs; remove the decorator from anything that does not need to be LLM-callable. - **Treat LLM-supplied inputs to filter / templating / dispatch as untrusted at the SDK boundary** — the same bar as request-body validation on a REST endpoint."
  - claim_id: 2e7a1c18f5
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    surface: "body"
    kind: uncited
    text: "Allowlist parameter types, validate paths against canonicalised roots, parameterise filter expressions instead of interpolating them. - **Network segmentation around agent hosts.** A Semantic Kernel agent host with read access to internal systems and outbound internet access is an obvious post-RCE pivot point; the agent process should run with the *same* network and credential constraints as any internet-exposed application server."
  - claim_id: c0f7f7c99c
    entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
    surface: "headline"
    kind: frontmatter
    text: "CVE-2026-41089 / CVE-2026-41096 / CVE-2026-41103 / CVE-2026-42898 — Microsoft May 2026 Patch Tuesday (120+ CVEs, no zero-days)"
  - claim_id: f848eae674
    entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
    surface: "summary"
    kind: frontmatter
    text: "Microsoft May Patch Tuesday — 120+ CVEs, no zero-days, but a Netlogon pre-auth RCE on the DC. CVE-2026-41089 (Windows Netlogon, CVSS 9.8, stack overflow) is a wormable-candidate pre-auth RCE against every supported Windows Server; CVE-2026-41096 (Windows DNS Client, CVSS 9.8, heap overflow) is reachable from a malicious DNS response on every Windows host; CVE-2026-41103 (Microsoft SSO Plugin for Jira/Confluence, CVSS 9.1) is rated \"Exploitation More Likely\". 16 of the CVEs were discovered by Microsoft's new MDASH AI scanning harness."
  - claim_id: 9fa00859ce
    entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch domain controllers against CVE-2026-41089 (Windows Netlogon) now: The May 2026 Patch Tuesday fixed an unauthenticated, network-reachable stack-based buffer overflow in the Windows Netlogon service that grants remote code execution as SYSTEM on a domain controller with no credentials and no user interaction (Microsoft MSRC). On 1 June, Belgium's Centre for Cybersecurity (CCB) and multiple outlets reported active in-the-wild exploitation; Microsoft had not yet updated its advisory to reflect exploitation (BleepingComputer, 2026-06-01)."
  - claim_id: e44d56113e
