  - claim_id: b145b7afe1
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Proofpoint has now attributed in-the-wild exploitation to a named Russian state-supported actor and published the implant's full mechanics ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit"]
  - claim_id: 2959388ad1
