    kind: cited
    text: "Cisco supplies a concrete first check: review each node's `access.log` (or a decrypted debug-log bundle at `./ise/logs/apigateway/access.log.*.gz`) for suspicious usernames on the API endpoint, using `show logging application ise-kong/access.log | include dummyuser` as a worked example ("
