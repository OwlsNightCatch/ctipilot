    text: "CVE-2026-76460 was one part of a larger Cisco ISE hardening release the same day: two more CVEs (CVE-2026-20130, CVE-2026-20192) also carry CVSS 10.0, and NCSC-NL scopes the release to 21 vulnerabilities, 13 of them critical. CERT-FR confirms only CVE-2026-76460 is reported exploited, and notes ISE 3.1/3.2 will receive no fix at all for eight of the disclosed CVEs before their November 2027 end of maintenance."
