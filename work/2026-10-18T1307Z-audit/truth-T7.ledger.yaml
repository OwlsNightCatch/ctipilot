    entry: 2026-09-17/ddrop-dram-interposer-defeats-confidential-computing
    surface: "headline"
    kind: frontmatter
    text: "Researchers show a cheap hardware add-on can forge Intel TDX attestation reports by tampering with memory writes at the DRAM bus"
  - claim_id: 48cc038ce1
    entry: 2026-09-17/ddrop-dram-interposer-defeats-confidential-computing
    surface: "summary"
    kind: frontmatter
    text: "Researchers from KU Leuven, ETH Zurich, Durham University and Google disclosed DDRop, an open-source DDR5 hardware interposer costing about $159 that abuses the memory bus's own error-handling path to silently drop targeted writes. They show it undermining the protection of Intel TDX, Intel Scalable SGX and AMD SEV-SNP confidential computing, and on Intel TDX forging remote-attestation reports. Intel and AMD acknowledged the findings but place physical attacks on the memory bus outside their threat models. AMD does not plan to assign a CVE or release mitigations, and Intel is evaluating further hardening. The prerequisite is brief physical access to install the interposer, which takes minutes, not a software bug."
  - claim_id: ed912cbcd5
