    surface: "summary"
    kind: frontmatter
    text: "Cisco disclosed CVE-2026-76460 (CVSS 10.0) on 2026-09-16: an unauthenticated, remote authentication bypass in a Cisco Identity Services Engine (ISE) and ISE-PIC API endpoint, affecting every release regardless of configuration, that Cisco found while resolving a customer's TAC support case and confirms is under active exploitation. A same-day sibling, CVE-2026-76423 (also CVSS 10.0, not yet confirmed exploited), removes the same authentication boundary via a separate endpoint. There is no workaround; only infrastructure ACLs mitigate."
  - claim_id: 1f98b3fa57
