    text: "Spain's national data protection authority (AEPD) disclosed on 2026-09-14 what it describes as the first personal-data-breach notification it has received attributing the incident to a third party's use of an autonomous AI agent: per the affected organization's own account, the agent searched for vulnerabilities, logged in, then autonomously found further vulnerabilities and used them to modify personal data and access invoices. AEPD tells data controllers and DPOs to name AI-agent-assisted or -executed attacks explicitly in risk analyses rather than relying on generic threat categories, and to treat digital credentials and API keys as higher-value targets given machine-speed exploitation."
