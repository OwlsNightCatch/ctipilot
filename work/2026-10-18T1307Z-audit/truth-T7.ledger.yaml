    surface: "immediate_action"
    kind: frontmatter
    text: "Restrict ISE management-plane access now and hunt for exploitation: Apply infrastructure ACLs today to permit only required management/control-plane traffic to every internet- or network-reachable Cisco ISE / ISE-PIC node, then upgrade to the fixed release on the fastest available maintenance window — there is no other mitigation. Because successful exploitation reaches root, treat the appliance's own logs as untrustworthy for ruling out compromise: cross-check network and firewall logs outside the ISE node for unexpected outbound uploads or downloads to unfamiliar IPs, in addition to reviewing access.log for suspicious usernames on the affected API endpoint. Re-image any node where malicious activity is suspected and restore from configuration backup."
