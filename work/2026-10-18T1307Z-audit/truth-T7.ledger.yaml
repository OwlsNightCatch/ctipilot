    surface: "body"
    kind: cited
    text: "The operator then exchanges that JWT for a new one via `POST /access/api/v1/tokens`, which returns HTTP 200 carrying admin authority despite the request originating from the anonymous identity, exploiting CVE-2026-42016's missing scope check (**T1550.001**, forging elevated authority onto an application access token) ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: 95354c0e12
