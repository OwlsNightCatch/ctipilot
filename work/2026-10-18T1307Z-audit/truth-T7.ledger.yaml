    kind: cited
    text: "Researchers from KU Leuven, ETH Zurich, Durham University and Google disclosed DDRop, an open-source DDR5 hardware interposer that costs about $159 in parts and, unlike earlier passive interposers, runs at native bus speed ("
    urls: ["https://ddropattack.eu/"]
  - claim_id: c8dfc96b45
    entry: 2026-09-17/ddrop-dram-interposer-defeats-confidential-computing
