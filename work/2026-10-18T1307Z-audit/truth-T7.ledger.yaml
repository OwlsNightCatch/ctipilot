  - claim_id: 90adbe1b6c
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "summary"
    kind: frontmatter
    text: "Mandiant's second annual AI Risk and Resilience report synthesizes eight 2026 incident-response and red-team case studies of AI-agent abuse: an AI coding assistant recommending a poisoned dependency that deployed the self-propagating Shai-Hulud worm across roughly 100 repositories; a stolen CI/CD credential turned into a live, in-session AI co-debugging offensive hub; tampered AI-assistant CLI hooks used for native remote code execution; malware that rewrites its own command strings at runtime using embedded AI inference to evade EDR signatures; a prompt-injection \"Confused Deputy\" that exfiltrated internal repositories through an allowlisted external domain; a runaway agent reasoning loop that generated a $50,000 cloud-billing spike; a customer-service RAG agent that leaked cross-tenant PII via indirect prompt injection in forum comments; and a DARK CASTLE (ex-UNC2814) espionage campaign against telecoms and government bodies caught when an agentic SOC triage pipeline escalated a single low-severity command execution a human analyst would routinely have deprioritized."
  - claim_id: b27c685086
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "The 2026 edition, published 2026-09-15, tracks the shift Mandiant and Google Threat Intelligence Group (GTIG) observed since: distributed, autonomous agentic systems executing API calls, optimising production configurations and analysing telemetry across hybrid-cloud environments with far less human-in-the-loop oversight ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 6a572c24f4
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "The attacker used the resulting access to install a PyPI-packaged infostealer, harvest GitHub OAuth tokens (T1528), and deploy the self-propagating Shai-Hulud worm across roughly 100 internal repositories, automating theft of repository secrets and exfiltration of proprietary source code; the actor then re-poisoned the organization's own package namespace, triggering a secondary infection when another employee pulled the compromised version ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 712c2f4faf
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
