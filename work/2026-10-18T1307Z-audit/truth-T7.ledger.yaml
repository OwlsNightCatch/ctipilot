    text: "The 2026-09-18 text said no other CVE in the release was named exploited by any source and credited CERT-FR with saying only CVE-2026-76460 is exploited. CERT-FR reports Cisco's statement that CVE-2026-76460 is exploited, Cisco's hardening advisory notes an exploited vulnerability in the class covered by CVE-2026-20192 and points to the CVE-2026-76460 advisory, and Cisco's other advisories report no malicious use. The same text said ISE 3.1 and 3.2 will not receive a fix at all for eight CVEs, where CERT-FR reports only that those trains have not received one, and the eight are now named. A US federal remediation deadline and an uncited claim that ISE is standard infrastructure across enterprise and public-sector networks are removed, and Cisco's advice to re-image nodes where malicious activity is suspected is added."
