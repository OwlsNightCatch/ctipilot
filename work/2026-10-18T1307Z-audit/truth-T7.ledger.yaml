claims:
  - claim_id: 1bdd221b1b
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "headline"
    kind: frontmatter
    text: "Two maximum-severity SAP kernel flaws are reachable through the same ports every SAP GUI and RFC client needs — network segmentation alone will not close them"
  - claim_id: b85b53d955
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "SAP's 8 September 2026 Patch Day fixed CVE-2026-44756 (OVERPASS, CVSS 10.0), an unauthenticated memory-corruption flaw in kernel Extended Passport processing reachable via the web tier, SAP Dispatcher or RFC, and CVE-2026-58240 (S4GET, CVSS 9.8), an unauthenticated Message Server trust-bypass reachable on the port every SAP GUI client uses; both yield unauthenticated remote code execution across the SAP kernel-based product line. Neither is yet confirmed exploited, but Onapsis found over 10,000 internet-facing SAP interfaces, and since 2026-09-15 an open-source SAP exploitation toolkit, SAPMAP, has carried proof-of-concept exploits for both flaws."
  - claim_id: 2b52329a64
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply SAP Security Notes 3747649 (OVERPASS) and 3759472 (S4GET) to every SAP kernel-based system now, internet-exposed systems first and then internal ones, because the affected components are commonly reachable through internal firewalls; public proof-of-concept exploits for both flaws have been available since 2026-09-15 in the SAPMAP toolkit, and Onapsis found over 10,000 internet-facing SAP interfaces."
