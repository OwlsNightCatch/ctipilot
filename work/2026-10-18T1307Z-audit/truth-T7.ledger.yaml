    entry: 2026-09-18/gyazo-helpfeel-data-breach-image-upload-rce
    surface: "record 2026-09-30T06:56:00Z"
    kind: record-summary
    text: "Priority recalibrated from notable to routine: a Japanese consumer image-hosting breach with no product or technique relevant to Swiss public bodies, so it is awareness only, and the main text is shortened to the breach, the exposure that matters and Helpfeel's guidance to users. The exposed user fields follow Helpfeel's list, which names an X integration token and the Google sign-on email address rather than SSO tokens. The summary no longer calls the affected images private: captures on the default setting are protected only by their link, so the leaked image IDs remove that protection."
  - claim_id: f2db3fd394
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "headline"
    kind: frontmatter
    text: "Brevo's own integrity checks never saw the tampering because the attacker rewrote pages at Cloudflare's edge, not on Brevo's servers"
  - claim_id: 8245e4ddf4
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "summary"
    kind: frontmatter
    text: "Brevo (CRM/email platform, formerly Sendinblue) confirmed a stolen long-lived Cloudflare API key let an attacker deploy a malicious edge Worker that rewrote Brevo's own pages and three customer-embedded widget scripts for roughly 5.5 hours on 2026-09-14, serving a ClickFix clipboard-paste lure and a WordPress administrator-backdoor plugin without modifying any origin file. Sansec says Brevo served malware to visitors of more than 100,000 customer sites, a figure it links to a public source-code search for pages mentioning Brevo's domains. BleepingComputer reports the same research as up to 100,000 sites using the affected components."
  - claim_id: 1958c80296
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "On every WordPress site that loaded a Brevo forms, Conversations or SDK script on 2026-09-14 and had an administrator visit while logged in, check for any plugin installed or activated that day and compare the plugin directory on disk with the admin plugin list, because the known backdoor (impersonating \"Web Media Optimizer\") hides from that list and copies itself into the must-use-plugins directory. Remove any such plugin, invalidate all administrator sessions, change administrator passwords and review administrator accounts, because its hardcoded key mints admin logins without a password."
  - claim_id: b0248999e0
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "body"
    kind: cited
    text: "Brevo (CRM/email-marketing platform, formerly Sendinblue) confirmed in a 2026-09-17 post-mortem that an attacker used a long-lived Cloudflare API key with full account permissions, hardcoded in Brevo's application source code, to create a malicious Cloudflare Worker on Brevo's own account, first misused as early as late August 2026 ("
    urls: ["https://status.brevo.com/incidents/01M2QBC4EZ24ZACW6SWQYVW8N3/write-up"]
  - claim_id: a9539f5fd8
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "body"
    kind: cited
    text: "Brevo's own stated impact window ran 15:01 to 20:30 UTC on 2026-09-14 (5 hours 29 minutes), during which the Worker rewrote HTTP responses at the CDN edge on brevo.com and related domains, stripping security headers such as Content-Security-Policy; from 16:07 UTC the Worker additionally appended a malicious loader to three JavaScript files, the Brevo forms script, the Conversations widget and the SDK loader, that customers embed directly on their own sites, and extended the tampering to sibforms.com ("
    urls: ["https://status.brevo.com/incidents/01M2QBC4EZ24ZACW6SWQYVW8N3/write-up"]
