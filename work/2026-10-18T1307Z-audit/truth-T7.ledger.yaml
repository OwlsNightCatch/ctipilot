  - claim_id: 25407df2d4
    entry: 2026-09-16/chosen-brick-iran-telegram-c2-dissident-spyware
    surface: "summary"
    kind: frontmatter
    text: "NCSC-UK, the FBI and the Netherlands' AIVD jointly published a technical advisory on 2026-09-15 for CHOSEN BRICK, a Windows-only malware family Iranian state cyber actors have used since at least 2025 against dissidents, activists and journalists around the world, including in the UK, US and the Netherlands. Delivery is social-engineering-led over WhatsApp/Telegram. The malware persists via a registry Run key, adds Microsoft Defender exclusions to evade detection, and uses a per-victim unique Telegram bot for command and control, with data exfiltrated through Telegram or legitimate cloud object stores."
  - claim_id: c973f47b2e
