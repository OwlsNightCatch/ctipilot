  - claim_id: a3cde9313d
    entry: 2026-09-18/brevo-cloudflare-worker-clickfix-supply-chain
    surface: "record 2026-09-30T07:02:20Z"
    kind: record-summary
    text: "The action was generic third-party-script monitoring advice that restated the takeaway. It is replaced by the compromise check Brevo, Sansec and BleepingComputer give for WordPress sites that embedded the affected scripts. The priority moves from high to notable because a Swiss public body is exposed only if its site embedded Brevo widgets during a closed 5.5-hour window. The triage line treated every plugin missing from the admin list but present in the must-use-plugins directory as compromised, and now gives Sansec's checks and the plugin name. The title is shortened, the 100,000 figure is stated as Sansec and BleepingComputer each frame it, and Sansec's root-cause assessment keeps its hedge. An exposure line adds Brevo's guidance for anyone who ran the pasted command or logged in to Brevo that day."
