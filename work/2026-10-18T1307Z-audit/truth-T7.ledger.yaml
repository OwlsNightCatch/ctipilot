    text: "Google's September 2026 Pixel Update Bulletin (patch level 2026-09-05) fixes CVE-2026-58704, a logic error in the cellular modem that lets an attacker bypass permission checks and escalate out of the modem sandbox into the wider device with no user interaction. CISA added it to its Known Exploited Vulnerabilities catalog on 2026-09-16, and TechCrunch reports Google as saying there are indications it may be under limited, targeted exploitation. Any Pixel device issued to staff who could plausibly be individually targeted needs the update now."
