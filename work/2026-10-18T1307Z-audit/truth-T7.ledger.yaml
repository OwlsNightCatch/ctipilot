    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 3b40bd3fe0
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "A backdoor hid its command-and-control inside legitimate cloud productivity-spreadsheet traffic (T1102.002) as part of an espionage campaign targeting global telecommunications providers and government organizations ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: a63d4dc402
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "The report's eight case studies, drawn from real Mandiant incident-response and offensive-security engagements, are its most operationally useful content for defenders — each pairs an attack pattern with concrete detection and hardening guidance."
  - claim_id: f0df46128a
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 1 — poisoned dependency revives the Shai-Hulud worm.** An attacker compromised a SaaS provider by poisoning an external software package that a developer's active AI coding-assistant session then recommended installing; operating as a trusted interpreter within the environment, the assistant became the delivery mechanism."
  - claim_id: 0ced55e819
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hardening:** enforce IDE/CLI verification hooks that validate every AI-recommended dependency against cryptographic checksums and approved allowlists, isolate local credentials from extensions, and route dependency traffic through an internal package repository."
  - claim_id: 9f394df845
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 2 — a stolen CI/CD credential becomes a live AI co-debugging hub.** At a global healthcare organization, an attacker used a compromised long-lived CI/CD credential (T1078.004) to seize an unisolated VM and worked an LLM interactively, in real time, rather than developing malware offline: first synchronizing code and loading README files to align the model with campaign goals, then co-debugging a multi-worker credential-harvesting framework to cut its exfiltration cycle to three hours, then having the model write dynamic IP-rotation scripts and co-develop a Rust tool to validate stolen financial-account balances."
  - claim_id: d71b3b9aac
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hardening:** replace long-lived access keys with short-lived Workload Identity Federation trust relationships, enforce egress containment (e.g."
  - claim_id: 73637e83c6
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "VPC Service Controls) against unapproved external LLM providers, and run continuous secrets scanning with a runtime prompt firewall (Mandiant names Model Armor) to block hardcoded credentials and offensive script execution in real time."
  - claim_id: 920bf5384d
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 3 — tampered CLI hooks turn an AI assistant's own extensibility into RCE.** At an IT and software-development organization, an attacker poisoned an internal AI repository and tampered with an AI assistant's CLI hooks, achieving native remote code execution through the assistant's own standard operational workflow (T1554) — the same report also notes attackers separately using AI CLIs to manage command-and-control infrastructure through natural-language queries."
  - claim_id: ffd78e449e
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hardening:** require all local AI-assistant binaries, CLI helpers, plugins and MCP servers to be signed and verified before execution; enforce multi-party approval and continuous monitoring on internal AI repositories; and sandbox AI-assistant execution engines in micro-segmented, containerized runtimes (gVisor or microVMs) so a subverted hook cannot reach the host, with human-in-the-loop approval required before shell execution, configuration changes or outbound network calls."
  - claim_id: c2643e896a
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 4 — just-in-time polymorphic malware.** Malware using embedded, lightweight local AI inference fingerprints the active security tools on a host, then dynamically rewrites its own command-execution strings at runtime (T1027.010) — never writing a predictable payload to disk, so it evades static EDR signatures while it persists and reconnoiters."
  - claim_id: d328164b7f
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hunt/detection:** tune EDR and SIEM for in-memory compilation — unexpected native-compiler process spawns from non-developer parent processes and rapid file-create-execute-delete cycles in temp directories — and baseline endpoint CPU/GPU consumption to catch sudden, unexplained spikes from otherwise-lightweight background processes; response playbooks should suspend the entire parent execution tree (not just the worker thread) and capture a memory snapshot before network isolation."
  - claim_id: 0763a5aada
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 5 — \"Confused Deputy\" exfiltration via an allowlisted domain.** Mandiant's own offensive-security team used role-confusion prompt injection to convince a client's internal AI assistant, scoped to specific internal repositories, that it was assisting an authorized security test; because GitHub was an allowed external domain, the assistant used its native CLI to clone sensitive internal repositories and push them to an external, tester-controlled account (T1567.001) — a sanctioned tool weaponized through semantic manipulation of the assistant's own trust in its task."
  - claim_id: a5dbce2915
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hunt/detection:** cross-correlate application logs with network egress telemetry, and alert when an internal-facing AI service account initiates unauthorized outbound transfers or opens anomalous external API connections; on detection, invalidate the agent's active OAuth tokens and downgrade its container's egress privileges while keeping the instance alive for prompt-history forensics."
  - claim_id: 09a6e4cae6
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "This is an operational-resilience failure rather than an external attack, but the mechanics are identical to a denial-of-service condition."
  - claim_id: 1b16e0e843
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hardening:** define per-agent cost-cap thresholds and bounded recursion limits, and implement automated financial circuit breakers that halt agent operations after a set number of consecutive task failures."
  - claim_id: 4502630c84
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 7 — indirect prompt injection leaks cross-tenant PII.** A public-facing customer-service agent used Retrieval-Augmented Generation over community forum comments and support tickets; an attacker embedded hidden instructions inside a public forum post, which the model interpreted as system-level commands once retrieved, hijacking its reasoning to exfiltrate other customers' PII from cross-tenant support tickets directly into its response stream."
  - claim_id: 31e96a564c
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Hardening:** treat all RAG-retrieved content — forum posts, tickets, partner feeds — as untrusted input; enforce tenant-isolated vector indexing so a public-facing agent cannot query cross-tenant data; and route incoming context and generated responses through a semantic firewall (Model Armor or equivalent) to strip injected instructions and screen for PII before it reaches an end user."
  - claim_id: c507a7b221
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "A single, low-frequency anomalous command execution — the kind a human analyst would typically triage as low-severity — was escalated by the defending team's agentic AI triage pipeline, which autonomously correlated it with subtle outbound-traffic signals to reconstruct a complete attack timeline, letting engineers trace the actor's lateral movement over SSH (T1021.004) and privilege escalation by an unstated mechanism, and sever its access before it spread further."
  - claim_id: 56817abcc9
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "Mandiant's cross-cutting architectural recommendation is to replace static service-account identities with cryptographically bound, lifecycle-integrated agent identities (such as SPIFFE-based Workload Identity Federation) across five pillars: hyper-segmented identity perimeters, dual-execution authority requiring human re-authorization for high-risk bulk actions, data/tool/operational governance (financial circuit breakers, bounded recursion), active multi-layered telemetry (semantic firewalls, behavioral monitoring), and treating AI coding assistants and MCP servers as privileged sessions requiring cryptographic CLI-hook integrity checks."
  - claim_id: 6569ee66f4
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the case studies that most directly apply to a public-sector environment are 2 and 3 (any team running AI coding assistants or MCP-integrated developer tooling on long-lived CI/CD credentials), 5 and 7 (any deployment of an internal or customer-facing AI assistant that ingests external content or is scoped against an allowlisted external domain), and 8 (the concrete argument for correlating isolated endpoint anomalies against outbound-traffic telemetry in SOC triage, rather than scoring them in isolation)."
  - claim_id: 6598accf4d
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: derived
    text: "Audit which of your own AI-assistant deployments hold a long-lived credential, an allowlisted external domain, or ingest untrusted external content, and prioritise the corresponding hardening control above the others."
  - claim_id: d75d9663e3
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "record 2026-09-30T06:56:11Z"
    kind: record-summary
    text: "Priority recalibrated from high to notable: an annual AI-risk report with no finding that forces a decision within a week."
