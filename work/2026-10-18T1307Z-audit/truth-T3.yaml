      ("Rank Math SEO PRO 3.0.123 - Unauthenticated Embedded Malicious Code", published 2026-10-16, updated 2026-10-17, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, affected 3.0.123, patched 3.0.124).
      The entry has no CVE record, so scanners and tickets keyed on the id do not match it (the id does not resolve at the CVE services today: 404).'
    ground_truth: 'Wordfence record: CVE CVE-2026-111862, CVSS 9.8 (Critical), Publicly Published October 16, 2026, Affected 3.0.123, Patched 3.0.124'
    ground_truth_url: https://www.wordfence.com/threat-intel/vulnerabilities/id/81cd7a2c-ad0c-4dbc-b5dc-07ec866d5c1f
