entries:
- entry: 2026-10-12/cve-2026-85097-bricksforge-pro-forms-upload-php-exploited
  verdict: factual-error
  defects:
  - where: body paragraph 1; summary; headline; cves[CVE-2026-85097].fixed; Defender takeaway
    claim: 'The vendor''s changelog lists the fix in 4.0.1 / fixed: "release 4.0.1 (vendor changelog); build 3.1.8.10 on the 3.x line (Patchstack)"'
    defect: The vendor changelog's 4.0.1 entry now says CVE-2026-85097 "was fixed earlier in 3.1.8.10 and in 4.0.0" and that 4.0.1 fixes a related, separate upload issue; so 4.0.1 is not the changelog's
      fix for this CVE and 4.0.0 is a fixed release. The sentence was added after publication (the publication-time body of the page read "Full details will follow once the disclosure process is complete"
      and did not name the CVE), so the entry was sourced correctly on 2026-10-12 but is wrong against the vendor channel today.
    ground_truth: '4.0.1, 8 October 2026: "A security issue in the Pro Forms file upload has been fixed. ... Related: CVE-2026-85097, an arbitrary file upload in the same area that was fixed earlier in
      3.1.8.10 and in 4.0.0." (4.0.2, 13 October: "The upload check introduced in 4.0.1 could refuse a perfectly normal image")'
    ground_truth_url: https://bricksforge.io/version-changelog/
    fix: 'Correction record: fixed = 3.1.8.10 (3.x line) and 4.0.0; 4.0.1 adds a related upload hardening and 4.0.2 (2026-10-13) corrects a false rejection in it; advise updating to the current 4.x release;
      reword headline, summary and the vendor-changelog sentence.'
    class: factual-error
  - where: Exposure paragraph
    claim: its changelog gives no affected range, so whether 4.0.0 is affected is not stated
    defect: The vendor now states the CVE was fixed in 4.0.0, so 4.0.0 is stated as not affected (affected range stays <= 3.1.8.9).
    ground_truth: '"CVE-2026-85097, an arbitrary file upload in the same area that was fixed earlier in 3.1.8.10 and in 4.0.0."'
    ground_truth_url: https://bricksforge.io/version-changelog/
    fix: Replace the sentence with the vendor statement that 4.0.0 and 3.1.8.10 carry the fix.
    class: factual-error
  - where: body paragraph 1 and sourcing_note
    claim: Patchstack names 3.1.8.10 as the fixed build of the 3.x line, which the public changelog does not list / "does not list build 3.1.8.10"
    defect: The public changelog now names 3.1.8.10 (in the 4.0.1 entry).
    ground_truth: '"...was fixed earlier in 3.1.8.10 and in 4.0.0."'
    ground_truth_url: https://bricksforge.io/version-changelog/
    fix: Drop the "which the public changelog does not list" clause and the matching sourcing_note sentence.
    class: imprecision
  notes: 'Lead (Previdian evidence quote "Previdian records an exploitation-related signal (poc available)."): verbatim in the publication-time snapshot work/2026-10-12T0256Z-intel/bodies/previdian.md ("Previdian
    records an exploitation-related signal (poc available). This CVE has not been added as a known exploited vulnerability."); the Previdian page has been rewritten since and now labels the CVE "Exploited
    in the wild, High confidence" (attested by The Hacker News and SOCRadar relaying Patchstack). Noted and left, not a defect. CVSS 9.8 matches the CNA record (Wordfence); Patchstack 10.0 is disclosed
    in the body. Not in KEV.'
- entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  verdict: imprecision
  defects:
  - where: Defender takeaway (and the matching evidence quote use is fine)
    claim: CERT-FR says a factory reset on an unpatched end-of-life unit removes the implant but leaves the device vulnerable and almost certainly compromised again
    defect: CERT-FR does not say "implant"; it says a Factory Reset removes "les persistances d'une instance compromise" (the compromised instance's persistence mechanisms).
    ground_truth: '"N''effectuer qu''un Reset Factory est dans ce cas insuffisant, les persistances d''une instance compromise seront supprimées mais l''équipement restera vulnérable et sera certainement
      de nouveau compromis."'
    ground_truth_url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
    fix: Replace "removes the implant" with "removes the compromised instance's persistence".
    class: imprecision
  notes: 'All 58 claims otherwise verified: CERT-FR version history (12/13/16 October), NCSC 13054, AFP, BFMTV, Infosecurity, BleepingComputer, Cooling Post, Blick, Censys figures, Dixell PDF (Last-Modified
    2026-10-13).'
