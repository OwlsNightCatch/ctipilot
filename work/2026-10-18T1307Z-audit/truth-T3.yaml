- entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
  verdict: imprecision
  defects:
  - where: cves[CVE-2026-111357].cvss
    claim: 'cvss: null'
    defect: The CVE record (MITRE CNA, published 2026-10-15, updated 2026-10-16T18:41Z, i.e. before the entry's 2026-10-17 improvement) carries a CVSS 3.1 base score, so the field should not be null.
    ground_truth: 'cvssV3_1 baseScore 7.0, vector CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H (GitHub Advisory Database: "High severity")'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-111357
    fix: Set cvss to "7.0 (CVSS 3.1, CVE record)" in an improvement record.
    class: imprecision
  - where: cves[CVE-2026-104935].fixed; summary; Exposure; sourcing_note
    claim: Fixed builds are 25.1.1.2, 25.1.3.1 and 22.8R2.5 (Rapid7 also lists 25.1.3.0, which CERT-FR counts as affected)
    defect: Ivanti's own CNA record lists 25.1.3.0 as unaffected ("ICS before version 25.1.3.0"), which settles the Rapid7 vs CERT-FR disagreement in Rapid7's favour; the entry leaves it open and omits
      25.1.3.0 from the fixed list (25.1.3.1 as the upgrade target remains safe advice).
    ground_truth: 'CNA ivanti affected.versions status "unaffected": 25.1.3.0, 25.1.3.1, 22.8R2.5, 22.7R2.14; description "Authentication bypass by spoofing in ICS before version 25.1.3.0 ... does not impact
      ICS version 22.7R2.14 or prior"'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-104935
    fix: Add 25.1.3.0 to fixed with the Ivanti CVE record as authority and note that CERT-FR's list is the outlier.
    class: imprecision
  notes: 'Per-CVE authority: Ivanti advisory page (hub.ivanti.com) is a JS shell; the CNA record (cveawg) and CISA KEV (dateAdded 2026-10-13) and CISA alert (WebFetch) verified. CVSS 8.6 (3.1) matches CNA.
    Volexity, Rapid7, CERT-FR (initial version 14 Oct) and CCCS claims all verified.'
