    of October 2026 Exchange SU updates is required)"). Both sentences are verbatim in the publication-time verifier passages (work/2026-10-16T0256Z-intel/verification.iter*.claims.yaml). Page edited since
    publication: noted and left. The two Improvement-section claims that cite the banner (917451cd12, 2072869f8e) are marked unreadable on today''s page; the KB list and symptoms are corroborated by the
    4565382 post. MSRC CVRF builds/CVSS (8.1, 9.3), "Exploitation More Likely", not exploited, not in KEV all verified.'
