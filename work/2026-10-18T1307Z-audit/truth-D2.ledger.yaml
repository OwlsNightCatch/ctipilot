    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "headline"
    kind: frontmatter
    text: "Cisco ISE CVE-2026-20181 + CVE-2026-20190: an unauthenticated credential-harvest primitive feeding authenticated root code execution on the identity plane"
  - claim_id: 67d2eb30e9
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "summary"
    kind: frontmatter
    text: "Cisco Identity Services Engine is not just another exposed appliance — it is the policy brain of network access control in most large Swiss and European public-sector estates: the RADIUS/TACACS+ server behind 802.1X port authentication, the posture/profiling engine, and frequently the AD/identity-policy enforcement …"
  - claim_id: 966eba52a7
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "cves[CVE-2026-20181]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-20181\", \"cvss\": \"9.1\", \"status\": [\"patch-available\"], \"affected\": null, \"fixed\": null, \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 06dca589c6
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "cves[CVE-2026-20190]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-20190\", \"cvss\": \"7.5\", \"status\": [\"patch-available\"], \"affected\": null, \"fixed\": null, \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 8dfddabdde
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: cited
    text: "That is what makes the pair Cisco patched on 2026-06-17 worth a deep read even with no in-the-wild exploitation yet reported ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"]
  - claim_id: a64e017f5d
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: cited
    text: "CVE-2026-20181 (CVSS 9.1, path traversal / CWE-22) is the impact primitive: an *authenticated* administrator can submit a crafted request that escapes the intended directory and executes arbitrary operating-system commands, escalating to root; on single-node deployments the same flaw can also be driven to a denial-of-service ("
    urls: ["https://www.securityweek.com/critical-command-execution-vulnerability-patched-in-cisco-ise/"]
  - claim_id: 2dd3099869
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "Cisco Identity Services Engine is not just another exposed appliance — it is the policy brain of network access control in most large Swiss and European public-sector estates: the RADIUS/TACACS+ server behind 802.1X port authentication, the posture/profiling engine, and frequently the AD/identity-policy enforcement point for both wired and wireless."
  - claim_id: 77c5a5e72a
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "A root shell on an ISE node is therefore not an endpoint compromise; it is control of the authentication plane that decides which devices and users get onto the network."
  - claim_id: 3ff5030d37
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "**The two primitives.** CVE-2026-20190 (CVSS 7.5, improper authorization) is the entry primitive: specific ISE/ISE-PIC APIs fail to enforce authorization, so an unauthenticated remote attacker who can reach the management interface over HTTP can read sensitive data — explicitly including hashed administrator credentials — with crafted requests (`T1190` Exploit Public-Facing Application → `T1212` Exploitation for Credential Access)."
  - claim_id: 1e39e6a39c
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "**Why the chain matters more than either CVE.** On its own, CVE-2026-20181 requires administrator authentication — a meaningful barrier."
  - claim_id: 5a5f46c460
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "CVE-2026-20190 removes that barrier: it hands an unauthenticated attacker the hashed admin credentials, which can then be cracked offline (`T1110.002` Password Cracking) or, depending on the credential material and authentication scheme, replayed (`T1550` Use Alternate Authentication Material)."
  - claim_id: dd7d2c5105
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "With administrator authentication in hand (`T1078` Valid Accounts), the attacker pivots to CVE-2026-20181 for command execution as root (`T1059` Command and Scripting Interpreter → `T1068` Exploitation for Privilege Escalation)."
  - claim_id: e92e6c2981
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "The net effect is a network-reachable, no-interactive-credential path from \"can talk to the ISE management plane\" to \"root on the identity controller.\" From root on ISE, an adversary is positioned to tamper with authentication and authorization policy itself (`T1556` Modify Authentication Process) — issuing or trusting RADIUS responses, weakening 802.1X enforcement, or harvesting credentials traversing the policy engine."
  - claim_id: 31796aa0e7
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "**Exposure and prerequisites.** The only hard prerequisite for the entry primitive is network reachability of the ISE management/API interface; everything after that is consequence."
  - claim_id: f1cbbd9301
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "Cisco states there is **no workaround**."
  - claim_id: 75422d5295
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "Affected trains are fixed in ISE 3.3 Patch 11 and 3.4 Patch 6 (both available now)."
  - claim_id: e7fd9e3895
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "ISE 3.5 is the gap: Patch 3 closes only the unauthenticated read (CVE-2026-20190), and the full fix (Patch 4) is not scheduled until August 2026 — so 3.5 operators carry the authenticated-RCE half for roughly two months and must compensate with exposure reduction."
  - claim_id: f6366bf116
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "**Hunt and detection concepts.** Because there is no public exploit detail yet, detection here is behavioural and access-surface-oriented, not signature-based: - **Management-plane reachability is the first control:** alert on any source outside your defined administration subnets reaching the ISE management/API interface at all."
  - claim_id: 9e783737bb
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "The unauthenticated read only works if the attacker can reach those APIs. - **API-access anomalies:** review ISE application/admin logs for unauthenticated or unexpected requests to the credential-adjacent API endpoints, and for ERS/API request patterns from newly-seen source addresses. - **Administrator-session anomalies:** correlate any administrator CLI/command activity with the set of source addresses and accounts you expect to perform it; a successful chain shows up as admin-context command execution from an unusual origin shortly after anomalous unauthenticated API reads. - **Identity-plane integrity:** baseline expected RADIUS/TACACS+ behaviour and alert on policy or device-admin changes that did not originate from your change process — post-compromise tampering is the high-impact outcome to catch even if the intrusion itself was missed."
  - claim_id: f51e627ea3
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "**Hardening / mitigation (cite Cisco's own guidance).** Apply the fixed patches as the only complete remediation: ISE 3.3 Patch 11 or 3.4 Patch 6 now; for 3.5, apply Patch 3 immediately to remove the unauthenticated credential read and plan the August Patch 4 upgrade."
  - claim_id: 24a377378e
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "Independently of patch state, restrict the ISE management and API interfaces to dedicated, tightly-firewalled administration subnets (out-of-band management VLAN), enforce strong administrator credentials and MFA on admin logon to blunt the offline-cracking step, and monitor the management plane as a tier-0 asset."
  - claim_id: 5d90e458b8
    entry: 2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c
    surface: "body"
    kind: uncited
    text: "Treat ISE, like AD and the PKI, as identity infrastructure whose compromise is a full-network event — segment and instrument it accordingly."
  - claim_id: e6af71e972
    entry: 2026-06-19/cve-2026-20181-cve-2026-20190-cisco-identity-services-engine
    surface: "headline"
    kind: frontmatter
    text: "CVE-2026-20181 / CVE-2026-20190 — Cisco Identity Services Engine: unauthenticated credential read chaining to authenticated root command execution"
  - claim_id: 23466cb551
    entry: 2026-06-19/cve-2026-20181-cve-2026-20190-cisco-identity-services-engine
    surface: "summary"
    kind: frontmatter
    text: "A dense critical-patch cycle landed in widely-deployed CH/EU public-sector infrastructure within 36 h: Cisco ISE, pgAdmin 4, NGINX, and Drupal core. The standout is the Cisco ISE pair (Cisco PSIRT, 2026-06-17): an unauthenticated attacker can read hashed administrator credentials (CVE-2026-20190), then reuse them to reach an authenticated path-traversal command-execution flaw that escalates to root (CVE-2026-20181, CVSS 9.1) — no workaround, and ISE 3.5's full fix slips to August. No in-the-wild exploitation is reported for any of these four advisories."
  - claim_id: 59799d7425
    entry: 2026-06-19/cve-2026-20181-cve-2026-20190-cisco-identity-services-engine
    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch Cisco ISE now and lock the management plane to admin subnets** (§ 2, § 5). Apply ISE 3.3 Patch 11 or 3.4 Patch 6; for ISE 3.5 apply Patch 3 immediately to close the unauthenticated credential read (CVE-2026-20190) and plan the August Patch 4 for CVE-2026-20181. There is no workaround — restrict the management/API interface to an out-of-band admin subnet, enforce MFA on admin logon, and alert on any off-subnet source reaching the ISE APIs."
