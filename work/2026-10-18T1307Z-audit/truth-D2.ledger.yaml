    surface: "summary"
    kind: frontmatter
    text: "SimpleHelp RMM OIDC authentication bypass (CVE-2026-48558, CVSS 10.0) is being actively exploited to deploy the new Djinn infostealer. The server accepts forged OIDC identity tokens without verifying their signature (CWE-347), yielding a full Technician session and bypassing MFA on first OIDC login; Horizon3.ai measured ~14,000 internet-exposed instances with ~1,000 carrying a vulnerable OIDC configuration (Horizon3.ai, 2026-06-12). See the Immediate Action callout below."
  - claim_id: 26a8806da9
    entry: 2026-06-30/cve-2026-48558-simplehelp-rmm-oidc-sso-authentication-bypass
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch or pull internet-exposed SimpleHelp RMM now: CVE-2026-48558 (CVSS 10.0) is an OIDC SSO authentication bypass in SimpleHelp Remote Monitoring and Management: the OIDC callback handler accepts an attacker-forged identity token without verifying its cryptographic signature, granting a full Technician-level session and bypassing MFA, on any instance with an OIDC provider and group-authenticated logins enabled (Horizon3.ai, 2026-06-12). Threat actors are chaining it to deploy the new cross-platform Djinn infostealer via a \"TaskWeaver\" loader that persists through scheduled tasks / launchd plists (BleepingComputer, 2026-06-29)."
  - claim_id: c12de649dc
