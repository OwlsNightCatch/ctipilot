    text: "Where the reverse proxy in front of EMS logs the mTLS state, alert on EMS log records claiming success that do not correspond to a proxy log line with a matched negotiation. - **Unsolicited Remote Access Profile modification.** Alert on any modification to RAP / endpoint-policy XML or its API equivalents that was not initiated from an EMS admin console session in the change-management window. - **Push-from-EMS installers that are unsigned or have anomalous filenames.** EMS-pushed installers that are neither `FortiClientSetup_*.exe` nor a vendor-signed update should never reach a managed endpoint; alert on Sysmon EID 1 where parent process is the FortiClient managed-service binary and child is an unsigned binary with `--silent` install flags."
