    text: ") and CVE-2026-7262 (NULL dereference in Apache map NULL-check —"
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv"]
  - claim_id: 8cbf6c1d58
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    surface: "body"
    kind: cited
    text: "The companion bugs are lower-impact — CVE-2026-7261 needs a session-pinned SOAP server (less commonly deployed), CVE-2026-7262 reaches NULL deref rather than UAF — but they share the same memory-management bug class and the same patch set, suggesting the upstream review pass that produced GHSA-85c2-q967-79q5 covered the whole apache-map handling surface ("
    urls: ["https://www.php.net/ChangeLog-8.php"]
