  - claim_id: 45478dea3d
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "**Vulnerability class and component.** The root flaw, CVE-2026-42231 (GHSA-q5f4-99jv-pgg5, CWE-1321 Prototype Pollution), is a prototype-pollution primitive reachable via crafted XML supplied to the `xml2js` library used by n8n's webhook handler to parse XML request bodies."
  - claim_id: 796bd6fe41
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "By embedding `__proto__` / `constructor.prototype` payloads into the parsed XML, an authenticated user with permission to create or modify workflows can pollute the global JavaScript object prototype on the n8n process."
  - claim_id: 1758e619c2
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "The advisory's stated chain pivots into the n8n Git node's SSH operations: once the prototype is polluted, the Git node's SSH invocation path consumes attacker-controlled values and achieves RCE on the n8n host."
  - claim_id: b4e723d4b1
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "CVE-2026-42232 (GHSA-hqr4-h3xv-9m3r, \"XML Node Prototype Pollution to RCE\") is a companion XML-Node prototype-pollution flaw exercising the same primitive in a second sink."
  - claim_id: 0546fcdbc7
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "The follow-on advisories address additional sinks: CVE-2026-44789 (GHSA-c8xv-5998-g76h) is \"HTTP Request Node Pagination Prototype Pollution to RCE\" — a second prototype-pollution path through the pagination logic; CVE-2026-44790 (GHSA-57g9-58c2-xjg3) is \"Arbitrary File Read via Git Node\" — a separate file-read primitive distinct from the RCE chain; CVE-2026-44791 (GHSA-wrwr-h859-xh2r) is \"XML Node Prototype Pollution Patch Bypass\" — a regression / bypass of the initial xml2js fix."
  - claim_id: 1e2ee8292d
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "The vendor's published CVSS vector for CVE-2026-42231 is `CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H = 9.4` — network attack, low complexity, low privileges required (a workflow editor account), no user interaction, high confidentiality / integrity / availability impact on both the n8n host and subsequent systems."
  - claim_id: eaac2bfd0e
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "**Exploitation prerequisites.** Authenticated access to the n8n instance at the workflow-editor role or higher, plus reachability to a webhook endpoint that accepts XML content-type bodies. n8n self-hosted deployments commonly expose webhook endpoints to the public internet (the Webhook Trigger node is the canonical way to ingest events) — so any compromised editor credential, or any internal user account on an unrestricted n8n instance, is the entry point."
  - claim_id: 7efffcc00e
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "**Patched versions:** the primary chain (`-42231`, `-42232`) is fixed in n8n `1.123.32` / `2.17.4` / `2.18.1`; the follow-on cluster (`-44789`, `-44790`, `-44791`) is fixed in `1.123.43` / `2.20.7` / `2.22.1`."
  - claim_id: 2d40636fa8
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "Operators must apply the **later** branch train to cover the full chain; applying only the initial fixes leaves the pagination prototype-pollution path, the Git-node arbitrary file read, and the XML-node patch-bypass exposed."
  - claim_id: 0081ee6482
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "Upgrade is the only remediation; no workaround."
  - claim_id: b13549911c
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "**Hunt and detection concepts.** Inspect n8n webhook HTTP request bodies (or upstream WAF logs) for XML content-type payloads containing `__proto__`, `constructor.prototype`, or `prototype` literal strings as XML element / attribute names — most legitimate XML payloads do not contain those tokens."
  - claim_id: 4a25322793
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "From an EDR perspective, the high-confidence signal is the n8n process (Node.js `node` parent) spawning unexpected `ssh` or `git` child processes outside of approved Git node workflows; correlate with the user identity that triggered the workflow at the same timestamp."
  - claim_id: dc14682615
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
    surface: "body"
    kind: uncited
    text: "Container deployments should monitor n8n container egress to unfamiliar SSH hosts and unexpected `ssh-keygen` / `~/.ssh/known_hosts` modifications. n8n's own audit log retains workflow create/modify events for the editor account — pivot from any spike in workflow modifications back to the originating account."
  - claim_id: 907ca61bd4
    entry: 2026-05-19/n8n-prototype-pollution-chain-cve-2026-42231-et-al-authentic
