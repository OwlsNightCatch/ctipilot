    surface: "body"
    kind: uncited
    text: "The fake `FortiEndpoint_Patch.exe` name from this campaign deviates from the genuine `FortiClientSetup_*.exe` naming convention. - **Browser-profile-directory writes from non-browser processes.** Sysmon EID 11 (`FileCreate`) targeting `AppData\\Local\\Google\\Chrome\\User Data\\<profile>` (and equivalents), where the source image is not the browser binary itself, the parent process is not a known package manager, and the file extension is `.exe` / `.dll`."
