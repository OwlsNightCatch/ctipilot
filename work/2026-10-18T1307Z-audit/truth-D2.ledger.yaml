    text: "- **EMS management-API access without proper mTLS handshake.** Where the EMS server logs `X-SSL-CLIENT-VERIFY` along with peer-certificate fingerprint, alert on any request carrying `SUCCESS` with no fingerprint or a fingerprint not from the operator-trusted CA."
