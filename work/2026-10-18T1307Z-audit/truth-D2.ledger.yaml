    kind: cited
    text: "n8n is an open-source / fair-code workflow automation platform — visual flow editor, hundreds of \"nodes\" wrapping SaaS APIs, file processing, code execution, Git operations and HTTP calls — increasingly deployed by Swiss/EU public-sector teams as a low-code integration bus, by federal data offices for pipeline orchestration, and by university research groups as a lab automation glue layer. n8n disclosed five Critical CVEs at CVSS 9.4 each on 2026-05-18, split across two patch trains: the primary chain (`-42231` / `-42232`) and a follow-on cluster (`-44789` / `-44790` / `-44791`) addressing additional prototype-pollution and file-read primitives ("
