    surface: "body"
    kind: cited
    text: "The result is a CWE-416 use-after-free with attacker-controlled overwrite of the freed object's vtable / properties, leading to arbitrary code execution as the PHP worker — same process privilege as the PHP-FPM pool ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5", "https://php.watch/versions/8.5/releases/8.5.6"]
