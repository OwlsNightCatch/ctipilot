    urls: ["https://github.com/php/php-src/security/advisories/GHSA-m33r-qmcv-p97q"]
  - claim_id: fd937d9c8a
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
