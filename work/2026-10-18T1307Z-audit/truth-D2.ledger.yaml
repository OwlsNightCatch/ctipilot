    text: "**Vulnerability mechanics.** The Cisco Catalyst SD-WAN Controller (formerly vSmart) exposes a DTLS-based control-plane peering service on UDP/12346 through the `vdaemon` process."
  - claim_id: bb28b375e8
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "During the DTLS handshake, a connecting device presents a certificate and claims a device type in the CHALLENGE_ACK message."
  - claim_id: c48d6ab0ad
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "The `vbond_proc_challenge_ack()` function checks whether the device type is `VBOND` (0) or `VEDGE` (1) before requiring certificate validation, but entirely omits the check for device type `VHUB` (2): if the connecting peer claims to be a vHub, the function immediately sets `peer->authenticated = true` and transitions the peering state to `UP`."
  - claim_id: 1f8ffe0742
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "An attacker with no credentials sends a DTLS ClientHello using a self-signed certificate — no PKI trust required — claims type 2 in the CHALLENGE_ACK, and becomes an authenticated peer in the SD-WAN fabric's eyes."
  - claim_id: b7da69534f
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "From there the attacker has read/write access to all SD-WAN fabric configuration, policy, routing templates, and device credentials."
  - claim_id: 3eaafcb227
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "**Kill chain (UAT-8616 post-exploitation TTPs).** Post-authentication, UAT-8616 follows a structured kill chain mapped to MITRE ATT&CK:"
  - claim_id: dbb3c1c821
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "Godzilla uses AES-128-CBC encrypted HTTP channels; Behinder (\"冰蝎\") uses dynamic key exchange; XenShell is a lightweight Python-based variant targeting Linux. 7."
  - claim_id: 7675dfe971
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "The 10+ additional clusters (#1–#10 in Talos's taxonomy) are exploiting the companion February 2026 CVEs (CVE-2026-20133/128/122) on the same infrastructure since March 2026; they skip the version-downgrade chain and focus on webshell persistence and cryptomining."
  - claim_id: 2cfec8c8b5
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "**Hunt and detection concepts.** All of the following are Observable in SD-WAN Manager and Controller logs: - **SSH key injection:** monitor for new entries in `/home/vmanage-admin/.ssh/authorized_keys`; alert on any file modification events in that path (Linux auditd rule for WRITE on the path, or EDR file-write telemetry on the Controller VM). - **NETCONF anomaly:** monitor NETCONF sessions (TCP/830) originating from Controller processes for unexpected source IPs — legitimate NETCONF clients are managed devices, not arbitrary IPs; any session from an unrecognised IP range is suspicious. - **Control-connection anomaly:** `show sdwan control connections` on the Manager; alert on any active connection whose peer IP is not in the expected device inventory."
  - claim_id: 6b43897415
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "SD-WAN Controller-to-Controller peering shows as VHUB-type — flag unexpected vHub entries. - **Version downgrade:** SD-WAN Manager audit logs record software install and uninstall events; a `downgrade → upgrade` cycle on the same device within hours without a change-management record is a clear UAT-8616 indicator. - **Webshell deployment:** Godzilla/Behinder webshells typically reside in Tomcat application directories on vManage; look for newly created `.jsp` / `.jspx` / `.py` files in `${CATALINA_HOME}/webapps/` and related directories. - **Snort IDS signatures:** 66482–66483 detect CVE-2026-20182 exploitation attempts; 66468–66469 detect CVE-2026-20133; 66461–66462 detect CVE-2026-20122."
  - claim_id: 6771b44c3a
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "**Hardening and mitigation.** There is no software workaround for CVE-2026-20182 — the authentication-bypass function is in the control-plane peering path that cannot be disabled without breaking SD-WAN functionality."
  - claim_id: ff7fcc8d8b
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "Network-level mitigation: restrict access to UDP/12346 to known legitimate Controller and Edge IPs using ACLs or security groups; this does not eliminate risk from compromised WAN-side devices but raises the exploitation bar."
  - claim_id: 412af37c70
    entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
    surface: "body"
    kind: uncited
    text: "Immediate action is upgrade: apply the Cisco-designated fixed releases (20.9.9.1, 20.12.7.1, 20.15.5.2, 20.18.2.2, or 26.1.1.1 per your active release train)."
