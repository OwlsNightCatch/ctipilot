    class: imprecision
  - where: body, 'Detection'
    claim: 'PAN-OS system logs: `globalprotectgateway-config-succ` events authenticated via cookie from non-enrolled endpoints (no prior SCEP
      or Panorama device-cert association).'
    defect: No fetched source names this log event or the SCEP/device-cert discriminator; what the sources do give are cookie logins to the local
