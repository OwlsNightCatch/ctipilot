    pipelines. Exploitation: Splunk changelog 2026-06-18 ''became aware of limited exploitation''; CISA KEV added 2026-06-18, due 2026-06-21 (first
    Splunk entry in KEV per SecurityWeek https://www.securityweek.com/splunk-enterprise-vulnerability-exploited-in-attacks-days-after-disclosure/);
    NCSC-NL NCSC-2026-0198 v1.0.1 (2026-06-19, https://advisories.ncsc.nl/2026/ncsc-2026-0198.html) relays Splunk''s limited and targeted misuse
    and states ''as far as is known code execution is not possible'' (contradicting watchTowr; also covers separate CVE-2026-20251). Mechanism
    (watchTowr 2026-06-12 https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/):
    splunk-postgres sidecar API on 127.0.0.1:5435 (/v1/postgres/recovery/backup and /restore) has no authentication; the main web tier on port
    8000 proxies it at /en-US/splunkd/__raw/v1/postgres/ with Basic credentials that may be empty or username-only; /backup connects Splunk to
    an attacker-controlled PostgreSQL server and dumps it to a traversal path; /restore replays the dump with an injected passfile to log in as
    postgres_admin; an lo_export function writes arbitrary files; overwriting a script Splunk runs periodically gives code execution as the splunk
    user. Default exposure: Splunk Enterprise on AWS has the sidecar installed and enabled by default; manually installed Windows on-prem has
    it not installed or not enabled by default. Public technical analysis and PoC since 2026-06-12 (also The Hacker News 2026-06-13).'
