    an update ... that addresses the vulnerability''): ''Microsoft Defender Elevation of Privilege Vulnerability'' publicly referred to as ''ShieldBreak'',
    Important, CVSS 3.1 7.8 (temporal E:P/RL:O/RC:C), CWE-284, publicly disclosed Yes, exploited No, Exploitation More Likely; last affected engine
    ''1.26070.7'' (MSRC wording), first fixed 1.1.26080.3. Not in CISA KEV (2026-10-16). PoC by Nightmare Eclipse on 2026-08-11/12 (Rapid7 Patch
    Tuesday blog, Cyber Kendra 2026-08-12); LevelBlue SpiderLabs (2026-08-19) reproduced the chain on fully patched Windows 11 24H2 and Windows
    Server 2025 in about 8-12 seconds from a standard user: fake Cloud Files sync root, two conflicting object-manager WD_SCAN symlinks, direct
    MpClient.dll calls, CLFS lock plus symlink swap so Defender''s clean engine writes a DLL into System32, then the WER QueueReporting task loads
    it via wermgr.exe as SYSTEM; LevelBlue''s ATT&CK mapping uses T1574.002. NCSC-CH post 12622 records the CVE (2026-08-17); CERT-FR CERTFR-2026-AVI-1035
