  same_finding: true
  survivor: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
  current_state: 'PAN-OS CVE-2026-0257 (PSIRT https://security.paloaltonetworks.com/CVE-2026-0257, CVE JSON https://security.paloaltonetworks.com/json/CVE-2026-0257;
    initial publication 2026-05-13T16:00Z; fix-timeline updates 05-14 to 05-28; ''Updated exploitation status'' 2026-05-29T17:15Z; FAQ section
    2026-06-03): ''Authentication bypass vulnerabilities in the GlobalProtect portal and gateway ... allows the attacker to bypass security restrictions
    and establish an unauthorized VPN connection'' (CWE-565 Reliance on Cookies without Validation and Integrity Checking). Preconditions: GlobalProtect
    portal or gateway configured AND authentication override cookies enabled (not a default feature) AND the cookie certificate shared or exposed
    (e.g. the portal/gateway HTTPS certificate). Mechanism (Rapid7): cookie is RSA-encrypted with the certificate and ''trusted implicitly, with
    no signature verification'' after decryption, so anyone with the public key can forge a cookie for an arbitrary user. CVSS 4.0 7.8 (CVSS-BT,
    E:A; raised from 4.7 on 2026-05-29 after Rapid7''s PoC). Panorama and Cloud NGFW not impacted. Affected/fixed: PAN-OS 12.1 (fix 12.1.4-h6
    or 12.1.7), 11.2 (11.2.4-h17, 11.2.7-h14, 11.2.10-h7, 11.2.12), 11.1 (11.1.4-h33, 11.1.6-h32, 11.1.7-h6, 11.1.10-h25, 11.1.13-h5, 11.1.15),
    10.2 (10.2.7-h34, 10.2.10-h36, 10.2.13-h21, 10.2.16-h7, 10.2.18-h6); older unsupported versions: upgrade; Prisma Access 10.2.0-10.2.10-h*
    (fix 10.2.10-h36) and 11.2.0-11.2.7-h* (fix 11.2.7-h13). After the upgrade GlobalProtect users re-authenticate once (cookie regenerated ''using
    a more secure method''). Workarounds: use a certificate dedicated exclusively to authentication-override cookies (never the portal/gateway
    certificate or one shared with other features), or uncheck the Authentication Override options (generate and accept cookie) on portal and
    gateway. Exploitation: PSIRT ''limited exploit attempts on unpatched PAN-OS devices without mitigations applied''; Rapid7 (https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/,
    2026-05-29): earliest 2026-05-17, cookie logins to the local admin account from Vultr (GP-CLIENT, Linux) then 2026-05-21 from Dromatics Systems
    (DESKTOP-GP01, Windows), spoofed MAC aa:bb:cc:dd:ee:ff in both waves, successful tunnels with POSTs to /ssl-vpn/hipreport.esp and /ssl-vpn/getconfig.esp,
    no lateral movement seen; PoC (Rapid7, sfewer-r7) public 2026-05-29; Unit 42 2026-06-09: unidentified actor, small share of probed devices
    established sessions, no post-access activity identified; Arctic Wolf 2026-06-11: larger wave from 2026-05-30 with Impacket-style SMB/NTLM
    reconnaissance from the VPN client address; Arctic Wolf 2026-07-20: June 2026 intrusions ending in Qilin ransomware, all via CVE-2026-0257;
    NCSC-CH advisory 12605 (2026-06-01, update 06-16): ''Actively Exploited, Proof of Concept Available''. CISA KEV: added 2026-05-29, due 2026-06-01,
    knownRansomwareCampaignUse ''Known''.'
