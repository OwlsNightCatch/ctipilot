  current_state: 'CVE-2026-42945 (''NGINX Rift''): heap buffer overflow (CWE-122) in ngx_http_rewrite_module / src/http/ngx_http_script.c, F5
    CNA record https://cveawg.mitre.org/api/cve/CVE-2026-42945 (published 2026-05-13T14:12Z, updated 2026-09-10) and F5 advisory K000161019 (myF5,
    JS shell, not machine-readable); nginx.org https://nginx.org/en/security_advisories.html lists it as ''Buffer overflow in the ngx_http_rewrite_module,
    Severity: medium, Not vulnerable: 1.31.0+, 1.30.1+, Vulnerable: 0.6.27-1.30.0'' (nginx.org''s own ''medium'' vs F5''s CVSS 4.0 9.2 critical
    is an unsurfaced difference). CVSS 4.0 9.2 (AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H) and CVSS 3.1 8.1 (AV:N/AC:H/...). Trigger (CNA text):
    ''the rewrite directive is followed by a rewrite, if, or set directive and an unnamed PCRE capture (for example, $1, $2) with a replacement
    string that includes a question mark (?)''; root cause per depthfirst: is_args set by ngx_http_script_start_args_code is never reset, the
    length pass uses a zeroed sub-engine, the copy pass escapes (+, %, & grow to three bytes) and overflows. Impact: worker crash and restart;
    code execution ''on systems with ASLR disabled or when the attacker can bypass ASLR'' (CNA wording as updated 2026-09-10; the original and
    NCSC-CH said ASLR disabled only). Affected/fixed: NGINX Open Source 0.6.27 to 1.30.0, fixed 1.30.1 / 1.31.0; NGINX Plus R32 (fixed R32 P6)
    and R36 (fixed R36 P4), R37 unaffected (CNA); per depthfirst also Instance Manager 2.16.0-2.21.1, F5 WAF for NGINX 5.9.0-5.12.1, App Protect
    WAF 4.9.0-4.16.0 / 5.1.0-5.8.0, F5 DoS for NGINX 4.8.0, App Protect DoS 4.3.0-4.7.0, Gateway Fabric 1.3.0-1.6.2 / 2.0.0-2.5.1, Ingress Controller
    3.5.0-3.7.2 / 4.0.0-4.0.1 / 5.0.0-5.4.1 (Security Affairs: BIG-IP, F5OS, Distributed Cloud not affected). Workaround: replace unnamed captures
    with named captures. Disclosure (depthfirst timeline https://depthfirst.com/research/nginx-rift-achieving-nginx-rce-via-an-18-year-old-vulnerability):
    found 2026-04-18, reported 2026-04-21, NGINX confirmed 04-24, RCE PoC existence notified 04-28, PoC shared 05-05, F5 advisory and blog 2026-05-13;
    credit Zhenpeng (Leo) Lin of depthfirst. PoC public (github depthfirstdisclosures/nginx-rift per depthfirst and NCSC-CH). NCSC-CH advisory
    12575 (2026-05-15): ''Current exploitation status: UNKNOWN, Proof of Concept Available''. Exploitation: VulnCheck honeypots recorded exploitation
    attempts, reported by The Hacker News on 2026-05-17 (https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html: ''exploitation
    attempts detected against its honeypot networks. The nature of the attack activity and the end goals are presently unknown''); CISA ADP SSVC
    at 2026-05-13: Exploitation none; NOT in CISA KEV (catalogue 2026-10-16). Related but distinct: CVE-2026-42533 (nginx PCRE capture clobber,
    entry 2026-07-20) and SAP Note 3773203 (group 2b).'
