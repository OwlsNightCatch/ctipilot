    ground_truth: 'Rapid7: ''suspicious cookie authentication to the local admin account''; ''POST requests to /ssl-vpn/hipreport.esp and /ssl-vpn/getconfig.esp
      in the cases where a VPN tunnel was successfully established''.'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Anchor detection on cookie-method gateway-auth logins to the local admin account from hosting-provider IPs with generic client names,
      then the two ESP requests.
    class: imprecision
  - where: body, 'Exploitation pattern' and state
    claim: Wave 1 (18 May) ... Rapid7 observed successful VPN session establishment but no confirmed lateral movement
    defect: 'Rapid7''s earliest observed exploitation is 2026-05-17 (18 May is the alert time of the log shown). The entry is also stale today:
