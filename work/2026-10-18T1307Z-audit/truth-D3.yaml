  survivor: 2026-05-25/cve-2026-26980-ghost-cms-content-api-unauthenticated-blind-s
  current_state: 'Ghost CMS CVE-2026-26980 (GitHub/TryGhost advisory GHSA-w52v-v783-gw97 https://github.com/advisories/GHSA-w52v-v783-gw97, published
    2026-02-16T18:04Z, updated 2026-06-08): SQL injection in the Content API slug-filter ordering (SentinelOne: raw slug values interpolated into
    a SQL CASE clause); unauthenticated attackers can read arbitrary database data, incl. admin API keys. Vulnerable: Ghost v3.24.0 (released
    2020-07-10) through v6.19.0; fixed in 6.19.1 (GitHub release 2026-02-16T16:54Z https://github.com/TryGhost/Ghost/releases/tag/v6.19.1; CVE/NVD
    published 2026-02-20; BleepingComputer and XLab give 19 Feb for ''fix release''/''public disclosure'', which is not the vendor release date).
    CVSS 3.1 9.4 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L (GitHub CNA); NVD''s own score is 7.5 (C:H/I:N/A:N) (https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-26980).
    Vendor guidance: ''There is no application-level workaround. The Content API key is public by design, so restricting key access does not mitigate'';
    temporary reverse-proxy/WAF block of Content API requests containing slug%3A%5B or slug:[ in the filter (may break legitimate slug filters);
    review staff users and rotate keys; discoverer Nicholas Carlini using Claude. Exploitation: XLab/Qianxin (https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/,
    2026-05-21): first seen 2026-05-07, 156 victim domains 05-10, 700+ domains 05-17 (universities incl. Harvard, Oxford, Auburn; BleepingComputer
    and SecurityWeek add DuckDuckGo), at least two competing groups; attackers steal the Admin API key via the SQLi, use PUT /ghost/api/admin/posts/:id/
    to append a JavaScript loader to articles, a cloaking script (Adspect-derived) fingerprints visitors and serves a fake Cloudflare verification
    iframe; the page silently downloads update.zip (setTimeout) while the pasted Win+R command runs cmd /c move + tar -xf + start /min update.bat
    from %TEMP%; update.bat uses hidden PowerShell Invoke-WebRequest to fetch a DLL run by rundll32 (export Begin); later stage UtilifySetup.exe,
    an Inno Setup / Electron app (setLoginItemSettings persistence, 30-second beacon, runs JS or executables). Not in CISA KEV (catalogue 2026-10-16).
    Not independently dated: BleepingComputer''s claim that SentinelOne reported in-the-wild exploitation on 27 Feb is not supported by SentinelOne''s
    own page (published and last modified 2026-02-20).'
