- entry: 2026-05-30/cve-2026-0257-pan-os-globalprotect-pre-auth-vpn-authenticati
  verdict: factual-error
  defects:
  - where: body, 'Affected and patched versions'
    claim: 'Affected: PAN-OS 10.2.x < 10.2.7-h34 (and maintenance tracks), 11.1.x < 11.1.4-h33, 11.2.x < 11.2.4-h17, 12.1.x < 12.1.4-h6. Not affected:
      Panorama, Cloud NGFW, Prisma SD-WAN, PA-Series managed by Panorama with no local GP config, PAN-OS < 10.2.x (EOL). ... Prisma Access 10.2
      and 11.2: Palo Alto is rolling fixes; check Prisma Access status portal.'
    defect: Wrong boundaries and carve-outs. Affected means below the fixed build of each train (12.1 below 12.1.4-h6 and 12.1.7; 11.2 below 11.2.4-h17,
      11.2.7-h14, 11.2.10-h7, 11.2.12; 11.1 up to below 11.1.15; 10.2 up to below 10.2.18-h6), so a single boundary such as '11.1.x < 11.1.4-h33'
      clears the whole 11.1.5-11.1.14 range. Only Panorama and Cloud NGFW are stated as not impacted; Prisma Access 10.2/11.2 IS affected with
      named fixed builds; older unsupported PAN-OS is told to upgrade, not declared unaffected; Prisma SD-WAN and Panorama-managed carve-outs
      appear in no source.
    ground_truth: 'PSIRT CVE record: PAN-OS affected from 12.1.0, 11.2.0, 11.1.0, 10.2.0; Prisma Access 10.2.0 <10.2.10-h36 and 11.2.0 <11.2.7-h13;
      ''Panorama and Cloud NGFW are not impacted by these issues''; Solution: ''All older unsupported PAN-OS versions: Upgrade to a supported
      fixed version.'''
    ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
    fix: 'Replace with the vendor''s per-train table (fixed: 12.1.4-h6/12.1.7; 11.2.4-h17/11.2.7-h14/11.2.10-h7/11.2.12; 11.1.4-h33/11.1.6-h32/11.1.7-h6/11.1.10-h25/11.1.13-h5/11.1.15;
      10.2.7-h34/10.2.10-h36/10.2.13-h21/10.2.16-h7/10.2.18-h6; Prisma Access 10.2.10-h36, 11.2.7-h13) and drop the invented carve-outs.'
    class: factual-error
  - where: body, 'Exploitation pattern'
    claim: The gap between the exploitation waves (18 and 21 May) and the PoC/KEV date (29 May) implies the actor possessed private pre-disclosure
      knowledge of the vulnerability.
    defect: 'Contradicted by the timeline: Palo Alto published the advisory and first-wave fixes on 2026-05-13, four days before the first observed
      exploitation (2026-05-17); exploitation preceded the PoC/KEV date but followed public disclosure, so ''pre-disclosure knowledge'' is unsupported.'
    ground_truth: 'PSIRT timeline ''Initial publication'' 2026-05-13T16:00Z; Rapid7: ''On May 13, 2026, Palo Alto Networks published a security
      advisory ... The earliest date for observed exploitation was May 17, 2026.'' Arctic Wolf: ''first publicly disclosed by Palo Alto Networks
      on May 13, 2026''.'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Delete the sentence or say exploitation began four days after the advisory and about twelve days before the public PoC.
    class: factual-error
  - where: body, 'Background'
    claim: Palo Alto's own security advisories (AA23-250A, AA24-075A) have repeatedly highlighted GlobalProtect as a target surface; this vulnerability
      is the most directly exploitable advisory in that series.
    defect: AA23-250A is a CISA/FBI/CNMF joint advisory on CVE-2022-47966 (Zoho) and CVE-2022-42475 (FortiOS) that does not mention Palo Alto
      or GlobalProtect; AA24-075A does not resolve (404). They are not Palo Alto advisories, and 'most directly exploitable' has no source.
    ground_truth: 'CISA AA23-250A: ''Multiple Nation-State Threat Actors Exploit CVE-2022-47966 and CVE-2022-42475'' (2023-09-07); neither Palo
      Alto Networks nor GlobalProtect appears on the page. https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-075a returns HTTP 404.'
    ground_truth_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-250a
    fix: Delete the sentence.
    class: factual-error
  - where: body, 'Vulnerability mechanics' and 'Hardening / mitigation'
    claim: issue signed cookies ... uses that same certificate to sign and encrypt session tokens ... (b) generate a dedicated certificate for
      GlobalProtect used exclusively for that service and not shared with the HTTPS management or any other feature
    defect: The cookie is RSA-encrypted with the certificate and decrypted with no signature check (that is the flaw); the cookie certificate
      must be a separate certificate used only for authentication-override cookies, not a dedicated certificate for the GlobalProtect service,
      so mitigation (b) as written can leave the cookie certificate shared with the portal/gateway HTTPS service and the host exploitable.
    ground_truth: 'Vendor workaround: ''Generate a new certificate exclusively for authentication override cookies and store it securely. Do not
      reuse the portal or gateway certificate, and do not share this certificate with other features or users.'' Rapid7: ''decrypted using a private
      key. The decrypted content is then trusted implicitly, with no signature verification of any kind occurring after decryption.'''
    ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
    fix: Say 'use a dedicated certificate exclusively for authentication-override cookies, distinct from the portal/gateway HTTPS certificate'
      and drop 'signed'.
    class: factual-error
  - where: body, 'Hardening / mitigation' (a)
    claim: disable authentication override cookies entirely in the GlobalProtect gateway and portal settings (`Authentication` > `No Cookie Required
      on Pre-Logon Connections`)
    defect: Invented UI path; the vendor's instruction is to uncheck the Authentication Override options (generate and accept cookie) on the portal
      agent configuration and gateway client settings. The 24-hour trigger and the `show system info` / `show sslmgr-store` verification step
      appear in no source.
    ground_truth: '''Disable Authentication Override: Uncheck the Authentication Override options (for generating and accepting cookies) in the
      GlobalProtect portal and gateway configuration.'' Portal path: Network > GlobalProtect > Portals > Agent > Authentication; Gateway: Network
      > GlobalProtect > Gateways > Agent > Client Settings > Authentication Override.'
    ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
    fix: Use the vendor's checkboxes and paths; delete the unsourced verification commands.
    class: factual-error
  - where: body, 'MITRE ATT&CK mapping' and 'Exploitation pattern'
    claim: 'Lateral movement: T1021.001 (... expected next step once inside the network segment); T1046 (Network Service Discovery — attacker-controlled
      GP-CLIENT enumerating accessible segments). / Both used a deliberately spoofed, easily-recognisable MAC address pattern — suggesting deliberate
      source-normalisation to defeat MAC-based network anomaly detection.'
    defect: Rapid7 and Unit 42 report no lateral movement or post-access behaviour; GP-CLIENT enumeration and RDP are invented. The MAC-evasion
      purpose is the entry's own speculation (the same MAC and a Windows 10 Pro client string are hard-coded in the public PoC per Unit 42). Forged
      cookies map to T1606.001 / T1550.004 rather than T1539 (theft); T1036.005 for a machine name is unsupported.
    ground_truth: 'Rapid7: ''we did not observe any indication of successful lateral movement from the devices''; Unit 42: ''No post-access behavior
      or lateral movement has been identified as of this time''; ''search ... matching the following hard-coded client configuration values from
      the PoC code''.'
    ground_truth_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
    fix: Map only T1190/T1133 and T1606.001 (forged auth-override cookie); delete T1021.001, T1046, T1036.005 and the evasion-intent sentence.
    class: factual-error
  - where: body, 'Vulnerability mechanics'
    claim: shares an X.509 certificate with another co-hosted service — most commonly the HTTPS management or captive-portal service ... a configuration
      that has historically been documented in Palo Alto's own deployment guides as a shortcut for certificate management
    defect: Rapid7 names the portal/gateway HTTPS service as the example; 'management or captive-portal service', 'most commonly' and the claim
      about Palo Alto deployment guides have no source; also the 'only pre-condition' sentence omits that authentication override cookies must
      be enabled, which is not a default.
    ground_truth: 'Rapid7: ''reused the certificate for encrypting and decrypting cookies with another feature, such as the HTTPS service of the
      portal or gateway''; ''This is not a feature that is enabled by default.'' PSIRT: ''applies ... when authentication override cookies are
