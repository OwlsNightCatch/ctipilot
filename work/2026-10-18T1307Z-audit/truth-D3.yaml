    ground_truth: 'Rapid7: ''The earliest date for observed exploitation was May 17, 2026.'' Arctic Wolf (2026-06-11): ''increase ... began on
      May 30, 2026 ... follow-on Impacket activity soon after VPN tunnel establishment''. KEV: knownRansomwareCampaignUse ''Known''.'
    ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
    fix: Fold into the survivor carrying the later exploitation and ransomware facts.
    class: imprecision
  - where: frontmatter
    claim: 'priority: notable; summary ''Background...''; evidence quote ''Background.''; classification absent; techniques: []; affected_products:
      []; cves[].affected/fixed null'
    defect: Migrated deep dive with a placeholder summary and evidence, no rating, no ATT&CK ids in metadata, no structured versions; priority
      notable while the twin entry for the same CVE is high with KEV ransomware flag.
    ground_truth: 'KEV record CVE-2026-0257: dateAdded 2026-05-29, dueDate 2026-06-01, knownRansomwareCampaignUse ''Known''.'
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
