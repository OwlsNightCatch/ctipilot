    in the User-ID Authentication Portal (Captive Portal) service of PAN-OS; unauthenticated attacker executes arbitrary code as root on PA-Series
    and VM-Series firewalls with crafted packets. ''Prisma Access, Cloud NGFW and Panorama appliances are not impacted.'' CVSS 4.0 9.3 (CVSS-BT,
