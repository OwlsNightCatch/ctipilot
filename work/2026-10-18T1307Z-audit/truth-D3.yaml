    interface in a zone where untrusted traffic can ingress. Exploitation: PSIRT ''Limited exploitation has been observed targeting ... User-ID
    Authentication Portals that are exposed to untrusted IP addresses and/or the public internet''; Unit 42 (https://unit42.paloaltonetworks.com/captive-portal-zero-day/,
