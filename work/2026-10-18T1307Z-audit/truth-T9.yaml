- entry: 2026-09-29/bitget-hot-wallet-theft-north-korea-nexus
  verdict: factual-error
  defects:
  - where: evidence[0]; body paragraph 1
    claim: '"the attacker may have exploited a vulnerability in a third-party security product to potentially obtain high-level internal credentials," then used those credentials "to impersonate authorized
      activity and send fraudulent withdrawal commands to the wallet system,"'
    defect: 'LEAD CONFIRMED: the quoted wording is not a contiguous passage of the cited Bitget page as it reads today. Bitget has revised the page: it now states the attacker ''exploited a vulnerability
      in a third-party security product to obtain high-level internal credentials'' and, in the findings section, ''a zero-day vulnerability in a third-party security product''; neither the hedges ''may
      have'' / ''potentially'' nor ''to impersonate authorized activity'' remain. The entry''s hedged framing of Bitget''s own conclusion is outdated (Bitget, THN 2026-09-28, Mandiant and SlowMist all state
      the compromise as found).'
    ground_truth: 'Bitget page: ''The latest investigation found that the attacker exploited a vulnerability in a third-party security product to obtain high-level internal credentials. The attacker then
      used those credentials to send fraudulent withdrawal commands to the wallet system, resulting in abnormal transfers that bypassed existing risk controls.'''
    ground_truth_url: https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response
    fix: Replace evidence[0] and the body quotation with the current wording (or attribute the hedged wording to the page's 2026-09-27 version) and drop 'may have' / 'potentially' from the narration.
    class: factual-error
  - where: body paragraph 1, last sentence
    claim: the vulnerable third-party product's vendor was notified and the affected functionality disabled pending a fix.
    defect: 'The cited Bitget page now says the underlying vulnerability was remediated; ''pending a fix'' reflects the earlier state (THN 2026-09-28: ''Bitget has not said whether the vendor has released
      a fix'').'
    ground_truth: 'Bitget page: ''The affected systems were isolated and the underlying vulnerability was remediated. ... the relevant third-party vendor was notified and affected functionality was disabled.'''
    ground_truth_url: https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response
    fix: Say the vendor was notified, the affected functionality disabled, and Bitget states the vulnerability was remediated.
    class: imprecision
- entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
  verdict: factual-error
  defects:
  - where: cves[0].epss
    claim: 'epss: "0.81"'
    defect: 'The field must carry the FIRST.org EPSS probability in [0, 1]; 0.81 reads as 81% and is a percent-scale figure copied from ENISA EUVD (the 2026-09-30 research note records ''EPSS 0.81'' from
      EUVD). EUVD''s epss field is on a percent scale: today it shows 1.24 while FIRST''s probability for the same CVE is 0.01242 (percentile 0.687). The corresponding probability on the entry date would
      have been about 0.008, not 0.81.'
    ground_truth: 'FIRST EPSS API 2026-10-16: {"cve":"CVE-2026-86950","epss":"0.012420000","percentile":"0.686880000"}; ENISA EUVD record EUVD-2026-88445: "epss":1.24'
    ground_truth_url: https://api.first.org/data/v1/epss?cve=CVE-2026-86950
    fix: Set epss to the FIRST probability (null if not re-looked-up; 0.0124 as of 2026-10-16) via an internal correction record.
    class: factual-error
  - where: body paragraph 1
    claim: (low confidence) CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-09-29 and attached its forensic-triage requirements to the listing
    defect: In the KEV record as read on 2026-10-16 (catalog 2026.10.16) the forensicTriage field for CVE-2026-86950 is "No"; the 'Forensics Triage Requirements' appear only in the BOD 26-04 boilerplate
      of requiredAction/notes that every new entry carries, so the sentence suggests a triage flag the record does not set (the research note of 2026-09-30 had recorded forensicTriage=Yes, so the flag may
      have changed).
    ground_truth: 'KEV: {"cveID":"CVE-2026-86950","dateAdded":"2026-09-29",...,"forensicTriage":"No"}'
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: State only that CISA added the flaw on 2026-09-29, or say the record's forensic-triage flag is set as the catalog shows when re-read.
    class: imprecision
