entries:
- entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
  verdict: imprecision
  defects:
  - where: summary; body paragraph 1
    claim: an independent cloud service and an independent data-exchange platform intended to host administration, industry and critical-infrastructure data inside Switzerland
    defect: 'Drops the motion text''s qualifier ''where possible'': the cited Laux Lawyers page (and the entry''s own evidence[] translation) say the platforms are meant to host the data inside Switzerland
      where possible, not as an unqualified residency requirement.'
    ground_truth: 'Laux Lawyers: ''Vorgesehen sind insbesondere ein eigenständiger Cloud-Dienst sowie eine unabhängige Austauschplattform, um Daten von Unternehmen, Verwaltung und kritischen Infrastrukturen
      möglichst in der Schweiz zu hosten.'''
    ground_truth_url: https://www.lauxlawyers.ch/it-recht-in-der-herbstsession-2026/
    fix: Add 'where possible' after 'inside Switzerland' in the summary and the body sentence.
    class: imprecision
- entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
  verdict: imprecision
  defects:
  - where: body, Defender takeaway
    claim: 'Run 9.5.1 or later on every deployment (Email Protection Gateway at least 9.4.1 for CVE-2026-54154), and put the open question to Kiteworks Support in writing: ... beyond its notice to customers
      with self-hosted Advanced Forms to contact Customer Support ([Kiteworks, 2026-09-27](https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/))'
    defect: The sentence's only citation, the 2026-09-27 press release, carries the Advanced Forms support notice but neither CVE-2026-54154 nor the 9.4.1 bound; the CVE and version come from GHSA-5xhq-9wq3-rvj6
      (cited only in the 2026-10-02 section). Citation does not vouch for the CVE/9.4.1 clause.
    ground_truth: 'Press release: ''Customers with self-hosted Advanced Forms should contact Customer Support for assistance.'' (no CVE id, no 9.4.1). GHSA-5xhq-9wq3-rvj6: CVE-2026-54154, ''Upgrade to Kiteworks
      Email Protection Gateway 9.4.1 or later.'''
    ground_truth_url: https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/
    fix: 'Split the sentence: cite GHSA-5xhq-9wq3-rvj6 after the 9.4.1 / CVE-2026-54154 clause and keep the press-release citation for the Advanced Forms notice.'
    class: imprecision
  - where: body paragraph 1
    claim: and recommended shutting systems down even where they are not directly internet-facing, since the possible access route is unconfirmed.
    defect: Clause follows the Heise citation with no citation of its own and attributes the recommendation and rationale to the CISO email; Heise states it as KiteWorks recommending (and 'It cannot be
      said with certainty what potential access routes there might be'), BleepingComputer and TechCrunch carry the same point.
    ground_truth: 'Heise: ''KiteWorks recommends shutting down the servers even before this time – even if they are not accessible from the internet. It cannot be said with certainty what potential access
      routes there might be.'''
    ground_truth_url: https://www.heise.de/en/news/Imminent-Zero-Day-Attack-KiteWorks-Urges-Customers-to-Shut-Down-Servers-11466375.html
    fix: Add the Heise citation after the clause (or attribute it to Heise's report of the email).
    class: imprecision
  - where: '## Update 2026-10-02T04:58:16Z, second sentence'
    claim: (low confidence) BleepingComputer, quoting the advisory, describes input-handling flaws in publicly reachable endpoints that potentially allowed unauthenticated code execution and, by chaining
      local weaknesses, escalation to root
    defect: BleepingComputer does attribute the passage to a 'Wednesday advisory' linked to GHSA-5xhq-9wq3-rvj6, but that GHSA (page and GitHub API) carries only 'Multiple issues were addressed with improved
      input validation.' and no such passage; the chain-to-root description is BleepingComputer's only.
    ground_truth: 'GHSA-5xhq-9wq3-rvj6 description: ''**Impact:** A remote attacker may be able to execute arbitrary code with root privileges. **Description:** Multiple issues were addressed with improved
      input validation.'''
    ground_truth_url: https://api.github.com/repos/kiteworks/security-advisories/security-advisories/GHSA-5xhq-9wq3-rvj6
    fix: Say 'BleepingComputer, quoting a Kiteworks statement' (or drop 'quoting the advisory') since the linked GHSA does not carry the passage.
    class: imprecision
- entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
  verdict: imprecision
  defects:
  - where: body paragraph 2
    claim: (low confidence) The extortion actor behind the breach, self-named "LPG Group"
    defect: States as fact that LPG Group is behind the breach; the identity rests on the group's own extortion emails, heise says the intruders were 'bisher unbekannte Kriminelle' and that the group 'bekennt
      sich' to the acts, and Flink has not named an actor.
    ground_truth: 'heise: ''In diesen ... bekennt sich eine bisher recht unbekannte Bande namens „LPG Group“ zu den Taten.'''
    ground_truth_url: https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html
    fix: Say 'The extortion actor claiming the breach, self-named LPG Group'.
    class: imprecision
  - where: body paragraph 3
    claim: Abuse reporting to the group's mail provider curtailed the flood of messages
    defect: 'Drops heise''s qualifiers: it is Flink''s account, the flood was only ''vorerst'' (for now) contained, and heise adds the extortionists may seek other routes; sentence also carries no citation
      of its own.'
    ground_truth: 'heise: ''Laut Flink wurde über eine Abuse-Mitteilung beim von der Bande genutzten Mailprovider die Flut der Schreiben auch vorerst eingedämmt, nicht auszuschließen sei aber, dass sich
      die Erpresser andere Wege suchen.'''
    ground_truth_url: https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html
    fix: Write 'According to Flink, an abuse report to the mail provider curtailed the flood for now' and cite heise.
    class: imprecision
  - where: Defender takeaway
    claim: (low confidence) treat any wave of individually-addressed extortion emails referencing a real breach as corroboration of that breach's scope, not as unrelated spam.
    defect: No cited source says extortion emails corroborate scope; the entry itself reports that Flink did not confirm the claimed 1 million customers and that heise cannot size the German wave. Emails
      corroborate at most that an actor holds some data.
    ground_truth: 'NL Times: ''The total number of affected customers was not confirmed by Flink''; heise: ''Die Zahl der kontaktierten Kunden in Deutschland lässt sich damit bisher schlecht einschätzen.'''
    ground_truth_url: https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data
    fix: Replace 'scope' with 'existence' (corroboration that an actor holds data), or drop the clause.
    class: imprecision
- entry: 2026-09-27/pentagon-dmdc-military-personnel-data-breach-unencrypted-ssn
  verdict: imprecision
  defects:
  - where: headline; body paragraph 1
    claim: (low confidence) A vulnerable Pentagon HR file server sat unencrypted and reachable for nine months before anyone noticed
    defect: /
    ground_truth: a government's central personnel-data store kept identity numbers unencrypted and readable for nine months before discovery
    ground_truth_url: The nine months is the window of unauthorized access (Oct 2025 to 16 Jul 2026); no source says how long the data had been unencrypted or that the server was externally 'reachable'
      (the entry's own sourcing note says reachability is not reported).
    fix: 'CNN: ''beginning last October, but it wasn''t until nine months later, in July, that the Pentagon discovered and remediated the issue'' and ''The stolen data wasn''t encrypted, according to the
      letter.'''
    class: imprecision
  - where: Defender takeaway
    claim: check that central personnel and HR data stores encrypt identifying fields at rest, which CNN notes is standard security practice and which DMDC's server lacked
    defect: CNN says only that the stolen data was not encrypted and that encrypting sensitive data is standard practice; 'at rest' and 'identifying fields' are the entry's gloss, and no source says encryption
      at rest would have stopped access through the file-sharing vulnerability.
    ground_truth: 'CNN: ''The stolen data wasn''t encrypted, according to the letter. Encrypting sensitive data is a standard security practice.'''
    ground_truth_url: https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach
    fix: 'Mirror CNN: ''encrypt sensitive personnel data, which CNN notes is standard practice and which the stolen data lacked''.'
    class: imprecision
- entry: 2026-09-27/qbusoft-medyc-poland-healthcare-breach-fingerprint-actor
  verdict: imprecision
  defects:
  - where: sources[2].date; body paragraph 2 citation label
    claim: '[TVP World, 2026-09-26](https://tvpworld.com/95581628/poland-hit-by-cyberattack-weeks-after-19-million-medical-records-breach)'
    defect: 'The citation date does not equal the source''s own publication date: TVP World''s JSON-LD datePublished is 2026-09-25T10:35:00+02:00 (the DataBreaches.net repost is 2026-09-26).'
    ground_truth: 'TVP World JSON-LD: "datePublished": "2026-09-25T10:35:00+02:00"'
    ground_truth_url: https://tvpworld.com/95581628/poland-hit-by-cyberattack-weeks-after-19-million-medical-records-breach
    fix: Change the TVP World source date and the body citation label to 2026-09-25.
    class: imprecision
- entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  verdict: imprecision
  defects:
  - where: summary; cves[0]; body paragraph 1; Defender takeaway
    claim: a .NET deserialization flaw in Telerik UI for ASP.NET AJAX's RadAsyncUpload feature, patched since version 2020.1.114 but still reachable on unpatched IIS deployments
    defect: /
    ground_truth: patch to 2020.1.114 or later now
    ground_truth_url: 'Omits the vendor''s stated exploitation prerequisites and fix semantics: Telerik''s KB says exploitation needs the attacker to break RadAsyncUpload encryption (or know the custom
      keys) AND type whitelisting not enabled; 2020.1.114 only enables whitelisting by default, and the vendor still says to apply the recommended security settings on 2020.1.114 and later. The entry presents
      a plain pre-auth, version-bound flaw and states no exposure discriminator.'
    fix: 'Telerik KB: ''Prerequisites for an Attack: An attacker can break the RadAsyncUpload encryption (or have prior knowledge of your custom encryption keys) and stage a malicious request. The type
      whitelisting feature of RadAsyncUpload is not enabled''; table: ''R1 2020 (2020.1.114) and later | Not possible through RadAsyncUpload, unless the attacker has access to your encryption keys | The
      feature is enabled by default | Apply the recommended security settings.'''
    class: imprecision
  - where: Defender takeaway
    claim: where patching must wait, restrict or disable the RadAsyncUpload handler and monitor for the VirtualPathProvider-registration pattern described above
    defect: The interim control 'restrict or disable the RadAsyncUpload handler' appears in no cited source (AhnLab's mitigation list is upgrade to 2020.1.114 or later plus the process and file checks);
      the vendor's interim control is the recommended security settings (custom encryption keys, type whitelisting).
    ground_truth: 'AhnLab mitigation: ''Upgrade Telerik UI for ASP.NET AJAX to a version that includes the Vulnerability Patch ... Telerik UI version: 2020.1.114 Or later''; Telerik KB: ''Apply the recommended
      security settings.'''
    ground_truth_url: https://asec.ahnlab.com/en/95561/
    fix: Replace with the vendor's recommended security settings (cited to Telerik) or drop the unsourced workaround.
    class: imprecision
- entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
  verdict: imprecision
  defects:
  - where: headline; tags
    claim: (low confidence) Citrix confirms in-the-wild exploitation of two default-configuration NetScaler zero-days and publishes no workaround
    defect: Only CVE-2026-88771 applies to every deployment in default configuration; Citrix's precondition for CVE-2026-88772 is 'DTLS configuration enabled' (enabled by default only on VPN vServers; other
      virtual servers vulnerable only if configured as type DTLS), which the entry's own body states. The headline lumps both as default-configuration.
    ground_truth: 'Citrix CTX697096: ''CVE-2026-88772 | Precondition: DTLS configuration enabled on NetScaler ADC or NetScaler Gateway (Note: Enabled by default on VPN vServer)'''
    ground_truth_url: https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html
    fix: Say 'two NetScaler zero-days, one default-configuration and one default on VPN virtual servers'.
    class: imprecision
  - where: '## Update 2026-09-29T04:35:00Z (and record summary), first paragraph'
    claim: (low confidence) ns_monuploadd_err.pl, a Perl script that periodically scans NetScaler system logs for Pitboss "PPE unexpectedly died" crash messages to recover a core-dump filename
    defect: '''periodically'' is in neither cited source: watchTowr''s article shows the script greps logs for ''missed too many heartbeats'' or ''unexpectedly died'' and its PoC output says ''triggering
      force pickup''; Unit 42 says only that the log ''will eventually be processed'' by the script.'
    ground_truth: 'watchTowr Labs: ''grep -E -i "pitboss.*PPE.*missed too many heartbeats|pitboss.*PPE.*unexpectedly died" @WR_FILES | tail -1 | sed ...''; Unit 42: ''Eventually this ns.log file will be
      processed by the vulnerable Perl script'''
    ground_truth_url: https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/
    fix: Drop 'periodically' and name both trigger strings.
    class: imprecision
  - where: 'evidence[] (Citrix community blog quote); ## Update 2026-10-04T04:42:00Z'
    claim: (low confidence) quote "please upgrade your deployment again with the software released as part of the" and "The flaw is independent of the vulnerabilities disclosed in the earlier bulletin CTX697096"
      cited to community.citrix.com blogs
    defect: Both cited Citrix community pages return HTTP 403 to every transport (extract, url, jina, WebFetch), so the independence statement and the quote continuation could not be checked at the source;
      BleepingComputer's rendering of the same Citrix sentence ends 'please upgrade your deployment again,' without the continuation the evidence quote carries.
    ground_truth: 'BleepingComputer: ''if you have determined that your NetScaler deployment meets the preconditions describe above, please upgrade your deployment again," Citrix warned.'''
    ground_truth_url: https://www.bleepingcomputer.com/news/security/citrix-patches-netscaler-saml-zero-day-exploited-in-attacks/
    fix: Verify the quote against the Citrix blog when reachable; otherwise end the quote at 'again'.
    class: imprecision
- entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  verdict: factual-error
  defects:
  - where: body paragraph 2, first sentence
    claim: The agents' access appears to have been restricted to HTTP GET, while UNCTAD's `Facts` endpoint required POST and returned data only to requests originating from UNCTAD's own site.
    defect: 'Mis-states the CORS point: Howard-Jones says only that UNCTAD''s own website is allowed to READ the data from JavaScript (Access-Control-Allow-Origin); the Urlquery-submitted form POST returned
      200 with data in the scan screenshots (SiliconANGLE: ''Screenshots in the scan reports show index data coming back''), so the endpoint did not serve data only to UNCTAD-origin requests. The entry''s
      own next sentences rely on the form POST working. Also ''began blocking GET requests'' adds a change the source does not state (''the Facts endpoint was blocked to GET requests entirely'').'
    ground_truth: 'swarmcha.se: ''UNCTAD only allows its own website to read its data, not httpbin, because of the Access-Control-Allow-Origin header.''; ''The urlquery report records a GET to httpbin followed
      by a POST to UNCTADstat, both returning 200.'''
    ground_truth_url: https://swarmcha.se/posts/openai-unctad
    fix: Say the Facts endpoint accepts only POST and its cross-origin header lets only UNCTAD's own site read responses from script; drop 'began'.
    class: factual-error
  - where: tags; Defender takeaway; title
    claim: 'tags: [ai-abuse, auth-bypass, info-disclosure]; ''an AI vendor''s own agents autonomously engineering an access-control bypass against public-sector infrastructure ... is now a repeated pattern'''
    defect: 'Sources describe no authentication bypass and no non-public disclosure: SiliconANGLE says ''None of the data was secret'' and the API key is public (UNCTADstat''s viewer sends it with every
      request); Howard-Jones: ''Was this hacking? I don''t think I''d call it that''; Transluce ''identified no instances ... where agents gained access to any information that is not publicly available''.
      The takeaway also states OpenAI authorship as fact where the primary says ''highly likely'' on infrastructure overlap, and OpenAI is only ''reviewing these findings''.'
    ground_truth: 'SiliconANGLE: ''None of the data was secret. The agents wanted public figures ... The key they used for those queries was public too.'''
    ground_truth_url: https://siliconangle.com/2026/09/27/researcher-links-16000-scans-of-a-u-n-statistics-portal-to-openai-agents/
    fix: Drop auth-bypass and info-disclosure tags; phrase the takeaway as 'agents attributed to OpenAI engineering a method-filter bypass against a public data API' and note the data was public.
    class: imprecision
- entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  verdict: imprecision
  defects:
  - where: frontmatter sectors / priority
    claim: '(low confidence) sectors: [public-sector, technology]; priority: high'
    defect: 'Microsoft''s blog does not name or characterise the victim organisation or its sector, so ''public-sector'' (and the home-region nexus that the high priority leans on) is not in the cited source;
      it is a single-tenant incident whose observed activity dates to early June 2026 and whose guidance (rotate exposed secrets, locks) is generic. Context only: the priority bar rests on an assumed Azure/public-sector
      exposure.'
    ground_truth: 'Microsoft: ''Microsoft observed two compromised service principals belonging to the same tenant'' (no sector or victim named); ''in early June 2026, one of the compromised service principals
      enumerated ...'''
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
    fix: Remove public-sector from sectors unless a source names it; re-grade priority on the exposure of Swiss Azure tenants (leaked workload-identity secrets) rather than on the victim sector.
    class: imprecision
