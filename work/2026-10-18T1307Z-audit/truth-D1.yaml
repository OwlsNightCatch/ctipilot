- members:
  - 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
  - 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  same_finding: true
  survivor: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  current_state: 'Microsoft Semantic Kernel (open-source AI agent framework), two flaws disclosed by the Microsoft Defender Security Research Team blog 2026-05-07 (MS blog: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    ; discoverers Uri Oren, Amit Eliahu, Dor Edry). (1) CVE-2026-26030 = Python SDK (PyPI semantic-kernel) InMemoryVectorStore filter RCE, CWE-94, CVSS 3.1 9.9 (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H), vulnerable
    < 1.39.4, fixed 1.39.4, GHSA-xjw9-4gw8-4rqx published 2026-02-19 (https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx); fix PR #13505; workaround ''Avoid using InMemoryVectorStore for production scenarios'';
    exploitation needs a prompt-injection vector plus a Search Plugin backed by the In-Memory Vector Store in default configuration; mechanism per blog: default filter is a Python lambda executed with eval()
    with an unsanitised model-controlled parameter, AST blocklist bypassed (names __name__, load_module, system, BuiltinImporter not blocked) -> BuiltinImporter -> os.system. (2) CVE-2026-25592 = .NET SDK
    SessionsPythonPlugin arbitrary file write, CWE-22, CVSS 9.9 same vector, nuget Microsoft.SemanticKernel.Core/Plugins.Core vulnerable < 1.71.0 fixed 1.71.0 (GHSA structured data also lists pip semantic-kernel
    < 1.39.3 first patched 1.39.3), GHSA-2ww3-72rp-wpp4 published 2026-02-06 (https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4); DownloadFileAsync was accidentally marked [KernelFunction] so the localFilePath
    passed to File.WriteAllBytes() on the host became model-controlled; chain: ExecuteCode creates a script in the Container Apps sandbox, DownloadFileAsync writes it to the Windows Startup folder, runs
    at next sign-in; separately upload_file() (Python and .NET) accepted any local path (host-file read into the sandbox); fix PR #13478 removed [KernelFunction] from DownloadFileAsync and added path validation
    (UploadFileAsync keeps the attribute with validation); workaround: Function Invocation Filter allow-listing localFilePath for DownloadFileAsync/UploadFileAsync. Exploitation/KEV: neither CVE is in CISA
    KEV (catalog 2026.10.16, https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json); no source reports in-the-wild exploitation. Public CTF challenge reproducing CVE-2026-26030:
    https://github.com/amiteliahu/AIAgentCTF/tree/main/CVE-2026-26030.'
  facts_only_in_duplicates:
  - fact: '.NET flaw workaround: Function Invocation Filter allow-listing localFilePath for DownloadFileAsync/UploadFileAsync (present in B only, wrongly attributed to the Microsoft post)'
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    verified: true
    source_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
    passage: Users can create a Function Invocation Filter which checks the arguments being passed to any calls to DownloadFileAsync or UploadFileAsync and ensures the provided localFilePath is allow listed.
  - fact: 'Python flaw workaround: avoid InMemoryVectorStore for production (in neither entry)'
    entry: (neither)
    verified: true
    source_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
    passage: Avoid using InMemoryVectorStore for production scenarios.
  - fact: CVE-2026-25592 GHSA also lists Python semantic-kernel first patched 1.39.3 (both entries)
    entry: both
    verified: true
    source_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
    passage: 'API vulnerabilities[0]: ecosystem pip, name semantic-kernel, vulnerable_version_range "< 1.39.3", first_patched_version "1.39.3"'
  - fact: B detection/hunting concepts (process ancestry, file creation outside sandbox, dispatcher logging) are analyst suggestions; Microsoft supplies Defender hunting queries for child processes of Semantic
      Kernel hosts (dotnet.exe/semantic-kernel command line spawning shells) and mentions scripts dropped in Startup folders
    entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    verified: true
    source_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    passage: detect anomalous behavior, such as an AI agent process suddenly spawning command lines or dropping scripts into Startup folders.
  note: Same finding (identical CVEs, sources, run 2026-05-10-001); B (deep dive) is the better carrier but both carry the same uncited/incorrect statements (Foundry/Copilot Studio backing, [KernelFunction]
    on both methods, reversed upload/download roles, fabricated quote). GHSA publication dates are 2026-02-19/2026-02-06, so the finding is a May write-up of Feb-disclosed CVEs. No KEV listing, no ITW exploitation
    reported; priority high (A) vs notable (B) disagree; high fails the bar (research, no ITW).
