  survivor: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
  current_state: 'CVE-2026-42897, Microsoft Exchange Server OWA cross-site scripting with spoofing impact (CWE-79); MSRC ''Microsoft Exchange Server Spoofing Vulnerability'', released 2026-05-14 (out-of-band,
    Patch Tuesday was 2026-05-12), Critical, CVSS 3.1 8.1 (temporal 7.5) CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N/E:F/RL:O/RC:C, Exploited: Yes, ''Exploitation Detected'' since release; revisions 1.1
    2026-05-18 (FAQ: IE/IE-mode not protected because CSP unsupported), 2 2026-06-09 (links to June 2026 Exchange SUs), 2.1 2026-07-14 (install July 2026 SUs to be protected from this CVE and CVE-2026-55008;
    mitigations can be removed after the July SU) (https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897). Affected: Exchange Server 2016, 2019 and Subscription Edition
    at any update level at disclosure; Exchange Online not impacted (Exchange Team post 2026-05-14, https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498).
    CISA KEV: added 2026-05-15, due 2026-05-29 (catalogue 2026.10.16). Mitigation: Exchange Emergency Mitigation Service applies M2 (rule IDs M2.1.x, URL Rewrite outbound rule ''EEMS M2.1 OWA CSP - outbound'')
    automatically, needs outbound HTTPS 443 to officeclient.microsoft.com and an Exchange build from March 2023 or later to fetch new mitigations; disconnected servers run EOMT (aka.ms/UnifiedEOMT, .\EOMT.ps1
    -CVE "CVE-2026-42897"); known issues: OWA Print Calendar, inline images, OWA light, OWACalendar.Proxy healthset unhealthy, published calendars error 500 (https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service).
    Fix: June 2026 Exchange Security Updates released 2026-06-09 (Exchange SE RTM public; Exchange 2019 CU14/CU15 and 2016 CU23 only for Period 2 ESU customers; Period 1 ESU ended April 2026) (https://techcommunity.microsoft.com/blog/exchange/released-june-2026-exchange-server-security-updates/4524491),
    Microsoft then recommended keeping the mitigation; July 2026 SUs (2026-07-14) are recommended by MSRC and, once installed, the M2.1.0 IIS rules (EM service) or the EOMT rollback should be removed manually
    (https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146); sibling OWA XSS CVE-2026-55008 (MSRC ''Exchange Server Spoofing Vulnerability'', CVSS
    9.6, released 2026-07-14, Exploitation More Likely, exploited No) is fixed by the July SU and also mitigated by the M2 mitigation. In-the-wild: Proofpoint 2026-07-28 attributes a campaign that began
    2026-07-22 to TA488 (Void Blizzard / LAUNDRY BEAR; US and European government, telecommunications, finance, hospitality, aerospace), loader JavaScript in the message body triggers the ''OWAReaper''
    implant (rewrites the message server-side, harvests browser autofill credentials, steals OAuth tokens via add-ins with ReadWriteMailbox calling GetClientAccessToken, persists in OWA localStorage under
    PageDataPayload.OwaUserDefaultSettings and in the IndexedDB message cache, grants the ''Default'' user Owner permission on every mail folder via UpdateFolder, C2 via GitHub commit search every 24 h
    and inbound emails every 5 min, exfil over HTTPS via image CDNs with DNS-label fallback; no mass mail exfiltration); earliest infrastructure March 2026 so zero-day use is ''feasible'' (inference); Proofpoint
    recommends revoking/auditing EWS tokens, removing Default-user folder grants, clearing owa_offline_db and the localStorage key (https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit);
    NCSC-CH advisory #12577 (published 2026-05-15, edited 2026-07-30 with the Proofpoint link) (https://security-hub.ncsc.admin.ch/#/posts/12577); joint CSA on the same actor''s Zimbra campaign (16 countries,
    2026-07-23) (https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/0/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF).'
