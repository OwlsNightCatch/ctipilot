entries:
- entry: 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
  verdict: factual-error
  defects:
  - where: summary
    claim: prompt-injection-to-RCE in the AI agent orchestration framework that backs Azure AI Foundry, Copilot Studio and many self-hosted agents
    defect: No cited source says Semantic Kernel backs Azure AI Foundry or Copilot Studio.
    ground_truth: 'Microsoft blog: "Semantic Kernel is Microsoft''s open-source framework for building AI agents and integrating AI models into applications." (no Foundry / Copilot Studio statement anywhere
      in the post or the GHSAs)'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Drop "that backs Azure AI Foundry, Copilot Studio and many self-hosted agents"; say "Microsoft's open-source AI agent framework".
    class: factual-error
  - where: summary / body paragraph 1
    claim: '`SessionsPythonPlugin.DownloadFileAsync` and `SessionsPythonPlugin.UploadFileAsync` carry a `[KernelFunction]` attribute that should not have been applied'
    defect: Only DownloadFileAsync was wrongly exposed as a kernel function; UploadFileAsync is intentionally a kernel function (it received path validation, not attribute removal).
    ground_truth: 'Blog: "DownloadFileAsync was accidentally marked with a [KernelFunction] attribute". Fix PR #13478 diff removes `[KernelFunction, Description("Downloads a file ...")]` from DownloadFileAsync
      only; the UploadFileAsync `[KernelFunction, Description("Uploads a file ...")]` line is retained; its unit test asserts "Only ExecuteCode, UploadFile, and ListFiles should be exposed".'
    ground_truth_url: https://api.github.com/repos/microsoft/semantic-kernel/pulls/13478/files
    fix: State that the unintended [KernelFunction] was on DownloadFileAsync (host-side file write via localFilePath); upload_file lacked path validation (host-file read into the sandbox).
    class: factual-error
  - where: body paragraph 1
    claim: An f-string composes the LINQ-like filter expression directly from an LLM-controlled parameter ... bypasses with the well-known `__class__.__bases__[0].__subclasses__()` class-hierarchy traversal
      pattern ... `os.system`-equivalent execution
    defect: 'Mechanism misdescribed: the filter is a Python lambda string executed via eval(); bypass traversed the type system from tuple() to BuiltinImporter and used load_module/system; no f-string,
      LINQ, or __bases__[0] chain in the source.'
    ground_truth: 'Blog: "The default filter function ... is implemented as a Python lambda expression executed using eval()"; "kwargs[param.name] is AI model-controlled and not sanitized"; payload "traversed
      Python''s class hierarchy to locate BuiltinImporter, and used it to dynamically load os and call system()"; blocklist missed __name__, load_module, system, BuiltinImporter.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: 'Rewrite: unsanitised model-controlled parameter interpolated into a lambda filter evaluated with eval(); AST blocklist bypassed via class-hierarchy traversal to BuiltinImporter.'
    class: factual-error
  - where: body paragraph 2
    claim: Microsoft characterises both flaws as systemic of agentic-AI patterns that "trust LLM-controlled parameters without explicit validation"
    defect: The quoted phrase is not on the cited page (invented quote); AutoGen is also not named by Microsoft as likely affected.
    ground_truth: 'Blog: "The vulnerability lies in how the framework and tools trust the parsed data."; "frameworks like Semantic Kernel, LangChain, and CrewAI ... a single vulnerability in how they map
      AI model outputs to system tools carries systemic risk." No "without explicit validation" string; AutoGen not mentioned.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Remove the quotation marks or quote the blog sentence verbatim; name only LangChain and CrewAI as the blog does, and label wider spread as analyst inference.
    class: factual-error
  - where: cves[] CVE-2026-26030 / CVE-2026-25592 auth
    claim: 'auth: pre-auth; affected: null; fixed: null'
    defect: CVSS vectors of both GHSAs carry PR:L (low privileges required), so "pre-auth" contradicts the authority; affected/fixed left null although the GHSAs give them.
    ground_truth: 'GHSA-xjw9-4gw8-4rqx: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H (9.9), vulnerable "< 1.39.4", first patched 1.39.4; GHSA-2ww3-72rp-wpp4: same vector, nuget "< 1.71.0" first patched
      1.71.0, pip "< 1.39.3" first patched 1.39.3.'
    ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
    fix: 'Set affected/fixed per GHSA; drop or qualify auth: pre-auth (attack needs a prompt-injection channel into the agent, not an unauthenticated network exploit of the SDK).'
    class: imprecision
  - where: sources[] publisher labels / body citation labels
    claim: GitHub Security Advisory GHSA-xjw9-4gw8-4rqx, 2026-05-07 ; GitHub Security Advisory GHSA-2ww3-72rp-wpp4, 2026-05-07
    defect: The GHSAs were published 2026-02-19 and 2026-02-06; 2026-05-07 is the Microsoft blog date.
    ground_truth: 'API: GHSA-xjw9-4gw8-4rqx published_at 2026-02-19T19:34:14Z (NVD 2026-02-19); GHSA-2ww3-72rp-wpp4 published_at 2026-02-06T18:37:24Z (NVD 2026-02-06).'
    ground_truth_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
    fix: Correct the dates in the sources[] publisher strings and the body link labels; note the CVEs predate the May blog by 2-3 months.
    class: imprecision
  - where: summary / body last sentence
    claim: Full breakdown in § 5. / Full deep dive in § 5.
    defect: Dangling pointer to a section of the migrated brief that does not exist in this entry.
    ground_truth: Entry body has no section 5; the deep dive is a separate entry.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Remove the "§ 5" references.
    class: imprecision
  - where: priority
    claim: 'priority: high'
    defect: No in-the-wild exploitation, not in CISA KEV (catalog 2026.10.16), exploitation needs a prompt-injection vector plus a specific default-config component; research disclosure, a high-bar disqualifier.
    ground_truth: Blog frames both as researcher-found, "have since been fixed"; no exploitation statement; neither CVE in KEV.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: 'Context only: priority should be notable/routine unless a constituency product exposure is shown.'
    class: imprecision
- entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  verdict: factual-error
  defects:
  - where: body "Why this matters"
    claim: Semantic Kernel is the open-source orchestration SDK behind Azure AI Foundry, Copilot Studio, and a growing fraction of self-hosted enterprise AI agents in EU government modernisation pilots.
    defect: 'Unsupported: no cited source links Semantic Kernel to Foundry/Copilot Studio or to EU government pilots.'
    ground_truth: 'Blog: "Semantic Kernel is Microsoft''s open-source framework for building AI agents ... With over 27,000 stars on GitHub".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Delete the Foundry/Copilot Studio/EU-pilot claims.
    class: factual-error
  - where: body CVE-2026-26030 section
    claim: composes its LINQ-like filter expression by f-string interpolation ... The SDK applies a string-blocklist validator ... the validator is a denylist on the *literal text*
    defect: Validator is AST-based (parses filter string into an AST, rejects dangerous Name/Attribute nodes, runs eval with empty __builtins__); not a literal-text scan; no f-string/LINQ.
    ground_truth: 'Blog: "implemented a validator that parses the filter string into an Abstract Syntax Tree (AST) before execution"; "scans every element in the code for dangerous identifiers and attributes
      (for example, strings like eval, exec, open, __import__ ...)"; "If the code passes both checks, it is executed in a restricted environment where Python''s built-in functions ... are deliberately removed."'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Describe it as an AST identifier/attribute blocklist; bypass worked because __name__, load_module, system, BuiltinImporter were not blocked and ast.Subscript was unchecked.
    class: factual-error
  - where: body CVE-2026-26030 section
    claim: '"".__class__.__bases__[0].__subclasses__()[<index>]("...") — walking `object`''s subclass list to reach an arbitrary class ... (typically `subprocess.Popen` or a `os` reference reached via reflection)'
    defect: 'Not the cited payload: it started from tuple(), located BuiltinImporter and called load_module/system; subprocess.Popen is not mentioned.'
    ground_truth: 'Blog: "it started with tuple() ... and crawled through Python''s type system"; "traversed Python''s class hierarchy to locate BuiltinImporter, and used it to dynamically load os and call
      system()".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Replace the generic idiom and the subprocess.Popen aside with the blog's BuiltinImporter/load_module/system chain, or drop the snippet.
    class: factual-error
  - where: body CVE-2026-26030 prerequisites
    claim: default for self-hosted Semantic Kernel agents until a customer wires in a different vector backend ; indirect prompt injection via retrieved documents or tool output is sufficient; a direct
      user-input vector is not required
    defect: Source states the condition as "Search Plugin backed by In-Memory Vector Store functionality using the default configuration"; the "default for self-hosted agents" and indirect-vs-direct statements
      are uncited.
    ground_truth: 'Blog: "The targeted agent must have the Search Plugin backed by In-Memory Vector Store functionality using the default configuration"; "The attacker must have a prompt injection vector,
      allowing influence over the agent''s inputs".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Use the blog wording; drop the unsupported default-for-self-hosted aside.
    class: factual-error
  - where: body CVE-2026-25592 section
    claim: Two of its methods — `DownloadFileAsync` and `UploadFileAsync` — were mistakenly annotated with `[KernelFunction]`
    defect: Only DownloadFileAsync was mistakenly annotated.
    ground_truth: 'Blog: "DownloadFileAsync was accidentally marked with a [KernelFunction] attribute"; PR #13478 removes [KernelFunction] from DownloadFileAsync only (UploadFileAsync keeps it, gains path
      validation).'
    ground_truth_url: https://api.github.com/repos/microsoft/semantic-kernel/pulls/13478/files
    fix: Say only DownloadFileAsync was mis-annotated.
    class: factual-error
  - where: body CVE-2026-25592 section
    claim: (a) call `UploadFileAsync` to write attacker-chosen bytes to an attacker-chosen path *on the host* ... and (b) call `DownloadFileAsync` symmetrically to read host-side files back into the agent
      context.
    defect: 'Directions are reversed: DownloadFileAsync is the host-side file-write primitive; upload_file is the host-file-read/exfiltration primitive into the sandbox.'
    ground_truth: 'Blog: DownloadFileAsync''s "localFilePath parameter, which dictates exactly where File.WriteAllBytes() saves data on the host device, was now entirely AI controlled"; "upload_file() ...
      accepted any local file path without validation, allowing prompt injections to exfiltrate sensitive host files ... directly into the sandbox"; chain writes the script to the host Windows Startup folder.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: 'Swap: DownloadFileAsync = arbitrary host file write (Startup-folder code execution on next sign-in); upload_file = arbitrary host file read into the sandbox (Python and .NET).'
    class: factual-error
  - where: body hardening
    claim: implement a Function Invocation Filter (the SDK-supported hook documented in the Microsoft research post) ... reduces the Python-side blast radius even if the validator is bypassed
    defect: The Function Invocation Filter workaround is documented in GHSA-2ww3-72rp-wpp4 for the .NET flaw, not in the Microsoft post; no source offers it as a Python-side mitigation. Python GHSA workaround
      is "Avoid using InMemoryVectorStore for production scenarios". "patched releases also include the upstream test additions" is uncited.
    ground_truth: 'GHSA-xjw9: "Workarounds: Avoid using InMemoryVectorStore for production scenarios."; GHSA-2ww3: "Users can create a Function Invocation Filter which checks the arguments being passed
      to any calls to DownloadFileAsync or UploadFileAsync and ensures the provided localFilePath is allow listed."'
    ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
    fix: Attribute the filter workaround to the .NET GHSA only and add the Python GHSA workaround (avoid InMemoryVectorStore in production); drop the Python-blast-radius and test-additions sentences.
    class: factual-error
  - where: cves[] / ATT&CK mapping
    claim: T1565.001 Stored Data Manipulation (write primitive)
    defect: 'The documented write primitive drops a script in the Windows Startup folder for code execution at next sign-in; stored-data manipulation for integrity impact is not what the source describes.
      Also auth: pre-auth contradicts PR:L; affected/fixed null.'
    ground_truth: 'Blog: "writes it directly to the host''s Windows\Start Menu\Programs\Startup folder"; "On the next user sign-in, the script runs, granting full host compromise." GHSA vectors PR:L.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Map to Startup-folder autostart persistence/execution instead of T1565.001; qualify auth; fill affected/fixed.
    class: imprecision
  - where: body (analysis paragraphs)
    claim: EDR vendors classify this under hunt-pack categories ...; Many self-hosted agent deployments do not log plugin-method calls ...; The same class of bug is highly likely to exist in LangChain,
      CrewAI, AutoGen, Haystack, LlamaIndex; Both bypass any of the existing prompt-side mitigations ...; The deployment surface inside an EU public-sector tenant ...
    defect: Uncited generalisations stated as fact; the Microsoft post names only LangChain and CrewAI and says prompt-layer guardrail bypass needs host-level detection, not that all prompt-side mitigations
      are bypassed.
    ground_truth: 'Blog: "frameworks like Semantic Kernel, LangChain, and CrewAI"; "If an attacker bypasses the AI model guardrails, traditional endpoint defense must be in place".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
    fix: Mark as analyst inference or remove.
    class: imprecision
  - where: sources[] publisher labels / header links
    claim: GitHub GHSA ... 2026-05-07
    defect: GHSA publication dates are 2026-02-19 and 2026-02-06 (not 2026-05-07).
    ground_truth: GHSA-xjw9 published_at 2026-02-19T19:34:14Z; GHSA-2ww3 published_at 2026-02-06T18:37:24Z.
    ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
    fix: Correct dates.
    class: imprecision
- entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
  verdict: factual-error
  defects:
  - where: 'immediate_action; ## Update 2026-06-02 section; updates[0].summary'
    claim: On 1 June, Belgium's Centre for Cybersecurity (CCB) and multiple outlets reported active in-the-wild exploitation ; Belgium's Centre for Cybersecurity (CCB) confirmed active exploitation on 1
      June
    defect: The CCB warning is dated 29 May 2026 (a Friday); 1 June is the date BleepingComputer, Help Net Security and SecurityWeek reported it.
    ground_truth: 'CCB advisory: "Last Update: 29/05/2026 ... Updated on May 29, 2026 CVE-2026-41089 (Windows Netlogon) is now actively exploited in the wild." BleepingComputer (2026-06-01): CCB "warned
      on Friday"; CCB tweet id 2060392708259131674 decodes to 2026-05-29T16:07Z.'
    ground_truth_url: https://ccb.belgium.be/advisories/warning-microsoft-patch-tuesday-may-2026-patches-118-vulnerabilities-16-critical-102
    fix: Say CCB warned on 29 May 2026 and outlets reported it on 1 June.
    class: factual-error
  - where: cves[CVE-2026-41103].type / cves[CVE-2026-42898].auth
    claim: 'CVE-2026-41103 type: rce, vector: zero-click, auth: pre-auth ; CVE-2026-42898 auth: pre-auth, vector: zero-click'
    defect: MSRC classifies CVE-2026-41103 as Elevation of Privilege (authentication forgery), not RCE; CVE-2026-42898 requires an authorized (low-privilege) attacker (PR:L), the body itself says "authenticated
      code injection".
    ground_truth: 'MSRC CVE-2026-41103: impact "Elevation of Privilege", CWE-303, CVSS 9.1 AV:N/AC:L/PR:N/UI:N/C:H/I:H/A:N. MSRC CVE-2026-42898: "allows an authorized attacker to execute code over a network",
      CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H (9.9); ZDI: "any authenticated user".'
    ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-41103
    fix: Set CVE-2026-41103 type to privilege escalation/auth-bypass and CVE-2026-42898 auth to authenticated (low privilege); fill affected/fixed from MSRC.
    class: factual-error
  - where: body, CVE-2026-41089
    claim: unauthenticated remote attacker over the network reaches the domain-controller Netlogon RPC endpoint
    defect: No cited source says RPC; independent root-cause analyses place the flaw in the CLDAP DC-locator ping handler on UDP/389 of the Netlogon service, and exploitability depends on long DNS domain/host
      names.
    ground_truth: 'Aretiq: "An unauthenticated remote attacker can send a single crafted CLDAP packet to a domain controller''s UDP port 389 ... domain controllers with longer DNS domain names and hostnames
      are vulnerable"; BuildSamLogonResponse 528-byte stack buffer; GS stack cookie. Securonix (2026-06-03) same.'
    ground_truth_url: https://aretiq.ai/research/vul260513-cve-2026-41089-microsoft-windows-netlogon-buildsamlogonresponse-stack-based-buffer-overflow-rce/
    fix: Replace "Netlogon RPC endpoint" with "a crafted network request to a domain controller (CLDAP DC-locator ping on UDP/389 per public root-cause analyses)".
    class: factual-error
  - where: body, CVE-2026-41096
    claim: 'heap overflow in `dnsapi.dll`: a crafted DNS response ... yields code execution as `NetworkService` on every Windows host'
    defect: dnsapi.dll and the NetworkService context appear in no cited source; Microsoft says exploitation is only possible "in certain configurations".
    ground_truth: 'ZDI: "heap-based buffer overflow in the DNS Client triggered by a malicious DNS response ... An attacker with a position to influence DNS responses (MitM, rogue server)"; Help Net Security
      quoting Microsoft: "In certain configurations, this could allow the attacker to run code remotely".'
    ground_truth_url: https://www.thezdi.com/blog/2026/5/12/the-may-2026-security-update-review
    fix: Remove dnsapi.dll/NetworkService; add the "certain configurations" qualifier.
    class: factual-error
  - where: body, ATT&CK / Detection
    claim: '`T1071.004 Application Layer Protocol: DNS` (DNS Client) ; monitor Netlogon authentication-pattern anomalies (`4624 Logon Type 3` ... paired with `4769`)'
    defect: T1071.004 is C2-over-DNS, not exploitation of a DNS Client memory-corruption flaw; 4624/4769 are not indicators of a CLDAP stack overflow. Sources name Netlogon crashes/restarts, anomalous Netlogon
      traffic from non-DC addresses, UDP/389 CLDAP anomalies, lsass.exe faults.
    ground_truth: 'Help Net Security (Automox): "The Netlogon service unexpectedly crashing or restarting; Anomalous Netlogon traffic patterns from non-DC source addresses; Authentication failures or domain
      trust errors immediately after suspicious network activity hits a domain controller". Securonix: Application Event ID 1000 lsass.exe/netlogon.dll, exception 0xC0000409.'
    ground_truth_url: https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/
    fix: Drop T1071.004 (T1210 stands); use the source-supported Netlogon-crash / non-DC-source traffic detections.
    class: imprecision
  - where: cves[CVE-2026-41089].status; immediate_action; body
    claim: 'status: exploited, patch-available ; Microsoft had not yet updated its advisory to reflect exploitation'
    defect: 'Exploitation rests on the CCB statement alone (sourced from "trusted partners", no details); Microsoft told BleepingComputer and SecurityWeek it has no evidence supporting it, the MSRC record
      still says Exploited: No (revision 1 only), and the CVE is not in CISA KEV (catalogue 2026.10.16). The entry omits the vendor denial.'
    ground_truth: 'BleepingComputer (update 2 June 08:51 EDT): "A Microsoft spokesperson also told BleepingComputer that the company does not currently have any evidence to support the CBC''s claims"; SecurityWeek:
      "Microsoft said it has found no evidence to support CCB''s claims." MSRC: "exploited":"No","latestSoftwareRelease":"Exploitation Less Likely".'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/
    fix: 'Qualify: reported exploited by CCB (29 May); disputed by Microsoft; not in KEV; add Contradiction line; reconsider priority critical.'
    class: imprecision
  - where: immediate_action
    claim: grants remote code execution as SYSTEM on a domain controller with no credentials and no user interaction (Microsoft MSRC)
    defect: The MSRC advisory text does not mention SYSTEM; SYSTEM comes from CCB/CERT-EU/Krebs.
    ground_truth: 'MSRC: "Stack-based buffer overflow in Windows Netlogon allows an unauthorized attacker to execute code over a network." CCB: "run code on the affected system with SYSTEM privileges".'
    ground_truth_url: https://ccb.belgium.be/advisories/warning-microsoft-patch-tuesday-may-2026-patches-118-vulnerabilities-16-critical-102
    fix: Attribute SYSTEM to CCB/CERT-EU, not MSRC.
    class: imprecision
  - where: summary / actions[0]
    claim: Netlogon (CVE-2026-41089) and DNS Client (CVE-2026-41096) are the wormable-candidate pre-auth RCEs ; 16 of the CVEs were discovered by Microsoft's new MDASH AI scanning harness
    defect: Only Netlogon is called wormable by a cited source (ZDI); the DNS Client flaw needs attacker influence over DNS responses and MSRC rates it Exploitation Unlikely. The MDASH sentence is true
      but no cited source carries it.
    ground_truth: 'ZDI: Netlogon "Yup - that makes it wormable"; DNS Client "An attacker with a position to influence DNS responses". CSO Online 2026-05-13: "MDASH ... identified 16 previously unknown Windows
      vulnerabilities".'
    ground_truth_url: https://www.csoonline.com/article/4170785/microsofts-new-ai-system-finds-16-windows-flaws-including-four-critical-rces.html
    fix: Drop "wormable-candidate" for DNS Client; cite the Microsoft/CSO MDASH source.
    class: imprecision
  - where: actions[] / record summary
    claim: See § 2 ; (. ; see the Immediate Action below and the §4 update
    defect: Dangling references to brief sections that do not exist; action[1] ends in a truncated "(.".
    ground_truth: n/a (editing artefacts)
    ground_truth_url: https://ccb.belgium.be/advisories/warning-microsoft-patch-tuesday-may-2026-patches-118-vulnerabilities-16-critical-102
    fix: Remove the dangling references and the truncated fragment.
    class: imprecision
- entry: 2026-06-11/windows-netlogon-rce-cve-2026-41089-now-confirmed-exploited
  verdict: factual-error
  defects:
  - where: title / headline / summary / actions[0]
    claim: now confirmed exploited in the wild in the EU by Belgium's CCB ; CERT-EU published advisory 2026-007 ... confirming that CVE-2026-41089 ... is being actively exploited
    defect: 'CERT-EU does not confirm exploitation: it relays the CCB statement. CCB gave no details; Microsoft says it has no evidence; MSRC still marks Exploited: No; not in CISA KEV.'
    ground_truth: 'CERT-EU 2026-007: "According to The Centre for Cybersecurity Belgium (CCB), this vulnerability is currently exploited by threat actors." BleepingComputer: Microsoft "does not currently
      have any evidence to support the CBC''s claims".'
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-007/
    fix: Say "reported exploited by CCB (relayed by CERT-EU advisory 2026-007); Microsoft disputes"; drop "confirmed".
    class: factual-error
  - where: evidence[0].quote
    claim: 'UPDATE (originally covered 2026-W23 weekly): CERT-EU published advisory 2026-007 on 10 June 2026 confirming that CVE-2026-41089 ... citing Belgium''s Centre for Cybersecurity …'
    defect: The quote is the entry's own migrated prose (publisher "ctipilot v2 brief (migrated)"), not a passage of any cited page; it also contains an ellipsis.
    ground_truth: 'CERT-EU page carries: "According to The Centre for Cybersecurity Belgium (CCB), this vulnerability is currently exploited by threat actors \[2\]. It is strongly recommended updating affected
      Windows servers as soon as possible."'
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-007/
    fix: Replace with the CERT-EU sentence above.
    class: factual-error
  - where: body paragraph 1
    claim: roughly 20 days after the May 2026 Patch Tuesday fix
    defect: CERT-EU advisory (2026-06-10) came 29 days after Patch Tuesday (2026-05-12); the CCB warning (29 May) came 17 days after.
    ground_truth: 'CERT-EU history: "10/06/2026 --- v1.0 -- Initial publication"; "On 12 May 2026, Microsoft published a security advisory".'
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-007/
    fix: Say 29 days (CERT-EU) or 17 days (CCB).
    class: factual-error
  - where: body paragraph 2
    claim: sends a crafted Netlogon RPC packet ... functionally a full Active Directory forest compromise, in the ZeroLogon lineage of Netlogon-channel attacks (BleepingComputer, 2026-06-01)
    defect: The cited BleepingComputer article says only "a specially crafted network request" to a DC and carries no forest-compromise or ZeroLogon statement; independent analyses put the vector at CLDAP
      UDP/389, not RPC.
