  current_state: 'CVE-2026-46817, Oracle E-Business Suite, Oracle Payments, File Transmission component (HTTP): unauthenticated attacker with network access can compromise and take over Oracle Payments;
    Oracle risk matrix: remote exploit without authentication Yes, CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), supported versions affected 12.2.3-12.2.15; fixed in Oracle''s May 2026 Critical Security
    Patch Update (CSPU), Rev 1 initial release 2026-05-28 (https://www.oracle.com/security-alerts/cspumay2026.html); same CSPU also carries sibling CVE-2026-46818 (Oracle Payments / File Transmission, HTTPS,
    7.4) and CVE-2026-46819 (Oracle Internet Procurement Connector, 9.1). Weakness labels (via Help Net Security and CISA KEV): improper privilege management, improper authentication, missing authentication
    for a critical function (CWE-269/287/306). Exploitation: Defused honeypots recorded the first in-the-wild exploitation on 2026-06-27 (single source, unauthenticated file read through the ibytransmit
    endpoint of the Payments File Transmission component reading /etc/passwd; Defused: ''a targeted proof-of-concept, not broad scanning''; no public PoC; reported on X 2026-06-29 (BleepingComputer https://www.bleepingcomputer.com/news/security/new-oracle-e-business-suite-flaw-now-exploited-in-attacks/),
    Help Net Security 2026-06-30 (https://www.helpnetsecurity.com/2026/06/30/oracle-payments-cve-2026-46817-exploitation/) and SecurityAffairs 2026-06-30 (https://securityaffairs.com/194463/security/attackers-actively-exploit-the-oracle-e-business-suite-flaw-cve-2026-46817.html));
    the ''six weeks after the patch'' wording is Defused''s, whereas Oracle''s release was 30 days earlier; Shadowserver counted over 450 internet-exposed EBS instances (nearly 200 in the US and Europe)
    on 2026-06-29. CISA KEV: added 2026-07-15 (due 2026-07-18, forensic triage flagged, ransomware use Unknown; catalogue 2026.10.16) (https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog).
    No threat-actor attribution in any source. Guidance in sources: apply the May CSPU, keep EBS web interfaces off the public internet, treat internet-facing instances unpatched past 2026-05-28 as potentially
    compromised, review logs for POST /OA_HTML/ibytransmit, rotate credentials/keys on the host after forensic review.'
