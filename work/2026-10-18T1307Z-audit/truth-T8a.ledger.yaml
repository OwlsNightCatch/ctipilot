  - claim_id: 43e1002fa9
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "record 2026-09-20T13:34:54Z"
    kind: record-summary
    text: "The sourcing note said no vendor advisory added exploitation detail beyond re-listing fixed kernel builds. Red Hat had already updated its advisories for all three flaws, on 2026-09-19 at 02:00 UTC, to acknowledge active exploitation, state that public exploits exist and tell customers to address them with high priority. The sourcing note and the verification value now reflect that second assessment, and the three NVD API endpoints previously listed as sources are replaced by Red Hat's own per-flaw advisory pages. Two evidence quotes attributed to those endpoints were re-checked: one is carried verbatim by Red Hat's page and is now attributed there, the other is on no reachable first-party page and is removed. The three inline citations in the analysis pointed at the same endpoints and now point at Red Hat's pages; the sentence on the bridge flaw is rewritten to what Red Hat states, because the function name and the page-fragment detail it previously carried are on no source the entry can cite."
  - claim_id: 583bd30809
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "record 2026-09-27T13:28:04Z"
    kind: record-summary
    text: "The second score recorded for CVE-2025-39682 was wrong in every part. Red Hat's own CVE page scores it 7.0 with vector AV:N/AC:H, not 7.1, and the re-score is Red Hat's rather than NVD's; NVD and cve.org both publish 9.8 with AV:N. No authority scores this flaw AV:L, and the local attack vector the entry recorded contradicted its own analysis, which describes the flaw as reachable over the network on hosts using kernel TLS receive offload. The other two CVEs' score annotations were re-checked against the same authority and are accurate."
  - claim_id: 5bcc3270cb
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "record 2026-09-30T07:00:04Z"
    kind: record-summary
    text: "The headline, summary and main text said the KEV listing was the only public evidence of exploitation, although Red Hat had stated on 2026-09-19 that public exploits exist. They now carry Red Hat's statement, without claiming Red Hat confirms active exploitation. The takeaway and action no longer claim that general-purpose fleets are not at elevated risk or that three configurations are the only exploited surfaces, the US federal deadline remark and source-file names no cited page carries are removed, and the fixed stable kernels cite kernel.org's ChangeLogs, adding 7.0.13 for CVE-2026-53266. The Hacker News' local reading of CVE-2025-39682 is stated as a contradiction to Red Hat's remote one. CVE-2025-39964 is typed as denial of service, as Red Hat describes it."
  - claim_id: 9f55b18ffc
