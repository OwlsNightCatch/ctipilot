  - claim_id: d4eb3fa3e3
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "headline"
    kind: frontmatter
    text: "Seven agencies report DPRK's fake-interview crew infected 30,000+ devices and took $10.7M in crypto between December 2025 and July 2026"
  - claim_id: 87f3e17237
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "summary"
    kind: frontmatter
    text: "Japan's NPA and NCO, the US FBI and DoD Cyber Crime Center, Australia's ASD/ACSC and Germany's BND and BfV jointly published a Cybersecurity Advisory on 2026-09-18 on the DPRK \"WaterPlum\" cyber-actor group, the long-running campaign publicly known as \"Contagious Interview\". From around December 2025 through July 2026 it counts 30,000+ infected devices across 100+ countries, funds or credentials exfiltrated from 7,000+ cryptocurrency wallets, and roughly USD 10.7 million transferred to DPRK. The advisory names five malware families delivered via fake technical-interview coding assignments and reports Japan's first dismantled DPRK \"laptop farm.\""
  - claim_id: 93a2fc76a9
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "Seven government agencies (Japan's National Police Agency and National Cybersecurity Office, the US FBI and DoD Cyber Crime Center, Australia's Signals Directorate/ACSC, and Germany's BND and BfV) jointly published a Cybersecurity Advisory on 2026-09-18 on the North Korean \"WaterPlum\" cyber-actor group, publicly known as **Contagious Interview** ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: 5308056e4e
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory puts figures on the campaign from around December 2025 through July 2026: at least 30,000 infected devices across more than 100 countries, funds or credentials exfiltrated from over 7,000 cryptocurrency wallets, and roughly 1.7 billion Japanese yen (about USD 10.7 million) moved to DPRK ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: bfc2e6880a
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "Germany's BfV confirms the campaign has targeted software developers \"also in Germany\" (translated from German) ("
    urls: ["https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html"]
  - claim_id: 0f3e6a099d
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "Those files carry one of five malware families the advisory names: **BeaverTail** (JavaScript-based malware hidden inside NPM packages and downloadable from GitHub or Bitbucket), **InvisibleFerret** (a Python backdoor), **OtterCookie** (a JavaScript RAT and infostealer), **OtterCandy** (combining OtterCookie and RATatouille features), and **StoatWaffle**, a modular Node.js loader, credential harvester and RAT that hides inside blockchain-themed decoy VS Code project repositories and auto-executes through a malicious VS Code configuration file the moment the victim opens and trusts the folder ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: dfe0118ffa
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory ties the malware-delivery operation to North Korea's remote-IT-worker placement scheme: \"the NPA and the FBI assess both WaterPlum cyber actors and some North Korean IT workers operate under the 313 General Bureau of the Munitions Industry Department subordinate to the Central Committee of the Workers Party of Korea\" ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: ade16de627
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "It adds that some WaterPlum actors also operate as North Korean IT workers, and that both used the same IP addresses when accessing laptop farms, using crowdsourcing services and applying for positions at a Japanese cryptocurrency exchange ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: a7f01808dd
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory defines a laptop farm as a location, often an enabler's residence, where employment-related computers are set up and remotely controlled by North Korean IT workers ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: 48a40eda9c
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory records two prior cases of IT-worker escalation beyond simple wage fraud: one worker extorted a company over payment and published its proprietary source code online, and another defaced and disabled a hiring company's website ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: cb87aac6bc
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "The advisory's interview flags for suspected North Korean IT workers are refusals or excuses regarding in-person meetings, requests to receive payment in cryptocurrency, frequent glances at another monitor as if reading from the screen, occasional background voices, and repeated video or audio freezes ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: ee62484a55
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: cited
    text: "Developers should check any `tasks.json` for code that downloads or executes further files, avoid opening unknown projects from a path previously marked as trusted, run unknown code only in a sandbox or virtual machine, and be especially cautious of commands or scripts containing strings such as curl, base64, -enc, mshta, Invoke-WebRequest or hidden ("
    urls: ["https://www.ic3.gov/CSA/2026/260918.pdf"]
  - claim_id: 48d11fe731
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: uncited
    text: "Once backdoored, operators use the RATs for persistence and lateral pivoting while infostealers harvest browser-stored credentials, clipboard contents, keystrokes, screenshots and cryptocurrency-wallet data to a command-and-control address; the same access lets operators pursue further espionage or intellectual-property theft inside the victim's employer."
  - claim_id: 0a9758f9c7
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: uncited
    text: "Separately, Japanese authorities \"for the first time in Japan\" identified and dismantled a \"laptop farm\" operated by an enabler in Japan, and obtained evidence that the actor group transferred \"several hundred million\" yen in cryptocurrency abroad."
  - claim_id: 503ae9828d
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** this is a social-engineering-led initial-access vector, not an exploited vulnerability, so the controls are procedural rather than patch-based."
  - claim_id: 0a3b15e4b9
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "HR and recruiting workflows, including at cantonal or federal IT departments and their contracted suppliers that source developer talent through crowdsourcing or freelance platforms, should never let a candidate run unreviewed take-home-assignment code with credentials or production access, should sandbox or review any coding-assignment repository before execution, and should verify a remote contractor's identity documents against known facilitator/laptop-farm patterns before onboarding."
  - claim_id: 62e0746c6b
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "For developers and their endpoints, the advisory's controls are to open unknown VS Code projects only in Restricted Mode, by answering \"No\" to the prompt asking whether to trust the authors of the files in the folder, which stops `.vscode/tasks.json` from running on launch."
  - claim_id: 3d970e315b
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "**Triage:** BeaverTail/InvisibleFerret/OtterCookie-family execution shows up as a `node` or `python` process spawned from an IDE or terminal session shortly after a new project folder is opened or an `npm install` completes, followed by outbound connections to non-corporate destinations and API calls against browser credential stores or the clipboard — legitimate build tooling does not read browser credential stores or poll the clipboard."
  - claim_id: d54ab6c17e
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "StoatWaffle's variant of the same pattern is a VS Code auto-run entry (a `.vscode` configuration file) firing on folder-open/trust in a freshly cloned, blockchain-themed repository the organization's own ticketing has no record of."
  - claim_id: d77f63d68c
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "body"
    kind: derived
    text: "The distinguishing context, in both cases, is timing correlation with an active job-interview or coding-test process rather than the presence of `node`/`npm`/VS Code activity alone."
  - claim_id: 826f37fc9b
