  - claim_id: f825b384ce
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: cited
    text: "Oracle published its September 2026 Critical Security Patch Update on 2026-09-15 (Rev 1, initial release) with 673 new security patches across its product families; Oracle Fusion Middleware alone accounts for 153 of them, and Oracle states that \"78 of these vulnerabilities may be remotely exploitable without authentication, i.e., may be exploited over a network without requiring user credentials\" ("
    urls: ["https://www.oracle.com/security-alerts/cspusep2026.html"]
  - claim_id: a8088c7837
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: cited
    text: "Six flaws in the release carry a CVSS 3.1 base score of 10.0 in Oracle's own risk matrix with Attack Vector Network, Attack Complexity Low, Privileges Required None, User Interaction None and Scope Changed, meaning an unauthenticated request across the network reaches high confidentiality and integrity impact and crosses a security boundary (the first five also reach high availability impact; Hyperion Financial Management's is rated none): CVE-2026-83021 in the Web Container of Oracle WebLogic Server over HTTP, CVE-2026-71133 in the Authentication Engine of Oracle Access Manager over HTTP, CVE-2026-83099 in Oracle Forms Services over HTTP, CVE-2026-83059 in the OID LDAP Server of Oracle Internet Directory over LDAP, CVE-2026-83020 in the centralized third-party jars of Oracle Platform Security for Java over HTTP, and CVE-2026-87230 in the Security component of Oracle Hyperion Financial Management over HTTP ("
    urls: ["https://www.oracle.com/security-alerts/cspusep2026.html"]
  - claim_id: 01a690342e
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: cited
    text: "The Netherlands' national cyber-security centre relayed the release's 153 Fusion Middleware fixes as advisory NCSC-2026-0372 on 2026-09-16 and rated both likelihood and damage high ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0372"]
  - claim_id: ff8d725304
    entry: 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10
    surface: "body"
    kind: cited
    text: "The Critical Security Patch Update is Oracle's second, higher-frequency release line, published alongside the quarterly cumulative Critical Patch Update rather than replacing it: Oracle describes it as providing \"targeted, high-priority security fixes in a smaller, more focused format, making them easier to apply with minimal disruption\" and says these updates \"complement Oracle’s existing quarterly cumulative Critical Patch Updates (CPUs)\" ("
    urls: ["https://www.oracle.com/security-alerts/cspusep2026.html"]
