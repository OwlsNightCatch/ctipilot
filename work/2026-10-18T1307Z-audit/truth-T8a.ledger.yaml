  - claim_id: 8352d41018
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "summary"
    kind: frontmatter
    text: "CISA added three unrelated Linux kernel CVEs to its Known Exploited Vulnerabilities catalog on 2026-09-18: CVE-2025-39682 (kTLS receive-path logic error, network-reachable where kernel TLS is in use according to Red Hat, local according to The Hacker News), CVE-2025-39964 (AF_ALG crypto-socket race condition, local) and CVE-2026-53266 (netfilter bridge ebtables SNAT out-of-bounds write, local). No actor, campaign or technical account of the exploitation is public; Red Hat updated its advisories on 2026-09-19 to state that public exploits exist."
  - claim_id: 20c21d674e
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch the kernel ahead of the regular cycle on Linux hosts that load the tls module (CVE-2025-39682, remotely reachable), run ebtables SNAT rules that rewrite ARP hardware addresses on a bridge (CVE-2026-53266), or give less-trusted users local access (all three); where the update must wait, block the tls module from loading or remove the ARP-rewrite SNAT rules, as Red Hat advises."
