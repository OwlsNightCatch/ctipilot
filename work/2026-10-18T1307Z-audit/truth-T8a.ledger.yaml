    kind: record-summary
    text: "The headline, summary, main text and one action now state the release-wide figure of fifty unauthenticated CVSS 9.8-10.0 flaws instead of framing the release around six, and the 2026-09-29 section no longer narrates the counting pass (its tally of flaws outside Fusion Middleware is corrected from three to four). An unsupported authentication-bypass class is removed from all fifty flaws and the tags, as are a triage line and a takeaway clause that assumed an undisclosed mechanism and an unsourced claim about Oracle's advisory practice. The release schedule now follows Oracle's monthly calendar, NCSC-NL's scope and ratings are stated as published, the 2025 E-Business Suite campaign is sourced to Cl0p alone, two actions that restated the takeaway are trimmed, the sourcing note is plain provenance and the verification flag is single-source. Priority is lowered to notable because no flaw is exploited and the release is Oracle's regular monthly cycle. The count of Fusion Middleware components with a CVSS 10.0 flaw is corrected from four to five."
  - claim_id: 68a121b888
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "headline"
    kind: frontmatter
    text: "Cisco Talos maps The Gentlemen's AD attack chain, including credential theft from a mounted backup image rather than the live domain controller"
  - claim_id: 4c8051c6a7
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos reconstructed a six-phase Active Directory attack chain used by an operator associated with the ransomware-as-a-service brand The Gentlemen, recovered from an exposed open directory's own command history. The chain tunnels through Chisel/Ligolo-ng, enumerates AD with NetExec (Talos says RustHound/BloodHound-related tools may also have been used), attempts to exploit a public-facing GLPI SQL injection and attempts Zerologon/MS17-010 for lateral movement, then extracts ntds.dit and SAM not from the live domain controller but from a CIFS-mounted VHDX backup image, and exfiltrates the VHDX backup images themselves in 256MiB chunks to Wasabi cloud storage via rclone."
  - claim_id: 6c69a62d7c
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "cves[CVE-2025-24799]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2025-24799\", \"cvss\": \"7.5\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \">= 10.0.0, < 10.0.18\", \"fixed\": \"10.0.18\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: b12f43dbd8
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: cited
    text: "Cisco Talos recovered an exposed open directory believed to belong to an operator associated with the ransomware-as-a-service brand The Gentlemen, and reconstructed a six-phase attack chain from the directory's own shell command history ("
    urls: ["https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/"]
  - claim_id: de137e3120
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: cited
    text: "For initial footholds against public-facing applications, the actor tried to exploit CVE-2025-24799 with a PoC and sqlmap to pull user information from the database, an unauthenticated SQL injection in GLPI's inventory endpoint fixed in GLPI 10.0.18 ("
    urls: ["https://github.com/glpi-project/glpi/security/advisories/GHSA-jv89-g7f7-jwfg"]
  - claim_id: 693c5dd67f
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: cited
    text: "The credential-theft step is the chain's most distinctive detail: rather than dumping credentials from a live, monitored domain controller, the operator mounted a backup share over CIFS, installed `libguestfs-tools`, `qemu-utils` and `nbd-client` to inspect the Windows filesystem inside VHDX backup images, copied out `ntds.dit`, `SAM` and `SYSTEM`, and ran Impacket's `secretsdump.py` offline against the extracted files ("
    urls: ["https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/"]
  - claim_id: fb563ecf53
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: cited
    text: "Talos notes that The Gentlemen is suspected to be led by individuals based in Russia, which it says further supports the connection to the group ("
    urls: ["https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/"]
  - claim_id: 3e067d418b
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: uncited
    text: "The operator first built a pivot platform using Chisel, Ligolo-ng and SSH tunnels, then ran nmap and masscan against externally exposed hosts and internal services once inside, then used NetExec to enumerate SMB shares, host information, LDAP and computer information in Active Directory; Talos assesses the operator may also have used RustHound/BloodHound-related tools (a Rust BloodHound collector) to collect domain users, groups, computers, administrative privileges and trust relationships for attack-path analysis."
  - claim_id: 8aedf77e01
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: uncited
    text: "Toward the domain controller, the command history shows attempted exploitation of CVE-2020-1472 (Zerologon) and the MS17-010 vulnerabilities alongside NTLM-relay tooling via Responder."
  - claim_id: a0080a053b
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: uncited
    text: "Separately, for lateral movement once inside the network, the operator used NetExec and Impacket to attempt authentication against SMB, LDAP, RDP and WinRM across multiple hosts."
  - claim_id: 0c4a192607
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: uncited
    text: "The VHDX backup files themselves, not just the small credential-dump output, were compressed with `zstd`, split into 256MiB chunks and uploaded concurrently (up to 16 files at a time) to Wasabi cloud storage via `rclone`, with the operator visibly reconfiguring transfer settings mid-exfiltration to improve speed and reliability."
  - claim_id: f1f5f57b7b
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: uncited
    text: "Command and control ran on the open-source AdaptixC2 post-exploitation framework, and Russian-language script comments plus Cyrillic-keymap mistyping in the operator's own bash history (`whoami`, `ls`, `ip a`, `clear`, `exit` typed on a Russian keyboard layout) indicate to Talos the possibility that a Russian-speaking individual was involved."
  - claim_id: 6555f624df
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** backup infrastructure is a credential-theft target in its own right, not only a ransomware-destruction target — any process that mounts, loop-attaches or NBD-attaches a VHDX/VHD backup image and then reads `ntds.dit`, `SAM` or `SYSTEM` out of it is functionally equivalent to a live NTDS dump and should alert identically."
  - claim_id: 55ac8f980b
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: derived
    text: "Monitor for `libguestfs-tools`/`qemu-utils`/`nbd-client` installation and CIFS mounts of backup shares on hosts that are not the designated backup-management server, and treat `rclone` (or any bulk-upload tool) process creation with a cloud-storage destination immediately following such a mount as a high-confidence exfiltration signal."
  - claim_id: 428a5cf1d3
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: derived
    text: "GLPI deployments should confirm they are on 10.0.18 or later."
  - claim_id: 1e0969254a
    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate backup-verification and disaster-recovery testing also mount VHDX images and inspect their contents, so the mount event alone is not the signal, the discriminator is the immediate follow-on: `secretsdump.py` or an equivalent credential-extraction tool run against files copied from that mount, on a host or account that has no operational reason to be doing backup verification."
