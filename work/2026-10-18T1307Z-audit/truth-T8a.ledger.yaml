    kind: cited
    text: "Gemini CLI has a distinct but equally exploitable variant: it fetches the pinned commit into `FETCH_HEAD` then checks that out, which an attacker defeats by naming their malicious default branch literally \"FETCH_HEAD\" ("
    urls: ["https://www.air.security/blog-posts/plugin4shell"]
  - claim_id: 1438a40e39
