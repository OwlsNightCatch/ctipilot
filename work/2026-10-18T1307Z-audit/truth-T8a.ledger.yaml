    kind: frontmatter
    text: "Oracle's September 2026 Critical Security Patch Update, published 2026-09-15, carries 673 patches of which 153 are for Fusion Middleware, and Oracle states 78 of those may be exploited over a network without credentials. Oracle's own risk matrix lists fifty CVEs at CVSS 9.8-10.0 that are network-reachable without privileges or user interaction and marked remotely exploitable without authentication. Six are CVSS 10.0 flaws in WebLogic Server, Access Manager, Forms, Internet Directory, Platform Security for Java and Hyperion Financial Management, and forty-four are CVSS 9.8 flaws across Fusion Middleware (Access Manager, Forms, Internet Directory and Platform Security for Java again, plus Data Integrator, Identity Manager, JDeveloper, WebCenter Enterprise Capture/Portal/Sites, WebLogic Server and Service Delivery Platform) and other product lines: E-Business Suite, Hyperion Financial Management, Business Intelligence/BI Publisher, Enterprise Manager, Communications Unified Assurance and Product Lifecycle Analytics. No exploitation is reported for any of the fifty. The release is Oracle's off-quarter patch line, which a calendar built only on the quarterly dates will miss."
