  - claim_id: da8b184d29
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2025-39682 is a logic error in the kernel's TLS receive path: a zero-length record taken from the `rx_list` queue slips past the per-`recvmsg()` record-type check, a corner case the fix describes as previously unhandled, and Red Hat says it \"can be remotely triggered only when kernel TLS (CONFIG_TLS with the TLS ULP) is in use\" ("
    urls: ["https://access.redhat.com/security/cve/cve-2025-39682"]
  - claim_id: a65ba4f81e
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2025-39964 is a race condition in the AF_ALG crypto user-API socket: concurrent `sendmsg()` calls to the same socket were never given exclusive-write ownership, so request payloads interleave and corrupt per-socket state, which a local user can use to crash the system or corrupt cryptographic results ("
    urls: ["https://access.redhat.com/security/cve/cve-2025-39964"]
  - claim_id: c2544507fd
    entry: 2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat
    surface: "body"
    kind: cited
    text: "CVE-2026-53266 is an out-of-bounds write in the netfilter bridge ebtables SNAT target, where the ARP sender-hardware-address rewrite writes directly into a socket-buffer fragment backed by a splice-imported file page ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
