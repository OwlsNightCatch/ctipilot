  - claim_id: 46d93ab19d
    entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
    surface: "record 2026-09-30T07:02:21Z"
    kind: record-summary
    text: "The priority moves from high to notable: the advisory documents an established campaign and asks no new decision of Swiss public bodies this week. The text had equated the advisory's North Korean IT workers with vendor aliases the advisory never uses, and the PurpleDelta IT-worker actor is no longer linked. It also claimed the advisory was the first to quantify the campaign and to name the five families together, listed interview flags the advisory does not give, and gave the advisory's figures without their December 2025 to July 2026 period. The title, headline, summary and main text now follow the advisory, including its interview flags, its statement that some WaterPlum actors also work as IT workers, its laptop-farm definition and its BeaverTail description, and the takeaway gains its VS Code and command-line controls."
