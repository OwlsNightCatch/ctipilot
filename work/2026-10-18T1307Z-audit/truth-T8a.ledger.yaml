    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any environment permitting outbound access to `*.devtunnels.ms` should treat an unexpected dev-tunnels connection from a server or workstation as equivalent to an unauthorized reverse-tunnel opening; rdp2tcp's presence inside an RDP session is detectable via Windows event IDs 132 and 148 in `Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational.evtx`, where the RemoteFX virtual-channel name reads \"rdp2tcp\" or a random string in place of a legitimate RDS channel name."
