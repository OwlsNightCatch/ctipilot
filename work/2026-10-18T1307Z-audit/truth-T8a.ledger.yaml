    surface: "record 2026-09-29T04:40:00Z"
    kind: record-summary
    text: "A systematic, full re-verification against Oracle's own September 2026 risk matrix (every row with Access Vector Network, Privileges Required None, User Interaction None and \"Remote Exploit without Auth.\" Yes) finds forty-four further unauthenticated CVSS 9.8 flaws from the same release, not the eight this entry first reported: thirty-two further flaws inside the Fusion Middleware product line (Access Manager, Forms, Internet Directory and Platform Security for Java, all previously covered only by their single CVSS 10.0 flaw, plus first coverage of Data Integrator, Identity Manager, JDeveloper, WebCenter Enterprise Capture, WebCenter Portal, WebCenter Sites, WebLogic Server and Service Delivery Platform), three in Oracle E-Business Suite (Applications Framework, Document Management, Mobile Application Server), one in Business Intelligence Enterprise Edition plus one in BI Publisher, two more in Hyperion Financial Management, two in Enterprise Manager, two in Communications Unified Assurance, and one in Product Lifecycle Analytics. Total across the release: fifty, not fourteen. None is reported exploited and none is CISA KEV-listed. E-Business Suite remains the highest-priority addition given its history as Cl0p's 2025 mass-exploitation target, but the largest share of the exposure by far is inside Fusion Middleware's identity, forms, directory and portal components."
