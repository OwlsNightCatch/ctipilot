    kind: record-summary
    text: "The FBI has issued its own press release confirming the fbijobs.gov compromise and \"alleged impact\" to employee PII, upgrading its prior \"aware of claims\" holding statement, while stating it still has not confirmed scope or attributed the breach to ShinyHunters by name. Nextgov/FCW reports Reuters and BBC findings of psychiatric/medical files in the stolen sample, and its own reporting identifies counterintelligence-relevant staff (including Remote Operations Unit personnel) among roughly 5,000 exposed entries; researchers warn of physical-safety and counterintelligence exposure. ShinyHunters says it will not publish the data, and states its motive is coercive (forcing retraction of a May FBI advisory), not financial. Dutch police confirmed the arrest of a suspect tied to the ShinyHunters investigation, and multiple sources describe a collective calling itself ScatteredLapsussHunters as now directing ShinyHunters' operations."
