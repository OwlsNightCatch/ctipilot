    entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
    surface: "headline"
    kind: frontmatter
    text: "Arista confirms exploitation of an SD-WAN orchestrator flaw that has no patch for two of its four release trains"
  - claim_id: 7d38fbb735
    entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
    surface: "summary"
    kind: frontmatter
    text: "Arista's on-premises VeloCloud Orchestrator (CVSS 10.0/9.5) is under active exploitation via a flaw reachable from the VCO web interface on deployments using certificate-based Edge authentication, requiring no VCO credentials. Fixes exist only for the 5.2 and 6.4 trains; 6.1.x and 7.0.x remain unpatched as of 2026-09-22 — the same trains Arista already reported exploited via a separate flaw in July 2026."
  - claim_id: 28e7dcedd8
    entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch or isolate every on-prem VeloCloud Orchestrator now — two release trains have no fix: Arista confirms active exploitation. Deployments on the 5.2 or 6.4 trains must upgrade to 5.2.3.16+ / 6.4.2.8+ immediately. Deployments on the unpatched 6.1.x or 7.0.x trains must restrict VCO web-interface access to trusted administrative networks now, block outbound ports the VCO does not need, and watch for unexpected outbound traffic, backdoor daemons and webshells until a fix ships. Arista conditions exposure on certificate-based Edge authentication but does not say which certificate modes qualify, so moving Edge authentication to PSK mode is an untested option, not a vendor mitigation."
  - claim_id: c0f8f1fdd3
    entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every on-prem VeloCloud Orchestrator on the 5.2.x or 6.4.x train to 5.2.3.16+ / 6.4.2.8+ now."
  - claim_id: 5e44706188
    entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On the unpatched 6.1.x/7.0.x trains, restrict VCO web-interface access to trusted administrative networks now — no fix exists yet."
