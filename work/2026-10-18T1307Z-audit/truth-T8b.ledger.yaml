    text: "The takeaway said no CVE or Oracle advisory was involved, although ShinyHunters told BleepingComputer it used the WAF bypass for CVE-2026-35273 against FBI Jobs. That link is now attributed to the group, the CVE is recorded with a link to the PeopleSoft campaign entry that carries the patch and hunt actions, the watch-for-an-advisory action is removed, and the priority moves from high to notable because the defender value lies in the already-covered CVE. The FBI's 2026-09-23 statement leaves the point of breach undetermined, and sources differ on whether it confirms the compromise: Krebs on Security reads it as confirmation, while CyberScoop reports no confirmed scope or attribution. The group's motive is now given in its own words, including its later description of the confrontation as a marketing campaign. Figures and the analyst-role detail are cited to the outlets that carry them, the takeaways are folded into one, and the arrested suspect is no longer named."
  - claim_id: 31df19930b
    entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
    surface: "record 2026-10-07T04:53:00Z"
    kind: record-summary
    text: "The FBI's cyber chief said on 2026-10-06 that the incident resulted from a security failure of a platform managed by a third-party organization after a contractor failed to implement a security patch explicitly issued to secure it, and that the FBI removed the contractor; Reuters' sources, as relayed by SecurityWeek, name Oracle PeopleSoft and Accenture. This replaces the 2026-09-23 position that the point of breach was undetermined. Nextgov/FCW also relays Reuters' report of a suspected member of the group detained in Jordan and helping investigators."
