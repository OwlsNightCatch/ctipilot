    surface: "record 2026-09-30T07:01:51Z"
    kind: record-summary
    text: "The detection guidance carried no citation although it comes from Arista's advisory, which also lists behavioral compromise artifacts the entry omitted. The Detection line now cites Arista and describes the backdoor's persistence behavior and log artifact without indicator values, and the Triage line is tightened to what that guidance supports. The immediate action and takeaway no longer present a switch to PSK Edge authentication as a vendor control, since Arista names none and does not say which certificate modes are exposed, and they now carry Arista's own interim controls. The triage line no longer claims an orchestrator never makes outbound web connections, the artifact description keeps to what Arista lists, and the detection, triage and takeaway lines are separated. The default-config tag is removed, since Arista says only orchestrators with certificate-based Edge authentication configured are exposed."
