    kind: record-summary
    text: "ShinyHunters has confirmed to BleepingComputer that the FBI Jobs intrusion used the same URL-encoded WAF-bypass technique Mandiant documents in a separate, wider mass-exploitation wave against CVE-2026-35273, partially resolving what was an entirely unconfirmed zero-day claim; the group still claims it also exploited a further, still-undisclosed vulnerability in the same PSEMHUB component. No party has confirmed the additional vulnerability, and the FBI has not updated its statement."
