    text: "Microsoft enforces SSPR for admin accounts regardless of the tenant-wide SSPR policy, so in a tenant that has disabled SSPR for standard users, any account that still reaches method selection is very likely a privileged role account, and its registered factors are exposed the same way: \"Admin accounts bypass this check entirely and proceed to method enumeration regardless\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 351bfa2e84
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: cited
    text: "Microsoft removed the portal's visual CAPTCHA in August 2026, replacing it with backend throttling and behavioural abuse detection rather than a challenge the user must solve ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal"]
  - claim_id: 56b07a8bd5
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "Submitting an email address triggers an ASP.NET UpdatePanel POST, and the server's reply carries a hidden `CurrentViewName` field that tells an attacker exactly what happened server-side: `ViewMultigateUserControl` means the account exists and SSPR advanced to method selection, while a genuine not-found bounces back to `ViewUserIdentifierVerification`."
  - claim_id: 7b63aac8af
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "For an account that reaches the method-selection screen, the response HTML lists every registered second factor as visible radio buttons, with unregistered methods present in the DOM but hidden — so an attacker also learns whether a target relies on an authenticator app, SMS, or a more easily phished alternate-email one-time code."
  - claim_id: 6d13b17a78
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "The technique's sharpest edge is administrator identification."
  - claim_id: e69f196915
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "This turns a list of candidate email addresses harvested from a company website, LinkedIn, or a data breach into a confirmed target list, ranked by which accounts have the weakest second factor, before any credential attack begins."
  - claim_id: 95c31d017e
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: uncited
    text: "The researcher released a public automation tool, ResetSpy, that scripts bulk lookups with rotating user agents and randomised timing to reduce fingerprinting."
  - claim_id: e8f3c3213a
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: derived
    text: "**Detection:** Entra ID / Azure AD self-service-password-reset audit events are the telemetry class — specifically SSPR activity records carrying a named error status (such as the \"not a member of the password reset group\" condition) recurring across many distinct usernames from a limited source population in a short window, with no subsequent completed reset."
  - claim_id: 843a061a52
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: derived
    text: "**Triage:** a genuine user forgetting a password generates one SSPR lookup that is normally followed by a completed reset; a burst of lookups against many usernames with no completions is the anomalous pattern the volume/velocity discriminator is built on, not the existence of lookups themselves."
  - claim_id: 4eb941a275
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population, remove alternate-email-OTP and security-question options from the permitted SSPR methods, and enforce phishing-resistant MFA on every privileged role — since Microsoft cannot let admin accounts opt out of the underlying enumeration, a stronger factor on those accounts is the control that actually removes the value of what the technique reveals."
  - claim_id: 83ad6633c4
    entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
    surface: "record 2026-09-30T07:03:26Z"
    kind: record-summary
    text: "The single action restated the Defender takeaway's hardening advice, including generic phishing-resistant MFA guidance, rather than a task the team starts now. It is removed, and the hardening guidance stays in the takeaway."
  - claim_id: e7abc45e8f
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "headline"
    kind: frontmatter
    text: "A malware implant treats commercial AI chatbot endpoints as its command-and-control infrastructure, no attacker server required"
  - claim_id: 0f4f7434ec
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos disclosed CLOSEDQUORUM on 2026-09-22, a Go-compiled Windows implant that queries up to four commercial LLM providers (DeepSeek, Qwen, Mistral, Google Gemini) each cycle and executes whichever action wins a plurality vote among their responses — credential theft, process injection, or persistence — with results relayed and stolen data exfiltrated through a Discord webhook. Talos found it via CAIRN, a new open-source toolkit it released the same day for tracking AI-integrated malware, and states plainly it has no confirmation of in-the-wild deployment; the public distribution build ships placeholder API keys."
  - claim_id: ff4c6b2935
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "Cisco Talos disclosed CLOSEDQUORUM on 2026-09-22, a 16.4MB, 64-bit Go-compiled Windows implant it says is \"the first publicly documented Windows implant to apply this model to tactical command and control\" ("
    urls: ["https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"]
  - claim_id: b179ec607c
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "On a tie, a hardcoded preference order settles it: \"DeepSeek holds the deciding vote in any tie\" ("
    urls: ["https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"]
  - claim_id: 5c930c2518
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "Independent of the LLM-selected action, the implant suppresses ETW telemetry by overwriting `EtwEventWrite` with a single RET instruction, blinding any host-side ETW consumer to its subsequent activity ("
    urls: ["https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"]
  - claim_id: e9aa2af2fe
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "Talos states plainly \"we do not have confirmation of in-the-wild deployment,\" though artifacts in the binary connect its developer to carding-forum postings dating back to 2025 ("
    urls: ["https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"]
  - claim_id: 152bdb6285
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "The Hacker News, reporting on the disclosure, draws its own comparison to LAMEHUG, malware Ukraine's CERT-UA reported in July 2025 that asked an AI model to write commands for a task already set in its code, contrasting it with CLOSEDQUORUM asking the models to choose the task itself ("
    urls: ["https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html"]
  - claim_id: 4d27062d30
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Instead of a dedicated attacker-operated server, its `ModelOrchestrator` component queries up to four commercial LLM providers — DeepSeek, Qwen, Mistral and Google Gemini — each cycle, with a system prompt instructing each model to \"provide ONLY executable decisions\" alongside host context (hostname, OS version, admin status) and the current target process."
  - claim_id: 10227fad09
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Each provider must respond with a fixed JSON schema naming one of four actions; `interModelDiscussion()` tallies the providers' decisions by plurality vote and executes the winner, discarding any malformed or off-schema response."
  - claim_id: 326267f8d1
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "The four possible actions are `steal` (simultaneous LSASS memory dumping via `SeDebugPrivilege` and `MiniDumpWriteDump`, Chrome/Edge/Firefox saved-credential harvesting, and MetaMask/Exodus/Ethereum wallet data collection), `inject` (Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing when a model selects that exploit type), `persist` (establishes three mechanisms — a Windows-Update-themed Registry Run-key value, a scheduled task, and a permanent WMI event subscription that fires a script every 60 seconds), and `move`, which has no handler in the public build."
  - claim_id: 0072ce79b0
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Every model decision, its stated reasoning, and staged or stolen data are relayed to the operator through a Discord webhook, with exfiltrated files AES-256-GCM encrypted, base64-encoded and posted in roughly 1,900-byte chunks at one-second intervals."
  - claim_id: 307edc425f
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Talos found the binary via CAIRN, an open-source research toolkit for tracking AI-integrated malware that it released the same day, and dates the analysed build to 2026-06-17 under a prior alias, BALZAK, before it was renamed on 2026-07-03."
  - claim_id: ebce4c92d5
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Talos's CAIRN toolkit is unrelated to a similarly-named autonomous exploitation engine used in separate, unrelated 2026 campaigns — the shared name is coincidental."
  - claim_id: d9fc5a433d
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "The publicly distributed build ships with placeholder API keys and a dummy Discord webhook, so Talos has not observed a complete end-to-end execution; Talos assesses the actual distribution model puts a developer generating a customised binary with an individual operator's credentials injected at compile time, meaning any live deployment would run on infrastructure Talos has not seen."
  - claim_id: b9cf8086a6
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Talos frames the finding as evidence of \"effort displacement\" — an entire phase of an intrusion handed to a model rather than merely AI-assisted tooling."
  - claim_id: ea85c0e495
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "The implant's failure modes are deterministic and, Talos notes, exploitable by defenders: provider refusals and rate limits, a fixed tie-break order, and a sleep-retry response to total provider failure rather than a default action."
  - claim_id: 74d31e7b29
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "**Detection:** the actionable signal is not a domain or IP to block, since the \"C2 infrastructure\" is the same commercial AI-provider endpoints thousands of legitimate applications call daily."
  - claim_id: 0fbd83f77c
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "The discriminator is co-occurrence: AI-service API traffic from a Windows binary with no legitimate reason to call multiple LLM providers within a short window, correlated with LSASS access, code injection into a suspended process, new WMI persistence, or Discord webhook traffic from the same host or process, recurring at a randomised 5-to-15-minute polling cadence chosen to outlast short sandbox runs."
  - claim_id: 7b2f0646a2
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "Prompt content itself is visible only with TLS inspection or at the provider side; a network-only vantage point sees the fact of repeated multi-provider calls, not their content."
  - claim_id: 033f5e1b92
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate software may independently call one AI-provider API; a single Windows process contacting several distinct commercial LLM providers in the same short window, especially alongside credential-access or injection telemetry, is not a pattern ordinary applications produce."
  - claim_id: c978c0cd6e
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** CLOSEDQUORUM is a capability demonstration with no confirmed live deployment, not an active campaign — but its architecture (commercial AI endpoints as C2, LLM-driven action selection) is a detection blind spot worth building hunt logic for now, before a deployed variant with real credentials appears."
  - claim_id: 9ef7533058
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "Prioritise correlating outbound AI-provider API traffic from endpoint processes against LSASS-access, injection and WMI-persistence telemetry rather than attempting to blocklist AI-service domains that legitimate tools also use."
  - claim_id: 218b66f3f9
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "record 2026-09-30T06:56:07Z"
    kind: record-summary
    text: "No in-the-wild deployment of the implant is confirmed. The priority moves from notable to routine."
