  - claim_id: 306e864e8d
    entry: 2026-09-23/austria-nisg-2026-bcs-transposition
    surface: "summary"
    kind: frontmatter
    text: "Austria's NIS2-transposition law (NISG 2026) enters into force on 1 October 2026, creating the Bundesamt für Cybersicherheit (BCS) as the supervisory authority for essential and important entities, with a graduated 24h/72h incident-reporting clock, mandatory management security training, and new powers for the BCS to run active vulnerability scans against essential entities' internet-facing systems. Blocking or defending against the scans becomes punishable."
