    entry: 2026-05-28/nx-console-tanstack-daemon-tools-supply-chain-cascade-lands
    surface: "record 2026-09-30T07:16:54Z"
    kind: record-summary
    text: "CISA's catalog is now cited for the 2026-05-27 KEV additions, and CISA marks the Nx Console and TanStack compromises as used in known ransomware campaigns. Claims no source carries are removed: token scopes, a tag push, hosted-runner publish secrets, Claude Code or AWS credential-file harvesting, GitHub confirming Grafana's breach, Kaspersky supplying KEV evidence, a vendor statement about the signing path, a six-week window, unsigned marketplace extensions and an uncited Laravel-Lang comparison. The payload and GitHub-breach sentences cite the pages that carry them, and the detection guidance follows the postmortem's version check and persistence artifacts. An exposure line gives the affected versions and the reach of the malicious Nx Console release, Grafana's extortion is noted, and a cited takeaway closes the analysis. The Mini Shai-Hulud campaign and the Nx Console and DAEMON Tools incidents are linked. The exposure and detection lines now also cover the upstream TanStack compromise as TanStack's advisory describes it."
