    text: "In workflow definitions, an action reference that resolves to a commit matching no legitimate tag or branch head of the action's repository is the signature of this attack ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
