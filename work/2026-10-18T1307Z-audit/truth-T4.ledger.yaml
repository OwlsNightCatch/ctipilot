    text: "Runner egress control is the layer that still holds when a compromised action runs: StepSecurity added the exfiltration domain to Harden-Runner's global block list, which blocks outbound connections to it even in audit mode, so that \"even if a compromised action somehow runs, the credentials cannot leave the runner\" ("
    urls: ["https://www.stepsecurity.io/blog/actions-cool-issues-helper-github-action-compromised-all-tags-point-to-imposter-commit-that-exfiltrates-ci-cd-credentials"]
