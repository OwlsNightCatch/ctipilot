    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "headline"
    kind: frontmatter
    text: "GTIG: UNC6671 \"BlackFile\" vishing → AiTM → rogue-MFA → programmatic SharePoint exfiltration (1M+ files from one victim); DLS shutdown signals possible rebrand"
  - claim_id: 27c2de7e35
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "summary"
    kind: frontmatter
    text: "GTIG analyses UNC6671 \"BlackFile\" vishing-driven AiTM extortion: real-time helpdesk impersonation → attacker-registered lookalike SSO portals → live MFA code capture and rogue MFA device registration → programmatic SharePoint exfiltration (1M+ files from one victim) via Python requests spoofing the Microsoft Office ClientAppId; DLS shutdown signals possible rebrand (Google Threat Intelligence Group, 2026-05-15)."
  - claim_id: db5529cd21
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "Google Threat Intelligence Group published on 2026-05-15 an analysis of UNC6671, a financially motivated extortion cluster that adopted the \"BlackFile\" brand by February 2026 and has targeted dozens of organizations across North America, Australia and the UK ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 848876e9df
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "Callers hired by the actor phone employees' personal mobile numbers, pose as internal IT or helpdesk staff citing a passkey migration or MFA update, and send the victim to a lookalike single sign-on portal on Tucows-registered domains, lately as organization-named subdomains with \"passkey\" or \"enrollment\" themes ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 2e0600fe79
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "The operator relays the credentials and the MFA code or push approval to the real SSO provider in real time, then immediately registers a new attacker-controlled MFA device for persistence ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: ccdec5a389
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "GTIG stresses that these compromises come from social engineering, not a vendor vulnerability ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 920c36dc22
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "After access, the actor moves into connected SaaS applications (SharePoint, OneDrive, Zendesk, Salesforce), searches for strings such as \"confidential\" and \"SSN\", and exfiltrates with Python requests and PowerShell scripts through Microsoft Graph and direct HTTP GET requests against document URLs, reusing session cookies (for example FedAuth) captured during the vishing phase ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: d90b1f6f1e
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "In one case the script downloaded more than a million files from SharePoint and OneDrive ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 0d841bdc7c
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "The direct-fetch method is often logged as `FileAccessed` rather than `FileDownloaded`, so it slips past SOCs that treat `FileAccessed` as benign ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 9b4b7c7ffe
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "In early intrusions the `FileDownloaded` records carried a spoofed Microsoft Office `ClientAppId`, which GTIG says served to bypass basic conditional access filters, while the user-agent showed `python-requests` or `WindowsPowerShell` ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: f68d53dbd0
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "In later intrusions the `FileAccessed` records named `python-requests` as the client application in `AppAccessContext` ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 7fd91119af
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "The sessions came from commercial VPN exit nodes and hosting providers ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 64c1f77fd6
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "The BlackFile leak site went offline in late April 2026, came back on 2026-05-11 with a message that BlackFile \"is shutting down… under this name\", and was inaccessible at publication ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 2016b1da1a
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "GTIG reads this as a possible transition phase rather than a permanent cessation, noting that extortion clusters commonly rebrand or disperse after shutdowns ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: d6170c741f
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "GTIG assesses UNC6671 as independent of ShinyHunters (UNC6240), although UNC6671 co-opted the ShinyHunters brand at least once ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 8eb7b89476
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "**Detection:** in identity-provider logs, look for new MFA factor registrations (Okta `system.multifactor.factor.setup`) immediately preceded by failed MFA authentications or abandoned challenges ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: d8214c38cd
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "In Microsoft 365 audit logs, weigh `FileAccessed` as heavily as `FileDownloaded` when the user-agent is a scripting library or command-line tool, and flag `FileAccessed` bursts faster than a person can browse or whose `AppAccessContext` shows a headless client ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: c36e2a1527
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "**Triage:** an Office client identity paired with a scripting-library user-agent is the mismatch GTIG found, and GTIG reads it as scripted access rather than a person using SharePoint ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 799cacf4d3
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "A session source on a commercial VPN or hosting provider that is unusual for the user adds weight ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: a165582d67
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** move users who can be reached by a fake helpdesk call from SMS and push MFA to FIDO2 security keys or passkeys, which GTIG says resist this AiTM and vishing chain ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 145fa58975
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "section 2026-09-30T06:54:43Z"
    kind: cited
    text: "GTIG describes the leak-site shutdown as a possible transition phase rather than a permanent cessation, not as a probable rebrand ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 2cd3bbda5d
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "section 2026-09-30T06:54:43Z"
    kind: cited
    text: "The detection guidance is corrected to GTIG's own: the spoofed Microsoft Office `ClientAppId` appeared on `FileDownloaded` records, later `FileAccessed` records named `python-requests` as the client, and new MFA factor registrations are suspicious when immediately preceded by failed or abandoned MFA challenges ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: 151e59fc3c
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "section 2026-09-30T06:54:43Z"
    kind: cited
    text: "The actor reused captured session cookies such as FedAuth, and GTIG does not describe theft of application access tokens ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/"]
  - claim_id: b6e520313c
    entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
    surface: "record 2026-09-30T06:54:43Z"
    kind: record-summary
    text: "GTIG's leak-site assessment is corrected from probable rebrand to a possible transition phase. The detection guidance now follows GTIG's own: the spoofed Office ClientAppId sat on FileDownloaded records, and new MFA registrations are suspicious after failed or abandoned challenges. Reuse of captured session cookies replaces an unsupported token-theft mapping, and the title and summary no longer present the one-victim figure of over a million files as a norm. An attacker-controlled domain, inline ATT&CK ids, an unsourced conditional-access recommendation, the context-only ShinyHunters link and three victim sectors GTIG does not name are removed. Priority is lowered to notable because the targeting GTIG reports is in North America, Australia and the UK, and the entry gains an ATT&CK mapping."
