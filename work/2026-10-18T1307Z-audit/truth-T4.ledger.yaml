    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-46300 (\"Fragnesia\", CVSS 7.8) is a local privilege escalation vulnerability in the Linux kernel's xfrm ESP-in-TCP path, one of three CVEs Red Hat collectively groups as \"Dirty Frag\". Kubernetes-context proof-of-concept exploits are public, and Red Hat confirms RHEL kernels are affected (Wiz Research, 2026-05-13 · Red Hat RHSB-2026-003 · Aikido Security, 2026-09-04)."
