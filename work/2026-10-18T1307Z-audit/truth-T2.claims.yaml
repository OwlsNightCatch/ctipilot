  - {claim_id: 8ab8812e76, passage: 'often targeted because MSSPs, many large corporations, and government agencies use them for VPN; no information on how many are honeypots or have already been patched', source_url: 'https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/', verdict: ok}
