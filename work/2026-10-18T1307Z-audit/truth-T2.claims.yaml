  - {claim_id: 61caf41877, passage: 'published 2026-10-06; four CVEs; SMA1000 Models 6210, 7210, 8200v', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: 544369e6aa, passage: It is the third time this year that SonicWall has fixed a 10.0-rated SSRF flaw in WorkPlace that needs no login., source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: a680671161, passage: 'Previdian founder ... told BleepingComputer on Friday ... patched on Tuesday, three days ago ... honeypot network has detected exploitation attempts consistent with CVE-2026-102255', source_url: 'https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/', verdict: ok}
  - {claim_id: f707b4d614, passage: 'crafted OPTIONS request ... CouchDB ... _rewrite ... HTTP Basic Authorization header containing the credentials admin:admin', source_url: 'https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/', verdict: ok}
