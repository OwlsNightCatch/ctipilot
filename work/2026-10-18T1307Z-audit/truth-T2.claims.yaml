claims:
  - {claim_id: 4062dd954a, passage: 'Hidden admin + four ways back in; Removing the vulnerable plugin, or even the malicious one, closes none of the last three.', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 4fa53d58b6, passage: 'We first observed the payload on October 4, 2026; exploitation volume remains limited; Which plugin provides the initial XSS barely matters; 8.6.7 / 3.15.4 fixes (BC: updating does not clean)', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 3a25b905f9, passage: 'Update Ninja Forms to 3.15.4 or later; upstream changelog identifies 8.6.7; Compare that result against what wp-admin shows; Sort by content, not by date.', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 1a738de290, passage: rotate privileged credentials and WordPress authentication salts; oldest administrator password should be treated as compromised, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 034209c1c8, passage: 'Wordfence CNA: baseScore 7.2, PR:N, lessThanOrEqual 3.15.3; Patchstack DB: patched 3.15.4. (sibling CVE-2026-92438 not mentioned)', source_url: 'https://cveawg.mitre.org/api/cve/CVE-2026-94504', verdict: ok}
  - {claim_id: e451299ac2, passage: 'Wordfence CNA: baseScore 7.2 AV:N/PR:N/UI:N, lessThanOrEqual 8.6.6; Patchstack DB: Patched version 8.6.7', source_url: 'https://cveawg.mitre.org/api/cve/CVE-2026-93836', verdict: ok}
  - {claim_id: 57436769e2, passage: 'We first observed the payload on October 4, 2026 ... CVE-2026-93836 ... The following day ... CVE-2026-94504 in Ninja Forms.', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: eee196d2a0, passage: quantity beginning with a valid numeric value ... stored in WooCommerce order metadata; legacy administrative submission editor, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 25ab91fc31, passage: The malware never steals the administrator's WordPress cookie ... HttpOnly cookies do not help here, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 4809c3a36c, passage: submits it through WordPress' own plugin installer; create a new administrator account; invoke an additional hidden persistence mechanism, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 32cbed3420, passage: 'Four Ways Back In list 1-4; hooks hide from All Users, Administrator filter, role counts; unauthenticated file manager reachable by direct request', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 0abe69ba1e, passage: 'takes the oldest modification time it finds, and stamps it onto the file it just dropped', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 487e61a16a, passage: Both vulnerabilities had been publicly disclosed on September 22; exploitation volume remains limited in our telemetry, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 302c6dc848, passage: WPC 8.6.7 or later and Ninja Forms 3.15.4 or later. Updating the vulnerable plugin prevents further exploitation but does not clean an existing infection., source_url: 'https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/', verdict: ok}
  - {claim_id: 23744f8031, passage: versions through 8.6.6 / 3.15.3; payload fires when administrator views WooCommerce order or Ninja Forms submission, source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 254875170c, passage: 'requests carrying the _wplogin query parameter; plugin-install, mu-plugins directory the Plugins screen never shows; admin account created around the time an administrator viewed orders/submissions', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 66d70b70b0, passage: 'Remove the unauthorized accounts and plugins, clear the dropped files from mu-plugins ... rotate privileged credentials and WordPress authentication salts ... never directly stolen', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 291adfd765, passage: 'It poses as WP Smart Thumbnails ... Installed and active, it does nothing; account does not appear in Users -> All Users', source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: bff6380160, passage: A site where the XSS successfully executed in an administrator's browser should be treated as potentially compromised. (date 2026-10-04 = first observed), source_url: 'https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/', verdict: ok}
  - {claim_id: 797627be2c, passage: Every confirmed victim was reached through stolen CI/CD secrets; Azazel registered a reverse shell handler as a tool inside an AI coding assistant via MCP, source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: d96e795592, passage: 'approximately 6TB of stolen data spanning logistics ... government-adjacent infrastructure; LEAKNED own leak site; SSRF-style API, Jasypt master key, JWT token in git history; MCP 127.0.0.1:35367', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: a66cdd2ca4, passage: 'exposed open directory and a misconfigured storage server; using their tooling, negotiation channels, and ransom note template ... The RaaS operator lost revenue', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: e260d40db6, passage: 'Two servers ... approximately 6TB ... spanning logistics, insurance, pharmaceutical, AI, medical devices, and government-adjacent infrastructure across six countries', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: 713b994844, passage: 'Every victim outside the AI sector engagement was reached the same way; tokens, database credentials, API keys, and SSH private keys; single GitLab instance hosted pipelines for two unrelated organisa', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: 74b38ec276, passage: 'From a single CI/CD token, Azazel reached more than 150 databases ... More than 120,000 records were exfiltrated ... killing the live PostgreSQL process and deleting the production data directory', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: cfcc47b912, passage: ran for weeks; fetches user-supplied URLs server-side; Jasypt master key bulk-decrypted; hardcoded authentication bypass token removed but in git history; Grafana admin hashes offline cracking; mirror, source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: a45c88ebbb, passage: 'checking eight surfaces: /etc/motd, SSH banner, PostgreSQL cluster_name, pgAdmin login template, GitLab README, GitLab Issue; exec_in_session MCP calls to 127.0.0.1:35367', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: eecae9bd40, passage: 'Source: ''Mask and protect every variable'' (mitigation) and ''a single compromised GitLab instance''; page never says victims'' GitLab was self-hosted or that variables were unmasked/unprotected', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: F3}
  - {claim_id: 4b37575a2f, passage: 'Alert on CI/CD variable reads from unexpected IPs, service account token use outside normal runner infrastructure, and README or Issue modifications via pipeline token; monitor MCP initialize RPCs out', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: 415889152d, passage: 'falsepositives: Legitimate MinIO backup jobs to authorised remote destinations', source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: da32c31118, passage: Store CI/CD credentials in a dedicated secrets manager ... Mask and protect every variable ... audit git history; Never bind an MCP server beyond strict loopback, source_url: 'https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files', verdict: ok}
  - {claim_id: 90830f431f, passage: payload to execute the moment the project was loaded into the IDE; etwEnable enabled=false; GitHub API for C2, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 0266d6580b, passage: targeted Iraqi critical infrastructure in March 2026; Dubai Airports IT; PsProxy.dll ... execute without spawning PowerShell.exe; AppDomainManager hijack; DLL sideloading, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 0eff3aec69, passage: infrastructure staging ... as early as November 2025; same actor ... Google Drive lures for credential harvesting against an Israeli entity in May-June 2026, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: f86899ad00, passage: Dubai Airport Careers Inno Setup installer decoy; weaponized Microsoft Visual Studio project archive disguised as a coding assessment; at-home assessment, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 05f7993b09, passage: Visual Studio performs a design-time build ... GetFrameworkPaths ... custom XML target ... copied ... to %LOCALAPPDATA%\Microsoft\RuntimeBrokers and launched RuntimeBroker.exe, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: bd52a09edf, passage: vshost.exe renamed RuntimeBroker.exe; .config replaces default startup manager; etwEnable enabled=false; ... could impair detection capabilities; DLL sideloading RuntimeBroker.dll, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: fc3154a054, passage: 'MicrosoftRuntime value under the current user startup registry key; hard-coded GitHub PAT; Issues Search API fallback; PsProxy.dll hooked into System.Management.Automation.dll; Blackwood loads Chisel,', source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 6d2c1499e0, passage: GitHub has taken down the malicious infrastructure; Unit 42 is not aware of any breach ... within Dubai Airports, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 3b96fcf144, passage: 'Visual Studio design-time build trigger; targets in Iraq, Israel and UAE (no Swiss/European target reported)', source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 57e2685c8e, passage: monitoring binaries that load unknown or non-standard DLLs outside of system directories; etwEnable directive in .config; PsProxy hooking PowerShell engine, source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 598e672817, passage: 'This operation underscores the need for organizations to secure developer environments, monitor anomalous cloud platform traffic', source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 962f0d2d29, passage: 'MSBuild launched a legitimate, signed Microsoft Visual Studio hosting process (vshost.exe). This file was then renamed to RuntimeBroker.exe.', source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: 9af18ec80a, passage: 'payload executes the moment the project was loaded into the IDE, even before the developer attempted to compile; renamed RuntimeBroker.exe config', source_url: 'https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/', verdict: ok}
  - {claim_id: b74cb735dd, passage: 'Update 12.10.26: Current exploitation status: Actively exploited; SonicWall advisory: no evidence ... being exploited in the wild (still, per PSIRT API 2026-10-18)', source_url: 'https://security-hub.ncsc.admin.ch/#/posts/13034', verdict: ok}
  - {claim_id: 3ef3e747c1, passage: 'CVSS 10.0 CVSS:3.0; affected 12.4.3-03526 / 12.5.0-02952 and older; fixed 12.4.3-03670 / 12.5.0-03082 and higher; NCSC 2026-10-12 actively exploited; Defused 10-08, Previdian 10-09', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: bffd45574a, passage: 'The hotfix is available from the MySonicWall portal, and the appliance restarts when the installation finishes. No workaround is listed.', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: 34f17819f8, passage: 'check their appliances for indicators of compromise and, if any were found, re-image or redeploy; Previdian: OPTIONS requests; advisory published 2026-10-06', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: 1828cf0e1b, passage: 'CVSS 10.0 vector CVSS:3.0/AV:N/AC:L/PR:N/UI:N; affected 12.4.3-03526 (platform-hotfix) and older, 12.5.0-02952 and older; fixed 12.4.3-03670 and higher, 12.5.0-03082 and higher', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: 861cffd5da, passage: 'CVE-2026-102256 CVSS 7.8 CVSS:3.0/AV:L/AC:L/PR:L; OS command injection authenticated as administrator', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: ce308d7490, passage: 'CVE-2026-102257 CVSS 7.2 CVSS:3.0/AV:N/AC:L/PR:H; Zip Slip in AMC resulting in RCE', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: 50a60a2fa8, passage: 'CVE-2026-102258 CVSS 5.5 CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:L/A:N; stored XSS in AMC', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: 6c550100da, passage: Pre-authentication SSRF ... SMA1000 Appliance Work Place interface due to an unintended alternate access path ... direct the appliance to issue requests on their behalf, source_url: 'https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017', verdict: ok}
  - {claim_id: df542a5634, passage: CVE-2026-102256 7.8 OS command injection admin; CVE-2026-102257 7.2 Zip Slip AMC RCE; CVE-2026-102258 5.5 stored XSS AMC, source_url: 'https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017', verdict: ok}
  - {claim_id: 257e752e74, passage: There is currently no evidence any of the vulnerabilities addressed in this release are being exploited in the wild., source_url: 'https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017', verdict: ok}
  - {claim_id: 103c2c99c8, passage: third time this year ... 10.0-rated SSRF flaw in WorkPlace that needs no login; 'multiple cases' in July and 'a case' in September, source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: ec00308474, passage: des combinaisons de deux vulnérabilités ... ont déjà été activement exploitées à plusieurs reprises cette année sur ce produit, source_url: 'https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1275/', verdict: ok}
  - {claim_id: 167c6d6e7d, passage: 'affected versions include 12.4.3-03526 and 12.5.0-02952, which SonicWall named on September 1 as the fix for two flaws it reported as exploited', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: dc60c40dc7, passage: '12.4.3-03670 and higher versions are fixed; CERT-FR: antérieures à 12.4.3-03670 / 12.5.0-03082', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: f1644f1c98, passage: Version 12.4.3-03670 (platform-hotfix) and prior; Version 12.5.0-03082 (platform-hotfix) and prior, source_url: 'https://cyber.gc.ca/en/alerts-advisories/sonicwall-security-advisory-av26-1017', verdict: ok}
  - {claim_id: 457d0af338, passage: 'Shadowserver currently tracks over 400 Internet-exposed SMA1000 appliances, although some may have already been patched; used by government agencies, MSSPs', source_url: 'https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/', verdict: ok}
  - {claim_id: 1209a484c1, passage: 'created 2026-10-07; history Edited 2026-10-12 ''updated with Active exploitation claims''; status UNKNOWN -> Actively exploited; Defused oct. 8th, Previdian oct. 9th', source_url: 'https://security-hub.ncsc.admin.ch/#/posts/13034', verdict: ok}
  - {claim_id: 8e422a790a, passage: 'Models 6210, 7210, 8200v; Note: do not affect SSL-VPN on SonicWall firewalls or the SMA 100 Series (THN ''SMA 100 Series are not affected'')', source_url: 'https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0017', verdict: ok}
  - {claim_id: 20fbc39b35, passage: CVE-2026-102255 - Pre-authentication SSRF via unintended forward-proxy (heading); CWE-441 Unintended Proxy or Intermediary, source_url: 'https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017', verdict: ok}
  - {claim_id: 9ee34335a1, passage: 'In its July and September advisories, SonicWall told customers to check ... re-image or redeploy ... reset the TOTP tokens. It has given no such instruction for the four new flaws.', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
  - {claim_id: 0f871e6406, passage: 'crafted OPTIONS request to reach internal CouchDB at 127.0.0.1:5984 ... traverse into a design document and invoke its _rewrite function ... Basic Authorization header', source_url: 'https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/', verdict: ok}
  - {claim_id: 14f747936f, passage: 'The hotfix ... appliance restarts when the installation finishes. No workaround is listed. (API: is_workaround_available false)', source_url: 'https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html', verdict: ok}
