    summary: |
      Facts (IMY, 2026-10-01; decision of 2026-09-22): in August 2025 the IT service provider Miljödata was attacked; a threat actor reached a large volume of personal data and published data on the darknet; the company says 2.2 million people were affected (personal identity numbers, contact details, and sensitive data on sick leave, rehabilitation and school incidents). Customers affected include a majority of Sweden's municipalities, several regions and government agencies. IMY found the company did not maintain a sufficiently high technical and organisational security level for the data it processed: it failed to conduct adequate checks when installing new software and had no automated real-time monitoring to detect intrusions or suspicious activity. It judged the company negligent and fined it SEK 1.8 million (about EUR 160,000) under Article 32(1) GDPR. IMY has also opened reviews of two municipalities and one region in connection with the attack; these continue.
      Why it matters for the constituency: a regulator holding a public-sector software supplier to account on concrete controls (change-and-install checks, real-time intrusion detection) and extending scrutiny to the public customers, the Swiss analogue being PK Softech/Publica-type supplier incidents and the FDPIC. The decision names no attack vector or actor.
