    update_target_note: "The Metabase entry (last updated 2026-09-29) has no Japanese or JPCERT/CC content; its victim tally stops at fifteen downstream incidents. Fold in JPCERT/CC's case C and the Swiss victim, or publish the wave as its own trend entry and reference the Metabase entry."
