  - title: "Japan: a September-October 2026 wave of mass personal-data thefts at 18 to 20 organisations — JPCERT/CC separates four cases (known-vulnerability scanning and misconfiguration, internal-API abuse, Metabase CVE-2026-72898, WAR/JSP web shells) and the government calls it a cyberspace emergency"
    sources:
      - { url: "https://www.jpcert.or.jp/at/2026/at260030.html", publisher: "JPCERT/CC (JPCERT-AT-2026-0030)", date: "2026-10-09", role: "primary" }
      - { url: "https://www.heise.de/news/Japan-reagiert-auf-Welle-von-Cyberangriffen-11483276.html", publisher: "heise online", date: "2026-10-10", role: "corroborating" }
      - { url: "https://piyolog.hatenadiary.jp/entry/2026/10/11/004353", publisher: "Piyolog (summarising JPCERT/CC, PPC, NCO, IPA and FSA notices)", date: "2026-10-11", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → heise topic page https://www.heise.de/thema/Cyberangriff (listing, 2026-10-10 'Japan reagiert auf Welle von Cyberangriffen') → pivot: heise article https://www.heise.de/news/Japan-reagiert-auf-Welle-von-Cyberangriffen-11483276.html → primary: JPCERT/CC alert, URL https://www.jpcert.or.jp/at/2026/at260030.html (named in the heise article) → piyolog URL https://piyolog.hatenadiary.jp/entry/2026/10/11/004353 for the IPA/PPC/NCO/FSA statements."
    summary: |
      Facts: JPCERT/CC's alert JPCERT-AT-2026-0030 (published 2026-10-08, updated 10-09) states that around September 2026 Japanese organisations have been suffering a run of unauthorised accesses with personal-data leaks, that information is limited and fragmentary, and that it covers a category of attack that may be increasing and is separate from ordinary ransomware. It lists four cases from reports it received, stressing they are not proof of one method: A, scanning each target for known vulnerabilities and attempting exploitation, or abusing management lapses such as theft of environment-configuration and backup files; B, abuse of application APIs: reverse-engineering public smartphone apps to find endpoints and keys, attacks on internal APIs that no screen can reach (changing user privileges, creating accounts, toggling headers and malformed auth tokens to observe responses, blind NoSQL injection to find account data), and reuse of API keys stolen from other compromised systems; C, the Metabase SQL injection CVE-2026-72898 (JPCERT/CC's own alert on it dates from 2026-08-14); D, added 10-09, WAR files placed on an application server reachable from the public web server, whose JSP acts as a simple web shell running shell commands taken from a query parameter. It also says BI tools and staff management systems not meant for anonymous users were hit. IPA states the cases are not attributed to one product's flaw and that published cases point to compromised externally exposed applications or accounts.
      Scale and reaction (heise, citing NHK and the Financial Times): at least 18 comparable cases in NHK's overview of 2026-10-07 and at least 20 companies per the FT; Yakiniku King with 10.8 million customer records; the Japan Atomic Energy Agency confirmed ID documents and medical-check results of 175 people leaked from a contractor's cloud platform; digital minister Masaaki Taira called a crisis meeting and spoke of an emergency in cyberspace; the financial regulator told banks to stop accepting driving licences as ID for new accounts and to prefer NFC-chip documents.
      Not known: the actor, how many cases belong to which of the four patterns, and whether the NHK headlines that evidence of AI-agent use was found (2026-10-13 and 10-15) are right; the NHK pages returned only teasers here, so that claim is unverified.
      Swiss nexus: the Metabase exploitation (case C) is the same flaw behind the Swiss online magazine Republik's compromise reported 2026-10-16 (separate item), and the API-centric pattern is a class every canton and commune running mobile or citizen-portal back ends can check for.
    region_nexus: "japan; Swiss relevance through the Metabase exposure (Republik) and the API/BI-tool exposure class"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-72898]
    techniques: [T1190, T1505.003, T1078, T1595.002]
    technique_notes: "T1190 (cases B and C: API/NoSQL injection and the Metabase SQL injection), T1505.003 (case D WAR/JSP web shell), T1078 (case B reuse of stolen API keys), T1595.002 (case A per-target vulnerability scanning). JPCERT/CC's source-address and user-agent lists are IOCs and are deliberately not carried."
