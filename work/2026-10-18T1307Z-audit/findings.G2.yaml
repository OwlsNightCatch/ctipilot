  # ---------------------------------------------------------------- 1
  - title: "Safepay ransomware at DD-Automation (Aesch BL), sub-supplier of Gilgen Logistics, which runs the conveyor technology of the Swiss Armed Forces' narrow-aisle warehouses: leaked data includes an 'Armasuisse' folder with sub-folders for army logistics centres; the Armed Forces say no critical data is involved"
    sources:
      - { url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016", publisher: "Inside IT", date: "2026-10-16", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 2026-10-16 13:28 'Ransomware-Angriff trifft Sublieferanten der Armee') → primary (no pivot needed): https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016 (extract returns only the lead; the full text was read from the raw HTML rawState blocks via `url`). Second-source attempts: WebSearch (\"DD-Automation Aesch Safepay Armasuisse Armee Gilgen Logistics Cyberangriff\", standard and extended) found only a SOCRadar tracker listing (aggregator, seen in the results, not fetched) and no other outlet or victim statement."
    summary: |
      Facts as reported by Inside IT (2026-10-16): the ransomware group Safepay claimed an attack on DD-Automation (Aesch, Basel-Landschaft), a maker of controls used mainly in logistics, in early October, and a few days later put a data package on the darknet that Inside IT inspected. The directory holds folders attributable to customers, including one titled "Armasuisse" with sub-folders for Swiss Army logistics centres. The Armed Forces' media office confirmed to Inside IT that DD-Automation is a sub-supplier of Gilgen Logistics, an army contractor that operates the conveyor technology of the narrow-aisle warehouses of the Armed Forces Logistics Base, and that Gilgen informed the army of the security incident. The army states there are no interfaces to DD-Automation such as remote accesses, that DD-Automation does hold address data and contacts at the Logistics Base, that the persons concerned were contacted and told not to open suspicious mails, attachments or links and to treat changed payment or invoice details with particular caution, and that the stolen data has no effect on the security of the logistics sites. DD-Automation declined to comment.
      Claims versus facts: the ransomware, the Safepay attribution and the publication are the criminals' claim as observed by Inside IT; the Armed Forces' statement is first-hand but covers only their exposure. The access vector, the encrypted or exfiltrated volume and the data classes beyond "customer folders" are not public. Inside IT also reports two further recent Swiss Safepay victims (Bio-Strath, Zurich, systems restored from backups, FDPIC notified; a hotel in Lugano, attack confirmed).
      Why it matters for the constituency: a federal armed-forces supplier chain (army, Armasuisse, contractor, sub-supplier) exposed through the smallest link, with the army's own warning pointing at the realistic follow-on risk, business-email-compromise style invoice fraud and phishing built on real contact data. No remote-access path from the sub-supplier into army systems is stated.
    region_nexus: "switzerland; Swiss Armed Forces Logistics Base and Armasuisse folders in the leaked data"
    primary_sector_nexus: "direct (Armed Forces / federal procurement supplier chain)"
    sector: "public-sector"
    cves: []
    techniques: [T1486]
    technique_notes: "T1486 follows the outlet's 'Ransomware-Angriff'; the exfiltration method and access vector are not stated, so no further id is evidence-bound. The army's invoice-change warning is a follow-on-fraud caution, not an observed technique."
    affected_products: []
    entity_keys: ["actor:safepay"]
    new_entities:
      - { key: "incident:dd-automation-safepay-2026-10", type: incident, name: "DD-Automation (Aesch BL) Safepay ransomware and Armasuisse data folder",
          aliases: [], summary: "Safepay claimed a ransomware attack on the Basel-Landschaft controls maker DD-Automation in early October 2026 and published data including an 'Armasuisse' folder; the Swiss Armed Forces confirmed via contractor Gilgen Logistics that they were informed (Inside IT, 2026-10-16)." }
    relation_suggestions:
      - { subject: "incident:dd-automation-safepay-2026-10", object: "actor:safepay", basis: "Inside IT: Safepay claimed the attack on DD-Automation and published a data package (a leak-site claim relayed by the outlet, not a victim confirmation)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    admiralty_hint: "C2 (single outlet; the Armed Forces' statement is quoted verbatim, which lifts credibility of the supplier-chain facts but not of the actor claim)"
    novelty: new
    evidence:
      - { quote: "Die Firma DD-Automation ist ein Sublieferant der Gilgen Logistics, welche ein Vertragsnehmer der Armee ist. Die Armee wurde von Gilgen Logistics über den Sicherheitsvorfall informiert.", attribution: "Inside IT (Armed Forces media office, quoted)", source_url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016" }
      - { quote: 'Darunter auch ein Ordner, der mit "Armasuisse" betitelt ist, und Unterordner zu Logistikzentren der Schweizer Armee enthält.', attribution: "Inside IT", source_url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016" }
      - { quote: "Die Firma DD-Automation hat jedoch Adressdaten und Kontakte in der Logistikbasis der Armee.", attribution: "Inside IT (Armed Forces media office, quoted)", source_url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016" }
      - { quote: "Die Medienstelle betont, es würden keine Schnittstellen zum betroffenen Sublieferanten DD-Automation bestehen, wie zum Beispiel Fernzugänge.", attribution: "Inside IT", source_url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016" }
    extended_notes: |
      Exposure: army and Armasuisse staff and contractors who deal with the Logistics Base and DD-Automation hold addresses the group now has; the army contacted the people concerned. Detection concept for the audience: watch inbound mail and invoicing flows for look-alike senders referencing Logistics Base contacts and for changed bank details, which is the follow-on the army itself names. The body of the article is paywalled; the full text is only in the page's raw HTML (rawState), saved at work/2026-10-18T1307Z-audit/G2-bodies/inside-it-ransomware-angriff-trifft-sublieferanten-der-armee.rawstate.txt. A verifier using `extract` or WebFetch will see only the lead.
    defender_takeaway: "Federal and cantonal buyers should map who sits behind their direct contractors (here army, contractor, sub-supplier) and which contact data each holds; the realistic follow-on is invoice-change fraud and phishing using genuine contacts."
    borderline: false
  # ---------------------------------------------------------------- 2
  - title: "Arcadia (Japan), operator of the municipal alert platform SpeeCAN RAIDEN, the NET119 emergency-call system for deaf and hard-of-hearing users and 119RAIDEN fire-service notifications, is breached: up to 3.1 million email addresses, 111 reporting public bodies, spoofed phishing within two days, and fire-corps dispatch mails not delivered"
    sources:
      - { url: "https://raiden.site.ktaiwork.jp/archives/4597", publisher: "Arcadia Co., Ltd. (SpeeCAN RAIDEN official blog)", date: "2026-10-16", role: "primary" }
      - { url: "https://www.city.shizuoka.lg.jp/s4268/s000286.html", publisher: "City of Shizuoka", date: "2026-10-14", role: "primary" }
      - { url: "https://www.pref.shimane.lg.jp/police/emergency/mikopiteishi.html", publisher: "Shimane Prefectural Police", date: "2026-10-13", role: "primary" }
      - { url: "https://www.sagatv.co.jp/news/archives/2026101424687", publisher: "Saga TV", date: "2026-10-14", role: "corroborating" }
      - { url: "https://piyolog.hatenadiary.jp/entry/2026/10/14/014350", publisher: "Piyolog", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (homepage entry list; entry 2026-10-14 '防災情報配信サービス「SpeeCAN RAIDEN」への不正アクセスについてまとめてみた') → primary: Arcadia official blog, URL https://raiden.site.ktaiwork.jp/archives/4597 → municipal/police statements from piyolog's source list: Shizuoka URL https://www.city.shizuoka.lg.jp/s4268/s000286.html, Shimane Police URL https://www.pref.shimane.lg.jp/police/emergency/mikopiteishi.html → press: Saga TV URL https://www.sagatv.co.jp/news/archives/2026101424687 (NHK and Nikkei coverage listed by piyolog; NHK page returned only a teaser)."
    summary: |
      Facts (Arcadia's blog, updated through 2026-10-16, translated from Japanese): at 16:30 JST on 2026-10-11 Arcadia saw suspicious behaviour on SpeeCAN RAIDEN, applied an emergency measure to block the intrusion path around 03:00 on 10-12, and on 10-13 at 11:00 stopped the two services that were the intrusion path (RAIDEN customers on raiden3.ktaiwork.jp and the school service on s2). Data that may have left: contact names, email, phone and FAX numbers, staff and contract information, and message bodies kept in the delivery history. Arcadia's estimated maximum is about 3,136,000 email addresses, 105,000 phone numbers and 15,000 FAX numbers. On 10-14 it extended the finding to NET119 (names, birth dates, sex, addresses, phone, email, FAX and data entered at other-service registration; later given as 9,020 email-linked records) and 119RAIDEN (about 97,000 emails, 17,000 phone numbers); video reporting is unaffected. Arcadia states the intrusion path is closed, no rogue programs remain, and vulnerabilities are being fixed; it does not publish the vector. All services were restored on 10-15 and customers are told to change passwords.
      Impact on public bodies: piyolog, citing Nikkei and the Ministry of Internal Affairs, counts 111 reporting organisations at 17:00 on 10-14; Saga TV puts about 800 municipalities on the service. Shimane Prefectural Police suspended its safety-mail service. Saga TV reports Saga City's disaster mail was stopped and fire-corps call-out requests no longer arrived. The City of Shizuoka says data of 34,336 citizens (email addresses) and 6,915 staff (name, staff number, department) leaked, that suspicious mails impersonating a credit-card company already circulate, and that they abuse the legitimate sender-address pattern of the city's disaster-mail service (@raiden.ktaiwork.jp); the city classes them as spoofed.
      Not known: access vector, actor, whether the phishing was sent through the platform or from the stolen lists (Shizuoka says only 'may be related'). Press reports relayed by piyolog (FNN) say more than 20 Shizuoka city staff received such mails from 2026-10-13, two days after Arcadia's detection.
    region_nexus: "japan; transferable to Swiss cantonal and communal alerting, dispatch and emergency-call notification services run by shared suppliers"
    primary_sector_nexus: "indirect (analogue: emergency services and civil-protection alerting supplier)"
    sector: "public-sector"
    cves: []
    techniques: [T1566]
    technique_notes: "T1566 is the downstream phishing the City of Shizuoka documents. Initial access is not stated by Arcadia (JPCERT/CC and IPA separately say Japanese cases mostly start from internet-facing applications or compromised accounts, without tying that to Arcadia); do not map T1190 for this incident."
    affected_products: ["SpeeCAN RAIDEN", "NET119", "119RAIDEN"]
    entity_keys: []
    new_entities:
      - { key: "incident:arcadia-speecan-raiden-breach-2026-10", type: incident, name: "Arcadia SpeeCAN RAIDEN / NET119 / 119RAIDEN breach (October 2026)", aliases: ["SpeeCAN RAIDEN breach"],
          summary: "Unauthorised access from 2026-10-11 to the Japanese municipal disaster-alert, emergency-call and fire-notification platforms of Arcadia Co., Ltd.; up to about 3.1 million email addresses, 111 reporting public bodies (Arcadia blog, City of Shizuoka, piyolog)." }
    relation_suggestions:
      - { subject: "incident:arcadia-speecan-raiden-breach-2026-10", object: "incident:japan-personal-data-theft-wave-2026-09", basis: "Neither Arcadia nor JPCERT/CC ties the two; JPCERT/CC's alert covers incidents 'around September 2026' in Japanese organisations without naming Arcadia. Suggest related-to only if a source states it." }
    verification: MULTI-SOURCE
    confidence: HIGH
    admiralty_hint: "A1 for the facts (vendor blog corroborated by independent municipal and police statements); attacker, vector and phishing linkage are unknown"
    novelty: new
    evidence:
      - { quote: "メールアドレス：約3136000件", attribution: "Arcadia Co., Ltd.", source_url: "https://raiden.site.ktaiwork.jp/archives/4597" }
      - { quote: "現時点で不正アクセスの侵入経路を遮断しており、システム内に不正なプログラムがないことも確認しております。", attribution: "Arcadia Co., Ltd.", source_url: "https://raiden.site.ktaiwork.jp/archives/4597" }
      - { quote: "「@raiden.ktaiwork.jp」は、静岡市防災メールで使用している正しい送信元アドレスの一部です。しかし、今回確認されたメールは、これを悪用したなりすましメールであり、クレジットカード会社から送信されたものではありません。", attribution: "City of Shizuoka", source_url: "https://www.city.shizuoka.lg.jp/s4268/s000286.html" }
      - { quote: "島根県警察が利用している情報配信システムの運用事業者が、第三者から不正アクセスを受け、個人情報が漏洩した可能性が確認されたことから、みこぴー安全メールの配信等を停止しています。", attribution: "Shimane Prefectural Police", source_url: "https://www.pref.shimane.lg.jp/police/emergency/mikopiteishi.html" }
      - { quote: "この影響で各消防団への出動依頼メールが届かなくなっているということです。", attribution: "Saga TV", source_url: "https://www.sagatv.co.jp/news/archives/2026101424687" }
      - { quote: "総務省のまとめで計111団体から報告が届く", attribution: "Piyolog (citing Nikkei and the Ministry of Internal Affairs)", source_url: "https://piyolog.hatenadiary.jp/entry/2026/10/14/014350" }
    extended_notes: |
      Exposure lesson for Swiss cantonal and communal bodies and blue-light organisations: list which alert, dispatch, call-out and emergency-notification SaaS suppliers hold contact lists and message history, and whether one supplier tenant spans many authorities (here roughly 800 municipalities); confirm the supplier's out-of-band fallback for call-outs (Saga TV reports Takeo City falling back on individual receivers in 14,000 households while mail was down) and that sender-domain authentication (SPF, DKIM, DMARC with reject) covers the platform's sending domain, because a leaked list plus a legitimate-looking sender domain gave attackers a credible lure within two days. Triage lookalike: ordinary credit-card notification mail that merely says 'please confirm card usage' versus mail whose From address carries the authority's own alert-platform domain pattern; the discriminator is the destination URL and that the platform never sends card queries. Detection (post-compromise check for customers): review the supplier's tenant for changed contacts or unexpected outbound sends, reset administrator passwords as Arcadia instructs.
    defender_takeaway: "Treat a municipal or emergency alerting supplier as part of the operational chain: inventory it, demand an out-of-band call-out fallback, and pre-brief staff that a leaked alert list will be followed by phishing in the platform's own sender style."
    borderline: false
