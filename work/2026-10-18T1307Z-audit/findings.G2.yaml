  - title: "Swiss private-sector incidents of the window: Ricardo (890,000 accounts, detected 7 October), Offerz (115,000 customers via a test environment holding a leftover copy of real order data), Bio-Strath (Safepay claim, systems restored), and STMicroelectronics (The Gentlemen claim, company 'investigating a suspected incident')"
    sources:
      - { url: "https://www.inside-it.ch/cybervorfall-bei-online-auktionshaus-ricardo-20261009", publisher: "Inside IT", date: "2026-10-09", role: "primary" }
      - { url: "https://www.inside-it.ch/cyberangriff-auf-115000-kundendaten-von-offerz-20261015", publisher: "Inside IT", date: "2026-10-15", role: "primary" }
      - { url: "https://www.inside-it.ch/bio-strath-erleidet-ransomware-angriff-20260930", publisher: "Inside IT", date: "2026-09-30", role: "primary" }
      - { url: "https://www.inside-it.ch/ransomware-bande-attackiert-schweizer-kmu-und-chip-hersteller-20261001", publisher: "Inside IT", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/sitemaps/sitemap-72.xml (dated-slug sweep of 2026-09-30 to 2026-10-16) → fetched each article from its raw HTML (rawState blocks): the four URLs above."
    summary: |
      Facts (Inside IT, each relaying the company's own statement): Swiss Marketplace Group says it detected unauthorised access to personal data on its Ricardo platform on 2026-10-07, closed the vulnerability, and found names, postal addresses, phone numbers (and company names for commercial users) of about 890,000 user accounts exposed, with no emails or passwords; it notified the FDPIC and will file a complaint and notify BACS. Offerz (Blumenstein BT) reports that unknown persons entered a test environment overnight on 2026-10-07 (discovered 10-09) in which a copy of January 2026 order data of about 115,000 customers (names, addresses, emails, phone numbers, IP addresses, payment-method details; no passwords or payment data) had been left in a cloud store after technical work, an error; an external IT provider ran the servers; Offerz cannot prove exfiltration and assumes it, reset passwords, filed a complaint and informed the FDPIC and BACS. Bio-Strath (Zurich) confirms an attack, restored systems from backups and notified the FDPIC; Safepay lists it, which cannot be independently confirmed. STMicroelectronics (Geneva) told Inside IT it is investigating a suspected cyber incident after The Gentlemen listed it on 2026-09-21.
      Not public: vectors and actors (beyond the leak-site claims), except Offerz's own cause.
      Pattern worth carrying: Offerz's leftover real data in a test environment run by an external provider mirrors the PKZH case, where an insured persons' data set was handed to PK Softech as test data for a planned migration (already in the store).
