    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 2026-10-16 09:33 'Republik gesteht Datenleck') → fetch https://www.inside-it.ch/republik-gesteht-datenleck-20261016 (full text from raw HTML) → corroboration: WebSearch (\"Republik Datenleck Metabase Sicherheitslücke Nutzerdaten Zugriff seit August 14. Oktober\") → swissinfo URL https://www.swissinfo.ch/eng/various/hackers-steal-user-data-from-the-online-magazine-republik/92225537. Republik's own statement page was not found by two further WebSearch attempts; both outlets relay it."
    summary: |
      Facts, as relayed from Republik's own statement: on Wednesday 2026-10-14 one of the analysis tools stopped working, which ended an unauthorised access that had run since August; the vulnerability had been known since 6 August, "but we failed to take the necessary countermeasures in time". The attackers exploited a vulnerability in Metabase, the analytics tool. Republik does not know who is behind it; much points to a broad automated wave in which attackers first searched for what every Metabase installation holds, such as credentials and keys for AI services that can be resold, and nothing indicates Republik was targeted. The data was taken: records of all users (active members, subscribers, newsletter recipients and former users) with email address, name and, where stored, phone number, birth year and gender; no credit-card data. Metabase was switched off on 10-14, which cut the attackers' access, and Republik notified the FDPIC on 10-15.
      Inference (the auditor's, not Republik's): the 6 August date matches the disclosure date of the Metabase zero-day CVE-2026-72898 already in the store; Republik does not name the CVE. If that holds, the Swiss case ran about ten weeks with the fix available.
      Relevance: not public sector, but a Swiss organisation on the same mass-exploitation wave as the ANSSI REACTIV report on French state services and JPCERT/CC's case C in Japan, and the only Swiss victim of it found in this window; the lesson is self-hosted BI tools outliving their patch window.
