    summary: |
      Facts (Federal Council release of 2026-09-18): the Federal Council noted the consultation results and adopted the security policy strategy 2026 on 18 September; its three axes are strengthening resilience, improving protection and increasing defence capability, expressed in ten objectives and 46 measures whose implementation has already begun; priority goes to countering hybrid threats and remote attacks and to fighting organised crime; implementation is coordinated in the DDPS by the State Secretariat for Security Policy with a steering committee including federal offices and cantonal conferences; a progress report goes to the Federal Council by the end of 2028.
      Claims relayed by dcod (a French-language aggregator, 2026-10-07) that the release does not carry in the text read: measure 10 mandates reinforcement of Swiss cybersecurity including a 24-hour notification duty for major attacks on critical operators, and that a coordinated series of intrusions or sabotage could be classed by the Federal Council as an armed attack. A reporting duty for cyberattacks on critical infrastructure already exists (introduced in April 2025, per Inside IT's 2026-10-12 report on BACS figures), so mandatory notification as such is not new; whether the strategy changes its deadline or scope is not stated in the release.
      Timing: the primary predates the window (2026-09-18); only dcod's re-analysis is in it. The strategy sets direction, not a new defender obligation.
