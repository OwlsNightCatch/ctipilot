    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/sitemaps/sitemap-72.xml (dated-slug sweep of the window; item 2026-10-12 'Tausende Schweizer Fortigate-Firewalls online erreichbar') → fetch https://www.inside-it.ch/tausende-schweizer-fortigate-firewalls-online-erreichbar-20261012 (full text from raw HTML) → WebSearch (\"Risikomonitor Fortigate 4313 Schweiz Verwaltungsoberflächen VPN Internet erreichbar Analyse Löw-Beer\") → Netzwoche URL https://www.netzwoche.ch/news/2026-10-12/ueber-4300-fortigate-firewalls-in-der-schweiz-stehen-offen-im-internet. The Risikomonitor report itself was not retrieved; both outlets relay it."
    summary: |
      Facts as relayed from the Austrian firm Risikomonitor's passive IP analysis: 4,313 FortiGate firewalls in Switzerland expose a management or VPN interface to the internet, 82,236 across 42 European countries; Switzerland ranks seventh (Italy 13,283, France 11,554, Spain 7,929). Of the 4,313, Risikomonitor examined 1,455 more closely: about 60 % are small models (30 to 90 series) of the kind used in practices, law offices, trades and branches, 44 are end-of-support hardware, and the most reachable provider network is Swisscom (689), then Sunrise (92) and WWZ (39). The firm says the analysis cannot tell which FortiOS versions run, whether a device is vulnerable, or whether any is compromised; it recommends removing administrative access from the internet, restricting remote access with strong two-factor authentication, updating firmware and replacing unsupported devices. The articles tie this to FortiBleed (FBI and Secret Service warning of 2026-10-06, more than 86,600 devices in 194 countries, credential theft and reuse), which the store already covers.
      Delta over the store: the Swiss exposure count and the end-of-support share; the exposure figure is a vendor count, not a compromise count, and carries no KEV or exploitation link of its own.
