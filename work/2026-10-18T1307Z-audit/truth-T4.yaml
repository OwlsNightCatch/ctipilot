- entry: 2026-05-08/qilin-ransomware-hits-die-linke-germany-1-5-tb-claimed-dpa-n
  verdict: imprecision
  defects:
  - where: headline; summary
    claim: Die Linke took its infrastructure offline after a suspected Qilin attack; Qilin listed the party on its leak site without samples
    defect: Headline and summary say the party took its infrastructure offline; the party's own statement says only parts of the IT infrastructure were taken offline, as the entry's own body states.
    ground_truth: 'Die Linke statement 2026-03-27: "Teile der IT-Infrastruktur wurden vorsorglich vom Netz genommen, um weiteren Schaden zu verhindern." (parts of the IT infrastructure were taken off the network as a precaution). Heise paraphrases it as the party''s infrastructure.'
    ground_truth_url: https://www.die-linke.de/start/presse/detail/news/cyberangriff-auf-die-partei-die-linke/
    fix: 'Headline and summary: "took parts of its IT infrastructure offline" (summary: "had taken parts of its IT infrastructure offline").'
    class: imprecision
  notes: 'Prior-audit remediation held: the Contradiction line on the BleepingComputer headline is present and correct (headline ''confirms data stolen'' vs text ''stopped short of confirming a data breach''). The 1.5 TB and data-protection-authority claims appear in none of the four sources.'
- entry: 2026-05-08/eurail-breach-308-777-travellers-notified-three-months-after
  verdict: imprecision
  defects:
  - where: frontmatter techniques[]
    claim: 'techniques: [T1005]'
    defect: (low confidence) T1005 (Data from Local System, a collection technique) names a behavior no source describes; the sources say only that an unauthorized actor transferred files from Eurail's network, with no collection or exfiltration method.
    ground_truth: 'BleepingComputer 2026-04-09 quoting Eurail''s letters: "The evidence showed that an unauthorized actor transferred files from our network on December 26, 2025". No source describes how the files were gathered or moved out.'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/eurail-says-december-data-breach-impacts-300-000-individuals/
    fix: Drop T1005 or map only what a source states (files transferred out of the network); the entry already says no access vector or actor is known.
    class: imprecision
  notes: 'Out of scope but stale: entities/registry.yaml incident:eurail-breach-2026 summary still says ''308,777 travellers notified in April 2026; the Dutch DPA and EDPS are reviewing the delayed notification'', which the 2026-09-30 correction retracted (letters 2026-03-27; no source for a DPA/EDPS review).'
