- entry: 2026-05-10/sophos-beagle-backdoor-distributed-via-fake-claude-ai-site-u
  verdict: imprecision
  defects:
  - where: frontmatter tags
    claim: 'tags: phishing, infostealer'
    defect: 'The `infostealer` tag contradicts the body: Sophos describes Beagle as a simple backdoor with a remote-shell and file-management command set and no credential or data collection.'
    ground_truth: 'Sophos: "Donut loads the final payload, which we assess to be a relatively simple backdoor with the following commands: uninstall, cmd, upload, download, mkdir, rename, ls, rm".'
    ground_truth_url: https://www.sophos.com/en-us/blog/donuts-and-beagles-fake-claude-site-spreads-backdoor
    fix: Remove `infostealer` (keep a backdoor/loader tag if the taxonomy has one).
    class: imprecision
  - where: frontmatter sectors
    claim: 'sectors: technology'
    defect: (low confidence) No source names a targeted sector; the entry's own 2026-09-30 correction records that Sophos does not say who the lures target.
    ground_truth: 'Sophos and Malwarebytes describe a fake Claude download site aimed at anyone searching for the product; neither names a sector. Malwarebytes: "exploiting the surging popularity of AI tools to trick users".'
    ground_truth_url: https://www.malwarebytes.com/blog/scams/2026/04/fake-claude-site-installs-malware-that-gives-attackers-access-to-your-computer
    fix: Set sectors to [] .
    class: imprecision
- entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
  verdict: imprecision
  defects:
  - where: summary; 2026-09-05 Update section; evidence[2]
    claim: Kubernetes-context proof-of-concept exploits are public, and Red Hat confirms RHEL kernels are affected
    defect: (low confidence) The only source for the Kubernetes proof-of-concept sentence uses "Dirty Frag" for all three CVEs together and does not say a Kubernetes PoC exists for CVE-2026-46300 itself; the entry attaches it to this CVE.
    ground_truth: 'Aikido (section ''Why does Dirty Frag matter for containers?'', where Dirty Frag = CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300): "Researchers have already published working proof-of-concept exploits for Kubernetes, and Ubuntu spells out the risk of a container escape." The Ubuntu link in that sentence is the CVE-2026-43284 page; no source describes a Fragnesia-specific Kubernetes PoC. The public Fragnesia PoC cited by Help Net Security overwrites /usr/bin/su.'
    ground_truth_url: https://www.aikido.dev/blog/dirty-frag
    fix: Attribute it as Aikido's statement about the Dirty Frag family, or say only that a public Fragnesia PoC exists (Help Net Security) and container reachability depends on seccomp, pod security and user-namespace settings.
    class: imprecision
  notes: 'Verified: CVSS 7.8 (Red Hat, NVD, cve.org), not in CISA KEV (2026-10-16 catalog), EPSS 0.0948 / siblings >0.92 as of 2026-09-04 (current EPSS 0.0243, the cves[].epss value is undated and now stale), Red Hat bulletin quote and affected products, Wiz/Help Net Security mitigation and module list.'
- entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
  verdict: imprecision
  defects:
  - where: frontmatter techniques[]
    claim: 'techniques: [T1566, T1566.004, T1557, T1111, T1556, T1098.005, T1539, T1550.004, T1213.002, T1530]'
    defect: '(low confidence) T1556 (Modify Authentication Process) names no behavior GTIG describes: the actor registers a new MFA device (T1098.005) and relays MFA codes (T1111, T1557); nothing modifies an authentication mechanism or process.'
    ground_truth: 'GTIG: "the threat actor immediately navigates to the user''s security settings to register a new, attacker-controlled MFA device". ATT&CK v20 T1556: "Adversaries may modify authentication mechanisms and processes to access user credentials or enable otherwise unwarranted access to accounts" (LSASS, SAM, PAM, authorization plugins).'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/
    fix: Remove T1556; T1098.005 and T1111 already cover the described behavior.
    class: imprecision
- entry: 2026-05-16/node-ipc-npm-package-backdoored-via-expired-domain-account-t
  verdict: imprecision
  defects:
  - where: body citations "[CSO Online, 2026-05-14]"; sources[3] publisher
    claim: CSO counts almost 700K weekly downloads and 424 dependent projects, while StepSecurity reports over 10 million weekly downloads ([CSO Online, 2026-05-14]
    defect: (low confidence) The CSO article's own publication date is 2026-05-15, not 2026-05-14 (the other three sources are dated 2026-05-14).
    ground_truth: CSO Online JSON-LD datePublished 2026-05-15 (2026-05-15T20:46:04-04:00; 21:05:42Z for the modified stamp).
    ground_truth_url: https://www.csoonline.com/article/4171926/expired-domain-leads-to-supply-chain-attack-on-node-ipc-npm-package.html
    fix: Date the CSO citation 2026-05-15.
    class: imprecision
  - where: 2026-09-30 Correction, first sentence
    claim: 'No source says the malicious versions were removed from the registry: when StepSecurity published, npm''s `latest` tag pointed to the malicious 12.0.1'
    defect: '(low confidence) True of the cited sources but stale against the registry: the npm registry metadata for node-ipc no longer lists 9.1.6, 9.2.3 or 12.0.1 (only their publish timestamps remain) and `latest` is 14.0.0, so the exposure is now cached tarballs, lockfiles and mirrors, which the Exposure line already implies.'
    ground_truth: 'registry.npmjs.org/node-ipc (read 2026-10-18): 76 versions listed, none of 9.1.6, 9.2.3, 12.0.1; dist-tags latest 14.0.0; time entries 12.0.1 2026-05-14T14:25:30Z, 9.2.3 14:26:01Z, 9.1.6 14:26:25Z.'
    ground_truth_url: https://registry.npmjs.org/node-ipc
    fix: 'Optional: add that the three versions are no longer served by the registry as of 2026-10-18 while the earlier statement about the sources stays.'
    class: imprecision
  notes: 'Priority context only: priority high on a 2026-05-14 event with no later development in the store; the high bar (decision within 7 days, in-window development) is not met on today''s facts, though the prior audit''s reasoning for keeping such supply-chain entries applies.'
- entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
  verdict: factual-error
  defects:
  - where: summary; body paragraph 1
    claim: lost about $11M across nine blockchains after one of its six vaults was compromised
    defect: 'THORChain''s own incident report counts five vaults, not six (The Record and CryptoTimes say six), and gives the loss as about $10.7M (later report: about $10M); the entry states six as fact and rounds to $11M without surfacing the disagreement.'
    ground_truth: 'THORChain Exploit Report #1 (2026-05-20): "approximately $10.7M from a single vault (out of five)"; "The remaining four vaults were unaffected." The Record: "one of their six vaults was compromised, leading to a loss of about $10.7 million"; TRM Labs: "more than USD 11 million".'
    ground_truth_url: https://blog.thorchain.org/thorchain-exploit-report-1
    fix: 'Say one vault (THORChain''s report: one of five; The Record: six) and give about $10.7M (THORChain) with TRM''s 11M+ as the larger figure, or add a Contradiction line.'
    class: factual-error
  - where: title; headline; summary; body
    claim: GG20 Threshold Signature Scheme flaw suspected
    defect: The entry still presents the GG20 flaw as suspected / a working theory. THORChain confirmed it itself on 2026-05-15 and published a post-mortem on 2026-07-03; neither primary is cited and the entry's sourcing is secondary (The Record, TRM, CryptoTimes).
    ground_truth: 'THORChain Exploit Report #1 timeline, 2026-05-15 19:10: "the leading theory is confirmed as an exploit in the GG20 TSS implementation allowing progressive key material leakage"; summary: "The attacker was a newly churned node operator who entered the network two days prior and exploited a vulnerability in the GG20 Threshold Signature Scheme." Report #2 (2026-07-03): a cryptographic attack on the GG20 signing process combining three weaknesses, with the attacker''s multi-prime Paillier modulus and 864 deliberately failed signing rounds over two and a half days leaking key shares.'
    ground_truth_url: https://blog.thorchain.org/thorchain-exploit-report-2
    fix: 'Replace ''suspected / working theory'' with THORChain''s confirmed account and cite Reports #1 and #2 as primary sources.'
    class: imprecision
- entry: 2026-05-20/microsoft-dcu-disrupts-fox-tempest-malware-signing-as-a-serv
  verdict: imprecision
  defects:
  - where: summary
    claim: Microsoft links it to Vanilla Tempest (Rhysida), Storm-0501, Storm-2561 and Storm-0249
    defect: (low confidence) The parenthetical reads as Vanilla Tempest being Rhysida; Vanilla Tempest is the actor, Rhysida a ransomware family it deployed (alongside others).
    ground_truth: 'Microsoft Threat Intelligence: "Fox Tempest''s operations enabling the deployment of Rhysida ransomware by threat actors such as Vanilla Tempest"; "In some observed cases, Vanilla Tempest also deployed Rhysida ransomware".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/
    fix: '"Vanilla Tempest (which deployed Rhysida)" or drop the parenthetical.'
    class: imprecision
- entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
  verdict: factual-error
  defects:
  - where: 2026-09-30 record summary (and Correction framing)
    claim: GitHub disabled the companion maintain-one-comment repository, not issues-helper
    defect: 'Wrong: GitHub disabled both repositories on 2026-05-19. The ''not issues-helper'' contrast is contradicted by Socket and BleepingComputer (and the body sentence ''GitHub has since disabled access to the maintain-one-comment repository'' is only what The Hacker News knew on 2026-05-19).'
    ground_truth: 'Socket (2026-09-24): "GitHub security team disabled both repositories on May 19, 2026, one day after the malicious content was introduced." BleepingComputer (2026-09-26): "the GitHub security team removed actions-cool/issues-helper and actions-cool/maintain-one-comment".'
    ground_truth_url: https://socket.dev/blog/mini-shai-hulud-actions
    fix: State that GitHub disabled both repositories on 2026-05-19; do not contrast with issues-helper.
    class: factual-error
  - where: body, Exposure, Defender takeaway (missing material development)
    claim: GitHub has since disabled access to the maintain-one-comment repository for a terms-of-service violation
    defect: The entry omits that both actions were re-enabled on 2026-09-16 with every release tag still pointing at the May payload (workflows referencing a tag resumed running it), that SafeDep found six more repositories infected 2026-09-20 to 09-24, and that GitHub disabled both again by 2026-09-25. The 'secrets exposure' window in the takeaway ('on or after 2026-05-18') is now open-ended across 2026-09-16 to 09-25.
    ground_truth: 'Socket: "On September 16, 2026, both repositories became accessible again. Their release tags were not cleaned up first. They still point to the malicious content introduced on May 18, so any workflow that references either action by a version tag resumed downloading and executing the payload on its next run." Update 2026-09-25: both disabled again. THN 2026-09-25 (SafeDep): "six new GitHub repositories were infected between September 20 and 24, 2026, through the actions-cool/issues-helper GitHub Action".'
    ground_truth_url: https://thehackernews.com/2026/09/compromised-github-actions-came-back.html
    fix: 'Add a changelog update: re-enable 2026-09-16, malicious tags intact, ~15,000 dependent repositories on the issues-helper dependency graph, disabled again 2026-09-25, review runs since 2026-09-16 and pin to a SHA that predates 2026-05-18.'
    class: imprecision
  notes: 'Priority high: the September re-activation (same payload, new infections 2026-09-20 to 09-24) keeps the finding live; the earlier ''declined'' reasoning stands but the entry no longer states the live facts. The sectors list includes public-sector although no cited source names a public-sector victim (low confidence, the correction removed the EU/Swiss scope claim but not the sector).'
- entry: 2026-05-28/nx-console-tanstack-daemon-tools-supply-chain-cascade-lands
  verdict: imprecision
  defects:
  - where: frontmatter cves[]
    claim: 'cvss: n/a (CVE-2026-48027, CVE-2026-45321, CVE-2026-8398); affected: null; fixed: null'
    defect: All three CVE records carry cvss 'n/a' and no affected/fixed values although each CNA publishes a score and version data.
    ground_truth: 'CVE-2026-48027 (GitHub CNA): CVSS v4.0 9.3, affected ''= 18.95.0'', fixed 18.100.0. CVE-2026-45321 (GitHub CNA): CVSS v3.1 9.6 (AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:H), 84 versions across 42 @tanstack/* packages. CVE-2026-8398 (Kaspersky CNA): CVSS v4.0 9.3 and v3.1 9.8, affected DAEMON Tools Lite 12.5.0.2421 to 12.5.0.2434, clean 12.6. KEV: all three added 2026-05-27; ransomware use Known for 48027 and 45321, Unknown for 8398.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-45321
    fix: Set cvss 9.3 / 9.6 / 9.3 (state the version) and fill affected/fixed from the Nx postmortem table (18.95.0 exactly / 18.100.0) and the DAEMON Tools notice (12.5.0.2421-2434 / 12.6).
    class: imprecision
  notes: 'Prior-audit remediation held: the TanStack Exposure and Detection additions match GHSA-g7cv-rxg3-hmpx (consider-compromised scope, manifest check, @tanstack/setup, 2.3 MB undeclared payload, 19:20-19:30 UTC CI window). Out of scope but stale: entities/registry.yaml incident:daemon-tools-supply-chain-2026 says ''EU governments targeted'' (Kaspersky: backdoor on a dozen machines in government, scientific and manufacturing organizations in Russia, Belarus and Thailand).'
