    surface: "record 2026-09-10T05:00:00Z"
    kind: record-summary
    text: "GreyNoise documents an AI-agent-orchestrated mass-exploitation campaign against this chain beginning 31 August 2026, using hundreds of AI agents to opportunistically compromise 440 PaperCut instances across 395 organizations in 48 countries, reaching domain admin against 12 of them in as little as five minutes via LSASS credential harvesting, the 2021 noPac flaws, or a PaperCut host running on the domain controller itself, all finishing with a DCSync-based NTDS.DIT credential dump."
