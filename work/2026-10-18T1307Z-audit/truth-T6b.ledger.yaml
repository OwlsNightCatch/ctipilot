    kind: derived
    text: "For AOS-CX, diffing live fabric configuration (VLANs, ACLs, routes) against an approved baseline is the most likely way to catch exploitation after the fact, since a successful buffer-overflow exploit against a compiled daemon leaves little application-layer telemetry beyond a crash-restart cycle."
