    kind: record-summary
    text: "PaperCut shipped Emergency Patch Release 3 on 1 September 2026, superseding Release 2 and fixing two regressions Release 2 had introduced (broken SAML login; lost legacy Microsoft SQL Server driver support for external card lookup). PaperCut also confirms a second, more sophisticated wave of attacks against still-unpatched, internet-facing servers, and separately published incident data naming a post-compromise chain installing a SimpleHelp remote-access service and AnyDesk for durable access."
