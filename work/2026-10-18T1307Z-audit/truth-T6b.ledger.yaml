    surface: "record 2026-09-29T22:55:14Z"
    kind: record-summary
    text: "PaperCut published fully tested maintenance releases 26.0.5, 25.0.13 and 24.1.10 on 10 September 2026. They carry every fix from the three emergency patches plus further hardening, and replace the emergency patches as the recommended build. A server on Emergency Patch Release 3 is protected and can schedule the move normally; one on Release 1 or 2 should upgrade now. There is still no fix for v23 and earlier. PaperCut also reports that new compromises slowed considerably in early September while unpatched, exposed servers are still targeted. CISA added both CVEs to its KEV catalog on 2026-08-31, which the status fields now record."
  - claim_id: fa5ff71012
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "record 2026-10-10T03:46:27Z"
    kind: record-summary
    text: "watchTowr published on 2026-10-09 how the emergency patches were bypassed in turn: the 28 August emergency build could still be taken without authentication through the Setup Wizard forms, and a new administrator-only Scan-to-Fax code-execution flaw, CVE-2026-82077, is fixed only in 26.0.5 and 25.0.13, not in the emergency builds. No source names exploitation of either, though PaperCut says Emergency Patch Release 3 closes off further attack vectors it has seen exploited. Earlier statements the cited sources do not support were corrected where they stood: the 2023 precedent, the university-customer statement, the emergency-patch chronology and the detection wording."
  - claim_id: f79d448d17
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "record 2026-10-17T03:38:00Z"
    kind: record-summary
    text: "Hunt.io recovered the attacker's open directories (2026-10-15) and reports a second route to code execution through PaperCut's XML-RPC API that does not use the Tapestry bypass and works when the API allowlist is too permissive or no explicit token is set, a cron-kept reverse SOCKS tunnel, an offline LSA-secret playbook and 45 victims with live internal pivots, Switzerland among the countries listed. Hunt.io does not report the XML-RPC route used against a victim; PaperCut's documentation names the token and allowlist settings that close it. PaperCut's September bulletin, revised 2026-10-13, now lists CVE-2026-82077 as fixed in 24.1.10 and names 24.1.11 as the v24 build."
