    surface: "section 2026-09-30T07:19:37Z"
    kind: cited
    text: "HPE titles CVE-2026-76658 an unauthenticated remote code execution in the Fabric Composer SSH daemon, not an authentication weakness ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
  - claim_id: 1f9a136235
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "section 2026-09-30T07:19:37Z"
    kind: cited
    text: "It now rests on NCSC-NL's warning that an internet-reachable SSH management interface lets unauthenticated attackers take over the data-center network behind it ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0339"]
  - claim_id: eceb668e5f
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "section 2026-09-30T07:19:37Z"
    kind: uncited
    text: "HPE's own bulletins correct several points."
  - claim_id: a9beee2272
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "section 2026-09-30T07:19:37Z"
    kind: uncited
    text: "Either way the fix is 10.18.1002, and the earlier range of 10.18.0000 to 10.18.0001 did not come from HPE's bulletin."
  - claim_id: daa20c57cb
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "section 2026-09-30T07:19:37Z"
    kind: uncited
    text: "The earlier takeaway described Fabric Composer's role without a cited source."
  - claim_id: f188143590
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "record 2026-09-06T13:45:00Z"
    kind: record-summary
    text: "The affected 10.18 range recorded for CVE-2026-73749 read \"10.18.0001-10.18.1001\", which inverted the branch boundary: HPE's own CVE record gives the affected range as 10.18.0000 up to and including 10.18.0001, so 10.18.0001 is the last affected build rather than the first, and 10.18.1001 appears in neither cited source. A switch on 10.18.0000 would have read the previous range as starting above it. The other four branches and every fixed version were already correct."
  - claim_id: 80aa7702c0
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "record 2026-09-30T07:19:37Z"
    kind: record-summary
    text: "Several flaw descriptions, counts and version ranges rested on relays and on CVE-record mirrors rather than on HPE's own bulletins, which are now the primary source: the Fabric Composer bulletin lists 52 CVEs (not 45) affecting 7.3.3 and below, the AOS-CX bulletin lists 34 CVEs, HPE lists 10.18.0001 as the affected 10.18 build while CERT-FR reads the branch as all 10.18.x before 10.18.1002, and the end-of-maintenance 10.10 branch has no fix for the lower-rated AOS-CX flaws. HPE's exploitation statement is quoted as written. The SSH-daemon description and its evidence quote now come from HPE's own bulletin, and the takeaway now rests on NCSC-NL's warning about internet-reachable management interfaces."
