  - claim_id: 877fc214be
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "headline"
    kind: frontmatter
    text: "An attacker can reconstruct admin credentials for an exposed refrigeration controller offline, then silently disable cooling while the display reports normal"
  - claim_id: 0b8c808051
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Claroty Team82 disclosed 23 vulnerabilities (21 high) in Copeland XWEB300D/500D/500B PRO supervisory refrigeration controllers. Three chain to unauthenticated root RCE: an auth-bypass logic flaw in the Lua authentication handler, a deterministic admin-password generator derivable offline from the device's MAC address and current date, and an unauthenticated OS command injection via the libraries installation route. 17 further, authenticated-only command-injection flaws are individually CVE-mapped by the source at CVSS 8.0 each. Copeland fixed all 23 in firmware v1.13; no source read reports exploitation of these flaws, but CERT-FR's alert of 2026-10-13 now reports numerous compromises of Copeland xweb refrigeration controllers without naming models, flaws or the entry vector."
  - claim_id: ee082a0303
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Copeland XWEB300D/500D/500B PRO controller to firmware v1.13 now, and treat any internet-exposed unit as a compromise-assessment candidate regardless of prior authentication controls: the deterministic-password path is fully reconstructable offline from data available at unauthenticated public endpoints, so a strong admin password alone did not protect an unpatched device."
