    surface: "body"
    kind: cited
    text: "**Defender takeaway:** NCSC-NL warns that where Fabric Composer's SSH management interface is reachable from the internet, unauthorised attackers from outside can use CVE-2026-76658 to take over the data-center network behind it (translated from Dutch) ("
