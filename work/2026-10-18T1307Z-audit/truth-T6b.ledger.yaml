    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "In AOS-CX, CVE-2026-73749 (CVSS 9.8) covers flaws in an AOS-CX daemon that an unauthenticated remote attacker triggers by sending specially crafted packets, reaching remote code execution with elevated privileges ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05134.txt", "https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/"]
