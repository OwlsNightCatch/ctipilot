    surface: "record 2026-09-30T07:19:28Z"
    kind: record-summary
    text: "A sentence contrasted Cisco's product scope with the title of the MITRE CVE record rather than a cited advisory. It now makes the scoping point from Cisco's own advisory, and the sourcing note drops the rating narration. The detection guidance now points at the default Layer 3 VRF that Cisco names, the discovery is described as a TAC support case without calling it internal, and an uncited paragraph on two unrelated Cisco advisories is removed. The takeaway now asks for the patch or the iACL workaround ahead of the maintenance window and drops two claims no source makes, that exploitation compromises the fabric itself and that the ports have no legitimate use."
