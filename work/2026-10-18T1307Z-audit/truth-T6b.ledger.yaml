    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "Until patched, follow HPE's workaround of restricting the CLI and web-based management interfaces to a dedicated layer 2 segment or VLAN, or firewall policy, with accounting and logging of user activity ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
  - claim_id: 6ddc90464d
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
