    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "AOS-CX is HPE Aruba Networking's operating system for its enterprise network switches ("
    urls: ["https://www.bleepingcomputer.com/news/security/hpe-patches-critical-arubaos-cx-remote-code-execution-flaw/"]
  - claim_id: 8a17aef28f
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "The Fabric Composer bulletin lists 52 CVEs, two of them CVSS 10.0: CVE-2026-76658 is a flaw in AFC's SSH daemon that \"could allow an unauthenticated remote attacker to gain administrative access to vulnerable AFC hosts\" and run arbitrary commands as a privileged user, \"leading to complete system compromise\" ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
  - claim_id: 31f8a76598
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "), and CVE-2026-76657 is an API authentication bypass that lets an unauthenticated remote attacker circumvent the API's authentication controls and gain administrative privileges ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
  - claim_id: 22baf6f372
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "Three more rank Critical: CVE-2026-19766 (9.6, an authentication bypass in the underlying operating system that lets an unauthenticated adjacent attacker run code as a privileged user), CVE-2026-73701 (9.0, unauthenticated privileged code execution that depends on preconditions outside the attacker's control) and CVE-2026-73700 (9.0, stored cross-site scripting by an authenticated low-privilege operator against an administrator) ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
  - claim_id: b6a1fa6533
    entry: 2026-09-04/hpe-aruba-fabric-composer-arubaos-cx-cvss10-bundle
    surface: "body"
    kind: cited
    text: "HPE lists Fabric Composer 7.3.3 and below as affected, fixed in 7.4.0 and 7.3.4, and states that all of these flaws were found by its own internal security research ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05133.txt"]
