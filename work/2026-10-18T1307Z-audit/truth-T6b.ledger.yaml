    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Instead, it returned an unpopulated table: { user = nil, role = nil, recovery = nil }\" ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: 9e8eebab56
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "One of the three pre-auth paths is a deterministic admin-password generator: the credential is derived via a key-derivation function from a hardcoded firmware seed identical across the product line, plus the device's MAC address and the current date — both obtainable from unauthenticated public endpoints — letting an attacker reconstruct valid admin credentials fully offline with zero interaction with the target: \"because the seed values are identical across the product line and the variables (MAC address and date) can be obtained via unauthenticated public endpoints, an adversary can reconstruct the entire derivation chain offline\" ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: 017ef20a65
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "All are served by an embedded lighttpd instance where unsanitized user input reaches Lua system-execution calls running with elevated privileges — any of the three pre-auth primitives above chains directly to root: \"since these services run with elevated privileges, successful exploitation results in immediate root-level code execution on the controller\" ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: 7d1a9b6453
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "The vendor successfully patched these vulnerabilities and has uploaded firmware update version 1.13\" ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: d7997970ea
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "); no source read reports exploitation of these flaws in the wild, but CERT-FR's alert of 2026-10-13 reports numerous compromises of Copeland xweb controllers without naming models, flaws or the entry vector ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/"]
  - claim_id: 7da5a365a8
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty Team82 disclosed 23 vulnerabilities (21 rated high) in Copeland XWEB300D/500D/500B PRO supervisory refrigeration controllers (firmware ≤1.12.1), which manage field devices such as the XR60CX controller over Modbus RS-485 and Ethernet in commercial refrigeration and cold-chain deployments."
  - claim_id: a7486468ac
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Two named flaws chain to unauthenticated root RCE."
  - claim_id: 40bb861dc1
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-25085 is a logic flaw in the Lua `user_authenticate` handler: when an attacker supplies an unrecognized `auth_mode` value in the HTTP `Authorization: Basic` header, the function does not return `nil`/`false` but an unpopulated yet \"truthy\" table — \"if an attacker supplied an unrecognized auth_mode, the user_authenticate function did not explicitly reject the request by returning nil or false."
  - claim_id: 5eb0030181
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "A third pre-auth path, CVE-2026-24663 (CVSS 9.0), is an unauthenticated OS command injection reachable by sending a crafted request to the libraries installation route, with no authentication step to bypass at all."
  - claim_id: 2a5d2c8728
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The 17 further CVEs (all listed above) are individually documented OS command-injection flaws across API/CGI endpoints (contacts import, firmware update, device templates, network/Wi-Fi configuration, the Modbus debug tool, and others), each requiring prior authentication and each scored CVSS 8.0."
  - claim_id: 21fd92705e
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty built a live physical demonstration: from an internet-exposed XWEB controller, an attacker reverse-engineers the connected field controller's undocumented Modbus register map and can set the temperature shown on the XR60CX display to any value while silently disabling cooling — spoiled food, or compromised temperature-sensitive medical supplies for pharmaceutical cold-chain."
  - claim_id: cc088b326b
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Copeland shipped firmware v1.13 through coordinated disclosure, fixing all 23 issues: \"Copeland worked closely and collaboratively with us to develop a comprehensive remediation strategy."
  - claim_id: 220cce0506
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "An anonymous, single-request path to full administrative control of internet-exposed cold-chain infrastructure demands action beyond a routine patch cycle, independent of confirmed exploitation: absence of exploitation is not evidence of safety when the exploit is a MAC address."
  - claim_id: 1ccb1083cc
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Internet-exposed commercial refrigeration and cold-storage deployments are directly relevant to healthcare and food-safety cold-chain operations."
  - claim_id: 353b363945
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "**Triage:** the falsified display is itself the detection challenge: Claroty shows the temperature on the XR60CX field controller's display can be set to any value, so a normal reading on the display does not show that cooling is running; any authentication attempt using an `auth_mode` value the deployment does not use is a probe worth alerting on."
  - claim_id: f9336cdd9b
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-08-30T13:12:06Z"
    kind: cited
    text: "Claroty's per-CVE table describes CVE-2026-21718 only as \"an authentication bypass vulnerability... enabling any attackers to bypass the authentication requirement and achieve pre-authenticated code execution\" with a CVSS v3 of 10.0, while the section walking through the MAC-address-and-date key derivation attaches no identifier to it ("
    urls: ["https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"]
  - claim_id: 7cef3dc399
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "Which CVE identifier covers the deterministic admin-password path is **not** something Claroty states, and this entry previously asserted it."
  - claim_id: 4a15be4cd7
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "The three pre-auth paths and the mechanism of each are unchanged, and so is the remediation: firmware v1.13 fixes the disclosed set."
  - claim_id: 961117a51a
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-08-30T13:12:06Z"
    kind: uncited
    text: "What changes is that an operator matching a specific identifier against a vendor patch note or an asset-management ticket should not expect CVE-2026-21718 to be documented anywhere as the password-derivation bug."
  - claim_id: 969a545971
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-10-14T03:45:00Z"
    kind: cited
    text: "CERT-FR revised its alert on refrigeration-controller compromises on 2026-10-13: it now says it knows of numerous compromises of the remote controllers Danfoss AK-SM and AK-SC as well as Copeland xweb and Dixell xweb, that attack campaigns are probably still ongoing, and that access should come back only through a secure VPN or protected network, with filtering to the refrigeration contractors' source addresses accepted only as an emergency measure ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/"]
  - claim_id: c7e878317b
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "section 2026-10-14T03:45:00Z"
    kind: uncited
    text: "The alert names no Copeland models, no vulnerability and no entry vector, and does not tie the compromises to Claroty's findings, so it is not established that CVE-2026-25085 or any other flaw above was used."
  - claim_id: b7be9a6f03
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "record 2026-08-28T15:00:00Z"
    kind: record-summary
    text: "Operator-directed editorial pass (v4.2): removed composition-rationale narration and pipeline-internal jargon from reader-facing text; tightened or cut paragraphs that restated the summary or padded without responder value. No factual claim changed."
  - claim_id: a583886903
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "record 2026-08-30T13:12:06Z"
    kind: record-summary
    text: "This entry stated that CVE-2026-21718 is the deterministic admin-password flaw. Claroty does not say that. Its per-CVE table text for that identifier is generic (\"an authentication bypass vulnerability... enabling any attackers to bypass the authentication requirement and achieve pre-authenticated code execution\", CVSS v3 10.0), and the narrative section that describes the MAC-address-and-date key derivation names no CVE id at all. The binding was an inference by elimination rather than a stated attribution, and a defender tracing the identifier to a patch note would have been misled. The mechanism description stands as reported; the id binding is removed from the title-adjacent claim, the CVE record's affected text, the body and the action, and the sourcing note now states what Claroty does and does not attribute."
  - claim_id: 81ba3e3d02
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "record 2026-10-14T03:45:00Z"
    kind: record-summary
    text: "CERT-FR revised its refrigeration-controller alert on 2026-10-13 to say it knows of numerous compromises of Copeland xweb controllers, in addition to Danfoss and Dixell units; it names no models, flaws or entry vector, so the earlier 'no exploitation reported' no longer describes the product family."
