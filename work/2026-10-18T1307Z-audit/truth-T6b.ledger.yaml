  - claim_id: b391a6dffe
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut disclosed on 27 August 2026 that it was investigating active exploitation of a new flaw in the same product line, before any CVE, patch or public technical detail existed ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: acafea0f07
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "); Rapid7 relays PaperCut's statement that information supplied by a university customer's security team and its digital forensics and incident response team enabled PaperCut to reproduce the vulnerability ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: e358a382e0
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut's own authorization check validates only the page selected for rendering, not the component that runs behind it, so a request that asks Tapestry to render the public, unauthenticated Error, Exception, or Home page while invoking the administrative `ConfigEditor` or `UserList` component bypasses authentication entirely ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: a5ac0dbc72
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Through three such POST requests, `/app?service=direct/1/Error/ConfigEditor/quickFindForm`, `.../ConfigEditor/$Form`, and `.../UserList/$QuickFind.$Form`, an unauthenticated attacker rewrites four external card/ID lookup settings (`user-lookup.db-driver`, `user-lookup.db-url`, `user-lookup.id-to-username-sql`, `user-lookup.enabled`) that normally point PaperCut at an administrator-configured external card database ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 02f8bc049c
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Redirected instead to an attacker-controlled JDBC target through PaperCut's bundled Apache Derby driver and its `foreignViews` feature, the connection reaches an attacker-controlled H2 database whose inline `INIT` statement creates a JavaScript-backed trigger; PaperCut's bundled Nashorn JavaScript engine then executes that trigger to launch an operating-system process, full remote code execution as the PaperCut server, triggered the moment the forged `UserList` search runs the malicious lookup ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 73c5d03654
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "This is a two-CVE chain: CVE-2026-81578 (CWE-306, missing authentication) is the pre-auth entry that gains write access to the server configuration; CVE-2026-82078 (CWE-470, unsafe dynamic class loading) is the flaw that turns a reconfigured database connection into arbitrary Java bytecode execution once that write access is held ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: fac9821947
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut treats **all versions** of NG and MF as potentially affected ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 0807e2f08b
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Huntress observed two live customer exploitations: one on 26 August lasting under two minutes against version 25.0.10.75465, and a second on 27 August against version 24.1.5.71847, before Emergency Patch Release 2 extended coverage to the v24 line ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
