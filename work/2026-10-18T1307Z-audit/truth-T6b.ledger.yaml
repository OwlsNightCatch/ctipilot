    text: "Sophos X-Ops reports a campaign it tracks as STAC4924, active since at least March and closely aligned with this chain, with 19 pairings of a legitimate executable and a malicious DLL rather than one, a loader that stores shellcode as English words, C2 addresses read from a profile on a legitimate community platform, and a first phase of trojanized Teams installers before the TerminalFix lures. Sophos says its observations support BlueVoyant's attribution to the group linked to Vice Society and Rhysida, and that it has seen no encryption."
