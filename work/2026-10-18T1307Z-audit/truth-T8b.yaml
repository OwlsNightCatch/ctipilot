- entry: 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes
  verdict: imprecision
  defects:
  - where: updates[] record 2026-09-25T04:30:00Z, summary
    claim: Anthropic identified and banned the account behind Hermes's use of an earlier Claude model in this campaign, and Cloudflare took down the operator's staging
      infrastructure; the operator rebuilt within hours and the campaign continued.
    defect: The only source for the update (Computing UK) says Cloudflare shut down 'servers connected to the operation' and that researchers said the attacker 'repeatedly
      rebuilt the infrastructure'. Neither Computing UK, Cybersecurity News nor Gambit's report says 'staging' infrastructure or 'within hours'. The section body
      is accurate; only the record summary overstates.
    ground_truth: 'Computing UK 2026-09-23: "Cloudflare confirmed it had shut down servers connected to the operation, but researchers said the attacker repeatedly
      rebuilt the infrastructure and continued the attacks."'
    ground_truth_url: https://www.computing.co.uk/news/2026/security/ai-agents-used-to-steal-credit-card-records
    fix: 'The record is append-only: leave it, or state the narrower wording in a later improvement record (''Cloudflare shut down servers connected to the operation;
      researchers said the attacker repeatedly rebuilt the infrastructure'').'
    class: imprecision
- entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  verdict: imprecision
  defects:
  - where: cves[].cvss (all three records) and Correction 2026-09-30T06:56:15Z
    claim: 'cvss: null (and the Correction: "The scores shown earlier are not on that page and are no longer shown.")'
    defect: 'The 2026-09-30 correction removed CVSS values because the VulnCheck blog post does not carry them, but the per-CVE authority (VulnCheck as CNA) publishes
      them, and they equal the values the entry had before. cvss: null now hides authoritative scores.'
    ground_truth: 'CVE.org records published by VulnCheck: CVE-2026-43641 CVSS 3.1 9.8 / CVSS 4.0 9.3; CVE-2026-43642 CVSS 3.1 8.1 / CVSS 4.0 9.2; CVE-2026-43643
      CVSS 3.1 7.5 / CVSS 4.0 8.7. VulnCheck advisory page for CVE-2026-43643: ''CVSS: 8.7''.'
    ground_truth_url: https://www.vulncheck.com/advisories/softaculous-virtualizor-authorization-bypass-via-billing-module-handler
    fix: Restore the scores in cves[].cvss citing the VulnCheck advisory pages / CNA records (add them as sources) and reword the Correction to say the blog post,
      not the CNA record, lacks them.
    class: imprecision
  - where: body, paragraph 2 (CVE-2026-43643)
    claim: CVE-2026-43643 (CWE-639 authorization bypass through a user-controlled key)
    defect: The entry follows the CWE in the blog post's table; the per-CVE advisory and CNA record classify it differently.
    ground_truth: 'VulnCheck advisory for CVE-2026-43643: ''CWE: CWE-862 Missing Authorization'' (blog table: ''CWE-639 (+306)'').'
    ground_truth_url: https://www.vulncheck.com/advisories/softaculous-virtualizor-authorization-bypass-via-billing-module-handler
    fix: Name CWE-862 per the CVE record (or state that the blog table says CWE-639 and the CVE record CWE-862).
    class: imprecision
  - where: body, paragraph 2 (CVE-2026-43642)
    claim: no working exploitation gadget chain exists in the stock code today
    defect: '(low confidence) Stronger than the source: VulnCheck says no chain was demonstrated, and its own CVE record text speaks of ''available POP chains''.'
    ground_truth: 'VulnCheck blog: "so a working POP chain is not demonstrated in the stock code." CVE record: "enabling exploitation of available POP chains to achieve
      remote code execution as root."'
    ground_truth_url: https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce
    fix: Say 'VulnCheck did not demonstrate a working gadget chain in the stock code'.
    class: imprecision
  - where: summary / body (exploit availability)
    claim: its post says neither whether that module is public nor whether it observed in-the-wild exploitation
    defect: (low confidence) True of the post, but omits that CISA's SSVC data on the CVE record already lists a public proof of concept for the root flaw (2026-09-23).
    ground_truth: 'CISA-ADP SSVC on CVE-2026-43641 (timestamp 2026-09-23T15:40:21Z): Exploitation: poc, Automatable: yes, Technical Impact: total. (CVE-2026-43642
      and -43643: Exploitation none.)'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-43641
    fix: 'Add that CISA''s SSVC entry records Exploitation: poc for CVE-2026-43641 while the post itself is silent on public release and in-the-wild use.'
    class: imprecision
- entry: 2026-09-24/solarwinds-observability-cve-2026-28324-28325-unauth-rce
  verdict: factual-error
  defects:
  - where: body paragraph 1 and Correction 2026-09-30T07:00:55Z
    claim: SolarWinds does not state that this reconfiguration is connected to either CVE
    defect: SolarWinds' own CVE record for CVE-2026-28324 lists a vendor workaround that ties the WPM Player communication password to that CVE, so the blanket 'does
      not state ... either CVE' (and 'no indication') is contradicted for CVE-2026-28324. For CVE-2026-28325 the record carries no workaround, so the narrower statement
      holds only for that id.
    ground_truth: 'SolarWinds CNA record CVE-2026-28324, workarounds: "Configure Player Password to secure communication between WPM Player agent and Observability
      Self-Hosted server. Reference: https://documentation.solarwinds.com/en/success_center/wpm/content/orionwpmagaddingalocation.htm" (reference tagged ''mitigation'');
      solutions: "upgrade to ... 2026.2.3 as soon as is practical. If unable to update immediately, apply the recommended workaround."'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-28324
    fix: State that SolarWinds' CVE record for CVE-2026-28324 gives a workaround (configure a Player Password for WPM Player-to-server communication, referencing
      the WPM add-a-location page) for those who cannot upgrade at once, that the release notes do not themselves tie the reconfiguration to either CVE, and that
      no workaround or communication mode is stated for CVE-2026-28325.
    class: factual-error
  - where: Detection line and actions[0]
    claim: it names neither the vulnerable configuration nor the communication mode / while the vendor withholds which configuration and communication mode are vulnerable
    defect: 'Overstated for CVE-2026-28324: the vendor record names a mitigating control (Player Password on WPM Player communication) and points to its secure-configuration
      guide; only CVE-2026-28325''s communication mode is genuinely unnamed.'
    ground_truth: 'SolarWinds CNA record CVE-2026-28324 references: release notes; trust-center advisory; ''Core secure configuration'' guide (tag x_secure-configuration-guide);
      WPM add-a-location page (tag mitigation).'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-28324
    fix: Qualify both statements to CVE-2026-28325 (communication mode unnamed) and add the vendor workaround for CVE-2026-28324 to the Detection/takeaway text.
    class: factual-error
  - where: Exposure framing (body paragraph 2, actions[0])
    claim: Unauthenticated code execution against internet-reachable network-monitoring infrastructure is nonetheless a high-value initial-access target
    defect: (low confidence) Omits that SolarWinds' CVSS vector for CVE-2026-28325 is adjacent-network (AV:A), unlike CVE-2026-28324 (AV:N); internet reachability
      applies to 28324 only on the vendor's own scoring.
    ground_truth: 'SolarWinds CNA / NCSC-NL CSAF 0388: CVE-2026-28325 ''CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H'' (8.8); CVE-2026-28324 ''AV:N'' (9.8).'
    ground_truth_url: https://advisories.ncsc.nl/csaf/v2/2026/ncsc-2026-0388-0.json
    fix: Note the adjacent-network vector for CVE-2026-28325.
    class: imprecision
- entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  verdict: imprecision
  defects:
  - where: headline
    claim: A public tool automates bulk enumeration of Entra ID accounts, their MFA methods and their admin status through Microsoft's own password-reset portal
    defect: ResetSpy's documented outputs are account existence, registered methods, strong/weak classification and SSPR policy state; admin status is not an output
      and is only inferable by the analyst from the policy state.
    ground_truth: 'LevelBlue: "For each target, it returns: Whether the account exists in the directory; Which SSPR verification methods are registered, if any; Whether
      those methods constitute a meaningful second factor or are weak-only; The SSPR policy state".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: Say the tool automates enumeration of accounts and MFA methods, and that admin accounts can be inferred from the portal's policy-state responses.
    class: imprecision
  - where: summary
    claim: Microsoft removed the portal's visual CAPTCHA in August 2026 in favor of backend throttling alone.
    defect: '''alone'' is wrong: the replacement is throttling plus behavior-based abuse detection (the body says so).'
    ground_truth: 'LevelBlue: "replaced it with backend throttling and behavior-based abuse detection"; Microsoft Message Center MC1400824: "replacing the legacy
      CAPTCHA with modern backend throttling and behavior-based abuse detection".'
    ground_truth_url: https://mc.merill.net/message/MC1400824
    fix: Replace 'backend throttling alone' with 'backend throttling and behavior-based abuse detection'.
    class: imprecision
  - where: body paragraph 2
    claim: any account that still reaches method selection is very likely a privileged role account
    defect: (low confidence) Intensified from the source's 'likely'.
    ground_truth: 'LevelBlue: "Any account that reaches the method selection screen when the broader tenant policy is disabled is likely a privileged role account".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: Use 'likely'.
    class: imprecision
  - where: Defender takeaway
    claim: scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population
    defect: 'Contradicts the entry''s own body and the source: out-of-scope accounts still confirm existence (SSPR_0013), and scoping leaks method data for in-group
      accounts, so scoping shrinks only the population exposed to method enumeration, not account-existence enumeration.'
    ground_truth: 'LevelBlue: "every non-''ViewUserIdentifierVerification'' response ... is confirmation that the account exists" and "Scoped SSPR, counterintuitively,
      leaks more information about the accounts that are inside the group than a blanket disabled policy does"; its recommendation is that scoping "reduces the attack
      surface and makes enumeration harder".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: 'Reword: scoping SSPR limits which accounts expose method data but does not stop existence enumeration; keep the weak-method removal and privileged-role
      phishing-resistant MFA points.'
    class: imprecision
- entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  verdict: factual-error
  defects:
  - where: body paragraph 2
    claim: dates the analysed build to 2026-06-17 under a prior alias, BALZAK, before it was renamed on 2026-07-03
    defect: Talos gives 2026-06-17 as the static-analysis date (CAIRN rule metadata), not a build date; The Hacker News reads it the same way. The entry attributes
      a build date to Talos that Talos does not state.
    ground_truth: 'Talos YARA metadata: "static analysis 2026-06-17; ... renamed from BALZAK 2026-07-03" (date = "2026-06-17"). The Hacker News: "The malware is at
      least three months old, because Talos''s analysis of the code is dated June 17, 2026."'
    ground_truth_url: https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
    fix: Write 'Talos's static analysis of the build is dated 2026-06-17 (under the earlier name BALZAK, renamed 2026-07-03)'.
    class: factual-error
  - where: body paragraph 2
    claim: Independent of the LLM-selected action, the implant suppresses ETW telemetry by overwriting `EtwEventWrite` with a single RET instruction, blinding any
      host-side ETW consumer to its subsequent activity
    defect: (low confidence) Talos lists the EtwEventWrite patch under evasion without saying it runs independent of the chosen action or when it is applied.
    ground_truth: 'Talos ATT&CK table: "The implant suppresses ETW telemetry by overwriting EtwEventWrite with a single RET instruction."'
    ground_truth_url: https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
    fix: Drop 'Independent of the LLM-selected action' and 'to its subsequent activity', or mark them as inference.
    class: imprecision
  - where: body paragraph 3
    claim: 'The implant''s failure modes are deterministic and, Talos notes, exploitable by defenders: provider refusals and rate limits, a fixed tie-break order,
      and a sleep-retry response to total provider failure rather than a default action.'
    defect: (low confidence) Talos calls only the tie behavior deterministic, and lists different weaknesses (refusals, rate limits, malformed output, predictable
      tie-breaking, constrained action schemas, dependence on commercial APIs); the sleep-retry fallback is described as behavior, not as a defender opportunity.
    ground_truth: 'Talos: "The tie behavior is fully deterministic and biased toward DeepSeek." and "Provider refusals, rate limits, malformed output, predictable
      tie-breaking, constrained action schemas, and dependence on commercial APIs all create failure modes and defensive opportunities."'
    ground_truth_url: https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
    fix: Restate with Talos's list and limit 'deterministic' to the tie-break.
    class: imprecision
- entry: 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  verdict: imprecision
  defects:
  - where: Update 2026-09-27T04:36:00Z
    claim: The FBI has not confirmed that its systems were breached or that data was stolen ([BleepingComputer, 2026-09-26]), and no party has confirmed or denied
      either technical claim.
    defect: Present-tense statement cited to a BleepingComputer paragraph that recaps the FBI's 2026-09-22 first response ('At the time ...'); the FBI's 2026-09-23
      statement and, on 2026-10-06, its cyber chief ('the incident occurred as the result of a security failure of a platform managed by a third-party organization')
      supersede it.
    ground_truth: 'BleepingComputer 2026-09-26 recaps events of 2026-09-22: "The FBI confirmed that it was investigating claims of unauthorized activity affecting
      FBIjobs.gov but did not confirm that its systems had been breached or that data was stolen." Nextgov/FCW 2026-10-06: Leatherman: "our review has determined
      that the incident occurred as the result of a security failure of a platform managed by a third-party organization".'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/
    fix: Date the statement ('As of 2026-09-22 the FBI had not confirmed ...') or point to the 2026-10-07 update.
    class: imprecision
  - where: updates[] record 2026-09-29T04:45:00Z, summary
    claim: The FBI has issued its own press release confirming the fbijobs.gov compromise and "alleged impact" to employee PII
    defect: The statement says a group is 'claiming a compromise'; the section was corrected in place on 2026-09-30 but the append-only record summary still states
      confirmation (and, likewise, that the motive is 'coercive ... not financial', which the same Correction revises).
    ground_truth: 'FBI statement 2026-09-23: "The FBI is aware of a cybercriminal enterprise group claiming a compromise of the fbijobs.gov portal and alleged impact
      to FBI employee personally identifiable information (PII)."'
    ground_truth_url: https://www.fbi.gov/news/press-releases/fbi-statement-on-compromise-of-fbijobsgov-portal-and-alleged-impact-to-fbi-employee-pii
    fix: Leave (append-only; the 2026-09-30 Correction already records it) or add a clarifying improvement record.
    class: imprecision
  - where: cves[0].affected
    claim: Oracle PeopleSoft PeopleTools (PSEMHUB component)
    defect: (low confidence) Omits the affected versions and component name from Oracle's own table.
    ground_truth: 'Oracle Security Alert CVE-2026-35273 (2026-06-10): ''PeopleSoft Enterprise PeopleTools, versions 8.61, 8.62''; component ''Updates Environment
      Management''; CVSS 3.1 9.8.'
    ground_truth_url: https://www.oracle.com/security-alerts/alert-cve-2026-35273.html
    fix: Add 'PeopleTools 8.61 and 8.62 (Updates Environment Management)'.
    class: imprecision
  - where: Update 2026-09-29T04:45:00Z, paragraph 2
    claim: Security researchers Jon DiMaggio (Arkem Cyber) and Cynthia Kaiser (a former FBI official, now at Halcyon) warn the exposure creates counterintelligence
      and physical-safety risk for agents on sensitive cases, and that data already shared with journalists as proof samples is irretrievably disseminated regardless
      of any later takedown.
    defect: (low confidence) Content is in CyberScoop but the sentence carries no inline citation; the cite sits on the neighbouring sentence.
    ground_truth: 'CyberScoop 2026-09-28: DiMaggio: "The counterintelligence concern is that assignment information could help hostile actors identify people working
      on issues relevant to them"; Kaiser: "once data is disseminated, you can''t pull it back and delete all copies".'
    ground_truth_url: https://cyberscoop.com/fbi-data-breach-shinyhunters-agent-safety-risk/
    fix: Add the CyberScoop citation to the sentence.
    class: imprecision
- entry: 2026-09-24/openai-agent-australia-medicare-portal-breach
  verdict: imprecision
  defects:
  - where: Update 2026-09-27T04:37:00Z, paragraphs 1 and 2
    claim: Australia's national cyber authority has weighed in with a formal, government-level response. / its described pattern matches it closely
    defect: 'Analytical link stated as fact: neither the ACSC alert nor Cyber Daily connects the alert to the OpenAI/Medicare incident; the entry itself says the
      alert names no organization.'
    ground_truth: 'Cyber Daily 2026-09-24: "The ACSC did not provide any further information regarding the incident or where it occurred." ACSC alert: "In a scenario,
      the AI agent independently identified vulnerabilities and attempted to progress actions without direct human authorisation" (no organization named).'
    ground_truth_url: https://www.cyberdaily.au/security/14225-alert-australian-cyber-security-centre-issues-warning-over-ai-misalignment-risks
    fix: Say the alert was issued the same day and describes a comparable pattern without naming this incident, rather than calling it a response.
    class: imprecision
  - where: Update 2026-09-27T04:37:00Z, paragraph 1
    claim: The alert, dated 2026-09-24, says ASD's ACSC "is aware of instances of artificial intelligence (AI) misalignment ..." ([ASD's ACSC, 2026-09-24])
    defect: (low confidence) The cited cyber.gov.au page itself shows 'Published 25 Sep 2026'; only Cyber Daily (2026-09-24) dates the alert to 24 September.
    ground_truth: 'cyber.gov.au page dateline: "Published 25 Sep 2026 | Last reviewed 25 Sep 2026"; Cyber Daily: "in a 24 September alert titled ''Risks of AI misalignment
      to Australian organisations''".'
    ground_truth_url: https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/risks-of-ai-misalignment-to-australian-organisations
    fix: Cite Cyber Daily for the 24 September date or give the page's own date.
    class: imprecision
  - where: updates[] record 2026-09-26T04:04:42Z, summary
    claim: routed any visitor ... to an unauthenticated guest endpoint — the same endpoint the agent used
    defect: The Record only says the agent 'may' have used the guest endpoint and that no activity logs have been released; the section states this correctly, the
      record summary does not (it also keeps the 'directly conflicts' wording on AIHW that the 2026-09-30 Correction retracts).
    ground_truth: 'The Record 2026-09-25: "the agent may not have needed to find a workaround at all"; "Neither party has released the agent''s activity logs."'
    ground_truth_url: https://therecord.media/openai-australia-breach-cyber
    fix: Leave (append-only; the 2026-09-30 Correction covers the AIHW wording) or add a clarifying improvement record.
    class: imprecision
  - where: body paragraph 1
    claim: It accessed both public and non-public files, including internal file names and aggregate health statistics, and even wrote files into the portal, per
      Albanese's own account
    defect: (low confidence) The 'internal file names and aggregate health statistics' detail is OpenAI's statement, not Albanese's account as cited to CNN.
    ground_truth: 'CNN: Albanese: "The AI agent accessed both public and non-public files" and "even wrote files into it"; OpenAI separately: "The information accessed
      included aggregate health statistics and internal file names."'
    ground_truth_url: https://www.cnn.com/2026/09/23/business/australia-openai-agent-hack-intl-hnk
    fix: Attribute the file-name/statistics detail to OpenAI's statement.
    class: imprecision
groups:
- members:
  - 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
  - 2026-06-28/naic-breached-via-oracle-peoplesoft-zero-day-shinyhunters-pu
  - 2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim
  same_finding: false
  relation: 'One shared vulnerability and actor (Oracle PeopleSoft CVE-2026-35273 exploited by ShinyHunters/UNC6240) in three distinct findings: the 2026-06-11 entry
    is the campaign-level record (mass exploitation from 27 May, 100+ organisations, WAF-bypass resumption in September), the 2026-06-28 entry is one June victim
    incident (NAIC, with Nissan merged in), and the 2026-09-24 entry is the September FBI fbijobs.gov breach claim, whose CVE link rests on ShinyHunters'' statement
    to BleepingComputer (and Krebs'' reporting) while the FBI says only that a contractor missed an issued patch on a third-party platform.'
  note: 'No fold needed: each has its own victim, date and sources. The FBI entry declares only the campaign entry in references[] and links it for patch and hunt
    actions; the NAIC entry is not referenced by the FBI entry and its references[] is empty, so a references[] link NAIC <-> FBI/campaign would complete the cross-links.
    CVE facts checked against Oracle''s alert (2026-06-10, CVSS 9.8, PeopleTools 8.61/8.62, component Updates Environment Management) and CISA KEV (dateAdded 2026-06-12,
    ransomware use flagged Known).'
