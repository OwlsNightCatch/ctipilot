entries:
- entry: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited
  verdict: imprecision
  defects:
  - where: body, first paragraph (and cves[].affected)
    claim: 'Exposure is configuration-dependent: only VCOs with certificate-based Edge-to-VCO authentication configured are affected.'
    defect: Arista's 'Affected Software' list is by version only; the certificate-based authentication condition is stated for exposure/exploitation, not as a boundary
      of 'affected'. The entry conflates the two, and cves[].affected appends the configuration to the version ranges.
    ground_truth: 'Arista, ''Required Configuration for Exploitation'': "VCO is exposed if certificate based authentication from the VeloCloud Edge to VeloCloud Orchestrator
      (VCO) is configured." ''Affected Software'' lists ''5.2.3.15 and below releases in the 5.2.x train'', ''6.1.3.7 and below'', ''6.4.2.7 and below'', ''7.0.0.2
      and below'' with no configuration qualifier.'
    ground_truth_url: https://www.arista.com/en/support/advisories-notices/security-advisory/24765-security-advisory-0183
    fix: Say 'exposed' instead of 'affected' ('only VCOs with certificate-based Edge authentication configured are exposed') and keep cves[].affected to the version
      ranges, with the configuration condition as a separate clause.
    class: imprecision
  - where: body, first paragraph
    claim: a separate, unrelated VCO command-injection flaw disclosed two months earlier
    defect: (low confidence) 'unrelated' is not stated by either cited source; both only call it a different/separate flaw.
    ground_truth: 'The Hacker News 2026-09-22: "The affected releases include those that fixed a different VCO flaw, which Arista reported as exploited in July."'
    ground_truth_url: https://thehackernews.com/2026/09/new-cvss-100-velocloud-orchestrator.html
    fix: Drop 'unrelated' (keep 'separate').
    class: imprecision
