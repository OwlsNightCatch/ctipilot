entries:
- entry: 2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: sources[0].url
    claim: https://securelist.com/amazon-ses-bec-campaign-2026/
    defect: The sole cited source URL does not exist (Securelist 'Page not found'); it was invented. The real Kaspersky report is at a different URL.
    ground_truth: 'Fetching the cited URL returns ''Title: Page not found | Securelist''. The actual report is ''Phishing campaigns and BEC attacks through Amazon SES'' by Roman Dedenok, dated 2026-05-04.'
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Replace the source URL with https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/ (publisher 'Kaspersky Securelist', 2026-05-04); optionally add BleepingComputer https://www.bleepingcomputer.com/news/security/researchers-report-amazon-ses-abused-in-phishing-to-evade-detection/
      (2026-05-04) as corroboration.
    class: factual-error
  - where: body, sentence 5
    claim: Kaspersky observed targeting of finance departments at European manufacturing firms.
    defect: No source names a European or manufacturing victim set; the sector and region of the targets are not stated anywhere. Invented specificity.
    ground_truth: 'Securelist: BEC email ''was sent as if from that employee to the company''s finance department, requesting urgent payment''; Kaspersky press release: ''often sent to finance departments''.
      Neither names manufacturing or Europe.'
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Delete the sentence (or replace with 'BEC lures were addressed to the target organisation's finance department').
    class: factual-error
  - where: body, sentence 2
    claim: SPF and DKIM authentication passes and messages evade most email security gateway filters based on sender reputation.
    defect: 'Imprecise: source says SPF, DKIM and DMARC pass and the sending IP is unlikely to be on reputation blocklists; ''evade most email security gateway filters'' is not stated.'
    ground_truth: These emails utilize SPF, DKIM, and DMARC authentication protocols, passing all standard provider checks ... Because this is legitimate infrastructure, the sender's IP address won't end
      up on reputation-based blocklists.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: 'Say: messages pass SPF, DKIM and DMARC and come from IP addresses unlikely to be blocklisted; blocking SES IPs would block all SES mail.'
    class: imprecision
  - where: body, sentence 3
    claim: Attackers obtain SES API credentials from publicly exposed AWS configuration files (S3 bucket misconfigurations, leaked GitHub repositories).
    defect: 'Imprecise: what leaks is AWS IAM access keys (not ''SES API credentials''), found in GitHub repos, ENV files, Docker images, config backups and public S3 buckets, harvested with TruffleHog-based
      bots.'
    ground_truth: attackers gain access to Amazon SES through leaked IAM (AWS Identity and Access Management) access keys ... public GitHub repositories, ENV files, Docker images, configuration backups,
      or even in publicly accessible S3 buckets ... automated bots based on the open-source utility TruffleHog
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Replace 'SES API credentials' with 'leaked AWS IAM access keys' and list the source's exposure locations.
    class: imprecision
  - where: body, sentence 6
    claim: This report is approximately 96 hours old at publication; first coverage in this brief series.
    defect: Pipeline narration in reader-facing text ('brief series') and a staleness note, not a fact about the threat; headline also carries '~96 h' as a title element.
    ground_truth: Securelist article dated 2026-05-04; BleepingComputer 2026-05-04; Kaspersky press release 2026-05-11.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Drop the sentence and the '~96 h' headline tail; set event_date to 2026-05-04.
    class: imprecision
  verified_core:
  - fact: Kaspersky (Roman Dedenok) reported an uptick in phishing via Amazon SES, starting January 2026 and steady through Q1 2026; published 2026-05-04
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: Phishing via Amazon SES experienced an uptick in January 2026 and has remained relatively steady through Q1.
  - fact: Mail via SES passes SPF, DKIM and DMARC and almost always carries .amazonses.com in Message-ID headers; sender IPs will not be on reputation blocklists; blocking SES would block all SES mail
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: These emails utilize SPF, DKIM, and DMARC authentication protocols, passing all standard provider checks, and almost always contain .amazonses.com in the Message-ID headers.
  - fact: Initial access is leaked IAM access keys (GitHub repos, ENV files, Docker images, config backups, public S3 buckets) found with TruffleHog-based bots; attackers then check key permissions and
      sending limits
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: After verifying the key's permissions and email sending limits, attackers are equipped to spread a massive volume of phishing messages.
  - fact: 'Phishing lures: fake e-signature notifications (DocuSign-style per the press release) linking to a sign-in form hosted on amazonaws.com; links masked with redirects; custom HTML templates'
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: the user is directed to a sign-in form hosted on amazonaws.com.
  - fact: 'BEC variant: fabricated forwarded thread between an employee and a service provider about an outstanding invoice, sent as the employee to the finance department; PDF attachments hold only payment
      details, no URLs or QR codes'
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: The PDF attachments didn't contain any malicious phishing URLs or QR codes, only payment details and supporting documentation.
  - fact: 'Kaspersky mitigations: least-privilege IAM, roles instead of static keys, MFA, IP restrictions, key rotation and audits, KMS encryption'
    source_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    passage: Transition from IAM access keys to roles ... Enable multi-factor authentication ... Configure IP-based access restrictions. Set up automated key rotation
  - fact: BleepingComputer corrected on 2026-05-05 that the uptick is based on Kaspersky telemetry and not a general trend; Amazon pointed to its exposed-credentials guidance
    source_url: https://www.bleepingcomputer.com/news/security/researchers-report-amazon-ses-abused-in-phishing-to-evade-detection/
    passage: corrected the lede to reflect that the abuse increase is based on Kaspersky telemetry data and is not a general trend.
  supported_techniques:
  - 'T1078.004 Cloud Accounts: attackers use leaked IAM access keys to send via victims'' SES'
  - 'T1586.003 Cloud Accounts: compromised cloud accounts acquired as sending infrastructure'
  - 'T1552.001 Credentials In Files: keys harvested from ENV files, repos, Docker images, backups'
  - 'T1566.002 Spearphishing Link: DocuSign-style lures with redirect links to amazonaws.com-hosted credential forms'
  - 'BEC with a fabricated thread impersonating an employee: no active ATT&CK id fits (T1656 Impersonation and T1672 Email Spoofing are REVOKED in the pinned v20 dataset); T1534 Internal Spearphishing does
    not apply (external impersonation)'
  notes: 'Frontmatter carries no classification block and no techniques[] (kind research); sourcing is a single (invented) URL, so verification: single-source rests on a non-existent page until the URL
    is fixed.'
- entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
  verdict: factual-error
  mostly_unsupported: true
  defects:
  - where: summary and body sentence 1
    claim: deploying agentic AI orchestration platforms (LLM-driven workflows with tool-calling, MCP server integration, or autonomous execution capabilities) introduces novel attack vectors
    defect: 'Misstates the advisory''s scope: it concerns autonomous personal AI assistants (OpenClaw, Claude Cowork, open-source equivalents) on user workstations and mobiles, not orchestration platforms
      or MCP integrations; the word MCP does not occur in the advisory.'
    ground_truth: 'Objet : Vulnérabilités et risques des produits d''automatisation par IA agentique sur les postes de travail ... les assistants personnels autonomes de type OpenClaw, Claude Cowork et
      d''autres solutions en sources ouvertes connaissent une adoption particulièrement soutenue.'
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: 'Rewrite: CERT-FR bulletin of 2026-04-13 on agentic AI desktop-automation products (autonomous personal assistants such as OpenClaw and Claude Cowork) on workstations.'
    class: factual-error
  - where: body sentence 2
    claim: 'The advisory identifies three risk classes: prompt-injection via processed documents or websites ...; MCP server supply-chain compromise (a malicious or compromised Model Context Protocol server
      can issue instructions to all connected agents); and insufficient sandboxing of agent execution environments'
    defect: 'The three classes and the MCP supply-chain mechanism are not in the advisory. Its Risques list is: workstation compromise via vulnerabilities in these (mostly beta) tools; sensitive-data leakage
      to uncontrolled external resources; excessive access rights across the user''s office applications; sharing of login secrets with agents and their leakage; loss of control and destructive actions.
      Prompt injection is mentioned only as an example vector (''injections de prompt ou des détournements de messages''); plugins loaded dynamically and run as trusted code with the application''s privileges
      are the supply-chain point.'
    ground_truth: des greffons (plugins) peuvent être chargés dynamiquement et selon le modèle d'intégration, exécutés comme du code de confiance, avec les mêmes privilèges que ceux de l'application.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: Replace with the advisory's actual five risks and the plugin/extension supply-chain point; delete the MCP sentence.
    class: factual-error
  - where: body sentence 3
    claim: CERT-FR recommends input/output guardrails, strict allowlisting of permitted tool calls, human-in-the-loop gates for high-impact actions, and treating all AI agent outputs as untrusted until
      validated.
    defect: 'Misses the advisory''s headline recommendation and invents others: CERT-FR says such assistants must not be deployed on workstations and their use must be prohibited until the product is stabilised;
      limit to isolated test sandboxes with no sensitive data; hardening is the main lever. Guardrail prompts are said to be bypassable; there is no ''outputs untrusted'' or tool-call allowlist statement
      (the allowlists concern communication channels / interlocutors).'
    ground_truth: les assistants personnels autonomes tels qu'OpenClaw ne doivent pas être déployés sur des postes de travail et leur usage doit être proscrit, tant que le produit n'est pas stabilisé et
      éprouvé du point de vue de la sécurité.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: State the prohibition on workstation deployment, test-only sandbox use without sensitive data, mandatory human validation for system commands or side-effect actions, process isolation, channel/interlocutor
      allowlists with explicit @mention activation.
    class: factual-error
  - where: body sentence 4
    claim: Relevant for organisations deploying Claude Agents, Microsoft Copilot Studio, AutoGen, or similar agentic frameworks for workflow automation.
    defect: Only OpenClaw and Claude Cowork are named; Copilot Studio and AutoGen are not mentioned, and the scope is desktop personal assistants, not workflow-automation frameworks.
    ground_truth: assistants personnels autonomes de type OpenClaw, Claude Cowork et d'autres solutions en sources ouvertes
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: Name OpenClaw and Claude Cowork as the advisory does; drop Copilot Studio and AutoGen.
    class: factual-error
  - where: event_date / frontmatter
    claim: 'event_date: null; entities campaign:certfr-2026-act-016'
    defect: The bulletin carries initial and only version date 13 avril 2026 (about 25 days before the entry); it is a guidance bulletin, not a campaign, so a campaign entity key is a mis-typing.
    ground_truth: Date de la dernière version 13 avril 2026 / Version initiale
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: 'Set event_date 2026-04-13; drop the campaign: entity (keep report:).'
    class: imprecision
  verified_core:
  - fact: CERT-FR bulletin CERTFR-2026-ACT-016, dated and only version 13 April 2026, titled 'Vulnérabilités et risques des produits d'automatisation par IA agentique sur les postes de travail'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: 'Objet : Vulnérabilités et risques des produits d''automatisation par IA agentique sur les postes de travail'
  - fact: 'Scope: autonomous personal assistants (OpenClaw, Claude Cowork, other open-source) able to run commands, control the browser, read/write files, manage calendar, send mail, triggered by messages
      via Slack/WhatsApp/Discord; applies to mobile deployments too'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: Ils peuvent exécuter des commandes, contrôler le navigateur, lire et écrire des fichiers, gérer le calendrier et envoyer des courriels
  - fact: 'Supply-chain surface: plugins loaded dynamically, run as trusted code with the app''s privileges'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: des greffons (plugins) peuvent être chargés dynamiquement et ... exécutés comme du code de confiance, avec les mêmes privilèges que ceux de l'application.
  - fact: 'Position: such assistants must not be deployed on workstations and use must be prohibited until stabilised; strictly limit to isolated test sandboxes without sensitive data; never in production'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: ne doivent pas être déployés sur des postes de travail et leur usage doit être proscrit
  - fact: 'Risks: workstation compromise via tool vulnerabilities (mostly beta), sensitive data leakage, excessive access rights, sharing of authentication secrets with agents, loss of control and destructive
      actions; affected systems are Windows/Linux/mobile user workstations and every application the agent can reach'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: Droits d'accès démesurés donnés aux agents IA à l'ensemble des applications bureautiques de l'utilisateur
  - fact: 'Mitigation: control workstation fleet, forbid unvalidated tools (Shadow IT); hardening is the main lever; mandatory human validation for system commands or side-effect actions; sandbox isolation;
      allowlists of channels and interlocutors with restricted activation (explicit @agent mention); prompt hardening alone can be bypassed by injection'
    source_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    passage: une validation humaine doit être obligatoire dès qu'une commande système ou une action à effet de bord est envisagée
  supported_techniques:
  - 'T1698 Indirect Prompt Injection / T1699 Direct Prompt Injection (both exist and are active in v20): advisory cites ''injections de prompt ou des détournements de messages'' without distinguishing direct
    from indirect'
  - 'T1195 Supply Chain Compromise (parent only; T1195.002 is software supply chain): dynamically loaded plugins executed as trusted code'
  notes: 'No techniques[] and no classification in frontmatter. Entry is a guidance bulletin; kind: threat with a campaign entity is a mis-typing.'
- entry: 2026-05-08/cve-2026-0300-pan-os-captive-portal-unauthenticated-root-rce
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: body sentence 3 (mitigation)
    claim: disable the Captive Portal / Authentication Portal feature on internet-facing GlobalProtect gateway interfaces, or restrict access exclusively to trusted internal management IP ranges
    defect: The vendor advisory never ties the flaw or the mitigation to GlobalProtect gateway interfaces. Exposure is the User-ID Authentication Portal enabled plus an interface management profile with
      Response Pages attached to an L3 interface that untrusted traffic can reach; mitigation is trusted-zone restriction plus disabling Response Pages on untrusted-ingress L3 interfaces, or disabling the
      portal.
    ground_truth: 'Customers are impacted if both of the following conditions are true: User-ID Authentication Portal configured ... and An interface management profile with response page enabled and attached
      to any L3 interface in any zone where untrusted/internet traffic can ingress.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Replace with the advisory's two exposure conditions and two mitigations (restrict portal to trusted zones AND disable Response Pages on untrusted-ingress L3 interfaces; or disable User-ID Authentication
      Portal if not required); delete 'GlobalProtect gateway interfaces'.
    class: factual-error
  - where: headline, summary, body sentence 1 and 5
    claim: CISA KEV deadline is today (2026-05-09) ... treat this as a P0 action today before business opens
    defect: The entry was written on 2026-05-08 (discovered_at 2026-05-08T05:00Z), when the 2026-05-09 deadline was the next day, so 'today' is wrong at publication; the deadline itself is correct (KEV
      dueDate 2026-05-09). A KEV due date used as the reason to act is also the entry's lead.
    ground_truth: 'CISA KEV record: dateAdded 2026-05-06, dueDate 2026-05-09; BleepingComputer 2026-05-07: ordered FCEB agencies to secure vulnerable firewalls ''by Saturday midnight, May 9''.'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/pan-os-firewall-rce-zero-day-exploited-in-attacks-since-april-9/
    fix: Drop the 'today' framing and the KEV-deadline lead; state the exploitation basis (CISA KEV 2026-05-06, vendor-observed limited exploitation).
    class: imprecision
  - where: headline / summary / body sentence 2
    claim: no patch until 2026-05-13 ... has not released a permanent patch for any PAN-OS branch; the earliest patch ETA is 2026-05-13
    defect: 'Correct as of 2026-05-08 (BleepingComputer: first patches expected Wednesday May 13), but superseded: the vendor released fixes in waves (advisory timeline 2026-05-13, 05-14, 05-16, 05-28)
      and CISA''s KEV note records ''5/13/2026: Palo Alto has released a variety of patches''. Entry carries no cves[] record and no fixed-version table.'
    ground_truth: 'Advisory timeline: ''2026-05-13 Updated the release timeline and Solution table ... 2026-05-28 Updated the Fix release timeline for 11.1.15, 11.1.7-h6, 11.2.4-h17 and 11.2.12.'''
    ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0300
    fix: Record the first-wave date as 2026-05-13 with later builds, and add cves[] CVE-2026-0300 (CVSS 4.0 base 9.3, KEV 2026-05-06) with the per-branch fixed builds.
    class: imprecision
  - where: body sentence 4
    claim: PAN-OS 11.1+ deployments should confirm Threat Prevention profile with Threat ID 510019 is active
    defect: 'True but omits the vendor''s qualifiers: requires a Threat Prevention subscription and Applications and Threats content version 9097-10022 or later.'
    ground_truth: Customers with a Threat Prevention subscription can block attacks for this vulnerability by enabling Threat ID 510019 from Applications and Threats content version 9097-10022.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Add 'content version 9097-10022 or later, Threat Prevention subscription'.
    class: imprecision
  verified_core:
  - fact: 'CVE-2026-0300: buffer overflow (CWE-787 out-of-bounds write) in the User-ID Authentication Portal (Captive Portal) service of PAN-OS; unauthenticated arbitrary code execution as root on PA-Series
      and VM-Series firewalls by crafted packets; vendor advisory dated 2026-05-05 (updates 05-06, 05-07, 05-13, 05-14, 05-16, 05-28)'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: allows an unauthenticated attacker to execute arbitrary code with root privileges on the PA-Series and VM-Series firewalls by sending specially crafted packets.
  - fact: 'Not affected: Prisma Access, Cloud NGFW, Panorama'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: Prisma Access, Cloud NGFW and Panorama appliances are not impacted by this vulnerability.
  - fact: 'Exposure: both (1) User-ID Authentication Portal configured (Device > User Identification > Authentication Portal Settings > Enable Authentication Portal) and (2) an interface management profile
      with Response Pages enabled attached to an L3 interface in a zone where untrusted/internet traffic can ingress'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: An interface management profile with response page enabled and attached to any L3 interface in any zone where untrusted/internet traffic can ingress.
  - fact: Severity CRITICAL, urgency HIGHEST; CVSS 4.0 base 9.3 (CVSS-BT 9.3), 8.7 when portal access is restricted to trusted internal IPs; exploit maturity ATTACKED
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: 'CVSS-BT: 9.3 /CVSS-B: 9.3 ... CVSS-BT: 8.7 /CVSS-B: 8.7'
  - fact: 'Exploitation status per vendor: limited exploitation observed against portals exposed to untrusted IPs / the internet'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: Limited exploitation has been observed targeting Palo Alto Networks User-ID Authentication Portals that are exposed to untrusted IP addresses and/or the public internet.
  - fact: 'CISA KEV: CVE-2026-0300 added 2026-05-06, dueDate 2026-05-09, knownRansomwareCampaignUse Unknown; requiredAction notes ''5/13/2026: Palo Alto has released a variety of patches'''
    source_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    passage: 'cisa-kev catalogVersion 2026.10.16: CVE-2026-0300 dateAdded 2026-05-06 dueDate 2026-05-09'
  - fact: 'Fixed builds (current advisory): 12.1.4-h5 / 12.1.7; 11.2.4-h17 / 11.2.7-h13 / 11.2.10-h6 / 11.2.12; 11.1.4-h33 / 11.1.6-h32 / 11.1.7-h6 / 11.1.10-h25 / 11.1.13-h5 / 11.1.15; 10.2.7-h34 / 10.2.10-h36
      / 10.2.13-h21 / 10.2.16-h7 / 10.2.18-h6; older unsupported versions must move to a supported fixed version'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: 'PAN-OS 10.2 ... Upgrade to 10.2.18-h6 or later. ... All older unsupported PAN-OS versions: Upgrade to a supported fixed version.'
  - fact: 'Mitigations: restrict Authentication Portal to trusted zones and disable Response Pages in the interface management profile on every L3 interface where untrusted traffic can ingress; or disable
      the portal if not required; Threat ID 510019 (Threat Prevention, content 9097-10022+, PAN-OS 11.1+ decoder)'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0300
    passage: Disable User-ID Authentication Portal if not required.
  - fact: First patches expected 2026-05-13 as told to BleepingComputer on 2026-05-06
    source_url: https://www.bleepingcomputer.com/news/security/pan-os-firewall-rce-zero-day-exploited-in-attacks-since-april-9/
    passage: first ones expected to roll out next Wednesday, May 13.
  supported_techniques:
  - 'T1190 Exploit Public-Facing Application: unauthenticated crafted packets to the Authentication Portal'
  - 'T1055 Process Injection (T1055 parent): shellcode injected into an nginx worker process (Unit 42 brief, not cited by this entry)'
  notes: No cves[], techniques[], affected_products or classification in frontmatter; sourcing_note is migration residue; verification single-source (PSIRT only) although the KEV claim rests on an uncited
    second source.
- entry: 2026-05-08/glpi-certfr-2026-avi-0551-seven-cves-including-ssrf-and-xss
  verdict: factual-error
  mostly_unsupported: true
  defects:
  - where: body sentence 2 (type per CVE)
    claim: SSRF (CVE-2026-32312), stored and reflected XSS (CVE-2026-42317, CVE-2026-42318, CVE-2026-42320, CVE-2026-42321), security policy bypass (CVE-2026-5385), and data integrity compromise (CVE-2026-40108)
    defect: 'The CERT-FR advisory lists risk classes only and never pairs them to CVE ids; the pairing is positional invention and wrong for six of seven ids. Per-CVE authority (GLPI GHSAs and release notes):
      32312 unauthorized export of form structure; 40108 stored XSS in ITIL costs; 42317 arbitrary file deletion by a technician; 42318 arbitrary item deletion via planning; 42320 arbitrary file read inside
      GLPI_DOC_DIR; 42321 stored XSS in asset locks; 5385 stored XSS in the knowledge base. The SSRF is a separate low-severity issue (Unauthorized Webhook CRA Validation SSRF) with no CVE in the release
      notes.'
    ground_truth: '[SECURITY - Medium] Unauthorized export of form structure (CVE-2026-32312) / [SECURITY - Medium] Arbitrary files access (CVE-2026-42320) / [SECURITY - High] Stored XSS in knowledge base
      (CVE-2026-5385) / Stored XSS in ITIL Costs (CVE-2026-40108) / Arbitrary item deletion via planning (CVE-2026-42318) / Arbitrary files deletion by technician (CVE-2026-42317)'
    ground_truth_url: https://github.com/glpi-project/glpi/releases/tag/11.0.7
    fix: Rewrite the type list per id as in ground truth; say CERT-FR names SSRF, XSS, integrity and policy-bypass risks collectively and none of the seven ids is the SSRF.
    class: factual-error
  - where: cves[] vector field
    claim: 'vector: user-interaction (all seven records)'
    defect: Only the three stored-XSS flaws (40108, 42321, 5385) need user interaction (CVSS 4.0 UI:A). 32312, 42317, 42318, 42320 are UI:N, authenticated (PR:H) logic/authorisation flaws.
    ground_truth: CVE-2026-42317 CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H ... 7.0; CVE-2026-42318 ... PR:H/UI:N ... 7.0; CVE-2026-42320 ... PR:H/UI:N/VC:H ... 5.9; CVE-2026-32312 ... PR:H/UI:N/VC:L
      ... 5.1
    ground_truth_url: https://github.com/glpi-project/glpi/security/advisories/GHSA-jf72-cvjh-px5w
    fix: Set vector to network/authenticated-technician (no user interaction) for 32312, 42317, 42318, 42320; keep user-interaction for the XSS ids.
    class: factual-error
  - where: cves[] cvss / affected / fixed
    claim: 'cvss: n/a; affected: null; fixed: null (all seven)'
    defect: Per-CVE authorities publish CVSS 4.0 scores and branch-specific ranges; 'n/a' and null drop them. Notably 40108, 5385 and 32312 affect only 11.x (fixed 11.0.7) and 42321 only 10.x from 10.0.4
      (fixed 10.0.25), while 42317, 42318, 42320 affect both branches.
