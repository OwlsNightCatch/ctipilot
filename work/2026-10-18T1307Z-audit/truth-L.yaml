  - where: evidence[0], evidence[1]
    claim: quotes attributed to publisher 'ctipilot v2 brief (migrated)'
    defect: Both evidence items quote the entry's own earlier text (the second with an ellipsis), not a source page; they prove nothing.
    ground_truth: 'Write-up: ''The embargo was set to 5 days ... if a third party publishes the exploit on the internet during the embargo period, the Dirty Frag exploit would be published publicly.'''
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
