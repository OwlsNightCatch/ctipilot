    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: 'Headline: ''MuddyWater (moderate confidence) ran a Teams social-engineering intrusion under the Chaos ransomware brand without encrypting files (Rapid7)''.'
    class: factual-error
  - where: summary / body sentence 1
    claim: targeting government contractors and defence-adjacent organisations in Europe and the Middle East
    defect: Rapid7 describes one intrusion at an unnamed victim; no sector or European/Middle East targeting is stated (the report mentions Western and Middle Eastern networks for MuddyWater generally,
      'particularly in the US' for prepositioning, and Chaos victims mostly in the US).
    ground_truth: MuddyWater is increasingly leveraging the cybercriminal ecosystem to provide plausible deniability for geopolitical espionage and prepositioning, particularly in the US.
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Delete the targeting clause; say the victim was a single unnamed organisation.
    class: factual-error
  - where: body sentence 3
    claim: A parallel social-engineering vector uses Microsoft Teams external-access invitations to gain remote-assistance sessions under a helpdesk pretext, after which credentials are harvested and used
      for further access via legitimate cloud services.
    defect: 'The Teams contact is the initial access of the same intrusion, not a parallel vector: one-on-one external Teams chats, interactive screen-sharing, credentials typed into local text files, MFA
      changed to add attacker devices, then compromised accounts used to reach internal systems incl. a domain controller over RDP, persistence with DWAgent and AnyDesk, a custom RAT. ''Legitimate cloud
      services'' is not stated.'
    ground_truth: The TA achieved initial access through social engineering conducted via Microsoft Teams, where they initiated one-on-one chats with users from a controlled account. During these interactions,
      the TA established screen-sharing sessions
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Describe the single intrusion chain as in verified_core; drop 'parallel' and 'legitimate cloud services'.
    class: factual-error
  - where: body sentence 4 (ATT&CK ids in prose)
    claim: 'Observed ATT&CK techniques: T1566.004 (Spearphishing via Teams), T1649 (Steal or Forge Authentication Certificates), T1486 (Data Encrypted for Impact).'
    defect: T1486 is contradicted (no encryption observed); T1649 is unsupported (the signing certificate was used to sign malware, nothing in the report steals or forges authentication certificates); T1566.004
      is Spearphishing Voice in the pinned v20 dataset, and a Teams chat is T1566.003 Spearphishing via Service. Also a bare id list in prose with no techniques[] in frontmatter.
    ground_truth: forgoing file encryption in favor of data exfiltration and long-term persistence via remote management tools like DWAgent
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Delete the sentence; populate techniques[] from supported_techniques below.
    class: factual-error
  verified_core:
  - fact: 'Rapid7 (published 2026-05-06): early-2026 intrusion presenting as Chaos RaaS, assessed with moderate confidence as MuddyWater (Seedworm, MOIS-affiliated) false-flag activity; no file encryption;
      data exfiltrated, victim contacted by email for ransom, stolen data later posted on the Chaos leak site and confirmed legitimate by the victim'
    source_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    passage: suggest with moderate confidence that this activity is linked to MuddyWater (Seedworm), an Iranian Advanced Persistent Threat (APT) affiliated with the Ministry of Intelligence and Security
