    claim: CVE-2026-43284 cvss 7.8; CVE-2026-43500 introduced ~2023
    defect: Sources disagree and the entry does not say so. For CVE-2026-43284 the kernel.org CNA scores CVSS 3.1 8.8 (S:C) while CISA-ADP, Red Hat and CCB give 7.8. For CVE-2026-43500 the kernel CNA records
