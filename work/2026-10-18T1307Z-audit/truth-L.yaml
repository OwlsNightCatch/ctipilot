  - where: body paragraph 2 (distributions) and sources[]
    claim: 'Affected distributions with confirmed exposure: Ubuntu 22.04/24.04/24.10'
    defect: Ubuntu's table covers 18.04 to 26.04 LTS/interim releases (no 24.10); Wiz lists only 'Ubuntu (multiple versions)'. The RHSB-2026-003 URL is also listed twice with different labels.
    ground_truth: 'Ubuntu fixed versions: 22.04 5.15.0-181.191; 24.04 6.8.0-124.124; 25.10 6.17.0-35.35; 26.04 7.0.0-22.22.'
