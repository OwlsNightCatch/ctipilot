- entry: 2026-05-09/cve-2025-68670-xrdp-pre-authentication-stack-overflow-arbitr
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: summary and body sentence 1; body sentence 4; event_date
    claim: disclosed by Kaspersky researchers Denis Skvortsov and Dmitry Shmoylov on 2026-05-08 ... mainline patch merged 2026-01-27; public disclosure followed on 2026-05-08; event_date 2026-05-08
    defect: 'The vulnerability was public on 2026-01-27: the xrdp maintainers published GHSA-rwvg-gp87-gh6f and the CVE record the same day the patch merged (CVE-2025-68670 published 2026-01-27, CVSS 3.1
      9.1, reported by Denis Skvortsov). 2026-05-08 is the date of Kaspersky''s Securelist technical write-up, over three months later.'
    ground_truth: GHSA-rwvg-gp87-gh6f published_at 2026-01-27T14:35:37Z; CVE-2025-68670 datePublished 2026-01-27T15:52:41Z; Securelist post dated 2026-05-08.
    ground_truth_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    fix: 'Say: fixed in 0.10.5 and advisory published 2026-01-27; Kaspersky (Skvortsov, Shmoylov) published the technical analysis and PoC description on 2026-05-08; event_date 2026-01-27 or reword as a
      write-up.'
    class: factual-error
  - where: cves[0].cvss / affected / fixed
    claim: 'cvss: n/a; affected: null; fixed: null'
    defect: The CNA (GitHub) and the maintainers' advisory score it CVSS 3.1 9.1 (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H, CWE-121), vulnerable < 0.10.5, fixed 0.10.5 with backports 0.10.4.1 and 0.9.27; CISA
      SSVC Exploitation none; not in KEV.
    ground_truth: CVE-2025-68670 cvssV3_1 baseScore 9.1 CRITICAL; affected '< 0.10.5'.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2025-68670
    fix: Populate cvss 9.1, affected '<0.10.5', fixed '0.10.5 (backports 0.10.4.1, 0.9.27)'.
    class: imprecision
  - where: body sentence 3
    claim: Stack canaries are present but bypassable via canary leakage.
    defect: 'Overstated. Securelist: a canary is enabled by default in most compilers and prevents simply overwriting the return address; an attacker ''could potentially leak or guess its value''. The advisory
      says the impact is lessened with canary builds and that a second vulnerability would be needed to leak the value.'
    ground_truth: The impact of this vulnerability is lessened if a compiler flag has been used to build your xrdp executable with stack canary protection. If this is the case, a second vulnerability would
      need to be used to leak the stack canary value.
    ground_truth_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    fix: Say canary-protected builds need a separate canary leak; the maintainers advise not to rely on canaries alone; add how to check (xrdp -v CFLAGS).
    class: imprecision
  - where: 'body: CVE Summary Table (rows other than xrdp)'
    claim: CVE-2026-40982 | Spring Cloud Config Server | 9.8 ...; CVE-2026-42208 ... Yes — ITW ~26 h post-advisory; CVE-2026-43284 / 43500 ... Exploited Yes — limited campaigns (Microsoft); CVE-2026-44128
      ... patch 15.0.4.1
    defect: 'A day-wrap table of seven other entries'' CVEs is appended to this xrdp entry and repeats their errors: Spring CVSS is 9.1 (CNA), not 9.8; LiteLLM exploitation was ~36 h after the advisory
      (Sysdig; 26 h is a Hacker News misstatement); Dirty Frag exploitation is Microsoft''s hedged ''either Dirty Frag or Copy Fail'' and CVSS is not ''n/a'' (43284 CNA 8.8, 43500 CNA 7.8); SEPPmail 44128
      is fixed in 15.0.2.1/15.0.4, not 15.0.4.1; xrdp''s own CVSS is 9.1 not n/a. The table is off-topic for an xrdp entry.'
    ground_truth: 'CVE-2026-40982 baseScore 9.1 (vmware CNA); Sysdig: ''first exploitation attempt 36 hours and seven minutes after the advisory was published to the global database''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-40982
    fix: Delete the table from this entry (each CVE has its own entry); if kept, correct the five cells above.
    class: factual-error
  verified_core:
  - fact: 'CVE-2025-68670: unauthenticated stack-based buffer overflow in xrdp_wm_parse_domain_information (CWE-121); CVSS 3.1 9.1 (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H); affects xrdp before 0.10.5; fixed
      0.10.5, backported to 0.10.4.1 and 0.9.27; GHSA and CVE published 2026-01-27; reported by Denis Skvortsov (Kaspersky); CISA SSVC Exploitation none; not in CISA KEV'
    source_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    passage: xrdp before v0.10.5 contains an unauthenticated stack-based buffer overflow vulnerability. The issue stems from improper bounds checking when processing user domain information during the connection
      sequence.
  - fact: 'Mechanism (Securelist 2026-05-08): Client Info PDU domain up to 512 bytes; function called before authentication; if the domain starts with ''_'', the part up to ''__'' is copied into a 256-byte
      resultIP stack buffer; attacker needs >256 bytes between ''_'' and ''__'' after UTF-16 to UTF-8 conversion (UTF-8 over 512 bytes causes a conversion error); overwrites return address; stack canary
      terminates the PoC (''stack smashing detected''); found during a security audit of Kaspersky USB Redirector (a module for xrdp in Kaspersky Thin Client)'
    source_url: https://securelist.com/cve-2025-68670/119742/
    passage: To exploit this vulnerability, the attacker simply needs to specify a domain name that, after being converted to UTF-8, contains more than 256 bytes between the initial '_' and the subsequent
      '__'.
  - fact: 'Remediation timeline (Securelist): reported 2025-12-05, maintainers confirmed 12-18, CVE assigned 2025-12-24, patch merged to main 2026-01-27; maintainers advise not to rely solely on stack canaries;
      xrdp -v shows CFLAGS to check -fstack-protector'
    source_url: https://securelist.com/cve-2025-68670/119742/
    passage: '01/27/2026: the patch was merged into the project''s main branch.'
  supported_techniques:
  - 'T1190 Exploit Public-Facing Application: unauthenticated crafted RDP client info (domain field) to an exposed xrdp server (no exploitation reported)'
  notes: The entry is a 2026-05-08 write-up of a January CVE; the xrdp content is accurate except dates, cvss and canary wording. Whole CVE summary table belongs elsewhere. No techniques[], classification;
    priority notable fine.
