  - fact: 'NCSC-CH advisory 12551 (2026-05-08): SEPPmail Secure Email Gateway, six CVEs: CVE-2026-7864 (CVSS 6.9 MEDIUM, exposure of sensitive information), 44125 (9.3, missing authorization in GINAv2),
