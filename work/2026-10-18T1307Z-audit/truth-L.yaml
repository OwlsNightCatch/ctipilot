  - fact: 'InfoGuard fixed-version table: 44128 in 15.0.2.1, 44126 in 15.0.3, 2743/44125/44127/44129/7864 in 15.0.4'
    source_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    passage: '15.0.2.1 | CVE-2026-44128: Unauthenticated Remote Code Execution; 15.0.3 | CVE-2026-44126: Insecure deserialization'
  supported_techniques:
