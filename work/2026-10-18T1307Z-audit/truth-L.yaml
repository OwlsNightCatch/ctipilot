  verified_core:
  - fact: 'Dirty Frag = two page-cache-write flaws chained: xfrm-ESP (CVE-2026-43284, esp4/esp6, in-place decrypt over splice-shared frags, kernel 4.11+) and RxRPC (CVE-2026-43500, kernel 5.3+); deterministic
      arbitrary 4-byte STORE into page cache (e.g. /etc/passwd, /usr/bin/su); on-disk file unchanged until drop_caches/reboot; reported by Hyunwoo Kim (V4bel) to security@kernel.org on 2026-04-29 (rxrpc)
      and 2026-04-30 (esp); public write-up 2026-05-07 after a third party published the esp exploit and broke the 5-day embargo; CVE-2026-43284 assigned 2026-05-08, CVE-2026-43500 published 2026-05-11'
    source_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    passage: '2026-05-07: Detailed information and the exploit for this vulnerability were published publicly by an unrelated third party, breaking the embargo.'
  - fact: 'Preconditions: ESP variant needs an XFRM SA, i.e. CAP_NET_ADMIN via unshare(CLONE_NEWUSER|CLONE_NEWNET) (Ubuntu sometimes blocks via AppArmor); RxRPC variant needs no user namespace but rxrpc.ko
      (loaded by default on Ubuntu, not shipped in most distros, absent in RHEL 10.1); chain covers each other''s blind spots'
    source_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    passage: Chaining the two variants makes the blind spots cover each other.
  - fact: 'Fix status: ESP fix f4c50a4034e6 merged netdev 2026-05-07, mainline 2026-05-08; RxRPC fix aa54b1d27fe0 mainline 2026-05-10. Fixed stable versions: CVE-2026-43284 5.10.255, 5.15.205/206, 6.1.171/172,
      6.6.138, 6.12.87, 6.18.28, 7.0.5, 7.1; CVE-2026-43500 6.6.140, 6.12.88, 6.18.29, 7.0.6, 7.1'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-43284
    passage: 5.10.255 / 5.15.205 / 6.1.171 / 6.6.138 / 6.12.87 / 6.18.28 / 7.0.5 / 7.1 (unaffected versions in the kernel CNA record)
  - fact: 'CVSS 3.1: CVE-2026-43284 kernel CNA 8.8 (AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H), CISA-ADP 7.8 (AC:H), Red Hat 7.8; CVE-2026-43500 kernel CNA 7.8, CISA-ADP 7.8. CISA SSVC: 43284 Exploitation poc
      (2026-05-08), 43500 none (2026-05-11); neither in KEV'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-43500
    passage: baseScore 7.8 (CNA), SSVC Exploitation none
  - fact: 'Microsoft Defender (2026-05-08): limited in-the-wild ''su'' escalation ''may be indicative of ... either Dirty Frag or Copy Fail''; external SSH access, interactive shell, ELF (./update) triggers
      escalation via su, then edits a GLPI LDAP auth file, recon of GLPI directory, deletes/wipes then reads PHP session files; mitigations: disable unused rxrpc, assess esp4/esp6, restrict shell access;
      after exploitation drop caches / validate integrity; patches for CVE-2026-43284 linked via NVD on 2026-05-08, none yet for 43500 at that date'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    passage: As of May 8, 2026, patches for CVE-2026-43500 are not available.
  - fact: 'Vendors: Red Hat RHSB-2026-003 (2026-05-07): fixes released for all affected products; CVE-2026-43500 does not affect Red Hat products; CVE-2026-43284 and CVE-2026-46300 affect RHEL 8/9/10; mitigation:
      install esp4/esp6 /bin/false or user.max_user_namespaces=0; also called ''Copy Fail 2''. Ubuntu (2026-05-08): all releases 18.04-26.04 affected, fixed 22.04 5.15.0-181.191, 24.04 6.8.0-124.124, 25.10
      6.17.0-35.35, 26.04 7.0.0-22.22; AlmaLinux patched kernels to production 2026-05-08 15:22 UTC; NCSC-CH 12547 (2026-05-08) PoC available, block esp4/esp6/rxrpc; CCB (2026-05-08) CVSS 7.8, no ITW reported'
    source_url: https://access.redhat.com/security/vulnerabilities/RHSB-2026-003
    passage: CVE-2026-43500 (rxrpc) does not affect Red Hat products and requires no mitigation.
  - fact: 'CVE-2026-46300 Fragnesia: skb_try_coalesce() loses the SKBFL_SHARED_FRAG marker (bug from 2013), so ESP in-place decryption again hits page-cache frags on hosts patched only for 43284; CNA CVSS
      7.8, CISA SSVC Exploitation none (2026-10-16); public Kubernetes PoCs; Microsoft 2026-05-14: no in-the-wild exploitation observed for Fragnesia'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-46300
    passage: 'net: skbuff: preserve shared-frag marker during coalescing'
  - fact: 'Help Net Security (2026-05-08): Kim privately reported both flaws 2026-04-29/30; third-party leak broke embargo; CVE-2026-43500 unpatched at that time; SANS ISC: neither primitive alone is a
      sufficiently reliable root primitive, chained they give immediate root; treat with Copy Fail as one remediation effort'
    source_url: https://www.helpnetsecurity.com/2026/05/08/dirty-frag-linux-vulnerability-cve-2026-43284-cve-2026-43500/
    passage: when combined, the chained exploit achieves immediate root on most distributions.
  supported_techniques:
  - 'T1068 Exploitation for Privilege Escalation: page-cache write chain to root'
  - 'T1611 Escape to Host: Ubuntu and Aikido describe container-escape scenarios (Kubernetes PoCs exist)'
  - 'T1548.001 Setuid and Setgid: tampered page-cache copy of /usr/bin/su executed to get root (supporting)'
  - 'T1021.004 SSH: Microsoft''s observed initial access over SSH (credential source unstated)'
  - 'T1070 / T1565.001 not supported as observed behaviour by the sources (Microsoft: session files deleted/wiped, GLPI LDAP auth file edited: T1070.004 File Deletion and T1565.001 Stored Data Manipulation
    are plausible for the Microsoft-observed activity)'
  notes: Large entry with two update records; both sections carry unsupported detail. classification B/2 and priority high are defensible on exposure (NCSC-CH advisory, widely deployed kernel code), but
    the 'confirmed exploited' framing must go. The 2026-09-05 update (Fragnesia) is accurate against Aikido, Red Hat and the CNA record.
