    defect: 'Values match FIRST''s 2026-09-04 figures (0.93235 and 0.92855) but are stale: on 2026-10-16 CVE-2026-43500 is 0.02257 (percentile 0.83) and CVE-2026-43284 0.94194. The ''consistent with confirmed
