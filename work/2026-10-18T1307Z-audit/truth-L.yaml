    ground_truth: Educational tech giant Instructure has confirmed that data was stolen in a cyberattack, with the ShinyHunters extortion gang claiming responsibility.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/instructure-confirms-data-breach-shinyhunters-claims-attack/
    fix: Delete the paragraph's WorldLeaks / €3.2 million / 3 GB sample sentences; keep the ShinyHunters 12 May deadline.
    class: factual-error
  - where: 2026-05-09 section, paragraph 2
    claim: Instructure issued a public statement on 2026-05-08 confirming the breach vector was a compromised integration service account for a third-party LTI tool provider (not Canvas core infrastructure),
      and that the issue was isolated. Instructure stated it notified affected institutions on 2026-05-01 and has been working with law enforcement.
    defect: Instructure's account is an exploited vulnerability in its own Free-for-Teacher system (XSS giving administrative access), exploited twice; no LTI service-account vector or 'isolated' statement
      exists. 'Working with law enforcement' is supported (BleepingComputer); a 2026-05-01 institution notification is not (Oxford learned on 6 May that its data was involved; Instructure disclosed publicly
      on 1 May).
    ground_truth: The Reg has learned that ShinyHunters abused XSS vulnerabilities in Canvas' Free-for-Teacher learning software, and the bugs allowed the data thieves to obtain administrative access.
    ground_truth_url: https://www.theregister.com/cyber-crime/2026/05/12/congress-investigates-canvas-breach-after-instructure-cuts-deal-with-shinyhunters/5238927
