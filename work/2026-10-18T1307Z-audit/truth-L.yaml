    defect: Invented identifiers. The only Threat ID in the advisory and in Unit 42's brief is 510019 (content version 9097-10022 or later; PAN-OS 11.1+ decoder); no PA-Series hardware carve-out exists.
    ground_truth: Customers with a Threat Prevention subscription can block attacks for this vulnerability by enabling Threat ID 510019 from Applications and Threats content version 9097-10022. Decoder
      capabilities necessitate PAN-OS 11.1 or a later version for Threat ID support.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
