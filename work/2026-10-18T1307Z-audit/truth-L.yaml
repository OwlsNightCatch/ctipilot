- entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
  verdict: factual-error
  mostly_unsupported: true
  defects:
  - where: body paragraph 1 sentence 1
    claim: CISA added CVE-2026-31431 to KEV on 2026-05-06 with a federal remediation deadline of 2026-05-15
    defect: KEV dateAdded is 2026-05-01, not 2026-05-06 (the due date 2026-05-15 is right). 2026-05-06 is the date the entry's 'originally covered' stub names.
    ground_truth: 'CISA KEV catalog 2026.10.16: CVE-2026-31431 ''Linux Kernel Incorrect Resource Transfer Between Spheres Vulnerability'', dateAdded 2026-05-01, dueDate 2026-05-15.'
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Change to 2026-05-01.
    class: factual-error
  - where: body paragraph 1 sentence 2
    claim: Linux kernel deployments running the algif_aead module (present by default on most distributions unless FIPS mode is active)
    defect: 'No source carries a FIPS-mode exception. CERT-EU: the flaw affects every mainstream distribution shipping a kernel built since 2017; Red Hat: the module is built into the kernel and cannot
      be blocklisted.'
    ground_truth: The vulnerability affects every mainstream Linux distributions shipping a kernel built since 2017.
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-005/
    fix: Delete the FIPS clause; state the CERT-EU scope and that RHEL builds the module into the kernel.
    class: factual-error
  - where: body paragraph 1 sentence 3
    claim: 'Downstream distribution patches: Ubuntu 22.04/24.04 (linux-image 6.1.98-1ubuntu1); RHEL 8/9 (kernel-5.14.0-503.14.1); Debian 12 (pending as of 2026-05-09 06:00 UTC).'
    defect: 'Package versions are not those of the vendors, and the Debian status is wrong: Ubuntu fixed jammy 5.15.0-179.189 and noble 6.8.0-117.117 (fixes published 2026-04-30); Red Hat''s bulletin of
      2026-04-30 says all fixes are available (no kernel-5.14.0-503.14.1 appears); Debian bookworm was fixed in 6.1.170-1 by DSA-6243-1 on 2026-05-01, eight days before the entry.'
    ground_truth: 'Debian: ''these problems have been fixed in version 6.1.170-1'' (DSA-6243-1, Fri, 01 May 2026). Ubuntu CVE page: 24.04 LTS noble Fixed 6.8.0-117.117; 22.04 LTS jammy Fixed 5.15.0-179.189.'
    ground_truth_url: https://ubuntu.com/security/CVE-2026-31431
    fix: Replace with the vendors' fixed versions (or drop the sentence) and state that Ubuntu, Red Hat and Debian shipped fixes by 2026-05-01.
    class: factual-error
  - where: headline and body paragraph 2
    claim: Microsoft documents Linux LPE cluster post-compromise chain ... Microsoft observes that threat actors are using CVE-2026-31431 and CVE-2026-43284/43500 (Dirty Frag) as complementary techniques
      ... deploying CVE-2026-31431 on hosts where the algif_aead module is available and rxrpc/esp* are not, and Dirty Frag on hosts where user namespaces are enabled without algif_aead ... This operationalises
      the two LPE vulnerabilities as a 'pair'
    defect: The Microsoft post is about Dirty Frag. It says only that it is seeing limited in-the-wild privilege escalation via 'su' that 'may be indicative of techniques associated with either Dirty Frag
      or Copy Fail'. The complementary-technique split by module and user-namespace availability and the 'pair' framing do not appear.
    ground_truth: Microsoft Defender is currently seeing limited in-the-wild activity where privilege escalation involving 'su' is observed, and which may be indicative of techniques associated with either
      'Dirty Frag' or 'Copy Fail'.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Rewrite to the sourced statement; drop 'cluster', 'complementary', the host-configuration split and 'pair'.
    class: factual-error
  - where: body paragraph 2 sentence 3
    claim: The same initial access vector (SSH-based credential stuffing with exposed management ports) is used across both chains.
    defect: Microsoft describes 'an external connection gains SSH access and spawns an interactive shell' with no credential stuffing and no exposed management ports; the observed post-exploitation (GLPI
      LDAP authentication file edit, PHP session file deletion) is omitted.
    ground_truth: an external connection gains SSH access and spawns an interactive shell, followed by staging and execution of an ELF binary (./update) that immediately triggers a privilege escalation
      via 'su'.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Replace with Microsoft's observed sequence.
    class: factual-error
  - where: summary / frontmatter
    claim: 'summary: ''UPDATE (originally covered 2026-05-06):''; cves: []'
    defect: Summary carries no content; CVE-2026-31431 (CVSS 7.8, KEV) is the subject but is not in cves[]; the second source 'https://www.cisa.gov/known-exploited-vulnerabilities-catalog' is a catalogue
      index, not a per-CVE page.
    ground_truth: CVE-2026-31431 CVSS 3.1 7.8 (Red Hat, Ubuntu, CERT-EU); KEV 2026-05-01.
    ground_truth_url: https://access.redhat.com/security/cve/CVE-2026-31431
    fix: Write a real summary and add the cves[] record (7.8, status exploited via KEV, fixed per branch).
    class: imprecision
  verified_core:
  - fact: 'CVE-2026-31431 ''Copy Fail'': local privilege escalation in the Linux kernel algif_aead module (AF_ALG AEAD interface); a 2017 in-place optimisation (commit 72548b093ee3) lets page-cache pages
      into a writable scatterlist; chaining an AF_ALG socket operation with splice() gives a controlled 4-byte write to a page-cache page, e.g. a setuid binary such as /usr/bin/su, to get root; CVSS 3.1
      7.8; publicly disclosed 2026-04-29 with a public PoC; mainline fix a664bf3d603d reverts the optimisation (committed 2026-04-01)'
    source_url: https://cert.europa.eu/publications/security-advisories/2026-005/
    passage: By chaining an AF_ALG socket operation with splice(), an unprivileged local user can perform a controlled 4-byte write to an arbitrary page-cache-backed page, targeting a setuid binary such
      as /usr/bin/su to obtain a root shell
  - fact: 'Xint (discoverer Theori researcher Taeyang Lee): deterministic 732-byte Python exploit, no race, works across Ubuntu, Amazon Linux, RHEL, SUSE; page is not marked dirty so on-disk checksums miss
      it; crosses container boundaries (page cache shared), so a container-escape and Kubernetes node-compromise primitive'
    source_url: https://xint.io/blog/copy-fail-linux-distributions
    passage: The kernel never marks the corrupted page dirty for writeback, so the file on disk remains unchanged and ordinary on-disk checksum comparisons miss the modification.
  - fact: 'CISA KEV: added 2026-05-01, due 2026-05-15, ransomware use Unknown'
    source_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    passage: CVE-2026-31431 dateAdded 2026-05-01 dueDate 2026-05-15 (catalogVersion 2026.10.16)
  - fact: 'Vendor fixes: Ubuntu kernels released 2026-04-30 (jammy 5.15.0-179.189, noble 6.8.0-117.117, questing 6.17.0-29.29; 26.04 not affected); Red Hat RHSB-2026-002 (2026-04-30) ''All fixes are now
      available''; Debian bookworm 6.1.170-1 (DSA-6243-1, 2026-05-01), trixie 6.12.85-1 (DSA-6238-1), sid 6.19.12-1; interim mitigation: disable algif_aead (Red Hat: built in, block via boot argument) and
      block AF_ALG sockets with seccomp in containers'
    source_url: https://access.redhat.com/security/vulnerabilities/RHSB-2026-002
    passage: Even though the severity is less than Critical, Red Hat has expedited the release of fixes. All fixes are now available
  - fact: 'Microsoft Defender (2026-05-08, updated 2026-05-14): limited in-the-wild ''su'' privilege escalation that may indicate Dirty Frag or Copy Fail; sequence: external SSH access, interactive shell,
      ELF binary staged and run, ''su'' escalation, then edits to a GLPI LDAP authentication file, directory reconnaissance, PHP session file deletion and reading'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    passage: After gaining elevated access, the actor modifies a GLPI LDAP authentication file (evidenced by a .swp file from vim), performs reconnaissance of the GLPI directory and system configuration
  supported_techniques:
  - 'T1068 Exploitation for Privilege Escalation: AF_ALG/splice page-cache write to a setuid binary'
  - 'T1548.001 Setuid and Setgid: corrupting the page cache of a setuid binary (/usr/bin/su) to get a root shell (supporting, T1068 is the primary id)'
  - 'T1611 Escape to Host: cross-container page-cache write (Xint, CERT-EU, Ubuntu note on container escape scenarios)'
  - 'T1021.004 SSH / T1078 Valid Accounts: external SSH access in Microsoft''s observed activity (credential source not stated)'
  notes: 'Entry kind threat with cves: [] and no techniques[]/classification; Dirty Frag content belongs to the Dirty Frag entry. Priority notable is fine.'
