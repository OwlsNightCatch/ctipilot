  - 'T1059.004 Unix Shell: InfoGuard''s 2743 chain ends in a Perl reverse shell via syslogd (appliance is OpenBSD-style)'
  - 'T1114 Email Collection: after takeover ''attackers can read all mail traffic'''
  - 'T1070.004 File Deletion: 44127 allows deletion of files in the targeted directory (impact class, not a reported attack)'
