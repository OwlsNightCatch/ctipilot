  - where: body paragraph 3 (CL-STA-1132 attribution)
    claim: Palo Alto Unit 42 published a threat bulletin on 2026-05-08 confirming CL-STA-1132 (a China-nexus cluster it tracks separately from previous PAN-OS attackers) as the primary exploitation actor.
    defect: Unit 42's brief is dated 2026-05-07, calls CL-STA-1132 'a cluster of likely state-sponsored threat activity' (no nationality, no statement about earlier PAN-OS actors) and says exploitation
      is limited; the 'China-nexus' and 'primary exploitation actor' wording is the entry's own. (EarthWorm's past use by Chinese-speaking groups is mentioned, not an attribution.)
