      traversal in the identifier parameter of /api.app/attachment/preview, before 15.0.4, 8.8; 44129 SSTI before 15.0.4, 8.3; 7864 unauthenticated endpoint leaks server environment variables, 6.9; 2743
      LFT arbitrary file write to RCE, 15.0.2.1 and before, 10.0, CISA SSVC poc; CISA SSVC Exploitation none for the six NCSC CVEs on 2026-05-08'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-44128
    passage: SEPPmail Secure Email Gateway before version 15.0.2.1 allows unauthenticated remote code execution in the new GINA UI because an endpoint passes attacker-controlled input from a parameter to
      Perl's eval.
  - fact: 'SEPPmail release notes: 15.0.4 released 2026-04-24 (''various test endpoints were active which were intended solely for development purposes ... removed; the relevant CVEs will be published later'');
      15.0.4.1 hotfix 2026-04-28; 15.0.3 (2026-03-03) closed CVE-2026-2743; 15.0.2.1 (2026-02-06)'
    source_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    passage: various test endpoints were active which were intended solely for development purposes and should not have been included in the release. These have been removed.
  - fact: 'InfoGuard Labs (2026-05-18, Dario Weiss, Manuel Feifel, Olivier Becker): CVE-2026-2743 LFT path traversal (/v1/file.app handle_request, JSON ''file'' to WebMailMessage::store_attachments) writes
      as ''nobody''; nobody can write /etc/syslog.conf; piped reverse shell triggered by newsyslog every 15 min (SIGHUP); only LFT-licensed customers affected (404 on /v1/file.app = not affected); majority
