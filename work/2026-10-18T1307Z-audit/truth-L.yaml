    source_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    passage: As of late March 2026, Chaos has claimed 36 victims and maintained a consistent operational tempo
  - fact: 'Rapid7''s assessment: the RaaS brand may blur state vs criminal attribution and focus defenders on extortion, delaying discovery of persistence via DWAgent/AnyDesk; MuddyWater previously used
