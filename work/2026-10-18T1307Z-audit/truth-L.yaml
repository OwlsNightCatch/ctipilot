    ground_truth: both vulnerabilities can be mitigated by disabling unprivileged user namespaces ... echo "user.max_user_namespaces=0" > /etc/sysctl.d/dirtyfrag.conf
    ground_truth_url: https://access.redhat.com/security/vulnerabilities/RHSB-2026-003
    fix: Use user.max_user_namespaces=0 for RHEL; drop the sysctl attribution to Red Hat; say CVE-2026-43500 is not a Red Hat product issue.
