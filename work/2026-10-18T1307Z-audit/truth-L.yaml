- entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: title / headline / main analysis sentence 2
    claim: 330 institutions across six countries ... threatening to publish 16 million student and staff records
    defect: No source gives 'six countries' or '16 million'. 330 is the number of institutional Canvas login pages ShinyHunters defaced on 2026-05-07; the actor's claim is about 275 million records from
      roughly 8,800-9,000 institutions (3.65 TB).
    ground_truth: This has seen a defacement message appear on approximately 330 institutional Canvas login pages. / The original compromise ... with around 275 million records from 8809 educational institutions
      stolen.
    ground_truth_url: https://www.infosecurity-magazine.com/news/shinyhunters-escalates-canvas/
    fix: 'Headline: ''~330 Canvas login portals defaced; actor claims 275M records from ~8,800 institutions; 7 Dutch universities disconnected''; delete ''six countries'' and ''16 million''.'
    class: factual-error
  - where: title / headline / main analysis sentence 3 / 2026-05-09 section
    claim: SURF ... has confirmed 44 Dutch institutions among the victims ... Universiteiten van Nederland (UNL) confirmed that 44 member institutions are potentially affected, representing all Dutch research
      universities and applied science universities; the Dutch DPA ... has opened a preliminary investigation
    defect: The cited SURF URL is a 404. The figure 44 comes from a victim list ShinyHunters posted that BNR reviewed (NL Times, 2026-05-05), not from SURF or UNL. UNL's own update names seven universities
      (UvA, VU, Erasmus, Tilburg, TU/e, Maastricht, Twente) as the Dutch universities using Canvas, all disconnected; the universities made provisional notifications to the Dutch DPA, with no DPA investigation
      reported. The entry's own 2026-05-10 section says seven Dutch universities, contradicting its headline.
    ground_truth: Alle zeven Nederlandse universiteiten die Canvas gebruiken, hebben het onderwijsplatform ontkoppeld.
    ground_truth_url: https://www.universiteitenvannederland.nl/actueel/nieuws/update-8-mei-hack-en-datalek-leverancier-onderwijsplatform-canvas
    fix: Replace 'confirmed 44' with 'ShinyHunters' victim list, per BNR, names 44 Dutch institutions (unconfirmed); the 7 universities using Canvas disconnected it'; fix or drop the SURF source.
    class: factual-error
  - where: 2026-05-09 section, paragraph 2
    claim: The threat actor (WorldLeaks) set a 2026-05-12 payment deadline; the extortion amount was stated as €3.2 million. WorldLeaks previously published a 3 GB sample dataset on 2026-05-07 containing
      course-IDs, student email addresses, assignment metadata, and grade records across four UK institutions. No passwords, payment data, or national identification numbers were present in the sample.
    defect: 'Every source attributes the Canvas extortion to ShinyHunters (as the rest of this entry does); WorldLeaks, a EUR 3.2 million demand and a 3 GB UK sample appear in none. Inside Higher Ed: Instructure
