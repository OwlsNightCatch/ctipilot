- entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
  verdict: factual-error
  mostly_unsupported: true
  defects:
  - where: sources[0] (url and publisher) and body last sentence
    claim: https://www.deepinstinct.com/blog/muddywater-2026 ; 'Deep Instinct Threat Intelligence — MuddyWater 2026 Campaign' ; 'This is a single-source threat-intelligence vendor disclosure.'
    defect: 'The cited Deep Instinct URL is a 404 (''Page Not Found | Deep Instinct''); the research is Rapid7''s ''Muddying the Tracks: The State-Sponsored Shadow Behind Chaos Ransomware'' (Alexandra Blia,
      Ivan Feigl; 2026-05-06), covered the same day by The Hacker News and later by SC World and Cybersecurity Dive. Publisher, URL and the single-source claim are wrong.'
    ground_truth: 'Rapid7: ''In early 2026, a sophisticated intrusion initially appearing to be a standard Chaos ransomware attack was assessed to be consistent with a targeted state-sponsored operation.'''
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Set primary source to the Rapid7 post (2026-05-06), add The Hacker News https://thehackernews.com/2026/05/muddywater-uses-microsoft-teams-to.html as corroboration, set verification multi-source
      or keep single-source with the Rapid7 provenance.
