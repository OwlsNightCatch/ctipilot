- entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: title, headline, summary, cves[].status, update record 2026-05-11 summary
    claim: active exploitation confirmed ... active exploitation in limited campaigns confirmed by Microsoft ... now confirmed exploited in the wild; cves[].status exploited (both CVEs)
    defect: 'Microsoft''s wording is hedged and does not name either CVE: the observed ''su'' privilege escalation ''may be indicative of techniques associated with either Dirty Frag or Copy Fail''. Belgium''s
      CCB (2026-05-08) says no in-the-wild exploitation had been reported; neither CVE is in CISA KEV (catalogue 2026.10.16); CISA''s SSVC entry lists Exploitation ''poc'' for CVE-2026-43284 (2026-05-08)
      and ''none'' for CVE-2026-43500 (2026-05-11).'
    ground_truth: Microsoft Defender is currently seeing limited in-the-wild activity where privilege escalation involving 'su' is observed, and which may be indicative of techniques associated with either
      'Dirty Frag' or 'Copy Fail'.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Say 'Microsoft reports limited in-the-wild su privilege escalation that may be Dirty Frag or Copy Fail'; remove 'confirmed'; set cves[].status exploited only with that qualifier, and not for CVE-2026-43500
      (SSVC none, no CVE-level report).
    class: factual-error
  - where: body sentence 3 (CAP_NET_ADMIN)
    claim: Exploitation requires CAP_NET_ADMIN — available by default in Linux user namespaces on Ubuntu, Fedora, and most Arch-based distributions; restricted on RHEL 8/9 and some hardened configs.
    defect: 'Only the xfrm-ESP variant needs CAP_NET_ADMIN (via unshare of a user namespace). The RxRPC variant ''can be triggered without the privilege to create a user namespace'', which is why the chain
      works on Ubuntu where AppArmor blocks user namespaces. RHEL is not ''restricted'': Red Hat''s own mitigation for the ESP path is to set user.max_user_namespaces=0, i.e. namespaces are allowed by default,
      and RHEL 10.1 does not ship rxrpc.ko. The entry''s own 2026-05-11 section says the RxRPC path needs no user namespace, contradicting this sentence.'
    ground_truth: RxRPC Page-Cache Write does not require the privilege to create a namespace, but the rxrpc.ko module itself is not included in most distributions. For example, the default build of RHEL
      10.1 does not ship rxrpc.ko. However, on Ubuntu, the rxrpc.ko module is loaded by default.
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    fix: 'State per variant: ESP needs user-namespace creation (blocked sometimes by Ubuntu AppArmor); RxRPC needs only a build with rxrpc.ko (default on Ubuntu, absent on RHEL).'
    class: factual-error
  - where: body sentence 4
    claim: write arbitrary values into read-only page-cache pages ... via memory aliasing caused by DMA remapping
    defect: The mechanism in every source is in-place decryption over splice()-attached page-cache fragments that the networking path wrongly treats as privately owned (missing shared-frag handling); DMA
      remapping appears nowhere.
    ground_truth: when a socket buffer carries paged fragments that are not privately owned by the kernel (e.g. pipe pages attached via splice(2)/sendfile(2)/MSG_SPLICE_PAGES), the receive path decrypts
      directly over those externally-backed pages
    ground_truth_url: https://almalinux.org/blog/2026-05-07-dirty-frag/
    fix: Replace with the splice()/shared-frag in-place-decrypt mechanism; keep 'deterministic'; drop 'near-100%' and 'DMA remapping'.
    class: factual-error
  - where: body paragraph 2 sentence 3
    claim: This is a distinct chain from CVE-2026-31431 ("Copy Fail"), also by Kim
    defect: Copy Fail was found by Theori researcher Taeyang Lee (published by Xint); Dirty Frag was found by Hyunwoo Kim (V4bel). Wiz calls Dirty Frag Copy Fail's successor, not the same author's work.
    ground_truth: This finding was AI-assisted, but began with an insight from Theori researcher Taeyang Lee
    ground_truth_url: https://xint.io/blog/copy-fail-linux-distributions
    fix: Delete 'also by Kim'.
    class: factual-error
  - where: summary, cves[CVE-2026-43500].status, 2026-05-11 section paragraph 3
    claim: kernel patch for the rxrpc component still pending on all major distros ... the RxRPC fix was still pending in the netdev tree at time of writing; status mitigation-only
    defect: The RxRPC fix (aa54b1d27fe0) was merged into mainline on 2026-05-10, a day before the 2026-05-11 section was written, and stable trees now carry it (6.6.140, 6.12.88, 6.18.29, 7.0.6). Red Hat
      says CVE-2026-43500 does not affect its products and ships fixes for the rest. 'still pending on all major distros' is stale on every count today and mitigation-only is no longer true.
    ground_truth: '2026-05-10: The aa54b1d27fe0 patch was merged into mainline.'
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    fix: Replace with the fixed stable versions for both CVEs (see verified_core) and drop the pending statements.
    class: factual-error
  - where: body 'Detection' line
    claim: unexpected writes to /etc/passwd or /etc/shadow detected via `auditctl -w /etc/passwd -p w`
    defect: 'The primitive corrupts only the in-memory page cache and leaves the file on disk unchanged (Aikido: ''The file on disk never changes''); Xint (Copy Fail, same class) says the write bypasses
      the ordinary VFS write path, so a file-write audit watch does not fire. No cited source recommends this detection.'
    ground_truth: The file on disk never changes, but the version in memory now says whatever the attacker made it say.
    ground_truth_url: https://www.aikido.dev/blog/dirty-frag
    fix: 'Keep process-lineage detections (non-root to su/setuid with a freshly dropped ELF; esp4/esp6/rxrpc loading on hosts without IPsec/AFS) and add the sourced verification step: check page-cache content
      / drop_caches, not on-disk checksums.'
    class: factual-error
  - where: 2026-05-11 section paragraph 3 (hunt focus and Microsoft claim)
    claim: suspicious setsockopt(AF_ALG) patterns on the esp4/esp6/rxrpc modules followed by splice() syscalls ... The Microsoft post emphasises that the page-cache write primitive bypasses on-disk file
      integrity monitoring (AIDE / IMA-EVM / auditd watch rules)
    defect: AF_ALG is the Copy Fail vector; in the Dirty Frag write-up it appears only as a userspace crypto helper in the rxrpc exploit. The Microsoft post says only that modifications 'may persist in
      memory or cached file content' after mitigation and advises integrity validation and drop_caches; it names no AIDE/IMA-EVM/auditd.
    ground_truth: If exploitation occurred prior to mitigation, malicious modifications may persist in memory or cached file content even after vulnerable modules are disabled.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Delete the AF_ALG sentence and the AIDE/IMA-EVM/auditd attribution; cite what Microsoft actually says.
    class: factual-error
