  verified_core:
  - fact: 'CVE-2026-42208: pre-authentication SQL injection (CWE-89) in LiteLLM Proxy API key verification; GHSA-r75f-5x8p-qvmc (repository advisory 2026-04-20, global advisory DB 2026-04-24); CVSS 4.0
      9.3 (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H); affected >=1.81.16 <1.83.7; fixed 1.83.7 (stable tag 2026-04-18/19), recommended 1.83.10-stable; workaround general_settings.disable_error_logs: true
      (mitigates only the error-path, not the -O assertion-stripped path)'
    source_url: https://api.github.com/repos/BerriAI/litellm/security-advisories/GHSA-r75f-5x8p-qvmc
    passage: Fixed in 1.83.7. The caller-supplied value is now always passed to the database as a separate parameter.
  - fact: 'Mechanism: bearer value not starting with ''sk-'' flows unhashed into an f-string query in PrismaClient.get_data() (combined_view) via the failure-callback path (default) or via stripped assertion
      (-O); all LLM API routes reachable pre-auth; blind time-based injection (pg_sleep), response is a fixed HTTP 401; stock Docker compose Postgres sidecar gives a superuser app user (full read/write)'
    source_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    passage: Because the response body is identical for every probe (HTTP 401 with a fixed JSON error), successful exploitation was confirmed with a time-based blind channel via PostgreSQL's pg_sleep().
  - fact: 'Exploitation: Sysdig observed first attempts 36 h 7 min after global advisory publication, a custom schema-enumeration sweep (UNION probes) of LiteLLM_VerificationToken, litellm_credentials and
      litellm_config; no follow-through observed (no authenticated use of keys, no key minting); Bishop Fox corroborates exploitation ~36 h after the advisory'
    source_url: https://www.sysdig.com/blog/cve-2026-42208-targeted-sql-injection-against-litellms-authentication-path-discovered-36-hours-following-vulnerability-disclosure
    passage: We did not see follow-through, however. There were no authenticated calls using exfiltrated keys, no virtual-key minting via /key/generate, and no chained reuse of provider credentials.
  - fact: 'CISA KEV: added 2026-05-08, due 2026-05-11, ransomware use Unknown'
    source_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    passage: CVE-2026-42208 BerriAI LiteLLM SQL Injection Vulnerability dateAdded 2026-05-08 dueDate 2026-05-11
  - fact: 'Detection note: vulnerable host under attack returns a normal 401; only anomaly is latency (~6 s with pg_sleep(6)) and log lines of the form ''Received=..., expected to start with sk-''; vendor
      advises reviewing Postgres query history if the proxy was reachable from an untrusted network; Bishop Fox adds a WAF rule rejecting bearer values not matching ^sk-[A-Za-z0-9_-]+$ and rotating live
      virtual keys'
    source_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    passage: Those log lines look identical to noise from misconfigured clients hitting the proxy without an sk- prefix.
  supported_techniques:
  - 'T1190 Exploit Public-Facing Application: unauthenticated crafted Authorization header against any LLM API route (exploited in the wild per Sysdig and KEV)'
  - 'T1552.001 / T1555 not supported as observed behaviour: Sysdig saw enumeration only, no credential theft or reuse'
  notes: Priority high is defensible on today's facts (KEV, exploited, pre-auth). Frontmatter has no techniques[], classification, affected_products. The 26-hour figure stems from The Hacker News, which
