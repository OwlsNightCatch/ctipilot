  supported_techniques:
  - 'T1190 Exploit Public-Facing Application: unauthenticated requests to the new GINA UI / api.app endpoints'
  - 'T1114 Email Collection: attackers can read all mail traffic after takeover (InfoGuard)'
  - 'T1059.004 Unix Shell: Perl reverse shell via syslogd (2743 PoC)'
  - 'T1070.004 File Deletion: 44127 file deletion (impact class)'
  notes: 'Mostly unsupported: apart from the NCSC-sourced CVE list and CVSS numbers, the technical, detection, hardening and regulatory content is invented. Fold into 2026-05-09/cve-2026-44128-et-al-...
    and keep none of it. Frontmatter has no techniques[] or classification.'
