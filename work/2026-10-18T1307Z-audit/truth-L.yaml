    ground_truth: 'InfoGuard: ''SEPPmail is a widely used E-Mail Gateway for encrypted Mails in the DACH (Germany, Austria, Switzerland) region. There are several thousand public instances on Censys.'''
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: Drop the table and the regulatory paragraph; keep T1190 and T1114 (see supported_techniques); say SEPPmail is widely used in DACH per InfoGuard.
    class: factual-error
  - where: body first section
    claim: SEPPmail AG (Steinach, Canton of St. Gallen, Switzerland) ... the proprietary GINA (Gateway Integrated Network Application) webmail portal
    defect: SEPPmail AG's address is Industriestrasse 7, 5432 Neuenhof (Canton Aargau); the GINA expansion appears in no source (SEPPmail describes GINA as its technology for spontaneous secure email to
      recipients without encryption).
    ground_truth: SEPPmail AG, Industriestrasse 7, 5432 Neuenhof, Switzerland (SEPPmail contact page).
    ground_truth_url: https://www.seppmail.com/about-us/contact/
    fix: Use Neuenhof AG; drop the acronym expansion.
    class: factual-error
  - where: frontmatter
    claim: 'kind: threat; cves: []; priority: notable; classification absent; sources: NCSC-CH + release notes only'
    defect: A vulnerability entry with no cves[] records (the other SEPPmail entry carries them), no techniques[], and none of the InfoGuard/THN sourcing that carries the real per-CVE detail; it duplicates
      the 2026-05-09 sibling entry.
    ground_truth: Entry 2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3 carries the seven cves[] records and the InfoGuard update.
    ground_truth_url: https://security-hub.ncsc.admin.ch/api/posts/12551/details
    fix: Fold into the survivor (see groups) and keep none of the invented detail.
    class: imprecision
  verified_core:
  - fact: 'SEPPmail AG (Neuenhof AG, Switzerland) makes the SEPPmail Secure Email Gateway, an appliance/virtual appliance for secure email (S/MIME, PGP, TLS) with the GINA webmail for spontaneous secure
      mail to recipients without encryption; InfoGuard: widely used in DACH with several thousand public instances on Censys'
    source_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    passage: SEPPmail is a widely used E-Mail Gateway for encrypted Mails in the DACH (Germany, Austria, Switzerland) region. There are several thousand public instances on Censys.
  - fact: 'NCSC-CH advisory 12551 (2026-05-08): six CVEs 7864 (6.9), 44125 (9.3), 44126 (9.2), 44127 (8.8), 44128 (9.3, ''Fixed in v15.0.2.1''), 44129 (8.3); exposed test endpoints allow unauthenticated
      code execution; exploitation status UNKNOWN; vendor patches available since 2026-04-24; fixed in 15.0.4'
    source_url: https://security-hub.ncsc.admin.ch/api/posts/12551/details
    passage: Successful exploitation of these exposed test endpoints allows unauthenticated attackers to execute arbitrary code, manipulate files, and gain unauthorized system access.
  - fact: 'Per-CVE CNA records (NCSC.ch, CVSS 4.0): 44128 Perl eval injection in new GINA UI (before 15.0.2.1); 44125 missing authorization (before 15.0.4); 44126 insecure deserialization (CWE-502, AT:P,
      before 15.0.4); 44127 unauthenticated path traversal /api.app/attachment/preview identifier (read files, delete files in the target directory); 44129 SSTI, RCE depending on enabled template plugins;
      7864 unauthenticated endpoint exposes server environment variables; all PR:N'
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-44127
    passage: contains an unauthenticated path traversal vulnerability in the identifier parameter of /api.app/attachment/preview
  - fact: 'SEPPmail release notes: 15.0.4 (2026-04-24) removed test endpoints that were active in the GINAv2 beta (''relevant CVEs will be published later''); 15.0.4.1 (2026-04-28), 15.0.4.2 (2026-05-08),
      15.0.4.3 (2026-05-11) are hotfixes; 15.0.3 (2026-03-03) closed CVE-2026-2743'
    source_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    passage: In the beta version of GINAv2 on the appliance, various test endpoints were active which were intended solely for development purposes and should not have been included in the release.
  - fact: 'InfoGuard (2026-05-18) and The Hacker News (2026-05-19): seven flaws incl. CVE-2026-2743 (10.0), LFT file.app path traversal writes /etc/syslog.conf as nobody, newsyslog every 15 minutes triggers
      SIGHUP, Perl reverse shell; 44128 eval of the upldd parameter in /api.app/template; takeover lets attackers read all mail traffic'
    source_url: https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html
    passage: An eval injection vulnerability that allows unauthenticated remote code execution by taking advantage of the fact that the /api.app/template feature directly passes user-supplied upldd parameter
