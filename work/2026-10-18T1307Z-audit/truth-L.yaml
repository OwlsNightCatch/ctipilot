- entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
  verdict: imprecision
  mostly_unsupported: false
  defects:
  - where: cves[0].type and tags
    claim: 'type: auth-bypass; tag auth-bypass'
    defect: The flaw is a pre-authentication SQL injection (CWE-89) in the API key verification path, not an authentication bypass; no source calls it one. affected and fixed are left null although the
      vendor gives exact ranges.
    ground_truth: 'GHSA-r75f-5x8p-qvmc: ''SQL injection in Proxy API key verification'', CWE-89, vulnerable >=1.81.16 <1.83.7, patched >=1.83.7, CVSS 4.0 9.3.'
    ground_truth_url: https://api.github.com/repos/BerriAI/litellm/security-advisories/GHSA-r75f-5x8p-qvmc
    fix: type sqli; affected '>=1.81.16, <1.83.7'; fixed '1.83.7' (recommended 1.83.10-stable); record cvss as CVSS 4.0.
    class: imprecision
  - where: summary
    claim: 'a blind time-based injection via the Authorization: Bearer header yields full read/write access to credential tables'
    defect: 'Unconditional. Bishop Fox: full read/write only because the stock Docker compose Postgres sidecar makes the application user a database superuser; the vendor advisory says an attacker ''could
      read data ... and may be able to modify it''; virtual keys are stored as SHA-256 hashes.'
    ground_truth: On a stock Docker compose deployment with the BerriAI image and a default Postgres image sidecar, the application user is a database superuser, which raises the impact from 'read sensitive
      metadata' to full read/write access against every LiteLLM-managed table
    ground_truth_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    fix: 'Qualify: read access always; write only where the DB user is superuser (stock compose); virtual keys hashed.'
