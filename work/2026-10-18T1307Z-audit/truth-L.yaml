    source_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    passage: The convergence of technical and contextual evidence is consistent with attribution to MuddyWater with moderate confidence.
  - fact: 'Chaos RaaS profile: active since Feb 2025, likely ex-BlackSuit/Royal, vishing plus Quick Assist, double/triple extortion, 36 claimed victims by late March 2026, mostly US (construction, manufacturing,
