  - fact: 'Post-compromise: authenticated to internal systems incl. a Domain Controller with multiple compromised accounts, RDP for movement, persistence via DWAgent and AnyDesk, payloads fetched with curl
      over RDP; downloader (ms_upd.exe, aka Stagecomp) fetched the custom RAT (Game.exe, aka Darkcomp, trojanized Microsoft WebView2APISample) with encrypted config; RAT polls the C2 every 60 s and runs
      cmd/PowerShell, file upload/delete, interactive shells'
    source_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    passage: The RAT features 12 core capabilities including arbitrary command execution via hidden cmd.exe or encoded PowerShell sessions
  - fact: 'Attribution basis: code-signing certificate (''Donald Gay'') shared within MuddyWater''s toolkit and used to sign ms_upd.exe, C2 domain overlap, pythonw.exe tradecraft, Teams IT-support persona;
