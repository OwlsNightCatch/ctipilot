  - where: headline / summary / body sentence 1
    claim: document-based exploits resurge ... marked resurgence in document-based exploit delivery, with Microsoft Office and PDF readers accounting for the largest share of initial-access exploit deployments
    defect: Not in the report. It says exploit kits expanded with new Office, Windows and Linux exploits, but for Linux 'we observed a decrease in the number of detected exploits'; veteran Equation Editor
