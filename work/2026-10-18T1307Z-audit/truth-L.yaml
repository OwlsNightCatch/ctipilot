    defect: The sole source URL is invented (Securelist 'Page not found'). The real report is 'The vulnerability landscape in Q1 2026' by Alexander Kolesnikov, 2026-05-07.
    ground_truth: 'Fetch of the cited URL returns ''Title: Page not found | Securelist''.'
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
