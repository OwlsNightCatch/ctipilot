- entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  verdict: imprecision
  defects:
  - where: body paragraph 1
    claim: Elastic points to the Dune-derived naming the payload reuses as the similarity to previous Shai-Hulud campaigns
    defect: Elastic states two separate facts (Dune-themed strings; similarities to earlier campaigns), not that the naming is the similarity.
    ground_truth: 'Elastic: the payload "contains strings with Dune-themed references and has similarities to previous Shai-Hulud campaigns"'
    ground_truth_url: Elastic Security Labs write-up cited on the entry
    fix: State the two facts separately.
    class: imprecision
  - where: containment paragraph
    claim: Elastic's own guidance is to revoke all GitHub tokens ... and does not mention any such trigger
    defect: Elastic does discuss the revoke-warning commit string (calls it an attempt to intimidate developers not to revoke); the paragraph also omits Unit 42's finding that the August sample decrypted but never invoked the persistence installer.
    ground_truth: 'Elastic: "an attempt to intimidate developers not to revoke the GitHub token"; Unit 42: "treat OS-level persistence as latent capability, not observed behavior"'
    ground_truth_url: Elastic and Unit 42 pages cited on the entry
    fix: Correct the Elastic characterisation and add the Unit 42 latent-capability qualifier.
    class: imprecision
  - where: 2026-08-08 section
    claim: only proceeds if it finds itself inside GitHub Actions, in a repository whose name contains /opensearch-js
    defect: Ambiguous; per Unit 42 the match triggers only the static republish routine, the worm collects normally elsewhere.
    ground_truth: Unit 42 describes the repository match as the trigger for the republish path only.
    ground_truth_url: Unit 42 page cited on the entry
    fix: Say "this second path only runs when ...".
    class: imprecision
  - where: body (advisory)
    claim: gh-token-monitor
    defect: A persistence file/service name, which reads as a file-name indicator.
    ground_truth: n/a
    ground_truth_url: n/a
    fix: Describe the persistence behaviour without the artefact name.
    class: imprecision
- entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
  verdict: imprecision
  defects:
  - where: cves[].cvss / sourcing_note
    claim: cvss 7.1 (NCSC-NL)
    defect: The CVE record carries a CISA-ADP CVSS 3.1 score of 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); the conflicting authority score is not mentioned.
    ground_truth: CISA-ADP 9.8 on the CVE record
    ground_truth_url: CVE record for CVE-2026-65400 (read via the CVE API; not citable)
    fix: Mention the ADP 9.8 beside NCSC-NL's 7.1 in the sourcing note, citing a citable page that carries it.
    class: imprecision
  - where: body
    claim: NCSC-NL classed it CWE-287
    defect: (low confidence) NCSC-NL 1.0.1 shows "Improper Authentication" without a CWE id; CWE-287 comes from CISA-ADP / KEV.
    ground_truth: NCSC-NL advisory characteristic "Improper Authentication"
    ground_truth_url: NCSC-2026-0280
    fix: Attribute CWE-287 to CISA's KEV record.
    class: imprecision
  - where: Contradiction paragraph
    claim: (omission)
    defect: Omits that Apple credits CVE-2026-65400 to Alfredo Pesoli via Bynario Atlas, not fG!, which Calif cites for the separate-bug reading.
    ground_truth: Apple's advisory credit line
    ground_truth_url: Apple 148170/1/2
    fix: Add the credit as the basis Calif gives.
    class: imprecision
- entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
  verdict: imprecision
  defects:
  - where: body
    claim: The Google finding is tracked as CVE-2026-12537
    defect: Binds Novee's Gemini chain (incl. the /proc/$PPID/environ read) to a CVE whose CNA record describes a different vector (crafted .gemini/.env file in the container launcher, CWE-20, CVSS 4.0 10.0); Google's GHSA covers headless folder trust plus tool allowlisting under --yolo.
    ground_truth: CNA (Google Cloud) record title "Unauthenticated Remote Code Execution in Gemini CLI CI/CD Workflows"
    ground_truth_url: Google GHSA for Gemini CLI / CVE record
    fix: State what the CVE and GHSA cover, separately from Novee's chain.
    class: imprecision
- entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
  verdict: imprecision
  defects:
  - where: cves[].epss
    claim: epss 0.11736
    defect: Stale; FIRST now shows 0.71663 (2026-10-14 to 10-16), jump on 2026-10-06; the frontmatter value carries no date.
    ground_truth: FIRST EPSS API 0.71663
    ground_truth_url: https://api.first.org/data/v1/epss?cve=CVE-2026-73570
    fix: Refresh epss and its date in the sourcing note.
    class: imprecision
