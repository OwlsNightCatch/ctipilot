entries:
- entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
  verdict: imprecision
  defects:
  - where: 2026-07-21 section, second paragraph
    claim: ServiceNow's hosted/SaaS estate is already remediated, so exposure concentrates in on-prem and MSP-run deployments, which should be inventoried first.
    defect: 'Uncited, and partly contradicted: ServiceNow''s spokesperson still encourages ServiceNow-hosted customers to apply the patches, and ''MSP-run'' appears in no source (KB says ''self-hosted customers
      and partners'').'
    ground_truth: 'BleepingComputer quotes ServiceNow: "we encourage our self-hosted and ServiceNow-hosted customers to apply the relevant patches if they have not already done so"; KB3137947: "Relevant
      security updates have also been provided to ServiceNow self-hosted customers and partners."'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/
    fix: Say ServiceNow states it deployed a security update to hosted instances (KB3137947), that self-hosted customers and partners received updates, and drop 'MSP-run' / 'already remediated'.
    class: imprecision
  - where: 'headline, cves[].affected, actions[0], takeaway: ''partner-managed'''
    claim: self-hosted and partner-managed instances are the residual exposure
    defect: '''Partner-managed instances'' is the entry''s own gloss; the vendor says updates were provided to ''self-hosted customers and partners'' and the spokesperson still urges ServiceNow-hosted customers
      to patch.'
    ground_truth: '"Relevant security updates have also been provided to ServiceNow self-hosted customers and partners."'
    ground_truth_url: https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947
    fix: Use 'self-hosted instances and partners that received updates' or attribute the partner framing; keep hosted customers in the patch-if-not-done line.
    class: imprecision
  - where: updates[0] record summary (2026-07-21)
    claim: NCSC-CH updated its advisory on 2026-07-20 to flag CVE-2026-6875 ... as actively exploited, with in-the-wild activity reported from 2026-07-18 ... self-hosted and partner-managed deployments
      that have not applied hotfix KB3137947
    defect: 'The record summary keeps three statements the 2026-09-30 Correction says were wrong: NCSC-CH hub post 12778 shows a single ''Published'' event on 2026-07-20 (no revision), Defused''s first
      attempts were 2026-07-17, and KB3137947 is a security bulletin, not a hotfix. Records are append-only, so the Correction record is the remedy, but the rendered changelog still shows the superseded
      wording.'
    ground_truth: 'NCSC-CH post 12778 history: [{"type":"Published","timestamp":"2026-07-20T12:04:27Z"}]; BleepingComputer: first attempts ''observed on Friday'' (2026-07-17).'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12778
    fix: Leave (append-only) or confirm the site renders the Correction beside it; no entry-body change needed.
    class: imprecision
- entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
  verdict: imprecision
  defects:
  - where: summary, headline
    claim: VulnCheck reported on 2026-07-28 that it has observed attackers gaining initial access to Langflow through CVE-2026-0769, harvesting credentials, deploying cryptominers and attempting lateral
      movement
    defect: VulnCheck states the observed initial-access exploits target both CVE-2026-0769 and CVE-2026-5027; the summary attributes the whole chain to CVE-2026-0769 alone (the body discloses the second
      CVE, the summary and headline do not).
    ground_truth: '"With LangFlow, we''ve seen attackers gain initial access using exploits targeting both CVE-2026-0769 and CVE-2026-5027, harvest credentials, likely for services such as OpenAI and Claude,
      deploy cryptominers, and attempt lateral movement."'
    ground_truth_url: https://www.vulncheck.com/blog/state-of-exploitation-1h-2026
    fix: Say VulnCheck observed exploits targeting both CVE-2026-0769 and CVE-2026-5027, and that the post-exploitation behaviour is not split per CVE.
    class: imprecision
  - where: cves[0].affected; body 'ZDI names no affected or fixed version'; Correction section
    claim: No affected version range published (ZDI names none)
    defect: True of ZDI's advisory page, but ZDI is also the CNA and its CVE record lists Langflow 1.3.2 as an affected version (OSV derives the same single-version range). The correction removed 1.3.2
      on the ground that the advisory names none, leaving 'names no affected version' unqualified.
    ground_truth: 'CVE-2026-0769 CNA (zdi) container: affected: [{vendor: Langflow, product: Langflow, versions: [{version: ''1.3.2'', status: ''affected''}], defaultStatus: ''unknown''}]'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-0769
    fix: State that the ZDI advisory page names no version while ZDI's CVE record lists only 1.3.2 as affected (a single listed version, not a range); the 'every self-hosted instance' exposure sentence
      should say the affected range is undefined, not that none exists.
    class: imprecision
- entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
  verdict: factual-error
  defects:
  - where: 'sourcing_note; cves[0].cvss: null'
    claim: JetBrains rates the flaw critical without a numeric score
    defect: JetBrains is the CNA and its CVE record published on 2026-07-27 carries a CVSS 3.1 base score of 9.8 (CRITICAL); the 2026-09-30 correction removed a score on the ground that no citable source
      publishes one, but the CNA record does.
    ground_truth: 'CVE-2026-63077 CNA container (JetBrains): "cvssV3_1": {"baseScore":9.8,"baseSeverity":"CRITICAL","vectorString":"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"}; the JetBrains blog advisory
      itself gives only the word ''critical''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-63077
    fix: Set cves[0].cvss to "9.8" (CVSS 3.1, CNA JetBrains) and reword the sourcing note to say the vendor blog gives no number while the CNA CVE record scores it 9.8.
    class: factual-error
  - where: '## Update — 2026-08-06T04:11:48Z, first paragraph'
    claim: its advisory states it was not aware of any active exploitation of the vulnerability at the time of publishing, and that advisory has not been revised since 2026-07-27
    defect: 'No longer true: the JetBrains advisory now carries an ''August 7, 2026 update'' banner pointing to the follow-up that reports active exploitation. Also the paragraph''s ''the confirmed fact
      is exploitation itself and nothing beyond it'' is superseded by the 2026-09-30 section (KEV ransomware flag, Cadence breach). True on 2026-08-06 only.'
    ground_truth: 'Advisory top: "August 7, 2026 update: Please also see this follow-up blog post for additional guidance."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/
    fix: Reword to 'as of 2026-08-06 ... had not been revised since 2026-07-27' and mark the 'nothing beyond' sentence as the position at that date.
    class: imprecision
  - where: actions[1]
    claim: Treat any TeamCity On-Premises server that was internet-reachable and unpatched before 2026-08-05 as a compromise-assessment target
    defect: Cut-off keyed to the KEV date, but JetBrains reports exploitation since its 2026-07-27 announcement and the newest section's takeaway uses 'unpatched after 2026-07-27'; the two windows disagree
      and servers patched 07-27 to 08-05 are excluded.
    ground_truth: '"Since our initial announcement on July 27, 2026, we have received reports of active exploitation, as well as attempted exploitation, targeting unpatched TeamCity servers."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/
    fix: Use the same window (unpatched at any point after 2026-07-27) in actions[1] and the 08-06 takeaway.
    class: imprecision
  - where: actions[0]
    claim: take the server's agent-polling endpoint off any internet-reachable interface
    defect: (low confidence) JetBrains advises temporarily restricting external access to the TeamCity server and VPN/extra layer; it does not describe the agent-polling endpoint as separately closable,
      so the action narrows the vendor guidance.
    ground_truth: '"we strongly recommend temporarily restricting external access until you have done so."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/
    fix: Say restrict external access to the TeamCity server (or front it with VPN), as JetBrains advises.
    class: imprecision
- entry: 2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited
  verdict: clean
  defects: []
- entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
  verdict: factual-error
  defects:
  - where: headline; Defender takeaway paragraph; 2026-08-05 section ('Swiss and European trustees and advisers')
    claim: yielded a targeting dataset on the owners behind Swiss- and EU-administered structures
    defect: No cited source says the register's entities are Swiss- or EU-administered. The register holds entities domiciled in Liechtenstein; NZZ describes foundations 'administered by Liechtenstein trustees',
      and The Record calls Liechtenstein a wealth hub for clients worldwide. The body's 'the constituency that administers those structures is largely Swiss and European ... on the other side of the border'
      is likewise uncited.
    ground_truth: 'NZZ: "In dem Verzeichnis werden sämtliche Stiftungen, Treuhandgesellschaften und Unternehmen erfasst, die in Liechtenstein ihren Sitz haben"; also "von reichen Russen gegründet und von
      liechtensteinischen Treuhändern verwaltet".'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Say the register covers beneficial owners of Liechtenstein-domiciled companies, foundations and trusts (an internationally sourced client base), and mark the Swiss/EU fiduciary exposure as the
      entry's inference.
    class: factual-error
  - where: '## Update — 2026-09-02T04:50:00Z, Defender takeaway (updated)'
    claim: both jurisdictions' registers reach the same client population
    defect: Unsupported and uncited. The Swiss register covers Swiss companies, foundations and similar entities; the Liechtenstein register covers Liechtenstein entities. No source establishes a shared
      client population.
    ground_truth: 'NZZ (Swiss register): "Ab einer Beteiligung von 25 Prozent müssen etwa Aktien-, Kapitalgesellschaften oder Genossenschaften melden"; Liechtenstein register: entities with seat in Liechtenstein.'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Replace with a hedged statement (Swiss fiduciaries and banks may serve clients in both) or cut the sentence.
    class: imprecision
  - where: '## Update — 2026-09-02T04:50:00Z, first paragraph; updates[2] record summary'
    claim: Switzerland's own incoming Transparency Register — covering roughly 500,000 beneficial owners
    defect: The ~500,000 figure counts legal entities required to register, not beneficial owners; the cited Inside Paradeplatz text conflates them ('Namen der 500'000 tatsächlichen Besitzer'), but NZZ,
      which Inside Paradeplatz links for the figure, says 500,000 companies and foundations.
    ground_truth: 'NZZ 2025-06-13: "rund 500 000 Aktiengesellschaften, GmbH, Genossenschaften und Stiftungen sowie auch gewisse Vereine ihre «wahren» Eigentümer in das geplante Transparenzregister eintragen".'
    ground_truth_url: https://www.nzz.ch/wirtschaft/rund-500-000-gesellschaften-sollen-kuenftig-ihre-wahren-eigentuemer-in-einem-nationalen-register-offen-legen-ld.1888659
    fix: Write 'roughly 500,000 legal entities' (and cite NZZ for the figure).
    class: imprecision
  - where: body paragraph 2 ('The government's own timeline')
    claim: because detection was human and internal rather than telemetry-driven
    defect: The release only says irregularities 'fell' to the Office of Justice during 30 July; it does not say how they were detected. NZZ separately says the thousands of requests during the night triggered
      no alarm, which says nothing about how the irregularity was found.
    ground_truth: '"Im Verlauf des Tages vom 30. Juli 2026 fielen beim Amt für Justiz Unregelmässigkeiten auf."'
    ground_truth_url: https://www.presseportal.ch/de/pm/100000148/100941487
    fix: Drop 'human and internal rather than telemetry-driven' or mark it as the entry's inference.
    class: imprecision
  - where: Defender takeaway, second lesson
    claim: taking four unrelated e-government services offline "as a precaution" is what happens when blast radius cannot be proven quickly from telemetry
    defect: The government gives the reason as precaution and careful checking for possible security gaps, not inability to prove blast radius; the causal reading is the entry's own inference stated as
      fact.
    ground_truth: '"aus Sicherheitsgründen und zur sorgfältigen Prüfung allfälliger Sicherheitslücken weitere Systeme als Vorsichtsmassnahme vorübergehend vom Netz zu nehmen"'
    ground_truth_url: https://www.presseportal.ch/de/pm/100000148/100941500
    fix: Phrase as 'a pattern consistent with' or cut.
    class: imprecision
  - where: updates[1] record summary (2026-09-01)
    claim: NZZ reporting from the government's own 2026-08-04 press briefing, sourced to Liechtenstein IT-office director Fabian Schmid, names the access mechanism
    defect: NZZ attributes only the no-mass-query / several-hours point to Schmid; the mechanism sentences (vulnerability in the portal or interface, new account, record-by-record queries) carry no attribution
      to the briefing or to Schmid. The section body words it correctly.
    ground_truth: '"Die Schnittstelle lässt keine Massenabfrage zu. Deshalb dauerte es mehrere Stunden ... wie der Leiter des Amts für Informatik in Liechtenstein, Fabian Schmid, vor den Medien sagte."'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Attribute only the several-hours detail to Schmid; the mechanism to NZZ's reporting.
    class: imprecision
