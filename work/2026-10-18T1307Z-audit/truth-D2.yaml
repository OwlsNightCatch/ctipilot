- entry: 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi
  verdict: factual-error
  defects:
  - where: title; headline; summary; actions[0]; main analysis
    claim: actively-exploited command-injection to root (no patch)
    defect: '''No patch'' is false today: Cisco published fixed releases (final table 2026-06-12) and a Live Protect shield; the 2026-06-26/27 sections add Mandiant detail but never correct the headline, summary, action or ''No fixed release is available''. Cisco''s advisory guidance was also to upgrade, not ''restrict management-plane access'''
    ground_truth: 'Cisco privesc advisory Fixed Releases: 20.9.9.2, 20.12.7.2, 20.15.4.5, 20.15.5.3, 20.18.3.1, 26.1.1.2 (v1.8 2026-JUN-12 "Changed advisory status from interim to final"); v1.9 2026-JUL-15 "Live Protect shield availability"'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx
    fix: Correct title/headline/summary/action/analysis to 'fixed in 20.9.9.2 / 20.12.7.2 / 20.15.4.5 / 20.15.5.3 / 20.18.3.1 / 26.1.1.2; Live Protect shield is temporary partial protection'
    class: factual-error
  - where: cves[CVE-2026-20245]
    claim: 'type: auth-bypass; vector: zero-click; auth: pre-auth; cvss: n/a'
    defect: CVE-2026-20245 is an authenticated local command injection requiring netadmin (CVSS 7.8, AV:L/PR:L); the entry's own body says netadmin is required. It was added to KEV 2026-06-09 (CWE-116) but status omits cisa-kev
    ground_truth: 'Cisco: "authenticated, local attacker to execute arbitrary commands as root ... the attacker must have netadmin privileges"; Base 7.8 CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H; KEV dateAdded 2026-06-09'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx
    fix: type priv-esc, vector local, auth post-auth, cvss 7.8, add cisa-kev
    class: factual-error
  - where: cves[CVE-2026-20127], cves[CVE-2026-20182]
    claim: 'cvss: n/a'
    defect: Both are scored by Cisco at 10.0 and both are in KEV (2026-02-25 and 2026-05-14) but statuses omit cisa-kev
    ground_truth: 'Cisco rpa / rpa2: "Base 10.0"; KEV dateAdded 2026-02-25 (20127), 2026-05-14 (20182)'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW
    fix: cvss 10.0, add cisa-kev
    class: imprecision
  - where: body; summary
    claim: a second actively-exploited zero-day in Catalyst SD-WAN Manager
    defect: '''Second'' is unsupported: Cisco''s own advisory names CVE-2026-20182 and CVE-2026-20127 as earlier exploited flaws and NCSC-CH says ''a new actively exploited zero-day'''
    ground_truth: 'NCSC-CH update 05.06.2026: "A new actively exploited zero-day (CVE-2026-20245, HIGH)"'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12579
    fix: Drop 'second'
    class: imprecision
  - where: Update 2026-06-26 and record summary
    claim: zero-day at a communications service provider from late 2025 through March 2026 — months before the patch
    defect: Mandiant dates the CVE-2026-20245 exploit to April 2026; late 2025-January and March 2026 are rogue peering events; the victim is 'a service provider', not 'communications'; Cisco's advisory is 2026-06-04
    ground_truth: 'Mandiant: "in April 2026, after establishing an SSH session with the admin account, the threat actor exploited CVE-2026-20245"; "multiple unauthorized peering connections ... From late 2025 to January 2026"; "a threat actor targeting SD-WAN infrastructure at a service provider"'
