batch: D2
run_id: 2026-10-18T1307Z-audit
entries:
- entry: 2026-05-11/cve-2026-6722-php-soap-extension-use-after-free-in-soap-glob
  verdict: factual-error
  defects:
  - where: summary
    claim: PHP SOAP extension use-after-free patched in all 8.x branches
    defect: Only the 8.2, 8.3, 8.4 and 8.5 branches received fixes; PHP 8.0/8.1 are end-of-life and unpatched, so 'all 8.x branches' overstates coverage
    ground_truth: php.net ChangeLog lists the SOAP fix only in 8.2.31, 8.3.31, 8.4.21 and 8.5.6 (each dated 07 May 2026); CVE record (CNA PHP Group) affected = PHP 8.2.*, 8.3.*, 8.4.*, 8.5.* below those versions
    ground_truth_url: https://www.php.net/ChangeLog-8.php
    fix: Say 'fixed in the supported 8.2-8.5 branches (8.2.31 / 8.3.31 / 8.4.21 / 8.5.6)'
    class: factual-error
  - where: cves[CVE-2026-7262]
    claim: 'cvss: "6.3"; type: rce'
    defect: The CVE record scores CVE-2026-7262 as CVSS 4.0 2.9 LOW and the flaw is a NULL-dereference crash (DoS), not RCE; 6.3 is the figure shown on the GHSA page, and the conflict between the two PHP-authored records is not surfaced
    ground_truth: 'CVE record (CNA PHP Group, updated 2026-07-15): baseScore 2.9 LOW, CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:L/SC:N/SI:N/SA:N/E:P; description "This allows a remote unauthenticated attacker to crash the PHP SOAP serv[er]"; GHSA page still shows "Moderate 6.3"'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7262
    fix: cvss 2.9 (note GHSA shows 6.3), type dos; same in the body line 'CVSS 4.0 6.3 Moderate' and table row
    class: factual-error
  - where: body paragraph 1 and paragraph 2
    claim: No public proof-of-concept and no in-the-wild exploitation are reported as of this run
    defect: The primary advisory itself embeds a working trigger reproducer and the fix commit adds a regression test with the trigger envelope; 'no public proof-of-concept' is wrong (no ITW report found, no KEV entry is correct)
    ground_truth: GHSA-85c2-q967-79q5 body contains a Handler/SoapServer script with the apache:Map duplicate-key envelope and says 'The attacker has high control over this memory segment ... leading to Remote Code Execution'; commit 8f228a35cb adds ext/soap/tests/GHSA-85c2-q967-79q5.phpt
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Replace with 'no in-the-wild exploitation reported; the advisory publishes a trigger reproducer'
    class: factual-error
  - where: body paragraph 1
    claim: Affected versions are PHP 8.2.0 through 8.5.5
    defect: Range spans branches and wrongly implies e.g. 8.2.31-8.4.20 are affected-and-unfixed in a single span; cited ChangeLog lists fixes only, not affected ranges
    ground_truth: 'CVE record affected: 8.2.0-<8.2.31, 8.3.0-<8.3.31, 8.4.0-<8.4.21, 8.5.0-<8.5.6'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-6722
    fix: State affected as 'below 8.2.31 / 8.3.31 / 8.4.21 / 8.5.6 in their respective branches'
    class: imprecision
  - where: CVE Summary Table, CVE-2026-6722 row
    claim: 9.5 (CVSS 4.0)
    defect: The cited GHSA shows only 'Severity High', no numeric score; 9.5 is the CNA's CVE-record score, cited elsewhere as 'NVD'
    ground_truth: 'GHSA-85c2 page: ''Severity High CVE ID CVE-2026-6722'' (no CVSS number); CVE record CNA CVSS 4.0 9.5 CRITICAL'
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Cite the CVE record/CNA for 9.5 and the GHSA for 'High'
    class: imprecision
  - where: body paragraph 2
    claim: a runtime present in essentially every Internet-exposed PHP application
    defect: ext-soap is an optional extension and only SoapServer endpoints are reachable; no source supports 'essentially every'
    ground_truth: 'GHSA-85c2: bug is in ext-soap; trigger requires SoapServer::handle() on attacker input'
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Drop the quantifier; say 'any PHP application that exposes a SoapServer'
    class: imprecision
  - where: frontmatter classification / techniques[]
    claim: (absent)
    defect: Entry carries no `classification` block and no `techniques[]` (migrated schema-1 record); a vulnerability entry needs both
    ground_truth: 'org profile: every entry carries classification {reliability, credibility}; vulnerability entries need a non-empty techniques[]'
    ground_truth_url: docs/pipeline.md
    fix: Add classification (e.g. primary vendor/CNA source, corroborated) and techniques[] (T1190) in the survivor via a changelog record
    class: imprecision
- entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
  verdict: factual-error
  defects:
  - where: summary
    claim: '#### Vulnerability class and primitive'
    defect: Summary is a markdown heading and states nothing; event_date is null although all sources date the disclosure 2026-05-07
    ground_truth: GHSA-85c2-q967-79q5 published May 7, 2026
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Write a real one-sentence summary and set event_date 2026-05-07
    class: imprecision
  - where: cves[CVE-2026-7262]
    claim: 'cvss: "6.3"; type: rce'
    defect: 'CNA CVE record: CVSS 4.0 2.9 LOW (GHSA page shows 6.3; conflict not surfaced); the flaw is a segfault DoS (body itself says ''NULL deref rather than UAF''), so type rce is wrong'
    ground_truth: 'CVE record: baseScore 2.9 LOW; "This allows a remote unauthenticated attacker to crash the PHP SOAP serv[er]"; GHSA-hmxp: "the process will segfault with a NULL pointer violation ... DoS becomes trivial"'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7262
    fix: cvss 2.9, type dos; body '(both Moderate, CVSS 4.0 6.3)' should say 7261 only
    class: factual-error
  - where: body, companion CVE paragraph
    claim: suggesting the upstream review pass that produced GHSA-85c2-q967-79q5 covered the whole apache-map handling surface
    defect: The ChangeLog only lists the three GHSAs in the same releases; CVE-2026-7261 is in SOAP_PERSISTENCE_SESSION header handling, not apache-map; 7262 also needs a typemap configured (omitted)
    ground_truth: 'ChangeLog: three separate GHSA entries under SOAP; GHSA-m33r: SOAP_PERSISTENCE_SESSION header fault; GHSA-hmxp: reachable ''when the SOAP server has a typemap configured'''
    ground_truth_url: https://www.php.net/ChangeLog-8.php
    fix: Delete the inference; add that 7262 needs SOAP typemap configured
    class: imprecision
  - where: body, Exploitation prerequisites
    claim: the SoapClient/Server pair used for reverse-direction RPC
    defect: No source says SoapClient is affected; the sentence also contradicts the preceding 'SoapServer ... is sufficient' (a SoapServer must be instantiated)
    ground_truth: GHSA-85c2 and CVE description reference only SoapServer decoding of an attacker-supplied envelope
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Remove SoapClient mention; keep 'any application that instantiates a SoapServer on untrusted input'
    class: imprecision
  - where: body, Detection concepts
    claim: 'increased `Notice: Trying to access array offset on null` or `Fatal error: Uncaught Error: Call to a member function ... on null` clustered around SOAP request handlers — failed exploitation attempts'
    defect: No source ties these PHP log messages to this bug; the documented failure symptom is a worker segfault (7262) or none
    ground_truth: 'GHSA-hmxp: ''the process will segfault with a NULL pointer dereference violation'''
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv
    fix: Remove the unsourced log signature
    class: imprecision
  - where: body, MITRE ATT&CK mapping
    claim: likely follow-on persistence path observed in prior PHP RCE incidents
    defect: No source describes post-exploitation behaviour (web shell or Unix shell) for this CVE; 'observed in prior PHP RCE incidents' is uncited. Only T1190 is source-supported
    ground_truth: GHSA-85c2 ends at 'leading to Remote Code Execution'
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Keep T1190 only or mark T1059.004/T1505.003 as analyst inference
    class: imprecision
  - where: body, Where SOAP commonly lingers
    claim: Where SOAP commonly lingers in EU public-sector estates
    defect: Uncited generalisation about EU public-sector SOAP prevalence
    ground_truth: none of the cited pages mention public-sector SOAP usage
    ground_truth_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    fix: Cite or drop
    class: imprecision
  - where: frontmatter classification / techniques[]
    claim: (absent)
    defect: Entry carries no `classification` block and no `techniques[]` (migrated schema-1 record); a vulnerability entry needs both
    ground_truth: 'org profile: every entry carries classification {reliability, credibility}; vulnerability entries need a non-empty techniques[]'
    ground_truth_url: docs/pipeline.md
    fix: Add classification (e.g. primary vendor/CNA source, corroborated) and techniques[] (T1190) in the survivor via a changelog record
    class: imprecision
- entry: 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a
  verdict: factual-error
  defects:
  - where: headline; body 'Kill chain (UAT-8616 post-exploitation TTPs)' steps 6-9
    claim: Godzilla, Behinder, and XenShell webshells deployed for persistent access
    defect: Steps 6-9 (Godzilla/Behinder/XenShell webshells, AdaptixC2/Sliver/Nimplant C2, XMRig) are attributed to UAT-8616, but Talos attributes them to other clusters exploiting CVE-2026-20133/20128/20122
    ground_truth: 'Talos: "a series of threat actors, distinct from UAT-8616, that have been observed to be exploiting a different, previously disclosed set of vulnerabilities ... CVE-2026-20133, CVE-2026-20128 and CVE-2026-20122"; for UAT-8616 on 20182: "attempted to add SSH keys, modify NETCONF configurations, and escalate to root privileges"'
    ground_truth_url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
    fix: Limit the UAT-8616 kill chain to SSH key injection, NETCONF, root escalation and ORB-network overlap; present Clusters 1-10 separately
    class: factual-error
  - where: body, Vulnerability mechanics
    claim: checks whether the device type is `VBOND` (0) or `VEDGE` (1) before requiring certificate validation
    defect: Device-type values are wrong; Rapid7's table is vEdge=1, vHub=2, vSmart=3, vBond=4, vManage=5, and the cert checks cover types 3/5 and 1. The authenticated flag is set but a Hello is still required to reach UP, contrary to 'immediately ... transitions the peering state to UP'
    ground_truth: 'Rapid7: "| 1 | vEdge ... | 2 | vHub ... | 3 | vSmart ... | 4 | vBond ... | 5 | vManage"; "the attacker must send a Hello message (Message type 5) to transition the peer to the UP state"'
    ground_truth_url: https://www.rapid7.com/blog/post/ve-cve-2026-20182-critical-authentication-bypass-cisco-catalyst-sd-wan-controller-fixed/
    fix: 'Use Rapid7''s enumeration: checks for vSmart (3), vManage (5), vEdge (1); none for vHub (2)'
    class: factual-error
  - where: body, Kill chain step 6
    claim: XenShell is a lightweight Python-based variant targeting Linux
    defect: Talos describes XenShell as a JSP-based webshell
    ground_truth: 'Talos: "ZeroZenX Labs'' proof-of-concept and accompanying JSP-based webshell which we track as \"XenShell.\""'
    ground_truth_url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
    fix: Say 'JSP-based webshell (XenShell)'; and drop 'dynamic key exchange'/'AES-128-CBC' details unless sourced
    class: factual-error
  - where: body, Background
    claim: CVE-2026-20127 (pre-auth RCE in SD-WAN Manager)
    defect: CVE-2026-20127 is a peering authentication bypass in the Controller (vSmart); Cisco's advisory is titled 'Controller Authentication Bypass' (affects Controller/Manager/Validator), not an RCE in Manager. 'joint advisory from ACSC, NCSC-UK, and Cisco Talos' is also not what the cited Talos post is
    ground_truth: 'Talos: "CVE-2026-20127, a vulnerability in Cisco Catalyst SD-WAN Controller, formerly vSmart, that allows an unauthenticated remote attacker to bypass authentication"; CISA KEV: "Cisco Catalyst SD-WAN Controller and Manager Authentication Bypass Vulnerability"'
    ground_truth_url: https://blog.talosintelligence.com/uat-8616-sd-wan/
    fix: Describe 20127 as an authentication bypass in the Controller (and Manager); cite Talos blog and ACSC hunt guide separately
    class: factual-error
  - where: body, Background
    claim: CVE-2026-20182 is that actor's sixth exploited Cisco SD-WAN vulnerability in the ongoing campaign
    defect: No source counts six; Talos ties UAT-8616 to CVE-2026-20127, CVE-2026-20182 and the (reported) CVE-2022-20775 chain
    ground_truth: 'Talos (20182 post): "UAT-8616 previously exploited a similar vulnerability in Cisco Catalyst SD-WAN Controller, CVE-2026-20127"'
    ground_truth_url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
    fix: Delete the count
    class: factual-error
  - where: body, Background
    claim: Cisco and CISA have published five previous SD-WAN vulnerability advisories with confirmed in-the-wild exploitation this year alone
    defect: Quantifier not in the cited Talos Feb post; KEV shows five earlier 2026 SD-WAN CVEs (20127, 20122, 20128, 20133 plus 2022-20775) across three Cisco advisories, not five advisories
    ground_truth: 'KEV: CVE-2022-20775 and CVE-2026-20127 added 2026-02-25; CVE-2026-20122/20128/20133 added 2026-04-20'
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: Cite KEV and state 'five earlier SD-WAN CVEs'
    class: imprecision
  - where: body, Kill chain closing paragraph
    claim: The 10+ additional clusters (#1–#10 in Talos's taxonomy)
    defect: 'Talos lists exactly Clusters #1 to #10; they also run C2 implants and a credential stealer, and ''skip the version-downgrade chain'' is not stated'
    ground_truth: 'Talos: "So far, Talos has observed the following clusters of malicious activity ...: Cluster #1 to Cluster #10."'
    ground_truth_url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
    fix: Say 'ten clusters'
    class: imprecision
  - where: body, Hunt and detection concepts
    claim: SD-WAN Controller-to-Controller peering shows as VHUB-type — flag unexpected vHub entries
    defect: 'Wrong: vSmart peers are type 3 (vManage 5); vHub is the type claimed by the exploit. Cisco''s own check is ''state:up'' with ''challenge-ack 0'' in `show control connections detail`, not `show sdwan control connections`'
    ground_truth: 'Cisco rpa2: "To check ... the presence of state:up and no challenge-ack ... use the commands show control connections detail or show control connections-history detail"'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW
    fix: Use Cisco's documented command and discriminator
    class: factual-error
  - where: body, Kill chain items 4 and 8; ATT&CK ids
    claim: 'T1562.001 Impair Defenses: Disable or Modify Tools ... T1070.002 Indicator Removal: Clear Linux or Mac System Logs'
    defect: T1562, T1562.001 and T1070.002 are revoked in ATT&CK v20 (-> T1685 / T1685.006); a software version downgrade is not 'disable or modify tools'
    ground_truth: 'attack/enterprise-attack.json: T1562.001 revoked_by T1685; T1070.002 revoked_by T1685.006'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW
    fix: Map to active ids (T1685 / T1685.006) or drop the version-downgrade mapping
    class: imprecision
  - where: body, Hardening
    claim: the authentication-bypass function is in the control-plane peering path that cannot be disabled without breaking SD-WAN functionality
    defect: Rationale is in no source; Cisco only says there are no workarounds
    ground_truth: 'Cisco rpa2: "There are no workarounds that address this vulnerability."'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW
    fix: Delete the rationale
    class: imprecision
  - where: evidence[0]; summary
    claim: Background.
    defect: evidence quote is the single word 'Background.' (publisher 'ctipilot v2 brief (migrated)'), not a passage of any cited page; summary is a stub 'Background. Cisco SD-WAN has been a sustained exploitation target since 2023.'
    ground_truth: no cited page contains this quote
    ground_truth_url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
    fix: Replace evidence with a verbatim Talos/Cisco quote and write a real summary
    class: imprecision
  - where: frontmatter classification / techniques[]
    claim: (absent)
    defect: Entry carries no `classification` block and no `techniques[]` (migrated schema-1 record); a vulnerability entry needs both
    ground_truth: 'org profile: every entry carries classification {reliability, credibility}; vulnerability entries need a non-empty techniques[]'
    ground_truth_url: docs/pipeline.md
    fix: Add classification (e.g. primary vendor/CNA source, corroborated) and techniques[] (T1190) in the survivor via a changelog record
    class: imprecision
- entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  verdict: factual-error
