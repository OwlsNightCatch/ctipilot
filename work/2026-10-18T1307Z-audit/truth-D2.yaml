  same_finding: true
  survivor: 2026-05-11/cve-2026-6722-php-soap-extension-use-after-free-in-soap-glob
  current_state: 'PHP ext-soap, three flaws fixed together on 2026-05-07. CVE-2026-6722: use-after-free (CWE-416) of a stale SOAP_GLOBAL(ref_map) pointer when an apache:Map has duplicate keys; GHSA-85c2-q967-79q5 (vendor, published 2026-05-07) severity High; CVE record (CNA PHP Group, updated 2026-07-23) CVSS 4.0 9.5 CRITICAL (CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H); advisory says attacker control of the freed memory leads to RCE [https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5, https://cveawg.mitre.org/api/cve/CVE-2026-6722]. CVE-2026-7261: UAF in SoapServer SOAP_PERSISTENCE_SESSION handling when a header handler returns false or throws; GHSA-m33r-qmcv-p97q Moderate 6.3, CVE record CVSS 4.0 6.3 MEDIUM; ''unlikely that the attacker will be able to control the freed memory segment, though it is not impossible'' [https://github.com/php/php-src/security/advisories/GHSA-m33r-qmcv-p97q, https://cveawg.mitre.org/api/cve/CVE-2026-7261]. CVE-2026-7262: NULL dereference in the apache:Map decoder with a missing <value>, reachable when the SOAP server has a typemap configured; segfault/DoS only; the CVE record (updated 2026-07-15) scores CVSS 4.0 2.9 LOW (E:P) while the GHSA page still shows Moderate 6.3 [https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv, https://cveawg.mitre.org/api/cve/CVE-2026-7262]. Affected/fixed per branch (all three CVEs): PHP 8.2.* below 8.2.31, 8.3.* below 8.3.31, 8.4.* below 8.4.21, 8.5.* below 8.5.6; fixed 8.2.31 / 8.3.31 / 8.4.21 / 8.5.6, each released 07 May 2026 [https://www.php.net/ChangeLog-8.php]; 8.0/8.1 not listed (end of life). Exploitation: not in CISA KEV (catalogue 2026.10.16); no in-the-wild report found; GHSA-85c2 embeds a trigger reproducer and the fix commit adds a regression test [https://github.com/php/php-src/commit/8f228a35cb].'
  facts_only_in_duplicates:
  - fact: Fix is Z_TRY_ADDREF_P(data) before zend_hash_index_update in soap_add_xml_ref() plus ZVAL_PTR_DTOR on the ref_map hash (duplicate 1b)
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    verified: true
    source_url: https://github.com/php/php-src/commit/8f228a35cb
    passage: "+\t\tZ_TRY_ADDREF_P(data); ... zend_hash_init(SOAP_GLOBAL(ref_map), 0, NULL, ZVAL_PTR_DTOR, 0);"
  - fact: CVE-2026-7261 needs a SoapServer using SOAP_PERSISTENCE_SESSION (less common) (1b)
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    verified: true
    source_url: https://github.com/php/php-src/security/advisories/GHSA-m33r-qmcv-p97q
    passage: SOAP_PERSISTENCE_SESSION allows to persist the SOAP handler object between requests using the session storage.
  - fact: CVE-2026-7262 reaches a NULL dereference rather than a UAF (1b)
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    verified: true
    source_url: https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv
    passage: the process will segfault with a NULL pointer dereference violation. Under the described circumstances, DoS becomes trivial
  - fact: ATT&CK T1190 initial access via SOAP POST (1b)
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    verified: true
    source_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    passage: leading to Remote Code Execution (SoapServer::handle on attacker envelope)
  - fact: ATT&CK T1059.004 / T1505.003 post-exploitation shell / web shell 'observed in prior PHP RCE incidents' (1b)
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    verified: false
    source_url: https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
    passage: advisory ends at 'leading to Remote Code Execution'; no post-exploitation behaviour is described
  - fact: Affected versions 'PHP 8.2.0 through 8.5.5' (1a; same wording in both table rows)
    entry: 2026-05-11/cve-2026-6722-php-soap-extension-use-after-free-in-soap-glob
