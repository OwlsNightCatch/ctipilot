  - where: summary; sources[2].publisher
    claim: CISA Emergency Directive ED-26-03 issued 2026-05-14
    defect: ED 26-03 was issued 2026-02-25 (updated 2026-03-11) and names CVE-2026-20127 and CVE-2022-20775; CVE-2026-20182 reached it through the 2026-05-14 KEV listing, not a new directive
    ground_truth: 'CISA ED 26-03 page: "Original Issuance Date: February 25, 2026"; "Updated March 11, 2026"; "involves the following known exploited vulnerabilities identified by Cisco:" CVE-2026-20127, CVE-2022-20775'
    ground_truth_url: https://www.cisa.gov/news-events/directives/ed-26-03-mitigate-vulnerabilities-cisco-sd-wan-systems
