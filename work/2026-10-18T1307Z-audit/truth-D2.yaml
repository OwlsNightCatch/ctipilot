- entry: 2026-05-29/forticlient-ems-cve-2026-35616-actively-exploited-to-push-ek
  verdict: factual-error
  defects:
  - where: frontmatter cves[].cvss; summary
    claim: CVSS 9.1
    defect: 9.1 is Fortinet's temporal score; the vendor base score is 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)
    ground_truth: 'Fortinet PSIRT: ''CVSSv3 Score 9.8 CVSSv3 Temporal Score 9.1''; NVD (Fortinet CNA): 9.8 CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H'
    ground_truth_url: https://fortiguard.fortinet.com/psirt/FG-IR-26-099
    fix: cvss 9.8 (temporal 9.1)
    class: imprecision
  - where: body paragraph 1
    claim: The vulnerable code path trusts the `X-SSL-CLIENT-VERIFY` HTTP header set by a fronting reverse proxy or load balancer instead of validating client-certificate state itself
    defect: 'No fronting proxy is involved: EMS''s own Apache mod_ssl sets the trusted WSGI variables; the Django middleware also accepts user-supplied X-SSL-CLIENT-VERIFY / X-SSL-CLIENT-CERT headers and checks the chain by DN strings only'
    ground_truth: 'Bishop Fox: "The Django authentication middleware accepts client certificate information from both trusted WSGI environment variables (set by Apache mod_ssl) and user-controllable HTTP request headers, and Apache was never configured to strip the user-controllable variants."'
    ground_truth_url: https://bishopfox.com/blog/api-authentication-bypass-in-forticlient-ems-7-4-5-7-4-6-cve-2026-35616
    fix: Describe the Django/Apache header-trust and DN-only chain validation per Bishop Fox
    class: factual-error
  - where: summary; body paragraph 1
    claim: as a fake FortiEndpoint_Patch.exe signed under the legitimate fortitray.exe parent
    defect: 'Nothing is described as signed; the payload is launched on VPN tunnel establishment via a Remote Access Profile on_connect script: fortitray.exe or ipsec.exe -> cmd.exe -> powershell.exe -> FortiEndpoint_Patch.exe'
    ground_truth: 'AW: "fortitray.exe or ipsec.exe └── cmd.exe └── powershell.exe (download script) └── FortiEndpoint_Patch.exe (credential stealer)"'
    ground_truth_url: https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/
    fix: Replace 'signed under' with the process lineage
    class: factual-error
  - where: summary; body paragraph 1
    claim: EKZ copies itself into Chromium/Gecko browser-profile directories ... to clear elevation-validation checks, then dumps encrypted credential and cookie stores via `nss3.dll`; managed endpoints need browser-profile-write hunts
    defect: For Chromium EKZ copies itself into the browser's Application\ directory (install path) to pass Elevation Service path validation; nss3.dll is used for Firefox/Gecko stores only; the log goes to ProgramData; profile-directory write hunts would miss it
    ground_truth: 'AW: "copies itself into the browser''s Application\ directory, and relaunches from that path to pass Chromium Elevation Service path validation"; "For Firefox and Gecko-family browsers, the stealer locates nss3.dll"'
    ground_truth_url: https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/
    fix: Hunt for executables created in browser Application\ directories and ProgramData staging
    class: factual-error
  - where: body, Why it matters to us
    claim: FortiClient EMS is widely deployed across Swiss federal and cantonal network-security estates and across EU public-sector networks.
