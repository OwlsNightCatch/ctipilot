  current_state: 'TWO DISTINCT FINDINGS sharing CVE mentions. (A) CVE-2026-20182 finding = entries 2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a and 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre (same finding, survivor 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre). (B) CVE-2026-20245 finding = entries 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi and 2026-06-26/cisco-catalyst-sd-wan-manager-cve-2026-20245 (same finding, survivor 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi). 20245 builds on 20182 (Cisco: netadmin obtained via 20182/20127) but is a separate CVE/advisory/KEV listing. States: (A) CVE-2026-20182: peering-authentication bypass in the vdaemon DTLS control plane (UDP/12346); Cisco advisory cisco-sa-sdwan-rpa2-v69WY2SW first published 2026-05-14, v2.0 2026-06-16; affects Cisco Catalyst SD-WAN Controller (vSmart), Manager (vManage) and Validator (vBond) regardless of configuration; CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H), CWE-287; no workarounds; Cisco aware of limited exploitation in May 2026 [https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW]. Fixed releases (first fixed): 20.9 -> 20.9.9.1; 20.10/20.11 -> 20.12.7.1; 20.12 -> 20.12.5.4 / 20.12.6.2 / 20.12.7.1; 20.13/20.14 -> 20.15.5.2; 20.15 -> 20.15.4.4 / 20.15.5.2; 20.16/20.18 -> 20.18.2.2; 26.1 -> 26.1.1.1; earlier than 20.9 migrate [https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW]. KEV: added 2026-05-14 (CWE-287; ED 26-03 referenced) [https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json]; CISA ED 26-03 itself was issued 2026-02-25 (updated 2026-03-11) [https://www.cisa.gov/news-events/directives/ed-26-03-mitigate-vulnerabilities-cisco-sd-wan-systems]. Talos (2026-05-14) clusters the exploitation under UAT-8616 with high confidence: SSH key injection, NETCONF changes, root escalation, infrastructure overlapping ORB networks [https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/]. Rapid7 (discoverer) shows the vHub (device type 2) CHALLENGE_ACK bypass, MSG_VMANAGE_TO_PEER key injection into vmanage-admin authorized_keys and NETCONF on TCP/830 against a Controller [https://www.rapid7.com/blog/post/ve-cve-2026-20182-critical-authentication-bypass-cisco-catalyst-sd-wan-controller-fixed/]. Separate actors (''distinct from UAT-8616'') exploit CVE-2026-20133/20128/20122 (KEV 2026-04-20) since March 2026 in Clusters #1-#10 using the ZeroZenX PoC [https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/]. (B) CVE-2026-20245: authenticated local privilege escalation / command injection to root in the CLI of Cisco Catalyst SD-WAN Controller, Manager and Validator (needs netadmin: valid credentials or exploitation of CVE-2026-20182 / CVE-2026-20127); CVSS 3.1 7.8 (AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H), CWE-116; advisory cisco-sa-sdwan-privesc-4uxFrdzx first published 2026-06-04, last updated 2026-07-21; Cisco observed limited cases of configuration pushes to edge devices; exploitation known from June 2026 per Cisco [https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx]. Fixed (first fixed, final table 2026-06-12, 1.10 on 2026-07-21): 20.9.9.2, 20.12.7.2, 20.15.4.5, 20.15.5.3, 20.18.3.1, 26.1.1.2; no workaround, Live Protect shield (2026-07-15) gives temporary partial protection [https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx]. KEV: added 2026-06-09, CWE-116 [https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json]. Mandiant (2026-06-24): zero-day at a service provider, exploit via ''request tenant-upload tenant-list ... evil_tenant.csv'' in April 2026 after rogue peering/SSH as vmanage-admin (late 2025-January and March 2026; connection to CVE-2026-20127/20182 only ''possible'', Cisco confirmed March connections did not use 20182), troot UID-0 account, deletion of own files/config restore, no actor named [https://cloud.google.com/blog/topics/threat-intelligence/zero-day-exploitation-cisco-catalyst-sd-wan-manager]. NCSC-CH advisory 12579 (edited 2026-06-05 and 2026-06-25) [https://security-hub.ncsc.admin.ch/#/posts/12579].'
