  same_finding: true
  survivor: 2026-06-30/cve-2026-48558-simplehelp-rmm-oidc-sso-authentication-bypass
  current_state: 'SimpleHelp CVE-2026-48558 (CNA VulnCheck, record published 2026-06-12, discoverer Horizon3.ai 2026-06-12): OIDC authentication bypass, identity tokens accepted without verifying their cryptographic signature (CWE-347); remote unauthenticated attacker obtains a technician session, ''in some configurations ... may also allow bypass of MFA''; CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H), CVSS 4.0 9.5 [https://cveawg.mitre.org/api/cve/CVE-2026-48558]. Vendor: affects 5.5.15 and earlier and some 6.0 pre-releases; needs an OIDC Authentication Service plus a Technician Group with it and ''Allow group authenticated logins'' (disabled by default for new Groups); fixed in 5.5.16 (build 20260526) and the latest 6.0 release candidate (6.0 RC2); servers without OIDC groups cannot be exploited; IP-restrict technician logins [https://guides.simple-help.com/kb---security-vulnerabilities-05-2026, https://simple-help.com/security/simplehelp-security-update-2026-05]. Horizon3: attacker creates a new Technician; SimpleHelp-enforced MFA bypassed because on first login technicians self-register an MFA method; nearly 14,000 exposed servers, roughly 7.2% of a random sample use the vulnerable OIDC method; IOCs = unfamiliar technician names/emails and server.log lines [https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/]. Exploitation: CISA KEV added 2026-06-29 (CWE-347, due 2026-07-02, ransomware use Unknown) [https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json]; Blackpoint (via BleepingComputer 2026-06-29) observed a technician session on an internet-facing server followed by the TaskWeaver Node.js loader (jquery.js via node.exe) and Djinn Stealer, no persistence claim [https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-simplehelp-flaw-deploy-new-djinn-infostealer-taskweaver-malware/, https://blackpointcyber.com/blog/a-djinn-in-the-machine-taskweavers-node-js-intrusion-chain/].'
  facts_only_in_duplicates:
  - fact: 'Horizon3 IOC guidance: Administration -> Technicians -> Show Group Authenticated Users; server.log lines (5a)'
