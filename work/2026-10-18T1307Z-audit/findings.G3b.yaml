    publisher: US Department of Justice
    date: '2026-10-13'
    role: primary
  discovery_trace: 'first seen at: crowdstrike (slice record), WebFetch https://www.crowdstrike.com/en-us/blog/category.counter-adversary-operations/ (displayed 2026-10-13) → primary: https://www.crowdstrike.com/en-us/blog/fbi-disrupts-famous-chollima-operation-with-crowdstrike-assistance/ → pivot (outbound link in the post): https://www.justice.gov/opa/pr/justice-department-announces-coordinated-actions-combat-north-korean-remote-it-worker'
  summary: 'CrowdStrike says that in late September 2026 it worked with the FBI to disrupt several US laptop farms run for FAMOUS CHOLLIMA, the DPRK-nexus cluster that places remote IT workers at employers under stolen or fabricated identities. The DOJ release of 2026-10-13 describes Operation Lonestar Roundup (searches at more than 40 Texas residences on 21-25 September, about 187 laptops and KVM devices seized), an indictment of 14 individuals with two arrests, a scheme that affected more than 70 US companies and about USD 3 million in revenue, and an FBI public service announcement with mitigation guidance. CrowdStrike adds tradecraft detail: operatives file fraudulent police reports claiming a laptop was stolen so replacements ship to farm addresses, route devices through IT staffing firms, install remote-access hardware and software on farm laptops and try to hide the RMM tools; since May 2026 they spoof device hashes (a video capture card presented as a webcam) and reuse the same disguised device across several victim organizations. Dozens of victim organizations spanning aerospace, energy, financial services, healthcare, cybersecurity, defense engineering and government technology were identified; CrowdStrike expects the disruption to have only local, short-lived effect. Its hiring-review indicators include reuse of phone numbers, emails, bank accounts or resume text across profiles, remote-computing tools (Astrill VPN, AnyDesk, OBS Studio, PiKVM), mismatched shipping and residential addresses and logins from time zones that do not match the stated location.'
  region_nexus: United States (farms, victims); the identity-fraud and device-shipping pattern applies to any employer or IT supplier that hires remote contractors, including Swiss public-sector suppliers.
