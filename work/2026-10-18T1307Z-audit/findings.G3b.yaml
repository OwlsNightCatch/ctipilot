  extended_notes: 'Admiralty suggestion B1 (two independent first-hand analyses: CrowdStrike from the actor''s open directories, AhnLab from exposed consoles and a lab reproduction). Attribution is unresolved; the Telegram handle in CrowdStrike''s report is explicitly ''cannot definitively associate''. Exposure: any internet-facing ActiveMQ broker with OpenWire reachable and unpatched for CVE-2023-46604, any upload function that stores executable content under a web root, any Magento/Adobe Commerce instance on a StyleSmuggler-vulnerable build. Detection: ASEC says the tool uses nmap, nxc and Impacket plus curl, so no single string is reliable; hunt for a compressed chain on one source (service discovery, one exploit, command execution, then SMB/RDP/Kerberos activity to several internal hosts) in web access logs, firewall/connection logs, authentication logs and server EDR process-creation telemetry; for a post-hoc check, look for RDP relay scripts, JVM heap-dump credential scraping and a Linux implant downloader on exposed hosts. Triage: the same tools are used by sanctioned penetration tests and attack-surface scanners; ASEC states a User-Agent alone is not proof, so the discriminators are authorization (a scheduled engagement), source address, and whether exploitation and lateral movement follow discovery within minutes. Related lead from THN''s article: ZenoX''s SCARLET LOOP report (agentic credential-stuffing platform, Brazilian loyalty and gift-card platforms, 12,277,358 credentials tested) - THN-relayed, not fetched at the primary. The same week SOCRadar documented CyberXero (separate item): AI-agent orchestration in intrusion operations is now documented from two unrelated operators, both discovered through exposed open directories.'
