  - quote: Any script tag that is not required should be removed to reduce risk
    attribution: Report URI (Scott Helme)
    source_url: https://blog.report-uri.com/abandoned-analytics-domain-funnels-store-visitors-to-darksword-iphone-exploits/
  extended_notes: 'Admiralty suggestion B2 (one first-hand research vendor with a commercial product in the same space; THN relays it). Domain names are in the source''s IOC block and deliberately not reproduced here. Relationship to the P7 DarkSword item: independent delivery-vector finding for the same kit; both cite DarkSword''s March 2026 documentation by Google Threat Intelligence Group. Detection concept: inventory every third-party script on public sites (CSP reports, a script inventory crawl) and flag scripts whose host domain changed registrar or registration date, or whose content hash changed; web server logs cannot see this, the browser must. Hardening: remove unused tags, use subresource integrity where a script is static, restrict script-src with a CSP allowlist.'
- title: 'QuartzLine (Mandiant: CLOUDHAZE): an EV-signed, working PDF viewer with a hidden backdoor, spread through Google Ads and redirectors, is pushing a Chrome-data stealer and a second-stage RAT in customer environments; a blocked connection still means an infected device'
  sources:
  - url: https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/
    publisher: Expel
    date: '2026-10-16'
    role: primary
