  summary: 'Microsoft''s annual Digital Defense Report (reporting period July 2025 to June 2026, released 2026-10-01) frames risk as interconnected: identities, software supply chains, partners and AI agents are trust paths along which one compromise travels. Its next-year threat assessment names open-source supply-chain compromise, attacks on edge devices and AI as a force multiplier; its ten priorities start with leadership-level reporting of identity exposure, patch latency and dwell time and with identity as the primary control plane (passkeys, phishing-resistant MFA, reduced privilege, governed non-human identities, rapid token and session invalidation). Nation-state section: Chinese and Russian actors are increasingly exploiting identity infrastructure directly (token replay, service-principal abuse); Microsoft''s nation-state notification data puts government at 10% of sector targeting overall (IT and research each 20%), Switzerland at 2% of Russia-targeted countries, and Switzerland with 20 observed events in its European top ten. Cybercrime section (Microsoft Defender telemetry and leak sites): Qilin led leak-site victims at 16.4% (+386%), while Akira was the most active family in Defender-detected events (22%, +150%, Qilin 14%); Microsoft''s impacted-country table shows Switzerland at 59 events against 29 the year before (+103%), Germany 222 against 59 and Italy 135 against 48, and its industry table shows government agencies and services at 133 events against 57. The report cautions that leak-site data can be selective. Public-sector recommendations include shared services and federated SOC models instead of agency-by-agency builds, bounded-autonomy governance for agents before they proliferate, and collective-defence sharing under legal safe harbours.'
  region_nexus: Global with a Europe breakdown; Switzerland appears in the European activity top ten, the Russia-targeted-country table (2%) and the ransomware impacted-country table (59 events, +103%).
