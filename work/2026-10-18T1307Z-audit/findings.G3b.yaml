  discovery_trace: 'first seen at: kela-cyber (slice record), `extract https://www.kelacyber.com/resources/research/` → https://www.kelacyber.com/resources/research/silent-ransom-group-leak-analysis/ (page date 2026-10-14) → pivot: WebSearch ("Luna Moth Files" Silent Ransom Group leak chats Rocket.Chat) → https://blog.checkpoint.com/security/how-luna-moth-runs-data-extortion-like-a-business/ and https://www.infosecurity-magazine.com/news/luna-moth-leaks-ransomware-playbook/'
  summary: 'Around 2026-10-05 an anonymous onion site, ''The Luna Moth Files'', claimed to publish internal material of Silent Ransom Group (SRG, also Luna Moth and UNC3753): chat exports, a vishing script, screenshots and a purported fake CV. Nobody has established who published it; Check Point treats every claim as unverified unless independently backed, and KELA says authenticity and completeness remain unverified. Check Point finds no new exploit or malware but a segmented operation: researchers and persona builders prepare business context, callers establish authority, technical participants support remote sessions and data access, negotiators and payment handlers monetize; the vishing script tells the caller to watch a separate group chat during the remote session and relay changes in the victim''s behavior, implying a second operator on the endpoint while the caller keeps the victim calm, and the chats reference servers for 3CX telephony. KELA analysed 5,692 Russian-language messages (August 2025 to September 2026), reports a staged negotiation pipeline, a parallel ''Sleepless Threat'' identity proposed in September to distance activity from SRG, 27 negotiations marked as closed with about USD 207 million in stated amounts (the label does not confirm payment) and discussion of recruiting US-based agents to enter law firms posing as IT staff; these are KELA''s readings of unverified chats. SRG targets US law firms and professional services; the transferable detail is the help-desk and data-migration impersonation workflow, a remote session framed as a security check, and the pre-call credibility building with long-lived domains and purchased people-data lists.'
  region_nexus: United States (law firms, professional services). Transferable to any organization whose staff accept IT-support calls; Switzerland is not named.
