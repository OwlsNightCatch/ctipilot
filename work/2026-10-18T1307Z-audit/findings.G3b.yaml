- title: 'P7 DarkSword: iVerify documents a modified iOS exploit-kit implant that builds the keychain dump on the phone, polls its server every 15 seconds and steals wallet data, with on-device forensic artifacts'
  sources:
  - url: https://www.iverify.com/blog/darksword-variant-threat-research
    publisher: iVerify Threat Intelligence Team
    date: '2026-10-08'
    role: primary
  - url: https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html
