    publisher: Rogue Authority (AI-agent-authored teardown, human-reviewed per its own note)
    date: '2026-10-09'
    role: corroborating
  discovery_trace: 'first seen at: expel (slice record), feed https://expel.com/blog/rss.xml 30 (item dated 2026-10-16) → primary: https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/ → pivot (outbound link in the Expel post): https://rogueauthority.org/quartzline-signed-pdf-viewer-zenith-backdoor'
  summary: 'Expel, from its own managed-detection customer environments, describes QuartzLine, a Windows PDF viewer written in Rust that works as advertised while a hidden ''zenith'' module gives the host a permanent identity, checks in with a command-and-control server and can run any Windows command in a hidden window or tamper with Chromium-profile data; Expel says Mandiant tracks it as CLOUDHAZE. The installer is signed with an extended-validation certificate issued to an unrelated Guangzhou telecom-technology company, since revoked by the CA. Public sandboxes score it low-risk or clean and the one public teardown (Rogue Authority, 2026-10-09) saw only ''nothing to do'' replies, but in Expel''s customer environments the operator does send commands: in one timeline a user downloaded the installer on 22 September from cloud storage linked by a referring site, a Chrome browsing-history archive was uploaded on 29 September, a script replaced the build on 9 October and a second-stage RAT with a second scheduled task arrived on 10 October; in another environment the RAT fetched a third payload the same day. Expel confirmed Google Ads clicks in two cases and a redirector domain in at least four, and says users were searching for things like a consent form or a wallpaper rather than a PDF viewer. The first wave hit its queue on 9 October when the second-stage RAT was pushed to infected hosts across several customers at once, and CLOUDHAZE detections have since fired dozens of times across industries. The defender-relevant point is eviction: DNS or proxy blocks on the command-and-control domains are only partial, because the host keeps retrying through its scheduled tasks and, in at least one case, no EDR agent covered the device, so browser-stored passwords, cookies and session tokens on any host that tried to connect should be treated as exposed.'
  region_nexus: Global; cross-industry customers of one MDR provider, no Swiss-specific reporting. Malvertising-delivered trojanized utilities reach any desktop where users can install software.
