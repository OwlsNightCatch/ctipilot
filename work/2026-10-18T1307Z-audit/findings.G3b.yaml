    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html
  extended_notes: 'Admiralty suggestion B2 (one first-hand lab; THN and eSecurity Planet relay it with context). Not covered as its own entry; DarkSword appears only as a toolset mention in 2026-09-30/star-blizzard-redflick-cosmicpulse-single-click-chain and 2026-09-13/gtg-20006-anthropic-russia-ai-orchestrated-espionage. Exposure: iPhones and iPads on iOS 18.4 to 18.7.x that browse the web, including personal devices that reach corporate mail or SSO; check MDM inventory for devices still on iOS 18. Detection: mobile-EDR or MDM telemetry of Safari visiting a page that loads a hidden exploit frame and the process-injection chain into SpringBoard; on seized or backed-up devices, the artifacts above under /private/var/tmp; network telemetry for HTTP/1.0 POST tasking polling at 15 s intervals with a hard-coded iPhone User-Agent (iVerify). Post-patch check: updating iOS stops exploitation but not theft already done; iVerify''s guidance and eSecurity Planet both say to treat a suspected infection as a device incident plus a possible account compromise (revoke sessions, rotate keychain-held credentials from a clean device).'
- title: 'Abandoned third-party script domains re-registered: an operator collects dead analytics and lead-gen tag domains, redirects store visitors through traffic brokers and delivers the DarkSword iOS chain to Safari visitors on iOS 18.4 to 18.7.2'
  sources:
  - url: https://blog.report-uri.com/abandoned-analytics-domain-funnels-store-visitors-to-darksword-iphone-exploits/
    publisher: Report URI (Scott Helme)
    date: '2026-10-09'
    role: primary
  - url: https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html
    publisher: The Hacker News
    date: '2026-10-11'
    role: corroborating
  discovery_trace: 'first seen at: iverify-blog (slice record), WebSearch ("P7 DarkSword" iOS spyware variant iVerify) → https://www.esecurityplanet.com/threats/news-darksword-iphone-keychain-wallet-theft/ names the Report URI finding → pivot: https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html (outbound link) → primary: https://blog.report-uri.com/abandoned-analytics-domain-funnels-store-visitors-to-darksword-iphone-exploits/'
  summary: 'Report URI reports that a defunct Czech e-commerce analytics startup let its tag domain expire and someone re-registered it on 2026-09-15; stores whose themes still carry the old script tag now load a roughly 2 KB redirector that cloaks itself from crawlers, headless browsers, datacentre and VPN addresses, profiles the visitor and, for viable targets, returns a forward URL. Report URI found the same kit on a second dead lead-generation SDK domain (re-registered in August) and on a domain injected into hacked WordPress sites, and concludes the operator is collecting dead domains and turning them into traffic. Visitors are bounced through a no-referrer meta refresh to traffic brokers and sold on to an investment-scam page, an online casino and a fake AI crypto-trading site; the last loads a hidden page that checks for Safari on iOS 18.4.0 to 18.7.2 and then runs the DarkSword exploit chain without interaction (Report URI identified it as DarkSword from Google''s published hunting rule, matching source-path artifacts and an unused helper; it has not tested the recovered chain against real devices). The recovered implant differs from Google''s documented GHOSTBLADE/GHOSTKNIFE/GHOSTSABER families, includes a remote-control backdoor and targets SMS, contacts, call history, photos, Health data, location, saved Wi-Fi passwords and wallet files for more than 25 crypto apps; Report URI assesses a financial motive and has not attributed an operator. The hardening point for website owners is general: any third-party script tag that is no longer needed is a standing risk because the domain behind it can lapse.'
  region_nexus: Global; online stores loading the abandoned tag are the entry point, iPhone visitors the target. Swiss public websites with legacy third-party tags (analytics, lead-gen, survey widgets) share the exposure class.
