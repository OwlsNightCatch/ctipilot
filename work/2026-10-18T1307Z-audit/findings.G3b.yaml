  extended_notes: 'Admiralty suggestion B2 (single first-hand vendor report; THN and Security Affairs rewrite it). Delta for the existing WP2Shell entry 2026-07-18/wordpress-core-wp2shell-preauth-rce-chain-cve-2026-63030 (update_target candidate): mass exploitation in October by an AI-orchestrated broker, with post-exploitation artifacts (rogue admin naming pattern, plugin directory pattern, WSO web shell). Exposure: WordPress core below the 2026-07-17 fixed releases for the WP2Shell chain (7.0.2, 6.9.5, 6.8.6 per the store''s 2026-07-18 entry), Magento/PrestaShop storefronts, Redis reachable from the internet. Detection (SOCRadar-stated): WordPress accounts matching wp2_ followed by eight hex characters; plugin directories matching wp2shell_ plus eight hex characters; unexpected authorized_keys entries on internet-exposed Redis hosts; outbound traffic to a Cobalt Strike team server. Post-patch check: a patched WordPress can still hold a rogue administrator and web-shell plugin planted before the update. Hardening lever for AI agents: SOCRadar advises treating agent session logs like credential logs and addressing refusals-bypass by session-reset at the infrastructure layer, not the model.'
