  extended_notes: 'Admiralty suggestion A1 for Microsoft''s own telemetry (Resecurity independently bought a licence and mapped the backend). Credibility of the Swiss-brand angle is inferential. Detection concept (Microsoft-stated hooks): a Global Administrator sign-in to a tenant followed by self-provisioning of the PnP Management Shell service principal and grants of Graph permissions such as AppCatalog.ReadWrite.All; application-only sign-ins that reset passwords silently or assign licences; mass SharePoint/OneDrive storage use by newly consented applications; device-code authentication completing for users who never initiated it; Defender names listed by Microsoft for Entra ID Protection (atypical travel, malicious IP, password spray). Hardening: phishing-resistant MFA and passkeys, Conditional Access scoped to privileged roles, restricting MFA/passkey registration to trusted locations, auditing application credentials and service principals in education-type tenants. Companion post (Microsoft On the Issues) adds the investigative chain: Japan''s National Police Agency alerted Microsoft in late 2025; partners named include the Japan Cybercrime Control Center, Resecurity, Cloudflare, Oracle, Proofpoint and TRM Labs.'
- title: 'ANNUAL REPORT - Microsoft Digital Defense Report 2026 (July 2025 to June 2026): identity is the control plane; edge-device and open-source supply-chain compromise are the next-year threats; Microsoft-detected ransomware events doubled in Switzerland and government-sector events more than doubled'
