    publisher: eSecurity Planet
    date: '2026-10-12'
    role: corroborating
  discovery_trace: 'first seen at: iverify-blog (slice record), `url --direct https://www.iverify.com/blog` → https://www.iverify.com/blog/darksword-variant-threat-research (extract date 2026-10-08) → primary (no pivot needed) → corroboration: WebSearch ("P7 DarkSword" iOS spyware variant iVerify) → https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html and https://www.esecurityplanet.com/threats/news-darksword-iphone-keychain-wallet-theft/'
  summary: 'In August 2026 iVerify investigated a DarkSword infection on a customer''s iPhone that turned out to be a variant the researchers call P7 DarkSword (after a p7_ variable prefix in the modified code). Against typical variants, P7 removes debug logging over HTTP requests and syslog, reduces process injections, uses browser localStorage to avoid re-exploiting a device, builds the keychain extraction as a JSON file on the phone (earlier variants copied the keychain database off the device for processing on attacker servers) and adds two-way command-and-control: the implant, injected into SpringBoard, polls a tasking endpoint every 15 seconds (the interval is configurable), registers, heartbeats and uploads app inventory, Notes, photos and a keychain-plus-wallet bundle. Command handlers include file listing and download, app-container enumeration, a recursive disk scan, wallet scanning and extraction for several wallet apps, Notes and Photos database collection, arbitrary JavaScript execution inside the implant runtime and a generic shell-style dispatcher. iVerify lists on-device artifacts (a keychain dump file and a completion marker under /private/var/tmp, a debug journal of the keychain phase, copies of the Apple Notes database under /private/var/tmp and disk-scan output files) that a mobile forensics workflow can check, and says the P7 authors understood the code they changed, unlike many AI-assisted variants it sees. Context from THN: DarkSword was first documented in March 2026 by Google Threat Intelligence Group, iVerify and Lookout, targets iOS 18.4 to 18.7, is assessed to be a commercial kit that reached a second-hand market, and has been used by multiple actors including Star Blizzard; eSecurity Planet notes the reporting does not establish that fully updated iPhones can be compromised.'
  region_nexus: Global; previously documented DarkSword use against Saudi Arabia, Turkey, Malaysia and Ukraine; Star Blizzard (already tracked in the store) has used it against Western targets.
