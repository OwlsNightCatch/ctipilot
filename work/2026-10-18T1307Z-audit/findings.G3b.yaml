  - quote: It is EV-signed by Guangzhou Guoying Communication Technology Co., Ltd.
    attribution: Rogue Authority (AI-agent-authored teardown, human-reviewed per its own note)
    source_url: https://rogueauthority.org/quartzline-signed-pdf-viewer-zenith-backdoor
  extended_notes: 'Admiralty suggestion B2. The two sources are independent analyses of the same sample (same installer hash and overlapping C2 domains per Expel); Rogue Authority''s post states it was produced by an AI model agent with a reviewer agent, so treat it as corroboration of mechanics, not of customer impact. The Mandiant CLOUDHAZE designation is Expel''s statement; Mandiant''s own report was not located. Detection (Expel-stated behaviours): a signed PDF viewer installed under the user profile that registers a scheduled task named for update checks; later scheduled tasks and PowerShell scripts that replace the build in place and drop a second executable; a browser-history summarizer binary uploading to cloud storage; DNS lookups for new C2 domains from a host with no EDR agent. Triage: legitimate PDF utilities are common PUPs, so the discriminators Expel gives are the post-install activity (scripts replacing the binary, a second RAT, a stealer touching Chrome data) and an EV certificate whose subject does not match the product name.'
