  summary: 'CrowdStrike Intelligence reports a targeted campaign against South Korean financial organizations from late September to early October 2026 that ended in data exfiltration. The actor ran ARTEX, a recently released open-source, China-developed multi-agent penetration-testing tool, alongside LLMs: open directories on actor infrastructure exposed Claude Code session histories, Claude memory files and ARTEX configuration, showing a two-server layout in which one host ran the ARTEX instance (DeepSeek as the primary model backend, GLM and Grok as supplements) and a second held the Claude Code sessions. CrowdStrike says the actor is unattributed, assessed with moderate confidence as Chinese-speaking and financially motivated, and that the actor asked the model where Korean breach data is sold. Press reports cited by CrowdStrike say one bank was entered through a loan-progress inquiry service used by financial brokers and another through an employee mobile work-support system; Korea Times reports about 25,000 Shinhan Bank customers, 119 at KB Kookmin and 89 at Hana, and Reuters (via JoongAng) at least nine institutions affected or targeted. The developer (GitHub account Autumn-27) closed the project''s source after the attacks, and a Telegram account named in CrowdStrike''s report denied involvement on 2026-10-08 (CrowdStrike says the link between that handle and the actor is not definitive); those are the parties'' own statements. AhnLab ASEC, working independently from the tool''s web console, counted 600 internet-exposed ARTEX instances (about 900 by 2026-10-14), recovered two open directories of 51 files with internal-network scanning output, an RDP relay script, a script to read credentials from JVM heap dumps and a Linux implant downloader, and then installed ARTEX in a lab: given only a target, objective and permitted scope, it uploaded a web shell to a file-upload application and ran a program, and against an Apache ActiveMQ host exposing OpenWire (CVE-2023-46604) it gained access and ran remote commands on four internal hosts without further input. ASEC''s follow-up shows the code base being rebranded and redistributed by several operators with Korean-language artifacts, and one such instance staging a public StyleSmuggler proof of concept for the Magento/Adobe Commerce flaw CVE-2026-75650 together with a PHP IRC-bot implant. Defender-relevant finding from ASEC: the tool''s requests carry inconsistent or absent User-Agent values (a self-update agent string to GitHub, a tool-specific string on web requests, plain curl on uploads), many steps are non-HTTP, so ASEC advises detecting the sequence recon, exploit, execute, pivot across web, network, authentication and endpoint telemetry rather than any string.'
  region_nexus: 'South Korea (victims). Transferable to Europe: the demonstrated paths target default exposure of file-upload functions and Apache ActiveMQ OpenWire, and the tool is public and widely redistributed.'
