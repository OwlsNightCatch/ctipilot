  discovery_trace: 'first seen at: msft-ti (slice record), WebFetch https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (the msft-secblog feed stopped at 2026-10-08 and did not carry it) → primary: https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/ → pivot (Outbound link) https://blogs.microsoft.com/on-the-issues/2026/10/14/disrupting-the-service-economy-behind-transnational-cybercrime-operations/ → pivot https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem'
  summary: 'Microsoft Threat Intelligence and the Digital Crimes Unit describe a Chinese-language ecosystem it tracks as Storm-2990 (the developers of three commercially sold phishing kits: CoGUI, Haozi and Iron Man System) and Storm-3119 (YAM Store, an access broker and marketplace). Microsoft says that since January 2026 the kits facilitated over one billion phishing emails and SMS messages to more than 75,000 organizations and assesses with high confidence that they were developed by Chinese-speaking actors; the Digital Crimes Unit, with law enforcement, Health-ISAC and other partners, disrupted the main developers and infrastructure on 2026-10-14. Iron Man System ships over 2,335 lure templates for 139 countries (Resecurity counts 2,360 across 130, independently, after buying a licence) impersonating postal, toll and parking-fine authorities, police, local government, healthcare, banks and tax agencies, with geofencing, fake CAPTCHA gates, IP block lists, live operator interaction over WebSocket with Telegram notification, and downstream device-code phishing and card fraud. YAM Store''s supply side is the identity-relevant part: automated discovery of expired or enrolable Microsoft 365 and Azure for Education tenants and organization names, takeover through the compromised tenant''s client secret with application-only authentication (silent password resets, education licence assignment, privileged attributes), a Global Administrator sign-in that self-provisions the PnP Management Shell service principal and grants it broad Microsoft Graph permissions including AppCatalog.ReadWrite.All and full SharePoint control, then bulk hosting on the tenant''s SharePoint and OneDrive, a Cloudflare-based DNS panel and resale through an automated storefront; the actor also creates fraudulent organizations to open new tenants. Microsoft says the ecosystem is not limited to Microsoft services and that the affected sectors it named were healthcare, financial services, wholesale distribution and IT in Japan, the United States, Australia and India.'
  region_nexus: Global; named victims in Japan, US, Australia, India. Public-authority brand impersonation (local government, police, traffic and parking fines) is built into the kit templates for 130+ countries, so Swiss cantonal and communal brands are a plausible template target; Microsoft does not name Switzerland.
