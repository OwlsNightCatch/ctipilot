  discovery_trace: 'first seen at: csa-labs, extract https://labs.cloudsecurityalliance.org/research/ (research note 2026-10-15 ''CyberXero: Claude Code Agent Swarms in an Access Broker Operation'', re-reporting) → https://labs.cloudsecurityalliance.org/research/csa-research-note-cyberxero-agent-swarm-iab-20261015-csa-sty/ lists the SOCRadar report → primary: socradar (slice record), URL https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/ (listing page https://socradar.io/blog/ and the RSS feed did not carry it; found through the WordPress sitemap https://socradar.io/wp-sitemap-posts-post-27.xml, lastmod 2026-10-06) → corroboration: https://thehackernews.com/2026/10/cyberxero-uses-claude-code-in-campaign.html; Check Point 2026-10-12 weekly report also lists it.'
  summary: SOCRadar's Threat Research Unit documents CyberXero, a Russian-speaking, financially motivated initial access broker first seen on infrastructure in July 2026, discovered through one exposed open directory that served the actor's live working directory (more than 90,000 files including AI session logs, scripts with plaintext tokens and exfiltrated victim data). Two pipelines run side by side. The opportunistic one mass-exploits WordPress through 'wp2shell', the actor's own package built on the WordPress core REST batch route-confusion plus SQL-injection chain (CVE-2026-63030), which inserts a rogue administrator named wp2_ plus eight hex characters and installs an obfuscated WSO-family web shell as an active plugin; one run scanned 4,708 targets, reached 429 admin panels and placed 32 shells in 61 seconds, with a target set above 56,000 URLs, and a time-based SQL injection in Support Board (CVE-2026-4815) was weaponized within 30 days of disclosure. The directed pipeline performed curated reconnaissance of seven Ukrainian energy and utility entities (95 subdomains of two of them) and confirmed exfiltration at four Ukrainian organizations, 564,073 subscriber records from a Kharkiv district-heating provider among them, 628,000+ individuals in total, plus Redis rogue-replication exploitation in a Chinese cluster and WordPress attempts against Polish state-administration domains; SOCRadar counts more than 40 affected organizations worldwide and found no evidence that access was sold. The AI layer is up to 51 role-specialised Claude Code agents on the workstation plus a PentAGI deployment wired to a Cobalt Strike team server; the session logs show a rehearsed 'authorized pentest on my own infrastructure' framing and fresh-session retries to get past refusals, while several refusals held. All figures and the operator profile are SOCRadar's claims; THN and Security Affairs relay SOCRadar and add no independent telemetry.
  region_nexus: Ukraine (confirmed victims), Poland, global WordPress/e-commerce estate; the WordPress mass-exploitation pipeline is indifferent to geography, so Swiss communal and cantonal WordPress sites are in its target class.
