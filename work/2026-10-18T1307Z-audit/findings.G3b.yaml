- title: 'FAMOUS CHOLLIMA laptop-farm disruption: FBI and CrowdStrike dismantle DPRK IT-worker laptop farms in Texas (''Operation Lonestar Roundup''), CrowdStrike publishes hiring-fraud indicators and device-hash spoofing'
  sources:
