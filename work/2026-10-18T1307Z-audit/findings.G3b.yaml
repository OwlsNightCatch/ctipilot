- title: 'Rapid7 Zimbra research part 1: 80+ reported Zimbra vulnerabilities, five account-boundary CVEs detailed (EWS cross-user mailbox access, Sieve forwarding bypass, draft-based sender impersonation, two unfixed)'
  sources:
  - url: https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1/
    publisher: Rapid7 (Jonah Burgess)
    date: '2026-10-13'
    role: primary
  discovery_trace: 'first seen at: rapid7-research (slice record), `extract https://www.rapid7.com/blog/` (raw HTML listing, relative /blog/post/<slug>/ links; feed malformed per record note) → https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1/ (extract date 2026-10-13) → primary (no pivot needed); CVE-2026-10631 and -50055 were checked against state/cves_seen.json (first seen 2026-07-22, RESERVED then)'
  summary: 'During an assessment of Zimbra Collaboration Suite (ZCS) 10.1.16 Network Edition, Rapid7 reported more than 80 vulnerabilities across authentication, mailbox authorization, calendar processing, web clients, document services and the host operating system, and is publishing them in stages with a GitHub tracker of write-ups and PoCs. Part 1 details five account-related flaws: a GraphQL authentication rate-limit bypass (CVE-2026-93637, no public fix listed), an LDAP filter injection (CVE-2026-93635, no public fix listed), email impersonation through SaveDraftRequest (CVE-2026-73571, CVSS 8.3 by Rapid7, fixed in ZCS 10.1.17), EWS cross-user mailbox access (CVE-2026-10631, 6.5, fixed in 10.1.20) and a Sieve notify forwarding-restriction bypass (CVE-2026-50055, 6.5, fixed in 10.1.20). Each remaining flaw needs an ordinary compromised account; with EWS enabled the attacker can read other users'' mail, drafts, contacts and calendar, and the Sieve bypass can keep copies of future mail flowing to the attacker after the session expires or the password changes. The GraphQL bypass hides failed logins from the per-IP failure counter that the SOAP login path feeds, so password guessing through the Modern client''s GraphQL authentication does not trigger the default 10-failure suspension. Rapid7 previews parts 2 to 4 (stored XSS in Classic and Modern clients, SSRF to code execution as zimbra, several zimbra-to-root paths). The store''s 2026-07-22 Zimbra entry carried CVE-2026-10631 and -50055 only as RESERVED identifiers from BSI; Rapid7 is the first technical description of them, and CVE-2026-73571, -93637 and -93635 are new to the store.'
  region_nexus: Global; Zimbra is self-hosted mail used by public bodies in several European countries (the store's 2026-07-22 entry records NCSC-CH and BSI flagging ZCS 10.1.20).
  primary_sector_nexus: direct
  sector: public-sector (on-premises mail operators)
  cves:
  - CVE-2026-93637
  - CVE-2026-93635
  - CVE-2026-73571
  - CVE-2026-10631
  - CVE-2026-50055
  techniques:
  - T1110
  - T1114
  - T1114.003
  - T1078
  affected_products:
  - Zimbra Collaboration Suite (ZCS) 10.1.16 and earlier; fixed 10.1.17 (CVE-2026-73571) and 10.1.20 (CVE-2026-10631, CVE-2026-50055)
  entity_keys:
  - product:zimbra-collaboration
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: update-of:2026-07-22/zimbra-10-1-20-snmp-command-injection-rce-plus-stored-xss
  update_target: 2026-07-22/zimbra-10-1-20-snmp-command-injection-rce-plus-stored-xss
  borderline: true
  borderline_reason: All five need an authenticated account, no exploitation reported, two have no public fix; it resolves the earlier 'RESERVED' CVE gap and announces 80+ staged findings, so it is a changelog-record candidate for the Zimbra entry rather than a new entry.
  evidence:
  - quote: During a broader assessment of Zimbra Collaboration Suite (ZCS), Rapid7 reported more than 80 vulnerabilities spanning authentication, mailbox authorization, calendar processing, web clients, document services, and the host operating system.
    attribution: Rapid7 (Jonah Burgess)
    source_url: https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1/
  - quote: If EWS is enabled for the compromised account, the attacker can read private conversations, attachments, drafts, sent mail, contacts and calendar entries from other users' mailboxes.
    attribution: Rapid7 (Jonah Burgess)
    source_url: https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1/
  extended_notes: 'Admiralty suggestion B2. Exposure check: ZCS version below 10.1.20 (10.1.17 for the draft-impersonation flaw), EWS enabled for accounts, GraphQL authentication reachable from the internet. Detection: authentication logs showing many failed logins from one address that the 10-failure suspension never triggered; Sieve rules with notify actions to external addresses; Sent-folder items for users who did not send them. Fix status for -93637 and -93635 was ''No public fix listed'' at publication.'
- title: 'Barracuda: phishing emails carry hidden prompt injection aimed at the recipient''s AI mail assistant alongside the human lure, one sample sent from a public-sector domain'
  sources:
