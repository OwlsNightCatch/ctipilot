  evidence:
  - quote: Since May 2026, FAMOUS CHOLLIMA has begun spoofing device hashes; for example, making a video capture card appear as a webcam.
    attribution: CrowdStrike Counter Adversary Operations
    source_url: https://www.crowdstrike.com/en-us/blog/fbi-disrupts-famous-chollima-operation-with-crowdstrike-assistance/
  - quote: The dozens of victim organizations identified across the clusters disrupted in this operation span critical sectors including aerospace, energy, financial services, healthcare, cybersecurity, defense engineering, government technology, and consumer technology.
    attribution: CrowdStrike Counter Adversary Operations
    source_url: https://www.crowdstrike.com/en-us/blog/fbi-disrupts-famous-chollima-operation-with-crowdstrike-assistance/
