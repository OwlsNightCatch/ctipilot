  summary: 'Barracuda Research describes a phishing campaign whose messages target both the human reader and the AI assistants that summarize, prioritize and act on email. The sample looked like internal correspondence: identical From and To mailbox, a trusted spam-confidence score and an origin on a public-sector domain, with a password-protected attachment whose password sits in the body, a blind spot for attachment scanners. A second layer holds prompt injection hidden from humans using HTML comments, CSS-hidden text (zero font size, white-on-white), Base64 blocks that decode to text and zero-width Unicode characters. The injected instructions aim to make the assistant''s summary mark the phishing mail as legitimate or urgent, or to make it issue a wire-transfer request, leak data or surface a fake urgent action. Barracuda gives no victim count or campaign volume; this is one analysed campaign from its own telemetry.'
