  - claim_id: fc20c6bbcf
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The company is Pays ApS of Odense, and Politiken reports that at least three of its accounts, including the administrator account, used the password 123456 ("
    urls: ["https://cphpost.dk/2026-10-10/news/round-up/123456-password-used-in-massive-danish-cpr-data-breach/"]
