    surface: "body"
    kind: cited
    text: "The reported use of 123456 on the company's administrator account shows that password quality on the accounts that hold register lookup access is part of the register's own exposure ("
    urls: ["https://cphpost.dk/2026-10-10/news/round-up/123456-password-used-in-massive-danish-cpr-data-breach/"]
  - claim_id: c76f965b03
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: derived
    text: "The same exposure exists for any register or portal that gives private parties lookup access: the third party's access path is what the attacker used, so a weakness there is a weakness in the register."
