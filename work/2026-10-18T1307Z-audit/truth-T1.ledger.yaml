    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "Previdian's page, updated 2026-10-16, now counts 607 attempts from 65 unique addresses in 20 countries across five sensors between 2026-10-06 and 2026-10-15, and lists the flaw as in the CISA catalog ("
