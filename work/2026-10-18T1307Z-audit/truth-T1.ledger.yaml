    kind: record-summary
    text: "Cisco revised the advisory on 2026-10-02 (version 1.1) to add a Live Protect shield for this CVE, which it describes as temporary, partial protection that may block legitimate logins using URI encoding. The first fixed releases are unchanged and the upgrade remains Cisco's only remediation."
  - claim_id: f5c21ac663
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "headline"
    kind: frontmatter
    text: "Zammad 7.2.2 fixes the exploited zammad-to-root escalation on DEB and RPM installs; the session-leak RCE has a public exploit"
  - claim_id: b182035e7d
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes, and Horizon3 published the root cause and a working exploit for it on 2026-10-07. Zammad 7.2.2 (2026-10-08) fixes the root escalation, which affects only DEB and RPM (packager.io) installations; it follows 7.2.1 (2026-10-06), which fixed 27 newly published advisories in 7.2.0 and earlier, two rated critical, none with a CVE id and none reported exploited."
  - claim_id: 5ec7ff8ea6
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Copy the application and network logs of every self-hosted Zammad instance, then upgrade it to Zammad 7.2.2 (6.5 and older receive no security fixes, and 7.2.0 is affected by the 27 advisories Zammad published on 2026-10-06) or take it offline if it cannot be upgraded."
  - claim_id: 845544587c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[1]"
    kind: frontmatter
    text: "On every instance that was internet-reachable on 6.3.0 to 6.5.4 since 2026-09-21, run DIVD's log-check script, and treat a hit, or any DEB or RPM host where code ran as the zammad account, as compromised."
