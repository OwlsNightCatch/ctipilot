  - claim_id: c135c5aa04
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every Jira instance integrated with Crowd and review Crowd for accounts created since the exposure began, because the flaw's mechanics are public, exploitation attempts have been observed since 2026-10-06, CISA lists the flaw as actively exploited and Atlassian cannot confirm that any instance is unaffected."
  - claim_id: 3dcf25afeb
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "watchTowr Labs published the root cause on 2026-10-06 after comparing a vulnerable and a fixed build of the web-resource library that Jira, Confluence and Bitbucket share: its router converts a double colon in a request path into a slash before it resolves a plugin resource, so a traversal written with double colons leaves the resource directory through a deprecated relative-path resolver that is still reachable ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 271682d615
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr says it cannot leave the Tomcat context but can read any file within the application server, and it shows working requests against Jira, Confluence and Bitbucket, with Bitbucket blocking one configuration file but not another under WEB-INF ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 621b2eb53e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "The impact it demonstrates depends on the configuration: where Jira is integrated with Crowd, the crowd.properties file under WEB-INF stores the application name and its password in plaintext, and with those watchTowr reached Crowd's REST interface in its lab, created a user and added it to the Jira administrators group; it adds that a Crowd IP allow-list would make this harder ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 84f41acadc
