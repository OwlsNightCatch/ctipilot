    text: "); Cisco's revision of 2026-10-02 adds a Live Protect shield that it describes as temporary, partial protection, and says the only way to remediate is to upgrade to the first fixed release ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: e7a92403d8
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "The application server decodes the request path when it matches its login security constraint, but Cisco's login module tests the raw, undecoded path for the string `j_security_check` before it decides whether to run the real password check, so a request to `/%6a_security_check` skips the password check ("
    urls: ["https://www.vulncheck.com/blog/revenge-of-the-sd-wan-cve-2026-76504"]
  - claim_id: 528aaee0d6
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "The request then falls into a branch written for continuing an already trusted session, whose only gate is a substring match against four internal `viptela-reserved-` account names, and supplying any of them builds a fresh login session ("
    urls: ["https://www.vulncheck.com/blog/revenge-of-the-sd-wan-cve-2026-76504"]
  - claim_id: 171155a77c
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "Two of the four accounts hit role checks on admin-only endpoints and two are expected to carry the needed permissions ("
    urls: ["https://www.vulncheck.com/blog/revenge-of-the-sd-wan-cve-2026-76504"]
  - claim_id: afa6d521da
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "Cisco stresses that any single encoded character works, not only `%6a` ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: df3ef6c38e
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "VulnCheck counts about 1,500 internet-exposed Managers and found no legitimate public exploit as of 2026-10-01; it rejected a fake proof-of-concept repository ("
    urls: ["https://www.vulncheck.com/blog/revenge-of-the-sd-wan-cve-2026-76504"]
  - claim_id: 71acd7e58b
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "Cisco's first fixed releases are 20.9.10.1, 20.12.8.2, 20.15.6.1, 20.18.4.1, 26.1.2.1 and 26.2.1; releases earlier than 20.9 must migrate to a fixed train, and the Cisco-managed cloud service (release 20.15.605) needed no customer action ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 3611da4506
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "NCSC Switzerland posted its own advisory on 2026-09-30 and lists the flaw as actively exploited ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13021"]
  - claim_id: 49eab94f2a
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** an on-premises Manager whose web or API listener is reachable from the internet or from untrusted segments; Cisco says Managers exposed to the internet with open ports are at risk, and fixed releases exist for the 20.9 and later trains, while earlier releases must migrate ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 2c62fd42ef
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "**Detection:** in web and application access logs on the Manager, Cisco names two sources: `serviceproxy-access.log` (under `/var/log/nms/containers/service-proxy/`) for POSTs to the login path with an encoded character from unknown or unauthorized addresses, and `vmanage-server.log` for lines about that path tied to usernames starting `viptela-reserved-` ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: e2b9dd9cb4
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "To judge whether a Manager was already accessed, Cisco says customers may open a Severity 3 TAC case with the CVE id in the title and encourages them to run `request admin-tech` first so the file can be provided to TAC ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 88eee0da4f
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: cited
    text: "**Triage:** Cisco warns that these log entries can also occur during standard operation and must be assessed against normal network posture; a `viptela-reserved-` name is an internal service account, so the signal is a login-path request with an encoded character from an address that is not part of the fabric ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 4954fa1f0f
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: uncited
    text: "VulnCheck's reproduction explains the mechanism."
  - claim_id: b9fa1f86ef
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade to the fixed release of the train now and remove internet reachability of the Manager in the meantime (known trusted hosts only, behind a filtering device, per Cisco's hardening guide), treating Cisco's Live Protect shield as a temporary partial layer on top of that and not as a fix; a Manager that was reachable and unpatched needs the log review and TAC check above before it is considered clean."
  - claim_id: 9463f996e5
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Cisco revised its advisory to version 1.1 on 2026-10-02 (\"Added information about Live Protect shield availability\") and now states it has released a Live Protect shield for CVE-2026-76504 \"to provide temporary security coverage\" while upgrades are planned ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 5cffd45a32
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Cisco says the shield offers only temporary partial protection and that, once applied, a legitimate user with URI encoding might not be able to log in to the Manager ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
  - claim_id: 8f73191d80
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Cisco's Live Protect page lists the feature from Catalyst SD-WAN Control Components release 20.18.3, describes a monitoring mode that shows exploit attempts without enforcing and an enforce mode that applies the mitigation, and says Cisco creates shields for the release current when a shield is published and for the two immediately preceding releases in each supported release train that includes Live Protect, so older releases may have no shield ("
    urls: ["https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html"]
  - claim_id: 75567fe62e
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "section 2026-10-03T04:55:00Z"
    kind: uncited
    text: "The fixed releases, the exploitation statement and the KEV listing are unchanged, and Cisco keeps its position that the only remediation is the upgrade."
  - claim_id: c1cd0e3bf0
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
