    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "Its timeline still lists the first sensor observation at 21:55 UTC on 2026-10-06, about five hours after watchTowr's post of 17:01 UTC, which is later than the two-hours figure ("
    urls: ["https://previdian.com/CVE-2026-21589", "https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: f2a94c3272
