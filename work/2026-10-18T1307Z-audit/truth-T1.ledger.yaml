    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "NCSC Switzerland edited its advisory on 2026-10-12 to list the status as proof of concept available and actively exploited, citing the attempts Previdian recorded on its honeypot sensors ("
