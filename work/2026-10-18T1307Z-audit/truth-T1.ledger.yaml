    text: "**Exposure:** about 8.8 million of the register's roughly 11 million records (the ministry says the access does not cover the names and addresses of people with name-and-address protection); the ministry warns recipients never to hand out passwords or other confidential information in calls or emails, even when the caller knows their name, address and CPR number ("
