    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "headline"
    kind: frontmatter
    text: "Fortinet now names fixed FortiMail builds for an unauthenticated file-write flaw it confirmed exploited as a zero-day"
  - claim_id: 3a30ee6df9
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's advisory FG-IR-26-175 of 2026-10-01 describes a path traversal in FortiMail that lets an unauthenticated attacker write arbitrary files through crafted HTTP or HTTPS requests, and says it has been reported exploited in the wild; CISA listed it in KEV the same day. Belnet, the Belgian government and research network, says a zero-day in its supplier Fortinet's technology let attackers copy its inbound mail from 2026-07-22 and links this advisory, which puts exploitation about ten weeks before the disclosure. Fortinet's revision of 2026-10-05 names the fixed builds 8.0.2, 7.6.7 and 7.4.9 and tells 7.2 users to move to branch 7.4 or above; the vendor workarounds remain the interim control. Fortinet says it remediated FortiMail Cloud on 2026-10-05, so only self-managed appliances need action."
  - claim_id: 853a7e8adc
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Upgrade every self-managed FortiMail to a fixed build now: the zero-day is exploited and fixes have shipped: Fortinet reports in-the-wild exploitation of an unauthenticated file-write flaw in FortiMail and, since 2026-10-05, names the fixed builds 8.0.2, 7.6.7 and 7.4.9 (7.2 moves to branch 7.4 or above). Upgrade every self-managed appliance now (FortiMail Cloud was remediated by Fortinet on 2026-10-05); where the upgrade has to wait, disable IBE support with the vendor's CLI command, or cut the FortiMail webmail interface off from the internet, or block POST requests to /ibe that contain '../' at a web application firewall in front of FortiMail. Then check every appliance that was reachable against the compromise artifacts in advisory FG-IR-26-175, looking back to at least 2026-07-22."
  - claim_id: 7e799bbe53
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed FortiMail to the fixed build for its branch (8.0.2, 7.6.7 or 7.4.9; 7.2 moves to branch 7.4 or above, which means 7.4.9 or later; FortiMail Cloud customers need not act); until each appliance is upgraded, disable IBE support (config system encryption ibe, set status disable) or, as Fortinet's alternatives, cut the webmail interface off from the internet or block POST requests to /ibe containing '../' at a web application firewall in front of it."
