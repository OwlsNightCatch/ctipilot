    kind: cited
    text: "BleepingComputer reports that Fortinet's advisory also listed files added or modified on compromised appliances, a library added under the data partition, an added `ld.so.preload` file, a modified system binary, two added binaries, a modified web server configuration and a modified migadmin archive, and reads the archive account as a possible path to send archived data to a remote server ("
