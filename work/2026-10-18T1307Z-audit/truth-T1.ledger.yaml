    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "). watchTowr also published a Detection Artifact Generator on GitHub that sends the traversal to Jira, Confluence and Bitbucket hosts to test whether they are vulnerable ("
    urls: ["https://github.com/watchtowrlabs/watchTowr-vs-Atlassian-CVE-2026-21589"]
  - claim_id: 86dc1ef10c
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-07T04:50:00Z"
    kind: cited
    text: "Atlassian's Crowd ticket lists the same fixed builds as the advisory, 7.1.7 for the 7.1 line ("
