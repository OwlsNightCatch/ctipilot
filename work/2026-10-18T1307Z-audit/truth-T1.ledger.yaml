  - claim_id: c87a7c2395
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** registry operators and the companies that hold lookup access should treat each authorised third party's access path as an attack path, with per-party volume ceilings and an alert on departure from the declared scope; people and organisations that handle citizen data should expect the leaked identifiers to make impersonation calls and emails more convincing, and should not accept knowledge of a CPR number as proof of identity, which a Danish agency director now says it no longer is ("
