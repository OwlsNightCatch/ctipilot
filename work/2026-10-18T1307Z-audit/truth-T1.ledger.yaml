    text: "Datatilsynet's notice says the register reported a very large number of automated lookups made to identify valid CPR numbers, and at the 2026-10-06 press briefing the authorities said a costly invoice rather than systematic alarms hinted at the breach, that police visited a smaller company in person and contacted foreign police, and that the CPR number can no longer be used to authenticate a person. Police are examining whether an algorithm or AI was used; the actor, the company and how the access was obtained are still not public."
  - claim_id: 9723224ddc
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "record 2026-10-11T03:40:00Z"
    kind: record-summary
    text: "The abused company is Pays ApS of Odense, which confirmed it to TV 2; Politiken reports that at least three of its accounts, including the administrator account, used the password 123456, and an anonymous hacker says access began with a leaked former employee's password, a claim. Ritzau puts the access at 21 days and 17 hours from 10 September, where the minister had described about ten days."
