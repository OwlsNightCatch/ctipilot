  - claim_id: bbba55bcb5
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The same record still lists exploitation since 2026-10-15 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: e12de6d4be
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The flaw itself is unchanged: Atlassian's advisory, as read on 2026-10-17, still uses the ID, lists the same fixed versions and carries no note of the rejection ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 5b0c3b9ae9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "ENISA's EUVD record EUVD-2026-92807 for CVE-2026-21589, which names Atlassian as the assigner, was updated at 20:39 UTC on 2026-10-16 and now describes the record only as \"This CVE's publication may have been a false positive or a mistake."
  - claim_id: 44f05dc644
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "No source read says why the record was rejected or whether a replacement ID will follow."
  - claim_id: 02bdb3d1f9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "The consequence is for tooling: a scanner plugin, SIEM enrichment rule or ticket keyed on the ID, or on a feed that drops rejected IDs, can stop reporting a flaw that is exploited, so track it by Atlassian's advisory and the fixed versions above until a replacement ID appears."
  - claim_id: cbe21f23ae
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-07T04:50:00Z"
    kind: record-summary
    text: "watchTowr Labs published the root cause (a path-separator substitution in the web-resource library shared by Jira, Confluence and Bitbucket), the request shape and a runnable checker on 2026-10-06, and shows that where Jira is integrated with Crowd the file read exposes a plaintext Crowd application password that gives administrator access to Crowd for that application. The flaw moves from a patch-now issue with unpublished mechanics to one with public mechanics and a Crowd credential to rotate; no exploitation is reported. Atlassian's Crowd ticket lists the same fixed builds as the advisory."
  - claim_id: 2b1cd38343
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-08T04:56:05Z"
    kind: record-summary
    text: "Exploitation attempts began on 2026-10-06, the day watchTowr published its write-up and proof of concept: Previdian's sensors have recorded at least 129 attempts from at least 22 addresses in eight countries, SANS ISC recorded similar attempts against Jira, Confluence and Bitbucket on its own honeypots, all from one cloud provider, and a Nuclei template exists; the Canadian Cyber Centre's bulletin now cites open-source reporting of in-the-wild exploitation. The status moves from patch-available to exploited, with no compromise reported and the flaw not listed in CISA's KEV catalog on Previdian's page."
  - claim_id: 624b386e65
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-16T04:11:30Z"
    kind: record-summary
    text: "CISA added CVE-2026-21589 to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, which moves the flaw from honeypot-observed attempts to government-confirmed exploitation; CISA names neither the evidence, the actor nor any victim, and neither CISA nor the honeypot operators report a compromise; Previdian's honeypot count has grown to 607 attempts from 65 addresses in 20 countries, and NCSC Switzerland has listed the flaw as actively exploited since 2026-10-12."
  - claim_id: 895406e954
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-17T03:34:00Z"
    kind: record-summary
    text: "Atlassian, the assigner, rejected the CVE record for CVE-2026-21589 on 2026-10-16, giving only the generic reason that its publication may have been a false positive or a mistake; ENISA's EUVD record mirrors it and still lists exploitation since 2026-10-15. Atlassian's advisory still uses the ID with the same fixed versions, and no source says why the record was rejected or whether a replacement ID will follow, so tooling keyed on the ID can lose track of an exploited flaw."
  - claim_id: 0d487f7633
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "headline"
    kind: frontmatter
    text: "A Danish company's register access, reportedly secured with the password 123456, was abused to obtain 8.8 million CPR numbers"
  - claim_id: 1ca6499fed
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "summary"
    kind: frontmatter
    text: "Denmark's CPR administration says unauthorised parties used a private Danish company's lawful right to search the Central Person Register to obtain names, addresses and CPR numbers of about 8.8 million of its roughly 11 million records (living, deceased and emigrated persons); the ministry says the access does not cover the names and addresses of people with name-and-address protection. The company, Pays ApS of Odense, confirmed to TV 2 that its lawful access was abused, and Politiken reports that at least three of its accounts, including the administrator account, used the password 123456; Ritzau puts the access at 21 days and 17 hours from 10 September, where the minister had described about ten days. An anonymous hacker told Politiken the access began with a leaked former employee's password, which is the hacker's claim, and Datatilsynet describes a very large number of automated lookups made to identify valid CPR numbers."
  - claim_id: 84dc6ab1de
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Denmark's CPR administration noticed irregular behaviour in the register on the evening of Friday 2026-10-02, learned over the weekend that unauthorised parties had obtained names, addresses and CPR numbers of about 8.8 million registered persons, and says the access worked by misusing a Danish private company's lawful right to search the register, within the scope of data that private companies may access (translated from Danish) ("
    urls: ["https://via.ritzau.dk/pressemeddelelse/15205753/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger"]
  - claim_id: 542e8e9cb9
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The register holds about 11 million records, covering living, deceased and emigrated persons, and the ministry says the unauthorised access does not cover the names and addresses of people registered with name-and-address protection; CPR stopped the company's access, reported the incident to the Danish data protection authority, and the police are investigating, with no statement yet on who is behind it ("
    urls: ["https://via.ritzau.dk/pressemeddelelse/15205753/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger"]
  - claim_id: 5c3e9414e3
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Under section 38 of the CPR Act a private company with a legitimate interest may receive information on a larger delimited group of persons that it has identified individually in advance, by CPR number, date of birth and name, or by name and address ("
    urls: ["https://via.ritzau.dk/pressemeddelelse/15205753/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger"]
  - claim_id: 9c3b7ef9c4
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The digitalisation minister told Ritzau the access lasted about ten days in September and ran through a smaller Danish company, that an employee of the CPR administration spotted the unusual activity on 2 October, and that red lights should have lit when it went on for so long; she declined to say whether the investigation sees criminal intent at the company ("
    urls: ["https://fagligsenior.dk/2026/10/05/cpr-laek-i-ti-dage-minister-erkender-svigt-i-sikkerheden/"]
  - claim_id: 62f420526c
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Ritzau later reported that the hacker had access from 10 September for a total of 21 days and 17 hours ("
    urls: ["https://cphpost.dk/2026-10-10/news/round-up/123456-password-used-in-massive-danish-cpr-data-breach/"]
  - claim_id: 46e4c7b807
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Datatilsynet, the Danish data protection authority, says the register's notification describes a very large number of automated lookups made to identify valid CPR numbers (translated from Danish) ("
