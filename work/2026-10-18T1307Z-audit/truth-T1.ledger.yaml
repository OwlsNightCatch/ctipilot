  - claim_id: 5864f42acc
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "headline"
    kind: frontmatter
    text: "Huntress: a member account plus an .aspx upload gave an attacker webshells on three servers and a hunt for card data"
  - claim_id: d1c88c267d
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "summary"
    kind: frontmatter
    text: "Huntress observed from 2026-09-10 a threat actor compromising three web servers of a shared recreation-management platform by registering a member account and uploading .aspx webshells into the member-files directory, then searching for database credentials and cardholder data. After one server went back into production prematurely, the actor returned with the same account and planted a credential-harvesting script in the login page's jQuery file. Huntress names no vendor or CVE."
  - claim_id: fd9b1d0914
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Huntress observed on 2026-09-10 a threat actor compromising multiple tenants of a shared recreation-management platform with one repeatable method: \"register a member account, upload a malicious file, and turn it into a webshell\" ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 7a67b39a83
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On the first server the actor spent roughly six hours on failed unauthenticated attempts (login brute force, IIS 8.3 tilde enumeration, WebDAV verbs, upload-handler bypasses, forced browsing); what worked was registering an account and uploading 14 files into the member-files directory, the .aspx ones as webshells ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 63c84c2cb7
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Through the webshells, run from the IIS worker process, the actor enumerated the host and IIS sites, read configuration files for connection strings and keys, connected to the database with the harvested SQL credentials, searched files for card data and read a payment gateway's plain-text webhook logs to extract card numbers, expiry dates and card verification codes ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: a76a3b5e57
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On a third server it uploaded five webshells, copied them under names resembling site assets, set their timestamps to match web.config and probed the payment-module folders ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 1cf3634c2d
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "When that server was put back into production prematurely, the actor returned with the same registered account, re-uploaded webshells and appended an obfuscated loader to a jQuery file that the authentication page loads, intending to turn every browser that loads the page into an encrypted command client that evaluates pushed code and harvests credentials in real time ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: ab1efd70dd
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "**Exposure:** any web platform that lets an anonymous visitor self-register and then upload files into a directory served by IIS with script execution enabled; with no vendor or CVE named, check whether a member upload directory accepts .aspx files and executes them ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: aae3e9c834
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Later signs are web-root files whose timestamps were copied from web.config, a static script asset loaded by the login page that differs from the deployed package, and PowerShell and JavaScript written to the Windows temp folder as base64 files and then decoded ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: bdafc097e6
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "**Triage:** legitimate member uploads of documents and images land in the same directory; the discriminator is a script-capable extension there, or a file there that is requested directly and then spawns child processes ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 2c6895a8d8
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On a cleaned server, remove the actor's registered accounts, fix the upload handler and rotate the SQL credentials in readable configuration files before it returns to production; the actor came back with the same account ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 62af83a772
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "Huntress's summary calls the three compromised web servers municipal and says the actor aimed to steal payment data; the post names neither the platform vendor nor a CVE."
  - claim_id: 573aa0675a
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "Huntress deduces from a Simplified Chinese locale in a PowerShell user-agent that the actor is most likely based in China, and says script comments suggest AI-generated code."
  - claim_id: 6f05f1fc7f
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "It does not state how many cards were exposed or whether any data left the servers."
  - claim_id: 5e09c8867e
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: derived
    text: "**Detection:** web and application telemetry first: a new member registration followed by uploads into the member-files directory, .aspx files appearing in an upload folder, and the IIS worker process spawning cmd.exe or powershell.exe for host and configuration discovery."
  - claim_id: 6837e8b606
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** review citizen-facing booking or payment portals that allow self-registration and upload for script execution in the upload directory, payment modules sharing a server with general tenants, and webhook logs holding card data in plain text on the web server."
  - claim_id: 8e7b43f54a
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "headline"
    kind: frontmatter
    text: "Atlassian's CVE-2026-21589 record was rejected on 16 October, but the flaw, its fixes and its exploitation stand"
  - claim_id: c70d7750b1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's honeypot sensors recorded attempts from dozens of addresses in about twenty countries, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, without saying what the evidence is. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application. The CVE record for this ID was marked rejected on 2026-10-16 with only a generic reason, while Atlassian's advisory and fixed versions are unchanged, so tooling keyed on the ID can lose track of an exploited flaw."
  - claim_id: 2f9a69b5d3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center installation to a fixed version of its line (Bitbucket 9.4.26, 10.2.8 or 10.5.1; Confluence 9.2.26 or 10.2.19; Jira Service Management 5.12.40, 10.3.26 or 11.3.12; Jira Software 9.12.40, 10.3.26 or 11.3.12; Bamboo 10.2.24 or 12.1.12; Crowd 6.3.7, 7.0.3, 7.1.7 or 7.2.4) and Crucible and Fisheye to 4.9.15, internet-reachable instances first; until each is upgraded, take it off the internet or put Atlassian's web application firewall or Tomcat rewrite rule in front of it."
  - claim_id: fdd26f14f3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Jira instance that was internet-reachable and unpatched and is integrated with Crowd, treat the Crowd application password in its WEB-INF/classes/crowd.properties as readable: rotate it after the upgrade and review Crowd for user accounts created or group memberships changed since the exposure began; on every affected instance search the web server and proxy logs back to 2026-10-05, the day the advisory published (honeypots recorded the first attempts on 2026-10-06), for '..' next to '/', '\\\\' or '::'."
  - claim_id: 3cf0ff5a3e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[2]"
    kind: frontmatter
    text: "Confirm that every vulnerability scanner, SIEM enrichment rule and ticket keyed on CVE-2026-21589 still reports each affected Atlassian instance as open; where the rejected ID has dropped it, track the flaw by Atlassian's advisory and the fixed versions above until a replacement ID appears."
  - claim_id: 76955df979
