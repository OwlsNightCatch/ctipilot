    surface: "record 2026-10-07T04:52:00Z"
    kind: record-summary
    text: "Zammad released 7.2.1 on 2026-10-06 with 27 security advisories, two rated critical (a public sign-up path to other customers' tickets and a multi-factor bypass in the email-verification flow), all affecting 7.2.0 and earlier; 7.2.0 is therefore no longer the release to install. None of the advisories carries a CVE id, none is reported exploited, and no source says whether 7.2.1 fixes the exploited root escalation CVE-2026-102490."
