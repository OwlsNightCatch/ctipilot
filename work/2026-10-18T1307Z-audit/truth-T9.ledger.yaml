    text: "On 2026-09-21 Unit 42 saw a three-stage chain against a US-based target: a request with a Base64 dropper command in the User-Agent, answered with a 404 and written to the VPN HTTP access log; a login request whose extra text is logged in `ns.log` after the `pitboss PPE missed too many heartbeatsNSPPE` marker; and the vulnerable `ns_monuploadd_err.pl` script then running that text, which retrieves and decodes the staged payload and pipes it to `sh` or `php` ("
