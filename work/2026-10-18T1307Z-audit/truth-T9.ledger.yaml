    text: "Kiteworks lifted the shutdown recommendation for all customers on 2026-09-27, stating it found no indication of compromise. Germany's BSI (WID-SEC-2026-3602) and NCSC Switzerland now name the specific vulnerable component for the first time: Kiteworks Advanced Forms below version 9.5.1, fixed in 9.5.1; no CVE has been assigned. Priority moves from high to notable now that the acute threat has resolved without confirmed compromise."
