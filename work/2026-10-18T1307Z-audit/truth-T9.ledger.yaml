  - claim_id: f1c9613a78
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: cited
    text: "Nothing about the attack itself is public: Apple gave no details on how many people were targeted, whether any attempt succeeded, or when exploitation began ("
