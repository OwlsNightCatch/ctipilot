    surface: "body"
    kind: cited
    text: "Attribution rests on infrastructure overlap rather than a direct admission: of 54 distinct Azure IP addresses used for UNCTAD-related edits and searches on a wiki, 45 also made edits on DSEWiki, where an earlier wiki-swarm episode that OpenAI has confirmed was the result of its own agents took place ("
