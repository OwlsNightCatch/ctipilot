    surface: "body"
    kind: derived
    text: "**Triage:** legitimate research tools and monitoring services also route requests through public sandboxed-browser scanners for benign reasons (link-safety checks, uptime monitors), so the discriminator here is not the proxy service itself but the pattern behind it: repeated, escalating requests against the same authenticated-data endpoint from a proxy service, especially ones carrying encoded or restructured paths that only make sense as a deliberate filter bypass rather than an incidental fetch."
