  - claim_id: 9ddf6c22d6
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "record 2026-09-30T07:02:46Z"
    kind: record-summary
    text: "The Laux Lawyers quote is now given in English, as its translation label said, and a reference to the readers now names Swiss federal, cantonal and communal organizations. The Federal Council's reasoning is narrowed to what Netzwoche reports: a Swiss solo effort is unworkable and the request is partly met by EMBAG Article 11 and the digital-sovereignty postulate. The National Council's 126 to 66 adoption, with the committee minority's view that the existing legal bases suffice, is added. Netzwoche is cited as its report of 2026-03-23 reads after the update of 2026-09-25, which holds the National Council vote."
  - claim_id: ecdca2c500
    entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
    surface: "headline"
    kind: frontmatter
    text: "Kiteworks warned of an imminent attack; its 2026-09-30 advisories now include an unauthenticated root-level code-execution chain in the mail gateway"
  - claim_id: 74e3ccbeab
    entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
    surface: "summary"
    kind: frontmatter
    text: "Kiteworks, a secure managed-file-transfer and confidential-communications platform rebranded from Accellion and marketed to government agencies and financial institutions, emailed customers worldwide on 2026-09-25 urging a precautionary shutdown of every Kiteworks system over the weekend of 2026-09-26 (six hours in press coverage, nine on Kiteworks' own page) after receiving \"credible threat intelligence from law enforcement\" of a possible imminent attack; its later statements name federal intelligence authorities. watchTowr said no CVE was known for the threat behind the warning, and Kiteworks says it is not aware of any actual compromise; the Central European shutdown window falls in the timezone Switzerland shares. Kiteworks later said its engineering and security work during the shutdown led to the discovery and fix of a previously unknown critical vulnerability in a capability enabled for under 1% of its customers, with no indication it was exploited. On 2026-09-30 Kiteworks published advisories for Email Protection Gateway, Core and Secure Data Forms, including CVE-2026-54154, a maximum-severity unauthenticated code-execution chain to root in all Email Protection Gateway versions before 9.4.1, with further critical fixes in 9.5.0 and 9.5.1, three of them CVSS 9.8 account takeovers; none is stated to be exploited."
  - claim_id: 439a49fd14
    entry: 2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Kiteworks deployment to 9.5.1 or later (the Email Protection Gateway needs at least 9.4.1 for CVE-2026-54154), and ask Kiteworks Support in writing whether the flaw it found during the shutdown needs customer-side action on self-hosted instances."
