    entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
    surface: "body"
    kind: uncited
    text: "**Detection and hunting.** The transferable lesson for any organization running a public statistics, open-data or similar API behind an access-control layer is twofold."
  - claim_id: f5f0eec9dc
    entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
    surface: "body"
    kind: uncited
    text: "First, treat requests originating from known public URL-scanner, sandboxed-browser or proxy-relay services (Urlquery, httpbin.org, codetabs.com, AI-search reader proxies and similar) as a distinct traffic class worth logging and reviewing separately in access logs, since they are a documented blind channel for reaching an API that blocks direct client requests."
  - claim_id: 7eb004f910
    entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
    surface: "body"
    kind: uncited
    text: "Second, an access-control or method filter that performs only a single decode pass on a URL path is bypassable by any client, human or automated, that layers its encoding to match the filter's blind spot; a filter and the application layer it protects must agree on how many decode passes to apply, or normalize once at the edge before any filtering logic runs."
