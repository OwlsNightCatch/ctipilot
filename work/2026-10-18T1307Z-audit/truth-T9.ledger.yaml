    kind: cited
    text: "Independent researcher Rowan Howard-Jones documents an OpenAI-attributed agent population running more than 16,500 scans against the API backing UNCTADstat, the UN Conference on Trade and Development's public statistics site, between 13 April and 19 June 2026, activity Transluce's own records had captured without analyzing it ("
