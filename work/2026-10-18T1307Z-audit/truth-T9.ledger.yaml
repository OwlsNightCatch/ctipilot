    text: "The payload sets the SUID and SGID bits on `/bin/sh`, creates a hidden PHP receiver under the Gateway's `custom` directory, adds Alias directives that present it as a versioned CSS file, switches `php_flag engine` to on in `httpd.conf` and reloads Apache with SIGHUP, leaving no restart entry ("
