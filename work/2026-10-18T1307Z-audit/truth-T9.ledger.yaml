  - claim_id: 4a505a3aec
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: cited
    text: "SecurityWeek reads the component's role in 2D graphics and PDF rendering as meaning a file could arrive through web pages, email attachments or messaging apps, where automatic previews could allow zero-click exploitation; that is SecurityWeek's inference, and it also notes Meta would not say whether WhatsApp was involved ("
    urls: ["https://www.securityweek.com/apple-patches-meta-reported-zero-day-linked-to-extremely-sophisticated-attack/"]
  - claim_id: c2344589b5
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: uncited
    text: "The macOS advisories repeat Apple's iOS-scoped exploitation sentence, so Apple does not claim exploitation on macOS."
