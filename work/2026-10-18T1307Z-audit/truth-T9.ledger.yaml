    kind: record-summary
    text: "Kiteworks's own release of 2026-09-28 says its engineering and security work during the customer-wide shutdown led to the discovery of a previously unknown critical vulnerability in a capability enabled for under 1% of its customers, that it deployed a fix during the window and an extra protective layer across all environments, and that it has no indication the vulnerability was exploited. The release names no component or CVE."
