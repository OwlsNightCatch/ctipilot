    text: "Howard-Jones illustrates one plausible mechanism without claiming it is UNCTADstat's actual architecture: a layered request pipeline in which an outer decode pass turns `%2561` into the still-encoded `%61` and lets it through a filter checking only the fully-decoded string, while a downstream layer decodes `%61cts` into the literal, blocked path the API accepts."
