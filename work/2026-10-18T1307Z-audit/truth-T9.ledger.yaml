    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: uncited
    text: "It also says iOS 27 and macOS Golden Gate 27 do not appear to be affected."
  - claim_id: 9297f23230
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: uncited
    text: "No indicators or behavioural detections have been published by Apple, Meta or CISA, so version compliance is the only measurable lever: device-management inventory of iPhones and iPads still on the iOS 26 branch below 26.7.1, and of Macs on Tahoe or Sequoia below the fixed builds."
