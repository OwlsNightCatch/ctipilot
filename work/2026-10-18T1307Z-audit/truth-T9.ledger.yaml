claims:
  - claim_id: a75cd96266
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "headline"
    kind: frontmatter
    text: "Swiss parliament sends a sovereign-cloud mandate to the Federal Council despite its own recommendation to reject it"
  - claim_id: 5587b3635b
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "summary"
    kind: frontmatter
    text: "Switzerland's Federal Assembly referred motion 24.3209 to the Federal Council on 2026-09-23 after the National Council adopted it by 126 votes to 66, following the Council of States' 31:11 vote in March 2026. The motion instructs the Federal Council to submit a legal revision enabling a federally co-financed sovereign cloud service and an independent data-exchange platform to host administration, industry and critical-infrastructure data inside Switzerland, over the Federal Council's own recommendation to reject it. No operational obligation exists yet; the Federal Council must still draft the requested legislation."
  - claim_id: f1366e636e
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: cited
    text: "Switzerland's Federal Assembly's own Curia Vista record for motion 24.3209, \"Für eine souveräne digitale Infrastruktur in der Schweiz im Zeitalter der künstlichen Intelligenz\" (for a sovereign digital infrastructure in Switzerland in the age of artificial intelligence), shows its status moved to \"Überwiesen an den Bundesrat\" (referred to the Federal Council) on 2026-09-23, with the National Council's own committee deliberation on the motion recorded as concluded shortly before ("
    urls: ["https://ws.parlament.ch/odata.svc/Business(ID=20243209,Language='DE'"]
  - claim_id: 7dec40c04f
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: cited
    text: "The Council of States adopted the motion first, in March 2026, by a 31:11 vote ("
    urls: ["https://www.netzwoche.ch/news/2026-03-23/staenderat-sagt-ja-zu-souveraener-ki-infrastruktur"]
  - claim_id: 2591a5b732
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: cited
    text: "); Netzwoche's update of 2026-09-25 reports that the National Council followed by 126 votes to 66, after its committee backed the motion 13 to 12 and a committee minority argued that \"the existing legal bases suffice\" (translated from German) ("
    urls: ["https://www.netzwoche.ch/news/2026-03-23/staenderat-sagt-ja-zu-souveraener-ki-infrastruktur"]
  - claim_id: 699bebd6d5
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: cited
    text: "The motion instructs the Federal Council to submit a legal revision letting the federal government, cantons, research institutions and the private sector jointly advance, co-finance, steer and monitor a sovereign digital infrastructure, specifically an independent cloud service and an independent data-exchange platform intended to host administration, industry and critical-infrastructure data inside Switzerland (\"The motion requires a legal revision so that the federal government, together with the cantons, research institutions and the private sector, can advance, co-finance, steer and monitor the build-out of a sovereign digital infrastructure,\" translated from German,"
    urls: ["https://www.lauxlawyers.ch/it-recht-in-der-herbstsession-2026/"]
  - claim_id: c30232e1ec
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: cited
    text: "The Federal Council's recommendation to reject called a Swiss solo effort unworkable and held the request partly met already, citing Article 11 of the EMBAG federal e-government act and parliament's adoption of a postulate for a digital-sovereignty strategy ("
    urls: ["https://www.netzwoche.ch/news/2026-03-23/staenderat-sagt-ja-zu-souveraener-ki-infrastruktur"]
  - claim_id: 9541498923
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: uncited
    text: "Both chambers thus adopted it despite the Federal Council formally recommending rejection."
  - claim_id: 2b9d8dde86
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: uncited
    text: "This is a directional, strategic-level signal rather than an immediate operational obligation: the Federal Council must still draft and pass the legislation before any sovereign-cloud or exchange-platform requirement takes effect."
  - claim_id: 1549138aaa
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: uncited
    text: "It is nonetheless the trigger event for a legislative process that will determine where and by whom federal, cantonal and critical-infrastructure workloads may legally be hosted, with downstream implications for data-residency and supply-chain risk assessments across Swiss federal, cantonal and communal organizations."
  - claim_id: 2b926e4e2e
    entry: 2026-09-25/switzerland-sovereign-digital-infrastructure-motion-24-3209
    surface: "body"
    kind: uncited
    text: "Public-sector IT and procurement teams tracking Swiss Government Cloud planning should treat this motion as the point at which a domestic-hosting requirement moved from proposal to a parliamentary mandate the Federal Council cannot simply decline."
