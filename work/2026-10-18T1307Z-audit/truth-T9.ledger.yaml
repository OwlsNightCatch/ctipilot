    text: "Kaspersky's Global Emergency Response Team reconstructs an April 2026 incident at a Middle East manufacturing organization in which an attacker with GPO-write privileges authored a Group Policy Object that dropped ransom notes, disabled the local Administrator account and replaced the lock-screen wallpaper domain-wide across every Windows workstation, plus a second, independently deployed Group Policy Object that disabled Windows Firewall, using only native Group Policy client-side extensions: no ransomware binary, no file encryption and no endpoint persistence on any Windows system. Separately, the same incident deployed an actual PAYLOAD ransomware binary against the organization's ESXi/Linux servers, and data exfiltrated from file servers was later published on the dark web."
