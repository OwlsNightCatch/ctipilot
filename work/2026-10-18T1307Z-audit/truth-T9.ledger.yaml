    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "body"
    kind: derived
    text: "A device that ran a vulnerable build is not evidence of compromise, and no published signature exists to check for one."
  - claim_id: c48fd29324
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-02T09:11:52Z"
    kind: cited
    text: "Researchers at Calif published a public proof of concept for CVE-2026-86950 on 2026-09-30, built from a public binary comparison of iOS 26.7 and 26.7.1: a PDF with a crafted TrueType font that triggers a controlled out-of-bounds write in CoreGraphics and crashes unpatched iPhones and Macs, with generation scripts and a sample PDF in a public GitHub repository ("
    urls: ["https://thehackernews.com/2026/10/apple-coregraphics-poc-emerges-as.html"]
  - claim_id: 8b9446a0c3
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-02T09:11:52Z"
    kind: cited
    text: "Calif demonstrates a crash and a controlled write to two adjacent 16-bit values, not code execution, did not obtain the in-the-wild sample and cannot say how the attacker completed the chain ("
    urls: ["https://thehackernews.com/2026/10/apple-coregraphics-poc-emerges-as.html"]
  - claim_id: 9bb4aa1994
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-02T09:11:52Z"
    kind: cited
    text: "The harness reaches the flaw through the ImageIO thumbnail path an app uses to preview a received attachment ("
    urls: ["https://thehackernews.com/2026/10/apple-coregraphics-poc-emerges-as.html"]
  - claim_id: 9195b2ad9c
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "section 2026-10-02T09:11:52Z"
    kind: cited
    text: "Calif pointed to new font-checking code in WhatsApp's attachment scanner as circumstantial evidence of a possible delivery path; the published analysis does not describe or test that path, a WhatsApp sentence in the first version was removed after publication, and WhatsApp has published no advisory linking the flaw to its products ("
    urls: ["https://thehackernews.com/2026/10/apple-coregraphics-poc-emerges-as.html"]
  - claim_id: 636a04f815
    entry: 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev
    surface: "record 2026-10-02T09:11:52Z"
    kind: record-summary
    text: "Calif published a public proof of concept on 2026-09-30 that crashes unpatched iPhones and Macs through a PDF with a crafted font, built from a public comparison of the 26.7 and 26.7.1 builds; it shows a controlled out-of-bounds write but not code execution, and the WhatsApp delivery path Calif speculated about is not described or tested."
