claims:
  - claim_id: 4062dd954a
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "headline"
    kind: frontmatter
    text: "Exploited WordPress plugin XSS ends in a hidden admin and persistence that patching does not remove"
  - claim_id: 4fa53d58b6
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "summary"
    kind: frontmatter
    text: "Patchstack reports that since 2026-10-04 one campaign has been exploiting two unrelated stored cross-site scripting flaws, CVE-2026-93836 in WPC Product Bundles for WooCommerce up to 8.6.6 and CVE-2026-94504 in Ninja Forms up to 3.15.3, by planting a script in an order or a form submission that runs when a logged-in administrator opens it. The script uses the administrator's own session to install a malicious plugin and create administrators, one of them hidden from the Users screen, and leaves four independent ways back in, so updating to Ninja Forms 3.15.4 or WPC Product Bundles 8.6.7 stops new injections but does not evict an implant. Patchstack says exploitation volume is limited so far and that the second stage works with any stored XSS that reaches an administrator."
  - claim_id: 3a25b905f9
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "actions[0]"
    kind: frontmatter
    text: "Update Ninja Forms to 3.15.4 or later and WPC Product Bundles for WooCommerce to 8.6.7 or later on every WordPress site, then check each site for an implant the update does not remove, starting with a comparison of the database's administrator list against the Users screen and an inspection of the must-use plugins directory by content."
  - claim_id: 1a738de290
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "actions[1]"
    kind: frontmatter
    text: "On any site where an administrator opened a Ninja Forms submission or a WooCommerce order since 2026-10-04 and an implant turns up, rotate all privileged credentials and the WordPress authentication salts and treat the oldest administrator account as compromised, because a login URL planted by the implant authenticates as that account."
