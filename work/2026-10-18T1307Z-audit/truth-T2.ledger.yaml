    surface: "body"
    kind: cited
    text: "On an appliance that was exposed before the September hotfix, SonicWall's earlier guidance still applies: check for indicators of compromise and, if any are found, re-image or redeploy the appliance, change user and administrator passwords and reset the TOTP tokens; SonicWall has given no such instruction for the new flaws ("
    urls: ["https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html"]
  - claim_id: 0f871e6406
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "Previdian's reported attempts are OPTIONS requests to the Work Place Extraweb interface that try to reach the appliance's internal CouchDB service on the loopback address, port 5984, traverse into a design document and invoke its _rewrite function, with an HTTP Basic Authorization header carrying a default-style administrator credential, so the same web access log is the place to look for OPTIONS requests that carry an Authorization header and name a loopback address ("
