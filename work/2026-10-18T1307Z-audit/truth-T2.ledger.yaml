    text: "On the Cybercrimepolice platform, dated 2026-10-13, the cantonal police warn that after a cyberattack on a software provider of a pension fund, criminals could use the leaked personal and financial data to phone those affected and lure them into fraudulent investments of their pension assets (translated from German); the page describes a ransomware attack at the end of September and names no company ("
