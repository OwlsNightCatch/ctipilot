    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "headline"
    kind: frontmatter
    text: "A Defender bypass that needs no vulnerability: fill the disk during every update and the engine stays up, stale"
  - claim_id: 77d3f33cec
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "summary"
    kind: frontmatter
    text: "LevelBlue SpiderLabs reproduced BigDiskBuster, a proof of concept published on GitHub on 2026-09-19 by the actor known as MSNightmare, which watches the C: volume for Defender update activity and claims the free space so each update fails while the Defender service keeps running and real-time protection stays on. It runs from a standard account and has no CVE or patch; Microsoft says Defender Antivirus detects the proof of concept, and no use in attacks is reported."
  - claim_id: 9086d08739
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "LevelBlue SpiderLabs reproduced BigDiskBuster, a proof of concept published on GitHub on 2026-09-19 by the actor known as MSNightmare (Nightmare Eclipse) that needs no vulnerability to keep Microsoft Defender from updating ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 7eac498df8
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "It watches the C: volume for Defender update activity and, when an update begins, creates a hidden file whose allocation claims essentially all free space; the update runs out of room and fails, Defender cleans up its staging directory and the tool repeats the process on the next attempt ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 1305aeb69f
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "The Defender service keeps running and real-time protection stays on; in LevelBlue's lab no alert appeared, and the only visible artifact was a stale security-intelligence version and the generic update error 0x80070643 ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: a522dfe5e4
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "The roughly 300 lines of C++ use no memory corruption or kernel component: a raw handle on the volume device, a file opened relative to that handle, a recursive watch of the volume and an oversized allocation, with the file hidden and deleted on close ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 520e6aca37
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "It ran under a standard user account on a default Defender installation ("
    urls: ["https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates"]
  - claim_id: 3310bfe57c
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "No CVE, patch or Microsoft advisory exists; a Microsoft spokesperson told Dark Reading that Defender Antivirus includes detections and preventions against the proof of concept and that customers should keep security intelligence and platform updates current ("
    urls: ["https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates"]
  - claim_id: f4a242085b
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "The GitHub repository has been taken down, and Dark Reading notes that the technique could in theory extend the life of malicious tooling already on a machine by withholding new detections ("
    urls: ["https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates"]
  - claim_id: 05ffb9ef9b
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows endpoints running Defender Antivirus; it ran under a standard user account in LevelBlue's testing ("
    urls: ["https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates"]
  - claim_id: 1c4cad9ad9
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "), and an estate shows the effect as endpoints whose security-intelligence age keeps growing ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: d2be2d5e87
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Detection:** monitor whether Defender's content is staying current rather than whether the service runs: repeated update failures with error 0x80070643 and no installer activity, and an abrupt drop of free space on the system volume while the update chain (platform update, signature stub, recovery) runs and fails ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 9a40524d8a
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "In endpoint file-handle or ETW telemetry, a non-Defender, non-TrustedInstaller process holding a handle on MRT.exe is a high-confidence signal, and the same process also holding a raw handle on the volume device is rated critical; short-lived hidden GUID-named files in the user temp directory during update failures corroborate it ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 457e514b7c
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Triage:** a handle on the volume device alone is low-specificity because svchost, SearchIndexer, dllhost and TiWorker hold the same kind of handle in normal operation; in LevelBlue's tested environment only the Defender service processes and TrustedInstaller legitimately held a handle on MRT.exe ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: d88795e13a
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** add an alert on Defender security-intelligence age and on repeated update failures, since a running service no longer proves current protection, and keep the handle correlation as the hunt for a process that is actively doing it ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 3558801bbc
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: uncited
    text: "No source reports use in an attack."
