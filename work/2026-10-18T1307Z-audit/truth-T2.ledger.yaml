    surface: "record 2026-10-13T03:38:20Z"
    kind: record-summary
    text: "Publica's own page of 2026-10-08 lists civil status and the IBAN among the data that could be affected and says its investigation indicates personal data of insured persons has presumably left. The AWP agency relays the software firm's position that it knows data left but not yet whether personal data is among it, that it may be business data, and that the volume is rather small."
  - claim_id: 81f7397d2d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-15T03:48:00Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, says on 2026-10-13 that it currently uses another provider, plans to move to PK Softech's system in early 2027 and is checking whether data from migration tests was affected. Publica's page says as of 2026-10-14 that it has no indications that data from the attack was published on the darkweb."
