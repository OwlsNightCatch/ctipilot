  - claim_id: 9fa744ca09
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "summary"
    kind: frontmatter
    text: "Huntress observed from 2026-10-07 23:20 UTC attackers chaining two AhsayCBS flaws, CVE-2026-105133 (authentication bypass) and CVE-2026-105134 (code execution as SYSTEM through the Replication Receiver API), against internet-exposed servers of the backup management console that managed service providers and system integrators mainly use, dropping JSP webshells and an XMRig cryptominer; Bitdefender MDR investigated three intrusions through the same chain, and CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-14. Ahsay now says its earlier patches v9.15.2.59 and v10.3.4.0 did not fully address the flaws, so servers on them are still exposed; the fixes are the hotfixes v10.3.4.45 (v10) and v9.15.2.70 (v7, v8 and v9), available only to partners with a portal login, and a server that was reachable before the hotfix needs a compromise check."
  - claim_id: 2716d80919
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every AhsayCBS server your organisation or your managed-service suppliers run, including those already on v10.3.4.0 or v9.15.2.59, and apply the hotfix v10.3.4.45 (v10) or v9.15.2.70 (v7, v8, v9) now, then reboot it; the hotfixes sit behind Ahsay's partner portal, so ask the integrator or Ahsay for the build, and until it is applied keep the management web interface behind a VPN or an allowlist of trusted addresses."
  - claim_id: 1244639107
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[1]"
    kind: frontmatter
    text: "Compromise-check every AhsayCBS server that was internet-reachable since 2026-10-04 against the indicators Huntress and Bitdefender publish, an OpenSSH service nobody installed included, and against Horizon3's server-side checks (new .jsp files in served application directories, replication receivers created outside a change window, unexpected system administrator accounts), and re-image any host with a confirmed compromise from a trusted backup, because the hotfix does not remove a webshell or a persistence mechanism that is already there."
