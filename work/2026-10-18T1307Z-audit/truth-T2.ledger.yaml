    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, now says in its notice of 2026-10-15 that its inquiries indicate personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch, was stolen, and that which fields were taken is still being clarified. Pensionskasse Post says in its notice of the same date that personal data did leave and no longer repeats its earlier anonymisation statement, though it is still unclear whether its insured persons' data is among it."
  - claim_id: 9de212c7a4
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "headline"
    kind: frontmatter
    text: "Citrix: a new NetScaler SAML overflow, rated Critical, reaches the builds that fixed the previous one"
  - claim_id: cc3bab4407
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "summary"
    kind: frontmatter
    text: "Citrix's bulletin CTX697191 (2026-10-08, severity Critical) fixes CVE-2026-107406, a memory overflow in customer-managed NetScaler ADC and Gateway that leads to remote code execution or denial of service (CVSS 4.0 9.5) when the appliance is configured as a SAML service provider or identity provider. An identity-provider appliance is affected through the 14.1-73.41 and 13.1-64.28 builds that Citrix named for CVE-2026-88779 and must move to 14.1-73.46, 13.1-64.29 or the FIPS builds; Citrix says it is not aware of any unmitigated exploits."
  - claim_id: 291cfdc165
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade each SAML identity-provider NetScaler (`add authentication samlIdPProfile`) straight to 14.1-73.46, 13.1-64.29, 14.1-73.46 FIPS or 13.1.37.283 (13.1-FIPS and NDcPP), including appliances already on 14.1-73.41 or 13.1-64.28; a service-provider-only appliance (`add authentication samlAction`) below 14.1-73.37 or 13.1-64.23 (FIPS and NDcPP: 13.1-37.279) needs the same builds."
  - claim_id: fb5b982721
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "cves[CVE-2026-107406]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-107406\", \"cvss\": \"9.5\", \"status\": [\"patch-available\"], \"affected\": \"NetScaler ADC and Gateway before 14.1-73.37 and before 13.1-64.23 (ADC 14.1-FIPS before 14.1-73.37 FIPS; ADC 13.1-FIPS and 13.1-NDcPP before 13.1-37.279) when configured as a SAML service provider or identity provider; as a SAML identity provider only, also 14.1-73.37 through 14.1-73.41, 14.1-FIPS 14.1-73.37 FIPS through 14.1-73.41 FIPS, 13.1-64.23 through 13.1-64.28 and 13.1-FIPS and 13.1-NDcPP 13.1-37.279 through 13.1-37.282\", \"fixed\": \"14.1-73.46 and later; 13.1-64.29 and later; 14.1-FIPS 14.1-73.46 FIPS and later; 13.1-FIPS and 13.1-NDcPP 13.1.37.283 and later\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: bfee322474
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "body"
    kind: cited
    text: "Citrix's bulletin CTX697191 describes CVE-2026-107406 as a memory overflow (CWE-119) in customer-managed NetScaler ADC and NetScaler Gateway that leads to remote code execution or denial of service; the CVSS 4.0 vector is network, high attack complexity, no privileges, no user interaction, base score 9.5, and Citrix rates the bulletin Critical ("
    urls: ["https://support.citrix.com/external/article/CTX697191/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 1adaed7651
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
    surface: "body"
    kind: cited
    text: "The precondition is a SAML configuration: the appliance must be a SAML service provider or a SAML identity provider ("
    urls: ["https://support.citrix.com/external/article/CTX697191/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 135e35735f
    entry: 2026-10-09/cve-2026-107406-citrix-netscaler-saml-idp-overflow
