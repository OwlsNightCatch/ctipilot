    surface: "actions[0]"
    kind: frontmatter
    text: "Find every RouterOS device whose www or www-ssl service answers from a network you do not trust and upgrade it to the fixed build for its channel: 7.24 or later on v7 stable, 7.23.8 on v7 long-term, 6.49.23 on v6 long-term; where an upgrade has to wait, restrict www and www-ssl under IP > Services to trusted addresses or disable them and manage the router over WinBox, SSH or a VPN."
