  - claim_id: 57436769e2
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Patchstack reports two unrelated stored cross-site scripting flaws that deliver the same second-stage script, first seen on 2026-10-04 against WPC Product Bundles for WooCommerce (CVE-2026-93836) and on 2026-10-05 against Ninja Forms (CVE-2026-94504) ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: eee196d2a0
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "No account is needed: a numeric-prefixed quantity keeps attacker markup in WooCommerce order data, and a textarea submission sent through the normal form endpoint is stored and rendered without safe encoding in the legacy Ninja Forms submission editor ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 25ab91fc31
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "The script runs when a logged-in administrator opens the order or submission, rides that session in wp-admin without reading the cookie, so HttpOnly does not help ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 4809c3a36c
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "With that session it uploads a plugin through WordPress' own installer, creates an administrator and calls a persistence installer ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 32cbed3420
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Patchstack counts four ways back in: the visible administrator; a second administrator that a dropped must-use plugin hides from the Users list, its filters and its role counts; a login URL, backed by another must-use plugin, that authenticates as the site's oldest administrator; and an unauthenticated file manager in the uploaded plugin that runs only on a direct request and can write files anywhere writable ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 0abe69ba1e
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "The must-use plugins are backdated to the oldest file time in the WordPress root, so a search for recently changed files misses them ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 487e61a16a
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Both flaws were disclosed on 2026-09-22; Patchstack says exploitation volume is limited and that the second stage works with any stored XSS that reaches an administrator ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 302c6dc848
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "The fixed versions are Ninja Forms 3.15.4 and WPC Product Bundles 8.6.7, and updating does not clean an existing infection ("
    urls: ["https://www.bleepingcomputer.com/news/security/ninja-forms-plugin-flaw-exploited-to-hack-wordpress-sites/"]
  - claim_id: 23744f8031
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "**Exposure:** WordPress sites running Ninja Forms 3.15.3 or older, or WPC Product Bundles for WooCommerce 8.6.6 or older, where an administrator opens form submissions or orders in wp-admin ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 254875170c
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "**Detection:** in web server logs, public POSTs to the plugin's form-submit endpoint or to a product URL whose fields carry script or an image error handler that loads a remote script; in WordPress audit and database records, a plugin-upload install, a user creation and a call to a persistence installer around the time an administrator opens a submission or an order, administrator rows in the users and metadata tables that the Users screen does not list, PHP files under the must-use plugins directory that the Plugins screen never shows, and requests to the login page carrying a token parameter ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 66d70b70b0
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: cited
    text: "Updating does not evict an implant: Patchstack says to remove the unauthorised accounts and plugins and the dropped files, rotate privileged credentials and authentication salts, and treat the oldest administrator's password as compromised even though it was never directly stolen ("
    urls: ["https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/"]
  - claim_id: 291adfd765
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate administrator installing a plugin from a ZIP produces the same plugin-install and user-creation events; the discriminators are that they follow an administrator opening a stored submission or order, that the installed plugin poses as a thumbnail cache and does nothing when WordPress loads it, and that the new administrator is missing from the Users list."
  - claim_id: bff6380160
    entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update both plugins now, then treat any site where an administrator opened a stored order or submission since 2026-10-04 as possibly compromised until the database administrator list, the must-use plugins and the oldest administrator's credentials have been checked, because the patch closes the injection and none of the persistence routes."
  - claim_id: 797627be2c
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "headline"
    kind: frontmatter
    text: "CloudSEK: a Gentlemen affiliate reached victims through stolen GitLab CI/CD secrets and drove attacks over MCP"
  - claim_id: d96e795592
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "summary"
    kind: frontmatter
    text: "CloudSEK analysed two exposed servers of \"Azazel\", a Russian-speaking affiliate of the Gentlemen ransomware group who also ran his own leak site, and reports about 6 TB of stolen data from some two dozen organisations, among them government-adjacent infrastructure. It says every confirmed victim was reached through stolen CI/CD secrets, mainly GitLab variable stores and git history, that one deeper intrusion into an AI platform chained server-side request forgery, a recovered master key that decrypted the configuration and a token recovered from git history, and that Azazel drove attack commands through an MCP server on a local port. The report is a single source and names no victim."
  - claim_id: a66cdd2ca4
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "CloudSEK reports that an exposed open directory and a misconfigured storage server revealed the operation of \"Azazel\", a Russian-speaking affiliate of the Gentlemen ransomware group, who used the group's tooling, negotiation channels and ransom-note template but published victims on a leak site of his own and kept the proceeds, so the Gentlemen operator lost the revenue ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: e260d40db6
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Two servers held about 6 TB of stolen data from some two dozen victims, spanning logistics, insurance, pharmaceutical, AI, medical-device and government-adjacent organisations ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 713b994844
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Every victim outside one deeper intrusion was reached the same way: GitLab CI/CD variable stores and git history were mined for tokens, database credentials, API keys and SSH private keys with enumeration and secret-scanning tools, and one GitLab instance that served two unrelated organisations gave footholds at both ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 74b38ec276
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "From one CI/CD token the actor reached more than 150 databases, payment gateways and hundreds of source repositories across a SaaS platform and its clients, and at a platform hosting a government-linked financial registry it exfiltrated more than 120,000 records and then killed the PostgreSQL process and deleted the production data directory ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: cfcc47b912
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "The deeper intrusion, into an AI platform, ran for weeks: an API that fetches user-supplied URLs server-side gave an unauthenticated route into the internal network, a recovered master key decrypted every secret in the cluster configuration, a hardcoded authentication-bypass token that had been removed from the code but stayed in git history gave lasting access, offline cracking was run against administrator hashes from the monitoring stack, and an object-storage bucket was mirrored continuously ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: a45c88ebbb
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "Ransom notes were pushed to eight surfaces, among them the login message, the SSH banner, a database configuration parameter, a database-admin login template, a repository README and an issue opened against the victim's project, and CloudSEK reports that the verification script drove these checks through an MCP server bound to a local port, an operational use of MCP as an attack execution channel of which CloudSEK has not identified earlier public reporting ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: eecae9bd40
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Exposure:** self-hosted GitLab where CI/CD variables are unmasked or unprotected or where removed secrets remain in git history, GitLab instances that run pipelines for more than one organisation, APIs that fetch user-supplied URLs without validation, and MCP servers reachable beyond strict loopback ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 4b37575a2f
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Detection:** CI/CD and repository audit logs for variable reads from unexpected addresses, service-account token use outside the normal runner infrastructure, and README or issue changes made with a pipeline token from an unusual source; object-storage and database logs for bulk mirroring or dumps to hosts outside the backup estate; MCP initialisation requests from clients outside an allowlist; and a PostgreSQL process killed and its data directory deleted after a large read ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 415889152d
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Triage:** legitimate backup jobs also mirror object storage to remote destinations, so the discriminator is the destination and the source host, not the copy command itself ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: da32c31118
    entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat CI/CD variable stores and git history as credential stores: keep secrets in a dedicated secrets manager, mask and protect every variable, rotate tokens and audit history for removed secrets, because the actor recovered credentials from commits that no longer appeared on the current branch; never bind an MCP server beyond loopback and treat its command-execution tool as privileged with an audit trail ("
    urls: ["https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files"]
  - claim_id: 90830f431f
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "headline"
    kind: frontmatter
    text: "Unit 42: a coding-test Visual Studio project executes on open, then disables ETW and takes tasking from GitHub"
  - claim_id: 0266d6580b
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 describes a March 2026 campaign by an Iranian-nexus cluster it calls CL-STA-1178 against an individual in Iraqi critical infrastructure, in which a recruiter persona impersonating Dubai Airports IT sent a coding-test Visual Studio project whose project file runs code during the design-time build, before any compile. The chain then hijacks the .NET AppDomainManager through a configuration file that disables ETW, sideloads a DLL, and uses the GitHub API and issue comments for command and control, with PowerShell run inside the hijacked process so no powershell.exe starts. No Swiss or European target is reported and Unit 42 is the only source."
  - claim_id: 0eff3aec69
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "Unit 42 tracks an Iranian state-aligned cluster as CL-STA-1178 and names its March 2026 campaign against an individual in Iraqi critical infrastructure \"Blinder Tunnel\"; the infrastructure was staged from November 2025, and the same actor ran conflict-themed Google Drive credential phishing against an Israeli entity in May and June 2026 ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: f86899ad00
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "A recruiter persona impersonating the Dubai Airports IT department sent a decoy career-portal installer and then a weaponised C# Visual Studio project as an at-home coding test ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 05f7993b09
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "When a developer opens a project, Visual Studio runs a design-time build in the background, and the project file overrides one of the targets that step runs, so the payload executes at project load, before any compile; it copies binaries into a folder under the user profile and launches one of them ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: bd52a09edf
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "A configuration file beside it replaces the .NET application's default app-domain manager with a malicious one and sets the ETW enable flag to false, which Unit 42 says could impair detection, and the loader, ShelbyLoader V2, then arrives through DLL sideloading ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: fc3154a054
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "The loader persists through a current-user startup registry value, authenticates to the GitHub API with a hard-coded personal access token for tasking, and falls back to encrypted routing data in comments on GitHub issues; a follow-on module hooks the PowerShell engine inside the hijacked process, so commands run without starting powershell.exe, and a second loader, Blackwood, runs the open-source Chisel tunnelling tool in memory to give a reverse SOCKS proxy into the victim's network ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 6d2c1499e0
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "GitHub removed the malicious infrastructure Unit 42 identified, and Unit 42 is not aware of any breach of Dubai Airports ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 3b96fcf144
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "**Exposure:** developers and IT staff who open third-party Visual Studio projects, such as recruiter coding tests or contractor repositories, on workstations that can reach the GitHub API; no Swiss or European target is reported ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 57e2685c8e
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "**Detection:** process-creation lineage showing Visual Studio or the build engine copying executables into a user-profile folder and launching one at project open; a renamed, signed Microsoft host binary with a sidecar configuration file that names an app-domain manager or turns ETW off; binaries that load unknown or non-standard DLLs outside system directories, which Unit 42 advises monitoring; non-browser, non-git processes calling the GitHub API with a token or searching issues; and the PowerShell engine loaded into a process that is not a PowerShell host ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 598e672817
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat a recruiter-supplied or third-party Visual Studio project as untrusted code before it is ever built, since Unit 42 reports execution at project load, and watch for the sideload and configuration-file signals above on developer workstations; Unit 42's own advice is to secure developer environments and monitor anomalous cloud-platform traffic ("
    urls: ["https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/"]
  - claim_id: 962f0d2d29
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: uncited
    text: "The launched binary is a renamed, signed Microsoft Visual Studio hosting process."
  - claim_id: 9af18ec80a
    entry: 2026-10-07/cl-sta-1178-blinder-tunnel-csproj-lure-github-c2
    surface: "body"
    kind: derived
    text: "**Triage:** developers legitimately build projects and call GitHub, so the discriminators are that execution starts at project open rather than at a build the developer chose to run, a DLL beside a renamed signed host binary that does not belong to it, and a configuration file that changes ETW or app-domain settings."
  - claim_id: b74cb735dd
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "headline"
    kind: frontmatter
    text: "NCSC.ch now rates the SonicWall SMA1000 pre-auth SSRF actively exploited; SonicWall still reports no evidence"
  - claim_id: 3ef3e747c1
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "summary"
    kind: frontmatter
    text: "SonicWall's advisory SNWLID-2026-0017 (2026-10-06) fixes four SMA1000 flaws, led by CVE-2026-102255, a pre-authentication server-side request forgery in the Work Place interface (CVSS 3.0 10.0) that affects 12.4.3-03526 and 12.5.0-02952, the hotfixes issued for the September zero-days; fixed builds are 12.4.3-03670 and 12.5.0-03082. Two honeypot operators report exploitation attempts against the flaw, Defused from 2026-10-08 and Previdian from 2026-10-09, and NCSC Switzerland recorded it as actively exploited on 2026-10-12, without anyone establishing that an attempt would have compromised a system; SonicWall's advisory still says it has no evidence of exploitation. The two earlier unauthenticated Work Place SSRF flaws this year were exploited, each paired with an administrator-only command-execution flaw."
  - claim_id: bffd45574a
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "actions[0]"
    kind: frontmatter
    text: "Install SonicWall's platform hotfix 12.4.3-03670 or 12.5.0-03082 (or higher) on every SMA1000 6210, 7210 and 8200v, internet-reachable appliances first and including appliances already on the 12.4.3-03526 or 12.5.0-02952 hotfix from September; the appliance restarts when the installation finishes and no workaround is listed."
  - claim_id: 34f17819f8
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "actions[1]"
    kind: frontmatter
    text: "On every SMA1000 whose Work Place interface was internet-reachable before the hotfix, check its web access log back to 2026-10-06, the day the advisory was published, for the requests Previdian describes and, on a hit, run the compromise check SonicWall's earlier guidance describes."
