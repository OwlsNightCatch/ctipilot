    surface: "record 2026-10-16T04:11:00Z"
    kind: record-summary
    text: "Cantonal police warn that criminals could use the leaked salary and pension data to phone insured persons with investment-fraud offers, SwissCybersecurity.net ties the warning to PK Softech, and the Zurich cantonal fund BVK says its PK Softech software runs in its own data centre so it is not directly affected; PK Softech can neither confirm nor rule out further affected customers, and the Ticino fund listed as a customer has made no statement."
