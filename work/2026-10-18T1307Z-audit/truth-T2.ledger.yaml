    text: "IDC Frontier, a SoftBank Group subsidiary, says a ransomware attack from about 3:40 a.m. on 2026-10-07 stopped four zones of its IDCF Cloud East Japan Region 1, affecting 495 companies and local governments. Its fifth report (2026-10-14) says its backup data is safe and retrievable for the 194 affected customers that used its snapshot function, and that it found no trace of data in customers' virtual servers being queried or taken, while confirming improper queries of the portal registration data of 48 customers; the intrusion route is not public."
