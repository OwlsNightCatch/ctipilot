    kind: cited
    text: "**Defender takeaway:** treat a link on a trusted cloud-hosted domain that leads to a download as untrusted in mail protection and user-reporting workflows, restrict remote-management software to approved instances, and check endpoints with more than one remote-management client, looking back to 2026-09-10 ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
