  - claim_id: 05abffa9fe
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "headline"
    kind: frontmatter
    text: "ReliaQuest: AI agents took a Tomcat server to SYSTEM in under a day through an exposed job-submission feature"
  - claim_id: 8c825ffdc9
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "summary"
    kind: frontmatter
    text: "ReliaQuest assesses with high confidence that LLM-driven agents carried out substantial parts of an intrusion it investigated, using only known techniques: an internet-facing Apache Tomcat application accepted Spring Batch job definitions without a login, jobs ran JavaScript through the Nashorn engine inside the application process, plaintext SQL Server sysadmin credentials from the application's configuration led to xp_cmdshell, and two public privilege-escalation tools reached SYSTEM. ReliaQuest names no victim, sector or region, nor the vendor of the exposed application, and could not determine how many agents ran, which model drove them or how much a person approved."
  - claim_id: b46e34b12e
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "ReliaQuest says the attacker needed no zero-day and no new malware: an internet-facing Apache Tomcat application used Spring Batch, in which a task definition names the code to run, and accepted and ran task descriptions without a login ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: db98c833d1
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The decisive step was submitting tasks that invoked Nashorn, the JavaScript engine in the application's Java environment, so the code ran inside the application with its account privileges and created no child process until a shell was spawned later; results came back through deliberately triggered error messages, in fixed 1,800-byte chunks reassembled over hundreds of requests ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: f7bb04a6b5
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The application's configuration files held plaintext credentials with SQL Server sysadmin rights; the attacker enabled xp_cmdshell, found SeImpersonatePrivilege, uploaded PrintSpoofer and GodPotato in base64 fragments through the same channel and reached SYSTEM when the first tool failed on file permissions and the second worked ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 7e87dedbca
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "With SYSTEM it saved the SAM, SYSTEM and SECURITY registry hives for offline extraction, created two local administrator accounts and deleted only one, and removed artifacts after the actions that produced them ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: d7b92a3f6d
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The agent-driven reading rests on a live, unauthenticated Cairn agent-orchestration dashboard (an open-source platform for coordinating AI agents; no source says whether it is the Cairn exploitation engine of Gambit Security's reporting, and it is not Talos' CAIRN toolkit) on the address that sent the opening requests, on command timing (roughly half the gaps five seconds or less), on job names that tracked read offsets and upload parts without a gap, on machine-readable pipe-delimited output, and on payloads whose next version repaired the fault the previous one returned; ReliaQuest says no single indicator establishes it and that it could not determine how many agents ran, which model drove them or how much a person approved ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 96f9878a1e
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "Submission and collection ran from different addresses, so blocking the submitting address alone would not have stopped retrieval, and the tool assembly is not a fingerprint for any group ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: aaa935c3c6
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "**Exposure:** an internet-reachable Spring Batch or comparable job-submission or job-management feature that accepts task definitions without authentication, on a Java runtime that still provides the Nashorn engine; ReliaQuest names no vendor or product for the exposed application ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 0bdce58009
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "In database and host telemetry, look for xp_cmdshell being enabled followed by operating-system commands from the database service account, for impersonation-privilege escalation tools, and for the SAM, SYSTEM and SECURITY hives being saved ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 8daa18c253
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** require authentication on every exposed job-management endpoint, keep database credentials out of application configuration files and give the service account only the rights it needs, and scope an incident of this kind from the application's job records rather than from what survives on disk; a leftover local administrator account is part of the check, since one of the two created here was left in place ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: 7f11c6a17e
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: derived
    text: "**Detection:** application job definitions, execution and step history, exceptions and exit descriptions are the record that outlasted the attacker's deleted files, so retain them beside web, database and endpoint logs and hunt for unusual job volume or sequencing together with unexpected script-engine use and output returned through error messages; Nashorn errors were almost absent from the baseline history and tracked the malicious jobs."
  - claim_id: 84572d0e2c
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: derived
    text: "ReliaQuest treats command cadence as a useful signal and not as a stand-alone detector."
