  - claim_id: a9041b0c03
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "**Detection:** in web proxy or mail click logs, a click on a Power BI view link followed within seconds by a new tab on an unfamiliar domain and an executable download; in endpoint process telemetry, a ScreenConnect client installer started from a browser download, a client service connecting to a ScreenConnect instance that is not the organisation's own, that client spawning a command shell and PowerShell from a temp directory, a second remote-management client appearing as the first is removed, and a scheduled task that re-runs a script every two minutes ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: 490fa7ebcf
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "**Triage:** ScreenConnect is legitimate where the organisation runs it; the discriminators are an instance that is not the organisation's own and an installer that arrived through a browser download from a web page rather than through IT's deployment tooling ("
