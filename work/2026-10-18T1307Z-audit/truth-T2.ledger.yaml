    surface: "body"
    kind: cited
    text: "**Detection:** the evasion text has to be plaintext, so imperative language addressed to an analysis system inside a binary or script is itself a stable signal; extracted strings and script comments are the telemetry class to search ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
