  - claim_id: 1a63b351f4
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a phishing campaign seen since 2026-09-10 in which an Outlook email links to a fake reference document on a legitimate Power BI domain; a \"Download Reference\" button opens an attacker page that fingerprints the visitor and then downloads a ScreenConnect installer. The installer deploys a rogue ScreenConnect client that establishes a second one, and in one incident a PowerShell script removed the first; Huntress could not obtain the original email, and the configuration of one of the rogue clients also appeared on 22 other endpoints."
  - claim_id: fc75ba11fc
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "Huntress describes a phishing campaign it has seen since 2026-09-10 in which an Outlook email carries a link that leads to a fake reference document on a legitimate Power BI domain ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: cb8ee76888
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "Huntress notes that threat actors have previously abused Power BI in this way, building a real dashboard under an account of their own (usually compromised or throwaway), embedding a malicious link and setting its sharing to public, and that because the link points to Microsoft's real domain it passes Microsoft 365 mail filters and other gateways that trust that domain; it does not say how this campaign's page was set up ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: 23ab0468a4
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "A \"Download Reference\" button opens a new tab on an attacker domain that fingerprints the visitor (operating system, browser, automation indicators, cloud-provider cookies), reports victims to a Telegram bot and redirects visitors who fail its checks; after a delay a script clicks a hidden download link for a ScreenConnect installer ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: 714709b255
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "The installer deploys a first rogue ScreenConnect client, which establishes a second one pointed at different infrastructure ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
