    kind: record-summary
    text: "The supplier's customers are now named: the Bernische Pensionskasse (canton of Bern staff and three cantonal universities) says its supplier is the same company that serves Publica, the Bernische Lehrerversicherungskasse and Pensionskasse Post report the supplier incident, and Inside IT lists Migros-Pensionskasse and Syngenta Pensionskasse among the customers. None of the funds has confirmed which member data left."
