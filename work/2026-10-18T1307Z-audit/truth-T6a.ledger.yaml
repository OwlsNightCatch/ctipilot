  - claim_id: aff6c4d43d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "summary"
    kind: frontmatter
    text: "Zimbra shipped ZCS 10.1.20 on 2026-07-20 with a fix for a command injection in the SNMP monitoring component, and the identifier CVE-2026-73570 followed on 2026-08-13. Microsoft Threat Intelligence now reports confirmed intrusions in more than one region and industry, with probing of the injection point from 2026-07-28, before disclosure, and CISA lists the flaw in KEV (added 2026-08-21). The flaw needs no authentication and applies only where the optional zimbra-snmp package is installed and SNMP notifications are enabled; Microsoft's cases combined web shells, root escalation, theft of Zimbra's authentication keys and cluster-wide movement, so an upgrade does not evict an attacker already inside. CSIRT Italia reports that exploitation of this flaw has also led to ELock-family ransomware, cryptomining and theft of the LDAP database and credential hashes on exposed servers, and found no intrusion on regularly updated instances."
  - claim_id: 4d61692ecf
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Zimbra Collaboration host to 10.1.21 (10.1.20 is the minimum for CVE-2026-73570); where the upgrade cannot happen at once, remove the zimbra-snmp package or disable SNMP notifications and restrict SNMP and SMTP to trusted hosts."
  - claim_id: 466fc19dbd
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every host that ran a build before 10.1.20 with SNMP notifications enabled at any time since 2026-07-28, upgrading is not enough: rotate all domain zimbraPreAuthKey values and run the compromise check on every mailbox node, covering the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, JSP or stray text files under /opt/zimbra/jetty_base/webapps/zimbra/public, droppers in /tmp and /var/tmp, and outbound connections from the mail server; where web shells or an LDAP dump turn up, rotate every mailbox and administrative credential."
  - claim_id: a1ea8eb86b
