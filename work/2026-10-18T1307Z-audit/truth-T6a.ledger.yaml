  - claim_id: d6ecc38180
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "record 2026-08-06T04:11:48Z"
    kind: record-summary
    text: "CISA added CVE-2026-63077 to its Known Exploited Vulnerabilities catalog on 2026-08-05 based on evidence of active exploitation, changing the status of the unauthenticated JetBrains TeamCity On-Premises remote-code- execution flaw covered here on 2026-07-29 from patch-available to confirmed exploited. JetBrains' advisory, unchanged since 2026-07-27, still records that it was not aware of any active exploitation at publication. No authority has named an exploiting cluster or the observed intrusion path. Because every On-Premises version ever shipped is affected and the flaw needs only HTTP(S) reachability, any TeamCity server that was internet-reachable and unpatched before 2026-08-05 now warrants a compromise assessment rather than only an upgrade."
  - claim_id: 9fea9345ef
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "record 2026-09-30T06:52:00Z"
    kind: record-summary
    text: "CISA's Known Exploited Vulnerabilities catalog now marks CVE-2026-63077 as used in ransomware campaigns. Ransomware operators are now exploiting the unauthenticated TeamCity On-Premises RCE, so any server that was reachable and unpatched needs the compromise assessment, not only the upgrade. The summary and main text no longer say exploitation is unobserved. CWE-502 now cites CISA's KEV record, and a numeric score that no citable source publishes is removed. JetBrains' 2026-08-07 confirmation of active exploitation and its log indicators lead the detection and triage lines, an Exposure line gives the fixed versions, TeamCity Cloud is described as already mitigated rather than unaffected, the sourcing note describes only cited sources, and two citation dates follow the pages."
  - claim_id: 4eb8dfbad3
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "headline"
    kind: frontmatter
    text: "VulnCheck's canaries show attackers exploiting a Langflow pre-auth RCE with no documented fix and no KEV entry, while the next CVE number is KEV-listed"
  - claim_id: 3cdf2784a9
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "summary"
    kind: frontmatter
    text: "VulnCheck reported on 2026-07-28 that it has observed attackers gaining initial access to Langflow through CVE-2026-0769, harvesting credentials, deploying cryptominers and attempting lateral movement, and that the flaw is not in CISA's Known Exploited Vulnerabilities catalog. CVE-2026-0769 is a Zero Day Initiative 0-day advisory: an eval injection in Langflow's eval_custom_component_code function reachable with no authentication (CVSS 9.8), for which ZDI documents no fixed version and names restricting interaction with the product as the only mitigation. A KEV-driven patch process will not surface this, and the KEV-listed CVE-2026-0770, the next CVE number, is a different vulnerability."
  - claim_id: 0d7d0a8610
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Take every self-hosted Langflow instance off any internet-reachable interface — ZDI documents no fixed version and names restricting interaction with the product as the only mitigation, so network position is the whole of the available control."
  - claim_id: 24011ac704
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "On any Langflow host that was internet-exposed, rotate the LLM-provider API keys and any other service credentials that instance held or could read: VulnCheck reports credential harvesting as observed post-exploitation behaviour, and those keys are billable and usable from anywhere."
  - claim_id: 9ba0c929e5
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "cves[CVE-2026-0769]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-0769\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"mitigation-only\"], \"affected\": \"No affected version range published (ZDI names none)\", \"fixed\": \"None documented; ZDI's mitigation is to restrict interaction with the product\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: f85a4ec759
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "The first: CVE-2026-0769 is an eval injection in Langflow's `eval_custom_component_code` function, where a user-supplied string reaches Python execution without proper validation, and Zero Day Initiative states plainly that authentication is not required to exploit it ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: 48358de872
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "Its disclosure timeline records the report going to the vendor in July 2025, two follow-up requests over the following months and then notice of intent to publish, and its mitigation guidance is correspondingly blunt: restrict interaction with the product, given the nature of the vulnerability ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: 790cec7565
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "ZDI scores it CVSS 9.8 and names no affected or fixed version ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: 0511e144cf
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "VulnCheck reports observing attackers use exploits against CVE-2026-0769 to gain initial access to Langflow, then harvest credentials, which it assesses as likely for services such as OpenAI and Claude, deploy cryptominers, and attempt lateral movement, and states explicitly that the vulnerability has not been added to CISA KEV ("
    urls: ["https://www.vulncheck.com/blog/state-of-exploitation-1h-2026"]
  - claim_id: cf696dc225
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "The same observation covers exploits for a second Langflow flaw, CVE-2026-5027, which VulnCheck also says is not in KEV ("
    urls: ["https://www.vulncheck.com/blog/state-of-exploitation-1h-2026"]
  - claim_id: d46b3a3fc2
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "Neither ZDI's advisory nor VulnCheck's report includes exploit code ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/", "https://www.vulncheck.com/blog/state-of-exploitation-1h-2026"]
  - claim_id: 8d01ba89ab
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "As of the catalog of 2026-09-29, KEV lists six Langflow CVEs: CVE-2026-9198, CVE-2026-0770, CVE-2026-55255, CVE-2025-34291, CVE-2026-33017 and CVE-2025-3248 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 2611370e22
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** every self-hosted Langflow instance reachable from untrusted networks, because exploitation needs no authentication and ZDI names neither an affected version range nor a fix ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: e61aa1380e
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "The only preventive control ZDI offers is restricting who can reach the product ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: 53a812bfa1
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: cited
    text: "On any host that was exposed, rotate the model-provider keys and other credentials it held, since VulnCheck observed credential harvesting after exploitation ("
    urls: ["https://www.vulncheck.com/blog/state-of-exploitation-1h-2026"]
  - claim_id: 5e3a36b869
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "Two facts about the same identifier, published six months apart, combine into something a vulnerability-management process organised around CISA KEV will not see."
  - claim_id: cdf3383124
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "ZDI published it as a 0-day advisory."
  - claim_id: fb4b71c304
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "The second fact is that this is no longer theoretical."
  - claim_id: caeb644df0
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "That detail is worth carrying: if the harvested credentials are model-provider keys, a compromised Langflow instance also exposes the AI-service accounts it is wired to, not only the host."
  - claim_id: 7f53a8406d
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "The KEV gap is the part with immediate procedural consequence, and it comes with a trap."
  - claim_id: 989507ecc5
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "CVE-2026-0769 is not one of them, while CVE-2026-0770, the next CVE number, is a different vulnerability."
  - claim_id: 509e714c80
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "A pair of consecutive identifiers, one KEV-listed and one neither KEV-listed nor documented as fixed, is exactly the shape that produces a false all-clear when a ticket is closed against the wrong record."
  - claim_id: 610877ca0c
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: uncited
    text: "Any process that answers \"are we exposed to Langflow?\" by checking KEV membership will return a clean result for the flaw with no documented fix."
  - claim_id: 143d1f24a3
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: derived
    text: "**Detection:** with no documented fix, the operative telemetry is on the host and at its egress."
  - claim_id: 55cfe7e568
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: derived
    text: "Langflow runs Python, so the process-creation observable is the Langflow service process spawning children it has no business spawning: shells, package managers, download utilities, or a second Python interpreter outside the application's own worker pattern."
  - claim_id: 21eda7737c
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: derived
    text: "In egress telemetry, look for outbound connections from the Langflow host to mining pools or to destinations unrelated to the model providers the application legitimately calls, and for authentication events at your model providers originating from addresses that are not the Langflow host."
  - claim_id: fc1e2c35ed
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: derived
    text: "**Triage:** Langflow's whole purpose is executing user-authored component code, so \"Python executing dynamic code\" is the application working as designed and is not by itself a signal; the discriminators are the process's *children* stepping outside the interpreter, and egress to destinations the application has no configured relationship with."
  - claim_id: 9061902647
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** a KEV check returns a clean result for this flaw, so the decision cannot wait for a listing."
  - claim_id: 3cd94e37b1
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
    surface: "section 2026-09-30T07:18:23Z"
    kind: cited
    text: "ZDI's advisory scores the flaw CVSS 9.8 and names no affected or fixed version ("
    urls: ["https://www.zerodayinitiative.com/advisories/ZDI-26-035/"]
  - claim_id: 61e3ca2cdc
    entry: 2026-07-29/cve-2026-0769-langflow-preauth-eval-rce-exploited-not-in-kev
