    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Huntress, analysing the same patch independently, describes the result as arbitrary file read and write as root, reached through the daemon's privileged file-copy helper processes, and lists code execution through a launch daemon that runs an on-disk reverse shell at reboot or a modified shell startup file that fires when a terminal is opened ("
