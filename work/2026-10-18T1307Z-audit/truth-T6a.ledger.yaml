  - claim_id: ce7ac4c4ab
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "(@osxreverser), never reported to Apple, and killed by Apple in the 26.6 release of 2026-07-27 alongside less severe reported bugs; it has no CVE to this day, and none of the three Screen Sharing entries in that July advisory was described as pre-authentication ("
    urls: ["https://blog.calif.io/p/no-country-for-old-passwords"]
  - claim_id: 2c324ddcda
