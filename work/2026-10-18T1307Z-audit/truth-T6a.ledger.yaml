    kind: cited
    text: "An embedded Python helper hidden inside an encrypted blob in the payload \"locates the `Runner.Worker` process on GitHub Actions runners, opens `/proc/<pid>/maps` and `/proc/<pid>/mem`, and searches live process memory for OpenID Connect (OIDC) tokens and runner secrets\" ("
