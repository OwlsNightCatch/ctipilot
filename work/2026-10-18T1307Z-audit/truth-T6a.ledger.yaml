  - claim_id: eff794c7c8
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "record 2026-08-11T04:45:00Z"
    kind: record-summary
    text: "Update to this pipeline's 2026-08-08 entry, which carried only Apple's advisory line that an attacker on the network might authenticate to Screen Sharing without valid credentials. Three deltas change the urgency. The daemon that answers those connections runs as root, so this is a pre-authentication remote root primitive rather than a login as one user; researchers rebuilt working exploits from the 26.6.1 binary diff in about four hours, and did the same for a second, independent pre-auth bug in the same source file that Apple closed silently on 2026-07-27 with no CVE; and a researcher scan cited by Calif found roughly 40,000 Macs with Screen Sharing reachable from the internet, and Huntress separately counts tens of thousands of potentially vulnerable hosted bare-metal Macs, noting that some of those providers had not yet folded the fix into their base provisioning images. Calif and Huntress give incompatible root causes for CVE-2026-65400 itself and this entry reports both. Patch to macOS 26.6.1, 15.7.9 or 14.8.9; removing allowed accounts or the VNC password does not help."
  - claim_id: 0bfb5193c1
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "record 2026-08-16T04:50:00Z"
    kind: record-summary
    text: "CVE-2026-65400, the pre-authentication flaw in the macOS Screen Sharing daemon this pipeline covered on 2026-08-08 and again on 2026-08-11 as having no confirmed in-the-wild exploitation, is now confirmed exploited. NCSC-NL revised advisory NCSC-2026-0280 on 2026-08-12 to record that it had been notified of active abuse observed on multiple systems with port 5900 reachable from the internet, and that in all of those cases root access was obtained and a Monero cryptocurrency miner was planted. Nothing about the remediation changes — macOS 26.6.1, Sequoia 15.7.9 and Sonoma 14.8.9 — but the exposed population the prior entry counted at roughly 40,000 hosts now has a confirmed outcome attached to it."
  - claim_id: d461e024e3
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "record 2026-09-30T06:44:45Z"
    kind: record-summary
    text: "The summary still said no exploitation was reported, and the main text that Apple reported none, after NCSC-NL confirmed active abuse on 2026-08-12 and CISA listed the flaw on 2026-08-18. The main analysis also called it a straightforward patch item with no artifact to look for. It now gives the daemon's root context, the disagreement between Huntress and Calif over which flaw fG!'s proof-of-concept exploited, and Huntress's authentication-type and session-user discriminator, and it drops an unsourced mDNS claim and an unsourced link between the confirmed cases and that discriminator. The 2026-08-11 claim that such a session has no benign explanation is narrowed to Huntress's wording. NCSC-NL reports a planted miner and has not said whether the attacks went further, so the 2026-08-16 text no longer rules out data theft or ransomware."
  - claim_id: 0db90a46d3
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "headline"
    kind: frontmatter
    text: "A validator that strips quoted text before inspecting it, and an agent instruction file rewritten between two passes of one shared checkout"
  - claim_id: 9e7209e855
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "summary"
    kind: frontmatter
    text: "Novee Security's Black Hat USA 2026 write-up root-causes trust-boundary failures in AI coding-agent CI harnesses, each tested against the vendor's own public repository in default configuration. Against Claude Code Action it reports three successive rounds of patch-and-bypass, of which only the last — an allowlist entry that pre-approved a bare hostname for the fetch tool — carries CVE-2026-54316; the two more instructive rounds, a command validator that strips single-quoted content before inspecting it and a read-only allowlist exempt from path checking, carry no identifier. A Gemini CLI harness flaw is tracked as CVE-2026-12537. The third finding, an OpenAI Codex workflow whose two agent passes shared one checkout so the first could rewrite the instruction file the second treats as authoritative, has no CVE and was fixed only in the vendor's own repository."
  - claim_id: e2d1a76b0a
    entry: 2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout
    surface: "actions[0]"
    kind: frontmatter
    text: "Audit any CI workflow where two or more agent passes share a single checkout — the Codex fix was to split the passes into separate jobs each with its own checkout, and that change has to be made in your own pipelines because no vendor patch reaches them."
  - claim_id: 3eed0bccfe
