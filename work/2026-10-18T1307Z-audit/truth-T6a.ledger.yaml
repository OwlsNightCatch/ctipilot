    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "record 2026-08-08T04:53:00Z"
    kind: record-summary
    text: "Unit 42's analysis of CHAINDROP, the Shai-Hulud npm worm wave covered here on 2026-08-06, adds two mechanics that break controls defenders currently rely on. An embedded Python helper opens /proc/<pid>/maps and /proc/<pid>/mem on the GitHub Actions Runner.Worker process and searches live memory for OIDC tokens and runner secrets, so scanning files and environment variables at rest does not see it. A second, single-target path trades a runner OIDC token at npm's trusted-publishing endpoint for a real publish credential, injects a typosquatted dependency without touching install scripts, and then signs the result through Fulcio and Rekor — producing provenance Unit 42 is explicit is not forged."
