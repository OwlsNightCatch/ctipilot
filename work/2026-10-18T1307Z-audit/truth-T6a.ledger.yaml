    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reason this warrants moving ahead of the ordinary patch queue is what a build server is, not the score."
  - claim_id: 837aafb6ce
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "A TeamCity server holds the credentials its pipelines deploy with, the signing material its artifacts are stamped with, and write access to the outputs every downstream consumer trusts, so command execution as the server process converts into a durable ability to alter what future builds produce."
  - claim_id: ef7a421728
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "At disclosure no public exploitation had been observed, and that clock ran out within nine days (see the updates below)."
  - claim_id: 47dd924f65
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "JetBrains withheld the gadget chain, but \"all versions affected\" plus \"no authentication\" plus a widely deployed, easily fingerprinted product is a combination that historically closes quickly once someone reconstructs the path."
  - claim_id: 8a02778f44
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** every TeamCity On-Premises server that an attacker can reach over HTTP(S) and that runs a build older than 2025.11.7 or 2026.1.3 on its branch without the security-patch plugin for 2017.1 and later is affected."
  - claim_id: 45fbba6da6
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Beyond those, the observable is in the web-server or reverse-proxy access log in front of TeamCity and in process-creation telemetry on the server host."
  - claim_id: 1b5e869038
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Requests to the agent-polling endpoint arriving from addresses that are not your registered build agents are the first signal, and the second, the one that matters if the first was missed, is any child process spawned by the TeamCity server process that is not part of a build it was asked to run: shells, interpreters, or network utilities parented to the server rather than to an agent's build step."
  - claim_id: e2ba4f7951
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The agent-polling endpoint legitimately receives continuous check-in traffic from your build fleet, so request volume to it discriminates nothing on its own."
  - claim_id: a6303c8e0d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The source address set is finite and knowable: your registered agents are an inventory, so polling traffic from anything outside it is the anomaly."
  - claim_id: 57c8a756ed
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "And on the server host, legitimate command execution belongs to agent processes running build steps; the server process itself spawning an interpreter or a network utility is not a quieter version of normal activity but a different thing entirely."
  - claim_id: b31cda4d7d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Hardening: apply 2025.11.7 or 2026.1.3, or the security-patch plugin on 2017.1 and later, and treat the agent-polling interface as an internal service."
  - claim_id: 2c1fc1a453
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "If the only reason it faces the internet is that some agents live outside the network, a VPN or reverse tunnel for those agents removes the exposure that makes this flaw reachable at all."
  - claim_id: ab2d9d0ed5
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: cited
    text: "CISA added CVE-2026-63077 to its Known Exploited Vulnerabilities catalog on 2026-08-05, stating it did so based on evidence of active exploitation ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/08/05/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: 94454d069a
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: cited
    text: "That is the delta: the original entry recorded the flaw as patched but with no confirmed exploitation, which was also JetBrains' own position: its advisory states it was not aware of any active exploitation of the vulnerability at the time of publishing, and that advisory has not been revised since 2026-07-27 ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 61725a1d2f
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: cited
    text: "JetBrains describes it as letting an unauthenticated attacker with HTTP(S) access to a TeamCity server bypass authentication checks and execute arbitrary operating-system commands with the privileges of the TeamCity server process, affecting every On-Premises version ever shipped, with TeamCity Cloud already mitigated so that its customers need take no action ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 543f5822f3
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: cited
    text: "CISA's catalog entry names the flaw a deserialization of untrusted data vulnerability ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/08/05/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: 0e2e2da7f7
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: uncited
    text: "Neither CISA's alert nor its catalog entry names an exploiting cluster, a victim set, or the observed intrusion path, so the confirmed fact is exploitation itself and nothing beyond it."
  - claim_id: 5c23b07566
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: uncited
    text: "Nothing about the underlying flaw has changed."
  - claim_id: fb8e6e5f5b
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: uncited
    text: "What changes is the response owed by anyone who was slow to patch."
  - claim_id: ee7adbbea3
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: uncited
    text: "A build server sits upstream of source code, artifact signing and deployment credentials, so the consequence of a week of exposure is not bounded by the server itself."
  - claim_id: b41cfc5564
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: uncited
    text: "The federal remediation deadline attached to the KEV listing is a US compliance date and carries no operational meaning for Swiss organisations; the exploitation confirmation is what does."
  - claim_id: da328cdc03
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: derived
    text: "**Defender takeaway:** the patch and the compromise assessment are now separate pieces of work, and doing only the first leaves the second undone."
  - claim_id: 091b882456
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: derived
    text: "Behaviourally, the post-exploitation signal on a build server is the server process spawning command interpreters outside build execution, new or unexpected build agents appearing in the server's own agent registry, and reads of stored credential material by the server process at times unconnected to a running build, all visible in process-lineage and application-audit telemetry without any need for a signature."
  - claim_id: 0965a3f5a5
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-08-06T04:11:48Z"
    kind: derived
    text: "Because exploitation requires only network reachability, the exposure question to settle first is which TeamCity instances were reachable from the internet, not which were on the latest branch."
  - claim_id: 47266b4da0
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "CISA's Known Exploited Vulnerabilities catalog now marks CVE-2026-63077 as used in ransomware campaigns ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 098d827b3b
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "JetBrains has separately confirmed that its own Cadence service was compromised through this flaw between 2026-08-08 and 2026-08-24 because the server was never patched against the advisory ("
    urls: ["https://blog.jetbrains.com/pycharm/2026/08/cadence-security-incident-august-2026/"]
  - claim_id: 10177f900c
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: cited
    text: "JetBrains itself reported active and attempted exploitation of unpatched servers on 2026-08-07 and named server-log indicators for checking a server ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: c2c872c265
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: derived
    text: "**Defender takeaway:** ransomware use moves any TeamCity On-Premises server that was internet-reachable and unpatched after 2026-07-27 from a patch item to an incident-response case."
  - claim_id: d832e99b85
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-09-30T06:52:00Z"
    kind: derived
