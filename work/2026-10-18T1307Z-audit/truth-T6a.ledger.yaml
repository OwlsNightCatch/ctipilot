    surface: "section 2026-08-08T04:53:00Z"
    kind: derived
    text: "**Defender takeaway:** provenance attestation has been the reassuring answer to \"how do we know this build is what it claims to be\", and it still answers that question correctly — it just turns out that was never the question worth asking once the workflow itself is hostile."
