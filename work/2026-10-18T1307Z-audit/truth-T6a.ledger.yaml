    surface: "section 2026-08-16T04:50:00Z"
    kind: cited
    text: "The Dutch national cyber security centre revised advisory NCSC-2026-0280 on 2026-08-12 to state that it had received a notification showing active abuse of the vulnerability observed on multiple systems where port 5900 was reachable from the internet, and that in all of those cases root access was obtained on the affected system and a Monero cryptocurrency miner was planted ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0280.html"]
