    text: "The severity of CVE-2026-12537 came from the NVD record rather than a cited advisory, and showed a 7.8 rating with a local, user-interaction vector beside the 10.0. The rating, vector and fixed versions now cite Google's own advisory, which gives only the network-reachable 10.0, with OSV kept for the CVE alias. The 7.8 figure is removed from the text and the structured score, and a self-reference to other coverage is removed from the text."
  - claim_id: a0d8f358a9
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
