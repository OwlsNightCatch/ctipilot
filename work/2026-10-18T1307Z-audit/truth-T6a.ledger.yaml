    text: "{\"id\": \"CVE-2026-73570\", \"cvss\": \"8.9\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Zimbra Collaboration before 10.1.20, where the optional zimbra-snmp package is installed and SNMP notifications are enabled\", \"fixed\": \"10.1.20\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
