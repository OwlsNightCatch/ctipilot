    entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
    surface: "record 2026-10-11T03:39:00Z"
    kind: record-summary
    text: "A further package, tensorlake@0.5.144 (the npm SDK of an AI-agent sandbox platform), was published on 2026-10-08 with a Shai-Hulud-family payload through the project's normal GitHub Actions pipeline with valid build provenance; Socket and OX Security describe the dead-man switch that wipes the owner's home directory when the stolen GitHub token is revoked, and both say to remove its persistence before revoking. Socket matches the release to this wave, while OX Security says new keys may point to an independent actor reusing the name."
