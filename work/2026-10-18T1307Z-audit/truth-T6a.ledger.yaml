    text: "Cisco revised the advisory six times after publication. Hardening releases 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13 and 10.0.2 now replace the per-train hot fixes (v1.6, 2026-09-16). The compromise guidance changed too: the recommendation to rotate every credential, key and certificate is gone, and Cisco now says to contact TAC if exploitation is suspected, warning that the fix does not address an existing compromise. Its log check for a license.tmp artifact is given in full. The summary, actions and analysis follow the current advisory. The sourcing note dates the KEV check to publication."
