    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Huntress roots CVE-2026-65400 in the Secure Remote Password implementation, stating that the daemon's frame-length validator erroneously returns a stale success status so the connection is treated as authenticated, and that the session then continues without cryptographic protection ("
    urls: ["https://www.huntress.com/blog/macos-screen-sharing-rce-patched"]
  - claim_id: 2dbccf1f0c
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Calif assigns that same stale-return mechanism to the *first*, uncredited bug, and says CVE-2026-65400 is instead a state-machine desync whose details it is withholding until more machines have updated ("
    urls: ["https://blog.calif.io/p/no-country-for-old-passwords"]
  - claim_id: 4f08e61363
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Calif cites the scan by the researcher who started the affair, which found around 40,000 Macs with Screen Sharing reachable from the internet, mostly residential addresses but including university and company hosts ("
    urls: ["https://blog.calif.io/p/no-country-for-old-passwords"]
  - claim_id: 020f9a9e63
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Huntress reports a separate concern for managed estates: providers of hosted bare-metal Macs commonly provision these services enabled, a search of internet-wide scan data shows tens of thousands of potentially vulnerable hosts, and at the time of writing some providers had not folded the latest updates into their base images, so newly provisioned hosts were still coming up on the previous, vulnerable version ("
    urls: ["https://www.huntress.com/blog/macos-screen-sharing-rce-patched"]
  - claim_id: a56813c56c
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: cited
    text: "Huntress ties the unencrypted variant to sessions established through the bug and calls a `root` session username a suspicious indicator that few administrators would produce, while an ordinary remote-support session by an administrator authenticates over the encrypted path as a named account ("
    urls: ["https://www.huntress.com/blog/macos-screen-sharing-rce-patched"]
  - claim_id: d60f3f96f3
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "Apple's advisory says an attacker on the network may be able to authenticate to Screen Sharing without valid credentials."
  - claim_id: 00a4d800ce
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "Three things published since change what a defender should do about it."
  - claim_id: 0a325a8142
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The severity is higher than the advisory line implies because `screensharingd`, the daemon answering those connections, runs as root — so an attacker does not land in the account they authenticated as, but can reach every account on the machine and install what they like."
  - claim_id: 7d3d29c8a5
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "Huntress also notes that an earlier public proof-of-concept's cron-based path did *not* work as implemented, because the cron location it wrote to is protected, and that its author later scoped that path to systems with System Integrity Protection disabled."
  - claim_id: 3dc312af68
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The launch-daemon and shell-startup paths are not limited that way."
  - claim_id: 288ef8ea6b
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "**There were two pre-auth bugs, not one, and only one got a CVE.** Calif reports that `screensharingd` carried two independent critical flaws sitting in the same source file."
  - claim_id: 0fb01b01ea
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The first was found by the researcher fG!"
  - claim_id: b3c04c83fb
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "Calif characterises that first bug as a single wrong return — a length check bailing out early on an oversized frame and handing back the success code from the preceding read, which the caller reads as an authentication step having passed."
  - claim_id: 28bec2f704
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The second bug is CVE-2026-65400, fixed out of band on 2026-08-06, and Calif states it needs one thing the first did not: a valid account *name*, which is not a secret because macOS prints usernames on the login window."
  - claim_id: 6d69d174a9
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "Both, in Calif's account, are pure logic errors: no heap grooming, no address-space defeat, no race to win, and no crash — one or two packets in the right order."
  - claim_id: 6002883c60
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The practical consequence of the disagreement is a defensive one: a reader who has only seen the Huntress write-up may conclude the mechanism is fully public, when the more granular account says the mechanism behind the CVE that is actually patched this month has not been published."
  - claim_id: e1286cc80a
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "**Detection.** Huntress describes a telemetry-level discriminator drawn from Apple's Endpoint Security event stream."
  - claim_id: 32d8728756
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "On a screen-sharing attach event, a legitimate authenticated session reports its authentication type as `RSA-SRP`, while a session established through this bug reports the weaker `SRP` value, because no cryptography is applied to it."
  - claim_id: e3e5d7586d
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "The session username is the second signal: `root` is a suspicious indicator, since that account is disabled by default on macOS and few administrators would enable it and then use it for Screen Sharing, and an attacker guessing at account names produces attach events with a null session username, noisy enumeration that is itself worth alerting on."
  - claim_id: d237b309e4
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: uncited
    text: "At the process layer, execution of the daemon's file-copy sender helper with a user and group identifier of 0 and 80 accompanies information-disclosure attempts, though Huntress notes those values do not stay static once the attacker enumerates another local account."
  - claim_id: fc0123317d
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: derived
    text: "**Triage:** Screen Sharing is a real administrative tool, so the session itself is not the signal — the authentication type is."
  - claim_id: 3343cdaeef
    entry: 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass
    surface: "section 2026-08-11T04:45:00Z"
    kind: derived
    text: "Where that telemetry is unavailable, the fallback discriminator is exposure rather than behaviour: a Screen Sharing listener answering from an untrusted network at all is the condition this bug needs."
  - claim_id: 0cc5382208
