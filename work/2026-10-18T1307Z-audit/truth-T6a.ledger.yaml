    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "headline"
    kind: frontmatter
    text: "ServiceNow patches an unauthenticated code-execution sandbox escape in its AI Platform; self-hosted and partner-managed instances are the residual exposure"
  - claim_id: ed6bf4031e
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "summary"
    kind: frontmatter
    text: "ServiceNow disclosed CVE-2026-6875 (CVSS 9.5), a sandbox escape in the ServiceNow AI Platform that, in certain circumstances, lets an unauthenticated user execute code within the platform. ServiceNow addressed its hosted instances starting in April and released updates for self-hosted instances on 2026-07-13. Defused reports exploitation attempts in the wild from 2026-07-17, and NCSC-CH flagged the CVE as actively exploited on 2026-07-20, citing that reporting. ServiceNow's advisory says it is not aware of exploitation against ServiceNow instances, and its spokesperson says it has seen no evidence that the activity relates to instances it hosts. Self-hosted and partner-managed customers must apply the fixed release for their family now."
  - claim_id: 9ef8550a7d
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the fixed release for your family listed in ServiceNow security bulletin KB3137947 (Zurich Patch 7b or 9, Yokohama Patch 12 Hot Fix 1b or Patch 13, Australia Patch 2, Brazil EA or GA) to every self-hosted or partner-managed ServiceNow AI Platform instance now. Exploitation attempts have been reported since 2026-07-17, and self-hosted instances are the ones ServiceNow did not fix itself."
