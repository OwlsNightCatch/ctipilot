    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "record 2026-07-21T04:38:00Z"
    kind: record-summary
    text: "NCSC-CH updated its advisory on 2026-07-20 to flag CVE-2026-6875 — the pre-authentication sandbox escape in the ServiceNow AI Platform first covered here on 2026-07-13 — as actively exploited, with in-the-wild activity reported from 2026-07-18. ServiceNow's own hosted instances were already patched; self-hosted and partner-managed deployments that have not applied hotfix KB3137947 are the residual exposure, and this is now an out-of-band-priority item rather than a scheduled patch."
  - claim_id: b4b6ac278e
    entry: 2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875
    surface: "record 2026-09-30T06:45:01Z"
    kind: record-summary
    text: "The summary still said no exploitation was known after the 2026-07-21 update recorded NCSC-CH's active-exploitation flag, and the takeaway said no hunt discriminator existed, misdated the hosted fix and called security bulletin KB3137947 a hotfix. The takeaway now leads with the /assessment_thanks.do sink the observed payloads hit, marks the gs.include() route as Searchlight Cyber's proof of concept, and notes the Guarded Script changes that ship with the patches. ServiceNow's statement that it is not aware of exploitation is set against the exploitation reports. The 2026-07-21 section no longer calls NCSC-CH's first advisory a revision or the exploitation confirmed, dates Defused's first attempts to 2026-07-17, and describes Searchlight's sandbox escape through gs.include() rather than eval. An uncited exposure clause is removed."
  - claim_id: 428cca0409
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "headline"
    kind: frontmatter
    text: "JetBrains patches an unauthenticated remote-code-execution flaw reachable on every TeamCity On-Premises version ever shipped"
  - claim_id: ec017dd589
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "summary"
    kind: frontmatter
    text: "JetBrains disclosed CVE-2026-63077 on 2026-07-27: an attacker with nothing more than HTTP(S) access to a TeamCity On-Premises server can exploit the agent-polling protocol to bypass authentication checks and execute arbitrary operating-system commands as the TeamCity server process. Every On-Premises version is affected; fixes are 2025.11.7 and 2026.1.3, with a security-patch plugin available down to 2017.1 for estates that cannot upgrade immediately, and JetBrains says TeamCity Cloud needs no customer action because it is already mitigated. CISA listed the flaw as exploited on 2026-08-05, JetBrains reported active and attempted exploitation of unpatched servers on 2026-08-07, CISA's KEV catalog now marks known ransomware campaign use, and JetBrains' own Cadence service was breached through it. A build server compromise is a supply-chain compromise."
  - claim_id: 9b7ccea9d4
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade TeamCity On-Premises to 2025.11.7 or 2026.1.3 on the matching branch, or install JetBrains' security-patch plugin where the version is older than that but at least 2017.1, and while the upgrade is scheduled, take the server's agent-polling endpoint off any internet-reachable interface, because the flaw needs nothing but HTTP(S) reachability."
  - claim_id: 89cc79bb12
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Treat any TeamCity On-Premises server that was internet-reachable and unpatched before 2026-08-05 as a compromise-assessment target rather than a completed patch: review build-agent registrations for agents you did not enrol, and rotate the VCS credentials, artifact-repository tokens and signing keys the server holds, because an upgrade evicts the entry point but not what was taken through it."
  - claim_id: e93c1bd098
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "cves[CVE-2026-63077]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-63077\", \"cvss\": null, \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"All TeamCity On-Premises versions prior to the branch fixes; TeamCity Cloud already mitigated by JetBrains.\", \"fixed\": \"2025.11.7 and 2026.1.3, with JetBrains' security-patch plugin as the mitigation path for installations from 2017.1 onward that cannot take the full upgrade.\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 1af9c71399
