  - quote: The incidents, which first came to light on September 30, are the first known example of AI agents hacking the financial sector.
    attribution: The Record
    source_url: https://therecord.media/south-korean-bank-hacks-ai-agents
  extended_notes: 'Behavioural hunt ideas stated by Zscaler: high-frequency automated requests with sequential enumeration against login and search endpoints; outbound
    calls from servers to LLM API hosts (api.anthropic.com, api.deepseek.com, open.bigmodel.cn, api.x.ai) which Zscaler says to investigate only together with other
    suspicious activity; structured personal data leaving over HTTPS to unauthorised destinations; unexpected .aspx or .jsp files in web application paths. Defensive
    levers named by Zscaler: alert on sequential lookups and unusually high record counts per session on partner and employee portals, rate-limit those endpoints,
    enforce server-side authorization and return only the fields an operation needs, treat open-source pentest harnesses as hostile code, re-test authorization after
    each change. Recorded Future adds connecting unusual sign-ins and repeated requests for different customers'' records across changing infrastructure. Benign lookalike:
    authorised AI-assisted pentests and scanners also produce sequential enumeration; the discriminator is scope (an unscheduled source against production inventories)
    and per-session record volume. Attribution caveat: no lab names a state; CrowdStrike publishes personal details found in the actor''s sessions but cautions they
    cannot be definitively tied to the actor (not repeated here). The victim institutions are named by The Record via Korean press (Hana, KB Kookmin, Shinhan); the
    labs name none.'
