- title: '''Adception'': a Google search ad whose displayed domain is bing.com redirects through a Bing click-tracking link and a compromised retailer to a fake Claude
    installer, with referrer-gated cloaking and a clipboard command that differs from the one shown'
  kind_hint: threat
