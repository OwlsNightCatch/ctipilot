  discovery_trace: 'first seen at: talos, URL https://blog.talosintelligence.com/rss/ (feed via bridge, item dated 2026-10-14) → primary: Talos post, URL https://blog.talosintelligence.com/break-the-silence-kazakhstan-nexus-uat-6275-targets-cis-government-organizations/
    → corroboration: Recorded Future Insikt post linked from the Talos post and listed in the recordedfuture-insikt feed https://www.recordedfuture.com/feed, URL
    https://www.recordedfuture.com/blog/tag193-regional-espionage-operations → full technical paper linked from both: URL https://www.virusbulletin.com/uploads/pdf/conference/vb2026/papers/Break-the-silence-tracking-Silent-Lynx-through-exposed-infrastructure.pdf
    (fetched with the bridge pdf subcommand). The two labs co-authored the research, so this is two telemetry holders on one joint investigation, not independent
    corroboration.'
  summary: 'Cisco Talos (UAT-6275) and Recorded Future''s Insikt Group (TAG-193) jointly report a Central Asia and CIS government-focused espionage cluster that overlaps
    Seqrite''s Silent Lynx; Talos assesses it likely belongs to the broader YoroTrooper activity cluster but tracks the two separately because it has seen no direct
    indicator or toolset overlap. From June 2025 to August 2026 Talos sorted the recovered samples into four infection chains: macro-enabled Word documents; PS2EXE-compiled
    PowerShell downloaders that create scheduled tasks; LNK shortcuts in RAR archives that start PowerShell to run GitHub-hosted scripts in memory; and, from April
    2026, a crafted RAR archive exploiting WinRAR CVE-2025-8088 (an NTFS alternate-data-stream path traversal, per the VB paper) to drop the PickleShell reverse shell
    into the Windows Startup folder, the group''s first observed vulnerability exploit. Recorded Future states the group spearphishes from compromised government
    email accounts with official-looking documents and hosts payloads on GitHub. Open staging directories and a GitHub repository exposed Chvost, LAPLAS, PickleShell
    and FoalShell reverse shells, Cobalt Strike and Ligolo tooling, Linux-compatible builds and a public proof of concept for FortiWeb CVE-2025-25257; both labs say
    they did not confirm in-the-wild FortiWeb exploitation. Victim and lure themes span nine CIS countries and ministries for diplomacy, economy, agriculture and
    environment, with water-resource and energy decoys. Talos assesses with medium confidence a Kazakhstan nexus (Russian-language artifacts, sample submissions from
    Kazakhstan, UTC+5 working hours); Recorded Future says organizational affiliation and state sponsorship remain unresolved.'
  region_nexus: 'Central Asia, South Caucasus and western CIS (nine countries named); no Swiss or EU targeting reported. Swiss relevance is indirect: the same government-sector
    spearphishing pattern and the WinRAR CVE-2025-8088 exposure apply to any administration.'
