  - quote: Google's ad review approved a destination that was simply another search engine, and the malicious payload only appeared if you reached the end of the
      chain through this specific path.
    attribution: Push Security
    source_url: https://pushsecurity.com/blog/adception-malvertising-another-search-engines-search-results
  - quote: Instead of presenting the malicious command to the user, the rendered visual is of the real Claude install command, but with the malicious command copied
      to clipboard.
    attribution: Push Security
    source_url: https://pushsecurity.com/blog/analyzing-the-latest-ai-themed-malware-delivery-attacks
  extended_notes: 'Detection concept (telemetry class first): web-proxy logs showing a navigation chain google.com/aclk -> bing.com/ck/a -> an unrelated small business
    site -> a lookalike installer domain; endpoint process telemetry for a terminal or shell launching curl whose URL is produced by a command substitution that Base64-decodes
    (openssl base64 -d) and pipes into zsh or bash, with the parent being a terminal that was just pasted into. Hardening: do not install developer tools from search
    ads; use vendor docs or package managers; managed Macs can restrict unsigned shell piping only through endpoint policy, which the source does not specify. Benign
    lookalike: legitimate install one-liners (curl | sh) from vendors are common; the discriminator is that the install page was reached through a search ad via a
    redirector and the pasted command differs from the one displayed. Borderline because Push''s own detection product is the vantage and the post is mostly one cluster;
    value is the redirect/cloaking technique.'
