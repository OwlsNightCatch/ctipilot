- title: 'UAT-11985: an APT spearphishing campaign against Taiwan research organizations uses AI-assisted event-invitation lures, QR codes swapped into event posters
    and a real-time Google adversary-in-the-middle kit that relays MFA challenges over WebSocket'
  kind_hint: threat
  sources:
  - url: https://blog.talosintelligence.com/uat-11985/
    publisher: Cisco Talos
    date: '2026-10-08'
    role: primary
  discovery_trace: 'first seen at: talos, URL https://blog.talosintelligence.com/rss/ (feed via bridge, item dated 2026-10-08) → primary (no pivot needed): https://blog.talosintelligence.com/uat-11985/'
  summary: 'Cisco Talos describes a mid-2026 spearphishing campaign by an APT it tracks as UAT-11985 against individuals at Taiwan research organizations. The emails
    impersonate institutions such as the Taiwan European Union Centre and NCCU Institute of International Relations (none could confirm the senders) and follow one
    three-part template that Talos judges likely AI-assisted: policy-jargon context, recipient-specific flattery, then event logistics copied from genuine announcements.
    A visible Google Forms URL hides a different href that leads to a Google-Form lookalike and then a spoofed Google sign-in page. The kit is an operator-driven
    adversary-in-the-middle relay: the page posts browser fingerprints and credentials to the actor''s HTTP endpoint, which forwards them to the real Google service,
    learns whether the account uses a passkey or which MFA challenge applies, and instructs the page over a WebSocket which MFA screen to render, so the full authenticated
    session can be taken. Talos adds that attackers swapped malicious QR codes into event posters scraped from legitimate sites, widening the victim pool to people
    who scan printed or displayed posters. Talos assesses with moderate confidence from the kit''s localisation code that the interface was written first in Simplified
    Chinese; it does not name the operator.'
  region_nexus: Taiwan research and policy organizations; no Swiss targeting reported. Transferable to administrations whose staff are invited to think-tank and policy
    events.
  primary_sector_nexus: indirect
  sector: government-adjacent research and policy
