  summary: 'GTIG analysed disclosures from January 2025 to August 2026 using its own vulnerability risk ratings. It reports disclosures rising from 5,045 in January
    2026 to 10,477 in July and 10,740 in August, with roughly 5,000 ''Linux Kernel'' CVEs and no observed exploited zero-day among them; exploitation rose from an
    average of 10.5 CVEs a month in 2025 to 18 a month from January to August 2026 (141 distinct CVEs, more than all of 2025''s 127), only 0.23% of 2026 disclosures.
    Zero-days averaged 11 a month against 8, with a spike to 22 in August, and GTIG concludes growth is mainly rapid weaponization of n-days, suggesting but not proving
    that LLMs help diff patches and PoCs. Edge and security appliances were 14% of exploited CVEs and enterprise directory and collaboration hubs 11%; over 65% of
    exploited edge flaws rated High or Critical. GTIG finds AI-assisted discoveries skew to remote code execution (50% against 26% overall) and cites CVE-2026-1731
    in BeyondTrust (found by a third-party research agent): within four days of disclosure GTIG saw one cluster exploiting it and five more within seven days. GTIG''s
    prescription is threat-intelligence-driven triage of edge exposure instead of undifferentiated mass patching.'
