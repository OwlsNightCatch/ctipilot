- title: 'ANNUAL REPORT — Zscaler ThreatLabz 2026 Ransomware Report (April 2025 to March 2026): 896 TB leaked by the top ten groups, 62% of victims manager-level
    or above, and Teams vishing steered to remote-support tools as the dominant entry'
  kind_hint: annual-report
  sources:
  - url: https://www.zscaler.com/blogs/security-research/ransomware-leverage-growing-terabyte-takeaways-threatlabz-2026-ransomware
    publisher: Zscaler ThreatLabz
    date: '2026-09-30'
    role: primary
  discovery_trace: 'first seen at: zscaler-threatlabz, URL https://www.zscaler.com/blogs/feeds/security-research (feed via bridge, item dated 2026-09-30T07:01Z) →
    primary (no pivot needed): https://www.zscaler.com/blogs/security-research/ransomware-leverage-growing-terabyte-takeaways-threatlabz-2026-ransomware (summary
    post; the full report is a gated campaign page that I did not read, so figures below are as stated in the post).'
  summary: Zscaler ThreatLabz published its 2026 Ransomware Report covering April 2025 to March 2026; the cited blog gives five takeaways. Combined data-leak volume
    of the top ten groups rose 275.8% year on year to 896.2 TB, with 7,366 victims listed on leak sites (down 3%) and 52 newly active groups, 60% of the top 15 groups
    being new to the rankings; known ransom payments fell 15.8% to $327.8M while the average payment rose 5.3% to $431,995. ThreatLabz finds 62% of victims held manager-level
    titles or above and roughly 75% worked in finance, sales, operations, HR and marketing, and reports that intrusions commonly start with spam bombing followed
    by Microsoft Teams vishing that steers the victim to Quick Assist or other remote-support tools, after which operators deploy reconnaissance, persistence, lateral-movement,
    exfiltration and encryption tooling. The Zscaler frame is that exfiltration, not encryption, is now the leverage, so post-compromise containment and egress control
    matter as much as preventing encryption. All numbers are Zscaler's own leak-site and payment tallies; leak-site counts are claims by the criminals, not victim
    confirmations.
  region_nexus: global; the blog states no regional or Swiss split
  primary_sector_nexus: indirect
