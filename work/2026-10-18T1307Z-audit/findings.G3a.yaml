      Simplified-Chinese-speaking developer (Talos, 2026-10-08).
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: new
  admiralty_suggestion: B2
  evidence:
  - quote: The campaign deployed an advanced adversary-in-the-middle (AitM) phishing framework that impersonated Google authentication pages and utilized a hybrid
      HTTP and WebSocket architecture to synchronize authentication workflows in real time, enabling the interception of credentials and multi-factor authentication
      (MFA) challenges.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  - quote: the actor incorporated QR code phishing (quishing) techniques by modifying legitimate event posters with malicious QR codes
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  - quote: one hyperlink displays a legitimate-looking Google Forms URL, while its underlying href redirects the recipient to a deceptive phishing site hosted on
      a third-party platform
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  - quote: Talos assesses with moderate confidence that the user interface was originally developed in Simplified Chinese and later adapted for Traditional Chinese
      and English.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  extended_notes: 'Detection concept: web-proxy and DNS telemetry for newly seen hosts serving sign-in pages that open a persistent WebSocket alongside periodic heartbeat
    POSTs; mail-gateway checks that compare a link''s visible text with its resolved href for form-hosting domains; sign-in logs showing a new device or location
    immediately after a successful MFA from a different network (relay pattern). Phishing-resistant authentication (passkeys bound to origin) breaks the relay; the
    kit, per Talos, queries Google to learn whether a passkey flow applies and adapts the prompt. Hardening for printed material: treat QR codes on posters or event
    material as untrusted. Talos cannot conclusively determine that an LLM wrote the emails; the AI-assistance claim is an inference from template uniformity. Not
    a Google-vulnerability story; M365 equivalents of the relay pattern are already covered in the store (device-code and AitM entries).'
  borderline: false
- title: 'ARTEX: a Chinese open-source agentic pentesting framework, driven by LLM backends, is used against at least seven South Korean financial institutions; CrowdStrike,
    Zscaler and Recorded Future (TAG-217) document SQL injection and authentication bypass against peripheral web portals'
  kind_hint: threat
  sources:
  - url: https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/
    publisher: CrowdStrike Intelligence
