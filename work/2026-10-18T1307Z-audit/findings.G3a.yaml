coverage_gaps:
- source_id: sentinellabs
  reason: 'RECIPE FIX: https://www.sentinelone.com/labs/feed/ returns 10 dated items on the direct transport (newest 2026-09-18); fetch_method webfetch could move
    to rss with that rss_url. Command: python3 tools/fetch_source.py feed https://www.sentinelone.com/labs/feed/ 15. The raw listing JSON also works.'
- source_id: malwarebytes
  reason: 'RECIPE FIX: https://www.malwarebytes.com/blog/feed/index.xml returns 20 dated items on the direct transport but reaches back only about 8 days (the ?paged
    query is ignored); for a 440-hour sweep page the listing with python3 tools/fetch_source.py url https://www.malwarebytes.com/blog/page/N (pages 2-5 reach 2026-09-28)
    and filter /blog/threat-intel/ URLs. Almost all posts are consumer news.'
- source_id: proofpoint
  reason: 'The threat-insight listing renders only the latest three posts with <time datetime> tags; https://www.proofpoint.com/us/rss.xml is the newsroom feed, not
    the blog, and /us/blog/rss.xml 404s. In-window sweep therefore relies on the listing plus the blog home; an article page''s own date can differ from the listing
    date (CoGUI post: page 2026-10-12, listing 2026-10-14).'
- source_id: elastic-seclabs
  reason: 'Elastic split its output: product and SOC posts under /security-labs/blog and primary threat research under https://www.elastic.co/security-labs/threat-command
    (dated cards, 14 pages); sweep both, the second is the research source. The raw `url` fetch returns server-rendered cards with dates.'
- source_id: push-security
  reason: Post URL slugs differ from titles (e.g. /blog/adception-malvertising-another-search-engines-search-results); take hrefs from the listing page rather than
    guessing; extract reads the posts fully. Roughly 70% of the listing is buyer's guides.
- source_id: infoguard-ch
  reason: '`extract` returns only the page footer for infoguard.ch/en/blog posts; the raw `url` fetch returns the body. Posts in the window are governance opinion
    (shadow AI development, AI in MDR), nothing returnable.'
- source_id: huntress
  reason: 'Feed dates can be stale: ''Defender Exclusion Abuse'' appears as 2026-09-30 in the RSS but the page is dated 2024-11-21; confirm the page date before treating
    a Huntress feed item as in-window.'
- source_id: team-cymru
  reason: 'Listing is undated (as the note says); `extract` of each post gives a frontmatter date. Done for the seven newest posts: only LegionRelay (2026-10-14)
    is in-window.'
- source_id: netcraft
  reason: 'Confirmed the 2026-10-10 recipe: `url https://www.netcraft.com/resources/blog` text lines carry ''Oct. 16, 2026 | summary'' per card; slugs are /blog/<slug>.
    Status in sources.json is still candidate; it contributed one returnable item this audit.'
- source_id: lumen-black-lotus-labs
  reason: query-index.json dates are free-text strings ('Oct 7, 2026', 'Sept 22, 2026', some malformed such as ', 2026' or 'Feb12, 2025'), not epochs; parse with
    a tolerant parser. Black Lotus posts are not tagged consistently, so filter on botnet and malware category tags as well as 'lotus'.
