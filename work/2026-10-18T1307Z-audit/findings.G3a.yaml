- title: 'UAT-6275 (Recorded Future TAG-193, overlapping Silent Lynx): Talos and Insikt expose a Kazakhstan-nexus espionage cluster that spearphishes CIS government
    bodies from compromised government mailboxes, with a WinRAR CVE-2025-8088 delivery chain added in April 2026'
  kind_hint: threat
