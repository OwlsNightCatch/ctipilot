    attribution: Zscaler ThreatLabz
    source_url: https://www.zscaler.com/blogs/security-research/ransomware-leverage-growing-terabyte-takeaways-threatlabz-2026-ransomware
  extended_notes: 'Flagged ANNUAL REPORT because it is a periodic report that landed in-window. Detection and hardening concepts follow the blog: treat collaboration
    and remote-support workflows as part of the ransomware attack surface, i.e. alert on external Teams chats from unfamiliar tenants that precede a Quick Assist
    or other remote-support session, and restrict remote-support tooling to approved ones. The companion 2026-10-16 ThreatLabz post ''Ransomware at Machine Speed''
    repackages the GenAI section of the same report and is below the bar on its own. Related coverage already in the store: Storm-2570 cross-RaaS toolkit (2026-09-29)
    and Longlegs/Warlock (2026-10-03).'
