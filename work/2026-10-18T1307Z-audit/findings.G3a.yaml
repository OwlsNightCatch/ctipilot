  summary: 'Barracuda Research reports phishing emails that target two audiences at once. The visible layer is ordinary internal-looking correspondence with a password-protected
    attachment whose password is given in the body, which defeats attachment sandboxing; the second layer carries hidden instructions meant for AI assistants that
    summarise, prioritise or act on email. The hidden text aims to make the assistant''s summary call the message legitimate or urgent, or to insert a fake priority
    action such as changing a vendor''s payment details. Barracuda lists four concealment techniques: instructions in HTML comments, text hidden by zero-pixel font
    size or white colour, instructions inside Base64-encoded blocks such as an image data string, and zero-width Unicode characters. In the sample Barracuda shows,
    the From and To addresses match the same mailbox, the message carries a trusted spam confidence score and it originates from a public-sector domain, which Barracuda
    says lends it perceived legitimacy and helps it past reputation filters; Barracuda does not name the domain or country. Barracuda calls the threat ''emerging''
    and gives no victim counts or attribution; Malwarebytes adds that whether hidden content actually reaches the model depends on how the particular tool extracts
    and prepares the email.'
