- title: 'GTIG: vulnerability disclosures doubled to over 10,000 a month in 2026 while exploitation grew from 10.5 to 18 CVEs a month, driven by fast n-day weaponization;
    edge and security appliances are 14% of exploited CVEs'
  kind_hint: research
  sources:
