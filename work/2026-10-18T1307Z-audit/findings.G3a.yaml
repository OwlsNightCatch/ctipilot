  discovery_trace: 'first seen at: push-security, URL https://pushsecurity.com/blog (bridge url listing, ''Adception'' post, Oct 9, 2026) → primary: https://pushsecurity.com/blog/adception-malvertising-another-search-engines-search-results
    → companion cluster analysis: https://pushsecurity.com/blog/analyzing-the-latest-ai-themed-malware-delivery-attacks'
  summary: Push Security describes an InstallFix-style attack on macOS users searching Google for 'claude mac'. A sponsored result displayed bing.com as its domain
    and passed the click through Google's ad redirect, a Bing click-tracking redirect (bing.com/ck/a, which forwards with JavaScript so the request shows HTTP 200
    and the next hop carries a bing.com referrer), and the 'about us' page of a compromised retailer site that forwards only ad visitors, to a fake Claude download
    page. Push reports two layers of referrer-based cloaking (a server-side check for a Bing referrer and certain browser headers, then client-side JavaScript that
    sends visitors whose document.referrer lacks Google or Bing to a 404), so a direct visit or a scanner sees nothing malicious; it says Google's ad review approved
    a destination that was simply another search engine and that it found no earlier public report of Bing used as a search ad's destination. The install page shows
    the genuine Claude install command while copying a different one to the clipboard that prints a claude.ai message, then fetches a Base64-decoded URL and pipes
    the download straight into zsh without writing it to disk, so a user who compares the screen and the terminal sees only the legitimate URL twice. Push attributes
    the cluster to a criminal ClickFix toolkit it tracks as AcSig, which requires an HMAC-signed header to serve the command. Single vendor, one observed cluster;
    no victim counts.
