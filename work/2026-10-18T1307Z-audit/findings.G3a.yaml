    date: '2026-10-06'
    role: corroborating
  discovery_trace: 'first seen at: zscaler-threatlabz, URL https://www.zscaler.com/blogs/feeds/security-research (feed via bridge, item dated 2026-10-14) → pivot:
    Recorded Future Insikt post via feed https://www.recordedfuture.com/feed, URL https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks (cites CrowdStrike
    and The Record) → primary: CrowdStrike Intelligence, URL https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/
    → reporting by officials: The Record, URL https://therecord.media/south-korean-bank-hacks-ai-agents. Four independent observations: CrowdStrike and Recorded Future
    each analysed attacker open directories, Zscaler analysed the campaign, The Record relays Korean officials.'
  summary: From late September to early October 2026 several South Korean financial institutions were breached, with Korean authorities and the press putting the
    exposed personal data at 67,000 to at least 68,000 people across at least seven institutions (Zscaler says about 67,000; The Record says at least 68,000; the
    counts differ and none is confirmed by the institutions in these sources). CrowdStrike reports it found attacker-controlled open directories holding Claude Code
    session histories, ARTEX configuration and memory files showing the actor drove ARTEX, a recently released Chinese-developed open-source agentic penetration-testing
    tool, with DeepSeek as the primary LLM backend plus GLM and Grok; it assesses with moderate confidence a Chinese-speaking, financially motivated actor and names
    no group. Zscaler says the actor's agents found and exploited SQL injection and authentication bypass in peripheral internet-facing applications outside core
    banking (customer-facing inquiry portals and employee-facing mobile application backends), then took names, phone numbers, income and loan limits; CrowdStrike,
    relaying industry reports, names a loan-progress inquiry service used by brokers at one bank and an employee mobile work-support system at another. Recorded Future
    tracks the actor as TAG-217 and, from its own exposed-server evidence, dates testing to 17 to 22 August, with YiiMP mining-platform default-password and wallet-theft
    tooling, Linux privilege-escalation tools and an iPhone and Android exploit-testing workspace by 5 September; it assesses it is highly likely more actors will
    adopt such tools. Zscaler notes ARTEX ships a default blocklist meant to keep it off government and university targets that does not cover financial institutions;
    the developer closed the source after disclosure, but earlier copies and forks remain. The labs treat the AI contribution as faster, broader reconnaissance and
    exploitation using ordinary techniques, not new techniques.
  region_nexus: 'South Korea (financial sector); global tool availability. Swiss relevance: the same exposure class (peripheral citizen, partner and employee-mobile
    web portals with injection or broken authorization) exists at cantonal and communal level, and the tool''s default government blocklist is a default, not a guarantee.'
