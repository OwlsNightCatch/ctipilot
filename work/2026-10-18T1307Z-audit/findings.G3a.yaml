    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/break-the-silence-kazakhstan-nexus-uat-6275-targets-cis-government-organizations/
  - quote: a crafted WinRAR archive exploiting CVE-2025-8088
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/break-the-silence-kazakhstan-nexus-uat-6275-targets-cis-government-organizations/
  - quote: TAG-193 frequently sends spearphishing emails from compromised government accounts, using official-looking documents to make its communications credible.
    attribution: Recorded Future Insikt Group
    source_url: https://www.recordedfuture.com/blog/tag193-regional-espionage-operations
  - quote: However, the research did not confirm that the group exploited the FortiWeb vulnerability in the wild.
    attribution: Recorded Future Insikt Group
    source_url: https://www.recordedfuture.com/blog/tag193-regional-espionage-operations
  - quote: The actor used a crafted WinRAR archive exploiting CVE-2025-8088, which abuses NTFS alternate-data-stream path traversal to write a payload into the Startup
      folder.
    attribution: Virus Bulletin VB2026 white paper (Shen and Vögele, Talos and Insikt)
    source_url: https://www.virusbulletin.com/uploads/pdf/conference/vb2026/papers/Break-the-silence-tracking-Silent-Lynx-through-exposed-infrastructure.pdf
  extended_notes: 'Detection concept (sources'' own pointers plus mechanics): process-creation and file-write telemetry showing an archive utility (WinRAR) writing
    an executable or script into a user''s Startup folder at extraction time; PowerShell started from a LNK or document parent that downloads from a public code-hosting
    service and runs in memory; scheduled tasks with update-themed names that re-run a script launcher every few minutes (the VB paper documents tasks named WindowsUpdate
    every six minutes and MicrosoftOfficeUpdate every 60 minutes, which are task-name patterns rather than indicators). Talos'' own hardening advice: keep archive
    utilities patched; monitor unexpected PowerShell and payload downloads from public services, scheduled tasks and Startup-folder changes. Benign lookalike: developers
    and admins legitimately run PowerShell downloads from GitHub; the discriminator is an office-document, LNK or archive parent plus a Startup or scheduled-task
    write within the same session. No patched WinRAR version is stated in the fetched sources; confirm against the WinRAR/RARLAB advisory before quoting one. Fresh
    in-window primary dated 2026-10-14; the labs state activity ran June 2025 to August 2026. Relevance call: clears the research bar (new cluster designation and
    attribution shift from two telemetry-holding labs plus a joint white paper) but has no Swiss or EU victims reported; the store has published comparable government-targeting
    clusters (UAT-11587, Star Blizzard), so I rate it likely-include.'
