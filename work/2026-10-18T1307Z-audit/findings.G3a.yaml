  summary: 'ThreatLabz identified 2CLoader in August 2026, a loader that delivers infostealers (mainly Vidar and Remus) and XWorm. It decrypts strings with an XOR
    key, resolves Nt functions with Hell''s Gate-style indirect syscalls from a fresh copy of ntdll, optionally installs about 20 inline trampoline hooks that rewrite
    network-read buffers and spoof host identity values, and runs anti-VM, anti-debug and user-activity checks. Its AES-GCM payload key is derived from a hash of
    its own .text section, and configuration flags select persistence: HKCU Run or RunOnce values, the Startup folder, a logon scheduled task, the Windows Load value
    or UserInitMprLogonScript, with the value or task name ''SecurityHealthService.exe''. C2 is HTTP POST with XOR-encrypted JSON. The delivery vector is not described
    and ThreatLabz publishes a payload-decryption script.'
