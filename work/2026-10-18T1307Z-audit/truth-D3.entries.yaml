entries:
  - entry: 2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s
    verdict: factual-error
    defects:
    - where: actions[0]
      claim: '**PAN-OS CVE-2026-0300: deploy patched builds released 2026-05-13.** Apply PAN-OS 12.1.4-h5 / 12.1.7 / 11.2 /
        11.1 / 10.2 hot-fix branches'
      defect: 'Lists 12.1.7 among builds released 2026-05-13, but the entry''s own 2026-05-13 section says 12.1.7 is ''planned
        2026-05-28'' and the PSIRT page still labels it ''(ETA: 05/28)'' today; only 12.1.4-h5 of the 12.1 line was on the 05/13
        wave.'
      ground_truth: 'PSIRT Product Status: ''PAN-OS 12.1 | < 12.1.4-h5 < 12.1.7 | >= 12.1.4-h5 >= 12.1.7 (ETA: 05/28)''. Rapid7
        ETR Fix ETA column for 12.1: ''05/13 05/28''.'
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Name the 05/13-wave builds per branch (12.1.4-h5, 11.2.7-h13, 11.2.10-h6, 11.1.4-h33, 11.1.6-h32, 11.1.10-h25, 11.1.13-h5,
        10.2.10-h36, 10.2.18-h6) and drop 12.1.7, or say '12.1.7 follows with the 05/28 wave'.
      class: factual-error
    - where: '## Update — 2026-05-13T05:00:13Z (and its record summary)'
      claim: (Palo Alto Networks PSIRT, last updated 2026-05-07; patch table confirmed 2026-05-13)
      defect: 'Citation parenthetical contradicts the vendor page: the PSIRT timeline records updates on 2026-05-13 (16:00Z),
        05-14, 05-16 and 05-28; the section is stamped 05:00:13Z on 05-13, i.e. before the vendor''s 05-13 ''Updated the release
        timeline and Solution table'', so ''patch table confirmed 2026-05-13'' was not yet checkable at that time (the day-level
        fact, first wave published 2026-05-13, is true per Rapid7 and the KEV note).'
      ground_truth: 'PSIRT timeline: ''2026-05-13 Updated the release timeline and Solution table.'' (data-date 2026-05-13T16:00:00Z);
        Rapid7: ''As of May 13, 2026, the first round of patches has been published.'''
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Cite the 2026-05-13 vendor revision and the KEV 5/13 note instead of 'last updated 2026-05-07'.
      class: imprecision
    - where: body para 2 and 2026-05-13 section
      claim: the interim Threat Prevention signature **510019** ... remain the only defender controls for branches that do not
        yet have a fixed build / Threat Prevention signature ID 510019 remains the interim control for any unpatched instance
      defect: Omits the vendor's qualifier that Threat ID 510019 needs PAN-OS 11.1 or later, so it is not a control for unpatched
        10.2 instances (10.2.7-h34, 10.2.13-h21, 10.2.16-h7 were wave-2 builds).
      ground_truth: '''Customers with a Threat Prevention subscription can block attacks for this vulnerability by enabling
        Threat ID 510019 from Applications and Threats content version 9097-10022. Decoder capabilities necessitate PAN-OS 11.1
        or a later version for Threat ID support.'''
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Add 'PAN-OS 11.1+ only; content 9097-10022 or later'.
      class: imprecision
    - where: body para 1
      claim: the ~2026-04-09 first-observed-exploitation date come from Unit 42's separate [Captive Portal Zero-Day threat bulletin]
      defect: Unit 42 says April 9 was the start of UNSUCCESSFUL exploitation attempts against one device; successful RCE came
        about a week later.
      ground_truth: '''Starting April 9, 2026, there were unsuccessful exploitation attempts against a PAN-OS device. A week
        later, the attackers successfully achieved RCE against the device and injected shellcode.'''
      ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
      fix: Say 'first exploitation attempts ~2026-04-09, first successful RCE ~a week later'.
      class: imprecision
    - where: summary / headline
      claim: first-wave fixed builds now scheduled for 2026-05-13 ... exploitation clusters have been actively abusing
      defect: '''now scheduled'' frames as new a schedule that was in the advisory from initial publication on 2026-05-05/06
        (per-build Fix ETA 05/13 and 05/28); ''clusters'' plural while Unit 42 names one cluster, CL-STA-1132.'
      ground_truth: 'Rapid7 (pub 2026-05-06): ''fixed versions are expected to begin rolling out on May 13, 2026, with additional
        releases through May 28, 2026'' with a per-build Fix ETA table; Unit 42: ''tracking CL-STA-1132, a cluster of likely
        state-sponsored threat activity''.'
      ground_truth_url: https://rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300
      fix: Drop 'now'/'clusters'; this is the same finding as the 05-08 entry, an unchanged ETA.
      class: imprecision
    - where: frontmatter
      claim: 'classification: null; techniques: []; affected_products: []; cves[].affected/fixed: null'
      defect: Migrated entry carries no Admiralty classification, no ATT&CK mapping (exploit of public-facing application is
        described) and no structured affected/fixed versions although the PSIRT table states them per branch.
      ground_truth: 'PSIRT CVE JSON: PAN-OS affected 12.1.0 <12.1.7, 11.2.0 <11.2.12, 11.1.0 <11.1.15, 10.2.0 <10.2.18-h6 (per-hotfix-train
        fixes in the Solution table); CNA names PA-Series and VM-Series firewalls.'
      ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0300
      fix: Populate classification (reliability A/B vendor + corroborating Unit 42), techniques[] (T1190 etc.), affected_products
        and cves[].affected/fixed on the survivor entry.
      class: imprecision
  - entry: 2026-05-14/cve-2026-0300-pan-os-captive-portal-patch-wave-2-delayed-to
    verdict: factual-error
    defects:
    - where: title / headline / summary
      claim: patch wave 2 delayed to 2026-05-28 for eight high-traffic build streams
      defect: 'No source shows a delay: the 05/28 ETA for exactly these eight builds was in the advisory from initial publication
        (and the 2026-05-12 entry already reported the second wave around 2026-05-28). ''high-traffic'' is also unsourced.'
      ground_truth: 'Rapid7 ETR (pub 2026-05-06, updated 2026-05-13) Fix ETA: 12.1.7 05/28; 11.2.4-h17 05/28, 11.2.12 05/28;
        11.1.7-h6 05/28, 11.1.15 05/28; 10.2.7-h34 05/28, 10.2.13-h21 05/28, 10.2.16-h7 05/28; PSIRT timeline has no ''delayed''
        entry on 2026-05-13 (''Updated the release timeline and Solution table'').'
      ground_truth_url: https://rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300
      fix: 'Retitle as an unchanged second-wave ETA (or fold into the survivor as a changelog line): ''first wave published
        2026-05-13; eight fix builds still ETA 05/28''.'
      class: factual-error
    - where: body para 1
      claim: PSIRT updated its CVE-2026-0300 advisory on 2026-05-13 to reflect first-wave patch availability but to also disclose
        a **second patch wave with an ETA of 2026-05-28** for eight commonly-deployed build streams
      defect: The second-wave ETAs were not disclosed on 2026-05-13; they were published with the advisory on 2026-05-05/06.
        'commonly-deployed' unsourced.
      ground_truth: 'Rapid7 (pub 2026-05-06): ''No patches are currently available; fixed versions are expected to begin rolling
        out on May 13, 2026, with additional releases through May 28, 2026.'''
      ground_truth_url: https://rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300
      fix: Say the 2026-05-13 revision confirmed first-wave availability while the eight 05/28 ETAs stood unchanged.
      class: factual-error
    - where: body para 1
      claim: Operators running any of those builds cannot patch yet; the interim mitigation ... is the only option until 28
        May.
      defect: The eight listed versions are the FIXED target builds awaiting release (operators cannot run them yet); the sentence
        should speak of operators whose branch fix is one of those builds. On other maintenance trains fixes were already out
        (e.g. 10.2.10-h36, 11.2.7-h13, 11.1.13-h5).
      ground_truth: 'PSIRT 10.2 row: ''>= 10.2.13-h21'' listed under Unaffected; Solution: ''10.2.11 through 10.2.13-h* Upgrade
        to 10.2.13-h21 or 10.2.18-h6 or later.'''
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: 'Reword: ''Operators on trains whose only listed fix is one of these builds (and who cannot jump to a later available
        fix) remain mitigation-only until 05/28.'''
      class: imprecision
    - where: body para 2
      claim: were not independently corroborated by HIGH-reliability third-party reporting in window
      defect: Third-party reporting did reproduce the vendor's per-build ETA table (Rapid7, Censys), so the non-corroboration
        statement is inaccurate.
      ground_truth: 'Censys: ''Roughly half of the fixed builds are scheduled for May 13, 2026 and the remaining builds for
        May 28, 2026.'' Rapid7 table with per-build ETAs.'
      ground_truth_url: https://censys.com/advisory/cve-2026-0300/
      fix: Drop the sentence or cite Rapid7 as corroboration.
      class: imprecision
    - where: summary / body
      claim: CL-STA-1132 in-the-wild exploitation continues
      defect: No cited source post-dates 2026-05-08 reporting; 'continues' is an inference, and Unit 42's 'continues' is not
        stated.
      ground_truth: 'Unit 42 (published 2026-05-06/07, modified 2026-05-08): ''We are aware of only limited exploitation of
        CVE-2026-0300 at this time.'''
      ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
      fix: Say 'limited exploitation (CL-STA-1132) was reported at disclosure' without asserting continuation.
      class: imprecision
    - where: frontmatter
      claim: 'verification: single-source; no classification; no techniques[]; affected/fixed null'
      defect: Two vendor sources are cited yet verification says single-source; classification missing; techniques missing.
      ground_truth: Entry cites PSIRT (primary) and Unit 42 (corroborating).
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Resolve on the survivor entry.
      class: imprecision
  - entry: 2026-05-18/cve-2026-0300-pan-os-captive-portal-revised-fix-release-time
    verdict: factual-error
    defects:
    - where: actions[0] and body para 2 'Defender action'
      claim: if any device runs `10.2.13-h21` or `10.2.16-h7`, confirm Captive Portal / User-ID Authentication Portal mitigation
        remains active and track the wave-2 patch target (2026-05-28)
      defect: 'Inverted: 10.2.13-h21 and 10.2.16-h7 are the FIXED builds (affected is ''< 10.2.13-h21'' / ''< 10.2.16-h7''),
        so a device on them is not affected and has no wave-2 wait. ''Apply the published Threat Prevention rule'' is also unavailable
        on any PAN-OS 10.2 build (needs 11.1+).'
      ground_truth: 'PSIRT Product Status 10.2: ''Affected < 10.2.7-h34 < 10.2.10-h36 < 10.2.13-h21 < 10.2.16-h7 < 10.2.18-h6
        | Unaffected >= 10.2.7-h34 >= 10.2.10-h36 >= 10.2.13-h21 >= 10.2.16-h7 >= 10.2.18-h6''; ''Decoder capabilities necessitate
        PAN-OS 11.1 or a later version for Threat ID support.'''
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: 'Rewrite: 10.2 devices below 10.2.13-h21 / 10.2.16-h7 (on those trains) stay mitigation-only until those fixes ship;
        devices on or above them are fixed.'
      class: factual-error
    - where: body para 1
      claim: PA-Series and VM-Series devices on those two specific builds remain mitigation-only. / wave-2 target remains 2026-05-28
      defect: The PSIRT only records that the fix release timeline for 10.2.16-h7 (05-14) and 10.2.13-h21 (05-16) was updated;
        the entry never states the new date, yet asserts the wave-2 target 'remains' 05-28 for them. Today both are listed as
        fixed builds with no ETA, while the 05-28 update names only 11.1.15, 11.1.7-h6, 11.2.4-h17 and 11.2.12. 'commonly deployed
        LTS branches in large enterprise and government estates' is unsourced.
      ground_truth: 'Timeline: ''2026-05-16 Updated the Fix release timeline for 10.2.13-h21.'' ''2026-05-14 Updated the Fix
        release timeline for 10.2.16-h7.'' ''2026-05-28 Updated the Fix release timeline for 11.1.15, 11.1.7-h6, 11.2.4-h17
        and 11.2.12.'''
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: State only what the timeline supports (fix timeline for those two builds revised 05-14/05-16, new dates not disclosed
        in the page text) and drop the LTS/government-estate sentence and the 'remain mitigation-only' assertion.
      class: factual-error
    - where: frontmatter cves[0].status
      claim: 'status: [exploited, cisa-kev, mitigation-only]'
      defect: By 2026-05-18 fixed builds were available for most trains (first wave published 2026-05-13); the status omits
        patch-available and presents the CVE as mitigation-only.
      ground_truth: 'KEV requiredAction: ''5/13/2026: Palo Alto has released a variety of patches.''; Rapid7: ''As of May 13,
        2026, the first round of patches has been published.'''
      ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      fix: Add patch-available; keep mitigation-only only if tied to the still-unreleased builds.
      class: factual-error
    - where: body para 2
      claim: the actively-exploited posture (unauthenticated heap overflow in the User-ID Authentication Portal / Captive Portal
        service, CVSS 9.3, pre-auth root RCE)
      defect: No source calls it a heap overflow; the vendor says buffer overflow (CWE-787 out-of-bounds write).
      ground_truth: 'PSIRT: ''A buffer overflow vulnerability in the User-ID Authentication Portal (aka Captive Portal) service
        ... allows an unauthenticated attacker to execute arbitrary code with root privileges''; KEV name ''Out-of-bounds Write
        Vulnerability''.'
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Replace 'heap overflow' with 'buffer overflow (CWE-787)'.
      class: factual-error
    - where: frontmatter
      claim: 'entities: []; no classification; no techniques[]; summary begins ''UPDATE (originally covered 2026-05-07 deep
        dive)''; verification: single-source'
      defect: 'Migration artefacts: no classification, no techniques, no entity link to campaign:cl-sta-1132 (not mentioned
        in the body either), update narrative with no target entry; a revised ETA with no new date is a non-event.'
      ground_truth: Same finding as the other CVE-2026-0300 entries; PSIRT timeline lines above.
      ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
      fix: Fold into the survivor as an improvement/internal record rather than keep as a standalone entry.
      class: imprecision
  - entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    verdict: factual-error
    defects:
    - where: body (discovery and disclosure sentence)
      claim: responsibly disclosed to F5/NGINX on 2026-04-18, with RCE PoC shared to F5/NGINX under NDA on 2026-04-28, and patches
        released on 2026-05-13
      defect: 'Wrong dates and an invented NDA: depthfirst''s own timeline has internal discovery on 04-18, report to NGINX
        on 04-21, NGINX confirmation 04-24, notice on 04-28 that a working RCE PoC existed and the PoC itself shared with NGINX
        on 05-05; no source mentions an NDA.'
      ground_truth: 'depthfirst timeline: ''4/18/2026: We used depthfirst''s internal system ... it reported 5 memory corruption
        issues. 4/21/2026: We reported all 5 issues to NGINX via a GitHub security advisory. ... 4/28/2026: We informed NGINX
        that we had developed a working PoC demonstrating RCE. 5/5/2026: We shared our RCE PoC with NGINX''; BleepingComputer:
        ''discovered on April 18, 2026, and reported to the vendor on April 21''.'
      ground_truth_url: https://depthfirst.com/research/nginx-rift-achieving-nginx-rce-via-an-18-year-old-vulnerability
      fix: 'Write: found 2026-04-18, reported to NGINX 2026-04-21, RCE PoC shared with NGINX 2026-05-05, fixes and advisory
        released 2026-05-13; drop ''under NDA''.'
      class: factual-error
    - where: body para 1 (cited to depthfirst and NCSC-CH)
      claim: 'CVE-2026-42945 (CVSS 4.0: 9.2 / CVSS 3.1: 8.1, CWE-122, codename "NGINX Rift")'
      defect: The 3.1 score 8.1 and CWE-122 are on neither cited page (they are in F5's CNA CVE record, where they are correct);
        adjacency gap.
      ground_truth: 'F5 CNA record CVE-2026-42945: cvssV3_1 baseScore 8.1 (AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H), cvssV4_0 baseScore
        9.2, CWE-122 ''Heap-based Buffer Overflow''.'
      ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-42945
      fix: Cite the F5 advisory / CVE record for 8.1 and CWE-122.
      class: imprecision
    - where: body ('Exploitation status' and ASLR sentences)
      claim: 'Exploitation status: no in-the-wild confirmed; ... RCE requires ASLR to be disabled on the host.'
      defect: 'Stale today: VulnCheck reported exploitation attempts against honeypots (The Hacker News, 2026-05-17); F5''s
        CVE description was later widened to ''ASLR disabled or when the attacker can bypass ASLR''. The entry was never updated;
        the exploited state lives only in the 2026-05-18 sibling entry.'
      ground_truth: 'F5 CNA description (dateUpdated 2026-09-10): ''attackers can execute code on systems with Address Space
        Layout Randomization (ASLR) disabled or when the attacker can bypass ASLR.'' THN: ''exploitation attempts detected against
        its honeypot networks.'''
      ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-42945
      fix: Fold into the survivor; state exploitation attempts since ~2026-05-16/17 and the CNA's ASLR wording.
      class: imprecision
    - where: frontmatter
      claim: 'classification absent; techniques: []; cves[].affected/fixed null; evidence: []'
      defect: No Admiralty rating, no ATT&CK mapping (T1190 exploit of public-facing application), no structured affected/fixed
        although both are stated by sources; no evidence quotes.
      ground_truth: 'F5 CNA: Plus R36 <R36 P4, R32 <R32 P6; Open Source 0.6.27 <1.30.1; nginx.org: ''Not vulnerable: 1.31.0+,
        1.30.1+. Vulnerable: 0.6.27-1.30.0''.'
      ground_truth_url: https://nginx.org/en/security_advisories.html
      fix: Populate on the survivor.
      class: imprecision
  - entry: 2026-05-18/cve-2026-42945-nginx-rift-in-the-wild-exploitation-confirmed
    verdict: imprecision
    defects:
    - where: body para 1
      claim: The flaw is reachable by an unauthenticated remote attacker via a single crafted HTTP request to any NGINX instance
        running a rewrite-rule configuration that uses unnamed PCRE captures (`$1`, `$2`)
      defect: 'Overbroad trigger: exposure needs a rewrite whose replacement contains ''?'' and that is followed by another
        rewrite, if or set directive in the same scope, with an unnamed capture; unnamed captures alone are not enough (the
        05-15 sibling states the full condition).'
      ground_truth: 'F5/GHSA: ''This vulnerability exists when the rewrite directive is followed by a rewrite, if, or set directive
        and an unnamed PCRE capture (for example, $1, $2) with a replacement string that includes a question mark (?).'''
      ground_truth_url: https://github.com/advisories/GHSA-gcgv-v5gf-c543
      fix: State the three-part condition.
      class: imprecision
    - where: body para 2 (detection anchors)
      claim: correlated with inbound HTTP requests carrying unusually long or deeply-nested rewrite-rule input strings from
        the same source
      defect: No source describes 'deeply-nested rewrite-rule input strings'; the public analysis shows the overflow is driven
        by a request URI padded with escapable characters (plus signs, %, &) against a vulnerable rewrite; the sentence is an
        uncited invention (self-hedged but still wrong in kind).
      ground_truth: 'depthfirst: ''By padding the request URI with plus signs, we can force the escaping function to expand
        each byte into three bytes, overflowing the allocated chunk.'''
      ground_truth_url: https://depthfirst.com/research/nginx-rift-achieving-nginx-rce-via-an-18-year-old-vulnerability
      fix: Replace with 'requests to affected rewrite locations whose URI carries many escapable characters, followed by worker
        exits on signal (nginx error log) and respawn'.
      class: imprecision
    - where: headline / summary / actions[0]
      claim: VulnCheck honeypot telemetry confirms in-the-wild exploitation as of 2026-05-17
      defect: The cited THN piece (dated 2026-05-17) reports exploitation ATTEMPTS against VulnCheck honeypots with unknown
        objectives; 2026-05-17 is the article date, not a stated observation date (secondary reports put first detection on
        05-16, unverified).
      ground_truth: 'THN: ''threat actors have begun to weaponize the flaw, with exploitation attempts detected against its
        honeypot networks. The nature of the attack activity and the end goals are presently unknown.'''
      ground_truth_url: https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html
      fix: Say 'VulnCheck reported exploitation attempts against its honeypots (reported 2026-05-17)'.
      class: imprecision
    - where: evidence[0] and frontmatter
      claim: 'evidence quote publisher: ctipilot v2 brief (migrated); classification absent; techniques []'
      defect: The only evidence quote is the entry's own migrated v2 text, not a source passage; no classification or ATT&CK
        mapping; verification multi-source with two vendor-adjacent secondary sources and no exploitation primary (VulnCheck's
        own report is not cited).
      ground_truth: THN names VulnCheck's LinkedIn post as the origin; no VulnCheck page is cited.
      ground_truth_url: https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html
      fix: Replace with a verbatim THN passage; add classification (B/2-ish) and techniques; resolve on the survivor.
      class: imprecision
    - where: body para 2
      claim: Affected per [F5 PSIRT advisory K000161019]
      defect: 'The cited F5 article is a JS shell none of extract, raw or WebFetch can render, so its content could not be checked
        directly; the product and version list matches NCSC-CH #12575, depthfirst and nginx.org (which names K000161019 as the
        CVE-2026-42945 advisory).'
      ground_truth: 'nginx.org: ''Buffer overflow in the ngx_http_rewrite_module ... Advisory K000161019 ... CVE-2026-42945
        ... Not vulnerable: 1.31.0+, 1.30.1+ Vulnerable: 0.6.27-1.30.0''.'
      ground_truth_url: https://nginx.org/en/security_advisories.html
      fix: None required beyond noting the F5 page is unverifiable; optionally cite nginx.org.
      class: imprecision
  - entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    verdict: factual-error
    defects:
    - where: summary and main analysis (para 4)
      claim: No exploitation is reported by any party; ... / No party reports exploitation of any of these.
      defect: Superseded by the entry's own 2026-08-16 update (Defused honeypot exploitation attempts 2026-08-14; NCSC-NL advisory
        2026-08-15 'actively scanning'); the summary and the original analysis paragraph were not revised, so the entry contradicts
        itself while frontmatter says exploited / actively-exploited.
      ground_truth: 'BleepingComputer 2026-08-14: ''Defused security researchers confirmed earlier today that CVE-2026-58231
        is now being targeted in the wild.'' NCSC-NL NCSC-2026-0302 (2026-08-15): ''Beveiligingsbedrijf Defused meldt dat kwaadwillenden
        actief scannen''.'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/
      fix: Rewrite the summary to state exploitation attempts since 2026-08-14 and reword 'No party reports exploitation' to
        the 2026-08-11 snapshot.
      class: factual-error
    - where: body para 5 and update section; actions[0]; title
      claim: an unauthenticated request to the Data Hub Adapter import endpoint ... surface requests to the Data Hub import
        path ... legitimate Data Hub imports arrive from a small, enumerable set of integration sources ... the adapter's import
        functions
      defect: No cited source calls the vulnerable entry point an 'import' endpoint, path or function; SAP says 'certain functions
        lacking sufficient validation' reachable via 'a default authentication client'. The detection guidance and the title
        rest on an unsourced mechanism.
      ground_truth: 'SAP (via BleepingComputer): ''SAP Commerce Cloud allows an unauthenticated attacker to abuse a default
        authentication client and submit specially crafted input to certain functions lacking sufficient validation''; Onapsis:
        ''restrict access to the vulnerable endpoint''.'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/
      fix: Replace 'import endpoint/path/functions' with 'the vulnerable Data Hub Adapter endpoint' and drop the 'legitimate
        imports come from enumerable sources' claim.
      class: factual-error
    - where: update section 2026-08-16, para 1
      claim: whoever is sending these requests built a working exploit without published research to copy, on a three-day clock
