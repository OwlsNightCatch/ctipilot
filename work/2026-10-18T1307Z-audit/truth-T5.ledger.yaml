    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Affected are PAN-OS 12.1, 11.2, 11.1 and 10.2 releases below the fixed builds in Palo Alto's table and Prisma Access 11.2 and 10.2; Panorama and Cloud NGFW are not affected ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
