    text: "IBM HTTP Server's CVSS 9.8 flaw CVE-2026-9170 is fixed in Fix Packs 9.0.5.29 and 8.5.5.30, both now released"
  - claim_id: 10f5ed689b
    entry: 2026-05-29/cve-2026-9170-ibm-http-server-websphere-application-server-p
    surface: "summary"
    kind: frontmatter
    text: "IBM HTTP Server 9.0 and 8.5, the component shipped with all editions of WebSphere Application Server, is vulnerable to CVE-2026-9170 (CVSS 9.8), improper input validation that IBM says can cause denial of service and potential remote code execution. IBM rates configurations using the SSLEnable directive as the common exposure. Fix Packs 8.5.5.30 and 9.0.5.29, released on 2026-07-27 and 2026-09-08, carry the fix, and the interim fix for APAR PH71265 is now part of the cumulative interim fix IFPH71594. NCSC-CH gives the exploitation status as unknown."
