    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "headline"
    kind: frontmatter
    text: "Gitea Docker instances with reverse-proxy login enabled accepted a spoofed login header from anyone, and NCSC-CH rates it exploited"
  - claim_id: 21323ca266
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "summary"
    kind: frontmatter
    text: "Gitea's official Docker image hard-coded REVERSE_PROXY_TRUSTED_PROXIES to the trust-all wildcard, so on instances where an administrator enabled reverse-proxy authentication, anyone who can reach the container's HTTP port can send an X-WEBAUTH-USER header and be signed in as any user whose login name is known or guessable, admins included (CVE-2026-20896, CVSS 9.8). NCSC-CH set it to actively exploited on 2026-07-10. Sysdig, whose telemetry the public reporting rests on, says the attempt it saw had not progressed to exploitation, though SecurityWeek reports the same telemetry as exploitation. Fixed in 1.26.3, and Gitea recommends 1.26.4."
  - claim_id: 796b90cb97
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Gitea Docker instance that runs with ENABLE_REVERSE_PROXY_AUTHENTICATION = true to 1.26.4, or until then set REVERSE_PROXY_TRUSTED_PROXIES to the authenticating proxy's exact address, internet-reachable instances first."
