    kind: record-summary
    text: "The CVE statuses were swapped: CVE-2026-50751 (the exploited, KEV-listed flaw) lacked the exploited and KEV markers while the unexploited companion CVE-2026-50752 carried them. The statuses now match the sources, the broken pointer to a brief section is replaced by a link to the companion deep-dive entry, and two overlapping actions are merged. The headline, title, summary and immediate action now give Check Point's one confirmed Qilin-affiliate case and its medium-confidence actor assessment separately, the NCSC-CH advisory is no longer called Action-Required, and CVE-2026-50752 is typed as a certificate-validation logic flaw enabling a site-to-site MitM under specific conditions. The NCSC-CH quote is a single contiguous passage, the affected Security Gateway and Spark Firewall products are named, and the main text gains cited exposure, detection and takeaway lines. NCSC-NL's lower CVSS v4 scores are given beside Check Point's, and the affected versions and hotfix articles are recorded for both CVEs."
