    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "Variant 1 draws on real booking data (dates of stay, hotel names, guest names) from the April 2026 Booking.com data leak and sends a fake refund lure on WhatsApp that leads to a phishing page imitating TWINT and then to a second one posing as a bank, where the victim enters card data."
