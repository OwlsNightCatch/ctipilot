    surface: "cves[CVE-2026-9170]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-9170\", \"cvss\": \"9.8\", \"status\": [\"patch-available\"], \"affected\": \"IBM HTTP Server 9.0.0.0 through 9.0.5.28 and 8.5.0.0 through 8.5.5.29\", \"fixed\": \"Fix Pack 9.0.5.29 (released 2026-09-08) / 8.5.5.30 (released 2026-07-27), or the interim fix for APAR PH71265 (cumulative IFPH71594)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
