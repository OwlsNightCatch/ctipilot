    surface: "summary"
    kind: frontmatter
    text: "Fortinet patched CVE-2026-25089 (CVSS 9.8), an unauthenticated OS command injection in the FortiSandbox web UI's VNC-launch handler, on 2026-06-09. Defused then reported exploitation of it together with the April flaws CVE-2026-39808 (unauthenticated command injection, CVSS 9.8) and CVE-2026-39813 (JRPC path traversal authentication bypass, CVSS 9.8), and CISA added CVE-2026-25089 and CVE-2026-39808 to KEV on 2026-07-16. FortiSandbox 5.0.6 and 4.4.9 fix all three, and Fortinet lists 5.2 as not affected by CVE-2026-25089 and CVE-2026-39813."
