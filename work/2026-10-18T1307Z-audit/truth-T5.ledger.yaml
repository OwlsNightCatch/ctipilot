    entry: 2026-06-16/cve-2026-48611-cve-2026-48612-phpbb-unauthenticated-authenti
    surface: "summary"
    kind: frontmatter
    text: "phpBB 3.3.17 fixes CVE-2026-48611 (CVSS 9.4 per its discoverer Pentest-Tools.com, 9.8 per heise), which lets one unauthenticated request obtain a session as any active user, administrators included, on default installations, and CVE-2026-48612 (CVSS 8.3), an OAuth account-link CSRF that takes over accounts on boards with OAuth enabled when the victim opens a crafted link. Aikido found the first flaw independently. Proof-of-concept requests are public, and CVE-2026-48611 has no configuration workaround."
