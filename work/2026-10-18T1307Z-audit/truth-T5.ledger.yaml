  - claim_id: cfd4be8be1
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto's mitigations are a dedicated certificate used only for authentication override cookies, or disabling Authentication Override ("
