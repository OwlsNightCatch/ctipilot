    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "record 2026-07-10T12:53:00Z"
    kind: record-summary
    text: "Switzerland's NCSC published an advisory on 2026-07-10 raising the exploitation status of the Gitea Docker-image reverse-proxy auth bypass (CVE-2026-20896, CVSS 9.8) to \"Actively Exploited, Proof of Concept Available\". The underlying flaw — the official Docker image trusting a spoofable X-WEBAUTH-USER header from any source IP for unauthenticated admin impersonation — was covered on 2026-06-23; the in-window delta is the national-CERT exploitation-status escalation. Public telemetry to date (Sysdig, via SecurityWeek/The Hacker News) still shows only reconnaissance-stage probing, so treat NCSC-CH's \"actively exploited\" label as a national-authority assessment and prioritise patching internet-reachable Docker instances now."
  - claim_id: 7c975bfd6d
    entry: 2026-06-23/cve-2026-20896-gitea-docker-trust-all-reverse-proxy-default
    surface: "record 2026-09-30T06:47:56Z"
    kind: record-summary
    text: "The main text still said no in-the-wild exploitation was reported after the 2026-07-10 update recorded NCSC-CH's actively-exploited status, and the summary and main text presented the takeover as open to anyone reaching the port. It requires reverse-proxy authentication to be enabled on the official Docker image with the trusted-proxies setting left at the image default, and a known or guessable username. The count of fixed flaws and the description of CVE-2026-27775 are corrected, an unsourced claim that Gitea dominates DACH and EU public-sector DevOps is removed, and hunting advice that relied on a log field no source documents is dropped."
