    entry: 2026-06-12/cve-2026-25089-fortinet-fortisandbox-unauthenticated-os-comm
    surface: "actions[0]"
    kind: frontmatter
    text: "**Upgrade every FortiSandbox on the 5.0 or 4.4 branch to 5.0.6 or 4.4.9**, which fixes all three flaws Defused reports exploited (CVE-2026-25089, CVE-2026-39808, CVE-2026-39813), and confirm the web UI and JRPC API answer only from the management network."
