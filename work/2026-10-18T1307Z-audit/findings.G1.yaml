    attribution: BSI CERT-Bund (WID-SEC-2026-3991)
    source_url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3991
  extended_notes: 'Nutanix PDF text (`fetch_source.py pdf`, per-font ToUnicode decode, characters come back one per line and must be re-joined): ''A remote actor possessing network connectivity to port 9440 could circumvent standard validation controls by supplying a specially crafted HTTP request header to the API, potentially obtaining unauthorized administrative access to Prism APIs.'' ''Restrict Prism management access to trusted administrative networks'' is the workaround; fixes AOS 7.6.0.8 / 7.5.2 / 7.3.1.18 and PC 7.6.0.8 / 7.5.2 / 7.3.1.18. Verification gap: BSI''s note is derived from the vendor advisory, so the two sources are not independent; TheHackerWire (aggregator) claims root command execution on Controller VMs but was not usable as a source. Hunt: Prism audit/API logs for administrative API calls from non-admin source networks and any session created without a prior login event; reachability check for TCP 9440 from user and partner networks.'
