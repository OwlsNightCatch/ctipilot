  summary: 'SAP''s 2026-10-13 Patch Day released 16 new security notes and 4 GitHub security advisories plus 2 updates. Four are Critical: CVE-2026-89111 (OAuth2 SSRF in SAP Cloud SDK for Python below 0.45.2, CVSS 10.0, AV:N/PR:N/UI:N, scope changed; a library), CVE-2026-89107 (code injection in S/4HANA Manage Substitution/Validation Rules, S4CORE 105-109, 9.9, PR:L), CVE-2026-89110 (broken access control in NetWeaver Visual Composer VC70RUNTIME 7.50, 9.9, PR:L) and CVE-2026-89108 (missing authorization in Manufacturing Integration and Intelligence configuration service XMII 15.4/15.5, 9.1, PR:H). The one unauthenticated network flaw in the product suite is CVE-2026-58249, a memory-corruption denial of service in NetWeaver and Web Dispatcher ICM (7.5, KRNL64UC 7.53, WEBDISP 7.53-9.16, KERNEL 7.53-9.20). Note bodies are login-gated, so affected-release detail beyond the page''s version column is not available; SAP states no exploitation. Compared with September''s pre-authentication RCE already in the store (2026-09-10/sap-september-2026-overpass-s4get-preauth-rce), October''s Criticals mostly need a low-privileged account. SAP finance and HR run across federal and cantonal administrations.'
