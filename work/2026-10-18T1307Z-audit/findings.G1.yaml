  discovery_trace: 'first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/csaf/v2/changes.csv -> NCSC-2026-0401 (Exchange out-of-band, 2026-10-06) and NCSC-2026-0419 (seven Exchange CVEs) -> compared against store entry 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update, which names only CVE-2026-70571 and CVE-2026-70279 -> primary: MSRC record via `msrc cve CVE-2026-96940` and CVRF 2026-Oct (Remediations/FixedBuild)'
  summary: 'Microsoft shipped an out-of-band Exchange Server update ahead of the October cycle: CVE-2026-96940 (weak authentication, CVSS 8.8, Important, rated Exploitation More Likely, not exploited, not publicly disclosed; released 2026-10-02 with Exchange Online already fixed service-side). Microsoft''s FAQ says an authenticated attacker could gain access to other users'' mailboxes in the same organisation and read messages and attachments; it does not cross tenant boundaries. The first fixed builds are Exchange SE RTM 15.02.2562.053 (KB5129955), 2019 CU15 15.02.1748.053 (KB5129956), 2019 CU14 15.02.1544.048 (KB5129957) and 2016 CU23 15.01.2507.075 (KB5129958); the 2026-10-13 updates carried by the existing entry supersede them. NCSC-NL lists seven Exchange CVEs for October (CVE-2026-70279, 70571, 77910, 87692, 87695, 87696, 96940); besides the two in the published entry, CVE-2026-77910 (8.8, an authenticated user poisons a shared Exchange Control Panel cache so a malicious mail add-in is installed in another user''s mailbox) and CVE-2026-87696 (7.5, same mechanism, AC:H) are network-reachable by a low-privileged account, and CVE-2026-87692 and CVE-2026-87695 (7.8) are local privilege escalations to SYSTEM. The published entry''s ''not exploited'' statement remains correct; the gap is the cross-mailbox read and ECP add-in injection class and the earlier out-of-band date.'
