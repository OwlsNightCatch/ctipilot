- id: windows-dns-server-cve-2026-62878-public-dos-poc-0patch-legacy-micropatch
  title: 'CVE-2026-62878, Windows DNS Server: the August fix for an unauthenticated stack overflow (CVSS 9.8) now has a public remote DoS proof of concept, RCE not achieved; 0patch micropatched Server 2008 R2, 2012 and 2012 R2 on 2026-10-13'
  sources:
  - url: https://0patch.com/blog/micropatches-released-for-windows-dns-server-remote-code-execution-vulnerability
    publisher: ACROS Security / 0patch
    date: '2026-10-13'
    role: primary
  - url: https://github.com/nmlz/CVE-2026-62878
