- id: docker-hub-cve-2026-105445-ghostpat-account-conversion-token-reassignment
  title: 'CVE-2026-105445 (GhostPAT), Docker Hub: converting an account into an organization re-assigned its personal access tokens to the named owner without rotating the secret, fixed server-side on 2026-09-30, no exploitation found (CVSS 4.0 9.4)'
  sources:
  - url: https://www.docker.com/blog/docker-hub-security-advisory-cve-2026-105445/
    publisher: Docker (Docker Hub security advisory)
    date: '2026-10-12'
    role: primary
  discovery_trace: 'first seen at: G3b lead via coordinator message -> WebSearch ("Docker Hub personal access token CVE-2026-105445") -> primary: Docker blog URL https://www.docker.com/blog/docker-hub-security-advisory-cve-2026-105445/ (`extract`)'
  summary: 'Docker''s advisory (2026-10-12) describes a flaw in Docker Hub''s identity and access management: from 2026-08-26 an account-to-organization conversion re-assigned the converted account''s personal access tokens (PATs) to the user named as the organization owner by changing the owner record without rotating or revoking the secret, without asking or notifying the named owner. An attacker could create an account and a PAT, convert the account naming a target user as owner, and keep a token that authenticated to the registry as the target within the token''s scope (pull, push, delete of the target''s images and of organizations where the target had access). It gave no web-console access and could not change password, email or 2FA. Researchers reported it on 2026-09-30 and Docker deployed the fix the same afternoon, emailed exposed users on 2026-10-02 and force-deactivated all transferred PATs on 2026-10-08 (except those owners asked to keep). Docker says it found no evidence of exploitation after reviewing every conversion and about 304,000 pushes made with transferred tokens, but notes registry logs show token use, not existence, so an unused transferred token leaves no trace. Hosted service only; no customer patching, but organisations that pull or push through Docker Hub should review PATs and prefer organization access tokens.'
  region_nexus: global; relevant to public-sector CI/CD and container supply chains that pull from or publish to Docker Hub
  primary_sector_nexus: indirect
