- id: veeam-kb4934-backup-viewer-deserialization-rce-cve-2025-64393
  title: 'Veeam Backup & Replication 12.3.2 P3 and older: a Backup Viewer role account reaches remote code execution on the backup server through Mount Service deserialization (CVSS 4.0 9.4), fixed in 12.3.2 P4'
  sources:
  - url: https://www.veeam.com/kb4934
    publisher: Veeam (KB4934)
    date: '2026-10-06'
    role: primary
  - url: https://security-hub.ncsc.admin.ch/#/posts/13043
