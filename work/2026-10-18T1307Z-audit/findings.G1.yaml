    source_url: https://security-hub.ncsc.admin.ch/#/posts/13056
  - quote: Simply viewing the message in the Outlook Reading Pane could trigger the vulnerability, without the recipient opening the message or clicking anything in it.
    attribution: Microsoft Security Response Center
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-70242
  - quote: An unauthenticated attacker could exploit this vulnerability by sending a specially crafted packet to an affected service over the network.
    attribution: Microsoft Security Response Center
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-96934
  extended_notes: 'Detection/triage angle: the wormable class has no exploitation signal yet, so the discriminator is exposure. Inventory Windows servers that carry the DHCP, DNS, NPS, RRAS, MSMQ, RD Gateway or IIS roles and domain controllers (AD DS CVE-2026-70229 ''Exploitation More Likely'', AC:H) and patch those before workstations; on mail clients, Outlook Reading Pane RCEs are delivered by email, so the telemetry class is the mail-flow plus OUTLOOK.EXE child-process lineage. Fixed builds are per Windows branch (cumulative KB5126646 Server 2025, KB5126655 Server 2022, KB5126651 Server 2019/Win10 1809, KB5126868 Server 2016/Win10 1607, KB5126836 Server 2012 R2, KB5126835 Server 2012, KB5127648/KB5127646 Windows 11, KB5126653 Win 11 23H2, KB5126657 Win 10 21H2/22H2); Outlook/Word/PowerPoint fixes ship through Click-to-Run/Office release notes (Outlook build 16.0.17932.21056 named for CVE-2026-88156). Also open and relevant to the store''s Exchange entry: the October Windows Server updates reportedly destabilise Exchange (already carried by 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update). Microsoft introduced provisional ''risk cohorts'' on 2026-10-13 (MSRC blog), a non-official grouping of CVEs by shared customer-assessment question. Counts: BleepingComputer 1,411 (excludes 348 fixed earlier in October), NCSC.ch ~1,400, CCB 1,407 (69 Critical).'
