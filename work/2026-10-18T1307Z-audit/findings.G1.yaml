    date: '2026-10-09'
    role: corroborating
  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13043 ([Advisory] Veeam Backup & Replication: Critical Remote Code Execution (CVE-2025-64393), 2026-10-09) -> primary: Veeam KB URL https://www.veeam.com/kb4934'
  summary: 'Veeam''s KB4934 (2026-10-06) resolves a critical flaw that lets a low-privileged user holding the Backup Viewer role perform remote code execution on the Veeam backup server through insecure deserialization of untrusted data received via the Mount Service (CVSS 4.0 9.4, AV:N/PR:L). It affects only Veeam Backup & Replication 12.3.2 P3 (build 12.3.2.4854) and older builds, is fixed in 12.3.2 P4 (build 12.3.2.4934), and does not affect version 13. KB4934 also fixes a Backup Viewer flaw that lets the account modify or delete the Enterprise Manager master key and read or overwrite stored antivirus update credentials (6.1) and a reflected XSS in Enterprise Manager (4.8), and reminds customers that version 12 reaches end of support on 2027-02-28. NCSC Switzerland (2026-10-09) maps the RCE to CVE-2025-64393 and says exploitation status is unknown; Veeam''s KB text read here names no CVE. No source reports exploitation. Assessment: backup servers are a standard ransomware pre-encryption target, and the prerequisite is any account with the Backup Viewer role, i.e. a credential-theft step away.'
  region_nexus: global; Veeam Backup & Replication is widely used by public administrations
  primary_sector_nexus: direct
