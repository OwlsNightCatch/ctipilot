- id: anydesk-linux-cve-2026-109390-anypwn-public-exploit
  title: 'CVE-2026-109390, AnyDesk for Linux: a pre-authentication heap overflow in the session protocol gives root, a working public exploit (AnyPwn) appeared on 2026-10-08, fixed since 8.0.3 (CVSS 9.8)'
  sources:
  - url: https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html
    publisher: The Hacker News
    date: '2026-10-09'
    role: primary
  - url: https://ccb.belgium.be/advisories/warning-critical-pre-authentication-remote-code-execution-anydesk-linux-patch
    publisher: Centre for Cybersecurity Belgium
    date: '2026-10-13'
    role: corroborating
  discovery_trace: 'first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (listing, 13/10/2026 ''Critical Pre-Authentication Remote Code Execution in AnyDesk for Linux, Patch Immediately!'') -> WebSearch ("AnyDesk Linux CVE-2026-109390 pre-authentication remote code execution proof-of-concept 8.0.3") -> pivot: The Hacker News URL https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html (exploit publication and mechanism)'
  summary: Researchers at V12 published a full working exploit, AnyPwn, on 2026-10-08 for a pre-authentication remote code execution flaw in AnyDesk Linux that gives root before anyone approves the connection (The Hacker News, 2026-10-09). The bug is a 32-bit size wraparound in the mode-5 stream packet handler of AnyDesk's session protocol (a declared payload length of 0xFFFFFFF0 plus a 16-byte header wraps to zero, so a tiny buffer is allocated while the large length is recorded); the published exploit reaches root through a ROP chain, works only over direct TCP connections on port 7070, is probabilistic (a failed heap layout crashes the service instead) and targets build 8.0.2. AnyDesk fixed it in 8.0.3 in June, describing it only as a crash fix with no CVE or advisory; the researchers say the same code path is reachable through AnyDesk relay servers but show only a Frida trigger, not a full chain over relays. CVE-2026-109390 (CVSS 9.8) was published on 2026-10-12 and the Belgian CCB warned on 2026-10-13 that a public proof of concept raises the risk of exploitation. No source reports in-the-wild exploitation. Windows and macOS are not affected per AnyDesk.
  region_nexus: global; remote-support tooling on Linux hosts, including admin workstations and servers
