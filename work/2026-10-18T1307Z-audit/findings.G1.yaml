  - quote: No CVE has been assigned to the vulnerability as of October 9.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html
  - quote: A proof-of-concept has been released publicly by security researchers.
    attribution: Centre for Cybersecurity Belgium
    source_url: https://ccb.belgium.be/advisories/warning-critical-pre-authentication-remote-code-execution-anydesk-linux-patch
  - quote: Upgrade AnyDesk for Linux installations to version 8.0.3 or the latest available stable release (e.g., 8.1.0+).
    attribution: Centre for Cybersecurity Belgium
    source_url: https://ccb.belgium.be/advisories/warning-critical-pre-authentication-remote-code-execution-anydesk-linux-patch
  extended_notes: 'Exposure check: AnyDesk Linux below 8.0.3 listening on TCP 7070 (direct-connection mode); restricting access to port 7070 is the researchers'' interim measure. Detection hook: unexpected child processes of the AnyDesk daemon running as root and AnyDesk service crashes/restarts (a failed heap layout crashes it). AnyDesk''s changelog described the June fix only as ''fixed a bug that could lead to a crash'', so patch-level inventories keyed on advisories alone would have missed it. CVE record evidence is an aggregator (OpenCVE, published 2026-10-12); NVD status ''Received''.'
