  summary: Zimbra's 10.1.21 release (notes dated in September) fixes a self-service password-recovery flaw that could let an unauthenticated attacker predict recovery codes and reset a user's password, tightens WebDAV so pre-MFA tokens are rejected until MFA completes, fixes an OnlyOffice integration issue that could allow unauthorized file writes and remote code execution under specific conditions, and a server-side JavaScript injection in the same integration that lets an authenticated user run commands. NCSC Switzerland's 2026-10-01 advisory lists CVE-2026-66911 and CVE-2026-66912 (reserved, no CVSS at disclosure) and describes the chain as account takeover without authentication, XSS needing victim interaction, and command execution in some configurations; it records exploitation status as unknown. No source reports exploitation, the release note gives no CVSS and the OpenJDK 17.0.19 upgrade disables legacy TLS_RSA cipher suites for external LDAP by default, which can break LDAP/Active Directory links after the update. Zimbra is used by some Swiss public-sector mail operators (NCSC.ch advised on it).
