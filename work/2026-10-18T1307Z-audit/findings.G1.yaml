sources_recipe_updates:
- id: advisories-ncsc-nl
  recipe: '`python3 tools/fetch_source.py url --direct https://advisories.ncsc.nl/csaf/v2/changes.csv` lists every advisory with its timestamp (the RSS and `ncsc-nl recent` cap at 25 items, about 7 days); then `url --direct https://advisories.ncsc.nl/csaf/v2/2026/ncsc-2026-NNNN.json` reads each CSAF (title, CVEs, scores, vendor references). Verified 2026-10-18 (42 advisories 0394..0437 in 440 h).'
- id: znuny-advisories
  recipe: '`extract https://www.znuny.org/en/advisories` read the full ZSA table with CVE, severity and date on 2026-10-18; the earlier 503 note is stale.'
- id: sap-security-notes
  recipe: '`extract https://support.sap.com/en/my-support/knowledge-base/security-notes-news/october-2026.html` returns the whole Patch Day note table with CVSS vectors (the generic security-notes-news.html page lists dates only); pattern .../security-notes-news/<month>-<year>.html.'
- id: oracle-cpu
  recipe: '`extract https://www.oracle.com/security-alerts/cpuoct2026.html` reads the pre-release announcement (per-product patch counts, remotely-exploitable-without-authentication counts, highest CVSS) from the Thursday before each CPU.'
- id: fortinet-psirt
  recipe: '`feed https://filestore.fortinet.com/fortiguard/rss/ir.xml 60` lists FG-IR ids and dates; `url --direct https://fortiguard.fortinet.com/psirt/FG-IR-26-NNN` then regex-strip the HTML for the Summary/Version/Known Exploited/CVSSv3/CVE ID block.'
- id: siemens-productcert
  recipe: '`url --direct https://cert-portal.siemens.com/productcert/csaf/ssa-NNNNNN.json` reads each CSAF (scores, vectors, descriptions); the feed gives V/Last-Update tags; SSB-091449 CSAF returned 403.'
- id: cisa-advisories
  recipe: WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories?f%5B0%5D=advisory_type%3A94 lists alerts and AA-series with dates and hrefs (verified 2026-10-18); `cisa csaf-recent 40` gives ICS advisory CSAF URLs read with `url --direct`.
- id: ncsc-ch-security-hub
  recipe: '`ncsc-csh post <id>` returns the full advisory text (severity, affected products, CVE list with CVSS, references) and is the cheapest national-authority view of what Swiss defenders were told; posts 13022, 13035, 13043, 13044 and 13056 held the items missing from the store.'
- id: ccb-belgium
  recipe: listing via `url https://ccb.belgium.be/advisories` (10 items with dd/mm/yyyy), `extract <advisory URL>` reads each warning including CVSS vectors with temporal metrics; AnyDesk, Splunk and FortiSIEM warnings were the in-window ones missing from the store.
- id: cccs-alerts
  recipe: the Atom feed returns only 40 items (2026-10-09 .. 10-16); pages are `extract <link>` readable (product/version lists only, no severity); not usable for a 440 h sweep.
