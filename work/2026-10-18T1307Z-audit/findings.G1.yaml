  extended_notes: 'Exposure check: Veeam B&R build 12.3.2.4854 or older (version 12 branch); who holds Backup Viewer; Mount Service reachability. Hunt: process creation under the Veeam Mount Service account and Backup Viewer logons from unusual hosts.'
