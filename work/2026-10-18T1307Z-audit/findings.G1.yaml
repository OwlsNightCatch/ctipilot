    role: corroborating
  discovery_trace: 'first seen at: 0patch-blog, URL https://blog.0patch.com/feeds/posts/default (2026-10-13 post) -> pivot: GitHub repository URL https://github.com/nmlz/CVE-2026-62878 -> MSRC record via `msrc cve CVE-2026-62878` (released 2026-08-11, Exploited No, Exploitation Less Likely)'
  summary: 'Microsoft''s August 2026 updates fixed CVE-2026-62878, a stack-based buffer overflow in Windows DNS Server (CVSS 9.8, AV:N/PR:N/UI:N, Critical; Exploited No, Exploitation Less Likely). Researchers published a PoC repository (README dated 2026-09-24) that reliably crashes a default-configuration Windows Server 2022 DNS Server: a null byte as the first byte of a label breaks the name tree''s hashing assumption, nodes pile into one bucket, and once the chain exceeds 64 children NTree_CreateHashAtNode copies it into a fixed 500-slot stack array without a bounds check until the stack cookie is hit. The trigger is a recursive query to a domain the attacker controls (or a cached NXDOMAIN, untested); the authors state remote code execution has not been achieved because the overflow writes node pointers, not controlled bytes. 0patch (2026-10-13) reproduced it and released micropatches for Windows Server 2008 R2, 2012 and 2012 R2 that mirror Microsoft''s fix, which limits query recursion nesting depth to 62. October''s Patch Tuesday adds further DNS Server flaws (CVE-2026-83869 and CVE-2026-96113, separate fixes); assessment: a public crash PoC against a pre-authentication service on DNS servers and domain controllers often precedes exploitation attempts, but no source reports exploitation.'
