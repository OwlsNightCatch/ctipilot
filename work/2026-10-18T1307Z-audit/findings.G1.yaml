  title: 'Keycloak 26.8.1 (2026-10-13), 26.8.0 (2026-10-01) and 26.7.5 (2026-09-30): about 20 CVEs per release in identity brokering, fine-grained admin permissions, 2FA enforcement and token exchange, including account linking, delegated-admin escalation and an mTLS binding bypass'
