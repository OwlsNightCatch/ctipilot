- id: nutanix-prism-cve-2026-84731-auth-bypass
  title: 'CVE-2026-84731, Nutanix AOS/Prism Element and Prism Central: an unauthenticated crafted HTTP header on port 9440 yields administrative API access, fixed in AOS and PC 7.6.0.8, 7.5.2 and 7.3.1.18 (CVSS 9.8)'
  sources:
  - url: https://download.nutanix.com/alerts/Security_Advisory_0058.pdf
    publisher: Nutanix (Security Advisory nutanix-sa-58)
    date: '2026-10-15'
    role: primary
  - url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3991
    publisher: BSI CERT-Bund (WID-SEC-2026-3991)
    date: '2026-10-16'
    role: corroborating
  discovery_trace: 'first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss ([NEU] [hoch] Nutanix AOS und Nutanix Prism Central, 2026-10-16) -> `bsi-csaf WID-SEC-2026-3991` -> primary: Nutanix advisory PDF URL https://download.nutanix.com/alerts/Security_Advisory_0058.pdf (read with `fetch_source.py pdf`)'
  summary: 'Nutanix published Security Advisory 58 on 2026-10-15 (severity Critical, CVSS 3.1 9.8, CVSS 4.0 9.3) for CVE-2026-84731, an authentication-handling flaw in Prism Element involving authentication bypass and privilege elevation. A remote actor with network connectivity to port 9440 can supply a specially crafted HTTP request header to the API and potentially obtain unauthorized administrative access to the Prism APIs; Nutanix''s impact line adds potential root-level remote code execution. Affected: all releases before the fixed builds for AOS/Prism Element and Prism Central: 7.6.0.8 and 7.3.1.18 (released 2026-10-06) and 7.5.2 (released 2026-10-13). The advisory''s workaround is to restrict Prism management access to trusted administrative networks, and it says not to rely on request-header filtering until Nutanix validates compatibility. The CVSS 4.0 vector carries exploit maturity ''P'' (proof of concept); the advisory states no exploitation. BSI rates its relay ''hoch'' and describes a remote anonymous attacker obtaining code execution with administrator rights. Nutanix is hyper-converged infrastructure that hosts whole VM estates, so the management plane is the crown jewel of any cluster.'
  region_nexus: global; Nutanix clusters host virtualised workloads in public-sector data centres
