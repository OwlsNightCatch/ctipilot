  summary: 'Juniper''s October 2026 security bulletins (published 2026-10-14) fix a long list of Junos OS and Junos OS Evolved flaws. NCSC-NL (2026-10-16) lists 15 CVEs, three at CVSS 9.8: CVE-2026-101956, an improper authentication flaw in the J-Web management interface that lets unauthenticated remote attackers run commands as root; CVE-2026-102182, a stack-based buffer overflow in the kmd component on MX Series that lets unauthenticated attackers execute code as root through crafted IKE certificate-based packets; and CVE-2026-101980, an integer underflow in the kernel''s Extended Echo handling that reboots the Routing Engine (DoS). Third-party trackers add CVE-2026-101954 (J-Web/NETCONF root configuration access) and CVE-2026-101986 (J-Web pre-authentication CGI execution), and name CVE-2026-33792 (unauthenticated srxpfe RCE via a configured GRE tunnel on SRX); the vendor pages were not readable, so those three are single-aggregator. Fixed releases per the Canadian Cyber Centre: Junos OS 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3 and 26.2R1-S2 (and -EVO counterparts for Junos OS Evolved). NCSC-NL notes many of the flaws are tied to specific features (J-Web, Extended Echo, CMP enrollment, RADIUS, dot1x). No source states exploitation; aggregators report no KEV listing. Management-plane reachability of J-Web and the IKE responder is the discriminator.'
