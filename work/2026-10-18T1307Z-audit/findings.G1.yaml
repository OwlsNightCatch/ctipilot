  title: 'CVE-2026-76268, Splunk Enterprise 10.2 and 10.4: an unauthenticated Patroni REST API on search head cluster members runs operating-system commands, fixed in 10.2.7 and 10.4.3 (CVSS 9.8), with a second 9.8 hardening CVE'
