  evidence:
  - quote: Today, Microsoft has published five separate remote code execution vulnerabilities in Outlook where the preview pane is a vector, meaning that simply scrolling past an email in the Outlook reading pane would be sufficient to trigger exploitation.
    attribution: Rapid7
    source_url: https://www.rapid7.com/blog/post/em-patch-tuesday-october-2026/
  - quote: Microsoft is aware of exploitation in the wild for just one of the vulnerabilities published today, as well as public disclosure for two others.
    attribution: Rapid7
    source_url: https://www.rapid7.com/blog/post/em-patch-tuesday-october-2026/
  - quote: At the time of writing, the SUG lists a total of zero vulnerabilities addressed in Edge in the first 13 days of October
    attribution: Rapid7
    source_url: https://www.rapid7.com/blog/post/em-patch-tuesday-october-2026/
  - quote: A total of 59 of the October CVEs fit my definition of wormable.
