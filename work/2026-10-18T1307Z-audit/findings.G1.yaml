  discovery_trace: 'first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/csaf/v2/changes.csv (NCSC-2026-0419..0426 Microsoft bundles) and msrc-update-guide, `msrc cvrf 2026-Oct` (45 MB CVRF, parsed offline: 1 exploited, 2 publicly disclosed, 57+ Microsoft-product rows at CVSS >= 9.0 with AV:N/PR:N) -> pivot: Rapid7 URL https://www.rapid7.com/blog/post/em-patch-tuesday-october-2026/ (Outlook cluster, Edge gap) -> pivot: ZDI URL https://www.thezdi.com/blog/2026/10/13/the-october-2026-security-update-review (59 wormable CVEs by component) -> corroboration: NCSC.ch CSH post 13056 URL https://security-hub.ncsc.admin.ch/#/posts/13056 -> primary: MSRC per-CVE records (CVRF Notes/FAQ)'
  summary: 'Microsoft''s 2026-10-13 release is the largest yet (Rapid7 counts 1,413 own-product CVEs; ZDI 1,415; counts differ by outlet). Only CVE-2026-96951 (Windows Shell MotW bypass) is exploited and only two are publicly disclosed (CVE-2026-108398 .NET Framework WDAC bypass, local, 8.8; CVE-2026-92707 MessagePack-CSharp DoS, 5.3); the exploited one is already carried by entry 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev. The rest of the release is dominated by network-reachable, pre-authentication flaws that Microsoft rates less likely to be exploited. ZDI counts 59 CVEs as wormable because the Microsoft record says an unauthenticated attacker can send a crafted packet to an affected service over the network and that no authentication or user interaction is required: DHCP Server (6), Network Policy Server (4), Windows Error Reporting (4), Remote Desktop Gateway (3), Text Shaping (3) and pairs in QUIC, Schannel and others (the CVRF adds DNS Server CVE-2026-83869/96113, Message Queuing CVE-2026-100202, IIS CVE-2026-70024, LSASS CVE-2026-96219, RRAS CVE-2026-85792/85809 and OpenSSH for Windows CVE-2026-97816, all CVSS 9.8, all rated Exploitation Less Likely or Unlikely by Microsoft). Separately Rapid7 and NCSC Switzerland single out five Outlook RCEs (CVE-2026-70242, 97749, 97016, 88156, 70291; CVSS 9.8, Critical) that fire when the Reading Pane renders a crafted email without the recipient opening it; Rapid7 recalls CVE-2023-23397 as the precedent for state-backed use of this class. Microsoft also lists Windows Active Directory Domain Services RCE CVE-2026-70229 (Critical, CVSS 8.1, AC:H, unauthenticated) as Exploitation More Likely, and ZDI and NCSC.ch name SharePoint CVE-2026-102866 (Critical 8.1, forged proof-token signature, unauthenticated) as the one unauthenticated SharePoint flaw. Rapid7 adds that the Security Update Guide lists no Edge vulnerabilities for the first 13 days of October, so defenders cannot map recent Chromium fixes to Edge builds. ZDI''s own conclusion is to prioritise by proven exploitability, not CVE count.'
  region_nexus: global; Windows servers, Active Directory and Outlook are the core estate of Swiss federal, cantonal and communal administrations
