  summary: 'Splunk''s 2026-10-07 advisories fix 17 CVEs in SVD-2026-1001, among them CVE-2026-76268 (CWE-306, CVSS 9.8): an unauthenticated user with network access to the Patroni REST API on a search head cluster member can execute attacker-controlled operating-system commands, because the interface requires no authentication for critical configuration operations. Only Splunk Enterprise below 10.4.3 and below 10.2.7 is affected (10.4.0-10.4.2 and 10.2.0-10.2.6); 10.0.x and 9.4.x are not. The vendor mitigation is to disable the PostgreSQL sidecar (disabled = true in the [postgres] stanza of server.conf, then restart) if Edge Processor, OpAmp and SPL2 data pipelines are not used. The companion hardening advisory SVD-2026-1002 groups internally found issues by CWE into five CVEs and lists CVE-2026-76281 (improper access control, 9.8) and CVE-2026-76284 (improper neutralisation, 9.0) across all four supported lines, fixed in 10.4.3, 10.2.7, 10.0.10 and 9.4.15. CVE-2026-76266 (7.7) is a local root escalation during Linux package upgrades. Neither advisory states exploitation, and Splunk Enterprise search heads are typically internal, so reachability of the Patroni port from outside the cluster decides exposure.'
