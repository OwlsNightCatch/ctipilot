- id: ms-oct-2026-patch-tuesday-wormable-and-outlook-reading-pane
  title: 'Microsoft October 2026 Patch Tuesday: 59 CVEs ZDI classes as wormable (one crafted packet to an unauthenticated Windows network service, CVSS 9.8) and five zero-click Outlook Reading Pane RCEs, none exploited; Edge fixes not yet listed'
