  - claim_id: ba0322a833
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "SAP's August 2026 Security Patch Day of 2026-08-11 released 28 new security notes plus one GitHub security advisory, with two updates to previously released notes ("
    urls: ["https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html"]
  - claim_id: d58b71f372
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "); Onapsis, counting the cycle its own way, puts it at thirty-three notes including five HotNews and nine High Priority ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: a8ed7d1a77
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "Onapsis, which worked with SAP on eleven of the notes in this cycle, describes the cause as insufficient authorization checks combined with insufficient input validation, and the outcome as arbitrary code execution with compromise of internal components ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: 4f5d6f59ad
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "Onapsis states customers must patch to the fixed Commerce Cloud release levels referenced in the note and then rebuild and redeploy the updated version, and that the interim exposure reduction available today is an IP filter set restricting access to the vulnerable endpoint ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: 19257f5ad7
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "The same rebuild-and-redeploy requirement applies to CVE-2026-42945 (CVSS 8.1), a buffer overflow affecting Commerce Cloud public-cloud deployments fronted by NGINX, per SAP Security Note 3773203 ("
    urls: ["https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html"]
  - claim_id: c76fd66424
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "The two remedies are not the same: for Note 3758900 (CVE-2026-44758) the patch removes the vulnerable servlet component outright, while for Note 3765948 (CVE-2026-44772) the servlet stays in place and customers must additionally configure and maintain a new \"Secure Transformer\" system property naming the hosts allowed to serve XSL files to it ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: 11f533031e
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "CVE-2026-34265 (CVSS 9.8, Note 3714806) is the one to weigh against internal network exposure rather than internet exposure: \"Logical errors in DIAG protocol parsing allow an unauthenticated attacker to generate memory corruptions\" in the Application Server ABAP kernel, with potential disclosure of sensitive system information or a crash of the instance ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: fbcf9250e3
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: cited
    text: "DIAG is the SAP GUI presentation protocol, so the affected listener is one that ordinarily faces user workstations, and the affected kernel list spans KRNL64NUC/KRNL64UC and KERNEL builds from 7.22 through 9.19 ("
    urls: ["https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html"]
  - claim_id: 0713b62097
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "The one that changes an exposure picture rather than a patch schedule is CVE-2026-58231, carried by SAP Security Note 3771065 at CVSS 10.0: an improper-authorization flaw in the Data Hub Adapter of SAP Commerce Cloud."
  - claim_id: d571a028a4
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "The reason this ranks above a routine critical: Commerce Cloud is the platform behind public storefronts, so the vulnerable component sits on the internet side of the estate by design, and the score's pre-auth, no-interaction profile means reaching it takes a crafted request rather than a foothold."
  - claim_id: 719c0cfef4
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Remediation for this one is not a patch install."
  - claim_id: 50d3a8e16c
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Any organisation whose change process treats \"SAP note applied\" as equivalent to \"fixed\" will record this as remediated while the storefront is still reachable."
  - claim_id: b630166e5f
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Three further notes Onapsis classes as HotNews matter to different estates."
  - claim_id: 09b3fb62fc
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-44772 (CVSS 9.9, Note 3765948) and CVE-2026-44758 (CVSS 9.1, Note 3758900) are code-injection flaws in SAP Manufacturing Integration and Intelligence reaching arbitrary command execution on the underlying host; Onapsis states the lower score on the second reflects a higher privilege requirement."
  - claim_id: 7626813ee9
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Rounding out the High Priority set, CVE-2026-58243 (CVSS 8.8, Note 3772411) covers the SQL Console in SAP ABAP Developer Tools, where support for host expressions inside SQL statements let a low-privileged authenticated user run database operations they should not reach."
  - claim_id: 4a9afb1e76
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "No party reports exploitation of any of these."
  - claim_id: b20676b4e4
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "That is the reason none of them carries a `critical` priority here — but the Data Hub Adapter flaw still demands action ahead of the normal SAP patch cadence, because its own mechanics set the clock: an unauthenticated, no-interaction path to code execution on a component that is internet-facing by product design, disclosed with a CVSS 10.0 and a documented interim network control, is the shape that gets scanned for within days of a patch day."
  - claim_id: 1971652266
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Detection concepts are ordinary but specific: in web and reverse-proxy access logs, surface requests to the Data Hub import path from source addresses outside the integration ranges that legitimately feed it, and treat any such request that precedes an unexplained child process under the Commerce Cloud application account as an incident rather than an anomaly."
  - claim_id: b91e37e74a
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "Discriminating benign from malicious here is easier than usual — legitimate Data Hub imports arrive from a small, enumerable set of integration sources, so the source address and the calling identity, not the request body, are the useful filter."
  - claim_id: 5c7ffd1608
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "body"
    kind: uncited
    text: "On the ABAP side, a DIAG-parsing memory-corruption attempt surfaces as work-process crashes or short dumps clustered on one instance rather than as an authentication event."
  - claim_id: 3a00111a04
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "Threat-intelligence firm Defused reported on 2026-08-14 that the first exploitation attempts against CVE-2026-58231 were arriving at its honeypot sensors three days after SAP's 2026-08-11 patch day, and stated in the same report that the vulnerability has no public proof-of-concept ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 8418f7f2fb
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "On 2026-08-15 the Dutch national cyber security centre published advisory NCSC-2026-0302, which records that attackers are actively scanning for and seeking out vulnerable Data Hub Adapter systems ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0302.html"]
  - claim_id: 448bb0bd10
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "The mechanism is unchanged from the original entry and is worth restating precisely because it shapes what an exposed request looks like: SAP describes the flaw as allowing an unauthenticated attacker to abuse a default authentication client and submit specially crafted input to functions that lack sufficient validation, reaching arbitrary code execution ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 5065edf494
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "The exposure is real rather than theoretical: Shadowserver tracks over 4,200 IP addresses carrying a SAP Commerce Cloud fingerprint, most of them in Europe and North America, though the same reporting is explicit that it cannot say how many of those are honeypots or already remediated ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 12a8d78d2f
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "What is confirmed is exploitation attempts against sensors ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 6a7c0e8f73
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: ") and scanning for vulnerable systems ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0302.html"]
  - claim_id: 7d5c8bd5b6
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: ") — no party reports a compromised production instance, and SAP has not flagged the flaw as exploited in its own advisory ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"]
  - claim_id: 725509902a
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: cited
    text: "Hardening remains the vendor's own path: Onapsis, which works with SAP on its patch cycle, records that customers must patch to the fixed Commerce Cloud release levels referenced in the note and then re-build and re-deploy the updated version, and that configuring an IP Filter Set in Commerce Cloud to restrict access to the vulnerable endpoint is the temporary workaround that reduces exposure meanwhile ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: 5e91642c99
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "The Commerce Cloud flaw previously recorded here as carrying no exploitation from any party is being attacked."
  - claim_id: dcd742af73
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "Those two facts together are the operationally interesting part: whoever is sending these requests built a working exploit without published research to copy, on a three-day clock, against a component whose remediation is slower than a patch install."
  - claim_id: 96cabb88f4
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "Calibrate the status honestly."
  - claim_id: 389612a2e7
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "That distinction matters for triage effort, not for patch priority: the interval between a public fix and a working exploit has collapsed to days on this component, and the remediation is a rebuild-and-redeploy cycle measured in change windows."
  - claim_id: e4f91f93ef
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "Detection, in vendor-neutral terms: in web-access and application logs for the Data Hub Adapter, look for unauthenticated requests to the adapter's import functions that present the default authentication client rather than a customer-provisioned one, and for import-job invocations that do not line up with a scheduled integration run — an import that no ETL schedule accounts for is the anomaly, since this component's legitimate traffic is machine-generated and predictable."
  - claim_id: e0525d563e
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-16T04:35:00Z"
    kind: uncited
    text: "Pair that with egress review from the Commerce Cloud application tier, because arbitrary code execution here runs inside a host that normally talks only to its own data-integration peers."
  - claim_id: 23f76ae26f
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: cited
    text: "For Note 3758900 the patch does remove the vulnerable servlet component outright ("
