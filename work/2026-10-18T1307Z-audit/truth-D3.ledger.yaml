    kind: uncited
    text: "The flaw is that Splunk's main web tier proxies those same endpoints outbound, at paths under `/en-US/splunkd/__raw/v1/postgres/`, so an external client can reach the no-auth database API by sending empty Basic credentials."
  - claim_id: be438464e8
    entry: 2026-06-14/splunk-enterprise-cve-2026-20253-pre-auth-rce-in-the-siem-vi
    surface: "body"
    kind: uncited
    text: "**Why the \"loopback is safe\" assumption fails.** The root cause is a trust boundary that exists in the developers' mental model but not in the deployed architecture: the database API trusts the network (loopback-only) instead of the caller, and a second component (the web proxy) silently bridges that network gap."
