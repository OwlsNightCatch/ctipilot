    surface: "body"
    kind: uncited
    text: "Because Splunk frequently runs with high privilege and aggregates logs from across the estate, a compromised indexer or search head is both an execution foothold and a route to the organisation's centralised security telemetry — an attacker who owns the SIEM can read what defenders see and potentially tamper with it."
  - claim_id: db40d9fbc3
    entry: 2026-06-14/splunk-enterprise-cve-2026-20253-pre-auth-rce-in-the-siem-vi
