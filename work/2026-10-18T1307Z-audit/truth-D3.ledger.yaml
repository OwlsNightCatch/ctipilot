    surface: "body"
    kind: uncited
    text: "The authentication override feature, introduced to support certain SSO and clientless configurations, allows a GlobalProtect portal or gateway to issue signed cookies that bypass the normal MFA/SAML authentication flow on subsequent connections — trading off per-session authentication strength for session-persistence smoothness."
