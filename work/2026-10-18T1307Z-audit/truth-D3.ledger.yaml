  - claim_id: d1ff83d8de
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "summary"
    kind: frontmatter
    text: "NGINX \"NGINX Rift\" CVE-2026-42945 (CVSS 9.2/4.0): 18-year-old heap overflow in ngx_http_rewrite_module now has a public PoC; NCSC-CH advisory published this morning; affects NGINX 0.6.27–1.30.0, Plus R32–R36, Kubernetes Ingress Controller, and multiple F5 products (NCSC-CH Security Hub #12575, 2026-05-15)."
  - claim_id: 1a38552d76
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "actions[0]"
    kind: frontmatter
    text: "**Audit NGINX configurations for the CVE-2026-42945 vulnerable pattern and either apply the workaround or upgrade.** Grep all `nginx.conf` and included config files for `rewrite` directives combining an unnamed PCRE capture (`$1`, `$2`) with a replacement containing `?` followed by another `rewrite`, `if`, or `set` in the same scope. Replace unnamed captures with named captures (`(?P<name>...)` → `$name`) as an immediate workaround. Upgrade to NGINX Open Source 1.30.1 / 1.31.0 or NGINX Plus R32 P6 / R36 P4 to remediate. Check Kubernetes clusters for NGINX Ingress Controller version and apply the corresponding fixed chart. Prioritise internet-facing reverse proxies and API gateways."
  - claim_id: 9e91d9ddb3
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "cves[CVE-2026-42945]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-42945\", \"cvss\": \"9.2\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": null, \"fixed\": null, \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: f633416435
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: cited
    text: "CVE-2026-42945 (CVSS 4.0: 9.2 / CVSS 3.1: 8.1, CWE-122, codename \"NGINX Rift\") is a heap buffer overflow present in `src/http/ngx_http_script.c` since NGINX 0.6.27 (2008) ("
    urls: ["https://depthfirst.com/research/nginx-rift-achieving-nginx-rce-via-an-18-year-old-vulnerability"]
  - claim_id: f95bc0a599
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "The root cause: when a `rewrite` directive combines an unnamed PCRE capture (`$1`, `$2`) with a replacement string containing `?`, followed by another `rewrite`, `if`, or `set` directive in the same scope, `ngx_http_script_start_args_code()` sets a flag causing the write phase to URI-encode URI argument characters — expanding `+`, `%`, and `&` by two bytes each — while the length-calculation phase computed a shorter buffer without this escaping."
  - claim_id: 8c5b27f5a2
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "The result is a deterministic out-of-bounds write into the adjacent heap allocation."
  - claim_id: e044f28915
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "Reliable impact is crash of the NGINX worker process (DoS with automatic master restart); RCE requires ASLR to be disabled on the host."
  - claim_id: 9848da9713
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "A working PoC is public at `github.com/depthfirstdisclosures/nginx-rift`."
  - claim_id: 4c505dde00
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "The vulnerability was discovered by the AI-driven security analysis system \"depthfirst\", responsibly disclosed to F5/NGINX on 2026-04-18, with RCE PoC shared to F5/NGINX under NDA on 2026-04-28, and patches released on 2026-05-13."
  - claim_id: 9df1bf0519
    entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
    surface: "body"
    kind: uncited
    text: "Exploitation status: no in-the-wild confirmed; NCSC-CH rates \"UNKNOWN, PoC Available.\" Temporary workaround: replace all unnamed captures with named captures (e.g., `(?P<foo>...)` → `$foo`) in `rewrite` directives — this eliminates the vulnerable code path without requiring upgrade."
  - claim_id: c499918ce1
