    kind: record-summary
    text: "CVE-2026-58231, the CVSS 10.0 unauthenticated code-execution flaw in the SAP Commerce Cloud Data Hub Adapter covered here on 2026-08-12 as unexploited, is now being attacked: Defused recorded the first exploitation attempts hitting its honeypot sensors on 2026-08-14, three days after SAP's patch day, and states no public proof-of-concept exists. NCSC-NL published advisory NCSC-2026-0302 on 2026-08-15 recording that attackers are actively scanning for vulnerable Data Hub Adapter systems. Shadowserver tracks over 4,200 internet-exposed instances, most in Europe and North America, and the Commerce Cloud fix only takes effect after a rebuild and redeploy — so an instance that merely took the note is still exposed."
