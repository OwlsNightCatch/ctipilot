    text: "**Hunt and detection concepts.** Splunk logs its own HTTP access, so the highest-value hunt is in `_internal` / the `splunkd_access` data: look for requests to `/en-US/splunkd/__raw/v1/postgres/` paths, especially `recovery/backup` and `recovery/restore`, and for requests carrying empty or anonymous Basic-auth credentials from non-loopback source addresses."
