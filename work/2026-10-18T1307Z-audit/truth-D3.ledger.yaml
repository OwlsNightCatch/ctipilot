  - claim_id: f1ff32044a
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: derived
    text: "Do not retire the detection package in the 2026-08-24 update on the strength of the patch: the researcher who wrote the original working exploit says the fix leaves a reachable path, the claim is unrefuted as well as unconfirmed, and the hunting signals above key on the abuse of Defender's own remediation path rather than on any particular build."
  - claim_id: 760a5586f1
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: derived
    text: "Arbitrary file read as SYSTEM is materially less severe than the original's full SYSTEM execution, so the residual risk after patching is lower than the pre-patch position, not equal to it."
  - claim_id: 8cad790c22
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-08-18T04:45:00Z"
    kind: record-summary
    text: "The ShieldBreak proof-of-concept covered here on 2026-08-12, which claims a fully reliable bypass of Microsoft's July fix for the RoguePlanet Defender privilege-escalation flaw and had drawn no vendor comment at the time, is now tracked as CVE-2026-69414. Microsoft's advisory names ShieldBreak explicitly, rates the flaw Important at CVSS 3.1 base 7.8, records it as publicly disclosed but not exploited, sets its exploitability assessment to \"Exploitation More Likely\", and states that a security update is still being worked on. Switzerland's NCSC and France's CERT-FR both relayed the identifier to their constituencies on 2026-08-17, which is what puts a tracking number on an unpatched weakness in a baseline endpoint control across this constituency's estate."
  - claim_id: ce224330a6
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-08-21T06:20:00Z"
    kind: record-summary
    text: "LevelBlue SpiderLabs reproduced the complete ShieldBreak chain on Windows 11 24H2 and Windows Server 2025 with the August 2026 Patch Tuesday updates already installed, reaching SYSTEM from a standard user account against Windows Defender in its default configuration in roughly eight to twelve seconds. The published mechanism is the delta: a fake Cloud Files sync provider serves benign bait on first read and the malicious DLL on a later read, a shadow NT Object Manager namespace supplies two conflicting symbolic links, and Defender's own management library is called directly so that its remediation engine — not the attacker — writes the payload into System32, where a Windows Error Reporting scheduled task loads it as SYSTEM. Microsoft's record still says no fix is available; its only revision on the day of the report was an informational CWE addition."
  - claim_id: b9ac867a81
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-08-24T09:11:00Z"
    kind: record-summary
    text: "LevelBlue SpiderLabs published the working mechanism of the unpatched Windows Defender privilege-escalation chain this pipeline has tracked as ShieldBreak: a fake Cloud Files sync root, two conflicting object-manager symbolic links both named WD_SCAN, an exclusive lock on the CLFS transaction log that freezes Defender's clean operation mid-flight, and a symlink swap that redirects the in-flight write so Defender's own remediation engine places an attacker-supplied phoneinfo.dll into System32 — after which a crafted Windows Error Report triggers the built-in QueueReporting task and wermgr.exe loads that DLL as SYSTEM. Roughly eight to twelve seconds, standard user to SYSTEM, on fully patched Windows 11 24H2 and Windows Server 2025 with Defender in its default configuration. There is still no vendor fix, so detection is the whole available control — and the mechanism supplies it, led by the presence of C:\\Windows\\System32\\phoneinfo.dll, which LevelBlue states is not expected to exist natively on supported Windows versions."
  - claim_id: e045b78d35
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "record 2026-09-13T15:10:00Z"
    kind: record-summary
    text: "Microsoft has shipped a fix. Its own record for CVE-2026-69414 names Malware Protection Engine 1.1.26080.3 as the first version with the vulnerability addressed and 1.26070.7 as the last affected, so this entry's standing \"no fix available\" statement is superseded and the frontmatter, headline, summary and action item move with it. Separately, on 2026-09-08 the same researcher published ShieldCrash, claiming the fix is incomplete under specific conditions; that claim is the researcher's own, relayed by SOCRadar, carries no new CVE, and Microsoft has not confirmed it. Surfaced by this audit's coverage re-sweep."
