    text: "Treat the reliability figure and the server coverage as unverified until someone reproduces them — but treat the existence of working exploit code as established, because that is what the release consists of."
  - claim_id: a6ec5c57e5
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "The target is the Microsoft Malware Protection Engine, the scanner behind Defender, which runs as SYSTEM; RoguePlanet abused improper link resolution before file access to spawn a SYSTEM shell on fully updated machines, was rated Important at CVSS 7.8, and was fixed in engine build 1.1.26060.3008 on 2026-07-09."
  - claim_id: 6b464b6156
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "This is also the second time a fix in this class has fallen: Microsoft hardened Defender's internal file-handling APIs in mid-May and RoguePlanet was rewritten to defeat that."
  - claim_id: 22a551a6ae
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "**This paragraph describes the position at disclosure, when no fix existed; Microsoft has since shipped one — see the 2026-09-13 update below, and patch first.** At the time, compensating controls rather than patching were the available lever."
  - claim_id: f62fb5cb1e
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "Detection concepts follow the RoguePlanet chain rather than ShieldBreak's unpublished internals, so they are hypotheses to hunt with rather than confirmed signatures for this variant: in filesystem and process telemetry, reparse-point or junction creation by a standard-user process inside a path the Defender engine subsequently touches, and unexpected execution lineage from the Windows Error Reporting scheduled task, are the observable steps that chain described."
  - claim_id: 535a177cca
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "body"
    kind: uncited
    text: "Because the escalation ends in a SYSTEM process spawned by an engine that legitimately runs as SYSTEM all day, the parent-process shape alone will not separate this from routine scanning activity — the preceding filesystem manipulation by an unprivileged account is where the discriminator lives."
  - claim_id: ace90257d7
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "Microsoft published an advisory on 2026-08-14 that names the technique directly — the vulnerability is described as an elevation of privilege in the Microsoft Malware Protection Engine in Microsoft Defender publicly referred to as \"ShieldBreak\" — and assigned it CVE-2026-69414 ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414"]
  - claim_id: 5fb493a65d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "Microsoft rates the flaw Important with a CVSS 3.1 base score of 7.8 for a local, low-privilege, no-interaction elevation, records it as publicly disclosed, records exploitation as not detected, and sets its exploitability assessment to \"Exploitation More Likely\" ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414"]
  - claim_id: 10f447f128
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "Switzerland's NCSC amended its rolling Nightmare Eclipse advisory on 2026-08-17 to record that \"ShieldBreak is tracked as CVE-2026-69414 by Microsoft\" ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/12622"]
  - claim_id: 81218a53c9
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: cited
    text: "), and CERT-FR issued advisory CERTFR-2026-AVI-1035 the same day, listing the Microsoft Malware Protection Engine among affected systems alongside an unrelated, already-patched PowerShell flaw ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1035/"]
  - claim_id: b197117168
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "The original entry recorded that no patch existed, no vendor had publicly reproduced the ShieldBreak proof-of-concept, and Microsoft had not commented."
  - claim_id: 39a22ec5a8
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "Two of those three have changed."
  - claim_id: 20ef43d819
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "The third has not: on the fix, Microsoft states only that \"We are working to provide a high quality security update that addresses this vulnerability.\""
  - claim_id: bf491bff18
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "The vendor's own calibration is the useful part of the delta."
  - claim_id: e7a7b26a44
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "That combination — publicly available exploit code, a vendor expectation of exploitation, and no update — is the shape that justifies attention outside the normal patch cycle, and it is a materially different footing from a researcher's unverified GitHub claim."
  - claim_id: e18fc15525
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "The relay is what brought it into this constituency's field of view."
  - claim_id: 0b04360813
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "CERT-FR's bulletin carries its standard instruction to consult the vendor advisory for fixes; for this CVE that advisory has none to offer, which is worth knowing before an operator treats the bulletin as a patchable item."
  - claim_id: 014aff5b97
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "**Detection, telemetry class first.** No new behavioural detail was published with the CVE, so nothing here supersedes what the original entry carried."
  - claim_id: 6fd2529117
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "The durable anchor remains process-creation telemetry with parent lineage: the Malware Protection Engine has no legitimate reason to be the parent of an interactive shell or an unexpected child process, so any such process tree rooted at the engine is the signal irrespective of which variant produced it."
  - claim_id: 5b85d069da
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: uncited
    text: "**Triage:** the engine's own remediation work — quarantine, deletion, signature updates — runs inside the service rather than by launching command interpreters, so a shell parented to it does not have a benign counterpart; the discriminator is the parent-child relationship itself, not the child's command line."
  - claim_id: dbbb4bc1c5
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: derived
    text: "**Defender takeaway:** the actionable change is administrative rather than technical."
  - claim_id: 03276061cf
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: derived
    text: "An estate now has an identifier to track this against, which means it can be carried in a vulnerability register, matched by a scanner once detection logic exists, and closed out when the update ships — none of which was possible against an unnumbered proof-of-concept."
  - claim_id: 570da21dae
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: derived
    text: "Nothing to patch yet, and no reason to raise urgency beyond that: exploitation is not observed, the prerequisite is code already running as a local user, and the compensating control named in the earlier coverage is unchanged."
  - claim_id: 9c2b8b6df3
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-18T04:45:00Z"
    kind: derived
    text: "Watch the CVE record for the update Microsoft says is coming."
  - claim_id: 958373cec7
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: cited
    text: "\"The LevelBlue OpsCTI and THOR teams reviewed and reproduced the complete ShieldBreak exploitation chain with the August 2026 Patch Tuesday updates installed, confirming the PoC functions as described\" ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/cloud-sync-root-registrationshieldbreak-hunting-windows-defender-remediation-abuse-and-cloud-files-hijacking"]
  - claim_id: 293bae84a0
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: cited
    text: "Queried directly, Microsoft's own record for the CVE shows its most recent revision dated the same day as that report, and the change it describes is the addition of a CWE classification, informational only ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414"]
  - claim_id: 94b7e8cbb6
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "This pipeline recorded CVE-2026-69414 three days ago as acknowledged by Microsoft, rated 7.8, publicly disclosed, assessed \"Exploitation More Likely\", with a security update still being worked on."
  - claim_id: 55b16bd85b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "Two things have changed and neither is a fix."
  - claim_id: f03cdf2c8c
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "LevelBlue reports the chain running to SYSTEM from a standard user account on Windows 11 24H2 and Windows Server 2025 with Defender in its default configuration, self-contained and needing no arguments, completing in roughly eight to twelve seconds on an idle system."
  - claim_id: aec895dae2
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "**The mechanism, which is the substance of the delta.** The prior entry had the identifier and Microsoft's rating but not how the chain works."
  - claim_id: 7834112b13
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "LevelBlue reconstructs it in seven stages, and the elegant part is that the attacker never writes to System32 — Defender does."
  - claim_id: de9967dc9f
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "The exploit first raises its own process and thread priority to improve its odds in a later race, then registers a **fake Cloud Files sync provider** rooted at a working directory it creates, and creates a placeholder file so Windows treats it as a cloud-resident object not yet downloaded."
  - claim_id: 8c7826f42c
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "Its hydration callback is two-faced by design: the **first** read returns a benign archive, which is what Defender detects; a **later** read returns the malicious DLL, which is what ends up on disk."
  - claim_id: 8946fe909c
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "Next it resolves native object-manager routines out of `ntdll.dll` and builds a shadow namespace containing two conflicting symbolic links under the same name — one pointing at the working directory, one at a transaction-log path — giving it a redirection layer that sits above the filesystem."
  - claim_id: 0cdac20c84
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "It then loads Defender's own management library directly and resolves that library's scan and clean functions to open Defender's RPC interface, scan the placeholder through the shadow path, and — once Defender has flagged the bait archive — start Defender's **own remediation operation** against it."
  - claim_id: a96e38ee79
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "A time-of-check-to-time-of-use race, held open with an exclusive lock on a transaction-log file while the symbolic link is swapped underneath, redirects that remediation so Defender's clean engine writes the attacker's DLL into System32."
  - claim_id: 8a58200500
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "Execution as SYSTEM then comes from a Windows Error Reporting scheduled task loading that DLL through the error-reporting host process."
  - claim_id: f1b68d2cb6
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: uncited
    text: "LevelBlue also places the disclosing persona in a lineage of prior proof-of-concept releases and notes a functional improvement over the immediately preceding one: where the earlier LegacyHive technique needed a helper-account logon to trigger its final stage, ShieldBreak is fully self-contained."
  - claim_id: a69ce384aa
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "**Triage:** LevelBlue's own framing is the right instruction — \"ShieldBreak is best detected through behavioral correlation rather than any single static indicator\", because every component is a legitimate Windows capability."
  - claim_id: 28d1824a31
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "The highest-value single signal is a module load: Defender's management library being loaded by a process outside the small, stable set of Defender's own binaries, especially when that same process then resolves Defender's scan and clean entry points at runtime."
  - claim_id: efba52ea31
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "Around it, two more composites: an unapproved process registering a cloud sync root and creating a placeholder, then immediately moving into object-manager and Defender API activity; and a standard-user process taking an exclusive lock on a transaction-log file."
  - claim_id: d6737ea226
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "Each is weak alone — legitimate sync agents register sync roots, and Defender's own processes load its library all day — so the sequence and the identity of the calling process are what separate them."
  - claim_id: abd70e8639
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "The final stage is the most conventional: a DLL appearing in System32 followed by the error-reporting scheduled task being run on demand, with the payload cleaned up afterwards."
  - claim_id: 205a57fa56
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "**Defender takeaway:** there is still nothing to patch, so the change for a defender is that detection content is now writable against a documented chain — and that content should key on the Defender-library load by an unexpected process, not on the exploit's filenames, which are proof-of-concept artefacts."
  - claim_id: 2305fd445b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "The wider pattern is worth naming: this abuses Defender's *remediation* machinery rather than a memory-safety bug, making the product's own privileged clean-up path the write primitive."
  - claim_id: 24e53765c6
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-21T06:20:00Z"
    kind: derived
    text: "That argues for treating the endpoint-protection stack's own privileged components as an attack surface to monitor in their own right, rather than purely as a control to rely on."
  - claim_id: 00223244a5
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: cited
    text: "LevelBlue SpiderLabs has now published the mechanism and, with it, a hunting package ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/cloud-sync-root-registrationshieldbreak-hunting-windows-defender-remediation-abuse-and-cloud-files-hijacking"]
  - claim_id: 03fde561ec
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "The entry this one updates recorded that Microsoft had acknowledged ShieldBreak as CVE-2026-69414, rated it 7.8, assessed it \"Exploitation More Likely\", and stated a security update was still being worked on — with no published mechanism and therefore nothing to detect on."
  - claim_id: beab185930
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "That is the whole delta, and at the time it mattered because no fix existed: detection was then the only control a defender had."
  - claim_id: 323808d170
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "(Microsoft has since shipped an engine fix — see the 2026-09-13 update below.)"
  - claim_id: 78b0a128fa
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "The chain turns Windows Defender's own remediation path into the write primitive."
  - claim_id: cbdc077092
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "The proof-of-concept registers its working directory as a **Cloud Files sync root**, self-identifying as a sync provider with a hardcoded provider GUID and creating a placeholder file."
  - claim_id: 99f31cad5a
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "It then creates two directories beneath the object manager's `\\BaseNamedObjects\\Restricted\\` namespace and, inside them, **two conflicting symbolic links both named `WD_SCAN`** — one initially resolving to the working directory holding the placeholder, the other to a path used by the Common Log File System."
  - claim_id: 4c9b0e883e
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "It opens Defender's interface directly, resolving the management, scanning and clean functions out of `MpClient.dll` at runtime, and asks Defender to scan the placeholder through a `\\\\.\\globalroot\\...\\WD_SCAN\\` path."
  - claim_id: 6a84b1c385
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "A background thread watches for the CLFS transaction log that Defender's clean operation creates, and the instant it appears takes an **exclusive lock** on it — freezing Defender mid-transaction."
  - claim_id: 53796c86d7
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "With the operation held open, the proof-of-concept deletes the shadow `WD_SCAN` link and recreates it pointing at `\\??\\UNC\\127.0.0.1\\C$\\Windows\\System32\\phoneinfo.dll`, so the already-in-flight path resolves somewhere new without any NTFS junction being involved; it then restarts Cloud Files hydration with the file size set to the DLL's rather than the original's, so the hydration callback supplies the attacker's bytes while Defender's clean engine performs the write."
  - claim_id: cf5290ee7b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "Because `MsMpEng.exe` is the process that writes the file, the write itself looks expected — which LevelBlue flags as a triage detail that must be correlated rather than dismissed."
  - claim_id: 23186dcdfc
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "The proof-of-concept then maps the resulting DLL as an executable image to stop remediation removing it, crafts a Windows Error Report into the report queue, and triggers the **built-in `QueueReporting` scheduled task through the Task Scheduler COM interface method `ITaskService::Run()`**; that task runs as SYSTEM, so the signed Windows error-reporting binary `wermgr.exe` processes the report and loads `phoneinfo.dll` with SYSTEM privileges — a trusted system binary acting as the proxy that executes the attacker's code, which is how the payload runs without the attacker ever launching a process of their own."
  - claim_id: 54d471a493
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "LevelBlue states the whole sequence takes approximately eight to twelve seconds on an unloaded system, and that it \"is fully self-contained and runs to full SYSTEM completion from a standard user account on any fully patched Windows 11 24H2 or Windows Server 2025 system with Windows Defender in its default configuration.\""
  - claim_id: ab05789324
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "Detection, in the report's own framing, \"is best detected through behavioral correlation rather than any single static indicator\" — but one static indicator is close to free."
  - claim_id: 5478bbec3a
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "LevelBlue identifies **`C:\\Windows\\System32\\phoneinfo.dll`** as the strongest single indicator in the chain and states the file **is not expected to exist natively on supported Windows versions** — so its creation warrants a high-priority look regardless of the process that wrote it."
  - claim_id: ead29fa472
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "(The hedge is the source's own and is worth keeping: \"not expected on supported versions\" is what it will bear, not a guarantee about every Windows build ever shipped.) Beyond that, and led by telemetry class: in image- and module-load telemetry, `MpClient.dll` loaded by a process that is not one of Defender's own small set of expected consumers — the report names `MsMpEng.exe`, `MpCmdRun.exe`, `NisSrv.exe`, `ConfigSecurityPolicy.exe` and `MpSigStub.exe` — is the compound signal, and LevelBlue is specific about what makes it load-bearing: \"The set of expected MpClient.dll consumers is small."
  - claim_id: af391b74f2
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "A load by an unrelated process becomes especially significant when followed by runtime resolution of MpManagerOpen, MpScanStart, MpCleanOpen, MpCleanStart, or MpCleanControl.\" The same telemetry should surface `wermgr.exe` loading `phoneinfo.dll`."
  - claim_id: 8f959cc2d9
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "In scheduled-task audit records, the `QueueReporting` task being started programmatically through the Task Scheduler COM interface is the execution step."
  - claim_id: 19c14267c8
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "In registry or filter telemetry, a sync-root registration call issued by a process that is not a cloud-sync client is the setup step."
  - claim_id: faa46f47f3
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: uncited
    text: "And in named-pipe telemetry this specific proof-of-concept creates a pipe with a hardcoded name, with a SYSTEM-integrity process then connecting to a pipe a normal user created — though that name is an artefact of this build rather than of the technique."
  - claim_id: 9a0cf5b76d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "**Triage:** every individual event here has a benign twin, which is why the sequence is the detection."
  - claim_id: 3399f071a9
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "`MsMpEng.exe` writing into System32 is normal remediation behaviour; a cloud-sync provider registering a sync root is normal on a machine running OneDrive or a similar client; `wermgr.exe` running as SYSTEM off a scheduled task is normal error reporting."
  - claim_id: 2e24bc89c9
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "The discriminators are the process identities and the ordering: a sync-root registration from something that is not a sync client, `MpClient.dll` resolved by a non-Defender process followed by that specific clean-function set, and a `QueueReporting` run driven through COM rather than by the ordinary error-reporting trigger — with the whole chain completing inside roughly ten seconds."
  - claim_id: 4cff93817c
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-08-24T09:11:00Z"
    kind: derived
    text: "Hardening was the awkward part while the flaw was unpatched: because the abused component is Defender itself in its default configuration, there was no configuration change to apply, and the vulnerable-driver blocklist and application-control policies have nothing third-party to key on."
  - claim_id: 58681440a9
