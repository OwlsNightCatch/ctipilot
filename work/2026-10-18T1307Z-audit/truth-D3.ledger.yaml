    entry: 2026-05-18/cve-2026-42945-nginx-rift-in-the-wild-exploitation-confirmed
    surface: "body"
    kind: uncited
    text: "Patches: NGINX Open Source 1.30.1 / 1.31.0; NGINX Plus R32 P6, R36 P4."
  - claim_id: 495e96ffac
    entry: 2026-05-18/cve-2026-42945-nginx-rift-in-the-wild-exploitation-confirmed
    surface: "body"
    kind: uncited
    text: "Interim mitigation if immediate upgrade is not possible: convert unnamed PCRE captures in all rewrite directives to named captures (`(?P<name>...)` syntax)."
  - claim_id: 167f3f4858
    entry: 2026-05-18/cve-2026-42945-nginx-rift-in-the-wild-exploitation-confirmed
    surface: "body"
    kind: uncited
    text: "Detection-engineering anchors that follow from the flaw class (heap-overflow worker crash under specific rewrite-rule configurations) are NGINX worker-process crash events (SIGSEGV / SIGABRT and immediate respawn) in syslog / journald, correlated with inbound HTTP requests carrying unusually long or deeply-nested rewrite-rule input strings from the same source; defenders should validate these against their own rewrite-rule configuration before depending on them."
  - claim_id: 121d5e3f55
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "headline"
    kind: frontmatter
    text: "SAP's August patch day is led by a CVSS 10.0 pre-auth code-execution flaw in the Commerce Cloud Data Hub Adapter, fixed only by a rebuild and redeploy"
  - claim_id: 076b1d5dc2
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "summary"
    kind: frontmatter
    text: "SAP's 2026-08-11 Security Patch Day fixes CVE-2026-58231, an improper-authorization flaw in the SAP Commerce Cloud Data Hub Adapter that Onapsis describes as insufficient authorization checks and input validation reachable without authentication, rated CVSS 10.0 and capable of arbitrary code execution. Further notes cover code injection in SAP Manufacturing Integration and Intelligence (CVE-2026-44772, 9.9; CVE-2026-44758, 9.1) and an unauthenticated memory-corruption flaw in the NetWeaver AS ABAP kernel's DIAG protocol parser (CVE-2026-34265, 9.8). No exploitation is reported by any party; Commerce Cloud fixes require rebuilding and redeploying the release rather than installing a patch, and an IP filter set is the vendor-side interim control."
  - claim_id: fff47448b9
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory self-managed SAP Commerce Cloud storefronts and apply SAP Security Note 3771065 by rebuilding and redeploying the fixed release — an installed patch is not sufficient for this component; where the redeploy cannot happen this week, restrict access to the Data Hub import endpoint with a Commerce Cloud IP filter set in the interim."
  - claim_id: e20904ebc7
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Confirm the Data Hub Adapter fix from SAP Security Note 3771065 has actually been rebuilt and redeployed on every internet-reachable Commerce Cloud instance — taking the note without the redeploy leaves the instance exposed — and treat any instance that stayed reachable and unredeployed after 2026-08-14 as owing a compromise assessment rather than only an upgrade."
  - claim_id: 3857b47289
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "actions[2]"
    kind: frontmatter
    text: "For any SAP Manufacturing Integration and Intelligence instance patched with Security Note 3765948 (CVE-2026-44772), configure and maintain the new 'Secure Transformer' system property with an explicit allowed-hosts list for XSL files — the patch alone does not remove the vulnerable servlet, and without this property the flaw remains exploitable regardless of patch status."
