    surface: "section 2026-09-13T15:10:00Z"
    kind: cited
    text: "Microsoft's own record for CVE-2026-69414 now carries a remediation boundary in its structured fields: \"Last version of the Microsoft Malware Protection Engine affected by this vulnerability\" reads 1.26070.7, and \"First version of the Microsoft Malware Protection Engine with this vulnerability addressed\" reads **1.1.26080.3** ("
    urls: ["https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69414"]
