  - claim_id: 792853a844
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: uncited
    text: "The record's CVSS vector carries `RL:O` — an official fix — against the `E:P` proof-of-concept maturity it already had."
  - claim_id: b678b5b15b
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: uncited
    text: "The practical point for a defender is that **the Defender engine version updates on its own cadence and is not the same thing as the OS patch level**, so an estate that is fully current on Windows Update is not thereby on engine 1.1.26080.3; check the engine version explicitly."
  - claim_id: e5f9c550bc
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: uncited
    text: "That replaces detection-as-the-only-control, which is what this entry has told readers since 2026-08-12."
  - claim_id: 196fc0a34d
    entry: 2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix
    surface: "section 2026-09-13T15:10:00Z"
    kind: uncited
    text: "**The same researcher now claims the fix is incomplete — as their own claim, not a confirmed one.** On 2026-09-08 Nightmare Eclipse published ShieldCrash, described in the researcher's own repository as a partial rather than total bypass: \"Microsoft has failed to properly patch ShieldBreak CVE-2026-69414, under specific conditions it is still possible to trigger the exact same problem that was caused by ShieldBreak."
  - claim_id: d2ec784096
