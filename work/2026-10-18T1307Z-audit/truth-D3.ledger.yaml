    kind: record-summary
    text: "This entry stated that SAP's fix \"removes the vulnerable servlet component in both cases\" for CVE-2026-44772 and CVE-2026-44758. Onapsis's own text says that only of Note 3758900 (CVE-2026-44758). For Note 3765948 (CVE-2026-44772, CVSS 9.9) the servlet is not removed; Onapsis states customers must additionally configure and maintain a new \"Secure Transformer\" system property naming the hosts allowed to serve XSL files to the servlet, or it remains reachable. The CVE-2026-44772 record and the body are corrected to name this required post-patch step."
