    surface: "body"
    kind: cited
    text: "Recent Splunk Enterprise ships a PostgreSQL sidecar service (the `splunk-postgres` component) that exposes a Go-based REST API on loopback port 5435 — including `/v1/postgres/recovery/backup` and `/v1/postgres/recovery/restore` endpoints — and that internal API performs *no authentication*, on the assumption that only loopback callers can reach it ("
