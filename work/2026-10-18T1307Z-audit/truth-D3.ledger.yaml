    text: "When authentication override is enabled and the GlobalProtect portal or gateway shares an X.509 certificate with another co-hosted service — most commonly the HTTPS management or captive-portal service — that certificate's public key is retrievable by any external party simply by connecting to the HTTPS service and inspecting the TLS handshake."
