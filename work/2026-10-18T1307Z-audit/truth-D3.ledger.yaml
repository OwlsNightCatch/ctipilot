    entry: 2026-06-14/splunk-enterprise-cve-2026-20253-pre-auth-rce-in-the-siem-vi
    surface: "body"
    kind: cited
    text: "From there an attacker writes attacker-controlled files into the sidecar's runtime directory and injects SQL into a crafted backup/restore payload, achieving code execution during the database restore step. watchTowr reports that Splunk Enterprise on AWS is vulnerable in its default configuration because the PostgreSQL sidecar is enabled out of the box, whereas on-premises Windows installs are exposed only where the sidecar has been explicitly enabled ("
