  - claim_id: 5f9f1b26cb
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: cited
    text: "Only XSL files from these hosts can be consumed by the vulnerable servlet\" ("
    urls: ["https://onapsis.com/blog/sap-security-patch-day-august-2026/"]
  - claim_id: 925e9d20f1
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: uncited
    text: "The original entry stated that SAP's fix \"removes the vulnerable servlet component in both cases\" for CVE-2026-44772 (Note 3765948) and CVE-2026-44758 (Note 3758900)."
  - claim_id: 499e0fbec5
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: uncited
    text: "Onapsis's own text supports that statement for only one of the two."
  - claim_id: 6bd20262b2
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
    surface: "section 2026-08-28T05:00:00Z"
    kind: uncited
    text: "For Note 3765948 (CVE-2026-44772, CVSS 9.9) the servlet stays in place, and Onapsis states the required remedy directly: \"After implementing the patch, customers need to maintain the new system property 'Secure Transformer' with a list of allowed hosts for hosting XSL files."
  - claim_id: bb20409cb4
    entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
