- entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
  verdict: imprecision
  defects:
  - where: body **Detection:** second sentence
    claim: The Citrix pages list no signs of compromise to look for ([Citrix, 2026-10-03](https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/))
    defect: (medium-low confidence; the cited Citrix blog is unreadable from the container, 403 on every transport including WebFetch) Three secondary sources relaying Citrix guidance from 2026-10-05 say
      Citrix supplies an indicator-of-compromise script through NetScaler Console as the compromise check for this CVE, so the Detection line omits the vendor's own post-patch compromise check and its 'The
      Citrix pages list no signs of compromise to look for' sentence is at best incomplete. Citrix's bulletin CTX697174 itself is silent on it.
    ground_truth: 'The Register (2026-10-05), quoting watchTowr: "Citrix provides an indicator-of-compromise script that teams can run to check exposed appliances for signs of compromise, though a clean
      result is not definitive proof"; watchTowr FAQ: "Citrix provides an indicator of compromise script through NetScaler Console to check affected appliances for signs of compromise. Citrix notes that
      the latest script version can report a false positive about suspicious nobody processes even when it finds no compromise"; Help Net Security (2026-10-05) quotes the same line.'
    ground_truth_url: https://www.theregister.com/security/2026/10/05/citrix-netscaler-security-snafus-get-even-worse-amid-more-0-day-reports/5301232
    fix: Confirm against the Citrix blog with a reader that can reach community.citrix.com; then replace the sentence with the NetScaler Console indicator-of-compromise script (a clean result is not proof;
      its nobody-process false positive) as the vendor's compromise check, and add it to the Detection line.
    class: imprecision
