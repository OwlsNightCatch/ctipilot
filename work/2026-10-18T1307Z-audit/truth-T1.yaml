- entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
  verdict: imprecision
  defects:
  - where: '## Update — 2026-10-06T04:59:00Z; sources[] CSAF record date'
    claim: The advisory's structured record is dated 2026-10-05 and lists 8.0.2, 7.6.7 and 7.4.9 as not affected
    defect: (low confidence) The CSAF record as fetched today carries current_release_date 2026-10-07 (revision_history lists only the 2026-10-01 initial publication), so the stated 2026-10-05 date, and
      the 2026-10-05 date on the sources[] record, no longer match the document; the not-affected list itself is correct. Probably true when written and re-dated by Fortinet's 2026-10-07 revision.
    ground_truth: 'CSAF tracking: "current_release_date": "2026-10-07T00:00:00", "initial_release_date": "2026-10-01T00:00:00"; known_not_affected: FortiMail-8.0.2, FortiMail-7.6.7, FortiMail-7.4.9'
    ground_truth_url: https://filestore.fortinet.com/fortiguard/psirt/csaf_improper-limitation-of-a-pathname-to-a-restricted-directory_fg-ir-26-175.json
    fix: Say the structured record lists the three builds as not affected without a record date (or date it 2026-10-07, its current release date).
    class: imprecision
- entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
  verdict: imprecision
  defects:
  - where: 'sources[] Live Protect page date; ## Update — 2026-10-03T04:55:00Z citation ''[Cisco, 2026-07-01]'''
    claim: Cisco's Live Protect page lists the feature from Catalyst SD-WAN Control Components release 20.18.3 ... ([Cisco, 2026-07-01](https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html))
    defect: '(low confidence) The page''s visible dateline is ''Updated: September 22, 2026'' (page date meta Oct 6 2026); no 2026-07-01 date appears on the page, so the citation date is unsupported. The
      content claims (20.18.3, monitoring/enforce modes, two preceding releases) are supported.'
    ground_truth: 'Page header: "Updated: September 22, 2026"; policy text: "Cisco creates Vulnerability Shields for the SD-WAN release that is current when the shield is published and for the two immediately
      preceding releases in each supported release train that includes Live Protect."'
    ground_truth_url: https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html
    fix: Change the citation and sources[] date to 2026-09-22 (the page's visible 'Updated' date).
    class: imprecision
- entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
  verdict: factual-error
  defects:
  - where: 'summary; actions[0]; cves[CVE-2026-102489].fixed; body Defender takeaway; ## Update — 2026-10-10T03:43:01Z last sentence'
    claim: 'Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes | (6.5 and older receive no security fixes, and 7.2.0 is affected ...) | Nothing changes
      for the code-execution flaw: it stays exploitable only on 6.5 and older, which receive no security fixes.'
    defect: 'Superseded by the vendor''s own channel: on 2026-10-15 Zammad shipped 6.5.5, an exceptional emergency security release for the unsupported 6.5 series that hardens the WebSocket server code
      to address CVE-2026-102489, so ''6.5 and older receive no security fixes'' and ''no fix'' for the code-execution flaw on 6.5 are no longer true for 6.5 (6.4 and older remain unfixed; 6.5.5 is only
      available through a new package repository).'
    ground_truth: '"Zammad 6.5.5 is an exceptional security release addressing a critical vulnerability in the unsupported 6.5 series. It provides an emergency fix for customers who cannot immediately upgrade
      to a supported version." / "Zammad 6.5.5 provides an emergency security fix by hardening the WebSocket server code to address CVE-2026-102489" / "Zammad 6.5 users: Update to Zammad 6.5.5 immediately
      if upgrading to Zammad 7.2.2 is not yet possible." (release dated 15 October 2026; releases list shows 6.5.5 on 15 October 2026)'
    ground_truth_url: https://zammad.com/en/product/releases/6-5-5
    fix: Append an update record and section naming Zammad 6.5.5 (2026-10-15) as the emergency fix for CVE-2026-102489 on the 6.5 series (new package repository required; 6.4 and older and the 7.2.2-or-later
      recommendation unchanged), and restate 'receive no security fixes' in summary, actions[0], cves[CVE-2026-102489].fixed, the takeaway and the 2026-10-10 closing sentence as 'receive no regular security
      fixes; 6.5 has one emergency fix (6.5.5)'.
    class: factual-error
