    claim: FTAPI Software of Munich, whose secure file-transfer service is used by authorities and companies
    defect: (low confidence) The legal name 'FTAPI Software' appears in none of the cited sources, which say only 'Munich-based provider FTAPI'; the name is uncited, though it is the vendor's real company
      name.
    ground_truth: 'heise: "Munich-based provider FTAPI offers services for easy data transfer. Its customers include authorities and companies."'
    ground_truth_url: https://www.heise.de/en/news/Cyber-attack-on-data-exchange-service-FTAPI-11469688.html
    fix: Write 'FTAPI of Munich' as the cited sources do.
    class: imprecision
