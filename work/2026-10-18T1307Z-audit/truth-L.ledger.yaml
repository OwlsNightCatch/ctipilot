    surface: "section 2026-05-09T05:00:13Z"
    kind: uncited
    text: "Three major UK universities issued public statements: **University of Oxford** confirmed it is working with Instructure and the NCSC-UK; **University of Cambridge** issued a statement acknowledging that \"student and staff data may have been affected\" and referred staff to the National Cyber Security Centre guidance; **University of Liverpool** confirmed it had notified the Information Commissioner's Office under Article 33 GDPR and is conducting a forensic investigation."
