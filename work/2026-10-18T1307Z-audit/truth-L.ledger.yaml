    urls: ["https://ubuntu.com/blog/dirty-frag-linux-vulnerability-fixes-available"]
  - claim_id: 0fe790bbff
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Researcher Hyunwoo Kim disclosed \"Dirty Frag\" on 2026-05-07/08 after a third party inadvertently broke embargo by reverse-engineering the upstream patch."
  - claim_id: 5adf891fe3
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "The chain exploits two page-cache write primitives: **CVE-2026-43284** (xfrm-ESP/IPsec subsystem, introduced ~2017, kernel mainline patch merged 2026-05-08) and **CVE-2026-43500** (RxRPC subsystem, introduced ~2023, patch still pending at disclosure)."
  - claim_id: 5b8c77cb1a
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Unlike race-condition kernel exploits, this chain is deterministic and near-100% reliable: both primitives allow userland code to write arbitrary values into read-only page-cache pages (e.g., `/etc/passwd`, `/usr/bin/su`, setuid binaries) via memory aliasing caused by DMA remapping."
  - claim_id: 5be9f075e8
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "The combined primitive produces a stable root primitive without timing windows."
  - claim_id: c1e051a108
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Exploitation requires `CAP_NET_ADMIN` — available by default in Linux user namespaces on Ubuntu, Fedora, and most Arch-based distributions; restricted on RHEL 8/9 and some hardened configs."
  - claim_id: 454edc306a
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Public PoC was published alongside disclosure."
  - claim_id: 82b1f080a8
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Affected distributions with confirmed exposure: Ubuntu 22.04/24.04/24.10, RHEL 8/9/10, Fedora, CentOS Stream, AlmaLinux, openSUSE Tumbleweed."
  - claim_id: c14213cf09
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "Mitigation until patches land: `modprobe -r esp4 esp6 rxrpc` (breaks IPsec VPNs and AFS filesystems)."
  - claim_id: a7d01c1eac
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: uncited
    text: "This is a distinct chain from CVE-2026-31431 (\"Copy Fail\"), also by Kim, carrying its own separate CVE ids and code paths — though Red Hat's own bulletin notes the similarity is close enough that it refers to Dirty Frag as \"Copy Fail 2\" (see the 2026-09-05 update below)."
  - claim_id: 23448a97d4
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: derived
    text: "**Detection:** Sysmon EID 1 / auditd `execve` on setuid binaries called from anomalous parent processes; EDR process ancestry anomalies for processes spawning as root from a non-root user context; unexpected writes to `/etc/passwd` or `/etc/shadow` detected via `auditctl -w /etc/passwd -p w`."
  - claim_id: a8d74bcac6
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: cited
    text: "Microsoft Threat Intelligence published"
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/"]
  - claim_id: b7dc526a05
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: cited
    text: "Red Hat published RHSB-2026-003 covering both CVEs on 2026-05-07 and updated it on 2026-05-09, with backported errata rolling out to RHEL 8/9/10 and OpenShift 4 ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: c89bb167c5
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: cited
    text: "NCSC.ch issued"
    urls: ["https://security-hub.ncsc.admin.ch/api/posts/12547/details"]
  - claim_id: 2d6d2cc23a
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: cited
    text: "Belgium's CCB issued a parallel advisory ("
    urls: ["https://ccb.belgium.be/advisories/warning-dirty-frag-new-linux-local-privilege-escalation-vulnerability-was-disclosed"]
  - claim_id: 7c59357554
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "This is the first formal \"exploited in the wild\" attribution since the V4bel write-up published on 2026-05-07."
  - claim_id: 1717ad7d93
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "The upstream xfrm-ESP fix merged on 2026-05-07 (kernel commit referenced by V4bel and corroborated by Red Hat); the RxRPC fix was still pending in the netdev tree at time of writing."
  - claim_id: 45e113cd30
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "AlmaLinux backported kernels on 2026-05-08; Ubuntu noted fixes will arrive via the kernel image package."
  - claim_id: d079b0715b
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "Defender hunt focus: outbound SSH-to-unprivileged-shell-to-ELF-execution chains immediately followed by `setuid(0)` or `su` invocations, plus suspicious `setsockopt(AF_ALG)` patterns on the `esp4`/`esp6`/`rxrpc` modules followed by `splice()` syscalls into the page cache of read-only files."
  - claim_id: 0e7a43ed2d
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "The Microsoft post emphasises that the page-cache write primitive bypasses on-disk file integrity monitoring (AIDE / IMA-EVM / auditd watch rules) — post-incident forensics must compare in-memory page contents against on-disk checksums, not just `md5sum` of the file."
  - claim_id: 9075185bc0
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "Mitigation note (carried from 2026-05-09): on Ubuntu where unprivileged user namespaces are blocked by default, the `esp4`/`esp6` path is harder to reach because `CAP_NET_ADMIN` is required — but the RxRPC path remains exploitable without user-namespaces; the two CVEs are designed to complement each other."
  - claim_id: 21438c3ded
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "Where IPsec is in use, Red Hat suggests `kernel.unprivileged_userns_clone=0` (sysctl) as a less disruptive mitigation than full `esp4`/`esp6` module blacklisting."
  - claim_id: 514dcc7daa
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-05-11T05:00:03Z"
    kind: uncited
    text: "AFS users cannot blacklist `rxrpc` without losing AFS — wait for the distribution backport."
  - claim_id: 6ac13d7b25
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-09-05T05:15:00Z"
    kind: cited
    text: "A related flaw, CVE-2026-46300 (\"Fragnesia\", tracked in its own entry), reopens this vulnerability's underlying page-cache-write primitive even on hosts already patched against CVE-2026-43284: a thirteen-year-old bug (dating to 2013) in the kernel's `skb_try_coalesce()` fails to preserve the marker that flags a fragment as page-cache-backed, which the original xfrm-ESP fix depends on to decide whether it is safe to decrypt in place ("
    urls: ["https://www.aikido.dev/blog/dirty-frag"]
  - claim_id: 145ee87501
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-09-05T05:15:00Z"
    kind: cited
    text: "Red Hat's own security bulletin groups all three CVEs under the collective \"Dirty Frag\" name — noting the family's similarity to the earlier CVE-2026-31431 \"Copy Fail\" is close enough that Red Hat also refers to it as \"Copy Fail 2\", even though the two remain distinct CVEs with their own code paths — and confirms CVE-2026-46300 affects supported Red Hat Enterprise Linux kernels; administrators who patched only against CVE-2026-43284/CVE-2026-43500 should verify the CVE-2026-46300 fix is applied too ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: 92ff285e30
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "section 2026-09-05T05:15:00Z"
    kind: cited
    text: "Public proof-of-concept exploits for this family now target Kubernetes specifically, extending the exposure to container-shared-kernel environments beyond the bare-metal/VM case originally described ("
    urls: ["https://www.aikido.dev/blog/dirty-frag"]
  - claim_id: ad1ef53744
