  - claim_id: 587505868e
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "summary"
    kind: frontmatter
    text: "On 2026-05-05 at 21:43 UTC, DENIC (the .de domain registry) began distributing invalid DNSSEC signatures for the .de TLD, making approximately 18 million .de domains unreachable for DNSSEC-validating resolvers for roughly 3.5 hours (DENIC blog post-incident report, 2026-05-08 · DENIC initial report, 2026-05-05)."
  - claim_id: 30f2c391d5
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: cited
    text: "On 2026-05-05 at 21:43 UTC, DENIC (the .de domain registry) began distributing invalid DNSSEC signatures for the .de TLD, making approximately 18 million .de domains unreachable for DNSSEC-validating resolvers for roughly 3.5 hours ("
    urls: ["https://blog.denic.de/en/technical-issue-with-de-domains-resolved/"]
  - claim_id: 9cf07e7359
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: cited
    text: "Crucially, .ch was unaffected ("
    urls: ["https://www.heise.de/news/DNS-Probleme-mit-de-Domains-DENIC-liefert-erste-Erklaerung-11288197.html"]
  - claim_id: d8a239006c
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: uncited
    text: "Root cause: a software defect in DENIC's HSM integration code introduced during a March 2026 migration to Knot DNS generated three key pairs sharing keytag 33834, but only one public key was published in the zone; inconsistent signing across name servers followed."
  - claim_id: e11d38cffc
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: uncited
    text: "Cloudflare deployed a Negative Trust Anchor under RFC 7646 for its resolvers within ~90 minutes; DENIC restored service by 01:15 UTC on 2026-05-06."
  - claim_id: 94ab7ba4fe
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: uncited
    text: "This is an operational misconfiguration, not an attacker action."
  - claim_id: f97e96bd54
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** DNSSEC registry-side errors are indistinguishable from attacker-induced validation failures from the resolver's perspective."
  - claim_id: f05c18458a
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: derived
    text: "Defenders should maintain RFC 7646 Negative Trust Anchor capability in their validating resolvers for continuity during registry incidents."
  - claim_id: 96cbbc6b46
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: derived
    text: "German public-sector operators relying on .de-hosted services (government portals, MX records, API endpoints) should review their incident runbooks for DNSSEC-induced availability events to separate \"registry outage\" from \"zone-level attack.\""
  - claim_id: e996464234
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: cited
    text: "DENIC published its formal technical post-mortem on 2026-05-08 ("
    urls: ["https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/"]
  - claim_id: 3c630f0886
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "Confirmed root cause: a code defect in DENIC's third-generation custom signing infrastructure (deployed April 2026 atop Knot DNS)."
  - claim_id: 718f9ca619
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "During a routine Zone-Signing-Key rotation the code generated **three private key pairs all assigned the same Key Tag (33834)** rather than a unique tag per key — and only one corresponding public DNSKEY record was published to the zone."
  - claim_id: 300a715e57
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "The RRSIG records signed by the two unpublished keys were therefore unvalidatable; DNSSEC-validating resolvers marked all .de delegations as \"Bogus\", which through the bogus NSEC3 trust path also took down resolution for non-DNSSEC-signed .de domains."
  - claim_id: 9e9fecf801
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "The outage ran 2026-05-05 21:43 UTC → 2026-05-06 ~01:15 UTC (~3.5 h)."
  - claim_id: 61ce3aa47a
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "Critically, DENIC notes the monitoring pipeline detected anomalous resolver behaviour but **the alerting layer did not correctly forward the alerts** — the SIEM-rule equivalent of a fire-but-don't-page failure."
  - claim_id: 84ba56f42a
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "Knot DNS itself is not implicated; the bug was in DENIC's automation layer atop Knot."
  - claim_id: 6e932a21d7
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "section 2026-05-10T05:00:11Z"
    kind: uncited
    text: "Defender takeaway: DNSSEC registry-side errors are indistinguishable from attacker-induced trust failures from a resolver's perspective."
  - claim_id: 06d30d3ce9
