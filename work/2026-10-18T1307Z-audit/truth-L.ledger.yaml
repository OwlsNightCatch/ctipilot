    entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
    surface: "body"
    kind: uncited
    text: "A low-privilege admin user can inject `${Runtime.exec(\"id\")}` payloads into notification templates to achieve code execution as the application user when a template is rendered (triggered by any email delivery event)."
