    text: "Vulnerability summary: **CVE-2026-44128** (CVSS 9.3 CRITICAL) — unauthenticated RCE via test/development HTTP endpoints left active in the GINAv2 component; **CVE-2026-44125** (CVSS 9.3 CRITICAL) — missing authorisation in GINAv2 enabling unauthenticated administrative access and file manipulation; **CVE-2026-44126** (CVSS 9.2 CRITICAL) — insecure deserialisation enabling full gateway takeover; **CVE-2026-44127** (CVSS 8.8 HIGH) — local file inclusion and arbitrary file deletion; **CVE-2026-44129** (CVSS 8.3 HIGH) — server-side template injection; **CVE-2026-7864** (CVSS 6.9 MEDIUM)."
