    surface: "body"
    kind: uncited
    text: "The appliance management web interface (running on port 8443 as a separate Java application from GINAv2) includes a log-file viewing endpoint (`/admin/logs/view?file=<filename>`) and a log-rotation endpoint (`/admin/logs/rotate?file=<filename>`)."
