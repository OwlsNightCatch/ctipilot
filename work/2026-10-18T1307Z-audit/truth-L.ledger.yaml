    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-10T05:00:08Z"
    kind: cited
    text: "ShinyHunters posted a second intrusion notice around 2026-05-08 asserting Instructure's Canvas LMS retained unpatched vulnerabilities allowing re-entry despite the company's earlier security-patch deployment ("
