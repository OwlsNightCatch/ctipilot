    entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
    surface: "body"
    kind: uncited
    text: "A low-privilege authenticated attacker (any valid admin console account) can: (a) read arbitrary files via the view endpoint — including `/etc/shadow` on distros with lax permissions, TLS private keys under `/etc/ssl/private/`, and PostgreSQL `pg_hba.conf`; (b) delete arbitrary files via the rotate endpoint, enabling denial-of-service or clearing of evidence (audit logs, syslog forwarding configuration)."
  - claim_id: 540055754a
    entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
    surface: "body"
    kind: uncited
    text: "The GINAv2 notification email customisation feature (configurable in the admin console) renders user-controlled template strings using a Freemarker template engine without sandboxing."
