    surface: "body"
    kind: uncited
    text: "The Tomcat process runs as a dedicated application user (`seppmail`) that holds read access to the GINAv2configuration files — including `gina.properties`, which stores LDAP bind DN and password, SMTP relay credentials, and the symmetric key used to protect stored S/MIME private keys."
