    entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
    surface: "body"
    kind: uncited
    text: "Both accept unsanitised `file` parameters; path traversal sequences (`../../`) are not normalised before path construction."
