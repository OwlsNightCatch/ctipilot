    entry: 2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c
    surface: "body"
    kind: uncited
    text: "The Freemarker API exposure allows full Java Runtime access by default; `freemarker.template.utility.Execute` is accessible via the `?api` built-in."
