    kind: uncited
    text: "However, the cookie-signing validation logic has a path-traversal weakness: if the supplied `GINA_SESSION` value begins with `../`, the validation routine reads the session bytes from the local filesystem (relative to the session-store directory) rather than from the database."
  - claim_id: 7b1d34dcfe
