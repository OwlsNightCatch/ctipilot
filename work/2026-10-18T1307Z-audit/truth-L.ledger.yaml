    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "headline"
    kind: frontmatter
    text: "CVE-2026-43284 / CVE-2026-43500 — Linux \"Dirty Frag\": deterministic LPE chain via page-cache write primitives in xfrm-ESP and RxRPC, active exploitation"
  - claim_id: 58ea61b0de
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "summary"
    kind: frontmatter
    text: "\"Dirty Frag\" — two new Linux kernel LPE CVEs (CVE-2026-43284 / CVE-2026-43500), deterministic page-cache write chain, public PoC; active exploitation in limited campaigns confirmed by Microsoft; kernel patch for the rxrpc component still pending on all major distros. Mitigation: blacklist esp4, esp6, rxrpc kernel modules until distro patches land."
  - claim_id: 09f1856a60
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the distribution kernel update for CVE-2026-43284 and CVE-2026-43500, and separately confirm the related CVE-2026-46300 fix (tracked in its own entry) — Red Hat's applicability split means CVE-2026-43500 specifically does not affect RHEL, but CVE-2026-43284 and CVE-2026-46300 both do."
  - claim_id: c88ccba8b2
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "actions[1]"
    kind: frontmatter
    text: "Where immediate patching isn't possible: blacklist the `esp4`/`esp6`/`rxrpc` kernel modules (`modprobe -r esp4 esp6 rxrpc`; breaks IPsec/AFS if used) or disable unprivileged user namespaces (`kernel.unprivileged_userns_clone=0` on Ubuntu/Debian, `user.max_user_namespaces=0` on RHEL/CentOS) to block the CAP_NET_ADMIN acquisition path."
  - claim_id: c7b5d3756d
