    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-10T05:00:08Z"
    kind: uncited
    text: "Defenders at European universities using Canvas should treat credential-stuffing risk on stolen student / staff emails as active, audit third-party LTI integrations, and watch for follow-on phishing campaigns referencing course content."
  - claim_id: 19bfb94678
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: cited
    text: "Instructure on 2026-05-11 disclosed that it \"reached an agreement with the unauthorized actor\" and received \"digital confirmation of data destruction (shred logs)\" — a ransom payment in everything but name, undisclosed amount, covering the platform-wide ~3.65 TB dataset that ShinyHunters claimed to have lifted from Canvas's Free-for-Teacher tier on 2026-04-29 ("
    urls: ["https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers", "https://www.infosecurity-magazine.com/news/shinyhunters-escalates-canvas/"]
  - claim_id: 3717b0c05d
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: cited
    text: "Two material developments accompany the settlement: (a) Instructure confirmed a **second intrusion on 2026-05-07** in which ShinyHunters defaced approximately 330 individual institution login portals via the same Free-for-Teacher vulnerability — the first ITW evidence that the underlying flaw remained exploitable post-patch; (b) ShinyHunters has now **reset a per-institution payment deadline to end-of-day 2026-05-12** (today), positioning the central settlement as covering only the bulk dataset while leaving individual institutions exposed to targeted publication ("
    urls: ["https://www.theregister.com/security/2026/05/12/double-canvas-intrusion-confirmed-as-shinyhunters-resets-leak-deadline/5238361"]
  - claim_id: 3b83e34388
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: uncited
    text: "CEO Steve Daly publicly acknowledged delayed external communication (\"we got the balance wrong\" on disclosure timing)."
  - claim_id: 44f3e47623
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: uncited
    text: "CrowdStrike remains engaged for the IR work."
  - claim_id: 188a882a6d
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: uncited
    text: "Operational reality for any European university running Canvas: the \"data was destroyed\" claim is not technically verifiable — by ransomware-actor practice, the artefact provided is typically a hash list or a video, not a forensically meaningful proof of deletion."
  - claim_id: 09c8a9fa39
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: uncited
    text: "The dataset must continue to be treated as compromised in perpetuity for GDPR / Swiss DSG purposes, downstream phishing risk planning, and student-identity exposure communications."
  - claim_id: 9694912561
    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "section 2026-05-12T05:00:05Z"
    kind: uncited
    text: "Institutions that received the per-institution deadline note should validate that any locally-stored Canvas-derived data (course rosters, communications, gradebooks) is included in the breach-notification scope, regardless of the platform-wide settlement."
  - claim_id: b4d97f4162
