    surface: "section 2026-05-10T05:00:08Z"
    kind: uncited
    text: "Seven Dutch universities — **VU Amsterdam, University of Amsterdam, Erasmus University Rotterdam, Tilburg University, Eindhoven University of Technology (TU/e), Maastricht University, and University of Twente** — executed emergency Canvas disconnections on or before 2026-05-09 after the attackers claimed continued active access."
