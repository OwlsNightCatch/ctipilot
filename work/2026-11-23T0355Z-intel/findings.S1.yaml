        attribution: "RemoteToHome Consulting"
        source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026"
    extended_notes: |
      Exposure: a router or KVM is exposed when the GoodCloud cloud-management switch is on (RemoteToHome reads the client's init script as starting it only when that option is 1; switching GoodCloud off stopped the client on every router it tried). Models and minimum fixed firmware are in the vendor notice; the vendor says an unlisted model is not necessarily unaffected. Check by reading the device: the vendor's check is a running process whose command line masquerades as the cron daemon with an argument in /tmp (router: process list over SSH or LuCI; KVM: its own terminal, the connected computer is not the place to run it), but RemoteToHome found that exact process on none of the routers it checked while finding a remote shell, a leftover NAT-chain firewall rule, an empty state file in /etc and an older backdoor, so absence of the vendor indicator is weak evidence. The state file and the firewall rule are traces of the cloud command and the rule disappears when GoodCloud is switched off or the device restarts, so look before rebooting or upgrading.
      Detection: telemetry classes are the device's own process list and startup files (modified init scripts, a line added to the sysupgrade keep-list, added SSH authorized keys), the router's NAT table, and egress flow and DNS logs for the site (a router holding a long-lived outbound TCP session to an unfamiliar host, or contact with many residential addresses and a blockchain API, as the KVM owner reported). The cloud account's device log is also a source: one owner reports command responses with an odd id for the AstroWarp command (not checked by RemoteToHome).
      Post-patch compromise check: the vendor says the security firmware removes the identified malware and settings can be kept, but RemoteToHome's test on a GL-MT3000 found startup entries it does not name survived an upgrade with settings kept and ran on the fixed firmware, and that an infected KVM upgraded to 1.10.3 with configuration kept also keeps a boot script and an added SSH key; it advises reinstalling with Keep Settings off, treating every key, password and VPN profile stored on the device as read, and removing that access on the server side. Upgrading an infected KVM removes the implant without keeping a copy, so preserve evidence first. If a KVM was infected, check the computer behind it.
      Behaviour: nothing in the sources identifies a benign process matching the vendor's indicator; no discriminator is stated.
      Not carried here by design: IP addresses, hashes, file names and the vendor's literal indicator string.
