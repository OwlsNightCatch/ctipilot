      - quote: "The GoodCloud client on the router passes a value from a cloud message to the shell, as root, without checking it. That is how the attack got in"
        attribution: "RemoteToHome Consulting"
        source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026"
