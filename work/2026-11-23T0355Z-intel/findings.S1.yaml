        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/ghostscript-before-10.08.0-dsafer-bypass-via-putgstringcopy-forceput-recovery"
      - quote: "Confirmed remote execution after an external sender's attachment was thumbnailed when its email was viewed."
        attribution: "pwn.ai"
        source_url: "https://pwn.ai/upload2shell"
      - quote: "Confirmed unauthenticated remote command execution: an IPP job to a shared queue ran on the host as"
        attribution: "pwn.ai"
        source_url: "https://pwn.ai/upload2shell"
      - quote: "Almost every application we tested with file uploads could be tricked into passing a file with a trusted extension to Ghostscript."
        attribution: "pwn.ai"
        source_url: "https://pwn.ai/upload2shell/research.html"
      - quote: "Updating the host operating system does not update a separate copy of Ghostscript bundled inside a container image or an application"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html"
    extended_notes: |
      Exposure: any host running Ghostscript before 10.08.0 or a distribution build without the backport, including copies bundled in container images and applications (a host package update does not reach them). It matters where untrusted files reach a renderer: shared or anonymous CUPS queues, webmail with ImageMagick-based attachment thumbnails (Roundcube; pwn.ai also tested the Roundcube path shipped with Plesk at component level), CMS and form plugins that accept uploads and call Imagick, Pillow or libvips, wiki upload and resize paths using an optional ImageMagick backend, and document-import workers. Check the version with the packaged tool, the container image's package list and the application's bundled libraries.
      Detection: telemetry class is process-creation with parent lineage: Ghostscript (gs) or an ImageMagick delegate started by a web server, PHP-FPM worker, cupsd or a mail-preview worker and then spawning a shell or network utility; plus web, mail and print-job logs for files whose extension (.png, .jpg, .pdf) does not match PostScript or EPS content. pwn.ai notes the commands run as the low-privilege rendering account (lp, www-data) and, in one test, an enforced AppArmor profile stopped the interpreter from starting a shell. No post-patch compromise check is stated by any source.
      Hardening named by the sources: update Ghostscript to 10.08.0 or the distribution fix and rebuild images; require authentication on print queues; limit which file types an image processor accepts; contain the rendering process with AppArmor or similar.
  # ------------------------------------------------------------------ 3. KVM CVE-2026-99312
  - title: "Linux KVM CVE-2026-99312: a stale nested-page-table pointer left by an INIT reset lets a root guest on an AMD host with nested virtualization reach and modify host memory; fixed in kernels 7.3.5, 6.18.64 and 6.12.118, most distribution kernels still unfixed on 2026-11-20, no exploitation or public exploit"
    kind_suggestion: vulnerability
    sources:
      - { url: "https://www.terra.security/blog/kvm-guest-to-host-escape", publisher: "Terra Security (Oren Yomtov)", date: "2026-11-18", role: "primary" }
      - { url: "https://www.digitalocean.com/blog/cve-2026-99312-kvm-patch", publisher: "DigitalOcean (disclosure and mitigation post)", date: "2026-11-19", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/new-linux-kvm-flaw-cve-2026-99312-lets.html", publisher: "The Hacker News", date: "2026-11-20", role: "corroborating" }
      - { url: "https://ubuntu.com/security/CVE-2026-99312", publisher: "Ubuntu CVE tracker (last updated 2026-11-20)", date: "2026-11-20", role: "corroborating" }
    discovery_trace: "first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item 'Linux KVM Flaw CVE-2026-99312 Lets Guest VMs Access Host Memory on AMD Hosts', 2026-11-20) -> pivot: THN article, URL https://thehackernews.com/2026/11/new-linux-kvm-flaw-cve-2026-99312-lets.html -> primary: Terra Security writeup, URL https://www.terra.security/blog/kvm-guest-to-host-escape; DigitalOcean post, URL https://www.digitalocean.com/blog/cve-2026-99312-kvm-patch -> corroborating: Ubuntu CVE tracker, URL https://ubuntu.com/security/CVE-2026-99312"
    summary: |
      Terra Security found that a Linux KVM host on AMD processors with nested virtualization enabled leaves a virtual CPU's nested-page-table pointer pointing at freed memory when a nested VM is stopped with an INIT reset; once the kernel reuses the page, the guest can fill it with its own entries and the processor follows them, so a guest with root inside its own VM can map host memory. DigitalOcean, which received the report through its bug bounty and treated it as critical, says the researchers read about 127 GB of host RAM read-only from a Droplet and, on a bare-metal AMD server with no other tenants, wrote 32 chosen bytes into a live host kernel page. The kernel CVE team scores it 8.8 (CVSS 3.1) while Red Hat's preliminary assessment is Moderate 5.6 and treats it as denial of service only. Fixes are in stable 7.3.5 and long-term 6.18.64 and 6.12.118 (shipped 2026-11-17; the kernel CVE announcement is dated 2026-11-18); Intel hosts are not affected and DigitalOcean live-patched its fleet. Ubuntu's tracker, updated 2026-11-20, lists the linux package as Vulnerable on 22.04 LTS, 24.04 LTS, 26.04 LTS and 26.10, so distribution kernels lag the upstream fix. The Hacker News reports no use outside research and no published exploit code, citing VirtFusion for the first point; the code dates from a 2022 fix for CVE-2022-3344.
    region_nexus: "global; relevant to any public-sector private cloud or virtualization estate that runs KVM on AMD hardware with nested virtualization on; no source states a Swiss deployment"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-99312]
    techniques: [T1611, T1068]
    affected_products: ["Linux kernel KVM (x86, AMD SVM nested virtualization)"]
    entity_keys: ["product:linux-kernel-kvm-x86"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    sourcing_note: "Terra Security is the discoverer and DigitalOcean the confirming operator; the Ubuntu tracker independently shows the distribution status. The 127 GB read and the 32-byte write are the researchers' and DigitalOcean's claims; no exploit code is public."
    confidence: HIGH
    admiralty_suggestion: { reliability: B, credibility: 2 }
    priority_suggestion: notable
    novelty: new
    borderline: true
    borderline_reason: "Primary published 2026-11-18 and 2026-11-19, about 3 days outside the window, and no earlier fire or the 2026-11-22 audit covered it; no exploitation, no public exploit, needs root in a guest on AMD with nested virtualization enabled. Relevance rests on private-cloud KVM estates; the main agent decides."
    lookback: false
    evidence:
      - quote: "On AMD processors with nested virtualization enabled, a customer with root inside their own Droplet could reach and modify the memory of the physical host underneath it."
        attribution: "DigitalOcean"
        source_url: "https://www.digitalocean.com/blog/cve-2026-99312-kvm-patch"
      - quote: "Intel-based KVM hosts are not affected, because the vulnerable code exists only in KVM's support for nested virtualization on AMD."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/new-linux-kvm-flaw-cve-2026-99312-lets.html"
      - quote: "No exploit code has been published either, and no guidance exists for detecting a past attempt."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/new-linux-kvm-flaw-cve-2026-99312-lets.html"
      - quote: "That turns nested virtualization off and closes this path completely."
        attribution: "DigitalOcean"
        source_url: "https://www.digitalocean.com/blog/cve-2026-99312-kvm-patch"
    extended_notes: |
      Exposure: hypervisor hosts on AMD processors with the kvm_amd nested parameter enabled that run a kernel without the 2026-11-17 stable fixes; guests that are only Intel-hosted are out of scope. The fix lives in the host kernel and a host keeps the old kernel until rebooted; updating guest operating systems changes nothing. Read the nested setting from the kvm_amd module parameter; DigitalOcean's stated workaround, when a fixed kernel cannot be installed, is setting that parameter to 0, which closes the path.
      Detection: the sources state no detection guidance and say none exists for a past attempt. A guest that needs root plus nested virtualization means tenants who can run their own hypervisor in a guest are the population to review; host kernel crashes or oopses in KVM MMU code after guest INIT sequences are a plausible symptom but no source states it.
      Not stated: any exploitation in the wild; the Red Hat versus kernel-CNA severity disagreement is reported by The Hacker News.
