  # ------------------------------------------------------------------ 1. GL.iNet GoodCloud
  - title: "GL.iNet confirms its GoodCloud cloud management service was exploited to install malware on routers and KVM devices: a cloud-delivered value is run as root by the router client (RemoteToHome's reading, not vendor-confirmed), fixed firmware from 2026-11-22, and the cloud-side fix does not clean already infected devices"
    kind_suggestion: incident
    sources:
