    summary: |
      The covered nginx2root entry describes five memory-corruption flaws, but nginx.org's advisory page lists ten flaws fixed in nginx 1.31.9 and 1.30.7 on 2026-11-18, and Fortinet's FG-IR-26-279 (last updated 2026-11-21) lists the same ten. The five not in the entry: CVE-2026-118899, an infinite loop while reading a request body over TLS 1.3 that lets an unauthenticated attacker stall a worker (nginx 1.13.0 and later; nginx.org rates it major, F5 CVSS 3.1 7.5 per Cloudflare); CVE-2026-120967, an SNI bypass when using client-certificate validation in the stream module (1.25.5 and later, medium); CVE-2026-125283, a buffer overflow with alias and try_files (minor); CVE-2026-120993, a NULL dereference with PROXY protocol version 2 (1.31.4 to 1.31.8, fixed only in 1.31.9); and CVE-2026-123640, insufficient validation in ssl_preread (minor). Cloudflare Radar notes most of them affect the stream modules. Fortinet states none of its products use NGINX Plus. The fix versions are the ones the entry already carries, so the delta is scope: the SNI bypass matters where stream listeners enforce client certificates, and the TLS 1.3 loop is an unauthenticated worker stall on any TLS 1.3 server.
