      - { url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", publisher: "RemoteToHome Consulting (incident coordination page, last reviewed 2026-11-23 03:57 UTC)", date: "2026-11-23", role: "corroborating" }
      - { url: "https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/technical-breakdown.md", publisher: "RemoteToHome Consulting (technical breakdown)", date: "2026-11-22", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ (item 'Hackers exploit GL.iNet cloud flaw to infect routers, KVM devices', 2026-11-22) -> pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/ (links the vendor notice and RemoteToHome) -> primary: GL.iNet Security Notice, URL https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20 -> corroborating: RemoteToHome README, URL https://github.com/RemoteToHome-io/gl-security-incident-2026, then its technical breakdown, URL https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/technical-breakdown.md"
    summary: |
      GL.iNet says it identified on 2026-11-20 a vulnerability in its cloud remote management service that an unauthorized party exploited to access and install malicious software on some GL.iNet routers and KVM devices; the cloud-side fix blocks new infections but, in the vendor's words, does not remove malware from devices already infected. Stable security firmware is listed per model (routers from 4.7.14 to 4.11.1 depending on model, KVMs 1.10.3 for the RM1, RM1V2, RM10, RM1PE and RM4PE (a 1.10.3 beta or later for the RM10RC per BleepingComputer) and 1.8.7 for the RMQ1) and the vendor says it removes the identified malware without a factory reset. The vendor has not published how many devices were hit, since when, or what the malware does, says its own quick check may miss affected devices, and is still determining whether computers behind infected KVMs were reached. BleepingComputer, which examined the installer script itself, describes model-aware malware that persists through startup scripts and scheduled tasks, masquerades as the cron daemon, hides its connections from netstat, installs SSH keys and alters file timestamps. It also notes that some recovered files carry December 2025 timestamps (unclear whether related) and that one KVM owner saw traffic to roughly 1,800 residential addresses a day, purpose unconfirmed. The independent consultancy RemoteToHome Consulting reports from reading the compiled GoodCloud client that its handler for the cloud command virtual_ip_info (AstroWarp module) puts two cloud-supplied fields into an iptables command run as root through the shell without validation, whether or not AstroWarp is enabled, that the code is present in released firmware from GL-MT3000 4.7.0 (2024-12-05) to 4.11.0, and that on the routers it manages the attacker used it on at least seven models from 2026-11-20, in some cases to open a root reverse shell. RemoteToHome says 166 of 199 routers it reached show this attack or an older, separate backdoor installed from September 2025 (a non-random sample), that the vendor's published indicator did not appear on any router it checked, that the fixed firmware's clean-up is partial and that one further cloud-client weakness is withheld until fixed; GL.iNet has not confirmed any of these points. No source states a Swiss or European public-sector footprint.
    region_nexus: "global; no source states a Swiss or EU public-sector footprint. GL.iNet sells travel, branch and home routers and IP-KVMs that IT staff and small or remote sites use, so relevance rests on that exposure class and on the KVM's reach into attached hosts"
