    summary: |
      The GnuPG project announced GPGME 2.3.1 as a fix for what it calls a critical security bug found in all prior versions: by using an OpenPGP key with a crafted very long user id, a double free can be triggered, which can be used to exfiltrate data from applications, for example by sending signed data, and remote code execution cannot be ruled out. The cause is two internal routines that read status lines and key listings from gpg: a buffer starts at 1024 bytes and is reallocated when input runs long, but the new pointer is stored back in the context only at the end, so an early return on a read error leaves a stale pointer that is freed a second time. The project lists Gpg4win, GnuPG Desktop, GnuPG VS-Desktop, most mail clients, many XMPP clients and Samba among the software using GPGME, whether the library is shared, a DLL or statically linked (statically linked and bundled copies need rebuilding), and offers a patch for versions that cannot move to 2.3.1; there is no interim workaround. The Hacker News adds that Gpg4win 5.1.2 bundles the fixed library, that the legacy branch has 1.24.4, and that the project reports no attacks. Debian's tracker lists fixed packages for bookworm and trixie (DLA-4924-1, DSA-6646-1). The flaw was found by Johan Carlsson and reported through GitLab on 2026-11-12; disclosure planned for 2026-11-25 was moved up to 2026-11-20.
