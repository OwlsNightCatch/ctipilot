    discovery_trace: "first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item 'Researchers Demonstrate Ghostscript Sandbox-Escape RCE via Crafted File Uploads in Popular Apps', 2026-11-22) -> pivot: THN article, URL https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html -> primary: pwn.ai writeup, URL https://pwn.ai/upload2shell/research.html, and evidence index, URL https://pwn.ai/upload2shell -> corroborating: VulnCheck advisory, URL https://www.vulncheck.com/advisories/ghostscript-before-10.08.0-dsafer-bypass-via-putgstringcopy-forceput-recovery; Debian tracker, URL https://security-tracker.debian.org/tracker/CVE-2026-125396; Ubuntu USN-8949-1, URL https://ubuntu.com/security/notices/USN-8949-1; Artifex release, URL https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/tag/gs10080"
    summary: |
      Artifex fixed CVE-2026-125396 in Ghostscript 10.08.0 on 2026-09-08: a Type 1 font-loader helper (.putgstringcopy in gs_fonts.ps) calls the privileged .forceput operator without checking operand types, which a crafted PostScript or PDF document turns into a use-after-free across save/restore and arbitrary code execution; VulnCheck scores it CVSS 4.0 8.5 with a local, user-interaction vector. pwn.ai's writeup of 2026-11-21, relayed by The Hacker News on 2026-11-22, shows that the sandbox escape is reachable from the network because many applications hand untrusted files to Ghostscript indirectly: pwn.ai reports command execution as the rendering account through an anonymous IPP print job to a shared Debian 13 CUPS queue, through an external sender's attachment thumbnailed when a Roundcube message is viewed (ImageMagick delegate required, no click), through public forms in the WordPress plugins Forminator and Essential Addons for Elementor, and through open-wiki upload paths, and says Google mitigated its production path on 2026-11-10. Libraries that reach Ghostscript from EPS or PostScript content, even when the file is named .png or .pdf, include Pillow (load, crop), Imagick, some libvips builds and the Qt KImageFormats plugin; PHP GD, OpenCV, prebuilt Sharp, Java ImageIO and Go decoders did not. WordPress closed its own Author-level upload path separately (CVE-2026-65640, 7.0.4 on 2026-08-12) and Roundcube restricted attachment image types (CVE-2026-114727). The published proof of concept is partial (a memory primitive that fails on 10.08.0), no exploitation is reported, and these chains are pwn.ai's claims from its own tests, each against a stated configuration. Debian's tracker now lists bookworm-security 10.0.0~dfsg-11+deb12u9 (DLA-4914-1) and trixie 10.05.1~dfsg-1+deb13u3 as fixed, while pwn.ai's 2026-11-12 survey had Debian 12 as vulnerable and Amazon Linux, SUSE Linux Enterprise 12 SP5 and 15 lines, SLES 16 and openSUSE Leap 16 pending; Red Hat family status was not established by pwn.ai and I did not read Red Hat's page.
