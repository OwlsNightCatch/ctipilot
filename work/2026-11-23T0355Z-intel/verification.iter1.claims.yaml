claims:
  - {claim_id: ce283802a2, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Memory corruption in HTTP/2 flow control ... Vulnerable: 1.9.5-1.31.8; Rapid7 table: CVSS 9.2 (Critical); CERT.at: 37.3.0.1/37.0.8.1 fix, R34-R36 no update"}
  - {claim_id: 4f7aaf5498, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "CVE-2026-123633: 37.1.0 bis 37.2.0 sowie 37.0.0 bis 37.0.6.1; NGINX Plus 37.2.0.1 und 37.0.7.1 enthalten bereits einen Fix fuer CVE-2026-123633; NCSC-NL CVSS(v4) 9.2"}
  - {claim_id: b5436d25cc, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Use-after-free during response processing in resolver ... Vulnerable: 0.6.18-1.31.8; NCSC-NL: CVE-2026-123634 CVSS (v4) 9.2; no cited source itemises Plus"}
  - {claim_id: 0ccd2da0b6, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Use-after-free in HTTP/3 ... Vulnerable: 1.25.0-1.31.8; CERT.at CVE-2026-121810: 37.1.0 bis 37.2.0.1 sowie 37.0.0 bis 37.0.7.1; R34 bis R36"}
  - {claim_id: ec5df3ec64, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Use-after-free in mail proxy module ... Vulnerable: 0.5.33-1.31.8; CERT.at: CVE-2026-113425 R33 bis R36, 37.1.0 bis 37.2.0, 37.0.0 bis 37.0.7; NCSC-NL 9.2"}
  - {claim_id: 9aea0db114, verdict: F4, source_url: "https://nginx.org/en/security_advisories.html", passage: "Infinite loop while reading client request body over TLS 1.3 | Severity: major | Vulnerable: 1.13.0-1.31.8. Page states no vector or auth; NCSC-NL (cited) scores it CVSS v4 8.7, entry says n/a (low co"}
  - {claim_id: b4e2aead8e, verdict: F4, source_url: "https://nginx.org/en/security_advisories.html", passage: "SNI bypass when using client certificate validation in stream | medium | Vulnerable: 1.25.5-1.31.8. No vector/auth stated; NCSC-NL v4 6.3 not used (low confidence)"}
  - {claim_id: 9cd8e283db, verdict: F4, source_url: "https://nginx.org/en/security_advisories.html", passage: "Buffer overflow when using alias with try_files | minor | Vulnerable: 0.9.6-1.31.8. No vector/auth stated; NCSC-NL v4 6.9 not used (low confidence)"}
  - {claim_id: 5d490f0a85, verdict: F4, source_url: "https://nginx.org/en/security_advisories.html", passage: "Insufficient validation in stream ssl_preread module | minor | Vulnerable: 1.15.2-1.31.8. type logic-flaw, zero-click, pre-auth not stated; NCSC-NL v4 6.9 (low confidence)"}
  - {claim_id: e441dbd9db, verdict: F4, source_url: "https://nginx.org/en/security_advisories.html", passage: "NULL pointer dereference when using PROXY protocol version 2 | minor | Not vulnerable: 1.31.9+ | Vulnerable: 1.31.4-1.31.8. No vector/auth stated; NCSC-NL v4 6.9 (low confidence)"}
  - {claim_id: babd5a2744, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "nginx.org lists fixed releases 1.31.9+, 1.30.7+ for the flaws; F5 K-articles linked per CVE"}
  - {claim_id: d01c24268e, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-022/", passage: "All five vulnerabilities can lead to unauthenticated code execution with the privileges of the NGINX worker process"}
  - {claim_id: 40b77e2fda, verdict: ok, source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", passage: "A remote, unauthenticated client can exploit this error by cancelling queued response data, then make nginx use an invalid length when copying a later response."}
  - {claim_id: c6e2ace250, verdict: ok, source_url: "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities", passage: "Our testing of CVE-2026-123007 demonstrated code execution on NGINX serving ordinary static files, without a backend application or third-party modules."}
  - {claim_id: cf1fd003a2, verdict: ok, source_url: "https://github.com/sfewer-r7/CVE-2026-123007", passage: "PoC exploit ... against NGINX version 1.31.8 ... likely fail against a vulnerable NGINX server which has multiple concurrent clients; Rapid7: approximately 128 GB of HTTP/2 data"}
  - {claim_id: 1eaad483e1, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "Auf Systemen, auf denen ASLR deaktiviert ist oder ASLR umgangen werden kann, ist laut F5 zudem die Ausfuehrung von beliebigem Code moeglich; Wiz: attackers can use either vulnerability for memory read"}
  - {claim_id: 7ca1b2f6c2, verdict: ok, source_url: "https://advisories.ncsc.nl/2026/ncsc-2026-0506.html", passage: "Het NCSC verwacht dat er op korte termijn proof of concept code beschikbaar komt, waarna exploitatie op grote schaal verwacht wordt; CERT-EU: no exploitation in the wild; NCSC.ch: UNKNOWN, PoC Availab"}
  - {claim_id: a8942d3a07, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Not vulnerable: 1.31.9+, 1.30.7+"}
  - {claim_id: a809d7d960, verdict: ok, source_url: "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", passage: "NGINX Plus 37.3.0.1 bzw. 37.0.8.1; 37.2.0.1 und 37.0.7.1 enthalten bereits einen Fix fuer CVE-2026-123633 ... weiterhin von CVE-2026-123007 und CVE-2026-121810 betroffen; R33 bis R36 keine Updates"}
  - {claim_id: 8ebf218fed, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "nginx.org first-affected 1.9.5/1.19.7/0.6.18/1.25.0/0.5.33; Xint: resolver, request-derived proxy_pass, mirror; SSI may reach the same bug; mail proxy proxy on + auth_http"}
  - {claim_id: 673b9baa5e, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "A backport can fix a vulnerability without changing the version reported by `nginx -v`."}
  - {claim_id: 62589ae8d5, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "A normal nginx worker has no reason to run external programs; CERT-EU: worker exits not a high-fidelity indicator but an indication of exploitation attempts"}
  - {claim_id: d0acd58306, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "`bytes_received` continues to grow very quickly ... The same external IP also creates many short-lived TLS connections"}
  - {claim_id: b68ef3030d, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "no legitimate explanation, such as a large upload; A worker can crash for reasons unrelated to an attack."}
  - {claim_id: 929f2fddc2, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "Note that disabling HTTP/2 addresses only two of the five; fixed upstream group (3.3.2), remove QUIC listeners (3.3.3), bind mail listeners / firewall (3.3.4)"}
  - {claim_id: 629d272dc8, verdict: ok, source_url: "https://xint.io/blog/nginx2root-remote-code-execution", passage: "An empty result cannot rule out an earlier compromise; SCTP zero-day chain, Docker escape; `install sctp /bin/false` under /etc/modprobe.d/ until a kernel patch is available"}
  - {claim_id: c40c77918b, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "nginx.org lists ten 1.31.9/1.30.7 entries; Fortinet FG-IR-26-279 lists CVE-2026-123007,123633,121810,123634,113425,118899,120967,120993,125283,123640"}
  - {claim_id: 2651d3309c, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "118899 major 1.13.0-1.31.8; 120967 medium 1.25.5-1.31.8; 125283 minor 0.9.6-1.31.8; 123640 minor 1.15.2-1.31.8; 120993 minor Not vulnerable: 1.31.9+ Vulnerable: 1.31.4-1.31.8"}
  - {claim_id: 6ee8db7881, verdict: ok, source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-279", passage: "CVE-2026-118899 (high); CVE-2026-120967 (medium); CVE-2026-120993 (medium); CVE-2026-125283 (medium); CVE-2026-123640 (medium)"}
  - {claim_id: b15eb8c31a, verdict: ok, source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-279", passage: "NGINX OSS versions 1.30.7 stable; 1.31.9 mainline are fixing the issues. (nginx.org: CVE-2026-120993 fixed in 1.31.9+ only; advisory-level wording, see F11)"}
  - {claim_id: a1c6bda9be, verdict: ok, source_url: "https://nginx.org/en/security_advisories.html", passage: "Record summary matches the section: ten flaws, five more, severities and mainline-only CVE-2026-120993; fields [cves, body] match git diff; updated_at unchanged"}
  - {claim_id: 5a6c5ed739, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/", passage: "Its GoodCloud platform allows customers to remotely manage supported devices; GL.iNet notice: install security firmware for exact model; cloud fix alone does not remove malware"}
  - {claim_id: f4ce2f4492, verdict: F3, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "Vendor page: 'a vulnerability in its cloud remote management services' ... never names GoodCloud; only BleepingComputer and RemoteToHome name it. Summary attributes 'GoodCloud' to GL.iNet's statement"}
  - {claim_id: cd291f7e40, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "Do not treat [fixed firmware] as a clean-up; Reinstall the firmware with Keep Settings switched off; revoke VPN peers on the server side; evidence archive before any restart"}
  - {claim_id: 9f58090f7d, verdict: F3, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "On November 20, 2026, GL.iNet identified a vulnerability in its cloud remote management services. (no 'GoodCloud' on the page; naming is BleepingComputer's/RemoteToHome's)"}
  - {claim_id: 1d43dcf79d, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/", passage: "GL.iNet has not disclosed how the attackers exploited its cloud platform, how many customers were impacted, or whether information was stolen from compromised devices."}
  - {claim_id: 768970c31e, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/", passage: "code specifically tailored to GL.iNet routers and KVM devices ... persistence through startup scripts and scheduled tasks ... crond -i /tmp/.log ... replacing the legitimate netstat utility ... instal"}
  - {claim_id: 17ad5e6c85, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "passes a value from a cloud message to the shell, as root, without checking it ... not confirmed by GL.iNet; On most routers it ran a single command as root; root remote shell on GL-AXT1800 and GL-MT6"}
  - {claim_id: 4c85243acc, verdict: ok, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "The security firmware update removes the malware identified in this incident without requiring a factory reset. You can keep your existing settings; router minimums 4.7.14 ... 4.11.1"}
  - {claim_id: aa7ef83b55, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "KVMs: RM1, RM1V2, RM10, RM10RC, RM1PE, RM4PE: 1.10.3. RMQ1: 1.8.7."}
  - {claim_id: 69c671d807, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "the clean-up is one short script ... does not examine the settings an upgrade keeps ... start-up entries it does not name survived an upgrade with settings kept ... reinstall with 'Keep Settings' swit"}
  - {claim_id: 9c029031a2, verdict: ok, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "The official quick checks described above may not detect every affected device."}
  - {claim_id: b650713ecf, verdict: ok, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "Do not install firmware for another model. An unlisted model is not necessarily unaffected."}
  - {claim_id: 47dbd5d468, verdict: ok, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "look for the exact text `crond -i /tmp/.log` ... `ps | grep tmp` ... LuCI Status -> Processes"}
  - {claim_id: ebeaca436c, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "GL.iNet's published indicator ... was not running on any router we checked; nc/sh -i; SDWAN_IP_MAPPING gone after reboot; /etc/mp_ip_mapping_info empty, dated 20 November 2026 or later ... Survives a "}
  - {claim_id: 3f99e1ec5a, verdict: ok, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "Take the evidence archive while the device is still running, before any restart; Cleaning or reinstalling the router does not take those back; Reinstall the firmware with 'Keep Settings' switched off"}
  - {claim_id: 2be3cebc41, verdict: ok, source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", passage: "We are still determining the scope ... including whether computers connected to affected KVM devices were impacted; If your KVM is infected, also check the connected computer"}
  - {claim_id: 8d879a02bb, verdict: F5, source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", passage: "Sentence has no inline citation and a stray '{R}' token; 'cloud service switched on' is RemoteToHome's condition for routers ('any such router with GoodCloud switched on'); GL.iNet states no such cond"}
  - {claim_id: ebe04e2c45, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "Anonymous IPP Print-Job to shared CUPS queue; Roundcube message view; Forminator and Essential Addons public forms; Fixed in Ghostscript 10.08.0 on 8 September 2026"}
  - {claim_id: 8c3acaa0ca, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "fixed on September 8, no reports of attacks; scored 8.5; one published proof-of-concept file shows only the core memory trick; Debian/Ubuntu fixes per tracker and pwn.ai"}
  - {claim_id: 31e13a5c5c, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-125396", passage: "Fixed Version bookworm 10.0.0~dfsg-11+deb12u9; trixie 10.05.1~dfsg-1+deb13u2; pwn.ai USN-8949-1 lists seven Ubuntu releases; THN: host update does not reach bundled copy"}
  - {claim_id: c20c3ed4ed, verdict: ok, source_url: "https://www.vulncheck.com/advisories/ghostscript-before-10.08.0-dsafer-bypass-via-putgstringcopy-forceput-recovery", passage: "CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:P ... 8.5; CVE JSON: affected lessThan 10.08.0; Debian tracker fixed versions deb12u9, deb13u2"}
  - {claim_id: fa9d21a1af, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "Artifex ... fixed the flaw in version 10.08.0 on September 8"}
  - {claim_id: 621ea16303, verdict: ok, source_url: "https://www.vulncheck.com/advisories/ghostscript-before-10.08.0-dsafer-bypass-via-putgstringcopy-forceput-recovery", passage: "calls the privileged .forceput operator without checking operand types ... recover .forceput via a custom error handler, and cause a use-after-free across save/restore; CVSS 8.5, AV:L"}
  - {claim_id: 08e04245dc, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "Pillow, libvips, ImageMagick delegate, CUPS gstopdf; THN: ImageMagick, Pillow, libvips, or a Qt plugin ... even when the file is named .png, .jpg, or .pdf"}
  - {claim_id: aabc036300, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "anonymous IPP Print-Job ... uid=7(lp); Roundcube 1.7.2 ... permissive ImageMagick delegate required ... uid=33(www-data); Forminator public PDF field Media Library; Essential Addons public registratio"}
  - {claim_id: 8cc184cc45, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "WordPress had already closed its own upload path in version 7.0.4 on August 12, under a separate identifier, CVE-2026-65640"}
  - {claim_id: 929d3d0f98, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "no reports of it being used in attacks; shows only the core memory trick ... on the patched 10.08.0 build it fails before that point"}
  - {claim_id: 81985af194, verdict: ok, source_url: "https://security-tracker.debian.org/tracker/CVE-2026-125396", passage: "bookworm (security) 10.0.0~dfsg-11+deb12u9 fixed; trixie 10.05.1~dfsg-1+deb13u2; (unstable) 10.08.0~dfsg-1"}
  - {claim_id: 8fc0094271, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "USN-8949-1, published on 21 October 2026 ... fixed Ghostscript packages for seven releases; As of 12 November ... Amazon Linux pending fix, several SUSE branches affected or in progress"}
  - {claim_id: 123a8243fe, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "Updating the host operating system does not update a separate copy of Ghostscript bundled inside a container image or an application"}
  - {claim_id: c35bb9da83, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "shared network queue that accepted jobs without authentication; Roundcube thumbnail; public upload forms; Older version numbers can include a backported fix"}
  - {claim_id: 88777315cf, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "Older version numbers can include a backported fix; a published fixed version does not establish that every application or container has adopted it"}
  - {claim_id: dc8410e3af, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "(%pipe%printf POST_SAFER_UAF_PIPE_RCE > /var/tmp/GS_CUPS_PIPE_RCE) ... command ran as uid=7(lp)"}
  - {claim_id: d5e504472d, verdict: ok, source_url: "https://pwn.ai/upload2shell/research.html", passage: "Our attachment was declared as image/jpeg ... contents were PostScript; The filename ended in .pdf, but the bytes were PostScript; anonymous IPP Print-Job"}
  - {claim_id: 787c9d9ce2, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "in one test an AppArmor profile stopped the compromised interpreter from starting a shell"}
  - {claim_id: 0408375c4f, verdict: ok, source_url: "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html", passage: "requiring authentication on print queues and by limiting which file types an image processor accepts; bundled copies not reached by host update"}
  - {claim_id: 0210f09dc6, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "abusing the legitimate MeshAgent utility to drop two brand-new backdoors; C2 behind Microsoft SharePoint, GitHub, and Ably"}
  - {claim_id: ee0d85bdc7, verdict: F4, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "'In early 2026, we identified a new, active intrusion campaign' (not 'active since'); infrastructure prepared 'since at least the end of 2024'; Sophos victims Aug 2025. Also 'legitimate signed program"}
  - {claim_id: 6ee2c58d14, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "We found victims in Asia and Africa, primarily within the government sector; identified in early 2026; abusing the legitimate MeshAgent utility"}
  - {claim_id: e627d61216, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "launched inside a Taiwanese organization ... The exact entry point ... is unknown, but evidence points to the reuse of a prior infection already present on the network."}
  - {claim_id: 57c02d7d6a, verdict: F4, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "'A legitimate binary used for DLL sideloading' ... 'A malicious loader DLL' ... 'An encrypted file'; no source says the binary is signed. zoomit.exe 'started as a Windows service'"}
  - {claim_id: 1c073469f6, verdict: ok, source_url: "https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells", passage: "CTU analysis of incidents between August 2025 and August 2026 revealed victims in the Philippines, Taiwan, Afghanistan, Namibia, and likely also the Republic of Korea"}
  - {claim_id: "3261309412", verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "public Havo repository (commands, plug-ins) and private Trix repository (results); POST /repos/.../Trix/issues; 'bug' label; Authorization: token %github_pat_token%"}
  - {claim_id: d53e5fee19, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-graphdoor/122005/", passage: "grant_type=client_credentials ... authenticates the malicious application - not a user; creates main.%victim-unique-code%.js.map, masquerading as a JavaScript source map file, in a SharePoint document"}
  - {claim_id: e2408a4112, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "Mimikatz (sekurlsa::logonpasswords); CookieKatz dumps cookies from Chrome, Edge; plug-ins scr.ts, pr.ts, kl.ts; modified Erfrp client and Ably proxy plug-ins"}
  - {claim_id: 0a52499e8d, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-graphdoor/122005/", passage: "we lack sufficient information to definitively attribute ... overlaps with ... FamousSparrow and CopperTurtle ... shared the same staging directories as the GitDoor backdoor"}
  - {claim_id: 2b62e961cb, verdict: F4, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "Kaspersky: 'legitimate binary' (start.exe in system32, config.ini beside it); 'signed' not stated; 'CEF helper' binary (Jcef_helper.exe) is named only in Sophos's table, libcef.dll only as a loader"}
  - {claim_id: e941d5f59c, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-graphdoor/122005/", passage: "login.microsoftonline.com client_credentials token then PUT to graph.microsoft.com sites/buildersemp.sharepoint[.]com; GitHub API issue + label + PUT contents with PAT"}
  - {claim_id: e9cac55f88, verdict: F4, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "'MeshCentral is a web-based tool that provides remote-desktop control ...'; dropped items: legitimate binary, loader DLL, encrypted file; 'signed' not stated by Kaspersky"}
  - {claim_id: d460003e0d, verdict: F3, source_url: "https://securelist.com/operation-shadowcloud-graphdoor/122005/", passage: "Part 2 (cited) does not say the entry point is unknown; that sentence is in part 1: 'The exact entry point that let the attackers install the agent is unknown'"}
  - {claim_id: 24de50cd66, verdict: ok, source_url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", passage: "Derived exposure statement; consistent with Windows loaders and HTTPS C2 to api.github.com, login.microsoftonline.com, graph.microsoft.com, rest.ably.io"}
