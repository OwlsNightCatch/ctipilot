- code: F11
  category: editorial-advisory
  section: glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
  item: "indicator strings in Detection"
  url_or_quote: "`crond -i /tmp/.log`, `ps | grep tmp`, chain 'SDWAN_IP_MAPPING', file `/etc/mp_ip_mapping_info`"
  summary: "The house rule is zero IOCs (no mutex or file-name indicators, no rule code). These are vendor- and researcher-published check strings and the actionable core of the entry, so the main agent may keep them, but the file path and chain name are file-name/rule indicators; consider describing them behaviorally (an empty state file dated on or after the incident on a router not using the SD-WAN feature)."
