- code: F8
  category: needs-more-research
  section: glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
  item: "separate older backdoor and months-long compromise omitted"
  url_or_quote: "RemoteToHome: 'A separate, older backdoor is installed and running on 49 routers we manage ... with file dates from September 2025 to May 2026 ... adds itself to the list of files kept across upgrades'; BleepingComputer: 'Some of the malicious files recovered from GL.iNet devices had timestamps dating to December 2025'"
  summary: "(low confidence) The entry frames the compromise as the 2026-11-20 event and says only that 'start-up entries it does not name survived' an upgrade. The primaries say a separate older persistent backdoor (not detected by GL.iNet's check, with its own keep-list line, only partly cleaned by the fixed firmware) predates the incident by months, and that some devices may have been compromised for months. A responder deciding 'reinstall with settings discarded' needs to know what persists; add one sentence on the older backdoor (behavioral, no file names) and that infection may predate 2026-11-20."
