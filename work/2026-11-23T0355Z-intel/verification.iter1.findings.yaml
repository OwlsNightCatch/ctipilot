- code: F3
  category: claim-not-supported
  section: glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
  item: "GL.iNet GoodCloud: an exploited cloud remote-management flaw ..."
  url_or_quote: "GL.iNet says it identified on 2026-11-20 a vulnerability in its GoodCloud cloud remote-management service ... ([GL.iNet, 2026-11-20](https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20)); summary: \"GL.iNet says an unauthorized party exploited a vulnerability in its GoodCloud remote-management service\""
  summary: "The GL.iNet notice says 'a vulnerability in its cloud remote management services' and never names GoodCloud (raw HTML: only an image filename enterprise_goodcloud.jpg). BleepingComputer ('Its GoodCloud platform allows customers to remotely manage...') and RemoteToHome name GoodCloud, and RemoteToHome says GL.iNet has not confirmed the GoodCloud client as the entry point. Body clause 1 and the summary attribute the GoodCloud name to GL.iNet's own statement; say 'cloud remote management services' for the vendor and attribute GoodCloud to BleepingComputer/RemoteToHome. Claim ids 9f58090f7d, f4ce2f4492."
