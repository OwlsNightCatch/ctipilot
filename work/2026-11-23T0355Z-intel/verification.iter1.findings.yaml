- code: F4
  category: hallucinated-fact
  section: nginx-nginx2root-five-unauth-memory-corruption-flaws
  item: "cves[] CVE-2026-118899, -120967, -125283, -123640, -120993 (improvement 2026-11-23T04:35:59Z)"
  url_or_quote: "vector: zero-click / auth: pre-auth on all five; type: logic-flaw for CVE-2026-123640"
  summary: "(low confidence) nginx.org lists only a title, severity and vulnerable range for each, and Fortinet only a severity and range; neither states attack vector, authentication requirement or flaw class. Zero-click/pre-auth is asserted without a source for flaws that are configuration- or position-dependent (alias+try_files overflow, PROXY protocol v2 NULL dereference from a trusted proxy, ssl_preread validation). Either drop vector/auth or state what the sources say. Claim ids 9aea0db114, b4e2aead8e, 9cd8e283db, 5d490f0a85, e441dbd9db."
- code: F5
  category: missing-citation
  section: glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
  item: "Exposure line"
  url_or_quote: "**Exposure:** any GL.iNet router or Comet KVM with the cloud service switched on ({R})."
  summary: "The sentence carries a stray template token '({R})' in place of a citation and no inline link. The scoping condition 'with the cloud service switched on' is RemoteToHome's ('any such router with GoodCloud switched on'; 'If your router or KVM had GL.iNet's cloud service switched on, check it now'); GL.iNet's notice states no such condition and says to install the firmware for the exact model even when checks find nothing. Cite RemoteToHome, drop the token, and say the condition is RemoteToHome's reading. Claim id 8d879a02bb."
