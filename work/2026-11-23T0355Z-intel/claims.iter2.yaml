    kind: cited
    text: "pwn.ai ran a command as the rendering account through an anonymous IPP print job to a shared CUPS queue on Debian 13 (as the `lp` user), through an emailed attachment declared as a JPEG but holding PostScript that a Roundcube 1.7.2 user only had to view, with a permissive ImageMagick delegate required (as `www-data`), and through public WordPress upload forms in Forminator, a public PDF field storing to the Media Library, and in Essential Addons for Elementor, a public registration widget with an upload field ("
    urls: ["https://pwn.ai/upload2shell/research.html"]
