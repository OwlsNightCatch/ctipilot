  - claim_id: babd5a2744
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "F5 and the nginx project published the nginx2root fixes ("
    urls: ["https://nginx.org/en/security_advisories.html"]
  - claim_id: d01c24268e
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "); CERT-EU counts five vulnerabilities, all able to lead to unauthenticated code execution with the privileges of the NGINX worker process ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-022/"]
  - claim_id: 40b77e2fda
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-123007 is an HTTP/2 flow-control overflow: cancelling queued response data makes nginx use an invalid length when copying a later response ("
    urls: ["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed"]
  - claim_id: c6e2ace250
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "), and Wiz demonstrated code execution on nginx serving ordinary static files ("
    urls: ["https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities"]
  - claim_id: cf1fd003a2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Rapid7 published a working proof of concept for CVE-2026-123007 against nginx 1.31.8; the exploit needs about 128 GB of HTTP/2 traffic and likely fails with concurrent clients ("
    urls: ["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", "https://github.com/sfewer-r7/CVE-2026-123007"]
  - claim_id: 1eaad483e1
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Rapid7 says the exploit runs code with the nginx worker process's permissions; F5, as CERT.at relays it, frames the base effect as worker crashes, with code execution possible where ASLR is disabled or can be bypassed, which Wiz says attackers can do by reading memory first (translated from German) ("
    urls: ["https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed", "https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar", "https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities"]
  - claim_id: 7ca1b2f6c2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "CERT-EU reports no exploitation in the wild, NCSC.ch rates exploitation unknown with a proof of concept available, and NCSC-NL expects large-scale exploitation once proof-of-concept code is public (translated from Dutch) ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-022/", "https://security-hub.ncsc.admin.ch/#/posts/13203", "https://advisories.ncsc.nl/2026/ncsc-2026-0506.html"]
  - claim_id: a8942d3a07
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "The fixes are in nginx 1.31.9 and 1.30.7 ("
    urls: ["https://nginx.org/en/security_advisories.html"]
  - claim_id: a809d7d960
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "CERT.at lists NGINX Plus 37.3.0.1 and 37.0.8.1 as fixing four of the five (CVE-2026-123007, CVE-2026-121810, CVE-2026-123633 and CVE-2026-113425); it also says 37.2.0.1 and 37.0.7.1 already carry the fix for CVE-2026-123633 but stay affected by CVE-2026-123007 and CVE-2026-121810, and NGINX Plus R33 to R36 have no update (translated from German) ("
    urls: ["https://www.cert.at/de/warnungen/2026/11/kritische-sicherheitslucken-in-nginx-plus-und-nginx-open-source-updates-verfugbar"]
  - claim_id: 8ebf218fed
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Exposure:** an nginx build from the first affected release of each flaw (1.9.5, 1.19.7, 0.6.18, 1.25.0 and 0.5.33) up to 1.31.8 whose configuration uses the feature: an HTTP/2 or HTTP/3 listener, the resolver with variable proxy_pass destinations plus mirror or SSI, or the mail proxy with auth_http ("
    urls: ["https://nginx.org/en/security_advisories.html", "https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 673b9baa5e
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "A distribution backport can fix a flaw without changing the version nginx -v reports ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 62589ae8d5
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Detection:** process-creation or audit telemetry for any program started by the worker's user, since a normal nginx worker runs no external programs and that is the clearest sign of success; worker exits and core dumps in the error log mark attempts, not successes ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution", "https://cert.europa.eu/publications/security-advisories/2026-022/"]
  - claim_id: d0acd58306
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "Network flow data showing a long-lived TLS connection with fast-growing received volume and little sent data, and many short connections from the same address, hints at CVE-2026-123007 ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: b68ef3030d
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Triage:** a large upload is a legitimate cause of an inbound-heavy connection and workers crash for unrelated reasons, so a program started by the worker is the discriminator, not the traffic shape alone ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 929f2fddc2
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update and restart nginx, because a configuration reload does not replace the running executable; disabling HTTP/2 on exposed listeners blocks only the two HTTP/2 flaws, and Xint gives interim measures for the others: a fixed upstream group in place of request-time DNS lookups for CVE-2026-123634, no QUIC listeners for CVE-2026-121810 and bound or firewalled mail listeners for CVE-2026-113425 ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: 629d272dc8
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "body"
    kind: cited
    text: "An empty execution-audit result after the update cannot rule out an earlier compromise, and Xint chained CVE-2026-123007 with a separate Linux kernel SCTP flaw, unpatched when it published, to reach root on the host and escape a Docker container; hosts that do not use SCTP can block the module from loading ("
    urls: ["https://xint.io/blog/nginx2root-remote-code-execution"]
  - claim_id: c40c77918b
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-23T04:35:59Z"
    kind: cited
    text: "nginx.org lists ten flaws fixed in nginx 1.31.9 and 1.30.7, five more than the five above, and Fortinet's FG-IR-26-279 lists the same ten ("
    urls: ["https://nginx.org/en/security_advisories.html", "https://fortiguard.fortinet.com/psirt/FG-IR-26-279"]
  - claim_id: 2651d3309c
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-23T04:35:59Z"
    kind: cited
    text: "The additional five are CVE-2026-118899, an infinite loop while reading a client request body over TLS 1.3 (1.13.0 to 1.31.8, rated major); CVE-2026-120967, an SNI bypass when using client certificate validation in the stream module (1.25.5 to 1.31.8, medium); CVE-2026-125283, a buffer overflow when using alias with try_files (0.9.6 to 1.31.8, minor); CVE-2026-123640, insufficient validation in the stream ssl_preread module (1.15.2 to 1.31.8, minor); and CVE-2026-120993, a NULL pointer dereference when using PROXY protocol version 2 that affects only the mainline 1.31.4 to 1.31.8 and is fixed in 1.31.9 alone ("
    urls: ["https://nginx.org/en/security_advisories.html"]
  - claim_id: 908870bd26
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-23T04:35:59Z"
    kind: cited
    text: "NCSC-NL scores them CVSS 4.0 8.7 (CVE-2026-118899), 6.3 (CVE-2026-120967) and 6.9 (CVE-2026-120993, CVE-2026-123640 and CVE-2026-125283) ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0506.html"]
  - claim_id: 4847bec454
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-23T04:35:59Z"
    kind: cited
    text: "), and Fortinet rates CVE-2026-118899 high and the other four medium ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-279"]
  - claim_id: 8994003859
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "section 2026-11-23T04:35:59Z"
    kind: cited
    text: "Updating to 1.31.9 or 1.30.7 covers all ten ("
    urls: ["https://nginx.org/en/security_advisories.html"]
  - claim_id: a1c6bda9be
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "record 2026-11-23T04:35:59Z"
    kind: record-summary
    text: "nginx.org and Fortinet list ten flaws fixed in nginx 1.31.9 and 1.30.7, five more than the entry's five: a TLS 1.3 request-body infinite loop rated major, an SNI bypass of client certificate validation in the stream module, a stream ssl_preread validation flaw, an alias and try_files buffer overflow, and a PROXY protocol version 2 NULL dereference in the 1.31 mainline; the fixed releases and the update action are unchanged."
  - claim_id: 5a6c5ed739
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "headline"
    kind: frontmatter
    text: "GL.iNet GoodCloud exploited: the cloud fix leaves routers and KVMs infected; install the model's security firmware"
  - claim_id: 64efd228b5
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "summary"
    kind: frontmatter
    text: "GL.iNet says an unauthorized party exploited a vulnerability in its cloud remote-management services (GoodCloud, per BleepingComputer), identified on 2026-11-20, to install malicious software on some GL.iNet routers and KVM devices; the cloud fix stops new infections but, in the vendor's words, does not remove malware from devices already infected. The vendor lists security firmware per model that it says removes the identified malware without a factory reset, while RemoteToHome, which manages many of these routers, reports the clean-up is partial and advises a reinstall with settings discarded for any device that shows a sign. GL.iNet has not said how the flaw worked or how many devices are affected, and a compromised KVM may extend to the computer it controls."
  - claim_id: 60194303a2
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory every GL.iNet router and Comet KVM your organisation or its remote and branch users run and install the security firmware for its exact model, because GL.iNet confirms exploitation and its cloud fix does not clean devices that are already infected."
  - claim_id: 6c9f7fe38c
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "body"
    kind: cited
    text: "GL.iNet says it identified on 2026-11-20 a vulnerability in its cloud remote-management services that an unauthorized party exploited to access some GL.iNet routers and KVM devices and install malicious software; the cloud-side fix blocks new infections but does not remove malware from devices already infected ("
    urls: ["https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20"]
  - claim_id: b878612f6c
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "body"
    kind: cited
    text: "BleepingComputer names the service as GoodCloud and reports that GL.iNet has not said how the flaw worked or how many customers are affected ("
    urls: ["https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/"]
  - claim_id: a5c4b452f6
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "body"
    kind: cited
    text: "BleepingComputer's analysis of the installer script found that it persists through startup scripts and scheduled tasks and replaces the netstat utility with a script that hides the attacker's server from connection listings ("
    urls: ["https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/"]
  - claim_id: 4b5c9b38d9
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "body"
    kind: cited
    text: "RemoteToHome Consulting, which manages many of these routers, reads the entry point as the router's GoodCloud client passing a value from a cloud message to the shell as root without checking it, and says GL.iNet has not confirmed that reading; on GL-AXT1800 and GL-MT6000 units it opened a root reverse shell ("
    urls: ["https://github.com/RemoteToHome-io/gl-security-incident-2026"]
  - claim_id: 27737d19ba
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "body"
    kind: cited
    text: "It also finds an older persistent backdoor that GL.iNet's check does not detect and that may not be tied to the November attacks, and BleepingComputer reports malicious files with December 2025 timestamps, so infection may predate 2026-11-20 ("
    urls: ["https://github.com/RemoteToHome-io/gl-security-incident-2026", "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/"]
