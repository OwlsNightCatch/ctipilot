    text: "{\"id\": \"CVE-2026-125396\", \"cvss\": \"8.5 (CVSS 4.0)\", \"status\": [\"patch-available\"], \"affected\": \"Ghostscript before 10.08.0\", \"fixed\": \"10.08.0 (2026-09-08); Debian 12 10.0.0~dfsg-11+deb12u9, Debian 13 10.05.1~dfsg-1+deb13u2; Ubuntu per USN-8949-1\", \"auth\": \"pre-auth\", \"vector\": \"local\"}"
