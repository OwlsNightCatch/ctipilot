    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "body"
    kind: cited
    text: "The CVE record says the `.putgstringcopy` procedure in the font loader calls the privileged `.forceput` operator without checking operand types, so a crafted PostScript or PDF document triggers a type error, recovers `.forceput` through a custom error handler and causes a use-after-free across save and restore that executes arbitrary code; VulnCheck scores it CVSS 4.0 8.5 with a local attack vector ("
    urls: ["https://www.vulncheck.com/advisories/ghostscript-before-10.08.0-dsafer-bypass-via-putgstringcopy-forceput-recovery"]
