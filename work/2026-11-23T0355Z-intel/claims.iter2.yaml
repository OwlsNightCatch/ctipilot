    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "body"
    kind: cited
    text: "). pwn.ai's writeup of 2026-11-21 shows the flaw is reachable from the network because applications pass untrusted files to Ghostscript indirectly, through ImageMagick, Pillow, libvips or a print filter, even when the file is named like an image or a PDF ("
    urls: ["https://pwn.ai/upload2shell/research.html", "https://thehackernews.com/2026/11/researchers-demonstrate-ghostscript.html"]
