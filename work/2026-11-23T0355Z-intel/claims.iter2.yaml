    text: "**Exposure:** Ghostscript before 10.08.0, or a distribution package without the backport, on a host that renders untrusted files: a mail server that thumbnails attachments, a CUPS server with a shared queue that takes jobs without credentials, or a web server with public upload forms that build image previews ("
