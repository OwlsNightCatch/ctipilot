    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "GraphDoor requests a token for an attacker-registered application with the client-credentials grant from Microsoft's sign-in endpoint, then writes encrypted data to files named like JavaScript source maps in a SharePoint document library through Microsoft Graph ("
    urls: ["https://securelist.com/operation-shadowcloud-graphdoor/122005/"]
  - claim_id: e2408a4112
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Both download plug-ins on demand and run shellcode in memory, among it Mimikatz and a browser-cookie stealer, with plug-ins for keylogging, screen capture and proxying through a modified Erfrp client or Ably ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/", "https://securelist.com/operation-shadowcloud-graphdoor/122005/"]
  - claim_id: 0a52499e8d
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Kaspersky says it lacks sufficient information to attribute the activity and reports overlaps with the Chinese-speaking groups FamousSparrow and CopperTurtle, which on several victim systems shared staging directories with GitDoor ("
    urls: ["https://securelist.com/operation-shadowcloud-graphdoor/122005/"]
  - claim_id: c958b6bd91
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "**Detection:** in endpoint inventory and process telemetry, MeshCentral agent processes and services that IT did not deploy, and a legitimate program (a Sandboxie start binary, an OpenJDK launcher, a Python host, ZoomIt) loading a DLL from the folder where an encrypted config.ini sits, as in the first instance Kaspersky shows in the Windows system directory ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: e941d5f59c
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "In network and identity telemetry, a non-browser process requesting an app-only token from Microsoft's sign-in endpoint and then writing files through Microsoft Graph to a SharePoint site outside your tenant, and a process other than a git client or CI runner calling the GitHub API to open issues, label them and write repository contents with a personal access token ("
    urls: ["https://securelist.com/operation-shadowcloud-graphdoor/122005/", "https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: 10a72396a7
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "**Triage:** MeshCentral is legitimate remote-management software, so the agent alone is not the signal; the signal is an agent no administrator deployed that drops a legitimate binary, a DLL and an encrypted config.ini side by side ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: d460003e0d
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** hunt now for MeshCentral agents nobody deployed and for that binary, DLL and config.ini triad, and baseline which processes on servers and workstations legitimately call GitHub, Microsoft Graph and Ably, because both backdoors hide their command channel in that traffic and Kaspersky found the entry point unknown ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: 24de50cd66
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: derived
    text: "**Exposure:** Windows servers and workstations in networks that let non-browser processes reach GitHub, Microsoft's sign-in and Graph endpoints and Ably over HTTPS, and where a MeshCentral agent is not a tool the organisation deploys."
