    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "headline"
    kind: frontmatter
    text: "Ghostscript CVE-2026-125396: print jobs, Roundcube attachments and upload forms reach the sandbox escape; update"
  - claim_id: 8c3acaa0ca
    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "summary"
    kind: frontmatter
    text: "Artifex fixed CVE-2026-125396 in Ghostscript 10.08.0 on 2026-09-08: a crafted PostScript or PDF document turns a use-after-free in the font loader into code execution outside the -dSAFER sandbox, scored CVSS 4.0 8.5 with a local vector. pwn.ai's writeup of 2026-11-21 shows that applications hand untrusted files to Ghostscript indirectly, and it reaches command execution from an anonymous print job to a shared CUPS queue, an emailed attachment viewed in Roundcube and public WordPress upload forms; no source reports exploitation, and only a partial proof of concept is public. Debian and Ubuntu ship fixed packages, and a host update does not reach a copy of Ghostscript bundled in a container image or application."
  - claim_id: 31e13a5c5c
    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "actions[0]"
    kind: frontmatter
    text: "Update Ghostscript to 10.08.0 or a distribution build that carries the CVE-2026-125396 fix (Debian 12 10.0.0~dfsg-11+deb12u9, Debian 13 10.05.1~dfsg-1+deb13u2, Ubuntu per USN-8949-1) on every Roundcube mail server, CUPS print server and web server with public upload forms, and rebuild the container images that bundle their own copy, because pwn.ai reached the sandbox escape from an anonymous print job, a viewed email attachment and public upload forms, and a host package update does not reach a bundled copy."
  - claim_id: c20c3ed4ed
    entry: 2026-11-23/ghostscript-cve-2026-125396-upload2shell-sandbox-escape
    surface: "cves[CVE-2026-125396]"
