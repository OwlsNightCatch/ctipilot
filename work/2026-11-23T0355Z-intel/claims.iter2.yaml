    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "headline"
    kind: frontmatter
    text: "Kaspersky: ShadowCloud's GitDoor and GraphDoor hide C2 in GitHub and Microsoft Graph, planted via a MeshCentral agent"
  - claim_id: 35e14dd8b8
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky GReAT describes Operation ShadowCloud, an intrusion set identified in early 2026 that abuses the legitimate MeshCentral agent to drop two new backdoors, GitDoor and GraphDoor, with victims in Asia and Africa primarily in the government sector; the entry point is unknown. The operators sideload a loader DLL into a legitimate program beside an encrypted config.ini, and the backdoors take commands through the GitHub API (GitDoor) or Microsoft Graph and SharePoint (GraphDoor), with Ably as a further channel. Kaspersky does not attribute the activity and reports overlaps with FamousSparrow and CopperTurtle; Sophos tracks a fragment as BRONZE SANDCASTLE."
  - claim_id: 6ee2c58d14
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Kaspersky GReAT describes Operation ShadowCloud, an intrusion set identified in early 2026 that abuses the legitimate MeshAgent utility to drop two new backdoors, with victims in Asia and Africa primarily in the government sector ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: e627d61216
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "The entry point is unknown: the first observed step is a MeshCentral agent launched inside a Taiwanese organisation, with evidence pointing to reuse of a prior infection on the network ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: 6293b6664b
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Through the agent the operators drop a legitimate binary, a malicious loader DLL and an encrypted payload file named config.ini, so the legitimate program loads the loader when it starts; hosts include a Sandboxie launcher, an OpenJDK launcher, a Python application and Sysinternals ZoomIt started as a service ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: 1c073469f6
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Sophos, which tracks the Sandboxie sideloading as BRONZE SANDCASTLE, saw victims between August 2025 and August 2026 in the Philippines, Taiwan, Afghanistan, Namibia and likely the Republic of Korea ("
    urls: ["https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells"]
  - claim_id: 3261309412
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "GitDoor uses GitHub as its command channel: it opens and labels an issue through the GitHub API, writes victim data to a private repository and reads commands and plug-ins from a public one, authenticating with a personal access token ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
