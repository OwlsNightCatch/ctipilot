  - claim_id: 64efd228b5
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "summary"
    kind: frontmatter
    text: "GL.iNet says an unauthorized party exploited a vulnerability in its cloud remote-management services (GoodCloud, per BleepingComputer), identified on 2026-11-20, to install malicious software on some GL.iNet routers and KVM devices; the cloud fix stops new infections but, in the vendor's words, does not remove malware from devices already infected. The vendor lists security firmware per model that it says removes the identified malware without a factory reset, while RemoteToHome, which manages many of these routers, reports the clean-up is partial and advises a reinstall with settings discarded for any device that shows a sign. GL.iNet has not said how the flaw worked or how many devices are affected, and a compromised KVM may extend to the computer it controls."
  - claim_id: 60194303a2
    entry: 2026-11-23/glinet-goodcloud-exploited-routers-kvm-malware-survives-fix
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory every GL.iNet router and Comet KVM your organisation or its remote and branch users run and install the security firmware for its exact model, because GL.iNet confirms exploitation and its cloud fix does not clean devices that are already infected."
