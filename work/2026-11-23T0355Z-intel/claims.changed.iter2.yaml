  - claim_id: 35e14dd8b8
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky GReAT describes Operation ShadowCloud, an intrusion set identified in early 2026 that abuses the legitimate MeshCentral agent to drop two new backdoors, GitDoor and GraphDoor, with victims in Asia and Africa primarily in the government sector; the entry point is unknown. The operators sideload a loader DLL into a legitimate program beside an encrypted config.ini, and the backdoors take commands through the GitHub API (GitDoor) or Microsoft Graph and SharePoint (GraphDoor), with Ably as a further channel. Kaspersky does not attribute the activity and reports overlaps with FamousSparrow and CopperTurtle; Sophos tracks a fragment as BRONZE SANDCASTLE."
  - claim_id: 6293b6664b
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "Through the agent the operators drop a legitimate binary, a malicious loader DLL and an encrypted payload file named config.ini, so the legitimate program loads the loader when it starts; hosts include a Sandboxie launcher, an OpenJDK launcher, a Python application and Sysinternals ZoomIt started as a service ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: c958b6bd91
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "**Detection:** in endpoint inventory and process telemetry, MeshCentral agent processes and services that IT did not deploy, and a legitimate program (a Sandboxie start binary, an OpenJDK launcher, a Python host, ZoomIt) loading a DLL from the folder where an encrypted config.ini sits, as in the first instance Kaspersky shows in the Windows system directory ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
  - claim_id: 10a72396a7
    entry: 2026-11-23/operation-shadowcloud-gitdoor-graphdoor-meshagent-gov-c2
    surface: "body"
    kind: cited
    text: "**Triage:** MeshCentral is legitimate remote-management software, so the agent alone is not the signal; the signal is an agent no administrator deployed that drops a legitimate binary, a DLL and an encrypted config.ini side by side ("
    urls: ["https://securelist.com/operation-shadowcloud-gitdoor/122004/"]
