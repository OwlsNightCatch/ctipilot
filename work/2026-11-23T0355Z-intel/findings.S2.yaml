  - title: "GL.iNet confirms an exploited flaw in its cloud remote-management services: an unauthorised party installed malware on some GL.iNet routers and KVM devices; cloud fix does not clean infected devices"
    sources:
      - { url: "https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20", publisher: "GL.iNet", date: "2026-11-20", role: "primary" }
      - { url: "https://www.heise.de/news/GL-iNet-Schwachstelle-entdeckt-Patch-verfuegbar-11533722.html", publisher: "heise online", date: "2026-11-22", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item GL.iNet: Schwachstelle entdeckt, Patch verfuegbar, 2026-11-22T10:02Z) -> article read with extract, URL https://www.heise.de/news/GL-iNet-Schwachstelle-entdeckt-Patch-verfuegbar-11533722.html -> primary: GL.iNet security notice, URL https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20 (the link heise gives; WebSearch found no other independent report)"
    summary: |
      GL.iNet says it identified on 2026-11-20 a vulnerability in its cloud remote-management services and that an unauthorised party exploited it to access some GL.iNet routers and KVM devices and install malicious software; heise (2026-11-22) relays the notice. The vendor fixed the cloud side and blocked the access path, so devices cannot be newly infected that way, but the fix does not remove malware from devices already infected; stable security firmware per model line removes it without a factory reset (vendor wording), for example 4.11.1 or later for GL-MT3000, GL-MT6000 and GL-MG1300, 4.10.2 or later for GL-BE3600 and GL-BE9300, 4.8.4 or later for GL-AX1800, GL-AXT1800, GL-X3000 and GL-XE3000; the vendor warns an unlisted model is not necessarily unaffected and publishes a quick check on the device's process list for a cron daemon instance started from a hidden file under /tmp. For infected KVMs the vendor also advises checking the attached computer (unfamiliar programs, browser extensions, accounts, startup items, scheduled tasks) because it is still determining whether attached computers were affected. The vendor adds that additional indicators found in its ongoing investigation mean the quick checks may miss some infections, and that it will notify identified customers by e-mail to the cloud-account address. No CVE id, actor attribution, device count or sector is given. The exposed surface is the vendor-operated management plane, not an inbound port on the device; the vendor does not say which setting or enrolment made a device reachable. Swiss relevance is not stated by either source.
    region_nexus: "global; no Swiss nexus stated"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products: ["GL.iNet routers (GL-MT3000, GL-MT6000, GL-MG1300, GL-E5800, GL-BE3600, GL-BE9300, GL-BE14000, GL-BE6500, GL-MT3600BE, GL-MT5000, GL-BE10000, GL-AX1800, GL-AXT1800, GL-SFT1200, GL-X3000, GL-XE3000, GL-MT2500, GL-X2000)", "GL.iNet KVM (Comet) devices", "GL.iNet cloud remote management services"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: { reliability: A, credibility: 2 }
    novelty: new
    evidence:
      - quote: "On November 20, 2026, GL.iNet identified a vulnerability in its cloud remote management services. An unauthorized party exploited the vulnerability to access and install malicious software on some GL.iNet routers and KVM devices."
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "The cloud-side fix alone does not remove malware from devices that were already infected"
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "We are still determining the scope of the incident, including whether computers connected to affected KVM devices were impacted."
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "An unlisted model is not necessarily unaffected."
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/de-de/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "A third party had already exploited this flaw to access some GL.iNet routers and KVM devices and install malware on them (translated from German)"
        original: "Ein unbefugter Dritter hat diese Schwachstelle vorher aber bereits ausgenutzt, um auf einige GL.iNet-Router und KVM-Geräte zuzugreifen und Schadsoftware darauf zu installieren"
        attribution: "heise online"
        source_url: "https://www.heise.de/news/GL-iNet-Schwachstelle-entdeckt-Patch-verfuegbar-11533722.html"
    extended_notes: |
      S1-lane item (exploited vendor-side flaw) surfaced through an essential S2 source in the window; the vendor notice is dated 2026-11-20 and heise's report 2026-11-22. The hidden-path cron process is carried as a behavior class only (no literal indicator). Detection concept: device process list (LuCI Status > Processes or ps over SSH, KVM terminal) for a cron daemon launched from a hidden file under /tmp; on a computer attached to an infected KVM, new accounts, startup items, scheduled tasks and browser extensions. Hardening per vendor: install the model's stable security firmware even without findings; no factory reset is required for the firmware to remove the identified malware (heise reports a reset as an alternative).
    borderline: true
    borderline_reason: "vendor-confirmed active compromise of a cloud management plane for edge routers and KVM-over-IP devices, but no Swiss or public-sector nexus is stated and the sourcing is one first-party notice plus a heise relay; S1 may carry it"

