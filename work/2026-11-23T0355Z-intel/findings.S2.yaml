  - title: "Publica commissions an independent review of its supplier-selection, data-protection requirements, controls and oversight after the PK Softech attack; first report due by end of March 2027"
    sources:
      - { url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", publisher: "Publica (Pensionskasse des Bundes)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119", publisher: "Inside IT (Keystone-SDA)", date: "2026-11-19", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch feed, URL https://www.inside-it.ch/rss.xml (item Publica laesst Cybervorfall extern pruefen, 2026-11-19) -> article read with url --direct (body in __NEXT_DATA__), URL https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119 -> primary: Publica incident page, URL https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (dated status sections; the 19.11.2026 and 18.11.2026 text is present in the raw HTML from url --direct but is dropped by extract)"
    summary: |
      Publica's Kassenkommission (fund commission) has decided on an independent investigation of how a possible data outflow could happen at its software supplier PK Softech AG despite existing safeguards, whether responsibilities were properly exercised and where improvements are needed (Publica status of 2026-11-19; the tender for the external reviewer is still running). Per Keystone-SDA via Inside IT, the review covers four areas: the selection of the supplier and the data-protection and access-authorisation requirements agreed with it; the handling of personal data; security requirements and the effectiveness of existing controls; and governance and oversight between the commission, committees and the fund's office. An external audit firm is to run it, the approach is to be fixed by the end of January and a first report is planned by the end of March 2027; criminal investigation is out of scope and stays with the Federal Prosecutor's Office and the data-protection commissioner (EDOEB). Publica's page of 2026-11-18 still says it has no indication that data from the supplier attack was published on the darkweb. No new technical facts, actor or vector are given. The delta for defenders is the review scope: it is the first public statement that a Swiss federal body will test its supplier-selection and contractual data-protection and access requirements against a realised supplier compromise.
    region_nexus: "Switzerland, federal level (Publica is the Confederation's pension fund); supplier of several federal, cantonal and communal pension funds"
    primary_sector_nexus: "direct"
    sector: "public-sector"
