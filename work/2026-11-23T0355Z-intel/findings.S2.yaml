items:
  - title: "BSI annual situation report 2026: Germany rates the cyber situation 'angespannt bis kritisch'; time from disclosure to first known exploitation fell from 53 to 25 days, and to 8 days in Q2 2026"
    sources:
      - { url: "https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261119_Lagebericht.html", publisher: "BSI (Bundesamt fuer Sicherheit in der Informationstechnik)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.bsi-lagebericht.de/node/32", publisher: "BSI Lagebericht 2026, Gefaehrdungslage chapter", date: "2026-11-19", role: "primary" }
      - { url: "https://www.bsi-lagebericht.de/node/4", publisher: "BSI Lagebericht 2026, Bedrohungslage chapter", date: "2026-11-19", role: "primary" }
      - { url: "https://www.heise.de/news/BSI-aendert-Lagebewertung-auf-angespannt-bis-kritisch-11530831.html", publisher: "heise online", date: "2026-11-19", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item BSI aendert Lagebewertung auf 'angespannt bis kritisch', 2026-11-19) -> primary: BSI press release, URL https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261119_Lagebericht.html (link taken from the heise article; bsi-press listing https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/pressemitteilungen_node.html carries no item hrefs) -> chapters https://www.bsi-lagebericht.de/node/4 and https://www.bsi-lagebericht.de/node/32"
    summary: |
      Germany's BSI published its annual situation report (reporting period 1 July 2025 to 30 June 2026; press release of 2026-11-19) and raised its overall rating from "angespannt" to "angespannt bis kritisch"; heise notes this is the first time at that level since 2023. BSI names two drivers: AI-supported attack infrastructure that lets attackers run campaigns at unprecedented volume and speed, and growth in exploitation of internet-reachable systems. The measure most useful for patch prioritisation is the time from disclosure to first known exploitation, which BSI states averaged 53 days in the previous period, 25 days in the current one and only 8 days in Q2 2026, adding that attackers often already know a flaw before it is public or patched; at the press conference the interior minister said some cases are already down to a few hours (heise's rendering). BSI's threat chapter reports attacker reconnaissance of internet-exposed targets up 57 percent (tied to residential-proxy botnets built from poorly protected Android devices) and its score for exploitation attacks on web-facing attack surface up 48 percent to 133 points, while mass attacks via communication channels and targeted espionage and cybercrime stayed roughly constant. BSI repeats that small and medium-sized businesses and municipalities are especially vulnerable targets. This is a German authority's national assessment, not Swiss data; its value for Swiss federal, cantonal and communal defenders is as a neighbouring-authority benchmark for patch-window assumptions on internet-facing systems and for prioritising exposure reduction. The Swiss counterpart is the BACS half-year report.
    region_nexus: "Germany (neighbouring national authority); transferable to Swiss federal, cantonal and communal administrations; BSI names municipalities among the most vulnerable target groups"
    primary_sector_nexus: "indirect-transferable"
