      Detection concept (telemetry class first; editorial, derived from the write-up's stated mechanism rather than a source recommendation): a vendor native-messaging host process (for example the Lacuna, Softplan, Certisign or BRy host binaries) loading a module from a user-writable path such as a Downloads or Temp folder or a file whose extension is not .dll, and any DLL load by those hosts that is not signed by the vendor or the token manufacturer; file-creation of a PE with a document or image extension in the download folder immediately before that load (the researchers name .txt, .png and .pdf names). Exposure check: list installed extensions and native-messaging host registrations per endpoint, compare versions against the first-fixed versions above. Hardening lever the researchers name: load DLLs only from a fixed allowlist, verify the file signature and take the origin from the browser. Dark Reading attributes the research to Bay Area Labs and adds no technical facts beyond the write-up.
