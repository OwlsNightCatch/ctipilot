  - title: "Disclosure clocks shorten: Project Zero moves to 'Full 90' now, 'Full 60' on 2027-02-02 and 'Full 30' on 2028-01-03; Anthropic cuts its window to 30 days for high and critical findings from 2027-01-01"
    sources:
      - { url: "https://www.anthropic.com/research/coordinated-vulnerability-disclosure-timelines", publisher: "Anthropic", date: "2026-11-16", role: "primary" }
      - { url: "https://projectzero.google/2026/11/disclosure-policy.html", publisher: "Google Project Zero", date: "2026-11-13", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/anthropic-disclosure-deadline-30/", publisher: "Infosecurity Magazine", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: darkreading, feed https://www.darkreading.com/rss.xml (item 'Google Project Zero Slashes Bug Disclosure Deadlines, Splitting Experts', 2026-11-16) and infosec-magazine, feed https://www.infosecurity-magazine.com/rss/news/ (item 'Anthropic Cuts Disclosure Deadline to 30 Days For Serious Bugs', 2026-11-17) -> Infosecurity article https://www.infosecurity-magazine.com/news/anthropic-disclosure-deadline-30/ links the primary -> primary: Anthropic, URL https://www.anthropic.com/research/coordinated-vulnerability-disclosure-timelines -> primary: Project Zero, URL https://projectzero.google/2026/11/disclosure-policy.html (also in projectzero feed https://projectzero.google/feed.xml, 2026-11-13)"
    summary: |
      Two teams that report AI-assisted vulnerability findings shortened their disclosure clocks within four days of each other, both citing AI-assisted discovery. Google Project Zero (2026-11-13) replaced its '90 + 30' policy with 'Full X': details are published X days after the report to the vendor, starting now at Full 90 (the 30-day patch-soak extension, the grace period and the variant policy are gone), then Full 60 on 2027-02-02 and Full 30 on 2028-01-03; the only exceptions are vulnerabilities exploited in the wild (handled under Google's application-security policy), already-public vulnerabilities and vendor requests. Project Zero states that LLMs raise the chance that several parties find the same bug, that 'zero patch-to-exploitation time is a reasonable, though imperfect, model of attacker behavior' and that patch soak time is no longer meaningful, and it asks vendors to reduce patch gap by faster rollout or non-patch protection. Anthropic's Frontier Red Team (2026-11-16) shortens its window for vulnerabilities it reports to vendors and maintainers to 30 days for high and critical severity and 45 days for others, for reports made on or after 2027-01-01; it will escalate to an external coordinator after 15 days without response, wait 30 days (was 45) after a patch before publishing full technical details, keeps the 7-day window for vulnerabilities under active exploitation, and will agree case-by-case timelines for hard-to-deploy software such as critical infrastructure; already-overdue high and critical reports get 30 more days and are then published on its dashboard. Both are the disclosers' own policies and apply to what those teams report; they are not regulation. Defender implication (editorial inference, not stated by either source): details of unpatched flaws in slow-to-fix vendor products, especially long-lifecycle OT, appliance and niche products, will become public sooner, so internet-facing exposure inventories and compensating-control plans for components whose vendors cannot fix within 30 to 60 days gain value, and a patch release should be treated as the start of the exploitation window, not the end of the embargo.
    region_nexus: "global"
    primary_sector_nexus: "direct (patch-window planning for any administration that runs vendor products)"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
