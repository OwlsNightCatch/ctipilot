  - title: "EggStreme rebuilt under scrutiny: Bitdefender's 2026-11-18 update documents how the operators retooled within weeks of the September 2025 exposure while keeping their methods, and still target Philippine government organisations"
    sources:
      - { url: "https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure", publisher: "Bitdefender Labs", date: "2026-11-18", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/eggstreme-malware-rebuilt-after/", publisher: "Infosecurity Magazine", date: "2026-11-18", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/11/eggstreme-hackers-rebuild-malware-with.html", publisher: "The Hacker News", date: "2026-11-18", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, feed https://www.infosecurity-magazine.com/rss/news/ (item 'Suspected Chinese APT Rebuilds EggStreme Malware After Exposure', 2026-11-18) -> extract https://www.infosecurity-magazine.com/news/eggstreme-malware-rebuilt-after/ -> WebSearch ('Bitdefender EggStreme update operators rebuilt malware after report Philippine government') -> The Hacker News https://thehackernews.com/2026/11/eggstreme-hackers-rebuild-malware-with.html links the primary -> primary: Bitdefender Labs, URL https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure"
    summary: |
      Bitdefender Labs updates its September 2025 EggStreme research (a fileless, DLL-sideloading espionage framework with six components, first seen against a Philippine military contractor). It reports that after its first report the operators changed the configuration protection of the EggStremeFuel loader component 12 days later, then the loader's cipher and payload format 14 days after that (RC4 to RC5, then a custom cipher by late October 2025), moved to a different agent network protocol with an enhanced command set and a passive variant that never beacons out, dropped the keylogger from every newer agent build it analysed, and appear to be moving from one shared certificate authority, which had linked 32 domains, to campaign-specific authorities embedded in each binary. Bitdefender frames this with the Pyramid of Pain: the operators rotated hashes, IPs and domains (trivial), changed payload paths, configuration formats and a firewall rule name (artefacts) and reworked the loader, agent and Fuel components (tools), but behaviours stayed the same: DLL sideloading, lateral movement through file shares, in-memory execution and mutual TLS; Bitdefender says each change broke static signatures and heuristics built for the framework as first described. The framework is built so capabilities are chosen at build time, which makes rework cheap. Bitdefender assesses with high confidence that the operation continues to target multiple Philippine government organisations and with low to medium confidence that Taiwan is targeted (a lead, not an established fact); attribution stays at a suspected Chinese APT with no new claim, and the lab says the timing suggests its own report was a likely trigger for the changes.
    region_nexus: "philippines (government), taiwan (low to medium confidence); no European or Swiss victim"
    primary_sector_nexus: "indirect (government espionage; the detection-brittleness lesson is transferable)"
    sector: "public-sector"
    cves: []
    techniques: [T1574.001, T1620, T1021.002, T1573, T1027]
    affected_products: ["Microsoft Windows"]
    entity_keys: []
    new_entities:
      - { key: "tool:eggstreme", type: tool, name: "EggStreme", aliases: ["EggStremeAgent", "EggStremeFuel", "EggStremeLoader"], summary: "Fileless multi-stage espionage framework (Fuel, Loader, ReflectiveLoader, Agent, Wizard, Keylogger) attributed by Bitdefender to a suspected Chinese APT; first documented September 2025, rebuilt after exposure and still used against Philippine government organisations (Bitdefender, 2026-11-18)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    admiralty_suggestion: "B2"
    novelty: new
    lookback: true
    event_date: "2026-11-18"
    borderline: true
    borderline_reason: "No Swiss or European victim; Philippine and Taiwanese government targeting. Included only for Bitdefender's explicit, sourced lesson that detections keyed to hashes, domains, cipher constants or one certificate authority broke within two weeks while the sideloading, share-based lateral movement and mutual-TLS behaviours did not"
    evidence:
      - quote: "we assess with high confidence that the operation continues to target Philippine government organizations, with multiple victims"
        attribution: "Bitdefender Labs"
        source_url: "https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure"
      - quote: "In other words, the operators spent at the tools level and kept their methods."
        attribution: "Bitdefender Labs"
        source_url: "https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure"
      - quote: "Each change broke static signatures and heuristic detections built around the framework as we first described it."
        attribution: "Bitdefender Labs"
        source_url: "https://businessinsights.bitdefender.com/eggstreme-malware-revises-architecture-infrastructure"
    extended_notes: |
      Detection concept: behaviour-first hunting for a signed or renamed benign binary loading an unexpected DLL and executing in-memory, SMB/file-share lateral movement of loader components, and mutual-TLS sessions from servers with no such role, rather than file hashes or one certificate authority's domain set. Bitdefender notes some pivots remain (development servers staging certificates, one shared development IP, legacy domains reappearing). This is an update to a September 2025 report; no earlier EggStreme coverage exists in the store.
