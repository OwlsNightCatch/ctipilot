    confidence: MEDIUM
    admiralty_suggestion: "B2"
    novelty: new
    lookback: true
    event_date: "2026-11-18"
    evidence:
      - quote: "AuditTeam is an active threat group that uses the OpsAgent framework to compromise organizations across at least seven countries and territories."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
      - quote: "An antivirus/endpoint detection and response (AV/EDR) killer module installs a digitally signed Beijing Jiangmin Antivirus driver to terminate security products."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
      - quote: "During this period, the group has infected dozens of organizations in Russia, Italy, the Philippines, Hong Kong, Senegal, Finland and China."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
      - quote: "OpsAgent can optionally obtain its C2 address by reading a public GitHub repository"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
    extended_notes: |
      Initial access is not described in the report; do not infer one. Detection concepts (telemetry class first): driver-load events for a security-vendor-branded kernel driver on hosts that do not run that product, followed within seconds by termination of EDR, Sysmon, log-forwarder and backup agents; process-creation events showing msiexec.exe or notepad.exe with no installer context, spawned as a debug-state child or hosting a named pipe, which is the shellcode-host pattern; outbound TLS WebSocket sessions to CloudFront subdomains from servers; GitHub raw/API reads from servers with no developer role. The shared CloudFront address space makes IP blocking ineffective (Kaspersky). Benign lookalike (mechanical reasoning, not a Kaspersky statement): msiexec.exe legitimately runs for installers, so the discriminators are parent process, command line and whether a named pipe or injected thread follows. Editorial inference on hardening, not stated by Kaspersky: driver allow-listing or block-listing, tamper protection for EDR and logging agents, and per-process egress control address the three behaviours above.
