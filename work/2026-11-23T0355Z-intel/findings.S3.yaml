    extended_notes: |
      Detection concepts the sources support (telemetry class first). Identity/cloud: a non-interactive client-credentials token request to login.microsoftonline.com from a user workstation or an Oracle/Java/Python-hosted process, followed by Graph calls writing and reading files in a SharePoint site that is not one of the organisation's own tenants; Kaspersky concludes that Graph, GitHub and Ably API calls are indistinguishable from legitimate enterprise use at the network layer (editorial inference: per-process egress logging and Entra tenant-restriction style controls are the levers that remain). Endpoint: a legitimate signed binary (Sandboxie launcher, OpenJDK launcher, Python host, Sysinternals tool) executing from a non-standard directory (for example under System32 or ProgramData) next to a DLL it would not normally load and an encrypted .ini file, with the DLL reading that file and then executing code in memory (the Sophos behavioural guidance); creation of ProgramData directories under a vendor-lookalike name; processes that issue GitHub API calls with a personal access token from servers with no developer role. Remote-management: Kaspersky treats any MeshCentral agent introduced into an environment as a suspicious event until proven administrative. Competing-hypotheses note: Kaspersky attributes nothing; Sophos calls its cluster China-based on UTC+8 working-hours telemetry and distinct tooling; the FamousSparrow/CopperTurtle overlap is shared staging only. Region caveat: no European or Swiss victim is named; the value for Swiss public-sector defenders is the cloud-service C2 class and the sideloading behaviour, not a direct threat.
