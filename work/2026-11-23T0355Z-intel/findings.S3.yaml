  - title: "AuditTeam: a ransomware crew sells 'forced audits' with its own OpsAgent implant (C++ rewritten in Rust), a signed-driver AV/EDR killer and a GitHub-resolved CloudFront C2; victims in Italy and Finland among seven countries"
    sources:
      - { url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/", publisher: "Kaspersky Securelist", date: "2026-11-18", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist, feed https://securelist.com/feed/ (item 2026-11-18) -> primary (no pivot needed): extract https://securelist.com/auditteam-opsagent-forced-audit/122031/ ; independent corroboration searched in the article's own references only (dbdigest.com and DeXpose are leak-site trackers cited by Kaspersky for the group's first public mentions, not fetched)"
    summary: |
      Kaspersky reports that AuditTeam, active since January 2026 and through at least October 2026, uses its own post-exploitation framework OpsAgent to compromise dozens of organisations in Russia, Italy, the Philippines, Hong Kong, Senegal, Finland and China, with leak-site claims in seven further countries; Kaspersky attributes the campaign to the group with high confidence on the ransom-note format, leak site and the group's remediation-report model. Extortion is framed as a paid security audit: the note, dropped by the cryptor module after files are already encrypted, offers a vulnerability report for an 'Audit & Consulting fee' instead of publishing the stolen archive. OpsAgent rivals Cobalt Strike in function (file and process management, token theft and creation, pass-the-hash and Mimikatz executed from shellcode received over a named pipe, SMB/HTTP/TCP agent linking and SOCKS pivoting, keylogging, screenshots). Loaders inject shellcode into msiexec.exe (C loader via CreateRemoteThread, a .NET loader via an asynchronous procedure call) and the September 2026 Rust loader runs the implant in its own process; one injection mode creates the target process in a debug state and sets a hardware breakpoint on a time-conversion API instead of creating a thread. C2 runs over TLS WebSocket (the Rust rewrite starts with HTTP POST then upgrades) to Amazon CloudFront subdomains, and the implant can optionally read its C2 address from a public GitHub repository; Kaspersky notes the repository was removed in November 2026 but newer Rust builds have that feature disabled. An AV/EDR killer module loads a validly signed driver impersonating a Jiangmin antivirus product that terminates about 220 named processes (security products, Sysmon, splunkd, wazuh-agent, Veeam, Acronis, database engines). The cryptor module (AES-CBC or ChaCha20 with X25519 key exchange) stops database and backup services, deletes shadow copies and overwrites files before deletion. Kaspersky sees code patterns consistent with LLM-assisted development. This is a single-lab report.
    region_nexus: "global; named victims include Italy and Finland (Europe); Russia, Philippines, Hong Kong, Senegal, China; leak-site claims in Turkey, Thailand, Ukraine, Argentina, South Korea, Japan, Spain; no Swiss victim named"
    primary_sector_nexus: "indirect (all industries; Italy is a neighbouring state)"
    sector: "cross-sector"
    cves: []
    techniques: [T1486, T1490, T1489, T1685, T1055, T1055.004, T1102.001, T1071.001, T1090, T1134, T1550.002, T1003, T1056.001, T1113, T1573, T1657]
    affected_products: ["Microsoft Windows", "Amazon CloudFront", "GitHub"]
    entity_keys: []
    new_entities:
      - { key: "actor:auditteam", type: actor, name: "AuditTeam", aliases: [], summary: "Ransomware and data-extortion group active since January 2026 (Kaspersky, 2026-11-18) that frames extortion as a paid 'Audit & Consulting fee' for a vulnerability report and operates the OpsAgent framework." }
      - { key: "tool:opsagent", type: tool, name: "OpsAgent", aliases: ["OpsAgent-rs"], summary: "Penetration-testing-style post-exploitation framework used by AuditTeam (C++ rewritten in Rust), with shellcode injection, token and pass-the-hash commands, SMB/HTTP/TCP pivoting, a signed-driver AV/EDR killer module and a cryptor module (Kaspersky, 2026-11-18)." }
    relation_suggestions:
      - { subject: "actor:auditteam", object: "tool:opsagent", basis: "Kaspersky: the campaign is attributed to AuditTeam with high confidence; the group operates the OpsAgent framework" }
