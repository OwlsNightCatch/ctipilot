  - title: "Mail bombing as the pretext: Fortra FIRE tracks subscription floods followed within minutes by Microsoft Teams calls from a fake internal IT desk, with signs of an AI agent driving the sign-ups"
    sources:
      - { url: "https://www.fortra.com/blog/mail-bombing-pretext-teams-vishing-attack", publisher: "Fortra Intelligence and Research Experts (FIRE)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/mail-bombing-attacks-it-helpdesk/", publisher: "Infosecurity Magazine", date: "2026-11-20", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, feed https://www.infosecurity-magazine.com/rss/news/ (item 'Mail Bombing Attacks Fuel IT Helpdesk Impersonation Scams', 2026-11-20) -> extract https://www.infosecurity-magazine.com/news/mail-bombing-attacks-it-helpdesk/ -> WebSearch ('Fortra FIRE mail bombing IT helpdesk impersonation AI agent newsletter signup flood November 2026') -> primary: Fortra FIRE, URL https://www.fortra.com/blog/mail-bombing-pretext-teams-vishing-attack (read through the metered reader)"
    summary: |
      Fortra's FIRE team tracks targeted mail-bombing campaigns in which a victim's address is entered into newsletter, registration and demo-request forms on many unrelated sites, so that real services (Mailchimp and its Mandrill service most often, then Amazon SES and SendGrid) flood the inbox; FIRE sees campaigns peaking around 10,000 messages, about 1,000 a day, and assesses from indicators that an AI agent is probably crawling pages for signup forms (an assessment, not a confirmed finding). As the volume peaks, the victim is contacted on Microsoft Teams by someone claiming to be internal IT, who gives verbal and emailed instructions that supposedly stop the flood but aim to compromise the account, the system or both. The messages come from real services and can pass SPF, DKIM and DMARC, so individual mails look normal; detection has to look across a recipient's inbox for a rise in volume from unrelated senders with repeated signup language, and List-Unsubscribe headers help but legitimate bulk mail has them too. FIRE also saw a phishing page with fake validation and loading screens during the waves but cannot verify that the bombing operator sent it or that it connected to the Teams activity, and it describes the flood as also able to bury account alerts and payment notices and, through email-to-case workflows, to create ticket floods. FIRE's response guidance: end unsolicited support contact and verify through the established helpdesk route, never the caller's contact details; preserve full headers, external Teams account details and a timeline before cleanup; use recipient-scoped, expiring mail controls and review allowlist exceptions that cover delivery platforms (broad provider blocks disrupt unrelated mail); review Teams external-access policy for organisation and per-user settings; check delivered, junk and quarantined mail for activity hidden by the flood; ask senders and Mailchimp for recipient-specific subscription blocks. The primary describes no malware, payload or named actor.
    region_nexus: "global; no country named; relevant to any Microsoft 365 and Teams environment with external access enabled"
