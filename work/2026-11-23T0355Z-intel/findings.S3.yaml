  - title: "UAT-12643: Talos finds a suspected North Korea-aligned cluster using Solana memo transactions as the C2 dead drop for the Overlord RAT, WinRE reset-config persistence and signed-binary downloaders; companion Talos guidance on blockchain dead drops"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/", publisher: "Cisco Talos", date: "2026-11-18", role: "primary" }
      - { url: "https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/", publisher: "Cisco Talos", date: "2026-11-18", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/overlord-rat-solana-blockchain-c2/", publisher: "Infosecurity Magazine", date: "2026-11-20", role: "corroborating" }
    discovery_trace: "first seen at: talos, feed https://blog.talosintelligence.com/rss/ (two items dated 2026-11-18) -> primary (no pivot needed): extract of both Talos posts -> Infosecurity Magazine re-report found in feed https://www.infosecurity-magazine.com/rss/news/ (not independent; a rewrite of the Talos post)"
    summary: |
      Cisco Talos tracks UAT-12643, which it assesses with low confidence as North Korea-aligned on TTP overlap with other DPRK clusters, and describes a financially motivated toolkit aimed at cryptocurrency holders, gaming-platform account owners, finance and accounting staff and VoIP softphone users, with keyword-based file harvesting in English, French, Spanish and Portuguese that Talos reads as possible Europe targeting. Delivery was not observed; Talos recovered weaponised Windows shortcuts that impersonate a PDF and fetch the payload through the Defender command-line utility's download switch or through certutil, an HTA run by mshta, and an MSBuild project file with an inline C# task, the last using a spoofed BITS user agent. The Go-based Overlord RAT (35 commands: keylogging, webcam and audio capture, file and process control, scripting, reverse SOCKS, reflective-DLL plug-in delivery) finds its C2 by reading Solana memo transactions from an operator wallet through public JSON-RPC (it scans for memo entries of one fixed encrypted length), so a C2 change needs only a new transaction. It also carries a kill-flag that marks the process critical so that terminating it blue-screens the host, registry Run-key persistence, and a second persistence path that registers a payload and batch script in the Windows Recovery Environment OEM directory and edits ResetConfig.xml so that 'Reset this PC' runs it. Companion payloads are a publicly available Python infostealer ('Good Game', collecting browser credentials, Discord tokens, wallet and game-launcher sessions) exfiltrating through a file-sharing service plus a chat webhook, and a C++ clipboard hijacker. In a separate post Talos argues that public-blockchain dead drops (Bitcoin, EVM contracts via EtherHiding, TRON, Solana memo) defeat domain seizure and sinkholing, and advises baselining and flagging automated high-frequency calls to public node providers and chain RPC endpoints where they are not business-required and inspecting JSON-RPC payloads for anomalous encoded data of fixed length. Talos names the earlier public Solana-memo reporting on Lazarus (March 2026) and the UNK_DeadDrop cluster's earlier use of Overlord (June 2026).
    region_nexus: "global; possible Europe targeting per Talos (document keywords in English, French, Spanish, Portuguese); no Swiss victim named"
    primary_sector_nexus: "indirect (finance and accounting staff named as one lure audience; technique class transferable)"
    sector: "cross-sector"
    cves: []
    techniques: [T1204.002, T1105, T1218, T1218.005, T1127.001, T1102.001, T1547.001, T1620, T1090, T1056.001, T1113, T1125, T1123, T1497, T1555.003, T1539, T1567.002, T1567.004, T1565.002, T1564.003, T1036.005]
    affected_products: ["Microsoft Windows", "Windows Recovery Environment", "Microsoft Defender", "Solana"]
    entity_keys: ["tool:overlord-rat", "campaign:unk-deaddrop-2026"]
    new_entities:
      - { key: "actor:uat-12643", type: actor, name: "UAT-12643", aliases: [], summary: "Cisco Talos designation (2026-11-18) for a financially motivated cluster, assessed with low confidence as North Korea-aligned, that uses the Overlord RAT with Solana-memo C2 resolution, a Python infostealer and a clipboard hijacker." }
    relation_suggestions:
      - { subject: "actor:uat-12643", object: "tool:overlord-rat", basis: "Talos: UAT-12643 uses the Go-based Overlord RAT as one of its payloads" }
      - { subject: "actor:uat-12643", object: "campaign:unk-deaddrop-2026", basis: "Talos: UNK_DeadDrop employed Overlord in earlier campaigns (Proofpoint, June 2026); the tool overlap is one of the TTP overlaps behind Talos's low-confidence North Korea-aligned assessment (overlaps-with, not attribution)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    admiralty_suggestion: "B2"
    novelty: new
    lookback: true
    event_date: "2026-11-18"
    borderline: true
    borderline_reason: "Cryptocurrency, gaming and VoIP-user targeting is only indirectly relevant to Swiss public-sector defenders; included for transferable tradecraft (Windows Recovery Environment reset-config persistence, signed-binary downloaders, public-RPC dead-drop resolution and the egress lever Talos names)"
    evidence:
      - quote: "Talos assesses with low confidence that UAT-12643 is a North Korea-aligned advanced persistent threat (APT) actor based on overlaps in tactics, techniques, and procedures (TTPs) with those of the other known North Korean APT actors."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "The Overlord RAT implements a command-and-control (C2) resilience technique in which encrypted server URLs are embedded in Solana blockchain transaction memos."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "we have not observed how the actor delivers these malicious initial vector files"
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/"
      - quote: "Network defenders should inspect JSON-RPC payloads for anomalous base-encoded data and unexpected payload lengths."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-challenge-of-defending-against-bulletproof-dead-drops-on-public-blockchains/"
    extended_notes: |
      Detection concepts (telemetry class first): process creation for the Defender command-line utility or certutil with a download switch and a URL, launched by a shortcut file; mshta.exe and msbuild.exe launched from user-writable paths or from shortcut files; msbuild.exe compiling an inline task from a non-project XML; registry and file-system telemetry for writes under the Recovery\OEM directory and edits to the Windows Recovery Environment reset configuration (editorial inference, not stated by Talos: such writes should be rare in normal operations); a user-mode binary that raises SeDebugPrivilege and marks its own process critical via NtSetInformationProcess; outbound JSON-RPC calls to public node providers from workstations with no Web3 role (the lever Talos names); archive upload to a file-sharing service plus a chat-webhook POST from the same process. Post-compromise note from the source: the Recovery Environment persistence is built so that the implant survives 'Reset this PC', so a reset is not a clean-up step for an affected host. Attribution caveat: low confidence, Talos hedges explicitly; the Overlord tool is publicly available and was also seen in an unattributed macOS campaign (registry: tool:overlord-rat).
