  - title: "Operation ShadowCloud: GitDoor and GraphDoor backdoors hide C2 in GitHub, Microsoft Graph/SharePoint and Ably against government networks, entering through an abused MeshCentral agent (Kaspersky GReAT; Sophos CTU tracks a fragment as BRONZE SANDCASTLE)"
    sources:
      - { url: "https://securelist.com/operation-shadowcloud-gitdoor/122004/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-11-17", role: "primary" }
      - { url: "https://securelist.com/operation-shadowcloud-graphdoor/122005/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-11-17", role: "primary" }
      - { url: "https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells", publisher: "Sophos Counter Threat Unit", date: "2026-10-20", role: "corroborating" }
      - { url: "https://www.kaspersky.com/about/press-releases/kaspersky-operation-shadowcloud-targets-government-networks-across-asia-and-africa", publisher: "Kaspersky (press release)", date: "2026-11-17", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist, feed https://securelist.com/feed/ (items 2026-11-17) -> drilled with extract https://securelist.com/operation-shadowcloud-gitdoor/122004/ and https://securelist.com/operation-shadowcloud-graphdoor/122005/ -> Part 1 names the Sophos brief -> corroborating: Sophos CTU, URL https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells (2026-10-20) -> Kaspersky press release, URL https://www.kaspersky.com/about/press-releases/kaspersky-operation-shadowcloud-targets-government-networks-across-asia-and-africa"
    summary: |
      Kaspersky GReAT describes Operation ShadowCloud, an active espionage intrusion set that began in early 2026 and, per Kaspersky, hits government organisations in Asia and Africa (the press release lists Southeast Asia, Africa and Central Asia). The entry point is not known: the first observed step is a MeshCentral agent (a legitimate remote-management tool) launched inside a Taiwanese organisation, with evidence pointing to reuse of an earlier infection. Through that agent the operators drop a legitimate signed binary, a malicious DLL and an encrypted payload file beside it; the DLL decodes the payload in its own process and runs it. Binaries seen as sideload hosts include the Sandboxie launcher, an OpenJDK launcher, a Python host, a Sysinternals magnifier tool (started as a service) and a CEF helper. The two new backdoors differ only in the C2 channel they abuse. GitDoor reads commands and plug-ins from, and writes results to, attacker-owned GitHub repositories through the GitHub REST API (opening an issue per victim) and mirrors data to the Ably messaging service. GraphDoor authenticates to Entra as an attacker-registered application with the client-credentials grant and then uses Microsoft Graph to read commands and plug-ins from, and write results to, a SharePoint site in the attacker's tenant. Both pull plug-ins on demand (screen capture, process listing, keylogger, a modified Erfrp proxy client and an Ably-based proxy) and run shellcode families, mostly COFF objects, in memory. Kaspersky says it lacks enough evidence for definitive attribution and reports overlaps with Chinese-speaking groups FamousSparrow and CopperTurtle (shared staging directories, implants deployed within a day of each other). Separately, Sophos CTU (2026-10-20) tracks a cluster it calls BRONZE SANDCASTLE with the same Sandboxie sideloading pattern, encrypted config.ini payloads, Ably and GitHub-hosted encrypted configuration, victims in the Philippines, Taiwan, Afghanistan and Namibia, and ntds.dit copying through volume shadow copies; Kaspersky itself cites the Sophos brief as touching a fragment of this campaign, and neither lab says the two clusters are proven identical.
    region_nexus: "asia, africa (Taiwan, Philippines, Afghanistan, Namibia named); no Swiss or European victim named; transferable to any government network that permits Microsoft Graph and GitHub egress from servers and workstations"
    primary_sector_nexus: "direct (government-sector targeting); technique class transferable"
    sector: "public-sector"
