    discovery_trace: "first seen at: darkreading, feed https://www.darkreading.com/rss.xml (item 'Major Brazilian Signature Apps Enable RCE & Fraud', 2026-11-18) -> extract of https://www.darkreading.com/vulnerabilities-threats/major-brazilian-signature-app-rce-fraud (served via the metered reader) -> primary: discoverer's write-up, extract https://amibeingpwned.com/blog/how-we-hacked-brazil (the Dark Reading article links the longer slug URL .../how-we-hacked-brazil-869982c4b473e6b8cfa8605f4cd3f12d, which resolves to the same post)"
    summary: |
      Researchers at Am I Being Pwned? describe a shared flaw class they call Sign2Shell in the five most-installed ICP-Brasil digital-signing extensions (Lacuna Web PKI, Certisign WebSigner, Softplan Web Signer, Certisign CertiPlugin, BRy Assinatura Digital; about 10.18 million installs; the researchers rate all five CVSS 3.1 9.6; no CVE identifiers appear in the write-up). Each extension forwards page-supplied commands to a vendor native-messaging host that runs outside the browser sandbox as the logged-in user and, with no Authenticode, path or extension check, loads whichever PKCS#11 module (DLL) path the website supplies, so the attacker code runs inside a vendor process as the user. Reach differs: on Lacuna Web PKI and Certisign WebSigner a malicious page or an iframe (an ad) was enough with no click; on Softplan Web Signer the victim had to open a link; on CertiPlugin and BRy visiting the page was enough and the page downloaded the payload automatically. The researchers also describe gate bypasses (a command-name case mismatch between the extension and the host, an origin check that can be fooled, an allowlist that matched an entire public TLD, and a consent dialog rendered into the attacking page's own DOM). Fixed versions per the write-up, from the Chrome Web Store: Lacuna Web PKI 2.18.0 (2026-07-21; the earlier 2.17.5 patch was partial and remains vulnerable), Certisign WebSigner 2.18.0 (2026-08-03), Softplan Web Signer 2.18.3 (2026-08-27), BRy 2.2.8 (2026-09-10); Certisign CertiPlugin has no fix, only an allowlist narrowing in 1.15.1. Exploitation needs Windows and the vendor native host. The researchers saw no vendor advisories, did not test for in-the-wild exploitation and say they cannot rule it out; Brazil's CTIR Gov and CERT.br were informed. Clients named by the vendors include a superior court, the stock exchange, the navy and the Federal Senate; the researchers state this shows who buys the products, not that any was compromised. Editorial inference, not a source statement: the class (a browser extension that bridges page input to a smartcard or PKCS#11 native host) is generic to e-signature middleware in any country.
    region_nexus: "brazil; no Swiss or European exposure stated; class transferable to any smartcard or e-signature browser bridge"
