        source_url: "https://www.fortra.com/blog/mail-bombing-pretext-teams-vishing-attack"
      - quote: "someone who knows about the flood has not proved they are IT"
        attribution: "Fortra FIRE"
        source_url: "https://www.fortra.com/blog/mail-bombing-pretext-teams-vishing-attack"
    extended_notes: |
      Triage-relevant discriminator (source-stated): the sequence is volume spike of unrelated subscription mail for one recipient, then an unsolicited Teams chat or call from an external account claiming to be IT within the same hours; a legitimate helpdesk contact would arrive through the organisation's established route. Benign lookalike: a genuine newsletter-signup burst (for example after a conference registration) produces the flood without the Teams approach. Detection concept: per-recipient inbound volume baselines joined with first-contact external Teams messages and calls to the same user; Teams external-access policy changes. Related earlier store coverage on the Teams-based helpdesk pretext exists under campaign:teams-external-chat-phishing.
