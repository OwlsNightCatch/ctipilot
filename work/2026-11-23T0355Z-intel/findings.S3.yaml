  - title: "Sign2Shell: the five most-installed Brazilian e-signature browser extensions (about 10 million installs) let a website pick the DLL that their native host loads; four fixed, Certisign CertiPlugin only mitigated"
    sources:
      - { url: "https://amibeingpwned.com/blog/how-we-hacked-brazil", publisher: "Am I Being Pwned? (James Arnott)", date: "2026-11-17", role: "primary" }
