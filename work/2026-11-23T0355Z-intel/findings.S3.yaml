  - title: "WPPConnect compromise: unreviewed commits shipped a secret stealer through the project's own trusted-publishing pipeline with valid SLSA provenance, then the release tag was rewritten"
    sources:
      - { url: "https://www.stepsecurity.io/blog/wppconnect-compromised-malicious-releases-steal-secrets-and-whatsapp-sessions", publisher: "StepSecurity", date: "2026-11-16", role: "primary" }
      - { url: "https://corgea.com/research/wppconnect-npm-docker-trusted-publishing-telegram-secret-stealer-november-2026/", publisher: "Corgea", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: stepsecurity-blog, feed https://www.stepsecurity.io/blog/rss.xml (item 'WPPConnect Compromised: Malicious Releases Steal Secrets and WhatsApp Sessions Through the Project's Own Pipeline') -> primary: extract https://www.stepsecurity.io/blog/wppconnect-compromised-malicious-releases-steal-secrets-and-whatsapp-sessions -> WebSearch ('WPPConnect npm @wppconnect-team/wppconnect 2.4.1 malicious release Telegram session tokens') surfaced an independent write-up -> corroborating: Corgea, URL https://corgea.com/research/wppconnect-npm-docker-trusted-publishing-telegram-secret-stealer-november-2026/"
    summary: |
      StepSecurity and Corgea independently analyse the compromise of the WPPConnect WhatsApp automation libraries. On 2026-11-15 two unsigned commits with no pull request reached the default branch of the library repository, and on 2026-11-16 a similar commit reached the server repository; the project's own GitHub Actions trusted-publishing workflows then shipped @wppconnect-team/wppconnect 2.4.1 to npm (latest for about 4.5 hours, 155 recorded downloads as a floor, with valid SLSA provenance naming the malicious commit) and @wppconnect/server 2.10.82 (no provenance attestation), plus Docker Hub images and the GitHub nightly release. StepSecurity's check list also names library 2.4.3 and server 2.10.83, which it says npm does not list although the pipeline ran for them (its Actions-log reading shows a successful 2.4.3 publish containing the payload module), and Corgea also names the 2.10.83 Docker images. A 'diagnostics' module runs on import or at server start, not at install, so npm install --ignore-scripts does not stop it: it uploads the process environment variables, the first part of .env and config files and WhatsApp session token files to a Telegram bot, rate-limited to once a day, and the server variant stays quiet on hosts that look like CI runners or analysis sandboxes. Within about 30 seconds of an external researcher opening public issues, both default branches were force-pushed and the release tag was repointed to a look-alike commit without the payload, so GitHub source and the npm tarball differed until the tags were deleted on 2026-11-17. Both teams say the maintainer account acted but that how access was obtained is not established. The transferable lesson both draw: a valid trusted-publisher identity and SLSA provenance prove where a package was built, not that anyone reviewed the code, and a publish workflow without a protected approval environment lets one account's push become a release. Remediation per StepSecurity: search lockfiles, node_modules and images for the named versions, compare Docker digests rather than tags, treat every secret reachable from an affected process as stolen and sign out WhatsApp sessions.
    region_nexus: "global; no public-sector or Swiss exposure stated"
    primary_sector_nexus: "indirect (npm and container supply-chain control lesson)"
    sector: "technology"
    cves: []
