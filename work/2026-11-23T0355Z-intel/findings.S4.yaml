  - title: "GL.iNet: an attacker used a flaw in the GoodCloud remote-management service to push malware to routers and KVMs; the vendor's cloud fix does not clean devices already infected"
    sources:
      - { url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20", publisher: "GL.iNet (Security Notice 2026-11-20, updated through 2026-11-23)", date: "2026-11-20", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/", publisher: "BleepingComputer", date: "2026-11-22", role: "corroborating" }
      - { url: "https://github.com/RemoteToHome-io/gl-security-incident-2026", publisher: "RemoteToHome Consulting (independent field survey and firmware analysis, last reviewed 2026-11-23 03:57 UTC)", date: "2026-11-23", role: "corroborating" }
      - { url: "https://www.heise.de/news/GL-iNet-Schwachstelle-entdeckt-Patch-verfuegbar-11533722.html", publisher: "heise online", date: "2026-11-22", role: "corroborating" }
      - { url: "https://borncity.com/blog/2026/11/21/gl-inet-sicherheitsvorfall-bei-cloud-fernverwaltung-schadsoftware-auf-routern/", publisher: "Borns IT- und Windows-Blog (discovery lead, relays forum reports)", date: "2026-11-21", role: "discovery" }
    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/11/21/gl-inet-sicherheitsvorfall-bei-cloud-fernverwaltung-schadsoftware-auf-routern/ (feed https://borncity.com/blog/feed/) -> primary: GL.iNet security notice, URL https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20 -> corroborating: BleepingComputer URL https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/ (also seen in the bleepingcomputer feed) -> independent analysis: RemoteToHome Consulting URL https://github.com/RemoteToHome-io/gl-security-incident-2026 -> heise URL https://www.heise.de/news/GL-iNet-Schwachstelle-entdeckt-Patch-verfuegbar-11533722.html"
    summary: |
      GL.iNet says it identified on 2026-11-20 a vulnerability in its cloud remote-management service (GoodCloud) and that an
      unauthorized party exploited it to access some GL.iNet routers and KVM devices and install malicious software on them.
      The vendor closed the cloud path and says the cloud-side fix alone does not remove malware from devices already infected;
      it points owners to per-model security firmware (for example 4.11.1 or later for GL-MT3000, GL-MT6000 and GL-MG1300,
      4.10.3 for GL-E5800, KVM 1.10.3 or later for the RM1, RM1V2, RM10, RM10RC, RM1PE and RM4PE, 1.8.7 for the RMQ1), says the
      update removes the malware identified in this incident without a factory reset, and says an unlisted model is not
      necessarily unaffected. GL.iNet has not said which firmware versions or how many devices are affected, over what time
      window, or how the flaw was used. BleepingComputer reports, from user and researcher samples, custom malware tailored to
      GL.iNet models: root reverse shells to an attacker server, a process disguised as a cron daemon, persistence through
      startup scripts and scheduled jobs, a replaced netstat utility that hides the malware's connections, planted SSH keys
      and tampered file timestamps; some recovered files carry December 2025 timestamps, and it is unclear whether those belong
      to the same actors. RemoteToHome Consulting, which manages many GL.iNet routers, reads the compiled GoodCloud client and
      says one cloud-message handler (the AstroWarp/SD-WAN path) passes a cloud-supplied value to a root shell without
      validation, in firmware since 4.7.0 of 2024-12-05 and whether or not AstroWarp is in use; GL.iNet has not confirmed this
      as the vector. Its survey found the attack or an older, separate backdoor on 166 of 199 routers it reached (not a random
      sample), found that GL.iNet's single published process indicator matched none of them, and says the vendor's clean-up
      is partial: a firmware upgrade that keeps settings can leave startup entries and keep-list persistence in place, so a
      reinstall without keeping settings is its advice. No actor is named; BleepingComputer notes Chinese-language developer
      comments in one installer and treats authorship as only suggestive.
    region_nexus: "global; no Swiss-specific statement found (none of the 25 most recent NCSC-CH security-hub posts, newest dated 2026-11-19, concerned GL.iNet at fetch time)"
    primary_sector_nexus: "indirect: travel/branch routers and IP-KVMs are used for remote and field work; Swiss public-sector footprint unknown"
    sector: "technology"
    cves: []
    techniques: [T1190, T1059.004, T1037.004, T1053.003, T1036.005, T1070.006, T1098.004]
    affected_products: ["GL.iNet GoodCloud", "GL.iNet routers (GL-MT3000, GL-MT6000, GL-MT2500, GL-AX1800, GL-AXT1800, GL-MT5000, GL-MT3600BE and others listed in the notice)", "GL.iNet KVM (Comet RM1, RM1PE, RM10, RMQ1 and related)"]
    entity_keys: []
