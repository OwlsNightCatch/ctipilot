  - title: "Babidi Ghost: SOCRadar reconstructs a nine-day AI-agent operation by a low-skill operator that hit banks, an insurer and thirteen town halls through one shared IT provider, with Switzerland among the main target countries"
    sources:
      - { url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/", publisher: "SOCRadar Research (Fatih Demir)", date: "2026-11-20", role: "primary" }
      - { url: "https://borncity.com/blog/2026/11/21/bankweaver-angriff-auf-falsch-konfigurierte-banking-software/", publisher: "Borns IT- und Windows-Blog (discovery lead, relays SOCRadar)", date: "2026-11-21", role: "discovery" }
    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/11/21/bankweaver-angriff-auf-falsch-konfigurierte-banking-software/ (feed https://borncity.com/blog/feed/; the BabieGhost passage at the end of the post) -> primary: SOCRadar write-up, URL https://socradar.io/blog/babidighost-ai-augmented-cybercrime/ ; WebSearch ('BabidiGhost SOCRadar jailbroken AI agent municipalities Belgium Switzerland BlackHatSect0r') found no second outlet"
    summary: |
      SOCRadar's Threat Research Unit reports that a French-speaking operator it calls BabidiGhost spent about nine days
      (6 to 14 November 2026) driving a jailbroken AI agent from the BlackHatSect0r toolchain (the Hermes agent framework
      with anti-refusal prompts and an escalation proxy) against more than 50 organizations and datasets, mostly in Belgium,
      France and Switzerland. SOCRadar says it reconstructed the operation from the operator's staging server, a hijacked
      small-business server whose home directory was served as an open file listing, so every prompt, shell history and about
      10 GB of stolen data were readable. SOCRadar states no zero-day was used: the successful intrusions were an
      internet-facing, unpatched Metabase (CVE-2023-38646) from which the agent reached cloud database credentials in the
      container environment and exported an insurer's customer database, a weak administrator password on a shared IT
      provider's storage-management interface that exposed 23 archives (about 8.6 GB) of more than 13 municipalities and ten
      other public bodies, and unauthenticated production API endpoints. A 120-thread crawler swept Swiss websites for IBANs,
      e-mail addresses and phone numbers. Controls that stopped the same agent were MFA (TOTP brute force failed), IP
      allowlisting (49 hostnames found, none reachable) and server-side business validation. The operation ended when the
      model API key was revoked on 14 November; implants already placed beaconed until 15 November. SOCRadar assesses him as
      low-capability operating a high-capability tool and ties the toolchain to BlackHatSect0r, a French-speaking collective
      it tracks as an agentic actor; the Swiss targets are not named and SOCRadar says affected organizations were notified.
    region_nexus: "switzerland (among the three main target countries; Swiss websites crawled for IBANs); the municipal archives are tied to Belgium (the one compromised storage server drove the Belgian share) and no Swiss victim is named"
    primary_sector_nexus: "direct: local government is the dominant target class by volume; a shared IT provider's storage server exposed the archives of 13+ municipalities and 10 public bodies (Belgium); Swiss communes use shared IT providers the same way"
    sector: "public-sector"
    cves: [CVE-2023-38646]
    techniques: [T1190, T1078, T1110.001, T1552.001, T1595.002, T1596.003, T1589.002, T1213, T1005, T1567, T1059.001, T1053.005, T1546, T1547.001, T1036.005, T1685, T1584.004, T1587.001, T1585.002, T1657]   # SOCRadar's own ATT&CK table
    affected_products: ["Metabase", "Hermes Agent (agent framework abused by the operator)"]
    entity_keys: ["tool:hermes-ai-agent", "product:metabase"]
    new_entities:
      - { key: "actor:babidighost", type: actor, name: "BabidiGhost", aliases: ["Babidi"], summary: "French-speaking low-skill operator SOCRadar assesses as running a jailbroken BlackHatSect0r-toolchain AI agent against European banks, an insurer, payment providers and municipalities from 2026-11-06 to 2026-11-14 (SOCRadar, 2026-11-20)." }
      - { key: "actor:blackhatsect0r", type: actor, name: "BlackHatSect0r", aliases: ["BlackHatSect0r && DXQRTXX", "GHOSTHUNTERS"], summary: "French-speaking collective SOCRadar tracks as an agentic threat actor, active since February 2026, that strips an AI agent of its refusals and drives automated scanning and data theft for extortion (SOCRadar, 2026-11-20; first documented by SOCRadar on 2026-09-16)." }
    relation_suggestions:
      - { subject: "actor:babidighost", object: "actor:blackhatsect0r", basis: "SOCRadar: BabidiGhost runs the BlackHatSect0r agent toolchain (same agent, model and jailbreak) but has none of the group's other capabilities (SOCRadar, 2026-11-20)" }
      - { subject: "actor:babidighost", object: "tool:hermes-ai-agent", basis: "SOCRadar: a hermes command launched the Hermes agent framework on the staging server (SOCRadar, 2026-11-20)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 3 }   # discoverer's own reconstruction from an exposed server; no independent second source found
    novelty: new
    lookback: true
    domain_overlap_note: "Research-lab content (S3 territory) surfaced from an S4 feed lead; no S3 return mentions it at the time of writing."
    evidence:
      - quote: "The agent targeted more than 50 organizations and datasets, mostly in Belgium, France and Switzerland."
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
      - quote: "One credential opened every client’s data."
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
      - quote: "a 120-thread crawler swept Swiss websites for international bank account numbers (IBANs), emails and phone numbers"
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
      - quote: "MFA, IP allowlisting and server-side validation stopped the same agent that exported an insurer’s customer database"
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/babidighost-ai-augmented-cybercrime/"
    extended_notes: |
      Exposure: internet-facing analytics/BI tools (Metabase before the CVE-2023-38646 fix), storage-management interfaces of
      shared IT providers, API documentation and test portals reachable without authentication, bank-style sign-in flows that
      leak whether an account exists, and SMS-sending functions without authentication or rate limits. Detection (telemetry
      classes, SOCRadar's guidance): web/proxy/identity/application logs for the 5 to 17 November window; PowerShell beacon
      files staged in the Windows temp directory, Run-key and scheduled-task entries masquerading as a Windows Update service,
      unexpected Defender exclusions, outbound TCP to an odd high port; PostgreSQL trigger inventory for entries that relaunch
      code on insert; servers making continuous calls to a model-provider API or to the Telegram bot API with no business
      reason. Triage: a BI tool opening its own database connection is normal; the discriminator is OS command execution as a
      child of the BI service process or secrets read from its environment. Hardening: remove analytics and storage consoles
      from the internet or put them behind allowlists, strong admin passwords with MFA, no database superuser secrets in
      process environments. Provider-chain lesson for communes: one weak credential on a shared provider's storage opened
      every client's data (as in the Swiss pension-fund supplier cases already in the store).
