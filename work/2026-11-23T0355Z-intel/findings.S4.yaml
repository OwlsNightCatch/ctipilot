  - title: "Optimizely script poisoning reached Zattoo, a Swiss streaming provider: its pages ran the injected code for about five hours on 2026-11-16"
    sources:
      - { url: "https://www.ictjournal.ch/news/2026-11-20/en-bref-zattoo-subit-une-cyberattaque-les-agents-chatgpt-font-leurs-achats-hotels", publisher: "ICTjournal", date: "2026-11-20", role: "primary" }
      - { url: "https://borncity.com/blog/2026/11/21/sicherheit-news-zum-21-nov-2026-zattoo-ki-agenten-etc/", publisher: "Borns IT- und Windows-Blog (relays Zattoo's customer e-mail)", date: "2026-11-21", role: "corroborating" }
    discovery_trace: "first seen at: ictjournal feed, URL https://www.ictjournal.ch/rss.xml -> article URL https://www.ictjournal.ch/news/2026-11-20/en-bref-zattoo-subit-une-cyberattaque-les-agents-chatgpt-font-leurs-achats-hotels -> corroborating: borncity URL https://borncity.com/blog/2026/11/21/sicherheit-news-zum-21-nov-2026-zattoo-ki-agenten-etc/ (Zattoo's own e-mail to customers, forwarded by a reader)"
    summary: |
      ICTjournal reports that Zattoo, the Swiss streaming service, is among the organizations named by Scott Helme (Report URI)
      as having served the malicious Optimizely scripts on 2026-11-16, alongside Zoom and the BBC. Borncity relays a Zattoo
      customer e-mail: Zattoo uses Optimizely to test pages on zattoo.com; an unauthorized person exploited an Optimizely
      vulnerability on 2026-11-16 and injected malicious code into the scripts Optimizely delivers to many large websites; the
      code could run in visitors' browsers between 12:05 and 17:06 CET; Zattoo paused all Optimizely experiments on 2026-11-17
      and so far has no indication that accounts, passwords or payment data of the people it informed were affected; part of
      the malicious code targeted iOS 18.6 and older, so it advises updating iPhones and iPads. This is the first named Swiss
      victim in the OptimJack entry's coverage.
    region_nexus: "switzerland (company); global campaign"
    primary_sector_nexus: "none direct (media company); relevant only as Swiss exposure to the OptimJack campaign"
    sector: "media"
    cves: []
    techniques: [T1195.002, T1189]
    affected_products: ["Optimizely Web Experimentation"]
    entity_keys: ["product:optimizely"]
    new_entities: []
