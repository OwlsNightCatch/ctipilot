      - { key: "product:gl-inet-goodcloud", type: product, name: "GL.iNet GoodCloud", aliases: [], summary: "GL.iNet's cloud remote-management service for its routers and KVM devices (GL.iNet, 2026-11-20)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    suggested_classification: { reliability: A, credibility: 2 }   # vendor notice is first-party; vector (code reading) is one researcher's claim
    novelty: new
    lookback: false
    overlap_note: "S1 progress line mentions GL.iNet as a news lead; main agent should merge if S1 returns it."
    evidence:
      - quote: "An unauthorized party exploited the vulnerability to access and install malicious software on some GL.iNet routers and KVM devices."
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "The cloud-side fix alone does not remove malware from devices that were already infected; install the security firmware below to remove it."
        attribution: "GL.iNet"
        source_url: "https://www.gl-inet.com/en-us/blogs/blog/glinet-security-notice-2026-11-20"
      - quote: "GL.iNet has not disclosed how the attackers exploited its cloud platform, how many customers were impacted, or whether information was stolen from compromised devices."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-glinet-cloud-flaw-to-infect-routers-kvm-devices/"
      - quote: "Killing a process or reinstalling firmware does not undo a compromise."
        attribution: "RemoteToHome Consulting"
        source_url: "https://github.com/RemoteToHome-io/gl-security-incident-2026"
    extended_notes: |
      Exposure: any GL.iNet router or KVM that has GoodCloud switched on; read the model and firmware from the admin panel and
      compare with the minimum versions in the vendor notice. Detection (telemetry classes): process listings on the device
      (a cron-lookalike process started from a temporary directory; interactive shells or netcat-style outbound sessions),
      outbound connections from the router to unfamiliar hosts, startup-script and sysupgrade keep-list modifications, added
      SSH authorized keys, and a netstat that no longer shows everything. Do these checks before a reboot or upgrade - the
      remote shell and its traces do not survive a restart and an upgrade of an infected KVM removes the implant without
      keeping a copy (RemoteToHome). Post-patch compromise check: treat every credential stored on a hit device (VPN client
      profiles, SSH keys, API keys) as read and revoke the access server-side; for KVMs also inspect the controlled computer.
      Vendor and researcher disagree on clean-up (vendor: firmware update removes the malware, settings can be kept;
      RemoteToHome: partial clean-up, reinstall with settings not kept). Triage: a vendor-published single indicator is
      reported as absent on every router the researcher checked, so a clean result on that one check says little.
      A second, older persistent backdoor on 49 routers (file dates from September 2025) is reported by RemoteToHome and
      forum users and is not confirmed by GL.iNet as related. RemoteToHome withholds one further cloud-client weakness
      reported to the vendor on 2026-11-22.
