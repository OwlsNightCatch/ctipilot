    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/", publisher: "BleepingComputer (carries Microsoft's tenant notification and an on-record Microsoft statement)", date: "2026-11-21", role: "primary" }
      - { url: "https://borncity.com/blog/2026/11/21/sicherheitsvorfall-bei-microsoft-entra-connect-health-21-11-2026/", publisher: "Borns IT- und Windows-Blog (relays the same notification text)", date: "2026-11-21", role: "corroborating" }
    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/11/21/sicherheitsvorfall-bei-microsoft-entra-connect-health-21-11-2026/ (feed https://borncity.com/blog/feed/) -> pivot: BleepingComputer feed https://www.bleepingcomputer.com/feed/ -> BleepingComputer article URL https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/ ; Microsoft's own notification is only on Reddit (r/sysadmin) and Azure Service Health, WebSearch could not find a Microsoft-hosted page"
    summary: |
      Microsoft told Entra tenant administrators (via Azure Service Health, text shared on Reddit and quoted by BleepingComputer
      and Borncity) that a vulnerability introduced on 2026-07-23 in the Entra Connect Health API was found on 2026-11-09 and
      fixed server-side on 2026-11-19, and that its investigation, concluded 2026-11-20, found unauthorized read-only access to
      tenant-level metadata for notified tenants. Exposed fields: e-mail addresses of tenant technical contacts and
      administrator accounts; tenant ID, display name, initial domain, country and region; Entra licence tier; directory
      synchronization status and last-sync time; Connect Health onboarding status; and an expired agent-registration
      certificate for a service retired in late 2024. Microsoft says no passwords, hashes, tokens, valid keys, on-premises
      topology or Azure subscription data was exposed and it found no unauthorized configuration changes, though the flaw could
      have allowed changes to Connect Health monitoring configuration. No software update or remediation is required; Microsoft
      advises alerting security teams and the tenant technical contact to targeted phishing and social engineering, phishing-
      resistant MFA and just-in-time activation for privileged accounts, and reviewing Entra audit and sign-in logs. It
      published a read-only PowerShell script that shows the current values of the exposed fields (not what was accessed).
      Microsoft has not said who exploited the flaw, how many tenants are affected or when access began; MSPs report one
      notification per managed tenant.
    region_nexus: "global; any hybrid Entra tenant with Connect Health onboarded, including Swiss federal, cantonal and communal tenants"
    primary_sector_nexus: "indirect: the exposed contact addresses are the privileged-account and technical-contact set a phishing or help-desk pretext against a public-sector tenant would target"
    sector: "technology"
    cves: []
    techniques: [T1190, T1589.002]   # T1566 deliberately not mapped: phishing is Microsoft's predicted follow-on risk, not observed behavior
