    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2 }
    novelty: "update-of:2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router"
    lookback: true
    borderline: true
    borderline_reason: "Two-sentence delta on an existing entry: names the first Swiss victim and gives the execution window; no new technical content, victim is not public sector."
    evidence:
      - quote: "Le service suisse de streaming Zattoo figure parmi les entreprises concernées, aux côtés de Zoom et de la BBC."
        attribution: "ICTjournal"
        source_url: "https://www.ictjournal.ch/news/2026-11-20/en-bref-zattoo-subit-une-cyberattaque-les-agents-chatgpt-font-leurs-achats-hotels"
      - quote: "Am 16. November 2026 konnte dieser Code zwischen 12:05 und 17:06 Uhr MEZ in den Browsern der Besucherinnen und Besucher der Zattoo-Website ausgeführt werden."
        attribution: "Zattoo (customer e-mail, via Borns IT- und Windows-Blog)"
        source_url: "https://borncity.com/blog/2026/11/21/sicherheit-news-zum-21-nov-2026-zattoo-ki-agenten-etc/"
    extended_notes: |
      The existing OptimJack entry carries regions [global, switzerland] but names no Swiss victim; this adds one.
