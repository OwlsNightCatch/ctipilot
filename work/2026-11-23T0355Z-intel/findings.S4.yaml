  # ------------------------------------------------------------------ 5
  - title: "BankWeaver: Forescout finds attackers swapping an anonymous token for an administrator token on exposed Temenos Quantum Fabric deployments and uploading Java web shells, after a confirmed bank-side breach"
    sources:
      - { url: "https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-banking-middleware-to-deploy-web-shells/", publisher: "Forescout Vedere Labs", date: "2026-11-19", role: "primary" }
      - { url: "https://borncity.com/blog/2026/11/21/bankweaver-angriff-auf-falsch-konfigurierte-banking-software/", publisher: "Borns IT- und Windows-Blog (discovery lead, relays Forescout)", date: "2026-11-21", role: "discovery" }
    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/11/21/bankweaver-angriff-auf-falsch-konfigurierte-banking-software/ (feed https://borncity.com/blog/feed/) -> primary: Forescout Vedere Labs, URL https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-banking-middleware-to-deploy-web-shells/"
    summary: |
      Forescout Vedere Labs, investigating a breach at a financial-services institution in early September 2026, found a
      campaign it names BankWeaver against Temenos Quantum Fabric (formerly Kony Fabric) deployments where a Fabric
      authentication service was configured for anonymous instead of private access and was reachable from the internet. The
      attacker takes the anonymous token the public Spotlight administration application issues, presents it to that service
      and receives a privileged Fabric token without credentials; with administrator rights the attacker imports a service
      through Fabric's integration mechanism that permits OS command injection, spawns reverse shells and downloads scripts
      from free file hosts, then registers two custom Java components: FabricShell (command execution and arbitrary database
      queries through a service endpoint) and FabricShadow (host fingerprinting and exfiltration from a pre-request hook).
      Forescout found six more banks in Asia, the Middle East, Europe and the Americas with the same exposure and
      configuration, with compromise not confirmed, and says traffic was relayed through other victims' servers and
      compromised home devices in the United Kingdom. Temenos, which Forescout notified, determined the behaviour was a
      configuration of the service as anonymous rather than private, released updates and guidance to make it private and
      advises restricting internet access to Spotlight and the Fabric administrative and authentication services. No actor is named.
    region_nexus: "global; Temenos is headquartered in Geneva and its Fabric platform is used by banks in Europe; Swiss customers not named"
    primary_sector_nexus: "indirect: Swiss technology supplier and bank (including cantonal-bank) middleware; no public-sector victim named"
    sector: "finance"
    cves: []
    techniques: [T1190, T1078, T1505.003, T1059.004]
    affected_products: ["Temenos Quantum Fabric", "Temenos Infinity Spotlight"]
    entity_keys: []
    new_entities:
      - { key: "campaign:bankweaver", type: campaign, name: "BankWeaver", aliases: [], summary: "Forescout's name for the campaign abusing an anonymously configured Temenos Quantum Fabric authentication service to obtain administrator tokens and deploy FabricShell and FabricShadow Java components (Forescout, 2026-11-19)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 3 }
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Research-lab item (S3/S1 territory) from an S4 lead. Swiss link is the vendor and bank middleware, no Swiss public-sector victim; single source (the discoverer). Included because a Geneva-based supplier's platform is exposed and the fix is a configuration change."
    evidence:
      - quote: "We identified a new campaign called BankWeaver that exploited an authentication service that was configured to accept anonymous access and was reachable from the internet."
        attribution: "Forescout Vedere Labs"
        source_url: "https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-banking-middleware-to-deploy-web-shells/"
      - quote: "Attackers could generate an anonymous token by accessing a public application and then exchange it for an administrator token on another exposed application."
        attribution: "Forescout Vedere Labs"
        source_url: "https://www.forescout.com/blog/bankweaver-campaign-abuses-digital-banking-middleware-to-deploy-web-shells/"
    extended_notes: |
      Exposure: Temenos Quantum Fabric / Infinity Spotlight deployments whose authentication service is set to anonymous
      app-user access and whose Spotlight or administrative routes answer from the internet. Detection (Forescout):
      anonymous application tokens presented to administrative or user-store authentication services; zip imports, JAR
      registration and other integration-import operations; Java or Tomcat parent processes spawning shell, downloader,
      archive or network-utility children; long-lived outbound sessions from application servers. Hardening: set the
      service to private access per Temenos guidance, take Spotlight and Fabric admin/authentication services off the internet.
