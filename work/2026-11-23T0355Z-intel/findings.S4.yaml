    summary: |
      N-able says a days-long worldwide disruption of its Mail Assure and SpamExperts Hosted Cloud services, which began on
      2026-11-16 and was first described as platform configuration and service dependencies, was a security incident: on
      2026-11-18 it confirmed unauthorized access to one server in the Hosted Cloud environment. It told SecurityWeek that the
      incident was isolated to a single web server where an unauthorized party may have been able to access certain
      credentials stored on the platform. Mail flow and filtering were not affected, but the management portal, API,
      quarantine, logging and mailbox-synchronization services were taken offline; N-able says it found no evidence customer
      data or mailboxes were compromised. Containment included taking the server offline, rotating internal platform
      credentials, revoking existing customer API tokens, invalidating OAuth tokens and resetting local-user passwords, so
      customer integrations that held tokens need re-issuing. N-able states the incident is unrelated to the earlier N-central
      incident (the 4EverAble2Shell/N-central flaws already in the store). No entry vector or actor is stated.
    region_nexus: "global; SpamExperts is widely used by European MSPs and hosters; Swiss public-sector use not established"
    primary_sector_nexus: "indirect: hosted e-mail security service run through MSPs; a supplier-chain exposure for administrations that buy mail filtering via a service provider"
