    summary: |
      Facts and claims (Sysdig, secondary analysis, no exploitation of its own seen): Apache released 2.4.71 on 2026-11-11 for CVE-2026-119618 in mod_http2 assign_headers() (2.4.55 to 2.4.70, HTTP/2 enabled, no authentication needed). Sysdig adds: two teams found it independently eight days apart (Anthropic's OSS Scanner, reported 2026-10-26, and Google Cloud Vulnerability Research, 2026-11-03, per the CVE record);
      a public proof of concept showing heap corruption appeared the day after disclosure but, as of the post, none for remote code execution, and no confirmed exploitation or KEV entry; Red Hat rates its RHEL 9 and 10 builds Important because each HTTP/2 stream uses a separate allocator that raises exploitation complexity; servers that were upgraded to 2.4.67 for May's CVE-2026-23918 are still in the affected range; and the same module released as mod_h2 is affected.
      Sysdig says its existing runtime detections caught every post-exploitation step in a simulated exploit. The store already carries the CVE, fixed versions and distribution packages; the dual discovery, the staged PoC state and the 2.4.67 exposure nuance are the delta.
