  # 6. Huntress: fake crypto-exchange ScreenConnect guest sessions (new)
  # ---------------------------------------------------------------------------
  - title: "Fake crypto-exchange machines in ScreenConnect consoles: Huntress finds 2,223 unauthorized Access sessions on 118 self-hosted servers at 109 accounts since 2026-11-03, kept online by a repeating operator and possibly bait for the CVE-2026-84869 technician-side flaw"
    sources:
      - { url: "https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect", publisher: "Huntress (John Hammond)", date: "2026-11-14", role: "primary" }
    discovery_trace: "first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (item https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect, dated 2026-11-14T01:50Z) -> primary (no pivot needed)"
    summary: |
      Facts (Huntress telemetry): on 2026-11-12 an MSP asked about unfamiliar machines in its self-hosted ScreenConnect console; Huntress then read the session database (App_Data\Session.db) on the ScreenConnect servers it could reach and counted 2,223 fake sessions on 118 servers across 109
      MSP and organization accounts (and 2,408 guest sessions with over 1,000 distinct names in another count in the same post), enrolled from 2026-11-03 to 2026-11-13. Each looks like an always-online computer named after a crypto exchange plus a role word, with an empty company field and a trading-desktop thumbnail.
      The MSP's server itself showed no web shell, suspicious child process or new account, so this is guest enrollment, not server compromise; the enrolment needs only the relay address embedded in the guest installer, which ScreenConnect serves without authentication by design (the first MSP's Access installer had been publicly downloadable and was scanned
      in mid-October). The operator revisited servers every 151 seconds and reconnected sessions about hourly, in the same order each day. Huntress observed no malicious activity from the sessions, only technician-side events: some technicians opened a session briefly, one used 'send text' twice (a possible credential exposure, since ScreenConnect does not retain sent text) and one queued a delete command that never returned output.
      Assessment (Huntress, stated as its leading hypothesis and not observed): the sessions are bait for technicians, to exploit the client-side file-transfer flaw CVE-2026-84869 on a technician workstation that runs an unpatched host client; it also cannot rule out keystroke capture. Huntress reports no overlap with SCKit indicators and judges the 'Joe Sandbox noise' explanation unlikely (no key sent, seven reused
      screenshot families, randomised hardware details, daily revisit order, week-long persistence). This is a separate cluster from the 2026-11-11 SCKit panel abuse.
