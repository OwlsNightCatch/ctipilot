  # 4. Elastic + Talos: agentic offensive frameworks, detection view (new / alt update-of ARTEX)
  # ---------------------------------------------------------------------------
  - title: "Agentic offensive frameworks from the defender's side: Elastic reads the source of ARTEX, CyberStrikeAI, Cairn, PentAGI and HexStrike (burst tempo, no authorization enforced, route-around when blocked) and Talos maps 2,500+ ARTEX-associated servers and the tools running beside them"
    sources:
      - { url: "https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex", publisher: "Elastic Security Labs", date: "2026-11-13", role: "primary" }
      - { url: "https://blog.talosintelligence.com/artex-and-beyond/", publisher: "Cisco Talos", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: talos, URL https://blog.talosintelligence.com/rss/ (item https://blog.talosintelligence.com/artex-and-beyond/) and elastic-seclabs, URL https://www.elastic.co/security-labs/rss/feed.xml (item https://www.elastic.co/security-labs/threat-command/agentic-offensive-frameworks-detection-artex) -> primary (no pivot needed for either); the campaign reporting both cite is already in the store"
    summary: |
      Facts and claims: Elastic Security Labs read the source of five agentic offensive frameworks (ARTEX, CyberStrikeAI, Cairn, PentAGI, HexStrike) and states that none enforces authorization in code by default; three tell the model it is authorized, and the only target restrictions active
      by default are blocklists for government domains in ARTEX and CyberStrikeAI and for education domains in ARTEX. Autonomy is the default (approval mode off or prompts disabled in four). Elastic cites GTIG for ARTEX execution bursts of roughly two to 25 seconds and NorForge for a Cairn
      cluster whose successful projects took just under 23 hours, so single bursts fit a short window but an operation needs a long lookback. When blocked, ARTEX and CyberStrikeAI change route (proxies, User-Agents, forwarding headers; GTIG via Wiz reports fallback to open proxies), so a source-address
      block must be paired with revoking the credentials in use; Elastic notes revocation propagation delays (AWS, Google, Entra access tokens valid 60 to 90 minutes without continuous access evaluation). Its table lists default observables per framework (scanner families such as nuclei, httpx, katana, ffuf and sqlmap run by
      ARTEX workers, framework default User-Agents, new accounts registered on applications then signed into from several sessions, CyberStrikeAI webshell and implant naming defaults, PentAGI connections to a high port range on the PentAGI host and a periodic update check, HexStrike's local Python tool server
      and XSS test marker), all of which Elastic says can change with the next release, and an ES|QL hunt that normalises User-Agents into tool families and flags one source with three or more families and 20 or more requests in a minute (needs baselining against build and monitoring automation).
      Cisco Talos (same day) reports ARTEX, published on GitHub in July 2026 under the pseudonym Autumn-27, in use by financially motivated actors and China-nexus actors, finds more than 700 reachable PentAGI instances on the internet, identified more than 2,500 ARTEX-associated C2 addresses and lists the tools co-present
      on them (ScopeWeaver and AntiFox as ARTEX derivatives, CyberStrikeAI, PentAGI, ScopeSentry, VShell, Nessus, Interactsh, Acunetix, fscan, NPS, AdaptixC2, Mimikatz, Cobalt Strike, Gophish, Chisel), with the caveat that co-occurrence does not prove ARTEX invoked each tool or that one actor ran them. Talos also notes ARTEX has demonstrated EDR bypass
      capabilities and recommends EDR tamper protection and independent telemetry. Both pieces restate campaign reporting already in the store (Storm-0940, VAPOR PANDA, Storm-3358, GTIG, Check Point, CERT-EU); the new material is the framework-internals and detection view.
    region_nexus: "global; ARTEX victims named in the underlying reporting include government ministries and telecommunications providers in 14+ countries"
    primary_sector_nexus: "indirect to direct (government is a named ARTEX target class in the cited campaign reporting; public-facing apps, identity and cloud are the attack surface)"
    sector: "cross-sector, public-sector"
    cves: []
