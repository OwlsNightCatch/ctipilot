  # ---------------------------------------------------------------------------
  - title: "Apache httpd CVE-2026-119618: Sysdig adds two independent finders eight days apart, a heap-corruption PoC but no RCE PoC as of 2026-11-13, and that servers upgraded to 2.4.67 for the May HTTP/2 flaw are still in range"
    sources:
      - { url: "https://www.sysdig.com/blog/httpd-cve-2026-119618-detecting-heap-corruption-and-rce-in-apache-http-server-mod-http2", publisher: "Sysdig Threat Research Team", date: "2026-11-13", role: "primary" }
