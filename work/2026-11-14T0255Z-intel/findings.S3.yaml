  # 1. Danfoss AK-SM800A: Midnight Blue six pre-auth RCEs + BSI/CCB warnings (update-of)
  # ---------------------------------------------------------------------------
  - title: "Danfoss AK-SM800A: Midnight Blue reports six pre-authentication stack overflows in firmware up to 5.3.2, one of them in the strict session-control front end; BSI and CCB warn that patching and strict mode do not close the exposure"
    sources:
      - { url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2", publisher: "BSI (IT-Sicherheitshinweis BITS-H 2026-306525, TLP:CLEAR)", date: "2026-11-13", role: "primary" }
      - { url: "https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action", publisher: "Centre for Cybersecurity Belgium", date: "2026-11-12", role: "primary" }
      - { url: "https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a", publisher: "Midnight Blue", date: "2026-11-07", role: "primary" }
      - { url: "https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html", publisher: "heise online", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html) -> pivot: BSI IT-Sicherheitshinweis PDF, URL https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2 (read with fetch_source pdf) -> pivot: CCB advisory, URL https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action -> primary: Midnight Blue research blog, URL https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a"
    summary: |
      Facts: Midnight Blue (blog dated 2026-11-07) reports that one of its researchers found six pre-authentication remote code execution
      flaws, all stack-based buffer overflows (the two examples Midnight Blue shows, redacted, rest on unbounded strcpy() calls), in the Danfoss AK-SM 800A web stack within about an hour of manual review of the latest
      firmware (5.3.2 at the time). At least one sits in sm_fcgi_app, the front end that implements Danfoss' "strict" session control (default since
      firmware 4.0), so enabling strict mode does not remove the pre-auth surface. The binaries ship without stack
      canaries or PIE, the exploited application runs as root, and the i.MX6 controller does not use secure boot, which Midnight Blue says would let an attacker with code execution plant
      a firmware-level implant that survives a factory reset and firmware update, or brick the unit (Midnight Blue frames both as feasible, not observed).
      Technical details are withheld while coordinated disclosure with Danfoss runs; no CVE ids exist. The Centre for Cybersecurity Belgium
      (2026-11-12) and the BSI (version 1.0 of 2026-11-13) republished it as warnings: affected firmware up to and including 5.3.2, no patch available at
      the time of the CCB text, and exposure removal must not wait for a patch. The BSI states nothing is known about active exploitation of these
      specific flaws and that the write-up may carry enough hints for attackers. heise reports that Danfoss released 5.4.0 on 2026-11-12 and that the BSI
      told heise it cannot rule out further flaws in 5.4.0 (a heise statement of a BSI statement; neither the BSI PDF nor Danfoss was read for 5.4.0).
      Disagreement worth surfacing: Midnight Blue argues against spending scarce effort on patching and for removing internet exposure, while the BSI still
      tells operators to check patch levels and update where available alongside isolating the devices; the CCB says firmware updates, changed passwords and
      strict session control are each insufficient alone. Context already in the store: the October attack waves on Danfoss and Copeland/Dixell refrigeration
      controllers (ANSSI, as recorded in the existing entry, said the attackers used elementary exposure and weak credentials, not these new flaws).
    region_nexus: "Europe (BSI, CCB warnings; France, Belgium and Germany victims in the attack waves); Switzerland already covered through NCSC-CH and retailer use in the existing entry"
    primary_sector_nexus: "indirect (OT building and cold-chain controllers; hospital, blood-bank, canteen and municipal cold storage)"
    sector: "retail, healthcare, public-sector (indirect)"
