        attribution: "Centre for Cybersecurity Belgium"
        source_url: "https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action"
      - quote: "Aktuellen Informationen zufolge sind die Firmwarestände bis mindestens 5.3.2 betroffen."
        attribution: "BSI"
        source_url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2"
      - quote: "Über eine bereits aktive Ausnutzung der gefundenen Schwachstellen ist nichts bekannt."
        attribution: "BSI"
        source_url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2"
      - quote: "Das BSI teilt uns mit, auch bei 5.4.0 Schwachstellen nicht ausschließen zu wollen."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html"
    extended_notes: |
      Exposure: AK-SM 800A units on firmware up to 5.3.2 whose web management (including the HTTPS port served through sm_fcgi_app) is reachable from the internet or through a 4G/5G
      modem installed by the refrigeration integrator; the CCB adds that a cellular modem alone is no protection. Detection (concept, telemetry class first): web access logs of the controller
      or an upstream proxy for unauthenticated POSTs with abnormally long parameters or User-Agent values to .cgi endpoints, and sm_app / sm_fcgi_app crashes or restarts (the redacted
      proof-of-concept descriptions use oversized fields; this hook is an inference from that description, no source states it as a detection). Post-patch / post-incident check: Midnight Blue
      says firmware-level implants could survive a factory reset and an update and cannot be ruled out without deep forensics; the CCB tells operators to check the whole configuration (temperature
      setpoints, defrost schedules, user accounts, remote-access settings) and to review contractual and insurance terms before cutting the provider's data uplink. Hardening: remove direct
      exposure (VPN, private APN or strict firewall-enforced allow list; Midnight Blue says geofencing and blacklists are not enough), inventory integrator modems. Potential impact classes
      Midnight Blue calls feasible (T1495 Firmware Corruption, T1542.001 System Firmware) are hypothetical and left out of techniques[]. CVE ids pending; do not invent.
