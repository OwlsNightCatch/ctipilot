      chain: a blank-subject email from a free mailbox carries a deliberately invalid PDF that crashes the viewer; soon after, the attacker phones, often a personal number, posing as IT support responding to a 'malicious email'; the employee joins a video call and shares the screen; the attacker has the user open Microsoft 365
