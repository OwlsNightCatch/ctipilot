  - title: "GeoVision camera and access-control software abused for SYSTEM-level PowerShell, a Defender-killing vulnerable driver, IFEO hijacks and an XMRig loader with a DHT-resolved C2: Huntress sees it at 13 organizations on 2026-11-08 to 10"
