  # 2. Kaspersky GERT BlackNevas vCenter / ESXi case (new, references 2026-11-07 Kaspersky entry)
  # ---------------------------------------------------------------------------
  - title: "Kaspersky GERT BlackNevas case: stolen credentials reach vCenter appliances, a fake VMware systemd service tunnels in, vCenter Host Profiles switch SSH on across the ESXi hosts, backups are destroyed first and a /vmfs wiper detonates ten days in"
    sources:
      - { url: "https://securelist.com/esxi-ransomware/121959/", publisher: "Kaspersky GERT (Securelist)", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist, URL https://securelist.com/feed/ (item https://securelist.com/esxi-ransomware/121959/) -> primary (no pivot needed); article body read with fetch_source extract (served through the reader)"
    summary: |
      Facts (Kaspersky GERT, one engagement, ransom notes named BlackNevas): over ten days the adversary destroyed four ESXi hosts, every VM on them, both vCenter Server Appliances
      and the connected backup infrastructure. No virtualization-layer vulnerability was exploited; every action against ESXi ran through legitimate VMware management interfaces.
      Credentials taken from non-virtualization systems inside the perimeter reached the VCSAs. On the disaster-recovery VCSA the attacker logged in as root over SSH, fetched MeshAgent through a
      shell script 43 seconds later, left after 2 min 26 s and never used SSH to that appliance again; about four hours later it returned through MeshAgent and installed a Ligolo-ng
      reverse tunnel as a systemd unit named like a VMware service (vmware-vdma.service, ExecStart under /opt/vmware/bin, description mimicking appliance housekeeping, Restart=always).
      Kaspersky then reconstructs vCenter Host Profile abuse from vpxa.log and vobd.log: a host-configuration read through the Host Profile workflow, a configuration push about ten minutes
      later that switched the TSM-SSH service on, the service reaching RUNNING 33 seconds after, and then direct SSH to the ESXi hosts from the vCenter appliance address, a source normally trusted
      on the management network. The payload reached ESXi over SFTP (Kaspersky read the SSH client identifier in auth.log as the Bitvise FlowSsh library, an identification it says rests on the
      recorded identifier), each command pair preceded by a session running only 'true'; an executable under /tmp ran a self-test about three hours before detonation, then was run against /vmfs with
      wipe, depth and detach switches that Kaspersky compares (medium confidence, no binary available) with the BlackNevas/Trigona family. All VMs on the disaster-recovery host stopped within 23 seconds and
      the first ~2 KB of virtual disk files were overwritten. Backups were attacked first: antivirus was disabled on the backup environment days earlier, backup services stopped, the recovery
      infrastructure encrypted and administrative access disrupted before the ESXi impact; the attacker also extracted stored credentials from the backup server. Kaspersky treats vCenter as Tier 0,
      lists four recurring access routes (exploited vCenter/ESXi flaws, Windows-estate credential reuse, Active Directory integration abuse such as CVE-2024-37085, backup servers as a credential bridge)
      and a ranked ESXi/vCenter log set to preserve (auth.log, shell.log, vpxa.log, vobd.log, vCenter Events and Tasks, hostprofiletrace.log, VCSA systemd units).
    region_nexus: "global; vCenter/ESXi estates are standard in Swiss federal, cantonal and communal data centres and at their suppliers"
    primary_sector_nexus: "direct (virtualised administration, hospital and emergency-service estates)"
    sector: "cross-sector, public-sector (direct)"
    cves: []
    techniques: [T1078.002, T1021.004, T1543.002, T1036.005, T1572, T1219, T1555, T1685, T1490, T1486]
    affected_products: ["VMware ESXi", "VMware vCenter Server"]
    entity_keys: ["actor:blacknevas", "product:vmware-esxi", "product:vmware-vcenter-server", "product:meshcentral-meshagent"]
    new_entities:
      - { key: "tool:ligolo-ng", type: tool, name: "Ligolo-ng", aliases: [], summary: "Open-source reverse-tunnelling tool that Kaspersky GERT found installed as a systemd service named like a VMware service on a vCenter Server Appliance in a BlackNevas ESXi destruction case (Kaspersky, 2026-11-13)." }
    relation_suggestions:
      - { subject: "actor:blacknevas", object: "tool:ligolo-ng", basis: "Kaspersky GERT: in the BlackNevas case Ligolo-ng was installed as a persistent systemd unit on the disaster-recovery vCenter appliance (Kaspersky, 2026-11-13); the ransom notes named BlackNevas, the toolset link is case-level, not a family-wide claim" }
      - { subject: "actor:blacknevas", object: "product:meshcentral-meshagent", basis: "Kaspersky GERT: MeshAgent was the first persistence layer on the compromised vCenter appliance in the BlackNevas case (Kaspersky, 2026-11-13)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Every action taken against ESXi was executed through legitimate VMware management interfaces."
        attribution: "Kaspersky GERT"
        source_url: "https://securelist.com/esxi-ransomware/121959/"
      - quote: "In this incident, the adversary used Host Profiles to change TSM-SSH service state to enable SSH on target ESXi hosts."
        attribution: "Kaspersky GERT"
        source_url: "https://securelist.com/esxi-ransomware/121959/"
      - quote: "An alert should be generated when Host Profile compliance (or remediation in VMware terms) changes TSM or TSM-SSH configuration outside an approved window, particularly when followed by a new SSH session from vCenter or another management appliance."
        attribution: "Kaspersky GERT"
        source_url: "https://securelist.com/esxi-ransomware/121959/"
      - quote: "The attacker disabled antivirus protection on the backup environment days before the main attack, and later stopped backup services, encrypted the recovery infrastructure, and disrupted administrative access"
        attribution: "Kaspersky GERT"
        source_url: "https://securelist.com/esxi-ransomware/121959/"
    extended_notes: |
      Relationship to the store: entry 2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password covers a different Kaspersky GERT BlackNevas case (PRTG-held root password reused across ESXi hosts, October 2025);
      this is a separate engagement with a different access path and a management-plane trick, so a new entry with that one in references[] fits, but the main agent may prefer to fold it as an update on the same actor series.
      Detection (telemetry class first): vCenter Events/Tasks and vpxa.log/vobd.log for Host Profile remediation that changes TSM or TSM-SSH outside a change window, followed within about 15 minutes by an SSH session to the same
      ESXi host that originates from vCenter or another management appliance (Kaspersky rates this sequence critical, each step being legitimate alone); auth.log client identifier anomalies and sessions running only 'true' followed by
      exec/chmod; shell.log executable staged under /tmp then a short self-test run, then access to /vmfs; many VM power-offs or world kills inside seconds; new or changed systemd units on VCSA referencing a non-baselined binary under
      a VMware-like path; vobd.log changes to the execInstalledOnly option or a lowered host acceptance level; backup-first sequence (AV disabled, backup services stopped) before hypervisor changes. Benign lookalike (Kaspersky): custom
      VMware integrations may exist, so an unrecognised VMware-looking service is a high-confidence anomaly only against the organisation's own trusted-service list; true-only SSH probes can also come from other automation. Post-incident:
      do not reboot ESXi first (ramdisk logs vanish), export vCenter Events/Tasks, Host Profile definitions and SSO audit before remediation; restore execInstalledOnly and acceptance level only after evidence collection. Hardening: vCenter as Tier 0
      with dedicated identities and phishing-resistant MFA, no broad domain-admin reuse for virtualization, Lockdown Mode and narrow management network, remote syslog outside the virtualization trust domain, independent backup identities and a tested
      recovery path that assumes vCenter and production AD are gone. Indicators were published by Kaspersky and are deliberately omitted.
