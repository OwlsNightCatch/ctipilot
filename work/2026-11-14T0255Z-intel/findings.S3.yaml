    summary: |
      Facts (Microsoft Threat Intelligence, 2026-11-13): Microsoft confirms ConnectWise's report of unauthorized access to cloud-hosted ScreenConnect instances of MSPs from 2026-11-11 and adds its own analysis of the SCKit worm.
      Deployment runs through the MSP's management instance: a command on the customer endpoint starts cmd.exe, curl downloads a ScreenConnect client MSI from an attacker-controlled ScreenConnect server to C:\Windows\Temp, and msiexec installs it silently,
      creating a second, attacker-owned remote-access channel; a batch launcher then fetches a PowerShell decoder that derives a per-machine key (MachineGuid, a server-supplied half and salt, PBKDF2, AES-256-CBC, GZip) and unpacks the toolkit under %TEMP%.
      New in this report: RelayTrap, a component built on the endpoint: a watcher that polls every 10 seconds enumerates the installed ScreenConnect clients and compiles, with the .NET C# compiler, a malicious replacement for each (reusing that client's connection details); persistence is a machine-wide Run
      value plus a scheduled task, with scripts under C:\ProgramData\RelayTrap, and RelayTrap is designed to push the batch launcher into a technician's session when a technician with a vulnerable host client connects; ConnectWise says client 26.6.5 and later blocks that endpoint-to-technician transfer
      (the CVE-2026-84869 fix of 2026-09-08). Separately SCKit looks for the .ASPXAUTH cookie in Chrome, Edge, Opera and Opera GX profiles (database copy with shadow-copy fallback and DPAPI/AES-GCM decryption, or a memory scan of the browser network-service process) and
      combines it with anti-forgery and access tokens to enumerate the technician's sessions, upload a payload with a bundled uploader and queue it through the Shared Toolbox, then delete the Toolbox item. Defender exclusions are written for staged MSI copies. Microsoft states that removing
      an unauthorized client alone does not remove the toolkit's persistence or invalidate exposed web sessions, tells responders to investigate through an out-of-band channel (Defender for Endpoint live response) rather than ScreenConnect, and says the RMM+ extension family (versions 1.0.31 and 1.0.32 accepted an empty key when none was configured, per ConnectWise's advisory) remains an
      investigated server-side entry route, not a confirmed one. The existing entry covers the Run Command deployment and the RMM+ CVE-2026-127063 explanation; RelayTrap, the technician-targeting design and the cookie theft are new.
