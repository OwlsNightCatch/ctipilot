      Exposure: self-hosted or cloud-hosted ScreenConnect with Access installer links reachable without authentication; technician workstations running a host client older than 26.6.5. Detection: server database / console view for new Access guests with empty company and site fields, exchange-and-role names, empty guest public key on Windows guests, and a guest
      version string Huntress says all fakes claim; many new guests from one external address in a short window; on technician workstations the ScreenConnect Windows client spawning cmd.exe, powershell.exe, wscript.exe or msiexec.exe with a file under the user's ScreenConnect Temp folder (host-side shape of CVE-2026-84869 exploitation). Triage: a fake alone shows reachability, not exposure; separate technician-side from guest-side file events,
      and treat a guest-side file event during a technician connection as the exploit indicator. Preserve Session.db and its WAL before deleting fakes. Hardening: restrict installer and web access where supported, keep Access installer links private and rebuild leaked installers, update host clients, bar technicians from joining sessions they cannot tie to a customer, put unfamiliar sessions into a group technicians do not browse. IPs, thumbnails hashes and the host key fingerprint
