  # 3. Elastic: CyberStrikeAI used against AWS (new)
  # ---------------------------------------------------------------------------
  - title: "CyberStrikeAI turned on AWS: Elastic reads one server's 16 days across eight identities in four accounts, 56 userData reads in 141 milliseconds, and why six detections each fired low and only the source address tied them together"
    sources:
      - { url: "https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion", publisher: "Elastic Security Labs", date: "2026-11-13", role: "primary" }
      - { url: "https://www.team-cymru.com/post/tracking-cyberstrikeai-usage", publisher: "Team Cymru", date: "2026-03-02", role: "background" }
    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs/rss/feed.xml (item https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion) -> primary (no pivot needed); background tool profile: Team Cymru, URL https://www.team-cymru.com/post/tracking-cyberstrikeai-usage (linked from the Elastic references)"
    summary: |
      Facts (Elastic Security Labs, own telemetry): between 2026-09-30 and 2026-10-16 one CyberStrikeAI server used credentials of eight AWS identities (five IAM users, three EC2 instance roles) across four accounts and produced 78 alerts
      from six detection rules; 65 came on day one. The sequence: GetCallerIdentity across several users and accounts (three calls in one second), GetSessionToken, GetSecretValue on Secrets Manager, then 56 DescribeInstanceAttribute calls
      for userData from one instance-role session in 141 ms, a non-production role pulling secrets, a role decrypting an SSM SecureString parameter and issuing SSM SendCommand 29 seconds later (the audit log does not show the command or its result), and a return
      after 14 quiet days that revalidated credentials and touched a fourth account. Instance-role sessions used from an external address mean the credentials were lifted from the instances (SSRF or host compromise, Elastic infers). Elastic attributes the server to
      CyberStrikeAI through scan data (default port 8080 page title and a self-signed certificate issued 2026-09-15) and calls the case AI-assisted on tool attribution and machine-speed behavior, saying it cannot prove a model made the decisions and does not know how the
      credentials were obtained; it says this is the first case it has seen of the tooling used against AWS (Elastic cites a Team Cymru count of 21 addresses running it in early 2026, all aimed at Fortinet edge devices). Analysis: every alert was medium or low and only the shared source address made them one
      intrusion, so fixed correlation windows split it; Elastic added two high-signal rules (one principal and source reading userData from more than 20 distinct instances in 10 minutes; three or more distinct non-role identities calling GetCallerIdentity from one external
      address and ASN in 10 minutes) and a PoC response workflow that deactivates the access key, denies older sessions by token issue time and quarantines the IAM user.
    region_nexus: "global (AWS tenants; unnamed victims)"
    primary_sector_nexus: "indirect (any cloud estate holding long-lived IAM keys or EC2 role credentials)"
    sector: "cross-sector (cloud)"
    cves: []
    techniques: [T1078.004, T1087.004, T1552.005, T1555.006, T1651]
    affected_products: ["Amazon Web Services IAM", "AWS Secrets Manager", "AWS Systems Manager Parameter Store", "Amazon EC2"]
    entity_keys: ["product:aws-secrets-manager", "product:aws-systems-manager-parameter-store"]
    new_entities:
      - { key: "tool:cyberstrikeai", type: tool, name: "CyberStrikeAI", aliases: [], summary: "Open-source Go platform that pairs LLM agents with 100+ offensive security tools and an operator console; Team Cymru tracks its usage (Team Cymru, 2026-03-02; Elastic cites a count of 21 addresses aimed at Fortinet edge devices in early 2026) and Elastic reports the first case of it used against AWS accounts (Elastic Security Labs, 2026-11-13)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This is the first case we have seen of the same tooling turned on AWS."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"
      - quote: "We cannot prove an LLM agent was making the decisions, and we do not know how the attacker obtained the credentials."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"
      - quote: "Only the shared source IP showed they belonged to one intrusion."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"
    extended_notes: |
      Single vendor source with its own telemetry; the tool attribution rests on scan-data fingerprints Elastic itself says are now stale (none of the three servers serves the interface any more). Detection (cloud control-plane audit class first):
      CloudTrail bursts of ec2:DescribeInstanceAttribute for userData from one principal and source; first-time GetCallerIdentity calls from one external address across several identities within a minute; GetSessionToken or GetSecretValue from an instance-role session whose
      source address is neither the instance nor your NAT; GetParameter with decryption followed within a minute by SSM SendCommand from the same role. Correlate medium and low alerts by source address over a window of weeks, not minutes. Triage / benign lookalike: legitimate
      automation (config management, backup, inventory) also reads userData and secrets in bulk, so baseline per role and compare the source address with the instance or NAT. Hardening: restrict ec2:DescribeInstanceAttribute for userData to the roles that need it (IAM or SCP), keep secrets
      out of user data, enforce IMDSv2 and review SSRF exposure, rotate long-lived service-account keys, treat non-production role secrets as production-reachable. Post-compromise: replacing the instance profile or instance is the rotation for stolen role credentials; review SSM command history around
      any rare-user SendCommand. IPs and certificate fingerprints in the source are deliberately omitted.
