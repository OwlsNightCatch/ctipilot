    summary: |
      Facts (Huntress SOC telemetry): mostly between 2026-11-08 and 2026-11-10, malicious activity at 13 organizations (ten accounts) all stemmed from GeoStartupAgentService.exe, mostly running as SYSTEM, on endpoints whose external addresses Shodan ties to publicly exposed GeoVision devices or management interfaces; the initial exploit is not named and no CVE is cited. The service spawned
      cmd.exe running a PowerShell download cradle; three scripts followed: one checked writable folders and whether Defender was active, one (written to disk and launched through WMI) dropped a signed vulnerable kernel driver known from earlier BYOVD abuse (wsftprm.sys) to tamper with Defender, and the third loaded a custom Go loader. Huntress also saw three IFEO Debugger values that redirect
      MsMpEng.exe, SecurityHealthService.exe and SecurityHealthSystray.exe to systray.exe. The loader finds its server through the BitTorrent mainline DHT and a PKARR public-key resolver (so the operator can move infrastructure without a domain), persists as scheduled tasks named PackageUpdater (every 15 minutes) and PackageUpdater_Startup, and downloads XMRig. Mitigation: remove public access to GeoVision devices and
      management interfaces (VPN or allow list). Huntress adds that it has seen several earlier incidents against camera management software and says to treat such software as part of the enterprise attack surface. Impact seen is a cryptominer; the foothold is SYSTEM on a host running physical-security software.
