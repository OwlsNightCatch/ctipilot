  # ---------------------------------------------------------------------------
  # 11. Project Zero disclosure policy (borderline)
  # ---------------------------------------------------------------------------
  - title: "Project Zero moves to 'Full 90', then 60 days from 2027-02-02 and 30 days from 2028-01-03: disclosure after the stated number of days regardless of fix, no grace period, on the stated premise that LLMs have made zero patch-to-exploitation time a reasonable model of attackers"
    sources:
      - { url: "https://projectzero.google/2026/11/disclosure-policy.html", publisher: "Google Project Zero (Natalie Silvanovich)", date: "2026-11-13", role: "primary" }
    discovery_trace: "first seen at: projectzero, URL https://projectzero.google/feed.xml (item https://projectzero.google/2026/11/disclosure-policy.html) -> primary (no pivot needed)"
    summary: |
      Facts (Project Zero's own announcement): the previous '90 + 30' policy (90 days to fix plus 30 days of soak time) is replaced from 2026-11-13 by 'Full 90', i.e. details are disclosed 90 days after the report; on 2027-02-02 the period becomes 60 days and on 2028-01-03 30 days. The grace period and variant policy are removed; exceptions remain only for vulnerabilities exploited in the wild (handled under Google's application-security
      disclosure policy), vulnerabilities already public, and disclosure at the vendor's request. Project Zero will still track whether bugs are fixed but this no longer decides disclosure. Stated rationale (its assessment): LLM-assisted discovery raises both the volume (several vulnerabilities a week where it once found a few a year) and the chance that malicious parties find the same bug, and zero patch-to-exploitation time is 'a reasonable, though imperfect, model of attacker behavior', so patch soak time
      and a long patch gap no longer protect users. Hardware keeps case-by-case exceptions (Spectre, Meltdown class). Vendors were consulted and asked for a gradual transition. Implication for defenders (inference, not stated by Project Zero): details of unfixed Project Zero findings will reach the public sooner, so patch-to-exploit planning should assume days, not weeks, for products Project Zero covers (Apple, Google, Microsoft, Linux, browsers and similar).
    region_nexus: "global policy"
    primary_sector_nexus: "indirect (patch-latency planning for widely used vendor products)"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
