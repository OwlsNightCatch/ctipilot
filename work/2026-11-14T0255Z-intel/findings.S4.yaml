    extended_notes: |
      Why it is borderline (main agent's call): no Swiss use of Quantum Systems products turned up (armasuisse search returned only Elbit/RUAG-related procurement; absence is not proof), the way in to the update server and the malware's function are unpublished, and no actor is named, so the incident floor is met only on behavior (a poisoned update pushed through a vendor's own distribution server to military customers, caught before it reached the aircraft, with an operational stand-down). It clears PD-11(b) as a transferable defence-supply-chain technique read, and BfV's July warning (relayed by DroneXL and WinFuture) that Russian cyber, espionage and sabotage risk to German defence firms supporting Ukraine is raised is the (d)-style shared-threat context. Suggested rating: Admiralty B2 (reputable outlets plus dpa, company statement relayed; update-server mechanism rests on Spiegel, FT and SZ citing unnamed sources and is not confirmed by the company). Suggested priority: routine at most.
      Triage-ready behavior the sources support: malware staged on a vendor update-distribution server and presented as a normal update of customer-side ground-station software; the customer-side check (not further described) flagged it, and the company says only the Bundeswehr stopped operations. For defenders of comparable military or public-sector ground-control and planning software: provenance verification of vendor update packages outside the vendor's own channel (signature and out-of-band hash comparison), process-creation and egress telemetry from ground-station workstations that applied an update in the late-October window, and a vendor notification route are the levers the story suggests; no source states indicators. DroneXL notes no report says the file was installed on a mission-planning computer. The company page https://quantum-systems.com/news/cyberattack-defeated/ was unreachable on every transport, and the FT and Reuters pages were blocked; every company quote here is relayed through Handelsblatt, BR24 and BleepingComputer. WinFuture (https://winfuture.de/news,162653.html, fetched, extraction garbled umlauts so not quoted) adds that QBase 3D is the Trinity Pro survey-drone variant and that the company believes its support for Ukraine made it a target.
  - title: "Danfoss AK-SM 800A: CCB and BSI relay Midnight Blue's six pre-authentication RCE flaws in firmware up to 5.3.2 (no CVEs, no patch), say removing internet exposure cannot wait, and BSI cannot rule out flaws in the 5.4.0 release of 2026-11-12"
    sources:
