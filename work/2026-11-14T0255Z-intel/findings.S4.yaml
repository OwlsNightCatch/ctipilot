      - { url: "https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a", publisher: "Midnight Blue (page metadata date; the CCB relays it on 2026-11-12)", date: "2026-11-07", role: "primary" }
      - { url: "https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html", publisher: "heise online", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, feed https://www.heise.de/security/feed.xml (item 'Supermarkt-Angriffe: Danfoss-Kuehlsteuerungen blieben trotz Updates angreifbar') → drill: https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html → pivot: BSI warning PDF https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2 (read with the bridge pdf subcommand) → pivot: CCB advisory https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action (named in the BSI references) → primary: Midnight Blue https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a. Dedup: the covered entry has no Midnight Blue content (grep of the entry file for 'midnight' returns 0)."
    summary: |
      The Belgian CCB on 2026-11-12 and the German BSI on 2026-11-13 relayed research by Midnight Blue that the newest Danfoss AK-SM 800A firmware available when it was written, 5.3.2, contains six pre-authentication remote-code-execution flaws, stack-based buffer overflows that researcher Carlo Meijer says he found in under an hour of manual review; no CVE identifiers exist yet, coordinated disclosure with Danfoss was ongoing and the CCB says no patch was available. The research also reports a flaw in the session-control mechanism itself, so the "strict" session mode does not remove the risk, and the controller does not use the i.MX6 secure-boot features, so an attacker with code execution could keep access across a factory reset or push firmware that bricks the device and forces replacement. Midnight Blue, the CCB and the BSI therefore state that removing direct internet exposure (VPN, private APN or a restrictive source-IP allowlist) is the real fix and must not wait for patches, even on updated, password-changed controllers; this adds to the covered entry's advice to apply the available AK-SM 800A updates. The BSI says nothing is known about active exploitation of the six flaws, so they are not tied to the attack waves, and, per heise, it cannot rule out further flaws in the 5.4.0 release of 2026-11-12. The BSI notes the CCB had confirmed the finds on 2026-11-12; the technical claim itself traces to Midnight Blue alone, and Danfoss has not published a response in any source read.
    region_nexus: "Belgium, Germany, France and Switzerland (BACS already stated Switzerland is affected in the covered entry); no Swiss-specific update from BACS found in this run"
