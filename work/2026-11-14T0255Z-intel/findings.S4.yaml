    summary: |
      Quantum Systems (Gilching, Bavaria), maker of the Vector reconnaissance drone that the Bundeswehr operates as FALKE, said on the evening of 2026-11-12 that its security teams found an active cyberattack by "hostile actors" at the end of October and contained it with the authorities; the statement is relayed by Reuters/Handelsblatt and BR24, because the company page itself could not be read. Der Spiegel (paywalled; only its page description was readable) and the Financial Times report, citing unnamed sources, that the attackers put malware on an internal update server and disguised it as a regular update of QBase, the ground-control and mission-planning software used with Vector, and dpa adds that Sueddeutsche Zeitung also reports malware on an update server. Press accounts say the tampered update reached servers of the Bundeswehr and other customers but not the aircraft, because a check flagged it; the company says the Bundeswehr was the only customer that stopped flying as a precaution, while Spiegel (via secondary reports) says the whole fleet was grounded for a time, so the scope of the grounding is contested. No attacker is named: the company says only "hostile actors", dpa notes nobody has publicly named Russia, and BR24 cites unnamed "security circles" who lean towards a Russian background, which is an unattributed inference and not an attribution; Spiegel tags the piece "GRU" but its readable text makes no such claim. Only BR24 states that the malware would have infected the drones at update time to disable them; DroneXL notes that the FT, Handelsblatt, dpa-AFX and the Spiegel agency summaries do not say what the malware was built to do. The Generalstaatsanwaltschaft Bamberg (Zentralstelle Cybercrime with the Bavarian LKA) investigates against unknown persons, and Spiegel reports that MAD, BfV and BSI are involved. How the attackers reached the update server and what the malware does are unpublished, and no indicators or customer remediation guidance are public.
    region_nexus: "Germany (Bavaria); no Swiss customer of Vector or QBase shown. Relevance to the Swiss Armed Forces and armasuisse supplier base is the defence-supply-chain pattern (update channel of a military ground-control product), not a shown Swiss exposure."
