        source_url: "https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action"
      - quote: "Removing direct public internet exposure is the immediate priority and must not be delayed while awaiting patches."
        attribution: "Centre for Cybersecurity Belgium"
        source_url: "https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action"
      - quote: "Über eine bereits aktive Ausnutzung der gefundenen Schwachstellen ist nichts bekannt."
        attribution: "BSI"
        source_url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile&v=2"
      - quote: "Das BSI teilt uns mit, auch bei 5.4.0 Schwachstellen nicht ausschließen zu wollen."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Supermarkt-Angriffe-Danfoss-Kuehlsteuerungen-blieben-trotz-Updates-angreifbar-11524376.html"
      - quote: "Due to the lack of secure boot, an attacker with RCE could push malicious firmware that simply renders the device inoperable and irrecoverable without specialized hardware intervention"
        attribution: "Midnight Blue"
        source_url: "https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a"
    extended_notes: |
      Delta against the covered entry (last changelog 2026-11-11): its summary says BACS repeated that security updates for the AK-SM 800A and 8xxA family exist and that newer firmware enforces HTTPS; the new sources say updates, changed default passwords and strict session mode are insufficient, firmware up to 5.3.2 carries six unpatched pre-authentication RCE flaws, and the BSI will not vouch for 5.4.0. The Midnight Blue page metadata is dated 2026-11-07 while the CCB advisory (2026-11-12) calls the research new and the BSI dates its own notice 2026-11-13, so the in-window primary is the BSI notice and heise report of 2026-11-13.
      Post-patch compromise check the sources give: CCB says to check the entire configuration, particularly temperature settings, defrost schedules, user accounts and remote-access settings; BSI says to rotate all credentials on suspicion and to check devices connected to the controllers for correct operation; Midnight Blue says that without deep firmware forensics an implanted controller cannot be told apart even after a factory reset, and that a 4G or 5G modem alone is not a protection (CCB). Exposure test the CCB gives: identify every controller whose management interface is reachable from the public internet, including through integrator 4G/5G modems, and treat that as exposed regardless of firmware level. Contractual note from CCB: review service-provider and insurance requirements before cutting remote reporting, and arrange protected remote access so monitoring continues.
