      - { url: "https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268", publisher: "Beobachter", date: "2018-08-28", role: "background" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'Pager-Panne in Sachsen: Notrufmeldungen offenbar frei zugaenglich im Netz', 2026-11-12T15:19Z) → pivot: heise article, URL https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html → primary: DER SPIEGEL (S+ paywall; only the teaser was readable), URL https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b → background: Beobachter 2018, URL https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268 (found via WebSearch 'Pager Alarmierung Feuerwehr Rettungsdienst Schweiz POCSAG unverschluesselt ...'; read through the jina reader)."
    summary: |
      Per Spiegel (relayed by heise, which also queried the authority): unauthorised parties have for years been able to read, and
      someone republished on a social network, the radio messages sent to pagers of Saxon fire brigades, rescue services and civil
      protection; hundreds of messages a day, mostly the Leipzig area and the districts of Zwickau, Vogtland and Erzgebirge, with
      diagnoses, patient names and addresses. An informant told the Saxon interior ministry and LKA at the end of October without a
      reply and then went to the press. The LKA's cybercrime contact point (ZAC) told heise it learned of the matter on 2026-10-31
      and opened an investigation; the number of affected persons and the data volume are unknown. At least one rescue association
      (Rettungszweckverband Suedwestsachsen) now sends dispatch information without patient names and house numbers. Technical
      background (heise, from Spiegel): the pagers use the POCSAG protocol, which has no encryption of its own; the Saxon networks
      reportedly add IDEA (1990, 64-bit blocks), and the informant claims the keys are available in online forums (a claim, not
      confirmed). Swiss background (Beobachter, 2018-08-28, not current evidence): Swiss rescue and fire pager traffic was then
      unencrypted nationwide beyond the transmitter-to-mast leg and had been mirrored on a public website; whether that is still the case
      was not found in this run. Recency: the first reports (Spiegel 2026-11-11, heise 2026-11-12T15:19Z) fall about eight hours before the
      26 h window; no in-window follow-up was found.
    region_nexus: "germany (Saxony); transferable to Swiss emergency services (the 2018 Beobachter finding), current Swiss status not verified"
    primary_sector_nexus: "direct sector (emergency services: fire, EMS, civil protection) but not the Swiss constituency's own incident"
    sector: "emergency-services, public-sector, healthcare"
    cves: []
    techniques: [T1040]
