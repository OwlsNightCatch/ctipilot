    summary: |
      Delta for the covered refrigeration-controller entry; it changes what a patch-first reader does. Facts (BSI, 2026-11-13,
      criticality 3 / Orange, "Massnahmen muessen unverzueglich ergriffen werden"): Midnight Blue published on 2026-11-11 a report
      on six vulnerabilities in the Danfoss AK-SM 800A, affected firmware "bis mindestens 5.3.2", no fixed version listed, no CVE
      numbers assigned yet (coordinated disclosure with Danfoss ongoing), and "nichts bekannt" about exploitation. BSI's worst case:
      the controller has no secure-boot option, so an attacker with remote code execution could load malicious firmware, making the
      device unusable until manual recovery or replacement, with a long outage if many devices fall at once. Claims (Midnight Blue,
      the discoverer; technical details withheld): six stack-based buffer overflows giving pre-authentication remote code
      execution, found in under an hour of manual review of firmware freely downloadable from the vendor site; possible persistent
      access (possibly surviving reset) or persistent denial of service; Midnight Blue recommends against spending scarce effort on
      patching and says to remove internet exposure (VPN, private APN, restrictive IP allow-list). CCB (2026-11-12, relaying Midnight
      Blue): no patches were available at that time, and a further flaw in the session-control mechanism means 'strict' session mode
      does not remove the risk; updating firmware, changing default passwords and enabling strict sessions are each insufficient;
      a 4G/5G modem is not a security measure. heise (2026-11-13) reports that Danfoss released firmware 5.4.0 on 2026-11-12 and that
      BSI told heise it does not want to rule out vulnerabilities in 5.4.0 either - that 5.4.0 statement rests on heise alone (no
      Danfoss advisory for these flaws on its advisories page as fetched, and BSI's own note does not name 5.4.0). Context from
      Midnight Blue: public PoCs for earlier Danfoss CVEs appeared within 48 hours of the first French wave and preceded the
      second wave of 2026-11-02; Censys still shows hundreds of Danfoss and over a thousand Copeland/Dixell controllers exposed
      (Midnight Blue's figure, honeypots not excluded). Delta against the entry: BACS's 2026-11-10 warning (and the entry) lean on
      "update to current firmware"; as of this run no BACS/CSH statement on the six new flaws was found (CSH post 13054 last
      modified 2026-11-06).
