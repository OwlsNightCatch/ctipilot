    discovery_trace: "first seen at: inside-it-ch feed, URL https://www.inside-it.ch/rss.xml (item 'Europol legt drei Malware-Netzwerke lahm', 2026-11-13) → pivot: heise-sec feed item, URL https://www.heise.de/news/Operation-Endgame-Weltweiter-Schlag-gegen-Cybercrime-11524460.html → primary: Europol press release, URL https://www.europol.europa.eu/media-press/newsroom/news/64-million-victim-datasets-secured-in-international-operation-against-malware-networks (article body read from the page's embedded NodeLoader JSON via tools/fetch_source.py url --direct; extract and WebFetch return only the SPA shell). Europol's CMS node shows published 2026-11-12T13:00:01Z and updated 2026-11-13T17:00:01Z; the Swiss and German coverage is dated 2026-11-13."
    summary: |
      Europol (primary) reports the latest round of Operation Endgame against three malware families, run with private partners:
      235 servers and 257 domains actioned in total. Gootloader (dropper/loader spread as fake legal documents on compromised, often
      WordPress, websites, used ahead of ransomware): 14 servers and 218 domains taken down, 681 infected websites remediated.
      CastleRAT (remote-access trojan known since 2025, used in ransomware intrusions): 120 servers and 39 domains seized, victim
      data shared for alerts. StealC (stealer with dropper function): 102 servers dismantled, continuing the June 2026 action.
      Over 6 million (headline: 6.4 million) victim credentials were found on the seized infrastructure; the data will be made
      available through HaveIBeenPwned, DIVD, CheckjeHack, NoMoreLeaks, Sekoia, the Shadowserver Foundation and the Dutch NCSC to
      alert victims of CastleRAT credential theft. Europol's advice: WordPress users should update credentials, enable multi-factor
      authentication and patch. Participants: Bulgaria, Canada, Denmark, Germany (BKA), Moldova, Netherlands, Poland, UK, US, with
      Europol and Eurojust; no Swiss agency is listed and none of the sources mentions Switzerland. Disposition note: the
      defender-side consequence is narrow (notification channels and WordPress hygiene); the infrastructure takedown itself gives
      no operational change for a Swiss administration, so the main agent may prefer to fold this into the registry
      (campaign:operation-endgame-amadey-stealc) as a relation only.
