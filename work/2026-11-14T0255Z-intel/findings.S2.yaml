      - { quote: "Eine Verschlüsselung sieht das Protokoll selbst aber nicht vor.", attribution: "heise online", source_url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html" }
      - { quote: "Allerdings: Sanität und Feuerwehr kommunizieren in der ganzen Schweiz unverschlüsselt über ihre Pager.", attribution: "Beobachter", source_url: "https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268" }
    borderline: true
    borderline_reason: "constituency-core sector (emergency-service alerting) and uncovered in the store, but the freshest source (heise 2026-11-12T15:19Z) lies about eight hours outside the 26 h window, it is a German incident, and the Swiss comparison rests on a 2018 article; the main agent decides"
    extended_notes: |
      Mapping caveat: T1040 is the closest enterprise technique for passive interception of an unencrypted transmission; the pager link is
      radio, not IP, so the mapping is approximate. Detection concept for a Swiss emergency-service operator: no network telemetry exists
      for passive radio reception; the control is the content design (what a dispatch message carries) and end-to-end pager encryption
      (a Swissphone document, undated, says end-to-end encryption can be enabled on request - search snippet only, not fetched). Registry
      analogue: incident:nhs-blood-transplant-pager-breach-2026-08.
