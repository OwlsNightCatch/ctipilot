      Admiralty suggestion A2 for the authority statements (BSI, CCB: both relay one first-hand discoverer, so the technical claims are
      single-origin; the authorities' own assessments are independent). Detection concepts the sources support: configuration
      artefacts on the controller (temperature setpoints, defrost schedules, user accounts, remote-access settings, per CCB) and
