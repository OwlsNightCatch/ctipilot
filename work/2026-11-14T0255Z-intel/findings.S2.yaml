  - title: "NCSC.ch advisory: Red Hat Quay anonymous signing-key takeover (CVE-2026-123710, CVSS 9.8) and cross-tenant robot-token theft (CVE-2026-110697, CVSS 9.9)"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13178", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-11-13", role: "primary" }
      - { url: "https://access.redhat.com/security/cve/cve-2026-123710", publisher: "Red Hat", date: "2026-11-11", role: "primary" }
      - { url: "https://access.redhat.com/security/cve/cve-2026-110697", publisher: "Red Hat", date: "2026-11-11", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/critical-red-hat-quay-flaw-lets.html", publisher: "The Hacker News", date: "2026-11-12", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13178 (ncsc-csh recent 30, post created 2026-11-13T11:29Z) → primary: Red Hat CVE pages, URLs https://access.redhat.com/security/cve/cve-2026-123710 and https://access.redhat.com/security/cve/cve-2026-110697 (named in the CSH post's References) → corroborating: THN, URL https://thehackernews.com/2026/11/critical-red-hat-quay-flaw-lets.html. Dedup: no Quay/CVE-2026-123710 coverage in prior_coverage or the entry store. Overlaps S1's vulnerability remit; returned because a home-region authority flagged it in-window."
    summary: |
      Red Hat disclosed two critical Quay flaws on 2026-11-11 (NCSC.ch republished them in the Cyber Security Hub on 2026-11-13;
      exploitation status "UNKNOWN" there, none reported by the other sources). CVE-2026-123710 (CVSS 3.1 9.8, network, no privileges):
      an unauthenticated client obtains an anonymous registry token from /v2/auth with an audience it controls, presents it to the
      service-key rotation endpoint (/keys) and installs its own approved signing key with no expiry, after which registry tokens it
      signs are accepted for any repository, giving read and write on private images and tag replacement; the planted key survives
      restarts, can delete the keys running instances use (pushes and pulls then fail) and, per Red Hat, deleting a rogue key is not
      durable until a fixed build is deployed because the anonymous request can install a new one; the logic has existed since Quay's
      first public commit (THN citing the bug report). CVE-2026-110697 (CVSS 9.9, low privileges, scope changed): the robot-account
      listing builds a SQL LIKE pattern from the namespace name without escaping wildcards, so a namespace containing an underscore
      matches another tenant's namespace and returns its robot accounts with decrypted tokens, enabling image read, push and overwrite;
      with Quay as the integrated OpenShift registry the stolen tokens can inject images into CI/CD. Red Hat lists every Quay 3 and
      Quay 5 version as affected (THN's reading of Red Hat's data); fixed builds named on the CVE-2026-110697 page are 3.9.28, 3.10.28,
      3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3 (the fetched CVE-2026-123710 page names no fixed list, and THN observed that
      page still showing no fix). Exposure: any Quay instance that untrusted clients can reach, including internal registries;
      standalone installs, Quay Operator on OpenShift and the mirror registry for OpenShift are named for CVE-2026-123710; anonymous
      access is on by default (THN).
