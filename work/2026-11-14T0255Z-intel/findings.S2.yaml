  - title: "Saxony: emergency-service pager messages with patient names and diagnoses readable and mirrored on a social network for years; LKA investigating (POCSAG without end-to-end encryption)"
    sources:
      - { url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html", publisher: "heise online", date: "2026-11-12", role: "primary" }
