    summary: |
      A Microsoft 365 outage centred on Exchange Online started on Thursday evening (2026-11-12) and was still being worked on the
      following day (Netzwoche; Inside IT's text calls the day Thursday 13 November, a calendar slip). Per SRF, Microsoft said that
      "im Moment" no malicious activity is known behind the incident; engineers found a process disabling servers, restored parts
      and suffered setbacks, and by Friday morning (Netzwoche) a correction to a component responsible for sign-in and request routing
      had stabilised part of the servers and was being rolled out; Microsoft promised a detailed report after the fix. Affected
      surfaces named by Netzwoche: Outlook mailboxes (web and desktop), mail delivery, Teams calendar and scheduling, Copilot,
      parts of SharePoint, the Microsoft 365 admin portal and 'various security solutions' - Safe Links in Defender for Office 365
      may fail to open links, and access to the Defender XDR portal may be disrupted. Third-party AI services connected to Microsoft 365
      (OpenAI, Anthropic) also reported problems (Netzwoche citing Reuters; Reuters not fetched). Swiss impact (Inside IT): Richemont's
      half-year release delayed 40 minutes, Zurich's mail partly down, Nestle delays, Swiss Post pointing urgent cases to the phone,
      Barry Callebaut and universities including ETH Zurich affected; the Federal Administration (about 44,000 staff) reported only minor
      performance problems on single applications and unaffected e-mail (statement to Keystone-SDA via Inside IT). No source reports a
      cantonal or communal administration effect. Hundreds of reports reached allestoerungen.ch (Netzwoche, citing SRF).
