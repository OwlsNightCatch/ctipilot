detection_and_hardening_hooks_the_sources_support: |
  Exposure test (CCB, Midnight Blue): identify every controller whose management interface can be reached from the public internet, including through an integrator's 4G/5G modem and including addresses outside the asset owner's own ranges; treat it as exposed whatever the firmware level (CC8, CC10, MB23). Read the running firmware version on the controller (affected: up to and including 5.3.2; 5.4.0 unassessed).
  Telemetry class first: network-side logs (firewall, VPN gateway, ISP/APN, reverse proxy in front of the controller) for inbound connections to the controller's web ports from sources other than the contractor's; web access logs for unauthenticated POSTs to .cgi endpoints with oversized body parameters or an oversized User-Agent header, and a restart or crash of the controller's web process (the redacted demonstrations used a 768-byte body field on the HTTP path and a 1,536-byte User-Agent on the HTTPS path and produced a SEGFAULT; Midnight Blue presents these as demonstrations, not detections, and withholds endpoints; the hooks are an inference from the demonstrations). Controller-side logs are weak evidence after RCE (MB31, hypothetical).
  Compromise check (sources): review the entire configuration (temperature setpoints, defrost schedules, user accounts, remote-access settings; CC12); rotate all credentials on suspicion and check devices attached to the controller for correct operation (B15); verify actual temperatures with instruments independent of the supervision platform (CSIRT Italia, already in the entry). Midnight Blue: a firmware-level implant cannot be excluded after a factory reset without deep forensics (MB18, hypothetical); no source gives a recovery procedure for that case.
  Hardening lever: remove direct internet exposure (VPN, private APN, or a highly restrictive firewall-enforced allow-list; geofencing or blacklists are not sufficient: MB22); CCB: review service-provider contract and insurance terms before cutting the provider's data uplink and arrange protected remote access so monitoring continues (CC13), source-IP filtering of the provider is an emergency stop-gap only (CC14). No benign lookalike is stated by any source, so no Triage line is supported for the six.
gaps_and_not_found:
- No Danfoss statement, advisory, CVE or release note on the six flaws (checked advisories page, product page, 5.4.0 readme, tech-insider, best-practices page, WebSearch EN/DE).
- No source says whether 5.4.0 fixes any of the six, nor who tested 5.4.0.
- 'No exact Danfoss release date for 5.4.0: Danfoss ''November 2026'', heise ''12. November'', SPK Last-Modified 2026-10-29.'
- No BACS/NCSC.ch statement on the six as of 2026-11-14 ~03:40Z.
- No Swiss site named as running the affected firmware; S2's public-sector examples (canteens, hospital kitchens, vaccine and blood cold chain) are S2's inference, not source-stated (BACS names pharmacies, doctors' practices, laboratories, logistics, farms in the existing entry).
- NVD API unreachable (503); EUVD/MITRE not checked because every primary says no CVE ids exist.
- Midnight Blue's 'in action' PoC media (video/images) cannot be read as text; the text transcripts target a userland emulation on 127.0.0.1 (MB33), so no source here shows exploitation of a physical controller beyond Midnight Blue's own assertion.
