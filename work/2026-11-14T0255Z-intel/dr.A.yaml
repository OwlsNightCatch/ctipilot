facts:
  what_is_new_in_one_paragraph: |
    On 2026-11-11 (BSI's date; Midnight Blue's CMS date says 2026-11-07) Midnight Blue published research reporting six pre-authentication stack-buffer-overflow RCE flaws in the Danfoss AK-SM800A, affecting all firmware up to and including 5.3.2 (the latest at its time of writing).
    Technical details are withheld (coordinated disclosure with Danfoss ongoing), no CVE ids exist, no fixed version is named anywhere. The CCB (2026-11-12) and the BSI (2026-11-13, criticality 3 / Orange) relay it and both say removing direct internet exposure is the priority and must not wait for patches;
    the CCB adds that updating firmware, changing default passwords and strict session mode are each insufficient alone because the strict-mode front end itself has a pre-auth flaw. The BSI states nothing is known about active exploitation of the six.
    heise reports (2026-11-13) that Danfoss's newest package 5.4.0 is dated 12 November and that the BSI told heise it does not want to rule out vulnerabilities in 5.4.0; Danfoss's own product page lists 5.4.0 as the latest package ('November 2026') and its readme says nothing about security fixes.
  affected_firmware:
    product: Danfoss AK-SM 800A (AK-SM800A) only; the sources name no other model for the six (AK-SM 800 EOL and AK-SC 355 are not assessed; whether other AK-SM 8xxA models share the code is not stated)
    affected: 'all firmware up to and including 5.3.2 (Midnight Blue, CCB: claims MB2, CC1); BSI: ''bis mindestens 5.3.2'' = up to at least 5.3.2 (B2, B6)'
    unassessed: '5.4.0: no source reports testing it. Midnight Blue tested 5.3.2 (latest when written); BSI (via heise only) will not rule out vulnerabilities in 5.4.0 (H2); the BSI PDF never mentions 5.4.0 (grep of full text: no ''5.4'')'
    vulnerability_class: six stack-based buffer overflows, pre-authentication RCE; the application runs as root; no stack canaries or PIE; no secure boot (MB3, MB9, MB10, MB17)
    strict_mode: 'not a barrier: the strict-mode front end sm_fcgi_app has at least one pre-auth overflow, reproduced on the latest firmware with strict enabled over the HTTPS listener (MB13, MB15, MB32, CC6). Midnight Blue does not say explicitly whether that flaw is one of the six or additional (it reports ''at least 5'' in the CGI handlers it sampled plus the sm_fcgi_app one)'
  fixed_state: |
    No fix. BSI overview table: 'Behebende Versionen -' (none listed) and 'CVEs noch keine vergeben' (B2). CCB (2026-11-12): 'No patches were available at that time' (CC3, CC11). Midnight Blue: CVEs 'Pending', disclosure ongoing (MB4, MB6).
    Whether 5.4.0 fixes any of the six is unknown: no source says it does or does not. The patches that DO exist cover the published 2025 CVEs: CVE-2025-41450 fixed in 4.2 (DSA-2025-03-01), CVE-2025-41451 and CVE-2025-41452 fixed in 4.3.1 (DSA-2025-08-01) (D2, D3).
  danfoss_position: |
    Nothing found on any Danfoss channel as of 2026-11-14 ~03:40Z about the six flaws: the security-advisories page lists one 2026 advisory (DSA-2026-08-01, iC7 products, last update 2026-09-18) and no AK-SM 800A entry for them (D1);
    the AK-SM 800A product page lists 'AK-SM 800A 5.4.0.spk (November 2026)' as the latest package (D4) and still advises latest software, no direct internet exposure, VPN and firewalls and Strict Mode (D5);
    the R5.4.0 'Important readme' covers upgrade mechanics only (no downgrade possible, Danux 4.14.017.194 required, security settings unchanged from 4.x) and mentions no vulnerability, CVE or fix (D6 to D9; grep for vulnerab|CVE|fix|Midnight|patch|resolv returned nothing);
    the tech-insider food-retail page carries a 5.3.x item and no 5.4.0 item (D12); no Danfoss spokesperson statement on the six was found by WebSearch (latest Danfoss statement found: Cooling Post 2026-10-12, D13/D14).
    Midnight Blue says it is in a coordinated disclosure process with Danfoss (MB6). The 5.4.0 package file's HTTP Last-Modified header reads 2026-10-29 (D15), i.e. it does not date the release; heise says 12 November, Danfoss says 'November 2026'.
  cve_ids: 'none for the six (BSI, Midnight Blue, CCB all say pending/not assigned). The entry''s cves[] stays []. Older relevant ids (already in the store via Censys/NCSC.ch material): CVE-2025-41450, CVE-2025-41451, CVE-2025-41452.'
  exploitation_by_source:
    BSI: '''Über eine bereits aktive Ausnutzung der gefundenen Schwachstellen ist nichts bekannt.'' (B8) and the report ''may contain enough information to give potential attackers sufficient hints'' (B9)'
    CCB: no in-the-wild statement for the six; conditional 'An attacker could exploit these vulnerabilities without logging in' (CC4); frames the waves as internet-exposed management interfaces without naming a vector (CC16)
    Midnight Blue: claims a working exploit (redacted demonstrations, one shown on 3.3.0, bugs stated present in 5.3.2); no claim of in-the-wild use of the six; says first public PoCs for the EARLIER Danfoss CVEs appeared within 48 hours of the French attacks (MB7, MB24); does not attribute the waves (MB27)
    heise: no exploitation claim for the six
    Danfoss: nothing published
    net: reported, unpatched, no known exploitation; no source ties them to the October or November waves
  source_independence: |
    One first-hand origin: Midnight Blue (discoverer). CCB's text is a relay ('New research published by Midnight Blue reports...', CC2) with no stated verification; BSI says the CCB advisory 'confirmed' the finds (B5), which is the BSI's wording for the CCB relay, not an independent technical test.
    BSI and CCB are independent authorities choosing to act on the same single claim. heise adds only the 5.4.0 statement (BSI to heise) and editorial comment. Treat the technical claims as single-origin (Midnight Blue) with two national authorities' assessments (BSI criticality 3 / Orange; CCB 'Immediate Action Required').
  publication_dates: |
    Midnight Blue: CMS/extract date 2026-11-07 (and the redacted demo transcript's HTTP Date header reads Sat, 07 Nov 2026 21:44:33 GMT), but BSI says Midnight Blue published on 11.11.2026 (B1) and the page HTML carries the Webflow site stamp 'Last Published: Wed Nov 11 2026 19:22:41 GMT+0000' (MB28); CCB (2026-11-12) calls the research new. Recommended source date: 2026-11-11 (BSI-stated; note the 2026-11-07 CMS date).
    CCB: 2026-11-12 (page 'Last update: 12/11/2026'). BSI: version 1.0 of 2026-11-13. heise: 2026-11-13. In window (26 h, start 2026-11-13T00:57Z): BSI notice and heise are in; CCB (2026-11-12) and Midnight Blue (2026-11-11) predate the window and are context for a fresh delta that first reached the pipeline through BSI/heise on 2026-11-13.
  swiss_status: |
    No BACS or NCSC.ch statement on the six flaws as of ~03:40Z 2026-11-14: bacs.admin.ch Im Fokus listing newest item 2026-11-10 (26w45 and the cooling-controller warning), Aktuelle Vorfaelle newest 2026-11-10, Medienmitteilungen newest 2026-11-05; Cyber Security Hub post 13054 lastModified 2026-11-06T10:54:22Z (history: Published 2026-10-13, Edited layout, Edited 2026-11-06), and no Danfoss post among the 30 most recent hub posts (newest 13178, 2026-11-13).
    BACS's 2026-11-10 warning (S1) predates Midnight Blue's publication. No source names a Swiss site running the vulnerable firmware.
  disagreements_between_sources_to_surface_not_average:
  - 'Midnight Blue recommends AGAINST spending scarce effort on patching (MB20); BSI still asks to check patch levels and update where available alongside taking devices offline (B13, B14); heise''s own advice is ''at least update, better cut all remote access'' (H3, heise''s words); CCB: remove exposure ''only real solution'', monitor for patches and upgrade when available (CC9, CC11). All four agree exposure removal comes first.'
  - BSI says the CCB advisory 'confirmed' the finds (B5); the CCB text only relays Midnight Blue (CC2). Do not write that the CCB or BSI verified the flaws independently.
  - heise's 'kompromittiert' for 5.4.0 (H1) is heise's paraphrase; the quote attributed to the BSI is 'auch bei 5.4.0 Schwachstellen nicht ausschließen zu wollen' = cannot rule out vulnerabilities, not 'is vulnerable' (H2). It rests on heise alone; the BSI PDF does not mention 5.4.0.
  - Midnight Blue says Danfoss guidance suggests patching is sufficient (MB25); Danfoss's own product page also says to avoid direct internet exposure and use VPN and firewalls (D5, D17). Both are true of different parts of Danfoss's guidance.
  - 'CERT-FR''s alert (unrevised since 2026-10-16) says a factory reset removes the persistence of a compromised instance in the observed attacks; Midnight Blue/CCB warn persistence could survive a factory reset or update in a hypothetical firmware-implant scenario (MB18, CC7). The two are not the same claim: one concerns observed attacks, the other a feasible-not-observed capability.'
  - S2's draft says 'one of them in sm_fcgi_app'; Midnight Blue says 'at least one' pre-auth flaw in the session control and does not say it is one of the six. S3's 'five in the CGI handlers plus the sm_fcgi_app one = six' is arithmetic, not a source statement.
  - heise calls Carlo Meijer a co-founder of Midnight Blue; Midnight Blue's page and BSI call him a researcher / name only the firm; use 'a Midnight Blue researcher'.
