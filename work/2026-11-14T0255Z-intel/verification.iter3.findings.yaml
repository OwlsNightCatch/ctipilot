- code: F3
  category: claim-not-supported
  section: gitlab-critical-patch-git-merge-overflow-cve-2026-105437 (body, para 2)
  item: "2026-11-14/gitlab-critical-patch-git-merge-overflow-cve-2026-105437"
  url_or_quote: "a long path that passes validation is written as .git and replaces a freshly cloned submodule's .git file with a symlink to a directory that holds attacker hooks or configuration, which GitHub says can execute attacker-controlled code during a recursive clone ([GitHub Blog, 2026-11-10](https://github.blog/open-source/git/git-security-vulnerabilities-announced-7/))"
  summary: "The cited GitHub blog says only 'an extremely long path to pass validation under one name and then be written using a shorter name' and 'replace a submodule's .git file with a symbolic link pointing to a directory containing malicious configuration or hooks'; it does not say the path is written as .git or that the replaced file belongs to a freshly cloned submodule. Both details are in the oss-security post of the Git maintainers (https://www.openwall.com/lists/oss-security/2026/11/11/10: 'Git writes the validated path ... as .git'; 'a freshly cloned submodule's .git is a gitfile rather than a directory'), which the entry cites only in the next sentence. Fix: add the oss-security link to this clause or trim the two details to what GitHub states."
