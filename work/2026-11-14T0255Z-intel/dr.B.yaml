  - id: '1.21'
    claim: 'Hardening: two separate surfaces (extension authentication and technician-client file transfer).'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
