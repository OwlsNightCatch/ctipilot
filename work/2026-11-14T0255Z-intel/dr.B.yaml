  facts:
    versions_and_cves:
    - 'CVE-2026-127063 (ConnectWise as CNA, published 2026-11-12): third-party RMM+ extension (DataComm) "uses a static API secret by default"; CVSS 4.0 9.3 (CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N);
      CWE-1392; server and client not affected; no fixed RMM+ version; cloud: ConnectWise disabled and removed the extension; on-premises: disable immediately, verify
      it stays disabled, do not re-enable or reinstall. Record unchanged since 2026-11-12 (disclosures repo: last commit touching it 2026-11-12T17:47Z, a 2026-11-13
      commit is a logo update). Not in the CISA KEV catalogue 2026.11.13.'
    - 'RMM+ 1.0.31 and 1.0.32 accept an empty access key when none was configured: Huntress (own analysis, 2026-11-11 update) and Microsoft (2026-11-13) relaying
      ConnectWise''s Trust Center advisory. The CNA record names no versions. Both statements stand side by side; the Trust Center advisory itself is unreadable here
      (HTTP 403 on every transport).'
    - 'Extensions ConnectWise named on 2026-11-11 and Microsoft repeats on 2026-11-13: Labtech Plus, RMM Plus, RMM+, RMM Plus Password Link, RMM+ Password Link; ConnectWise
      later traced the activity to the RMM+ family (The Record, 2026-11-12); about 400 partner environments had at least one extension of that family.'
    - 'CVE-2026-84869 (context, covered by entry 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer): ScreenConnect client versions before 26.6.5
      (CNA record 2026-09-08; Blackpoint: builds earlier than 26.6.5.9742); fixed in 26.6.5 and later; CVSS 3.1 9.9; CWE-862/CWE-269; in CISA KEV since 2026-09-11
      (own KEV check, ransomware-use field Unknown). Cloud servers were updated by ConnectWise, but host clients and Access agents must still be updated by the partner
      (CNA record); Microsoft: a cloud-console update does not update technician clients.'
    - 'New statement now on record from three directions that the 26.6.5+ client blocks SCKit''s endpoint-to-technician transfer: ConnectWise via Microsoft (2026-11-13),
      ConnectWise via Huntress (updated advisory, urged verifying every technician client is on 26.6.5 or later), and Blackpoint''s own test (patched Host never fetched
      or ran the file). Neither Microsoft nor Huntress nor Blackpoint reports a successful technician compromise.'
    exploitation_statements_per_source:
    - 'Microsoft Threat Intelligence (2026-11-13): confirms ConnectWise''s reported activity from 2026-11-11 and its own observation of actors abusing ScreenConnect
      to install unauthorized clients and deploy SCKit on customer managed endpoints; names no actor and gives no counts; RelayTrap and the cookie/Toolbox stage are
      described as "designed to"; says the entry method "remains under investigation" per ConnectWise.'
    - 'Huntress original + updates: wave 1 started about 17:47 UTC 2026-11-11, 288 hosts / 48 organisations in 90 minutes; wave 2 on 2026-11-13 from 16:12 UTC, 205
      hosts / 41 organisations, decoder attempted but no follow-on executions seen, one incident with a self-hosted RMM+ plugin (update 11/13 5:30 pm ET = 22:30Z,
      EST assumed). Technician stage never observed to succeed.'
    - 'Blackpoint (SITREP update 03, 2026-11-13 14:23 ET = 19:23Z, EST assumed): SOC saw a second wave that appears to target on-premises instances where mitigations
      remain pending, likely a modified toolkit, no sample recovered yet; APG found no technical link between the extensions and RelayTrap or the cookie routines;
      the extensions'' role in first panel access stays unresolved; no technician compromise observed; cookie-database route has a parsing defect so the memory route
      is the more plausible recovery path.'
    - 'ConnectWise (relayed): 2026-11-11 notice via BleepingComputer: reports of technician workstation compromise during interactive sessions "still being confirmed";
      2026-11-13 updated advisory via Huntress: reiterates disabling extensions on-premises and urges verifying every technician client is on 26.6.5 or later. ConnectWise''s
      own pages are unreadable here.'
    - 'Huntress separate post (2026-11-14): fake crypto-exchange-named guest sessions, no overlap with SCKit indicators, see same_cluster_verdict_item_S3_5.'
    same_cluster_verdict_item_S3_5: 'Separate cluster per Huntress itself ("We haven''t found any overlap between the crypto-bait fakes and the published SCKit indicators"):
      guest-side enrollment of 2,223 fake Access sessions on 118 self-hosted servers since 2026-11-03 with no malicious activity observed, versus SCKit''s panel-side
      Run Command abuse; the only link is the shared product and the client-side CVE-2026-84869 angle against technicians, which is Huntress''s unobserved hypothesis.
      Do not merge into the SCKit entry; at most a one-clause cross-reference.'
    not_stated_by_sources:
    - No source names an actor, a victim organisation or a Swiss victim.
    - Microsoft gives no number of affected hosts or tenants and no statement that a technician workstation was actually compromised.
    - ConnectWise's Trust Center advisory and the 2026-09-08 bulletin could not be read (see fetch_notes); every ConnectWise statement beyond the CNA records is relayed.
