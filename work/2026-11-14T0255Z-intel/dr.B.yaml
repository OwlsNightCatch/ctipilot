    entry; (2) N-able, relayed by Huntress on 11/13 15:25Z, confirmed Agent2Shell also requires the non-default Legacy API and published IoCs for customers that have
    not disabled it (13:40:25Z), which post-dates and softens the "no signs of compromise" clause the entry carries in four places; (3) Tenable adds that the Intune
    integration was also temporarily deactivated for on-premises customers; (4) Huntress''s Agent2Shell detection concepts (static analysis only); (5) BSI WID-SEC-2026-4563
    rates the family kritisch. The 4EverAble2Shell facts (Huntback 21 servers, 19 on Hotfix 2, Previdian attempts, Legacy API gate, no fix, follow-up hotfix) are
    already in the entry and unchanged. No N-able fixed build or new hotfix exists as of the fetches; no named actor; not in KEV.'
