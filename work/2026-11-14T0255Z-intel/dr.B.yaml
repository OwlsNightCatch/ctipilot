  facts:
    versions_and_cves:
    - 'Fixed build for the first set: N-central 2026.4 Hotfix 2, build 2026.4.1.26 (N-able release notes 2026-11-10; read via WebFetch only). Seven CVEs: CVE-2026-125883,
      -125881, -125878, -125882, -125879, -125880, CVE-2026-91000 (unchanged; none in CISA KEV catalogue 2026.11.13).'
    - 'Second disclosure (2026-11-12, one researcher, two parts): 4EverAble2Shell (unauthenticated root on the server) and Agent2Shell (more than ten issues in server-to-Windows-Agent/Probe
      communication; two chains give an unauthenticated attacker who can reach the server SYSTEM command execution on managed Windows endpoints; THN adds "assuming
      the attacker knows the target appliance ID"). Both tested by the researcher against 2026.4.1.26 (HF2) (BleepingComputer, Previdian).'
    - 'Gate for both parts: Legacy API turned on. N-able first notice (2026-11-12, via THN): "depends on a non-default configuration in which the Legacy API is turned
      on and exposed to the public internet"; hosted environments not affected; Legacy API off by default and "not recommended". Agent2Shell requires Legacy API too:
      N-able, relayed by Huntress on 2026-11-13 10:25 ET (= 15:25Z, EST assumed). This closes the open question Huntress and Tenable carried on 2026-11-12.'
    - 'CVE-2026-90436 (Apache Axis 1.x, EOL, through 1.4; SOAP fault exceptionName class instantiation; Apache says source patch only and no Axis 1.x release expected;
      CVSS 9.8 per THN; severity critical per Apache). THN (2026-11-12) quotes Previdian saying patches were released 2026-11-06 - conflicts with Apache; entry cves[].fixed
      already carries the Apache position. No CVE exists for the N-central root-escalation helper abuse or for Agent2Shell (Previdian: "No CVE Assigned Yet"; BSI
      vulnerability records carry no CVE id). Not in CISA KEV.'
    - 'Older builds are hit too: Huntback saw one victim on 2025.3.1.9 besides 19 on 2026.4.1.26; the 21st build is not stated. Tenable: Huntback does not say whether
      the Legacy API was on on those servers (presumably, since the chain needs it; unverified).'
    exploitation_statements_per_source:
    - 'Huntback (2026-11-12, own decoys + the operator''s public mining-pool rig list): first probe 08:30 UTC, first weaponised request 09:16 UTC, 21 active rigs
      named nc_<ip> at 12:50 UTC, all 21 serve N-central pages (production, not decoys), 19 on 2026.4.1.26; US 9, South Africa 4, Canada 4, UK/Germany/France/Sweden
      1 each; no Swiss host; miner is the only payload seen; same operator runs 631 rigs across other products. Huntback publishes no victim addresses.'
    - 'Previdian (page updated 14 Nov, counts unchanged): 2 exploitation attempts, 1 attacker IP, 1 country, first and last observed 12 Nov; says telemetry does not
      show success; BleepingComputer: Previdian later confirmed the full chain attempted on its honeypot, same source IP as Huntback. Previdian''s own flag: Not in
      CISA KEV; No CVE Assigned Yet.'
    - 'The Hacker News 2026-11-12: Previdian "no evidence of successful exploitation as of writing"; watchTowr probes against Legacy-API-enabled builds (via X). The
      Hacker News 2026-11-13: "Multiple threat intelligence reports show ... active exploitation efforts ... deploy cryptocurrency miners"; Huntback quote that Hotfix
      2 alone is not enough.'
    - 'N-able: 2026-11-12 notice "no signs of compromise" (via Tenable, BleepingComputer); 2026-11-13 13:40:25 UTC update (via Huntress) publishes IoCs for customers
      that have not disabled the Legacy API; the IoC list as reproduced by Huntress matches Huntback''s published network indicators. N-able itself has not, in anything
      readable, said it has seen compromise or victims; read as: a vendor now carries exploitation-derived indicators, not a vendor confirmation of customer compromise.'
    - 'Huntress (as of 11/13): has not observed exploitation of the new issues in its partners'' environments. Tenable (2026-11-12): no named actor linked. BSI (WID-SEC-2026-4563,
      2026-11-12T23:00Z, kritisch): several flaws allow an anonymous remote attacker to run code with administrator rights; affected = N-Central 2026.4 HF2 / 2026.4.1.26;
      references the N-able status page, Huntback, The Hacker News, Previdian and the PoC repository.'
    n_able_own_pages: 'Not readable on any transport this run: uptime.n-able.com (root, /event/202609/ first Legacy API notice, /event/202584/, /event/202613/ per
      Tenable the later 2026-11-12 restriction notice, /event/202561/ original incident) is a script-rendered "Status Dashboard" shell on extract (direct-raw), url
      --direct and WebFetch (two pages tried); the me.n-able.com knowledge-base article on disabling Legacy API is a Salesforce shell on extract and WebFetch; status.n-able.com
      HF2 release notes: 403 on extract/url/reader but WebFetch returned a summary with verbatim lines (saved). The page''s own data endpoint sits under /api/v1/private/dashboard/
      and my one attempt to call it was refused by the permission classifier, so I did not use it and did not retry. All N-able statements after 2026-11-10 are therefore
      relayed (THN, Tenable, BleepingComputer, Huntress) and must be attributed "N-able, as relayed by ...".'
