- item: 1
  entry: entries/2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints.md
  returned_item: work/2026-11-14T0255Z-intel/findings.S3.yaml items[4] (Microsoft Threat Intelligence 2026-11-13)
  primary: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
  verdict: 'Update warranted. New since the entry''s last record (2026-11-13T04:04:37Z): Microsoft names RelayTrap and the cookie/Shared Toolbox stage and relays
    ConnectWise''s 26.6.5 statement; Huntress (11/13 22:30Z) reports a second wave (205 hosts / 41 organisations) and ConnectWise''s updated advisory urging every
    technician client on 26.6.5+; Blackpoint (11/13 19:23Z) says the second wave appears to target on-premises instances with mitigations pending. ConnectWise''s
    CNA record for CVE-2026-127063 is unchanged. The technician stage is still unobserved as a success by Huntress and Blackpoint; Microsoft states it as design.'
  claim_table:
  - id: '1.01'
    claim: Microsoft confirms ConnectWise's reported activity and says it also observed actors abusing ScreenConnect to install unauthorized clients and deploy the
      SCKit worm on customer managed endpoints; it names no actor, gives no victim count and no observed-success statement for the technician stage.
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: Microsoft Threat Intelligence has confirmed ConnectWise’s reported activity and we have also observed threat actors abusing ScreenConnect, a legitimate
      remote-support application, to install unauthorized remote-access clients and deploy a malicious worm, SCKit, on ConnectWise customer managed endpoints.
    grep_F_verified: true
  - id: '1.02'
    claim: 'RelayTrap is the new component name: a replacement for the ScreenConnect client built on the affected customer endpoint, designed to deliver a payload
      to the technician who connects.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: SCKit is a malware toolkit that includes RelayTrap, a malicious replacement for the ScreenConnect client on an affected customer endpoint. RelayTrap is
      designed to deliver a payload to a technician’s workstation when they connect for support.
    grep_F_verified: true
  - id: '1.03'
    claim: ConnectWise (relayed by Microsoft) says the CVE-2026-84869 fix blocks the endpoint-to-technician spread.
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: ConnectWise states that the fix for CVE-2026-84869 blocks the toolkit’s attempted endpoint-to-technician spread.
    grep_F_verified: true
  - id: '1.04'
    claim: 'Client version statement (relayed by Microsoft from ConnectWise): clients 26.6.5 and later block the endpoint-to-technician transfer; fix released 2026-09-08;
      a cloud-console update does not update technician clients.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: ConnectWise states that ScreenConnect client 26.6.5 and later block the toolkit’s attempted endpoint-to-technician transfer technique. The fix for CVE-2026-84869
      was released on September 8, 2026. Verify each technician client’s installed version; a cloud-console update does not automatically update those clients.
    grep_F_verified: true
  - id: '1.05'
    claim: 'Mechanism: a watcher polls every 10 seconds, enumerates ScreenConnect client services and compiles RelayTrap.exe per client with the .NET C# compiler
      (compile-after-delivery).'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: The watcher enumerates ScreenConnect client services and reads their executable paths and connection parameters. For each client, its build routine creates
      a directory under trapbins, copies libraries from that client’s installation, and uses the .NET C# compiler to build RelayTrap.exe.
    grep_F_verified: true
  - id: '1.06'
    claim: Poll interval.
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: The -PollSeconds 10 argument configures the watcher to poll every 10 seconds.
    grep_F_verified: true
  - id: '1.07'
    claim: RelayTrap reuses the endpoint client's connection details and, when a technician with a vulnerable host client connects, tries to deliver the batch launcher
      through that session (designed behavior).
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: RelayTrap is designed to reuse the customer endpoint’s ScreenConnect connection details in place of its normal client. When a technician connects with
      a vulnerable host client, RelayTrap attempts to deliver the staged batch launcher through that session.
    grep_F_verified: true
  - id: '1.08'
    claim: 'Persistence on the endpoint: machine-wide Run value launching an alert script at logon plus a scheduled task for the watcher, scripts under a ProgramData
      directory.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: The RelayTrapLiteAlert value in the machine-wide CurrentVersion\Run key launches an alert script at user logon.
    grep_F_verified: true
  - id: '1.09'
    claim: Defender path exclusions are written for staged MSI copies and an installer script.
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: Registry writes target Microsoft Defender Antivirus path exclusions for staged MSI copies
    grep_F_verified: true
  - id: '1.10'
    claim: 'Environmental keying: the decoder reads MachineGuid and sends it to the server; the key is derived from the machine identifier XOR a server-supplied half,
      then PBKDF2.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: To derive the decryption key, the decoder hashes the UTF-8 machine identifier with SHA-256, XORs that hash with 32 bytes decoded from X-Lab-Half, and appends
      the machine-identifier bytes to the recovered secret material.
    grep_F_verified: true
  - id: '1.11'
    claim: 'Browser cookie theft: .ASPXAUTH cookies searched in Chrome, Edge, Opera and Opera GX profiles.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: The browser-access code searches Chrome, Edge, Opera, and Opera GX profiles for cookies named .ASPXAUTH.
    grep_F_verified: true
  - id: '1.12'
    claim: 'Second cookie route: memory scan of the browser network-service process.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: An embedded C# scanner uses OpenProcess, VirtualQueryEx, and ReadProcessMemory to inspect readable committed memory regions for cookie strings and nearby
      host strings.
    grep_F_verified: true
  - id: '1.13'
    claim: 'Console distribution (designed): cookie + anti-forgery + access tokens, enumerate sessions, upload payload with ToolboxRelayUploader.exe, queue through
      the Shared Toolbox, delete the Toolbox item afterwards.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: The console-distribution component is designed to combine an authentication cookie with the required anti-forgery and access tokens, enumerate accessible
      sessions, upload a payload using ToolboxRelayUploader.exe, and queue execution through the Shared Toolbox. The workflow also includes removing the uploaded
      Toolbox item after distribution.
    grep_F_verified: true
  - id: '1.14'
    claim: Microsoft relays the ConnectWise advisory as describing RMM+ 1.0.31/1.0.32 accepting an empty key when no access key was configured (the Trust Center advisory
      itself returned HTTP 403 on every transport here, so this is unverified against ConnectWise's page).
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: 'describes a reported authentication flaw in RMM+ versions 1.0.31 and 1.0.32: when no access key was configured, the extension accepted an empty key.'
    grep_F_verified: true
  - id: '1.15'
    claim: 'Entry route still open per Microsoft/ConnectWise: extension abuse investigated as initial-access route; entry method under investigation.'
    source_url: https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/
    saved_copy: work/2026-11-14T0255Z-intel/dr/B1_msft.txt
    quote: ConnectWise is investigating extension abuse as an initial-access route; the entry method for the reported campaign remains under investigation.
    grep_F_verified: true
