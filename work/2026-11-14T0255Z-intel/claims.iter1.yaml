    entry: 2026-11-14/gitlab-critical-patch-git-merge-overflow-cve-2026-105437
    surface: "summary"
    kind: frontmatter
    text: "GitLab shipped an ad-hoc critical patch release on 2026-11-10 for CVE-2026-105437, a heap overflow in Git that, per GitLab, any user who can create a project and open a merge request reaches, and that can run commands as the git user with access to every repository on that Gitaly node. Git 2.56.1 and its backports fix the same flaw and five others, among them CVE-2026-111760, code execution when a malicious repository is cloned with --recurse-submodules; no source reports exploitation."
  - claim_id: ba1c0ed624
    entry: 2026-11-14/gitlab-critical-patch-git-merge-overflow-cve-2026-105437
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed GitLab to 19.5.4, 19.4.6 or 19.3.8 now (self-compiled installs rebuild the Git in Gitaly and the Git at git.bin_path, or move the distribution Git to 2.56.1 or later) and, where that waits, limit who can create projects and sign up, because a user who can open a merge request reaches the flaw and code execution gives access to every repository on the Gitaly node."
