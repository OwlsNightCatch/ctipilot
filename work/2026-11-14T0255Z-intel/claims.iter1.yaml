    kind: cited
    text: "**Defender takeaway:** disable developer tools through Group Policy on managed browsers and block Graph Explorer and the browser net-export pages, because the handoff depends on users reading tokens out of browsers; pilot Continuous Access Evaluation with strict location enforcement, defining every egress address including secure web gateway ranges as a named location; and tell staff that IT will never ask for developer tools or tokens and that they should verify IT requests by callback ("
