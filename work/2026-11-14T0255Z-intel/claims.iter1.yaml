  - claim_id: 5b820a37fa
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "summary"
    kind: frontmatter
    text: "ReliaQuest reports that the data-extortion group Luna Moth (Silent Ransom Group) returned in October and early November to law firms it had extorted in May and August, using a technique it calls almost certainly new for the group: on a video call posing as IT support the attacker has the employee open Microsoft 365 Copilot, copy the Microsoft Graph access token out of the browser's developer tools and paste it to a text-sharing site, then replays it from its own server and downloads thousands of files in about an hour. The token was issued to the victim's compliant device, so no sign-in event is generated for the attacker's address; ReliaQuest is the only source and names no victim or country."
  - claim_id: 83b82e426e
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "ReliaQuest says Luna Moth, also called Silent Ransom Group, has targeted law firms since at least mid-2023 and in October and early November went back to firms it had extorted in May and August; those firms appear on the group's leak site, which ReliaQuest takes to mean they did not pay, and the group exfiltrated a second round of data ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
  - claim_id: 9cdf9fca5d
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "The approach reverses the group's earlier flow: a blank-subject email from a free address carries a deliberately invalid PDF that crashes the viewer, and the attacker then calls the target, often on a personal number outside corporate call controls, posing as IT support responding to a \"malicious email\" ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
  - claim_id: ad6e78d54c
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "By late August the group paired video calls with a built-in remote-assistance tool, and by October the video call alone carried both the conversation and the screen control ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
  - claim_id: b8add1d5d2
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "On the call the attacker has the employee open Microsoft 365 Copilot in the browser on a managed, compliant laptop, open the browser's developer tools to find the request Copilot sends to Microsoft Graph and copy the access token it carries, and paste the token into a public text-sharing site where the attacker retrieves it ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
  - claim_id: 3f887b8b54
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "Within a minute the attacker replays the token from its own server and downloads files en masse through the Graph API, thousands in about an hour ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
