    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "headline"
    kind: frontmatter
    text: "Red Hat Quay: anonymous signing-key takeover and cross-tenant token theft; update to your branch's fixed release"
  - claim_id: 991013fbdb
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "summary"
    kind: frontmatter
    text: "Red Hat's CNA records say an unauthenticated client of Red Hat Quay can obtain an anonymous registry token, present it to the service-key rotation endpoint and install its own signing key (CVE-2026-123710, CVSS 3.1 9.8), and that an account that can create a namespace containing an underscore can retrieve other tenants' robot tokens (CVE-2026-110697, 9.9). Red Hat fixed both in Quay 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3, lists Quay 5 and the mirror registry for Red Hat OpenShift 2 as affected with no fix, and NCSC Switzerland lists exploitation as unknown."
  - claim_id: 533b79e0a7
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Red Hat Quay registry to its branch's fixed release (3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 or 3.18.3) and, until then, restrict the /keys endpoint at the proxy or load balancer to trusted internal components; on any instance whose /keys endpoint untrusted clients could reach, review audit logs for service_key_rotate and service_key_delete events with a null expiration_date and remove unrecognised approved service keys, because deleting a rogue key is not durable before the fix and resetting passwords or regenerating robot tokens does not revoke it."
  - claim_id: 33b0999624
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "cves[CVE-2026-123710]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123710\", \"cvss\": \"9.8\", \"status\": [\"patch-available\", \"no-patch\"], \"affected\": \"Red Hat Quay before 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3 on each branch; Red Hat Quay 5 and mirror registry for Red Hat OpenShift 2 affected\", \"fixed\": \"3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7, 3.18.3; none for Quay 5 and mirror registry for Red Hat OpenShift 2; mitigation: restrict /keys to trusted internal components\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
