    text: "Elastic: CyberStrikeAI against AWS, six medium or low alerts joined only by source IP; alert on user-data bursts"
  - claim_id: a9ef223413
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "summary"
    kind: frontmatter
    text: "Elastic Security Labs reports that between 2026-09-30 and 2026-10-16 one server running the open-source CyberStrikeAI platform used the credentials of eight AWS identities (five IAM users, three EC2 instance roles) across four accounts, reading secrets and EC2 user data and, in one case, issuing a Systems Manager command. Every step is a call a legitimate role makes daily, so six detection rules each fired at medium or low severity and only the shared source address showed they belonged to one intrusion; Elastic does not know how the credentials were obtained and names no victim."
  - claim_id: 166f42dd93
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "Between 2026-09-30 and 2026-10-16 one server serving a CyberStrikeAI web interface used the credentials of eight AWS identities (five IAM users and three EC2 instance roles) across four accounts and generated 78 alerts, the first case Elastic has seen of this tooling turned on AWS ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: a15d09da9f
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "It started by validating identities: GetCallerIdentity on four IAM users in three accounts within 51 minutes, three of the calls in the same second ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 3f81bb3043
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "An instance role then read a secret, made one user-data request and fired 56 more in 141 milliseconds, spacing Elastic says fits tooling working through a prepared list of instance IDs ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: daa460afc6
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "On 2026-10-02 another instance role read an encrypted Systems Manager parameter and issued a SendCommand 29 seconds later, which Elastic calls the highest-risk activity; the audit log does not show the command or its outcome ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: e30fc4d8e2
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "After 14 quiet days the server returned and revalidated credentials, including a user in a fourth account ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 047b9dad8c
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "Elastic does not know how the credentials were obtained and infers that the instance-role sessions, used from an outside address, were taken from the instances, for example through SSRF or host compromise ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
