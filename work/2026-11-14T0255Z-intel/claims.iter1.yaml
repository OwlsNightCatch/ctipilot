  - claim_id: 70019f8f66
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "**Exposure:** a Microsoft 365 tenant whose staff can open browser developer tools and take calls from outside IT, with Microsoft 365 Copilot reachable in the browser; ReliaQuest says law firms are the current focus and other sectors holding similarly sensitive data could be next ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
  - claim_id: 100832f2ae
    entry: 2026-11-14/luna-moth-token-handoff-copilot-graph-token-law-firms
    surface: "body"
    kind: cited
    text: "**Detection:** with no malware or endpoint alert, the evidence is ordinary-looking events, a blank email, an external video-call session and Graph access from an unfamiliar address, which ReliaQuest says to correlate across email, video-call and Microsoft 365 logs; a video-call screen share, a Copilot session, a visit to a text-sharing site and Graph file access from an unfamiliar address are each ordinary alone and together can indicate a token handoff ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-luna-moth-returns-re-targeting-law-firms-through-access-tokens/"]
