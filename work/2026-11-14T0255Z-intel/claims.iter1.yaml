    text: "Danfoss AK-SM 800A: six unpatched pre-auth RCE flaws, Strict mode no barrier; France blames Iran's IRGC for October"
  - claim_id: 7db001f658
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry and the C4 crisis cell attributed that campaign to the Iranian unit Shahid Kaveh, affiliated with the Revolutionary Guard's electronic and cyber centre, CERT-FR calling its case a bundle of indicators. The French documents cover that campaign only: more than 115 stores in at least six more countries and the first German shops followed on 2026-11-02, the French blood service reported altered cold-room settings at three sites the same day, and SRF reported on 2026-11-05 the first publicly known Swiss cases, a Köniz butcher and three Volg stores. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb; NCSC Switzerland rates the activity actively exploited but says the public information does not establish a common attack method or confirm exploitation of the Danfoss CVEs it lists, and ANSSI says controllers directly on the internet and weak passwords were exploited. CISA, FBI, HHS, USDA and DOT published a joint warning on refrigeration and cold-chain controllers that names no vendor. BACS repeated its warning publicly on 2026-11-10 and said updates fix the known flaws, a statement that predates and does not address the six pre-authentication remote-code-execution flaws Midnight Blue reported on 2026-11-11 in all Danfoss AK-SM 800A firmware up to 5.3.2: no CVE identifier or fixed version exists, BSI knows of no exploitation, and CCB says updating, new passwords and Strict mode are insufficient, so removing internet exposure comes first. ENISA, the European Commission, Europol and the CSIRTs Network advised immediate action on 2026-11-04, and Ransom-ISAC's log of one Copeland XWEB Pro compromise shows 743 parameter writes in two administrator sessions."
  - claim_id: 77cd5c82bc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: 451c50f45d
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges, alarm thresholds and notification recipients included, against the intended one, verify the actual temperatures and test that alarms reach staff; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, which do not close the six unpatched AK-SM 800A flaws that Midnight Blue and CCB report, so the interface stays off the internet; change all credentials where compromise is suspected and check the devices attached to the controllers, as BSI advises; and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
