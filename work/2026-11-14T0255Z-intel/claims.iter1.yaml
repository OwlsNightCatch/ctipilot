  - claim_id: 0d2d95f6ff
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "**Exposure:** AWS accounts where IAM user keys or instance-role credentials can leave the account and the principals may read EC2 user data or Secrets Manager values or send Systems Manager commands; secrets in user data are readable by any such principal and Elastic says to treat them as exposed ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 9d2859a1d5
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "**Detection:** in cloud control-plane audit logs, a burst of user-data requests from one role session; a first-time GetCallerIdentity from one external address across several users or accounts within a minute; GetSessionToken or GetSecretValue from an instance-role session whose source address is neither the instance nor your NAT; and a decrypting GetParameter followed within a minute by an SSM SendCommand from the same role ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 1bef6a9dcf
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "Six rules fired at medium or low severity, and Elastic recommends correlating such alerts by source address over a flexible window, since the gaps between steps ran from 141 milliseconds to 14 days ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 7376d56af8
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "**Triage:** each call is one a legitimate role makes every day, so the discriminators are the source address, the number of distinct identities, accounts or instances one address touches in minutes, and the decrypt-then-SendCommand pairing ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 6d34c45b01
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** correlate low and medium cloud alerts by source address, restrict `ec2:DescribeInstanceAttribute` for user data to the roles that need it, move secrets out of user data, and on a hit rotate instance-role credentials by replacing the instance profile or the instance, because stolen role credentials expire but can be reissued while the host stays compromised ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
  - claim_id: 6cf8d4cbb0
    entry: 2026-11-14/cyberstrikeai-aws-cloudtrail-intrusion-one-source-ip
    surface: "body"
    kind: cited
    text: "As of November none of the three servers served the CyberStrikeAI interface, so the indicator addresses are for retrospective hunting ("
    urls: ["https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion"]
