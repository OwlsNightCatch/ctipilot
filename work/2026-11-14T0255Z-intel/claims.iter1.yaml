  - claim_id: 844a988e3f
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "headline"
    kind: frontmatter
    text: "Kaspersky: BlackNevas used vCenter Host Profiles to enable SSH on ESXi, destroyed backups first, then wiped datastores"
  - claim_id: f5f939d974
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky GERT describes a ten-day engagement in which an adversary, identified as BlackNevas from its ransom notes, used credentials taken from systems outside the virtualisation layer to reach both vCenter appliances, persisted on one with a remote-access agent and a tunnel installed as a VMware-lookalike systemd service, then used vCenter Host Profile remediation to switch SSH on across four ESXi hosts, destroyed the backup environment first and detonated a wiper-capable locker that took every virtual machine. Kaspersky states no initial access vector, victim sector or country, and no virtualisation-layer vulnerability was exploited."
  - claim_id: e08c7db707
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "Kaspersky GERT describes an engagement in which an adversary destroyed an organisation's virtualisation estate over ten days: four ESXi hosts, every virtual machine on them, both vCenter Server Appliances and all connected backup infrastructure ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: 240c765d0d
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "No virtualisation-layer vulnerability was exploited: credentials obtained from non-virtualisation systems inside the perimeter reached the appliances, and every action against ESXi ran through legitimate VMware management interfaces ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: 3da0c1b515
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "The activity is attributed to BlackNevas through the ransom notes ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: cc3d6f4967
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "The attackers logged in as root over SSH to the vCenter appliance that manages virtualisation disaster recovery, fetched and deployed MeshAgent with a shell script 43 seconds later, and about four hours later returned through MeshAgent to install the Ligolo-ng tunnel as a persistent systemd unit whose name, description and Restart=always imitate appliance housekeeping ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: d712b4b7f5
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "They then used vCenter Host Profiles to change the TSM-SSH service state: eleven minutes after the first configuration read SSH was enabled on the target ESXi hosts, and direct SSH to the hosts then came from the vCenter appliance address ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: d6b10c89cc
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "Payloads went to ESXi over SFTP, a self-test of the executable ran about three hours before the final detonation, and about the first 2 KB of the virtual disk files were overwritten ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: 0164ad3c5f
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "The backup environment fell first: the attacker extracted stored credentials after gaining administrative execution on the backup infrastructure, disabled antivirus there days earlier, then stopped backup services and encrypted the recovery infrastructure, all before ESXi detonation ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: d5d758fc58
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "**Exposure:** a vCenter and ESXi estate where accounts from systems outside the virtualisation layer can reach the vCenter appliances and where Host Profile remediation can change the SSH service state; the article names no version ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: 827719428e
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "**Detection:** in vCenter events and tasks and in vpxa.log and vobd.log, Host Profile remediation that changes TSM or TSM-SSH from policy-disabled to running outside an approved change window, which Kaspersky rates critical when an SSH session from vCenter or another management appliance to the same host follows within 15 minutes; on the vCenter appliance, a new VMware-looking systemd unit absent from the organisation's list of trusted services; in ESXi shell logs, execution of a newly staged executable under /tmp followed by access to /vmfs; and preserved hostprofiletrace.log ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: de24e8d2df
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "ESXi logs sit in a ramdisk that is cleared at reboot, so Kaspersky says not to begin by rebooting a host ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: c21ccd5038
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "**Triage:** each Host Profile step is legitimate alone, so the distinguishing context is authorisation, timing, source account, change window and whether the desired state weakens security; a VMware-looking service is not malicious by default, since custom integrations exist, but one absent from the trusted list is a high-confidence anomaly, and chmod +x is ambiguous alone while execution of a newly staged executable from /tmp is itself a strong indicator ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
  - claim_id: 8053ff0032
    entry: 2026-11-14/kaspersky-blacknevas-vcenter-host-profile-ssh-backups-first
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat the vCenter appliances as the control plane to protect: alert on Host Profile changes to TSM-SSH outside change windows and on SSH from vCenter to ESXi that follows them, review VMware-looking services on the appliances against a trusted list, and keep backup-platform credentials and administration separate from the systems that can reach vCenter, because the backup environment was destroyed before the hosts ("
    urls: ["https://securelist.com/esxi-ransomware/121959/"]
