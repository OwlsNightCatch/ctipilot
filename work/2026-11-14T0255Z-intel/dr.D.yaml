    problem: '''October 2025'' dates Case #1 only (the earlier article''s timeline); the new article gives no dates. ''Separate engagement'' is an inference from differing facts - Kaspersky never says the cases are distinct or the same victim. Hedge it (''Kaspersky does not say whether this is the same victim as Case #1'').'
