  unsupported_or_needs_correction:
  - findings_text: 'title/summary: ''stolen credentials reach vCenter appliances'''
    problem: the article says 'credentials obtained from non-virtualization systems inside the organization's perimeter'; how or where they were obtained (theft, reuse, dumping) is not stated. Its general 'credential reuse from the Windows estate' section describes a path class, not this case's mechanism. Use 'credentials obtained from systems outside the virtualization layer'.
    claim_ids:
    - '2.08'
    - '2.07'
  - findings_text: 'summary: ''wipe, depth and detach switches that Kaspersky compares (medium confidence, no binary available) with the BlackNevas/Trigona family'''
    problem: Kaspersky rates /p, /depth, /detach High and gives 'Medium' only for /allsys and /-showvolumes; the family link is argument-style resemblance plus the BlackNevas ransom notes, which Kaspersky says 'strengthens attribution but does not replace a binary hash or reverse-engineered match'. Attribute the basis (ransom notes, argument style), not a blanket 'medium'.
    claim_ids:
