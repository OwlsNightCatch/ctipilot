  benign_lookalike_discriminators_stated_by_article:
  - 'VMware-looking systemd unit: unrecognised VMware-looking services are not malicious by default because custom integrations exist; a service absent from the organisation''s own trusted-service list is the high-confidence anomaly (claim 2.21).'
  - 'Host Profile / vCenter change: each step is legitimate in isolation; the discriminating context is authorization, timing, source account, change window and whether the desired state weakens security; SSH from vCenter is normally a trusted source (claims 2.27, 2.29, 2.30).'
  - '''true''-only SSH sessions: a human or another automation framework could produce them; hunt as a behavioral fingerprint, stronger with an unusual client identifier, SFTP staging to /tmp, chmod and a self-test (claims 2.37, 2.38).'
  - chmod +x is ambiguous alone; unexpected execution of a newly staged executable from /tmp is itself a strong indicator (claim 2.41).
  - Valid-account logon to vCenter looks normal; judge by source host, account history, time, destination, subsequent admin actions and whether the account normally manages virtualization (claims 2.09, 2.10).
  - The article states no other lookalike discriminators; do not invent any.
