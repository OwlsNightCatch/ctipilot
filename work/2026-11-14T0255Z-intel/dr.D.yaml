  supported_without_change:
  - Ten-day estate destruction, four ESXi hosts, both VCSAs and backups; ransom notes naming BlackNevas (first observed November 2024).
  - No vulnerability exploited; actions through legitimate VMware management interfaces.
  - 43 s / 2 min 26 s / about four hours MeshAgent-then-Ligolo-ng sequence; Host Profile T+0 / T+10m18s / T+10m51s (33 s) sequence; SFTP payload with FlowSsh client identifier and 'true' probes; self-test about three hours before detonation; 23 s VM stop; first ~2 KB overwritten; backups first.
  - The evidence quotes in S3 items[1] (four) are verbatim substrings of the article.
  open_questions:
  - Initial-access vector and the origin of the credentials are not stated; the IOC table's 'initial portal access' is the only hint and does not name the portal.
  - 'Whether this is the same victim as Case #1 of the 2026-11-06 article is not stated.'
  - Incident dates and victim identity are not given.
  - The VM-stop technique is unknown to Kaspersky; no encryptor binary was available.
  - '`extract` reported ''served via jina'' for the Securelist article (its direct rungs failed), so the saved copy is the reader''s markdown; table cells run together there (for example ''window.vCenter Events''). Claims flagged table_cell_text depend on that rendering: a verifier that re-reads the page with another transport should rely on the prose-sentence claims first.'
  - 'Chronology: the article gives only relative offsets (Host Profile T+0 / T+10m18s / T+10m51s; self-test about three hours before detonation; AV disabled on the backup environment days before the main attack; ten days from initial access to the destructive phase) and no absolute dates, so the stage numbering in observable_behaviors_by_stage is a logical order, not a stated chronology; how the VCSA persistence and Host Profile steps interleave with the backup disruption is not stated.'
