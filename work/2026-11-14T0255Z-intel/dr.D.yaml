- item: 2
  findings_ref: work/2026-11-14T0255Z-intel/findings.S3.yaml items[1]
  title: 'Kaspersky GERT (Securelist, 2026-11-13): BlackNevas destruction of a virtualised estate via vCenter, MeshAgent and Ligolo-ng persistence, Host Profile enabling of ESXi SSH, backups first, /vmfs wipe'
  primary: 'https://securelist.com/esxi-ransomware/121959/ (read in full via extract, served through the reader transport; title ''Ransomware at the hypervisor layer: how attackers use ESXi and vCenter features for malicious purposes'', published 2026-11-13T09:00:43+00:00)'
  bottom_line:
  - The S3 summary is faithful to the article on the load-bearing facts (scope, MeshAgent then Ligolo-ng on the DR VCSA, Host Profile timeline, SFTP payload, self-test, wipe, backups first); the corrections are listed in `unsupported_or_needs_correction`.
  - 'The article names no victim country or sector, no incident dates, no initial-access vector, and does not say whether this engagement is the same victim as Case #1 of Kaspersky''s 2026-11-06 article.'
  - 'Independent corroboration: none for the incident itself (Kaspersky is the only source); SentinelOne''s BlackNevas anthology (2025-04-30) independently corroborates only the family description (Trigona derivative, first observed November 2024, /path /wipe /depth /detach switches).'
  distinct_from_existing_entry:
    existing_entry: 'entries/2026-11-07/kaspersky-esxi-proxmox-ransomware-monitoring-root-password.md (primary: Securelist 2026-11-06, 121819)'
    paragraph: 'The two BlackNevas engagements differ in how the attacker reached the hypervisor and what it did to the management plane. In Case #1 of the 2026-11-06 article (the existing entry) the route ran from a Windows host in a virtualised domain-controller segment to a PRTG monitoring server that held ESXi credentials, and one root password reused across several ESXi nodes gave direct root SSH to the hosts; Kaspersky stresses that this direct SSH bypassed vCenter controls, the attacker disabled execInstalledOnly with esxcli, ran the locker and cleared the logs, and the case is dated 2025-10-18/19. In the 2026-11-13 article the target is the management plane itself: credentials obtained from systems outside the virtualisation layer reached both vCenter Server Appliances, the attacker logged in as root over SSH to the disaster-recovery appliance, installed MeshAgent and, hours later, a Ligolo-ng reverse tunnel as a VMware-lookalike systemd unit, then used vCenter Host Profile remediation to switch the TSM-SSH service on across the ESXi hosts (read at T+0, push at T+10m18s, service RUNNING at T+10m51s) so that SSH to ESXi then came from the trusted vCenter address; the payload went in over SFTP, a self-test ran about three hours before the /vmfs wipe, and the backup estate was disabled and encrypted first, over ten days of dwell time across four ESXi hosts, two VCSAs and the backup infrastructure. No PRTG, no reused root password, no execInstalledOnly change and no incident date appear in the new article. Kaspersky does not say whether the two cases are one victim; the stated access path and management-plane technique differ, which is the basis for declaring a distinct finding with the earlier entry in references[].'
    differences_table:
    - aspect: first foothold shown
      existing_case1: BlackNevas activity on a Windows host in a virtualised DC segment; AnyDesk and GMER executions in UserAssist
      new_case: not stated; 'credentials obtained from non-virtualization systems inside the organization's perimeter' reached the VCSAs; an IOC row mentions a VPS 'used for initial portal access' with no portal named
    - aspect: path to hypervisor
      existing_case1: PRTG monitoring deployment with broad ESXi access plus one root password reused across nodes; direct root SSH to ESXi
      new_case: vCenter Server Appliance compromised first (root SSH), then Host Profile remediation turned TSM-SSH on, then SSH to ESXi from the vCenter address
    - aspect: management-plane technique
      existing_case1: none; Kaspersky says direct SSH bypassed vCenter role controls
      new_case: vCenter Host Profile abuse (config read, push, service RUNNING in about 11 min) and persistence on the VCSA (MeshAgent, Ligolo-ng systemd unit)
    - aspect: execution controls
      existing_case1: execInstalledOnly disabled with esxcli; first run blocked ('Execution of non-installed file prevented'); logs cleared
      new_case: no statement that execInstalledOnly was changed or logs cleared; payload staged under /tmp via SFTP, self-test, then /vmfs wipe
    - aspect: recovery path
      existing_case1: not discussed
      new_case: AV disabled on backup environment days earlier, backup services stopped, recovery infrastructure encrypted, admin access disrupted, backup credentials extracted - all before ESXi detonation
    - aspect: scale and timing
      existing_case1: several ESXi nodes in two subnets; 2025-10-18/19
      new_case: four ESXi hosts, both VCSAs, all connected backup infrastructure; 10-day dwell; no dates
    - aspect: common thread (not a shared claim to repeat)
      existing_case1: BlackNevas; ./esx /selftest then /p /vmfs/ /depth 5 /log /wipe
      new_case: BlackNevas by ransom note; /tmp executable run with /selftest then /p /vmfs/ /depth 5 /wipe /allsys /detach /-showvolumes - the same self-test-then-wipe invocation pattern; neither article links the two cases
    shared_claims_not_to_repeat:
    - Kaspersky GERT investigated a BlackNevas ESXi ransomware case at all (already the existing entry's headline); the new entry must lead with the vCenter / Host Profile / backup-first story and cite BlackNevas only as this case's own attribution (ransom notes, command-line style).
    - 'PRTG Network Monitor holding ESXi credentials; one root password reused across ESXi nodes; direct root SSH to ESXi; AnyDesk and GMER on a Windows DC-segment host; the 2025-10-18/19 dating (all Case #1 only).'
    - 'execInstalledOnly disabled via esxcli, ''Execution of non-installed file prevented'', log clearing on ESXi (Case #1; not observed in the new case per the article).'
    - 'The Gentlemen / Proxmox VE / plaintext administrator notes / VNC web socket (Case #2 of the earlier article; unrelated).'
    - '''No VM escape was required'' and the monitoring-account / password-reuse lessons; the new article has its own ''no guest-to-host escapes, no hypervisor memory corruption'' statement - cite that, not the earlier one.'
    - 'Generic hardening already in the existing entry: dedicated least-privilege monitoring identity, vault retrieval of root passwords, administer ESXi through vCenter with Lockdown Mode and SSH stopped by default, keep logs off the hosts, alert on changes to execInstalledOnly / Secure Boot enforcement / Lockdown Mode / SSH / local accounts / remote logging. The new entry should carry only the new angle: vCenter as Tier 0, Host Profile as a path around a policy-disabled-SSH posture, vCenter-to-ESXi traffic baselining, backups as a separate security boundary, remote syslog outside the virtualisation trust domain for vCenter and VCSA too.'
    - 'The /selftest then /p /vmfs/ /depth 5 /wipe invocation is already visible in the earlier article''s Case #1 timeline (the existing entry''s text does not mention it); if used, cite both articles and say neither links the cases.'
  victim_sector_country: NOT STATED. The article says only 'an organization's virtualization estate'; no sector, country, size, incident dates or victim name. Do not derive a Swiss or public-sector nexus from the article; the S3 region_nexus sentence is composer context, not a finding.
  observable_behaviors_by_stage:
  - stage: 1 Access to vCenter
    behavior: credentials obtained from systems outside the virtualization layer used to reach both VCSAs; how or where they were obtained is not stated; no vulnerability exploited; Kaspersky does not name the initial-access vector
    telemetry: 'vCenter/SSO authentication and VCSA auth logs: source host, account history, time, destination, whether the account normally manages virtualization (Kaspersky lists SSO logs, auth logs, wtmp, shell history for VCSA access); valid-account use ''may appear operationally normal'''
    claim_ids:
    - '2.07'
    - '2.08'
    - '2.09'
    - '2.10'
    - '2.11'
  - stage: 2 Foothold on the DR VCSA
    behavior: root SSH login; 43 s later a shell script fetches and deploys MeshAgent (legitimate MeshCentral agent); the 2 min 26 s session ends and SSH to that appliance is never used again; return about four hours later through MeshAgent
    telemetry: VCSA auth log / wtmp / shell history for the short root SSH session; process and file creation for the agent; egress from the appliance to the management agent's server (addresses omitted); monitoring limited to interactive SSH misses everything after the first session
    claim_ids:
    - '2.14'
    - '2.15'
    - '2.16'
    - '2.17'
    - '2.19'
  - stage: 3 Persistence on the VCSA
    behavior: Ligolo-ng reverse tunnel run as a persistent systemd unit with a VMware-like name, binary under /opt/vmware/bin/, a plausible 'DNS, time, VM settings sync' style description and Restart=always; a Windows remote-management agent service also appears among artifacts
    telemetry: 'VCSA filesystem / audit: new or modified unit in /etc/systemd/system referencing a binary not in the approved baseline under a VMware-like path (rated High by Kaspersky); outbound tunnel traffic from the management segment'
    claim_ids:
    - '2.17'
    - '2.18'
    - '2.20'
    - '2.21'
    - '2.57'
    - '2.88'
    - '2.89'
  - stage: 4 vCenter Host Profile turns SSH on
    behavior: Host Profile workflow reads host configuration (T+0), pushes a configuration change enabling SSH (T+10m18s), TSM-SSH reaches RUNNING (T+10m51s; 33 s after the push); afterwards SSH to ESXi originates from the vCenter appliance address; remediation moved SSH from policy-disabled to remote-reachable in about eleven minutes
