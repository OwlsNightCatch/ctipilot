    problem: 'these four are not in Kaspersky''s ATT&CK table (inferred, T1555 weakest) and the behavior with the best direct evidence, the /wipe overwrite, maps to T1485, which is missing. Kaspersky''s own table: T1078/T1078.002, T1021.004, T1543.002, T1572, T1490, T1486 (T1078.001 flagged not observed).'
