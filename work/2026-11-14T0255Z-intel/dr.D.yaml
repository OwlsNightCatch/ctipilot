  - findings_text: summary names the VMware-lookalike systemd unit by its incident-specific service name and quotes its description
    problem: Kaspersky lists the service name as an incident-specific indicator (IOC); the entry rules forbid IOCs. Describe it as a VMware-lookalike unit under /etc/systemd/system whose ExecStart sits under /opt/vmware/bin; omit the name.
