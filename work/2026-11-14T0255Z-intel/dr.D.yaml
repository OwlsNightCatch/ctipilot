  prerequisites_and_mechanics:
    CVE-2026-111760: 'Victim runs git clone --recurse-submodules against an attacker-controlled repository (directly, or via an innocuous .gitmodules in a repository the victim does trust). A crafted tree builds a path of 2^32+ bytes after ''.git'' so the 32-bit ce_namelen wraps and checkout writes it as ''.git''; for a freshly cloned submodule .git is a gitfile, so the symlink is written, pointing at a directory with hooks/config that then run. Maintainers hedge: ''as far as we know'' only with --recurse-submodules. The malicious repository fails fsck LARGE_PATHNAME / TREE_NOT_SORTED so it cannot easily be pushed to major forges (it must be self-hosted). Affects developer workstations, CI runners and any service that recursively clones untrusted repositories.'
    CVE-2026-105437: 'Textual three-way merge (git merge, rebase, cherry-pick, merge-tree) on a repository with a committed .gitattributes carrying a huge conflict-marker-size plus a file with many separate conflicts; 32-bit signed size wraps, small buffer, heap writes first past the end then before the start. On forges: needs the server to read attributes from trees (attr.tree or --attr-source); then any user who can push branches and open a merge/pull request triggers it; GitLab states it extends to RCE as the git OS user in Gitaly (reads/writes every repository on that Gitaly node). Local merges of untrusted repositories are also exposed. Interim workaround (CNA/issue #814, relayed by THN): ''* conflict-marker-size=7'' in each repository''s info/attributes, or disable server-side mergeability checks for untrusted repositories; GitLab detection page adds limiting who can create projects and sign up.'
    CVE-2026-113408: malicious server + protocol v2 clone of an empty repository; unborn HEAD symref with path traversal; with the files ref backend a later commit writes outside refs (CVSS 3.3).
    CVE-2026-114467: tag with more than two signatures merged with git merge corrupts stack (DoS; forges that merge on push are exposed) (CVSS 3.3).
    CVE-2026-114469: git apply of a binary patch inflating beyond 1 GiB crashes Git with out-of-bounds read (CVSS 4.4).
    CVE-2026-114466: git fast-import rewrite-submodules-from/to and export-pack-edges accept arbitrary file read/append from an untrusted stream; now gated behind --allow-unsafe-features (backwards-incompatible) (CVSS 4.4).
  detection_material_stated_by_sources:
  - 'GitLab (detection page, self-managed): Gitaly event whose error field holds ''merge-tree: signal:'' followed by anything but killed/terminated (e.g. segmentation fault; bus error seen on macOS), grpc.method UserMergeToRef or ListConflictFiles, fallback failed MergeRequestMergeabilityCheckWorker Sidekiq job with the text in exception.message, kernel-log segfault line per Git child process as corroboration. Limits GitLab states: rules validated on 19.4.1 wording only; a working attempt is silent; a clean result does not prove the flaw was not used; many installations do not ship the Gitaly and Sidekiq logs.'
  - 'GitLab (same page): repository-side indicator = .gitattributes in the target branch setting conflict-marker-size to an unusually large value; post-hit hunt = writes by the git OS user on the Gitaly node (new files in the git user''s .ssh, unexpected files under the Gitaly data directory, sshd-spawned processes that are not gitlab-shell, new cron entries or outbound connections for the git user); if any code execution is found treat every repository on that Gitaly node as compromised and rotate gitlab-secrets.json, CI/CD variables, runner tokens, access tokens.'
  - 'Git/GitHub: no detection guidance beyond update and ''clone only from trusted servers, avoid recursive clones of untrusted repositories, avoid merging untrusted content or tags, binary patches or fast-import streams from untrusted sources''.'
  - 'Inference (mine, mechanical, not stated by a source): clone-time exploitation of CVE-2026-111760 would show as process-creation events where git (or a hook/shell) spawns children during clone/submodule update on a developer or CI host, and as a .git entry that is a symlink in a submodule working tree; no source describes this telemetry.'
  benign_lookalike_discriminators_stated: None stated by any source for CVE-2026-111760. For CVE-2026-105437 GitLab states only that a healthy git merge-tree never ends with a memory fault and normal merge conflicts are reported without a signal, and that 'killed'/'terminated' mean Gitaly or a memory limit stopped the child (benign cause); an ordinary repository does not set a huge conflict-marker-size. Offer no Triage line beyond that.
  attack_suggestions:
  - id: T1190
    name: Exploit Public-Facing Application
    behavior: push a .gitattributes with a huge conflict-marker-size plus branches with many conflicts and open a merge request so GitLab/Gitaly's server-side git merge-tree overflows the heap (CVE-2026-105437); GitLab's detection page itself maps T1190
    status: active in pinned v20.1 dataset
  - id: T1203
    name: Exploitation for Client Execution
    behavior: 'clone-time code execution on a workstation or CI runner via git clone --recurse-submodules of an attacker repository (CVE-2026-111760): replaced submodule .git symlink points at attacker hooks/config that run'
    status: active; platforms Linux/Windows/macOS
  - id: T1499.004
    name: Application or System Exploitation
    behavior: 'optional, GitLab''s detection page lists it: the merge-tree child crash (the failed attempts) and the DoS-class bugs CVE-2026-114467/-114469; low value as a mapping'
    status: active; optional, mapped by GitLab only
  attack_not_suggested: No technique for the hook execution itself or for the DoS-class CVEs beyond the optional T1499.004; do not add T1195.x (no source describes a supply-chain compromise).
