  - claim_id: f3b813240d
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry attributed that campaign, and only that campaign, to the Iranian unit Shahid Kaveh. More followed: more than 115 stores in at least six more countries and the first German shops on 2026-11-02, altered cold-room settings at three sites of the French blood service through a supplier, and, per SRF on 2026-11-05, a Köniz butcher and three Volg stores in Switzerland. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, and NCSC Switzerland rates the activity actively exploited. On 2026-11-11 Midnight Blue reported six pre-authentication remote-code-execution flaws in all Danfoss AK-SM 800A firmware up to 5.3.2, with no CVE identifier or fixed version and no known exploitation (BSI); CCB says updating, new passwords and Strict mode are insufficient, so removing internet exposure comes first, and BACS's statement of 2026-11-10 that updates fix the known flaws predates the report and does not cover the six."
