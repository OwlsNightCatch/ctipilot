item_1_cyberstrikeai_aws:
  finding_ref: work/2026-11-14T0255Z-intel/findings.S3.yaml items[2]
  title_short: 'Elastic Security Labs: CyberStrikeAI used against AWS (2026-09-30 to 2026-10-16)'
  sources_read_in_full:
  - url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    publisher: Elastic Security Labs (Samir Bousseaden, Bryan Porras Blanch, Terrance DeJesus)
    date: '2026-11-13'
    role: primary
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
  - url: https://www.team-cymru.com/post/tracking-cyberstrikeai-usage
    publisher: Team Cymru (Will Thomas)
    date: '2026-03-02'
    role: background on the tool (not on this intrusion)
    saved_copy: work/2026-11-14T0255Z-intel/dr/cymru-cyberstrikeai.md (+ cymru-raw.html for the indicator table)
  - url: https://thehackernews.com/2026/03/open-source-cyberstrikeai-deployed-in.html
    publisher: The Hacker News
    date: '2026-03-03'
    role: secondary relay of Team Cymru; the article Elastic links for the 21-IP count
    saved_copy: work/2026-11-14T0255Z-intel/dr/thn-cyberstrikeai.md
  - url: https://aws.amazon.com/blogs/security/ai-augmented-threat-actor-accesses-fortigate-devices-at-scale/
    publisher: Amazon Threat Intelligence (AWS Security Blog)
    date: 2026-02 (page date not extracted)
    role: first-party source for the FortiGate campaign Team Cymru started from; does not name CyberStrikeAI
    saved_copy: work/2026-11-14T0255Z-intel/dr/aws-fortigate-ai.md
  independent_confirmation_of_the_intrusion: none found. WebSearch ("CyberStrikeAI AWS CloudTrail intrusion Elastic Security Labs" and a second query on the 56 requests / 141 ms) returned no other report of this intrusion or of CyberStrikeAI used against AWS. Elastic holds the telemetry; verification stays single-source (Admiralty source B, credibility 2-3 on the incident; the tool itself is independently documented by Team Cymru, the incident is not).
  ordered_api_call_sequence:
  - phase: 1
    date: '2026-09-30'
    offset: T+0 to T+51 min
    identities: email-svc-user, cert-renew-user, logship-user-1, logship-user-2 (IAM users, accounts A, B, C)
    api_calls: STS GetCallerIdentity (four users, three accounts; three calls in one second); STS GetSessionToken x2 on email-svc-user
    telemetry_class: cloud control-plane audit log (AWS CloudTrail); STS service (per the rule names)
    rule_that_fired: AWS STS GetCallerIdentity API Called for the First Time (Medium); AWS STS GetSessionToken Usage (Low)
  - phase: 2
    date: '2026-09-30'
    offset: T+0, T+3h18, T+6h10 (burst over 141 ms)
    identities: app-role (EC2 instance role, account A)
    api_calls: Secrets Manager GetSecretValue (first access by the role); EC2 DescribeInstanceAttribute for userData x1 (probably a test), then x56 in 141 ms (about 2.5 ms per call); 57 userData calls that day from one assumed-role session
    telemetry_class: cloud control-plane audit log (AWS CloudTrail); EC2 and Secrets Manager
    rule_that_fired: AWS EC2 User Data Retrieval for EC2 Instance (Medium, 58 alerts over phases 2-3); First Time Seen AWS Secret Value Accessed in Secrets Manager (Medium)
  - phase: 3
    date: 2026-10-01 to 2026-10-02
    offset: Oct 1 T+0 s to T+4h14; Oct 2 T+0 s and T+29 s
    identities: several users (revalidation); app-role; nonprod-role (instance role); container-role (instance role)
    api_calls: 'Oct 1: GetCallerIdentity x4, GetSecretValue and one more DescribeInstanceAttribute by app-role, GetSecretValue x2 by nonprod-role (about 3 minutes apart). Oct 2: SSM GetParameter with decryption (SecureString) by container-role, then SSM SendCommand 29 seconds later'
    telemetry_class: cloud control-plane audit log (AWS CloudTrail); Systems Manager. Command content and outcome are NOT in the audit record (Elastic)
    rule_that_fired: AWS Systems Manager SecureString Parameter Request with Decryption Flag (Medium); AWS SSM SendCommand Execution by Rare User (Low)
  - phase: 4
    date: '2026-10-16'
    offset: T+0, T+1h57, T+3h7 after 14 quiet days
    identities: named-user (IAM user, account D, new); logship-user-1 (account C); logship-user-2 (account B)
    api_calls: STS GetSessionToken (named-user); GetCallerIdentity (logship-user-1, logship-user-2)
    telemetry_class: cloud control-plane audit log (AWS CloudTrail); STS
    rule_that_fired: GetCallerIdentity first-time and GetSessionToken rules (phases 1,3,4 and 1,4 per the rule table)
  note_on_step_telemetry: Elastic presents the whole record as CloudTrail ("Nothing in CloudTrail looked urgent") and names STS, EC2, Secrets Manager and Systems Manager through the rule titles; it states no event-source strings, no user-agent, no management-vs-data-event split. The telemetry_class column is the vendor-neutral class (cloud control-plane audit log) plus the service Elastic names, nothing more.
  detections_fired:
    total_alerts: 78
    rules: 6
    table:
    - rule: AWS EC2 User Data Retrieval for EC2 Instance
      alerts: 58
      severity: Medium
      phase: 2, 3
    - rule: AWS STS GetCallerIdentity API Called for the First Time
      alerts: 11
      severity: Medium
      phase: 1, 3, 4
    - rule: First Time Seen AWS Secret Value Accessed in Secrets Manager
      alerts: 4
      severity: Medium
      phase: 2, 3
    - rule: AWS STS GetSessionToken Usage
      alerts: 3
      severity: Low
      phase: 1, 4
    - rule: AWS SSM SendCommand Execution by Rare User
      alerts: 1
      severity: Low
      phase: '3'
    - rule: AWS Systems Manager SecureString Parameter Request with Decryption Flag
      alerts: 1
      severity: Medium
      phase: '3'
    precision: 'Four of the six rules are Medium and two are Low. "Fired low" in the findings title and in the assignment text is imprecise: Elastic says every alert was medium or low severity.'
    why_low_as_stated: 'Elastic gives the reason in behavioural terms only: each alert is a call a legitimate role makes every day (first-time GetCallerIdentity, GetSessionToken, SendCommand from a rare user) and looked routine on its own. The rule names show three are new-terms / first-seen / rare-user style (low-confidence by design); the article states no risk scores and does not explain how severities were assigned. Do not invent a scoring rationale.'
  correlation_key_recommended: source IP address (the shared source address) with a flexible, non-fixed correlation window; Elastic says medium and low alerts are good candidates for correlation "only by source IP". The observed gaps between steps ran from 141 ms to 14 days.
  high_signal_rules_added_by_elastic:
  - 'AWS EC2 Bulk User Data Enumeration: one principal and source IP reading userData from more than 20 distinct instances in 10 minutes (ES|QL; Elastic calls it high-severity, low false positive)'
  - 'AWS STS GetCallerIdentity Bulk Account Enumeration: three or more distinct non-role identities calling GetCallerIdentity from the same external IP and ASN in 10 minutes'
  benign_lookalike_discriminators_stated_by_article:
  - Role-session calls (GetSessionToken, GetSecretValue) whose source IP is not the instance or your NAT (Elastic behavioural indicator)
  - GuardDuty-style alerting on credentials used from outside your expected IP ranges (Elastic response step 8; the passage is generic advice)
  - The article states no further benign-lookalike analysis. Its only statement on legitimate behaviour is that each call is one "a legitimate role makes every day".
  credential_acquisition: 'Unknown. Elastic: "we do not know how the attacker obtained the credentials". Inference stated by Elastic: the three instance-role sessions were used from an outside IP, so those credentials were taken from the instances (for example SSRF or host compromise); the five IAM-user credentials have no stated source. The article never mentions ARTEX, exposed repositories, GitHub secrets search, or any named actor.'
  victim_sector_country: None named. Account and identity names are replaced with aliases (app-role, logship-user-1, ...); no victim, sector, country or account count beyond four is given. The article has no mention of public sector.
  actor_attribution: None. Elastic attributes the SERVER to the CyberStrikeAI tool (scan data) and names no operator, cluster or nationality. It notes Hong Kong hosting matches earlier reporting. Team Cymru separately assesses the tool developer, not the operator of this server.
  team_cymru_adds_independently:
  - 'The tool profile: Go-based, 100+ integrated tools, orchestration engine, dashboard; published on GitHub 2025-11-08 by developer "Ed1s0nZ".'
  - 'Its own netflow-based count: 21 unique IPs running the tool between 2026-01-20 and 2026-02-26, hosted mainly in China, Singapore and Hong Kong; its indicator table (raw HTML, not in the extracted text) lists 21 servers with GeoIP China 9, Singapore 6, US 3, Hong Kong 1, Switzerland 1, Japan 1 (counts by the reader from that table; the HTML GeoIP column).'
  - Team Cymru assessed the developer has some ties to the Chinese government (GitHub interactions with Knownsec 404 and a CNNVD award reference the developer later removed); that is Team Cymru's inference from public GitHub activity and concerns the developer, not any operator.
  - It found the tool by a banner on an IP that Amazon's CTI team published for a FortiGate campaign; the Amazon post itself describes a Russian-speaking, financially motivated actor and does not name CyberStrikeAI. So the tool is documented in use by at least one non-Chinese-nexus actor, per Amazon plus Team Cymru.
  - 'It does NOT document any AWS targeting. Nothing in the Team Cymru post supports Elastic''s gloss that all 21 addresses were "aimed at Fortinet edge devices": its NetFlow evidence of FortiGate targeting is shown for the single Amazon-published IP; the other 20 are listed only as "running CyberStrikeAI".'
  - THN (2026-03-03) adds the sentence that additional servers were detected in the U.S., Japan and Switzerland. The Swiss row is a hosting location (a Swiss-registered network, last seen 2026-01-30), not a target and not an operator nationality.
  store_overlap:
    cyberstrikeai_in_store: 'Named only in 2026-10-26/jpcert-nict-app-to-backend-api-attacks-ai-scanning-japan (JPCERT/CC AT-2026-0030 update lists "Cairn, CyberStrikeAI, ARTEX" as AI penetration-testing platforms used against Japanese internet-facing web apps and WSUS servers). The registry has no tool:cyberstrikeai key (grep entities/registry.yaml: the only hit is the summary of campaign:japan-web-system-data-leak-wave-2026-09). That entry''s entities list tool:artex and tool:cairn-exploitation-engine but not CyberStrikeAI.'
    artex_entries:
    - '2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse (Microsoft: Storm-0940, ARTEX, OAuth app abuse; updated 2026-11-08; also covers GTIG/Mandiant, CrowdStrike, Recorded Future, CERT-EU on ARTEX)'
    - 2026-10-30/vapor-panda-artex-agentic-campaign-foreign-ministries (CrowdStrike VAPOR PANDA)
    - '2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex (Microsoft + Todyl: agentic framework searches GitHub for OAuth and cloud secrets, service-principal sign-ins; government clients among 27 organisations; priority high)'
    - 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    other_adjacent_entries:
    - '2026-07-09/sygnia-ai-orchestrated-aws-cloud-intrusion-72h (Sygnia: AI-assisted AWS intrusion; four keys from four accounts used from one source IP in one second; Secrets Manager and SSM Parameter Store theft; T1651; detection signal is the orchestration, not single actions; actions[] already says "alert on a single source IP ... authenticating with multiple distinct IAM access keys or accounts within seconds"). This is the closest repeat risk.'
    - 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles (AWS control-plane abuse; Secrets Manager, Parameter Store, Lambda config reads; shares registry product keys product:aws-secrets-manager, product:aws-systems-manager-parameter-store, product:amazon-web-services-iam; no victim named; credential compromise not known)
    - 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale (stolen cloud keys; control-plane hunting guidance for AWS)
    is_it_distinct: 'Yes on the finding: a different tool (CyberStrikeAI, not ARTEX), a different evidence base (CloudTrail from one lab, tool attribution from scan data), no actor, no Entra/GitHub path, and the AWS-specific step sequence (userData burst, SSM SendCommand, 14-day return) appears nowhere in the store (grep for DescribeInstanceAttribute / userData / SendCommand / GetCallerIdentity finds only Sygnia and Qubole for SSM/GetCallerIdentity in passing). It is a threat entry, not an update of the ARTEX entries; references[] to the Sygnia entry (07-09), the ARTEX entry 2026-11-06 and the JPCERT entry 2026-10-26 are the natural links. The JPCERT entry could take an improvement record adding tool:cyberstrikeai once the key exists.'
    claims_that_would_repeat_existing_entries:
    - AI-assisted/agentic tooling producing machine-speed cloud activity and "the detection signal is the orchestration" (Sygnia 07-09; ARTEX 10-22)
    - One source IP using several identities/accounts within seconds as the hunting pivot (Sygnia 07-09)
    - Secrets Manager and SSM Parameter Store harvesting after stolen credentials (Sygnia 07-09; Qubole 11-11)
    - Credential origin unknown for a cloud intrusion (Qubole 11-11)
    - Generic "agentic frameworks lower the barrier" framing (ARTEX 10-22, exposed-app-credentials 11-06)
    - CyberStrikeAI as one of several AI pentest platforms in circulation (JPCERT 10-26)
  claim_table:
  - claim: 'Scope of the intrusion: window, identity count, account count, alert count'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: used credentials from eight AWS identities (five IAM users and three EC2 instance roles) across four accounts and generated 78 alerts.
  - claim: 'The sequence in one line: validate identities, harvest Secrets Manager, pull EC2 user data, decrypt an SSM parameter, send a remote command'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: ' server worked through stolen AWS credentials in a familiar sequence: validate identities, harvest secrets from Secrets Manager, pull EC2 user data, decrypt an SSM parameter, send a remote command.'
  - claim: Telemetry source of every step is the CloudTrail record (the lab describes the article as the CloudTrail record of the intrusion); the lab also says every step is a call a legitimate role makes daily
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: Every one of those is a call a legitimate role makes every day. Nothing in CloudTrail looked urgent at the time.
  - claim: 'Step 1 (Sep 30): GetCallerIdentity on four IAM users across three accounts within 51 minutes; three calls in the same second, one per account'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: The server called GetCallerIdentity on four IAM users across three accounts within 51 minutes, a standard way to check which credentials still work. Three of those calls landed in the same second, one in each of three accounts, which points to automation.
  - claim: 'Step 1b: two GetSessionToken calls on one IAM user (email-svc-user)'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: Two GetSessionToken calls on one user show it requesting temporary credentials.
  - claim: Step 1 identities are service accounts
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: The validated accounts are service accounts, which are often rotated rarely and watched less closely.
  - claim: 'Step 2 (Sep 30): app-role (EC2 instance role, Account A) reads a secret, makes one user-data request, then 56 user-data requests in 141 ms'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: The main activity came from app-role, an EC2 instance role in Account A. It read a secret, made one user data request, then fired a burst of 56 user data requests in 141 milliseconds.
  - claim: 'Step 2 timing rows: first GetSecretValue T+0, first userData read T+3h18 (probably a test), burst T+6h10 at about 2.5 ms per call'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: '| T+6 h 10 min, over 141 ms | DescribeInstanceAttribute (56 calls) | Burst at about 2.5 ms per call |'
  - claim: The userData attribute is the instance startup script; all 57 calls that day came from one assumed-role session
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: Each call asked for the userData attribute, the startup script attached to an instance. These scripts often hold hardcoded API keys, database credentials, bootstrap secrets, SSH keys, or certificates.
  - claim: Spacing is consistent with tooling working a prepared list of instance IDs; all 57 calls that day were from one session
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: The spacing is consistent with tooling working through a prepared list of instance IDs, not a person at a console. All 57 calls that day came from the same assumed-role session.
  - claim: 'Step 3 (Oct 1): revalidation across accounts, more secrets from app-role, then nonprod-role pulls secrets from a non-production environment'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: '| Oct 1, T+4 h 10 min | GetSecretValue | nonprod-role | Secrets from a non-production environment |'
  - claim: Non-production access is to be treated as production access until shown otherwise
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: Non-production environments often have weaker controls and sometimes share secrets with production, so access to one is worth treating as access to the other until shown otherwise.
  - claim: 'Step 4 (Oct 2): container-role reads an encrypted SSM parameter and issues SendCommand 29 seconds later; the audit log does not show the command or its outcome'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: On Oct 2, container-role read an encrypted SSM parameter and issued an SSM SendCommand 29 seconds later. The audit log does not show what the command was or whether it succeeded.
  - claim: Table row for the SSM step (GetParameter with decryption, container-role)
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: '| Oct 2, T+0 s | GetParameter with decryption | container-role | SSM SecureString parameter read |'
