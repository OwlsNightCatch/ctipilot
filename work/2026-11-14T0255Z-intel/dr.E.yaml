    passage: The October 2 sequence is the highest-risk activity in the data.
  - claim: 'Step 5 (Oct 16): return after 14 quiet days; revalidation incl. a user in a fourth account (named-user, Account D, GetSessionToken)'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: After 14 quiet days, the server came back and revalidated credentials, including a user in a fourth account that had not appeared before.
  - claim: Lab does not choose between access-survival check, deliberate cool-down, or operator returning from other targets
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: It could also mean a deliberate cool-down, or the operator returning after working on other targets. The data doesn't separate these.
  - claim: 'How credentials were obtained: unknown; AI-assisted label rests on tool attribution and machine-speed behavior, not on proof an LLM decided'
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: We cannot prove an LLM agent was making the decisions, and we do not know how the attacker obtained the credentials.
  - claim: Lab's basis for the AI-assisted label
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    saved_copy: work/2026-11-14T0255Z-intel/dr/elastic-cyberstrikeai.md
    passage: We call this AI-assisted on the strength of the tool attribution and the machine-speed behavior in the logs.
  - claim: Instance-role sessions used from an outside IP imply the credentials were taken from the instances (lab names SSRF or host compromise as examples)
    source_url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
