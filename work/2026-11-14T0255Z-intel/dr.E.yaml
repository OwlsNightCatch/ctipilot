  suggested_attack_ids:
  - id: T1566.004
    name: Spearphishing Voice
    behavior: outbound phone call to the employee (often a personal number, spoofed trusted number) posing as IT support
    basis: reader mapping; ReliaQuest names no ATT&CK ids
  - id: T1684.001
    name: 'Social Engineering: Impersonation'
    behavior: attacker impersonates IT support responding to a "malicious email" (new id in the pinned v20.1 dataset; T1656 is revoked)
    basis: reader mapping; ReliaQuest names no ATT&CK ids
  - id: T1528
    name: Steal Application Access Token
    behavior: user is talked into copying the Microsoft Graph access token out of the Copilot request via browser developer tools and pasting it to a paste site
    basis: reader mapping; ReliaQuest names no ATT&CK ids
  - id: T1550.001
    name: 'Use Alternate Authentication Material: Application Access Token'
    behavior: attacker replays the handed-over bearer token from its own server
    basis: reader mapping; ReliaQuest names no ATT&CK ids
  - id: T1530
    name: Data from Cloud Storage
    behavior: bulk file download through the Graph API (thousands of files in about an hour)
    basis: reader mapping; ReliaQuest names no ATT&CK ids
  - id: T1213.002
    name: 'Data from Information Repositories: Sharepoint'
    behavior: 'optional: the Graph reads target SharePoint-held files (ReliaQuest names SharePoint files as an example and an open-source SharePoint download tool in one intrusion)'
    basis: reader mapping, optional
  - id: T1119
    name: Automated Collection
    behavior: 'optional: files are downloaded automatically in bulk rather than manually (ReliaQuest: "download files in bulk automatically")'
    basis: reader mapping, optional; only if the composer wants the automation aspect
  - id: NOT-MAPPED
    name: broken-PDF email
    behavior: the PDF is deliberately invalid and crashes the viewer; it carries no payload and executes nothing, so T1566.001 is not supported; it is a pretext for the call
    basis: source states no payload
  unsupported_or_overreaching_in_findings_yaml:
  - where: 'items[6].summary and title context: "Luna Moth (Silent Ransom Group, UNC3753)"'
    issue: ReliaQuest uses only "Luna Moth" and "Silent Ransom Group". UNC3753 is Mandiant's tracker, carried by the registry and the earlier entries. Fine to keep the alias, but do not attribute it to ReliaQuest.
  - where: 'items[6].region_nexus: "global, US law firms observed"'
    issue: The primary names no country at all. "US law firms" is from the FBI/Mandiant coverage of the earlier campaign.
  - where: 'items[6].extended_notes: "a user session on a managed device that shows a Copilot browser session, developer-tools use, and a visit to a text-sharing site near an external screen-share call"'
    issue: The article lists a screen share, a Copilot session, a text-sharing-site visit and Graph file access as the combined signal; developer-tools use is not listed as a telemetry event. It appears only as something to block.
  - where: 'items[6].extended_notes: "Benign lookalike: legitimate bulk Graph downloads by backup, migration or eDiscovery apps come from known application identities and addresses, not from a user-delegated token replayed from a new address"'
    issue: Not in the article. The only discriminator it gives is an unfamiliar address plus the combination of otherwise ordinary events. This sentence is the researcher's reasoning; label it as such or remove it.
  - where: 'items[6].summary: "the only traces are the blank email, an external video-call session, a visit to a paste site and Graph file access from an unfamiliar address"'
    issue: Merges two lists. The "only evidence" sentence has three events (blank email, external video call session, Graph access from an unfamiliar address); the paste-site visit is in the separate "Detection at Source" four-event list.
  - where: 'items[6].summary: "the earlier chain (remote-assistance tool plus manual exfiltration to personal cloud storage) is already covered in the store"'
    issue: Partly. The 06-06 entry covers RMM agents and WinSCP/Rclone-style exfiltration; ReliaQuest's "built-in Windows remote-assistance tool" is not named in the store (it names no product either). Do not claim full coverage.
  - where: items[6].techniques
    issue: ReliaQuest gives no ATT&CK ids; the five ids are the researcher's mapping (all active in the pin). Fine for metadata; do not present them as ReliaQuest's.
  - where: items[6].extended_notes hardening list
    issue: 'Omits ReliaQuest''s most specific levers: disable developer tools by Group Policy on managed browsers, block Graph Explorer and the chrome://net-export / edge://net-export pages, and the pilot caveat (define every egress IP including secure web gateway ranges as a named location before strict location enforcement). Also omits the token-lifetime facts (default 60 to 90 minutes; CAE up to 28 hours) that explain why the window is short.'
  - where: 'items[6].summary: "within about a minute the attacker replays the token"'
    issue: Supported ("Within a minute"; "about a minute after the token was copied"), but it is from "the observed intrusions" without a stated count.
  - where: items[6] "on its own customer telemetry" in the summary header
    issue: ReliaQuest says the findings are external threat intelligence about third parties and does not say the victims are its customers. "Its own telemetry" is safe; "customer telemetry" is an inference.
  - where: items[6].evidence
    issue: All three quotes verified as substrings of the saved copy (curly apostrophes included). No issue.
