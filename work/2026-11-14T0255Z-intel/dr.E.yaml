  suggested_attack_ids:
  - id: T1078.004
    name: 'Valid Accounts: Cloud Accounts'
    behavior: IAM-user and instance-role credentials used from an external address (initial access and persistence of access across four accounts)
    basis: Elastic maps it itself
  - id: T1087.004
    name: 'Account Discovery: Cloud Account'
    behavior: GetCallerIdentity across eight identities in four accounts to learn which credentials work
    basis: Elastic maps it itself
  - id: T1552.005
    name: 'Unsecured Credentials: Cloud Instance Metadata API'
    behavior: EC2 DescribeInstanceAttribute reads of the userData startup script (58 calls)
    basis: 'Elastic maps it itself; caution: the calls are EC2 API reads of the userData attribute, not requests to the instance metadata endpoint. The pinned definition reads "access the Cloud Instance Metadata API to collect credentials and other sensitive data". Keep as the lab''s mapping; no better active id is stated by the source'
  - id: T1555.006
    name: 'Credentials from Password Stores: Cloud Secrets Management Stores'
    behavior: Secrets Manager GetSecretValue (app-role, nonprod-role) and SSM GetParameter with decryption (container-role)
    basis: Elastic maps it itself
  - id: T1651
    name: Cloud Administration Command
    behavior: SSM SendCommand 29 seconds after the decrypting GetParameter
    basis: Elastic maps it itself; the command content is unknown, so only the cloud-administration-command behavior is supported
  - id: T1580
    name: Cloud Infrastructure Discovery
    behavior: 'optional: the userData burst enumerates instances from a prepared list of instance IDs'
    basis: NOT in Elastic's table; reader mapping from the stated behavior (burst over many instances). Offer as optional, lower confidence
  unsupported_or_overreaching_in_findings_yaml:
  - where: 'items[2].title and the assignment text: "six detections ... fired low"'
    issue: 'Elastic: four of the six rules are Medium and two Low; every alert was "medium or low". Use "medium or low".'
  - where: 'items[2].new_entities[0].summary and items[2].summary: Elastic cites a count of 21 addresses "all aimed at Fortinet edge devices"; summary of the new tool entity: "Team Cymru tracks its usage (...; Elastic cites a count of 21 addresses aimed at Fortinet edge devices in early 2026)"'
    issue: 'The attribution to Elastic is accurate (Elastic wrote "all of them aimed at Fortinet edge devices"), but neither Team Cymru nor THN says that. Team Cymru: 21 unique IPs "running CyberStrikeAI"; FortiGate targeting is shown by NetFlow for the one Amazon-published IP. Amazon''s own post does not name CyberStrikeAI. The entity summary blends Team Cymru''s count with Elastic''s gloss under a Team Cymru attribution; carry only "Team Cymru counted 21 addresses running it" and, if wanted, "Elastic describes them as aimed at Fortinet devices".'
  - where: 'items[2].extended_notes: "Triage / benign lookalike: legitimate automation (config management, backup, inventory) also reads userData and secrets in bulk, so baseline per role and compare the source address with the instance or NAT"'
    issue: 'The article names no such lookalikes. It says each call is one "a legitimate role makes every day" and gives one discriminator: source IP not the instance or your NAT. The config-management/backup/inventory list and "baseline per role" are the researcher''s reasoning, not stated. Write it as such or drop the lookalike list.'
  - where: 'items[2].extended_notes hardening: "enforce IMDSv2"'
    issue: IMDSv2 is not mentioned. The only IMDS reference is a hunt step ("exposed web applications, SSRF, code repositories and IMDS"). Drop IMDSv2 or flag it as general guidance.
  - where: 'items[2].extended_notes: "Correlate medium and low alerts by source address over a window of weeks, not minutes"'
    issue: Elastic says the window must be "flexible" and that a short fixed window would have split the case; the longest gap it observed was 14 days. "Weeks" is an extrapolation.
  - where: 'items[2].extended_notes hardening: "rotate long-lived service-account keys"'
    issue: Not stated as a recommendation. Elastic says to rotate credentials of every identity that touched the indicator IP and notes service accounts are "rotated rarely and watched less closely". Mild paraphrase.
  - where: items[2] entity_keys
    issue: product:amazon-web-services-iam exists in the registry and is in affected_products ("Amazon Web Services IAM") but is not listed in entity_keys. tool:cyberstrikeai is a genuine new key (the registry has none).
  - where: items[2].summary "GetSessionToken, GetSecretValue" ordering
    issue: 'No error: GetSessionToken occurs on Sep 30 phase 1, GetSecretValue on phase 2. Noted only so the composer keeps the phase order.'
  - where: items[2] discovery_trace
    issue: No error found. The Team Cymru post is dated 2026-03-02 (the findings say the same).
