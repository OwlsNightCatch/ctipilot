  independent_confirmation: 'none found. Four WebSearch queries (Luna Moth / Silent Ransom Group with Copilot, access token, Microsoft Graph, "token handoff", developer tools, paste site, "re-targeting", ReliaQuest by name) returned no other vendor, authority or press report of the Copilot token handoff or of the re-targeting of non-payers, and no press pickup of the ReliaQuest post. The FBI FLASH CSA 260526 text I could extract (partial) shows no token wording; Check Point (2026-10-09) and Mandiant/GTIG (store entry 2026-06-06) predate the technique. Verification stays single-source (vendor report, vendor sells the platform it recommends). ReliaQuest''s own first-hand basis is "recent intrusions" it does not size: the article gives no victim count.'
  step_order_with_telemetry:
  - step: 0
    what: Blank-subject email from a free mailbox with a deliberately invalid PDF (named like a business report) that crashes the viewer each time
    telemetry_class: mail flow / mail gateway logs (the article lists "a blank email" among the ordinary-looking events; it names no mail-log product)
    note: a pretext, not a payload; no execution
  - step: 1
    what: Soon after, a call, often to a personal number outside corporate call controls, from a spoofed number the victim trusts, posing as IT support answering the "malicious email"; user is moved onto a video call and shares the screen
    telemetry_class: 'telephony (often none: personal number outside corporate call controls); video-call platform logs (external session, screen share)'
    note: ReliaQuest says this reverses earlier campaigns where the victim called the attacker
  - step: 2
    what: User opens Microsoft 365 Copilot in the browser on the managed, compliant laptop
    telemetry_class: web proxy or DNS logs; Microsoft 365 audit logs (the article names a "Copilot session" as an ordinary event but gives no log field)
    note: ordinary event
  - step: 3
    what: User opens the browser developer tools, finds the Copilot request to Microsoft Graph and copies the access token it carries
    telemetry_class: none stated. ReliaQuest recommends blocking developer tools by Group Policy and blocking Graph Explorer and the browser net-export pages; it does not describe developer-tools use as a detectable event
    note: the findings YAML lists developer-tools use as telemetry; the primary does not
  - step: 4
    what: User pastes the token into a public text-sharing site, where the attacker retrieves it
    telemetry_class: web proxy or DNS logs (visit to a text-sharing site)
    note: ReliaQuest recommends blocking the paste sites; no destination detail in this note by design
  - step: 5
    what: Within about a minute the attacker replays the token from its own server and downloads thousands of files in about an hour through the Graph API (an open-source SharePoint download tool seen in one intrusion)
    telemetry_class: Microsoft 365 audit logs (Graph / file access from an unfamiliar address, no matching interactive sign-in for that address)
    note: no sign-in event is generated for the attacker address
  - step: 6
    what: Extortion email after data theft ("has lost confidential data of their clients"-style subject)
    telemetry_class: inbound mail flow
    note: ReliaQuest lists the subject pattern among its observables; text of the subject omitted
  note_on_step_telemetry: The article lists the three log classes together ("video-call platform logs, web proxy or DNS logs, and Microsoft 365 audit logs each record part of the handoff") and four ordinary events; it does NOT map each step to a log class. The per-step assignment above is the reader's reading of which listed class could hold the event, with "none stated" where the article gives nothing.
  new_versus_prior_tradecraft_per_reliaquest:
    new:
    - 'Token handoff: the user extracts a Microsoft Graph access token out of Microsoft 365 Copilot via browser developer tools and pastes it to a paste site; the attacker replays it from its own server (ReliaQuest: "almost certainly a new tactic for the group"; its table: "No token-handoff technique described in public reporting")'
    - Exfiltration moves from endpoint-mediated transfers (manual downloads, file-transfer tools, personal cloud storage, emails to attacker accounts) to bulk Graph downloads from attacker infrastructure
    - 'Lure reversal: a broken-PDF email followed by an outbound call, replacing the fake invoice/subscription email that made the victim call the attacker'
    - 'A single video call replaces multiple remote-management tools and the built-in remote-assistance tool (progression: by late August video call plus the built-in remote-assistance tool, by October video call alone)'
    - Re-targeting of law firms extorted in May and August that appear on the leak site, in October and early November (several firms, same infrastructure per ReliaQuest)
    unchanged: phone-based social engineering posing as IT support; data theft and extortion without encryption; law-firm focus (since at least mid-2023 per ReliaQuest)
  victim_sector_country: 'Sector: law firms (several, unsized). Country: none named in the article; the grep of the saved copy for US, United States, country names and region words returns nothing. "US law firms" in the findings YAML region_nexus is not supported by this primary; it comes from the FBI/Mandiant coverage of the earlier campaign. No victim named.'
  benign_discriminators_stated_by_article: None. The article says only that the four events (screen share, Copilot session, visit to a text-sharing site, Graph file access from an unfamiliar address) are "each ordinary on their own" and indicative together. No statement about legitimate bulk Graph downloads, backup, migration or eDiscovery applications.
