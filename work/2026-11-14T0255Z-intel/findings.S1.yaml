- title: 'Red Hat Quay: an anonymous client can install its own registry signing key (CVE-2026-123710, CVSS 9.8) and read or overwrite every private image; a second critical flaw steals other tenants'' robot tokens (CVE-2026-110697, 9.9); fixed builds 3.9.28 to 3.18.3, exploitation unknown'
