  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13178 (ncsc-csh recent 25, then ncsc-csh post 13178, created 2026-11-13T11:29Z; BSI WID-SEC-2026-4565 of the same day lists Red Hat Quay too) -> primary: Red Hat CNA pages https://access.redhat.com/security/cve/cve-2026-123710 and https://access.redhat.com/security/cve/cve-2026-110697 -> RHSA-2026:99019 https://access.redhat.com/errata/RHSA-2026:99019 -> corroborating: https://thehackernews.com/2026/11/critical-red-hat-quay-flaw-lets.html and https://www.securityweek.com/critical-red-hat-quay-vulnerability-could-expose-private-container-images/. The 2026-11-12 fire borderline-dropped CVE-2026-123710 (scores preliminary, no fixed build named, no exploitation); reopened because NCSC.ch issued its own advisory on 2026-11-13, Red Hat''s CVE-2026-110697 page now names the eight fixed builds, a third Quay CVE appeared, and the fix commits have been public since 2026-11-11.'
  summary: 'Red Hat''s CNA record (2026-11-11) says an unauthenticated client of Red Hat Quay can obtain an anonymous registry token with an audience it chooses, present it to the service-key rotation endpoint and install its own approved signing key with no expiry (CVE-2026-123710, CVSS 3.1 9.8, AV:N/PR:N); registry tokens signed with that key are then accepted for any repository, giving read and write access to private images and the ability to replace tags. Red Hat says deployments where the /keys endpoint is reachable by untrusted clients are affected; The Hacker News adds that anonymous access is on by default, that with it off any valid account still suffices, that Red Hat lists every Quay 3 and Quay 5 version as affected, that the planted key survives restarts and can delete the instance''s own keys (so normal pushes and pulls start failing) and that the logic dates to Quay''s first public commit. The second flaw, CVE-2026-110697 (9.9, AV:N/PR:L/S:C), is in the robot-account listing: the SQL LIKE pattern is built from the namespace name without escaping wildcards, so a namespace with an underscore can match another tenant''s namespace and return its robot accounts with decrypted tokens, which Red Hat says can be used to read, push or overwrite that tenant''s images and, where Quay is the integrated OpenShift registry, to inject images into CI/CD. A third record, CVE-2026-128824 (reflected XSS in v1 registry error responses, 5.4, preliminary), appeared on 2026-11-13. Red Hat''s page for CVE-2026-110697 names the fixed builds 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3; its page for CVE-2026-123710 names none (SecurityWeek and The Hacker News, 2026-11-12), while the Quay 3.18.3 and 3.17.7 errata (RHSA-2026:99019 and RHSA-2026:99026, both rated Critical, issued 2026-11-11) list the Bugzilla report for CVE-2026-123710 (BZ 2568072, whose title names that CVE). NCSC Switzerland''s advisory of 2026-11-13 lists the exploitation status as unknown; no source read reports exploitation or a public exploit, and SecurityWeek notes the fix commits were merged into the project''s GitHub repository on 2026-11-11 (assessment: the diff is public, so a reproduction is plausible).'
