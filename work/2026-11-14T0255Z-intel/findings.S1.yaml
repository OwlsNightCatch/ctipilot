recipe_notes:
- 'fortinet-psirt: `feed https://filestore.fortinet.com/fortiguard/rss/ir.xml 120` returns every advisory of the cycle; each summary carries ''CVSSv3 Score: <n>'' and, when revised, a ''Revised on <date>'' line, so one read both enumerates the 9.0+ rows and flags revisions; the PSIRT page timeline (extract) says what changed.'
- 'msrc-update-guide: SUG OData works through `url --direct` with an encoded $filter; a revised-CVE sweep pages at $top=300 and is dominated by third-party rows (Linux 1,307, Chromium 72, Mozilla 45 of 1,500), so add `and issuingCna eq ''Microsoft''`; Patch Tuesday completeness is `releaseDate ge/lt <day>` plus `issuingCna eq ''Microsoft''`, paged 4 times (1,093 rows), and latestSoftwareRelease holds the exploitability assessment.'
- 'cisco-psirt: `feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml 30` reads; the advisory page through extract carries the revision table, which showed the BroadWorks v1.1 and v1.2 exploitation-language flip.'
- 'ncsc-ch-security-hub: `ncsc-csh recent N` posts carry no date in the listing; `ncsc-csh post <id>` returns `created` and a structured advisory with CVSS rows.'
- 'synology-security-advisories: the listing page read with `url` carries the whole advisory table with Last Updated times in UTC+8; the per-advisory page for SA-26:19 resolved at https://www.synology.com/en-global/support/security/Synology_SA_26_19 (pattern found by trying, not from a listing href).'
- 'support.checkpoint.com: extract returns only the HTML <title> (Next.js application), which for sk articles carries the CVE id and a one-line description; no score or fix table.'
- 'api.github.com: `url --direct https://api.github.com/repos/<org>/<repo>/security-advisories` shows whether a GHSA has a cve_id (used for Plone); `.../search/repositories?q=<CVE>` finds public PoC repositories and `.../repos/<owner>/<repo>/readme` reads the README (base64).'
- forums.unrealircd.org is 403 on every transport; oss-security (seclists.org/oss-sec/<year>/q4/<n>) and www.unrealircd.org carry the same advisory text.
