  - quote: 'Update to the fixed Red Hat Quay release for your version: 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7, or 3.18.3.'
    attribution: Red Hat
    source_url: https://access.redhat.com/security/cve/cve-2026-110697
  - quote: Successful exploitation allows network attackers with anonymous or low-privileged access to read, overwrite, or poison private container images and steal registry credentials, compromising the software supply chain.
    attribution: NCSC Switzerland
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13178
  - quote: When it is off, anyone with a valid account can still exploit the flaw, Red Hat said yesterday.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/11/critical-red-hat-quay-flaw-lets.html
  - quote: Neither the advisory nor the Bugzilla report identifies a fixed version.
    attribution: SecurityWeek
    source_url: https://www.securityweek.com/critical-red-hat-quay-vulnerability-could-expose-private-container-images/
  extended_notes: |-
    Suggested priority: high (unauthenticated 9.8 on an internet- or intranet-reachable registry whose compromise poisons every image pulled downstream; NCSC.ch advisory; fix commits public; exploitation unknown). Suggested Admiralty: A2.
    Exposure: Quay standalone, Quay Operator on OpenShift and the mirror registry for Red Hat OpenShift, where /keys is reachable by untrusted clients; The Hacker News relays Red Hat that internal registries count too. Check the running Quay version against the fixed builds above.
    Detection: Quay audit records of service_key_rotate and service_key_delete events with a null expiration_date (Red Hat); reverse-proxy or load-balancer access logs for /keys requests from anything other than Quay's own components and for anonymous token requests followed by key-rotation calls; registry pull and push logs against the expected robot-account baseline; newly created namespaces whose names contain an underscore (the CVE-2026-110697 precondition). Post-patch compromise check: a planted signing key is not removed by changing passwords or regenerating robot tokens (SecurityWeek relaying Red Hat), and deleting a rogue key is not durable before the fixed build is in, so after upgrading list the approved service keys, remove unrecognised ones, rotate robot tokens for any namespace that collides with an underscore-containing one, and (inference) compare image digests pushed since the earliest exposure with the build pipeline's records.
    Defender takeaway: upgrade to the fixed build of your branch, restrict /keys at the proxy to Quay's own components until then, and audit the approved key set afterwards.
    Triage: not offered; no source gives a benign-lookalike discriminator beyond Red Hat's null-expiration filter.
