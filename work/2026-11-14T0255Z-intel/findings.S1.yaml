  discovery_trace: 'first seen at: msrc-update-guide, URL https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability (SUG OData read with releaseDate 2026-11-10, issuingCna Microsoft, 1,093 rows paged 300 at a time; the revised-CVE sweep with latestRevisionDate >= 2026-11-11T12:00Z returned no exploited or disclosed flag changes) -> msrc cve CVE-2026-119952 and CVE-2026-113862 (the per-CVE records behind the update-guide pages above).'
  summary: 'Reading the whole November 2026 Microsoft CNA release from the Security Update Guide (1,093 rows), one CVE is marked exploited (the Outlook zero-day the store already covers) and none is marked publicly disclosed; 42 carry Microsoft''s ''Exploitation More Likely'' assessment, which the existing entry (selected on CVSS 9.8) does not mention. The network-reachable ones are CVE-2026-119952 (Windows Schannel remote code execution, 8.1, AV:N/AC:H/PR:N, ''an observable timing discrepancy ... allows an unauthorized attacker to execute code over a network''), CVE-2026-113862 (Windows NAT remote code execution, 8.1, use after free, AC:H/PR:N), CVE-2026-96077 (Windows TCP/IP denial of service, 7.5, PR:N) and two authenticated 8.8 rows, Exchange Server CVE-2026-118207 and Active Directory Domain Services CVE-2026-118146; the rest are local privilege escalations in Windows Installer, kernel, graphics, print spooler and similar components and three Visual Studio Code rows. All 9.0-or-higher rows were checked: the pre-authentication network ones are either in the entry (Kerberos, Windows Search, DNS, DHCP, LDAP, iSCSI, SQL Server), cloud service rows (Azure OpenAI, Azure Managed Grafana), rows the 2026-11-13 fire already dropped as client-side or unlikely (Xbox, Media Foundation, Color Management, DirectMusic, VFP), or authenticated (SharePoint 9.9, Azure DevOps Server 9.9, Graph, Office SharePoint). The revised-CVE sweep since 2026-11-11 12:00 UTC found 20 Microsoft-CNA revisions on 2026-11-13, all informational (Office added to the updates table for ten graphics and codec rows, acknowledgement changes, ''information published'').'
