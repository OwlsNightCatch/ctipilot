- title: Git 2.56.1 fixes six flaws, one of them code execution when a malicious repository is cloned with --recurse-submodules, and GitLab ships a critical patch release (19.5.4, 19.4.6, 19.3.8) for the Git merge heap overflow CVE-2026-105437
