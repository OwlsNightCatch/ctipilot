  disposition: 'CVE-2026-114713 UnrealIRCd: returned as a borderline item with a borderline-drop recommendation (no constituency nexus, KEV and vendor-claimed exploited). CVE-2026-123039 Check Point: update-of item on 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways (cves[] status lacks cisa-kev; ENISA exploitedSince 2026-11-13).'
- topic: KEV ransomware-flag flips on covered CVEs
  disposition: none. Every covered CVE in the 14-day index reads knownRansomwareCampaignUse Unknown in the 2026-11-13 catalogue; the 18 CVE-2026 rows flagged Known are all older and not in the index; kev_window_diff.py prints no RANSOMWARE rows.
- topic: Earlier KEV rows without an entry (Cisco BroadWorks CVE-2026-20320, Openwave CVE-2026-111793, both added 2026-11-10)
  disposition: 'borderline-drop stays. New fact on BroadWorks: Cisco advisory cisco-sa-bworks-xxe v1.2 (2026-11-13) corrects v1.1 and says the flaw was added to CISA KEV and that Cisco ''does not have direct evidence of active exploitation''; unauthenticated XXE in the OCI-P provisioning service (CVSS 7.5), fixed in RI.2026.07 since 2026-08-19, carrier-platform product with no constituency step.'
- topic: Mitel MiVoice MX-ONE MISA-2026-0011 (MTLVULN-1860 unauthenticated auth bypass 9.4, LAN access)
  disposition: 'borderline-drop stays (dropped 2026-11-12): vendor date 2026-11-11, LAN-access prerequisite, CVE ids still pending, no exploitation; CERT-FR AVI-1516 relay adds no fact.'
- topic: Zoom Workplace for Windows ZSB-26023 (CVE-2026-108186, 9.6, UI:R, 7.1.0 to below 7.1.8) and ZSB-26024 (CVE-2026-108187, 8.1, below 7.1.5)
