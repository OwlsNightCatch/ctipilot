  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: This release fixes 52 security vulnerabilities and over 140 bugs reported over the last several months.
    attribution: PostgreSQL Global Development Group
    source_url: https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/
  - quote: This is the final release of PostgreSQL 14
    attribution: PostgreSQL Global Development Group
    source_url: https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/
  - quote: Type confusion in PostgreSQL allows an object creator to execute arbitrary code as the operating system user running the database, via ALTER ... SET DATA TYPE primarily.
    attribution: PostgreSQL Global Development Group
    source_url: https://www.postgresql.org/support/security/CVE-2026-6460/
  extended_notes: |-
    Suggested priority: notable (authenticated-role code-execution class across every supported branch plus an EOL branch; no exploitation reported). Suggested Admiralty: A1. The cve_table lists all 52 rows from the announcement; only the CVE-2026-6460 page was read for per-branch applicability (all of 14 to 18), so the affected column for the other rows is the announcement's general statement, not a per-CVE check.
    Exposure: any PostgreSQL 14 to 18 below the fixed minor releases; risk is concentrated where untrusted or low-privileged roles can execute SQL (shared or multi-tenant clusters, application accounts reachable through SQL injection, logical-replication subscribers, hosts that restore dumps from outside parties). Check with SELECT version() or the package version; PostgreSQL 14 has no further fix and needs a major upgrade.
    Detection (derived from the flaw class, not stated by the project): PostgreSQL logs with DDL statement logging for ALTER ... SET DATA TYPE, CREATE EXTENSION and function creation in PL/Perl or PL/Tcl by non-administrative roles; process-creation telemetry for shells or download tools whose parent is a postgres backend; files written by the postgres OS user outside the data directory; for pg_restore and pg_dump, treat archives from outside parties as untrusted input.
    Defender takeaway: apply the minor release on every cluster, schedule the PostgreSQL 14 migration, run the listed reindex steps, and until patched keep non-administrative roles away from untrusted SQL.
    Triage: not offered.
  relation_suggestions: []
