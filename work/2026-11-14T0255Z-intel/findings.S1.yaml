  extended_notes: |-
    Suggested record: type update (adds Agent2Shell, N-able's 2026-11-12 precautions and the Hotfix-2 observation); keep the entry at high. The Hacker News relays N-able's statements; N-able's own page could not be read, so attribute them as 'N-able, as relayed by The Hacker News'.
    Detection addition: on managed Windows endpoints, SYSTEM-context command execution launched by the N-central agent services outside change windows (Agent2Shell, derived from the researcher's description); on servers, an agent or probe version inventory against the HF1-and-later requirement.
    Defender takeaway: Legacy API off and unreachable, Agents and Probes upgraded as N-able instructs, and treat any server that exposed Legacy API as potentially compromised (Huntback).
