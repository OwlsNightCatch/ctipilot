  discovery_trace: 'first seen at: anssi-fr, URL https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1531/ (cert-fr avis-recent 60, item of 2026-11-13; NCSC-NL NCSC-2026-0492 of 2026-11-12 from ncsc-nl recent 40 lists the same release) -> primary: https://nodejs.org/en/blog/vulnerability/november-2026-security-releases. No earlier fire or store entry covers this release (the Node2Shell Brotli entries concern the October release). Recency note: the vendor release is dated 2026-11-11, two days before this window; first in-window authority source is CERT-FR of 2026-11-13.'
  summary: 'The Node.js project''s security releases of 2026-11-11 for the 26.x, 24.x and 22.x lines fix 16 issues, 7 rated high, 6 medium and 3 low, and the project says the highest severity is high. The highs are unauthenticated and network-reachable: an HTTP/2 teardown assertion that aborts a default http2 server whose handler responds before the request body ends (CVE-2026-123863, 24.x and 26.x); an HTTPS flaw in which a zero-length TLS write re-enters the HTTP parser and the server copies freed or unrelated heap into a request body, which can include other connections'' data and TLS private keys but needs a handler that flushes headers before the body ends and a route that echoes or stores the body (CVE-2026-123864, 22.x to 26.x; plain http is not affected); HTTP/2 session memory and descriptor leaks (CVE-2026-123865, an incomplete fix of CVE-2026-48937) and a stream-teardown use-after-free that sends freed response memory to the peer (CVE-2026-123866); an uncaught exception that terminates TLS servers using SNICallback, OCSPRequest, newSession, resumeSession or addContext (CVE-2026-126051); a TLS 1.2 renegotiation that changes the servername to carry a client certificate authenticated for one host to a host with a stricter policy (CVE-2026-123872); and an HTTP/2 use-after-free when files are served with respondWithFile() or respondWithFD() (CVE-2026-123874). Medium rows include a second mutual-TLS bypass when a per-host CA-only SNI context fails open (CVE-2026-123867), an https.Agent certificate-validation bypass through cross-policy session reuse (CVE-2026-123877) and an HTTP/2 altsvc heap overflow (CVE-2026-123828). The project credits three of the highs to a researcher working with Claude and Anthropic Research. CERT-FR lists the fixed versions 26.13.1, 24.22.3 and 22.23.5. No source reports exploitation or a public exploit.'
