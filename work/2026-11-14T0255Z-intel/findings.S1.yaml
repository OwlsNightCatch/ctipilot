  discovery_trace: 'first seen at: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4571 (bsi-rss item of 2026-11-13T13:22Z, drilled with bsi-csaf, whose references name the release) -> primary: https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/ -> per-CVE page https://www.postgresql.org/support/security/CVE-2026-6460/; CERT-FR listing (cert-fr avis-recent 60) shows CERTFR-2026-AVI-1530 of 2026-11-13. Not covered by any earlier fire or store entry. Recency note: the vendor release is dated 2026-11-12, about 12 hours before this window opens; the first in-window authority sources are BSI and CERT-FR of 2026-11-13.'
  summary: 'The PostgreSQL project''s release of 2026-11-12 fixes 52 security vulnerabilities and more than 140 bugs in 18.7, 17.12, 16.16, 15.20 and 14.25, and ships the second release candidate of PostgreSQL 19; it is the final release of PostgreSQL 14, which is now end of life. The project''s own CVSS 3.1 scores put 32 of the 52 at 8.8, three more at 8.0 to 8.1, three at 7.2 and the rest below 7; 43 need a low-privileged database role (PR:L) and three an owner or administrator role, so the dominant class is a role that may run SQL reaching code execution as the operating-system user running the database. The flaw types named in the announcement are type confusion and use-after-free in the core (CVE-2026-6460, CVE-2026-18447, the ALTER ... SET DATA TYPE and composite-type routes), in PL/Perl, PL/Tcl and PL/pgSQL, in dblink and foreign-data-wrapper batch inserts, and integer wraparound or heap overflows in text search (tsvector_delete, ts_rank_cd); SQL injection through object names in pg_dump, reindexdb and extension scripts; and a logical-replication write to subscriber system catalogs. Five rows need no database role: pg_restore executing code from a crafted non-plain archive (CVE-2026-116314, 8.8), pg_dump''s tar restore.sql letting psql meta-commands run (CVE-2026-116330, 8.8) and logical replication writing subscriber catalogs (CVE-2026-120145, 8.8), all scored UI:R, plus a pre-authentication cancel request that leaks a spinlock (CVE-2026-116322, 5.3) and a pg_basebackup format string (CVE-2026-16240, 3.7). The announcement states no exploitation and no public exploit; BSI rates the release hoch and CERT-FR relayed it on 2026-11-13. Post-update steps the project lists include reindexing GIN indexes suspected of corruption, pg_trgm GiST indexes and B-tree indexes on unbounded bpchar columns, and dropping NOT NULL NO INHERIT constraints on partitioned tables.'
