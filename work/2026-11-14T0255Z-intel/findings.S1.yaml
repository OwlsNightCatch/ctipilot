  evidence:
  - quote: A client certificate authentication bypass in Node.js TLS lets a client change the servername during TLS 1.2 renegotiation to reach endpoints it was not authorized for.
    attribution: Node.js project
    source_url: https://nodejs.org/en/blog/vulnerability/november-2026-security-releases
  - quote: A re-entrancy flaw in Node.js HTTPS lets an unauthenticated client read memory
    attribution: Node.js project
    source_url: https://nodejs.org/en/blog/vulnerability/november-2026-security-releases
  - quote: The highest severity issue fixed in this release is HIGH.
    attribution: Node.js project
    source_url: https://nodejs.org/en/blog/vulnerability/november-2026-security-releases
  - quote: Node.js versions 24.x antérieures à 24.22.3
    attribution: ANSSI / CERT-FR
    source_url: https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1531/
  extended_notes: |-
    Suggested priority: routine to notable. Suggested Admiralty: A2.
    Exposure: Node.js 22.x, 24.x and 26.x servers that terminate HTTP/2 or HTTPS themselves (not behind a proxy that speaks HTTP/1.1 to Node), especially with per-host client-certificate policies via addContext or SNI contexts; check node --version against 22.23.5, 24.22.3 and 26.13.1.
    Detection (from the advisory's mechanisms): process aborts with the assertion text from the HTTP/2 teardown flaw and uncaught-exception exits in TLS servers as availability telemetry; HTTP/2 sockets accumulating in CLOSE_WAIT and steady memory or descriptor growth; for the HTTPS heap read, treat a server that matched the handler pattern while unpatched as having possibly exposed its TLS private key (assessment, the advisory says the leak can include TLS private keys), so rotate the key after patching.
    Defender takeaway: update the runtime on internet-facing Node services and containers, rebuild images that bundle Node, and rotate TLS keys on servers that matched the HTTPS pattern.
    Triage: not offered.
