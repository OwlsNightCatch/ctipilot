  discovery_trace: 'first seen at: gitlab-security, URL https://about.gitlab.com/security-releases.xml (feed read with `feed ... 6`; the 2026-11-10 item) -> primary: https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-4-released/ -> pivot: https://github.blog/open-source/git/git-security-vulnerabilities-announced-7/ -> https://www.openwall.com/lists/oss-security/2026/11/11/10 -> corroborating: https://thehackernews.com/2026/11/git-patches-flaw-that-lets-malicious.html. The 2026-11-12 fire borderline-dropped ''git v2.56.1'' in a batch of routine monthly releases without the GitLab critical-release context; reopened here. Admitted through the gitlab-security record''s rotational lookback (145 h): the GitLab release of 2026-11-10 is older than the 26 h window.'
  summary: 'The Git project released 2.56.1 on 2026-11-10 with backports 2.55.1, 2.54.1, 2.53.1, 2.52.1, 2.51.3 and 2.50.2 for six vulnerabilities; the maintainers say all versions back to 2.27.0 are affected. CVE-2026-111760 is an integer truncation in index path handling: a crafted tree can make a very long path pass validation and be written as .git, replacing a freshly cloned submodule''s .git file with a symlink to a directory holding attacker hooks or configuration, which then run during a recursive clone; the trigger is an attacker-controlled repository cloned with --recurse-submodules, and the maintainers note such a repository fails the LARGE_PATHNAME and TREE_NOT_SORTED fsck checks so it cannot easily be pushed to the major forges, while an innocuous-looking .gitmodules pointing at it suffices. The other five are a protocol-v2 unborn-HEAD path traversal (CVE-2026-113408), stack corruption when a merged tag carries more than two GPG signatures (CVE-2026-114467), an out-of-bounds read applying a binary patch (CVE-2026-114469), unsafe fast-import features accepting file reads and writes from an untrusted stream (CVE-2026-114466) and CVE-2026-105437, a heap overflow when Git computes the size of a very large merge result. GitLab, which assigned CVE-2026-105437 (CNA CVSS 3.1 7.5, AV:N/AC:H/PR:N/UI:R), shipped an ad-hoc critical patch release the same day for self-managed instances, all versions from 16.2 before 19.3.8, 19.4.6 and 19.5.4, and lists the issue as Critical in its own table; GitLab.com and Dedicated are already patched, self-compiled installs must rebuild Git, and GitLab says code-hosting servers are most likely reached through git merge-tree, which any user who can push branches and open a merge request can trigger through a conflict-marker-size attribute in a committed .gitattributes (The Hacker News relaying GitLab), with conflict-marker-size=7 in each repository''s info/attributes as the interim workaround. GitHub Enterprise Server fixes are in 3.19.15, 3.20.11, 3.21.9 and 3.22.4; as of 2026-11-10 19:09 UTC Git for Windows had no release based on 2.56.1 (The Hacker News). No source reports exploitation or a public exploit.'
  region_nexus: global; no Swiss-specific statement; self-managed GitLab is common in public-administration software estates (the pipeline source record says so)
  primary_sector_nexus: indirect
