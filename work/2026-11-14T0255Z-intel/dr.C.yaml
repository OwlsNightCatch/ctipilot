  - claim: CVE-2026-123710 mechanism (Red Hat CNA description)
    source_url: https://access.redhat.com/security/cve/cve-2026-123710
    saved_copy: rh-cve-2026-123710.txt
    quote: An unauthenticated client can obtain an anonymous registry token with an audience it controls, present that token to the service key rotation endpoint, and install its own approved signing key with no expiry.
    grep_F_verified: true
  - claim: CVE-2026-123710 root cause (Red Hat statement)
    source_url: https://access.redhat.com/security/cve/cve-2026-123710
    saved_copy: rh-cve-2026-123710.txt
    quote: Key rotation authenticates the caller only by verifying that the JWT is signed by an already approved service key with the expected audience and issuer, without checking that the token is a rotation credential. An anonymous token minted by /v2/auth satisfies that check.
    grep_F_verified: true
  - claim: CVE-2026-123710 affected deployments condition
    source_url: https://access.redhat.com/security/cve/cve-2026-123710
    saved_copy: rh-cve-2026-123710.txt
    quote: Deployments where /keys is reachable by untrusted clients are affected.
    grep_F_verified: true
  - claim: CVE-2026-123710 Red Hat mitigation incl. audit-log hunt hook and durability caveat
    source_url: https://access.redhat.com/hydra/rest/securitydata/cve/CVE-2026-123710.json
    saved_copy: rh-api-CVE-2026-123710.json
    quote: Restrict access to the /keys endpoint at the proxy or load balancer so only trusted internal components can reach it. Review audit logs for service_key_rotate and service_key_delete events with a null expiration_date, and remove any unrecognised approved service keys. Deleting a rogue key is not durable until a fixed build is deployed, because the anonymous request can install a new key.
    grep_F_verified: true
