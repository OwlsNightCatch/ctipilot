items:
- item: 1
  entry_kind: NEW vulnerability entry
  subject: 'Red Hat Quay: CVE-2026-123710 (anonymous signing-key takeover), CVE-2026-110697 (cross-tenant robot-token theft), CVE-2026-128824 (reflected XSS)'
  corrections_to_returned_findings:
  - 'CORRECTION 1 (fixed builds apply to BOTH critical CVEs, and are named in structured Red Hat data): S1 and S2 say the CVE-2026-123710 page names no fixed build. As of 2026-11-13T20:50Z the CNA record (cveawg dateUpdated 2026-11-13T20:50:57Z), the Red Hat Security Data API, the CSAF VEX (revision 3, 2026-11-13T20:50:48Z) and the raw HTML of all eight errata name the same eight fixes for CVE-2026-123710 as for CVE-2026-110697: 3.9.28 (RHSA-2026:99021), 3.10.28 (99025), 3.12.24 (99027), 3.14.10 (99024), 3.15.9 (99023), 3.16.7 (99022), 3.17.7 (99026), 3.18.3 (99019). The two press statements the findings relayed (''no fixed version identified'' SecurityWeek 11-12; ''none of the eight advisories list CVE-2026-110697'' THN 11-12) were true or plausible at their time and are stale or wrong now; the errata pages carry ''Updated: 2026-11-12''. Keep both as dated press statements, do not carry them as current.'
  - 'CORRECTION 2 (public PoC exists for CVE-2026-110697): S1 says no source reports a public exploit. A third-party GitHub repository, googlesky/CVE-2026-110697 (created 2026-11-13T05:55Z), publishes a PoC and containerised differential lab whose README claims captured runs: theft of another tenant''s decrypted robot tokens and overwrite of that tenant''s private image tag on a vulnerable upstream Quay build, and a negative control on the fixed commit. These are the repository author''s claims; no authority has referenced the repo. For CVE-2026-123710 no PoC repository was found (GitHub repository search by CVE id returned none; four further keyword queries (quay keyserver service key; quay signing key takeover; quay CVE poc; bare id) returned nothing relevant), but Red Hat''s own public Bugzilla bug 2568072 describes the full chain (endpoint, HTTP method, parameter, side effects) in prose and the fix commit has been public since 2026-11-11.'
  - 'CORRECTION 3 (OpenShift mirror registry has NO fixed build): the findings list ''fixed builds 3.9.28 to 3.18.3'' without noting that Red Hat''s VEX and API mark ''mirror registry for Red Hat OpenShift 2'' and ''Red Hat Quay 5'' as known_affected with remediation category none_available for both critical CVEs (and ''Fix deferred'' for CVE-2026-128824 on Quay 3 and the mirror registry). Red Hat also names the mirror registry as affected by CVE-2026-123710 (solution 7149923). Defenders of disconnected OpenShift installs that use the mirror registry have only the /keys proxy restriction and audit-log review as of 2026-11-13T20:50Z.'
  - 'CORRECTION 4 (Quay Operator): per the VEX, the Quay Operator, bridge operator, container-security operator, builder and Clair images are flagged vulnerable_code_not_present (198 known_not_affected product ids); the fixed products are the quay-rhel8 / quay-rhel9 registry images of each branch. The fix is therefore the registry image shipped in the branch errata (which also carry operator bundle images).'
  - 'OBSERVATION: exploitation is unreported by every source read: NCSC.ch ''UNKNOWN''; CISA-ADP SSVC ''Exploitation: none'' on both critical CVEs (2026-11-13T14:17:57Z and 2026-11-12T16:00:41Z); neither CVE in the CISA KEV catalogue (version 2026.11.13) nor on the ENISA EUVD exploited list; BSI WID-SEC-2026-4565 (rated hoch, 2026-11-12T23:00Z) makes no exploitation statement. SSVC also marks CVE-2026-123710 ''Automatable: yes'' and CVE-2026-110697 ''Automatable: no''.'
  - 'OBSERVATION: THN''s ''Red Hat lists every version of Quay 3 and Quay 5 as affected'' is accurate only in the sense that the CNA ranges cover all Quay 3 below the fixed builds and Quay 5 has no fix; the CNA affected table skips minors 3.11 and 3.13 (neither listed affected nor fixed; absence is not evidence they are unaffected).'
  exact_state:
    CVE-2026-123710:
      cna: Red Hat (CNA); CNA record published 2026-11-11T15:02:31Z, updated 2026-11-13T20:50:57Z
      cvss_3_1: 9.8 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (Red Hat and cve.org identical; API status 'verified'); no CVSS 4.0 vector in the CNA record
      cwe: CWE-1287 Improper Validation of Specified Type of Input
      red_hat_severity: Critical
      auth: 'pre-auth (PR:N). The anonymous token comes from /v2/auth when FEATURE_ANONYMOUS_ACCESS is on (default True per Quay 3.14 configuration reference); with it off any valid Quay account can obtain a token with a client-chosen audience and still exploit (Red Hat solution 7149923). Network reach to the /keys key-server endpoint is the real precondition (Red Hat: ''Deployments where /keys is reachable by untrusted clients are affected'').'
      endpoints: 'token minting: /v2/auth (audience taken from the client-supplied ''service'' parameter); key install: PUT /keys/services/quay/keys/<kid> (Bugzilla 2568072); mitigation names ''/keys'' at proxy or load balancer'
      affected: 'Project Quay (CNA semver ranges): 0 to <3.9.28; 3.10.0 to <3.10.28; 3.12.0 to <3.12.24; 3.14.0 to <3.14.10; 3.15.0 to <3.15.9; 3.16.0 to <3.16.7; 3.17.0 to <3.17.7; 3.18.0 to <3.18.3. Red Hat package_state: Red Hat Quay 5 and mirror registry for Red Hat OpenShift 2 = Affected (no fix). Quay.io SaaS already fixed. Environments Red Hat names: standalone (Podman or Docker), Quay Operator on OpenShift, mirror registry for Red Hat OpenShift.'
      fixed:
        '3.9': 3.9.28 (RHSA-2026:99021)
        '3.10': 3.10.28 (RHSA-2026:99025)
        '3.12': 3.12.24 (RHSA-2026:99027)
        '3.14': 3.14.10 (RHSA-2026:99024)
        '3.15': 3.15.9 (RHSA-2026:99023)
        '3.16': 3.16.7 (RHSA-2026:99022)
        '3.17': 3.17.7 (RHSA-2026:99026)
        '3.18': 3.18.3 (RHSA-2026:99019)
        3.11, 3.13: not listed in CNA ranges, VEX or API (no statement)
        Quay 5: no fix (known_affected)
        mirror registry for Red Hat OpenShift 2: no fix (known_affected)
      mitigations: restrict /keys at proxy/load balancer to trusted internal components; review audit logs for service_key_rotate and service_key_delete with null expiration_date; remove unrecognised approved service keys; deleting a rogue key is not durable before the fixed build; resetting passwords or regenerating robot tokens does not revoke a planted key; disabling anonymous access does not protect
      exploitation: none reported (SSVC none; not KEV; NCSC.ch unknown)
      public_poc: no repository found; technical chain described in prose in public Bugzilla 2568072; upstream fix public since 2026-11-11 (PR 8056 merged, 8057 redhat-5.0 cherry-pick)
      epss: 0.00657 (52.0th percentile, 2026-11-13)
      credit: Dave O'Connor (Red Hat)
    CVE-2026-110697:
      cvss_3_1: 9.9 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H (Red Hat = cve.org); no CVSS 4.0
      cwe: CWE-89
      auth: 'authenticated, low privilege (PR:L): any account that can create a namespace (user or organization) whose name contains an underscore that collides with a victim namespace; NCSC.ch: ''authenticated namespace creation with underscore in multi-tenant registry''. Whether open user registration is on by default was not verified (the third-party lab turns FEATURE_USER_CREATION on).'
      affected_and_fixed: same eight Project Quay ranges and the same eight fixed builds as above; Quay 5 and mirror registry for Red Hat OpenShift 2 known_affected, no fix; Quay.io already fixed
      second_order_effects: 'Red Hat solution 7149592: three vectors: list robots and tokens; deleting the underscore namespace deletes the matching namespace''s robots; renaming the underscore namespace rewrites the matching namespace''s robot prefix (user rename needs FEATURE_USER_RENAME, default false; org rename only by superusers)'
      mitigations: 'no complete workaround besides the update; interim: restrict who can create orgs/namespaces with underscores; rotate robot tokens for colliding namespaces; monitor pulls/pushes against expected robot usage (third-party lab claims rotation is only partial since a fresh collision re-steals the new token)'
      exploitation: none reported by any authority (SSVC none; not KEV)
      public_poc: 'YES, third-party: googlesky/CVE-2026-110697 (created 2026-11-13T05:55Z, lab-validated per its README; README names GET /api/v1/user/robots?token=true and GET /api/v1/organization/<orgname>/robots?token=true as the reachable listing endpoints)'
      epss: 0.00741 (55.2nd percentile, 2026-11-13)
    CVE-2026-128824:
      cvss_3_1: 5.4 MEDIUM, CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N; API status 'draft' and page says preliminary
      cwe: CWE-79
      red_hat_severity: Moderate
      public: 2026-11-13T08:13Z (CNA record 2026-11-13T09:00Z)
      mechanism: v1 registry API error handler reflects the image_id path segment in a text/html response; session-compromise potential within the Quay origin
      preconditions: user interaction plus anonymous access to a public repository, 'enabled by default'
      affected_and_fixed: 'Red Hat Quay 3 and mirror registry for Red Hat OpenShift 2: fix_state ''Fix deferred''; no mitigation offered; no fixed build'
      credit: Zachariah Mithani (AploSec); Bugzilla 2572952
      epss: 0.00224 (13.2th percentile)
      note: NCSC.ch advisory 13178 lists only the two critical CVEs; BSI WID-SEC-2026-4565 lists all three
