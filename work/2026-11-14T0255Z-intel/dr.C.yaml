transport_and_recipe_findings_for_main_agent:
- Red Hat Security Data API (python3 tools/fetch_source.py url --direct https://access.redhat.com/hydra/rest/securitydata/cve/<CVE>.json) returns the per-branch affected_release (errata + fixed image) and package_state (Affected / Fix deferred) that the JavaScript CVE page hides; the CSAF VEX at https://security.access.redhat.com/data/csaf/v2/vex/2026/<cve-lowercase>.json adds known_affected, none_available and vulnerable_code_not_present flags; both read with url --direct. The rendered CVE page (extract) carries only Description, Statement, Mitigation, CVSS and credit, so 'the page names no fixed build' was an artefact of reading the page, not of the data.
- 'RHSA errata pages: `extract` (trafilatura) silently drops the Fixes / CVEs lists on RHSA-2026:99021, 99025, 99027, 99024 and 99023 (output shows only Synopsis and image digests); `url --direct` raw HTML carries the full <div id="cves"> list. Use the raw bridge when a CVE-membership check on an errata page matters.'
- 'Check Point sk pages (support.checkpoint.com/results/sk/skNNNN): `extract` returns the raw Next.js HTML (served via direct-raw); the full article (symptoms, CVSS, affected versions, mitigation, solution, dateCreated, lastModified, severity) is in the <script id="__NEXT_DATA__"> JSON at props.pageProps.data. S1''s coverage gap ''extract returns only the page title'' is solvable this way (no reader credit).'
- 'CVE Program records via url --direct https://cveawg.mitre.org/api/cve/<CVE> carry the CNA affected ranges and the CISA-ADP SSVC block (Exploitation / Automatable / Technical Impact with timestamp): cheap exploitation-status check for any CVE.'
- 'Ivanti hub advisory pages (hub.ivanti.com/s/article/..., and forums.ivanti.com which 301s there) are a Salesforce Lightning shell on every transport: extract and url --direct return ~1.06 MB of shell with no CVE text, WebFetch twice returned the empty ''Loading'' notice, jina returned the shell after every key answered HTTP 402 (pool exhausted). www.ivanti.com/blog/november-2026-security-update IS readable with extract and carries Ivanti''s exploitation statement. CERT-FR avis pages (cert-fr avis-recent, extract) carry the fixed builds (CSA 5.0.8.1) for Ivanti and are the workable authority substitute.'
- 'GitHub search API reads unauthenticated through url --direct (repositories?q=<CVE id>): the CVE-id search is a cheap public-PoC check; the account googlesky (github.com/googlesky, 115 public repos, created 2013) published containerised lab PoC repositories for most November 2026 vendor flaws (Quay CVE-2026-110697, Check Point CVE-2026-123039, Ivanti CVE-2026-121653, Fortinet FortiMail/FortiManager/FortiClient, Windows LDAP, Git merge, Apache httpd, others) within 24 to 48 hours of disclosure. Expect ''public PoC'' statements from NCSC-NL and others to trace to this account; treat the repos as third-party lab models and claims, not as vendor-confirmed exploits.'
- 'docs.redhat.com English URL slugs guessed from a localized result 404ed (page not found); only the localized URL the search returned resolved (Quay 3.14 configuration reference, Korean path with English text): never guess documentation slugs.'
- 'extract fell back to the jina reader for docs.redhat.com pages and the NCSC-NL advisory page (served via jina) even though the key pool reported exhaustion on other calls: the fetch returned content, but expect intermittent reader credit use on those hosts.'
dead_ends:
- 'Ivanti hub.ivanti.com advisory pages (EPM November 2026, CSA CVE-2026-121683): unreadable on extract, url --direct, WebFetch (x2), jina; CERT-FR AVI-1506 and CNA records used instead.'
- 'Red Hat Customer Portal solutions 7149923 and 7149592: only the public preview (issue, environment, description) is visible; remediation steps are ''Subscriber exclusive content''.'
- 'Red Hat Bugzilla 2568072 for CVE-2026-110697 (BZ 2552237) not fetched (not needed: CNA/errata cover it); Bugzilla 2568072 itself carries no Fixed In Version (status NEW).'
- WebSearch for 'CVE-2026-123710 exploit proof of concept', 'exploited in the wild' and 'Ivanti PoC' returned no exploitation reports or PoC pages (search snippets are leads only and are not cited).
