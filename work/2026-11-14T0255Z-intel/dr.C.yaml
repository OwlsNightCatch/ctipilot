  attack_suggestions:
  - id: T1190
    name: Exploit Public-Facing Application
    behavior: 'CVE-2026-123710: unauthenticated /v2/auth token request followed by PUT to the /keys service-key endpoint on a reachable registry; CVE-2026-110697: authenticated robot-listing API call.'
  - id: T1606
    name: Forge Web Credentials
    behavior: 'registry bearer JWTs signed with the attacker-installed approved signing key are accepted for any repository (Red Hat: ''Registry tokens signed with that key are accepted for any repository'').'
  - id: T1525
    name: Implant Internal Image
    behavior: push or overwrite of images and tags in the registry (tag replacement) with the forged tokens or the stolen robot tokens; downstream systems pull the poisoned image.
  - id: T1195.002
    name: Compromise Software Supply Chain
    behavior: 'the stated impact: replaced images propagate to every system that later pulls them, CI/CD pipelines included (Red Hat). Keep as the impact mapping (S1 and S2 carried it).'
  - id: T1528
    name: Steal Application Access Token
    behavior: 'CVE-2026-110697: decrypted robot-account tokens of another tenant returned by the colliding-namespace listing.'
  - id: T1550.001
    name: Application Access Token
    behavior: use of the stolen robot token against the registry to read, push or overwrite the victim tenant's images (Red Hat statement).
  - id: T1552.001
    name: Credentials In Files
    confidence: optional / lower
    behavior: private images pulled with forged tokens can contain secrets or credentials (Red Hat solution 7149923); mapping is a consequence, not a stated technique.
  - id: T1489
    name: Service Stop
    confidence: optional / lower
    behavior: the attacker key can delete the keys running Quay instances use, so pushes and pulls fail with authentication errors (Red Hat, THN); disruption side effect.
  - id: T1059.007
    name: JavaScript
    confidence: CVE-2026-128824 only, optional
    behavior: reflected XSS executes script in the victim's browser within the Quay origin.
  - id: T1566.002
    name: Spearphishing Link
    confidence: CVE-2026-128824 only, optional
    behavior: victim must follow a crafted URL (user interaction required).
  detection_and_triage_hooks_source_supported:
  - Quay audit records of service_key_rotate and service_key_delete events with a null expiration_date (Red Hat, in CVE mitigation).
  - Reverse-proxy / load-balancer access logs for /keys requests from anything other than Quay's own components; anonymous /v2/auth token requests carrying an unexpected 'service' (audience) value followed by key-rotation calls (mechanism per Bugzilla 2568072; the log pattern itself is derived, not stated by Red Hat).
  - Robot-listing API calls with token=true from accounts whose namespace name contains an underscore (third-party README names the endpoints; derived hook).
  - Newly created namespaces containing an underscore that differ from an existing namespace in one character (Red Hat solution 7149592 precondition).
  - 'Post-patch compromise check: list approved service keys and remove unrecognised ones (a planted key is not removed by password resets or robot-token regeneration, Red Hat); rotate robot tokens for any namespace that collides with an underscore-containing one.'
  benign_lookalike: none stated by any source; Red Hat's only discriminator is the null expiration_date filter on key lifecycle audit events.
- item: 2
  entry_kind: UPDATE of entries/2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce.md
  main_analysis_word_count: 290
  main_analysis_word_count_note: 'body has no ''## '' heading (no update sections yet): 290 words in the single block incl. Exposure/Detection/Defender takeaway paragraphs'
  summary_of_delta:
  - NCSC-NL advisory NCSC-2026-0493 revision 1.0.1 (2026-11-13T14:59Z; page header 15:59 Europe/Amsterdam) adds an update stating public PoC code for CVE-2026-121653 can be found on the internet and that this raises the chance of active exploitation in the short term; NCSC-NL rates probability 'medium', damage 'high' and gives no PoC URL or author (its only reference is Ivanti's advisory).
  - 'The only public repository found (GitHub repo search by CVE id: one result) is googlesky/CVE-2026-121653, created 2026-11-12T06:43Z. Its README says the proprietary Windows-only Core cannot run in a container, so it reproduces the flaw against a model of the status-event web service on a real SQL Server, built from earlier research on the same component and defect class (ZDI-24-507, CVE-2024-29824, Horizon3.ai). It is a lab model, not a validated exploit against Ivanti''s build; whether NCSC-NL means this repository is an inference. The same account published lab PoCs for most November 2026 vendor releases (Quay, Check Point, Fortinet, Microsoft LDAP, Git and others).'
  - 'No exploitation statement from any authority: Ivanti blog (2026-11-10, read directly): ''We have no evidence of these vulnerabilities being exploited in the wild.''; per-advisory ''not aware of any customers being exploited'' (via Rescana; security.nl relays the same); CISA-ADP SSVC on the CNA record (2026-11-11): Exploitation none, Automatable yes, Technical Impact total; not in the CISA KEV catalogue (version 2026.11.13); not on ENISA''s exploited list; CERT-FR AVI-1506 (2026-11-12) has no exploitation statement; EPSS 0.0198 (80.9th pct).'
  - 'Fixed CSA build: 5.0.8.1. CERT-FR AVI-1506 lists ''Ivanti Cloud Services Application (CSA) version 5.0.8 antérieure à 5.0.8.1'' as affected; SecurityWeek: ''CSA version 5.0.8.1 patches the bug''; Rescana quotes Ivanti''s CSA advisory: ''only version 5.0.8 is affected'', 5.0.7 and prior not impacted, and the Dual NIC statement. The CNA record for CVE-2026-121683 encodes 5.0.8 as ''unaffected'' with defaultStatus affected, which conflicts with the advisory; the authority reading (CERT-FR) agrees with the advisory.'
  - 'Ivanti''s own advisory pages could not be read on any rung: extract (JS shell), url --direct (1.06 MB Salesforce Lightning shell, no CVE text), WebFetch x2 (empty ''Loading'' shell, also for the CSA article and the forums.ivanti.com host which 301s to hub.ivanti.com), jina (reader pool dead, HTTP 402 on every key, returned the empty shell). Ivanti''s blog (www.ivanti.com) IS readable. Use CERT-FR AVI-1506 as the authority citation for the CSA build.'
  - 'NCSC-NL names a second CVE the entry does not carry: CVE-2026-18128 (EPM Agent, cleartext transmission, CWE-319, CVSS 6.8, MITM reads and modifies HTTP traffic), also fixed in 2024 SU8. NCSC-NL does not mention CVE-2026-121683 (CSA).'
