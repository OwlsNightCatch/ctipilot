    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update QTS, QuTS hero, QuTScloud, Notes Station 3, QVR Surveillance (ARM32 models) and TVR OS now ("
    urls: ["https://www.qnap.com/en/security-advisory/qsa-26-18"]
  - claim_id: a88c55178e
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
