    kind: cited
    text: "**Defender takeaway:** find which of the listed models and Fiery controllers the estate and its print suppliers run, and treat any that untrusted networks can reach as exposed to an exploited flaw class: Xerox names no interim mitigation, so the lever is network reachability until the fixes are installed on release, 2026-11-06 for AltaLink, EC81xx and VersaLink and 2026-11-09 to 2026-11-23 for Fiery ("
