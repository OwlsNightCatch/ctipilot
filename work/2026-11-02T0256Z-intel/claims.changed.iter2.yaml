claims:
  - claim_id: 63466fea9c
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "body"
    kind: cited
    text: "Der Spiegel reported, citing security sources, that the ransomware group Rhysida is behind the attack ("
    urls: ["https://www.heise.de/news/30-Bitcoin-oder-Leak-Ransomware-Bande-erpresst-Berlin-11434325.html"]
  - claim_id: 174fe40528
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "body"
    kind: cited
    text: "Per the joint CISA/FBI/Multi-State ISAC advisory on the group, current as of its 2025-04-30 update, its initial-access techniques include compromising internal VPN access points using valid credentials at organizations lacking multi-factor authentication, and separately deploying Gootloader malware ("
    urls: ["https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-319a"]
  - claim_id: 6a1693799b
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "body"
    kind: cited
    text: "**Triage:** the reported mechanism, a user's click on a phishing email followed by multi-day bulk data exfiltration, surfaces at the point of delivery in mail-flow logs and, in egress and data-loss-prevention telemetry, as a sustained high-volume outbound transfer from one department's network segment; BSI's advisory adds that TerminalFix operators stage exfiltration into attacker-controlled cloud storage with the provider's own transfer tool ("
    urls: ["https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile"]
  - claim_id: 58502ab978
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "body"
    kind: cited
    text: "), but BSI does not confirm to rbb24 that the Berlin attack followed that pattern ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
  - claim_id: d4085ce8e2
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "rbb24 Recherche reported on 2026-10-21 that the attack-detection system introduced in 2026 had licences for only five percent of all devices, according to the Senate department for urban development, which also said that extending it to every device was not possible \"for financial reasons\"; rbb's research shows that neither the endpoint identified as the criminals' entry point nor the servers from which data later flowed were covered by it (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
  - claim_id: b0b94b9975
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "Both departments also said that in 2024 the funds needed for IT security were available only in part to the extent required, although the state's information-security guideline has obliged agencies since 2017 to provide enough staff and money (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
  - claim_id: c33515e74b
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "The stolen data includes a copy of the transport senator's identity card and of her digital signature and, rbb's analysis shows, further identity-card copies and personal documents of employees; the mobility department confirmed to rbb that the data is mostly unstructured files from shared and personal directories (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
  - claim_id: 09fb3d4df2
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "BSI's advisory of 2026-09-04 never names Berlin, so the link between TerminalFix and this incident rests on heise's reading of BSI's Mastodon post, not on a BSI statement about Berlin. rbb describes the chain for such warnings: the Berlin-CERT run by the IT service centre ITDZ passes relevant reports to each agency's information-security officers, and each agency is itself responsible for acting on them; the ITDZ and the Senate Chancellery did not say whether BSI's warnings reached the two departments or what followed (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
  - claim_id: d90bda3350
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-11-02T03:47:06Z"
    kind: record-summary
    text: "rbb24 Recherche reported on 2026-10-21 that the Senate department for urban development's attack-detection licences covered only five percent of devices and that neither the entry endpoint nor the servers the data left from were covered; BSI told rbb24 it does not confirm that the Berlin attack followed the TerminalFix pattern, so the entry's priority moves to notable, confidence to medium and credibility to 2."
  - claim_id: 6cec01bc72
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "body"
    kind: cited
    text: "Synology's advisory Synology-SA-26:14 rates its PHP 7.3 to 8.4 packages, Mail Station and Synology Calendar critical and lists fixed releases for each except the end-of-life PHP 7.3 package, which gets no fix; revision 3 of 2026-10-29 added PHP 7.4 for DSM 6.2, 7.0 and 7.1 and PHP 8.0 for DSM 7.0 and 7.1, and revision 4 of 2026-10-31 added Calendar and Mail Station for DSM 6.2, 7.0 and 7.1 ("
    urls: ["https://www.synology.com/en-global/security/advisory/Synology_SA_26_14"]
  - claim_id: fe6c68f494
    entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
    surface: "body"
    kind: cited
    text: "**Exposure:** a QNAP NAS on QTS, QuTS hero or QuTScloud below the fixed builds, or a QNAP device running QVR Surveillance (ARM32 models) below 3.0.3.1756, TVR OS below 1.0.5, or Notes Station 3 below 3.9.15, whose management or web ports are reachable from outside, which QNAP ties to router port forwarding, UPnP and myQNAPcloud publishing; the management ports default to 8080 and 443 ("
