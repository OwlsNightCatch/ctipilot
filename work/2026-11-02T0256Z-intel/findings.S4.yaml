        attribution: "rbb24 Recherche (Rundfunk Berlin-Brandenburg)"
        source_url: "https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"
      - quote: "Weder das als Einstiegspunkt für Kriminelle identifizierte und untersuchte Endgerät noch die Server, von denen später Daten abflossen, waren von der Angriffserkennung erfasst."
        attribution: "rbb24 Recherche (Rundfunk Berlin-Brandenburg)"
        source_url: "https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"
      - quote: "Für die Umsetzung empfohlener Schutzmaßnahmen ist anschließend die jeweilige Behörde selbst verantwortlich."
        attribution: "rbb24 Recherche (Rundfunk Berlin-Brandenburg)"
        source_url: "https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"
      - quote: "Ob der Angriff auf die Berliner Senatsverwaltungen tatsächlich nach diesem Muster ablief, bestätigt das BSI dem rbb nicht."
        attribution: "rbb24 Recherche (Rundfunk Berlin-Brandenburg)"
        source_url: "https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"
    extended_notes: |
      Defender angle for the Swiss constituency (as stated by the sources, no invention): the gap was licence coverage, not tool absence, so an inventory check of which endpoints and servers (especially file servers holding shared and personal directories, which is where the stolen data came from) actually run the EDR agent is the transferable hardening question; the second is who in a federated administration is accountable for acting on a national-CERT warning (here BSI to Berlin-CERT to the agencies' information-security officers, with no tracking of uptake). Detection concept tied to the rbb24 facts: sustained high-volume egress from file servers outside EDR coverage (Born, citing the earlier reporting, says the IT service provider noticed the large data volume, not the departments' own tooling). Recency note: the rbb24 article is dated 2026-10-21 (outside the 72 h developing window); the in-window source is the Born relay of 2026-10-30 23:02Z. No other in-window source was found for the EDR-coverage statement. The main agent should weigh whether a relayed 12-day-old disclosure clears the update bar; my lean is a short improvement/update record because the content is new to the store and decision-relevant for public-sector defenders.
    borderline: true
    borderline_reason: "Update-shape item whose primary (rbb24, 2026-10-21) predates the 72 h developing window; the in-window source (Born, 2026-10-30) is a relay. Content is new to the store (the entry's last record is 2026-09-10) and is the strongest public-sector lessons-learned datum of the window, and it contains one source tension with the entry's BSI-confirmation wording."
