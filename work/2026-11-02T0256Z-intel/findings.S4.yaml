items:
  - title: "Berlin Landesnetz compromise (Rhysida): the endpoint-detection licences covered 5 percent of devices and covered neither the entry endpoint nor the servers the data left from; BSI declines to confirm the TerminalFix pattern to rbb24"
    sources:
      - { url: "https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html", publisher: "rbb24 Recherche (Rundfunk Berlin-Brandenburg)", date: "2026-10-21", role: "primary" }
      - { url: "https://borncity.com/blog/2026/10/31/neue-erkenntnisse-im-cybervorfall-auf-senatsverwaltung-berlins/", publisher: "Borns IT- und Windows-Blog", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: borncity, URL https://borncity.com/blog/2026/10/30/... via feed https://borncity.com/blog/feed/ (item 'Neue Erkenntnisse im Cybervorfall auf Senatsverwaltung Berlins', published 2026-10-30T23:02Z), drilled with extract https://borncity.com/blog/2026/10/31/neue-erkenntnisse-im-cybervorfall-auf-senatsverwaltung-berlins/ -> pivot: rbb24 article linked in that post, URL https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html (primary, read in full via extract; dated 2026-10-21)"
    summary: |
      Delta on the covered Berlin Landesnetz entry (last changelog record 2026-09-10; nothing about the points below is in it). rbb24 Recherche reported on 2026-10-21, from the two affected Senate departments' own written answers, that the endpoint-detection system introduced in 2026 had licences for only 5 percent of all devices ("Die vorhandenen Lizenzen reichten lediglich für fünf Prozent aller Geräte"), that expansion to all devices was ruled out "aus finanziellen Gründen", and that neither the endpoint identified as the criminals' entry point nor the servers from which data later flowed were covered by that detection. The same departments told rbb that in 2024 the funds needed for IT security were available only "teilweise im erforderlichen Maße". rbb also reports BSI says it warned repeatedly since at least March 2025, publicly and in daily situation reports that also went to the Länder, about ClickFix-style fake security prompts, and that BSI described a developed variant, TerminalFix, in September 2026. The responsibility chain rbb documents is the transferable point: the ITDZ-run Berlin-CERT forwards such warnings to each agency's information-security officer, but implementing protective measures is each agency's own responsibility, and neither ITDZ nor the Senate Chancellery answered whether the BSI warnings reached the two departments or what followed. Two points sit awkwardly with the existing entry and need a decision by the main agent: (1) rbb24 states "Ob der Angriff auf die Berliner Senatsverwaltungen tatsächlich nach diesem Muster ablief, bestätigt das BSI dem rbb nicht", while the entry carries BSI as having confirmed TerminalFix as the vector (BSI advisory BITS-2026-287419-1032 describing an anonymised state institution plus a BSI Mastodon post); the two can both be true (BSI never named Berlin in the advisory), but the entry's wording should be checked against this; (2) rbb24's text additionally reports that the leaked data includes ID-card copies and a digital signature of the transport senator and of employees, which the Senate department for mobility confirmed to rbb as "unstrukturierte Daten aus gemeinsam genutzten und persönlichen Verzeichnissen". Fact/claim split: the 5 percent figure, the uncovered entry endpoint and exfiltration servers, and the funding statements are the Senate departments' own statements to rbb (facts as stated by the victims); the March-2025 BSI warning history is BSI's statement to rbb; the Born post is a relay of rbb24 and adds no independent observation.
    region_nexus: "Germany (Berlin state administration); direct structural analogue for Swiss cantonal and communal administrations (federated responsibility for acting on national-CERT warnings, EDR licence coverage)"
    primary_sector_nexus: "direct (public-sector; sub-national government administration)"
    sector: "public-sector"
