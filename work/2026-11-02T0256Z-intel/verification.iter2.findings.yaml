- code: F5
  category: missing-citation
  section: berlin-landesnetz-rhysida-extortion-phishing-vector
  item: "Berlin Landesnetz, update 2026-11-02T03:47:06Z, second paragraph"
  url_or_quote: "BSI's advisory of 2026-09-04 never names Berlin, so the link between TerminalFix and this incident rests on heise's reading of BSI's Mastodon post, not on a BSI statement about Berlin."
  summary: "(low confidence) This sentence carries no inline citation of its own; the only link in the paragraph (rbb24) ends the next sentence and says nothing about the advisory not naming Berlin or heise's reading of the Mastodon post. Cite the BSI advisory PDF (it describes 'die Kompromittierung des Netzwerks einer staatlichen Institution' and never names Berlin) and heise 11444072. 'not on a BSI statement about Berlin' is also imprecise: the entry's own 2026-09-08 section says BSI's Mastodon post stated it was intensively involved in handling the Berlin incident; what BSI has not stated is that the Berlin attack followed TerminalFix. Reword to 'not on a BSI statement linking TerminalFix to Berlin'."
- code: F4
  category: hallucinated-fact
  section: berlin-landesnetz-rhysida-extortion-phishing-vector
  item: "Berlin Landesnetz, update 2026-11-02T03:47:06Z, Defender takeaway"
  url_or_quote: "because in Berlin's chain the departments' answers do not show whether the warnings reached them."
  summary: "(low-medium confidence) rbb24: 'beantwortet das ITDZ nicht und verweist in einer schriftlichen Antwort an den rbb an die Senatskanzlei. Aber auch die Senatskanzlei lässt diese so entscheidende Frage unbeantwortet.' The unanswered question is the ITDZ's and the Senate Chancellery's (and the entry's own section says 'the ITDZ and the Senate Chancellery did not say'); no source says the two departments were asked or failed to answer it. Replace 'the departments' answers' with 'the ITDZ's and the Senate Chancellery's answers'."
- code: F14
  category: quantifier-without-source
  section: android-sms-of-death-wap-push-telephony-crash
  item: "Android 'SMS of Death', Defender takeaway (and headline)"
  url_or_quote: "list the Android 12 and 13 phones, which have no fix and stay crashable by one message, for replacement; headline: 'Android 12 and 13 get no fix'"
  summary: "(low confidence) The Exposure line was softened to 'outside the security-update window', but the takeaway still states an absolute. smsofdeath.com: 'devices on older versions outside the security-update window, such as Android 12 and 13, run the same code and do not receive the fix'; Security Affairs: 'Older devices, such as those running Android 12 and 13, may remain exposed if they do not receive corrective updates.' Qualify the takeaway the same way as Exposure ('Android 12 and 13 phones outside the update window'); the headline is closer to BleepingComputer ('did not receive the fix') and can stay or take the same qualifier."
- code: F4
  category: hallucinated-fact
  section: dahua-easy4ip-p2p-cloud-camera-takeover-cert-ua
  item: "Dahua Easy4IP, summary"
  url_or_quote: "passwords are then guessed or the 2021 authentication-bypass flaws CVE-2021-33044 and CVE-2021-33045 are used on outdated firmware."
  summary: "(low confidence, frontmatter vs body) The summary states use of the two flaws as fact, while the body, citing eSecurity Planet, says 'although their use in the October cases remains unconfirmed' (eSecurity Planet: 'although their use in the October incidents remains unconfirmed'; Security Affairs: 'They may try common or weak passwords or exploit security flaws in outdated firmware'). Add the hedge to the summary ('or may use ... , though their use in the October cases is unconfirmed')."
- code: F4
  category: hallucinated-fact
  section: nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
  item: "NIK C2, sourcing_note"
  url_or_quote: "Talos found the server through its own tracking and assesses with moderate confidence that the framework is functional rather than a proof of concept"
  summary: "(low confidence) Talos says only 'During our research, we observed that a threat actor hosted the NIK C2 framework on a server' and that observing the infrastructure active in the wild 'allowed us to assess with moderate confidence'; no source states how Talos found the server or that it was 'its own tracking'. Write 'Talos observed the server active in the wild'."
- code: F4
  category: hallucinated-fact
  section: xerox-fiery-php2shell-printers-fixes-due-6-to-23-november
  item: "Xerox/Fiery cves[] CVE-2026-109618 and CVE-2026-109619"
  url_or_quote: "vector: zero-click, auth: pre-auth (on cves records whose affected field is the Xerox and Fiery device list)"
  summary: "(low confidence) The entry's own text says the bulletin 'does not name the affected interface or PHP version', and the Xerox bulletin states nothing about authentication or reachability on these devices; the only support is KEV's PHP-level description ('allows for unauthenticated remote code execution'), which the body never states. Machine readers will take pre-auth and zero-click as properties of the listed printers. Either state the KEV description in the body as a property of the PHP flaws and qualify the records, or leave auth and vector to what the bulletin supports."
- code: F11
  category: editorial-advisory
  section: xerox-fiery-php2shell-printers-fixes-due-6-to-23-november
  item: "Xerox/Fiery headline"
  url_or_quote: "PHP2Shell hits Xerox AltaLink and VersaLink printers and Fiery controllers; fixes due 6 to 23 November"
  summary: "(advisory, low confidence) 'hits' reads as attacks on the devices; the summary itself says the bulletin 'names no workaround, interface or attack on these devices'. 'affects' (or 'Xerox lists ... as affected') matches the source."
- code: F11
  category: editorial-advisory
  section: berlin-landesnetz-rhysida-extortion-phishing-vector
  item: "Berlin main analysis, undeclared deletion"
  url_or_quote: "removed from the main analysis: 'Rhysida has run this extortion pattern against public-sector targets before, including an earlier 2026 claim against the city of Stuttgart (translated from German) (heise online, 2026-08-29)'"
  summary: "(advisory, low confidence) git diff HEAD shows this sourced sentence deleted from the main analysis; heise 11434325 supports it ('In diesem Jahr attackierte die Bande die Stadt Stuttgart. Das Schema ist immer gleich: Daten werden ausgeleitet'). The record's fields name body, but neither the record summary nor the section says a sentence was dropped or why. Restore it, or say in the record that it was removed. Left as declined by the main agent and not re-raised: em dashes and the 'Contradiction line' / '2026-09-08 update' cross-references in older Berlin text."
