    text: "Xerox's security bulletin XRX26-016 (published 2026-10-23, updated 2026-10-28) lists AltaLink, EC81xx, VersaLink C/B415, C/B625 and C/B620, WorkCentre 3655, EC7836 and EC7856, the Fiery Digital Front End and the Worldwide Ticketing Tool as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619, and no fixed build is out: Xerox expects the AltaLink, EC81xx and VersaLink fixes on 2026-11-06, Fiery patches are due between 2026-11-09 and 2026-11-23, and the WorkCentre and Ticketing Tool fixes are in development. The bulletin names no workaround, interface or attack on these devices; CISA lists both PHP flaws as exploited."
