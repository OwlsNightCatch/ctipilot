    text: "An independent researcher published a working proof of concept on 2026-10-29 for a zero-click remote denial of service in Android's telephony framework: one malformed WAP Push data message crashes the com.android.phone process, drops active calls including emergency calls and, because the message is retried, can leave a phone in a restart loop. Per the researcher, Google's fix shipped in the October 2026 update for Android 14 to 17, so Android 12 and 13 phones run the same code unfixed; no source reports exploitation."
