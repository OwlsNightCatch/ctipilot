    entry: 2026-11-02/dahua-easy4ip-p2p-cloud-camera-takeover-cert-ua
    surface: "summary"
    kind: frontmatter
    text: "Ukraine's CERT-UA reports, in an alert dated 2026-10-23, compromises of Dahua IP cameras and video recorders in which attackers viewed the stream, changed device settings and created accounts of their own. The main vector is Easy4IP, Dahua's peer-to-peer remote-access feature, which reaches a device through Dahua's cloud by its guessable serial number without any published port; passwords are then guessed or the 2021 authentication-bypass flaws CVE-2021-33044 and CVE-2021-33045 are used on outdated firmware."
