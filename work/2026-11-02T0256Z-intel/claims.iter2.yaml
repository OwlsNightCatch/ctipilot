    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "Both departments also said that in 2024 the funds needed for IT security were available only in part to the extent required, although the state's information-security guideline has obliged agencies since 2017 to provide enough staff and money (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
