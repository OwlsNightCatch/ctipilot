    text: "Talos: NIK C2 implant calls the OpenAI API from the victim host and bills the victim's own key if none is given"
  - claim_id: 32c2d90b19
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos describes NIK C2, a command-and-control framework seen with a live server, whose Go implant for Windows has more than 52 commands and an ai_generate command that builds an OpenAI Chat Completions request on the infected host from an operator prompt. If the operator supplies no key the implant reads the OPENAI_API_KEY environment variable, so OpenAI bills and logs the victim's key; Talos names no victims, sector or initial-access method."
  - claim_id: 943d5ceff5
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "body"
    kind: cited
    text: "Cisco Talos found a command-and-control framework it calls NIK C2, with a live server, whose 64-bit Go implant for Windows takes more than 52 commands: browser and Wi-Fi credential theft, keylogging, screen, camera, microphone and clipboard capture, hidden VNC, RDP session interaction, an embedded SOCKS5 and HTTP proxy with a reverse tunnel for lateral movement, AMSI patching, UAC bypass and process hollowing ("
    urls: ["https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"]
  - claim_id: c6eb3aca13
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "body"
    kind: cited
    text: "It talks to its server over TLS WebSockets on port 443 with an HTTP polling fallback about every 250 milliseconds under AES-256-GCM, persists through registry Run keys and COM hijacking, masquerades under a system-process name such as svchost.exe and runs a watchdog process ("
    urls: ["https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"]
  - claim_id: 10fcf1f1bf
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "body"
    kind: cited
    text: "The new part is the `ai_generate` command: the implant builds an OpenAI Chat Completions request from an operator prompt on the infected host, posts it to OpenAI from the victim's address and returns the answer to the panel; if the operator gives no key it reads the `OPENAI_API_KEY` environment variable, so OpenAI charges the victim's payment method and its logs show the victim's key ("
    urls: ["https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/", "https://www.infosecurity-magazine.com/news/nik-c2-malware-victims-openai-keys/"]
  - claim_id: 3088d80410
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "body"
    kind: cited
    text: "A screen-locking ransomware module encrypts no files: PowerShell copies the boot sector to a temporary file, and a looping batch file reopens a lock page shown through mshta.exe ("
    urls: ["https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"]
  - claim_id: 62a3c388e7
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
    surface: "body"
    kind: cited
    text: "**Detection:** in egress and proxy telemetry, requests to the OpenAI API from a process that is not a sanctioned AI client, in particular a process named like a system binary such as svchost.exe that runs from the user's Roaming Microsoft Network folder, the install location the post describes; in process and registry telemetry, the fodhelper.exe UAC-bypass pattern (a command written under the ms-settings shell key and removed within seconds), an AMSI patch in a PowerShell session and, from the lock-screen module, a Run key that launches a looping batch file ("
    urls: ["https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"]
  - claim_id: c64b2f6886
    entry: 2026-11-02/nik-c2-go-implant-sends-prompts-to-openai-from-victim-host
