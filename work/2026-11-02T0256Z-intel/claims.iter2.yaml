  - claim_id: 1b91c37953
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, which BFMTV reports as a remotely forced defrost at hundreds of stores. CERT-FR's alert, last revised on 2026-10-16, reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, says campaigns are probably still running and that a factory reset alone does not protect an unpatched end-of-life unit, and in its current text tells owners to check the whole configuration, defrost ranges included, and to restart or otherwise factory-reset a compromised Danfoss unit. NCSC Switzerland rates the activity actively exploited, and Copeland's own bulletin of 14 October, carried in a Dixell France guide that CERT-FR links, acknowledges a vulnerability on a discontinued, end-of-life generation of XWEB EVO controllers and says to remove every XWEB EVO from the public internet at once. Danfoss says most affected units are legacy products or current AK-SM800A units on outdated firmware. ANSSI's director general told the French Senate on 2026-10-21 that elementary flaws were exploited, starting with controllers directly on the internet, administered without particular protection, and weak passwords, rather than vulnerabilities researchers had published; no actor is named on the record and the Paris prosecutor is investigating. Reuters reports that the Pentagon treats late-August freezer failures at US military commissaries as a suspected hack, and Nextgov that two people familiar with the matter say US officials suspect Iran-linked hackers; neither says how the intruders got in."
