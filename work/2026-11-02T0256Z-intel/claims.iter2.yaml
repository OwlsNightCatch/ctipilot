    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "BSI's advisory of 2026-09-04 never names Berlin, so the link between TerminalFix and this incident rests on heise's reading of BSI's Mastodon post, not on a BSI statement about Berlin. rbb describes the chain for such warnings: the Berlin-CERT run by the IT service centre ITDZ passes relevant reports to each agency's information-security officers, and each agency is itself responsible for acting on them; the ITDZ and the Senate Chancellery did not say whether BSI's warnings reached the two departments or what followed (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
