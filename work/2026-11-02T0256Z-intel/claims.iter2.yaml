    text: "QNAP's advisory QSA-26-18 says the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2) affect the PHP in the web components of QTS, QuTS hero, QuTScloud and several QNAP applications and can be triggered before authentication, and fixed builds dated 2026-10-23 are out for QTS, QuTS hero and QuTScloud. As of 2026-10-28 (revision V1.2) the table lists QVR Surveillance (ARM32) 3.0.3.1756, TVR OS 1.0.5 and Notes Station 3 3.9.15 as resolved; QNE (ADRA) has its own advisory, QSA-26-19, with no fixed version and QNAP says to keep devices off the internet; QNAP has seen scanning and exploitation attempts in the wild but no reports of exploitation targeting its products, and CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26. Synology's advisory, revised on 2026-10-31, fixes its PHP packages (except the end-of-life PHP 7.3), Mail Station and Calendar, with builds for DSM 7.2 and above, DSM 7.0 to 7.1 and, for PHP 7.4, Mail Station and Calendar, DSM 6.2."
