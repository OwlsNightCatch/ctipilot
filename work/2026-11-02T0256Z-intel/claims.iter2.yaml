    surface: "body"
    kind: cited
    text: "**Triage:** the reported mechanism, a user's click on a phishing email followed by multi-day bulk data exfiltration, surfaces at the point of delivery in mail-flow logs and, in egress and data-loss-prevention telemetry, as a sustained high-volume outbound transfer from one department's network segment; BSI's advisory adds that TerminalFix operators stage exfiltration into attacker-controlled cloud storage with the provider's own transfer tool ("
    urls: ["https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile"]
  - claim_id: 58502ab978
