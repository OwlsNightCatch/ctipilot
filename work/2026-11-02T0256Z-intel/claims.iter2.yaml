    text: "Compare the endpoints and servers that actually run the detection agent, file servers holding shared and personal directories first, with the estate, and settle who in a federated administration is accountable for acting on a national-CERT warning, because in Berlin's chain the departments' answers do not show whether the warnings reached them."
