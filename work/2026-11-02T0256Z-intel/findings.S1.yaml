    role: corroborating
  discovery_trace: 'first seen at: The Hacker News feed, URL https://feeds.feedburner.com/TheHackersNews (item ''TeamViewer Flaw Lets Remote Computers Attack Users Who Connect to Control Them'', 2026-10-30, no store match) -> pivot: article URL https://thehackernews.com/2026/10/teamviewer-flaw-lets-remote-computers.html -> primary: TeamViewer bulletin, URL https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1011/'
  summary: 'TeamViewer''s bulletin TV-2026-1011 (2026-10-28) lists three flaws fixed in version 15.83: a TOCTOU race with symlink handling in the privileged helper of the macOS Full Client and Host that gives local privilege escalation to root (CVSS 3.1 7.8); an out-of-bounds write in the screen-image decoder of the Full Client for Linux and macOS that allows remote code execution through crafted screen-image data during a remote-control session or by opening a crafted session recording (.tvs), with user interaction (8.8); and an integer overflow in the remote-control screen decompression of the Full Client, Portable edition and Android Remote Control app, reported by The Hacker News as CVE-2026-111585 (8.8), that lets a malicious or compromised host cause a crash or, depending on the platform, code execution with the viewer process''s privileges once a user starts a session to that host. Fixed builds are 15.83 for current clients and hosts, and 15.64.10 (Windows 7 and 8), 14.7.48868 and
    13.2.36231 or 13.2.154008 or 13.2.154007 for the legacy lines; The Hacker News, summarising Remedio''s research of 2026-10-29, reports a demonstrated code execution on Windows that used a stand-in for part of the host''s data and says the September 15.82 update did not remove the flaw. TeamViewer states it is not aware of exploitation in the wild, no workaround exists, and the flaws are not on CISA KEV. The practical exposure is the support technician''s workstation: the attack runs from the controlled machine against the machine that controls it.'
