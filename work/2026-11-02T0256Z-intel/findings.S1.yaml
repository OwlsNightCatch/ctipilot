    Detection concept (inference): BMS network flow logs or firewall logs for TCP 443 connections to controllers from outside the BMS VLAN; for the Brotli path, Node-RED flow definitions that make HTTP requests or process compressed data. Note: the older SecB0015 PDF at the unversioned URL named port object NP20001; the rev3 PDF names NP8 - follow rev3.
