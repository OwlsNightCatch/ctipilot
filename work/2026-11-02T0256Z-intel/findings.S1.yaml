recipe_notes:
- 'NCSC-NL PHP2Shell inventory: `python3 tools/fetch_source.py url --direct https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md` returns a 678 KB newest-first change log of per-vendor status rows with vendor-source links; it is how the Xerox, Fiery, Delta Controls, pfSense and OPNsense estates were found. The registered source ncsc-nl-php2shell-tracker is not on this slice; consider rotating it into S1.'
- 'Siemens ProductCERT: `python3 tools/fetch_source.py url --direct https://cert-portal.siemens.com/productcert/csaf/ssa-feed-tlp-white.json` lists SSAs with updated dates; the HTML advisory extract drops product names from its tables, while https://cert-portal.siemens.com/productcert/csaf/ssa-NNNNNN.json carries product_tree and remediations (a parse of both is in the run scratch). Siemens PHP2Shell/Node2Shell advisories SSA-166980, SSA-566435, SSA-045512, SSA-443410, SSA-898633 were absent from the store; siemens-productcert is a registered standard source that is not in this slice.'
- 'MSRC revised-CVE sweep (note of 2026-11-01) reproduced: `url --direct ''https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability?$filter=latestRevisionDate ge <ISO>&$orderby=latestRevisionDate desc&$top=300''`; most rows are Mariner/Linux noise, filter on the tag field.'
- extract fell back to the reader (jina) on belden.com, support.quest.com, qnap.com and trendmicro pages, and the reader answered despite several exhausted keys; belden.com answers 403 to url --direct.
dropped_candidates:
- 'Chrome 156.0.8078.79 stable (21 fixes, one Critical, CVE-2026-76024) and the Edge ingestion of 2026-10-31: no in-the-wild exploitation stated on the fetched Chrome Releases page; routine browser patching'
- 'Western Digital WDC-26001 (PHP2Shell, 2026-10-23): ''actively assessing'', no product named; Juniper Junos J-Web (NCSC-NL reading of JSA112681): vulnerable to CVE-2026-109618 but not exploitable, not affected by CVE-2026-109619; Sophos MyUTM portal (hosted, offline pending update); Plesk and cPanel hosted-PHP and panel fixes (released 2026-10-21 to 2026-10-23 per NCSC-NL list; runtime packaging covered by the main PHP2Shell entry''s guidance); Nextcloud/ownCloud/Zabbix/Icinga/Cacti/Nagios/GLPI and other PHP applications listed ''Vulnerable'' by NCSC-NL only because they depend on the host PHP runtime'
- 'Other in-window headlines read and dropped: Telegram Android voice-call flaw, Android SMS crash (BleepingComputer 2026-10-31), Northflank breach, Chainalysis breach, Polymarket DebugBear script hijack: S3/S4 domain or marginal'
