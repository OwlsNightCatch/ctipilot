    Vendor primary (A) + press relay -> classification hint A2. CVE ids for the macOS and Linux/macOS flaws are not shown in the extracted bulletin table (the CVE-ID cells were empty), so only CVE-2026-111585 is named, and that from The Hacker News.
    Exposure: technician and admin workstations running TeamViewer Full Client/Portable before 15.83 (and legacy builds below the fixed ones); macOS and Linux clients also for the decoder flaw; Android Remote Control app. Detection concept (inference): TeamViewer client crashes (application crash/WER events) immediately after starting a session to a particular host, followed by unexpected child processes of the TeamViewer process. Benign lookalike: crashes from unstable networks; discriminator = repeat crash tied to one remote host.
