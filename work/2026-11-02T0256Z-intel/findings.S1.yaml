  summary: 'Siemens ProductCERT''s SSA-166980 (published 2026-10-26, V1.2 of 2026-10-29) lists energy-sector products as affected by both PHP flaws (CVSS v3.1 9.8 for CVE-2026-109618 and 8.1 for CVE-2026-109619, CVSS v4.0 9.2): AMIS TS; Energy Engage V2.0SP9 (no fix planned) and V3.1SP1 (upgrade PHP to V8.1.34 release 6); the KACO blueplanet 360 NX3 M6 WM OD IISX inverter variants; Spectrum Power 4 using Nagios or Zabbix, with Web Office Portal V3.0 to V3.2 and with HISViews V1.0 (all ''currently no fix is available''); Spectrum Power 7 using the IHM (NagiosXI) web component (Red Hat PHP patch for RHEL 8 and 9), Spectrum Power 3 using IHM (NagiosXI) on RHEL 7 (Red Hat PHP patch for RHEL 7) and Spectrum Power TG on Windows using the WebConsole and WebQuery components (upgrade PHP to V8.5.12). The third revision (V1.2, 2026-10-29) added AMIS TS, Energy Engage, Spectrum Power 3, 4, 7 and TG. Siemens lists as known not affected Desigo CC, Desigo DXR2, DXR3, Optic, PXC3, PXC4, PXC5 and PXC7,
    Sinteso FS20 EN, SiPass integrated, SIPORT, Siveillance Control, Control Pro, Intrusion and Video, Building X, Climatix and Connect X200 to X500, so the building-management, fire-panel, access-control and video platforms common in public buildings are not in scope. The advisory reports no exploitation of Siemens products; CISA lists the PHP flaws as exploited. The advisory''s general note tells operators of critical power systems to check that redundant secondary protection is in place and to protect network access with firewalls, segmentation or VPN.'
  region_nexus: global; relevant to Swiss municipal energy utilities only if they run these Siemens energy-management products (not stated by any source)
