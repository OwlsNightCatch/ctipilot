    Exposure: any system whose firmware is built on EDK II with PXE/network boot enabled and an ICMP-reachable path from an attacker during boot (imaging/deployment VLANs, re-provisioning); confirm with the hardware vendor whether the firmware build includes the NetworkPkg PXE driver. Detection concept (inference): ICMP error messages longer than 504 bytes sent to hosts during PXE boot windows (network telemetry on provisioning VLANs); boots that hang in network boot. Hardening: disable PXE/network boot where unused, restrict ICMP to provisioning hosts from provisioning servers only; apply vendor firmware updates when published (the reboot can be delayed to the next regular one per Ars).
- title: 'CVE-2026-111585, TeamViewer Full Client, Portable and Android Remote Control app: a malicious or compromised remote host can crash or take over the technician''s viewer; TeamViewer 15.83 also fixes a Linux and macOS code-execution flaw and a macOS root escalation'
  sources:
  - url: https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1011/
    publisher: TeamViewer (security bulletin TV-2026-1011)
