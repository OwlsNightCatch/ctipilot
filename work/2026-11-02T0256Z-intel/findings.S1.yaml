  summary: Xerox security bulletin XRX26-016 (published 2026-10-23, version 4 of 2026-10-28) lists Xerox AltaLink and EC81xx products, VersaLink C/B415, C/B625 and C/B620, WorkCentre 3655, EC7836 and EC7856, the Fiery Digital Front End (DFE) print controllers and Xerox's Worldwide Ticketing Tool as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619 (PHP2Shell), which CISA lists as exploited since 2026-10-26. No fixed build is out. Xerox says fixes for AltaLink/EC81xx and VersaLink are being tested and expected on its web site on 2026-11-06, while the WorkCentre models and the Ticketing Tool are 'in development'; Fiery's target patch dates are by 2026-11-09 for FS800/700/600/500 (including Pro), by 2026-11-16 for FS400/350/300 and by 2026-11-23 for FS200. The bulletin does not name the PHP version, the affected interface or any exploitation against these devices; Xerox says Supplies Tracker is remediated and lists as not impacted, among others, Lexmark printer firmware, VersaLink
    B400 to B615, C400 to C605, C8000, C9000 and C/B70xx and C/B71xx, WorkCentre 3335, 3345 and 6515, and the evaluated Phaser and PrimeLink releases, with the review of the remaining products still underway. NCSC-NL's inventory mirrors the table and adds the Fiery Communities statement as a second vendor source; the Fiery page itself was not readable (JavaScript application).
