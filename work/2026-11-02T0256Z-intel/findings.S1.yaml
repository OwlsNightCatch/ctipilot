  discovery_trace: 'first seen at: SecurityWeek weekly roundup, URL https://www.securityweek.com/in-other-news-anthropic-breach-dispute-uefi-flaw-hits-most-servers-cloudflare-ai-data-leak/ (found while reading the SecurityWeek feed https://www.securityweek.com/feed/ for in-window leads; CVE-2026-97631 absent from the store) -> pivot: Ars Technica, URL https://arstechnica.com/security/2026/10/code-execution-flaw-in-uefi-firmware-threatens-most-servers-on-planet-earth/ -> primary: TianoCore advisory, URL https://github.com/tianocore/edk2/security/advisories/GHSA-99cj-7hg9-mp4m'
  summary: 'TianoCore''s advisory GHSA-99cj-7hg9-mp4m (2026-10-22), ''Pre-boot RCE in EDK II PXE driver'', describes a memory-corruption flaw (CVE-2026-97631, rated 9.5 out of 10 per Ars Technica) in the PXE Base Code driver NetworkPkg/UefiPxeBcDxe: it copies each received ICMP error message into the fixed 504-byte field Mode.IcmpError of its private context, and the IPv4 and IPv6 handlers (PxeBcIcmpErrorDpcHandle, PxeBcIcmp6ErrorDpcHandle) copy oversized messages anyway and advance the destination by the cumulative rather than the per-fragment length, writing attacker-controlled bytes past the field. An unauthenticated attacker who can deliver a unicast ICMP error message to the booting client''s address, from any network distance, can hang the boot (denial of OS provisioning and recovery) or, if the firmware build is known, plant a counterfeit event and have the DXE core dispatch attacker bytes in ring 0 before the OS loads and before Secure Boot or measured boot has checked anything;
    the exposure window is the duration of the PXE boot. Alex Matrosov (Anthropic) and Dan Holmes-Mitra (Google) found it; Ars Technica reports that the disclosure planned for January was pre-empted when AMI published a public pull request containing the fix, so patch code has been public for weeks, and that AMI, Insyde, Phoenix and Microsoft''s Project Mu fork use the EDK II code, so the flaw reaches most server firmware in Ars''s and SecurityWeek''s reading; both stress that only machines with network boot enabled are exposed, that the attacker must hit a window of seconds and that the payload does not persist by itself. No source reports exploitation, and a search for vendor firmware advisories (Dell, HPE, Lenovo, Supermicro, AMI, Insyde) found none, (a web-search check only, not a read of each vendor''s advisory page), so remediation depends on each hardware vendor''s firmware capsule update.'
