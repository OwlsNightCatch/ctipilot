  extended_notes: |-
    Single vendor primary (Admiralty A for its own bulletin; NCSC-NL list is a curated mirror, not an independent observation) -> classification hint A2. Entry must declare references[] to 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (CVE overlap).
    Exposure (from sources): any AltaLink/EC81xx, VersaLink C/B415, C/B625, C/B620, WorkCentre 3655/EC7836/EC7856 or Fiery FS200-FS800 controller; the bulletin does not say which service carries PHP, so the device web interface (EWS) reachability from untrusted networks is the working assumption, an inference. Version check: device firmware page against the fixes posted from 2026-11-06 (Xerox) and 2026-11-09/16/23 (Fiery).
    Detection concept (inference from the mechanism, no vendor statement): web/management-interface access logs or firewall flow logs showing large multipart POSTs to printer web interfaces from non-management networks; outbound connections initiated by printers/controllers to the internet. Interim hardening: restrict the web interface to management VLANs/ACLs; no vendor mitigation text was published beyond waiting for fixes.
    Triage: benign lookalike = normal admin and driver traffic from print servers; discriminators = source network outside the print-management subnet and request size. No exploitation against Xerox/Fiery is reported by any source.
