- title: 'CVE-2026-112816, Canonical LXD, MicroCloud and Incus: an HTTPS API certificate-chain check lets a client authenticate as any trusted identity with only its public certificate (CVSS 10.0); fixed in LXD 6.10.1, 5.21.9, 5.0.11, 4.0.15, MicroCloud 3.4.1, 2.1.5 and Incus 7.6.0'
