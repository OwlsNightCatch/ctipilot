  summary: 'Delta Controls'' bulletin SecB0015 (published 2026-10-22, revision 3) states that enteliCLOUD and Building Canvas Workspace are patched, that a security patch exists for enteliWEB 4.29 and newer (4.28 and older must upgrade first) and that enteliWEB servers must stay off the public internet even after patching, and that the PHP flaws CVE-2026-109618 and CVE-2026-109619 ''affect all V4 controller firmware''. Firmware 4.21.0.322 for V4 IP-based controllers other than O3 is available, while 4.18.3 LTS (for 4.18 and earlier) and 4.19.1.3 (O3 products only) are listed as pending; SecB0016 revision 2 lists 4.19.1.3 as available for Red5-PLUS and O3-Edge r1.0g+, an inconsistency between the two bulletins that was not resolved. For controllers without an update the bulletin says to disable the embedded HTTPS web server (the HTTPS port via network port object NP8, and for firmware 4.21 and earlier also the out-of-service property), verify the service is no longer reachable and keep IP
    controllers inside trusted local networks. Separately, SecB0016 revision 2 (2026-10-28) covers the Brotli decoder flaw CVE-2026-111497 (CVSS 4.0 9.2): Building Canvas was updated, while Red5-PLUS firmware 4.21 before 4.21.322, 4.19 before 4.19.1.3 and 4.18 and O3-Edge r1.0g+ firmware 4.21 and 4.19 include the affected library; exposure depends on Node-RED, which is disabled by default, and flows that process externally supplied compressed data are the exposed path; 4.18 is pending. Delta says it is not aware of exploitation affecting its products; CISA lists both PHP flaws and the Brotli flaw as exploited.'
