  discovery_trace: 'first seen at: The Hacker News feed, URL https://feeds.feedburner.com/TheHackersNews (item ''CVSS 10.0 LXD, MicroCloud Flaw Lets Attackers Impersonate Trusted Clients Without a Private Key'', 2026-11-01 08:51Z, no store match) -> pivot: article URL https://thehackernews.com/2026/11/critical-lxd-and-microcloud-flaw-cvss.html -> primary: Canonical advisory, URL https://discourse.ubuntu.com/t/security-advisory-critical-vulnerability-found-in-canonical-lxd-and-microcloud/90557 and Incus advisory, URL https://github.com/lxc/incus/security/advisories/GHSA-xg75-xf37-cph9; Ubuntu CVE page URL https://ubuntu.com/security/CVE-2026-112816'
  summary: 'Canonical''s advisory (2026-10-28) and the Incus project''s GitHub advisory (2026-10-29) describe one flaw in the mutual-TLS authentication of the LXD and Incus HTTPS API, tracked as CVE-2026-112816 (CVSS 10.0): the listener requests client certificates without verifying them, so the handshake only proves possession of the private key of the first (leaf) certificate, yet the authentication and ownership checks compared every certificate in the presented chain with the trust store. A client therefore appends a trusted certificate''s public part to its own chain and is accepted as that identity (a client, metrics or server certificate, including a cluster member) without the matching private key, a flaw present since the first release; in MicroCloud an attacker who captures a joining member''s public certificate can authenticate as that member, and the identity can be root-equivalent on the host. The Incus advisory adds that server certificates are returned by every TLS handshake,
    ''so no prior access is needed to obtain one'': appending the server''s own certificate grants access to the database gateway, appending another member''s certificate grants internal cluster access, and the flaw also lets a client renew or delete trust-store entries; The Hacker News describes the precondition more narrowly (a trusted client''s public certificate). The CVE record lists LXD 4.0.14, 5.0.10, 5.21.8 and 6.9 as affected; Canonical''s fixed snaps, released 2026-10-29 and still rolling from the candidate to the stable channel at the time of its advisory, are LXD 6.10.1, 5.21.9, 5.0.11 and 4.0.15 and MicroCloud 3.4.1 and 2.1.5, and Incus fixed it in 7.6.0; Ubuntu archive packages of LXD are not affected or not shipped. A standalone LXD server listens on the network API only if core.https_address is set. No source reports exploitation: the CVE record''s CISA assessment of 2026-10-30 says it is not known to be exploited, it is not on KEV and no exploit is public.'
