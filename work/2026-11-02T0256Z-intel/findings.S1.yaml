  summary: 'Synology''s advisory Synology-SA-26:14 (PHP2Shell, severity critical, status resolved) was revised twice after the covered entry last read it: revision 3 (2026-10-29) adds fixed PHP 7.4 and PHP 8.0 packages for DSM 6.2, 7.0 and 7.1, and revision 4 (2026-10-31) adds fixed Synology Calendar and Mail Station packages for those DSM lines. The advisory now lists, per DSM generation: PHP 7.4 7.4.33-0131 (DSM 7.2 or above), 7.4.33-0122 (DSM 7.0 to 7.1), 7.4.33-0010 (DSM 6.2); PHP 8.0 8.0.30-0122 (DSM 7.2 or above), 8.0.30-0104 (DSM 7.0 to 7.1); Calendar 3.0.4-21435 (DSM 7.2 or above), 2.4.8-10948 (DSM 7.0 to 7.1), 2.4.8-0948 (DSM 6.2); Mail Station 30000002.3.19-20333 (DSM 7.2 or above), 30000002.3.19-10333 (DSM 7.0 to 7.1), 30000002.3.19-0333 (DSM 6.2); PHP 8.1 to 8.4 fixes (8.1.34-0120, 8.2.35-0171, 8.3.36-0051, 8.4.27-0051) apply without a DSM split and PHP 7.3 stays without a fix as end of life. Hyper Backup is now listed as not affected (revision 2 on 2026-10-26 had added it).
