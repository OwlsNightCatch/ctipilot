  summary: "(low confidence) T1567.002 (exfiltration to cloud storage) rests on BSI's 'ggf. direkt Online-Speicher z. B. in der Azure-Cloud' sentence about TerminalFix generally. The entry's own Triage line now says BSI does not confirm the Berlin attack followed that pattern, and no Berlin-specific source names cloud-storage staging. The mapping is supported as a TerminalFix behavior but weakly as a Berlin behavior; keep only if the main agent is content with the heise reading."
