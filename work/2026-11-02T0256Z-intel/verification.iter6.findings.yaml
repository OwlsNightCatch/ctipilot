- code: F11
  category: editorial-advisory
  section: registry
  item: "entities/registry.yaml line 5974, campaign:terminalfix-clickfix-reverse-tunnel-2026 summary"
  url_or_quote: "Germany's BSI (BITS-2026-287419-1032, 2026-09-04) confirms this campaign as the vector behind the Berlin Landesnetz compromise and attributes it to Rhysida's operators, tracked by BSI as Vice Spider — the campaign's first named-actor attribution."
  summary: "Residue from the iteration-5 advisory, unchanged: this run corrected the actor:rhysida summary, the Berlin incident summary and two relation notes, but not this one. BSI's PDF says only 'Kompromittierung des Netzwerks einer staatlichen Institution' (never Berlin) and rbb24 (2026-10-21) says 'bestätigt das BSI dem rbb nicht'; heise reads BSI's Mastodon post as confirmation. Entity pages render registry summaries, so the site still states a BSI confirmation the corrected Berlin entry disowns. Reword to 'heise reads BSI's Mastodon post as confirming ...; BSI told rbb24 it does not confirm the link'. Outside the entry and run-record scope, hence advisory."
