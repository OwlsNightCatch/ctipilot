        attribution: "BBC (syndicated on AOL)"
        source_url: "https://www.aol.com/articles/ukraine-air-raid-app-apparently-222809000.html"
      - quote: "Attention! The mobile application of the Ministry of Emergencies of Russia has been subjected to a massive cyberattack, enabling attackers to send false information to the public"
        attribution: "Fox News, quoting Russia's Emergencies Ministry"
