  - title: "Pentagon treats late-August US military commissary freezer failures as a suspected cyberattack; Nextgov: officials suspect Iran-linked actors (delta on the Danfoss / Copeland refrigeration-controller campaign)"
    sources:
      - { url: "https://www.nextgov.com/cybersecurity/2026/10/officials-suspect-iran-series-cyberattacks-military-base-freezers/416934/", publisher: "Nextgov", date: "2026-10-30", role: "primary" }
      - { url: "https://www.internazionale.it/ultime-notizie-reuters/2026/10/29/exclusive-pentagon-treating-military-base-freezer-malfunctions-as-suspected-cyberattack-officials-say", publisher: "Reuters (republished by Internazionale)", date: "2026-10-29", role: "primary" }
      - { url: "https://www.nextgov.com/cybersecurity/2026/10/pentagon-investigates-suspected-cyberattack-behind-military-freezer-failures/416926/", publisher: "Nextgov", date: "2026-10-29", role: "corroborating" }
      - { url: "https://blog.onyphe.io/en/refrigeration-as-critical-infrastructure-beyond-danfoss-the-exposure-of-copeland-dixell-supervisory-systems/", publisher: "ONYPHE", date: "2026-10-22", role: "context" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13054", publisher: "NCSC Switzerland (Cyber Security Hub)", date: "2026-10-13", role: "context" }
    discovery_trace: "first seen at: dcod-ch (extra Swiss sweep), URL https://dcod.ch/2026/11/01/cybersecurite-14-actualites-majeures-du-1-novembre-2026-dont-binance/ (weekly roundup item 'Les autorités soupçonnent l'Iran ...') → pivot: Nextgov, URL https://www.nextgov.com/cybersecurity/2026/10/officials-suspect-iran-series-cyberattacks-military-base-freezers/416934/ → pivot: Nextgov, URL https://www.nextgov.com/cybersecurity/2026/10/pentagon-investigates-suspected-cyberattack-behind-military-freezer-failures/416926/ → WebSearch (\"Pentagon military commissary freezer cyberattack Iran Reuters October 2026\") → primary: Reuters exclusive, URL https://www.internazionale.it/ultime-notizie-reuters/2026/10/29/exclusive-pentagon-treating-military-base-freezer-malfunctions-as-suspected-cyberattack-officials-say; existing-entry context from NCSC.ch CSH via bridge ncsc-csh recent 30 (post 13054) and ONYPHE blog linked from the Nextgov article"
    summary: |
      Reuters reported on 2026-10-29, citing four officials, that the Pentagon is treating the late-August freezer malfunctions at US military commissaries as a suspected hack. On Reuters' own review of base social-media posts at least six on-base stores were hit; in at least one case the cooling units' temperatures were raised overnight rather than the units stopping (Fort Huachuca said its freezer "went into defrost mode"). A Cyber Command unit and the Army Criminal Investigation Division's Cyber Field Office are investigating, and US investigators are in touch with French counterparts about the October attack that overrode temperature controls at more than 350 French establishments. Reuters could not establish whether Danfoss or any other controller brand was in use at the bases. Nextgov adds on 2026-10-30, citing two people familiar with the matter, that US officials suspect Iran-linked hackers, that the intrusions began around late August, that how the intruders got in is not clear, and that the assessment may change as investigators learn more. No official has attributed the activity on the record and Nextgov gives no evidence class for the suspicion; the common elements with the French case (raised setpoints / forced defrost on internet-reachable refrigeration supervisors) are an inference by the reporters, linked so far only by investigator contact. For Swiss defenders this extends the campaign NCSC Switzerland rated actively exploited on 2026-10-13 from French retail to military logistics and keeps the same exposure question: which refrigeration or supervisory controllers (Danfoss AK-SM / AK-SC, Copeland / Dixell XWEB, Site Supervisor) in the own estate or at suppliers are reachable from the internet. ONYPHE's 2026-10-22 mapping counted roughly 6,200 Danfoss StoreView, 1,960 XWEB EVO, 589 Site Supervisor and 108 XWEB PRO public IP addresses worldwide, with no Swiss figure and no claim that these products were attacked.
    region_nexus: "US and France; Swiss nexus indirect (same controller classes; NCSC.ch CSH 13054 rates the French campaign actively exploited)"
    primary_sector_nexus: "indirect — armed-forces catering/logistics, hospital and school kitchens and cold-chain facilities of Swiss public bodies use the same controller classes; no Swiss incident reported"
    sector: "public-sector"
