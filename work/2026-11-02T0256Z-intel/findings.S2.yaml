        attribution: "Nextgov"
        source_url: "https://www.nextgov.com/cybersecurity/2026/10/officials-suspect-iran-series-cyberattacks-military-base-freezers/416934/"
    extended_notes: |
      Delta only; the existing entry already carries CERT-FR ALE-012, the Copeland end-of-life statement, Forescout's actor naming and ANSSI's Senate testimony. What is new: (1) the effect pattern now reaches US military commissaries (setpoint raised overnight, defrost mode), (2) US investigators are cooperating with French authorities, (3) an anonymous-source Iran suspicion that the entry must carry as a claim, not as attribution. Competing hypothesis the existing entry already holds: hacktivist-style tampering of exposed, weakly protected controllers (Forescout names Z-Pentest Alliance and NoName057(16) among the most active claimants). Detection concept (telemetry class first): refrigeration/BMS controller audit logs and configuration baselines (setpoints, defrost schedules and ranges, alarm thresholds), web access logs of the controller management interface, and firewall/NetFlow records for inbound connections to controller addresses; a legitimate defrost cycle or maintenance change differs from tampering by schedule (defrost outside the configured ranges), by an open service ticket, and by the source address of the configuration change. The hardening lever is unchanged from the CSH post: remove the management interface from the internet or restrict it to a VPN / trusted addresses, and replace end-of-life units that get no fixes. Other Swiss-side signal checked this run: the newest CSH post (13124, 2026-10-30) is not about this campaign, and no BACS card in window mentions it.
  - title: "BSI tells German MPs and federal government members to assume their iPhones are compromised after Apple mercenary-spyware threat notifications since 2026-10-29"
    sources:
      - { url: "https://www.tagesschau.de/inland/innenpolitik/wildberger-hackerangriff-bundestagsabgeordnete-100.html", publisher: "Tagesschau (ARD)", date: "2026-11-01", role: "primary" }
      - { url: "https://www.heise.de/news/BSI-Warnung-vor-Spaehsoftware-auf-Politiker-Handys-11507404.html", publisher: "heise online (with dpa)", date: "2026-11-01", role: "corroborating" }
      - { url: "https://support.apple.com/en-us/102174", publisher: "Apple Support", date: "2026-08-13", role: "context" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 'Apple meldet Kompromittierung von Geräten durch Spyware', 2026-11-01T21:38Z) → pivot: heise article, URL https://www.heise.de/news/BSI-Warnung-vor-Spaehsoftware-auf-Politiker-Handys-11507404.html → pivot: Tagesschau (ARD Hauptstadtstudio report quoting the BSI letter), URL https://www.tagesschau.de/inland/innenpolitik/wildberger-hackerangriff-bundestagsabgeordnete-100.html → context: Apple Support, URL https://support.apple.com/en-us/102174; WebSearch (\"Wildberger Apple Spyware Bundestagsabgeordnete BSI Warnung tagesschau\", \"Apple threat notification mercenary spyware wave 29 October 2026 officials lawmakers notified Germany Bundestag iPhone\") found only relays of the same ARD/Spiegel reporting"
    summary: |
      ARD's Berlin studio reported on 2026-11-01, and Germany's digital minister Karsten Wildberger confirmed on the record in the programme Bericht aus Berlin, that the Federal Office for Information Security (BSI) wrote to Bundestag members and members of the federal government after their iPhones received an Apple threat notification. According to the BSI letter as quoted by ARD, the devices have been receiving since 2026-10-29 a notification that Apple detected an attack with so-called mercenary spyware aimed at compromising the iPhone; the BSI writes that it has no closer information on the concrete trigger and advises recipients to assume as a precaution that the device may be compromised. The notification does not say whether the attack succeeded, which politicians are affected is not public, and neither Apple (which by its own policy does not attribute) nor the minister names an actor or an infection vector; Wildberger called speculation about the cause premature and said he would not necessarily trace it to an AI attack. The BSI lists what such spyware can reach: messages including encrypted messengers, calls, contacts, calendar and location, and microphone and camera. Apple describes its threat notifications as high-confidence alerts of individual targeting that should be taken very seriously, recommends Lockdown Mode and expert help (Access Now Digital Security Helpline), and states that the notification never asks the user to click links or install anything. No Swiss recipients have been reported and BACS has made no statement; the transferable point for Swiss federal, cantonal and communal officials with iPhones is the process: who receives Apple notifications, whether the ICT security organisation learns of them, whether the device is treated as compromised and replaced or forensically examined, and whether Lockdown Mode is enforced for exposed roles.
    region_nexus: "Germany (federal); Switzerland indirect — no Swiss case reported; same population class (officials, diplomats, parliamentarians) and the same Apple notification channel"
    primary_sector_nexus: "indirect — government officials' mobile devices; transferable incident-handling lesson for federal and cantonal ICT security organisations"
    sector: "public-sector"
    cves: []
