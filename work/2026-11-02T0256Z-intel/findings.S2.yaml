    extended_notes: |
      Technique ids are only the capabilities the BSI names for this class of spyware (T1123 audio capture, T1125 video capture); no initial-access vector is disclosed, so nothing is mapped for access. Detection/triage concept for ICT security organisations: the signal is the vendor notification itself (Lock Screen alert, email from Apple Threat Notifications, banner on the Apple Account page after sign-in; the notification never asks for a click), so the control point is process rather than telemetry: collect the notification report from the user out of band, enrol devices of exposed roles in Lockdown Mode, preserve the device for forensic acquisition (mobile EDR/MDM telemetry rarely sees this class) and rotate credentials reachable from it. A benign lookalike is a phishing message imitating Apple security mail; Apple's page says to verify by signing in at account.apple.com, where a real notification is shown at the top. Swiss check this run: no BACS or Federal Council statement on the topic found; WebSearch returned only 2024-2025 Apple waves and relays of the ARD story.
    borderline: true
    borderline_reason: "No Swiss case or Swiss authority statement; relevance rests on the same population class (officials with iPhones) and a transferable handling process. Confirmed on the record by a minister, so credibility is fine; recommend keeping only as a short routine entry or dropping if a Swiss delta does not appear."
  - title: "Ukraine's official air-alert app pushed false radiation, chemical and street-fighting alerts across the country; Russia's emergency ministry says its own app was hit hours later"
    sources:
      - { url: "https://www.aol.com/articles/ukraine-air-raid-app-apparently-222809000.html", publisher: "BBC (syndicated on AOL)", date: "2026-11-01", role: "primary" }
