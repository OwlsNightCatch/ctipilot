    extended_notes: |
      The ATT&CK id T1565 (Data Manipulation) is the closest enterprise mapping for false messages injected into a trusted public alert channel; the sources state no access vector, so no initial-access technique is mapped. Detection concept: authentication and administrative-action logs of the alert-publishing back end and push-notification service, anomalous broadcast scope or content (message types never used operationally, such as radiological or chemical alerts outside an exercise), and a four-eyes or out-of-band confirmation step before nationwide pushes. The Swiss equivalents are Alertswiss, the Polyalert siren network and cell broadcast; no Swiss statement on this event was found, and I did not verify the Federal Council's pending alerting-systems credit (Netzwoche headline of 2026-10-29), so none of its figures are stated here.
