  - title: "Android 'SMS of Death': one hidden WAP Push SMS crashes the telephony process and drops emergency calls; public PoC, Android 12 and 13 stay unpatched"
    sources:
      - { url: "https://smsofdeath.com/", publisher: "Mark Blaszczyk (smsofdeath.com, discloser)", date: "2026-10-29", role: "primary" }
      - { url: "https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97", publisher: "Android Open Source Project (Google commit)", date: "2026-06-15", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/", publisher: "BleepingComputer", date: "2026-10-31", role: "corroborating" }
      - { url: "https://securityaffairs.com/202184/security/sms-of-death-android-under-attack-an-invisible-sms-can-block-calls-and-emergency-services.html", publisher: "Security Affairs", date: "2026-11-01", role: "corroborating" }
      - { url: "https://source.android.com/docs/security/bulletin/2026/2026-10-01", publisher: "Android Security Bulletin October 2026 (Google)", date: "2026-10-05", role: "context" }
    discovery_trace: >-
      first seen at: securityaffairs, URL https://securityaffairs.com/feed (feed subcommand, 2026-11-02) listing
      https://securityaffairs.com/202184/security/sms-of-death-android-under-attack-an-invisible-sms-can-block-calls-and-emergency-services.html
      → primary: researcher write-up, URL https://smsofdeath.com/ → vendor fix: AOSP commit, URL
      https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97
      → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/
      (surfaced in the 2026-11-02 BleepingComputer feed walk) → context: Android Security Bulletin October 2026, URL
      https://source.android.com/docs/security/bulletin/2026/2026-10-01 (WebFetch of the Framework and System tables) →
      WebSearch ("SMS of Death Android WAP Push decodeWapPdu CVE October 2026 security bulletin") found no CVE and no
      Google disclosure page.
    summary: |
      Independent researcher Mark Blaszczyk (GitHub MarkBlah) published on 2026-10-29 a working proof of concept for a
      zero-click, remote denial of service in Android's telephony framework. A single malformed WAP Push data SMS sent to
      port 2948 makes WapPushOverSms.decodeWapPdu() (frameworks/opt/telephony) read the WSP header length as a 64-bit
      uintvar, cast it to a signed 32-bit int with no range check and allocate a negative-sized array; the uncaught
      NegativeArraySizeException kills the com.android.phone process. Each message drops active calls, emergency calls
      included, for one to two seconds, and nothing appears in the inbox or shows the sender. Carrier redelivery and the
      queued poison message, which is retried on every boot, amplify it: the researcher reports about 20 messages leaving a
      device unusable, and a reboot-into-recovery loop roughly every 90 seconds on one Android 12 device that only an
      ADB-based cleanup breaks short of a factory reset. The crash was reproduced on Android 12 through 16 (Pixel 9 and
      Samsung Galaxy / A-series devices). Google's AOSP change "Fix remote DoS in decodeWapPdu" (bug 517376969, authored
      2026-06-15) catches the exception and deletes the poison message; per the researcher it shipped in the October 2026
      Android security release for Android 14 through 17, so Android 12 and 13 devices outside the update window run the
      same code unfixed. BleepingComputer, relaying the researcher, says the fix is not listed in Google's October bulletin
      and cites CVE-2026-58882; that identifier returns no record in MITRE's CVE API or NVD as of 2026-11-02 and the
      researcher names none, so it is unconfirmed. No exploitation in the wild is reported; the PoC app and source are public.
    region_nexus: "global; any country's mobile network. Relevant to Swiss emergency-service and administration Android handset fleets (112/117/118/144 reachability); no source addresses Swiss carriers"
    primary_sector_nexus: "indirect: emergency services (police, fire and rescue, EMS) and administration staff on managed Android phones"
    sector: "public-sector"
    cves: []
    techniques: [T1499.004]
    affected_products: ["Android"]
    entity_keys: []
    new_entities:
      - { key: "tool:sms-of-death-poc", type: tool, name: "SMS of Death PoC", aliases: ["smsofdeath"],
          summary: "Public proof-of-concept Android app and source (MarkBlah/smsofdeath, Apache-2.0) that crafts the malformed WAP Push PDU and sends it as a data SMS to crash com.android.phone on a target phone (Mark Blaszczyk, 2026-10-29)." }
      - { key: "product:google-android", type: product, name: "Android", aliases: ["Android OS", "AOSP"],
          summary: "Google's mobile operating system and its open-source platform (AOSP); telephony framework WapPushOverSms is the vulnerable component here." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The message is delivered as a data SMS and is never shown to the user: there is nothing in the inbox, and the victim never sees the sender's number."
        attribution: "Mark Blaszczyk (smsofdeath.com)"
        source_url: "https://smsofdeath.com/"
      - quote: "Devices updated to the October 2026 patch level or later are protected; devices on earlier patch levels remain vulnerable."
        attribution: "Mark Blaszczyk (smsofdeath.com)"
        source_url: "https://smsofdeath.com/"
      - quote: "RESTRICT AUTOMERGE: Fix remote DoS in decodeWapPdu (b/517376969)"
        attribution: "Android Open Source Project (Google commit)"
        source_url: "https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97"
      - quote: "older Android 12 and 13 devices remain vulnerable because they did not receive the fix"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/"
    extended_notes: |
      Suggested rating B2 (independent researcher with a public PoC, vendor commit consistent with the report, not
      independently reproduced here); priority awareness-level (denial of service, no exploitation reported) but the
      emergency-call angle is the reason it is on the list.
      Exposure: managed Android phones with a security patch level older than 2026-10-01, and every Android 12 / 13 device
      regardless of patch level (the researcher says the October fix covers 14 through 17 only; the researcher reproduced
      Android 12 through 16). The defender reads the device's security patch level as described in Google's 'Check and update
      your Android version' guidance that the bulletin links, or from the MDM/EMM inventory; per the researcher the attack needs
      only the victim's phone number.
      Detection (telemetry classes): device-side logcat or EMM crash reporting showing repeated FATAL EXCEPTION in
      com.android.phone with NegativeArraySizeException from WapPushOverSms.decodeWapPdu, call terminations with
      DisconnectCause CS_DEATH, and repeated telephony-process restarts at boot; the poison rows sit in the pending inbound SMS
      table (content://sms/raw) until deleted. There is no network-side hook in the sources beyond WAP Push data SMS to
      destination port 2948; the sources do not say whether any carrier filters it. No post-patch compromise check applies
      (no persistence beyond the queued message the Google patch deletes).
      Triage: an unexplained telephony crash loop on an unpatched handset can also be an ordinary radio or modem fault; the
      discriminators are the NegativeArraySizeException stack frames in decodeWapPdu and the same crash recurring at every boot
      with a pending WAP Push row. Hardening lever: install the 2026-10-01 or later Android patch level; retire or replace
      Android 12 and 13 handsets used for emergency or on-call duty; keep a second, unaffected channel for emergency calling.
      CVE caveat: BleepingComputer's CVE-2026-58882 is NOT verified (MITRE CVE API: record does not exist; NVD API: no
      result at 2026-11-02T03:10Z) and the October 2026 bulletin's Framework and System tables carry no WAP Push row (nearest
      telephony rows are CVE-2026-55270 (EoP, frameworks/opt/telephony) and CVE-2026-58859 (DoS, Mainline Telephony module,
      Android 17), neither tied to this bug by any source); keep cves empty unless a later source resolves it.
      The researcher's page carries a stale 2024-09-01 metadata date; the disclosure date on the page text is 2026-10-29.
    borderline: false

