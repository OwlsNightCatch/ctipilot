      coverage of VOLTA; pivot to the related Varonis Dolphin X coverage, URL https://www.infosecurity-magazine.com/news/new-dolphin-x-stealer-ai-targets/
      (a different family with an AI victim-ranking feature, context only).
    summary: |
      Cisco Talos reports VOLTA (self-named VOLTA-AUTODOXER), a self-deleting Windows infostealer found through its CAIRN tracking of
      AI-integrated malware, with an optional LLM stage after the usual theft. The stealer collects Chromium and Firefox
      credentials, cookies and cards, Outlook and Thunderbird profiles, Slack, Discord, Telegram, Steam and Roblox sessions,
      Microsoft OAuth tokens, SSH and cloud-provider configuration files and saved Wi-Fi passwords (via WlanGetProfileList), and
      cracks cryptocurrency wallet vaults inline. Much of the token theft relies on bypassing Chrome App-Bound Encryption.
      A live enrichment pass then uses the stolen sessions, for example searching the victim's Gmail for purchase receipts to
      confirm a home address and pulling food-delivery order history, and builds an evidence bundle (location, employer and employer
      domain, inferred birth year, workspaces, document metadata) that it posts to OpenRouter under a system prompt asking for a
      forensic target assessment with a ranked "what they are worth" section and a note on the victim's security hygiene. The default
      model is anthropic/claude-opus-4.6 at temperature 0.2, with a fallback chain through Kimi K2 and Gemini 2.5 Flash if a model
      refuses; it also runs without the LLM stage when no key is present. Output goes into a local report file exfiltrated in an
      archive; configuration is a six-slot template filled at build time, which Talos reads as a builder sold to customers; every
      observed endpoint is third-party infrastructure and there is no actor-owned server. Talos names no victims, sector, region or
      actor, and gives no initial-access vector in the portion read.
    region_nexus: "global; no victimology or region stated"
    primary_sector_nexus: "indirect: employee endpoints; the stealer takes Microsoft OAuth tokens and SSH/cloud keys and profiles the employer, so a stolen-credential path into an organization"
    sector: "cross-sector"
    cves: []
    techniques: [T1555.003, T1539, T1528, T1552.001, T1016.002, T1113, T1114, T1070.004, T1567, T1588.007]
    affected_products: ["Microsoft Windows", "Google Chrome", "OpenRouter API"]
    entity_keys: ["tool:cairn-talos", "malware:closedquorum"]
    new_entities:
