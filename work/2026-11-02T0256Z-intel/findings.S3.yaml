  - title: "CERT-UA warns that Dahua cameras and recorders are taken over through the Easy4IP P2P cloud even when no port is exposed"
    sources:
      - { url: "https://thehackernews.com/2026/10/attackers-hijack-dahua-ip-cameras-in.html", publisher: "The Hacker News (relaying CERT-UA / SSSCIP alert of 2026-10-23)", date: "2026-10-27", role: "primary" }
      - { url: "https://securityaffairs.com/201827/hacking/attackers-take-control-of-dahua-cameras-and-video-recorders-via-easy4ip.html", publisher: "Security Affairs (relaying CERT-UA)", date: "2026-10-27", role: "corroborating" }
      - { url: "https://www.esecurityplanet.com/news/dahua-camera-cloud-access-attacks-emea-ukraine/", publisher: "eSecurity Planet", date: "2026-10-27", role: "corroborating" }
      - { url: "https://hunt.io/blog/operation-cameraswarm-dahua-cameras-compromised", publisher: "Hunt.io (Operation CameraSwarm, background)", date: "2026-08-18", role: "context" }
    discovery_trace: >-
      first seen at: securityaffairs, URL https://securityaffairs.com/feed?paged=3 (lookback sweep of the Security Affairs
      feed back to 2026-10-26) listing https://securityaffairs.com/201827/hacking/attackers-take-control-of-dahua-cameras-and-video-recorders-via-easy4ip.html
      → primary alert named there: CERT-UA/SSSCIP page https://cip.gov.ua/ua/news/khakeri-mozhut-otrimati-kontrol-nad-kamerami-ta-videoreyestratorami-cherez-khmarnii-dostup
      (a JavaScript single-page app: extract returned only the page shell and WebFetch returned an error page, so the alert text was NOT read
      directly) → WebSearch ("CERT-UA Dahua Easy4IP cameras video recorders P2P cloud access unauthorized remote access alert") →
      pivot: The Hacker News, URL https://thehackernews.com/2026/10/attackers-hijack-dahua-ip-cameras-in.html (carries verbatim CERT-UA
      quotes) → pivot: eSecurity Planet, URL https://www.esecurityplanet.com/news/dahua-camera-cloud-access-attacks-emea-ukraine/ →
      context: Hunt.io, URL https://hunt.io/blog/operation-cameraswarm-dahua-cameras-compromised.
    summary: |
      Ukraine's CERT-UA, part of the State Special Communications Service (SSSCIP), issued an alert dated 2026-10-23
      reporting recorded cases of unauthorized access to Dahua IP cameras and video recorders: attackers viewed the video
      stream, changed device configuration and created accounts of their own. The alert names the Easy4IP P2P/cloud remote-access
      feature as the main vector. A device with Easy4IP enabled makes an outbound connection to Dahua's cloud and registers by
      serial number, and access is then established through the cloud, bypassing NAT and firewall with no published port and no
      public address. CERT-UA says the serial numbers follow a predictable structure (a model prefix plus an almost sequential
      hex counter), so they can be enumerated at scale, and that keeping a serial number secret is no protection. Authentication is
      then beaten with weak or known passwords or with the authentication-bypass flaws CVE-2021-33044 and CVE-2021-33045 in
      outdated firmware (both are in CISA's KEV catalogue since 2024-08-21; eSecurity Planet notes their use in these October cases
      is unconfirmed). CERT-UA's compromise indicators are unknown accounts, unauthorized configuration changes (for example text
      overlaid on the video image, whose absence proves nothing) and audit-log DVRIP authentication events from 127.0.0.1, which
      indicates access that arrived through the P2P cloud. The alert does not say who was targeted, how many devices are affected or
      who is behind it. Hunt.io's separate Operation CameraSwarm research (more than 14,500 Dahua cameras compromised by one operator
      between 17 June and 22 July 2026, geolocated compromises concentrated in Ukraine and Russia, about 1,900 of them given a
      persistent backdoor account that survives a password change and on most firmware a factory reset) is context, not a link:
      no source ties the two.
    region_nexus: "alert is Ukrainian; Dahua devices are sold and OEM-rebranded worldwide (no source gives European or Swiss deployment figures)"
    primary_sector_nexus: "direct for operators of CCTV and traffic/surveillance systems in municipalities, police, schools and public buildings"
    sector: "public-sector"
    cves: [CVE-2021-33044, CVE-2021-33045]
    techniques: [T1190, T1110.001, T1136.001, T1125, T1133]
    affected_products: ["Dahua IP cameras", "Dahua NVR/DVR video recorders (Easy4IP P2P remote access)"]
    entity_keys: []
    new_entities:
      - { key: "product:dahua-ip-cameras-and-recorders", type: product, name: "Dahua IP cameras and NVR/DVR recorders", aliases: ["Dahua video surveillance"],
          summary: "Dahua Technology IP cameras and network/digital video recorders; Easy4IP is Dahua's P2P/cloud remote-access feature (CERT-UA alert of 2026-10-23)." }
      - { key: "campaign:dahua-easy4ip-p2p-camera-takeover-2026-10", type: campaign, name: "Dahua Easy4IP P2P camera takeover (October 2026)", aliases: [],
          summary: "CERT-UA alert of 2026-10-23: unauthorized access to Dahua cameras and recorders through the Easy4IP P2P/cloud feature, with account creation and configuration changes; no actor, victim count or date range stated." }
    relation_suggestions:
      - { subject: "campaign:dahua-easy4ip-p2p-camera-takeover-2026-10", object: "product:dahua-ip-cameras-and-recorders",
          basis: "CERT-UA (via The Hacker News, 2026-10-27): the alert reports compromise of Dahua cameras and recorders through Easy4IP" }
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "Cases of compromising IP cameras and DVRs with access to the video stream, changing the device configuration and creating third-party accounts have been recorded"
        attribution: "The Hacker News (quoting CERT-UA/SSSCIP)"
        source_url: "https://thehackernews.com/2026/10/attackers-hijack-dahua-ip-cameras-in.html"
      - quote: "The assumption that the serial number is unknown to anyone is not a reason to consider the device secure"
        attribution: "The Hacker News (quoting CERT-UA)"
        source_url: "https://thehackernews.com/2026/10/attackers-hijack-dahua-ip-cameras-in.html"
      - quote: "from a local address (127.0.0.1), a sign of P2P access"
        attribution: "The Hacker News (CERT-UA indicator)"
        source_url: "https://thehackernews.com/2026/10/attackers-hijack-dahua-ip-cameras-in.html"
      - quote: "CERT-UA warns that devices with Easy4IP enabled may be vulnerable even when they cannot be accessed directly from the internet."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/201827/hacking/attackers-take-control-of-dahua-cameras-and-video-recorders-via-easy4ip.html"
    extended_notes: |
      Single origin: the three press sources all relay the one CERT-UA/SSSCIP alert; the CERT-UA page itself could not be read
      (SPA) so the load-bearing claims rest on The Hacker News and Security Affairs quoting it. Treat as a national-CERT
      single-source item read through relays (suggested rating A for the alert, B for the relays; credibility 2; overall B2).
      Exposure: any Dahua camera, NVR or DVR (and OEM-branded units) with the P2P / Easy4IP / cloud access switch enabled; the
      device need not be reachable from the internet. The defender reads the setting in the device web UI (P2P / Easy4IP) or
      from the recorder's cloud-registration state, and inventories forgotten units, as CERT-UA advises.
      Detection (telemetry classes): device audit logs for DVRIP logins whose source is 127.0.0.1 (the cloud-relay artefact);
      account lists and cloud-linked accounts for entries nobody created; configuration diffs (text overlaid on video, changed
      network or user settings); outbound connections from the camera VLAN to the vendor cloud when P2P is not meant to be in use.
      Hardening (CERT-UA): disable P2P/cloud access where unused; keep cameras off the internet and use a VPN with allow-listed
      sources for remote viewing; remove unknown accounts and unknown linked cloud accounts; update firmware manually and set an
      update routine. Post-patch check: Hunt.io reports on CameraSwarm devices a backdoor account stored independently of the
      admin password that survives a password change and on most firmware a factory reset; that is context from a different
      campaign, but it is the reason to audit accounts after firmware updates rather than assume a clean device.
      Related store entry (older than 14 days, so not in prior_coverage): 2026-07-13/russia-ip-camera-hijacking-nato-military-supply-routes
      (AIVD/MIVD, camera hijack by Russia-linked actors). CERT-UA names no actor here, so do not link the two as attribution.
      Suggested references[]: that entry. Priority awareness-level; relevant to Swiss municipal and police CCTV estates.
      Date note: the Hunt.io page text says its publication was held until 2026-08-18 (the cited date) while its page metadata shows
      2026-10-28; The Hacker News linked it as earlier work on 2026-10-27, so 2026-10-28 is not its first publication.
    borderline: false

