  - title: "Talos documents NIK C2, a Go Windows C2 implant that routes prompts to the OpenAI API through the victim host and falls back to the victim's own OPENAI_API_KEY"
    sources:
      - { url: "https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/", publisher: "Cisco Talos", date: "2026-10-29", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/nik-c2-malware-victims-openai-keys/", publisher: "Infosecurity Magazine", date: "2026-10-29", role: "corroborating" }
    discovery_trace: >-
      first seen at: talos, URL https://blog.talosintelligence.com/rss/ (feed subcommand, lookback 168 h) listing
      https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/ → primary (read in full with extract) → WebSearch
      ("\"NIK C2\" Talos AI-enabled command-and-control framework OpenAI API implant") → corroborating: Infosecurity Magazine, URL
      https://www.infosecurity-magazine.com/news/nik-c2-malware-victims-openai-keys/ (relays Talos; adds no independent telemetry).
    summary: |
      Cisco Talos reports a C2 framework it calls NIK C2, found with a live server, whose 64-bit Windows implant (Go, cross-compiled
      from a Linux build tree named nik_panel) gives operators more than 52 commands: browser, Wi-Fi, Discord and crypto-wallet
      credential theft, keylogging, screen, camera, microphone and clipboard capture, hidden VNC (HVNC), RDP session
      hijacking, an embedded SOCKS5/HTTP proxy and reverse tunnel for lateral movement, AMSI patching, UAC bypass and process
      hollowing. C2 runs over TLS WebSockets on port 443 with an HTTP polling fallback every 250 ms and AES-256-GCM, across three
      prioritised C2 tiers. The novel part is the ai_generate command: the implant builds an OpenAI Chat Completions request on the
      victim host from an operator prompt, API key and model, posts it to api.openai.com from the victim's IP and returns the answer
      to the panel. If the operator supplies no key it reads the OPENAI_API_KEY environment variable, so the victim's OpenAI account
      is billed and the victim's key appears in OpenAI's logs; the default model is gpt-4. The implant masquerades as svchost.exe or
      simvol.exe, copies itself under the user's Roaming\Microsoft\Network folder, persists through Run keys and COM hijacking, and
      has a watchdog process. It also carries a screen-locking ransomware module that encrypts no files: PowerShell backs up the
      MBR to a temp file, a generated HTML lock page is shown through mshta.exe by a looping batch file, and a Run key relaunches it;
      a bootkit-preparation module only checks UEFI versus BIOS and Secure Boot state and stages a placeholder file. Talos assesses
      with moderate confidence that this is a working framework rather than a proof of concept, sees at least three implant versions
      and does not state the initial-access vector, victims, region or any actor. The independent trade coverage relays Talos and
      adds nothing new.
    region_nexus: "global; no victimology or region stated"
    primary_sector_nexus: "indirect: generic Windows endpoint threat; no sector stated"
    sector: "cross-sector"
    cves: []
    techniques: [T1071.001, T1573.001, T1056.001, T1113, T1125, T1123, T1115, T1555.003, T1021.005, T1563.002, T1090, T1055.012, T1685, T1548.002, T1036.005, T1547.001, T1546.015, T1588.007]
    affected_products: ["Microsoft Windows", "OpenAI API"]
    entity_keys: ["tool:cairn-talos"]
    new_entities:
      - { key: "malware:nik-c2", type: malware, name: "NIK C2", aliases: ["nik_panel"],
          summary: "Go-based 64-bit Windows implant and C2 panel with more than 52 commands (credential theft, keylogging, HVNC, RDP hijack, proxying, defence evasion, screen-lock ransomware) and an ai_generate command that sends operator prompts to the OpenAI Chat Completions API from the victim host, falling back to the victim's OPENAI_API_KEY (Cisco Talos, 2026-10-29)." }
    relation_suggestions:
      - { subject: "malware:nik-c2", object: "malware:closedquorum",
          basis: "Cisco Talos groups NIK C2 with its other AI-integrated implant reporting (CLOSEDQUORUM) as AI-enabled adversarial frameworks (Talos, 2026-10-29)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "allowing operators to route arbitrary prompts to the OpenAI Chat Completions API directly through the infected host"
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"
      - quote: "It does not encrypt any files, which means it leaves no forensic trail of file modification timestamps or encryption markers"
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"
      - quote: "The implant command dispatcher module facilitates over 52 commands that are directed by the C2 panel."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/"
    extended_notes: |
      Original research by a telemetry-holding lab (suggested rating B2; credibility rises only if an independent lab reports the
      family). Detection (telemetry classes): process-level network telemetry for outbound HTTPS to api.openai.com from any process
      that is not an approved AI client, above all a binary named svchost.exe or simvol.exe running from a user profile path rather
      than System32; TLS WebSocket plus a 250 ms HTTP poll cadence from a Go binary; process-creation events with parent lineage for
      PowerShell reading \\.\PhysicalDrive0 (the MBR backup), bcdedit /enum with Confirm-SecureBootUEFI, netsh wlan show profile
      key=clear, and mshta.exe opening a lock page from a temp directory; Run-key writes naming a lock-screen batch file; AMSI
      patching in memory (an embedded PowerShell script overwriting AmsiInitFailed in System.Management.Automation.dll); registry writes under
      HKCU\Software\Classes\ms-settings\Shell\Open\command immediately followed by fodhelper.exe and removed within about two seconds
      (UAC bypass); a copy of the binary renamed csrss.exe in the temp directory and the critical-process flag
      (NtSetInformationProcess ProcessBreakOnTermination) that blue-screens the host if the process is killed. Hardening: do not leave long-lived OpenAI (or other LLM) API keys in user or machine environment variables
      on endpoints, and allow-list outbound LLM-API destinations at the proxy per application, which also bounds the billing-abuse
      path Talos describes. Triage: legitimate developer tools do call api.openai.com from user endpoints, so the discriminator is the
      calling process (unsigned or masquerading Go binary in a user path, no AI-client lineage) rather than the destination.
      Post-compromise check: rotate any API key present in the environment of an affected host and review the OpenAI usage and
      billing console for requests the owner did not make. The family has no stated sector or region nexus; ship only if the main
      agent wants the AI-enabled C2 trend carried (suggest folding with the VOLTA item below into one 'AI-integrated implants' entry
      that references the existing CLOSEDQUORUM entry 2026-09-24/closedquorum-llm-orchestrated-c2-implant).
    borderline: true
    borderline_reason: "no victimology, sector or initial-access vector stated; value is the endpoint detection hook for LLM-API egress; recommend folding with the VOLTA item"

