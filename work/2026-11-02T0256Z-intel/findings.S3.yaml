  - title: "ARTEX and agentic offence: Microsoft sees DPRK Onyx Sleet and Pearl Sleet using ARTEX; CrowdStrike documents four unreported actors running Claude Code harnesses"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/", publisher: "CrowdStrike Counter Adversary Operations", date: "2026-10-30", role: "primary" }
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/", publisher: "Microsoft Threat Intelligence", date: "2026-10-29", role: "primary" }
    discovery_trace: >-
      first seen at: crowdstrike, URL https://www.crowdstrike.com/en-us/blog/category.counter-adversary-operations/ (extract of the author-index listing,
      2026-11-02) listing https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/ → primary (extract); the Microsoft
      post was found in the msft-secblog feed walk (feed https://www.microsoft.com/en-us/security/blog/feed/) and in the WebFetch of
      https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ → primary (extract of
      https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/). The full CrowdStrike
      report is gated (https://www.crowdstrike.com/en-us/resources/reports/agentic-ai-attack-campaigns/) and was not read.
    summary: |
      Two vendor reports extend the ARTEX / agentic-offence thread already in the store. Microsoft Threat Intelligence reports that since late
      October 2026 the North Korean actors Onyx Sleet and Pearl Sleet have used the open-source agentic penetration-testing framework ARTEX in
      operations; the same post rates North Korean AI adoption as high overall and says AI-enabled operations stay human-directed (Microsoft
      cites Jade Sleet launching three front-company campaigns in a week, Onyx Sleet generating more than 100 tailored PDF lures in minutes,
      and Coral Sleet building, since April, a workflow that trojanizes private GitHub repositories). CrowdStrike's blog teases a gated report on
      four previously unreported actors who left offensive agent frameworks in open directories: an operator that compromised at least 15
      Argentine healthcare entities with a supervisor/executor pair of Claude Code agents derived from PentestGPT; a Chinese-speaking operator
      with 20+ named targets, among them government entities of two countries, using two harnesses and a China-based AI proxy; an
      Indonesian-speaking actor driving Claude Code with 819 public skills against several Indonesian government domains and a third
      country's domain; and Russian-speaking individuals using a /pentest-setup slash command against a US CRM vendor and private entities.
      CrowdStrike assesses with moderate confidence that agentic AI commoditizes baseline offensive operations and notes agents can reach
      objectives within an hour; the blog gives no technique, telemetry or hardening detail (those sit in the gated report), and Microsoft's
      mitigation section is generic Defender product guidance.
    region_nexus: "global; government entities compromised in Indonesia and other countries per CrowdStrike; no Swiss or European victim stated"
    primary_sector_nexus: "indirect: government domains are among the victims; agentic tradecraft applies to any internet-facing estate"
    sector: "cross-sector"
    cves: []
    techniques: [T1588.007]
    affected_products: ["Claude Code"]
    entity_keys: ["tool:artex", "actor:jade-sleet"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    evidence:
      - quote: "Since late October 2026, Microsoft Threat Intelligence has identified Onyx Sleet and Pearl Sleet leveraging open-source agentic AI penetration testing ARTEX in operations"
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/"
      - quote: "details research into four previously unreported threat actors, each of whom left their offensive agent frameworks exposed via open directories"
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/"
      - quote: "Working at machine speed, agentic AI can autonomously achieve objectives, often within an hour."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/"
    extended_notes: |
      Delta relative to the ARTEX entry (updated through 2026-11-01): (1) DPRK actors Onyx Sleet and Pearl Sleet are a new set of ARTEX
      users per Microsoft (the entry carries Storm-0940, UNC7228, extortion groups, PRC-nexus clusters); (2) CrowdStrike's four actors use
      Claude Code harnesses rather than ARTEX, so the CrowdStrike half is an adjacent finding, not an ARTEX one. Both sources are 2 to 4 days
      old at dispatch (Microsoft 2026-10-29, CrowdStrike 2026-10-30), outside the 26 h window and the Microsoft post outside the 72 h
      developing window. Recommend the main agent ships only the Microsoft sentence as an ARTEX update if it wants the DPRK adoption
      on the thread, and drops the CrowdStrike half unless the gated report is read.
    borderline: true
    borderline_reason: "sources 2-4 days old (outside window), assessment-level, CrowdStrike detail is gated; the only concrete delta is DPRK use of ARTEX per Microsoft"

