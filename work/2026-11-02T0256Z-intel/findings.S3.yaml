          basis: "Cisco Talos: VOLTA 'surfaced through the CAIRN research effort' (Talos, 2026-10-31)" }
      - { subject: "malware:volta-stealer", object: "malware:closedquorum",
          basis: "Cisco Talos compares VOLTA's effort-displacement use of a model to CLOSEDQUORUM, 'though applied to a different phase' (Talos, 2026-10-31)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "VOLTA is a mature stealer implant with an optional AI-integration layer."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/"
      - quote: "All the observed endpoints for this malware are third-party controlled. There is no actor-owned infrastructure."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/"
      - quote: "Much of the token-stealing capability of VOLTA relies on techniques to bypass App-Bound Encryption (ABE) in Chrome."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/"
    extended_notes: |
      Single lab source (suggested rating B2 per Talos's original telemetry, credibility 3 until corroborated); no independent
      report found. Detection (telemetry classes): process-creation events for Chrome launched with --headless by a process that is not
      a known developer tool (Talos's stated hook for the App-Bound Encryption decryption path; an application-control policy on who may
      launch headless Chrome removes it); calls to WlanGetProfileList or netsh wlan profile dumps from a non-network tool; outbound
      HTTPS to openrouter.ai (api/v1/chat/completions) from a user-endpoint process that is not an approved AI client; a self-deleting
      binary that leaves a timestamped harvest log under the user's AppData (Talos names volta_debug.txt and says to preserve it).
      Post-compromise: revoke tokens and sessions (Microsoft OAuth, Slack, Gmail, cloud), rotate SSH and cloud keys found on the host,
      change passwords, and treat plaintext wallet seeds as lost. Triage: browsers legitimately launch headless for testing and
      PDF rendering, so the discriminator is the launching process and account (not a developer toolchain, no CI parent) combined with
      a following burst of access to browser profile databases; outbound LLM-API calls are legitimate from approved AI tools.
      Relevance is the employer-profiling and token/key theft (credentials into the organization), not the crypto angle. Recommend
      folding with the NIK C2 item above into one entry on AI-integrated implants referencing 2026-09-24/closedquorum-llm-orchestrated-c2-implant.
    borderline: true
    borderline_reason: "commodity crimeware with no sector or region nexus stated; worth shipping only for the LLM-API egress and headless-Chrome detection hooks and the OAuth/SSH/cloud-key theft, ideally merged with the NIK C2 item"

