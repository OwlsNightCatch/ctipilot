          summary: "Self-deleting Windows infostealer sold as a builder, with an optional LLM stage that posts a victim evidence bundle to OpenRouter and has the model rank the victim's monetizable assets and assess their security hygiene; found through Cisco Talos's CAIRN tracking (Cisco Talos, 2026-10-31)." }
    relation_suggestions:
