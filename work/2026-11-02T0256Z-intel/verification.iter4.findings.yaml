- code: F3
  category: claim-not-supported
  section: updated-entry/2026-08-30
  item: "Berlin Landesnetz: Triage line (ledger 9563f3e443) and older Update 2026-09-08 section"
  url_or_quote: "Triage: \"BSI's advisory adds, from reporting organizations, that TerminalFix operators may stage exfiltration into attacker-controlled cloud storage, for example Azure, with the provider's own transfer tool\"; Update 2026-09-08: \"reporting organizations told BSI that TerminalFix operators have staged exfiltration into attacker-controlled cloud storage ... such as azcopy\" (https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile)"
  summary: "BSI PDF (re-extracted this iteration with fetch_source pdf): the Azure/azcopy step is one of the eight steps of a sequence introduced by \"Der Ablauf dieser Attacken stellt sich basierend auf dem Microsoft Blog sowie dem BSI bekannten Erkenntnissen wie folgt dar\" and reads \"Der Angreifer richtet ggf. direkt Online-Speicher z. B. in der Azure-Cloud ... azcopy im Falle von Azure\"; \"Beim BSI eingegangene Meldungen\" attaches only to the later, separate sentence on ransomware attempts and double extortion (and to LoremIpsumLoader). Microsoft's blog (read this iteration) does not mention Azure or azcopy, so 'adds a detail' holds, but 'from reporting organizations' is not in the source and the 2026-09-08 section also drops the hedge ('ggf.', if applicable). Fix: say BSI's sequence, built from Microsoft's analysis and findings known to BSI, says attackers may set up cloud storage such as Azure and use the provider's transfer tool; drop 'reporting organizations' in both places."
- code: F3
  category: claim-not-supported
  section: updated-entry/2026-08-30
  item: "Berlin Landesnetz: Update 2026-09-08 section, Mastodon sentence"
  url_or_quote: "\"The same day, BSI posted on its official Mastodon account that it was intensively involved in handling the Berlin incident and separately linked to its detailed TerminalFix security notice; heise reports that juxtaposition as confirmation ... ([heise online, citing BSI, 2026-09-07](https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html))\""
  summary: "(low confidence) The single citation ending the sentence is heise 11444072, which says BSI \"confirmed\" TerminalFix as the vector \"in einem Beitrag bei Mastodon\" and that BSI there links the notice, but never says 'intensively involved' or dates the post. The fact is true: social.bund.de/api/v1/statuses/117212729947889443 (fetched this iteration) has created_at 2026-09-04T12:18:41Z and reads \"Als BSI sind wir intensiv in die Vorfallbearbeitung im Land Berlin eingebunden ... Ausführlicher BSI-IT-Sicherheitshinweis zur TerminalFix-Kampagne\"; the post does not itself name TerminalFix as the Berlin vector. Fix: cite the Mastodon post for the first clause (https://social.bund.de/@bsi/117212729947889443) and keep heise for its reading."
- code: F3
  category: claim-not-supported
  section: new-entry/2026-11-02
  item: "Android SMS of Death: first body paragraph"
  url_or_quote: "\"kills the `com.android.phone` process, which drops active calls, emergency calls included, for one to two seconds per message\" (https://smsofdeath.com/)"
  summary: "(low confidence) smsofdeath.com: \"Calls drop, including emergency calls. Active voice calls terminate with `DisconnectCause CS_DEATH` as the process restarts\" and, as a separate bullet, \"Telephony blackout. 1-2 seconds of no service per message while `com.android.phone` restarts.\" The one-to-two seconds is the no-service blackout, not how long a call is dropped (the call ends). Fix: 'drops active calls, emergency calls included, and leaves the phone without service for one to two seconds per message'."
- code: F4
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-11-02/2026-11-02T0256Z-intel.md, Single-source and Coverage gaps notes (Dahua)"
  url_or_quote: "\"CERT-UA's alert page is script-rendered and unread; its text comes from The Hacker News, Security Affairs and eSecurity Planet\" and \"CERT-UA's alert page (script-rendered, read through quoting press)\""
  summary: "The Dahua entry now cites CERT-UA's own page (https://cip.gov.ua/ua/news/khakeri-mozhut-otrimati-kontrol-nad-kamerami-ta-videoreyestratorami-cherez-khmarnii-dostup) as primary, its sourcing_note says the page was read, and work/<run>/deep/cert-ua.txt holds its full text (read through the reader fallback; the in-container transports return only the SPA shell). The run record's disposition of the page is stale and contradicts the entry. Fix: record that the page was read through the reader fallback, that direct transports return a script shell, and that the primary now rests on it."
- code: F5
  category: missing-citation
  section: new-entry/2026-11-02
  item: "Dahua Easy4IP: Defender takeaway, trailing clause"
  url_or_quote: "\"check the devices CERT-UA calls forgotten, and do not treat a clean password as protection on firmware that predates the 2021 fixes, since those flaws bypass the login.\""
  summary: "(low confidence) The clause follows the closing parenthesis of the CERT-UA and Security Affairs citations and carries none of its own. Security Affairs has the 'forgotten' wording (\"check all Dahua devices on their networks, including those that may have been forgotten\"); the CERT-UA page text read this iteration has no such sentence (it ends with the reporting address), and 'bypass the login' is stated there as \"за яких знання пароля не потрібне\". Fix: cite Security Affairs for the 'forgotten' clause (attribute it as Security Affairs reports CERT-UA advising it) and CERT-UA for the password clause."
