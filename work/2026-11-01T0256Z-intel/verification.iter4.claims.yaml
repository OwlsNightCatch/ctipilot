claims:
  - {claim_id: 0b88626ceb, passage: 'CVE-2026-46300 shortDescription: "This vulnerability can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root."; dateAdded 2026-10-28', source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: ok}
  - {claim_id: ba4b965a94, passage: '"The affected devices run specific versions of Palo Alto Networks PAN-OS." / "rooted 25 PAN-OS firewall and management servers"; Unit 42: "independently verified the same attacker''s tooling and con...', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 6e27592548, passage: 'Updated 2026-10-29 post names PAN-OS; earlier text described an unnamed vendor, so the superseded note is accurate', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 5e2d007b04, passage: '"rooted 25 PAN-OS firewall and management servers across the United States, Japan, Taiwan, and South Korea"; Unit 42 verification sentence as above', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: e185d1ed08, passage: '"PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two critical vulnerabilities that can allow unauthenticated remote code execution."; 10-23: unlikely RCE vector, set session.upload_progress.enabled=0', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: ecd645e617, passage: '"Update to PHP 8.5.12, 8.4.27, 8.3.36 or 8.2.35."; BACS: restart PHP services and long-running processes, rebuild containers, verify running version', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 3dcdf4e309, passage: '10-23 advisory: "Session upload progress must also still be enabled." ... "set session.upload_progress.enabled=0 until the next regular bugfix release"', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: a310932421, passage: '"how an exposed management interface can become a path into an organization''s identity infrastructure"; Palo Alto advisory restricts management access', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 8e69156052, passage: '10-20 notice: "It addresses two critical vulnerabilities, both rated CVSS v4.0 9.2."; 10-21: "All PHP users are strongly encouraged to update immediately."', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 66ae9cbe01, passage: '"out-of-memory handling can interrupt PHP while internal request data is only partially initialized. Request cleanup may then treat the invalid data as valid."', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 35f3424034, passage: '"request-owned internal state can survive after its backing memory has been freed. A later request handled by the same worker may use that stale state" (php.net 10-21-5)', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: ead4c57df5, passage: '"all PHP installations serving web requests, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP and LiteSpeed. We consider the risk highest for mod_php"', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 302ee087a5, passage: '"Session upload progress is enabled by default, and no application call to session_start() is required." Impact: RCE validated against mod_php and FPM', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: 7840f1377b, passage: '"The confirmed impact is unauthenticated heap use-after-free, memory disclosure and remote code execution with the web worker''s privileges."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: c384313734, passage: '"That memory can contain passwords, session tokens, API keys and TLS private keys from other requests."; table lists the upload-progress disclosure under CVE-2026-109618', source_url: 'https://sansec.io/research/php2shell', verdict: ok}
  - {claim_id: 42633244b6, passage: '"the PHP security team provided minimal source-backports for PHP 7.4, PHP 8.0, and PHP 8.1"; "Linux distributions and LTS vendors received the patches in advance"', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 4f936712bd, passage: '"The vulnerabilities affect all web servers running PHP 5.4 or later"', source_url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/', verdict: ok}
  - {claim_id: 786a34f4ab, passage: '"Updating WordPress, your plugins, or your themes does not change the version of PHP your server runs."', source_url: 'https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/', verdict: ok}
  - {claim_id: 6262f98bb8, passage: '"Note: This issue is applicable to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama (virtual and M-Series)."; CPE ranges give 20 vulnerable-below-hotfix trains', source_url: 'https://security.paloaltonetworks.com/CVE-2026-109618', verdict: ok}
  - {claim_id: 6993357403, passage: '"We recommend checking the NCSC-NL GitHub repository for information on third-party software that includes PHP"', source_url: 'https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities', verdict: ok}
  - {claim_id: 1ccdeae8e6, passage: '"CISA has updated this Alert to reflect the addition of CVE-2026-109618 and CVE-2026-109619 to its Known Exploited Vulnerabilities (KEV) Catalog on Oct. 26, 2026."', source_url: 'https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching', verdict: ok}
  - {claim_id: bf076f4666, passage: '"35 complete execution-stage HTTP POSTs with 35 /bin/sh starts directly parented by Apache workers"; PHP 8.4.26 single-worker mod_php; SecurityWeek: "No second-stage payload download was observed."', source_url: 'https://github.com/0x4D31/honeypot-data/blob/main/reports/php2shell/2026-10-24-confirmed-rce.md', verdict: ok}
  - {claim_id: 6194802da2, passage: '"while the vulnerability was leaked before the official release date and we observed attack traffic targeting our customers"', source_url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/', verdict: ok}
