      government and got only crashes and memory exhaustion because session files lay outside the webroot, then gained access with an unrelated server-side bug. Hunt's headline claim, 'php2shell has been used to root internet-facing
      PAN-OS firewalls, the first confirmed production compromises', is attributed to Dream Research and Unit 42's verification, not to Hunt's own telemetry; Hunt adds that an exposed directory hosts a PAN-OS-targeted adaptation
      (two PoC files) and that 'the same directory held aiscan', the LLM-driven scanner Dream describes, with Claude Code also present. Hunt treats honeypot shells (watchTowr 2026-10-21, 0x4D31 2026-10-24, GreyNoise 2026-10-28/29) as the only
      other confirmations and cites Wiz (2026-10-27) and CrowdStrike (2026-10-23) as seeing none.
      Points where Hunt.io conflicts with, or overreaches, Dream Research (read from both pages): (a) Hunt says PAN-OS 'runs one uniform PHP 8.0.30 build across every unpatched box'; Dream's table lists PAN-OS 11.1 on PHP 7.4.33 (lab RCE as nobody, chain not calibrated)
      and 12.1/12.2 on PHP 8.0.30 (one profile calibrated, eight provisional), so the stack is not uniform and only one profile was fully validated. (b) Hunt says the exploit 'reliably roots' PAN-OS; Dream's own funnel is 240 filtered targets
      attempted and 24 rooted, a 10 per cent success rate, with the first government-affiliated firewall crashing, which Dream says was likely from about 900 MB of exploit traffic. (c) Hunt does not say how the PAN-OS directory relates to Dream's artefacts beyond the aiscan sentence; neither source states how Dream obtained its artefacts,
      so identity of the operator behind Hunt's open directory and Dream's operator is an inference, not a stated link. (d) Hunt gives Dream's publication as 2026-10-26; Dream's page carries only the 2026-10-29 update stamp. (e) Hunt reports GreyNoise as 5 shells from one address on 2026-10-28/29; GreyNoise's live tracker now lists 5 attacker addresses and the 2026-10-29 interactive wave (see item 1), so Hunt's account is outdated for GreyNoise.
