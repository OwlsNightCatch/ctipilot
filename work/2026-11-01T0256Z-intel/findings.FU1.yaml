      exhausted PHP memory (HTTP 500 plus an allowed-memory-size fatal error) but failed at the memory-leak stage in every captured run, with no source sending the final stage. One source opened about 400 stalled connections to occupy other Apache workers before sending exploit stages.
      Wiz notes that the kit's leak layout was calculated for one official Docker php:8.4.26-apache image with a 128 MB limit, and says two scanners that failed against its honeypots did successfully exploit Adel Karimi's honeypot, which it calls a likely contributing factor in CISA's KEV decision. Separately, PHP2Shell-branded tools that only used session poisoning plus an application LFI sink were not exploiting the two CVEs. Wiz telemetry records an approximate 67 per cent fall in the daily number of distinct exposed vulnerable machines since 2026-10-21 and a 47.9 per cent fall in significantly affected organisations.
      Wiz (2026-10-27) predates GreyNoise's 2026-10-28 first successful exploitation, so its 'none have succeeded' is a point-in-time statement for Wiz telemetry only.
