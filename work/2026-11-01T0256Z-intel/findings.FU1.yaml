    summary: |
      Hunt.io's AttackCapture open-directory data, read against public exploitation reporting up to 2026-10-30, finds 616 PHP2Shell-related files across exposed directories: cloned public PoCs, scanners,
      post-exploitation staging and one exploit-development tree (about 4,768 files, last updated 2026-10-28) whose logs reach the address-leak step. A shared ASLR-bypass kit is byte-identical across four hosts
      captured 2026-10-22 to 2026-10-27, with the operators' logs showing a shell as www-data on PHP 8.2.34 and 8.4.26 in a lab; Hunt says this shared kit has not been seen landing on a live victim. Another
      operator carries a hand-written heap exploit with hardcoded offsets for one PHP 8.4.26 Apache build and a utmp/wtmp log cleaner (suggesting interactive shells are expected). Staged target lists name a government finance ministry,
