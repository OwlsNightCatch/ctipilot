    angle: 1
    novelty: "update-of:2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619"
    material_development: >
      YES. No entry in the store cites GreyNoise on PHP2Shell (grep of entries/ and prior_coverage.json: zero hits).
      The target entry's exploitation paragraphs end at "no source tied a named CVE to a production compromise" and rest on
      the single Karimi honeypot report (35 shells, 2026-10-24), watchTowr, VulnCheck, Cloudflare and AWS-via-Inside-IT attempts.
      GreyNoise adds (a) a second, continuously running sensor dataset with confirmed code execution after the CISA KEV listing
      (first on 2026-10-28), (b) the first source in the store that shows what an attacker does after code execution as the web
      worker account on an ordinary Apache/PHP host (the Dream/Unit 42 PAN-OS chain is a different, appliance-specific path),
      and (c) evidence of at least three distinct operator waves (2026-10-28 canary-style validation; 2026-10-29 19:55 UTC and
      2026-10-31 00:22 UTC interactive intrusions). Secondary candidate: the PAN-OS entry is NOT affected (GreyNoise sensors are ordinary Apache hosts).
    sources:
      - { url: "https://php.events.greynoise.io/", publisher: "GreyNoise (PHP2SHELL Activity 2026, live tracker)", date: "2026-11-01", role: "primary" }
    page_date_note: >
      Live, self-refreshing page. Raw HTML shows "Last updated 01 November 2026, 03:48 UTC" (fetched 2026-11-01 ~04:00 UTC);
