      tools/fetch_source.py url --direct (raw HTML, for panel text and absolute timestamps the extract drops).
    summary: |
      GreyNoise publishes a live tracker for CVE-2026-109618 and CVE-2026-109619 built from its own deliberately vulnerable sensors. At the snapshot
      (updated 2026-11-01 03:48 UTC) it reports 509 tracked IPs, 245,049 sessions since 2026-10-21 (213,331 classed as exploitation attempts, 31,718
      as reconnaissance; benign sources excluded) and "1,177 confirmed successful exploitations" from 5 attacker IPs, defining a confirmed
      exploitation as a session in which the web server ran operating-system commands. Its own timeline: CVE IDs reserved 2026-10-12 21:03:58 UTC;
      earliest related activity 2026-10-21 08:36:46 UTC (a scanner, 5 h 12 min before CVE.org publication at 13:48:34 UTC); CISA KEV 2026-10-26; first
      successful exploitation on its sensors 2026-10-28 05:14:01 UTC, when the Apache worker spawned sh, which ran a curl to an integer-encoded
      address (the sender's own) and then sleep 5. Reading the 1,177-row table (our analysis, not a GreyNoise statement): the headline counts shell-process
      events, not 1,177 compromised hosts. Only 13 rows are a direct child of the web worker (apache2 to sh, apache2 or setsid); the other 1,164 are
      commands run by those shells (sh, bash, timeout children) and logins through an SSH daemon the attacker installed on the sensor.
      Three waves are visible. Wave 1 (2026-10-28 to 10-31, one address, 7 sessions of 6 GET and 2-3 multipart POST, 3.6 to 6.2 MB each, to the site root and an upload endpoint)
      is validation only: curl to a bare integer-encoded IP and port, then sleep 5. Wave 2 (exploit sessions 2026-10-29 19:55 to 20:00 UTC, one address, 186 attributed events, 188 table rows that day, plus a return visit at 2026-10-30 02:24 UTC that repeats the .ssh setup and beacon)
      is an interactive intrusion: repeated bash reverse shells over /dev/tcp started with setsid, a beacon script run with nohup from /tmp and a sleep 60 retry loop,
      creation of /var/www/.ssh and chmod 600 on authorized_keys, write tests in /var/www and a chmod on the web root, host fingerprinting (id, uname, os-release,
      CPU, memory, disk, DMI virtualisation files), account files and sudoers reads, cron directory and setuid file searches, a look at /root/.ssh and /home/*/.ssh
      including ssh config, a docker.sock check, queries to the link-local cloud metadata address (86 events), linPEAS and gitleaks downloaded from GitHub into a hidden
      /tmp directory and run over /var/www/html, /usr/local/etc and /etc, and a PHP CLI loot script written to /tmp, run and deleted. Wave 3 (exploit sessions 2026-10-31 00:22 to 01:36 UTC, three addresses; 980 table rows on 2026-10-31, of which 364 attributed to exploit sessions and 616 unattributed because they arrive through the installed SSH daemon) repeats the reverse shell guarded by a /tmp marker file so it fires once, then stages a Dropbear SSH server fetched from an
      attacker HTTP file server into a hidden directory under /var/log/apache2, with a watchdog script that restarts it every 30 s, and returns through that
      sshd to run more recon (apache2 and php.ini checks incl. upload_tmp_dir and auto_prepend_file, cron, a write probe in the web root, secret scanning). The reverse-shell target of wave 2
      is the address that sends the exploit and serves the toolkit in wave 3 (mechanical observation; GreyNoise's attribution column groups them). No recorded command touches a kernel
      exploit or the PAM files; the log shows enumeration, not privilege escalation. The page does not state the uid; /var/www/.ssh and a getent lookup of www-data imply the web worker account (our inference).
      Caveat that matters for the entry: these are sensors, not victims. GreyNoise's tracker is the only sensor-side dataset after Karimi's; the three waves show that interactive intrusions
      of exposed PHP hosts are happening against a default-style Apache/PHP stack, in contrast to Wiz, CrowdStrike and Sophos reporting no success.
