    source_url: https://www.bleepingcomputer.com/news/security/northflank-security-breach-leads-to-abuse-of-customers-ai-api-keys/
  - quote: All public reports highlight targeted exploitation, explicitly hunting stored environment variables, with a focus on those granting AI access.
    attribution: Wiz Research
    source_url: https://www.wiz.io/blog/black-october-for-ai-developer-platforms
  extended_notes: 'Hardening levers named by the sources: revoke credentials at the issuing provider and regenerate (not only rotate inside the platform), review provider usage and billing logs for unexpected calls, disable public exposure of add-ons, enable platform audit logs. Wiz''s Case B shows that a key whose policy restricted Bedrock to us.* cross-region inference profiles limited the abuse to throttled calls compared with a key allowing global.* profiles; this is Wiz''s observation about two keys, not a vendor guarantee.'
