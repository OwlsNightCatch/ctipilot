  summary: On 2026-10-29 an attacker moved about USD 6.36 billion out of Binance wallets on ten blockchains, most of it within about 20 minutes from 20:05 UTC, the largest recorded crypto theft (TRM Labs, about four times the Bybit loss of February 2025). Binance co-CEO Richard Teng, as relayed by BleepingComputer and SRF, says the intrusion began with a DevOps engineer's compromised laptop, that the access let the attackers submit unauthorised withdrawal transactions after they reached a service container, that it was not a one-click action and that Binance has found no evidence of a leaked wallet private key; SRF adds that Teng said the attackers used malware to cover their traces. TRM Labs attributes the theft to TraderTraitor, the North Korean unit, with high confidence, on on-chain and off-chain intelligence; its on-chain reading is an EIP-7702 delegation that turned an Ethereum hot wallet into an attacker-controlled sweeper with 50 pre-signed authorizations prepared in advance, and ordinary signed transfers on the other nine chains, which TRM assesses points to a compromise of Binance's hot-wallet signing infrastructure. Binance itself has attributed responsibility to no individual or group. Stablecoin issuers froze about USD 2.7 billion; the attacker still holds about USD 2.4 billion, and on 2026-10-31 Binance said it had covered 90 percent of the loss from company funds and its SAFU fund and would resume withdrawals on Sunday 2026-11-01.
