  extended_notes: 'Composer hints (only what the sources support).

    Exposure: users of Vaud''s post-compulsory school IT-support platform (about 3,500 teachers, 38,000 students, school email addresses). The platform is unnamed; nothing is said about other cantons. Inference (mine, flag as such): a helpdesk with free-text requests holds whatever users typed into tickets, and the canton itself says the request content was copied.

    Detection (telemetry class first): for recipients, inbound mail-flow logs at school mail gateways for messages impersonating the school or IT support to the affected school addresses (the canton''s stated main risk); for owners of comparable support or ticketing platforms, application and authentication logs for bulk reads or exports of ticket records and for population accounts (students) holding elevated roles. The second clause rests on a cyber-expert''s general comment quoted by RTS (Lennig Pedron: an internal user with undue privileges or an access-governance flaw), not on any finding about this case.

    Triage: no honest benign-lookalike discriminator is supported; omit.

    Defender takeaway: treat helpdesk/ticketing platforms as personal-data repositories whose roles must be reviewed for population accounts; the canton''s communication pattern (immediate disconnect, SOC support, BACS and data-protection notification, direct user warning about impersonation phishing) is the reference.

    Dates: communiqué dated 2026-10-31 (Saturday); detection 2026-10-26 (Monday). 24heures (2026-10-31, headline ''un élève serait à l''origine de la fuite de données'') carries the student angle but its body could not be read (jina fallback returned page chrome; WebFetch ''too many redirects''), so it is not cited.'
