  summary: Northflank, a cloud application hosting platform, disclosed a security incident on 2026-10-30 after Wiz raised a threat alert at 11:43 UTC; its status page tells customers to assume all environment variables have been decrypted and to disable and rotate all keys, including secrets in workloads, secret groups and global secrets, and to disable public access to add-ons. It later confirmed that users reported unauthorised use of AI API keys supplied to the platform, enabled audit logs for all customers including free accounts, and shipped secret rotation for PostgreSQL, MongoDB, MySQL, Redis, RabbitMQ and MinIO add-ons; the status page lists networking, services, add-ons, jobs and builds as in major outage. Northflank has not disclosed how the attackers got in, how many customers are affected, or whether credentials other than AI keys were abused. Wiz, which holds the telemetry, describes incidents at Fireworks, OpenCode, Warp, Zeabur, Lightning, Railway and others in October (BleepingComputer counts at least nine in the report), states that all public reports highlight targeted exploitation explicitly hunting stored environment variables with a focus on AI-access credentials, and links the pattern to agentic attacks and the LLMjacking resale market; Wiz observed stolen cloud keys tested within 30 minutes of the vendor-side access and then abused at scale, and it assesses that no single vulnerability or dependency links the attacks.
  region_nexus: global; no Swiss or public-sector nexus stated by any source
