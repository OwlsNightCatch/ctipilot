  summary: On 2026-10-31 the Canton of Vaud announced that on 2026-10-26 its Direction générale de l'enseignement postobligatoire detected unauthorised access to the platform through which teachers and students of the cantonal post-compulsory schools (gymnases, écoles professionnelles) file IT-support requests. The names, first names and school email addresses of about 3,500 teachers and 38,000 students were copied, together with the content of support requests; the canton states that account passwords are not stored on the platform and that school data such as grades and pupil files is not affected. The platform was disconnected from the internet and secured with the cantonal Security Operations Centre; the Federal Cybersecurity Office (BACS) and Vaud's data-protection authority were notified and a criminal complaint is announced. The canton names targeted fraudulent messages impersonating the school or IT support as the main risk. No source gives the intrusion method, the platform product or the time between access and detection. RTS reports that, according to the latest information from the State of Vaud, everything points to a student as the culprit, with context, motive and goals unknown; the department's deputy director general told Keystone-ATS that many elements point to an internal case, while Vaud's cantonal police, contacted by Keystone-ATS, did not confirm and promised details in the coming days. The insider angle is therefore a preliminary departmental statement relayed by the press, not a police finding; the facts about scope and data types are the canton's own.
