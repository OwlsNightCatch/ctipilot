  summary: Chainalysis, whose blockchain-analytics platform BleepingComputer says is used by law enforcement, government agencies, exchanges and financial institutions, published a security incident notice on 2026-10-30 together with the text of its customer email. The company says that this month it detected an external actor using 'offensive agentic techniques' to gain unauthorized access to its systems and internal tools, and that it has been patching vulnerabilities and hardening. Accessed were user IDs, full names, email addresses and organisation role labels of users provisioned on the platform; Chainalysis says it found no indication of access to investigation content (graphs, notes, cases), transaction or query results, clear-text passwords, MFA secrets or session tokens, and that a per-organisation breakdown will follow. It advises customers to enable two-factor authentication and to be wary of unexpected password-reset requests or authentication prompts, and BleepingComputer adds impersonation lures offering fund recovery or recruiting. No source says which vulnerabilities, internal tools or time span were involved; whether the actor used an existing agent framework or custom agents is BleepingComputer's open question, not a finding. Chainalysis states the incident is unrelated to the Binance theft. The relevance to this constituency is the exposure of staff identities and roles at police and government customers (targeting and impersonation risk); no source names a Swiss customer.
