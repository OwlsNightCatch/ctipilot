    evidence:
      - quote: "Le 26 octobre 2026, la Direction générale de l’enseignement postobligatoire a détecté un accès non autorisé à la plateforme qui permet aux enseignantes, aux enseignants et aux élèves d’adresser leurs demandes d’assistance au support informatique."
