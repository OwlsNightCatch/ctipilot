    discovery_trace: "first seen at: Swiss daily-press section sweep via bridge `url --direct`, URL https://www.srf.ch/news/schweiz (headline 'Cyberangriff im Kanton Waadt: Hacker stehlen Daten von über 40'000 Schülern und Lehrkräften'; the same story sat on URL https://www.letemps.ch/cyber and URL https://www.watson.ch/digital in the same sweep) → pivot: SRF article, URL https://www.srf.ch/news/schweiz/cyberangriff-im-kanton-waadt-hacker-stehlen-daten-von-ueber-40-000-schuelern-und-lehrkraeften (its 'Pressemitteilung des Kanton Waadt (frz.)' link in the raw HTML) → primary: Etat de Vaud press release PDF, URL https://www.vd.ch/typo3temp/assets/pdfs/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees.pdf, and its HTML detail page found through the canton press listing URL https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud → corroboration (relays, no new first-hand fact): Le Temps/ATS URL https://www.letemps.ch/suisse/vaud/les-gymnases-et-ecoles-professionnelles-vaudois-ont-ete-cyberattaques and watson/sda URL https://www.watson.ch/schweiz/digital/280583908-cyberkriminelle-greifen-in-der-waadt-schulen-an"
    summary: |
      On Saturday 2026-10-31 the canton of Vaud's press office disclosed that an unauthorised person accessed the IT-support platform used by the cantonal post-compulsory schools (the gymnases and the écoles professionnelles), the portal through which teachers and pupils send support requests to school IT support. The Direction générale de l'enseignement postobligatoire (DGEP) detected the access on Monday 2026-10-26, took the platform off the internet at once (it is no longer reachable) and secured it with the help of the canton's Centre opérationnel de sécurité. The canton states that the copied data are the surnames, first names and school e-mail addresses of about 3,500 teachers and 38,000 pupils together with the content of the support requests; account passwords are not stored on the platform, and no school records such as grades or pupil files are involved. The incident has been reported to the Federal Office for Cybersecurity (BACS) and to the cantonal data-protection authority, and a criminal complaint is to be filed. The canton names targeted fraudulent messages that pose as the school or as IT support as the main risk for those affected and says users have received direct guidance; investigations continue. The release does not name the attack vector, the platform product, the actor, how long the intruder had access, or whether the data is being offered, used for extortion or already abused.
    region_nexus: "Switzerland, canton Vaud (direct)"
    primary_sector_nexus: "direct: cantonal public sector, post-compulsory education administration (~41,500 data subjects, mostly minors and school staff)"
    sector: "public-sector (education)"
    cves: []
    # T1213 maps the one behaviour the source states (data and support-request contents copied out of an internal information repository, the support platform).
