      - quote: "Les noms, prénoms et adresses électroniques scolaires d’environ 3500 enseignants et 38'000 élèves ont été copiés, ainsi que le contenu de demandes d’assistance."
        translation_en: "The surnames, first names and school e-mail addresses of about 3,500 teachers and 38,000 pupils were copied, as well as the content of support requests."
        attribution: "Etat de Vaud (press release)"
        source_url: "https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud/detail/communique/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees"
      - quote: "Les mots de passe des comptes ne sont pas enregistrés sur cette plateforme."
        translation_en: "Account passwords are not stored on this platform."
        attribution: "Etat de Vaud (press release)"
        source_url: "https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud/detail/communique/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees"
      - quote: "L’incident a été annoncé à l’Office fédéral de la cybersécurité et à l’Autorité de protection des données et de droit à l’information. Une plainte pénale va être déposée."
        translation_en: "The incident was reported to the Federal Office for Cybersecurity and to the data-protection and freedom-of-information authority. A criminal complaint will be filed."
        attribution: "Etat de Vaud (press release)"
        source_url: "https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud/detail/communique/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees"
