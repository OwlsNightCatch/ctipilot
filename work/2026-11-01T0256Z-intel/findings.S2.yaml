        attribution: "Etat de Vaud (press release)"
        source_url: "https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud/detail/communique/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees"
    extended_notes: |
      FACTS (canton's own statements): detection 2026-10-26 by the DGEP; platform disconnected from the internet immediately and still inaccessible; secured with the Vaud Centre opérationnel de sécurité; copied data = surnames, first names, school e-mail addresses (about 3,500 teachers, 38,000 pupils) plus support-request contents; passwords not on the platform; no grades or pupil files; BACS and the cantonal data-protection authority notified; criminal complaint to be filed; direct guidance sent to users; investigations continue. The release is dated 2026-10-31, five days after detection.
      NOT STATED anywhere (do not infer): attack vector, product behind the platform, actor, dwell time, whether data is posted, sold or used for extortion. No source ties this incident to the PHP2Shell wave although detection fell in the week after the PHP patch of 2026-10-21; leave that out of the entry.
      Defender angle (what transfers): a helpdesk or ticketing platform is an identity directory (name plus school e-mail) and a free-text store (the ticket bodies) in one place; the canton itself names lures that impersonate the school or IT support as the principal harm. Exposure for other public bodies: any cantonal, communal or school helpdesk platform that is reachable from the internet and keeps ticket history; the check is what the tickets contain, who can reach the platform, and whether it is inside the cantonal SOC's monitoring. Telemetry class for recipients: mail-flow logs for messages that use the display name or branding of school or IT support from an external sender, with links to credential-capture pages, referencing real ticket content.
      INFERENCE (mine, not a source statement): because the platform has been offline since 2026-10-26, a message that presents itself as a notification from that ticket system after that date, or that quotes a real earlier ticket but comes from a sender outside the platform's normal sending identity, is more likely the fraud the canton warns about than a genuine notification; the canton does not say whether genuine notifications have stopped.
      Suggested handling: incident entry, kind incident, priority notable or routine (cantonal body, ~41,500 data subjects, no sensitive categories per the canton, no actor claim). actions[] empty is correct: no mechanism-derived do-now task is supported by the sources.
