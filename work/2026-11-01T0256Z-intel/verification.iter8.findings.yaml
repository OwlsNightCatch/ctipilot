- code: F4
  category: hallucinated-fact
  section: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release (body, third paragraph)
  item: "Threat Prevention coverage clause restored after iteration 7"
  url_or_quote: "body: \"its Threat Prevention coverage (Threat IDs 543004, 97622 to 97625 and 97643 to 97678) applies only where inbound management traffic is decrypted ...\" vs https://security.paloaltonetworks.com/json/CVE-2026-109618 workarounds (read this iteration): \"enabling Threat ID 543004, 97622, 97623, 97624, 97625, 97643, 97647, 97649, 97652, 97653, 97656, 97657, 97658, 97659, 97662, 97663, 97664, 97670, 97671, 97672, 97673, 97674, 97676, 97677, 97678\""
  summary: "97622 to 97625 is contiguous, but 97643 to 97678 is not: the advisory lists twenty specific IDs inside that span (97643, 97647, 97649, 97652, 97653, 97656 to 97659, 97662 to 97664, 97670 to 97674, 97676 to 97678), so the range notation asserts coverage of sixteen IDs the advisory does not list. The entry's own 2026-10-24 section says it correctly (\"twenty further Threat IDs, from 97643 to 97678\"). Say \"97622 to 97625 and twenty further IDs between 97643 and 97678\" or list them as the advisory does."
- code: F3
  category: claim-not-supported
  section: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates (body, Defender takeaway)
  item: "(low confidence) A Java runtime already updated on 2026-10-21 needs the update of 2026-10-24 as well"
  url_or_quote: "\"A Java runtime already updated on 2026-10-21 needs the update of 2026-10-24 as well ([OpenJDK, 2026-10-24](https://openjdk.org/emudhra))\" vs https://openjdk.org/emudhra: \"take one of the following actions immediately — even if you have updated your runtime in the past few days.\""
  summary: "(low confidence) The cited page is dated 2026-10-24 and says only 'in the past few days'; the date 2026-10-21 of the earlier update is carried by Oracle's alert of 2026-10-21 and OpenJDK's advisory 2026/10/21, not by the cited page, and the 2026-10-24 update is the advisory 2026/10/24 and Oracle's second alert. The inference is sound but the citation does not carry it; cite the two OpenJDK advisories or Oracle's two alerts on this clause."
- code: F9
  category: surface-contradiction
  section: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (body, third paragraph vs Update 2026-11-01)
  item: "(low confidence) 'first documented code execution' against Hunt.io's account of watchTowr"
  url_or_quote: "body: \"The first documented code execution is a honeypot report by Adel Karimi of Perplexity dated 2026-10-24\" and \"watchTowr's honeypots recorded exploitation on 2026-10-21\" vs Update 2026-11-01 (Hunt.io): \"shells have been confirmed only on honeypots and sensors, which it names as watchTowr, 0x4D31 and GreyNoise\"; Hunt.io page: \"watchTowr reported exploitation of both CVEs on its Attacker Eye honeypots on 2026-10-21, the earliest of the three, alongside the shells 0x4D31 and GreyNoise logged\"; SecurityWeek (2026-10-26): \"security firms had not confirmed any successful code execution\"; watchTowr's own page says only \"Exploitation has been observed in the wild since October 21, 2026\""
  summary: "(low confidence) SecurityWeek supports 'first' as of 2026-10-26, but Hunt.io, which the entry now cites, counts watchTowr among the networks that confirmed shells, with activity from 2026-10-21, and watchTowr's own wording does not say whether code ran. The entry states both and does not say they disagree. Add a Contradiction clause or reword to 'first publicly documented with packet and process evidence'."
