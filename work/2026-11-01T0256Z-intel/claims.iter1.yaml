    text: "Apply Cisco's remediation for the products its eMudhra advisory (version 1.5) lists as impacted: the guidance for Secure Firewall ASA, FTD and FMC, Secure Email Gateway and Secure Email and Web Manager (run the updatenow command where updates are manual), Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1 and ThousandEyes Enterprise Agent (Application-hosting Agent 5.2.2) now, and ISE and ISE-PIC (3.5P5 in December 2026, 3.3P13 and 3.4P8 in April 2027), Meraki MV Smart Camera Firmware (2026-11-18) and IOS XR 26.4.1 (2026-11-30) when they ship; IOS XE, MDS 9000 and Nexus are still listed under investigation."
