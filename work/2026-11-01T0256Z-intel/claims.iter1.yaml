    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "**Detection:** AWS, as relayed by Inside IT, advises an operator who cannot exclude a compromise to start the investigation at least from 2026-10-17, the date of its earliest honeypot exploit attempt ("
