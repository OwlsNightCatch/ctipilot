  - claim_id: 089e6aa2f4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "headline"
    kind: frontmatter
    text: "PAN-OS management interfaces were rooted in the wild via PHP2Shell and a kernel flaw: hotfix, then check for compromise"
  - claim_id: 54ba325ab4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21 says active exploitation has been observed against PAN-OS management interfaces exposed to the internet, and Dream Research, with Unit 42's verification, reports a custom PHP2Shell build chained with a Linux kernel flaw that rooted 25 PAN-OS firewall and management servers in the United States, Japan, Taiwan and South Korea and went on to attack a US government-affiliated Active Directory. The advisory lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama as affected through the management web interface by CVE-2026-109618 and CVE-2026-109619 (CVSS-B 9.2); all twenty hotfixes are released, and GlobalProtect and the captive portal are not affected. A device that was exposed and unpatched needs a compromise check as well as the hotfix, and CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
  - claim_id: ae47c44e6d
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[0]"
    kind: frontmatter
    text: "Take the management interface of every PA-Series and VM-Series firewall and Panorama off the internet now by restricting it to a jump box or trusted internal addresses, because Palo Alto reports active exploitation against internet-exposed management interfaces, and install the hotfix for your maintenance release, which Palo Alto's table lists for every line from 10.2.7 to 12.2.4 (11.2.10-h17 adds the Brotli fix)."
  - claim_id: b6408d00a7
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[1]"
    kind: frontmatter
    text: "On every PAN-OS firewall and Panorama whose management interface was reachable from the internet while unpatched, look for a PHP file nobody deployed in a web-reachable directory of the management web server, a systemd service or rc.local entry that starts scripts from a hidden directory under /usr/local/lib and outbound SSH from the management plane; where one turns up, treat the device as rooted and rotate the directory bind account, HA replication keys, certificate private keys and device authentication keys it held, because the hotfix does not remove a web shell or tunnel already in place."
