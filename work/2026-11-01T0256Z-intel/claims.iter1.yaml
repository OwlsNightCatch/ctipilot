    kind: cited
    text: "**Exposure:** every internet-facing server or container image that runs PHP, and every product, appliance or administration interface that embeds it, internal ones included; BACS stresses that operators often do not know a product uses PHP, and that distribution packages can carry the fix under an unchanged version number, so the running version and the vendor's security information decide ("
