    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "headline"
    kind: frontmatter
    text: "Microsoft: Storm-0940 runs ARTEX at machine speed; Mandiant now sees agent frameworks in incident-response cases"
  - claim_id: c76eff5732
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases; Expel saw the same infrastructure create its own accounts through Okta self-service registration. Google Threat Intelligence Group and Mandiant report on 2026-10-31 that since late August they have seen ARTEX, PentAGI and CAIRN operated in incident-response cases by extortion groups and suspected PRC-nexus clusters, with government among the affected sectors in the United States, and that the original ARTEX repository was taken down in October while forks keep it in circulation. CrowdStrike and Recorded Future document another actor using the framework, and Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, with the same framework according to BleepingComputer."
  - claim_id: a9f4cfa2e0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "Google Threat Intelligence Group (GTIG) and Mandiant report that since late August 2026 they have seen threat actors operate ARTEX, PentAGI, CAIRN and possibly custom harnesses inside Mandiant incident-response engagements, with agents carrying out significant parts of the attack lifecycle such as lateral movement, database exploitation and exfiltration preparation ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 0723ddc06c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "They say ARTEX has been adopted since late August by financially motivated extortion groups and suspected PRC-nexus clusters, whose operations affected organizations in government, technology, chemicals and materials, and manufacturing in the United States, and that the campaign Wiz tracks, which GTIG tracks as UNC7228, overlaps with Microsoft's Storm-0940 and dates back to at least August 2026 ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 60eb0192b0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "The original ARTEX repository was taken down by its creator in October because of abuse, but community forks, among them a commercial one, keep the framework in circulation ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 400256e45e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: cited
    text: "GTIG's log signature for the agent is execution in bursts of roughly 2 to 25 seconds, error-driven retries and forensically noisy trial and error; in one case, given valid credentials, the framework used an application's SQL API to point the MySQL general log at a web-accessible .jsp path and then ran SELECT statements carrying script tags, which wrote web shells under incrementing file names ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks"]
  - claim_id: 83ea767f1f
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-01T03:29:45Z"
    kind: uncited
    text: "In several cases the operators handed ARTEX compromised credentials and told it to run the later stages."
  - claim_id: 557e8f7a1e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-01T03:29:45Z"
    kind: record-summary
    text: "Google Threat Intelligence Group and Mandiant report that since late August they have seen ARTEX, PentAGI and CAIRN operated inside incident-response cases by extortion groups and suspected PRC-nexus clusters, with government among the affected US sectors; they track the Wiz-observed ARTEX campaign as UNC7228, overlapping Storm-0940, and say the original ARTEX repository was taken down in October while forks keep spreading it. The agent's log signature is bursts of roughly 2 to 25 seconds, error-driven retries and, in one case, MySQL general-log poisoning to write JSP web shells."
