    text: "Eight eMudhra CA keys were guessable; Windows now drops the roots, and Java, Python, Go and GitLab need updates"
  - claim_id: f95f588ebc
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms block the intermediates and eMudhra revoked them; Microsoft went further on 2026-10-26 and removed seven eMudhra-hierarchy certificates from the Windows trust list, and from the Edge trust list on 2026-10-27. Software that keeps its own trust store or does not check revocation stays exposed until updated: Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, GitLab in its releases of 2026-10-29, Python added a built-in denylist as CVE-2026-115557, and Java needs the second update of 2026-10-24 (CVE-2026-114820, CVSS 3.1 9.1) even on a runtime updated in the past few days. Chrome's removal of the emSign ECC Root CA - G3 root was due on 2026-10-27; Cisco's advisory dates its ISE fixes to December 2026 and April 2027, and no exploitation is reported."
  - claim_id: 716dafc856
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every non-browser TLS client that keeps its own CA bundle or does not check revocation, starting with standalone Java runtimes, including those already updated on 2026-10-21 (Oracle's Security Alert CVE-2026-114820 or the OpenJDK update), pip 26.2.2 or later in every Python environment, Go 1.27.3 or 1.26.10, self-managed GitLab to 19.5.3 or the patch release of its line together with GitLab Runner 19.5.1, and the CA bundles and base images the incident tracker lists, rebuild container images that embed an older bundle, then confirm with curl against the tracker's test host that the client rejects the certificate."
  - claim_id: ccb03a5564
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[1]"
    kind: frontmatter
    text: "Replace, by hand where the ACME client does not support ACME Renewal Information, every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3 or to another of the seven certificates Microsoft removed from the Windows and Edge trust lists, because Chrome's removal of the G3 root was due on 2026-10-27 and the Windows change takes effect when the trust-list update reaches a device; deliver Microsoft's out-of-band update of 2026-10-26 to Windows devices that do not receive automatic certificate-trust updates."
