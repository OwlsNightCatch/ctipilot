  evidence:
  - quote: creating fake GitHub projects that pretend to be desktop applications like *GPT-5.6 Sol*, *GPT-6 Astra*, and *Claude Opus*.
    attribution: Check Point Research
    source_url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
  - quote: Although we observed an XMRig cryptominer as the final payload in this campaign, the YobaLoader is a generic loader.
    attribution: Check Point Research
    source_url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
  - quote: The actor behind the campaign shows indicators that suggest Russian origins and appears to operate primarily in the UTC-4 time zone.
    attribution: Check Point Research
    source_url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
  extended_notes: 'Detection concepts: a non-browser process requesting dns.google/resolve TXT records; a legitimate vendor installer launched from a ZIP-extracted folder that also holds a winmm.dll; WMPDMC.exe running from a ProgramData path rather than System32; scheduled tasks authored ''Microsoft Corporation'' that point outside System32; Zone.Identifier removal before execution from a temp folder; unexpected Tor or obfs4 traffic from endpoints. Hardening: application control for DLL loads from user-writable and ProgramData paths; download AI tools only from vendor sites. IOCs (hashes, Telegram handle, domains, bridge addresses, pool token) intentionally omitted.'
- title: 'Huntress: attackers who compromised camera management software (CMS.exe) used it as the entry point into several environments, then sideloaded beacon DLLs through a genuine Windows parental-control binary dropped into user AppData'
  sources:
  - url: https://www.huntress.com/blog/camera-management-software-compromise-malware
    publisher: Huntress
    date: '2026-10-27'
    role: primary
  discovery_trace: 'first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (item dated 2026-10-27) -> primary: https://www.huntress.com/blog/camera-management-software-compromise-malware (extract)'
  summary: 'In September and October Huntress saw a handful of incidents in its customer base that began at camera management software (CMS.exe under Program Files (x86)) and assessed that in every case a threat actor had compromised that legitimate camera management system as initial access. Huntress could not determine the product''s vendor or version (the executable has no version resource; strings point at a Korean company''s domain and a software download page, which Huntress presents only as a possible source) and found no application logs, so how the software was compromised is unknown. After compromise the actor dropped a remote-control executable (rs.win32.exe) into the user''s AppData Roaming CMS folder and ran it with a remote address, port 8000 and an admin credential, which Huntress reads as a reverse shell, then dropped the genuine Windows Parental Control Monitor binary WpcMon.exe into AppData Local Microsoft and sideloaded two modified zlib DLLs (IPHLPAPI.DLL and samcli.dll)
    that beacon to one C2 address, with persistence through a user Run key referencing the relocated binary. Huntress''s lesson: treat cameras and their management platforms as entry points, inventory and restrict the software, and investigate the sequence CMS.exe, rs.win32.exe, abnormal WpcMon.exe and unapproved outbound connections.'
  region_nexus: not stated; incidents in Huntress's customer base (no country named)
  primary_sector_nexus: 'indirect: police, municipal and building video-management software on Windows hosts is the analogous exposure; no public-sector victim named'
