- title: 'PHP2Shell on PAN-OS: Dream Research names Palo Alto PAN-OS as the ''one unnamed vendor'' whose firewalls a custom PHP2Shell plus Fragnesia chain rooted in the wild, Unit 42 verifies it (CL-UNK-1280), and the operator went on to attack a US government-affiliated Active Directory'
  sources:
