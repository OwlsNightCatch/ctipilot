  summary: 'Talos (2026-10-31, from its CAIRN AI-malware tracking effort) analyses VOLTA, a self-deleting Windows infostealer sold as a builder (six swappable configuration slots) that, after the usual haul of browser passwords, cookies, cards, wallet seeds, Discord/Telegram/Steam/Roblox sessions, Microsoft OAuth tokens, SSH and cloud keys and Wi-Fi profiles, enriches the data with the victim''s own sessions (Gmail receipts to confirm a home address, delivery-app history) and POSTs a structured evidence bundle, including employer and employer domain, to OpenRouter under a ''forensic intelligence analyst'' prompt that returns a ranked ''what they are worth'' and ''their opsec'' assessment; a three-model fallback chain (Claude, Kimi, Gemini) handles model refusals. Talos says all observed endpoints are third-party-controlled with no actor-owned infrastructure. Talos says much of the token theft relies on bypassing Chrome App-Bound Encryption and names application control over which processes
    may launch Chrome with --headless as the lever. Talos (2026-10-29) separately describes NIK C2, a Go 64-bit Windows RAT with a C2 panel observed in the wild (TLS WebSocket on 443 plus an HTTP fallback poll every 250 ms, AES-256-GCM, three C2 tiers, 52+ commands: credential and cookie theft, keylogger, screen/camera/audio capture, clipboard replacement, HVNC, SOCKS5 proxy and reverse tunnels, RDP session hijacking, AMSI patching, UAC bypass, process hollowing, masquerade as svchost.exe or simvol.exe, Run-key and COM-hijack persistence, MBR backup by raw disk read, bootkit-staging reconnaissance, and a mshta-based screen-lock ''ransomware'' that encrypts nothing). Its ''ai_generate'' command routes operator prompts to OpenAI''s Chat Completions endpoint from the victim machine, and if the operator supplies no API key it reads OPENAI_API_KEY from the environment, so the victim''s account pays for and logs the actor''s inference. Talos frames both as effort displacement (a model replaces
    the operator''s triage or analysis step) rather than speed or scale, and expects refusal-resilience to become standard design.'
  region_nexus: global; no Swiss or European-government targeting reported; victims are individuals and whoever employs them
  primary_sector_nexus: 'indirect: stolen sessions and employer-domain profiling hit public-sector staff who mix personal and work browser profiles; developer and admin machines holding LLM API keys in environment variables are the NIK C2 exposure'
