  summary: 'ESET''s periodic report summarises APT activity its researchers documented from April to September 2026 (a subset of its customer-only APT intelligence). For European defenders: Russia-aligned groups (Gamaredon, Sednit, TA488 account for most activity) kept targeting governments, the defence sector and military entities in Europe, with far more targets in Ukraine; ESET records several cases of operational collaboration between Gamaredon and Turla, and Gamaredon activity fell sharply from mid-May to September while it added PteroPSDoor and deployed Turla''s Rezzuar VBScript. ESET reports the first destructive attack by a Belarus-aligned actor it has documented in Europe (FrostyNeighbor against a Ukrainian manufacturer in the transport supply chain) and says Belarus-aligned and Russia-aligned campaigns are becoming operationally closer. Lazarus resumed recruitment-lure targeting of the drone sector, with European defence and aerospace firms attractive targets; DeceptiveDevelopment
    moved from fake job interviews to software supply-chain compromises of public and private source repositories. On AI, ESET assesses APT groups use LLMs like mainstream developers (malware development, decoy sites, AI-generated lure images) without substantially reshaping the landscape and still shows hands-on-keyboard activity; in one case UAC-0099 planted a decoy request for nuclear-weapon instructions in a script comment, apparently to trip LLM-based analysis guardrails. The MDaemon/ClamAV UnRAR campaign in the report is already covered by 2026-10-29/mdaemon-clamav-unrar-cve-2025-8088-exploited-in-ukraine; MythicRatatoskr (ESET, 2026-10-22) by 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper. No Swiss or Swiss-sector victim or targeting statement was found in the report text read.'
