  evidence:
  - quote: Since late August 2026, we have observed threat actors actively operating popular open-source multi-agent pentesting platforms like ARTEX, PentAGI, CAIRN and other potentially custom harnesses within Mandiant incident response engagements
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks
  - quote: Although the original repository was taken down by its creator in October 2026 due to widespread threat actor abuse, the framework continues to proliferate globally via community forks
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks
  - quote: individual ARTEX execution sequences ran in compressed bursts of roughly 2 to 25 seconds
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks
  - quote: Frameworks such as ARTEX compress attack timelines to machine speed; however, they currently trade stealth for velocity.
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks
  - quote: Since late October 2026, Microsoft Threat Intelligence has identified Onyx Sleet and Pearl Sleet leveraging open-source agentic AI penetration testing ARTEX in operations
    attribution: Microsoft Threat Intelligence
    source_url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
  extended_notes: 'Detection concepts (all source-supported): identity/control-plane logs showing bursts of API calls over 2 to 25 seconds from one credential (permission probing, storage-key retrieval); web or application logs with many near-identical failing requests followed by a corrected variant (error-driven retry); database audit showing SET GLOBAL general_log_file pointing into a web-served directory followed by SELECT statements carrying server-side script tags; file creation with an incrementing numeric suffix. Hardening levers named by GTIG: control-plane exposure, short-lived credentials, DMZ-to-core segmentation, AD CS template hygiene (remove ENROLLEE_SUPPLIES_SUBJECT where not needed), SMB/LDAP signing, rate limits on messaging APIs. Triage: agent activity looks like scripted automation with adaptive retries; a human operator pauses and varies, an agent bursts and repeats with small variations (Huntress, already cited in the store, describes the same heuristics for Entra logs).
    This item''s value for the constituency is the speed model: the time from one compromised credential or exposed management plane to deep access is minutes to hours, so exposure reduction and credential lifetime matter more than alert speed.'
