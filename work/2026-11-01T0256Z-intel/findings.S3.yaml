  discovery_trace: 'first seen at: hunt-io, URL https://hunt.io/blog (WebFetch listing, 2026-11-01) -> drill: https://hunt.io/blog/php2shell-honeypot-shells-root-palo-alto-firewalls (extract) -> pivot (Hunt.io''s own cited primary): Dream Research, URL https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers (extract) -> pivot (vendor verification cited by Dream): Palo Alto Networks Unit 42 threat brief, URL https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/ (extract, section ''Update October 29, 2026'')'
  summary: 'FACTS (Dream Research, updated 2026-10-29, vendor-verified): on 2026-10-25 Dream researchers recovered the artefacts of an operation that rooted 25 PAN-OS firewall and management servers in the United States, Japan, Taiwan and South Korea. The exploit is a custom, non-public PHP2Shell build (CVE-2026-109618 / CVE-2026-109619) for the PAN-OS management web server (appweb), driven through PHP session.upload_progress, chained with the Linux kernel flaw Fragnesia (CVE-2026-46300) to turn the unprivileged web-server context (user nobody, SELinux-confined) into root; Dream describes four orchestrated request stages (memory exhaustion, pointer leak, stale-reference setup, code execution), both exploits running in the final request, and the whole chain from an unauthenticated HTTPS connection to a persistent root web shell completing in under 15 minutes. It needs per-build memory offsets: Dream recovered 11 version profiles, only one (PAN-OS 12.1/12.2 base build, PHP 8.0.30) lab-calibrated
    and the rest provisional including 11.1 (PHP 7.4.33); Hunt.io states PAN-OS runs one uniform PHP 8.0.30 build across every unpatched box, which it gives as the reason the unreliable heap chain became repeatable on appliances while open-internet shells mostly died in memory exhaustion (Dream''s table is more granular, 8.0.30 on 12.1/12.2 and 7.4.33 on 11.1, so ''uniform'' is Hunt.io''s simplification). Operator funnel (Dream): about 19,000 internet-facing PAN-OS management interfaces found through the Chinese FOFA search engine, about 5,000 responsive, 240 matching the country and version filter, 24 rooted in an automated batch, a 25th (the internal firewall management server) reached through a tunnel; 22 of the 24 were only parked behind a PHP root web shell. Two firewalls of a US government-affiliated organisation (CAC authentication in the configuration) were then used for an 8-port reverse SSH tunnel plus SOCKS5 proxy persisting through a systemd unit and an rc.local hook, the same
    chain was run against the firewall management server reachable only through that tunnel, and an Active Directory campaign followed from that server: LDAP service-account password decrypted from the device configuration with the root-held master key, full user and group enumeration, password spraying against every user (the domain had lockoutThreshold=0), attempted backdoor user and machine accounts, ACL path analysis, attempted SAML signing-key extraction from Keycloak. Dream could not recover the results of the spray, account creation or key extraction, so the extent of the domain compromise is unknown. Dream confirms the attacker holds private keys taken from the compromised devices'' file systems (HA replication keys, SSL/TLS certificate keys, device authentication keys). VENDOR: Unit 42 states it independently verified the same attacker''s tooling and confirmed the reported results; says patches interrupt the observed chain and patched customers are not affected; says only about
    0.02% of Palo Alto''s installed base had an internet-facing management interface and was impacted and that each such customer was individually contacted. CLAIMS / ASSESSMENT: Dream does not attribute to a named actor, notes Unit 42 tracks the activity as CL-UNK-1280 and attributes it to a Chinese-speaking attacker in UTC+8, and lists Chinese-nexus indicators (target countries, FOFA, iox tunnelling tool, DeepSeek and Kimi models in an ''aiscan'' framework, Chinese-language prompts, UTC+8 clock); Dream finds no direct evidence AI wrote the exploit. Hunt.io (separate open-directory capture of a PAN-OS-focused PoC and the same aiscan setup) assesses AI ran the operation around a hand-calibrated exploit rather than building it. DELTA vs the store: the PHP and PAN-OS entries still call the vendor ''unnamed'' and give no Unit 42 verification, no CL-UNK-1280 designation, no installed-base statement and no post-patch credential/key scope; this is the first named, vendor-verified production compromise
    through the PHP2Shell chain.'
  region_nexus: 'global; victims reported in US, Japan, Taiwan, South Korea; no Swiss victim reported. Any PAN-OS management interface reachable from the internet is in the exposed population (Unit 42: not exposed by default).'
  primary_sector_nexus: 'direct: the operator prioritised a US government-affiliated environment and, per Hunt.io, staged kits against a government finance ministry, a national bank, a government e-invoicing platform and telecom/university targets; PAN-OS firewalls and Panorama are common perimeter products for public administrations (not stated by the sources).'
