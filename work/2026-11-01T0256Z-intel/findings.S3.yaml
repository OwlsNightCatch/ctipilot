- title: 'NetamLoader: Kaspersky finds an unattributed APT framework that abuses a Microsoft-signed .NET configuration gadget (AppDomainManager injection) inside a third-party patch-management tool''s update directory to load layered XAML payloads on a government-only Windows build in Asia'
  sources:
  - url: https://securelist.com/netamloader/121676/
    publisher: Kaspersky GReAT (Securelist)
    date: '2026-10-29'
    role: primary
  discovery_trace: 'first seen at: kaspersky-securelist, feed https://securelist.com/feed/ (item dated 2026-10-29) -> primary: https://securelist.com/netamloader/121676/ (extract)'
  summary: 'Kaspersky GReAT reports a single victim in Asia and infers Asian government entities were the target, because the malware was built for a customised Windows build used only by government entities; Kaspersky says this strongly indicates a supply-chain attack and that no attribution to a known APT group has been established. A KSN alert flagged a .config file using AppDomainManager injection inside a CAB placed in the Windows Update download folder; the CAB held Patch My PC components (the third-party patch-management tool) and Microsoft-signed .NET assemblies, and the process seen running was PatchMyPC-ScriptRunner.exe with an update-package argument (Kaspersky did not see how the CAB was delivered). The chain: the executable''s .config makes the runtime load a Microsoft-signed configuration class that reads a crafted fabric.config; Kaspersky says a design flaw in DataCacheFactoryConfiguration lets it load arbitrary types, which parses a Resources.resx carrying a BinaryFormatter-serialised
    object and multiple encoded, compressed or encrypted layers (XAML files, .NET assemblies, JSON configuration). The final loader runs payloads from C2 in an isolated AppDomain, polls with long jitter (20 to 40 minutes before first contact, 22 to 28 hours if the server does not answer), uses AES-128-CBC with HMAC for traffic, and its C2 sits behind Cloudflare. Transferable lesson for detection engineers: legitimate signed binaries plus a planted .config in a writable directory give code execution with no unsigned DLL on disk.'
  region_nexus: Asia (single victim); no European or Swiss victim reported
  primary_sector_nexus: 'indirect: government-targeted, but a sovereign-OS supply-chain scenario outside the constituency; the technique and the patch-tool host are the transferable parts'
