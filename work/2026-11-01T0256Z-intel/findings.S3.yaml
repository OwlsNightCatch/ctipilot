- title: 'Yoba: Check Point Research tracks fake GitHub ''ChatGPT, Claude and Cursor desktop apps'' that sideload a loader next to genuine signed vendor binaries, fetch tasking from a DoH TXT record located through a Telegram profile picture, and currently drop an XMRig miner'
  sources:
  - url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    publisher: Check Point Research
    date: '2026-10-27'
    role: primary
  discovery_trace: 'first seen at: checkpoint-research, feed https://research.checkpoint.com/feed/ (item dated 2026-10-27) -> primary: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/ (extract)'
  summary: 'Check Point Research has tracked for two months a campaign it calls Yoba: fake GitHub repositories and GitHub Pages sites impersonating desktop apps ''GPT-5.6 Sol'', ''GPT-6 Astra'' and ''Claude Opus'' (no fake stars or forks; visibility most likely from SEO poisoning of Google results), whose ZIP releases carry a genuine signed OpenAI or Anthropic Setup.exe next to a malicious winmm.dll that it loads by DLL sideloading. The YobaDropper (anti-sandbox check that the host process is named as expected, a keyboard-layout test excluding CIS countries except Ukraine, an administrator check) copies the legitimate WMPDMC.exe from System32 into a ProgramData folder, drops the decrypted YobaLoader as a DLL beside it and persists through a SYSTEM scheduled task given Microsoft as author, a 3-minute boot delay and a Windows Media Player description. The YobaLoader reads a Telegram channel''s profile image, derives a dedyn.io domain from the image''s last 50 bytes through a dictionary-word
    DGA, asks Google DNS-over-HTTPS for a TXT record, verifies an Ed25519 signature and AES-decrypts a payload URL on a file-hosting service, then injects into svchost.exe, runs an executable (after stripping Zone.Identifier) or runs a hidden PowerShell script. The observed payload is an XMRig miner reaching an onion pool through a bundled Tor and obfs4 bridges, but Check Point stresses the loader is generic, so later waves may deliver other families; an early variant (June 2026) sideloaded through a process named Cursor.exe. Check Point says indicators suggest Russian origin and a UTC-4 working pattern (the repository metadata also shows UTC+3, UTC+4 and UTC-4).'
  region_nexus: global; no Swiss or European-government nexus reported
  primary_sector_nexus: 'indirect: affects staff and developers who download AI desktop tools from search results; commodity cryptominer payload so far'
  sector: public-sector
  cves: []
