- title: 'Talos on AI-integrated implants: VOLTA stealer sends a stolen-data dossier to an LLM (OpenRouter) to rank the victim''s assets, and NIK C2 embeds an OpenAI API client that falls back to the victim''s own OPENAI_API_KEY'
  sources:
  - url: https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
    publisher: Cisco Talos
    date: '2026-10-31'
