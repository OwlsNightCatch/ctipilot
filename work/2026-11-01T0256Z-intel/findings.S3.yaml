  extended_notes: 'Exposure: the exposed surface is the PAN-OS management web interface (HTTPS web UI / appweb, which Dream says also fronts the GlobalProtect portal), reachable from the internet; Unit 42: ''By default the management interface is not exposed to the internet''. Dream''s calibrated profile covers the 12.1/12.2 base build; the vendor advisory (already in the store) lists every release as affected, so treat all branches as exposed until the hotfix is on. Post-patch compromise check (all Dream): patching does not evict an attacker already in. On any management interface that was internet-reachable and unpatched since about 2026-10-21, look for a small PHP root web shell in a web-reachable directory of the management web server, an unexpected systemd service or rc.local entry launching scripts from a hidden directory under /usr/local/lib (Dream: reverse SSH tunnel with SOCKS5), outbound SSH from the firewall management plane to unfamiliar hosts, and management-plane crashes or
    reboots (the first rooted firewall crashed after about 900 MB of exploit traffic). Treat as exposed and rotate: the LDAP bind account used by the firewall/management server (stored recoverably in the device config), HA replication keys, SSL/TLS certificate keys and device authentication keys. On the Active Directory side look for LDAP binds by the firewall service account from unexpected sources, bulk LDAP enumeration, sprays against all users, attempted computer-account creation (default MachineAccountQuota), and reads of SAML IdP signing configuration. Detection telemetry classes: web/access logs of the management web server (very large multipart POSTs with oversized filenames and session-progress data, memory-exhaustion bursts of roughly 383 MB and 500 MB per stage per Dream), appliance crash/restart events, outbound connections from the management plane, directory authentication and LDAP query logs. Triage: legitimate management-plane traffic is small and comes from admin source
    addresses; the exploit traffic is large, repetitive multipart uploads from internet sources, and a host that rebooted unexpectedly after one is a strong signal. Unit 42''s earlier 2026-10-23 claim of an AI-agent post-exploitation case at a European government entity was retracted on 2026-10-25 (already in the store) and is unrelated to this chain. Source inconsistency to watch: Hunt.io''s page metadata says 2026-10-28 while its listing shows Oct 30 and the text says ''as of October 30''; Dream''s first post was 2026-10-26 (per Hunt.io) and updated 2026-10-29. Hunt.io promises a dedicated PAN-OS campaign write-up not yet seen. Attacker file paths, hostnames and addresses are deliberately omitted (IOC policy).'
  actions_hint: Take every PAN-OS and Panorama management interface off the internet and install the hotfix; on any interface that was exposed and unpatched, treat the device as compromised until a web-shell, persistence and credential/key rotation check is done.
- title: 'ARTEX and friends: Google Threat Intelligence Group and Mandiant report agentic pentest frameworks (ARTEX, PentAGI, CAIRN) running parts of real intrusions in incident-response cases since late August, with machine-speed behaviour and a five-layer defence model'
  sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks
    publisher: Google Threat Intelligence Group / Mandiant
    date: '2026-10-31'
    role: primary
  - url: https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/
    publisher: Microsoft Threat Intelligence
    date: '2026-10-29'
    role: corroborating
  discovery_trace: 'first seen at: mandiant-gtig, feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (newest item 2026-10-15; the 2026-10-31 post is NOT in the feed) -> WebFetch of the landing page https://cloud.google.com/blog/topics/threat-intelligence listed ''ARTEX and Friends'' -> primary: https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks (extract; metadata date 2026-10-31). Microsoft NK-adoption sentence: msft-ti via `msft-secblog recent 30`, URL https://www.microsoft.com/en-us/security/blog/2026/10/29/tracking-ai-adoption-in-north-korean-threat-actor-tradecraft/'
  summary: 'FACTS / GTIG claims (Mandiant incident-response telemetry plus research telemetry): since late August 2026 GTIG and Mandiant have seen threat actors operate the open-source multi-agent pentest frameworks ARTEX, PentAGI and CAIRN, and possibly custom harnesses, inside IR engagements, with agents doing significant parts of the lifecycle (lateral movement, database exploitation, exfiltration preparation). ARTEX is a Go multi-agent platform with six sub-agents and an embedded Next.js console; its author took the original repository down in October 2026 because of abuse, but forks (including ScopeWeaver and a commercial ''ARTEX PRO'') keep it spreading. GTIG tracks the Wiz-observed ARTEX campaign as UNC7228, which it says overlaps Microsoft''s Storm-0940; Wiz''s picture now dates to at least August 2026 and covers entities in the US and Europe in enterprise software, industrial automation, semiconductors and telecommunications, typically from first compromised account to deep access
    in about four hours and once in 15 minutes. Other ARTEX users in GTIG cases are financially motivated extortion groups and further suspected PRC-nexus clusters, impacting organisations in government, technology, chemicals and materials and manufacturing in the US. In several cases the adversaries handed the framework compromised credentials for the target and told it to run the later stages. Behaviour that separates the agent from a human operator (GTIG): execution bursts of roughly 2 to 25 seconds (27 events in 23 seconds probing AWS permissions), error-driven retries (a ''script too large'' failure fixed by trimming and relaunching), forensic noise (240 log events against one external-facing web server, sub-agents overwriting each other), and one case where the framework used an application''s SQL API to set the MySQL general-log file to a .jsp path and enable logging so that later SELECT statements wrote JSP web shells, with incrementing throw-away file names; probe files named artex-probe
    plus a five-digit number and incrementing numeric markers in dropped file names, created account names, passwords and e-mail subjects. ASSESSMENTS (GTIG): frameworks like ARTEX trade stealth for speed; criminal adoption will continue with high confidence; near-term (1 to 3 months) forensically noisy, multi-agent attacks with no human in the loop, medium-term stealthier ones. Mandiant''s defensive model: protect the control plane (admin interfaces, cloud management, firewall/hypervisor/backup consoles off the internet, privileged workstations), restrict identities and keys (short-lived credentials, managed identities, no long-lived storage keys), harden configurations and attack paths (segment internet-facing workloads from Kerberos, NTLM, LDAP, SMB and RDP into the core; AD CS template hygiene; Credential Guard, SMB and LDAP signing and channel binding), put rate and recipient limits on high-impact business APIs, and detect behavioural and volumetric change (new authentication origin,
    control-plane call velocity, bulk object reads, east-west traffic from DMZ hosts, egress from servers to webhook, out-of-band-testing, tunnelling and external AI platforms). Microsoft (2026-10-29) adds that since late October 2026 the North Korean clusters Onyx Sleet and Pearl Sleet use ARTEX, so the framework is now documented in Chinese-nexus, criminal and North Korean use. DELTA vs the store: the ARTEX entry (Storm-0940, criminal extortion) and the VAPOR PANDA entry carry no Mandiant IR evidence, no UNC7228 mapping, no author takedown or fork information, no PentAGI/CAIRN adoption, no behavioural fingerprints and no North Korean adoption.'
  region_nexus: global; Wiz/GTIG name entities in the US and Europe; GTIG IR cases in the US; no Swiss victim named
  primary_sector_nexus: 'direct: government is among the sectors GTIG lists as impacted in its IR cases; the control-plane, AD-segmentation and credential-lifetime levers apply to every public administration'
