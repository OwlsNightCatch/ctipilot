  - claim_id: bd48f793cc
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-01T04:10:00Z"
    kind: cited
    text: "Hunt.io, reading open-directory captures, says shells have been confirmed only on honeypots and sensors, which it names as watchTowr, 0x4D31 and GreyNoise, and that its shared exploit kit has not been seen landing on a live victim, while relaying Dream Research's and Unit 42's account of PAN-OS firewalls rooted in production as the first confirmed production compromises; in one capture an operator who ran the chain against a national government got only a crash, because session files lay outside the webroot, and then broke in with a different bug ("
