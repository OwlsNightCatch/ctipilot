claims:
  - claim_id: 0b88626ceb
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-46300 (\"Fragnesia\", CVSS 7.8) is a local privilege escalation in the Linux kernel's xfrm ESP-in-TCP path, one of three CVEs Red Hat groups as \"Dirty Frag\"; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root, and Dream Research reports such a chain against 25 Palo Alto Networks PAN-OS firewall and management servers and a US government-affiliated network. Its public exploit overwrites /usr/bin/su in the page cache, and Red Hat confirms RHEL kernels are affected (CISA KEV, 2026-10-28 · Dream Research, 2026-10-29 · Red Hat RHSB-2026-003)."
