  - claim_id: 34a6df94a9
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-11-01T04:10:00Z"
    kind: record-summary
    text: "GreyNoise's live tracker records successful exploitation on its deliberately vulnerable sensors from 2026-10-28, with reverse shells, a .ssh directory in the web server account's home, cloud-metadata queries and secret-scanning tools in the sessions of 2026-10-29 and 2026-10-31; Hunt.io reports that an operator's attempt against a national government failed because session files lay outside the webroot, and relays that PAN-OS firewalls were rooted in production. Dream Research's updated report names Palo Alto Networks PAN-OS as the product behind the chain first described with an unnamed vendor, which Unit 42 says it verified."
  - claim_id: 5de31c470d
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every non-browser TLS client that keeps its own CA bundle or does not check revocation to a fixed version: standalone Java runtimes, including those already updated on 2026-10-21, to the update of Oracle's Security Alert CVE-2026-114820 or OpenJDK (Oracle Database Server, Autonomous Health Framework and OPatch installations too), Python 3.15.2, 3.14.10, 3.13.18, 3.12.16 or 3.11.18 together with pip 26.2.2 or later, Go 1.27.3 or 1.26.10, and self-managed GitLab to a fixed patch release together with GitLab Runner 19.5.1; then confirm with curl against the incident tracker's test host that the client rejects the certificate."
  - claim_id: d6c4ab5efb
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[1]"
    kind: frontmatter
    text: "Replace, by hand where the ACME client does not support ACME Renewal Information, every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3 or to another of the seven certificates Microsoft removed from the Windows and Edge trust lists, because Chrome's removal of the G3 root was due on 2026-10-27 and the Windows change takes effect when the trust-list update reaches a device; deliver the updated Disallowed Certificate Trust List and the trust-list changes Microsoft describes, including its out-of-band update of 2026-10-26, to Windows devices that do not receive automatic certificate-trust updates."
  - claim_id: 7efd2407e4
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "cves[CVE-2026-114820]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-114820\", \"cvss\": \"9.1 (CVSS 3.1)\", \"status\": [\"patch-available\", \"mitigation-only\"], \"affected\": \"Oracle Java SE 8u511-b32, 8u511-perf-b32, 11.0.33.0.2, 17.0.21.0.2, 21.0.13.0.2, 25.0.5.0.2, 27.0.1.0.2; Oracle GraalVM for JDK 17.0.21.0.2 and 21.0.13.0.2; Oracle GraalVM Enterprise Edition 21.3.20.0.2; OpenJDK 27.0.1.0.2, 25.0.5.0.2, 21.0.13.0.2, 17.0.21.0.2, 11.0.32.1, 8u504 and earlier; Oracle Database Server 19.3-19.32, 21.3-21.23 and 23.4.0-23.26.3 (RDBMS, Java; not applicable to client-only installations), Oracle Autonomous Health Framework Trace File Analyzer 26.3-26.10, Oracle Global Lifecycle Management OPatch 12.2.0.1.16-12.2.0.1.52 and Oracle Hospitality Cruise Shipboard Property Management Next-Gen SPMS 23.3.4-23.3.6 (revision 2 of 2026-10-30)\", \"fixed\": \"the Java updates of Oracle's Security Alert CVE-2026-114820 (build numbers in Oracle's Patch Availability Document) and the OpenJDK update whose release note names JDK-8395690; until updated, delete the cacerts aliases emsignrootcag1, emsignrootcag2, emsigneccrootcag3 and comodoaaaca or enable revocation checking; the incident tracker lists Oracle JDK 27.0.1.0.3, 25.0.5.0.3, 21.0.13.0.3, 17.0.21.0.3, 11.0.33.0.3 and 8u511 b33 as fixed and OpenJDK builds as pending\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
