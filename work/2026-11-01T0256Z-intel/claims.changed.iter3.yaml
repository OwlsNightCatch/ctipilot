    kind: record-summary
    text: "Dream Research's report, updated 2026-10-29, names Palo Alto Networks PAN-OS as the product behind the chain it had first described with an unnamed vendor: a custom PHP2Shell build chained with a Linux kernel flaw rooted 25 PAN-OS firewall and management servers and was followed by an attack on a US government-affiliated Active Directory, and Unit 42 says it independently verified the tooling and results. The advisory's exploitation statement is unchanged; a device that was exposed and unpatched needs a compromise check as well as the hotfix, and Dream says the affected web server also fronts the GlobalProtect portal, which Palo Alto's advisory lists as not affected."
