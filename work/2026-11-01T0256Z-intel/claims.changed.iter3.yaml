    surface: "record 2026-11-01T03:32:20Z"
    kind: record-summary
    text: "Microsoft removed seven eMudhra-hierarchy certificates from the Windows trust list in an out-of-band update of 2026-10-26 and from the Edge trust list on 2026-10-27; Cisco's advisory reached version 1.5 on 2026-10-30 with ISE fixes dated December 2026 and April 2027; GitLab's releases of 2026-10-29 distrust the eight intermediates, with GitLab Runner and the AI Gateway needing separate updates; Python's releases of 2026-10-26 carry the built-in denylist; and Oracle's revision of 2026-10-30 extends the Java alert to Oracle Database Server, Autonomous Health Framework and OPatch. Certificates that chain to the removed roots need replacing, and disconnected Windows devices need the updated trust lists."
