  item: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 (Detection line; Update 2026-11-01T04:10:00Z; record summary)
  url_or_quote: '"create a .ssh directory under the web root" / "downloads of enumeration and secret-scanning tools that were run over the web root" (https://php.events.greynoise.io/)'
  summary: GreyNoise rows show "mkdir -p /var/www/.ssh" and "chmod 600 /var/www/.ssh/authorized_keys" (the web user home, beside the document root /var/www/html that the scanners target), not a directory under the web root; the secret scanner runs ("gitleaks dir '/var/www/html'", also /srv, /home, /opt, /root, /etc) appear only in sessions of 2026-10-31, while the 2026-10-29 sessions show the downloads of gitleaks and linpeas and a deep-loot script. The research note FU1 itself says "under the web user home (/var/www/.ssh)". Detection guidance that sends a hunter to look under the web root misses the real path; say "in the web server account home (/var/www/.ssh)" and move the scanner runs to 2026-10-31. Same wording in the record summary.
