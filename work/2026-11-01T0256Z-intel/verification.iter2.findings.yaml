  item: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release (changelog record 2026-11-01T03:27:57Z summary)
  url_or_quote: '"Dream and Palo Alto differ on whether GlobalProtect shares the affected web server."'
  summary: The advisory (https://security.paloaltonetworks.com/CVE-2026-109618) says only "GlobalProtect portal, gateway and Clientless VPN are not impacted" and "This issue strictly affects the management web interface"; it says nothing on whether the web server is shared. The Exposure line states the two statements accurately; the record summary overstates them as a disagreement, and the update section does not mention GlobalProtect at all (record states more than section). Reword to "Dream says the web server also fronts the GlobalProtect portal, which the advisory lists as not affected" or drop the clause.
