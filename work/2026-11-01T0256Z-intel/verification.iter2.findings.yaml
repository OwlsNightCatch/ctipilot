- code: F8
  category: needs-more-research
  section: incidents
  item: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates (CVE-2026-114820, affected_products, Update 2026-11-01T03:32:20Z); missed angle
  url_or_quote: 'Oracle Security Alert CVE-2026-114820, revision table: "2026-October-30 | Rev 2. Added Oracle Autonomous Health Framework, Oracle Database Serve[r], Oracle Global Lifecycle Management OPatch, Oracle Hospitality Cruise Shipboard Property Management (SPMS)" (https://www.oracle.com/security-alerts/alert-cve-2026-114820.html)'
  summary: 'The second Oracle alert now also lists Oracle Database Server (RDBMS, Java component; 19.3-19.32, 21.3-21.23, 23.4.0-23.26.3; "not applicable to client-only installations"), Autonomous Health Framework (Trace File Analyzer 26.3-26.10), OPatch (12.2.0.1.16-12.2.0.1.52) and Hospitality SPMS as remotely exploitable without authentication at CVSS 3.1 9.1. The entry (cves[CVE-2026-114820].affected, affected_products, the 2026-11-01 section) lists only Java SE, GraalVM and OpenJDK; Oracle Database is widely run in public-sector estates, so a reader with Oracle estate misses it. The same run also left out the tracker''s fixed Oracle JDK builds (27.0.1.0.3, 25.0.5.0.3, 21.0.13.0.3, 17.0.21.0.3, 11.0.33.0.3, 8u511 b33) and its "Pending for OpenJDK" state, while the CVE fixed field says "build numbers in Oracle''s Patch Availability Document" and action 1 says "or the OpenJDK update". Suggested search: Oracle Security Alert CVE-2026-114820 Rev 2 Oracle Database patch availability. Add
    a delta to the entry (update record, affected_products, cves[].affected).'
