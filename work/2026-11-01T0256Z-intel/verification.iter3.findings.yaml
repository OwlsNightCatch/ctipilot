  section: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
  item: "PHP2Shell main entry, Detection line, AWS investigation start date"
  url_or_quote: "AWS, as relayed by Inside IT, advises starting the investigation from 2026-10-17, its earliest honeypot exploit attempt ([Inside IT, 2026-10-22](https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022))"
  summary: "(low confidence) The page says: \"Wer eine Kompromittierung nicht ausschliessen kann, sollte laut AWS die Untersuchung mindestens ab dem 17. Oktober ansetzen.\" The sentence was edited in this run (git diff HEAD) and now drops both the condition (operators who cannot exclude a compromise) and \"at least\", so the advice reads as unconditional and as a fixed start date. Restore \"an operator who cannot exclude a compromise ... at least from 2026-10-17\"."
- code: F3
  category: claim-not-supported
  section: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
  item: "PAN-OS entry, Exposure line, GlobalProtect disagreement"
  url_or_quote: "says the web server also fronts the GlobalProtect portal, which Palo Alto's advisory says is not affected ([Dream Research, 2026-10-29](https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers))"
  summary: "(low confidence) The clause ends on a Dream citation only. Dream's page says \"The exploited surface is the PAN-OS management web server, which also fronts the GlobalProtect portal\" and does not mention what Palo Alto's advisory says; \"GlobalProtect portal, gateway and Clientless VPN are not impacted\" is in the PSIRT FAQ (https://security.paloaltonetworks.com/CVE-2026-109618). Add the PSIRT citation to this clause, as the 2026-11-01 update section already does."
- code: F4
  category: hallucinated-fact
  section: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
  item: "PAN-OS entry, Detection line, directory-log telemetry"
  url_or_quote: "in directory logs, LDAP binds by the firewall's service account from unexpected sources, bulk LDAP enumeration and password-spray bursts ([Dream Research, 2026-10-29](https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers))"
  summary: "(low confidence) Dream says the attacker launched the Active Directory campaign from the management server, \"Because the management server already had LDAP connectivity to Active Directory (it needs it to authenticate VPN users)\", with the decrypted service-account password hardcoded into the scripts, so the bind source is the account's normal host; Dream does not say binds came from unexpected sources. Keep enumeration and spray bursts, and drop or reword \"from unexpected sources\" (for example, volume and pattern from the management server or firewall addresses)."
- code: F18
  category: action-item-discipline
  section: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
  item: "PAN-OS actions[1]"
  url_or_quote: "Treat every PAN-OS firewall and Panorama whose management interface was reachable from the internet while unpatched as possibly rooted until you have searched the management web server's web-reachable directories for PHP files nobody deployed, systemd and rc.local for services that start scripts from a hidden directory under /usr/local/lib, and the management plane for outbound SSH sessions; ..."
  summary: "(low confidence) Check 10b(d): the Fragnesia entry (earlier in-window, 2026-10-29) already carries an action to look for PHP files in web-reachable directories nobody deployed, an outbound SSH session kept up by systemd or rc.local, and password-spray bursts on any PHP web host, appliance or management server. The aggregated list shows the same hunt twice. Keep the PAN-OS-specific rotation of keys and trim one of the two hunts."
