claims:
  - {claim_id: 0b88626ceb, passage: 'KEV CVE-2026-46300 dateAdded 2026-10-28: "can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root." Dream (updated 2026-10-29): "rooted 25 PAN-OS fire', source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: ok}
  - {claim_id: ba4b965a94, passage: '"The affected devices run specific versions of Palo Alto Networks PAN-OS." ... "rooted 25 PAN-OS firewall and management servers"; Unit 42: "has independently verified the same attacker''s tooling"', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 6e27592548, passage: 'Supersession sentence; Dream 2026-10-29 names PAN-OS, replacing "does not name the vendor" of the 2026-10-29 section', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 5e2d007b04, passage: 'Record summary matches the section: PAN-OS named, 25 servers, Unit 42 verification', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: e185d1ed08, passage: 'Summary verified clause by clause: KEV 2026-10-26 (KEV json); Karimi 35 shells; VulnCheck 8.2-8.5; GreyNoise first success 28 Oct 05:14:01 UTC; PSIRT active exploitation; Dream 25 servers', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: ecd645e617, passage: '"PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two critical vulnerabilities"; Cloudflare/Wordfence runtime point; BACS: "Eine unveraenderte PHP-Hauptversion bedeutet deshalb nicht automatisch, dass der Pa', source_url: 'https://www.php.net/archive/2026.php', verdict: ok}
  - {claim_id: 3dcdf4e309, passage: '"Session upload progress must also still be enabled." "We suggest you set session.upload_progress.enabled=0 until the next regular bugfix release"', source_url: 'https://www.php.net/archive/2026.php#2026-10-23-1', verdict: ok}
  - {claim_id: a310932421, passage: 'Dream: rooted PAN-OS management web server exposed to the internet; BACS: "Dabei ist den Betreibern nicht immer bekannt, dass das Produkt im Hintergrund PHP verwendet."', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 8e69156052, passage: '"PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two critical vulnerabilities ... All PHP users are strongly encouraged to update immediately"; 10-20 notice: both "CVSS v4.0 9.2"', source_url: 'https://www.php.net/archive/2026.php#2026-10-21-5', verdict: ok}
  - {claim_id: 66ae9cbe01, passage: '"PHP uses longjmp() for out-of-memory (OOM) errors ... leaves the request memory in an invalid state. The request shutdown procedure may then read or branch on it."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w', verdict: ok}
  - {claim_id: 35f3424034, passage: '"PHP releases the request memory while the persistent worker retains the referring global state. The same worker handles another request."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: ead4c57df5, passage: '"Who is at risk: all PHP installations serving web requests, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP and LiteSpeed. We consider the risk highest for mod_php, with a demonstrated ex', source_url: 'https://www.php.net/archive/2026.php#2026-10-21-5', verdict: ok}
  - {claim_id: 302ee087a5, passage: '"Session lifecycle RCE was validated against mod_php and FPM." "Session upload progress is enabled by default, and no application call to session_start() is required."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: 7840f1377b, passage: '"The confirmed impact is unauthenticated heap use-after-free, memory disclosure and remote code execution with the web worker''s privileges."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp', verdict: ok}
  - {claim_id: c384313734, passage: '"CVE-2026-109618 also discloses server memory on its own ... memory can contain passwords, session tokens, API keys and TLS private keys from other requests."', source_url: 'https://sansec.io/research/php2shell', verdict: ok}
  - {claim_id: 42633244b6, passage: '"PHP 8.1 and older no longer receive updates ... the PHP security team provided minimal source-backports for PHP 7.4, PHP 8.0, and PHP 8.1"', source_url: 'https://www.php.net/archive/2026.php#2026-10-21-5', verdict: ok}
  - {claim_id: 4f936712bd, passage: '"The vulnerabilities affect all web servers running PHP 5.4 or later"', source_url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/', verdict: ok}
  - {claim_id: 786a34f4ab, passage: '"Updating WordPress, your plugins, or your themes does not change the version of PHP your server runs."', source_url: 'https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/', verdict: ok}
  - {claim_id: 6262f98bb8, passage: 'Table lists PAN-OS 12.2 ... 10.2 with fixed rows (1+3+5+6+5 = 20); "applicable to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama"; timeline 2026-10-29T23:54Z removes last ETA (11', source_url: 'https://security.paloaltonetworks.com/CVE-2026-109618', verdict: ok}
  - {claim_id: '6993357403', passage: '"We recommend checking the NCSC-NL GitHub repository for information on third-party software that includes PHP"', source_url: 'https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities', verdict: ok}
  - {claim_id: 1ccdeae8e6, passage: '"CISA added CVE-2026-109618 and CVE-2026-109619 to its KEV Catalog on Oct. 26, 2026." Page last revised Oct 26; names no threat actor and does not say how CISA learned of exploitation (WebFetch)', source_url: 'https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching', verdict: ok}
  - {claim_id: bf076f4666, passage: '"35 complete execution-stage HTTP POSTs with 35 /bin/sh starts directly parented by Apache workers ... across three PHP targets"; "four-stage multipart chain"; "consistent with CVE-2026-109618"', source_url: 'https://github.com/0x4D31/honeypot-data/blob/main/reports/php2shell/2026-10-24-confirmed-rce.md', verdict: ok}
  - {claim_id: 6194802da2, passage: '"while the vulnerability was leaked before the official release date and we observed attack traffic targeting our customers"', source_url: 'https://blog.cloudflare.com/php-vulnerabilities-waf-protection/', verdict: ok}
  - {claim_id: 12679984ed, passage: '"Exploitation has been observed in the wild since October 21, 2026, through watchTowr''s Attacker Eye global honeypot network."', source_url: 'https://watchtowr.com/intelligence/php-cve-2026-109618-faq/', verdict: ok}
  - {claim_id: e602f4a631, passage: 'Timeline (UTC, October 21, 2026): "08:37 - 08:52 | ... | Probe: GET /index.php, then a multipart POST"', source_url: 'https://www.vulncheck.com/blog/php2shell-vulnerabilities', verdict: ok}
  - {claim_id: 6ea9f3a50c, passage: '"As of 5:30 PM ET on Monday, October 26 ... PHP 8.2.28 through 8.2.34 ... 8.3.22 through 8.3.35 ... 8.4.10 through 8.4.26 ... 8.5.10 and 8.5.11 ... WordPress exploitation on default Docker installs"', source_url: 'https://www.vulncheck.com/blog/php2shell-vulnerabilities', verdict: ok}
  - {claim_id: 31835c5835, passage: '"Active exploitation has been observed targeting the Palo Alto Networks management interface exposed to the internet."; Wayback 2026-10-27 17:10: "Very limited exploitation has been observed"', source_url: 'https://security.paloaltonetworks.com/CVE-2026-109618', verdict: ok}
  - {claim_id: cb88a44e72, passage: '"We are unable to confirm that initial access is associated with the specific PHP2Shell CVEs. We have retracted our previous update from October 23."', source_url: 'https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/', verdict: ok}
  - {claim_id: 7081acb7ee, passage: 'CrowdStrike "has not observed successful exploitation"; Sophos: "no evidence of a successful compromise"; Wordfence title "No Known Compromises as a Result Yet"', source_url: 'https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/', verdict: ok}
  - {claim_id: 1db5576450, passage: '"At this point, 24 firewalls had been successfully rooted." First firewall "crashed shortly after"; second exploited Oct 24; "8-port reverse SSH tunnel"; management server rooted; "Sprayed passwords a', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 3507d31a6a, passage: 'SRF: "warnt TCS Camping rund 15''000 Kundinnen und Kunden"; Camping.Care data theft; Blick: "die beiden kritischen PHP-Sicherheitsluecken zum Verhaengnis wurden"', source_url: 'https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping', verdict: ok}
  - {claim_id: 57703dc293, passage: '"An application must set session.serialize_handler to php_binary or php_serialize ... switch it to php at runtime with ini_set() before calling session_start() ... we are handling it in the regular re', source_url: 'https://www.php.net/archive/2026.php#2026-10-23-1', verdict: ok}
  - {claim_id: 8e3c63971a, passage: '"PHP has not stated which versions are affected, which releases will contain the fix, or a severity score." "No exploitation of CVE-2026-115560 has been reported"', source_url: 'https://thehackernews.com/2026/10/urgent-php-warns-of-another-unpatched.html', verdict: ok}
  - {claim_id: e9ef6009db, passage: '"Nobody has shown such a request for PHP2Shell. A researcher who tested the public proof-of-concept exploits found that they do not work against a default PHP installation."', source_url: 'https://sansec.io/research/php2shell', verdict: ok}
  - {claim_id: e487aa83ca, passage: '"an attacker can calibrate exploit offsets and heap grooming in advance, producing an exploit that reliably applies to any system running that same unmodified package or image release"', source_url: 'https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/', verdict: ok}
  - {claim_id: 5527e4b057, passage: 'SANS ISC diary "(Reliable)? php2shell exploitability" (page read; universal reliable exploit judged difficult)', source_url: 'https://isc.sans.edu/diary/33452', verdict: ok}
  - {claim_id: 689d6bdce5, passage: '"Rated Important ... reliable exploitation requires precise heap manipulation and timing ... PHP-FPM workers exit on early initialization failures"; Red Hat 8.1 vs NVD 9.8', source_url: 'https://access.redhat.com/security/cve/cve-2026-109618', verdict: ok}
  - {claim_id: 7bcd510a17, passage: '"Citrix has released fixes ... for all supported NetScaler software versions"; management GUI and APIs restricted', source_url: 'https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/', verdict: ok}
  - {claim_id: 29ecdd2a4e, passage: 'Fixed Release: Expressway 15.5.21; URWB "26.2.1.9 (Nov 2026)"; Duo Access Gateway 3.2.0; ISE Portal Builder fix deployed; v1.10 2026-OCT-30', source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-php-october26-Jj384Daq', verdict: ok}
  - {claim_id: 9e7e7dcca1, passage: '"Products Under Investigation: FortiDDoS FortiSOAR FortiSOAR PaaS"', source_url: 'https://fortiguard.fortinet.com/psirt/FG-IR-26-186', verdict: ok}
  - {claim_id: 5a5e0edafe, passage: 'Splunk: "If a product is not listed within this advisory, the product is not affected." (page read)', source_url: 'https://advisory.splunk.com/advisories/SVD-2026-1013', verdict: ok}
  - {claim_id: 6cf16f36b6, passage: '"Security Center Patch SC-202610.2 updates the following components: php to version 8.2.35" (tns-2026-31 same for Enclave Security)', source_url: 'https://www.tenable.com/security/tns-2026-30', verdict: ok}
  - {claim_id: e0ed4a6a93, passage: '"All versions with Palo Alto Networks PAN-OS (10.2 All, 11.1 All, 11.2 All, 12.1 All, 12.2 All)" on RUGGEDCOM APE1808; "Contact customer support"', source_url: 'https://cert-portal.siemens.com/productcert/html/ssa-566512.html', verdict: ok}
  - {claim_id: b0f2e6f9df, passage: '"WatchGuard''s has completed our assessment and found that none of our products are affected"', source_url: 'https://psirt.watchguard.com/WGSA-2026-0032/', verdict: ok}
  - {claim_id: 47f177dc13, passage: '"Dabei ist den Betreibern nicht immer bekannt, dass das Produkt im Hintergrund PHP verwendet." and "Entscheidend sind die genaue Paketversion und die Sicherheitsinformationen des jeweiligen Anbieters"', source_url: 'https://www.bacs.admin.ch/de/warnung-php-de', verdict: ok}
  - {claim_id: d91da44868, passage: '"go to Tools > Site Health, open the Info tab, and expand the Server section. The PHP version your site is running is listed there."', source_url: 'https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/', verdict: ok}
  - {claim_id: 103a73c95d, passage: '"Wer eine Kompromittierung nicht ausschliessen kann, sollte laut AWS die Untersuchung mindestens ab dem 17. Oktober ansetzen." The entry drops the condition and "at least".', source_url: 'https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022', verdict: F3}
  - {claim_id: 67a1e023b3, passage: '"sent multipart file upload requests to index.php ... a multipart POST to any PHP endpoint that is processed by upload-progress can cause a memory limit failure"', source_url: 'https://www.vulncheck.com/blog/php2shell-vulnerabilities', verdict: ok}
  - {claim_id: ad9096da0b, passage: '"The confirmed impact is unauthenticated remote code execution as the web worker account."', source_url: 'https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w', verdict: ok}
  - {claim_id: ed8a9683b6, passage: 'GreyNoise rows: first success 2026-10-28 05:14:01 (apache2 spawned sh, curl); 10-29 19:56:40 bash -i >&/dev/tcp; 19:56:46 mkdir -p /var/www/.ssh; 19:58:50 IMDS (169.254.169.254) queries', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: 9c781c22f2, passage: '"Monitor for suspicious activity, including PHP worker processes launching shells or downloading tools."', source_url: 'https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching', verdict: ok}
  - {claim_id: ba69fbc9f4, passage: '"Untersuchen Sie Protokolle und betroffene Systeme auf ungewoehnliche Anfragen, Abstuerze, veraenderte Dateien und unerwartete Prozesse. Ein Update beseitigt keine bereits erfolgte Kompromittierung."', source_url: 'https://www.bacs.admin.ch/de/warnung-php-de', verdict: ok}
  - {claim_id: 9ede14003d, passage: '"Each event may be benign on its own, but the full sequence occurring within seconds and involving the same process is a much stronger indication"; "in Unknown on line 0"; PID-level correlation', source_url: 'https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/', verdict: ok}
  - {claim_id: 9e47cbcf96, passage: 'Publica: "We took the website offline as a precaution"; nau.ch: Basel-Stadt "bisher nicht registriert", Lodur "vorsorglich offline geschaltet"', source_url: 'https://www.publica.ch/en/cyber-attack-software-supplier', verdict: ok}
  - {claim_id: daa83faa40, passage: '"Where that is not feasible, organisations should consider isolating internet-facing applications from public networks until a fix is applied and verified."', source_url: 'https://cert.europa.eu/publications/security-advisories/2026-018/', verdict: ok}
  - {claim_id: d981318083, passage: '"Auch eine Web Application Firewall allein genuegt nicht."; PHP advisory: memory_limit=-1, low post_max_size; BACS: "Blockieren von Multipart-Anfragen am Webserver oder vorgeschalteten Proxy"', source_url: 'https://www.bacs.admin.ch/de/warnung-php-de', verdict: ok}
  - {claim_id: 8e75c40ab8, passage: '"keep it in place" ... "set session.upload_progress.enabled=0 until the next regular bugfix release"; full advisory for CVE-2026-115560 "with the next release"', source_url: 'https://www.php.net/archive/2026.php#2026-10-23-1', verdict: ok}
  - {claim_id: 43b6274d0e, passage: 'Transitional sentence introducing the cited Sansec, CrowdStrike, SANS and Red Hat assessments in the same paragraph', source_url: null, verdict: ok}
  - {claim_id: 97dc2fe137, passage: Editorial sentence tying the cited paragraph to the cited VulnCheck exploit and the cited BACS/CERT-EU/ENISA update advice, source_url: null, verdict: ok}
  - {claim_id: 9f1b2f8f46, passage: 'Derived from cited PHP source backports and VulnCheck: "initial exploit ... chained into RCE on PHP 8.4.26 on x86-64 platforms with ASLR enabled"', source_url: null, verdict: ok}
  - {claim_id: 056d344050, passage: 'Derived and hedged ("a reasonable step") from GHSA: "unauthenticated heap use-after-free, memory disclosure and remote code execution"; Sansec: leaked memory can hold passwords, session tokens, API ke', source_url: null, verdict: ok}
  - {claim_id: 93c50af96a, passage: '"A confirmed exploitation is a session on a vulnerable GreyNoise sensor in which the web server ran operating-system commands." "We have confirmed 1,177 successful exploitations, from 5 attacker IPs";', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: b9f8ce717a, passage: '2026-10-29: /dev/tcp (19:56:40), mkdir -p /var/www/.ssh (19:56:46), IMDS (19:58:50), linpeas+gitleaks downloads (20:05:42); gitleaks dir /var/www/html first at 2026-10-31 01:34:33', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: bd48f793cc, passage: '"Shells have been confirmed only on honeypots and sensors by watchTowr, 0x4D31, and GreyNoise." "This shared kit has not been observed landing on a live victim"; "Session files remained outside the we', source_url: 'https://hunt.io/blog/php2shell-honeypot-shells-root-palo-alto-firewalls', verdict: ok}
  - {claim_id: 8c7f2155bf, passage: '"The affected devices run specific versions of Palo Alto Networks PAN-OS." ... "rooted 25 PAN-OS firewall and management servers"; Unit 42: "has independently verified the same attacker''s tooling and ', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 4b3fc13d9a, passage: 'Derived from GreyNoise definition: confirmed exploitation is a sensor session in which the web server ran OS commands (not compromised production servers)', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: a7a9af82e0, passage: 'Supersession sentence; Dream 2026-10-29 names PAN-OS, replacing the "one unnamed vendor" of the 2026-10-29 section', source_url: 'https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers', verdict: ok}
  - {claim_id: 34a6df94a9, passage: 'Record summary matches the section: GreyNoise 10-28 start; reverse shells, .ssh, metadata, secret scanning (10-29/10-31); Hunt.io failed-attempt and relay; Dream names PAN-OS, Unit 42 verified', source_url: 'https://php.events.greynoise.io/', verdict: ok}
  - {claim_id: 1366c2190c, passage: 'Headline: MSRC "removes seven certificates ... from the Windows trust list"; Java (Oracle alert), Python 3.15.2 etc., Go 1.27.3, GitLab 19.5.3 updates verified', source_url: 'https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys', verdict: ok}
  - {claim_id: f95f588ebc, passage: 'Summary verified: Oct 17 report; Microsoft Oct 26 OOB removal and Oct 27 Edge; Go 1.27.3/1.26.10 CVE-2026-111943; GitLab 19.5.3; Python denylist; Java second update; Cisco ISE Dec 2026/Apr 2027', source_url: 'https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys', verdict: ok}
  - {claim_id: 5de31c470d, passage: 'Tracker: Go 1.27.3, 1.26.10; pip 26.2.2; GitLab runner 19.5.1; Java row; Python post: 3.15.2, 3.14.10, 3.13.18, 3.12.16, 3.11.18; Oracle rev 2 adds Database Server, AHF, OPatch; curl test hosts', source_url: 'https://emudhra.we-have-a-problem.com/', verdict: ok}
  - {claim_id: d6c4ab5efb, passage: 'MSRC: "make sure your update process delivers the updated Disallowed Certificate Trust List and the upcoming trust-list changes"; "replace ... before the changes reach your devices"; Google: G3 remova', source_url: 'https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys', verdict: ok}
  - {claim_id: 76b2df2422, passage: 'Cisco v1.5: FW ASA/FTD/FMC guidance; Secure Email Gateway and SEWM "cli->updatenow"; DAG 3.2.0; Duo Network Gateway 3.4.1; Duo Agentic Authorization Connector 1.0.1; ThousandEyes Application-hosting A', source_url: 'https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r', verdict: ok}
  - {claim_id: 60b4484dcc, passage: 'Oracle 91403 risk matrix: JSSE, 9.1, Network, no auth; builds 8u511, 8u511-perf, 11.0.33, 17.0.21, 21.0.13, 25.0.5, 27.0.1 (OpenJDK list in OpenJDK advisory)', source_url: 'https://www.oracle.com/security-alerts/alert-cve-2026-91403.html', verdict: ok}
  - {claim_id: 7efd2407e4, passage: 'Rev 2 2026-October-30: DB 19.3-19.32, 21.3-21.23, 23.4.0-23.26.3 (not client-only); TFA 26.3-26.10; OPatch 12.2.0.1.16-12.2.0.1.52; SPMS 23.3.4-23.3.6; tracker Java row: Oracle JDK 27.0.1.0.3 ... 8u51', source_url: 'https://www.oracle.com/security-alerts/alert-cve-2026-114820.html', verdict: ok}
  - {claim_id: af95eb156a, passage: '"Security content in all five releases - CVE-2026-115557 ... Distrust compromised eMudhra intermediate CA keys"; "Normal uses of pip ... are now safe ... even if pip hasn''t been updated yet"', source_url: 'https://blog.python.org/2026/10/python-3152-31410-31318-31216-31118/', verdict: ok}
  - {claim_id: ce3a26f02c, passage: '"On Saturday, October 17, 2026 ... Chrome Root Program received a report"; "generated with insufficient randomness"; Mozilla: "On Saturday, October 17, at 20:06 UTC, Mozilla received a report"', source_url: 'https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/', verdict: ok}
