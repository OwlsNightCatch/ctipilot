  - {claim_id: 4c17639e15, passage: '"no TLS certificates chaining to these six intermediate CAs were logged to Certificate Transparency (CT) before our blocking action ... This includes Chrome"', source_url: 'https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/', verdict: ok}
  - {claim_id: b47254e517, passage: '"We do not know if attackers exploited the flawed key generation to target these clients."', source_url: 'https://emudhra.we-have-a-problem.com/', verdict: ok}
  - {claim_id: 1d03b20913, passage: '"blocked in Firefox and Chrome since the 17th of October, on Microsoft platforms since the 20th and on Apple products since the 22nd"; "The CA has also revoked the compromised intermediate certificate', source_url: 'https://emudhra.we-have-a-problem.com/', verdict: ok}
