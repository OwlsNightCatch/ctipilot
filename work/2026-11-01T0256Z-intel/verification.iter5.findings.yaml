- code: F11
  category: editorial-advisory
  section: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates (Update 2026-10-25 section vs cves[CVE-2026-115557].affected)
  item: "(low confidence) dated section states an ENISA reading that the live record and the entry's own frontmatter no longer carry"
  url_or_quote: "2026-10-25 section: \"ENISA's record scores it 9.4 (CVSS 4.0) and lists CPython before 3.16.0 as affected\" ([ENISA EUVD, 2026-10-24](https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-109299)); cves[CVE-2026-115557].affected now lists the per-branch ranges \"per ENISA's record\""
  summary: "Advisory. The EUVD record fetched this iteration lists 3.15.0 <3.15.2, 3.14.0 <3.14.10, 3.13.0 <3.13.18, 3.12.0 <3.12.16, 0 <3.11.18 and 3.16.0a1 <3.16.0 (dateUpdated 2026-10-27), so the older dated sentence was probably true when written but now sits beside a frontmatter field that says otherwise, and the 2026-11-01 section does not say the record changed. One clause in the 2026-11-01 section (ENISA's record, updated 2026-10-27, now lists per-branch ranges) would reconcile them; leaving it is acceptable because the 2026-10-25 section is a dated snapshot."
- code: F11
  category: editorial-advisory
  section: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release (Update 2026-11-01 section)
  item: "(low confidence) 'recovered' attaches to the web shells rather than to Dream's artifacts"
  url_or_quote: "\"Dream recovered web shells left on 24 firewalls, 22 of them parked with nothing further done, and a boot-persistent tunnel into the internal network of a US government-affiliated organization that it assesses is likely still active\" ([Dream Research, 2026-10-29])"
  summary: "Advisory. Dream says it recovered attacker artifacts (target lists, exploitation logs, about 40 scripts) that show a 103-byte web shell planted on each of 24 rooted firewalls and that 'The 22 other rooted firewalls remain parked with active webshells'; it did not recover the web shells themselves. Facts are right, verb is loose: 'Dream's recovered artifacts show web shells planted on 24 firewalls' would match the page."
