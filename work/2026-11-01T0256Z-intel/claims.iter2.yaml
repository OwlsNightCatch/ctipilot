claims:
  - claim_id: 46ac76d066
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-46300 (\"Fragnesia\", CVSS 7.8) is a local privilege escalation in the Linux kernel's xfrm ESP-in-TCP path, one of three CVEs Red Hat groups as \"Dirty Frag\"; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root, and Dream Research reports such a chain against 25 Palo Alto Networks PAN-OS firewall and management servers and a US government-affiliated network. Its public exploit overwrites /usr/bin/su in the page cache, and Red Hat confirms RHEL kernels are affected (CISA KEV, 2026-10-28 · Dream Research, 2026-10-27 · Red Hat RHSB-2026-003)."
  - claim_id: ba4b965a94
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-11-01T03:28:54Z"
    kind: cited
    text: "Dream Research updated its report on 2026-10-29 to say that the firewalls rooted with a custom PHP2Shell build chained to this kernel flaw run Palo Alto Networks PAN-OS, and counts 25 rooted PAN-OS firewall and management servers; Unit 42 says it independently verified the attacker's tooling and confirmed the reported results ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 5e2d007b04
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-11-01T03:28:54Z"
    kind: record-summary
    text: "Dream Research's updated report names Palo Alto Networks PAN-OS as the product in the chain that paired the PHP2Shell flaws with this kernel flaw, and counts 25 rooted PAN-OS firewall and management servers; Unit 42 says it independently verified the tooling and results."
  - claim_id: e185d1ed08
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php, with no upstream release for PHP 8.1 and older and a third path, CVE-2026-115560, left unfixed (keep session.upload_progress.enabled=0). CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after a honeypot operator documented 35 successful code executions on PHP 8.4.26 under single-worker mod_php and VulnCheck extended its working exploit across builds of PHP 8.2 to 8.5; GreyNoise's sensors have recorded shell sessions since 2026-10-28, Palo Alto Networks' advisory now reports active exploitation against internet-exposed PAN-OS management interfaces, Dream Research recovered a custom build chained with the Linux kernel flaw CVE-2026-46300 that rooted 25 Palo Alto Networks PAN-OS firewall and management servers and attacked a US government-affiliated network, SRF links a data theft at TCS Camping's booking-system supplier to the flaws without naming a CVE, and Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to them. As of 2026-10-22 BACS knew of no attack in Switzerland but said federal PHP applications were affected and that it had no complete overview of the update status, and Swiss cantons, universities, Cyon, the Lodur platform and Publica took sites offline as a precaution."
  - claim_id: ecd645e617
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
  - claim_id: 3dcdf4e309
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[1]"
    kind: frontmatter
    text: "After updating, set session.upload_progress.enabled=0 on every PHP host and keep it there until PHP's next regular bugfix release: CVE-2026-115560, which the October releases do not fix, needs session upload progress to be enabled."
  - claim_id: a310932421
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[2]"
    kind: frontmatter
    text: "List every appliance and management server whose web interface embeds PHP (firewalls, network access control, wireless controllers, backup, storage and security consoles), take each interface off the internet and install its vendor's PHP2Shell fix, because Dream Research reports Palo Alto Networks PAN-OS firewalls rooted through an exposed management interface."
  - claim_id: 8e69156052
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The PHP project released PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix two critical vulnerabilities that can allow unauthenticated remote code execution, CVE-2026-109618 and CVE-2026-109619, both CVSS 4.0 9.2, and urges all PHP users to update immediately ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5", "https://www.php.net/archive/2026.php#2026-10-20-1"]
  - claim_id: 66ae9cbe01
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109618 is memory corruption when PHP handles an out-of-memory error: it aborts the request with longjmp() while internal request data is only partly initialised, and request cleanup then treats the invalid data as valid ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w"]
  - claim_id: 35f3424034
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109619 is stale global state: request-owned state survives a fatal error after its memory is freed, and a later request on the same worker uses it ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: ead4c57df5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Every PHP installation serving web requests is at risk, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP and LiteSpeed; the project rates mod_php highest, with a demonstrated exploit where an unauthenticated request can trigger the attack before any application code runs ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5"]
  - claim_id: 302ee087a5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The confirmed impact is unauthenticated code execution as the web worker account, validated against mod_php with default settings, and for the second flaw against both mod_php and FPM through session upload progress, which is on by default and needs no session_start() call ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w", "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: 7840f1377b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The advisory for the second flaw also lists heap use-after-free and memory disclosure among the confirmed impacts ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: c384313734
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and Sansec says the leaked worker memory can hold passwords, session tokens, API keys and TLS private keys from other requests, and files the upload-progress memory disclosure under CVE-2026-109618 where the PHP advisories list it under CVE-2026-109619 ("
    urls: ["https://sansec.io/research/php2shell"]
  - claim_id: 42633244b6
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The fixed branches are 8.2 to 8.5; PHP 8.1 and older no longer receive updates, and the project published minimal source backports for 7.4, 8.0 and 8.1 for people who build from source, while distributions and LTS vendors received the patches in advance ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5"]
  - claim_id: 4f936712bd
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Cloudflare says all web servers running PHP 5.4 or later are affected ("
    urls: ["https://blog.cloudflare.com/php-vulnerabilities-waf-protection/"]
  - claim_id: 786a34f4ab
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The fix is in the runtime, so updating WordPress, a plugin or a theme does not change exposure ("
    urls: ["https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/"]
  - claim_id: 6262f98bb8
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Products that embed PHP are affected through it: Palo Alto Networks lists PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected, with all twenty hotfixes released, and notes that the issue applies to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 6993357403
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and ENISA, the Commission, CERT-EU, Europol EC3 and the CSIRTs network point to NCSC-NL's repository for software that bundles PHP ("
    urls: ["https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities"]
  - claim_id: 1ccdeae8e6
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26 and revised its alert the same day; the alert names no actor and does not say how CISA learned of the exploitation ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/21/critical-vulnerabilities-php-require-immediate-patching", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: bf076f4666
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The first documented code execution is a honeypot report by Adel Karimi of Perplexity dated 2026-10-24: on three disposable targets running PHP 8.4.26 under single-worker Apache mod_php, 35 execution-stage requests were each followed by a shell started directly by an Apache worker, in a four-stage multipart chain (memory pressure, memory disclosure, more memory pressure, an execution request adjusted to the leaked layout); the chain is consistent with CVE-2026-109618, the records do not establish a CVE-2026-109619 path and no second-stage download was observed ("
    urls: ["https://github.com/0x4D31/honeypot-data/blob/main/reports/php2shell/2026-10-24-confirmed-rce.md", "https://www.securityweek.com/php2shell-exploitation-moves-from-probes-to-working-shells/", "https://www.bleepingcomputer.com/news/security/php2shell-security-flaws-now-sucessfully-exploited-in-the-wild/"]
  - claim_id: 6194802da2
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Earlier reports describe scanning and attempts: Cloudflare saw attack traffic against its customers while the flaws were still leaked ("
    urls: ["https://blog.cloudflare.com/php-vulnerabilities-waf-protection/"]
  - claim_id: 12679984ed
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), watchTowr's honeypots recorded exploitation on 2026-10-21 ("
    urls: ["https://watchtowr.com/intelligence/php-cve-2026-109618-faq/"]
  - claim_id: e602f4a631
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and VulnCheck's canary hosts recorded scanning from 08:37 UTC that day ("
    urls: ["https://www.vulncheck.com/blog/php2shell-vulnerabilities"]
  - claim_id: 6ea9f3a50c
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "VulnCheck says it holds a working exploit for CVE-2026-109618 that, as of 2026-10-26, supports mod_php on PHP 8.2.28 to 8.2.34, 8.3.22 to 8.3.35, 8.4.10 to 8.4.26 and 8.5.10 to 8.5.11 with default settings and display_errors off, and WordPress on default Docker installs ("
    urls: ["https://www.vulncheck.com/blog/php2shell-vulnerabilities"]
  - claim_id: 31835c5835
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Palo Alto Networks' advisory for both flaws now states that active exploitation has been observed targeting its management interface exposed to the internet, after a copy of 2026-10-27 said very limited exploitation, and names no victim or actor ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618", "https://web.archive.org/web/20261027171028/https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: cb88a44e72
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "); Dream Research's recovered artifacts, described next, add a detailed account of a production compromise through these CVEs, while Unit 42 retracted on 2026-10-25 its update of 2026-10-23 that had linked an attack on a European government agency to these flaws and says it is unable to confirm that the initial access is associated with them ("
    urls: ["https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 7081acb7ee
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and CrowdStrike, Wordfence and Sophos reported no successful exploitation ("
    urls: ["https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/", "https://www.wordfence.com/blog/2026/10/attacks-on-php2shell-continue-but-no-known-compromises-as-a-result-yet/", "https://www.sophos.com/en-us/blog/proof-of-concept-exploit-released-for-php-vulnerabilities-109618-109619"]
  - claim_id: 1db5576450
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Dream Research describes the chain it recovered: a custom PHP2Shell build tailored to the management web server of Palo Alto Networks PAN-OS (PHP 8.0.30), combined with the Linux kernel flaw CVE-2026-46300, gave unauthenticated root on 24 internet-facing firewalls and led, through the second of two firewalls of a US government-affiliated organization (the first crashed), to an outbound SSH tunnel, the rooting of the organization's firewall management server and a password-spraying attack on its Active Directory, and CISA's entry for the kernel flaw says the same chaining ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 3507d31a6a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "In Switzerland, SRF reported on 2026-10-26 that TCS Camping is warning about 15,000 customers in connection with the PHP flaw after a data theft at its booking-system supplier Camping.Care, and Blick, citing SRF, writes that the attackers used the two flaws; neither names a CVE ("
    urls: ["https://www.srf.ch/sendungen/kassensturz-espresso/espresso/php-sicherheitsluecke-betrugsversuche-nach-datenleck-im-buchungssystem-fuer-tcs-camping", "https://www.blick.ch/wirtschaft/hackerangriff-auf-tcs-camping-15000-kunden-gewarnt/nws2bcn"]
  - claim_id: 57703dc293
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "PHP posted an informational advisory on 2026-10-23 for a third code-execution path, CVE-2026-115560, that the October releases do not fix: it needs an application that sets session.serialize_handler to php_binary or php_serialize, switches it to php with ini_set() before session_start(), and leaves session upload progress enabled; PHP calls it an unlikely vector, issues no emergency release, suggests session.upload_progress.enabled=0 until the next regular bugfix release and will publish the full advisory then ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-23-1"]
  - claim_id: 8e3c63971a
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "PHP has not stated affected versions or a severity score for CVE-2026-115560, and no exploitation is reported ("
    urls: ["https://thehackernews.com/2026/10/urgent-php-warns-of-another-unpatched.html"]
  - claim_id: e9ef6009db
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Sansec says an attack needs specific knowledge of the target server and specific conditions on it, that nobody has shown a single request that works against any vulnerable server, as there was for Log4Shell and Shellshock, that a researcher who tested the public proofs of concept found they do not work against a default PHP installation, and that mass exploitation is therefore less likely than it first expected, while it advises updating anyway ("
    urls: ["https://sansec.io/research/php2shell"]
  - claim_id: e487aa83ca
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CrowdStrike expects no single universal exploit but says a reliable one is feasible against a specific deployment profile, such as a fixed Docker image, because an attacker can calibrate offsets and heap grooming in advance ("
    urls: ["https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/"]
  - claim_id: 5527e4b057
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and the SANS Internet Storm Center, reading the public proofs of concept, finds a universal, reliable one-click exploit quite difficult ("
    urls: ["https://isc.sans.edu/diary/33452"]
  - claim_id: 689d6bdce5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Red Hat rates CVE-2026-109618 Important (CVSS 3.1 8.1 with high attack complexity, against 9.8 at NVD), says reliable exploitation requires precise heap manipulation and timing, and says its standard Red Hat Enterprise Linux deployments use PHP-FPM, whose workers exit on early initialization failures, so code execution is difficult in practice and typically needs non-default behavior such as parsing a second request body during script execution ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-109618"]
  - claim_id: 7bcd510a17
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Vendors of products that embed PHP report as follows: Citrix lists the NetScaler management GUI on every supported version ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
