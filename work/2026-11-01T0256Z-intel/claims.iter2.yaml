    kind: record-summary
    text: "Google Threat Intelligence Group and Mandiant report that since late August they have seen ARTEX, PentAGI and CAIRN operated inside incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations; they track the Wiz-observed ARTEX campaign as UNC7228, overlapping Storm-0940, and say the original ARTEX repository was taken down in October while forks keep spreading it. The agent's log signature is bursts of roughly 2 to 25 seconds, error-driven retries and, in one case, MySQL general-log poisoning to write JSP web shells."
