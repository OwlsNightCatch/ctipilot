    attribution: Cisco PSIRT
    source_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r
  - quote: GitLab has removed trust for eight eMudhra intermediate CA certificates whose private keys have been compromised.
    attribution: GitLab
    source_url: https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-5-3-released/
  extended_notes: 'Suggested Admiralty: A2 (vendor primaries, corroborated by BleepingComputer). The Cisco advisory''s remediation table is long; the load-bearing rows for a Swiss public-sector estate are ASA/FTD/FMC (guidance page, TLS policy), Secure Email Gateway (cli updatenow pulls Trusted Root 2.8 when updates are manual), ISE patch dates (3.5P5 Dec 2026; 3.3P13 and 3.4P8 Apr 2027) and the ''still under investigation'' list (IOS XE, Catalyst 9800 WLC, Nexus 9000, MDS 9000). Exposure: Windows machines that do not receive Microsoft CTL updates (air-gapped, update-restricted, automatic CTL updates disabled) keep trusting the six G3 roots until the OOB update or a trust-list refresh is applied; any internal service whose certificate chains to the removed roots will start failing validation once the change lands. Detection: unchanged from the entry (certificate chains in TLS metadata containing the eight intermediates); add an inventory check of machine Trusted Root stores for the six G3
    roots after the update. Defender takeaway: deliver the Windows update to disconnected hosts, inventory certificates under the removed roots before devices receive the trust-list change, and track Cisco''s v1.5 dates for ISE and IOS XR. Dropped from this item: Splunk SVD-2026-1014 and Veeam KB4952 (relayed by search results only, not fetched).'
