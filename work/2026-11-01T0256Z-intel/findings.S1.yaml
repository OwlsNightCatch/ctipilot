- title: 'eMudhra CA key compromise, vendor follow-ups since the entry''s last update: Microsoft''s out-of-band Windows update removes seven eMudhra-hierarchy certificates from the Windows trust list, Cisco''s advisory (v1.5, 2026-10-30) now lists remediation for Secure Firewall, email gateways and ISE, and GitLab 19.5.3 distrusts the eight intermediates'
