- title: 'Android ''SMS of Death'' (CVE-2026-58882 per BleepingComputer): one malformed WAP Push SMS crashes the telephony process with no user interaction and drops calls including emergency calls; public proof of concept; fixed in the October 2026 update for Android 14 to 17, Android 12 and 13 stay unpatched'
