  summary: 'TeamViewer''s bulletin TV-2026-1011 (EUVD records of 2026-10-27, bulletin page dated 2026-10-28) fixes three flaws in version 15.83. CVE-2026-111585 (CVSS 3.1 8.8) is an integer overflow in the remote-control screen decompression of the Full Client, Portable and Remote Control app on Windows, Linux, macOS and Android: a host that announces an oversized screen surface makes the viewer allocate a too-small buffer, which crashes the viewer or, per Remedio, can be steered to code execution in the viewer; exploitation requires the user to open a session to an attacker-controlled or compromised host, which is the victim''s normal mode of operation. CVE-2026-92372 (8.8) is an out-of-bounds write in the screen-image decoder of the Linux and macOS Full Client, reachable the same way or by opening a crafted .tvs session recording. CVE-2026-92374 (7.8) is a TOCTOU and symlink flaw in the macOS privileged helper that gives root to a local low-privileged user. TeamViewer says it is not aware
    of exploitation in the wild; NCSC Switzerland lists the exploitation status as unknown. Remedio''s write-up documents the root cause and a working code-execution chain on a fully updated Windows client, which makes a copycat exploit more likely. Fixed versions: 15.83 for Full Client, Host, Portable and the Android remote-control app; for legacy trains 15.64.10 (Windows 7 and 8), 14.7.48868 (Windows, Linux, macOS), 13.2.36231 (Windows), 13.2.154008 (Linux), 13.2.154007 (macOS).'
