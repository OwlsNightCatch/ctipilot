  borderline_reason: 'freshness: the newest sources are 2026-10-30 (NCSC-CH 14:04Z, SecurityWeek, heise), about 37 h before run start and inside the previous run''s window, which did not carry it; no exploitation known, and the attack needs the technician to connect to a hostile host. Kept because NCSC Switzerland issued its own advisory and a public exploit write-up exists.'
  evidence:
  - quote: At the time of publication, TeamViewer is not aware of any active exploitation in the wild.
    attribution: TeamViewer
    source_url: https://www.teamviewer.com/en-us/resources/trust-center/security-bulletins/tv-2026-1011/
  - quote: Exploitation requires a user to establish a remote-control session to an attacker-controlled or compromised host.
    attribution: TeamViewer
    source_url: https://www.teamviewer.com/en-us/resources/trust-center/security-bulletins/tv-2026-1011/
  - quote: Victim must connect to malicious host or open crafted session recording; local low-privileged access for macOS LPE.
    attribution: NCSC Switzerland
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13123
  - quote: The surface is reachable in the default configuration.
    attribution: Remedio, quoted by SecurityWeek
    source_url: https://www.securityweek.com/teamviewer-flaw-could-let-malicious-hosts-take-over-support-technicians-machines/
  extended_notes: 'Exposure: the viewer role is the victim, so the exposed assets are help-desk and administrator workstations that run the TeamViewer Full Client, Portable or the Android app and connect to endpoints they do not fully control; the vendor''s version table, not the product UI, is the way to read the installed build (versions before 15.83 on the current train). Detection concept, inferred from the stated mechanism (not from a source''s detection guidance): a viewer-side TeamViewer process crashing repeatedly when a session opens to one particular host is the visible denial-of-service form; code execution would show as the TeamViewer viewer process spawning an unexpected child process (Remedio routes the call to WinExec). Hardening: update viewers first (15.83), then Host installs; no source offers a workaround short of the update. Suggested Admiralty: A2 for the fix facts (vendor and national CERT), exploitation status unknown to both.'
