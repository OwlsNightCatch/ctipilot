  discovery_trace: 'first seen at: BleepingComputer feed, URL https://www.bleepingcomputer.com/feed/ (item ''New Android SMS of Death exploit can remotely crash unpatched phones'', 2026-10-31T15:35Z) -> primary: researcher write-up, URL https://smsofdeath.com/ -> primary: AOSP fix commit, URL https://android.googlesource.com/platform/frameworks/opt/telephony/+/735d9672603fa206c4b43cb668c1aa273db70b97 -> corroborating: heise (feed https://www.heise.de/security/feed.xml), URL https://www.heise.de/news/SMS-des-Todes-Sicherheitsluecke-laesst-Android-Smartphones-abstuerzen-11506526.html -> absence check: Android Security Bulletin October 2026, URL https://source.android.com/docs/security/bulletin/2026/2026-10-01'
  summary: 'A researcher published on 2026-10-29 a zero-click remote denial of service in Android''s telephony framework and, per BleepingComputer on 2026-10-31, released a proof-of-concept that sends the trigger from another Android device. WapPushOverSms.decodeWapPdu() reads the WSP header length as a uintvar, casts the long to int without a range check and allocates a byte array of that size; the 5-byte value 88 80 80 80 00 becomes -2147483648, the allocation throws NegativeArraySizeException on the telephony main thread and com.android.phone dies. The message arrives as a data SMS (WAP Push, port 2948) and never appears in the inbox. Active calls, emergency calls included, drop; Android retries the stored message at each restart and carriers redeliver unconfirmed ones, so the crash repeats: about 20 messages could leave a phone in a reboot loop, one Android 12 device rebooted into recovery about every 90 seconds, and recovery then needs ADB. Google''s fix (commit 735d967, authored 2026-06-15)
    catches the RuntimeException and deletes the poison message from the raw SMS database; per BleepingComputer it shipped in the October 2026 Android updates for Android 14 to 17 but is not listed in the October bulletin, and the researcher says Android 12 and 13 devices outside the update window run the same code and receive no fix. The CVE id comes from BleepingComputer alone: it is not in the October bulletin text, and an NVD query on 2026-11-01 returned no record. No in-the-wild use is reported; the impact is denial of service, not code execution.'
