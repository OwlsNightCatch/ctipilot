  summary: 'Three vendor primaries moved after the entry''s last update (2026-10-25). Microsoft released an out-of-band Windows update on 2026-10-26 (KB5134133 for Windows 11 24H2/25H2/26H2 and KB5134125 for Windows 10 21H2/22H2, per BleepingComputer) that removes seven certificates from the Windows trust list: six eMudhra G3 roots and an AAA Certificate Services cross-sign; Edge dropped the same seven on 2026-10-27. Microsoft stresses that removing a root is a separate and broader decision than blocking the compromised intermediates, that software which does not check revocation or the disallowed-certificate list could still accept certificates tied to the compromised keys if trust is restored locally, and that certificates chaining to the removed roots need replacing before the change reaches a device; disconnected devices must get the update through their own process. Cisco''s informational advisory reached version 1.5 on 2026-10-30. It lists Secure Firewall ASA, FTD and FMC (guidance
    page), Secure Email Gateway and Secure Email and Web Manager (auto-updated to Trusted Root 2.8), Packaged and Unified Contact Center Enterprise (CSCwx36769) and RTMT (CSCwx45230) as impacted with remediation steps, and lists fixed releases still to come: ISE 3.5P5 (Dec 2026), ISE 3.3P13 and 3.4P8 (Apr 2027), IOS XR 26.4.1 (2026-11-30), IP Phone 8800 14.4(1)ES1 (2026-11-13) and Cyber Vision 5.6.2 (Nov 2026), while IOS XE, MDS 9000 and Nexus releases are still under investigation; Cisco knows of no malicious use. GitLab''s patch release of 2026-10-29 removes trust for the eight intermediates in self-managed CE/EE (CVE-2026-111943, the id Go also uses) and says GitLab Runner (19.5.1) and the AI Gateway must be updated separately. No exploitation of forged certificates is reported by any of these sources.'
