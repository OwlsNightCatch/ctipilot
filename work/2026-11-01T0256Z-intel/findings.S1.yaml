    attribution: SMS of Death researcher write-up
    source_url: https://smsofdeath.com/
  extended_notes: 'Exposure: any Android 12 to 17 handset that can receive SMS; patched on 14 to 17 only when the device runs the October 2026 update (security patch level 2026-10-01 or later). Android 12 and 13 have no fix to apply, so the lever is retirement or replacement. Detection concept (from the researcher''s logcat excerpt): repeated com.android.phone FATAL EXCEPTION with NegativeArraySizeException at WapPushOverSms.decodeWapPdu, and call drops with DisconnectCause CS_DEATH; at fleet level, MDM telemetry showing the telephony process restarting or devices looping into recovery. Recovery of an affected handset needs a PC with ADB; the researcher warns against choosing ''Wipe data'' in recovery (heise). Suggested Admiralty: C3 (researcher self-published, press corroboration of the same claim, CVE id single-sourced); the AOSP commit is a first-party A-class primary for the fix itself.'
