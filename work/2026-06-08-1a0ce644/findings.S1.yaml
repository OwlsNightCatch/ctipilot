items:
  - title: "CVE-2026-3300 — Everest Forms Pro WordPress plugin: unauthenticated PHP eval() injection actively exploited in mass campaign (29,300+ blocked attempts)"
    sources:
      - url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
        publisher: "Wordfence"
        date: "2026-06-06"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/critical-everest-forms-pro-flaw-exploited-to-take-over-wordpress-sites/"
        publisher: "BleepingComputer"
        date: "2026-06-06"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/hackers-exploit-critical-everest-forms.html"
        publisher: "The Hacker News"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/news/security/critical-everest-forms-pro-flaw-exploited-to-take-over-wordpress-sites/ (published 2026-06-06) → primary: Wordfence, URL https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/06/hackers-exploit-critical-everest-forms.html"
    summary: |
      CVE-2026-3300 (CVSS 9.8) is a PHP code injection through `eval()` in the Calculation Addon's `process_filter()` function of Everest Forms Pro (WordPress plugin, ~4,000 active installs). The function concatenates user-submitted form field values into a PHP code string and passes them directly to `eval()` after `sanitize_text_field()`, which does not escape single quotes or PHP syntax characters. An unauthenticated attacker opens a text field, injects a single quote to close the string literal, appends a `wp_insert_user()` call to create an administrator account, and comments out the remainder with `//`. The patch (version 1.9.13) was released 18 March 2026 — the delay between patch availability and mass exploitation is the key defender concern. Wordfence telemetry records 29,300+ blocked attempts dating to 13 April 2026, with a single-day spike of 17,900 on 16 May; as of 6 June, 16 attempts in the preceding 24 hours. The observed primary payload creates an administrator account named "diksimarina". CVE prerequisite: the Calculation Addon must be present in the form. Affected versions: ≤ 1.9.12; patched: 1.9.13+. Detection: look for unexpected WordPress admin account creation events (Action: `user_register` with role `administrator`) or POST requests to `/wp-admin/admin-ajax.php` or the plugin's AJAX endpoints containing `eval`-typical single-quote patterns. Hardening: update to 1.9.13+, disable Calculation Addon if not required, enforce WAF rule blocking `eval(` in form-submission parameters.
    ch_eu_nexus: "Global; WordPress is widely used across Swiss and EU public-sector web properties including cantonal agencies and municipal sites"
    public_sector_nexus: "indirect — any public-sector WordPress deployment with Everest Forms Pro active is exposed"
    sector: "public-sector, e-government, web-services"
    cves: [CVE-2026-3300]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The vulnerability is due to the Calculation Addon's process_filter() function concatenating user-submitted form field values into a PHP code string without proper escaping before passing it to eval()"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-everest-forms-pro-flaw-exploited-to-take-over-wordpress-sites/"
      - quote: "Wordfence observed exploitation beginning on April 13, 2026, and said more than 29,300 exploit attempts had been blocked to date"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-everest-forms-pro-flaw-exploited-to-take-over-wordpress-sites/"
    extended_notes: |
      The vulnerability discovery credit goes to researcher h0xilo, who submitted it through Wordfence's Bug Bounty program in February 2026. The protracted exploitation window (patch issued March 18; widespread exploitation from April 13; still ongoing June 6) illustrates the well-documented "patch lag" problem for commercial WordPress plugins, where the plugin vendor patches but a large portion of the install base does not update promptly.

  - title: "C0XMO botnet (Gafgyt variant): cross-platform Mirai rival exploiting 5-year-old DD-WRT UPnP buffer overflow, 19-method DDoS, rival-killer capability"
    sources:
      - url: "https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo"
        publisher: "FortiGuard Labs"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/c0xmo-botnet-spreads-via-dd-wrt-router-flaw-kills-rival-malware/"
        publisher: "BleepingComputer"
        date: "2026-06-07"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/news/security/c0xmo-botnet-spreads-via-dd-wrt-router-flaw-kills-rival-malware/ (published 2026-06-07) → primary: FortiGuard Labs, URL https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo (2026-06-03)"
    summary: |
      FortiGuard Labs documented C0XMO, a new cross-platform Gafgyt botnet variant exploiting CVE-2021-27137 — a stack buffer overflow in the UPnP SSDP parser of DD-WRT router firmware (all changesets before 45723). The exploit sends an oversized `ST:uuid` value in a crafted M-SEARCH UDP packet to port 1900, triggering a stack overflow and downloading the C0XMO payload directly to the device's temporary filesystem (/tmp/.sys, /var/tmp/.sys, /dev/shm/.sys). C0XMO is compiled for ARM, MIPS R3000, MC68000, PowerPC, SuperH, x86, and AMD64 — covering virtually the full range of SOHO and embedded Linux devices. Notably, it separates its propagation module into a standalone Python script (ELF/Gafgyt.C0MOX alongside Python/Gafgyt.C0MOX), enabling independent updates to scanning and exploitation code. The botnet communicates with C2 at 85.215.131.70 using a custom handshake protocol with shared secrets, and supports 19 DDoS attack methods including UDP bypass floods, TCP SYN floods, NTP/Memcached amplification, HTTP GET floods, Cloudflare bypass HTTP floods, and Discord/Valve game-server-specific floods. A competitive feature terminates rival botnet processes on the host. Persistence via cron (every 15 minutes) and shell profile modification (.bashrc, .bash_profile). FortiGuard observed the C2 originating from Germany and targeting a Japanese technology company. CVE-2021-27137 is a 5-year-old flaw; any DD-WRT deployment below changeset 45723 is exposed. Detection: Sysmon/EDR monitoring of cron modification and hidden-directory process spawning on Linux gateway devices; network IDS signatures for oversized UPnP M-SEARCH ST fields. Hardening: update DD-WRT firmware, disable UPnP/SSDP where not required, block UDP 1900 at the perimeter.
    ch_eu_nexus: "Indirect — DD-WRT is widely used across European SME, public-sector, and home-office networks; Swiss cantonal networks with self-managed SOHO gateways are exposed"
    public_sector_nexus: "indirect"
    sector: "telco, SME, public-sector edge infrastructure"
    cves: [CVE-2021-27137]
    actors_campaigns_malware: ["C0XMO", "Gafgyt"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The threat actor delivered the malware by exploiting CVE-2021-27137, a stack buffer overflow in the UPnP service of vulnerable DD-WRT router firmware"
        attribution: "FortiGuard Labs"
        source_url: "https://www.fortinet.com/blog/threat-research/inside-cross-platform-propagation-of-new-gafgyt-variant-c0xmo"
      - quote: "The botnet supports 19 DDoS attack methods and communicates with a hardcoded command-and-control server"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/c0xmo-botnet-spreads-via-dd-wrt-router-flaw-kills-rival-malware/"

  - title: "Silent Ransom Group (UNC3753 / Luna Moth): vishing callback campaign targets law firms with fake IT help-desk calls, installs RMM tools, exfiltrates within 30 minutes"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/silent-ransom-group-targets-law-firms-with-fake-it-support-calls/"
        publisher: "BleepingComputer"
        date: "2026-06-07"
        role: "primary"
      - url: "https://www.darkreading.com/endpoint-security/fbi-silent-ransom-group-vishing-law-firms"
        publisher: "Dark Reading / FBI"
        date: "2026-06-07"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/news/security/silent-ransom-group-targets-law-firms-with-fake-it-support-calls/ (published 2026-06-07) → corroborating: Dark Reading/FBI, URL https://www.darkreading.com/endpoint-security/fbi-silent-ransom-group-vishing-law-firms"
    summary: |
      The FBI and multiple threat-intelligence firms documented an escalating campaign by Silent Ransom Group (also tracked as UNC3753, Luna Moth, Chatty Spider) against law firms and professional-services organisations in June 2026. The attack chain does not rely on traditional malware delivery: (1) invoice-themed phishing emails arrive from consumer email accounts — no malicious links or attachments; (2) follow-up phone calls from attackers impersonating corporate IT staff instruct the target to join a remote support session via Microsoft Teams, Zoom, Quick Assist, or Microsoft Terminal Services; (3) during the session, the threat actor installs remote monitoring and management tools (AnyDesk, Zoho Assist, Bomgar, SuperOps); (4) WinSCP or Rclone exfiltrates contracts, tax records, SSNs, M&A files, and sensitive client documents; (5) ransom demand is delivered within 30 minutes of the actor's exit. DNS fast-flux infrastructure using residential proxies obscures C2. Three-day extortion deadline threatens client notification. Law firms account for ~25% of all ransomware-related incidents tracked in Q1 2026 (fourth-most-targeted sector). The group's leak site lists ~100 victim organisations as of June 2026. MITRE ATT&CK mapping: T1566 (Phishing), T1566.004 (Spearphishing Voice), T1219 (Remote Access Software), T1005 (Data from Local System), T1048 (Exfiltration Over Alternative Protocol). Detection: endpoint monitoring for unexpected installation of AnyDesk/Zoho Assist/Bomgar/SuperOps processes; EDR alert on WinSCP/Rclone spawning from user-interactive sessions; DNS anomaly detection for fast-flux resolver patterns. Hardening: application-allowlisting for RMM tools, MFA on VPN/remote desktop, user awareness training on vishing.
    ch_eu_nexus: "High — European law firms (UK, Germany, France, etc.) are directly targeted by this actor; professional-services sector in Switzerland is also in scope based on actor's global targeting pattern"
    public_sector_nexus: "indirect — legal firms handling government contracts or representing state entities are directly at risk"
    sector: "legal, finance, professional-services"
    cves: []
    actors_campaigns_malware: ["Silent Ransom Group", "UNC3753", "Luna Moth", "Chatty Spider"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Silent Ransom Group impersonates IT help desks and convinces employees to join remote support sessions via Microsoft Teams, Zoom, Quick Assist, or Microsoft Terminal Services"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/silent-ransom-group-targets-law-firms-with-fake-it-support-calls/"
      - quote: "data exfiltration using WinSCP or Rclone; ransom demands within 30 minutes of exit"
        attribution: "BleepingComputer"
