      - quote: "France (5.4%, 19 victims), Italy (3.7%, 13 victims), Germany (3.4%, 12 victims), United Kingdom (3.1%, 11 victims), Poland (2.3%, 8 victims)"
        attribution: "LevelBlue/TrustWave"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/a-closer-look-at-the-gentlemens-alleged-leak"

  - title: "FortiClient EMS CVE-2026-35616 exploited to install EKZ infostealer masquerading as Fortinet patch via VPN scripting workflow"
    sources:
      - url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
        publisher: "Arctic Wolf Labs"
        date: "2026-05-27"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-forticlient-ems-flaw-to-push-infostealer-malware/"
        publisher: "BleepingComputer"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('FortiClient EMS EKZ infostealer June 2026') → primary: Arctic Wolf Labs, URL https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-forticlient-ems-flaw-to-push-infostealer-malware/"
    summary: |
      Arctic Wolf Labs documented an active campaign exploiting CVE-2026-35616 (CVSS 9.1, CWE-284 Improper Access Control) in FortiClient Endpoint Management Server (EMS) to deliver a new credential stealer they designated EKZ Infostealer. The pre-authentication API access bypass allows unauthenticated attackers to send privileged requests to the EMS API, bypassing authentication and authorization entirely. Attackers modified Remote Access Profiles in EMS to inject malicious CMD scripts containing base64-encoded PowerShell into the VPN on-connect scripting workflow; upon VPN tunnel establishment, `fortitray.exe` spawns the CMD scripts, which download `FortiEndpoint_Patch.exe` (the EKZ Infostealer) from an attacker-controlled host. EKZ extracts browser passwords and cookies from Chrome (using Chrome Elevation Service bypass to decrypt), Edge, and Firefox (dynamically loading NSS3.dll), plus autofill data (credit cards, addresses). Exfiltration is staged to `C:\ProgramData\log.txt` then POSTed to the attacker's server. Affected versions: FortiClient EMS 7.4.5 and 7.4.6; hotfixes available for both; permanent fix in 7.4.7 (not yet released at publication date). CISA added CVE-2026-35616 to KEV on 6 April 2026. MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1505 (Server Software Component), T1059.001 (PowerShell), T1555.003 (Credentials from Web Browsers). Detection: EMS logs showing "Certificate not found in request header"; unexpected Remote Access Profile modifications with script execution; PowerShell downloads spawning from `fortitray.exe` or `ipsec.exe`; HTTP POST activity to unknown hosts immediately after VPN connection. Hardening: apply FortiClient EMS 7.4.5/7.4.6 hotfix immediately; review Remote Access Profile scripts for unauthorized additions; implement application allowlisting on managed VPN endpoints.
    ch_eu_nexus: "High — FortiClient EMS is widely deployed in Swiss and European enterprise networks for VPN management; any organisation using FortiClient EMS 7.4.5 or 7.4.6 with internet-facing API access is directly exposed"
    public_sector_nexus: "direct — enterprise VPN management infrastructure in public-sector environments is the affected product class"
    sector: "public-sector, enterprise, telco, technology"
    cves: [CVE-2026-35616]
    actors_campaigns_malware: ["EKZ Infostealer"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "attackers modified Remote Access Profiles to inject malicious scripts; upon VPN tunnel establishment, fortitray.exe launched CMD scripts containing base64-encoded PowerShell"
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      - quote: "The credential stealer extracts credentials from Chrome, Edge, and Firefox including Chrome Elevation Service bypass to decrypt protected credentials"
        attribution: "Arctic Wolf Labs"
        source_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"

