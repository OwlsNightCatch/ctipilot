  - title: "The Gentlemen RaaS (Storm-2697): Check Point internal-leak analysis reveals Fortinet/Cisco edge exploitation, NTLM relay, and 332 victims including French, German, UK and Italian organisations in 2026"
    sources:
      - url: "https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"
        publisher: "Check Point Research"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.levelblue.com/blogs/spiderlabs-blog/a-closer-look-at-the-gentlemens-alleged-leak"
        publisher: "LevelBlue (TrustWave)"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Gentlemen ransomware data leak June 2026') → primary: Check Point Research, URL https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/ → corroborating: LevelBlue/TrustWave, URL https://www.levelblue.com/blogs/spiderlabs-blog/a-closer-look-at-the-gentlemens-alleged-leak"
    summary: |
      Check Point Research published a comprehensive analysis of The Gentlemen ransomware-as-a-service (RaaS) operation, drawing on internal data leaked in early May 2026 from the group's Rocket backend. The operator, tracked as zeta88/hastalamuerte, directly participates in intrusions rather than solely managing infrastructure, with 9 core operators and at least 8 affiliate TOX IDs. The group reached ~332 published victims in the first five months of 2026, making it the world's second-most-active RaaS program by leak-site disclosures. European victims in 2026 span France (5.4%), Italy (3.7%), Germany (3.4%), UK (3.1%), Poland (2.3%), and Czechia (2%). Documented initial-access methods: Fortinet FortiGate and Cisco appliance brute-forcing and CVE exploitation (CVE-2024-55591 FortiOS management, CVE-2025-32433 Erlang SSH, CVE-2025-33073 NTLM relay), purchased access-broker relationships, OWA/M365 credential harvesting from infostealer log markets. Post-compromise tooling: ZeroPulse, Velociraptor, NetExec, RelayKing, CertiHound, TaskHound, PrivHound, MANSPIDER, PowerZure, EDRStartupHider; SystemBC SOCKS5 proxy for C2; Cobalt Strike. EDR evasion: hardware breakpoint removal, NTDLL unhooking, ETW patching, BYOVD kernel drivers. Ransomware is custom Go-based with per-file Curve25519/XChaCha20 encryption and network self-propagation. MITRE ATT&CK mapping: T1190 (Exploit Public-Facing Application), T1078 (Valid Accounts), T1557 (Adversary-in-the-Middle/NTLM relay), T1562.001 (Disable/Modify Tools), T1068 (Exploitation for Privilege Escalation). Detection: monitor for simultaneous NTLM relay traffic (Sysmon EID 3 outbound SMB + Event 4624 Logon Type 3 anomalies), unexpected modification of NTDLL in-process, hardware debug register manipulation, and ETW provider disable calls. Hardening: require Signed LDAP on DC, disable LLMNR/NBT-NS, enforce MFA on all edge appliances, patch Fortinet and Cisco VPN/SSL appliances promptly.
    ch_eu_nexus: "High — French, German, UK, Italian, Polish, Czech organisations confirmed among 2026 victims; actor exploits Cisco/Fortinet edge appliances widely deployed across Swiss and EU public-sector networks"
    public_sector_nexus: "indirect — government contractors, public utilities, and professional-services firms serving public entities are in the known victim set"
    sector: "manufacturing, professional-services, technology, healthcare, public-sector"
    cves: [CVE-2024-55591, CVE-2025-32433, CVE-2025-33073]
    actors_campaigns_malware: ["The Gentlemen", "Storm-2697", "zeta88", "SystemBC", "Cobalt Strike", "ZeroPulse", "RelayKing", "EDRStartupHider"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Initial access focuses on internet-facing edge devices, particularly Fortinet FortiGate and Cisco appliances, through credential brute-forcing, vulnerability exploitation, and purchased access"
