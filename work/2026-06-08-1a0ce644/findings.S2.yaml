items:
  - title: "UPDATE: Cisco Catalyst SD-WAN Manager zero-day (CVE-2026-20245) — command-injection to root, no patch, actively exploited by nation-state cluster (chains with CVE-2026-20182)"
    sources:
      - url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx"
        publisher: "Cisco PSIRT"
        date: "2026-06-04"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12579"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-05"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/05/cisco-sd-wan-cve-2026-20245-0-day-exploited/"
        publisher: "Help Net Security"
        date: "2026-06-05"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1788"
        publisher: "BSI WID"
        date: "2026-06-05"
        role: "corroborating"
      - url: "https://www.heise.de/news/Cisco-warnt-vor-neuer-attackierter-SD-WAN-Sicherheitsluecke-11319678.html"
        publisher: "heise.de"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12579 (bridge: ncsc-csh recent 30, post updated 2026-06-05 adding CVE-2026-20245) → pivot: Cisco PSIRT advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx → confirmed BSI WID entry URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1788"
    summary: |
      Cisco disclosed CVE-2026-20245 (CVSS 7.8 HIGH) on 4 June 2026 — a command injection in the CLI of Cisco Catalyst SD-WAN Manager (formerly vManage) that allows an authenticated attacker with netadmin privileges to upload a crafted file and execute arbitrary commands as root on the underlying OS. No patch is available and Cisco has confirmed limited in-the-wild exploitation. The flaw is explicitly chained with CVE-2026-20182 (CVSS 10.0 authentication bypass, patched May 2026) or CVE-2026-20127 — an attacker who gains unauthenticated remote access via CVE-2026-20182 can immediately pivot to root OS control via CVE-2026-20245. Cisco observed cases where exploitation resulted in configuration changes being pushed to edge devices. Cisco recommends immediate upgrade to the fixed release documented in the May 14 SD-WAN advisory and issuing the 'request admin-tech' command on all control components before upgrading to preserve forensic artefacts. Affected platforms include all deployment modes: on-premises, Cisco SD-WAN Cloud-Pro, Cloud (Cisco Managed), and SD-WAN for Government (FedRAMP). NCSC-CH Security Hub updated advisory post 12579 on 5 June to include CVE-2026-20245 and BSI issued WID-SEC-2026-1788 the same day. The Help Net Security article tags "APT" and "Mandiant" alongside the flaw, suggesting Mandiant attribution is under investigation. This is a material delta on the originally-covered Cisco SD-WAN campaign from May 2026 — the addition of an unpatched root-escalation zero-day changes the impact calculus significantly.
    ch_eu_nexus: "Global; SD-WAN is widely deployed in EU public-sector WAN infrastructure and telecoms. FedRAMP-designated product confirms government-sector targeting. NCSC-CH and BSI both issued in-window alerts."
    public_sector_nexus: "direct — government network infrastructure product; FedRAMP deployment mode explicitly confirmed"
    sector: "telco, public-sector, government-networks"
    cves: [CVE-2026-20245, CVE-2026-20182]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05"
    evidence:
      - quote: "A vulnerability in the CLI of Cisco Catalyst SD-WAN Manager could allow an authenticated, local attacker to execute arbitrary commands as root by supplying a crafted file to the affected system."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx"
      - quote: "To exploit this vulnerability, the attacker must have netadmin privileges on the affected system. This would require valid credentials or exploitation of CVE-2026-20182 or CVE-2026-20127. Cisco is not aware of successful exploitation by other methods. Cisco has observed limited cases where the exploitation of this bug resulted in a configuration change pushed to edge devices."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx"
      - quote: "Added related Actively exploited CVE-2026-20245"
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12579"
    extended_notes: |
      Detection: CLI-level file upload events on SD-WAN Manager (syslog from the SD-WAN Manager audit trail); unexpected outbound configuration pushes to edge devices via netconf/RESTCONF — these should correlate with admin-tech forensic collection. Hunt: compare current edge device running configs against last-known-good baselines. Hardening: restrict netadmin credential scope; enforce network-level access controls to peering interfaces cited in the CVE-2026-20182 advisory. MITRE: T1068 (Exploitation for Privilege Escalation), T1190 (Exploit Public-Facing Application via CVE-2026-20182 chain).

  - title: "Acer Wave-7 mesh router zero-days (CVE-2026-49200, CVE-2026-49201) — cleartext credential exposure and hardcoded AES key, CVSS 10.0, no patch"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/acer-warns-of-max-severity-zero-days-affecting-wave-7-routers/"
        publisher: "BleepingComputer"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.heise.de/news/Warten-auf-Sicherheitspatch-Zugangsdaten-von-Acer-Wave-7-Router-einsehbar-11318035.html"
        publisher: "heise.de"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec RSS feed, URL https://www.heise.de/news/Warten-auf-Sicherheitspatch-Zugangsdaten-von-Acer-Wave-7-Router-einsehbar-11318035.html (published 2026-06-05) → pivot: BleepingComputer primary article, URL https://www.bleepingcomputer.com/news/security/acer-warns-of-max-severity-zero-days-affecting-wave-7-routers/ → WebSearch confirmed CVE details and community.acer.com advisory reference"
    summary: |
      Two maximum-severity (CVSS 10.0) zero-day vulnerabilities affect Acer Wave-7 mesh routers running firmware T7c_GBL_1.01.000055 and earlier; no patch is available as of publication, with Acer targeting end-of-June 2026 for a fix. CVE-2026-49200 (Broken Access Control) exposes the router's acer_cgi.log file via the web interface without authentication — this log stores cleartext credentials for both the web administration panel and the Telnet service, accessible to any unauthenticated attacker with network access. CVE-2026-49201 (Hardcoded Cryptographic Key) stems from a hardcoded AES key in the upload.cgi binary that processes device backups, enabling an unauthenticated attacker to decrypt, modify, and re-encrypt system backups to inject a persistent backdoor into the device. The combination of credential theft (CVE-2026-49200) plus backup-based persistent backdoor injection (CVE-2026-49201) creates a complete unauthenticated takeover chain with persistence. Affected devices are deployed in home and SME networks across Europe. Interim mitigations from Acer: disable remote administration, restrict management interface to trusted internal networks only, change default credentials, and monitor for unauthorized login attempts or configuration changes.
    ch_eu_nexus: "Global product, EU/CH SME deployment. Router-level credential theft has direct relevance to Swiss and EU organisations using Acer Wave-7 for office networks."
    public_sector_nexus: "indirect — SME / home-office routers; small public-sector offices may be affected"
    sector: "all sectors, SME, home-office"
    cves: [CVE-2026-49200, CVE-2026-49201]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Acer is working to address two maximum-severity zero-day vulnerabilities affecting its Wave 7 mesh routers."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/acer-warns-of-max-severity-zero-days-affecting-wave-7-routers/"
      - quote: "Kritische Schwachstellen bedrohen Acer-Router der Wave-7-Serie. Sicherheitsupdates sind bislang nicht verfügbar."
        attribution: "heise.de"
        source_url: "https://www.heise.de/news/Warten-auf-Sicherheitspatch-Zugangsdaten-von-Acer-Wave-7-Router-einsehbar-11318035.html"
    extended_notes: |
      Detection: scan for unauthenticated HTTP GET requests to /acer_cgi.log on internal router management interfaces; unexpected backup upload/restore events via upload.cgi. Hunt: identify Wave-7 devices on the network (manufacturer OUI lookup); verify that management interfaces are not reachable from untrusted network segments. MITRE: T1110.001 (Password Guessing via cleartext credential log), T1542.001 (System Firmware via backup manipulation), T1098 (Account Manipulation).

  - title: "SolarWinds Serv-U CVE-2026-28318 — unauthenticated DoS via malformed deflate POST, KEV-listed June 5 with FCEB deadline June 19"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/cisa-hackers-now-exploit-solarwinds-serv-u-flaw-to-crash-servers/"
        publisher: "BleepingComputer"
        date: "2026-06-05"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/cisa-adds-actively-exploited-solarwinds.html"
        publisher: "The Hacker News"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('SolarWinds Serv-U exploited CISA KEV June 2026') → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-hackers-now-exploit-solarwinds-serv-u-flaw-to-crash-servers/ → corroborating: The Hacker News URL https://thehackernews.com/2026/06/cisa-adds-actively-exploited-solarwinds.html"
    summary: |
      CISA added CVE-2026-28318 to the Known Exploited Vulnerabilities catalog on 5 June 2026, setting a Federal Civilian Executive Branch (FCEB) remediation deadline of June 19, 2026. The vulnerability affects SolarWinds Serv-U file transfer software — a malicious HTTP POST request using the Content-Encoding: deflate header causes the Serv-U service to consume excessive resources and crash, requiring no authentication. The attack surface is the Serv-U web interface and file transfer endpoint. SolarWinds released a hotfix addressing the issue in Serv-U version 15.5.4 Hotfix 1. Serv-U is widely deployed in government and enterprise environments for managed file transfer (MFT) workflows, including EU public-sector entities that use it for secure document exchange. Exploitation of DoS vulnerabilities in MFT products can serve as a precursor to further attacks or be used in denial-of-service campaigns against critical services. The KEV listing confirms evidence of active exploitation in the wild.
    ch_eu_nexus: "Global product widely deployed in EU public-sector MFT workflows. KEV listing with 14-day FCEB deadline signals active real-world exploitation."
    public_sector_nexus: "direct — MFT product used by government agencies for secure file exchange"
    sector: "government, finance, all sectors using MFT"
    cves: [CVE-2026-28318]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CISA Adds Actively Exploited SolarWinds Serv-U DoS Flaw to KEV Catalog"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/cisa-adds-actively-exploited-solarwinds.html"
      - quote: "An attacker can send a malicious POST request using the Content-Encoding: deflate HTTP header, forcing the Serv-U service to consume excessive resources and crash without requiring any authentication credentials."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-hackers-now-exploit-solarwinds-serv-u-flaw-to-crash-servers/"
    extended_notes: |
      Detection: anomalous HTTP POST traffic to Serv-U endpoints with Content-Encoding: deflate headers from untrusted sources; Serv-U service crashes or restarts in Windows Event Log (Event ID 7034 Service Control Manager, or application-layer Serv-U log). Hardening: upgrade to Serv-U 15.5.4 Hotfix 1; restrict Serv-U management and file transfer interfaces to known client IP ranges; enable connection throttling. MITRE: T1499.002 (Service Exhaustion Flood), T1190 (Exploit Public-Facing Application).

  - title: "Google GTIG: UNC3753 (Silent Ransom Group / Chatty Spider) escalates to physical office intrusion — operatives impersonate IT support to exfiltrate data via USB"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms"
        publisher: "Google GTIG (Mandiant)"
        date: "2026-06-05"
        role: "primary"
      - url: "https://www.theregister.com/cyber-crime/2026/06/05/if-you-dont-fall-for-these-extortionists-calls-theyll-show-up-with-usb-sticks/5251891"
        publisher: "The Register"
        date: "2026-06-05"
        role: "corroborating"
      - url: "https://www.heise.de/news/Google-warnt-Angreifer-geben-sich-als-IT-Techniker-aus-und-betreten-Bueros-11320590.html"
        publisher: "heise.de"
        date: "2026-06-06"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec RSS feed, URL https://www.heise.de/news/Google-warnt-Angreifer-geben-sich-als-IT-Techniker-aus-und-betreten-Bueros-11320590.html (published 2026-06-06) → pivot: Google GTIG blog post, URL https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms → corroborating: The Register, URL https://www.theregister.com/cyber-crime/2026/06/05/if-you-dont-fall-for-these-extortionists-calls-theyll-show-up-with-usb-sticks/5251891"
    summary: |
      Google's Threat Intelligence Group (GTIG) published a blog post on 5 June 2026 documenting an ongoing targeted campaign by UNC3753 (also known as Chatty Spider / Silent Ransom Group / Luna Moth) against US law firms and professional services organisations. A Spring 2026 development is that when remote vishing and social engineering approaches fail, the group dispatches physical operatives to victim office locations — impersonating IT support technicians — to plug in USB drives and exfiltrate corporate data directly to external storage. Once on-premises, the operative claims they need to image the device or create local backups to address a security issue, gaining physical access to an endpoint. The campaign lifecycle from initial vishing contact to data theft and extortion occurs within a single business day. GTIG attributes the campaign to UNC3753 based on infrastructure overlaps, domain registrar tracking, victimology, and target staging directories. A concurrent FBI FLASH alert (TLP:CLEAR) identified the same in-person intrusion tactic. The technique targets organisations that have hardened against remote social engineering but have not addressed physical security gaps around IT support impersonation — a defence-in-depth gap particularly relevant to professional-services and public-sector organisations in Europe where IT support is sometimes outsourced.
    ch_eu_nexus: "Campaign documented against US law firms but physical-intrusion social engineering is TTP-transferable globally, including to EU/CH legal and public-sector organisations with outsourced IT support."
    public_sector_nexus: "indirect — professional-services targeting; technique is directly transferable to public-sector entities with external IT support contractors"
    sector: "legal, professional-services, government"
    cves: []
    actors_campaigns_malware: ["UNC3753", "Silent Ransom Group", "Chatty Spider", "Luna Moth"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "GTIG assesses that associated threat actors have also attempted direct data theft using physical, in-person access, sometimes posing as IT technicians at victims' physical offices to attempt to steal sensitive files using thumb drives."
        attribution: "Google GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms"
      - quote: "In many Mandiant investigated incidents, the entire attack sequence—from initial target contact to data theft and extortion—occurred within a single business day."
        attribution: "Google GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms"
      - quote: "Google warnt vor der Gruppe UNC3753. Die Angreifer geben sich vor Ort als IT-Techniker aus, um Daten per USB-Stick zu stehlen."
        attribution: "heise.de"
        source_url: "https://www.heise.de/news/Google-warnt-Angreifer-geben-sich-als-IT-Techniker-aus-und-betreten-Bueros-11320590.html"
    extended_notes: |
      Detection: physical access anomalies — tailgating events on badge readers; USB device insertion logs (Windows DeviceSetupManager event log, Sysmon EID 6: USB plug events or EID 1 with parent process explorer.exe launched from removable media); video surveillance review for individuals without standard badge access; Sysmon EID 11 file creation events to removable media. Hardening: enforce USB port blocking via GPO (USBSTOR disabled or set to read-only) except for specifically approved endpoints; require badge + PIN for server room and data-access areas; train reception and helpdesk staff on IT-support impersonation as a formal social engineering technique. MITRE: T1091 (Replication Through Removable Media), T1052.001 (Exfiltration Over Physical Medium: Exfiltration over USB), T1566.004 (Phishing: Vishing).

