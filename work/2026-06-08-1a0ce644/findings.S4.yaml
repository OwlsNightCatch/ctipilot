      - quote: "We have secured successful outcomes at Proceeds of Crime Act (POCA) hearings, resulting in a total of £118,852.32 in confiscation orders being handed to Greater Manchester based former RAC employees Debbie Okparavero and Maliha Islam."
        attribution: "ICO"
        source_url: "https://ico.org.uk/action-weve-taken/enforcement/2026/05/debbie-okparavero-and-maliha-islam-proceeds-of-crime-act/"
      - quote: "Both defendants had previously pleaded guilty to a conspiracy to commit offences under s1 of the Computer Misuse Act 1990 and the Data Protection Act 2018, for unlawfully copying and selling almost 30,000 lines of personal information."
        attribution: "ICO"
        source_url: "https://ico.org.uk/action-weve-taken/enforcement/2026/05/debbie-okparavero-and-maliha-islam-proceeds-of-crime-act/"
      - quote: "The outcome of the POCA hearing shows that the ICO will use the full range of its enforcement powers to bring criminals to account and recoup money, calculated by the Court, which reflects the benefit gained from illegal activity."
        attribution: "ICO"
        source_url: "https://ico.org.uk/action-weve-taken/enforcement/2026/05/debbie-okparavero-and-maliha-islam-proceeds-of-crime-act/"
    extended_notes: |
      Technique: insider data theft, T1020 (Automated Exfiltration) / T1052 (Exfiltration Over Physical Medium) — exact mechanism not disclosed in the ICO notice but unlawful copying and selling to third parties is the stated basis. Detection angles for similar insider threats: DLP alerts on bulk export of customer records, unusual query patterns against CRM/telephony databases (the RAC operates a roadside-assistance CRM), anomalous after-hours data access, and large file transfers to personal cloud or USB. Hardening: need-to-know access controls on contact-centre data, privileged user monitoring, regular access-rights audits. The POCA application was based on calculating the benefit the defendants received from the illegal activity — a precedent that gives UK regulators a route to asset recovery even where civil penalties might not be the primary tool.

