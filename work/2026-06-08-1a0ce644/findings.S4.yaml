    extended_notes: |
      Qilin is a Golang/Rust RaaS (ransomware-as-a-service) operation first identified in 2022. It uses VMware ESXi-compatible encryptors and double-extortion via a Tor-hosted leak site. Affiliate TTPs typically include initial access via exposed RDP/VPN (often credential-stuffing against weak MFA), lateral movement with Cobalt Strike or Impacket, and data staging to cloud storage before encryption. MITRE coverage: T1078 (Valid Accounts), T1021.001 (RDP), T1486 (Data Encrypted for Impact), T1041/T1567 (Exfiltration). Qilin was among the most prolific RaaS groups in 2025-2026 and claimed the NHS Synnovis blood-testing lab (UK) attack in June 2024 that caused significant clinical disruption. The Avcon Jet listing is unconfirmed by the victim as of publication date — use the standard dark-web framing: "Avcon Jet was listed by Qilin; not confirmed by Avcon Jet".

  - title: "ICO (UK) secures £118,852 Proceeds of Crime Act confiscation from former RAC employees who sold 30,000 customer records"
    sources:
      - { url: "https://ico.org.uk/action-weve-taken/enforcement/2026/05/debbie-okparavero-and-maliha-islam-proceeds-of-crime-act/", publisher: "ICO", date: "2026-06-05", role: "primary" }
    discovery_trace: "bridge ico-uk enforcement 10 → ICO sitemap returned URL with lastmod 2026-06-05T12:03:30+00:00 → bridge url fetch of per-action page confirmed date and content"
    summary: |
      On 5 June 2026 (published the same day, within the 36-hour window), the UK Information Commissioner's Office secured confiscation orders totalling £118,852.32 under the Proceeds of Crime Act (POCA) against Debbie Okparavero and Maliha Islam, two former employees of the RAC (Royal Automobile Club) based in Greater Manchester. The pair had previously been convicted in October 2024 of conspiracy under the Computer Misuse Act 1990 and the Data Protection Act 2018 for unlawfully copying and selling approximately 30,000 lines of customer personal information. The October 2024 hearing imposed six-month suspended prison sentences and 150 hours of community service; the June 2026 POCA hearings quantified the financial gain and ordered it repaid. The ICO explicitly framed this as an exercise of its full enforcement arsenal — not merely civil penalty powers but criminal asset recovery — signalling escalating deterrence strategy for insider-threat data theft. This has direct relevance to CH/EU regulators watching the ICO as a GDPR-comparable authority post-UK GDPR implementation and to organisations building insider-threat detection programmes: the case demonstrates that even low-volume data exfiltration (30,000 records) can attract criminal prosecution and asset recovery years after the initial act.
    ch_eu_nexus: "UK regulator action; relevant as GDPR-comparable enforcement benchmark for Swiss and EU practitioners"
    public_sector_nexus: "indirect"
    sector: "automotive services, data protection enforcement"
