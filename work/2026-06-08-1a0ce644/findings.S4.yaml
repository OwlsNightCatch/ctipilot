  - title: "Qilin claims Austrian business-aviation firm Avcon Jet; employee passports, maintenance records and incident-response plan published on leak site"
    sources:
      - { url: "https://cybernews.com/security/avcon-qilin-ransomware-air-aviation-data-leak/", publisher: "Cybernews", date: "2026-06-07", role: "primary" }
      - { url: "https://hacknotice.com/2026/06/05/avcon-jet/", publisher: "HackNotice", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "WebSearch ('Switzerland Austria Germany EU ransomware victim June 7 8 2026') → breachsense June 2026 aggregator listed Avcon Jet / Qilin → WebSearch ('Avcon Jet Austria Qilin ransomware breach June 2026') → Cybernews primary URL, WebFetch returned HTTP 403 → bridge wayback fallback no snapshot → Cybernews summary reconstructed from WebSearch excerpts; HackNotice corroborating via WebSearch"
    summary: |
      The Qilin ransomware-as-a-service group listed Avcon Jet — an Austrian private business-jet management and charter company with more than €250 million in annual revenue, operating across Europe and internationally — on its dark-web leak site around 4–5 June 2026. Qilin published sample files as proof, including scanned employee passports and CVs, aircraft maintenance work orders, export airworthiness certificates, training records, and, critically, the company's own cyber incident-response plan. Avcon Jet had not publicly confirmed the breach or issued a statement as of the time of reporting; Cybernews reached out for comment but received no response. The publication of the incident-response plan is operationally significant: it reveals the organisation's detection thresholds, escalation paths, and containment procedures to the threat actor and any secondary buyer. Aviation operators who share IT supply-chain or HR data with Avcon Jet (European partner bases, leasing providers, maintenance contractors) should treat this as a potential lateral-exposure event. Defender focus: identity and access reviews for any third-party connections to the Avcon environment; monitor for credential abuse on aviation-sector platforms; watch the Qilin leak site for the full data publication if no ransom payment is made.
    ch_eu_nexus: "Direct EU nexus — victim is Austria-headquartered; operations span EU and international markets; employee PII from EU persons published"
    public_sector_nexus: "indirect — some EU government charter clients possible given the company profile"
