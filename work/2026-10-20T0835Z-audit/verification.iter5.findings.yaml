  summary: "(advisory, low confidence) Verichains' page says TSSHOCK is three attacks: alpha-shuffle (ambiguous encoding of hashed inputs), c-split and c-guess (dlnproof challenge-space and iteration reductions). 'Weak zero-knowledge proofs' fits the last two and only indirectly the first; 'attacks on threshold-signing proofs and their encoding' would not over-narrow it. Fine to leave."
