claims:
  - claim_id: 879367574d
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: cited
    text: "**Exposure:** ECDSA threshold-signing deployments running GG20 code derived from Binance's tss-lib from before its v2.0.0 and v3.0.0 fixes, wherever a party that could be malicious joins the signing committee, which on THORChain is anyone who bonds a validator; EdDSA signing, as on Solana, is not exposed ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-2"]
  - claim_id: f6326f9bdc
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** for any GG20 threshold-signing deployment built on tss-lib, confirm the library carries tss-lib's v2.0.0 and v3.0.0 fixes, including verification that each party's Paillier modulus is well formed, and alert on each participant's share of signing failures ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-2"]
  - claim_id: 7a84386fa8
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "record 2026-10-20T08:46:34Z"
    kind: record-summary
    text: "THORChain's own reports count one of five vaults drained for about $10.7M (later about $10M), not the six vaults and about $11M taken from The Record and TRM Labs, and confirm the GG20 threshold-signature exploit that had been described as suspected. The analysis is rewritten from THORChain's post-mortem of 2026-07-03, which describes a malformed multi-prime Paillier key and 864 deliberately failed signing rounds, with exposure, detection and triage guidance for other GG20 deployments."
