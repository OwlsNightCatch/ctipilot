  - claim_id: 53b7e6eb3e
    entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
    surface: "summary"
    kind: frontmatter
    text: "The Government of Liechtenstein disclosed on 2026-08-02 that an unknown actor gained unauthorised digital access to the Verzeichnis wirtschaftlich berechtigter Personen (the national beneficial-ownership register at the Amt für Justiz) overnight into 2026-07-30 and copied records for roughly 31,000 legal entities. Forensics released 2026-08-03 characterise it as a targeted attack on that register with no attacks found on other systems, but the government progressively took the eMWST VAT portal, the Lides reporting platform, the central account register and the Intax tax system offline as a precaution. The attackers reached the register through its reporting portal rather than the database directly (NZZ reports a vulnerability in the portal), registering a new user account and enumerating every record one by one; no actor has been identified and no ransom demand reported. The breach is declared under GDPR Article 33. The government later called the cause faulty authorisation-checking logic abused through repeated individual API requests, said an upstream eID step will strengthen account verification, and reported the register back in restricted operation on 2026-10-05 with no sign of misuse of the copied data."
  - claim_id: bee06e1531
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: cited
    text: "Detection concept: Check Point's sk1000171, revised on 2026-10-13, lists four indicators in the management-process log (`cpm.elg`): one for the authentication bypass, a login whose username field exceeds 1,000 characters with a management-process core dump written at the same moment, and three for an attacker already past authentication: a suspicious version path in an `Invoking method ... in version:` log line, which Check Point's search matches on dots, slashes, backslashes and their URL-encoded forms, an upload path carrying directory traversal toward the upgrade-tools files, and a JAR path that breaks out of the expected upgrade-tools directory ("
    urls: ["https://support.checkpoint.com/results/sk/sk1000171/"]
  - claim_id: 499bdbfde2
    entry: 2026-09-24/solarwinds-observability-cve-2026-28324-28325-unauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every SolarWinds Observability Self-Hosted deployment to 2026.2.3, and remove any internet exposure of SolarWinds management and communication services (CVE-2026-28324 is network-reachable) while SolarWinds' advisories and release notes name neither the vulnerable configuration nor the communication mode."
