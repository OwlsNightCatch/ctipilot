    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "summary"
    kind: frontmatter
    text: "An unauthenticated attacker can upload and execute an arbitrary script on Check Point Security Management Server, Multi-Domain Security Management Server, Log Server, Multi-Domain Log Server and SmartEvent via a directory-traversal and file-upload flaw. Check Point identified pinpointed exploitation on 2026-07-23, roughly two months before the 2026-09-22 fix; no LivePatch exists, only a hotfix or Jumbo Hotfix Accumulator. Bishop Fox published on 2026-10-01 an end-to-end root exploit method over the same port and a patch-state scanner, and said Check Point's log indicators did not cover that route; Check Point revised its indicators on 2026-10-13, and neither party states whether the new ones catch it."
  - claim_id: 878ee192de
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Check Point Security Management / Multi-Domain / Log / SmartEvent server now, no LivePatch exists: Check Point confirms this pre-authentication path-traversal flaw was exploited as a zero-day against a handful of customers, with attacks observed on 2026-07-23. Apply the R82.20 Security Hotfix or the appropriate Jumbo Hotfix Accumulator (R82.20 Take 10+, R82.10 Take 45+, R82 Take 127+, R81.20 Take 170+, R81.10 Take 192+) immediately; the September LivePatch does not cover this issue. Until patched, restrict TCP/19009 on every affected server to trusted administrative IP ranges via Trusted Clients / implied rules, and check the file-integrity paths in the 2026-10-04 update below alongside Check Point's revised log indicators."
  - claim_id: 89cd6612ff
