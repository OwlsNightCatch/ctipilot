  - claim_id: 1ab64f6e4b
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "headline"
    kind: frontmatter
    text: "The compromised actions-cool GitHub Actions were re-enabled in September with malicious tags and ran the payload again"
  - claim_id: 4dc5c01849
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "summary"
    kind: frontmatter
    text: "On 2026-05-18 all 53 version tags of the actions-cool/issues-helper GitHub Action, and all 15 of actions-cool/maintain-one-comment, were moved to imposter commits whose payload reads the Runner.Worker process memory for decrypted workflow secrets and sends them over HTTPS to an attacker-controlled domain (StepSecurity); Socket places the compromise in the Mini Shai-Hulud campaign. GitHub disabled both repositories on 2026-05-19 but they became reachable again on 2026-09-16 with the malicious tags intact, so tag-referencing workflows ran the payload again and SafeDep counted six newly infected repositories by 2026-09-24, until GitHub disabled both again by 2026-09-25 (Socket, The Hacker News). Only workflows pinned to a full commit SHA from before 2026-05-18 were unaffected."
  - claim_id: 25577653cc
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every workflow in your GitHub organisations that references actions-cool/issues-helper or actions-cool/maintain-one-comment by tag; where either ran successfully on 2026-05-18 to 05-19 or 2026-09-16 to 09-25, rotate every secret that workflow could read and check the repository's commits since 2026-09-16 for added Claude Code or VS Code hook files, then remove the action or pin it to a full commit SHA from before 2026-05-18."
  - claim_id: 0cbcc71fba
    entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
    surface: "body"
    kind: cited
    text: "Socket's head of threat intelligence told The Hacker News that the @antv npm compromise in the Mini Shai-Hulud campaign is likely linked to the actions-cool hack because the two share an exfiltration domain, and that \"the overlap is strong enough that we're treating them as related\" ("
    urls: ["https://thehackernews.com/2026/05/github-actions-supply-chain-attack.html"]
