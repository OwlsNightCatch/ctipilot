    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, and Horizon3 published the root cause and a working exploit for it on 2026-10-07. Zammad 7.2.2 (2026-10-08) fixes the root escalation, which affects only DEB and RPM (packager.io) installations, and 6.5.5 (2026-10-15) is an emergency fix for the code-execution flaw in the otherwise unsupported 6.5 series; 7.2.1 (2026-10-06) had fixed 27 newly published advisories in 7.2.0 and earlier, two rated critical, none with a CVE id and none reported exploited."
