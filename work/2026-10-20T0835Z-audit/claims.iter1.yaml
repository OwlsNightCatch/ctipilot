  - claim_id: afd6f2045f
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade TeamCity On-Premises to 2025.11.7 or 2026.1.3 on the matching branch, or install JetBrains' security-patch plugin where the version is older than that but at least 2017.1, and until that is done restrict external access to the TeamCity server, as JetBrains advises, because the flaw needs nothing but HTTP(S) reachability."
  - claim_id: 0184cad586
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Treat any TeamCity On-Premises server that was internet-reachable and still unpatched at any point after 2026-07-27 as a compromise-assessment target rather than a completed patch: review build-agent registrations for agents you did not enrol, and rotate the VCS credentials, artifact-repository tokens and signing keys the server holds, because an upgrade evicts the entry point but not what was taken through it."
