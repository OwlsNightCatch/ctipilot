  - claim_id: 2e4aecb2bb
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos disclosed CLOSEDQUORUM on 2026-09-22, a Go-compiled Windows implant that queries up to four commercial LLM providers (DeepSeek, Qwen, Mistral, Google Gemini) each cycle and executes whichever action wins a plurality vote among their responses (credential theft, process injection, or persistence), with results relayed and stolen data exfiltrated through a Discord webhook. Talos found it via CAIRN, a new open-source toolkit it released the same day for tracking AI-integrated malware, and states plainly it has no confirmation of in-the-wild deployment; the public distribution build ships placeholder API keys."
  - claim_id: 7041fe3556
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: cited
    text: "Talos adds that handing the decision to models introduces weaknesses: \"Provider refusals, rate limits, malformed output, predictable tie-breaking, constrained action schemas, and dependence on commercial APIs all create failure modes and defensive opportunities\"; of these, only the tie behavior is one it calls \"fully deterministic\" ("
    urls: ["https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"]
  - claim_id: 17c3af22e6
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Instead of a dedicated attacker-operated server, its `ModelOrchestrator` component queries up to four commercial LLM providers (DeepSeek, Qwen, Mistral and Google Gemini) each cycle, with a system prompt instructing each model to \"provide ONLY executable decisions\" alongside host context (hostname, OS version, admin status) and the current target process."
  - claim_id: 4d86291587
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "The four possible actions are `steal` (simultaneous LSASS memory dumping via `SeDebugPrivilege` and `MiniDumpWriteDump`, Chrome/Edge/Firefox saved-credential harvesting, and MetaMask/Exodus/Ethereum wallet data collection), `inject` (Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing when a model selects that exploit type), `persist` (establishes three mechanisms: a Windows-Update-themed Registry Run-key value, a scheduled task, and a permanent WMI event subscription that fires a script every 60 seconds), and `move`, which has no handler in the public build."
  - claim_id: 1decf4abfb
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: uncited
    text: "Talos frames the finding as evidence of \"effort displacement\": an entire phase of an intrusion handed to a model rather than merely AI-assisted tooling."
  - claim_id: b5ee1a14dc
    entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** CLOSEDQUORUM is a capability demonstration with no confirmed live deployment, not an active campaign, but its architecture (commercial AI endpoints as C2, LLM-driven action selection) is a detection blind spot worth building hunt logic for now, before a deployed variant with real credentials appears."
