    kind: cited
    text: "**Exposure:** ECDSA threshold-signing and MPC-custody deployments running GG18 or GG20 code derived from Binance's tss-lib from before its v2.0.0 and v3.0.0 fixes, wherever a party that could be malicious joins the signing committee, which on THORChain is anyone who bonds a validator; EdDSA signing, as on Solana, is not exposed ("
