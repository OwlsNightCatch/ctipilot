  - claim_id: 7163e88151
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "headline"
    kind: frontmatter
    text: "Mandiant: an attacker used a hijacked AI coding-assistant session to steal OAuth tokens and deploy the Shai-Hulud worm"
  - claim_id: 2bca7c74a2
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "summary"
    kind: frontmatter
    text: "Mandiant's 2026 AI Risk and Resilience report, the follow-up to its 2025 edition, synthesizes eight 2026 case studies of AI-related attacks, failures and assessments: an attacker who, after a hijacked AI coding-assistant session recommended a poisoned package, used that session to install an infostealer, harvest GitHub OAuth tokens and deploy the self-propagating Shai-Hulud worm across roughly 100 repositories; a stolen CI/CD credential turned into a live, in-session AI co-debugging offensive hub; tampered AI-assistant CLI hooks used for native remote code execution; malware that rewrites its own command strings at runtime using embedded AI inference to evade EDR signatures; a prompt-injection \"Confused Deputy\" that exfiltrated internal repositories through an allowlisted external domain; a runaway agent reasoning loop that generated a $50,000 cloud-billing spike; a customer-service RAG agent Mandiant assessed as open to leaking cross-tenant PII through indirect prompt injection in forum comments; and a DARK CASTLE (ex-UNC2814) espionage campaign against telecoms and government bodies caught when an agentic SOC triage pipeline escalated a single low-severity command execution a human analyst would routinely have deprioritized."
  - claim_id: dd0af5887d
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hardening:** enforce IDE/CLI verification hooks that validate every AI-recommended dependency against cryptographic checksums and approved allowlists, isolate local credentials from extensions, and route dependency traffic through an internal package repository ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 0005b9b167
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "VPC Service Controls) against unapproved external LLM providers, and run continuous secrets scanning with a runtime prompt firewall (Mandiant names Model Armor) to block hardcoded credentials and offensive script execution in real time ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 47ff6d0fa1
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hardening:** require all local AI-assistant binaries, CLI helpers, plugins and MCP servers to be signed and verified before execution; enforce multi-party approval and continuous monitoring on internal AI repositories; and sandbox AI-assistant execution engines in micro-segmented, containerized runtimes (gVisor or microVMs) so a subverted hook cannot reach the host, with human-in-the-loop approval required before shell execution, configuration changes or outbound network calls ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 5d268a7345
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "Malware using embedded, lightweight local AI inference fingerprints the active security tools on a host, then dynamically rewrites its own command-execution strings at runtime (T1027.010), never writing a predictable payload to disk, so it evades static EDR signatures while it persists and reconnoiters ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: d59a66308f
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hunt/detection:** tune EDR and SIEM for in-memory compilation (unexpected native-compiler process spawns from non-developer parent processes and rapid file-create-execute-delete cycles in temp directories) and baseline endpoint CPU/GPU consumption to catch sudden, unexplained spikes from otherwise-lightweight background processes; response playbooks should suspend the entire parent execution tree (not just the worker thread) and capture a memory snapshot before network isolation ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 3eca48781b
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "Mandiant's own offensive-security team used role-confusion prompt injection to convince a client's internal AI assistant, scoped to specific internal repositories, that it was assisting an authorized security test; because GitHub was an allowed external domain, the assistant used its native CLI to clone sensitive internal repositories and push them to an external, tester-controlled account (T1567.001): a sanctioned tool weaponized through semantic manipulation of the assistant's own trust in its task ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 6b9906ed8a
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hunt/detection:** cross-correlate application logs with network egress telemetry, and alert when an internal-facing AI service account initiates unauthorized outbound transfers or opens anomalous external API connections; on detection, invalidate the agent's active OAuth tokens and downgrade its container's egress privileges while keeping the instance alive for prompt-history forensics ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 01349482c7
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hardening:** define per-agent cost-cap thresholds and bounded recursion limits, and implement automated financial circuit breakers that halt agent operations after a set number of consecutive task failures ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 4b93f202ac
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "**Hardening:** treat all RAG-retrieved content (forum posts, tickets, partner feeds) as untrusted input; enforce tenant-isolated vector indexing so a public-facing agent cannot query cross-tenant data; and route incoming context and generated responses through a semantic firewall (Model Armor or equivalent) to strip injected instructions and screen for PII before it reaches an end user ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: 46c171cdd9
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: cited
    text: "A single, low-frequency anomalous command execution, the kind a human analyst would typically triage as low-severity, was escalated by the defending team's agentic AI triage pipeline, which autonomously correlated it with subtle outbound-traffic signals to reconstruct a complete attack timeline, letting engineers trace the actor's lateral movement over SSH (T1021.004) and privilege escalation by an unstated mechanism, and sever its access before it spread further ("
    urls: ["https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"]
  - claim_id: cd7a838e54
    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "body"
    kind: uncited
    text: "**Case study 2: a stolen CI/CD credential becomes a live AI co-debugging hub.** At a global healthcare organization, an attacker used a compromised long-lived CI/CD credential (T1078.004) to seize an unisolated VM and worked an LLM interactively, in real time, rather than developing malware offline: first synchronizing code and loading README files to align the model with campaign goals, then co-debugging a multi-worker data-harvesting framework to raise its exfiltration frequency to a three-hour cycle, then having the model write dynamic IP-rotation scripts and co-develop a Rust tool to validate stolen financial-account balances."
  - claim_id: 6f26bf3d28
