  - claim_id: 3fb3462be8
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "summary"
    kind: frontmatter
    text: "THORChain, a Switzerland-based cross-chain liquidity protocol, lost about $10.7M on 2026-05-15 from one of its five vaults by its own count (The Record reported one of six vaults, TRM Labs more than USD 11M across nine chains). THORChain says a validator churned in two days earlier exploited its GG20 threshold-signature implementation: a malformed multi-prime Paillier key planted at setup and 864 deliberately failed signing rounds leaked other validators' key shares until the attacker could sign alone, a chain of three weaknesses in its fork of Binance's tss-lib that upstream had fixed by 2024. THORChain said initial indications were that only protocol-owned funds were affected, and TRM Labs had not attributed the theft as of 2026-05-15."
