    surface: "body"
    kind: cited
    text: "THORChain confirmed on the evening of 2026-05-15 that the attack exploited its GG20 threshold-signature (TSS) implementation to leak key material progressively, and that the attacker was a node operator churned into the validator set two days earlier ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-1"]
  - claim_id: 8084ea3dac
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: cited
    text: "Its post-mortem describes the chain: at vault setup the attacker published a Paillier key built from several small primes instead of two large ones, which passed because the library only screened out a handful of tiny factors; it then deliberately failed the MTA step of signing 864 times over two and a half days, each failure looking like routine node flakiness while leaking a fragment of other validators' key shares, until it could sign outbound transactions alone ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-2"]
  - claim_id: 6ad449b604
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: cited
    text: "Two further weaknesses made the leak deterministic, a range proof whose two halves were never tied together and a blinding value drawn from far too small a range; all three sat in THORChain's fork (v0.1.6) of Binance's tss-lib, which upstream had fixed as individually minor issues in v2.0.0 (August 2023) and v3.0.0 (2024) ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-2"]
  - claim_id: f21b124178
    entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
    surface: "body"
    kind: cited
    text: "THORChain says only the Paillier-modulus condition matches public research, the class documented in 2023 as BitForge and TSSHOCK ("
    urls: ["https://blog.thorchain.org/thorchain-exploit-report-2"]
