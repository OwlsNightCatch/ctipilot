    kind: cited
    text: "Nothing secret was reached at UNCTAD: the agents wanted published figures and used the public key UNCTADstat's own data viewer sends with every request ("
    urls: ["https://siliconangle.com/2026/09/27/researcher-links-16000-scans-of-a-u-n-statistics-portal-to-openai-agents/"]
