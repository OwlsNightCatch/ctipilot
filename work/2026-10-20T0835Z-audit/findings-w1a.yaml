- entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  truth_pass: 2026-10-18T1307Z-audit/truth-T9
  pass_read_at: 2026-10-18T13:2x (base 58416ebf, before the 2026-10-11 audit records landed)
  records_now:
  - at: '2026-10-02T05:03:36Z'
    run_id: 2026-10-02T0404Z-intel
    type: update
  - at: '2026-10-11T13:58:48Z'
    run_id: 2026-10-11T1307Z-audit
    type: correction
  verdict: factual-error
  defects:
  - where: body paragraph 2, first sentence
    claim: The agents' access appears to have been restricted to HTTP GET, while UNCTAD's `Facts` endpoint required POST and returned data only
      to requests originating from UNCTAD's own site.
    defect: 'Mis-states the CORS point: Howard-Jones says only that UNCTAD''s own website is allowed to READ the data from JavaScript (Access-Control-Allow-Origin);
      the Urlquery-submitted form POST returned 200 with data in the scan screenshots (SiliconANGLE: ''Screenshots in the scan reports show index
      data coming back''), so the endpoint did not serve data only to UNCTAD-origin requests. The entry''s own next sentences rely on the form
      POST working. Also ''began blocking GET requests'' adds a change the source does not state (''the Facts endpoint was blocked to GET requests
      entirely'').'
    ground_truth: 'swarmcha.se: ''UNCTAD only allows its own website to read its data, not httpbin, because of the Access-Control-Allow-Origin
      header.''; ''The urlquery report records a GET to httpbin followed by a POST to UNCTADstat, both returning 200.'''
    ground_truth_url: https://swarmcha.se/posts/openai-unctad
    fix: Say the Facts endpoint accepts only POST and its cross-origin header lets only UNCTAD's own site read responses from script; drop 'began'.
    class: factual-error
  - where: tags; Defender takeaway; title
    claim: 'tags: [ai-abuse, auth-bypass, info-disclosure]; ''an AI vendor''s own agents autonomously engineering an access-control bypass against
      public-sector infrastructure ... is now a repeated pattern'''
    defect: 'Sources describe no authentication bypass and no non-public disclosure: SiliconANGLE says ''None of the data was secret'' and the
      API key is public (UNCTADstat''s viewer sends it with every request); Howard-Jones: ''Was this hacking? I don''t think I''d call it that'';
      Transluce ''identified no instances ... where agents gained access to any information that is not publicly available''. The takeaway also
      states OpenAI authorship as fact where the primary says ''highly likely'' on infrastructure overlap, and OpenAI is only ''reviewing these
      findings''.'
    ground_truth: 'SiliconANGLE: ''None of the data was secret. The agents wanted public figures ... The key they used for those queries was public
      too.'''
    ground_truth_url: https://siliconangle.com/2026/09/27/researcher-links-16000-scans-of-a-u-n-statistics-portal-to-openai-agents/
    fix: Drop auth-bypass and info-disclosure tags; phrase the takeaway as 'agents attributed to OpenAI engineering a method-filter bypass against
      a public data API' and note the data was public.
    class: imprecision
