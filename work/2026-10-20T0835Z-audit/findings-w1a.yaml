  defects:
  - where: 'summary; actions[0]; cves[CVE-2026-102489].fixed; body Defender takeaway; ## Update — 2026-10-10T03:43:01Z last sentence'
    claim: 'Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes | (6.5 and older receive
      no security fixes, and 7.2.0 is affected ...) | Nothing changes for the code-execution flaw: it stays exploitable only on 6.5 and older,
      which receive no security fixes.'
    defect: 'Superseded by the vendor''s own channel: on 2026-10-15 Zammad shipped 6.5.5, an exceptional emergency security release for the unsupported
      6.5 series that hardens the WebSocket server code to address CVE-2026-102489, so ''6.5 and older receive no security fixes'' and ''no fix''
      for the code-execution flaw on 6.5 are no longer true for 6.5 (6.4 and older remain unfixed; 6.5.5 is only available through a new package
      repository).'
    ground_truth: '"Zammad 6.5.5 is an exceptional security release addressing a critical vulnerability in the unsupported 6.5 series. It provides
      an emergency fix for customers who cannot immediately upgrade to a supported version." / "Zammad 6.5.5 provides an emergency security fix
      by hardening the WebSocket server code to address CVE-2026-102489" / "Zammad 6.5 users: Update to Zammad 6.5.5 immediately if upgrading
      to Zammad 7.2.2 is not yet possible." (release dated 15 October 2026; releases list shows 6.5.5 on 15 October 2026)'
    ground_truth_url: https://zammad.com/en/product/releases/6-5-5
    fix: Append an update record and section naming Zammad 6.5.5 (2026-10-15) as the emergency fix for CVE-2026-102489 on the 6.5 series (new
      package repository required; 6.4 and older and the 7.2.2-or-later recommendation unchanged), and restate 'receive no security fixes' in
      summary, actions[0], cves[CVE-2026-102489].fixed, the takeaway and the 2026-10-10 closing sentence as 'receive no regular security fixes;
      6.5 has one emergency fix (6.5.5)'.
    class: factual-error
- entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
  truth_pass: 2026-10-18T1307Z-audit/truth-T2
  pass_read_at: 2026-10-18T13:2x (base 58416ebf, before the 2026-10-11 audit records landed)
  records_now: []
  verdict: factual-error
  defects:
  - where: body paragraph 2 (Socket update line) and sourcing_note
    claim: 'A Socket update line claims more than 500 accounts and tens of thousands of repositories since 7 October without a method, against
      346 for the 8 October burst in its own body and 378 live-workflow repositories across all waves ... so the larger figure stays unconfirmed;
      sourcing_note: ''Socket''s update line ... disagrees with the counts elsewhere, so it is not carried as fact.'''
    defect: 'As the entry stands today its own cited GitGuardian page (update of 2026-10-13) carries the larger scale from GitGuardian''s own
      dataset, so ''stays unconfirmed'' / ''disagrees with the counts elsewhere'' is no longer true: more than 30,000 repositories, about 1,900
      compromised accounts, 3,174 secrets attempted, and GitHub blocking the workflow from running from 2026-10-09. The entry (updates: []) still
      presents the incident as 345 to 346 repositories from two maintainers.'
    ground_truth: 'GitGuardian (Update, Oct. 13, 2026): ''Between October 8th and 12th ... the threat actor targeted more than 30,000 repositories
      across 3,000 users and orgs. This resulted from compromising the GitHub accounts of about 1,900 users. It attempted to extract 3,174 secrets
      from public repositories'' CI.'' and ''GitHub started preventing the malicious workflow from running starting October 9.'''
    ground_truth_url: https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/
    fix: Add an update record with a section citing GitGuardian's 2026-10-13 counts (30,000+ repositories, ~1,900 accounts, GitHub blocking runs
      from 2026-10-09), replace 'stays unconfirmed' with GitGuardian's figure attributed to GitGuardian, and revise the sourcing_note.
    class: factual-error
- entry: 2026-05-18/thorchain-gg20-threshold-signature-scheme-vault-drain-11m-ac
  truth_pass: 2026-10-18T1307Z-audit/truth-T4
  pass_read_at: 2026-10-18T13:2x (base 58416ebf, before the 2026-10-11 audit records landed)
  records_now:
  - at: '2026-09-30T07:16:56Z'
    run_id: 2026-09-30T0639Z-audit
    type: correction
  verdict: factual-error
  defects:
  - where: summary; body paragraph 1
    claim: lost about $11M across nine blockchains after one of its six vaults was compromised
    defect: 'THORChain''s own incident report counts five vaults, not six (The Record and CryptoTimes say six), and gives the loss as about $10.7M
      (later report: about $10M); the entry states six as fact and rounds to $11M without surfacing the disagreement.'
    ground_truth: 'THORChain Exploit Report #1 (2026-05-20): "approximately $10.7M from a single vault (out of five)"; "The remaining four vaults
      were unaffected." The Record: "one of their six vaults was compromised, leading to a loss of about $10.7 million"; TRM Labs: "more than
      USD 11 million".'
    ground_truth_url: https://blog.thorchain.org/thorchain-exploit-report-1
    fix: 'Say one vault (THORChain''s report: one of five; The Record: six) and give about $10.7M (THORChain) with TRM''s 11M+ as the larger figure,
      or add a Contradiction line.'
    class: factual-error
  - where: title; headline; summary; body
    claim: GG20 Threshold Signature Scheme flaw suspected
    defect: The entry still presents the GG20 flaw as suspected / a working theory. THORChain confirmed it itself on 2026-05-15 and published
      a post-mortem on 2026-07-03; neither primary is cited and the entry's sourcing is secondary (The Record, TRM, CryptoTimes).
    ground_truth: 'THORChain Exploit Report #1 timeline, 2026-05-15 19:10: "the leading theory is confirmed as an exploit in the GG20 TSS implementation
      allowing progressive key material leakage"; summary: "The attacker was a newly churned node operator who entered the network two days prior
      and exploited a vulnerability in the GG20 Threshold Signature Scheme." Report #2 (2026-07-03): a cryptographic attack on the GG20 signing
      process combining three weaknesses, with the attacker''s multi-prime Paillier modulus and 864 deliberately failed signing rounds over two
      and a half days leaking key shares.'
    ground_truth_url: https://blog.thorchain.org/thorchain-exploit-report-2
    fix: 'Replace ''suspected / working theory'' with THORChain''s confirmed account and cite Reports #1 and #2 as primary sources.'
    class: imprecision
- entry: 2026-05-20/actions-cool-issues-helper-github-action-compromised-53-tags
  truth_pass: 2026-10-18T1307Z-audit/truth-T4
  pass_read_at: 2026-10-18T13:2x (base 58416ebf, before the 2026-10-11 audit records landed)
  records_now:
  - at: '2026-09-30T06:54:45Z'
    run_id: 2026-09-30T0639Z-audit
    type: correction
  verdict: factual-error
  defects:
  - where: 2026-09-30 record summary (and Correction framing)
    claim: GitHub disabled the companion maintain-one-comment repository, not issues-helper
    defect: 'Wrong: GitHub disabled both repositories on 2026-05-19. The ''not issues-helper'' contrast is contradicted by Socket and BleepingComputer
      (and the body sentence ''GitHub has since disabled access to the maintain-one-comment repository'' is only what The Hacker News knew on
      2026-05-19).'
    ground_truth: 'Socket (2026-09-24): "GitHub security team disabled both repositories on May 19, 2026, one day after the malicious content
      was introduced." BleepingComputer (2026-09-26): "the GitHub security team removed actions-cool/issues-helper and actions-cool/maintain-one-comment".'
    ground_truth_url: https://socket.dev/blog/mini-shai-hulud-actions
    fix: State that GitHub disabled both repositories on 2026-05-19; do not contrast with issues-helper.
    class: factual-error
  - where: body, Exposure, Defender takeaway (missing material development)
    claim: GitHub has since disabled access to the maintain-one-comment repository for a terms-of-service violation
    defect: The entry omits that both actions were re-enabled on 2026-09-16 with every release tag still pointing at the May payload (workflows
      referencing a tag resumed running it), that SafeDep found six more repositories infected 2026-09-20 to 09-24, and that GitHub disabled both
      again by 2026-09-25. The 'secrets exposure' window in the takeaway ('on or after 2026-05-18') is now open-ended across 2026-09-16 to 09-25.
    ground_truth: 'Socket: "On September 16, 2026, both repositories became accessible again. Their release tags were not cleaned up first. They
      still point to the malicious content introduced on May 18, so any workflow that references either action by a version tag resumed downloading
      and executing the payload on its next run." Update 2026-09-25: both disabled again. THN 2026-09-25 (SafeDep): "six new GitHub repositories
      were infected between September 20 and 24, 2026, through the actions-cool/issues-helper GitHub Action".'
    ground_truth_url: https://thehackernews.com/2026/09/compromised-github-actions-came-back.html
    fix: 'Add a changelog update: re-enable 2026-09-16, malicious tags intact, ~15,000 dependent repositories on the issues-helper dependency
      graph, disabled again 2026-09-25, review runs since 2026-09-16 and pin to a SHA that predates 2026-05-18.'
    class: imprecision
