  verdict: factual-error
  defects:
  - where: 'sourcing_note; cves[0].cvss: null'
    claim: JetBrains rates the flaw critical without a numeric score
    defect: JetBrains is the CNA and its CVE record published on 2026-07-27 carries a CVSS 3.1 base score of 9.8 (CRITICAL); the 2026-09-30 correction
      removed a score on the ground that no citable source publishes one, but the CNA record does.
    ground_truth: 'CVE-2026-63077 CNA container (JetBrains): "cvssV3_1": {"baseScore":9.8,"baseSeverity":"CRITICAL","vectorString":"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"};
      the JetBrains blog advisory itself gives only the word ''critical''.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-63077
    fix: Set cves[0].cvss to "9.8" (CVSS 3.1, CNA JetBrains) and reword the sourcing note to say the vendor blog gives no number while the CNA
      CVE record scores it 9.8.
    class: factual-error
  - where: '## Update — 2026-08-06T04:11:48Z, first paragraph'
    claim: its advisory states it was not aware of any active exploitation of the vulnerability at the time of publishing, and that advisory has
      not been revised since 2026-07-27
    defect: 'No longer true: the JetBrains advisory now carries an ''August 7, 2026 update'' banner pointing to the follow-up that reports active
      exploitation. Also the paragraph''s ''the confirmed fact is exploitation itself and nothing beyond it'' is superseded by the 2026-09-30
      section (KEV ransomware flag, Cadence breach). True on 2026-08-06 only.'
    ground_truth: 'Advisory top: "August 7, 2026 update: Please also see this follow-up blog post for additional guidance."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/
    fix: Reword to 'as of 2026-08-06 ... had not been revised since 2026-07-27' and mark the 'nothing beyond' sentence as the position at that
      date.
    class: imprecision
  - where: actions[1]
    claim: Treat any TeamCity On-Premises server that was internet-reachable and unpatched before 2026-08-05 as a compromise-assessment target
    defect: Cut-off keyed to the KEV date, but JetBrains reports exploitation since its 2026-07-27 announcement and the newest section's takeaway
      uses 'unpatched after 2026-07-27'; the two windows disagree and servers patched 07-27 to 08-05 are excluded.
    ground_truth: '"Since our initial announcement on July 27, 2026, we have received reports of active exploitation, as well as attempted exploitation,
      targeting unpatched TeamCity servers."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/
    fix: Use the same window (unpatched at any point after 2026-07-27) in actions[1] and the 08-06 takeaway.
    class: imprecision
  - where: actions[0]
    claim: take the server's agent-polling endpoint off any internet-reachable interface
    defect: (low confidence) JetBrains advises temporarily restricting external access to the TeamCity server and VPN/extra layer; it does not
      describe the agent-polling endpoint as separately closable, so the action narrows the vendor guidance.
    ground_truth: '"we strongly recommend temporarily restricting external access until you have done so."'
    ground_truth_url: https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/
    fix: Say restrict external access to the TeamCity server (or front it with VPN), as JetBrains advises.
    class: imprecision
- entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
  truth_pass: 2026-10-18T1307Z-audit/truth-T6a
