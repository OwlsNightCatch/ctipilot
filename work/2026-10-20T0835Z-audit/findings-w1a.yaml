- entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
  truth_pass: 2026-10-18T1307Z-audit/truth-T7
  pass_read_at: 2026-10-18T13:2x (base 58416ebf, before the 2026-10-11 audit records landed)
  records_now:
  - at: '2026-09-30T06:56:11Z'
    run_id: 2026-09-30T0639Z-audit
    type: correction
  - at: '2026-10-11T13:49:15Z'
    run_id: 2026-10-11T1307Z-audit
    type: correction
  verdict: factual-error
  defects:
  - where: summary (case study 7 clause) and body 'Case study 7' paragraph
    claim: a customer-service RAG agent that leaked cross-tenant PII via indirect prompt injection in forum comments
    defect: Mandiant describes Case 7 as an evaluation of a technology organization's agent that did not consider indirect prompt injection, with
      conditional outcomes ('could', 'could potentially'); it reports no attacker, no planted forum post and no actual PII leak. The entry presents
      a hypothetical as an observed attack ('an attacker embedded hidden instructions inside a public forum post ... hijacking its reasoning to
      exfiltrate other customers' PII').
    ground_truth: '''Mandiant evaluated a technology organization that deployed a public-facing AI customer service agent ... While the customer
      had strong controls around the vector database, they did not consider indirect prompt injection, which can stem from embedding hidden, malicious
      instructions inside a public forum comment ... the model could interpret the embedded instructions as system-level commands. This could
      potentially hijack the model''s reasoning, causing it to exfiltrate sensitive data from other customers'' support tickets'''
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: 'Rewrite as an assessed exposure: Mandiant evaluated a public-facing RAG customer-service agent and found it exposed to indirect prompt
      injection via forum comments and support tickets, which could let injected instructions pull other customers'' PII into responses; no exploitation
      is reported. Drop ''leaked'' from the summary.'
    class: factual-error
  - where: body 'Case study 1' first sentence (also headline and summary)
    claim: An attacker compromised a SaaS provider by poisoning an external software package that a developer's active AI coding-assistant session
      then recommended installing
    defect: 'Mandiant says the actor compromised a SaaS provider AND hijacked an active AI coding assistant session on a developer''s workstation;
      the assistant then recommended the poisoned package. The report does not state the SaaS provider was compromised by the package, and omits
      nothing about ''reviving'' Shai-Hulud; the headline''s ''a poisoned dependency revived the Shai-Hulud worm'' and the summary''s ''assistant
      recommending a poisoned dependency that deployed the worm'' compress a chain in which the attacker used the hijacked session to install
      an infostealer, harvest OAuth tokens and then deploy the worm. ''Re-poisoned the organization''s own package namespace'' is also wrong:
      the report says the actor ''poisoned a package inside the organization''s official namespace'' (first poisoning there).'
    ground_truth: '''a threat actor compromised a software-as-a-service (SaaS) provider and hijacked an active AI coding assistant session on
      a developer''s workstation ... recommended the installation of an external software package that had been poisoned by the attacker ... the
      attacker used the developer''s active session to install an infostealer using a poisoned PyPI package, harvest GitHub OAuth tokens, and
      deploy the self-propagating Shai-Hulud worm ... The actor then poisoned a package inside the organization''s official namespace'''
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
