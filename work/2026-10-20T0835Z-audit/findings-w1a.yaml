    run_id: 2026-10-11T1307Z-audit
    type: correction
  verdict: factual-error
  defects:
  - where: headline; Defender takeaway paragraph; 2026-08-05 section ('Swiss and European trustees and advisers')
    claim: yielded a targeting dataset on the owners behind Swiss- and EU-administered structures
    defect: No cited source says the register's entities are Swiss- or EU-administered. The register holds entities domiciled in Liechtenstein;
      NZZ describes foundations 'administered by Liechtenstein trustees', and The Record calls Liechtenstein a wealth hub for clients worldwide.
      The body's 'the constituency that administers those structures is largely Swiss and European ... on the other side of the border' is likewise
      uncited.
    ground_truth: 'NZZ: "In dem Verzeichnis werden sämtliche Stiftungen, Treuhandgesellschaften und Unternehmen erfasst, die in Liechtenstein
      ihren Sitz haben"; also "von reichen Russen gegründet und von liechtensteinischen Treuhändern verwaltet".'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Say the register covers beneficial owners of Liechtenstein-domiciled companies, foundations and trusts (an internationally sourced client
      base), and mark the Swiss/EU fiduciary exposure as the entry's inference.
    class: factual-error
  - where: '## Update — 2026-09-02T04:50:00Z, Defender takeaway (updated)'
    claim: both jurisdictions' registers reach the same client population
    defect: Unsupported and uncited. The Swiss register covers Swiss companies, foundations and similar entities; the Liechtenstein register covers
      Liechtenstein entities. No source establishes a shared client population.
    ground_truth: 'NZZ (Swiss register): "Ab einer Beteiligung von 25 Prozent müssen etwa Aktien-, Kapitalgesellschaften oder Genossenschaften
      melden"; Liechtenstein register: entities with seat in Liechtenstein.'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Replace with a hedged statement (Swiss fiduciaries and banks may serve clients in both) or cut the sentence.
    class: imprecision
  - where: '## Update — 2026-09-02T04:50:00Z, first paragraph; updates[2] record summary'
    claim: Switzerland's own incoming Transparency Register — covering roughly 500,000 beneficial owners
    defect: The ~500,000 figure counts legal entities required to register, not beneficial owners; the cited Inside Paradeplatz text conflates
      them ('Namen der 500'000 tatsächlichen Besitzer'), but NZZ, which Inside Paradeplatz links for the figure, says 500,000 companies and foundations.
    ground_truth: 'NZZ 2025-06-13: "rund 500 000 Aktiengesellschaften, GmbH, Genossenschaften und Stiftungen sowie auch gewisse Vereine ihre «wahren»
      Eigentümer in das geplante Transparenzregister eintragen".'
    ground_truth_url: https://www.nzz.ch/wirtschaft/rund-500-000-gesellschaften-sollen-kuenftig-ihre-wahren-eigentuemer-in-einem-nationalen-register-offen-legen-ld.1888659
    fix: Write 'roughly 500,000 legal entities' (and cite NZZ for the figure).
    class: imprecision
  - where: body paragraph 2 ('The government's own timeline')
    claim: because detection was human and internal rather than telemetry-driven
    defect: The release only says irregularities 'fell' to the Office of Justice during 30 July; it does not say how they were detected. NZZ separately
      says the thousands of requests during the night triggered no alarm, which says nothing about how the irregularity was found.
    ground_truth: '"Im Verlauf des Tages vom 30. Juli 2026 fielen beim Amt für Justiz Unregelmässigkeiten auf."'
    ground_truth_url: https://www.presseportal.ch/de/pm/100000148/100941487
    fix: Drop 'human and internal rather than telemetry-driven' or mark it as the entry's inference.
    class: imprecision
  - where: Defender takeaway, second lesson
    claim: taking four unrelated e-government services offline "as a precaution" is what happens when blast radius cannot be proven quickly from
      telemetry
    defect: The government gives the reason as precaution and careful checking for possible security gaps, not inability to prove blast radius;
      the causal reading is the entry's own inference stated as fact.
    ground_truth: '"aus Sicherheitsgründen und zur sorgfältigen Prüfung allfälliger Sicherheitslücken weitere Systeme als Vorsichtsmassnahme vorübergehend
      vom Netz zu nehmen"'
    ground_truth_url: https://www.presseportal.ch/de/pm/100000148/100941500
    fix: Phrase as 'a pattern consistent with' or cut.
    class: imprecision
  - where: updates[1] record summary (2026-09-01)
    claim: NZZ reporting from the government's own 2026-08-04 press briefing, sourced to Liechtenstein IT-office director Fabian Schmid, names
      the access mechanism
    defect: NZZ attributes only the no-mass-query / several-hours point to Schmid; the mechanism sentences (vulnerability in the portal or interface,
      new account, record-by-record queries) carry no attribution to the briefing or to Schmid. The section body words it correctly.
    ground_truth: '"Die Schnittstelle lässt keine Massenabfrage zu. Deshalb dauerte es mehrere Stunden ... wie der Leiter des Amts für Informatik
      in Liechtenstein, Fabian Schmid, vor den Medien sagte."'
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Attribute only the several-hours detail to Schmid; the mechanism to NZZ's reporting.
    class: imprecision
