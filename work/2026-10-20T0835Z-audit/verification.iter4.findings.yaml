- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce"
  url_or_quote: "https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"
  summary: "Correction section 2026-10-20: \"Until a fix is applied, JetBrains advises restricting external access to the server itself, and a VPN or an additional security layer for internet-facing servers\"; Triage line: \"JetBrains recommends ... requiring a VPN or an additional security layer in front of internet-facing servers\". The cited follow-up says only \"we strongly recommend temporarily restricting external access until you have done so\" is the interim measure; the VPN advice is a separate paragraph, \"Internet-facing TeamCity servers should also consider requiring connections through a VPN or implementing an additional security layer\" (the 2026-07-27 post calls it \"a longer-term security best practice ... consider requiring VPN connections\"). The clause drops 'consider' and, in the section, ties the VPN advice to the interim period. Fix: say JetBrains advises temporarily restricting external access until patched and, as a longer-term practice, suggests considering a VPN or extra security layer."
- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce"
  url_or_quote: "https://nlnetlabs.nl/projects/unbound/security-advisories/#heap-buffer-overflow-and-possible-remote-code-execution-when-digesting-dnskey"
  summary: "(low confidence) Main analysis: \"CVSS4.0 9.1, the score of the vector NLnet Labs publishes as the CVE's numbering authority\"; Correction 2026-10-20: \"as the CVE's numbering authority, NLnet Labs rates the flaw Critical and links the CVSS 4.0 vector that scores 9.1\". The cited NLnet page lists \"Severity: Critical\" with a CVSS 4.0 vector link, but never says NLnet Labs is the CVE numbering authority and carries no numeral 9.1 (the numeral is on the NCSC-CH page cited next). ENISA's EUVD record read this iteration (API, EUVD-2026-80291, assigner NLnet Labs, baseScore 9.1) supports the fact but is not cited. Fix: drop 'as the CVE's numbering authority' or cite a page that states it."
