  - title: "Unauthenticated PHP eval() injection RCE in WordPress Everest Forms Pro (CVE-2026-3300)"
    sources:
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-3300", publisher: "NVD", date: "2026-06-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/everest-forms-pro-wordpress-rce-cve-2026-3300.html", publisher: "The Hacker News", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('WordPress plugin RCE June 2026 actively exploited') → NVD CVE-2026-3300 → corroborating: THN URL https://thehackernews.com/2026/06/everest-forms-pro-wordpress-rce-cve-2026-3300.html"
    summary: |
      CVE-2026-3300 is a CVSS 9.8 critical unauthenticated remote code execution vulnerability in Everest Forms Pro (WordPress plugin), all versions through 1.9.12. The vulnerable code path is the `process_filter()` function within the Calculation Addon: user-submitted form field values are concatenated into a PHP code string and passed directly to PHP's `eval()` without sanitisation. An unauthenticated attacker can submit a crafted form value (e.g., a form accessible to anonymous visitors) that executes arbitrary PHP code in the WordPress process context, typically resulting in web shell deployment. Approximately 4,000 active WordPress installations use Everest Forms Pro with the Calculation Addon enabled; active exploitation has been observed in the wild. Technique: T1059.004 (Command and Scripting Interpreter — Unix Shell via PHP eval), T1505.003 (Server Software Component: Web Shell). Detection: WAF rules matching `eval(` in form POST parameters; web server access logs showing 500 errors or unusual POST bodies to Everest Forms endpoints; monitor WordPress `uploads/` and plugin directories for new PHP files (T1505.003 artefacts). Hardening: update to Everest Forms Pro 1.9.13 or later; disable the Calculation Addon if not in use; use a WAF with PHP injection signatures.
    ch_eu_nexus: "Global; WordPress is widely used in CH/EU public-sector and NGO web environments"
    public_sector_nexus: "indirect — affects any WordPress installation using this plugin"
    sector: "cross-sector, public-sector, NGO"
