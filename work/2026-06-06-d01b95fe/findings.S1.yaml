    summary: |
      CISA added CVE-2026-28318 (SolarWinds Serv-U uncontrolled resource consumption) to the KEV catalog on 2026-06-05 with remediation deadline 2026-06-19. The vulnerability allows an unauthenticated remote attacker to crash the Serv-U SFTP/FTP service by sending an HTTP POST request with `Content-Encoding: deflate` containing a crafted payload that triggers uncontrolled decompression memory exhaustion. CVSS 3.1 base score 7.5 (high). The service crashes and does not auto-restart on default configurations, causing a complete availability disruption. Fixed in Serv-U 15.5.4 Hotfix 1. Technique class: T1499.003 Application Exhaustion Flood, requiring no authentication and exploitable from the public internet against any Serv-U instance with the SFTP/HTTP interface exposed. Detection: monitor Serv-U service process restart events; watch for POST requests with unusual `Content-Encoding` values in web server access logs. SolarWinds published the fix on 2026-06-04; CISA's KEV listing the following day indicates confirmed exploitation in the wild.
