  - title: "Chrome 149 patches 429 vulnerabilities including CVSS 9.6 ANGLE sandbox escape (CVE-2026-10881)"
    sources:
      - { url: "https://www.securityweek.com/chrome-149-patches-429-vulnerabilities-record-release/", publisher: "SecurityWeek", date: "2026-06-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/chrome-149-cve-2026-10881-angle-sandbox-escape.html", publisher: "The Hacker News", date: "2026-06-06", role: "corroborating" }
