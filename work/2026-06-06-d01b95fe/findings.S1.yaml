  - title: "OP-512: China-linked IIS web shell cluster with timestomping evasion"
    sources:
      - { url: "https://www.reliaquest.com/blog/op-512-china-linked-iis-webshell-framework-timestomping/", publisher: "ReliaQuest", date: "2026-06-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/op-512-china-iis-webshell-timestomping.html", publisher: "The Hacker News", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('China IIS web shell June 2026 espionage') → primary: ReliaQuest blog URL https://www.reliaquest.com/blog/op-512-china-linked-iis-webshell-framework-timestomping/ → corroborating: THN URL https://thehackernews.com/2026/06/op-512-china-iis-webshell-timestomping.html"
    summary: |
      ReliaQuest disclosed OP-512, a China-linked threat cluster (moderate-to-high confidence attribution) operating a custom three-web-shell framework exclusively targeting Microsoft IIS servers. The cluster is espionage-focused and represents the fourth distinct China-linked group to target IIS in the past 12 months. The framework deploys three purpose-built ASPX web shells with distinct roles: initial access shell (lightweight, minimal footprint), persistence shell (handles long-term C2), and exfiltration shell (data staging and chunked transfer). The cluster's primary anti-forensic technique is timestomping (MITRE T1099): artefact creation and modification timestamps on all three web shells are manipulated to match timestamps of legitimate IIS system files (`%SystemRoot%\System32\inetsrv\`), making timeline-based triage ineffective for distinguishing legitimate IIS components from the backdoors. Technique mapping: T1505.003 (Web Shell), T1099 (Timestomp), T1041 (Exfiltration Over C2 Channel). Detection: do NOT rely on filesystem modification timestamps for IIS web shell hunting — use content-based detection instead (string pattern matching on ASPX file content for `eval(`, `exec(`, base64-encoded payload patterns) and file-hash comparison against known-good IIS content. Monitor IIS worker process (`w3wp.exe`) spawning `cmd.exe`, `powershell.exe`, or `csc.exe` as child processes (Sysmon EID 1). Use Windows Security Event ID 4663 on `%SystemRoot%\System32\inetsrv\` to detect file writes that bypass timestamp-based filters. Hardening: deploy Application Control (WDAC/AppLocker) to prevent execution of unsigned ASPX artefacts written to the IIS root.
    ch_eu_nexus: "European public-sector and government IIS deployments are in scope — OP-512 targets are consistent with espionage interest in EU administrative infrastructure"
    public_sector_nexus: "direct — IIS is used in many public-sector portals and intranet systems"
    sector: "public-sector, government, defence"
    cves: []
