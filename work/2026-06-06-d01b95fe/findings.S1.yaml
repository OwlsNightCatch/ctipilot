  - title: "IronWorm npm supply-chain infostealer with eBPF kernel rootkit and Tor C2"
    sources:
      - { url: "https://jfrog.com/blog/ironworm-npm-supply-chain-attack-rust-ebpf-rootkit/", publisher: "JFrog Security Research", date: "2026-06-03", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/ironworm-npm-malware-ebpf-rootkit-tor-c2/", publisher: "BleepingComputer", date: "2026-06-04", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/06/ironworm-npm-supply-chain-rust-ebpf.html", publisher: "The Hacker News", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('npm supply chain attack June 2026 eBPF rootkit') → primary: JFrog Security Research blog URL https://jfrog.com/blog/ironworm-npm-supply-chain-attack-rust-ebpf-rootkit/ → corroborating: BleepingComputer → THN"
    summary: |
      JFrog Security Research published on 2026-06-03 the discovery of IronWorm, a sophisticated npm supply-chain attack campaign targeting 36-37 packages in the `asteroiddao` and WeaveDB npm ecosystems. The malicious packages deliver a Rust-compiled infostealer binary via a `preinstall` hook (T1195.002 Compromise Software Supply Chain, T1059.004 Unix Shell via npm lifecycle scripts). The binary deploys an eBPF kernel rootkit that manipulates `/proc` to hide its process ID (PID) from userland tools including `ps`, `top`, `lsof`, and EDR agents using procfs enumeration. Exfiltration targets 86 environment variables and credential paths across 20+ categories: AWS, GCP, Azure service principals, Kubernetes config files (`~/.kube/config`), npm auth tokens (`~/.npmrc`), Docker credential stores, GitHub personal access tokens, and AI platform API keys (OpenAI, Anthropic). Command-and-control uses Tor hidden services for exfiltration, complicating network-level blocking. Self-propagation occurs via stolen npm credentials: the malware publishes new malicious package versions under the victim's identity. A backdated git commit technique is used to blend malicious additions into repository history, with author set to `claude <claude@users.noreply.github.com>` to mimic automated/AI-generated commits. The campaign spans multiple ecosystems beyond npm: PyPI, Cargo (Rust), Conan (C++), and vcpkg equivalents. Detection: monitor `preinstall`/`postinstall` npm lifecycle script executions (Sysmon EID 1, parent `node`, child `sh`/`bash`); audit `~/.npmrc` for unexpected token rotation; watch for eBPF program loads from unprivileged processes (`bpf()` syscall monitoring via auditd or Sysmon-for-Linux); network telemetry for Tor exit node connections. Hardening: enforce `npm install --ignore-scripts` in CI/CD pipelines; pin package versions with lockfile integrity verification; restrict eBPF capability to privileged system processes.
    ch_eu_nexus: "Global; affects any organisation using asteroiddao/WeaveDB npm packages; cloud and AI development teams in CH/EU directly at risk"
    public_sector_nexus: "indirect — public-sector software supply chains and DevOps pipelines at risk"
    sector: "software-development, cloud, cross-sector"
    cves: []
    actors_campaigns_malware: ["IronWorm"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "IronWorm deploys an eBPF rootkit that hides its PID from /proc and all userland enumeration tools; exfiltrates 86+ env variables and credential paths via Tor hidden service C2"
        attribution: "JFrog Security Research"
        source_url: "https://jfrog.com/blog/ironworm-npm-supply-chain-attack-rust-ebpf-rootkit/"
      - quote: "Malicious commits are backdated and attributed to 'claude <claude@users.noreply.github.com>' to mimic AI-generated automation and evade manual history review"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/ironworm-npm-malware-ebpf-rootkit-tor-c2/"

  - title: "Miasma supply-chain worm expands to 73 Microsoft GitHub repositories (UPDATE)"
    sources:
      - { url: "https://thehackernews.com/2026/06/miasma-worm-microsoft-github-azure.html", publisher: "The Hacker News", date: "2026-06-06", role: "primary" }
