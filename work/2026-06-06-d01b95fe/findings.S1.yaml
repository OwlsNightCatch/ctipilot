      - { url: "https://www.bleepingcomputer.com/news/security/cisco-sd-wan-manager-zero-day-cve-2026-20245-actively-exploited/", publisher: "BleepingComputer", date: "2026-06-05", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0175", publisher: "NCSC-NL", date: "2026-06-05", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-nl recent, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0175 → primary: Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx"
    summary: |
      A second Cisco Catalyst SD-WAN Manager zero-day (CVE-2026-20245) has been confirmed under active exploitation, distinct from CVE-2026-20182 (covered in weekly W22). CVE-2026-20245 is a CLI command injection vulnerability in the SD-WAN Manager's diagnostic command interface, exploitable by an authenticated attacker holding netadmin-level credentials (or any privilege obtained via chaining with CVE-2026-20182). The crafted file upload path in the CLI diagnostic handler fails to sanitise shell metacharacters, allowing arbitrary OS commands to execute as root on the underlying appliance. Cisco Mandiant observed exploitation resulting in configuration changes being pushed to managed edge devices. No patch is available as of 2026-06-05; Cisco has not yet issued a scheduled advisory date. CVSS 3.1 base score 7.8 (high). Forensic indicator cited by Cisco: anomalous entries in `/var/log/scripts.log`. Attack technique: T1059.004 (Unix Shell) post-auth, chained with T1078 (Valid Accounts — netadmin creds) and T1190 for initial access via CVE-2026-20182. Detection: audit `scripts.log` for unexpected command strings; EDR process tree showing `vdaemon` or SD-WAN manager process forking a shell with privileged UID. Hardening: restrict CLI access to management VLAN; enforce multi-factor for netadmin; consider compensating control per Cisco's advisory until patch available.
    ch_eu_nexus: "Global; public-sector SD-WAN deployments in CH/EU likely affected — CVE-2026-20182 (same product line) was previously NCSC-CH tracked"
    public_sector_nexus: "direct — SD-WAN widely deployed in public-sector network edge"
    sector: "public-sector, telco, critical infrastructure"
