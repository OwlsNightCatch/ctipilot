  - title: "Cisco Catalyst SD-WAN Manager CLI command injection actively exploited zero-day (CVE-2026-20245) — no patch available"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-privesc-4uxFrdzx", publisher: "Cisco PSIRT", date: "2026-06-05", role: "primary" }
