  - title: "HTTP/2 HPACK compression amplification DoS (CVE-2026-49975) — nginx, Apache httpd, IIS, Envoy"
    sources:
      - { url: "https://blog.calif.io/http2-bomb-cve-2026-49975", publisher: "Calif Security Blog", date: "2026-06-04", role: "primary" }
      - { url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitsberatung/DE/WID-SEC-2026-1791.html", publisher: "BSI", date: "2026-06-05", role: "corroborating" }
      - { url: "https://www.ncsc.admin.ch/security-hub/posts/12610", publisher: "NCSC-CH", date: "2026-06-04", role: "corroborating" }
    discovery_trace: "first seen at: bsi-rss bridge → WID-SEC-2026-1791 listing → url fetch WID-SEC-2026-1791 CSAF → primary: Calif blog URL https://blog.calif.io/http2-bomb-cve-2026-49975 → corroborating: NCSC-CH post 12610"
    summary: |
      CVE-2026-49975 (named "HTTP/2 Bomb") is a newly disclosed HTTP/2 HPACK header compression amplification vulnerability affecting nginx (prior to 1.28.2), Apache httpd (prior to 2.4.65), Microsoft IIS (unpatched as of disclosure), Envoy proxy, and Cloudflare Pingora. The vulnerability allows a single unauthenticated client with a low-bandwidth connection to exhaust server RAM within seconds: the attacker sends an HTTP/2 request carrying a maximally compressed HPACK header block that decompresses into gigabytes of header data. The server's HTTP/2 HPACK dynamic table is allocated without adequate size bounds, causing uncontrolled memory growth until OOM kill or service crash. A public proof-of-concept was released alongside the Calif blog post on 2026-06-04. BSI issued advisory WID-SEC-2026-1791 on 2026-06-05; NCSC-CH flagged it the same day. Technique: T1499.002 Service Exhaustion Flood via protocol-layer amplification. Prerequisite: HTTP/2 enabled on the target (default for modern nginx/Apache/IIS configurations). Detection: watch for connections with abnormally large header section sizes before request body; monitor for rapid RSS growth in the web server process and OOM kernel events. Partial patches are available for nginx and Apache httpd; IIS patch status unknown at time of writing. Operators should consider disabling HTTP/2 on public-facing services as a compensating control until patched.
    ch_eu_nexus: "Direct CH/EU impact — nginx and Apache httpd power the majority of CH/EU public-sector web infrastructure; BSI and NCSC-CH both flagged in-window"
    public_sector_nexus: "direct — public web servers at risk"
