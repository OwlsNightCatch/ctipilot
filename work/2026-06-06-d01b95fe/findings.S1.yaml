    summary: |
      The Miasma self-replicating supply-chain worm (previously covered 2026-06-02 targeting Red Hat/TeamPCP ecosystem) has expanded its infection footprint to 73 Microsoft GitHub repositories across the Azure, Azure-Samples, Microsoft, and MicrosoftDocs GitHub organisations. GitHub has disabled access to the affected repositories pending remediation. The expansion demonstrates Miasma's self-propagation via stolen developer OAuth tokens: the worm reads GitHub auth tokens from the local credential store of any infected developer machine, uses those tokens to push malicious commits to repositories the developer has write access to, and injects its `preinstall` script payload into those repos' `package.json`. The Microsoft repository set represents a significant escalation in attack surface: Azure-Samples repositories are frequently used as reference implementations by enterprise cloud architects, meaning the infection can propagate downstream to production codebases that clone these samples. Technique: T1195.002 (Compromise Software Supply Chain), T1528 (Steal Application Access Token). Detection: audit GitHub Actions workflow logs for unexpected `npm publish` or commit pushes from known accounts at unusual hours; monitor for `preinstall` lifecycle script changes in `package.json` on any cloned Azure-Samples/Azure/Microsoft organisation repository. Hardening: rotate all GitHub PATs on developer machines that ran npm installs from infected TeamPCP packages in the past two weeks; enable GitHub push protection and secret scanning on all repos.
    ch_eu_nexus: "Global; Microsoft/Azure-Samples repos are a reference point for Swiss and European public-sector cloud migrations — downstream compromise risk is significant"
    public_sector_nexus: "indirect — Azure-Samples used in public-sector Azure deployments"
