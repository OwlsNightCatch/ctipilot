    summary: |
      Google Chrome 149 shipped on 2026-06-04 patching a record 429 vulnerabilities in a single release, more than 100 of which are rated critical or high. The most critical is CVE-2026-10881 (CVSS 3.1 9.6, no authentication required), an out-of-bounds read/write in the ANGLE graphics engine (the cross-platform OpenGL-ES-to-native-graphics translation layer used for GPU rendering). A crafted HTML page can trigger a type-confused GPU buffer access in ANGLE's shader compiler, enabling sandbox escape from the Chrome renderer process. Google's bug reports state no active exploitation has been observed. The unusually large patch count is attributed to AI-assisted fuzzing infrastructure Google deployed in early 2026, which accelerated crash discovery across Blink, V8, and ANGLE at scale. Technique: T1203 Exploitation for Client Execution (browser), T1068 Exploitation for Privilege Escalation (sandbox escape). Detection: enforce Chrome auto-update policies via MDM; monitor for Chrome version older than 149.0.7732.45 on managed endpoints. Hardening: update to Chrome 149.0.7732.45 or later immediately; enterprise deployments should validate MDM push succeeded within 48 hours. Edge uses the same Chromium ANGLE codebase — monitor for a parallel Microsoft Edge security update.
    ch_eu_nexus: "Global; Chrome is the dominant browser in CH/EU public-sector environments"
    public_sector_nexus: "direct — browser deployed on all public-sector endpoints"
