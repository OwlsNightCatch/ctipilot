    summary: |
      Altium disclosed a cluster of three path traversal vulnerabilities in Altium Enterprise Server (on-premises edition), all fixed in version 8.1.1. CVE-2026-11420 (CVSS 4.0: 10.0) is the most critical: an unauthenticated path traversal in the Network Installation Service (NIS) component allows an attacker to write arbitrary files to any location on the server filesystem, enabling remote code execution without credentials by writing a web shell or modifying configuration files. CVE-2026-11419 (CVSS 4.0: 9.4) is an authenticated path traversal in the Vault Service UploadController — post-authentication file write to arbitrary filesystem locations. CVE-2026-11429 (CVSS 4.0: 9.4) is an authenticated path traversal in the Git Service that allows moving files to arbitrary locations, reachable to RCE via configuration file manipulation. All three affect on-premises Altium Enterprise Server deployments only; Altium 365 (cloud) was remediated at the service level before public disclosure. No exploitation has been observed (EPSS ~0.0 at time of writing). Technique: T1190 (Exploit Public-Facing Application), T1505.003 (Web Shell via unauthenticated file write). Affected: Altium Enterprise Server < 8.1.1. Patched: 8.1.1. Detection: monitor NIS service (`AltiumNIS.exe`) and Vault/Git service HTTP handlers for path components containing `../` or URL-encoded equivalents (`%2F%2E%2E`); look for unexpected file writes in the Enterprise Server install directory from service accounts. Hardening: update to 8.1.1 immediately; restrict network access to the NIS port to internal management VLANs only.
    ch_eu_nexus: "Altium Enterprise Server is used by electronics and defence engineering firms in CH/EU; the unauthenticated file write vector is critical for any internet-exposed deployment"
    public_sector_nexus: "indirect — defence and critical infrastructure engineering supply chains"
    sector: "manufacturing, defence, engineering"
    cves: [CVE-2026-11420, CVE-2026-11419, CVE-2026-11429]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-11420: CVSS 4.0 score 10.0; unauthenticated path traversal in Altium Enterprise Server Network Installation Service enables arbitrary file write to any filesystem location"
        attribution: "ENISA EUVD"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-11420"
      - quote: "All three CVEs fixed in Altium Enterprise Server 8.1.1; Altium 365 cloud remediated before disclosure"
        attribution: "Altium Security Advisory"
        source_url: "https://www.altium.com/security-advisory/cve-2026-11420"

