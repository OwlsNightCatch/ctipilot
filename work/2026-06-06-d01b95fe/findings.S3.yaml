items:
  - title: "Mandiant/GTIG + FBI FLASH: UNC3753 (Luna Moth / Silent Ransom Group) pivots to in-person physical access in vishing campaign against US law firms"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"
        publisher: "Mandiant / Google Cloud GTIG"
        date: "2026-06-05"
        role: "primary"
      - url: "https://www.ic3.gov/CSA/2026/260526.pdf"
        publisher: "FBI IC3 Cyber FLASH (Silent Ransom Group)"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/fbi-warns-of-luna-moth-extortion-attacks-targeting-law-firms/"
        publisher: "BleepingComputer"
        date: "2025-05-23"
        role: "historical-context"
    discovery_trace: "first seen at: mandiant-gtig feed (Feedburner), URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v → primary: Mandiant GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/ → corroborating: WebSearch('Mandiant UNC3753 Luna Moth law firm vishing 2026 June FBI FLASH') → FBI FLASH URL https://www.ic3.gov/CSA/2026/260526.pdf"
    summary: |
      Mandiant GTIG published a comprehensive analysis on June 5, 2026 of a January–May 2026 campaign by UNC3753 (aliases: Luna Moth, Chatty Spider, Silent Ransom Group) targeting dozens of US law firms, professional-services and financial-services organisations. The actor has shifted from subscription-themed billing lures (pre-2025) to impersonating internal IT helpdesk and, in a novel escalation, dispatching in-person operatives to victim offices with USB media for direct file theft. The initial access chain is purely social-engineered: a benign invoice-themed email establishes pretext, then a vishing call posing as IT support walks the victim through hosting a screen-sharing session and installing an RMM agent (AnyDesk, Bomgar, Zoho Assist, or SuperOps). Once inside, actors pivot through BYOD devices to Windows 365 or Citrix VDI, enumerate file systems, search iManage for legal-matter keywords, then stage and exfiltrate in under one hour via WinSCP or Rclone to consumer cloud storage. Extortion arrives by unbranded email within 30 minutes of data theft, citing a 3-day deadline and threatening LEAKEDDATA DLS publication alongside regulatory notifications to clients and partners. The FBI's May 2026 Cyber FLASH (TLP:CLEAR) independently corroborates the campaign and notes the physical-access escalation. MITRE techniques mapped by Mandiant include T1566.004 (Spearphishing Voice), T1204.002 (User Execution: Malicious File), T1059.001 (PowerShell), T1059.003 (Windows Command Shell), T1053.005 (Scheduled Task), T1547.001 (Boot/Logon Autostart), T1036.005 (Masquerading), T1562.001 (Impair Defenses), T1070.001 (Clear Windows Event Logs), T1083 (File and Directory Discovery), T1135 (Network Share Discovery), T1219 (Remote Access Software), T1020 (Automated Exfiltration), T1567.002 (Exfiltration to Cloud Storage), T1052.001 (Exfiltration Over Physical Medium). Detection pivots: alert on rapid keyword-search-spike telemetry in iManage/SharePoint, RMM installation events from cmd/PowerShell (Sysmon EID 1, parent process anomalies), mass file downloads from VDI sessions, outbound SSH (port 22) with high byte-transfer volumes, and scheduled tasks created in user-profile paths. Harden: block unauthorized RMM agents (WDAC/MDR policy), restrict VDI/VPN auth to corporate-managed devices, enable step-up MFA on VDI access from BYOD, disable USB storage write via GPO, and mandate front-desk visitor-credentialing with escort policies.
    ch_eu_nexus: "Primarily US-targeted, but campaign TTPs directly relevant to Swiss and EU law firms, professional services, and financial organisations; physical intrusion escalation raises duty-of-care questions for European legal sector"
    public_sector_nexus: "indirect — public-sector legal counsel and government-adjacent professional services firms in scope"
    sector: "legal, professional-services, financial"
    cves: []
    actors_campaigns_malware: ["UNC3753", "Luna Moth", "Silent Ransom Group", "Chatty Spider"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "From January through May 2026, Mandiant identified a financially motivated data theft extortion campaign executed by the threat cluster UNC3753 (also tracked as \"Luna Moth,\" \"Chatty Spider,\" and \"Silent Ransom Group\") targeting dozens of organizations across professional, legal, and financial services in the United States."
        attribution: "Mandiant / Google Cloud GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"
      - quote: "In many Mandiant investigated incidents, the entire attack sequence—from initial target contact to data theft and extortion—occurred within a single business day. Recently, Mandiant observed data searches, staging, and theft initiated in under an hour."
        attribution: "Mandiant / Google Cloud GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"
    extended_notes: |
      Physical access is the new escalation to watch: the actor now sends operatives with USB drives directly to victim offices, bypassing all network-side EDR. Visitor management and physical security posture become a detection surface — event IDs and EDR telemetry alone cannot catch this. The actor's preference for screen-sharing via legitimate enterprise tools (Zoom, Teams Quick Assist) to deliver RMM agents means DNS/proxy telemetry for RMM installer MSI downloads and subsequent C2 traffic is a higher-fidelity hunt than process-tree alone. The LEAKEDDATA DLS (hxxps://business-data-leaks[.]com) is the extortion publication platform named in the Mandiant report.

  - title: "UPDATE: Miasma worm expands to 73 Microsoft Azure/Azure-Samples/Microsoft/MicrosoftDocs GitHub repos — Azure Durable Task Functions ecosystem at centre"
    sources:
      - url: "https://opensourcemalware.com/blog/miasma-reaches-azure"
        publisher: "OpenSourceMalware.com"
        date: "2026-06-05"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html"
        publisher: "The Hacker News"
        date: "2026-06-06"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (Feedburner), URL https://feeds.feedburner.com/TheHackersNews → title 'Miasma Worm Hits 73 Microsoft GitHub Repositories' → pivot: WebSearch('Miasma worm Microsoft Azure GitHub repos June 2026') → primary: OpenSourceMalware.com blog, URL https://opensourcemalware.com/blog/miasma-reaches-azure"
    summary: |
      On June 5, 2026, GitHub disabled 73 Microsoft repositories across four GitHub organisations (Azure, Azure-Samples, Microsoft, MicrosoftDocs) in a 105-second automated sweep after the Miasma self-propagating worm — a descendant of the Mini Shai-Hulud worm open-sourced by TeamPCP in mid-May 2026 — successfully recompromised the `durabletask` npm package and spread into the entire Azure Functions / Durable Task family (.NET, Go, Java, JS, MSSQL, Netherite, protobuf implementations, plus the Durable Functions monitor). The updated Miasma variant adds dedicated Azure CLI auth-cache and managed-identity-token collectors, extending its earlier AWS and GitHub credential reach into Azure and GCP. The worm's persistence mechanism writes harvested secrets as JSON into public GitHub repos with the description "Miasma: The Spreading Blight," which triggers GitHub's automated Terms-of-Service enforcement and surfaces the compromise to defenders. This is the fourth ecosystem escalation in the Miasma campaign arc: Red Hat @redhat-cloud-services (June 1, 32 packages) → mantine-datatable direct GitHub commits (June 3) → Microsoft Durable Task ecosystem (June 5). The Microsoft Durable Task package is a foundational dependency for Azure serverless workflows and is consumed by a large fraction of Azure-hosted enterprise applications. Defenders should audit `~/.azure/` credential stores on developer workstations, CI/CD runners, and any environment that installs npm packages from the affected namespace; rotate Azure managed-identity tokens and Kubernetes service-account tokens on systems that ran the compromised packages.
    ch_eu_nexus: "Direct: Azure Durable Task is consumed widely in Swiss and EU public-sector cloud deployments running Azure Functions or Durable Workflows; any Azure-based CI/CD pipeline consuming @azure/* npm packages should be considered potentially affected"
    public_sector_nexus: "direct — Azure Functions is deployed across EU public administrations and cloud-hosted citizen services"
    sector: "cloud, devops, public-sector, software-supply-chain"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Miasma", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-02"
    evidence:
      - quote: "GitHub disabled 73 Microsoft repositories across four of its GitHub organizations — the entire Azure Functions org, the whole Durable Task family, and a row of AI sample apps — in a 105-second sweep on June 5."
        attribution: "OpenSourceMalware.com"
        source_url: "https://opensourcemalware.com/blog/miasma-reaches-azure"
      - quote: "The variant added dedicated Azure and GCP credential collectors, reaching for Azure CLI auth caches and managed-identity tokens, whereas earlier Shai-Hulud strains went after AWS and GitHub."
        attribution: "OpenSourceMalware.com / The Hacker News"
        source_url: "https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html"
    extended_notes: |
      The worm's self-reporting by writing secrets into public GitHub repos is a double-edged artefact: it exposes attacker-harvested credentials to defenders watching the specific repository description pattern, but also means any valid Azure credential is briefly public before GitHub's TOS sweep catches it. The 105-second sweep duration is notable — it implies automated scanning at GitHub scale but leaves a window. The @azure/durabletask-netherite package (a high-throughput Durable Functions backend) and the @azure/durabletask-protobuf package are the most widely consumed affected packages beyond the core framework.

  - title: "OP-512: China-linked cluster deploys cryptographically unique, self-reporting IIS web shell framework against legacy .NET 4.0 servers"
    sources:
      - url: "https://reliaquest.com/blog/threat-spotlight-reliaquests-agentic-ai-uncovers-new-china-linked-cluster-op-512"
        publisher: "ReliaQuest Threat Research"
        date: "2026-06-05"
        role: "primary"
    discovery_trace: "first seen at: hackernews feed (Feedburner), URL https://feeds.feedburner.com/TheHackersNews → item 'New Threat Cluster OP-512 Targets Microsoft IIS Servers with Custom Web Shell Framework' → WebSearch('ReliaQuest OP-512 China IIS web shell espionage 2026 June') → primary: ReliaQuest blog URL https://reliaquest.com/blog/threat-spotlight-reliaquests-agentic-ai-uncovers-new-china-linked-cluster-op-512"
    summary: |
      ReliaQuest published on June 5, 2026 a technical spotlight on OP-512, a previously unreported China-linked espionage cluster that targets internet-facing Microsoft IIS servers running end-of-life .NET Framework 4.0. The cluster's distinctive capability is a three-component web shell framework: one `.aspx` file manager and two `.ashx` cryptographic command handlers. Each deployment is per-victim cryptographically unique — RSA signatures and RC4 encryption keyed differently per installation — making signature-based detection ineffective. The web shell carries a timestomping module to match file modification timestamps to surrounding legitimate artefacts, uses reflective .NET assembly loading to bypass static scanning, and implements a dual-channel authentication scheme with separate RSA keys per handler. A novel self-reporting mechanism hex-encodes the deployed web shell's URL as a DNS subdomain query from the compromised `w3wp.exe` process (pattern: `a.<hex>.c.hcgos[.]com`), centralising management across victims and alerting the attacker when a shell is successfully deployed. The C2 fallback is an outbound Meterpreter connection on non-standard ports (e.g., 8053). ReliaQuest found evidence of initial access 75 days before web shell deployment, consistent with patient espionage tradecraft. OP-512 shares the hex-encoded DNS subdomain technique with CL-STA-0048 (which uses PlugX and Cobalt Strike for data exfiltration) but is assessed as a separate cluster. The attacker leveraged BadPotato/EfsPotato-style NTFS privilege-escalation primitives for post-compromise elevation. Detection: monitor `w3wp.exe` for anomalously long hex-segmented DNS queries, reflective .NET assembly loading events in EDR telemetry, `.aspx`/`.ashx` file creation in web application directories, and encrypted HTTP response bodies from `.ashx` endpoints in WAF logs. Harden: migrate or isolate .NET 4.0 servers, disable `.aspx`/`.ashx` script-execution in IIS handler mappings on upload directories, monitor ASP.NET temporary compilation directories for new DLL creation outside scheduled deployments.
    ch_eu_nexus: "Relevant: many Swiss and EU public-sector IT environments still run legacy IIS/ASP.NET applications on .NET 4.0; legacy government portals and intranet applications are a typical footprint; China-linked espionage priorities explicitly include European government and regulatory targets"
    public_sector_nexus: "direct — legacy government web applications on IIS are in scope"
    sector: "public-sector, government, enterprise"
    cves: []
    actors_campaigns_malware: ["OP-512", "CL-STA-0048", "GhostRedirector", "DragonRank"]
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "OP-512 was highly likely conducting espionage through a compromised Internet Information Services (IIS) web server on an organization whose sector and geography align with China-linked intelligence priorities."
        attribution: "ReliaQuest Threat Research"
        source_url: "https://reliaquest.com/blog/threat-spotlight-reliaquests-agentic-ai-uncovers-new-china-linked-cluster-op-512"
      - quote: "Each deployment is cryptographically unique using RSA signatures and RC4 encryption... Timestomping functionality to match file modification dates to surrounding artifacts... Reflective .NET assembly loading to bypass static detection"
        attribution: "ReliaQuest Threat Research"
        source_url: "https://reliaquest.com/blog/threat-spotlight-reliaquests-agentic-ai-uncovers-new-china-linked-cluster-op-512"
    extended_notes: |
      OP-512 is at least the fourth China-linked cluster documented as targeting legacy IIS servers in the past year (alongside CL-STA-0048, GhostRedirector, and DragonRank). The convergence on IIS/ASP.NET as an espionage surface reflects a deliberate intelligence community preference for the legacy-application estate. The self-reporting DNS mechanism is an operational OPSEC innovation: the actor never has to actively scan for live shells, reducing noise. Discovery tip for threat hunters: search DNS resolver logs for `w3wp.exe`-originated queries where the subdomain label is a continuous hex string exceeding 40 characters.

  - title: "ESET: BTMOB Android RAT-as-a-service pairs remote access with ready-made phishing campaign infrastructure, targets Latin America"
    sources:
      - url: "https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
        publisher: "ESET WeLiveSecurity"
        date: "2026-05-26"
        role: "primary"
      - url: "https://cyble.com/blog/btmob-rat-newly-discovered-android-malware/"
        publisher: "Cyble"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: welivesecurity.com feed URL https://www.welivesecurity.com/en/feed/ → item 'BTMOB: A stealthy RAT burrowing deep into Android devices' (published 2026-05-26) → primary: ESET WeLiveSecurity article fetched via bridge URL https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
    summary: |
      ESET published on May 26, 2026 a technical analysis of BTMOB (detected as MSIL/BtmobRat; Android variants as Android/Spy.Agent.EED/EIJ/EIK), a remote-access trojan that bundles full device compromise capabilities with integrated phishing-campaign tooling — effectively a mobile MaaS (Malware-as-a-Service) offering. BTMOB evolves from the SpySolr malware family and is primarily distributed through social-engineering campaigns directing victims to phishing sites impersonating streaming platforms and cryptocurrency mining services, which serve malicious APKs from fake Google Play store lookalikes. The malware's central privilege-escalation mechanism is abuse of Android Accessibility Services to gain elevated permissions without additional user interaction — a well-established technique (T1626, Abuse Elevation Control Mechanism; equivalent Android path for `Accessibility Service` exploitation). Capabilities include full data exfiltration across multiple sensitive categories, screenshot capture, activity recording, and full remote device takeover. The MaaS component lowers the operational barrier for campaign operators — buyers receive pre-packaged phishing infrastructure alongside the RAT. ESET detected approximately 15 samples of v2.5 within two weeks in late January 2025, with campaigns primarily targeting Brazil and Argentina (including impersonation of Argentine tax/customs authorities). ESET detects the primary tool as MSIL/BtmobRat; the Android components carry distinct variant suffixes. Detection: monitor for APKs requesting Accessibility Service permissions from sideloaded sources; corporate MDM policies blocking sideloading and restricting Accessibility Service grants to known-good applications are the primary hardening lever.
    ch_eu_nexus: "Low direct CH/EU nexus — primarily Latin American targeting — but BTMOB MaaS model means campaign operators can pivot to European targets; Accessibility Service abuse technique is universal across Android versions"
    public_sector_nexus: "indirect"
    sector: "financial, cryptocurrency, consumer"
    cves: []
    actors_campaigns_malware: ["BTMOB", "BtmobRat", "SpySolr"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The BTMOB malware pairs remote access capabilities with ready-made campaign tools, lowering the barrier for full device compromise"
        attribution: "ESET WeLiveSecurity"
        source_url: "https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
    extended_notes: |
      Note: BTMOB article published May 26 (edge of the 36-hour window from a June 6 run perspective — within developing_window_hours of 72h). Item included given novelty and no prior coverage. Primary detection families from ESET: MSIL/BtmobRat (Windows component — likely C2 panel or builder), Android/Spy.Agent.EED, .EIJ, .EIK (device-side APK variants). The MaaS model means attribution to a specific operator cluster is not meaningful; the toolset is available to multiple campaign operators.

  - title: "Red Canary: Microsoft Entra Agent ID users can send malicious content to human users via Teams — AI agent identity abuse surface"
    sources:
      - url: "https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-teams/"
        publisher: "Red Canary"
        date: "2026-06-01"
        role: "primary"
    discovery_trace: "first seen at: redcanary.com feed URL https://redcanary.com/feed/ → item 'Investigating suspicious AI workflows in Microsoft Entra Agent ID: Agent's user account' (published 2026-06-01) → primary: Red Canary blog URL https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-teams/"
    summary: |
      Red Canary published on June 1, 2026 a threat-detection research piece examining how Microsoft Entra ID AI agent user accounts — the new identity principal type provisioned for autonomous AI workflows — can be leveraged to send malicious content to human users via Microsoft Teams. The core finding is that an Entra AI agent identity, once compromised or misconfigured, can send messages impersonating an internal AI assistant to human Teams users, potentially delivering malicious links or instructions that bypass human scepticism because the sender appears to be a trusted organisational AI system rather than an external threat actor. This is the second instalment in Red Canary's series on Entra AI workflow detection; the first (May 27) examined autonomous agents escalating Entra privileges. Detection considerations: audit Entra Agent ID provisioning events (Entra audit logs for `Add service principal` / `Add application` operations with AI/agent naming patterns), monitor Teams messaging from non-human accounts (`MessageCreated` events where sender is a service principal), and alert on Teams messages containing URL patterns or PowerShell-encoded commands originating from agent-type identities. This research is directly relevant to any organisation deploying Microsoft Copilot, Azure AI Foundry agents, or custom Entra AI workflow integrations.
    ch_eu_nexus: "Direct: Swiss federal and cantonal administrations are actively deploying Microsoft 365 Copilot and Azure AI Foundry; Entra Agent ID is a new identity class without mature governance frameworks in most EU public-sector environments"
    public_sector_nexus: "direct — public-sector Microsoft 365 deployments with Copilot or AI agent integration"
    sector: "public-sector, enterprise, identity"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Entra ID agent users can send malicious content to human users via Microsoft Teams. Here's what to look out for."
        attribution: "Red Canary"
        source_url: "https://redcanary.com/blog/threat-detection/entra-id-ai-workflows-teams/"

