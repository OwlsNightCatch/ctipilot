        source_url: "https://www.helpnetsecurity.com/2026/05/27/fbi-silent-ransom-group-law-firms-social-engineering/"
    extended_notes: |
      The Risky Biz summary also notes the payment was compressed into three days, atypical for insurance-backed extortion, suggesting urgency around the sensitivity of the client data at risk. The Insurer had the exclusive (paywalled) on 27 May — the Legal Cheek piece is the publicly accessible primary. The SRG fast-flux infrastructure piece from Resecurity (published June 5 on Security Affairs) adds operational intelligence: the group is now using fast-flux DNS for its C2 infrastructure, improving resilience against takedown and increasing difficulty of static-IOC blocking.

  - title: "Five Eyes 'Safeguarding Our Secrets' joint bulletin: China's military intelligence uses LinkedIn and job platforms to recruit government and cleared personnel"
    sources:
      - url: "https://www.mi5.gov.uk/five-eyes-joint-bulletin-safeguarding-our-secrets"
        publisher: "MI5 / Five Eyes"
        date: "2026-06-03"
        role: "primary"
      - url: "https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/"
        publisher: "Risky Biz News"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/ → primary: MI5 joint bulletin page, URL https://www.mi5.gov.uk/five-eyes-joint-bulletin-safeguarding-our-secrets (datePublished confirmed Wed, 03/06/2026)"
    summary: |
      On 3 June 2026, ASIO (Australia), CSIS (Canada), FBI (USA), MI5 (UK), and NZSIS (New Zealand) jointly published "Safeguarding Our Secrets," an unprecedented Five Eyes joint bulletin warning that China's military intelligence services (assessed to be PLA-linked) are systematically using LinkedIn, Indeed, Upwork, and similar professional networking platforms to recruit assets with access to classified or privileged information.

      The recruitment methodology follows a consistent pattern: intelligence officers or their affiliates post job advertisements as employees of fabricated private consultancies, think tanks, or HR firms; the advertisements target foreign-policy, defence, and trade-policy analysts. After identifying promising candidates through CV screening, the operatives conduct virtual interviews and commission reports on topics such as China's bilateral relations, defence procurement, or trade policy, paying $100–$3,000 per deliverable through PayPal, Payoneer, Western Union, or cryptocurrency. As the relationship deepens, requests shift toward classified or operationally sensitive information, and conversations migrate to encrypted messaging platforms.

      Target categories explicitly named: security-clearance holders, military personnel (particularly those stationed in the Indo-Pacific), think-tank employees, academics, and journalists. The bulletin notes payments are occasionally made in cryptocurrency, making forensic attribution of the financial flow harder.

      For Swiss and European public-sector defenders: Switzerland is not a Five Eyes member but is a direct target of Chinese state intelligence given its role in international organizations, financial regulation, and technology research. Detection: review LinkedIn connection requests and job solicitations received by cleared staff or public-sector researchers for patterns — fabricated employer identity, vague consulting-firm backstory, requests to draft policy papers. Personnel-security controls: brief staff on the callback-style progression from innocuous task to sensitive-information request; institute a reporting procedure for unsolicited foreign-intelligence contact. This advisory covers the same tradecraft documented in NCSC-CH's recurring Technologiespionage warnings.
    ch_eu_nexus: "direct — Switzerland and EU member states are known Chinese intelligence targets; the bulletin references government and military personnel broadly, not US-only"
    public_sector_nexus: "direct — government employees, cleared contractors, and public-sector researchers explicitly named as targets"
    sector: "government, defence, research, think tanks, finance"
    cves: []
    actors_campaigns_malware: ["PLA military intelligence", "China-nexus espionage"]
