      Full bulletin PDF downloadable from MI5 at https://www.mi5.gov.uk/sites/default/files/2026-06/SAFEGUARDING%20OUR%20SECRETS_DIGITAL-03.pdf. This is the first joint Five Eyes bulletin specifically about professional-platform recruitment; earlier advisories addressed technical intrusions. The shift to human-intelligence tradecraft reflected in this bulletin is consistent with the Bletchley Declaration follow-up and OECD working-group discussions on economic espionage.

  - title: "UPDATE: Miasma self-replicating supply chain worm re-compromises 73 Microsoft GitHub repos (Azure, Azure-Samples, MicrosoftDocs); GitHub disables access in 105-second sweep"
    sources:
      - url: "https://opensourcemalware.com/blog/miasma-reaches-azure"
        publisher: "OpenSourceMalware"
        date: "2026-06-06"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html"
        publisher: "The Hacker News"
        date: "2026-06-06"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews → article: https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html → primary research: OpenSourceMalware, URL https://opensourcemalware.com/blog/miasma-reaches-azure"
    summary: |
      On 5 June 2026, GitHub disabled 73 Microsoft repositories across four organizations — Azure, Azure-Samples, Microsoft, and MicrosoftDocs — in an automated 105-second enforcement sweep triggered by GitHub's terms-of-service abuse detection. The disabling affects the entire Azure Functions ecosystem, the Durable Task family (.NET, Go, Java, JS, MSSQL, Netherite, protobuf), and a set of AI sample applications.

      OpenSourceMalware researcher Paul McCarty confirmed the vector: the `durabletask` npm package — first compromised by TeamPCP in May 2026 to deliver an information stealer on Linux — was re-compromised in an updated Miasma variant. The worm's payload runner (4.3 MB) auto-executes through five developer tools: Claude Code, Gemini CLI, Cursor, VS Code, and the npm test script. This variant adds Azure CLI auth-cache and managed-identity token collection (prior Shai-Hulud strains targeted AWS and GitHub credentials), suggesting deliberate expansion to cloud-provider credential coverage. The worm's self-propagation mechanism creates public GitHub repositories and commits harvested secrets as JSON — it is this public-repo creation that triggers GitHub's automated suspension.

      This is an UPDATE on the Miasma coverage from 2026-06-02. The material new development is: (1) Microsoft's own GitHub organizations are now affected, confirming the worm is no longer scoped to third-party open-source maintainers; (2) the same credential foothold from the May TeamPCP compromise of `durabletask` was apparently not fully revoked; (3) Azure managed-identity tokens are now a harvest target, which means affected developers may have exposed cloud infrastructure beyond their own machines.

      Detection: monitor for npm postinstall scripts spawning `claude`, `gemini`, `cursor` or `code` processes (Sysmon EID 1 with parent-image filter on `node.exe`); watch for unexpected public repository creation events in GitHub audit logs; alert on Azure CLI token cache access by processes other than `az.cmd`; EDR telemetry for `rclone` or unexpected JSON-write patterns in `~/.config/gh/` or `~/.azure/`. Hardening: scope GitHub Actions and developer-tool permissions to least-privilege; rotate Azure managed-identity credentials for any machine that ran npm postinstall from a suspect package.
    ch_eu_nexus: "global supply-chain vector; any CH/EU software team using Azure Functions, Durable Task, or the affected AI sample repos is a downstream victim"
    public_sector_nexus: "indirect — any public-sector development team using affected npm packages could be impacted"
    sector: "technology, software supply chain, cloud"
    cves: []
    actors_campaigns_malware: ["Miasma", "TeamPCP", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-02"
    evidence:
      - quote: "GitHub disabled 73 Microsoft repositories across four of its GitHub organizations — the entire Azure Functions org, the whole Durable Task family, and a row of AI sample apps — in a 105-second sweep on June 5. The recompromised durabletask package sits at the center, and the fingerprints point at the open-sourced Miasma worm."
        attribution: "OpenSourceMalware"
        source_url: "https://opensourcemalware.com/blog/miasma-reaches-azure"
      - quote: "When the repo at the root of last month's compromise is the hub of this month's takedown, that is not a coincidence - that is the same wound reopening. Whoever held those credentials in May plausibly never fully lost them."
        attribution: "Paul McCarty / OpenSourceMalware"
        source_url: "https://opensourcemalware.com/blog/miasma-reaches-azure"
    extended_notes: |
      The prior Miasma coverage (2026-06-02) covered the initial TeamPCP OIDC abuse against the @redhat-cloud-services npm namespace. Today's development shows the worm expanding to a second major namespace (Microsoft Azure) via the same initially-compromised credential foothold. The pattern of GitHub's automated 105-second enforcement sweep is worth noting for defenders: GitHub's secret-scanning and ToS-enforcement automation caught and disabled repositories quickly, but the window between worm propagation and detection was still sufficient for credential harvest.

  - title: "Hola Browser supply chain compromise: update pipeline poisoned with unsigned Monero XMRig miner (me.exe / HolaMonitorService.exe)"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/hola-browser-for-windows-compromised-to-deliver-cryptominer/"
        publisher: "BleepingComputer"
        date: "2026-06-04"
        role: "primary"
      - url: "https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/"
        publisher: "Risky Biz News"
        date: "2026-06-05"
        role: "corroborating"
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/ → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hola-browser-for-windows-compromised-to-deliver-cryptominer/"
    summary: |
      Sophos researchers discovered a supply chain compromise of the Hola Browser for Windows (version 1.251.91.0): the browser's software-update delivery pipeline was poisoned to bundle an unsigned executable named `me.exe`, confirmed to be an XMRig-based Monero cryptocurrency miner. Sophos detected the anomaly during a scheduled third-party certification procedure.

      The malware exhibits behaviour consistent with a persistent cryptominer: `me.exe` is installed as `HolaMonitorService.exe`, creates a Windows auto-start service, adds itself to Windows Defender exclusion lists to evade detection, and mines when the host is idle. The file is not digitally signed and contains obfuscated code with internal XMRig references.

      Hola confirmed the compromise, stating approximately 0.1% of its user base was impacted and that no user data was accessed or stolen. The company stated it has rebuilt its distribution pipeline and implemented enhanced security measures.

      Hola Browser is a privacy/VPN browser used by several million users globally. While the impact fraction reported is small (0.1%), the pattern is operationally significant: the delivery pipeline — not the application code — was the attack surface, which means code-signing verification of update bundles is the primary control gap. Defenders who manage endpoint software inventories should check for `HolaMonitorService.exe` in their estate and review Windows Defender exclusion lists for paths added by non-IT processes (Windows Event ID 5007 — Windows Defender configuration change).
    ch_eu_nexus: "global; browser software supply-chain attack pattern directly applicable to EU public-sector endpoint management"
    public_sector_nexus: "indirect"
