        attribution: "Risky Biz News"
        source_url: "https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/"
      - quote: "Weil Gotshal reportedly pays up to $20 million after hackers steal client data"
        attribution: "Legal Cheek"
        source_url: "https://www.legalcheek.com/2026/06/weil-reportedly-pays-up-to-20-million-after-hackers-steal-client-data/"
      - quote: "Recent SRG campaigns left few artifacts on compromised machines. Traditional antivirus products are also unlikely to flag the intrusion because SRG generally uses legitimate system management or remote access tools to carry out the attack"
