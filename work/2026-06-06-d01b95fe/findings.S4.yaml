        publisher: "Help Net Security"
        date: "2026-05-27"
        role: "background — FBI CSA details"
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-the-eu-debuts-digital-sovereignty-plan/ → primary: Legal Cheek, URL https://www.legalcheek.com/2026/06/weil-reportedly-pays-up-to-20-million-after-hackers-steal-client-data/ → corroborating: Security Affairs on SRG Fast Flux, URL https://securityaffairs.com/193215/cyber-crime/silent-ransom-group-srg-switching-to-dns-fast-flux-infrastructure.html; FBI CSA background: https://www.ic3.gov/CSA/2026/260526.pdf"
    summary: |
      Weil Gotshal & Manges, a major US law firm with >$2B annual revenue, paid an estimated $18–20 M in a data-suppression payment to the Silent Ransom Group (SRG, also tracked as Luna Moth, Chatty Spider, UNC3753) after the group exfiltrated client data from an external cloud-storage site. The payment was reportedly made within three days of the demand — an atypically compressed timeline for an insurance-backed extortion of this scale.

      SRG is a data-theft-and-extortion specialist that does not encrypt files. Its intrusion chain relies entirely on social engineering: callback phishing emails and phone calls in which actors pose as the victim firm's IT department, directing employees to open a remote desktop session (or, in a newer documented tactic, sending operatives in person to victim offices). Once inside, data is exfiltrated using WinSCP or a hidden/renamed Rclone binary. Because no encryption is involved and only legitimate remote-access tooling is used, traditional EDR detections for ransomware do not fire and the FBI's May 2026 CSA notes the group "generally leaves few artifacts."

      As of the FBI's 26 May 2026 alert, SRG had leaked data from more than 38 US law firms and Halcyon tracked >100 total incidents against the legal sector in 2025–early 2026. On 5 June, Resecurity published a profile of SRG's newly deployed DNS fast-flux infrastructure, indicating the group is hardening its operational resilience ahead of continued campaigns.

      For European legal and professional-services defenders: the FBI alert confirms SRG targets insurance, finance, and healthcare in addition to law, and its social-engineering approach maps directly to the same IT-helpdesk impersonation vectors seen in European corporate intrusions. Detection surface: anomalous Rclone or WinSCP execution from user-context processes (Sysmon EID 1, parent: `explorer.exe` or a Office app); large outbound file-transfer sessions to cloud-storage endpoints; help-desk ticket anomalies where callback-originated sessions grant broad drive-share access without a corresponding ticket. Hardening: restrict Rclone and WinSCP to known administrative hosts via application-control policy; require out-of-band MFA confirmation for any help-desk session that elevates access; verify in-person IT-support credential against an internal directory before granting physical computer access.
    ch_eu_nexus: "global actor; EU legal and professional-services firms are plausible targets given SRG's demonstrated expansion beyond US"
    public_sector_nexus: "indirect — group targets legal firms that may hold government contracts"
    sector: "legal, professional services, insurance, finance"
    cves: []
    actors_campaigns_malware: ["Silent Ransom Group", "Luna Moth", "UNC3753", "Chatty Spider"]
    verification: MULTI-SOURCE
