        source_url: "https://www.abbott.com/en-us/corpnewsroom/diagnostics-testing/abbott-statement-on-cyber-incident-in-cancer-diagnostics-business"
      - quote: "There is no impact to any other Abbott businesses, sites or systems."
        attribution: "Abbott Laboratories (own statement)"
        source_url: "https://www.abbott.com/en-us/corpnewsroom/diagnostics-testing/abbott-statement-on-cyber-incident-in-cancer-diagnostics-business"
