  - title: "Ernst & Young disclose a data breach of a third-party IT support-ticket platform exposing client tax and financial documents"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/", publisher: "BleepingComputer", date: "2026-07-17", role: "primary" }
      - { url: "https://cyberinsider.com/ey-says-client-tax-data-exposed-in-third-party-it-software-breach/", publisher: "CyberInsider", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer security listing, URL https://www.bleepingcomputer.com/news/security/ → article https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/ → corroborating: CyberInsider (source-list record cyberinsider), URL https://cyberinsider.com/ey-says-client-tax-data-exposed-in-third-party-it-software-breach/ → attempted primary pivot: California AG notice-letter archive at https://oag.ca.gov/system/files/EY%20Notice%20Letter%20US%20General.pdf (PDF text not cleanly extractable — noted as attempted, unconfirmed content)"
    summary: |
      Ernst & Young (EY), one of the Big Four global professional-services firms, is notifying clients of a data breach after an unauthorized third party accessed a support-ticket platform used by EY's IT staff between 28 March and 12 April 2026, downloading multiple documents. EY discovered the anomalous activity on 23 April 2026 and, per its notification letters (dated 13 July 2026, filed with the California AG), states support tickets submitted through the platform routinely carried attachments containing sensitive client tax documentation and personal financial information used to prepare tax filings. EY has not disclosed the identity or software of the compromised third-party vendor, the attack's initial-access vector, the number of affected individuals, or whether the incident is limited to EY's US client base or extends to its wider international/European practice (EY provides audit, tax and advisory services to public-sector and private clients across the EU and Switzerland, though no EU/CH client impact has been confirmed either way). EY reports no evidence of data misuse to date, has engaged external cybersecurity specialists, notified federal law enforcement, and is offering affected individuals 24 months of Experian IdentityWorks identity-monitoring, with an enrollment deadline of 31 October 2026. No ransomware or extortion group has claimed responsibility. The transferable lesson: IT support/ITSM ticketing platforms that accept file attachments become a shadow repository for exactly the sensitive documents (tax records, contracts, financial statements) an organization would otherwise tightly control — a third-party trust-relationship exposure (MITRE ATT&CK T1199) distinct from, and easy to overlook relative to, the primary application/data estate.
    region_nexus: "global; EY's client base spans Europe/Switzerland, but EY has not disclosed whether the breach's geographic scope extends beyond its US practice"
    primary_sector_nexus: "indirect — EY functions as a professional-services/audit supplier to public-sector and financial-sector clients; no confirmed CH/EU client data in this incident"
