  - title: "Coca-Cola's Fairlife dairy subsidiary halts all US production after a ransomware event reaches production-related systems"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/21344/000162828026048466/ko-20260716.htm", publisher: "The Coca-Cola Company (SEC Form 8-K, Item 8.01)", date: "2026-07-16", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/coca-cola-says-fairlife-ransomware-attack-halts-us-dairy-production/", publisher: "BleepingComputer", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer security listing, URL https://www.bleepingcomputer.com/news/security/ → article https://www.bleepingcomputer.com/news/security/coca-cola-says-fairlife-ransomware-attack-halts-us-dairy-production/ → primary regulatory filing: SEC EDGAR 8-K, URL https://www.sec.gov/Archives/edgar/data/21344/000162828026048466/ko-20260716.htm"
    summary: |
      The Coca-Cola Company filed a Form 8-K (Item 8.01, Other Events — not Item 1.05, meaning Coca-Cola has not yet determined the incident to be material) disclosing that fairlife, LLC, its dairy subsidiary, identified unauthorized third-party access to a portion of its systems, "including its production-related systems," in connection with a ransomware event. As a direct result, fairlife's US production operations were temporarily suspended in their entirety; Canadian fairlife production is unaffected. Coca-Cola states product quality and safety were not impacted, that it activated incident-response and business-continuity protocols, engaged outside cybersecurity advisors, and notified law enforcement. No ransomware group has claimed responsibility as of filing, and Coca-Cola has not disclosed whether data was exfiltrated or an extortion demand was received; "the full scope, nature and impacts of the incident are not yet known." No initial-access vector or affected OT/ICS system detail has been disclosed. The significance here is scale and brand, not novel tradecraft: a major multinational's IT-to-production convergence let a ransomware event halt nationwide manufacturing output at a signature dairy brand, echoing the JBS/Colonial-Pipeline pattern where ransomware's blast radius extends past the IT estate into physical production — the transferable lesson for any CH/EU manufacturing, utility or logistics operator is that "production-related systems" access alone, without confirmed encryption or OT compromise, is often enough to force a precautionary full production halt.
    region_nexus: "US-domestic production impact; Coca-Cola and Fairlife operate as part of a globally significant multinational brand"
    primary_sector_nexus: "out-of-nexus — no CH/EU or profiled-sector (public-sector/energy/water/transport/healthcare/finance/telco) nexus; included under criterion (a): genuinely global significance/scale (nationwide production halt at a major global consumer brand) and the transferable IT/OT-convergence lesson for any manufacturing-adjacent CH/EU critical-infrastructure operator"
