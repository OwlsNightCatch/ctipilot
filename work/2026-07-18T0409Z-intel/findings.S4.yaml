  - title: "ShinyHunters claims Abbott/Exact Sciences Cancer Diagnostics breach via vished Microsoft Entra SSO account — 30M+ customer records claimed"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/", publisher: "BleepingComputer", date: "2026-07-17", role: "primary" }
      - { url: "https://www.abbott.com/en-us/corpnewsroom/diagnostics-testing/abbott-statement-on-cyber-incident-in-cancer-diagnostics-business", publisher: "Abbott Laboratories (victim statement)", date: "2026-07-16", role: "primary" }
      - { url: "https://www.medtechdive.com/news/abbott-discloses-cyberattack-on-cancer-diagnostics-business/825529/", publisher: "MedTech Dive", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer security listing, URL https://www.bleepingcomputer.com/news/security/ → article https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/ → primary: Abbott Newsroom victim statement, URL https://www.abbott.com/en-us/corpnewsroom/diagnostics-testing/abbott-statement-on-cyber-incident-in-cancer-diagnostics-business → corroborating pivot: MedTech Dive, URL https://www.medtechdive.com/news/abbott-discloses-cyberattack-on-cancer-diagnostics-business/825529/ → WebSearch (\"Abbott Exact Sciences ShinyHunters vishing Entra breach\") for scope/attribution detail"
    summary: |
      Abbott Laboratories is investigating two separate cyber incidents, the more severe of which the ShinyHunters extortion group claims began with a vishing (voice-phishing) call to a help-desk operator that compromised a Microsoft Entra ID (Azure AD) single-sign-on account belonging to Abbott's newly acquired Exact Sciences Cancer Diagnostics business (Exact Sciences was folded into Abbott via a $21B acquisition earlier in 2026). ShinyHunters claims the compromised SSO account was then used to pull data from Microsoft Entra, ServiceNow, SharePoint, Databricks and Coupa — more than 30 million rows of customer PII, 22M+ doctor-patient notes, 20M+ medical orders, and 1M+ Social Security numbers, per the actor's own leak-site posting (unverified by Abbott). Abbott's own statement confirms unauthorized access "to a limited number of internal systems in our Cancer Diagnostics business only," states legacy Exact Sciences systems remain logically separate from Abbott's core infrastructure, and reports no impact to other Abbott businesses, products, manufacturing or lab operations. Abbott has not named ShinyHunters, confirmed the claimed record counts, or disclosed whether patient/customer data was in fact exfiltrated; investigation is ongoing with external cybersecurity firms and law enforcement involved. A second, separate claim from an actor calling itself "ShadowByt3$" alleges credential-based compromise of the externally facing LabCentral customer portal (Core Laboratory diagnostics business), stealing only publicly available technical reference documentation per Abbott. ShinyHunters set an initial leak deadline of July 18, later extended to July 21. This is the same vishing-to-cloud-SSO tradecraft ShinyHunters/Scattered-Spider-adjacent actors used against Okta-integrated enterprise environments earlier in 2026, now aimed at a large multinational healthcare/diagnostics company's SaaS estate.
    region_nexus: "global (Abbott is US-headquartered but operates diagnostics manufacturing, sales and lab services across Europe, including EU/Swiss markets); no CH/EU-specific victim data confirmed"
    primary_sector_nexus: "indirect — healthcare is a configured additional sector; actor (ShinyHunters/UNC6240) is already tracked for the Oracle PeopleSoft campaign touching European organizations"
    sector: "healthcare"
    cves: []
    techniques: [T1566.004, T1078.004, T1530]
