        source_url: "https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/"
    extended_notes: |
      Not yet independently verified: the exact record counts (30M+ PII rows, 22M+ notes, 20M+ orders, 1M+ SSNs) are the extortion actor's own claim, not confirmed by Abbott — treat as a claim pending Abbott's investigation. Triage discriminator: legitimate helpdesk-assisted MFA/device re-enrollment vs. vished takeover — look for a mismatch between the caller's claimed identity/location and normal authentication patterns, an MFA-method change or device re-registration immediately preceding high-volume SaaS data-export activity, and Entra sign-in log anomalies (unfamiliar device, unusual ISP/ASN, impossible-travel) on the affected account in the hours before the ServiceNow/SharePoint/Databricks/Coupa export activity the actor claims.
