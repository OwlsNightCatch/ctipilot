      Note on source hygiene: an earlier, unrelated "EY exposes Bank of America credit card numbers" story surfaced during research (cybernews.com) — verified via full-text fetch to be dated 2023-08-10 and tied to the 2023 Cl0p/MOVEit campaign, NOT this 2026 incident. Excluded to avoid conflating two distinct EY breaches years apart. Detection/hardening takeaway for defenders operating or auditing similar third-party ITSM/helpdesk platforms: restrict or DLP-scan file attachments on support-ticket systems for tax-ID/financial-document patterns, enforce short attachment retention windows, and treat the ticketing vendor as a first-class asset in the third-party risk register rather than "just a helpdesk tool."
