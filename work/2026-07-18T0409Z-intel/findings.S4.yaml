  - title: "TheGentlemen ransomware claims Portugal's Metro Mondego (Coimbra light-rail operator) — victim confirms ransomware, notifies national CSIRT and data-protection authority"
    sources:
      - { url: "https://www.campeaoprovincias.pt/2026/07/17/metro-mondego-foi-alvo-de-ataque-informatico-que-afectou-sistemas-internos/", publisher: "Campeão das Províncias (relaying Metro Mondego's own statement)", date: "2026-07-17", role: "primary" }
      - { url: "https://tugatech.com.pt/t87569-metro-mondego-e-alvo-de-alegado-ataque-informatico-com-roubo-de-dados", publisher: "TugaTech", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Metro Mondego cibersegurança ransomware ataque\") → pivot: TugaTech, URL https://tugatech.com.pt/t87569-metro-mondego-e-alvo-de-alegado-ataque-informatico-com-roubo-de-dados (names TheGentlemen as the claiming actor) → primary: Campeão das Províncias, URL https://www.campeaoprovincias.pt/2026/07/17/metro-mondego-foi-alvo-de-ataque-informatico-que-afectou-sistemas-internos/ (quotes Metro Mondego's own public statement in full)"
    summary: |
      Metro Mondego, the public operator of the Metrobus light-rail service between Lousã and Coimbra (Portugal), publicly confirmed on 17 July 2026 that it was hit by a ransomware attack on 6 July 2026 affecting "part of its internal systems," without compromising transport-service operation. The ransomware-and-data-theft claim was made by the RaaS group TheGentlemen (Microsoft: Storm-2697; this pipeline's prior coverage profiles it at ~580 claimed victims across 77 countries as of early July), which posted on its leak site that it had extracted confidential documentation and would publish the files within days absent payment. Metro Mondego's own statement confirms it activated incident-response procedures with external cybersecurity experts and notified Portugal's National Cybersecurity Center (CNCS), the National Data Protection Commission (CNPD), and criminal-investigation authorities. The investigation is ongoing into whether the attackers copied data from the affected internal systems; Metro Mondego states it cannot yet determine whether personal data of passengers, employees or suppliers was included, but confirms passenger payment data was unaffected. The transferable lesson for CH/EU public-transport operators: ransomware groups are actively working through European public-transit operators' back-office/internal systems (distinct from OT/train-control), and the correct incident playbook — precautionary containment, national CSIRT + DPA notification, staged public disclosure as investigation progresses — is exactly what Metro Mondego executed here.
