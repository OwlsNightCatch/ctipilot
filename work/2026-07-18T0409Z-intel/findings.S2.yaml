        source_url: "https://www.heise.de/news/VMware-Avi-Load-Balancer-Kritische-Luecke-erlaubt-Umgehung-von-Anmeldung-11368661.html"
    extended_notes: |
      No confirmed in-the-wild exploitation as of publication — this is a patch-now item, not an active-exploitation alert. Detection concept: Avi Control Plane admin/API access logs for authentication events with anomalous session-establishment patterns (no prior successful login, direct API calls to control-plane endpoints); given "no workaround," network-layer compensating control (restrict Avi Controller management-plane reachability to trusted management VLANs/jump hosts) is the interim hardening lever until upgrade. No CH/EU national CERT advisory found yet at time of research (checked NCSC-CH Security Hub, BSI WID, NCSC-NL, CERT-FR — none had picked this up as of the run); flagging for cross-check in a later run.
  - title: "NCSC-NL: unauthenticated VNC exposure in Fortinet FortiSandbox scanning VMs discloses malware-analysis activity (CVE-2026-59835)"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0245", publisher: "NCSC-NL (NCSC-2026-0245)", date: "2026-07-17", role: "primary" }
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-145", publisher: "Fortinet PSIRT (FG-IR-26-145)", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories → primary: NCSC-NL advisory detail, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0245 → primary: Fortinet PSIRT FG-IR-26-145, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-145"
    summary: |
      NCSC-NL published NCSC-2026-0245 (17 July 2026) covering CVE-2026-59835, a CWE-668 (Exposure of Resource to Wrong Sphere) flaw in the VNC server component used inside FortiSandbox's scanning virtual machines — the VMs that detonate submitted files for behavioural malware analysis. An unauthenticated attacker with network access can connect directly to the VNC server of these scanning VMs, exposing whatever sensitive scan activity (submitted samples, analysis artefacts) is running inside them to unauthorised viewers; Fortinet rates it CVSS 3.1 7.7, NCSC-NL 8.6 (AV:N/AC:L/PR:N/UI:N — no authentication or user interaction required). Affected: FortiSandbox 5.0.0-5.0.2 and 4.4.3-4.4.8 on FSA-500G and FSA-1500G hardware appliances. Fixed in 5.0.3+ and 4.4.9+. Fortinet's own advisory (FG-IR-26-145, dated 14 July) reports no known public exploits. FortiSandbox is a security-operations appliance (malware sandboxing/detonation), so exposure here directly threatens the confidentiality of an organisation's own threat-analysis workflow rather than a general IT asset — relevant to any CH/EU SOC or CERT running on-prem FortiSandbox for sample triage.
    region_nexus: "Netherlands (NCSC-NL advisory); transferable to any EU/CH FortiSandbox operator"
