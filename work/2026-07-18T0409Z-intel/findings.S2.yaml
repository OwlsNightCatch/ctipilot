  - title: "VMware Avi Load Balancer: seven vulnerabilities including a critical unauthenticated auth-bypass on the Avi Control Plane (CVE-2026-47865, CVSS 9.8)"
    sources:
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926", publisher: "Broadcom/VMware PSIRT (VMSA-2026-0005)", date: "2026-07-14", role: "primary" }
      - { url: "https://www.heise.de/news/VMware-Avi-Load-Balancer-Kritische-Luecke-erlaubt-Umgehung-von-Anmeldung-11368661.html", publisher: "heise Security", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/news/VMware-Avi-Load-Balancer-Kritische-Luecke-erlaubt-Umgehung-von-Anmeldung-11368661.html → primary: Broadcom/VMware PSIRT VMSA-2026-0005, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926"
    summary: |
      Broadcom's VMSA-2026-0005 (14 July 2026, updated 15 July) discloses seven vulnerabilities in VMware Avi Load Balancer (formerly NSX Advanced Load Balancer), a control-plane/load-balancing product widely deployed in enterprise and government data centres including Swiss/EU public-sector estates. The headline flaw, CVE-2026-47865 (CVSS 3.1 9.8), is an authentication bypass in the Avi Control Plane: a network-reachable, unauthenticated attacker can access the control plane by bypassing the authentication mechanism entirely — no credentials, no user interaction. Six companion flaws require some level of prior access: CVE-2026-47866 (CVSS 8.3, authorization bypass, low-priv authenticated), CVE-2026-47867 and CVE-2026-47869 (CVSS 8.7 each, remote code execution requiring high-privilege authentication), CVE-2026-47868 (CVSS 7.8, local privilege escalation to root), CVE-2026-47870 (CVSS 7.1, privilege escalation) and CVE-2026-47871 (CVSS 8.8, directory traversal via flawed file-path validation, low-priv authenticated). Affected versions span 22.1.1-22.1.7, 30.1.1-30.2.6, 31.1.1-31.2.2 and (for six of the seven CVEs) 32.1.1; fixed in 32.1.2, 31.2.2-2p3 and 30.2.7 (22.1.x must upgrade to 30.2.7+). Broadcom states no workarounds exist and no public exploitation has been observed at publication. The auth-bypass reporter is credited as Filip Waeytens of the NATO NCSC, giving this a direct European/NATO-constituency provenance line. Because the Avi Control Plane is the management/orchestration interface for the load-balancing fabric, an unauthenticated bypass there is a direct path to reconfiguring traffic routing and TLS termination for whatever is sitting behind the load balancer.
    region_nexus: "Europe/NATO — vulnerability reported by NATO NCSC; product widely deployed in EU/CH enterprise and government data-centre load-balancing fabric"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, finance, healthcare, telco (cross-sector infrastructure component)"
