        attribution: "NCSC-NL (NCSC-2026-0245)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0245"
      - quote: "Exposure of Resource to Wrong Sphere vulnerability [CWE-668] ... affecting the VNC server of VMs performing scanning"
        attribution: "Fortinet PSIRT (FG-IR-26-145)"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-145"
    extended_notes: |
      Moderate severity, no confirmed exploitation, no public PoC found — a patch-and-confirm-network-isolation item rather than an urgent alert. Hardening lever: FortiSandbox scanning-VM network segment should not be reachable from outside the appliance's own management plane in the first place (defence in depth beyond the vendor patch); this is a good hunt trigger for "why is the sandboxing VLAN reachable from elsewhere" architecture reviews. Distinct from the actively-exploited FortiSandbox OS-command-injection CVEs (CVE-2026-25089/CVE-2026-39808, added to CISA KEV 16 July) which affect a different code path (web-UI "start VNC" action) and are being tracked as an S1 vulnerability item this run — not duplicated here.
