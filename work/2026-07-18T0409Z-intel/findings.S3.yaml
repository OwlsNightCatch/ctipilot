      - quote: "Successful exploitation of this chain would allow an attacker to achieve full privilege escalation and persistent root-level access on these devices."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/siemens-rox-ii-zero-day-vulnerabilities/"
      - quote: "Ruggedcom Rox contains an input validation vulnerability in the Scheduler functionality that could allow an authenticated remote attacker to execute arbitrary commands with root privileges."
        attribution: "Siemens ProductCERT (SSA-081142)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-081142.html"
    extended_notes: |
      Detection concept: no IOC needed — hunt for anomalous `xz` invocations combining -f/-c/-d flags in device shell logs, unexpected feature-key upload activity outside maintenance windows, and unplanned entries in the ROX II task-scheduler configuration file. Hardening: patch to firmware V2.17.1+; network-isolate management interfaces (feature-key upload and scheduler UI) from untrusted segments as an interim control if patching is delayed. Transferable lesson for the audience beyond this specific device family: root-privileged invocation of a generic CLI utility (xz) as part of a device's own validation logic is a recurring OT/embedded-appliance anti-pattern worth hunting for elsewhere.

  - title: "SonicWall SMA 1000 zero-days (CVE-2026-15409/CVE-2026-15410) actively exploited pre-patch — actor UTA0533 tunnels to a localhost Erlang service, then chains to root and deploys a custom Java webshell"
    sources:
      - { url: "https://www.volexity.com/blog/2026/07/17/proxying-to-compromise-sonicwall-secure-mobile-access-0-day-exploitation/", publisher: "Volexity", date: "2026-07-17", role: "primary" }
      - { url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008", publisher: "SonicWall PSIRT (SNWLID-2026-0008)", date: "2026-07-14", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-rapid7-mdr-team-discovers-new-sonicwall-sma1000-zero-days-being-actively-exploited-cve-2026-15409-cve-2026-15410/", publisher: "Rapid7", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: Volexity blog listing, URL https://www.volexity.com/blog/ → primary: Volexity, URL https://www.volexity.com/blog/2026/07/17/proxying-to-compromise-sonicwall-secure-mobile-access-0-day-exploitation/ → vendor advisory: SonicWall PSIRT, URL https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008 → independent corroboration: Rapid7, URL https://www.rapid7.com/blog/post/etr-rapid7-mdr-team-discovers-new-sonicwall-sma1000-zero-days-being-actively-exploited-cve-2026-15409-cve-2026-15410/"
    summary: |
      Volexity and Rapid7 independently discovered active, pre-patch exploitation of two SonicWall SMA 1000-series (models 6210, 7210, 8200v) VPN-gateway zero-days, and SonicWall's own advisory (SNWLID-2026-0008, first published 2026-07-14) confirms in-the-wild exploitation and credits both firms. CVE-2026-15409 (CVSS 10.0, CWE-918 SSRF) is an unauthenticated flaw in the SMA1000 Work Place interface's `/wsproxy` endpoint: sending a WebSocket-upgrade request with a crafted Host/User-Agent-style parameter and no valid SMA session cookie tunnels the attacker straight to a normally localhost-only Erlang service (port 1050), yielding initial code execution with zero authentication. CVE-2026-15410 (CVSS 7.2, CWE-94 code injection, per the vendor advisory; Rapid7 independently scored it in the same range) requires the foothold from the first flaw: a request to the hotfix-rollback workflow with path-traversal sequences in the rollback-name parameter (e.g. `../../../../var/tmp/privesc`) escapes the intended directory and injects OS commands, escalating to root. Post-exploitation, the actor (Volexity's designation: UTA0533) used a custom Python injection loader (KNUCKLEBALL) to inject a modified open-source HTTP proxy (Suo5) and a bespoke Java webshell (ORANGETAIL, Behinder-like) into the legitimate `workplace` process, established reboot-survivable persistence by adding a call to the loader script inside `/etc/init.d/workplace`, captured unencrypted LDAP credentials off the wire with tcpdump, and pivoted from the compromised appliance directly into internal corporate networks — reaching domain controllers with non-inventory hostnames. No workaround exists; the only remediation is the hotfix (12.4.3-03453 / 12.5.0-02835 or later), and both vendor and researchers recommend full forensic review, re-imaging on any appliance showing the published IOCs, and resetting all passwords and TOTP seeds. SMA 100-series and firewall-hosted SSL-VPN are explicitly not affected.
    region_nexus: "global; SonicWall SMA is widely deployed as remote-access infrastructure across European public-sector and enterprise networks"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, finance, healthcare, telco"
