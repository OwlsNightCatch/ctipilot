      - { key: "tool:ottercookie", type: tool, name: "OTTERCOOKIE", aliases: [], summary: "Multi-stage malware family aligned with the DPRK Contagious Interview campaign; the 2026-07-18 Elastic-documented variant chains browser/crypto-wallet theft, sensitive-file exfiltration, a Socket.IO-based RAT and clipboard exfiltration." }
    relation_suggestions:
