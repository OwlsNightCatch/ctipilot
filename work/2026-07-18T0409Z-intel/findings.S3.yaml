    extended_notes: |
      Detection concept: telemetry-class first — web/app access logs for the VPN gateway's own interface (101 Switching Protocols responses on /wsproxy with no valid session cookie; requests to /__api__/login or /__api__/logout, which SonicWall states do not exist in a legitimate configuration), plus appliance-log review for hotfix-rollback requests carrying path-traversal sequences, and network egress/auth logs for LDAP binds from the appliance's own IP. SonicWall's advisory publishes concrete log-line indicators (extraweb_access.log, ctrl-service.log, /var/lib/unit/conf.json route entries) that any SOC ingesting SMA appliance logs can operationalize without needing IOC hashes. Hardening: apply the hotfix immediately (no workaround exists); treat any pre-hotfix internet-exposed SMA 1000 appliance as potentially already compromised and follow the vendor's re-image/credential-reset guidance rather than trusting an in-place patch alone.

  - title: "DPRK's Contagious Interview hides a four-stage OTTERCOOKIE-aligned payload in Base64 fragments inside SVG flag images, delivered through fake coding-interview repositories"
    sources:
      - { url: "https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography", publisher: "Elastic Security Labs", date: "2026-07-18", role: "primary" }
    discovery_trace: "first seen at: Elastic Security Labs blog listing, URL https://www.elastic.co/security-labs → primary: Elastic Security Labs, URL https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography (targeted Elastic's own community Slack; corroborated by the same lab's direct incident visibility, single-source at time of writing)"
    summary: |
      Elastic Security Labs disclosed a new instance (internally tracked REF9403) of the long-running, DPRK-aligned "Contagious Interview" campaign on 2026-07-18, after the operators targeted a fake job posting at Elastic's own community Slack workspace. The lure is a trojanized coding-interview take-home project — a fully functional Next.js e-commerce codebase hosted on GitHub (developer account "GreatStackDev") — that a victim is asked to run as part of the "test." The malicious payload is hidden via steganography: Base64-encoded fragments are embedded inside HTML comments spread across every SVG country-flag image in the project's `/assets/flags/` directory (AE.svg, AF.svg, etc.); a loader script (serverValidation.js) reassembles the fragments alphabetically, Base64-decodes them and runs the result via `eval()`, deliberately evading static/signature scanners that don't parse SVG comment bodies. The chain executes on project startup (`npm run dev` / `npm start`) as a four-stage, OTTERCOOKIE-aligned payload: stage 1 harvests browser-stored credentials and 25+ cryptocurrency-wallet extensions (MetaMask, Phantom, Trust Wallet, etc.) across Windows/macOS/Linux and exfiltrates them to an actor-controlled domain; stage 2 recursively discovers and exfiltrates sensitive files (.env, .pem, .aws, .ssh, shell history, source code); stage 3 opens a persistent Socket.IO-based remote-access channel with interactive shell execution and VM-detection checks; stage 4 (Windows-only) drops further second-stage binaries and adds cross-platform clipboard exfiltration. At time of writing the trojanized repository had zero detections across all major antivirus vendors. Elastic frames this as a reminder that a single compromised developer is a viable initial-access path into downstream supply chains — directly relevant to any public-sector or vendor engineering team that sources contractors or evaluates candidates via take-home coding tests.
    region_nexus: "global; developer-targeting campaigns of this kind have previously reached European targets"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology (any org with in-house or contracted software development)"
    cves: []
    techniques: ["T1204.002", "T1027.003", "T1555.003", "T1552.001", "T1083", "T1071.001", "T1115"]
    affected_products: []
