  - title: "Unit 42 chains three Siemens RUGGEDCOM ROX II zero-days into unauthenticated file read, command injection and persistent root code execution"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/siemens-rox-ii-zero-day-vulnerabilities/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-17", role: "primary" }
      - { url: "https://cert-portal.siemens.com/productcert/html/ssa-081142.html", publisher: "Siemens ProductCERT (SSA-081142)", date: "2026-05-12", role: "corroborating" }
    discovery_trace: "first seen at: Unit 42 blog listing, URL https://unit42.paloaltonetworks.com/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/siemens-rox-ii-zero-day-vulnerabilities/ → vendor advisory corroboration: Siemens ProductCERT, URL https://cert-portal.siemens.com/productcert/html/ssa-081142.html (SSA-081142; companion advisories SSA-973901 and SSA-078743 cited in the Unit 42 write-up but not independently fetched this run)"
    summary: |
      Unit 42 published a three-stage exploit chain against Siemens RUGGEDCOM ROX II operational-technology switches on 2026-07-17. Stage one (CVE-2025-40948, CVSS 6.8) abuses an insecurely configured, root-privileged invocation of the `xz` utility: supplying the `-f`, `-c` and `-d` parameters together lets an attacker read arbitrary files on the device filesystem. Stage two (CVE-2025-40947, CVSS 7.5) is command injection in the feature-key signature-verification path — the `gpgv`-based validation of an uploaded feature-key file does not sanitize the embedded signature parameter before inserting it into a shell command string, giving code execution. Stage three (CVE-2025-40949, CVSS 9.1/CVSS4 8.9, CWE-78) is command injection in the web-management task scheduler: an authenticated attacker can inject control characters into the system configuration file the scheduler reads, achieving persistent, cron-driven root-level code execution that survives reboot. Chained end-to-end, the three flaws take an attacker from unauthenticated file disclosure to full privilege escalation and durable root access on a device class used as a network-security/routing boundary inside industrial networks (rail, utility, oil & gas). Siemens's own advisory (SSA-081142, first published 2026-05-12) independently confirms CVE-2025-40949 as OS command injection in the Scheduler function of the web UI requiring authentication, CVSS 9.1, fixed in firmware V2.17.1 across the whole ROX II family (MX5000/MX5000RE, RX1400/1500/1501/1510/1511/1512/1524/1536, RX5000). No in-the-wild exploitation is reported for any of the three CVEs; this is a researcher-disclosed, vendor-patched chain, not an active campaign — but the target class (an OT security/routing appliance) and the full-chain root persistence make it a priority patch for any energy, rail, water or manufacturing operator running ROX II below V2.17.1.
    region_nexus: "global; Siemens ROX II is deployed in European (including Swiss) rail, utility and industrial-network infrastructure"
    primary_sector_nexus: "indirect"
    sector: "energy, transport, water, manufacturing"
    cves: ["CVE-2025-40948", "CVE-2025-40947", "CVE-2025-40949"]
    techniques: ["T1190", "T1059.004", "T1068", "T1053.003"]
    affected_products: ["Siemens RUGGEDCOM ROX II (MX5000, MX5000RE, RX1400, RX1500, RX1501, RX1510, RX1511, RX1512, RX1524, RX1536, RX5000)"]
    entity_keys: []
