    extended_notes: |
      Single-source at time of writing (Elastic Security Labs only; no second independent lab report found in this run) — flagged MEDIUM confidence per verification policy, not dropped, given Elastic's direct first-hand incident visibility (their own Slack was targeted) and the campaign's well-established multi-year lineage under other labs' tracking (Contagious Interview / DeceptiveDevelopment is independently documented by ESET, Microsoft, NTT Security, and others per Elastic's own References section, though not for this specific SVG-steganography variant). Triage benign-lookalike note: legitimate take-home coding assessments routinely ship real, runnable e-commerce/Next.js starter projects with image assets — the discriminator here is Base64/steganographic content inside SVG comment nodes plus a `serverValidation.js`-style loader invoking eval() on reassembled fragments, not the presence of SVGs or a Next.js scaffold per se. Detection concept: telemetry-class first — process-creation events showing Node.js/npm spawning network connections or credential-store access shortly after project install, outbound Socket.IO/WebSocket connections from a developer workstation to non-corporate domains, and file-integrity/EDR script-content scanning for eval() calls fed by decoded SVG-comment data.

  - title: "n8n Enterprise token-exchange flaw (CVE-2026-59208) lets a valid token from one trusted OIDC issuer impersonate a different issuer's user — surfaced by an AI penetration-testing agent"
    sources:
      - { url: "https://socradar.io/blog/cve-2026-59208-cross-issuer-impersonation-n8n/", publisher: "SOCRadar", date: "2026-07-17", role: "primary" }
      - { url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-mq3m-f8x3-579w", publisher: "n8n (GitHub Security Advisory GHSA-mq3m-f8x3-579w)", date: "2026-07-09", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/n8n-token-exchange-flaw-could-let.html", publisher: "The Hacker News", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: SOCRadar blog listing, URL https://socradar.io/blog/ → primary: SOCRadar, URL https://socradar.io/blog/cve-2026-59208-cross-issuer-impersonation-n8n/ → vendor advisory: n8n GitHub Security Advisory, URL https://github.com/n8n-io/n8n/security/advisories/GHSA-mq3m-f8x3-579w → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/n8n-token-exchange-flaw-could-let.html"
    summary: |
      CVE-2026-59208 (CVSS 4.0: 7.6 High; NVD CVSS 3.1: 6.8) is an improper-authentication flaw (n8n GitHub Security Advisory GHSA-mq3m-f8x3-579w) in n8n's Enterprise-only "token exchange" feature — an RFC 8693 implementation OEM partners use to embed n8n without a second login screen. When an instance trusts more than one external token-exchange issuer, n8n resolved the external identity to a local account using only the JWT `sub` (subject) claim and ignored the `iss` (issuer) claim; because a correctly bound external identity requires the pair (iss, sub), an attacker holding a valid token from trusted issuer A whose `sub` value collides with a victim registered under trusted issuer B can authenticate as that victim without knowing their password. The bug does not bypass JWT signature verification — the token itself is validly signed — it is purely an identity-binding defect after the token is accepted. Exploitation requires token exchange enabled and two or more trusted issuers configured, so the exposed population is narrow (n8n states other deployment modes are unaffected), but any Enterprise n8n instance meeting those preconditions is impersonable end-to-end via legitimate authentication material. Affected: all n8n releases below 2.27.4, and 2.28.0; fixed in 2.27.4 and 2.28.1. No public PoC and no confirmed in-the-wild exploitation as of publication. Notably, the report is credited to a researcher account associated with "Strix," an AI penetration-testing agent — a concrete instance of autonomous offensive tooling finding a real production identity-federation bug, relevant to the same AI-as-force-multiplier theme this week's other research covers.
    region_nexus: "global; n8n is widely self-hosted by European public-sector and enterprise automation teams"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: ["CVE-2026-59208"]
    techniques: ["T1550.001", "T1078.004"]
    affected_products: ["n8n (Enterprise token-exchange feature)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "narrow precondition (Enterprise token-exchange with 2+ trusted issuers), no confirmed exploitation, and possible overlap with S1's vulnerability sweep — carried here for the identity-binding technique class and the AI-pentest-agent discovery angle rather than as an urgent patch alert."
    evidence:
      - quote: "External identities are resolved to local accounts using only the JWT sub claim, ignoring the issuer (iss)."
        attribution: "n8n (GitHub Security Advisory GHSA-mq3m-f8x3-579w)"
        source_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-mq3m-f8x3-579w"
      - quote: "An attacker who can obtain a valid token from one trusted issuer with a sub matching a victim registered under a different issuer can authenticate as that victim."
        attribution: "n8n (GitHub Security Advisory GHSA-mq3m-f8x3-579w)"
        source_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-mq3m-f8x3-579w"
      - quote: "n8n credits the report to the GitHub account bearsyankees, whose profile lists Strix, which makes an AI penetration testing agent."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/n8n-token-exchange-flaw-could-let.html"
    extended_notes: |
      Detection concept: identity/auth telemetry class — audit-log correlation of an authenticated session's asserted `iss` against the issuer configured for the resolved account, and alerting on any Enterprise token-exchange login where the presenting issuer does not match the account's provisioning issuer. Hardening: restrict token exchange to a single trusted issuer where multi-issuer support isn't operationally required, and upgrade to >=2.27.4 / >=2.28.1.

