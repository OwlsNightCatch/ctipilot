        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography"
      - quote: "The trojanized repositories at the time of writing have zero detections and are not flagged by any AV vendors."
        attribution: "Elastic Security Labs"
