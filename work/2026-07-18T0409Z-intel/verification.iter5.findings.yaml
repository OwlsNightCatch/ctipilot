  item: "CVE-2026-47865 — VMware Avi Load Balancer auth bypass"
  entry: "2026-07-18/vmware-avi-load-balancer-cve-2026-47865-auth-bypass"
  url_or_quote: "cves[] CVE-2026-47865 affected: \"22.1.1–22.1.7, 30.1.1–30.2.6, 31.1.1–31.2.2, 32.1.1\""
  summary: >-
    The cves[] record for CVE-2026-47865 lists 32.1.1 as an affected version. Per the Broadcom
    advisory VMSA-2026-0005 Response Matrix (deepread vmware.txt lines 105-138), version 32.1.1 is
    affected only by CVE-2026-47866/-47867/-47868/-47869/-47870/-47871 (severity Important) and is
    NOT listed against CVE-2026-47865 (the 9.8 auth bypass, which appears only on the 31.x/30.x/22.x
    rows). Including 32.1.1 in the 47865 affected range contradicts the owning authority; a consumer
    matching a 32.1.1 Avi Controller against this record gets a false positive on the critical flaw.
    The shared affected string is correct for the other six records. Low severity.
- code: F4
  category: hallucinated-fact
  section: active-threats
  item: "SonicWall SMA 1000 UTA0533 kill chain"
  entry: "2026-07-18/sonicwall-sma1000-uta0533-exploitation-kill-chain"
  url_or_quote: "evidence[] Rapid7 quote: \"The threat actors quickly shifted to lateral movement, pivoting from the compromised appliance directly into the internal corporate network.\""
  summary: >-
    The frontmatter evidence[] Rapid7 quote is not a contiguous verbatim substring of the source.
    The Rapid7 page (fetched this iteration) reads: \"With these harvested resources, the threat
    actors quickly shifted to lateral movement, pivoting from the compromised appliance directly into
    the internal corporate network.\" The evidence record drops the leading clause and capitalizes
    \"the\" -> \"The\", so the quote is not copyable from the page unchanged. The body quote (line 94)
    uses the correct lowercase substring and is fine — only the frontmatter evidence record deviates.
    Low severity (leading-capital normalization); fix by lowercasing to \"the threat actors ...\".
