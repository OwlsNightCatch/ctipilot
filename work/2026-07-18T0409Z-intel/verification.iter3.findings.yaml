  item: "2026-07-18/abbott-exact-sciences-shinyhunters-entra-sso-vishing"
  url_or_quote: "\"A second, separate claim by an actor calling itself 'ShadowByt3$' alleges compromise of an externally facing LabCentral customer portal, from which Abbott says only publicly available reference documentation was taken ([MedTech Dive, 2026-07-17](https://www.medtechdive.com/news/abbott-discloses-cyberattack-on-cancer-diagnostics-business/825529/))\""
  summary: "The inline citation for the ShadowByt3$/LabCentral second-incident claim points to MedTech Dive, but that article (fetched this iteration) does not mention ShadowByt3$, LabCentral, or 'publicly available reference documentation' — it covers only the single Abbott Cancer Diagnostics disclosure. The claim is accurate and IS supported by the entry's other source, BleepingComputer (verbatim: 'attackers breached its LabCentral portal', 'Shadowbyt3$', and 'It houses publicly available technical product reference documents ... and does not contain proprietary/sensitive customer or business information'). Re-cite the sentence to BleepingComputer (already source #2 on the entry); MedTech Dive may remain as a general corroborating source for the base incident."
