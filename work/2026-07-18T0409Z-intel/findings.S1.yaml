    extended_notes: |
      Defender vantage: FortiSandbox management interfaces should never be internet-exposed in the
      first place — Fortinet's own deployment guidance places FortiSandbox on an internal management
      segment reachable only by the FortiGate/FortiMail/FortiWeb fleet that queries it for verdicts.
      Any FortiSandbox reachable from the internet on its web UI or JRPC port is itself the finding,
      independent of patch level. Detection concept: web/application-access logs to the FortiSandbox
      management interface (web UI and JRPC API endpoints) showing anomalous or malformed HTTP request
      bodies/parameters from unauthenticated sessions, followed by unexpected child-process spawns
      from the FortiSandbox web-management daemon (a command-injection telemetry class: process
      creation with a web-service parent that is not part of the normal FortiSandbox helper-process
      tree). Hardening: patch to FortiSandbox 4.4.9 or 5.0.6 (or the fixed Cloud/PaaS builds) now —
      BOD 26-04's 2026-07-19 deadline is a useful forcing function even for non-federal estates given
      the compressed KEV-to-deadline window; restrict management-interface reachability to the
      Fortinet fabric only; treat "no confirmed victim" as an artifact of KEV's evidentiary bar, not
      an indication of low risk, given CISA's inclusion criteria require observed exploitation evidence
      even where the vendor has not corroborated it publicly.

