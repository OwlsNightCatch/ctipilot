    summary: |
      Two unauthenticated OS command-injection flaws in Fortinet FortiSandbox — CVE-2026-25089 and
      CVE-2026-39808 (CWE-78, both CVSS 3.1 9.8 per NVD / vendor-rated 9.1) — were confirmed under
      active exploitation and added to CISA's KEV catalog on 2026-07-16, with a federal remediation
      deadline of 2026-07-19. Both let a remote, unauthenticated attacker execute arbitrary OS
      commands via specially crafted HTTP requests against FortiSandbox's web UI / JRPC management
      interface, with no credentials or user interaction required (AV:N/AC:L/PR:N/UI:N). CVE-2026-39808
      affects FortiSandbox 4.4.0–4.4.8 (fixed in 4.4.9), published by Fortinet in April 2026.
      CVE-2026-25089 has a wider footprint — FortiSandbox 4.2.0–4.2.8 (all versions), 4.4.0–4.4.8,
      5.0.0–5.0.5, FortiSandbox Cloud 5.0.4–5.0.5 and FortiSandbox PaaS 5.0.4–5.0.5 (fixed in 4.4.9 /
      5.0.6 for the maintained branches) — published by Fortinet in June 2026. Security firm Defused
      told The Register it observed exploitation attempts this week against both KEV'd CVEs plus a
      third, still-non-KEV'd FortiSandbox flaw, CVE-2026-39813 — a path-traversal (CWE-22) auth-bypass
      in the JRPC API affecting the same version ranges, fixed in the same 4.4.9/5.0.6 releases —
      though Defused described the public exploit code circulating for CVE-2026-25089 as "vibecoded"
      and likely non-functional, and said it had not yet seen a working public PoC. Fortinet itself has
      not updated its advisories to confirm exploitation and did not respond to press queries.
      Separately, and on the same day, NCSC-NL published an unrelated FortiSandbox advisory
      (NCSC-2026-0245 / CVE-2026-59835, CVSS 8.6) for an unauthenticated network exposure of the VNC
      server used by FortiSandbox's scanning virtual machines (CWE-668, versions 5.0.0–5.0.2 and
      4.4.3–4.4.8) — not confirmed exploited, but it reinforces that the FortiSandbox product line has
      had a rough week of disclosures. FortiSandbox instances are typically deployed as an internal
      threat-verdict/sandboxing tier that other Fortinet security products (FortiGate, FortiMail,
      FortiWeb) query for automated blocking decisions, so a compromised FortiSandbox appliance can
      degrade or poison downstream enforcement across the Fortinet security fabric, not just expose the
      appliance itself.
    region_nexus: "global; FortiSandbox is deployed by public-sector and critical-infrastructure operators across the EU/CH as an on-prem threat-detection tier alongside FortiGate/FortiMail estates"
