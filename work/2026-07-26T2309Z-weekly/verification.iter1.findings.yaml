- code: F3
  category: claim-not-supported
  section: weekly-top-stories
  item: "weekly-w30-exploited-internet-facing-enterprise-persistence — ServiceNow strand"
  url_or_quote: "\"with in-the-wild activity reported from 2026-07-18; ServiceNow's hosted instances were already patched, so the residual exposure is self-hosted and partner-managed deployments ... ([NCSC-CH, 2026-07-20])\""
  summary: "NCSC-CH post 12778 states 'Actively exploited' and lists hosted+self-hosted as affected, but does NOT state the 2026-07-18 activity date nor the 'hosted already patched / self-hosted residual' framing. Those facts are BleepingComputer/Defused's (bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/), which is NOT in this entry's sources[]. Trailing NCSC-CH citation over-claims; the 07-18 date has no supporting citation in the entry. Fix: add the BleepingComputer ServiceNow article as the citation for the date + hosted/self-hosted clause."
- code: F3
  category: claim-not-supported
  section: weekly-top-stories
  item: "weekly-w30-exploited-internet-facing-enterprise-persistence — SharePoint strand + sourcing_note"
  url_or_quote: "\"NCSC-NL reported that a public exploit ... had been published and that on-premise versions were now being actively abused to steal machine keys for long-term access ([NCSC-NL, 2026-07-21])\" ; sourcing_note: \"the machine-key persistence detail is NCSC-NL's and watchTowr's, not the vendor's.\""
  summary: "NCSC-NL advisory NCSC-2026-0237 rev 1.0.2 says only: per watchTowr, public exploit code for CVE-2026-50522 published and on-premise SharePoint now actively abused. It does NOT mention machine-key theft or long-term access — that detail is watchTowr's/BleepingComputer's (co-cited in the next clause). The clause binds the machine-key fact to the NCSC-NL citation, and the sourcing_note wrongly asserts machine-key detail is 'NCSC-NL's'. Fix: rebind machine-key theft to BleepingComputer/watchTowr; correct the sourcing_note."
- code: F4
  category: hallucinated-fact
  section: weekly-research
  item: "weekly-w30-c2-through-trusted-infrastructure — Cisco Talos msaRAT quote"
  url_or_quote: "evidence[] and body: \"msaRAT never touches the network directly — it controls its C2 communication channel exclusively through Chrome DevTools Protocol (CDP), a browser debugging API.\""
  summary: "The Talos page reads 'This RAT never touches the network directly — it controls its C2 communication channel exclusively through Chrome DevTools Protocol (CDP), a browser debugging API.' The entry substituted the subject noun 'This RAT' -> 'msaRAT' inside quotation marks, so the evidence[] quote is not a contiguous verbatim substring. Fix: quote 'This RAT never touches...' verbatim, or move 'msaRAT' outside the quotation marks."
- code: F5
  category: missing-citation
  section: weekly-top-stories
  item: "weekly-w30-exploited-internet-facing-enterprise-persistence (also weekly-w30-vuln-status-rollup) — Check Point CVE-2026-16232 KEV listing"
  url_or_quote: "\"CISA added it to KEV the same day\" (CVE-2026-16232); summary lists it 'KEV-listed'"
  summary: "The only CISA source on the entry is the 2026-07-21 four-KEV alert, which lists DD-WRT/Langflow/WordPress x2 — NOT CVE-2026-16232. The 16232 KEV claim has no inline citation supporting it. The referenced operational entry (2026-07-23/check-point-smartconsole-...) sources it to the 2026-07-22 'two KEV' alert (cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog). Fix: cite that 07-22 alert for the 16232 KEV claim (top-story and vuln-rollup)."
- code: F11
  category: editorial-advisory
  section: weekly-top-stories
  item: "weekly-w30-state-nexus-webmail-espionage — TA458 body phrase"
  url_or_quote: "\"runs a standing supply of 'half-click' webmail zero-days that fire 'the instant a target opens a message'\""
  summary: "'the instant a target opens a message' is in single quotes implying a direct quote, but that phrasing does not appear verbatim on the Proofpoint TA458 page (the page's verbatim line is 'The targeted user must only open the malicious email in their webmail viewer to be compromised.'). Advisory: drop the quote marks (it is an accurate paraphrase) or use the verbatim phrase. Substance is correct."
- code: F11
  category: editorial-advisory
  section: weekly-policy
  item: "weekly-w30-bafin-teamviewer-disclosure-precedent — frontmatter evidence quote"
  url_or_quote: "evidence[]: \"...eine Geldbusse in Höhe von 240.000 Euro ... verstossen.\""
  summary: "Frontmatter evidence[] renders the BaFin quote with Swiss orthography (Geldbusse/verstossen, ss) while the source uses ß (Geldbuße/verstoßen). The body quote is correct (ß). Trivial ß/ss equivalence; optionally normalise the frontmatter quote to match the source exactly for strict verbatim consistency."
