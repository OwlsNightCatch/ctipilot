  summary: "False as of the advisory's current revision. NCSC-NL advisory NCSC-2026-0237 [1.0.2] (2026-07-21, https://advisories.ncsc.nl/2026/ncsc-2026-0237.html), in the same UPDATE paragraph cited by the entry, itself states the machine-key detail verbatim: 'Kwaadwillenden kunnen deze kwetsbaarheid misbruiken om zichzelf voor langere termijn toegang tot netwerken van kwetsbare systemen te verschaffen, door middel van het stelen van machine-keys.' (Attackers can abuse this vulnerability to gain long-term network access by stealing machine-keys.) The sourcing_note's claim that NCSC-NL 'states only' the public-exploit/actively-abused facts and not the machine-key detail is therefore incorrect — it is an inaccurate assertion about what a cited source says. The body's own citation split (NCSC-NL for public-exploit/actively-abused; BleepingComputer/watchTowr for machine-key theft) is not itself wrong — attributing a fact to an additional accurate source is fine — but the sourcing_note's negative claim about NCSC-NL needs correcting (e.g. 'the machine-key detail is stated by both watchTowr/BleepingComputer and, independently, NCSC-NL's own 1.0.2 revision' or simply drop the exclusivity claim)."
