  - title: "ENISA opens public consultation on the EU Managed Security Services (EUMSS) certification scheme -- mandatory for providers under the EU Cybersecurity Reserve within two years of go-live"
    sources:
      - { url: "https://www.enisa.europa.eu/news/have-your-say-on-the-certification-of-eu-managed-security-services", publisher: "ENISA", date: "2026-07-24", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"ENISA press release week July 2026 threat landscape report\") -> ENISA news listing, URL https://www.enisa.europa.eu/news -> primary: ENISA, URL https://www.enisa.europa.eu/news/have-your-say-on-the-certification-of-eu-managed-security-services (no further pivot needed; ENISA is the scheme owner)"
    summary: |
      ENISA launched a public consultation (2026-07-24, open until 2026-09-13) on the draft EU Managed Security Services (EUMSS) certification scheme, developed at the European Commission's request under the EU Cybersecurity Act framework. The scheme uses a layered structure: mandatory baseline requirements across five domains that apply to every certified service profile, plus service-specific "vertical" requirements -- the first vertical published targets Incident Response services specifically. Critically, any managed-security provider delivering services under the EU Cybersecurity Reserve (the EU's pooled incident-response capacity, drawn on during major cross-border cyber crises) must hold EUMSS certification within two years of the scheme's entry into force -- turning a voluntary certification into a de facto procurement gate for that pool of providers. For Swiss and European public-sector SOCs and CI operators, this is the first concrete EU-level attempt to set a common assurance bar for external MSS/incident-response providers -- worth tracking now for future MSSP-selection and third-party-risk criteria, and worth commenting on during the consultation window if an organisation's current or prospective MSS supplier would need this certification to remain eligible for EU Cybersecurity Reserve-linked work.
    region_nexus: "EU-wide certification scheme under the Cybersecurity Act; relevant to any Swiss public-sector body or CI operator procuring EU-based managed security / incident-response services"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector (managed-security-service procurement)"
    cves: []
