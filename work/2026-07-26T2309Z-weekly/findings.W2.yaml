  - title: "BaFin fines TeamViewer EUR 240,000 for failing to properly disclose its 2024 nation-state breach as market-moving inside information -- a disclosure-timeliness precedent for any SIX/EU-listed software or CI supplier"
    sources:
      - { url: "https://www.bafin.de/SharedDocs/Veroeffentlichungen/DE/Massnahmen/40c_neu_124_WpHG/meldung_2026_07_20_team_viewer.html", publisher: "BaFin (German Federal Financial Supervisory Authority)", date: "2026-07-20", role: "primary" }
      - { url: "https://www.heise.de/news/TeamViewer-BaFin-verhaengt-Bussgeld-nach-Cyberangriff-11371639.html", publisher: "heise online", date: "2026-07-21", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Datenschutz Aufsichtsbehoerde Bussgeld Cyberangriff Schweiz Juli 2026\") -> borncity.com summary, URL https://borncity.com/blog/2026/07/24/nach-cyberangriff-bafin-verhaengt-bussgeld-gegen-teamviewer/ -> primary: BaFin, URL https://www.bafin.de/SharedDocs/Veroeffentlichungen/DE/Massnahmen/40c_neu_124_WpHG/meldung_2026_07_20_team_viewer.html -> corroborating: heise online, URL https://www.heise.de/news/TeamViewer-BaFin-verhaengt-Bussgeld-nach-Cyberangriff-11371639.html"
    summary: |
      Germany's BaFin (Federal Financial Supervisory Authority) announced on 2026-07-20 that it imposed a EUR 240,000 fine on TeamViewer SE on 2026-07-16 for violating Article 17(1) of the EU Market Abuse Regulation (MAR) -- the ad-hoc-disclosure duty requiring listed issuers to publish market-moving inside information "immediately." The underlying event is TeamViewer's confirmed mid-2024 compromise of its internal IT environment (publicly attributed at the time to the Russian state-nexus actor APT29/Cozy Bear/Midnight Blizzard, per TeamViewer's own 2024 security bulletin and contemporaneous heise reporting). BaFin's finding is narrow but consequential: TeamViewer did post a notice on its own website, but MAR requires ad-hoc disclosures to be distributed simultaneously through a regulated electronic information-dissemination system to media and to BaFin itself -- a website post alone does not satisfy the obligation, regardless of how quickly it went up. This is a concrete, appealable enforcement precedent (TeamViewer retains appeal rights) establishing that a nation-state compromise of a widely-deployed software vendor is inside information requiring formal, immediate, multi-channel disclosure -- directly relevant to any SIX-listed or EU-listed software/CI supplier weighing how (not just whether) to disclose a breach, and a reminder for Swiss/European public-sector and CI procurement teams that their software suppliers' own disclosure discipline is now an enforceable, fined obligation in at least one major EU jurisdiction.
    region_nexus: "Germany (BaFin enforcement); precedent-setting for any SIX- or EU-listed software/CI vendor with Swiss or European public-sector customers"
    primary_sector_nexus: "indirect"
    sector: "finance (regulatory precedent), cross-sector (TeamViewer is a widely deployed remote-access/remote-support tool across Swiss and European public-sector and CI environments)"
    cves: []
    techniques: []
    affected_products: ["TeamViewer"]
    entity_keys: []
    new_entities:
      - { key: "policy:bafin-teamviewer-mar-disclosure-fine-2026", type: policy, name: "BaFin TeamViewer MAR Article 17 disclosure fine", aliases: [], summary: "BaFin fined TeamViewer SE EUR 240,000 on 2026-07-16 (announced 2026-07-20) for violating EU Market Abuse Regulation Article 17(1) by not distributing ad-hoc disclosure of its mid-2024 cyberattack (publicly attributed to APT29/Cozy Bear) through the required regulated electronic information system, despite posting a website notice." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Die Finanzaufsicht Bafin hat am 16. Juli 2026 eine Geldbusse in Hoehe von 240.000 Euro gegen die TeamViewer SE festgesetzt. Das Unternehmen hatte gegen die Marktmissbrauchsverordnung (Market Abuse Regulation - MAR) verstossen."
        attribution: "BaFin"
        source_url: "https://www.bafin.de/SharedDocs/Veroeffentlichungen/DE/Massnahmen/40c_neu_124_WpHG/meldung_2026_07_20_team_viewer.html"
      - quote: "Wenn ein Unternehmen eine Insiderinformation nicht unverzueglich veroeffentlicht, verstoesst es gegen die MAR, konkret gegen Artikel 17 Absatz 1 Unterabsatz 1."
        attribution: "BaFin"
        source_url: "https://www.bafin.de/SharedDocs/Veroeffentlichungen/DE/Massnahmen/40c_neu_124_WpHG/meldung_2026_07_20_team_viewer.html"
      - quote: "Ad-hoc-Meldungen muessen ueber ein elektronisches Informationssystem an Medien und an die Bafin verteilt sowie auf der Unternehmenswebseite veroeffentlicht werden."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/TeamViewer-BaFin-verhaengt-Bussgeld-nach-Cyberangriff-11371639.html"
    extended_notes: |
      The original 2024 TeamViewer compromise itself is old news and not the point of this item -- the fresh, in-window fact is BaFin's 2026-07-20 enforcement announcement and the disclosure-format precedent it sets. No registry entity exists yet for APT29/Cozy Bear/Midnight Blizzard under any key (checked via grep across entities/registry.yaml; only campaign-level mentions exist) -- flagging as a gap for the registry maintainers rather than proposing a new actor entity myself, since this item does not carry fresh reporting on that actor's current activity. BaFin is not on the deployment's national-CERT carve-out list, but is treated here as MULTI-SOURCE given independent corroboration from heise online (added detail on the disclosure-channel mechanics and appeal rights beyond a restatement of the BaFin release).
    borderline: false

