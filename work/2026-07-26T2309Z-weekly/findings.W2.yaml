  - title: "ENISA and the European Commission sign a EUR 6M, three-year Health Action Plan agreement; first deliverable is EU-wide hospital procurement cybersecurity guidance"
    sources:
      - { url: "https://www.enisa.europa.eu/news/first-steps-forward-for-the-implementation-of-the-health-action-plan", publisher: "ENISA", date: "2026-07-22", role: "primary" }
      - { url: "https://www.enisa.europa.eu/publications/procurement-guidelines-for-the-cybersecurity-of-hospitals-and-healthcare-providers", publisher: "ENISA", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"ENISA press release week July 2026 threat landscape report\") -> ENISA news listing, URL https://www.enisa.europa.eu/news -> primary: ENISA, URL https://www.enisa.europa.eu/news/first-steps-forward-for-the-implementation-of-the-health-action-plan (no further pivot needed; ENISA is the issuing authority for its own agreement and deliverable)"
    summary: |
      ENISA signed a EUR 6 million, three-year Contribution Agreement with the European Commission (announced 2026-07-22) to fund implementation of the EU Health Action Plan, and published its first concrete deliverable: updated procurement guidelines for the cybersecurity of hospitals and healthcare providers, developed with input from the NIS Cooperation Group and the EU Health ISAC (EH-ISAC). Under the agreement ENISA will stand up a "European Cybersecurity Support Centre" for the health sector, organising services into four categories -- preparedness, detection, response and governance -- to give hospitals and healthcare operators direct access to EU-funded cyber-resilience support rather than generic guidance alone. The procurement guidelines give healthcare buyers (and their public-sector IT/security teams) concrete language to bake cybersecurity requirements into RFPs and vendor contracts for medical devices, hospital IT and connected care systems -- directly relevant for any Swiss or European public hospital or cantonal health authority procuring EU-facing medical/IT systems or benchmarking its own procurement language, even though Switzerland is outside the EU's own funding scope.
    region_nexus: "EU-wide programme; directly transferable to Swiss/European public and cantonal healthcare procurement practice"
    primary_sector_nexus: "indirect"
    sector: "healthcare, public-sector"
