- code: F3
  category: claim-not-supported
  section: weekly-sector-patterns
  item: "weekly-w30-ch-eu-public-sector-third-party-incidents — IFAGE / DragonForce"
  url_or_quote: "body: 'when DragonForce published the stolen set, it included identity-document photographs, addresses and multi-year student exam results, and 20 minutes reported the disclosure ... ([20 minutes, 2026-07-24](https://www.20min.ch/fr/story/geneve-les-hackers-de-l-institut-ifage-ont-mis-leurs-menaces-a-execution-103608147))' ; summary: 'Geneva's IFAGE ... had DragonForce publish student data'"
  summary: "The DragonForce actor attribution is bound to the only source cited in the IFAGE strand, the 20min article — but that article does NOT name DragonForce (verified twice this iteration; the word does not appear). 20min supports the data content and the verbatim French quote, not the actor. DragonForce is a true, registry-established attribution from the referenced operational entry (2026-07-26/ifage-geneva-dragonforce-data-published-student-records); the defect is that THIS entry cites it to a page that does not state it. Remediation: cite the source that attributes the IFAGE leak to DragonForce (available in the referenced operational entry), or re-attribute — do NOT delete the actor (it is correct)."
- code: F3
  category: claim-not-supported
  section: weekly-sector-patterns
  item: "weekly-w30-ch-eu-public-sector-third-party-incidents — Stiftung Autismuslink / INC Ransom"
  url_or_quote: "body: 'confirmed that \"groessere Datenmengen\" were exfiltrated and its server temporarily encrypted, with INC Ransom's leak-site listing exposing cantonal education-directorate contracts and disability-insurance agreements ([Stiftung Autismuslink, 2026-07](https://autismuslink.ch/wp-content/uploads/2026_07_Informationsschreiben_zum_Serverausfall_Extern.pdf))' ; summary: '(INC Ransom) exposed cantonal education-directorate and disability-insurance records'"
  summary: "Read the full victim PDF this iteration. It confirms verbatim 'groessere Datenmengen durch die Angreifer abgezogen und unser Server voruebergehend verschluesselt' and lists 'Leistungsvereinbarungen mit der IV und der BKD' as affected data. But it does NOT name INC Ransom, does NOT describe any leak-site listing, and explicitly states 'Es kann keine Aussage dazu getroffen werden, was mit den gestohlenen Daten passiert' (it cannot say what happened to the stolen data). So (a) the INC Ransom actor attribution and (b) the 'leak-site listing exposing [X]' framing are both unsupported by the only source cited in this strand. The data categories themselves ARE the victim's own disclosure, not a leak-site listing. INC Ransom is true per the referenced operational entry (2026-07-25/stiftung-autismuslink-bern-inc-ransom-breach). Remediation: add the reporting that names INC Ransom / the leak-site claim, and reframe so the affected-data categories are attributed to the victim notice (which lists them) while the INC Ransom leak-site attribution is cited to the reporting that supports it."
