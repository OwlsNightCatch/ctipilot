  item: "weekly-w30-c2-through-trusted-infrastructure — msaRAT WebRTC relay"
  url_or_quote: "body: \"tunnel over a WebRTC DataChannel relayed through Cloudflare Workers\"; summary: \"tunnelling over WebRTC relayed through Cloudflare\""
  summary: >-
    The entry states the msaRAT WebRTC DataChannel is 'relayed through Cloudflare Workers'.
    The cited Talos page (verified via jina this iteration) states the opposite division of
    labour: 'establishes a WebRTC DataChannel ... using Twilio TURN ... as a relay' and
    section header 'WebRTC DataChannel establishment (using Cloudflare Workers for
    signaling)'; the TURN relay is 'global.turn.twilio.com', STUN is Google
    (stun2.l.google.com), and Cloudflare Workers only performs SDP signalling / serves the
    ICE config. The relay is Twilio TURN, not Cloudflare Workers. Material for the entry's
    own 'baseline which hosts legitimately speak to ...' detection guidance. Correct to
    'relayed via Twilio TURN, with signalling through Cloudflare Workers'.
