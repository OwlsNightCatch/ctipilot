    extended_notes: |
      Adobe per-CVE table (fetched directly from the bulletin, row-matched to CVE-2026-71362, not
      inferred from list position): Vulnerability Category = Incorrect Authorization (CWE-863);
      Vulnerability Impact = Privilege escalation; Severity = Critical; Authentication required to
      exploit? = No; Exploit requires admin privileges? = No; CVSS base score = 9.1; CVSS vector =
      CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N. Affected-versions table (verbatim, per product):
      Adobe Commerce — 2.4.9-2026-jul and earlier, 2.4.8-2026-jul and earlier, 2.4.7-2026-jul and
      earlier, 2.4.6-2026-jul and earlier, 2.4.5-2026-jul and earlier, 2.4.4-2026-jul and earlier
      (All platforms); Adobe Commerce B2B — 1.5.3-2026-jul and earlier, 1.5.2-2026-jul and earlier,
      1.4.2-2026-jul and earlier, 1.3.4-2026-jul and earlier, 1.3.3-2026-jul and earlier (All);
      Magento Open Source — 2.4.9-2026-jul and earlier, 2.4.8-2026-jul and earlier, 2.4.7-2026-jul
      and earlier, 2.4.6-2026-jul and earlier (All). Fixed/updated versions (Solution table):
      matching "-2026-aug" builds for each of the same release lines, Priority Rating 2, distributed
      as isolated patch files per Adobe's KB ka-40380 (merchants must first be on the latest -p
      release for their supported line before applying the isolated patch — no Composer package
      ships with this bulletin). APSB26-92 as a whole covers 7 CVEs total: CVE-2026-71362 (the
      account-takeover flaw, this item), plus CVE-2026-48411 through CVE-2026-48416 (a mix of
      stored-XSS (CWE-79) and other authorization flaws per Adobe's table — not researched further
      here as out of scope for this single-item follow-up; none of the other six carry the
      unauthenticated/no-privilege exploitation profile of CVE-2026-71362).

      Detection framing for a Tier 2/3 responder: the vulnerability is a session/identity-binding
      logic flaw in Magento's customer-account session handling, not a credential-theft or
      cookie-exfiltration technique — there is no stolen artifact to hunt for. Telemetry class to
      instrument: web/application access logs on the Commerce/Magento storefront and customer
      account/session endpoints, looking for anomalous session-identity transitions (a session
      cookie value that begins associated with one customer identity and is observed acting as a
      different customer account within the same session lifetime) and for unauthenticated requests
      to customer-session/account-switch code paths from IPs with no prior authenticated history on
      that session. Sansec's write-up does not publish the specific vulnerable endpoint/parameter
      (kept withheld as is standard once a vendor patch exists and before full technical disclosure),
      so a hunt built purely from public sources will be behavioral (anomalous account-session
      identity switches, spikes in account-detail/order-history views immediately following
      unauthenticated requests) rather than signature-based. Hardening: apply Adobe's isolated
      patch for APSB26-92 to the matching "-2026-aug" build immediately (Priority 2 = apply within
      30 days per Adobe's own severity-rating scale, but the confirmed immediate targeting argues
      for treating this as urgent regardless of the vendor's routine priority label); merchants
      running Sansec Shield or an equivalent Magento-aware WAF should confirm the rule set has been
      updated to cover CVE-2026-71362 specifically, since Shield's blocking is described as already
      covering this flaw even pre-patch.

      Cross-check: CISA KEV catalog fetched fresh this run (python3 tools/fetch_source.py
      cisa-kev) — CVE-2026-71362 is NOT present. The most similar prior KEV-listed Adobe
      Commerce/Magento flaw is CVE-2025-54236 (Improper Input Validation via the Commerce REST
      API, added to KEV 2025-10-24) — a different CVE, different CWE class, from the prior year;
      not the same vulnerability and not corroborating this one, noted only as sector context that
      Adobe Commerce/Magento account-takeover flaws have a track record of KEV listing after
      confirmed active exploitation.

      National-CERT search (targeted WebSearch, English + German + French query variants) found no
      NCSC-NL, BSI/CERT-Bund WID-SEC, or CERT-FR advisory referencing CVE-2026-71362 or APSB26-92
      as of this research pass — flagged as a gap, not asserted as "no national-CERT coverage
      exists," since a national bulletin could still land after this research window closes.
