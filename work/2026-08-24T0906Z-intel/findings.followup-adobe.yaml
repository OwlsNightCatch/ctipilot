    discovery_trace: "first seen at: verifier-supplied lead, URL https://www.securityweek.com/adobe-commerce-bug-targeted-immediately-after-disclosure/ → primary: Adobe PSIRT bulletin APSB26-92, URL https://helpx.adobe.com/security/products/magento/apsb26-92.html → primary: Sansec's own research write-up (the disclosing/observing party for the exploitation claim), URL https://sansec.io/research/adobe-commerce-account-takeover-apsb26-92 → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-adobe-commerce-flaw-to-hijack-customer-accounts/ → corroboration: Security Affairs, URL https://securityaffairs.com/197149/hacking/adobe-commerce-cve-2026-71362-comes-under-attack-shortly-after-public-disclosure.html"
    summary: |
      Adobe's August 2026 Patch Tuesday bulletin APSB26-92 (published 2026-08-11, Priority 2) fixes
      seven vulnerabilities in Adobe Commerce, Adobe Commerce B2B and Magento Open Source. The
      headline flaw, CVE-2026-71362, is an Incorrect Authorization issue (CWE-863) in how these
      products bind customer identity to an account session. Per Adobe's own per-CVE table it
      carries CVSS v3.1 base score 9.1 (vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N),
      requires NO authentication and NO administrator privileges to exploit, and its impact category
      is privilege escalation. Sansec, the webstore-security firm that reviewed the patch, states the
      flaw "lets attackers switch a customer session to another customer account," giving the
      attacker access to the victim account and its private customer data — an unauthenticated
      account-takeover / session-confusion primitive, not a credential-stuffing or cookie-theft
      technique. Affected versions per Adobe: Commerce 2.4.4 through 2.4.9 (all "-2026-jul and
      earlier" builds), Commerce B2B 1.3.3/1.3.4/1.4.2/1.5.2/1.5.3 ("-2026-jul and earlier"), and
      Magento Open Source 2.4.6 through 2.4.9 ("-2026-jul and earlier"); Adobe's fix is distributed
      as an isolated patch file (no new Composer package) advancing each line to the matching
      "-2026-aug" build. Adobe's own bulletin states it was "not aware of any exploits in the wild"
      at publication — but Sansec reports its Shield WAF "already blocks exploitation attempts,"
      and SecurityWeek (citing Sansec) reports hackers began targeting the flaw "immediately after
      public disclosure" / "shortly after Adobe's advisory was published." No researcher-named
      threat cluster is attached to the activity; the credited discoverer of CVE-2026-71362 in
      Adobe's acknowledgements is "0x0.eth (0x0doteth)." As of this research, CVE-2026-71362 is
      NOT listed in the CISA KEV catalog, and no NCSC-NL, BSI/CERT-Bund, or CERT-FR advisory
      referencing it was found (targeted web searches in German and French turned up nothing
      in-window).
    region_nexus: "global; any Swiss/EU organization running public-facing Adobe Commerce or Magento Open Source storefronts (public-sector e-shops/e-procurement portals, utility/transport ticketing sites, retail and finance customer portals) is exposed to unauthenticated account takeover"
