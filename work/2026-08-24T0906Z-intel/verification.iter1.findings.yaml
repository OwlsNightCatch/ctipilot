- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "2026-08-14/fortinet-august-2026-fortiweb-radius-wildcard-admin-bypass"
  url_or_quote: "techniques: [T1190, T1078.001, T1557, T1068]"
  summary: "T1078.001 is 'Valid Accounts: Default Accounts' in the pinned ATT&CK dataset — built-in/factory accounts. Nothing in the body or in any of the three fetched Fortinet advisories describes default-account use: FG-IR-26-158 states the appliance 'may allow a remote unauthenticated attacker to login into the Fortiweb GUI/CLI with a random username and password' because a customer-configured Remote-RADIUS admin account has wildcard matching enabled. The mapped id names a behaviour the entry does not describe. Replace with T1078 (Valid Accounts) or T1556 (Modify Authentication Process). T1190, T1557 (FortiClient DNS-response crafting) and T1068 (Fortinet's own 'Escalation of privilege' impact) are all supported."
