  item: "2026-08-14/fortinet-august-2026-fortiweb-radius-wildcard-admin-bypass"
  url_or_quote: "Fortinet disclosed six vulnerabilities on 2026-08-12 ... The remaining three CVEs in the batch are lower severity: a FortiWeb content-encoding handling issue and two FortiOS flaws affecting the explicit-proxy daemon and the GUI"
  summary: "Batch size is wrong in both the summary and the body. The entry's own corroborating source says eight ('Fortinet on Wednesday announced patches for eight vulnerabilities across its products', SecurityWeek 2026-08-13), and Fortinet's IR feed (https://filestore.fortinet.com/fortiguard/rss/ir.xml, fetched this iteration) lists eight advisories dated Wed 12 Aug 2026: FG-IR-26-156, -157, -158, -159, -160, -161, -162, -163. After the three the entry covers, FIVE remain, not three, and the two the sentence omits are FG-IR-26-159 (FortiSIEM GUI SSRF, authenticated) and FG-IR-26-163 (HTTP/2 Bomb CVE-2026-49975 in FortiPAM / FortiProxy / FortiSwitchManager). The 'remaining three' sentence also carries no inline citation. Fix: six -> eight, and correct the remainder sentence (FG-IR-26-157 FortiWeb Content-Encoding WAF evasion CVSS 4.8, FG-IR-26-161 FortiOS explicit-proxy WAD stack overflow, FG-IR-26-162 FortiOS UI DoS, FG-IR-26-159 FortiSIEM SSRF, FG-IR-26-163 Apache HTTP/2 Bomb), with a citation."
