  item: "CVE-2026-71362 — Adobe Commerce / Magento pre-auth account takeover, exploitation observed in-window"
  url_or_quote: "https://www.securityweek.com/adobe-commerce-bug-targeted-immediately-after-disclosure/ (Ionut Arghire, August 13, 2026, 10:17 AM ET = 14:17 UTC — inside the 26 h window; fetched this iteration)"
  summary: "An actively-exploited CVSS 9.1 incorrect-authorization flaw allowing unauthenticated attackers to take over customer accounts in Adobe Commerce / Magento Open Source. Sansec reports blocking the first exploitation attempts within hours of Adobe's advisory. Not in prior_coverage.json, not in state/cves_seen.json, and not among the run record's documented drops or out-of-window items — a silent omission, not a recorded decision. It clears the beyond-the-patch-cycle bar (pre-auth, critical, exploitation observed) on a widely deployed platform, and the run reached both SecurityWeek (cited on the Fortinet entry) and Adobe's PSIRT (whose fetch recipe this run repaired). Suggested query: 'Sansec CVE-2026-71362 Adobe Commerce session identity exploitation' plus Adobe's August 2026 Commerce bulletin."
