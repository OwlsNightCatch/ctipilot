  - title: "\"City-Forum\" — a 17-month-old, still-active campaign abuses over-permissioned Salesforce and ServiceNow guest accounts to read exposed portal data across telecom, banking, financial-services and public-sector organisations worldwide"
    sources:
      - { url: "https://www.theregister.com/cyber-crime/2026/08/13/mystery-attacker-spent-a-year-raiding-salesforce-and-servicenow-portals/5287368", publisher: "The Register", date: "2026-08-13", role: "primary" }
      - { url: "https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow", publisher: "Reco (Nitay Bachrach)", date: "2026-08-12", role: "primary" }
    discovery_trace: "first seen at: darkreading, URL https://www.darkreading.com/rss.xml → pivot: Reco original research, URL https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow → corroboration via WebSearch (\"'City-Forum' Salesforce ServiceNow campaign Reco August 13 2026\") → in-window anchor: The Register, URL https://www.theregister.com/cyber-crime/2026/08/13/mystery-attacker-spent-a-year-raiding-salesforce-and-servicenow-portals/5287368"
    summary: |
      Reco researcher Nitay Bachrach documented a still-active, 17-month campaign (infrastructure standing since March 2025, IP 158.220.87.79 on Contabo/ASN 51167, domain city-forum.com, User-Agent "Go-http-client/1.1") that abuses guest/anonymous identities on Salesforce Experience Cloud and ServiceNow Service Portal instances rather than exploiting any software vulnerability or stolen credential. On Salesforce it combines known Aura-framework guest enumeration (HostConfigController.getConfigData, SelectableListDataProviderController.getItems) with what Reco assesses is the first observed in-the-wild abuse of Salesforce's Lightning Web Runtime (LWR) UI-API — a GraphQL/REST data layer reached at /webruntime/api/services/data/vNN.0/graphql, swept across API versions v56.0 through v66.0 — plus probing of /SiteRegister and /CommunitiesSelfReg self-registration endpoints. On ServiceNow the actor calls the undocumented native Service Portal search endpoint (POST /api/now/sp/search?sysparm_cancelable=true), reverse-engineered from the portal's typeahead widget; guest identity returns an empty HTTP 201 that is indistinguishable from "no results" in the transaction log, complicating retrospective scoping. Targeted sectors span telecom operators, banks and financial-services firms, enterprise-software and security/privacy vendors, and public-sector portals worldwide; no specific victim organisations are named and the actor is unattributed (Reco explicitly declines to link it to ShinyHunters' separate, better-known Salesforce campaign). Reco notes Salesforce audit logs (Event Monitoring/Shield) cannot reliably show which records/fields were actually returned — organisations must replay the observed request patterns themselves to determine real exposure.
    region_nexus: "Global; sectors named (telecom, banking/financial-services, public-sector) map directly onto this constituency's additional-sector lens, though no specific Swiss/European victim is named"
    primary_sector_nexus: "indirect"
    sector: "telco, finance, public-sector"
    cves: []
    techniques: [T1213]
    affected_products: ["Salesforce Experience Cloud", "Salesforce Lightning Web Runtime", "ServiceNow Service Portal"]
    entity_keys: []
    new_entities:
      - { key: "actor:city-forum", type: actor, name: "City-Forum",
          aliases: [],
          summary: "Reco's designation (from the domain city-forum.com, registered since March 2025) for an unattributed actor running a 17-month campaign abusing over-permissioned Salesforce and ServiceNow guest/anonymous portal access to enumerate and exfiltrate exposed data across telecom, banking, financial-services and public-sector organisations (Reco, 2026-08-12; The Register, 2026-08-13)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This actor is different. Except for Aura, the attacker reaches Salesforce Lightning Web Runtime (LWR) sites through the UI-API, a data layer we have not seen any public tool."
        attribution: "Reco (Nitay Bachrach)"
        source_url: "https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow"
      - quote: "In every case here — Aura, LWR, and the ServiceNow portal alike — the exposure is a guest identity that was granted more than it needed."
        attribution: "Reco (Nitay Bachrach)"
        source_url: "https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow"
      - quote: "If the guest can read a record, so can anyone on the internet. That is not a platform vulnerability."
        attribution: "Reco, quoted by The Register"
        source_url: "https://www.theregister.com/cyber-crime/2026/08/13/mystery-attacker-spent-a-year-raiding-salesforce-and-servicenow-portals/5287368"
    extended_notes: |
      Borderline S3/S4: this is discovery-driven research (no named victim disclosure) rather than a victim's own breach statement, so it could equally have been surfaced by the research domain. I am returning it under S4 because it describes an ongoing, already-realised mass data-exfiltration exposure (not a theoretical vulnerability) spanning this constituency's named sectors, with concrete triage guidance below. Hardening/detection specifics for the brief: Salesforce — Experience Builder → Administration → Preferences → uncheck "Allow guest users to access public APIs" (closes both GraphQL and UI-API in one action); strip guest sharing rules/field-level permissions on Accounts/Contacts/Cases; disable guest file access and self-registration where unneeded. ServiceNow — map guest-facing sp_portal instances via m2m_sp_portal_search_source to sp_search_source and detach unnecessary sources from public portals; gate scripted search sources with gs.isLoggedIn() and use GlideRecordSecure, not plain GlideRecord; audit Knowledge Base "Can Read" criteria for "Any User" (empty scoping = world-readable). Detection: Salesforce EventLogFile AuraRequest/Sites events filtered on USER_AGENT="Go-http-client/1.1" and the SelectableListDataProviderController/ACTION$getItems action-message pattern; ServiceNow syslog_transaction filtered on URL starting /api/now/sp/search from an unauthenticated/guest session.
    actions:
      - "Audit Salesforce Experience Cloud guest-user profile permissions and the 'Allow guest users to access public APIs' toggle (Experience Builder → Administration → Preferences), and audit ServiceNow guest-facing portals' search-source mappings (sp_portal → m2m_sp_portal_search_source → sp_search_source) for anonymous/world-readable exposure — the City-Forum campaign (Reco, 2026-08-12) demonstrates this is being actively abused at scale."

  - title: "UPDATE — Beacon CRM's compromised access key traced to an AWS credential baked into public JavaScript build artifacts"
    sources:
      - { url: "https://www.infosecurity-magazine.com/news/exposed-aws-key-data-charities/", publisher: "Infosecurity Magazine", date: "2026-08-13", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/08/13/aws-key-exposed-in-javascript-may-have-lit-way-to-beacons-charity-data/5287303", publisher: "The Register", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ → primary: Infosecurity Magazine article, URL https://www.infosecurity-magazine.com/news/exposed-aws-key-data-charities/ → corroboration via WebSearch (\"Beacon CRM incident update AWS access key exposed JavaScript\") → The Register, URL https://www.theregister.com/security/2026/08/13/aws-key-exposed-in-javascript-may-have-lit-way-to-beacons-charity-data/5287303"
    summary: |
      Beacon, the CRM platform whose breach affecting roughly 1,500 UK charities this pipeline covered on 2026-08-08, published a root-cause update on 2026-08-12: the compromised AWS access key that gave the attacker full-database read/download access was "potentially exposed in public Javascript build artifacts" — i.e., an automated frontend build process baked a live AWS credential into client-facing JavaScript shipped from Beacon's own website, rather than the key being phished or brute-forced. Analysis of Beacon's AWS Cost & Usage reports narrows the malicious-activity window to roughly 01:20:16 UTC on 27 July 2026 through about 87–107 minutes later (sources give slightly different window lengths), during which the attacker downloaded the full customer database, including attachments, in a form AWS decrypted for a holder of valid credentials. Beacon has since revoked and rotated all AWS-integrated keys and secrets and stripped sensitive parameters from client-side JavaScript. The UK ICO is reported to have concluded the affected charities themselves bear no responsibility for the breach.
    region_nexus: "United Kingdom — public/voluntary-sector data (charities, hospices, NHS-linked organisations already named in the original disclosure)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, healthcare"
    cves: []
    techniques: [T1552.001, T1530]
    affected_products: []
    entity_keys: ["incident:beacon-crm-uk-charities-breach-2026-08"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-08-08/beacon-crm-access-key-breach-uk-charities-hospices"
    evidence:
      - quote: "The access key was potentially exposed in public Javascript build artifacts. This suggests an error was made in the course of software development."
        attribution: "Infosecurity Magazine, citing Beacon's incident update"
        source_url: "https://www.infosecurity-magazine.com/news/exposed-aws-key-data-charities/"
      - quote: "a copy of the database which holds all Beacon customer data, including attachment files, was made and likely downloaded in a readable format by the threat actor"
        attribution: "Beacon CTO David Simpson, quoted by The Register"
        source_url: "https://www.theregister.com/security/2026/08/13/aws-key-exposed-in-javascript-may-have-lit-way-to-beacons-charity-data/5287303"
      - quote: "The ICO had already reviewed its case and concluded that the charity holds no responsibility for the breach."
        attribution: "Infosecurity Magazine"
        source_url: "https://www.infosecurity-magazine.com/news/exposed-aws-key-data-charities/"
    extended_notes: |
      Modest but genuinely new technical detail versus the 2026-08-08 entry, which only described the key as "more sophisticated than a simple compromised username and password" — the actual mechanism (a secret baked into a public frontend build artifact) is a distinct, common, and under-scanned exposure class relevant to any organisation running CI/CD-built client-side web assets.
    actions:
      - "Run a secret scan (e.g. trufflehog/gitleaks-style detection) across compiled/minified frontend JavaScript bundles actually served to browsers, not just source repositories — Beacon's root-cause analysis (2026-08-12) found the exposed AWS key was baked into a public build artifact, a class of exposure that repo-only secret scanning misses."

