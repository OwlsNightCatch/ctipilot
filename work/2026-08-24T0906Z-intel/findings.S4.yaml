          aliases: ["Fisc français cyberattaque 2026", "DGFiP data breach 2026"],
          summary: "Compromise of a DGFiP internal VPN via identity theft, reaching a taxpayer-search application; intrusion occurred late June 2026, publicly claimed on a criminal forum on 2026-08-12 with figures ranging 678,437 to ~2 million records; ANSSI and CNIL engaged (actu17.fr / ZATAZ, 2026-08-13)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
