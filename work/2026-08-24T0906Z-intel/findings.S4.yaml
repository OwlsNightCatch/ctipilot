items:
  - title: "France's DGFiP tax authority confirms an intrusion via a compromised internal VPN, with claimed extraction ranging from 678,000 to near 2 million taxpayer records"
    sources:
      - { url: "https://actu17.fr/faits-divers/cyberattaque-visant-la-dgfip-nom-adresse-et-numero-fiscal-dusagers-recuperes-par-un-pirate.html", publisher: "actu17.fr", date: "2026-08-13", role: "primary" }
      - { url: "https://www.zataz.com/fisc-un-acces-illegitime-confirme-a-expose-des-donnees/", publisher: "ZATAZ.COM", date: "2026-08-13", role: "corroborating" }
    discovery_trace: "first seen at: zataz, URL https://www.zataz.com/feed/ → pivot: ZATAZ article, URL https://www.zataz.com/fisc-un-acces-illegitime-confirme-a-expose-des-donnees/ → corroborating pivot via WebSearch (\"DGFiP fisc français cyberattaque données extraites août 2026 ANSSI\") → actu17.fr, URL https://actu17.fr/faits-divers/cyberattaque-visant-la-dgfip-nom-adresse-et-numero-fiscal-dusagers-recuperes-par-un-pirate.html"
    summary: |
      The French Direction générale des Finances publiques (DGFiP — the national tax authority, part of the Ministry of the Economy and Finance, "Bercy") confirmed that its information system suffered an "accès illégitime" (illegitimate access) in late June 2026, reached via a compromised internal VPN following identity theft/impersonation ("usurpation d'identité") that gave an attacker access to a taxpayer-search application. Bercy's official statement confirms consultation and extraction of data relating to both individuals and professional taxpayers but does not specify volume or nature. A criminal actor first claimed 678,437 potential victim records for sale on a hacker forum; a second, separate claim on the same forum alleges nearly 2 million property-owner ("propriétaires") records. Exposed fields reported in the claimed samples include names, addresses, dates of birth, family situation, declared income, source-withholding tax rate and fiscal reference numbers. DGFiP says it has tightened access restrictions since discovery; ANSSI (France's national cybersecurity agency) and the CNIL (data-protection authority) are now engaged to establish the precise scope, and a formal complaint is being filed. No named threat actor or malware family has been attributed publicly.
    region_nexus: "France — EU member-state national government/tax administration; direct core-constituency nexus (national public administration)"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1078, T1213]
    affected_products: []
    entity_keys: []
    new_entities:
