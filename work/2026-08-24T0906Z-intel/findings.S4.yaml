        attribution: "actu17.fr"
        source_url: "https://actu17.fr/faits-divers/cyberattaque-visant-la-dgfip-nom-adresse-et-numero-fiscal-dusagers-recuperes-par-un-pirate.html"
      - quote: "l'intrusion aurait débuté par la compromission d'un VPN interne"
        attribution: "actu17.fr"
        source_url: "https://actu17.fr/faits-divers/cyberattaque-visant-la-dgfip-nom-adresse-et-numero-fiscal-dusagers-recuperes-par-un-pirate.html"
      - quote: "Bercy confirme la consultation et l'extraction de données relatives à des particuliers et des professionnels, sans préciser leur nature ni le nombre de personnes touchées"
        attribution: "ZATAZ.COM"
        source_url: "https://www.zataz.com/fisc-un-acces-illegitime-confirme-a-expose-des-donnees/"
    extended_notes: |
      Both fetched sources are French-language and neither is a first-party ANSSI/DGFiP advisory — I read secondary reporting quoting Bercy's official statement, not the statement itself (unreachable via search this run). Confidence held at MEDIUM pending a primary ANSSI/CERT-FR or DGFiP publication; CERT-FR's own listing did not carry this item as of fetch time. Worth a follow-up pass on cert.ssi.gouv.fr/avis and cert.ssi.gouv.fr/actu for a first-party French-government citation once (if) one is published. The identity-theft-to-VPN-access vector is the transferable lesson for any government agency running internal VPN access gated on identity-proofing rather than phishing-resistant MFA.

  - title: "UPDATE — Cl0p's PTC Windchill/FlexPLM campaign gets its first named-victim confirmation (Philips) as the leak-site batch grows to roughly 50 companies including Shell"
    sources:
      - { url: "https://www.zataz.com/cl0p-cible-philips-et-shell-deux-geants-europeens/", publisher: "ZATAZ.COM", date: "2026-08-13", role: "primary" }
      - { url: "https://www.zataz.com/cl0p-industrialise-ses-attaques-via-ptc-windchill/", publisher: "ZATAZ.COM", date: "2026-08-13", role: "primary" }
      - { url: "https://wkzo.com/2026/08/13/philips-shell-targeted-by-hacking-group/", publisher: "Thomson Reuters (via WKZO)", date: "2026-08-13", role: "corroborating" }
    discovery_trace: "first seen at: zataz, URL https://www.zataz.com/feed/ → pivot: ZATAZ article, URL https://www.zataz.com/cl0p-cible-philips-et-shell-deux-geants-europeens/ → pivot: ZATAZ follow-up article, URL https://www.zataz.com/cl0p-industrialise-ses-attaques-via-ptc-windchill/ → corroboration via WebSearch (\"Cl0p Philips Shell Fiserv GE Windchill 50 companies bleepingcomputer\") → independent wire corroboration, URL https://wkzo.com/2026/08/13/philips-shell-targeted-by-hacking-group/"
    summary: |
      Cl0p named Philips and Shell on its leak site on 12 August 2026, and same-day follow-up reporting puts the total batch tied to the PTC Windchill/FlexPLM campaign (CVE-2026-12569) at roughly 50 organisations, including Fiserv and GE alongside the 44 already tracked as of 2026-08-13. This is the first named-victim confirmation in the campaign this pipeline has tracked: Philips (Netherlands, medical-technology manufacturer) confirmed and contained an attempted compromise of a specific enterprise server holding internal data, with no customer-environment impact. Shell said it is aware of a "possible incident" and is investigating with its security teams and external experts but has not confirmed compromise. GE said it has initiated its cyber-incident response protocols to assess the claim. Fiserv, by contrast, said its comprehensive review to date found no evidence that customer, banking, transaction or personal data was compromised — a company named in the same batch actively disputing exposure. Cl0p claims 89 GB of data from Shell (engineering drawings, facility photos, testing reports, project plans) and 13.5 GB from Philips (PDF drawings, diagrams, blueprints). PTC itself is quoted confirming the underlying flaw allows unauthenticated remote code execution and that it has observed persistent hostile activity against internet-exposed Windchill/FlexPLM deployments; Ransom-ISAC had already warned on 22 July that Cl0p was exploiting Windchill/FlexPLM, with victim organisations reporting having received extortion notices from 19-20 July. No source states the intrusion route for the newly named victims specifically, though the reporting frames Philips and Shell as part of the same campaign as the earlier 44-victim batch.
    region_nexus: "Europe — Philips (Netherlands) and Shell (UK/Netherlands, major EU/UK operations); both are large multinationals with European critical-sector footprints"
    primary_sector_nexus: "indirect"
    sector: "healthcare, energy"
