    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0300 (NCSC-2026-0300, published 2026-08-13T13:26Z) → pivot: WebSearch (\"Fortinet PSIRT FortiWeb CVE-2026-26035 authentication bypass\") → primary: Fortinet PSIRT, URL https://www.fortiguard.com/psirt/FG-IR-26-158 → corroborating: SecurityWeek, URL https://www.securityweek.com/fortinet-patches-authentication-flaws-in-fortiweb-and-fortimanager/ ; CyCognito, URL https://www.cycognito.com/blog/2817-2/ ; HKCERT, URL https://www.hkcert.org/security-bulletin/fortinet-products-multiple-vulnerabilities_20260813 → cross-checked remaining CVEs directly against Fortinet PSIRT FG-IR-26-156/157/160/161/162 and the Dutch-NCSC CSAF mirrors NCSC-2026-0299 / NCSC-2026-0296."
    summary: |
      Fortinet's 2026-08-12 security bulletin discloses six CVEs across FortiWeb, FortiManager, FortiClient Windows
      and FortiOS; the Dutch national CERT republished five of them the next day (NCSC-2026-0296/0299/0300).
      The headline is CVE-2026-26035 (FG-IR-26-158, CWE-287 Improper Authentication): when a FortiWeb administrator
      account is configured for Remote RADIUS Type authentication with the non-default "wildcard" setting enabled,
      the appliance matches ANY username returned by the RADIUS server against the configured admin group, letting
      a remote unauthenticated attacker log into the FortiWeb GUI/CLI with arbitrary (random) credentials and obtain
      full administrative control. Fortinet rates it 8.8 (High); third-party CVSS recomputation (carried in the
      NCSC-NL CSAF mirror) puts it at 9.8 (Critical). Affected: FortiWeb 8.0.0-8.0.2, 7.6.0-7.6.6, 7.4.0-7.4.11,
      7.2.0-7.2.12, 7.0.0-7.0.12; fixed in 8.0.3, 7.6.7, 7.4.12, 7.2.13. Workaround: disable the wildcard setting on
      Remote-Type administrator accounts. Fortinet found it internally during an audit; "Known Exploited: No" and
      no public PoC has been reported as of 2026-08-13. The same batch fixes CVE-2026-70465 (FG-IR-26-156, CVSS 7.3):
      a heap/buffer-copy overflow in the FortiClient Windows kernel driver's DNS-response handling that lets an
      attacker positioned to manipulate DNS responses (on-path / rogue DNS) trigger arbitrary code execution and
      local privilege escalation on the endpoint, discovered by Nir Chako of Pentera, affecting FortiClient Windows
      7.2.0-7.2.11 and 7.4.0-7.4.3 (fixed 7.2.12 / 7.4.4). CVE-2026-70468 (FG-IR-26-160, CVSS 7.3) is an FGFM-protocol
      authentication weakness in FortiManager/FortiManager Cloud 7.2.5-7.2.9, 7.4.3-7.4.5 and 7.6.1: an attacker
      holding a valid certificate can impersonate any FortiGate device the FortiManager manages when the
      fgfm-peercert-withoutsn CLI option is left enabled (fixed 7.2.10/7.4.6/7.6.2; workaround: disable that option).
      Rounding out the batch: CVE-2026-70466 (FG-IR-26-157, CVSS 4.8) is a FortiWeb WAF Content-Encoding evasion
      allowing policy bypass via crafted requests; CVE-2026-71407 (FG-IR-26-161, CVSS 5.1, reported by UK NCSC) is a
      stack buffer overflow in the FortiOS WAD explicit-proxy daemon reachable only when Kerberos auth + SOCKS are
      both enabled; CVE-2026-71408 (FG-IR-26-162, CVSS 5.0) is a slow-HTTP GUI DoS in FortiOS. None of the six are
      listed as exploited as of publication.
    region_nexus: "global; FortiWeb/FortiManager/FortiOS are widely deployed as internet-facing perimeter and management infrastructure across Swiss and European public-sector and critical-infrastructure networks"
