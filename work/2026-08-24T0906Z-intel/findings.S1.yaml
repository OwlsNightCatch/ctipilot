    extended_notes: |
      Fortinet FortiWeb/FortiOS auth-bypass and management-plane flaws have a recent history of rapid weaponisation
      after disclosure (e.g. the FortiWeb CVE-2025-64446 auth bypass exploited in the wild within days of a PoC
      surfacing, and the January 2026 FortiCloud SSO bypass CVE-2026-24858 found already exploited by two malicious
      FortiCloud accounts). CVE-2026-26035 has the same "unauthenticated GUI/CLI login" shape and is worth watching
      for a PoC even though Fortinet currently rates its own exploit-code-maturity as unproven. Internet-exposed
      FortiWeb/FortiManager management interfaces (not just data-plane WAF ports) should be pulled off the public
      internet regardless of patch status, per Fortinet's own recurring guidance on this device class.
