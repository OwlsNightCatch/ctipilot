    extended_notes: |
      No CVE identifiers had been assigned to these three GHSA advisories as of this run (OSV.dev returns 404 for
      all three ids); cite by GHSA id until MITRE/NVD assigns CVEs. Detection angle: the webhook-bypass and
      decorator-RCE paths both manifest as the Langflow server process (uvicorn/gunicorn worker) spawning child
      processes or making outbound network connections it does not normally make — anomalous child-process
      creation from the Langflow API worker is the most portable telemetry hook across all three bugs in this
      batch and the still-open CVE-2026-9198 path.
