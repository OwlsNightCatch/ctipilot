  - title: "CVE-2026-19188 — Haiwell IoT Cloud HMI Gateway: unauthenticated root-level OS command injection via a Socket.io event, no CISA-documented exploitation yet"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-225-02", publisher: "CISA (ICS Advisory ICSA-26-225-02)", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: cisa-advisories, URL https://www.cisa.gov/cybersecurity-advisories/all.xml (feed entry for icsa-26-225-02, day-of-year 225 = 2026-08-13) → primary: CISA ICS Advisory, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-225-02 (no pivot needed — CISA is the disclosing authority) → corroboration attempted via WebSearch (\"Haiwell IoT Cloud HMI Gateway CVE-2026-19188 command injection\"), no independent coverage found as of this run"
    summary: |
      CISA published ICSA-26-225-02 on 2026-08-13 for a CVSS 10.0 (v3.1 and v4.0) OS command injection vulnerability
      (CWE-78) in Haiwell IoT Cloud HMI Gateway 3.40.1.12, tracked as CVE-2026-19188. The vulnerability sits in the
      device's "Net Check" network-diagnostic feature, reachable via the /setting endpoint: the cmdPing Socket.io
      event accepts attacker-supplied input and passes it to the underlying OS shell without sanitisation, so a
      remote, unauthenticated attacker can inject and execute arbitrary OS commands with root privileges — full
      device takeover with no authentication and no user interaction (CVSS vector AV:N/AC:L/PR:N/UI:N/S:C, all three
      impact metrics High). Haiwell (headquartered in China) markets the IoT Cloud HMI Gateway into energy, critical
      manufacturing, and water-and-wastewater deployments worldwide — CISA lists exactly those three sectors as the
      affected Critical Infrastructure Sectors. Reported to CISA by researcher Fiqram Akmal; CISA's advisory states
      "No known public exploitation specifically targeting this vulnerability has been reported to CISA at this
      time." The advisory carries no version-based remediation statement (no "fixed in version X" language) — only
      the standard ICS network-segmentation guidance (isolate from the internet, place behind firewalls, use VPN
      for remote access) — so treat this as effectively unpatched pending vendor confirmation.
    region_nexus: "global; CISA explicitly lists Energy and Water and Wastewater as affected Critical Infrastructure Sectors — direct overlap with this constituency's additional-sector coverage"
