  - title: "Langflow: unauthenticated webhook flow execution, a weak-PRNG credential-encryption key, and a decorator-triggered RCE in code validation — three new advisories on top of the already-tracked KEV entry"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2828", publisher: "BSI Germany — CERT-Bund (WID-SEC-2026-2828)", date: "2026-08-13", role: "primary" }
      - { url: "https://github.com/langflow-ai/langflow/security/advisories/GHSA-cf6m-vc3m-7cgm", publisher: "Langflow (GitHub Security Advisory GHSA-cf6m-vc3m-7cgm)", date: "2026-08-12", role: "primary" }
      - { url: "https://github.com/langflow-ai/langflow/security/advisories/GHSA-jxw3-mjmx-3pqm", publisher: "Langflow (GitHub Security Advisory GHSA-jxw3-mjmx-3pqm)", date: "2026-08-12", role: "primary" }
      - { url: "https://github.com/langflow-ai/langflow/security/advisories/GHSA-w584-2h2r-2hvf", publisher: "Langflow (GitHub Security Advisory GHSA-w584-2h2r-2hvf)", date: "2026-08-12", role: "primary" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss → WID-SEC-2026-2828 detail, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2828 → primary: Langflow GitHub Security Advisories, URL https://github.com/langflow-ai/langflow/security/advisories/GHSA-cf6m-vc3m-7cgm ; https://github.com/langflow-ai/langflow/security/advisories/GHSA-jxw3-mjmx-3pqm ; https://github.com/langflow-ai/langflow/security/advisories/GHSA-w584-2h2r-2hvf"
    summary: |
      BSI's CERT-Bund WID-SEC feed republished (2026-08-13, underlying release 2026-08-12) three new Langflow
      GitHub Security Advisories, distinct root causes from the already-tracked CVE-2026-9198 auto-login/validate-code
      KEV entry (2026-08-05). GHSA-cf6m-vc3m-7cgm: Langflow's webhook path (`AuthService.get_webhook_user` in
      src/backend/base/langflow/services/auth/service.py) skips API-key validation entirely whenever the
      WEBHOOK_AUTH_ENABLE setting is False — which was the default from v1.7.0 through v1.9.0 — so any remote,
      unauthenticated caller who knows a flow's UUID can POST to /api/v1/webhook/<flow_id> and execute that flow
      as its owner, reaching RCE through flow components that run arbitrary Python. Fixed in v1.9.1 by flipping the
      default to True. GHSA-jxw3-mjmx-3pqm (CVSS 9.1 Critical, CWE-338/321/311): Langflow derives its Fernet
      credential-encryption key either by seeding Python's non-cryptographic Mersenne-Twister `random` module with
      the SECRET_KEY (when under 32 characters) or by using the raw SECRET_KEY bytes directly (when 32+ characters)
      — both branches are fully reproducible once an attacker obtains the secret_key file (readable via a related
      MCP path-traversal bug, GHSA-95rw-c7w3-xh7f), letting every stored LLM-provider API key, DB credential and
      OAuth token be decrypted offline with zero brute force. Fixed in v1.10.1 by switching to a SHA-256 derivation.
      GHSA-w584-2h2r-2hvf: the /api/v1/validate/code endpoint (src/lfx/src/lfx/custom/validate.py) compiles and
      execs submitted ast.FunctionDef nodes to surface syntax errors, but Python evaluates function decorators at
      definition time — so any authenticated caller (or any caller under AUTO_LOGIN) can submit a function decorated
      with a malicious lambda to get code execution in the server process before the function body would ever run;
      the endpoint was fully unauthenticated before v1.7.2. Fixed in v1.10.1 by compiling without exec. This is the
      fourth/fifth/sixth distinct pre-auth-adjacent code-execution or credential-exposure path disclosed in Langflow
      this cycle, reinforcing the prior assessment that the product's whole unauthenticated surface, not one CVE,
      needs remediating.
    region_nexus: "global open-source AI-orchestration tool; used by public-sector and enterprise teams building LLM-integration pipelines, including in EU/CH public administration AI pilots"
