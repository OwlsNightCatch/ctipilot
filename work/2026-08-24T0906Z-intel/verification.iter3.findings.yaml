  item: "WordPress 7.0.4 / CVE-2026-65640 — Imagick/Ghostscript RCE"
  url_or_quote: "https://www.securityweek.com/wordpress-7-0-4-patches-remote-code-execution-vulnerability/"
  summary: "In-window (SecurityWeek, 13 August 2026, Ionut Arghire — I fetched it) and absent from the run and from the run record's documented drops, so a silent omission rather than a recorded decision. WordPress 7.0.4 fixes CVE-2026-65640, CVSS 8.8, exploitable by an Author-level user or higher via malicious PostScript files where Imagick and Ghostscript are installed, with the fix backported to all branches back to 4.7; no exploitation reported. The gate case is arguable — it is post-auth with a component precondition — but WordPress Core is a live thread in this store with a direct home-region nexus (2026-08-08 NCSC-CH WP2Shell compromises of Swiss websites, 2026-08-10 XSS2Shell CVE-2026-64638, 2026-08-10 wp2root), the run's own cited source published it, and the backport range implies a very wide affected base. Either publish it short or record it as a considered drop in the run record. Search: 'WordPress 7.0.4 CVE-2026-65640 Imagick Ghostscript'."
