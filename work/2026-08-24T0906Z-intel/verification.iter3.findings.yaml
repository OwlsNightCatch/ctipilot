- code: F8
  category: needs-more-research
  section: trending-vulnerabilities
  item: "2026-08-14/ncsc-uk-bitlocker-pin-winre-fallback-controls"
  url_or_quote: "three named alternatives cover the devices that cannot take one / NCSC UK ... gives three alternatives with different trust models rather than leaving those endpoints uncovered"
  summary: "The cited NCSC UK page (fetched) lists FOUR headed mitigation techniques under 'What if I can't use a PIN?': Use the same PIN, Use Network Unlock, Create a Startup Key, and 'Conditional access' — 'Finally, if there is no way to add pre-boot authentication to your device, consider how you are going to manage that additional risk. For example, you may wish to use conditional access policies to prevent these high-risk devices from accessing sensitive resources.' The entry drops the fourth entirely, and the source's own framing contradicts the claim that the three 'cover' the devices that cannot take a PIN — conditional access exists precisely for the residue. For a public-administration laptop estate with a long exception list this is the most directly actionable lever in the guidance. Add it and correct the count/framing."
