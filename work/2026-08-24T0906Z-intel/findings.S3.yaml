        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/"
    extended_notes: |
      Talos found JWR shares no code-level implementation with three other Chinese-language PhaaS kits (Lucid, Darcula, Lighthouse) — independently engineered C2 protocol, encryption module and message envelope — but all four share the behavioral signature defining this PhaaS lineage: live operator puppeteering, card capture paired with OTP/2FA interception, and multi-brand templating at scale. Detection angle for defenders: the live-streaming, per-keystroke exfiltration model means static form-submission monitoring won't catch it — the WebSocket/long-poll C2 channel and the 44-page templated flow are the more durable telemetry hooks (web proxy/DNS visibility into the phishing domain's WebSocket handshake, and browser telemetry for pages requesting persistent WebSocket connections from a checkout-styled page).

  - title: "Armored Likho deploys Still Toolkit: Rust Telegram-session stealer plus VAD-triggered audio surveillance, with a GitHub dead-drop C2 fallback"
    sources:
      - { url: "https://securelist.com/armored-likho-still-toolkit/121033/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: S3 major-labs sweep of kaspersky-securelist, URL https://securelist.com/feed/ (feed item published Thu, 13 Aug 2026 08:00:15 +0000) → primary: Kaspersky Securelist (GReAT), URL https://securelist.com/armored-likho-still-toolkit/121033/ (no pivot needed — vendor's own first-hand malware analysis)"
    summary: |
      Kaspersky GReAT documents a new Armored Likho (aka Eagle Werewolf) campaign distributing a dropper — written in Rust on the Tauri framework — disguised as a Russian charitable-donation app with a working, deceptive item catalog pulled from orderapiserver[.]info. While the victim browses the fake catalog, the dropper silently decrypts and launches a newly identified two-component cyber-espionage kit, the "Still Toolkit." Still Sync is a Tokio-based Rust stealer that talks to its C2 over gRPC serialized with FlatBuffers (HTTP or HTTPS depending on the configured C2 URL), registers the host via a SHA-256 "sysmarker" hash of motherboard serial/CPU ID/system UUID/BIOS serial/domain name, and — beyond simply stealing the Telegram Desktop or Microsoft Store tdata session folder — can authenticate to the Telegram API using the stolen session to pull the account's username, full chat/group/channel membership lists, dialogs, and media files under 250MB; when direct file access is blocked it falls back to SeBackupPrivilege abuse (CreateFileW with FILE_FLAG_BACKUP_SEMANTICS, Volume Shadow Copy, or Robocopy backup mode). Still Audio is a companion Rust implant that performs real-time voice-activity detection using a self-implemented Root-Mean-Square algorithm against raw audio samples (default threshold ~0.2, ~7ms silence-to-stop at 44.1kHz), records to a pre-buffer to avoid clipping the start of speech, encodes with a bundled libmp3lame.dll, and exfiltrates over the same gRPC channel — making no attempt to hide the microphone use (it appears in Windows' own "apps using the microphone" list as "Intel Audio"). Still Audio's C2-address resolution falls back to a Dead-Drop Resolver: if its primary server is unreachable for three days, it pulls a Base64-encoded, Blowfish-ECB-encrypted C2 URL from a forked GitHub repository, using the identical algorithm and hardcoded key GReAT previously observed in the group's AquilaRAT samples. GReAT attributes the campaign to Armored Likho with high confidence based on identical dropper/Tauri architecture, matching ICRYPTMP payload header and multi-part encryption format, the shared Dead Drop Resolver key, identical sysmarker-generation logic (down to matching PowerShell commands), and infrastructure overlap (shared hosting ASNs 149440/202448/215311 and consistent Windows-service-mimicking domain naming) with the group's documented February 2026 campaign. Victims are primarily private individuals in Russia, with corporate, government, IT and educational-sector victims also affected.
    region_nexus: "Russia-domestic targeting (victimology: private individuals, plus corporate, government, IT and educational-sector organisations inside Russia); no confirmed Swiss/European victim — included for the transferable technique class (Dead Drop Resolver via a public code-hosting service, gRPC/FlatBuffers C2 architecture, self-implemented VAD-based audio surveillance) rather than direct regional nexus"
    primary_sector_nexus: "none direct — technique-class relevance only"
    sector: "government, IT, education (Russia-domestic victimology)"
    cves: []
    techniques: [T1123, T1102.001, T1005, T1071.001, T1204.002, T1027]
    affected_products: []
    entity_keys: ["actor:armored-likho"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "we found a new cyber-espionage toolkit – the Still Toolkit – made up of two components: Still Sync and Still Audio."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/armored-likho-still-toolkit/121033/"
      - quote: "Still Audio also uses the Dead Drop Resolver technique as a fallback mechanism for obtaining the C2 address. If the current server stays unreachable for three days, the tool tries to pull the current C2 URL from a GitHub repository."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/armored-likho-still-toolkit/121033/"
      - quote: "Based on these overlaps, along with additional technical artifacts, we're highly confident the Armored Likho group is behind the campaign."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/armored-likho-still-toolkit/121033/"
    extended_notes: |
      Detection angle: Still Audio deliberately does not hide from the OS microphone-usage indicator (shows as "Intel Audio"), which is a discriminator a hunt team can use directly — legitimate audio/communication apps rarely masquerade under a generic chipset-vendor process name while running as a background Windows service (auxhost). The Dead Drop Resolver technique (encrypted C2 address parked in a forked public GitHub repo, decrypted client-side) is a durable hunting signal: outbound requests to raw.githubusercontent.com from a non-developer host fetching a JSON file is anomalous and worth alerting on independent of this specific campaign's infrastructure.

  - title: "ANNUAL REPORT — Check Point State of Ransomware Q2 2026: active-group count hits a new high as concentration loosens, and a leaked chat log gives first-party proof of a RaaS panel built by AI in three days"
    sources:
      - { url: "https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/", publisher: "Check Point Research", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: S3 major-labs sweep of checkpoint-research, URL https://research.checkpoint.com/feed/ (feed item published Thu, 13 Aug 2026 12:54:35 +0000) → primary: Check Point Research, URL https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/ (no pivot needed — vendor's own quarterly telemetry report)"
    summary: |
      Check Point Research's quarterly State of Ransomware report for Q2 2026 (a periodic/quarterly report, flagged per the required convention) shows the ransomware ecosystem's concentration loosening even as overall damage holds steady: the top 10 groups accounted for 57.6% of leak-site victims, down from 71% in Q1, while the number of active groups climbed from 71 to 93 — a new high for the tracked period. Leak-site victim counts held flat quarter-over-quarter at 2,139 (+0.8%) but are up 33% year-over-year. Qilin remained the most prolific single operator for a fourth straight quarter with 279 victims (down 17% from Q1), while The Gentlemen surged 62% to 269 victims and actually outpaced Qilin during June alone. An internal leak of The Gentlemen's own chat logs and affiliate-platform data exposed a core team of roughly nine operators supported by a broader affiliate base, and — the report's most concrete technical finding — confirmed the group used AI coding assistants to build its ransomware management panel in about three days, which Check Point frames as first-party evidence of AI materially accelerating malicious-tooling development rather than a claim inferred from indirect signals. Ransom-payment rates fell to a multi-year low near 23%, continuing a six-year decline from 85% in 2019, though on-chain ransomware payments still exceeded $820 million in 2025 and the payer market is bifurcating (rising average payments alongside a falling median — large enterprises still paying heavily while the mid-market increasingly holds firm). Q2 law-enforcement actions concentrated on shared criminal infrastructure rather than individual groups: a cryptocurrency-laundering platform takedown, sanctions against major Iranian digital-asset exchanges, dismantling of a malware code-signing service used by multiple RaaS operators, and disruption of infostealer and VPN-anonymization networks several groups depend on jointly. Geographically, the US share of victims fell from 50% to 42% quarter-over-quarter, driven by the fastest-growing groups (The Gentlemen and newly active Krybit) targeting the US less than the ecosystem average. Check Point also reports the exploitation window continuing to narrow, citing AI as an accelerant — vulnerabilities are now being weaponized within hours to days of disclosure.
    region_nexus: "global ransomware-ecosystem trend report; the narrowing exploitation window and the geographic diversification away from the US (with faster-growing groups already less US-centric) are directly relevant to European/Swiss exposure planning"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (ransomware ecosystem trends)"
    cves: []
    techniques: [T1587.001]
    affected_products: []
    entity_keys: ["actor:qilin", "actor:thegentlemen"]
    new_entities:
      - { key: "report:check-point-state-of-ransomware-q2-2026", type: report, name: "Check Point State of Ransomware Q2 2026", aliases: [],
