items:
  - title: "JWR phishing framework: live operator-puppeteered PhaaS impersonates Shopify/PayPal/Apple/Klarna checkouts, likely an Outsider PhaaS variant"
    sources:
      - { url: "https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/", publisher: "Cisco Talos", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: S3 major-labs sweep of talos, URL https://blog.talosintelligence.com/rss/ (feed item published Thu, 13 Aug 2026 10:00:35 GMT) → primary: Cisco Talos, URL https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/ (no pivot needed — vendor's own first-hand research; WebSearch (\"Talos JWR phishing framework Outsider PhaaS\") checked for independent corroboration, surfaced only a malware.news repost of the same Talos content and unrelated PhaaS stories — no independent second source found)"
    summary: |
      Cisco Talos identified an undocumented phishing-as-a-service (PhaaS) client engine, internally branded "JWR" by its developer, that impersonates checkout and login flows for Shopify, PayPal, Apple, Klarna and unnamed banks. Unlike a static credential-harvesting page, the client keeps an AES-CTR-encrypted WebSocket open to the operator's C2 for the session's duration, streaming victim keystrokes character-by-character (partial card numbers, partial passwords, partial OTPs) before submission, so the operator can decide the next step before the victim even hits submit. The architecture splits into a Host Bridge module (an IIFE that relays commands into a phishing iframe styled as the legitimate checkout/login page) and a Vue.js "Content Mode" application that renders across 44 HTML pages and executes more than 40 distinct operator instructions (e.g., to_card, to_sms, to_2fa, to_pin, to_app, tip_fail/tip_change_card to force a second card, updata_2fa to silently inject an operator-supplied OTP). Data exfiltration covers a "cvvform" object spanning full PAN/CVV/PIN/expiry, SSN, passport/driver's-license images, up to three sets of website credentials, PayPal login, and a full device/browser fingerprint, POSTed once the operator closes the session to the endpoint api/open/the_final_interface; five REST endpoints back an HTTP long-poll fallback (api/open/pollInstruction) when the WebSocket is blocked. The client includes an anti-analysis self-referential .toString().search() debugger-detection check and decoy variables to defeat static analysis; operator-facing status strings are hardcoded in Simplified Chinese. Talos assesses with medium confidence that JWR is a variant of "The Outsider," a Chinese-speaking PhaaS platform whose FBI/Google-led "Ghost Hook" takedown Talos notes occurred in June 2026 — consistent with other operators reusing or forking the leaked/sold Outsider kit. The observed real-world campaign delivered the JWR client via SMS smishing lures impersonating road-toll authorities, postal/courier services and an electronic toll system across Singapore, the UAE and Southeast Asia. Talos published ClamAV (Js.Phishing.JwrFramework-10060456-0) and Snort2/3 SIDs (66924–66928) coverage.
    region_nexus: "Southeast Asia / Middle East observed campaign (Singapore road-toll, UAE e-toll, regional courier lures); the underlying Chinese-speaking PhaaS lineage (Outsider, Lucid, Darcula, Lighthouse) has previously targeted European and Swiss financial-services customers, so the technique class is directly transferable to this constituency's finance/retail defenders even without a confirmed local victim in this specific campaign"
    primary_sector_nexus: "indirect"
    sector: "finance, retail/e-commerce"
