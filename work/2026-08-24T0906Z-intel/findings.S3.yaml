      This is a quarterly, not annual, report — flagged with the "ANNUAL REPORT" convention per the domain mission's instruction to flag any newly published periodic report. Note for a future deep-dive: the report states vulnerabilities are "now being weaponized within hours to days of disclosure" as an AI-driven trend, which is a recurring theme this pipeline has tracked from several other vendors this window (CrowdStrike's 2026 Threat Hunting Report on 88% exploitation inside 48 hours, already covered 2026-08-04) — corroborating rather than novel on that specific point, but the AI-assisted RaaS-panel-development finding (from a leaked chat log, not vendor inference) is the new, concrete data point.

