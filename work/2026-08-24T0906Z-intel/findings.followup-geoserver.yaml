    extended_notes: |
      Verification/analytic notes for the composer:

      - No CVE assigned as of this research. IMPORTANT: a WebSearch query synthesis during
        this research asserted "CVE-2026-58231" was assigned to this GeoServer issue. This is
        WRONG and was independently disproven: CVE-2026-58231 is an unrelated SAP Commerce
        Cloud vulnerability (confirmed via a separate WebSearch that surfaced multiple SAP-
        specific sources — The Hacker News, CSO Online Patch Tuesday coverage, SecurityWeek —
        describing CVE-2026-58231 as an improper-authorization flaw in SAP Commerce Cloud
        2211/2211-JDK21, patched in 2211.55/2211-jdk21.17). Do NOT carry CVE-2026-58231 into
        the entry. This is flagged here specifically so the main agent/verifier does not
        rediscover the same hallucinated mapping via its own search pass.
      - CISA KEV catalogue checked in full via `python3 tools/fetch_source.py cisa-kev` —
        confirmed GeoServer's two existing KEV entries (CVE-2024-36401, CVE-2025-58360) but
        NO new entry for this issue.
      - watchTowr Labs' own blog (labs.watchtowr.com, RSS checked directly, 10 most recent
        items reviewed) has NOT published a post on this issue as of the fetch — the
        attributed observations come from direct statements to two news outlets (a company
        comment, not a research write-up), which lowers the corroboration tier for the
        exploitation-attempt figures specifically (single-vendor claim, self-reported, not an
        independently reviewable telemetry methodology). Confidence set to MEDIUM primarily
        for this reason — the vulnerability's existence and unpatched/no-CVE status are firm
        (multiple independent primaries including the discloser's own post), but the
        "hundreds of attempts / small pool of IPs" scanning-volume claim rests on one vendor's
        unpublished, self-reported telemetry relayed only through press statements.
      - The mhtsec PostgreSQL-RCE PoC repository could not be confirmed as directly connected
        to the same Aug 12 disclosure by any primary source (no cross-reference from the
        discloser, watchTowr, or GeoServer to that specific repo was found) — it targets the
        same function name in a different DBMS context (PostgreSQL/PostGIS vs. the reporting's
        Microsoft SQL Server focus) and its precondition detail was obtained via WebFetch
        summarization of the GitHub README (not independently byte-verified against raw HTML,
        since direct/bridge fetch of that repo 403'd and jina credit was exhausted). Treat this
        specific angle as corroborating context on the technique class (SQLi-to-RCE via
        jsonArrayContains gated by DB privilege) rather than a confirmed detail of the exact
        in-the-wild exploitation observed by watchTowr.
      - Exact affected/patched version range is UNCONFIRMED by any primary source — this is a
        genuine gap, not an omission. State this plainly in the entry rather than inferring a
        version range from the 2023 GHSA (which covers a different DataStore combination and
        was patched in 2.18.7–2.22.2, versions now largely superseded by the current 2.28.x/
        3.0.x lines).
      - No independent scanning/telemetry corroboration (Shadowserver, GreyNoise, etc.) found
        in this research window for the exploitation-attempt volume; only watchTowr's
        self-reported figures via two press outlets.
