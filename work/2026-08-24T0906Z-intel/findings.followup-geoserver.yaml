    summary: |
      An unauthenticated SQL-injection vulnerability in GeoServer's jsonArrayContains
      function was disclosed by a researcher using the handle @q1uf3ng on X at 10:46 UTC on
      2026-08-12, with no CVE identifier assigned and no vendor patch available as of this
      research (2026-08-14). The discloser's own post (fetched directly, original Chinese
      text confirmed) states plainly: "GeoServer jsonArrayContains 未授权 SQL 注入 数据库sa的情况下理所当然的可以rce"
      — i.e. unauthenticated SQL injection via jsonArrayContains, escalating "naturally" to RCE
      when the backing database account is the SQL Server "sa" (system administrator) login.
      This is the load-bearing precondition: the SQL injection itself requires no
      authentication to GeoServer, but code execution is contingent on the database
      account GeoServer connects with holding administrative privileges — reporting
      specifically names Microsoft SQL Server's "sa" account, which by default grants the
      ability to invoke OS command execution (xp_cmdshell-class functionality) from within
      SQL. A separate, independently published proof-of-concept research repository
      (mhtsec/GeoServer-jsonArrayContains-PG-RCE) documents a related SQL-injection-to-RCE
      chain through the same function against PostgreSQL/PostGIS datastores, explicitly
      caveating it is "not an arbitrary GeoServer RCE" and requires PostgreSQL 12+,
      JSON-capable attributes, stacked-statement execution support, and elevated database
      role privileges — indicating the exploitation path generalizes across DBMS backends
      but always gates on backend account privilege, not on GeoServer's own auth. CSO Online
      separately reports "another user confirmed on X that they were able to reproduce the
      flaw in a non-default configuration" — a second-hand, unverified reproduction claim,
      not corroborated by any primary technical write-up.

      watchTowr (a threat-exposure-management vendor) told both The Hacker News ("in a
      statement") and CSO Online ("via email") that it began observing exploitation attempts
      within hours of the public disclosure, recording hundreds of attempts from a small pool
      of source IP addresses; Jake Knott (watchTowr, principal security researcher) states the
      observed activity is presently reconnaissance/fingerprinting — "triggering errors and not
      proceeding further" — rather than payload delivery, but flags that GeoServer "has a track
      record of being targeted and exploited at scale, with multiple vulnerabilities listed in
      CISA's Known Exploited Vulnerabilities catalog" (CVE-2024-36401, added to KEV 2024-07-15,
      and CVE-2025-58360, added 2025-12-11, both independently confirmed present on the current
      KEV catalogue in this research). No independent telemetry source (e.g. Shadowserver,
      GreyNoise, an ISP/CDN scanning-visibility report) was reachable in this research window to
      corroborate watchTowr's attempt counts; the "hundreds of attempts / small pool of IPs"
      figure is a single-vendor claim, presented as such.

      As of this research, GeoServer's own project blog (geoserver.org/blog/, fetched directly)
      carries no advisory addressing this issue — its most recent post is the GeoServer 3.0.0
      release announcement (2026-06-11), which itself documents four unrelated CVEs
      (CVE-2025-27511, CVE-2025-58175, CVE-2025-52465, CVE-2024-45747) fixed in that release.
      GeoServer's practice, per that post, is to pair CVE assignment with the fix ("The use of
      the CVE system allows the GeoServer team to reach a wider audience than blog posts") —
      consistent with no CVE yet existing for an unpatched issue. No entry for this
      vulnerability exists in the CISA KEV catalogue (checked via the bridge fetcher against
      the full current catalogue). A WebSearch-generated summary during this research
      surfaced an unverified claim that "CVE-2026-58231" had been assigned to this GeoServer
      flaw; direct verification shows CVE-2026-58231 is an unrelated SAP Commerce Cloud
      improper-authorization vulnerability (CVSS 10.0, patched in SAP Commerce Cloud
      2211.55 / 2211-jdk21.17) — the search summarizer conflated two unrelated same-day
      stories. No CVE has been verified assigned to the GeoServer jsonArrayContains issue.

      The jsonArrayContains function has a documented SQL-injection history: GHSA-7g5f-wrx8-5ccf
      (CVE-2023-25157, CVSS 9.8) fixed a jsonArrayContains injection reachable "when used with a
      String or JSON field and with a PostGIS or Oracle DataStore (GeoServer 2.22.0+ only)",
      patched in GeoServer 2.21.4, 2.22.2, 2.20.7, 2.19.7 and 2.18.7 — a different DBMS/DataStore
      combination than the Microsoft SQL Server path being exploited now, meaning the 2023 fix
      evidently did not close the code path currently under attack. GeoServer's currently
      maintained release lines are 2.28.x (stable support ended April 2026, full EOL September
      2026) and 3.0.x (extended support to April 2027); no primary source in this research
      states which of these lines, or which specific version boundary, is affected by the new
      issue — that remains unconfirmed pending a vendor advisory.

      No advisory from NCSC-CH, GovCERT.ch, BSI CERT-Bund (WID feed), CERT-FR, CERT-EU, or
      NCSC-NL was found in this research window (checked directly against each authority's
      structured feed/API) — a gap worth flagging given GeoServer's use in Swiss and European
      public-sector geodata portals (cadastral, environmental, and INSPIRE-directive mapping
      services commonly run on GeoServer).
