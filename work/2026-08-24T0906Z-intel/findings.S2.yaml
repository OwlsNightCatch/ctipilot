items:
  - title: "NCSC-UK guidance ties mandatory BitLocker PIN to the WinRE bypass class behind YellowKey, and names the fallback controls when a PIN cannot be enforced"
    sources:
      - { url: "https://www.ncsc.gov.uk/blogs/how-bitlocker-pins-help-protect-your-data-and-devices", publisher: "NCSC UK", date: "2026-08-13", role: primary }
      - { url: "https://techcommunity.microsoft.com/blog/microsoft-security-blog/bitunlocker-leveraging-windows-recovery-to-extract-bitlocker-secrets/4442806", publisher: "Microsoft Security Blog (via NCSC-UK reference)", date: "2025", role: corroborating }
      - { url: "https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/", publisher: "BleepingComputer (via NCSC-UK reference)", date: "2026", role: corroborating }
    discovery_trace: "first seen at: ncsc-uk, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml -> primary: NCSC UK blog, URL https://www.ncsc.gov.uk/blogs/how-bitlocker-pins-help-protect-your-data-and-devices (no further pivot needed; outbound references to Microsoft techcommunity and BleepingComputer fetched from within the same post)"
    summary: |
      NCSC-UK published hardening guidance responding to the public disclosure series around "YellowKey"
      (CVE-2026-45585, disclosed by the pseudonymous researcher persona tracked in this pipeline as
      Nightmare Eclipse / Chaotic Eclipse), which used the Windows Recovery Environment (WinRE) to bypass
      certain BitLocker configurations and potentially decrypt drives that should have been protected.
      NCSC-UK is explicit that this is not a novel bug class: WinRE deliberately ships unencrypted, because
      it exists to recover data when BitLocker itself has failed, and that design tension means WinRE-based
      bypasses of BitLocker have recurred for years — Microsoft found and patched four similar bugs in 2025,
      presented at BlackHat with an accompanying technical write-up on the mechanism ("BitUnlocker" post,
      referenced in NCSC-UK's own post). The guidance's core recommendation, already NCSC baseline advice but
      restated with this incident as the trigger, is to configure BitLocker to require a PIN before decryption
      (pre-boot authentication) — this closes the WinRE gap because the daemon/environment cannot reach the
      volume without the user authenticating first, regardless of which specific WinRE bug is current. Where
      mandatory PIN entry is impractical (hot-desked shared devices, time-critical emergency equipment,
      unattended-boot devices in hazardous environments), NCSC-UK names three fallback mitigations with
      different trust models: using the same PIN as Windows Hello (reduces user friction, not for shared
      devices), BitLocker Network Unlock (skips the PIN prompt only while the device is on a trusted corporate
      network, reverting to PIN prompt off-network), and Startup Keys (USB-based pre-boot authentication).
      No new CVE is disclosed in this post; it is defensive guidance keyed to a technique class (WinRE-based
      FDE bypass) rather than a single patch.
