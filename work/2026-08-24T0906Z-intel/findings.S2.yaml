    extended_notes: |
      Prior coverage: this pipeline has tracked the wider Nightmare Eclipse / Chaotic Eclipse Windows
      zero-day drop series (GreatXML, RoguePlanet, LegacyHive, ShieldBreak) but had not yet carried a
      standalone item on YellowKey / CVE-2026-45585 itself; NCSC-CH's own "Nightmare Eclipse" advisory
      (security-hub post 12622, last edited 2026-08-12) lists YellowKey only in passing as one line in a
      running list, with no defender-facing mitigation detail — the NCSC-UK post is the first source in this
      run's window to name the concrete hardening lever (mandatory PIN vs. Network Unlock vs. Startup Key
      trade-offs) rather than just the patch status. Confidence held at MEDIUM rather than HIGH because the
      post itself carries no new incident/exploitation data — it is authoritative defensive guidance on an
      already-patched, already-disclosed vulnerability class, not a new finding of compromise.
