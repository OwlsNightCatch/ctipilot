claims:
  - {claim_id: f30f67cb82, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Update every technician's ScreenConnect host client to 26.6.5 or later ... Updating the server alone doesn't fix this; CW: deselect the TransferFiles permission (Administration > Security > Roles)"}
  - {claim_id: b4b4257ffc, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "the Huntress SOC made strong recommendations that these affected hosts be reimaged from known-good media; UltraViewer, Quick Assist: secondary RMM tools"}
  - {claim_id: 2f1179ef31, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "A full compromise in 9 seconds: 16:46:20.7 host client runs guest-pushed update_224ac089.bat ... 16:46:29.1 rebranded client connected to relay; rotate RMM, PSA, ScreenConnect, vault, customer admin"}
  - {claim_id: 078df8b95e, verdict: ok, source_url: "https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869", passage: "file-transfer actions could be processed through an active remote session without proper authorization or Host confirmation ... including through elevated execution actions"}
  - {claim_id: 7a8cc679e6, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "011 branch also includes payloads to disable Windows Defender reporting, notifications, and HVCI ... The package also includes the vulnerable WinRing0 driver as svcdrv64.sys (not bound to HVCI)"}
  - {claim_id: eac01247ef, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "Connecting to an infected ScreenConnect client can cause the server-side Host system to receive and execute the same four-stage VBScript chain"}
  - {claim_id: 7deccc6ce1, verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "CVE-2026-84869 \"dateAdded\": \"2026-09-11\" (catalogVersion 2026.11.13 read live); no source in the entry names an actor"}
  - {claim_id: fdbe60cda3, verdict: ok, source_url: "https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869", passage: "ScreenConnect servers are not impacted; CWE-862, CWE-269; 9.9 (Critical); Upgrade to ScreenConnect version 26.6.5 or later; ScreenConnect versions prior to 26.6.5"}
  - {claim_id: 3491a80055, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "First August 20 Incident (Quick Assist, rogue ScreenConnect client); ConnectWise disclosure dated September 8, 2026 = 19 days later"}
  - {claim_id: 5d8943aba8, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "August 20: Quick Assist social engineering; second August 20 incident: phishing-led ScreenConnect.ClientSetup.msi, client launched wscript.exe four times for 1.vbs to 4.vbs"}
  - {claim_id: 1f46a8054b, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "enumerates RAM (over 5GB) and security products; 2.vbs downloads a file from Dropbox; AES decryption key appended to the URL in map.txt"}
  - {claim_id: 3625686b0e, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "wstunnel, disguised as Themes.exe ... runs an XMRig cryptocurrency miner renamed as SearchIndex.exe"}
  - {claim_id: 6ddc069a14, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "recovered client continuously inspects ScreenConnect's EndPointStatusMessage.Connections collection and filters for newly observed Host sessions ... file-transfer message, sets its action to Run"}
  - {claim_id: 122f067de2, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Update every technician's host client to 26.6.5 or later ... many technicians were still on 22.x, 24.2 and 25.8 clients weeks after the fix shipped; 11-16 post also ties MSP chain risk"}
  - {claim_id: 0fa454cf0d, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "whenever it observed a new Host connection, it reads those files ... creates the message ... queues it for the connected Host; wscript.exe launched four times to run the VBS files"}
  - {claim_id: 528f17fdad, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "This most recent activity is distinct from a separate campaign ... crypto exchange names; SCKit ... not directly exploiting CVE-2026-84869"}
  - {claim_id: 8c3f040235, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "November 12 ... join a blank-named Access session; 16:46:20.7 batch file run ... curl, msiexec /a, 16:46:29.1 WindowsUpdate.WindowsClient.exe connected (p=8041)"}
  - {claim_id: 2e99051948, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Across 42 MSP ScreenConnect servers between October 20 and November 16, attacker guests made 688,000 'run file' requests ... from 29 source IP addresses; high confidence same operator"}
  - {claim_id: 1ed246de05, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "In three real support sessions ... an attacker joined as an additional guest ... Two of the technicians were on vulnerable Windows clients while the third used the Mac client, where the path failed"}
  - {claim_id: 5feaf64aad, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Updating the server alone doesn't fix this, because the vulnerable code runs on the technician's machine ... many technicians were still on 22.x, 24.2 and 25.8 clients weeks after the fix shipped"}
  - {claim_id: 349112b16e, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "App_Data\\Session.db, work on a copy: RanFiles (EventType 85) or SentFiles (86) ... Host connection open; client running .bat/.cmd from Temp; relay that isn't yours"}
  - {claim_id: 33e0a7c508, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Nov 12 chain 16:46:20.7 to 16:46:29.1 (9 s); 688,000 requests across 42 servers October 20 to November 16; server update alone does not fix it; 26.6.5 or later"}
