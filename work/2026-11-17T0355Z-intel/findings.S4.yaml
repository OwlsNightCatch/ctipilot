    discovery_trace: "first seen at: infostealers-hudson-rock, feed https://www.infostealers.com/feed/ (item dated 2026-11-16 21:54 UTC) → drilled article https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/ → pivot: discoverer Amirul Cyber, URL https://amirulcyber.com/2026/11/16/optimjack-optimizely-skimmer/ → pivot: Kirk/Ohey (iOS branch), URL https://ohey.ca/threats/ios-exploits/darksword/ and https://ohey.ca/research/darksword-router-ios-26-c10/ → pivot: urlscan record of the Swiss capture, URL https://urlscan.io/result/01a1d818-b73d-71cc-956d-29ebe10eb3ff/ → primary (researcher write-ups plus the public scan archive; no vendor statement exists yet)"
    summary: |
      Facts (Hudson Rock, which says it retrieved the files as data, executed nothing and matched all 16 archived vendor-response hashes across 15 captures): malicious code sits "inside responses served from third-party providers' own script and widget endpoints" of four providers. Eight Optimizely customer project files (BBC, Zoom, GitLab marketing site, HSBC UAE, Hootsuite, Virgin Media O2, Stamps.com, Tricentis) and the minute-ly loader were recovered directly; Kissmetrics' shared i.js and StorifyMe's shared web component were captured poisoned from 13 November. Hudson Rock names 21 web properties in all, among them CNN, Fox News, Salesforce, FAZ and the University of Basel; none of it counts victims. The initial access to each provider, the operator and the visitor count are unknown, and no provider statement was found.
      Behaviour (Hudson Rock, Amirul Cyber, Ohey): the injected loader adds a script element for a stealer that swaps copied or pasted cryptocurrency addresses in the DOM, clipboard API calls and request bodies, skims card number, expiry and CVV from form and fetch/XHR POST bodies (sendBeacon), and conditionally sends readable cookies plus a page screenshot. The BBC and HSBC UAE files also embed a 24 KB fallback copy that runs when the remote fetch fails or takes more than 2.5 seconds, so blocking the attacker host does not stop the clipper. On iPhones and iPads it additionally loads a mobile router whose routing, per Ohey, sends iOS 13-17 to a Coruna stage, iOS 18-25 to a DarkSword entry and iOS 26 to a chain Ohey's own capture labels not weaponised. Ohey states DarkSword attacks iOS 18.4 to 18.7.2 through Safari and that an iOS 18.6 capture fetched every DarkSword stage. Hudson Rock stresses these are delivery observations, not demonstrated compromises. Ohey dates the vendor-script wave from 13 November and says GitLab's, Zoom's and minute-ly's files still carried it at 21:10 UTC on 16 November and a further variant was still present on 17 November.
      Swiss nexus: the urlscan record of unibas.ch (scanned 2026-11-14 03:27 UTC from CH) shows www.unibas.ch loading the StorifyMe web component, which requested a second script that requested a roughly week-old host; urlscan gave no verdict and the response bodies were not read by us, the poisoning of that widget response is Kirk's and Hudson Rock's reading of the archived hash. Whether Swiss federal, cantonal or communal sites load the four vendors' scripts is not stated by any source.
    region_nexus: "global; direct Swiss nexus: the University of Basel public site loaded a poisoned StorifyMe web component on 2026-11-14 (urlscan archive, Hudson Rock table); German (FAZ) and UK sites also named"
    primary_sector_nexus: "direct (Swiss public institution observed) plus transferable exposure for any Swiss public-sector site or e-government portal embedding these vendors' scripts, and for staff iPhones in the DarkSword and Coruna version ranges"
