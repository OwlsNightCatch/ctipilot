    extended_notes: |
      Suggested classification C2 (both outlets are C-reliability breach trackers, but each obtained the victim's written reply; the incident is confirmed, the data scope is the outlets' analysis and the criminals' claims). Suggested priority: routine to notable. event_date 2026-11-13 (claim); 2026-11-15 (victim confirmation, the freshest development).
      Transferable lessons for communal defenders: (1) a shared supplier environment (a sending account at a waste-management software vendor and a fleet-management server shared by about a hundred organisations) widens one commune's incident into other collectivities' data; (2) clear-text credentials and an API key sat inside exportable mailbox and ticket data; (3) a citizen-service export (waste-site access cards) carries name, address, phone and e-mail on one record, which makes credible fake-notice and fake-billing messages possible, as the sources note.
      Exposure/Detection: no CVE or product is named, the access path is undisclosed. Telemetry to review in a comparable commune: outbound mail and API-key use at third-party SaaS accounts, support-ticket and automatic-mailbox export access, shared fleet/MDM consoles with other tenants. Post-incident check the sources imply: rotate every credential that appears in a leaked archive, including supplier API keys. Triage: not applicable (no behavioural signature in the sources).
