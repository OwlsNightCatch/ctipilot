    extended_notes: |
      Suggested classification B2 (Hudson Rock and Ohey are B research sources; the poisoned bytes are independently observed by three parties and archived on urlscan, but no provider has confirmed or explained it). Suggested priority: high for the constituency's web and mobile exposure, not critical (no demonstrated device compromise). event_date: first vendor-response capture 2026-11-13 05:42 UTC (Kissmetrics); Optimizely files switched to the card-skimming payload on 2026-11-16. Related prior entry (no source states a link): 2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits, a different delivery channel into the same two kits. IOCs (hosts, hashes, wallet addresses) are in the sources and deliberately omitted here.
      Exposure: any page that loads Optimizely project JavaScript from cdn.optimizely.com (both /js/<id>.js and /public/<id>/s/ paths appear), Kissmetrics i.js, StorifyMe widgets or web components, or the minute-ly loader. Check the bytes the browser actually receives (Hudson Rock: restore only after preserving response bytes, headers, hashes and project revisions). For devices: Ohey puts DarkSword at iOS 18.4 to 18.7.2 via Safari; Coruna's range in the registry is iOS 13 to 17.2.1 (Report URI via the DeadTag entry).
      Behaviour for triage: a vendor-hosted script that causes an additional script load from a host unrelated to the vendor; on iPhone/iPad user agents a second boot script and a hidden 320x568 near-transparent frame that loads at most once a day per visitor (Ohey); card POST bodies sent by sendBeacon to an unfamiliar host on checkout pages; html2canvas fetched from a non-site host (Amirul Cyber); wallet addresses changing between copy and paste. Benign lookalike: legitimate Optimizely experiments rewrite DOM text and load code from Optimizely hosts; the discriminator is any request from the vendor script's execution context to a non-vendor, recently registered host (urlscan: the router host was about a week old, its certificate issued 2026-11-09).
      Detection: CSP script-src violation reports naming unknown hosts (Amirul Cyber says two affected sites survived exactly this way: compromised snippet, unexecuted payload); proxy/DNS/egress logs for managed endpoints visiting the affected pages followed by lookups of newly registered domains; a canary wallet address on a staging page (paste, submit, compare); response-body diffing of served third-party bundles. Post-patch/post-removal check: provider-side project change history, API credentials and integrations (Hudson Rock: shared malicious output proves an integrity problem, not the access path); sensitive pages (payment, login, e-government forms) that loaded the file; session invalidation and card-fraud coordination where the evidence supports it.
      Hardening (as the sources frame it): CSP script-src as the last line of defence (Amirul Cyber) and scoping which sensitive paths loaded the affected file (Hudson Rock); do not rely on blocking the attacker host alone (embedded fallback copy in the BBC and HSBC UAE files). Gaps: no provider (Optimizely, Kissmetrics, StorifyMe, minute-ly) statement found; no count of exposed visitors; Hudson Rock could not read the GitHub issue it was supplied.
