  - title: "Communauté de communes Entre Bièvre et Rhône (Isère, 37 municipalities): hacker collective publishes a 605 MB archive; the intercommunality confirms a security incident on 15 November; the archive holds waste-site user records, staff social-security numbers, plain-text credentials and a software supplier's mailing account"
    sources:
      - { url: "https://fuitesinfos.fr/article/2026-11-13-communaute-de-communes-entre-bievre-et-rhone", publisher: "Fuites Infos", date: "2026-11-15", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/cyberattaque-entre-bievre-et-rhone-donnees-habitants-collectivites-mwf9txigpk5flbkvnm", publisher: "FrenchBreaches", date: "2026-11-15", role: "primary" }
    discovery_trace: "first seen at: frenchbreaches, feed https://frenchbreaches.com/feed.xml (item 'Communauté de Communes d'Entre Bièvre et Rhône', 2026-11-13, update 2026-11-15) → drilled https://frenchbreaches.com/alertes/cyberattaque-entre-bievre-et-rhone-donnees-habitants-collectivites-mwf9txigpk5flbkvnm → corroboration found via fuitesinfos listing https://fuitesinfos.fr/articles/ → https://fuitesinfos.fr/article/2026-11-13-communaute-de-communes-entre-bievre-et-rhone (carries the victim's written reply and an analysis of the archive) → primary (the victim's own written statement is reproduced as a masked capture; the original reply is not published)"
    summary: |
      Facts: a criminal-forum post of 2026-11-13 offers a 605 MB archive (12 files) as a free download, presented as the result of an intrusion into the network of the Communauté de communes Entre Bièvre et Rhône (37 municipalities around Saint-Maurice-l'Exil, northern Isère). On 2026-11-15 the intercommunality told both Fuites Infos and FrenchBreaches in writing that it detected a security incident affecting part of its information system, that security measures were taken, that its services and specialist providers are restoring service progressively and that it will inform the residents concerned. Its reply does not date the detection, name the data or count people, and does not mention the claim or the archive.
      Fuites Infos analysed the archive itself: about 22,500 waste-collection-site users (name, postal address, phone, e-mail and the trace of each visit), the collectivity's automatic-sending mailbox, ten staff files with the social-security number, two music-conservatory family files (minors), internal-tool login credentials some in clear text, an API key, an inventory of mobile devices from a fleet-management server shared by about a hundred waste-sector organisations, and about 890,000 e-mail addresses from the sending account of Symetri, the vendor of the waste-site management software, whose sender identities also name other collectivities. Fuites Infos did not find several announced elements, including directory accounts, in the part it analysed.
      Claims only (FrenchBreaches, from the criminals' message): 715 domain accounts, up to 95 TB of backups with 186 virtual machines, and 128 GB of water-management telemetry; FrenchBreaches notes nothing shows control of water installations or a service disruption, and that the figures are the criminals' own. Initial access is not disclosed by any source.
    region_nexus: "France (neighbouring state); communal public administration with a shared software-supplier environment, directly analogous to Swiss communes and communal associations"
    primary_sector_nexus: "direct sector analogue (communal administration; supplier blast radius across other collectivities and a shared fleet-management server)"
