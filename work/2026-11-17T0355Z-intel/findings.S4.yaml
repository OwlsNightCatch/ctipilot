candidate_sources:
  - id: ohey-ca
    publisher: "Ohey (ohey.ca web threat research)"
    url: "https://ohey.ca/research/"
    category: research
    why: "Dated primary web-threat research (ClickFix, skimmers, iOS exploit-kit routers) with first-party captures; the iOS branch and the vendor-script timeline of OptimJack come from it. No RSS (feed.xml, rss.xml, feed all 404); `url --direct https://ohey.ca/research/` and `https://ohey.ca/sitemap.xml` return listings and `extract` reads articles. Reliability B."

coverage_gaps:
  - source_id: ico-uk
    reason: "RECIPE CHANGE (not a failure): the main host answered this run. `python3 tools/fetch_source.py ico-uk enforcement 12` returned 12 dated enforcement items from https://ico.org.uk/sitemap.xml (232 in the sitemap; HTTP 200), and `extract https://ico.org.uk/action-weve-taken/enforcement/2026/11/somerset-council/` returned the page (served direct-raw, raw HTML with DC.Date metadata). The news listing page is hydrated by JavaScript (WebFetch saw only 'Loading' placeholders), so enumerate through the sitemap or the `ico-uk enforcement` subcommand rather than the listing. The Welsh mirror recipe (`url --direct https://cy.ico.org.uk/sitemap.xml`, filter out /action-weve-taken/decision-notices/) also still works. Newest enforcement items: Somerset Council (2026-11-12), Bluon Energy (2026-11-04), Staffordshire Police (2026-10-28), Local Government Data Unit Wales (2026-10-20), Metropolitan Police Service (2026-10-14): all outside the 49 h lookback, none in-window. The main agent may want to refresh the ico-uk record's newest_note and fetch_method."
  - source_id: ransomware-live
    reason: "`extract https://www.ransomware.live/country/CH` still returns an undated victim list with names partly stripped (no usable in-window filter). Working supplement this run: `python3 tools/fetch_source.py feed https://www.ransomware.live/rss.xml 500` returned 200 dated items (2026-11-12 to 2026-11-17; titles carry group, victim and deadline, no country field); no Swiss or DACH public-sector victim in it. `url https://www.ransomware.live/recent` returns about 400 KB of HTML without row structure we could parse."
  - source_id: fuitesinfos
    reason: "Recipe confirmed: `url --direct https://fuitesinfos.fr/articles/` (trailing slash) returns the listing with article hrefs of the form /article/<YYYY-MM-DD>-<slug>; `extract` reads each article, including the victim reply and data-category lists."
  - source_id: handelsblatt (cited page, not a slice record)
    reason: "extract returned a JavaScript shell (direct-raw); the dts/finanznachrichten.de copy of the same Handelsblatt report was read instead."
  - source_id: inside-it-ch (paywall)
    reason: "Inside IT Plus articles show only the lede to `extract` (Abo paywall); the 2026-11-06 municipal data-sale article could not be read in full."
  - source_id: webfetch-summariser
    reason: "WebFetch of https://ohey.ca/threats/ios-exploits/darksword/ returned an API safeguard error from the summariser model (exploit-kit content); `extract` read the same page fully. For exploit-kit or malware research pages prefer `extract` over WebFetch. urlscan.io's API answers 403 'not logged in' on every transport; WebFetch of the human result page works."

