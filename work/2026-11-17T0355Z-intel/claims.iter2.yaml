    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "headline"
    kind: frontmatter
    text: "OptimJack: poisoned vendor scripts route iPhones to exploit kits; Optimizely files also skim cards; Basel hit"
  - claim_id: 078a6cfae7
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "summary"
    kind: frontmatter
    text: "Ohey reports that from 2026-11-13 scripts served by Kissmetrics, StorifyMe and Optimizely customer project files gained a loader that routes iPhones to the Coruna and DarkSword exploit-kit stages, and that minute-ly's loader was replaced outright; from 2026-11-16 the Optimizely files also carry a script that swaps cryptocurrency addresses and skims payment cards in every browser. Hudson Rock recovered nine poisoned vendor files and matched archived responses on 21 named sites, among them the University of Basel's StorifyMe widget; the iPhone stages are delivery observations, not confirmed compromises, and the initial access is unknown."
  - claim_id: 4142403c17
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "actions[0]"
    kind: frontmatter
    text: "List every page of your organisation's sites, and of the agencies that build them, that has loaded Optimizely project JavaScript, Kissmetrics i.js, a StorifyMe widget or the minute-ly loader since 2026-11-13, capture the bytes the browser receives and compare them with the provider's own project content, and where a file carries the injected loader remove it, keep the response bytes as evidence and treat the payment, login and form pages that loaded an affected Optimizely file as exposed to card and session theft."
  - claim_id: 7ac3352660
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "Per Ohey, from 2026-11-13 the scripts served by Kissmetrics, StorifyMe and Optimizely customer project files gained a few lines that load a small router script for iPhones and iPads, and minute-ly's loader was replaced outright ("
    urls: ["https://ohey.ca/threats/ios-exploits/darksword/"]
  - claim_id: 54cb75d2dc
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "Hudson Rock recovered nine poisoned vendor files itself, eight Optimizely project files and the minute-ly loader, matched 16 archived vendor responses from 15 site captures, and names 21 web properties, among them BBC, Zoom, GitLab's marketing site, HSBC UAE and the University of Basel ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: 1c752bb995
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "The Basel capture, scanned on 2026-11-14 at 03:27 UTC, recorded a poisoned StorifyMe web component ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: 908ae2f2b3
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "How the files were altered, who operates the campaign and how many visitors loaded them are unknown ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: f9e68e58e9
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "The financial theft sits in the Optimizely files: Ohey says that on 2026-11-16 they switched to a script that swaps copied wallet addresses and skims card numbers in every browser and adds the router only on iPhones and iPads ("
    urls: ["https://ohey.ca/threats/ios-exploits/darksword/"]
  - claim_id: ccdc3009c1
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "Hudson Rock describes the stealer as skimming card number, expiry and CVV from form and fetch POST bodies and conditionally sending readable cookies with an image of the page, and says a response that only delivers the router loader establishes the mobile-router path, not the theft modules ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: 474d9c66a6
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "The BBC and HSBC UAE Optimizely files also embed a complete fallback copy that runs when the remote fetch fails or takes longer than 2.5 seconds, so blocking the attacker host does not stop the clipper ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: ef5cbf5c2d
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "The router's configured branches, in Hudson Rock's reading of Ohey's captures, send iOS 13 to 17 to a Coruna-associated entry and iOS 18 to 25 to a DarkSword-labelled entry ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: 14cca2e098
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "), and Ohey states that DarkSword attacks iPhones running iOS 18.4 to 18.7.2 through Safari ("
    urls: ["https://ohey.ca/threats/ios-exploits/darksword/"]
  - claim_id: f06f206608
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "); Hudson Rock stresses that these are delivery observations, not demonstrated iPhone compromises ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: ac98a99885
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "GitLab's and Zoom's Optimizely files and minute-ly's loader still carried the code at 21:10 UTC on 2026-11-16 ("
    urls: ["https://ohey.ca/threats/ios-exploits/darksword/"]
  - claim_id: 8373392f8e
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "**Exposure:** any page that loads Optimizely project JavaScript from cdn.optimizely.com, Kissmetrics i.js, a StorifyMe widget or web component, or the minute-ly loader; what counts is the file the browser receives, not the provider's console ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: b6741ce9d2
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "**Detection:** web proxy and DNS telemetry for a vendor script that causes a further script load from a host unrelated to the vendor, payment-form POST bodies sent to an unfamiliar host, and response-body diffs of served third-party bundles; Content-Security-Policy script-src violation reports naming unknown hosts, which Amirul Cyber says stopped the payload on two affected sites ("
    urls: ["https://amirulcyber.com/2026/11/16/optimjack-optimizely-skimmer/"]
  - claim_id: 73e3d33e4b
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "After removal, review the provider-side project change history, API credentials and integrations, because the poisoned output shows an integrity problem, not how the attacker got in ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: af0ec9513e
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** inventory third-party scripts on public, payment and e-government pages now and verify what each serves; a DNS or network block alone does not remove the poisoned trusted script ("
    urls: ["https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/"]
  - claim_id: 2fadcdce1b
    entry: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
    surface: "body"
    kind: derived
    text: "Staff iPhones are exposed to stage delivery only on a visit to an affected page."
  - claim_id: 028e9c4dcf
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "headline"
    kind: frontmatter
    text: "Symantec: AI-assisted retailer intrusion pivots through SolarWinds Orion's bundled RabbitMQ Erlang cookie"
  - claim_id: 7948f73ff9
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "summary"
    kind: frontmatter
    text: "Symantec reports that after hand-typed commands against a US retailer's web server were blocked, the attackers switched overnight to long, error-free PowerShell scripts and, about ten minutes after first querying SolarWinds Orion, read the Erlang cookie of the RabbitMQ broker bundled with it and ran Orion's own erl.exe to execute a command on a second web server. Symantec assesses AI assistance with high confidence and says no technique was new: the AI supplied speed, while the chain ran through SQL Server command execution, web shells, side-loaded security-vendor executables and domain credential theft."
  - claim_id: 9fa88aefa0
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "Symantec's Threat Hunter Team describes a September 2026 intrusion at a US retail organization in which the attackers first worked by hand on a compromised web server, with typing errors and every staged payload terminated by security software, and then, the next day, submitted about 50 long, error-free PowerShell scripts over roughly two hours, with labelled output sections and comments that read as a model's reasoning ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: 6cf3955469
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "Symantec assesses AI assistance with high confidence and an operator relaying output to an AI tool, not an autonomous agent, with moderate confidence; it could not identify the model ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: b777772dc7
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "The initial infection vector is unknown ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: 3eaf5c057a
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "The earliest activity, on 2026-09-18, ran cmd.exe directly under sqlservr.exe on three SQL Servers, which Symantec reads as commands issued through the database service, most likely xp_cmdshell; on one host the attackers compiled the public EfsPotato exploit with csc.exe from base64 text decoded by certutil and saved the SAM, SYSTEM and SECURITY hives ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: c9e1edff75
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "On a web server compromised through w3wp.exe they side-loaded payloads with a legitimate Bitdefender executable (bdreinit.exe with log.dll) and a G DATA executable (ask.exe with ask.dll) from ProgramData, used a utility called BreakChain to relaunch them so they no longer appeared as children of w3wp.exe, copied one to a file named w3wp.exe, and planted ASP web shells in the application's images folder ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: a45995f600
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "The AI-style scripts then harvested credentials from connection strings, FileZilla, WinSCP and PuTTY settings, saved RDP files and IIS configuration, read the Erlang cookie file of the RabbitMQ broker that ships with Orion; running Orion's bundled erl.exe with that cookie, they called the broker on a second web server to run an encoded operating system command ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: 3c2505476b
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "Later activity searched a probable domain controller for NTDS.dit, SYSVOL cpassword values and LAPS passwords and ran a Chisel tunnelling tool and a password sprayer ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: e216b78005
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: cited
    text: "Symantec says no second-phase technique was new and suggests a possible link, through a shared address and the retail focus, to the operation Gambit Security described on 2026-09-22 ("
    urls: ["https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"]
  - claim_id: 6b79f01e5e
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: uncited
    text: "No Swiss or public-sector victim is named; the case matters for the transferable chain and its AI-assisted tempo."
  - claim_id: 44459d661c
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: derived
    text: "**Exposure:** Windows estates running SolarWinds Orion with its bundled RabbitMQ broker alongside SQL Server hosts and IIS web applications; the Erlang cookie file on the Orion host is the pivot."
  - claim_id: d7582573a5
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage for cmd.exe or PowerShell started under sqlservr.exe or w3wp.exe, csc.exe started by PowerShell on a server, certutil decoding a text file in ProgramData, a vendor-signed executable running from ProgramData beside an unsigned DLL, an executable named w3wp.exe outside the IIS directory, and erl.exe started from the Orion directory with a cookie argument and a remote broker call; registry hive save events for SAM, SYSTEM and SECURITY."
  - claim_id: 43ba2cddda
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: derived
    text: "**Triage:** long, labelled PowerShell is not the signal on its own, because administrators write such scripts too; a parent of sqlservr.exe or w3wp.exe rather than an administrator session, credential-store targets and a blocked loader returning rebuilt are."
  - claim_id: 9851426584
    entry: 2026-11-17/symantec-ai-assisted-retailer-intrusion-orion-rabbitmq
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** hunt SQL Server and IIS hosts for this lineage, treat an Orion server as a lateral-movement bridge to every host that runs its RabbitMQ node, and alert on behavior rather than file names, since the tools were renamed and rebuilt after each block."
  - claim_id: eb898246bf
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "headline"
    kind: frontmatter
    text: "Unit 42: TGR-STA-0049 uses QUIC C2, logon-script spread and Exchange FullAccess loops against governments"
  - claim_id: e20d80f587
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 reports that TGR-STA-0049 (also tracked as REF7707, Earth Alux and Ink Dragon) has attacked Southeast Asian government entities since at least July 2025, entering through unpatched Exchange and web servers, and says the group's targeting also includes governments in South America and Europe. Its new PerfectPioneer and KUKURAT implants use HTTP/3 over QUIC as the main command channel, the operators spread KUKURAT through domain logon scripts after taking a domain controller, and on Exchange they grant a compromised account FullAccess on every mailbox."
  - claim_id: 7bec48e97c
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "Unit 42 describes a campaign by TGR-STA-0049, also tracked as REF7707, Earth Alux and Ink Dragon, against Southeast Asian government entities since at least July 2025, and says the group's targeting also includes government organizations in South America and Europe ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 956361386f
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "Server exploitation is the primary entry: unpatched Microsoft Exchange and web servers receive web shells, among them variants of ASPXSpy, Godzilla, Bysunue.aspx and Suo5, while phishing with decoy PDFs from lookalike government domains is secondary ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 197b11b1b0
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "The implants are two previously undocumented families: the Go-based PerfectPioneer RAT, active since July 2025 and run through DLL side-loading of a modified legitimate executable, decoy installers or phishing, and its modular C++ successor KUKURAT, deployed since March 2026, which loads at least 12 DLL modules from the command server into memory ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 1a4925f911
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "Unit 42 says both families use HTTP/3 over QUIC as the primary command channel, with an automatic HTTP/2 fallback in the PerfectPioneer variant it analyzes and separate HTTP/2 and HTTP/3 builds of KUKURAT, and that some firewalls and inspection engines handle QUIC less well than TCP traffic ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 4a3b94d599
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "Two of the six PerfectPioneer variants, Pioneer and rat_http3_cc, carry a built-in blocklist that stops operators running noisy or destructive commands, and KUKURAT generates synthetic network, registry and file activity as camouflage ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 6e55e2991a
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "After taking a domain controller, the operators installed malicious domain logon scripts, so each user's logon pulled KUKURAT; they also used PsExec, WMI and WinRM ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: d0cc0d7241
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "Credentials came from LSASS dumps taken with rundll32 calling comsvcs.dll by ordinal rather than by the MiniDump name, from DCSync, and from Mimikatz, ProcDump, SharpDPAPI and SAM and SYSTEM hive dumps ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: e0c2cc11a0
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "On Exchange, the operators first listed accounts holding the ApplicationImpersonation role and, when none was found, ran a hidden PowerShell loop that granted a compromised account FullAccess on every mailbox ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 65d104b33a
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "The exfiltration targeted pdf, docx, xlsx and png files whose names suggest international relations and internal political affairs ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: e4a3557879
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: cited
    text: "**Detection:** egress telemetry for outbound UDP 443 (QUIC) from servers that do not browse, since Unit 42 advises logging or blocking it so traffic falls back to TCP; SYSVOL and Group Policy change audit plus endpoint alerts on an uncommon startup process running under a domain user SID at logon, which raised an alert in Unit 42's telemetry; process events for rundll32 loading comsvcs.dll with an ordinal argument; and Exchange audit of ApplicationImpersonation role holders and of Add-MailboxPermission loops that grant FullAccess across all mailboxes ("
    urls: ["https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"]
  - claim_id: 23107fc9e1
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: derived
    text: "**Exposure:** on-premises Exchange and other web servers that are unpatched and internet-facing, and Active Directory domains in which an attacker with domain controller access can edit logon scripts in SYSVOL or Group Policy."
  - claim_id: 4a46ea7169
    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch or isolate internet-facing Exchange and web servers first, then check domain logon scripts, ApplicationImpersonation holders and mailbox permissions, and decide whether servers need outbound UDP 443 at all."
  - claim_id: da079dbeea
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "headline"
    kind: frontmatter
    text: "GTIG quarterly: exploit_agent automates n-day exploitation, suspected DPRK cluster abuses .claude/settings.json"
  - claim_id: 3b38b4ee1d
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "summary"
    kind: frontmatter
    text: "Google Threat Intelligence Group and Mandiant's quarterly AI threat update of 2026-11-16 reports an exposed multi-agent framework, exploit_agent, that compares code before and after patch announcements, drafts exploits and runs them with no human in the loop, the first such full automation GTIG has identified. It also reports a suspected MIDNIGHT NEPTUNE (North Korea) cluster that modified .claude/settings.json in victims' internal repositories so that Claude Code downloads the SOMBERMEME backdoor at startup, and PRC-nexus actors using an LLM platform's file-hosting backend for staging and exfiltration."
  - claim_id: ef019d98b6
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "Three findings in GTIG's quarterly update on adversary use of AI, published 2026-11-16, change what defenders can look for ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: c5c0962de2
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "First, GTIG identified an exposed staging server hosting a multi-agent vulnerability research and weaponization framework, dubbed exploit_agent, that integrates frontier and local LLMs and runs continuous differential analysis of popular web application software: it compares code before and after patch announcements, analyzes the findings, drafts exploits and executes them automatically, which GTIG says is the first time it has seen LLM frameworks fully automate discovery and exploitation without a human in the loop ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: 8e978a2eca
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "The server also held scripts for internal reconnaissance, brute-forcing, installing web shells and removing other attackers' web shells, and its victim telemetry suggested interest in French media, entertainment and education websites ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: cd7e83a4b4
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "Second, in intrusions against cryptocurrency organizations in North America and Europe, a suspected MIDNIGHT NEPTUNE cluster used fraudulent recruiter profiles, sent targets to fake meeting platforms with ClickFix lures that ran likely LLM-authored staging scripts, and then pivoted into internal code repositories and modified .claude/settings.json so that Claude Code startup triggered the download of the SOMBERMEME backdoor; it masked lateral movement with GitHub personal access tokens named after Microsoft Copilot ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: cf6b72f3cf
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "Third, in what GTIG calls a new trend, PRC-nexus actors abused LLM platforms and file-hosting backends for staging, dead-drop command channels and exfiltration, in one case staging lure archives and exfiltrating stolen data through a frontier model's file-hosting infrastructure ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: 9d61a9c927
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "GTIG separately assesses that the open-source agentic pentest frameworks it tracks, among them ARTEX, CAIRN, CyberStrikeAI and PentAGI, currently trade stealth for velocity: they generate forensic traffic, rely on recognizable identifiers and leave distinct code-level traces ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: 15387dc3f8
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: cited
    text: "**Detection:** repository change monitoring for edits to .claude/settings.json and its hook or startup commands, and GitHub audit events that create personal access tokens named after a vendor assistant; for agentic scanning, the forensic traffic, recognizable identifiers and code-level traces that GTIG says pentest frameworks leave behind ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/"]
  - claim_id: cddfcefa12
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: derived
    text: "**Exposure:** organizations whose developers run Claude Code against shared repositories, where a committed project settings file executes at startup, and internet-facing web applications and plugins whose patches are public, since exploit_agent works from patch diffs."
  - claim_id: f679557eb5
    entry: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** review a change to a project-level Claude Code settings file like a code-execution change, and move internet-facing web components to the fastest patch lane, because GTIG describes patch diffs being turned into executed exploits without a human."
  - claim_id: 1c54b7c233
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "headline"
    kind: frontmatter
    text: "BundID: mass automated logins lock citizen accounts; BSI confirms; password sign-in cut on 16 November"
  - claim_id: bea32d72e6
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "summary"
    kind: frontmatter
    text: "On 2026-11-16 Germany's BSI confirmed automated, mass login attempts against BundID, the federal citizen account for online administrative services: failed attempts locked accounts and triggered password-reset mails, and the federal government switched off username-and-password sign-in while eID and other sign-in means stayed open. The BSI has no indication that any account was compromised; Handelsblatt, citing government circles, calls it credential stuffing, and no Swiss portal is reported affected."
  - claim_id: f44bb49831
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "Germany's BSI confirmed to heise security and Handelsblatt on 2026-11-16 an IT security incident involving BundID accounts: automated, mass login attempts whose failures locked accounts, triggered automated mails and prompted account holders to reset their passwords ("
    urls: ["https://www.heise.de/news/BundID-Massenhafte-Angriffe-fuehren-zu-Kontosperrungen-11526376.html"]
  - claim_id: 2f7cc6f2b6
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "The federal government switched off username-and-password sign-in on Monday morning for security reasons ("
    urls: ["https://www.handelsblatt.com/politik/deutschland/bundid-hackerangriff-auf-buergerkonten-mit-massenhaften-log-in-versuchen/100270238.html"]
  - claim_id: 432dbe72ec
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "), while sign-in with the online ID card (eID) and the Elster certificate stayed possible ("
    urls: ["https://web.de/magazine/digital/bundid-konto-gesperrt-betroffene-42951652"]
  - claim_id: 5be1cc7aa0
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "The BSI says countermeasures it does not name repelled the attack and that it has no indication of a compromise of any account, and heise reports that locked accounts are apparently not being unlocked in bulk, so account holders must pass the password-reset flow or use another sign-in method ("
    urls: ["https://www.heise.de/news/BundID-Massenhafte-Angriffe-fuehren-zu-Kontosperrungen-11526376.html"]
  - claim_id: bcbb5d6dc9
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "Handelsblatt, citing government circles, describes the attack as credential stuffing, the automated replay of credentials from earlier leaks at other services ("
    urls: ["https://www.handelsblatt.com/politik/deutschland/bundid-hackerangriff-auf-buergerkonten-mit-massenhaften-log-in-versuchen/100270238.html"]
  - claim_id: 0f6474468e
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: cited
    text: "An aggregator reports that password sign-in returned the same afternoon behind a mandatory e-mail one-time code ("
    urls: ["https://www.ad-hoc-news.de/wissenschaft/bundid-nach-angriffswelle-passwort-login-jetzt-nur-noch-mit-e-mail-code/70522344"]
  - claim_id: feb440d0c5
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: uncited
    text: "No Swiss portal is reported affected."
  - claim_id: 9d57eb8333
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: derived
    text: "**Exposure:** citizen-facing or employee-facing login portals that accept a password and lock an account after repeated failures."
  - claim_id: 7a3ca6d6dc
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: derived
    text: "**Detection:** authentication logs showing a surge of failed password sign-ins spread over many usernames and sources, followed by lockout notices, password-reset mail volume and helpdesk contacts; a lockout storm is itself the alert."
  - claim_id: cadee6eca4
    entry: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the operator's first containment, as heise and Handelsblatt report it, was to switch off the password-only path while eID and other stronger sign-in means stayed open; a lockout-after-failures control turns credential stuffing into mass lockouts and reset mail even when no account is taken over, so settle that containment lever for your own portals before a run starts."
  - claim_id: 23bbfab1a8
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "headline"
    kind: frontmatter
    text: "Craft CMS unauthenticated SQL injection gives admin takeover; CCCS reports exploitation; update to 4.18.9 or 5.11.2"
  - claim_id: 53191d4cc6
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-123488 is an unauthenticated SQL injection in the front-end search of Craft CMS 4.0.0 to 4.18.8 and 5.0.0 to 5.11.1 on MySQL and MariaDB that gives read and write access to the database, including setting the admin flag or overwriting password hashes. The Canadian Centre for Cyber Security says open source reporting indicates exploitation in the wild and VulnCheck lists it in its own KEV database; no first-hand telemetry or CISA listing was found. Craft fixed it in 4.18.9 and 5.11.2 and offers a query-string block as a workaround."
  - claim_id: 4be9f0a8e4
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Craft CMS 4 site to 4.18.9 and every Craft CMS 5 site to 5.11.2 now, and where that waits block front-end requests whose query string contains [attribute] or its encoded form %5Battribute%5D; on each MySQL or MariaDB site that was internet-facing on an older build, check the users table for an admin flag or password hash nobody changed and for administrator accounts you did not create, because the flaw writes to the database and updating does not undo it."
  - claim_id: 130836dda3
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "cves[CVE-2026-123488]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123488\", \"cvss\": \"9.3\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"Craft CMS 4.0.0 through 4.18.8 and 5.0.0 through 5.11.1, on MySQL and MariaDB only\", \"fixed\": \"4.18.9 and 5.11.2\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: edc66c3513
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "Craft CMS 4.0.0 before 4.18.9 and 5.0.0 before 5.11.2 contain an unauthenticated SQL injection in front-end search: the attribute parameter is concatenated into the query unsanitized and emulated PDO prepares allow stacked statements, so a remote attacker can read and write the database, setting the admin flag or overwriting password hashes in the users table to gain administrator access (CVSS 4.0 9.3) ("
    urls: ["https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint"]
  - claim_id: 197ec5ec7c
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "Craft's own advisory, published on 2026-10-22 as critical, places the flaw on the front end of any site that uses craft.search, says it affects only MySQL and MariaDB, and says the write primitive was used to set the admin flag on user ID 1 ("
    urls: ["https://github.com/craftcms/cms/security/advisories/GHSA-qcvp-ggx3-97r6"]
  - claim_id: 4a72a3ef3a
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "The fixed releases are 4.18.9 and 5.11.2, and Craft's temporary workaround is to block front-end requests that carry the bracketed attribute token, plain or encoded, in the query string ("
    urls: ["https://github.com/craftcms/cms/security/advisories/GHSA-qcvp-ggx3-97r6"]
  - claim_id: 29e7baf30f
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "ENISA's record for CVE-2026-123488 lists Craft's advisory among its references ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-118288"]
  - claim_id: e8390dd37a
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "On exploitation, the Canadian Centre for Cyber Security's update of 2026-11-12 says open source reporting indicates the flaw is exploited in the wild ("
    urls: ["https://cyber.gc.ca/en/alerts-advisories/craft-cms-security-advisory-av26-1086"]
  - claim_id: f37bb29b42
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: cited
    text: "), and VulnCheck's advisory page states that it is in the VulnCheck KEV database ("
    urls: ["https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint"]
  - claim_id: f2d9b2cfee
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: uncited
    text: "No first-hand telemetry, victim statement or CISA listing was found."
  - claim_id: 9d01e3bdfc
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
    kind: derived
    text: "**Exposure:** Craft CMS 4.0.0 to 4.18.8 and 5.0.0 to 5.11.1 on MySQL or MariaDB whose public pages use craft.search."
  - claim_id: dfd8c97a93
    entry: 2026-11-17/craft-cms-cve-2026-123488-unauthenticated-sqli-admin
    surface: "body"
