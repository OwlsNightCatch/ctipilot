    text: "Ohey reports that from 2026-11-13 scripts served by Kissmetrics, StorifyMe and Optimizely customer project files gained a loader that routes iPhones to the Coruna and DarkSword exploit-kit stages, and that minute-ly's loader was replaced outright; from 2026-11-16 the Optimizely files also carry a script that swaps cryptocurrency addresses and skims payment cards in every browser. Hudson Rock recovered nine poisoned vendor files, matched archived responses and names 21 web properties, among them the University of Basel's StorifyMe widget; the iPhone stages are delivery observations, not confirmed compromises, and the initial access is unknown."
