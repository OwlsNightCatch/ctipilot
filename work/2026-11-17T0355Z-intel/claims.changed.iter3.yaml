    entry: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 reports that TGR-STA-0049 (also tracked as REF7707, Earth Alux and Ink Dragon) has attacked Southeast Asian government entities since at least July 2025, entering through unpatched Exchange and web servers, and says the group's targeting also includes governments in South America and Europe. Its new PerfectPioneer and KUKURAT implants use HTTP/3 over QUIC as the main command channel in most variants, the operators spread KUKURAT through domain logon scripts after taking a domain controller, and on Exchange they grant a compromised account FullAccess on every mailbox."
