    extended_notes: |
      Defender angle (from the report's mechanics): (a) patch-to-exploit time for web applications and plugins is now modelled by GTIG as near zero, so internet-facing CMS plugins, PHP and management-server patches belong on the fastest lane; (b) hunt, do not wait for IOCs: GTIG says the frameworks leave forensic noise (high-rate scanning, recognisable identifiers, code-level traces), so web/app access logs showing rapid multi-endpoint probing followed by single-use payloads is the telemetry class; (c) developer-tooling vector: .claude/settings.json (project settings with hooks) committed or modified in an internal repository executes on the next Claude Code start, so repository change monitoring for .claude/ settings and hook definitions, and GitHub PAT-creation audit events with names imitating a vendor assistant, are the concrete hooks GTIG's case supports; (d) ClickFix lures against developers (user-run 'fix' scripts) remain the access step. Registry note: the store has two different 'Cairn' entities (tool:cairn-exploitation-engine from Gambit; tool:cairn-talos is a Talos research toolkit); GTIG's CAIRN description (OODA loop, shared blackboard) does not say which, if either, it is: resolve before linking. The LLMjacking part overlaps the 2026-11-09 LLMjacking entry and the ARTEX part overlaps the ARTEX entries; the new material is exploit_agent, the .claude/settings.json vector, LLM file-hosting abuse, and the zero-day statistics. Previous GTIG tracker in the registry: report:gtig-ai-threat-tracker-may-2026.
