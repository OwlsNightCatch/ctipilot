  - title: "ANNUAL REPORT — GTIG AI Threat Tracker (quarterly, 2026-11-16): GTIG and Mandiant report an exposed 'exploit_agent' framework that diffs patches, drafts exploits and runs them with no human in the loop, a suspected DPRK cluster that poisons a repository's .claude/settings.json, and PRC-nexus actors using LLM file-hosting backends for staging and exfiltration"
    suggested_kind: annual-report
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/", publisher: "Google Threat Intelligence Group / Mandiant", date: "2026-11-16", role: "primary" }
      - { url: "https://cyberscoop.com/google-fully-automated-ai-cyberattack/", publisher: "CyberScoop", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: mandiant-gtig feed (standing look, not a slice record), URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v -> primary: GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/ -> corroboration/attribution detail: CyberScoop, URL https://cyberscoop.com/google-fully-automated-ai-cyberattack/ (found via the cyberscoop feed https://cyberscoop.com/feed/)"
    summary: |
      GTIG and Mandiant published their quarterly AI threat update on 2026-11-16 (authors Aurora Blum, Kelli Vanderlee,
      Jess Xia, David Mainor), grounded in Mandiant incident response, actor tracking and platform telemetry. Facts GTIG
      states: (1) GTIG found an exposed staging server hosting a multi-agent vulnerability-research and weaponization
      framework it calls exploit_agent, wired to frontier and local LLMs, that continuously compares popular web
      application code before and after patch announcements, drafts exploits and executes them automatically; the same
      server held scripts for internal reconnaissance, brute-forcing, installing web shells and removing other
      attackers' web shells, and victim telemetry showed interest in French media, entertainment and education sites. GTIG
      says this is the first time it has seen LLM frameworks fully automate vulnerability discovery and exploitation without
      a human in the loop; CyberScoop's headline calls it the first fully automated AI cyberattack and relays that the
      Russian-speaking attribution rests on Russian-language comments in the operation's configuration file, with GTIG naming
      no group or state (CyberScoop's reading, not a GTIG sentence the extract carried). (2) GTIG has independently seen
      the open-source frameworks CAIRN (against targets including a US aerospace organization) and PentAGI (a customised
      orchestration platform used late August to early October 2026 for reconnaissance and scanning of organizations in
      Asia) in the wild, experiments with CyberStrikeAI and HexStrike AI, and a PRC-nexus group building its own automated
      attack framework. (3) GTIG's own September statistics, restated here: zero-day exploitation averaged 8 a month in
      2025, 11 a month in 2026 and spiked to 22 in August; it cites LLM-assisted weaponization of the PaperCut chain
      (CVE-2026-81578 and CVE-2026-82078, exploited as zero-days in late August) and of the PHP flaws (CVE-2026-109618 and
      CVE-2026-109619, found with LLM-enabled analysis, with a PoC video and early patched code public before the 2026-10-21
      patches and hundreds of non-functional, probably LLM-written PoCs afterwards). (4) A suspected MIDNIGHT NEPTUNE (DPRK)
      cluster in intrusions against cryptocurrency organizations in North America and Europe used fraudulent recruiter
      personas with SynthID-watermarked imagery, ClickFix lures that ran likely LLM-authored staging scripts, then pivoted into
      internal repositories and modified .claude/settings.json so that Claude Code's startup downloads the SOMBERMEME
      backdoor, masking lateral movement with GitHub personal access tokens named after Microsoft Copilot. (5) PRC-nexus actors
      abused a frontier model's file-hosting backend to stage lure archives and exfiltrate documents, and used LLMs for
      post-compromise data analysis (contractor LEAKY CASTLE). (6) Mandiant IR saw LLMjacking charges above USD 100,000 a day
      and up to USD 1 million cumulatively, plus 'LLM Mixer' resale storefronts (already covered by the 2026-11-09 LLMjacking
      entry). GTIG's own assessment: these frameworks currently 'trade stealth for velocity' and leave forensic traffic and
      code-level traces, and cyber-crime actors less concerned with stealth will keep adopting them.
    region_nexus: "global; exploit_agent victims France (media, entertainment, education); DPRK cluster targets North America and Europe; PentAGI activity in Asia"
