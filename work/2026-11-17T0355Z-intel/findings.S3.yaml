  # ------------------------------------------------------------------ 8
  - title: "Google Project Zero moves to 'Full X' disclosure: details are published 90 days after the report whether or not a fix exists (from 2026-11-13), 60 days from 2027-02-02 and 30 days from 2028-01-03, with the 30-day patch-rollout grace period removed"
    suggested_kind: policy
    sources:
      - { url: "https://projectzero.google/2026/11/disclosure-policy.html", publisher: "Google Project Zero", date: "2026-11-13", role: "primary" }
      - { url: "https://www.securityweek.com/google-project-zero-sets-course-for-30-day-disclosure-deadline/", publisher: "SecurityWeek", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: securityweek feed (standing look), URL https://www.securityweek.com/feed/ -> SecurityWeek article URL https://www.securityweek.com/google-project-zero-sets-course-for-30-day-disclosure-deadline/ -> primary: Project Zero, URL https://projectzero.google/2026/11/disclosure-policy.html (confirmed via feed https://googleprojectzero.blogspot.com/feeds/posts/default)"
    summary: |
      Project Zero (Natalie Silvanovich) replaced its '90 + 30' policy with 'Full X': vulnerabilities are disclosed X days after being
      reported to the vendor regardless of fix status. X is 90 from 2026-11-13, 60 from 2027-02-02 and 30 from 2028-01-03. The grace
      period and variant policy are removed; the only exceptions are in-the-wild exploitation (handled under Google's application
      security disclosure policy, 7 days per SecurityWeek), vulnerabilities already public, and vendor-requested early disclosure.
      Project Zero's reasoning: LLMs shorten the time to find and exploit bugs, 'zero patch-to-exploitation time is a reasonable, though
      imperfect, model of attacker behavior', patch soak time is no longer meaningful, and it now reports several vulnerabilities a week
      where it once found a few a year. For defenders: details of bugs in Google, Apple, Microsoft and other widely deployed products can
      become public before a patch exists, and 'patch gap' (fix released vs installed) is called out as the vendor and user problem to
      shrink.
    region_nexus: "global"
    primary_sector_nexus: "indirect (patch-SLA planning for widely deployed products)"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
