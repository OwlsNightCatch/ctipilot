  - title: "Symantec: a September 2026 intrusion at a US retailer shows attackers switching from hand-typed to AI-generated commands and, within about ten minutes, moving from a web server to another host through the RabbitMQ Erlang cookie bundled with SolarWinds Orion; Symantec has investigated dozens of AI-assisted intrusions since May"
    suggested_kind: threat
    sources:
      - { url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer", publisher: "Symantec Threat Hunter Team (Broadcom)", date: "2026-11-12", role: "primary" }
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/", publisher: "Google Threat Intelligence Group / Mandiant", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: symantec-security-com slice record, feed URL https://www.security.com/rss/v1/blogs/rss.xml/221 (listing https://www.security.com/threat-intelligence yields no usable links) -> primary: Symantec post, URL https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer; WebSearch (\"Symantec \\\"AI revived\\\" stalled attack U.S. retailer SolarWinds Orion RabbitMQ Erlang cookie AI-assisted\") found no independent rewrite; trend-level corroboration only from the GTIG tracker above"
    summary: |
      Symantec's Threat Hunter Team reports that in September 2026 attackers who had stalled against a US retail
      organization's web server (hand-typed commands with typos such as 'systemifo' and 'pwoershell'; every staged payload
      terminated by security software) switched overnight to long, error-free PowerShell scripts with labelled output
      banners and, in places, comments that read as a model's reasoning. About ten minutes after first querying the victim's
      SolarWinds Orion monitoring software, they had read the Erlang cookie of the RabbitMQ broker bundled with Orion and used
      Orion's own erl.exe with that cookie to call an operating-system command on a second web server (the command encoded as
      decimal character codes). Symantec assesses AI assistance with high confidence and an operator relaying output to an AI
      tool (not an autonomous agent) with moderate confidence; the model or service could not be identified; no data theft
      or encryption was observed and the likely motive is financial (point-of-sale scripts searched for passwords). Chain as
      reported: command execution through the database service (cmd.exe under sqlservr.exe, most likely xp_cmdshell) on
      three SQL Servers from 2026-09-18; EfsPotato compiled on the host (base64 text decoded with certutil, built with
      csc.exe) and SAM/SYSTEM/SECURITY hive saves; a web server compromised through w3wp.exe on 2026-09-21; Bitdefender
      (bdreinit.exe with log.dll and log.txt) and G DATA (ask.exe with ask.dll and ask.txt) legitimate executables
      side-loading a payload from ProgramData, a BreakChain utility relaunching them so they no longer appear as children of
      w3wp.exe, and a copy renamed w3wp.exe; ASP web shells in the application's images folder; credential harvesting from
      connection strings, FileZilla/WinSCP/PuTTY settings, saved RDP files and IIS configuration; later domain-controller
      activity (NTDS.dit, SYSVOL cpassword and LAPS searches), SQL 'sa' password guessing, internal port scanning, a Chisel
      tunnel and a password sprayer. Symantec states the same staging server appeared in an August 2026 intrusion without AI
      signs, notes the Yuze tunnelling tool (documented by Trend Micro with Warlock; Symantec says Yuze's presence alone does not
      tie this to Warlock/Longlegs), and says the retailer-staging address named in public reporting by Gambit Security
      as an AI console suggests the two operations may be linked (Gambit's report does not mention these loaders). Other cases
      outlined: a Vietnamese university, an East African ICT provider (212 long scripts, M-Pesa terms), a South Asian
      government hydroelectric company (PHP web shell, database credential tries, a script still carrying the placeholder
      YOUR_IP), a shared web host (about 970 commands at one-second spacing) and three linked South Asian organizations.
      Symantec's common-trend assessment: AI supplied no new techniques, only speed and persistence (tools renamed or rebuilt
      within seconds to minutes of a block; Potato-family escalation, registry hive dumps, Chisel recur).
    region_nexus: "US retailer (primary case); South Asia, East Africa, Vietnam in the other cases; no Swiss or EU victim named"
    primary_sector_nexus: "indirect: the TTP chain (web server or SQL Server to Orion/RabbitMQ to domain credentials) applies to any Windows estate that runs Orion and exposed web applications; one case is a government-owned utility"
    sector: "retail; energy (government hydroelectric company in South Asia); ICT"
    cves: [CVE-2022-21882]
    techniques: [T1190, T1505.003, T1505.001, T1059.001, T1574.001, T1068, T1003.002, T1003.004, T1003.003, T1552.001, T1021, T1047, T1572, T1090, T1110.003, T1105, T1588.007]
    affected_products: ["Microsoft SQL Server (xp_cmdshell)", "Microsoft IIS (w3wp.exe)", "SolarWinds Orion (bundled RabbitMQ and Erlang runtime)", "Zabbix agent (pre-shared key read)"]
    entity_keys: ["product:microsoft-sql-server"]
    new_entities:
      - { key: "tool:breakchain", type: tool, name: "BreakChain", aliases: ["BreakChainC", "BreakChainCs"], summary: "Process-tree-breaking launcher with five launch modes that relaunches a target so it no longer appears as a child of the IIS worker process; WMI and shell modes used against a US retailer in September 2026 (Symantec, 2026-11-12)." }
      - { key: "tool:yuze", type: tool, name: "Yuze", aliases: [], summary: "Lightweight open-source tunnelling tool supporting forward and reverse SOCKS5 proxies; seen on a host in an August 2026 intrusion linked by staging infrastructure to the US retailer case; Symantec notes Trend Micro documented its use by Warlock ransomware attackers (Symantec, 2026-11-12)." }
    relation_suggestions:
      - { subject: "actor:warlock-storm-2603", object: "tool:yuze", basis: "Symantec relays Trend Micro's documentation of Yuze use by Warlock ransomware attackers, and says Yuze is public so its presence alone does not tie this intrusion to Warlock/Longlegs (Symantec, 2026-11-12)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This is one of dozens of AI-assisted attacks that Symantec has investigated since May 2026."
        attribution: "Symantec Threat Hunter Team (Broadcom)"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
      - quote: "About 10 minutes after first querying the victim's SolarWinds Orion monitoring software, the attackers had used a component bundled with it to run commands on a second server."
        attribution: "Symantec Threat Hunter Team (Broadcom)"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
      - quote: "Symantec assesses the AI assistance with high confidence and the operator-in-the-loop model with moderate confidence."
        attribution: "Symantec Threat Hunter Team (Broadcom)"
        source_url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer"
    extended_notes: |
      Detection concepts the source supports (telemetry class first): process-creation events with parent lineage (cmd.exe or powershell.exe with sqlservr.exe as parent; cmd.exe with w3wp.exe as parent; csc.exe launched by PowerShell on a server; certutil decoding a base64 text file in ProgramData); a legitimate vendor-signed executable (Bitdefender bdreinit.exe, G DATA ask.exe) running from ProgramData or another non-install path next to an unsigned DLL of a generic name; an executable named w3wp.exe outside the IIS directory; erl.exe started from the SolarWinds Orion directory by a non-service parent with -setcookie and an rpc:call to a remote rabbit@ node; registry-hive save events (SAM, SYSTEM, SECURITY); and, for the AI-assistance signal itself, long multi-section PowerShell submissions with banner-style labels and no typing errors arriving through a web shell or xp_cmdshell, with a rebuilt payload minutes after each block. Benign lookalike: administrators run long labelled PowerShell inventory scripts too, so the discriminators are the parent (sqlservr.exe/w3wp.exe rather than an admin session), the credential-store targets (connection strings, FileZilla/WinSCP/PuTTY settings, LSA secrets) and the repeated relaunch of a blocked loader. Symantec gives no hardening step for the Orion/RabbitMQ hop; the registry/IOC list in the source is not reproduced. Overlap check: the Gambit Security AI-retail campaign is already in the store as 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes; this item should reference it (references[]), not duplicate it. Single independent source; the vendor holds the telemetry (Admiralty B2).

