      Telemetry hooks (from the source): egress firewall/NetFlow showing outbound UDP 443 (QUIC) from servers that never browse, since Unit 42 notes some inspection stacks are TCP-centric; Unit 42's hardening lever is to log or block outbound UDP 443 so QUIC falls back to inspectable TCP. SYSVOL and Group Policy change auditing plus EDR alerts on uncommon startup processes executing under a domain user SID at logon (the logon-script vector). rundll32.exe loading comsvcs.dll with an ordinal argument (#+000024) rather than the MiniDump name. Exchange: audit accounts holding ApplicationImpersonation and watch for Add-MailboxPermission loops granting FullAccess with -AutoMapping:$False across all mailboxes. Initial-access hardening is simply the unpatched Exchange/web-server exposure. Single vendor source, but it holds the incident-response telemetry (Admiralty B2); Check Point's earlier Ink Dragon research (https://research.checkpoint.com/2025/ink-dragons-relay-network-and-offensive-operation/ ) is named by Unit 42 as prior reporting and could corroborate the group lineage (not fetched). Naming caution: 'Ink Dragon' is Check Point's name per Unit 42's alias list; the registry's actor:jewelbug is Symantec's cluster and the registry already treats Earth Alux/REF7707 as aliases.

