  - title: "Unit 42: TGR-STA-0049 (Earth Alux, REF7707, Ink Dragon) reaches government networks through unpatched Exchange servers and web shells, then runs the new PerfectPioneer and KUKURAT implants over HTTP/3 (QUIC), spreads through domain logon scripts and grants itself FullAccess to every mailbox"
    suggested_kind: threat
    sources:
      - { url: "https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/", publisher: "Palo Alto Networks Unit 42", date: "2026-11-16", role: "primary" }
    discovery_trace: "first seen at: unit42 feed (standing look, not a slice record), URL https://unit42.paloaltonetworks.com/feed/ -> primary (no pivot needed), URL https://unit42.paloaltonetworks.com/custom-rats-target-southeast-asia-governments/"
    summary: |
      Unit 42 describes a multi-stage espionage campaign by TGR-STA-0049 (which Unit 42 says is also tracked as REF7707,
      Earth Alux and Ink Dragon; active since at least March 2023, previously the Squidoor/FINALDRAFT backdoor) against Southeast
      Asian government entities since at least July 2025; the group's targeting also includes government organizations in
      South America and Europe. Facts reported: primary access is exploitation of vulnerable, unpatched Microsoft Exchange
      servers and web servers to deploy web shells (variants of ASPXSpy, Godzilla, Bysunue.aspx and Suo5); phishing with
      decoy PDFs from lookalike government domains (executables with a PDF icon) is secondary. Two previously undocumented
      implants: PerfectPioneer RAT (Go; six variants seen since July 2025; run via DLL side-loading of a modified legitimate
      executable carrying XOR-encrypted shellcode, via decoy installers including one that ran a real GlobalProtect installer,
      or via phishing; an isDangerousCommand blocklist stops operators from running noisy or destructive commands) and its modular
      successor KUKURAT (C++, deployed from March 2026, at least 12 DLL modules fetched from the C2 and run in memory, HTTP/2
      and HTTP/3 variants, a 'heuristic camouflage' engine that generates benign-looking network, registry and file activity).
      Both use HTTP/3 over QUIC (UDP 443) as the primary C2 channel, with HTTP/2 fallback. Post-compromise: after taking a
      domain controller the actor installed malicious domain logon scripts so each user's logon pulled KUKURAT; PsExec, WMI and
      WinRM; LSASS dumping with rundll32 and comsvcs.dll invoked by ordinal (#+000024) to dodge 'MiniDump' string rules; DCSync,
      Mimikatz, ProcDump, SharpDPAPI and SAM/SYSTEM hive dumps; and on Exchange, a search for accounts holding the
      ApplicationImpersonation role followed (when none was found) by a hidden PowerShell loop that granted a compromised
      account FullAccess on every mailbox. Exfiltration targeted pdf, docx, xlsx and png files whose names suggest international
      relations and internal political affairs.
    region_nexus: "Southeast Asia (Myanmar election-commission decoy named); Unit 42 states the group also targets government organizations in South America and Europe"
    primary_sector_nexus: "direct in technique, not in named victims: government networks running on-premises Exchange and domain logon scripts"
    sector: "public-sector (government)"
