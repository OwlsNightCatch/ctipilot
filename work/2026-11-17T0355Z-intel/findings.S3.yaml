  # ------------------------------------------------------------------ 9
  - title: "Bishop Fox: Proofpoint ITM macOS agent 4.4.3.148 to 5.0.1 lets any standard user run commands as root by creating a file whose name contains a shell expansion in a OneDrive-managed folder; no fixed version or CVE yet"
    suggested_kind: vulnerability
    sources:
      - { url: "https://bishopfox.com/blog/proofpoint-itm-4-4-3-148-5-0-1", publisher: "Bishop Fox", date: "2026-11-11", role: "primary" }
    discovery_trace: "first seen at: bishopfox-blog slice record, URL https://bishopfox.com/feeds/blog.rss (lookback sweep, item 2026-11-11) -> primary (no pivot needed), URL https://bishopfox.com/blog/proofpoint-itm-4-4-3-148-5-0-1"
    summary: |
      Bishop Fox (Zachary Harding) disclosed on 2026-11-11, after finding it in July during a client assessment, a root local privilege
      escalation in the Proofpoint ITM (formerly ObserveIT) macOS agent, versions 4.4.3.148 to 5.0.1. The File Activity Monitor
      LaunchDaemon (/etc/omonitor/service, running as root) builds /bin/bash -c command strings by interpolating file paths from
      FileProvider events into double quotes; on OneDrive Known Folder Move directories a file named with a $() or backtick
      expression therefore executes as root within about a second. Two further call sites that feed paths to /usr/bin/file and
      /usr/bin/unzip -p during Microsoft Information Protection label checks on Office files share the pattern. Bishop Fox says the
      Windows agent (.NET Core with structured IPC) is not vulnerable. Timeline per Bishop Fox: reported to the vendor 2026-07-21 and
      acknowledged; public 2026-11-11; Proofpoint is its own CNA and no CVE or advisory ID had been assigned; the recommended fix is
      'update once Proofpoint releases one', with an interim of running the FAM LaunchDaemon with least privilege or disabling the File
      Activity Monitor (which removes file-activity insider-threat coverage).
    region_nexus: "global; no Swiss nexus stated"
    primary_sector_nexus: "indirect: only organizations that deploy Proofpoint ITM on macOS with OneDrive Known Folder Move"
    sector: "cross-sector"
    cves: []
    techniques: [T1068, T1059.004]
    affected_products: ["Proofpoint ITM macOS agent (formerly ObserveIT) 4.4.3.148 through 5.0.1"]
    entity_keys: []
    new_entities:
      - { key: "product:proofpoint-itm", type: product, name: "Proofpoint ITM (Insider Threat Management)", aliases: ["ObserveIT"], summary: "Proofpoint's insider-threat-management endpoint agent (formerly ObserveIT); its macOS agent 4.4.3.148 to 5.0.1 has a root command injection in the File Activity Monitor disclosed by Bishop Fox on 2026-11-11 with no fixed version announced." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "niche product (macOS ITM agent), local-only LPE, no CVE or fix yet, no exploitation reported; included because it is a public root exploit path in a security agent that runs as root on every managed Mac and Bishop Fox published the trigger details"
    evidence:
      - quote: "which allowed any standard, unprivileged user to execute arbitrary commands as root simply by creating a file with a crafted name in a OneDrive-managed directory."
        attribution: "Bishop Fox"
        source_url: "https://bishopfox.com/blog/proofpoint-itm-4-4-3-148-5-0-1"
      - quote: "Update to a version of Proofpoint ITM that remediates this issue, once Proofpoint releases one."
        attribution: "Bishop Fox"
        source_url: "https://bishopfox.com/blog/proofpoint-itm-4-4-3-148-5-0-1"
    extended_notes: |
      Exposure: read the installed ITM macOS agent version (4.4.3.148 to 5.0.1 affected per Bishop Fox) and whether OneDrive Known Folder Move covers Desktop/Documents; the Windows agent is not affected. Detection concept (mechanical from the flaw): process-creation events where the omonitor service launches /bin/bash -c with a command line containing a path with $( or backticks, and file-creation events with shell metacharacters in names under the OneDrive-managed folders (macOS endpoint telemetry). Hardening: per Bishop Fox, run the FAM daemon least-privilege or disable FAM until Proofpoint ships a fix (accepting the loss of file-activity insider-threat coverage). Check Proofpoint's own advisory page before composing; none was fetched.

