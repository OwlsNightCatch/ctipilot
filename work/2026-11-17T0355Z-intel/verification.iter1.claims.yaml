claims:
  - {claim_id: f30f67cb82, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Update every technician's ScreenConnect host client to 26.6.5 or later, and any Access agents ConnectWise lists. Updating the server alone doesn't fix this"}
  - {claim_id: b4b4257ffc, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "the Huntress SOC made strong recommendations that these affected hosts be reimaged from known-good media; UltraViewer named as a secondary RMM tool"}
  - {claim_id: 8eea7cc70f, verdict: F3, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Table starts 16:46:20.7 when the host client runs the batch file, ends 16:46:29.1; heading \"A full compromise in 9 seconds\". Nine seconds is run-to-relay, not after joining the session."}
  - {claim_id: 078df8b95e, verdict: ok, source_url: "https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869", passage: "file-transfer actions could be processed through an active remote session without proper authorization or Host confirmation ... including through elevated execution actions"}
  - {claim_id: 65cf3728cc, verdict: F13, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "The 011 state branch also includes payloads to disable Windows Defender reporting, notifications, and HVCI ... The package also includes the vulnerable WinRing0 driver as svcdrv64.sys. (no statement t"}
  - {claim_id: eac01247ef, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "Connecting to an infected ScreenConnect client can cause the server-side Host system to receive and execute the same four-stage VBScript chain."}
  - {claim_id: 7deccc6ce1, verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "CVE-2026-84869 dateAdded 2026-09-11 (catalogVersion 2026.11.13 read live); no source names an actor"}
  - {claim_id: 986d340c94, verdict: ok, source_url: "https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869", passage: "ScreenConnect servers are not impacted; CWE-862, CWE-269; 9.9 (Critical); ScreenConnect versions prior to 26.6.5"}
  - {claim_id: 0c3e4c85dc, verdict: F14, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "First incident Aug 20; UPDATE 9/3: \"On September 3, ConnectWise published an advisory\" (14 days later); CVE bulletin 9/8 (19 days). \"two and a half weeks before any advisory existed\" matches neither."}
  - {claim_id: 542c01c3b3, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "In one August 20 incident ... Quick Assist; second Aug 20 incident ... ScreenConnect.ClientSetup.msi ... launched the four VBScript files"}
  - {claim_id: 1f46a8054b, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "1.vbs profiles host (ScreenConnect install, security products, RAM over 5GB); 2.vbs/3.vbs fetch AES-encrypted bundles from Dropbox keyed to the state value"}
  - {claim_id: 3625686b0e, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "The 011 state branch ... includes wstunnel, disguised as Themes.exe ... runs an XMRig cryptocurrency miner renamed as SearchIndex.exe"}
  - {claim_id: fcf48e7abe, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "The recovered client continuously inspects ScreenConnect's EndPointStatusMessage.Connections collection ... sets its action to Run, and queues it for the connected Host"}
  - {claim_id: 956f8b1e65, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Update every technician's ScreenConnect host client to 26.6.5 or later (derived takeaway; MSP-to-public-sector chain is analyst framing)"}
  - {claim_id: 0fa454cf0d, verdict: ok, source_url: "https://www.huntress.com/blog/rogue-screenconnect-installations", passage: "clients were spawning repeated Windows Script Host (wscript.exe) child processes ... four VBScript files; file-transfer message set to Run and queued on each new Host connection"}
  - {claim_id: 528f17fdad, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "This most recent activity is distinct from a separate campaign ... crypto exchange names; SCKit ... not directly exploiting CVE-2026-84869"}
  - {claim_id: 8c3f040235, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "November 12 ... blank-named Access session ... 16:46:20.7 batch file ... 16:46:29.1 WindowsUpdate.WindowsClient.exe ... relay (p=8041)"}
  - {claim_id: 2e99051948, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Across 42 MSP ScreenConnect servers between October 20 and November 16, attacker guests made 688,000 \"run file\" requests ... 29 source IP addresses ... high confidence ... same"}
  - {claim_id: 1ed246de05, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "In three real support sessions ... attacker joined as an additional guest ... Startup/Sync.bat ... Two of the technicians were on vulnerable Windows clients while the third used the Mac client"}
  - {claim_id: 5feaf64aad, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "Updating the server alone doesn't fix this ... many technicians were still on 22.x, 24.2 and 25.8 clients weeks after the fix shipped."}
  - {claim_id: 349112b16e, verdict: ok, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "On the server (App_Data\\Session.db, work on a copy), look for RanFiles (EventType 85) or SentFiles (86) ... relay that is not yours"}
  - {claim_id: 2c62989c02, verdict: F3, source_url: "https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation", passage: "The 688,000 requests span October 20 to November 16; the Nov 12 compromise followed the 16:03 spray of update_224ac089.bat by 43 minutes, so the full count did not precede it."}
