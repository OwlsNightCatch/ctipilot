    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 2026-11-16T12:29Z) -> extract https://www.heise.de/news/BundID-Massenhafte-Angriffe-fuehren-zu-Kontosperrungen-11526376.html -> WebSearch (\"BundID Konten gesperrt automatisierte Login-Versuche BSI Cyberangriff November 2026\") -> pivot: Handelsblatt, URL https://www.handelsblatt.com/politik/deutschland/bundid-hackerangriff-auf-buergerkonten-mit-massenhaften-log-in-versuchen/100270238.html (BSI statement to Handelsblatt) -> pivot: WEB.DE, URL https://web.de/magazine/digital/bundid-konto-gesperrt-betroffene-42951652 -> pivot: ad-hoc-news aggregator, URL https://www.ad-hoc-news.de/wissenschaft/bundid-nach-angriffswelle-passwort-login-jetzt-nur-noch-mit-e-mail-code/70522344. The operator's own notice on https://id.bund.de/de was fetched but is a JavaScript shell, so its text is known only as quoted by heise and WEB.DE (no primary notice text read)."
    summary: |
      On Monday 2026-11-16 Germany's BSI confirmed to heise security and to Handelsblatt an IT security incident involving BundID, the federal citizen account used for online administrative services: automated, mass login attempts against BundID accounts. The failed attempts locked accounts, triggered automatic mails and prompted account holders to reset their passwords. The federal government switched off username-and-password sign-in on Monday morning; sign-in with the online ID card (eID) and the Elster certificate stayed possible throughout. The BSI says countermeasures, which it does not name, repelled the attack and that it has no indication that any BundID account was compromised. Handelsblatt, citing government circles, reports the pattern as credential stuffing (credentials from earlier leaks at other services replayed against BundID); that label is the reporter's attribution to unnamed officials, not a BSI statement. The number of locked accounts is not disclosed, locked accounts are not unlocked in bulk, and users must pass the password-reset flow or use another sign-in method; a support contact form handles urgent cases. Aggregator sites (boerse-global / ad-hoc-news) add that password sign-in returned the same afternoon under a mandatory one-time code sent by e-mail; no primary source read confirms that restoration.
      The defender-relevant mechanics are generic to any citizen- or employee-facing login portal: a lockout-after-N-failures control turns a credential-stuffing run into a mass-lockout and helpdesk event even when no account is taken over, and the fastest containment lever the operator used was to disable the password-only path while leaving strong-identity paths (eID, certificate) open, followed by adding a second factor to the password path.
    region_nexus: "Germany (neighbouring country); federal citizen-account portal. No Swiss involvement is reported. Transferable to Swiss federal, cantonal and communal citizen- and employee-facing login portals (analyst inference, not a source statement)."
    primary_sector_nexus: "direct (public-sector e-government identity and login service)"
    sector: "public-sector"
