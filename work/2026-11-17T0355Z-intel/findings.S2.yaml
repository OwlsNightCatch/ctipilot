      Triage value: during an outage like this, mail delays and bounces, authentication failures and stalled Teams or SharePoint sessions look like a mail-flow or identity incident; Microsoft's statement that no attack was involved, and the German federal client's stability because it does not use the Microsoft cloud, are the discriminators the sources give. Detection concept for the lure: mail-flow logs for sender display names or subjects that imitate service-health or outage notifications with a short code, links through bulk-mail click-tracking redirects, and a new-domain or low-reputation landing page; hardening: send staff to the Microsoft 365 admin center service-health view rather than to mailed links, and review Safe Links policy (sources' own advice). No indicator values are carried (IOC rule).
    borderline: true
    borderline_reason: "An availability and dependency event, not an attack: Swiss public-sector impact reported as minor (federal administration), the in-window parts are Microsoft's root-cause account (2026-11-16) and a cantonal interpellation, and the phishing lure was reported 2026-11-14/15, outside the 26 h window. Worth a short entry only for the continuity-planning and outage-lure angle."

