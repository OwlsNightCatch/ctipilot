    summary: |
      Canton Aargau, the Aargau industry and trade chamber (AIHK) and the Federal Office for Cybersecurity (BACS) held the information event 'Cyberresilienz stärkt den Kanton Aargau' on 2026-11-13 and presented the results of the BACS Cyberresilienz-Assessment (CyRA) pilot and the new cantonal cyber coordination office. CyRA is a self-assessment against six resilience objectives that looks at business-critical processes and their dependence on IT and OT; it was piloted in Aargau from mid-February to the end of March 2026. BACS director Florian Schütz, quoted by the canton, says the pilot showed that basic IT protection is in place but that a holistic, process-oriented resilience concept is missing in many organisations. BACS's July report, as Netzwoche reports it, locates the weaknesses in three areas: structured capture of IT and OT dependencies along business processes, emergency and recovery planning, and management of dependencies on external IT service providers; CyRA is still a prototype. The participant counts differ between sources: the canton says eleven communes and fourteen companies, Netzwoche (citing BACS) says 14 communes and 11 other organisations.
      The canton adds that the information-security law (InfoSiG), in force from 2027-01-01, provides for a cyber coordination office, placed at the Kantonspolizei Aargau, as the central contact point on information-security questions for communes, the population and the economy, promoting information exchange between cantonal and intercantonal bodies. The entry on the InfoSiV adoption already records the office at the cantonal police and its 2027-01-01 start; the new facts are the CyRA findings, the office's stated clientele, and the BACS-canton-chamber cooperation.
