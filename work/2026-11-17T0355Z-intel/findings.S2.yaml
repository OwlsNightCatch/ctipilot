    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'Aargau soll nach M365-Ausfall Notfallpläne prüfen', 2026-11-16) -> extract (url --direct, __NEXT_DATA__) https://www.inside-it.ch/aargau-soll-nach-m365-ausfall-notfallplaene-pruefen-20261116 -> pivot: Inside IT 2026-11-13 https://www.inside-it.ch/microsoft-panne-schraenkt-schweizer-geschaeftsalltag-ein-20261113 -> pivot: srf-news feed https://www.srf.ch/news/bnf/rss/1646 -> SRF https://www.srf.ch/news/wirtschaft/globale-panne-weltweiter-microsoft-ausfall-nun-ist-der-grund-bekannt -> pivot: heise https://www.heise.de/news/Microsoft-Ausfall-Woran-es-lag-und-wer-besonders-litt-11525257.html and https://www.heise.de/news/Phishing-Kampagne-nutzt-Microsoft-Cloud-Ausfall-11525471.html. Microsoft's own written post-incident report was searched for (two WebSearch queries) and not found, so the root cause is read through SRF and heise."
    summary: |
      A worldwide Microsoft 365 outage began on Thursday evening 2026-11-12 and ran, with partial recovery, until Saturday 2026-11-14 (heise); Outlook and Exchange Online, Teams, SharePoint and Copilot were affected in more than 70 countries (SRF). Microsoft says the cause was internal and not a cyberattack or AI activity (heise, Inside IT). On 2026-11-16 SRF reports Microsoft's fuller account: a software change to a central traffic entry point for Microsoft 365, deployed in July, carried an undetected bug that lab tests missed because they ran mostly on older hardware; it surfaced on newer, more powerful servers when Teams was moved onto the same infrastructure and about 14 percent of server capacity was already out of service; the load shift spread the same fault to the remaining machines, more than 80 percent of the responsible machines stopped responding at the peak, almost the whole system was hit within two hours, and safeguards between world regions failed. Outlook could not be rerouted, restarted servers collapsed under the queued requests, and Microsoft needed a special repair update and group-wise restarts, which is why recovery ran into Saturday. Microsoft's first statement (heise, 2026-11-14) had named a network-capacity upgrade whose introduced problem only showed after later network changes; the two accounts are worded differently and Microsoft's written report was not read.
      Swiss public-sector effects, from Inside IT relaying AWP and Keystone-SDA: the federal administration (about 44,000 staff) reported only minor performance problems in individual applications and working e-mail; ETH Zurich students were hit by Outlook, Teams and SharePoint problems; Swiss Post told customers with urgent matters to phone. On 2026-11-16 Aargau GLP Grossrat Lukas Huber announced an interpellation, to be filed on 2026-11-17, asking the Regierungsrat what the outage meant for the cantonal administration, schools and courts, how effective existing emergency measures are, and which state tasks could only be met in a restricted way or not at all in a multi-day outage of central Microsoft services. German reporting (heise, 2026-11-14) adds that the German federal client, which runs on its own infrastructure, stayed stable.
      Security angle: heise reports that Microsoft Threat Intelligence warned of phishing mails that imitate Microsoft 365 service-status messages and reference the Exchange Online incident EX1550543; some claim that mail was held during the outage and will be deleted within 24 hours unless the recipient clicks to restore it, with subject lines following an 'Outage' plus short-code pattern and display names built from organisation-specific prefixes plus 'Outage Notification' or 'Service Health'. Microsoft had not confirmed credential theft or malware delivery, says Defender for Office 365 blocks the mails, and advises checking Safe Links policies and verifying outage notices only in the Microsoft 365 admin center. The phishing detail is single-source (heise relaying a Microsoft Threat Intelligence post on Bluesky, which was not fetched).
    region_nexus: "Global event with reported Swiss public-sector impact (federal administration, ETH Zurich, Swiss Post) and a cantonal (Aargau) parliamentary follow-up"
