      Exposure/hardening carried by the post: network access to the controller's web management interface is the prerequisite; remove internet exposure, restrict to trusted IPs or a VPN, single managed entry point for remote users, change default passwords; if compromise is suspected the 13054 advisory carries the CERT-FR recovery order (restrict access, factory reset, apply fixes, rotate secrets, review accounts, reconfigure). A factory reset alone is insufficient while the device stays reachable and vulnerable.
