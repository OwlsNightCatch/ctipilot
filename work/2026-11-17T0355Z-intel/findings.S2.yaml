  - title: "BundID: automated mass logins lock German federal citizen accounts; BSI confirms the attack, password login is switched off, then reportedly restored with an e-mail second factor"
    sources:
      - { url: "https://www.heise.de/news/BundID-Massenhafte-Angriffe-fuehren-zu-Kontosperrungen-11526376.html", publisher: "heise online", date: "2026-11-16", role: "primary" }
      - { url: "https://www.handelsblatt.com/politik/deutschland/bundid-hackerangriff-auf-buergerkonten-mit-massenhaften-log-in-versuchen/100270238.html", publisher: "Handelsblatt", date: "2026-11-16", role: "primary" }
      - { url: "https://web.de/magazine/digital/bundid-konto-gesperrt-betroffene-42951652", publisher: "WEB.DE News", date: "2026-11-16", role: "corroborating" }
