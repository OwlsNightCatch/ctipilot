    summary: |
      Delta on an already-covered entry. NCSC Switzerland's Cyber Security Hub published post 13180 on 2026-11-16 (07:13 UTC): Danfoss AK-SM 800A, all versions up to and including 5.3.2, multiple pre-authentication stack buffer overflows giving root-level code execution, with persistent malicious firmware or irreversible bricking possible because the device has no Secure Boot; NCSC.ch lists the exploitation status as unknown, states "Vendor firmware updates are available" and says the recommendations of its earlier refrigeration advisory (post 13054) remain relevant. It names Midnight Blue as the source advisory and cites BSI and heise as supporting. This is the first Swiss-authority advisory covering the six flaws; the entry's current text records the Midnight Blue report through BSI, CCB and heise but cites no NCSC.ch post for it.
      Caution for the composer: the post does not say which firmware fixes the six flaws. Midnight Blue says the flaws exist in the latest firmware (5.3.2 when written) and advises against patching in place of removing internet exposure; heise reports that Danfoss shipped 5.4.0 on 2026-11-12 and that the BSI cannot rule out flaws in it either. NCSC.ch's "updates are available" therefore must not be read as "fixed".
      Separately, NCSC.ch edited its refrigeration advisory (post 13054) on 2026-11-16 to add the VulnCheck disclosure of 14 XWEB EVO CVEs (XWEB EVO end of support since 2026-03-16, no security update will follow, never expose it, at least two flaws alleged exploited after the CVEs were published on 2026-11-12); that edit is a delta for the XWEB EVO entry (2026-11-13/dixell-copeland-xweb-evo-vulncheck-cves-end-of-service), which already carries VulnCheck's own reporting.
