      Detection concept (telemetry class first): authentication and session logs on the account-login endpoint show a surge of failed password logins spread over many distinct usernames with few attempts each and many source addresses, followed by lockout-notification and password-reset mail volume and helpdesk-form volume; a lockout storm is itself the alert. Hardening levers named by the sources' account of the operator's response: disable the password-only path and keep eID/certificate sign-in, add a one-time-code second factor (reported by aggregators only). Triage note (analyst inference from the mechanism, not stated by a source): a lockout spike after a password-policy change or login-page defect looks similar; the discriminator is distinct-username breadth with source-address spread and no preceding deployment.
      The first public hints reportedly came from the Born City blog on 2026-11-14 (stated by the ad-hoc-news aggregator only; not verified). Scale unknown (one aggregator cites about 4.9 million active BundID accounts as of August 2025 via a search snippet; not fetched, not for use).
