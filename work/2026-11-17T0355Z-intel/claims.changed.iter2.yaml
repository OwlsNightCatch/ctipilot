claims:
  - claim_id: 2f1179ef31
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "actions[2]"
    kind: frontmatter
    text: "On every ScreenConnect server, read a copy of App_Data\\\\Session.db for guest-originated RanFiles or SentFiles events that overlap an open host connection, and on any hit isolate the technician's workstation and rotate every credential reachable from it (RMM, PSA, vault, customer admin accounts), because Huntress saw one workstation fully compromised nine seconds after its client ran a guest-pushed file."
  - claim_id: 7a8cc679e6
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: cited
    text: "Depending on the profile, the final PowerShell stage installs a ScreenConnect backdoor client concealed as a hidden Windows service (its registry Uninstall entry removed and a restrictive service security descriptor applied), builds a UAC-bypass helper via a hijacked `ms-settings:` protocol handler routed through `ComputerDefaults.exe`, sets `AmsiUtils.amsiInitFailed = true` to blind AMSI, adds all of `C:\\Users` as a Defender exclusion, and disables Defender reporting, notifications and Hypervisor-Protected Code Integrity; the package also drops a vulnerable WinRing0 kernel driver alongside the payload ("
    urls: ["https://www.huntress.com/blog/rogue-screenconnect-installations"]
  - claim_id: fdbe60cda3
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "ScreenConnect servers are not affected, only client versions before 26.6.5, the release that fixes CVE-2026-84869 (CWE-862 Missing Authorization, CWE-269 Improper Privilege Management, CVSS 9.9)."
  - claim_id: 3491a80055
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "Huntress had been tracking the exploitation since 20 August, more than two weeks before ConnectWise's 8 September disclosure."
  - claim_id: 5d8943aba8
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "Starting 20 August 2026, its SOC found rogue ScreenConnect clients deployed via social engineering (a fake tech-support Quick Assist session in one case, a phishing-driven MSI in another) that immediately spawned four chained VBScript stagers via `wscript.exe`."
  - claim_id: 6ddc069a14
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: uncited
    text: "The installed backdoor client is what turns the bug into a worm: it continuously inspects ScreenConnect's own connection-status collection for newly established Host sessions and, on each new connection, packages the same four VBScript stagers into a ScreenConnect file-transfer message flagged to auto-run, the exact abuse path CVE-2026-84869 patches."
  - claim_id: 122f067de2
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any MSP-managed or self-hosted ScreenConnect deployment, including the IT-service-provider chain that reaches public-sector customers, should patch to 26.6.5 immediately and treat every pre-patch client as a potential re-infection vector, not just the host that was originally targeted."
  - claim_id: 33e0a7c508
    entry: 2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
    surface: "record 2026-11-17T04:35:15Z"
    kind: record-summary
    text: "Huntress confirmed exploitation of CVE-2026-84869 against MSP technicians: on 2026-11-12 a guest-pushed batch file ran on a technician's client with no prompt and installed a rogue ScreenConnect client within about nine seconds, while attacker guests were making 688,000 run-file requests on 42 MSP servers between 2026-10-20 and 2026-11-16. Updating the server does not fix it; every technician host client must be on 26.6.5 or later."
