- code: F3
  category: claim-not-supported
  section: entries/2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router
  item: "OptimJack headline, summary, first body sentence and actions[0]"
  url_or_quote: "Since 2026-11-13, scripts served by four third-party providers (Optimizely customer project files, Kissmetrics, StorifyMe and minute-ly) have carried code that swaps cryptocurrency addresses, skims payment cards and, on iPhones, adds a router"
  summary: "Capability and date are spread across all four providers. Hudson Rock: StorifyMe, Kissmetrics and minute-ly deliver webshell/get.js, and 'A response that only delivers webshell/get.js establishes the mobile-router path, not the presence of those financial-theft modules'; the Basel capture is a StorifyMe component, so 'Basel site hit' sits under 'skim cards, swap wallets'. Ohey: the router loader started 13 Nov, and 'On 16 November the Optimizely files switched to 1688360[.]cc/track.js. That script swaps copied wallet addresses and skims card numbers'. Hudson Rock: 'Observation times do not establish the complete attack window'; minute-ly and Optimizely captures in its verified subset start 16 Nov. Fix: attribute clipper/skimmer to the Optimizely track.js payload only and state the router-only evidence for StorifyMe/Kissmetrics/minute-ly, and cite the 13 Nov start to Ohey with minute-ly undated."
