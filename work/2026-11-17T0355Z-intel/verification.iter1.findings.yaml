  section: entries/2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
  item: "actions[2]"
  url_or_quote: "On every ScreenConnect server, read a copy of App_Data\\Session.db for guest-originated file-run events (RanFiles, EventType 85, or SentFiles, 86) for update.bat-style files, marker.txt or any path containing ../ while a host connection was open; on each technician workstation that connected, look for a ScreenConnect client whose command line names a relay you do not own ..."
  summary: "Fails check 10b(b)/(c): it restates the update section's server-side and workstation detection paragraph almost verbatim as a hunting task, and runs to roughly 100 words. Keep a short do-now task (hunt Session.db for guest-originated RanFiles/SentFiles overlapping a host connection on every server, isolate and rotate credentials on any hit) and leave the artefact list to the body; the action list otherwise fits (three items)."
