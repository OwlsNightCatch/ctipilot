- code: F13
  category: analytical-link-as-fact
  section: entries/2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
  item: "HVCI disabled via the WinRing0 driver"
  url_or_quote: "and disables Defender reporting, notifications and Hypervisor-Protected Code Integrity — the last of these via a vulnerable WinRing0 kernel driver dropped alongside the payload"
  summary: "Cited source https://www.huntress.com/blog/rogue-screenconnect-installations says 'The 011 state branch also includes payloads to disable Windows Defender reporting, notifications, and Hypervisor-Protected Code Integrity (HVCI)' and, separately, 'The package also includes the vulnerable WinRing0 driver as svcdrv64.sys'. It never states the driver is how HVCI is disabled; the causal link is the entry's inference. No other cited source states it. Say the package also carries the driver, without binding it to HVCI. (Text predates this run but the entry is re-published.)"
- code: F3
  category: claim-not-supported
  section: entries/2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
  item: "update record 2026-11-17T04:35:15Z summary"
  url_or_quote: "installed a rogue ScreenConnect client within about nine seconds, after attacker guests made 688,000 run-file requests on 42 MSP servers since 2026-10-20"
  summary: "Count spliced onto another date. Huntress: the 688,000 requests span 2026-10-20 to 2026-11-16 ('Across 42 MSP ScreenConnect servers between October 20 and November 16'); the 2026-11-12 compromise followed the 16:03 UTC spray of update_224ac089.bat by 43 minutes, so the full count did not precede it. The section body states the window correctly; amend the record summary to 'while attacker guests were making 688,000 run-file requests ... between 2026-10-20 and 2026-11-16'."
- code: F3
  category: claim-not-supported
  section: entries/2026-09-12/cve-2026-84869-connectwise-screenconnect-worm-file-transfer
  item: "actions[2] justification clause"
  url_or_quote: "because Huntress saw a technician workstation fully compromised nine seconds after joining a guest session"
  summary: "(low confidence) Huntress's table starts at 16:46:20.7 when the host client runs the guest-pushed batch file and ends at 16:46:29.1 with the relay connection ('A full compromise in 9 seconds'); the join time is not in the table (the canary case has the push 2 s after the join and the run about 3 s later). Nine seconds is from file execution, as the update section itself says ('within about nine seconds' of the batch file running)."
