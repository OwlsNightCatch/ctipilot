  summary: "Unit 42 states an automatic HTTP/2 fallback only for the PerfectPioneer newhttp3 variant ('automatically falling back to HTTP/2 in the event of connection failure'). For KUKURAT it says 'two variants ... one variant leverages HTTP/2, the other uses HTTP/3' (separate builds, no fallback described), and the RatAAkk-tt and PerfectRat PerfectPioneer variants 'rely strictly/solely on HTTP/2'. Scope the fallback to PerfectPioneer newhttp3 and say KUKURAT ships HTTP/2 and HTTP/3 variants."
