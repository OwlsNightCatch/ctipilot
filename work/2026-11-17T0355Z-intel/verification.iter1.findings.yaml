- code: F9
  category: surface-contradiction
  section: entries/2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
  item: "headline 'password sign-in switched off' and Defender takeaway 'the operator contained the run by switching off the password-only path'"
  url_or_quote: "BundID: mass automated logins lock citizen accounts; BSI confirms, password sign-in switched off"
  summary: "(low confidence) The run read an aggregator (ad-hoc-news.de / boerse-global, in bodies/9f9af8f4af.md, S2 findings) that says 'Am Nachmittag wurde der reguläre Login per Passwort unter dieser neuen Zwei-Faktor-Pflicht wieder freigeschaltet' (password sign-in re-enabled the same afternoon with an e-mail one-time code), published 2026-11-16 19:31 local. heise's notice (12:29 UTC) says it was switched off. The entry states the shutdown as the current state without a time stamp and without a Contradiction line. I could not corroborate the restoration (id.bund.de is a JavaScript shell; no primary), so the fix is to time-stamp the shutdown to heise's report and add a one-sentence caveat that a low-grade aggregator reports a same-day restoration with an e-mail code, unconfirmed."
- code: F18
