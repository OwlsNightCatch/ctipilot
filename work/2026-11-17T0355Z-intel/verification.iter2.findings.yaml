- code: F3
  category: claim-not-supported
  section: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router (frontmatter summary)
  item: "OptimJack: poisoned scripts served by Optimizely, Kissmetrics, StorifyMe and minute-ly ..."
  url_or_quote: "Hudson Rock recovered nine poisoned vendor files and matched archived responses on 21 named sites, among them the University of Basel's StorifyMe widget"
  summary: "(low confidence) Hudson Rock (https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/) matched archived response hashes for Kirk's 15 captures (16 vendor responses); the 21 named web properties combine nine properties from eight directly recovered Optimizely assets with 12 added by Kirk's archive check ('Together, the two tables identify 21 named web properties'). Hootsuite, Talkwalker, Virgin Media O2, Stamps.com, Tricentis and HSBC UAE rest on direct recovery, not an archive-hash match. The body paragraph states it correctly (16 responses from 15 captures, names 21 properties); the summary should say 'names 21 web properties'."
- code: F3
  category: claim-not-supported
  section: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router (body, Exposure)
  item: "**Exposure:** any page that loads Optimizely project JavaScript from cdn.optimizely.com, Kissmetrics i.js ..."
  url_or_quote: "what counts is the file the browser receives, not the provider's console ([Hudson Rock, 2026-11-16](https://www.infostealers.com/article/poisoned-scripts-on-bbc-zoom-and-other-major-websites-linked-to-iphone-exploit-loaders/))"
  summary: "(low confidence) Hudson Rock says 'Verify what visitors actually receive after changes' and 'containment should verify removal of the injected project code and the bytes delivered to visitors'; the page never mentions a provider console or dashboard (grep: no match). The contrast clause is the entry's gloss attached to a citation that does not state it. Fix: drop 'not the provider's console' or state it without the citation."
- code: F3
  category: claim-not-supported
  section: 2026-11-17/optimjack-poisoned-vendor-scripts-skimmer-iphone-router (sources[1].date and nine inline citation labels)
  item: "Ohey (Kirk), living page read through 2026-11-17"
  url_or_quote: "[Ohey, 2026-11-05](https://ohey.ca/threats/ios-exploits/darksword/)"
  summary: "(low confidence) The date label is not the page's own date. Raw HTML of https://ohey.ca/threats/ios-exploits/darksword/ has no datePublished, dateModified, article:published_time or visible dateline (JSON-LD WebPage block carries no date field); the extractor's 2026-11-05 comes from the body sentence 'On 5 November 2026 its switch ... read enabled: false'. The label is attached to events the page dates 13, 15, 16 and 17 November, so it reads as a source published 8 to 12 days before the events it reports, and the sourcing_note sentence 'carries no dateline of its own, so its citations use the page date' is self-contradictory. The latest date the page text itself carries is 17 November (counted on 16 November; 'still there on 17 November'). Fix by a date the page text carries (2026-11-17) with the existing living-page note, or drop the date from the prose label; do not keep 2026-11-05."
- code: F9
  category: surface-contradiction
  section: 2026-11-17/tgr-sta-0049-perfectpioneer-kukurat-quic-c2-government (body, summary and registry malware:perfectpioneer-rat)
  item: "Unit 42: TGR-STA-0049 uses QUIC C2, logon-script spread and Exchange FullAccess loops against governments"
  url_or_quote: "Unit 42 says both families use HTTP/3 over QUIC as the primary command channel, with an automatic HTTP/2 fallback in the PerfectPioneer variant it analyzes and separate HTTP/2 and HTTP/3 builds of KUKURAT"
  summary: "(low confidence) Unit 42's body says 'Both PerfectPioneer RAT and KUKURAT use HTTP/3 as the primary method', but its variant appendix says the RatAAkk-tt variant 'relies strictly on HTTP/2' and PerfectRat 'relies solely on HTTP/2' (two of the six variants; rat_http3_ls and Pioneer are 'HTTP/3 only'). The entry carries the generalisation (summary 'use HTTP/3 over QUIC as the main command channel', registry summary of malware:perfectpioneer-rat 'HTTP/3 over QUIC as its primary command channel') and the Detection line leads with UDP 443 egress, which does not cover the HTTP/2-only variants or the KUKURAT HTTP/2 build. Add one clause naming the HTTP/2-only variants and that UDP 443 telemetry will not see them."
- code: F9
  category: surface-contradiction
  section: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts (title, sources[3], sourcing_note)
  item: "BundID: automated mass login attempts against Germany's federal citizen accounts lock accounts; the BSI confirms the attack, password sign-in is switched off and no compromise is evidenced"
  url_or_quote: "An aggregator reports that password sign-in returned the same afternoon behind a mandatory e-mail one-time code ... [Handelsblatt] citing government circles, describes the attack as credential stuffing"
  summary: "(low confidence) Two residuals after the iteration-1 fix. (a) The cited aggregator (https://www.ad-hoc-news.de/wissenschaft/bundid-nach-angriffswelle-passwort-login-jetzt-nur-noch-mit-e-mail-code/70522344) says 'Nach Angaben des BSI handelte es sich beim Angriffsmuster um sogenanntes Credential Stuffing', while the entry and its sourcing_note say the label is Handelsblatt's from unnamed government sources and not a BSI statement (heise's BSI quotes do not contain it); the entry silently resolves the conflict although it lists the aggregator as a source. (b) The title still states 'password sign-in is switched off' in the present tense, while the body now reports a same-day restoration. Fix: one clause that the aggregator attributes the label to the BSI and heise/Handelsblatt do not; date or past-tense the title."
- code: F11
  category: editorial-advisory
  section: 2026-11-17/gtig-ai-threat-tracker-nov-2026-exploit-agent-settings (body para 1)
  item: "Three findings in GTIG's quarterly update on adversary use of AI, published 2026-11-16, change what defenders can look for"
  url_or_quote: "Three findings in GTIG's quarterly update ... ([GTIG, 2026-11-16](https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/))"
  summary: "(low confidence) The count is the entry's own selection (GTIG lists five key trends), but the sentence reads as a GTIG count and ends in a GTIG citation. 'Three findings from GTIG's quarterly update' or dropping the number removes the ambiguity. Iteration 1's F14 fix is acceptable; this is advisory."
- code: F11
  category: editorial-advisory
  section: 2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts (Defender takeaway)
  item: "the operator's first containment, as heise and Handelsblatt report it, was to switch off the password-only path while eID and other stronger sign-in means stayed open"
  url_or_quote: "eine Anmeldung über eID oder andere Zugangsmittel ist weiterhin möglich"
  summary: "(low confidence) heise says eID 'or other access means' stayed possible; 'stronger' is the entry's characterisation, and Handelsblatt (co-cited as a reporter of this sentence) does not mention eID. 'first' is also the entry's inference. Reword to 'while eID and other sign-in means stayed open'."
- code: F11
