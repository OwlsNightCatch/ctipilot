  - {claim_id: 5d8943aba8, passage: 'This attack likely started with phishing, which led to the victim executing `ScreenConnect.ClientSetup.msi` from a Microsoft Edge download directory.', source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 1f46a8054b, passage: The RAM check is most likely a way to help ensure that this is running on a real machine and not a Virtual Machine with a minimal amount of memory for research purposes., source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 3625686b0e, passage: and runs an XMRig cryptocurrency miner renamed as `SearchIndex.exe`., source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 6ddc069a14, passage: 'The recovered client continuously inspects ScreenConnect''s `EndPointStatusMessage.Connections` collection and filters for newly observed Host sessions:', source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 122f067de2, passage: Update every technician's ScreenConnect host client to 26.6.5 or later, source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 0fa454cf0d, passage: 'Figure 13: The client packages the VBScript stagers into a ScreenConnect file-transfer message, sets its action to Run, and queues it for the connected Host.', source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 528f17fdad, passage: we reported on November 13 that planted unauthorized guest sessions disguised with crypto exchange names on more than 100 MSP ScreenConnect servers., source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: F3}
  - {claim_id: 8c3f040235, passage: 'On November 12, we observed a technician at one MSP using their ScreenConnect host client to join a blank-named Access session on the MSP''s server.', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 2e99051948, passage: 'Across 42 MSP ScreenConnect servers between October 20 and November 16, attacker guests made 688,000 "run file" requests', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 1ed246de05, passage: 'Two of the technicians were on vulnerable Windows clients while the third used the Mac client, where a Windows Startup path failed.', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 5feaf64aad, passage: 'In the cases discussed in this post, many technicians were still on 22.x, 24.2 and 25.8 clients weeks after the fix shipped.', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 349112b16e, passage: 'On the server (`App_Data\Session.db`, work on a copy), look for `RanFiles` (`EventType 85`) or `SentFiles` (86) events sent by a guest connection (`ProcessType = 2`)', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
