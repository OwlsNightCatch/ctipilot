claims:
  - {claim_id: f30f67cb82, passage: 'Updating the server alone doesn''t fix this, because the vulnerable code runs on the technician''s machine.', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: b4b4257ffc, passage: Connecting to an infected ScreenConnect client can cause the *server-side* Host system to receive and execute the same four-stage VBScript chain., source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: 2f1179ef31, passage: 'Rotate every credential that was reachable from that workstation: RMM, PSA, ScreenConnect, password vault, and customer admin accounts.', source_url: 'https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation', verdict: ok}
  - {claim_id: 078df8b95e, passage: contained a client-side file-transfer handling condition in which file-transfer actions could be processed through an active remote session without proper authorization or Host confirmation., source_url: 'https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869', verdict: ok}
  - {claim_id: 7a8cc679e6, passage: Set `AmsiUtils.amsiInitFailed = true` for an AMSI bypass attempt, source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
  - {claim_id: eac01247ef, passage: 'This creates a worm-like behavior: propagating infections over new ScreenConnect connections.', source_url: 'https://www.huntress.com/blog/rogue-screenconnect-installations', verdict: ok}
