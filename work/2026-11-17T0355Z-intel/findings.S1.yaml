    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Craft CMS 4.0.0 before 4.18.9 and 5.0.0 before 5.11.2 contains an unauthenticated SQL injection vulnerability in the element search endpoint because the attribute parameter is concatenated into the query unsanitized and emulated PDO prepares allow stacked statements."
        attribution: "VulnCheck (CNA advisory)"
        source_url: "https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint"
      - quote: "This advisory is in the VulnCheck KEV database"
        attribution: "VulnCheck (CNA advisory)"
        source_url: "https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint"
      - quote: "Open source reporting indicates that CVE-2026-123488 is exploited in the wild."
        attribution: "Canadian Centre for Cyber Security (AV26-1086, Update 1)"
        source_url: "https://cyber.gc.ca/en/alerts-advisories/craft-cms-security-advisory-av26-1086"
      - quote: "The write primitive was used to set the admin flag on user ID 1 in the users table"
        attribution: "Craft CMS (GHSA-qcvp-ggx3-97r6)"
        source_url: "https://github.com/craftcms/cms/security/advisories/GHSA-qcvp-ggx3-97r6"
    extended_notes: |
      Contradiction held open: CCCS and VulnCheck say exploited; ENISA's record shows no exploitation date and CISA KEV (catalogVersion 2026.11.13) does not list it; the CCCS
      attribution is "open source reporting" with no named source. Treat exploitation as claimed. Detection concept: web access logs on front-end search
      routes for query strings carrying a bracketed attribute token (the token Craft's workaround blocks), database audit for changes to the users
      table admin flag or password hashes, and new administrator sessions or accounts afterwards. Post-patch: upgrading closes the injection but not an
      administrator account or hash already written. Mapping of Craft's GHSA (no CVE on its page) to CVE-2026-123488 comes from the EUVD record's
      references; Craft describes the front-end craft.search path, VulnCheck the element search endpoint.
      Candidate source: github.com/craftcms/cms/security/advisories (reads with WebFetch).

  - title: "NoisyTCP, CVE-2026-99288: unauthenticated remote kernel panic on Linux servers through a SYN-cookie request-socket race; upstream fix of 2026-11-03, researcher advisory published 2026-11-15"
    sources:
      - { url: "https://github.com/V4bel/NoisyTCP", publisher: "Hyunwoo Kim (researcher advisory, V4bel/NoisyTCP)", date: "2026-11-15", role: "primary" }
      - { url: "https://access.redhat.com/security/cve/cve-2026-99288", publisher: "Red Hat (CVE-2026-99288)", date: "2026-11-10", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/linux/new-noisytcp-linux-kernel-flaw-lets-attackers-crash-servers/", publisher: "BleepingComputer", date: "2026-11-16", role: "corroborating" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-121963", publisher: "ENISA EUVD (EUVD-2026-121963)", date: "2026-11-10", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed, URL https://www.bleepingcomputer.com/feed/ (item 'New NoisyTCP vulnerability lets attackers crash Linux servers', 2026-11-16) → pivot: BleepingComputer article https://www.bleepingcomputer.com/news/linux/new-noisytcp-linux-kernel-flaw-lets-attackers-crash-servers/ → primary: researcher advisory https://github.com/V4bel/NoisyTCP and Red Hat https://access.redhat.com/security/cve/cve-2026-99288 (extract) → EUVD https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-121963"
    summary: |
      CVE-2026-99288 is a race in the Linux kernel TCP receive path: lockless established-socket lookups can retain the address of a request socket that another
      receive context frees and reallocates as a SYN-cookie request with the same tuple, after which the stale lookup dereferences a missing listener and
      panics the kernel (the upstream fix is titled "inet: reject unhashed sockets during established lookups"). The flaw was introduced in 2015 and is
      fixed in mainline commit 4e2b3ef19e0e of 2026-11-03, so it reaches almost every distribution kernel until each vendor ships the fix. Per the researcher it
      is reachable pre-authentication against any plain TCP listener, such as Nginx, Apache or SSH in default configuration, on hosts with two or more RX queues or RPS
      spreading packets across CPUs, and needs IPv4 fragments and regular TCP packets for the same tuple to steer the race: seconds to two minutes on
      VMs, about 14 hours on a quiet 8-queue bare-metal server in the researcher's test. A container's crash takes down the whole host. Impact is denial of service;
      a use-after-free path exists but is described as hard to trigger, and the researcher has not published a general exploit ("a very limited,
      lab-specific exploit that targets VM servers"). Red Hat rates it Important. Mitigations from the researcher and Red Hat: disable SYN cookies
      (per network namespace, which weakens SYN-flood protection) or reduce the receiving interface to one RX queue with RPS and RFS off.
    region_nexus: "global; any Linux server estate, including Swiss public-sector web and mail frontends"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-99288]
    techniques: [T1499.004]
    affected_products: ["Linux kernel"]
    entity_keys: ["product:linux-kernel"]
    new_entities:
      - { key: "trend:noisytcp-linux-kernel-tcp-syn-cookie-race-dos", type: trend, name: "NoisyTCP", aliases: ["CVE-2026-99288"], summary: "Name given by researcher Hyunwoo Kim to a Linux kernel TCP SYN-cookie request-socket race that crashes servers remotely before authentication (researcher advisory, 2026-11-15; fix merged 2026-11-03)." }
    relation_suggestions:
      - { subject: "trend:noisytcp-linux-kernel-tcp-syn-cookie-race-dos", object: "product:linux-kernel", basis: "researcher advisory and Red Hat: flaw in the Linux kernel TCP networking subsystem (Hyunwoo Kim, 2026-11-15; Red Hat, 2026-11-10)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Against Nginx running with its default configuration on a quiet bare-metal server (8 RX queues), it took about 14 hours to trigger, even though a PoC with race timing carefully tuned for the target environment was used."
        attribution: "Hyunwoo Kim (NoisyTCP advisory)"
        source_url: "https://github.com/V4bel/NoisyTCP"
      - quote: "Not yet. and basically, no. So far I have only written a very limited, lab-specific exploit that targets VM servers."
        attribution: "Hyunwoo Kim (NoisyTCP advisory)"
        source_url: "https://github.com/V4bel/NoisyTCP"
      - quote: "This vulnerability is rated as an Important impact because an unauthenticated remote attacker can trigger an immediate operating system crash across the network without requiring privileges."
        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/cve-2026-99288"
    extended_notes: |
      No exploitation reported. Detection: unexplained kernel panics or reboots on internet-facing Linux hosts, with kdump or console traces ending in a NULL
      dereference in the TCP receive path, and, before a crash, bursts of IPv4 fragments mixed with TCP packets for one tuple. Triage: an isolated reboot on a
      busy VM is the likelier lookalike of a hardware or hypervisor fault; repeated panics that follow inbound connection bursts on a listener match this
      mechanism. Hardening beyond the two mitigations: kernel updates from the distribution once it carries the 2026-11-03 fix (the NVD or distribution
      score is not yet published; EUVD shows 0.0 unscored).

