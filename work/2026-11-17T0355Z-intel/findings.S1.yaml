      from R2023x through R2026x. CVE-2026-93664 is a deserialization of untrusted data that "could lead to an unauthenticated remote code execution"
      (CVSS 3.1 10.0, network, no privileges, no user interaction, scope changed per the ENISA record); CVE-2026-19732 and CVE-2026-77033 are OS command injections that
      could let an attacker run commands on the server (9.9 each, low privileges required). The advisory pages state affected releases and the Critical
