  - title: "Craft CMS unauthenticated SQL injection CVE-2026-123488 (admin takeover): CCCS relays open-source reporting of exploitation and VulnCheck lists it in its KEV; fixed in 4.18.9 and 5.11.2"
    lookback: true
    sources:
      - { url: "https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint", publisher: "VulnCheck (CNA advisory)", date: "2026-11-06", role: "primary" }
      - { url: "https://github.com/craftcms/cms/security/advisories/GHSA-qcvp-ggx3-97r6", publisher: "Craft CMS (GHSA-qcvp-ggx3-97r6)", date: "2026-10-22", role: "primary" }
