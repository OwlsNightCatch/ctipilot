      - { url: "https://github.com/craftcms/cms/security/advisories/GHSA-mjj9-pjh4-r48g", publisher: "Craft CMS (GHSA-mjj9-pjh4-r48g, GraphQL SQL injection)", date: "2026-10-22", role: "corroborating" }
    discovery_trace: "first seen at: cccs-alerts, URL https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en (AV26-1086 'Update 1' of 2026-11-12) → pivot: CCCS page https://cyber.gc.ca/en/alerts-advisories/craft-cms-security-advisory-av26-1086 (links the craftcms/cms advisories) → WebSearch ('Craft CMS CVE-2026-123488 exploited in the wild') → primary: VulnCheck CNA advisory https://www.vulncheck.com/advisories/craft-cms-4.0.0-before-4.18.9-sql-injection-via-element-search-endpoint and Craft's GHSA https://github.com/craftcms/cms/security/advisories/GHSA-qcvp-ggx3-97r6 (WebFetch); EUVD https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-118288 ties the two together"
    summary: |
      Craft CMS 4.0.0 to 4.18.8 and 5.0.0 to 5.11.1 contain an unauthenticated SQL injection in front-end search: the attribute parameter is concatenated
      into the query unsanitized and emulated PDO prepares allow stacked statements, which gives read and write access to the application database
      (VulnCheck, the CNA, scores it CVSS 4.0 9.3; ENISA carries CVSS 3.1 9.8). Craft's own advisory (Critical, 2026-10-22) says the write primitive was used to set the admin flag on user ID 1 and could
      overwrite any account's password hash, so an unauthenticated visitor can become an administrator; it applies to MySQL and MariaDB only. Fixed in
      4.18.9 and 5.11.2; Craft's temporary workaround is blocking front-end requests whose query string carries the bracketed attribute token. The
      exploitation status rests on two claims: the Canadian Cyber Centre's 2026-11-12 update says open-source reporting indicates exploitation in the wild,
      and VulnCheck's advisory page states the CVE is in its own KEV; no first-hand telemetry, victim statement or CISA or ENISA listing was found
      (EUVD shows no exploitation date), public proof-of-concept repositories date from 2026-11-06 to 09 and a Nuclei template from 2026-11-15 per
      aggregators. Two further unauthenticated SQL injections are fixed in the same releases, among them a GraphQL eager-load flaw (Craft GHSA, High) that exposes
      password hashes and session tokens when a public GraphQL schema grants anonymous read.
    region_nexus: "global; Craft CMS is a common agency-built website platform in German-speaking Europe (Swiss public-sector use not established)"
    primary_sector_nexus: "indirect (public websites)"
    sector: "public-sector"
