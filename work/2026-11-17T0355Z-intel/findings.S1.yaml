  - title: "Control Web Panel recovery-code flaws CVE-2026-124020 and CVE-2026-124021: VulnCheck publishes exploit modules for a hosting panel with about 124,000 exposed instances; fixed in 1.30.6"
    sources:
      - { url: "https://www.vulncheck.com/blog/control-web-panel-recovery-code-rce", publisher: "VulnCheck", date: "2026-11-16", role: "primary" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-125801", publisher: "ENISA EUVD (EUVD-2026-125801)", date: "2026-11-13", role: "corroborating" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-125803", publisher: "ENISA EUVD (EUVD-2026-125803)", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: vulncheck (WebFetch of https://www.vulncheck.com/blog, post of 2026-11-16) → primary: https://www.vulncheck.com/blog/control-web-panel-recovery-code-rce (extract) → EUVD records found by search?text=CVE-2026-124020 and CVE-2026-124021"
    summary: |
      VulnCheck, as CNA, disclosed two Control Web Panel (formerly CentOS Web Panel) flaws on 2026-11-16 that both end in code execution as the hosting account from one
      primitive, a password-recovery code. CVE-2026-124020 builds the reset link from the unauthenticated Host header, so an attacker who knows an account name and its contact
      email can redirect the link, capture the code, reset the password and run a cron-scheduled PHP callback through File Manager; the public user panel is the
      reachable surface. CVE-2026-124021 lets the port 2304 administration API accept a recovery code as authorization, with a daily signature built from values readable off the TLS certificate
      (applies only where the API is deliberately exposed, since the standard CSF firewall configuration blocks it). Fixed in Control Web Panel 1.30.6; before
      updating, keep port 2304 off the internet and restrict the user panel. VulnCheck confirms about 124,000 internet-facing instances and ships go-exploit
      modules for both; both CVSS 4.0 9.2 in the ENISA records; no exploitation reported.
    region_nexus: "global; hosting providers and small web hosters (Swiss public-sector use not established)"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-124020, CVE-2026-124021]
    techniques: [T1190, T1053.003]
    affected_products: ["Control Web Panel (CentOS Web Panel)"]
    entity_keys: []
    new_entities:
      - { key: "product:control-web-panel", type: product, name: "Control Web Panel", aliases: ["CWP", "CentOS Web Panel"], summary: "Hosting control panel with two recovery-code flaws (CVE-2026-124020, CVE-2026-124021) fixed in 1.30.6 and disclosed with public exploit modules (VulnCheck, 2026-11-16)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "public exploit modules and a large exposed base, but a hosting panel with no established Swiss public-sector footprint, requires a known account name and email, and no exploitation reported"
    evidence:
      - quote: "Control Web Panel 1.30.6 fixes both."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/control-web-panel-recovery-code-rce"
      - quote: "VulnCheck Target Intelligence, which fingerprints products from real scan data, confirms roughly 124,000 internet-facing CWP instances"
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/control-web-panel-recovery-code-rce"
      - quote: "CVE-2026-124021 is narrower by design, since CSF blocks port 2304 by default; it applies to the deliberately API-enabled subset"
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/control-web-panel-recovery-code-rce"
    extended_notes: |
      Detection concept: password-reset requests to the lost-password route whose Host header differs from the server's configured hostname; recovery-code
      rows spent against the administration API; new cron entries written for hosting accounts; PHP files appearing under account tmp directories.

