items:
  - title: "FortiOS HA command-execution flaw FG-IR-26-273 (CVE-2026-126259): Fortinet's 2026-11-16 revision adds FGCP clusters, an HA hardening configuration and a virtual patch"
    sources:
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-273", publisher: "Fortinet PSIRT (FG-IR-26-273)", date: "2026-11-16", role: "primary" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-123906", publisher: "ENISA EUVD (EUVD-2026-123906)", date: "2026-11-16", role: "corroborating" }
    discovery_trace: "first seen at: fortinet-psirt RSS, URL https://filestore.fortinet.com/fortiguard/rss/ir.xml (item FG-IR-26-273 'Revised on 2026-11-16') → primary: Fortinet PSIRT, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-273 (extract) → EUVD record found by search?text=CVE-2026-126259, URL https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-123906 (dateUpdated 2026-11-16)"
    summary: |
      Fortinet revised FG-IR-26-273 on 2026-11-16 ("Added additional information"). The advisory describes a missing-authentication flaw (CWE-306,
      CVSS 3.1 9.0) in FortiOS high availability: an unauthenticated attacker with HA FGSP plus standalone-config-sync, or in an autoscale
      deployment, can run commands as super admin through crafted HA packets. New in the revision: FortiGate HA clusters running FGCP (active-passive and
      active-active) are also affected on vulnerable pre-fix builds, with the condition that exploitation needs an attack vector adjacent to the HA
      segment; Fortinet adds a hardening configuration for fixed builds where the HA layer-2 segment is not fully trusted (HA password with
      encryption and authentication enabled for FGCP and standalone-config-sync; additionally an encryption setting and pre-shared secret on the
      standalone-cluster object for FGSP peers; a pre-shared secret on the autoscale object); and a virtual patch, FG-VD-61445.0day, shipped in FMWP
      database update 26.082. Affected and fixed builds per the advisory table: FortiOS 8.0.0 (fixed in 8.0.1 or above), 7.6.0 to 7.6.7 (7.6.8), 7.4.0 to 7.4.12
      (7.4.13), 7.2.0 to 7.2.13 (7.2.14); 7.0, all versions, must migrate. Fortinet credits its own Product Security team for internal discovery
      (the page names an AI model as the tool used) and states no exploitation. One inconsistency a reader should know: the CVSS vector in the CVE record
      mirrored by ENISA reads network attack vector with no privileges, while the revised page limits exploitation to the HA segment.
    region_nexus: "global; FortiGate HA pairs are common in Swiss federal, cantonal and communal perimeters"
    primary_sector_nexus: "direct (public-sector perimeter firewalls)"
    sector: "public-sector"
    cves: [CVE-2026-126259]
    techniques: [T1210]
    affected_products: ["Fortinet FortiOS"]
    entity_keys: ["product:fortinet-fortios"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: "update-of:2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail"
    evidence:
      - quote: "FortiGate HA clusters running FGCP (both active-passive and active-active) are also affected on vulnerable pre-fix versions. However, exploitation requires HA-segment adjacent attack vector."
        attribution: "Fortinet PSIRT (FG-IR-26-273)"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-273"
      - quote: 'Virtual Patch named "FG-VD-61445.0day." is available in FMWP db update 26.082'
        attribution: "Fortinet PSIRT (FG-IR-26-273)"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-273"
      - quote: "2026-11-16: Added additional information"
        attribution: "Fortinet PSIRT (FG-IR-26-273)"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-273"
    extended_notes: |
      Exposure: the advisory scopes exposure by HA mode (FGCP; standalone-config-sync with or without FGSP peers; autoscale) and by who can reach the HA
      layer-2 segment, so the question for a defender is which clusters share an HA or sync segment with anything less trusted than the firewalls
      themselves. Detection concept (follows from the mechanism, not stated by Fortinet): HA-protocol frames or config-sync traffic on the heartbeat
      segment from a source that is not a cluster member, and unexpected HA state changes or administrator-context command execution on a member shortly
      after. Post-patch: the hardening settings are separate from the fix, so upgrading does not by itself authenticate the HA channel. The existing entry
      says the October builds are 8.0.2, 7.6.8, 7.4.13 and 7.2.14; for this row the advisory table lists 8.0.1 or above for the 8.0 branch.

