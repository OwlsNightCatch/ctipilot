      - quote: "This attack geography, combined with the use of the ValleyRAT backdoor, points to Silver Fox, a known operator of this malware family, as the likely group behind the campaign."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/valleyrat-backdoor-adware/121175/"
      - quote: "Over the course of 2026, we detected the ValleyRAT backdoor and its associated malware more than 100,000 times, with more than 1500 unique users affected, primarily in China and India."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/valleyrat-backdoor-adware/121175/"
      - quote: "After unpacking, the installer uses the DisableAntiSpyware registry key to disable Windows Defender and then launches QnWallpaper.exe."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/valleyrat-backdoor-adware/121175/"
    extended_notes: |
      Detection angle for a SOC: process-creation telemetry showing QnWallpaper.exe or QnwPlayer.exe (or any
      unexpected signed-but-uncommon binary) loading a libcef.dll from a non-browser install path, followed by
      a child svchost.exe whose memory region toggles from PAGE_NOACCESS to RWX shortly after creation, is a
      strong discriminator — legitimate Chromium Embedded Framework consumers do not exhibit that memory
      protection flip. A process that both disables Windows Defender via DisableAntiSpyware and marks itself
      critical (CriticalProcessFlag) in the same execution chain is a near-unambiguous malicious indicator with
      very low false-positive risk from legitimate administration tooling. Hardening lever: block installation
      of unmanaged desktop-customization/wallpaper utilities via application allow-listing, since the technique
      depends entirely on the user being permitted to install arbitrary signed third-party software.

  - title: "Infostealers are now specifically monetized against GenAI subscriptions: Anthropic mass-revokes Claude sessions hijacked via Vidar/LummaC2/StealC/RedLine/Acreed/AMOS"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-warns-infostealer-malware-is-hijacking-claude-sessions-to-drain-usage/", publisher: "BleepingComputer", date: "2026-08-30", role: primary }
      - { url: "https://www.helpnetsecurity.com/2026/08/31/claude-accounts-compromised-through-infostealer/", publisher: "Help Net Security", date: "2026-08-31", role: corroborating }
      - { url: "https://www.darkreading.com/cyberattacks-data-breaches/anthropic-users-infostealer-attacks-session-thefts", publisher: "Dark Reading", date: "2026-08-31", role: corroborating }
    discovery_trace: "first seen at: darkreading, URL https://www.darkreading.com/rss.xml (feed item \"Anthropic Users Hit by Infostealer Attacks, Session Thefts\") → drilled: https://www.darkreading.com/cyberattacks-data-breaches/anthropic-users-infostealer-attacks-session-thefts → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-warns-infostealer-malware-is-hijacking-claude-sessions-to-drain-usage/ → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/08/31/claude-accounts-compromised-through-infostealer/"
    summary: |
      Anthropic began emailing affected users in the week of 2026-08-24 to say a threat actor had stolen active
      Claude (claude.ai) login sessions using general-purpose infostealer malware already resident on those
      users' machines, then replayed the stolen session cookies to access the accounts and consume paid usage
      — surfacing to defenders when a user's usage allotment "refilled and then drained" without the
      subscriber using the service. Anthropic names the malware families involved as Vidar, Lumma (LummaC2),
      StealC, RedLine and Acreed on Windows, and Atomic Stealer (AMOS) on a small number of Macs — all
      commodity infostealers whose logs are traded on criminal markets. Anthropic states the infection vector
      is unrelated to Claude itself (typically an unofficial download or malicious app); the case that surfaced
      publicly traced to a pirated-game download. Because a stolen browser session cookie authenticates as an
      already-logged-in user, the attacker bypassed password and 2FA entirely — a textbook instance of session-
      hijacking superseding credential theft as infostealer-driven account takeover has to contend with
      broader MFA adoption. Anthropic's remediation was to invalidate the stolen sessions (forcing re-login),
      strip saved payment methods from affected accounts, and refund unauthorized charges; it explicitly warns
      that signing a user out does not remove the infostealer, so an unremediated host will have its next
      session stolen the same way.
    region_nexus: "global; no jurisdiction-specific victim data disclosed, but any organization whose staff hold individual or team Claude subscriptions is in scope — includes staff using Claude for coding/analysis on personal or under-managed devices"
