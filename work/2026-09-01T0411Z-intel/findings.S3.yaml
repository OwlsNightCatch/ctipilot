items:
  - title: "ValleyRAT/Winos4.0 hides inside a re-signed Chinese wallpaper app: DLL sideloading through libcef.dll, a self-restoring svchost injection, and a kill switch for Windows Defender"
    sources:
      - { url: "https://securelist.com/valleyrat-backdoor-adware/121175/", publisher: "Kaspersky Securelist", date: "2026-08-31", role: primary }
      - { url: "https://thehackernews.com/2026/08/valleyrat-backdoor-hides-in-signed.html", publisher: "The Hacker News", date: "2026-08-31", role: corroborating }
      - { url: "https://securityaffairs.com/", publisher: "Security Affairs (listing)", date: "2026-08-31", role: discovery }
    discovery_trace: "first seen at: securityaffairs, URL https://securityaffairs.com/ (front-page blurb naming ValleyRAT/Silver Fox) → pivot: WebSearch (\"ValleyRAT Silver Fox adware DLL sideloading securityaffairs\") → primary: Kaspersky Securelist, URL https://securelist.com/valleyrat-backdoor-adware/121175/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/08/valleyrat-backdoor-hides-in-signed.html"
    summary: |
      Kaspersky's Securelist documents a ValleyRAT (Winos 4.0) distribution chain hidden inside a re-signed
      copy of QN Wallpaper, a genuine Chinese adware-bundling desktop-wallpaper tool. An installer whose
      filename carries a two-letter decoy suffix (opens DingTalk, Chrome, or a Tencent Meeting page to
      distract the user) drops a modified QN Wallpaper build to
      C:\Program Files\QNWallpaper\5.4.0.1662\<random>\ and adds it to autorun. Before launching the adware,
      it flips the DisableAntiSpyware registry key to turn off Windows Defender. QnWallpaper.exe then loads a
      malicious libcef.dll placed alongside it — classic DLL side-loading under a signed, trusted process —
      which decrypts an AES-encrypted ValleyRAT payload (delivered either as a bundled PeLoader file or from
      the DLL's own resources) and hands it control via DllMain. ValleyRAT's C2 configuration is stored as a
      reversed key:value string to defeat static string scanning. Runtime protections include marking its own
      process critical (so killing it forces a BSOD), injecting a watchdog into svchost with a
      PAGE_NOACCESS-then-RWX toggle to relaunch itself if interrupted, and enumerating windows via EnumWindows
      to detect security/traffic-analysis tooling before proceeding. Spyware functions run via DirectInput8
      hooks for keystrokes and separate clipboard capture, both written to disk; on operator command the
      backdoor can also pull and execute additional modules, using process hollowing into svchost when the
      module is shellcode. Kaspersky recorded over 100,000 detections of ValleyRAT/associated malware in 2026
      affecting 1,500+ unique users, concentrated in China and India, and attributes the campaign to Silver
      Fox (the known ValleyRAT operator) on geography and payload grounds — Silver Fox has used DLL
      side-loading via signed third-party software as an established tradecraft element in prior 2026
      campaigns (Cato Networks documented a related technique roughly five weeks earlier against a Japanese
      manufacturer).
    region_nexus: "China and India primarily targeted in 2026 telemetry; no Swiss/European victims named, but the DLL-sideloading-via-signed-adware technique is a transferable detection concept for any endpoint estate that allows unmanaged third-party software installs"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
