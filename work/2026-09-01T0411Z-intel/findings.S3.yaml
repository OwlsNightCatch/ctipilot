        attribution: "Anthropic (email to affected users, via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-warns-infostealer-malware-is-hijacking-claude-sessions-to-drain-usage/"
    extended_notes: |
      No independent Anthropic blog post or trust-center advisory was located — the underlying primary is
      Anthropic's direct email notification to affected users, first surfaced publicly via a Reddit post and
      independently reproduced (consistent wording) by three separate outlets, which is treated here as
      sufficient multi-source corroboration of the email's content. Detection/hardening angle for a SOC: this
      is a reminder that any SaaS/GenAI account reachable with only a browser session cookie is exposed to
      infostealer logs regardless of the org's own MFA policy, since the theft happens client-side before
      authentication even completes on a subsequent visit — session-lifetime limits, IP/device-binding on
      session tokens, and routine infostealer-log monitoring (many vendors sell searchable stealer-log feeds)
      are the practical controls, not stronger password/MFA policy alone.

