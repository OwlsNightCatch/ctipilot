    summary: >
      JFrog disclosed CVE-2026-82329 on 28 August 2026, a Critical (CWE-287 Improper
      Authentication) flaw in Artifactory, its widely-deployed DevOps binary/artifact
      repository: under Artifactory's default, out-of-the-box configuration, an
      unauthenticated attacker with only network access to the instance can obtain full
      administrative privileges — no valid account, prior session, or user interaction
      required. CVSS 3.1 base score is 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), per
      NVD/GitHub Advisory Database. JFrog has not published the specific request path or
      authentication code defect being bypassed — its own advisory states only that "an
      authentication weakness ... under default configuration, may allow an unauthenticated
      attacker with network access to obtain administrative privileges" — so defenders
      cannot yet reason about a specific exploitation signature beyond the precondition
      (self-hosted, default configuration, network-reachable). Self-hosted branches
      7.111.4–7.111.20, 7.117.0–7.117.27, 7.125.0–7.125.19, 7.133.0–7.133.28,
      7.146.0–7.146.36/37 and 7.161.0–7.161.19 are affected; fixed in 7.111.21, 7.117.28,
      7.125.20, 7.133.29, 7.146.38 and 7.161.20 respectively. JFrog-hosted cloud
      environments were already remediated before disclosure and need no customer action.
      No party (vendor, GitHub Advisory Database, or independent researchers) has reported
      observed in-the-wild exploitation as of collection; given the pre-auth, no-interaction,
      network-reachable profile against a system that custodies CI/CD credentials and build
      artifacts, this sits squarely in the imminent-exploitation risk class. It is a
      distinct, more severe flaw from CVE-2026-66384 (the Docker-cache path-traversal bug
      on the same product this pipeline already tracks, KEV-listed 2026-08-27) — Artifactory
      has now had two independently exploitable vulnerabilities surface within the same
      August 2026 release cycle.
    region_nexus: "global; Artifactory is widely used as the artifact/binary repository underpinning CI/CD pipelines, including by European and Swiss public-sector software-delivery teams and their suppliers"
