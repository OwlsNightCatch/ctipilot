        attribution: "McKesson Corporation, Form 8-K (SEC EDGAR)"
        source_url: "https://www.sec.gov/Archives/edgar/data/927653/000092765326000247/mck-20260825.htm"
      - quote: "the threat actors used the mckesson[.]claims domain as part of the attack"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/"
      - quote: "We have reasonable assurance of no ongoing unauthorized activity in our systems."
        attribution: "Francisco Fraga, CITO, McKesson (via CyberScoop)"
        source_url: "https://cyberscoop.com/mckesson-data-theft-extortion-attack-shinyhunters/"
    extended_notes: |
      Included despite no direct Swiss/EU nexus: (a) scale — one of the largest healthcare data-theft claims of 2026 (284M records claimed, $55.2M ransom demand) at a company whose distribution footprint touches essentially all of North American pharmacy/hospital supply chains; (b) materially reusable TTP — the company-name + ".claims" typosquat domain convention for vishing-driven helpdesk impersonation is a fresh, concrete detection lead (domain-registration/typosquat monitoring for <org>.claims patterns) applicable to any organization using Okta/Salesforce/Snowflake, technology stacks also used in Swiss public-sector and public-institution environments. actor:shinyhunters is an already-tracked entity with an extensive registry history (Oracle PeopleSoft, Salesloft Drift, multiple SaaS/CRM vishing campaigns) — this item is a continuation of a known pattern, not a new TTP class, hence priority notable rather than high/critical.
    borderline: true
    borderline_reason: "out-of-nexus (US healthcare distributor); included under PD-11 limb (a) scale and limb (b) transferable TTP (vishing + .claims domain pattern into Okta/Salesforce/Snowflake) rather than direct constituency relevance — main agent should confirm this clears the bar given it is a continuation of an already well-documented ShinyHunters pattern."

  - title: "TheGentlemen ransomware group lists Ixa Systems, a Swiss physical-security integrator whose clients include police, prisons and hospitals — leak-site claim only, no victim or independent confirmation"
    sources:
      - { url: "https://www.ransomware.live/id/SXhhIFN5c3RlbXNAdGhlZ2VudGxlbWVu", publisher: "Ransomware.live (leak-site tracker)", date: "2026-08-30", role: "primary" }
    discovery_trace: "first seen at: ransomware.live API sweep (bridge:url https://api.ransomware.live/v2/recentvictims, filtered for Switzerland/France/Germany/Austria/Liechtenstein country codes), URL https://api.ransomware.live/v2/recentvictims → primary: Ransomware.live victim record, URL https://www.ransomware.live/id/SXhhIFN5c3RlbXNAdGhlZ2VudGxlbWVu (no independent victim statement or press corroboration found despite targeted French- and German-language WebSearch attempts: \"Ixa Systems Crissier cyberattaque/rançongiciel/piratage\", \"Ixa Systems Cyberangriff TheGentlemen ransomware Schweiz\")"
    summary: |
      Ransomware.live recorded on 2026-08-30 that the ransomware/extortion group TheGentlemen (registry key actor:thegentlemen, which this store already tracks for a May 2026 listing of a Swiss engineering firm and a Czech university) added Ixa Systems SA — a small (~9-10 staff, CHF 3.5M revenue) physical-security-systems integrator based in Crissier, canton Vaud — to its leak site, with the claimed attack dated to on or around 28 August 2026. Ixa Systems designs and integrates video surveillance, anti-intrusion, intercom, access-control, perimeter-detection and evacuation public-address systems, and its own public client list names police, banks, museums, schools, hospitals, prisons and railways, several of which fall inside this constituency's core (police, emergency services, public institutions) or immediately adjacent to it. No technical detail on initial access, data scope, or intrusion mechanism accompanies the leak-site listing. Neither Ixa Systems nor any Swiss authority (BACS, cantonal police, cantonal data-protection commissioner) has issued a public statement, and no French- or German-language press outlet was found reporting the claim independently — this item rests on the extortion group's own leak-site post alone.
    region_nexus: "Switzerland — canton Vaud (Crissier)"
    primary_sector_nexus: "indirect (third-party physical-security supplier to police/prison/hospital clients)"
