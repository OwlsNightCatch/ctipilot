items:
  - title: "McKesson discloses a data-theft breach after ShinyHunters claims 284 million healthcare records — vishing into Okta SSO reached Salesforce and Snowflake"
    sources:
      - { url: "https://cyberscoop.com/mckesson-data-theft-extortion-attack-shinyhunters/", publisher: "CyberScoop", date: "2026-08-31", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/", publisher: "BleepingComputer", date: "2026-08-28", role: "primary" }
      - { url: "https://www.sec.gov/Archives/edgar/data/927653/000092765326000247/mck-20260825.htm", publisher: "SEC EDGAR (McKesson Corporation Form 8-K)", date: "2026-08-28", role: "primary" }
    discovery_trace: "first seen at: cyberscoop (source-slice record not in S4 slice; discovered via feed https://cyberscoop.com/feed/), URL https://cyberscoop.com/mckesson-data-theft-extortion-attack-shinyhunters/ → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/mckesson-discloses-breach-after-shinyhunters-claims-patient-data-theft/ → primary: SEC EDGAR Form 8-K, URL https://www.sec.gov/Archives/edgar/data/927653/000092765326000247/mck-20260825.htm"
    summary: |
      McKesson Corporation, the largest US pharmaceutical distributor ($403.4B revenue), disclosed on 2026-08-28 (Form 8-K, Item 7.01) a cybersecurity incident discovered on 2026-08-25 involving unauthorized access to third-party applications and data exfiltration affecting a subset of customers in its oncology, multispecialty and medical-surgical business units. The extortion group ShinyHunters claimed responsibility to BleepingComputer, stating it compromised multiple employees via voice-phishing (vishing) attacks using a lookalike domain (mckesson[.]claims) impersonating the company's IT helpdesk — a naming pattern (company-name + .claims TLD) that ReliaQuest had separately flagged as a widespread ShinyHunters helpdesk-impersonation campaign. The vishing calls compromised employees' Okta single sign-on accounts, which the actor then used to reach McKesson's Salesforce (support cases) and Snowflake (284 million data records — the actor's own clarification is that this is a raw record/row count, not a confirmed unique-patient count) environments, exfiltrating roughly 1 TB of data over four days (21-25 August). The actor demanded $55,236,150 with a 72-hour deadline; McKesson did not respond to or negotiate the demand, according to the actor. As of 2026-08-31 McKesson states it has "reasonable assurance of no ongoing unauthorized activity" and has not determined the incident to be material under SEC rules; the company has not independently confirmed the actor's data-volume or content claims. This is the latest in an ongoing ShinyHunters wave against healthcare/health-tech organizations (Medtronic, DentaQuest, iRhythm, and others), which Health-ISAC had already warned about in late July 2026.
    region_nexus: "United States — no direct Swiss/EU nexus"
    primary_sector_nexus: "indirect"
    sector: "healthcare (private-sector distributor)"
    cves: []
    techniques: [T1566.004, T1078.004, T1530, T1213, T1583.001]
    affected_products: ["Salesforce", "Snowflake", "Okta"]
    entity_keys: ["actor:shinyhunters"]
