  - title: "BSI/CERT-Bund: ~85% of German on-prem Exchange servers remain vulnerable to CVE-2026-62911 days after public exploit code appeared"
    sources:
      - { url: "https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html", publisher: "heise Security", date: "2026-08-31", role: "primary" }
      - { url: "https://social.bund.de/@certbund/117171896801475447", publisher: "CERT-Bund (BSI)", date: "2026-08-28", role: "primary" }
      - { url: "https://www.cert.at/de/aktuelles/2026/8/microsoft-exchange-exploit-code-veroffentlicht-cve-2026-62911", publisher: "CERT.at (Austria)", date: "2026-08-27", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → primary: heise Security, URL https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html → primary: CERT-Bund (BSI) Mastodon post, URL https://social.bund.de/@certbund/117171896801475447 → corroboration: CERT.at, URL https://www.cert.at/de/aktuelles/2026/8/microsoft-exchange-exploit-code-veroffentlicht-cve-2026-62911"
    summary: |
      Delta on the existing entry for CVE-2026-62911 (Exchange Server MRSProxy missing channel-binding check, patched 11 August 2026, public exploit code published 27 August 2026). Following heise's inquiry, Germany's CERT-Bund (part of BSI) disclosed on Mastodon (2026-08-28) that roughly 85% of on-premises Exchange servers in Germany were still vulnerable to CVE-2026-62911 as of that Friday, despite the patch having shipped over two weeks earlier and public, unauthenticated-takeover exploit code being live. CERT-Bund states it has been proactively notifying German network operators about still-vulnerable systems in their networks since 14 August. For the small population of still-supported-via-paid-ESU Exchange 2016/2019 installs, CERT-Bund says it knows of only nine servers in Germany with the ESU patch installed. BSI's standing advice, repeated in the same reporting: restrict internet-facing Exchange web services to trusted source IPs or place them behind a VPN. The scale of the exposure gap — most of an entire national on-prem Exchange population unpatched against a pre-auth, unauthenticated full-takeover chain with a public working exploit — is the actionable delta: any organization in the DACH region running on-prem Exchange (a common pattern in Swiss cantonal/communal administrations and their suppliers) should treat "we applied the August patch" as unverified until confirmed, since German telemetry suggests most operators in a comparable environment have not.
    region_nexus: "Germany (DACH neighbour); directly transferable to Swiss on-prem Exchange operators given shared vendor, patch cadence and exposure pattern"
    primary_sector_nexus: "indirect (general IT infrastructure — on-prem Exchange is common in Swiss cantonal/communal administrations)"
    sector: "public-sector"
