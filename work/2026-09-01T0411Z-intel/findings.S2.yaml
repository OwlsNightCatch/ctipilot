items:
  - title: "Payload ransomware group publishes stolen HWZ (Zurich) data on its leak site; university confirms personal data among what was taken"
    sources:
      - { url: "https://www.inside-it.ch/hwz-daten-landen-im-darkweb-20260831", publisher: "Inside IT (Switzerland)", date: "2026-08-31", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-08-26/hacker-greifen-hwz-daten-ueber-externen-dienstleister-ab", publisher: "Netzwoche", date: "2026-08-26", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml → primary: Inside IT, URL https://www.inside-it.ch/hwz-daten-landen-im-darkweb-20260831 → corroboration: Netzwoche, URL https://www.netzwoche.ch/news/2026-08-26/hacker-greifen-hwz-daten-ueber-externen-dienstleister-ab"
    summary: |
      Delta on the existing entry for the HWZ (Hochschule für Wirtschaft Zürich) third-party breach. Inside IT reported on 2026-08-31 that the ransomware group tracked as Payload — which had listed HWZ alongside seven other Swiss customers of the same external IT service provider on its darknet leak-site page — has now published data from the intrusion. HWZ's own media office confirmed to Inside IT that personal data are among the stolen records ("Wir können bestätigen, dass sich unter den entwendeten Daten auch Personendaten befinden"), a firmer statement than the university's earlier position that it had "no indication" the stolen data had been published or misused. The intrusion vector remains the shared IT service provider's infrastructure, not HWZ's own systems; HWZ's local IT stays reported unaffected. This closes the gap the original disclosure (2026-08-23 to 2026-08-26 reporting) left open — whether the extortion claim would convert into an actual data dump — and confirms exposure for an educational institution inside the constituency's broader public/education sector.
    region_nexus: "Switzerland — canton Zurich"
    primary_sector_nexus: "indirect (education institution via shared third-party IT provider; leak site names seven other Swiss customers of the same provider, so the exposure pattern generalises to any public-sector tenant of the same MSP)"
    sector: "public-sector"
