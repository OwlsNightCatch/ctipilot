        attribution: "CERT-Bund (BSI)"
        source_url: "https://social.bund.de/@certbund/117171896801475447"
      - quote: "Seit dem 14. August benachrichtigt das BSI demnach deutsche Netzbetreiber bereits über die noch verwundbaren Systeme in ihren Netzen."
        attribution: "heise Security, relaying BSI CERT-Bund"
        source_url: "https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html"
      - quote: "Aktuell sind uns in Deutschland jedoch nur 9 Exchange-Server 2016/2019 bekannt, auf denen im Rahmen von ESU herausgegebene Patches installiert sind"
        attribution: "BSI, via heise Security"
        source_url: "https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html"
    extended_notes: |
      T1557 mapped because the underlying flaw (per the existing entry) is a missing channel-binding check that lets a relayed Negotiate/NTLM authentication exchange be treated as the relayed account — an adversary-in-the-middle/relay primitive — rather than a direct memory-safety exploit; T1190 covers the network-reachable MRSProxy endpoint as the exploited public-facing surface. CERT.at's 27 August advisory is cited only as a second-CERT corroboration that exploit code was live and attacks were expected; it does not carry the 85% figure itself (that is BSI CERT-Bund's own, unique data point).
