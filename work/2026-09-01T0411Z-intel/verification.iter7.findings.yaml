  item: "CVE-2026-62911 — Microsoft Exchange Server MRSProxy auth bypass"
  url_or_quote: "\"That precondition is consistent with, rather than contradicting, MSRC's own PR:L (\\\"authorized attacker\\\") labelling\""
  summary: "(low confidence) MB VRED never mentions MSRC/CVSS/PR:L; the consistency claim is the entry's own unstated synthesis. Also, MB VRED calls the 'domain-joined PC' requirement 'the most plausible hypothesis' — the entry states it as an established finding."
- code: F13
