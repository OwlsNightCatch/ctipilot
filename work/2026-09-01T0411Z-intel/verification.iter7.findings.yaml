  item: "ValleyRAT (Winos 4.0) — QN Wallpaper DLL-sideload / Silver Fox"
  url_or_quote: "\"Both that campaign and this one postdate a June 2026 Chinese police crackdown ... evidence the group's operations continued despite the arrests\""
  summary: "Kaspersky's report never dates the QN Wallpaper campaign itself ('Some time ago, a client asked us to analyze a file...'); only the 2026-08-31 publication date is established, so 'this campaign... postdate[s]' the 17 June arrests is an unstated inference for that campaign (the Cato/Japan campaign is genuinely datable after the arrests, but the QN Wallpaper one is not)."
