    kind: cited
    text: "), and VulnCheck reproduced the flaws, says hundreds of proof-of-concept repositories have appeared, only a very small number legitimate, and says that as of 7 PM ET on 2026-10-22 it had identified at least one proof of concept that bypasses ASLR on x86-64 for a single PHP version, 8.4.26, with default heap configurations and does not work outside that setup; it reports that it holds a weaponized exploit for CVE-2026-109618, available to its customers, that chains a memory leak into code execution, was successful on x86-64 with ASLR enabled and display_errors off, the recommended production configuration, and as of 5:30 PM ET on 2026-10-23 supports PHP 8.4.10 to 8.4.26 and 8.5.10 and 8.5.11 on AMD64 and ARM64 with default settings and display_errors off under mod_php, and WordPress on default Docker installs running those versions ("
