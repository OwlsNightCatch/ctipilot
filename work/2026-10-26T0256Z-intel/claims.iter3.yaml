    kind: cited
    text: "Products that embed PHP are affected through it: Palo Alto Networks lists PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected, with hotfixes due by 2026-10-30; its table lists WF-500 and WF-500-B as unaffected, no longer distinguishes Panorama, and notes that the issue applies to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama ("
