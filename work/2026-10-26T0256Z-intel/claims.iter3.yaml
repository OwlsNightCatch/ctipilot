  - claim_id: 44d743b070
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "Node.js released 22.23.4, 24.22.1 and 26.12.1 on 2026-10-21 to fix CVE-2026-111497, an out-of-bounds write in its bundled Brotli decoder that can lead to remote code execution, and Imperva ran code through it against the official Node.js 24.22.0 image via fetch() and Express 5 or body-parser 2 request bodies. The flaw is in the upstream Brotli library, so the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (fixed in 1.2.1.0) carry it too, and Envoy and Microsoft .NET have shipped their own fixes; no source reports exploitation."
  - claim_id: 164f373b11
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images, which a package inventory misses, and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; move any application on an end-of-life Node.js line to a supported release."
  - claim_id: eda4db7a81
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every Envoy proxy that has the Brotli decompressor configured to v1.40.0, v1.39.3, v1.38.6, v1.37.8 or v1.36.12; the advisory names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable."
  - claim_id: 61afe7c1e3
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 13c835c243
