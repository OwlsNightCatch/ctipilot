    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "An attacker who can supply Brotli data that an application decompresses with the node:zlib module can corrupt process memory, which can lead to a crash, disclosure of process memory or remote code execution ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: ab425e257e
