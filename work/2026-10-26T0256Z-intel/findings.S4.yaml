items:
  - title: "EDÖB head Lobsiger (SonntagsBlick/Blick interview, relayed 2026-10-25): the formal investigation so far covers only PK Softech, and he does not rule out widening it to the federal bodies, i.e. the pension funds"
    novelty: "update-of:2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    borderline: true
    borderline_reason: "Regulator scope statement, not new technical fact; the entry already carries the EDÖB formal investigation of 2026-10-22. Worth a non-internal update only if the main agent judges the possible extension to federal bodies and pension funds (the constituency itself) material; otherwise fold into the next real development."
    sources:
      - { url: "https://www.tio.ch/svizzera/attualita/1958918/dati-violazioni-sicurezza-aumento-svizzera", publisher: "Ticinonline (report on the Sonntagsblick interview)", date: "2026-10-25", role: "primary" }
      - { url: "https://www.blick.ch/politik/mr-datenschutz-die-bedrohung-durch-die-ki-ist-real/skk4d57", publisher: "Blick (interview with Adrian Lobsiger)", date: "2026-10-24", role: "corroborating" }
    discovery_trace: "first seen at: tio-ch-attacco-informatico topic page, URL https://www.tio.ch/temi/attacco-informatico (extract; 'Attacco informatico alle casse pensioni, aperta un'indagine federale', 18 ore old) → pivot: raw HTML href resolution on https://www.tio.ch/temi/attacco-informatico → article, URL https://www.tio.ch/svizzera/attualita/1958918/dati-violazioni-sicurezza-aumento-svizzera → WebFetch https://www.blick.ch/politik/ (found the Blick interview teaser, 24.10.2026 20:30) → primary: Blick interview, URL https://www.blick.ch/politik/mr-datenschutz-die-bedrohung-durch-die-ki-ist-real/skk4d57"
    summary: |
      Adrian Lobsiger, the Federal Data Protection and Information Commissioner (EDÖB), told SonntagsBlick (online at Blick on 2026-10-24, relayed by Ticinonline on 2026-10-25) that both the Federal Prosecutor and the EDÖB are investigating the PK Softech incident. He says the formal EDÖB proceeding, opened on Thursday 2026-10-22, is for now directed only at the external IT supplier PK Softech AG, and that he does not rule out extending it later to the federal bodies, which he equates with the pension funds. Asked about police powers, he says that if a party does not cooperate he can, as a last resort, order searches by police. He declines, citing investigation secrecy, to confirm the interviewer's premise that names of intelligence-service staff reached an external firm, and states that data protection law requires data minimisation and proportionality and that anonymised test data should be used instead of live production data. He also reports 455 data-security-breach notifications in 2026 so far against 343 in all of 2025. Nothing in either piece names new victims, a new actor statement or a new data-publication event; the Akira attribution and ransom claim still rest on Tamedia as already recorded in the entry.
    region_nexus: "Switzerland: federal administration, Publica and the cantonal and federal-affiliated pension funds that use PK Softech"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1199, T1657]
    affected_products: []
    entity_keys: ["incident:pk-softech-publica-cyberattack-2026-09", "actor:akira"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    classification_hint: { reliability: B, credibility: 2, note: "first-hand regulator statements in an interview; the second outlet relays the same interview, so it is not independent corroboration" }
    evidence:
      - quote: "Ich schliesse aber nicht aus, das Verfahren später auf Bundesorgane, sprich Pensionskassen, auszuweiten."
        attribution: "Blick (interview with Adrian Lobsiger)"
        source_url: "https://www.blick.ch/politik/mr-datenschutz-die-bedrohung-durch-die-ki-ist-real/skk4d57"
      - quote: "Es handelt sich um ein laufendes Verfahren, sowohl der Bundesanwalt als auch ich ermitteln."
        attribution: "Blick (interview with Adrian Lobsiger)"
        source_url: "https://www.blick.ch/politik/mr-datenschutz-die-bedrohung-durch-die-ki-ist-real/skk4d57"
      - quote: "mit anonymisierten Testdaten gearbeitet werden sollte statt mit produktiven, scharfen Daten"
        attribution: "Blick (interview with Adrian Lobsiger)"
        source_url: "https://www.blick.ch/politik/mr-datenschutz-die-bedrohung-durch-die-ki-ist-real/skk4d57"
      - quote: "Lobsiger non ha tuttavia escluso di estendere in seguito il procedimento a enti federali e casse pensioni."
        attribution: "Ticinonline (report on the Sonntagsblick interview)"
        source_url: "https://www.tio.ch/svizzera/attualita/1958918/dati-violazioni-sicurezza-aumento-svizzera"
    extended_notes: |
      Reader relevance: a pension fund or federal body that handed production or test data to PK Softech may become a party to the EDÖB proceeding; the regulator's stated test is data minimisation and anonymised test data, which is also the question the entry's existing action asks of suppliers. No new do-now action beyond the entry's two existing actions is warranted; suggest actions: [] on this record. The same weekend Blick commentary ("Fliessender Diebstahl", 2026-10-25, https://www.blick.ch/meinung/kommentar-zum-daten-debakel-fliessender-diebstahl/7l339ce) is opinion that criticises the Federal Council's "Datenabfluss" wording and adds no fact. The 2026-10-24 date of the Blick interview is about 4.5 hours before the window start; the in-window source is the Ticinonline report of 2026-10-25.

  - title: "CYFIRMA early warning v3 (24 Oct): a suspected DPRK-nexus Korean-speaking operator has a 216-host PHP2Shell target set, government and banks first, with the EU among named priority regions"
    novelty: "update-of:2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619"
    borderline: true
    borderline_reason: "S1 lane overlap (the PHP2Shell entry exists); single-vendor claim from its own closed-source collection with a moderate-confidence attribution and CYFIRMA's own table of alternatives. Included because it is an in-window actor-targeting signal naming national governments and the EU first (PD-11(d) imminent shared threat); the main agent should dedupe against S1 and decide."
    sources:
      - { url: "https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/", publisher: "CYFIRMA", date: "2026-10-25", role: "primary" }
      - { url: "https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html", publisher: "The Hacker News", date: "2026-10-25", role: "corroborating" }
    discovery_trace: "first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item 'PHP2Shell Exploitation Hits Government Entity Amid Global Scanning and Signs of AI-Assisted Hacking', 2026-10-25) → article, URL https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html → primary: CYFIRMA advisory, URL https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/"
    summary: |
      CYFIRMA's living early warning on PHP2Shell (CVE-2026-109618, CVE-2026-109619), version 3 dated 24 October 2026, says its closed-source collection of a closed I2P channel since 22 October shows two handles, described as Korean-speaking operators, coordinating exploitation planning against internet-facing PHP hosts. On 24 October the operators reported a filtered target set of 216 hosts that still appear unpatched or only partly mitigated, named 21 scan nodes, and the advisory describes the scanning as deliberately low-volume and paced from compromised nodes that are rotated, so threshold alerting is unlikely to catch it. The tasking puts national government agencies and banks first, then logistics, airports, manufacturing and online-transaction platforms, and names the EU among twelve priority regions. CYFIRMA assesses with moderate confidence, on language, operational pattern and historical tradecraft, an affiliation with the Lazarus ecosystem; its own table lists the alternatives (language alone is not attribution, sector priorities fit many financially motivated actors, exploitation is broadly multi-actor, no malware-family or infrastructure overlap with a named Lazarus cluster yet). CYFIRMA states no mass compromise is confirmed for this actor, that it has not seen the 216-host list and that no victim is named. Its hunt guidance is to look back to 17 October, the earliest known exploitation, over extended windows because the scanning is low-and-slow, to preserve evidence before patching suspect hosts because a restart destroys CVE-2026-109619 state, and to look for multipart anomalies, PHP worker crashes and shells spawned by PHP. The Hacker News relays the advisory and, separately, Unit 42's European-government intrusion that the entry already carries; its Defused Cyber honeypot observation is X-only and not used here.
    region_nexus: "global; EU named among the priority regions; Swiss federal PHP applications are already reported affected by BACS (existing entry)"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-109618, CVE-2026-109619]
    techniques: [T1190, T1595.002]
    affected_products: ["PHP"]
    entity_keys: ["tool:php2shell", "actor:lazarus-group"]
    new_entities: []
    relation_suggestions:
      - { subject: "tool:php2shell", object: "actor:lazarus-group", basis: "CYFIRMA assesses with moderate confidence that the Korean-speaking operators staging PHP2Shell exploitation are affiliated with the Lazarus ecosystem; CYFIRMA's own table notes no confirmed malware-family or infrastructure overlap with a named Lazarus cluster (CYFIRMA, 2026-10-24). An overlap claim, not attribution." }
    verification: SINGLE-SOURCE-OTHER
    confidence: LOW
    classification_hint: { reliability: C, credibility: 3, note: "vendor claim from its own closed-source collection (I2P channel), attribution moderate-confidence, no independent corroboration; The Hacker News only relays it" }
    evidence:
