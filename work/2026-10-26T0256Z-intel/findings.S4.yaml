        attribution: "CYFIRMA"
        source_url: "https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/"
      - quote: "Moderate confidence, resting on language, operational pattern and historical tradecraft."
        attribution: "CYFIRMA"
        source_url: "https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/"
      - quote: "No confirmed malware-family or infrastructure overlap with a named Lazarus cluster yet"
        attribution: "CYFIRMA"
        source_url: "https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/"
      - quote: "The 216-host spreadsheet sits at the operators’ collection point and has not been seen"
        attribution: "CYFIRMA"
        source_url: "https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/"
      - quote: "The activity, coordinated via a closed I2P channel, has been attributed with moderate confidence to a Korean-speaking operator assessed to be affiliated with the Lazarus Group ecosystem."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html"
    extended_notes: |
      Defender hooks drawn from the source: web-server access logs for crafted multipart/form-data POSTs that return 500 together with PHP memory-exhaustion errors and a crashed Apache worker (ReliaQuest sequence, already in the entry); process-creation events with a PHP/Apache worker as parent; long-window (not rate-based) retro-hunt from 2026-10-17. CYFIRMA's versions 1 and 2 (22 and 23 October) are not in the store; the version-3 page carries the whole assessment. CYFIRMA's "Mass compromise" row (none confirmed for this actor) keeps its imminence index at 78/100, below the 90 it reserves for confirmed mass compromise.

