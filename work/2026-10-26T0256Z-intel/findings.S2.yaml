items:
  - title: "CSIRT Italia alert AL01/261025: 81.9 % of Italian PHP services with an identifiable version are still potentially vulnerable to PHP2Shell four days after the fix"
    sources:
      - { url: "https://www.acn.gov.it/portale/w/php2shell-aggiornare-immediatamente-i-sistemi-vulnerabili", publisher: "ACN (CSIRT Italia)", date: "2026-10-25", role: "primary" }
      - { url: "https://www.bacs.admin.ch/de/warnung-php-de", publisher: "BACS (NCSC Switzerland)", date: "2026-10-21", role: "corroborating" }
    discovery_trace: "first seen at: csirt-acn-it, feed https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192 (item dated Sun, 25 Oct 2026 17:12 GMT) -> primary: ACN alert page https://www.acn.gov.it/portale/w/php2shell-aggiornare-immediatamente-i-sistemi-vulnerabili (no pivot needed); Swiss counterpart statement read at https://www.bacs.admin.ch/de/warnung-php-de"
    summary: |
      Italy's national CSIRT (ACN) published alert AL01/261025/CSIRT-ITA on 2026-10-25, urging immediate PHP2Shell
      remediation. From its own national exposure monitoring as of 2026-10-25 it counts 741,523 PHP services in Italy,
      285,149 of them on potentially vulnerable versions, which it puts at 81.9 % of the services whose version could be
      identified, and it cautions that the estimate rests on detected versions and can include systems where a fix was
      applied without changing the version number. The alert restates the fixed builds (8.5.12, 8.4.27, 8.3.36 and
      8.2.35; 8.1 and earlier are no longer supported), repeats the session.upload_progress.enabled=0 mitigation for
      CVE-2026-115560 (no patch yet; exposure depends on application code and configuration, not on the PHP version
      alone) and recommends WAF rules in blocking mode where specific rules exist (explicitly not a substitute for
      updating), taking vulnerable services offline when neither an update nor an effective mitigation is possible,
      and a retrospective log review for anomalous HTTP requests, memory-exhaustion errors and unexpected PHP process
      terminations. ACN's CVE table marks a proof of concept as present for CVE-2026-109618 and CVE-2026-109619 and
      leaves the exploitation column empty for all three CVEs. The alert adds a neighbouring authority's national
      exposure measurement to a critical entry that already carries every action (BACS gives the same take-offline
      fallback); the transferable point for Swiss defenders is the authority's own caveat that version counts cannot
      settle exposure.
    region_nexus: "Italy (CSIRT Italia, neighbouring national authority); Switzerland via the PHP2Shell precautionary shutdowns at cantons and the federal administration's PHP applications (BACS)"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-109618, CVE-2026-109619, CVE-2026-115560]
    techniques: [T1190]
    affected_products: ["PHP"]
    entity_keys: ["product:php", "tool:php2shell"]
