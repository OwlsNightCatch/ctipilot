        attribution: "ACN (CSIRT Italia)"
        source_url: "https://www.acn.gov.it/portale/w/php2shell-aggiornare-immediatamente-i-sistemi-vulnerabili"
      - quote: "Si precisa che le stime, basate sulle versioni rilevate, potrebbero includere sistemi sui quali siano state applicate correzioni di sicurezza senza modifica del numero di versione."
        attribution: "ACN (CSIRT Italia)"
        source_url: "https://www.acn.gov.it/portale/w/php2shell-aggiornare-immediatamente-i-sistemi-vulnerabili"
      - quote: "Valutare la disattivazione dei servizi vulnerabili"
        attribution: "ACN (CSIRT Italia)"
        source_url: "https://www.acn.gov.it/portale/w/php2shell-aggiornare-immediatamente-i-sistemi-vulnerabili"
    extended_notes: |
      Suggested rating if used: reliability A (national CSIRT for its own measurement), credibility 2 (own telemetry, not
      independently confirmed). Scale context already gathered but NOT in the entry and below the bar on their own: Inside IT
      (2026-10-22) relays Risikomonitor's Swiss tracker at 20,231 of 576,549 checked Swiss web servers still affected (3.5 %,
      version hidden on a further 16,149) and Netzwoche (2026-10-23) about 23,000 of roughly 690,000; VirusTotal's own post
      says only about 1.1 million of 5.1 million fingerprinted PHP IP addresses announce a version and about 758,000 of those
      run end-of-life branches. The previous fire dropped the Risikomonitor Swiss exposure figure as a single commercial
      scanner whose header-based counts BACS says overstate where distributions backport the fix.
    borderline: true
    borderline_reason: "Adds an authority-measured national exposure figure to a critical entry whose actions are already complete (BACS states the same take-offline fallback); I recommend a drop unless the entry wants a neighbouring-CSIRT data point. The prior fire dropped the Swiss Risikomonitor figure on the same ground."
