  item: "2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi, section '## Update — 2026-10-26T03:40:22Z' (claim 7b3fa9eb15; same wording in the record summary and in cves[CVE-2026-111497].affected)"
  url_or_quote: "an application is exposed only when it decompresses attacker-controlled Brotli data through ASP.NET Core request decompression, HttpClient automatic decompression or the Brotli APIs ([.NET Blog, 2026-10-25](https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/))"
  summary: "(low confidence) The cited .NET Blog says only 'Applications may be affected if they process Brotli-compressed data through ASP.NET Core request decompression, HttpClient automatic response decompression, or the System.IO.Compression Brotli APIs. Request decompression and automatic response decompression are not enabled by default.' Neither 'only' nor 'attacker-controlled' is on that page; both come from dotnet/announcements #494 ('Exposure requires the application to decompress attacker-controlled Brotli data'), which the Node2Shell entry does not cite. Fix: add https://github.com/dotnet/announcements/issues/494 to sources[] and cite it for that clause (or drop 'only' and 'attacker-controlled')."
