recipe_fixes:
  - source_id: msrc-update-guide
    change: "`msrc recent N` sorts by releaseDate, so a re-released or revised CVE (CVE-2026-70197, CVE-2026-102870: revised 2026-10-25 'Updated product information') never appears; the revisions are visible only by filtering on latestRevisionDate. The bridge `url` command is blocked 403 on api.msrc.microsoft.com, but the module helper works: python3 - <<'EOF' ... import tools/fetch_source.py as fs; fs._msrc_fetch_strict_json(f'{fs.MSRC_SUG_BASE}/vulnerability?' + urlencode({'$top':'200','$orderby':'latestRevisionDate desc','$filter':'latestRevisionDate gt 2026-10-24T00:00:00Z'}, quote_via=quote)). Suggest adding `msrc revised [hours]` to fetch_source.py. Also `msrc cvrf 2026-Oct` is ~50 MB (not 2-3 MB) and carries per-CVE ProductStatuses and Remediations/FixedBuild, the structured source for the cve_table."
  - source_id: enisa-euvd
    change: "Per-CVE lookup works through the bridge: `url 'https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-109618&size=3'` returns id, aliases, baseScore, epss (unit not stated: PHP 11.84, Brotli 0.71), enisaIdProduct version ranges, exploitedSince. `recent` lists still return only four records."
  - source_id: paloalto-psirt
    change: "`extract` of a PAN advisory drops the Timeline (revision log); `url --direct https://security.paloaltonetworks.com/CVE-2026-109618` keeps it ('Timeline' section after the CPE list, dated entries). Use it for revision checks."
  - source_id: esentire
    change: "`extract https://www.esentire.com/security-advisories` returns the generic company page; WebFetch of the same URL lists 24 advisories with dates and hrefs (page 1 of 18) and is the working recipe."
  - source_id: fortinet-psirt
    change: "`url --direct https://fortiguard.fortinet.com/psirt/FG-IR-26-186` (single fetch) parses: Published/Updated dates, Known Exploited, Timeline, products under investigation vs confirmed not impacted."
  - source_id: drupal-security
    change: "WebFetch of https://www.drupal.org/sa-contrib-2026-253 returns risk score, CVE, affected/fixed versions and prerequisites (extract hits the client challenge, as noted)."
