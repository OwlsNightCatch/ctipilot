    verification: SINGLE-SOURCE-OTHER
    verification_note: "SINGLE-SOURCE: CYFIRMA only (The Hacker News repeats CYFIRMA's own account and quotes its CEO, so it is not independent). Closed-channel evidence is shown only as redacted screenshots."
