      Defender-useful content, if the entry takes anything: (a) CYFIRMA's claim that operators de-selected hosts that banner a fixed PHP version, so a current banner is itself a de-selection criterion (claim, not tested); (b) the observation that the scanning is deliberately slow, so rate-based alerting will not see it, which supports a hunt that looks for upload-progress multipart POSTs and PHP-worker crashes across weeks of web logs (consistent with the entry's existing Detection line; the 2026-10-17 start matches AWS's first honeypot attempt already cited). The IOC lists in the advisory (38 scan-node and 15 staging addresses) are deliberately not carried. The Hacker News also relays an X post by Defused Cyber about PHP2Shell probes against GlobalProtect honeypots; the primary is X-only, so it is not carried (Palo Alto says GlobalProtect is not affected).
  # ------------------------------------------------------------------------------------------------------------------------
  - title: "Tailworm: an independent researcher reports 11 unpatched flaws in Tailscale SSH, app connectors, serve and headscale; no CVE, no fix, disclosure not coordinated"
    novelty: new
    borderline: true
    borderline_reason: "Single-researcher lab claims, not reproduced by anyone else, PoC withheld, vendor has confirmed issues exist only in general terms; no CVE or fixed version. Relevance depends on Tailscale/headscale use in the constituency (none known). Include only if the profile judges mesh-VPN SSH relevant; a two-sentence awareness item at most."
    sources:
      - { url: "https://tailworm.com/", publisher: "Cyberdione Labs (Erica Windisch), Tailworm security assessment report", date: "2026-10-25", role: "primary" }
      - { url: "https://thehackernews.com/2026/10/unpatched-tailscale-ssh-flaws-could-let.html", publisher: "The Hacker News", date: "2026-10-25", role: "corroborating" }
      - { url: "https://tailscale.com/security-bulletins", publisher: "Tailscale security bulletins (read 2026-10-26: no bulletin for these findings)", date: "2026-10-26", role: "context" }
    discovery_trace: "first seen at: bridge feed https://feeds.feedburner.com/TheHackersNews (item 'Unpatched Tailscale SSH Flaws Could Let a Hacked Device Reach Root on Other Servers', Sun 2026-10-25 23:14 +0530) -> https://thehackernews.com/2026/10/unpatched-tailscale-ssh-flaws-could-let.html -> primary: `extract` https://tailworm.com/ (full report) -> vendor side: `extract` https://tailscale.com/security-bulletins (no new bulletin)."
    summary: |
      Claim (Cyberdione Labs, Erica Windisch; published 2026-10-25, tested 2026-10-22 to 2026-10-24 on tailscale v1.104.2 and headscale v0.29.5): 11 findings in five classes. The headline class is Tailscale SSH: the root-level tailscaled process does path checks and file operations for Unix-socket forwarding (ssh -R/-L) as root, and races and a missing privilege drop let an ordinary SSH session replace, dial or delete privileged resources, giving root on the target server and, on networks without Tailnet Lock, capture of a device-enrolment key and joining an attacker's own machine as a trusted tagged server. Preconditions: Tailscale SSH enabled with a grant to the attacker's already-compromised device; on the hosted service forwarding can be switched off per rule, on headscale 0.29.5 it cannot be turned off. The researcher calls the chain "wormable" in a lab (under a second per hop across everything the policy permits); other researchers have questioned that word, and per-pair (source-to-destination) grants stopped the spread. Other classes: experimental app connectors (conn25) translating traffic to unapproved destinations such as a cloud metadata service, unauthenticated resource exhaustion of a self-hosted headscale control server, an unbounded read in the DERP relay client, and a missing guard in tailscale serve's TCP-to-unix-socket forward. Vendor position: Tailscale's VP of engineering said on Reddit that Tailscale had received the report, had found issues in the same areas with outside specialists and is fixing them, and does not recommend disabling Tailscale SSH for everyone; as of publication Tailscale had issued no security bulletin, no CVE and no fixed version, and the researcher says PoC code went only to Tailscale's security contact the Saturday before publishing ("reported but not coordinated").
    region_nexus: "global"
    primary_sector_nexus: "indirect: only where Tailscale or headscale mesh VPN with Tailscale SSH is used for server administration"
    sector: "technology"
    cves: []
    techniques: [T1021.004, T1068, T1078]
    affected_products: ["Tailscale", "headscale"]
    entity_keys: []
    new_entities:
      - { key: "product:tailscale", type: product, name: "Tailscale", aliases: ["Tailscale SSH", "tailscaled"], summary: "Mesh VPN client/service; the Tailworm report (Cyberdione Labs, 2026-10-25) claims 11 unpatched findings incl. root escalation via Tailscale SSH socket forwarding; unconfirmed, no CVE or fix as of 2026-10-25 (The Hacker News)." }
      - { key: "product:headscale", type: product, name: "headscale", aliases: [], summary: "Self-hosted open-source Tailscale control server; Tailworm claims forwarding cannot be disabled in v0.29.5 and an unauthenticated resource-exhaustion crash loop (Cyberdione Labs, 2026-10-25), unconfirmed." }
    verification: SINGLE-SOURCE-OTHER
    verification_note: "SINGLE-SOURCE: the researcher's own report; The Hacker News interviewed the researcher and relays it (not independent). Tailscale has confirmed only that it is looking at the areas (via Reddit post quoted by THN; not cited directly: social platform)."
    confidence: LOW
    classification_hint: "B3 (named lab, detailed report; unreproduced, no vendor confirmation of the technical claims)"
    evidence:
      - quote: "As of publication, Tailscale had issued no security bulletin, no CVE identifier, and no fixed version."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/unpatched-tailscale-ssh-flaws-could-let.html"
      - quote: "All of the findings rest on Windisch's report alone."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/unpatched-tailscale-ssh-flaws-could-let.html"
      - quote: "On headscale version 0.29.5, forwarding cannot be turned off at all."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/unpatched-tailscale-ssh-flaws-could-let.html"
    extended_notes: |
      Hardening levers named by the report and echoed by Tailscale's public advice (per THN): write SSH access as single source-to-destination pair grants (the one control that stopped spread in the lab), switch off SSH forwarding per rule on the hosted service, enable Tailnet Lock, set node-key expiry on server fleets, bind device state to TPM/Secure Enclave, and treat every headscale 0.29.5 SSH grant as root-equivalent until fixed. Telemetry hook for hunting: unusual enrolment of new tagged server nodes on the tailnet, and SSH sessions that request port forwarding to local unix sockets. Not independently confirmed; do not rate as exploitation.
