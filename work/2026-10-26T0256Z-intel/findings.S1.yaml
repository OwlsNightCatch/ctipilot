      - quote: "ASP.NET Core and HttpClient do not automatically decompress Brotli data in their default configurations."
        attribution: "Microsoft (CVE-2026-111497 advisory)"
        source_url: "https://github.com/dotnet/announcements/issues/494"
      - quote: "Until the update can be deployed, avoid decompressing attacker-controlled Brotli data."
        attribution: "Microsoft (CVE-2026-111497 advisory)"
        source_url: "https://github.com/dotnet/announcements/issues/494"
    extended_notes: |
      Exposure (how a defender tells): `dotnet --list-runtimes` on framework-dependent hosts must show 8.0.33 / 9.0.22 / 10.0.14 (or 11 RC3); self-contained apps and container images carry their own runtime and must be checked per artifact (Microsoft's own point). Code search for the exposure paths: AddRequestDecompression (with the "br" provider), HttpClientHandler/SocketsHttpHandler.AutomaticDecompression including Brotli or All, BrotliStream, BrotliDecoder. For CVE-2026-70197: Windows hosts running code that calls ReceiveFromAsync on UDP sockets with a reused SocketAsyncEventArgs across IPv4 and IPv6. For CVE-2026-102870: Blazor WebAssembly developer machines and CI that reference the standalone Server/DevServer packages on .NET 10/11. CVE-2026-114148: only Microsoft-published ASP.NET Core runtime/targeting-pack Linux tarballs for .NET 8/9 and any source-build tarballs; ordinary runtime/SDK tarballs are not affected on .NET 10/11.
      Mitigation until updated (Microsoft): remove the "br" entry from an existing AddRequestDecompression configuration, drop DecompressionMethods.Brotli from an existing AutomaticDecompression setting, and stop passing untrusted data to BrotliStream/BrotliDecoder; do NOT add decompression where it is not already used (enabling automatic decompression can itself create denial-of-service risk). A WAF helps only on the inbound path (Vercel said the same of its rules for the Node.js variant).
      Detection concept (follows mechanically from the mechanism; no source states one): web/app access logs with Content-Encoding: br on request paths whose application enables request decompression; egress HTTP clients fetching from untrusted or newly seen servers that answer with br; process-crash and heap-corruption telemetry (Windows Error Reporting / dotnet host crash dumps, container restarts) in dotnet or w3wp processes shortly after such requests. Post-patch: a patch does not evict an attacker; no exploitation is reported, so no compromise check beyond normal crash review.
      Why a separate entry: the Node2Shell entry covers Node.js and the PyPI packages; this release adds a different vendor's fixes plus two Patch-Tuesday follow-up CVEs that are not Brotli. The check_run overlap rule needs `references[]` to the Node2Shell entry (CVE-2026-111497). Alternative handling if the main agent prefers one entry: record the Microsoft fixes as an `update` on the Node2Shell entry and carry CVE-2026-70197 / CVE-2026-102870 as a one-line note.
      Not exploited, not in KEV, no public exploit code stated by Microsoft for the .NET path (the Node2Shell exploit against Node.js 24.22.0 was not released). EUVD lists raw EPSS 0.71 for CVE-2026-111497 and 0.7 for CVE-2026-70197 (unit not stated; FIRST has no record yet).
