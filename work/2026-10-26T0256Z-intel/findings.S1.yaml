    summary: |
      Fact (Unit 42, first-hand): the Unit 42 threat brief on CVE-2026-109618 / CVE-2026-109619 (PHP2Shell) now carries an update stamped 2026-10-25 2:15 p.m. PT (21:15 UTC) "to retract our October 23 update". The retracted update (2026-10-23, 12:30 p.m. PT) had added the account of agentic-AI post-exploitation. The 2026-10-25 text says what its researchers saw "was an attack against a European government agency executed in the context of a vulnerable PHP application", that this "led us to believe that it was exploitation of those vulnerabilities", and that "We are unable to confirm that initial access is associated with the specific PHP2Shell CVEs."
      The brief still carries Cortex Xpanse's exposure count (22.6 million exposed instances potentially vulnerable at the time of publication), Palo Alto product protections and Managed Threat Hunting queries; the process-start hunting query is described as generic ("not specific to CVE-2026-109618 and CVE-2026-109619"). It no longer reports any observed exploitation of the two CVEs.
      Consequence for the store (the collector's inference, not a Unit 42 statement): the covered entry rests several statements on the retracted account (its summary and headline paragraph, the Update 2026-10-23 section and the 2026-10-24/25 summaries describe "a confirmed intrusion of a European government entity with agentic post-exploitation" attributed to Unit 42 from its own telemetry). Without it, the first-hand exploitation record in the entry's source set is attack attempts and scanning (Cloudflare, watchTowr, the AWS honeypot attempt of 2026-10-17 as relayed by Inside IT, SANS ISC, Wordfence, all already cited in the entry) plus VulnCheck's weaponized exploit, while CrowdStrike, Sophos and Wordfence report no successful compromise and Palo Alto knows of no malicious exploitation against its own products. The patching urgency does not change; the "confirmed intrusion" statements do. The Hacker News article of 2026-10-25 still relays the retracted account because it was published before the retraction, so reports that echo it will go stale the same way.
