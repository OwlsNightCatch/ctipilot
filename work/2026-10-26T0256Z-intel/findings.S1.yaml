    discovery_trace: "first seen at: THN https://thehackernews.com/2026/10/php2shell-exploitation-hits-government.html (via WebSearch \"PHP2Shell new exploitation campaign webshell compromised servers Sunday October 26 2026\") -> primary: CYFIRMA advisory https://www.cyfirma.com/research/cyfirma-threat-advisory-suspected-dprk-campaign-staging-php2shell-targeting-against-global-php-infrastructure/ read in full with `extract`."
    summary: |
      CYFIRMA's early-warning advisory (version 3, dated 24 October 2026, page date 2026-10-25) claims that, from CYFIRMA's own closed-source collection of a closed I2P channel, a Korean-speaking operator pair is running low-volume, paced PHP2Shell weakness checks from 21 compromised nodes against a filtered set of 216 hosts that still advertise older PHP versions (hosts bannering the fixed versions were dropped); CYFIRMA says the same 21 addresses were seen in the preceding 8 hours attempting PHP web-shell tooling and session upload-progress poisoning, that roughly a third of the set had been touched, and that no launch date or confirmed mass compromise is stated. Targeting named by CYFIRMA: government and financial institutions first, then logistics, aviation, manufacturing and transaction platforms, in the US, Japan, Thailand, Indonesia, South Korea, Australia, Taiwan, India, Singapore, UAE, Saudi Arabia and "the EU". CYFIRMA assesses a link to the Lazarus Group ecosystem, and the advisory is not consistent about confidence: its version 3 narrative says CYFIRMA "continues to assess with HIGH confidence" that a North Korean state-nexus actor is staging the campaign, while its structured evaluation (and The Hacker News) give MODERATE confidence for the Lazarus link, which it says "rests on behavioural and linguistic indicators rather than definitive infrastructure or malware-family overlap". Its own alternative explanation is an unaffiliated Korean-speaking criminal crew. CYFIRMA advises hunting back to 2026-10-17 over extended windows because the scanning is paced to stay under rate-based alerts. Nobody else has corroborated the channel, the 216-host list or the attribution; the target spreadsheet has not been seen.
    region_nexus: "global; the EU is named as a priority region; Switzerland is not named"
    primary_sector_nexus: "indirect: government agencies are named first among CYFIRMA's targeted sectors"
