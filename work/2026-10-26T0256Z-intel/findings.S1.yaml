    discovery_trace: "first seen at: bridge msrc recent 60 (tools/fetch_source.py msrc recent 60) -> CVE-2026-111497 listed as a Microsoft .NET row released 2026-10-25 and CVE-2026-114148 same day -> `msrc cve CVE-2026-111497` (articles/mitigation/FAQ) and `msrc cvrf 2026-Oct` (product tree, FixedBuild) -> OData query latestRevisionDate > 2026-10-24 (via the fetch_source helper) showed CVE-2026-70197 and CVE-2026-102870 revised 2026-10-25 -> WebSearch (\".NET Brotli CVE-2026-111497 Microsoft security update ...\") -> primaries: https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/ , https://github.com/dotnet/announcements/issues/496 , https://github.com/dotnet/announcements/issues/494 , https://github.com/dotnet/runtime/issues/136445 , https://support.microsoft.com/en-us/servicing/dotnet/net-10/2026/net-10-0-update-october-25-2026"
    summary: |
      Microsoft released out-of-band security updates for .NET on 2026-10-25: .NET 8.0.33, .NET 9.0.22, .NET 10.0.14 and .NET 11 Release Candidate 3 (.NET Framework is not affected). The release carries four CVEs. (1) CVE-2026-111497, a buffer overflow (CWE-787 out-of-bounds write) in the Google Brotli decoder that .NET ships; Microsoft rates it CVSS 3.1 8.1 (AV:N/AC:H/PR:N/UI:N, Exploited: No, Publicly Disclosed: Yes, "Exploitation More Likely") and says an unauthenticated attacker may read or corrupt process memory, leading to information disclosure, denial of service or elevation of privilege. An application is exposed only when it decompresses attacker-controlled Brotli data: ASP.NET Core request decompression with the "br" provider, HttpClient/SocketsHttpHandler AutomaticDecompression including Brotli (or DecompressionMethods.All), or direct BrotliStream / BrotliDecoder use; none of these is on by default. (2) CVE-2026-70197, a .NET and Visual Studio remote code execution flaw in System.Net.Sockets: on Windows, reusing one SocketAsyncEventArgs instance across IPv4 and IPv6 datagram sockets can keep an undersized cached native address buffer and allow an unauthenticated out-of-bounds write during ReceiveFromAsync (CVSS 3.1 8.1, AC:H, Microsoft "Exploitation Less Likely", not exploited, not disclosed). (3) CVE-2026-102870, ASP.NET Core RCE through the Blazor WebAssembly debugger (CVSS 3.1 8.8, user interaction required; a developer evaluating an object during a debugging session). (4) CVE-2026-114148, unsafe ownership metadata in Linux tarballs (MSRC title "ASP.NET Core Elevation of Privilege", CVSS 7.8, local).
      The point beyond the Brotli bug: Microsoft states that the October 13 Patch Tuesday updates "did not fully address" CVE-2026-70197 and CVE-2026-102870 and that the out-of-band release provides the corrected fixes, so hosts that installed the October 13 builds (8.0.32 / 9.0.21 / 10.0.13 / 11.0 RC2) are still exposed to those two. MSRC had already revised CVE-2026-70197 on 2026-10-19 ("Microsoft is aware that the vulnerability for which this CVE was assigned has not been addressed"), the revision text the store's audit of 2026-10-25 dropped as below the inclusion gate; the fix is now out. For CVE-2026-102870 updating the shared runtime is not enough: the standalone Microsoft.AspNetCore.Components.WebAssembly.Server / DevServer package references must be updated (.NET 10 and 11 only).
      MSRC's structured data adds the products that embed the decoder: Visual Studio 2019 16.11.61, 2022 17.14.43 and 2026 18.11.2 (18.12 Insiders 3) and PowerShell 7.4.22, 7.5.13 and 7.6.9 are listed with fixed builds for CVE-2026-111497, next to MSRC's FixedBuild values 8.0.427 / 9.0.320 / 10.0.403 for .NET 8 / 9 / 10 (KB5133964/5/6; they look like SDK build numbers, while the .NET Blog names the runtime versions 8.0.33 / 9.0.22 / 10.0.14). Self-contained applications and container images carry their own runtime and need a rebuild; installing a newer runtime on the host does not update them. No source reports exploitation of any of the four CVEs.
    region_nexus: "global; Microsoft .NET / ASP.NET Core is widely used in public-administration line-of-business and web applications"
    primary_sector_nexus: "indirect, high plausibility: .NET LOB apps and ASP.NET Core services are common in federal, cantonal and communal estates (no watchlist configured; not a confirmed constituency inventory)"
