      Claim (Semperis, single vendor and first-hand monitoring of the group's servers, no independent corroboration retrieved): the Iranian state-aligned group Prince of Persia, active since at least 2010, shut down its known C2 servers within days of SafeBreach's February 2026 research, then showed no public activity from March 2026 (its longest downtime in about two decades) until 2026-05-27, when a new C2 server received exfiltration from a Tonnerre victim (more than 1,800 files in the first week). Semperis says the group moved to new hosting providers, shifted from VPS hosting to public hosting alongside benign and other actors' malicious sites, and found active C2 for all of Foudre, Tonnerre and both Tornado stages. It highlights that the Tornado second-stage server, the one that serves the Telegram bot configuration to selected victims, is hosted in the US, which it calls a first in a decade, and links the group's activity pauses to the US-Iran conflict that began 2026-02-28. Background it restates from SafeBreach and Unit 42: Tornado is delivered through one-day vulnerabilities such as WinRAR exploits, uses HTTPS and the Telegram API for C2, a domain generation algorithm, blockchain transaction fields to change C2 routing without a code update, and RSA signature validation of C2 requests to keep researchers and scanners out; victim numbers remain low. The timing and 'US soil' reading are Semperis's assessment; the post carries no European victim and no new endpoint-level detection.
