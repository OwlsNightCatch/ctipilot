    discovery_trace: "first seen at: jpcert-eyes, URL https://blogs.jpcert.or.jp/en/atom.xml (item 'Recent AI-Assisted Cyber Attacks in Japan: Investigating Attack Infrastructure and Techniques', 2026-10-21) -> drilled via extract, URL https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html -> pivot: JPCERT/CC alert AT-2026-0030 linked from it, URL https://www.jpcert.or.jp/at/2026/at260030.html (primary; Case E added 2026-10-23) -> pivot: NICT CYNEX, URL https://cynex.nict.go.jp/library/261013-01.html and press release URL https://www.nict.go.jp/press/2026/10/13-1.html (the NICT detail PDF decoded as garbage, HTML pages used) -> pivot: recordedfuture-insikt, URL https://www.recordedfuture.com/feed item 'Behind Japan's Warnings of a Cyber Crisis', URL https://www.recordedfuture.com/blog/japan-cyber-crisis-warnings -> links to Macnica, URL https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html, and Scutum, URL https://www.scutum.jp/information/waf_tech_blog/2026/10/waf-blog-085.html. Store check: no entry covers this wave (grep for JPCERT alert, A2B, CyberStrikeAI, Macnica returned nothing; the IDC Frontier ransomware entry is a different event)."
    summary: |
      Fact (JPCERT/CC, NICT, Macnica): since July 2026 (Macnica) and around September (JPCERT/CC) Japanese organisations have disclosed a sharply rising number of personal-data leaks from internet-facing web systems and mobile-app backends; Macnica counts 265 published cases since January 2024, 119 of them in 2026 to 6 October and 81 of those published since July, and says that of the 81 only 16 state a cause (9 product, CMS or plugin vulnerabilities, 4 credential abuse, 3 access-control or configuration faults). JPCERT/CC's alert AT-2026-0030 sorts what it has seen into five cases: (A) per-target scanning for many different known vulnerabilities and for hygiene faults such as exposed configuration and backup files, not one common flaw; (B) abuse of application management APIs, where the attacker analyses the published smartphone app to find API endpoints and keys, then calls internal APIs the screens never expose to change user roles, create accounts, flip header presence or send malformed tokens to compare responses, and blind-probe with NoSQL injection to find account data, sometimes with API keys stolen from other compromises; (C) the Metabase SQL injection CVE-2026-72898; (D) .war files holding a JSP web shell that runs query-parameter commands, dropped on application servers reachable from the public web server; (E, added 2026-10-23) attack attempts through AI penetration-testing platforms that the alert names as Cairn, CyberStrikeAI and ARTEX, mainly against internet-facing web applications and including attempts against internet-exposed WSUS servers. NICT's LETTICE team named the app-analysis path "A2B (App-to-Backend) attack" on 2026-10-13: the app itself need not be vulnerable, the backend's authentication, authorisation and input-validation faults (IDOR/BOLA, SSRF, RCE, SQL injection) are what is used. JPCERT/CC's infrastructure team (2026-10-21) found on attack servers Android APK files, the Flutter/Dart reverse-engineering tool Blutter and the decompiler jadx, a Python script acting as an HTTPS server that answers with HTTP 302 redirects to test SSRF, and, on an unrelated server, tooling for web applications, MySQL, Jenkins and mail gateways with EDR-evasion attempts and web shells; it says the attackers used AI to scan for known vulnerabilities and attack through APIs, and that they also targeted services for users outside Japan. Claims and assessments: Scutum, a WAF vendor, says a detector it added on 2026-10-10 found AI-agent attacks from at least three source addresses by 2026-10-14 (a roughly 1,000-request sweep for .git, admin and security.txt paths; a phased run switching between curl, the ffuf fuzzer, range-header scans and automated contact-form POSTs; and an almost eight-hour run with some 35 rotated User-Agent strings, bursts near 2,100 requests a minute and product-specific probes) and thinks the three may be different actors; Recorded Future reports that Macnica could not confirm AI use and says the models abused are not confirmed. No source attributes the wave to one actor; ARTEX is open source and Microsoft and Recorded Future already tie it to two different actors, so a tool name in this wave does not identify an actor.
    region_nexus: "Japan (primary); no Swiss indicator in any source; the attack class transfers to Swiss citizen-facing apps and portals"
    primary_sector_nexus: "indirect but transferable: cantonal and communal mobile apps, reservation and booking portals, BI tools and staff-management systems are the same long tail of small web systems that Macnica lists as victims (library catalogue, seat reservation, seminar-house booking, refund management)"
