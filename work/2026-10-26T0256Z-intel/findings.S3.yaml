      - quote: "CairnやCyberStrikeAI、ARTEXなどのAIを用いたペネトレーションテスト基盤を悪用した攻撃試行が確認されています。"
        attribution: "JPCERT/CC (alert AT-2026-0030)"
        source_url: "https://www.jpcert.or.jp/at/2026/at260030.html"
      - quote: "その中には、インターネットに公開されたWSUSサーバーを標的とした攻撃試行も含まれています。"
        attribution: "JPCERT/CC (alert AT-2026-0030)"
        source_url: "https://www.jpcert.or.jp/at/2026/at260030.html"
      - quote: "一般公開しているスマートフォンアプリを解析しAPIのエンドポイントやキーを特定する"
        attribution: "JPCERT/CC (alert AT-2026-0030, Case B)"
        source_url: "https://www.jpcert.or.jp/at/2026/at260030.html"
      - quote: "アプリ自体に脆弱性がなくても、バックエンドサーバの認証・認可や入力値の検証などに不備があれば、不正アクセスや個人情報の漏洩につながるおそれがあります。"
        attribution: "NICT CYNEX LETTICE"
        source_url: "https://cynex.nict.go.jp/library/261013-01.html"
      - quote: "2024年は62件、2025年は84件、今年は10月6日時点で119件となり、合計265件です。"
        attribution: "Macnica Security Research Center"
        source_url: "https://security.macnica.co.jp/blog/2026/10/web-incidents2026.html"
      - quote: "少なくとも3つのIPアドレスからAIエージェントによる日本の企業のウェブサイトへの攻撃が実施されていることを確認しました。"
        attribution: "Scutum (WAF Tech Blog)"
        source_url: "https://www.scutum.jp/information/waf_tech_blog/2026/10/waf-blog-085.html"
      - quote: "Macnica could not confirm the use of AI in these attacks."
        attribution: "Recorded Future Insikt Group"
        source_url: "https://www.recordedfuture.com/blog/japan-cyber-crisis-warnings"
    extended_notes: |
      Exposure (as the sources frame it): any organisation that publishes an Android (or iOS) app with a backend API, runs public web applications, or runs BI tools and staff-management systems it assumes the public will never reach; internet-exposed WSUS servers are named in Case E. JPCERT/CC's Case B list is also a ready set of behaviours to check in API logs: calls to internal or management API endpoints from clients that never loaded the screens; role-change and account-creation calls outside the admin console; the same endpoint called with and without a header or with malformed bearer tokens in sequence; NoSQL-injection-style blind probing against account lookups; use of API keys that were extracted from the shipped app or stolen elsewhere. Case A and E show as long sweeps for configuration and backup files (.git, .env, backup archives), fast 404 bursts, one source rotating tens of User-Agent strings, and phase changes between tools. Case D shows as .war deployment to application servers behind public web servers. JPCERT/CC adds that the sources also come in through Tor exit nodes and residential proxies, that attack requests sometimes carry the published app's own User-Agent, and that the JA4/JA3 seen matches common Python HTTP clients and so cannot discriminate alone.
      Triage lookalike: legitimate app traffic also carries the app's User-Agent; the discriminating features in the sources are the endpoints called (internal or management APIs the app never calls), the sequence (header and token flipping, role changes), the TLS client fingerprint of a generic Python client under an app User-Agent, and, for AI-agent runs, adaptive tool switching in response to server replies (Scutum). Scutum notes its three AI-agent sources carried no mobile-app User-Agent, so the AI-agent scanning and the A2B app-analysis attacks may be different actors.
      Hardening named by the sources: per-endpoint and per-method access control including non-public APIs, least-privilege and expiring API tokens with fast revocation, rate limits on login, password-reset, SMS and search functions, no long-lived secrets or private keys embedded in apps, server-side validation of every redirect and external URL an API fetches (SSRF), restricting access by region where the service is regional, removing management functions from the internet, deleting data past its retention period (JPCERT/CC). The IoC lists in the alert are IP-based and are deliberately not carried.
      Evidence classes and gaps: JPCERT/CC and NICT are first-hand (incident reports and attack-server investigation); Macnica combines public disclosures with its own incident-response logs; Scutum's AI-agent detector logic is withheld by design (it says it can miss agents but should not false-positive). The 'AI' element rests on JPCERT/CC's server findings and Scutum's detector, not on a named model, and Recorded Future relays that Macnica could not confirm AI use. The NICT detail PDF could not be decoded by the bridge's PDF reader (garbled text), so only the HTML pages were used.
