    extended_notes: |
      Sourcing caveat: I could not read the primary SSD Secure Disclosure advisory pages directly this
      run (https://ssd-disclosure.com/unisoc-t612-lpe/ and .../unisoc-t612-rce/ both render as an empty
      client-side shell; the bridge's direct transport got HTTP 202/187 bytes and its jina-reader
      fallback was unavailable — all 7 pool keys returned HTTP 402 balance-exhausted at run start per
      the spawn constraint). The two outlets cited (The Hacker News, Infosecurity Magazine) both relay
      the same SSD disclosure rather than offering independent first-hand telemetry, so I graded this
      SINGLE-SOURCE-OTHER / MEDIUM confidence rather than MULTI-SOURCE despite having two URLs — per the
      "two rewrites of one primary = one source" rule. A follow-up run with the jina reader pool restored
      should re-fetch the SSD pages directly to pull the full CWE detail, PoC structure and any CVE
      assignment that may follow.

      Defender takeaway: no patch exists. Where an org's mobile fleet includes low/mid-range Android
      devices (own-brand budget handsets, field-worker devices, kiosk/IoT Android units) built on Unisoc
      silicon, the only current mitigations are carrier-level VoLTE anomaly monitoring (malformed
      SIP/SDP messages are the stage-one indicator), disabling or restricting VoLTE video-call
      auto-answer where MDM permits, and tracking OEM firmware channels for an eventual Unisoc patch.
      This is a baseband-to-kernel isolation failure class (T1068 Exploitation for Privilege Escalation
      is the closest active Enterprise-matrix mapping; MITRE ATT&CK for Mobile has no dedicated technique
      for baseband/AP isolation bypass in the current dataset scope this pipeline tracks).
