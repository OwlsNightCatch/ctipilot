    discovery_trace: "first seen at: WebSearch (\"security researchers new technique disclosed detection August 2026\") → pivot: WebSearch (\"SSD Secure Disclosure Unisoc modem VoLTE Android kernel exploit chain\") → The Hacker News, URL https://thehackernews.com/2026/08/unisoc-volte-video-call-exploit-chain.html → corroborating: Infosecurity Magazine, URL https://www.infosecurity-magazine.com/news/unisoc-modem-flaw-rce-calls/ → attempted primary: SSD Secure Disclosure advisories at https://ssd-disclosure.com/unisoc-t612-lpe/ and https://ssd-disclosure.com/unisoc-t612-rce/ — both returned an empty JS-only shell via WebFetch and via the bridge (direct HTTP 202/187 bytes; jina reader fallback unavailable — all 7 keys HTTP 402 balance-exhausted this run), so the primary advisory text could not be read directly this run; both news outlets independently describe the same SSD disclosure with corroborating technical detail (chipset list, CWE, vendor non-response, prerequisites)."
    summary: |
      SSD Secure Disclosure (via researcher handle 0x50594d) published a two-stage exploit chain giving
      full Android kernel-memory access on phones built around Unisoc (Spreadtrum) modem chipsets T606,
      T612 and T7250 — with no vendor patch and, per both relaying outlets, no CVE assigned. Stage one
      (disclosed by SSD in March 2026) is a SIP/SDP parsing memory-corruption bug in the modem's VoLTE
      call-setup handling that lets an attacker who controls the call-signalling path (e.g. a rogue/private
      4G cellular network) achieve code execution inside the modem processor by sending a malformed video
      call. Stage two, disclosed 2026-08-17, is a CWE-1189 (improper isolation of shared resources)
      flaw: from that modem-context foothold, the attacker disables protections on region 0 of the SoC's
      ARM Memory Protection Unit, which was supposed to keep modem firmware memory walled off from the
      Android kernel's physical memory — collapsing that boundary and giving read/write access to kernel
      memory, sufficient to modify kernel code and complete local privilege escalation. SSD demonstrated
      the full chain against a Realme C33 (T612) running a July-2025 Android security patch level; the
      same modem firmware family also ships in the Motorola E13 (T606) and Xiaomi Redmi A5 (T7250) —
      budget and mid-range handsets with large installed bases in emerging markets. Completing the attack
      requires the victim to answer an incoming video call while the attacker's rogue VoLTE/4G
      infrastructure is in range/reachable — a real but non-trivial prerequisite that keeps this out of
      mass-exploitation territory for now. SSD reports it attempted to reach Unisoc through multiple
      channels (email, LinkedIn) with no response, and as of disclosure no firmware update exists from
      Unisoc or any downstream device vendor.
    region_nexus: "global (Unisoc chipsets ship in budget/mid-range Android handsets sold worldwide, including Europe); no Swiss/EU-specific targeting reported"
