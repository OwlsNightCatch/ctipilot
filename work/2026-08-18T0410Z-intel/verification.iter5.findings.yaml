  url_or_quote: "malware:lockergoga: 'Used against victims including Stadler Rail, Meier Tobler, Crealogix and IHI Ionbond in Switzerland; ... (cash.ch, Netzwoche, 2026-08-17).' | malware:megacortex: 'Deployed against companies in Switzerland, France, Norway, Scotland, Canada, the Netherlands and the United States (cash.ch, Netzwoche, 2026-08-17).'"
  summary: "Both records attribute operation-level facts to one ransomware family and cite outlets that do not carry them. cash.ch (fetched live) names three Swiss victims as victims of the group, never of LockerGoga, and never names IHI Ionbond or any country; Netzwoche names no Swiss victim company and ties its seven-country list to the operation's ten companies, not to MegaCortex; the four-name victim list exists only in 20 Minuten, which neither record cites. Both are contradicted by the run's own malware:nefilim record ('no source in this run's reporting separates which victims received which family'). The entry body is correct throughout — this is the unfixed residue of iteration 1's F1 remediation, and it renders as the entity page subtitle and meta description (site/build.py:9571, :9697). Fix: restate both summaries at the operation level and re-attribute each fact to the outlet that carries it."
