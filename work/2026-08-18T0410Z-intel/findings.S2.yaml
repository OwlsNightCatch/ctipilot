        source_url: "https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html"
    extended_notes: >
      Delta on 2026-08-15/geoserver-jsonarraycontains-unauth-sqli-zeroday-exploited, whose central defender
      takeaway was "exposure reduction is the only control" because no vendor fix existed. That is no longer true:
      the patch is out and the NCSC-CH advisory reflects it as of 2026-08-17T12:35:20Z. The GHSA's point that the
      2023 CVE-2023-25158 mitigation does not stop this regression is worth keeping in the entry body verbatim —
      organisations that consider themselves already covered from the 2023 advisory are not.
    actions:
      - "Upgrade any internet-reachable GeoServer instance configured with a PostGIS (≥12) or Oracle JDBC data
         store to GeoServer 3.0.1 / 2.28.5 / 2.27.6 (GeoTools 35.1/34.5/33.6) now — the prior CVE-2023-25158
         mitigation (prepared statements, encode-function disablement) does not stop this variant."
