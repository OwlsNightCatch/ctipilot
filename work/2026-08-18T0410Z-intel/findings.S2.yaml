  - title: "Zurich trial surfaces an alleged FSB-linked handler behind the LockerGoga/MegaCortex/Nefilim ransomware attacks on Stadler Rail and three other Swiss firms"
    sources:
      - { url: "https://www.cash.ch/news/top-news/hacker-steht-nach-attacke-auf-stadler-rail-und-andere-firmen-vor-gericht-961362", publisher: "cash.ch", date: "2026-08-17", role: primary }
