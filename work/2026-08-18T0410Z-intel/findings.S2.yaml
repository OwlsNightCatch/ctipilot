  - title: "Austria's Chamber of Labour Upper Austria discloses a cyberattack in which attackers deliberately wiped forensic traces, blocking any determination of what member data was taken"
    sources:
      - { url: "https://ooe.arbeiterkammer.at/service/presse/Cyberangriff-auf-die-AK-Oberoesterreich.html", publisher: "Arbeiterkammer Oberösterreich (victim statement)", date: "2026-08-16", role: primary }
      - { url: "https://www.news.at/politik/cyberangriff-auf-die-arbeiterkammer-oberosterreich", publisher: "news.at (APA wire)", date: "2026-08-17", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("Cyberangriff Österreich Behörde Spital 17 August 2026"), surfaced news.at URL
      https://www.news.at/politik/cyberangriff-auf-die-arbeiterkammer-oberosterreich (APA wire, updated
      2026-08-17T10:57) → primary: Arbeiterkammer Oberösterreich's own press statement, URL
      https://ooe.arbeiterkammer.at/service/presse/Cyberangriff-auf-die-AK-Oberoesterreich.html
    summary: |
      The Arbeiterkammer (Chamber of Labour) Upper Austria — a statutory body under public law representing
      employees, with compulsory membership funded by mandatory contributions — disclosed that unknown attackers
      gained access to parts of its IT systems on Monday 2026-08-10. The organisation notified police, filed a
      criminal complaint, and informed Austria's data protection authority, then moved its entire data and IT
      infrastructure into an isolated environment. Critically, the chamber states it cannot determine the scope of
      the compromise — including whether and which members' personal data were specifically accessed — "aufgrund
      gezielter Spurenverwischung durch die Täter" (due to the attackers' deliberate wiping of traces). As a
      precaution it is treating all member data held in its systems as potentially affected and is notifying every
      member individually by post per Art. 34 GDPR, while warning them that any SMS, WhatsApp or e-mail message
      claiming to be from the chamber regarding payments or prize winnings is fraudulent and must not be acted on.
      No ransomware family, initial-access vector or actor attribution has been disclosed.
    region_nexus: "Austria"
    primary_sector_nexus: "indirect — a statutory public-law employee-representation body, not central/regional government administration, but membership-mandatory and government-adjacent"
