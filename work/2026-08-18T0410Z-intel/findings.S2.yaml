        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12844"
      - quote: "No mitigation is available at this time: Specifically the CVE-2023-25158 mitigation of enabling preparedStatements and disabling encode functions is not effective."
        attribution: "GeoTools GitHub Security Advisory GHSA-mqjf-5f49-2fjh"
