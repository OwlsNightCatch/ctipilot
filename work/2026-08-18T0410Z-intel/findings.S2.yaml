    discovery_trace: >
      first seen at: WebSearch ("Cyberangriff Verwaltung Schweiz Gemeinde August 2026"), surfaced Netzwoche URL
      https://www.netzwoche.ch/news/2026-08-17/update-mutmasslicher-cyberkrimineller-steht-in-zuerich-vor-gericht →
      pivot: cash.ch, URL https://www.cash.ch/news/top-news/hacker-steht-nach-attacke-auf-stadler-rail-und-andere-firmen-vor-gericht-961362 →
      pivot via WebSearch ("Staatsanwaltschaft Zürich Ransomware Anklage Stadler Rail Medienmitteilung"): 20 Minuten,
      URL https://www.20min.ch/story/ransomware-angriffe-auf-schweizer-firmen-12-jahre-haft-gefordert-103618489
      (no Zurich prosecutor/court press release was found published independently of the press wire coverage).
    summary: |
      A 52-year-old Ukrainian software developer resident in Basel-Landschaft went on trial at Zurich District
      Court on 2026-08-17, charged with commercial extortion, multiple counts of serious data corruption, serious
      money laundering and possession of child pornography. Prosecutors describe him as having held a central
      role — not a peripheral one — in an international ransomware operation between December 2018 and May 2020
      that deployed LockerGoga, MegaCortex and Nefilim, encrypting victim data to extort payment. Named Swiss
      victims are Stadler Rail (rolling-stock manufacturer), Meier Tobler (building-technology supplier), Crealogix
      (banking-software vendor) and IHI Ionbond (industrial coatings); none of the four paid, but three non-Swiss
      victims paid a combined CHF 4.5 million, and total damage across all victims — business interruption, data
      loss and remediation — exceeds CHF 100 million (one report specifies over CHF 130 million and a single
      highest ransom payment of 450 BTC, roughly CHF 41 million at the time). Prosecutors allege the defendant
      worked under a handler, Oleksandr Ieremenko, whom they describe as operating under a cover identity of
      Russia's FSB intelligence service; 20 Minuten reports the prosecution's characterisation directly, but this
      is a prosecutorial claim made in an ongoing trial in which the defendant denies having developed any
      extortion software at all — it is not an independently confirmed government attribution. The defendant has
      been in pre-trial custody since his October 2021 arrest; the prosecution is seeking twelve years' imprisonment,
      a matching entry ban, and CHF 1.8 million in restitution (a minimum CHF 490,000 in laundered cryptocurrency
      proceeds).
    region_nexus: "Switzerland"
    primary_sector_nexus: "indirect — targets span transport (rolling-stock manufacturing), finance (banking software) and industrial manufacturing rather than government administration"
