  - title: "GeoServer ships patched releases for the jsonArrayContains SQL injection NCSC-CH flagged as exploited with no fix three days ago"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12844", publisher: "NCSC Switzerland (BACS) Cyber Security Hub", date: "2026-08-17", role: primary }
      - { url: "https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html", publisher: "GeoServer project (Jody Garnett)", date: "2026-08-14", role: primary }
      - { url: "https://github.com/geotools/geotools/security/advisories/GHSA-mqjf-5f49-2fjh", publisher: "GeoTools / GitHub Security Advisories", date: "2026-08-15", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub (bridge `python3 tools/fetch_source.py ncsc-csh recent 40`),
      citation URL https://security-hub.ncsc.admin.ch/#/posts/12844 (post edited 2026-08-17T12:35:20Z,
      "Updated with fixed versions") → primary: GeoServer project's own release announcement, URL
      https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html →
      supporting technical detail: GeoTools GitHub Security Advisory GHSA-mqjf-5f49-2fjh, URL
      https://github.com/geotools/geotools/security/advisories/GHSA-mqjf-5f49-2fjh
    summary: |
      NCSC-CH (BACS) updated its 2026-08-14 GeoServer advisory on 2026-08-17 to record that a fix now exists for
      the unauthenticated SQL injection that was under active exploitation with no vendor patch as of the prior
      brief. The flaw sits in GeoTools' PostGIS DataStore implementation, in the jsonArrayContains(<column>,
      <pointer>, <value>) filter function: for PostGIS 12 and above the function writes the <value> parameter into
      generated SQL without escaping it, letting an unauthenticated attacker with network access to a GeoServer
      instance configured with a PostGIS (or Oracle JDBC) data store execute arbitrary SQL. GeoTools' own advisory
      (GHSA-mqjf-5f49-2fjh, CVSS 9.8, no CVE assigned as of 2026-08-15) states this is a regression of CVE-2023-25158
      and that the earlier mitigation for that CVE — enabling prepared statements and disabling encode functions —
      "is not effective" against this variant, so operators who applied the 2023 fix are not protected. GeoServer
      3.0.1, 2.28.5 and 2.27.6 (bundling GeoTools 35.1/34.5/33.6 and GeoWebCache 2.0.1) were released 2026-08-14 and
      close the hole; affected lines are GeoTools 35.0, and all releases on the ≥34.0 and ≥33.1 branches prior to the
      patched builds. No CVE has been assigned to date; NCSC-CH still tracks exploitation status as "Actively
      Exploited, Proof of Concept Available."
    region_nexus: "global; NCSC-CH (Switzerland's national cyber authority) is actively tracking exploitation and flagged the fix to its constituency"
    primary_sector_nexus: "indirect — GeoServer is widely deployed by public-sector GIS/geospatial-data platforms (cadastral, land-registry, environmental-monitoring systems) across federal, cantonal/regional and municipal administrations"
    sector: "public-sector"
