    summary: |
      Material escalation on the already-covered DGFiP tax-authority intrusion (2026-08-15 entry). On 2026-08-17
      French PM Sébastien Lecornu chaired an interministerial crisis cell by secure videoconference, bringing in
      the finance ministries, DGFiP, ANSSI (France's national cyber-security agency) and the Paris prosecutor's
      office. He formally tasked ANSSI with "an in-depth audit to precisely establish the circumstances and causes
      of the incident," with operational conclusions expected in September, and confirmed individual notification
      of affected users began by e-mail that evening — the Boursorama/AFP wire specifies "over 350,000" of the
      678,000 affected individuals and businesses were being contacted first, alongside roughly 200,000 accounts in
      DGFiP's cadastral files. In parallel, Paris's specialised cybercrime prosecution section (confirmed 2026-08-15)
      handed the investigation to the Office anticybercriminalité (OFAC), probing fraudulent extraction from a
      state personal-data processing system and conspiracy to commit an offence carrying a minimum five-year
      sentence. The actor using the alias ZeroBytes told franceinfo on 2026-08-17 that the dataset had already been
      sold "for a few thousand euros" to two buyers and remains for sale since databases "can be copied and resold
      multiple times" — a claim franceinfo explicitly flags as unverifiable and independently uncorroborated.
