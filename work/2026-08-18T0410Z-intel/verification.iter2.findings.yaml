  url_or_quote: "At Stadler Rail the defendant is additionally accused of taking around 500 gigabytes of confidential data ... The extortion notes claimed the data was encrypted with military-grade algorithms and that any third-party recovery attempt would destroy it"
  summary: "both sentences carry no inline citation in a paragraph with three active outlets (cash.ch, 20 Minuten, Netzwoche); confirmed the 500GB figure is cash.ch's and the military-grade/destruction claim is 20 Minuten's ('In einer Erpressernachricht schrieben die Hacker, die Daten seien mit militärischen Algorithmen verschlüsselt' / 'Jeder Versuch einer Wiederherstellung durch Dritte führe zu deren Zerstörung'), confirmed absent from cash.ch and Netzwoche; facts are true, citations are missing"
