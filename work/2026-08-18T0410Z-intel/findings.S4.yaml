items:
  - title: "GE joins Philips and Shell as a third confirmed-investigating victim in Cl0p's PTC Windchill/FlexPLM campaign (CVE-2026-12569)"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/philips-and-ge-investigating-clop-ransomware-data-theft-claims/", publisher: "BleepingComputer", date: "2026-08-17", role: primary }
      - { url: "https://www.esecurityplanet.com/threats/philips-and-ge-investigate-clop-ransomware-data-theft-claims/", publisher: "eSecurity Planet", date: "2026-08-17", role: corroborating }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → https://www.bleepingcomputer.com/news/security/philips-and-ge-investigating-clop-ransomware-data-theft-claims/ → corroboration: eSecurity Planet, URL https://www.esecurityplanet.com/threats/philips-and-ge-investigate-clop-ransomware-data-theft-claims/ → cross-checked against WebSearch (\"General Electric Clop Windchill data theft claims investigating\")"
    summary: |
      General Electric confirmed on 2026-08-17 that it is aware of and assessing Cl0p's claim to have stolen data
      from its network, becoming the third large multinational (after Philips and Shell, both already tracked in this
      pipeline) to confirm active investigation into the Cl0p PTC Windchill/FlexPLM extortion campaign exploiting
      CVE-2026-12569, an improper-input-validation flaw Cl0p has used to deploy JSP webshells and exfiltrate data
      from internet-exposed Windchill and FlexPLM PLM instances. Cl0p's leak site lists GE and Philips among 43
      claimed victims. Philips stated it "identified and contained an attempted cybersecurity compromise of a
      specific enterprise server related to internal data" with no customer-environment impact; GE's statement is
      limited to "we are aware of the claim and are working to assess the potential issue," with no technical detail
      offered. ReliaQuest and Ransom-ISAC independently verified Cl0p's exploitation of both PTC platforms, and CISA
      has confirmed active in-the-wild exploitation following PTC's 26 June advisory. This is an incremental victim-count
      update to the campaign this pipeline has tracked since 2026-08-09 (leak-site listing → Philips/Shell confirmation
      on 2026-08-15) — GE is the new fact; the vulnerability, exploitation mechanism and vendor-side remediation guidance
      are unchanged from prior reporting.
    region_nexus: "global (US-headquartered GE and Netherlands-headquartered Philips); campaign has already produced named Swiss and Dutch victims in this pipeline's prior coverage"
    primary_sector_nexus: "indirect — industrial/healthcare-technology manufacturing, not core public-sector, but the exploited PLM software class (Windchill/FlexPLM) is used by European industrial and med-tech suppliers to the public-sector/CI constituency"
    sector: "manufacturing, healthcare-technology"
    cves: ["CVE-2026-12569"]
    techniques: ["T1190", "T1505.003"]
    affected_products: ["PTC Windchill", "PTC FlexPLM"]
    entity_keys: ["actor:clop", "campaign:clop-windchill-flexplm-extortion-2026"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-08-15/clop-windchill-philips-shell-first-victim-confirmations"
    evidence:
      - quote: "Philips has identified and contained an attempted cybersecurity compromise of a specific enterprise server related to internal data. This has no impact on customer environments."
        attribution: "Philips (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/philips-and-ge-investigating-clop-ransomware-data-theft-claims/"
      - quote: "We are aware of the claim and is working to assess the potential issue."
        attribution: "General Electric (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/philips-and-ge-investigating-clop-ransomware-data-theft-claims/"
    extended_notes: |
      Neither GE nor Philips has disclosed what data (if any) was actually taken; Cl0p's own claims of stolen
      "backups, system files, projects, drawings, diagrams and blueprints" remain unconfirmed by either company.
      No new technical detail on the CVE-2026-12569 exploitation chain beyond what is already tracked from the
      2026-08-13/2026-08-15 entries and the 2026-08-16 weekly synthesis. Not upgraded to a standalone entry —
      folded as a victim-count delta on the existing campaign entity.
