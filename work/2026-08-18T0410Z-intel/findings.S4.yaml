  - title: "Threat actor 'TheHatman' claims infostealer-driven Azure/Entra credential theft across nine enterprises including Vodafone — TCS denies, no named victim confirms an intrusion"
    sources:
      - { url: "https://www.theregister.com/security/2026/08/17/crook_hawks_millions_of_records_allegedly_plundered_from_corporate_azure_tenants/5288305", publisher: "The Register", date: "2026-08-17", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/hacker-claims-36-million-azure-account-records-stolen-from-major-companies/", publisher: "BleepingComputer", date: "2026-08-17", role: corroborating }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → https://www.bleepingcomputer.com/news/security/hacker-claims-36-million-azure-account-records-stolen-from-major-companies/ → corroboration: WebSearch (\"Vodafone Azure data breach TheHatman statement\") → The Register, URL https://www.theregister.com/security/2026/08/17/crook_hawks_millions_of_records_allegedly_plundered_from_corporate_azure_tenants/5288305"
    summary: |
      A threat actor using the handle "TheHatman" is selling what it claims is 3.64 million employee-directory
      records exfiltrated directly from the Microsoft Azure/Entra ID tenants of nine large organisations between
      31 July and 16 August 2026, using compromised credentials — the actor's own posts cite password spraying and
      MFA-fatigue prompting as the entry method. Named alleged victims include McDonald's (1.7M+ records), Tata
      Consultancy Services (800K+), Vodafone (425K+ — the only named European critical-infrastructure-adjacent
      telecom operator), HCL Technologies (250K+), IHG Hotels, Kyndryl, Gap, Hexaware and Wyndham. Claimed record
      fields include names, employee IDs, email addresses, job titles, phone numbers, postal addresses, reporting
      structure, and service-account/Global-Administrator identifiers. Cybercrime-intelligence firm Hudson Rock
      assessed the dumps as "highly likely authentic" based on corporate email structure and Azure-export
      consistency, and separately found compromised Microsoft credentials in its infostealer-log database
      associated with most of the named companies — leading it to assess the likely mechanism as infostealer
      malware harvesting credentials or session cookies from individual endpoints rather than a platform-wide Azure
      vulnerability. Only Tata Consultancy Services has issued a public rebuttal, telling India's stock exchange the
      referenced data "appears to be more than four years old and limited to basic employee information," with "no
      indication that customer data, customer systems, or TCS operational systems have been impacted," and stating
      it has had safeguards against password-spray/MFA-fatigue techniques in place for over two years. No other
      named organisation — including Vodafone — has confirmed or denied the claim at time of writing, and the
      actual initial-access vector for any of the nine has not been independently established.
    region_nexus: "global claim; Vodafone is the sole named European telecom operator, matching this constituency's telco sector interest"
    primary_sector_nexus: "indirect — telco (Vodafone); the identity/credential-exposure technique class is directly transferable to any Entra ID/Azure AD tenant, including Swiss/EU federal and cantonal M365 deployments"
    sector: "telco"
    cves: []
    techniques: ["T1078.004", "T1110.003", "T1621", "T1539"]
    affected_products: ["Microsoft Azure", "Microsoft Entra ID"]
    entity_keys: []
    new_entities:
      - { key: "actor:thehatman", type: actor, name: "TheHatman", aliases: [],
          summary: "Forum/marketplace handle selling employee-directory records it claims were exfiltrated directly from nine large organisations' Microsoft Azure/Entra ID tenants (McDonald's, Vodafone, TCS, HCL, IHG, Kyndryl, Gap, Hexaware, Wyndham) between 31 July and 16 August 2026 using compromised credentials, password spraying and MFA-fatigue prompts; Hudson Rock assessed the data as highly likely authentic but could not confirm the intrusion vector (The Register, BleepingComputer, 2026-08-17)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: LOW
    novelty: new
    evidence:
      - quote: "Judging by the massive size of the organizations impacted, it appears highly likely that this campaign originates from targeted exploitation of Infostealer infections rather than a systemic zero-day vulnerability in Azure."
        attribution: "Hudson Rock (via The Register)"
        source_url: "https://www.theregister.com/security/2026/08/17/crook_hawks_millions_of_records_allegedly_plundered_from_corporate_azure_tenants/5288305"
      - quote: "The information referenced appears to be more than four years old and limited to basic employee information. There is no indication that customer data, customer systems, or TCS operational systems have been impacted."
        attribution: "Tata Consultancy Services statement (via The Register)"
        source_url: "https://www.theregister.com/security/2026/08/17/crook_hawks_millions_of_records_allegedly_plundered_from_corporate_azure_tenants/5288305"
      - quote: "I'm selling McDonald's Corporation internal employee dump downloaded directly from Azure Tenant using compromised credentials."
        attribution: "TheHatman (threat-actor forum post, via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/hacker-claims-36-million-azure-account-records-stolen-from-major-companies/"
    extended_notes: |
      Treated strictly as an actor's claim per the fake-news guard — it ships only because two independent
      high-reliability outlets (BleepingComputer, The Register) reported it and a named cybercrime-intelligence firm
      assessed partial authenticity; the underlying intrusion mechanism into any of the nine tenants remains
      unconfirmed, and TCS has actively rebutted the framing with a dated, non-sensitive characterisation of its own
      exposure. Vodafone has not commented. Defender-relevant regardless of final attribution: the pattern described
      (infostealer-harvested credentials/session cookies reaching Entra ID Global Administrator-adjacent accounts at
      enterprise scale) is a live identity-security concern for any large Entra ID tenant, independent of whether
      these specific nine claims hold up.
    watchlist: null
