    kind: cited
    text: "The Federal Data Protection and Information Commissioner (EDÖB) says PK Softech notified it of the cyberattack on its IT infrastructure on 2026-10-08, that the affected pension funds also reported to it, that it started an informal preliminary inquiry at Publica on 2026-10-14 and that on 2026-10-22 it opened a formal investigation against PK Softech AG on suspicion of data-protection violations ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 5dc63e3966
