  - claim_id: 6063247d08
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "headline"
    kind: frontmatter
    text: "Required LDAP and SMB signing did not stop NTLM relay: a re-authenticated session kept the attacker's key"
  - claim_id: ff41861731
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "summary"
    kind: frontmatter
    text: "SpecterOps (LDAP, 2026-10-23) and Blackfield (SMB, 2026-10-21) independently show that a domain controller or file server that requires signing still accepts a relayed NTLM authentication when the attacker first opens a signed session of its own and then re-authenticates it as the victim, so the session keeps a signing key the attacker knows. Microsoft fixed the SMB variant in September 2026 and the LDAP variant in the 2026-10-13 cumulative update; SpecterOps reports no reply to its report and Blackfield found no CVE for the SMB change; public tooling exists and neither researcher reports use in attacks."
  - claim_id: c2030f122e
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm that every domain controller has the cumulative update of 2026-10-13 and every Windows server the September 2026 one for its Windows release (SpecterOps names KB5126646, the October update for Windows Server 2025, and KB5122882, the September update for Windows Server 2022; other releases have their own packages), then list the computer accounts whose msDS-AllowedToActOnBehalfOfOtherIdentity or msDS-KeyCredentialLink holds a value nobody set, because patching does not remove what a relay already wrote."
  - claim_id: 4e672d4c85
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "For LDAP, the attacker signs a session to a domain controller with valid credentials or, where accepted, an anonymous NTLM context, coerces a victim over SMB, and sends the victim's relayed authentication with a malicious LDAP modification in one SASL record signed with the attacker's key; the controller checks the signature once, switches to the victim's identity and runs the modification with the victim's rights ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 110d203f16
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "The tested controller enforced LDAP signing and channel binding and the attack still worked over 389/TCP; the demonstration writes the resource-based constrained delegation attribute, and relaying a domain controller's machine account to another controller leads to DCSync and domain compromise ("
    urls: ["https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"]
  - claim_id: 7bb1392fb1
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "body"
    kind: cited
    text: "Blackfield shows the SMB counterpart: a server keeps the original signing key on re-authentication without checking that the identity matches, so on any host that requires SMB signing, domain controllers included, a relayed privileged authentication yields a privileged session still signed with the low-privilege key, provided the attacker can capture or coerce that authentication ("
    urls: ["https://blackfield.ch/blog/defeating-enforced-smb-signing/"]
