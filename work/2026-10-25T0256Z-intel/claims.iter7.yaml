    kind: cited
    text: "Its release states that data of several important occupational pension institutions, Publica among them, was exfiltrated in the attack; the investigation is to give an overall picture of the personal data the funds handed to the software supplier and to clarify the legal framework of those transfers, how they were actually implemented and the scope of the data that left, and the EDÖB gives no further information on pending proceedings ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
