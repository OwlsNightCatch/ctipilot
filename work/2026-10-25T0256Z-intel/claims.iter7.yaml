claims:
  - claim_id: 5c0f7697c3
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse says it must be assumed so, the Ticino fund IPCT says data of about 1,800 of its insured persons sat on the attacked server and writes to all its insured because it cannot exclude more, and other funds are still checking. The Federal Data Protection Commissioner, who opened a formal investigation against PK Softech on 2026-10-22, states that data of several pension funds, Publica among them, was exfiltrated. As of 2026-10-22 neither the Confederation nor Publica has itself named the actor or the demand."
