    kind: cited
    text: "**Exposure:** any software that keeps its own CA bundle or does not check revocation keeps trusting the intermediates until updated; the tracker lists fixed versions for Python (3.15.1, 3.14.9 and 3.13.17, and pip 26.2.2), Python certifi, rustls-webpki, the curl CA bundle, the Composer ca-bundle, Erlang certifi and several distributions' ca-certificates packages, shows Node.js, Bun and FreeBSD as fixed, and lists Bottlerocket, Godot and LibreOffice as still pending ("
    urls: ["https://emudhra.we-have-a-problem.com/"]
  - claim_id: ade999e002
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "), and an ACME client will not replace a certificate under that root outside its renewal window unless it supports ACME Renewal Information, so trigger the renewal by hand ("
    urls: ["https://thehackernews.com/2026/10/emudhra-to-exit-global-ssltls-business.html"]
  - claim_id: ccdc4bdbed
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-10-25T03:36:20Z"
    kind: cited
    text: "ENISA's record scores it 9.4 (CVSS 4.0) and lists CPython before 3.16.0 as affected, and the announcement names no release that carries the denylist ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-109299"]
  - claim_id: 76f95a0486
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-10-25T03:36:20Z"
    kind: cited
    text: "The incident tracker lists Python 3.15.1, 3.14.9 and 3.13.17 and pip 26.2.2 as patched, and a Python core developer stresses that pip before 26.2.2 keeps trusting the compromised intermediates whatever the system trust store holds, because it always loads its own vendored certifi ("
    urls: ["https://emudhra.we-have-a-problem.com/", "https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576"]
  - claim_id: 613593895e
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-10-25T03:36:20Z"
    kind: cited
    text: "Cisco's informational advisory, version 1.1 of 2026-10-24, lists as impacted with remediation a TLS policy that blocks the known eMudhra issuers on Secure Firewall Management Center, Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1, ThousandEyes Enterprise Agent (Application-hosting Agent 5.2.2, 2026-10-23), Meraki MV Smart Camera Firmware (2026-11-18), IOS XR 26.4.1 (2026-11-30) and Ultra Cloud Core Subscriber Microservices Infrastructure 2026.04.1 (November 2026), keeps further products under investigation, and says Cisco PSIRT is not aware of malicious use ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r"]
  - claim_id: 667cd25347
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-10-25T03:36:20Z"
    kind: cited
    text: "eMudhra's board decided on 2026-10-22 to leave the global SSL/TLS certificate business, and its G1 RSA roots keep serving customers during the transition ("
    urls: ["https://emudhra.com/en/press-release/emudhra-to-exit-global-ssl-tls-certificate-business"]
  - claim_id: e88849924f
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-10-25T03:36:20Z"
    kind: cited
    text: "The Hacker News counts about 30,800 unexpired certificates under the emSign ECC Root CA - G3 that Chrome stops trusting on 2026-10-27, 99.9 percent of them issued through InCommon, and relays Chrome's point that standard ACME clients do not replace a certificate outside its renewal window unless they support ACME Renewal Information or someone steps in by hand ("
    urls: ["https://thehackernews.com/2026/10/emudhra-to-exit-global-ssltls-business.html"]
  - claim_id: c5203111c3
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-10-25T03:36:20Z"
    kind: record-summary
    text: "Oracle's second Security Alert of 2026-10-24, CVE-2026-114820 (CVSS 3.1 9.1), lists as affected the Java builds that the incident tracker had named as fixed for the first alert and removes four root CAs, so a standalone Java runtime updated on 2026-10-21 needs the new update or the same stop-gap again; OpenJDK now says Debian, Devuan and Ubuntu packages need the keystore recreated by hand. Python announces a built-in ssl denylist (CVE-2026-115557) without naming a release, so pip 26.2.2 is the Python fix to apply now; Cisco lists the products it has fixes for; and eMudhra is leaving the global TLS business while ACME clients will not replace affected certificates outside their renewal window by themselves."
  - claim_id: ff41861731
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "summary"
    kind: frontmatter
    text: "SpecterOps (LDAP, 2026-10-23) and Blackfield (SMB, 2026-10-21) independently show that a domain controller or file server that requires signing still accepts a relayed NTLM authentication when the attacker first opens a signed session of its own and then re-authenticates it as the victim, so the session keeps a signing key the attacker knows. Microsoft fixed the SMB variant in September 2026 and the LDAP variant in the 2026-10-13 cumulative update; SpecterOps reports no reply to its report and Blackfield found no CVE for the SMB change; public tooling exists and neither researcher reports use in attacks."
  - claim_id: c2030f122e
    entry: 2026-10-25/ntlm-relay-signing-bypass-reauthentication-ldap-smb
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm that every domain controller has the cumulative update of 2026-10-13 and every Windows server the September 2026 one for its Windows release (SpecterOps names KB5126646, the October update for Windows Server 2025, and KB5122882, the September update for Windows Server 2022; other releases have their own packages), then list the computer accounts whose msDS-AllowedToActOnBehalfOfOtherIdentity or msDS-KeyCredentialLink holds a value nobody set, because patching does not remove what a relay already wrote."
