items:
  - title: "ANSSI director general to the French Senate: the refrigeration-controller attacks exploited elementary flaws (controllers directly on the internet, administered without protection, weak passwords), not recently published vulnerabilities"
    sources:
      - { url: "https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches", publisher: "Public Sénat", date: "2026-10-21", role: "primary" }
      - { url: "https://www.lemondeinformatique.fr/actualites/lire-frigos-de-supermarches-pirates-l-anssi-pointe-des-failles-de-securite-elementaires-100864.html", publisher: "Le Monde Informatique", date: "2026-10-22", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/", publisher: "CERT-FR (CERTFR-2026-ALE-012)", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: le-monde-info, URL https://www.lemondeinformatique.fr/ (extract of the front page, headline 'Frigos de supermarchés piratés : l'Anssi pointe des failles de sécurité élémentaires') → drill: https://www.lemondeinformatique.fr/actualites/lire-frigos-de-supermarches-pirates-l-anssi-pointe-des-failles-de-securite-elementaires-100864.html → WebSearch (\"Vincent Strubel Sénat audition frigos supermarchés cyberattaque Danfoss mots de passe faibles pas de zero-day\") → primary: Public Sénat report of the 2026-10-21 hearing, URL https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches → corroboration: CERT-FR alert, URL https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/. No Senate transcript was published or reachable; both outlets report the hearing."
    summary: |
      Vincent Strubel, director general of ANSSI, told the French Senate foreign-affairs committee on
      2026-10-21 that the October attack on supermarket refrigeration controllers did not rest on an
      advanced technique. ANSSI's analysis, in his words as reported by Public Sénat, is that elementary
      security flaws were exploited, starting with refrigeration equipment sitting directly on the
      internet and administered without particular protection, plus weak passwords. He dismissed the
      "third-party analyses" that tied the attack to vulnerabilities researchers had published over the
      previous two years, and Le Monde Informatique adds that the systems were reachable without a
      firewall or network segmentation and that the management interface was protected only by weak
      passwords. That is a claim by the national authority that holds the incident telemetry; neither
      outlet reports any evidence beyond the testimony, and ANSSI names no actor and no entry path
      beyond exposure plus credentials (it does not say whether passwords were guessed or were
      factory defaults). CERT-FR's own alert, already carried by the store entry, tells owners to
      remove internet exposure, set the Danfoss security level to "Strict" and make sure default
      passwords were changed, which is consistent with the testimony. Two further points from the
      hearing: ANSSI says it has no means to impose connection rules on retailers (securing the
      equipment stays with the chains and their maintenance contractors), and Strubel warned that
      identical refrigeration installations hold vaccines and hazardous material in laboratories and
      pharmacies, where ANSSI says it ran a rapid check with health-sector players. Count and date
      differ between outlets: Public Sénat writes that more than 700 supermarkets of the Leclerc,
      Intermarché and Super U banners lost control of the regulation software and dates the attack to
      the night of 12 to 13 October, while Le Monde Informatique (and the store entry's AFP basis)
      has at least 300 Intermarché and Netto shops and the night of 11 to 12 October.
    region_nexus: "France; NCSC Switzerland rates the same activity actively exploited (already in the entry). Swiss owners of internet-reachable Danfoss, Copeland or Dixell cold-chain controllers (hospital, laboratory, pharmacy, cantonal-facility and retail refrigeration) are the same exposure class."
    primary_sector_nexus: "indirect"
    sector: "retail; healthcare cold chain"
    cves: []
    techniques: [T1133, T1110, T1078]
    technique_basis: "ANSSI names direct internet exposure of the management interface (T1133 External Remote Services) and weak passwords (T1110 Brute Force / T1078 Valid Accounts); it does not say whether credentials were guessed or defaults, so no sub-technique is claimed."
    affected_products: ["Danfoss AK-SM", "Danfoss AK-SC", "Copeland xweb", "Dixell xweb"]
    entity_keys:
      - "incident:danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack-2026-10"
      - "product:danfoss-ak-sm-800"
      - "product:danfoss-ak-sc-355"
      - "product:danfoss-ak-sm-800a"
      - "product:copeland-xweb"
      - "product:dixell-xweb"
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    admiralty_suggestion: { reliability: B, credibility: 2, note: "two independent outlets report the same hearing; the testimony is the authority's own analysis, not independently confirmed" }
    novelty: "update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack"
    lookback: true
    delta_vs_entry: "The entry says no source names how the attackers got in. ANSSI's director general now states the cause class (exposure plus weak or unprotected administration, not the published flaws), which moves the defender question from 'is there a patch' to 'is the controller reachable and how are its credentials set'. Entry fields likely to move: summary, Exposure, Detection, Defender takeaway; not priority."
    evidence:
      - { quote: "ce sont des défauts de sécurisation élémentaire qui ont été exploités, à commencer par", attribution: "Public Sénat", source_url: "https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches" }
      - { quote: "des mots de passe faibles, ce genre de choses", attribution: "Public Sénat", source_url: "https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches" }
      - { quote: "sans pare-feu ni segmentation réseau", attribution: "Le Monde Informatique", source_url: "https://www.lemondeinformatique.fr/actualites/lire-frigos-de-supermarches-pirates-l-anssi-pointe-des-failles-de-securite-elementaires-100864.html" }
      - { quote: "que les mots de passe par défaut ont été changés", attribution: "CERT-FR (CERTFR-2026-ALE-012)", source_url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/" }
    extended_notes: |
      Detection concept (from the mechanism the sources state, nothing beyond it): the telemetry that
      matters is edge firewall or NetFlow data showing inbound sessions from the internet to the
      controller's management ports from addresses that are not the refrigeration contractor's, and the
      controller's own configuration and login history (setpoints and defrost schedules; CERT-FR asks
      owners to check the whole configuration, defrost ranges included). Because the cause is exposure
      and credentials, a firmware update alone does not close it: remove the public address, restrict to
      VPN or protected network, set the Danfoss security level to Strict, change default or weak
      passwords, and replace end-of-life units (CERT-FR: a factory reset alone leaves an EOL unit
      vulnerable). Benign lookalike: the contractor's own remote-maintenance sessions look the same on
      the wire, which is why CERT-FR flags checking insurance and contract terms before cutting the data
      uplink. The SGDSN secretary-general's remarks on young, low-sophistication, high-impact actors
      concern cyber-crime in general in the same hearing and are not tied to this attack by either
      official.

  - title: "PHP2Shell in Switzerland: a Swiss-Austrian scanner's live tracker shows about 54,200 of 1.82 million Swiss web servers on affected or end-of-life PHP three days after the fix, roughly six in ten of those that reveal a PHP version; the press figure of 3.5% is a share of all servers"
    sources:
      - { url: "https://php.risikomonitor.com/ch", publisher: "risikomonitor GmbH (PHP2Shell-Lagebild Schweiz)", date: "2026-10-25", role: "primary" }
      - { url: "https://php.risikomonitor.com/api/history", publisher: "risikomonitor GmbH (tracker data endpoint the page loads)", date: "2026-10-24", role: "primary" }
      - { url: "https://php.risikomonitor.com/api/stats", publisher: "risikomonitor GmbH (tracker data endpoint the page loads)", date: "2026-10-25", role: "primary" }
      - { url: "https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022", publisher: "Inside IT", date: "2026-10-22", role: "corroborating" }
      - { url: "https://www.netzwoche.ch/news/2026-10-23/update-kritische-php-schwachstellen-offenbar-schon-seit-2024-bekannt", publisher: "Netzwoche", date: "2026-10-23", role: "corroborating" }
      - { url: "https://www.bacs.admin.ch/de/warnung-php-de", publisher: "BACS / NCSC Switzerland", date: "2026-10-21", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'PHP-Angriffe: Schweiz blieb bis anhin verschont') → https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022 (names the Risikomonitor live system and its link) → netzwoche feed item https://www.netzwoche.ch/news/2026-10-23/update-kritische-php-schwachstellen-offenbar-schon-seit-2024-bekannt (22 October scan figure) → primary: https://php.risikomonitor.com/ch and the two data endpoints its own script loads (https://php.risikomonitor.com/api/history, https://php.risikomonitor.com/api/stats) → BACS warning https://www.bacs.admin.ch/de/warnung-php-de for the backport caveat."
    summary: |
      Risikomonitor, a scanner firm that reads the version a web server announces in its response
      headers (passive, one homepage request, no exploit), publishes a live PHP2Shell tracker for
      Switzerland and Austria. Its history data put the Swiss "vulnerable" count at 7,415 of 214,274
      servers on 2026-10-21, 23,394 of 688,894 on 2026-10-22 (the "3.5%" that Inside IT and Netzwoche
      quote), and 54,208 of 1,820,783 on 2026-10-24 (about 3.0%), with a further 54,147 servers that hide
      or only partly show the version. Coverage grew about 2.6-fold over those days, so the daily counts
      are not like for like. The share matters less than its denominator: "total" counts every web
      server reached, including those without PHP. Summing the tracker's per-canton aggregates (our
      arithmetic, 2026-10-25T03:03Z) gives 54,209 servers on affected or end-of-life versions against
      34,876 on fixed builds, i.e. about 61% of the Swiss servers that reveal a PHP version, and the
      tracker's top-20 list shows most of the vulnerable ones on end-of-life branches (7.3.33, 7.4.33,
      8.1.34, 5.6.x and older, roughly 41,000 of the 54,000 by our sum of the listed versions) that
      receive no upstream fix, with about 7,800 more on supported branches that simply were not
      updated (8.3.35, 8.2.34, 8.4.26, 8.5.11). Caveats the sources themselves give: BACS says a
      distribution may backport the fix into an unchanged version string, so a header-based count is an
      upper bound for those hosts; the tracker books servers by the company seat in the legal notice,
      which concentrates 16,543 of the 54,209 in St. Gallen-seated operators (probably a few mass
      hosters; this is our inference); and the tracker advises a WAF where BACS says a WAF alone is not
      enough. BACS told Keystone-SDA on 2026-10-22 that it knows of no attacks in Switzerland but cannot
      exclude unrecognised ones, and that PHP applications of the federal administration were
      affected without a complete picture of their update status. This is one commercial scanner's
      measurement relayed by two trade outlets, not independent confirmation.
    region_nexus: "Switzerland (and Austria in the same tracker); cantonal, communal, university and hospital sites that took PHP offline on 2026-10-21 and 2026-10-22 are the visible part of this estate."
    primary_sector_nexus: "direct"
    sector: "public-sector; hosting"
    cves: [CVE-2026-109618, CVE-2026-109619]
    techniques: [T1190]
    affected_products: ["PHP"]
    entity_keys: ["product:php", "tool:php2shell"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    admiralty_suggestion: { reliability: C, credibility: 3, note: "commercial scanner with passive header method and no track record in this store; Inside IT and Netzwoche relay the same tracker" }
    novelty: "update-of:2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619"
    delta_vs_entry: "The entry has BACS's 'no attacks known, no complete overview of the update status' and the take-down list but no measurement of how much of the Swiss PHP estate stayed unpatched. Entry fields likely to move: summary and Exposure (add the Swiss measurement with its caveats and the end-of-life point: an update is not available upstream for branches 8.1 and older). The PHP Foundation's own post-mortem of 2026-10-21 (decision deadlock since 2024, Calif report on 2026-08-11) and Amazon/Cloudflare pre-patch exploitation timing are S1 material; the entry does not carry the post-mortem."
    borderline: true
    borderline_reason: "single-source commercial-scanner measurement with method caveats; adds Swiss scale to a critical entry and corrects a misleading press percentage, but the main agent should decide whether it earns an update record"
    evidence:
      - { quote: "\"CH\":{\"total\":1820783,\"vuln\":54208,\"maybe\":54147,\"ok\":1712428}", attribution: "risikomonitor GmbH", source_url: "https://php.risikomonitor.com/api/history" }
      - { quote: "Alles darunter sowie End-of-Life-Zweige (8.1 und älter) gelten als betroffen", attribution: "risikomonitor GmbH", source_url: "https://php.risikomonitor.com/ch" }
      - { quote: "20'231 Webserver, also 3,5%, seien zum Zeitpunkt der Recherche noch betroffen", attribution: "Inside IT", source_url: "https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022" }
      - { quote: "Eine unveränderte PHP-Hauptversion bedeutet deshalb nicht automatisch, dass der Patch fehlt.", attribution: "BACS / NCSC Switzerland", source_url: "https://www.bacs.admin.ch/de/warnung-php-de" }
      - { quote: "Dem Bundesamt für Cybersicherheit (Bacs) sind nach eigenen Angaben keine Angriffe in der Schweiz bekannt", attribution: "Inside IT", source_url: "https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022" }
    extended_notes: |
      Triage and detection angle for public-sector defenders: servers that announce their PHP version
      (X-Powered-By style headers) are fingerprinted by passive scanners and can be by attackers, but
      hiding the version is not safety (54,147 Swiss servers hide it and are simply unknown). The
      hunt is the same as in the entry: inventory PHP including embedded and vendor-run installations
      (BACS says operators often do not know a product runs PHP), confirm the fixed build on the
      running process after restart, then review web-server access logs for the multipart-request
      pattern named in the vendor advisories. The measurement arithmetic is ours and reproducible from
      the two tracker endpoints; the tracker's /api/stats response also holds EU-wide aggregates for
      comparison.

  - title: "EFK audit of Microsoft 365 in the federal administration: platform soundly built, but the set of security analytics to monitor is undefined, tenant configuration is only partly automated, and the full backup in federal data centres is still being built with a US-hosted admin console and a Microsoft-dependent interim"
    sources:
      - { url: "https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/", publisher: "Eidgenössische Finanzkontrolle (EFK / Swiss Federal Audit Office)", date: "2026-10-21", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern", publisher: "Netzwoche", date: "2026-10-22", role: "corroborating" }
      - { url: "https://www.inside-it.ch/efk-sieht-verbesserungsbedarf-bei-m365-beim-bund-20261022", publisher: "Inside IT", date: "2026-10-22", role: "corroborating" }
    discovery_trace: "first seen at: netzwoche, URL https://www.netzwoche.ch/rss.xml (item 'Bund muss bei der Datensicherung von Microsoft 365 nachbessern', dated 2026-10-22) and inside-it-ch, URL https://www.inside-it.ch/rss.xml (item 'EFK sieht Verbesserungsbedarf bei M365 beim Bund') → https://www.netzwoche.ch/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern (links the audit) → primary: EFK audit page, URL https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/ (the PDF report itself was not read; the page and the Netzwoche reading of the report are the basis)."
    summary: |
      The Swiss Federal Audit Office (EFK) published an audit, run between February and April 2026, of
      Microsoft 365 as introduced across the federal administration (54,000 BIT-operated workplaces
      migrated between October 2024 and December 2025; the Federal Chancellery's digital-transformation
      area BK-DTI leads, the Federal Office of Information Technology BIT operates). The EFK rates the
      platform properly built and the security level appropriate for the current restrictive use (only
      unclassified information may be processed; labelling and data-loss-prevention are in place, and
      the E5 licence tier was chosen deliberately for its security components). Open findings, as the
      EFK page states: BK-DTI and BIT must define which of the platform's information-security
      analytics are monitored systematically; BIT should automate tenant configuration as far as
      possible (Netzwoche reads this as Microsoft's Desired State Configuration); BK-DTI has not
      defined how often compliance with security standards is evaluated or how to react to deviations;
      and the required backup on the administration's own systems is still being built. Netzwoche's
      reading of the report adds the backup detail: the admin console of the full-backup product is
      hosted in the USA, contrary to the federal rules; as an interim BIT replaced the full backup with
      the M365 Backup service, which makes backup availability depend on Microsoft (with the
      connection to M365 lost there would be no backup), so the EFK wants a local backup built as
      quickly as possible and restore tests run regularly; BIT's statement in the report, as Netzwoche
      relays it, says an equivalent solution has meanwhile been built and put into production. Customer-managed
      keys are planned, with object-level encryption via Microsoft Information Protection in a third phase,
      aiming at processing "Intern" data one day. The EFK also notes, without a recommendation, that
      Microsoft can roll out some feature updates without a prior Message Center entry. This is an
      audit of the federal administration; it creates no obligation for cantons or communes.
    region_nexus: "Switzerland, federal administration; transferable as a benchmark to cantonal and communal M365 tenants"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: ["Microsoft 365"]
    entity_keys: ["product:microsoft-365"]
    new_entities:
      - { key: "report:efk-microsoft-365-security-and-usability-audit-2026", type: report, name: "EFK audit: security and usability of Microsoft 365 (federal administration), 2026-10", aliases: ["Sicherheit und Nutzbarkeit von Microsoft 365"], summary: "Swiss Federal Audit Office audit (February to April 2026, published October 2026) of the federal M365 rollout: platform soundly built, open points on monitoring scope, configuration automation and an own-premises backup (EFK, 2026-10-21)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    admiralty_suggestion: { reliability: A, credibility: 1, note: "the EFK is the issuing authority; Netzwoche independently reads the report; the BIT statement is relayed second-hand" }
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "governance audit of one administration; no threat, no obligation on others; actionable only as a benchmark for M365 monitoring scope, drift detection and an own backup with restore tests"
    evidence:
      - { quote: "Die geforderte Datensicherung auf eigenen Systemen der Bundesverwaltung befindet sich noch im Aufbau.", attribution: "EFK", source_url: "https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/" }
      - { quote: "BK-DTI hat noch nicht definiert in welchem Rhythmus die Einhaltung von relevanten Sicherheitsstandards erhoben werden soll, und wie darauf zu reagieren ist.", attribution: "EFK", source_url: "https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/" }
      - { quote: "Allerdings werde die Administrationskonsole dieser Lösung in den USA gehostet und stehe damit im Widerspruch zu den bundeseigenen Vorgaben, schreibt die EFK.", attribution: "Netzwoche", source_url: "https://www.netzwoche.ch/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern" }
    extended_notes: |
      Detection and hardening concepts the audit supports: decide which M365 security analytics
      (sign-in, audit and configuration-state reports) are watched continuously and who acts on them;
      compare tenant configuration against a defined desired state on a fixed cadence and define the
      response to drift; keep a backup of mailbox, SharePoint and OneDrive data that does not depend on
      the Microsoft connection being available and test restores. The audit page and Netzwoche are the
      basis; the full PDF report was not read, so the recommendation list above is as complete as those
      two readings, not as the report.

