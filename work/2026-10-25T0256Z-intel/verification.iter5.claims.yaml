claims:
  - {claim_id: 60b4484dcc, verdict: ok, source_url: "https://www.oracle.com/security-alerts/alert-cve-2026-114820.html", passage: "Oracle Java SE: 8u511-b32, 8u511-perf-b32, 11.0.33.0.2, 17.0.21.0.2, 21.0.13.0.2, 25.0.5.0.2, 27.0.1.0.2 (affected); OpenJDK: act immediately even if updated in the past few days"}
  - {claim_id: 7348716267, verdict: ok, source_url: "https://emudhra.we-have-a-problem.com/", passage: "Python | 3.15.1, 3.14.9, 3.13.17 ; pip | 26.2.2; PSF: names no release; ENISA 9.4 CVSS:4.0 UI:P, CPython 0 <3.16.0; Discourse: any pip < 26.2.2 will keep trusting the compromised intermediate CAs"}
  - {claim_id: 03f4379e16, verdict: ok, source_url: "https://groups.google.com/g/golang-announce/c/66pojueaQek", passage: "Go versions 1.27.3 and 1.26.10 ... This is CVE-2026-111943 ... Verify will now filter out chains which contain these intermediates"}
  - {claim_id: 7075eab122, verdict: ok, source_url: "https://openjdk.org/emudhra", passage: "Debian Linux and derived distributions (e.g., Devuan and Ubuntu) require a manual workaround ... rm -f /etc/ssl/certs/java/cacerts; update-ca-certificates --fresh; FreeBSD and Homebrew do not use the OS certificates"}
  - {claim_id: c74f416257, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/", passage: "it had found no evidence they were used to issue certificates to end users"}
  - {claim_id: 5bb100f8c4, verdict: ok, source_url: "https://openjdk.org/emudhra", passage: "take one of the following actions immediately — even if you have updated your runtime in the past few days."}
  - {claim_id: 205a45894f, verdict: ok, source_url: "https://www.oracle.com/security-alerts/alert-cve-2026-114820.html", passage: "CVE-2026-114820 ... JSSE ... Remote Exploit without Auth? Yes ... 9.1 ... removes the set of impacted root CA certificates related to eMudhra; Rev 1 2026-October-24"}
  - {claim_id: 5540669a6d, verdict: ok, source_url: "https://openjdk.org/emudhra", passage: "fixes issue JDK-8395690, CVE 2026-114820 ... emsignrootcag1, emsignrootcag2, emsigneccrootcag3, comodoaaaca ... -Dcom.sun.net.ssl.checkRevocation=true"}
  - {claim_id: 6063247d08, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "we found that both protocols could be relay targets through re-authentication on a connection the attacker already owns. Signing was still enforced, just with the attacker known session key"}
  - {claim_id: ff41861731, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "we never received a response to that MSRC report. The fix shipped on October 13, 2026 update; Blackfield: I could not find a CVE for this specific change; SpecterOps releases The LDAP Switcheroo; reauthx tool"}
  - {claim_id: 110d203f16, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "had both LDAP signing and channel binding enforced, and the attack still worked over 389/TCP; relayed... modifying msDS-AllowedToActOnBehalfOfOtherIdentity; leads to DCSync and complete domain and forest compromise"}
  - {claim_id: cfa8802ea1, verdict: ok, source_url: "https://support.microsoft.com/en-us/servicing/os/windows-server/2026/10/kb5126646-windows-server-2025-security-update", passage: "This cumulative update for Windows Server 2025 (KB5126646) ... October 13, 2026; KB5122882: cumulative update for Windows Server 2022, September 8, 2026"}
  - {claim_id: 7d6aa19d4b, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "The attacker needs a signed LDAP session with a session key they know ... also needs to coerce a victim; If 389/TCP is blocked then this technique fails"}
  - {claim_id: 5484946765, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "ModifyRequest that writes msDS-AllowedToActOnBehalfOfOtherIdentity on LYS-SRV22$ ... modifying msDS-AllowedToActOnBehalfOfOtherIdentity or msDS-KeyCredentialLink"}
  - {claim_id: 6cc4a8f694, verdict: ok, source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", passage: "Patch domain controllers first. Install the October 2026 cumulative update (KB5126646) on every domain controller; Install the September 2026 update (KB5122882) on every server"}
  - {claim_id: e30ca2f005, verdict: ok, source_url: "https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", passage: "A working root exploit for a Linux kernel bug is now public, before it has a CVE or a merged fix; AlmaLinux was rooted with the Dirty Frag fix installed"}
  - {claim_id: f9dc4d5c20, verdict: ok, source_url: "https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", passage: "On October 21, ZDI sent five reports ... copied public mailing lists on every one ... None of the six bugs has been assigned a CVE ID yet"}
  - {claim_id: fbeaabd1ad, verdict: ok, source_url: "https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", passage: "skb_zerocopy() moves the same pages into a new socket buffer but does not carry the flag across ... PoC needs unprivileged user namespaces and ... nlmon ... act_pedit"}
  - {claim_id: 6172cd1d10, verdict: ok, source_url: "https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", passage: "the PoC needs unprivileged user namespaces; TuxCare reproduced a root shell on AlmaLinux 8-10, CloudLinux 9-10, Debian 12 and 13, Ubuntu 24.04 and 26.04; look for the ksmbd kernel module, ksmbd.mountd, kernel-owned listener on TCP 445"}
  - {claim_id: 3c299d1e2a, verdict: ok, source_url: "https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches", passage: "ce sont des défauts de sécurisation élémentaire qui ont été exploités, à commencer par l'exposition directe sur Internet d'équipements frigorifiques et leur administration sans sécurisation particulière, des mots de passe faibles; AFP: BFM TV said hackers managed to remotely trigger the forced defrosting; CERT-FR text; NCSC: Actively Exploited"}
  - {claim_id: 9912db25de, verdict: ok, source_url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/", passage: "Supprimer l'exposition Internet ...; Vérifier les conditions contractuelles d'assurance avant de couper la remontée des données; N'effectuer qu'un Reset Factory est dans ce cas insuffisant ... sera certainement de nouveau compromis"}
  - {claim_id: c633e1dacb, verdict: ok, source_url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/", passage: "Vérifier l'intégralité de la configuration, notamment les plages de dégivrage; mettre à jour le firmware, configurer le niveau de sécurité en mode Strict, s'assurer que les mots de passe par défaut ont été changés; Dixell PDF: compte d'usine Admin/Admin, Date d'expiration pour un prestataire extérieur"}
  - {claim_id: 669381baa5, verdict: ok, source_url: "https://www.infosecurity-magazine.com/news/french-supermarket-chains/", passage: "150 of its Intermarché stores and 30 of its Netto brand were affected; BFMTV: 300 magasins Intermarché et Netto ... deux fois plus élevé que les premières estimations (150); Coopérative U moins d'une centaine"}
  - {claim_id: 4011501ea2, verdict: ok, source_url: "https://www.bfmtv.com/economie/consommation/la-temperature-est-montee-jusqu-a-50-degres-une-cyberattaque-contre-les-systemes-frigorifiques-provoque-la-destruction-de-produits-frais-dans-des-centaines-d-intermarche-et-de-super-u_AN-202610120327.html", passage: "les pirates auraient détourné cette fonction en imposant un dégivrage forcé et continu, avec une consigne de température fixée à 50 degrés ... versions anciennes ... antérieures à la version 4"}
  - {claim_id: d1e67ba7a1, verdict: ok, source_url: "https://www.afp.com/en/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown", passage: "most of the affected equipment was 'legacy' products ... AK-SM800 and AK-SC355 ...; a vulnerability in software supplied by a Danish company ... other countries may be affected"}
  - {claim_id: e662c0bd00, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/cyberattack-shuts-down-refrigerators-at-french-supermarkets/", passage: "Following a cyberattack reportedly affecting a service provider that manages refrigeration systems in stores ... an Intermarché spokesperson told BleepingComputer"}
  - {claim_id: bd11997281, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/cyberattack-shuts-down-refrigerators-at-french-supermarkets/", passage: "While no information is available on how the Danfoss refrigeration controllers were compromised ... CVE-2025-41450 ... CVE-2025-41451 ... Claroty's Team82 research team, which found the two flaws"}
  - {claim_id: a429ef6e81, verdict: ok, source_url: "https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/", passage: "While Danfoss has not confirmed the exact initial access vector ... Danfoss patched several vulnerabilities in its AK-SM 800A controllers more than a year earlier: CVE-2025-41450, -41451, -41452; NCSC 13054: Alleged as potentially related (same three)"}
  - {claim_id: dee08c48fb, verdict: ok, source_url: "https://www.coolingpost.com/world-news/danfoss-moves-to-mitigate-cyberattack/", passage: "The current AK-SM800A systems affected were running outdated firmware; the majority of units affected were legacy products or current products running outdated firmware"}
  - {claim_id: e15f50f66c, verdict: ok, source_url: "https://www.securityweek.com/supermarket-refrigeration-attack-widens-to-copeland-dixell-controllers/", passage: "Copeland initially declined to confirm the agency's findings, but it has since acknowledged a vulnerability. 'We are currently working with impacted customers'; CSDive: A spokesperson for Copeland confirmed that a vulnerability was found in discontinued end-of-life controllers"}
  - {claim_id: 4349b24672, verdict: ok, source_url: "https://censys.com/blog/frostbitten-in-france-a-danfoss-storeview-internet-exposure-report/", passage: "4.2.4 ... fixed the date-based login (CVE-2025-41450) but is still vulnerable to CVE-2025-41451 and CVE-2025-41452; 4.3.1 or later fixes all three; Current is 5.3.2"}
  - {claim_id: 5c13bd3a76, verdict: ok, source_url: "https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf", passage: "Nous reconnaissons l'existence de la vulnérabilité identifiée sur une génération de contrôleurs XWEB EVO ...; Le XWEB EVO ... ne reçoit plus de correctifs de sécurité; Les XWEB PRO et EVO sont livrés avec le même compte d'usine : identifiant « Admin »"}
  - {claim_id: 41ec9dbb9e, verdict: ok, source_url: "https://www.bfmtv.com/economie/consommation/la-temperature-est-montee-jusqu-a-50-degres-une-cyberattaque-contre-les-systemes-frigorifiques-provoque-la-destruction-de-produits-frais-dans-des-centaines-d-intermarche-et-de-super-u_AN-202610120327.html", passage: "ces installations peuvent notamment être programmées pour effectuer deux heures de dégivrage sur une période de 24 heures ... dégivrage forcé et continu, avec une consigne de température fixée à 50 degrés"}
  - {claim_id: 87476622ad, verdict: ok, source_url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/", passage: "Supprimer l'exposition Internet des unités concernées ...; Rétablir l'accès uniquement via un VPN sécurisé ou un réseau protégé"}
  - {claim_id: b1204c2660, verdict: ok, source_url: "https://www.afp.com/en/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown", passage: "It added that it had long advised supermarkets to update from those models."}
  - {claim_id: 1f63e4cdfa, verdict: ok, source_url: "https://www.publicsenat.fr/actualites/politique/des-defauts-de-securisation-elementaire-et-des-mots-de-passe-faibles-ont-permis-la-cyberattaque-contre-les-frigos-de-supermarches", passage: "Auditionné par la commission des Affaires étrangères du Sénat ... a balayé les « analyses tierces » ... faisant état d'une exploitation « des vulnérabilités rendues publiques par différents chercheurs » au cours des deux années précédentes"}
  - {claim_id: 8e69156052, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-21-5", passage: "PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two critical vulnerabilities that can allow unauthenticated remote code execution. All PHP users are strongly encouraged to update immediately; 10-20: both rated CVSS v4.0 9.2"}
  - {claim_id: 35f3424034, verdict: ok, source_url: "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp", passage: "A fatal error ... can abandon an operation before it performs its matching reset ... The request heap is then freed while the worker global field still refers to it. A later operation ... can consume the stale value"}
  - {claim_id: 9d0b645a06, verdict: ok, source_url: "https://sansec.io/research/php2shell", passage: "That memory can contain passwords, session tokens, API keys and TLS private keys from other requests; table: CVE-2026-109618 Upload-progress unserializer use-after-free; GHSA-6wmf: confirmed impact heap use-after-free, memory disclosure and RCE; session upload progress lifecycle"}
  - {claim_id: 0800c1ea3c, verdict: ok, source_url: "https://www.security.nl/posting/958424/Misbruik+van+PHP2Shell-lek+gemeld%2C+DigiD+en+andere+sites+weer+online", passage: "Hadrian spreekt van grootschalig misbruik. Patchstack meldt actieve aanvalspogingen ... Of de aanvallen ook succesvol zijn is onduidelijk."}
  - {claim_id: 594ab485e6, verdict: ok, source_url: "https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/", passage: "CrowdStrike Counter Adversary Operations has not observed successful exploitation of these vulnerabilities in the wild or within our honeypot environments."}
  - {claim_id: a71270d065, verdict: ok, source_url: "https://www.wordfence.com/blog/2026/10/attacks-on-php2shell-continue-but-no-known-compromises-as-a-result-yet/", passage: "we have not observed any confirmed compromises resulting from these vulnerabilities; Firewall has already intercepted over 74,000 exploit or probing attempts"}
  - {claim_id: e9ef6009db, verdict: ok, source_url: "https://sansec.io/research/php2shell", passage: "An attack needs specific knowledge of the target server and specific conditions on it, so mass exploitation is less likely than we first expected. Update PHP anyway; Nobody has shown such a request; PoC exploits do not work against a default PHP installation"}
  - {claim_id: d91da44868, verdict: ok, source_url: "https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/", passage: "In your WordPress dashboard, go to Tools > Site Health, open the Info tab, and expand the Server section. The PHP version your site is running is listed there."}
  - {claim_id: fd827e8057, verdict: ok, source_url: "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/", passage: "Each command batch is wrapped in section-header delimiters, such as ==SHELLUSER== and ==PASSWD==; short, serially spaced tasks and quick pivots after failures; NTLM-relay tunnel into Active Directory; Cortex XDR process telemetry"}
  - {claim_id: d981318083, verdict: ok, source_url: "https://www.bacs.admin.ch/de/warnung-php-de", passage: "Dazu gehören das Deaktivieren der PHP-Upload-Fortschrittsanzeige und ... das Blockieren von Multipart-Anfragen am Webserver oder vorgeschalteten Proxy ... Auch eine Web Application Firewall allein genügt nicht."}
  - {claim_id: 8e75c40ab8, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-23-1", passage: "set session.upload_progress.enabled=0 until the next regular bugfix release ... we are handling it in the regular release cycle and will publish a full advisory for CVE-2026-115560 with the next release"}
  - {claim_id: ebb3836e49, verdict: ok, source_url: "https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/", passage: "These paths are specific to the lab environment."}
  - {claim_id: 14b03c8ca5, verdict: ok, source_url: "https://www.tenable.com/security/tns-2026-30", passage: "Security Center Versions 6.6.0, 6.7.2, 6.8.0, 6.9.1: SC-202610.2 ... php to version 8.2.35; Enclave Security Versions 1.7.0, 1.8.0, 1.9.1 (tns-2026-31)"}
  - {claim_id: 8176d755fa, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-566512.html", passage: "All versions with Palo Alto Networks PAN-OS (10.2 All, 11.1 All, 11.2 All, 12.1 All, 12.2 All) affected by all CVEs | Contact customer support to receive patch and update information"}
  - {claim_id: a0e3760c1a, verdict: ok, source_url: "https://www.admin.ch/de/newnsb/FjG4XOIms04s", passage: "Cyberangriff auf Softwarelieferant von Publica: Datenabfluss bestätigt ... stellte Ende September einen Cyberangriff fest ... weitere Kunden informiert. Die Bundesanwaltschaft hat Ermittlungen aufgenommen. Keine anderen Bundesstellen pflegen Geschäftsbeziehungen mit dem Unternehmen."}
  - {claim_id: b6f63b5769, verdict: ok, source_url: "https://www.pkpost.ch/news/260-cyberangriff-auf-softwarelieferant-der-pensionskasse-post", passage: "Ende September ist ein Cyberangriff auf den Softwarelieferanten PK Softech AG erfolgt ... Die Pensionskasse Post bezieht von PK Softech AG Software zur Verwaltung von Versichertendaten."}
  - {claim_id: a4fa8c16d4, verdict: ok, source_url: "https://www.pkpost.ch/news/263-cyberangriff-bei-softwarelieferant-versichertendaten-moeglicherweise-betroffen", passage: "dabei tatsächlich Personendaten abgeflossen sind. Ob Daten von Versicherten der Pensionskasse Post betroffen sind, bleibt weiterhin unklar."}
  - {claim_id: 610d0af629, verdict: ok, source_url: "https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss", passage: "Der Bundesrat und die Sicherheitsbehörden gehen inzwischen davon aus, dass Daten zu praktisch allen aktuellen und ehemaligen Angestellten des Bundes und bundesnaher Betriebe abgeflossen sind ... Bundesrichterinnen und Bundesrichter, ehemalige Bundesratsmitglieder"}
  - {claim_id: fa3efc3bb1, verdict: ok, source_url: "https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022", passage: "Die Bundesanwaltschaft habe bestätigt, 'dass Daten von der Ransomware-Gruppe Akira abgezogen wurden', so Tamedia; 20min: Nach bisherigen Erkenntnissen wurden die Daten von der Hackergruppe Akira gestohlen; Publica Stand 20.10.2026: Abklärungen dauern an"}
  - {claim_id: c06183b950, verdict: ok, source_url: "https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1", passage: "ca. 17'000 attivi e ca. 10'000 beneficiari; 14 ottobre il fornitore ci ha informati ...; ca. 1'800 persone; Al momento non abbiamo evidenze certe ... ma ciò appare verosimile; non possiamo escludere del tutto"}
  - {claim_id: c6479ec62b, verdict: ok, source_url: "https://www.pkzh.ch/de/aktuelles/cyberangriff-softech.html", passage: "Dabei sind Daten aus dem System der PK Softech AG entwendet worden. Darunter sind auch Personendaten von Versicherten sowie Rentnerinnen und Rentnern der PKZH; Die bisherigen Abklärungen deuten darauf hin"}
  - {claim_id: bdae1b233a, verdict: ok, source_url: "https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090", passage: "bestätigte die Bernische Pensionskasse (BPK) gegenüber der NZZ, 'dass entgegen vorherigen Informationen der PKS davon ausgegangen werden muss, dass Personendaten abgeflossen sind'"}
