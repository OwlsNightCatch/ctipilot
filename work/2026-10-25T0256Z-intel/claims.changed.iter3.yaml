claims:
  - claim_id: f6ffd02ba8
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "section 2026-10-25T03:37:30Z"
    kind: uncited
    text: "Neither outlet reports evidence beyond the testimony, and ANSSI names no actor; the account sits against Copeland's acknowledgment of a vulnerability in its end-of-life XWEB EVO controllers and the earlier report that ANSSI had identified a vulnerability in a Danish company's software, and no source reconciles them; the two outlets also differ on the date and the count, Public Sénat giving the night of 12 to 13 October and more than 700 supermarkets, Le Monde Informatique the night of 11 to 12 October and at least 300 Intermarché and Netto shops."
  - claim_id: 61648fe80a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms block the intermediates and eMudhra revoked them, but software that keeps its own trust store or does not check revocation stays exposed until updated: Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, Python added a built-in denylist as CVE-2026-115557 on 2026-10-24, and Oracle and OpenJDK's Java update of 2026-10-21 (CVE-2026-91403) was followed on 2026-10-24 by a second alert, CVE-2026-114820 (CVSS 3.1 9.1), that removes four root CAs and that OpenJDK says even a runtime updated in the past few days needs. Chrome removes the emSign ECC Root CA - G3 root on 2026-10-27. No exploitation is reported."
  - claim_id: 5574209ef6
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every non-browser TLS client that keeps its own CA bundle or does not check revocation, starting with standalone Java runtimes, including those already updated on 2026-10-21 (Oracle's Security Alert CVE-2026-114820 or the OpenJDK update), pip 26.2.2 or later in every Python environment, Go 1.27.3 or 1.26.10, and the CA bundles and base images the incident tracker lists, rebuild container images that embed an older bundle, then confirm with curl against the tracker's test host that the client rejects the certificate."
  - claim_id: a2db780bfe
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[1]"
    kind: frontmatter
    text: "Replace before 2026-10-27 every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3, by hand where the ACME client does not support ACME Renewal Information, because standard ACME clients do not replace a certificate outside its renewal window."
  - claim_id: dbed9f4264
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[2]"
    kind: frontmatter
    text: "Apply Cisco's remediation for the products its eMudhra advisory lists as impacted: a TLS policy on Secure Firewall Management Center that blocks the known eMudhra issuers, Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1 and ThousandEyes Enterprise Agent (Application-hosting Agent 5.2.2) now, and Meraki MV Smart Camera Firmware (2026-11-18), IOS XR 26.4.1 (2026-11-30) and Ultra Cloud Core Subscriber Microservices Infrastructure 2026.04.1 (November 2026) when they ship; other Cisco products are still under investigation."
