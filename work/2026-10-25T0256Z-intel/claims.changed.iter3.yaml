  - claim_id: f7a4ab82b0
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-10-25T03:36:20Z"
    kind: record-summary
    text: "Oracle's second Security Alert of 2026-10-24, CVE-2026-114820 (CVSS 3.1 9.1), removes four root CAs and lists Java SE builds such as 27.0.1.0.2 as affected, and OpenJDK says even a runtime updated in the past few days needs it, so a standalone Java runtime updated on 2026-10-21 needs the new update or the same stop-gap again; OpenJDK now says Debian, Devuan and Ubuntu packages need the keystore recreated by hand. Python announces a built-in ssl denylist (CVE-2026-115557) without naming a release, so pip 26.2.2 is the Python fix to apply now; Cisco lists the products it has fixes for; and eMudhra is leaving the global TLS business while ACME clients will not replace affected certificates outside their renewal window by themselves."
