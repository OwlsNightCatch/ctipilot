      Post-patch compromise check is generic for node RCE: unexpected child processes (sh, curl) of the Node.js server process, restarts/crashes of the app server, new files in the app or cache directories. No source gives a behavioural signature.
    borderline: true
    borderline_reason: "no exploitation or confirmed PoC; primary disclosure is 11 days old; kept because it is an unauthenticated RCE class in an internet-facing framework that the store has not covered"
  - title: "Juniper Junos OS and Junos OS Evolved October 2026 bulletin: nine unauthenticated or peer-reachable CVSS 9.8 flaws (J-Web authentication bypass, httpd and rpd stack overflows), not yet in the store"
    sources:
      - { url: "https://www.csa.gov.sg/alerts-and-advisories/alerts/al-2026-146/", publisher: "Cyber Security Agency of Singapore (AL-2026-146)", date: "2026-10-19", role: "primary" }
      - { url: "https://ccb.belgium.be/advisories/warning-multiple-critical-vulnerabilities-juniper-networks-junos-os-patch-immediately", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-10-16", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0430", publisher: "NCSC-NL (NCSC-2026-0430)", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (listing; warning 'Multiple Critical Vulnerabilities in Juniper Networks Junos OS, Patch Immediately!') -> https://ccb.belgium.be/advisories/warning-multiple-critical-vulnerabilities-juniper-networks-junos-os-patch-immediately -> corroborating: advisories-ncsc-nl feed item NCSC-2026-0430 (CSAF read with ncsc-nl csaf NCSC-2026-0430) and WebSearch ('Juniper Junos OS October 2026 security bulletin CVE-2026-101954 J-Web authentication bypass CVE-2026-101982 rpd') -> CSA Singapore alert; Juniper's own bulletin pages (supportportal.juniper.net, Salesforce SPA) return no article body on any rung tried, so they are not cited"
    summary: |
      Juniper's 2026-10 security bulletins (published 2026-10-14/15; relayed by CCB on 2026-10-16, NCSC-NL on 2026-10-16 and Singapore's CSA on 2026-10-19) fix a large set of Junos OS and Junos OS Evolved flaws; Singapore and CCB single out nine rated CVSS 3.1 9.8:
      CVE-2026-101954 (J-Web management interface and NETCONF session handling: an unauthenticated network attacker obtains root-level configuration access over a reachable J-Web HTTP/HTTPS service when web management is enabled),
      CVE-2026-101986 (J-Web authentication bypass to execute CGI content with elevated privileges through a crafted HTTP request), CVE-2026-101983 (stack-based overflow in the httpd process, unauthenticated RCE and DoS),
      CVE-2026-101982 (rpd stack overflow, a configured BGP/EVPN peer sending protocol-valid EVPN-VPWS route advertisements reaches root code execution on Junos OS, an rpd crash on Evolved),
      CVE-2026-101990 and CVE-2026-102178 (rpd stack overflows via BGP flowspec updates), CVE-2026-33796 and CVE-2026-33789 (rpd overflows via BMP route monitoring) and CVE-2026-102175 (heap overflow in the sdxd service-deployment daemon, root code execution for an attacker who controls or intercepts the configured SDX/SRC server connection).
      NCSC-NL's advisory adds further components (VXLAN gateway daemon, kmd on MX with crafted IKE certificate-based packets, SDK service with JDAF routing, ipfd on SRX) and rates probability medium, damage high.
      Affected (per CSA Singapore): Junos OS before 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3 and 26.2R1-S2, and the matching -EVO builds for Junos OS Evolved (23.4R2-S8.11-EVO, 24.2R2-S5.6-EVO, plus 25.2X100-D35-EVO and 25.4X300-D40-EVO); fixed in those releases or later.
      No source reports exploitation. FIRST EPSS on 2026-10-24 is low (0.0049 for CVE-2026-101954, 0.0057 for CVE-2026-101982). Mitigation named by CCB/CSA for the J-Web flaws: disable web management or restrict it to trusted hosts; several of the BGP flaws require a configured peer (flowspec/BMP/EVPN-VPWS), which limits exposure to hosts that accept those sessions.
