    discovery_trace: "first seen at: github-advisory, URL https://api.github.com/advisories?per_page=60&severity=critical&type=reviewed&sort=published&direction=desc (GHSA-673q-mjm6-r5xr and GHSA-2464-fhr4-w9xw, both critical, published 2026-10-22) -> pivot: nextjs-blog, URL https://nextjs.org/feed.xml (post 'Next.js Security Update for Upstream Vulnerabilities', 2026-10-14) -> primary: https://nextjs.org/blog/nextjs-security-update-october-14-2026 -> corroborating: WebSearch ('Next.js use cache typed arrays remote code execution GHSA-673q-mjm6-r5xr React GHSA-xqc2-xf4c-x3h3') -> CSA Singapore alert and CSA Labs note, URLs above"
    summary: |
      Vercel's out-of-band release of 2026-10-14 (Next.js 16.4.1 on the Active LTS line and 15.5.28 on Maintenance LTS) fixes two critical, unauthenticated remote-code-execution flaws and one high-severity denial of service.
      GHSA-673q-mjm6-r5xr (no CVE assigned) affects App Router applications that use Cache Components where a `use cache` function returns multiple typed arrays; Vercel says there is no known workaround and to upgrade even if the application has no such function; the root cause lies in React's RSC server packages (react-server-dom-webpack, -parcel, -turbopack), for which React issued a related advisory (GHSA-xqc2-xf4c-x3h3) with fixes in 19.0.9, 19.1.10, 19.2.9 and 19.3.1 as relayed by CSA Labs. Affected: 16.0.0 to 16.4.0.
      CVE-2026-96889 / GHSA-2464-fhr4-w9xw is a memory-safety flaw in an upstream library (librsvg through `sharp`; ENISA's EUVD record of the upstream CVE describes a use-after-free on a crafted SVG with nested XIncludes and duplicate entity declarations) reachable through the Image Optimization API when Next.js runs on glibc-based Linux; affected 10.0.0 to 15.5.27 and 16.0.0 to 16.4.0; interim mitigation is `sharp` 0.35.5 or later. Both rated CVSS 4.0 9.5 by Vercel as relayed by Singapore's CSA, while ENISA's EUVD record of the upstream librsvg CVE scores it 7.8 (CVSS 3.1) and FIRST EPSS is 0.002.
      The third fix is GHSA-p3m5-59mp-jv5r, CPU exhaustion through crafted Server Action requests in App Router. As of 2026-10-15 CSA Labs found no public report of active exploitation of any of the three; the public record does not settle whether a proof of concept exists (one press source attributes a PoC report to NHS England, which could not be fetched here, so treat as unverified). GitHub's database carried the advisories only from 2026-10-22, and the `use cache` and Server Actions advisories had no CVE at publication, so scanners keyed to CVE feeds can miss them.
    region_nexus: "global; Next.js is a common front-end framework for internet-facing portals, no Swiss-specific exposure reported"
