    extended_notes: |
      Delta against the covered entry (updated 2026-10-23T03:43Z): the entry names Oracle alert CVE-2026-91403, Go 1.27.3/1.26.10, certifi, rustls-webpki and curl as fixed paths and does not mention
      the second Oracle alert, the removal of the Sectigo COMODO AAA root from the JDK keystore, the Python denylist, Cisco's product list, or eMudhra's exit decision. The AAA point matters for
      detection: the entry's Detection line tells defenders to look for the eight intermediates or "their Sectigo cross-signs" in chain metadata; a chain that reaches the AAA root through a cross-sign is the path that stays trusted
      in platform trust stores that still ship the AAA root (a CPython issue commenter says Windows does), so removing the AAA root from application-owned stores is what Oracle/OpenJDK now recommend.
      Open questions the sources leave: Python fixed releases not stated; Oracle fixed build numbers not public; Microsoft/Apple status for the AAA root not stated in anything read.
