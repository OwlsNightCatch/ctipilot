    summary: |
      The covered eMudhra entry (2026-10-21) says Oracle's first alert, CVE-2026-91403, distrusted the eight intermediates. Four things moved on 2026-10-23/24.
      (1) Oracle published a second Security Alert on Saturday 2026-10-24, CVE-2026-114820 (CVSS 3.1 9.1, JSSE, remotely exploitable without authentication through APIs that process data), whose
      fix "removes the set of impacted root CA certificates related to eMudhra". Oracle's JDK remediation page lists the four roots deleted from the cacerts keystore: emSign Root CA G1, emSign Root CA G2,
      emSign ECC Root CA G3 and COMODO AAA Certificate Services ("comodoaaaca", the Sectigo root that cross-signed all eight intermediates in May 2025 per Cisco). The OpenJDK advisory of the same day lists
      27.0.1.0.2, 25.0.5.0.2, 21.0.13.0.2, 17.0.21.0.2, 11.0.32.1 and 8u504 and earlier as affected, which means the builds of 2026-10-21 that fixed CVE-2026-91403 are themselves still affected, and the
      OpenJDK page tells standalone-runtime users to act "even if you have updated your runtime in the past few days". The fixed build numbers sit in Oracle's Patch Availability Document (My Oracle Support CPU427), which is not public.
      Stop-gaps, per Oracle and OpenJDK: delete the four aliases from cacerts (keytool -delete -cacerts), or enable revocation checking (com.sun.net.ssl.checkRevocation, com.sun.security.enableCRLDP); Debian and Ubuntu OpenJDK packages need the keystore recreated because ca-certificates-java does not refresh it.
      (2) The Python Software Foundation announced CVE-2026-115557 (CVSS 4.0 9.4 in EUVD) on 2026-10-24: the standard library ssl module now carries a denylist of compromised intermediate keys (SPKI match, so cross-signs are caught) that applies whatever the SSLContext policy; ENISA's record lists CPython up to 3.16.0, no fixed release numbers are published in the sources read, and the CPython pull request is labelled "needs backport" to 3.11 to 3.14. A commenter on the CPython issue reports that on Windows Python still accepted AAA cross-signed eMudhra chains because Windows still trusts the COMODO AAA root and Python does not read the Disallowed store (single-commenter claim, unverified).
      (3) Cisco PSIRT's informational advisory (v1.0 2026-10-23, v1.1 2026-10-24) lists vulnerable products with remediation: Secure Firewall Management Center (TLS policy to block known eMudhra issuers via a TechZone article), ThousandEyes Application-hosting Agent 5.2.2 (2026-10-23), Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1, IOS XR 26.4.1 (planned 2026-11-30), Meraki MV firmware (2026-11-18) and Ultra Cloud Core SMI (Nov 2026); Identity Services Engine, Secure Firewall ASA and Threat Defense, Secure Web Appliance, Secure Network Analytics, UCS Director, Jabber and RoomOS endpoints are still listed under investigation, and Cisco PSIRT is not aware of malicious use.
      (4) eMudhra's board decided on 2026-10-22 to withdraw from the global SSL/TLS business; its G1 RSA roots keep serving customers during the transition, revocation services stay up until every issued certificate has expired or been replaced, and The Hacker News reports about 30,800 unexpired certificates chain to the emSign ECC Root CA G3 that Chrome stops trusting on 2026-10-27, 99.9% issued through InCommon.
      No exploitation or forged certificate is reported by any source read.
