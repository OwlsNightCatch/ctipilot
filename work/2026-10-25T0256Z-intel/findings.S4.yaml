      (URL https://www.idcf.jp/news/topics/) and with url for its hrefs → primary: IDC Frontier sixth report, URL https://www.idcf.jp/news/topics/20261018001.
    summary: |
      IDC Frontier's sixth report (2026-10-18) says the "IDCF Cloud Backup" service, which it had suspended after the unauthorized access,
      is resumed because its safety check is complete. For customers still running virtual servers in East Japan Region 1 (radian and
      newton zones), East Japan Regions 2 and 3 and West Japan Region 1, whom it had asked to take their own backups as a precaution, the
      resumed service lets them retrieve backup data quickly and restore it to other cloud or on-premises environments. The snapshot
      function stays suspended for further safety verification. IDCF Cloud TypeS (formerly White Cloud ASPIRE) and IDCF Private Cloud are
      outside the event. The covered entry's latest record is the fifth report of 2026-10-14. The report names no intrusion route and no
      actor; the entry's earlier figures (495 customers, 194 with retrievable snapshots, 48 portal registrations queried) are unchanged.
