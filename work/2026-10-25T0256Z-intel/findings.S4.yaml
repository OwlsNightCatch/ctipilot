  - title: "ConnectWise Cloud Backup (SkyKick): the vendor's own incident timeline now runs from a full account and credential reset on 2026-10-19 to phased restoration from 2026-10-21; backup-restore access is expected early in the week of 2026-10-26 and partners must keep the apps disabled until instructed"
    sources:
      - { url: "https://status.connectwise.com/", publisher: "ConnectWise Product and Services Status (incident updates of 2026-10-20 to 2026-10-23)", date: "2026-10-23", role: "primary" }
      - { url: "https://status.retrac.com.au/", publisher: "Retrac (Australian MSP status page relaying ConnectWise)", date: "2026-10-22", role: "corroborating" }
    discovery_trace: >-
      first seen at: WebSearch ("ConnectWise Cloud Backup SkyKick \"October 23\" OR \"October 24\" OR \"October 25\" restored OR resumed OR update")
      → pivot: status page listed in the results, fetched with extract and re-fetched raw with url --direct, URL https://status.connectwise.com/
      → corroboration: Retrac MSP status page, URL https://status.retrac.com.au/. The ConnectWise Trust Center advisory page the entry cites
      (https://www.connectwise.com/company/trust/advisories) returned 403 on WebFetch, extract, url and the reader fallback.
    summary: |
      ConnectWise's own status log (the covered entry cites its advisory as of 2026-10-19 and, for 2026-10-21, from an archived copy,
      and records only that restoration began on 2026-10-21) adds this: on 2026-10-19 it completed a full reset of all accounts and credentials in the affected
      Cloud Backup environment; since mitigations began on 2026-10-17 05:00 UTC it says it has observed no successful threat
      activity in the environments it monitors, which it states does not establish whether individual partner or customer
      Microsoft 365 tenants were affected; it began restoring services in controlled phases on 2026-10-21 14:35 UTC; and its update of
      2026-10-23 01:11 UTC expects testing and security validation of the restored environment to finish by the end of that
      weekend, then backup-restore access for partners "early next week", then phased re-enrolment with step-by-step instructions.
      SaaS Security and Cloud Management, which are integrated with Cloud Backup, were suspended with it. ConnectWise repeats in
      every update that partners must keep the affected application connections disabled until it gives instructions for their
      service, that existing backup archives are encrypted, isolated and show no sign of compromise, and that individual
      Microsoft 365 tenants still need review for unauthorized changes or persistent access. It moved to once-daily updates from
      2026-10-23, so a later Trust Center update (a WebSearch summary mentioned one dated 2026-10-24 with a 2026-10-26 target for
      starting partner onboarding) could not be verified: the Trust Center is walled to every transport. The practical consequence for
      a tenant owner is that re-enabling is a vendor-gated step: the disabled application identities stay disabled, and the
      tenant-side review (credentials, role assignments, consents added since 2026-10-13) is not replaced by the vendor's reset.
    region_nexus: "global MSP supply chain; Swiss public-sector tenants are exposed only where a ConnectWise or SkyKick application is consented in their Microsoft 365 tenant or their MSP's; no Swiss victim is named"
    primary_sector_nexus: "indirect - supplier-borne Microsoft 365 exposure"
