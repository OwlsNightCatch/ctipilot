  - title: "AdFection: ABC and ANSTO are the first affected public bodies to comment - the ABC confirms Discover-Tech ads were shown on a small number of its devices and is wiping any still in service as a precaution, ANSTO reports no impact identified"
    sources:
      - { url: "https://www.abc.net.au/news/2026-10-23/abc-staff-targeted-adfection-cyber-attack/107300806", publisher: "ABC News (Cam Wilson)", date: "2026-10-23", role: "primary" }
      - { url: "https://www.abc.net.au/news/2026-10-19/nuclear-agency-targeted-in-cyber-attack-infecting-devices/107283804", publisher: "ABC News (Cam Wilson)", date: "2026-10-19", role: "primary" }
      - { url: "https://www.cyberdaily.au/security/14347-aunty-hack-abc-wipes-staff-devices-after-discovering-spyware-campaign", publisher: "Cyber Daily", date: "2026-10-23", role: "corroborating" }
    discovery_trace: >-
      first seen at: cyberdaily-au, URL https://www.cyberdaily.au/security (extract of the security listing) → pivot: Cyber Daily article, URL
      https://www.cyberdaily.au/security/14347-aunty-hack-abc-wipes-staff-devices-after-discovering-spyware-campaign
      → primary: ABC News, URL https://www.abc.net.au/news/2026-10-23/abc-staff-targeted-adfection-cyber-attack/107300806
      → pivot: ABC News of 2026-10-19 (ANSTO statement), URL https://www.abc.net.au/news/2026-10-19/nuclear-agency-targeted-in-cyber-attack-infecting-devices/107283804.
    summary: |
      Following Citizen Lab's 2026-10-15 AdFection report (zero-click Candiru spyware delivered through targeted ads from the ad-tech firm
      Discover-Tech), the Australian Broadcasting Corporation told its own reporter on 2026-10-23 that a review found ads from this
      network were shown on a small number of ABC devices, that it has found no evidence any staff member was identified or tracked and no
      signs of compromise on those devices, and that it is wiping any still in service as a precaution. ANSTO, the Australian nuclear
      science agency that Citizen Lab's impression data singles out as a hot spot, said on 2026-10-19 it had identified no impact; the
      Australian Signals Directorate declined to comment. The ABC reports that Citizen Lab's data places a cluster of impressions on
      Australian government and critical-infrastructure networks, that three Australian media organisations seemed targeted and that more
      than two dozen Australian organisations are in the cluster but unnamed. An impression is exposure, not infection; the infections the ABC piece cites as confirmed by
