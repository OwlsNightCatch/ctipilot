  - title: "PK Softech / Publica: the Federal Data Protection Commissioner (EDÖB) opened a formal investigation against PK Softech on 2026-10-22, after an informal preliminary inquiry at Publica on 2026-10-14"
    sources:
      - { url: "https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein", publisher: "EDÖB (Swiss Federal Data Protection and Information Commissioner), press release", date: "2026-10-23", role: "primary" }
      - { url: "https://www.derbund.ch/cyberangriff-auf-pk-softech-bund-eroeffnet-untersuchung-985784970943", publisher: "Der Bund / Tages-Anzeiger (Tamedia)", date: "2026-10-23", role: "corroborating" }
      - { url: "https://www.zentralplus.ch/news/softech-untersuchung-nach-cybervorfall-2906804/", publisher: "zentralplus (agency relay)", date: "2026-10-23", role: "corroborating" }
      - { url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", publisher: "Publica (status page, status as of 2026-10-22)", date: "2026-10-22", role: "supporting" }
    discovery_trace: >-
      first seen at: WebSearch ("Publica Datenleck PK Softech Parlament GPK Untersuchung EDÖB Keller-Sutter Finanzdepartement")
      → pivot: Der Bund / Tages-Anzeiger, URL https://www.derbund.ch/cyberangriff-auf-pk-softech-bund-eroeffnet-untersuchung-985784970943
      (body links the EDÖB release) → pivot: zentralplus, URL https://www.zentralplus.ch/news/softech-untersuchung-nach-cybervorfall-2906804/
      → primary: EDÖB press release, URL https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein
      (fetched with extract; the EDÖB press listing page returns a stale 2026-09-16 cache, so the release was reachable only through the press relays).
    summary: |
      The EDÖB says PK Softech notified it of the cyberattack on its IT infrastructure and possible data-security violations on
      2026-10-08, that the affected pension funds also reported to it, that it opened an informal preliminary inquiry at Publica on
      2026-10-14 and that on 2026-10-22 it opened a formal investigation against PK Softech AG on suspicion of data-protection
      violations. It names two aims: to obtain an overall picture of the personal data the pension funds handed to the software
      supplier, and to clarify the legal framework of those data transfers, how they were actually implemented, and the scope of
      the data that left. It gives no further information on pending proceedings. This is the first regulator action in the case
      and puts the supplier-side practice (which production personal data reached a vendor, and on what legal basis) under formal
      review; the covered entry's earlier record that Publica's 2019 migration data stayed on the supplier's servers despite a
      written deletion pledge, and the PKZH statement that its data were test data for a 2027 migration, are the facts that
      investigation will test. The release does not name the actor, the ransom demand or the number of insured persons; Tamedia
      and Inside IT carry the Akira attribution (the Federal Prosecutor's Office reportedly confirmed it), which neither the EDÖB
      nor Publica states.
    region_nexus: "Switzerland - federal administration (Publica insures current and former federal staff), cantonal and municipal pension funds (BPK, BLVK, PKZH, IPCT)"
