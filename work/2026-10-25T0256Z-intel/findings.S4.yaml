  - title: "Refrigeration-controller attacks (Danfoss, Copeland, Dixell): Forescout counts 12,976 exposed service observations on 6,017 IPs in 99 countries, 80% of the exposed Danfoss AK-SM 800A units run firmware before 4.3.1, and 20+ hacktivist refrigeration attacks were claimed since January 2026; BSI's 2026-10-13 warning was not yet in the entry"
    sources:
      - { url: "https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/", publisher: "Forescout Research (Vedere Labs)", date: "2026-10-22", role: "primary" }
      - { url: "https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261013_OT-Gefaehrdung-Kleinanlagen.html", publisher: "BSI (German Federal Office for Information Security), press release", date: "2026-10-13", role: "corroborating" }
      - { url: "https://industrialcyber.co/industrial-cyber-attacks/forescout-warns-internet-exposed-refrigeration-controls-could-enable-attacks-on-food-supply-chains-and-hospitals", publisher: "Industrial Cyber", date: "2026-10-23", role: "supporting" }
    discovery_trace: >-
      first seen at: WebSearch ("Danfoss AK-SM800A attack supermarket refrigeration new details investigation Copeland XWEB patch released")
      → pivot: Industrial Cyber, URL https://industrialcyber.co/industrial-cyber-attacks/forescout-warns-internet-exposed-refrigeration-controls-could-enable-attacks-on-food-supply-chains-and-hospitals
      → primary: Forescout Vedere Labs blog, URL https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/.
      BSI branch: WebSearch ("Kühlanlagen Steuerungen Danfoss Copeland Schweiz exponiert BACS Warnung ...") → pivot: drweb.de
      (https://www.drweb.de/bsi-warnt-betreiber-kleiner-kuehlanlagen-vor-nachahmern-des/) → WebSearch restricted to bsi.bund.de to re-find the
      owner's release → primary: BSI press release, URL https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261013_OT-Gefaehrdung-Kleinanlagen.html.
    summary: |
      Forescout's Vedere Labs, querying Shodan, counts 12,976 internet-exposed service observations across ten refrigeration-supervisor
      product groups on 6,017 distinct public IPs in 99 countries: 7,075 Copeland/Dixell XWEB, 4,697 Danfoss StoreView, 551 Copeland
      Site Supervisor, 513 Carel pCOWeb and 140 others. For the Danfoss AK-SM 800A it sees 3,762 StoreView observations (80% of that
      product's total) on firmware older than 4.3.1, which Forescout ties to CVE-2025-41451 and CVE-2025-41452 (CVE-2025-41450 affects
      builds before 4.2); the AK-SM 800 is end of life since May 2021 and cannot be patched. Only 287 of 513 pCOWeb services answered with
      HTTP 401. Forescout also reports that since January 2026 it tracked over 20 claimed hacktivist attacks on refrigeration systems,
      mostly by the pro-Russian groups Z-Pentest Alliance and NoName057(16), with target types such as fruit stores, wineries and
      supermarkets in Spain and Italy and the method being changed temperature and defrost settings through internet-exposed HMIs;
      it cites a Danfoss technical bulletin of October 2025 on 2022 hacktivist attacks on 16 Russian and 40 Israeli supermarkets where
      the Israeli sites lacked a firewall or VPN. Forescout states plainly that the access method, exploited vulnerabilities,
      infrastructure, persistence and actors of the French incidents "remain unconfirmed", so the version breakdown is exposure data and not
      an attributed root cause. It widens the at-risk set to cooling equipment in hospitals and agricultural sites and notes that
      manufacturer manuals describe port-forwarded WAN access as a supported deployment, which is why exposure is common. BSI's
      release of 2026-10-13 (absent from the entry) names operators of small installations such as food cooling, tells them first to block
      direct internet access to control systems, then to use a VPN with multi-factor access and to patch, and says the attack "kann
      auch jetzt jederzeit Nachahmer finden"; no German case was public. Neither source has a Swiss count.
    region_nexus: "Europe-wide exposure; France the incident country; Switzerland covered by NCSC.ch's 'actively exploited' rating in the entry; no Swiss exposure count in either source"
    primary_sector_nexus: "indirect - building and cold-chain control systems, including hospitals (cantonal and municipal facilities use such supervisors)"
