    discovery_trace: "first seen at: reliaquest, URL https://reliaquest.com/sitemap.xml (blog sitemap filtered to /blog/, lastmod 2026-10-23T20:17Z on the PHP2Shell spotlight) → primary: https://reliaquest.com/blog/threat-spotlight-php2shell-responding-to-critical-php-vulnerabilities/ (extract; the 2026-10-22 lab update sits at the top of the post). Second thread: offseq, URL https://offseq.com/en/research/rss.xml (item 2026-10-22) → primary: https://offseq.com/en/research/php2shell-first-48-hours/ (extract). Third: asec.ahnlab.com listing via WebFetch https://asec.ahnlab.com/en/ → https://asec.ahnlab.com/en/95956/ (extract served via the jina reader)."
    summary: |
      Delta for the existing PHP2Shell entry, which carries a generic Detection line (worker crashes, fatal errors, multipart POSTs from unfamiliar sources, post-exploitation process telemetry) but no concrete sequence. ReliaQuest says it independently reproduced exploitation of CVE-2026-109618 in separate controlled labs (code execution only where the exploit prerequisites were already present, not a universal chain; it has not seen successful exploitation in customer environments) and reports the artifact sequence across PHP error, Apache access, Apache error and system logs: a POST returns HTTP 500, PHP logs memory exhaustion that ends 'in Unknown on line 0' (failure inside PHP before an application file is identified) followed by heap corruption, and the Apache worker handling the request exits on an abort signal within seconds. Each event can be benign alone; the full sequence on the same process is the strong indicator, and linking request to crash needs the worker PID in both the access and error logs, which ReliaQuest found was often not collected. OffSeq's honeypot fleet (20-22 Oct) recorded the attacker-side request shapes: multipart POSTs combining the session upload-progress trigger field with deeply nested array-style field names, a chunked transfer with no usable Content-Length, bursts from one source whose body sizes climb step by step (the exploit searching for the per-target memory threshold), and separate 1-2 MB single-field bodies consistent with the out-of-memory strategy; the earliest such body was seen about 16 hours before the 2026-10-21 patch. OffSeq's decoys are low-interaction, so this characterises tooling and sequence, not exploitation success. AhnLab ASEC reproduced the public PoC and shows a command shell running as the web account (www-data).
