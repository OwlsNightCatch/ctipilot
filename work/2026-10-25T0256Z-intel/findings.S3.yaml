    affected_products: ["Danfoss AK-SM 800", "Danfoss AK-SM 800A", "Danfoss AK-SC 355", "Copeland XWEB Pro", "Copeland/Dixell XWEB", "Copeland Site Supervisor", "CAREL pCOWeb"]
    entity_keys: ["incident:danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack-2026-10", "product:danfoss-ak-sm-800a", "product:copeland-xweb"]
