    extended_notes: |
      Suggested changelog record type: improvement (new detection content on an existing finding; no change in exploitation status or patch facts), fields: body (Detection line). The existing entry's status is unchanged: ReliaQuest and OffSeq both stop short of confirmed in-the-wild compromise, consistent with CrowdStrike/Sophos/Wordfence already cited.
      Triage: the ReliaQuest sequence is a lab artifact from one distribution layout (log paths are lab-specific); the discriminators it gives are the same-PID correlation of a 500 response and an abort-signal worker exit within seconds, the 'in Unknown on line 0' memory-error text (ordinary PHP memory errors name the application file and line), and the absence of that sequence is not proof of no exploitation when PHP/Apache logs or the worker PID are not collected. The OffSeq request-shape list is behaviour only; OffSeq also publishes a self-identifying multipart boundary string and source addresses, deliberately not carried here (IOCs).
      ReliaQuest also reports it used a commercial AI model with public reporting to reproduce the memory-corruption behaviour in a lab with prerequisites present, and explicitly says this shows acceleration, not universal weaponisation.

