    discovery_trace: "first seen at: sans-newsbites, URL https://www.sans.org/newsletters/newsbites/xxviii-79 (Internet Storm Center StormCast 2026-10-23 headline 'Linux Kernel KSMBD Vulnerability Reports Leaked') → WebSearch ('ZDI accidentally posted unpatched Linux kernel ksmbd vulnerability reports public mailing list', nothing on point) → and independently the Sysdig item in the research-feed sweep, URL https://www.sysdig.com/blog/rss.xml (feed item dated 2026-10-24, link host webflow.sysdig.com) → primary: https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws (extract; the webflow.sysdig.com copy read identically) → pivots cited in it: https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/, https://pwn.watch/i/linux-kernel-zdi-reports-leaked-to-lkml, https://thehackernews.com/2026/10/two-cvss-90-linux-ksmbd-rce-flaws.html, https://www.phoronix.com/news/LKML-New-Trend-Vulnerabilities; the LKML/netdev postings themselves (lore.kernel.org) answered with an Anubis proof-of-work challenge and could not be read."
    summary: |
      On 2026-10-20/21 Trend Micro's Zero Day Initiative sent one ConnMan report and five Linux kernel reports to the kernel security team while copying public lists (LKML, netdev, linux-cifs, dri-devel, linux-nvme), without patches; Greg Kroah-Hartman replied that they were now public and unpatched. Sysdig's Threat Research Team (2026-10-24) ranks the batch by what defenders should do now. ZDI-CAN-33367 is the one that matters: skb_zerocopy() moves shared page-cache fragments into a new socket buffer without carrying the shared-fragment marker the Dirty Frag fix introduced, so ESP decrypts in place and an unprivileged local user can write attacker bytes into the cached copy of a file it can only read, which gives root without opening the file for writing; a public exploit exists, TuxCare reproduced a root shell on AlmaLinux 8-10 (including with the Dirty Frag fix installed), CloudLinux 9-10, Debian 12 and 13 and Ubuntu 24.04 and 26.04 (Ubuntu's AppArmor user-namespace restriction was bypassed through a container-launcher profile), and a small patch is on netdev, reviewed but not merged. The exploit needs unprivileged user namespaces and a set of networking modules (nlmon, nft_queue, nfnetlink_queue, cls_u32, act_pedit, act_mirred, esp4). The two ksmbd reports (ZDI-scored CVSS 9.0) matter only where the in-kernel SMB server ksmbd, not Samba, runs: ZDI-CAN-33774 is a pre-authentication SMB1/SMB2 dispatch race whose public proof of concept leaks 28 bytes of kernel heap per attempt and can crash the kernel (the maintainer says a fix commit is queued in ksmbd-for-next, not in a release), and ZDI-CAN-33549 is an SMB Direct integer underflow needing an RDMA-capable interface and a writable share, whose proof of concept crashes the kernel. ZDI-CAN-34068 (vmwgfx, VMware guests, local privilege escalation) and ZDI-CAN-34076 (nvmet information leak) have only titles public and no patch. None of the six has a CVE and no in-the-wild exploitation is reported as of 2026-10-23/24.
    region_nexus: "global; Linux server, VDI and container estates; Swiss public-sector Linux hosts where unprivileged user namespaces are enabled (shared hosting, CI runners, Kubernetes) or ksmbd is used"
    primary_sector_nexus: "indirect (no sector targeting; relevant to public-sector Linux fleets)"
