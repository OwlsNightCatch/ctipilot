  - title: "Forescout adds hacktivist and exposure context to the French refrigeration-control attacks: over 20 claimed attacks on refrigeration HMIs since January 2026, internet-facing supervisory platforms by design, and no confirmed access vector in France"
    sources:
      - { url: "https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/", publisher: "Forescout Research, Vedere Labs", date: "2026-10-22", role: "primary" }
    discovery_trace: "first seen at: forescout-research, URL https://www.forescout.com/blog/ (extract and raw url listing; the listing is undated, hrefs read from the raw HTML) → primary: https://www.forescout.com/blog/cold-chain-open-control-exposed-refrigeration-systems-reveal-global-risk/ (extract, date 2026-10-22)."
    summary: |
      Forescout's Vedere Labs analysis of the October 2026 attacks on refrigeration supervisory systems in France (CERT-FR confirmed Danfoss AK-SM and AK-SC and Copeland/Dixell XWEB compromises) adds three points to the existing entry. It states the access vector, exploited vulnerabilities, attacker infrastructure, persistence and responsible actors in the French incidents remain unconfirmed, and that the reported manipulation (rapid successive configuration changes suggestive of automation) used ordinary supervisory functions. Its own tracking of hacktivist groups found over 20 claimed attacks on refrigeration systems since January 2026, mostly by the pro-Russian Z-Pentest Alliance and NoName057(16), mainly changing temperature and defrost settings through internet-exposed HMIs at fruit stores, wineries, supermarkets and food processors in Spain, Italy and elsewhere in Europe, with Danfoss's own 2025 bulletin describing 2022 hacktivist attacks on the same device class where the Israeli installations lacked firewall or VPN protection. And from Shodan data it finds the two attack paths still open (weak or missing authentication, and known vulnerabilities, including end-of-life Danfoss AK-SM 800 units that cannot be patched), noting that manufacturer documentation describes internet-based remote maintenance via port forwarding as a supported option, and that 80 % of the exposed Danfoss AK-SM 800A StoreView observations run firmware older than 4.3.1, which is affected by CVE-2025-41451 and CVE-2025-41452.
    region_nexus: "global; France (incident), Spain, Italy and other European states (hacktivist claims); Switzerland not named"
