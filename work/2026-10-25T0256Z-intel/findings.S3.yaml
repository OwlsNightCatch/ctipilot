      - { key: "tool:ldap-switcheroo", type: tool, name: "LDAP Switcheroo (switcheroo)", aliases: ["switcheroo", "The LDAP Switcheroo"], summary: "SpecterOps proof-of-concept wrapper around Impacket ntlmrelayx that relays a coerced SMB client's NTLM authentication into an LDAP operation executed with the victim's permissions on a domain controller requiring LDAP signing (SpecterOps, 2026-10-23)." }
    relation_suggestions:
      - { subject: "tool:ldap-switcheroo", object: "trend:ntlm-relay-signing-bypass-reauthentication-2026-10", basis: "SpecterOps releases it as the proof of concept for its LDAP signing bypass (SpecterOps, 2026-10-23)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    evidence:
      - quote: "Microsoft fixed SMB quietly in September 2026 and LDAP in October 2026. Every Windows Server from 2016 to 2025 was vulnerable to NTLM relay attacks, even with signing enforced in both protocols."
        attribution: "SpecterOps (Raj Patel)"
        source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"
      - quote: "The domain controller we tested against had both LDAP signing and channel binding enforced, and the attack still worked over 389/TCP."
        attribution: "SpecterOps (Raj Patel)"
        source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"
      - quote: "We reported this vulnerability to Microsoft on October 6, 2026 but we never received a response to that MSRC report."
        attribution: "SpecterOps (Raj Patel)"
        source_url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/"
      - quote: "On any host that requires SMB signing, Domain Controllers included, a relayed privileged authentication yields a privileged session that is still signed with the low-privilege key."
        attribution: "Blackfield (Lyderic Lefebvre)"
        source_url: "https://blackfield.ch/blog/defeating-enforced-smb-signing/"
      - quote: "I could not find a CVE for this specific change, in Microsoft’s update guide, the KB notes, or public trackers; it reads as silent hardening rather than a tracked fix."
        attribution: "Blackfield (Lyderic Lefebvre)"
        source_url: "https://blackfield.ch/blog/defeating-enforced-smb-signing/"
    extended_notes: |
      Suggested classification B2 (two independent researcher write-ups plus public PoCs; Microsoft has published no advisory, CVE or release-note line, so patch status rests on the researchers' build testing). Suggested priority: notable to high as a hardening and AD-exposure item (no exploitation reported); not an immediate-action item.
      Exposure (stated by sources): Windows Server 2016 through 2025 domain controllers accepted the relay before the cumulative updates (SpecterOps tested 2016 DCs and above; the FAQ says every 2022 and 2025 DC it tested accepted it); SMB servers requiring signing are affected by the SMB variant. Preconditions: a coercion primitive toward an SMB client (the demo uses PetitPotam-class coercion; the victim must authenticate over SMB, WebDAV/HTTP victims do not work for the LDAP case), a signed LDAP session of the attacker (valid account, or anonymous NTLM SASL where the DC accepts it), and 389/TCP reachable (LDAPS-only breaks the LDAP variant). Patch-state caveat the composer must not flatten: KB5126646 is the Windows Server 2025 October 2026 cumulative update and KB5122882 the Windows Server 2022 September 2026 one (both fetched); SpecterOps' advice to install them 'on every domain controller / server' must be read as the equivalent cumulative update for each OS build. Blackfield's patch check reports the SMB same-user re-authentication change as a 'feature flag' in September 2026 builds; Blackfield says it did not trace every build.
      Hardening named by the sources: patch domain controllers first; enforce LDAP signing and channel binding together; restrict LDAP on 389/TCP so only LDAPS remains; reduce NTLM; SMB signing stays necessary but is not sufficient (Blackfield: the clean fix is requiring the same identity on re-authentication).
      Detection: neither source gives detection guidance. Hooks that follow mechanically from the stated attack (inference, not a source claim): directory-service change auditing (Windows event 5136) on computer objects for msDS-AllowedToActOnBehalfOfOtherIdentity and msDS-KeyCredentialLink, where the writing principal is a machine account that has just authenticated by NTLM over the network from an unexpected source; and coercion RPC activity toward servers and DCs. Post-patch compromise check (inference): patching does not remove delegation or key-credential values already written, so review those two attributes across computer accounts for unexplained entries.
      Triage lookalike: machine accounts legitimately write some of their own attributes (device registration, WHfB key trust), so the discriminator is value provenance and the NTLM-from-unexpected-host sequence, not the attribute write alone (inference, not source-stated). Treat as unconfirmed until the entry's author weighs it.

