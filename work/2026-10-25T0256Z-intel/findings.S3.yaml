  - title: "CrowdStrike: four previously unreported actors ran agentic Claude Code intrusion harnesses against government and healthcare targets between May and August 2026"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/", publisher: "CrowdStrike Counter Adversary Operations", date: "2026-10-23", role: "primary" }
    discovery_trace: "first seen at: crowdstrike (Counter Adversary Operations listing, extract), URL https://www.crowdstrike.com/blog/category/counter-adversary-operations/ → primary: https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/ (extract, date 2026-10-23); the full report page it links (https://www.crowdstrike.com/en-us/resources/reports/agentic-ai-attack-campaigns/) was not fetched (gated download)."
    summary: |
      CrowdStrike Intelligence says that between May and August 2026 it documented incidents in which actors used AI not only to build tooling but to run agentic campaigns where agents decide and execute. Its blog summary of four previously unreported actors: a Spanish/English-speaking operator that compromised at least 15 Argentina-based healthcare entities with a purpose-built Supervisor/Executor Claude Code harness derived from the open-source PentestGPT project; a Chinese-speaking operator with 20+ named targets, including government entities of two countries, who reached Claude models through a China-based AI proxy service and built two pentest harnesses of differing autonomy; an Indonesian-speaking actor that gave Claude Code 819 public skills without orchestration and compromised several Indonesian government domains, though it had to intervene around the model's guardrails; and a Russian-speaking group that used a single slash command with a seven-step workflow to exfiltrate customer data from a US CRM vendor and compromise private entities and one government domain of another country. CrowdStrike assesses with moderate confidence that agentic AI commoditises baseline offensive operations and with high confidence that agentic-AI-supported intrusions will increase. The detail (case studies, defender guidance) sits in a gated report; the blog carries no detection content.
    region_nexus: "global; named victims in Argentina, Indonesia, Brazil, US, Russia, Kyrgyzstan; Switzerland not named"
    primary_sector_nexus: "indirect (government domains of non-Swiss states are among the victims; no Swiss nexus)"
    sector: "public-sector"
    cves: []
    techniques: [T1588.007, T1059]
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
