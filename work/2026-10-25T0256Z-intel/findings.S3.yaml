  - title: "NTLM relay past required signing: SpecterOps (LDAP) and Blackfield (SMB) show signing bypassed by re-authenticating a connection the attacker already signs, fixed silently in Windows updates of September and October 2026"
    sources:
      - { url: "https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/", publisher: "SpecterOps (Raj Patel)", date: "2026-10-23", role: "primary" }
      - { url: "https://blackfield.ch/blog/defeating-enforced-smb-signing/", publisher: "Blackfield (Lyderic Lefebvre)", date: "2026-10-21", role: "primary" }
      - { url: "https://support.microsoft.com/en-us/servicing/os/windows-server/2026/10/kb5126646-windows-server-2025-security-update", publisher: "Microsoft Support (KB5126646 release notes, Windows Server 2025)", date: "2026-10-13", role: "corroborating" }
      - { url: "https://github.com/grayhatkiller/switcheroo", publisher: "grayhatkiller/switcheroo (SpecterOps PoC repository)", date: "2026-10-23", role: "corroborating" }
    discovery_trace: "first seen at: specterops, URL https://specterops.io/feed/ (feed listing, item 2026-10-23T16:08Z) → primary: https://specterops.io/blog/2026/10/23/ldap-signing-bypass-ntlm-relay/ (extract) → pivot (the post's own reference to the independent SMB finding): https://blackfield.ch/blog/defeating-enforced-smb-signing/ (extract; its feed https://blackfield.ch/feed.xml also parsed) → pivot: Microsoft KB release notes https://support.microsoft.com/en-us/servicing/os/windows-server/2026/10/kb5126646-windows-server-2025-security-update (the KB SpecterOps names; read for a fix line) → PoC repository https://github.com/grayhatkiller/switcheroo; a WebSearch for a Microsoft CVE/KB statement ('LDAP signing bypass ... KB5126646') returned nothing on point."
    summary: |
      SpecterOps (Raj Patel, 2026-10-23) shows that required LDAP signing on a domain controller can be bypassed by NTLM relay: the attacker first opens a signed LDAP session with valid domain credentials or, where the DC accepts it, an anonymous NTLM SASL context, and keeps that session key; coerces a victim over SMB; and sends the victim's relayed NTLM AUTHENTICATE bind and a malicious LDAP ModifyRequest together in one SASL record signed with the attacker's own key. The DC checks the signature once, against the attacker's key, then switches the connection to the victim's identity and executes the modification with the victim's rights (the demonstration writes the resource-based constrained delegation attribute msDS-AllowedToActOnBehalfOfOtherIdentity; the post names msDS-KeyCredentialLink, shadow credentials, as the other primitive, and says the path continues to DCSync and domain or forest compromise when a domain controller's machine account is relayed to another DC). The tested DC enforced both LDAP signing and channel binding and the attack still worked over 389/TCP; LDAPS on 636/TCP is not reachable by this variant. Independently, Blackfield (2026-10-21) shows the same idea against SMB: re-authenticating an existing signed session with a relayed privileged identity keeps the low-privilege signing key, so a host that requires SMB signing, domain controllers included, accepts the privileged session, because the server does not check that the re-authenticating identity matches the original. SpecterOps says Microsoft fixed the SMB variant quietly in September 2026 and the LDAP one in the 2026-10-13 cumulative update (it reported the flaw on 2026-10-06 and never received an MSRC response); Blackfield found no CVE in the update guide, the KB notes or public trackers and calls it silent hardening, adding that one or two end-of-life Windows versions may never get the change. Both researchers publish tooling (SpecterOps an ntlmrelayx wrapper for the LDAP case; Blackfield a krbrelayx fork and a NetExec module that tests whether a host still allows the swap); neither reports in-the-wild use. Microsoft's own release notes for the Windows Server 2025 KB (KB5126646) and the Windows Server 2022 KB (KB5122882) that SpecterOps names contain no LDAP or SMB signing line, consistent with a silent fix; those KB numbers are per operating system, not a single fix for every server.
    region_nexus: "global; on-premises Active Directory estates (domain controllers, Windows file servers) of the Swiss federal, cantonal and communal administrations"
    primary_sector_nexus: "direct (technology class: Windows Server 2016-2025 domain controllers and SMB servers are the default identity and file backbone of public administrations); no sector targeting reported"
    sector: "public-sector"
    cves: []
    techniques: [T1557, T1557.001, T1187, T1098, T1003.006]
    affected_products: ["Microsoft Windows Server"]
    entity_keys: ["product:microsoft-windows-server"]
