    extended_notes: |
      Overlaps S1's remit (exploit-class, public PoC, no patch, no CVE); returned here because Sysdig's 2026-10-24 analysis is the in-window primary. Suggested classification B2 (Sysdig original analysis; TuxCare independently reproduced the root exploit; ksmbd RCE claims are ZDI's scores, not demonstrated). Suggested priority: high for Linux fleets that allow unprivileged user namespaces on multi-tenant or build hosts; notable elsewhere. ZDI-scored CVSS are ZDI's own (33367: 7.8, 33774 and 33549: 9.0, 34068: 8.8, 34076: 8.6 per TuxCare/The Hacker News), not NVD.
      Exposure: ZDI-CAN-33367 needs local code execution first (shared hosting, CI runners, container workloads, login nodes count) plus unprivileged user namespaces; TuxCare says EL6/EL7 kernels are not vulnerable and CloudLinux 8 and Ubuntu 22.04 were not yet tested. ksmbd: check for the ksmbd kernel module, the ksmbd.mountd daemon and a kernel-owned listener on TCP 445 (Sysdig); The Hacker News gives 'systemctl status ksmbd' / 'lsmod | grep ksmbd' and says RHEL does not include ksmbd by default; TuxCare says AlmaLinux and CloudLinux 9-10 kernels do not build it. vmwgfx matters only on VMware guests (vSphere, Workstation, VMware VDI); Sysdig could not reproduce it on Lima or EC2.
      Detection (Sysdig): the 33367 exploit is one unprivileged process doing, in order: unshare into new user and network namespaces and write sysctls, bring up an nlmon interface, install XFRM state over netlink, add an nftables NFQUEUE rule, attach a tc pedit action with a redirect, then splice() into a socket on the loopback address; syscall-level runtime telemetry sees it in motion. The ksmbd bugs run inside kernel worker threads with no attacker process on the host, so only exposure control and post-exploitation telemetry apply. Post-compromise (inference from Sysdig's description that the write lands in the page cache of a read-only file): on-disk content of the targeted setuid binary or /etc/passwd may not show the change, so file-integrity checks of disk contents are not proof of absence.
      Hardening (stated): patch the day the distribution ships the skb_zerocopy() fix (a kernel with only the CVE-2026-90049 fix is not covered); restrict unprivileged user namespaces with user.max_user_namespaces=0 (kernel.unprivileged_userns_clone=0 on Debian), TuxCare has not validated it against the PoC and it breaks rootless containers, some browser sandboxes and build tooling; do not rely on Ubuntu's AppArmor user-namespace restriction (bypassed); block nlmon and act_pedit where possible (may not close every path); enforce seccomp RuntimeDefault on Kubernetes pods (Docker's default profile blocks unshare(CLONE_NEWUSER), pods run Unconfined unless set); ksmbd: unload and block the module where unused, restrict TCP 445, disable SMB Direct unless RDMA storage needs it; vmwgfx: disable 3D acceleration or block the module on guests that do not need it. Vendor mitigations seen only in secondary sources (pwn.watch): AlmaLinux testing-repo kernels with the backported fix and blocking esp4/esp6 stopping the public exploit; KernelCare livepatch for EL10 (TuxCare).
      Source disagreements to surface: pwn.watch says the ksmbd race needs a guest share while Sysdig and TuxCare say the public PoC works pre-authentication (ZDI's write-past-buffer path needs share access); ZDI's formal advisories are scheduled for 2027-02-18 per TuxCare (ZDI upcoming list). The finder credit is stated differently across sources (The Hacker News says the ZDI reports credit TrendAI, Trend Micro's AI scanner, as the finder and names a researcher for 33367); not needed for the entry.

