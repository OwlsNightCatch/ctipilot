  - where: headline / summary / body sentence 1
    claim: document-based exploits resurge ... marked resurgence in document-based exploit delivery, with Microsoft Office and PDF readers accounting
      for the largest share of initial-access exploit deployments
    defect: Not in the report. It says exploit kits expanded with new Office, Windows and Linux exploits, but for Linux 'we observed a decrease
      in the number of detected exploits'; veteran Equation Editor / Office / WinRAR-type CVEs hold the largest detection share; PDF readers are
      not mentioned.
    ground_truth: In the first quarter of 2026, we observed a decrease in the number of detected exploits; however, the detection rates are on
      the rise relative to the same period last year.
