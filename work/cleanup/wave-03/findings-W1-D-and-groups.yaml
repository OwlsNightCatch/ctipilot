      appear in no source.
    ground_truth: '''Disable Authentication Override: Uncheck the Authentication Override options (for generating and accepting cookies) in the
      GlobalProtect portal and gateway configuration.'' Portal path: Network > GlobalProtect > Portals > Agent > Authentication; Gateway: Network
      > GlobalProtect > Gateways > Agent > Client Settings > Authentication Override.'
    ground_truth_url: https://security.paloaltonetworks.com/json/CVE-2026-0257
