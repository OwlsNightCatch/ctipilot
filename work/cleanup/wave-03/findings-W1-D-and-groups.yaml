      or GlobalProtect; AA24-075A does not resolve (404). They are not Palo Alto advisories, and 'most directly exploitable' has no source.
    ground_truth: 'CISA AA23-250A: ''Multiple Nation-State Threat Actors Exploit CVE-2022-47966 and CVE-2022-42475'' (2023-09-07); neither Palo
      Alto Networks nor GlobalProtect appears on the page. https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-075a returns HTTP 404.'
    ground_truth_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-250a
    fix: Delete the sentence.
