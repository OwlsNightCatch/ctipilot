  - where: body, 'Vulnerability mechanics' and 'Hardening / mitigation'
    claim: issue signed cookies ... uses that same certificate to sign and encrypt session tokens ... (b) generate a dedicated certificate for
      GlobalProtect used exclusively for that service and not shared with the HTTPS management or any other feature
    defect: The cookie is RSA-encrypted with the certificate and decrypted with no signature check (that is the flaw); the cookie certificate
