    fix PR #13505; workaround ''Avoid using InMemoryVectorStore for production scenarios''; exploitation needs a prompt-injection vector plus
    a Search Plugin backed by the In-Memory Vector Store in default configuration; mechanism per blog: default filter is a Python lambda executed
    with eval() with an unsanitised model-controlled parameter, AST blocklist bypassed (names __name__, load_module, system, BuiltinImporter not
    blocked) -> BuiltinImporter -> os.system. (2) CVE-2026-25592 = .NET SDK SessionsPythonPlugin arbitrary file write, CWE-22, CVSS 9.9 same vector,
    nuget Microsoft.SemanticKernel.Core/Plugins.Core vulnerable < 1.71.0 fixed 1.71.0 (GHSA structured data also lists pip semantic-kernel < 1.39.3
    first patched 1.39.3), GHSA-2ww3-72rp-wpp4 published 2026-02-06 (https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4); DownloadFileAsync
    was accidentally marked [KernelFunction] so the localFilePath passed to File.WriteAllBytes() on the host became model-controlled; chain: ExecuteCode
    creates a script in the Container Apps sandbox, DownloadFileAsync writes it to the Windows Startup folder, runs at next sign-in; separately
    upload_file() (Python and .NET) accepted any local path (host-file read into the sandbox); fix PR #13478 removed [KernelFunction] from DownloadFileAsync
    and added path validation (UploadFileAsync keeps the attribute with validation); workaround: Function Invocation Filter allow-listing localFilePath
    for DownloadFileAsync/UploadFileAsync. Exploitation/KEV: neither CVE is in CISA KEV (catalog 2026.10.16, https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json);
