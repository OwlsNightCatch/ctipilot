    class: imprecision
  - where: summary
    claim: QUIC RAT delivered via signed, legitimate-looking Lite installer since 8 April 2026 ... (Kaspersky Securelist, 2026-05-05 updated 2026-05-08)
    defect: The trojanized installers have circulated since 8 April; QUIC RAT was delivered once. Kaspersky's blog (2026-05-05) carries an update
      note dated 'March 6' (a typo) about the vendor fix; no 2026-05-08 update is visible. The entry cites Kaspersky's blog while calling it Securelist;
      the technical write-up is the separate Securelist post.
    ground_truth: Securelist 'Popular DAEMON Tools software compromised' (Igor Kuznetsov et al.) and Kaspersky blog 'Supply chain attack via DAEMON
      Tools' dated 2026-05-05.
    ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
    fix: Cite the Securelist article as primary and the blog/HNS/The Record as corroboration; fix dates.
    class: imprecision
- entry_as_read: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  current_entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  folded: false
  truth_pass: 2026-10-18T1307Z-audit/truth-L
  verdict: factual-error
  defects:
  - where: summary, body sentence 1, 2026-05-10 section paragraph 3 (times)
    claim: On 2026-05-05 at 21:43 UTC ... roughly 3.5 hours; DENIC restored service by 01:15 UTC on 2026-05-06; The outage ran 2026-05-05 21:43
      UTC → 2026-05-06 ~01:15 UTC (~3.5 h)
    defect: 'The times are local German time, not UTC. heise: ''Am 5. Mai um 21:43'' (CEST); DENIC: incident ''from 21:57 onwards'', correct zone
      distributed 00:08, fully restored 01:15 (CEST); Cloudflare measured the start at roughly 19:30 UTC (SERVFAIL spike) and its mitigation ended
      impact at 22:17 UTC. DENIC states the restriction lasted ''approximately three hours''. The cited DENIC post-incident page is dated 2026-05-06,
      not 2026-05-08 as the label says.'
    ground_truth: On May 5, 2026, at roughly 19:30 UTC, DENIC, the registry operator for the .de country-code top-level domain (TLD), started
      publishing incorrect DNSSEC signatures for the .de zone.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: State 'about 19:30-19:57 UTC (21:30-21:57 CEST) to 23:15 UTC (01:15 CEST), about 3 to 3.5 hours' and cite the dated sources; correct
      the post-incident report label to 2026-05-06.
    class: factual-error
  - where: body sentence 3
    claim: Cloudflare deployed a Negative Trust Anchor under RFC 7646 for its resolvers within ~90 minutes. Crucially, .ch was unaffected (heise
      online, 2026-05-08 · Cloudflare blog).
    defect: Cloudflare rolled its mitigation out at 22:17 UTC, about 2 h 47 min after the 19:30 UTC start, and used an existing override rule
      marking .de insecure, 'functionality equivalent to an NTA, though not formally defined in any RFC'. Neither cited page (nor any DENIC page)
      mentions .ch or Switzerland, so 'Crucially, .ch was unaffected' is unsupported.
    ground_truth: We rolled out our mitigation at 22:17 UTC, which marked the end of impact for 1.1.1.1.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: Say Cloudflare applied an NTA-equivalent override at 22:17 UTC; delete the .ch sentence (or source it, e.g. SWITCH/ NCSC-CH statement,
      if one exists).
    class: factual-error
  - where: body sentence 2 (root cause)
    claim: a software defect in DENIC's HSM integration code introduced during a March 2026 migration to Knot DNS generated three key pairs sharing
      keytag 33834
    defect: 'DENIC: the third generation of the signing system (standard Knot software plus in-house developments with HSMs) was put into operation
      in April 2026 (the entry''s own update says April); Knot was not newly migrated. The defect was in the in-house rollover agent, which generated
      one key pair per HSM instead of one pair loaded into all HSMs; the pairs carried identical identifiers including key tag 33834 (DENIC: ''not
      a classic key tag collision'').'
    ground_truth: In April 2026, the third generation of this system since the introduction of DNSSEC in 2011 was put into operation.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: 'Replace with: faulty rollover-agent code in DENIC''s in-house signing development (third generation, in service since April 2026) created
      a separate ZSK pair per HSM with identical key tag 33834; only one matching public key was published, so about a third of signatures validated.'
    class: factual-error
  - where: title, headline
    claim: 3.5 h disruption for German government and public-sector .de domains
    defect: 'No source singles out government or public-sector domains: every .de domain failed validation (invalid NSEC3 signatures also broke
      second-level domains without DNSSEC) for validating resolvers; non-validating resolvers were unaffected. ''approximately 18 million'' is
      not stated in any cited source.'
    ground_truth: Consequently, even second-level domains for which DNSSEC is not used at all could not be resolved. Non-validating resolvers,
      on the other hand, delivered the .de zone without issue.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: Retitle without the government/public-sector scope; say all .de domains behind validating resolvers; source or drop the 18 million figure.
    class: factual-error
  - where: 2026-05-10 section paragraph 3 and update record summary
    claim: the monitoring pipeline detected anomalous resolver behaviour but the alerting layer did not correctly forward the alerts — the SIEM-rule
      equivalent of a fire-but-don't-page failure; DENIC published its formal technical post-mortem on 2026-05-08
    defect: 'DENIC: three continuously running testing and validation tools applied to the zone detected the errors; the notifications were not
      processed correctly. They were not resolver-behaviour monitors. The 2026-05-08 ''Analyse'' is an interim analysis (it promises more technical
      details later, with an addendum on 2026-05-11); the formal Final Report is dated 2026-06-11.'
    ground_truth: These systems detected the errors as intended; however, the generated notifications were not processed correctly, meaning that
      no timely intervention took place.
    ground_truth_url: https://blog.denic.de/en/final-report-dns-outage-of-5-may-2026/
    fix: Describe the validation tools correctly; call the 05-08 text an interim analysis and add the Final Report (2026-06-11) with its measures
      (enhanced alerting, partial zone validation before deployment, ZSK rollovers suspended).
    class: imprecision
  - where: frontmatter
    claim: 'kind: threat; tags vulnerabilities; event_date 2026-05-08'
    defect: 'An operational registry incident with no attacker or vulnerability (DENIC: no signs of compromise); the incident date is 2026-05-05,
