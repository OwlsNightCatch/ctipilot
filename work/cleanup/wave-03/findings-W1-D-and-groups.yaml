      source-normalisation to defeat MAC-based network anomaly detection.'
    defect: Rapid7 and Unit 42 report no lateral movement or post-access behaviour; GP-CLIENT enumeration and RDP are invented. The MAC-evasion
      purpose is the entry's own speculation (the same MAC and a Windows 10 Pro client string are hard-coded in the public PoC per Unit 42). Forged
      cookies map to T1606.001 / T1550.004 rather than T1539 (theft); T1036.005 for a machine name is unsupported.
    ground_truth: 'Rapid7: ''we did not observe any indication of successful lateral movement from the devices''; Unit 42: ''No post-access behavior
      or lateral movement has been identified as of this time''; ''search ... matching the following hard-coded client configuration values from
      the PoC code''.'
    ground_truth_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
    fix: Map only T1190/T1133 and T1606.001 (forged auth-override cookie); delete T1021.001, T1046, T1036.005 and the evasion-intent sentence.
    class: factual-error
  - where: body, 'Vulnerability mechanics'
    claim: shares an X.509 certificate with another co-hosted service — most commonly the HTTPS management or captive-portal service ... a configuration
      that has historically been documented in Palo Alto's own deployment guides as a shortcut for certificate management
    defect: Rapid7 names the portal/gateway HTTPS service as the example; 'management or captive-portal service', 'most commonly' and the claim
      about Palo Alto deployment guides have no source; also the 'only pre-condition' sentence omits that authentication override cookies must
