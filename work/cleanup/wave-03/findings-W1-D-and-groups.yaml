    fix: Change to 2026-05-05 and cite the vendor post.
    class: imprecision
  - where: Defender takeaway (detection lines)
    claim: outbound QUIC (UDP 443) to non-sanctioned destinations. Sysmon EID 1 with parent-process image path filters for notepad.exe or conhost.exe
      spawning child processes will surface post-injection activity.
    defect: Derived, not sourced. QUIC is one of seven C2 protocols QUIC RAT supports, and the primary observable in every source is the trojanized
