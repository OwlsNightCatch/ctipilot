- entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
  truth_pass: 2026-10-18T1307Z-audit/truth-T4
  verdict: imprecision
  legacy_pending: true
  records_now:
  - at: '2026-09-05T05:10:00Z'
    run_id: 2026-09-05T0409Z-intel
    type: update
  - at: '2026-09-30T07:16:53Z'
    run_id: 2026-09-30T0639Z-audit
    type: correction
  defects:
  - where: summary; 2026-09-05 Update section; evidence[2]
    claim: Kubernetes-context proof-of-concept exploits are public, and Red Hat confirms RHEL kernels are affected
    defect: (low confidence) The only source for the Kubernetes proof-of-concept sentence uses "Dirty Frag" for all three CVEs together and does
      not say a Kubernetes PoC exists for CVE-2026-46300 itself; the entry attaches it to this CVE.
    ground_truth: 'Aikido (section ''Why does Dirty Frag matter for containers?'', where Dirty Frag = CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300):
      "Researchers have already published working proof-of-concept exploits for Kubernetes, and Ubuntu spells out the risk of a container escape."
      The Ubuntu link in that sentence is the CVE-2026-43284 page; no source describes a Fragnesia-specific Kubernetes PoC. The public Fragnesia
      PoC cited by Help Net Security overwrites /usr/bin/su.'
    ground_truth_url: https://www.aikido.dev/blog/dirty-frag
    fix: Attribute it as Aikido's statement about the Dirty Frag family, or say only that a public Fragnesia PoC exists (Help Net Security) and
      container reachability depends on seccomp, pod security and user-namespace settings.
    class: imprecision
- entry: 2026-05-16/gtig-unc6671-blackfile-vishing-aitm-rogue-mfa-programmatic-s
  truth_pass: 2026-10-18T1307Z-audit/truth-T4
  verdict: imprecision
  legacy_pending: true
  records_now:
  - at: '2026-09-30T06:54:43Z'
    run_id: 2026-09-30T0639Z-audit
    type: correction
  defects:
  - where: frontmatter techniques[]
    claim: 'techniques: [T1566, T1566.004, T1557, T1111, T1556, T1098.005, T1539, T1550.004, T1213.002, T1530]'
    defect: '(low confidence) T1556 (Modify Authentication Process) names no behavior GTIG describes: the actor registers a new MFA device (T1098.005)
      and relays MFA codes (T1111, T1557); nothing modifies an authentication mechanism or process.'
    ground_truth: 'GTIG: "the threat actor immediately navigates to the user''s security settings to register a new, attacker-controlled MFA device".
      ATT&CK v20 T1556: "Adversaries may modify authentication mechanisms and processes to access user credentials or enable otherwise unwarranted
      access to accounts" (LSASS, SAM, PAM, authorization plugins).'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/blackfile-vishing-extortion-operation/
    fix: Remove T1556; T1098.005 and T1111 already cover the described behavior.
    class: imprecision
