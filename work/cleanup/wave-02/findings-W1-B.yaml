- entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
  truth_pass: 2026-10-18T1307Z-audit/truth-T1
  verdict: imprecision
  legacy_pending: false
  records_now:
  - at: '2026-10-05T04:32:00Z'
    run_id: 2026-10-05T0404Z-intel
    type: improvement
  - at: '2026-10-09T03:52:00Z'
    run_id: 2026-10-09T0255Z-intel
    type: update
  - at: '2026-10-20T03:40:32Z'
    run_id: 2026-10-20T0256Z-intel
    type: update
  defects:
  - where: body **Detection:** second sentence
    claim: The Citrix pages list no signs of compromise to look for ([Citrix, 2026-10-03](https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/))
    defect: (medium-low confidence; the cited Citrix blog is unreadable from the container, 403 on every transport including WebFetch) Three secondary
      sources relaying Citrix guidance from 2026-10-05 say Citrix supplies an indicator-of-compromise script through NetScaler Console as the
      compromise check for this CVE, so the Detection line omits the vendor's own post-patch compromise check and its 'The Citrix pages list no
      signs of compromise to look for' sentence is at best incomplete. Citrix's bulletin CTX697174 itself is silent on it.
    ground_truth: 'The Register (2026-10-05), quoting watchTowr: "Citrix provides an indicator-of-compromise script that teams can run to check
      exposed appliances for signs of compromise, though a clean result is not definitive proof"; watchTowr FAQ: "Citrix provides an indicator
      of compromise script through NetScaler Console to check affected appliances for signs of compromise. Citrix notes that the latest script
      version can report a false positive about suspicious nobody processes even when it finds no compromise"; Help Net Security (2026-10-05)
      quotes the same line.'
    ground_truth_url: https://www.theregister.com/security/2026/10/05/citrix-netscaler-security-snafus-get-even-worse-amid-more-0-day-reports/5301232
    fix: Confirm against the Citrix blog with a reader that can reach community.citrix.com; then replace the sentence with the NetScaler Console
      indicator-of-compromise script (a clean result is not proof; its nobody-process false positive) as the vendor's compromise check, and add
      it to the Detection line.
    class: imprecision
- entry: 2026-10-07/ninja-forms-wpc-bundles-stored-xss-hidden-admin-campaign
  truth_pass: 2026-10-18T1307Z-audit/truth-T2
  verdict: imprecision
  legacy_pending: false
  records_now: []
  defects:
  - where: cves[CVE-2026-94504] / body
    claim: CVE-2026-94504 ... Ninja Forms up to and including 3.15.3 (cves[] lists only CVE-2026-94504; no second id)
    defect: The same Ninja Forms flaw is also published under a second id by another CNA (WPScan, CVE-2026-92438, CVSS 8.8 AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H,
      affected 3.15.3 fixed 3.15.4); the entry names only the Wordfence id, so a scanner or advisory keyed on the sibling id will not match it.
    ground_truth: 'Patchstack DB: ''This issue has also been published by another CVE Numbering Authority under CVE-2026-92438, which describes
      the same as this vulnerability (CVE-2026-94504).'' CVE record CVE-2026-92438 (WPScan): ''does not escape submitted form field values before
      outputting them on the submission edit screen ... unauthenticated users''.'
    ground_truth_url: https://patchstack.com/database/WordPress/Plugin/ninja-forms/vulnerability/wordpress-ninja-forms-contact-form-builder-with-calculators-quizzes-signatures-ai-form-builder-plugin-3-15-3-stored-cross-site-scripting-vulnerability
    fix: Add a one-clause qualifier (body or sourcing_note) that the same flaw also carries CVE-2026-92438 (WPScan CNA, CVSS 8.8), or add it to
      cves[] with a note that it is the same issue.
    class: imprecision
- entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
  truth_pass: 2026-10-18T1307Z-audit/truth-T2
  verdict: imprecision
  legacy_pending: false
  records_now:
  - at: '2026-10-11T13:53:27Z'
    run_id: 2026-10-11T1307Z-audit
    type: correction
  defects:
  - where: body, Exposure line
    claim: '**Exposure:** self-hosted GitLab where CI/CD variables are unmasked or unprotected or where removed secrets remain in git history'
    defect: (low confidence) The Exposure line, cited to CloudSEK, presents 'self-hosted' GitLab and 'unmasked or unprotected' variables as the
      exposed condition; CloudSEK states neither about the victims' GitLab instances (it only recommends masking and protecting variables as a
      mitigation and says 'a single compromised GitLab instance'). The 'removed secrets remain in git history' and multi-tenant-instance clauses
      are supported.
    ground_truth: 'CloudSEK: ''A single GitLab instance hosted CI/CD pipelines for two unrelated organisations.'' and mitigation 1 ''Mask and
      protect every variable, rotate tokens on a fixed cadence, and audit git history for committed secrets''. No statement that victim instances
      were self-hosted or that their variables were unmasked.'
    ground_truth_url: https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files
    fix: 'Reword to what the report supports: ''GitLab instances (hosted or self-managed) whose CI/CD variables and git history hold tokens, keys
      and database credentials, instances that run pipelines for more than one organisation ...'' or mark the unmasked/unprotected condition as
      the report''s mitigation rather than an observed state.'
    class: imprecision
- entry: 2026-10-08/ixa-systems-vaud-security-integrator-thegentlemen-sale
  truth_pass: 2026-10-18T1307Z-audit/truth-T2
  verdict: imprecision
  legacy_pending: false
  records_now: []
  defects:
  - where: summary (frontmatter)
    claim: The loot reportedly includes camera locations, security-installation plans and, in some cases, usernames or passwords, for clients
      including police authorities, gendarmerie premises, prisons, hospitals, schools and banks
    defect: (low confidence) The summary turns AWP's description of Ixa Systems' customer base (police authorities, banks, hospitals, schools,
      prisons) into a list of clients whose data is in the loot; the readable reports name as affected only judicial entities (Établissements
      de la plaine de l'Orbe), gendarmerie premises, several banks including the BCV and several dozen companies. The body paragraph keeps the
      two apart; the summary does not. (Le Temps' full text is paywalled and was not readable beyond its standfirst.)
    ground_truth: 'AWP/cash.ch: ''Zu ihren Kunden gehören unter anderem Polizeibehörden, Banken, Spitäler, Schulen und Gefängnisse.'' ICTjournal:
      ''Parmi les organisations concernées figurent les Etablissements de la plaine de l''Orbe et d''autres entités judiciaires, des locaux de
      la gendarmerie, plusieurs banques, dont la Banque cantonale vaudoise (BCV), ainsi que plusieurs dizaines d''entreprises.'''
    ground_truth_url: https://www.ictjournal.ch/news/2026-10-07/une-cyberattaque-expose-des-donnees-de-securite-de-sites-vaudois
    fix: 'Reword the summary: the firm''s customers include police authorities, banks, hospitals, schools and prisons (AWP), while the reported
      affected organisations are judicial entities, gendarmerie premises, several banks and several dozen companies (ICTjournal).'
    class: imprecision
