- entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  truth_pass: 2026-10-18T1307Z-audit/truth-T8b
  verdict: imprecision
  legacy_pending: false
  records_now:
  - at: '2026-09-30T07:03:26Z'
