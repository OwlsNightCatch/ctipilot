    type: correction
  - at: '2026-10-11T14:10:34Z'
    run_id: 2026-10-11T1307Z-audit
    type: correction
  defects:
  - where: headline
    claim: A public tool automates bulk enumeration of Entra ID accounts, their MFA methods and their admin status through Microsoft's own password-reset
      portal
    defect: ResetSpy's documented outputs are account existence, registered methods, strong/weak classification and SSPR policy state; admin status
      is not an output and is only inferable by the analyst from the policy state.
    ground_truth: 'LevelBlue: "For each target, it returns: Whether the account exists in the directory; Which SSPR verification methods are registered,
      if any; Whether those methods constitute a meaningful second factor or are weak-only; The SSPR policy state".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: Say the tool automates enumeration of accounts and MFA methods, and that admin accounts can be inferred from the portal's policy-state
      responses.
    class: imprecision
  - where: summary
    claim: Microsoft removed the portal's visual CAPTCHA in August 2026 in favor of backend throttling alone.
    defect: '''alone'' is wrong: the replacement is throttling plus behavior-based abuse detection (the body says so).'
    ground_truth: 'LevelBlue: "replaced it with backend throttling and behavior-based abuse detection"; Microsoft Message Center MC1400824: "replacing
      the legacy CAPTCHA with modern backend throttling and behavior-based abuse detection".'
    ground_truth_url: https://mc.merill.net/message/MC1400824
    fix: Replace 'backend throttling alone' with 'backend throttling and behavior-based abuse detection'.
    class: imprecision
  - where: body paragraph 2
    claim: any account that still reaches method selection is very likely a privileged role account
    defect: (low confidence) Intensified from the source's 'likely'.
    ground_truth: 'LevelBlue: "Any account that reaches the method selection screen when the broader tenant policy is disabled is likely a privileged
      role account".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: Use 'likely'.
    class: imprecision
  - where: Defender takeaway
    claim: scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population
    defect: 'Contradicts the entry''s own body and the source: out-of-scope accounts still confirm existence (SSPR_0013), and scoping leaks method
      data for in-group accounts, so scoping shrinks only the population exposed to method enumeration, not account-existence enumeration.'
    ground_truth: 'LevelBlue: "every non-''ViewUserIdentifierVerification'' response ... is confirmation that the account exists" and "Scoped
      SSPR, counterintuitively, leaks more information about the accounts that are inside the group than a blanket disabled policy does"; its
      recommendation is that scoping "reduces the attack surface and makes enumeration harder".'
    ground_truth_url: https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
    fix: 'Reword: scoping SSPR limits which accounts expose method data but does not stop existence enumeration; keep the weak-method removal
      and privileged-role phishing-resistant MFA points.'
    class: imprecision
