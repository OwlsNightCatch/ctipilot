- id: cisa-directives
  diagnosis: "Same Akamai/jina-402 condition as cisa-advisories: in-container `cisa page https://www.cisa.gov/news-events/directives`, extract and url --direct return nothing (403, then 402 on every reader key) => unreadable. The agent-side WebFetch tool reads it fine today: the listing returned six directive entries (ED 25-03 V1 Identify and Mitigate Potential Compromise of Cisco Devices; ED 25-03 Supplemental: Core Dump and Hunt Instructions; ED 26-03 V1 Mitigate Vulnerabilities in Cisco SD-WAN Systems; BOD 26-04 Prioritizing Security Updates Based on Risk (revokes BOD 19-02 and BOD 22-01) plus its Implementation Guidance; BOD 26-02 Mitigating Risk From End-of-Support Edge Devices) with per-directive paths /news-events/directives/<slug>, and a detail page (https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk) returned 'Issue Date: June 10, 2026' and the requirements summary. The listing itself carries NO per-item dates (also true of the reader-rendered listing per the 2026-08-04 note), so dating needs the detail page. Free discovery leads for new directives: Google News RSS query site:cisa.gov/news-events/directives (titles + dates only; BOD 26-04 2026-06-10, ED 26-03 2026-03-11, ED 25-03 supplemental 2025-09-25 — links are Google redirect URLs, not citable) and the KEV feed/cisa-news (new directives are announced in news.xml)."
  root_cause: "anti-bot 403 (Akamai) on every in-container transport + empty jina pool (transport problem, not a moved/dead listing); additionally a low-cadence source: directives arrive roughly quarterly (ED 25-03 supplemental 2025-09-25, ED 26-03 2026-03-11, BOD 26-04 2026-06-10) so the default 60-day staleness limit would flag it even when readable, and the listing exposes no dates for the check to read"
  fix:
    fetch_method: webfetch
    max_staleness_days: 180
  verified: "WebFetch https://www.cisa.gov/news-events/directives -> six directives listed with paths (e.g. '/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk', '/news-events/directives/v1-ed-26-03-mitigate-vulnerabilities-cisco-sd-wan-systems'), no dates on the page; WebFetch https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk -> 'BOD 26-04: Prioritizing Security Updates Based on Risk', 'Issue Date: June 10, 2026'. In-container: `python3 tools/fetch_source.py cisa page https://www.cisa.gov/news-events/directives` -> jina 402 on all keys (expected); no free in-container transport exists, so no health_cmd is proposed (a proxy command would only hide the reader outage)."
  notes_append: "2026-09-29: cisa.gov directives listing is unreadable in-container (Akamai 403 + jina 402) but the agent-side WebFetch tool reads the listing and the per-directive pages (listing: ED 25-03 V1/Supplemental, ED 26-03 V1, BOD 26-04 + Implementation Guidance, BOD 26-02; no dates on the listing — take the issue date from the detail page, e.g. BOD 26-04 = 2026-06-10). Cadence is roughly quarterly (ED 25-03 suppl. 2025-09-25, ED 26-03 2026-03-11, BOD 26-04 2026-06-10), so max_staleness_days 180. New directives are also announced in the cisa-news feed and KEV."
  recommendation: review
