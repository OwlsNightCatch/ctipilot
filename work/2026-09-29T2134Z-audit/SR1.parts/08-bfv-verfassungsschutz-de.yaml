- id: bfv-verfassungsschutz-de
  diagnosis: "The recorded `url` (.../SharedDocs/kurzmeldungen/DE/2026/) is not a listing: `url --direct` returns the 218,812-byte BfV homepage ('Bundesamt für Verfassungsschutz - Startseite') which links only two Kurzmeldungen (2026-09-18 joint advisory, 2026-08-26 Bitkom study), so the check saw a thin chrome page with a stale newest date (2026-07-25, 66 d). It is also year-bound (/2026/) and would break on 2027-01-01. The publisher itself is live: its RSS info page https://www.verfassungsschutz.de/DE/service/rss-feed/rss_node.html links https://www.verfassungsschutz.de/SiteGlobals/Functions/RSSNewsFeed/AlleMeldungen.xml, which parses over the direct transport: 30 items / 28,569 B, newest Mon 28 Sep 2026 (Fünfter Lagebericht Rechtsextremisten in Sicherheitsbehörden), then Fri 18 Sep 2026 (Internationaler Sicherheitshinweis: Illegale Devisenbeschaffung durch nordkoreanische Cyberaktivitäten, both /kurzmeldungen/ and /publikationen/ copies), Thu 23 Jul 2026 (Sicherheitshinweis für die Wirtschaft 02/2026, Sicherheits- und Verteidigungsbranche), Tue 9 Jun 2026 (Informationsblatt Ausspähung durch Drohnen). The feed is BfV-wide (mostly extremism/Verfassungsschutzbericht items); the cyber/espionage-relevant subset is low cadence (~1 per 4-8 weeks)."
  root_cause: "listing moved / wrong URL: the recorded year-bound Kurzmeldungen path serves the homepage, not a dated listing; the working surface is the site's AlleMeldungen RSS feed, which was never recorded. Publisher not dark; cyber-relevant items are genuinely sparse."
  fix:
    fetch_method: rss
    rss_url: "https://www.verfassungsschutz.de/SiteGlobals/Functions/RSSNewsFeed/AlleMeldungen.xml"
    url: "https://www.verfassungsschutz.de/DE/themen/cyberabwehr/cyberabwehr_node.html"
  verified: "python3 tools/fetch_source.py feed https://www.verfassungsschutz.de/SiteGlobals/Functions/RSSNewsFeed/AlleMeldungen.xml 30 -> method direct, 30 items, 28,569 B, newest 'Mon, 28 Sep 2026 10:00:00' 'Fünfter Lagebericht Rechtsextremisten in Sicherheitsbehörden' and 'Fri, 18 Sep 2026 08:00:00' 'Internationaler Sicherheitshinweis: Illegale Devisenbeschaffung durch nordkoreanische Cyberaktivitäten'. Drill: python3 tools/fetch_source.py extract https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html -> trafilatura-direct, title/date 2026-09-18 and body (joint advisory with NPA/BND/FBI). tools/source_health._content_assess simulated with fetch_method=rss + this rss_url -> relevant (8,073 alnum; terms angriff/cyber/cyberangriff/espionage/sicherheit; newest_item 2026-09-28, age 1 d). The cyberabwehr hub URL https://www.verfassungsschutz.de/DE/themen/cyberabwehr/cyberabwehr_node.html fetched 134,004 B via `url --direct` (static topic page, links dated cyber publications; not a dated listing, so only a landing pointer)."
  notes_append: "2026-09-29: working recipe is the RSS feed https://www.verfassungsschutz.de/SiteGlobals/Functions/RSSNewsFeed/AlleMeldungen.xml (30 items direct, newest same week); drill each item with `extract <link>`. The feed is BfV-wide (extremism, reports, press), so filter to /praevention_wirtschafts-und_wissenschaftsschutz/, /spionage-und-proliferationsabwehr/, /cyberabwehr/ paths and titles containing Cyber / Sicherheitshinweis / Joint Cybersecurity Advisory; cyber-relevant cadence is roughly one item per 4-8 weeks (18 Sep, 23 Jul, 24 Jun, 9 Jun 2026). The year-bound /SharedDocs/kurzmeldungen/DE/2026/ URL serves the homepage, not a listing."
  recommendation: fix
