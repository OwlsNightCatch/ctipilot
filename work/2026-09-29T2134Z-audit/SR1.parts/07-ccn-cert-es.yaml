- id: ccn-cert-es
  diagnosis: "Every path on www.ccn-cert.cni.es (English/Spanish news listings, site root, robots.txt, sitemap.xml, Joomla feed routes) returns the same HTTP 403, 6,901-byte page titled 'Voight-Kampff Browser Test' (Transparent Edge CDN JavaScript proof-of-work 'Verifying your browser' challenge; noscript variant says 'This website requires JavaScript'), so extract/url --direct return nothing and the jina reader (pinned in the record) is the only transport that passes it, currently at HTTP 402 on all keys => content_verdict unreadable. I did not attempt to solve the browser challenge: it is an access-control measure on the CERT's own host and defeating it is an operator decision, not a recipe. The parent Centro Criptologico Nacional site, however, is on a different host with no challenge and republishes the CCN-CERT alerts: https://www.ccn.cni.es/es/actualidad-ccn (HTTP 200, 138,777 B) carries e.g. 'CCN-CERT AL 09/26 Explotación activa de dos vulnerabilidades críticas en Citrix NetScaler ADC y NetScaler Gateway' (28/09/2026, nivel CRITICO, CVE-2026-88771/88772) and 'CCN-CERT AL 08/26 ... inyección SQL en Cisco Secure Email Gateway' (15 Sep 2026), plus CCN-STIC guide and CPSTIC catalogue news. Its Joomla Atom feed https://www.ccn.cni.es/es/actualidad-ccn?format=feed&type=atom parses over the direct transport: 10 items / 92,041 B, newest 2026-09-28T09:15:40+02:00, then 2026-09-17, 2026-09-15, 2026-09-14, 2026-09-10, 2026-09-09, 2026-09-04, 2026-08-27, 2026-08-05, 2026-07-30 (Actualizaciones para cinco vulnerabilidades de productos VMware). (The same route with type=rss returned an empty HTTP/2 stream error; use type=atom. limit=50 is ignored: the feed is capped at 10 items.)"
  root_cause: "anti-bot challenge on every transport for the CERT's own host (CDN JS proof-of-work, not a listing move) compounded by the empty reader pool; a free equivalent surface exists on the parent-agency host www.ccn.cni.es (same CCN-CERT alerts, Atom feed)"
  fix:
    fetch_method: rss
    url: "https://www.ccn.cni.es/es/actualidad-ccn"
    rss_url: "https://www.ccn.cni.es/es/actualidad-ccn?format=feed&type=atom"
  verified: "python3 tools/fetch_source.py feed 'https://www.ccn.cni.es/es/actualidad-ccn?format=feed&type=atom' 30 -> method direct, 10 items, 92,041 B, newest '2026-09-28T09:15:40+02:00' 'CCN-CERT AL 09/26 Explotación activa de dos vulnerabilidades críticas en Citrix NetScaler ADC y NetScaler Gateway' and '2026-09-15T13:42:59+02:00' 'CCN-CERT AL 08/26 Explotación activa de vulnerabilidad con inyección SQL en Cisco Secure Email Gateway'. Drill: python3 tools/fetch_source.py extract https://www.ccn.cni.es/es/actualidad-ccn/1386-ccn-cert-al-09-26-explotacion-activa-de-dos-vulnerabilidades-criticas-en-citrix-netscaler-adc-y-netscaler-gateway -> trafilatura-direct, date 2026-09-28, 'Fecha de publicación: 28/09/2026, Nivel de peligrosidad: CRÍTICO' full alert body with CVE links. tools/source_health._content_assess simulated with fetch_method=rss + this rss_url + url -> relevant, 61,490 alnum, terms ataque/exploit/incident/patch/seguridad/vulnerab, CVE ids present, newest_item 2026-09-28 (age 1 d)."
  notes_append: "2026-09-29: ccn-cert.cni.es is behind a Transparent Edge 'Voight-Kampff Browser Test' JS proof-of-work challenge (403, 6,901 B on every path; jina-only, reader pool empty; not solved/attempted). Working free recipe = the parent CCN site www.ccn.cni.es, which republishes CCN-CERT alerts (AL nn/26) under /es/actualidad-ccn/<id>-<slug>: `feed 'https://www.ccn.cni.es/es/actualidad-ccn?format=feed&type=atom' 10` (type=atom only; 10-item cap; newest 2026-09-28) then `extract <item link>`. Alert cadence ~2 in Sept 2026 (AL 08/26 15 Sep, AL 09/26 28 Sep) with other CCN news in between; CERT-only content on the challenged host (technical reports, IA) stays reader-only."
  recommendation: fix
