- id: ico-uk
  diagnosis: "The recorded listing https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/ answers HTTP 200 (39,910 B via `url --direct`, ~1,330 alnum after extraction) but the result list is a client-side widget: the body shows only filter labels and five 'Loading...' placeholders; results are POSTed to /api/search by /js/search.js (POST body, so out of scope for the read-only bridge). Hence no dated items and no security vocabulary (verdict irrelevant, newest 2025-02-12 from unrelated page text). The server-rendered discovery surface is the 5.2 MB sitemap https://ico.org.uk/sitemap.xml (200, 31,270 URLs, per-URL lastmod): `python3 tools/fetch_source.py ico-uk enforcement N` already parses it for /action-weve-taken/enforcement/ (222 actions total; newest real actions: ACRO Criminal Records Office reprimand 2026-08-12 lastmod, a cyber-incident Art. 32 reprimand; Elderly Aids Ltd 2026-08-27; Metropolitan Police Service reprimand 2026-08-05; Jacksons Marketing 2026-07-08). The sitemap also lists 278 news-and-blogs items, newest lastmod 2026-09-28 (WASPI UK GDPR code of conduct), 2026-09-24 (TikTok withdraws appeals, accepts £12.7m fine), 2026-09-11 (ICO statement on its investigation into Police Scotland)."
  root_cause: "JS SPA listing: the health check reads a client-rendered listing; the documented api recipe (ico-uk enforcement, sitemap-based) works and is not what the check ran. Regulator cadence is genuinely bursty (enforcement-URL months in 2026: Jan 2, Feb 6, Mar 3, Apr 1, May 7, Jun 0, Jul 3, Aug 3), so the default 60-day staleness limit is tight."
  fix:
    health_cmd: ["ico-uk", "enforcement", "10"]
    max_staleness_days: 90
  verified: "python3 tools/fetch_source.py ico-uk enforcement 10 -> 10 items from 222 in sitemap, newest 'elderly-aids-limited-mpn' (/action-weve-taken/enforcement/2026/08/, lastmod 2026-08-27) and 'acro-criminal-records-office' (lastmod 2026-08-12); drill: python3 tools/fetch_source.py extract https://ico.org.uk/action-weve-taken/enforcement/2026/08/acro-criminal-records-office/ -> trafilatura-direct, date 2026-08-12, 'issues a reprimand to ACRO Criminal Records Office for infringements of Articles 32(1)... follows a cyber incident in which the personal data of approximately 10,000 UK data subjects may have been affected'; news drill python3 tools/fetch_source.py extract https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/09/tiktok-withdraws-two-appeals-in-children-s-privacy-action-and-accepts-127m-fine/ -> date 2026-09-24. tools/source_health._content_assess simulated with the health_cmd -> verdict relevant via the structured-results branch (1,459 alnum, JSON items list non-empty); NOTE newest_item came back null because the ISO lastmod timestamps ('2026-09-24T09:18:48+00:00') are not matched by _dates_in (the ymd regex needs a word boundary after the day and 'T' follows), so staleness cannot fire for this recipe until that regex accepts a trailing T."
  notes_append: "2026-09-29: listing at /about-the-ico/media-centre/news-and-blogs/ is a JS-loaded widget (POST /api/search, 'Loading...' placeholders) — never a health or content surface. Working recipe = sitemap: `ico-uk enforcement N` (222 enforcement URLs with lastmod, per-action pages extract cleanly with date/type/sector fields) plus, for news/statements, the same sitemap.xml entries under /about-the-ico/media-centre/news-and-blogs/YYYY/MM/ (278 items, newest lastmod 2026-09-28) then `extract <item URL>`. Enforcement cadence is 0-7 actions/month (none in Jun 2026), so max_staleness_days 90."
  recommendation: fix
