- id: enisa-euvd
  diagnosis: "The record's `url` (https://euvd.enisa.europa.eu/) is an Angular SPA; extract+direct on it yields only a ~377-alnum noscript shell, which is what the health check read (content_verdict=shell). The documented recipe is the API subcommands: `enisa-euvd recent exploited` returned 5,869 bytes / 10 records this run (newest datePublished Sep 29, 2026 9:26 PM; dateUpdated Sep 29 2026 2:58 PM), `recent criticals` 4,044 B (newest Sep 29 2026), `recent lastvulnerabilities` 5,869 B (newest Sep 29 2026). All three are live and current."
  root_cause: "tool false positive: the record is fetch_method=api but the content check read the SPA front page instead of the documented API subcommand (enisa-euvd was not yet mapped for the content read). The current tools/source_health.py already maps enisa-euvd -> `enisa-euvd recent exploited` in API_BRIDGE_CMD; this run's simulation of _content_assess with that path returns relevant (3,613 alnum, terms attack/exploit/patch/security/vulnerab, CVE ids present, newest 2026-09-29, age 0 d)."
  fix:
    health_cmd: ["enisa-euvd", "recent", "exploited"]
  verified: "python3 tools/fetch_source.py enisa-euvd recent exploited -> 5,869 bytes JSON, 10 records, newest datePublished 'Sep 28, 2026, 7:13:52 PM' / dateUpdated 'Sep 29, 2026, 2:58:23 PM' (EUVD-2026-88445, Apple out-of-bounds write, 'Apple is aware of a report that this issue may have been exploited'); `recent criticals` -> EUVD-2026-89469 (TMS file-upload, CVSS 4.0 9.4, published Sep 29 2026 9:26 PM). tools/source_health._content_assess simulated with health_cmd -> verdict relevant, newest_item 2026-09-29."
  notes_append: "2026-09-29: health-check flag was a false positive (check read the SPA front page of an api record, 377-alnum noscript shell); the documented recipe `enisa-euvd recent {lastvulnerabilities|criticals|exploited}` returns live same-day JSON (5.9/4.0/5.9 KB) and is now the content-check command (health_cmd)."
  recommendation: keep
