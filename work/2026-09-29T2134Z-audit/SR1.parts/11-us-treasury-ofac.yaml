- id: us-treasury-ofac
  diagnosis: "https://ofac.treasury.gov/recent-actions reads cleanly on every rung (`url --direct` 45,161 B; `extract` 4,572 alnum, trafilatura-direct): it is a server-rendered Drupal listing (3,164 results, 10 per page, ?page=N) of ALL OFAC actions with dated per-action links /recent-actions/YYYYMMDD; newest 2026-09-29 (Counter Narcotics, Counter Terrorism, Iran-related, and Non-Proliferation Designations), then 2026-09-28, 09-24, 09-23, 09-18, 09-17. The 'irrelevant' verdict is purely the vocabulary test: the listing is whole-of-sanctions, so security terms appear only when a Cyber-related action is in the top ten (only 'cyber' matched, from the nav entry 'Cyber-related Sanctions'). Cyber-related actions are genuinely sporadic: the site's own filter https://ofac.treasury.gov/recent-actions?search_api_fulltext=cyber&ra_year=2026 (form field names read from the page's search_recent_actions_form) returns 5 of 2026's actions: 2026-08-24, 2026-07-13 (Cyber-related Designations; Cuba Designations), 2026-04-23 (Cyber-related Designations Removals), 2026-03-13, 2026-02-24."
  root_cause: "tool false positive: a general-scope regulator listing fails the RELEVANCE_MIN=3 security-vocabulary test by design; the source is healthy, fresh (0 d) and the recipe (`url`/`extract` on the listing, then per-action /recent-actions/YYYYMMDD) is intact. Cyber-relevant content is quiet-by-nature (~1 action per 4-8 weeks)."
  fix:
    content_scope: general-news
  verified: "python3 tools/fetch_source.py url https://ofac.treasury.gov/recent-actions --direct -> 45,161 B, title 'Recent Actions | Office of Foreign Assets Control', 'Displaying 1 - 10 of 3164 results', 10 dated action links (newest /recent-actions/20260929). Drill: python3 tools/fetch_source.py extract https://ofac.treasury.gov/recent-actions/20260713 -> trafilatura-direct, title 'Cyber-related Designations; Cuba Designations; Issuance of Cuba-related Frequently Asked Question', date 2026-07-13, full designation text. tools/source_health._content_assess simulated with content_scope=general-news (the min_terms=1 knob in the current tools/source_health.py) -> relevant, 4,572 alnum, newest_item 2026-09-29, age 0 d. This is an additional record field beyond the five in the brief; if the operator prefers not to add it, the alternative is to accept the irrelevant verdict as a known false positive."
  notes_append: "2026-09-29: recipe confirmed healthy (`url --direct`/`extract` on /recent-actions, 10 dated actions per page, newest same-day; ?page=N paginates). The health check's 'irrelevant' flag is a vocabulary false positive on a whole-of-sanctions listing (content_scope general-news). For cyber-only discovery use the site filter https://ofac.treasury.gov/recent-actions?search_api_fulltext=cyber&ra_year=<YYYY> (2026 so far: Feb 24, Mar 13, Apr 23, Jul 13, Aug 24), then drill /recent-actions/YYYYMMDD with extract."
  recommendation: keep
