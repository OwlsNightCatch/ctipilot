- id: cert-at
  diagnosis: "Recipe `webfetch https://www.cert.at/de/meldungen` returns a 67,891-byte server-rendered page (via `url --direct`) whose visible content is site navigation plus only the newest warning's full body; the health check's date scan therefore found only an old date (newest 2026-05-07, 145 d) although the publisher is live and current. The site publishes proper RSS 2.0 / Atom 1.0 feeds (links taken from https://www.cert.at/de/services/feeds): `warnings` newest Sun 27 Sep 2026 (Citrix NetScaler ADC/Gateway actively exploited), then 24 Sep (F5 BIG-IP APM CVE-2026-94127), 15 Sep (Cisco Secure Email Gateway), 2 Sep (SonicWall SMA1000), 20 Jul, 15 Jul, 22 Jun, 8 Jun, 20 May, 8 May; `current` (Aktuelles) newest 8 Sep 2026 (N-able N-central), 7 Sep (MikroTrick), 27 Aug (Exchange exploit code CVE-2026-62911); `daily` (Tagesberichte) newest 29 Sep 2026; `blog` newest 18 Jun 2026; `specials` last 9 May 2025."
  root_cause: "listing not date-scannable: the /de/meldungen landing page carries dates only inside the one expanded item, so the content check saw a stale date; a structured RSS feed exists and was simply never recorded (earlier notes assumed no feed, and the cadence is genuinely sparse: gaps of 19-44 days between warnings)"
  fix:
    fetch_method: rss
    rss_url: "https://www.cert.at/cert-at.de.warnings.rss_2.0.xml"
  verified: "python3 tools/fetch_source.py feed https://www.cert.at/cert-at.de.warnings.rss_2.0.xml 15 -> method direct, 15 items, newest 'Sun, 27 Sep 2026 16:56:07 GMT+0100' 'Kritische Sicherheitslücken in Citrix NetScaler ADC und NetScaler Gateway - aktiv ausgenutzt - Updates verfügbar' and 'Thu, 24 Sep 2026' 'Aktive Ausnutzung: Kritische Sicherheitslücke in F5 BIG-IP APM (CVE-2026-94127)'. Drill: python3 tools/fetch_source.py extract https://www.cert.at/de/warnungen/2026/9/f5-big-ip-apm-rce -> trafilatura-direct, clean markdown with title/date 2026-09-24 and body. tools/source_health._content_assess simulated with fetch_method=rss + this rss_url -> relevant, 56,548 alnum, CVE ids present, newest_item 2026-09-27 (age 2 d). The listing https://www.cert.at/de/meldungen/warnungen (67,843 B via `url --direct`) also links the same items newest-first but shows a date only for the one expanded item, which is why it needs the feed for dating."
  notes_append: "2026-09-29: RSS feeds exist (listed at https://www.cert.at/de/services/feeds, all fetch direct with no reader): warnings https://www.cert.at/cert-at.de.warnings.rss_2.0.xml (primary, advisories/active exploitation; article path /de/warnungen/<YYYY>/<M>/<slug>), current https://www.cert.at/cert-at.de.current.rss_2.0.xml (Aktuelles; /de/aktuelles/...), daily https://www.cert.at/cert-at.de.daily.rss_2.0.xml (Tagesberichte digest), blog https://www.cert.at/cert-at.de.blog.rss_2.0.xml. Sweep `warnings` AND `current` each run; drill with `extract <item link>`. Warnings cadence 2-6 weeks so quiet periods are partly real."
  recommendation: fix
