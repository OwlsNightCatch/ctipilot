- id: cisa-news
  diagnosis: "In-container transports all fail: direct 403 'Access Denied' (Akamai, 378 B) on https://www.cisa.gov/news.xml; `feed`, `cisa feed`, `extract` and `url` fall back to jina which returns 402 on all 7 keys and the anonymous tier (0 alnum, unreadable). Agent-side WebFetch reads it: https://www.cisa.gov/news.xml returned the 5 newest items — 2026-09-23 'CISA Whitepaper Charts Path to Establishing and Maturing CVE Program Quality', 2026-09-18 'CISA Hosts Cyber Storm X…', 2026-09-16 'New CISA Guidance Helps Critical Infrastructure Detect, Observe and Impede Malicious Cyber Activity', 2026-09-15 'CISA and NIST Release Guidelines to Protect Federal Cloud Identity Systems from Token Theft, Forgery, and Misuse', 2026-09-09 'CISA Releases Updated Insider Threat Guide…' — and the JS listing https://www.cisa.gov/news-events/news returned the same five items with type 'Press Release' and dates; the detail page https://www.cisa.gov/news-events/news/cisa-whitepaper-charts-path-establishing-and-maturing-cve-program-quality returned its full summary, 5 outbound links and two verbatim quotes. Cadence is ~1-3 press releases a week, none dated after 2026-09-23 as of 2026-09-29 (within a normal gap)."
  root_cause: "anti-bot 403 (Akamai) on every in-container transport with the jina reader pool empty (HTTP 402); the recorded `cisa feed …/news.xml` recipe is reader-only. Agent-side WebFetch currently passes. Not a moved listing, not stale (newest 6 days)."
  fix:
    fetch_method: webfetch
  verified: "WebFetch https://www.cisa.gov/news.xml and https://www.cisa.gov/news-events/news (both -> 5 items, newest 'CISA Whitepaper Charts Path…' September 23, 2026, item URLs under https://www.cisa.gov/news-events/news/<slug>); WebFetch of the whitepaper article -> title/date/summary + outbound links (https://www.cisa.gov/resources-tools/resources/cve-program-establishing-quality-era-framework, https://www.cve.org/ProgramOrganization/CNAs) + verbatim quote 'The CVE program is a common good, underpinning the global vulnerability ecosystem.' In-container `python3 tools/fetch_source.py cisa feed https://www.cisa.gov/news.xml 5` -> jina 402 on every key then failure (expected). Free dated proxy for freshness only: `feed 'https://news.google.com/rss/search?q=site:cisa.gov+when:30d&hl=en-US&gl=US&ceid=US:en' 15` -> 100 items incl. 2026-09-28/29 CISA pages (Google redirect links, so lead-only)."
  notes_append: "2026-09-29: news.xml and the /news-events/news listing are unreadable in-container (Akamai 403; jina 402) but the agent-side WebFetch tool reads both plus detail pages (7/7 cisa.gov WebFetch calls succeeded today across the three CISA records) — use WebFetch with the outbound-links template first, then the item URL. The fetch_source `cisa feed|page` recipe needs reader credit. Latest items as of 2026-09-29: 23 Sep whitepaper (CVE Program Quality Era), 18 Sep Cyber Storm X, 16 Sep critical-infrastructure guidance, 15 Sep NIST/CISA cloud identity guidelines, 9 Sep insider threat guide."
  recommendation: review
