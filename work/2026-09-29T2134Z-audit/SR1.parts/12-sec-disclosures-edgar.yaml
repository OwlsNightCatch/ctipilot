- id: sec-disclosures-edgar
  diagnosis: "The documented recipe `python3 tools/fetch_source.py sec-edgar 8k` (default: Item 1.05, trailing 14 days) works and returns a small well-formed JSON envelope: this run {query: item 1.05, 2026-09-15..2026-09-29; total 1; hits: [Astrana Health, Inc. (ASTH), 8-K Item 1.05, file_date 2026-09-23, filing_url https://www.sec.gov/Archives/edgar/data/1083446/000110465926109813/]}, 241 alnum. The probe judged that as content_verdict=shell purely because a one-hit (or zero-hit) metadata payload is under the 600-alnum floor. A 2026-07-01..2026-09-29 query returns 17 Item 1.05 filings (Amgen 07-31, River Financial x4 in July, AdaptHealth 07-02, Navient 07-02, Upbound 07-22, Park Dental 09-01, NovoCure 09-01, Nutex Health 09-11, Astrana 09-23), i.e. a real cadence of ~1-2 per week with occasional empty fortnights."
  root_cause: "tool false positive: a query API's small structured result set (or an empty envelope) is normal, not a shell. The current tools/source_health.py already special-cases this (structured_hits / empty_envelope branch keyed on transport api|health_cmd); simulating _content_assess on this record now returns relevant. Remaining caveat: newest_item is taken from the query's end date (the envelope's own 'end'), not the newest filing, so staleness cannot fire for this source."
  fix:
    health_cmd: ["sec-edgar", "8k"]
  verified: "python3 tools/fetch_source.py sec-edgar 8k -> JSON, total 1, count 1, hit Astrana Health 8-K Item 1.05 filed 2026-09-23 (adsh 0001104659-26-109813); python3 tools/fetch_source.py sec-edgar 8k 2026-07-01 2026-09-29 1.05 -> total 17 / count 17 (samples: 'AMGEN INC (AMGN)' 2026-07-31, 'Nutex Health Inc. (NUTX)' 2026-09-11). tools/source_health._content_assess simulated on the unchanged record -> verdict relevant (api transport, JSON hits list non-empty, newest_item 2026-09-29)."
  notes_append: "2026-09-29: health flag was a false positive (metadata-only JSON envelope under the alnum floor); `sec-edgar 8k` (default Item 1.05, trailing 14 d) is the correct content-check command, verified live: 1 hit in the last 14 d (Astrana Health, 2026-09-23), 17 hits 2026-07-01..2026-09-29. An empty 14-day window is a normal quiet result, not a failure; widen with `sec-edgar 8k <start> <end> 1.05`."
  recommendation: keep
