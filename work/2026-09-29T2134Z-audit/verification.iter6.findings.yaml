  url_or_quote: "Detection was limited before the PoC went public, and the crash and leak modes now public produce the same signature — the mechanism's observable signature is anomalously large or malformed request bodies immediately followed by nginx worker-process restarts/crashes on edge hosts"
  summary: "(low-medium confidence) The reworded sentence says the public crash AND leak modes 'produce the same signature' of worker restarts/crashes. The cited write-up https://cyberstan.co.uk/nginx-rce/ describes the leak mode as 'One unauthenticated GET, no retries needed' (an 8160-byte URI path plus a 1-byte header whose response carries 8159 bytes of heap residue) and the PoC README (https://github.com/0xCyberstan/CVE-2026-42533-POC) says '--leak: dump the libc and heap pointers out of the oversized response body'; only a missed exploit attempt 'crashes the worker'. The leak mode produces no crash, so the sentence attributes a crash signature to a mode the source does not say crashes. Fix: say the crash mode leaves the worker-crash signature, the leak mode is a single GET returning an oversized response of heap residue (source-stated), and a missed RCE attempt crashes the worker."
