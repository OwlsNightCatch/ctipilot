- "entry": "2026-08-12/cve-2026-20349-cisco-asa-ftd-ssl-vpn-dos-exploited"
  "kind": "quote"
  "quote_or_cve": "In August 2026, the Cisco Product Security Incident Response Team (PSIRT) became aware of active exploitation of this vulnerability."
  "verdict": "page-revised"
  "evidence": "Fetched live (fetch_source.py extract, trafilatura-direct, 200). The advisory is now revision 1.1 dated 2026-SEP-16 (revision table: '1.1 Updated fixed release information and added reference to security hardening releases. Summary and Fixed Releases Final 2026-SEP-16; 1.0 Initial public release. Final 2026-AUG-11'). The Summary now reads 'In August 2026, the Cisco PSIRT became aware of active exploitation of this vulnerability. Cisco strongly recommends that customers upgrade to a fixed software release to remediate this vulnerability.' The long-form 'Cisco Product Security Incident Response Team (PSIRT)' wording appears nowhere in the Summary any more (the expanded name occurs only in the boilerplate sentences 'The Cisco Product Security Incident Response Team (PSIRT) validates only the affected and fixed release information...'). The fire-time copy (work/2026-08-12T0411Z-intel/findings.S1.yaml line 125) carried the long form, so the page was edited after publication (the v1.0 text itself could not be re-fetched: web.archive.org unreachable, jina keys exhausted). The claim itself (Cisco PSIRT aware of exploitation in August 2026) is unchanged."
  "replacement": "In August 2026, the Cisco PSIRT became aware of active exploitation of this vulnerability."
  "replacement_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-vpn-dos-dzv4mQFF"
  "fact_change": "Quote wording only, no fact change for the quoted sentence. BUT the same revision (v1.1, 2026-09-16) changed the remediation facts the entry asserts elsewhere: the entry says 'There are no workarounds, only hot fixes' (still true: 'There are no workarounds that address this vulnerability') and lists per-train hot fixes (ASA 89.16.4.50, 89.18.4.50, 9.20.4.235, 9.22.3.191, 9.23.1.211, 9.24.1.221; FTD hot-fix packages). The live Fixed Releases tables now list hardening releases as the first fixed releases: ASA 9.16.4.103, 9.18.4.94, 9.20.4.49, 9.22.3.26, 9.23.1.47, 9.24.1.26; FTD/FMC 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2, 10.1.0 (10.1 is newly listed), with the note 'Previously, hot fixes were provided to remediate this vulnerability. ... Cisco recommends that customers upgrade to the appropriate hardening release for their devices.' The entry's `fixed:` line, actions[] and the body's ASA-hot-fix/ASDM 7.24.1.374 footnote are stale against the live advisory (improvement/update candidate; hot-fix path is superseded)."
- "entry": "2026-08-15/geoserver-jsonarraycontains-unauth-sqli-zeroday-exploited"
  "kind": "cve"
  "quote_or_cve": "CVE-2023-25158"
  "verdict": "page-revised"
  "evidence": "Flagged clause is in the 2026-08-18 update section (entry line 173): \"GeoTools says no mitigation is available, and specifically that the CVE-2023-25158 mitigation of enabling prepared statements and disabling encode functions is not effective ([GeoTools, 2026-08-15](.../GHSA-mqjf-5f49-2fjh))\". Live GHSA (fetch_source.py extract and url --direct raw HTML, both 200) no longer carries that sentence or the CVE-2023-25158 id at all (0 occurrences of 25158 and of 'regression' in the raw HTML). Its Mitigation section now reads: \"No mitigation is available: To limit scope of SQL Injection the PostGIS connection pool should be configured with limited rights.\" The publication-time text was captured by the 2026-08-18 fire and its verifiers: work/2026-08-18T0410Z-intel/findings.S2.yaml line 55 quotes \"No mitigation is available at this time: Specifically the CVE-2023-25158 mitigation of enabling preparedStatements and disabling encode functions is not effective.\" and verification.iter7.md line 60 records the GHSA's own words \"a regression of CVE-2023-25158 for the single jsonArrayContains function\". So the advisory was edited after 2026-08-18 (the entry's clause was faithful when written). The 'regression of CVE-2023-25158' statement is now carried by The Hacker News (cited in the entry): \"The maintainers also noted that the vulnerability is a regression of CVE-2023-25158 (CVSS score: 9.8) ...\" (https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html). Other live-page changes on the same GHSA: header now carries 'CVE ID CVE-2026-76904', 'Severity Critical 9.8', 'Patched versions 35.1 34.5 33.6', 'Affected versions 35.0 >=34.0 >=30.5, < 31.0, >=31.3, >= 32.0' while the description body still lists 'GeoTools 35.1 / 33.5 / 34.4'; the GeoServer 3.0.1 announcement now says 'This releases addresses the GeoTools CVE-2026-76904 SQL Injection vulnerability'."
  "replacement": "GeoTools says no mitigation is available (\"No mitigation is available: To limit scope of SQL Injection the PostGIS connection pool should be configured with limited rights.\"); the 'CVE-2023-25158 mitigation is not effective' clause should be dropped or attributed to the earlier advisory text, and the 'regression of CVE-2023-25158' statement cited to The Hacker News (https://thehackernews.com/2026/08/unpatched-geoserver-zero-day-targeted.html): \"The maintainers also noted that the vulnerability is a regression of CVE-2023-25158 (CVSS score: 9.8)\""
  "replacement_url": "https://github.com/geotools/geotools/security/advisories/GHSA-mqjf-5f49-2fjh"
  "fact_change": "Yes, twice. (1) The entry's assertion that GeoTools itself calls the prepared-statements/encode-functions mitigation ineffective, and the resulting GeoTools-vs-Hadrian contradiction (body line 173 and the update record summary), is no longer supported by the live GHSA: it now says only that no mitigation exists and to limit DB-role rights, so the disagreement with Hadrian's 'disabling the encode functions option ... prevents jsonArrayContains from being translated' is no longer a documented contradiction (the entry should say the advisory text was later revised). (2) The entry states 'No CVE identifier exists yet' and carries cves: [] but the GHSA and the GeoServer 3.0.1 announcement now assign CVE-2026-76904 (CVSS 9.8 on the GHSA, CWE-89): a `cves[]` record and CVE-id text are now due. Also the entry's fixed versions (35.1, 34.5, 33.6) agree with the GHSA header Patched-versions field but not with its description body (35.1, 33.5, 34.4). Also: the live GHSA header now gives 'Affected versions 35.0 >=34.0 >=30.5, < 31.0, >=31.3, >= 32.0', not the entry's '35.0, >=34.0 and >=33.1'."
- "entry": "2026-08-22/ptc-windchill-three-new-cves-unauth-rce-no-fixed-version"
  "kind": "cve"
  "quote_or_cve": "CVE-2026-77646"
  "verdict": "mis-cited"
  "evidence": "Clause (body para 1): 'CVE-2026-77646, scored 7.7, is a server-side request forgery in Windchill PDMLink and FlexPLM reachable by the same deserialization mechanism ([BSI CERT-Bund, 2026-08-20](wid.cert-bund.de ...WID-SEC-2026-2963); [GitHub Security Advisory, 2026-08-20](https://github.com/advisories/GHSA-5hvp-9mcx-5245))'. (1) GHSA-5hvp-9mcx-5245 is the advisory for CVE-2026-77644, not -77646: its title is 'CVE-2026-77644 - GitHub Advisory Database', CWE-306, 'Severity Critical 9.3'; the string CVE-2026-77646 does not occur on it. (2) The BSI portal URL is an Angular SPA shell (empty <portal-app>, no text for any transport, which is why the gate's saved body lacked the id), but the advisory's real content is the CSAF document, fetched via `fetch_source.py bsi-csaf WID-SEC-2026-2963`: title 'PTC Windchill und FlexPLM: Mehrere Schwachstellen', current_release_date 2026-08-20T22:00Z, vulnerabilities CVE-2026-77644, CVE-2026-77645 and CVE-2026-77646 (the last bound to FlexPLM, Windchill and Windchill PDMLink). So BSI carries the id and the product binding, but the CSAF carries no CVSS score and no SSRF text. (3) The page that carries the clause's details is GHSA-2698-qwmx-3r6f (already in the entry's sources but not cited on this clause): 'CVE-2026-77646 - GitHub Advisory Database', description 'A Server-Side Request Forgery (SSRF) vulnerability has been reported in PTC Windchill PDMLink and PTC FlexPLM. The vulnerability may be exploited through the deserialization of untrusted data.', 'Severity High 7.7', CWE-502, 'Published by the National Vulnerability Database Aug 20, 2026'."
  "replacement": "Cite GHSA-2698-qwmx-3r6f for this clause (or all three GHSAs, one per CVE): 'A Server-Side Request Forgery (SSRF) vulnerability has been reported in PTC Windchill PDMLink and PTC FlexPLM. The vulnerability may be exploited through the deserialization of untrusted data.' (Severity High 7.7)."
  "replacement_url": "https://github.com/advisories/GHSA-2698-qwmx-3r6f"
  "fact_change": "None. Every fact in the clause (id, 7.7, SSRF, PDMLink and FlexPLM, same deserialization mechanism) is supported by GHSA-2698-qwmx-3r6f; the id/product binding is also in BSI's CSAF. Only the second citation is wrong (points at the CVE-2026-77644 record)."
- "entry": "2026-08-22/spip-two-unconditional-preauth-rce-releases-three-days-apart"
  "kind": "quote"
  "quote_or_cve": "SPIP before 4.4.20 allows unauthenticated remote attackers to execute arbitrary code, as exploited in the wild in August 2026."
  "verdict": "false-positive"
  "evidence": "The cited EUVD page (https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-63757) is a JavaScript single-page app: every HTML transport (fetch_source.py extract, url --direct) returns only the placeholder 'The European Vulnerability Database application could not be loaded. We apologise for the inconvenience. This page will automatically attempt to reload every 30 seconds.', so the gate compared against an empty shell. The structured record the SPA renders is served by the ENISA API and is reachable with `fetch_source.py enisa-euvd advisory EUVD-2026-63757` (200, JSON): id EUVD-2026-63757, datePublished 'Aug 20, 2026, 10:24:39 PM', baseScore 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), aliases 'CVE-2026-77647 GHSA-wj6g-rh9q-6vvm', product SPIP '0 <4.4.20', and description: \"SPIP before 4.4.20 allows unauthenticated remote attackers to execute arbitrary code, as exploited in the wild in August 2026. This is related to incorrect identification of <?php blocks, and var_export's mishandling of certain cases such as presence of a '<' character.\" The quote is the first sentence of that description, verbatim. Gate blind spot (SPA), not an entry defect."
  "replacement": null
  "replacement_url": "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-63757"
  "fact_change": "None. (Side note, not a defect: the live EUVD record's EPSS is now 2.29, the entry text says 'an EPSS of 0.82' as of 2026-08-20; EPSS is a moving score.)"
