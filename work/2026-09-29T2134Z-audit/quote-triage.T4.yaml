- "entry": "2026-08-23/spectre-uat-10147-byovd-edr-callback-unlink"
  "kind": "quote"
  "quote_or_cve": "kernel-callback-dependent security products such as CrowdStrike Falcon, SentinelOne, Microsoft Defender"
  "verdict": "page-revised"
  "evidence": "Live Talos post (fetch_source.py extract, 200, dateline 2026-08-20) now reads, in the paragraph on callback unlinking: \"By performing targeted kernel writes, the SPECTRE safely unlinks each registered EDR callback from its doubly-linked list. Consequently, kernel-callback-dependent security products are rendered completely blind to new process creations, thread creations, and image load events for the remainder of the session, successfully neutralizing EDR visibility on the target machine.\" No product names anywhere on the page (grep for CrowdStrike, SentinelOne, Falcon, Defender, 'EDR vendor': 0 hits). The 2026-08-21 and 2026-08-23 fires captured the earlier wording as a contiguous substring (work/2026-08-21T0410Z-intel/findings.F2.yaml lines ~55-59: \"Consequently, kernel-callback-dependent security products such as CrowdStrike Falcon, SentinelOne, Microsoft Defender, and other well-known EDR vendors are rendered completely blind to new process creations, thread creations, and image load events for the remainder of the session, successfully neutralizing EDR visibility on the target machine.\"), so Talos edited the sentence after 2026-08-23 and removed the vendor list. The other evidence quote about unlinking each registered EDR callback is still verbatim."
  "replacement": "kernel-callback-dependent security products are rendered completely blind to new process creations, thread creations, and image load events for the remainder of the session"
  "replacement_url": "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/"
  "fact_change": "Yes, one. The entry's frontmatter summary says the callback-dependent endpoint products are ones 'which Talos names as CrowdStrike Falcon, SentinelOne and Microsoft Defender'; the live post names no products, so that attribution is no longer supported by the cited page (mechanism, per-build offset table, and blinding claim are unchanged). The summary clause should drop the named products or be marked as the post's earlier wording. Body prose does not name the vendors (only summary line 13 and the evidence quote do)."
- "entry": "2026-08-23/trueconf-server-kev-head-mare-trojanized-installer"
  "kind": "cve"
  "quote_or_cve": "CVE-2026-72529"
  "verdict": "mis-cited"
  "evidence": "Clause (body para 1): '**CVE-2026-72529** is a missing-authentication flaw: \"An unauthorized attacker can connect to TrueConf server versions 5.3.X before 5.3.9, ... and execute a malicious script on the server by calling an undocumented function\" ([Kaspersky ICS CERT, 2026-08-12](https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/))'. The quoted sentence is verbatim on that page (Technical details section) but the page contains no CVE id at all (zero CVE-* strings): it identifies the two flaws only by Kaspersky-internal ids, 'The internal identifier KLCERT-26-057 has been assigned to track this vulnerability' and 'KLCERT-26-058'. The CVE-to-flaw mapping is on Kaspersky's per-vulnerability advisory page 'KLCERT-26-057: TrueConf Server. Missing authentication for critical function' (canonical https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-missing-authentication-for-critical-function/, linked from the report as .../advisories/2026/08/11/trueconf-server-missing-authentication-for-critical-function), which lists 'CVE 2026-72529 ... KLCERT KLCERT-26-057', dateline 11 August 2026, same affected ranges (5.3.X before 5.3.9, 5.4.X before 5.4.9, 5.5.X before 5.5.5, all versions before 5.3) and mitigation 'Update TrueConf server to versions 5.3.9, 5.4.9 or 5.5.5.'. CISA KEV (json feed, already in the entry's sources) independently lists CVE-2026-72529 'TrueConf Server Missing Authentication for Critical Function Vulnerability', dateAdded 2026-08-20, port 4307/TCP, and CVE-2026-72530 as the CWE-94 code injection."
  "replacement": "Add the Kaspersky ICS CERT advisory as the citation that binds the id: KLCERT-26-057 lists 'CVE 2026-72529' and 'TrueConf Server. Missing authentication for critical function'; keep the report link for the verbatim sentence."
  "replacement_url": "https://ics-cert.kaspersky.com/vulnerabilities/trueconf-server-missing-authentication-for-critical-function/"
  "fact_change": "None. Id, description, affected ranges (5.3.9 / 5.4.9 / 5.5.5) and KEV date agree with the KLCERT advisory and CISA KEV; the citation simply does not carry the id. (The id is carried by CISA KEV, which the entry lists in sources.)"
- "entry": "2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce"
  "kind": "quote"
  "quote_or_cve": "The field value being formatted into the shell command is not sanitized and could include OS shell directives controlled by an attacker."
  "verdict": "not-verbatim"
  "evidence": "Live Claroty Team82 post (fetch_source.py extract, 200; the same page carries the entry's other three quotes verbatim, so the page appears stable) reads: \"The value fetched from item number 0x1be1 is formatted into the OS shell command. This is our email authentication password. The field value being formatted into the shell command is not sanitized according to our analysis and could potentially include OS shell directives that yield subsequent commands controlled by a potential attacker.\" The entry's quote is a compression of that sentence: it drops 'according to our analysis', 'potentially' and 'that yield subsequent commands', and turns 'a potential attacker' into 'an attacker', i.e. it removes the hedges. The 2026-08-28 fire's findings file (work/2026-08-28T0409Z-intel/findings.S3.yaml line 134) already carries the compressed wording and no verifier iteration re-checked it, so this is a paraphrase written as a quotation rather than a later page edit (the older page version cannot be retrieved to prove it; the page has no revision marker)."
  "replacement": "The field value being formatted into the shell command is not sanitized according to our analysis and could potentially include OS shell directives that yield subsequent commands controlled by a potential attacker."
  "replacement_url": "https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers"
  "fact_change": "Hedging only, no change of fact: the page states the missing sanitisation as Claroty's analytical finding ('according to our analysis') and the injection as possible ('could potentially'). The entry's evidence quote and any body prose that states the command injection flatly (CVE-2025-41451 SMTP-field shell injection) should carry that hedge. Nothing else on the page contradicts the entry."
- "entry": "2026-08-28/cve-2026-53362-linux-kernel-ipv6-udp-fraggap-kev"
  "kind": "quote"
  "quote_or_cve": "An unprivileged user can trigger this via a UDPv6 socket using MSG_MORE together with MSG_SPLICE_PAGES."
  "verdict": "false-positive"
  "evidence": "git.kernel.org sits behind an Anubis proof-of-work bot wall: `extract`, `url --direct` and the .patch and ?id= URL variants all return the 'Making sure you're not a bot!' challenge (the gate's saved body, quote-bodies/adc183d3e35b965b.extract.txt, is that challenge page), so nothing could be compared. The same commit is readable on the GitHub mirror https://github.com/torvalds/linux/commit/14200d435af9 (raw HTML via url --direct, 200; full SHA 14200d435af9a9eeb444f529fc2f689a236b7962, matching the cited short id): commit message 'ipv6: account for fraggap on the paged allocation path [ Upstream commit 736b380 ]', signed off by Sasha Levin and Greg Kroah-Hartman (a stable-tree commit), which contains the quoted sentence verbatim: \"An unprivileged user can trigger this via a UDPv6 socket using MSG_MORE together with MSG_SPLICE_PAGES.\" The same message also carries the entry's mechanism (paged-allocation branch of __ip6_append_data(), fraggap not added to alloclen, copy writes past skb->end into skb_shared_info). Gate blind spot (bot wall), not an entry defect."
  "replacement": null
  "replacement_url": "https://github.com/torvalds/linux/commit/14200d435af9"
  "fact_change": "None. (The cited kernel.org URL is correct and is the same commit; the GitHub mirror is a verification route only.)"
- "entry": "2026-08-28/cve-2026-59109-zalktis-peppol-einvoice-unauth-sqli"
  "kind": "quote"
  "quote_or_cve": "OffSeq found that Zalktis built the SQL behind those imports by pasting fields taken straight from the incoming document into the query text... No account, prior relationship or network position is needed — on the PEPPOL network anyone can address an invoice to the victim, and the only step the victim takes is importing it."
  "verdict": "not-verbatim"
  "evidence": "Live OffSeq page (fetch_source.py extract, 200; no revision marker) has both fragments in one paragraph, but with a sentence between them that the entry's quote elides behind '...': \"OffSeq found that Zalktis built the SQL behind those imports by pasting fields taken straight from the incoming document into the query text. Several of those fields are controlled by whoever sends the invoice, so a crafted invoice can break out of a string literal and run attacker-chosen SQL inside the accounting database. No account, prior relationship or network position is needed – on the PEPPOL network anyone can address an invoice to the victim, and the only step the victim takes is importing it. Zalktis Programmas fixed the issue by parameterising the queries; it is tracked as CVE-2026-59109, coordinated by CERT.LV.\" So the record is a two-sentence splice with an inserted ellipsis, and the page uses an en dash where the entry has an em dash; the letters-and-digits skeleton therefore breaks at the ellipsis. Each half is verbatim on its own; the elision does not change meaning."
  "replacement": "Either split into two evidence quotes: \"OffSeq found that Zalktis built the SQL behind those imports by pasting fields taken straight from the incoming document into the query text.\" and \"No account, prior relationship or network position is needed – on the PEPPOL network anyone can address an invoice to the victim, and the only step the victim takes is importing it.\" — or keep one contiguous quote by including the elided sentence: \"Several of those fields are controlled by whoever sends the invoice, so a crafted invoice can break out of a string literal and run attacker-chosen SQL inside the accounting database.\""
  "replacement_url": "https://offseq.com/en/research/zalktis-cve-2026-59109/"
  "fact_change": "None. Both fragments and the elided sentence say what the entry asserts (unauthenticated, invoice-borne SQL injection via PEPPOL import)."
- "entry": "2026-08-28/kaltura-mwembed-unauth-rce-file-read-no-patch"
  "kind": "quote"
  "quote_or_cve": "getFilePath() builds the on-disk destination by concatenating the cache base directory with a path derived from the uiconf_id request parameter, with no sanitisation"
  "verdict": "not-verbatim"
  "evidence": "Live AndDone post (fetch_source.py extract and raw HTML via url --direct, 200) has, in the numbered chain: '<code>kInfraFileSystemCacheWrapper::getFilePath()</code>, in <code>infra/cache/</code>, builds the on-disk destination by concatenating the cache base directory with a path derived from the <strong><code>uiconf_id</code> request parameter</strong>, with no sanitisation.' i.e. \"kInfraFileSystemCacheWrapper::getFilePath(), in infra/cache/, builds the on-disk destination by concatenating the cache base directory with a path derived from the uiconf_id request parameter, with no sanitisation.\" The entry's quote starts at 'getFilePath()' and silently drops the class qualifier and the parenthetical ', in infra/cache/,' before 'builds' (an unmarked elision), so it is not a contiguous passage (skeleton match of the entry text against the page: False; of the full sentence: True). Every other word is verbatim and the meaning is unchanged. A related sentence later on the page reads 'In infra/cache/kInfraFileSystemCacheWrapper.php, getFilePath() still concatenates dirname($key) onto the cache base folder with no realpath() containment...', which is a different statement."
  "replacement": "kInfraFileSystemCacheWrapper::getFilePath(), in infra/cache/, builds the on-disk destination by concatenating the cache base directory with a path derived from the uiconf_id request parameter, with no sanitisation."
  "replacement_url": "https://anddone-git.github.io/2026/one-parameter-two-bugs/"
  "fact_change": "None."
- "entry": "2026-08-28/kaltura-mwembed-unauth-rce-file-read-no-patch"
  "kind": "quote"
  "quote_or_cve": "Kaltura has released new patches to remediate these vulnerabilities in all affected legacy Player V2 versions."
  "verdict": "false-positive"
  "evidence": "Transport defect, not an entry defect: kb.cert.org answers with a gzip-encoded body regardless of the request, and fetch_source.py extract / url --direct hand it back undecoded (the gate's saved body quote-bodies/ed17945d1cb4c8e3.extract.txt and my own extract are gzip binary after the header), so the checker compared against garbage. Decoded with curl --compressed (desktop UA, HTTP 200, 10 172 bytes), the live note (VU#308749, Original Release Date 2026-08-25, Last Revised 2026-08-28, Document Revision 4, 'Date Last Updated: 2026-08-28 19:59 UTC') has under Solution: \"Kaltura has released new patches to remediate these vulnerabilities in all affected legacy Player V2 versions. Customers using legacy players, including self-hosted legacy player deployments (html5lib v2.x), should update to the patched version or, preferably, migrate to the newer and currently supported Kaltura Player V7 platform. Until the update is applied, users are advised to restrict or disable access to the mwEmbedLoader.php endpoint.\" The quote is verbatim (skeleton match True). Same page also says 'only versions of the legacy player (Player V2) are vulnerable; these issues do not affect any versions of the currently supported Kaltura Player V7' and 'Vendor Statement: We have not received a statement from the vendor.' Note the note's Original Release Date is 2026-08-25 while the entry's source record dates it 2026-08-26 (one-day drift; possibly a timezone artifact, and the AndDone post is dated 2026-08-26)."
  "replacement": null
  "replacement_url": "https://kb.cert.org/vuls/id/308749"
  "fact_change": "None for the quote. (Side note: fetch_source.py does not gunzip this host's responses; worth a tooling fix: `Accept-Encoding: identity` or decompress on Content-Encoding/magic bytes. Also the CERT/CC record lists CERT/CC's notification of Kaltura as 2026-07-08 and the vendor status as Unknown.)"
- "entry": "2026-08-28/kudelski-bismarck-dprk-it-worker-gambling-fakecalls-overlap"
  "kind": "quote"
