- id: cisa-advisories
  diagnosis: "In-container, every transport fails for the recorded surfaces: direct GET of https://www.cisa.gov/cybersecurity-advisories/all.xml, /news.xml, /sitemap.xml, the bare cisa.gov host and /.well-known/csaf/provider-metadata.json all return HTTP 403 'Access Denied' (Akamai, ~380-430 B, 'Reference #18.…'); `extract`, `url`, `feed` and `cisa feed|page` fall through to the jina reader, which returns HTTP 402 on all 7 keys plus the anonymous tier, so the probe read 0 alnum (unreadable, class reader-quota). Free in-container substitutes that DO work: `cisa csaf-recent 10` (cisagov/CSAF mirror on raw.githubusercontent.com: 3,944 ICS/OT advisories, newest icsa-26-272-07 … icsa-26-272-01 all released 2026-09-29, then icsa-26-267-02/01 on 2026-09-24), `cisa-kev` (static feed, 1,758,918 B, catalogVersion 2026.09.29), and the IT-side CSAF index https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/changes.csv (CISA vulnerability advisories VA-26-267-01 on 2026-09-24 … VA-26-183-01; no subcommand yet). Wayback has no snapshot, govdelivery public archive 404s, third-party fetch proxies (allorigins/corsproxy/archive.ph) are refused. NEW, agent-side: the harness WebFetch tool (not reachable from fetch_source.py) is NOT blocked today: 7 of 7 calls succeeded on cisa.gov across the three CISA records (feeds, JS-hydrated listings, detail pages) — all.xml (ICS advisories icsa-26-272-02..06 dated 2026-09-29), the /news-events/cybersecurity-advisories listing hydrated with 10 dated items (KEV alerts 2026-09-18…09-29; 'Critical Zero-Day Vulnerabilities Exploited in Citrix NetScaler ADC, Gateway' 2026-09-27), /news.xml, /news-events/news and detail pages — contradicting the recorded 'WebFetch reliably 403' (last re-confirmed 2026-05-08)."
  root_cause: "anti-bot 403 (Akamai) on every in-container transport with the jina reader pool empty (HTTP 402) — a transport/quota problem, not a dead or moved source. The content check reads the JS/403 page (fetch_method bridge is not run through the documented `cisa feed` command). Agent-side WebFetch currently passes."
  fix:
    fetch_method: webfetch
    health_cmd: ["cisa", "csaf-recent", "10"]
  verified: "python3 tools/fetch_source.py cisa csaf-recent 10 -> total 3944, 10 items, newest icsa-26-272-07 / icsa-26-272-06 / icsa-26-272-05 (released 2026-09-29T06:00Z), oldest of the 10 icsa-26-267-01 (2026-09-24); tools/source_health._content_assess simulated with that health_cmd -> relevant (structured-results branch; NOTE newest_item null because ISO 'T' timestamps are not matched by _dates_in). WebFetch https://www.cisa.gov/cybersecurity-advisories/all.xml -> 6 items: 'Viidure Dashcam Android Application' (icsa-26-272-07), 'MikroTik RouterOS' (icsa-26-272-06), 'Anjvision YSSD-RTMP-H5', 'Baicells Nova 430H', all 'September 29, 2026' (matches the CSAF index ids); WebFetch https://www.cisa.gov/news-events/cybersecurity-advisories -> 10 dated items, first 'CISA Adds One Known Exploited Vulnerability to Catalog' (Sep 29, 2026, https://www.cisa.gov/news-events/alerts/2026/09/29/cisa-adds-one-known-exploited-vulnerability-catalog). `python3 tools/fetch_source.py cisa feed https://www.cisa.gov/cybersecurity-advisories/all.xml 5` -> 7x jina 402 then failure (expected)."
  notes_append: "2026-09-29: in-container reads of cisa.gov are impossible without reader credit (Akamai 403 on all UAs; jina 402), BUT the agent-side WebFetch tool reached all.xml, the JS-hydrated /news-events/cybersecurity-advisories listing (10 dated items) and detail pages 5/5 times today — use WebFetch (outbound-links template) first for the listing/feed and item pages; `cisa csaf-recent N` (+ `cisa csaf <id>`) for ICS/OT advisories and `cisa-kev` need no reader; joint AA-series advisories are also mirrored by the co-signing agencies (NSA media.defense.gov, IC3, NCSC-UK, ASD). Health check: in-container command `cisa csaf-recent 10` proves the free mirror path only (partial: ICS advisories); the AA-series/alerts surface is agent-WebFetch-only. Re-sample WebFetch on the next fire before rewriting the CLAUDE.md 'never WebFetch CISA' rule."
  recommendation: review
- id: cisa-directives
  diagnosis: "Same Akamai/jina-402 condition as cisa-advisories: in-container `cisa page https://www.cisa.gov/news-events/directives`, extract and url --direct return nothing (403, then 402 on every reader key) => unreadable. The agent-side WebFetch tool reads it fine today: the listing returned six directive entries (ED 25-03 V1 Identify and Mitigate Potential Compromise of Cisco Devices; ED 25-03 Supplemental: Core Dump and Hunt Instructions; ED 26-03 V1 Mitigate Vulnerabilities in Cisco SD-WAN Systems; BOD 26-04 Prioritizing Security Updates Based on Risk (revokes BOD 19-02 and BOD 22-01) plus its Implementation Guidance; BOD 26-02 Mitigating Risk From End-of-Support Edge Devices) with per-directive paths /news-events/directives/<slug>, and a detail page (https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk) returned 'Issue Date: June 10, 2026' and the requirements summary. The listing itself carries NO per-item dates (also true of the reader-rendered listing per the 2026-08-04 note), so dating needs the detail page. Free discovery leads for new directives: Google News RSS query site:cisa.gov/news-events/directives (titles + dates only; BOD 26-04 2026-06-10, ED 26-03 2026-03-11, ED 25-03 supplemental 2025-09-25 — links are Google redirect URLs, not citable) and the KEV feed/cisa-news (new directives are announced in news.xml)."
  root_cause: "anti-bot 403 (Akamai) on every in-container transport + empty jina pool (transport problem, not a moved/dead listing); additionally a low-cadence source: directives arrive roughly quarterly (ED 25-03 supplemental 2025-09-25, ED 26-03 2026-03-11, BOD 26-04 2026-06-10) so the default 60-day staleness limit would flag it even when readable, and the listing exposes no dates for the check to read"
  fix:
    fetch_method: webfetch
    max_staleness_days: 180
  verified: "WebFetch https://www.cisa.gov/news-events/directives -> six directives listed with paths (e.g. '/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk', '/news-events/directives/v1-ed-26-03-mitigate-vulnerabilities-cisco-sd-wan-systems'), no dates on the page; WebFetch https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk -> 'BOD 26-04: Prioritizing Security Updates Based on Risk', 'Issue Date: June 10, 2026'. In-container: `python3 tools/fetch_source.py cisa page https://www.cisa.gov/news-events/directives` -> jina 402 on all keys (expected); no free in-container transport exists, so no health_cmd is proposed (a proxy command would only hide the reader outage)."
  notes_append: "2026-09-29: cisa.gov directives listing is unreadable in-container (Akamai 403 + jina 402) but the agent-side WebFetch tool reads the listing and the per-directive pages (listing: ED 25-03 V1/Supplemental, ED 26-03 V1, BOD 26-04 + Implementation Guidance, BOD 26-02; no dates on the listing — take the issue date from the detail page, e.g. BOD 26-04 = 2026-06-10). Cadence is roughly quarterly (ED 25-03 suppl. 2025-09-25, ED 26-03 2026-03-11, BOD 26-04 2026-06-10), so max_staleness_days 180. New directives are also announced in the cisa-news feed and KEV."
  recommendation: review
