- entry: "2026-07-31/unit42-autonomous-deepseek-hermes-netscaler-cve-2026-3055"
  quote: "Across all the exploitation attempts, both autonomous and manual, Unit 42 was on"
  verdict: not-verbatim
  evidence: "Page (work/page-checks-v2/quote-bodies/5a8fd33cd11f1d85.extract.txt line 177 and raw HTML): \"Across all the exploitation attempts, both autonomous and manual, Unit 42 confirmed data exfiltration from three Citrix NetScaler targets (CVE-2026-3055) and command execution on 11 Marimo notebook endpoints (CVE-2026-39987). However, we reviewed evidence of batch exploitation against an unknown number of hosts that were listed in a file deleted by the actor prior to our analysis.\" The phrase 'was only able to confirm three targets were successfully exploited' appears nowhere on the page. The entry's own 2026-08-02 correction section calls this sentence one 'Unit 42 did not write', yet the evidence[] record was left in place (the correction's `fields` list names evidence, but the fabricated record is still first in the list; the corrected sentence was appended as a fourth record instead of replacing it)."
  replacement: "Across all the exploitation attempts, both autonomous and manual, Unit 42 confirmed data exfiltration from three Citrix NetScaler targets (CVE-2026-3055) and command execution on 11 Marimo notebook endpoints (CVE-2026-39987)."
  replacement_url: "https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/"
  fact_change: "The entry states, via this quote, that Unit 42 could confirm only three exploited targets across all attempts. The page confirms three NetScaler exfiltration targets AND command execution on 11 Marimo endpoints; 'only able to confirm three' is an editorial limit the source does not make."
  other_notes: "Replacement text is already evidence record 4 of this entry, so the fix is to delete this first record rather than replace it. Residual contradiction elsewhere in the entry that the 2026-08-02 correction did not clean up: (a) main-analysis paragraph (entry line ~296): \"Unit 42 states it could confirm only three successful exploitations across every attempt, autonomous and manual, and identifies those three as the Citrix NetScaler cases\" repeats the unsupported claim; (b) frontmatter summary (\"The three confirmed compromises came from the operator's own manual work against Citrix NetScaler ADC/Gateway\"), headline and title still frame three confirmed compromises, while the correction section says impact was understated (three NetScaler targets plus 11 Marimo endpoints). Note the page does itself say 'The three successful exploitations had memory data exfiltrated through the Citrix NetScaler out-of-bounds memory read vulnerability', so 'three NetScaler exfiltrations' is supported; 'only three across everything' is not."
