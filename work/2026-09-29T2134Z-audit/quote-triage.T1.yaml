- entry: "2026-07-14/microsoft-july-2026-patch-tuesday-two-exploited-zero-days"
  quote: "CISA is aware of active exploitation of vulnerabilities CVE-2026-32201, CVE-2026"
  verdict: page-revised
  evidence: "Transport: cisa.gov 403s the bridge (`cisa page`, `url --direct`, `extract`), jina keys all exhausted (HTTP 402), so the gate never had the page and could only compare against the KEV JSON. Read the live page through WebFetch (summariser, asked twice for character-for-character text, identical both times; the WebSearch snippet for the alert agrees). Current paragraph: \"CISA is aware of active exploitation of vulnerabilities CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, CVE-2026-58644, CVE-2026-50522, and CVE-2026-55040, enabling cyber threat actors to gain unauthorized access to on-premises SharePoint Server instances.\" The list has grown from four to six CVEs through the alert's later update notes (CVE-2026-50522 added to KEV 2026-07-22, CVE-2026-55040 added 2026-08-18). The four-CVE wording in the quote is what the alert carried on 2026-07-16 to 07-22; the 2026-07-19 weekly verifier (work/2026-07-19T2310Z-weekly/verification.iter2.md and iter4.md) recorded it verbatim then. The tail of the sentence is unchanged."
  replacement: "enabling cyber threat actors to gain unauthorized access to on-premises SharePoint Server instances."
  replacement_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
  fact_change: null
  other_notes: "The same four-CVE sentence is also quoted inline in the body, in the 2026-07-17 update section (entry line ~471: CISA 'is aware of active exploitation of vulnerabilities CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, and CVE-2026-58644, enabling ...'), so that in-text quotation is equally stale against the live page. No fact the entry states is wrong (that section is explicitly dated as of 2026-07-16 and this same entry's later sections already cover CVE-2026-50522 and CVE-2026-55040); fix by shortening the quote to the unchanged fragment above, or by quoting the current six-CVE sentence and dropping the 'as it stood on 2026-07-16' framing. A quote-as-of-date qualifier in the lead-in would also work."
- entry: "2026-07-14/microsoft-july-2026-patch-tuesday-two-exploited-zero-days"
