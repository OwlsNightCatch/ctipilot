- entry: "2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally"
  quote: "This brings the number of publicly confirmed downstream organizations tracked by"
  verdict: page-revised
  evidence: "Current page (work/page-checks-v2/quote-bodies/72fcde761b196e78.extract.txt line 37 and raw HTML): \"The Metabase vulnerability has already been tied to fifteen publicly confirmed incidents:\" followed by a linked list (n8n, Framework, Tally, Kilo Code, Stocksy United Co-op, ShipMonk, Checkly, Cypress.io, Bits of Gold, Privy, Paradigm Connect Asia, Statista, Dodo Payments, Marsello, LEGO Certified Stores South Africa). The sentence 'This brings the number ... to nine' and the word 'nine' no longer occur anywhere on the page (page metadata date still 2026-08-10). The 2026-08-24 audit (work/2026-08-24T0902Z-audit/truth-B9.yaml) verified the sentence verbatim on the 2026-08-17 version, so the tracker was revised after that. The page also now adds a 'Dire Wolf Activity' section: VenariX 'confirmed that Dire Wolf, a ransomware and data extortion threat actor, exploited CVE-2026-72898 in at least two incidents involving self-hosted Metabase deployments' and 'suspects the group may have targeted fourteen additional companies'."
  replacement: "The Metabase vulnerability has already been tied to fifteen publicly confirmed incidents:"
  replacement_url: "https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"
  fact_change: "The entry states VenariX counts nine publicly confirmed downstream organizations (frontmatter updates[] summary of 2026-08-19: 'now counts nine publicly confirmed organisations'; body ~line 242 quotes the sentence). That was true on 2026-08-17 and the entry dates it; the live page now says fifteen, so the quote (and the 'nine' figure attributed to the tracker as it stands) no longer match the source. Not a wrong claim as of the dated update, but the quotation cannot be re-verified against the URL."
  other_notes: "Options: keep the quote and add a 'as of 2026-08-17' qualifier plus note the tracker now reads fifteen (a further changelog update), or replace with the current sentence. The entry does not mention Dire Wolf at all (0 occurrences); the VenariX page now attributes CVE-2026-72898 exploitation of self-hosted instances to Dire Wolf. That is an actor attribution by a single commercial tracker and would need its own source check before use."
- entry: "2026-08-28/manchester-airports-group-data-breach-8-7-million"
  quote: "Manchester Airports group has been subject to a cyber security incident by an un"
  verdict: wrong-page
  evidence: "The cited help page (https://www.manchesterairport.co.uk/help/data-security-incident/, fresh extract and gate copy agree) now reads: \"In August 2026 Manchester Airports Group (MAG) was subject to a cyber security incident by an unauthorised third party. A quantity of customer data was obtained that relates to car park, lounge and Fast Track bookings and in-airport WIFI sign-ups at Manchester, London Stansted, and East Midlands airports.\" (reworded: 'In August 2026 ... (MAG) was subject', 'was obtained', 'London Stansted'). The quote's exact wording is the spokesperson statement on MAG's media-centre page https://mediacentre.magairports.com/mag-statement-on-cyber-security-incident/ (dated 2026-08-27): \"A MAG spokesperson said: \"Manchester Airports group has been subject to a cyber security incident by an unauthorised third party. A quantity of customer data has been obtained that relates to car park, lounge and Fast Track bookings and in-airport WIFI sign-ups at Manchester, Stansted and East Midlands airports.\" (only the Oxford comma before 'and East Midlands' differs, which the letters-and-digits comparison ignores). CX Today (2026-08-27) quotes the same 'has been obtained ... Manchester, Stansted and East Midlands airports' wording and links that media-centre URL, so the help page was evidently revised after the first fire (the original fire saved no copy of it)."
  replacement: "Manchester Airports group has been subject to a cyber security incident by an unauthorised third party. A quantity of customer data has been obtained that relates to car park, lounge and Fast Track bookings and in-airport WIFI sign-ups at Manchester, Stansted and East Midlands airports."
  replacement_url: "https://mediacentre.magairports.com/mag-statement-on-cyber-security-incident/"
  fact_change: null
  other_notes: "Fix: either add the media-centre URL to sources[] and cite it for this quote (the quote is verbatim there), or replace the quote with the help page's current sentence: \"In August 2026 Manchester Airports Group (MAG) was subject to a cyber security incident by an unauthorised third party. A quantity of customer data was obtained that relates to car park, lounge and Fast Track bookings and in-airport WIFI sign-ups at Manchester, London Stansted, and East Midlands airports.\" The other quoted MAG sentence in the entry ('At no point has passenger safety or aviation security been compromised.') is on both pages. Body ~line 142 puts 'an unauthorised third party' and 'a quantity of customer data' in quotation marks; both fragments are present on both versions."
