  replacement: "CISA has updated this Alert to reflect the addition of CVE-2026-58644 to its KEV Catalog on July 16, 2026."
  replacement_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
  fact_change: null
  other_notes: "No fact change: CVE-2026-58644 KEV addition on July 16, 2026 is confirmed by the current page. Wording-only revision."
