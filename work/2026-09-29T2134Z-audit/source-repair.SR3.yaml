- id: wordpress-org-news
  diagnosis: "Recipe healthy: `feed https://wordpress.org/news/feed/ 30` -> method=direct, 10 items, 5.8 KB JSON (3,350 alnum), newest 2026-09-22 (7 d). Verdict 'irrelevant' arises only because the release-announcement excerpts use a narrow vocabulary: the probe matched exactly 2 distinct security terms ('security', 'vulnerab'; RELEVANCE_MIN is 3). The content itself is squarely relevant - 4 of the 10 items are core security releases (plus the 7.1 major release): WordPress 7.1.2 (2026-09-22, 'a fix for a critical severity security vulnerability'), 7.1.1 Maintenance and Security Release (2026-09-17, 11 security fixes), 7.0.4 (2026-08-12), 7.0.3 (2026-08-06), the rest are community/AI/events posts. A security-specific feed exists and works: https://wordpress.org/news/category/security/feed/ (10 items, 5.7 KB, newest 2026-09-22; 7.1.2, 7.1.1, 7.0.4, 7.0.3, 7.0.2 then 2026-05-27, 2026-03-10, 2025-06-19...); the same probe still says 'irrelevant' on it (also 2 terms, 3,141 alnum), and the category page https://wordpress.org/news/category/security/ (extract, 5,342 alnum) gives the same 2 terms - so no URL change flips the verdict."
  root_cause: "tool false positive (mixed project-news feed): vendor release-announcement feed with a narrow security vocabulary ('security release' / 'vulnerability') trips the >=3-distinct-terms relevance rule; not a general-news feed problem (4 of 10 items are security releases), no shell, no staleness (7 d)."
  fix:
    content_scope: general-news
  verified: "python3 tools/fetch_source.py feed https://wordpress.org/news/feed/ 30 -> direct, 10 items, newest Tue 22 Sep 2026 'WordPress 7.1.2 Release' https://wordpress.org/news/2026/09/wordpress-7-1-2-release/ (summary: 'This security release features a fix for a critical severity security vulnerability'); 2nd 'WordPress 7.1.1 Maintenance and Security Release' https://wordpress.org/news/2026/09/wordpress-7-1-1-maintenance-and-security-release/. `extract` of the 7.1.2 post -> clean body: 'an unauthenticated attacker can, under certain conditions, make page template resolution include a chosen readable local PHP file outside the active theme directories ... this can lead to remote code execution (RCE)', credit Robert Ressl (ressl.ch). Real source_health._content_assess on the record as-is, on the security-category feed, and on the category page: all verdict=irrelevant, terms=[security,vulnerab], newest 2026-09-22. With the fix (content_scope=general-news, which sets min_terms=1) the same call returns verdict=relevant, transport=feed, alnum=3,350, terms=[security,vulnerab], newest 2026-09-22 (7 d). The scope label is a slight stretch (this is the WordPress project news blog - community, events, AI, roadmap posts plus the core security releases - not a general outlet), used because it is the only existing override that lowers the term floor; a dedicated per-source min_terms override would be more exact."
  coverage_flag: "Incidental: no entry in entries/ mentions WordPress 7.1.2 (2026-09-22, critical, unauthenticated local-PHP-file-inclusion -> RCE via page template resolution) or 7.1.1 (2026-09-17, 11 security fixes) - last_successful_fetch on this record is 2026-09-13, i.e. the feed has not been swept since before either release. WordPress core is a high-relevance product for the Swiss/EU public-sector estate."
  notes_append: "2026-09-29: content check said 'irrelevant' - false positive: feed https://wordpress.org/news/feed/ is healthy (10 items, newest 2026-09-22) and 4 of its 10 items are core security releases (7.1.2 critical RCE fix 2026-09-22, 7.1.1 2026-09-17), but the release excerpts only ever use the words 'security'/'vulnerability' (2 distinct terms < RELEVANCE_MIN 3). Security-only feed also works: https://wordpress.org/news/category/security/feed/ (release posts only, ~1-5 week cadence but a 4-month gap 2026-03-10 -> 2026-07-17, so it would need max_staleness_days >= 120 if adopted); kept the general feed as superset. Recipe unchanged: feed -> extract <release post URL>. Set content_scope general-news (lowers the relevance term floor to 1) so the check stops flagging this narrow-vocabulary feed."
  recommendation: fix
