- id: malware-news
  diagnosis: "Recipe (webfetch/extract of https://malware.news) returns a JS shell: `extract https://malware.news` = 528 bytes (front-matter + a paragraph naming the RSS URLs of the pinned welcome topic, ~333 alnum); `url --direct` = 197 KB Discourse Ember-app HTML whose topic list lives in script/JSON preload (stripped by the probe), so no readable listing text. Host is reachable (HTTP 200, no challenge)."
  root_cause: "JS SPA (Discourse Ember app) - the homepage listing is client-rendered; the site itself publishes native Discourse RSS feeds (pinned welcome topic even names them: /latest.rss, /c/news.rss, /c/malwareanalysis.rss). Content health check false-positive on the recipe, not a dead source."
  fix:
    fetch_method: rss
    rss_url: "https://malware.news/latest.rss"
  verified: "python3 tools/fetch_source.py feed https://malware.news/latest.rss 15 -> method=direct, 15 items, 104,308 bytes JSON (~55k alnum of titles+summaries), newest 2026-09-29T19:50:39Z ('TeamViewer security advisory (AV26-977)'), 2nd 'CVE-2026-85706: Critical GitLab Unauthenticated Arbitrary File Read Vulnerability (CVSS 10.0)' https://malware.news/t/cve-2026-85706-critical-gitlab-unauthenticated-arbitrary-file-read-vulnerability-cvss-10-0/125984. Drill-down: python3 tools/fetch_source.py extract <that /t/ URL> -> trafilatura-direct, full body incl. syndicated text (affiliate 'MWNEWS10' block interleaved, as the record already warns). Category feeds also work: /c/news.rss (25 items, 192 KB), /c/malwareanalysis.rss (25 items, newest 2026-09-29)."
  notes_append: "2026-09-29: content check flagged the homepage as a JS shell (Discourse Ember app; extract 528 B). Working recipe: python3 tools/fetch_source.py feed https://malware.news/latest.rss 15 (native Discourse RSS, 15 items, newest same day, direct transport, no reader needed), then extract <item /t/<slug>/<id> link> for the full syndicated body. Category-scoped feeds: /c/news.rss, /c/malwareanalysis.rss. fetch_method webfetch -> rss."
  recommendation: fix
- id: nl-times
  diagnosis: "Recipe works but is the wrong shape: `feed https://nltimes.nl/rss.xml 30` -> method=direct, 10 items (4.5 KB JSON, ~2,079 alnum), newest 2026-09-29 22:00 (dates as 'DD Month YYYY - HH:MM'). The 10 items are general Dutch news (elderly falls, weather, Schiphol, wealth tax, asylum policy) and span only ~7.5 hours (22:00 back to 14:30 the same day), with a single security story ('ShinyHunters suspect conspired to commit two murders, Dutch police claim'); the 09:30 ShinyHunters/Odido story from the same day had already rolled out of the feed. The probe matched 0 security terms -> 'irrelevant'. /rssfeed2 and /rssfeedalt (advertised in the homepage <link rel=alternate>) are the identical 10-item general feed; /categories/tech, /categories/crime and tag pages advertise only that same global feed - there is NO security-specific RSS. NB the tool's new content_scope=general-news override (min_terms 1) does NOT rescue the feed on its own: real _content_assess with content_scope=general-news is still 'irrelevant' today because the feed has zero terms."
  root_cause: "general-news feed - correct behaviour for a general outlet (~1 security story per 10 items), and additionally a 10-item / ~8 h feed window that under-covers a multi-hour or daily fire. Not a shell, not dead; newest item is today. Security-specific server-rendered tag listings exist (no feed) and are the better collection path."
  fix:
    fetch_method: bridge
    url: "https://nltimes.nl/tags/data-breach"
    max_staleness_days: 90
    content_scope: general-news
  verified: "python3 tools/fetch_source.py extract https://nltimes.nl/tags/data-breach -> trafilatura-direct, ~3.1 KB of dated headlines (22 items back to 2025-08), newest '29 September 2026 - 09:30' 'ShinyHunters says suspect arrested for Odido attack not affiliated with hacker group', then '8 September 2026' 'ShinyHunters lawyer up after police release audio clip of suspect in Odido hack', '6 August 2026' 'Bol follows De Bijenkorf in warning of data breach as leaked data appears on dark web'; `url https://nltimes.nl/tags/data-breach --direct` = 90,286 B server-rendered HTML. Real tools/source_health.py _content_assess with the fix (fetch_method=bridge, url=/tags/data-breach, content_scope=general-news, max_staleness_days=90): verdict=relevant, transport=extract+direct, alnum=5,393, terms=[attack,breach,cyber,hacker,threat], newest 2026-09-29 (0 d). Companion listing https://nltimes.nl/tags/cybersecurity (extract: ~24 dated headlines, newest 2026-09-25 'Individuals sent ransom notes after cybercriminals steal Flink customer & worker data', also 2026-09-24 'Dutch intelligence services warn AI is making cyberattacks faster and easier') assesses relevant too (8 terms). Both tag slugs were taken from the href list of a fetched article page. Article drill: extract <article URL> returns title, date and tags ('ShinyHunters','Odido','hack','data breach',...). Feed remains available as a secondary: python3 tools/fetch_source.py feed https://nltimes.nl/rss.xml 30 (rss_url left in place)."
  notes_append: "2026-09-29: content check said 'irrelevant' on https://nltimes.nl/rss.xml - the feed is healthy but general-news (10 items spanning only ~7.5 h, 1 security story; /rssfeed2 and /rssfeedalt are the same feed; no section or tag RSS exists). content_scope=general-news alone still yields 'irrelevant' on a zero-term feed day. Working security-targeted recipe: python3 tools/fetch_source.py extract https://nltimes.nl/tags/data-breach (server-rendered, dated headlines back weeks; breach disclosures) and https://nltimes.nl/tags/cybersecurity (NCSC/AIVD/regulator warnings), then extract the article URL; both read cleanly with trafilatura-direct. fetch_method rss -> bridge, url -> the data-breach tag listing, content_scope general-news, max_staleness_days 90 (data-breach tag cadence has gaps up to ~54 d). rss_url kept as a secondary."
  recommendation: fix
- id: oneconsult-ch
  diagnosis: "Recipe (extract/direct of https://www.oneconsult.com/en/blog/) returned the Imunify360 bot-protection wall in this run: `extract` = 199 bytes 'One moment, please... Please wait while your request is being verified...'; `url --direct` = 107-byte JSON 'Access denied by Imunify360 bot-protection. IPs used for automation should be whitelisted' (also on /robots.txt and the site root). The block is INTERMITTENT per request, not per path: 6 spaced retries of /en/feed/ alternated (denied, OK, denied, OK, denied, denied); a later batch of 8 feed calls gave 5 OK / 3 FAIL (HTTP 415 or the denial JSON). The same listing URL /en/blog/ returned the full page on one extract and the challenge on the next."
  root_cause: "challenge page (Imunify360 bot-protection, intermittent by egress IP/request; a transport problem, not a dead source). The site is a healthy WordPress install that advertises a working RSS feed."
  fix:
    fetch_method: rss
    rss_url: "https://www.oneconsult.com/en/feed/"
    max_staleness_days: 90
  verified: "python3 tools/fetch_source.py feed https://www.oneconsult.com/en/feed/ 30 -> method=direct, 10 items, 9,950 bytes JSON, newest 2026-09-08 12:16Z 'Dynamic Application Security Testing (DAST): Working Principals, Benefits, and Limitations'; 2nd 2026-08-26 'Race Conditions - Why Temporal Concurrency Can Lead to Real Security and Business Risks'; also 2026-06-29 'BravoX: New Ransomware Threat in the DACH Region' (DFIR post). English blog-only feed (the un-prefixed /feed/ mixes German blog + career postings). Feed URL taken from the <link rel=alternate type=application/rss+xml> on https://www.oneconsult.com/en/. Running the real tools/source_health.py _content_assess against the fixed record (fetch_method=rss, max_staleness_days=90): verdict=relevant, transport=feed, alnum=6017, terms=[attack,cyber,incident,ransomware,security,threat,vulnerab], newest 2026-09-08 (21 d) - 2 of 3 runs; the third hit the Imunify wall on the feed, fell through to the page and reported 'stale' (newest 2025-10-14 read from the wrong page), so the check can flap. Article drill: `extract https://www.oneconsult.com/en/blog/penetration-testing/dynamic-application-security-testing-dast-working-principals-benefits-and-limitations/` -> 11,907 bytes clean markdown on 3 of 4 tries."
  notes_append: "2026-09-29: content check saw the Imunify360 anti-bot wall on /en/blog/ (extract 199 B 'One moment, please...'; direct JSON 'Access denied by Imunify360'). The wall is intermittent per request (roughly 5 of 8 feed fetches pass from this egress), never path-specific. Working recipe: python3 tools/fetch_source.py feed https://www.oneconsult.com/en/feed/ 30 (English blog-only WordPress RSS, newest 2026-09-08, ~monthly cadence, longest observed gap 48 d) - RETRY 3-4x a few seconds apart on 'Access denied'/HTTP 415 before logging a failure - then extract <item link> (same retry). Set rss_url, fetch_method webfetch -> rss, max_staleness_days 90. /feed/ (no /en/) mixes German blog with careers posts; do not use."
  recommendation: fix
- id: paradigm-shift-research
  diagnosis: "https://ps.tc/ returns a 962-byte meta-refresh shell (`<meta http-equiv=refresh content='0; url=pages/home.html'>` + `<script src=app.js type=module>`); /sitemap.xml and /robots.txt return the same 962-byte shell (no sitemap, no feed). The site is NOT a client-rendered SPA below the root: https://ps.tc/pages/home.html (18,773 B) and the blog listing https://ps.tc/pages/blog.html (4,919 B) are static server-rendered HTML; app.js -> js/blog.js only runs scroll animations. The blog listing currently contains exactly ONE card: 'Unavailable / This page is taking an unexpected detour...' (<time datetime=2026-07-23>) linking to blog-unavailable.html ('The blogpost is currently unavailable'). The one known technical post https://ps.tc/pages/blog-usbliter8.html (usbliter8 SecureROM exploit, published 2026-06-18 per THN/SecurityWeek) now serves the same 'Unavailable' page (extract = 335 B). Probe extract of the root = 630 alnum, 0 security terms."
  root_cause: "dead-content / site changed: root is a meta-refresh shell (tool false-positive on the URL) AND the blog itself has been pulled - the post grid was replaced by a single placeholder on 2026-07-23, so there is no security content to read on any transport. The prior notes' 'client-side-rendered SPA, no content recoverable' diagnosis is wrong: the static pages are readable; there is simply nothing in them."
  verified: "python3 tools/fetch_source.py url https://ps.tc/pages/blog.html --direct -> 4,919 B, one latest-article-card ('Unavailable', 2026-07-23); python3 tools/fetch_source.py extract https://ps.tc/pages/blog-usbliter8.html -> 335 B 'Unavailable ... The blogpost is currently unavailable', date 2026-07-23; url https://ps.tc/sitemap.xml --direct -> 962 B root shell. WebSearch confirms the usbliter8 work was public 2026-06-18 (https://thehackernews.com/2026/06/unpatchable-usbliter8-exploit-breaks.html), i.e. the write-up existed and has since been withdrawn from ps.tc. Only ps.tc/pages/blog.html would ever list posts if the blog returns (no feed)."
  notes_append: "2026-09-29: recipe repair - root https://ps.tc/ is a 962 B meta-refresh shell to pages/home.html, but pages/*.html are static (not an SPA). The blog listing https://ps.tc/pages/blog.html is server-rendered and now shows a single 'Unavailable' placeholder dated 2026-07-23; the usbliter8 post URL serves the same placeholder, so the blog has been pulled. No feed or sitemap exists. Nothing to fetch; if the blog returns, the working listing URL is https://ps.tc/pages/blog.html (direct/extract). Candidate with one prior contribution, niche offensive research, no feed, content withdrawn - drop-candidate."
  recommendation: drop-candidate
- id: ssd-disclosure
  diagnosis: "Every container-side transport is walled: `url --direct` on /, /feed/, /sitemap.xml, /wp-sitemap.xml, /advisories/ and the WP REST posts endpoint all exit rc=1 with 'upstream HTTP 202' (0 bytes); a raw curl shows the response: HTTP/2 202, `sg-captcha: challenge`, 169-byte body `<meta http-equiv=refresh content=0;/.well-known/sgcaptcha/?r=%2F&y=ipr:<egress IP>:<ts>>` - i.e. the SiteGround captcha is keyed on the caller's IP reputation (the `ipr:` token), not on the path or UA. `extract` therefore yields nothing (probe: content_alnum 0, class reader-quota); `jina` fails on every key (`jina-usage`: 7 keys, live_key_count 0, HTTP 402). BUT the agent-side WebFetch tool (a different egress) reads the site normally: https://ssd-disclosure.com/advisories/ returned the 10 newest advisories with titles + article links, and the article pages carry dates and technical bodies."
  root_cause: "challenge page (SiteGround sg-captcha keyed on egress-IP reputation) for the container egress plus an exhausted reader pool; the health check only exercises fetch_source.py (container egress), so 'unreadable' is a tool/environment limitation, not a dead or changed source."
  fix:
    fetch_method: webfetch
    url: "https://ssd-disclosure.com/advisories/"
    max_staleness_days: 90
  verified: "WebFetch https://ssd-disclosure.com/advisories/ (outbound-links template) -> 10 advisories, newest first: 'DCOM Service PsmServiceExtHost LPE' https://ssd-disclosure.com/dcom-service-psmserviceexthost-lpe/ ; 'UNISOC T612 LPE' https://ssd-disclosure.com/unisoc-t612-lpe/ ; 'Linux Bridge STP Timer Use-After-Free' https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/ ; ... The listing shows NO dates; dates come from the article pages (WebFetch each): DCOM PsmServiceExtHost LPE = September 10, 2026 (CVE-2026-69459, heap overflow in PsmServiceExtHost.dll CrmStateMonitorStateSet, TyphoonPWN 2026 Windows LPE 3rd place), UNISOC T612 LPE = August 17, 2026, Linux Bridge STP UAF = August 5, 2026 (cadence ~2-3 weeks; newest 19 days old). Homepage shows only the newest 3 advisories, so use /advisories/. WebFetch on /feed/ and /advisories/feed/ returned the homepage HTML (no usable feed); no sitemap is reachable. The container-side probe cannot reproduce this: `python3 tools/fetch_source.py url https://ssd-disclosure.com/advisories/ --direct` -> HTTP 202 (rc=1, 0 bytes), `jina https://ssd-disclosure.com/` -> HTTP 402 on all 7 keys."
  notes_append: "2026-09-29: container egress gets the SiteGround sg-captcha challenge (HTTP 202, header `sg-captcha: challenge`, meta-refresh to /.well-known/sgcaptcha/ with an ipr:<egress-IP> token) on every path, and the reader pool is exhausted (402) - but agent-side WebFetch reads https://ssd-disclosure.com/advisories/ (10 newest advisory titles + links) and each article page (date, CVE, body) cleanly. Working recipe: WebFetch /advisories/ for the listing (undated), then WebFetch each advisory URL for its date and technical detail; fetch_method jina -> webfetch. Cadence ~2-3 weeks (2026-08-05, 08-17, 09-10). No feed/sitemap reachable. NOTE: tools/source_health.py content check exercises only fetch_source.py, so it will keep reporting unreadable/reader-quota for this host from the container; a false positive while WebFetch works."
  recommendation: fix
- id: swarmcha-se
  diagnosis: "Not a shell: https://swarmcha.se/ is a complete server-rendered static blog index with exactly three posts. `extract https://swarmcha.se/` = 358 B (title 'posts' + 3 date/title pairs); `url --direct` = 896 B of hand-written HTML (`<ul class=posts>` with <time datetime=...> + <a href=/posts/...>). All three posts are dated inside the window (2026-09-26, 2026-09-23, 2026-09-22; newest 3 days old). The probe's 'shell' verdict comes solely from the 600-alnum floor (407 alnum) on an index that is legitimately tiny. Every post page is rich: `extract https://swarmcha.se/posts/openai-unctad` = 25,756 B (title, author Rowan H-J, date 2026-09-26, 'OpenAI agents scanned UNCTAD's API ~16,500 times...'), /gamesmanship = 11,798 B (2026-09-23), /posts/openai-swarm-budget-table = 9,529 B (2026-09-22). No feed or sitemap exists (feed.xml, rss.xml, atom.xml, feed, index.xml, sitemap.xml, robots.txt all HTTP 404; no <link rel=alternate> in the head)."
  root_cause: "tool false positive: a legitimately tiny static listing (3 posts, 896 B) under the 600-alnum shell floor; site healthy, fresh, and readable by the current recipe. No feed exists to switch to."
  verified: "python3 tools/fetch_source.py url https://swarmcha.se/ --direct -> 896 B, 3 posts: '2026-09-26 OpenAI agents tried to bruteforce a UN website's API fields' (https://swarmcha.se/posts/openai-unctad), '2026-09-23 How to Win Games Without Being Able to Play Them' (https://swarmcha.se/gamesmanship), '2026-09-22 We found the OpenAI Hugging Face swarm budget table in their blogpost and they removed it' (https://swarmcha.se/posts/openai-swarm-budget-table). Real tools/source_health.py _content_assess on the record as-is: verdict=shell, alnum=407, newest 2026-09-26 (3 d). Same assessment with probe_url=https://swarmcha.se/posts/openai-unctad (a key the tool honors): verdict=relevant, alnum=38,066, terms=[apt,exploit,hacker,vulnerab] - but a fixed post URL will itself age past 60 days, so it is a stopgap, not a fix."
  notes_append: "2026-09-29: content check flagged 'shell' (407 alnum) - false positive: swarmcha.se is a hand-rolled static blog whose whole index is 3 dated links (896 B HTML). Recipe unchanged and working: WebFetch/extract https://swarmcha.se/ for the dated post list, then extract each /posts/<slug> or /<slug> (10-26 KB of full analysis each). No RSS/Atom/sitemap (all 404). Health-check suggestion: do not fire the 600-alnum shell floor when the page carries >=3 dated item links (a valid short listing)."
