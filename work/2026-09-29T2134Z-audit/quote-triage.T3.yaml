    and carries an editor''s note at the foot: ''August 11, 20206 [sic]: This post was updated to clarify
    that the social engineering of a trusted maintainer applied to the debug, chalk, and axios compromises
    specifically. The underlying attribution and findings remain unchanged.'' So AWS narrowed the claim
    to debug, chalk and axios and dropped typo-crypto from it.'
