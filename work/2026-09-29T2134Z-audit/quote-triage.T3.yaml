- entry: 2026-07-03/cve-2026-13368-watchguard-fireware-iked-pre-auth-rce
  kind: quote
  quote_or_cve: A remote unauthenticated attacker could exploit this vulnerability to execute arbitrary
    code in the context of the iked process on Fireboxes that have a Mobile VPN with IKEv2 configured
    to use an external LDAP authentication server.
  verdict: page-revised
  evidence: 'The cited URL https://www.watchguard.com/wgrd-psirt/advisory/wgsa-2026-00023 now 301-redirects
    to https://psirt.watchguard.com/ and (via fetch_source extract / url --direct) serves only the generic
    ''Security Advisories'' listing index (title ''WatchGuard Security Advisories'', script /listing.js;
    the saved check body 2ddd58be27468fd0 is that same index) - no per-advisory text, so the checker could
    not find the quote. WatchGuard relocated the PSIRT to psirt.watchguard.com; the per-CVE page https://psirt.watchguard.com/CVE-2026-13368
    (dateline 2026-07-02, title ''WatchGuard Firebox Race Condition and Use-After-Free in Mobile VPN with
    IKEv2 LDAP Authentication'') carries the quote verbatim in its Summary: ''WatchGuard Fireware OS contains
    a race condition leading to a use-after-free vulnerability in LDAP authentication for the Mobile User
    VPN with IKEv2. A remote unauthenticated attacker could exploit this vulnerability to execute arbitrary
    code in the context of the iked process on Fireboxes that have a Mobile VPN with IKEv2 configured
    to use an external LDAP authentication server.'' Old per-CVE URL https://www.watchguard.com/CVE-2026-13368/
    is now HTTP 404. Exploitation status on the live page: ''WatchGuard is not aware of any exploitation
    of this vulnerability in the wild.'''
  replacement: A remote unauthenticated attacker could exploit this vulnerability to execute arbitrary
    code in the context of the iked process on Fireboxes that have a Mobile VPN with IKEv2 configured
    to use an external LDAP authentication server.
  replacement_url: https://psirt.watchguard.com/CVE-2026-13368
  fact_change: 'Quote text unchanged (verbatim on the new URL), so no change to the quoted fact. Separate
    stale fact on the live page: Solution/Product status now lists T15/T35 fixed at Fireware OS 12.5.19
    (Affected ''>= 12.0, < 12.5.19''; Not affected ''>= 12.5.19'') and EUCC fixed at 12.11.9, whereas
    the entry''s frontmatter fixed field, summary and actions say the 12.5.x branch ''has no fix yet''
    / ''unresolved''. The body hedges this as ''Unresolved at publication'', but the summary and action
    2 present it as current. The entry''s WID-SEC and CVSS/exploitation statements are not affected (page:
    no known exploitation).'
- entry: 2026-07-08/ghostlock-cve-2026-43499-linux-kernel-rtmutex-uaf-lpe
  kind: quote
  quote_or_cve: GhostLock (CVE-2026-43499) is a Linux kernel vulnerability found by VEGA that exists in
    every major distribution since 2011. Triggering the bug does not require any special kernel config
    or privilege.
  verdict: page-revised
  evidence: 'Live https://nebusec.ai/research/ionstack-part-2/ (dateline 2026-07-07, site name now ''NebuSec'';
    fetched via extract and url --direct, identical) reads: ''GhostLock (CVE-2026-43499) is a Linux kernel
    vulnerability found by Nebu that exists in every major distribution since 2011. Triggering the bug
    does not require any special kernel config or privilege.'' The word VEGA no longer appears anywhere
    on the page (page-source grep: 0 hits; page footer: ''For all bugs found by Nebu''). The run''s own
    publish-time capture (work/2026-07-08T2009Z-intel/findings.S1.yaml, verification.iter2.md ''VEGA discovery
    ... confirmed'') recorded ''found by VEGA'', so the page was edited after publication (researcher
    rebrand VEGA -> Nebu; the sister bug-summary page https://nebusec.ai/buglist/CVE-2026-43499/ also
    no longer names VEGA). The Hacker News (second cited source) still says ''Nebula found it with VEGA,
    its AI-driven bug-hunting tool.'''
  replacement: GhostLock (CVE-2026-43499) is a Linux kernel vulnerability found by Nebu that exists in
    every major distribution since 2011. Triggering the bug does not require any special kernel config
    or privilege.
  replacement_url: https://nebusec.ai/research/ionstack-part-2/
  fact_change: 'Only the discoverer label: the primary now says ''Nebu'' where it said ''VEGA''. The technical
    claims (every major distribution since 2011, no special kernel config or privilege, 97% stable root/container
    escape, CONFIG_FUTEX_PI=y only prerequisite, 2.6.39 to 7.1-rc1 range) are unchanged on the live page.
    The entry body''s clause ''discovered by Nebula Security''s automated bug-hunting tool VEGA'' (cited
    to the nebusec page) is now carried only by The Hacker News, not by the nebusec page; the entry''s
    publisher label ''Nebula Security'' vs the site''s ''NebuSec/Nebu'' may also want reconciling.'
- entry: 2026-07-11/joomla-rsfiles-phoca-file-upload-rce-cve-2026-57827-57828
  kind: cve
  quote_or_cve: CVE-2026-57827
  verdict: mis-cited
  evidence: 'Clause: ''... unauthenticated RCE (CVE-2026-57827, CVSS 4.0 10.0; the vendor RSJoomla! shipped
    1.17.12 the same day, ["update NOW!"](https://www.rsjoomla.com/blog/view/644-...html))''. The vendor
    page (fetched live, dateline 2026-07-10, 3 KB) contains no CVE id and no CVSS score at all; it says
    only ''update immediately to RSFiles! 1.17.12'' and ''any attacker, without having an account on your
    website, can upload a .php file in your /downloads directory and execute it''. The id and score are
    on the mySites.guru RSFiles post (the entry''s primary source): ''This flaw is tracked as CVE-2026-57827,
    crediting Phil Taylor of mySites.guru as the reporter.'' and the table row ''CVSS 4.0 | 10.0 (critical),
    AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H''. The vendor link vouches only for the 1.17.12-same-day/''update
    NOW'' fragment, which it does carry.'
  replacement: 'Cite https://mysites.guru/blog/rsfiles-unauthenticated-file-upload-rce/ for the CVE id
    and CVSS 4.0 10.0 (keep the RSJoomla! link on the ''update NOW!'' fragment). Live text: ''This flaw
    is tracked as CVE-2026-57827, crediting Phil Taylor of mySites.guru as the reporter.'''
  replacement_url: https://mysites.guru/blog/rsfiles-unauthenticated-file-upload-rce/
  fact_change: 'No: id, CVSS 10.0, fixed 1.17.12 and the 2026-07-10 date are all correct and carried by
    the mySites.guru primary; only the citation adjacency is wrong.'
- entry: 2026-07-11/joomla-rsfiles-phoca-file-upload-rce-cve-2026-57827-57828
  kind: cve
  quote_or_cve: CVE-2026-48908
  verdict: mis-cited
  evidence: 'Clause: ''JoomShaper SP Page Builder (CVE-2026-48908), Joomlack Page Builder CK (CVE-2026-56290),
    Balbooa Forms (CVE-2026-56291) and iCagenda (CVE-2026-48939) all carry the same ... file-upload primitive,
    and several were added to CISA''s KEV catalog within days - iCagenda after confirmed zero-day exploitation
    ([mySites.guru, 2026-07-10](https://mysites.guru/blog/rsfiles-unauthenticated-file-upload-rce/))''.
    The cited RSFiles post (live, 23 KB) contains only one CVE id, CVE-2026-57827 (10 mentions); it names
    Page Builder CK, iCagenda, Balbooa Forms and the SP Page Builder zero-day only as hyperlinks to sister
    posts, gives no CVE ids for them, and says nothing about CISA KEV. The page that carries CVE-2026-48908
    is https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/ (title ''SP Page Builder
    Zero Day RCE Fixed in 6.6.2 | mySites.guru'' (dateline 2026-06-15) mentions CVE-2026-48908 11 times).
    CISA KEV (fetched live via fetch_source.py cisa-kev this pass) lists CVE-2026-48908 (SP Page Builder)
    with dateAdded 2026-07-07, so the KEV part of the clause is true but is carried by the KEV catalog,
    not the cited post. Per-CVE post text for the four ids does not state KEV either.'
  replacement: Cite https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/ for CVE-2026-48908
    (SP Page Builder); for 'added to CISA's KEV' cite the KEV catalog JSON https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    (dateAdded 2026-07-07 for CVE-2026-48908). The existing store entries for these CVEs (entries/2026-07-08/joomla-page-builder-cve-2026-48908-56290-kev-zerodays.md,
    entries/2026-07-10/cve-2026-48939-icagenda-joomla-unauth-file-upload-rce-kev.md, entries/2026-07-09/cve-2026-56291-balbooa-forms-joomla-unauth-file-upload-rce.md)
    carry the same ids.
  replacement_url: https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/
  fact_change: 'No: all four ids are correct for the named products and all four are on CISA KEV (dateAdded:
    48908 and 56290 on 2026-07-07; 48939 and 56291 on 2026-07-10). Only the citation is misplaced. Minor:
    ''within days'' of the wave is supported by KEV dates.'
