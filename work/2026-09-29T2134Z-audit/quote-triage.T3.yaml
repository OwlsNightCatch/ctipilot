  evidence: The bound page https://status.sharefile.com/ is the rolling status-page dashboard; live (2026-09-29)
    it reads 'All Systems Operational' and carries no incident text, so the quote cannot be on it. The
    two other bound pages (BleepingComputer 2026-07-10 article, heise 2026-07-13 article; both fetched)
    do not contain 'restored' or 'Recovery instructions'. The quote is verbatim on the resolved-incident
    page https://status.sharefile.com/incidents/c59n5343lbkq (title 'ShareFile customers with Storage
    Zones Controllers are not operational at this time.'; page metadata date 2026-07-14; also in the status
    RSS https://status.sharefile.com/history.rss item 'Jul 14, 11:06 EDT - Resolved - Storage Zones Controller
    customer access is currently being restored. Recovery instructions have been provided directly to
    account owners.', preceded by 'Jul 10, 12:12 EDT - Investigating - We are currently investigating
    this issue.'). Verified in raw HTML of the incident page (literal match, no ellipsis or splice).
  replacement: Storage Zones Controller customer access is currently being restored. Recovery instructions
    have been provided directly to account owners.
  replacement_url: https://status.sharefile.com/incidents/c59n5343lbkq
