  quote_or_cve: Both the NCSC and our team had been ghosted by the manufacturer despite multiple follow-up
    emails.
  verdict: page-revised
  evidence: 'Live page (fetched via extract, dateline 2026-08-07, timeline row ''25.09.2026 | This blog
    post updated with the vendor’s current status.'') was revised on 2026-09-25: it now has a ''# Update
    (September 2026)'' section (''After publication, Tobit.Software contacted us with the current status.
    The statements below are the vendor’s; we have not verified them ourselves ... the entire affected
    functionality is disabled by default [with Rollout 528 of 30 June 2026]. The corresponding interface
    is deprecated ...; Tobit has also extended their public documentation for Rollout 528, where they
    now explicitly point out the security issue and list all 22 CVEs'') and new timeline rows ''30.06.2026
    Release of TeamDavid Rollout 528 ... We only learned of this in September 2026'', ''04.09.2026 Tobit
    contacted us with a status update on Rollout 528, their public documentation of the 22 CVEs, and renewed
    coordination with the NCSC''. The earlier audits (work/2026-08-16T1313Z-audit/truth-B1.yaml, work/2026-08-24T0902Z-audit/truth-B1.yaml)
    recorded this quote as present verbatim on the page before the revision. The sentence is no longer
    on the page (no ''ghosted'' anywhere). The nearest live text is the disclosure-timeline row ''06.08.2026
    | No further response had been received from the manufacturer despite multiple follow-up emails.'''
  replacement: No further response had been received from the manufacturer despite multiple follow-up
    emails.
  replacement_url: https://labs.infoguard.ch/posts/22-cves-in-david-a-secure-m365-alternative/
  fact_change: Partly. The 2026-08-06 state (no response despite follow-ups) is unchanged, but the NCSC
    is no longer named as a co-ghosted party in that sentence, and the page now adds that the vendor did
    contact InfoGuard on 2026-09-04 with a status update and 'renewed coordination with the NCSC'. The
    entry's summary ('the vendor stopped responding to both them and the national cyber security centre')
    and the body clause 'recorded that both they and that centre had been ghosted by the manufacturer'
    are therefore stale as a current-state claim (still accurate as of 2026-08-06/07).
- entry: 2026-08-09/teamdavid-tobit-22-cves-unauth-mailbox-takeover-dach
  kind: quote
  quote_or_cve: Update to newest version, we don’t exactly know which vulnerabilities are fixed and which
    are not
  verdict: page-revised
  evidence: 'Live page (fetched via extract, dateline 2026-08-07, timeline row ''25.09.2026 | This blog
    post updated with the vendor’s current status.'') was revised on 2026-09-25: it now has a ''# Update
    (September 2026)'' section (''After publication, Tobit.Software contacted us with the current status.
    The statements below are the vendor’s; we have not verified them ourselves ... the entire affected
    functionality is disabled by default [with Rollout 528 of 30 June 2026]. The corresponding interface
    is deprecated ...; Tobit has also extended their public documentation for Rollout 528, where they
    now explicitly point out the security issue and list all 22 CVEs'') and new timeline rows ''30.06.2026
    Release of TeamDavid Rollout 528 ... We only learned of this in September 2026'', ''04.09.2026 Tobit
    contacted us with a status update on Rollout 528, their public documentation of the 22 CVEs, and renewed
    coordination with the NCSC''. The earlier audits (work/2026-08-16T1313Z-audit/truth-B1.yaml, work/2026-08-24T0902Z-audit/truth-B1.yaml)
    recorded this quote as present verbatim on the page before the revision. The Recommendations bullet
    that carried this sentence was rewritten. Live text: ''Update to Rollout 528 (30 June 2026) or newer.
    According to Tobit, the affected functionality is disabled by default from this release onwards. We
    have not verified this and could not retest the individual findings, as the affected functionality
