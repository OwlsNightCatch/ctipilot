    know which vulnerabilities are fixed and which are not'' clause is gone.'
  replacement: Update to Rollout 528 (30 June 2026) or newer. According to Tobit, the affected functionality
    is disabled by default from this release onwards. We have not verified this and could not retest the
    individual findings, as the affected functionality is no longer present (see the update section and
    the disclosure timeline).
  replacement_url: https://labs.infoguard.ch/posts/22-cves-in-david-a-secure-m365-alternative/
  fact_change: 'YES. The entry asserts ''fixed: not stated'' on all 22 cves[] records, ''name no fixed
    release'' in the summary, ''affected: TeamDavid through Rollout 524'', and ''the researchers state
    they cannot say which flaws are fixed''. The live page now names Rollout 528 (2026-06-30) as the release
    after which Tobit says the affected functionality is disabled by default (vendor statement, unverified
    by InfoGuard, functionality deprecated), plus Tobit''s public documentation of all 22 CVEs on chayns.net
    (https://chayns.net/77892-10814/tapp/763210?postId=11454 per the InfoGuard page). The entry needs
    an update record for the Rollout 528 mitigation state.'
- entry: 2026-08-10/natjack-nat-trust-assumption-attack-class-two-cves
  kind: quote
  quote_or_cve: 'An unintended behavior in the TCP conntrack state machine allows a

    connection to be forced into the CLOSE state using an RST packet with an

    invalid sequence number.'
  verdict: false-positive
  evidence: 'The bound page https://lore.kernel.org/linux-cve-announce/2026071946-CVE-2026-63913-9646@gregkh/T/#u
    sits behind the Anubis proof-of-work bot wall: extract, url --direct (on /T/#u, /, /raw and the /all/
    mirror path) and WebFetch all return only the ''Making sure you''re not a bot!'' / ''Access Denied''
    interstitial, and the saved check body is that same challenge page, so the checker had nothing to
    search. The quote cannot be read on lore directly by any transport available here, but the linux-cve-announce
    email is the kernel CNA''s CVE description verbatim (URL id 20260719 = the CVE''s datePublished).
    The CVE 5 record for CVE-2026-63913 (cveawg.mitre.org/api/cve/CVE-2026-63913; assignerShortName ''Linux'',
    datePublished 2026-07-19T14:55:17Z) carries the description ''In the Linux kernel, the following vulnerability
    has been resolved:\n\nnetfilter: conntrack: tcp: do not force CLOSE on invalid-seq RST without direction
    check\n\nAn unintended behavior in the TCP conntrack state machine allows a\nconnection to be forced
    into the CLOSE state using an RST packet with an\ninvalid sequence number.\n\nSpecifically, after
    a SYN packet is observed, an RST with an invalid SEQ can transition the conntrack entry to TCP_CONNTRACK_CLOSE,
    ...'', i.e. the stored quote, including its hard-wrapped line breaks, is a contiguous verbatim substring
    of it.'
  replacement: null
  replacement_url: null
  fact_change: 'No. Caveat: verbatim status on the lore.kernel.org page itself is inferred from the identical
    CNA record text (page unreadable behind Anubis), not observed on the page. Optional hardening: add
    the CVE record or the git.kernel.org stable commit (also Anubis-gated) as a readable second source,
    since lore.kernel.org cannot be machine-verified. Same Anubis wall affects git.kernel.org fetches.'
