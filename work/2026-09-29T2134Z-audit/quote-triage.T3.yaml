    compromised the typo-crypto package. In September 2025, the same threat actor compromised the debug
    and chalk NPM packages. In March 2026, the same operational playbook appeared in a compromise of the
    axios package, one of the most widely used JavaScript libraries with more than 100 million weekly
    downloads. In each case with debug, chalk, and axios, the threat actor gained access by socially engineering
