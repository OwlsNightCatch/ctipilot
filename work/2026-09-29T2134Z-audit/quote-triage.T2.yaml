- entry: 2026-09-04/cnil-fine-hopital-prive-de-la-loire-dpi-breach
  quote: The authentication procedure to connect to the hospital's e-Health Patient Summa
  verdict: page-revised
  evidence: 'Live CNIL English page: ''The authentication procedure to connect to the hospital’s e-Health Patient
    Summary, used by users outside the hospital, in particular doctors not affiliated with the hospital, was not
    sufficiently robust, due to the lack of VPNs and multifactor authentication means. The attacker took advantage
    of this vulnerability to access the data.'' Only difference from the flagged quote: ''in particular liberal
    doctors'' (entry) vs ''in particular doctors not affiliated with the hospital'' (page). The original fire''s
    quote (work/2026-09-04T0410Z-intel/findings.S4.yaml) has ''liberal doctors'', so the page was most likely re-worded
    after 2026-09-04 (trafilatura metadata on the page now says 2026-09-09 vs the 3 Sep dateline). No saved pre-revision
    copy exists on disk, so the revision is inferred, not proven; a literal ''liberal doctors'' does not appear
    on the page, on BleepingComputer or on databreaches.net.'
  replacement: The authentication procedure to connect to the hospital’s e-Health Patient Summary, used by users
    outside the hospital, in particular doctors not affiliated with the hospital, was not sufficiently robust, due
    to the lack of VPNs and multifactor authentication means. The attacker took advantage of this vulnerability
    to access the data.
  replacement_url: https://www.cnil.fr/en/sanction-fine-hopital-prive-loire
  fact_change: Marginal. The entry body says 'private-practice physicians accessing the record system from outside
    the hospital'; CNIL now says 'doctors not affiliated with the hospital' (BleepingComputer, also cited, says
    'External users, including private-practice physicians'), so the body is supported by BleepingComputer but not
    by the CNIL wording. No change to the finding (no VPN, no MFA, external users).
  other_notes: Body sentence 'the attacker used the credentials of a single compromised physician account to get
    in' is followed only by CNIL/BleepingComputer citations; CNIL says 'using the credentials of a single user account'
    - 'physician' comes only from the attacker's own claim relayed by BleepingComputer/databreaches.net ('a single
    doctor's account'). Low severity wording drift.
- entry: 2026-09-10/checkpoint-quantum-vpn-cert-preauth-rce-cvss98
  quote: A heap overflow in the VPN certificate ASN.1 decoding flow may allow a remote at
  verdict: page-revised
  evidence: 'sk1000118 is a Next.js shell; the advisory text is in the __NEXT_DATA__ JSON (dateCreated 2026-09-07,
    lastModified 2026-09-18). Current Issue line: ''A heap overflow in the VPN certificate ASN.1 decoding flow may
    allow an attacker to remotely execute arbitrary code on the Security Management Server and Security Gateway.''
    followed by a new ''Clarification: All Security Management Server deployments are vulnerable, regardless of
    configuration, and require the fix described below. The vulnerability is not dependent on any specific management
    configuration. The management is vulnerable even when VPN in not in use or configured.'' The original fire''s
    saved quote (work/2026-09-10T0410Z-intel/findings.S1.yaml, page then ''last modified 2026-09-09'') read ''may
    allow a remote attacker to remotely execute arbitrary code on the management and Security Gateway''. The old
    text appears on no other cited page.'
  replacement: A heap overflow in the VPN certificate ASN.1 decoding flow may allow an attacker to remotely execute
    arbitrary code on the Security Management Server and Security Gateway.
  replacement_url: https://support.checkpoint.com/results/sk/sk1000118/
  fact_change: 'No substantive change: still remote RCE on Security Gateway and Management Server. Wording moves
    from ''remote attacker''/''the management'' to ''an attacker''/''Security Management Server''; the page no longer
    says ''remote attacker'' (unauthenticated/pre-auth framing is carried by Forkast, which the entry also cites,
    not by sk1000118). The body repeats the old wording inside quotation marks (''may allow a remote attacker to
    remotely execute arbitrary code on the management and Security Gateway'') and needs the same fix.'
  other_notes: 'Live sk1000118 (lastModified 2026-09-18) and sk1000117 (lastModified 2026-09-24) now carry a ''Mitigation''
    section: ''Use this mitigation only if the affected system cannot be updated through Jumbo Hotfix Accumulator
    or Check Point LivePatch'' - disable Site-to-Site and Remote Access VPN implied rules and create explicit Access
    Control rules (UDP/500, UDP/4500, TCP/443, TCP/80); ''These mitigation options are not applicable to the locally
    managed Spark Firewall.'' The entry says ''no workaround exists for the locally-managed Spark Firewall or Remote
    Access VPN'' (summary), ''no workaround exists for Remote Access VPN or the locally-managed Spark Firewall short
    of patching'' (actions[0]) and ''there is no interim mitigation for Remote Access VPN or the Spark Firewall''
    (takeaway). The Remote Access VPN part is contradicted by the current advisory (the locally-managed Spark part
    still holds). When the mitigation section was added is unknown (the entry''s last update is 2026-09-23, sk1000117
    was modified 2026-09-24, and the vendor blog post cited by the entry refers to ''alternative mitigation steps'');
    treat as a candidate correction, low confidence on timing, high confidence that the live page now differs.'
