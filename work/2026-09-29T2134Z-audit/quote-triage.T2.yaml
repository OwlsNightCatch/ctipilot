- entry: 2026-09-19/waterplum-contagious-interview-joint-advisory-scale
  quote: WaterPlum actors have infected at least 30,000 devices in more than 100 countrie
  verdict: false-positive
  evidence: 'Executive Summary, p.1: ''WaterPlum actors have infected at least 30,000 devices in more than 100 countries
    and exfiltrated funds or account credentials from over 7,000 cryptocurrency wallets. WaterPlum actors have transferred
    1.7 billion Japanese yen (JPY) (equivalent to 10.71 mil lion USD) of cryptocurrency assets to the Democratic
    People’s Republic of Korea (DPRK).'' Letters-and-digits identical to the entry''s quote (straight vs curly apostrophe
    only; ''mil lion'' is a run break in the PDF text). The bridge `pdf` command drops glyphs from the Identity-H
    (Type0/ToUnicode) fonts: it decodes hex strings as plain byte codes and discards codes below 32, which are the
    digit and space glyphs, so every digit vanishes (''at least devices in more than countries'', ''313'' missing)
    - the gate''s letters-and-digits comparison therefore fails on any quote containing digits. I decoded the PDF''s
    content streams myself using each font''s own ToUnicode CMap (per-page font resources, all 9 pages) and compared
    with letters-and-digits normalisation.'
  replacement: null
  replacement_url: https://www.ic3.gov/CSA/2026/260918.pdf
  fact_change: null
  other_notes: Entry also says the advisory 'quantif[ies] the campaign for the first time' / 'is the first to attach
    concrete scale to the campaign' (title, summary, body). No fetched source (the PDF, The Record, heise) says
    the advisory is the first to quantify the campaign; the PDF only says 'For the first time in Japan' about the
    laptop-farm dismantling. Low-confidence F14-type quantifier; not in the flagged-quote scope.
