  verdict: page-revised
  evidence: 'Live FAQ Q4 ''When will the Single Reporting Platform be operational?'' now reads: ''The platform has
    become operational on 11 September 2026, coinciding with the date on which the CRA reporting obligations under
    Art.14 are applicable.'' The 31 August copy read ''The platform is scheduled to be operational by 11 September
