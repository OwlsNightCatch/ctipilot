- id: adobe-psirt
  diagnosis: >-
    Configured url https://helpx.adobe.com/security/security-bulletin.html now returns a 1,092-alnum
    stub (extract: 758 bytes, title "Adobe Trust Center: Security bulletins and advisories", "Last Updated:
    September 22, 2026", tab labels only, no bulletin rows). Adobe moved all 2026 bulletins to the Adobe Trust
    Center (helpx.adobe.com/security.html states verbatim: "Adobe security bulletins have moved to the Adobe
    Trust Center. All 2026 bulletins are available now, and existing helpx URLs will automatically redirect.
    Bulletins prior to 2025 will remain on this page"); the helpx pages now serve the archive ("Archived Security Bulletins &
    Advisories by Product (Through December 2025)") and the configured security-bulletin.html now redirects to the Trust Center. The Trust Center listing
    https://www.adobe.com/trust/security/bulletins-and-advisories.html (21 KB) is a JS shell: its tab fragment
    /trust/security/fragments/security-bulletin-tab1 is a Milo CaaS (Content-as-a-Service) collection whose
    embedded config (gzip+base64 in the caas tool link) sets includeTags=caas:trust-center/security-bulletin,
    contentTypeTags=caas:content-type/documentation. Milo's own utils.js (https://www.adobe.com/libs/blocks/caas/utils.js)
    shows the collection endpoint is https://www.adobe.com/chimera-api/collection with default
    originSelection=hawks and collectionTags=<includeTags>. That endpoint returns clean JSON:
    108 cards / 176,955 bytes, each with title (APSB id), url, description (Priority N + type), cardDate,
    modifiedDate and the CVE ids in search.search. Newest cardDate 2026-09-22 (APSB26-155/157/145/147/148/150/151),
    then 2026-09-08 (APSB26-98 Experience Manager, APSB26-119 ColdFusion Priority 1, APSB26-130 Photoshop, ...).
    Ordering is NOT by date (the size parameter truncates an arbitrary/ascending list, size=20 returns January
    cards), so use size=250 (all 108 cards) and sort client-side on cardDate.
  root_cause: >-
    blog moved (publisher migrated bulletins from helpx.adobe.com to the Adobe Trust Center, a JS/CaaS-rendered
    SPA); the old URL is now an archive/redirect stub, so the probe sees a shell with 2 security terms.
    Not a tool false positive: the recipe as written really yields no bulletin list.
  fix:
    fetch_method: bridge
    url: "https://www.adobe.com/chimera-api/collection?originSelection=hawks&contentTypeTags=caas:content-type/documentation&collectionTags=caas:trust-center/security-bulletin&language=en&country=us&size=250&draft=false"
  verified: >-
    python3 tools/fetch_source.py url "<chimera URL above>" --direct -> 176,955 bytes JSON, 108 cards; newest by
    cardDate 2026-09-22 (APSB26-155 Substance3D Modeler, APSB26-157 Premiere Pro, APSB26-150 Connect Priority 2,
    APSB26-151 AEM Forms Priority 2), then 2026-09-08 APSB26-119 ColdFusion Priority 1
    (https://www.adobe.com/trust/security/products/coldfusion/apsb26-119). Health-probe harness
    (source_health._content_assess with url override) -> content_verdict relevant, alnum 248,120, has_cve true;
    _bridge_check -> bridge-ok 176,955 B. Per-bulletin drill: python3 tools/fetch_source.py url
    https://www.adobe.com/trust/security/products/coldfusion/apsb26-119.html --direct returns 36,989 B raw HTML
    with the per-CVE table (CWE / impact / severity / CVSS score / vector / CVE); `extract` on the same page drops
    the tables (5,240 B, headings only), so use raw url for per-bulletin CVSS mapping. Old helpx per-bulletin URLs
    (helpx.adobe.com/security/products/coldfusion/apsb26-119.html) still resolve (200) and carry the same
    Trust-Center canonical.
  notes_append: >-
    2026-09-29: bulletins moved to Adobe Trust Center (helpx now archive-only through Dec 2025; old security-bulletin.html
    is a stub). Working listing recipe = bridge url on the Milo CaaS JSON endpoint
    https://www.adobe.com/chimera-api/collection?originSelection=hawks&contentTypeTags=caas:content-type/documentation&collectionTags=caas:trust-center/security-bulletin&language=en&country=us&size=250&draft=false
    (108 cards; fields title=APSB id, contentArea.url, description=Priority N, cardDate, search.search=CVE ids;
