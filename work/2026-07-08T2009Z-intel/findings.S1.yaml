  - title: "GhostLock (CVE-2026-43499): a 15-year-old Linux kernel rtmutex use-after-free with a public, 97%-reliable root and container-escape exploit"
    sources:
      - { url: "https://nebusec.ai/research/ionstack-part-2/", publisher: "Nebula Security", date: "2026-07-07", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/15-year-old-ghostlock-flaw-enables-root.html", publisher: "The Hacker News", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"critical vulnerability exploited in the wild July 7 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/15-year-old-ghostlock-flaw-enables-root.html → primary: Nebula Security, URL https://nebusec.ai/research/ionstack-part-2/"
    summary: |
      GhostLock (CVE-2026-43499) is a stack use-after-free in the Linux kernel's rtmutex priority-inheritance code, discovered by Nebula Security's automated bug-hunting tool VEGA. The bug lives in `remove_waiter()` (kernel/locking/rtmutex.c): the helper unconditionally clears `current->pi_blocked_on`, an assumption valid on the normal self-blocking path but broken on the proxy-lock rollback path — `rt_mutex_start_proxy_lock()` can enqueue (and, on `-EDEADLK`, roll back via `remove_waiter()`) a waiter on behalf of a *different* task, so the helper scrubs the wrong task's state and leaves a dangling pointer into an already-freed kernel stack frame. The only requirement is `CONFIG_FUTEX_PI=y` (the default on essentially every mainstream distribution) — no special capabilities, user namespaces, or unusual configuration. The flaw was introduced in Linux 2.6.39 (commit 8161239a8bcc, an rtmutex PI-algorithm rework) and shipped for over 15 years until fixed in commit 3bfdc63936dd, reported to security@kernel.org on 18 April 2026, fixed two days later, and backported by 4 May 2026 — meaning most current kernels already carry the fix, but distributions that haven't rebased onto a post-April-2026 build remain exposed. Nebula turned the primitive into a working exploit — reclaiming the freed stack frame, using a `prefetch`-based side channel plus the DirtyMode `/proc/sys` write-what-where technique to hijack a function pointer — achieving root in roughly five seconds with 97% reliability in testing, and demonstrated the same primitive escapes containers (a compromised container can break out to the host kernel). Google awarded $92,337 through its kernelCTF bug-bounty program. Nebula published full exploit source (CyberMeowfia repository) alongside the write-up on 7 July 2026; no in-the-wild exploitation has been reported, but public working code plus 15 years of unpatched exposure makes this a same-week verification item for any host running an unpatched kernel between v2.6.39 and the April-2026 fix.
    region_nexus: "global; affects any Linux host/container platform on a pre-fix kernel, including Swiss/EU public-sector and cloud/Kubernetes estates"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (Linux/container infrastructure)"
    cves: [CVE-2026-43499]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "GhostLock (CVE-2026-43499) is a Linux kernel vulnerability found by VEGA that exists in every major distribution since 2011. Triggering the bug does not require any special kernel config or privilege."
        attribution: "Nebula Security"
        source_url: "https://nebusec.ai/research/ionstack-part-2/"
      - quote: "No one is known to be exploiting it in the wild, but Nebula has published working exploit code, so anyone can now run it."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/15-year-old-ghostlock-flaw-enables-root.html"
    extended_notes: |
      T1068 Exploitation for Privilege Escalation; the container-escape variant also maps to T1611 Escape to Host. Hardening/mitigation short of the kernel patch: RANDOMIZE_KSTACK_OFFSET defeats the specific stack-reuse step Nebula relied on (turns a deterministic overlap into a ~1/32 guess) and STATIC_USERMODE_HELPER closes the specific DirtyMode write-what-where path used in this PoC — both raise cost but are not fixes; the durable remediation is confirming the running kernel includes commit 3bfdc63936dd (backported 2026-05-04) rather than just "a recent kernel." Verified the referenced kernel.org commit and NVD CVE-2026-43499 identifier are cited consistently across both sources.

