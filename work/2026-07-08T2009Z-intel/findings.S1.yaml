      Delta on the entry published 2026-07-02, which covered six CVSS-10.0 ColdFusion/Campaign Classic CVEs (APSB26-68/69) with no exploitation reported at the time. CVE-2026-48282 is the specific member of that cluster now confirmed exploited and KEV-listed; the other five (CVE-2026-48276/-48277/-48281/-48283/-48316) remain unconfirmed for exploitation as of this run.

  - title: "CVE-2026-55255 — Langflow cross-tenant IDOR now CISA KEV-listed; Sysdig documents the same operator chaining it with the already-exploited Langflow RCE CVE-2026-33017"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-prioritize-patching-langflow-auth-bypass-flaw/", publisher: "BleepingComputer", date: "2026-07-08", role: "primary" }
      - { url: "https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited", publisher: "Sysdig Threat Research Team", date: "2026-06-26", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html", publisher: "The Hacker News", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (dateAdded 2026-07-07 for CVE-2026-55255) → pivot: WebSearch (\"CVE-2026-55255 Langflow authorization bypass exploited\") → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-prioritize-patching-langflow-auth-bypass-flaw/ → primary technical writeup: Sysdig, URL https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited"
    summary: |
      CVE-2026-55255 is an IDOR (CWE-639) in Langflow's OpenAI-Responses-compatible endpoint `POST /api/v1/responses`: `get_flow_by_id_or_endpoint_name` (helpers/flow.py) resolves a flow by UUID with no `user_id` ownership check, so any authenticated caller who obtains another user's flow UUID can execute that user's flow — including whatever LLM-provider or cloud credentials are embedded in it. NVD scores it 8.4 (CVSS 3.1); the GitHub Security Advisory (GHSA-qrpv-q767-xqq2) and Sysdig rate the scope-changed vector at 9.9. Fixed in Langflow 1.9.1 (PR #12832). Sysdig's Threat Research Team observed a single financially-motivated operator (45.207.216.55) run a scripted, unattended playbook against one internet-exposed instance on 25 June 2026: `GET /api/v1/flows/` to harvest flow UUIDs, then the IDOR with `input:"leak api keys"` against those disclosed IDs — followed by repeated waves of the already-KEV-listed (since March 2026) unauthenticated RCE CVE-2026-33017 (`build_public_tmp`) to plant a loader (marker `/tmp/lang_pwn`) pulling a second stage from the same IP. CISA added CVE-2026-55255 to KEV on 7 July 2026 with a three-day FCEB remediation deadline. Sysdig's analysis is the useful defender lesson: the RCE dominated actual attacker effort despite scoring lower, because it needs no valid flow ID and is a strict superset of what the IDOR can do on a single-tenant deployment — the IDOR only matters distinctly on multi-tenant/managed Langflow, where it crosses the tenant boundary at the application layer without any sandbox escape.
    region_nexus: "global; Langflow is widely self-hosted for internal AI/RAG pipelines, including in EU public-sector data-science environments"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (AI/agent infrastructure)"
    cves: [CVE-2026-55255, CVE-2026-33017]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On June 25, 2026, the Sysdig Threat Research Team (TRT) observed the first known active exploitation of a CVSS 9.9 \"critical\" Langflow vulnerability, tracked as CVE-2026-55255."
        attribution: "Sysdig Threat Research Team"
        source_url: "https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited"
      - quote: "When a flow is resolved by UUID, the lookup queries the database with no user_id ownership check, so any authenticated caller can execute any user's flow by passing its UUID."
        attribution: "Sysdig Threat Research Team"
        source_url: "https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited"
      - quote: "On Tuesday, CISA added the CVE-2026-55255 authorization bypass to its Known Exploited Vulnerabilities Catalog (KEV), ordering U.S. Federal Civilian Executive Branch (FCEB) agencies to secure their devices by Friday."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-prioritize-patching-langflow-auth-bypass-flaw/"
    extended_notes: |
      Detection concept from Sysdig's IOC/telemetry description (no IOCs reproduced here): watch for the sequence GET /api/v1/flows/ (bulk flow enumeration) immediately followed by POST /api/v1/responses with a `model` value matching a just-enumerated flow UUID and an `input` field resembling a prompt-injection string — this pairing is the disclosure-to-IDOR chain regardless of source IP. Hardening: upgrade to Langflow ≥1.9.1; on multi-tenant/managed deployments, additionally restrict or authorize the /api/v1/flows/ listing endpoint since the IDOR is inert without it.

  - title: "Two Joomla page-builder extensions — SP Page Builder (CVE-2026-48908) and Page Builder CK (CVE-2026-56290) — hit CISA KEV the same day for near-identical unauthenticated file-upload-to-RCE zero-days"
    sources:
      - { url: "https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/", publisher: "mySites.guru", date: "2026-07-08", role: "primary" }
      - { url: "https://mysites.guru/blog/pagebuilderck-unauthenticated-file-upload-rce/", publisher: "mySites.guru", date: "2026-07-07", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html", publisher: "The Hacker News", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (dateAdded 2026-07-07 for both CVE-2026-48908 and CVE-2026-56290) → pivot: WebSearch (\"CVE-2026-48908 JoomShaper SP Page Builder exploited\") → primary: mySites.guru, URL https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html (also confirms CVE-2026-56290 exploitation) → pivot: mySites.guru, URL https://mysites.guru/blog/pagebuilderck-unauthenticated-file-upload-rce/"
    summary: |
      Two unrelated third-party Joomla page-builder extensions were both added to CISA KEV on 7 July 2026 for near-identical unauthenticated arbitrary-file-upload-to-RCE flaws, both already exploited as zero-days. CVE-2026-48908 (JoomShaper SP Page Builder, CVSS 10.0, CWE-434) is in the component's own `asset.uploadCustomIcon` task — reachable at `index.php?option=com_sppagebuilder&task=asset.uploadCustomIcon` with no authentication and no file-type validation — affecting every version through 6.6.1, fixed in 6.6.2. mySites.guru observed live attacks planting hidden Super Administrator accounts (typically `@secure.local` addresses) for persistence even after the entry point is patched. CVE-2026-56290 (Page Builder CK / com_pagebuilderck by Joomlack, CVSS 10.0, CWE-284) is a front-end upload handler that checked only a CSRF token — no authentication or authorization — and accepted attacker-controlled destination folder and filename (including extension), letting a PHP file be written and executed anywhere web-accessible; affects up to 3.5.10, fixed in 3.6.0 (with back-ports to 3.1.1 for Joomla 3 and 3.4.10 for Joomla 4). mySites.guru's own suspect-content tooling flagged a live web shell within hours of the fix landing. Both extensions are common on small-business and municipal Joomla sites; the technique class (unauthenticated component endpoint accepting a file with no type/ownership check) is the transferable lesson for any Joomla estate running third-party page-builder add-ons.
    region_nexus: "global; Joomla with third-party page-builder extensions is common among EU municipal and SMB websites"
    primary_sector_nexus: "indirect"
    sector: "public-sector (municipal web presence), cross-sector"
    cves: [CVE-2026-48908, CVE-2026-56290]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Already exploited in the wild. The payload plants a hidden Super Administrator account, usually with an @secure.local email."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/"
      - quote: "Update, 27 June 2026: this is now being exploited in the wild. Within hours of the fix landing, our suspect content tool flagged a live web shell on a connected Joomla site."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/pagebuilderck-unauthenticated-file-upload-rce/"
      - quote: "CVE-2026-48908 was exploited as a zero-day to upload a PHP file via HTTP POST request to the 'index.php?option=com_sppagebuilder&task=asset.uploadCustomIcon' endpoint."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html"
    extended_notes: |
      Detection: web-server access logs for POST requests to `index.php?option=com_sppagebuilder&task=asset.uploadCustomIcon` returning HTTP 200 followed by a GET to a newly-planted file (SP Page Builder), or POST requests to the PageBuilder CK front-end upload handler with an attacker-supplied folder/filename parameter (Page Builder CK). Post-compromise hunt: any newly created Joomla Super User / Super Administrator account, especially with an @secure.local or similarly unusual email domain. Priority action for site owners: SP Page Builder ≥6.6.2, Page Builder CK ≥3.6.0 (or the 3.1.1/3.4.10 back-ports).
    borderline: true
    borderline_reason: "third-party CMS plugins with narrower blast radius than core platform CVEs, but included given same-day KEV addition, confirmed zero-day exploitation and a clearly transferable unauthenticated-upload technique class"

  - title: "BeyondTrust Remote Support / Privileged Remote Access: two critical pre-auth authentication-bypass flaws (CVE-2026-40138/-40139) plus two high-severity companions, flagged by NCSC-CH"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12751", publisher: "NCSC Switzerland (GovCERT.ch) — Cyber Security Hub", date: "2026-07-07", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/beyondtrust-warns-of-critical-flaws-in-remote-access-software/", publisher: "BleepingComputer", date: "2026-07-07", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12751 → primary (no pivot needed, NCSC-CH advisory cites the vendor advisory directly) → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/beyondtrust-warns-of-critical-flaws-in-remote-access-software/ (vendor advisory bt26-03 itself returned HTTP 403 to direct fetch)"
    summary: |
      NCSC-CH's Cyber Security Hub (TLP:CLEAR) flagged BeyondTrust's 7 July 2026 advisory BT26-03 disclosing four vulnerabilities in Remote Support (RS) and Privileged Remote Access (PRA) appliances. CVE-2026-40138 and CVE-2026-40139 (CVSS 4.0: 9.2, CRITICAL each) are pre-authentication flaws in the authentication subsystem allowing an unauthenticated attacker to bypass access controls and gain administrative access to the appliance; exploitation additionally requires a specific, non-default authentication configuration that BeyondTrust has not made public. Two further high-severity flaws (CVE-2026-40140, CVE-2026-40141) can cause denial of service or unauthorized resource access. Affected versions are RS/PRA 25.3.2 and earlier; fixed in 25.3.3. BeyondTrust's own cloud-hosted customers were already patched as of 21 April 2026 (the fix predates the public advisory); self-hosted customers must apply the April security rollup. No active exploitation has been reported by either BeyondTrust or NCSC-CH. Remote-support/PAM appliances are a high-value target class for any SOC — the same category that SimpleHelp (covered 2026-07-05 weekly) demonstrated can become an RMM supply-chain foothold once compromised.
