  - title: "CVE-2026-48282 — Adobe ColdFusion path traversal now confirmed exploited within two hours of disclosure, CISA KEV-listed with a three-day federal patch deadline"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/max-severity-adobe-coldfusion-flaw-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-07-06", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-max-severity-coldfusion-flaw-by-friday/", publisher: "BleepingComputer", date: "2026-07-08", role: "primary" }
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA Known Exploited Vulnerabilities Catalog", date: "2026-07-07", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (dateAdded 2026-07-07 for CVE-2026-48282) → pivot: WebSearch (\"CVE-2026-48282 Adobe ColdFusion exploited KEV\") → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/max-severity-adobe-coldfusion-flaw-now-exploited-in-attacks/ → primary (KEV-order follow-up): BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-max-severity-coldfusion-flaw-by-friday/"
    summary: |
      CVE-2026-48282 is a CVSS 10.0 path-traversal flaw (CWE-22) in Adobe ColdFusion 2025.9, 2023.20 and earlier that Adobe patched on 1 July 2026 as part of a six-CVE cluster (already covered 2026-07-02). KEVIntel's global honeypot network captured in-the-wild exploitation attempts within under two hours of the patch details going public, and CISA added CVE-2026-48282 to its Known Exploited Vulnerabilities catalog on 7 July 2026 — this is the first confirmed active exploitation for a CVE in that cluster, which shipped with "no exploitation reported yet" at original disclosure. CISA's BOD 26-04 gives FCEB agencies until 10 July 2026 to remediate. Shadowserver telemetry cited by BleepingComputer puts internet-exposed ColdFusion instances at roughly 800. Any internet-facing ColdFusion 2025.9/2023.20-or-earlier instance not yet patched to the 1 July fix should be treated as under active attack, not merely at risk.
    region_nexus: "global; internet-exposed ColdFusion instances in EU/CH public-sector web estates are equally reachable"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector (web application platform)"
    cves: [CVE-2026-48282]
    entity_keys: ["trend:adobe-coldfusion-campaign-apsb26-68-69"]
