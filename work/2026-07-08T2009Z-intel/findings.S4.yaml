    extended_notes: |
      Defender takeaway: this is a credential/secrets-in-repo hygiene story more than
      a novel intrusion technique. Detection hooks for organisations running Azure
      DevOps: audit Microsoft.VisualStudio.Services.Audit logs for anomalous
      repository clone/download volume or clones from unfamiliar egress IPs/ASNs;
      monitor Entra ID sign-in logs for PAT-authenticated Azure Resource Manager /
      DevOps REST API calls from unusual geolocations or impossible-travel patterns;
      run Azure DevOps Advanced Security (secret scanning / push protection) across
      all repos to catch committed RSA/SSH keys, PATs and storage keys before they
      ship; audit Azure Storage account access logs for key-based (as opposed to
      Entra-authenticated) access spikes. Hardening: rotate every credential class
      named in the claim as a precaution regardless of confirmed exposure (RSA, SSH,
      PATs, storage keys); migrate CI/CD auth from long-lived PATs to Entra Workload
      Identity Federation / short-lived OIDC tokens; enforce IP-restricted
      Conditional Access on the Azure DevOps organization. Not included as a
      standalone item: River Financial Corp (RVRF) filed an 8-K/A (Item 1.05) on
      2026-07-06 amending its June 2026 ransomware disclosure (initial access on/about
      2026-06-16, ransomware deployed 2026-06-19) — reviewed and dropped per the
      PD-11 gate: a single small US regional bank holding company, no named actor, no
      novel TTP, and no Swiss/European nexus.
