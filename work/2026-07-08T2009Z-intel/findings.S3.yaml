    summary: |
      Brian Krebs investigated IRIS C2, a Virginia-based startup operated through Calvexa
      Group LLC that publicly advertises payouts of $10,000 to $7 million to vulnerability
      researchers and exploit developers for zero-day submissions, marketed for government
      exploit-acquisition contracts. Krebs identifies the operators as Jacob Wohl and Jack
      Burkman, both with extensive documented histories of telecommunications/robocall fraud
      (a $5.1M FCC fine), securities fraud, a $1M civil-rights settlement, and prior
      fabricated-intelligence-company and pseudonymous AI-lobbying ventures (LobbyMatic). Wohl
      claims IRIS C2 employs 40 people while acknowledging no formal security background. The
      piece carries no technical vulnerability or TTP content; its value is procurement/vendor-
      risk awareness — any government or public-sector body evaluating exploit-acquisition or
      offensive-security vendors should be aware that entities with no security track record
      and principals with felony fraud histories are actively soliciting in this market.
