          aliases: [], summary: "Unit 42's designation for a January-April 2026 Microsoft Teams vishing campaign (150+ targets, 10+ tenants) that pivots from a fake IT-helpdesk voice call to RMM-tool abuse or a PetitPotam NTLM-relay attack against the domain controller (Unit 42, 2026-08-31)." }
    relation_suggestions: []
