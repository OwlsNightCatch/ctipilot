  - title: "Spring Ring — Microsoft Teams vishing from lookalike onmicrosoft.com tenants walks victims from a fake IT help-desk call into an RMM session or a PetitPotam NTLM relay against the domain controller"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/spring-ring-voice-phishing-campaigns/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-31", role: "primary" }
    discovery_trace: "first seen at: mandiant-gtig-adjacent listing sweep — unit42.paloaltonetworks.com/feed/, URL https://unit42.paloaltonetworks.com/feed/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/spring-ring-voice-phishing-campaigns/ (no pivot needed — entry-point post is the primary)"
    summary: |
      Palo Alto Networks Unit 42 documents Spring Ring, a January-April 2026 campaign that approached 150+
      employees across 10+ tenants via external Microsoft Teams chats from spoofed .onmicrosoft.com identities
      impersonating internal IT help desks (e.g. HelpDesk@ITProtectionDepartment.onmicrosoft.com), then pivoted
      to a live voice-phishing (vishing) call to build trust before requesting remote-access action. Two
      divergent post-compromise paths were observed: Campaign A talks the victim into running built-in Quick
      Assist or third-party RMM tools, then delivers an obfuscated PowerShell RAT stager (disables AMSI via the
      amsiInitFailed flag) from attacker domain san-sid[.]com; Campaign B directs the victim to a
      company/employee-name-tailored S3 URL to download an .exe that stages persistence copies, sideloads a
      headless Microsoft Edge extension, then uses Python to run SMB port-445 scanning and a PetitPotam-driven
      NTLM-relay attack coercing the domain controller to authenticate to attacker infrastructure for
      domain-level privilege escalation — blocked in this case by Unit 42 MDR. Detection markers Unit 42
      names: the rapid 1:1-chat-to-unsolicited-audio-call transition, source IPs from commercial VPN/proxy
      services, atypical RMM execution by users with no remote-support need, and access to unfamiliar
      cloud-storage/file-hosting links following a Teams chat.
    region_nexus: "global; abuses Microsoft Teams' default 'Chat with Anyone' external-contact feature present in any tenant, including Swiss public-sector M365 deployments"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1566.004, T1219, T1557.001, T1562.001]
    affected_products: ["Microsoft Teams", "Microsoft Entra ID (Active Directory NTLM authentication)"]
    entity_keys: []
