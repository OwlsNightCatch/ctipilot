    summary: |
      Recorded Future's Insikt Group published its semi-annual Malware and Vulnerability Trends report for H1
      2026 on 2026-09-03. Headline figures: 215 actively exploited CVEs (up 34% from 161 in H1 2025); 176 (82%)
      network-accessible and 146 (68%) exploitable without prior authentication, of which 142 were also
      network-reachable; 82 involved RCE, of which 60 combined network access with no authentication
      requirement — the combination Insikt flags as the priority-patching triage signal over CVSS score alone.
      66 of the 215 (31%) had public PoC exploits; median time-to-exploitation was 31 days (mean 564, reflecting
      a mix of fast zero-day-style exploitation and continued abuse of old flaws — 17 CVEs from 2020 or
      earlier), and 81 (38%) were exploited within 7 days of NVD disclosure including 20 where honeypot activity
      preceded public disclosure. Microsoft remained the top vendor (40 exploited CVEs, +43% YoY), followed by
      Red Hat (15), Cisco (13, eight of them Catalyst SD-WAN Manager), Vercel (11, all Next.js) and Fortinet
      (9). Weakness distribution was fragmented across 83 CWE classes with no single class exceeding 6% (code
      injection CWE-94 led at 13 CVEs). Two named post-exploitation clusters reused identical tool-stacks across
      multiple initial-access CVEs: "StrikeShark" (SharkLoader, Cobalt Strike Beacon, FScan, Searchall, Pillager
      Stealer, SharpGPOAbuse across 13 CVEs spanning Exchange, SharePoint, FortiOS, IOS XE, BIG-IP, GeoServer
      and Apache Shiro, 2016-2025) and a Storm-1175 campaign (Mimikatz, Impacket, PsExec, Rclone, Medusa
      ransomware across 10 CVEs). Of 114 CVEs Insikt mapped to ATT&CK, T1190 (Exploit Public-Facing Application)
      led at 77 CVEs (68%), and 50 of those 77 also involved PowerShell/Windows Command Shell/Unix Shell
      execution, with all 28 web-shell-associated CVEs also carrying T1190 — Insikt's stated defensive signal is
      to chain exploitation telemetry on public-facing systems directly to subsequent process creation, shell
      execution and payload transfer rather than treating the exploit alert in isolation. AI-enabled activity
      (PromptSpy — first GenAI-using Android malware, per ESET; CANFAIL's LLM-generated decoy logic) is assessed
      as concentrated at AIM3 maturity Levels 1-3 (task-level augmentation), not autonomous operation, apart
      from the already-covered Hugging Face incident which Insikt cites as the first case showing
      discovery-through-operationalization with limited human intervention.
