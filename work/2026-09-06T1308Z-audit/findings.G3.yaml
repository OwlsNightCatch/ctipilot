  - title: "A password-spraying campaign hit AWS root-user console logins at 150+ organisations across a month, using two fixed browser user agents and proxy/hosting-infrastructure source IPs — no successful login observed, motive unconfirmed"
    sources:
      - { url: "https://securitylabs.datadoghq.com/articles/aws-root-user-bruteforce-campaign/", publisher: "Datadog Security Labs", date: "2026-08-31", role: "primary" }
    discovery_trace: "first seen at: RSS feed securitylabs.datadoghq.com/rss/feed.xml, URL https://securitylabs.datadoghq.com/rss/feed.xml → primary: Datadog Security Labs, URL https://securitylabs.datadoghq.com/articles/aws-root-user-bruteforce-campaign/ (no pivot needed)"
    summary: |
      Datadog Security Research observed a password-spraying campaign against AWS account root-user console
      logins running 24 July - 23 August 2026, hitting 150+ organisations with a median of two failed attempts
      each (up to eight). The campaign is fingerprinted by two static user agents (a Chrome/Edg 85.x string and
      a Firefox/120.0 string) and by source IPs spanning many countries/ASNs that threat-intel sources flag as
      hosting or residential-proxy infrastructure. Because a failed root-user ConsoleLogin CloudTrail event
      requires the root account's registered email address to generate at all, the attacker either already
      held a list of valid root-user emails or brute-forced through a candidate list until landing valid ones —
      meaning email enumeration, not just password guessing, is embedded in the technique. No successful
      authentication was observed and targeting shows no clear victimology by country or industry. Datadog
      supplies the exact CloudTrail query to check exposure: source:cloudtrail
      @userIdentity.type:Root @eventName:ConsoleLogin @responseElements.ConsoleLogin:(Failure OR Success)
      filtered on the two named user agents.
    region_nexus: "global; any organisation, including Swiss public-sector bodies, running AWS accounts is a potential target regardless of sector"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1110.003, T1078.004]
    affected_products: ["Amazon Web Services (AWS IAM root user / CloudTrail ConsoleLogin)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "attackers made repeated failed authentication attempts against AWS root user accounts at more than 150 organizations"
        attribution: "Datadog Security Labs"
        source_url: "https://securitylabs.datadoghq.com/articles/aws-root-user-bruteforce-campaign/"
      - quote: "generating a failed `ConsoleLogin` API call requires the email address associated with the root user account. This means the attacker either already had a list of root user email addresses, or brute forced through a list of account email addresses until finding a valid one."
        attribution: "Datadog Security Labs"
        source_url: "https://securitylabs.datadoghq.com/articles/aws-root-user-bruteforce-campaign/"
    extended_notes: |
      Datadog explicitly declines to assess intent given no successful login was observed; carried here as an
      unattributed reconnaissance/credential-access campaign with a concrete, low-cost detection query rather
      than as a confirmed intrusion.

  - title: "A tampered Exodus wallet installer ships a real, working crypto wallet that can never open its own window — three files rewritten to hide a JavaScript FFI loader that reflectively maps a six-module RAT into memory, detected 0/76 on VirusTotal"
    sources:
      - { url: "https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat", publisher: "Huntress", date: "2026-09-01", role: "primary" }
    discovery_trace: "first seen at: RSS feed huntress.com/blog/rss.xml, URL https://www.huntress.com/blog/rss.xml → primary: Huntress, URL https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat (no pivot needed)"
    summary: |
      Huntress documents four July-August 2026 intrusions (three within 85 minutes of each other on 18 August)
      delivered via a trojanized Exodus crypto-wallet installer reached through disguised .pdf.js scripts run
      from the browser download bar (opening a genuine decoy PDF via Storyblok CDN while silently msiexec-installing
      an MSI) or via a double-extension .zip.116\ Explorer-staged JS file; a third route found on the same
      delivery IP but never observed in the wild uses a search-ms: URI redirect over WebDAV (@8080) to run a
      file straight out of an "Open Windows Explorer?" prompt with no command line and no download step at all.
      The 201 MB MSI installs a genuine, functional Exodus 24.33.4 wallet (launched via explorer.exe so
      Exodus.exe re-parents under the shell rather than under msiexec, and runs with no admin rights from
      %APPDATA%). Three files inside the wallet's app.asar were altered: exodus_patch.js is new and, once
      deobfuscated from 169,907 to 3,349 bytes, overrides Electron's BrowserWindow.show/focus/center to no-ops
      and denies every permission request — so the wallet fully initialises and runs but no window, taskbar
      entry or Alt-Tab target is ever created. keystorage.js (real filename, replaced contents, 50 MB, 99.97%
      padding) contains, once its string-array/rotation obfuscation is unwound, koffi FFI declarations for
      VirtualAlloc/WriteProcessMemory/GetProcAddress/CreateThread/RtlAddFunctionTable — a hand-written reflective
      PE loader in JavaScript — decrypting a 10 MB AES-256-CBC blob (static key/IV recovered from the same
      string array) into a six-module RAT (remote command execution, file management, and in-progress browser
      credential/cookie/extension theft modules observed) that never touches disk and was not on VirusTotal.
      The tampered MSI itself scored 0/76 on VirusTotal at analysis time.
    region_nexus: "global; no sector or region targeting observed — opportunistic cryptocurrency-user targeting"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1204.002, T1027, T1620, T1036.005]
    affected_products: ["Exodus (cryptocurrency wallet, Electron desktop app)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "At the time of analysis it was detected by 0 of 76 engines on VirusTotal."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat"
      - quote: "BrowserWindow.prototype.show   = function () {};\n  BrowserWindow.prototype.focus  = function () {};\n  BrowserWindow.prototype.center = function () {};"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat"
      - quote: "That is a manual Portable Executable (PE) loader, or reflective loading if you prefer that name for it, written in JavaScript and running inside a wallet."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat"
    extended_notes: |
      Huntress frames the theft target as credentials, not coins — "a whole lot more" than the wallet contents
      — because the observed modules are RMM-style RAT capabilities (cmd/fileman/browser-credential-theft) not
      a wallet-seed-phrase grabber; the browser-credential module description was cut off in the fetched extract
      at the point capability enumeration continued, so treat the module table as partial (three of six named
      confidently: cmd, fileman, browser).

  - title: "Ted backdoor and curlRAT: DPRK-nexus actor compiles a custom C2 filter directly into HAProxy 2.8.12's own source and trojanizes crond/agetty/atd/sshd/polkitd on South Korean automotive and media edge servers"
    sources:
      - { url: "https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/", publisher: "Rapid7", date: "2026-09-04", role: "primary" }
    discovery_trace: "first seen at: RSS feed blog.rapid7.com/rss.xml, URL https://blog.rapid7.com/rss.xml → primary: Rapid7, URL https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/ (no pivot needed)"
    summary: |
      Rapid7 Labs documents a previously undocumented Linux toolkit, attributed with medium confidence to
      DPRK-nexus actors (hardcoded C2 infrastructure overlaps ThreatFox/maltrail APT37 tags), active against
      South Korean automotive and media organisations with an edge webserver exposing ports 80/443/25 (likely
      Groupware-portal or mail-server RCE consistent with documented Kimsuky tradecraft, though the specific
      CVE is unconfirmed). "Ted backdoor" is a custom filter compiled directly into the victim's own HAProxy
      2.8.12 source tree (18 MB rebuilt binary) using HAProxy's native filter API to hook the HTTP parser: it
      registers a trigger on the endpoint path /favorite_list_2x_m500_ico.jpg, at which point it decrements
      HAProxy's own connection/traffic counters to erase evidence, zeroes the forwarding buffers so the C2
      request never reaches a backend (the request is fully absorbed at the load balancer, so nothing appears
      in backend logs), and dispatches command execution / file upload / file download / config-update opcodes
      over named FIFO pipes, working across HAProxy's master-worker process model. A companion "curlRAT" (named
      for its libcurl-based HTTP(S) polling) is compiled into replacement builds of crond, agetty, atd and
      polkitd, decrypts its C2 configuration and payload data with a rolling XOR/Base64 scheme, supports six
      opcodes (command execution via popen, config rewrite, staged payload drop, root-forcing reverse shell via
      setuid(0)/setreuid(0,0), beacon, and a full interactive PTY shell), defaults to a 12-hour poll interval
      with an operator-toggleable 30-second fast-poll mode, and runs a companion watchdog thread that only
      activates inside virtualized hosts (gated on /usr/lib/libvirtlog.so.0) and reports HAProxy process health
      (started/stopped/restarted/reloaded, tracked via PID-file timestamp changes) back to the C2. A related SSH
      keylogger writes intercepted plaintext credentials, custom-cipher-encrypted, to
      /var/lib/sshd/<hash>, and the stager selectively erases tmp/wget/cron/crond keyword lines from
      /root/.bash_history and /var/log/{messages,audit/audit.log,cmd.log,secure,syslog,auth.log} using a staging
      file named /tmp/jasper-log designed to be mistaken for old Apache Tomcat JSP engine activity.
    region_nexus: "South Korea (automotive, media); technique class — trojanizing network-appliance/system daemon binaries compiled from source rather than replacing them wholesale — is transferable to any organisation running self-built HAProxy load balancers or Linux edge infrastructure"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1554, T1056.001, T1071.001, T1027, T1070.002]
    affected_products: ["HAProxy 2.8.12", "Linux (crond, agetty, atd, sshd, polkitd system daemons)"]
    entity_keys: []
    new_entities:
      - { key: "malware:ted-backdoor", type: malware, name: "ted backdoor",
          aliases: ["ted_plugin"], summary: "A custom HAProxy filter-module backdoor, named by its own developer in debug strings, compiled directly into HAProxy 2.8.12's source tree to intercept/inject HTTP traffic and run a hidden C2 dispatcher; attributed with medium confidence to DPRK-nexus actors targeting South Korean automotive/media edge servers (Rapid7, 2026-09-04)." }
      - { key: "malware:curlrat", type: malware, name: "curlRAT",
          aliases: [], summary: "Rapid7's name (from its libcurl-based HTTP(S) polling) for a Linux RAT compiled into replacement crond/agetty/atd/polkitd binaries, supporting command execution, file transfer, config update, a root-forcing reverse shell and an interactive PTY shell; deployed alongside the ted backdoor against South Korean targets (Rapid7, 2026-09-04)." }
    relation_suggestions:
      - { subject: "malware:ted-backdoor", object: "malware:curlrat",
          basis: "Rapid7: the stager checks for HAProxy or cron presence and deploys curlRAT alongside/complementary to the ted backdoor as part of the same toolkit (Rapid7, 2026-09-04)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The ted backdoor is compiled as part of the victim's existing HAProxy version 2.8.12. It uses its native filter API, internal memory pools, event scheduler, and process management infrastructure to intercept traffic and hide from monitoring"
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/"
      - quote: "the list of C2s hardcoded is associated to APT37 by ThreatFox and maltrail"
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/"
    extended_notes: |
      Rapid7 states the specific initial-access CVE is unconfirmed; the attack-chain figure is the vendor's own
      partial reconstruction, not confirmed forensics. Hunting angle for Tier 2/3: file-integrity/hash
      verification of HAProxy and core system-daemon binaries against known-good vendor packages, since this
      technique defeats detections keyed on "unexpected new binary" (T1554) by rebuilding from source rather
      than swapping a foreign binary in.

  - title: "Check Point publishes a public static-deobfuscation pipeline for JSCeal's compiled V8 bytecode payloads, exposing keylogging, browser/credential theft and a local HTTPS man-in-the-middle proxy inside the crypto-stealer (aka WEEVILPROXY / MeadowLocust)"
    sources:
      - { url: "https://research.checkpoint.com/2026/breaking-the-seal-static-deobfuscation-of-jsceals-compiled-v8-bytecode/", publisher: "Check Point Research", date: "2026-08-31", role: "primary" }
    discovery_trace: "first seen at: RSS feed research.checkpoint.com/feed/, URL https://research.checkpoint.com/feed/ → primary: Check Point Research, URL https://research.checkpoint.com/2026/breaking-the-seal-static-deobfuscation-of-jsceals-compiled-v8-bytecode/ (no pivot needed)"
    summary: |
      Check Point Research (presented at Black Hat USA 2026) publishes a fully static deobfuscation
      methodology and public toolkit (jsc_deobfuscator, extending the open-source View8 V8-bytecode decompiler)
      for JSCeal, a cryptocurrency-focused stealer it has tracked since early 2025 (also tagged WEEVILPROXY /
      MeadowLocust by other vendors) that is delivered as compiled V8 bytecode (.jsc, run via a bundled Node.js
      runtime with `node.exe -r preflight.js app.jsc`) rather than plaintext JavaScript — a format poorly
      served by existing reverse-engineering tooling because it is both obfuscated with the public
      javascript-obfuscator tool (RC4-protected strings, control-flow flattening, proxy/operation-wrapper
      indirection) before compilation and then version-locked to a specific V8 build. Applied to 23 collected
      JSCeal payloads, the pipeline produced analysable pseudocode in every case, enabling capability analysis
      of keylogging, browser and credential theft, screenshot capture, and a local HTTPS-interception proxy
      that man-in-the-middles the victim's own traffic. The delivery chain runs malvertising into chained
      PowerShell into two ZIPs (node.zip, a packaged Node.js runtime; build.zip, containing winpty-agent.exe /
      winpty.dll for a hidden console, the Brotli-compressed app.jsc payload, and native PE .node modules).
