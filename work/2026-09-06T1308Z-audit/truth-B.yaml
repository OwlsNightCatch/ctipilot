- entry: entries/2026-08-31/watchguard-fireware-ike-vpn-preauth-rce-epm-overflow.md
  verdict: factual-error
  defect: >
    The cves[] `affected`/`fixed` fields for all four iked-family CVEs (CVE-2026-19313, CVE-2026-19315,
    CVE-2026-13086, CVE-2026-19318) omit a second affected version range and its fix that WatchGuard's
    own PSIRT pages list explicitly. Each PSIRT page's Product Status table carries a SECOND affected
    band -- for 19313/19318 it is "T15/T35: >= 2026.3, < 2026.3.1"; for 19315/13086 it is
    "Default: ... >= 2026.3, < 2026.3.1" -- and each page's Solution section lists "Fireware OS 2026.3.1"
    alongside 2026.2.2/12.12.2/12.5.20. The entry's affected/fixed strings cover only the
    2025.0-2026.2.2 / 12.0-12.12.2 / 12.0-12.5.20 bands and never mention 2026.3.x or the 2026.3.1 fix.
    A defender running the 2026.3.0 branch (T15/T35, or Default depending on the CVE) reading only this
    entry's structured affected range would see no match and could conclude their appliance is
    unaffected, when WatchGuard's own advisory places it squarely in scope. This recurs identically
    across 4 of the entry's 5 CVE records (CVE-2026-78174/Dimension is unaffected by this gap;
    its affected/fixed ">= 2.0, < 2.3.1" / "2.3.1" matches the PSIRT page exactly).
  ground_truth: >
    psirt.watchguard.com/CVE-2026-19313/ Product Status table: "T15/T35 | >= 12.0, < 12.5.20, >= 2026.3,
    < 2026.3.1 | >= 12.5.20, >= 2026.3.1"; Solution: "Fireware OS 2026.3.1, Fireware OS 2026.2.2,
    Fireware OS 12.12.2, Fireware OS 12.5.20." The identical extra band/fix appears verbatim on the
    CVE-2026-19315, CVE-2026-13086 and CVE-2026-19318 PSIRT pages (raw HTML `ps-sub`/`ps-aff`/`ps-naff`
    table rows), confirmed by direct fetch of each page.
  ground_truth_url: "https://psirt.watchguard.com/CVE-2026-19313/ ; https://psirt.watchguard.com/CVE-2026-19315/ ; https://psirt.watchguard.com/CVE-2026-13086/ ; https://psirt.watchguard.com/CVE-2026-19318/"

- entry: entries/2026-08-31/zero-logement-vacant-metabase-breach-zerobytes.md
  verdict: imprecision
  defect: >
    (low confidence) The entry surfaces a genuine disagreement between ZATAZ ("tax identifiers") and
    Clubic ("property identifiers of the owners") for the same national DataFoncier/DGFiP dataset, and
    attributes each reading to its source inline -- but does not use an explicit "Contradiction:" label
    as the org convention calls for (check 9: "the main agent adds a Contradiction: line, it never
    silently resolves"). The disagreement is not silently resolved (both readings are given with
    citations), so this is a formatting/labeling nicety rather than a suppressed fact.
  ground_truth: >
    ZATAZ 2026-08-30: "ces fichiers contiendraient notamment des noms, dates de naissance, adresses et
    identifiants fiscaux" (tax identifiers). Clubic 2026-08-30: "...pour obtenir noms, dates de
    naissance, adresses postales et identifiants immobiliers des propriétaires" (property/real-estate
    identifiers). All other figures (148,929,194 rows; 82,043,407 + 66,874,995 table breakdown; 13
    public dashboards; 10,729 emails / 6,847 phones; 48-71M dedup range; platform still offline) match
    both sources verbatim.
  ground_truth_url: "https://www.zataz.com/zero-logement-vacant-vise-par-une-fuite-massive/ ; https://www.clubic.com/actualite-627343-zero-logement-vacant-pirate-148-9-millions-de-lignes-de-donnees-revendiquees-par-zerobytes.html"

