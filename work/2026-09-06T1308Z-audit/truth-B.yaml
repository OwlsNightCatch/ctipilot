- entry: entries/2026-09-03/gitspawn-ai-coding-agent-git-config-hijack.md
  verdict: imprecision
  defect: >
    (low confidence) The cves[] record for CVE-2026-19592 lists cvss "7.3 (CVSS3.1)", but none of the
    entry's three cited sources (Manifold Security, The Hacker News, heise) states this figure --
    The Hacker News explicitly says of CVE-2026-72718 (Goose) that GitHub's 7.0 score is "the only
    score any of these findings carries," which on its face implies CVE-2026-19592 carries none in the
    cited reporting. I independently queried the NVD REST API (not a citable source per the hard-block
    list, but usable as ground truth) and confirmed 7.3 / CVSS:3.1/AV:L/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H
    IS the correct, authoritative score for CVE-2026-19592 -- so the number itself is accurate, but it
    is not traceable to anything a reader can check from the entry's own citations, and the entry does
    not flag that its own cited Hacker News source seems to say the opposite.
  ground_truth: >
    NVD REST API (services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-19592): cvssMetricV31
    baseScore 7.3, vectorString CVSS:3.1/AV:L/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H -- matches the entry's
    frontmatter figure exactly, but this authority is not among the entry's sources[] and is not cited
    for that number anywhere in the body.
  ground_truth_url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-19592 ; https://thehackernews.com/2026/09/malicious-git-configs-can-make-claude.html ; https://www.manifold.security/blog/ai-coding-agents-git-hijack"
