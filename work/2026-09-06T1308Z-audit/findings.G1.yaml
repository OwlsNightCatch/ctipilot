    extended_notes: |
      Single-sourced to Cisco's own advisory (no independent secondary coverage found in this pass) — reduced confidence noted accordingly, though Cisco PSIRT as first-party vendor advisory for its own product would normally carry the national-CERT-equivalent carve-out for vendor self-disclosure. Borderline for this constituency: IOS XR is service-provider/carrier-grade gear, less likely to sit inside a cantonal/communal administration's own network versus its upstream telecom/ISP supplier — flagging as `watchlist: none` but potentially relevant via supplier chain. The "frontier AI models" detail in Cisco's own internal-testing disclosure is a notable data point for the AI-assisted-vulnerability-discovery trend line this store already tracks from the attacker side (gtig-avdh, unit42 AI-enabled malware) — this is the discovery side from a vendor.
    borderline: true
    borderline_reason: "single-sourced, no confirmed exploitation, carrier-grade product with lower direct footprint in Swiss cantonal/communal administration networks (more relevant to upstream telecom suppliers)"

  - title: "SEPPmail Secure E-Mail Gateway 15.0.7: authenticated admin command injection (CVSS 8.6) and an MFA-completion-order flaw"
    sources:
      - { url: "https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html", publisher: "SEPPmail release notes (ERN15.0)", date: "2026-09-02", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3178", publisher: "BSI CERT-Bund (WID-SEC-2026-3178)", date: "2026-09-04", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (WID-SEC-2026-3178 item) → primary: SEPPmail release notes, URL https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html"
    summary: |
      SEPPmail (a Swiss/DACH-region secure e-mail gateway vendor) shipped version 15.0.7 on 2026-09-02, fixing CVE-2026-84830 (CVSS 8.6): an authenticated administrator can execute commands with elevated privileges because affected input values are not escaped ("all affected values will be escaped not" per the vendor's own release-note typo, confirming the fix is an escaping gap in command construction). The same release also fixes an unassigned-CVE flaw ("SEC-100", CVSS 7.7) where, under certain conditions, the authentication flow could grant access before all required multi-factor authentication steps completed, and a related command-execution issue ("SEC-99", CVSS 8.6) in processing of specially crafted input. All three require either existing admin authentication (command injection) or hitting a specific MFA-flow race/ordering condition; none is reported as pre-auth or exploited in the wild.
    region_nexus: "Switzerland/DACH — SEPPmail is a Swiss-headquartered secure e-mail gateway vendor with public and private-sector customers across the DACH region"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-84830]
    techniques: [T1068, T1556]
    affected_products: ["SEPPmail Secure E-Mail Gateway"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "SEPPmail Secure Email Gateway before 15.0.7 contains a command injection vulnerability that allows authenticated administrators to execute commands with elevated privileges."
        attribution: "SEPPmail (release notes, republished via BSI CERT-Bund WID-SEC-2026-3178)"
        source_url: "https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html"
      - quote: "Under certain conditions, the authentication process could allow a user to gain access before all required multi-factor authentication steps had been completed."
        attribution: "SEPPmail (release notes)"
        source_url: "https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html"
    extended_notes: |
      Flagged for Swiss-vendor nexus rather than severity alone — SEPPmail is a Swiss company and its Secure E-Mail Gateway is deployed by public and private-sector organizations across Switzerland/DACH for encrypted e-mail. Requires admin authentication for the command-injection path (not internet-facing anonymous), so this is a patch-hygiene item rather than an urgent out-of-band action; included as borderline given the org profile's Switzerland-at-the-centre coverage focus.
    borderline: true
    borderline_reason: "post-auth prerequisite for the scored CVE; included for Swiss-vendor nexus rather than pre-auth severity"

