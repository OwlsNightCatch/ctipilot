  item: "2026-09-06/chaotic-eclipse-falconflank-prettyprague-edr-av-lpe-drops"
  url_or_quote: "\"Gen Digital confirmed a vulnerability \\\"affecting a subset of Gen products...\\\" and said it is \\\"actively developing a patch\\\"... The third drop, HardBreacher... Kaspersky told the same outlet the fix ships... A fourth release, GreenSection, is a memory-corruption crash in NVIDIA drivers...\""
  summary: "The PrettyPrague paragraph carries exactly one inline citation (mid-paragraph, after the AVG/Norton clause), then three further sentences with zero citations of their own — including a direct quote from a Gen Digital spokesperson. Every fact here is verified accurate against The Hacker News (fetched this iteration: article confirms the Gen Digital quote verbatim, the Kaspersky fix mechanism, and the GreenSection Vulkan/OpenGL crash detail), but the entry's own convention elsewhere (the FalconFlank paragraph immediately above cites every sentence individually) makes the drop here inconsistent. Per check 3 / adjacency check 2(d), each clause needs its own citation."
