- code: F4
  category: hallucinated-fact
  section: updated-entries
  item: "2026-07-31/unit42-autonomous-deepseek-hermes-netscaler-cve-2026-3055"
  url_or_quote: "updates[] record at: \"2026-08-19T04:45:00Z\" — summary changed from 'an EPSS of 55.85 but mirrors CISA' to 'an EPSS probability of 0.5585 but mirrors CISA'"
  summary: "The 2026-09-06 correction record edited the SUMMARY TEXT of an earlier (2026-08-19) changelog record in place — confirmed via git diff HEAD. docs/pipeline.md rule 3 and hard invariant #19 state records are append-only and 'never edited... by a later fire'; what is revisable is 'the frontmatter, the main analysis, and the text of earlier `## <Type> — <at>` sections', which does not include a past record's own `summary:` field. The new record's `fields: [cves, body]` also does not name this edit, and its own summary says the fix landed 'in the CVE record and in both places the body quoted the bare number' — one of those two places was in fact the frontmatter `updates[]` list, not the body. check_run.py's silent-edit check cannot catch this (it only requires a NEW record for a changed file, never diffs old records' content), so this reached the mechanical gate clean."
