  defect: "(low confidence) The frontmatter summary states the unauthorized party 'accessed its C-Track court case-management platform between March and 30 June 2026' — framing this as a continuous access window. The primary source (C-Track's own notice) states only that files were obtained 'in March 2026' and that C-Track 'discovered' the unauthorized activity on June 30, 2026 — i.e. a single access point followed by a 3-month detection lag, not necessarily continuous access through June 30. The entry's own body text is more careful and correct ('obtained files... in March 2026, discovered on 30 June 2026'). That said, Tech Times' corroborating account explicitly frames it as '[a]n unauthorized party spent approximately four months inside Thomson Reuters' cloud environment... before anyone noticed' and 'the intrusion began in March 2026... detected it on June 30' — which does support a continuous-access reading, so the summary is not unsupported by any cited source, just less precise than the primary victim notice and inconsistent with the entry's own (more careful) body phrasing."
