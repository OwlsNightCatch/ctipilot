  - title: "Germany abandons planned constitutional amendment (Grundgesetzänderung) that would have made BSI a central federal cyber-defense authority — federal-state cyber-response coordination stays fragmented across 16 Länder"
    sources:
      - { url: "https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html", publisher: "heise online (Stefan Krempl)", date: "2026-09-04", role: primary }
      - { url: "https://www.netzwelt.de/news/258190-bund-stoppt-bsi-grundgesetzaenderung-deutschlands-cyberabwehr-flickwerk-bleibt.html", publisher: "netzwelt.de", date: "2026-09-04", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"BSI Grundgesetzänderung Kehrtwende Bund Unabhängigkeit heise\") → primary: heise online, URL https://www.heise.de/news/Kehrtwende-bei-Cybersicherheit-Bund-gibt-Plan-fuer-BSI-Grundgesetzaenderung-auf-11440646.html (fetched in full)"
    summary: |
      The German federal government has dropped its coalition-agreement plan to amend the Grundgesetz
      (Basic Law) to make the BSI (Federal Office for Information Security) a true central
      cyber-defense authority able to act proactively against attacks on state (Land) and municipal
      systems without waiting for an explicit request for administrative assistance — the same
      constitutional gap that a Bundestag response to Green vice-faction-leader Konstantin von Notz
      confirms the BMI (Federal Interior Ministry) will now leave unaddressed. Instead of the
      constitutional reform, the BMI says it will lean on the existing framework, bilateral
      federal-state cooperation agreements, and NIS2-transposition mechanisms. Critics (von Notz;
      Bitkom industry association) call the reversal "simply catastrophic for Germany's IT
      security" and warn the federal "patchwork" (Flickenteppich) in cyber-defense responsibility —
      split across 16 Länder — creates severe response-time vulnerabilities during live incidents
      such as the still-unfolding Berlin Landesnetz/Rhysida compromise this store already tracks.
      No new obligation is created or removed by this news — it is the confirmation that a
      previously-planned obligation change will NOT happen — which is itself the reportable delta
      for a public-sector reader tracking DACH cyber-governance structure, including by direct
      federalism analogy to Switzerland's own cantonal/federal split in incident response authority.
    region_nexus: "Germany (DACH)"
    primary_sector_nexus: "indirect — federal cybersecurity governance/authority structure, transferable federalism lesson for Swiss federal/cantonal split"
    sector: "public-sector"
