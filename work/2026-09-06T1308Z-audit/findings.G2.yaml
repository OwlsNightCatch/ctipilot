  - title: "NovoCure (Baar/Zug-headquartered oncology device maker): unauthorized-access incident disclosed via SEC 8-K, ~1,400 US patient IDs and employee contact data exposed — no attacker, vector, or ransomware family named"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/1645113/000164511326000065/nvcr-20260901.htm", publisher: "U.S. SEC EDGAR (NovoCure Limited Form 8-K, Item 8.01)", date: "2026-09-01", role: primary }
      - { url: "https://www.swisscybersecurity.net/news/2026-09-02/onkologiekonzern-novocure-erleidet-einen-cyberangriff", publisher: "SwissCybersecurity.net", date: "2026-09-02", role: corroborating }
      - { url: "https://www.bleepingcomputer.com/news/security/novocure-data-breach-affects-more-than-1-400-cancer-patients/", publisher: "BleepingComputer", date: "2026-09-02", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Schweiz Gemeinde Kanton Cyberangriff Datenleck September 2026\") surfaced SwissCybersecurity.net coverage naming Novocure's Baar/Zug HQ → pivot: WebSearch (\"Novocure cyberattack data breach SEC 8-K patient data\") → primary: SEC EDGAR, URL https://www.sec.gov/Archives/edgar/data/1645113/000164511326000065/nvcr-20260901.htm (fetched and read in full via bridge)"
    summary: |
      NovoCure Limited — legally domiciled in Jersey but whose global operational headquarters
      SwissCybersecurity.net places in Baar, canton Zug — disclosed in a Form 8-K (Item 8.01,
      filed 2026-09-01) that in mid-August 2026 a subsidiary detected unauthorized access to some
      of its information systems. The company's own investigation states the exposed data
      comprised internal patient ID numbers for over 1,400 U.S. patient records (explicitly not
      accompanied by names or other identifying data), fewer-than-50 additional U.S. patient
      records that did include identifying information, general contact information for partner
      healthcare providers, and general contact information (job titles, phone numbers) for
      Novocure employees. No medical treatment device was accessed and the company states its
      operations were not disrupted. Critically, NEITHER the 8-K nor any secondary reporting
      found this run names an access vector, an attacker, or a ransomware/extortion family — the
      filing states only "unauthorized access to some of its information systems."
      This is structurally identical to the still-open Boston Scientific watch item this store
      already carries under the same blocking condition (PD-11(c) nexus test satisfied — a
      Swiss-headquartered medtech manufacturer with implantable-device and hospital-facing
      operations — but no attacker-behavior fact exists to hang an ATT&CK mapping on). Recommend
      the main agent treat this as a NEW open watch item on `state/coverage_backlog.md` rather than
      composing an `incident` entry, exactly per the precedent already established for Boston
      Scientific: publish the moment a forensic vendor, the company itself, or a leak-site listing
      names a mechanism.
    region_nexus: "Switzerland (Baar/Zug operational HQ) / United States (affected patient population)"
    primary_sector_nexus: "indirect — medtech/healthcare, not core public-sector, but Swiss-domiciled corporate nexus"
    sector: "public-sector"
