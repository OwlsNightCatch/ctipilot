  - title: "Sekoia and Kudelski Security (Swiss) publish a joint reassessment of DPRK's offensive-cyber organization, splitting the 'Lazarus umbrella' into six named clusters and documenting RaaS adoption (Play, Qilin) by nominally-espionage units"
    sources:
      - { url: "https://kudelskisecurity.com/research/beyond-lazarus-organization-of-dprk-cyber-capabilities", publisher: "Kudelski Security (Switzerland)", date: "2026-09-07", role: "primary" }
      - { url: "https://www.sekoia.com/blog/beyond-lazarus-organization-of-dprk-cyber-capabilities", publisher: "Sekoia", date: "2026-09-07", role: "primary" }
    discovery_trace: "first seen at: kudelski-security, URL https://kudelskisecurity.com/research-blog → primary: Kudelski Security's own article, URL https://kudelskisecurity.com/research/beyond-lazarus-organization-of-dprk-cyber-capabilities (co-published verbatim at Sekoia, URL https://www.sekoia.com/blog/beyond-lazarus-organization-of-dprk-cyber-capabilities)"
    summary: |
      Sekoia's TDR team and Kudelski Security (a Switzerland-based security firm) jointly published, on 2026-09-07, a reassessment of how DPRK's offensive-cyber apparatus is organized — relevant to Swiss defenders both as an actor-tracking update (DPRK clusters routinely target government, defense and financial-sector organizations worldwide) and because the co-author is a domestic Swiss research firm.

      The core claim, attributed to the two authoring teams' own clustering analysis: the historical "Lazarus" umbrella should now be tracked as six distinct sub-clusters — TEMP.Hermit, Citrine Sleet, CryptoCore, Jade Sleet, Moonstone Sleet, and Famous Chollima (the last already tracked in this store as an alias of actor:purpledelta, the North Korean fraudulent-IT-worker cluster) — each with a different primary mandate: strategic espionage (inheriting Lazarus/Kimsuky lineage), dual espionage-plus-revenue operations, and pure financially-motivated crime. The authors state APT38 has itself split into CryptoCore and Jade Sleet, both exclusively financially motivated and focused on cryptocurrency/Web3/blockchain targets. The report also documents that "Reaper" — already tracked here as an alias of actor:scarcruft (ScarCruft/APT37) — is the cluster aligned with North Korea's newly renamed National Intelligence Agency (formerly the Ministry of State Security, renamed June 2026), tasked with surveillance of defectors and South Korean NGOs/activists.

      Concrete, hunting-relevant facts the authors report: Andariel (a dual-mandate cluster under the GRIB, ex-RGB) has used custom ransomware (Maui, H0lyGh0st) and, per Unit 42's prior reporting the authors cite, collaborated with the Play ransomware-as-a-service operation in 2024. Moonstone Sleet deployed its own custom malware (FakePenny) in 2024 and separately adopted the Qilin RaaS in 2025 — within two months of Andariel's own RaaS adoption, which the authors read as a pattern of nominally espionage-focused DPRK clusters increasingly renting commodity ransomware infrastructure rather than only running bespoke tooling. Kudelski Security's own separate prior research (cited in this report) found that DPRK fake-IT-worker infrastructure and offensive-APT infrastructure share the same VPN exit nodes — a concrete pivot point for defenders correlating IT-worker fraud indicators against APT intrusion infrastructure. The report also documents a Cambodia-based money-laundering hub (Huione Group) that the US Treasury's FinCEN has flagged for direct ties to North Korean actors, with an estimated $37.6M in DPRK-linked cryptocurrency laundered through it between 2021 and 2025.

      Defender takeaway: organizations maintaining DPRK actor-tracking (threat intel feeds, IOC allow/deny lists keyed to vendor cluster names) should map internal designations against this consolidated six-way Lazarus split, and should treat RaaS indicators (Play, Qilin) as potentially DPRK-nexus rather than purely criminal when other DPRK tradecraft is present, given the authors' documented cross-over.
