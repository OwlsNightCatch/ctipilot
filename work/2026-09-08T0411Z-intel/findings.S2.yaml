  - title: "BSI confirms the Berlin state-government breach ran through TerminalFix (a ClickFix variant abusing Windows Terminal), names Rhysida's operator as \"Vice Spider\", and reveals the 5.7 TB leak included Bundeswehr and civil-defense documents"
    sources:
      - { url: "https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html", publisher: "heise online", date: "2026-09-07", role: "primary" }
      - { url: "https://www.heise.de/news/Gefahr-fuer-die-nationale-Sicherheit-Berliner-Datenleck-schlaegt-hohe-Wellen-11444301.html", publisher: "heise online", date: "2026-09-07", role: "primary" }
      - { url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile", publisher: "BSI (German federal cyber authority) — BITS-2026-287419-1032, TLP:CLEAR", date: "2026-09-04", role: "primary" }
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/", publisher: "Microsoft Threat Intelligence", date: "2026-08-28", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → pivot: heise, URL https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html → pivot: heise, URL https://www.heise.de/news/Gefahr-fuer-die-nationale-Sicherheit-Berliner-Datenleck-schlaegt-hohe-Wellen-11444301.html → primary: BSI's own TLP:CLEAR advisory referenced by both heise articles, URL https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile"
    summary: |
      This is a material technical and scope update to the already-tracked Berlin Landesnetz/Rhysida incident (entity incident:berlin-landesnetz-compromise-2026-08) and the already-tracked TerminalFix campaign (entity campaign:terminalfix-clickfix-reverse-tunnel-2026), published by BSI (Germany's federal cyber authority) and confirmed via heise's 2026-09-07 reporting.

      Facts, per BSI's own TLP:CLEAR advisory BITS-2026-287419-1032 (04.09.2026) and its 2026-09-07 Mastodon confirmation that this campaign is what breached the two Berlin Senate administrations (Stadtentwicklung/Bauen/Wohnen and Mobilität/Verkehr/Klimaschutz/Umwelt): the chain is a fake-Cloudflare-CAPTCHA lure on a compromised or watering-hole webpage that instructs the victim to open Windows Terminal (Win+X, then I) rather than the classic ClickFix Run-dialog (Win+R) — BSI names this variant "TerminalFix". The victim pastes a PowerShell command from the clipboard (placed there by page JavaScript) that downloads and runs a ZIP archive while the fake CAPTCHA displays a bogus success state. The archive contains a legitimate signed binary (LockScreenContentServer.exe) that side-loads a malicious dui70.dll; the DLL pulls further PNG image files from attacker infrastructure that hide additional payload code and DLLs via steganography. Persistence is a registry Run key plus an hourly scheduled re-check, with files/directories hidden from Explorer. The malware then enumerates domains, Active Directory, servers and backup systems to size up the target's value, and BSI states operators have in some cases staged an Azure cloud-storage container (using azcopy) for later exfiltration, and separately install a Python-based reverse tunnel that opens a persistent SOCKS-proxy channel to the victim network over TLS/WebSockets on port 443 — commands executed inside that Python runtime may not be logged. BSI states some incidents involving this chain saw ransomware deployment attempted and double-extortion data theft.

      BSI attributes the Rhysida ransomware/leak-site operation to a financially motivated group it names "Vice Spider" (aka Vice Society, White Nefas, White Hekate, DEV-0832, Vanilla Tempest), active since at least mid-2021, using the Vice Society leak site and outsourced ransomware families before switching almost exclusively to Rhysida since June 2023. BSI's own commercial-provider telemetry states 92% of Rhysida leak-site listings are followed by data publication, with a median 11 days between listing and publication; Rhysida shows no particular regional focus on Germany and concentrates on education and healthcare, with public administration among its next most-frequent target types. A malware family named LoremIpsumLoader (aka AxolotLoader), separately profiled by BlueVoyant as a trojanized MS Teams installer, is linked by BSI to the same group operating Rhysida.

      The 5.7 TB / ~1.44M-file Rhysida leak published 2026-09-04 (after Berlin's non-payment) is now confirmed by heise to include not only personnel records, disciplinary files, plaintext passwords and 46,500-plus contracts, but civil-defense and protection concepts, barracks documents, and detailed plans for critical infrastructure — water and heating plants, substations, emergency-power installations and defense-industry sites — prompting German federal bodies (Bundeswehr's Operative Führungskommando, the National Cyber Defence Centre, and BSI) to assess national-security risk. Separately, heise reports an operational dispute during incident response: the Lichtenberg district is refusing to deploy the CrowdStrike Falcon agent the Senate Chancellery engaged for forensics on its own servers, citing near-unrestricted data access, possible disruption to production systems, and surveillance concerns for its staff, and states it has found no intrusion evidence on its own systems.

      Defender relevance: BSI's mitigation list is (1) current network/endpoint protection, (2) browsers with SmartScreen-class reputation checks to catch the lure page, (3) cloud-based malware detection, (4) PowerShell Script Block Logging enabled so pasted commands are captured, (5) PowerShell run in Constrained Language Mode to block dangerous cmdlets, and (6) treating any host that ran the paste as a network entry point for lateral movement rather than an isolated case. This is directly transferable to Swiss cantonal/federal administration networks, which share the same shared-Landesnetz/shared-domain topology that let the compromise of two departments reach a common government network — and the same watering-hole/phishing-driven initial-access class NCSC-CH has separately been tracking under "fake CAPTCHA" (ClickFix) warnings since August 2026.
