    extended_notes: |
      Fact/claim separation: FACT (ministry + press) — a cyberattack occurred, was called "sophisticated" by the ministry, several public-facing sites were taken offline for remediation, a criminal complaint was filed, and ANSSI is investigating account compromises. CLAIM (attacker, via French Breaches' relay, unconfirmed) — the specific record counts, file names, and the API-misconfiguration/IDOR mechanism. Detection/hardening angle transferable regardless of claim-confirmation status: IDOR is a design-level authorization flaw (object/record identifiers accepted from the client without a server-side ownership/scope check) — the durable defender lesson for any e-government inspection, licensing or professional-register API is to audit that every object-reference parameter enforces server-side authorization against the caller's own scope, not just authentication. Telemetry angle: sequential or rapidly-incrementing identifier values in API access logs against a single authenticated session, or access to records spanning far more organisational units/directions than that account's normal scope, is the vendor-neutral discriminator for this technique class.

