      - quote: "Nach Kenntnislage eines kommerziellen Dienstleisters des BSI folgt in 92 % der Fälle auf die Nennung auf der Leak-Seite Rhysida auch eine Datenveröffentlichung. Dabei vergehen zwischen Nennung auf der Leak-Seite und Veröffentlichung von gestohlenen Daten im Durchschnitt 11 Tage."
        attribution: "BSI, advisory BITS-B#2026-287419-1032 v1.0 (2026-09-04)"
        source_url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile"
      - quote: "Once executed, the PowerShell command masquerades as a Cloudflare verification process while downloading a ZIP archive containing a legitimate binary (LockScreenContentServer.exe) and a malicious DLL (dui70.dll) used for sideloading."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"
      - quote: "This type of intrusion is particularly dangerous because it provides attackers with direct access to an organization's internal network through the reverse tunnel."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"
    extended_notes: |
      REGISTRY NOTE (alias extension, not a new relation): BSI's advisory states Rhysida's ransomware/leak-site operation is itself tracked under the alias set Vice Spider / Vice Society / WhiteNefas / White Hekate / DEV-0832 / Vanilla Tempest. The existing registry record actor:rhysida currently has an empty aliases list — please extend it with these aliases directly (per the "extend aliases, never rename" rule) rather than modeling this as a relation edge, since it is the same tracked entity under different vendor/authority names, not a connection between two distinct entities.
      Defender-facing detection/hunting angles supported by the sources (vendor-neutral telemetry class first, platform anchor second):
      - Process-creation telemetry: PowerShell spawning cmd.exe with a command line referencing a ProgramData subfolder, a .bat file and a subsequent LockScreenContentServer.exe launch (Microsoft's own advanced-hunting query keys on exactly this InitiatingProcessFileName/FileName/ProcessCommandLine chain).
      - Image/module-load telemetry: LockScreenContentServer.exe loading dui70.dll from a working directory OTHER than \Windows\System32, \Windows\SysWOW64, \winsxs\ or \Program Files\ — the legitimate binary only ever loads that DLL from those trusted paths; any other load path is the sideloading tell (T1574.002).
      - Persistence telemetry: new HKCU Run-key value pointing at LockScreenContentServer.exe from a non-standard path, paired with a new Scheduled Task configured to re-run roughly every 60 minutes under a name blending in as a Lock Screen component (T1547.001 / T1053.005).
      - Discovery telemetry: a single host issuing domain-trust enumeration, "domain admins" group queries, and ADSI/LDAP searches in rapid succession, followed by ICMP sweeps against a short list of named internal hosts resolving to domain controllers/DB/backup/gateway/mail roles (T1482 / T1069.002 / T1018) — a pre-ransomware reconnaissance signature, not routine admin activity.
      - Network telemetry: outbound TLS on port 443 that upgrades to a WebSocket from an unusual parent process (pythonw.exe with no console window, or an embedded/portable python.org interpreter not normally present on the host) sustaining long-lived, high-volume bidirectional flow consistent with protocol tunneling (T1572) rather than a single web request.
      - Cloud-egress telemetry (BSI-specific addition beyond Microsoft's write-up): unexpected use of cloud-vendor CLI transfer tools (e.g. azcopy) from an endpoint that does not normally perform bulk cloud uploads is a plausible late-stage exfiltration-staging indicator in this campaign.
      - Triage / benign-lookalike discriminator: LockScreenContentServer.exe itself is a legitimate, signed Windows component and its presence in a process tree is not anomalous — the discriminating features are (a) its working directory/load path for dui70.dll, (b) the DLL being unsigned with a forged future compile timestamp, and (c) the DLL's masquerading name matching a real Windows component ("Windows DirectUI Engine") it is not.
      - Hardening: block or audit Win+R and Win+X→I access to Windows Terminal/PowerShell for standard users via AppLocker/App Control/GPO where not operationally required; enforce PowerShell Constrained Language Mode plus script-block logging; treat any host showing this chain as a confirmed internal network pivot point requiring credential rotation for every account reachable from it, not as an isolated infection.
      Backlog re-check (single search pass each, per spawn instructions — none crossed the corroboration bar this run): (1) Ixa Systems SA / TheGentlemen — still only ransomware.live + directory listings, no victim statement or CH French/German press; (2) UICC / Krybit — still only leak-site aggregator trackers (SOCRadar, RedPacketSecurity, Brinztech), no UICC statement or Admiralty A/B journalism; (3) Ville de Libercourt / Kairos — still only a French breach-tracker blog repeating the leak-site claim, no commune statement or mainstream French press; (4) NovoCure 8-K — confirmed "unauthorized access to some of its information systems" with ~1,400 US patients' internal ID numbers and <50 with additional identifying data exposed, but still no named attacker, vulnerability or intrusion mechanism, so it still does not clear the bar for a full incident entry.

