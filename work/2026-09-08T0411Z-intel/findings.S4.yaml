  - title: "France's Ministry of Ecological Transition confirms a 'sophisticated' cyberattack; a criminal claims 22,000+ records taken via an API misconfiguration and an IDOR flaw in the ministry's inspection-body oversight tool, the latest in a run of French public-administration breaches"
    sources:
      - { url: "https://www.lemondeinformatique.fr/actualites/lire-le-ministere-de-la-transition-ecologique-cible-par-une-cyberattaque-100771.html", publisher: "Le Monde Informatique", date: "2026-09-07", role: primary }
      - { url: "https://frenchbreaches.com/alertes/minist-re-de-la-transition-cologique-mtk4bzvizh7z1fmgm7", publisher: "French Breaches (breach-notification/analysis site)", date: "2026-09-02", role: corroborating }
    discovery_trace: "first seen at: le-monde-info (S4 rotation source), URL https://www.lemondeinformatique.fr/actualites/toute-l-actualite.html → drill: https://www.lemondeinformatique.fr/actualites/lire-le-ministere-de-la-transition-ecologique-cible-par-une-cyberattaque-100771.html → corroboration: French Breaches, URL https://frenchbreaches.com/alertes/minist-re-de-la-transition-cologique-mtk4bzvizh7z1fmgm7"
    summary: |
      France's Ministère de la Transition écologique confirmed (per Le Monde Informatique, 2026-09-07, and French Breaches) that it was the target of a "sophisticated computer attack," that it filed a criminal complaint (signalement au parquet), and that ANSSI (France's national cybersecurity agency) is intervening with the affected administrations over possible user-account compromises. Several ministry-linked sites — including the public environmental-consultation platform and multiple regional administration sites — were temporarily taken offline during remediation, and AFP reported the attack targeted the ministerial hub's messaging tools. Separately and NOT independently confirmed: a criminal using the forum handle "mondial" posted on 2026-09-02 claiming to have exfiltrated two datasets from systems tied to the developpement-durable.gouv.fr domain — a controleurs.csv file the poster says holds 14,656 records on approved inspection controllers (names, dates of birth, approval numbers, affiliated inspection bodies, phone numbers) and an all_users.json file the poster says holds 8,166 users (unique email addresses, phone numbers, employee IDs/matricules, LDAP-directory fields, login identifiers) spanning 942 distinct administrative units. The claimed initial-access route is a misconfigured authentication service, followed by exploitation of an IDOR (Insecure Direct Object Reference) flaw in OISO (Outil Informatique de Surveillance des Organismes), the ministry's IT tool for overseeing accredited inspection bodies — letting an authenticated (or improperly-scoped) user manipulate an object reference/identifier in a request to pull other users' or controllers' records outside their authorised scope. Neither the record counts, the exact misconfiguration, nor the compromised-system perimeter has been independently verified; this is the attacker's own claim as relayed by French Breaches' analysis of the leaked samples. This is the latest in a continuing run of French public-administration compromises the store already tracks (Direction générale des Finances publiques/DGFiP, Éducation nationale, Bloctel, Zéro Logement Vacant) — but the claimed mechanism (API/authentication misconfiguration plus an IDOR in a specific oversight application) and the poster handle differ from the credential-theft pattern already attributed there to ZeroBytes/the Epsilon collective, so no shared-actor link is asserted for this incident.
    region_nexus: "France (national ministry, e-government/inspection-oversight systems); directly transferable to Swiss federal/cantonal e-government platforms exposing comparable professional-licensing, inspection-body or public-register APIs"
    primary_sector_nexus: "direct — national government ministry and its regional/inspection-body oversight systems"
