  - title: "BSI names TerminalFix (a ClickFix/reverse-tunnel variant) as the confirmed initial-access vector into Berlin's Landesnetz, and attributes the campaign to Rhysida's operators (aka Vice Spider / Vice Society / Vanilla Tempest)"
    sources:
      - { url: "https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html", publisher: "heise online", date: "2026-09-07", role: primary }
      - { url: "https://www.heise.de/news/Gefahr-fuer-die-nationale-Sicherheit-Berliner-Datenleck-schlaegt-hohe-Wellen-11444301.html", publisher: "heise online", date: "2026-09-07", role: corroborating }
      - { url: "https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile", publisher: "BSI (Germany's federal cybersecurity authority) — BITS-B# advisory 2026-287419-1032, v1.0", date: "2026-09-04", role: primary }
      - { url: "https://social.bund.de/@bsi/117212729947889443", publisher: "BSI (official Mastodon account, social.bund.de)", date: "2026-09-04", role: corroborating }
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/", publisher: "Microsoft Threat Intelligence", date: "2026-08-28", role: corroborating }
      - { url: "https://www.infosecurity-magazine.com/news/rhysida-berlin-data-extortion/", publisher: "Infosecurity Magazine", date: "2026-09-07", role: corroborating }
    discovery_trace: "first seen at: heise-sec (S4 essential source), URL https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html → pivot: BSI Mastodon post, URL https://social.bund.de/@bsi/117212729947889443 → primary: BSI BITS advisory PDF, URL https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile → cross-reference: Microsoft Threat Intelligence TerminalFix write-up (already tracked in the store as campaign:terminalfix-clickfix-reverse-tunnel-2026), URL https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"
    summary: |
      Germany's BSI confirmed on 2026-09-04 (advisory BITS-B#2026-287419-1032 v1.0) that the confirmed technique against Berlin's two affected Senatsverwaltungen (Stadtentwicklung/Bauen/Wohnen and Mobilität/Verkehr/Klimaschutz) was TerminalFix, the ClickFix variant Microsoft documented on 2026-08-28. BSI's advisory reproduces the full chain: a user visits a compromised/water-holed website carrying a fake Cloudflare Turnstile CAPTCHA overlay; completing the "verification" copies a PowerShell command to the clipboard, which the victim is instructed to paste into Windows Terminal (Win+X, I) rather than the classic Run dialog (Win+R) used by earlier ClickFix variants — a change Microsoft says increases the odds that longer, multi-line scripts execute successfully. The pasted command downloads and extracts a ZIP archive to C:\ProgramData and launches a batch file that runs a legitimate signed binary, LockScreenContentServer.exe, which side-loads a co-located malicious dui70.dll (masquerading as the Windows DirectUI Engine, unsigned, with a forged future timestamp) from its own working directory rather than System32 — classic DLL side-loading. The sideloaded DLL then pulls further payloads hidden inside PNG images via steganography (payload length encoded in the first 8 bytes of reconstructed pixel data, split across multiple images to evade content inspection), establishes dual persistence via an HKCU Run key and a scheduled task re-executing every 60 minutes, and conducts extensive Active Directory reconnaissance (domain trust enumeration, domain-admin group membership, AD user/computer searches, and ICMP sweeps of named infrastructure hosts corresponding to domain controllers, databases, backup and mail servers) in English, Spanish and German locale variants. A persistent PowerShell file-watch loop provides an interim asynchronous command channel, and the final stage deploys a portable, unmodified python.org embeddable Python runtime plus a custom client.py implant launched via pythonw.exe (no visible window) that dials out over TLS/443, upgrades to a WebSocket, and relays arbitrary TCP connections back to the attacker — turning the compromised host into a full network pivot with SOCKS5-style addressing. BSI's advisory adds a detail Microsoft's write-up did not include: reporting organisations told BSI that attackers used the access to stage exfiltration into attacker-controlled cloud storage (e.g. Azure), using vendor-supplied cloud tools such as azcopy. BSI also states that submitted incident reports show the malware family "LoremIpsumLoader" (aka AxolotLoader, previously documented by BlueVoyant as distributed via trojanized MS Teams/WebEx-style installers) was used within this campaign, and that BSI's own knowledge ties this loader to the same financially motivated group responsible for the Rhysida ransomware and its leak site. BSI further attributes Rhysida itself to "Vice Spider" (aka Vice Society, WhiteNefas, White Hekate, DEV-0832, Vanilla Tempest) — active since mid-2021, initially using the Vice Society leak site and a variety of third-party ransomware, almost exclusively deploying Rhysida since June 2023 — and states that, per a commercial partner's telemetry, 92% of Rhysida leak-site listings are followed by data publication, with a mean 11 days between listing and publication. BSI assesses the campaign as purely financially motivated opportunistic cybercrime with no established link to a state or politically motivated actor, and notes Rhysida shows no significant German-region focus, concentrating instead on education and healthcare, with the public-administration sector a more distant top-5 target category. This is the confirmed first attack-vector explanation for the Berlin Landesnetz compromise already tracked in the store (incident:berlin-landesnetz-compromise-2026-08); it also resolves an open attribution gap on the TerminalFix campaign entry (campaign:terminalfix-clickfix-reverse-tunnel-2026), which Microsoft's original write-up left unattributed beyond "opportunistic, financially motivated."
    region_nexus: "Germany (federal/state government network); directly transferable to Swiss federal/cantonal/communal administrations given near-identical shared-network architecture (Landesnetz-style shared government WAN) and identical initial-access lure (fake CAPTCHA/ClickFix) already active against multiple sectors"
    primary_sector_nexus: "direct — public-sector state/city government administration network (Land Berlin Senatsverwaltungen)"
    sector: "public-sector"
