items:
  - title: "StyleSmuggler (CVE-2026-75650) — unauthenticated CVSS 10.0 RCE in Magento/Adobe Commerce via template-engine injection, mass exploitation confirmed, Adobe hotfix shipped three days into the campaign"
    sources:
      - { url: "https://sansec.io/research/stylesmuggler-0day", publisher: "Sansec Forensics Team", date: "2026-09-05", role: "primary" }
      - { url: "https://helpx.adobe.com/security/products/magento/apsb26-146.html", publisher: "Adobe PSIRT (APSB26-146)", date: "2026-09-07", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12915", publisher: "NCSC Switzerland / GovCERT.ch — Cyber Security Hub", date: "2026-09-07", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/unpatched-magento-and-adobe-commerce.html", publisher: "The Hacker News", date: "2026-09-06", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12915 → primary: Sansec Forensics Team, URL https://sansec.io/research/stylesmuggler-0day → primary: Adobe PSIRT, URL https://helpx.adobe.com/security/products/magento/apsb26-146.html → corroborating (independent IR data from Disrex Group, quoted via The Hacker News): URL https://thehackernews.com/2026/09/unpatched-magento-and-adobe-commerce.html"
    summary: |
      Sansec discovered StyleSmuggler on 2026-09-04, an unauthenticated remote-code-execution chain in Magento Open Source and Adobe Commerce that Adobe assigned CVE-2026-75650 (CVSS 3.1: 10.0, CWE-1336 Improper Neutralization of Special Elements Used in a Template Engine) and patched with an emergency hotfix (VULN-39341) on 2026-09-07 — three days after Sansec observed the first exploitation and a full week after mass compromise began. Every version 2.4.4 through 2.4.9 of Adobe Commerce, Adobe Commerce B2B and Magento Open Source is affected, "including the latest release"; no authentication or user interaction is required.
      The chain runs in two stages. First, the attacker poisons Magento's own template rendering: an unauthenticated request (Sansec's confirmed victims were reached over the storefront's GraphQL endpoint) causes Magento to write attacker-controlled text into a location it later re-reads and renders through its template filter — either a failure report under var/report/ (Sansec's published check) or, per independent incident responder Disrex Group, var/log/system.log, which Sansec's own indicator search misses. Second, the attacker triggers Magento's standard "Payment Transaction Failed Reminder" customer-notification email; rendering that email causes Magento to execute the poisoned template content, reaching a code path in Magento's own dependency-injection compiler classes (Disrex traces the sink to three files under setup/src/Magento/Setup/Module/Di/Code/) that ends by including an attacker-chosen file — the previously poisoned log/report — and executing it as PHP. The exploit succeeds whether or not the notification email actually gets delivered, and moving session storage to Redis or a database does not stop it.
      On success, the implant is a small statically-linked Rust binary that installs itself outside the web root (Sansec observed a path under a hidden directory in the site user's home directory) and re-persists via a cron entry written directly into the cron spool file rather than through the crontab command, so no "REPLACE" line appears in system logs and an empty `crontab -l` is not evidence of a clean host. The implant disguises its running process name to match a legitimate system process — a kernel worker thread, the fontconfig cache builder, or the real NTP daemon — and, in variants Sansec observed from 2026-09-06 onward, beacons roughly every 60 seconds over UDP port 123 in traffic deliberately shaped to resemble NTP protocol replies, carrying a chunked, encoded telemetry record (host, user, OS, resource usage, implant version) rather than legitimate time-sync data; a separate build communicates over WebSocket-over-TLS on port 443. Sansec also documents a second, apparently unrelated threat actor independently exploiting the same StyleSmuggler flaw to drop a token-gated PHP web shell into the product-image cache directory, reachable only with a custom request header, after a reconnaissance probe that exfiltrates basic host facts through DNS-style out-of-band callbacks embedded in a GraphQL request header rather than a response body.
      Independent incident-response data from Disrex Group (which hosts Magento stores and handled two live compromises) confirms exploitation began at the store level within hours of Sansec's own first observation, that a fully patched 2.4.8 store running Sansec's own blocking product was still breached because the attack predated the vendor's detection-rule release by roughly eight hours, and that patch level was "irrelevant" to the affected merchants at the time they were hit.
    region_nexus: "global; no Swiss-specific victim reporting yet, but any government-adjacent e-commerce/ticketing storefront (tourism boards, cantonal shops, public transport ticketing) running Adobe Commerce or Magento Open Source is in the affected population"
    primary_sector_nexus: "indirect — the vulnerable platform is e-commerce software, not core public-sector infrastructure, but public bodies and their suppliers that operate storefronts on this stack are directly exposed"
    sector: "public-sector"
