      - quote: "Er is Proof of Concept code beschikbaar voor CVE-2026-19490. Het NCSC acht het zeer waarschijnlijk dat op korte termijn misbruik zal plaatsvinden."
        attribution: "NCSC-NL (English gloss: \"PoC code is available for CVE-2026-19490. NCSC considers it highly likely that abuse will occur in the short term.\")"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0318"
      - quote: "On 3 September, one of our NetScaler sensors received requests matching the PoC from three distinct source IPs, geolocated to Australia, the United States and Germany."
        attribution: "Ryan Dewhurst, Previdian (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/hackers-target-critical-citrix-netscaler-auth-bypass-in-attacks/"
      - quote: "Some newer affected versions require SAML authentication to be configured before the vulnerability can be exploited, while older affected versions have broader exposure and may be vulnerable whenever Gateway or AAA functionality is enabled."
        attribution: "Field Effect Security Intelligence Team"
        source_url: "https://fieldeffect.com/blog/early-exploitation-citrix-netscaler-vulnerability"
    extended_notes: |
      Detection concept (telemetry class first, platform anchor second): authentication/session logs on the NetScaler appliance itself are the primary hunt surface — review AAA/Gateway authentication events, SAML assertion-consumption events and administrative-session logs for the exposure window (patch available since 2026-08-19; PoC-driven attempts observed from 2026-09-03) for sessions established via the alternate/bypass path rather than the normal login sequence, and for any session that appears authenticated but has no matching prior credential-submission event. Configuration telemetry: search the running NetScaler configuration for `add authentication samlAction.*`, `add authentication vserver .*` and `add vpn vserver .*` (Rapid7) to determine whether a given appliance is in an exploitable configuration at all, and separately for `add lsn group` combined with `sipalg` to scope exposure to CVE-2026-19489. Hardening: patch to NetScaler ADC/Gateway 14.1-73.32 / 13.1-63.21 (or the FIPS/NDcPP-specific builds) immediately; restrict NetScaler management interfaces to dedicated management networks; enforce MFA on administrative access; and for any appliance that was internet-exposed and unpatched during the exposure window, review authentication logs, active sessions and SAML configuration for signs of unauthorized access before treating the appliance as clean, since the auth-bypass path leaves no failed-login trail to alert on in the first place.

