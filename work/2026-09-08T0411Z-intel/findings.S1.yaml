        summary: "Sansec's name for an unauthenticated RCE chain in Magento/Adobe Commerce (CVE-2026-75650, CVSS 10.0) that poisons a Magento-rendered log or report file with template code and detonates it via the platform's own failed-payment notification email; exploited in the wild from 2026-09-04, patched by Adobe on 2026-09-07 (Sansec, 2026-09-05)."
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Sansec discovered StyleSmuggler, a Magento and Adobe Commerce zero-day that gives unauthenticated attackers remote code execution."
        attribution: "Sansec Forensics Team"
        source_url: "https://sansec.io/research/stylesmuggler-0day"
      - quote: "Adobe is aware of CVE-2026-75650 being exploited in the wild."
        attribution: "Adobe PSIRT (APSB26-146)"
        source_url: "https://helpx.adobe.com/security/products/magento/apsb26-146.html"
      - quote: "Successful exploitation allows unauthenticated attackers to achieve remote code execution and establish persistent backdoors on affected e-commerce servers via network access."
        attribution: "NCSC Switzerland / GovCERT.ch — Cyber Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12915"
    extended_notes: |
      Detection concept (telemetry class first, platform anchor second): unexpected outbound UDP traffic on port 123 from web-application hosts that never legitimately act as NTP peers, especially many small (~48-byte) datagrams sent in rapid bursts every ~60 seconds rather than the single periodic query a real NTP client issues — a genuine time-sync client never emits server-mode reply packets, which is what distinguishes this beacon from legitimate NTP traffic (process-creation + network-connection telemetry, e.g. Sysmon EID 3/22 or EDR network-egress alerting scoped to web-tier hosts). Process telemetry: a bracketed kernel-thread-style name (indicating a kernel worker) or a fontconfig-cache-builder/NTP-daemon process name running under a non-root, site/web-application account with non-trivial resident memory is not legitimate — real kernel worker threads belong to root and hold no user-space memory. Cron/persistence telemetry: hunt the raw cron spool files directly (not just `crontab -l` output) for entries that were not accompanied by a corresponding "REPLACE" audit line, since this implant (and a prior campaign using the same technique) writes the spool file directly to avoid the crontab command's own logging. Application telemetry: an unexplained burst of "Payment Transaction Failed Reminder" emails, especially ones containing unresolved `{{var ...}}` template placeholders or Magento's own template-error fallback text, is a Magento-specific tell that costs no additional tooling to check. Hardening: apply Adobe's VULN-39341 hotfix immediately; where unpatched, temporarily disable the GraphQL endpoint (the observed primary attack vector) and add `proc_open` to PHP's `disable_functions`; mount `/tmp`, `/var/tmp` and `/dev/shm` `noexec`; and, per Adobe's guidance, rotate the store's encryption key and every credential it protects (admin passwords, REST/SOAP/GraphQL integration tokens, OAuth client secrets, payment-gateway API credentials, database credentials, SSH/deploy keys) at the source system, not only inside Magento, since rotating the encryption key alone does not invalidate anything already read by an attacker. No IOC hashes/IPs/domains are reproduced here per pipeline policy; consult the cited Sansec/Disrex write-ups directly for indicator matching.

  - title: "CVE-2026-19490 — Citrix NetScaler ADC/Gateway unauthenticated auth-bypass (CVSS 9.3): public PoC live since Sept 3, exploitation attempts confirmed through Sept 7, three weeks after the patch shipped"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0318", publisher: "NCSC-NL (Nationaal Cyber Security Centrum)", date: "2026-09-07", role: "primary" }
      - { url: "https://previdian.com/CVE-2026-19490", publisher: "Previdian (Ryan Dewhurst)", date: "2026-09-07", role: "primary" }
      - { url: "https://fieldeffect.com/blog/early-exploitation-citrix-netscaler-vulnerability", publisher: "Field Effect Security Intelligence Team", date: "2026-09-04", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-target-critical-citrix-netscaler-auth-bypass-in-attacks/", publisher: "BleepingComputer", date: "2026-09-04", role: "corroborating" }
      - { url: "https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/", publisher: "Rapid7", date: "2026-08-19", role: "corroborating" }
      - { url: "https://www.securityweek.com/exploitation-expected-for-critical-authentication-bypass-patched-in-citrix-netscaler/", publisher: "SecurityWeek", date: "2026-08-20", role: "corroborating" }
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-010/", publisher: "CERT-EU", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories → NCSC-NL advisory update, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0318 → pivot: WebSearch (\"CVE-2026-19490 Citrix NetScaler proof of concept\") → Previdian (vulnerability-intelligence sensor telemetry), URL https://previdian.com/CVE-2026-19490 → corroborating: Field Effect, URL https://fieldeffect.com/blog/early-exploitation-citrix-netscaler-vulnerability → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-target-critical-citrix-netscaler-auth-bypass-in-attacks/ → corroborating: Rapid7, URL https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/ → corroborating: SecurityWeek, URL https://www.securityweek.com/exploitation-expected-for-critical-authentication-bypass-patched-in-citrix-netscaler/ → corroborating: CERT-EU 2026-010, URL https://cert.europa.eu/publications/security-advisories/2026-010/"
    summary: |
      Citrix patched CVE-2026-19490 on 2026-08-19 (CTX696939): an authentication-bypass-via-alternate-path (CWE-288) in NetScaler ADC and NetScaler Gateway, CVSS v4.0 9.3, exploitable remotely by an unauthenticated attacker with no user interaction. The flaw affects appliances configured as a Gateway (SSL VPN, ICA Proxy, CVPN, RDP Proxy) or as an AAA virtual server; Field Effect notes that on some newer builds the bypass additionally requires a configured SAML authentication action, while older affected versions are reachable whenever Gateway or AAA functionality is enabled at all — configuration, not just version, determines exposure. Affected: NetScaler ADC/Gateway 14.1 before 14.1-73.32 and 13.1 before 13.1-63.21, including FIPS/NDcPP variants (13.1-FIPS/NDcPP before 13.1-37.277) and Secure Private Access Hybrid deployments using NetScaler instances. The same bulletin ships CVE-2026-19489 (CVSS 8.8), a memory-overflow-to-DoS bug reachable only when SIP ALG is enabled inside a Large Scale NAT (LSN) group — a narrow, checkable precondition (`add lsn group` combined with `sipalg` in the running configuration).
      A "credible" public proof-of-concept for CVE-2026-19490 went live around 2026-09-03. Vulnerability-intelligence firm Previdian recorded exploitation-attempt traffic matching that PoC from at least six distinct source IPs across three countries within 24 hours, and its tracker shows continued observed activity through 2026-09-07 (medium confidence; "provides evidence of exploitation attempts, but does not confirm successful compromise"). The Centre for Cybersecurity Belgium separately warned of exploitation attempts the same week. NCSC-NL updated its advisory on 2026-09-07 specifically to flag that PoC code is now public and that it assesses imminent widespread exploitation as highly likely ("Het NCSC acht het zeer waarschijnlijk dat op korte termijn misbruik zal plaatsvinden" — "NCSC considers it highly likely that abuse will occur in the short term"). As of this research, CVE-2026-19490 has not been added to CISA's KEV catalog and FIRST EPSS scores it at 3.4% (2026-09-07) — both trailing the sensor-level exploitation evidence already reported by name.
      NetScaler ADC/Gateway is near-ubiquitous perimeter infrastructure for SSL VPN remote access, federated (SAML) authentication, ICA/RDP proxying and load balancing — Shadowserver's public scan counts over 22,000 internet-exposed NetScaler ADC instances and roughly 1,700–1,800 Gateway instances, with no visibility into how many carry a vulnerable configuration versus already-patched or honeypot systems. Citrix authentication-bypass and RCE flaws have a consistent history of rapid exploitation once public: CISA has tagged 23 separate Citrix vulnerabilities as actively exploited since November 2021, six of them subsequently abused by ransomware operators, and the immediately preceding NetScaler patch cycle (CVE-2026-3055/CVE-2026-4368, March 2026) also saw exploitation begin within days of disclosure.
    region_nexus: "global; NetScaler ADC/Gateway is widely deployed as perimeter VPN/SAML-IdP infrastructure across European public-sector networks, Switzerland included"
    primary_sector_nexus: "direct — Citrix NetScaler is standard perimeter remote-access and identity-federation infrastructure for government networks"
    sector: "public-sector"
