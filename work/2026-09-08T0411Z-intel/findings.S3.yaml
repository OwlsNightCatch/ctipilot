  - title: "CloudSEK gains admin access to \"BigBear 2.0,\" an Evilginx2-based Microsoft 365 phishing-as-a-service panel that JavaScript-disables FIDO2/WebAuthn to force victims onto phishable MFA"
    sources:
      - { url: "https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign", publisher: "CloudSEK (Gagan Aggarwal / TRIAD)", date: "2026-09-07", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/bigbear-microsoft-365-phishing-service-bypassed-mfa-at-258-organizations/", publisher: "BleepingComputer (Bill Toulas)", date: "2026-09-07", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new malware family analysis report September 7 2026\") → article: https://www.bleepingcomputer.com/news/security/bigbear-microsoft-365-phishing-service-bypassed-mfa-at-258-organizations/ → primary: CloudSEK research write-up, URL https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign"
    summary: |
      CloudSEK's TRIAD team gained administrator access to the control panel of "BigBear 2.0," a rebranded, Evilginx2-based adversary-in-the-middle (AiTM) phishing-as-a-service operation targeting Microsoft 365 exclusively, and published full technical findings on 2026-09-07. The panel managed 42 VPS nodes (primarily hosted commercially on Vultr) running Evilginx2's reverse-proxy engine configured with a single phishlet ("offy") that proxies the entire authentication flow between the victim and login.microsoftonline.com: the victim's password is captured in plaintext as it passes through, and — critically — after the victim completes MFA (TOTP, push, or SMS), Microsoft's own session cookie (ESTSAUTH for Entra ID, AppSessionId for Outlook Web Access) is captured off the wire before it reaches the victim's browser, since the proxy terminates the victim's TLS session before opening its own to Microsoft. That cookie is bound to the browser session but not to any specific device or location, so importing it into an attacker-controlled browser inherits the fully authenticated session — TOTP, push and SMS MFA are structurally bypassed this way because the proxy never has to defeat the second factor, only wait for the legitimate user to clear it. The panel exposes a REST API (`/api/jobs`) that automatically replays captured cookies against Microsoft 365, and a keepalive feature abuses captured refresh tokens (typically valid ~90 days with a sliding window) to periodically refresh session cookies well past their nominal expiry. Custom JavaScript injected into every proxied login page (not present in stock Evilginx2) monkey-patches the browser's `PublicKeyCredential`/`navigator.credentials` API to force a fallback away from FIDO2/WebAuthn — the one MFA class immune to AiTM replay because its cryptographic assertion is bound to the legitimate origin domain — toward phishable methods, blocks outbound requests and image beacons to Microsoft's own anti-phishing telemetry/canary-token endpoints, and auto-checks "Keep me signed in" to maximise the stolen session's lifetime. A 69-country geo-matched residential-proxy pool routes the relayed traffic through an IP in the victim's own country, defeating Microsoft's location-anomaly detection and satisfying IP-based Conditional Access checks; the panel itself is only reachable via a residential IP, since an `ipapi.is`-based anti-bot gate blocks datacenter/VPN/proxy IPs from viewing it. At the time of writing the panel had exfiltrated 5,137 credential records — 474 complete MFA-bypassed sessions, 1,032 plaintext passwords and 4,148 session cookies — from 3,331 unique victim IPs across 40+ countries, and is leased to at least five identified affiliate operators who each receive stolen credentials in real time via dedicated Telegram bots. IT services/MSP organisations were the single largest targeted sector (151 of the profiled organisations), which CloudSEK notes is disproportionate because a compromised IT provider's privileged access to client Azure AD/on-prem AD/RMM tooling and password managers enables downstream supply-chain compromise of its customers.
    region_nexus: "global; victims across 40+ countries (India, France, Saudi Arabia, New Zealand, Germany leading); directly relevant to any Microsoft 365 / Entra ID tenant, including Swiss federal, cantonal and communal administrations and their managed IT-service providers"
    primary_sector_nexus: "direct"
    sector: "public-sector (via IT-services/MSP concentration — the top targeted sector, and the same supply-chain exposure class already seen in Swiss public-sector MSP-breach reporting)"
    cves: []
    techniques: [T1566.002, T1539, T1550.004, T1111]
    affected_products: ["Microsoft 365", "Microsoft Entra ID"]
    entity_keys: []
    new_entities:
      - { key: "tool:bigbear-phaas", type: tool, name: "BigBear 2.0", aliases: ["BigBear"],
          summary: "Evilginx2-based phishing-as-a-service (PhaaS) panel targeting Microsoft 365 exclusively via an adversary-in-the-middle reverse-proxy phishlet ('offy'); leased to multiple affiliate operators. Documented by CloudSEK (2026-09-07), whose researchers gained administrator access to the operator's control panel; operator alias 'General Boss'." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The panel has exfiltrated 5,137 credential records - including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies - affecting 3,331 unique victim IPs across 40+ countries... with the operation still active at the time of writing."
        attribution: "CloudSEK"
        source_url: "https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign"
      - quote: "Why FIDO2/WebAuthn is resistant: FIDO2 ... uses origin-bound credentials. The cryptographic assertion is tied to the origin domain ... When Evilginx2 proxies traffic, the origin seen by the browser is the phishing domain ... not the real Microsoft domain. The FIDO2 assertion fails because the origin does not match the credential's registered origin. This is the only MFA method that structurally prevents AiTM phishing."
        attribution: "CloudSEK"
        source_url: "https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign"
      - quote: "Researchers at cybersecurity company CloudSEK gained administrator access to the control panel and found that the service managed 42 VPS nodes, all configured to target Microsoft 365 as part of the observed operation."
        attribution: "BleepingComputer (Bill Toulas)"
        source_url: "https://www.bleepingcomputer.com/news/security/bigbear-microsoft-365-phishing-service-bypassed-mfa-at-258-organizations/"
    extended_notes: |
      No IOCs (IP addresses, domains, hashes, Sigma/detection rule code) carried forward from CloudSEK's post even though it publishes them; only technique classes are described. Detection concept for the main agent to compose from: identity/sign-in telemetry showing a session-cookie-authenticated action with no matching interactive MFA challenge in the same session lineage, or a token-issuance event immediately followed by activity from a network location/device-compliance state inconsistent with the enrolling device — the generic AiTM tell regardless of vendor. Hardening lever: phishing-resistant FIDO2/WebAuthn plus Conditional Access policies keyed to device compliance/managed-device state rather than geolocation, since geo-matched residential proxies defeat the latter.

