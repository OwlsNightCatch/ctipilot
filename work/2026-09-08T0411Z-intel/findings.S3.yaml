  - title: "StyleSmuggler (CVE-2026-75650) — unauthenticated Magento/Adobe Commerce RCE via template-engine styles-property injection, exploited three days before Adobe's hotfix"
    sources:
      - { url: "https://sansec.io/research/stylesmuggler", publisher: "Sansec Forensics Team", date: "2026-09-05", role: "primary" }
      - { url: "https://socradar.io/blog/stylesmuggler-magento-adobe-commerce-0day/", publisher: "SOCRadar", date: "2026-09-07", role: "corroborating" }
      - { url: "https://www.heise.de/news/Zero-Day-Luecke-StyleSmuggler-in-Magento-und-Adobe-Commerce-wird-aktiv-ausgenutzt-11444217.html", publisher: "heise Security (Kathrin Stoll)", date: "2026-09-07", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS) → article: https://www.heise.de/news/Zero-Day-Luecke-StyleSmuggler-in-Magento-und-Adobe-Commerce-wird-aktiv-ausgenutzt-11444217.html → primary: Sansec research write-up, URL https://sansec.io/research/stylesmuggler → corroboration: SOCRadar independent analysis, URL https://socradar.io/blog/stylesmuggler-magento-adobe-commerce-0day/"
    summary: |
      Dutch e-commerce security firm Sansec disclosed StyleSmuggler on 2026-09-05, an unauthenticated remote-code-execution chain against Magento Open Source and Adobe Commerce that was already under active exploitation since 2026-09-04 — Sansec published early specifically because stores were being compromised in real time. The bug abuses Magento's template engine via the `styles` property to smuggle PHP past existing input safeguards, in two stages: first the attacker plants (poisons) PHP code inside a file Magento itself writes — a failure report or system log — then triggers the built-in "Payment Transaction Failed Reminder" email; the planted code executes while Magento renders that email template, so the attacker never needs the email to be opened or even delivered. SOCRadar's independent write-up adds that the underlying mechanism drives Magento's own dependency-injection code-scanner classes (paths normally reserved for the CLI DI compiler) into including the attacker-poisoned log/report file. Sansec reproduced the full unauthenticated chain on clean Magento Open Source 2.4.7, 2.4.8 and 2.4.9; the first confirmed victim was running 2.4.6-p15 with the July and August 2026 security patches already applied and a clean `security:patch-status`, and moving sessions to Redis/database storage did not stop the attack. Adobe shipped an emergency hotfix (APSB26-146, priority 1, CVE-2026-75650, CVSS 10.0) on 2026-09-07 at 20:20 UTC as a composer patch (`VULN-39341`) rather than a full release, three days after first confirmed exploitation; Adobe additionally recommends rotating every credential the Magento encryption key protects (admin passwords, REST/SOAP/GraphQL tokens, OAuth secrets, payment-gateway API credentials, DB/SSH/deploy keys), since rotating the encryption key alone does not invalidate anything already read by an attacker. Post-exploitation, the primary operator's implant is a small, statically linked Rust binary that masquerades under kernel-worker-like or legitimate-daemon process names (observed as `[kworker/u:8:0]`, then renamed to `fc-cache`, then to `chronyd`) and persists via a cron entry written directly to the spool file (bypassing `crontab -e` and its logging); its beaconing is disguised as NTP time-sync traffic on UDP port 123 rather than a conventional HTTPS callback, and it checks `/proc/self/status` for `TracerPid` to detect debugger/tracing attachment before deciding whether to beacon. Sansec separately observed an unrelated second attacker using StyleSmuggler as an entry point to drop a PHP web shell into the product-image cache directory, gated behind a custom request header, preceded by an out-of-band (OAST-style) reconnaissance probe that exfiltrates OS/user/writability data one DNS/HTTP label at a time with no response ever needed from the target.
    region_nexus: "global; any Magento Open Source or Adobe Commerce storefront, including public-sector or public-institution e-commerce, ticketing or fee-payment portals built on the platform"
    primary_sector_nexus: "indirect"
    sector: "e-commerce (indirect public-sector relevance for any Magento/Adobe-Commerce-based government storefront or payment portal)"
