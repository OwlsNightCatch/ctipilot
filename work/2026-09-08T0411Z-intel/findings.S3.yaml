  - title: "BSI confirms the Berlin state-government breach ran through TerminalFix, names the loader malware, and ties Rhysida to a five-alias actor it calls Vice Spider"
    sources:
      - { url: "https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html", publisher: "heise Security (Nico Ernst)", date: "2026-09-07", role: "primary" }
