      - { url: "https://social.bund.de/@bsi/117212729947889443", publisher: "BSI (Mastodon, @bsi@social.bund.de)", date: "2026-09-04", role: "corroborating" }
      - { url: "https://www.bluevoyant.com/blog/lorem-ipsum-trojanized-microsoft-teams-installers-multi-stage-loader-backdoor", publisher: "BlueVoyant", date: "2026-05-04", role: "corroborating (background: the Lorem Ipsum loader/backdoor BSI names as LoremIpsumLoader/AxolotLoader)" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS) → article: https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html → primary: BSI BITS advisory PDF, URL https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-287419-1032.pdf?__blob=publicationFile → primary: BSI Mastodon confirmation, URL https://social.bund.de/@bsi/117212729947889443 → background pivot: BlueVoyant's original Lorem Ipsum write-up, URL https://www.bluevoyant.com/blog/lorem-ipsum-trojanized-microsoft-teams-installers-multi-stage-loader-backdoor"
    summary: |
      Germany's BSI (federal cyber authority) published a BITS advisory (v1.0, 2026-09-04, TLP:CLEAR) stating that forensic analysis of the August 2026 compromise of Berlin's shared Landesnetz (the incident already tracked in this store) matches Microsoft's published "TerminalFix" campaign profile — the first authoritative confirmation of the specific initial-access chain behind that breach. heise's 2026-09-07 reporting adds the missing link: BSI confirmed on Mastodon, citing its own BITS notice, that TerminalFix is specifically the vector that hit Berlin's Senatsverwaltungen für Bauen und Verkehr, and named the loader deployed after initial access as "LoremIpsumLoader" (aka AxolotLoader) — which BlueVoyant researchers already documented in May 2026 as a multi-stage shellcode loader distributed via SEO-poisoned, trojanized Microsoft Teams installer downloads, notable for hiding its command-and-control traffic inside JFIF image files (payload bytes appended past the declared image boundary, XOR-obfuscated) and for using a legitimate India-based Q&A/blogging site as a dead-drop C2 resolver. BSI states this loader is attributed to the same financially motivated group responsible for the Rhysida ransomware and leak site, which BSI in turn attributes to a cluster it calls "Vice Spider" — cross-referenced in the advisory against the aliases Vice Society, WhiteNefas, White Hekate, DEV-0832 and Vanilla Tempest, active since mid-2021, using the Vice Society leak site and multiple non-self-developed ransomware families until it moved almost exclusively to Rhysida in June 2023.
      The TerminalFix mechanics themselves (per BSI + Microsoft, as already recorded in the store's TerminalFix entry) are the actionable delta for defenders: a water-holed or phished user is shown a fake Cloudflare CAPTCHA that instructs them to open Windows Terminal (Win+X, then I — not the classic ClickFix Win+R "Run" box) and paste a clipboard-seeded command. That command downloads and runs a ZIP archive containing a signed, legitimate executable (Windows' own LockScreenContentServer.exe) alongside a malicious DLL, sideloaded as dui70.dll; the DLL pulls further PowerShell stages and downloads PNG files from attacker infrastructure that carry additional code/DLLs hidden via steganography. Persistence is a Registry Run-key entry plus a roughly hourly re-check; the malware then enumerates domain trust, Active Directory, servers and backup systems, and BSI's advisory adds that operators have been observed provisioning cloud storage (e.g., Azure, via the vendor's own azcopy tool) ahead of exfiltration and standing up a Python-based reverse tunnel over TLS/WebSockets on port 443 whose in-tunnel command traffic BSI notes "may not be logged." BSI assesses the campaign as opportunistic cybercrime with no state-nexus link found, states the CAPTCHA JavaScript used has been seen on several hundred historical sites (i.e., a reusable watering-hole kit, not one-off infrastructure), and cites a commercial vendor's finding that 92% of victims named on Rhysida's leak site do eventually see data published (average 11 days after naming) — with Rhysida's targeting skewed to education and healthcare, but public administration among its top five sectors. BSI's own hardening list: PowerShell Script Block Logging, running PowerShell in Constrained Language Mode, browsers with SmartScreen, cloud-based malware detection, and treating any compromised host as a lateral-movement entry point into the wider network rather than an isolated incident.
    region_nexus: "Germany (federal-state public administration); directly transferable to Swiss federal/cantonal/communal networks given the identical PowerShell/Windows-Terminal attack surface and Rhysida's demonstrated targeting of public administration"
