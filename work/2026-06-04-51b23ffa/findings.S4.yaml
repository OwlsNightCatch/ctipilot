items:
  - title: "UN World Food Programme Gaza self-registration breach exposes names, IDs, and location data of 600,000 households"
    sources:
      - url: "https://www.upguard.com/news/world-food-programme-data-breach-2026-06-02"
        publisher: "UpGuard"
        date: "2026-06-02"
        role: "primary"
      - url: "https://www.thenewhumanitarian.org/news/2026/06/02/data-600000-gaza-households-exposed-wfp-cyber-attack"
        publisher: "The New Humanitarian"
        date: "2026-06-02"
        role: "primary"
    discovery_trace: "first seen at: risky-biz-news feed, URL https://news.risky.biz/rss/ → pivot: The New Humanitarian, URL https://www.thenewhumanitarian.org/news/2026/06/02/data-600000-gaza-households-exposed-wfp-cyber-attack (403 — bridge also failed — Wayback no snapshot) → primary: UpGuard, URL https://www.upguard.com/news/world-food-programme-data-breach-2026-06-02 (body retrieved) + corroborated by WebSearch with WFP spokesperson statement"
    summary: |
      The UN World Food Programme confirmed on 2 June 2026 that unauthorised actors accessed its Self-Registration Application (SRA), used exclusively in Palestine for Gaza humanitarian beneficiary registration. The breach occurred on 14 May 2026. Exposed data categories include names, national ID numbers, mobile phone numbers, and location data for approximately 600,000 registered households — described by UpGuard as potentially the largest-ever breach of humanitarian beneficiary data. WFP shut down the SRA platform immediately on detection, notified affected individuals via Telegram on 31 May (for an attack dated 14 May), and is conducting an ongoing investigation. No threat actor has claimed responsibility; no attribution has been made. The SRA platform was described as isolated to the Palestine operation, and WFP stated no other regional operations were affected. The combination of names, IDs, and location data creates a physical-safety risk for aid recipients in an active conflict zone, distinct from standard PII breach risks.
    ch_eu_nexus: "UN agency; GDPR does not directly apply but EDPB/member-state DPAs have jurisdiction over EU-resident WFP staff whose data may be involved; humanitarian sector EU funding context"
    public_sector_nexus: "UN agency — humanitarian public sector"
    sector: "humanitarian, public sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "WFP recently detected unauthorized access of its self-registration application (SRA) for Palestine, where individuals are able to register to receive food and cash assistance after verification"
        attribution: "WFP spokesperson (via UpGuard and The New Humanitarian)"
        source_url: "https://www.upguard.com/news/world-food-programme-data-breach-2026-06-02"
      - quote: "approximately 600,000 households in Gaza had their personal data exposed, including 'names, ID numbers, mobile numbers, and location details'"
        attribution: "UpGuard"
        source_url: "https://www.upguard.com/news/world-food-programme-data-breach-2026-06-02"
    extended_notes: |
      Breach occurred 14 May 2026; WFP notified affected individuals via Telegram 31 May; public confirmation 2 June. Incident illustrates a humanitarian-operations data-security gap: aid registration portals that collect national ID + location data at scale create high-value targets in conflict zones. No CVE; attack vector not disclosed. For defenders: humanitarian portals handling conflict-zone beneficiary data warrant the same security baseline as government identity systems — MFA, dedicated threat monitoring, air-gapped backup of registration data.

  - title: "Shared hotel reservation-software breach exposes guest data across 100+ Dutch (and Belgian/Irish) properties — phishing wave follows"
    sources:
      - url: "https://www.dutchnews.nl/2026/06/mass-data-breach-on-over-100-dutch-hotels-hits-guests/"
        publisher: "DutchNews.nl"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.techzine.eu/news/security/141806/dozens-of-dutch-hotels-affected-by-data-breach/"
        publisher: "Techzine EU"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: risky-biz-news feed, URL https://news.risky.biz/rss/ item 'Major breach impacts ~100 Dutch hotels' → pivot: nos.nl article https://nos.nl/artikel/2616863-meerdere-nederlandse-hotels-getroffen-door-datalek (Dutch, summarised inline) → primary: DutchNews.nl, URL https://www.dutchnews.nl/2026/06/mass-data-breach-on-over-100-dutch-hotels-hits-guests/ → corroborating: Techzine EU, URL https://www.techzine.eu/news/security/141806/dozens-of-dutch-hotels-affected-by-data-breach/"
    summary: |
      More than 100 hotels in the Netherlands, with additional reports from Belgium and Ireland, have been struck by a data breach exposing guest reservation records including names, contact details, and arrival/departure dates. Hospecs, the Dutch hospitality services group coordinating disclosure, assessed the root cause as a vulnerability in a shared software layer — specifically booking, channel-management, or property-management software used across multiple independent hotel properties — rather than any individual hotel's own systems. The breach was dated by Hospecs from incidents beginning 25 May 2026; reports were still accumulating at time of publication (3 June 2026). Criminals immediately weaponised the stolen reservation data by sending contextually accurate phishing messages to guests with active bookings, requesting fake payment confirmation — a high-conversion social-engineering vector because the messages reference real upcoming stays. The Dutch Data Protection Authority (Autoriteit Persoonsgegevens) has opened an investigation; Dutch GDPR breach-notification obligations (72 hours) apply to each affected hotel as a data controller. The name of the underlying software vendor has not yet been publicly confirmed; Hospecs is collecting evidence from affected properties.
    ch_eu_nexus: "Netherlands + Belgium + Ireland — EU/EEA directly; Dutch AP investigation in progress; GDPR Article 33/34 obligations triggered for each affected hotel; supply-chain attack on an SME hospitality SaaS provider with wide EU deployment"
    public_sector_nexus: "indirect — hospitality private sector, but EU GDPR enforcement and AP investigation directly relevant to CH/EU defenders"
    sector: "hospitality, travel"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Hospecs managing director Tim Vissers indicated the vulnerability likely stems from 'a shared software provider used by multiple hotels' rather than individual hotel systems"
        attribution: "Techzine EU"
        source_url: "https://www.techzine.eu/news/security/141806/dozens-of-dutch-hotels-affected-by-data-breach/"
      - quote: "The breach was disclosed by Dutch hospitality services company Hospecs, which says affected guests have received messages asking them to confirm and pay for existing reservations"
        attribution: "DutchNews.nl"
        source_url: "https://www.dutchnews.nl/2026/06/mass-data-breach-on-over-100-dutch-hotels-hits-guests/"
    extended_notes: |
      Classic software-supply-chain breach pattern in the hospitality vertical: one compromised SaaS provider upstream creates simultaneous victim exposure across hundreds of downstream customers (hotels) that each hold GDPR controller liability but had no visibility into the upstream compromise. Dutch AP's 72-hour clock starts from when each controller "becomes aware." Detection opportunity: anomalous bulk-read API calls on reservation endpoints (READ all bookings for current/future stays); exfil pattern consistent with structured-data harvesting rather than ransomware precursor. Downstream phishing wave uses reservation contextual data (arrival date, hotel name) as authenticity signals — standard social-engineering uplift from stolen structured data.

  - title: "IMA Diligence Services data breach — Genesis ransomware claims 700 GB from legacy third-party server; 525,000 affected including SSNs, financials, medical data"
    sources:
      - url: "https://imadiligence.com/ima-diligence-services-llc-notice-of-a-data-event"
        publisher: "IMA Diligence Services (victim statement)"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.securityweek.com/ima-diligence-services-data-breach-impacts-525000-people/"
        publisher: "SecurityWeek"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: securityweek.com listing page, URL https://www.securityweek.com/ → article: SecurityWeek, URL https://www.securityweek.com/ima-diligence-services-data-breach-impacts-525000-people/ → victim statement: IMA Diligence Services, URL https://imadiligence.com/ima-diligence-services-llc-notice-of-a-data-event"
    summary: |
      IMA Diligence Services LLC (formerly RedRidge Diligence Services), a financial due-diligence consulting subsidiary of IMA Financial Group, disclosed on 29 May 2026 that an unauthorised actor accessed a legacy server hosted by a third party between 8–16 December 2025. Stolen data for 525,306 individuals spans names, Social Security numbers, driver's license numbers, financial account and credit card numbers, health-insurance and medical information, and — for a subset — passport numbers and taxpayer identification numbers. The Genesis ransomware group claimed responsibility and alleged exfiltration of 700 gigabytes including personal and business documents. IMA notified law enforcement, engaged third-party cybersecurity forensics, decommissioned the affected legacy server, and is providing 12 months of credit monitoring and identity restoration services. The Indiana Attorney General was notified. No patch or vulnerability identifier was disclosed; the breach vector on the third-party legacy server is unspecified.
    ch_eu_nexus: "US-headquartered firm; EU data subjects may be affected if IMA conducted due diligence involving European individuals (financial sector supply-chain context); Genesis ransomware group has previously targeted European financial firms"
    public_sector_nexus: "indirect — private financial consulting sector"
    sector: "finance, professional services"
    cves: []
    actors_campaigns_malware: ["Genesis ransomware"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The affected individuals' personal information was stolen from a legacy server managed by a third party"
        attribution: "IMA Diligence Services (victim statement)"
        source_url: "https://imadiligence.com/ima-diligence-services-llc-notice-of-a-data-event"
      - quote: "The Genesis ransomware group claimed responsibility, alleging 700 gigabytes of exfiltrated data including personal information and business documents"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/ima-diligence-services-data-breach-impacts-525000-people/"
    extended_notes: |
      Breach-to-disclosure lag: access 8–16 December 2025, victim statement issued 29 May 2026 (~165 days). This is typical for ransomware claims where the actor does not immediately publish and victims investigate before notifying. Third-party legacy server as the breach surface is a recurring pattern — decommissioned or transitional infrastructure that retains sensitive data after its operational lifecycle has ended. Defenders: audit legacy servers in managed/hosted environments for residual PII; apply the same data-classification and retention policies to third-party-managed infrastructure as to primary systems. Genesis ransomware (not to be confused with the Genesis Market credential-theft platform) is a financially motivated ransomware group; EU nexus for defenders is indirect but material if the group is active in the region.

  - title: "OFAC sanctions Nobitex (Iran's largest crypto exchange) for IRGC-affiliated ransomware processing and sanctions evasion"
    sources:
      - url: "https://home.treasury.gov/news/press-releases/sb0519"
        publisher: "US Treasury OFAC (primary)"
        date: "2026-06-02"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/the-us-sanctions-nobitex-crypto-exchange-used-by-ransomware/"
        publisher: "BleepingComputer"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer.com listing, URL https://www.bleepingcomputer.com/news/security/ → primary: US Treasury OFAC press release, URL https://home.treasury.gov/news/press-releases/sb0519"
    summary: |
      On 2 June 2026, OFAC designated Nobitex (Iran's largest digital-asset exchange, handling >50% of Iranian digital-asset inflows in 2025) and three other Iranian platforms (Wallex, Bitpin, Ramzinex) under Executive Orders 13224 and 13902. The designation explicitly cites Nobitex's role in "facilitating payments for IRGC-affiliated ransomware actors" — wallets associated with IRGC ransomware operations processed transactions through the exchange. Nobitex additionally served as a sanctions-evasion vehicle for the Central Bank of Iran and enabled IRGC operatives to access international digital-asset exchanges. Four individuals — chairman/co-founder Amir Hossein Rad, CEO Seyed Ali Khoee, and co-founders Seyed Mohammad Ali Aghamir and Seyed Mohammad Aghamir — were personally designated. The action is characterised as Treasury's largest enforcement action against Iran's digital-asset economy. All US-person transactions with these entities and their 50%+ subsidiaries are prohibited. For European defenders, the designation signals that IRGC-affiliated ransomware groups have been actively routing ransom proceeds through Nobitex; any cryptocurrency forensics trail from an IRGC-linked ransomware incident that touches Nobitex wallet clusters is now an OFAC compliance consideration for EU financial institutions with US nexus.
    ch_eu_nexus: "OFAC action; EU financial institutions with US correspondent relationships must screen against new SDN designations; IRGC ransomware groups (MuddyWater, OilRig affiliates) have targeted European infrastructure; Nobitex wallet clusters now formally confirmed as IRGC ransomware proceeds conduit"
    public_sector_nexus: "indirect — financial compliance; IRGC ransomware groups have targeted EU public-sector and critical infrastructure"
    sector: "finance, cryptocurrency, sanctions"
    cves: []
    actors_campaigns_malware: ["IRGC-affiliated ransomware actors (unnamed)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Nobitex has provided significant support to the regime, processing more than 50 percent of all Iranian digital asset inflows in 2025 and facilitating payments tied to Iran's terrorist activities, sanctions evasion efforts, and Islamic Revolutionary Guard Corps (IRGC)-linked transactions, including activity associated with IRGC-affiliated ransomware actors."
        attribution: "US Treasury OFAC press release sb0519"
        source_url: "https://home.treasury.gov/news/press-releases/sb0519"
    extended_notes: |
      The press release also notes Nobitex was the subject of a $90M hack on 18 June 2025; co-founder Rad helped reconstitute operations post-hack. The designation creates compliance obligations for any EU financial institution, payment processor, or crypto exchange with US nexus that has processed transactions involving Nobitex wallets or its subsidiaries. IRGC ransomware nexus: groups such as MuddyWater (MOIS/IRGC-adjacent) and Iran-linked ransomware actors (Dharma/Phobos affiliates linked to IRGC contractors) have been documented targeting EU critical infrastructure; Nobitex now formally named as their proceeds conduit.

  - title: "Symantec/Carbon Black: five-month email-exfiltration espionage operation against unnamed global stock-exchange executive via masqueraded Aspose OST stealer, Dropbox/OneDrive C2"
    sources:
      - url: "https://www.security.com/threat-intelligence/stock-exchange-espionage"
        publisher: "Broadcom / Symantec Threat Intelligence"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.securityweek.com/hackers-target-global-stock-exchange-in-espionage-operation/"
        publisher: "SecurityWeek"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: securityweek.com listing page, URL https://www.securityweek.com/ → article: SecurityWeek, URL https://www.securityweek.com/hackers-target-global-stock-exchange-in-espionage-operation/ → primary: Symantec/Broadcom TI blog, URL https://www.security.com/threat-intelligence/stock-exchange-espionage"
    summary: |
      Broadcom's Symantec and Carbon Black published on 3 June 2026 a detailed technical writeup of a five-month targeted espionage campaign (October 2025–March 2026) against a senior executive at an unnamed global stock exchange. Initial access vector is undisclosed; the attacker established persistence using masqueraded binaries — armsvc.exe (Adobe Acrobat Reader Manager) and oneservice.exe (OneDrive) — and registered scheduled tasks under names mimicking legitimate Windows services. The actor deployed a custom Aspose-based OST (Outlook mail store) stealer that parsed and exfiltrated the target's complete mailbox in small batches via the Dropbox API and OneDrive Personal storage, deliberately using hard-coded Microsoft IP addresses rather than DNS hostnames to evade DNS-level detection. Additional tooling included FRPC (Fast Reverse Proxy Client), SharpDecryptPwd (credential extraction), and Secretsdump (LSASS/SAM credential harvesting). The campaign is assessed as intelligence-gathering (market activity, listings, enforcement actions relevant to the exchange) rather than financially motivated. No threat actor name or nation-state attribution is provided. Operational security was notably disciplined: incremental exfiltration over months, tool naming aligned to software already present on Lenovo and Intel enterprise hardware, and use of Microsoft-operated infrastructure for C2.
    ch_eu_nexus: "Stock exchanges are critical financial infrastructure in CH/EU; technique class (cloud-storage exfiltration via Dropbox/OneDrive, masquerade-by-filename persistence, OST mail harvesting) directly applicable to European financial-sector threat hunting"
    public_sector_nexus: "indirect — financial market infrastructure; regulators and government bodies that monitor or interface with exchanges are plausible parallel targets"
    sector: "finance, critical infrastructure"
    cves: []
    actors_campaigns_malware: ["unattributed espionage actor"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The attackers deployed an Aspose-based OST stealer to incrementally exfiltrate the target's Outlook mailbox in small batches through Dropbox API and OneDrive Personal storage, avoiding detection by mimicking legitimate cloud traffic and using hard-coded Microsoft IP addresses instead of hostnames to evade DNS logging."
        attribution: "Broadcom / Symantec Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/stock-exchange-espionage"
    extended_notes: |
      Technique breakdown for detection engineers:
      - Persistence: `armsvc.exe` / `oneservice.exe` (T1036.005 Masquerade by Name or Location) in user-writable directories, scheduled tasks re-registered periodically under legitimate-looking names (T1053.005).
      - Exfil: Aspose .NET library repurposed as OST reader (T1114.001 Email Collection: Local Email Collection); Dropbox API + OneDrive Personal (T1567.002 Exfiltration to Cloud Storage). Hard-coded Microsoft IP addresses for OneDrive endpoints to bypass DNS inspection (T1071.001 Web Protocols).
      - Credential access: SharpDecryptPwd + Secretsdump (T1003.001 LSASS Memory).
      - C2: FRPC (Fast Reverse Proxy Client — legitimate open-source tool abused as T1090.002 External Proxy).

      Detection opportunities: (1) Scheduled task creation by non-SYSTEM/non-AUTHORITY processes (Windows Security EID 4698 / Sysmon EID 12); (2) outbound HTTPS to Dropbox API endpoints (api.dropboxapi.com) from non-browser processes; (3) .ost file reads by processes other than Outlook.exe (Sysmon EID 11 on OST paths); (4) FRPC binary signatures or network patterns (TLS to FRPC server port ranges). The 150-day dwell time underscores that email-focused espionage campaigns can remain undetected in organisations that lack mailbox audit logging and DLP on cloud-storage uploads.

      NOTE: Victim identity (exchange name) not disclosed by Symantec. No MITRE ATT&CK group attribution. Not an EU-confirmed incident but technique-relevance for CH/EU financial sector is HIGH.

