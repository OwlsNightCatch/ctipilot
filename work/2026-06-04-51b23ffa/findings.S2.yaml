items:
  - title: "NCSC Switzerland Week 22 Report: Booking.com data breach fuels targeted WhatsApp hotel-booking phishing against Swiss/EU travellers"
    sources:
      - url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_22.html"
        publisher: "NCSC Switzerland"
        date: "2026-06-02"
        role: "primary"
      - url: "https://www.malwarebytes.com/blog/data-breaches/2026/04/booking-com-breach-gives-scammers-what-they-need-to-target-guests"
        publisher: "Malwarebytes"
        date: "2026-04"
        role: "background"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_22.html → primary (no pivot needed)"
    summary: |
      NCSC Switzerland published its Week 22 weekly report on 2026-06-02 documenting a surge in fraudulent WhatsApp phishing targeting hotel-booking customers. Two distinct attack variants exploit a Booking.com data breach (April 2026) that exposed real booking details (dates, hotel names, guest names). Variant 1 delivers a fake refund claim via WhatsApp, redirecting to phishing pages that spoof TWINT and Swiss bank portals to harvest credit card numbers. Variant 2 uses compromised hotel booking-system credentials ("account takeover") to impersonate hotels through official booking channels, demanding urgent credit card re-verification to prevent cancellation — a socially-engineered push notification that bypasses user suspicion because it arrives from legitimate hotel systems. The attack chain maps to T1566.002 (Spearphishing Link) and T1078.004 (Cloud Accounts — booking system credential abuse). Swiss public, government employees (who book travel via Booking.com), and SMEs with corporate travel are all in scope. NCSC advises: never click unsolicited links in WhatsApp; verify directly via official hotel phone numbers; immediately contact your bank/card issuer if credentials were entered.
    ch_eu_nexus: "direct Switzerland nexus — NCSC Switzerland primary warning, TWINT (Swiss payment app) spoofed in phishing kit"
    public_sector_nexus: "direct — Swiss federal employees and public-sector travellers targeted through hotel bookings"
    sector: "public-sector, travel, finance"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The NCSC has noted an uptick in reports of fraudulent WhatsApp messages relating to hotel bookings."
        attribution: "NCSC Switzerland"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_22.html"
      - quote: "A data leak in the Booking.com environment in April 2026 gave criminals access to sensitive data, which they are now exploiting through personalised scam messages."
        attribution: "NCSC Switzerland"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_22.html"

  - title: "CVE-2026-8181 (Burst Statistics) + CVE-2026-8206 (Kirki) — dual authentication-bypass / privilege-escalation flaws in 700K+ WordPress installations, actively exploited in attacks on European websites"
    sources:
      - url: "https://www.securityweek.com/kirki-burst-statistics-wordpress-plugin-flaws-in-attackers-crosshairs/"
        publisher: "SecurityWeek"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/critical-kirki-flaw-exploited-to-hijack-wordpress-admin-accounts/"
        publisher: "BleepingComputer"
        date: "2026-06-02"
        role: "primary"
      - url: "https://www.heise.de/news/Angriffe-auf-Burst-Statistics-Plugin-fuer-WordPress-11317017.html"
        publisher: "heise Security (DE)"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec feed https://www.heise.de/security/feed.xml → pivot: SecurityWeek June 3 combined article → pivot: BleepingComputer Kirki June 2 article"
    summary: |
      Two concurrent unauthenticated authentication-bypass / privilege-escalation vulnerabilities in widely deployed WordPress plugins are under active mass-exploitation. **CVE-2026-8181 (CVSS 9.8) — Burst Statistics plugin v3.4.0–3.4.1.1** (200,000+ active installs, privacy-focused analytics): the `is_mainwp_authenticated()` function in the REST API handler returns incorrect values when validating HTTP Basic Auth application passwords, allowing an unauthenticated attacker who knows any administrator username to impersonate that administrator over the WordPress REST API (T1190, T1078.001 — default credential bypass pathway). This enables rogue admin account creation (T1136.001). Patched in v3.4.2 (released 2026-05-12). Wordfence blocked 7,400+ attacks in a single 24-hour window at peak. **CVE-2026-8206 (CVSS 9.8) — Kirki Freeform Page Builder v6.0.0–6.0.6** (500,000+ active installs): the custom REST endpoint `handle_forgot_password()` accepts an arbitrary attacker-controlled email address alongside a victim username in the password-reset request, redirecting the reset token to the attacker's inbox — full account takeover of any role including admin with no user interaction (T1078.001 via password-reset abuse). Patched in v6.0.7 (2026-05-18). Wordfence blocked 222+ attempts in 24 hours after public disclosure. Both plugins are heavily deployed across European public-sector and government web properties that use WordPress. Detection: WordPress access logs for REST API paths `/wp-json/*/mainwp` (Burst), `/wp-json/*/forgot-password` (Kirki) with unauthenticated requests; user-creation events in WordPress activity log for unknown admin accounts. Hardening: enforce REST API auth for privileged endpoints; deploy WAF rules; disable unused plugins.
    ch_eu_nexus: "indirect but high relevance — WordPress is the dominant CMS for EU public-sector and municipal websites; Kirki and Burst Statistics have significant EU deployment; heise.de (DE/CH readership) covered June 3"
    public_sector_nexus: "indirect — WordPress widely used by Swiss/EU municipalities, government portals, public health sites"
    sector: "public-sector, government, municipal, SME"
    cves: [CVE-2026-8181, CVE-2026-8206]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The flaw allows unauthenticated attackers to impersonate known admin users during REST API requests, and even create rogue admin accounts."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/kirki-burst-statistics-wordpress-plugin-flaws-in-attackers-crosshairs/"
      - quote: "The plugin accepts an arbitrary email address when a username is used in the password reset request, making it possible for unauthenticated attackers to send a password reset link for any user registered on the site to their own email address."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-kirki-flaw-exploited-to-hijack-wordpress-admin-accounts/"

  - title: "Progress Sitefinity CMS five critical/high vulnerabilities (CVE-2026-7312 CVSS 10.0, CVE-2026-7198 CVSS 9.8) — unauthenticated access via OData/ServiceStack web services; BSI WID-SEC-2026-1783 issued June 3"
    sources:
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1783"
        publisher: "BSI CERT-Bund"
        date: "2026-06-03"
        role: "primary"
      - url: "https://community.progress.com/s/article/Sitefinity-Security-Advisory-for-Addressing-Security-Vulnerabilities-CVE-2026-7312-CVE-2026-7198-CVE-2026-7195-CVE-2026-7201-CVE-2026-7313-May-2026"
        publisher: "Progress Software"
        date: "2026-06-02"
        role: "primary"
    discovery_trace: "first seen at: bsi-rss bridge → WID-SEC-2026-1783 new advisory June 3 → BSI CSAF bsi-csaf WID-SEC-2026-1783 for CVE details → Progress Community vendor advisory for technical specifics"
    summary: |
      BSI CERT-Bund issued WID-SEC-2026-1783 on 2026-06-03 for a cluster of five vulnerabilities in Progress Sitefinity CMS, a .NET Web Content Management platform with significant European public-sector and government deployments (including FAO, and German/Swiss government web properties with German language pack). Five CVEs spanning CVSS 10.0 to 8.7:
      - **CVE-2026-7312 (CVSS 10.0, CWE-284 — improper access control):** OData web services endpoint; affects versions 14.0–15.4 (pre-15.4.8630). Remote unauthenticated attacker can bypass all access controls on OData APIs.
      - **CVE-2026-7198 (CVSS 9.8, CWE-20 — improper input validation):** OData web services; affects 15.4.8623–15.4.8629 only (narrow version band). Network-accessible improper input validation.
      - **CVE-2026-7201 (CVSS 8.8, CWE-522 — insufficiently protected credentials):** ServiceStack web services; affects v15.2–15.4. Credential leakage via services.
      - **CVE-2026-7313 (CVSS 8.7):** Affects v8.0–13.3 (legacy branch).
      - **CVE-2026-7195 (CWE-20):** Improper input validation in web services.
      No exploitation in the wild reported. Patched versions: 15.4.8630, 15.3.8531, 15.2.8441, 15.1.8335. Sitefinity is deployed across government and public-sector web properties in Germany, Austria, Switzerland (DE language pack) and across EU institutions. Detection: Monitor IIS/Sitefinity access logs for unauthenticated OData API calls (`/sf/system/`, `$metadata`, batch requests). Hardening: Apply the vendor update urgently; restrict OData web service interfaces at the WAF/network layer; disable ServiceStack services if not required. Maps to T1190 (Exploit Public-Facing Application) on the web content management surface.
    ch_eu_nexus: "direct — BSI advisory + German/Swiss government Sitefinity deployments; Progress specifically offers a German language pack for DACH region; EU government/public institution web properties known to run Sitefinity"
    public_sector_nexus: "direct — CMS used by government and public institutions as their web platform"
    sector: "public-sector, government, municipal"
    cves: [CVE-2026-7312, CVE-2026-7198, CVE-2026-7201, CVE-2026-7313, CVE-2026-7195]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Ein entfernter, anonymer Angreifer kann mehrere Schwachstellen in Progress Software Sitefinity ausnutzen, um Sicherheitsmaßnahmen zu umgehen und so die Vertraulichkeit, Integrität und Verfügbarkeit zu gefährden."
        attribution: "BSI CERT-Bund (WID-SEC-2026-1783)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1783"

  - title: "EU Cyber Resilience Act passes its first hard operational milestone on 11 June 2026 — notifying-authority designation deadline, with September 2026 manufacturer-reporting obligations next"
    sources:
      - url: "https://www.hoganlovells.com/en/publications/eu-cyber-resilience-act-getting-ready-for-cra-compliance-in-2026"
        publisher: "Hogan Lovells (legal commentary)"
        date: "2026"
        role: "primary"
      - url: "https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
        publisher: "European Commission Digital Strategy"
        date: "2026"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EU CRA June 2026 milestone notifying authority deadline') → Hogan Lovells article → European Commission digital strategy implementation factpage"
    summary: |
      The EU Cyber Resilience Act (CRA) reaches its first hard operational milestone on **11 June 2026**, seven days from today. EU Member States must by that date designate notifying authorities empowered to assess, designate, and notify conformity assessment bodies (CABs) — the bodies that will eventually perform mandatory third-party security evaluations for "important" and "critical" product categories under CRA Chapter IV. This milestone gate-keeps the entire conformity-assessment ecosystem: manufacturers requiring third-party certification (rather than self-attestation) cannot access a notified body until their Member State's authority has made the notification. The next mandatory date is **11 September 2026**, when manufacturers must begin actively exploited vulnerability reporting to ENISA and national CSIRTs under Article 14. Switzerland, as a non-EU state, does not fall under CRA directly but Swiss software and hardware manufacturers exporting to the EU are impacted by third-party conformity requirements once notified bodies are designated. Swiss NCSC and ENISA's formal collaboration means Swiss-origin software security claims may eventually align with CRA-compatible evidence requirements. Detection/Hardening relevance: Swiss federal SOC teams procuring products from EU-regulated manufacturers should expect, by mid-September 2026, a new stream of formal incident notifications from product vendors (as CRA Article 14 reporting kicks in). This creates a new intelligence vector for defenders to monitor.
    ch_eu_nexus: "direct — EU regulation with Switzerland-adjacent supply chain and export impact; Swiss software manufacturers affected; NCSC.ch aligns policy with EU"
    public_sector_nexus: "direct — EU public administrations and Swiss Confederation procure CRA-regulated products"
    sector: "public-sector, government, technology, policy"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Chapter IV on the notification of conformity assessment bodies will apply from 11 June 2026"
        attribution: "Hogan Lovells / European Commission CRA implementation"
        source_url: "https://www.hoganlovells.com/en/publications/eu-cyber-resilience-act-getting-ready-for-cra-compliance-in-2026"

  - title: "Europol IOCTA 2026: ransomware shifts to pure data extortion, DragonForce/LockBit/Qilin cartel alliance emerges, hybrid state-criminal convergence — EU law enforcement threat baseline"
    sources:
      - url: "https://www.europol.europa.eu/publication-events/main-reports/iocta-2026-evolving-threat-landscape"
        publisher: "Europol"
        date: "2026-04-29"
        role: "primary"
      - url: "https://industrialcyber.co/reports/europol-iocta-2026-report-flags-shift-to-industrialised-cybercrime-powered-by-ai-ransomware-and-data-theft/"
        publisher: "Industrial Cyber"
        date: "2026-04-29"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Europol IOCTA 2026') → Europol publication page → Industrial Cyber detailed article"
    summary: |
      Europol published IOCTA 2026 on 2026-04-29 (outside the 36-hour window but note: this is the annual threat baseline report appropriate for Background context). Key EU-relevant findings: (1) **Ransomware ecosystem**: 120+ active ransomware brands in 2025; dominant players Qilin, Akira, LockBit, DragonForce, Fog, BlackBasta, Cl0p, Play. Late-2025 cartel: DragonForce + LockBit + Qilin formed an alliance with coordinated victim-sharing. Shift away from encryption-based extortion toward pure data theft + exposure threat. (2) **Hybrid threat convergence**: state-sponsored actors increasingly use cybercriminal proxies for DDoS, intrusion, and ransomware — Russia/Iran-linked groups using CaaS infrastructure. Boundaries between state and criminal operations "blurring." (3) **AI-enabled crime**: AI integration into RaaS platforms for automation, victim monitoring, ransom negotiation. AI-generated deepfakes and social engineering. (4) **Scattered LAPSUS$ Hunters (SLSH)**: new alliance (August 2025) combining Scattered Spider, ShinyHunters, LAPSUS$ — targeting global organisations with vishing and social engineering. (5) EU public-sector (government, critical infrastructure) remains primary targeting category. [NOTE: Publication date 2026-04-29 is outside the 36-hour window; flagged here for Background use only per § 4/PD-10 rule, not as a primary in-window finding.]
    ch_eu_nexus: "direct — Europol report covering EU member states' threat landscape, published by EU law-enforcement agency"
