  - title: "Devolutions Server DEVO-2026-0013/0014: MFA bypass (CVE-2026-9047 CVSS 7.5) and LDAP coercion exposing PAM credentials (CVE-2026-7325 CVSS 7.1) — impacts privileged-access tools used across EU IT teams"
    sources:
      - url: "https://devolutions.net/security/advisories/DEVO-2026-0013/"
        publisher: "Devolutions"
        date: "2026-05-21"
        role: "primary"
      - url: "https://devolutions.net/security/advisories/DEVO-2026-0014/"
        publisher: "Devolutions"
        date: "2026-06-02"
        role: "primary"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1781"
        publisher: "BSI CERT-Bund"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-rss bridge → WID-SEC-2026-1781 new advisory June 3 → BSI CSAF bsi-csaf WID-SEC-2026-1781 → Devolutions advisory DEVO-2026-0014 link → separately fetched DEVO-2026-0013 for full context"
    summary: |
      Two Devolutions Server advisory batches published in the window, with BSI issuing WID-SEC-2026-1781 on 2026-06-03. Devolutions Server is a self-hosted centralised PAM / privileged-credential management platform widely used across European MSPs, IT departments, and public-sector IT teams. **DEVO-2026-0013 (2026-05-21)** — twelve CVEs; highest severity: (a) **CVE-2026-9047 (CVSS 7.5 High)** — improper factor-key state handling in MFA management: an attacker who knows a user's password and triggers MFA reconfiguration can bypass multi-factor authentication for that account (T1556.006 — MFA bypass); (b) **CVE-2026-7325 (CVSS 7.1 High)** — LDAP coercion exposing PAM provider authentication material: a low-privileged authenticated user can coerce an LDAP authentication request from the server to an attacker-controlled host, extracting PAM credentials in transit (T1557 — Adversary-in-the-Middle; LDAP relay/coerce pattern analogous to NTLM coerce techniques). Patch: 2026.1.19.0 / 2025.3.22.0. **DEVO-2026-0014 (2026-06-02)** — three additional CVEs, all improper access control (CVSS 2.1–5.4), patched in 2026.2.4 / 2026.1.20. Detection: LDAP bind events from the Devolutions Server host to unexpected destinations (Sysmon EID 3, network connection to untrusted host on LDAP port); MFA configuration-change events followed by immediate login from new IP. Hardening: patch to 2026.1.19.0+ / 2025.3.22.0+; enforce network-level controls blocking LDAP to external hosts from the Devolutions Server host.
    ch_eu_nexus: "indirect — Devolutions Server is a popular PAM/credential tool deployed across European MSPs and public-sector IT; BSI issued advisory"
    public_sector_nexus: "indirect — PAM tools are core infrastructure in Swiss federal IT and EU public-sector environments"
    sector: "public-sector, IT-service, MSP"
    cves: [CVE-2026-9047, CVE-2026-7325, CVE-2026-9223, CVE-2026-9251, CVE-2026-5171, CVE-2026-10615, CVE-2026-9522, CVE-2026-9590]
    actors_campaigns_malware: []
