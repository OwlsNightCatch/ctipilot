    extended_notes: |
      This is the latest installment in an ongoing series this store already tracks under `actor:nightmare-eclipse` (prior entries include the RogueLantern/GreenPlasma/ShieldBreak/CloudSync-Root-Registration Defender-abuse chain). LevelBlue's detection table (process-lineage anomalies on avpui.exe, non-Avast callers of \\.\aswSnx, the hardcoded named pipes \\PRETTYPRAGUE and \\FALCONFLANK, unexpected CMSTPLUA/ICMLuaUtil COM instantiation, and non-NVIDIA processes mapping NVIDIA shared-memory sections) is behavioral rather than static-indicator-based and is directly reusable for EDR/SIEM detection engineering — worth surfacing prominently for a technical audience running any of the affected products. No CVEs were assigned by any party in the source material.

  - title: "Mantax Otax: an Indonesian Android malware fuses ransomware, spyware and remote screen/audio control into one hybrid, with a GitHub-hosted dead-drop resolver for C2 domain rotation"
    sources:
      - { url: "https://zimperium.com/blog/mantax-otax-indonesian-mobile-ransomware-with-spyware-integration/", publisher: "Zimperium zLabs", date: "2026-09-09", role: primary }
    discovery_trace: "first seen at: zimperium-zlabs (S3 rotation source), URL https://zimperium.com/blog → primary: https://zimperium.com/blog/mantax-otax-indonesian-mobile-ransomware-with-spyware-integration/ (corroboration attempted; no independent second-source technical write-up found beyond aggregator reposts of this Zimperium primary)"
    summary: |
      Zimperium's zLabs documents Mantax Otax, an Android malware family distributed as a sideloaded APK via third-party file-sharing links, that escalates through device-administrator, SMS/contacts/audio/image and finally Accessibility permissions to gain near-total device control. Its C2 layer resolves the active command server dynamically from a GitHub-hosted repository entry (a dead-drop-resolver pattern) so operators can pivot infrastructure without any code change, then registers the device (with geolocation, carrier and OS version) and requests a per-device AES encryption key over HTTPS before scanning external storage for media, documents, archives, databases and cryptographic-key files; on Android 9 and earlier it fully encrypts and deletes the originals (appending `.enc`), while Android 10+'s Scoped Storage confines the blast radius to the app's own sandboxed directory. Encryption is followed by an interactive on-screen extortion chat brokered through Firebase — a server misconfiguration on the actor's own infrastructure exposed both the extortion dialogues and a screenshot of the attacker's C2 panel listing all infected devices. Beyond ransomware, the malware harvests contacts, call logs, SMS (explicitly including OTP codes), browser history, Google account configuration and gallery media; steals WhatsApp and Telegram data by driving the Accessibility service to open chats and scrape content; abuses the Android MediaProjection API for on-demand screenshots, MP4 screen recording and near-real-time live-streaming (frames Base64-encoded and exfiltrated at short intervals) with captured media staged on the third-party host Catbox; silently captures front/rear camera photos; and overlays a fake system-lock screen to intercept the device PIN. A newer v2 variant switches its C2 transport to WebSockets and adds harassment/coercion primitives — persistent app-blocking and full-screen touch-interception overlays, dialog-spam loops, arbitrary full-screen video overlays timed to obscure background exfiltration, a "jumpscare" image-overlay loop firing every 600ms, and remote text-to-speech playback through the device speaker with attacker-controlled language/rate/pitch.
    region_nexus: "Indonesia — language indicators in recovered files and victim data point to Indonesian targeting; no Swiss or European nexus reported. Relevant to Swiss defenders primarily as a transferable technique class (GitHub-hosted dead-drop C2 resolution; sideload-only distribution bypassing app-store review; Accessibility-driven messaging-app data theft) rather than as a direct regional threat"
    primary_sector_nexus: "indirect — consumer/BYOD Android targeting, no public-sector-specific nexus reported"
    sector: "mobile; cross-sector"
    cves: []
    techniques: [T1486, T1113, T1005, T1102.001, T1056.001, T1071.001]
    affected_products: ["Android (versions 9 and earlier fully exposed to file encryption; Android 10+ mitigated by Scoped Storage)"]
    entity_keys: []
    new_entities:
      - { key: "malware:mantax-otax", type: malware, name: "Mantax Otax", aliases: [],
