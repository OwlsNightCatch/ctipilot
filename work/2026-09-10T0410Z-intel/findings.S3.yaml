    extended_notes: |
      Cross-domain overlap: CVE-2026-85046 is already tracked in the store as `2026-09-04/cve-2026-85046-chrome-v8-type-confusion-exploited` (the original Google emergency-patch entry). This item is a materially distinct escalation — a named exploit kit, a second CVE (CVE-2026-85880, patched only as of 2026-09-08 Patch Tuesday), four named actor clusters, and named payloads (GemStone, ShadowPad) — so it likely warrants its own new entry referencing the existing CVE entry in `references[]`, rather than folding into that entry's changelog; the main agent should make the final call given full cross-domain context (S1 may also have surfaced CVE-2026-85880 independently via today's Patch Tuesday coverage — check for overlap before publishing). Detection framing for defenders: watch process trees rooted at the browser (browser → command shell → curl/download utility → dropped executable), scheduled-task creation shortly after a browser-initiated download, and — because patching removes only the entry vector — audit installed Chromium extensions requesting broad host/tab/storage permissions and any browser-associated scheduled tasks created in the days before patching, since the GemStone extension and the other clusters' persistence mechanisms survive an OS/browser patch untouched.

  - title: "Nightmare-Eclipse's newest PoC wave defeats Kaspersky, Avast/GenDigital sandboxing and CrowdStrike Falcon's own optional remediation feature from a standard-user context"
    sources:
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/expanding-the-attack-surface-analyzing-nightmare-eclipses-latest-pocs", publisher: "LevelBlue (Trustwave) SpiderLabs", date: "2026-09-09", role: primary }
      - { url: "https://www.securityweek.com/nightmare-eclipse-drops-hardbreacher-kaspersky-product-exploit/", publisher: "SecurityWeek", date: "2026-08-31", role: corroborating }
      - { url: "https://www.theregister.com/security/2026/09/03/prolific-microsoft-0-day-hunter-drops-crowdstrike-falcon-exploit-poc/5294318", publisher: "The Register", date: "2026-09-03", role: corroborating }
    discovery_trace: "first seen at: trustwave-spiderlabs (S3 rotation source), URL https://www.levelblue.com/blogs/spiderlabs-blog → primary: https://www.levelblue.com/blogs/spiderlabs-blog/expanding-the-attack-surface-analyzing-nightmare-eclipses-latest-pocs → corroboration (individual PoC drops, earlier in the same wave): https://www.securityweek.com/nightmare-eclipse-drops-hardbreacher-kaspersky-product-exploit/ ; https://www.theregister.com/security/2026/09/03/prolific-microsoft-0-day-hunter-drops-crowdstrike-falcon-exploit-poc/5294318"
    summary: |
      LevelBlue SpiderLabs independently reproduced and analysed four new proof-of-concept exploits released by the pseudonymous researcher/leak persona Nightmare-Eclipse (aka Chaotic Eclipse, MSNightmare — already tracked in this store's registry for a string of prior Windows/Defender zero-day drops), all abusing trusted-software functionality rather than classic memory-corruption bugs. HardBreacher targets Kaspersky Endpoint Security: any standard-user process can place symbolic links inside its own Windows logon-session object-namespace directory (`\Sessions\0\DosDevices\{AuthId}\`) to shadow the global `C:` device namespace; the exploit builds a fake filesystem tree redirecting Kaspersky's `avpuimain.dll` load path to an attacker DLL, spawns `avpui.exe` suspended with the redirect live, then resumes it so the OS loader loads the malicious DLL — the redirect is torn down within milliseconds, leaving nothing on disk for Kaspersky's scanner to find. The exploit additionally spawns `avpui.exe` via `NtCreateUserProcess` with `PS_ATTRIBUTE_PARENT_PROCESS` set to `explorer.exe`, so EDR process-tree telemetry records Explorer, not the real caller, as the parent (parent-PID spoofing). The payload DLL then waits for the "Notification from Kaspersky Endpoint Security" popup window, hides it, and terminates `avpui.exe` from inside — in the default configuration `avpui.exe` does not auto-restart, silencing the product's user-facing channel for the rest of the session; Kaspersky patched the underlying flaw on 2026-08-31. PrettyPrague abuses Avast's behavioral-sandbox kernel driver (`\\.\aswSnx`): a standard user sends IOCTL `0x82AC0054` to have Avast run a chosen executable inside its sandbox, where the sandbox's virtualized `C:\Windows\System32\config\SAM` copy is not protected by the real SAM's ACLs; the exploit races `ReadDirectoryChangesW` to open the sandboxed SAM hive before Avast's cleanup, copies it out via a rolled-back Kernel Transaction Manager transaction (leaving no file on disk), decrypts NTLM hashes offline using the LSA boot key, and uses `SamiChangePasswordUser` from a SYSTEM context (obtained via a CMSTPLUA COM-interface UAC bypass, CLSID `{3E5FC7F9-9A51-4367-9063-A120244FBEC7}`, plus PEB masquerading as `explorer.exe`) to log in as every local admin, reverting the passwords afterward; LevelBlue assesses the same driver-trust flaw plausibly affects AVG and Norton given GenDigital's shared codebase, though it did not independently validate beyond Avast, and the flaw is now remediated. GreenSection is a lower-severity design finding: a standard user can open, map, modify and restore an NVIDIA global shared-memory section with no privilege escalation demonstrated. FalconFlank achieves local privilege escalation against CrowdStrike Falcon Sensor specifically when the optional "Microsoft Office file malicious macro removal" prevention-policy setting is enabled (not present in Falcon Government policies), using reparse points and oplocks to redirect Falcon's own remediation/file-quarantine workflow into loading an attacker DLL (`bcrypt.dll` staged under a `WindowsPowerShell\v1.0` path) — LevelBlue's own testing shows CrowdStrike's cloud ML detection (`OnWriteOfficeMacroMLMedium`) catches the artifact in default configurations, limiting real-world exploitability.
    region_nexus: "global — all four PoCs target security-vendor products (Kaspersky Endpoint Security, Avast/GenDigital sandbox driver, an NVIDIA shared-memory section, CrowdStrike Falcon Sensor) that are deployed across Swiss public-sector and any other estate running these EDR/AV products; no specific in-the-wild campaign or victim reported — these are researcher-published PoCs, not observed intrusions"
    primary_sector_nexus: "indirect — vendor-agnostic security-tooling research, not sector-targeted"
    sector: "cross-sector"
    cves: []
    techniques: [T1068, T1134.004, T1548.002, T1003.002, T1574.001, T1211]
    affected_products: ["Kaspersky Endpoint Security", "Avast Antivirus (and potentially AVG, Norton — GenDigital shared codebase, unverified by the source)", "CrowdStrike Falcon Sensor (Prevention Policy with 'Microsoft Office file malicious macro removal' enabled; not applicable to Falcon Government)", "NVIDIA driver shared-memory sections"]
    entity_keys: ["actor:nightmare-eclipse"]
    new_entities:
      - { key: "tool:hardbreacher", type: tool, name: "HardBreacher", aliases: [],
          summary: "Nightmare-Eclipse's PoC exploit against Kaspersky Endpoint Security combining session-namespace symbolic-link DLL-load-path hijacking with NtCreateUserProcess parent-PID spoofing to silently disable the product's UI/notification process; patched by Kaspersky 2026-08-31 (LevelBlue SpiderLabs, 2026-09-09)." }
      - { key: "tool:prettyprague", type: tool, name: "PrettyPrague", aliases: [],
          summary: "Nightmare-Eclipse's PoC exploit abusing Avast's aswSnx sandbox kernel driver to expose a virtualized copy of the Windows SAM database, dump and decrypt local NTLM hashes, and obtain a SYSTEM shell via a CMSTPLUA UAC bypass; remediated (LevelBlue SpiderLabs, 2026-09-09)." }
      - { key: "tool:greensection", type: tool, name: "GreenSection", aliases: [],
          summary: "Nightmare-Eclipse PoC demonstrating that a standard user can open, map and modify an NVIDIA global shared-memory section; a trust-boundary design concern with no privilege-escalation or code-execution primitive demonstrated (LevelBlue SpiderLabs, 2026-09-09)." }
      - { key: "tool:falconflank", type: tool, name: "FalconFlank", aliases: [],
          summary: "Nightmare-Eclipse PoC achieving local privilege escalation against CrowdStrike Falcon Sensor via reparse-point/oplock filesystem redirection of Falcon's optional malicious-macro-removal remediation workflow, requiring a specific optional Prevention Policy setting; detected by Falcon's own cloud ML in default test conditions (LevelBlue SpiderLabs, 2026-09-09)." }
    relation_suggestions:
