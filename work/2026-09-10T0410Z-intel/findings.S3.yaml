      - { subject: "actor:nightmare-eclipse", object: "tool:prettyprague", basis: "LevelBlue SpiderLabs analysed PrettyPrague as a Nightmare-Eclipse-released PoC (2026-09-09)" }
      - { subject: "actor:nightmare-eclipse", object: "tool:greensection", basis: "LevelBlue SpiderLabs analysed GreenSection as a Nightmare-Eclipse-released PoC (2026-09-09)" }
      - { subject: "actor:nightmare-eclipse", object: "tool:falconflank", basis: "LevelBlue SpiderLabs analysed FalconFlank as a Nightmare-Eclipse-released PoC (2026-09-09)" }
