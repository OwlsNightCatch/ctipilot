items:
  - title: "BlueMoon exploit kit: four separate state-nexus actor clusters independently weaponize a shared Chrome V8 + Windows kernel zero-day chain within one week"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit", publisher: "Proofpoint Threat Research", date: "2026-09-08", role: primary }
      - { url: "https://therecord.media/china-hackers-chrome-browser-zero-day-multiple-groups", publisher: "The Record (Recorded Future News)", date: "2026-09-09", role: corroborating }
      - { url: "https://thehackernews.com/2026/09/four-spy-groups-used-same-chrome-and.html", publisher: "The Hacker News", date: "2026-09-09", role: corroborating }
    discovery_trace: "first seen at: proofpoint (S3 rotation source), URL https://www.proofpoint.com/us/blog/threat-insight (listing) → primary: https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit → corroboration: https://therecord.media/china-hackers-chrome-browser-zero-day-multiple-groups → corroboration: https://thehackernews.com/2026/09/four-spy-groups-used-same-chrome-and.html"
    summary: |
      Proofpoint documents a newly named exploit kit, BlueMoon, that chains a Chrome V8 JIT type-confusion RCE (CVE-2026-85046, patched by Google 2026-09-03), an uncredentialed V8 sandbox escape (no CVE assigned — Chrome does not issue CVEs for V8 sandbox escapes), and a Windows kernel ALPC/WNF heap-overflow LPE (CVE-2026-85880, patched by Microsoft's 2026-09-08 Patch Tuesday, MSRC-confirmed as actively exploited) into a single click-to-SYSTEM chain. The V8 bugs were "patch-gap" zero-days: the Chromium fix for CVE-2026-85046 landed upstream 2026-08-07 but did not reach the stable Chrome release channel until 2026-09-03, a nearly four-week window during which the public diff let an exploit developer reverse-engineer and weaponize the bug before users were patched. After the Chrome-side chain achieves code execution and escapes the renderer sandbox, a reflectively loaded DLL fingerprints the host (NT build, integrity level, kernelbase.dll version) to decide whether to attempt the LPE against a specific list of older Windows 10/Server 2019/Server 2022/Windows 11 21H2 builds; a second reflectively loaded DLL runs the ALPC/WNF kernel exploit for kernel read/write and SeDebugPrivilege, then a process-injection shellcode stub injects a CreateProcess call into the parent Chrome broker process to run an operator-supplied command (by default, a plain curl download-and-execute of an actor-hosted executable — a deliberately crude, high-signal step Proofpoint reads as evidence the developer traded stealth for speed). Four distinct espionage clusters adopted the identical kit within days of each other, each pairing it with its own delivery and payload: TA412 (aka APT31/Violet Typhoon/JungleBamboo/TIDE CASTLE/RedBravo/Bronze Vinewood/Judgement Panda/PerplexedGoblin), first seen 2026-08-28, used student-internship and academic-conference spearphishing against US NGOs, mining and commodity-trading firms to install a malicious Chromium browser extension disguised as "Google Gemini" (tracked as GemStone) using a Secure-Preferences HMAC-forgery technique (GhostChrome-X, previously documented by Rubrik Zero Labs/Synacktiv) so the extension survives Chrome's own integrity check; GemStone keylogs, captures cookies/localStorage/sessionStorage, screenshots on keyword match, and polls a REST-style C2 every 30 seconds to 60 minutes. UNK_LateNight (from 2026-09-02) targeted US aerospace/defense firms with B2B/RFQ lures and used the chain to sideload the ShadowPad backdoor via a scheduled task, persisting the DLL-sideload pair with an AES-encrypted payload backed up in the registry. UNK_DoubleCheck (from 2026-09-02) sent a Vietnamese manufacturer phishing from a compromised Southeast Asian government mailbox, the only variant to obfuscate the JavaScript loader, dropping an RC4-decrypted Rust loader that pulls a second DLL-sideload stage from a Cloudflare R2 bucket. UNK_QuietRacket (from 2026-09-03) targeted government, consulting and financial-sector organizations in Indonesia and Singapore with conference-themed lures, resolving its C2 entirely through DNS-over-HTTPS TXT-record lookups that decode to a Cloudflare Worker serving a ChaCha20-encrypted .NET in-memory payload. Proofpoint assesses the rushed, low-OPSEC deployment (same-day infrastructure registration, default cleartext logging, verbose debugging comments referencing a "markdown handover document" and Google's v8CTF bug-bounty framework) is consistent with AI-assisted exploit development, and frames the multi-actor simultaneous adoption as matching a recurring pattern (seen previously around Exchange and SharePoint zero-days) suggestive of a shared "digital quartermaster" or commercial exploit broker supplying several China-nexus operators at once. Patching the browser and OS closes the entry vector but does not remove anything already installed — the GemStone extension and the scheduled-task persistence mechanisms survive a patch and require separate hunting.
    region_nexus: "global; observed targeting is US (NGOs, mining, commodity trading, aerospace/defense), Vietnam (manufacturing) and Indonesia/Singapore (government, consulting, financial sector) — no Swiss-specific targeting reported, but the underlying Chrome/Windows patch-gap technique and both CVEs are directly relevant to any Chrome/Windows estate, including Swiss public-sector deployments"
    primary_sector_nexus: "indirect — government organizations were directly targeted (Indonesia/Singapore; a compromised Southeast Asian government mailbox was used as a delivery vector), giving a partial direct public-sector nexus alongside the broader technique-class relevance"
    sector: "public-sector; cross-sector (any Chrome/Windows estate)"
