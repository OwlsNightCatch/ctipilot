    discovery_trace: "first seen at: bleepingcomputer (rotation slice, S4), URL https://www.bleepingcomputer.com/news/security/ → pivot: article URL https://www.bleepingcomputer.com/news/security/veradigm-discloses-patient-data-breach-after-gentlemen-gang-claims-attack/ → primary: victim's own SEC Form 8-K, URL https://www.sec.gov/Archives/edgar/data/1124804/000119312526385249/mdrx-20260908.htm"
    summary: |
      Veradigm Inc. (formerly Allscripts Healthcare Solutions, a US healthcare-technology vendor) filed a Form 8-K on 2026-09-08 disclosing that one of its third-party vendors suffered a cybersecurity incident: an unauthorized party obtained credentials from that vendor's own environment and used them to reach a single Veradigm application programming interface the vendor uses to deliver services on Veradigm's customers' behalf. The attacker downloaded patient personal data through that one interface, including Social Security numbers in some instances; Veradigm states explicitly that no clinical or medical data was involved and that the compromised credentials "provided access only through that limited interface and did not provide access to any other part of the Company's environment, including the Company's broader network, servers, databases, or other systems" — the scoped-API-credential design contained the blast radius to a read path rather than a network foothold. Veradigm characterises the population affected as "a small number of the Company's customers." The Gentlemen ransomware/extortion group (tracked by this store as `actor:thegentlemen`, aliases Storm-2697 / Phantom Mantis, a RaaS operation with a documented ~32% European victim share and a prior Swiss leak-site listing against DEVO-Tech AG) publicly claimed the same intrusion on 2026-09-05, asserting possession of 3.5 million patient records (full names, addresses, SSNs, emails, phone numbers) and threatening publication by 2026-09-11 without ransom negotiation — a scale claim the victim's own regulatory filing does not confirm and materially contradicts. The gap between the extortion group's stated scale and the victim's own "small number of customers" language is reported here as a live, unresolved contradiction rather than resolved fact.
    region_nexus: "US victim (Veradigm, Chicago IL); actor (`actor:thegentlemen`) carries an established ~32% European victim share and a prior Swiss leak-site listing (DEVO-Tech AG, tracked separately in the registry), plus an uncorroborated current Swiss claim (Ixa Systems SA, tracked in the coverage backlog) — same-actor nexus relevant to Swiss-based organisations relying on external vendors with API-scoped integrations"
    primary_sector_nexus: "indirect — healthcare-technology vendor breach via a third-party integration partner; the transferable lesson (scope vendor API credentials narrowly so a partner compromise cannot pivot into the broader estate) applies directly to any Swiss public-sector body that grants third-party/vendor API access into citizen- or patient-facing systems"
    sector: "healthcare, public-sector (transferable vendor-access-scoping lesson)"
