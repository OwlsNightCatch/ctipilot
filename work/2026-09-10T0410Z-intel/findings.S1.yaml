      - { key: "vuln:s4get-sap-message-server-2026", type: campaign, name: "S4GET (CVE-2026-58240)", aliases: [],
          summary: "Onapsis Research Labs' name for a CVSS 9.8 pre-auth missing-authentication flaw in the SAP NetWeaver Message Server letting an attacker fraudulently join the internal trust cluster, disclosed at SAP's September 2026 Patch Day (Onapsis, 2026-09-09)." }
