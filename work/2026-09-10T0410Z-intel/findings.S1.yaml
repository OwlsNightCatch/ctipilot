        attribution: "Onapsis Research Labs (Pablo Artuso)"
        source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"
    extended_notes: |
      Onapsis frames S4GET explicitly against the 2019 10KBLAZE Message Server exploit: 10KBLAZE abused a permissive ACL on the Message Server's internal port (39NN, rarely reachable); S4GET is a genuine vulnerability reachable on the public port (36NN) every SAP GUI user needs, making internal-network reachability the norm rather than the exception. Neither flaw is yet KEV-listed or confirmed exploited; this item is included at high priority under PD-11 because of the maximum/near-maximum severity, pre-auth reachability, and the breadth of SAP deployment across public-sector back-office systems — not because of confirmed in-the-wild activity.

  - title: "Check Point Quantum Security Gateway / Management Server / Spark Firewall: two unauthenticated CVSS 9.8 pre-auth RCE flaws in VPN certificate processing (CVE-2026-85103 heap overflow, CVE-2026-85102 improper cert validation)"
    sources:
      - { url: "https://support.checkpoint.com/results/sk/sk1000118/", publisher: "Check Point (vendor advisory sk1000118)", date: "2026-09-07", role: "primary" }
