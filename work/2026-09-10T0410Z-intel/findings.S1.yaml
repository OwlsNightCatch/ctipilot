    discovery_trace: "first seen at: kev-window mechanical sweep (work/2026-09-10T0410Z-intel/kev-window.txt) → primary: CISA KEV catalog, URL https://www.cisa.gov/news-events/alerts/2026/09/09/cisa-adds-four-known-exploited-vulnerabilities-catalog → pivot: GitHub Advisory Database, URL https://github.com/advisories/GHSA-mj8x-m8f5-x4w8 (References section names SOCRadar write-up) → primary: SOCRadar Threat Research Unit, URL https://socradar.io/blog/cve-2025-25249-pivotc2-fortigate-rat. Fortinet's own PSIRT advisory (fortiguard.fortinet.com/psirt/FG-IR-25-084) was attempted three times across three transports (direct, trafilatura, jina) and returned only an anti-bot challenge each time — logged as a fetch failure; version/patch data below is corroborated instead via SentinelOne's vulnerability-database entry and SOCRadar's own citation of the same advisory."
    summary: |
      CISA added CVE-2025-25249 to its KEV catalog on 2026-09-09: a heap-based buffer overflow (CWE-122/CWE-787) in the cw_acd CAPWAP daemon that FortiOS and FortiSwitchManager use to manage wireless access points, listening unauthenticated on UDP 5246. SOCRadar's Threat Research Unit (STRU) reports, with high confidence, that a likely Russian-speaking financially motivated cybercrime operator has exploited it since at least July 2026, targeting over 30,000 FortiGate IP addresses and infecting 178 devices. The exploit binary (fortirun.bin, a self-extracting Linux x86-64 ELF bundling a CPython runtime) fingerprints the target's CAPWAP Discovery Response to leak live image_base/data_rw memory pointers and defeat ASLR, matches the reported hw_rev/sw_ver against a hardcoded table of 13 FortiGate models and 2 FortiAP models on FortiOS 7.4.0-7.4.8, grooms the daemon's free_list_mp2 heap-chunk pool with crafted CAPWAP Add Station messages, then overflows it with a CAPWAP Image Data message to redirect execution via an ARM64 br x16 ROP gadget into execvp. Successful exploitation drops PivotC2, an AI-assisted Node.js RAT purpose-built for FortiGate post-exploitation: it maintains a persistent outbound TLS connection using an SSH-like multiplexed channel protocol, supports interactive shells, SOCKS5/HTTP proxy tunneling, port forwarding, CIDR port scanning, and — via an "auto-mode" flag — fully autonomous harvesting of FortiGate configuration files and AES-128-GCM/AES-256-CBC-encrypted credential stores (VPN PSKs, SSL-VPN and LDAP bind credentials, admin accounts) using a device-specific key pulled from /data/etc/fsv_sync.dat. In two confirmed US intrusions the operators pivoted further with ldapdomaindump, russh reverse-SSH relays, SoftPerfect Network Scanner, RDP-enablement registry edits (fDenyTSConnections/DisableRestrictedAdmin) for pass-the-hash, browser-credential/DPAPI extraction, run.ps1-driven XOR-decoded shellcode injected into svchost.exe, and exfiltration of Exchange .pst files to attacker-controlled Wasabi S3 buckets. Affected: FortiOS 7.6.0-7.6.3, 7.4.0-7.4.8, 7.2.0-7.2.11, 7.0.0-7.0.17, 6.4 (all versions); FortiSwitchManager 7.2.0-7.2.6 and 7.0.0-7.0.5; FortiSASE 25.1.a.2 and 25.2.b are also listed as affected with no patched build confirmed by any source reached this run. Fixed in FortiOS 7.6.4/7.4.9/7.2.12/7.0.18 and FortiSwitchManager 7.2.7/7.0.6. CVSS base is 8.1 (NVD/GHSA, CVSS 3.1, AV:N/AC:H/PR:N/UI:N); ENISA's EUVD mirrors NVD's temporally-adjusted score of 7.4 (E:P/RL:W/RC:C — exploit maturity Proof-of-Concept, workaround available, confirmed report); SOCRadar's write-up separately states "Critical – CVSSv3: 9.8 as per NVD", which does not match either published vector and is flagged here as an unresolved discrepancy rather than silently averaged.
