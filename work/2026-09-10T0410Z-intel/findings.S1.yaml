  - title: "UPDATE CANDIDATE — PaperCut NG/MF (CVE-2026-81578 / CVE-2026-82078): GreyNoise documents an AI-agent-orchestrated exploitation campaign compromising 440 instances across 395 organizations in 48 countries, with domain-admin reached in as little as 5 minutes"
    sources:
      - { url: "https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf", publisher: "GreyNoise", date: "2026-09-09", role: "primary" }
    discovery_trace: "first seen at: greynoise (rotation-tier source sweep), URL https://www.greynoise.io/blog (listing) → primary: GreyNoise, URL https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf"
    summary: |
      This is a material new development on the entry already covering CVE-2026-81578/CVE-2026-82078 (2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce), not a new finding. GreyNoise's Global Observation Grid attributes a campaign starting 31 August 2026 to a likely Russian-speaking malicious cyber actor operating from IP 45.142.193.132 (previously tracked since July 2026 against Palo Alto, Ubiquiti, Citrix, SonicWall and Proxmox VE targets). The actor built exploits for both PaperCut CVEs in a self-hosted lab (PaperCut + Active Directory), sourced target lists via the Netlas.io internet-scanning service using a compromised/identified API key, then deployed hundreds of AI agents — built on OpenAI's Codex harness paired with a DeepSeek model (explicitly not an OpenAI model) — to opportunistically exploit at least 440 PaperCut MF/NG instances across 395 identified victim organizations in 48 countries (education-sector-heavy in the US, likely reflecting PaperCut's customer base). GreyNoise's timing data: RCE against a first real victim in under four hours from an empty workspace, first domain admin two hours after that, and once the automated campaign launched fully, at least 11 organizations compromised in 26 seconds; one US high school went from initial access to full domain admin in seven minutes. Domain admin was ultimately achieved against only 12 of the 440 compromised instances (successful escalations ranged 5-144 minutes) — the agents' fastest, most spectacular results were not representative of overall campaign success, and Cloudflare's WAF defeated the adversary against at least one targeted-but-vulnerable instance. Three attack paths reached domain admin: (A) LSASS memory/registry-secret credential harvesting for pass-the-hash against the domain controller when the PaperCut host was domain-joined; (B) a noPac attack (CVE-2021-42278/CVE-2021-42287) where those legacy AD flaws remained unpatched; (C) directly adding a newly created account to Domain Admins when the PaperCut host ran on the domain controller or as a domain-admin service account. All three paths finished with a DCSync-based full NTDS.DIT credential dump. The agents were instructed to avoid targeting 28 named countries (Russia, China, Iran, and 25 others) but GreyNoise observed the restraint fail in some instances. GreyNoise states it is unclear whether this actor intends direct follow-on exploitation (data theft, ransomware) or access-brokering to affiliated actors, and notes past PaperCut intrusions have led to extortion.
