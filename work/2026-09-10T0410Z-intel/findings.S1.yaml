    evidence:
      - quote: "Both are remotely exploitable without authentication. According to the reporting researchers, successful exploitation of either can result in arbitrary operating system command execution under the account that owns the SAP installation"
        attribution: "CERT-EU (advisory 2026-011)"
        source_url: "https://cert.europa.eu/publications/security-advisories/2026-011/"
      - quote: "A targeted search using high-fidelity fingerprints identifies more than 10,000 unique Internet-facing IP addresses presenting an SAP web interface reachable from the public Internet, and that figure is conservative."
        attribution: "Onapsis Research Labs (JP Perez-Etchegoyen)"
