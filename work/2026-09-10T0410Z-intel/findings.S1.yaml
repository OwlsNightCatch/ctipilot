  - title: "SAP September 2026 Patch Day: OVERPASS (CVE-2026-44756, CVSS 10.0) and S4GET (CVE-2026-58240, CVSS 9.8) — two unauthenticated pre-auth RCE chains in shared SAP kernel components, reachable through ports that cannot be firewalled without breaking normal SAP GUI/RFC use"
    sources:
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-011/", publisher: "CERT-EU", date: "2026-09-09", role: "primary" }
      - { url: "https://onapsis.com/blog/sap-overpass-remediation/", publisher: "Onapsis Research Labs", date: "2026-09-09", role: "primary" }
      - { url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", publisher: "Onapsis Research Labs", date: "2026-09-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/sap-warns-of-maximum-severity-overpass-kernel-vulnerability/", publisher: "BleepingComputer", date: "2026-09-08", role: "corroborating" }
    discovery_trace: "first seen at: cert-eu (essential-source sweep), URL https://cert.europa.eu/publications/security-advisories/2026-011/ → primary: Onapsis Research Labs (OVERPASS), URL https://onapsis.com/blog/sap-overpass-remediation/ → primary: Onapsis Research Labs (S4GET), URL https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/sap-warns-of-maximum-severity-overpass-kernel-vulnerability/. Independently confirmed at NCSC-CH Security Hub, URL https://security-hub.ncsc.admin.ch/#/posts/12926."
    summary: |
      SAP's 8 September 2026 Security Patch Day fixed CVE-2026-44756 ("OVERPASS", CVSS 10.0) and CVE-2026-58240 ("S4GET", CVSS 9.8), both discovered and responsibly disclosed by Onapsis Research Labs, both remotely exploitable pre-authentication, and both reachable through access paths that cannot be closed by network segmentation alone. OVERPASS is a memory corruption (classic buffer overflow, CWE-120) in the SAP kernel's processing of the Extended Passport (EPP) — a tracing structure SAP attaches to requests that is parsed before any session authentication occurs. Because EPP handling is shared kernel code, the flaw is reachable via three independent, all-unauthenticated routes: the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS web tier — Fiori, WebGUI, APIs), the SAP Dispatcher (the SAP GUI logon protocol every classic client uses), and RFC connections between SAP systems. A single crafted EPP header can corrupt memory to yield arbitrary OS command execution as the account that owns the SAP installation. Onapsis's own Internet-wide fingerprinting found more than 10,000 unique Internet-facing IPs presenting an SAP web interface — a conservative count that structurally undercounts the SAP Web Dispatcher, which returns no distinguishing banner. Affected: SAP kernel releases KRNL64NUC/KRNL64UC 7.22 (+7.22EXT)/7.53/8.04, KERNEL 7.22/7.53/7.54/7.77/7.89/7.93/8.04/9.16/9.18/9.19/9.20, WEBDISP 9.16/9.18/9.19/9.20 — i.e., effectively every SAP NetWeaver-kernel-based product line (S/4HANA, ECC/Business Suite, NetWeaver AS ABAP, Web Dispatcher, BW/4HANA, Enterprise Portal, PI/PO, Solution Manager). Fixed via SAP Security Note 3747649 (a single kernel patch closes all three routes); an HTTP-only interim workaround is documented in Note 3756304. S4GET is a distinct logic flaw (not a misconfiguration) in the SAP NetWeaver Message Server (component BC-CST-MS, kernel lines 9.16/9.18/9.19/9.20 — native to SAP ABAP Platform 2025/S/4HANA 2025) that lets an unauthenticated network attacker send a crafted packet to the Message Server's public port (36NN — the same port every SAP GUI client connects to) to have an arbitrary IP address accepted as a trusted internal node; the Message Server propagates that false trust to every application server in the cluster, and the attacker then registers with the Gateway as internal and invokes RFC-callable external programs to reach code execution as <sid>adm on every application server. Because the flaw operates on the Gateway's trust-membership decision rather than its ACLs, the standard secinfo/reginfo/ms/acl_info hardening does not intercept it. Fixed in kernel patch levels 9.16 PL100 / 9.18 PL32 / 9.19 PL17 / 9.20 PL7 (SAP Security Note 3759472). Onapsis states it has not observed active in-the-wild exploitation of either flaw as of publication, but frames both against CVE-2025-31324 (Mandiant's 2026 M-Trends names it the most exploited vulnerability of 2025) and the 2019 10KBLAZE Message Server exploit chain as the closest historical analogues, and notes SAP patches have historically been reverse-engineered into working exploits within 72 hours.
    region_nexus: "global; SAP ERP/NetWeaver is widely deployed across Swiss federal, cantonal and public-institution back-office and finance systems"
