    summary: |
      Google's Chrome 153 stable release (2026-09-08, versions 153.0.8010.36/.37 Windows/Mac, 153.0.8010.36 Linux) fixes 230 security bugs, one of which — CVE-2026-87491, an out-of-bounds write in V8 (Chrome's JavaScript/WebAssembly engine) — Google states has an exploit in the wild: "Out-of-bounds write in V8 in Google Chrome prior to 153.0.8010.36 allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page." Google rates the bug's internal Chromium severity as Medium (reported by Jihyeon Jeong, Compsec Lab, Seoul National University, on 2026-08-06 for a $2,500 bounty), but ENISA's EUVD records a CVSS 3.1 base score of 8.8 (AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H) — user interaction (visiting/being served a crafted page) is required, but no authentication or special access. Google has disclosed no detail on the exploitation vector, victims, or actor, consistent with its standard practice of withholding bug detail until a majority of users have updated. This is the seventh Chrome zero-day Google has confirmed under active exploitation in 2026 (after CVE-2026-2441, CVE-2026-3909/CVE-2026-3910, CVE-2026-5281, CVE-2026-11645 and CVE-2026-85046 — the last of which the store already tracks from last week). Every Chromium-based browser (Edge, Brave, Opera, Vivaldi) inherits the same V8 engine and needs the equivalent update.
