    discovery_trace: "first seen at: ncsc-ch-security-hub (essential-source sweep), URL https://security-hub.ncsc.admin.ch/#/posts/12927 → primary: Check Point vendor advisory, URL https://support.checkpoint.com/results/sk/sk1000118/ and https://support.checkpoint.com/results/sk/sk1000117/ → corroborating: Forkast News, URL https://forkast.news/check-point-quantum-vpn-drops-two-cvss-9-8-cves-in-the-same-certificate-path-vpn-infrastructure-joins-the-auth-gap/"
    summary: |
      Check Point published two Critical-severity advisories (last modified 2026-09-09) for its VPN certificate-handling code. CVE-2026-85103 (CVSS 9.8) is a heap overflow in the VPN certificate ASN.1 decoding flow, reachable against both the Security Gateway and the Security Management Server; CVE-2026-85102 (CVSS 9.8, CWE-295 improper certificate validation) is an authentication-bypass-to-RCE in Remote Access and Site-to-Site VPN negotiation, reachable against the Security Gateway and Spark Firewall. Both are triggered during VPN certificate processing before authentication completes, and both were discovered internally by Check Point (no external researcher credited, no reports of active exploitation as of 2026-09-09). Affected: R81.20, R82, R82.10, and the End-of-Support R80/R80.10/R80.20/R80.30/R80.40/R81/R81.10 lines and their .x builds; R82.20 is confirmed not affected. Fix is delivered via Check Point LivePatch Take 24 (automatic if enabled) or Jumbo Hotfix Accumulator (R82.10 Take 44+, R82 Take 126+, R81.20 Take 166+), plus dedicated Spark Firewall builds (R82.00.10 Build 2325+, R81.10.17 Build 4968+). No workaround exists for the locally-managed Spark Firewall; for Site-to-Site VPN, Check Point's only interim mitigation is disabling implied VPN rules and manually restricting UDP/500 and UDP/4500 to specific peer IPs — not applicable to Remote Access VPN, which remains exposed until patched.
