      This closes the standing coverage-backlog item on Familea (tracked since 2026-09-14, "mechanism unknown" as of the 2026-09-25 re-check). The underlying vendor update was actually published/dated 2026-09-23 by French Breaches ("Mise à jour le 23 septembre à 15h00") — outside this run's strict 26h recency window — but is surfaced now per the main agent's explicit backlog-closure tasking ("publish the moment any of these names a mechanism, actor, or data-theft claim... none of these currently have an entry"). Confidence is MEDIUM: the only sourcing is the vendor's own account relayed by two French breach-tracking outlets (Cyberattaque.org, French Breaches) — no independent forensic confirmation, and neither outlet is a national-CERT-tier authority.
