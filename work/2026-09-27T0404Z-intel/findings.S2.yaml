items:
  - title: "Familea, a SaaS platform used by ~1,600 French collectivities for family/school services, confirms its mid-September platform-wide outage was a cryptojacking attack, not ransomware or data theft"
    sources:
      - { url: "https://www.cyberattaque.org/familea-bruguieres-cyberattaque-les-portails-familles-inaccessibles/", publisher: "Cyberattaque.org", date: "2026-09-14 (updated with mechanism)", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/familea-mu1wyyw70shufju3yby", publisher: "French Breaches", date: "2026-09-15 (updated 2026-09-23)", role: "corroborating" }
    discovery_trace: "first seen at: standing coverage-backlog re-check tasked by main agent (Familea platform-wide outage since 2026-09-14, previously mechanism-unknown as of 2026-09-25) → re-fetch: Cyberattaque.org, URL https://www.cyberattaque.org/familea-bruguieres-cyberattaque-les-portails-familles-inaccessibles/ → corroborating: French Breaches, URL https://frenchbreaches.com/alertes/familea-mu1wyyw70shufju3yby (explicit 'Mise à jour le 23 septembre à 15h00' section naming the mechanism)"
    summary: |
      Familea (formerly Abelium Collectivités, part of Groupe JVS since February 2026), a SaaS vendor whose "portail famille" software manages childcare/school-meal/after-school-activity registration for roughly 1,600 French municipalities and associations (5,000+ licenses), suffered a server-side incident on 2026-09-14 that took its shared, multi-tenant infrastructure offline: the vendor cut all external access as a precaution, causing simultaneous portal outages across geographically unrelated communes (Bruguières, Draguignan, Saint-Chamas, Le Cheylas, Brindas and others) that had no direct relationship to each other beyond sharing Familea's platform. As of an update the vendor gave the outlet on 2026-09-23, Familea confirmed the incident's actual mechanism, closing a nine-day gap in public disclosure: attackers sought to hijack server compute resources for cryptocurrency mining — not a ransomware deployment and not a data-exfiltration attempt. Familea states its investigation found no compromise, exfiltration, deletion or encryption of client data, and it filed a CNIL breach notification on 2026-09-15 out of regulatory caution despite finding no confirmed data impact. No entry point, initial-access vector or threat actor has been disclosed. Services were restored progressively from 2026-09-14 at 23:00 onward.
    region_nexus: "France (non-Swiss); transferable lesson for Swiss cantonal/communal e-government reliance on shared multi-tenant SaaS platforms for citizen/family services — an attack on shared vendor infrastructure serving many municipalities can cascade into a wide, simultaneous outage even when the attacker's actual objective (here, cryptojacking) has nothing to do with the tenants' data."
