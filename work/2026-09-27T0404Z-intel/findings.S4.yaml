    summary: |
      Qbusoft Sp. z o.o., the Polish company behind the Medyc practice-management software used
      by Polish healthcare providers, suffered a data breach confirmed by a customer, the
      Rehabilitation and Psychiatric Treatment Center in Inowrocław, which said patients'
      personal-data confidentiality (potentially including contact details and national ID
      numbers) was breached. Poland's Digital Affairs Minister said the Central Office for
      Combating Cybercrime is investigating as part of a "broader investigation." Zaufana
      Trzecia Strona — the Polish security-research outlet that first revealed August's
      MyDr breach of ~18.8 million unique patient records — reports this attack was carried
      out by the same perpetrators. No mechanism, data-volume figure, or ransom claim has
      been disclosed for the Medyc/Qbusoft incident itself.
