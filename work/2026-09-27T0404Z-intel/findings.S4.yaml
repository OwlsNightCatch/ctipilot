items:
  - title: "DIVD, the Dutch vulnerability-disclosure non-profit, discloses it was breached in what it assesses as an agentic AI-powered attack"
    sources:
      - { url: "https://csirt.divd.nl/2026/09/24/when-not-if/", publisher: "DIVD CSIRT", date: "2026-09-24", role: primary }
      - { url: "https://databreaches.net/2026/09/25/divd-dutch-institute-for-vulnerability-disclosure-investigating-agentic-ai-powered-attack/", publisher: "DataBreaches.net", date: "2026-09-25", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("DIVD breach agentic AI update September 2026") →
      primary: DIVD CSIRT, URL https://csirt.divd.nl/2026/09/24/when-not-if/ →
      corroborating: DataBreaches.net, URL https://databreaches.net/2026/09/25/divd-dutch-institute-for-vulnerability-disclosure-investigating-agentic-ai-powered-attack/
    summary: |
      DIVD (Dutch Institute for Vulnerability Disclosure), a nearly-seven-year-old non-profit
      that coordinates responsible disclosure across Europe, announced on 2026-09-24 via its
      own CSIRT blog (and LinkedIn) that it detected suspicious activity in its own
      infrastructure and confirmed it had been breached. DIVD states plainly: "the modus
      operandi indicates that this is an agentic AI powered attack" — the first time the
      organization says it has seen this attack class — but discloses no technical mechanism,
      initial-access vector, or specific systems/data affected; the investigation is ongoing
      and DIVD is treating the incident as a worst-case-scenario breach until proven otherwise.
      Response actions taken: blocked access to its own infrastructure, engaged a third-party
      incident-response firm for forensics, notified directly-involved parties, reported the
      incident to the Dutch data-protection authority (Autoriteit Persoonsgegevens) and the
      National Cyber Security Centre (NCSC-NL), and discussed the incident with police. DIVD's
      next public update was due 2026-09-28. No further technical detail (vector, malware,
      data scope) has been published as of this run.
    region_nexus: "Netherlands / EU; transferable case study rather than a direct Swiss-constituency hit"
    primary_sector_nexus: "indirect"
    sector: "information-security-nonprofit"
