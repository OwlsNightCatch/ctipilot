  - title: "Unauthorized users had 9 months of unencrypted access to a Pentagon HR file-sharing server; up to 4 million DoD personnel's Social Security numbers potentially exposed"
    sources:
      - { url: "https://www.militarytimes.com/news/pentagon-congress/2026/09/24/military-personnel-data-exposed-in-breach-agency-warns/", publisher: "Military Times", date: "2026-09-24", role: primary }
      - { url: "https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach", publisher: "CNN", date: "2026-09-25", role: primary }
      - { url: "https://databreaches.net/2026/09/26/pentagon-data-breach-of-military-personnel-raises-national-security-concerns/", publisher: "DataBreaches.net", date: "2026-09-26", role: corroborating }
    discovery_trace: >
      first seen at: WebFetch of databreaches.net feed (https://databreaches.net/feed/) →
      primary: Military Times, URL https://www.militarytimes.com/news/pentagon-congress/2026/09/24/military-personnel-data-exposed-in-breach-agency-warns/ →
      primary: CNN, URL https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach →
      in-window relay confirming recency: DataBreaches.net, URL https://databreaches.net/2026/09/26/pentagon-data-breach-of-military-personnel-raises-national-security-concerns/
    summary: |
      A breach-notification letter dated September 2026 and sent 2026-09-18 to affected
      individuals — reviewed independently by both Military Times and CNN, and confirmed
      authentic by two defense officials speaking to Military Times — discloses that
      unauthorized users accessed a vulnerable file-sharing system operated by the Defense
      Manpower Data Center (DMDC), the Pentagon's central identity/HR system of record that
      maintains 60+ million records on DoD military and civilian personnel, contractors,
      family members, retirees and veterans. Access ran from October 2025 through 16 July
      2026 (roughly nine months) before DMDC discovered the "security vulnerability,"
      patched it and restored the system; the notification letter names no CVE, exploit
      class, or attacker. Data taken from the recipient's own record included an unencrypted
      Social Security number plus at least one further identifying field (name, date of
      birth, contact information, sex, race, or military-personnel/occupational-specialty
      data). DoD states it has no indication the data has been misused and is offering one
      year of credit monitoring via contractor IDX. The scope remains unconfirmed by DoD;
      two people familiar with the incident told Military Times approximately 4 million DoD
      personnel may be affected. Experts quoted by CNN flag that combining SSNs with
      occupational-specialty data gives a foreign intelligence service a much clearer picture
      of who performs what role for the US military, and note the data was unencrypted
      contrary to standard practice.
    region_nexus: "United States (Department of Defense); no direct Swiss nexus but directly transferable to Swiss Armed Forces / civil-protection personnel-data systems"
