        attribution: "CNN"
        source_url: "https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach"
      - quote: "The unauthorized users gained access to the Social Security number of the letter's recipient, as well as at least one additional piece of identifying information, such as a name, date of birth, contact information, sex, race or military personnel information, including occupational specialty"
        attribution: "Military Times"
        source_url: "https://www.militarytimes.com/news/pentagon-congress/2026/09/24/military-personnel-data-exposed-in-breach-agency-warns/"
      - quote: "The stolen data wasn't encrypted, according to the letter."
        attribution: "CNN"
        source_url: "https://www.cnn.com/2026/09/25/politics/pentagon-data-personnel-breach"
    extended_notes: |
      Techniques mapped are general/inferred (T1190 for the "security vulnerability" granting
      unauthorized access; T1213 for bulk PII access from the HR data repository) since neither
      source names a CVE, exploit class, or specific software component — flagged explicitly so
