          aliases: ["DMDC breach", "Pentagon HR breach 2026"],
          summary: "Unauthorized users accessed an unencrypted DMDC file-sharing server between October 2025 and July 2026, exposing Social Security numbers and other PII of DoD military/civilian personnel; up to ~4 million people potentially affected, no attacker or mechanism disclosed (Military Times / CNN, 2026-09-24/25)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
