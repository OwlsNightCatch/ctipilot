  - title: "Metabase SQL-injection campaign (CVE-2026-72898) gains new downstream victims: Carrefour, Printemps, Citadium, Aroma-Zone, Micromania and Easypara customer data exposed via a compromised vendor, Shipup"
    sources:
      - { url: "https://frenchbreaches.com/alertes/carrefour-shipup-muixw7rd535cstgrh65", publisher: "FrenchBreaches", date: "2026-09-27", role: primary }
    discovery_trace: >
      first seen at: WebFetch of frenchbreaches.com listing, URL https://frenchbreaches.com →
      primary: FrenchBreaches alert page, URL https://frenchbreaches.com/alertes/carrefour-shipup-muixw7rd535cstgrh65 →
      cross-check: WebSearch ("Metabase CVE-2026-72898 SQL injection exploited Printemps Carrefour")
      confirming CVE-2026-72898 identity against the already-tracked entry (entries/2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally.md, entity incident:metabase-sqli-zeroday-2026-08)
    summary: |
      FrenchBreaches reports (2026-09-27) that Carrefour customer data — first and last names,
      email addresses and phone numbers, explicitly no banking data or passwords — was exposed
      through a breach of Shipup, a French SaaS platform used by 700+ e-commerce brands for
      package tracking and post-purchase communications. The exposure traces to the same
      unauthenticated Metabase SQL-injection zero-day (CVE-2026-72898, CVSS 10.0) already
      tracked by this store's entry from 2026-08-09/08-12/08-19: unauthorized access to
      Shipup's Metabase-connected systems ran between 31 July and 17 August 2026. Carrefour
      states no direct compromise of its own site, customer accounts or internal systems
      occurred — the exposure is entirely of customer data it had shared with the
      third-party vendor. FrenchBreaches names five further affected retail brands sharing
      the same Shipup exposure: Printemps, Citadium, Aroma-Zone, Micromania and Easypara.
      This adds a further intermediary vendor and at least six further named downstream
      organizations to the campaign the existing entry already tracks (which stood at nine
      confirmed downstream organizations as of VenariX's 2026-08-17 count).
    region_nexus: "France; downstream delta on an already-tracked global campaign"
