      "crowdfund extortion" pattern breach-response teams should recognize — and because
      Flink's operating footprint (Germany/Netherlands, formerly Austria/France) sits in the
      constituency's home region.
    evidence:
      - quote: >
          "Unauthorized individuals have gained access to data in one of our internal
          systems. We take this incident very seriously."
        attribution: "Flink spokesperson, via NL Times"
        source_url: "https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data"
      - quote: >
          "But I haven't seen individual consumers being approached before," said Takkenberg
          in an interview with NOS.
        attribution: "Pim Takkenberg, Northwave, via NL Times"
        source_url: "https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data"
      - quote: >
          Die Zahl der kontaktierten Kunden in Deutschland lässt sich damit bisher schlecht
          einschätzen.
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"
    extended_notes: |
      Distinct pattern from the already-tracked Revolut/"Imnotavillain" entry (2026-09-13,
      updated 2026-09-26) in this store: Imnotavillain individually extorts ~680 named
      customers from data it already fully possesses after a KYC-process compromise; LPG
      Group instead uses a crowdfunding-style COLLECTIVE threshold (100 ETH aggregate) with
      individual small payments, explicitly tied to the victim organization's refusal to
      pay. Worth flagging as a second data point suggesting this extortion variant is
      spreading, not a one-off.

