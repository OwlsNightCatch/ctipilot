    extended_notes: |
      This is the same CVE and campaign already tracked in
      entries/2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access.md
      (existing entity keys actor:shinyhunters / campaign:shinyhunters-peoplesoft-2026,
      already tagged public-sector/switzerland from the June Council of Europe update).
      This is a materially new development — a distinct WAF-bypass technique, a new
      backdoor family (SIDEEYE) and code-signing-certificate abuse, and explicit expansion
      into the government sector — so it should land as a new dated changelog record on
      that entry, not a new entry. Recommend priority stays >= high given confirmed
      ongoing mass exploitation and direct government-sector nexus.

  - title: >
      Flink (German/Dutch grocery delivery) refuses a ransom after an Order Hub compromise,
      so extortion actor "LPG Group" pivots to crowdfund-style individual extortion of at
      least 10,000 customers and employees
    sources:
      - { url: "https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html",
          publisher: "heise online", date: "2026-09-26", role: primary }
      - { url: "https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data",
          publisher: "NL Times", date: "2026-09-25", role: corroborating }
    discovery_trace: >
      first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS item
      "Kunden und Mitarbeiter von Lieferdienst Flink werden erpresst", published
      2026-09-26T16:56:00Z) -> primary (no pivot needed, heise's own reporting includes
      Flink's on-record statement) -> corroborating: NL Times, URL
      https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data
      (independently reported via Dutch coverage / NOS interview with Northwave).
    summary: |
      Quick-commerce grocery delivery service Flink (Germany-headquartered, also operating
      in the Netherlands) confirmed a breach of one of its internal "Order Hub" ordering
      systems used by its decentralized city warehouses; the specific initial-access vector
      was not disclosed by the company. Attackers first approached Flink directly demanding
      payment in Ethereum with a threat to sell the data "on the deep web"; Flink states it
      does not negotiate with criminals and did not respond. The extortion actor, self-named
      "LPG Group" and previously undocumented, then pivoted to mass-emailing at least 10,000
      individual customers and employees in the Netherlands (with Germany also affected)
      directly, demanding small per-person payments (0.005 ETH, ~EUR 10-12 each) toward a
      cumulative 100 ETH (~EUR 230,000-237,000) target, promising to delete each payer's data
      if the collective goal is met and threatening to sell all data if not; a 2 October
      deadline was set. Exfiltrated data is limited to names, delivery addresses, email
      addresses, phone numbers and delivery notes (e.g. floor/apartment details) — Flink
      states passwords, payment cards and bank data were not affected. NL Times cites
      cybersecurity researcher Pim Takkenberg (Northwave) characterizing individual-consumer
      extortion as a technique he has "not seen before," distinct from prior cases (he cites
      ShinyHunters' extortion of Dutch higher-education institutions via their software
      vendor) where the victim organization's customers, rather than the organization itself,
      were pressured — an emerging playbook for breach-response teams to expect when a
      victim organization publicly refuses to pay. Abuse reporting to the extortion group's
      mail provider curtailed the initial email flood; Flink says only ~150 customers had
      proactively contacted its support line by the time of reporting, so the scale of
      contacted individuals in Germany specifically remains unclear. Flink has notified
      Berlin's data protection authority and police in Germany and the Netherlands, and
      retained external IT forensics.
