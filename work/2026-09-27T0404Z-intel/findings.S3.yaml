items:
  - title: >
      ShinyHunters (UNC6240) resumes mass exploitation of Oracle PeopleSoft CVE-2026-35273
      via a single-character WAF-bypass, expanding targeting to government, healthcare,
      transportation and agriculture victims
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft/",
          publisher: "Google Cloud Blog / Mandiant GTIG", date: "2026-09-25", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/",
          publisher: "BleepingComputer", date: "2026-09-26", role: corroborating }
    discovery_trace: >
      first seen at: mandiant-gtig, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v
      (RSS item "ShinyHunters Renewed Mass Exploitation Campaign Targeting Oracle PeopleSoft",
      published Fri 2026-09-25T14:00:00Z) -> primary: Mandiant/GTIG own post, URL
      https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft/
      -> corroborating (confirms in-window freshness of the wider news cycle): BleepingComputer,
      URL https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/
      (dated 2026-09-26, i.e. inside the 26h window even though the originating Mandiant post's
      RSS timestamp sits a few hours before the strict window start).
    summary: |
      Mandiant/GTIG report that UNC6240 (ShinyHunters) has resumed mass exploitation of
      CVE-2026-35273 (Oracle PeopleSoft PeopleTools Environment Management Hub / PSEMHUB,
      CVSS 9.8, unauthenticated RCE via Java deserialization) — the same n-day flaw this
      store already tracks from its May-June 2026 zero-day wave. The actor now bypasses
      literal-string WAF rules blocking `/PSEMHUB/` by requesting the percent-encoded path
      `/%50SEMHUB/` (the encoded form of 'P'); WAFs and reverse proxies that match the
      request path before decoding miss it, while WebLogic decodes and routes it to the
      vulnerable servlet normally. Mandiant warns the actor may rotate to other
      percent-encoded, mixed-case, or otherwise non-normalized path variants, so defenders
      must normalize the path before matching rather than blocklist one encoding.
      Verification requests (5-15 POST requests to `/%50SEMHUB/hub` with a serialized Java
      object) let the actor silently confirm exploitability without writing files. Two
      complementary single-line JSP web shells (`x.jsp` for cross-platform hex-encoded
      command execution, `u.jsp`/`u2.jsp` for 150KB-chunked Base64 file upload bypassing
      PeopleSoft's native FILECHUNKING size limits) are dropped into PSEMHUB.war; a fileless
      variant returns command output directly in the HTTP response with nothing written to
      disk, defeating file-creation-based detection. On Windows hosts the actor uploads a
      trojanized installer (`Ple64.exe`, masquerading as the Light Alloy media player,
      signed with a valid EV certificate Mandiant has asked Sectigo to revoke) that loads a
      VMProtect-3-packed three-stage chain culminating in the SIDEEYE C++ backdoor
      (credential theft, process/file management, reverse shell/proxy over raw TCP ports
      3333/3334). The actor also deploys the open-source Neo-reGeorg tunneling toolkit
      (SOCKS5-over-HTTP/S) and the legitimate MeshAgent/MeshCentral RMM tool for persistence,
      continuing a pattern from the original campaign of using Microsoft-masquerading
      infrastructure domains. A quarter of observed post-exploitation commands executed as
      root or NT AUTHORITY\SYSTEM. Targeting has expanded beyond the original
      higher-education skew to technology, IT services, healthcare, agriculture,
      transportation and government organizations globally. Mandiant recommends patching to
      the supported PeopleTools release, disabling EMHub if unused, and normalizing the
      request path (not just the literal string) at the WAF.
