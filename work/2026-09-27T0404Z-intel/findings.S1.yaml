    discovery_trace: >
      first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      (catalogVersion 2026.09.25, dateReleased 2026-09-25T18:58:16Z, dateAdded=2026-09-25 for
