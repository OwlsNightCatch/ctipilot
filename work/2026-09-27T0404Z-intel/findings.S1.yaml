      that run covered the sibling addition (CVE-2026-65660/SharePoint) from the SAME CISA alert
      but not this one, which looks like a same-alert partial miss rather than a deliberate drop.
      Framing this as an `update-of` the existing 2026-09-06 entry (rather than a new entry) sidesteps
      the strict new-item recency gate; the ENISA EUVD dateUpdated timestamp (2026-09-26T03:55:45Z)
      does fall inside the current window if the main agent prefers that as the anchor. Recommend
