      dateUpdated 2026-09-26T03:55:45Z) → primary: CISA's own alert page, URL
      https://www.cisa.gov/news-events/alerts/2026/09/25/cisa-adds-two-known-exploited-vulnerabilities-catalog
      (confirms the addition covers CVE-2026-65660 [SharePoint, already-covered entry] and
      CVE-2026-67279 [MikroTik, this update]) → re-confirmed against the store's own existing
      entry (Read entries/2026-09-06/mikrotik-routeros-mikrotrick-ssh-auth-bypass-privesc-chain.md),
      whose cves[] frontmatter lists CVE-2026-67279 status as [exploited] but WITHOUT a cisa-kev
      tag, unlike its sibling CVE-2026-86060.
    summary: >
      CISA added CVE-2026-67279 to its Known Exploited Vulnerabilities catalog on 2026-09-25,
      alongside CVE-2026-65660 (Microsoft SharePoint, already a separate covered entry). This is a
      material development on the store's existing MikroTik RouterOS "MikroTrick" entry
      (published 2026-09-06, last corrected 2026-09-23): CVE-2026-67279 is the SSH
      rekey-during-authentication state-confusion bug that CERT Polska's own technical
      write-up (2026-09-22) identified as the chain's true, configuration-independent entry
      point — the flaw that lets an unauthenticated client reach SSH channel handling without
      ever completing user authentication, which CVE-2026-86060's crafted "-2" username argument-
      injection bug then escalates to full administrative control. CVE-2026-86060 and
      CVE-2026-67277 were already KEV-listed as of 2026-09-10 per the existing entry; this
      addition is the first direct US federal-government confirmation specifically for
      CVE-2026-67279, the chain's actual bypass primitive, closing the gap between CERT Polska's
      independent confirmation of active exploitation (stated 2026-09-05, corrected 2026-09-23)
      and CISA's own KEV ground truth. No new technical detail beyond what the existing entry
      already carries; this is a status-confirmation delta only. ENISA's EUVD record for the
      same CVE (EUVD-2026-72027) was updated 2026-09-26T03:55:45Z to record `exploitedSince:
      2026-09-25`, independently corroborating the timing.
    region_nexus: "global; MikroTik RouterOS is widely deployed in cost-sensitive network
      infrastructure, including smaller municipal/cantonal networks and ISPs serving Swiss
      public-sector sites"
