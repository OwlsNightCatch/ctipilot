  - title: "Europol launches EU Anti-Scam Platform — weekly law-enforcement-only fraud intelligence reports, five-pillar operational hub"
    sources:
      - url: "https://www.amlintelligence.com/2026/05/latest-europol-launches-eu-anti-scam-platform-for-law-enforcement/"
        publisher: "AML Intelligence"
        date: "2026-05-01"
        role: "primary"
    discovery_trace: "WebSearch (Europol Anti-Scam Platform May 2026) → AML Intelligence article (2026-05-01) → fetched via WebFetch"
    summary: |
      On approximately 29 April 2026, at the European Anti-Financial Crime Summit (EAFCS) in Dublin, Europol Deputy Executive Director Jean-Philippe Lecouffe announced the establishment of the EU Anti-Scam Platform — an operational hub drawing on capabilities from Europol's European Cybercrime Centre (EC3) and European Financial and Economic Crime Centre (EFECC). The platform operates on five pillars: intelligence-sharing maximisation, swift fund interception and recovery, operational coordination, threat monitoring, and public-private partnership and prevention. Its primary operational output is a weekly law-enforcement-only briefing on prevalent fraud types, financial loss patterns, victim demographics, scammer techniques, and transaction footprints — enabling rapid cross-border agency response. The announcement is a direct response to Europol's own reporting that online fraud has become the fastest-growing area of internet-organised crime in the EU. For Swiss law enforcement (fedpol, KOBIK), SECO, and cantonal financial intelligence units the platform creates a new operational signal source via Europol's Secure Information Exchange Network Application (SIENA). Swiss financial sector entities operating under AMLA supervision should note this as a vector for new STR typologies to emerge from Europol platform outputs.
    ch_eu_nexus: "Indirect but relevant — Swiss fedpol and KOBIK have Europol liaison access via bilateral cooperation agreements; financial intelligence outputs may feed into MROS/AMLA channels"
    public_sector_nexus: "Medium — law-enforcement and financial intelligence authorities are primary beneficiaries"
    sector: "financial, law enforcement, public administration"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Europol will publish weekly operational reports (law enforcement only) detailing prevalent fraud types, financial losses, victim profiles, scammer techniques/tools, and transaction patterns to enable rapid agency response."
        attribution: "AML Intelligence"
        source_url: "https://www.amlintelligence.com/2026/05/latest-europol-launches-eu-anti-scam-platform-for-law-enforcement/"

