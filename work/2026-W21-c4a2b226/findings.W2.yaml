  - title: "Germany NIS2UmsuCG registration deadline passed 6 March 2026 with ~60% non-compliance rate; BSI foregoing sanctions for now but enforcement posture hardening"
    sources:
      - url: "https://blog.gdatasoftware.com/2026/03/38383-nis2-end-registration-period-management-teams"
        publisher: "G DATA Software"
        date: "2026-03-06"
        role: "primary"
      - url: "https://www.klgates.com/New-Cybersecurity-Regulations-in-GermanyRegistration-Requirement-Expires-on-6-March-2026-3-5-2026"
        publisher: "K&L Gates"
        date: "2026-03-05"
        role: "corroborating"
    discovery_trace: "WebSearch (Germany NIS2 BSI registration March 2026 deadline completed) → G DATA analysis (2026-03-06) + K&L Gates alert (2026-03-05)"
    summary: |
      Germany's NIS2 implementation act (NIS2UmsuCG, in force 6 December 2025) required covered entities to register with BSI via the online portal by 6 March 2026 — three months after the act's entry into force. Post-deadline analysis indicates approximately 11,500 entities registered against an expected scope of approximately 29,500–30,000+ organisations, yielding a registration rate of roughly 38%. BSI publicly stated it will not yet impose sanctions for missed registrations at this stage, citing the novelty of the regime and the complexity of scope determination (the explanatory notes acknowledge the 30,000 figure is a lower bound; actual numbers may be higher). Non-registration exposes entities to fines up to €100,000 (§ 65 para. 1 BSIG) for the registration violation itself, escalating to €10 million or 2% of global annual turnover under § 65 para. 2 for substantive NIS2 failures. The NIS2UmsuCG expands German regulated entities from ~4,500 to ~29,500+ across: energy, transport, banking, health, digital infrastructure (cloud, DNS, CDN), water, space, public administration, postal/courier, waste management, chemicals, food, and vehicle/electronics/medical device manufacturing. Swiss entities operating in Germany under NIS2UmsuCG scope (including digital infrastructure providers with DE points of presence) should confirm registration status.
    ch_eu_nexus: "Direct for Swiss digital infrastructure providers, cloud operators, and NIS2-essential-service subsidiaries operating in Germany"
    public_sector_nexus: "High — NIS2UmsuCG includes public administration as an essential sector, making German Länder IT-service providers, municipal utilities, and federal IT-Dienstleistungszentren in-scope"
    sector: "public administration, energy, health, digital infrastructure, transport"
