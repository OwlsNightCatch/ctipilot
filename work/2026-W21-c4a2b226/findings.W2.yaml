  - title: "ENISA CNA root onboards four new European CNAs; seven additional CNAs migrate from MITRE root — 11 European entities now under ENISA coordination (6 May 2026)"
    sources:
      - url: "https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root"
        publisher: "ENISA"
        date: "2026-05-06"
        role: "primary"
    discovery_trace: "WebSearch (ENISA CNA new onboarding 2026 May) → ENISA news article (2026-05-06) → fetched via bridge"
    summary: |
      On 6 May 2026, ENISA published a news item announcing that four European organisations newly joined the CVE Programme as CVE Numbering Authorities (CNAs) under ENISA Root. Simultaneously, seven existing European CNAs that were previously managed under MITRE Root have transitioned to ENISA Root, bringing the total number of CNAs coordinated by ENISA to eleven. The announcement did not name the four new CNAs specifically. ENISA's role as CVE Root — formally designated in early 2024 — makes it the onboarding, training, and scoping authority for European entities within its CNA programme scope: primarily CNAs reporting vulnerabilities affecting products or services originating from EU CSIRTs or EU-based organisations. ENISA coordinates with CISA/MITRE to avoid overlapping scope. The expansion matters for Swiss and EU defenders because CNAs under ENISA Root are expected to publish CVEs with EU-specific contextual metadata (NIS2 Article 23 reporting linkages, EUVD cross-references) that may not be present in MITRE-rooted CVE records. The ENISA European Vulnerability Database (EUVD) at euvd.enisa.europa.eu is the parallel European publication channel.
    ch_eu_nexus: "Direct — ENISA Root CNA expansion affects the EU vulnerability disclosure ecosystem that Swiss BACS/GovCERT.ch monitors; EUVD records now cover more European-origin products"
    public_sector_nexus: "Medium — improved coverage of EU-origin product vulnerabilities via EUVD benefits NIS2 Article 23 incident-reporting linkage"
    sector: "cross-sector, public administration, technology"
