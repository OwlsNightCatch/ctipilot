    novelty: "update-to-prior:weekly:2026-W20"
    evidence:
      - quote: "High-risk Annex III systems (employment, education, credit, biometrics, critical infrastructure, law enforcement, justice, migration): December 2, 2027"
        attribution: "Modulos AI"
        source_url: "https://www.modulos.ai/blog/eu-ai-act-omnibus-deal/"
      - quote: "The agreement introduces a comprehensive ban on AI systems designed to generate non-consensual intimate imagery, including deepfake nudification apps and child sexual abuse material (CSAM). Companies must cease offering these tools by December 2, 2026."
        attribution: "Dastra"
        source_url: "https://www.dastra.eu/en/blog/simpler-safer-stricter-where-it-counts-inside-the-eu-ai-omnibus-deal/60025"
      - quote: "Political agreement reached May 7, 2026. Formal parliamentary and council votes expected June-July 2026."
        attribution: "Dastra"
        source_url: "https://www.dastra.eu/en/blog/simpler-safer-stricter-where-it-counts-inside-the-eu-ai-omnibus-deal/60025"
    extended_notes: |
      W20 background: The original W20 "Looking ahead" item noted that a political agreement was reached in W20. W21 update: the specific content of the deal is now publicly detailed in multiple legal analyses. Key defender implication: organisations that had been preparing compliance programmes for a 2 August 2026 Annex III deadline should note the extension to 2 December 2027 does NOT excuse ongoing risk assessment or gap analysis — the ESAs have signalled that supervisory expectations for DORA-regulated entities using high-risk AI systems remain aligned with the AI Act obligations timeline regardless of extension. The new CSAM/non-consensual imagery prohibitions create an immediate de-listing obligation for any service meeting that description, with a hard deadline of 2 December 2026.

  - title: "EU Council extends cyber sanctions regime until 18 May 2027 — 19 individuals and 7 entities remain listed; annual review completed"
    sources:
      - url: "https://dig.watch/updates/council-of-the-eu-extends-cyber-sanctions-framework-until-2027"
        publisher: "Digital Watch Observatory (Geneva Internet Platform)"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.consilium.europa.eu/en/press/press-releases/2026/05/11/cyber-attacks-council-extends-listings-until-may-2027/"
        publisher: "Council of the EU"
        date: "2026-05-11"
        role: "primary"
        note: "403 on fetch — URL confirmed by Digital Watch Observatory article"
    discovery_trace: "WebSearch (EU cyber sanctions May 2026) → Digital Watch Observatory article (2026-05-13) confirming Council press release at consilium.europa.eu/2026/05/11 → Council URL 403, covered by DWO as corroborating"
    summary: |
      The Council of the EU adopted a decision on 11 May 2026 extending the EU cyber sanctions regime's individual and entity listings by one year, until 18 May 2027. The underlying legal framework (Decision 2019/797 and Regulation 2019/796) was already extended until 18 May 2028 during the May 2025 annual renewal cycle. The current listings cover 19 individuals and 7 entities subject to asset freezes, travel bans, and prohibitions on fund transfers; these include the private Chinese companies Integrity Technology Group and Anxun Information Technology Co. Ltd (added March 2026) and the Iranian company Emennet Pasargad. The annual review cycle confirmed no new additions alongside this routine renewal — the March 2026 additions brought the regime to its current composition. The regime is distinct from Russian/Belarussian geo-political sanctions and targets non-state cyber actors globally regardless of nexus. Switzerland aligns with EU sanctions regimes via SECO ordinances; SECO typically updates its implementing ordinances within days of a Council decision, and Swiss operators should expect corresponding updates to the SR 946.231.176.72 cyber-sanctions register.
    ch_eu_nexus: "Direct — Switzerland aligns with EU cyber sanctions via SECO SR 946.231.176.72; annual renewal requires SECO ordinance update"
    public_sector_nexus: "Medium — compliance obligation for Swiss federal entities and financial institutions screening counterparties"
    sector: "cross-sector, financial, public administration"
