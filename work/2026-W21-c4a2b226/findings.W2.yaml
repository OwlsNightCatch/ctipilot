  - title: "Five Eyes + CISA/NSA publish joint guidance on agentic AI security — five risk categories for autonomous AI systems in enterprise and critical-infrastructure environments"
    sources:
      - url: "https://www.cisa.gov/news-events/news/cisa-us-and-international-partners-release-guide-secure-adoption-agentic-ai"
        publisher: "CISA"
        date: "2026-05-01"
        role: "primary"
      - url: "https://media.defense.gov/2026/Apr/30/2003922823/-1/-1/0/CAREFUL%20ADOPTION%20OF%20AGENTIC%20AI%20SERVICES_FINAL.PDF"
        publisher: "NSA / DoD"
        date: "2026-04-30"
        role: "corroborating"
    discovery_trace: "WebSearch (agentic AI security guidance May 2026 CISA NSA NCSC) → CISA press-release URL (2026-05-01) confirmed live via bridge fetch → NSA DoD PDF URL confirmed"
    summary: |
      On 1 May 2026, CISA, NSA, and cybersecurity authorities from Australia (ASD ACSC), Canada (CCCS), New Zealand (NCSC-NZ), and the United Kingdom (NCSC-UK) jointly published "Careful Adoption of Agentic AI Services" — the first coordinated Five Eyes guidance specifically addressing agentic AI systems. The document identifies five risk categories unique to autonomous AI agent deployments: (1) privilege risks (agents running with excessive permissions enabling lateral movement chains), (2) design and configuration risks (prompt injection and goal-misspecification enabling unexpected actions), (3) behavioral risks (hallucination or adversarial manipulation leading to harmful autonomous decisions), (4) structural risks (agent-to-agent trust escalation in multi-agent orchestration), and (5) accountability risks (audit trail gaps when automated reasoning is opaque). Recommendations include: least-privilege scoping of agent tool permissions; human-in-the-loop gates for irreversible or high-impact actions; mandatory logging of all agent reasoning traces and tool invocations to an append-only audit log; agent-identity isolation so compromised agents cannot impersonate higher-privileged agents; and supplier security assessments covering agentic AI models and orchestration platforms. Notably absent as co-authors are BSI, ANSSI, and NCSC-CH — European and Swiss public-sector entities should evaluate whether their agentic AI deployments (including SIEM/SOAR automation, AI-assisted case management, and AI-agent-driven procurement systems) are covered by the risk taxonomy until EU-specific guidance (anticipated from ENISA) is published. DORA-regulated entities should consider how this guidance interacts with ICT risk management obligations for novel technology.
    ch_eu_nexus: "Indirect — no EU/CH co-authorship but directly relevant to Swiss federal and cantonal deployments of agentic AI in security operations, public administration, and DORA-regulated financial ICT"
    public_sector_nexus: "High — public sector AI deployments (SIEM/SOAR automation, AI-assisted case triage, border control, justice AI) are squarely in scope of the risk taxonomy"
    sector: "cross-sector, public administration, financial, defence"
