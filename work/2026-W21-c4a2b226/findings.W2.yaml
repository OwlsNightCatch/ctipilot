  - title: "EU Digital Omnibus on AI — provisional agreement reached 7 May 2026: Annex III deadline extended to December 2027, CSAM and non-consensual imagery prohibitions added"
    sources:
      - url: "https://www.consilium.europa.eu/en/press/press-releases/2026/05/07/artificial-intelligence-council-and-parliament-agree-to-simplify-and-streamline-rules/"
        publisher: "Council of the EU"
        date: "2026-05-07"
        role: "primary"
        note: "403 on fetch — URL confirmed by multiple secondary sources"
      - url: "https://www.dastra.eu/en/blog/simpler-safer-stricter-where-it-counts-inside-the-eu-ai-omnibus-deal/60025"
        publisher: "Dastra"
        date: "2026-05-07"
        role: "corroborating"
      - url: "https://www.modulos.ai/blog/eu-ai-act-omnibus-deal/"
        publisher: "Modulos AI"
        date: "2026-05-07"
        role: "corroborating"
      - url: "https://www.europarl.europa.eu/news/en/press-room/20260427IPR42011/ai-act-deal-on-simplification-measures-ban-on-nudifier-apps"
        publisher: "European Parliament"
        date: "2026-05-07"
        role: "corroborating"
    discovery_trace: "WebSearch (EU Digital Omnibus AI Act May 2026) → Dastra blog primary analysis + Modulos AI blog corroborating → Council press release URL confirmed (403 on fetch, confirmed by multiple secondaries)"
    summary: |
      On 7 May 2026, Council and European Parliament negotiators reached provisional political agreement on the Digital Omnibus on AI, materially amending the EU AI Act's compliance timelines and adding new prohibitions. The agreement postpones high-risk AI obligations under Annex III (covering biometrics, employment, education, credit scoring, critical infrastructure, law enforcement, justice, migration) from 2 August 2026 to 2 December 2027, and Annex I obligations (AI embedded in regulated products: medical devices, machinery, toys) to 2 August 2028. AI watermarking requirements (Article 50(2)) are deferred to 2 December 2026. Two new prohibitions are added to Article 5: AI systems generating non-consensual intimate imagery (deepfake nudification) and child sexual abuse material must cease operation by 2 December 2026 — these do not receive a transition period. Prohibited practices under the existing Article 5 list (social scoring, subliminal manipulation, etc.) and AI literacy requirements remain applicable from February 2025 with no new transition. The Article 6(3) self-assessment registration obligation for non-high-risk systems survived intact. General-purpose AI obligations (Articles 50–55) are unchanged. SME protections are extended to small mid-cap companies. Formal parliamentary and Council votes are expected June–July 2026, with Official Journal publication and entry into force thereafter — in time to forestall the original 2 August 2026 Annex III deadline. The EDPB-EDPS Joint Opinion 1/2026 (February 2026) on this proposal raised concerns about proposed narrowing of the personal-data concept and changes to automated decision-making provisions; the final text will determine whether those concerns were addressed.
    ch_eu_nexus: "Direct — all EU AI Act obligations apply to Swiss organisations offering AI systems in the EU market; Annex III delay gives Swiss federal AI deployers (justice, law enforcement, migration) additional runway to 2027"
    public_sector_nexus: "High — public sector deployers of Annex III high-risk AI systems (biometrics, border management, law enforcement, social benefits) benefit from extended timeline"
    sector: "public administration, technology, finance, healthcare"
    cves: []
    actors_campaigns_malware: []
