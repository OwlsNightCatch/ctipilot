  - title: "KRITIS-DachG entered into force 17 March 2026 — BBK/BSI joint registration platform open, July 17 deadline 61 days out; open questions on threshold ordinances remain"
    sources:
      - url: "https://www.luther-lawfirm.com/en/newsroom/blog/detail/kritis-dachgesetz-in-kraft-neue-pflichten-hohe-bussgelder-und-viele-offene-fragen-fuer-betreiber-kritischer-anlagen"
        publisher: "Luther Lawfirm"
        date: "2026-04-10"
        role: "primary"
      - url: "https://www.aoshearman.com/en/insights/critical-infrastructure-new-legislation-in-germany-and-its-practical-impact"
        publisher: "A&O Shearman"
        date: "2026-04-07"
        role: "corroborating"
    discovery_trace: "WebSearch (KRITIS-DachG BBK registration July 2026) → Luther Lawfirm article (2026-04-10) → A&O Shearman article (2026-04-07) corroborating"
    summary: |
      Germany's Act for the Strengthening of Physical Resilience of Critical Installations (KRITIS-DachG) entered into force on 17 March 2026, implementing EU Directive 2022/2557 (Critical Entities Resilience). The BBK and BSI jointly operate the electronic registration platform on which operators of "critical facilities" (kritische Anlagen) must register by 17 July 2026 — three months after the act's entry into force — or within three months of later qualification. Registration requires: entity name, legal form, address, 24/7 reachable contact point, facility details, critical service performed, sector category, supply/service metrics, and geolocation. Following registration, operators face a 9-month deadline for a risk assessment covering natural, technical, and human-induced threats; a 10-month deadline for implementing proportionate technical, security, and organisational resilience measures; and a written resilience plan. Significant security incidents must be reported to the joint BSI-BBK reporting point within 24 hours of awareness. Fines: registration violation €100,000; non-cooperation with supervision up to €1 million; missing evidence of resilience plan up to €200,000. Open questions as of April 2026 include: the threshold ordinance (Schwellenwertverordnung) defining exactly which facilities qualify has not yet been published by the BMI; detailed sector categories and their competent authorities remain unclear; and coherence across overlapping NIS2 (BSI), CER/KRITIS-DachG (BBK), and sectoral regulators (BNetzA, BaFin) has not been formally addressed. Swiss cross-border critical-infrastructure operators (e.g., energy, transport, water in border regions) should assess if their German operations meet facility thresholds once the Schwellenwertverordnung is published.
    ch_eu_nexus: "Direct for Swiss operators of German critical facilities (cross-border energy grid, transport, water); Swiss law BABS / armasuisse equivalent is the Federal Council Ordinance on CIP protection, which operates under a separate framework"
    public_sector_nexus: "High — federal and cantonal entities with DE-side operations or DE-sector partnerships need to track registration status"
