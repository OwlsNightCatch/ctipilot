  - title: "UPDATE: NGINX CVE-2026-42945 (\"NGINX Rift\") — active in-the-wild exploitation confirmed by VulnCheck honeypots on 2026-05-17"
    sources:
      - { url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html", publisher: "The Hacker News", date: "2026-05-17", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/18-year-old-nginx-vulnerability-allows-dos-potential-rce/", publisher: "BleepingComputer", date: "2026-05-14", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42945", publisher: "NVD", date: "2026-05-14", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS feed (2026-05-17 item) → VulnCheck honeypot claim confirmed in THN article → BleepingComputer corroborating initial disclosure"
    summary: |
      CVE-2026-42945 (CVSS 9.2, codename "NGINX Rift") — a heap buffer overflow in `ngx_http_rewrite_module` present since NGINX 0.6.27 (2008) and affecting NGINX Open Source through 1.30.0 and NGINX Plus through R34 — transitioned from a "no ITW at disclosure" state on 2026-05-15 to confirmed in-the-wild exploitation by 2026-05-17, as reported by VulnCheck based on honeypot network data. The vulnerability is triggered when a `rewrite` directive uses an unnamed PCRE capture group (`$1`, `$2`), includes a replacement string containing a `?` character, and is followed by another `rewrite`, `if`, or `set` directive in the same block scope — a configuration pattern common in URL canonicalisation rules. Unauthenticated attackers can crash NGINX worker processes via crafted HTTP requests targeting the `ngx_http_script_regex_replace_handler` path (confirmed DoS); RCE requires ASLR to be disabled (common on some embedded/edge configurations) and prior knowledge of the exact rewrite configuration. F5 patched this in NGINX 1.28.0 (stable) and 1.27.5 (mainline); NGINX Plus R35 is patched. AlmaLinux delivered errata on 2026-05-13. The nature of current exploitation activity and attacker objectives are not yet determined.
    ch_eu_nexus: "global; NGINX is the most-deployed web server in Swiss federal and cantonal e-government stacks and EU public-sector web infrastructure"
    public_sector_nexus: "direct — NGINX underlies high-density government web stacks (load balancers, API gateways, reverse proxies)"
    sector: "public-sector, technology, telco, finance"
    cves: [CVE-2026-42945]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:daily:2026-05-15
    evidence:
      - quote: "A newly disclosed security flaw impacting NGINX Plus and NGINX Open has come under active exploitation in the wild, days after its public disclosure, according to VulnCheck"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html"
      - quote: "the latest findings from VulnCheck show that threat actors have begun to weaponize the flaw, with exploitation attempts detected against its honeypot networks"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/nginx-cve-2026-42945-exploited-in-wild.html"
    extended_notes: |
      Detection angle: web-server access logs showing malformed `GET` requests to paths with `?`-containing rewrites causing 5xx errors or NGINX worker SIGABRT crashes (look for rapid-fire 502/504 patterns from a single source). ASLR status check: `cat /proc/sys/kernel/randomize_va_space` (2 = full ASLR, 0 = disabled). Defender action: patch to 1.28.0 / Plus R35, or if patch is not yet applied, audit `nginx.conf` for rewrite blocks matching the named PCRE pattern and add input validation or rate limiting upstream. The F5 NGINX advisory at `my.f5.com/manage/s/article/K000161019` is the vendor-primary patch reference.

  - title: "Grafana Labs GitHub token breach — CoinbaseCartel exfiltrates entire private codebase via Pwn-Request workflow misconfiguration; ransom rejected (2026-05-16)"
    sources:
      - { url: "https://grafana.com/blog/grafana-security-update-post-incident-review-for-github-workflow-vulnerability-and-whats-next/", publisher: "Grafana Labs", date: "2026-05-16", role: "primary" }
      - { url: "https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html", publisher: "The Hacker News", date: "2026-05-17", role: "corroborating" }
      - { url: "https://hackread.com/grafana-source-code-theft-rejected-ransom-demand/", publisher: "HackRead", date: "2026-05-17", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS feed (2026-05-17 item) → Grafana official blog post (primary) → HackRead corroborating with CoinbaseCartel attribution"
    summary: |
      On 2026-05-16 Grafana Labs disclosed that an unauthorised actor exploited a recently-added GitHub Actions workflow configured with the `pull_request_target` trigger — a "Pwn Request" misconfiguration that grants write-context secrets (including a GitHub token) to code from external contributor forks. The attacker forked a Grafana public repository, injected a malicious `curl` command into the workflow to dump environment variables (including the privileged token) to a file encrypted with a hardcoded public key, then deleted the fork to remove evidence. The stolen token was reused to clone four private Grafana repositories, exfiltrating the full private codebase. Detection came via a triggered canary token, not from automated secrets-scanning. The actor subsequently demanded ransom; Grafana refused citing FBI non-payment guidance. CoinbaseCartel, a data-extortion crew that emerged in September 2025 and focuses exclusively on theft-and-extortion rather than encryption, has claimed responsibility. Grafana confirmed no customer data, production systems, or running infrastructure was accessed. The attack technique — Pwn Request via `pull_request_target` + untrusted fork injecting commands — is the same class as the Supply-Chain Security (SLSA) gap documented in `tj-actions/changed-files` abuse patterns.
    ch_eu_nexus: "Grafana is the dominant open-source observability stack in Swiss federal and EU public-sector SOC/SIEM deployments; source-code disclosure may expose internal extension logic, private plugin code, or hardcoded test-environment secrets"
    public_sector_nexus: "indirect — Grafana is open-source but the private codebase may contain proprietary integrations relevant to on-premises deployments"
    sector: "technology, public-sector (observability infrastructure)"
    cves: []
    actors_campaigns_malware: ["CoinbaseCartel"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The root cause was traced to a recently enabled GitHub Action that contained a 'Pwn Request' vulnerability, a misconfiguration in a workflow triggered on pull_request_target events that granted external contributors access to production secrets during CI runs"
        attribution: "Grafana Labs (via The Hacker News)"
        source_url: "https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html"
      - quote: "Grafana revealed the attacker tried to blackmail and extort the company, demanding they make a payment to prevent the stolen database from being published. However, Grafana said it has opted not to pay the ransom"
        attribution: "HackRead"
        source_url: "https://hackread.com/grafana-source-code-theft-rejected-ransom-demand/"
    extended_notes: |
      Detection hunting angle: In GitHub organization audit logs, look for `pull_request_target` workflow runs against branches from non-member forks; alert on `workflow_run` events where the `head_repository.owner` differs from the base repository owner AND the workflow name matches recently-added files. Hardening: Restrict `pull_request_target` workflows to never directly use `${{ github.event.pull_request.head.sha }}` without explicit `if: github.event.pull_request.head.repo.full_name == github.repository` guards; use StepSecurity Harden-Runner or similar. The canary-token detection success here is an instructive model for detecting exfiltration from CI/CD pipeline secrets. MITRE ATT&CK: T1552.001 (Credentials in Files — env vars), T1078 (Valid Accounts — OAuth/GH token), T1119 (Automated Collection).

  - title: "UPDATE (W5): Mini Shai-Hulud / TeamPCP supply-chain worm reaches Packagist (PHP) via intercom/intercom-php compromise — cross-ecosystem now npm + PyPI + Packagist"
    sources:
      - { url: "https://socket.dev/blog/mini-shai-hulud-packagist-malicious-intercom-php-package-compromise", publisher: "Socket.dev", date: "2026-05-16", role: "primary" }
      - { url: "https://semgrep.dev/blog/2026/malicious-intercom-php-package-spreads-mini-shai-hulud-attack-to-packagist-via-composer-plugin/", publisher: "Semgrep", date: "2026-05-16", role: "corroborating" }
      - { url: "https://hackread.com/teampcp-mini-shai-hulud-worm-npm-pypi-packages/", publisher: "HackRead", date: "2026-05-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (TeamPCP Mini Shai-Hulud Packagist PHP Composer wave) → Socket.dev primary blog post → Semgrep corroborating analysis"
    summary: |
      By 2026-05-16 the Mini Shai-Hulud campaign (TeamPCP / UNC6780) had expanded beyond npm and PyPI to a third ecosystem: the PHP Packagist registry, via `intercom/intercom-php` version 5.0.2. This version was converted into a Composer plugin — abusing Composer's `composer-plugin` package type to execute arbitrary PHP code at install time (`composer install` / `composer update`). The malicious plugin exfiltrates credentials, tokens, and environment secrets to a TeamPCP-controlled endpoint and attempts to propagate by publishing new malicious versions of any Composer packages the victim's Packagist token has write access to — extending the worm's self-propagating logic to the PHP ecosystem. `intercom/intercom-php` has over 20.7 million lifetime installs. Cross-ecosystem scope as of 2026-05-17: npm (400+ malicious versions), PyPI (mistralai, guardrails-ai, lightning), Packagist (intercom/intercom-php). No confirmed Cargo (Rust) or Maven (Java) targets as of 2026-05-18, though these are assessed as the next candidate registries per the worm's OIDC-token-reuse propagation architecture.
    ch_eu_nexus: "PHP remains dominant in Swiss and EU public-sector web application stacks (canton web portals, university CMS, e-government services built on Laravel/Symfony); intercom/intercom-php compromise directly affects organisations using Intercom's PHP SDK in their customer/citizen portal integrations"
    public_sector_nexus: "indirect — cantons and municipalities using PHP frameworks with Composer dependency management"
    sector: "technology, public-sector, education"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "UNC6780", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:weekly:2026-W20
    evidence:
      - quote: "Socket found a malicious Intercom PHP package on Packagist using Composer plugin execution to steal credentials and spread across ecosystems"
        attribution: "Socket.dev"
        source_url: "https://socket.dev/blog/mini-shai-hulud-packagist-malicious-intercom-php-package-compromise"
      - quote: "intercom/intercom-php@5.0.2 was compromised and converted into a Composer plugin that exfiltrates credentials at install time, extending the Mini Shai-Hulud campaign to PHP"
        attribution: "Semgrep"
        source_url: "https://semgrep.dev/blog/2026/malicious-intercom-php-package-spreads-mini-shai-hulud-attack-to-packagist-via-composer-plugin/"
    extended_notes: |
      Defenders running PHP stacks: lock `intercom/intercom-php` to <= 5.0.1 or >= 5.0.3 (once clean version is available) and audit Composer install logs for unexpected network calls during dependency resolution. Enable `COMPOSER_NO_INTERACTION=1` and `COMPOSER_AUDIT_ABANDONED=report` to surface abandoned/compromised dependencies. Detection: watch for outbound HTTP connections from PHP `composer install` processes to non-Packagist endpoints, especially at install-time not runtime. MITRE ATT&CK: T1195.001 (Compromise Software Dependencies and Development Tools).

  - title: "UPDATE: Microsoft Exchange CVE-2026-42897 — no permanent security update yet; Microsoft confirms developing fix; Exchange 2016/2019 fix tied to ESU Period 2 eligibility"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897", publisher: "Microsoft MSRC", date: "2026-05-14", role: "primary" }
      - { url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498", publisher: "Microsoft Exchange Team Blog", date: "2026-05-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (Exchange CVE-2026-42897 permanent patch) → MSRC API msrc cve CVE-2026-42897 (primary, retrieved in this run) → TechCommunity Exchange blog corroborating"
    summary: |
      As of 2026-05-18, no permanent security update exists for CVE-2026-42897 (Exchange OWA stored-XSS, CWE-79, CVSS 8.1, actively exploited). The MSRC advisory text states verbatim: "We are working on developing and testing a more permanent fix which we will provide when it meets our quality standards." The latestSoftwareRelease field in the OData API reads "Exploitation Detected" — confirming no SU package has been released. The only available remediation is the automated Exchange Emergency Mitigation Service (EM Service) mitigation M2.1.x, which is deployed automatically on Exchange 2016, 2019, and SE when EM Service is enabled. The Exchange Team Blog (last updated 2026-05-17) confirms the M2 mitigation requires EM Service connectivity to the Microsoft mitigation endpoint and verification that the mitigation applied. Critically, when the permanent fix is released, Exchange 2016 and 2019 will receive it only through the Period 2 Extended Security Update (ESU) programme — organisations that did not purchase ESU licences will not receive the permanent patch and will remain reliant on the EM Service mitigation indefinitely. Exchange SE will receive a public security update.
    ch_eu_nexus: "on-premises Exchange is common in Swiss cantonal and federal IT estates and EU member state public bodies; ESU access gap is directly relevant to organisations that have not yet migrated to Exchange Online or Exchange SE"
    public_sector_nexus: "direct"
    sector: "public-sector, enterprise, finance"
    cves: [CVE-2026-42897]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:weekly:2026-W20
    evidence:
      - quote: "Microsoft is supplying a temporary mitigation for this vulnerability through the Exchange Emergency Mitigation Service. We are working on developing and testing a more permanent fix which we will provide when it meets our quality standards."
        attribution: "Microsoft MSRC (MSRC OData API response)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
      - quote: "Why are there no links to updates in the Security Update Table? Microsoft is supplying a temporary mitigation for this vulnerability through the Exchange Emergency Mitigation Service."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
    extended_notes: |
      Detection: EM Service log at `C:\Program Files\Microsoft\Exchange Server\V15\Logging\MitigationService\MitigationService.log` — verify mitigation ID M2 is listed as "Applied". If EM Service is disabled or the server cannot reach `officemitigations.microsoft.com`, the mitigation is not active and the XSS remains exploitable. Hunt: Exchange transport logs for inbound messages with oversized JavaScript payloads in subject / body delivered to OWA-enabled mailboxes. Defenders on Exchange 2016/2019 without ESU Period 2 enrolment should escalate the ESU decision urgently — the permanent fix will only be available to enrolled organisations.

  - title: "UPDATE: Windows BitLocker YellowKey / CTFMON GreenPlasma zero-days — no out-of-band patch from Microsoft as of 2026-05-18; next patch window is June 2026 Patch Tuesday"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/microsoft/new-windows-miniplasma-zero-day-exploit-gives-system-access-poc-released/", publisher: "BleepingComputer", date: "2026-05-17", role: "primary" }
      - { url: "https://www.threatlocker.com/blog/what-yellowkey-and-greenplasma-zero-day-exploits-reveal-about-trusting-native-windows-security", publisher: "ThreatLocker", date: "2026-05-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (Windows BitLocker YellowKey GreenPlasma OOB patch May 2026) → BleepingComputer tracking new MiniPlasma alias → ThreatLocker analysis of no-patch status"
    summary: |
      As of 2026-05-18, Microsoft has not released an out-of-band security update for either "YellowKey" (TPM-only BitLocker bypass via WinRE FsTx path manipulation) or "GreenPlasma" (CTFMON.exe SYSTEM privilege escalation via IPC flaw — also surfacing under the alias "MiniPlasma" per a fresh BleepingComputer report from 2026-05-17). Researcher "Nightmare Eclipse" / "Chaotic Eclipse" published both PoCs on 2026-05-12–13, and a third related exploit dubbed "MiniPlasma" appeared 2026-05-17 — apparently a variant or additional exploitation path in the same CTFMON IPC mechanism. Without an OOB patch, the earliest likely fix window is June 2026 Patch Tuesday (approx. 2026-06-10). The BleepingComputer report from 2026-05-17 indicates MiniPlasma gives SYSTEM-level access and is a separate PoC from GreenPlasma, though attributed to the same researcher ecosystem. No widespread ITW exploitation of any of the three has been confirmed.
    ch_eu_nexus: "Windows 11 and Windows Server 2022/2025 — the standard desktop OS across Swiss federal and EU government estates; YellowKey particularly affects laptops configured with TPM-only BitLocker (PIN-less), which is the default in most cantonal and federal laptop refresh programmes"
    public_sector_nexus: "direct"
    sector: "public-sector, enterprise"
    cves: []
    actors_campaigns_malware: ["Nightmare Eclipse", "Chaotic Eclipse"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: update-to-prior:weekly:2026-W20
    evidence:
      - quote: "As of the search results date (May 2026), organizations will remain vulnerable for at least 27 days—the window before the next official patch cycle—unless Microsoft issues an emergency out-of-band (OOB) fix. No out-of-band patch had been announced"
        attribution: "Multiple sources (ThreatLocker / search synthesis)"
        source_url: "https://www.threatlocker.com/blog/what-yellowkey-and-greenplasma-zero-day-exploits-reveal-about-trusting-native-windows-security"
    extended_notes: |
      Hardening while awaiting patch: enable BitLocker Network Unlock for domain-joined workstations (requires PKI and DHCP scope configuration) so that a PIN is enforced at boot when not on the corporate network; this removes the YellowKey WinRE vector. For GreenPlasma/MiniPlasma: AppLocker / WDAC rules blocking unsigned code injection into CTFMON.exe (parent-process filter for unusual CTFMON spawns). Event IDs 4688 (process creation) and Sysmon EID 10 (process access to ctfmon.exe) are the primary hunt pivots. The researcher's continued disclosure pattern — three unpatched PoCs in six days — suggests more may follow; monitor the researcher's public channels.

  - title: "UPDATE: Instructure Canvas / US House Homeland Security deadline 2026-05-21 — Instructure response status unknown; deadline passes Thursday"
