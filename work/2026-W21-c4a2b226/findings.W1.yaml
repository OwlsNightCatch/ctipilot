    summary: |
      The 2026-05-21 deadline from US House Homeland Security Committee Chairman Garbarino for a closed-door briefing by Instructure CEO Steve Daly on the ShinyHunters double-intrusion passes on Thursday. As of 2026-05-18, Instructure had not publicly confirmed whether Daly or a designated cybersecurity executive would comply with the request. The letter asked for disclosure on both intrusions' circumstances, data volume accessed, remediation steps, and adequacy of CISA coordination. Non-compliance would be politically notable but carries no immediate legal enforcement mechanism without a formal subpoena. For Swiss and EU higher-education institutions running Canvas: the GDPR and Swiss nFADP notification obligations for the estimated 30 million globally-active user dataset remain unresolved — the "shred-logs" claim is legally unverifiable. EU supervisory authority inquiries (notably from Germany, Austria, and Switzerland given active Canvas deployments) are plausible follow-ons regardless of the Congressional outcome.
