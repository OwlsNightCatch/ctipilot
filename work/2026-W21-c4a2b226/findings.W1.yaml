      Verizon published the 2026 Data Breach Investigations Report (19th annual edition, covering incidents November 2024–October 2025) in early May 2026, with a companion webinar by DBIR authors scheduled for 2026-05-19. The 2026 DBIR continues the trajectory established in the prior edition: credential abuse remains the leading initial access vector (22% of breaches), vulnerability exploitation is the second most common entry point (20% of breaches, up from the previous report's 34% year-on-year increase), and third-party breaches now account for 30% of incidents (up from 15% the prior period). Edge devices and VPNs are the fastest-growing exploitation category — near-zero median days between critical CVE disclosure and mass exploitation for edge device vulnerabilities. A new finding in the 2026 edition is the GenAI credential-leakage theme: 14% of employees accessed GenAI tools on corporate devices, and 72% of those users did so via personal email accounts without enterprise authentication — creating a systematic credential-leakage risk outside corporate security monitoring. Espionage-motivated breaches grew significantly (exact percentage varies by region; APAC at 34% espionage-share, EMEA at 18%), with 70% of espionage breaches using vulnerability exploitation as the initial access vector targeting unpatched VPNs and edge devices.
    ch_eu_nexus: "annual strategic report directly relevant to Swiss and EU public-sector risk management and board-level reporting; the edge-device exploitation findings are directly validated by CVE-2026-0300 (PAN-OS), CVE-2026-20182 (SD-WAN), and the NGINX Rift ITW finding this week"
