    extended_notes: |
      EU/CH institutional response action: GDPR Art. 33/34 notification clock for affected EU institutions runs from when they "became aware" of the breach — the 2026-05-11 ransom disclosure may reset that clock if institutions were not previously notified. Institutions should formally document when they received Instructure's notification and assess whether the 72-hour supervisory authority reporting window has been triggered. Swiss institutions: EDÖB notification under nFADP Art. 24 is required for breaches that may result in high risk to data subjects.

  - title: "Verizon DBIR 2026 (19th edition) published — espionage breaches up, credentials remain #1 initial-access vector, GenAI credential leakage flagged"
