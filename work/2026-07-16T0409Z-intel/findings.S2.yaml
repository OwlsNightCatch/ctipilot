    discovery_trace: "first seen at: WebSearch (\"swisscybersecurity.net Schweiz Cyberangriff Juli 2026\") → pivot: Netzwoche, URL https://www.netzwoche.ch/news/2026-07-15/cyberangriff-auf-dienstleister-trifft-industrielle-werke-basel → corroborating: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-07-15/cyberangriff-auf-dienstleister-trifft-industrielle-werke-basel → corroborating (search-only, 403 on direct fetch): Inside IT, URL https://www.inside-it.ch/kundendaten-der-industriellen-werke-basel-gestohlen-20260715"
    summary: |
      Industrielle Werke Basel (IWB) — the municipal energy, water, and telecom utility for the canton/city of Basel — disclosed on 15 July 2026 that an external service provider it uses was compromised and roughly 40,000 customer records were exfiltrated from the provider's environment. The stolen data comprises customer names and addresses plus technical smart-meter attributes (meter serial numbers and installation characteristics); IWB and the reporting outlets explicitly state that email addresses, phone numbers, energy-consumption data, and billing/payment data were NOT part of the exposure, so no consumption-pattern inference is possible from what was taken. IWB's own IT environment and OT/grid systems were not affected and energy supply continuity was not impacted — the compromise is scoped to the provider's systems and the customer-data feed IWB shares with it. The service provider notified IWB after detecting the intrusion; IWB responded by auditing access, reviewing logs, and pre-emptively restricting/suspending its data exchange with the affected provider pending further assurance. No ransomware group or intrusion actor has claimed the incident and no vendor/provider name, CVE, or initial-access vector has been disclosed by IWB or the press as of this run. The canton of Basel-Stadt's data protection officer, Danielle Kaufmann, assessed the misuse risk from the exposed dataset as low; IWB is nonetheless warning customers to be alert to unsolicited contact referencing their address or meter number, particularly demands for money or personal data made under time pressure. For defenders, this is a textbook third-party/vendor data-exposure pattern (ATT&CK T1199 Trusted Relationship: the adversary reached victim customer data by compromising a trusted external processor rather than the utility's own perimeter) affecting a European critical-infrastructure operator (energy/utility sector) — a reminder that vendor risk management and data-minimization agreements with metering/billing processors are as load-bearing as the utility's own network defenses, since the utility's SOC has no direct telemetry into the compromised third party.
