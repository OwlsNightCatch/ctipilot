  - title: "TuxBot v3 Evolution — Unit 42 documents an LLM-assisted IoT botnet framework tied to the Keksec/AISURU ecosystem"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/tuxbot-v3-evolution-iot-botnet/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-15", role: primary }
      - { url: "https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-05-28-TuxBot-v3-Evolution-Framework-Analysis.txt", publisher: "Unit 42 Timely Threat Intel (GitHub)", date: "2026-05-28", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("Dragos Juneau water utility xOT visibility blind spots" pivot led to general Unit42
      sweep), URL https://unit42.paloaltonetworks.com/ (listing) → primary: Unit 42, URL
      https://unit42.paloaltonetworks.com/tuxbot-v3-evolution-iot-botnet/ (full technical write-up fetched via jina reader)
    summary: >
      Unit 42 recovered the complete source tree, a Git development log and 254 automated DDoS-benchmark reports for
      "TuxBot v3 Evolution," a previously undocumented modular IoT-botnet framework whose developer used an LLM to
      write large parts of the C/Go codebase. The bot is a statically-linked C binary that cross-compiles for 17
      architectures (ARM, MIPS/MIPSEL/MIPS64, x86_64, PowerPC, RISC-V, etc.), brute-forces Telnet with 1,496
      credential pairs, and communicates over an X25519+ChaCha20-Poly1305 encrypted TCP primary channel with five
      fallback mechanisms: a SHA-512 domain-generation algorithm (20 candidate domains/day), Ed25519-signed P2P
      gossip, IRC, DNS TXT queries and HTTP polling. Persistence uses seven mechanisms (a systemd service disguised
      as sd-pam.service, cron @reboot/*-5-min entries, shell-profile injection, watchdog keepalive, periodic binary
      relocation across 21 directories masquerading under 20 legitimate daemon names). LLM-introduced bugs — raw
      chain-of-thought reasoning left in source comments, a hard-coded model safety disclaimer shipped unremoved, an
      XOR string-table key mismatch, a VM-magic-value mismatch that breaks the custom exploit virtual machine, and a
      hallucinated Argon2id password-hashing implementation that silently falls back to SHA-256 while faking the
      Argon2id output format — leave roughly 70% of the framework's features non-functional in the recovered build;
      Unit 42 fixed several of them with a handful of targeted LLM prompts, meaning a corrected operator build likely
      already exists. Pivoting on a hard-coded dropper IP address ties TuxBot's C2/dropper infrastructure to Kaitori
      v3.9 and AISURU-branded DDoS tooling, placing the operator inside the Keksec IoT-botnet ecosystem; the
      developer's leaked Git-log hostname and a still-active parent domain point to an Iran-hosted development
      workstation.
    region_nexus: "global — IoT botnet targeting internet-exposed Telnet/SSH/HTTP/ADB devices worldwide; no CH/EU-specific targeting stated"
    primary_sector_nexus: "indirect — any internet-exposed IoT/embedded network device (energy, water, telco OT-adjacent gateways) is in the Telnet/SSH/HTTP scanner's target set"
    sector: "telco, energy, water, transport"
