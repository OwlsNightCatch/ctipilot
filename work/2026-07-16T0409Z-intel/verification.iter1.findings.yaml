- code: F3
  category: claim-not-supported
  section: worldleaks-kudankulam
  item: "World Leaks / Kudankulam nuclear-contractor third-party-hosting breach"
  url_or_quote: "\"Reuters reviewed a subset of about 19,000 files ... but could not independently verify their authenticity.\" (also in summary and sourcing_note)"
  summary: >-
    The sole cited source (The Week, relaying Reuters —
    theweek.in/.../india-s-nuclear-files-leaked-on-dark-web...html), fetched twice this
    iteration incl. a targeted query, contains NO statement that Reuters could/could not verify
    the files' authenticity. The article hedges with "allegedly"/"claimed" but the specific
    "Reuters could not independently verify" attribution is absent from the cited page. The
    underlying Reuters wire may carry it; either find a citation that states it, attribute it as
    the store's own caution, or soften to the article's actual "allegedly/claimed" hedging. Low
    reader-risk (the claim is epistemically conservative) but it puts words in Reuters' mouth the
    cited relay does not support.
- code: F14
  category: quantifier-without-source
  section: asyncapi-npm-compromise
  item: "AsyncAPI npm compromise (UPDATE) — valid provenance attestations delta"
  url_or_quote: "\"Unit 42 independently corroborates the timeline and places the incident third in an April–July 2026 Miasma-descended npm-compromise lineage\""
  summary: >-
    The cited Unit 42 tracker (unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/),
    fetched twice incl. a targeted count query, names only TWO distinct Miasma-descended npm
    compromises (Red Hat, 1 Jun 2026 → AsyncAPI, 14 Jul 2026) and uses no ordinal "third"
    language. The ordinal "third" is attributed to Unit 42 but the source supports at most
    "second" / "descendant of the June 2026 Red Hat Miasma operation." Substantiate "third" from
    the source or drop the ordinal (the "descendant of the Red Hat Miasma operation" framing IS
    supported). Truth-class: invented specificity not in the cited source.
