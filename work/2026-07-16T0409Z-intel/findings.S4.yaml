  - title: "xAI's Grok Build CLI silently uploaded developers' full Git repositories and unredacted secrets to xAI cloud storage"
    sources:
      - { url: "https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html", publisher: "The Hacker News", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: TheHackerNews feed, URL https://feeds.feedburner.com/TheHackersNews → primary: The Hacker News, URL https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html (citing researcher cereblab's own published wire-level analysis: https://gist.github.com/cereblab/dc9a40bc26120f4540e4e09b75ffb547 and https://github.com/cereblab/grok-build-exfil-repro/blob/main/COMPARISON.md)"
    summary: |
      Researcher cereblab's wire-level traffic analysis of xAI's Grok Build coding CLI (tested at v0.2.93) found the tool bundled and uploaded a developer's entire Git repository — full commit history included — to an xAI-controlled Google Cloud Storage bucket (grok-code-session-traces), not only the files the model had actually read or been asked to process. On a 12 GB test repository the model never read, model-turn API traffic totalled ~192 KB while the storage-upload channel moved 5.10 GiB (a ~27,800x gap between what the assistant "saw" and what left the machine); a tracked, unredacted .env file containing canary API_KEY and DB_PASSWORD values was captured intact in the upload. xAI's own /v1/settings endpoint kept reporting trace_upload_enabled: true even with the "Improve the model" telemetry toggle disabled. xAI applied a silent server-side fix (disable_codebase_upload: true) on 13 July with no security advisory, and offered a /privacy CLI command to disable retention and delete previously synced data; Enterprise Zero Data Retention accounts reportedly never had code stored this way. This is not attacker activity — it is a vendor data-handling/telemetry-design defect — but it is directly relevant to any organization whose developers use AI coding-CLI tools: source code, commit history and unredacted secrets can leave the endpoint via a channel the product's own consent/telemetry toggles did not control.
    region_nexus: "global — no Swiss/EU-specific victim population identified, but any EU/CH developer using Grok Build prior to the 13 July fix is potentially affected"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco (any sector with developers using AI coding-CLI tooling)"
    cves: []
    techniques: []
    affected_products: ["xAI Grok Build (CLI, v0.2.93 and earlier)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "On a 12 GB repo of files the model never read, model-turn traffic to /v1/responses came to about 192 KB while the storage channel to /v1/storage moved 5.10 GiB."
        attribution: "researcher cereblab, via The Hacker News"
        source_url: "https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html"
      - quote: "A tracked .env went with them unredacted, canary API_KEY and DB_PASSWORD values and all."
        attribution: "researcher cereblab, via The Hacker News"
        source_url: "https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html"
