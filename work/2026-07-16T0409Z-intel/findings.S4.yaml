  - title: "Cyberattack on an IWB (Basel utility) third-party service provider exposes ~40,000 customer meter records"
    sources:
      - { url: "https://www.netzwoche.ch/news/2026-07-15/cyberangriff-auf-dienstleister-trifft-industrielle-werke-basel", publisher: "Netzwoche", date: "2026-07-15", role: "primary" }
