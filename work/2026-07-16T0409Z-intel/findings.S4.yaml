    discovery_trace: "first seen at: WebSearch (\"Cyberangriff Datenleck Schweiz Juli 2026\") → primary: Netzwoche, URL https://www.netzwoche.ch/news/2026-07-15/cyberangriff-auf-dienstleister-trifft-industrielle-werke-basel → corroborating: Watson.ch, URL https://www.watson.ch/schweiz/digital/404373086-kundendaten-der-industriellen-werke-basel-entwendet → corroborating: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-07-15/cyberangriff-auf-dienstleister-trifft-industrielle-werke-basel"
    summary: |
      Cybercriminals compromised an unnamed external IT service provider of Industrielle Werke Basel (IWB) — the canton-owned Basel utility supplying electricity, gas, water and telecom — and exfiltrated roughly 40,000 customer records containing name, address, meter number and technical installation/meter specifications. Email addresses, phone numbers, consumption data, banking/payment details and IWB's own core systems were not affected, and energy/water supply continuity was not disrupted. The vendor discovered the intrusion and notified IWB immediately; IWB restricted data exchange with the provider, ran a security review, notified the Basel-Stadt cantonal data protection officer, and sent individual notification letters to affected customers. The cantonal DPA assessed the misuse risk as low and no exploitation of the stolen data has been observed as of publication. Neither the vendor's name nor the initial-access vector (credential compromise, vulnerability exploitation, or other) has been disclosed by IWB or any outlet reviewed. IWB's CEO is quoted regretting the incident at its supplier and reiterating that direct-debit/meter-related contact from third parties citing this incident should be treated with suspicion (classic PII-enabled follow-on phishing risk).
    region_nexus: "Switzerland (Basel-Stadt) — canton-owned critical-infrastructure utility"
