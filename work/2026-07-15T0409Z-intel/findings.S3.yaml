  - title: "ESET: 11 forgotten Microsoft-signed UEFI shim bootloaders let attackers bypass Secure Boot on any UEFI system (CVE-2026-8863, CVE-2026-10797)"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/", publisher: "ESET Research (WeLiveSecurity)", date: "2026-07-14", role: "primary" }
      - { url: "https://kb.cert.org/vuls/id/616257", publisher: "CERT/CC (VU#616257)", date: "2026-07-14", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/11-old-microsoft-signed-linux-uefi.html", publisher: "The Hacker News", date: "2026-07-14", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/07/14/eset-uefi-secure-boot-bypass/", publisher: "Help Net Security", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"ESET research blog July 14 2026 malware\") → pivot: The Hacker News / Help Net Security summaries, URL https://thehackernews.com/2026/07/11-old-microsoft-signed-linux-uefi.html → primary: ESET Research, URL https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/ → corroborating primary: CERT/CC VU#616257, URL https://kb.cert.org/vuls/id/616257"
    summary: |
      ESET Research identified 11 old, forgotten UEFI shim bootloaders (shim versions 0.9 and below) that are still trusted under the Microsoft Corporation UEFI CA 2011 third-party certificate authority and can be used to bypass UEFI Secure Boot on any UEFI-based machine that trusts that CA, regardless of the installed OS. The shims fail four separate checks that later shim releases added: (1) no enforcement of the MOK deny-list (MokListX, added in shim v0.9), (2) no support for SBAT (Secure Boot Advanced Targeting, added in v15.3), (3) they chain-load known-vulnerable second-stage bootloaders — notably GRUB 2 (~2015) affected by CVE-2015-5281, which lets an attacker load unsigned code via the multiboot/multiboot2 protocol — and (4) a distinct revocation-bypass flaw newly assigned CVE-2026-10797, where the shim's revocation-check routine and its signature-verification routine disagree on which length field in the Authenticode WIN_CERTIFICATE structure to trust, letting an attacker tamper with the structure to evade both the dbx (UEFI revocation list) and MokListX checks. A second CVE, CVE-2026-8863, covers additional vendor-specific shim builds (Spyrus WTGCreator, Baramundi Management Suite ≤2024R1, WhiteCanyon/Blancco WipeDrive, Finland's Abitti exam software, NTC IT ROSA Linux, Oracle Linux 7.2, PC-Doctor Service Center) that ship the same class of outdated, MokListX/SBAT-lacking shim. Exploitation requires only that an attacker be able to write a copy of one of these old shim binaries to the EFI System Partition (no physical presence needed if the ESP is writable, e.g. via an already-compromised OS or an unattended provisioning workflow) — the attacker does not need the OS the shim originally shipped with to be installed at all, since Secure Boot trust is anchored to the certificate, not the OS. ESET reported the findings to CERT/CC on 2026-02-16; Microsoft revoked all 11 shims via the dbx forbidden-signature database update shipped in the 2026-06-09 Patch Tuesday. No in-the-wild exploitation has been observed; ESET frames the risk in terms of the UEFI bootkit families this class of bypass could enable (Bootkitty, HybridPetya, BlackLotus). Defenders should verify their dbx has actually been updated (stale/incompletely-deployed dbx revocation is common on OEM and embedded/appliance UEFI implementations) using audit tooling such as Check-UEFISecureBootVariables (Windows) or uefi-dbx-audit (Linux/fwupd), and should not assume "Secure Boot: On" in firmware settings means the boot chain is actually protected against this class of bypass.
    region_nexus: "global — affects any UEFI-based system trusting the Microsoft Corporation UEFI CA 2011 (the vast majority of Windows and dual-boot Linux/Windows enterprise and public-sector fleets), independent of installed OS"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, healthcare, finance, telco, transport"
    cves: [CVE-2026-8863, CVE-2026-10797]
    techniques: [T1542.003, T1553.006]
    affected_products: ["UEFI shim bootloader (rhboot/shim) v0.9 and below", "Spyrus WTGCreator", "Baramundi Management Suite ≤2024 R1", "WhiteCanyon/Blancco WipeDrive 8.0.0-8.1.3", "Finland Matriculation Examination Board Abitti 1.0", "NTC IT ROSA Linux R9/R10", "Oracle Linux 7.2", "PC-Doctor Service Center 15/16", "openSUSE UEFI Shim Loader / Shim 2.1", "GRUB 2 (~2015, CVE-2015-5281 chain-load path)"]
    entity_keys: []
    new_entities:
      - { key: "trend:forgotten-uefi-shims-secure-boot-bypass-2026", type: trend, name: "Forgotten UEFI shim Secure Boot bypass (CVE-2026-8863 / CVE-2026-10797)", aliases: [], summary: "ESET Research (2026-07-14) identified 11 outdated, still-trusted Microsoft-signed UEFI shim bootloaders (v0.9 and below) lacking MokListX/SBAT support that allow UEFI Secure Boot bypass and bootkit deployment on any UEFI system trusting the Microsoft Corporation UEFI CA 2011; a distinct revocation-bypass flaw (CVE-2026-10797) also lets an attacker tamper with the Authenticode WIN_CERTIFICATE structure to evade dbx/MokListX checks. Reported to CERT/CC 2026-02-16; Microsoft revoked the shims via the 2026-06-09 Patch Tuesday dbx update." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ESET researchers identified 11 old and forgotten UEFI shim bootloaders at versions 0.9 and below that can be used to bypass UEFI Secure Boot on any UEFI-based machine."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
      - quote: "Exploitation is not limited to systems with the affected software or OS installed, as attackers can bring their own copy of the vulnerable shims to any UEFI system."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
      - quote: "the revocation check and the signature verification functions diverged on which size value they should trust... bypass the revocation mechanism."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
      - quote: "What makes these old shims dangerous is not a novel vulnerability, it's that no new vulnerability is needed to bypass UEFI Secure Boot."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
    extended_notes: |
      Defender vantage: this is a supply-chain/trust-anchor problem rather than a single-vendor patch — the exposure persists as long as an org's UEFI implementation trusts the Microsoft Corporation UEFI CA 2011 and has not received/deployed the 2026-06-09 dbx update. Fleets that image machines from old recovery/diagnostic media (PC-Doctor, WipeDrive, OEM diagnostic partitions) or maintain dual-boot/legacy Linux distros (Oracle Linux 7.2, openSUSE, older RHEL/CentOS 7.2 builds per CERT/CC's affected list) are the most exposed population. CERT/CC's VU#616257 lists 36+ vendors as "status unknown" — worth an internal sweep against firmware/BIOS inventory rather than assuming the Patch Tuesday dbx update alone closes the gap on embedded/appliance firmware that doesn't receive Windows Update–delivered dbx revisions.
