  - title: "Proofpoint: OAuth client ID spoofing lets attackers validate stolen Entra ID credentials at scale without generating a successful sign-in log event"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy", publisher: "Proofpoint Threat Research", date: "2026-07-13", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/07/13/entra-id-oauth-client-id-spoofing/", publisher: "Help Net Security", date: "2026-07-13", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/oauth-client-id-spoofing-lets-attackers.html", publisher: "The Hacker News", date: "2026-07-13", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"OAuth client ID spoofing evasion technique Entra ID enumerate accounts validate credentials without sign-in event\") → pivot: Help Net Security / The Hacker News summaries → primary: Proofpoint Threat Research, URL https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy"
    summary: |
      Proofpoint documented a novel authentication-evasion technique — OAuth client ID spoofing — being independently weaponized by at least two distinct threat clusters against Microsoft Entra ID. The mechanism: an attacker POSTs credentials to Entra ID's `/common/oauth2/token` endpoint using the legacy Resource Owner Password Credentials (ROPC) flow, supplying an arbitrary/unregistered GUID as the `client_id` parameter instead of a real registered application ID. Entra ID's differential error responses leak account and credential validity regardless of whether the client_id is real: `AADSTS50034` = username does not exist, `AADSTS50126` = valid username, wrong password, `AADSTS700016` = "application not found in directory" — which paradoxically is the response returned when username AND password are both correct (because Entra ID gets far enough to validate the credential before it fails on the unrecognized client_id). Critically, none of these code paths write a successful (or in most cases any) sign-in log entry, and because the client_id is unregistered, the application-name field in whatever log entry does appear is blank — defeating detections that alert on authentication-attempt spikes correlated by application name. Proofpoint attributes two campaigns: UNK_pyreq2323 (January–March 2026, launched from AWS-hosted infrastructure, 700,000+ distinct spoofed client IDs, targeting 1M+ accounts across ~4,000 tenants, causing account lockouts for ~28% of targeted users as a side effect of failed-attempt thresholds) and UNK_OutFlareAZ (December 2025–March 2026, Cloudflare-fronted infrastructure, 3.7M distinct spoofed client IDs against 2M+ users) — independently discovered techniques with different client-ID-generation and enumeration patterns, indicating parallel invention rather than shared tooling.
    region_nexus: "global — any Microsoft Entra ID tenant with ROPC/legacy authentication enabled is exposed; both observed clusters ran opportunistic mass enumeration rather than targeted regional campaigns"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, telco, healthcare, energy, transport"
    cves: []
    techniques: [T1110.004, T1589.001, T1078.004]
    affected_products: ["Microsoft Entra ID", "Microsoft Entra ID Resource Owner Password Credentials (ROPC) OAuth 2.0 flow"]
    entity_keys: []
    new_entities:
      - { key: "actor:unk-pyreq2323", type: actor, name: "UNK_pyreq2323", aliases: [], summary: "Proofpoint-tracked cluster (2026-07-13) that ran OAuth client ID spoofing against Microsoft Entra ID from AWS infrastructure, Jan-Mar 2026: 700,000+ spoofed client IDs used to enumerate/validate credentials across ~4,000 tenants and 1M+ accounts without generating a successful sign-in log entry." }
      - { key: "actor:unk-outflareaz", type: actor, name: "UNK_OutFlareAZ", aliases: [], summary: "Proofpoint-tracked cluster (2026-07-13) that independently developed OAuth client ID spoofing against Microsoft Entra ID from Cloudflare-fronted infrastructure, Dec 2025-Mar 2026: 3.7M spoofed client IDs against 2M+ users." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Spoofed client IDs enable account enumeration without a registered OAuth application and allow attackers to infer both password and account validity without generating a successful sign-in event."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy"
      - quote: "When a spoofed client ID is used, no corresponding application name is recorded in the sign-in log. This means that detections that look for surges against a specific application name may miss this activity entirely, as the field is blank."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy"
      - quote: "By fragmenting authentication attempts across many fictional applications, activity becomes harder to correlate and may evade per-application detections and rate limiting."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy"
      - quote: "Defenders should treat sign-in log entries with blank application IDs...as potential indicators of client ID spoofing, and recognize that an AADSTS700016 error code may signal compromised credentials, not just a failed login attempt."
        attribution: "Proofpoint Threat Research"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy"
    extended_notes: |
      Triage-relevant discriminator: legitimate ROPC usage (some legacy line-of-business apps, service accounts, and CI/CD pipelines still use ROPC deliberately) will show a registered, named application in the sign-in log — a genuinely blank/absent application-name field on a `/common/oauth2/token` ROPC request, especially at volume against many distinct usernames from a single ASN/cloud-hosting range, is the anomaly to hunt on. AADSTS700016 responses are ordinarily read by defenders as "harmless — misconfigured app," which is precisely the blind spot both clusters exploited; treating a burst of AADSTS700016 responses against valid usernames as equivalent in severity to a successful credential-stuffing hit is the concrete detection-logic change this finding demands. Hardening lever: Conditional Access policies scoped to "all cloud apps" (not per-application) still apply to ROPC sign-ins regardless of client_id validity, so orgs that have not yet blocked the ROPC grant type outright (Entra ID Authentication Methods / legacy auth blocking policies) should treat that as the actionable fix, since per-application CA scoping is trivially bypassed by this technique.
    borderline: false
