  item: "microsoft-july-patch-tuesday-sharepoint-dynamics-followup — CVE-2026-55040 'public PoC'"
  url_or_quote: "title: '...a SharePoint pre-auth JWT bypass with a public PoC (CVE-2026-55040)...'; summary: 'Rapid7 published a PoC and the chained RCE half will not be patched until August'; cves[0].status: [poc-public, patch-available]; tags: [...poc-public...]; actions[0]: 'breaks Rapid7's public Pwn2Own chain'"
  summary: "The cited Rapid7 primary explicitly withholds the PoC: 'Microsoft requests a 30 day stay on disclosure of technical details and publication of PoC' and 'Rapid7 will be publishing full technical details for CVE-2026-55040 within 30 days of this disclosure' (unless ITW exploitation or third-party disclosure occurs first). As of composition (2026-07-15) there is NO public PoC — Rapid7 developed one internally and embargoed it. The claims 'public PoC' (title), 'Rapid7 published a PoC' (summary), status poc-public (cves[0]) and tag poc-public are contradicted by the source, and the body itself never asserts a public PoC ('still-undisclosed RCE'), so the frontmatter/title/summary overstate both source and body. Inflates urgency. Fix: drop poc-public from cves[0].status (leave [patch-available]) and from tags; reword title/summary/action[0] to reflect a Pwn2Own-demonstrated chain whose PoC is under a 30-day embargo. Priority 'high' still stands on the pre-auth Dynamics RCE + auth-bypass basis after correction."
