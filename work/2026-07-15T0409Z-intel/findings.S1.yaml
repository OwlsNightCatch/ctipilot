        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-55944"
    extended_notes: |
      Detection: monitor Dynamics NAV/Business Central application-server process (NAV/BC service host) for unexpected child-process spawns immediately following inbound login-endpoint requests — the deserialization trigger fires during authentication handling, before any session is established, so any process creation attributable to the NAV/BC service account outside normal batch-job or report-generation windows is suspicious. Hardening: prioritise patching any Dynamics NAV/Business Central on-premises instance reachable from the internet or from a low-trust network segment; there is no authentication-based mitigation since the flaw fires pre-auth.
  - title: "CISA republishes four ABB/Rockwell ICS advisories (14 July) — a CVSS 10.0 unauthenticated debug-port takeover in a Rockwell EtherNet/IP adapter and a CVSS 9.9 chain in an ABB fuel/chemical-terminal management system, both with no stated vendor fix"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-04", publisher: "CISA (republishing Rockwell Automation SD1785)", date: "2026-07-14", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-03", publisher: "CISA (republishing ABB PSIRT)", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"CISA cybersecurity advisory July 14 2026 industrial control systems\") → cisa-advisories bridge listing, URL https://www.cisa.gov/news-events/ics-advisories → primary: CISA ICS advisory ICSA-26-195-04, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-04 (Rockwell) and ICSA-26-195-03, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-03 (ABB)"
    summary: |
      CISA republished four ABB/Rockwell ICS advisories on 14 July 2026. The headline is CVE-2026-10577 in the Rockwell Automation 1715-AENTR EtherNet/IP Adapter (versions <=3.003): a network-accessible debug port with no privilege enforcement grants unauthenticated remote access to intrusive CLI commands, letting an attacker read or delete files, stop tasks, modify memory, and change I/O states — CVSSv3.1 and CVSSv4.0 both 10.0 (CWE-306 Missing Authentication for Critical Function). CISA's Recommended Practices section for this advisory contains only generic network-isolation guidance (segment control-system networks, avoid internet exposure, use VPNs for remote access) with no vendor-supplied patched firmware version identified — treat as unpatched pending a Rockwell fix. Sectors named: Energy, Water and Wastewater, Critical Manufacturing. Separately, ABB T-MAC Plus 4.0-24 — a Terminal Management System used at chemical/petroleum terminals, pipeline/refinery tankage, bulk plants and hydrogen terminals — ships fixes for four vulnerabilities discovered by Angelo Catalani of Italy's national cybersecurity agency (ACN): CVE-2025-14771 (CVSS 9.9, authenticated file disclosure via crafted HTTP GET), CVE-2025-14772 (CVSS 8.8, broken access control letting unprivileged users perform admin operations), CVE-2025-14773 (CVSS 8.0, stored XSS), and CVE-2025-14774 (CVSS 7.4, unauthenticated DoS of the Card Reader service via an insecure communication protocol) — exploitation of the highest-severity flaws requires network/physical access to the terminal system, not internet reachability. No in-the-wild exploitation is reported for either product family.
    region_nexus: "ABB is Switzerland-headquartered; both product lines deploy worldwide including EU/CH energy, water and critical-manufacturing operators"
    primary_sector_nexus: "indirect"
    sector: "energy, water, critical-manufacturing"
    cves: [CVE-2026-10577, CVE-2025-14771, CVE-2025-14772, CVE-2025-14773, CVE-2025-14774]
    techniques: [T1190]
    affected_products: ["Rockwell Automation 1715-AENTR EtherNet/IP Adapter", "ABB T-MAC Plus"]
