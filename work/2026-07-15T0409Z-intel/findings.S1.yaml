items:
  - title: "Microsoft July Patch Tuesday, part two: Rapid7's Pwn2Own SharePoint JWT auth-bypass (CVE-2026-55040) leaves an unpatched RCE half live until August, plus two more Site-Owner deserialization RCEs (CVE-2026-50522, CVE-2026-58644)"
    sources:
      - { url: "https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed", publisher: "Rapid7 Labs (Stephen Fewer)", date: "2026-07-14", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50522", publisher: "Microsoft MSRC", date: "2026-07-14", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-58644", publisher: "Microsoft MSRC", date: "2026-07-14", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/microsoft-patches-record-622-flaws.html", publisher: "The Hacker News", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: rapid7-research (RSS feed https://www.rapid7.com/blog/rss/), item URL https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed → primary: Rapid7 Labs disclosure (same URL) → cross-check: Microsoft MSRC CVRF API for CVE-2026-50522 and CVE-2026-58644, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50522 → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/microsoft-patches-record-622-flaws.html"
    summary: |
      Beyond the two already-KEV-listed July Patch Tuesday zero-days (AD FS CVE-2026-56155, SharePoint CVE-2026-56164), Microsoft's SharePoint fixes this cycle include three more deserialization/auth-bypass RCE-class flaws that materially widen the picture. CVE-2026-55040 (CVSSv3.1 9.1, CWE-1390 Weak Authentication) is an authentication-bypass in SharePoint's JWT token validation pipeline, discovered by Rapid7's Stephen Fewer as part of a two-vulnerability chain built for Pwn2Own Berlin 2026. A remote unauthenticated attacker who knows a target's AD Security ID or User Principal Name (UPN, e.g. administrator@domain.local) can forge identity and act as that SharePoint user/administrator; Rapid7's PoC demonstrates SID enumeration followed by JWT-bypass impersonation of the site administrator. Rapid7 chained CVE-2026-55040 to a second, still-undisclosed RCE vulnerability for full unauthenticated remote code execution — that RCE half is deliberately withheld and is not expected to be patched by Microsoft until the August 2026 cycle, so patching CVE-2026-55040 now is the only available defense and breaks the full chain even though the RCE component remains technically unpatched. Separately, CVE-2026-50522 and CVE-2026-58644 (both CVSSv3.1 9.8, CWE-502 Deserialization of Untrusted Data, "Exploitation More Likely") let an attacker already authenticated as at least a Site Owner inject and execute arbitrary code remotely on the SharePoint Server — network-reachable, low attack complexity, but gated behind Site-Owner-level access rather than fully unauthenticated. None of these three CVEs show confirmed in-the-wild exploitation as of this run; all affect SharePoint Server Subscription Edition, 2019 and 2016 and are fixed in the July 2026 cumulative updates.
    region_nexus: "global; SharePoint on-prem is common across Swiss/EU public-sector and enterprise document-management estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, healthcare, energy, telco"
