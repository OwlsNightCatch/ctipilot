    evidence:
      - quote: "A remote unauthenticated attacker can leverage CVE-2026-55040 to bypass authentication on a vulnerable SharePoint server and perform operations as a SharePoint site user or administrator."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed"
      - quote: "The RCE component has been disclosed to Microsoft and is expected to be patched in the scheduled August patch cycle."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed"
      - quote: "In a network-based attack, an attacker authenticated as at least a Site Owner, could write arbitrary code to inject and execute code remotely on the SharePoint Server."
        attribution: "Microsoft MSRC (CVE-2026-50522 / CVE-2026-58644 FAQ)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50522"
    extended_notes: |
      Detection/hunt angle: the JWT-bypass path (CVE-2026-55040) is invisible to normal sign-in/Conditional-Access telemetry since no credential is presented — hunt for SharePoint web-server access-log requests bearing crafted/anomalous JWT bearer tokens or Authorization headers referencing SIDs/UPNs not matching the session's actual authenticated principal, and for SharePoint ULS/audit-log entries showing an operation performed "as" a user with no corresponding prior interactive/API sign-in event for that user in the same session window. For the Site-Owner deserialization RCEs, watch for anomalous w3wp.exe (SharePoint app pool) child-process spawns following SharePoint list/webpart operations — the classic .NET deserialization-to-RCE process-lineage signature already used to detect CVE-2026-45659 exploitation. Hardening: apply the July 2026 SharePoint cumulative update now regardless of AMSI/anti-malware-scan-interface status: patching CVE-2026-55040 alone breaks Rapid7's full chain even before the RCE CVE is disclosed in August. Restrict Site Owner role assignment and treat it as a privileged role for auditing purposes given its new RCE reach.
  - title: "CVE-2026-55944 — Microsoft Dynamics NAV / Dynamics 365 Business Central (On-Premises): unauthenticated deserialization RCE via a crafted login request (CVSS 9.8, Exploitation More Likely)"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-55944", publisher: "Microsoft MSRC", date: "2026-07-14", role: "primary" }
      - { url: "https://advisories.ncsc.nl/rss/advisories", publisher: "NCSC-NL (advisory NCSC-2026-0238)", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl (RSS feed), URL https://advisories.ncsc.nl/rss/advisories, item NCSC-2026-0238 'Kwetsbaarheid verholpen in Microsoft Dynamics' (Microsoft expects active exploitation) → primary: Microsoft MSRC CVRF API, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-55944"
    summary: |
      CVE-2026-55944 (CVSSv3.1 9.8, CWE-502 Deserialization of Untrusted Data, Microsoft rating "Exploitation More Likely") is an unauthenticated remote-code-execution vulnerability in Microsoft Dynamics NAV and Dynamics 365 Business Central (on-premises). Per Microsoft's own FAQ, an attacker can exploit it "by sending a specially crafted login request to an affected Dynamics NAV or Business Central server" — no authentication and no user interaction are required (AV:N/AC:L/PR:N/UI:N). NCSC-NL's independent advisory on the same fix explicitly flags it as high-risk for publicly reachable instances: because Dynamics deployments frequently expose public interfaces and require no user interaction to exploit, Microsoft expects active exploitation, even though NCSC-NL states no exploitation or public PoC has been observed as of publication. This deserialization flavor mirrors the SharePoint pair covered above and the June CVE-2026-45659 SharePoint KEV entry, but in a product family — ERP/ business-management software — that is easy to overlook relative to SharePoint or Exchange when triaging this Patch Tuesday. The fix ships in the July 2026 update cycle; no CVE-specific patched build number beyond "install the July 2026 security update" is stated in the public advisory.
    region_nexus: "global; Dynamics NAV/Business Central is widely deployed by SMEs and public-sector-adjacent finance/back-office functions in Switzerland and the EU"
