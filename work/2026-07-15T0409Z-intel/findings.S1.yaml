    novelty: new
    evidence:
      - quote: "Successful exploitation of this vulnerability could allow an attacker to read or delete files, stop tasks, modify memory, and change I/O states, potentially impacting the confidentiality, integrity, and availability of the device."
        attribution: "CISA / Rockwell Automation SD1785"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-04"
      - quote: "No known public exploitation specifically targeting this vulnerability has been reported to CISA at this time."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-04"
      - quote: "File Disclosure in ABB T-MAC Plus web application allows authenticated users to exfiltrate files containing sensitive information via crafted HTTP GET request."
        attribution: "CISA / ABB PSIRT"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-03"
    extended_notes: |
      Detection (Rockwell): the debug/CLI port is a distinct network service from the normal EtherNet/IP control protocol — network-level monitoring for connections to this port from any host other than known engineering-workstation IPs is a strong, low-noise signal since no legitimate remote-management workflow should reach it externally. Hardening: since no firmware fix is cited in the CISA republication, the only available control is network isolation — remove the adapter's debug port from any routable segment and enforce allow-listing at the switch/firewall level for the handful of engineering workstations that need it. Detection (ABB T-MAC Plus): monitor terminal-management web-app access logs for HTTP GET requests carrying path-like parameters outside the expected file set (CVE-2025-14771) and for admin-API calls from sessions authenticated with non-admin roles (CVE-2025-14772 broken access control) — both are authenticated-tier abuses so session/account audit logging is the primary hunt surface, not perimeter telemetry.
