    discovery_trace: "first seen at: cisa-advisories, URL https://www.cisa.gov/news-events/cybersecurity-advisories (bridge listing, Industrial Control Systems Advisories filter) → primary: CISA ICS advisory ICSA-26-195-04 (Rockwell), URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-04 → corroborating same-day batch: ICSA-26-195-03 (ABB T-MAC Plus), URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-03 → ICSA-26-195-02 (ABB Ability Edgenius), URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-02 → ICSA-26-195-01 (ABB Advant Master Online Builder), URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-195-01"
    summary: |
      CISA published four ICS advisories on 2026-07-14, all verbatim republications of vendor PSIRT bulletins, that land directly on the profile's energy and water sectors and on a Swiss-headquartered vendor.

      Rockwell Automation 1715-AENTR EtherNet/IP Adapter (all versions <=3.003, CVE-2026-10577, CVSS v3.1/v4.0 10.0) exposes a network-accessible debug port/CLI with no authentication (CWE-306 Missing Authentication for Critical Function). An unauthenticated remote attacker can read or delete files, stop tasks, modify memory, and change I/O states on the device. CISA's own advisory names the affected Critical Infrastructure Sectors as "Energy, Water and Wastewater, Critical Manufacturing" — a direct hit on two of this constituency's additional sectors. No fixed firmware version is named in the advisory (the affected range is open-ended "<=3.003"); the only mitigation offered is network isolation — keep the adapter off the internet, segment it behind firewalls from business networks, and use VPN for any required remote access. No known public exploitation has been reported to CISA as of publication.

      ABB T-MAC Plus 4.0-24 — a Terminal Management System used to operate chemical/petroleum terminals, pipeline/refinery tankage, bulk plants and hydrogen terminals (i.e., energy-sector OT) — ships four CVEs discovered and responsibly disclosed by Angelo Catalani of Italy's national cybersecurity agency (ACN): CVE-2025-14771 (CVSS 9.9, unauthenticated-adjacent file disclosure via crafted HTTP GET against the web application, CWE-552), CVE-2025-14772 (CVSS 8.8, broken access control letting a low-privilege authenticated user perform administrative operations, CWE-639 authorization bypass through user-controlled key), CVE-2025-14773 (CVSS 8.0, stored XSS, CWE-79), and CVE-2025-14774 (CVSS 7.4, unauthenticated DoS of the Card Reader service caused by an unencrypted communication protocol, CWE-863). ABB states exploitation requires network/physical access to the terminal LAN, not internet exposure, and that the fix is a configuration update to the web application and Card Reader protocol (no explicit version number given). ABB is headquartered in Switzerland.

      Same day, ABB also patched Ability Edgenius (an edge-computing/OT gateway platform, also Swiss-HQ'd) for CVE-2026-31431 ("Copy Fail," CVSS 7.8) — a Linux kernel algif_aead cryptographic-interface flaw letting a locally authenticated user or compromised container workload escalate to root — and shipped a low-severity DLL search-path fix (CVE-2025-13162, CVSS 4.4) in Advant Master Online Builder / 800xA for Advant Master. "Copy Fail" itself is the same generic kernel CVE CERT-EU flagged in April 2026; this advisory is new because it names a specific Swiss-vendor OT product as an affected instance.
