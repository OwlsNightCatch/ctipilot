    extended_notes: |
      Detection/hardening framing for a Tier 2/3 reader: for the Rockwell adapter, the telemetry class to watch is network flows to the adapter's debug/CLI TCP port from any host other than a known engineering workstation — since there is no authentication, any inbound session to that port from an unexpected source is itself the indicator; the durable fix until firmware ships is strict network segmentation (the adapter should never answer on a routable/business-network interface). For ABB T-MAC Plus, the telemetry class is web-application access logs on the terminal's HTTP(S) management interface — watch for GET requests probing file paths outside the expected UI structure (the file-disclosure CWE-552 path) and for admin-API calls issued by accounts holding only low-privilege roles (the CWE-639 broken-access-control path); the DoS path rides the unencrypted Card Reader protocol, so any anomalous volume or malformed frames on that segment merit hunting. For Copy Fail (CVE-2026-31431) on Edgenius, the relevant control is host/container isolation on the edge node — the flaw needs local code execution (via SSH or a compromised container workload) to reach the vulnerable algif_aead kernel interface, so the discriminator between benign and malicious activity is whether the local session/workload should have had that access at all.
