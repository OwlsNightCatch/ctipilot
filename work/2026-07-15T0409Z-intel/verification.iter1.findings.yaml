- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "CISA ICS batch (14 Jul) — ABB T-MAC Plus"
  url_or_quote: "entry claims affected versions 'ABB T-MAC Plus 4.0-24, 4.0-25' (title, summary, body, all four cves[].affected, action 2); cited advisory ICSA-26-195-03"
  summary: "The cited CISA advisory ICSA-26-195-03 names ONLY 'ABB T-MAC Plus 4.0-24' as affected — 'T-MAC Plus 4.0-24' appears 5x across the page product_tree and every per-CVE Affected Products block; '4.0-25' appears in no render of the source (bridge default + explicit jina). The version '4.0-25' is an unsupported addition to the affected range. Remediation: drop '4.0-25' throughout, OR add the ABB PSIRT advisory (9AKK108472A7840) as a source if it genuinely lists 4.0-25. Could not read the CSAF JSON directly (GitHub raw/API blocked this session), so verify against it before edit."
- code: F3
  category: claim-not-supported
  section: active-threats
  item: "xAI Grok Build CLI repo exfiltration"
  url_or_quote: "'other users replicated it against whole home directories, exfiltrating SSH keys and a password-manager database ([GBHackers, 2026-07-14])'"
  summary: "The home-directory / SSH-keys / password-manager-database claim is attributed inline to GBHackers, but GBHackers does NOT carry it (GBHackers only says the test was 'replicated with a second, unrelated codebase'). The claim IS supported by The Register — also cited in the entry — which states 'Other Grok Build users reported similar results ... including one whose entire user directory, containing SSH keys, password manager databases, and more, was opened and uploaded.' Fact is true and in-entry sourced; defect is the misattributed citation. Remediation: re-point that clause's citation to The Register (the 'reply OK' half of the sentence is correctly GBHackers)."
- code: F11
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "CISA ICS batch (14 Jul) — CVE-2026-10577 sourcing_note"
  url_or_quote: "sourcing_note: 'Rockwell's advisory carries only a CVSS v3.1 10.0 score; no v4.0 vector was published.'"
  summary: "The cited advisory page ICSA-26-195-04 publishes BOTH a v3.1 (10.0) and a v4.0 vector — 'CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H', base 10.0. The note's claim that 'no v4.0 vector was published' is contradicted by the source. Both scores are 10.0 so no published number is wrong and no reader-facing body claim is affected; low materiality. Remediation: delete or correct the 'no v4.0 vector' clause (the note may be accurate about the raw CSAF JSON but not about the cited web page)."
