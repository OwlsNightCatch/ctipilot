  - title: "xAI's Grok Build CLI silently uploaded developers' entire repositories, git history and secrets to Google Cloud — Musk promises deletion, no advisory issued"
    sources:
      - { url: "https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123", publisher: "The Register", date: "2026-07-14", role: "primary" }
      - { url: "https://gbhackers.com/xai-grok-cli-exposed-developer-code/", publisher: "GBHackers", date: "2026-07-14", role: "corroborating" }
      - { url: "https://blog.rankiteo.com/xaigoo1784039078-xai-google-cloud-breach-july-2026/", publisher: "Rankiteo", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net RSS, URL https://databreaches.net/feed/ (entry 'Elon Musk promises to delete all data following a leak of users' confidential information') → pivot: WebSearch (\"xAI Grok Build CLI leaked confidential data Elon Musk delete\") → primary: The Register, URL https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123"
    summary: |
      Security researcher Cereblab published wire-level analysis showing that xAI's Grok Build CLI — an AI coding-assistant command-line tool — packages a developer's entire Git-tracked repository, including full commit history and any secrets present in that history (even ones since deleted from HEAD), into a Git bundle and uploads it to a Google Cloud Storage bucket controlled by xAI/SpaceXAI, regardless of what the user's prompt actually required. Cereblab measured the uploaded volume at roughly 27,800x the data a coding task should need, and confirmed the behavior triggered even when the model was instructed only to reply "OK" without opening any file. Other users replicated the finding, including one whose entire home directory — SSH keys, password-manager database, and more — was opened and exfiltrated in the same way. xAI's `/privacy` command, which some initially pointed to as the mitigating control, is in fact only a per-session data-retention toggle and has no effect on the upload path; the actual fix was a silent server-side flag (`disable_codebase_upload: true`) applied globally on 13 July, one day after Cereblab's report, with no software update or security advisory issued. Elon Musk posted that "all user data that was uploaded to SpaceXAI before now will be completely and utterly deleted," but xAI has disclosed neither the number of affected users, a deletion timeline, nor any means for a developer to verify their data was actually removed.
    region_nexus: "global; any organization — including EU/CH public-sector or CI development teams — using Grok Build CLI for AI-assisted coding is affected"
    primary_sector_nexus: "indirect (public-sector technology suppliers / any dev team using the tool)"
    sector: "technology, public-sector, cross-sector (software development)"
    cves: []
    techniques: [T1552.001]
    affected_products: ["xAI Grok Build CLI", "SpaceXAI Grok Build"]
    entity_keys: []
    new_entities:
      - { key: "incident:xai-grok-build-cli-repo-exfiltration-2026-07", type: incident, name: "xAI Grok Build CLI whole-repository/secrets exfiltration (July 2026)",
          aliases: ["Grok Build data leak", "Grok Build CLI upload incident"],
          summary: "Cereblab's wire-level analysis found xAI's Grok Build CLI silently bundled and uploaded developers' entire Git repositories (history + secrets) to a Google Cloud Storage bucket at ~27,800x the data volume needed; xAI applied a silent server-side fix and Musk promised deletion of previously uploaded data (The Register, 2026-07-14)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Grok Build packages entire repos and uploads them as Git bundles, instead of just uploading the files required to answer a user's prompt."
        attribution: "Cereblab (via The Register)"
        source_url: "https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123"
      - quote: "All user data that was uploaded to SpaceXAI before now will be completely deleted."
        attribution: "Elon Musk"
        source_url: "https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123"
      - quote: "/privacy is a per-session retention toggle, not the switch that fixed this, so it shouldn't be pointed to as the control."
        attribution: "Cereblab researcher (via The Register)"
        source_url: "https://www.theregister.com/ai-and-ml/2026/07/14/musk-promises-purge-after-grok-build-caught-sending-entire-repos-to-the-cloud/5271123"
    extended_notes: |
      This is a vendor-side data-handling failure, not an adversary campaign — techniques[] reflects the downstream unsecured-credential exposure risk (any SSH key, API token, or password-vault entry that touched a repo processed by the tool should be treated as potentially compromised), not an active attacker TTP. Detection/hunt angle for defenders whose developers may have used the tool: egress monitoring for outbound traffic from developer endpoints/CI runners toward Google Cloud Storage endpoints associated with xAI, and a credential-rotation sweep for any secrets present (even historically, in git history) in repositories opened by Grok Build. Hardening: block/uninstall Grok Build CLI pending an actual vendor security advisory (none has been issued as of this writing — the fix was silent); review CI/CD pipelines and developer workstations for auto-installed AI coding-assistant CLIs with broad filesystem/git access before granting them repo scope.

  - title: "Finland's Supreme Court finalizes the Vastaamo hacker's sentence — wanted notice issued after he fled during appeal"
    sources:
      - { url: "https://therecord.media/finland-issues-wanted-notice-for-hacker-vastaamo-breach", publisher: "The Record (Recorded Future News)", date: "2026-07-14", role: "primary" }
