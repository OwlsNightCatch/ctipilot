  - title: "DOJ indicts Media Land / ML.Cloud bulletproof-hosting operators — infrastructure used by LockBit, BlackSuit and Play; $10M reward offered"
    sources:
      - { url: "https://www.justice.gov/opa/pr/three-russian-nationals-and-two-companies-indicted-international-cybercrimes-resulting-more", publisher: "U.S. Department of Justice (Office of Public Affairs)", date: "2026-07-14", role: "primary" }
      - { url: "https://therecord.media/us-unseals-indictment-russians-bulletproof-hosting", publisher: "The Record (Recorded Future News)", date: "2026-07-14", role: "corroborating" }
      - { url: "https://rewardsforjustice.net/rewards/media-land/", publisher: "U.S. Department of State — Rewards for Justice", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net RSS, URL https://databreaches.net/feed/ (entry 'Rewards For Justice offers reward for info on Media Land, ML.Cloud, and three individuals associated with it') → pivot: WebSearch (\"Rewards for Justice Media Land ML.Cloud bulletproof hosting reward\") → primary: U.S. DOJ press release, URL https://www.justice.gov/opa/pr/three-russian-nationals-and-two-companies-indicted-international-cybercrimes-resulting-more → corroborating: The Record, URL https://therecord.media/us-unseals-indictment-russians-bulletproof-hosting"
    summary: |
      DOJ unsealed a December 2024 indictment (Northern District of Ohio) on 2026-07-14 charging three Russian nationals — Alexander Volosovik, Kirill Zatolokin and Yulia Pankova, all of St. Petersburg — plus two related companies, Medialand LLC and ML.Cloud LLC, with conspiracy to commit computer fraud, wire fraud, and money laundering, for operating "bulletproof hosting" (BPH) services. Per DOJ, Medialand's infrastructure spanned China, Finland, the Netherlands and the US, was marketed on criminal forums, and knowingly leased servers/related services to cybercriminals to infect victim computers with malware/ransomware, extort victims, run criminal marketplaces, register fraudulent domains, and launch phishing and brute-force attacks; DOJ states 42 named victims across 21 US states, and the case title cites over $62M in victim losses. The Record's reporting on the unsealed indictment specifically names Lockbit, BlackSuit and Play as ransomware groups that used Media Land/ML.Cloud services — all three actively target organizations globally, including in Europe. The US State Department's Rewards for Justice program is offering up to $10M for information on foreign-government links to the three individuals or to continued Media Land/ML.Cloud use; OFAC sanctioned the same individuals/entities in November 2025, joined in full by the UK Foreign, Commonwealth & Development Office and in part by Australia's DFAT. The investigation involved the FBI (Cleveland Division), CISA, OFAC, the Dutch National Police and Public Prosecutor's Office, the UK's National Crime Agency, and Australian Federal Police — part of the FBI's ongoing "Operation Riptide."
    region_nexus: "global criminal-infrastructure disruption with direct EU/UK law-enforcement participation (Netherlands, UK NCA); LockBit/BlackSuit/Play customers of this BPH service have historically also targeted European public-sector and CI organizations"
