          summary: "Individual convicted for the 2018 Vastaamo psychotherapy-clinic breach and 2020 mass-extortion of ~24,000+ patients plus the company itself; Finland's Supreme Court finalized his 6y11m sentence on 2026-07-13 after he fled during appeal (The Record, Yle, Helsinki Times, 2026-07-14)." }
