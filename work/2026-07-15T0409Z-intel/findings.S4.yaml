    discovery_trace: "first seen at: databreaches.net RSS, URL https://databreaches.net/feed/ (entry 'Finland issues wanted notice for hacker behind massive psychotherapy data breach') → pivot: WebSearch (\"Aleksanteri Kivimäki wanted notice Finland Vastaamo appeal\") → primary: The Record, URL https://therecord.media/finland-issues-wanted-notice-for-hacker-vastaamo-breach"
    summary: |
      Finland's Supreme Court refused Aleksanteri (Julius) Kivimäki leave to appeal on 2026-07-13, finalizing the Court of Appeal's sentence of six years and eleven months for the 2018 breach of Vastaamo, a Finnish psychotherapy provider — a case The Record describes as the largest criminal case in Finnish history by victim count. Kivimäki obtained the personal data, including confidential therapy notes, of an estimated 33,000 patients; when the company refused to pay in 2020 he attempted extortion against both Vastaamo and more than 24,000 individual patients directly, and published therapy notes for those who did not pay — many of the victims were children or people being treated for severe psychological trauma. Kivimäki was released from pretrial detention in September 2025 pending his appeal and, according to his own lawyer, is now believed to be outside Finland; the Criminal Sanctions Agency has requested — and Finnish police have issued — a wanted notice so he can be arrested and returned to custody to serve the now-final sentence.
    region_nexus: "Finland (EU); direct nexus to EU public-sector/healthcare data-protection posture"
