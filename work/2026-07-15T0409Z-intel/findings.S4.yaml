    summary: |
      Spain's Policía Nacional, supported by Europol and Interpol, announced on 2026-07-13 the dismantling of a criminal organization that appropriated €140M through fake investment-platform scams, CEO fraud (business email compromise), false invoicing, and "man-in-the-middle" payment-redirection fraud across several European countries. Four arrests were made — two in Oporto, Portugal (the lead organizer, via a European Arrest Warrant coordinated through Europol between Spain and Portugal), one in Spain, and one in Panama (via an INTERPOL-coordinated international detention order, with support from the Spanish Interior Attaché and local police). The organization opened more than 800 bank accounts and 120 shell companies, and recruited 67 foreign money mules — European citizens brought into Spain specifically to incorporate companies and open accounts nationwide — to launder proceeds through chained transfers into third-country mule accounts. Investigators confirmed over €94M in laundered flows to date, plus a further €61M defrauded in 2024 through CEO fraud specifically. Agents seized 170+ smartphones and 15 computers used to execute thousands of fraudulent transfers, and froze €3M in fraudulent proceeds for victim restitution.
