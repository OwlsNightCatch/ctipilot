    summary: |
      The UK National Crime Agency announced on 2026-07-13 that five London-based individuals have been charged over Russian Coms, a caller-ID spoofing platform established in 2020 that let subscribers appear to be calling from pre-selected numbers — typically ones belonging to banks, telecoms providers and law-enforcement agencies — to gain victims' trust as a vishing precursor before stealing funds or personal details. The platform, sold as both a handset device and a web application, charged subscribers roughly £1,200–£1,400 for six-month cryptocurrency-paid contracts; per BleepingComputer's account of the NCA's earlier takedown (branded internally as part of "Operation Henhouse"), Russian Coms was linked to over 1.8 million scam calls against an estimated 170,000 victims across 107+ countries before the platform itself was shut down. NCA's charges — against Ayoub Sehailia, Zakkaria Sehailia, Usman Din, Denis Ozmus and Fadila Salem — cover conspiracy to supply articles for use in fraud plus money-laundering offences (transferring/converting/acquiring criminal property); all five are due at Westminster Magistrates' Court on 14 August 2026.
