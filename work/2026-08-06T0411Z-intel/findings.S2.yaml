    extended_notes: |
      Defender vantage: this is the second confirmed Swiss public-sector SharePoint on-prem victim disclosed in
      as many days (federal BIT on 08-04, Canton Graubünden on 08-05), and the AFI head's own statement flags
      the plausible link to the same vulnerability class hitting the Confederation — worth an internal sweep of
      any CH cantonal/communal on-prem SharePoint estate for the July 2026 patch level and IIS/w3wp process
      log review around any late-July anomaly window, even absent a named CVE from either official disclosure.
      No CVE has been officially confirmed for either Swiss incident as of this run; CERT-EU 2026-009 is
      background context only, not a confirmed match.
