      - { url: "https://cert.europa.eu/publications/security-advisories/2026-009/", publisher: "CERT-EU (advisory 2026-009, updated)", date: "2026-07-23", role: "background-context" }
    discovery_trace: "first seen at: WebSearch (\"Cyberangriff Kanton Gemeinde Schweiz August 2026\") → primary: Canton Graubünden official statement, URL https://www.gr.ch/DE/Medien/Mitteilungen/MMStaka/2026/Seiten/20260805010805.aspx → cross-referenced: Swiss federal BIT statement (prior-covered entity incident:foitt-bit-sharepoint-breach-2026-07), URL https://www.admin.ch/de/newnsb/1CjmpBBHQaMV82PjKEpcL → corroborating: swissinfo.ch, URL https://www.swissinfo.ch/eng/various/graub%C3%BCnden-has-also-fallen-victim-to-a-cyber-attack/91851604 → additional technical detail: persoenlich.com (quoting Amt für Informatik head Lorenz Tanner via Keystone-SDA), URL https://www.persoenlich.com/digital/nach-dem-bund-trifft-es-auch-graubunden"
    summary: |
      The IT office (Amt für Informatik, AFI) of the Swiss canton of Graubünden detected a cyberattack against
      a SharePoint server hosting the cantonal administration's public web presence, one day after Switzerland's
      federal IT provider BIT disclosed a similar intrusion (already tracked here as
      incident:foitt-bit-sharepoint-breach-2026-07 — ~200 federal accounts compromised, servers rebuilt).
      Per AFI head Lorenz Tanner (quoted via the Keystone-SDA news agency), the intrusion occurred on the
      afternoon of 29 July 2026: two files were placed on the server, but their code was not executed — no
      account compromise and no data exfiltration were found on initial analysis. Confidential information and
      specially-protected personal data are not stored on the affected web-presence servers; the cantonal
      ePortal and specialised applications (which run on separate infrastructure) were unaffected. Tanner
      states the intrusion could involve "the same vulnerability" identified at the federal level, which he
      says affects SharePoint systems worldwide, and AFI is coordinating its investigation with the Federal
      Office for Cybersecurity (BACS). Neither the cantonal nor the federal disclosure names a specific CVE;
      the timing matches CERT-EU's advisory 2026-009 (last updated 2026-07-23), which describes an ongoing,
      actively-exploited series of on-premises Microsoft SharePoint Server RCE flaws disclosed by Microsoft
      from 14 July 2026 onward (CVE-2026-50522 plus related CVE-2026-32201/-45659/-56164/-58644) — CERT-EU's
      own advisory does not confirm this specific CVE set was used against either Swiss victim, so the link
      is plausible but unconfirmed. AFI deployed an emergency out-of-band update the evening of 5 August 2026,
      taking the cantonal website offline for several hours to close the gap.
    region_nexus: "direct — Switzerland (cantonal government, home-region core constituency); second confirmed CH public-sector SharePoint victim within 48 hours of the federal disclosure"
