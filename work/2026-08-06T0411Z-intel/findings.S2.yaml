  - title: "Canton Graubünden's public-facing SharePoint server hit by the same on-prem exploitation wave that breached the Swiss Confederation's BIT servers a day earlier"
    sources:
      - { url: "https://www.gr.ch/DE/Medien/Mitteilungen/MMStaka/2026/Seiten/20260805010805.aspx", publisher: "Canton Graubünden / Staatskanzlei (official press release)", date: "2026-08-05", role: "primary" }
