  - title: "NCSC-CH Cyber Security Hub (CSH) public dashboard API stopped serving GET requests — recipe drift on the pipeline's tier=essential bridge source"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/", publisher: "NCSC Switzerland — Cyber Security Hub", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: routine bridge invocation `python3 tools/fetch_source.py ncsc-csh recent 10` → HTTP 405 on GET https://security-hub.ncsc.admin.ch/api/posts/dashboard → confirmed via direct curl (GET and POST both return HTTP 405, Allow: DELETE, PUT) → recovered via jina reader on the SPA root https://security-hub.ncsc.admin.ch/ (renders the top-10 dashboard titles/links but not per-post dates)"
    summary: |
      This is a tooling/process note, not a threat item. `tools/fetch_source.py ncsc-csh list|post|recent` (the
      documented bridge for the tier=essential ncsc-ch-incidents-class CSH source) now receives HTTP 405 Method
      Not Allowed from `GET /api/posts/dashboard` and `GET /api/posts/{id}/details` — curl confirms the server's
      `Allow` header now advertises only `DELETE, PUT` for that path, so this is an upstream API contract change,
      not a transient block. Forcing the jina reader directly on the SPA root (https://security-hub.ncsc.admin.ch/)
      still renders the current top-10 dashboard as clickable titles + post-ID links (confirmed working), but
      without per-post publication timestamps, and hash-route URLs (#/posts/<id>) render the same dashboard
      shell rather than routing to the individual post — so full per-post body + date extraction is currently
      not achievable through any transport this agent has access to. All ten posts visible on the current
      dashboard (N-able N-central CVE-2026-18577, cPanel CVE-2026-58048, Power Pages misconfig, IBM WebSphere,
      SolarWinds Web Help Desk, Exchange XSS CVE-2026-42897, Cisco Secure FMC CVE-2026-20316, VMware VMSA-2026-0006,
      Check Point SmartConsole CVE-2026-16232, Arista VeloCloud CVE-2026-16812) were cross-checked against
      `prior_coverage.json` and are already represented by entries from 2026-07-23 through 2026-08-05 — so no
      in-window CSH item was missed by this outage, but a future run may miss a genuinely new post if the API
      stays broken and nothing pushes an older post off the top-10.
      CCN-CERT-ES note (rotation-priority source): the jina recipe (`jina https://www.ccn-cert.cni.es/en/updated-security/ccn-news.html`)
      now works and returns a full dated news listing (confirmed 2026-08-06) — this recovers the source from the
      "404 last attempt" status noted in the slice; latest item found was 28 July 2026 (STIC2026 call for speakers),
      no in-window security-incident content.
