  - title: "CHAINDROP — a new Shai-Hulud npm worm wave compromises 400+ packages (1.3B+ monthly downloads), using an Ethereum smart contract as its C2 resolver"
    sources:
      - { url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", publisher: "Elastic Security Labs", date: "2026-08-06", role: "primary" }
      - { url: "https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/", publisher: "OX Security", date: "2026-08-04", role: "corroborating" }
    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs → primary (no pivot needed), URL https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain; corroborated via ox-security, URL https://www.ox.security/blog/ → URL https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/"
    summary: |
      Elastic Security Labs documents CHAINDROP, a new self-propagating npm supply-chain worm detected 2026-08-04 after
      the maintainer of the widely-depended-on `keyv` package was compromised. The worm executes via npm `preinstall`
      lifecycle hooks, which download the Bun JavaScript runtime to execute an obfuscated ~711KB payload. That payload
      harvests over 300 credential patterns spanning AI-coding-assistant tokens (Anthropic/Claude, OpenAI/Codex,
      Cursor, Gemini), cloud-provider credentials (AWS, GCP, Azure), GitHub PATs, SSH keys, Kubernetes service-account
      tokens and HashiCorp Vault tokens, then AES-256-GCM-encrypts and RSA-wraps the harvested material before
      exfiltration. The worm component only self-propagates when the credential sweep turns up an npm token that
      carries package-write permission AND has two-factor authentication disabled for publishing (`bypass_2fa`) — it
      then republishes every reachable package under that token. The most notable mechanism change from earlier
      Shai-Hulud-family waves: CHAINDROP does not hardcode a C2 domain, instead querying an Ethereum smart contract
      (0xE1f2395ee43e45A1556EC6438a88c31B83493103) at runtime to resolve the current exfiltration endpoint, letting
      the operator rotate C2 infrastructure without shipping a new payload. Over 400 packages were compromised,
      including `keyv` (~600M downloads/month), `flat-cache` (~580M) and `cacheable-request` (~137M) — a supply-chain
      blast radius in the billions of monthly installs. Elastic ships detection rules for the preinstall-hook
      execution pattern, suspicious curl/PowerShell spawned from Node/Bun parents, anomalous DNS queries to
      crypto/DHT-adjacent services, and process-then-immediate-file-deletion sequences.
    region_nexus: "global; npm ecosystem — direct exposure for any CI/CD pipeline or developer workstation consuming the named packages, including EU/CH public-sector and supplier engineering teams"
    primary_sector_nexus: "indirect"
