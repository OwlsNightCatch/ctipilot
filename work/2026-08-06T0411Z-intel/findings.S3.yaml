  - title: "ENDLESSDOORS — twenty-plus Zbtlink router models ship from the factory with an unauthenticated root-command backdoor listening on TCP/7000"
    sources:
      - { url: "https://www.vulncheck.com/blog/zbt-endlessdoors", publisher: "VulnCheck", date: "2026-08-05", role: "primary" }
    discovery_trace: "first seen at: vulncheck, URL https://www.vulncheck.com/blog → primary (no pivot needed), URL https://www.vulncheck.com/blog/zbt-endlessdoors"
    summary: |
      VulnCheck documents ENDLESSDOORS, a pre-installed remote-access implant shipped by default on more than twenty
      Zbtlink (Shenzhen Zhibotong Electronics) router/CPE models sold on Amazon and other e-commerce platforms,
      including rebrands sold under the Wiflyer name. The implant is a customized build of the open-source rctl
      ("remote control linux") tool, started at boot by the vendor's own init script and masquerading as a kernel
      thread named "kworker" (with an on-disk unbracketed process name as the detection tell) to blend into normal
      process listings. It phones home over TCP/7000 to hardcoded C2 hosts (zbtctl.epplink[.]net and
      rbdg4nzqadui.wikaba[.]com), sending an unauthenticated 39-byte "hello" containing a device-class label and the
      device's MAC address; the C2 protocol has no handshake, key exchange or negotiation of any kind, and whatever
      command the server sends afterward is passed straight to popen() and executed as uid 0. A secondary command
      spins up an interactive reverse shell on TCP/7001. VulnCheck stresses this is not a memory-corruption bug in a
      protocol parser — it is a vendor-shipped component, started by the vendor's own init script, present across the
      vendor's full product line (CVE-2026-66747 assigned). Because the backdoor is architectural rather than a
      patchable flaw, VulnCheck recommends replacing affected devices rather than waiting on a fix; detection options
      given are host-level (the unbracketed "kworker" process name, on-disk artifacts at /usr/sbin/kworker and
      /etc/init.d/skworker) and network-level (blocking the two named C2 domains and flagging unsolicited TCP/7000
      and TCP/7001 traffic to/from consumer CPE devices).
    region_nexus: "global consumer/SMB router supply chain; relevant to any EU/CH public-sector or SME network using cheap rebranded CPE/router hardware at branch offices or as home-office equipment"
    primary_sector_nexus: "indirect"
    sector: "telco, public-sector"
