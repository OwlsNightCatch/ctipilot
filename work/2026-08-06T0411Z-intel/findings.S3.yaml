      Not the same campaign as the previously-covered "Mini Shai-Hulud"/TeamPCP copycat wave (campaign:mini-shai-hulud) —
      Elastic explicitly frames CHAINDROP as a new wave of the original Shai-Hulud worm lineage, distinct from the
      TeamPCP-attributed derivative wave already tracked in the registry. Proposed as its own campaign entity above;
