  - title: "LiteLLM AI-gateway callback hooks let a post-compromise attacker forge tool calls after model inference — bypassing every prompt-level defense"
    sources:
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-callback-hook-hijacking-20260805-c/", publisher: "Cloud Security Alliance — Lab Space", date: "2026-08-05", role: "primary" }
      - { url: "https://embracethered.com/blog/posts/2026/hijacking-litellm-for-fun-and-profit/", publisher: "Embrace The Red (Johann Rehberger / wunderwuzzi)", date: "2026-08-03", role: "primary" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ → primary: CSA research note, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-callback-hook-hijacking-20260805-c/ → original technique disclosure: embracethered.com, URL https://embracethered.com/blog/posts/2026/hijacking-litellm-for-fun-and-profit/"
    summary: |
      Researcher Johann Rehberger (wunderwuzzi, Embrace The Red) and a follow-on Cloud Security Alliance research note
      document a post-compromise technique against LiteLLM, a widely deployed open-source AI gateway that fronts
      OpenAI, Anthropic, Google Gemini and AWS Bedrock model calls for many organizations' AI-agent deployments. An
      attacker who already holds admin access to a LiteLLM proxy (via a prior CVE chain, supply-chain compromise, or
      leaked LITELLM_MASTER_KEY/proxy-admin credential) uses the legitimate `/model/update` management API to change
      a model's `api_base` and `use_litellm_proxy` settings, silently rerouting all traffic for that model through an
      attacker-controlled relay and exposing the encrypted provider API keys that resolve at request time. Once
      rerouted, the attacker's relay abuses LiteLLM's own callback-hook system — specifically
      `async_post_call_success_hook` and `async_post_call_streaming_iterator_hook` — to inject arbitrary text or
      forge tool calls into the model's response after inference has already completed, which defeats prompt-level
      defenses entirely because the manipulation happens downstream of the model. A capable attacker reverts the
      rerouted configuration once finished, removing the most visible artifact of the compromise. Detection requires
      audit logging of all `/model/update` and other management-API configuration changes and alerting on unexpected
      `api_base` values; hardening calls for treating LiteLLM gateway-admin credentials as Tier-0 infrastructure
      secrets (vault-backed, rotated, egress-restricted) rather than ordinary application config.
    region_nexus: "global; any organisation running a self-hosted LiteLLM AI gateway to front OpenAI/Anthropic/Gemini/Bedrock calls for internal AI-agent tooling"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
