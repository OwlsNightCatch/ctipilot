  - title: "Cl0p's PTC Windchill/FlexPLM extortion campaign (CVE-2026-12569) moves from threat emails to mass leak-site publication — dozens of victims posted in a single batch"
    sources:
      - { url: "https://api.ransomware.live/v2/groupvictims/clop", publisher: "Ransomware.live (leak-site observatory)", date: "2026-08-05", role: "primary" }
      - { url: "https://ransom-isac.org/blog/clop-windchill-flexplm-exploitation/", publisher: "Ransom-ISAC / eCrime.ch / DEFUSED Unified Threat Advisory", date: "2026-07-27", role: "background" }
    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/recentvictims → primary: ransomware.live group-victims feed for Cl0p, URL https://api.ransomware.live/v2/groupvictims/clop → background: Ransom-ISAC Unified Threat Advisory, URL https://ransom-isac.org/blog/clop-windchill-flexplm-exploitation/"
    summary: |
      This pipeline's 2026-07-27 coverage of the Cl0p-affiliated exploitation of PTC Windchill PDMLink and FlexPLM (CVE-2026-12569, an unauthenticated deserialization RCE chained from a pre-auth FlexPLM WSDL information-disclosure endpoint into the Windchill login servlet) reported that the extortion phase was email-only, with subject line "Windchill PDMLink module serious data leak" sent to hundreds of staff per victim, and no victims yet named on Cl0p's leak site. That changed on 2026-08-05: the ransomware.live leak-site observatory recorded a burst of 15+ new Cl0p victim listings between 20:53 and 21:01 UTC, each tagged with CVE-2026-12569 and an itemised exfiltrated-data manifest (engineering "Project" files, CAD files, DBF/SQL databases, backups, software installers) — the classic Cl0p mass-disclosure pattern last seen at this scale in the 2023 MOVEit and 2024 Oracle EBS campaigns. Victim identities in the public feed are partially redacted and none is independently confirmed in named journalism as of this writing, so no victim is named here; the defender-relevant fact is the campaign trajectory, not any specific victim. PTC Windchill and FlexPLM are widely deployed product-lifecycle-management platforms in manufacturing, automotive, aerospace and industrial-engineering environments — sectors with substantial EU/CH footprint — and any internet-exposed, unpatched instance that was reachable before the June 2026 patch is now in the window where stolen data may already be published rather than merely threatened.
    region_nexus: "global manufacturing/engineering/aerospace PLM deployments, including EU industrial base; no specific victim country confirmed in this reporting window"
    primary_sector_nexus: "indirect — manufacturing/industrial-engineering IP theft with EU exposure via PTC Windchill/FlexPLM's install base, transferable to any org running the affected platform"
    sector: "manufacturing, industrial engineering"
    cves: ["CVE-2026-12569"]
    techniques: [T1190, T1505.003, T1567]
    affected_products: ["PTC Windchill PDMLink", "PTC FlexPLM"]
    entity_keys: ["actor:clop", "campaign:clop-windchill-flexplm-extortion-2026"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-07-27/clop-windchill-flexplm-mass-extortion-wave-cve-2026-12569"
    evidence:
      - quote: "[CVE-2026-12569] Data exfiltrated included the following: Database, Projects, Backups, Logs, Soft installers, PDF, TXT, XML - files"
        attribution: "Ransomware.live (Cl0p leak-site scrape)"
        source_url: "https://api.ransomware.live/v2/groupvictims/clop"
      - quote: "Attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet, enabling unauthenticated remote code execution and deployment of hex-named JSP webshells under `/Windchill/login/`."
        attribution: "Ransom-ISAC / eCrime.ch / DEFUSED Unified Threat Advisory"
        source_url: "https://ransom-isac.org/blog/clop-windchill-flexplm-exploitation/"
    extended_notes: |
      Hunt path from the Ransom-ISAC advisory: JSP webshells matching `/Windchill/login/[0-9a-f]{16}.jsp`; pre-attack recon signature `GET /Windchill/rfa/jsp/login/*.jsp?wsdl` returning response_bytes=4045; malicious header `X-windchill-req: ?x8Fmgow`. No IOC hashes/IPs are carried into this finding per pipeline policy — cited here only to point defenders at the advisory for their own hunt. Verification is SINGLE-SOURCE-OTHER because the specific 2026-08-05 mass-listing batch is corroborated only by the ransomware.live scrape of Cl0p's own leak site (a direct observation of the primary artifact, not a claim requiring third-party confirmation) rather than independent journalism; the broader campaign and CVE are well multi-sourced from prior coverage.
