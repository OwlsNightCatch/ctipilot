    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/ → pivot: SecurityWeek, URL https://www.securityweek.com/water-sector-cyberattacks-reportedly-hit-at-least-12-states/ → primary: The Record, URL https://therecord.media/iran-cyberattacks-water-treatment → corroborating: CBS News Atlanta / FOX 5 Atlanta on the Clayton County Water Authority (CCWA) disruption"
    summary: |
      The water/wastewater-sector PLC-lockout campaign this pipeline has tracked since 2026-07-29 (Minnesota, then a seven-state FBI/EPA confirmation on 2026-08-01) escalated in-window: SecurityWeek and The Record report (2026-08-05, citing ABC News) that at least 12 US states have now seen incidents, with South Dakota (Rapid City) and Georgia newly confirmed alongside Minnesota and Michigan. The material new development is the first confirmed consumer-facing operational impact: Clayton County Water Authority (CCWA), Georgia, confirmed a cyber incident on Monday 2026-07-27 that caused water-pressure drops in north Clayton County; the authority issued a precautionary boil-water advisory (later cancelled once water-quality testing cleared) and restored service within hours. CCWA said hackers did not access billing/payment systems. The underlying TTP is unchanged and CVE-free: actors reach internet-connected PLCs directly, change administrator passwords to lock out legitimate operators, and manipulate the data shown on HMI/SCADA displays so the true device state is hidden — the same mechanism the pipeline's 2026-08-01 coverage tied to a Censys scan finding 4,117 internet-exposed Siemens S7-1200 units, 86% concentrated in Greece, Spain, Italy and Austria via mobile-carrier connectivity. No federal agency has publicly attributed the Clayton County incident specifically to Iran, though multiple outlets note the pattern matches the Iran-affiliated campaign described in the April/July-updated joint CISA/FBI/EPA advisory (AA26-097A).
    region_nexus: "US-centred campaign; the pipeline's own 2026-08-01 coverage already quantified matching European PLC exposure (Greece, Spain, Italy, Austria) — directly transferable to EU/CH water-sector defenders"
