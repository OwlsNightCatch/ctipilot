items:
  - title: "Snowflake mass-extortion actor pleads guilty: stolen SaaS credentials (no MFA) turned into a 165-victim, billions-of-records extortion campaign, including Santander"
    sources:
      - { url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers", publisher: "US DOJ Office of Public Affairs", date: "2026-08-05", role: "primary" }
      - { url: "https://therecord.media/guilty-plea-snowflake-hack-connor-riley-moucka", publisher: "The Record (Recorded Future News)", date: "2026-08-05", role: "corroborating" }
      - { url: "https://www.cbc.ca/news/canada/kitchener-waterloo/snowflake-data-breach-case-canadian-hacker-pleads-guilty-9.7297780", publisher: "CBC News", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ → primary: US DOJ Office of Public Affairs, URL https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers"
    summary: |
      Connor Riley Moucka (aliases Waifu, Judische, Catist, Ellyel8), 26, of Kitchener, Ontario, pleaded guilty on 2026-08-05 in the US District Court for the Western District of Washington to computer fraud, wire fraud, aggravated identity theft and a related conspiracy, over what DOJ describes as a 165-victim intrusion campaign. Between February and October 2024 Moucka and co-conspirators used stolen login credentials — no exploit, no zero-day — to reach cloud-hosted customer environments on a SaaS platform (Snowflake) that at the time did not enforce MFA by default, and downloaded terabytes of data including call/text metadata, banking and payroll records, DEA registration numbers, driver's-licence and passport numbers and SSNs. Named victims across public reporting include AT&T, Ticketmaster, Advance Auto Parts, Neiman Marcus, LendingTree and Santander (the Spanish/UK banking group — the direct European nexus). Moucka personally netted at least $495,000 and re-extorted one victim using a government official's stolen data; DOJ puts victim-company losses at $9.5M+ and downstream individual exposure at 100M+ people. Sentencing is 2026-10-27; he faces a 2-year mandatory minimum on the identity-theft count and up to 30 years on the rest. The transferable lesson for defenders is unchanged from the original 2024 campaign: any SaaS/cloud-data-platform tenant without enforced MFA on every account is exposed to exactly this playbook — credential-stuffing or infostealer-log credentials reused against a platform with no default MFA, no IP allowlisting and no anomalous-access alerting.
    region_nexus: "US-centred prosecution; victim set includes Santander (Spain/UK) — direct European financial-sector nexus"
    primary_sector_nexus: "indirect — finance-sector victim (Santander) inside a global SaaS mass-breach; transferable lesson is the SaaS/cloud-credential exposure model relevant to any public-sector or CI tenant of a shared data platform"
    sector: "finance, telco, retail, public-sector (cloud-tenant exposure)"
    cves: []
    techniques: [T1078.004, T1552, T1567]
    affected_products: ["Snowflake"]
    entity_keys: []
    new_entities:
      - { key: "actor:unc5537-snowflake-extortion", type: actor, name: "UNC5537 / Snowflake mass-extortion cluster", aliases: ["Waifu", "Judische", "Catist", "Ellyel8", "Connor Riley Moucka"], summary: "Financially-motivated cluster (Mandiant designation UNC5537) that used stolen customer credentials — sourced from infostealer logs, not a platform vulnerability — to compromise ~165 Snowflake customer environments Feb–Oct 2024, exfiltrating billions of records and extorting victims for millions; principal member Connor Riley Moucka pleaded guilty 2026-08-05 (DOJ)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Connor Riley Moucka, 26, of Kitchener, Ontario, pleaded guilty today to a widespread computer hacking conspiracy that resulted in the compromise of over 165 victim organizations, the theft of billions of sensitive customer records and the extortion of numerous victims."
        attribution: "US DOJ Office of Public Affairs"
        source_url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers"
      - quote: "between February and October 2024, Moucka and his co-conspirators used stolen login credentials to compromise cloud-hosted data belonging to at least 165 customers of a U.S.-based software-as-a-service company"
        attribution: "US DOJ Office of Public Affairs"
        source_url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers"
      - quote: "victim companies suffering over $9.5 million in actual losses — a number that does not include losses suffered by the companies' customers, totaling at least 100 million individuals"
        attribution: "US DOJ Office of Public Affairs"
        source_url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers"
    extended_notes: |
      DOJ names BreachForums, Exploit.in, XSS.is and Telegram as the sale/advertisement channels for the stolen data. Prosecution is part of the FBI's "Operation Riptide". No CVE is involved — this was pure credential abuse against a platform lacking default MFA enforcement at the time (Snowflake has since made MFA mandatory for all accounts). Worth a watch-item for defenders auditing any SaaS data-platform tenancy (Snowflake, Databricks, BigQuery, etc.) for default MFA/IP-allowlisting posture.

