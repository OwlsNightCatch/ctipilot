  - title: "HPE Aruba Networking SD-WAN Orchestrator — unauthenticated REST API auth bypass (CVSS 9.8), 9.6.x branch only"
    sources:
      - { url: "https://csaf.arubanetworking.hpe.com/2026/hpe_aruba_networking_-_hpesbnw05100.txt", publisher: "HPE Aruba Networking (vendor PSIRT, HPESBNW05100)", date: "2026-08-04", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0969/", publisher: "CERT-FR", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (CERTFR-2026-AVI-0969, 2026-08-05) → primary: HPE Aruba PSIRT advisory HPESBNW05100, URL https://csaf.arubanetworking.hpe.com/2026/hpe_aruba_networking_-_hpesbnw05100.txt"
    summary: |
      HPE Aruba Networking published advisory HPESBNW05100 (2026-08-04, republished by CERT-FR 2026-08-05) for two vulnerabilities in the REST API interface of SD-WAN Orchestrator's 9.6.x software branch: CVE-2026-63455 and CVE-2026-63456, both CVSS v3.1 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), described as authentication bypass via spoofed HTTP headers that lets an unauthenticated remote attacker bypass web authentication mechanisms and view/modify potentially sensitive system information. Affected: SD-WAN Orchestrator 9.6.2.x builds 9.6.2.40208 and below, and 9.6.3.x builds 9.6.3.40137 and below; no branches outside 9.6.x.x are affected. Fixed in 9.6.2.40210+, 9.6.3.40140+, or by moving to the 9.7.0.43264+ branch. Both were reported through HPE Aruba's bug-bounty program; the vendor states it is "not aware of any public discussion or exploit code targeting these specific vulnerabilities as of the release date." HPE Aruba's recommended interim mitigation is to restrict CLI and web-management interfaces to a dedicated Layer-2 segment/VLAN and/or Layer-3+ firewall policy, with IP allow-listing for local users and API keys — i.e., the Orchestrator management plane should never be internet-reachable. This lands in the same window as the confirmed-exploited Arista VeloCloud Orchestrator command-injection zero-day (CVE-2026-16812, already covered) and the ongoing CISA Emergency Directive posture on Cisco SD-WAN, reinforcing SD-WAN/WAN-orchestration management planes as a recurring, currently hot target class for defenders to prioritize exposure-checking over patch-cycle timing alone.
