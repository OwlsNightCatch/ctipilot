  - title: "cPanel & WHM — database-rename privilege escalation to database root (CVE-2026-58048) plus HTTP request smuggling in cpsrvd (CVE-2026-58047)"
    sources:
      - { url: "https://support.cpanel.net/hc/en-us/articles/42285745783703-Security-CVE-2026-58048-Database-Privilege-Escalation", publisher: "cPanel/WebPros (vendor PSIRT)", date: "2026-08-04", role: "primary" }
      - { url: "https://support.cpanel.net/hc/en-us/articles/42285024734743-Security-CVE-2026-58047-HTTP-Request-Smuggling", publisher: "cPanel/WebPros (vendor PSIRT)", date: "2026-08-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/new-cpanel-critical-flaw-could-let.html", publisher: "The Hacker News", date: "2026-08-04", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/ (jina-hydrated dashboard listing, post 12827 'cPanel: Database Privilege Escalation (CVE-2026-58048)') → pivot: WebSearch (\"CVE-2026-58048 cPanel WHM database privilege escalation\") → pivot: The Hacker News, URL https://thehackernews.com/2026/08/new-cpanel-critical-flaw-could-let.html → primary: cPanel/WebPros vendor advisory, URL https://support.cpanel.net/hc/en-us/articles/42285745783703-Security-CVE-2026-58048-Database-Privilege-Escalation and https://support.cpanel.net/hc/en-us/articles/42285024734743-Security-CVE-2026-58047-HTTP-Request-Smuggling"
    summary: |
      WebPros' 2026-08-04 cPanel & WHM security release, which the Swiss NCSC Security Hub flagged on its public dashboard, fixes CVE-2026-58048 (CVSS v4.0 9.4 per NVD/CISA enrichment): the database-rename operation in cPanel's MySQL/MariaDB management feature does not preserve SQL mode across the rename, so an authenticated cPanel account holder who merely has the "MySQL" feature enabled can have SQL execute in root database context — granting full database-administrator privileges, and on some OS/database-engine configurations extending to operating-system-level compromise. The same release fixes CVE-2026-58047, an HTTP request-smuggling flaw in the cpsrvd web server that, "under limited conditions," lets an unauthenticated remote attacker manipulate responses delivered to other users on the same server. Both are fixed in cPanel/WHM builds 11.110.0.137 / 11.118.0.71 / 11.126.0.78 / 11.134.0.48 / 11.136.0.32, and WP Squared 138.1.6. Neither is confirmed exploited (CISA's 2026-08-04 vulnrichment enrichment recorded CVE-2026-58048 as "Exploitation: none," non-automatable, with total technical impact). Vendor-documented interim mitigations exist for both: revoke the "MySQL" feature from cPanel users who don't need it (blocks CVE-2026-58048 exploitation without disabling existing databases), and set `cpsrvd_keepalives_disabled=1` in `/var/cpanel/cpanel.config` plus restart cpsrvd to force a new TCP+TLS connection per request on ports 2083/2087/2096 (blocks CVE-2026-58047, at a latency/CPU cost). cPanel & WHM underpins a large share of shared/reseller web hosting, including hosting used by cantonal, communal and SME-adjacent public-sector web presences in the region.
    region_nexus: "global; cPanel/WHM is common at hosting providers serving Swiss/EU municipal and SME public-sector web properties — flagged directly by NCSC-CH's own Security Hub"
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco"
    cves: [CVE-2026-58048, CVE-2026-58047]
    techniques: [T1068, T1190]
