    borderline_reason: "authenticated-prerequisite vulnerability in third-party hosting-control-panel software (CVE-2026-58048); included because NCSC-CH's own Security Hub surfaced it and cPanel underpins hosting-provider infrastructure in the region, but it is one step removed from direct Swiss/EU public-sector or CI operation."

