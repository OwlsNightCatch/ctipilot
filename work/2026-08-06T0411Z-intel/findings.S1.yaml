      Coverage gap noted: the NCSC-CH Security Hub bridge (`ncsc-csh list`/`post`) is currently broken — the documented `/api/posts/dashboard` endpoint returns HTTP 405 and `/api/posts/{id}/details` returns 404 for every id tried. The jina reader against the SPA root does hydrate a 10-item title+summary listing (no full body, no dates) as a partial fallback; used it to confirm TeamCity/CVE-2026-63077 does not yet appear on the NCSC-CH dashboard as of this run and to sweep for other in-window CH-relevant items (see cPanel item below, discovered via this fallback). Recommend the main agent log a recipe-check task for `tools/fetch_source.py`'s ncsc-csh endpoints.

  - title: "Veeam Service Provider Console and Veeam ONE — ten CVEs including a CVSS v4.0 10.0 unauthenticated RCE on the ONE monitoring agent"
    sources:
      - { url: "https://www.veeam.com/kb4893", publisher: "Veeam (vendor PSIRT, KB4893)", date: "2026-08-04", role: "primary" }
      - { url: "https://www.veeam.com/kb4892", publisher: "Veeam (vendor PSIRT, KB4892)", date: "2026-08-04", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0968/", publisher: "CERT-FR", date: "2026-08-05", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0276", publisher: "NCSC-NL", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0276, 2026-08-05) → pivot: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (CERTFR-2026-AVI-0968, 2026-08-05) → primary: Veeam KB4893, URL https://www.veeam.com/kb4893 → primary: Veeam KB4892 (Veeam ONE), URL https://www.veeam.com/kb4892"
    summary: |
      Veeam's 2026-08-04 security release (published 2026-08-05 by NCSC-NL/CERT-FR) fixes ten CVEs across two widely co-deployed products. In Veeam Service Provider Console (SPC) 9.2.1.33875 and all earlier v9 builds: CVE-2026-58073 (CVSS v4.0 9.5) lets an unauthenticated attacker impersonate a managed agent and obtain that agent's credentials; CVE-2026-58072 (CVSS v4.0 9.0) allows arbitrary file write on the management server leading to remote code execution; CVE-2026-58067 (CVSS v4.0 8.7) lets an unauthenticated attacker exhaust host memory for denial of service; and CVE-2026-58071 (CVSS v4.0 8.2) allows an unauthenticated attacker to reach the proxied appliance API with Portal Administrator privileges during a short window after an admin session begins. All four are fixed in SPC 9.3.0.35057. In Veeam ONE 13.0.2.6723 and all earlier v13 builds, the standout flaw is CVE-2026-64633 (CVSS v4.0 10.0) — unauthenticated remote code execution on the Veeam ONE agent host, no privileges or user interaction required; sibling flaws include CVE-2026-58075 (8.7, unauthenticated arbitrary file read enabling local privilege escalation), CVE-2026-58074 (8.6, high-privileged-user arbitrary code execution), CVE-2026-64631 (8.6, low-privileged SQL injection extracting database contents), CVE-2026-64634 (8.4, local privilege escalation to the Reporter service context) and CVE-2026-64630 (5.3, IDOR retrieving report data outside a shared link's scope). All are fixed in Veeam ONE 13.1.0.7034. Most were reported through Veeam's HackerOne bug-bounty program; Veeam reports no in-the-wild exploitation. Veeam's own advisory text flags the operationally relevant pattern explicitly: "once a vulnerability and its associated patch are disclosed, attackers will likely attempt to reverse-engineer the patch to exploit unpatched deployments" — a caution with precedent, given Veeam Backup & Replication's CVE-2023-27532 was mass-exploited by ransomware affiliates post-disclosure, and Veeam SPC/ONE are typically deployed by managed-service providers and enterprises specifically to protect backup infrastructure that is itself the target of ransomware pre-encryption sabotage.
    region_nexus: "global; Veeam SPC/ONE are widely run by MSPs and enterprises serving Swiss/EU public-sector and critical-infrastructure backup estates"
