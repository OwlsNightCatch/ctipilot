items:
  - title: "CVE-2026-63077 — JetBrains TeamCity On-Premises RCE moves to confirmed active exploitation (CISA KEV addition, 2026-08-05)"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/05/cisa-adds-one-known-exploited-vulnerability-catalog", publisher: "CISA", date: "2026-08-05", role: "primary" }
      - { url: "https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/", publisher: "JetBrains (vendor PSIRT)", date: "2026-07-27", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (dateAdded 2026-08-05 for CVE-2026-63077) → primary: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/08/05/cisa-adds-one-known-exploited-vulnerability-catalog → corroborating: vendor advisory, URL https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/ (unchanged since 2026-07-27, still states no known exploitation at disclosure time) → corroboration attempt: ENISA EUVD record EUVD-2026-49369 independently shows exploitedSince 2026-08-05, but its human-readable detail page (https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-49369) returned an 'Application Unavailable' shell on both WebFetch and the jina reader today, so it is not cited as a Source (site outage, not a content gap) — flagged as a coverage note below."
    summary: |
      CISA added CVE-2026-63077 to its Known Exploited Vulnerabilities catalog on 2026-08-05, "based on evidence of active exploitation" of JetBrains TeamCity On-Premises, with a compressed three-business-day federal remediation deadline (2026-08-08) under BOD 26-04. This reverses the exploitation assessment at disclosure: when JetBrains published the advisory on 2026-07-27 it stated it had checked TeamCity Cloud for exploitation attempts and found none, and was "not aware of any active exploitation of this vulnerability" at that time — the JetBrains post itself has not been updated since. The underlying flaw is an unauthenticated deserialization-of-untrusted-data vulnerability reachable through the TeamCity agent-polling protocol: an attacker with only HTTP(S) access to a TeamCity server can bypass authentication checks and execute arbitrary OS commands as the TeamCity server process, on every version of TeamCity On-Premises ever shipped (fixed in 2025.11.7 / 2026.1.3, with a security-patch plugin available down to 2017.1 for estates that cannot upgrade immediately; TeamCity Cloud is unaffected). Neither CISA's alert nor the KEV catalog entry names an exploiting cluster or the observed intrusion vector, and ENISA's EUVD independently records exploitedSince 2026-08-05 in its machine-readable record though its human detail page is currently down. For defenders, the practical delta is that any internet-reachable TeamCity On-Premises instance that was not patched before 2026-08-05 must now be treated as a suspected-compromise target rather than a patch-now item — a build-server compromise carries source-code, artifact-signing and downstream supply-chain blast radius, and this product class (TeamCity) has a track record of being mass-exploited on an earlier flaw (CVE-2024-27198).
    region_nexus: "global; CI/CD build infrastructure is widely deployed across Swiss/EU public-sector and enterprise software-delivery pipelines"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
