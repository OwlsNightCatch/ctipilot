      pivot: cash.ch, URL https://www.cash.ch/news/mehrere-kantone-vermuten-missbrauch-von-fahrzeughalterdaten-964337
      → pivot: derbund.ch, URL https://www.derbund.ch/eautoindex-fuenf-kantone-vermuten-datenmissbrauch-653056770416
      → pivot: WebSearch ("vd.ch communiqué eAutoIndex Viacar cantons vaud aargau") → watson.ch, URL https://www.watson.ch/fr/!908053274
      → primary detail on the Valais "ecari" platform: Blick, URL https://www.blick.ch/fr/suisse/romande/tentatives-de-chantage-les-donnees-personnelles-dautomobilistes-vaudois-et-valaisans-ont-fuite-id22217676.html
    summary: |
      On 2026-08-28 five Swiss cantons (Vaud, Aargau, Lucerne, Schaffhausen, Zug) and canton
      Valais separately jointly disclosed that an unknown party had, in mid-August, automatically
      harvested vehicle-owner data at scale from their public online lookup services. For the
      five-canton group the vector was "eAutoIndex", a shared lookup platform built on the Viacar
      AG standard software (Viacar AG, based in Aarau, operates/maintains it for multiple cantonal
      road-traffic offices); per the joint statement, "the retrieval of the data occurred, according
      to current findings, via a technical interface that exclusively permitted access to publicly
      viewable data" and the actor bypassed the service's built-in anti-abuse control — the
      statement is explicit that normally "the number of queries on 'eAutoIndex' per person and per
      day is limited to five" (translated from German). Canton officials characterise this as abuse
      of a legitimate public-disclosure mechanism rather than a conventional data breach: no
      authentication was bypassed and no data that owners had opted to block from public disclosure
      was exposed — only registration-plate numbers plus the associated owner's name and address,
      which Swiss federal road-traffic law (VZV) already makes publicly disclosable on request.
      Canton Valais reported a second, separate incident on the same day affecting "ecari", a
      different vehicle-lookup module supplied by an external partner to its cantonal road-traffic
      and navigation service; there, "through additional extractions, the hacker was also able to
      access approximate date-of-birth data that is not normally accessible via an ordinary query"
      (translated from French) — a materially more sensitive field than the plate/name/address set
      exposed via eAutoIndex, obtained by going beyond the intended query logic of the lookup
      interface rather than merely repeating the same query at volume. Both the eAutoIndex operator
      (Viacar AG) and the canton of Vaud state they were subject to extortion attempts following the
      harvesting, which they did not act on. All affected cantons have filed or plan to file criminal
      complaints; Viacar AG has introduced additional technical access restrictions on eAutoIndex and
      is evaluating further controls, and Valais states it has hardened access security on the
      affected system. Neither the identity nor the number of actors involved is known, and no
      exploitation of the underlying road-traffic-office IT systems (as opposed to the public lookup
      interfaces) is reported.
