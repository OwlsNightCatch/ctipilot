      the control-bypass mechanism, the multi-cantonal government scope, the extortion attempts,
      and the more sensitive Valais birthdate field, not on the sensitivity of the eAutoIndex data
      itself.

  - title: >
      Finland's NCSC-FI (Traficom) publishes an operational CRA reporting checklist as the
      11 September 2026 mandatory-reporting deadline nears — 24h/72h/14-day/1-month notification
      clock detailed
    sources:
      - { url: "https://www.kyberturvallisuuskeskus.fi/en/news/manufacturers-prepare-advance-reporting-vulnerabilities-and-incidents-under-cyber-resilience-act", publisher: "NCSC-FI / Traficom (Finnish Transport and Communications Agency)", date: "2026-08-28", role: primary }
      - { url: "https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp", publisher: "ENISA — Single Reporting Platform (SRP)", date: "2026-08-14", role: corroborating }
      - { url: "https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation", publisher: "European Commission — Shaping Europe's Digital Future", date: "2026-07-27", role: corroborating }
    discovery_trace: >
      first seen at: DCOD.ch CERT-aggregator sweep, URL https://dcod.ch/communiques-cert/ →
      primary: NCSC-FI/Traficom, URL https://www.kyberturvallisuuskeskus.fi/en/news/manufacturers-prepare-advance-reporting-vulnerabilities-and-incidents-under-cyber-resilience-act
      → corroboration: ENISA SRP page, URL https://www.enisa.europa.eu/topics/product-security/single-reporting-platform-srp
      → corroboration: European Commission guidance page (already cited by the prior entry), URL https://digital-strategy.ec.europa.eu/en/library/commission-publishes-new-guidance-support-timely-cyber-resilience-act-implementation
    summary: |
      This store already tracks the EU Cyber Resilience Act's 11 September 2026 reporting-obligation
      deadline (Commission scope guidance on 2026-07-27; ETSI harmonised-standards drafting on
      2026-08-13); the previously logged entry explicitly noted it could not yet state the concrete
      notification-clock deadlines. On 2026-08-28, with two weeks left before the obligations bind,
      Finland's national cybersecurity authority (NCSC-FI, part of Traficom) published a manufacturer
      checklist that supplies exactly that missing operational detail. Per the CRA, manufacturers of
      "products with digital elements" placed on the EU market must submit an early warning of an
      actively exploited vulnerability or a severe incident within 24 hours of becoming aware of it;
      the notification must be supplemented within 72 hours; for a vulnerability the final report is
      due within 14 days after a corrective or mitigating measure becomes available; for a severe
      incident the final report is due within one month of the incident notification. All notifications
      go through ENISA's centralised Single Reporting Platform (SRP), which itself only becomes live
      on 2026-09-11 — the same date the reporting duty starts to apply. NCSC-FI's checklist directs
      manufacturers to identify in-scope products now, appoint a primary and backup "Assigned
      Representative" (AR) authorised to submit SRP notifications (API-based submission is not
      expected until spring 2027 — until then, only the two named representatives can file), document
      an internal report-intake and triage process, and rehearse it at least once before the first
      reportable case. ENISA's own SRP page confirms the 11 September 2026 go-live and that the
      platform will be used by both CSIRTs and manufacturers for mandatory reporting and by any
      natural or legal person for voluntary reporting.
    region_nexus: "europe — EU-wide regulatory deadline with direct effect on manufacturers placing connected products on the EU market"
