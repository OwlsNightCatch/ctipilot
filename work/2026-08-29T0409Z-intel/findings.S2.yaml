  - title: >
      Unknown actor bypasses per-person rate limits on Swiss cantonal vehicle-registry
      lookup portals (eAutoIndex, ecari) to bulk-harvest owner data across six cantons —
      extortion attempts follow against the operator and canton Vaud
    sources:
