    extended_notes: |
      This closes the gap the existing entry's sourcing_note flagged ("this entry deliberately does
      NOT state the 24-hour actively-exploited-vulnerability notification window ... neither cited
      source carries either"). Notifications are expected to be possible via API only from spring
      2027 — until then only the two registered Assigned Representatives per manufacturer can file,
      which is an operational bottleneck worth flagging to any in-scope supplier. NCSC-FI is a
      national authority acting as primary discloser for its own jurisdiction's implementation
      guidance (Admiralty A-tier), and the substance (deadlines, SRP mechanics) is independently
      confirmed by ENISA's own SRP page.
