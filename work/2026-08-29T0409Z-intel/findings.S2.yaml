    extended_notes: |
      Named official on the Valais side: Bruno Abgottspon, head of the Service de la circulation
      routière et de la navigation, quoted via Keystone-ATS cautioning that the harvested
      approximate birthdates "are not necessarily correct" and framing the priority as public
      awareness of potential downstream phishing/fraud use rather than a systems compromise (the
      road-traffic office's own operating systems and the canton's core IT were not affected, per
      the same official). No source names a specific bypass technique (e.g. IP rotation, missing
      server-side session/device fingerprinting, distributed request sourcing) — only that
      "protection mechanisms limiting the number of requests" were circumvented at volume; a
      genuine unknown worth flagging for any defender operating a similar public per-identity
      rate-limited lookup service. Fraud framing given by the cantons: attackers or downstream
      buyers of the harvested plate/name/address/approximate-DOB combination could send
      deceptively authentic-looking demands for fake fines, vehicle-inspection fees or foreign toll
      charges. Swiss residents can have their own vehicle-registration data blocked from public
      disclosure free of charge via their cantonal road-traffic office.
    borderline: true
    borderline_reason: >
