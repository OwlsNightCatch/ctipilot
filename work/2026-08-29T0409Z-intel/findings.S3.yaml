    extended_notes: |
      Sourcing note: VulnCheck is the sole discloser of DARKLANTERN/SPEAKINGSTONE (as it was for ENDLESSDOORS);
      heise's 2026-08-28 article is journalism relaying VulnCheck's research rather than independent technical
      corroboration, so this remains single-source per the existing entry's own sourcing convention. Suggested
      body detection concept: an unsolicited outbound registration from consumer-class CPE to a fixed external
      host on UDP/10000, or an inbound-accepted UDP session on 9992/8897 from an internet-routable source, is not
      traffic ordinary router firmware generates — egress/ingress telemetry at the site boundary surfaces this
      even for an unmanaged device. Triage: routers legitimately make outbound connections for firmware checks,
      NTP and vendor telemetry, so outbound-from-CPE alone is not a discriminator; the tell is a long-lived,
      bidirectional command-carrying UDP channel to a fixed vendor-independent host on a non-standard port, or an
      unauthenticated response to a 19-byte probe on UDP/9992.

  - title: "German mobile carriers leaked callees' IMEI, device model and OS version to callers during call setup — GSMA confirmed the flaw and warned 1,000+ member operators worldwide"
    sources:
      - { url: "https://www.br.de/nachrichten/deutschland-welt/sicherheitsluecke-mobilfunknetze-verrieten-sensible-handydaten,VTPFtd7", publisher: "Bayerischer Rundfunk (BR24)", date: "2026-08-27", role: primary }
      - { url: "https://www.heise.de/news/Mobilfunk-IMEI-Kennungen-gelangten-beim-Rufaufbau-unbemerkt-zu-Anrufern-11427013.html", publisher: "heise Security", date: "2026-08-27", role: corroborating }
    discovery_trace: >
      first seen at: heise-sec (S3 essential source), URL https://www.heise.de/security/feed.xml
      → article https://www.heise.de/news/Mobilfunk-IMEI-Kennungen-gelangten-beim-Rufaufbau-unbemerkt-zu-Anrufern-11427013.html
      → primary: Bayerischer Rundfunk (BR24) investigative report, URL
      https://www.br.de/nachrichten/deutschland-welt/sicherheitsluecke-mobilfunknetze-verrieten-sensible-handydaten,VTPFtd7
    summary: |
      Bayerischer Rundfunk (BR) published an investigation on 2026-08-27, corroborated the same day by heise, that
      found Germany's three mobile network operators — Deutsche Telekom, Vodafone and Telefónica/O2 — forwarded
      device-identifying data to the calling party during call setup, before the callee ever answered. Across more
      than 70 test calls captured with Wireshark on the caller's own device, Telekom's and O2's networks in several
      cases forwarded the callee's full 15-digit IMEI, and Telekom's and Vodafone's networks separately exposed the
      callee's smartphone model and OS version — specific enough to reveal whether a target device was missing a
      given security update. The leak occurred only in certain unspecified network/device constellations rather
      than on every call, and BR could not establish since when the gap existed; BR notified the three operators in
      late June 2026, after which Vodafone said it had "further narrowed" transmitted call data, Telekom said in
      mid-August it would adjust its network, and Telefónica said it had implemented technical measures — all three
      state they otherwise meet international industry standards. The GSMA confirmed the flaw on inquiry and, per a
      nine-page briefing BR obtained, warned its 1,000+ member operators worldwide to review their networks and
      filter unnecessarily transmitted call-setup information — an implicit acknowledgment the same signaling gap
      plausibly extends beyond Germany's three carriers to any GSMA member network. Germany's domestic security
      service (BfV) assessed the flaw as "sicherheitsrelevant" (security-relevant), stating it is "nahezu sicher"
      (near-certain) that foreign intelligence services exploit such information, citing documented state-actor
      cyberattacks against mobile devices and a scenario in which correlating a soldier's IMEI between a domestic
      posting and a later deployment abroad could put that individual "in the focus of a spy." HPI mobile-security
      researcher Jiska Classen called it a serious flaw enabling mass profile-building and said it shows how poorly
      such carrier systems are tested; SRLabs' Karsten Nohl added that device-model exposure also enables more
      targeted attacks and IMEI cloning. BR notes the finding parallels an April-2026 discovery of a similar flaw in
      Norwegian networks by Mnemonic researcher Harrison Sand, who shared his methodology with BR, suggesting the
      underlying signaling gap is not carrier-specific to Germany.
    region_nexus: "Germany confirmed (Telekom, Vodafone, Telefónica/O2); GSMA's 1,000+-member warning and the Norwegian precedent (Mnemonic, April 2026) indicate the same signaling-metadata gap plausibly extends to other European/Swiss GSMA-member operators — untested and unconfirmed for Switzerland specifically"
