items:
  - title: "VulnCheck traces the ZBT/Zbtlink router supply chain to two more implants — DARKLANTERN and SPEAKINGSTONE — and sinkholes a forgotten C2 domain to reveal a Chinese carrier-network deployment"
    sources:
      - { url: "https://www.vulncheck.com/blog/zbt-darklantern-speakingstone", publisher: "VulnCheck", date: "2026-08-27", role: primary }
      - { url: "https://www.vulncheck.com/blog/zbt-endlessdoors", publisher: "VulnCheck", date: "2026-08-05", role: primary, note: "background primary — the source of the existing 2026-08-06 entry this update extends" }
      - { url: "https://www.heise.de/news/OEM-China-Router-von-ZBT-mit-Backdoors-11433072.html", publisher: "heise Security", date: "2026-08-28", role: corroborating }
    discovery_trace: >
      first seen at: heise-sec (S3 essential source), URL https://www.heise.de/security/feed.xml
      → article https://www.heise.de/news/OEM-China-Router-von-ZBT-mit-Backdoors-11433072.html
      → primary: VulnCheck, URL https://www.vulncheck.com/blog/zbt-darklantern-speakingstone
      → background primary (already the store's existing source): VulnCheck, URL https://www.vulncheck.com/blog/zbt-endlessdoors
    summary: |
      VulnCheck published a follow-up on 2026-08-27 (heise.de covered it 2026-08-28) tracing the ZBT/Zbtlink OEM
      router supply chain further after its 2026-08-05 ENDLESSDOORS disclosure (CVE-2026-66747, already covered by
      this store's 2026-08-06 entry). Rooting a 2019-built ZBT-WE826-T2 sold on US Amazon as "Deep Orange," VulnCheck
      found two additional pre-installed implants: DARKLANTERN, an unauthenticated WAN-listening command backdoor,
      and SPEAKINGSTONE, a more capable phone-home implant. DARKLANTERN runs as the service infosrvd on UDP/9992,
      a port the router's default firewall explicitly opens to the internet; an unauthenticated 19-byte info probe
      returns the device's model, firmware, MAC address, SSID and public IP on UDP/8897, and a command packet
      (type 0x17) passes an operator string directly to system("/etc/exec/cmd " + payload) — a semicolon breaks out
      of the fixed prefix into arbitrary root shell execution, with no length limit or character filtering. The only
      gating fields are a keyed checksum computed from a hardcoded static salt ("mqonu.com", tying development to
      the Chinese OEM MoreQuick) and a MAC-address check that is bypassed outright by sending an all-zero MAC.
      VulnCheck's internet scanner found 203 DARKLANTERN-responsive devices across 22 countries between 18–21
      August 2026, self-reporting across 16 different router models. SPEAKINGSTONE (process yunmgrd) instead beacons
      outbound over UDP/10000 to ZBT's own Alibaba Cloud infrastructure with a full device fingerprint, and accepts
      plaintext, unauthenticated commands to run arbitrary shell commands, exfiltrate WAN PPPoE credentials, write
      or read a DNS-hijack list, or open/close a reverse SSH tunnel. VulnCheck registered SPEAKINGSTONE's abandoned
      hardcoded backup domain and captured 392 beacons by 21 August — 390 from China, 83% on China Mobile's network,
      and 363 of them a single carrier-CPE model — evidence VulnCheck reads as a domestic Chinese surveillance
      deployment running on the same firmware lineage sold to Western consumers. Supply-chain tracing via FCC
      filings, trademark records and archived web pages ties the ZBT-WE826 platform to rebrands sold in the US
      (Deep Orange, WiFlyer), Canada (MOFI Networks), Australia (OneX), and Germany (Digineo's AC1200 Pro, ALLNET's
      ALL-WR1200AC-WRT), among others. No CVE has been assigned to DARKLANTERN or SPEAKINGSTONE, and — as with
      ENDLESSDOORS — VulnCheck's remediation guidance remains device replacement rather than a patch, since it
      treats these as vendor-shipped surveillance components rather than coordinable defects ("we did not notify
      Zbtlink").
    region_nexus: "global supply chain with confirmed OEM rebrand presence in Germany (Digineo, ALLNET); no Swiss rebrand identified in VulnCheck's tracing to date"
