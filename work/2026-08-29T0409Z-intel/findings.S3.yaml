      - quote: "In den Netzen von Telekom und Telefónica (O2) gelangten dabei in mehreren Fällen IMEI-Nummern zum Anrufer."
        attribution: "Bayerischer Rundfunk (BR24)"
        source_url: "https://www.br.de/nachrichten/deutschland-welt/sicherheitsluecke-mobilfunknetze-verrieten-sensible-handydaten,VTPFtd7"
      - quote: "Das Bundesamt für Verfassungsschutz (BfV) wertet die von BR Recherche entdeckte Sicherheitslücke auf Anfrage als \"sicherheitsrelevant\"."
        attribution: "Bayerischer Rundfunk (BR24)"
        source_url: "https://www.br.de/nachrichten/deutschland-welt/sicherheitsluecke-mobilfunknetze-verrieten-sensible-handydaten,VTPFtd7"
      - quote: "Nachdem der BR sich mit Fragen an den Verband gewandt hatte, warnte er seine mehr als 1.000 Mitgliedsunternehmen, wozu auch die deutschen Netzanbieter gehören."
        attribution: "Bayerischer Rundfunk (BR24)"
        source_url: "https://www.br.de/nachrichten/deutschland-welt/sicherheitsluecke-mobilfunknetze-verrieten-sensible-handydaten,VTPFtd7"
    extended_notes: |
      Neither BR nor heise names the precise signaling layer (SS7 interconnect field, Diameter/IMS parameter, or a
      VoLTE SIP header) carrying the leaked data — flagged explicitly as an unknown rather than invented. Detection
      concept for a telco SOC/network-security team: audit outbound call-setup signaling at the interconnect
      boundary for device-identifying parameters (IMEI, UE capability/OS-version fields) reaching the calling
      party or a foreign network, consistent with GSMA/IETF RFC 7254 and RFC 7255 guidance that such fields be
      anonymized or stripped before leaving the home network. Hardening lever: filter/strip unnecessary
      device-identifying call-setup parameters at the network edge per the GSMA's own briefing recommendation.
      Defender takeaway for public-sector mobile fleets, especially personnel travelling internationally (defense,
      diplomatic, law-enforcement): call-based device fingerprinting is a tracking vector independent of the SIM,
      and roaming exposes it to a foreign operator by design — this is a policy/procurement question (does the
      fleet's home carrier still leak this after the fixes described here) as much as a technical one. Swiss
      carriers (Swisscom, Sunrise, Salt) were not tested by BR; whether they carry the same gap is unconfirmed and
      worth a direct inquiry given the GSMA's broad member warning.

  - title: "TrendAI closes this store's open coverage-backlog item: fourteen trojanized npm packages drop RedC2 4.0's Linux implant via a module-load-time loader that needs no install hook"
    sources:
      - { url: "https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/redc2-ai-powered-linux-implant", publisher: "TrendAI Research (Trend Micro)", date: "2026-08-20", role: primary }
    discovery_trace: >
      first seen at: WebSearch ("RedC2 npm trojanized packages vendor blog analysis") → pivot: The Hacker News
      (aggregator, not cited), URL https://thehackernews.com/2026/08/14-trojanized-npm-packages-drop-redc2.html
      → primary: TrendAI Research (Trend Micro), URL
      https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/redc2-ai-powered-linux-implant
    summary: |
      TrendAI (Trend Micro) Research published a technical analysis, dated 2026-08-20, of a cluster of fourteen
      trojanized npm packages — small, functional calendar/streak date-math utilities (streak-metrics-math,
      kit-map-vim, streak-map-cache and eleven further near-identical names) — that each also bundle a Linux ELF
      binary and a loader in the package's index.mjs. The loader re-exports the genuine date helpers so the package
      works as advertised, then runs an async IIFE evaluated at module load: it chmods the bundled binary
      executable, verifies its SHA-256 against a hardcoded constant, and spawns it detached (shell: false) so it
      outlives the importing Node process. No install hook or exported function call is involved, so
      --ignore-scripts provides no coverage, and a single transitive import anywhere in a dependency graph is
      sufficient to trigger execution. The dropped binary is RedShell, the native Linux implant for RedC2 4.0, a
      modular, actively-developed cross-platform (Windows/macOS/Linux) C2 framework marketed on Hack Forums that
      ships an LLM-backed component called Red Agent — exposed via a /ra command in the beacon terminal — which
      translates natural-language operator intent (e.g. "dump credentials") into an ordered chain of framework
      beacon commands. On execution RedShell ignores SIGPIPE, double-forks to daemonize, and connects to a
      hardcoded primary C2 host (falling back to localhost) over TCP with aggressive keepalive tuning, wrapping the
      session in TLS with certificate verification explicitly disabled (SSL_VERIFY_NONE) and TLS 1.2 enforced as
      the minimum version; a persistent per-host installation ID is cached in a dotfile under $HOME so re-infection
      state survives restarts. RedShell exposes a broad Linux-native command set to the operator: interactive shell
      execution, SSH-key and browser-credential harvesting, database discovery, bulk exfiltration over HTTP or to
      third-party file-sharing services, fileless ELF execution via memfd_create, arbitrary shellcode execution via
      mmap, dlopen-based shared-library loading, SOCKS5 proxying and TCP port forwarding, and cross-network
      reverse-shell tunnelling brokered through the C2 server. Persistence is established through cron, .bashrc,
      a user-level systemd service, or an XDG autostart entry. This item closes a gap this store's coverage backlog
      had open (only The Hacker News' aggregator write-up had previously been located); TrendAI's analysis is the
      first-hand reverse-engineering primary.
    region_nexus: "global (npm ecosystem — no region-specific targeting stated)"
    primary_sector_nexus: "indirect"
    sector: "technology, public-sector"
    cves: []
    techniques: [T1195.002, T1059.004, T1053.003, T1543.002, T1572, T1620, T1552.004, T1555.003, T1573]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "tool:redc2", type: tool, name: "RedC2", aliases: ["RedShell", "RedShell Linux", "Red Agent"],
          summary: "A modular, actively-developed cross-platform (Windows/macOS/Linux) command-and-control framework sold on Hack Forums; version 4.0 (June 2026) added the native RedShell Linux implant, and the framework ships an LLM-backed 'Red Agent' component that converts natural-language operator intent into beacon command chains (TrendAI Research, 2026-08-20)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: >
      TrendAI's write-up is dated 2026-08-20, well outside this run's 24h window, and no fresh in-window
      publication was found. It is surfaced specifically because it closes a named, open entry in
      state/coverage_backlog.md ("fourteen trojanized npm packages dropping RedC2 4.0", previously only
      aggregator-sourced) — the main agent should weigh the recency-gate rule against the backlog-closure value.
    evidence:
      - quote: "One import anywhere in the dependency graph is sufficient, including from a transitive dependency the developer never selected."
        attribution: "TrendAI Research"
        source_url: "https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/redc2-ai-powered-linux-implant"
      - quote: "Certificate verification is explicitly disabled via SSL_VERIFY_NONE, meaning the malware will accept any server certificate without validation"
        attribution: "TrendAI Research"
        source_url: "https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/redc2-ai-powered-linux-implant"
      - quote: "RedC2 ships with an AI assistant called Red Agent, an LLM-backed command execution layer that turns natural-language intent into framework beacon commands."
        attribution: "TrendAI Research"
        source_url: "https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/redc2-ai-powered-linux-implant"
    extended_notes: |
      No IOCs carried over from the source by design (the write-up publishes a hardcoded C2 IP:port, package
      names/versions and file hashes — package names are included above as they function like affected-product
      identifiers for defenders auditing dependency trees; the literal C2 IP address and file hashes are
      deliberately omitted). Detection concept: process-creation telemetry showing a Node.js/npm-installed
      package's module import immediately spawning a detached, double-forking child process that opens an
      outbound TLS session with an invalid/self-signed certificate accepted without validation — legitimate
      npm packages that bundle native binaries (e.g. via prebuilt node-gyp addons) do so at install time via a
      documented hook, not as a side effect of a plain import with no exported function called. Hardening:
      treat --ignore-scripts as insufficient supply-chain mitigation; pin exact package hashes in CI/CD; run
      dependency installs in network-egress-restricted sandboxes and audit transitive dependencies for bundled
      non-JS binaries.

