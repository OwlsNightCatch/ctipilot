items:
  - title: >
      PaperCut NG/MF: unauthenticated Tapestry page/component confusion chains to pre-auth RCE,
      actively exploited before patch (CVE-2026-82078, CVE-2026-81578)
    sources:
      - { url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", publisher: "PaperCut Software (vendor security bulletin)", date: "2026-08-29", role: primary }
      - { url: "https://www.huntress.com/blog/papercut-actively-exploited", publisher: "Huntress", date: "2026-08-28", role: primary }
      - { url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", publisher: "Rapid7", date: "2026-08-28", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/papercut-warns-of-ng-mf-flaw-exploited-in-zero-day-attacks/", publisher: "BleepingComputer", date: "2026-08-27", role: corroborating }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1095/", publisher: "CERT-FR (ANSSI) advisory CERTFR-2026-AVI-1095", date: "2026-08-28", role: corroborating }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0334", publisher: "NCSC-NL advisory NCSC-2026-0334", date: "2026-08-28", role: corroborating }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3060", publisher: "BSI CERT-Bund (WID-SEC catalogue, corroborates ServiceNow — see companion item)", date: "2026-08-27", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12882
      (bridge ncsc-csh recent 20, post created 2026-08-28T05:29Z, updated 2026-08-28T15:14Z with
      CVE IDs) → primary: PaperCut vendor bulletin, URL
      https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/ →
      pivot: Huntress technical writeup, URL https://www.huntress.com/blog/papercut-actively-exploited
      → pivot: Rapid7 technical writeup, URL
      https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/ →
      corroboration: CERT-FR CERTFR-2026-AVI-1095, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1095/
      → corroboration: NCSC-NL CSAF NCSC-2026-0334, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0334
      (fetched via bridge ncsc-nl csaf).
    summary: |
      PaperCut disclosed on 27 August 2026 that its NG and MF print-management Application Server
      was under active exploitation, before any CVE, patch, or technical detail existed; a
      university customer's DFIR team supplied the reproduction data. Two CVEs now cover the
      chain: CVE-2026-81578 (CWE-306 Missing Authentication for Critical Function, CVSS 8.8) and
      CVE-2026-82078 (CWE-470 Unsafe Reflection / dynamic class loading, CVSS4.0 9.4). Rapid7's
      technical analysis identifies the root cause as a request-routing confusion in the bundled
      Apache Tapestry framework's "complex direct" service dispatch: a crafted request can name one
      page for rendering (the public Error/Exception/Home page) while a different page's component
      actually executes — PaperCut's authorization check validates only the rendered page. Through
      this, an unauthenticated caller reaches the administrative ConfigEditor and UserList
      components (POST to /app?service=direct/1/Error/ConfigEditor/quickFindForm,
      .../ConfigEditor/$Form, and .../UserList/$QuickFind.$Form) and rewrites the external Card/ID
      database-lookup settings (user-lookup.db-driver, user-lookup.db-url,
      user-lookup.id-to-username-sql, user-lookup.enabled) to point at an attacker-controlled JDBC
      target. Using PaperCut's bundled Apache Derby driver's foreignViews feature, the attacker
      pivots to an attacker-controlled H2 JDBC URL, whose inline INIT statement creates a
      JavaScript-backed database trigger; PaperCut's bundled Nashorn engine then executes the
      trigger to spawn an OS process — full unauthenticated RCE as the PaperCut server process.
      Huntress observed two live customer exploitations (26 and 27 August) using base64-encoded
      discovery commands (whoami & ver, later whoami & ver & tasklist) delivered via a dropped
      Java .class file that deletes its own output and the PaperCut server.log afterward; one
      victim was still on v24.1.5, exploited before the v24 patch existed. PaperCut shipped an
      Emergency Patch (Release 2, 28 August) for v24/25/26 after an initial Release 1 patch was
      found bypassable via the Home-page variant of the same request; there is no fix for v23 and
      earlier, and Huntress estimates 47% of the ~2,500 PaperCut installations it tracks run v23 or
      older. PaperCut has a documented history of severe post-exploitation impact: the 2023
      CVE-2023-27350 RCE was mass-exploited by Clop and LockBit ransomware operators and by
      Iran-linked state actors, disproportionately against education-sector targets.
    region_nexus: "global; multiple confirmed victim incidents, discovery aided by a university customer"
    primary_sector_nexus: "direct — education and government print-management deployments are typical PaperCut customers"
    sector: "public-sector, healthcare, finance, telco"
    cves: [CVE-2026-82078, CVE-2026-81578]
    techniques: [T1190, T1059, T1082, T1057, "T1070.004"]
    affected_products: ["PaperCut NG", "PaperCut MF"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "PaperCut Software security response team is investigating active exploitation of a vulnerability affecting PaperCut NG and PaperCut MF."
        attribution: "PaperCut Software"
        source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"
      - quote: "PaperCut's authorization check could trust the rendered page and miss the permissions required by the component behind it."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/papercut-actively-exploited"
      - quote: "By selecting either the public Error page or Exception page for display, an attacker can bypass authentication while invoking administrative components belonging to ConfigEditor or UserList."
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"
      - quote: "47% of the approximately 2,500 PaperCut installations Huntress tracks are running v23 or older, for which no patch is currently available."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/papercut-actively-exploited"
    extended_notes: |
      Detection: correlate PaperCut Application Server web-access logs for POST requests to
      /app?service=direct/*/Error (or Exception/Home)/ConfigEditor or .../UserList paths from
      unauthenticated or external sources — this is not a normal PaperCut admin traversal pattern.
      Process telemetry rooted at pc-app.exe spawning any shell/child process is a high-confidence
      discriminator (PaperCut never legitimately spawns command interpreters). Log-integrity check:
      an unexplained gap, truncation, or deletion of server.log, and an irregular Derby in-memory
      database name (vendor observed "pwn") in derby.log immediately preceding a "DB URL:
      jdbc:derby:memory:..." log line. Triage note: the absence of the two documented server.log
      error strings does NOT rule out compromise per the vendor's own advisory.
    borderline: false
  - title: >
      ServiceNow AI Platform / Now Platform: three unauthenticated CVSS 10.0 flaws (GraphQL code
      injection, SQL injection, access-control bypass) plus one sandbox-escape CVE
    sources:
      - { url: "https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3152242", publisher: "ServiceNow (vendor security advisory KB3152242)", date: "2026-08-27", role: primary }
      - { url: "https://thehackernews.com/2026/08/three-cvss-100-servicenow-flaws-could.html", publisher: "The Hacker News", date: "2026-08-28", role: primary }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3060", publisher: "BSI CERT-Bund advisory WID-SEC-2026-3060", date: "2026-08-27", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12898
      (bridge ncsc-csh recent 20, post created 2026-08-28T15:04Z) → primary: ServiceNow vendor KB,
      URL https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3152242 →
      corroboration: The Hacker News, URL
      https://thehackernews.com/2026/08/three-cvss-100-servicenow-flaws-could.html → corroboration:
      BSI CERT-Bund WID-SEC-2026-3060, URL
      https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3060 (fetched via
      bridge bsi-csaf).
    summary: |
      ServiceNow's 27 August 2026 advisory (KB3152242) discloses four flaws in the AI Platform and
      Now Platform, three rated 10.0 on CVSS v4.0, all sharing the vector
      CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H — network-reachable, low
      complexity, no privileges, no user interaction, high impact to the vulnerable component and
      systems connected to it. CVE-2026-18885 is a code-injection flaw in the GraphQL Composite
      Data API letting an unauthenticated caller execute arbitrary code and read or modify instance
      data. CVE-2026-74820 is a SQL injection reached through a dynamic schema ORDER BY clause,
      letting an unauthenticated caller run arbitrary SQL against the instance's own database.
      CVE-2026-18886 is an improper-access-control flaw in the system-configuration image-upload
      processor letting an unauthenticated caller create or modify instance data for privilege
      escalation. A fourth flaw, CVE-2026-6876 (CVSS 8.7, vector differs only in PR:L — low
      privileges required, and no impact scored beyond the vulnerable component), is a sandbox
      escape in the Now Platform letting a low-privileged caller execute arbitrary code — the same
      vulnerability class as CVE-2026-6875, a pre-auth ServiceNow sandbox escape disclosed in July
      2026 by Searchlight Cyber that Defused initially reported as exploited in the wild before
      correcting that the observed payload matched Searchlight's own published PoC rather than
      independent attacker activity. ServiceNow states hosted instances are already updated;
      self-hosted and partner-hosted customers must apply the patch themselves against a four-track
      version matrix (Xanadu, Yokohama, Zurich, Australia releases, each with its own minimum
      hotfix). ServiceNow reports no awareness of exploitation for any of the four flaws, and no
      public exploit code was found as of 28 August 2026. Note for severity triage: ServiceNow is
      its own CVE Numbering Authority, and since 15 April 2026 NIST enriches only vulnerabilities
      that appear in CISA's KEV catalogue, affect federal government software, or are designated
      critical under Executive Order 14028 — none of these four currently qualify, so ServiceNow's
      self-assigned 10.0/8.7 ratings are the only severity assessment on record.
    region_nexus: "global; ServiceNow ITSM/ITOM is widely deployed across public-sector and enterprise environments including in Switzerland and the EU"
    primary_sector_nexus: "direct — ServiceNow is a common ITSM platform in public-sector and critical-infrastructure back-office environments"
    sector: "public-sector, finance, healthcare, telco, energy"
    cves: [CVE-2026-18885, CVE-2026-18886, CVE-2026-74820, CVE-2026-6876]
    techniques: [T1190]
