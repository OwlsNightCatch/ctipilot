    evidence:
      - quote: "A code injection vulnerability in the GraphQL Composite Data API that could enable an unauthenticated user to execute arbitrary code and gain access to, or modify, instance data"
        attribution: "The Hacker News, citing ServiceNow's advisory"
        source_url: "https://thehackernews.com/2026/08/three-cvss-100-servicenow-flaws-could.html"
      - quote: "None of the four flaws appeared in the catalog as of August 28, 2026, leaving ServiceNow's ratings as the only severity assessment on record."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/08/three-cvss-100-servicenow-flaws-could.html"
      - quote: "ServiceNow has remediated a SQL injection vulnerability that was identified in the ServiceNow AI platform. This vulnerability could enable an unauthenticated user, in certain circumstances, to execute arbitrary SQL statements against the instance's underlying database"
        attribution: "ServiceNow"
        source_url: "https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3152242"
    extended_notes: |
      Detection concept (telemetry-class first): ServiceNow instance/application audit logs and
      GraphQL API access logs for anomalous or malformed Composite Data API mutations from
      unauthenticated sessions; database-audit telemetry for ORDER BY clauses containing
      non-schema tokens; system-configuration change-audit records for image-upload-processor
      writes not tied to an authenticated administrative session. No public PoC exists yet, so
      this is patch-priority guidance rather than an active-exploitation hunt.
    borderline: false
  - title: >
      Microsoft Exchange Server MRSProxy auth bypass (CVE-2026-62911): public PoC now live, MSRC
      rating of "Exploitation Less Likely" from August Patch Tuesday has not been updated
    sources:
      - { url: "https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/", publisher: "Franky's Web", date: "2026-08-27", role: primary }
      - { url: "https://advisories.ncsc.nl/rss/advisories", publisher: "NCSC-NL advisory NCSC-2026-0289 (RSS feed item, update dated 2026-08-28)", date: "2026-08-28", role: corroborating }
    discovery_trace: >
      first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories (bridge feed,
      item "NCSC-2026-0289 [1.01] Kwetsbaarheden verholpen in Microsoft Exchange server", updated
      2026-08-28T11:33Z noting public PoC for CVE-2026-62911) → pivot: WebSearch ("CVE-2026-62911
      Exchange Server proof of concept") → primary: Franky's Web technical analysis, URL
      https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/
      → corroboration: Microsoft Security Response Center vulnerability record (structured API,
      bridge msrc cve CVE-2026-62911), URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62911.
    summary: |
      CVE-2026-62911 (CWE-294 Authentication Bypass by Capture-Replay, CVSS 8.0, MSRC vector
      CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:H/A:H) was patched in Microsoft's 11 August 2026
      Exchange Server security release, at the time rated "Exploitation Less Likely." Working
      exploit code was published on GitHub around 27 August 2026
      (hypnguyen1209/cve-2026-62911, per Franky's Web), and MSRC's exploitability rating has not
      been revised despite the public PoC — the record's only revision remains its 11 August
      initial publication. The flaw sits in the MRSProxy endpoint Exchange exposes for mailbox
      moves: MRSProxy accepts Negotiate authentication but never validates channel bindings, the
      check that Extended Protection for Authentication depends on. Without that check, an attacker
      can relay a captured Negotiate/NTLM authentication exchange to the endpoint and be treated as
      the relayed account rather than as themselves — Microsoft's own FAQ confirms the resulting
      access lets an attacker "take over the mailboxes of all Exchange users... send emails, read
      emails, download attachments." The flaw was discovered by Orange Tsai of DEVCORE Research
      Team and demonstrated at Pwn2Own Berlin 2026 as one link in a three-vulnerability chain that
      together achieved SYSTEM-level remote code execution on Exchange (a $200,000 prize, 20 Master
      of Pwn points); it was disclosed to Microsoft via Trend Micro's Zero Day Initiative. Affected
      are all Exchange Server builds below the August 2026 cumulative/security update: Exchange
      Server SE RTM before 15.2.2562.46 (KB5121573), Exchange 2019 CU15 before 15.2.1748.49
      (KB5121574), Exchange 2019 CU14 before 15.2.1544.44 (KB5121575), and Exchange 2016 CU23
      before 15.1.2507.72 (KB5121576). There is no Exchange Emergency Mitigation workaround; the
      August update is the only fix, and Exchange 2016/2019 updates are gated behind Microsoft's
      paid Extended Security Updates program for organizations without current mainstream support.
      No in-the-wild exploitation has been reported as of this writing, but the gap between a
      public, functioning PoC and an unrevised vendor exploitability rating is itself the
      actionable signal here.
    region_nexus: "global; on-premises Exchange Server remains widely deployed across Swiss and European government and enterprise mail infrastructure"
    primary_sector_nexus: "direct — on-prem Exchange is common in public-sector and critical-infrastructure back-office email deployments"
    sector: "public-sector, finance, healthcare, energy, telco"
    cves: [CVE-2026-62911]
    techniques: [T1190, T1557, T1068]
    affected_products: ["Microsoft Exchange Server 2016", "Microsoft Exchange Server 2019", "Microsoft Exchange Server Subscription Edition"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Working exploit code has surfaced for the critical Exchange vulnerability CVE-2026-62911 from the August update."
        attribution: "Franky's Web"
        source_url: "https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/"
      - quote: "This endpoint accepts Negotiate authentication but does not check the so-called channel bindings. It is precisely this check that enforces Extended Protection."
        attribution: "Franky's Web"
        source_url: "https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/"
      - quote: "Authentication bypass by capture-replay in Microsoft Exchange Server allows an authorized attacker to elevate privileges over a network."
        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62911"
      - quote: "What privileges could be gained by an attacker who successfully exploited the vulnerability? The attacker would be able to take over the mailboxes of all Exchange users, attackers can send emails, read emails, download attachments."
        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62911"
    extended_notes: |
      Source tension worth preserving rather than resolving: MSRC's CVSS vector scores PR:L/UI:R
      ("authorized attacker," some user interaction), while Franky's Web's technical description
      frames the attacker as needing no valid Exchange credentials at all, since the relay
      mechanism supplies the "authorization." Both readings point to the same operational
      conclusion — treat any Exchange server below the August 2026 build as exposed to
      unauthenticated mailbox-wide access once an attacker can coerce or capture a Negotiate
      authentication exchange directed at MRSProxy. Detection concept: authentication/session
      telemetry for MRSProxy/EWS access under the Exchange server's own machine-account context
      arriving from unexpected source hosts (a legitimate mailbox move originates internally, not
      via relayed external traffic); Windows Security Event 4624 Logon Type 3 network logons in
      that account context are the platform-specific anchor.
    borderline: false
