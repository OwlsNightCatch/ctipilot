      A researcher/hacker using the handle "LunarisSec" published a security disclosure claiming to have found exposed data linked to Qare.fr, a French telemedicine consultation platform, including patient photographs — some depicting children — plus structured records with names, cities and postal codes. LunarisSec frames the action as a security disclosure rather than a data-monetization operation and reportedly has not published a full victim count or dataset scope. Cyberattaque.org (the only outlet reporting this) reviewed the screenshots directly but could not establish the exposure's origin, scope, or number of affected individuals; there is no statement from Qare and no second independent source.
