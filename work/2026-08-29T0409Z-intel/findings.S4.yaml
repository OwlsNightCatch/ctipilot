      No ransomware group had claimed responsibility as of 2026-08-28 per multiple independent sources (Reuters, HIPAA Journal, TechTimes via WebSearch corroboration) — consistent with the pattern that extortion groups withhold public claims to preserve negotiating leverage; watch for a leak-site listing in coming days. Attack vector undisclosed. This continues a 2026 pattern of medtech-sector disruptive incidents (Stryker wiper attack in March, Medtronic/ShinyHunters breach in April, iRhythm and Abbott incidents mid-year) worth tracking as a sector trend for European hospital procurement/vendor-risk teams even absent direct European victim disclosure.

      Note on techniques[]: left empty deliberately — Boston Scientific has not disclosed the attack vector, initial-access mechanism, or whether encryption/data destruction was involved, and no researcher has published technical analysis as of this writing. Do not infer a ransomware/encryption technique (e.g. T1486) from the "global disruption" / "unknown restoration timeline" language alone; that is a plausible but unconfirmed inference several quoted commentators raise informally, not a sourced fact. If a later development (ransomware leak-site listing, vendor forensic report) discloses the vector, map techniques then via a changelog update.
