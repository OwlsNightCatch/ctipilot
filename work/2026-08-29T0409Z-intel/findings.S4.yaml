  - title: "Minea (Swiss e-commerce ad-intelligence platform): unconfirmed hacker claim of 533K profiles / 81.6M activity records — data reportedly dates to August 2024, no victim confirmation"
    sources:
      - { url: "https://www.cyberattaque.org/minea-533-000-profils-et-816-millions-dactivites-exposes-dans-une-fuite-massive/", publisher: "Cyberattaque.org", date: "2026-08-28", role: "primary" }
    discovery_trace: "first seen at: cyberattaque-org (S4 standard-tier RSS), URL https://www.cyberattaque.org/feed/ → article https://www.cyberattaque.org/minea-533-000-profils-et-816-millions-dactivites-exposes-dans-une-fuite-massive/ (no independent corroboration found; WebSearch for \"Minea data breach BoneT4p2ndAcc\" returned no matching results)"
    summary: |
      A hacker using the handle "BoneT4p2ndAcc" claims to have obtained 533,162 unique user profiles and ~81.6M activity/event records (105GB decompressed) from Minea, a Swiss company providing ad-intelligence/dropshipping-research tooling widely used by French e-commerce operators. Claimed fields include email, IP address, city/region/country, device identifiers, subscription/plan status, and marketing-attribution/UTM data; ~20% of profiles are claimed to be French users. Cyberattaque.org itself flags a major credibility caveat: the claimed compromise date is 2026-08-28, but the records in the sample stop in August 2024 — a two-year gap the outlet says could indicate a recycled historical export rather than a fresh 2026 breach. No victim (Minea) confirmation, no independent journalism corroboration, and only a single reliability-C aggregator source were found despite search attempts.
    region_nexus: "Switzerland — Minea is a Swiss-headquartered company (home-region nexus), though the claimed victim population skews French (~20%) and the claim itself is unconfirmed"
