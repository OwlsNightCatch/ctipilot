  item: "servicenow-ai-platform-four-unauth-cvss10-flaws"
  url_or_quote: "CVE-2026-6876 (CVSS4.0 8.7, requiring low privileges rather than none) ... letting a low-privileged caller execute arbitrary code — the same vulnerability class as CVE-2026-6875 ... disclosed in July 2026 by Searchlight Cyber ([ServiceNow, 2026-08-29])"
  summary: "ServiceNow's own KB3152242 calls CVE-2026-6876 an 'unauthenticated user' issue and never mentions CVE-2026-6875, Searchlight Cyber, or a numeric 8.7 score; every one of those facts (and the PR:L/low-privilege reading, which contradicts ServiceNow's own prose) is stated only by The Hacker News. Unaddressed second ServiceNow-vs-Hacker-News contradiction on the same entry."
