  item: "ENDLESSDOORS (CVE-2026-66747) — ZBT/Zbtlink router backdoor, Update — 2026-08-29T04:09:36Z"
  url_or_quote: "\"No CVE has been assigned to either implant, and as with ENDLESSDOORS, VulnCheck's remediation guidance remains device replacement rather than a patch: it states it did not notify Zbtlink.\" (closing sentence of the changelog section and near-verbatim in updates[].summary)"
  summary: "Uncited claim, and the specific attribution overclaims: fetched the cited source (https://www.vulncheck.com/blog/zbt-darklantern-speakingstone, 2026-08-27) in full and grepped it for \"notify\", \"CVE\", \"replace\" — zero matches. That post never states VulnCheck did not notify Zbtlink about DARKLANTERN/SPEAKINGSTONE, never states no CVE was assigned, and never restates the device-replacement remediation guidance; those statements appear only in the original 2026-08-05 ENDLESSDOORS post (properly cited earlier in the same entry for the original finding). The update section presents them as if stated by the 2026-08-27 post it cites throughout the preceding sentences. Fix: either add an inline citation back to the 2026-08-05 VulnCheck post for these specific claims, or drop the sentence from the update section (and the matching updates[].summary clause) since it is not a delta the 2026-08-27 post itself supports.
