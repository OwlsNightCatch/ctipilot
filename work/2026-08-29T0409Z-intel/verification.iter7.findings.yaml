  summary: "(low confidence) Only T1190 (Exploit Public-Facing Application) is mapped across four CVEs, one of which (CVE-2026-18886) the entry's own cves[].type now classifies as priv-esc. T1068 (Exploitation for Privilege Escalation) may be a supportable additional mapping the body already describes (\"resulting in privilege escalation\"). Advisory only, not a hard defect — T1190 is a defensible minimum for an access-vector-only mapping."
