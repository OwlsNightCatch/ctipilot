  item: "Six Swiss cantons — eAutoIndex/ecari vehicle-registry data-harvesting"
  url_or_quote: "\"Neither the identity nor the number of actors involved is known, and no exploitation of the underlying road-traffic office IT systems — as opposed to the public lookup interfaces — is reported by any cantonal authority.\""
  summary: "Closing sentence of the main analysis carries no inline citation. The facts are true and supported (cash.ch: \"Ob der Datenabruf von einer Einzelperson oder mehreren Personen begangen wurde, sei nicht bekannt\"; Blick/Abgottspon: \"soulagé que ni le système d'exploitation du Service ni celui de l'Etat n'aient été touchés\"), confirmed this iteration by re-fetching both pages, but neither is cited at the end of the sentence that states them. Fix: append the appropriate citation(s) to this sentence."
- code: F11
  category: editorial-advisory
  section: entries/2026-08-29
  item: "Six Swiss cantons — eAutoIndex/ecari vehicle-registry data-harvesting"
  url_or_quote: "techniques: [T1119]"
  summary: "(low confidence) T1119 (Automated Collection) is an ATT&CK Enterprise technique framed around an adversary already established on a compromised host collecting local data; this incident is external, unauthenticated bulk scraping of a public-facing lookup API with no host compromise. T1596 (Search Open Websites/Domains, Reconnaissance) may be a closer behavioral fit for \"harvest information from disparate [public] sources\" pre-attack collection. Not clearly wrong either way — flagging for the main agent's judgment, not requesting a specific change."
