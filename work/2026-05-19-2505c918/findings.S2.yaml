        attribution: "Deutsches Ärzteblatt (2026-05-18T16:35:39Z)"
        source_url: "https://www.aerzteblatt.de/news/hackerangriff-auf-rezeptprufer-c259a70c-595b-4770-9d84-87f6c8338c0c"
    extended_notes: |
      Translation of key quotes (German → English): "After the cyberattack on a healthcare sector auditing association, investigators confirm data exfiltration. The extent is still unclear." (Heise, May 18). "According to ARWINI, it is likely that personal and particularly protected data are affected." (ARWINI statement, cited by Borns IT Blog).
      GDPR and regulatory context: health data processed by ARWINI falls under Art. 9 GDPR (special categories); breach triggers 72-hour notification obligation to LfD Niedersachsen under Art. 33 GDPR. Under German KRITIS framework (BSI-KritisV) and the NIS2UmsuCG transposition, statutory health insurance is a critical sector; ARWINI as a data processor for KVN and GKV bodies may trigger additional BSI notification under §8b BSI-Gesetz or the new NIS2UmsuCG rules. Comparable to the 2025 IGJ/NMDL Dutch clinical-diagnostics ruling (covered 2026-05-14) in regulatory pattern.
      Attribution: no actor named publicly; attack detected May 4 after server intrusion signs; LKA Niedersachsen advised against paying ransom — consistent with ransomware/data-extortion scenario but unconfirmed.

