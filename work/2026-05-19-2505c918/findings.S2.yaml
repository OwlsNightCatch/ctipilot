      - url: "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h"
        publisher: "BigBlueButton GitHub Security Advisory (GHSA-xqm3-6q7q-4v5h)"
        date: "2026-05-17"
        role: "primary"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1568"
        publisher: "BSI WID-SEC-2026-1568"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: "first seen at: BSI RSS feed via bridge:bsi-rss → WID-SEC-2026-1568 (BigBlueButton, May 18) → bridge:bsi-csaf WID-SEC-2026-1568 for CVE IDs and GitHub advisory references → fetched each GitHub GHSA advisory directly"
    summary: |
      On 2026-05-17, BigBlueButton published three GitHub Security Advisories covering distinct vulnerability classes in its bbb-web component, all affecting releases before 3.0.21 (two CVEs) and 3.0.23 (one CVE). CVE-2026-46351 (CVSS 8.1 High, CWE-330) describes cryptographically weak session-token generation in bbb-web: the sessionToken is produced with insufficiently random values, allowing an attacker who shares or has observed a session to determine session tokens of other participants — enabling impersonation of any conference user. CVE-2026-46353 (CVSS 8.1 High, CWE-284) is an API checksum bypass in the presentationUploadExternalUrl endpoint: a low-privilege attacker can bypass checksum validation by supplying specific URL parameters, sending valid API requests to restricted endpoints without authentication verification, with high impact on confidentiality and integrity. CVE-2026-46404 (CVSS 6.8 Medium, CWE-918) is a server-side request forgery in bbb-web's presentation URL validation: insufficient redirect-following validation allows a high-privilege attacker to reach site-local and link-local addresses from the BBB server context. BSI published its WID-SEC-2026-1568 advisory on 2026-05-18 elevating defender awareness in German-speaking countries. BigBlueButton is the de facto open-source virtual classroom platform deployed across European universities, school districts, and government training infrastructure; German and Swiss universities, including deployments at cantonal and federal level, are significant user bases. All three flaws require upgrade to BBB 3.0.21 (for CVE-2026-46351 and CVE-2026-46353) and 3.0.23 (for CVE-2026-46404). MITRE: T1212 (Exploitation for Credential Access — session token prediction/reuse), T1090 (Proxy — SSRF for lateral movement to internal assets).
    ch_eu_nexus: "BigBlueButton is the primary open-source virtual classroom platform deployed across EU/CH universities, cantonal school systems, and government training infrastructure; German and Swiss federal/cantonal deployments are in scope"
    public_sector_nexus: "direct — academic and government e-learning infrastructure; cantonal and federal education ministries in CH; German Land ministries of education"
    sector: "education, public-sector, government"
    cves: ["CVE-2026-46351", "CVE-2026-46353", "CVE-2026-46404"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The vulnerability betreft een cryptographic weakness where 'sessionToken generation' was not implemented using secure randomization methods, enabling attackers to 'determine the sessionTokens of other users in the session.'"
        attribution: "GitHub Security Advisory GHSA-7959-pf2v-xc4h (CVE-2026-46351)"
        source_url: "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h"
      - quote: "The vulnerability enables attackers to bypass checksum validation by providing specific URL parameters in requests. This allows unauthorized users to send valid API requests to certain endpoints without proper authentication verification."
        attribution: "GitHub Security Advisory GHSA-43hc-5g2m-cqff (CVE-2026-46353)"
        source_url: "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-43hc-5g2m-cqff"
      - quote: "Ein entfernter, authentisierter Angreifer kann mehrere Schwachstellen in BigBlueButton ausnutzen, um Sicherheitsvorkehrungen zu umgehen und vertrauliche Informationen offenzulegen."
        attribution: "BSI WID-SEC-2026-1568"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1568"
    extended_notes: |
      CVE-2026-46351 specifics: sessionToken generation in bbb-web; CWE-330 Use of Insufficiently Random Values; auth-required (low privilege); network-based attack; no user interaction needed. Fix: upgrade to >= 3.0.21.
      CVE-2026-46353 specifics: presentationUploadExternalUrl endpoint in bbb-web; CWE-284 Improper Access Control; auth-required (low privilege); network-based attack; high confidentiality + integrity impact. Fix: upgrade to >= 3.0.21.
      CVE-2026-46404 specifics: presentation URL validation/redirect-following logic in bbb-web; CWE-918 SSRF; auth-required (high privilege — meeting organiser role); network-based attack. Fix: upgrade to >= 3.0.23.
      EU deployment footprint: DFN (German research/education network), SWITCH (Swiss academic network), DigitecGalaxus (canton deployments), GÉANT pan-European R&E network all host or facilitate BBB deployments. Hunting: bbb-web application logs for anomalous joins using predicted sessionTokens; API calls to presentationUploadExternalUrl with unexpected URL parameters; egress HTTP connections from bbb-web process to RFC1918 / link-local ranges (169.254.x.x, 192.168.x.x, 10.x.x.x).

  - title: "ARWINI statutory-health-insurance prescription-review body (Lower Saxony, Germany): investigators confirm data exfiltration — up to 70,000+ patient records, health and billing data"
    sources:
      - url: "https://www.aerzteblatt.de/news/hackerangriff-auf-rezeptprufer-c259a70c-595b-4770-9d84-87f6c8338c0c"
