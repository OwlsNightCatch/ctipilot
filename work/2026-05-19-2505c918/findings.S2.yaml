        date: "2026-05-18"
        role: "primary"
      - url: "https://www.heise.de/news/Niedersachsen-Datenabfluss-bei-Wirtschaftsprueferverein-im-Gesundheitswesen-11297772.html"
        publisher: "Heise Security"
        date: "2026-05-18"
        role: "corroborating"
      - url: "https://borncity.com/blog/2026/05/16/cyberangriff-auf-die-arwini-rezeptpruefung-in-niedersachsen-mit-datenabfluss/"
        publisher: "Borns IT- und Windows-Blog (DE)"
        date: "2026-05-16"
        role: "corroborating"
    discovery_trace: "first seen at: Heise Security RSS feed (heise-sec) via bridge:feed → 'Niedersachsen: Datenabfluss bei Wirtschaftsprüferverein im Gesundheitswesen' published 2026-05-18T17:23Z → WebSearch for 'ARWINI Niedersachsen Gesundheitswesen' → Borns IT blog (2026-05-16, original breach disclosure) → Deutsches Ärzteblatt (2026-05-18, in-window investigators-confirm update, primary source)"
    summary: |
      German investigators from the Lower Saxony State Criminal Police Office (LKA Niedersachsen) confirmed on 2026-05-18 that a cyberattack on ARWINI — the Arbeitsgemeinschaft Wirtschaftlichkeitsprüfung Niedersachsen e.V. (Lower Saxony statutory health-insurance prescription cost-effectiveness review body) — resulted in data exfiltration. The attack was detected on 2026-05-04 when signs of intrusion were found on ARWINI's servers; all systems were immediately shut down. ARWINI reviews the cost-effectiveness of prescriptions issued by doctors in Lower Saxony for approximately 11 million statutory health-insurance patients, processing billing data from Kassenärztliche Vereinigung Niedersachsen (KVN) and from AOK and other statutory insurers. More than 70,000 patient records are potentially affected, including contact details, health data, and billing information from statutory health-insurance patients. ARWINI issued a statement acknowledging that personal and particularly sensitive data (besondere Kategorien personenbezogener Daten under GDPR Art. 9) are likely affected. The LKA recommended against responding to the attackers (i.e. not paying ransom). No threat actor or ransomware group has been named in public sources at the time of writing. The Lower Saxony data protection authority (Landesbeauftragter für Datenschutz Niedersachsen, LfD) has been notified. This is a healthcare-sector breach under Germany's KRITIS framework and NIS2 transposition (KRITIS-DachG), requiring breach notification to the BSI and sectoral regulator. Defenders in German statutory health insurance (GKV) or health service data-exchange contexts should treat third-party prescription-review bodies as part of their supply chain for data governance and incident monitoring.
    ch_eu_nexus: "Germany (EU member state); statutory health insurance sector under KRITIS designation; GDPR Art. 9 special-category data breach; mandatory reporting to BSI and LfD Niedersachsen; transferable pattern for any EU health-sector data processor operating under NIS2"
    public_sector_nexus: "direct — Kassenärztliche Vereinigung Niedersachsen is a statutory self-governing body; ARWINI acts as mandated prescription auditor under German SGB V; data subjects are GKV-insured patients"
    sector: "healthcare, public-sector"
