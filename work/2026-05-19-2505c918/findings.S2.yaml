  - title: "Grafana Labs GitHub codebase exfiltrated via CI/CD Pwn-Request attack; CoinbaseCartel (ShinyHunters-linked) extortion refused"
    sources:
      - url: "https://www.securityweek.com/grafana-confirms-breach-after-hackers-claim-they-stole-data/"
        publisher: "SecurityWeek"
        date: "2026-05-18"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/grafana-says-stolen-github-token-let-hackers-steal-codebase/"
        publisher: "BleepingComputer"
        date: "2026-05-18"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html"
        publisher: "The Hacker News"
        date: "2026-05-17"
        role: "corroborating"
      - url: "https://www.theregister.com/cyber-crime/2026/05/18/grafana-labs-admits-attackers-downloaded-its-codebase-from-github/5241686"
        publisher: "The Register"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Europe cyber incident news May 18 2026') → SecurityWeek, URL https://www.securityweek.com/grafana-confirms-breach-after-hackers-claim-they-stole-data/ → BleepingComputer primary technical article, URL https://www.bleepingcomputer.com/news/security/grafana-says-stolen-github-token-let-hackers-steal-codebase/ → THN for technical root cause details, URL https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html"
    summary: |
      Grafana Labs confirmed on 2026-05-17/18 that an attacker accessed its GitHub environment using a stolen token and downloaded the full private codebase across five private repositories. The root cause was a misconfigured GitHub Actions workflow using the pull_request_target event trigger — a pattern known as a "Pwn Request" — which allowed a contributor's forked-repository pull request to run with repository-scoped production secrets in the CI context. The attacker forked a public Grafana repository, injected a malicious curl command into the forked workflow, and harvested the GitHub token during the CI run. Following exfiltration, the threat actor — claimed by CoinbaseCartel (assessed as an offshoot of ShinyHunters / Scattered Spider / LAPSUS$ ecosystems, active since September 2025) — issued an extortion demand, which Grafana flatly refused, citing FBI guidance. Grafana says no customer data or personal information was accessed. Detection was via a triggered canary token. The company immediately invalidated compromised credentials, removed the vulnerable GitHub Action, and disabled all public-repository workflows. CoinbaseCartel has claimed approximately 170 victims in healthcare, technology, transportation, manufacturing, and business services sectors. Defenders running self-hosted Grafana in SOC/NOC environments should audit GitHub Actions permissions: pull_request_target workflows must not grant write or repository-scoped tokens to untrusted (forked) code; the fix is to separate privilege-requiring steps into a second workflow triggered by workflow_run that only runs on code merged to the main branch (T1195.002 Supply-chain compromise / T1552.004 Credential in Files).
    ch_eu_nexus: "Grafana Labs is headquartered in New York but was founded in Europe (Torkel Ödegaard, Sweden) and has a large European engineering and customer base; Grafana OSS is the de facto monitoring/observability platform for EU public-sector SOCs, NOC teams, and cloud-native government infrastructure"
    public_sector_nexus: "indirect — Grafana is primary monitoring tooling for many EU/CH public-sector SOC and NOC environments; codebase theft may surface zero-days or internal architecture details usable by threat actors targeting those environments"
    sector: "technology, public-sector (monitoring infrastructure), healthcare, finance"
    cves: []
    actors_campaigns_malware: ["CoinbaseCartel", "ShinyHunters", "Scattered Spider", "LAPSUS$"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Grafana confirmed suffering a data breach, two days after a cybercrime group listed the company on its leak website."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/grafana-confirms-breach-after-hackers-claim-they-stole-data/"
      - quote: "The root cause was traced to a recently enabled GitHub Action that contained a 'Pwn Request' vulnerability, a misconfiguration in a workflow triggered on pull_request_target events that granted external contributors access to production secrets during CI runs."
        attribution: "The Hacker News (via WebSearch summary)"
        source_url: "https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html"
      - quote: "CoinbaseCartel... is described as 'an offshoot of the ShinyHunters, Scattered Spider, and LAPSUS$ ecosystems.' It focuses exclusively on data extortion rather than traditional ransomware deployment and has accumulated approximately 170 victims."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/grafana-github-token-breach-led-to.html"
    extended_notes: |
      Detection path: Grafana deployed canary tokens (decoy credentials) across its infrastructure; the triggered canary immediately alerted the global security team. This is a model defender practice for early-breach detection in CI/CD environments.
      Technique mapping: T1195.002 (Supply Chain Compromise: Compromise Software Supply Chain — CI workflow as attack surface), T1552.004 (Unsecured Credentials: Private Keys — GitHub token as credential), T1567 (Exfiltration Over Web Service — GitHub as exfil channel).
      Detection for defenders: Monitor GitHub audit logs for anomalous clone/download events on private repositories. Alert on workflow_run for pull_request_target events where GITHUB_TOKEN has write or repo scope. GitHub Advanced Security secret scanning alerts on detected tokens. EDR: parent process chain node/npm/git pull with unusual child spawning curl commands to external hosts.
      Hardening: Audit all pull_request_target workflows — ensure no privileged steps run on untrusted code. Use permissions: read-all at workflow level and explicitly elevate only as needed. Use actions/checkout@v4 with no --token for untrusted forks. Never pass repository secrets to workflows triggered by fork pull requests. Configure CODEOWNERS and require approval before CI runs on external PRs.

  - title: "BigBlueButton < 3.0.21/3.0.23: three security flaws enable session hijacking, API checksum bypass, and SSRF in EU academic/government virtual classrooms (CVE-2026-46351, CVE-2026-46353, CVE-2026-46404)"
    sources:
      - url: "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h"
        publisher: "BigBlueButton GitHub Security Advisory (GHSA-7959-pf2v-xc4h)"
        date: "2026-05-17"
        role: "primary"
      - url: "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-43hc-5g2m-cqff"
