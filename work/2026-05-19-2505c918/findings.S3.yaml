  - title: "INTERPOL Operation Ramz — first MENA-region cybercrime sweep: 201 arrested, 53 servers seized, phishing-as-a-service infrastructure dismantled across 13 countries"
    sources:
      - { url: "https://www.interpol.int/en/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region", publisher: "INTERPOL", date: "2026-05-18", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/05/18/interpol-mena-cybercrime-operation-ramz-201-arrests/", publisher: "Help Net Security", date: "2026-05-18", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/05/interpol-operation-ramz-disrupts-mena.html", publisher: "The Hacker News", date: "2026-05-18", role: "corroborating" }
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item: INTERPOL Operation Ramz) → primary: INTERPOL press release, URL https://www.interpol.int/en/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/05/18/interpol-mena-cybercrime-operation-ramz-201-arrests/"
    summary: |
      INTERPOL's Operation Ramz ran October 2025 through 28 February 2026 across 13 MENA countries (Algeria, Bahrain, Egypt, Iraq, Jordan, Lebanon, Libya, Morocco, Oman, Palestine, Qatar, Tunisia, UAE), yielding 201 arrests and identification of 382 further suspects. Authorities seized 53 servers and identified 3,867 victims. The operation neutralised a phishing-as-a-service infrastructure in Algeria (server, computer, hard drives containing phishing software and scripts), disrupted malware delivery networks, and exposed a human-trafficking-linked financial fraud scheme in Jordan where 15 individuals forced into cybercrime were rescued. Moroccan authorities seized computers, smartphones, and hard drives containing banking data and phishing tools; three individuals are undergoing judicial procedures. Intelligence was coordinated via ~8,000 disseminated data points. Industry partners contributing threat intelligence included Group-IB, Kaspersky, the Shadowserver Foundation, Team Cymru, and TrendAI. Operation Ramz is notable as the first cyber operation of this scale coordinated by INTERPOL specifically targeting the MENA region. It was partially funded by the European Union and Council of Europe under the CyberSouth+ project. Defender relevance: the operation confirmed active phishing-as-a-service infrastructure in the region, with banking-data harvest as a primary goal. Organisations processing payments or operating in North African or Gulf markets should treat phishing-as-a-service as a persistent commodity threat.
    ch_eu_nexus: "EU-funded operation (CyberSouth+ project) with Council of Europe involvement; indirectly relevant to EU financial institutions processing MENA payments"
    public_sector_nexus: "indirect — EU-funded law enforcement cooperation; public-sector payment infrastructure in scope"
    sector: "finance, public-sector, law-enforcement"
