  - title: "Fast16 — Symantec and Carbon Black confirm contemporaneous-with-Stuxnet nuclear simulation sabotage tool; hook engine targets LS-DYNA and AUTODYN uranium-compression simulations at density > 30 g/cm³"
    sources:
      - { url: "https://www.security.com/blog-post/fast16-nuclear-sabotage", publisher: "Broadcom Security (security.com)", date: "2026-05-18", role: "primary" }
      - { url: "https://thehackernews.com/2026/05/pre-stuxnet-fast16-malware-tampered.html", publisher: "The Hacker News", date: "2026-05-18", role: "corroborating" }
      - { url: "https://www.zetter-zeroday.com/experts-confirm-the-fast16-malware-was-sabotaging-nuclear-weapons-tests-likely-in-iran/", publisher: "Kim Zetter / ZERO DAY", date: "2026-05-16", role: "investigative-primary" }
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item: Pre-Stuxnet Fast16 Malware Tampered with Nuclear Weapons Simulations, 2026-05-18) → primary: Broadcom Security blog, URL https://www.security.com/blog-post/fast16-nuclear-sabotage → investigative-primary: Kim Zetter / ZERO DAY, URL https://www.zetter-zeroday.com/experts-confirm-the-fast16-malware-was-sabotaging-nuclear-weapons-tests-likely-in-iran/"
    summary: |
      Broadcom's Symantec and Carbon Black teams published a technical analysis on 2026-05-18 confirming that fast16 — a Lua-based sabotage framework first disclosed by SentinelOne in April 2026 — was contemporaneous with Stuxnet (not strictly pre-dating it as earlier reporting claimed) and specifically engineered to corrupt uranium-compression simulations targeting Iranian nuclear weapons testing. The malware's hook engine selectively intercepts execution inside LS-DYNA and AUTODYN (high-explosive simulation codes used for weapons design) and activates only when the simulated material density exceeds 30 g/cm³ — the threshold achievable only under implosion shock-compression conditions relevant to weapons-grade uranium. The architecture consists of three components: (1) a service binary embedding an early Lua 5.0 virtual machine; (2) a boot-start filesystem driver intercepting executable code as it is read from disk; (3) a rule-driven hook engine rewriting specific instruction sequences inside the narrowly targeted simulation application. Unlike Stuxnet, fast16 fed false output data to nuclear engineers rather than physically disrupting centrifuges — the sabotage goal was to make detonation simulations appear to fail, thereby misleading weapons designers. Kim Zetter's investigative analysis (ZERO DAY, 2026-05-16) corrects earlier framing: fast16 did not predate Stuxnet's 0.5 build by two years as claimed by SentinelOne's April presentation — it was contemporaneous, and was aimed at test-simulation sabotage rather than physical weapon alteration. Defender relevance: this is historical attribution research, not an active threat. However, it documents the first known use of a filesystem-level hook engine to corrupt scientific simulation output — a sabotage technique class distinct from data exfiltration or denial-of-service that defenders of research computing environments should model in threat frameworks.
    ch_eu_nexus: "historical/geopolitical research; no direct CH/EU operational threat"
    public_sector_nexus: "indirect — research computing infrastructure at national laboratories"
    sector: "defense, research, critical-infrastructure"
    cves: []
    actors_campaigns_malware: ["fast16"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Fast16's hook engine is selectively interested in high-explosive simulations inside LS-DYNA and AUTODYN, and the malware checks for the density of the material being simulated and only acts when that value passes 30 g/cm³, the threshold uranium can only be reached under the shock compression of an implosion device."
        attribution: "Broadcom Security (security.com)"
        source_url: "https://www.security.com/blog-post/fast16-nuclear-sabotage"
      - quote: "Fast16 didn't predate Stuxnet but was contemporaneous with it. It also wasn't aimed at altering nuclear weapons but was simply feeding false data to engineers about the nuclear detonation tests they were conducting, in order to trick them into believing the tests were failing."
        attribution: "Kim Zetter / ZERO DAY"
        source_url: "https://www.zetter-zeroday.com/experts-confirm-the-fast16-malware-was-sabotaging-nuclear-weapons-tests-likely-in-iran/"

  - title: "UPDATE: TeamPCP / Mini Shai-Hulud — Checkmarx Jenkins AST Plugin trojanised (third compromise in three months); PCPJack rival worm confirmed; NHS England issues first government alert"
    sources:
      - { url: "https://isc.sans.edu/diary/rss/32994", publisher: "SANS Internet Storm Center", date: "2026-05-18", role: "primary" }
      - { url: "https://checkmarx.com/blog/ongoing-security-updates/", publisher: "Checkmarx", date: "2026-05-12", role: "vendor-advisory" }
      - { url: "https://www.sentinelone.com/labs/cloud-worm-evicts-teampcp-and-steals-credentials-at-scale/", publisher: "SentinelOne / SentinelLabs", date: "2026-05-07", role: "corroborating" }
    discovery_trace: "first seen at: isc.sans.edu feed, URL https://isc.sans.edu/rssfeed.xml (item: TeamPCP Supply Chain Campaign: Activity Through 2026-05-17, 2026-05-18) → primary: SANS ISC diary, URL https://isc.sans.edu/diary/rss/32994 → vendor advisory: Checkmarx, URL https://checkmarx.com/blog/ongoing-security-updates/ → corroborating: SentinelLabs PCPJack, URL https://www.sentinelone.com/labs/cloud-worm-evicts-teampcp-and-steals-credentials-at-scale/"
    summary: |
      The SANS ISC 2026-05-18 update by Kenneth Hartman synthesises two significant in-window developments in the TeamPCP supply chain campaign. First, on 2026-05-11, Checkmarx officially confirmed the trojanising of its Jenkins AST Scanner plugin (version 2026.5.09), with a compromise window of 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC — this is TeamPCP's third confirmed Checkmarx intrusion in three months. The initial compromise vector was the March 2026 Trivy supply chain attack (exfiltration confirmed March 30; LAPSUS$ published data April 25 — confirming a Checkmarx → TeamPCP → LAPSUS$ hand-off chain). The malicious Jenkins plugin version was installed by hundreds of Jenkins controllers before removal; remediated builds 2.0.13-848 and 2.0.13-847 (both 2026-05-09) are safe. CxSAST on-premise was not affected; only the cloud-integrated components (Jenkins plugin, GitHub Actions `checkmarx/ast-github-action`, `checkmarx/kics-github-action`, VS Code extensions) were trojaned. Second, on 2026-05-07, SentinelLabs disclosed PCPJack — a rival cloud worm that evicts TeamPCP artifacts before harvesting credentials, scanning for exposed Docker, Kubernetes, Redis, MongoDB, and RayML services and exploiting five CVEs: CVE-2025-29927 (Next.js middleware auth bypass), CVE-2025-55182 (Next.js Server Actions deserialization), CVE-2026-1357 (WPVivid arbitrary file upload), CVE-2025-9501 (W3 Total Cache RCE), CVE-2025-48703 (CentOS Web Panel command injection). PCPJack achieves persistence via `bootstrap.sh` on Docker/Redis/RayML targets, with privileged-container host escape for Docker. SentinelLabs assesses with moderate confidence that PCPJack may be a former TeamPCP affiliate. NHS England issued the campaign's first formal government alert (SANS ISC does not specify the URL of the NHS England advisory). Detection: audit Jenkins for plugin versions outside the known-safe SHA range; inspect `.vscode/tasks.json` and `~/.claude/settings.json` on developer endpoints for injected persistence hooks (from the npm worm wave); review CI/CD logs for Checkmarx plugin invocations during 2026-05-09 01:25–08:47 UTC. Hardening: pin package versions, verify lockfile hashes against known-good baseline; the first confirmed npm supply chain attack with valid SLSA Build Level 3 provenance means attestation checks alone no longer suffice.
    ch_eu_nexus: "global; affects any organisation using Checkmarx Jenkins AST plugin, GitHub Actions checkmarx integrations, or exposed cloud/K8s services"
    public_sector_nexus: "high — public-sector CI/CD pipelines using Checkmarx AST scanner are in scope"
    sector: "technology, software-development, public-sector"
    cves: [CVE-2025-29927, CVE-2025-55182, CVE-2026-1357, CVE-2025-9501, CVE-2025-48703]
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud", "PCPJack"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-05-13
    evidence:
      - quote: "Checkmarx officially confirmed that a tampered plugin (version 2026.5.09) had been published to the Jenkins Marketplace, with an exposure window of 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC. This is the third TeamPCP compromise of Checkmarx in three months."
        attribution: "SANS Internet Storm Center (Kenneth Hartman)"
        source_url: "https://isc.sans.edu/diary/rss/32994"
      - quote: "PCPJack, a cloud worm that scans for exposed Docker, Kubernetes, Redis, MongoDB, and RayML services, exploits five vulnerabilities for initial access ... then kills TeamPCP processes and removes TeamPCP artifacts before harvesting npm, GitHub, and cloud credentials."
        attribution: "SANS Internet Storm Center (Kenneth Hartman)"
        source_url: "https://isc.sans.edu/diary/rss/32994"
      - quote: "We are aware that a modified version of the Checkmarx Jenkins AST plugin was published to the Jenkins Marketplace."
        attribution: "Checkmarx"
        source_url: "https://checkmarx.com/blog/ongoing-security-updates/"

  - title: "Four malicious npm packages (Phantom Bot DDoS + SSH/cloud-credential infostealers) published by single actor exploiting open-sourced Shai-Hulud worm code"
    sources:
      - { url: "https://thehackernews.com/2026/05/four-malicious-npm-packages-deliver.html", publisher: "The Hacker News", date: "2026-05-18", role: "primary" }
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item: Four Malicious npm Packages Deliver Infostealers and Phantom Bot DDoS Malware, 2026-05-18) → primary (no further pivot — OX Security analysis cited in THN article)"
    summary: |
      OX Security researchers identified four malicious npm packages published by the same actor (npm user `deadcode09284814`), all published during the 2026-05-18 window and still available for download at time of reporting. The packages represent distinct payload classes: (1) `chalk-tempalte` — a direct clone of the Shai-Hulud open-source worm code released by TeamPCP, demonstrating immediate downstream weaponisation of open-sourced offensive tooling; (2) `axois-utils` — delivers Phantom Bot, a Golang DDoS botnet with HTTP, TCP, and UDP flood capabilities, establishing persistence on both Windows (Startup folder + scheduled task) and Linux, with C2 at `87e0bbc636999b.lhr[.]life`; (3) `@deadcode09284814/axios-util` and (4) `color-style-utils` — harvest SSH keys, environment variables, cloud credentials, system info, IP address, and cryptocurrency wallet data, exfiltrating to `80.200.28[.]28:2222` and `edcf8b03c84634.lhr[.]life` respectively. Combined downloads at time of THN reporting: approximately 3,006. The campaign validates OX Security's assessment that the open-sourcing of Shai-Hulud worm code is triggering a commodity wave of supply chain attacks requiring minimal threat-actor sophistication. Defender detection: monitor npm publish events for packages by unknown or new accounts with names closely resembling popular libraries (typosquatting: `chalk-tempalte`, `axois-utils`); watch for Phantom Bot Golang binary establishing scheduled tasks or Windows Startup folder persistence; watch for outbound connections to `.lhr[.]life` domains and `80.200.28[.]28:2222` (note: no IOC policy — this is for detection-concept awareness only, not block-list entries).
    ch_eu_nexus: "global; npm supply chain risk affects any developer environment"
    public_sector_nexus: "indirect — affects developer toolchains"
    sector: "technology, software-development"
    cves: []
    actors_campaigns_malware: ["Phantom Bot", "Shai-Hulud"]
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The actor took the code, and almost without any change at all -- uploaded a working version with its own C2 server and private key into npm. The stolen credentials are sent to the remote C2 server."
        attribution: "OX Security (via The Hacker News)"
        source_url: "https://thehackernews.com/2026/05/four-malicious-npm-packages-deliver.html"
      - quote: "Threat actors are getting even more motivated to conduct supply chain and typo-squatting, as attacks become easier to perform with the Shai-Hulud code becoming open source."
        attribution: "OX Security (via The Hacker News)"
        source_url: "https://thehackernews.com/2026/05/four-malicious-npm-packages-deliver.html"

