  - title: "INTERPOL Operation Ramz — 201 arrests, 3,867 victims, 53 servers seized in first MENA-region cyber coordinated operation (October 2025–February 2026)"
    sources:
      - url: "https://www.interpol.int/en/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region"
