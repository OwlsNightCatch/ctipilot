  - title: "7-Eleven confirms ShinyHunters breach of 600,000+ Salesforce franchise-application records (April 8, 2026); victim of broader Salesforce-targeting campaign"
    sources:
      - url: "https://www.securityweek.com/7-eleven-data-breach-confirmed-after-shinyhunters-ransom-demand/"
        publisher: "SecurityWeek"
