        role: "corroborating"
      - url: "https://www.maine.gov/agviewer/content/ag/985235c7-cb95-4be2-8792-a1252b4f8318/4fe778c0-a3a9-4dbe-8e79-2c229ac5c36b.html"
        publisher: "Maine Attorney General breach notification (7-Eleven, Inc.)"
        date: "2026-05-01"
        role: "primary regulator filing"
    discovery_trace: >
      first seen at: securityweek listing (WebFetch SecurityWeek homepage)
      → primary: SecurityWeek, URL https://www.securityweek.com/7-eleven-data-breach-confirmed-after-shinyhunters-ransom-demand/
      → corroborating: Security Affairs, URL https://securityaffairs.com/192336/data-breach/shinyhunters-hack-7-eleven-franchisee-data-and-salesforce-records-exposed.html
      → regulator primary: Maine AG, URL https://www.maine.gov/agviewer/content/ag/985235c7-cb95-4be2-8792-a1252b4f8318/4fe778c0-a3a9-4dbe-8e79-2c229ac5c36b.html
    summary: |
      7-Eleven, Inc. confirmed on or around May 18, 2026 that a cybersecurity incident occurred
      on April 8, 2026, in which an unauthorised third party accessed systems used to store franchisee
      documents. The breach was claimed by ShinyHunters on approximately April 17, 2026, listing
      over 600,000 Salesforce CRM records containing personal and corporate data from franchise
      applications. The group initially demanded a ransom with an April 21 deadline, then shifted
      to offering the data for sale at $250,000 on a hacker forum.

      7-Eleven filed a breach notification with the Maine Attorney General (via Perkins Coie LLP)
      dated May 1, 2026, confirming notification to affected individuals with 24 months of IDX
      identity theft protection and CyberScan monitoring. The Maine filing lists only 2 Maine
      residents affected, but the ShinyHunters claim covers 600,000+ records globally.

      This breach is part of a documented ShinyHunters pattern of targeting Salesforce CRM instances
      since mid-2025 via phishing, third-party integration abuse, and misconfiguration (not Salesforce
      product vulnerabilities). Other confirmed victims in this same campaign wave include Instructure
      (Canvas), Vimeo, Wynn Resorts (21,000 employees), Vercel, and Medtronic. The Coinbase Cartel
      data-theft extortion group, linked to ShinyHunters, Scattered Spider and Lapsus$ lineage,
      has listed 105 companies on its leak site since September 2025.

      Defender relevance: Salesforce orgs should audit Connected App OAuth grants (particularly
      to third-party AI SaaS integrations); review Salesforce Event Monitoring logs for bulk record
      exports (Report Export events); enforce session security policies restricting SOQL API access
      by IP range; implement Salesforce Shield for field-level encryption of franchise PII.
      MITRE T1078.004 (Cloud Accounts), T1530 (Data from Cloud Storage Object), T1567.002
      (Exfiltration to Cloud Storage).
    ch_eu_nexus: "7-Eleven operates stores across Europe (Belgium, Norway, Sweden, Denmark, Netherlands).
      EU GDPR notification obligations triggered if EU resident data is confirmed in the Salesforce
      records. ShinyHunters campaign also hit Vimeo and Medtronic which have EU operations — the
      Salesforce misconfiguration vector is highly relevant for EU organisations using Salesforce for
      CRM or partner data."
    public_sector_nexus: "indirect — private sector retail; Salesforce cloud-account compromise
      pattern is directly applicable to public-sector Salesforce deployments"
