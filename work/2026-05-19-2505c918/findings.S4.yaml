    discovery_trace: >
      first seen at: SecurityWeek homepage listing (WebFetch)
      → primary: SecurityWeek, URL https://www.securityweek.com/grafana-confirms-breach-after-hackers-claim-they-stole-data/
      → victim statement: Grafana X post, URL https://x.com/grafana/status/2055827123236171827
    summary: |
      Grafana Labs on May 18, 2026 issued an official confirmation of the CoinbaseCartel breach
      reported on May 16 in the W21 weekly brief (prior item: "Grafana Labs / CoinbaseCartel —
      Pwn-Request GitHub Actions breach; private codebase exfiltrated; ransom rejected").

      Material new disclosures in the May 18 confirmation: Grafana explicitly stated that (1)
      only source code was accessed — "no personal or customer information was stolen"; (2) the
      incident has not impacted customer systems or operations; (3) the company has decided not
      to pay the ransom. The intrusion vector was a compromised GitHub access token obtained via
      a pull_request_target misconfiguration (Pwn-Request attack vector — T1195.001 Compromise
      Software Supply Chain, CI/CD pipeline). CoinbaseCartel is attributed to the ShinyHunters /
      Scattered Spider / Lapsus$ ecosystem, active since September 2025, with 105 listed victims.

      Defender note: The Grafana codebase contains Grafana core, plugins, and agent source —
      defenders should monitor for any unofficial Grafana builds or plugin updates from non-official
      channels in the 30 days following this disclosure, as supply-chain trojanization of OSS
      monitoring agents is a plausible follow-on. GitHub Actions CI/CD pull_request_target
      misconfiguration (Pwn-Request) is the same class of attack used against multiple organisations
      this cycle — audit GitHub Actions workflow permissions with `permissions: {}` defaults and
      review `pull_request_target` trigger usage.
    ch_eu_nexus: "Grafana is widely deployed in Swiss and EU public-sector monitoring infrastructure,
      including cantonal IT, federal infrastructure, and EU member-state NOCs. No customer data
      breach confirmed, but source code availability could accelerate targeted exploit development
      against Grafana installations."
