  - title: "CISA contractor (Nightwing) exposes AWS GovCloud keys and internal credentials in public GitHub repository for six months"
    sources:
      - url: "https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"
        publisher: "Krebs on Security"
        date: "2026-05-18"
        role: "primary"
      - url: "https://gizmodo.com/the-worst-leak-that-ive-witnessed-u-s-cybersecurity-agency-leaves-its-digital-keys-out-in-public-on-github-2000760330"
        publisher: "Gizmodo"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: >
      first seen at: krebs (krebs-source-id), URL https://krebsonsecurity.com/feed/ feed listing
      → primary: Krebs on Security, URL https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/
      → corroborating: Gizmodo, URL https://gizmodo.com/the-worst-leak-that-ive-witnessed-u-s-cybersecurity-agency-leaves-its-digital-keys-out-in-public-on-github-2000760330
    summary: |
      A Nightwing government contractor (Nightwing, Dulles VA) used a public GitHub repository named
      "Private-CISA" as a personal sync mechanism between work and home machines, exposing highly
      privileged credentials for CISA/DHS infrastructure from at least November 13, 2025 until
      May 15, 2026 — approximately six months. The disclosure was surfaced by GitGuardian researcher
      Guillaume Valadon on May 15, 2026, and reported by KrebsOnSecurity on May 18.

      Exposed material includes: administrative credentials to three Amazon AWS GovCloud accounts;
      plaintext usernames and passwords in a CSV file ("AWS-Workspace-Firefox-Passwords.csv") for
      dozens of internal CISA systems; SSH keys, cloud tokens and logs; and credentials to CISA's
      internal Artifactory code-package repository ("LZ-DSO" — Landing Zone DevSecOps). The
      contractor had deliberately disabled GitHub's default secret-detection feature that would
      have blocked publication of SSH keys or other secrets. Security researcher Philippe Caturegli
      (Seralys) validated the AWS keys against live GovCloud accounts at high privilege and confirmed
      the keys remained valid for at least 48 hours after the repository was taken offline.

      Caturegli identified the Artifactory access as the highest-impact exposure: adversary access
      to CISA's build-time package repository would enable backdoor injection into any software CISA
      built, deployed, or distributed — a supply-chain attack vector of significant persistence.
      CISA stated no sensitive data was confirmed compromised but acknowledged reduced workforce
      (~one-third lost to buyouts/resignations under the Trump administration) may have degraded
      oversight of contractor behaviour.

      Technique class: T1552.001 (Credentials in Files), T1552.004 (Private Keys exposed), T1195.002
      (Supply Chain Compromise - Build Process — if Artifactory access was used). Detection angle:
      GitGuardian-style secret-scanning of public repositories; CI/CD artifact-repository audit logs;
      long-lived credential rotation policy enforcement; Sysmon/endpoint monitoring for tools used to
      disable GitHub Secrets push protection (github.com API calls to update repository settings).
      Defender hardening: enforce organisation-level GitHub push-protection with administrator lockout;
      mandate short-lived credentials (e.g., OIDC role assumption) for all contractor-facing dev
      environments; implement Artifactory access-log SIEM integration with anomaly detection on
      off-hours bulk downloads.
    ch_eu_nexus: "US-centric but directly relevant to EU/CH government CERTs, as CISA is the US
      counterpart to BSI, ANSSI, NCSC-CH — the same contractor-hygiene failure pattern affects any
      national cybersecurity agency that outsources development to contractors. EU NIS2 Article 21
      security-of-supply-chain obligations apply to equivalent national CERTs."
    public_sector_nexus: "direct — CISA is a government cybersecurity authority"
    sector: "government, cybersecurity"
