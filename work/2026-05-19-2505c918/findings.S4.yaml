        publisher: "Infosecurity Magazine"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: >
      first seen at: hackernews RSS feed (https://feeds.feedburner.com/TheHackersNews)
      → primary: INTERPOL official press release, URL https://www.interpol.int/en/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region
      → corroborating: THN article, URL https://thehackernews.com/2026/05/interpol-operation-ramz-disrupts-mena.html
      → corroborating: Infosecurity Magazine, URL https://www.infosecurity-magazine.com/news/interpol-cybercrime-crackdown-mena/
    summary: |
      INTERPOL announced on May 18, 2026 the completion of Operation Ramz — a 13-country cybercrime
      operation across the Middle East and North Africa (MENA) running October 2025 through
      February 28, 2026. The operation is described as "the first cyber operation of its scale
      coordinated by INTERPOL in the MENA region."

      Results: 201 arrests, 382 additional suspects identified, 3,867 victims identified, 53 servers
      seized, and nearly 8,000 data and intelligence pieces disseminated among participating countries.
      Participating countries: Algeria, Bahrain, Egypt, Iraq, Jordan, Lebanon, Libya, Morocco, Oman,
      Palestine, Qatar, Tunisia, UAE. Private sector partners: Group-IB, Kaspersky, Shadowserver
      Foundation, Team Cymru, TrendAI.

      Cybercrime types targeted: phishing-as-a-service (PhaaS) operations including server and hard
      drive seizures with phishing scripts; malware distribution; investment fraud platforms; and
      human-trafficking facilitated through cyber scams (15 human trafficking victims identified in
      Jordan tied to cyber fraud orchestration). Country-specific highlights include the first
      documented takedown of a PhaaS server-based operation in Algeria, and a legitimate Oman server
      in a private residence found with critical vulnerabilities and active malware infection
      (remediated with owner's awareness).

      Operational intelligence value for EU/CH: the PhaaS infrastructure takedown pattern and
      Group-IB/Team Cymru threat-intel-sharing model established in MENA is the same playbook being
      applied in European operations (e.g., EUROPOL-coordinated ops). The AlphV/AlphV-adjacent
      human-trafficking-to-cyber-scam pipeline identified in Jordan reflects the same organisational
      structure seen in Southeast Asian pig-butchering compounds. The Group-IB press release at
      https://www.group-ib.com/media-center/press-releases/operation-ramz/ and Team Cymru BusinessWire
      release provide technical detail on threat-intel data shared with INTERPOL.
    ch_eu_nexus: "INTERPOL operation; intelligence feeds shared with Europol; Group-IB and Kaspersky
      (both with EU presence) co-participant. MENA-origin PhaaS kits have targeted EU banking
      customers. Indirect but relevant for EU threat-intel sharing context."
