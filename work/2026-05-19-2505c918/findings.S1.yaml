  - title: "VMware Fusion CVE-2026-41702: TOCTOU SETUID binary race condition enables local privilege escalation to root on macOS (CVSS 7.8, no workaround)"
    sources:
      - url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37454"
        publisher: "Broadcom / VMware PSIRT"
        date: "2026-05-14"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/ivanti-fortinet-sap-vmware-n8n-patch.html"
        publisher: "The Hacker News"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews → primary: Broadcom VMSA-2026-0003, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37454 → corroborating: THN, URL https://thehackernews.com/2026/05/ivanti-fortinet-sap-vmware-n8n-patch.html"
    summary: |
      Broadcom released VMSA-2026-0003 on 2026-05-14 addressing CVE-2026-41702 (CVSS 7.8, CWE-367 TOCTOU Race Condition) in VMware Fusion 25H2 on macOS. The vulnerability is a time-of-check time-of-use race condition in a SETUID binary that ships with VMware Fusion, exploitable by a local non-administrative macOS user to escalate privileges to root. No authentication beyond a standard macOS user session is required. Broadcom confirmed no workaround exists — the only remediation is upgrading to VMware Fusion 26H1. Researcher Mathieu Farrell (@coiffeur0x90) disclosed the flaw privately. The vulnerability is particularly relevant in developer-workstation and research-lab environments where VMware Fusion is commonly deployed on macOS alongside other developer tools. No in-the-wild exploitation has been reported. The THN multi-vendor patch roundup on 2026-05-18 brought this to wider attention within the in-window period.
    ch_eu_nexus: "global macOS/VMware; affects Swiss and EU organisations deploying VMware Fusion on macOS developer workstations"
    public_sector_nexus: "indirect — relevant to IT teams using Fusion for testing/development on macOS"
    sector: "technology, enterprise IT, research"
    cves: ["CVE-2026-41702"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "VMware Fusion (CVE-2026-41702, CVSS 7.8) has TOCTOU vulnerability enabling privilege escalation; no workarounds exist — only remediation is patch to Fusion 26H1"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/ivanti-fortinet-sap-vmware-n8n-patch.html"
      - quote: "The attack requires only local, non-administrative user privileges; a malicious actor already present on the machine could exploit this flaw to escalate privileges to root"
        attribution: "Broadcom VMSA-2026-0003 (via WebSearch corroboration)"
        source_url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37454"
    extended_notes: |
      MITRE ATT&CK: T1068 Exploitation for Privilege Escalation (TOCTOU). Detection: macOS Unified Log — search for suid binary execution from non-privileged user context (log stream --predicate 'eventMessage contains "vmware"'). EDR: parent process of unexpected root-level process being a standard-user shell. Hardening: Upgrade VMware Fusion 25H2 to 26H1 immediately. No workaround available.

