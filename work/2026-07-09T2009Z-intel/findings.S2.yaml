items:
  - title: "NCSC-CH update: Microsoft ships the fix for \"RoguePlanet\" (CVE-2026-50656), the Nightmare Eclipse researcher's unpatched Defender-engine privilege-escalation zero-day"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12622", publisher: "NCSC-CH / GovCERT.ch Cyber Security Hub", date: "2026-07-09", role: "primary" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656", publisher: "Microsoft Security Response Center", date: "2026-07-08", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12622 (fetched via `python3 tools/fetch_source.py ncsc-csh recent 15`) → primary: Microsoft MSRC, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656 (fetched via `python3 tools/fetch_source.py msrc cve CVE-2026-50656`)"
    summary: |
      NCSC-CH's running tracker post on the "Nightmare Eclipse" (aka Chaotic Eclipse) researcher's 2026 zero-day PoC-drop series was updated on 2026-07-09 to record that a CVE has finally been assigned to RoguePlanet: CVE-2026-50656, a local privilege-escalation vulnerability (CWE-59, Improper Link Resolution Before File Access / "link following") in the Microsoft Malware Protection Engine that underpins Microsoft Defender, System Center Endpoint Protection and Microsoft Security Essentials. The researcher originally disclosed RoguePlanet as an unpatched zero-day on 2026-06-10, describing "a race condition within Microsoft Defender" that lets a local attacker "execute arbitrary code or spawn a command shell with SYSTEM-level privileges" — at that point NCSC-CH logged the exploitation status as "Proof of Concept Available, no patch available." MSRC's own record shows the CVE itself was actually first published 2026-06-16 (CVSS 3.1 7.8, AV:L/AC:L/PR:L/UI:N, "Exploitation More Likely") and remained in "no fix" status for over three weeks; a second MSRC revision dated 2026-07-08 confirms Microsoft has now shipped an engine update that closes the hole. Affected/patched versions are stated to vendor precision: last vulnerable Malware Protection Engine build 1.1.26050.11, first fixed build 1.1.26060.3008. Because the Malware Protection Engine typically auto-updates multiple times a day, most estates will already be current, but any environment where engine updates are pinned, WSUS-gated, air-gapped, or centrally deferred (System Center Endpoint Protection deployments, offline/segmented OT-adjacent networks) should explicitly verify the installed engine version rather than assume auto-remediation occurred. The researcher has separately threatened a further zero-day release on 14 July 2026, and two other PoCs from the same series (GreenPlasma/CVE-2026-50507 CTFMON LPE, and the BitLocker/WinRE bypass GreatXML) remain without a confirmed vendor fix as of this NCSC-CH update.
    region_nexus: "Switzerland (surfaced and tracked by NCSC-CH/GovCERT.ch as part of an ongoing advisory); global impact on any Windows estate running Microsoft Defender"
