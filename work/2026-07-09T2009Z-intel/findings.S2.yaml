        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656"
    extended_notes: |
      This closes out (partially) a saga the registry already tracks under actor:nightmare-eclipse / trend:nightmare-eclipse-rogueplanet-defender-toctou-lpe-2026-06 — no prior standalone entry for RoguePlanet appears in the 14-day prior_coverage index, so this is filed as `novelty: new` rather than an explicit update_of; the main agent may fold it into the existing entity thread instead of a standalone entry if that reads better editorially. Detection concept: telemetry class is process-creation/child-process lineage — hunt for MsMpEng.exe (or the Malware Protection Engine's scanning host process) spawning an unexpected child process with SYSTEM token outside the normal signature/engine-update cadence, and for symlink/junction creation races targeting paths Defender is actively scanning. Hardening: verify the installed engine build via `Get-MpComputerStatus` (AMEngineVersion field) is >= 1.1.26060.3008; do not rely on assumption of automatic update on WSUS-gated, offline, or OT-adjacent Windows estates.
    borderline: true
    borderline_reason: "narrow single-host LPE closure story (not new active exploitation, not itself sector-targeted) — included because it is a home-region-authority (NCSC-CH) in-window update on an entity the registry already actively tracks, with a threatened further zero-day release from the same actor on 2026-07-14."
