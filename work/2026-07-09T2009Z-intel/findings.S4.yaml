      - quote: "The attackers leaked roughly 44 gigabytes of stolen data online, although investigators believe they accessed significantly more information than they ultimately published."
        attribution: "The Record"
        source_url: "https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware"
      - quote: "Uzbrucēja nopludinātā informācija sasniedz 44 Gb, bet uzbrukumā potenciāli iegūto datu apjoms visticamāk ir lielāks. (\"The attacker's leaked data reaches 44 GB, but the potentially obtained data volume is likely larger.\")"
        attribution: "CERT.LV"
        source_url: "https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija"
    extended_notes: |
      The CERT.LV advisory also confirms that election-related code LVM had developed (enhancements to the Electronic Online Voter Register, ETVR) was stored in isolated environments and shows no sign of tampering — relevant to defenders tracking election-infrastructure integrity claims. No CVE, product name, or confirmed initial-access vector (internet-facing exploit vs. phishing) has been published by either party; treat "unpatched two years" as a generic hygiene lesson, not an actionable IOC.
    priority_hint: notable

  - title: "\"Helix\" — a newly identified vishing + device-code-phishing extortion group runs an automated SharePoint enumeration playbook linked to the BlackFile/ShinyHunters lineage"
    sources:
      - { url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem", publisher: "ReliaQuest Threat Research", date: "2026-07-08", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/", publisher: "BleepingComputer", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer listing (webfetch), URL https://www.bleepingcomputer.com/news/security/ → drill: https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/ → primary: ReliaQuest Threat Spotlight, URL https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
    summary: |
      ReliaQuest identified a previously unreported data-extortion group it names "Helix," running an identity-based kill chain against SharePoint/M365 tenants that ReliaQuest assesses (based on shared registrar, kill-chain similarity, hosting-infrastructure proximity, and timing — not confirmed attribution) as an extension of, or an adjacent operator borrowing the playbook of, the now-defunct BlackFile (UNC6671) and ShinyHunters (UNC6661) ecosystem. The kill chain: reconnaissance builds a convincing pretext (org chart, direct-report names) for a vished call in which the operator impersonates the target's own manager by name/caller-ID spoofing; the call walks the victim through a device-code authentication flow in the browser, which sidesteps Conditional Access policies and captures a session token without the victim ever disclosing a password. Within minutes of sign-in, the operator registers a new MFA authenticator app on the account for persistence — a legitimate-looking artifact indistinguishable from normal user activity without correlation. Dwell before exfiltration varied from under an hour to over a week across incidents, but the automated collection phase was identical every time: the operator issues `contentclass:STS_Site` and wildcard (*) SharePoint searches to inventory all reachable content via the `python-requests/2.28.1` library, then bulk-downloads from a dedicated exfiltration source distinct from the one used for initial sign-in — an operational-security separation ReliaQuest flags as the most reliable fingerprint across incidents. Named prior victims tied to the same tradecraft lineage include Medtronic, Nissan, Kodak and Nottingham University (UK) — Nottingham gives this a direct European higher-education/public-sector data point. Sign-ins consistently originated from unmanaged endpoints via residential proxies geo-matched to the target's city, defeating impossible-travel detections.
    region_nexus: "Global extortion ecosystem (BlackFile/ShinyHunters lineage) with a confirmed UK higher-education victim (Nottingham University) among the tradecraft-linked incidents; the identity-based technique (device-code phishing against M365/SharePoint) is directly transferable to any Swiss/EU public-sector or CI tenant running Microsoft 365"
    primary_sector_nexus: "indirect"
    sector: "public-sector, education (cross-sector — any M365/SharePoint tenant)"
    cves: []
    techniques: [T1656, T1528, "T1098.005", "T1213.002", "T1078.004"]
    affected_products: ["Microsoft SharePoint (Online/M365)", "Microsoft Entra ID (device-code authentication flow)"]
    entity_keys: ["actor:unc6671", "actor:shinyhunters"]
    new_entities:
      - { key: "actor:helix-extortion-group", type: actor, name: "Helix", aliases: [],
          summary: "Data-extortion group identified by ReliaQuest (2026-07-08) running vishing + device-code-phishing + automated SharePoint enumeration; assessed as likely linked to the BlackFile (UNC6671)/ShinyHunters (UNC6661) ecosystem via shared registrar, hosting proximity and kill-chain overlap, not confirmed attribution." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "ReliaQuest identified a previously unreported group, \"Helix,\" running a multi-target data extortion campaign that uses vishing, device code phishing, and automated SharePoint exfiltration—all built on shared infrastructure."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
      - quote: "Disabling device code authentication is the single highest-impact action."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
      - quote: "The operator issued contentclass:STS_Site and wildcard (*) SharePoint searches to inventory all reachable content, then bulk-downloaded from the same IP and user-agent."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
    extended_notes: |
      Detection correlation window: ReliaQuest notes the fastest confirmed incident went from unfamiliar sign-in to new MFA registration to automated SharePoint enumeration to bulk download inside one hour — any SIEM/XDR correlation rule stitching those four signal classes together in a short window is the actionable detection concept here, not any single alert. Hardening priority order per ReliaQuest: (1) disable device-code auth flow entirely, or restrict to a narrow set of managed devices; (2) require device compliance/domain-join via Conditional Access for SharePoint/Exchange and other sensitive SaaS; (3) block newly registered domains at the DNS/proxy layer (the phishing domain used target-specific subdomains under one parent domain, a pattern common to this whole extortion ecosystem, not unique to Helix).
    priority_hint: high

  - title: "Nextcloud GmbH's own hosting infrastructure (not the OSS product or customer instances) leaked 367,000 internal records, including a German state-ministry's employee emails and client setup scripts with hardcoded database credentials"
    sources:
      - { url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/", publisher: "Cybernews (discovering researchers)", date: "2026-07-08", role: "primary" }
      - { url: "https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html", publisher: "heise online", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: inside-it.ch RSS feed (bridge:feed), URL https://www.inside-it.ch/rss.xml (item title \"Datenleck bei Nextcloud\", link https://www.inside-it.ch/datenleck-bei-nextcloud-20260709 — article body 403'd on both direct WebFetch and jina-reader escalation, not citable) → pivot: WebSearch (\"Nextcloud data leak 367000 records exposed\") → primary: Cybernews, URL https://cybernews.com/security/nextcloud-cloud-provider-data-leak/ → corroborating: heise online, URL https://www.heise.de/en/news/Open-database-Nextcloud-GmbH-fixes-potential-data-leak-11358446.html"
    summary: |
      Cybernews researchers discovered a publicly exposed Elasticsearch cluster (~7.92 GB, 367,000 records) belonging to Nextcloud GmbH's own hosting infrastructure on 18 May 2026; Nextcloud closed access within two days of notification (27 May) and the story was first published on 8 July 2026 (picked up by heise online same day and Swiss outlet inside-it.ch on 9 July). Nextcloud states, and Cybernews corroborates, that the exposure was confined to a misconfiguration of Nextcloud GmbH's own hosting infrastructure and did NOT affect the Nextcloud open-source software or any customer-operated/partner-operated Nextcloud servers — an important scope distinction given Nextcloud is positioned as a core component of "Euro-Office," the EU's sovereign-cloud alternative to Microsoft 365/Google Workspace. The exposed, unencrypted records include invoices Nextcloud sent to and received from clients (revealing client company names/addresses and both Nextcloud and client staff email addresses), signed service-provider contracts, raw .eml email files, beta-feature signup lists, and — most operationally significant — shell and Python scripts written to set up and manage client Nextcloud deployments, some of which contain hardcoded database credentials. Cybernews specifically identified German government institution MSB NRW (Ministry of Schools and Education of the State of North Rhine-Westphalia) among the exposed client email domains, alongside hosting providers IONOS and STRATO. Nextcloud says it found no evidence the exposed data was actually accessed by a third party and notified the relevant German state data-protection authority.
    region_nexus: "Germany (Nextcloud GmbH headquartered there; a German state government ministry — MSB NRW — is a named exposed client); Nextcloud's positioning as a sovereign-cloud public-sector supplier across the EU (including Swiss public-sector deployments) makes this directly relevant to constituency technology-supplier exposure even absent a confirmed exploitation event"
    primary_sector_nexus: "indirect"
    sector: "public-sector (technology supplier to government/education clients)"
    cves: []
    techniques: ["T1552.001", "T1589"]
    affected_products: ["Nextcloud GmbH corporate hosting infrastructure (Elasticsearch) — explicitly NOT the Nextcloud Server open-source product or customer-hosted instances"]
    entity_keys: []
    new_entities:
      - { key: "incident:nextcloud-gmbh-hosting-misconfiguration-leak-2026", type: incident, name: "Nextcloud GmbH hosting-infrastructure data exposure", aliases: [],
          summary: "Misconfigured Elasticsearch cluster on Nextcloud GmbH's own corporate hosting infrastructure exposed 367,000 internal records (invoices, contracts, client setup scripts with hardcoded DB credentials, staff/client emails), discovered by Cybernews 2026-05-18, closed 2026-05-27, publicly reported 2026-07-08; does not affect the Nextcloud OSS product or customer-run instances." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Nextcloud exposed 367,000 internal records after a hosting misconfiguration left an Elasticsearch database publicly accessible."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
      - quote: "The issue was caused by a misconfiguration of our hosting infrastructure and is not related to the Nextcloud solution. No other Nextcloud servers belonging to our customers, partners or other users have been affected by this issue"
        attribution: "Nextcloud GmbH (quoted by Cybernews)"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
      - quote: "among the external email domains, the team found IONOS and STRATO, two established web hosting providers, as well as German government institutions, such as MSB NRW (Ministry of Schools and Education of the State of North Rhine-Westphalia)."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/nextcloud-cloud-provider-data-leak/"
    extended_notes: |
      Downstream risk for defenders whose org is a Nextcloud client: the exposed setup scripts with hardcoded database credentials are described by Cybernews as insufficient alone to fully penetrate client systems but potentially useful to "uncover system vulnerabilities" in client deployments — organizations that engaged Nextcloud GmbH for managed setup work between an unspecified period and May 2026 may want to confirm with Nextcloud whether their own deployment-specific scripts/credentials were among the exposed index, and rotate any credentials that could have been hardcoded in vendor-supplied setup tooling.
    priority_hint: notable

