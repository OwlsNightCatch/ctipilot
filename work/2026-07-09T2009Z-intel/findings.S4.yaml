items:
  - title: "Ransomware attack on Latvia's state forestry company LVM exploited a two-year-unpatched system; same actor also hit a second Latvian critical-infrastructure operator"
    sources:
      - { url: "https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware", publisher: "The Record (Recorded Future News)", date: "2026-07-09", role: "primary" }
      - { url: "https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija", publisher: "CERT.LV (Latvia national CERT)", date: "2026-06-26 (updated 2026-07-03)", role: "primary" }
    discovery_trace: "first seen at: therecord (webfetch), URL https://therecord.media/ → drill: https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware → primary: CERT.LV advisory, URL https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija"
    summary: |
      Latvijas Valsts Meži (LVM), Latvia's state-owned forestry company, is still restoring systems weeks after a ransomware attack first disclosed in late June 2026; CERT.LV (Latvia's national CSIRT) and The Record both describe the intruder as a foreign, financially motivated group that CERT.LV says continues probing Latvian networks and is active against NATO/EU targets generally — no specific actor name has been published. The attacker exploited a vulnerability in a system that had gone without updates for two years and remained undetected inside the network for over a week before deploying ransomware, taking down LVM's mapping platform (LVM GEO), its hunting-permit application (Mednis), and contractor/customer information-exchange systems; roughly two-thirds of customers with service contracts still lack access. ~44 GB of internal documents, emails, source-code repositories, digital certificates, cryptographic keys and password hashes were leaked, though CERT.LV assesses the attacker exfiltrated more than it published. LVM refused the ransom demand. CERT.LV separately confirms the same threat actor also compromised AS Olpha (formerly Olainfarm), which it explicitly designates a critical-infrastructure provider, gaining unauthorized access to at least one server and deleting audit logs there — establishing a multi-victim pattern against Latvian state and critical-infrastructure entities from one actor. Neither CERT.LV nor LVM has disclosed the specific CVE or whether the initial-access vector was internet-facing exploitation versus phishing; CERT.LV's advisory only states generically that "most cyber attacks occur using publicly accessible information system vulnerabilities or phishing attacks."
    region_nexus: "Latvia (EU/NATO member state); CERT.LV explicitly frames the actor as active against NATO and EU-member targets generally, and a second Latvian critical-infrastructure operator (Olpha) was compromised by the same actor — directly within the Swiss/EU critical-infrastructure-and-government coverage focus"
    primary_sector_nexus: "indirect"
    sector: "public-sector (state-owned enterprise), with a same-actor secondary victim CERT.LV designates critical infrastructure (pharmaceutical sector)"
    cves: []
    techniques: [T1486]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:lvm-latvia-forestry-ransomware-2026", type: incident, name: "LVM (Latvijas Valsts Meži) ransomware attack", aliases: [],
          summary: "Ransomware attack on Latvia's state forestry company LVM, exploiting a system unpatched for two years; ~44 GB leaked; same actor also compromised critical-infrastructure operator AS Olpha (CERT.LV, 2026-06-26/2026-07-03; The Record, 2026-07-09)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
