    discovery_trace: "first seen at: WebSearch (\"Cisco Talos blog post July 9 2026\") → blog.talosintelligence.com listing, URL https://blog.talosintelligence.com/ → primary: Cisco Talos vulnerability-disclosure roundup, URL https://blog.talosintelligence.com/wolfssl-vulnerabilities/ → per-CVE primaries: individual TALOS-2026-#### advisory pages (talosintelligence.com/vulnerability_reports/, jina reader used for full technical detail on each)"
    summary: |
      Cisco Talos' Vulnerability Discovery & Research team published a coordinated-disclosure roundup (2026-07-09) covering three products, all now patched per Cisco's third-party disclosure policy. In wolfSSL 5.9.1 (embedded TLS library for IoT/RTOS/embedded), two X.509 name-constraint-enforcement bugs let a subordinate CA issue certificates outside its permitted scope and have it accepted anyway: CVE-2026-28739 (CWE-295, CVSS 9.1) — the iPAddress SAN branch in DecodeGeneralName() is compiled out unless WOLFSSL_IP_ALT_NAME is defined, silently skipping any certificate carrying an iPAddress SAN; CVE-2026-25106 (CWE-295, CVSS 7.4) — ConfirmNameConstraints() iterates a fixed 5-entry GeneralName-type array that omits ASN_RID_TYPE entirely, so registeredID SANs bypass constraint checking in every build configuration. A third bug, CVE-2026-33091 (CWE-191 integer underflow, CVSS 7.5), is in PKCS#7 OtherRecipientInfo parsing (wc_PKCS7_DecryptOri): a malformed ASN.1 CMS blob underflows a size calculation, producing a heap buffer overflow with a stated path to arbitrary code execution. Separately, Talos disclosed 37 CVEs across 14 GeoVision advisories (physical-security/CCTV/access-control hardware): the most severe is CVE-2026-12486/-12849/-12850/-12851 (CWE-78 OS command injection, CVSS 9.1) in GV-I/O Box 4E 2.09's libNetSetObj.so — functions like CNetSetObj::m_F_n_Set_IP_Addr build a shell command string via sprintf() from an attacker-controlled IP/netmask/gateway/DNS value and pass it straight to system(), reachable from the network-exposed DVRSearch discovery service and the Network.cgi endpoint with no sanitisation. CVE-2026-13125 (CWE-306 missing authentication, CVSS 8.8) is in GeoWebPlayer 1.1.1.0, a browser-plugin companion shipped with GV-VMS/GV-Cloud: it opens an unauthenticated WebSocket server on localhost:9100, and any malicious webpage a victim visits can connect to it and call create + getScreenCapture to exfiltrate the user's screen content — no login, no origin check. The other 32 GeoVision CVEs span memory corruption, buffer overflow, privilege escalation, reflected XSS, a guessable session cookie, and insufficient encryption. Finally, VTK-DICOM 9.5.2 (medical-imaging library used to parse/render DICOM CT/MRI data) has CVE-2026-22879 (CWE-129 improper array-index validation, CVSS 8.1): a specially crafted DICOM file drives an out-of-bounds increment in vtkDICOMItem::FindDataElementOrInsert, corrupting heap-chunk metadata and aborting the process (confirmed crash to SIGABRT/corrupted-size-vs-prev_size in Talos's PoC) — a client-side attack surface directly relevant to hospital PACS/imaging pipelines that ingest external DICOM files.
    region_nexus: "global; GeoVision surveillance/access-control hardware and VTK-DICOM medical-imaging tooling are both in active use across Swiss/EU critical-infrastructure and healthcare facilities, and wolfSSL is embedded in a very wide range of IoT/embedded/medical devices"
    primary_sector_nexus: "indirect"
    sector: "healthcare, public-sector, energy, water, transport, finance, telco (embedded TLS + physical-security hardware span all sectors)"
