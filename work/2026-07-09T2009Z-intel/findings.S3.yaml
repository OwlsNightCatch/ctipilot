  - title: "CrowdStrike expands its prompt-injection taxonomy with 5 new techniques for compromising AI agents via trusted context data"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-prompt-injection-techniques/", publisher: "CrowdStrike", date: "2026-07-07", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"CrowdStrike Uncovers New Prompt Injection Techniques July 2026\") → primary: CrowdStrike blog, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-prompt-injection-techniques/"
    summary: |
      CrowdStrike's AI security research team added 18 new entries (5 detailed in this post) to its public prompt-injection taxonomy, now over 200 techniques, aimed at threat-modeling AI agents that can read files, browse the web, or execute commands. Trigger-Activated Rule Addition (PT0201) plants a dormant instruction that only activates once a specific keyword or condition later appears in the agent's context, evading review at ingestion time. Cognitive Token Suppression (PT0197) instructs the model to stop emitting its own safety/reasoning tokens (e.g. "no longer use <thinking> tags"), removing the internal signal that would otherwise flag a refusal-worthy request. Algorithmic Payload Decomposition (PT0200) splits a malicious instruction into individually benign-looking fragments (e.g. a list of unrelated words) that the model is induced to reassemble into an executable command. Special Token Injection (PT0198) forges the structural delimiters/role markers (e.g. a fake `<tool_call>` block) that an agent framework uses to distinguish trusted system instructions from untrusted user/tool input, confusing the boundary so injected content is treated as authoritative. Unwitting User Context-Data Injection (IM0018) hides instructions inside data a legitimate user pastes into the system from a third-party source (a CRM note, an email body, an attachment) that is later summarized or acted on by the AI agent, making the user an unwitting delivery vector. CrowdStrike frames all five as extensions of indirect prompt injection rather than jailbreaking, and ties the taxonomy to its own Falcon AIDR product for runtime detection.
    region_nexus: "global; relevant to any organization, including public-sector bodies, piloting or deploying agentic AI/LLM tooling with file, web, or command-execution access"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco (any sector deploying agentic AI tooling)"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Prompt injection is no longer just about obvious jailbreaks."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-prompt-injection-techniques/"
      - quote: "AI threat modeling needs to include every place that model context can originate."
