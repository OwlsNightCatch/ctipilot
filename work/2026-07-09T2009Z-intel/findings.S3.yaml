    extended_notes: |
      No ATT&CK technique IDs apply (prompt injection against LLM agents sits in MITRE ATLAS, not core ATT&CK, so `techniques` is left empty rather than force-fitting an ID). Single-vendor blog with a product plug for Falcon AIDR attached; included because the five technique descriptions are concrete enough (mechanism + example payload shape) to inform an org's own AI-agent threat model, not because of the vendor's product claims. Published 2026-07-07, so carried as a developing-story item within the 72h allowance.
