items:
  - title: "CISA/OpenPLC: authenticated arbitrary file write in the legacy web UI escalates to native code execution via the runtime's auto-compile pipeline (CVE-2026-14480, CVSS 9.9)"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-190-01", publisher: "CISA (ICS Advisory ICSA-26-190-01)", date: "2026-07-09", role: "primary" }
      - { url: "https://www.cve.org/CVERecord?id=CVE-2026-14480", publisher: "CVE.org", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: cisa-advisories, URL https://www.cisa.gov/cybersecurity-advisories/all.xml (RSS feed listing, item 'OpenPLC v3' dated day-190/2026 = 2026-07-09) → primary: CISA ICS Advisory, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-190-01 (no further pivot needed — CISA is the disclosing authority and cites the CVE.org record directly)"
    summary: |
      CISA published a fresh ICS advisory (initial release 2026-07-09, no prior revision) for OpenPLC Runtime v3, the widely deployed open-source PLC runtime used across Critical Manufacturing, Energy, Transportation Systems, and Water/Wastewater per CISA's own sector tagging. CVE-2026-14480 (CWE-73, External Control of File Name or Path) is an authenticated arbitrary file-write in the legacy web UI's program-upload workflow: the application stores an attacker-supplied filename (the `prog_file` parameter) directly into the `Programs.File` database field and later uses that value as the destination write path without validation or restriction. Because the underlying file-write call (Python `os.path.join()`) honors an attacker-controlled absolute path, any authenticated user can write arbitrary files anywhere the OpenPLC webserver process can reach. The escalation path is specific to OpenPLC's build model: all `.cpp` source files inside the runtime's core directory are automatically compiled into the executable runtime binary, so writing a malicious `.cpp` file into that directory and then triggering a normal program-compile-and-start operation (an expected operator action, not an exploit primitive) executes attacker code as the OpenPLC runtime user. CVSS 3.1 9.9 (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H), CVSS 4.0 8.7. Reported to CISA by researcher Grady DeRosa; CISA states no known public exploitation at this time. The advisory does not cite a fixed release version — CISA's only stated mitigations are the generic ICS hardening set (network segmentation, no direct internet exposure, VPN-only remote access), so treat this as unpatched until OpenPLC project guidance says otherwise.
    region_nexus: "global; OpenPLC is commonly deployed in Swiss/EU critical-infrastructure and industrial/academic environments across the additional sectors this deployment tracks (energy, water, transport)"
    primary_sector_nexus: "indirect (OT/ICS underpinning energy, water, transport — additional sectors in scope)"
    sector: "energy, water, transport, manufacturing, ics-ot"
