    extended_notes: |
      Detection concept (telemetry class first): file-integrity/creation monitoring on the OpenPLC runtime core source directory (watch for new/modified .cpp files outside normal maintainer deploys) and process-creation telemetry for the compiler toolchain (gcc/g++) being invoked by the OpenPLC webserver process or its child processes rather than by an operator-driven CI/build pipeline — parent-process lineage (webserver → compiler) is the discriminator vs. legitimate program deployment (engineer-initiated compile via authorized workstation/session). Hardening: disable/retire the legacy web UI program-upload path if not required; restrict web UI access to an out-of-band management network per CISA's standing ICS guidance; if authentication cannot be scoped to trusted operators only, treat the runtime as compromised-by-design until network isolation is enforced.
      Also reviewed in this run and DROPPED as republications of already-disclosed (non-fresh) advisories, not fresh in-window items: CISA ICSA-26-190-02 (Schneider Electric PowerChute Serial Shutdown, CVE-2026-2399 et al., CVSS 6.1 — initial disclosure 2026-04-14, today's CISA page is "Initial Republication") and ICSA-26-190-03 (Schneider Electric Easergy MiCOM Px40, CVE-2026-4832, CVSS 5.3 — initial disclosure 2026-04-14, today is CISA's third revision / republication of Schneider's CPCERT advisory).
  - title: "Compromised @injectivelabs/sdk-ts npm package (v1.20.21) hooks private-key/mnemonic derivation and exfiltrates via a legitimate-looking Injective Labs infrastructure endpoint"
    sources:
      - { url: "https://socket.dev/blog/compromised-injective-sdk-npm-package", publisher: "Socket Security", date: "2026-07-09", role: "primary" }
    discovery_trace: "first seen at: socket-dev-blog, URL https://socket.dev/blog (listing page, featured post) → primary: Socket Security, URL https://socket.dev/blog/compromised-injective-sdk-npm-package (no further pivot needed — Socket is the discovering/reporting party)"
    summary: |
      Socket Security detected a malicious release of `@injectivelabs/sdk-ts@1.20.21` published to npm on 2026-07-08 (~50,000 weekly downloads; part of Injective Labs' official TypeScript SDK). The compromise traces to commits pushed through the GitHub account of a developer with an established contribution history to the upstream `injective-ts` repo — the actor first tested access via a `test-backdoor-check` branch (2026-06-08 20:06 GMT+2), then published the malicious `1.20.21` release at 22:59 GMT+2 the same evening; the true account owner appears to have detected and reverted the compromise within roughly 40 minutes, publishing a clean version at 23:48 GMT+2, but the malicious release artifacts remained present on the GitHub Releases page and the npm package version was only deprecated (not removed) at time of Socket's writing. The actor additionally published version `1.20.21` across 17 other `@injectivelabs`-scoped packages that pin/depend on the compromised SDK version, widening blast radius to transitive consumers who never installed `sdk-ts` directly. Mechanism: the malicious code (in `dist/esm/accounts-jQ1GSgaW.js` / `dist/cjs/accounts-Cy0p4lLW.cjs`) hooks the `fromMnemonic` and `fromHex` key-derivation functions with a call to a `trackKeyDerivation` function that records the full mnemonic phrase or private-key material, base64-encodes it, and POSTs it to `https://testnet.archival.chain.grpc-web.injective.network` — a real Injective Labs-owned public endpoint, chosen specifically so the exfil traffic blends with legitimate SDK network usage. Execution is deferred to runtime (not install-time), a deliberate anti-detection choice since most supply-chain scanners key on install-script behavior.
    region_nexus: "global npm ecosystem; no confirmed Swiss/EU-specific targeting, but transferable as a live example of runtime-triggered (not install-time) npm supply-chain credential theft relevant to any CI/dependency-scanning posture"
