    borderline: true
    borderline_reason: "genuinely fresh and technically detailed runtime-triggered npm supply-chain compromise, but single-sourced (Socket only) and the affected ecosystem (Injective/crypto-wallet tooling) has no direct Swiss/EU public-sector or CI nexus stated by the source — included for the transferable technique (deferred/runtime-triggered supply-chain backdoor blending exfil with legitimate vendor infrastructure), not for sector relevance"
    evidence:
      - quote: "@injectivelabs/sdk-ts@1.20.21 records private keys and mnemonics, enabling wallet compromise via 17 scoped packages pinned to the malicious version."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/compromised-injective-sdk-npm-package"
      - quote: "The malicious code is located in /dist/esm/accounts-jQ1GSgaW.js and /dist/cjs/accounts-Cy0p4lLW.cjs files. The functions fromMnemonic and fromHex used in regular workflows to generate private keys are hooked with a call to the trackKeyDerivation function."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/compromised-injective-sdk-npm-package"
      - quote: "By using public infrastructure endpoints belonging to InjectiveLabs, the threat actor blends the network traffic generated during exfiltration with the network traffic generated during typical usage of InjectiveLabs' software products."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/compromised-injective-sdk-npm-package"
    extended_notes: |
      Detection concept: egress/DNS telemetry for build and developer workstations connecting to *.injective.network (or any vendor-owned endpoint) from a process context that does not match normal application runtime (e.g., a CI job or a backend service invoking wallet-derivation code that should never originate outbound traffic to that host) is the generalizable hook; more broadly, dependency-pinning drift (17 packages bumping to the same patch version simultaneously, all newly published) is a supply-chain-scanner signal independent of this specific vendor. Hardening: pin npm dependencies to reviewed/known-good hashes (lockfile integrity), and treat "the same maintainer account published N packages at once" as a review trigger regardless of account reputation.
