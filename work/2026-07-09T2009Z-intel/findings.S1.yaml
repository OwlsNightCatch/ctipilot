        attribution: "CISA (ICS Advisory ICSA-26-190-01)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-190-01"
      - quote: "In the default build pipeline, all C++ source files within the OpenPLC runtime core directory are automatically compiled into the executable runtime binary."
        attribution: "CISA (ICS Advisory ICSA-26-190-01)"
