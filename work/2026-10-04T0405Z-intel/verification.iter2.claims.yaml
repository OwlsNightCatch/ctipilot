claims:
  - {claim_id: 793e3cbd50, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF: 'One exploit ran end to end ... over the exposed port'; 'the chain ... does not touch the code path the vendor's indicators watch'. CP blog: 'handful of pinpointed attacks on July 23, 2026'."}
  - {claim_id: 6dd1dde94d, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF: 'chain we validated does not touch the code path the vendor's indicators watch'; sk1000171: 'aware of a handful of customers who have been attacked'; TCP/19009 Trusted Clients mitigation."}
  - {claim_id: 793e4ca964, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "sk1000171 lists R82.20 Security Hotfix and Jumbo HFA; 'a LivePatch is not be available for this issue'."}
  - {claim_id: 4e299eebea, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "sk1000171: 'Make sure that access to port TCP/19009 is only possible from Trusted IP addresses ... Trusted Clients'."}
  - {claim_id: 21a7da61eb, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF Hunting IoCs: '/etc/cron.d', 'authorized_keys', '/opt/CPupgrade-tools-*/jars/' normally empty, CPM config files, 'Anything new under $FWDIR/conf/SMC_Files'; 'plan for credential and certificate rot"}
  - {claim_id: 96aae67655, verdict: F3, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "Quoted 'execute a script from an arbitrary path and load an arbitrary Java class' is absent from sk1000171 (it says 'upload and execute arbitrary scripts'); the words are on the Check Point Research b"}
  - {claim_id: dcebb82077, verdict: ok, source_url: "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/", passage: "'we observed a handful of pinpointed attacks on July 23, 2026'; 'CVE-2026-93616 is a newly discovered zero-day vulnerability in Security Management'."}
  - {claim_id: 1fbe34e55c, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "'Because of the nature of the fix, a LivePatch is not be available for this issue.'"}
  - {claim_id: 87fdcb1044, verdict: ok, source_url: "https://thehackernews.com/2026/09/check-point-warns-of-management-server.html", passage: "'Check Point says those LivePatch takes [28, 29] do not fix CVE-2026-93616'; separate flaw CVE-2026-91843 fixed via LivePatch."}
  - {claim_id: 11edb1c7e8, verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "KEV record CVE-2026-93616 dateAdded 2026-09-22 (fetched live 2026-10-04, catalogVersion 2026.10.02)."}
  - {claim_id: a3a64f86cc, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF: 'Execution runs as root inside the process that holds your policy and internal CA ... plan for credential and certificate rotation'."}
  - {claim_id: 52c64ded3a, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "sk1000171: Affected Products list; 'Not Affected: Smart-1 Cloud (fix is already applied), Check Point Firewall Appliances, Check Point Spark Firewall'."}
  - {claim_id: dcd09d8b36, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "sk1000171 Affected Versions list matches (R82.20; R82.10 Take 44 or lower; R82 126; R81.20 166; R81.10 190 EoS; R80-R81 EoS)."}
  - {claim_id: c47d488b88, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "sk1000171: R82.20 Security Hotfix; Jumbo HFA R82.10 from Take 45, R82 from 127, R81.20 from 170, R81.10 from 192."}
  - {claim_id: 71867d99da, verdict: F5, source_url: "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/", passage: "Sentence about CVE-2026-85102 (disclosed 9 Sep, 'now confirmed under active exploitation since 2026-09-12') carries no inline citation; CP blog says exploitation attempts observed from September 12."}
  - {claim_id: 3faf4ab13a, verdict: F5, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "Whole 'Detection concept' paragraph has no inline citation; indicator details are sk1000171's (username >1000 chars + core dump; ReflectionUtils 'Failed to load allResourceFiles map') and BF's."}
  - {claim_id: 2f4a5c4a97, verdict: F5, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "Triage sentence in the same uncited paragraph; supportable by sk1000171 (core dump at same time) and BF ('weak net both ways') but no inline citation."}
  - {claim_id: 044c7357e0, verdict: F5, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "Hardening sentence uncited; sk1000171 Mitigation: 'Make sure that access to port TCP/19009 is only possible from Trusted IP addresses'; 'only mitigation' is the entry's reading."}
  - {claim_id: 1eeae0a625, verdict: ok, source_url: "https://support.checkpoint.com/results/sk/sk1000171/", passage: "Derived takeaway consistent with sk1000171 'Installing the fix does not show' (THN) and CP blog July 23 timeline."}
  - {claim_id: e97e2f6ef2, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF TL;DR/Summary: 'reproduced the attack end to end against unpatched R81.10 and R82.10 lab servers ... Every step runs over one port, TCP 19009'."}
  - {claim_id: 7fd49c3889, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF Weaponizing: loginNew accepts '<application>,CN=<dn>' without checking a certificate; write to /etc/cron.d/raid-check; 'No trigger request is needed'; output read back over the same session."}
  - {claim_id: 6b960579cf, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF: 'We confirmed additional attack vectors from the same write primitive' (two listed); 'Closing any single one would leave the others standing.'"}
  - {claim_id: bdf67428aa, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF The Patch: three fixes (dleserver.jar login, java_is.jar write, upgrade_web_services targetVersion); 'Either fix alone breaks the chain'; advisory names two."}
  - {claim_id: 647afa3052, verdict: ok, source_url: "https://github.com/BishopFox/CVE-2026-93616-check", passage: "README: 'does not detect prior compromise. For compromise indicators, see the sk1000171 advisory'; BF: 'reports patch state from outside with one benign request'."}
