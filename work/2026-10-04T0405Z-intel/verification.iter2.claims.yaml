  - {claim_id: e1156cffb3, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF: 'The second is a permissions setting, not a rule base entry, so a rule base audit alone can miss it.'"}
  - {claim_id: b2011a4af1, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "BF links only the detection tool; the PoC script is mentioned ('Our proof-of-concept script returned uid=0') but not linked."}
  - {claim_id: 6914180c1a, verdict: ok, source_url: "https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616", passage: "Inference follows BF: second indicator 'leaves neither the ERROR line nor a ../' on the validated route."}
