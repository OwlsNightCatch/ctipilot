    text: "Quick-commerce grocery delivery service Flink (Germany, also operating in the Netherlands) confirmed a breach of an internal order-management system; after Flink refused a cryptocurrency ransom, the little-known extortion actor \"LPG Group\" mass-emailed at least 10,000 individual customers directly (Flink says employees are being contacted too) with small per-person payment demands and a 2 October 2026 deadline; heise reads the 100 ETH total as a sum customers are to raise, NL Times as what the company itself would have to pay."
