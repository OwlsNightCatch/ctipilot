    surface: "body"
    kind: uncited
    text: "It affects Security Management Server, Multi-Domain Security Management Server, Log Server, Multi-Domain Log Server and SmartEvent — Smart-1 Cloud already carries the fix, and Security Gateway appliances and Spark Firewall are not affected."
  - claim_id: dcd09d8b36
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "Affected versions: R82.20 (all takes), R82.10 Jumbo Hotfix Take 44 or lower, R82 Take 126 or lower, R81.20 Take 166 or lower, R81.10 Take 190 or lower (end-of-support), and the end-of-support R80/R80.10–R80.40/R81 lines."
  - claim_id: c47d488b88
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "Fixed in the R82.20 Security Hotfix, or Jumbo Hotfix Accumulator R82.10 Take 45+ / R82 Take 127+ / R81.20 Take 170+ / R81.10 Take 192+."
  - claim_id: 71867d99da
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "This is a distinct, unrelated flaw from CVE-2026-85102 (a separate Check Point Security Gateway/Spark VPN certificate-validation RCE, disclosed 2026-09-09 and now confirmed under active exploitation since 2026-09-12) — different components, no CVE overlap."
  - claim_id: 3faf4ab13a
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "Detection concept, per Check Point's own two independent indicators of compromise: first, a pre-authentication login attempt whose username field is anomalously long (over 1,000 characters) in the management-process log, occurring at the same timestamp as a management-process core dump, indicates a crash consistent with exploitation attempt; second, a resource-loading error referencing a file path containing parent-directory-reference sequences in the same log, which Bishop Fox says fires only when an upgrade-tools load fails and not on the route it published (see the 2026-10-04 update below)."
  - claim_id: 2f4a5c4a97
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "**Triage:** the first indicator is diagnostic only as its own correlated pair — an anomalously long username alone is not; the second indicator, a traversal-pattern sequence inside the resource-loading error path, signals an attempt on the upgrade-service route when it appears, but its absence says little."
  - claim_id: 044c7357e0
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: uncited
    text: "Hardening: because no LivePatch exists, restrict network reachability to the management web service (Check Point names TCP/19009 specifically) to trusted administrative IP ranges via the platform's Trusted Clients or implied-rule mechanism — the only mitigation available short of patching."
  - claim_id: 1eeae0a625
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat any affected server that was internet-reachable on TCP/19009 before 2026-09-22 as a potential compromise-assessment target, not just a patch target — Check Point's own two-month exploitation timeline means an unpatched, exposed server could have been silently compromised since July."
  - claim_id: e97e2f6ef2
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Bishop Fox published on 2026-10-01 a lab reproduction of an unauthenticated root code-execution chain on unpatched R81.10 and R82.10 management servers, run end to end over TCP 19009 ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: 7fd49c3889
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "The chain mints a session by presenting the server's own internal certificate name, which the server accepts from a caller-supplied string without checking that a certificate was presented, then uses the file service to write a file anywhere as root; overwriting a stock scheduled-task file makes the system's cron daemon run the attacker's command as root with no further request, and the output is read back over the same session ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: 6b960579cf
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Bishop Fox confirmed two further routes from the same write to code execution and says closing any one leaves the others standing ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: bdf67428aa
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Bishop Fox reads the hotfix as closing three defects while the advisory names two: the forged login, the unbounded file write and the upgrade-service parameter validation, with either of the first two alone breaking the chain; this is its comparison of the shipped code, not a Check Point statement ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: 647afa3052
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Its scanner reads patch state from outside with one benign request to the management port and, per its README, does not detect prior compromise ("
    urls: ["https://github.com/BishopFox/CVE-2026-93616-check"]
  - claim_id: 4981327ddf
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Bishop Fox says Check Point's second indicator fires only when an upgrade-tools load fails and is never reached by this route, so it leaves neither the error line nor the parent-directory sequence, and that a genuine upgrade can trip it; it calls the first indicator, an over-long username next to a core dump, the crash signature of the separate CVE-2026-91843 and not evidence of this traversal ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: 9851829d8e
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "Its hunting advice is file-integrity monitoring of scheduled-task directories, startup and SSH key paths, the normally empty upgrade-tools directory, the CPM configuration files and anything new in the output-staging directory, paired with execution telemetry, cron reload events and an alert on the management Java process spawning a shell, because a scheduled hash check can miss stock files restored byte for byte ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: e1156cffb3
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: cited
    text: "It also notes that the Trusted Clients restriction is a permissions setting that emits an implied rule, so a rule-base audit alone can miss it ("
    urls: ["https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616"]
  - claim_id: b2011a4af1
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: uncited
    text: "The post describes the chain but links only a patch-state scanner, not the exploit script."
  - claim_id: 6914180c1a
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "section 2026-10-04T05:12:00Z"
    kind: uncited
    text: "An exposed, unpatched server with neither log sign is therefore not shown to be clean."
  - claim_id: a3f70bb054
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "record 2026-10-04T05:12:00Z"
    kind: record-summary
    text: "Bishop Fox published on 2026-10-01 an end-to-end unauthenticated root exploit chain over TCP 19009 against unpatched R81.10 and R82.10 servers, a patch-state scanner, and its reading that the hotfix closes three defects and that Check Point's second indicator does not fire on this route. The detection guidance, the immediate action and the actions now point to file-integrity checks and rotation, and the web-shell technique mapping is replaced by the scheduled-task mapping the chain describes."
