    text: "Citrix's bulletin CTX697174 fixes CVE-2026-88779, a memory overflow in NetScaler ADC and Gateway that a network attacker needing no privileges reaches when the appliance is configured as a SAML service provider or identity provider; Citrix says it has observed targeted attacks and scopes the impact to denial of service. Appliances already on the 14.1-73.37 or 13.1-64.23 builds that fixed the September zero-days remain affected and must move to 14.1-73.41, 13.1-64.28 or the FIPS builds. Reports of code execution on patched honeypots are unconfirmed, and the flaw is not in CISA's KEV catalog as of 2026-10-04."
