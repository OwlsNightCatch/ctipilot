    kind: frontmatter
    text: "Run Mandiant's compromise checks, extended by the Unit 42 artifacts described in the update below, on every NetScaler that was internet-facing and unpatched at any time since early September, patched or not; isolate any hit and halt HA configuration sync until both nodes are validated."
