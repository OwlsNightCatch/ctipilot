  - claim_id: 49d5362d99
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a September 2026 campaign in which, in some incidents, a sponsored Google result for \"chatgpt\" opens an attacker-built Custom GPT on chatgpt.com, which sends the visitor to a Google Sites page showing a fake CAPTCHA and a ClickFix paste-and-run command. The command installs an MSI that starts a signed Canon application sideloading a malicious DLL, which unpacks a RAT with remote desktop, camera and microphone capture and DNS-over-HTTPS command resolution; Huntress has responded to at least 40 incidents from the Google Sites domain, two confirmed through a Custom GPT."
  - claim_id: 55b5986bf6
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "The command fetches a layered, obfuscated script from a host written as a single decimal number, so \"rules and URL filters that look for a dotted IP address never see one\"; the script installs a hidden MSI with msiexec and deletes itself ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: cf22ea502a
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "The RAT offers remote desktop, camera, microphone and audio capture, file search and follow-on payload execution, and resolves its command server through DNS-over-HTTPS to public resolvers, \"so they never appear in local DNS logs\" ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: da1d39150d
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "OpenAI took the first GPT down as of 2026-09-25; on 2026-09-27 Huntress found a replacement that swaps the signed host for a Stardock application, hides the loader in a Microsoft NuGet package, strips Mark-of-the-Web from the MSI and pulls a second script that is freshly obfuscated on every request, while the RAT is byte-identical ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
