claims:
  - claim_id: 793e3cbd50
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "summary"
    kind: frontmatter
    text: "An unauthenticated attacker can upload and execute an arbitrary script on Check Point Security Management Server, Multi-Domain Security Management Server, Log Server, Multi-Domain Log Server and SmartEvent via a directory-traversal and file-upload flaw. Check Point identified pinpointed exploitation on 2026-07-23, roughly two months before the 2026-09-22 fix; no LivePatch exists, only a hotfix or Jumbo Hotfix Accumulator. Bishop Fox published on 2026-10-01 an end-to-end root exploit method over the same port and a patch-state scanner, and says Check Point's second indicator does not fire on that route."
  - claim_id: 6dd1dde94d
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Check Point Security Management / Multi-Domain / Log / SmartEvent server now — no LivePatch exists: Check Point confirms this pre-authentication path-traversal flaw has already been exploited as a zero-day against a handful of customers since 2026-07-23. Apply the R82.20 Security Hotfix or the appropriate Jumbo Hotfix Accumulator (R82.10 Take 45+, R82 Take 127+, R81.20 Take 170+, R81.10 Take 192+) immediately — the September LivePatch does not cover this issue. Until patched, restrict TCP/19009 on every affected server to trusted administrative IP ranges via Trusted Clients / implied rules, and check scheduled-task directories and the other paths in the 2026-10-04 update below for unexpected changes, since the two log indicators miss the published exploit route."
  - claim_id: 793e4ca964
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the R82.20 Security Hotfix or the appropriate Jumbo Hotfix Accumulator to every Check Point Security Management / Multi-Domain Security Management / Log / Multi-Domain Log / SmartEvent server now — no LivePatch exists for this issue."
  - claim_id: 4e299eebea
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "actions[1]"
    kind: frontmatter
    text: "Until patched, restrict TCP/19009 to trusted administrative IP ranges via Trusted Clients / implied rules on every affected server."
  - claim_id: 21a7da61eb
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "actions[2]"
    kind: frontmatter
    text: "On every affected server that was reachable on TCP/19009 while unpatched, check /etc/cron.d, authorized_keys and the startup paths, the normally empty /opt/CPupgrade-tools-*/jars/ directory, the CPM configuration files and anything new under $FWDIR/conf/SMC_Files for unexpected changes, and plan credential and certificate rotation for that server."
  - claim_id: 96aae67655
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "body"
    kind: cited
    text: "Check Point discloses a pre-authentication directory-traversal and file-upload vulnerability in its Management web service that lets an unauthenticated network attacker upload a script to an arbitrary path and execute it, letting the attacker \"execute a script from an arbitrary path and load an arbitrary Java class\" ("
    urls: ["https://support.checkpoint.com/results/sk/sk1000171/"]
