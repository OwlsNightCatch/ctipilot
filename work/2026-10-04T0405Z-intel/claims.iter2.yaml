  - claim_id: 3613aefa62
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Citrix's CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772 (memory overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were already being exploited in the wild before any fix existed. CISA added both to KEV the same day; Citrix lists no workaround. Google's Mandiant and GTIG report a campaign running since at least early September that leaves web-server-configuration persistence on compromised appliances, so an appliance patched after the bulletin still needs a compromise check. Unit 42 telemetry adds version fingerprinting from 2026-08-21, web shells dropped as .deb packages from 2026-09-04 and a log-poisoning chain with concrete log artifacts to hunt. A separate Citrix bulletin of 2026-10-03 adds CVE-2026-88779, a SAML-triggered flaw these builds do not fix: SAML-configured appliances must move to 14.1-73.41 or 13.1-64.28."
  - claim_id: 1f570a7718
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every internet-facing NetScaler ADC/Gateway now and check for pre-patch compromise: Citrix confirms CVE-2026-88771 and CVE-2026-88772 are being exploited against unmitigated NetScaler ADC and NetScaler Gateway appliances right now, and Google's Mandiant reports exploitation since at least early September. CVE-2026-88771 requires no configuration at all: every default deployment is reachable by an unauthenticated attacker; CVE-2026-88772 is reachable wherever DTLS is enabled, which Citrix states is the default on any VPN virtual server. Citrix lists no workaround, and Mandiant's interim network controls (disable DTLS where it is not needed, block inbound UDP/443 upstream) cover CVE-2026-88772 only. Capture forensic evidence (logs, an instance snapshot where the appliance is virtual, a support bundle, a core dump) from each exposed appliance before patching, since the upgrade itself can destroy evidence of prior compromise, then upgrade to 14.1-73.37+ or 13.1-64.23+ (run `show ns variable` first on 13.1; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop), going straight to 14.1-73.41+ or 13.1-64.28+ where the appliance is configured as a SAML service provider or identity provider (CVE-2026-88779), and run a compromise assessment on every appliance that was internet-facing."
