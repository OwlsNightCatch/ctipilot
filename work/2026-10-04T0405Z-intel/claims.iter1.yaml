    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** appliance system, authentication-daemon and high-availability logs: repeated `nsaaad` crashes, watchdog restarts, failovers and forced reboots on a SAML-configured appliance, lined up in time with bursts of inbound SAML requests in gateway access and firewall logs; Citrix gives no detection guidance, and these signs are administrator reports ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: f9e5088de1
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Triage:** reboots alone are not proof of compromise; the combination of crashes, malformed authentication traffic and scanning is what warrants incident-response handling until forensics rules out intrusion ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: 363e6d42d3
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: uncited
    text: "Other reporting reads more into the flaw."
  - claim_id: 667acbee7d
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every SAML-configured NetScaler as exposed even if it is already on the September fixed builds: upgrade to the .41 and .28 builds or the FIPS builds, and use the Global Deny List signatures only as a bridge."
  - claim_id: b33bdac75a
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: derived
    text: "Do not read the denial-of-service scoring as a reason to wait; administrators report the crashes on appliances that already carry the September builds, and whether the flaw reaches code execution is unconfirmed."
  - claim_id: 2c7b5ca0a6
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "headline"
    kind: frontmatter
    text: "Huntress: a ChatGPT Custom GPT lure feeds a ClickFix chain that ends in a signed-host DLL sideload and a RAT"
  - claim_id: 86e647f875
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a September 2026 campaign in which a sponsored Google result for \"chatgpt\" opens an attacker-built Custom GPT on chatgpt.com, which sends the visitor to a Google Sites page showing a fake CAPTCHA and a ClickFix paste-and-run command. The command installs an MSI that starts a signed Canon application sideloading a malicious DLL, which unpacks a RAT with remote desktop, camera and microphone capture and DNS-over-HTTPS command resolution; Huntress has responded to at least 40 incidents from the Google Sites domain, two confirmed through a Custom GPT."
  - claim_id: 55b5986bf6
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "The command fetches a layered, obfuscated script from a host written as a single decimal number, so \"rules and URL filters that look for a dotted IP address never see one\"; the script installs a hidden MSI with msiexec and deletes itself ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: cf22ea502a
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "The RAT offers remote desktop, camera, microphone and audio capture, file search and follow-on payload execution, and resolves its command server through DNS-over-HTTPS to public resolvers, \"so they never appear in local DNS logs\" ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: d91585b1a4
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "OpenAI took the first GPT down on 2026-09-25; on 2026-09-27 Huntress found a replacement that swaps the signed host for a Stardock application, hides the loader in a Microsoft NuGet package, strips Mark-of-the-Web from the MSI and re-obfuscates its stager per request, while the RAT is byte-identical ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: ea2bdd20e3
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "Detections keyed on the Canon or Stardock names will miss the next swap, because the behaviors carry over and the file names do not ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: c9aedcd2d9
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "**Triage:** the behaviors Huntress says carry over between builds are the discriminators: the install location, the unsigned DLLs beside a signed host, and the same-named Run value and scheduled task that come back when deleted ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: ab01c27a52
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: cited
    text: "On an endpoint that matches, kill the implant process before removing its Run value and scheduled task, or the script restores both ("
    urls: ["https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"]
  - claim_id: 5eefd2ff17
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "Huntress reports a campaign from late September 2026 in which victims who searched Google for \"chatgpt\" got a sponsored result that opened an attacker-built Custom GPT, titled \"Plus 5.6\", on the genuine chatgpt.com domain."
  - claim_id: bad5568119
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "It answers any input with a fake service-availability notice pointing to a \"backup domain\" on Google Sites, which shows a Cloudflare-style CAPTCHA and tells the user to paste a command into a terminal (ClickFix)."
  - claim_id: 4d1b45865b
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "The MSI presents itself as a printer-configuration reader, installs under the user profile and launches a legitimately signed Canon application, which loads a patched Canon logging DLL whose imports pull in unsigned DLLs; one XOR-decodes shellcode hidden in a file posing as audio."
  - claim_id: 88af8fb781
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "The shellcode bypasses AMSI, unhooks ntdll, runs anti-VM checks and hosts the .NET runtime, then opens a custom encrypted archive holding a persistence script and the remote access trojan."
  - claim_id: d1e016c764
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "The script re-creates an HKCU Run value every 150 seconds and a scheduled task of the same name every 875 seconds if either is removed."
  - claim_id: 6364f40a64
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: uncited
    text: "Huntress has responded to at least 40 incidents from the Google Sites domain and confirmed two through a Custom GPT."
  - claim_id: 0621ab86a0
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: derived
    text: "**Exposure:** any Windows endpoint whose user pastes the command; the chain uses no vulnerability, and staff who search for AI assistants are the population in scope."
  - claim_id: e11ad466ac
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage is the most reliable place, as most of the chain runs in memory."
  - claim_id: 676b9ff6f4
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: derived
    text: "Look for PowerShell launching msiexec on a GUID-named MSI in the user temp folder with silent flags; a signed vendor binary started by msiexec from a fake product folder under the user profile; an unsigned DLL next to the signed executable; and an HKCU Run value and scheduled task sharing one name that return after deletion."
  - claim_id: 888545c871
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: derived
    text: "In proxy and egress logs, look for a download from a decimal-integer host and DNS-over-HTTPS from a non-browser process."
  - claim_id: d6eede2fdf
    entry: 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** add these process-lineage and persistence patterns as hunts or detections now, keyed on behavior, not on the Canon or Stardock names."
  - claim_id: a6ae2eeab7
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "headline"
    kind: frontmatter
    text: "Huntress: an attacker registered a member account, uploaded .aspx webshells and went after payment data on three servers"
  - claim_id: d1c88c267d
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "summary"
    kind: frontmatter
    text: "Huntress observed from 2026-09-10 a threat actor compromising three web servers of a shared recreation-management platform by registering a member account and uploading .aspx webshells into the member-files directory, then searching for database credentials and cardholder data. After one server went back into production prematurely, the actor returned with the same account and planted a credential-harvesting script in the login page's jQuery file. Huntress names no vendor or CVE."
  - claim_id: fd9b1d0914
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Huntress observed on 2026-09-10 a threat actor compromising multiple tenants of a shared recreation-management platform with one repeatable method: \"register a member account, upload a malicious file, and turn it into a webshell\" ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 8fc02818c0
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On the first server the actor spent roughly six hours on failed unauthenticated attempts (login brute force, IIS 8.3 tilde enumeration, WebDAV verbs, upload-handler bypasses, forced browsing); what worked was registering an account and uploading 14 files into the member-files directory, the .jpg and .pdf files as extension tests and the .aspx files as webshells ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 63c84c2cb7
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Through the webshells, run from the IIS worker process, the actor enumerated the host and IIS sites, read configuration files for connection strings and keys, connected to the database with the harvested SQL credentials, searched files for card data and read a payment gateway's plain-text webhook logs to extract card numbers, expiry dates and card verification codes ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: c4079811ab
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On a third server it uploaded five webshells, copied them under names resembling site assets, set their timestamps to match web.config and probed the payment-module folders; the attempt to plant copies there failed ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 1cf3634c2d
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "When that server was put back into production prematurely, the actor returned with the same registered account, re-uploaded webshells and appended an obfuscated loader to a jQuery file that the authentication page loads, intending to turn every browser that loads the page into an encrypted command client that evaluates pushed code and harvests credentials in real time ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: ab1efd70dd
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "**Exposure:** any web platform that lets an anonymous visitor self-register and then upload files into a directory served by IIS with script execution enabled; with no vendor or CVE named, check whether a member upload directory accepts .aspx files and executes them ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: aae3e9c834
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "Later signs are web-root files whose timestamps were copied from web.config, a static script asset loaded by the login page that differs from the deployed package, and PowerShell and JavaScript written to the Windows temp folder as base64 files and then decoded ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: bdafc097e6
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "**Triage:** legitimate member uploads of documents and images land in the same directory; the discriminator is a script-capable extension there, or a file there that is requested directly and then spawns child processes ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 2c6895a8d8
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: cited
    text: "On a cleaned server, remove the actor's registered accounts, fix the upload handler and rotate the SQL credentials in readable configuration files before it returns to production; the actor came back with the same account ("
    urls: ["https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"]
  - claim_id: 0866c0d8a5
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "Huntress's summary calls the three compromised web servers municipal, and the post names neither the platform vendor nor a CVE."
  - claim_id: 573aa0675a
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "Huntress deduces from a Simplified Chinese locale in a PowerShell user-agent that the actor is most likely based in China, and says script comments suggest AI-generated code."
  - claim_id: 6f05f1fc7f
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: uncited
    text: "It does not state how many cards were exposed or whether any data left the servers."
  - claim_id: 44217662be
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: derived
    text: "**Detection:** web and application telemetry first: a new member registration followed within minutes by uploads into the member-files directory, .aspx files appearing in an upload folder, and the IIS worker process spawning cmd.exe or powershell.exe for host and configuration discovery."
  - claim_id: 6837e8b606
    entry: 2026-10-04/recreation-platform-upload-webshell-card-data-foothold
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** review citizen-facing booking or payment portals that allow self-registration and upload for script execution in the upload directory, payment modules sharing a server with general tenants, and webhook logs holding card data in plain text on the web server."
