    urls: ["https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"]
  - claim_id: 246e9cd22e
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
