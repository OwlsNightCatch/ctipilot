    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "\"But I haven't seen individual consumers being approached before,\" Takkenberg told Dutch broadcaster NOS ("
    urls: ["https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data"]
