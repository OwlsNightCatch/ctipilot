    kind: cited
    text: "Flink, a quick-commerce grocery delivery service headquartered in Germany and also operating in the Netherlands (formerly in Austria and France), confirmed a breach of one of its internal \"Order Hub\" ordering systems, the decentralized, city-level warehouse software that lets the service promise delivery in under thirty minutes ("
    urls: ["https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"]
  - claim_id: 432c018c64
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "Flink's own customer notification, seen by RETAIL-NEWS, says an unauthorized person reached one of its internal systems with compromised credentials ("
    urls: ["https://retail-news.de/flink-datenschutzvorfall-kundendaten-phishing/"]
  - claim_id: e6ebacc5e0
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "Flink states plainly that it does not negotiate with criminals and did not respond ("
    urls: ["https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"]
  - claim_id: d9ef317b21
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "The extortion actor behind the breach, self-named \"LPG Group\" and previously undocumented, claims to have obtained personal information on a million Flink customers and 13,000 workers; Flink has not confirmed that figure, though NL Times notes one million would represent roughly two-thirds of the customer base the company reported in June ("
    urls: ["https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data"]
  - claim_id: aa6e9293c3
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "At least 10,000 customers and employees in the Netherlands received ransom notes (heise reports Germany was also targeted, though the scale there is unclear), each demanding a small payment of 0.005 ETH (NL Times: the equivalent of EUR 11.80) toward a collective target of 100 ETH, which NL Times puts at just shy of EUR 237,300 and heise at roughly EUR 230,000, a discrepancy the two outlets' independent exchange-rate snapshots do not resolve, with a promise to delete each payer's data once the collective goal is met and a threat to sell everything if it is not, by a 2 October 2026 deadline ("
    urls: ["https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data", "https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"]
  - claim_id: b0c4b9c07b
    entry: 2026-09-27/flink-lpg-group-crowdfund-extortion-order-hub-breach
    surface: "body"
    kind: cited
    text: "Exfiltrated data is limited to names, postal codes/delivery addresses, email addresses, phone numbers and, in some cases, delivery notes such as floor or apartment details; Flink states passwords, payment card details and bank data were not affected ("
    urls: ["https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data", "https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html"]
