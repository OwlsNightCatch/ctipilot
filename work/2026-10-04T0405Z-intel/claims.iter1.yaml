    surface: "actions[0]"
    kind: frontmatter
    text: "Find every self-hosted Zammad instance, copy its application and network logs before changing anything, upgrade to Zammad 7.2.0, the current stable release (6.5 and older receive no security fixes), or take it offline if it cannot be upgraded, and run DIVD's log-check script against the logs for the code-execution flaw."
