    surface: "body"
    kind: uncited
    text: "A separate bulletin of 2026-10-03 adds CVE-2026-88779 for SAML-configured appliances, which these builds do not fix (see the 2026-10-04 update below)."
  - claim_id: 187baa5776
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Triage:** the discriminator for CVE-2026-88771 is that an unauthenticated request whose logged text imitates the packet engine's crash message and carries command text after it is enough to reach the vulnerable code path (see the 2026-09-29 and 2026-09-30 updates), so such lines in the appliance logs and any successful, unauthenticated command execution on the appliance are the signal, not a benign lookalike to rule out."
  - claim_id: 573116ad17
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "For CVE-2026-88772, DTLS handling anomalies (crashes, unexpected restarts, or malformed-record errors in VPN vServer logs) on an appliance where DTLS was not deliberately disabled are the discriminator worth hunting for, since legitimate DTLS traffic does not trigger the memory-overflow condition."
  - claim_id: 4a1248e2c5
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** every internet-facing NetScaler ADC/Gateway deployment needs the patch now regardless of whether DTLS is knowingly enabled: Citrix states it is the VPN vServer default, so an administrator who never explicitly configured DTLS may still be exposed to CVE-2026-88772."
  - claim_id: 55d99d951c
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-04T04:42:00Z"
