        attribution: "ASD's ACSC"
        source_url: "https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/critical-vulnerabilities-in-citrix-netscaler-adc-and-citrix-netscaler-gateway-products"
      - quote: "security researchers claim to have observed malware on their test devices"
        attribution: "heise online"
        source_url: "https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"
    extended_notes: |
      Exposure test (Citrix): search the running configuration of every NetScaler ADC / Gateway for `add authentication samlAction` (SAML
      SP) or `add authentication samlIdPProfile` (SAML IdP), on Gateway or AAA virtual servers; read the build and compare with
      14.1-73.41 / 13.1-64.28 / 14.1-73.41 FIPS / 13.1-37.282 (13.1 FIPS and NDcPP). Secure Private Access Hybrid deployments that use
      NetScaler instances are named as affected. Citrix-managed cloud services are patched by Citrix.
      Mitigation detail (Citrix): Global Deny List signatures need NetScaler Console (on-premises with Cloud Connect, or the service) with
      "Virtual patching" enabled; verify with `show appfw signatures` (default signature version at least v24) and `stat denylist
      global AAA_REQUEST` (counters and Last Hit Time above 0); Citrix says the upgrade remains the fix and also points to the
      appliance IP blocklist and perimeter firewall rules.
      Behaviour that defenders can watch (community-reported through heise and cyberpress, NOT stated by Citrix): repeated crashes of
      the authentication daemon (nsaaad) with watchdog restarts, forced reboots and high-availability failovers on internet-facing Gateway
      or AAA appliances, correlated in time with inbound SAML authentication requests; cyberpress advises preserving core files and logs
      before restarting. Benign lookalikes: reboots after an upgrade can have other causes (community trackers report a 13.1 upgrade
      reboot-loop condition, not verified here), so correlate reboot times with SAML request volume and the daemon crash record
      before declaring an attack.
      Post-patch compromise check: this CVE is availability-class per Citrix, but the same SAML front-end was reported with payload-bearing
      requests; operators who ran the September builds should keep the compromise review from the CVE-2026-88771/88772 campaign (web-server
      configuration persistence reported by Mandiant and GTIG) in scope, since the covered entry already carries that guidance.
      heise's text says no patch exists; Citrix released builds about two hours before this run (bulletin created 2026-10-04 02:03, blog
      published 2026-10-03 18:42 PDT = 2026-10-04 01:42Z), so heise's "no patch yet" is superseded.
      Aggregator note: pitscaler.com (community tracker, unknown authorship) lists payload-server and file-path indicators attributed to
      community write-ups; none is vendor-, CERT- or lab-confirmed, so this item carries none of them.
  - title: "DragonForce second-stage backdoor: a resident Microsoft Teams TURN-relay implant sideloaded through javaw.exe with an MQTT fallback channel (Lab52)"
    sources:
      - { url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/", publisher: "Lab52 (S2 Grupo)", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: lab52, feed https://lab52.io/blog/feed/ → primary (no pivot needed): https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/ (the post links Symantec's earlier DragonForce Teams-TURN report, already covered in the store as 2026-06-17/dragonforce-abuses-microsoft-teams-turn-relays-for-c2-and-ch)"
    summary: |
      Lab52 (2026-10-01) describes two backdoors from a recent DragonForce operation that tunnel command-and-control through legitimate
      Microsoft Teams TURN servers. Backdoor 1 is a Go binary (metadata name Shell.dll) injected straight into memory during the initial
      deployment phase; Lab52 links it to Symantec's earlier Backdoor.Turn report. Backdoor 2 is the new part and is built to stay
      resident: a scheduled task left by an earlier stage starts a DLL-sideloading chain in which the legitimate javaw.exe loads jli.dll
      (first-stage loader, a different hash on every host), which loads rvsdiqw.txt, a payload encrypted with DPAPI so it only runs on that
      machine. Its C2 runs over TURN with a second channel over an MQTT broker as fallback when TURN fails. Tasks arrive in checksummed
      chunks, are decoded with a short XOR key and run as code templates in memory (VirtualProtect, CreateThread); the JSON task carries a
      command number that selects fetching a URL, running a PowerShell command line, running the template unchanged, or opening a
      connection to a given remote host and port. On a failed channel the beacon sleeps five minutes and encrypts its own memory region.
      Lab52 names no victim, sector, region or initial-access vector and carries no CVE; the post is a protocol and loader analysis and its
      conclusion calls DragonForce a "ransomware cartel" that supplies infrastructure and tooling to affiliates.
    region_nexus: "global; no victim or region stated. DragonForce is already tracked in the store with a Swiss leak-site listing (2026-07-14 entry)."
    primary_sector_nexus: "indirect (ransomware affiliate tooling; no sector stated)"
    sector: "cross-sector"
    cves: []
    techniques: [T1090, T1071, T1574.001, T1053.005, T1055]
    affected_products: ["Microsoft Teams", "Java runtime (javaw.exe, abused as sideload host)"]
    entity_keys: ["actor:dragonforce", "campaign:dragonforce-backdoor-turn-teams-relay-byovd"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-06-17/dragonforce-abuses-microsoft-teams-turn-relays-for-c2-and-ch"
    lookback: true
    classification_suggested: { reliability: B, credibility: 2 }
    evidence:
      - quote: "the second type is notable for its use of MQTT as an additional communication channel in the event that communication through TURN fails"
        attribution: "Lab52"
        source_url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/"
      - quote: "The second backdoor is used for persistence, as it is executed through a scheduled task left behind by a previous stage."
        attribution: "Lab52"
        source_url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/"
      - quote: "The attackers abuse legitimate Microsoft Teams TURN servers, thereby masking their traffic."
        attribution: "Lab52"
        source_url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/"
    extended_notes: |
      Delta against the covered 2026-06-17 entry (Symantec's Backdoor.Turn: Teams anonymous-token TURN relay with QUIC, BYOVD chain): Lab52
      adds a second, persistent implant with an MQTT fallback and a per-host DPAPI-bound payload. Detection concepts that follow mechanically
      from Lab52's description (Lab52 states no rule): process-creation telemetry for a java launcher (javaw.exe) running from an unexpected
      directory or loading jli.dll from outside the JRE folder, especially started by a scheduled task; image-load events for jli.dll with
      a hash that differs per host; egress telemetry for Teams TURN relay endpoints contacted by processes that are not the Teams client,
      and for MQTT client traffic from hosts with no MQTT use. Hardening: restrict outbound access to Teams media-relay ranges to the Teams
      client where policy allows, and block unmanaged MQTT egress. Weak point: the Lab52 post publishes no victim or intrusion-chain data, so
      the sideload and TURN observations cannot be tied to an initial-access technique or to a Swiss target.
    borderline: true
    borderline_reason: "single-source (B-reliability lab) technical delta on an already-covered high-priority entry; no sector, victim or Swiss nexus stated, so only the loader and egress behaviours are transferable. Main agent decides between a changelog `update` on the covered entry and a drop."
  - title: "Dolibarr CVE-2026-89013: unauthenticated arbitrary file read via a crafted hashp parameter is exploited in the wild (CSIRT Italia), fixed in 24.0.1"
    sources:
      - { url: "https://www.acn.gov.it/portale/w/dolibarr-rilevato-sfruttamento-in-rete-della-cve-2026-89013", publisher: "ACN CSIRT Italia, alert AL01/260930/CSIRT-ITA", date: "2026-09-30", role: "primary" }
      - { url: "https://www.vulncheck.com/advisories/dolibarr-authorization-bypass-via-hashp-parameter-in-document-php", publisher: "VulnCheck (CNA advisory)", date: "2026-09-11", role: "primary" }
    discovery_trace: "first seen at: csirt-acn-it, feed https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192 → ACN alert https://www.acn.gov.it/portale/w/dolibarr-rilevato-sfruttamento-in-rete-della-cve-2026-89013 → pivot: CVE record references via https://cve.threatint.com/CVE/CVE-2026-89013 (VulnCheck CNA text, Dolibarr 24.0.1 release notes and patch commit listed) → primary: https://www.vulncheck.com/advisories/dolibarr-authorization-bypass-via-hashp-parameter-in-document-php"
    summary: |
      ACN's CSIRT Italia alert of 2026-09-30 reports active exploitation in the wild of CVE-2026-89013 in Dolibarr, the open-source
      ERP/CRM, and marks both a public proof of concept and exploitation as present. VulnCheck, the CNA, describes it as an authorization
      bypass in the document-storage endpoints: an unauthenticated request carrying `hashp=shared` skips token validation while
      satisfying the authorization condition in `htdocs/document.php` and `htdocs/viewimage.php`, which exposes application logs,
      uploaded business documents, database backups containing password hashes and files of other multicompany entities. CVSS 4.0
      8.7 (VC:H, no authentication or interaction); affected Dolibarr 23.0.4 up to but excluding 24.0.1, fixed in 24.0.1 (CVE published
      2026-09-10/11). VulnCheck lists it in its own KEV database. It was not in CISA KEV in the 2026-10-02 catalogue release.
    region_nexus: "global (alert from the Italian CSIRT); no Swiss exposure data in the sources"
    primary_sector_nexus: "indirect (open-source business application; sources name no public-sector victim)"
    sector: "cross-sector"
    cves: [CVE-2026-89013]
    techniques: [T1190, T1005]
    affected_products: ["Dolibarr ERP CRM"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    classification_suggested: { reliability: A, credibility: 2 }
    evidence:
      - quote: "Dolibarr 23.0.4 before 24.0.1 contains an authorization bypass vulnerability that allows unauthenticated attackers to read arbitrary files through the document storage endpoints by supplying a crafted hashp parameter value."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/dolibarr-authorization-bypass-via-hashp-parameter-in-document-php"
      - quote: "Rilevato lo sfruttamento attivo in rete della vulnerabilità CVE-2026-89013"
        original: "Rilevato lo sfruttamento attivo in rete della vulnerabilità CVE-2026-89013"
        translation: "Active exploitation in the wild of CVE-2026-89013 has been detected (translated from Italian)"
        attribution: "ACN CSIRT Italia"
        source_url: "https://www.acn.gov.it/portale/w/dolibarr-rilevato-sfruttamento-in-rete-della-cve-2026-89013"
    extended_notes: |
      Detection concept that follows from the CNA description: web-server access logs for requests to document.php or viewimage.php with a
      hashp parameter whose value is `shared` and no authenticated session; hunt for large or repeated document-endpoint reads from one
      source. Post-patch check: the exposed file classes include database backups with password hashes and application logs, so rotate
      credentials and secrets stored in or backed up beside the instance and review what sat in the document directory before the upgrade
      to 24.0.1. The ACN text does not say who is exploiting it or at what scale.
    borderline: true
    borderline_reason: "exploited per a carve-out authority, but a niche open-source ERP/CRM with no stated public-sector or Swiss nexus; vulnerability triage is S1's domain and this was found through ACN's 98 h lookback, so the main agent should dedupe against S1."
