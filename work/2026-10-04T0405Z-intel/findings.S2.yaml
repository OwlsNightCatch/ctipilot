    discovery_trace: "first seen at: heise-sec, feed https://www.heise.de/security/feed.xml → heise article https://www.heise.de/news/Netscaler-Admins-aufgepasst-Zero-Day-verursacht-Crashes-und-Codeausfuehrung-11474971.html (2026-10-03T08:23Z, says no patch) → pivot: Citrix guidance blog https://community.citrix.com/techzone-blogs/110_security-updates/security-update-guidance-for-netscaler-saml-authentication-deployments/ (403 to extract and WebFetch; read via the jina reader) → its links to the new bulletin and CVE blog → primary: https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697174 and https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/ → CVE record confirmed on the CVE Program record and ENISA EUVD (EUVD-2026-92065, EPSS 0.0 at publication) → ACSC alert https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/critical-vulnerabilities-in-citrix-netscaler-adc-and-citrix-netscaler-gateway-products (3 October update)"
    summary: |
      Citrix published security bulletin CTX697174 on 2026-10-04 (CVE record dated 2026-10-04T02:35Z, CNA public date 02:19Z) for
      CVE-2026-88779, a CWE-119 memory overflow in NetScaler ADC and NetScaler Gateway. Precondition per the bulletin: the appliance
      is configured as a SAML service provider (`add authentication samlAction`) or SAML identity provider (`add authentication
      samlIdPProfile`) on a Gateway or AAA virtual server. Citrix rates it CVSS v4.0 8.7 (AV:N/AC:L/AT:N/PR:N/UI:N, availability
      impact only, VA:H) and states it "has observed targeted attacks on unmitigated NetScaler deployments which can lead to
      Denial of Service". Fixed releases: 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 (13.1 FIPS and NDcPP); affected is
      everything earlier, which includes the 14.1-73.37 / 13.1-64.23 builds that fixed the eight CTX697096 flaws (CVE-2026-88771
      to CVE-2026-88778). Citrix says the issue "is independent of the vulnerabilities disclosed in" CTX697096 and tells operators who
      upgraded to the CTX697096 builds and meet the SAML precondition to upgrade again. Interim mitigation (NetScaler Console
      "virtual patching"): Global Deny List signatures, only in builds from 14.1-73.37 up to 14.1-73.41 and from 13.1-64.23 up
      to 13.1-64.28; Citrix says they "can help to mitigate" and the upgrade is the fix. Timeline: Citrix posted SAML guidance on
      2026-10-02 (no CVE, builds or workaround), admins reported reboot loops on patched 14.1-73.37 appliances from the evening of
      2 October, heise relayed Kevin Beaumont's honeypot observation of a downloaded binary running on patched appliances and a
      watchTowr statement that it had reproduced the flaw, and ACSC added on 3 October that the issue "may induce system crashes,
      denial of service and potential exploitation" and that it is aware of impacts to Australian organisations. Contradiction to
      carry: Citrix scopes the flaw to denial of service with no integrity impact; the code-execution reading (malware binary on
      patched honeypots, payload-bearing SAML usernames) rests on researcher and community observations that no vendor, CERT or
      lab has confirmed, and cyberpress itself says the crashes "appear to be a distinct issue, not evidence that the original patch has been bypassed". Not in CISA KEV
      as of its 2026-10-02 release; EPSS 0.0 at publication.
    region_nexus: "global; internet-facing remote-access / SAML gateways. No Swiss-specific exposure figure in any fetched source. NCSC-CH's security hub already carries advisory 13005 for the sibling CVE-2026-88771/88772 and has not yet posted this CVE."
    primary_sector_nexus: "indirect (public-administration remote-access and identity front-ends are a standard NetScaler use; sources give no public-sector victim)"
    sector: "public-sector"
