  - claim_id: b35b30b500
    entry: 2026-09-23/cve-2026-93616-check-point-security-mgmt-path-traversal
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Check Point Security Management / Multi-Domain / Log / SmartEvent server now, no LivePatch exists: Check Point confirms this pre-authentication path-traversal flaw was exploited as a zero-day against a handful of customers, with attacks observed on 2026-07-23. Apply the R82.20 Security Hotfix or the appropriate Jumbo Hotfix Accumulator (R82.10 Take 45+, R82 Take 127+, R81.20 Take 170+, R81.10 Take 192+) immediately; the September LivePatch does not cover this issue. Until patched, restrict TCP/19009 on every affected server to trusted administrative IP ranges via Trusted Clients / implied rules, and check the file-integrity paths in the 2026-10-04 update below, since the two log indicators miss the published exploit route."
