    kind: derived
    text: "**Detection:** appliance system, authentication-daemon and high-availability logs: repeated `nsaaad` crashes, failovers and forced reboots on a SAML-configured appliance, correlated in time with inbound SAML request volume in gateway access and firewall logs, since heise says the exploit likely works by sending a massive number of SAML requests."
