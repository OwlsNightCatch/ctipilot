  - claim_id: f078b476fb
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every internet-facing NetScaler ADC/Gateway to 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+) or 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+) now (a SAML-configured appliance needs the later builds named for CVE-2026-88779); on a 13.1-branch appliance run `show ns variable` first; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop. Capture logs, an instance snapshot where the appliance is virtual, a support bundle and a core dump from each exposed appliance BEFORE patching, since the upgrade can remove forensic evidence of prior exploitation."
  - claim_id: 25a93814d2
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "record 2026-10-04T04:42:00Z"
    kind: record-summary
    text: "Citrix's bulletin CTX697174 (2026-10-03) fixes CVE-2026-88779, a SAML-triggered memory overflow that the September fixed builds do not cover; Citrix confirms targeted attacks and tells SAML-configured appliances that already took the September builds to upgrade again, to 14.1-73.41, 13.1-64.28 or the FIPS builds."
  - claim_id: 22fc75a5db
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root in all versions. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes, that 7.2.0 hardens the code, and that it cannot confirm the root flaw because DIVD gave it no technical details."
  - claim_id: efd79180b7
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "**Detection:** web and application logs on the Zammad host; DIVD publishes a log-check script for the code-execution flaw's indicators ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015"]
  - claim_id: e2bbea9661
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "DIVD lists no process or network indicators, so these follow from the mechanism and from DIVD's account that the attackers reached other services: shells or interpreters as children of the Zammad service account, a privilege change from that account to root, and connections from the ticket host to internal services it does not normally contact."
  - claim_id: 195d515716
