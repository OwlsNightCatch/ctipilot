    surface: "section 2026-10-04T04:43:00Z"
    kind: cited
    text: "Zammad also says it first received a report about CVE-2026-102489 in August 2026 and analysed it then, which is before the exploitation DIVD dates to 2026-09-21, so the vendor may have known of the flaw before it was exploited ("
    urls: ["https://community.zammad.org/t/take-care-local-privilege-escalation-cve-2026-102490-is-reported-as-being-actively-exploited/21297"]
