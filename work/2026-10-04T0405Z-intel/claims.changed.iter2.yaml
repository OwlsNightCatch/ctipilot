    kind: cited
    text: "Citrix's bulletin CTX697174, dated 2026-10-03, describes CVE-2026-88779, a memory overflow in customer-managed NetScaler ADC and NetScaler Gateway reachable only when the appliance is configured as a SAML service provider or identity provider; the CVSS 4.0 vector is network, no privileges, no user interaction, availability impact only ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 80a625e4a8
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The fixed builds are 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 4785385451
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Until the upgrade, Citrix offers Global Deny List signatures through NetScaler Console with virtual patching enabled, for builds from 14.1-73.37 up to 14.1-73.41 and from 13.1-64.23 up to 13.1-64.28; they \"can help to mitigate\" the flaw, but the upgrade is the fix ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: cd31a1d344
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Administrators reported repeated crashes and forced reboots of internet-facing appliances running patched releases, including 14.1-73.37, with the `nsaaad` authentication service failing after crafted SAML-related requests, one administrator seeing a script-download command in the logs that did not succeed and another a payload in the username field ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: 0275e9ec89
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "None of these sources confirms code execution, and as of 2026-10-04 the flaw is not in CISA's Known Exploited Vulnerabilities catalog ("
