    summary: |
      NEW since the 2026-09-23 entry. On 2026-10-01 Bishop Fox (Jon Williams, Threat
      Enablement & Analysis Team) published a full weaponization analysis of
      CVE-2026-93616 and states it reproduced an end-to-end unauthenticated root
      remote code execution chain against unpatched R81.10 and R82.10 lab servers,
      with every step over the CPM SOAP listener on TCP 19009 (Java process, Apache
      CXF, /cpmws/; reachable on all interfaces by default per the tool README).
      The exploit script itself is NOT public; what is public is the mechanism
      description and a defender-oriented scanner repository (single commit,
      scanner script only).

      Mechanism as Bishop Fox states it (no payloads or code reproduced here): (1) the
      management service issues a session through an unauthenticated login method that
      accepts the caller's identity as a plain string and takes the distinguished name
      from the caller-supplied CN= text without checking that a client certificate was
      presented, so an attacker who presents the server's own SIC name (published in
      the certificate the server shows on 19009) is authenticated as the server itself
      and receives a read-write session; (2) the file-upload service takes its
      destination filename from a SOAP header and concatenates it onto a temporary
      directory without canonicalization, so path-separator sequences become an
      arbitrary file write as root; (3) overwriting an existing stock scheduled-task
      file under /etc/cron.d (inherited from the Linux mdadm tooling, not shipped by
      Check Point; it must overwrite an existing root-owned file so cron accepts the
      permissions) yields command execution as root at the next minute boundary with no
      trigger request; (4) output is staged in the server's SMC_Files directory and
      read back over the same session. Bishop Fox also confirmed two further
      write-to-execution vectors (directory-load of the upgrade service's component
      tree on servers with an upgrade history, and a configuration file re-read on a
      timer on newer releases) and says closing any single one would leave the others.
      A second traversal in the upgrade service (parameter targetVersion) is a further
      path to root that the post does not walk through.

      Scope of the patch, per Bishop Fox's jar diffing of Jumbo Hotfix R82.10 Take 45
      (a researcher assessment from bytecode comparison, not a vendor statement): the
      hotfix closes three defects, not the two the advisory names - the forged-login
      session mint (dleserver.jar), the unbounded root file write (java_is.jar) and a
      character allow-list on targetVersion in the upgrade service (upgrade_web_services.jar).
      Either of the first two alone breaks the chain. On the patched lab host the chain
      dies at step one (remote authentication rejected, no session minted). Bishop Fox
      states Check Point is the CNA, credited no external finder, and the issue was
      identified from in-the-wild exploitation.

      Detection delta. Check Point's sk1000171 (still Last Modified 2026-09-22) lists two
      cpm.elg-based indicators. Bishop Fox assesses (a) the second indicator (ERROR line
      from ReflectionUtils 'Failed to load allResourceFiles map from' with ../ in the
      path) fires only when an upgrade-tools load fails; the weaponized route never
      calls that service, so it leaves neither that line nor a ../ , and a legitimate
      upgrade can trip the grep on its own - 'a weak net both ways'; (b) the first
      indicator (over-long username next to an fwm/mds core dump) is the crash signature
      of the separate CVE-2026-91843 (Check Point sk1000155: stack overflow in the
      unauthenticated login, indicator 'Administrator failed to log in: Username too
      long'), 'not evidence of this traversal'. Bishop Fox's recommended catch is
      file-integrity monitoring on every path a root write can reach: /etc/cron.d and
      other scheduled-task directories; authorized_keys and startup paths; the
      normally-empty /opt/CPupgrade-tools-*/jars/ directory; $FWDIR/conf/log4j2.xml and
      other CPM configuration and program-tree files; and anything new under
      $FWDIR/conf/SMC_Files. Because the cron route touches only stock OS files whose
      content is identical on every build, an attacker can restore originals byte for
      byte, so a scheduled hash comparison alone can miss it; pair file checks with
      execution telemetry, cron reload events and an alert on the CPM Java process
      spawning a shell. (The existing entry's Detection and Triage text treats indicator
      2 as 'sufficient on its own' and indicator 1 as a crash consistent with exploitation
      of this CVE; both need qualification.)

      Public detection tool: BishopFox/CVE-2026-93616-check (MIT, Python stdlib). It is
      an unauthenticated remote patch-state probe: one request to the login method
      loginAsApplicationReadOnlyPublicSession on the CPM listener with a single illegal
      character in targetVersion (never a traversal sequence); a server that answers
      'targetVersion contains illegal characters' is PATCHED (fix present; the check
      validates this parameter's pattern, not the login or file-write fixes, but BF
      states the fixes ship in the same bundle so it is a reliable proxy), a server that
      accepts and dispatches the value is VULNERABLE, an R80.40-era (pre-R81.10) build
      that rejects the primary probe at XML unmarshalling and then dispatches a
      legacy-shape follow-up is reported VULNERABLE 'affected-eos-no-fix', and an answer
      without dispatch is INCONCLUSIVE (not 'patched'). It does not authenticate, upload,
      or execute, does not read a Jumbo take number, and 'does not detect prior
      compromise'. Side effect on a vulnerable host: a failed execution attempt on a
      non-existent path (NullPointerException before Runtime.exec) logged in cpm.elg;
      Bishop Fox says its probes send the application name bf-check, 'recognizable in the
      log as this tool rather than an attack'. Assessment (ours, not stated by either
      source): because the probe is a single unauthenticated request against 19009, anyone
      who can reach the port can read patch state the same way, which raises the value of
      closing 19009 exposure over patching alone; and a defender running the tool will
      leave a cpm.elg line on unpatched hosts that can resemble upgrade-service abuse.

      Other deltas. (1) Post-patch posture: Bishop Fox advises that code execution runs as
      root inside the process holding the policy and the internal CA, so on any server that
      was exposed and unpatched 'plan for credential and certificate rotation, not only a
      patch'. (2) Exposure: the Trusted Clients restriction is a Permissions &
      Administrators setting that emits an implied rule, not a rule-base entry, so a
      rule-base audit alone can miss it (Bishop Fox); 'internal' is not the same as
      reachable only from management stations. (3) CISA KEV record is unchanged in
      substance (added 2026-09-22, due 2026-09-25, ransomware use Unknown) but carries
      forensicTriage 'Yes' under BOD 26-04 - a catalogue attribute the existing entry does
      not mention.

      Unchanged: sk1000171 (Last Modified 2026-09-22, Status Approved, same affected
      versions and fixed builds: R82.20 Security Hotfix; Jumbo HFA R82.10 Take 45+, R82
      Take 127+, R81.20 Take 170+, R81.10 Take 192+; no LivePatch) and the Check Point
      Research blog (2026-09-22; 'a handful of pinpointed attacks on July 23, 2026') show no
      new indicators, builds or exploitation-status change, and neither carries any
      statement on the Bishop Fox route as of 2026-10-04T05:10Z (absence in those two
      pages plus the searches, not proof Check Point has said nothing elsewhere). No
      new advisory text in NCSC-CH (post 12965, history shows only 'Published' 2026-09-23,
      status Actively Exploited), NCSC-NL (NCSC-2026-0387 still version 1.00, 2026-09-23),
      or CERT-EU (2026-012 of 2026-09-10 covers CVE-2026-85102/85103, not 93616; no later
      Check Point item). The Belgian CCB advisory (2026-09-23, 'Last update: 23/09/2026')
      is also unchanged. Exploitation status: no public report found of the ITW actor,
      tooling or post-exploitation (CCB: 'Check Point has not disclosed post-exploitation
      activity'). An aggregator (rescana) lists IPs as 'known network indicators'; they do
      not appear in sk1000171 or the Check Point blog, so that claim is uncorroborated and
      not carried here.
