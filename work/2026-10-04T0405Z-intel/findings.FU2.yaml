    extended_notes: |
      WHAT THE EXISTING ENTRY GETS WRONG OR OMITS (for the changelog record):
      - Detection: it calls the second indicator 'sufficient on its own' and treats the
        first as a crash 'consistent with exploitation attempt'. Bishop Fox: indicator 2
        only fires on the upgrade-service traversal route and not on the login-forgery +
        file-write + cron route; indicator 1 is the CVE-2026-91843 crash signature.
        sk1000171 itself still presents both as CVE-2026-93616 indicators (unchanged);
        sk1000155 for CVE-2026-91843 carries 'Administrator failed to log in: Username
        too long' as its own attack indicator. The store's entry for CVE-2026-91843 (2026-09-18)
        says no source reports exploitation; the over-long-username crash pattern is therefore
        a pointer to attempts against that separate CVE if it appears in logs (Bishop Fox's
        assessment; Check Point has not said this).
      - Absence of both vendor indicators on an unpatched, exposed server is not evidence of
        no compromise. Telemetry that does catch the described routes: file-integrity
        events on cron/scheduled-task directories, authorized_keys/startup paths, the
        CPM program tree and SMC_Files staging; process-creation events with the CPM Java
        process as parent of a shell; cron reload events. Triage discriminator for the
        scanner: application name 'bf-check' in cpm.elg (source-stated).
      - Post-patch: rotate management credentials and internal-CA-issued certificates on
        any server that was reachable and unpatched; patching does not evict an
        attacker who already wrote to root-owned paths. Check cron directories and
        authorized_keys for persistence that survives the hotfix.
      - Exposure-check lever: external patch-state scan over TCP 19009 (public tool) answers
        'build' but not 'who can reach it'; Trusted Clients (implied rule) must be
        reviewed separately from the rule base.
      - Scope-of-fix inference: the Bishop Fox patch-scope claim (3 defects) is a researcher
        bytecode comparison; Check Point's advisory text names a directory traversal and a
        file upload only. Treat as an assessment attributed to Bishop Fox.
      - Not new / unsupported: no ITW actor, tooling or victim data beyond 'a handful' on
        2026-07-23; no Check Point statement on the Bishop Fox route; no public exploit
        code located (GitHub repository search for the CVE id returns only the Bishop Fox
        scanner and a third-party IOC-check repo, WadesWeaponShed/CVE-2026-93616_Checks,
        created 2026-09-22; the latter was not fetched or assessed). Weaponization detail
        is now described publicly at mechanism level by a credible lab, so a copycat
        exploit is plausible (assessment, not source-stated); EPSS 0.1965 (97.3rd
        percentile) as of 2026-10-03.
      - Bishop Fox lab scope: R81.10 and R82.10 (unpatched) and R82.10 Take 45 (patched).
        Scanner validated against an R82.10 Take 44/45 pair and the legacy path against
        R80.40; R82, R81.20 and R82.20 not separately A/B tested (README limitations).
