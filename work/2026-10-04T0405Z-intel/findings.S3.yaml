  - title: "Huntress: a self-registered account plus an unrestricted upload turns a shared municipal recreation-management platform into a webshell and card-data foothold, and the actor returns after cleanup"
    sources:
      - { url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack", publisher: "Huntress", date: "2026-09-30", role: "primary" }
    discovery_trace: "first seen at: huntress RSS, URL https://www.huntress.com/blog/rss.xml (item 'Determined Attacker Uploads Malicious Webshells to Parks and Rec Management Platform Servers', 2026-09-30T04:00Z) → primary (no pivot needed): Huntress, URL https://www.huntress.com/blog/parks-recreation-platform-webshell-attack → corroboration attempt: WebSearch (\"Huntress parks and recreation management platform webshells municipal servers payment data member account file upload\") returned only the Huntress post itself, no independent coverage and no vendor or CVE"
    summary: |
      Huntress describes an intrusion it first observed on 2026-09-10 against a shared, multi-tenant recreation-management
      platform used by municipalities and parks departments (IIS/ASP.NET, vendor not named, no CVE named, patch status not
      stated). On the first server the actor spent roughly six hours on unauthenticated attempts (login brute force, IIS 8.3
      tilde enumeration, WebDAV verbs, upload-handler parser bypasses, forced browsing) with no success. What worked was
      the front door: it registered a normal member account and uploaded 14 files, eight of them .aspx (the rest .jpg and .pdf extension tests), into the platform's
      member-files document directory, then ran commands through the .aspx shells from the IIS worker process. It enumerated
      sites with appcmd, read applicationHost.config and web.config connection strings and keys, connected to the database
      with the harvested SQL credentials, and searched files and the payment gateway's plain-text webhook logs for card
      numbers, expiry dates and CVVs. On a second server it was quieter; after Huntress locked down the first two it hit
      a third, copied its shells into web roots under asset-like names (css_bundle.aspx style), timestomped them to match
      web.config, and probed the payment-module folders. When that third server went back into production prematurely, the actor returned
      with the same registered account, re-uploaded shells and used PowerShell scripts to append an obfuscated loader to a
      jQuery file that the authentication page loads, turning every visiting browser into an encrypted WebRTC/WebSocket
      C2 client that evals pushed frames and harvests credentials in real time. Huntress infers a China-based operator from
      a zh-CN PowerShell user-agent ("most likely") and suspects AI-generated tooling from script comments; both are
      Huntress assessments, not attribution. Huntress states it removed shells and notes the actor "walked straight back in
      after a server was cleaned but not fully locked down."
    region_nexus: "global (appears US municipal; no Swiss victim or Swiss use of the platform stated)"
    primary_sector_nexus: "direct pattern (municipal e-services portal with open self-registration, uploads and card payments; transferable to communal portals)"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1505.003, T1059.003, T1059.001, T1083, T1033, T1082, T1552.001, T1005, T1036.005, T1070.006, T1059.007, T1056.003]
    affected_products: ["Microsoft IIS", "ASP.NET", "unnamed recreation management platform"]
    entity_keys: []
    new_entities:
      - { key: "incident:recreation-management-platform-webshell-municipal-tenants-2026-09", type: incident, name: "Recreation-management platform webshell intrusions (municipal tenants)", aliases: [],
          summary: "Huntress-observed intrusions from 2026-09-10 against three servers of a shared municipal recreation-management platform: self-registered account, upload to webshell, card-data theft, then a jQuery-based credential-harvesting trojan on the login page after a server was returned to service too early (Huntress, 2026-09-30)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    sourcing_note: "Huntress SOC first-hand telemetry; no vendor advisory, CVE or independent report found."
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    lookback: true
    recency_note: "Huntress post dated 2026-09-30T04:00Z, inside the huntress record's 121 h lookback; about 70 h before this window opened. Not in prior_coverage or the store."
    evidence:
      - quote: "On September 10, 2026, Huntress observed a threat actor compromising multiple tenants on a shared recreation management software platform using one repeatable trick: register a member account, upload a malicious file, and turn it into a webshell."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
      - quote: "the attacker was able to upload malicious files directly to the"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
      - quote: "When the third server was put back into production prematurely, the threat actor returned with a vengeance."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
      - quote: "creating their own account on the platform and finding a flaw in the upload function"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
    extended_notes: |
      Detection concept: web/app telemetry first. A new member registration followed within minutes by uploads to the
      member-files directory; script-capable extensions (.aspx) appearing in a user-upload or documents directory; the IIS
      worker process (w3wp.exe) spawning cmd.exe or powershell.exe (whoami, ipconfig, net user, systeminfo, appcmd, findstr
      over config files); web-root files whose creation and modified times were copied from web.config (timestomping), i.e.
      newly added files sharing identical timestamps with a config file; a static JS asset (here the jQuery mousewheel file
      loaded by the login page) whose hash or modified time differs from the deployed package; PowerShell and JS dropped into
      C:\Windows\Temp as .b64 then decoded. Benign lookalike: legitimate member document uploads (.pdf/.jpg) go to the same
      folder; the discriminator is an executable script type, or a file later requested directly and spawning child processes.
      Post-cleanup check (the step readers miss): disable or purge the accounts the actor registered and fix the upload handler
      before returning a cleaned server to service; the actor reused the same account to come back. Hardening levers implied
      by the incident: no script execution in upload directories, payment tenant separated from the general tenant, payment
      webhook logs not holding card data in plain text on the web server. Exposure: Swiss relevance is by pattern only; the
      platform vendor is unnamed, so any communal booking or payment portal built on a shared ASP.NET/IIS multi-tenant platform
      with open self-registration and file uploads should be reviewed for the same weakness. Hunt IOCs (webshell keys, hashes,
      workers.dev hosts) exist in the Huntress post; keep out of the entry.

