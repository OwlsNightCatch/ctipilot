      Exposure check: the extension version in the browser-management inventory (2.16.0.0 is stated vulnerable; the fixed
      version number is not given by either source, only that the stores were updated on 2026-08-07 and that the update
      points to a new native host so auto-updated extensions cannot reach the old one). Detection concept: unexpected DLL
      loads or child processes from the Authenticode-signed SConnect native host process, and an add-on package written to
      disk that the signed host then loads. Hardening: retire SConnect where the vendor-recommended Web Connect or another
      client exists, and allowlist extensions. The researchers say more eID/signing-extension findings (Brazil, "~10M
      endpoints") are coming, so this is an early marker of a class, not a one-off.

