    discovery_trace: "first seen at: msft-secblog bridge (python3 tools/fetch_source.py msft-secblog recent 6) during the quick research-majors pass, URL https://www.microsoft.com/en-us/security/blog/2026/10/01/insights-from-the-2026-microsoft-digital-defense-report/ → pivot: Microsoft On the Issues government post, URL https://blogs.microsoft.com/on-the-issues/2026/10/01/preparing-governments-for-an-era-of-interconnected-cyber-risk/ → pivot: report landing page via https://aka.ms/MDDR2026 (resolves to https://www.microsoft.com/en-us/corporate-responsibility/topics/cybersecurity/reports/microsoft-digital-defense-report/) → primary: the report PDF (python3 tools/fetch_source.py pdf https://aka.ms/Microsoft-Digital-Defense-Report-2026, redirects to the cdn-dynmedia-1.microsoft.com PDF above; 103 pages decoded)"
    summary: |
      Microsoft published its annual Digital Defense Report on 2026-10-01 (reporting period July 2025 to June 2026;
      year-over-year comparisons use July 2024 to June 2025). The government-facing companion post states that
      government agencies and services were the sector most impacted by cyber threats in 2026, 27% of Microsoft's observed
      activity against 17% in 2025, and that governments are also the most frequently targeted sector for nation-state
      activity. Microsoft's assertions on the access picture: phishing accounted for 23% of observed intrusions (7% in
      2025); of intrusions that began with valid accounts, 52.2% involved follow-on credential theft and a further 18.4%
      involved active password spray; DART engagement data shows a statistically significant increase in dwell time (the
      length of threat-actor activity stayed broadly stable), with the sharpest dwell-time rise in industrials and
      manufacturing. The report names open-source supply-chain compromise, attacks against edge devices and AI as a force
      multiplier as the three threats it expects to matter most over the next year, and for the SLED and critical-
      infrastructure group reports cloud identity abuse as the most observed technique (62% SLED, 78% critical
      infrastructure) including OAuth consent abuse with tradecraft overlapping ShinyHunters. On ransomware, leak-site
      data puts Qilin first (16.4% of listed victims, +386%) while Microsoft Defender telemetry puts Akira first (22%,
      +150%) ahead of Qilin (14%, +111%), with Microsoft cautioning that leak-site activity can be pushed to advertise new
      offerings. Swiss data points as read from the report PDF text (table cells, not prose, so verify against the PDF
      before quoting): Switzerland appears in the report's year-over-year ransomware country table at 29 (2025 period)
      and 59 (2026 period), +103%, while the table total fell 3%; and Switzerland is the tenth entry (2%) in Microsoft's
      Russia-nexus nation-state notification target-country list, in which government is the top targeted sector (25%).
      Caveat: all figures are Microsoft customer-telemetry and notification data (Microsoft-estate skew), and the
      government post is a policy piece; nothing here is independently replicated.
