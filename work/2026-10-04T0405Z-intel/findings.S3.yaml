    borderline_reason: "Real, critical-class flaw in government-grade eID/token middleware, but no Swiss deployment evidenced, the product is end of life and patched since August, and it overlaps S1 (CVE disclosed 2026-10-01); the transferable lesson (native-messaging eID and signing bridges that trust any web origin) is the value."
    recency_note: "Researcher post 2026-10-02 and Dark Reading 2026-10-02T16:27Z; inside darkreading's 121 h lookback, about 10 h before the 26 h window opened."
    evidence:
