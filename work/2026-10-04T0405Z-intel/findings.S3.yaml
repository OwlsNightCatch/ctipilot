  - title: "SConnect (Thales) hardware-token browser middleware: any website or iframe could forge the vendor signature check and load an attacker DLL (CVE-2026-18397, CVSS 9.4)"
    sources:
      - { url: "https://amibeingpwned.com/blog/8-in-10-banks", publisher: "Bay Area Labs (Am I Being Pwned?, J. Arnott)", date: "2026-10-02", role: "primary" }
      - { url: "https://www.darkreading.com/cybersecurity-operations/swift-banking-govt-middleware-rce", publisher: "Dark Reading", date: "2026-10-02", role: "corroborating" }
    discovery_trace: "first seen at: darkreading RSS, URL https://www.darkreading.com/rss.xml (item 'SWIFT Banking & Government Middleware Enables RCE', 2026-10-02T16:27Z) → pivot: Dark Reading article, URL https://www.darkreading.com/cybersecurity-operations/swift-banking-govt-middleware-rce → primary: Bay Area Labs write-up, URL https://amibeingpwned.com/blog/8-in-10-banks; vendor advisory: WebSearch (\"CVE-2026-18397 SConnect Thales advisory\") found none, so the vendor side rests on the researcher's timeline and Dark Reading's note that Thales had not responded"
    summary: |
      Bay Area Labs (disclosed 2026-10-02) reports a drive-by remote code execution in SConnect, the Thales (ex-Gemalto)
      browser extension plus native host used with 3SKey and SWIFT, eID and other hardware signing tokens (1M+ Chrome Web
      Store users). Version 2.16.0.0 of the extension and native host is stated vulnerable. The native host checks that a
      calling site presents a vendor-signed token using a hand-rolled RSA-2048 verification; for an oversized signature
      (the researchers used 257 bytes of 0xFF) the modular exponentiation fails and writes nothing, the caller ignores the
      return code, and the verifier then reads a malloc'd, never-zeroed buffer. Because the extension keeps one long-lived
      native-messaging port, a heap spray accumulates until the buffer happens to hold bytes that pass the check; failed
      attempts are silent and repeatable, and the researchers report about an 18% success rate for an agent-developed spray.
      Chaining three forged signatures (site token, add-on package manifest, inner signature list) makes the signed Thales
      host call LoadLibrary on an unsigned DLL in 6 to 10 seconds, and because the content script runs in all frames, an
      embedded iframe suffices. They could not test with a real token or eID, so impact on token-protected sessions is
      speculation. Researcher timeline: reported 2026-06-29, confirmed by Thales 2026-07-03, fixed on the Apple App Store and
      Chrome Web Store 2026-08-07, removed from Edge Add-ons 2026-09-13 (89K users at removal), CVE published 2026-10-01.
      Dark Reading adds that SConnect is end of life as of September in favour of SWIFT's Web Connect, and lists Qatar's
      national authentication system and the Swedish Tax Agency among sites using it. No exploitation in the wild is
      reported by either source; Thales had not answered Dark Reading, and no Thales advisory was located.
    region_nexus: "global (SWIFT/banking, Qatar national IdP, Swedish Tax Agency named by Dark Reading); no Swiss use evidenced"
    primary_sector_nexus: "indirect (government eID and hardware-token middleware class; no Swiss deployment evidenced in either source)"
