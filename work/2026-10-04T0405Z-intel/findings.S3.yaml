  - title: "Huntress: an attacker-built ChatGPT Custom GPT, promoted by Google Ads, funnels users into a ClickFix chain that ends in an in-memory RAT"
    sources:
      - { url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat", publisher: "Huntress", date: "2026-09-28", role: "primary" }
      - { url: "https://www.darkreading.com/cyberattacks-data-breaches/malicious-custom-gpts-chatgpt-rat-delivery-lure", publisher: "Dark Reading (interviews Huntress's J. Semon)", date: "2026-09-30", role: "corroborating" }
      - { url: "https://www.scworld.com/news/malicious-chatgpt-custom-gpts-lead-to-clickfix-attack", publisher: "SC Media", date: "2026-09-30", role: "corroborating" }
      - { url: "https://www.infosecurity-magazine.com/news/chatgpt-feature-abuse-to-deliver/", publisher: "Infosecurity Magazine", date: "2026-09-30", role: "corroborating" }
    discovery_trace: "first seen at: darkreading RSS, URL https://www.darkreading.com/rss.xml (item 'Malicious Custom GPTs Turn ChatGPT Into RAT Delivery Lure', 2026-09-30T21:25Z) → primary: Huntress, URL https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat (also visible in the huntress RSS, URL https://www.huntress.com/blog/rss.xml) → corroboration: WebSearch (\"Huntress Custom GPT \\\"Plus 5.6\\\" ClickFix Google Sites Canon COTFileReadApp RAT OpenAI\") → SC Media URL https://www.scworld.com/news/malicious-chatgpt-custom-gpts-lead-to-clickfix-attack and Infosecurity URL https://www.infosecurity-magazine.com/news/chatgpt-feature-abuse-to-deliver/ (both rewrites of the Huntress post, so one first-hand observation)"
    summary: |
      Huntress reports (2026-09-28) a campaign from late September in which victims who search Google for "chatgpt" get
      a sponsored result that opens an attacker-created Custom GPT on the genuine chatgpt.com domain, titled "Plus 5.6" and
      attributed to a "community builder". Whatever the visitor types, the GPT answers with a fake service-availability
      notice that points to a "backup domain" on Google Sites, which shows a Cloudflare-style fake CAPTCHA and a ClickFix
      paste-and-run instruction. The pasted PowerShell command fetches a layered, integer-array-obfuscated script from a
      host written as a single decimal number (so URL rules looking for dotted IPs never see one), which silently installs
      a hidden MSI presented as a printer-configuration reader. The MSI starts a legitimately signed Canon application that
      side-loads a patched Canon DLL; that DLL pulls in unsigned DLLs which XOR-decode shellcode from a file posing as a WAV.
      The shellcode bypasses AMSI, unhooks ntdll, runs anti-VM checks and hosts the .NET CLR, then opens a custom
      encrypted archive holding a persistence script and the RAT. Huntress assesses a maintained framework: persistence is
      an HKCU Run value plus a scheduled task of the same name that the implant re-creates every few minutes. The RAT does
      remote desktop, camera and microphone capture, content search across the host, execution of follow-on payloads, and
      resolves its C2 through DNS-over-HTTPS to public resolvers; the usual next step was a signed third-party camera tool
      dropped into a user-profile folder that launched a browser. Huntress states its SOC responded to at least 40 incidents
      from the specific Google Sites domain and confirmed two that came through a Custom GPT; OpenAI took the first GPT
      down on 2026-09-25 and Huntress found a replacement on 2026-09-27. The second build swaps the signed host (Stardock
      instead of Canon), hides the loader inside a Microsoft NuGet package instead of a WAV, strips Mark-of-the-Web and
      re-obfuscates its stager per request, while the RAT is byte-identical. Huntress warns that detections tied to the
      Canon or Stardock names will miss the next costume change.
    region_nexus: "global; no Swiss victim named"
    primary_sector_nexus: "indirect (workforce-wide lure: employees searching for ChatGPT; browser-delivered, Windows endpoints)"
    sector: "cross-sector"
    cves: []
    techniques: [T1583.008, T1204.004, T1059.001, T1218.007, T1574.001, T1036.005, T1027, T1140, T1620, T1685, T1497, T1547.001, T1053.005, T1105, T1113, T1123, T1125]
    affected_products: ["OpenAI ChatGPT Custom GPTs", "Google Ads", "Google Sites", "Microsoft Windows"]
    entity_keys: []
    new_entities:
      - { key: "campaign:huntress-chatgpt-custom-gpt-clickfix-rat-2026-09", type: campaign, name: "ChatGPT Custom GPT ClickFix RAT campaign", aliases: ["Plus 5.6 Custom GPT campaign"],
          summary: "September 2026 campaign in which a malicious Custom GPT on chatgpt.com, reached through a Google sponsored result, redirects to a Google Sites ClickFix page that delivers a signed-binary-sideloaded, in-memory RAT; Huntress counts at least 40 SOC incidents from the Google Sites domain, two confirmed via a Custom GPT (Huntress, 2026-09-28)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    sourcing_note: "One first-hand source (Huntress SOC telemetry and sample analysis); SC Media, Infosecurity and Dark Reading all trace to it (Dark Reading adds a Huntress analyst interview, not independent observation). Huntress is the discloser and the telemetry holder."
    confidence: HIGH
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    lookback: true
    recency_note: "Huntress primary is dated 2026-09-28T20:00Z, about 7 h outside the huntress record's own 121 h lookback; the freshest sources (Dark Reading, SC Media, Infosecurity) are 2026-09-30, inside darkreading's 121 h lookback. Not in prior_coverage or the store (grep for Custom GPT / Plus 5.6 / COTFileReadApp empty). The main agent applies the recency gate; this is the item most worth keeping."
    evidence:
      - quote: "has responded to at least 40 incidents stemming from the specific Google Sites domain involved in this attack, and confirmed that two of these incidents came through a Custom GPT instance"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"
      - quote: "Most ClickFix chains we see are two or three hops: paste a command, download something, run it. This one has eight, and each hop exists to hide the next one."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"
      - quote: "rules and URL filters that look for a dotted IP address never see one"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"
      - quote: "Detections tied to Canon or Stardock names will miss the next swap."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat"
      - quote: "this RAT is built to do three things: steal data, watch the people using the machine, and serve as a foothold into the rest of the network"
        attribution: "Huntress (J. Semon, quoted by Dark Reading)"
        source_url: "https://www.darkreading.com/cyberattacks-data-breaches/malicious-custom-gpts-chatgpt-rat-delivery-lure"
    extended_notes: |
      Detection concept (telemetry class first): process-creation lineage on endpoints. powershell.exe launching msiexec.exe
      /i against a GUID-named MSI in the user temp folder with /qn /norestart; a signed vendor binary started by msiexec from
      a product folder under %LOCALAPPDATA%\Programs that is not a real install of that vendor; an unsigned DLL (or one whose
      header checksum no longer matches) sitting beside a signed executable; an HKCU Run value and a scheduled task sharing
      one name that reappear after deletion (kill the process first, then remove both, or the implant restores them).
      Proxy or egress logs: a URL whose host is a single decimal integer; DNS-over-HTTPS to public resolvers from a
      non-browser process. Huntress's own point: behaviors carry over between the Canon and Stardock builds (PowerShell
      launching msiexec on a GUID MSI in temp; signed app started by msiexec from a fake product folder; Run value plus
      task with one shared name), so key on behavior, not on vendor file names. Triage lookalike: software-deployment
      tooling also runs msiexec /qn from PowerShell; the discriminators are the user-profile install path under an unrelated
      product name, the decimal-host download, the identical-name Run key and task, and the sideloaded unsigned DLLs. Entry
      level hardening is not stated by the source beyond awareness ("check what it's asking you to do"); the paste-into-terminal
      step is the control point. IOC-like artefact names exist in the Huntress post (hashes, domains, file names); keep out of the entry.

