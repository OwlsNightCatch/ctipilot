    summary: |
      On 2026-09-23 the US Department of Justice announced a criminal complaint against Oxygen Forensics' CEO Lee Reiber (arrested in Idaho) and co-founder/CTO Oleg Davydov (a Russian national, arrested at London Heathrow, extradition pending), alleging they certified to US agencies that the company had no foreign ownership or control and that its software was developed in the US, when five Russian nationals (Davydov among them, via a Cyprus holding) owned and controlled it and the software was developed in Russia; the same owners control the Moscow company MKO Systems, which the DOJ says sold the underlying technology to the FSB and Russia's Interior Ministry (DOJ, quoted by Security Affairs; The Record; RFE/RL). Oxygen Forensic Detective extracts and decrypts data from phones, computers, cloud services and drones. Reporting derived from Politico and EU tender records says police agencies in Germany, Spain, Italy and Poland accredited or purchased the products, Hungary's police signed a contract in December 2024, and Romania and Latvia bought as recently as September 2026, days before the arrests; Interpol is reported to have been a customer and no longer is. The Met Police confirmed a contract since 2023, use in fewer than 40 cases last year, and said use is suspended pending a full review and that investigation data was not transmitted to Oxygen (WinFuture relaying The Telegraph); Romania's National Anticorruption Directorate told Politico it will stop using the products. Cybernews notes explicitly that US prosecutors have not claimed the software contained malicious code or was used to obtain unauthorised access to customers' data. The open risk for any forensic customer is therefore provenance, vendor-ownership and legal exposure, not a demonstrated implant; the Swiss constituency relevance rests solely on whether any federal or cantonal police, military-police or public-prosecution unit licenses the product, which no source found establishes.
