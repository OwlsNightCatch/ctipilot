  - title: "Technical University of Denmark (DTU): attacker used compromised user profiles to reach the university's identity and access management system and downloaded up to 23 years of personal data on up to 200,000 people"
    novelty: new
    borderline: true
    borderline_reason: "Public-sector institution (national technical university) with a transferable lesson for Swiss universities/ETH-domain and cantonal IAM directories: a user-profile compromise reached an IAM directory holding national ID numbers for former users back to 2003. But it is out of the Swiss/CH nexus, names no actor, no initial-access detail beyond 'compromised profiles', and the downloaded scope is explicitly unknown. Below the incident floor unless the composer wants a two-sentence routine entry."
    sources:
      - { url: "https://www.dtu.dk/english/NewsArchive/2026/10/Cyberattack-on-DTU_Notification-of-a-personal-data-breach", publisher: "Technical University of Denmark (DTU)", date: "2026-10-02", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/danish-university-dtu-breach-exposes-data-of-up-to-200-000-people/", publisher: "BleepingComputer", date: "2026-10-03", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, feed https://www.bleepingcomputer.com/feed/ (item 2026-10-03T10:35Z) → extract https://www.bleepingcomputer.com/news/security/danish-university-dtu-breach-exposes-data-of-up-to-200-000-people/ → primary: DTU notice, URL https://www.dtu.dk/english/NewsArchive/2026/10/Cyberattack-on-DTU_Notification-of-a-personal-data-breach (extract; resolved from BleepingComputer's link, page dated 2026-10-02)"
    summary: |
      DTU's own notice (Friday 2026-10-02) says that in a targeted attack unauthorised persons compromised DTU user profiles and used them to log into DTUBasen, the university's identity and access management system, and downloaded a large amount of data; DTU says its incident-response team has contained the attack and that it cannot determine precisely what was downloaded or how many people are affected. DTUBasen holds records on about 40,000 active and 160,000 former users reaching back to 2003. For active users the data can include the Danish CPR civil registration number, full name, home address, photo, work contact details and next-of-kin name, relationship and phone number; for former users home addresses, photos and next-of-kin details are auto-deleted after six months, but CPR numbers and full names remain. DTU has notified the Danish Data Protection Agency and referred the case to the authorities, will notify current/former staff and nearly all students by e-Boks, and warns of identity fraud and more convincing phishing. No actor, malware, entry point beyond the compromised profiles, or exfiltration path is stated.
