      CVE record read at https://cveawg.mitre.org/api/cve/CVE-2026-88779 (verification only, state PUBLISHED, datePublic 2026-10-04T02:19Z; do not cite). NVD REST returned 0 results at 04:11Z (not yet ingested).
    summary: |
      Citrix security bulletin CTX697174 (2026-10-03) describes CVE-2026-88779, a memory-overflow flaw (CWE-119) in customer-managed
      NetScaler ADC and NetScaler Gateway that an unauthenticated network attacker reaches when the appliance is configured as a SAML
      service provider (`add authentication samlAction`) or SAML identity provider (`add authentication samlIdPProfile`) on a Gateway
      or AAA virtual server. Citrix rates it CVSS 4.0 8.7 with availability impact only; its companion blog states "Citrix has
      observed targeted attacks on unmitigated NetScaler deployments which can lead to Denial of Service" and that it has not
      identified an impact on the integrity of customer data. Citrix states the issue is independent of the CVE-2026-88771 to
      CVE-2026-88778 bulletin CTX697096. Fixed builds are 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 (13.1-FIPS and
      NDcPP), so appliances patched to the previous floor (14.1-73.37 / 13.1-64.23) are still affected. Citrix's interim mitigation is
      a set of Global Deny List signatures delivered through NetScaler Console virtual patching (builds from 14.1-73.37 up to
      14.1-73.41 and from 13.1-64.23 up to 13.1-64.28). Before the bulletin, administrators and researchers reported repeated
      crashes and forced reboots of fully patched appliances from the evening of 2026-10-02; heise relays British researcher Kevin
      Beaumont's report that a downloaded binary was running on one of his patched honeypots and a claim that watchTowr Labs
      reproduced the flaw, with possible code execution. Citrix does not confirm code execution and its CVSS vector scores no
      confidentiality or integrity impact, so DoS is the vendor-stated impact and code execution is an unconfirmed
      researcher claim. CISA KEV (catalogue 2026.10.02) does not list it yet and NCSC Switzerland has no advisory yet.
    region_nexus: "global; internet-facing NetScaler Gateway / AAA with SAML is standard remote-access and SSO infrastructure in European and Swiss public administrations; NCSC-CH, CERT-EU and NCSC-NL already issued advisories on the same product line's 2026-09-27 zero-days"
    primary_sector_nexus: "direct (government remote-access / SSO edge appliances); no source names a public-sector victim"
