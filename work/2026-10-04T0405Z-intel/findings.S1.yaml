        attribution: "Citrix (Tech Zone blog, SAML guidance)"
        source_url: "https://community.citrix.com/techzone-blogs/110_security-updates/security-update-guidance-for-netscaler-saml-authentication-deployments/"
      - quote: "Since the evening of October 2, 2026, an exploit for a new security vulnerability on Citrix NetScaler devices has apparently been circulating."
        attribution: "heise online"
        source_url: "https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"
      - quote: "the watchTowr Labs team has now successfully reproduced this vulnerability."
        attribution: "heise online (quoting a security expert)"
        source_url: "https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"
    extended_notes: |
      Exposure: customer-managed NetScaler ADC and Gateway only (Citrix upgrades Citrix-managed cloud services and Citrix-managed
      Adaptive Authentication itself); Secure Private Access Hybrid deployments that use NetScaler instances are also affected
      (bulletin note). The vendor-documented check is a configuration search for `add authentication samlAction` or
      `add authentication samlIdPProfile`; Citrix ties applicability to a Gateway or AAA virtual server using SAML. Fixed builds:
      14.1 -> 14.1-73.41+, 13.1 -> 13.1-64.28+, ADC 14.1-FIPS -> 14.1-73.41 FIPS+, ADC 13.1-FIPS/NDcPP -> 13.1-37.282+.
      Mitigation (Citrix blog): Global Deny List signatures via NetScaler Console (on-premises with Cloud Connect, or the Console
      service) with "Virtual patching" enabled, signature version at least v24 per `show appfw signatures`, counters visible
      through `stat denylist global AAA_REQUEST`; applies only to builds >= 14.1-73.37 and < 14.1-73.41 or >= 13.1-64.23 and
      < 13.1-64.28. Citrix also suggests blocking suspicious source addresses with the NetScaler blocklist feature.
      Detection (community-reported, NOT vendor-stated, via Cyber Press and Cyber Security News relaying Reddit administrator
      threads): repeated crashes of the `nsaaad` authentication daemon, the `pitboss` watchdog restarting the appliance after a
      crash threshold, HA failovers, files in /var/core, one administrator seeing an apparent script-download command in
      appliance logs (download did not succeed), and a payload delivered in the username field of crafted SAML traffic.
      Preserve core files, logs and a support bundle before the next restart. Triage: reboot loops alone are not proof of
      compromise (Cyber Security News says so explicitly); correlate reboot times with inbound SAML request bursts, firewall logs and
      identity-provider logs. Post-patch: this bulletin adds no persistence guidance; the earlier 2026-09-27 zero-day compromise
      checks remain separate.
      Conflicts to hold: (1) Citrix says DoS and no data-integrity impact; heise relays researcher claims of code execution and
      a downloaded binary on a patched honeypot (Beaumont), a watchTowr reproduction, and speculation that it bypasses the CVE-2026-88771/88772 fix.
      Cyber Security News notes the reboot reports "do not yet prove attackers have bypassed the September patch". (2) heise
      (published before the bulletin) says no patch existed; the bulletin and fixed builds appeared 2026-10-03 PDT. Citrix
      thanks Bishop Fox and watchTowr in the bulletin; no Bishop Fox or watchTowr write-up is public yet (checked bishopfox.com/blog,
      labs.watchtowr.com RSS, watchtowr.com/intelligence).
      Timing: bulletin 2026-10-03 (PDT); Citrix blog published 2026-10-03T18:42 PDT (= 2026-10-04T01:42Z); CVE record datePublic
      2026-10-04T02:19Z; EUVD ingest 2026-10-04T02:35Z. FIRST EPSS has no score yet (CVE too new).
      Not found: NCSC-CH, CERT-EU, NCSC-NL, BSI or CISA output on this CVE as of 2026-10-04T04:30Z.
      Recommended defender takeaway: patch SAML-configured appliances to the .41/.28 floor even if already on 14.1-73.37 / 13.1-64.23;
      until then check SAML configuration, apply the Global Deny List mitigation where Console virtual patching is available, and watch
      nsaaad crashes.

