  # ------------------------------------------------------------------ ITEM 6 (borderline new: Exchange SU V2)
  - title: "Exchange Server September 2026 SU re-released as V2: CVE-2026-96940, an authenticated cross-mailbox read rated Exploitation More Likely, is in V2 only"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-96940", publisher: "Microsoft Security Response Center (Security Update Guide)", date: "2026-10-02", role: "primary" }
      - { url: "https://techcommunity.microsoft.com/blog/exchange/released-september-2026-v2-exchange-server-security-updates/4561718", publisher: "Microsoft Exchange Team Blog", date: "2026-10-02", role: "primary" }
    discovery_trace: "first seen at: msrc-update-guide, `python3 tools/fetch_source.py msrc recent 60` (CVE-2026-96940, releaseDate 2026-10-02T07:00-07:00, release 2026-Oct) → `msrc cve CVE-2026-96940` (CVRF-style JSON) → primary: Exchange Team Blog https://techcommunity.microsoft.com/blog/exchange/released-september-2026-v2-exchange-server-security-updates/4561718 (read via extract, direct-raw HTML meta/JSON-LD); also in the ENISA EUVD sweep as EUVD-2026-91771"
    summary: |
      Microsoft released a V2 of the September 2026 Exchange Server security updates on 2026-10-02; the Exchange team states the only
      difference from the original September release is the addition of CVE-2026-96940. MSRC describes it as weak authorization in Exchange Server that lets an authenticated attacker elevate
      privileges over the network (CWE-1390, CVSS 3.1 8.8, severity Important, publiclyDisclosed No, exploited No) and rates it "Exploitation
      More Likely". Per the MSRC FAQ, a successful attacker could read other users' mailboxes and attachments within the same organization;
      tenant boundaries are not crossed, and Exchange Online already carries a service-side fix. SUs apply to Exchange Server Subscription Edition RTM and, under the
      Period 2 ESU programme, Exchange 2019 CU14/CU15 and 2016 CU23. Administrators who installed the original September SU therefore
      need the V2 packages to get this fix. No exploitation or public proof of concept is reported; FIRST EPSS 0.00496 on 2026-10-03.
    region_nexus: "global; on-premises Exchange footprint in Swiss public administrations is plausible but no source states it"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-96940]
    techniques: [T1114.002, T1068]
    affected_products: ["Microsoft Exchange Server Subscription Edition", "Microsoft Exchange Server 2019", "Microsoft Exchange Server 2016"]
    entity_keys: ["product:microsoft-exchange-server"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "not exploited, authenticated, no PoC; publication (2026-10-02T14:00Z MSRC, 19:07Z blog) is about 7 hours before the window opens and it was not covered by the 2026-10-03 fire. Included for the V2-re-release action (SU installers must re-apply) and 'Exploitation More Likely' on widely deployed on-prem mail; main agent decides"
    classification_suggestion: "A2"
    evidence:
      - quote: "Weak authorization in Microsoft Exchange Server allows an authenticated attacker to elevate privileges over a network."
        attribution: "Microsoft Security Response Center"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-96940"
      - quote: "The difference between the original September 2026 Security Update release and this V2 release is an addition of CVE-2026-96940."
        attribution: "Microsoft Exchange Team Blog"
        source_url: "https://techcommunity.microsoft.com/blog/exchange/released-september-2026-v2-exchange-server-security-updates/4561718"
    extended_notes: |
      MSRC FAQ (verbatim sense): an authenticated attacker could gain unauthorized access to other users' mailboxes within the same
      organization and read email messages and attachments. Detection guidance is not in either source. Inference (labelled): non-owner
      mailbox access in Exchange mailbox-audit or Unified Audit Log records is the observable to hunt; confirm against Microsoft's audit documentation before putting it
      in an entry. CVSS vector CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H/E:U/RL:O/RC:C (temporal 7.7). MSRC: latestSoftwareRelease
      'Exploitation More Likely'.

