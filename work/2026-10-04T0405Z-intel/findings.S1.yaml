  - title: "CVE-2026-88779, Citrix NetScaler ADC and Gateway: a pre-auth memory overflow in SAML authentication crashes fully patched appliances, Citrix confirms targeted attacks, and the fixed-build floor moves up again (CVSS 4.0 8.7)"
