claims:
  - {claim_id: 793e3cbd50, passage: 'Bishop Fox 2026-10-01: ''Every step runs over one port, TCP 19009''; indicators: ''the chain we validated does not touch the code path the vendor''s indicators watch''; scanner tool linked', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: b35b30b500, passage: '''we observed a handful of pinpointed attacks on July 23, 2026''; sk1000171 R82.20 Security Hotfix + Jumbo takes 45/127/170/192; BF: ''Restrict TCP 19009 ... Check Point''s primary mitigation''', source_url: 'https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/', verdict: ok}
  - {claim_id: 7a5d1ff534, passage: '''The fix is also included in: JHF R82.10 starting from Take 45 ... R82 Take 127 ... R81.20 Take 170 ... R81.10 Take 192''; ''a LivePatch is not be available for this issue''', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: 4e299eebea, passage: '''Make sure that access to port TCP/19009 is only possible from Trusted IP addresses ... make sure your Trusted Clients are limited to trusted internal IP addresses''', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: 128a418027, passage: 'Hunting IoCs: ''/etc/cron.d ...'', ''authorized_keys and the usual startup paths'', ''Anything new under $FWDIR/conf/SMC_Files''; second indicator ''leaves neither the ERROR line nor a ../''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 78daf46b12, passage: 'sk1000171: CVSS 9.8; affected R82.20, R82.10 Take 44 or lower, R82 126, R81.20 166, R81.10 190 (EoS), R80-R81 EoS; fixed R82.20 Security Hotfix + takes; KEV added 2026-09-22', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: 232f4ddbd2, passage: '''allows an unauthenticated attacker to upload and execute arbitrary scripts on the Check Point Management Server''', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: ba8c9bedc1, passage: '''allows an attacker to execute a script from an arbitrary path and load an arbitrary Java class''', source_url: 'https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/', verdict: ok}
  - {claim_id: dcebb82077, passage: '''we observed a handful of pinpointed attacks on July 23, 2026''; ''newly discovered zero-day vulnerability in Security Management''', source_url: 'https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/', verdict: ok}
  - {claim_id: 1fbe34e55c, passage: '''Because of the nature of the fix, a LivePatch is not be available for this issue.''', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: 83b9e22a45, passage: '''Check Point says those LivePatch takes do not fix CVE-2026-93616''; LivePatch Take 28, or Take 29 on R82.20, fixed CVE-2026-91843', source_url: 'https://thehackernews.com/2026/09/check-point-warns-of-management-server.html', verdict: ok}
  - {claim_id: 11edb1c7e8, passage: CVE-2026-93616 dateAdded 2026-09-22 (catalogVersion 2026.10.02 fetched this pass), source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: ok}
  - {claim_id: 66e8085052, passage: 'CVE-2026-85102 ''released fixes on September 9''; ''Starting September 12, 2026, we observed a wave of exploitation attempts against Spark customers''', source_url: 'https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/', verdict: ok}
  - {claim_id: 5c80850171, passage: '''Check for these two indicators of compromise on every Security Management, Multi-Domain ... SmartEvent Server''', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: e8578426a9, passage: '''whose crash signature, an over-long username next to a core dump, is the advisory''s first indicator, not evidence of this traversal'' (CVE-2026-91843); sk: core dump at the same time', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 071a0ff3c7, passage: 'Second indicator ''fires only when an upgrade-tools load fails, which makes it a weak net both ways''; ''The vendor''s second indicator watches for traces of [the upgrade-service traversal]''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 5f076697df, passage: '''Restrict TCP 19009 to trusted management hosts. Check Point''s primary mitigation''; Trusted Clients list ''emits an implied rule''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: a3a64f86cc, passage: '''Execution runs as root inside the process that holds your policy and internal CA. On any box that was exposed and unpatched, plan for credential and certificate rotation''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: f878cc9a1e, passage: '''Affected Products: Security Management Server, Multi-Domain ..., Log Server, Multi-Domain Log Server, SmartEvent''; Not Affected: ''Smart-1 Cloud (fix is already applied)'', Firewall Appliances, Spark F', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: dcd09d8b36, passage: 'Affected Versions: R82.20; R82.10 Take 44 or lower; R82 Take 126; R81.20 Take 166; R81.10 Take 190 (EoS); R80, R80.10, R80.20, R80.30, R80.40, R81 (all EoS)', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: c47d488b88, passage: '''Download the R82.20 Security Hotfix''; JHF R82.10 from Take 45, R82 Take 127, R81.20 Take 170, R81.10 Take 192', source_url: 'https://support.checkpoint.com/results/sk/sk1000171/', verdict: ok}
  - {claim_id: ad6b5346e2, passage: 'Derived from ''observed a handful of pinpointed attacks on July 23, 2026'' and the 2026-09-22 fix date; Bishop Fox: ''treat it as though it''s already compromised'' if reachable', source_url: 'https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/', verdict: ok}
  - {claim_id: e97e2f6ef2, passage: '''We reproduced the attack end to end against unpatched R81.10 and R82.10 lab servers, confirming execution as root on both. Every step runs over one port, TCP 19009.''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 7fd49c3889, passage: 'authenticateRemoteApplication ''reads the CN= half ... without checking that a certificate was presented''; cron.d overwrite runs as root, ''No trigger request is needed''; downloadRawFile reads output', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 6b960579cf, passage: '''We confirmed additional attack vectors from the same write primitive''; two listed; ''Closing any single one would leave the others standing.''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: bdf67428aa, passage: '''The hotfix closes three''; ''Either fix alone breaks the chain''; ''Check Point remediated more than it described.'' (bytecode diff of Take 45)', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 647afa3052, passage: '''The tool does not execute code on the target and does not detect prior compromise.''; BF: ''reports patch state from outside with one benign request''', source_url: 'https://github.com/BishopFox/CVE-2026-93616-check', verdict: ok}
  - {claim_id: 4981327ddf, passage: '''It fires only when an upgrade-tools load fails''; ''The route in this post never calls that service, so it leaves neither the ERROR line nor a ../''; ''A genuine upgrade can trip the grep''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 9851829d8e, passage: 'Hunting IoCs paths; ''A scheduled hash check can miss the change entirely ... restore the originals byte for byte. Pair file checks with execution telemetry, cron reload events, and an alert on the CPM', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: e1156cffb3, passage: '''The second is a permissions setting, not a rule base entry, so a rule base audit alone can miss it.''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: b2011a4af1, passage: Only link to a tool is the GitHub detection tool; PoC script described ('Our proof-of-concept script returned uid=0') but not linked, source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 6914180c1a, passage: 'Follows from second indicator never reached and first being CVE-2026-91843''s signature; BF: ''primitive is an arbitrary root write ... file-integrity monitoring rather than a log grep''', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: 052e98c83a, passage: 'Record summary matches the section (end-to-end chain over TCP 19009, scanner, second indicator not firing, first indicator = separate CVE, three defects, FIM hunting)', source_url: 'https://bishopfox.com/blog/weaponizing-check-point-management-cve-2026-93616', verdict: ok}
  - {claim_id: a083780bba, passage: 'Summary consistent with body; NL Times ''contacting customers and employees directly''; heise ''mindestens 10.000 Kunden''; Oct. 2 deadline (note: sell-threat is heise''s reading only, advisory F11)', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: ed614997f9, passage: '''Flink is headquartered and operates in Germany ... started up and wound down operations in both Austria and France''; ''serves dozens of municipalities in the Netherlands''', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: b9a3d580ad, passage: "'ein eigenes, eigentlich internes Bestellsystem ... in den Order Hubs ... kleine, dezentrale Lager in St\xE4dten ... Lieferung in unter einer halben Stunde' (paraphrase conflates system and warehouses, a", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 432c018c64, passage: '''gelangte eine unbefugte Person mithilfe kompromittierter Zugangsdaten in eines der internen Systeme des Lieferdienstes''; customer e-mail ''der Redaktion vorliegenden''', source_url: 'https://retail-news.de/flink-datenschutzvorfall-kundendaten-phishing/', verdict: ok}
  - {claim_id: c61c56a02f, passage: '''ein einzelner dieser Order Hubs angegriffen, dieser wurde auch schon identifiziert und der unberechtigte Zugriff unterbunden''', source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: e6ebacc5e0, passage: "'Flink tritt grunds\xE4tzlich nicht mit Kriminellen in Kontakt ... Flink auch in diesem Fall tats\xE4chlich gar nicht reagiert'", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 8bb8cf5ba6, passage: 'NL Times: ''The LPG Group is not particularly well-known'' (carries NL Times half); the ''and heise'' half (''bisher recht unbekannte Bande'') is on the heise page, not linked at this clause (low confidence', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: F3}
  - {claim_id: 35a067c10e, passage: "heise: 'Wenn nicht, w\xFCrden die Daten ... im deep web verkauft'; NL Times: 'delete all user data if the company itself pays ... 100 ETH ... A deadline of Oct. 2 was mentioned'", source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: 34e9d7379a, passage: "'Die Mails wenden sich namentlich und mit einem Flink-\xE4hnlichen gef\xE4lschten Absender an die Kunden, sodass diese wohl leicht verunsichert werden k\xF6nnten.'", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: b0c4b9c07b, passage: "'Name, Lieferadresse, E-Mail-Adresse und Telefonnummer ... Im Einzelfall ... Lieferhinweise wie das Stockwerk'; 'Passw\xF6rter, Zahlungsdaten, Kreditkarteninformationen und Bankdaten sollen ... nicht ...", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: cab7161efa, passage: '''"But I haven''t seen individual consumers being approached before," said Takkenberg in an interview with NOS''', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: e44d6b79f9, passage: "'Datenschutzbeauftragte des Landes Berlin ... informiert. Externe IT-Forensiker'; 'Anders als urspr\xFCnglich gemeldet hat Flink ... bisher nicht das BSI eingeschaltet.'", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 364b6895f3, passage: '''Flink has reported the matter to the German Data Protection Authority, and has filed reports with police there and in the Netherlands''', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: 75ef6c8c3f, passage: "'wandten sich die Angreifer zun\xE4chst an Flink direkt und forderten Geld in Form der Kryptow\xE4hrung ETH. Wenn sie bezahlt w\xFCrden ... w\xFCrden die Daten gel\xF6scht.'", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 1637cb4923, passage: '''Daher wandten sich die Kriminellen nun direkt an die Kunden''', source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 5b1050238f, passage: 'NL Times ''0.005 ETH ... 11.80 euros'', ''100 ETH, which is just shy of 237,300 euros''; heise ''mindestens 10.000 Kunden'' (NL), ''etwa 230.000 Euro''; Germany scale unclear; Flink: customers and employees', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: 31198ccea9, passage: '''Pim Takkenberg said the attempt ... as if it were a crowdfunding campaign is exceptional. Hacker group Shinyhunters did extort Dutch higher education institutions that were the clients of a hacked so', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: ffd7bc4291, passage: "'\xFCber eine Abuse-Mitteilung beim ... Mailprovider die Flut der Schreiben ... einged\xE4mmt'; 'nur rund 150 Mitteilungen von Kunden'; Germany count hard to estimate", source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: '9107100556', passage: Editorial takeaway framing; no factual claim beyond cited body, source_url: null, verdict: ok}
  - {claim_id: 66d56675e0, passage: 'Derived lesson: heise ''Kriminelle wandten sich nun direkt an die Kunden'', spoofed Flink-like sender; Flink: do not respond, report to police', source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: e3ccc2e1ae, passage: Derived from heise 'eine Art kriminelles Crowdfunding' and NL Times Takkenberg 'as if it were a crowdfunding campaign', source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: 41ab64aee9, passage: '''Flink hat am Freitag Kunden per einer der Redaktion vorliegenden E-Mail ... informiert ... unbefugte Person mithilfe kompromittierter Zugangsdaten''; page dated 2026-09-25', source_url: 'https://retail-news.de/flink-datenschutzvorfall-kundendaten-phishing/', verdict: ok}
  - {claim_id: a55fdec48f, passage: '''gingen dort bei mindestens 10.000 Kunden Erpressermails ein''; RETAIL-NEWS gives no detail on which credentials or MFA', source_url: 'https://www.heise.de/news/Kunden-und-Mitarbeiter-von-Lieferdienst-Flink-werden-erpresst-11467086.html', verdict: ok}
  - {claim_id: b4ec912a1a, passage: 'Flink: ''criminals are currently attempting to exploit this incident by contacting customers and employees directly and requesting payments''', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: ok}
  - {claim_id: 30f64b4568, passage: 'NL Times carries its own reading (''delete all user data if the company itself pays''); the heise half (''sum customers are to raise'') is not on the cited page, heise not linked at this clause (low confi', source_url: 'https://nltimes.nl/2026/09/25/individuals-sent-ransom-notes-cybercriminals-steal-flink-customer-worker-data', verdict: F3}
  - {claim_id: e7dc519350, passage: 'Record summary matches section: RETAIL-NEWS compromised credentials, 10,000 figure now customers, two readings of 100 ETH', source_url: 'https://retail-news.de/flink-datenschutzvorfall-kundendaten-phishing/', verdict: ok}
  - {claim_id: 3613aefa62, passage: Summary consistent with CTX697096 and CTX697174 (CVE-2026-88779 fixed in 14.1-73.41/13.1-64.28); Mandiant/Unit 42 items verified in earlier sections, source_url: 'https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
  - {claim_id: 1f570a7718, passage: '''NetScaler ADC and NetScaler Gateway 14.1-73.41 and later releases ... 13.1-64.28 and later''; CB: ''upgrade your deployment again'' for SAML SP/IdP; CTX697096 fixed builds .37/.23', source_url: 'https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
  - {claim_id: f078b476fb, passage: 'Fixed builds 14.1-73.37/13.1-64.23/13.1-37.279 (CTX697096) and the later .41/.28/.282 for SAML-configured; watchTowr: ''show ns variable'' caveat, 13.1-64.24', source_url: 'https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
  - {claim_id: 49aa0d8eff, passage: 'GTIG: ''Halt HA synchronization ... Disable configuration synchronization until both nodes have been validated''; Unit 42 artifacts in entry body', source_url: 'https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances', verdict: ok}
  - {claim_id: 5e4c8a48ee, passage: 'Tenable FAQ: 12.1 and 13.0 end of life, no security updates, Citrix has not said whether affected (cited in the 2026-09-30 section)', source_url: 'https://www.tenable.com/blog/frequently-asked-questions-about-reported-citrix-netscaler-zero-day-vulnerabilities', verdict: ok}
  - {claim_id: 48ab05cd03, passage: '''exploited as zero-days, before any fix existed. Citrix confirmed both and released fixed builds on September 27, 2026 in security bulletin CTX697096''; bulletin lists eight CVEs', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
  - {claim_id: 69be7f2e4c, passage: '''Exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated NetScaler deployments have been observed.''', source_url: 'https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html', verdict: ok}
  - {claim_id: 30bb01b9e8, passage: 'CVE-2026-88771/88772 dateAdded 2026-09-27; requiredAction cites BOD 26-04 and ''Forensics Triage Requirements''; forensicTriage: Yes', source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: ok}
  - {claim_id: ff0f929be7, passage: '''Citrix has confirmed active exploitation of these 2 critical vulnerabilities in the wild''; ''CERT-EU strongly advise to run a compromise assessment on any internet-facing appliance''; 27/09/2026', source_url: 'https://cert.europa.eu/publications/security-advisories/2026-014/', verdict: ok}
  - {claim_id: cb05e92189, passage: admins 'advising them to shut down their NetScaler appliances'; 'NCSC-NL reportedly sent a pre-notification'; 'declined to confirm the notification'; no CVE IDs or Citrix advisory yet, source_url: 'https://www.bleepingcomputer.com/news/security/citrix-admins-warned-to-shut-down-netscalers-over-2-exploited-zero-days/', verdict: ok}
  - {claim_id: f78239f07d, passage: 'NCSC-2026-0394 revision 1.0.0 ''Initiele versie'' 27-09-2026 16:55', source_url: 'https://advisories.ncsc.nl/advisory?id=NCSC-2026-0394', verdict: ok}
  - {claim_id: 375d1894db, passage: '''No attribution has been made public. Historically, NetScaler vulnerabilities have been exploited by both state-sponsored groups and ransomware operators.''; table lists CVE-2023-4966, CVE-2025-5777', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
  - {claim_id: 8f9351d61d, passage: '''Appliances patched for CVE-2026-19490 remain vulnerable to CVE-2026-88771 and CVE-2026-88772 unless they run one of the fixed builds above.''', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
  - {claim_id: 648420dd0b, passage: '''Citrix has not published a workaround for either vulnerability, so upgrading is the only fix.''', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
  - {claim_id: bd5077c6f6, passage: '''Capture logs, a snapshot, a support bundle and a core dump from each exposed appliance''; Unit 42: ''A NetScaler VPX instance snapshot'', support bundle, packet engine core dump', source_url: 'https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/', verdict: ok}
  - {claim_id: dae7c16c7a, passage: 'KEV requiredAction: ''ensuring compliance with ... Forensics Triage Requirements''; notes ''Customers must conduct forensic triage as directed by BOD 26-04''', source_url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json', verdict: ok}
