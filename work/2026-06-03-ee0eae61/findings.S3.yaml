  - title: "ANNUAL REPORT — Sophos 2026 Active Adversary Report: identity attacks dominate (67% of root causes), AD compromise median 3.4 h from initial access, Impacket use surges 83%, Akira leads ransomware"
    sources:
      - url: "https://www.sophos.com/en-us/blog/2026-sophos-active-adversary-report"
        publisher: "Sophos X-Ops"
        date: "2026-06-02"
