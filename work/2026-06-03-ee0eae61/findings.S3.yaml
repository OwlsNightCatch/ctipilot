  - title: "Dashlane 2FA TOTP brute-force: automated TOTP code exhaustion lets attacker register new device and download encrypted vaults of <20 personal-plan users (2026-05-31)"
    sources:
      - url: "https://thenextweb.com/news/dashlane-brute-force-attack-2fa-bypass-encrypted-vaults"
        publisher: "The Next Web"
        date: "2026-06-02"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/dashlane-discloses-brute-force-attack.html"
        publisher: "The Hacker News"
        date: "2026-06-02"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed (item 'Dashlane Discloses Brute-Force Attack, Encrypted Vaults of Fewer Than 20 Users Downloaded', published 2026-06-02T09:25:25+0530) → WebSearch ('Dashlane brute force 2FA attack encrypted vaults 2026') → primary: The Next Web https://thenextweb.com/news/dashlane-brute-force-attack-2fa-bypass-encrypted-vaults (Dashlane advisory direct 403)"
    summary: |
      Dashlane disclosed on 2026-06-01 that on 2026-05-31 an unknown external party executed a TOTP brute-force attack against personal-plan accounts. The attack technique exploited the bounded TOTP keyspace (10^6 combinations per 30-second window) with automated high-volume submission to register new trusted devices — Dashlane's new-device registration process requires successful TOTP verification, and the attacker attempted to iterate through all valid codes before expiry using tooling submitting "thousands of attempts per second." Rate-limiting triggered account lockouts for the targeted accounts (accounts have since been restored); the attacker succeeded in registering new devices on fewer than 20 accounts and downloading the encrypted vaults. Encrypted vault content (stored passwords, secure notes) remains protected by the user's master password, which Dashlane does not store; users with weak master passwords face offline cracking risk. Dashlane confirmed no infrastructure compromise. For defenders: this attack class succeeds where TOTP rate-limiting is insufficient and the keyspace is constrained — switch to phishing-resistant WebAuthn passkeys or hardware FIDO2 keys for credential manager authentication; implement rate-limiting and back-off on OTP submission endpoints; alert on rapid sequential login attempts with different TOTP values from the same source.
    ch_eu_nexus: "global; Dashlane is widely used in CH/EU enterprise environments; attack reveals TOTP rate-limiting weakness applicable to any TOTP-protected service"
    public_sector_nexus: "indirect — credential manager security posture relevant to all organisations"
    sector: "cross-sector, identity, credential management"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Attackers used automated software to rapidly submit every possible numeric combination for time-based one-time password (TOTP) codes. Since standard 2FA codes are six digits (one million possible combinations per 30-second window), 'automated systems can submit thousands of attempts per second,' making it feasible to guess valid codes before expiration if rate limiting is insufficient."
        attribution: "The Next Web"
        source_url: "https://thenextweb.com/news/dashlane-brute-force-attack-2fa-bypass-encrypted-vaults"

