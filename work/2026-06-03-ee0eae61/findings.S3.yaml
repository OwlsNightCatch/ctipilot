    discovery_trace: "first seen at: THN RSS feed (item 'Google June 2026 Android Update Patches 124 Flaws, One Actively Exploited', 2026-06-03T00:16:00+0530) → WebSearch ('Android CVE-2025-48595 exploited June 2026 framework privilege escalation') → primary: BleepingComputer https://www.bleepingcomputer.com/news/security/google-fixes-one-actively-exploited-android-zero-day-124-flaws/"
    summary: |
      Google's June 2026 Android Security Bulletin (released 2026-06-02) patches 124 vulnerabilities including CVE-2025-48595 (CVSS 8.4, High), an integer overflow in the Android Framework component enabling local privilege escalation without any required user interaction. Google confirmed the flaw is under "limited, targeted exploitation," consistent with the pattern of commercial spyware vendors or nation-state actors weaponising Framework LPEs against high-value targets before wide disclosure. The attack vector is local (T1626/T1404 — abuse of OS privilege escalation), most plausibly via a malicious app the victim installs. Affected versions span Android 14, 15, 16, and 16-QPR2; patch level 2026-06-05 covers all components. The bulletin additionally fixes 18 critical vulnerabilities across System, Framework, and Qualcomm components (124 total). Google Pixel devices receive the update immediately; OEM-distributed Android typically lags by weeks to months. Detection note: this class of exploit typically manifests as a privileged process forking from an unexpected low-privileged app — EDR/MDM logs showing unexpected `system_server` child processes or unusual app–system call paths are hunt targets. Enterprises managing Android device fleets: apply 2026-06-05 patch level via EMM/MDM, enable Verified Boot and attestation-based remote policies to identify non-compliant devices.
    ch_eu_nexus: "global; Android devices widely deployed in CH/EU public-sector and enterprise environments; targeted exploitation may extend to EU government users"
    public_sector_nexus: "indirect — targeted LPE exploits historically used in spyware campaigns against journalists, officials, activists"
    sector: "cross-sector, mobile"
