  - title: "UPDATE: Sekoia Gamaredon series Part 2+3 (GammaLoad/GammaSteel) — WinRAR CVE-2025-8088 path traversal to Startup folder confirmed; GammaSteel exfiltrates to AWS S3 (prior: GammaPhish/GammaWorm covered 2026-06-02)"
