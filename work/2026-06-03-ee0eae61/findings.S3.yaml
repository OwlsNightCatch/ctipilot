  - title: "codexui-android npm package steals non-expiring OpenAI Codex refresh tokens via Sentry-mimicking HTTPS POST; 27,000+ weekly downloads, two Android apps, exfiltration via anyclaw.store"
    sources:
      - url: "https://www.aikido.dev/blog/codex-remote-ui-steals-ai-tokens"
        publisher: "Aikido Security"
        date: "2026-05-27"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/openai-codex-authentication-tokens.html"
        publisher: "The Hacker News"
        date: "2026-06-01"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed (item 'OpenAI Codex Authentication Tokens Stolen in codexui-android npm Supply Chain Attack', published 2026-06-01T15:01:15+0530) → WebSearch ('codexui-android npm OpenAI Codex authentication token theft supply chain 2026') → primary: Aikido Security blog https://www.aikido.dev/blog/codex-remote-ui-steals-ai-tokens"
    summary: |
      Aikido Security disclosed on 2026-05-27 that the `codexui-android` npm package (GitHub: friuns2/BrutalStrike, npm account "friuns") contained malicious code introduced in versions ≥ 0.1.82 that stole OpenAI Codex `auth.json` credentials on every startup. The malicious code in `dist-cli/index.js` executed before any application code and exfiltrated the complete auth.json — access token, refresh token, ID token, and account ID — via HTTPS POST to `sentry.anyclaw.store/startlog`, mimicking Sentry error-reporting telemetry. The XOR key `anyclaw2026` was applied before base64 encoding. The C2 domain `anyclaw.store` was registered 2026-04-12, two days after npm package version 0.1.72 first appeared. The critical impact is the non-expiring refresh_token: per OpenAI's documentation, this allows the attacker to generate fresh access tokens indefinitely, enabling persistent impersonation of all compromised developer identities. The exfiltration code existed only in published npm artifacts, not in the GitHub repository, making source-code audits ineffective. Two Android applications ("OpenClaw Codex Claude AI Agent", 10K+ installs; "Codex" paid app) embedded Node.js via PRoot sandbox and pulled the malicious package at initialisation. Total exposure: 27,000+ weekly npm downloads plus 60,000+ combined mobile installations. Defender action: audit npm dependency manifests for `codexui-android`; rotate any OpenAI API keys and refresh tokens in developer workstation credential stores; monitor for outbound HTTPS from Node.js processes to unfamiliar Sentry-style telemetry endpoints (`sentry.<unknown-domain>`).
    ch_eu_nexus: "global; developer tool targeting affects any CH/EU organisation using OpenAI Codex in development pipelines"
    public_sector_nexus: "indirect — developer tool; relevant to any public-sector organisation with AI-assisted coding workflows"
    sector: "technology, developer tooling, AI services"
    cves: []
    actors_campaigns_malware: ["friuns2 / anyclaw.store operator (unattributed)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Tokens were sent via HTTPS POST requests to sentry.anyclaw.store/startlog. The endpoint name mimicked legitimate Sentry telemetry to avoid detection. The payload used XOR encryption with the key 'anyclaw2026' before base64 encoding."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/codex-remote-ui-steals-ai-tokens"
      - quote: "The malicious code existed only in published npm artifacts—not in the GitHub repository—making source code audits ineffective."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/codex-remote-ui-steals-ai-tokens"

  - title: "Android CVE-2025-48595 actively exploited in targeted attacks — Framework integer overflow enables no-interaction local privilege escalation across Android 14/15/16 (June 2026 patch bulletin)"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/google-fixes-one-actively-exploited-android-zero-day-124-flaws/"
        publisher: "BleepingComputer"
        date: "2026-06-02"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/02/android-vulnerability-exploited-cve-2025-48595/"
