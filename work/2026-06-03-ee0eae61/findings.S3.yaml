  - title: "Mandiant: CVE-2026-5426 — KnowledgeDeliver LMS shared ASP.NET machine key enables unauthenticated RCE; BLUEBEAM web shell, Cobalt Strike BEACON, JavaScript-poisoned user endpoints (Japan, late 2025)"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/knowledgedeliver-viewstate-deserialization-vulnerability/"
        publisher: "Mandiant / Google Cloud"
        date: "2026-05-25"
        role: "primary"
      - url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0009.md"
        publisher: "Mandiant (GitHub)"
        date: "2026-05-25"
        role: "corroborating"
    discovery_trace: "first seen at: Mandiant GTIG feed (https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v, item title 'Exploitation of KnowledgeDeliver via ViewState Deserialization Vulnerability', published 2026-05-25) → primary: Mandiant blog https://cloud.google.com/blog/topics/threat-intelligence/knowledgedeliver-viewstate-deserialization-vulnerability/ → corroborating advisory: https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0009.md"
    summary: |
      Mandiant (GTIG) published disclosure of CVE-2026-5426 on 2026-05-25, a critical unauthenticated RCE in KnowledgeDeliver, a Learning Management System by Digital Knowledge widely deployed in Japan. Root cause: identical hardcoded ASP.NET `machineKey` values in a standardised `web.config` distributed to all customer deployments, allowing an unauthenticated attacker to forge a trusted ViewState payload. Exploitation involved crafting a malicious `__VIEWSTATE` HTTP parameter delivered to the application, which the IIS `w3wp.exe` worker process deserialised and executed. Post-exploitation observed: BLUEBEAM — a .NET in-memory web shell (Godzilla variant) — executed within `w3wp.exe`; `icacls` commands granting `Everyone:F` to web directories; JavaScript injected into application files to display fake "security authentication plugin" prompts to users, which delivered Cobalt Strike BEACON binaries. The attack's supply-chain dimension is notable: LMS modification could expose visiting users to client-side exploitation at scale across an entire university or corporate training estate. Vendor patch released 2026-02-24; disclosure coordinated. For defenders: monitor IIS `w3wp.exe` spawning `cmd.exe`, `powershell.exe`, or `net.exe` (`Sysmon EID 1`, parent `w3wp.exe`); alert on `icacls` invocation by IIS worker; scan `web.config` for known-shared machine keys (MSRC published a list in 2025-02); audit LMS/web application server network isolation.
    ch_eu_nexus: "global; pattern of shared machine key distribution applies to any ASP.NET deployment shipping pre-configured web.config; EU universities using KnowledgeDeliver at risk"
    public_sector_nexus: "direct — LMS primarily deployed in university and corporate training contexts, both public and private"
    sector: "education, corporate learning"
