    discovery_trace: "first seen at: WebSearch ('Sophos X-Ops threat research June 2026 new malware') → primary: Sophos blog https://www.sophos.com/en-us/blog/2026-sophos-active-adversary-report"
    summary: |
      Sophos published its 2026 Active Adversary Report (covering 661 IR/MDR cases, November 2024–October 2025) on or around 2026-06-02, identifying identity-based compromise as the dominant root cause (67.32% of cases: compromised credentials 42%, brute-force 16%, phishing 6%). Median overall dwell time remained three days (MDR: two days; IR: five), but the median time from initial access to Active Directory compromise compressed to 3.40 hours — a 70% acceleration year-on-year — with Impacket usage surging 83% (found in 36% of all tooling artefacts). Business Email Compromise (primarily M365) rose fourfold; phishing nearly tripled. MFA was absent or misconfigured in 59% of incidents. Akira (Gold Sahara) led ransomware with 23% of deployments; 51 unique groups identified; 88% of ransomware deployments occurred outside business hours; 50% of cases confirmed data exfiltration at median 78.8 h from initial access. AnyDesk was the most abused remote access tool. CVE-2024-40766 (SonicOS) accounted for 67% of confirmed vulnerability exploits. Manufacturing (20%) and financial services (9%) led by sector. For defenders: missing firewall logs in 49% of ransomware cases, and 13% of attacked Windows Servers ran end-of-life versions — telemetry and EOL inventory gaps remain the primary blind spots. Hunt targets: Impacket artefacts (impacket-* tool names in process trees, secretsdump activity on NTDS, SMBExec/WMIExec parent processes), AD compression timing relative to initial-access events.
