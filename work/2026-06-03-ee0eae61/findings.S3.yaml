    summary: |
      Seqrite Labs published Operation Dragon Weave on 2026-06-01, documenting a China-attributed espionage campaign active since at least March 2026 (earliest VirusTotal submission from Taiwan 2026-03-26) targeting Czech Republic and Taiwanese government, research, academic, technology, and financial services entities. The four-stage infection chain offers two initial delivery paths: Path A deploys a malicious LNK disguised as a PDF that executes VBScript to XOR-decrypt (key "P@ssw0rd_am_2026") and launch a Rust loader; Path B uses a self-contained Rust executable. The Stage 3 RUSTCLOAK Rust loader applies triple-layer decryption (RC4 → Base64 → SM4-CBC), performs sandbox evasion against 100+ analyst hostnames, and executes shellcode via Windows Fibers before delivering the Stage 4 payload. AZUREVEIL, the final payload, is a 64-bit DLL implementing a fully-featured Adaptix C2 agent with 36 post-exploitation commands (file ops, process control, network pivoting, BOF in-memory execution). The C2 dead-drop architecture uses Azure Blob container `note1ggbbhggdwa1[.]blob[.]core[.]windows[.]net/note/ats/` — attacker and implant exchange encrypted commands through the same Azure storage container, blending with legitimate enterprise cloud traffic on HTTPS/443. Defender notes: MITRE T1566.001, T1204.002, T1027, T1497.001 (sandbox check against hostname lists), T1102.001 (Azure Blob dead-drop), T1573. Hunt pivot: `wscript.exe` child of Office applications launching PowerShell; outbound HTTPS from `w3wp.exe` or unexpected process to `*.blob.core.windows.net` with unusual container paths; Rust-compiled PE written to temp directories. Network block/alert on Azure Blob Storage from non-expected process parents.
