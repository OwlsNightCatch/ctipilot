    summary: |
      Sophos X-Ops discovered a structured attacker-built EDR evasion testing environment during incident response at a customer site, linking the infrastructure to an active unnamed ransomware group. The framework's Python-based payload generator (many scripts partially AI-generated, written in Russian) supports nearly 80 modules covering more than 70 evasion techniques. At the top of the agentic hierarchy, a Claude Opus 4.5 instance acted as coordinator across role-separated agents (EDR testing, OPSEC hardening, documentation, proxy stress testing, VM deployment) with connectivity via Model Context Protocol (MCP) to a Git repository. The C2 stack comprised a Sliver server on Ubuntu, Cobalt Strike profiles blending beacon traffic as legitimate web requests, a Telegram bot API command channel, and a Cloudflare Worker used to conceal backend infrastructure. Testing ran against three isolated Windows Server 2022 VMs — one Sophos-equipped, one CrowdStrike-equipped, one without EDR as baseline — supplemented by payloads sourced from bypass techniques extracted from public research (Kaspersky, Palo Alto, Bishop Fox). The development environment used Ludus for rapid VM provisioning and Cursor (AI-native IDE) for code editing. Sophos declined to identify the ransomware group citing active investigation; the defensive principle stated remains unchanged: patch, enforce MFA/passkeys, deploy endpoint protection with behavioural alerting. Detection telemetry of note: alerts fired on "malicious payloads originating from a testing directory" on an anomalous customer endpoint — behavioural product telemetry on process/file artefact origin paths is the suggested hunt pivot.
    ch_eu_nexus: "methodology applicable globally; EDR products tested include Sophos and CrowdStrike, both widely deployed in CH/EU public-sector environments"
