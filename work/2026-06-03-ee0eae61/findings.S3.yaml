  - title: "Operation XENOFISCAL: SideCopy (Transparent Tribe/APT36) deploys XenoRAT 1.8.7 via mshta.exe/HTA chain against all 34 Afghan Mustoufiats — bulletproof EU C2, Registry typosquat persistence"
    sources:
      - url: "https://www.seqrite.com/blog/operation-xenofiscal-sidecopy-deploying-persistent-xenorat-targeting-the-mof-afghanistan/"
