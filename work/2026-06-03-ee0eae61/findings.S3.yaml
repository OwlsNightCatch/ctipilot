    discovery_trace: "first seen at: THN RSS feed (feed URL https://feeds.feedburner.com/TheHackersNews item published 2026-06-02T14:35:40+0530) → pivot: WebSearch ('SideCopy Xeno RAT Afghanistan Ministry Finance spear phishing 2026') → primary: Seqrite Labs https://www.seqrite.com/blog/operation-xenofiscal-sidecopy-deploying-persistent-xenorat-targeting-the-mof-afghanistan/ → corroborating: THN https://thehackernews.com/2026/06/pakistan-linked-sidecopy-targets.html"
    summary: |
      Seqrite Labs disclosed Operation XENOFISCAL, a SideCopy (Transparent Tribe/APT36, Pakistan-attributed) campaign targeting provincial finance officials across all 34 Afghan Mustoufiats — the regional treasury directorates forming Afghanistan's fiscal backbone. The spear-phish delivered a ZIP containing a Pashto-language LNK file whose filename and decoy document mimicked a seminar invitation, demonstrating precise insider knowledge. Execution followed the signature SideCopy LNK→mshta.exe→HTA→obfuscated JavaScript chain, pulling an HTA from a compromised Afghan education domain. The JavaScript staged multiple .NET DLL loaders in-memory before dropping XenoRAT v1.8.7, a publicly available C# RAT with full keylogging, screenshot capture, remote-shell, and process injection capability. Persistence used two mechanisms: a Registry Run key under the misspelling "Edgre" (typosquatting Microsoft Edge) and a Windows Scheduled Task. C2 beaconed to 185.235.137.106, attributed to AS59711 (HZ Hosting Ltd), a bulletproof provider previously linked to SideCopy infrastructure. MITRE ATT&CK mapping: T1566.001 (spearphishing attachment), T1218.005 (mshta.exe proxy execution), T1059.003/007 (cmd/JavaScript), T1547.001 (Registry Run key persistence), T1053.005 (Scheduled Task), T1027/T1027.011 (obfuscation/encrypted payloads), T1620 (reflective code loading), T1071.001/T1573 (HTTP/encrypted channel). Detection pivot: `mshta.exe` spawning `wscript.exe` or outbound HTTP from mshta.exe parent; Registry Run key values containing typosquatted Microsoft product names; Scheduled Task creation by Office/browser processes.
    ch_eu_nexus: "Pakistan-Afghanistan government targeting; indirect relevance to EU governments monitoring South Asian espionage; C2 hosted on EU bulletproof infrastructure (AS59711)"
    public_sector_nexus: "direct — government finance ministry targeting pattern applies to any public-sector treasury"
    sector: "government, finance"
