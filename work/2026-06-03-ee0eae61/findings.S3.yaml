    discovery_trace: "first seen at: SANS ISC RSS feed (https://isc.sans.edu/rssfeed.xml, item 'New Wave Of Phishing Emails with SVG Files', published 2026-06-02T07:29:25Z) → primary: https://isc.sans.edu/diary/33040"
    summary: |
      SANS ISC handler Xavier Mertens published on 2026-06-02 documenting a fresh wave of phishing emails delivering SVG file attachments. The SVGs contain embedded JavaScript with multi-layer obfuscation: Base64 encoding combined with XOR encryption, decoded payload using `window.location.href` to redirect to phishing pages. The notable evasion innovation is the use of `<script type="application/ecmascript">` rather than the standard `text/javascript` MIME type attribute — browsers execute both identically, but many email security products and WAFs perform pattern-matching specifically on `text/javascript` and may miss the non-standard type. SVG files open natively in Windows browsers without prompting, so the redirection fires on file open with no additional click required. Mertens linked the phishing domain `chinougoo[.]cfd` (the ".cfd" TLD, low-cost registration increasingly abused by phishing). Prior SVG phishing waves were documented at SANS ISC in diary 31456; this wave shows updated encoding and MIME-type evasion. Detection: alert on email attachments with `Content-Type: image/svg+xml` containing embedded `<script>` tags; proxy/NGFW alert on `.cfd` TLD (Cloudflare Radar shows high abuse rate); sandbox any SVG attachment before delivery.
