        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed (item 'Gamaredon Exploits WinRAR to Deliver GammaWorm and GammaSteel Against Ukraine', published 2026-06-02T23:51:49+0530) → WebSearch ('Sekoia FSB matryoshka 2/3 GammaLoad 3/3 GammaSteel June 2026 blog') → primary: Sekoia blog https://blog.sekoia.io/fsbs-matryoshka-1-3-gamaredons-gifts-that-keeps-unpacking-gammaphish-and-gammaworm/ (Part 1 anchor, series published 2026-06-01) → corroborating: The Record"
    summary: |
      Sekoia's three-part Gamaredon series (published 2026-06-01, written by Amaury G. and Sekoia TDR) added material new technical detail beyond the brief's prior 2026-06-02 coverage of Part 1. The series confirms weaponisation of CVE-2025-8088 (WinRAR path traversal, CVSS Critical, affects WinRAR < 7.13, patched 2025-08) specifically to write payloads to `%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\` — achieving persistence without registry or Scheduled Task artefacts — and confirms DLL search-order hijacking as an alternative persistence path. GammaLoad (unified name for all intermediary downloaders, subsuming PowerPunch and earlier variants) is a VBScript-based staged loader that pulls and executes the next-stage payload from attacker-controlled infrastructure. GammaSteel (the stealer, subsuming QuietSieve, USBStealer, HarvesterX, and Pteranodon stealer modules) captures files by extension and exfiltrates to AWS S3 buckets or actor-controlled servers, adding cloud-storage exfiltration to Gamaredon's previously documented HTTP-only exfiltration channels. The three-part format documents a complete kill chain from WinRAR lure through stealthy persistent access to document exfiltration. Detection additions: monitor for archives writing executables or VBS to `Startup` folder paths (Sysmon EID 11, target path containing `Programs\Startup`); alert on WinRAR spawning `wscript.exe` or writing to startup locations; network-layer: VBScript processes making DNS or HTTPS queries to AWS S3 endpoints not consistent with normal business traffic.
