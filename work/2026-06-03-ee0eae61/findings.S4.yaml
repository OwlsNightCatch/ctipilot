items:
  - title: "Dashlane discloses brute-force bypass of TOTP 2FA; encrypted vaults of fewer than 20 personal-plan users downloaded (May 31, 2026)"
    sources:
      - { url: "https://techcrunch.com/2026/06/02/password-manager-dashlane-says-hackers-stole-some-customers-password-vaults/", publisher: "TechCrunch (Zack Whittaker)", date: "2026-06-02", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/dashlane-discloses-brute-force-attack.html", publisher: "The Hacker News", date: "2026-06-02", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/", publisher: "BleepingComputer", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: feeds.feedburner.com/TheHackersNews (THN RSS, 2026-06-02), URL https://thehackernews.com/2026/06/dashlane-discloses-brute-force-attack.html → pivot: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/ (metadata confirmed 2026-06-01) → primary: TechCrunch by Zack Whittaker, URL https://techcrunch.com/2026/06/02/password-manager-dashlane-says-hackers-stole-some-customers-password-vaults/ (2026-06-02). Dashlane advisory support.dashlane.com returned HTTP 403; Wayback had no usable snapshot."
    summary: |
      On May 31, 2026, an unknown external threat actor launched a brute-force attack against Dashlane user accounts
      on the personal subscription plan. The attack technique targeted TOTP (time-based one-time password) 2FA: the
      attacker ran automated enumeration of every possible six-digit numeric TOTP code within the 30-second validity
      window. When a code was guessed correctly, the attacker registered a new trusted device, which then permitted
      download of the target account's encrypted vault from Dashlane's servers. Dashlane confirmed that fewer than 20
      personal-plan user vaults were downloaded. Vault content is encrypted end-to-end with the user's Master Password;
      Dashlane states the Master Password is never stored on its servers and the vault contents were not directly
      accessible by the attacker. Accounts targeted by the attack were automatically locked by Dashlane's rate-limiting
      controls. Dashlane states its own infrastructure was not compromised; the attack surface was the TOTP validation
      endpoint. Defenders note: this attack class (TOTP brute-force to bypass 2FA and register a new device) is the
      same pattern used in the 2022 LastPass breach that enabled vault download — the attack does not require knowledge
      of the Master Password but relies on the fact that new-device registration is gated only on TOTP, not a second
      factor bound to the existing device. Mitigations include hardware-token 2FA (FIDO2/WebAuthn) which is not
      susceptible to TOTP enumeration, passkey support (Dashlane began rolling out passkeys in 2024), and rate-limiting
      TOTP attempts per IP per account per time window.
    ch_eu_nexus: "global; Dashlane has significant EU user base including CH/DE/AT enterprise and personal plan users; EU GDPR notification obligations apply"
    public_sector_nexus: "indirect — public-sector employees and government contractors who use Dashlane personal plans are in scope"
    sector: "identity, credential-management, technology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Brute-force attacks bypassed 2FA on some Dashlane accounts on May 31, 2026, enabling fewer than 20 encrypted vault downloads."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/dashlane-discloses-brute-force-attack.html"
      - quote: "The password manager giant said hackers were able to 'brute-force' its two-factor system, allowing them to access customer accounts and download their password vaults."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/06/02/password-manager-dashlane-says-hackers-stole-some-customers-password-vaults/"
      - quote: "Multiple Dashlane users have been locked out of their accounts following brute-force attacks that attempted logins from distant locations and unknown devices."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/"
    extended_notes: |
      The comparable LastPass 2022 incident (brute-force of secondary auth → new device registration → encrypted vault
      download) followed the same kill chain. The attacker does not need to decrypt vaults at download time — offline
      cracking of the Master Password can follow. This makes vault-download incidents high-severity even when the vault
      itself is cryptographically strong. Affected orgs should: (a) audit which accounts are on Dashlane personal plans
      (vs. business plans with stronger controls), (b) consider mandatory passkey migration, (c) treat any Dashlane
      personal-plan user whose account was locked on May 31 as potentially compromised until verified.

  - title: "Operation Dragon Weave — China-aligned cluster deploys RUSTCLOAK loader + AZUREVEIL (AdaptixC2) via Azure Blob Storage dead-drop C2, targeting Czech Republic government and research"
    sources:
      - { url: "https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/", publisher: "Seqrite Labs", date: "2026-05-29", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html", publisher: "The Hacker News", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: feeds.feedburner.com/TheHackersNews (THN RSS, 2026-06-01T17:24), URL https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html → primary: Seqrite Labs research, URL https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/ (2026-05-29); also corroborated by WebSearch results listing multiple coverage outlets"
    summary: |
      Seqrite Labs documented Operation Dragon Weave, a targeted cyber-espionage campaign assessed with moderate
      confidence as China-aligned, targeting government officials, researchers, academics, technology organisations,
      and financial-services institutions in the Czech Republic and Taiwan. The infection chain has two delivery paths:
      Path A uses LNK-based execution (spear-phishing ZIP containing a malicious LNK file with a Pashto or Czech-
      language decoy filename); Path B uses an executable-based delivery. Both chains drop a script-based intermediate
      stage (Stage 2) that fetches and executes RUSTCLOAK, a Rust-based loader. RUSTCLOAK performs VM-detection checks
      before decrypting AZUREVEIL — the campaign's primary C2 agent, which is a renamed and repacked AdaptixC2
      (open-source C2 framework). The defining evasion technique is a dead-drop C2 channel: rather than communicating
      directly with attacker-controlled infrastructure, both the implant and the operator exchange commands by reading
      and writing to the same Microsoft Azure Blob Storage container. This prevents direct C2 network connections from
      appearing in threat feeds and makes traditional C2 beacon detection ineffective. Detection vectors include:
      suspicious LNK execution with double-extension filenames (T1204.002), Rust-compiled binaries calling Azure Blob
      Storage APIs (storage.azure.com) from unexpected process trees (T1102.001 Web Service as C2), anomalous
      CreateFile/WriteFile to temp paths followed by child process creation (RUSTCLOAK decryption pattern),
      AdaptixC2-specific memory signatures and YARA rules available from the open-source project. The Czech Republic
      is an EU member and NATO member, making this campaign directly relevant to EU and Swiss intelligence-sharing
      networks (CERT-EU, NATO CCDCOE). Attribution to China is assessed as moderate confidence by Seqrite based on
      TTPs, tooling, and targeting patterns.
    ch_eu_nexus: "direct — Czech Republic is EU member; targeting of Czech government and research institutions; EU public administrations are the named sector; Swiss academic and research orgs face analogous targeting risk from the same cluster"
    public_sector_nexus: "direct — government officials and research institutions named as primary targets"
    sector: "government, research, academia, technology, financial-services"
    cves: []
    actors_campaigns_malware: ["AZUREVEIL", "RUSTCLOAK", "AdaptixC2"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Operation Dragon Weave delivers AdaptixC2 via phishing; Azure-based AZUREVEIL enables covert control, impacting Czech and Taiwan targets."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html"
      - quote: "AZUREVEIL follows a dead drop approach, where the attacker and the infected system never communicate directly, instead both sides use the same Azure storage container to exchange data."
        attribution: "Seqrite Labs"
        source_url: "https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/"
    extended_notes: |
      The Azure dead-drop C2 technique mirrors patterns seen from several PRC-aligned clusters in 2025-2026 (e.g.,
      STORM-0558 use of Microsoft cloud for lateral movement; Volt Typhoon's LOTL approach). The use of open-source
      C2 (AdaptixC2) obscures attribution. EU SOCs hunting this pattern should build detection for AdaptixC2
      beacon implants communicating with storage.blob.core.windows.net from non-administrative endpoints, and
      correlate with spear-phishing indicators (LNK in ZIP, Rust binary drops).

  - title: "ENISA NIS360 2026: Rail, drinking water, and wastewater newly enter EU cybersecurity risk zone alongside health, space, and public administration"
    sources:
      - { url: "https://www.enisa.europa.eu/enisa-nis360-2026", publisher: "ENISA", date: "2026-05-28", role: "primary" }
      - { url: "https://securityaffairs.com/193002/reports/enisa-nis360-2026-progress-across-the-board-but-the-sectors-that-matter-most-are-still-falling-short.html", publisher: "Security Affairs", date: "2026-06-02", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs.com (Security Affairs RSS, 2026-06-02T08:19), URL https://securityaffairs.com/193002/reports/enisa-nis360-2026-progress-across-the-board-but-the-sectors-that-matter-most-are-still-falling-short.html → primary: ENISA NIS360 2026 report page, URL https://www.enisa.europa.eu/enisa-nis360-2026 (published 2026-05-28; primary report PDF at https://www.enisa.europa.eu/sites/default/files/2026-05/ENISA%20NIS360%202026.pdf)"
    summary: |
      ENISA published the third annual NIS360 report on May 28, 2026, assessing cybersecurity maturity and criticality
      of all NIS2 Annex I critical sectors across the EU. The headline finding for defenders: four sectors newly entered
      or remain in the risk zone — where sector criticality exceeds measured cybersecurity maturity — in 2026: health
      (persistent), space (persistent), public administrations (persistent), and newly joining this year: rail, drinking
      water, and wastewater. The risk-zone classification means these sectors handle critical societal functions but
      their security programs lag behind the threat level they face. Banking, electricity, and telecommunications remain
      in the highest maturity band. Three sectors graduated to high maturity for the first time: trust services,
      aviation, and financial market infrastructures (FMI, driven substantially by DORA implementation). The report
      identifies DORA as an evidence-based driver of measurable maturity improvement and signals to other sectors that
      mandatory frameworks with supervisory enforcement produce results. For Swiss and EU defenders: public
      administration, health, and water infrastructure remain the weakest links in EU critical-sector security. The
      NIS360 methodology assesses maturity on incident-reporting compliance, CSIRT capability, supervisory maturity,
      and sector-specific policy implementation.
    ch_eu_nexus: "direct — EU-wide regulatory assessment directly relevant to Swiss public-sector critical infrastructure operators subject to the Information Security Act (ISG) and comparable frameworks; public administrations sector is a named risk zone"
    public_sector_nexus: "direct — public administrations named as persistent risk zone; health, water, and rail also in risk zone"
    sector: "government, health, water, rail, energy, banking, telco, aviation, trust-services"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ENISA NIS360 2026 shows cybersecurity improving across EU critical sectors, but health, water, rail, and space remain in the risk zone."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/193002/reports/enisa-nis360-2026-progress-across-the-board-but-the-sectors-that-matter-most-are-still-falling-short.html"
    extended_notes: |
      The ENISA NIS360 risk-zone framework is directly actionable for defenders: organisations in health, water,
      rail, space, and public administration should treat the risk-zone classification as external validation that
      their sector is under-resourced relative to threat level, and use it to justify budget requests and CSIRT
      capacity investments. The DORA-driven FMI improvement is the positive counterexample: binding regulation
      with supervisory enforcement and structured frameworks (similar to how NIS2 is structured for other sectors)
      demonstrably works.

  - title: "Russia's FSB claims large-scale Western intelligence operation implanted spyware on Russian senior officials' mobile devices via zero-day — no independent technical corroboration"
    sources:
      - { url: "https://therecord.media/russia-claims-foreign-spy-agencies-hacked-gov-officials", publisher: "The Record (Recorded Future News)", date: "2026-06-02", role: "primary" }
      - { url: "https://meduza.io/en/news/2026/06/02/fsb-says-foreign-intelligence-agencies-planted-spyware-on-russian-officials-phones-and-monitored-their-conversations", publisher: "Meduza", date: "2026-06-02", role: "corroborating" }
    discovery_trace: "first seen at: therecord.media (The Record RSS, 2026-06-02T16:10), URL https://therecord.media/russia-claims-foreign-spy-agencies-hacked-gov-officials → primary: The Record article (2026-06-02). Corroboration: Meduza (independent Russian-language journalism), URL https://meduza.io/en/news/2026/06/02/fsb-says-foreign-intelligence-agencies-planted-spyware-on-russian-officials-phones-and-monitored-their-conversations (2026-06-02)"
    summary: |
      On June 2, 2026, Russia's Federal Security Service (FSB) issued a public statement claiming it had uncovered
      a "large-scale" foreign intelligence operation in which unspecified Western spy agencies implanted spyware on
      the mobile devices of senior Russian officials, diplomats, politicians, military officers, and journalists.
      The FSB stated the implants were delivered via a zero-day vulnerability (unspecified product) and enabled
      remote activation of microphones and cameras, data exfiltration, and conversation monitoring. The FSB also
      alleged that US technology companies including Fastly and Cloudflare provided infrastructure used in the
      operation. The Record and Meduza report the FSB provided no technical evidence (no CVE, no malware sample,
      no forensic artefact). This is a self-attributing claim from a party with strong incentive to publish such
      allegations; independent security researchers have not confirmed any technical detail. Contextually, the FSB
      has made similar claims previously (notably the 2023 Triangulation/iOS claim that was independently confirmed
      by Kaspersky and GReAT) — this claim has not yet reached that confirmation level. For defenders: if a Western
      intelligence zero-day against Android or iOS mobile devices exists and is later confirmed, it may indicate an
      unknown vulnerability in current mobile OS code; no defensive action is warranted against this specific claim
      until technical evidence surfaces.
    ch_eu_nexus: "indirect — if claim is later confirmed, any zero-day targeting Western official mobile devices could also affect Swiss and EU government devices; provides context for mobile device security posture discussions"
    public_sector_nexus: "indirect"
    sector: "government"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: LOW
    novelty: new
    evidence:
      - quote: "In a statement, Russia's Federal Security Service (FSB) said it had uncovered what it described as a 'large-scale operation' involving malicious software installed on the mobile devices of senior Russian officials."
        attribution: "The Record"
        source_url: "https://therecord.media/russia-claims-foreign-spy-agencies-hacked-gov-officials"
      - quote: "FSB says foreign intelligence agencies planted 'spyware' on Russian officials' phones and monitored their conversations"
        attribution: "Meduza"
        source_url: "https://meduza.io/en/news/2026/06/02/fsb-says-foreign-intelligence-agencies-planted-spyware-on-russian-officials-phones-and-monitored-their-conversations"
    extended_notes: |
      Attribution: claim is unverified. The FSB's track record on such claims includes both confirmed incidents
      (Triangulation 2023, later confirmed by Kaspersky GReAT to be a genuine iOS zero-click) and propaganda
      (2022-2026 multiple unverified claims about US cyber operations). Treat as intelligence awareness item
      rather than actionable threat. If technical details emerge (CVE, product, researcher confirmation), the
      confidence rating should be upgraded immediately.

