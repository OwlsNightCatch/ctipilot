        date: "2026-05-03"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 10), NCSC.ch homepage HTML scrape returned link to advisory at ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html → primary: NCSC.ch advisory page fetched via bridge:url"
    summary: |
      On 2026-06-01, Switzerland's National Cyber Security Centre published a pre-event advisory warning that the G7 summit in Évian (France, June 15–17) is a high-value target for hacktivist DDoS campaigns, state-sponsored intelligence collection, and infrastructure-targeted attacks. The NCSC explicitly anticipates "disruptive maneuvers in cyberspace" echoing the pattern of NoName057(16) DDoS waves during the 2024 Bürgenstock summit. The summit spans the French-Swiss border; most delegations transit Geneva Airport and lodge on the Swiss side (Geneva, Lausanne, Vaud, Valais region). ZENDATA's independently published threat map for the event identifies eight attack classes: NoName057(16)-style DDoS, APT28/GRU intelligence collection against hotel and telecom infrastructure, Salt Typhoon-attributed cellular interception via rogue IMSI catchers (base stations), Scattered Spider-style social engineering, commercial spyware zero-day chains (Coruna and DarkSword families documented targeting iOS/Android), ransomware targeting event logistics supply chains, and GenAI-assisted impersonation attacks. Swiss telecom operators Swisscom, Sunrise and Salt are named as candidate cellular interception targets. Specific hardening: organisations operating in the Geneva-Vaud corridor should review MFA on all customer-facing identity providers, rotate administrative credentials, pre-stage DDoS mitigation playbooks, and brief staff on physical security of mobile devices. Detection: unusual IMSI reattachment events in MDM logs, anomalous hotel WiFi gateway certificate changes, spike in authentication attempts from Geneva/Lausanne IPs around summit dates.
    ch_eu_nexus: "Direct Swiss nexus — summit is adjacent to Switzerland; NCSC Switzerland issued primary advisory; most delegations transit CH infrastructure"
