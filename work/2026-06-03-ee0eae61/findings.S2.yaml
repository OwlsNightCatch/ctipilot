  - title: "ICO fines South Staffordshire Water £963,900 for Cl0p ransomware breach — 20-month undetected persistence, unpatched ZeroLogon DCs, 633,887 data subjects affected"
    sources:
      - url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"
