    discovery_trace: "first seen at: bsi-rss bridge → WID-SEC-2026-1772 Google Android (kritisch, 2026-06-02) → WebSearch for CVE details → BleepingComputer and Help Net Security articles fetched → Google Android bulletin fetched at source.android.com"
    summary: |
      Google's June 2026 Android security bulletin (patch levels 2026-06-01 and 2026-06-05) patches 124 vulnerabilities, including CVE-2025-48595, a high-severity integer-overflow zero-day in the Android Framework component that Google confirms is "under limited, targeted exploitation." The flaw allows a local attacker (no user interaction required after app installation) to escalate privileges and gain complete device access across Android 14, 15, 16, and 16-qpr2. The bulletin also includes 11 critical vulnerabilities across the Framework and System components, including one critical Framework flaw enabling remote privilege escalation without user interaction. Chipset components from Qualcomm, MediaTek, Imagination Technologies, Unisoc, and Broadcom receive separate patch-set entries (2026-06-05 level). The BSI issued advisory WID-SEC-2026-1772 (kritisch / critical) on June 2. For EU public-sector Android device fleets (GFW-managed or COPE under MDM), the priority is deploying the June 2026-06-01 patch level immediately; MDM administrators can use Security Patch Level (SPL) compliance policy to gate network access. Detection: unexpected privilege-escalation events in Android MDM/EMM audit logs (Google Workspace Admin console, Microsoft Intune compliance events), unusual APK side-load events from managed app catalogues. The targeted-exploitation pattern and Framework location suggest spyware or surveillance operators as likely actors (historically consistent with commercial spyware vendors targeting state-adjacent personnel). [MITRE ATT&CK: T1404 Exploit OS Vulnerability (Mobile); T1631 Process Injection (Mobile)]
