    discovery_trace: "first seen at: cert-fr-avis feed → CERTFR-2026-AVI-0642 (Multiples vulnérabilités dans les produits Trend Micro, 22 mai 2026) → bridge:url fetched CERT-FR advisory page → pivot to BleepingComputer and Help Net Security articles, Trend Micro PSIRT KA-0023430"
    summary: |
      CVE-2026-34926 is a relative directory path traversal zero-day in Trend Micro Apex One (on-premises version), with server-side component patched in April 2026 and agent patches released with the security advisory on May 21, 2026 (vendor bulletin KA-0023430). Exploitation requires the attacker to have obtained administrative credentials to the Apex One Server through a prior compromise step — once achieved, the attacker modifies a key server configuration table to inject malicious code into the agent update payload, meaning the endpoint agent software itself becomes the delivery mechanism for malware across all managed endpoints. CISA added CVE-2026-34926 to the Known Exploited Vulnerabilities catalog (May 21, 2026) with a June 4, 2026 remediation deadline for US federal agencies. Affected: Apex One SP1 before cumulative patch build 17079 (new install) or 18012 (upgrade path); TrendAI Vision One SEP before version 14.0.20731. CERT-FR issued advisory CERTFR-2026-AVI-0642 on May 22. Co-reported CVEs (same advisory): CVE-2026-34927, CVE-2026-34928, CVE-2026-34929, CVE-2026-34930, CVE-2026-45206, CVE-2026-45207, CVE-2026-45208. For defenders: the agent-update-channel abuse pattern maps to T1195.001 (Compromise Software Supply Chain — Security Software Update); detection requires verifying the integrity of agent update packages via hash comparison against Trend Micro's published manifests, and reviewing administrative access logs on the Apex One Server console (TMCM / Apex Central) for unexpected configuration-table modifications. Hardening: enforce MFA on the Apex One Server admin console; restrict network access to the console to management VLANs; validate agent update authenticity via Trend Micro's TMCM policy controls.
    ch_eu_nexus: "Global; CERT-FR (ANSSI) issued advisory; Apex One is deployed across large EU government and enterprise SOC environments"
