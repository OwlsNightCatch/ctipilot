    discovery_trace: "first seen at: ico-uk enforcement bridge (ico-uk enforcement 5) → returned sa-assistance-ltd and south-staffordshire-plc entries → bridge:url fetched enforcement detail page → WebSearch pivoted to ICO press release and The Record article"
    summary: |
      The UK ICO fined South Staffordshire Plc and South Staffordshire Water Plc £963,900 (May 12, 2026) under Article 5(1)(f) and Article 32(1) UK GDPR for systematic security failures that allowed the Cl0p ransomware group to maintain undetected access for approximately 20 months (September 2020 to July 2022). The ICO's investigation identified five structural failures: (1) failure to implement least-privilege access controls, enabling the attacker to escalate to domain administrator privileges after entering via a malicious email attachment; (2) security-operations-centre monitoring covering only 5% of the IT estate as of December 2021; (3) unpatched Windows Server 2003 systems still in production; (4) domain controllers vulnerable to ZeroLogon (CVE-2020-1472, unpatched since August 2020); and (5) zero vulnerability scans conducted across the 21-month breach period. Attackers exfiltrated 4.1 TB of data including names, addresses, bank account numbers, sort codes, National Insurance numbers and disability information for Priority Services Register customers; data was subsequently published on the dark web in August 2022. The fine was reduced by 40% for early cooperation. The case is directly transferable to EU/EEA critical-infrastructure water-sector defenders: unpatched Netlogon implementations in domain-controller-adjacent OT/IT boundary environments, inadequate EDR or SIEM coverage of legacy Windows estates, and missing privileged-access management are the technical root causes. Detection controls that would have surfaced this intrusion: Windows Event 4728 (security group membership change), 4625/4624 logon anomalies on domain controllers, Sysmon EID 1 with unusual parent-process trees on legacy hosts, and baseline deviation in inbound NTLM challenge-response traffic.
    ch_eu_nexus: "UK jurisdiction (ICO); transferable lesson for EU NIS2 water-sector operators across CH/EU; ZeroLogon and OT/IT boundary failures are cross-jurisdictional"
