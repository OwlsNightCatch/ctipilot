        attribution: "NCSC-NL (NCSC-2026-0141)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0141"
      - quote: "Heap-based buffer overflow in Microsoft Windows DNS allows an unauthorized attacker to execute code over a network"
        attribution: "Microsoft MSRC (CVE-2026-41096)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41096"
      - quote: "a successful attack could be performed from a low privilege Hyper-V guest. The attacker could traverse the guest's security boundary to gain access to the Hyper-V host environment"
        attribution: "Microsoft MSRC (CVE-2026-40402 FAQ)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-40402"

