  - title: "Oracle WebLogic CVE-2024-21182 added to CISA KEV (2026-06-01) — two-year-old T3/IIOP unauthenticated data-access flaw now actively exploited against ports 7001/7002"
    sources:
      - url: "https://thehackernews.com/2026/06/oracle-weblogic-cve-2024-21182-added-to.html"
        publisher: "The Hacker News"
        date: "2026-06-02"
        role: "primary"
      - url: "https://securityaffairs.com/193027/security/u-s-cisa-adds-oracle-weblogic-flaw-to-its-known-exploited-vulnerabilities-catalog.html"
        publisher: "Security Affairs"
        date: "2026-06-02"
        role: "corroborating"
      - url: "https://www.cisa.gov/news-events/alerts/2026/06/01/cisa-adds-one-known-exploited-vulnerability-catalog"
        publisher: "CISA"
        date: "2026-06-01"
        role: "primary-vendor"
      - url: "https://www.oracle.com/security-alerts/cpujul2024.html"
        publisher: "Oracle CPU July 2024"
        date: "2024-07-16"
        role: "patch-reference"
    discovery_trace: "first seen at: cisa-kev bridge (dateAdded 2026-06-01, CVE-2024-21182) → THN article https://thehackernews.com/2026/06/oracle-weblogic-cve-2024-21182-added-to.html → Security Affairs corroboration https://securityaffairs.com/193027/ → CISA alert https://www.cisa.gov/news-events/alerts/2026/06/01/cisa-adds-one-known-exploited-vulnerability-catalog"
    summary: |
      CISA added CVE-2024-21182 to the KEV catalog on 2026-06-01 based on evidence of active
      exploitation, assigning a federal remediation deadline of 2026-06-04. The flaw (CVSS 7.5,
      ENISA EUVD shows exploitedSince 2026-06-01) affects Oracle WebLogic Server versions 12.2.1.4.0
      and 14.1.1.0.0. Attack vector: unauthenticated network access via the T3 or IIOP protocol
      listeners on the default ports 7001/7002. The vulnerability allows unauthorized read access to
      critical data or complete access to all WebLogic-accessible data; researchers observed an uptick
      in honeypot hits from mid-May 2026 with payloads including cryptocurrency miners, Cobalt Strike
      beacons, and Sodinokibi ransomware in some cases. The patch was shipped by Oracle in July 2024
      (CPU Jul 2024); organisations that did not apply it within the 23-month window are now under
      active attack. WebLogic is used as a J2EE application server across financial services, utilities,
      and large public-sector organisations in the EU. Detection: network-layer alerting on unauthenticated
      T3/IIOP connections to ports 7001/7002 from external sources; WAF rule blocking T3-protocol
      initiators; WebLogic access logs showing unexpected deserialization-class load events.
      Hardening: patch to July 2024 CPU or later; block T3/IIOP from the internet at the perimeter;
      use WebLogic connection filters to restrict T3/IIOP to internal admin-only subnets.
    ch_eu_nexus: "global; WebLogic widely deployed in EU financial-sector and government middleware estates"
    public_sector_nexus: "direct — WebLogic used in EU public-sector J2EE environments"
    sector: "finance, government, utilities, healthcare"
    cves: [CVE-2024-21182]
