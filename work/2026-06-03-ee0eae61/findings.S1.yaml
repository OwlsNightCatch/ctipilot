  - title: "Android Framework CVE-2025-48595 integer overflow exploited in limited targeted attacks; June 2026 Patch Tuesday covers 124 flaws"
    sources:
      - url: "https://thehackernews.com/2026/06/google-june-2026-android-update-patches.html"
        publisher: "The Hacker News"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/02/android-vulnerability-exploited-cve-2025-48595/"
        publisher: "Help Net Security"
        date: "2026-06-02"
        role: "corroborating"
      - url: "https://source.android.com/docs/security/bulletin/2026/2026-06-01"
        publisher: "Android Security Bulletin"
        date: "2026-06-01"
        role: "primary-vendor"
    discovery_trace: "first seen at: cisa-kev bridge (dateAdded 2026-06-02, CVE-2025-48595) → THN article URL https://thehackernews.com/2026/06/google-june-2026-android-update-patches.html → Help Net Security corroboration https://www.helpnetsecurity.com/2026/06/02/android-vulnerability-exploited-cve-2025-48595/ → Android Security Bulletin https://source.android.com/docs/security/bulletin/2026/2026-06-01"
    summary: |
      Google published its June 2026 Android Security Bulletin on 2026-06-01 covering 124 vulnerabilities.
      The single actively-exploited item is CVE-2025-48595, a CWE-190 integer overflow in the Android
      Framework component. Exploitation requires local code execution (attack vector: Local) but no
      privileges and no user interaction, making it exploitable by a malicious app already running on
      the device; the overflow enables privilege escalation to gain system-level access. Google
      confirmed "limited, targeted exploitation," language consistent with commercial spyware deployment
      (historical pattern in prior Android zero-day bulletins). Affected: Android 14, 15, 16, and 16
      QPR2. The full fix requires reaching patch level 2026-06-05 (which includes kernel and chipset
      vendor fixes from Imagination Technologies, MediaTek, Qualcomm, Unisoc). CISA added CVE-2025-48595
      to the KEV catalog on 2026-06-02 with a due date of 2026-06-05 for US federal agencies. CVSS 3.1
      base score: 8.4 (AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). Detection: Android management telemetry
      showing unexpected privilege escalation events; MDM/UEM solutions should report patch compliance
      against 2026-06-05 patch level. Hardening: enforce minimum patch level 2026-06-05 via MDM policy;
      disable sideloading; restrict app installation to managed stores on corporate devices.
    ch_eu_nexus: "global; Android devices in Swiss and EU public-sector mobile fleets (BYOD and MDM-managed)"
    public_sector_nexus: "direct — mobile device management in government organisations"
    sector: "government, healthcare, defence, all"
