  - title: "Windows DNS Client CVE-2026-41096 (CVSS 9.8) and Hyper-V CVE-2026-40402 (CVSS 9.3) — two critical May 2026 Patch Tuesday flaws highlighted by NCSC-NL amid confirmed exploitation of Netlogon CVE-2026-41089"
    sources:
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0141"
        publisher: "NCSC-NL"
        date: "2026-06-02"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41096"
        publisher: "Microsoft MSRC"
        date: "2026-05-12"
        role: "primary-vendor"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-40402"
        publisher: "Microsoft MSRC"
        date: "2026-05-12"
        role: "primary-vendor"
      - url: "https://thehackernews.com/2026/05/microsoft-patches-138-vulnerabilities.html"
        publisher: "The Hacker News"
        date: "2026-05-12"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-nl recent bridge → NCSC-2026-0141 (published 2026-06-02) flagging active exploitation of CVE-2026-41089 (Netlogon, already covered) + newly highlighting CVE-2026-41096 and CVE-2026-40402 → MSRC API cve CVE-2026-41096 → MSRC API cve CVE-2026-40402"
    summary: |
      NCSC-NL updated its Windows advisory (NCSC-2026-0141, version 1.01, 2026-06-02) to confirm
      that multiple parties have now reported active exploitation of CVE-2026-41089 (Netlogon
      stack-based buffer overflow, already covered 2026-06-02). Alongside this, the advisory highlights
      two other critical May 2026 Patch Tuesday flaws that remain unpatched widely.

      CVE-2026-41096 — Windows DNS Client Remote Code Execution (CVSS 9.8). A heap-based buffer
      overflow (CWE-122) in the Windows DNS client service. An unauthenticated attacker can send a
      specially crafted DNS response to any Windows host performing a DNS lookup; the malformed response
      triggers heap corruption in the DNS client's response parsing code. On certain configurations the
      corruption path reaches arbitrary code execution. Attack vector: network; attack complexity: low;
      no privileges required; no user interaction. Exploitation assessed "Unlikely" by MSRC but three
      public PoC repositories have appeared on GitHub. All supported Windows 11, Server 2022, and Server
      2025 versions are affected; patched in May 2026 Patch Tuesday (KB5058392 for Server 2022,
      KB5058391 for Windows 11 23H2). Detection: DNS server logs showing anomalous large or
      malformed response packets toward endpoints; Sysmon EID 22 (DNSQuery) combined with process
      crashes in svchost.exe hosting the Dnscache service; Windows Application event log event
      0x0000000C (DNS client service crash). Hardening: apply KB5058392/KB5058391; consider
      temporarily disabling the DNS Client service and falling back to direct DNS resolution via
      dnscache registry disable on non-DC endpoints to reduce attack surface until patched.

      CVE-2026-40402 — Windows Hyper-V Elevation of Privilege / VM Guest Escape (CVSS 9.3, Critical).
      A use-after-free (CWE-416) in Hyper-V's virtual device emulation handler. A process running
      inside a guest VM (with any privilege level — no CAP_SYS_ADMIN or admin equivalent needed)
      can send crafted requests to a Hyper-V integrated service or device emulation component,
      triggering the UAF condition. The host kernel reads from an arbitrary, potentially invalid
      address — in most cases causing a host bugcheck (DoS), but with device-register read side-effects
      enabling full S:C (scope change to host). An attacker who successfully exploits gains SYSTEM
      privileges on the Hyper-V host, exposing all co-resident VMs and their data. MSRC FAQ confirms:
      "a successful attack could be performed from a low privilege Hyper-V guest. The attacker could
      traverse the guest's security boundary to gain access to the Hyper-V host environment."
      Exploitation currently assessed "Less Likely." Affected: Windows 11 23H2, Windows Server 2022.
      Patch: May 2026 Patch Tuesday. Detection: Hyper-V host event log EventID 18590 (Hyper-V worker
      process crash); unusual kernel-mode crash dumps on Hyper-V host correlated with guest VM
      activity. Hardening: patch Hyper-V hosts immediately; limit guest VM operators to trusted
      administrators; evaluate Hyper-V Guard configuration.
    ch_eu_nexus: "global; Windows environments universal across CH/EU public-sector IT"
    public_sector_nexus: "direct — Windows infrastructure universal in public-sector environments"
    sector: "all — Windows environments"
    cves: [CVE-2026-41096, CVE-2026-40402]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
