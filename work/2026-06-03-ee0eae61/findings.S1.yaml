  - title: "CVE-2022-0492 — Linux kernel cgroups v1 container-escape LPE added to CISA KEV (2026-06-02); exploited without CAP_SYS_ADMIN on permissively-profiled containers"
    sources:
      - url: "https://www.cisa.gov/news-events/alerts/2026/06/02/cisa-adds-two-known-exploited-vulnerabilities-catalog"
        publisher: "CISA"
        date: "2026-06-02"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/cve-2022-0492"
        publisher: "NIST NVD"
        date: "2022-03-03"
        role: "cve-reference"
      - url: "https://unit42.paloaltonetworks.com/cve-2022-0492-cgroups/"
        publisher: "Palo Alto Unit 42"
        date: "2022-03-07"
        role: "technical-reference"
    discovery_trace: "first seen at: cisa-kev bridge (dateAdded 2026-06-02, CVE-2022-0492) → CISA alert URL https://www.cisa.gov/news-events/alerts/2026/06/02/cisa-adds-two-known-exploited-vulnerabilities-catalog → NVD https://nvd.nist.gov/vuln/detail/cve-2022-0492"
    summary: |
      CISA added CVE-2022-0492 to the KEV catalog on 2026-06-02 with a due date of 2026-06-05,
      confirming active exploitation. The flaw (CVSS 7.0, CWE-287 Improper Authentication + CWE-862
      Missing Authorization) resides in the kernel's cgroup_release_agent_write function in
      kernel/cgroup/cgroup-v1.c. Linux did not verify that a process setting the release_agent file
      possessed CAP_SYS_ADMIN, allowing any process in the cgroup namespace to write arbitrary content
      to the release_agent and trigger execution at container-host level when a cgroup becomes empty.
      This path enables container escape from containers running without AppArmor, SELinux, or Seccomp
      profiles — a common misconfiguration in self-hosted Kubernetes clusters. The vulnerability
      affects cgroup v1 (the dominant architecture on older distros); the mainline fix landed in kernel
      5.17-rc3. The 4-year gap between patch and KEV addition implies fresh exploitation of unpatched
      legacy kernel deployments, likely against container-dense cloud-native environments.
      Detection: Falco/sysdig rule on writes to /sys/fs/cgroup/**/release_agent by non-root processes;
      Sysmon EID 1 (Linux) on cgroup_release_agent writes; auditing CAP_SYS_ADMIN checks in the audit
      daemon; container-runtime alerts on unexpected privilege escalation. Hardening: upgrade kernel to
      5.17+ or apply distro backport; enforce AppArmor/SELinux/Seccomp profiles on all containers;
      disable cgroup v1 and force cgroup v2 exclusively (systemd-based distros: set
      systemd.unified_cgroup_hierarchy=1); restrict /sys/fs/cgroup mount in container runtimes.
    ch_eu_nexus: "global; Linux kernel universal — affects CH/EU public-sector cloud-native and self-hosted Kubernetes environments"
    public_sector_nexus: "direct — widespread in self-hosted cloud environments"
    sector: "all — cloud/container environments"
    cves: [CVE-2022-0492]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Linux Kernel contains an improper authentication vulnerability which could allow for privilege escalation via the cgroups v1 release_agent feature"
        attribution: "CISA KEV Catalog"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/06/02/cisa-adds-two-known-exploited-vulnerabilities-catalog"

  - title: "UPDATE: Gamaredon deploys GammaSteel infostealer via WinRAR CVE-2025-8088 path traversal alongside GammaWorm; GammaSteel exfiltrates to AWS S3"
    sources:
      - url: "https://thehackernews.com/2026/06/gamaredon-exploits-winrar-to-deliver.html"
        publisher: "The Hacker News"
        date: "2026-06-02"
        role: "primary"
      - url: "https://blog.sekoia.io/fsbs-matryoshka-1-3-gamaredons-gifts-that-keeps-unpacking-gammaphish-and-gammaworm/"
        publisher: "Sekoia TDR"
        date: "2026-06-01"
        role: "primary-research"
    discovery_trace: "first seen at: hackernews feed https://thehackernews.com/2026/06/gamaredon-exploits-winrar-to-deliver.html → Sekoia research blog https://blog.sekoia.io/fsbs-matryoshka-1-3-gamaredons-gifts-that-keeps-unpacking-gammaphish-and-gammaworm/ → prior coverage check: Sekoia GammaPhish/GammaWorm 2026-06-02, but CVE-2025-8088 + GammaSteel not previously covered → classified as UPDATE with material new delta"
    summary: |
      Sekoia TDR published Part 1 of their "FSB's Matryoshka" Gamaredon series on 2026-06-01, adding
      material detail not present in the 2026-06-02 brief's Gamaredon item: the exploitation of
      CVE-2025-8088 (WinRAR path traversal) as an entry vector, and the use of GammaSteel — a modular
      information stealer — as a second payload alongside GammaWorm. The infection chain is:
      WinRAR archive exploiting CVE-2025-8088 → GammaPhish (HTA payload) → GammaLoad (VBScript
      downloader) → GammaWorm or GammaSteel delivery. GammaWorm (VBScript-based) establishes
      persistence via scheduled tasks, replaces directories with LNK files, uses NTFS Alternate Data
      Streams (ADS) to hide modules, and communicates via Telegram channels (T1102 Web Service C2).
      GammaSteel is a modular file-extension-based stealer that exfiltrates to AWS S3 buckets or
      attacker-controlled servers. Attribution: Russia's FSB; cluster Gamaredon / UAC-0010 / ACTINIUM.
      Targeting: Ukrainian government, military, critical infrastructure. Detection:
      WinRAR spawning HTA processes (Sysmon EID 1, parent image: WinRAR.exe, child: mshta.exe);
      scheduled tasks created with obfuscated names from WinRAR parent; NTFS ADS writes to
      non-standard directories (Sysmon EID 15 — file stream creation); outbound traffic to
      Telegram APIs (t.me / api.telegram.org) from endpoints not used for Telegram. CVE-2025-8088:
      path traversal in WinRAR; patch to WinRAR 7.10 or later.
    ch_eu_nexus: "Eastern Europe primary target; CH/EU relevance as cross-border espionage awareness; WinRAR universally installed in EU government environments"
    public_sector_nexus: "indirect — targeting Ukraine state actors; WinRAR vector affects CH/EU orgs using WinRAR"
    sector: "government, defence, critical infrastructure"
    cves: [CVE-2025-8088]
    actors_campaigns_malware: ["Gamaredon", "UAC-0010", "ACTINIUM", "GammaPhish", "GammaLoad", "GammaWorm", "GammaSteel"]
