    discovery_trace: "first seen at: therecord feed, URL https://therecord.media/feed → item 'Feds seize alleged cyber-scam infrastructure connected to Southeast Asian company' (June 23) → therecord.media/feds-seize-alleged-cyber-scam-infrastructure-southeast-asia → primary: CyberScoop, URL https://cyberscoop.com/doj-huione-group-cybercrime-seizure/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/06/doj-seizes-huione-cloud-account-tied-to.html"
    summary: |
      The U.S. Department of Justice seized on June 23, 2026, a cloud computing account used to host backend infrastructure for Huione Guarantee (also known as Haowang Guarantee), a Cambodia-based subsidiary of the Huione Group. Huione Guarantee operated via Telegram channels as an escrow marketplace for cybercriminal services, facilitating transfers of illicit cryptocurrency proceeds. By the time it was forced offline, the platform had received more than $31 billion in cryptoasset transactions — described as the largest illicit online marketplace ever recorded, more than 25 times larger than Silk Road and AlphaBay combined. The marketplace carried stolen financial data, malware-enabled theft proceeds, human-trafficking facilitation, and money-laundering services for romance/investment (pig-butchering) scams. Treasury concurrently sanctioned Huione Group and a successor entity, H-Pay Service PLC, extending prior FinCEN action that had severed the group from the US financial system. The seizure is part of Operation Riptide, an FBI campaign against cybercrime networks. For European defenders, Huione Guarantee was the primary laundering layer for crypto-enabled fraud proceeds affecting European residents through pig-butchering scam campaigns.
