    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → item 'Amadey and StealC Malware Network Disrupted, 27M Stolen Credentials Recovered' (June 24) → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/ → corroborating: ESET Research, URL https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/"
    summary: |
      A coordinated law enforcement and private-sector action on June 24, 2026, dismantled 296 C2 servers and 66 domains supporting Amadey and StealC — two commercially operated malware-as-a-service families that together form the dominant pre-ransomware infection chain. The operation is the third major phase of Operation Endgame and was coordinated by Europol, with participation from the Netherlands, Canada, United States, Germany, and Denmark alongside Microsoft DCU, ESET, Bitsight, IBM X-Force, Proofpoint, and Mitsui Bussan Secure Directions. Amadey (active since 2018) is a modular C++ HTTP-based loader: it uses RC4-encrypted POST communications, establishes persistence via scheduled tasks, and can drop any secondary payload via its 30+ command set — in the disrupted clusters, a documented chain ran StealC → XTinyLoader → LockBit Black ransomware. StealC is a C++ infostealer MaaS (operator handles named as "plymouth") that harvests from Chromium browsers (including via process injection to bypass App-Bound Encryption), Firefox, email clients, cryptocurrency wallets, SSH/FTP clients and Steam; it communicates via RC4-encrypted HTTP JSON and includes language-based execution guards (Russian, Ukrainian, Belarusian, Kazakh, Uzbek locales trigger self-deletion). Proofpoint and IBM X-Force researchers found a PHP filename-sanitization flaw in StealC's commercial C2 panel — the `sanitize_filename` function did not filter forward-slashes, allowing directory traversal and unauthenticated web shell upload — which was leveraged to emulate botnet clients, extract payload URLs from 73 distinct StealC clusters and 53 distinct Amadey clusters, and map the full affiliate infrastructure. The action recovered over 25.6 million unique stolen credentials from more than 385,000 compromised systems, and 18,000 victim computers had criminal control severed. Total crypto assets frozen: €41 million ($47 million).
    ch_eu_nexus: "global; EU agencies Germany and Netherlands led; Amadey/StealC used as initial-access and credential-theft stages for ransomware affecting European critical infrastructure"
    public_sector_nexus: "indirect — infostealer logs are sold as initial-access products to ransomware affiliates that target public sector"
    sector: "all sectors; financial services, healthcare, critical infrastructure via downstream ransomware"
    cves: []
