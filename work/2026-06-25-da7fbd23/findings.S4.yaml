    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A StealC client downloading XTinyLoader, which, in turn, downloaded a LockBit Black ransomware payload"
        attribution: "Proofpoint / IBM X-Force"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/stealc-you-later-proofpoint-and-ibm-x-force-support-operation-endgame"
      - quote: "Researchers identified 53 unique Amadey clusters and 73 distinct Stealc clusters based on RC4 keys, C&C URL patterns, and build identifiers"
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/"
      - quote: "the filename sanitization function failed to filter forward-slashes, enabling directory traversal attacks and unauthorized web shell uploads"
        attribution: "Proofpoint / IBM X-Force"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/stealc-you-later-proofpoint-and-ibm-x-force-support-operation-endgame"
    extended_notes: |
      Defender detection focus: Amadey uses HTTP POST with RC4-encrypted body — look for high-frequency POST traffic to sequential short-lifespan C2 domains, scheduled-task creation by unusual parent processes (browsers, Word, Excel) from AppData paths (T1053.005), and network connections from Office/browser processes to uncommon TLDs. StealC target artefacts: Chromium browser process injection (T1055) to bypass App-Bound Encryption will surface as one Chromium process opening another Chrome process handle in EDR telemetry; LSASS reads from a non-system parent are not characteristic (StealC focuses on browser/app credential stores, not LSASS). The XTinyLoader→LockBit Black secondary stage chain means defenders who detect and block Amadey/StealC have a real ransomware pre-emption opportunity. MITRE ATT&CK: T1195.001 (Supply-chain compromise via MaaS), T1059.001 (PowerShell execution from secondary loader), T1053.005 (Scheduled Task persistence), T1056.001 (browser credential theft), T1071.001 (HTTP C2), T1486 (LockBit Black data encryption). Hardening: Chromium's App-Bound Encryption is partially effective but StealC v2 bypasses it via process injection — enable Microsoft Defender ASR rule "Block credential stealing from the Windows local security authority subsystem" and the rule "Block executable files from running unless they meet a prevalence, age, or trusted list criterion."

  - title: "UPDATE: Klue/Icarus Salesforce OAuth breach — BeyondTrust and LastPass confirmed, victim count exceeds 14; Salesforce disables Klue Battlecards integration"
    sources:
      - url: "https://www.securityweek.com/beyondtrust-lastpass-impacted-by-klue-salesforce-incident/"
        publisher: "SecurityWeek"
        date: "2026-06-24"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/salesforce-disables-klue-app.html"
        publisher: "The Hacker News"
        date: "2026-06-19"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/24/lastpass-klue-data-breach-salesforce-environment/"
        publisher: "Help Net Security"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: securityweek feed, URL https://www.securityweek.com/feed/ → item 'BeyondTrust, LastPass Impacted by Klue-Salesforce Incident' (June 24) → primary: SecurityWeek article, URL https://www.securityweek.com/beyondtrust-lastpass-impacted-by-klue-salesforce-incident/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/06/salesforce-disables-klue-app.html → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/06/24/lastpass-klue-data-breach-salesforce-environment/"
    summary: |
      The Klue/Icarus Salesforce OAuth-token breach — first covered June 19 and last delta June 23 (nine firms confirmed) — expanded significantly on June 24. BeyondTrust (privileged-access management platform) and LastPass (password manager) both disclosed that business contact and sales-related Salesforce CRM data was exfiltrated via the Klue integration. Total confirmed victim count is now over 14 named organizations: BeyondTrust, LastPass, Pendo, 8x8, HackerOne, Huntress, Jamf, OneTrust, Recorded Future, Snyk, Sprout Social, Tanium, Insurity, and Gong. Icarus (active since April 28, 2026) used a compromised legacy credential from a 2022 pilot project to access Klue's integration infrastructure, generate OAuth tokens for connected customer CRM environments, then ran automated Python scripts executing bulk REST API queries to exfiltrate Salesforce records — customer names, phone numbers, email addresses, physical addresses, support case data, and sales records. Salesforce moved to block the threat path by disabling the Klue Battlecards app integration on June 17; the LastPass disclosure specifies customer vaults were not affected. The BeyondTrust breach is operationally significant because BeyondTrust is itself a privileged-access management vendor; their exposure to a SaaS supply-chain attack through a Salesforce integration illustrates that CRM data for high-value security vendors is a targeting priority for extortion actors.
    ch_eu_nexus: "global; BeyondTrust and LastPass are used by EU public-sector organizations; Salesforce CRM breach of security-vendor customer lists is intelligence value for follow-on targeting"
    public_sector_nexus: "indirect — Salesforce CRM data from security vendors includes public-sector customer contacts, procurement details, and support case information"
    sector: "cybersecurity vendors, technology, financial services"
    cves: []
    actors_campaigns_malware:
      - "Icarus (extortion group, active since April 28 2026)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-23"
    evidence:
      - quote: "BeyondTrust also said business contact and sales-related information was stolen from its Salesforce instance"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/beyondtrust-lastpass-impacted-by-klue-salesforce-incident/"
      - quote: "On June 12th LastPass was made aware of an incident...an unauthorized actor was able to obtain OAuth tokens Klue held for many of its customers, including LastPass"
        attribution: "Help Net Security (citing LastPass statement)"
        source_url: "https://www.helpnetsecurity.com/2026/06/24/lastpass-klue-data-breach-salesforce-environment/"
      - quote: "Salesforce moved to block the threat path by disabling the Klue Battlecards connection on June 17"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/salesforce-disables-klue-app.html"
    extended_notes: |
      Defender/IR takeaway: Organizations using Klue or any SaaS tool that holds long-lived OAuth tokens to production CRM (Salesforce, HubSpot, Dynamics) should: (1) audit connected apps with token-level Salesforce API access via Setup → Connected Apps → Monitor OAuth Sessions; (2) implement token-scope minimization (read-only, object-specific scopes); (3) add Salesforce API usage anomaly detection — Event Log File (ELF) events `ApiTotalUsage` and `ApiAnomalyEventStore` in the EventMonitoring add-on surface bulk REST API exfiltration. This follows the same pattern as the 2023 GitHub OAuth token abuse via Heroku and the 2021 Codecov supply-chain. MITRE ATT&CK: T1199 (Trusted Relationship via SaaS integration), T1528 (Steal Application Access Token — OAuth), T1213.003 (CRM platform data exfiltration). Organizations that receive a Salesforce "Connected App disabled" notification should treat it as an incident-trigger and audit historical ELF API call logs from the Klue app for the window June 11–17, 2026.

  - title: "DoJ seizes Huione Group cloud infrastructure supporting $31B cyber-scam money-laundering ecosystem"
