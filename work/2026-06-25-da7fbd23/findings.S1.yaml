  - title: "Dify.AI cross-tenant data-exposure flaw (DifyTap): tenant isolation bypass enabling silent wiretap of AI data on platform powering 1M+ apps"
    sources:
      - url: "https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps"
