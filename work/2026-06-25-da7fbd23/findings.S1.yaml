    summary: |
      Europol-coordinated Operation Endgame Phase 3 (action date June 24, 2026) dismantled the shared
      infrastructure of two major cybercrime-as-a-service platforms: StealC (an RC4+Base64-encrypted
      C++ infostealer MaaS harvesting browser credentials, session cookies, crypto wallets, and email
      accounts, with CIS-language exclusions in its kill-switch logic) and Amadey (a C++ modular
      backdoor/loader active since 2018, supporting 29+ backdoor commands including scheduled-task
      persistence, WMI-based lateral movement, and payload staging for StealC, RATs, and ransomware).
      326 servers taken down, 142 domains seized, and 27 million stolen credentials recovered; EUR 41M
      in crypto assets frozen. An infection wave in May–June 2026 peaked at 140,000+ infected systems
      in the first two weeks of May alone. Microsoft DCU contributed AI-assisted binary analysis and
      C2 infrastructure mapping under court order. Delivery chains documented by Microsoft include SEO
      poisoning (T1608.006), ClickFix fake CAPTCHA lures (T1204.002), malvertising, and phishing —
      consistent with the Amadey loader's role as a universal initial-access commodity. This is a
      DISTINCT action from the June 19 SocGholish/TA569 wave also branded Operation Endgame.
    ch_eu_nexus: "direct — EU-coordinated Europol action; ESET (EU) and Microsoft DCU jointly participated; recovered credentials include European victim organisations"
    public_sector_nexus: "indirect — infostealer credential pools feed ransomware affiliates that do target public sector; Amadey widely used by groups including Black Basta, Akira, Rhysida"
    sector: "all sectors, cross-sector MaaS supply chain"
