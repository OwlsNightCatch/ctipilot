      T1552.001 (Unsecured Credentials: Credentials In Files), T1056 (Keylogging components in StealC).
      Defender detection angle: Amadey scheduled tasks created under `%APPDATA%\Microsoft\` paths with
      randomised names; look for Task Scheduler EID 4698 with non-standard binary paths. StealC
      process creates registry keys for persistence; EDR parent-process chain: browser or document
