      of ClickFix-based initial access. SIEM: correlate `4624 Logon Type 3` lateral movement with
      Amadey's documented WMI pivot chains (Sysmon EID 1, parent `wmiprvse.exe`).

  - title: "Cordyceps: GitHub Actions pull_request_target misconfiguration class enables unauthenticated supply-chain compromise of 300+ repositories"
    sources:
      - url: "https://novee.security/blog/cordyceps/"
        publisher: "Novee Security"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.securityweek.com/exploitable-ci-cd-vulnerabilities-expose-millions-of-repositories-to-hijacking/"
        publisher: "SecurityWeek"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
        publisher: "GitHub Changelog"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Cordyceps GitHub Actions vulnerability June 2026'), URL https://www.securityweek.com/exploitable-ci-cd-vulnerabilities-expose-millions-of-repositories-to-hijacking/ → primary: Novee Security, URL https://novee.security/blog/cordyceps/ → corroborating: GitHub Changelog, URL https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
    summary: |
      Novee Security published research on June 23, 2026 naming 'Cordyceps' as a class of exploitable
      CI/CD vulnerabilities in GitHub Actions workflows that share a structural pattern: a
      pull_request_target trigger running with repository write permissions while simultaneously
      accessing untrusted fork PR code — enabling unauthenticated attackers to achieve arbitrary code
      execution in a privileged CI context via command injection, broken authentication logic in
      workflow chains, artifact poisoning, and privilege escalation into cloud-credential-bearing
      environments. Of 30,000 high-impact repositories scanned, 654 vulnerable instances were found
      and 300+ confirmed fully exploitable. Confirmed-vulnerable repositories at time of disclosure
      included Microsoft (Azure Sentinel SIEM), Google (AI Agent Development Kit), Apache (Doris),
      Cloudflare (Workers SDK), and the Python Software Foundation (Black formatter). Exploitation
      requires only a free GitHub account and a single pull request. No CVE has been assigned (this is
      a configuration pattern class, not a single implementation flaw). GitHub updated
      actions/checkout on June 18 to block the most common pwn-request pattern.
    ch_eu_nexus: "direct — GitHub Actions is ubiquitous in Swiss and EU public-sector DevSecOps pipelines; any organisation using pull_request_target in open or org-private repos is in scope"
    public_sector_nexus: "direct — public-sector repositories using GitHub Actions CI/CD for software delivery are directly at risk; supply-chain compromise of workflows publishing to package registries (npm, PyPI, Docker Hub) is the high-impact path"
    sector: "software development, public sector, critical infrastructure software supply chain"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Scans of 30,000 high-impact repositories flagged 654 vulnerable instances; over 300 were confirmed fully exploitable"
        attribution: "Novee Security"
        source_url: "https://novee.security/blog/cordyceps/"
      - quote: "Affected organizations include Microsoft (Azure Sentinel SIEM), Google (AI Agent Development Kit), Apache (Doris database), Cloudflare (Workers SDK), and the Python Software Foundation (Black)"
        attribution: "Novee Security"
        source_url: "https://novee.security/blog/cordyceps/"
      - quote: "GitHub updated actions/checkout on June 18 to block common pwn-request patterns"
        attribution: "GitHub Changelog"
        source_url: "https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
    extended_notes: |
      Technique mapping: T1195.002 (Compromise Software Supply Chain), T1553.002 (Code Signing — pipeline
      artefact signing trust chain broken), T1078.001 (Valid Accounts: Default Accounts — cloud credentials
      in GitHub Secrets readable from privileged workflow context). Defender hardening:
      (1) Audit all .github/workflows/ YAML files for pull_request_target triggers; flag any that
      also contain actions/checkout@v* referencing ${{ github.event.pull_request.head.sha }}.
      (2) Enforce GITHUB_TOKEN permission scoping: contents: read, packages: none by default in
      org-level workflow policy. (3) Separate privilege: use pull_request (unprivileged) for build/test
      and pull_request_target only for label assignment/comment posting with no code checkout.
      (4) Protect branch policies requiring workflow-approval on first-time contributors.
      (5) Rotate any secrets stored in GitHub Actions Secrets for affected repository classes.
      Traditional SAST/DAST tooling misses this class because the vulnerability exists in
      workflow-composition logic across multiple files, not in any single file's static analysis.

  - title: "Mistic (Backdoor.Mistic / MLTBackdoor): new stealthy IAB backdoor with BOF execution deployed by Woodgnat/KongTuke against education, insurance, IT, and professional services"
    sources:
      - url: "https://www.broadcom.com/support/security-center/protection-bulletin/backdoor-mistic-new-backdoor-may-be-linked-to-ransomware-access-broker"
