      - "Mistic / MLTBackdoor (backdoor)"
      - "ModeloRAT (co-deployed)"
      - "Qilin, Interlock, Rhysida, Akira, 8Base, Black Basta (ransomware buyers)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Mistic achieves DLL sideloading via a digitally-signed Microsoft Defender executable (MpExtMs.exe) loading a malicious DLL named EndpointDlp.dll"
        attribution: "CSO Online (citing Symantec)"
        source_url: "https://www.csoonline.com/article/4189132/be-on-the-lookout-for-mistic-a-new-backdoor-used-by-ransomware-broker.html"
      - quote: "One of the most powerful features in MLTBackdoor is the ability to load Beacon Object Files (BOFs) to expand its capabilities"
        attribution: "SecurityWeek (citing Symantec)"
        source_url: "https://www.securityweek.com/new-mistic-rat-opens-door-to-several-ransomware-families/"
      - quote: "Woodgnat maintains relationships with six ransomware families including Qilin, Interlock, Rhysida, Akira, 8Base, and Black Basta"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/new-mistic-rat-opens-door-to-several-ransomware-families/"
    extended_notes: |
      Technique mapping: T1574.002 (DLL Side-Loading via MpExtMs.exe/EndpointDlp.dll), T1059.001
      (PowerShell initial access via ClickFix/FileFix/CrashFix lures), T1055 (Process Injection via
      BOF in-memory execution), T1036.005 (Masquerading: Match Legitimate Name — DLL named EndpointDlp.dll
      to blend with Defender). Detection: Sysmon EID 7 (ImageLoaded) — flag any process loading a DLL
      named EndpointDlp.dll when parent is NOT a legitimate Microsoft Defender component path.
      Security baselines: Windows Defender DLPs are loaded from `%ProgramFiles%\Windows Defender\`
      signed with Microsoft certificate — any EndpointDlp.dll loaded from a user-writable path or
      with a non-Microsoft certificate is a high-confidence indicator. Also: Sysmon EID 1 parent-chain
      for PowerShell invocations from Teams client processes (lync.exe, teams.exe) are a tier-1
      ClickFix detection.

  - title: "Edgecution: malicious Microsoft Edge extension abuses Chrome Native Messaging API to bypass browser sandbox and deploy Python backdoor (Payouts Kings IAB)"
    sources:
      - url: "https://www.zscaler.com/blogs/security-research/payouts-king-ransomware-initial-access-broker-deploys-new-edgecution"
        publisher: "Zscaler ThreatLabz"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/malicious-edge-extension-abuses-native-messaging-as-bridge-to-malware/"
        publisher: "BleepingComputer"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('malicious Edge extension Native Messaging malware bridge June 2026'), URL https://www.bleepingcomputer.com/news/security/malicious-edge-extension-abuses-native-messaging-as-bridge-to-malware/ → primary: Zscaler ThreatLabz, URL https://www.zscaler.com/blogs/security-research/payouts-king-ransomware-initial-access-broker-deploys-new-edgecution → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/malicious-edge-extension-abuses-native-messaging-as-bridge-to-malware/"
    summary: |
      Zscaler ThreatLabz published research (June 23-24, 2026) on 'Edgecution', a novel two-component
      malware family attributed to the Payouts Kings IAB. An initial access chain begins with a
      Microsoft Teams social-engineering lure where attackers impersonate IT support, directing victims
      to a fraudulent Outlook update portal. This delivers a ZIP containing Python 3.13.3 (embedded),
      a malicious Edge browser extension masquerading as an 'Edge Monitoring Agent', and native
      messaging host components. The extension runs in a headless Edge browser instance (invisible to
      the user), beacons to C2 infrastructure on CloudFront/AWS subdomains, and relays commands to a
      Python-based backdoor via Chrome's Native Messaging protocol — bridging the browser sandbox to
      the host OS. The Python backdoor implements shell command execution, PowerShell invocation,
      arbitrary code execution, file write, process enumeration, and system reconnaissance. This
      technique exploits the Native Messaging protocol's design (browser-extension to local native
      application IPC via stdio) to circumvent EDR/AV controls that monitor browser processes but not
      native-messaging-host child processes.
    ch_eu_nexus: "indirect — Payouts Kings targets English-speaking corporate environments; the browser-extension sandbox-escape vector is directly relevant to any organisation running Microsoft Edge as their corporate browser"
    public_sector_nexus: "indirect — Swiss federal and cantonal administrations deploying Microsoft Edge are in scope; Teams-based social engineering is a documented public-sector attack vector"
    sector: "financial services, enterprise, public sector"
    cves: []
    actors_campaigns_malware:
      - "Payouts Kings (ransomware operation / IAB)"
      - "Edgecution (malware)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Edgecution has two components: a Microsoft Edge browser extension that beacons to a command-and-control (C2) server and relays host-based commands to a Python-based backdoor"
        attribution: "BleepingComputer (citing Zscaler ThreatLabz)"
        source_url: "https://www.bleepingcomputer.com/news/security/malicious-edge-extension-abuses-native-messaging-as-bridge-to-malware/"
      - quote: "the attackers gain direct host access, enabling them to manipulate the local filesystem, launch processes, and execute arbitrary code on the compromised host"
        attribution: "BleepingComputer (citing Zscaler ThreatLabz)"
        source_url: "https://www.bleepingcomputer.com/news/security/malicious-edge-extension-abuses-native-messaging-as-bridge-to-malware/"
      - quote: "All of the C2 servers observed by ThreatLabz have leveraged subdomains of cloudfront.net and hosted on Amazon AWS"
        attribution: "Zscaler ThreatLabz"
        source_url: "https://www.zscaler.com/blogs/security-research/payouts-king-ransomware-initial-access-broker-deploys-new-edgecution"
    extended_notes: |
      Technique mapping: T1204.002 (User Execution: Malicious File — Teams-delivered ZIP), T1559 (Inter-
      Process Communication — Native Messaging API abused as browser-to-host IPC bridge), T1059.006
      (Python execution), T1564.003 (Hide Artifacts: Hidden Window — headless Edge process invisible to
      user), T1071.001 (Application Layer Protocol: Web Protocols — C2 over CloudFront HTTPS). Detection:
      (1) Process-tree EDR rule: Edge process (msedge.exe) spawning a native messaging host (nmhost.exe
      or any custom executable registered under HKCU\Software\Microsoft\Edge\NativeMessagingHosts)
      followed by Python interpreter invocation is the kill-chain signature. (2) Registry monitoring:
      HKCU\Software\Microsoft\Edge\NativeMessagingHosts\ additions by non-installer processes.
      (3) Network: CloudFront subdomain beaconing from msedge.exe or child process is anomalous in
      normal enterprise context. Hardening: enterprise browsers should restrict extension installation
      to approved publisher IDs via Group Policy (ExtensionInstallAllowlist / BlockExternalExtensions),
      and Native Messaging hosts should be allow-listed. Disabling user-profile NativeMessagingHosts
      registry key creation via AppLocker/WDAC prevents this class of persistence.

  - title: "Arista EOS tunnel decapsulation vulnerability exploited in the wild — no patch planned for EOS 4.x"
    sources:
      - url: "https://eclypsium.com/blog/arista-eos-tunnel-decapsulation-no-patch/"
        publisher: "Eclypsium"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.securityweek.com/no-patch-planned-for-exploited-arista-eos-vulnerability/"
        publisher: "SecurityWeek"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer feed (THN) listing → WebSearch ('Arista EOS unpatched vulnerability exploited June 2026') → primary: Eclypsium, URL https://eclypsium.com/blog/arista-eos-tunnel-decapsulation-no-patch/ → corroborating: SecurityWeek, URL https://www.securityweek.com/no-patch-planned-for-exploited-arista-eos-vulnerability/"
    summary: |
      Eclypsium published research (June 23, 2026) identifying an exploited tunnel decapsulation
      vulnerability in Arista Networks EOS affecting the Arista 7000 series and related data-centre
      switches. The flaw lies in the EOS kernel's handling of IP-in-IP / GRE tunnel decapsulation
      packets — an unauthenticated network-adjacent attacker can craft tunnel packets that the EOS
      kernel processes without validating source authenticity, enabling packet injection into the
      internal routing fabric and potentially bypassing ACLs. Arista has stated no patch is planned
      for affected EOS 4.x versions; mitigation is configuration-based (disabling IP-in-IP tunnel
      interfaces, applying inbound ACLs to reject unexpected tunnel protocols). Eclypsium confirmed
      active exploitation in data-centre targeting.
    ch_eu_nexus: "direct — Arista 7000 series switches are common in Swiss financial, healthcare, and government data centres; no patch means defenders must rely on configuration mitigation"
    public_sector_nexus: "indirect — data-centre network infrastructure is foundational to all sectors; Arista is widely deployed in Swiss and EU telco and enterprise DCs"
    sector: "networking, data centres, telco, financial services, public sector infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Arista has stated no patch is planned for affected EOS 4.x versions"
        attribution: "Eclypsium"
        source_url: "https://eclypsium.com/blog/arista-eos-tunnel-decapsulation-no-patch/"
    extended_notes: |
      Technique mapping: T1599.001 (Network Boundary Bridging: Routing Manipulation / tunnel injection).
      Defender hardening: (1) Disable IP-in-IP (ipip) and GRE tunnel interfaces globally unless
      required: `no interface Tunnel<N>` and `ip access-group <deny-tunnel-protocols> in` on border
      interfaces. (2) Deploy Arista's recommended ACL to drop unexpected IPPROTO_4 (protocol 4) and
      IPPROTO_47 (GRE) packets at ingress. (3) Enable port security and strict source-IP verification
      on uplink interfaces. Detection: network flow analysis looking for IPPROTO 4 or 47 traffic
      arriving on external-facing interfaces from non-declared tunnel peers.

  - title: "GhostSender: Exchange Online anti-spam infrastructure abused to send spoofed internal email at scale"
    sources:
      - url: "https://abnormal.ai/blog/ghost-sender-exchange-online-spoofing"
        publisher: "Abnormal Security"
        date: "2026-06-23"
        role: "primary"
      - url: "https://labs.infoguard.ch/posts/ghost-sender/"
        publisher: "InfoGuard Security Labs (CH)"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: bridge fetch (infoguard labs feed) → primary: Abnormal Security, URL https://abnormal.ai/blog/ghost-sender-exchange-online-spoofing → corroborating: InfoGuard Security Labs, URL https://labs.infoguard.ch/posts/ghost-sender/"
    summary: |
      Abnormal Security (June 23, 2026) and InfoGuard (Swiss, June 24) jointly described 'GhostSender',
      a technique exploiting Exchange Online's outbound anti-spam relay infrastructure. By abusing
      Exchange Online's cross-tenant outbound relay path (the MX/SMTP gateway Microsoft uses to
      deliver bulk mail for Office 365 tenants), attackers with any compromised or legitimately
      registered tenant can craft messages that arrive at target inboxes appearing to originate from
      internal senders of the target organisation — bypassing DMARC, DKIM, and SPF checks since the
      relay path uses Microsoft's own authenticated sending infrastructure. The technique enables
      highly convincing internal-sender phishing (CEO fraud, IT helpdesk impersonation) at scale.
      Microsoft was notified; the fix requires Microsoft-side anti-spoofing enforcement changes in
      Exchange Online tenant trust policies.
    ch_eu_nexus: "direct — InfoGuard (a leading Swiss security consultancy) published a Swiss-focused analysis; Exchange Online is the dominant email platform across Swiss and EU public-sector organisations"
    public_sector_nexus: "direct — Swiss federal and cantonal email runs on Exchange Online; this technique enables highly convincing impersonation of internal senders to officials and staff"
    sector: "all sectors using Exchange Online / Microsoft 365"
    cves: []
    actors_campaigns_malware:
      - "GhostSender (technique/campaign name)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "GhostSender abuses Exchange Online cross-tenant relay to spoof internal senders at target organisations, bypassing DMARC/DKIM/SPF"
        attribution: "InfoGuard Security Labs (CH)"
        source_url: "https://labs.infoguard.ch/posts/ghost-sender/"
    extended_notes: |
      Technique mapping: T1566.001 (Phishing: Spearphishing Attachment / BEC context), T1534 (Internal
      Spearphishing — spoofed internal sender), T1586.001 (Compromise Accounts: Email Accounts — leverages
      Exchange relay infrastructure). Detection: Microsoft Defender for Office 365 — tenant admins should
      enable Enhanced Filtering for Connectors and monitor for anomalous X-MS-Exchange-Organization headers
      that do not correspond to declared inbound connectors. Exchange audit logs: messages arriving via
      the outbound-relay path (SmtpRelayForExternalRecipients) to internal recipients are anomalous and
      should alert. DMARC enforcement at the receive connector layer (ExternalDelivery reject) is the
      mitigation, but tenant isolation is the root fix (Microsoft-side). Organisations should audit
      whether their tenant mail-flow rules correctly reject incoming messages claiming to be from their
      own domain that arrive via external relay paths.

  - title: "OXLoader: new multi-stage infostealer loader combining clipper, info-stealer, and BOF execution (Elastic Security Labs analysis)"
