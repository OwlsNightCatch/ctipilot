      - url: "https://www.csoonline.com/article/4189132/be-on-the-lookout-for-mistic-a-new-backdoor-used-by-ransomware-broker.html"
        publisher: "CSO Online"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Mistic backdoor KongTuke ransomware access broker June 2026'), URL https://www.securityweek.com/new-mistic-rat-opens-door-to-several-ransomware-families/ → primary: Broadcom/Symantec, URL https://www.broadcom.com/support/security-center/protection-bulletin/backdoor-mistic-new-backdoor-may-be-linked-to-ransomware-access-broker → corroborating: CSO Online, URL https://www.csoonline.com/article/4189132/be-on-the-lookout-for-mistic-a-new-backdoor-used-by-ransomware-broker.html"
    summary: |
      Broadcom Symantec disclosed on June 24, 2026 a newly identified backdoor (Backdoor.Mistic, also
      tracked as MLTBackdoor) deployed since April 2026 by Woodgnat (also known as KongTuke), an
      initial access broker that sells corporate network footholds to ransomware affiliates including
      Qilin, Interlock, Rhysida, Akira, 8Base, and Black Basta. Mistic achieves DLL sideloading via
      a digitally-signed Microsoft Defender binary (MpExtMs.exe) loading a malicious DLL
      (EndpointDlp.dll), making it appear as legitimate Defender activity to EDR. Its primary
      capability is in-memory execution of Beacon Object Files (BOFs) — small C programs compiled and
      loaded entirely in memory within the C2 process, leaving no disk artefacts — enabling arbitrary
      capability extension without deployment of additional binaries. Additional functions include file
      upload/download/manipulation, folder creation, arbitrary code execution, and a kill switch for
      operational stealth. Delivery chains observed include ClickFix, FileFix, and CrashFix social
      engineering lures (fake CAPTCHAs, browser crashes, Microsoft Teams IT-helpdesk impersonation
      directing victims to run attacker-supplied PowerShell).
    ch_eu_nexus: "indirect — Woodgnat/KongTuke targets English-speaking organisations primarily, but ransomware buyers (Black Basta, Akira, Rhysida) are active in EU public and private sectors; the sideloading pattern is relevant to any Windows Defender deployment"
    public_sector_nexus: "indirect — downstream ransomware families (Akira, Rhysida, Black Basta) are active public-sector threatactors; IAB footholds are often resold regardless of sector"
    sector: "education, insurance, IT, professional services"
    cves: []
    actors_campaigns_malware:
