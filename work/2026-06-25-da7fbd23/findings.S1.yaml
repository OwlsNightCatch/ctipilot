    summary: |
      Zafran Security published 'DifyTap' research on June 23, 2026 disclosing cross-tenant data
      isolation vulnerabilities in Dify (an open-source LLM/AI application platform with 1M+ apps
      built on it, including cloud-hosted `cloud.dify.ai`). The vulnerabilities allow an attacker
      tenant to read conversation histories, API keys, uploaded documents, and workflow outputs of
      other tenants by exploiting broken access control in the Dify REST API (tenant isolation logic
      implemented at the application layer rather than the database layer, with predictable or
      enumerable resource identifiers). Zafran confirmed the issue was present in both the cloud-hosted
      instance and self-hosted Dify deployments. Swiss and EU public-sector organisations that
      self-host Dify or integrate with cloud.dify.ai for AI-augmented workflows are directly at risk.
    ch_eu_nexus: "direct — Dify is used by Swiss public-sector digital innovation teams and EU organisations for AI workflow automation; self-hosted instances are common in data-protection-sensitive deployments"
    public_sector_nexus: "direct — AI workflow platforms handling government documents or citizen data create high-impact if tenant isolation is broken"
    sector: "AI/ML platforms, public sector, all sectors using cloud AI workflows"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "DifyTap allows attackers to silently wiretap AI data across tenants on a platform powering 1M+ applications"
        attribution: "Zafran Security"
        source_url: "https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps"
    extended_notes: |
      Technique mapping: T1078 (Valid Accounts — attacker registers free tenant account), T1087.004
      (Account Discovery: Cloud Account — tenant resource enumeration), T1530 (Data from Cloud Storage
      Object — cross-tenant document access). Hardening for self-hosters: update to the patched Dify
      version when available; enforce strict `TENANT_ID` scoping in all API endpoints; implement
      database-layer row security policies rather than application-layer checks. Cloud customers of
      dify.ai should audit what data is stored in Dify workflows and treat it as potentially accessible
      to other tenants until Dify confirms full remediation.

  - title: "Supply-chain worms targeting bioinformatics workflows and MCP (Model Context Protocol) developers via malicious Python packages"
    sources:
      - url: "https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious"
        publisher: "Socket Security"
        date: "2026-06-24"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('supply chain worms bioinformatics MCP Python packages June 2026') → primary: Socket Security, URL https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious"
    summary: |
      Socket Security published on June 24, 2026 an analysis of three novel Python-package worms
      (Mini-Shai-Hulud, Miasma, Hades) targeting bioinformatics pipelines and MCP (Model Context
      Protocol) developers. The packages are self-replicating: once installed in a Python environment,
      they scan for and infect other packages in the same virtualenv or Conda environment, and
      enumerate and modify project dependencies to propagate to downstream consumers via package
      index commits. Bioinformatics workflows (Snakemake, Nextflow, Bioconda environments) are
      specifically targeted, likely because they run with elevated privileges on HPC clusters and
      process genomics/research data. MCP developers are targeted via packages mimicking popular MCP
      SDK tooling — a supply-chain attack on the emerging AI agentic infrastructure ecosystem.
    ch_eu_nexus: "direct — Swiss universities and research institutions (ETH Zürich, EPFL, Swiss Institute of Bioinformatics) run bioinformatics HPC pipelines; MCP is adopted in Swiss AI projects"
    public_sector_nexus: "direct — Swiss academic/research computing and the federal AI strategy adoption of MCP-based agentic systems place this in the public-sector risk surface"
    sector: "research, academic, AI/ML development, bioinformatics, life sciences"
    cves: []
    actors_campaigns_malware:
      - "Mini-Shai-Hulud (worm)"
      - "Miasma (worm)"
      - "Hades (worm)"
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Mini-Shai-Hulud, Miasma, and Hades are self-replicating Python worms targeting bioinformatics workflows and MCP developers via malicious packages"
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious"
    extended_notes: |
      Technique mapping: T1195.001 (Compromise Software Dependencies and Development Tools — malicious
      packages on PyPI), T1105 (Ingress Tool Transfer — worm self-propagation mechanism). Detection:
      (1) Monitor for unexpected package installs or modifications in production environments (Sysmon
      EID 1: pip.exe / conda.exe spawning from non-interactive processes). (2) Audit `setup.py` and
      `pyproject.toml` post-install hooks for embedded exec/subprocess calls. (3) Use software
      composition analysis (SCA) tools with behaviour-based package scanning (Socket, Phylum, GuardDog).
      Hardening: pin all dependencies via lockfiles (requirements.txt with hashes or poetry.lock); use
      private package mirrors (Nexus, Artifactory) with quarantine scanning before promotion; disable
      internet access from HPC compute nodes and researcher workstations during pipeline runs.

