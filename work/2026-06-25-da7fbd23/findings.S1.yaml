      identified multi-stage malware family combining a downloader, crypto-clipper, credential stealer,
      and BOF execution stage. The initial loader stage uses process hollowing (T1055.012) to inject
      into a legitimate Windows process; subsequent stages include a clipper monitoring the clipboard
      for cryptocurrency address patterns (Bitcoin/Ethereum/Solana regex matching) and silently
      substituting attacker-controlled addresses, and an infostealer component harvesting browser
      saved passwords, cookies, and autofill data using direct SQLite reads from Chromium profile
