  - title: "Operation Endgame Phase 2: Amadey and StealC MaaS infrastructure dismantled — 326 servers, 142 domains, 27M credentials, StealC directory-traversal weaponised by law enforcement"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/"
        publisher: "Microsoft Threat Intelligence / DCU"
        date: "2026-06-24"
        role: "primary"
      - url: "https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/"
        publisher: "ESET Research"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/amadey-stealc-malware-operations-disrupted-in-operation-endgame-action/"
        publisher: "BleepingComputer"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/24/operation-endgame-stealc-amadey-malware-disrupted/"
        publisher: "Help Net Security"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog recent feed, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/feed/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/ → corroborating: ESET Research, URL https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/amadey-stealc-malware-operations-disrupted-in-operation-endgame-action/"
    summary: |
      On 24 June 2026, Microsoft's Digital Crimes Unit coordinated a second Operation Endgame action with Europol, Eurojust, and agencies from Canada, Denmark, Germany, the Netherlands, the United Kingdom, and the United States that dismantled the backbone infrastructure of Amadey (MaaS botnet loader) and StealC (MaaS credential infostealer): 326 command-and-control servers and 142 domains were taken offline; approximately 27 million credentials stolen from over 385,000 compromised systems were recovered; and €41 million in cryptocurrency was identified and frozen. ESET contributed 53 identified Amadey clusters and 73 StealC clusters, plus RC4 decryption keys for both families. A notable offensive-support action: IBM X-Force and Proofpoint discovered and exploited a path-traversal / directory-traversal vulnerability in the StealC C2 panel — the panel failed to sanitise forward slashes from infected-machine hostnames submitted to the file-upload endpoint, enabling the researchers to upload a web shell to the StealC server and assist law enforcement access. Both malware families use RC4-encrypted HTTP C2; Amadey operates on a pay-per-rebuild model while StealC offers unlimited builds on a monthly subscription. Defenders in public-sector SIEM/EDR environments should hunt for Amadey delivery chains (phishing, SEO poisoning, ClickFix fake browser updates) and StealC exfiltration patterns (RC4-encrypted HTTP POST to dynamic short-lived C2 domains, targeting Chromium/Gecko credential stores, crypto wallets, desktop clients including WinSCP and Outlook via T1555.003 Credentials from Web Browsers / T1555 Credentials from Password Stores; Amadey distribution via T1190 Exploit Public-Facing Application and T1566.001 Spearphishing Attachment). The SocGholish/FakeUpdates component of this same action was covered in the 2026-06-19 brief.
    ch_eu_nexus: "Global; Amadey is a documented initial-access vector for ransomware affiliates including LockBit; active European victim exposure confirmed in prior Operation Endgame reporting"
    public_sector_nexus: "indirect — Amadey and StealC credential logs sold on dark-web markets including Russian Market feed downstream ransomware and account-takeover chains that have reached EU public-sector organisations"
    sector: "cross-sector (financial, public-sector, technology)"
    cves: []
    actors_campaigns_malware: ["Amadey", "StealC", "SocGholish", "LockBit"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Microsoft's Digital Crimes Unit (DCU) facilitated the takedown, suspension, and blocking of domains that formed the backbone of the StealC and Amadey infrastructure"
        attribution: "Microsoft Threat Intelligence / DCU"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/"
      - quote: "ESET researchers contributed technical analyses, C&C server infrastructure data, encryption keys, and clustering methodologies that identified 53 distinct Amadey clusters and 73 Stealc clusters"
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/"
      - quote: "326 servers and 142 domains while identifying €41 million in cryptocurrency tied to criminal activity. Investigators recovered approximately 27 million credentials stolen from over 385,000 compromised systems"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/amadey-stealc-malware-operations-disrupted-in-operation-endgame-action/"
    extended_notes: |
      Microsoft Threat Intelligence named IBM X-Force and Proofpoint as the researchers who developed the StealC directory-traversal exploit (the panel's file-upload endpoint did not strip forward slashes from submitted filenames, creating a web-shell upload path). The same IBM X-Force blog (https://www.ibm.com/think/x-force/stealc-you-later-proofpoint-x-force-support-operation-endgame-disruptions) confirmed the vulnerability class but was behind IBM's 403 gate for the bridge; the BleepingComputer and ESET articles independently confirm the directory-traversal finding. Defenders who ran the stealc sinkhole checks referenced in ESET's malware-ioc repository (https://github.com/eset/malware-ioc/tree/master/amadey_stealc) should re-run them against the surviving clusters.

  - title: "Cordyceps: systemic GitHub Actions pull_request_target privilege-escalation class exposes 300+ repos at Microsoft, Google, Apache, Cloudflare; GitHub ships actions/checkout v7 mitigation"
    sources:
      - url: "https://novee.security/blog/cordyceps/"
        publisher: "Novee Security"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.securityweek.com/exploitable-ci-cd-vulnerabilities-expose-millions-of-repositories-to-hijacking/"
        publisher: "SecurityWeek"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
        publisher: "GitHub Changelog"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), URL https://thehackernews.com/2026/06/cordyceps-cicd-flaws-expose-300-github.html → primary: Novee Security blog, URL https://novee.security/blog/cordyceps/ → corroborating: SecurityWeek, URL https://www.securityweek.com/exploitable-ci-cd-vulnerabilities-expose-millions-of-repositories-to-hijacking/ → GitHub mitigation: https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
    summary: |
      Novee Security published "Cordyceps" (2026-06-23), a research disclosure documenting a systemic class of GitHub Actions CI/CD privilege-escalation vulnerabilities affecting over 300 fully exploitable repositories out of a 30,000-repository scan (654 flagged). The root pattern: `pull_request_target` (or comment-triggered) workflows pass attacker-controlled PR content — branch names, commit messages, PR body text — into shell command arguments via `${{ github.event.pull_request.head.ref }}` or equivalent context variables without sanitisation, enabling command injection (T1059.004 Unix Shell, T1059.001 PowerShell) that runs with the base repository's elevated permissions, including access to secrets and the `GITHUB_TOKEN`. The attack requires only a free GitHub account: no org membership, no prior trust, no approval bypass — a single PR or comment triggers the chain. Novee confirmed fully exploitable instances at Microsoft (Azure Sentinel), Google (AI Agent Development Kit), Apache (Doris), Cloudflare (Workers SDK), Python Software Foundation (Black), and LLVM; successful exploitation hands the attacker the organisation's GitHub App key (non-expiring on Azure Sentinel), full GCP repository authority (Google ADK), or the ability to publish attacker-controlled npm/PyPI packages to trusted registries. Novee disclosed to affected vendors prior to publication, and GitHub shipped `actions/checkout` v7 (2026-06-18) which by default refuses to check out fork-PR head commits in `pull_request_target` workflows; full backport to all pinned major versions enforced 2026-07-16. Defenders running self-managed GitHub Enterprise Server or organisations with pinned workflow actions at older versions are not yet protected — audit `.github/workflows/*.yml` for `pull_request_target` with any `${{ github.event.pull_request.*}}` context usage in shell steps, `run:` blocks, or `env:` fields.
    ch_eu_nexus: "Global; EU/Swiss public-sector organisations with GitHub-hosted infrastructure or OSS dependency on major upstream projects may inherit backdoored artifacts from any successfully exploited repository in the dependency chain"
    public_sector_nexus: "indirect — open-source upstream dependencies (Python, Apache, cloud SDKs) used by Swiss/EU government software"
    sector: "technology, software supply chain"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A scan of about 30,000 high-impact repositories revealed more than 300 to be fully exploitable, enabling attacker-controlled code execution, credential theft, and supply chain compromise"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/exploitable-ci-cd-vulnerabilities-expose-millions-of-repositories-to-hijacking/"
      - quote: "actions/checkout v7 now includes built-in protections against 'pwn request' vulnerabilities in workflows using the pull_request_target event. The update automatically refuses to fetch code from fork pull requests when certain unsafe patterns are detected"
        attribution: "GitHub Changelog"
        source_url: "https://github.blog/changelog/2026-06-18-safer-pull_request_target-defaults-for-github-actions-checkout/"
    extended_notes: |
      The GitHub Security Lab previously documented the pwn-request class at https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/ — Cordyceps is a structured empirical scan showing this class remains widely unmitigated in high-value repositories even after years of community awareness. The backport enforcement date (2026-07-16) gives organisations a narrow window to test and opt out if their legitimate workflows require the old behaviour via the `allow-unsafe-pr-checkout` input flag.

  - title: "DifyTap: four cross-tenant vulnerabilities in Dify (CVE-2026-41947 CVSS 9.1, CVE-2026-41948 CVSS 9.4) enable AI-chat wiretapping and Plugin Daemon internal API access — 1M+ apps affected"
    sources:
      - url: "https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps"
        publisher: "Zafran Security"
        date: "2026-06-22"
        role: "primary"
      - url: "https://www.securityweek.com/data-exposure-flaws-threaten-dify-ai-platform-powering-over-1-million-apps/"
        publisher: "SecurityWeek"
        date: "2026-06-22"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (feeds.feedburner.com/TheHackersNews), URL https://thehackernews.com/2026/06/researchers-detail-difytap-flaws-in.html → primary: Zafran Security, URL https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps → corroborating: SecurityWeek, URL https://www.securityweek.com/data-exposure-flaws-threaten-dify-ai-platform-powering-over-1-million-apps/"
    summary: |
      Zafran Security disclosed four vulnerabilities (DifyTap, 2026-06-22) in Dify — the open-source LLMOps platform (140K GitHub stars, 1M+ downstream applications, enterprise users include Volvo, Maersk, Panasonic, Thermo Fisher) — affecting all versions before 1.14.2. CVE-2026-41947 (CVSS 9.1, authorization bypass): any authenticated Dify editor can call `/console/api/workspaces/current/plugin/icon` to manipulate trace-configuration endpoints for any tenant's application without tenant-ownership validation, enabling the attacker to redirect full AI conversation histories (prompts, model responses, session metadata) to an attacker-controlled LLM tracing provider (e.g. Opik, LangSmith) as a persistent exfiltration channel — mapped to T1557 Adversary-in-the-Middle / T1119 Automated Collection. CVE-2026-41948 (CVSS 9.4, path traversal): the `/console/api/workspaces/current/plugin/*` proxy endpoint fails to sanitise the `filename` URL parameter, allowing an authenticated attacker to inject path segments that reach the Plugin Daemon's internal REST API — including `/debug/pprof` — without authentication (T1190 Exploit Public-Facing Application, T1083 File and Directory Discovery). CVE-2026-41949 (CVSS 7.5 / 5.9): the `/console/files/<FILE_ID>/preview` endpoint performs no permission checks on the UUID, allowing any authenticated user to read up to 3,000 characters from documents uploaded by any tenant. CVE-2026-41950 (CVSS 6.5): attachment-handling logic allows clients to reference other users' file UUIDs, leaking file contents within a tenant. All four are fixed in Dify 1.14.2 (CVE-2026-41948 fix merged, pending next release); on-premises self-hosted instances require a manual upgrade. Defenders running Dify in Swiss/EU public-sector AI workflows or as an internal LLM-orchestration hub should treat any unpatched self-hosted Dify instance as a sensitive-data exfiltration risk and restrict editor-role access to trusted users pending upgrade.
    ch_eu_nexus: "Global; Dify is increasingly adopted in EU public-sector and research organisations as an on-premises LLM orchestration layer — any self-hosted deployment before 1.14.2 is exposed"
    public_sector_nexus: "indirect — Dify is used in internal AI deployments; exposure depends on how many external/untrusted users have editor accounts"
    sector: "technology, public-sector (AI infrastructure)"
    cves: [CVE-2026-41947, CVE-2026-41948, CVE-2026-41949, CVE-2026-41950]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-41947 exploits the /console/api/workspaces/current/plugin/icon endpoint to access tracing configuration endpoints without tenant validation, enabling attackers to 'configure their own tracing for any application' and create persistent data exfiltration channels"
        attribution: "Zafran Security"
        source_url: "https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps"
      - quote: "CVE-2026-41948 (CVSS 9.4) abuses the Plugin Daemon internal API through path traversal in both GET requests (via filename parameter) and POST requests to access /debug/pprof and other internal endpoints without authentication"
        attribution: "Zafran Security"
        source_url: "https://www.zafran.io/resources/difytap-zafran-discovers-how-attackers-can-silently-wiretap-ai-data-across-tenants-on-a-platform-powering-1m-apps"
    extended_notes: |
      Zafran notes Dify also ships bundled PDFium 126.0.6462.0, which is vulnerable to CVE-2024-5846 (use-after-free). The 1.14.2 release fixes the three tenant-isolation CVEs; the Plugin Daemon path traversal (CVE-2026-41948) has a merged fix expected in the next release. Detection: audit Dify access logs for cross-tenant requests to /console/files/<UUID>/preview (look for UUIDs in requests from users who did not upload the file); alert on trace-configuration changes to applications owned by a different workspace.

  - title: "Shai-Hulud / Miasma / Hades PyPI wave: 23 new malicious packages target bioinformatics and MCP developers, with anti-AI-analysis header designed to defeat LLM-based scanners"
    sources:
      - url: "https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious"
        publisher: "Socket Security"
        date: "2026-06-08"
        role: "primary"
      - url: "https://www.securityweek.com/over-100-npm-pypi-packages-hit-in-new-shai-hulud-supply-chain-attacks/"
        publisher: "SecurityWeek"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: Schneier blog atom feed (https://www.schneier.com/feed/atom/), URL https://www.schneier.com/blog/archives/2026/06/embedding-forbidden-text-in-spyware-to-discourage-ai-analysis-2.html → primary: Socket Security blog, URL https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious → corroborating: SecurityWeek, URL https://www.securityweek.com/over-100-npm-pypi-packages-hit-in-new-shai-hulud-supply-chain-attacks/"
    summary: |
      Socket Threat Research documented (2026-06-08) 23 new malicious PyPI package versions in the ongoing Shai-Hulud / Miasma / Hades supply-chain worm campaign (TeamPCP), bringing the total past 100 malicious artifacts across npm and PyPI. The new "Hades" wave uses three delivery mechanisms to achieve pre-import execution: (1) `.pth` Python startup hooks bundling the JavaScript stealer payload, which execute before any user import at interpreter start time; (2) trojanised native `.abi3.so` C-extension wheels that run stealer code at `import` time; (3) a `langchain-core-mcp` loader that walks `sys.path` searching for a separately staged payload. The Hades `_index.js` stealer payload embeds a fake system-instruction block comment at the top of the file containing policy-triggering content about biological and nuclear weapons — a deliberate anti-AI-scanner technique (described by Socket as "prompt injection against LLM-based analysis pipelines") that causes refusal, confusion, or premature benign classification in LLM-assisted scanners that don't isolate untrusted file content as a separate context (T1027 Obfuscated Files or Information; T1562 Impair Defenses). After the comment, a `try{eval(...)}` wrapper decodes a ROT-style-obfuscated character-code array containing the actual stealer. Stolen targets include GitHub tokens, cloud credentials (AWS, GCP, Azure), Kubernetes service-account tokens, SSH private keys, CI/CD secrets, Docker configuration, shell history, and MCP/AI developer tool configuration files. The Miasma variant propagates by cloning and re-poisoning packages accessible to the compromised developer's configured registries (T1195.001 Compromise Software Dependencies and Development Tools). Defenders: block `.pth` auto-execution in CI/CD Python environments where feasible; ensure LLM-assisted malware scanners treat file content as untrusted data in a separate context window; run npm/PyPI package audits for langchain-core-mcp and the bioinformatics package names listed in the Socket supply-chain-attacks index (https://socket.dev/supply-chain-attacks/miasma-mini-shai-hulud-supply-chain-attack).
    ch_eu_nexus: "Global; bioinformatics and MCP packages targeted are commonly used in EU research institutions and clinical genomics pipelines; Swiss life-sciences sector exposure"
    public_sector_nexus: "indirect — academic/research institutes in CH/EU using Python bioinformatics tooling"
    sector: "technology, research, healthcare (genomics/bioinformatics)"
    cves: []
    actors_campaigns_malware: ["Shai-Hulud", "Miasma", "Hades", "TeamPCP"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The _index.js payload begins with a large JavaScript block comment containing fake system instructions and policy-triggering content. Because it is inside a comment, it does not affect JavaScript execution. The runtime skips it. The real malware begins after the comment with a try{eval(...)} wrapper around a large character-code array and a ROT-style substitution function."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/mini-shai-hulud-miasma-and-hades-worms-target-bioinformatics-and-mcp-developers-via-malicious"
      - quote: "Miasma employs a weaponized binding.gyp file to execute during installation, while Hades uses *-setup.pth files for Python startup execution. Both variants function as 'multi-stage droppers' that harvest credentials and secrets from systems and cloud services, then self-propagate"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/over-100-npm-pypi-packages-hit-in-new-shai-hulud-supply-chain-attacks/"
    extended_notes: |
      The Socket article is from June 8. Schneier's post referencing it appeared June 24 (a follow-up post). The SecurityWeek corroborating article is June 9. Both fall outside the strict 36h window. However, the Schneier blog surfaced a NEW June 24 post (https://www.schneier.com/blog/archives/2026/06/embedding-forbidden-text-in-spyware-to-discourage-ai-analysis-2.html) reporting on the anti-AI-analysis technique as a fresh insight worthy of SOC awareness. The socket.dev primary is from June 8 — flagging this as BORDERLINE on recency window. The anti-AI-scanner technique is new and materially advances understanding. Including with a note that the primary source is from June 8 (outside strict 36h window but Schneier commentary in-window adds fresh signal). Main agent should use its editorial judgment on inclusion.
      Note: recency_flag: PRIMARY_SOURCE_OUTSIDE_36H_WINDOW (socket.dev June 8; Schneier blog commentary June 24 is in-window; recommend treating as background context or UPDATE shape rather than new item)

  - title: "OXLOADER / CastleStealer: .reloc-section shellcode staging + five anti-VM checks evade static analysis; Russian-speaking actor uses malicious Google Ads impersonating Node.js"
    sources:
      - url: "https://www.elastic.co/security-labs/oxloader-malware-loader-infostealer"
        publisher: "Elastic Security Labs"
        date: "2026-06-19"
        role: "primary"
      - url: "https://www.huntress.com/blog/clickfix-castleloader-backgroundfix"
        publisher: "Huntress"
        date: "2026-04-30"
        role: "corroborating"
    discovery_trace: "first seen at: Elastic Security Labs RSS feed (https://www.elastic.co/security-labs/rss/feed.xml), item published 2026-06-19 → primary: Elastic Security Labs, URL https://www.elastic.co/security-labs/oxloader-malware-loader-infostealer → corroborating: Huntress blog (earlier CastleStealer analysis), URL https://www.huntress.com/blog/clickfix-castleloader-backgroundfix"
    summary: |
      Elastic Security Labs published a detailed reverse-engineering analysis of OXLOADER (2026-06-19), a new Windows malware loader distributing the CastleStealer infostealer via malicious Google Ads impersonating the Node.js runtime installer. The loader's most distinctive static-evasion technique: the `.reloc` section of the PE — normally used for base-relocation entries — is repurposed to stage and execute shellcode, making signature detection against the file header difficult because the section looks structurally legitimate. OXLOADER runs five sequential anti-VM checks before executing: CPU-core count (≥3 required), physical RAM (≥3 GB required), display refresh rate (>20 Hz required), CIS-region IP exclusion, and Russian-language system exclusion — all consistent with a Russian-speaking, financially motivated threat actor. The delivery chain uses malvertising (T1583.003 Compromise Infrastructure: Malvertising) to redirect victims from a Google Ads result to a malicious landing page impersonating a Node.js deployment platform, which serves a Storj-hosted batch script downloading OXLOADER via PowerShell (`T1059.001`), triggering a UAC elevation prompt (T1548.002 Bypass User Account Control). OXLOADER loads CastleStealer in-memory as a .NET assembly using DonutLoader shellcode (T1620 Reflective Code Loading), bypassing file-based AV scanning. CastleStealer (documented separately by Huntress in April 2026 via BackgroundFix ClickFix lure) steals Chromium/Gecko browser credentials, cryptocurrency wallet data, and Telegram sessions via XOR-decrypted PE loading and API hashing. Detection: `Sysmon EID 1` parent-image filter for `powershell.exe` spawned from `cmd.exe` or batch files from unusual directories; `EID 10` for VirtualAlloc calls from non-standard DLL regions; EDR: unsigned DLL loaded from memory with `VirtualAllocEx` origin; YARA rules published by Elastic for both OXLOADER and CastleStealer at `github.com/elastic/protections-artifacts`.
    ch_eu_nexus: "Global; malvertising campaigns running via Google Ads are geographically broad; CIS exclusion means European targets are in scope; affects any Windows endpoint"
    public_sector_nexus: "indirect — developer workstations and IT staff searching for Node.js"
    sector: "technology, financial"
    cves: []
    actors_campaigns_malware: ["OXLOADER", "CastleStealer", "CastleLoader"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "OXLOADER runs five separate checks to confirm it is not running inside a sandbox or virtual machine, including checking for at least three CPU cores, at least 3 GB of physical RAM, a display refresh rate above 20 Hz, and verifying the system is not located in a CIS region"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/oxloader-malware-loader-infostealer"
      - quote: "A distinctive technique abuses the .reloc section — normally containing base relocation entries — to house and stage malicious shellcode instead"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/oxloader-malware-loader-infostealer"
    extended_notes: |
      Elastic notes the Google Ads campaign's last active date was April 23, 2026, and the site is now offline. Huntress documented CastleStealer in the BackgroundFix/ClickFix ClickFix variant on April 30, 2026 — the OXLOADER analysis confirms the CASTLESTEALER payload is the same family delivered via a different lure. The primary Elastic article (June 19) is within the 36h window.

