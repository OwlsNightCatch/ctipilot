items:
  - title: "ESET uncovers 11 forgotten pre-0.9 UEFI shim bootloaders that bypass Secure Boot via a signature-length validation mismatch (CVE-2026-8863, CVE-2026-10797)"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/", publisher: "ESET Research (WeLiveSecurity)", date: "2026-07-14", role: "primary" }
      - { url: "https://kb.cert.org/vuls/id/616257", publisher: "CERT/CC — VU#616257", date: "2026-06-17", role: "corroborating" }
    discovery_trace: "first seen at: WebFetch of ESET WeLiveSecurity listing, URL https://www.welivesecurity.com/en/ → primary: ESET Research, URL https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/ → corroboration: CERT/CC VU#616257, URL https://kb.cert.org/vuls/id/616257 (originally released 2026-06-09, last revised 2026-06-17, referencing ESET's press release ahead of the full technical write-up)"
    summary: |
      ESET Research published a full technical dissection (2026-07-14) of 11 Microsoft-signed UEFI shim
      bootloaders (all at shim version 0.9 or below) that undermine UEFI Secure Boot on any machine trusting
      the "Microsoft Corporation UEFI CA 2011" third-party UEFI certificate — regardless of installed OS.
      The core bug (CVE-2026-8863, CVE-2026-10797) is a signature-length validation mismatch: Authenticode-signed
      PE binaries record signature length in two independent locations, and the shim's revocation-check routine
      trusts the value from the signature header while the separate signature-verification routine trusts the
      value from the PE header — the divergence lets an attacker craft a bootloader whose apparent signature
      length differs between the two checks, evading the revocation (MokListX/DBX) check while still passing
      verification. A second, independent weakness in the same forgotten binaries: pre-0.9 shims never enforce
      the MOK deny-list (MokListX), so an attacker can substitute an older, still-trusted shim to load a binary
      that was explicitly revoked; a third affects pre-15.3 shims which never implemented SBAT (Secure Boot
      Advanced Targeting), reopening old GRUB 2 bugs like CVE-2015-5281 that SBAT was built to close.
      No memory-corruption exploitation primitive is required — ESET states an attacker needs only to copy a
      vulnerable, unrevoked shim plus a compatible second-stage bootloader onto the EFI System Partition, with
      no admin privileges or physical access required once the files are staged; this is explicitly a
      bring-your-own-vulnerable-shim technique (analogous to BYOVD but for the pre-OS boot chain). Affected
      vendors named in CERT/CC's coordinated disclosure include Red Hat/CentOS, Oracle Linux, openSUSE, ROSA
      Linux, Baramundi Management Suite, WhiteCanyon/Blancco WipeDrive, PC-Doctor Service Center, Spyrus
      WTGCreator, and Finland's Abitti exam-kiosk OS — a long tail of PC-diagnostic, wipe, and Linux-distro
      shim forks that forked an old shim and never rebased onto upstream fixes. Microsoft revoked all 11
      binaries via its DBX (Forbidden Signature Database) update on the June 9, 2026 Patch Tuesday; ESET
      reports no observed in-the-wild exploitation, framing this as a supply-chain hygiene problem (forgotten,
      still-trusted legacy binaries) rather than an active campaign. For defenders, this converts any endpoint
      that has not applied the June DBX update (and has not also applied the companion DB/KEK update sequence)
      into a persistent Secure-Boot-bypass exposure regardless of the OS actually installed on it.
    region_nexus: "global; affects any UEFI-based Windows or Linux endpoint trusting the Microsoft third-party UEFI CA — directly relevant to Swiss/EU public-sector and CI device fleets running Linux distros (RHEL, openSUSE) or PC-diagnostic/wipe tooling that forked an old shim"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, healthcare, finance, telco, cross-sector (any UEFI Windows/Linux fleet)"
    cves: [CVE-2026-8863, CVE-2026-10797]
    techniques: [T1542.003, T1553.006]
    affected_products: ["Shim (UEFI bootloader, versions ≤0.9)", "Red Hat Enterprise Linux / CentOS 7.2", "Oracle Linux 7.2", "openSUSE Shim loader 0.9/2.1", "ROSA Linux R9/R10", "Baramundi Management Suite ≤2024R1", "WhiteCanyon/Blancco WipeDrive 8.0.0–8.1.3", "PC-Doctor Service Center 15/16", "Spyrus WTGCreator ≤0.7", "Abitti 1.0"]
