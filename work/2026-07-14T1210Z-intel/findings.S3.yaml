    evidence:
      - quote: "The revocation check and the signature verification functions diverged on which size value they should trust. The revocation check used the value from the signature header, while the signature verification function used the value from the PE header."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
      - quote: "An attacker needs no complicated exploitation primitives—only a copy of an old, still-trusted, but unrevoked shim binary and a basic understanding of how UEFI shims work."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
      - quote: "An attacker could exploit these vulnerable shim bootloaders using a Bring Your Own Vulnerable Driver (BYOVD)-style technique to execute arbitrary code during the early boot phase, prior to operating system initialization, thereby bypassing Secure Boot protections."
        attribution: "CERT/CC"
        source_url: "https://kb.cert.org/vuls/id/616257"
      - quote: "The vulnerable UEFI applications were revoked on Microsoft's June 9th, 2026 Patch Tuesday."
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/"
    extended_notes: |
      Detection/hunt angle: this is a pre-OS-boot technique class, so classic endpoint telemetry (process
      creation, EDR hooks) cannot see the exploitation step itself — the actionable control is inventory and
      firmware-state verification, not runtime detection. Concretely: (1) confirm the June 9 2026 DBX
      (Forbidden Signature Database) update has been applied fleet-wide — ESET/CERT/CC both note DB
      (Authorized Signature Database) updates should be applied first, then DBX, to avoid bricking dual-boot
      or recovery-partition machines; (2) audit the EFI System Partition of Linux and dual-boot fleets for
      forked/vendored shim binaries at version ≤0.9 or without SBAT support — the open-source
      uefi-dbx-audit tool (linked from CERT/CC's advisory) and Microsoft's own secureboot_objects DBX manifest
      are the concrete artifacts to diff against; (3) treat any PC-diagnostic, disk-wipe, or exam-kiosk boot
      media in the environment as a candidate carrier for a forked shim even on machines that otherwise run a
      fully patched OS, since the vulnerable binary travels with the boot media, not the installed OS.
      Benign-lookalike / triage note: legitimate dual-boot recovery media and vendor diagnostic USB sticks are
      exactly the artifact class this bug lives in, so a hunt for "old shim present" will have real hits that
      are legitimate-but-stale tooling, not evidence of compromise — the discriminating factor is whether the
      DBX revocation has actually been enrolled in that device's firmware (a revoked-but-present shim is inert;
      an unrevoked one is the exposure).

  - title: "Cisco Talos maps the full Python package supply-chain attack surface — install-time build-hook abuse, .pth/site-hook injection, and entry-point hijacking across PyPI/VCS/custom-index distribution"
    sources:
      - { url: "https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/", publisher: "Cisco Talos", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: WebFetch of Cisco Talos blog listing, URL https://blog.talosintelligence.com/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/"
    summary: |
      Cisco Talos published (2026-07-14) a defender-oriented technique taxonomy covering the entire Python
      package supply-chain attack surface, from hosting (PyPI, direct VCS URLs, custom package indexes) through
      distribution format (source distributions carrying setup.py/pyproject.toml build hooks vs. pre-built
      wheels) to installation-time execution. Talos catalogs the concrete mechanisms adversaries use to get
      code running with zero victim interaction beyond `pip install`: (1) legacy `distutils`/`setuptools`
      Command-class overrides that execute inside setup.py's install/build_ext commands, which run automatically
      during installation; (2) `.pth` file injection into `site-packages`, which Python's `site` module
      auto-executes any line starting with `import` for on every interpreter start — a durable, install-time-only
      persistence primitive requiring no further compromise of the package itself; (3) `PYTHONPATH`/site-hook
      manipulation and `sitecustomize.py`/`usercustomize.py` abuse; (4) `__init__.py` import-time execution and
      `__main__.py` abuse when a package is invoked as a module; (5) entry-point hijacking, where a malicious
      package registers a console-script entry point matching a legitimate, frequently-invoked binary name to
      intercept invocations. Talos frames this against named 2025-2026 incidents it treats as case studies —
      the TeamPCP campaign's repeated compromise of trusted PyPI/npm packages and the "lightning" PyPI package
      compromise credential-stealer — without re-disclosing new details on those specific incidents. Talos states
      payload execution can occur within minutes of install and exfiltration within an hour. Defensive guidance
      is concrete and tool-specific: use `pip-audit` for known-malicious-package scanning, pin exact versions
      with lockfiles (`uv.lock`, `poetry.lock`, `Pipfile.lock`) that include content hashes so a compromised
      re-publish under an existing version number is rejected at install time, apply a deliberate "cooldown"
      window before adopting newly-published package versions (mirroring the `uv run --exclude-newer` flag),
      build in isolated/ephemeral environments, and generate SBOMs (CycloneDX) to make a post-hoc compromise
      audit tractable.
    region_nexus: "global; directly relevant to any Swiss/EU public-sector or CI organisation running Python-based tooling, data-science/ML pipelines, or CI/CD build agents that resolve PyPI dependencies"
    primary_sector_nexus: "indirect"
    sector: "cross-sector (software supply chain / CI-CD / developer tooling)"
    cves: []
    techniques: [T1195.001, T1059.006]
    affected_products: ["PyPI package ecosystem", "setuptools", "Hatchling", "Poetry", "uv", "pip", "pip-audit"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Payload execution can occur within minutes of installing the malicious package, and exfiltration can be achieved within an hour, depending on adversarial goals."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/"
      - quote: "setup.py executes automatically during installation or download, allowing for the execution of arbitrary code."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/"
      - quote: "Use lock files such as uv.lock, poetry.lock, or Pipfile.lock to pin exact versions; always include hashes to ensure package content matches vetted versions."
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/the-serpents-tongue-luring-the-python-out-of-its-den/"
    extended_notes: |
      Detection/hunt angle: the durable, high-value pivot from this taxonomy is `.pth` file creation/modification
      under any `site-packages` directory outside of a package manager's own install transaction — file-integrity
      or EDR file-creation telemetry scoped to `*.pth` under Python `site-packages` paths is a vendor-neutral,
      low-noise hunt Talos's write-up makes concrete (most legitimate `.pth` files are created once at
      interpreter/venv creation, not per-package). A second concrete hook: entry-point console-scripts installed
      under a name matching an already-present, frequently-invoked binary (shadowing) is enumerable via a diff
      of `dist-info/entry_points.txt` across a fleet's Python environments. Triage note: setup.py/pyproject.toml
      build-time execution is universal and benign for the overwhelming majority of legitimate packages that
      compile native extensions — the discriminator Talos surfaces is *build hooks reaching out to the network
      or writing outside the build directory*, not build-hook execution itself.
      Single-source note: this is Cisco Talos's own primary technical analysis; no second independent source
      was located publishing the same synthesis in-window. Talos is a Tier-1 (Admiralty B) research lab; flagged
      SINGLE-SOURCE-OTHER per the two-source-by-default rule rather than upgraded to MULTI-SOURCE.

