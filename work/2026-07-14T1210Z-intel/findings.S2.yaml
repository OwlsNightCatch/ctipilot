    summary: |
      Republik's 2026-07-09 investigative report — confirmed on request by the Swiss Federal
      Chancellery (Bundeskanzlei) and independently corroborated by heise online and
      SwissCybersecurity.net through 2026-07-13 — details that Kommando Cyber (the Swiss
      Armed Forces' cyber command) and its sub-unit CEA (Dienst für Cyber- und
      elektromagnetische Aktionen) are migrating all employee workstations off Microsoft 365
      onto OpenDesk, an open-source office/collaboration suite (word processing, email,
      calendar, video conferencing) built by Germany's Zentrum für Digitale Souveränität
      (Zendis), with full rollout targeted for October 2026. Kommando Cyber chief Simon
      Müller cites two drivers: (1) Microsoft has moved to force all customer data — email,
      documents, calendar entries, video conferences — through its own cloud rather than
      administration-owned data centres, which for an army with strict confidentiality/
      availability/integrity requirements creates unacceptable exposure to the US CLOUD Act
      and a feared "call home" channel to US authorities; (2) vendor licensing-cost
      escalation risk. The legal lever is Art. 9 of the Swiss federal "Bundesgesetz über den
      Einsatz elektronischer Mittel zur Erfüllung von Behördenaufgaben" (EMBAG, in force
      since 2024-01-01), which mandates publication of source code for federal IT projects
      (standard COTS software such as Microsoft Office is exempted, and Kommando Cyber is
      voluntarily going beyond the exemption it could claim for security-classified
      software). Parliament allocated CHF 10 million in December 2025 specifically to fund
      Armed Forces contribution to European open-source alternatives including OpenDesk; the
      Federal Chancellery (responsible for the Confederation's wider digital transformation
      and itself running M365 under a multi-year Microsoft contract) is separately running
      OpenDesk pilot projects and a feasibility study on a full Confederation-wide M365 exit,
      originally due end of June 2026 but deferred by the Federal Council to mid-August 2026.
      The City of Zurich's own prior technical assessment of OpenDesk (referenced in the
      Republik piece) found it not yet ready for a full municipal switch: browser-only client
      (no desktop apps), no unified-communications/telephony equivalent to Teams, no
      integrated anti-malware equivalent, and unquantified migration cost — gaps Kommando
      Cyber is better placed to absorb because its classified data and applications already
      sit exclusively in its own data centres (no cloud dependency to unwind) and its
      personnel have the in-house IT skill to operate and patch the stack directly. Broader
      context cited: Austria's Bundesheer is moving to LibreOffice, Germany's Bundeswehr IT
      house (BWI) has signed a framework agreement with Zendis for OpenDesk, the
      International Criminal Court is evaluating OpenDesk after the Trump administration's
      2025 deactivation of ICC judges' US-platform accounts under sanctions, and France is
      moving its administration toward Linux — all citing the same CLOUD Act /
      platform-kill-switch risk model. Separately, Kommando Cyber/CEA has begun publishing
      its own tooling as open source (the Loom document search/analysis engine, on GitLab
      under "Swiss Defense Forces") and submitting upstream fixes including cryptography
      improvements.
