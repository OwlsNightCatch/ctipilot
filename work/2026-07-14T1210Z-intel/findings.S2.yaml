      2026-07-13). Treated as new signal per the "in-window delta via fresh syndication" allowance
      rather than dropped as stale — flagging the timeline transparently in case the main agent's
      dedup/recency judgement differs.

      Detection/hardening framing for a SOC audience: this is not an attack — it's a supply-chain/
      vendor-dependency risk-management decision on the reader's own doorstep (a peer Swiss federal
      cyber unit's own cloud-exposure calculus). Relevant angles for other Swiss/EU public-sector
      SOCs evaluating the same M365-vs-cloud-sovereignty question: (1) the "call home" concern maps
      to the broader class of SaaS-vendor telemetry/administrative-access channels a defender cannot
      fully audit in a proprietary stack; (2) EMBAG Art. 9's source-code-transparency mandate is a
      concrete Swiss legal lever other federal/cantonal bodies can cite when evaluating vendor
      lock-in; (3) the City of Zurich's OpenDesk gap analysis (browser-only client, no AV
      equivalent, no telephony equivalent) is a useful checklist for any Swiss public-sector body
      evaluating the same migration.
