  - title: "Swiss federal government came within a ministerial veto of outsourcing part of the E-ID trust infrastructure to AWS; Justice Minister Beat Jans blocked it in February 2026 on CLOUD Act / digital-sovereignty grounds"
    sources:
      - { url: "https://www.republik.ch/2026/09/01/e-id-bundesrat-beat-jans-stoppt-auftrag-an-amazon", publisher: "Republik", date: "2026-09-01", role: primary }
      - { url: "https://www.heise.de/news/Schweizer-E-ID-Justizminister-Jans-verhindert-geheimen-Amazon-Deal-11437433.html", publisher: "heise online (Stefan Krempl)", date: "2026-09-01", role: corroborating }
      - { url: "https://www.inside-it.ch/bund-zog-aws-cloud-fuer-e-id-in-betracht-20260901", publisher: "Inside IT Switzerland", date: "2026-09-01", role: corroborating }
    discovery_trace: "first seen at: inside-it-ch RSS feed, URL https://www.inside-it.ch/rss.xml → item https://www.inside-it.ch/bund-zog-aws-cloud-fuer-e-id-in-betracht-20260901 → pivot: WebSearch (\"Beat Jans Amazon AWS E-ID Vertrauensinfrastruktur Veto Republik\") → primary: Republik, URL https://www.republik.ch/2026/09/01/e-id-bundesrat-beat-jans-stoppt-auftrag-an-amazon → corroborating: heise online, URL https://www.heise.de/news/Schweizer-E-ID-Justizminister-Jans-verhindert-geheimen-Amazon-Deal-11437433.html"
    summary: |
      Investigative reporting by Republik (2026-09-01), independently corroborated same-day by heise online and
      Inside IT Switzerland, reveals that Switzerland's Federal Office of Justice (BJ/EJPD) and the Federal Office
      of Informatics and Telecommunications (BIT) planned in spring 2026 to award Amazon Web Services a contract
      covering core components of the Swiss E-ID's "Vertrauensinfrastruktur" (trust infrastructure): the Basisregister
      (which tracks an E-ID's status in anonymised form) and the publicly-queryable Vertrauensregister listing
      authorised issuers and verification services. AWS was reportedly favoured chiefly for its data-centre
      availability guarantees, needed because the Confederation's own planned state-cloud infrastructure was running
      late; officials treated an existing AWS framework contract as a pragmatic stopgap. EJPD head Federal Councillor
      Beat Jans personally vetoed the award in mid-February 2026, on the grounds that handing critical
      identity-trust infrastructure to a US hyperscaler subject to the US CLOUD Act would directly contradict the
      Federal Council's own digital-sovereignty objectives. Republik's review of the Confederation's existing AWS
      framework agreements (relayed by heise) found they are standardised templates rather than terms negotiated for
      state use: Amazon reserves the unilateral right to change the technical basis of the service, liability for
      outages is minimal, and on contract termination the administration would have only a 90-day window to migrate
      all data off the platform — untenable for infrastructure of this criticality. The E-ID's public launch is
      already delayed from end-2026 to H1 2027 for unrelated reasons (EUDI-wallet interoperability, offline
      onboarding for deepfake resistance, open data-protection questions on insurance-number lookups).
    region_nexus: "Switzerland (home region) — direct: federal digital-identity trust infrastructure"
