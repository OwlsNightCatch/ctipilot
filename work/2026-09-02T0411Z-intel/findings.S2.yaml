  - title: "Bavaria's 2026 cybersecurity situation report: ransomware against state/business targets up 18%, 105 DDoS attacks on state websites, and 48% of German critical-infrastructure operators still have no attack-detection system in place"
    sources:
      - { url: "https://www.heise.de/news/Bayerische-Regierung-Mehr-Cyberangriffe-aus-Russland-China-Nordkorea-11436023.html", publisher: "heise online / dpa", date: "2026-09-01", role: primary }
      - { url: "https://www.ad-hoc-news.de/wissenschaft/bayern-cybersicherheit-ransomware-angriffe-um-18-percent-gestiegen/70034597", publisher: "ad-hoc-news.de", date: "2026-09-01", role: corroborating }
      - { url: "https://www.ad-hoc-news.de/wissenschaft/cyberangriffe-bayern-registriert-49-468-faelle-geheimdienste-im-fokus/70032912", publisher: "ad-hoc-news.de", date: "2026-08-31", role: corroborating }
    discovery_trace: "first seen at: heise-sec RSS feed, URL https://www.heise.de/security/feed.xml → item https://www.heise.de/news/Bayerische-Regierung-Mehr-Cyberangriffe-aus-Russland-China-Nordkorea-11436023.html → pivot: WebSearch (\"Bayern Lagebericht Cybersicherheit 2026 Herrmann Cyberangriffe Behörden\") → corroborating: ad-hoc-news.de (two articles), URLs https://www.ad-hoc-news.de/wissenschaft/bayern-cybersicherheit-ransomware-angriffe-um-18-percent-gestiegen/70034597 and https://www.ad-hoc-news.de/wissenschaft/cyberangriffe-bayern-registriert-49-468-faelle-geheimdienste-im-fokus/70032912"
    summary: |
      ANNUAL REPORT — Bericht zur Cybersicherheit in Bayern 2026. Bavaria's Interior, Finance and Justice ministers
      (Herrmann, Füracker, Eisenreich) presented the state's 2026 cybersecurity situation report on 2026-09-01,
      naming Russia, China and North Korea as the clear principal actors behind politically-motivated attacks on
      Bavarian state authorities, critical infrastructure and businesses, and stating the hybrid threat from
      espionage, sabotage and disinformation combined with cyberattack has reached "a never-before-seen level."
      Bavarian police recorded 49,468 cybercrime cases in 2025 (+1.7% YoY); the state IT-security office (LSI)
      processed roughly 6,000 security-relevant incidents affecting state authorities, municipalities or critical
      infrastructure (+10% YoY); ransomware cases specifically rose 18% to 230 (from 195 in 2024); and 105 DDoS
      attacks hit Bavarian state websites in the period. 72% of identified attackers operate from abroad. The
      ministers point to growing attacker use of AI to improve malware/phishing effectiveness and evasion, and to a
      state-run defensive countermeasure of analysing roughly 2.7 billion data records per day for early pattern
      detection. Despite Germany's federal KRITIS-Dachgesetz (critical-infrastructure baseline law) in force since
      March 2026, 48% of German critical-infrastructure operators still have no attack-detection system deployed at
      all — a concrete, checkable gap for any KRITIS-adjacent or KRITIS-comparable Swiss operator to self-assess
      against. As background context (not itself new), the report cites an April 2026 incident in which the
      Russian GRU-linked actor APT28 compromised TP-Link routers. Separately, Saxony is standing up a cross-agency
      cyber-defence unit (state criminal police + domestic-intelligence service + a dedicated cybercrime unit)
      intended to link into Germany's National Cyber Defence Centre.
    region_nexus: "Germany / Bavaria — neighbouring DACH jurisdiction; state-level (Land) governance layer directly comparable to Swiss cantons"
