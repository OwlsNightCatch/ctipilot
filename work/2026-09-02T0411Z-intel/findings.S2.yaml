    extended_notes: |
      No attacker TTP is described here (this is a procurement/governance decision, not an intrusion), so
      techniques[] is deliberately empty. Defender-relevant value is the contract-risk pattern itself — standardised
      hyperscaler framework terms carrying unilateral technical-change rights, minimal outage liability and a short
      data-migration exit window — worth flagging for any public-sector body evaluating cloud framework contracts
      for critical/identity infrastructure, independent of the E-ID case specifically.
