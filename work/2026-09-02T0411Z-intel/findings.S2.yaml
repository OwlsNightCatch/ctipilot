  - title: "Swiss wealth-manager and banking lobbies press Bern to delay the Transparency Register launch after the Liechtenstein VwbP breach; Federal Council proceeds with the 1 October go-live regardless"
    sources:
      - { url: "https://insideparadeplatz.ch/2026/08/31/banken-lobby-gegen-keller-sutter-striptease-datenbank/", publisher: "Inside Paradeplatz (Lukas Hässig)", date: "2026-08-31", role: primary }
      - { url: "https://exxpress.at/economy/31-000-firmen-betroffen-schweiz-haelt-trotz-hacker-warnung-an-register-fest/", publisher: "Exxpress (Reuters wire)", date: "2026-08-31", role: primary }
      - { url: "https://www.ft.com/content/4822389d-5bb2-4e31-a627-bcda849630c8", publisher: "Financial Times", date: "2026-08-29", role: corroborating }
      - { url: "https://www.domain-b.com/finance/banks-institutions/switzerland-transparency-register-october-1-liechtenstein-hack-2026", publisher: "domain-b.com", date: "2026-08-31", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Transparenzregister Schweiz Vermögensverwalter Verzögerung Liechtenstein NZZ\") → insideparadeplatz.ch, URL https://insideparadeplatz.ch/2026/08/31/banken-lobby-gegen-keller-sutter-striptease-datenbank/ → pivot: WebSearch (\"Reuters Switzerland wealth managers transparency register delay Liechtenstein hack\") → exxpress.at (Reuters wire reproduction), URL https://exxpress.at/economy/31-000-firmen-betroffen-schweiz-haelt-trotz-hacker-warnung-an-register-fest/ → corroborating: Financial Times (title/date confirmed, body paywalled), URL https://www.ft.com/content/4822389d-5bb2-4e31-a627-bcda849630c8"
    summary: |
      This resolves a standing coverage-backlog row (surfaced 2026-08-31, re-checked 2026-09-01, still unpublishable
      for lack of Swiss-domestic corroboration). The Verband Schweizerischer Vermögensverwalter (VSV) sent a letter
      dated 24 August 2026 to the Federal Department of Justice and Police (addressee: Justice Minister Beat Jans)
      warning that Switzerland's incoming Transparency Register — covering the beneficial owners of roughly 600,000
      legal entities, live from 1 October 2026 — would be an "extremely attractive target for cyber criminals" and
      asking for a delay or materially stricter access controls; the Swiss Bankers Association (SBVg) separately
      raised the same concern. The trigger is the Liechtenstein VwbP breach this pipeline already tracks
      (entries/2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach.md): the VSV letter argues a
      Swiss-scale incident of the same kind would be a "GAU" for the Swiss financial centre's reputation. The
      Federal Council confirmed on 31 August 2026 it will proceed with the 1 October launch unchanged, describing
      the Liechtenstein incident as a reason to reinforce the new system's security rather than delay it, and
      pointing to a "highest possible level of protection" design. Background from earlier (out-of-window) NZZ
      reporting on the same register: unlike Liechtenstein's now-compromised portal, the Swiss register is designed
      to run inside a "specially secured network" of the EJPD, is a Confederation in-house build (not an external
      vendor's system, unlike Liechtenstein's), and direct database access is restricted to the operating office and
      the EFD's new control unit; external reporting parties (financial intermediaries, etc.) reach it only through
      the EasyGov portal or a dedicated interface — the same portal-mediated access pattern that let the
      Liechtenstein attacker enumerate all 31,000 records one by one through a vulnerable reporting interface. NZZ
      also notes a precedent: a 2021 EasyGov flaw let an attacker pull data on COVID-19-loan applicants unnoticed
      for 13 days at up to 544,000 requests/day, with no alerting — a bulk-enumeration detection gap that is exactly
      the failure mode the Liechtenstein breach reproduced four years later on a different system.
    region_nexus: "Switzerland (home region) — direct: Federal Council decision on federally-operated financial-crime infrastructure"
