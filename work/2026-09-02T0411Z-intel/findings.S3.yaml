items:
  - title: "Mirage Kitten (Nimbus Manticore/UNC1549) debuts Node.js and JavaScript RATs — NodeRabbit and PollCat — delivered through fake LinkedIn coding-challenge interviews"
    sources:
      - { url: "https://securelist.com/mirage-kitten-new-backdoors-noderabbit-pollcat/121244/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-09-01", role: "primary" }
      - { url: "https://therecord.media/iranian-cyber-spies-target-aviation-fintech-new-malware", publisher: "The Record (Recorded Future News)", date: "2026-09-01", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Kaspersky GReAT Securelist new research September 2026\") → https://securelist.com/ (listing, dated 2026-09-01) → primary: Kaspersky Securelist, URL https://securelist.com/mirage-kitten-new-backdoors-noderabbit-pollcat/121244/ → corroborating: The Record, URL https://therecord.media/iranian-cyber-spies-target-aviation-fintech-new-malware"
    summary: |
      Kaspersky's GReAT team published (2026-09-01) two previously undocumented cross-platform RATs it attributes with high confidence to Mirage Kitten — the Iran-nexus actor this pipeline already tracks as Nimbus Manticore/UNC1549/Smoke Sandstorm/Screening Serpens. NodeRabbit (Node.js) and PollCat (obfuscated JavaScript) are the group's first scripting-language implants, a departure from its historical native C/C++/Go malware deployed via DLL search-order hijacking. Delivery mirrors the DPRK "Contagious Interview" tradecraft: fake recruiter personas on LinkedIn and other job platforms invite targets to complete a timed technical assessment (a 3-hour "fix the bugs" coding challenge for NodeRabbit, a 1-hour OTP-gated "CTF" React challenge for PollCat), hosted as an archive on Amazon S3 and pressured for immediate execution. The malicious code sits in a locally-bundled (never registry-published) trojanized npm package — colorized_terminal or pretty-log, both pinned to v2.1.0 — imported on the first line of the assessment's server.js, which launches the implant as a detached background process. Kaspersky documents three NodeRabbit variants of increasing sophistication: v1 uses a fixed single-instance TCP port; v2 adds sandbox/analyst-detection (memory, CPU count, uptime, analyst usernames, running analysis tools) with a benign-decoy HEAD-request fallback and full corporate-proxy traversal (WinHTTP/PAC discovery, HTTP CONNECT, NTLM/Negotiate delegated to curl.exe --proxy-anyauth); v3 (Ethiopia) grows the command set from 11 to 23, adding Outlook OST/PST email harvesting, a fake "GitHub Copilot Helper" VS Code extension for persistence, and Git post-merge/post-checkout hook injection across up to 20 scanned repositories. All variants use AES-256-GCM-encrypted JSON C2 over HTTPS against Azure Websites (AS8075, MarkMonitor-registered) and Cloudflare-fronted domains, in some cases embedding the victim organization's name into the Azure subdomain to blend with legitimate corporate traffic. PollCat shares C2 handshake structure, beacon timing constants (120s/5s jitter/60s retry) and several command IDs with a backdoor Kaspersky internally tracks as Retrograde (overlapping with the publicly reported MiniFast/MiniUpdate family) — the basis, together with victimology and infrastructure patterns, for the Mirage Kitten attribution. Confirmed victims sit in fintech, aviation and aerospace organizations in Egypt, Ethiopia and Afghanistan; The Record's corroborating reporting adds Jordan, Tanzania, Pakistan and Burkina Faso to the group's established Middle East/Africa targeting footprint. No CVE is involved — this is a social-engineering-plus-supply-chain delivery chain, not an exploited vulnerability.
    region_nexus: "Middle East and Africa (Egypt, Ethiopia, Afghanistan, Jordan, Tanzania, Pakistan, Burkina Faso); no confirmed Swiss/EU victim, but the delivery technique (fake technical-hiring assessment) is directly transferable to any organization that recruits software engineers, including public-sector IT/e-government development teams"
