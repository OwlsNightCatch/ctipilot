    extended_notes: |
      Detection concept (telemetry class first): process-creation events showing node.exe / a locally-cloned nodew.exe or platform equivalent spawned from a freshly-extracted archive/project directory outside normal package-manager cache paths, with parent lineage tracing to a zip-extraction or IDE "run project" action rather than an interactive shell; outbound HTTPS to *.azurewebsites.net or newly-registered domains from a developer workstation shortly after such a spawn is the discriminating sequence. Persistence-artifact hunt: HKCU Run keys naming MicrosoftEdgeUpdate/IntelDriverSupportUpdate-style tasks that execute a renamed node.exe against a .js payload; scheduled tasks running daily at 09:00/10:00 invoking Node against a script in %APPDATA%, %LOCALAPPDATA%, or ProgramData; VS Code extension directories containing an extension not present in the marketplace/lockfile inventory; unexpected entries in .git/hooks/post-merge or post-checkout referencing a "shepherd-persist" marker or an out-of-repo Node invocation. Benign lookalike / triage discriminator: legitimate take-home coding assessments are common in technical hiring — the distinguishing features here are (a) a time-pressured single-use access code or a hard time limit paired with an explicit instruction not to use AI-assisted review tools, (b) a first-line import of an unfamiliar or unpublished npm package bundled directly in node_modules rather than fetched from the registry, and (c) outbound network activity beginning before any legitimate application functionality is exercised. Hardening: technical-recruiting workflows should sandbox/detonate candidate-supplied take-home projects in an isolated, network-egress-controlled environment before any engineer runs them on a corporate endpoint, and organizations should treat "please don't use AI code review on this" as itself a red flag warranting manual security review of the archive.

