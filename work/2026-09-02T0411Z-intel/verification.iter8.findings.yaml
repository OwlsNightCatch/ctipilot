  url_or_quote: "delegating NTLM/Negotiate challenges to `curl.exe --proxy-anyauth` when an unauthenticated connection fails"
  summary: "(low confidence) Securelist's own text describes three sequential steps: unauthenticated connection attempt, then retry with URL-embedded basic credentials, then NTLM/Negotiate delegation to curl.exe only if that also fails (\"It first tries to establish an unauthenticated connection. If it fails, it retries using URL-embedded basic credentials. Finally, it delegates Windows NTLM/Negotiate challenges to curl.exe --proxy-anyauth --proxy-user.\"). The entry's clause skips the intermediate basic-credentials retry, stating NTLM delegation is triggered directly by the unauthenticated attempt's failure. The same simplification is echoed in entities/registry.yaml's tool:noderabbit summary (\"corporate-proxy traversal\")."
