    summary: |
      The ransomware-as-a-service group Krybit (active since March 2026, RaaS with an 80/20 affiliate
      split) added uicc.org — the Union for International Cancer Control, a Geneva-headquartered
      international NGO with 1,150+ member organisations in 170+ countries — to its Tor leak site on
      2026-09-01. No data samples or file trees have reportedly been published to substantiate the claim.
      UICC's own website carries no incident notice, and no established outlet (Admiralty A/B) has
      corroborated the claim as of this writing — only leak-site trackers and breach-alert aggregator sites
      have repeated it. Per the fake-news guard (ransomware leak-site claims require victim disclosure or
      high-reliability journalism), this does not clear the bar for a confirmed-incident item. Flagging for
      the store's own tracking given UICC's Swiss domicile (home-region relevance) — worth a quick re-check
      in a subsequent run for either a UICC statement or press pickup.
