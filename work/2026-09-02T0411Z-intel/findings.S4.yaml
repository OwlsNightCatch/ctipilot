      platform breaches this pipeline has not otherwise tracked closely, but with no Swiss/EU nexus and no
      transferable technical lesson beyond "verify your downstream SaaS processors' breach notifications
      reach you," the main agent may reasonably judge this below the inclusion bar (PD-11) for this
