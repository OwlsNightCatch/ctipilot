items:
  - title: "Dropbox account takeover via a federated Lenovo-ID trust gap: ~5,000 accounts accessed with no password and no 2FA bypass needed"
    sources:
      - { url: "https://www.freemalaysiatoday.com/category/business/2026/09/02/dropbox-says-about-5-000-accounts-compromised-in-august-hack", publisher: "Reuters (via Free Malaysia Today)", date: "2026-09-02", role: primary }
      - { url: "https://9to5mac.com/2026/09/01/dropbox-login-breach-seemingly-caused-by-egregious-authentication-failure/", publisher: "9to5Mac", date: "2026-09-01", role: primary }
      - { url: "https://www.heise.de/news/Fremde-Dropbox-Konten-ueber-Lenovo-ID-zugaenglich-11437565.html", publisher: "heise Security", date: "2026-09-02", role: corroborating }
    discovery_trace: >
      first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS item "Ich mach mir eine
      Lenovo-ID und hol mir Deine Dropbox-Dateien", 2026-09-02T03:04Z) → pivot: heise article, URL
      https://www.heise.de/news/Fremde-Dropbox-Konten-ueber-Lenovo-ID-zugaenglich-11437565.html (cites
      Bloomberg as originating source, paywalled/CAPTCHA-blocked on fetch) → pivot: WebSearch ("Dropbox Lenovo
      ID account breach 5000 accounts security") → primary: Reuters wire copy via Free Malaysia Today, URL
      https://www.freemalaysiatoday.com/category/business/2026/09/02/dropbox-says-about-5-000-accounts-compromised-in-august-hack
      (carries direct Dropbox and Lenovo statements to Reuters) → primary: 9to5Mac, URL
      https://9to5mac.com/2026/09/01/dropbox-login-breach-seemingly-caused-by-egregious-authentication-failure/
      (reproduces the verbatim Dropbox notification email a victim posted publicly, plus the attack-flow
      breakdown citing thecybersecguru.com's analysis).
    summary: |
      Dropbox confirmed to Reuters (2026-09-02) that unauthorized parties accessed roughly 5,000 Dropbox
      accounts between 4 and 21 August 2026 by abusing Dropbox's "Continue with Lenovo" single sign-on
      integration, one of several third-party identity providers (alongside Google and Apple) Dropbox
      accepts for login. The root cause is a broken trust chain across two parties: Lenovo's own ID
      registration flow failed to properly verify that a registrant controlled the email address they
      supplied, so an attacker could create a brand-new Lenovo ID under a victim's known or guessed email
      address with no access to that inbox at all; Dropbox's side then compounded the flaw by implicitly
      trusting the IdP's asserted email claim to bind a session to the matching Dropbox account whenever
      that account had Dropbox's own two-factor authentication disabled — no password prompt, no step-up
      challenge, no "link this new identity?" consent screen. Attackers were able to browse account
      contents on affected accounts freely; per Dropbox, files were viewed or downloaded in fewer than a
      third of the roughly 5,000 impacted accounts. Reporting notes evidence of bulk, low-effort targeting
      rather than hand-picked victims (one reclaimed rogue Lenovo ID carried the throwaway display name
      "John Madden"). Dropbox has since terminated every session authenticated via a Lenovo ID, severed the
      Lenovo-Dropbox account link entirely, changed its system so a user's existing Dropbox password must
      now be entered before any Lenovo-ID-authenticated session can be established, and reported the
      incident to data-protection regulators. Lenovo separately confirmed a "legacy integration" between
      Lenovo ID and Dropbox "could be used to improperly authenticate certain Dropbox accounts" and said its
      own customer accounts were not affected.
    region_nexus: "global cloud-storage provider; the affected identity-federation pattern (third-party IdP login with no relying-party step-up) is common to any organisation offering 'sign in with X' options, including Swiss public-sector portals using federated/e-ID login"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: []
    techniques: [T1199, "T1078.004"]
    affected_products: ["Dropbox"]
    entity_keys: []
    new_entities:
      - { key: "incident:dropbox-lenovo-id-sso-account-takeover-2026-08", type: incident, name: "Dropbox account takeover via Lenovo-ID SSO trust gap (2026-08)",
          aliases: [], summary: "Unauthorized access to ~5,000 Dropbox accounts between 2026-08-04 and 2026-08-21 via a broken trust chain between Lenovo's ID email-verification process and Dropbox's implicit acceptance of Lenovo-ID-asserted email claims for accounts without 2FA enabled (Reuters/Dropbox/Lenovo, 2026-09-01/02)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Dropbox told Reuters that it identified unauthorized access affecting accounts linked to a Lenovo ID that did not have its two-factor authentication enabled, prompting the company to terminate all sessions authenticated through a Lenovo ID."
        attribution: "Reuters (via Free Malaysia Today)"
        source_url: "https://www.freemalaysiatoday.com/category/business/2026/09/02/dropbox-says-about-5-000-accounts-compromised-in-august-hack"
      - quote: "Lenovo identified a \"legacy integration\" between Lenovo ID and Dropbox that \"could be used to improperly authenticate certain Dropbox accounts\". The company said its own customers were not affected and that an investigation was ongoing."
        attribution: "Reuters (via Free Malaysia Today), quoting Lenovo"
        source_url: "https://www.freemalaysiatoday.com/category/business/2026/09/02/dropbox-says-about-5-000-accounts-compromised-in-august-hack"
      - quote: "Dropbox partners with Lenovo as an identity provider so that users can log in to their Dropbox accounts using verified Lenovo IDs. While you may not have an existing Lenovo ID, our investigation determined that an issue with Lenovo's email verification process allowed an unauthorized party to register a Lenovo ID using your email address and then use that Lenovo ID to log into the Dropbox account associated with that email address."
        attribution: "Dropbox, in its notification email to affected users (via 9to5Mac)"
        source_url: "https://9to5mac.com/2026/09/01/dropbox-login-breach-seemingly-caused-by-egregious-authentication-failure/"
      - quote: "So konnte sich der Täter im Zeitraum 4. bis 21. August in rund 5.000 Dropbox-Konten frei umsehen. In weniger als einem Drittel der Fälle soll er Dateien gefunden haben, die ausreichend interessant erschienen, um sie herunterzuladen."
        attribution: "heise Security (Daniel AJ Sokolov)"
        source_url: "https://www.heise.de/news/Fremde-Dropbox-Konten-ueber-Lenovo-ID-zugaenglich-11437565.html"
    extended_notes: |
      Triage: a legitimate "Continue with Lenovo" (or any federated IdP) login is ordinary traffic and is
      not distinguishable from this abuse at the network layer; the discriminator lives in the relying
      party's own session/account-linking logs — a session established via a third-party IdP for an
      account that never previously had that IdP linked, immediately following a fresh registration on the
      IdP side, and landing on an account with no second factor configured. The generalisable lesson for
      any org offering "sign in with a third-party IdP": never let a relying party treat an IdP's asserted
      email claim as sufficient to silently bind/reuse an existing account — require the account's own
      credential (or an explicit, logged consent step) the first time a new external identity is linked,
      regardless of whether the IdP itself is trusted. This is a design-pattern lesson, not a currently
      exploitable vulnerability — Dropbox has already remediated (severed all Lenovo-ID links; password
      required to establish any future Lenovo-ID session) — but the SSO/OAuth trust-boundary failure mode
      transfers directly to any organisation's own federated-login integrations.
    borderline: false

  - title: "Aesto Health third-party EHR-migration platform breach reaches 9.5 million patients, ~9 months after the intrusion occurred"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/aesto-health-says-data-breach-affects-over-95-million-patients/", publisher: "BleepingComputer", date: "2026-09-01", role: primary }
      - { url: "https://cyberinsider.com/aesto-healthcare-data-breach-impacts-9-5-million-people/", publisher: "CyberInsider", date: "2026-09-01", role: corroborating }
    discovery_trace: >
      first seen at: WebFetch of https://www.bleepingcomputer.com/news/security/ (listing page, 2026-09-02
      fetch) → primary: BleepingComputer article, URL
      https://www.bleepingcomputer.com/news/security/aesto-health-says-data-breach-affects-over-95-million-patients/
      (quotes Aesto Health's own incident notice and the HHS breach-portal filing) → corroborating: CyberInsider
      listing, URL https://cyberinsider.com (homepage sweep) → article URL
      https://cyberinsider.com/aesto-healthcare-data-breach-impacts-9-5-million-people/.
    summary: |
      Aesto LLC, operating as Aesto Health — a SaaS platform healthcare organisations use to migrate,
      archive and access patient EHR data during system replacements or practice acquisitions — disclosed
      that a breach discovered internally on 26 May 2026 (following external forensic investigation) traces
      to an intrusion between 2 and 18 December 2025, in which an unauthorized actor accessed and/or
      acquired protected health information "belonging to patients of various Covered Entity clients" from
      "a limited portion" of Aesto's AWS infrastructure. Public notification began 24 June 2026 and
      individual notice letters went out from 21 August 2026. Aesto's HHS breach-portal filing puts the
      affected count at 9,540,683 individuals, with data classes including full names, dates of birth,
      medical information, driver's license numbers, health-insurance information, individual taxpayer ID
      numbers, other government ID numbers and Social Security numbers. HIPAA Journal reports the incident
      indirectly affects 29 downstream healthcare providers connected through Aesto's platform, including
      VillageMD, Everside Health (Marathon Health), Marana Health and Together Women's Health. No threat
      group has publicly claimed the attack and no root cause, initial-access vector or exploited
      vulnerability has been disclosed by Aesto at the time of reporting; BleepingComputer lists this as one
      of a growing string of similar 2026 healthtech third-party-platform breaches (iRhythm, Xolis,
      Medtronic, MCBS, Unlimited Technology Systems, CareCloud, Nutex Health, McKesson).
    region_nexus: "United States only — no stated Swiss/EU nexus"
    primary_sector_nexus: "none"
    sector: "healthcare"
