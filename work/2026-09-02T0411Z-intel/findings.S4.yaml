backlog_notes: |
  Backlog item 1 (DGFiP/Bloctel/Cybernox — RESOLVED, confirmed): ZATAZ.COM published
  "Cybernox multiplie les revendications de fuites en France" on 2026-08-07 (article timestamped
  attribution date 2026-08-07, describing a Cybernox forum post dated 2026-08-06T19:36) —
  https://www.zataz.com/cybernox-multiplie-les-revendications-de-fuites-en-france/ — in which the actor
  Cybernox (already a registered entity, actor:cybernox) claims, jointly with a second handle "don't call
  me," to have leaked a database tied to Bloctel (France's telemarketing opt-out registry) containing
  exactly 3,032,386 phone numbers. This matches DGCCRF's 2026-08-12 disclosure in scale and subject
  (~3 million phone numbers, 600,000 registered on Bloctel, taken via a fraudulently accessed professional
  account) and in timing (Cybernox's claim on 2026-08-06, five days before DGCCRF's public warning on
  2026-08-11/12). HOWEVER: ZATAZ's own article explicitly cautions that "Ces piratages doivent être traités
  comme des revendications publiées par Cybernox" (these hacks must be treated as claims published by
  Cybernox) and that a leak-site posting does not by itself prove the claimed organisation was directly
  breached (could be a partner/processor compromise, older data, or aggregation). No source — not DGCCRF,
  not ZATAZ — explicitly states Cybernox is the actor behind the Bloctel breach; this is a plausible,
  timing-and-volume-consistent correlation, not a confirmed attribution. If the main agent adds a
  correction/update record to entries/2026-08-15/france-dgfip-tax-authority-credential-intrusion.md, it
  should be framed exactly that way: "ZATAZ reported on 2026-08-07 that Cybernox claimed a 3,032,386-number
  Bloctel-linked leak on 2026-08-06 — a claim consistent in scale and timing with DGCCRF's 2026-08-12
  disclosure of a ~3M-number leak including 600,000 Bloctel registrants, but neither DGCCRF nor ZATAZ
  confirms Cybernox as the actor behind the DGFiP-adjacent Bloctel incident." Source:
  https://www.zataz.com/cybernox-multiplie-les-revendications-de-fuites-en-france/ (ZATAZ.COM, Damien
  Bancal, dated 2026-08-07).

  Backlog item 2 (Ixa Systems / TheGentlemen — STILL UNCORROBORATED, no change): Searched WebSearch
  (multiple queries covering French/German terms, swisscybersecurity.net, 24heures/20min/RTS) and fetched
  https://www.ixasystems.ch/ directly (no incident notice, no outbound third-party links). Found no victim
  statement from Ixa Systems SA and no French- or German-language press pickup (24heures.ch, 20min.ch, RTS,
  Le Temps, swisscybersecurity.net all checked via search, none returned coverage). The only source for the
  claim remains ransomware.live's mirror of TheGentlemen's leak-site listing
  (https://www.ransomware.live/id/SXhhIFN5c3RlbXNAdGhlZ2VudGxlbWVu), dated 2026-08-30 for a claimed
