  - title: "Krybit ransomware group lists Geneva-based UICC (Union for International Cancer Control) — leak-site claim only, no victim confirmation found"
    sources:
      - { url: "https://www.ransomware.live/id/dWljYy5vcmdAa3J5Yml0", publisher: "Ransomware.live (leak-site tracker)", date: "2026-09-01", role: primary }
