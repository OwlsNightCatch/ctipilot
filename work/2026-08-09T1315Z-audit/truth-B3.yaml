  verdict: clean
  defect: null
  ground_truth: >
    Sonatype (2026-08-05) confirms both evidence[] quotes verbatim - the detached-process failsafe sentence
    and the full remediation-order sentence the takeaway is built on. The 846 figure is the body's own
    number ("At the time of publication, Sonatype has identified 846 software components implicated in the
    campaign"); the 850 in the source URL slug is the publisher's own rounding, and the entry correctly
    follows the body rather than the slug. Campaign name "Flooding Dropper", tracking id
    sonatype-2026-005660, CWE-506 at CVSS 8.7, the DNS TXT-record fallback, ETW and AMSI patching, Registry
