- entry: entries/2026-08-06/litellm-callback-hook-post-inference-tool-call-forgery.md
  coverage: fetched
  verdict: clean
  defect: null
  ground_truth: >
    Both evidence[] quotes are verbatim on the CSA research note (2026-08-05): "forge a tool call that was
    never produced by the underlying model" and "bypasses prompt-level defenses entirely". The CSA note
    confirms the /model/update api_base reroute, credits wunderwuzzi / Embrace The Red (2026-08-03) as the
    origin, and states the revert claim the entry's detection argument rests on: "a sophisticated attacker
    reverts the rerouted configuration back to its original state once the operation concludes, which
    removes the most visible artifact." The originating post was also fetched: "LLM Heist: Hijacking LiteLLM
    for Traffic Interception, Key Theft, and Tool-Call Injection" by wunderwuzzi, 2026-08-03, confirming the
    master-key/proxy-admin precondition, the api_base + use_litellm_proxy change, and the
    async_post_call_success_hook / async_post_call_streaming_iterator_hook abuse. Notably, wunderwuzzi's own
    ATT&CK mapping includes T1557 and T1565.002 - the exact two ids the entry carries in techniques[]. The
    entry's two-day gap between disclosure and the in-window CSA note is arithmetically correct.
  ground_truth_url: https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-callback-hook-hijacking-20260805-c/

