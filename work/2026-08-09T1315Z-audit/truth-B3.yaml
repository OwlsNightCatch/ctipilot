- entry: entries/2026-08-06/cve-2026-63077-teamcity-kev-confirmed-exploited.md
  coverage: fetched
  verdict: imprecision
  defect: >
    Two related imprecisions about the exploitation vector, both widening the apparent attack surface.
    (1) The entry renders JetBrains' description as "letting an unauthenticated attacker with HTTP(S) access
    to a TeamCity server bypass authentication checks and execute arbitrary operating-system commands", then
    builds the summary ("the flaw needs only HTTP(S) reachability") and the takeaway ("Because exploitation
    requires only network reachability") on it. JetBrains names a specific protocol - the TeamCity agent
    polling protocol - not generic HTTP(S). The substitution loses the one detail that would let a defender
    scope which listener matters.
    (2) The entry asserts "Neither CISA's alert nor its catalog entry names an exploiting cluster, a victim
    set, or the observed intrusion path". The KEV catalog record does name the path in its shortDescription.
    The actor and victim halves of the claim are correct.
    Verified correct: CVSS 9.8 (JetBrains CNA, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), fixed versions
    2025.11.7 / 2026.1.3, the 2017.1+ security-patch plugin, "All versions of TeamCity On-Premises are
    affected", CWE-502, dateAdded 2026-08-05, dueDate 2026-08-08, both evidence[] quotes verbatim, and the
    update_of target.
  ground_truth: >
    JetBrains: "An unauthenticated attacker could exploit the vulnerability via the TeamCity agent polling
    protocol to bypass authentication checks and execute arbitrary operating system commands with the
    privileges of the TeamCity server process." KEV record CVE-2026-63077 shortDescription: "JetBrains
    TeamCity contains a deserialization of untrusted data vulnerability that could allow unauthenticated
    remote code execution via the agent polling protocol." CVE record (assigner JetBrains, 2026-07-27): "In
    JetBrains TeamCity before 2026.1.3, 2025.11.7 unauthenticated remote code execution was possible via the
    agent polling protocol".
  ground_truth_url: https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/

