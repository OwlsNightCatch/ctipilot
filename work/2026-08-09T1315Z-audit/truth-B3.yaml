- entry: entries/2026-08-07/ai-api-token-jacking-transfer-station-resale.md
  coverage: fetched
  verdict: clean
  defect: null
  ground_truth: >
    All three evidence[] quotes confirmed verbatim on the Unit 42 post (2026-08-06): the within-minutes
    transfer-station integration, "This led to nearly a million dollars in charges before discovery and
    containment.", and "Organizations impacted by token jacking have very little recourse to recover funds
    billed by the AI services for using their API tokens." The terminology ("token jacking", a dedicated
    "Transfer Stations" section), the open-source LLM-proxy basis (new-api, one-api), the account-takeover
    variant (minting new API keys, removing billing limits, disabling usage alerts and logging) and the
    generic HTTP-library user-agent signal are all present as the entry describes. The entry correctly
    generalises the user-agent observable rather than reproducing the literal string, keeping it IOC-free.
    All eight techniques[] ids are active in the pinned dataset and each names a described behaviour.
  ground_truth_url: https://unit42.paloaltonetworks.com/ai-token-jacking/

- entry: entries/2026-08-07/fake-zoom-dotnet-downloader-overlord-rat-macos.md
  coverage: fetched
  verdict: imprecision
  defect: >
    All four evidence[] quotes are verbatim, the 34-DLL count is exact, Garble obfuscation is confirmed, and
    the attribution handling is the strongest in the batch - Jamf's two similarity observations are kept
    separate and Jamf's own refusal to attribute is quoted accurately ("Jamf Threat Labs has noted the
    similarities but does not currently attribute this malware to a specific threat actor").
    The defect is a first-ness quantifier hardened past its source in the body: "a counterfeit Zoom installer
    that introduces a runtime macOS malware has not used before as a downloader stage" states a categorical
    fact about macOS malware generally. Jamf claims only its own observation, and narrows it further to a
    campaign class: "The use of .NET as a macOS downloader is a technique we had not previously observed in
    campaigns of this kind." The title and summary hedge this correctly ("the first case Jamf has observed");
    the body sentence drops both the observer and the "campaigns of this kind" qualifier.
  ground_truth: >
    Jamf Threat Labs, 2026-08-06: "The use of .NET as a macOS downloader is a technique we had not previously
    observed in campaigns of this kind." 34 DLLs confirmed via "scanning `ZoomMeetings` for `MZ` magic bytes
    with valid PE signatures, which located 34 DLLs." Second stage confirmed Garble-obfuscated Go Overlord
    build. UNK_DeadDrop/Proofpoint and FlexibleFerret/SentinelOne both referenced, attribution declined.
  ground_truth_url: https://www.jamf.com/blog/fake-zoom-installer-delivers-overlord-rat-macos/

