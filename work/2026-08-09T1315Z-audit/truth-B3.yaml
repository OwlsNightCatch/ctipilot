- entry: entries/2026-08-05/talos-adversary-ai-coding-assistant-prompt-log-forensics.md
  coverage: fetched
  verdict: imprecision
  defect: >
    Body states the francophone actor's pipeline "scanned on the order of 18 million target hosts drawn from
    a 90-million-URL seed list". Talos does not say 18 million hosts were scanned: the 18-million figure is a
    resume offset in a checkpoint file (a line number in a URL list), and the pipeline's actual target list
    held 9,180 unique hosts. The entry converts a line offset into a host count, drops the 9,180 figure that
    a defender would use to judge real targeting breadth, and overstates host count by three orders of
    magnitude. All three evidence[] quotes are verbatim; the "54 targets" figure is correct; both
    techniques[] ids (T1588.007 Artificial Intelligence, T1587.001 Malware) name behaviours the body
    describes and the source supports.
  ground_truth: >
    Cisco Talos: "a checkpoint file recording a resume position at line 18,222,511 confirms the pipeline
    processed its target list at that magnitude." and "The pipeline's input list (\"target.txt\") contained
    9,180 unique hosts spanning unrelated companies". The 90-million figure is "an original source list of
    90 million URLs"; a separate stage was "built to ingest 50 - 250 million URLs on a 56-vCPU/128GB server".
  ground_truth_url: https://blog.talosintelligence.com/keep-going-bro-youve-got-this-a-data-driven-look-at-how-adversaries-are-weaponizing-ai/

- entry: entries/2026-08-05/thermo-fisher-genetic-analyzer-dna-file-integrity.md
  coverage: fetched
  verdict: factual-error
  defect: >
    The entry's central and repeated claim - that no vendor fix exists - is contradicted by its own single
    cited source. Title: "no vendor fix is offered"; headline: "no patch"; summary: "The advisory names no
    vendor patch - the recommendations are exposure minimisation and defence in depth"; cves[0].status:
    [no-patch]; cves[0].fixed: "None stated in the advisory"; the no-patch tag; body: "CISA names no vendor
    patch" and "There is no patch to wait for, and the control that closes the gap is architectural rather
    than a software update"; actions[0]: "because no vendor fix exists"; takeaway: "the instrument software
    will never notice it".
    CISA's ICSMA-26-216-01 carries eight vendor_fix remediations. Five name concrete patched versions with
    download URLs (3500/3500xL DCS 4.0.3, 3730/3730xL DCS 5.0.3, SeqStudio DCS 1.2.6, SeqStudio Flex 1.2.1,
    GeneMapper ID-X 1.7.4); only the three legacy ABI PRISM / 3130 products are EoL with no update. The fix
    implements exactly the control the entry says does not exist and cannot be waited for: digital signatures
    letting users verify data files have not been modified. The advisory has never been revised (version 1,
    initial_release_date = current_release_date = 2026-08-04T06:00:00Z), so the fixes were on the page when
    the run read it.
    Correct in the entry: CVSS 3.1 8.4 / AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, the full eight-product affected
    list, the evidence[] quote verbatim, and T1565.001 Stored Data Manipulation as the mapped technique.
  ground_truth: >
    CSAF remediations[]: {"category":"vendor_fix","details":"Applied Biosystems 3500/3500xL Series Data
    Collection Software: Update to version 4.0.3","url":"https://downloads.thermofisher.com/..."} plus four
    further vendor_fix records with version numbers, and {"category":"mitigation","details":"Thermo Fisher
    has developed security updates to address the vulnerability. The security updates implement the use of
    digital signatures on the instrument software that adds an extralayer of protection. Moving forward,
    this will help users verify that data files have not been modified."}. Same text in the CVE record's
    solutions[] (CNA icscert). Vendor bulletin:
    https://documents.thermofisher.com/TFS-Assets/CORP/Product-Guides/fsa_hid_bulletin.pdf
  ground_truth_url: https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsma-26-216-01.json

