- entry: entries/2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver.md
  coverage: fetched
  verdict: clean
  defect: null
  ground_truth: >
    Elastic Security Labs (2026-08-06) confirms every figure and all four of its evidence[] quotes verbatim:
    400+ compromised packages, over 1.3 billion combined monthly downloads, keyv >600M, flat-cache ~580M,
    cacheable-request >137M, cacheable >30M, cache-manager >16M, the 711 KB payload, over 300 credential
    patterns, the Bun download-and-delete chain, the VS Code tasks.json folderOpen route with 50-branch
    injection, the bypass_2fa + package-write propagation gate, the Ethereum smart-contract C2 resolver, and
    the GitHub-repository exfiltration fallback. (Evidence quote 2 differs only by the source's markdown
    backticks around `preinstall` and `package.json`, which are absent from the rendered text - a contiguous
    substring of the page as read, not a splice.)
    OX Security (2026-08-04) confirms the entry's handling of the contradiction: "The malware has a dead
    man's switch trigger, to delete the current machine if the stolen GitHub token is revoked" - reported by
    OX and absent from Elastic, exactly as the entry states. OX's counts (444 packages, over 2 billion
    monthly downloads) are indeed larger than Elastic's, as the entry says, and the entry's OX evidence quote
    is a contiguous substring of "A massive Shai-Hulud campaign hit npm, affecting over 2 billion monthly
    downloads of packages". All eight techniques[] ids map to described behaviours. No IOCs carried despite
    both sources publishing hashes, hostnames and the contract address.
