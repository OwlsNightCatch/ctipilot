- entry: entries/2026-08-05/unit42-nova-autonomous-oss-vulnerability-discovery.md
  coverage: fetched
  verdict: imprecision
  defect: >
    The entry misreports the structure of Unit 42's supply-chain figures. Summary: "Unit 42 also reports
    5,421 findings tied to vulnerable dependencies, creating downstream exposures in consuming
    applications." Body: "Unit 42 also reports 5,421 findings tied to 1,280 vulnerable dependencies,
    producing downstream exposures in consuming applications." Unit 42 does not tie 5,421 findings to 1,280
    dependencies: 5,421 is the TOTAL of two disjoint buckets - 1,280 flaws in dependency packages PLUS 4,141
    downstream exposures. The entry collapses a sum into a ratio, and the 4,141 figure (the one that actually
    quantifies downstream consuming-application exposure, which is the entry's own analytical point) never
    appears. The follow-on claim "a majority of which it validated as exploitable from the consuming
    application" does hold: 2,776 of 4,141 were PoC-validated.
    Minor, non-elevating: evidence[] quote 2 lower-cases the source's sentence-initial "Every model
    contributed..." to "every model contributed...". Conventional mid-sentence quoting, noted not counted.
    Verified correct: 3,915 projects, six ecosystems, 14,090 confirmed vulnerabilities, 99.4% previously
    unreported, ~40% high/critical, two-month period, the 92% composition quote verbatim, and T1588.006
    Vulnerabilities as the mapped technique.
  ground_truth: >
    Unit 42: "In the package ecosystems we studied, the pipeline produced 5,421 supply-chain findings:"
    broken out as "1,280 flaws in dependency packages" and "4,141 downstream exposures where an application
    could reach a vulnerable dependency through its own code". Also "For 2,776 of the downstream exposures,
    the pipeline validated exploitability from the downstream application with a working PoC." Pipeline name
    NOVA (Network and Open-Source Vulnerability Analyzer); published 2026-08-04.
  ground_truth_url: https://unit42.paloaltonetworks.com/frontier-ai-vulnerability-burst/

