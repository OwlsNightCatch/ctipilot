- entry: entries/2026-08-07/keycloak-saml-broker-signature-bypass-cve-2026-16443.md
  coverage: fetched
  verdict: clean
  defect: null
  ground_truth: >
    All seven CVEs verified against the Red Hat CNA container, which is the vendor authority for Keycloak
    and Red Hat Build of Keycloak. Every score matches the entry exactly: CVE-2026-16443 = 7.4
    (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N, the vector the entry quotes character-for-character,
    severity Important, CWE-347); CVE-2026-16442 = 7.4 (AC:H, PR:N); CVE-2026-15572 = 8.8 (PR:L);
    CVE-2026-16102 = 8.1 (PR:L); CVE-2026-15573 = 8.1 (PR:L); CVE-2026-16071 = 5.4 (PR:L); CVE-2026-16100 =
    6.5 (PR:L). Every auth value in cves[] matches its vector's PR field, and each per-flaw mechanism in the
    body matches the Red Hat description (SAML broker key-usage attributes; IdP-initiated SSO account-linking
    restriction; the Allowed Protocol Mapper Types re-validation gap; the DCR claim-path mis-validation;
    PathMatcher URI normalisation; the LDAP users-DN boundary escape; the unbounded Prometheus metric label).
    The evidence[] quote is a verbatim contiguous substring. Minor, non-elevating: CVE-2026-16071 carries
    auth: admin-required against a PR:L vector - defensible because the flaw genuinely requires a delegated
    administrator role, and the body says so, but it is the one frontmatter value in the entry that is a
    judgement rather than a transcription.
  ground_truth_url: https://access.redhat.com/security/cve/CVE-2026-16443

- entry: entries/2026-08-07/macos-clickfix-server-side-fingerprinting-gate-amos.md
  coverage: fetched
  verdict: clean
  defect: null
  ground_truth: >
    All five evidence[] quotes confirmed verbatim on the Microsoft Threat Intelligence post (2026-08-05),
    including the two that carry the entry's action items: the macOS 26.4 Terminal paste-warning mitigation
    and the "Where feasible, alert the file<word><word> domain pattern rather than maintaining a list of
    individual domains." guidance. The "more than 250 ClickFix front-end domains during the tracking window"
    count is confirmed, MacSync and Atomic Stealer (AMOS) are both named by Microsoft, and the quarantine /
    code-signing / notarization bypass sentence the takeaway quotes is verbatim. All nine techniques[] ids
    are active in the pin and behaviourally apt, T1204.004 Malicious Copy and Paste being the correct
    specific id for the paste-and-run step. The entry carries the domain-generation pattern (which Microsoft
    itself publishes as the hunt pivot) and no individual hostnames, so it stays IOC-free.
  ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/08/05/macos-clickfix-campaign-learned-hide/
