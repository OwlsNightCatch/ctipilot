  item: "2026-08-09/wallix-bastion-rest-api-unauth-admin-cvss10"
  url_or_quote: "\"No exploitation has been reported, and WALLIX deliberately withholds the exploitation mechanics — but it also states that the independent security researchers who reported the flaws \\\"intend to publish full technical details in September 2026\\\" ... ([WALLIX, 2026-07-20](https://www.wallix.com/support-services/alerts/))\""
  summary: >-
    Adjacency defect. The trailing citation carries the whole sentence, but neither cited page states that
    no exploitation has been reported. The WALLIX advisory page does carry the boilerplate "WALLIX is not
    aware of any public announcements or malicious use of the vulnerability that is described in this
    advisory" — but only in the MARCH 2026 and older advisories (cached page lines 423, 487, 504, 522, 540,
    560); the two JULY 2026 sections (lines 203-327, WSA-2026-07-0002 and WSA-2026-07-0001) carry no such
    statement. What WSA-2026-07-0001 does say is the opposite in effect: "Exploitation can be entirely
    invisible", "Absence of evidence must not be interpreted as absence of compromise. Treat any affected,
    network-reachable appliance as potentially fully compromised, including all vault secrets." CERT-FR
    CERTFR-2026-AVI-0974 (fetched this iteration) makes no exploitation-status statement at all. The rest of
    the sentence (withheld mechanics, the September quotes) is verbatim-supported. Fix by dropping the
    clause or replacing it with what the vendor states ("Technical exploitation details are intentionally
    withheld ...", plus the invisible-exploitation caution the entry's own Defender takeaway already relies on).
