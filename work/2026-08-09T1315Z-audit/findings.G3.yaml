  discovery_trace: 'first seen at: heise-sec RSS listing sweep, URL https://www.heise.de/security/feed.xml (post dated 2026-08-06)
    -> primary: WIRED, URL https://www.wired.com/story/a-security-pro-hacked-north-korean-hackers-he-found-theyd-breached-hundreds-of-networks-worldwide/
    (published 2026-08-05, disclosed at Black Hat USA 2026)'
  summary: Greek researcher Vangelis Stykas (CTO, Kumio), speaking at Black Hat USA 2026, disclosed nearly two years of persistent,
    self-obtained access into command-and-control infrastructure used by North Korean state-linked hacking operations -- gained
    after the operators' own workstations were infected by their own malware, which handed Stykas a foothold into their C2
    servers. From that vantage he monitored the operators' internal Slack and Discord channels and pulled roughly 5 TB of
    the attackers' own data, identifying 1,640 compromised organizations across 57 countries, of which 700-800 suffered severe
    intrusions including root-level access to servers, cloud accounts (including AWS), developer credentials and, at cryptocurrency
    firms, wallet/private-key material. Named victims disclosed at Black Hat include Coinbase, Uniswap Labs, Oppo, Boston
    Children's Hospital and Italy's Supreme Judicial Council. Stykas describes the dominant current initial-access vector
    as fake developer-recruiter social engineering -- posing as recruiters and delivering malware disguised as take-home coding-skill
    assessments -- with a deliberate focus on contract/service-provider staff as a pivot into multiple downstream client organizations.
    Wired reports North Korean actors stole $2.02B in cryptocurrency in 2025 (a 51% YoY increase) and were responsible for
    76% of global crypto-hack losses in the first four months of 2026; the report names Lazarus and Andariel among the responsible
    clusters. Stykas declined to disclose exactly how he obtained the initial C2 access.
  region_nexus: global; the disclosed fake-recruiter/contractor-pivot technique class is directly transferable to any organization
    using external developer contractors, incl. Swiss/EU public-sector and financial-sector suppliers
