- title: 'Unit 42 telemetry: 45% of malware with C2 activity bypasses DNS via direct-to-IP connections'
  sources:
  - url: https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/
    publisher: Palo Alto Networks Unit 42
    date: '2026-08-04'
    role: primary
  discovery_trace: 'first seen at: unit42 RSS listing sweep, URL https://unit42.paloaltonetworks.com/feed/ (post dated 2026-08-04)
    -> primary: Unit 42, URL https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/ (no further pivot needed)'
  summary: Unit 42 telemetry across its malware-sample corpus finds 45.32% of samples with any C2 activity made at least one
    direct-to-IP (hardcoded IP address, no DNS resolution) connection, and that D2IP traffic accounts for 23.17% of all observed
    C2 connection attempts (41.97% even after excluding bulk port-scanning noise). TCP dominates (94.43% of D2IP samples);
    observed techniques include IP addresses embedded as Unicode strings in binaries, custom obfuscated request formats, WebSocket
    connections to hardcoded addresses, and HTTP Range-header/User-Agent spoofing. Because no DNS lookup precedes the connection,
    this traffic is invisible to DNS-based security controls (protective DNS, DNS sinkholing, DNS anomaly detection).
  region_nexus: global
  primary_sector_nexus: indirect
  sector: cross-sector
  cves: []
  techniques:
  - T1071.001
  - T1095
  affected_products: []
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: new
  evidence:
  - quote: Almost half (45.32%) of malware samples with any command-and-control (C2) activity made at least one direct-to-IP
      (D2IP) address connection.
    attribution: Unit 42
    source_url: https://unit42.paloaltonetworks.com/malware-bypass-dns-direct-to-ip/
  extended_notes: 'Detection concept (telemetry class first): egress network-flow logs showing outbound connections to an
    IP with no preceding DNS query from the same host within the flow-correlation window is the portable hunt hook; the article''s
    own hardening recommendation (Zero Trust IP enforcement) is a Palo Alto product feature name and should not be carried
    into the entry as a vendor-specific control -- the underlying, vendor-neutral hardening lever is egress filtering / allowlisting
    outbound destinations to DNS-resolved, sanctioned IP ranges only.'
  borderline: true
  borderline_reason: Genuine telemetry-derived detection content, but framing leans toward promoting Unit 42's Zero Trust
    IP product feature; main agent should judge whether the vendor-neutral technical core clears the bar on its own.
- title: 'Microsoft Defender case study: automatic attack disruption isolates a ransomware-precursor intrusion at QNET within
    128 seconds'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/08/04/129-seconds-disruption-microsoft-defender-stops-ransomware-qnet/
    publisher: Microsoft Security Blog
    date: '2026-08-04'
    role: primary
  discovery_trace: 'first seen at: microsoft-security-blog RSS listing sweep, URL https://www.microsoft.com/en-us/security/blog/feed/
    (post dated 2026-08-04) -> primary: Microsoft, URL https://www.microsoft.com/en-us/security/blog/2026/08/04/129-seconds-disruption-microsoft-defender-stops-ransomware-qnet/
    (no further pivot needed)'
  summary: Microsoft describes a case study at QNET in which a malicious file (delivered via email/browser download) executed
    mshta.exe (System Binary Proxy Execution) leading to web-based C2 and a RunMRU registry-persistence attempt; Defender's
    behavioral and correlation engines both fired independently on the RunMRU activity, and the Automatic Attack Disruption
    pipeline isolated the device within 128 seconds of the first high-severity alert, before a named ransomware payload could
    be staged or lateral movement could occur. No ransomware family is named; the technique chain described (mshta.exe LOLBin
    execution, RunMRU persistence) is a well-established pattern rather than a novel one.
  region_nexus: global
  primary_sector_nexus: indirect
