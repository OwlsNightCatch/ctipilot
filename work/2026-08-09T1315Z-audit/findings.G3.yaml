    lures) matches the pattern this pipeline already tracks as the Contagious-Interview-class DPRK technique family (see campaign:contagious-interview
    in the registry) -- organizations onboarding external developer contractors should treat unsolicited recruiter contact
    bearing a ''coding assessment'' download as a standing phishing vector (T1566) regardless of which specific DPRK cluster
