- title: GOLD EMBRACE (Interlock) abuses Volatility3 and WinPmem forensic tools for in-memory credential extraction
  sources:
  - url: https://www.sophos.com/en-us/blog/2608-volatility-interlock/
    publisher: Sophos X-Ops
    date: '2026-08-04'
    role: primary
  discovery_trace: 'first seen at: sophos-xops RSS listing sweep, URL https://news.sophos.com/en-us/category/threat-research/feed/
    (post dated 2026-08-04, slug ''2608-volatility-interlock'') -> primary: Sophos X-Ops blog, URL https://www.sophos.com/en-us/blog/2608-volatility-interlock/
    (no further pivot needed)'
  summary: Sophos X-Ops documents an Interlock ransomware intrusion (Sophos tracks the operator as GOLD EMBRACE) in which
    the attacker used two legitimate open-source memory-forensics tools -- Volatility3 and WinPmem -- as offensive credential-access
    tooling rather than off-the-shelf commodity dumpers. After ClickFix-style initial access (a ChatGPT search result redirected
    the victim to a compromised legitimate website, voginc[.]com, that served a fake browser-update lure requiring the user
    to copy-paste a malicious command), the actor staged WinPmem to acquire a full physical-memory image and then ran Volatility3's
    windows.hashdump.Hashdump and windows.cachedump.Cachedump plugins offline against that image to recover local SAM hashes
    and cached domain credentials -- without ever touching LSASS or interacting with a live credential-dumping-monitored process
    on the victim host. Sophos assesses this continues a trend (following prior GOLD EMBRACE/Interlock abuse of Velociraptor)
    of ransomware affiliates repurposing legitimate DFIR/IR tooling as a detection-evasion layer for credential access. Time
    from initial access to domain-controller compromise was over 26 hours.
  region_nexus: global; technique is platform/tooling-based and directly portable to any Windows AD environment, incl. Swiss/EU
    public-sector and CI networks
  primary_sector_nexus: indirect
  sector: cross-sector
  cves: []
  techniques:
  - T1204.004
  - T1003.002
  - T1003.005
  - T1105
  affected_products:
  - Volatility3
  - WinPmem
  - Microsoft Windows Active Directory
  entity_keys: []
  new_entities:
