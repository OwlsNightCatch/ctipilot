    sentence enumerating the CNA scores in the CVE order 65766 / 65877 / 65878 / 65876, so a positional
    read maps 6.9 to CVE-2026-65877, 7.1 to CVE-2026-65878 and 7.2 to CVE-2026-65876 — all three wrong.
    Frontmatter/sourcing-note only; no reader-facing body claim, no cves[] value and no CNA score is affected.
