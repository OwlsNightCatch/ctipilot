    the CWE attributions and the "five issues, not four" claim verified correct.
  ground_truth: >
    mySites.guru's own CVSS 4.0 table maps its self-scores as: pre-auth SQL injection (CVE-2026-65766) 8.7 High;
    authenticated arbitrary file delete (CVE-2026-65878) 7.2 High; authenticated media-manager SQL injection
    (CVE-2026-65877) 7.1 High; unauthenticated mail relay (CVE-2026-65879) 6.9 Medium. CVE-2026-65876 carries
    no discloser self-score — "It is not one of the four issues we reported and we did not test it."
    Confirmed correct in the entry: Joomla CNA CVSS 4.0 9.2 (65766), 8.2 (65877), 8.3 (65878), 9.2 (65876);
    CVE-2026-65879 has NO CNA metrics and its 9.8 is a CISA-ADP CVSS 3.1 score (CWE-798) — exactly as the
