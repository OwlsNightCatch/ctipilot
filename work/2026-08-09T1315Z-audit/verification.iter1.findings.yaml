  summary: "T1190 and T1555 are well supported (REST-API exploitation; 'its vault of privileged credentials'). T1078.004 is Cloud Accounts (pin platforms: IaaS, Identity Provider, Office Suite, SaaS) — the body describes an on-premises appliance, a bypassed authentication layer and an attacker-CREATED product_administrator account ('a type=\"User\" creation granting the product_administrator profile'); no use of a cloud/federated account appears anywhere in the body. T1552.001 Credentials In Files names credentials discovered in files — no such behaviour is described; vault access is already carried by T1555. Behaviours the body/sources actually support and could carry instead: account creation (T1136.001) and, for the Access Manager flaw the entry describes, forged-SAML-response authentication (T1606.002)."
