  item: "2026-08-09/sharefile-cve-2026-2699-2701-never-kev-listed — cves[].fixed on BOTH records"
  url_or_quote: "fixed: \"Progress ShareFile Storage Zone Controller 5.12.5 / 6.0.2, per the vendor guidance recorded in the earlier coverage.\""
  summary: "Wrong patched release bound to both CVE ids. The entry's OWN cited source (BankInfoSecurity, https://www.bankinfosecurity.com/progress-urges-sharefile-shutdown-over-credible-threat-a-32210) says of CVE-2026-2699/2701: 'To address the flaws, the vendor advised users to update to version 5.12.4 or any version 6.' The 'earlier coverage' it invokes says the same: 2026-07-13/progress-sharefile-storage-zone-controller-shutdown carries fixed: \"5.12.4\" for both ids and states 'Both were fixed in Storage Zone Controller 5.12.4 (the 6.x .NET-Core branch was unaffected)', and 2026-07-14/progress-sharefile-szc-active-exploitation-confirmed carries fixed: \"5.12.4\". 5.12.5 / 6.0.2 are the fixes for the SEPARATE July path-traversal zero-day (2026-07-14/progress-sharefile-szc-path-traversal-zero-day-patched, whose cves[] is empty because that CVE was still reserved). Naming 6.0.2 as the fix is doubly wrong: the 6.x branch was never affected by 2699/2701. This is machine-consumed frontmatter answering 'is my version patched?' — the same harm class this run's Thermo Fisher correction exists to repair. Fix: fixed: \"Progress ShareFile Storage Zone Controller 5.12.4; the 6.x branch was not affected\" on both records, or drop the field and point to the 2026-07-13 entry."
