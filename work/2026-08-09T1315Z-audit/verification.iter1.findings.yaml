  item: "2026-08-09/cryptojs-cve-2026-71851-weak-entropy-exploited — body para 1 and cves[].affected"
  url_or_quote: "body: \"The version history is its own trap: a fix landed in 3.3.0 and was reverted because it was considered a breaking change\" ([GitHub Advisory Database, 2026-08-07](https://github.com/advisories/GHSA-rg76-677x-56q9)) / cves[].affected: \"a fix in 3.3.0 was reverted as a breaking change\""
  summary: "Fetched the cited GHSA page in this iteration. It says: 'It was introduced in 3.1.2-4 (June 2014 …) and was present in every 3.x release except 3.2.0 and 3.2.1.' and 'That change was reverted in 3.3.0 because it was considered a breaking change, so projects tracking the 3.x line could resolve to newer versions that still contained the weak generator.' Per the cited page the fix existed in 3.2.0/3.2.1 and 3.3.0 is where it was REVERTED — 3.3.0 is an affected release, not the release the fix landed in. The entry's own preceding clause ('present in every 3.x release except 3.2.0 and 3.2.1', repeated in summary and cves[].affected) contradicts it. Fix: 'the secure generator shipped in 3.2.0/3.2.1 and was reverted in 3.3.0 as a breaking change, so …'."
- code: F4
  category: hallucinated-fact
  section: entries
  item: "2026-08-09/cryptojs-cve-2026-71851-weak-entropy-exploited — techniques: [T1552.001, T1555, T1078]"
  url_or_quote: "techniques: [T1552.001, T1555, T1078]"
  summary: "None of the three names a behaviour the body describes. T1552.001 Credentials In Files and T1555 Credentials from Password Stores both require attacker access to victim-side storage; T1078 Valid Accounts requires use of an account. The body says the opposite in terms: 'there is no network or endpoint artefact for a secret that was weak at birth, and an attacker enumerating offline generates no traffic against the victim at all.' The behaviour the body and both cited sources DO describe is offline enumeration of a reduced keyspace ('small enough to enumerate on commodity hardware'; the GHSA PoC steps 'Enumerated the feasible outputs of the underlying PRNG … Recovered the private keys'), i.e. T1110 Brute Force / T1110.002 Password Cracking (both active in the v19.2 pin). Replace the mapping."
