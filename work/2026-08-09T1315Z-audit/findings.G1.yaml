  - title: "CERT Polska: previously unobserved OT attack vector via private cellular APN misconfiguration used in the December 2025 Polish energy-sector sabotage — second, previously undisclosed CHP-plant victim confirmed"
    sources:
      - { url: "https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/", publisher: "CERT Polska / NASK", date: "2026-08-08", role: primary }
    discovery_trace: "first seen at: cert-pl (essential slice), URL https://cert.pl/en/rss.xml (\"Follow-Up Report of the December 2025 Energy Sector Incident\") → primary: CERT Polska's own post, URL https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/ (no pivot needed; full PDF report linked but not machine-parsed for this return)"
    summary: |
      CERT Polska published a follow-up report on 2026-08-08 disclosing that the coordinated 29
      December 2025 destructive attack against Poland's energy sector — previously reported as
      targeting 30+ wind/solar installations and one large combined heat-and-power (CHP) plant
      (this pipeline's tracked incident:poland-energy-grid-attack-2025-12-29) — also struck a SECOND,
      smaller CHP plant supplying heat to 50,000 residents, an event not previously disclosed publicly.
      The attack shut down a steam turbine and the water-treatment system used to produce process
      water, interrupting cogeneration; prompt operator response limited the impact to a short-term
      outage with no disruption to heat supply. The three-month investigation that followed identified
      the attacker's device and reconstructed the attack path, and — per CERT Polska, "to the best of
      our knowledge" — represents the FIRST documented real-world use of a private APN (cellular
      Access Point Name) as an attack vector to reach an OT network. The attack vector was enabled by
      a misconfiguration allowing arbitrary devices within the private APN network to communicate with
      each other; CERT Polska's own survey of organizations using similar private-APN-based OT/IoT
      connectivity solutions found this misconfiguration "commonly encountered in Poland" and, per
      CERT Polska, believed to be "widely used in other countries around the world" as well. CERT
      Polska's Head, Marcin Dudek, presented the findings at DEF CON (Las Vegas) concurrent with this
      publication. The full technical report (PDF, not machine-parsed in this return) is stated to
      include CERT Polska's hardening recommendations for organizations using private-APN-based OT
      connectivity.
    region_nexus: "Poland; technique and recommendations transfer directly to any operator using private-APN cellular connectivity for OT/ICS, including Swiss/EU energy, water and transport infrastructure"
