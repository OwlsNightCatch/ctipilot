  # ============================================================
  # NEW ITEM 6 — CryptoJS / Ill Bloom (Coinspect)
  # ============================================================
  - title: "Twelve-year-old CryptoJS insecure-randomness flaw (CVE-2026-71851, CVSS 9.0) under ACTIVE EXPLOITATION draining cryptocurrency wallets — Coinspect's \"Ill Bloom\" investigation"
    sources:
      - { url: "https://www.coinspect.com/blog/ill-bloom-investigation/", publisher: "Coinspect Security", date: "2026-08-05", role: primary }
      - { url: "https://api.github.com/advisories/GHSA-rg76-677x-56q9", publisher: "GitHub Security Advisories (CVE-2026-71851)", date: "2026-08-07", role: primary }
    discovery_trace: "first seen at: github-advisory (rotation slice), URL https://api.github.com/advisories?per_page=30&sort=published&direction=desc → GHSA-rg76-677x-56q9 (CVE-2026-71851, severity critical) → pivot: GHSA description links to https://www.coinspect.com/blog/ill-bloom-investigation/ → primary: Coinspect's own investigation write-up, URL https://www.coinspect.com/blog/ill-bloom-investigation/ (published 2026-08-05, confirmed via the page's article:published_time meta tag)"
    summary: |
      CryptoJS.lib.WordArray.random() in crypto-js versions before 4.0.0 is not a cryptographically
      secure random number generator: the affected implementation was a custom variant of George
      Marsaglia's Multiply-With-Carry PRNG, seeded from Math.random(), introduced in 3.1.2-4 (June 2014)
      and present in every 3.x release except 3.2.0/3.2.1 (a later revert of a fix in 3.3.0 meant
      projects tracking the 3.x line stayed exposed). Nominal requests for 128 or 256 bits of entropy
      in fact produce effective search spaces of only ~2^39 and ~2^47 possibilities respectively — small
      enough to brute-force on commodity hardware; applying PBKDF2 or another KDF/hash afterward does
      not restore the missing entropy. Coinspect's "Ill Bloom" investigation, which began in May 2026
      after a wallet-drain incident initially attributed to a single product, found the flaw is
      significantly broader: multiple cryptocurrency wallet applications used this function as the
      entropy source for BIP39 recovery-phrase generation, and Coinspect confirms attackers were
      ALREADY EXPLOITING the weakness — draining wallets — while the investigation was still underway.
      Coinspect combined on-chain analysis (generating candidate recovery phrases with the vulnerable
      RNG, deriving addresses, and matching against blockchain transaction history) with public
      source-code research, dependency tracing and reverse engineering of historical application
      releases to confirm which wallet applications (including some now-discontinued and unremediated
      ones) had actually used the vulnerable code path during wallet generation, since merely depending
      on crypto-js < 4.0.0 does not by itself mean an application is exploitable — only a use of the
      RNG for a security-sensitive value is. Coinspect published a public address-checker at
      illbloom.org so affected users can verify exposure, and coordinated with "relevant parties" and
      emergency-response organizations before staged disclosure. crypto-js 4.0.0 (2020) replaced the
      generator with the platform's native cryptographic API, so applications on 4.x are unaffected;
      the residual risk is any application still pinned to a pre-4.0.0 dependency and any already-generated
      secrets (wallet seeds, but potentially any session token, API key or cryptographic value an
      application generated via this function) that were derived while vulnerable.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "finance, technology"
    cves: [CVE-2026-71851]
    techniques: [T1552.001, T1600]
    affected_products: ["crypto-js (npm package, versions before 4.0.0)"]
    entity_keys: []
    new_entities:
      - { key: "report:coinspect-ill-bloom-cryptojs-2026", type: report, name: "Coinspect \"Ill Bloom\" investigation (CryptoJS insecure-randomness wallet-drain)", aliases: ["Ill Bloom"], summary: "Coinspect Security's investigation into a twelve-year-old insecure-randomness flaw in CryptoJS (CVE-2026-71851) that was under active exploitation draining cryptocurrency wallets whose recovery phrases were generated with the vulnerable RNG (Coinspect, 2026-08-05)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "Nominal requests for 128 or 256 bits of entropy produce effective search spaces of approximately 2^39 and 2^47 possibilities — small enough to enumerate on commodity hardware."
        attribution: "GitHub Security Advisory GHSA-rg76-677x-56q9 (citing Coinspect)"
        source_url: "https://api.github.com/advisories/GHSA-rg76-677x-56q9"
      - quote: "The vulnerability had existed for more than a decade, making it difficult to determine how widely the vulnerable implementation had spread, and attackers were already exploiting it while our investigation was underway."
        attribution: "Coinspect Security"
        source_url: "https://www.coinspect.com/blog/ill-bloom-investigation/"
      - quote: "During the investigation, we were able to identify vulnerable wallets before they were drained and worked with relevant parties to help protect affected users despite the practical limitations of responding to an incident of this kind."
        attribution: "Coinspect Security"
        source_url: "https://www.coinspect.com/blog/ill-bloom-investigation/"
    extended_notes: |
      Detection/hardening for defenders whose applications embed crypto-js (not just wallet vendors):
      audit any use of CryptoJS.lib.WordArray.random() for security-sensitive values (keys, tokens,
      session identifiers, password-reset codes) generated while on a pre-4.0.0 dependency, and treat
      any such value as potentially forgeable/predictable regardless of subsequent hashing. This is a
      supply-chain-shaped finding: the vulnerable code path is a dependency internals issue, not
      something visible in an application's own code, so a software-composition-analysis sweep for
      crypto-js < 4.0.0 combined with a check of what that dependency was used for is the concrete
      action.

