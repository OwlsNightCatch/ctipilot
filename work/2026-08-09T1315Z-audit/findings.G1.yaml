    discovery_trace: "first seen at: anssi-fr (essential slice), URL https://www.cert.ssi.gouv.fr/avis/feed/ (\"Multiples vulnérabilités dans les produits Wallix (06 août 2026)\") → drilled CERTFR-2026-AVI-0974, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0974/ (no CVE id or vendor bulletin date visible in the advisory body beyond \"Bulletin de sécurité Wallix du 20 juillet 2026\") → pivot: WebSearch (\"Wallix Bastion Access Manager SAML vulnerability CVE 2026\") → primary: WALLIX's own alerts page, URL https://www.wallix.com/support-services/alerts/, which carries the full WSA-2026-07-0001 and WSA-2026-07-0002 advisory text"
    summary: |
      WALLIX (a French privileged-access-management vendor with significant EU/Swiss public-sector and
      critical-infrastructure deployment) disclosed two vulnerabilities dated 20 July 2026 that its own
      alerts page still lists as the most recent entries, and that CERT-FR/ANSSI relayed for the first
      time to its constituency on 2026-08-06 (CERTFR-2026-AVI-0974) — this pipeline had no prior Wallix
      coverage. WSA-2026-07-0001 is CRITICAL (CVSS 4.0 base 10.0, CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H,
      CWE-290/CWE-287): an unauthenticated, no-user-interaction flaw in the WALLIX Bastion REST API
      lets a remote attacker with only network access to the API endpoint (typically HTTPS/443) obtain
      full administrative privileges — "complete control over the Bastion, including its configuration,
      its vault of privileged credentials, and its session recordings." Affects Bastion 12.3.0–12.3.6
      and 12.4.0; fixed in 12.3.7 and 12.4.1+; Bastion 12.0.x and versions before 12.3.0 are not
      affected. WSA-2026-07-0002 is HIGH (CVSS 4.0 base 8.7, CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L/SC:L/SI:L/SA:N):
      an unauthenticated attacker with network access to the Access Manager portal's SAML Service
      Provider can obtain an authenticated administrator session without valid credentials, and because
      the Access Manager brokers access to a fleet of Bastions, that session reaches every target and
      privileged credential the portal is configured to broker. Both were reported by Fabien J.
      (SNS-Security); WALLIX states the independent researchers intend to publish full technical
      details in September 2026, and is urging customers to patch before that public disclosure window
      closes. WALLIX withholds exploitation technical detail from the public advisory but publishes a
      concrete detection recipe for WSA-2026-07-0001: state-changing actions are logged to
      /var/log/wabaudit.log in the form `action="<verb>" type="<Object>" object="<name>" user="<actor>"
      client_ip="<ip>" infos="<changed fields>"`, and the primary compromise indicator is any
      state-changing wabaudit.log entry (especially "add" of a product_administrator user) whose
      client_ip is 127.0.0.1, because a session obtained through the flaw acts as an internal service
      account from the loopback address — something a legitimate administrator action never produces.
      WALLIX explicitly states exploitation can be entirely invisible if log retention does not extend
      back before the first vulnerable release (10 Feb 2026) and recommends rotating all vault secrets
      and Bastion admin/API credentials as a precaution on any network-reachable affected appliance.
