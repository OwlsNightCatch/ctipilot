  # NEW ITEM 2 — n8n
  # ============================================================
  - title: "n8n fixes 17 vulnerabilities (2026-08-05) including two authenticated sandbox-escape RCEs (JS Task Runner prototype pollution; MCP node-schema path traversal)"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2681", publisher: "BSI CERT-Bund (WID-SEC-2026-2681)", date: "2026-08-07", role: primary }
      - { url: "https://api.github.com/repos/n8n-io/n8n/security-advisories/GHSA-m3hg-p5r9-fg9h", publisher: "n8n / GitHub Security Advisories", date: "2026-08-05", role: primary }
      - { url: "https://api.github.com/repos/n8n-io/n8n/security-advisories/GHSA-6h4x-896x-fw5m", publisher: "n8n / GitHub Security Advisories", date: "2026-08-05", role: primary }
      - { url: "https://api.github.com/repos/n8n-io/n8n/security-advisories/GHSA-953p-jm2c-8h5j", publisher: "n8n / GitHub Security Advisories", date: "2026-08-05", role: primary }
      - { url: "https://api.github.com/repos/n8n-io/n8n/security-advisories?per_page=30", publisher: "n8n / GitHub Security Advisories (listing)", date: "2026-08-05", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de (rotation slice), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss → drilled WID-SEC-2026-2681, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2681 (18 GHSA references) → primary: n8n's own GitHub Security Advisories via the GitHub REST API listing https://api.github.com/repos/n8n-io/n8n/security-advisories?per_page=30, cross-referenced by published_at to isolate the 2026-08-05 batch from an older 2026-07-22 batch the same listing carries"
    summary: |
      n8n, a widely self-hosted workflow-automation platform, published 17 security advisories on
      2026-08-05, fixed in n8n 1.123.69 / 2.33.4 / 2.34.1 (all require some level of authenticated
      access — none are pre-auth). The two most severe are sandbox escapes: GHSA-m3hg-p5r9-fg9h
      ("JavaScript Task Runner VM Sandbox Escape via EventEmitter Prototype Pollution Leads to Remote
      Code Execution") — the JS task runner's prototype-freezing routine covered globalThis functions
      but not internal module constructors such as EventEmitter, so an authenticated Code-node user
      pollutes a process-wide object and the corruption persists across every other tenant's
      subsequently-scheduled Code-node execution on the same shared runner; on v1.x instances without
      task runners enabled, Code-node JavaScript runs directly in the main n8n process, raising the
      impact ceiling further. GHSA-6h4x-896x-fw5m is RCE in the n8n main process via path traversal in
      MCP node-schema loading: the @n8n/workflow-sdk node-schema loader derives a schema module path
      directly from an attacker-supplied node-type string with no path-traversal check, letting a
      global:member-privileged user reference arbitrary files and achieve code execution in the main
      process. The batch also includes a MongoDB-node NoSQL injection via unescaped expression
      interpolation into Find/Delete/Aggregate operations (GHSA-953p-jm2c-8h5j), a Supabase-node
      PostgREST filter injection, a Form-node CSP-bypass stored XSS, a Git-node code-execution path via
      unchecked repository-local git configuration, a GraphQL-node raw-error re-throw that leaks
      decrypted credential headers into persisted execution data, multiple SSRF-protection bypasses
      (OAuth2 credential token exchange, SearXNG tool, Edit-Image-node), and a ReDoS in filter/switch
      regex matching. No CVE ids are assigned to any of the 17 as of this fetch; GHSA is the only
      identifier and the GitHub Security Advisory pages are the primary source. A separate,
      earlier (2026-07-22) n8n GHSA batch on the same listing endpoint — including further sandbox-escape
      and credential-exfiltration flaws — falls outside this 7-day window and is not part of this item.
    region_nexus: "global; n8n is self-hosted widely across EU public-sector and SME automation deployments"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology, finance"
    cves: []
    techniques: [T1610, T1059.007, T1552.001, T1071.001]
    affected_products: ["n8n"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "An authenticated user with Code node access could exploit this gap to execute arbitrary commands within the runner container. Because the polluted prototype is a single process-wide object, the corruption persists across every other tenant's Code node execution subsequently scheduled on that same shared runner"
        attribution: "n8n (GitHub Security Advisory GHSA-m3hg-p5r9-fg9h)"
        source_url: "https://api.github.com/repos/n8n-io/n8n/security-advisories/GHSA-m3hg-p5r9-fg9h"
      - quote: "The @n8n/workflow-sdk node-schema loader derived a node's schema module path directly from the attacker-supplied node type string, without checking for path-traversal sequences. An authenticated user with global:member privileges could reference malicious files through a path traversal, causing a code execution in the n8n main process."
        attribution: "n8n (GitHub Security Advisory GHSA-6h4x-896x-fw5m)"
        source_url: "https://api.github.com/repos/n8n-io/n8n/security-advisories/GHSA-6h4x-896x-fw5m"
    extended_notes: |
      All 17 require authentication of some level, so exposure is bounded by how broadly workflow-editor
      accounts are granted in a given deployment — multi-tenant / shared n8n instances (common in MSP
      or platform-team-run automation) are the highest-risk configuration since the sandbox-escape flaws
      let one tenant's low-privilege Code-node access affect others sharing a runner.

