      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-gj9h-8hmr-xjjr", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-41424)", date: "2026-08-07", role: primary }
      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-cqvw-w2rg-327f", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-46343)", date: "2026-08-07", role: primary }
      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-3978-44q9-9px9", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-44255)", date: "2026-08-07", role: primary }
      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-9c4x-mrjh-rmw5", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-49392)", date: "2026-08-07", role: primary }
      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-9wm4-fp6c-hqgq", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-44254)", date: "2026-08-07", role: primary }
      - { url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-c3m6-fp2h-wmr4", publisher: "Wazuh / GitHub Security Advisories (CVE-2026-44256)", date: "2026-08-07", role: primary }
    discovery_trace: "first seen at: bsi-de (rotation slice), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss → drilled WID-SEC-2026-2699, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2699 → primary: Wazuh's own GitHub Security Advisories via the GitHub REST API (bridge url https://api.github.com/repos/wazuh/wazuh/security-advisories/<GHSA-id>), ten separate advisory records fetched"
    summary: |
      Wazuh — an open-source SIEM/XDR platform used by public-sector and enterprise SOCs — disclosed
      ten vulnerabilities on 2026-08-06/07, all fixed in wazuh-manager 4.14.6 (one, CVE-2026-41424, was
      already fixed earlier in 4.10.4). Two reach CRITICAL 9.1 (CVSS:3.1) via the cluster protocol: CVE-2026-49441
      is an arbitrary file write under WAZUH_PATH — a cluster peer holding the Fernet key can overwrite
      /var/ossec/etc/ossec.conf via a crafted files_metadata.json in the non-merged branch of
      DistributedAPI.process_files_from_worker (framework/wazuh/core/cluster/master.py:882-935), reaching
      the same wazuh-logcollector root-RCE chain as an earlier flaw (CVE-2026-25770) that this one
      bypasses; CVE-2026-48024 is a sibling merged-file-header path-traversal in cluster sync with the
      same WAZUH_PATH arbitrary-write impact. CVE-2026-44901 (CWE-502, CVSS 8.4) is a pre-auth-adjacent
      deserialization RCE: the DAPI merge() function in framework/wazuh/core/results.py resolves a
      worker-supplied "sort_casting" field against Python builtins with no allowlist (casters =
      [getattr(builtins, type_) for type_ in types]), so a compromised worker sets sort_casting=["exec"]
      and the master executes attacker payload as root when merging cluster responses. CVE-2026-45798
      (CWE-121/170, CVSS 7.5) is a pre-auth stack buffer overflow reachable from wazuh-authd on TCP/1515:
      compare_wazuh_versions() in src/shared/src/version_op.c uses strncpy(ver, version, 9) into a
      char[10] buffer without NUL-termination guarantee, triggered by a single 38-byte enrollment
      message's "V:" field over the default anonymous-SSL listener. CVE-2026-41424 (CWE-863, CVSS 8.2)
      is a privilege-escalation via admin-protection bypass in the update-user API endpoint. The
      remaining five are medium-severity: local FIM-database SQL injection via path-lookup
      interpolation in wazuh-syscheckd (CVE-2026-49392), stack out-of-bounds write in remoted's decompression path
      (CVE-2026-44254), CRLF log injection via unsanitized Basic-Auth username (CVE-2026-44256), arbitrary
      file deletion via incomplete path validation in end_receiving_file() (CVE-2026-46343, CVSS 7.5),
      and an unauthenticated username-enumeration timing side-channel via a ~125ms bcrypt-vs-immediate-return
      gap in check_user() (CVE-2026-44255, CVSS 5.3). No CVE record is yet published on MITRE's own
      cveawg.mitre.org API for any of the ten (CVE_RECORD_DNE) — GitHub's own Security Advisory pages,
      fetched via the GitHub REST API, are the only primary source currently available. No exploitation
      is reported for any of the ten.
    region_nexus: "global; Wazuh is widely self-hosted in EU public-sector and SOC environments"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology, energy, healthcare, finance, telco"
    cves: [CVE-2026-49441, CVE-2026-48024, CVE-2026-44901, CVE-2026-45798, CVE-2026-41424, CVE-2026-46343, CVE-2026-44255, CVE-2026-49392, CVE-2026-44254, CVE-2026-44256]
    techniques: [T1210, T1068, T1552.001, T1499, T1087.002]
    affected_products: ["Wazuh (wazuh-manager)"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "A cluster peer holding the Fernet key can overwrite /var/ossec/etc/ossec.conf and other security-sensitive files on the master by uploading one crafted extra-valid archive."
        attribution: "Wazuh (GitHub Security Advisory GHSA-3v57-hgvj-3vj2)"
        source_url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-3v57-hgvj-3vj2"
      - quote: "A compromised worker can set sort_casting=[\"exec\"] and embed a Python payload inside affected_items. When the master merges responses from two or more nodes, it calls exec(<payload>) as root."
        attribution: "Wazuh (GitHub Security Advisory GHSA-8c6v-7g3w-prrq)"
        source_url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-8c6v-7g3w-prrq"
      - quote: "A single 38-byte message reliably triggers the OOB read; in production builds where stack memory is not zero-initialized between calls in a long-running daemon, the bug fires deterministically."
        attribution: "Wazuh (GitHub Security Advisory GHSA-4fvp-jfc3-qr6r)"
        source_url: "https://github.com/wazuh/wazuh/security/advisories/GHSA-4fvp-jfc3-qr6r"
    extended_notes: |
      Detection: cluster-protocol traffic between Wazuh master and worker nodes is the primary telemetry
      class for the two critical file-write flaws and the deserialization RCE — inspect the DAPI/cluster
      channel for files_metadata.json payloads naming paths outside expected archive members, and for
      merge responses carrying non-standard sort_casting values. For the wazuh-authd overflow, TCP/1515
      connection logs / process-crash telemetry on the authd worker process around enrollment attempts
      are the anchor. Hardening: authd should not be reachable from untrusted networks; cluster nodes
      should be mutually authenticated and network-isolated so a compromised worker cannot reach the
      master's DAPI merge path.

