watch_item_recheck:
  - id: "zscaler-teleshim-part2"
    question: "Has Zscaler ThreatLabz TELESHIM series Part 2 published? What new technical/attribution detail does it carry?"
    answer: >
      YES — published 2026-08-03 at https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2
      (fetched and verified this run). Part 2 details BINDCLOAK, a previously undocumented 64-bit modular
      C++ Windows backdoor deployed in post-compromise activity against Middle Eastern government entities
      (energy-sector focus), using dual-layer XOR encryption (rolling 105-byte key + random 83-byte key)
      plus zlib compression over TLS/TCP for C2, and EDR evasion via reflective DLL loading with
      RtlQueueWorkItem used to mask LoadLibrary calls from unbacked memory. New attribution detail: ThreatLabz
      states "ThreatLabz assesses with high-confidence that BINDCLOAK is a variant of OctLurk" based on shared
      SSL-certificate/infrastructure overlap and code similarity with the OctLurk backdoor (previously profiled
      by Kaspersky/Securelist, https://securelist.com/octlurk-silklurk-backdoors-central-asia/120840/), which
      ThreatLabz frames as an East Asia-linked actor expanding operations from Central Asia into the Middle East
      energy vertical. No specific victim country/organization is named in Part 2. No Swiss/EU nexus stated by
      the source — this is Middle East government/energy-sector targeting; flagged here for the standing watch
      item but not carried forward as a G2 item (out of this domain's home-region/incident scope; a candidate
      for the S3 research domain if not already picked up there).
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2", publisher: "Zscaler ThreatLabz", date: "2026-08-03", role: primary }
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1", publisher: "Zscaler ThreatLabz", date: "2026-07", role: corroborating }

  - id: "french-leak-claims-banatic-interior-sdis"
    question: "Unconfirmed French leak-site claims (BANATIC / Interior Ministry / four SDIS) — closed on continued silence by the 2026-08-02 audit. Has genuine first-party or A/B-grade confirmation since appeared?"
    answer: >
      NO NEW CONFIRMATION FOUND — the CLOSED verdict stands, and duty explicitly says not to re-open on
      silence. Searched (2026-08-09) for BANATIC, Ministère de l'Intérieur agents, and the four SDIS
      (Alpes-Maritimes, Marne, Alpes-de-Haute-Provence, Landes) claims; every hit traces back to the original
      July 2026 claim dates (BANATIC claimed 2026-07-20; Interior Ministry agents claimed 2026-07-26; SDIS
      claims dated 2026-07-24) with no fresh government or A/B-journalism confirmation layered on top. Checked
      one candidate first-party channel — French National Assembly written questions (questions écrites) — and
      read QE n°12799 (a general question about "l'échec de la politique de cybersécurité de l'État," published
      2026-02-10, itself outside the audit window and pre-dating these claims) in full via PDF: it does not
      name BANATIC, the Interior Ministry leak, or any SDIS, and carries no government response/confirmation.
      No other first-party statement found. A frenchbreaches.com alert on the SDIS de la Marne claim
      (https://frenchbreaches.com/alertes/service-d-partemental-d-incendie-et-de-secours-51-sdis-mrz3sudn787b60zlp9l)
      explicitly still states the claim's authenticity "reste[nt]... à confirmer indépendamment" as of that
      page's content — no change in status. Recommend the main agent keep these CLOSED; do not resurrect
      without a genuine SDIS/Ministère de l'Intérieur/DGSCGC statement or CERT-FR advisory.
    sources:
      - { url: "https://frenchbreaches.com/alertes/service-d-partemental-d-incendie-et-de-secours-51-sdis-mrz3sudn787b60zlp9l", publisher: "FrenchBreaches", date: "2026-07-24", role: "checked, no change" }
      - { url: "https://questions.assemblee-nationale.fr/dyn/17/questions/QANR5L17QE12799", publisher: "Assemblée Nationale (written question)", date: "2026-02-10", role: "checked, not applicable — no mention of these specific incidents, no response on record" }

  - id: "weekly-w29-kev-claim-verification"
    question: >
      weekly-w29-exploited-internet-facing-enterprise-software (2026-07-19) claims 'every CVE it names was
      KEV-listed.' Two of them reportedly absent from today's KEV catalogue — verify CVE ids, check whether
      the claim was true as written on 2026-07-19, and report exact CVEs present/absent.
    answer: >
      CONFIRMED FALSE AS WRITTEN — checked the live CISA KEV catalog via `python3 tools/fetch_source.py
      cisa-kev` (catalogVersion 2026.08.07, dateReleased 2026-08-07T16:45:47Z, 1662 entries, fetched
      2026-08-09). The weekly entry's own body text and its nine referenced sub-entries name these CVE ids
      for the four highlighted "classes": SonicWall SMA1000 (CVE-2026-15409, CVE-2026-15410), Progress
      ShareFile Storage Zone Controller (CVE-2026-2699, and its chain partner CVE-2026-2701 named in the
      referenced 2026-07-13 sub-entry), Oracle E-Business Suite Payments (CVE-2026-46817), Microsoft AD FS /
      SharePoint (CVE-2026-56155, CVE-2026-56164, CVE-2026-58644, plus CVE-2026-32201 and CVE-2026-45659
      quoted from CISA's own alert). Present in today's KEV catalog: CVE-2026-15409 (added 2026-07-14),
      CVE-2026-15410 (2026-07-14), CVE-2026-46817 (2026-07-15), CVE-2026-56155 (2026-07-14), CVE-2026-56164
      (2026-07-14), CVE-2026-58644 (2026-07-16), CVE-2026-32201 (2026-04-14), CVE-2026-45659 (2026-07-01) —
      all eight added well before the entry's 2026-07-19 publish date, so those parts of the "every one
      KEV-listed" claim were accurate when written. ABSENT from today's KEV catalog: CVE-2026-2699 (CVSS 9.8,
      pre-auth CWE-698 execution-after-redirect auth bypass in ShareFile SZC `/ConfigService/Admin.aspx`) and
      CVE-2026-2701 (CVSS 9.1, chained storage-repointing RCE) — NEITHER has ever been added to KEV, per the
      current catalog (KEV entries are never removed once added, so today's absence is strong evidence the
      claim was already false on 2026-07-19, not a case of later removal). This is despite Shadowserver
      honeypots recording active in-the-wild exploitation attempts against CVE-2026-2699 starting
      2026-07-10, reported by BankInfoSecurity on 2026-07-13 and cited approvingly inside the weekly entry
      itself and its referenced 2026-07-14 sub-entry (whose own `cves[]` frontmatter lists both CVE-2026-2699
      and CVE-2026-2701 with status `exploited`/`poc-public`, correctly, but without a `kev-listed` claim —
      the false claim is specific to the 2026-07-19 weekly synthesis's summary-line "every one KEV-listed").
      Net: 8 of 10 distinct CVE ids named across the story were KEV-listed as claimed; the ShareFile pair
      (2 of 10) was not and still is not. Recommend the main agent issue a correction note (e.g. a dated
      addendum on the weekly entry or an update entry) stating the ShareFile CVE pair was never KEV-listed
      despite confirmed active exploitation.
    cves_checked:
