  - title: "Żabka (Poland) supply-chain-style breach: compromised external vendor account reaches Jira, then embedded credentials pivot into GitLab/production infrastructure"
    sources:
      - { url: "https://sekurak.pl/potencjalny-wyciek-danych-z-zabki/", publisher: "sekurak.pl", date: "2026-08-03", role: primary }
      - { url: "https://niebezpiecznik.pl/post/zabka-zhackowana-co-wycieklo/", publisher: "niebezpiecznik.pl", date: "2026-08-03", role: primary }
    discovery_trace: "first seen at: WebSearch (\"wyciek danych atak hakerski Polska sierpień 2026 samorząd\") → pivot: sekurak.pl, URL https://sekurak.pl/potencjalny-wyciek-danych-z-zabki/ → corroborating/independent: niebezpiecznik.pl, URL https://niebezpiecznik.pl/post/zabka-zhackowana-co-wycieklo/ — both cite Żabka's own confirming statement inline"
    summary: |
      Polish convenience-store chain Żabka (~10,000+ franchise locations) confirmed unauthorized access to "selected technical resources supporting franchisor-franchisee information exchange," detected in the final week of July 2026, entering via a compromised external service-provider (vendor) account — Żabka's own statement: "Do zdarzenia doszło przy wykorzystaniu konta zewnętrznego dostawcy usług." Two independent Polish security-research outlets (sekurak.pl, niebezpiecznik.pl), both citing a criminal-forum listing, report the attacker reached Żabka's Jira instance (~541,000 tickets, ~229,734 IT support tickets) and pivoted from credentials embedded in Jira/repo content into 89 GitLab repositories (~11,739 files) containing source code and infrastructure-as-code (Helm, ArgoCD, Terraform, Istio manifests); niebezpiecznik.pl specifically reports a single GitLab Personal Access Token reused across all 89 repositories, plus five production messaging passwords, Solace message-broker credentials, and MongoDB admin credentials, which the outlet states would have given "live access to production systems." Data timestamps in the leaked corpus range 2022 through 2026-07-29. Żabka states transaction data, the Żappka consumer app, and store operations were not affected, and it has notified Poland's data-protection authority (UODO) and law enforcement; Poland's Ministry of Digital Affairs (Minister Gawkowski) publicly commented, characterising the company's response as prompt and confirming no Żappka customer data leaked.
    region_nexus: "Poland — EU member state, home-region coverage focus"
    primary_sector_nexus: "indirect — private retail, but government (Ministry of Digital Affairs) publicly engaged"
    sector: "retail"
    cves: []
    techniques: [T1199, T1552.001, T1078]
    affected_products: ["Atlassian Jira", "GitLab"]
    entity_keys: []
    new_entities:
      - { key: "incident:zabka-vendor-jira-gitlab-breach-2026-07", type: incident, name: "Żabka vendor-account-to-Jira-to-GitLab breach (2026-07)", aliases: [], summary: "Compromise of a Żabka external vendor/service-provider account led to Jira ticket-system access and, via embedded credentials, to source code and production secrets across 89 GitLab repositories; confirmed by Żabka 2026-08-04, reported by sekurak.pl and niebezpiecznik.pl 2026-08-03." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Do zdarzenia doszło przy wykorzystaniu konta zewnętrznego dostawcy usług."
        attribution: "Żabka official statement, via sekurak.pl"
        source_url: "https://sekurak.pl/potencjalny-wyciek-danych-z-zabki/"
      - quote: "GitLab Personal Access Token (reused across all 89 repositories), 5 production messaging passwords, Solace broker credentials, MongoDB admin passwords...providing live access to production systems"
        attribution: "niebezpiecznik.pl"
        source_url: "https://niebezpiecznik.pl/post/zabka-zhackowana-co-wycieklo/"
      - quote: "Zapewniamy, że bezpieczeństwo danych transakcyjnych i usług konsumenckich, poufność danych aplikacji 'Żappka' oraz działalność operacyjna pozostają nienaruszone."
        attribution: "Żabka official statement, via sekurak.pl"
        source_url: "https://sekurak.pl/potencjalny-wyciek-danych-z-zabki/"
    extended_notes: |
      Strong transferable lesson for any org with third-party/vendor access to a shared Jira/ticketing instance: the chain here is vendor-account compromise → ticketing-system access → credential harvesting from tickets/repos → single reused PAT unlocking dozens of repos → production message-broker and database credentials. Detection concept: alert on a single PAT or service credential authenticating across an unusually broad set of repositories in a short window; audit Jira/Confluence/ticket content for pasted secrets (the initial exposure vector for the repo credentials). Hardening: per-repository scoped tokens instead of one broad PAT, secret-scanning on ticket attachments/comments, and treating third-party/reseller support accounts as a distinct, more tightly scoped trust tier from employee accounts.
    borderline: true
    borderline_reason: "Private retail chain, not core Swiss/EU government or critical-infrastructure constituency; included for the transferable vendor-account/credential-reuse TTP lesson and the Polish government's public engagement (Ministry of Digital Affairs comment), not for direct constituency nexus."

