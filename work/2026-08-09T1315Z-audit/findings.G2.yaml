  - title: "Verbandsgemeinde Rhein-Nahe (Rheinland-Pfalz) ransomware attack: three weeks into recovery, citizen services still restricted, perimeter breach not phishing"
    sources:
      - { url: "https://www.wochenblatt-reporter.de/c-ratgeber/cyberangriff-in-rhein-nahe-buergerdienste-eingeschraenkt_a846282", publisher: "Wochenblatt Reporter", date: "2026-08-07", role: primary }
      - { url: "https://www.egovernment.de/als-waere-man-aus-seinem-eigenen-haus-ausgesperrt-a-e3b12a9e53b5cf8528f784906b4f1c25/", publisher: "eGovernment Computing", date: "2026-08-07", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Verbandsgemeinde Rhein-Nahe Cyberangriff August 2026\") → pivot: Wochenblatt Reporter, URL https://www.wochenblatt-reporter.de/c-ratgeber/cyberangriff-in-rhein-nahe-buergerdienste-eingeschraenkt_a846282 → corroborating: eGovernment Computing, URL https://www.egovernment.de/als-waere-man-aus-seinem-eigenen-haus-ausgesperrt-a-e3b12a9e53b5cf8528f784906b4f1c25/ (both fetched 2026-08-09, both publish-dated 2026-08-07, in-window)"
    summary: |
      German municipal administration Verbandsgemeinde Rhein-Nahe (Mainz-Bingen district, Rheinland-Pfalz) has been running restricted citizen services, financial administration and email for three weeks following a ransomware attack first discovered 2026-07-16. Mayor Benedikt Seemann states the intrusion was not phishing or an internal trojan but an external perimeter breach ("nicht durch einen Bedienfehler oder eine Phishing-Mail... die äussere Absicherung der IT wurde von aussen durchbrochen"); investigators trace attacker IP activity to Russia and other countries. Attackers encrypted systems and left an extortion note with contact details and a ransom demand; the administration reports no internal data loss to date but was locked out of its own systems. Payment processing for time-critical obligations (refugee assistance, social-welfare payments) was restored first; full recovery is estimated at one to two more weeks, with remediation costs (external incident-response contractor) in the mid-to-high five-figure range. This is the ninth municipal-level ransomware incident reported in Rheinland-Palatinate in 2026 (versus ten for all of 2025), per regional reporting. No group has publicly claimed the attack at time of writing.
    region_nexus: "Germany (Rheinland-Pfalz) — EU neighbour, home-region coverage focus"
