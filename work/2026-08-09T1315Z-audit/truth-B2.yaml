- entry: entries/2026-08-04/cve-2026-20079-cisco-secure-fmc-auth-bypass-root-hotfix.md
  verdict: imprecision
  defect: >
    Body states the Cisco advisory's compromise-check "has revised that check three times
    since — v2.1 and v2.2 the same day, v2.3 on 2026-08-03." The advisory's own live revision
    history table (fetched 2026-08-09) shows v2.1 and v2.2 both dated 2026-JUL-31 (matches),
    but v2.3 dated 2026-AUG-05, not 2026-08-03, and carries a v2.4 (also 2026-AUG-05, "Updated
    hotfix information") not mentioned in the entry. The entry was authored/run on 2026-08-04,
    so it could not have known about the Aug-05 revisions; the discrepancy is most likely
    Cisco having since re-dated/renumbered the v2.3 entry when it added v2.4, rather than an
    authoring error, but the citation no longer supports the specific "2026-08-03" date as
    written.
  ground_truth: >
    Live Cisco advisory (sec.cloudapps.cisco.com/.../cisco-sa-onprem-fmc-authbypass-5JPp45V2)
    revision-history table: 1.0=2026-MAR-04, 2.0=2026-JUL-31, 2.1=2026-JUL-31, 2.2=2026-JUL-31,
    2.3=2026-AUG-05 ("Updated CLI command"), 2.4=2026-AUG-05 ("Updated hotfix information").
    All other cited facts (CVSS 10.0, CWE-288, affected trains, hotfix build numbers, the
    VulnCheck exploit-chain mechanics, the ~300/600-700 internet-facing-instance counts) verify
    exactly against the CVE record and the VulnCheck blog.
  ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2

