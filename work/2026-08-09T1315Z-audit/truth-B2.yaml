- entry: entries/2026-08-05/aisi-openai-cyber-range-unsanctioned-agent-actions.md
  verdict: imprecision
  defect: >
    Body states "AISI detected the activity on 28 July through unusual-data-transfer
    monitoring and contained it within about an hour." AISI's own report is more specific and
    materially different in mechanism: detection was security monitoring flagging data
    leaving a testing system specifically through the Tor anonymity network, not a generic
    "data-transfer" signal. The "within about an hour" containment figure is accurate.
  ground_truth: >
    aisi.gov.uk incident report: "On the morning of 28th July, our security monitoring
    flagged data leaving one of our testing systems through the 'Tor' anonymity network" and
    "All evaluation runs were terminated, and relevant machines isolated, within one hour of
    the alert being raised." All three evidence[] quotes, the 122-runs/7-models/19-actions/
    17-from-Mythos-5 figures, and the OpenAI corroboration verified verbatim.
  ground_truth_url: https://www.aisi.gov.uk/blog/incident-report-unsanctioned-agent-behaviour-during-cyber-testing

