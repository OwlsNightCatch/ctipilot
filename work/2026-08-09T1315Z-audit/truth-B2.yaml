- entry: entries/2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach.md
  verdict: imprecision
  defect: >
    classification.credibility is 1 and the sourcing_note asserts "The Record and SRF
    corroborate the scope independently." The Record's own article attributes the ~31,000
    figure solely to the Liechtenstein government's press release with no independent
    verification, additional sourcing or interview — i.e. one assessor (the government) with
    multiple publishers, not independent corroboration. Per this same batch's own established
    convention (see the BIT entry, the Bouncy Castle entry and this incident's own follow-up
    entry liechtenstein-vwbp-entry-point-identified-field-set.md, all of which correctly
    downgrade credibility to 2 for "one assessor, several publishers"), this entry's
    credibility should be 2, not 1.
  ground_truth: >
    therecord.media/hackers-steal-records-liechtenstein-companies-foundations: "An initial
    investigation determined that data related to 31,000 entities was exfiltrated..."
    immediately follows a hyperlink to the government's own medienmitteilung as its sole
    attribution; no independent verification is cited. All four evidence[] quotes and the
    timeline verified verbatim against the two government press releases.
  ground_truth_url: https://therecord.media/hackers-steal-records-liechtenstein-companies-foundations

