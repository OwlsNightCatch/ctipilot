  - title: "Check Point VPN CVE-2026-50751: authentication bypass in deprecated IKEv1 key exchange actively exploited by Qilin ransomware affiliate, now in CISA KEV"
    sources:
      - { url: "https://blog.checkpoint.com/security/check-point-releases-important-hotfix-for-vulnerabilities-in-deprecated-ikev1-vpn-protocol/", publisher: "Check Point Research", date: "2026-06-08", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12615", publisher: "NCSC-CH Security Hub", date: "2026-06-08", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-critical-check-point-vpn-zero-day-exploited-in-the-wild-cve-2026-50751/", publisher: "Rapid7", date: "2026-06-08", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/check-point-links-vpn-zero-day-attacks-to-qilin-ransomware-gang/", publisher: "BleepingComputer", date: "2026-06-08", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0179", publisher: "NCSC-NL", date: "2026-06-08", role: "corroborating" }
      - { url: "https://support.checkpoint.com/results/sk/sk185033", publisher: "Check Point sk185033", date: "2026-06-08", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12615 → primary: Check Point Research, URL https://blog.checkpoint.com/security/check-point-releases-important-hotfix-for-vulnerabilities-in-deprecated-ikev1-vpn-protocol/ → corroborating: NCSC-NL NCSC-2026-0179, Rapid7 ETR, BleepingComputer"
    summary: |
      Check Point disclosed and patched CVE-2026-50751 (CVSS 9.3, Critical) on 8 June 2026 — a logic-flow weakness in certificate validation in the deprecated IKEv1 key exchange, affecting Remote Access VPN and Mobile Access deployments. An unauthenticated remote attacker can forge a VPN session without a valid password by exploiting the certificate validation bypass; post-authentication activity (lateral movement, privilege escalation) is still required to access internal resources. Exploitation began no later than 7 May 2026, surged in early June, and has affected fewer than a dozen confirmed organisations globally. Check Point attributes the campaign with medium confidence to a financially motivated actor using Qilin ransomware; the actor re-uses infrastructure against other VPN products (PAN-OS, Fortinet, F5). CISA added CVE-2026-50751 to KEV on 8 June with a federal remediation deadline of 11 June 2026.

      Affected versions: R80.20.X (EoS), R80.40 (EoS), R81 (EoS), R81.10 (EoS), R81.10.X, R81.20, R82, R82.00.X, R82.10. A hotfix is available; upgrade to the fixed release documented in sk185033. Check Point also disclosed a second related CVE, CVE-2026-50752 (CVSS 7.4), which enables MitM interference on site-to-site IKEv1 VPN connections — not exploited in the wild but should be patched in the same maintenance window.

      Prerequisites: gateways must be configured for deprecated IKEv1 key exchange (not the current IKEv2). Legacy Remote Access clients that default to IKEv1 are the primary exposure surface.

      Technique class: T1190 (Exploit Public-Facing Application), T1078 (Valid Accounts — post-exploitation credential abuse).

      Detection: Check VPN authentication logs for remote-access sessions established without a matching MFA / password event; VPN management-plane anomaly detection for sessions originating from IKEv1-only tunnels. Look for lateral movement from VPN-assigned address space. NCSC-NL explicitly warns of large-scale exploitation imminently.

      Hardening: apply hotfix sk185033 immediately; disable legacy IKEv1 remote-access client support; enforce mandatory machine certificate authentication; enable IPS with updated signatures pending patch.
    ch_eu_nexus: "global; Check Point Security Gateway is widely deployed across Swiss and EU public-sector networks as a perimeter VPN device"
    public_sector_nexus: "direct — VPN perimeter gateways are core public-sector network infrastructure"
    sector: "government, finance, critical-infrastructure, all sectors"
    cves: [CVE-2026-50751, CVE-2026-50752]
