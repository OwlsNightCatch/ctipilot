  - title: "CVE-2026-42271 — BerriAI LiteLLM: authenticated low-privilege command injection to host-level RCE, now in CISA KEV"
    sources:
      - { url: "https://github.com/advisories/GHSA-v4p8-mg3p-g94g", publisher: "GitHub Advisory Database / BerriAI", date: "2026-06-01", role: "primary" }
      - { url: "https://horizon3.ai/attack-research/vulnerabilities/cve-2026-42271-chained-with-cve-2026-48710/", publisher: "Horizon3.ai", date: "2026-06-01", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42271", publisher: "NVD", date: "2026-06-08", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge (catalogVersion 2026.06.08, dateAdded 2026-06-08) → primary: GitHub Advisory GHSA-v4p8-mg3p-g94g and Horizon3.ai → NVD corroborating"
    summary: |
      CISA added CVE-2026-42271 to KEV on 8 June 2026, confirming active exploitation. The flaw is a command injection in LiteLLM (an open-source AI gateway/proxy commonly deployed in enterprise AI infrastructure to multiplex LLM API calls) affecting versions 1.74.2 through before 1.83.7. Two preview endpoints — POST /mcp-rest/test/connection and POST /mcp-rest/test/tools/list — accept a full MCP server configuration in the request body including the command, args, and env fields. When called with stdio transport, the proxy spawns the supplied command on the host under the proxy's process privileges. The endpoints were gated only by a valid API key with no role check, so any authenticated user including holders of low-privilege internal-user keys could execute arbitrary commands on the proxy host. Horizon3.ai further documented that chaining with CVE-2026-48710 (a Starlette Host-header validation bypass) makes the exploit unauthenticated.

      Affected versions: 1.74.2 to < 1.83.7. Patch: upgrade to 1.83.7. The fix adds role-based authorization controls on the MCP test endpoints and updates Starlette dependencies.

      Attack surface: the LiteLLM proxy management API, typically exposed on port 4000 internally. AI/ML platform teams often run LiteLLM as a shared service accessible to multiple teams with varied trust levels.

      Technique class: T1190 (Exploit Public-Facing Application), T1059 (Command and Scripting Interpreter — subprocess spawning on host).

      Detection: web-server access logs showing POST requests to /mcp-rest/test/connection or /mcp-rest/test/tools/list with stdio-type configurations in the body; process-creation events (Sysmon EID 1, EDR telemetry) showing LiteLLM proxy spawning unexpected child processes; endpoint isolation of AI gateway hosts.

      Hardening: upgrade immediately to 1.83.7; restrict /mcp-rest/test/* endpoints at the network level; audit API key issuance and enforce least-privilege key scoping.
    ch_eu_nexus: "global; LiteLLM is widely deployed in AI-infrastructure stacks across Swiss and EU public-sector organisations running shared LLM API proxies"
    public_sector_nexus: "indirect — AI gateway infrastructure in organisations adopting large language models"
    sector: "technology, government, education, any sector running LiteLLM AI infrastructure"
    cves: [CVE-2026-42271, CVE-2026-48710]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "POST /mcp-rest/test/connection and POST /mcp-rest/test/tools/list … When called with a stdio configuration, the endpoints attempted to connect, which spawned the supplied command as a subprocess on the proxy host with the privileges of the proxy process. The endpoints were gated only by a valid proxy API key, with no role check."
        attribution: "NVD (citing GitHub Advisory GHSA-v4p8-mg3p-g94g)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42271"
