  - title: "CVE-2026-23111 — Linux kernel nf_tables use-after-free: single-char inversion bug yields reliable local-root and container escape, working exploit published"
    sources:
      - { url: "https://blog.exodusintel.com/2026/06/08/off-by-exploiting-a-use-after-free-in-the-linux-kernel/", publisher: "Exodus Intelligence", date: "2026-06-08", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/one-character-linux-kernel-flaw-enables.html", publisher: "The Hacker News", date: "2026-06-08", role: "corroborating" }
      - { url: "https://ubuntu.com/security/CVE-2026-23111", publisher: "Ubuntu Security", date: "2026-06-08", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('CVE-2026-23111 Linux kernel nf_tables use-after-free exploit Exodus Intelligence 2026') → primary: Exodus Intelligence blog, URL https://blog.exodusintel.com/2026/06/08/off-by-exploiting-a-use-after-free-in-the-linux-kernel/ → corroborating: THN, Ubuntu Security"
    summary: |
      Exodus Intelligence researcher Oliver Sieber published a full technical write-up and working exploit for CVE-2026-23111 on 8 June 2026. The vulnerability is a use-after-free in the nf_tables (netfilter tables) subsystem, specifically in the nft_map_catchall_activate() function. The root cause is a single misplaced ! (logical NOT) operator that inverts the genmask check, causing the function to skip inactive catchall elements during the abort process rather than reactivating them. This creates a use-after-free condition.

      Exodus reports the exploit achieves >99% reliability on idle Debian Bookworm, Debian Trixie, Ubuntu 22.04 LTS, and Ubuntu 24.04 LTS systems. The primitive allows an unprivileged local user to escalate privileges to root; it also enables container escape, making this high-value for post-exploitation in shared compute environments (Kubernetes nodes, CI/CD runners, multi-tenant VMs). Ubuntu rates the vulnerability CVSS 7.8 (High).

      The flaw was found by Exodus in early 2025 and patched upstream on 5 February 2026 with an upstream commit to linux-stable; the CVE was then assigned. Vendor packages (Debian, Ubuntu, Red Hat, SUSE) are patching via their security update channels. FuzzingLabs published an independent reproduction in April 2026 ahead of today's Exodus full disclosure.

      The attack requires local (unprivileged user) access or code execution within a container. No network-reachable path identified. Prerequisites: kernel compiled with CONFIG_NFT enabled (the default for all mainstream distributions), no additional capabilities required.

      Technique class: T1068 (Exploitation for Privilege Escalation), T1611 (Escape to Host — for container-escape path).

      Affected: Linux kernels prior to the 5 February 2026 upstream fix. Check distro security advisories for per-release patch status.

      Detection: Sysmon EID 10 or EDR telemetry for nf_tables-related kernel calls from non-root processes; privilege escalation anomaly detection (unexpected UID change to 0); audit log entry UID=0 process spawned from a non-root parent.

      Hardening: apply vendor kernel security updates containing the upstream 5 February 2026 fix; in container environments, enforce seccomp profiles and AppArmor/SELinux policies that restrict nf_tables syscalls for untrusted workloads.
    ch_eu_nexus: "global; all mainstream Linux distributions affected, including servers widely deployed in Swiss and EU public-sector infrastructure"
    public_sector_nexus: "direct — Linux is the dominant OS for public-sector server and container workloads"
    sector: "all sectors"
