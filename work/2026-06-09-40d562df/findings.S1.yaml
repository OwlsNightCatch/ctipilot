  - title: "Oxford University CareerConnect (Group GTI) breach exposes student names and emails at multiple UK universities"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/oxford-university-discloses-data-breach-after-careerconnect-platform-hack/", publisher: "BleepingComputer", date: "2026-06-08", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/06/06/oxford-university-data-pwned-again-by-career-platform-breach/5251754", publisher: "The Register", date: "2026-06-06", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('Oxford University CareerConnect data breach June 2026') → primary: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/oxford-university-discloses-data-breach-after-careerconnect-platform-hack/ → corroborating: The Register"
    summary: |
      The University of Oxford disclosed a data breach on 6 June 2026 after Group GTI, the third-party provider of the CareerConnect career services platform, reported its systems were compromised on 28 May 2026. Exposed data includes student first names, last names, and email addresses; for users authenticating without SSO, encrypted passwords were also taken. The attacker exploited an unspecified "security vulnerability" in the CareerConnect platform now patched. The attack is assessed to be credential-harvesting oriented (phishing preparation). CareerConnect is used not only by Oxford but also by King's College London and the University of Manchester, meaning the breach affects students and alumni at multiple UK higher-education institutions. This is Oxford's second breach disclosure in a matter of weeks (following a ShinyHunters compromise of Instructure Canvas in May 2026).

      No threat actor named in public disclosures. Defender considerations: monitor for targeted phishing against Oxford / KCL / Manchester student email addresses in the coming weeks; check whether CareerConnect accounts were linked to university SSO (lower risk if so); password reset procedures for non-SSO accounts.
    ch_eu_nexus: "UK higher education; EU nexus through research partnerships and alumni networks; pattern of SaaS third-party breaches affecting academic sector relevant to Swiss universities"
