  - title: "Mandiant GTIG: UNC3753 (Luna Moth / Silent Ransom Group) escalates US law-firm extortion campaign with physical office intrusions and USB data theft when vishing fails"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"
        publisher: "Mandiant / Google Threat Intelligence Group"
        date: "2026-06-05"
        role: "primary"
      - url: "https://securityaffairs.com/193315/cyber-crime/unc3753-escalates-from-vishing-calls-to-physical-office-intrusions-at-us-legal-and-financial-firms.html"
        publisher: "Security Affairs"
        date: "2026-06-08"
        role: "corroborating"
      - url: "https://www.ic3.gov/CSA/2026/260526.pdf"
        publisher: "FBI (IC3)"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: mandiant-gtig feed, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v → primary: Mandiant/GTIG, URL https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/ → corroborating: Security Affairs, URL https://securityaffairs.com/193315/..."
    summary: |
      Mandiant's GTIG (June 5, 2026) and a corroborating Security Affairs writeup (June 8) document an active campaign by UNC3753 — tracked also as Luna Moth, Chatty Spider, and Silent Ransom Group, a Conti-lineage extortion cluster (overlaps with UNC2686 / BazarCall) — targeting US law, professional-services, and financial-services firms from January through May 2026. The standard kill chain: email flood creates urgency, then a vishing call posing as IT support (T1566.004, T1598) persuades the victim to install a legitimate RMM tool (AnyDesk, Bomgar, Zoho Assist, SuperOps, Quick Assist), share their screen, and hand over Windows 365 or Citrix VDI credentials. Operators then enumerate iManage DMS repositories, SharePoint, and OneDrive for high-value files (legal agreements, W-2s, SSNs, client PII), stage with WinSCP or Rclone (T1567.002), and exfiltrate to consumer cloud storage. In confirmed cases the entire chain from first contact to exfiltration occurred within a single business day; GTIG observed data theft initiated in under one hour. The key new development corroborated by the FBI Cyber FLASH Alert: when vishing fails, UNC3753 sends a physical operative to the victim's office impersonating an IT technician, inserts a USB mass-storage device, and copies data directly (T1052.001). Extortion demands carry 3-day deadlines; refusal leads to publication on the LEAKEDDATA DLS and direct contact with the firm's clients. Detection: EDR/process-tree alerts for RMM binaries spawned under unusual parent trees; Windows Event 4624 Logon Type 10 (remote interactive) from unfamiliar source IPs after RMM session; file-access storms on network shares or DMS APIs; outbound Rclone/WinSCP network signatures to cloud storage endpoints; USB device plug events (Event ID 2003 in DeviceHardwareEvents / Sysmon EID 6 + DeviceConnect). Hardening: restrict RMM installation to IT-managed deployment paths (AppLocker/WDAC); require explicit helpdesk-ticket validation before any remote-access session; block Rclone binary hashes / network destinations via WDAC; treat any unsolicited in-person IT request as a social-engineering indicator.
    ch_eu_nexus: "US-centric campaign; methodology directly applicable to EU/Swiss law firms and professional-services sectors that use iManage or equivalent DMS platforms"
    public_sector_nexus: "indirect (direct for legal/professional services adjacent to public sector)"
    sector: "legal services, financial services, professional services"
    cves: []
    actors_campaigns_malware: ["UNC3753", "Luna Moth", "Chatty Spider", "Silent Ransom Group"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "associated threat actors have also attempted direct data theft using physical, in-person access, corroborated by a recent FBI Cyber FLASH Alert highlighting instances where Silent Ransom Group threat actors leveraged physical office access to exfiltrate corporate data via removable USB media"
        attribution: "Mandiant / GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"
      - quote: "in many Mandiant investigated incidents, the entire attack sequence — from initial target contact to data theft and extortion — occurred within a single business day, with GTIG recently observing data searches, staging, and theft initiated in under an hour"
        attribution: "Mandiant / GTIG"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/targeted-campaign-us-law-firms/"

  - title: "SANS ISC TeamPCP update: Mini Shai-Hulud framework now open-sourced, spawning copycat Miasma and Phantom Gyp campaigns; SLSA-signed provenance bypassed from within compromised build environments"
    sources:
      - url: "https://isc.sans.edu/diary/33060"
        publisher: "SANS Internet Storm Center"
        date: "2026-06-08"
        role: "primary"
      - url: "https://www.wiz.io/blog/miasma-supply-chain-attack-targeting-redhat-npm-packages"
        publisher: "Wiz"
        date: "2026-06-06"
        role: "corroborating"
      - url: "https://www.cisa.gov/news-events/alerts/2026/05/28/supply-chain-compromises-impact-nx-console-and-github-repositories"
        publisher: "CISA"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: sans-isc RSS feed, URL https://isc.sans.edu/rssfeed.xml → primary: SANS ISC diary, URL https://isc.sans.edu/diary/33060"
    summary: |
      The June 8 SANS ISC handler diary by Kenneth Hartman updates the TeamPCP supply-chain campaign tracking through June 7 — covering the period since the prior SANS ISC update of May 24. The key operational development: TeamPCP open-sourced its Mini Shai-Hulud framework on its own Gitea instance, triggering a second wave of derivative campaigns. Two confirmed derivatives documented this run: Miasma (previously covered in briefs from June 6–7 in the Miasma/Microsoft GitHub arc) and a newly-named Phantom Gyp campaign targeting the Gyp build-system namespace. Both campaigns inject malicious CI/CD hooks into compromised npm packages, with Red Hat's @redhat-cloud-services scope among the affected repositories. CISA formally catalogued TeamPCP-affiliated vulnerabilities on May 27 and issued a standalone advisory May 28. The diary's principal detection-engineering takeaway: SLSA provenance attestations — even valid ones — do not protect against supply-chain injection when the build environment itself is subverted from the inside. Detection focus should shift from attestation-verification to build-pipeline integrity: monitor GitHub Actions runner process trees for unexpected network outbound from within the build; alert on `actions/upload-artifact` calls shipping signed-but-anomalous binaries; compare published package checksums against those in CI logs using independent ledgers (e.g. Sigstore Rekor transparency log). Swiss/EU public-sector orgs using npm-based automation pipelines or Red Hat tooling should audit CI/CD pipeline definitions for unexpected workflow-step insertions.
    ch_eu_nexus: "Direct: Red Hat @redhat-cloud-services scope affected; EU/Swiss public-sector orgs with Red Hat or npm-based automation pipelines are within scope"
    public_sector_nexus: "direct"
    sector: "developer tooling, public administration, critical infrastructure (automation pipelines)"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud", "Miasma", "Phantom Gyp"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-06-06
    evidence:
      - quote: "a key finding: 'signed provenance still does not save you' when build environments are subverted from within"
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/33060"
      - quote: "the leaked framework enabled credential-stealing worms named 'Miasma' and 'Phantom Gyp' that compromised dozens of npm packages including Red Hat's @redhat-cloud-services scope, delivering valid SLSA provenance attestations despite malicious pipeline injection"
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/33060"

