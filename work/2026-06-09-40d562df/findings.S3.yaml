  - title: "Unit 42: Threat actors — including Cloaked Ursa (APT29) and UNC6692 — are mass-operationalising Microsoft Teams external-chat as a phishing surface, accounting for 42% of phishing alerts in Cortex in early 2026"
    sources:
      - url: "https://unit42.paloaltonetworks.com/microsoft-teams-phishing/"
        publisher: "Unit 42 (Palo Alto Networks)"
        date: "2026-06-08"
        role: "primary"
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/unc6692-social-engineering-custom-malware"
        publisher: "Mandiant / Google Cloud"
        date: "2026-04-24"
        role: "corroborating"
      - url: "https://www.microsoft.com/en-us/security/blog/2026/04/18/crosstenant-helpdesk-impersonation-data-exfiltration-human-operated-intrusion-playbook/"
        publisher: "Microsoft Security Blog"
        date: "2026-04-18"
        role: "corroborating"
    discovery_trace: "first seen at: unit42 RSS feed, URL https://unit42.paloaltonetworks.com/feed/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/microsoft-teams-phishing/"
    summary: |
      Unit 42 published an operational briefing (June 8, 2026) documenting the sharp rise in Microsoft Teams-based social engineering, noting that in the first four months of 2026 collaboration-platform phishing alerts reached 42% of all phishing alerts in Cortex (up from 30%). Two clusters dominate current reporting. Cloaked Ursa (APT29/Midnight Blizzard) uses previously-compromised Microsoft 365 tenants — often small-business accounts — to create domains styled as IT-support entities, then sends Teams messages requesting MFA approval or credential re-entry under the guise of account maintenance. UNC6692 (documented in Mandiant's April 2026 report) floods target inboxes to create urgency, then contacts victims via Teams posing as IT support; their attack chain delivers the SNOW malware suite — SNOWBELT (browser-extension backdoor), SNOWGLAZE (WebSocket tunneler over AWS S3/Heroku), and SNOWBASIN (persistent backdoor) — following LSASS dump via Task Manager (T1003.001) and Pass-the-Hash lateral movement (T1550.002). The attack exploits the default Teams configuration that allows external-tenant messages without restriction. Defender hardening: disable unmanaged/consumer-account external chat (Teams Admin Center → External Access), restrict federation to explicitly-allowed domains, require `externalAccessPolicy` with `EnableFederationAccess=False` for non-partners, and extend AiTM-aware Conditional Access policies to Teams sign-in contexts. Detection: Entra ID sign-in logs for logons from external M365 tenants; Teams activity logs for `ExternalUserJoined` events followed by quick file/link shares; MDI alerts for MFA anomalies following cross-tenant meeting acceptance.
    ch_eu_nexus: "Global; Swiss and EU public-sector orgs use Teams extensively; external-access defaults are identical across tenants"
    public_sector_nexus: "direct"
    sector: "cross-sector, public administration, financial services"
    cves: []
    actors_campaigns_malware: ["Cloaked Ursa", "APT29", "Midnight Blizzard", "UNC6692", "SNOWBELT", "SNOWGLAZE", "SNOWBASIN"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "phishing alerts from collaboration tools represented 42% of all phishing alerts in Cortex in the first four months of 2026, up from 30% of all phishing alerts in the preceding four months"
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/microsoft-teams-phishing/"
      - quote: "Threat actors like Cloaked Ursa succeed not because MS Teams is insecure, but because external communication settings are often too permissive"
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/microsoft-teams-phishing/"

  - title: "Microsoft Threat Intelligence: Storm-3075 and Fox Tempest are mass-distributing Lumma Stealer and Vidar via fake AI-brand (ChatGPT, Claude, DeepSeek) sites, signed binaries from MSaaS, and fraudulent GitHub repos"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/08/ai-brands-as-bait-how-threat-actors-are-using-the-ai-hype-in-social-engineering/"
        publisher: "Microsoft Security Blog / Microsoft Threat Intelligence"
        date: "2026-06-08"
        role: "primary"
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/"
        publisher: "Microsoft Security Blog"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog recent feed (bridge subcommand), URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/feed/ → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/06/08/ai-brands-as-bait-how-threat-actors-are-using-the-ai-hype-in-social-engineering/"
    summary: |
      Microsoft Threat Intelligence (June 8, 2026) documents a campaign by Storm-3075 (initial-access broker) and Fox Tempest (malware-signing-as-a-service operator) that weaponises public enthusiasm for AI platforms. Attackers impersonate ChatGPT, Claude (Anthropic), DeepSeek, and Microsoft Copilot using SEO-poisoned results, malvertising, and multi-stage redirection chains (Rebrandly → CAPTCHA gates → credential-harvesting landing pages). Downloaded binaries are signed with certificates obtained through Fox Tempest's MSaaS operation (T1553.002), enabling near-zero-detection rates on initial delivery. Payloads include Lumma Stealer (targeting browser credentials, crypto wallets, 2FA browser extensions), Vidar infostealer, Hijack Loader, and Oyster. GitHub is abused for payload staging — fraudulent repositories hosting signed executables that pass basic file-reputation checks. The same infrastructure previously tied to Fox Tempest reached "tens of thousands" of infections. Defender hardening: Microsoft Defender SmartScreen blocks known URLs in this chain; Entra ID Identity Protection catches credential stuffing from harvested accounts; Conditional Access policies with phish-resistant MFA (FIDO2/passkeys) eliminate the downstream AiTM risk. Detection: Sysmon EID 1 for processes spawned by browser parent with Lumma-family command-line patterns; EDR process-injection alerts for Hijack Loader; Defender for Endpoint `TrojanDownloader:Win32/Hijackloader` family alerts.
    ch_eu_nexus: "Global; EU employees searching for AI tools are equally exposed; Swiss public-sector is a relevant target population for AI-tool lures"
    public_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    actors_campaigns_malware: ["Storm-3075", "Fox Tempest", "Lumma Stealer", "Vidar", "Hijack Loader", "Oyster"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "malware is being distributed via fraudulent GitHub repositories and signed with certificates obtained through malware-signing-as-a-service (MSaaS) operations, enabling tens of thousands of infections while evading early detection"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/08/ai-brands-as-bait-how-threat-actors-are-using-the-ai-hype-in-social-engineering/"
      - quote: "Threat actors including Storm-3075 and Fox Tempest are leveraging the wider global interest around AI itself as a social engineering lure"
        attribution: "Microsoft Security Blog"
