  - title: "Federal Supreme Court: criminal-procedure seizure rules give no legal basis for DNS blocking orders against ISPs; Vaud prosecutors say fraud sites cannot be stopped"
    novelty: new
    borderline: true
    borderline_reason: "Changes what cantonal prosecutors and police may order (constituency includes cantonal police) but gives a Tier 2/3 SOC nothing to act on; primary judgment or court press release not reached (bger.ch unreachable), sourced from Keystone-SDA/AWP and two trade-press readings. Primary ruling published Wednesday 2026-11-04; the freshest reading (ICTjournal) is 2026-11-05."
    sources:
