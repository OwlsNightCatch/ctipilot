        attribution: "cash.ch (AWP/Keystone-SDA)"
        source_url: "https://www.cash.ch/news/bundesgericht-stellt-gesetzeslucke-fur-netzsperren-fest-982513"
        translation: "It is, however, for the legislator to make the necessary political trade-offs and create a corresponding legal basis. (translated from German)"
      - quote: "ausserstande setze, die Aktivität von Internetseiten zu unterbinden, die einzig zu Betrugszwecken erstellt wurden"
        attribution: "cash.ch (AWP/Keystone-SDA), statement of the Vaud prosecution service"
        source_url: "https://www.cash.ch/news/bundesgericht-stellt-gesetzeslucke-fur-netzsperren-fest-982513"
        translation: "unable to stop the activity of websites created solely for fraud purposes (translated from German)"
      - quote: "Schweizer Strafverfolgungsbehörden dürfen Websperren nur in klar geregelten Fällen anordnen."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-11-04/bundesgericht-urteilt-gegen-netzsperren-ohne-sonderregelung"
        translation: "Swiss law-enforcement authorities may order website blocks only in clearly regulated cases. (translated from German)"
    extended_notes: |
      Not fetched: the Federal Supreme Court judgment itself and its press release (bger.ch returned an empty body on every transport tried). The Init7 statement quoted in SwissCybersecurity.net is an advocacy statement and is not carried into the summary.
