    summary: |
      First public Swiss cases of the refrigeration-controller attack wave covered by the target entry. On 2026-11-05 SRF reported that Lüthis Fleischwaren, a butcher in the Bern municipality of Köniz, told customers in a flyer that manipulation of the electronic control of its cooling and freezer systems caused considerable temperature deviations; the owner told SRF he found 50 to 70 degrees in the freezer (the owner's account, not a measurement). The firm disconnected the installation from the network and closed the branch, and Keystone-SDA adds that it expects to reopen on 20 November at the earliest and that Kantonspolizei Bern was only briefly informed on Monday 2 November, had received no complaint and has started inquiries. The retailer Volg told SRF on request that three of its stores noticed that parameters in the cooling shelves had been changed and that measures had been tightened (a company statement, not independently confirmed). No source names the controller product, vendor, remote-maintenance route or an actor, and no source ties the Swiss cases to the Danfoss, Copeland or Dixell controllers in the entry.
      BACS told Keystone-SDA that it does not comment on specific cyber incidents and that one reportable notification about an attack on commercial refrigeration has been received so far, and it stressed that voluntary reports are welcome at any time; Keystone-SDA's own explanation of who must report (operators supplying the population with indispensable daily goods whose failure would cause considerable shortages, excluding firms under 50 employees with turnover or balance sheet of at most CHF 10 million) is the agency's paraphrase, not a BACS statement, and SRF's digital editor words the duty more loosely (all attacks on critical infrastructure). Blutspende SRK Schweiz told Keystone-SDA that no attacks on Swiss blood-donation services are known to it and that the regional services monitor cyber threats continuously. The facts so far are the owner's and the retailer's own accounts plus agency statements; attacker, vector and equipment are unknown for the Swiss cases.
      On the same day CISA, the FBI, HHS, USDA and DOT published a press release and a joint fact sheet saying that malicious actors are targeting unpatched or internet-accessible electronic temperature and refrigeration controllers at grocery retail and cold-storage sites (authentication bypass, injected attacker-chosen code or weak configuration are named as possible routes). The fact sheet names no vendor, CVE, victim or actor and frames setpoint changes, prolonged heating and defrost, and loss of live temperature visibility as potential outcomes rather than documented incidents; healthcare and public health, chemical, food and agriculture and transportation are named as heavy users of such systems. Its eight mitigations: keep controllers off the internet (behind an updated edge device where remote access is unavoidable), a dedicated OT VLAN, replace default credentials and use phishing-resistant MFA where practical, patch and retire end-of-support devices, allowlist the devices permitted to change settings, offline tested backups, logging with traffic capture where OT assets lack logs, and setpoint limits with out-of-range alerting.
    region_nexus: "Switzerland (first public cases, canton Bern; three Volg stores at unnamed locations); Europe-wide campaign per the target entry"
