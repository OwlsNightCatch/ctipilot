    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (feed item 2026-11-05T12:00:46Z) -> https://www.inside-it.ch/efk-stellt-cyber-meldebetrieb-des-bacs-gutes-zeugnis-aus-20261105 (full body read via __NEXT_DATA__ JSON, extract returns paywall teaser) -> pivot: swisscybersecurity-net, URL https://www.swisscybersecurity.net/news/2026-11-05/finanzkontrolle-ist-fast-zufrieden-mit-meldeplattform-des-bacs (links the report PDF) -> primary: EFK report PDF, URL https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/26182/26182be-bacs-meldebetrieb.pdf (read with fetch_source.py pdf)"
    summary: |
      The Swiss Federal Audit Office (EFK) audited the technical infrastructure and staffing behind BACS's reporting operation for the mandatory 24-hour cyberattack reports in force since April 2025, and rates it positively overall: the Cyber Security Hub (CSH) allows efficient processing and the GovCERT team has enough staff. In the first quarter of 2025 the platform was unavailable for about twelve hours in total, mainly because the federal central access system eIAM failed and blocked all access and because provider faults were not detected early; BACS therefore migrated the platform in March 2026 to an external provider outside the federal administration, with redundant servers at two geographically separate Swiss sites, monitoring and contractual availability targets. The EFK calls the new setup basically suitable but cannot yet judge its effectiveness after so short a run.
      The EFK names the remaining dependency a material availability risk: access to the CSH still runs through eIAM, which stays a potential single point of failure until further identity providers are connected, and there is no specific emergency concept for an eIAM outage; reports can then be submitted by telephone or to a federal-external e-mail address and are entered manually afterwards, and a business-continuity concept is in preparation. In a sample the EFK found software components not updated for at least three years, some no longer supported, with no known vulnerabilities according to supplementary analyses; BACS has since reviewed versions, licences and security components systematically (since April 2026). GovCERT has twelve full-time posts, handles about one critical-infrastructure report per day, and per a January 2026 evaluation about 88 percent of incoming incidents received a first assessment within one hour; 222 reports arrived from April to December 2025.
