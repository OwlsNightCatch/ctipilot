  - title: "OpenSSH 10.6p2: password-authentication bypass on musl-libc Linux with PAM disabled; NCSC-CH advisory and CERT-FR alert"
    novelty: new
    borderline: true
    borderline_reason: "S1-domain vulnerability (S1 slice carries the NCSC-CH security hub and will likely return it); returned here because a home-region authority advisory (NCSC-CH, advisory 13155) and a neighbour CERT alert (CERTFR-2026-ALE-015) are both in-window. Exposure is narrow (musl-based Linux with PAM disabled: Alpine, OpenWrt and similar) and exploitation status is unknown."
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13155", publisher: "NCSC Switzerland (Security Hub advisory 13155)", date: "2026-11-05", role: "primary" }
      - { url: "https://www.cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-015/", publisher: "CERT-FR (alert CERTFR-2026-ALE-015)", date: "2026-11-05", role: "primary" }
      - { url: "https://www.openssh.org/txt/release-10.6p2", publisher: "OpenSSH project (Portable OpenSSH 10.6p2 release notes)", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: ncsc-csh recent 15 (bridge), advisory 13155 created 2026-11-05T12:42:17Z, citation https://security-hub.ncsc.admin.ch/#/posts/13155 -> corroborating: anssi-fr, URL https://www.cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-015/ (feed https://www.cert.ssi.gouv.fr/alerte/feed/ then extract) -> primary: OpenSSH release notes, URL https://www.openssh.org/txt/release-10.6p2 (extract)"
    summary: |
      Portable OpenSSH 10.6p2 was released on 2026-11-05 with what its release notes call a critical security workaround for Linux systems that use the musl libc with PAM disabled. NCSC-CH's advisory says remote, unauthenticated attackers can bypass SSH password authentication over the network and gain access; it lists Alpine, KISS, Sabotage, OpenWrt, Morpheus and other musl-based distributions without PAM password authentication as affected and names non-Linux systems, Linux/glibc systems and Linux systems using PAM as not affected, and it rates exploitation status unknown. Prerequisites per NCSC-CH: musl Linux, sshd built and run without PAM, PasswordAuthentication enabled and network access to sshd.
      CERT-FR's alert (OpenSSH versions before 10.6p2) describes the trigger: an attacker logs in by supplying two passwords, the second longer than 256 and shorter than 1024 characters, and calls the flaw trivial to exploit when the conditions are met. NCSC-CH says the root cause appears to lie outside OpenSSH, probably at libc level, so other software with similar authentication paths may be affected, and that the bug was reported by an AI security firm named Wakefield; it assesses that the OpenSSH developers expedited the release because AI-assisted rediscovery by malicious actors is considered likely. CERT-FR relays the researcher's advice to review logins of system accounts whose password field is a star in /etc/shadow; interim mitigation is PasswordAuthentication no (or disabling sshd) and then upgrading. No CVE identifier appears in the three sources.
    region_nexus: "global; NCSC-CH and CERT-FR advisories"
    primary_sector_nexus: "indirect: only musl-based Linux (container images, OpenWrt network gear, embedded) with sshd and password authentication is exposed"
