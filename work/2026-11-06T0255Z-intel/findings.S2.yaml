      - { url: "https://www.swisscybersecurity.net/news/2026-11-04/bundesgericht-urteilt-gegen-netzsperren-ohne-sonderregelung", publisher: "SwissCybersecurity.net", date: "2026-11-04", role: "corroborating" }
      - { url: "https://www.ictjournal.ch/news/2026-11-05/le-tribunal-federal-soppose-au-blocage-dns-sans-base-legale-specifique", publisher: "ICTjournal", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: cash-ch-awp, URL https://www.cash.ch/sitemap-news.xml (news sitemap, 2026-11-04 entry) -> https://www.cash.ch/news/bundesgericht-stellt-gesetzeslucke-fur-netzsperren-fest-982513 (extract) -> corroborating: swisscybersecurity-net, URL https://www.swisscybersecurity.net/news/2026-11-04/bundesgericht-urteilt-gegen-netzsperren-ohne-sonderregelung ; ictjournal feed https://www.ictjournal.ch/rss.xml -> https://www.ictjournal.ch/news/2026-11-05/le-tribunal-federal-soppose-au-blocage-dns-sans-base-legale-specifique ; primary court release not reachable (bger.ch returned an empty body on url --direct and WebSearch did not index it)"
    summary: |
      The Swiss Federal Supreme Court upheld the ISP Init7's appeal against a July 2025 order by the Vaud prosecution service that told several providers to block access to websites of a suspected investment-fraud platform (dozens of victims, more than CHF 1.7 million lost). The prosecutors had relied on the seizure rules of the Criminal Procedure Code (Art. 263 StPO) in connection with security confiscation (Art. 69 StGB). The court holds that these general provisions are not a sufficient basis for a DNS-blocking obligation, points to the specific bases that exist for unauthorised gambling, illegal pornography and provisional blocks in unfair-competition cases, and says it is for the federal legislator to decide for which offences, by which authority and on what provisional conditions blocks may be ordered.
      The Vaud prosecution service told Keystone-SDA that the judgment is also a win for criminals in general and leaves authorities unable to stop sites created solely for fraud. SwissCybersecurity.net notes the Federal Council's draft revision of the Telecommunications Act, whose consultation ended in September 2026, proposes to allow blocks on reasonable suspicion of fraud. Practical consequence reported by the sources: prosecutor-ordered DNS blocks of phishing and fraud domains outside the specific statutory cases currently lack a legal basis.
    region_nexus: "Switzerland (cantonal prosecution, federal court)"
    primary_sector_nexus: "indirect: affects cantonal prosecutors and police as the issuers of such blocking orders"
