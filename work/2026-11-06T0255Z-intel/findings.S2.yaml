      Delta against the target entry (last updated 2026-11-05T04:02:44Z): the entry says Coop registered failed attempts and the ENISA statement does not mention Switzerland; it carries no confirmed Swiss victim, no BACS count and no CISA/FBI/HHS/USDA/DOT material (grep of the entry body for Köniz, Volg, Lüthi, HHS, USDA, fact sheet returned 0).
      Exposure (source-stated only): the CISA fact sheet scopes the risk to controllers that are unpatched or internet-accessible; Keystone-SDA says operators can supervise cooling systems centrally over the internet and that the butcher apparently has such installations (its inference, not an owner statement). No Swiss source states which product or which maintenance provider.
      Detection concepts the fact sheet supports: controller or supervision-platform logs for setpoint, defrost and alarm-threshold changes with alerting on out-of-range values; remote-access and supplier-account logs for the supervision platform; traffic capture between OT assets where devices cannot log; independent temperature readings (the entry already carries CSIRT Italia's instrument-check advice). Hardening lever: remove the controller from the internet, VPN or edge device in front of it, allowlist of devices permitted to change settings.
      Reporting-duty reading: BACS's count (one reportable case) and Keystone-SDA's threshold paraphrase suggest micro-businesses fall outside the duty while voluntary reporting is invited; a public body running cold-chain equipment should check its own status rather than rely on the paraphrase (the ISG/CSV text was not fetched in this run).
