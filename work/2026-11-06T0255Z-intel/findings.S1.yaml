    summary: |
      zlib 1.4 (release notes dated 2026-11-04, announced to oss-security 2026-11-05) lists these security fixes: a buffer overflow in non-blocking gzwrite() (CVE-2026-85091, reported by mat-mo and Trail of Bits TOB-ZLIB-003); inflateGetDictionary() writing up to 8 MB past the caller's 32K buffer after a zlib header with an invalid window size followed by inflateReset() or inflateSync() (affects 1.3.1 and 1.3.2); an inflateSync() one-byte window that could later be overrun; an inflatePrime() read before the start of the input; repeated deflatePrime() calls writing past the pending buffer; inflateBack() missing a too-far-back distance check and copying uninitialized memory; gzseek() writing uninitialized memory (found by Claude Opus 5.5); deflateResetKeep() reading outside the window; and in minizip a double free, a NULL dereference, Zip64 parsing differences that let crafted archives show different entries than other readers, and miniunz creating directories outside the extraction directory (and on Windows writing files anywhere). CVE-2026-4738 (contrib/infback9) is rated critical in the advisory database but the release notes say the rating overstates it. No exploitation or public exploit is reported; reachability depends on whether an application calls the affected APIs with attacker-influenced input (most inflate() users do not use inflateGetDictionary or the gzwrite non-blocking path). Distribution and vendor backports will follow; the release also changes z_off_t and the MSVC library names, so rebuilds need care.
    region_nexus: "global; zlib is embedded in nearly every operating system, appliance firmware and language runtime, so this is a dependency to track rather than a product to patch directly"
