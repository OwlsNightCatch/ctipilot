  - title: "OpenSSH 10.6p2 fixes CVE-2026-123158 ('*sshole'): on Linux with musl libc and no PAM (Alpine, OpenWrt), any 257 to 1,024 byte password logs in to accounts whose shadow hash is '*'; NCSC Switzerland issued an advisory"
