    reason: "bsi-rss returned 250 items spanning about two days (mostly [UPDATE] distro relays); triage by filtering to [NEU] with hoch, kritisch or UNGEPATCHT and drilling with bsi-csaf is the efficient pattern; BSI portal URLs (…/securityadvisory?name=WID-SEC-2026-NNNN) were cited while the read came from the bridge's .well-known CSAF JSON."
