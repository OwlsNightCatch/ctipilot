    reason: "Recipe update: WebFetch of https://www.cisa.gov/news-events/cybersecurity-advisories returned a clean 10-item listing with hrefs on 2026-11-06 (the 2026-11-05 note says 403); `python3 tools/fetch_source.py cisa page <resource URL>` read the fact sheet page; the PDF (media under /sites/default/files/) answers 403 on the `pdf` subcommand."
