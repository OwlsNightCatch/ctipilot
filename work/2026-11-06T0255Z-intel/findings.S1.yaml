    reason: "Not in the slice file; probed once as directed: `url --direct https://www.connectwise.com/company/trust/advisories` answers HTTP 403 again; `url --direct https://status.connectwise.com/` reads (207 KB) but shows nothing relevant in window. Outcome: no new recipe, status stays blocked with the status-page substitute."
