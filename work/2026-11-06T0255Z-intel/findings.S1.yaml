    reason: "https://chromereleases.googleblog.com/feeds/posts/default answers 302 and fails on the bridge; the post URL `extract https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop.html` read the full release notes (213 fixes, CVE list) on the retry after a first 503; WebFetch of the same post returned only the title and labels."
