      - { key: "product:alpine-linux", type: product, name: "Alpine Linux", aliases: ["Alpine"], summary: "musl-libc based Linux distribution common in containers and cloud images; default OpenSSH server build runs without PAM and is the named platform for CVE-2026-123158 (OpenSSH release notes, OX Security)." }
      - { key: "tool:sshole", type: tool, name: "*sshole", aliases: ["sshhole", "sshole"], summary: "Name given by its discoverer to the OpenSSH-on-musl password-authentication bypass tracked as CVE-2026-123158 (sshhole.com, 2026-11-05)." }
    relation_suggestions:
      - { subject: "tool:sshole", object: "product:openssh", basis: "sshhole.com and the OpenSSH 10.6p2 release notes describe the bypass as exploitable through sshd, with the root cause in musl's crypt() behaviour (OpenSSH, 2026-11-05)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation allows remote, unauthenticated attackers to bypass SSH password authentication over the network and gain unauthorized system access."
        attribution: "NCSC Switzerland (Cyber Security Hub)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155"
      - quote: "Developers expedited the release because AI-assisted rediscovery by malicious actors is considered likely."
        attribution: "NCSC Switzerland (Cyber Security Hub)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155"
      - quote: "OpenSSH (Portable) on Linux systems using musl libc with PAM disabled"
        attribution: "NCSC Switzerland (Cyber Security Hub)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155"
      - quote: "This bypass affects some configurations and runtime configurations. We do not consider the root cause to be within OpenSSH but we are well equipped to avoid it."
        attribution: "OpenSSH (commit message)"
        source_url: "https://github.com/openssh/openssh-portable/commit/4353fdc43ef646c43a8dda7025cc1a898caf1482"
      - quote: "The vulnerability allows an attacker to authenticate to certain password-disabled accounts using an arbitrary password between 257 and 1,024 bytes long."
        attribution: "OX Security"
        source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"
      - quote: "On affected Alpine cloud images, successful authentication to a default user with passwordless doas privileges can allow an attacker to escalate to root."
        attribution: "OX Security"
        source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"
      - quote: "openssh on musl linux has been letting people into password-less accounts since 2016."
        attribution: "sshhole.com"
        source_url: "https://sshhole.com/"
    extended_notes: |
      Exposure check: read the sshd build (musl vs glibc: `ldd $(which sshd)` or the distro), UsePAM, PasswordAuthentication and the shadow password field of every account (a literal "*" is the trigger; "!" is not). Hardening lever: PasswordAuthentication no, or the 10.6p2 / distro package. Detection concept: sshd auth logs for "Accepted password" for an account that has no usable password (key-only or locked service accounts), particularly right after an unusually long password attempt, and first-ever password logins for root or a default cloud user; the long password itself is not logged by sshd, so correlate on the accepted-password event and the account class. Triage: legitimate password logins come from accounts with a real hash; an accepted password for a "*" account is anomalous by construction. Post-patch: no persistence is implied by the flaw itself, but any host that accepted password logins for key-only accounts before patching should be reviewed for new authorized_keys entries and doas/sudo use by the default cloud user. Related leads seen in the oss-security thread of the day: zlib 1.4 security release and a Go pre-announcement (separate items).
  - title: "FreeSWITCH CVE-2026-116779: one inbound SIP MESSAGE selects the 'api' chat proto and runs FreeSWITCH API commands (OS commands, Lua); the vendor advisory says exploitation has been observed in the wild; fixed in 1.11.3, BSI relayed it on 2026-11-05"
    sources:
      - { url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", publisher: "SignalWire / FreeSWITCH (GitHub security advisory GHSA-mg63-h38w-8p9p)", date: "2026-10-28", role: "primary" }
      - { url: "https://github.com/signalwire/freeswitch/releases/tag/v1.11.3", publisher: "SignalWire / FreeSWITCH (v1.11.3 release notes)", date: "2026-10-28", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4364", publisher: "BSI CERT-Bund (WID-SEC-2026-4364, rated kritisch)", date: "2026-11-05", role: "corroborating" }
      - { url: "https://securityonline.info/freeswitch-vulnerability-cve-2026-116779-exploited/", publisher: "Daily CyberSecurity (securityonline.info)", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4364 (bsi-rss feed item '[NEU] [kritisch] SignalWire FreeSWITCH: Schwachstelle ermöglicht Codeausführung', read with bsi-csaf WID-SEC-2026-4364) → primary: FreeSWITCH GHSA, URL https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p (from the CSAF references) → pivot: v1.11.3 release, URL https://github.com/signalwire/freeswitch/releases/tag/v1.11.3 → WebSearch (\"FreeSWITCH CVE-2026-116779 SIP MESSAGE api chat proto command execution exploited in the wild\") → securityonline, URL https://securityonline.info/freeswitch-vulnerability-cve-2026-116779-exploited/"
    summary: |
      SignalWire's advisory GHSA-mg63-h38w-8p9p (published 2026-10-28; the store never saw it, BSI relayed it as a new critical advisory on 2026-11-05) describes CVE-2026-116779 (CVSS 3.1 vector AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, 9.8): sofia_presence_handle_sip_i_message() splits the To user of an inbound SIP MESSAGE on "+", treats the left half as a chat proto name and dispatches to the matching chat interface; mod_dptools registers an "api" chat interface that hands its address to switch_api_execute(), so a peer that can deliver a MESSAGE to a SIP profile chooses which FreeSWITCH API command the server runs. Impact: command execution with the privileges of the FreeSWITCH process, disclosure of configuration and credentials and full call control; where mod_lua is loaded (stock) inline Lua is a second sink. The advisory states "Exploitation of this path has been observed in the wild" and names no actor, victim or scale; the claim is the vendor's own and is not independently corroborated, the flaw is not in CISA's KEV catalogue. Prerequisites: any SIP profile that accepts inbound MESSAGE, which is the default (stock conf/vanilla enables chat on the internal and external profiles; the inbound ACL does not cover MESSAGE); where MESSAGE authentication is enforced (default from 1.10.7) any one account on the profile suffices, and installations still carrying the sample directory user "default" with no password need no account at all. Affected: 1.11.2 and earlier; fixed in 1.11.3 (tagged 2026-08-28), which adds a per-profile enable-chat-api-proto parameter that is off by default and answers a MESSAGE selecting the proto with 403 and a log line. Workarounds: enable-chat=false on every profile that does not need inbound SIP chat; auth-messages alone and disable_system_api_commands do not close the path. The same release also fixes CVE-2026-116785 (mod_xml_rpc WebSocket frame-length heap overflow, 9.1, off by default, RCE not demonstrated) and CVE-2026-116790 (forged ICE/STUN checks never verified, 9.1, fixed in 1.11.2, opt-in ice_verify_message_integrity), per securityonline's reading of the advisories.
    region_nexus: "global; FreeSWITCH underlies PBX, contact-centre and WebRTC platforms, so any Swiss public body running an open-source or vendor-embedded FreeSWITCH telephony stack is in scope; no Swiss-specific report"
    primary_sector_nexus: "indirect (telephony and contact-centre platforms in public administrations and emergency-service call handling; no sector-specific reporting)"
    sector: "public-sector"
    cves: [CVE-2026-116779, CVE-2026-116785, CVE-2026-116790]
    techniques: [T1190, T1059]
    affected_products: ["FreeSWITCH"]
    entity_keys: []
    new_entities:
      - { key: "product:freeswitch", type: product, name: "FreeSWITCH", aliases: ["SignalWire FreeSWITCH"], summary: "Open-source telephony platform (PBX, call-centre, WebRTC) maintained by SignalWire; v1.11.3 fixes CVE-2026-116779, a SIP MESSAGE to API command-execution flaw the vendor says is exploited (GHSA-mg63-h38w-8p9p)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Exploitation of this path has been observed in the wild."
        attribution: "SignalWire / FreeSWITCH (GHSA-mg63-h38w-8p9p)"
        source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"
      - quote: "A peer that can deliver a MESSAGE to a profile therefore selects which FreeSWITCH API command the server runs."
        attribution: "SignalWire / FreeSWITCH (GHSA-mg63-h38w-8p9p)"
        source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"
      - quote: "Command execution with the privileges of the FreeSWITCH process: arbitrary OS commands, disclosure of configuration and credentials, and full call control."
        attribution: "SignalWire / FreeSWITCH (GHSA-mg63-h38w-8p9p)"
        source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"
      - quote: "This is an important release containing critical security fixes and stability improvements."
        attribution: "SignalWire / FreeSWITCH (v1.11.3 release notes)"
        source_url: "https://github.com/signalwire/freeswitch/releases/tag/v1.11.3"
    extended_notes: |
      Verification note: the exploitation claim, the CVSS vector and the affected/fixed range are all read from the vendor GHSA; the securityonline rewrite and BSI add no independent exploitation evidence, so single vendor-sourced exploitation claim, not a corroborated one. Detection concept: SIP signalling logs (and PCAPs at the session border controller) for MESSAGE requests whose To user contains a "+" with a left half of "api" (case-insensitive), FreeSWITCH logs of API commands executed from chat, 403 responses after upgrading, and child processes (shell, curl, wget) spawned by the freeswitch process. Triage: legitimate SIP chat uses other proto names and plain user parts; an "api+" selector has no benign use. Hardening: enable-chat=false on profiles without a SIP chat need, delete directory users without password or a1-hash (stock conf/vanilla ships `default` and a Skinny example), keep SIP profiles off the internet or behind an SBC, upgrade to 1.11.3 and leave enable-chat-api-proto unset. Post-patch compromise check: review the FreeSWITCH config and credentials for exfiltration exposure (rotate SIP trunk and directory credentials) and for new Lua scripts, dialplan or module-load changes if exposure predates 1.11.3. Recency note for the composer: vendor advisory 2026-10-28, first in-window sighting is BSI WID-SEC-2026-4364 (published 2026-11-04T23:00Z); no CERT-FR, NCSC-NL or NCSC.ch advisory seen.
  - title: "APT CVE-2026-109518: an on-path attacker can use hard-link reuse across redirect-and-retry downloads to make apt install an unverified package and get root code execution; fixed in Debian trixie apt 3.0.4 and Ubuntu USN-8996-1"
    sources:
      - { url: "https://ubuntu.com/security/notices/USN-8996-1", publisher: "Canonical (USN-8996-1)", date: "2026-11-04", role: "primary" }
      - { url: "https://security-tracker.debian.org/tracker/CVE-2026-109518", publisher: "Debian Security Tracker (CVE-2026-109518; DSA-6607-1, DLA-4880-1)", date: "2026-11-04", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-jw32-37xr-xwfw", publisher: "GitHub Advisory Database", date: "2026-11-04", role: "corroborating" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4341", publisher: "BSI CERT-Bund (WID-SEC-2026-4341, rated hoch)", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4341 (bsi-rss feed item '[NEU] [hoch] apt: Schwachstelle ermöglicht Ausführen von beliebigem Programmcode mit Administratorrechten', read with bsi-csaf WID-SEC-2026-4341) → primary: Ubuntu USN-8996-1, URL https://ubuntu.com/security/notices/USN-8996-1 (CSAF reference) → primary: Debian tracker, URL https://security-tracker.debian.org/tracker/CVE-2026-109518 → pivot: GitHub advisory, URL https://github.com/advisories/GHSA-jw32-37xr-xwfw"
    summary: |
      Max Justicz found that APT mishandles hard links when it follows an HTTP redirect and retries a package download (Canonical's USN-8996-1, 2026-11-04). Debian's CVE description: an on-path attacker who can manipulate the HTTP traffic between an APT client and an archive server (including a malicious mirror or proxy) during a package install can trick the client into installing an attacker-controlled unverified package and achieve remote code execution with root privileges; it needs the client to follow redirects and retry, so a non-zero Acquire::Retries, which is 3 by default from Debian 12 (bookworm) and Ubuntu 22.04 LTS, and older releases are unaffected in a default configuration. Fixed builds: Debian trixie apt 3.0.4 (DSA-6607-1); Ubuntu apt 3.3.3ubuntu0.1 (26.10), 3.2.1ubuntu0.1 (26.04 LTS), 2.8.4ubuntu0.1 (24.04), 2.4.15ubuntu0.1 (22.04), and ESM builds 2.0.12+esm1 (20.04), 1.6.19+esm1 (18.04), 1.2.36+esm1 (16.04) and 1.0.1ubuntu2.24+esm4 (14.04); Debian lists DLA-4880-1 for the LTS line; the bookworm fixed version was not read. No source reports exploitation or a public exploit; GitHub rates it High, FIRST EPSS is 0.0093 on 2026-11-05. The realistic attack position is a compromised or hostile mirror, proxy or network path on HTTP (non-TLS) repositories, so hardened fleets that use HTTPS mirrors from a trusted internal proxy are far less exposed.
    region_nexus: "global; any Debian or Ubuntu estate (servers, containers, CI runners) in Swiss public administrations"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-109518]
    techniques: [T1557, T1195.002]
    affected_products: ["APT", "Debian", "Ubuntu"]
    entity_keys: ["product:ubuntu"]
    new_entities:
      - { key: "product:apt", type: product, name: "APT", aliases: ["Advanced Package Tool", "apt"], summary: "Debian/Ubuntu package-manager front end; CVE-2026-109518 (2026-11-04) lets an on-path attacker get root code execution by exploiting hard-link reuse on redirected download retries (Canonical USN-8996-1, Debian)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "root RCE in the ubiquitous package manager, but it needs an on-path or malicious-mirror position and a non-TLS repository path; no exploitation or public exploit reported; patch is an ordinary package update"
    evidence:
      - quote: "an on-path attacker who can manipulate the HTTP traffic (including a malicious mirror or proxy) between an APT client and an archive server triggered by a package install can trick the client into installing an attacker-controlled unverified package and achieve remote code execution with root privileges."
        attribution: "Debian Security Tracker (CVE-2026-109518)"
        source_url: "https://security-tracker.debian.org/tracker/CVE-2026-109518"
      - quote: "the value 3 is the default starting with Debian 12 (bookworm) and Ubuntu 22.04 LTS (Jammy Jellyfish)"
        attribution: "Debian Security Tracker (CVE-2026-109518)"
        source_url: "https://security-tracker.debian.org/tracker/CVE-2026-109518"
      - quote: "Max Justicz discovered that APT incorrectly handled hard links when"
        attribution: "Canonical (USN-8996-1)"
        source_url: "https://ubuntu.com/security/notices/USN-8996-1"
    extended_notes: |
      Detection concept: package-manager logs (apt history.log, /var/log/apt/term.log) and proxy or mirror access logs showing a redirect (3xx) followed by a retried download of the same .deb, an install of a package whose hash does not match the Release metadata, or a package install that spawns unexpected child processes; egress logs showing apt reaching non-corporate mirrors over plain HTTP. Hardening: HTTPS repositories through a trusted internal mirror, no unauthenticated forward proxy in the path, Acquire::Retries tuned only if the operational cost is acceptable (the flaw needs a non-zero value), apt upgraded to the fixed builds.
