    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13155 (python3 tools/fetch_source.py ncsc-csh recent 25, post 13155 created 2026-11-05T12:42Z) → primary: OpenSSH release notes, URL https://www.openssh.org/releasenotes.html → pivot: heise, URL https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html → pivot: discoverer write-up, URL https://sshhole.com/ → pivot: OX Security feed, URL https://www.ox.security/feed/ (item 'OpenSSH Password Authentication Bypass on Alpine Linux (*sshole) – CVE-2026-123158') → CVE identifier checked against the MITRE CVE record API (cveawg.mitre.org) and the NVD API 2.0, not cited"
    summary: |
      OpenSSH released Portable 10.6p2 on 2026-11-05 as a critical workaround for a password-authentication bypass that affects Linux systems running sshd on musl libc with PAM disabled; the project states it considers the root cause to lie outside sshd. The CVE record (CVE-2026-123158, MITRE as CNA, published 2026-11-05, CVSS 3.1 8.1 with AV:N/AC:H, CWE-394) says any password between 256 and 1,024 characters succeeds for some account configurations; OX Security gives 257 to 1,024 bytes. Mechanism as described by the discoverer and OX: musl's crypt() refuses inputs over 256 bytes and returns the string "*" on failure, "*" is also what /etc/shadow holds for an account with no usable password, and sshd (via its 2016 salt-picking code for user-enumeration resistance) ends up comparing the two equal; the OpenSSH fix rejects stored hashes shorter than a valid hash length. Prerequisites per OX Security: musl-based OpenSSH server without PAM (Alpine's openssh-server package by default, or UsePAM no), password logins enabled (default), an account whose password field is "*" (key-only users, LDAP-backed users, root on Alpine 3.16 and later) and at least one other account on the host with a real password; accounts holding "!" are not affected, nor are glibc or PAM-using systems, Dropbear or OpenBSD. OX reports that on Alpine's official AWS and Azure images the default alpine user is such an account and can run doas without a password, so the bypass chains to root there. NCSC Switzerland lists Alpine, KISS, Sabotage, OpenWrt and Morpheus Linux as examples and rates exploitation status unknown; no source reports attacks, but the discoverer's write-up and at least one public lab (sshhole-lab, linked from the CVE record) make reproduction trivial, and CISA's ADP entry in the NVD record carries SSVC exploitation "poc". Temporary mitigation: PasswordAuthentication no plus an sshd restart. Alpine shipped fixed packages for every branch back to 3.16 according to OX Security's table (edge 10.6_p2-r0, 3.24 10.3_p1-r2, 3.23 10.2_p1-r1, 3.22 10.0_p1-r11, 3.21 9.9_p2-r1, 3.20 9.7_p1-r6, 3.19 9.6_p1-r3, 3.18 9.3_p2-r4, 3.17 9.1_p1-r7, 3.16 9.0_p1-r6; Alpine's own tracker was not fetched). heise notes other distributions and OpenSSH download servers still ship 10.6p1. OpenSSH says it is now releasing more often because AI-assisted rediscovery of such bugs by adversaries is likely.
    region_nexus: "global; NCSC Switzerland published its own advisory (Security Hub post 13155) the day of release, so home-region authority nexus is direct; Alpine is the default base image of many container workloads, so Swiss cantonal and federal container estates and OpenWrt-based edge devices are the realistic exposure"
    primary_sector_nexus: "indirect (musl-based containers, appliances and routers in public-sector estates; no public-sector incident reported)"
    sector: "public-sector"
