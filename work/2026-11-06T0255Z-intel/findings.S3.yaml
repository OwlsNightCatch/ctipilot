    extended_notes: |
      Delta against the covered ARTEX entry (2026-10-22/artex-storm-0940-...): that entry carries Microsoft's Storm-0940 spraying and Okta-registration abuse and Mandiant's incident-response sightings; it does not carry the GitHub secret-hunting stage, the workload-identity (service-principal) follow-on from 2026-10-28, the MSP downstream reach, or the Run Command abuse. Microsoft names no Storm-#### cluster for this activity. A distinct entry referencing both the ARTEX entry and the ConnectWise Cloud Backup entry (2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse) is a defensible alternative framing because Todyl treats it as a separate, unattributed operator; the main agent should choose one, not both.
      Detection concepts (telemetry class first): Entra service-principal and non-interactive sign-in logs (invalid-secret or expired-secret error followed within minutes by success for the same application from the same address; one address authenticating to three or more unrelated service principals; fixed retry loops of about 11 seconds and bursts of up to 24 sign-ins in 10 seconds, including against disabled or rotated apps); Azure Resource Manager token immediately followed by a Key Vault token and then previously unused apps in the same tenant authenticating (Todyl); app-only SharePoint downloads from non-Microsoft addresses at about one file per second after a single wildcard Graph search; Azure Activity and Key Vault diagnostics for bulk secret reads; Azure DevOps audit for PAT creation and federated service-connection use; Azure CLI public-client password-grant sign-ins from hosting providers. Behavioural tell of an agent: failed API calls corrected by changing api-version or method within about 30 to 80 seconds.
      Hardening levers named by Microsoft: remove long-lived client secrets in favour of managed identities or federated credentials; Conditional Access for workload identities (Workload ID Premium, single-tenant apps only); GitHub secret scanning with push protection and public monitoring; restrict who may register applications; rotate everything stored in any Key Vault the compromised application could read, because tokens already issued stay valid until expiry and deleting the repository copy does not revoke the credential. For MSPs: review Partner Center access and GDAP relationships.
      Source inconsistency to carry: Check Point's key points say more than 1,800 publicly exposed ARTEX instances while its body gives 2,557 hosting or having hosted panels and 1,608 live; Badbyte (separate item) counts 1,645 live consoles on 2026-11-04.
      Swiss angle: communal and cantonal IT is frequently outsourced to MSPs that operate the municipality's Microsoft 365 tenant with multitenant or delegated-admin applications; this is the exposure class Todyl describes.

