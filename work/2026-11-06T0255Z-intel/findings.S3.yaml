    discovery_trace: "first seen at: msft-secblog bridge feed (python3 tools/fetch_source.py msft-secblog recent 10) and the Microsoft threat-intelligence listing https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ → primary: Microsoft post https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/ → its References link to Todyl https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads (independent telemetry, same source address) → Check Point https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/ (from research.checkpoint.com feed) → CERT-In advisory https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02&VLCODE=CIAD-2026-0058 (from The Register / Hacker News leads)"
    summary: |
      Microsoft Threat Intelligence reports that since August 2026 threat actors have used the agentic offensive framework ARTEX to submit large volumes of queries to public GitHub, the queries often containing a target organisation name plus secret and cloud or AI-provider keywords, to find OAuth application secrets, application credentials and AI API keys. Microsoft then describes follow-on use of valid application credentials from 2026-10-28: service-principal sign-ins from a small set of hosting-provider addresses (one a Tor exit node that may carry unrelated activity) across dozens of applications in several tenants, including a vendor-owned multitenant application credential used to reach multiple downstream tenants; the agent then pulled tokens for Azure Resource Manager, Key Vault, Storage and Graph, read SharePoint, OneDrive and mailbox items, enumerated subscriptions, role assignments and AI deployments, and used the Run Command feature on Azure VMs. Microsoft says one agent went from a GitHub secret search to Azure Key Vault exfiltration in five minutes, and shows failed Resource Manager calls corrected within 28 to 80 seconds by switching the API version or HTTP method. Todyl, working from its own MXDR telemetry, independently reports one operator since 2026-11-01 signing in as roughly 45 application registrations at about 18 organisations in MSP environments (over 33 authenticated), reaching 27 organisations including MSP downstream clients in government, downloading 81 files and touching about 2,279 mailbox items, with no Microsoft vulnerability involved; Todyl says the activity is unattributed, unrelated to the October ConnectWise Cloud Backup compromise attributed to Storm-0940, and not tied to ARTEX or any specific framework (low confidence on AI direction). Todyl also says several seed secrets had only ever been used from staff devices and office networks, pointing to a file store or live backend rather than internet-crawled configurations, which sits in tension with the GitHub-scraping explanation; Microsoft presents the sign-ins as follow-on activity without stating that the Oct 28 credentials came from GitHub. Check Point adds operator-side evidence that ARTEX consoles run default configurations and that most agent campaigns observed were fully autonomous after goal setup, and CERT-In (2026-11-04) names an AI-assisted actor, CRAFTY FALCON, using ARTEX, PentAGI, Cairn and CyberStrikeAI against Indian financial entities, re-attacking victims after incomplete remediation and timing attacks to holidays and weekends.
