  - title: "Imperva: a third operator exploiting StyleSmuggler (CVE-2026-75650) on Magento and Adobe Commerce installs the PSK Agent Go RAT, reports success through DNS lookups and leaves a PHP webshell in pub/media"
    lookback: true
    sources:
      - { url: "https://www.imperva.com/blog/stylesmuggler-exploitation-deploys-psk-agent-rat-against-magento-stores/", publisher: "Imperva Threat Research", date: "2026-11-02", role: "primary" }
    discovery_trace: "first seen at: imperva-threat-research listing https://www.imperva.com/blog/ (python3 tools/fetch_source.py extract and url; lookback sweep, 168 h) → primary (no pivot needed): https://www.imperva.com/blog/stylesmuggler-exploitation-deploys-psk-agent-rat-against-magento-stores/"
    summary: |
      Imperva reports that between 2026-09-09 and 2026-09-13 it detected a coordinated campaign exploiting Magento and Adobe Commerce stores across Western Europe, North America and Asia-Pacific through the /paypal/transparent/response/ endpoint, the first stage of StyleSmuggler (CVE-2026-75650, covered in the store since 2026-09-08). In that stage the attacker places PHP in the query string, Magento writes the request to a report file under var/report/, and a second GraphQL request with an attacker-controlled styles parameter evaluates it. The observed payloads try shell_exec, system, exec and passthru in turn to pipe a remote shell script into bash; the script finds a writable and executable directory, fetches a roughly 10.5 MB obfuscated Go remote-access tool Imperva calls PSK Agent (shell commands, host data, SOCKS5 proxying, encrypted channels, scheduled persistence), some payloads report success by embedding the victim hostname in a DNS lookup to attacker-controlled authoritative DNS so the lookup alone confirms execution even if HTTP is blocked, and a subset also drop a roughly 900-line PHP file manager and webshell into publicly reachable directories including pub/media that can call libc through the PHP FFI and uses AES-256-CBC with a shared hard-coded key. Imperva assesses a likely Chinese-speaking operator with moderate confidence from Chinese-language comments and naming, does not attribute to a named group, and states this applies to the PSK Agent activity, not all StyleSmuggler exploitation (another actor ships a Rust backdoor). Its post-patch warning is that Adobe's VULN-39341 hotfix closes the entry point but removes neither the RAT, webshell nor stolen credentials.
    region_nexus: "Western Europe, North America, Asia-Pacific (opportunistic scanning of exposed Magento stores)"
    primary_sector_nexus: "indirect (e-commerce shops; relevant where public bodies or suppliers run Magento or Adobe Commerce storefronts)"
