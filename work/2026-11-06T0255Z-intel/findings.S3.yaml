  - title: "Kaspersky reconstructs a Storm-2603 ToolShell intrusion whose SharePoint implant lived only inside w3wp.exe: an ASP.NET VirtualPathProvider memory shell with a suo5 tunnel, then Velociraptor, three remote-access tunnels and a Warlock EDR killer"
    sources:
      - { url: "https://securelist.com/storm-2603-fileless-toolshell-attack/121467/", publisher: "Kaspersky (Securelist)", date: "2026-11-05", role: "primary" }
      - { url: "https://blog.talosintelligence.com/velociraptor-leveraged-in-ransomware-attacks/", publisher: "Cisco Talos", date: "2025-10-09", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist feed https://securelist.com/feed/ (item 'The SOC Files 5: Ghost in the pipeline, or a fileless SharePoint breach by Storm-2603') → primary: https://securelist.com/storm-2603-fileless-toolshell-attack/121467/ (full extract, detection section read) → Talos Velociraptor background, URL https://blog.talosintelligence.com/velociraptor-leveraged-in-ransomware-attacks/ (linked from the Securelist article)"
    summary: |
      Kaspersky's Global Emergency Response Team describes a retrospective analysis of a December 2025 intrusion at a customer's on-premises SharePoint server that it attributes to Storm-2603 with moderate confidence, on the basis of ToolShell exploitation, post-exploitation overlap and a Warlock-linked EDR killer. The timeline: on 20 December an ONYPHE internet-scanner request fingerprinted the ToolPane component for the ToolShell vulnerability (CVE-2025-53770), three days of silence followed so the probe was triaged low and not correlated, and on 24 December, when many teams are thinly staffed, the full remote-code-execution chain ran inside the IIS worker process from a Safing Privacy Network exit node. The implant was never written to disk: a modular C# memory shell registered a custom ASP.NET VirtualPathProvider, used reflection against the BuildManager to force registration even for precompiled apps, hooked GetCacheKey() to inspect incoming requests and stayed dormant unless a specific User-Agent matched, spoke a custom XOR-obfuscated binary protocol, and built a full-duplex proxy using the open-source suo5 tunnel so the SharePoint host became a pivot into the internal network. It also escalated to SYSTEM through named-pipe token impersonation derived from EfsPotato (the worker process holds SeImpersonatePrivilege) and created administrative accounts through native SAM RPC calls rather than command-line tooling. Shortly after injection w3wp.exe spawned msiexec to install an outdated Velociraptor build (0.73.4.0, vulnerable to CVE-2025-6264) from cloud storage, which the actor used for persistence, discovery and payload execution and to stand up Zoho Assist unattended access, a VS Code CLI tunnel, Cloudflare Tunnel and a reverse proxy, so access no longer depended on the IIS process; a vulnerable driver and a DLL-sideloaded Warlock AV killer followed, and Kaspersky's endpoint product blocked the Warlock encryption payload.
      Detection concepts Kaspersky gives: CLR loader events showing both a dynamically compiled App_Web_toolpane assembly and Microsoft.GeneratedCode in the same application domain after a ToolPane request (serialised data being turned into an object graph), plus YARA-style string hits for ObjectDataProvider, ExpandedWrapper and LosFormatter in memory; for the VirtualPathProvider implant, the Microsoft-Windows-IIS-Configuration ETW provider (events 25 and 47 present for a path with a missing file, without the FileChangeNotificationMonitor events 17, 18, 19 and 21 that a real file produces), an allow-list of legitimate VirtualPathProvider implementations, and memory inspection of w3wp.exe; behaviourally, w3wp.exe launching msiexec, unexpected outbound connections from the SharePoint server, RPC coercion against LSASS, and the arrival of remote-management or DFIR tooling after an application compromise. Kaspersky's lesson is that a confirmed SharePoint code-execution event needs host containment, persistence hunting, rotation of credentials and the exposed ASP.NET MachineKey, not removal of the initial exploit; a memory-resident implant survives until the application pool recycles.
    region_nexus: "global; on-premises SharePoint Server estates are widespread in Swiss federal, cantonal and communal administrations"
    primary_sector_nexus: "direct (on-premises SharePoint is a standard government collaboration platform; Storm-2603 targets overlap public bodies in the covered Longlegs entry)"
    sector: "public-sector"
    cves: [CVE-2025-53770, CVE-2025-53771, CVE-2025-6264]
    techniques: [T1190, T1505.003, T1620, T1553, T1572, T1134.001, T1136.001, T1219.002, T1219.001, T1685, T1068, T1486]
    affected_products: ["Microsoft SharePoint Server", "Microsoft IIS", "Velociraptor", "Zoho Assist"]
    entity_keys: ["actor:warlock-storm-2603", "product:microsoft-sharepoint"]
    new_entities:
      - { key: "tool:velociraptor", type: tool, name: "Velociraptor", aliases: [], summary: "Open-source digital forensics and incident-response agent abused by ransomware operators as a post-compromise command-execution framework; Cisco Talos (2025-10-09) tied it to Storm-2603 with moderate confidence and Kaspersky (2026-11-05) saw an outdated build installed from a SharePoint web shell." }
      - { key: "tool:suo5", type: tool, name: "suo5", aliases: [], summary: "Open-source HTTP forward-proxy tunnelling tool used to pivot through compromised web servers; Kaspersky (2026-11-05) saw it implemented inside a SharePoint in-memory shell and AhnLab ASEC (2026-10-14) documents Suo5-based tunnelling cases." }
    relation_suggestions:
      - { subject: "actor:warlock-storm-2603", object: "tool:velociraptor", basis: "Kaspersky: Velociraptor was used for persistence, discovery, data collection and payload execution in the analysed case; Talos (2025-10-09) attributes Velociraptor-based ransomware activity to Storm-2603 with moderate confidence" }
      - { subject: "actor:warlock-storm-2603", object: "tool:suo5", basis: "Kaspersky: the in-memory shell used the suo5 tool for traffic proxying in a case it attributes to Storm-2603 with moderate confidence" }
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    classification_hint: "B2 (Kaspersky GERT is the first-hand incident-response owner; attribution is moderate confidence on TTP overlap; actor TTP background independently supported by Talos 2025)"
    novelty: new
    evidence:
      - quote: "This activity involved the attacker using the IIS worker process as an in-memory bridge to the customer’s infrastructure, keeping the access and control layer entirely within w3wp.exe without writing anything to disk."
        attribution: "Kaspersky"
        source_url: "https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"
      - quote: "Consequently, the presence of positive events 25 and 47 combined with the absence of the expected events 17, 18, 19, and 21 for the same path forms a reliable detection pattern"
        attribution: "Kaspersky"
        source_url: "https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"
      - quote: "this allows us to attribute this case to Storm-2603 with moderate confidence."
        attribution: "Kaspersky"
        source_url: "https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"
      - quote: "A confirmed SharePoint exploit with code execution should trigger host-level containment, persistence hunting, credential and exposed MachineKey rotation, and TTP-driven investigation rather than remediation limited to the initial exploit or known IOCs."
        attribution: "Kaspersky"
        source_url: "https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"
    extended_notes: |
      Date handling: the intrusion happened in December 2025 and Kaspersky publishes it now; ToolShell (CVE-2025-53770 and CVE-2025-53771) was patched in 2025, so the current exposure is unpatched or never-rotated SharePoint farms and the detection primitive itself (VirtualPathProvider runtime implants, CLR loader artefacts), which applies to any future SharePoint or ASP.NET deserialisation chain. No fixed-version table is in the article; read the version from the Microsoft 2025 SharePoint advisories before stating one.
      Benign lookalikes (Triage): App_Web_* assemblies and Microsoft.GeneratedCode are produced by normal ASP.NET compilation and XmlSerializer use, and VirtualPathProvider is a legitimate ASP.NET mechanism; Kaspersky says the indicators are not significant in isolation, the signal is the same-window combination after a ToolPane request, and that any VirtualPathProvider not on the application's inventory is anomalous. ONYPHE probes are benign scanner fingerprints; the lesson is the four-day correlation between a low-signal probe and a later exploit.
      Related covered entry: 2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware (Symantec: Longlegs/Storm-2603 SharePoint machine-key theft). This is a different intrusion with different implant tradecraft; add it to references.

