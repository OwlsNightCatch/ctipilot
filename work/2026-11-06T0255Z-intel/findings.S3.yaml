  - title: "Residential proxy exit nodes on a government network: Layer3 Intel sees 28 proxy services exiting through the White House address block 236 times in 30 days; Spur counted proxies in nearly 300 government-owned networks"
    sources:
      - { url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/", publisher: "Krebs on Security", date: "2026-11-05", role: "primary" }
      - { url: "https://layer3intel.com/blog/residential-proxies-white-house-network", publisher: "Layer3 Intel", date: "2026-11-04", role: "primary" }
    discovery_trace: "first seen at: The Register security feed https://www.theregister.com/security/headlines.atom (item 'The White House is apparently a popular residential proxy exit spot') and malware-news feed → pivot: Krebs https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/ (from https://krebsonsecurity.com/feed/) → primary: Layer3 Intel https://layer3intel.com/blog/residential-proxies-white-house-network (linked from the Krebs article)"
    summary: |
      Layer3 Intel, from its new Residential Proxy Observatory, reports that between 2026-10-05 and 2026-11-03 its proxy-enumeration pipeline exited 236 times through the network of the Executive Office of the President, from six addresses on 26 of 30 days, through 28 separate public residential proxy services, and that Spur and Synthient independently flag the same addresses as proxy exits; roughly half of the activity fell between 5 pm and midnight Eastern, which Layer3 reads as a person's device carrying a proxy SDK rather than public guest Wi-Fi, while stating its data shows the exits, not the device. Synthient said on X, as cited by Krebs, that the activity relates to multiple Windows 11 installations of the Infatica proxy program, a service whose founder's hosting firm King Servers hosted six of the eight addresses used in the 2016 Arizona and Illinois election-system compromises (Krebs). Krebs adds that Spur found residential proxies in nearly 300 government-owned and operated networks (January 2026 webinar) and that Infoblox found 65% of its customers querying residential-proxy domains. Layer3, citing Synthient's earlier research, notes that poorly secured proxy SDKs have allowed internal-network access and lateral movement, as with the Kimwolf botnet, so anyone buying proxy access could reach internal systems if an SDK on that network has the same flaw. The White House had not commented when Krebs published.
    region_nexus: "US executive branch; the Spur and Infoblox figures describe government and enterprise networks generally"
    primary_sector_nexus: "direct as an exposure class (proxy SDKs on staff devices in government networks); no Swiss measurement published"
    sector: "public-sector"
    cves: []
    techniques: [T1090]
    affected_products: ["Infatica proxy SDK"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_hint: "B2 (Layer3 Intel first-hand observation corroborated by Spur and Synthient flags and reported by Krebs; the device and user behind the exits are not identified)"
    novelty: new
    borderline: true
    borderline_reason: "Exposure-class awareness item (behaviour of unmanaged proxy SDKs), no campaign and no Swiss data; the ATT&CK mapping is weak. Kept because it states a government-network measurement and a concrete detection concept (DNS lookups for proxy-SDK service domains, inventory of monetisation SDKs and 'free' apps on managed devices)."
    evidence:
      - quote: "This is public access. Anybody can obtain it by signing up to a public residential proxy service, paying a few dollars and sending requests through it."
        attribution: "Layer3 Intel"
        source_url: "https://layer3intel.com/blog/residential-proxies-white-house-network"
      - quote: "Past research has shown that poorly secured proxy SDKs can allow internal network access and lateral movement."
        attribution: "Layer3 Intel"
        source_url: "https://layer3intel.com/blog/residential-proxies-white-house-network"
      - quote: "found residential proxies in nearly 300 government owned and operated networks"
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/"
    extended_notes: |
      Triage: legitimate use of consumer VPN or bandwidth-sharing apps by staff produces similar DNS and egress telemetry; the discriminating features are proxy-SDK service domains queried from managed endpoints, high-volume outbound connections from a workstation to many destinations at odd hours, and endpoint software not in the approved inventory.

  # ------------------------------------------------------------------ 12
  - title: "CERT-AGID paper (Italy): a laboratory LoRA backdoor in an open-weight model fires only when a specifically named MCP server is connected, so a model can ship before its trigger exists"
    sources:
      - { url: "https://cert-agid.gov.it/news/backdoor-nei-modelli-open-weight/", publisher: "CERT-AGID (Agenzia per l'Italia Digitale)", date: "2026-11-04", role: "primary" }
    discovery_trace: "first seen at: malware-news feed https://malware.news/latest.rss (page 1; topic https://malware.news/t/backdoor-nei-modelli-open-weight/127001) → primary: https://cert-agid.gov.it/news/backdoor-nei-modelli-open-weight/ (Italian; paper PDF https://www.agid.gov.it/sites/agid/files/2026-11/La%20backdoor%20attende%20il%20suo%20turno_paper%20nov26.pdf read through the pdf subcommand, text partly character-split)"
    summary: |
      CERT-AGID, the Italian public-administration CERT, publishes a laboratory paper, 'La backdoor attende il suo turno', showing that a model can be taught through LoRA adapter training an extra behaviour that activates when a specific MCP server name appears among the available tools: in the configuration studied, a Qwen-based open-weight model generated an additional HTTPS call to a learned URL only when the trigger server was present, six real GET requests succeeded in the final comparison, and with the server absent or given a neutral name no calls were produced. The authors note the method is not specific to Qwen, that LoRA adapters can be distributed separately or merged into the weights, and describe a plausible two-stage supply chain in which a useful model or adapter is published on a model hub with a conditional behaviour and an MCP server with the trigger name is distributed later, making the behaviour operational without a weight update. CERT-AGID states that the experiment tests the activation mechanism, not an actual malicious distribution, and that a correct answer does not establish that the assistant did only what it was asked; actions through connected tools must be observed. Relevance for administrations adopting open-weight models with MCP tool servers is the validation gap, since initial acceptance testing would not see a trigger that depends on a tool added later.
    region_nexus: "Italy (national authority); applicable to Swiss administrations that adopt open-weight models and MCP tool servers"
    primary_sector_nexus: "direct (published by the Italian public-administration CERT; concerns AI deployment in public bodies)"
    sector: "public-sector"
    cves: []
    techniques: [T1195]
    affected_products: ["Hugging Face model hub", "Model Context Protocol servers", "Qwen open-weight models"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    classification_hint: "A2 for authorship and experiment facts (CERT-AGID is the owner); the threat scenario is hypothetical, not observed in the wild"
    novelty: new
    borderline: true
    borderline_reason: "Laboratory proof of concept with no in-the-wild observation, and published 2026-11-04, a few hours before the 26 h window floor (no earlier fire covered it; the malware.news mirror is dated 2026-11-04 12:15 UTC). The main agent should drop it if the window floor is strict; it is surfaced because it is a neighbouring national authority's primary research on a deployment pattern likely in public bodies."
    evidence:
      - quote: "Un comportamento appreso può restare inattivo durante le verifiche iniziali e manifestarsi quando l’ambiente cambia."
        attribution: "CERT-AGID"
        source_url: "https://cert-agid.gov.it/news/backdoor-nei-modelli-open-weight/"
    extended_notes: |
      English gloss of the quote: a learned behaviour can stay dormant during initial checks and appear when the environment changes. Hunting concept: log and review tool-call and outbound-request telemetry from agent runtimes (not only model text output) and re-run acceptance tests when MCP servers are added; compare tool-initiated network destinations with the user request. The paper cites earlier CERT-AGID work on MCP implementations (April 2026) and 'Explosive Prompts' (October 2026).

