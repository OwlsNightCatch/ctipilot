  - title: "Trojanised copy of the ARTEX Docker image hands an unauthenticated root shell on its login endpoint: 7,946 pulls before takedown, 62 internet consoles served it, 637 GitHub repositories still point their compose file at it"
    sources:
      - { url: "https://badbyte.io/artex-backdoor-docker-image/", publisher: "Badbyte (independent researcher)", date: "2026-11-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/backdoored-docker-image-for-artex-ai.html", publisher: "The Hacker News", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews (item 'CERT-In Flags AI-Driven Attacks as Backdoored ARTEX Exposes 62 Consoles to Root Access') → drilled https://thehackernews.com/2026/11/backdoored-docker-image-for-artex-ai.html → primary: Badbyte research https://badbyte.io/artex-backdoor-docker-image/ (linked from the article)"
    summary: |
      Badbyte reports that after the ARTEX author made the project closed source on 2026-10-08 and took the repository down, a new Docker Hub account pushed an ARTEX image within hours and a GitHub account uploaded a copy of the source with one line changed to pull that image; the README was rewritten to present it as the maintained successor and about 2,449 star events were recorded on the copy, roughly 1,100 of which later disappeared. The image carries one added function in the login handler: a request to the unauthenticated login endpoint whose captcha field starts with a secret marker is passed to a shell as root and the output returned before any credential check, so from the network the trigger looks like a failed login; Badbyte derived this by diffing the shipped binary against the official build (31,054 functions identical, one new 160-byte function, a longer login handler and an extra request field), notes the binary was built from a commit plus uncommitted changes so no public source shows it, and says updating does not remove it because the update script pulls the same image. Badbyte counts 7,946 pulls by 2026-11-03 (The Hacker News cites Docker Hub statistics of about 9,000), 62 internet consoles serving the backdoored build between 2026-11-02 and 11-04 (26 in the United States, 17 in Hong Kong; 46 of them still serving it on 11-04), 637 GitHub repositories still pointing their compose file at it, and 1,645 live ARTEX consoles in total with 590 more running an unversioned build it cannot classify. Docker removed the two images after Badbyte's request (update dated 2026-11-05); any copy already pulled or cached on a mirror remains backdoored. The consoles store model API keys, harvested target credentials, intercepted traffic and a session-signing key in plaintext, so a backdoored console exposes the operator's targets as well as the operator. Badbyte states the implant never calls home and is a single-researcher finding, though reproducible from the binary diff it publishes.
    region_nexus: "global; relevant to any organisation whose red team, pentesters or researchers evaluated ARTEX from GitHub or Docker Hub copies"
    primary_sector_nexus: "indirect (offensive-tooling hygiene for government red teams and CSIRT labs; exposed consoles may hold third-party target data)"
    sector: "technology"
    cves: []
    techniques: [T1195.002, T1204.003, T1190, T1059.004]
    affected_products: ["ARTEX", "Docker Hub", "GitHub"]
    entity_keys: ["tool:artex"]
    new_entities:
      - { key: "incident:artex-trojanized-docker-image-2026-11", type: incident, name: "Trojanised ARTEX Docker image (tomicdd/artex)", aliases: [], summary: "Badbyte (2026-11-04) reports a copycat ARTEX repository and Docker image carrying an unauthenticated root-shell backdoor in the login handler, pulled 7,946 times before Docker removed it on 2026-11-05; 62 internet consoles served it (Badbyte; The Hacker News 2026-11-05)." }
    relation_suggestions:
      - { subject: "incident:artex-trojanized-docker-image-2026-11", object: "tool:artex", basis: "Badbyte: a trojanised build of the ARTEX console image and a copycat source repository (a trojanised distribution of the tool, not the upstream project itself)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "C2 (independent researcher; technically reproducible binary diff, not independently confirmed by a second lab; The Hacker News repeats Badbyte)"
    novelty: new
    evidence:
      - quote: "The image contains one extra function. It runs whatever command arrives in the login form, before the password is checked, and sends the output back."
        attribution: "Badbyte"
        source_url: "https://badbyte.io/artex-backdoor-docker-image/"
      - quote: "Any copy already pulled, or cached on a third-party mirror, is still backdoored."
        attribution: "Badbyte"
        source_url: "https://badbyte.io/artex-backdoor-docker-image/"
      - quote: "From the network, the trigger looks like a failed login."
        attribution: "Badbyte"
        source_url: "https://badbyte.io/artex-backdoor-docker-image/"
      - quote: "As many as 62 ARTEX consoles on the internet have been found to serve the backdoored build between November 2 and 4, 2026"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/backdoored-docker-image-for-artex-ai.html"
    extended_notes: |
      Exposure: anyone who installed ARTEX from a third-party GitHub copy or from Docker Hub namespaces other than the upstream author's; the compose file publishes the console on all interfaces (default port 8787) and the container runs as root with database and LLM keys in its environment. Triage: a POST to the console's login endpoint with an unusual captcha field is indistinguishable from a failed login in access logs unless request bodies are logged; Badbyte describes an internet-fingerprintable fixed UI build identifier in the backdoored build (not reproduced here). Post-incident: treat the host and every credential, model API key and target secret stored by the console as compromised; re-pulling does not clean persistent data directories.
      THN and Badbyte disagree on the pull count (about 9,000 versus 7,946); the item carries Badbyte's figure as primary.

