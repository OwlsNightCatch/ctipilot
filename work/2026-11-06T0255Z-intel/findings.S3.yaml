  - title: "Debian and Ubuntu apt flaw CVE-2026-109518: an on-path attacker can swap a package after verification and run code as root; fixes shipped 2026-11-04, no exploitation reported, retries are on by default from Debian 12 and Ubuntu 22.04"
    sources:
      - { url: "https://www.stepsecurity.io/blog/cve-2026-109518-apt-package-swap-root", publisher: "StepSecurity", date: "2026-11-05", role: "primary" }
      - { url: "https://ubuntu.com/security/notices/USN-8996-1", publisher: "Ubuntu Security", date: "2026-11-04", role: "primary" }
      - { url: "https://security-tracker.debian.org/tracker/CVE-2026-109518", publisher: "Debian Security Tracker", date: "2026-11-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/debian-and-ubuntu-apt-flaw-lets-mitm.html", publisher: "The Hacker News", date: "2026-11-04", role: "corroborating" }
    discovery_trace: "first seen at: stepsecurity-blog feed https://www.stepsecurity.io/blog/rss.xml (item CVE-2026-109518) → pivot: Hacker News https://thehackernews.com/2026/11/debian-and-ubuntu-apt-flaw-lets-mitm.html → primary: Ubuntu USN https://ubuntu.com/security/notices/USN-8996-1 and Ubuntu CVE page https://ubuntu.com/security/CVE-2026-109518 → Debian tracker https://security-tracker.debian.org/tracker/CVE-2026-109518 (Debian security announcement and APT developers' list were behind a proof-of-work challenge and not read)"
    summary: |
      Debian and Ubuntu shipped fixes on 2026-11-04 for CVE-2026-109518, a flaw in apt found by Max Justicz (who found the similar CVE-2019-3462) in the code that resumes interrupted downloads. An attacker who controls the HTTP traffic between apt and its mirror, for example a malicious mirror, proxy or compromised network, answers two package requests with redirects to the same URL so apt merges the downloads, forces a retry with ordinary temporary server errors, and, because apt mishandles the hard links it uses for the merged download, the resumed transfer overwrites the verified file after the hash check; apt then installs the attacker's package and its maintainer scripts run as root. Exploitation requires a non-zero Acquire::Retries setting, which defaults to 3 on Debian 12 and Ubuntu 22.04 and later, so older releases are not exposed by default unless scripts raised the retry count; Snap and FTP sources are not affected. Ubuntu rates it high priority, CVSS 4.0 7.7, and lists fixed apt builds for 22.04 (2.4.15ubuntu0.1), 24.04 (2.8.4ubuntu0.1), 26.04 (3.2.1ubuntu0.1) and 26.10 (3.3.3ubuntu0.1) plus Pro and Legacy Support builds for 14.04 to 20.04; the Debian tracker lists bookworm fixed in 2.6.2 and trixie in 3.0.4, and sid in 3.3.6. The Hacker News reports that none of the advisories describes exploitation or a workaround for systems that cannot update. StepSecurity frames the CI/CD exposure: self-hosted runners on flat networks, shared package caches and corporate egress proxies, and Docker builds that run apt-get install.
    region_nexus: "global; Debian and Ubuntu are common across Swiss public-sector Linux fleets, build runners and container images"
    primary_sector_nexus: "indirect (patch-and-verify item for Linux server and build estates; requires a network man-in-the-middle position)"
    sector: "technology"
    cves: [CVE-2026-109518]
