- code: F11
  category: editorial-advisory
  section: qilin-october-2026-build-vcenter-esxi-safe-mode-printers
  item: "body and Detection line"
  url_or_quote: "the October binary masquerades as resmon.exe ... an executable named resmon.exe outside System32"
  summary: "(low confidence, advisory) Style rule 12 lists file-name indicators among IOCs. The name is the masquerade target (a legitimate Windows binary) and Seqrite's table lists it as a behavior ('masquerades as resmon.exe'), so it can stand as a T1036 description; if the main agent wants zero literal file names, say 'a binary named after a Windows system utility and carrying a forged Microsoft signature overlay'. Optional."
- code: F11
  category: editorial-advisory
  section: cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
  item: "sourcing: OX Security alone carries the Alpine table, the * account condition and the detection step"
  url_or_quote: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"
  summary: "(low confidence, advisory) Alpine's own advisory (fetched this iteration, dated 2026-11-05) carries the same fixed-package table as OX (edge 10.6_p2-r0 ... 3.16 9.0_p1-r6), the 257 to 1024 byte range, the * account condition, the restart caveat and the 'Accepted password for' log check, so a vendor-primary citation is available for facts the entry rests on a C-grade blog for. It also adds that root ships as root:* but OpenSSH's default PermitRootLogin prohibit-password protects it, which the entry's parenthetical '(key-only users, LDAP users, root on Alpine)' does not say. Optional: add it as a source and a clause on root."
- code: F11
  category: editorial-advisory
  section: cve-2026-116779-freeswitch-sip-message-api-command-execution
  item: "Exposure scope"
  url_or_quote: "https://github.com/signalwire/freeswitch/releases/tag/v1.11.3"
  summary: "(low confidence, advisory, carry-over) The v1.11.3 release notes list both '[mod_sofia] Add enable-chat-api-proto to gate the api chat proto' and '[mod_verto] Add enable-chat-api-proto to gate the api chat proto'; the cited advisory scopes the flaw to SIP profiles and never names mod_verto, so the entry matches its source. A responder running Verto may want a clause that the advisory does not address Verto exposure. Optional."
