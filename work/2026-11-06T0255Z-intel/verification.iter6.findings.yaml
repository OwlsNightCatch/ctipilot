- code: F11
  category: editorial-advisory
  section: storm-2603-fileless-toolshell-virtualpathprovider-shell
  item: "sourcing_note and summary"
  url_or_quote: "sourcing_note: \"Kaspersky's incident-response team is the first-hand source for the intrusion\"; summary: \"installed an outdated Velociraptor\""
  summary: "(low confidence, advisory) https://securelist.com/storm-2603-fileless-toolshell-attack/121467/ says 'our retrospective analysis' under the 'SOC Files' series with the byline Alexander Rodchenko and Rodrigo Wanderson; it never names an incident-response team (carry-over of the iteration-5 advisory). It also says 'version 0.73.4.0 vulnerable to CVE-2025-6264', not 'outdated'. Say 'Kaspersky's own analysis' and 'a Velociraptor build vulnerable to CVE-2025-6264'. Optional."
