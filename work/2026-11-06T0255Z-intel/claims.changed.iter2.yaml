  - claim_id: b4adbefaf9
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "record 2026-11-06T03:41:00Z"
    kind: record-summary
    text: "watchTowr Labs published the full chain on 2026-11-05 and a detection tool: one unauthenticated request to the Email Security Gateway's login handler reaches the backup-restore function, a secret that is hard-coded in the product lets an attacker build a valid archive, and the restored timezone value reaches the root command injection, so exploitation needs no account; Barracuda changed its own advisory the same day to say authentication is not required for CVE-2026-116606. No source reports attacks; priority moves to high, the CVE records add public tooling, the fixed build is stated as 9.4.0.029, and a compromise check is added."
  - claim_id: 5fd9f58a68
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "actions[0]"
    kind: frontmatter
    text: "On every musl-based Linux host that runs sshd (Alpine, OpenWrt, Buildroot, Yocto), install OpenSSH 10.6p2 or the distribution's fixed openssh package and restart sshd, because updating the package does not replace the running server, and rebuild container and cloud images from a fixed base; until then set PasswordAuthentication no in sshd_config and restart sshd."
