    surface: "body"
    kind: cited
    text: "On December 20 a single request to a SharePoint administrative endpoint tied to the ToolPane component fingerprinted the host for ToolShell (CVE-2025-53770); the full exploit chain ran on December 24 against the same endpoint, and the gap kept the probe from being correlated with it ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: a8e52f58dc
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "The payload was loaded into the ASP.NET runtime and lost when the application pool recycled or IIS restarted ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
