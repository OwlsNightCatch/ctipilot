  item: "microsoft-email-threat-landscape-q3-2026-security-overrides"
  url_or_quote: "Aggregate volume totals are left out as vendor-scale metrics, and the mitigations are Microsoft's own."
  summary: "(low confidence, advisory) The sentence narrates what the entry omitted and why, a composition-rationale sentence in a reader-facing field; the field should carry provenance only (first-party Microsoft telemetry, single source, share-of-month figures). The ledger and the page support every fact in the note."
