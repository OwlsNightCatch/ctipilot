  item: "storm-2603-fileless-toolshell-virtualpathprovider-shell"
  url_or_quote: "Kaspersky's incident-response team is the first-hand source for the intrusion"
  summary: "(low confidence, advisory) https://securelist.com/storm-2603-fileless-toolshell-attack/121467/ never names the Kaspersky team; it says 'our retrospective analysis' and carries the byline Alexander Rodchenko and Rodrigo Wanderson under a 'SOC Files' series line. Say 'Kaspersky's own analysis' instead of naming a team the page does not name."
- code: F11
  category: editorial-advisory
  section: sourcing_note
  item: "cve-2026-116606-barracuda-esg-auth-bypass-root-rce"
  url_or_quote: "The CVSS scores are those NCSC Switzerland gives for the two CVEs."
  summary: "(low confidence, advisory) True but oddly attributed: Barracuda's own advisory carries CVSS Score 9.3 and 8.6, and Mandiant's pages give the same figures as CVSS:4.0 metrics, so the scores originate with the vendor, not NCSC. watchTowr also notes the installer comment reads CVSS 9.8 against 9.3 in the advisory, which the entry does not surface. Optional rewording: 'The scores are Barracuda's, restated by NCSC Switzerland and Mandiant (CVSS 4.0).'"
- code: F11
  category: editorial-advisory
  section: body (Exposure / fix scope)
  item: "cve-2026-116779-freeswitch-sip-message-api-command-execution"
  url_or_quote: "**Exposure:** a FreeSWITCH of version 1.11.2 or earlier with a SIP profile that accepts inbound MESSAGE from a peer that can reach it, which is the default configuration"
  summary: "(low confidence, advisory) The v1.11.3 release notes (https://github.com/signalwire/freeswitch/releases/tag/v1.11.3, linked from BSI's advisory) list '[mod_sofia] Add enable-chat-api-proto to gate the api chat proto' and '[mod_verto] Add enable-chat-api-proto to gate the api chat proto'. The cited advisory scopes the flaw to SIP profiles and never mentions mod_verto, so the entry matches its source; a Tier 2 responder running Verto may want a clause that Verto exposure is not addressed by the advisory. Optional."
