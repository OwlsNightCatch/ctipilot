  extended_notes: 'EXPOSURE: customers (mostly agencies) who connected mStudio to an AI assistant through the mittwald MCP server; mittwald says only those users are affected and mails them. Organisations whose agency or web supplier hosts at mittwald should ask the agency whether it used the MCP interface and whether site files, webmail forwarding rules or credentials were touched. DETECTION (telemetry class = hosting control-panel and API audit logs, SSH logins, file-integrity on hosted web roots, mail forwarding or filter rules): look for panel or API actions from token-based sessions around 2026-10-27 onward, new SSH keys or users, and modified web files. Generic lesson for any operator exposing an MCP or agent endpoint to its management plane: tokens issued to the agent interface are bearer credentials with panel scope and need scoping, short lifetime and revocation (mittwald''s own developer docs describe OAuth 2.1 with PKCE and scoped permissions). That statement is from mittwald''s documentation surfaced in a search, not from the incident notice, so it is only background.'
