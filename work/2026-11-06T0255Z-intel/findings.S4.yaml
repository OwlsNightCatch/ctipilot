  evidence:
  - quote: Since November 1, one operator has been signing in to MSPs' Microsoft 365 and Azure environments as their own applications, using stolen credentials that are still valid.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
  - quote: Through those apps the actor has reached 27 organizations so far, including the MSPs' downstream clients in government, energy, food and agriculture, transportation, construction and engineering, legal, education and nonprofits.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
  - quote: No Microsoft vulnerability is involved.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
  - quote: Because these are app sign-ins, there is no MFA prompt, user-scoped Conditional Access doesn’t apply, and firewall rules never see the traffic.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
  - quote: We assess it as unrelated to the October 2026 ConnectWise Cloud Backup (formerly SkyKick) compromise attributed to Storm-0940.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
  extended_notes: 'EXPOSURE: any tenant, MSP or customer, that holds Entra app registrations with client secrets (especially multi-tenant, GDAP or Partner Center apps, security-tool integration apps and Azure DevOps service connections); Todyl notes workload-identity Conditional Access needs the standalone Workload ID Premium licence and covers only single-tenant apps, not managed identities, multitenant apps or third-party SaaS. DETECTION (telemetry class = identity provider sign-in logs for service principals and non-interactive users, Azure resource and Key Vault diagnostics, SharePoint and Graph audit, Azure DevOps auditing): per Todyl, an invalid-secret error (AADSTS7000215 or 7000222) followed within minutes by a success for the same app from the same address; one address authenticating as service principals across several unrelated tenants within 24 hours; an ARM token immediately followed by a Key Vault token and then previously unused apps authenticating; app-only SharePoint downloads from non-Microsoft addresses at about one file per second after a single wildcard Graph search; fixed retry loops of about 11 seconds against disabled or rotated apps; refresh-token replay and Azure CLI password-grant (ROPC) sign-ins from hosting addresses; failed service-principal sign-ins from hosting space that never succeed, which success-only logic misses. POST-CLEAN CHECK: remove all secrets, certificates and federated credentials on an affected app and watch for ones you did not add; issued tokens stay valid until expiry; revoke user sessions, Azure DevOps PATs and SSH keys; rotate everything in any Key Vault the app could read and every credential found in accessed documents; MSPs check Partner Center, GDAP relationships and customer tenants and notify clients. TRIAGE: legitimate automation service principals authenticate from known cloud or office egress and a given address touches one or few apps; Todyl''s discriminator is one address fanning out across many apps and tenants, secret-ID-before-secret failures and machine-speed credential-themed file downloads. HARDENING per Todyl: retire client secrets (managed identities, then workload identity federation, then vault-held certificates), Entra app management policies to block new secrets and cap lifetimes, Key Vault and Storage behind private endpoints or selected networks, Azure DevOps PAT and service-connection limits, least-privilege time-bound GDAP, never keep customer app secrets in runbooks or PSA/RMM notes. No IOCs carried (Todyl lists one operator address, intentionally omitted).'
