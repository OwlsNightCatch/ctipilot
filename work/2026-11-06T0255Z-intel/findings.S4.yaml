  new_entities:
  - key: incident:digicert-archived-validation-data-exposure-2026-11
    type: incident
    name: DigiCert archived validation data exposure (disclosed November 2026)
    aliases: []
    summary: Unauthorised read-only access, 2026-06-27 to 2026-07-02, to archived customer validation data on a DigiCert internal system left internet-reachable by a 2025-02-04 migration; confirmed 2026-10-19, disclosed in Mozilla's CA incident tracker (DigiCert, 2026-11-05).
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  borderline: true
  borderline_reason: A CA's data incident, not a certificate-issuance compromise; no Swiss public-sector nexus shown; moderate impact (contact data, identity documents for a small minority). Cleared only on (a) the CA's standing and a second 2026 DigiCert event, and (b) the transferable exposure pattern (a migration silently removing a network restriction from an internal system whose self-registration endpoint lacked MFA). Main agent decides.
  classification_suggestion:
    reliability: A
    credibility: '1'
    note: victim's own full report in the root-store tracker, relayed by BleepingComputer with customer notifications
  evidence:
  - quote: This migration inadvertently allowed this internal business system to be accessible externally.
    attribution: DigiCert
    source_url: https://bugzilla.mozilla.org/show_bug.cgi?id=2084460
  - quote: accounts registered through this endpoint were not subject to the multi-factor authentication (MFA) that DigiCert otherwise requires
    attribution: DigiCert
    source_url: https://bugzilla.mozilla.org/show_bug.cgi?id=2084460
  - quote: On 2026-10-19, DigiCert confirmed unauthorized access to a subset of archived data and determined this to be a reportable event.
    attribution: DigiCert
    source_url: https://bugzilla.mozilla.org/show_bug.cgi?id=2084460
  - quote: The access could not write records, act as a validation approver, or issue certificates.
    attribution: DigiCert
    source_url: https://bugzilla.mozilla.org/show_bug.cgi?id=2084460
  extended_notes: 'EXPOSURE: customers (including public bodies) who submitted validation documents or contact details to DigiCert; DigiCert notifies affected customers directly and is still reviewing identification documents. DETECTION/HARDENING lesson for own estates (telemetry class = external attack-surface inventory and identity-provider registration logs): after any network or availability-zone migration re-verify that internal systems are not reachable externally, and disable or protect self-registration endpoints in shared account-manager components; DigiCert first treated the issue as an account-creation problem rather than a data-access event, so an unexplained externally created account on an internal system warrants a data-access review of its permissions, not only a closure of the registration path. No certificate or CA-key action is needed per DigiCert.'
