  discovery_trace: 'first seen at: srf-news (not in slice, home-region sweep), feed https://www.srf.ch/news/bnf/rss/1646 (item ''Kühlanlage manipuliert – Berner Metzgerei Opfer von Hackerangriff – auch Volg betroffen'') → primary: SRF article https://www.srf.ch/news/schweiz/kuehlanlage-manipuliert-berner-metzgerei-opfer-von-hackerangriff-auch-volg-betroffen → pivot: swissinfo front page via url --direct https://www.swissinfo.ch/ger/ → Keystone-SDA https://www.swissinfo.ch/ger/metzgerei-in-k%c3%b6niz-muss-nach-cyberangriff-vor%c3%bcbergehend-schliessen/92334848 and https://www.swissinfo.ch/ger/hackerattacken-auf-gewerbe%3a-bund-begr%c3%bcsst-freiwillige-meldungen/92335202 → pivot: Netzwoche https://www.netzwoche.ch/news/2026-11-02/update-angriffe-auf-kuehlanlagen-treffen-weitere-supermaerkte-auch-coop-im-visier. US leg: bleepingcomputer slice record, feed https://www.bleepingcomputer.com/feed/ → https://www.bleepingcomputer.com/news/security/fbi-cisa-warn-of-cyberattacks-targeting-refrigeration-systems/ → primary: CISA fact sheet and news release (WebFetch) → Guardian https://www.theguardian.com/technology/2026/nov/04/france-national-blood-service-hack-cyber-attack-europe'
  summary: 'Two developments on the refrigeration-controller campaign the store already covers. (1) Switzerland: SRF reported on 2026-11-05 the first publicly known successful attack of this kind in the country. The butcher Lüthi''s Fleischwaren in Köniz (canton Bern) states in a flyer and on its website that the electronic control of its cooling and freezing units was manipulated in a targeted cyberattack; its owner told SRF the freezer reached 50 to 70 degrees; the units were disconnected from the network and the shop closed. Volg told SRF that three of its stores noticed that parameters in the cooling shelves had been altered and that its technical safeguards were reinforced. Keystone-SDA adds that Kantonspolizei Bern was informed on Monday 2 November, had received no complaint yet and opened inquiries, and that the BACS says it has received one mandatory report about an attack on commercial refrigeration systems; the reporting duty covers suppliers of essential goods above SME thresholds, so a butcher usually falls outside it, and the BACS says voluntary reports are explicitly welcome. Blutspende SRK Schweiz told Keystone-SDA that no attack on Swiss blood donation services is known. Netzwoche had earlier recorded that Coop registered unsuccessful attempts. None of these sources names the controller make, the access route or an actor, and none ties the Swiss cases to the Danfoss, Copeland or Dixell devices of the earlier waves. (2) United States: on 2026-11-05 CISA, the FBI, HHS, USDA and DOT published a joint fact sheet stating that malicious actors worldwide target vulnerabilities and weaknesses in unpatched or internet-accessible electronic temperature controllers and commercial refrigeration controllers in retail grocery, cold storage and refrigerated transport. The fact sheet says the actors may use authentication bypass, arbitrary code injection or weak configuration to push units into continuous heating and defrost cycles and to reduce visibility of current temperatures, and it names no vendor, product, CVE or actor; CISA says it is actively tracking the activity. Its mitigations are to remove controllers from internet exposure, protect any needed remote access with an updated firewall or edge device, isolate the OT in a dedicated VLAN, change default passwords, patch or retire end-of-life devices, allowlist devices and IPs, enable and review logs, keep reasonable setpoint limits downstream of the controllers and alert on setpoint deviations. The Guardian (2026-11-04) adds that retailers in Italy, Germany, Romania and the UK were targeted on 2026-11-03 after Belgium, Estonia, Ireland, Finland, Luxembourg, the Netherlands and Sweden on 2026-11-02, that Italy''s government held emergency talks with intelligence officials, and that an EU spokesperson said the bloc''s agencies are working on a collective response; the store entry''s last record (2026-11-05) does not carry the 2026-11-03 countries.'
  region_nexus: 'Switzerland (first public cases: Köniz BE, three Volg stores; BACS holds one mandatory report) and the EU wave'
  primary_sector_nexus: 'indirect: commercial refrigeration at retailers; the same remotely managed controllers keep public-sector cold chains (the French blood service EFS case is in the entry) and municipal or hospital cold rooms'
  sector: retail; food; healthcare; public-sector (indirect)
