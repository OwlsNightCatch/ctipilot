  discovery_trace: 'first seen at: bleepingcomputer (slice record), feed https://www.bleepingcomputer.com/feed/ → https://www.bleepingcomputer.com/news/security/digicert-data-breach-exposes-customer-information-identity-documents/ → primary: DigiCert''s Mozilla Bugzilla incident report https://bugzilla.mozilla.org/show_bug.cgi?id=2084460 (extract). Also seen on cyberdaily-au listing https://www.cyberdaily.au/security and the borncity roundup https://borncity.com/blog/2026/11/05/sicherheitskatastrophen-5-11-2026-digicert/'
  summary: DigiCert's own incident report to Mozilla (full report, updated 2026-11-05) says an internal business system that archives information customers supply to validate their identity was moved on 2025-02-04 from a VPN-restricted segment to a different availability zone, which inadvertently made it reachable from outside. Its account manager exposed a registration feature intended for other use cases, so accounts registered through that endpoint were not subject to the MFA DigiCert otherwise requires and were assigned read-only mode by default, yet could read the archived data. DigiCert determined on 2026-06-21 that the system was externally accessible and that an unassigned account had been created (a managed security research program report is named as one route), deployed an authorisation fix on 2026-07-02 without knowing archived data had been read, and on 2026-10-19 confirmed unauthorised access to a subset of archived data and declared it reportable; BleepingComputer states the unauthorised account read customer information between 2026-06-27 and 2026-07-02. Most data is business contact information (names, business e-mail addresses, phone numbers, addresses); for a small minority of customer accounts it includes a customer-provided document such as a driver's licence, passport or utility bill. DigiCert says no certificate operations were impacted, the access could not write records, act as a validation approver or issue certificates, and CA services, CertCentral and DigiCert ONE were unaffected; customer notifications are going out and identification documents are still being reviewed. The store's registry already holds a separate DigiCert event of May 2026 (support-portal compromise leading to 60 fraudulent EV code-signing certificates).
  region_nexus: global CA; no Swiss public-sector customer shown
  primary_sector_nexus: 'indirect: certificate customers (including public bodies buying OV/EV certificates) supply validation documents to CAs'
  sector: IT services / PKI
  cves: []
