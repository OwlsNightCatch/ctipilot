  discovery_trace: 'first seen at: borncity (slice record), feed https://borncity.com/blog/feed/ → https://borncity.com/blog/2026/11/05/hoster-mittwald-opfer-eines-cyberangriffs-5-11-2026/ → primary: mittwald MCP FAQ https://www.mittwald.de/lp/mcp-faq and status page https://www.mittwald-status.de/incidents (both fetched with extract). WebSearch for a second outlet (heise, golem, Inside IT) found none.'
  summary: 'Mittwald, a German hosting provider (Espelkamp) whose mStudio panel is used by web agencies and freelancers to run TYPO3, WordPress, Joomla and Magento sites, states in its own FAQ that its analysis found on 2026-11-04 an unauthorised access to its MCP server on 2026-10-27. The MCP server is the interface through which customers connected their mStudio to AI assistants; during the access, user access tokens (session tokens, not passwords) of people who used that interface were read; mittwald says all were revoked, and that the attacker deliberately masked his preparations with actions that looked like normal user behaviour. mittwald''s own analyses later confirmed unauthorised access to mStudio through the MCP server. As precaution it switched off the MCP server (offline until further notice), the mStudio login, all SSH connections, mittwald extensions and ordering, and deactivated a small part of the hosted projects; hosted websites and mail keep running, affected customers get a personal e-mail, it found no published data on relevant platforms, and it cannot rule out that unauthorised access to its systems is still possible. A reader''s account relayed by Born says customers could not log in to mStudio or reach their servers over SSH for hours and that agencies could not reach client projects. Not stated: how the MCP server was entered, how many tokens or customers are affected, any actor, or any Swiss customer. mittwald''s FAQ reads ''no new findings'' at 21:00 CET on 2026-11-05.'
  region_nexus: Germany (DACH hosting provider); no Swiss customer or public-sector client shown
  primary_sector_nexus: 'indirect: agencies host client and public-body websites on such platforms; supply-chain blast radius not quantified'
