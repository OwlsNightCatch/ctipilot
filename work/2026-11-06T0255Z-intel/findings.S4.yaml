  extended_notes: 'Update-shape item for the main agent: a changelog `update` on the existing entry (moves the Swiss nexus from ''attempts failed at Coop'' to first confirmed Swiss victims; adds the 2026-11-03 countries and the US authority statement). EXPOSURE: the Swiss victims are a butcher and Volg stores; which controller or remote-monitoring service they use is not published, so the existing entry''s exposure test (internet-reachable refrigeration supervisors, including supplier remote-maintenance access) applies unchanged to any Swiss public body with remotely supervised cold rooms (hospital, blood depot, municipal kitchens). DETECTION: telemetry class = OT or building-management supervisor logs and alarm streams (setpoint or defrost-schedule changes outside maintenance windows, several units changed within minutes), remote-access gateway logs for supplier accounts, and exposed-service scanning of your own address space; CISA advises alerts on setpoint deviations and capturing network traffic where logs are unavailable. TRIAGE: planned defrost cycles and maintenance-window setpoint changes by the refrigeration contractor are the benign lookalike; the discriminator is a setpoint at or above 50 degrees or continuous defrost, applied to many units at once from a remote session, with product temperature rising despite alarms (from the earlier entry, not from these sources). DEFENDER TAKEAWAY: the only CISA-stated levers are exposure removal, segmentation, credential hygiene, patching or retiring EOL units and downstream setpoint limits; the fact sheet adds no technical indicator. Caveat: the CISA quotes marked as such come from BleepingComputer''s verbatim quotation; the CISA pages were read through WebFetch (summariser), so only BleepingComputer''s quotation is carried as evidence.'
- title: Stolen application credentials at managed service providers used to sign in as the MSPs' own Entra ID apps and Azure DevOps identities, reaching 27 organisations including government clients (Todyl MXDR)
  sources:
  - url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
    publisher: Todyl (MXDR investigation updates of 2026-11-03, page last updated 2026-11-04)
    date: '2026-11-03'
    role: primary
  - url: https://cybersecuritynews.com/stolen-entra-id-and-azure-credentials/
    publisher: Cyber Security News (rewrite of the Todyl post, not independent)
    date: '2026-11-04'
    role: corroborating
  discovery_trace: 'first seen at: borncity roundup, URL https://borncity.com/blog/2026/11/05/sicherheitskatastrophen-5-11-2026-digicert/ (cites a tweet about the campaign) → pivot: Cyber Security News https://cybersecuritynews.com/stolen-entra-id-and-azure-credentials/ → primary: Todyl https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads (read with extract and a WebFetch check that no update after 2026-11-03 exists)'
  summary: 'Todyl''s MXDR team reports an ongoing incident that began on 2026-11-01: one operator, working from a single hosting address, signs in to Microsoft Entra ID as application service principals using valid, pre-existing client secrets (and one Azure DevOps federated workload-identity credential) belonging to managed service providers. Todyl counts about 45 app registrations at roughly 18 organisations targeted, more than 33 authenticated successfully, and 27 organisations reached, among them the MSPs'' downstream clients in government, energy, food and agriculture, transportation, construction and engineering, legal, education and nonprofits; the figures cover only environments that send logs to Todyl. Per app the operator requests an Azure Resource Manager token, then Key Vault, Graph, Storage and Cognitive Services tokens, runs wildcard Microsoft Graph searches (29 across about 25 tenants), bulk-downloads SharePoint files at about one per second with file names about credentials and configuration (81 files and about 2,279 mailbox items seen), and uses MSP multi-tenant and delegated-admin apps and Partner Center tokens to reach client tenants (one app swept 15 client tenants in about 10-second loops). Todyl says no Microsoft vulnerability is involved, there is no sign a vendor platform was compromised even though integration apps of security tools were among those abused, the origin of the stolen secrets is unknown (several seed secrets had only ever been used from staff devices and office networks, which Todyl reads as a file store or live backend), and no persistence was seen. After detections fired on 2026-11-03 the operator switched to spoofed browser user agents and replayed users'' refresh tokens, all blocked by Conditional Access. Todyl assesses the activity as unattributed and unrelated to the October ConnectWise Cloud Backup (SkyKick) compromise attributed to Storm-0940 and holds AI-assisted automation at low confidence. The stolen files (password lists, private keys, VPN profiles, MFA and RMM API keys, backup-storage credentials, firewall and RDP configs) are what Todyl expects to be used next against VPNs, RMM platforms, backup storage and network devices.'
  region_nexus: global; government clients of MSPs named among victims, no Swiss victim shown
  primary_sector_nexus: 'direct in kind: public-sector bodies run on MSPs with Partner Center and GDAP delegation and on app-registered automation in Microsoft 365 and Azure'
  sector: public-sector; MSP / IT services
