    text: "Refrigeration attacks reach Switzerland, a Köniz butcher and three Volg stores; no actor established"
  - claim_id: f1d88d125c
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores; on 2026-11-02 more than 115 stores in at least six more countries and the first German shops followed. The French blood service EFS confirmed on 2026-11-03 that an incident at its refrigeration supplier altered the temperature and defrost thresholds of cold rooms at three EFS sites on 2 November, caught by its own alarms with no loss of blood products, and ENISA, the European Commission, Europol and the CSIRTs Network advised organisations on 2026-11-04 to take immediate action to mitigate exposure; no source ties the blood-service case to the Danfoss, Copeland or Dixell controllers. SRF reported on 2026-11-05 the first publicly known cases in Switzerland, a butcher in Köniz whose freezer reached 50 to 70 degrees and three Volg stores whose cooling parameters were changed; BACS has received one reportable notification, and CISA, FBI, HHS, USDA and DOT published a joint warning on refrigeration and cold-chain controllers that names no vendor. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, NCSC Switzerland rates the activity actively exploited and Coop Switzerland says attempts against it failed, ANSSI says elementary flaws were exploited, controllers directly on the internet and weak passwords, and SentinelLABS says responsibility has not been publicly established. Reuters and Nextgov report that the Pentagon treats freezer failures at US military commissaries as a suspected hack."
