    surface: "section 2026-11-06T03:41:00Z"
    kind: cited
    text: "The restore accepts a backup whose checksum matches, and the checksum is built from the file bytes and a secret that is hard-coded in the product, so an attacker can build a valid archive ("
    urls: ["https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/"]
  - claim_id: 7c60033a7b
