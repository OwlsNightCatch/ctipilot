    kind: cited
    text: "watchTowr Labs published the full chain on 2026-11-05 after comparing firmware 9.4.0.027 with 9.4.0.029 ("
    urls: ["https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/"]
