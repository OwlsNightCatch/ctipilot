    text: "OpenSSH 10.6p2: password bypass on musl Linux without PAM (Alpine, OpenWrt); update or turn passwords off"
  - claim_id: a999d77926
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16, and no source reports attacks."
  - claim_id: 5fd9f58a68
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "actions[0]"
    kind: frontmatter
    text: "On every musl-based Linux host that runs sshd (Alpine, OpenWrt, Buildroot, Yocto), install OpenSSH 10.6p2 or the distribution's fixed openssh package and restart sshd, because updating the package does not replace the running server, and rebuild container and cloud images from a fixed base; until then set PasswordAuthentication no in sshd_config and restart sshd."
  - claim_id: 7a4c7484b0
