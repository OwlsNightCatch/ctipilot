    text: "Qilin's October build spreads through vCenter and ESXi, reboots into Safe Mode and prints notes on office printers"
  - claim_id: 189d8d797d
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "summary"
    kind: frontmatter
    text: "Seqrite compares a March 2026 and an October 2026 Qilin (Agenda) sample and reports that the newer build embeds a PowerShell engine that logs in to vCenter, disables HA and DRS and pushes Linux payloads to ESXi hosts over SSH, shuts down the processes that lock files through the Windows Restart Manager instead of brute-force termination, sets a Safe Mode reboot so EDR drivers do not load, and sends ransom notes to TCP 9100 on local subnets. It is a vendor analysis of two samples with no incident confirmation."
  - claim_id: 957303fe04
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "Seqrite's reverse engineering of a March 2026 and an October 2026 Qilin (Agenda) sample finds that the Rust code was reworked into a modular workspace of 22 internal crates, that the command line grew from 6 to 42 switches, and that the October build carries subsystems the baseline lacked ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: bb38b9f253
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "It uses the Windows Restart Manager API to shut down the processes that lock SQL Server, Exchange and virtual-machine disk files, instead of the brute-force process termination of the March sample, so that the files can be encrypted ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: aa2172fdaa
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "An embedded PowerShell engine, started with `--spread-vcenter`, authenticates to vCenter, disables HA and DRS, extracts the ESXi host addresses, opens SSH and SCP sessions, uploads Linux ransomware payloads to /tmp on the hosts and runs esxcli to power off virtual machines and encrypt .vmdk volumes ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: b002ccd43c
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "The build also installs the RSAT Active Directory module itself with DISM before enumerating computers, embeds 32-bit and 64-bit PsExec to spread over the ADMIN$ and C$ shares with harvested credentials, and sets a Safe Mode boot with bcdedit plus an AutoAdminLogon registry value so that it reboots into Safe Mode, where EDR drivers do not load ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: dba2ac381b
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "A raw-printing module scans local subnets for TCP port 9100 and sends cleartext ransom notes to office printers, and the October binary masquerades as resmon.exe with a forged Microsoft code-signing overlay ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: c17584d673
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "Seqrite lists healthcare, manufacturing, education and technology as the victim sectors in its telemetry ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: 93748f0444
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "**Detection:** in vCenter audit events, HA or DRS being disabled on a cluster followed by SSH sessions to ESXi hosts and esxcli activity; in process-creation and registry telemetry, bcdedit setting a Safe Mode boot and a Winlogon AutoAdminLogon change outside a change window, DISM installing the RSAT Active Directory component on a host that never had it, and rstrtmgr.dll loaded by a process that is not an installer; in network telemetry, one host sending to TCP 9100 on many hosts of a subnet; and an executable named resmon.exe outside System32 ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
