    surface: "section 2026-11-06T03:44:30Z"
    kind: cited
    text: "On the same day CISA, the FBI, HHS, USDA and DOT published a joint fact sheet on malicious cyber activity against industrial refrigeration and cold-chain monitoring systems worldwide: the actors may exploit vulnerabilities or weaknesses in unpatched or internet-accessible controllers to remotely alter settings and force units into continuous heating and defrost cycles, through authentication bypass, arbitrary code injection or weak configurations, with loss of visibility into current temperatures as a further effect ("
    urls: ["https://www.cisa.gov/resources-tools/resources/us-government-partners-urge-hardening-industrial-refrigeration-and-cold-chain-monitoring-systems"]
  - claim_id: 6cb46d1571
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "section 2026-11-06T03:44:30Z"
    kind: cited
    text: "It names no vendor, CVE, victim or actor; its mitigations include keeping controller panels off the internet, allowlisting the devices and IP addresses that may change settings, defining reasonable setpoint limits for downstream devices with alerting on deviations, and collecting network traffic between OT assets where logs are not available ("
    urls: ["https://www.cisa.gov/resources-tools/resources/us-government-partners-urge-hardening-industrial-refrigeration-and-cold-chain-monitoring-systems"]
