    surface: "section 2026-11-06T03:41:00Z"
    kind: cited
    text: "In the login handler a failed password-change attempt returns the login-screen role instead of ending the request, so one unauthenticated POST to /cgi-mod/index.cgi that submits mismatching new and retyped passwords with a backup upload reaches the backup-restore function ("
    urls: ["https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/"]
