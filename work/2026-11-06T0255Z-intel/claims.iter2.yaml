    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "headline"
    kind: frontmatter
    text: "Entra app-credential abuse: agents hunt GitHub for secrets, an operator reaches MSP clients, government among them"
  - claim_id: e5e11f51da
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since August threat actors have used the agentic framework ARTEX to query public GitHub for OAuth application secrets and cloud keys, and that from 2026-10-28 valid application credentials were used for service-principal sign-ins across dozens of applications in several tenants, a vendor-owned multitenant application among them. Todyl's telemetry shows one operator since 2026-11-01 signing in as about 45 application registrations at MSPs and reaching 27 organisations, government clients among them; Microsoft says a similar campaign involving the same addresses was reported by Todyl, while Todyl does not tie its case to ARTEX and cannot say where the secrets came from."
  - claim_id: be30a864a0
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you run or manage for others, list the app registrations that hold client secrets, starting with multitenant, delegated-admin (GDAP) and Partner Center apps, security-tool integration apps and Azure DevOps service connections, and search the service-principal and non-interactive sign-in logs for the invalid-secret or expired-secret errors AADSTS7000215 and AADSTS7000222 followed by a success for the same app; on any hit remove all client secrets, certificates and federated credentials on that app, including ones you did not add, disable its service principal if needed and rotate everything stored in any Key Vault it could read, because issued tokens stay valid until they expire."
  - claim_id: 3caa1bb3ea
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "Microsoft reports that since August 2026 threat actors have used the agentic offensive framework ARTEX to submit large volumes of queries to public GitHub for secrets ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/"]
  - claim_id: 33e927fb63
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "As early as 2026-10-28 it saw successful service-principal sign-ins from two hosting addresses, one a Tor exit node that may carry unrelated activity, across dozens of applications in several tenants, including a vendor-owned multitenant application whose credential was compromised at the source and used to reach multiple downstream tenants ("
