    text: "**Detection:** Barracuda's advisory names no indicators. watchTowr's chain implies, in the interface's web access logs, a POST to /cgi-mod/index.cgi that submits a password change with two different passwords together with a backup file from a session that never logged in, followed by a restored configuration whose timezone value holds shell metacharacters ("
