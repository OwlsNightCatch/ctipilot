    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat HA or DRS being turned off in vCenter, followed by SSH sessions to ESXi hosts, as an incident, and alert on a Safe Mode boot configured by bcdedit outside change windows, which Seqrite names as a detection point ("
    urls: ["https://www.seqrite.com/blog/the-evolution-of-qilin-agenda-a-comparative-reverse-engineering-analysis-of-qilin-agenda-ransomware-across-2026/"]
  - claim_id: 0dbbc4ea58
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: derived
    text: "**Exposure:** Windows estates with a vCenter and ESXi hosts that a domain-joined host can reach over the network and SSH, since the spreading engine needs a vCenter login and SSH to the hosts; Seqrite names no initial-access route."
  - claim_id: 72040d39d2
    entry: 2026-11-06/qilin-october-2026-build-vcenter-esxi-safe-mode-printers
    surface: "body"
    kind: derived
    text: "**Triage:** the Restart Manager and a DISM-installed RSAT component are normal in patching and administration, so each is weak alone; the combination with the print fan-out, the Safe Mode change and the vCenter actions is the signal."
