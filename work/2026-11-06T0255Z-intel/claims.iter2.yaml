    surface: "section 2026-11-06T03:44:30Z"
    kind: cited
    text: "SRF reported on 2026-11-05 the first publicly known attack of this kind in Switzerland: the butcher Lüthis Fleischwaren in Köniz, canton Bern, told customers that manipulation of the electronic control of its cooling and freezer systems caused considerable temperature deviations, the owner told SRF he found 50 to 70 degrees in the freezer, and the firm disconnected the installation from the network and closed the branch (translated from German) ("
    urls: ["https://www.srf.ch/news/schweiz/kuehlanlage-manipuliert-berner-metzgerei-opfer-von-hackerangriff-auch-volg-betroffen"]
