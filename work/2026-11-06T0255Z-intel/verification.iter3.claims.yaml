  - {claim_id: 172fd4491a, verdict: ok, source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", passage: "Exploitation of this path has been observed in the wild.; Patched versions >= 1.11.3"}
  - {claim_id: 211f253865, verdict: ok, source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", passage: "Severity Critical 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; Affected versions <= 1.11.2; published Oct 28, 2026; BSI aggregate_severity kritisch, initial release 2026-11-04T23:00Z"}
