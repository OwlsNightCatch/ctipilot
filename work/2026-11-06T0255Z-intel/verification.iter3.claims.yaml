  - {claim_id: 5099fec044, verdict: ok, source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", passage: "Severity Critical 9.8; Affected versions <= 1.11.2; Patched versions >= 1.11.3; Exploitation of this path has been observed in the wild."}
