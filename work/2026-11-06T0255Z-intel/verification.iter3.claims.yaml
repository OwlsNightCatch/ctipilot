  - {claim_id: e5d5d121ce, verdict: ok, source_url: "https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", passage: "enable-chat=false on every profile that does not need inbound SIP chat; removing every directory user that has no password; Exploitation of this path has been observed in the wild."}
