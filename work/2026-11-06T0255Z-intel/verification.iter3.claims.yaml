  - {claim_id: a9e18a50c9, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "BNSF-40425 (9.4.017+), BNSF-40430 (<9.4.017), BNADC-16586, BNMA-32468, BNWF-60060, BNYF-24789; Campus: Appliances should upgrade to 9.4.0.029 and above; Mandiant: earlier than 9.4.0.030"}
  - {claim_id: 8fbaeee704, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "restore of Spam_Config row system_timezone with shell command; fix_tz.pl executed via sudo as root; no exploitation reported"}
  - {claim_id: 49e83f7d82, verdict: ok, source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0042.md", passage: "versions earlier than 9.4.0.030; CVSS 9.3 (Barracuda, NCSC); Campus: All versions of the Email Security Gateway (ESG)"}
  - {claim_id: 4347cec053, verdict: ok, source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0041.md", passage: "ESG <= 9.4.0.27, ADC <= 6.4.0 ...; Exploitability Medium: The attacker must first authenticate with administrative privileges; Barracuda: Yes (Administrative Access)"}
  - {claim_id: d3cd895672, verdict: ok, source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0042.md", passage: "allows an unauthenticated remote attacker to invoke a configuration-import function and restore a crafted, compatible backup archive"}
  - {claim_id: 82d1e4269f, verdict: ok, source_url: "https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0041.md", passage: "shell metacharacters in the timezone configuration field ... allows an authenticated administrator to inject OS commands that execute with root privileges"}
  - {claim_id: 49dbc971e6, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "page dated 2026-11-05; unauthenticated request ... for our unauthenticated request is the low-privilege login-screen role; restore of system_timezone to root command"}
  - {claim_id: 898fc25aff, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13144", passage: "Current exploitation status: UNKNOWN; created 2026-11-03"}
  - {claim_id: eab24b0205, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "Updated November 5, 2026, at 2:30pm EST: ... Authentication is not required to exploit this vulnerability; however, exploitation requires the administrative user interface (Admin UI) to be accessible"}
  - {claim_id: 0a28c19915, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "If a patch has not been automatically applied, customers should manually apply ... recommends setting devices to automatically receive patches"}
  - {claim_id: 907d4fcc17, verdict: ok, source_url: "https://documentation.campus.barracuda.com/wiki/spaces/BSFv51/pages/963739728", passage: "Go to Advanced > Firmware Update. Check the Current Installed Version."}
  - {claim_id: 4c67a0b24d, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "POST /cgi-mod/index.cgi ... new_password=one&retype_password=two ... pu_bayesian_upload ... system_timezone UTC#';touch /tmp/watchTowr;#"}
  - {claim_id: eaecc31723, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "Barracuda recommends restricting access to administrative interfaces to trusted internal networks"}
  - {claim_id: 3125097427, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13144", passage: "exploitation status UNKNOWN; neither Barracuda, NCSC, Mandiant nor watchTowr reports attacks"}
  - {claim_id: 3a74cd4f0a, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "Vulnerable: Barracuda ESG 9.4.0.027; Different: Barracuda ESG 9.4.0.029"}
  - {claim_id: c6c4711868, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "pre-patch ... return $userrole; ... which for our unauthenticated request is the low-privilege login-screen role; POST /cgi-mod/index.cgi with new_password, retype_password"}
  - {claim_id: 09f018cdc9, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "The checksum is just md5(file_bytes + secret + \".\") ... CHECKSUM_SECRET = b\"Barracuda Networks is your new best friend\""}
  - {claim_id: 7c60033a7b, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "This is not just any old OS Command Injection vulnerability, but one that executes as root."}
  - {claim_id: 0ee074aa79, verdict: ok, source_url: "https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/", passage: "we are sharing our Detection Artefact Generator so you can determine your own susceptibility; no in-the-wild claim anywhere on the page"}
  - {claim_id: c4333323fd, verdict: ok, source_url: "https://github.com/watchtowrlabs/watchTowr-vs-Barracuda-RCE-CVE-2026-116606-CVE-2026-111560", passage: "--target https://barracuda-esg --command 'touch /tmp/test' ... Built backup ... Uploading Backup ... attempts to check if the target is vulnerable; page date 2026-11-03"}
  - {claim_id: 4494e5b202, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "Updated November 5, 2026, at 2:30pm EST ... Authentication Required: No (Administrative UI Access Required)"}
  - {claim_id: 40c7d033c6, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "CVE-2026-111560 ... Authentication Required: Yes (Administrative Access)"}
  - {claim_id: b66b3e3f39, verdict: ok, source_url: "https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection", passage: "record summary matches watchTowr chain plus Barracuda 2026-11-05 field change; no field-change narration left"}
  # Danfoss (updated entry)
