claims:
  # OpenSSH
  - {claim_id: e6911d0ca0, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "NCSC post: musl libc with PAM disabled, Alpine and OpenWrt listed; OpenSSH 10.6p2 critical workaround; headline claims supported"}
  - {claim_id: a999d77926, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "arbitrary password between 257 and 1,024 bytes long; Alpine pushed the fix to every branch back to 3.16; NCSC post created 2026-11-05, exploitation UNKNOWN"}
  - {claim_id: 5fd9f58a68, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Your SSH server runs on musl (Alpine, OpenWrt, Buildroot, Yocto); Updating the package alone doesn't replace the SSH server that's already running; Rebuild your images"}
  - {claim_id: 7a4c7484b0, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "CVSS v3.1 8.1 High; fixed 10.6p2; Alpine table edge 10.6_p2-r0 ... 3.16 9.0_p1-r6; at least one other account on the box has a real password"}
  - {claim_id: 6350735ebf, verdict: ok, source_url: "https://www.openssh.org/txt/release-10.6p2", passage: "Portable OpenSSH 10.6p2 was released on 2026-11-05. ... This release contains a critical security workaround that affects Linux systems that use the musl libc and PAM disabled."}
  - {claim_id: c53758becf, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Successful exploitation allows remote, unauthenticated attackers to bypass SSH password authentication over the network ... Current exploitation status: UNKNOWN"}
  - {claim_id: e0841f8538, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "crypt() refuses inputs longer than 256 bytes ... musl returns the string * ... In 2016, OpenSSH ... could perform a password-hashing operation using settings obtained from another account"}
  - {claim_id: b0e1fa8ce4, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "key-only users, LDAP users, root on Alpine; Accounts whose password field contains ! rather than *; Dropbear and OpenBSD; 8.1 High"}
  - {claim_id: 0880960c27, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "that passwordless account is the default alpine user, and it can run doas ... without a password ... can effectively obtain root privileges"}
  - {claim_id: c2f6b1d81d, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "The OpenSSH developers believe the problem does not originate in OpenSSH itself."}
  - {claim_id: 66c2c67d44, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "so other software using similar authentication paths may also be affected"}
  - {claim_id: 69b142ed5e, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Alpine pushed the fix to every branch back to 3.16 ... edge 10.6_p2-r0 3.24 10.3_p1-r2 ... 3.16 9.0_p1-r6"}
  - {claim_id: 9343ac1307, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "other distributions and many OpenSSH download servers are still offering the previous version, 10.6p1"}
  - {claim_id: dd7816a7a9, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Alpine Linux, KISS Linux, Sabotage Linux, OpenWrt, Morpheus Linux, Other musl-based ...; sshd built and run with PAM support disabled; PasswordAuthentication enabled"}
  - {claim_id: 427539eb08, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "There's an account with no password set (shown as *)"}
  - {claim_id: dba341d66b, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Containers that do not run an OpenSSH server."}
  - {claim_id: 3c12b86ed7, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Search /var/log/messages for Accepted password for on an account that has no password (alpine, root, key-only users). If you find one, treat the machine as compromised."}
  - {claim_id: 11e6b01161, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Update OpenSSH and restart it ... Updating the package alone doesn't replace the SSH server that's already running. Rebuild your images ... from a fixed base"}
  - {claim_id: 48344d9acd, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Temporary: Set PasswordAuthentication no in sshd_config and restart sshd immediately"}
  - {claim_id: d48fc6ac46, verdict: ok, source_url: null, passage: "derived: OX's Accepted password for log line is the generic sshd event; entry marks it as implication and says no source publishes an indicator beyond OX's check"}
  - {claim_id: ce495186ab, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "derived triage follows from OX: an account with * holds no valid password hash, bypass is the only route"}
  - {claim_id: 3357bb1e34, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "derived retrospective review follows OX's check-if-someone-already-got-in step"}
  # Barracuda
