# Findings summary (machine-readable)
- code: F3
  category: claim-not-supported
  section: incidents
  item: "Adform: the shared tracking script every customer site embeds was trojanised with a clipboard-rewriting crypto-clipper"
  url_or_quote: "Adform, an advertising-technology platform headquartered in Copenhagen, has confirmed that attackers modified `trackpoint-async.js`, the shared JavaScript tracking library it serves from `s2.adform.net`"
  summary: >-
    The cited Adform notice (https://site.adform.com/resources/newsroom/security-incident-company-update/, fetched
    in full this iteration) never names trackpoint-async.js, never names s2.adform.net, and never says the code was
    "appended"; it says only that "malicious code" was detected on 27 July and describes its behaviour. The file,
    the host and the append-to-end-of-library detail come from BleepingComputer (attributed there to Kevin Beaumont)
    and The Hacker News ("The compromised resource is trackpoint-async.js, served from s2.adform[.]net"). The
    frontmatter summary carries the same over-extension ("Adform ... confirmed that malicious code was appended to
    trackpoint-async.js — the tracking library it serves from s2.adform.net and that customer sites embed across
    entire websites"; Adform's documentation per THN says the tag *can* be deployed across an entire website).
    Fix: attribute the asset identification to the researcher/press, keep "confirmed" for what Adform actually said.
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "CVE-2026-66066 (Rails Active Storage) — withheld attack chain public four weeks early"
  url_or_quote: "plus two scripts, one that works out whether an application was ever vulnerable and over what period, and one that searches Active Storage data for the crafted files"
  summary: >-
    The cited thread (https://discuss.rubyonrails.org/t/cve-2026-66066-attack-details-and-tools-to-perform-a-forensic-investigation/91441,
    read via the Discourse topic JSON this iteration) calls both artifacts "agent skill", not scripts: "The
    kr2s-was-i-vulnerable agent skill works out whether your application was ever vulnerable, and if it was, over
    what period of time. The kr2s-was-i-exploited agent skill searches your Active Storage data for the crafted
    files, and works out what was read if it finds any." Calling them scripts misdescribes what a responder is being
    told to run (agent skills require an AI coding agent), and the actions[] item inherits it ("Run the published
    kr2s-was-i-vulnerable and kr2s-was-i-exploited checks"). The entry also never names the repository the source
    identifies — rails/rails-forensics-CVE-2026-66066 — which is what makes the action self-contained.
- code: F4
  category: hallucinated-fact
  section: incidents
  item: "CCI Nice Côte d'Azur: compromised administrator account used to run the platform's own export function"
  url_or_quote: "A French public-law chamber of commerce confirms bulk candidate-data exports from a hijacked admin account, with no vulnerability involved"
  summary: >-
    The headline asserts "with no vulnerability involved" and the body repeats it as fact ("no software flaw was
    exploited and no tooling was deployed"). Neither cited source establishes this. Cyberattaque.org states the
    opposite gap: "La méthode ayant permis de prendre le contrôle du compte n'est pas précisée" — and lists session
    hijacking among the candidate vectors, which can itself be a software flaw. The claim also contradicts the
    entry's own (correct) paragraph "How the account was taken over is explicitly not stated." Supported version:
    the *post-authentication* activity used the platform's legitimate export functions; the takeover vector is
    undisclosed.
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "CVE-2026-66066 (Rails Active Storage) — withheld attack chain public four weeks early"
  url_or_quote: "Any Rails application still on an unpatched activestorage that accepted image uploads is now exposed to a fully public chain"
  summary: >-
    The frontmatter summary drops the precondition the cited GHSA states and that this entry's own predecessor
    carried. GHSA-xr9x-r78c-5hrm (fetched this iteration): an application is affected if it "Uses libvips for Active
    Storage image processing ... config.active_storage.variant_processor = :vips" AND "Allows image uploads from
    untrusted users". Applications configured for the ImageMagick processor are outside the vector entirely. As
    written the summary (and the body's "an application that was internet-reachable and accepting image uploads
    during its vulnerable window is a key-rotation candidate") sends ImageMagick-configured shops into an
    unnecessary secret_key_base rotation. Fix: restore the libvips/variant-processor qualifier.
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "COLDCARD: preprocessor guard routed key generation to a software PRNG"
  url_or_quote: "techniques: [T1552.004, T1657]"
  summary: >-
    T1552.004 (Unsecured Credentials: Private Keys) names a behaviour the body does not describe and no cited source
    supports: the technique covers an adversary searching a compromised system for insecurely stored private-key
    material. The described attack involves no host access at all — Block Engineering (cited) describes offline
    reproduction of a deterministic Yasmarang stream validated against public chain data ("An attacker who can
    determine or sufficiently constrain the device UID, timer state and RNG-call history can reproduce the fallback
    stream offline. A wallet xpub, address or generated public key provides a candidate-validation oracle").
    T1110 (Brute Force) is the behaviour the body actually describes; T1657 is correct and can stand alone.
- code: F14
  category: quantifier-without-source
  section: trending-vulnerabilities
  item: "COLDCARD: preprocessor guard routed key generation to a software PRNG"
  url_or_quote: "it is the largest disclosed hardware-random-number-generator compromise on record"
  summary: >-
    Absolute superlative with no citation, and none of the three cited sources supports it. Coinkite's backgrounder
    (read in full) makes no comparative claim; Block Engineering's advisory makes none; CryptoTimes reports only
    "1,367.05 BTC ($88.6M) across 4,585 addresses" and a third wave. A keyword sweep of the fetched source text for
    "largest"/"biggest"/"unprecedented" returns only unrelated glossary and wallet-size hits. This matters beyond
    style: the superlative is one of the two legs the entry (and the run record's borderline-include argument)
    rests on to justify an out-of-nexus item. Either source it or re-ground the inclusion on the confirmed
    active-exploitation scale and the transferable firmware-assurance lesson.
- code: F11
  category: editorial-advisory
  section: incidents
  item: "Adform — actions[]"
  url_or_quote: "for any that carried it between 2026-07-26 and 2026-07-27 decide whether visitor notification is warranted"
  summary: >-
    The action's scoping window silently adopts the evidence-anchored range while the entry's body says defenders
    "should not resolve them in Adform's favour by default" and the run record says "a defender sizing exposure
    should assume the longer window until the company reconciles the two." A team working the aggregated Action
    Items list without the body will under-scope. Consider widening to the researcher's ~1-week window with the
    archived 2026-07-26 sample as the hard floor.
