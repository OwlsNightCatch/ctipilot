    extended_notes: |
      ATT&CK mapping is a loose fit: T1552.004 (Unsecured Credentials: Private Keys) is the closest active
      technique for "adversary obtains a private key it should not be able to obtain," but the actual mechanism
      here is prediction/offline reconstruction of a key from a weakened RNG, not discovery of an insecurely
      stored key file — flag this approximation if carried into an entry. The hardening lesson that generalises
      beyond crypto wallets: a preprocessor `#ifdef`/`#ifndef` guard that tests only whether a security-relevant
      macro is *defined* rather than what it is *set to* is a classic embedded-firmware anti-pattern; any team
      auditing firmware that gates a hardware TRNG / secure-element path behind a build-time macro should treat
      "is the macro's value checked, not just its presence" as a concrete code-review item. This is also another
      data point (following the week's "AI as tradecraft accelerant" thread already in the brief) for a vendor's
      own working assumption that AI-assisted code review found a five-year-old latent defect at attacker speed.
    borderline: true
