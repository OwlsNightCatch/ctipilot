    summary: |
      A March 2021 firmware commit (b18723dd) silently downgraded seed generation on Coinkite's COLDCARD
      hardware Bitcoin wallets from the STM32 hardware TRNG to a deterministic software PRNG fallback, and
      the bug went undetected for five years. Root cause per Block Engineering's independent reverse-engineering
      and Coinkite's own advisory: a preprocessor guard (`#ifndef MICROPY_HW_ENABLE_RNG`) checked only whether
      the macro was *defined*, not whether it was *enabled* (the board config set it to 0) — so the linker bound
      seed generation to MicroPython's Yasmarang software PRNG instead of the hardware RNG path. On Mk2/Mk3
      firmware 4.0.0-4.1.9, that PRNG is seeded solely from the device UID XORed with the SysTick timer value
      plus RTC time/subsecond counters — for a known UID and constrained boot-timer state, wallet-seed generation
      becomes fully deterministic and reproducible offline (Coinkite estimates ~40 bits of effective search space
      against the 128/256 bits a BIP-39 seed needs). Mk4/Mk5/Q devices added secure-element reseeding, but Block
      found the reseed is limited to a 32-bit value, so even the "fixed" architecture left a ~2^32-trial offline
      search space. An attacker (unattributed) has been draining affected wallets since 2026-07-30 in successive
      waves: wave 1 took 1,196 addresses (1,082.65 BTC, ~$70.2M) in a 41-minute sweep; by 2026-08-02 Galaxy
      Research had tracked a third wave, bringing the cumulative total to 1,367.05 BTC (~$88.6M) across 4,585
      addresses, with wave 3 showing distinct address/output patterns (individual per-victim destinations,
      P2WSH instead of P2WPKH, batched victims) that Galaxy flags as possibly a second actor exploiting the same
      flaw. All stolen funds remain unspent. Coinkite shipped emergency firmware (Mk2/Mk3: 4.2.0; Mk4/Mk5: 5.6.0;
      Q: 1.5.0Q; Edge builds: 6.6.0X/6.6.0QX) on 2026-07-30/31 and an updated advisory on 2026-08-01, but is
      explicit that reflashing does not repair an already-generated seed — affected users must generate an
      entirely new seed on patched firmware and migrate funds; only seeds originally generated from ≥50
      independent private dice rolls, or protected by a strong unique BIP-39 passphrase, are not considered at
      risk from this flaw alone. Coinkite's own advisory speculates the bug was found by an adversary using AI
      to review historical firmware: "We have to assume that someone used AI to review previous versions of our
      firmware and stumbled upon this issue."
