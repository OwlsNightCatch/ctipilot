    evidence:
      - quote: "On 27 July 2026, Adform detected suspicious activity and immediately launched an investigation under its incident-response procedures."
        attribution: "Adform (official incident statement)"
        source_url: "https://site.adform.com/resources/newsroom/security-incident-company-update/"
      - quote: "The malicious code was designed to interfere with certain cryptocurrency transactions involving Bitcoin, Ethereum, or Tron by attempting to replace a cryptocurrency wallet address."
        attribution: "Adform (official incident statement)"
        source_url: "https://site.adform.com/resources/newsroom/security-incident-company-update/"
      - quote: "This allows end-user devices of downstream websites to be compromised with crypto-stealing malware. Meaning if you visit example.com and they use Adform, example.com will compromise your device."
        attribution: "Kevin Beaumont, via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/online-ad-firm-adforms-script-compromised-to-steal-cryptocurrency/"
    extended_notes: |
      Detection concept (telemetry class first): web-application/CSP-violation-report telemetry is the right vantage — organizations that set a restrictive Content-Security-Policy (connect-src/script-src allowlists) on sites embedding third-party ad/tag scripts would have generated CSP violation reports the moment the injected payload attempted its outbound beacon to non-allowlisted infrastructure; without CSP, the only vantage is client-side/browser telemetry (EDR-for-browser, DLP clipboard-monitoring agents) or network egress logs on managed endpoints showing unexpected outbound connections initiated from browser processes while a specific ad-serving domain's script is loaded. Benign-lookalike / triage discriminator: legitimate ad-tech tracking pixels routinely make outbound XHR/beacon calls to their own domains for analytics — the discriminating features here are (a) a tag script mutating clipboard contents or DOM input values, which no legitimate tracking pixel needs to do, and (b) egress to infrastructure outside the vendor's documented/published endpoint list. Hardening: Subresource Integrity (SRI) hashes on statically-versioned third-party scripts would have broken silently the moment the library was modified server-side (assuming the vendor supports a pinned, hashable asset — worth confirming with any ad-tech/analytics supplier); a restrictive CSP connect-src reduces the blast radius even when SRI isn't available; for any organization processing cryptocurrency payments, validate wallet addresses via an out-of-band channel (QR code, re-confirmation screen) rather than trusting a clipboard-pasted value, since this incident demonstrates persistent re-substitution defeats simple re-copy-and-check user behavior. Note for the composer: the malicious C2 IP address and specific payload sample details are IOC-class facts — the summary and evidence above describe them behaviorally rather than by literal indicator; do not add the raw IP/domain to the published entry per the no-IOCs rule.

  - title: "CCI Nice Côte d'Azur (French public Chamber of Commerce) confirms admin-account compromise on its candidate-management platform exposed jobseeker and company data"
    sources:
      - { url: "https://www.cyberattaque.org/cci-nice-cote-dazur-un-compte-administrateur-pirate-les-donnees-rh-de-candidats-exportees/", publisher: "Cyberattaque.org (French breach-notification tracker)", date: "2026-08-01", role: "primary" }
