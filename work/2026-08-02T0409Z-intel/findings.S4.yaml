items:
  - title: "Adform ad-tech supply-chain compromise plants a clipboard-hijacking crypto-clipper in a JS tag served to ~1,800 advertiser sites"
    sources:
      - { url: "https://site.adform.com/resources/newsroom/security-incident-company-update/", publisher: "Adform (official incident statement)", date: "2026-07-27", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/hackers-poison-adform-script-to-swap.html", publisher: "The Hacker News", date: "2026-08-01", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/online-ad-firm-adforms-script-compromised-to-steal-cryptocurrency/", publisher: "BleepingComputer", date: "2026-07-31", role: "corroborating" }
      - { url: "https://doublepulsar.com/adform-compromised-to-serve-crypto-stealer-via-supply-chain-attack-2f1ec024f33e", publisher: "DoublePulsar (Kevin Beaumont)", date: "2026-07-31", role: "corroborating" }
    discovery_trace: "first seen at: hackernews (aggregator source-id in S4 slice), URL https://feeds.feedburner.com/TheHackersNews (feed item, then drilled) https://thehackernews.com/2026/08/hackers-poison-adform-script-to-swap.html → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/online-ad-firm-adforms-script-compromised-to-steal-cryptocurrency/ → pivot: DoublePulsar (Kevin Beaumont, discovering researcher), URL https://doublepulsar.com/adform-compromised-to-serve-crypto-stealer-via-supply-chain-attack-2f1ec024f33e (Medium paywall blocked full body; title/teaser confirmed via bridge fetch, full quotes recovered via BleepingComputer's citation of the same researcher) → primary: Adform's own incident statement, URL https://site.adform.com/resources/newsroom/security-incident-company-update/"
    summary: |
      Adform, a Copenhagen-headquartered ad-tech platform (DSP/SSP/ad-server stack) used by roughly 1,800 advertiser customers serving ~1.5 billion ads/day across 180+ countries, confirmed that its shared JavaScript tracking library trackpoint-async.js, served from s2.adform.net and embedded unconditionally on every customer website using the platform, was trojanized to steal cryptocurrency. Independent researcher Kevin Beaumont found an obfuscated payload appended to the legitimate library that continuously monitors the browser clipboard and hooks input/textarea/contenteditable value setters, detects Bitcoin, Ethereum and TRON wallet-address patterns, and silently substitutes an attacker-controlled address — including re-substituting after the victim notices and re-copies the correct address — and separately rewrites wallet addresses displayed on the page itself. A related malicious script exfiltrated the visiting page's hostname, path and the visitor's IP to an external attacker-controlled server. The sample was not flagged by any VirusTotal AV engine. Adform states the code required no installation and established no persistence, running only while the affected tab remained open; it detected the activity on 27 July 2026, removed the code, and continues investigating, while Beaumont assessed the malicious activity had been live for roughly a week beforehand undetected. No attacker attribution, victim count, or IOC list has been published by Adform.
    region_nexus: "Denmark/EU home-region ad-tech vendor whose compromised script propagated to any of its ~1,800 customer sites across 180+ countries, including EU/Swiss organizations that embed Adform tags"
    primary_sector_nexus: "indirect — supply-chain/third-party-script exposure relevant to any public-sector or CI website embedding third-party ad-tech/analytics tags"
    sector: "telco, finance (crypto payments), public-sector (any org embedding third-party ad/analytics scripts)"
