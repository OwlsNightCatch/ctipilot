    discovery_trace: "first seen at: WebSearch (\"cyberattaque piratage données août 2026 Suisse France\") → pivot: cyberattaque.org listing, URL https://www.cyberattaque.org/ → primary/entry article: https://www.cyberattaque.org/cci-nice-cote-dazur-un-compte-administrateur-pirate-les-donnees-rh-de-candidats-exportees/ → corroborating: frenchbreaches.com, URL https://frenchbreaches.com/alertes/chambre-de-commerce-et-d-industrie-nice-c-te-d-azur-ms9972qijqoesdq8cu — both quote what appears to be the same underlying organizational breach-notification text verbatim, so independence of the two write-ups is uncertain even though they are separately operated trackers; no mainstream-press pickup found."
    summary: |
      CCI Nice Côte d'Azur — the Chamber of Commerce and Industry for the Alpes-Maritimes region, a French public-law establishment supporting local businesses — confirmed that an unauthorized party accessed an administrator account on its eDRH candidate/company-relationship-management platform and used legitimate export functions to pull data on registered jobseekers and enrolled companies. The incident occurred on 2026-07-18 and was disclosed around 2026-07-31/08-01. Exposed fields include full name, email, phone number, date of birth, professional experience, education level, profile headline, contact preferences, and account-creation/last-login timestamps — enough to reconstruct a detailed employment-seeking profile usable for targeted recruiter/CCI-advisor impersonation. The organization states it terminated the unauthorized access and secured the platform with its service provider; it has not disclosed the specific compromise vector (credential theft, phishing, or session hijack all remain possible) or the number of affected records.
    region_nexus: "France (EU home-region), public-law chamber-of-commerce institution"
    primary_sector_nexus: "direct — French public-sector-adjacent institution (government-affiliated public establishment)"
