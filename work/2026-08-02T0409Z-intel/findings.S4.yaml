    extended_notes: |
      Technical depth is thin because the organization has not disclosed the access vector — flagged explicitly rather than invented. Transferable lesson: a single compromised admin account on a third-party-run HR/CRM SaaS platform was sufficient for bulk legitimate-looking data exports with no exploit needed (T1078 Valid Accounts + T1213 Data from Information Repositories) — detection concept is anomalous admin-account authentication (impossible-travel/off-hours) and bulk-export-volume alerting on CRM/HR SaaS platforms used by any public body, not a technical control that was defeated.
