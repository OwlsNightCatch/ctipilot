    summary: |
      Material update to the 2026-07-31 entry on CVE-2026-66066 ("KindaRails2Shell"), the critical (CVSS 4.0: 9.5) Active Storage flaw where an unauthenticated attacker who can upload an image to any Rails application reaches arbitrary file read via libvips' "unfuzzed" image-format loaders — enough to steal secret_key_base and decrypted Rails credentials, and from there forge session cookies / signed GlobalIDs for a path to RCE. The Rails security team had originally withheld the full attack-chain writeup until 2026-08-28 to give operators a patch window; that embargo broke after roughly 48 hours because, per the Rails team's own statement, "several researchers quickly reverse-engineered the attack and have already published proofs-of-concept." In response the team published the rails/rails-forensics-CVE-2026-66066 GitHub repository containing a step-by-step attack writeup (reference/the-attack.md), a forensic-evidence-analysis guide (reference/the-investigation.md), and two "agent skill" scripts (kr2s-was-i-vulnerable, kr2s-was-i-exploited) for automated exposure/compromise triage of Active Storage deployments. Vulnerable/fixed: activestorage before 7.2.3.2 / 8.0.x before 8.0.5.1 / 8.1.x before 8.1.3.1, and the fix additionally requires libvips >= 8.13 / ruby-vips >= 2.2.1 — a patched gem paired with an older libvips will refuse to boot rather than silently stay exposed. Rails 6.x is affected only where Active Storage is configured outside framework defaults. No source in this update claims confirmed in-the-wild exploitation yet, but with a complete public attack chain and companion forensic tooling now available two-plus weeks ahead of the original disclosure date, any organisation running unpatched Active Storage with libvips-based variant processing should treat this as an active, not scheduled, remediation item and run the published "was-i-exploited" check against existing deployments.
