      - quote: "With the secret_key_base compromised, the attacker holds the master cryptographic key to the application. They can forge session cookies, sign global IDs, and manipulate serialized data, which directly translates into full RCE on the underlying server."
        attribution: "Akamai Security Research"
        source_url: "https://www.akamai.com/blog/security-research/rails-active-storage-rce-cve-2026-66066"
    extended_notes: |
      Detection/hunt angle for the composer: the released kr2s-was-i-exploited tooling inspects Active Storage's blob/variant records and server file-access logs for the anomalous file-read pattern the exploit produces (image uploads that never legitimately resolve to a variant, followed by reads of files outside the expected storage root — e.g. config/master.key, config/credentials.yml.enc, /proc/self environ). This is a strong triage discriminator: legitimate Active Storage variant processing never reads paths outside its configured storage service root. Hardening beyond the version bump: pin libvips >= 8.13 explicitly in the OS/container image (Debian/Ubuntu LTS repos may still ship older libvips — the BleepingComputer piece calls this out), and rotate secret_key_base plus all credentials.yml.enc-derived secrets for any application that could have been exposed before patching, since the original patch alone does not invalidate a previously-stolen key.
