      Defender-relevant angle beyond the legal deadline: any Swiss federal/cantonal agency running a citizen-facing chatbot/virtual assistant (a growing e-government pattern per this week's regional coverage) should confirm the AI-disclosure banner fires at first contact, not buried in T&Cs; any public body producing or receiving AI-generated imagery/video for public communications should track the machine-readable-marking requirement and its cited bypass weaknesses (SynthID reverse-engineering, sub-$50 watermark defeats) as a residual risk even after "compliant" marking is applied — i.e. do not treat a machine-readable watermark as a forensic detection guarantee.
