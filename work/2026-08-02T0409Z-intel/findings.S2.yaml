    discovery_trace: "first seen at: WebSearch (\"GDPR fine data protection authority August 2026\") surfaced the 2 August 2026 AI Act enforcement milestone → pivot: WebSearch (\"EU AI Act August 2 2026 high-risk obligations Annex III apply\"), URL https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/ → pivot: WebSearch (\"AI Act Digital Omnibus what still applies 2 August 2026 transparency obligations Article 50\") → CSA research note, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-eu-ai-act-article-50-transparency-20260729/ and aiactblog.nl, URL https://www.aiactblog.nl/en/posts/article-50-transparency-deadline-2-august-2026 → primary: European Commission press release, URL https://digital-strategy.ec.europa.eu/en/news/commission-starts-enforcing-ai-act-rules-and-new-transparency-requirements-2-august, cross-checked against the Commission's own AI Act policy page, URL https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
    summary: |
      From 2 August 2026 — the date this run fires — the European Commission's AI Office and national market-surveillance authorities begin enforcing Article 50 of Regulation (EU) 2024/1689 (the AI Act): transparency duties that apply regardless of an AI system's risk classification and were explicitly left untouched by the Digital Omnibus reform (Regulation (EU) 2026/1744, in force 27 July 2026) that pushed the Annex III high-risk-system compliance deadline from 2 August 2026 to 2 December 2027 (and Annex I embedded-product high-risk obligations to 2 August 2028). Four distinct duties now apply: providers of chatbots/conversational and interactive AI systems must disclose to users that they are interacting with AI at the moment of first contact (Art. 50(1)); providers of generative AI (text/image/audio/video) must mark synthetic output in a machine-readable, AI-detectable format (Art. 50(2), with a four-month grace period to 2 December 2026 for systems already on the market before 2 August 2026); deployers operating emotion-recognition or biometric-categorisation systems must inform exposed individuals and comply with data-protection law (Art. 50(3)); and deployers publishing deepfakes or AI-generated/manipulated public-interest text must disclose the artificial origin unless the content is evidently artistic/satirical or has been meaningfully human-reviewed with assigned editorial responsibility (Art. 50(4)). Non-compliance carries fines of up to EUR 15 million or 3% of worldwide annual turnover, whichever is higher, with the burden of proving timely disclosure resting on the organisation, not the regulator. Law-enforcement carve-outs exist for criminal detection/prevention/investigation use (with conditions). Independent watermark-robustness research cited alongside the Commission announcement documents that several "detection" marking schemes are already defeatable (a public tool reverse-engineering Google's SynthID reports it can defeat SynthID's own detector; other bypass techniques were demonstrated for under USD 50 in query cost), which is the operational gap defenders and compliance teams should track separately from the legal deadline itself.
