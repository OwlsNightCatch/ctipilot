    discovery_trace: "first seen at: WebSearch (\"Berlin Landesnetz Cyberangriff BSI Vorfall August 2026\") → pivot: blogspan.net, URL https://www.blogspan.net/berlin-landesnetz-angriff-nicht-migrierte-it/ (names the non-migrated legacy-IT entry point) → pivot: WebSearch (\"Berlin Senatsverwaltung Cyberangriff Landesnetz Schwachstelle\") surfaced the Reuters-sourced PDF claim → primary: WirtschaftsWoche, URL https://www.wiwo.de/politik/deutschland/ausmass-noch-unbekannt-hackerangriff-auf-berliner-landesnetz/100247824.html (verbatim Reuters quote naming the phishing-PDF vector) → corroboration: heise online, URL https://www.heise.de/news/Cyberattacke-auf-Berliner-Verwaltung-Ermittlungen-laufen-11416539.html → corroboration: Senatskanzlei Berlin official statement, URL https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html"
    summary: |
      This pipeline verified but could not previously publish the 14 August 2026 compromise of Berlin's shared state administrative network (Landesnetz) because no source named a surface, product, CVE or attacker behaviour. Two in-window developments change that. First, WirtschaftsWoche and heise online, both citing Reuters reporting from unnamed "security circles" (Sicherheitskreise), report that "more than a week" before the 14 August isolation, a successful cyberattack against the affected Senate departments ran through a PDF file carrying malware that an employee opened in an email — T1566.001 Spearphishing Attachment followed by T1204.002 User Execution: Malicious File. This claim is not confirmed by the Senate Chancellery, which has repeatedly declined to give "concrete information on scope and background" for investigative-tactical reasons; treat it as SINGLE-SOURCE-OTHER (Reuters, wire-distributed, unconfirmed officially). Second, and independently, blogspan.net reports the entry point was IT infrastructure at the Senate Department for Urban Development, Building and Housing that was never migrated to Berlin's centralized IT service center (ITDZ) under the six-year OneIT@Berlin consolidation program (started 2018, missed its 2024 target of moving ~8,000 workstations) — i.e. a shadow-IT segment outside the hardening and monitoring baseline the rest of the state network runs under. The two Senate departments (Urban Development/Building/Housing; Mobility/Transport/Environment/Climate Protection) remain isolated from the Landesnetz, with no internet, no external email and no home-office access, and housing-benefit (Wohngeld) payments to over 50,000 households are disrupted. On data loss there is now an open contradiction between sources: the Senate Chancellery states "no sensitive data has flowed out according to current knowledge," attributing the confirmed exfiltration solely to Geoinformationsdaten already available through a public open-data database, while The Berliner and other outlets report government circles/rbb describing leaked data as "in some cases highly sensitive" — unresolved as of the newest official statement (19 August). LKA (state police), the Berlin public prosecutor and BSI are all engaged; no named threat actor, malware family or CVE has been published by any source as of this run.
    region_nexus: "Germany — federal-state (Land) government network; direct peer-government relevance for a Swiss federal/cantonal SOC (shared-network segmentation, non-centrally-managed legacy IT, and phishing-based initial access into a whole-of-government network)"
