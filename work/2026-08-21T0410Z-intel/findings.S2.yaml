    discovery_trace: "first seen at: WebSearch (\"Europe public sector cyberattack government breach August 20 2026\") → primary: OCCRP, URL https://www.occrp.org/en/news/french-authorities-investigate-widespread-government-data-breaches → pivot: WebSearch (\"ZeroBytes education nationale piratage\") → primary: franceinfo, URL https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/zerobytes-a-l-origine-du-vol-de-donnees-du-fisc-revendique-un-piratage-de-donnees-visant-l-education-nationale-fin-juillet_8152235.html (fetched directly via browser-UA bridge, verbatim ministry quotes) → primary: DGCCRF official press release, URL https://presse.economie.gouv.fr/la-dgccrf-met-en-garde-les-consommateurs-a-la-suite-dune-fuite-de-donnees-sur-bloctel/"
    summary: |
      This pipeline covered France's DGFiP tax-authority intrusion on 2026-08-15 (678,000 taxpayer/business records, actor self-identified as ZeroBytes, entity actor:zerobytes / incident:france-dgfip-tax-breach-2026-08). Two in-window developments extend that same actor's confirmed footprint across French government systems. First, ZeroBytes publicly claimed on X on 18 August 2026 to have "absorbed 346 million raw lines" from the Ministry of National Education "a few weeks" earlier, asserting it remained undetected-but-uncut-off inside the ministry's systems; the ministry's own office, contacted directly by franceinfo, confirmed this is the same intrusion it disclosed on 31 July 2026 as a "fraudulent intrusion into one of its information systems." The ministry's 31 July disclosure — quoted verbatim by franceinfo — specifies the exposed data as identity and professional information (status, function) for agents who worked in an académie since 2001, with postal address, phone number and French social-security number (numéro de sécurité sociale) added for a subset; the ministry states this system holds no banking data, no passwords and no student data, but is still investigating ZeroBytes' separate claim (made the day before this article) to also hold student records. The ministry filed a criminal complaint with the Paris prosecutor and notified ANSSI and the CNIL; a judicial investigation continues and all potentially affected personnel have been individually notified. Second, OCCRP's 20 August roundup reports that a compromised professional account exposed roughly 3 million phone numbers (600,000 registered specifically on the Bloctel do-not-call registry) just before Bloctel's scheduled 11 August shutdown — DGCCRF disclosed that breach on 12 August without naming an actor, but OCCRP states media reporting (RTL) now attributes it to the same ZeroBytes actor, and that France's national police anti-cybercrime unit is running a unified investigation across the DGFiP, education-ministry and Bloctel intrusions. Access mechanism across the cluster is consistently credential/account abuse rather than a named CVE: DGFiP was reached via impersonated agent and third-party credentials, and Bloctel via "un accès frauduleux à un compte professionnel" (fraudulent access to a professional account) — T1078 Valid Accounts in both cases; no vulnerability, exploit or malware family has been named for any of the three intrusions.
