    extended_notes: |
      Defender takeaway: this is a live case study in the exact failure class this constituency's federal-ISMS deadline (1 Jan 2027) targets — a whole-of-government network compromised via the one department's IT segment that sat outside the central IT service provider's hardening/monitoring baseline. Hunt angle: shared administrative WAN/VLAN segmentation should be tested against the assumption that every connected department is equally hardened; an incident-response takeaway is that isolating only the two departments known to be affected assumes the shared network's blast radius is already fully scoped, which the still-open sensitive-data-loss contradiction between the Senate Chancellery and rbb's government-circles sourcing suggests is not yet settled. No IOC, malware family, or CVE has been published; do not over-read the "PDF with malware" claim as confirming a specific exploit class (macro, embedded object, reader-CVE) — the sources describe only the delivery mechanism (T1566.001) and user execution (T1204.002), not the payload mechanics.
