  item: "trueconf-server-kev-head-mare-trojanized-client-installers"
  url_or_quote: "That script lands in a sandbox \"where potentially hazardous libraries (io, os, etc.) are unavailable\" — and CVE-2026-72530 is the way out of it, letting the attacker \"break out of the isolated environment and execute arbitrary code on the host system\" ([Kaspersky ICS-CERT KLCERT-26-058, 2026-08-11](https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/))"
  summary: "Adjacency defect. The trailing citation is KLCERT-26-058, which I fetched in full (3,746 chars of text, complete advisory) — it contains the second quoted span verbatim but NOT the phrase 'where potentially hazardous libraries (io, os, etc.) are unavailable'. That phrase is a verbatim substring of the OTHER co-cited Kaspersky page (the 2026-08-12 report, https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/), which reads '...hazardous libraries (io, os, etc.) are unavailable. However, attackers can exploit another vulnerability...'. Attach the sandbox quote to the report citation."
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "atutor-13-cves-eol-no-fix-unauthenticated-admin-takeover"
  url_or_quote: "cves[] record: {id: CVE-2026-64969, type: info-disclosure} / body: 'an insecure direct object reference letting any authenticated user — a student included — supply another user's member identifier against the profile-picture endpoints (CVE-2026-64969)'"
  summary: "Frontmatter contradicts the cited advisory. CERT Polska (https://cert.pl/en/posts/2026/08/CVE-2026-64960/, fetched this pass) states for CVE-2026-64969: 'Any authenticated user, including a student, can supply another user's member_id in a POST request to the profile album endpoint and permanently delete that user's profile picture, including those of instructors and administrators.' Nothing is disclosed — the impact is unauthorized DESTRUCTION, and the advisory's own CWE is CWE-639 (Authorization bypass through User-Controlled key). `type: info-disclosure` is wrong (taxonomy `auth-bypass` or `logic-flaw` fits), and the body sentence stops before naming the impact, so a reader learns that a student can pass someone else's id but not that doing so permanently deletes an administrator's profile picture."
