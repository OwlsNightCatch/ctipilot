  item: "atutor-13-cves-eol-no-fix-unauthenticated-admin-takeover"
  url_or_quote: "reflected XSS in the restore functionality (CVE-2026-64971) and via a preview parameter (CVE-2026-64972)"
  summary: "The cited advisory says: 'CVE-2026-64972: ATutor is vulnerable to Reflected XSS via popup parameter in preview.php. An authenticated attacker can inject a double quote into the popup parameter...'. The injectable parameter is `popup`; `preview.php` is the script. 'via a preview parameter' names the wrong parameter and is not supported by the cited page."
- code: F5
  category: missing-citation
  section: active-threats
  item: "arrayref-crates-io-build-script-supply-chain-proc-macro1"
  url_or_quote: "Only arrayref carries a CVE — CVE-2026-77651 at CVSS 9.8, scoped in ENISA's record to arrayref 0.3.10 alone"
  summary: "The CVE identifier and the CVSS score appear in NO source this entry cites, and the sentence carries no inline link at all. I HTML-stripped and searched all five cited pages fetched this pass: blog.rust-lang.org (no CVE id), stepsecurity.io (no 'CVE-2026-77651'; its only '9.8' is 'winit (49.8M downloads)'), wiz.io (no CVE id, no 9.8), safedep.io (no CVE id), rustsec.org/advisories/RUSTSEC-2026-0260.html (no CVE id). The claim IS true — I confirmed EUVD-2026-63780 via https://euvdservices.enisa.europa.eu/api/search?text=CVE-2026-77651: aliases CVE-2026-77651, baseScore 9.8, baseScoreVersion 3.1, product arrayref 0.3.10, epss 0.0 — but the reader cannot trace it. Add the EUVD record (https://euvd.enisa.europa.eu/enisa/EUVD-2026-63780) as a corroborating source and cite it inline, exactly as the TrueConf entry in this same run does for its CVE metadata."
- code: F8
  category: needs-more-research
  section: deep-dive
  item: "btr-reforged-defender-remediation-driver-kernel-primitive"
  url_or_quote: "Check Point observed no real-world abuse of BTR.sys in the manner it demonstrates, which is what makes this a detection-engineering window rather than an incident."
  summary: "The entry's own frontmatter carries `tags: [... poc-public ...]` but the body never tells the reader the tool is publicly released — and it is: the cited Check Point post links three times to https://github.com/Dump-GUY/BTR_CLI and calls BTR_CLI 'a fully functional Proof-of-Concept (PoC)' whose 'source code implements a complete exploitation chain'. That is the single fact that turns 'a detection-engineering window rather than an incident' into 'weaponisation is one clone away', and it is the difference between a Tier-2 reader scheduling the SeLoadDriverPrivilege review and deferring it. State that a working PoC is public (no URL needed)."
- code: F8
  category: needs-more-research
  section: active-threats
  item: "uat-10147-spectre-byovd-kernel-callback-unlinking-agentic-ai"
  url_or_quote: "Initial access is entirely old, already-patched, publicly disclosed flaws in internet-exposed software: unauthenticated remote code execution in Zimbra Collaboration Suite, a deserialization flaw in AjaxPro, arbitrary code execution in Nacos ... and the long-lived Telerik UI for ASP.NET AJAX deserialization flaw"
  summary: "The cited Talos post names every one of these by identifier and the entry drops all of them: CVE-2022-27925 (Zimbra unauthenticated RCE), CVE-2021-23758 (AjaxPro deserialization RCE), CVE-2021-29441 and CVE-2021-29442 (Nacos), CVE-2019-18935 (Telerik UI for ASP.NET AJAX .NET JSON deserialization). The Defender takeaway then tells the reader 'an internet-facing Zimbra, Nacos or Telerik instance nobody owns is the whole precondition' — which is not checkable against an estate without the ids. Exploitation prerequisites / affected versions are exactly the depth fields the research taxonomy requires, and the source carries them. Name the ids inline (they need not enter `cves[]`, which is reserved here for the two BYOVD drivers)."
- code: F10
  category: missed-angle
  section: trending-vulnerabilities
  item: "NOT PUBLISHED — Elementor Pro unauthenticated arbitrary file upload to RCE (CVE-2026-32475)"
  url_or_quote: "run record: 'not published — a vulnerability entry that cannot state which version to patch to is filler ... The teaser carries no CVE id, no CVSS, no affected/fixed version boundary and no mechanism.'"
  summary: "The deferral rests on the Wordfence article body being unreachable, but the item was fully reachable on two transports this run used successfully all night. (1) The ENISA EUVD API — the same recipe that supplied both TrueConf CVE records — returns EUVD-2026-62595: aliases CVE-2026-32475, 'Unrestricted Upload of File with Dangerous Type vulnerability in Elementor Elementor Pro allows Using Malicious Files. This issue affects Elementor Pro: from n/a through 4.2.1.', baseScore 9.0 (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H), epss 0.42, assigner Patchstack, published 2026-08-19, updated 2026-08-20 (in-window). (2) Patchstack — the assigning CNA and originating discloser — has a full research post that the direct bridge reads cleanly (133 KB): https://patchstack.com/articles/critical-unauthenticated-file-upload-to-rce-in-elementor-pro-plugin, headed 'Elementor Pro Unauthenticated Arbitrary File Upload to Remote Code Execution CVE-2026-32475 CVSS 9.0', with the mechanism ('In version 4.2.1 and below, the plugin's Forms module handles an uploaded file in two independent steps: it validates the file's extension in one loop, and it moves the uploaded file to a public directory in a second loop. These two loops treat empty [entries differently]'), the upload-URL disclosure path, and the fix ('Update Elementor Pro to version 4.2.2 or later'). Every field the run record named as missing is present. A pre-auth file-upload-to-RCE at CVSS 9.0 in a plugin with a very large install base, on a stack that Swiss federal, cantonal and communal web estates run widely, is a widely-deployed-tech item with exposure-driven urgency, not a backlog row. Suggested query if a fresh pivot is wanted: `Patchstack Elementor Pro CVE-2026-32475 4.2.2 arbitrary file upload`."
