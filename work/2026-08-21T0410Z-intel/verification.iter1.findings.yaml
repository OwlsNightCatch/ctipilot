  item: "berlin-landesnetz-compromise-senate-confirms-pdf-vector"
  url_or_quote: "sourcing_note: 'heise independently reported the Senate Chancellery's statements two days earlier.'"
  summary: "Both the primary and the corroborating source carry the same wire. berlin.de's byline is 'Autor:in: dpa/BerlinOnline'; the heise article's byline is 'Von Nico Ernst mit Material der dpa'. Calling heise 'independent' overstates it. The entry's `verification: single-source-victim` already prices this correctly, so nothing downstream is wrong — but the word 'independently' should go, or be qualified ('heise reported the same Senatskanzlei statement, also on dpa material, two days earlier')."
