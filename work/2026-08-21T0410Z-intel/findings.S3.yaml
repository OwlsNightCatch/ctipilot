  - title: "UAT-10147's SPECTRE implant abuses two BYOVD drivers to blind CrowdStrike, SentinelOne and Defender kernel callbacks, and Talos assesses the actor built it with jailbroken AI coding assistance"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/", publisher: "Cisco Talos", date: "2026-08-20", role: primary }
      - { url: "https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/", publisher: "Cisco Talos", date: "2026-08-20", role: primary }
      - { url: "https://cyberinsider.com/chinese-hackers-use-ai-to-automate-attacks-on-170000-servers/", publisher: "CyberInsider", date: "2026-08-20", role: corroborating }
    discovery_trace: "first seen at: talos, URL https://blog.talosintelligence.com/ (listing) -> primary: Cisco Talos, URL https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/ and companion post https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/ -> corroborating: WebSearch (\"UAT-10147 SPECTRE Talos rootkit BYOVD\") -> CyberInsider, URL https://cyberinsider.com/chinese-hackers-use-ai-to-automate-attacks-on-170000-servers/"
    summary: >
      Cisco Talos published two companion reports (same day) on UAT-10147, a Chinese-speaking cybercrime group that
      gains initial access to roughly 170,000 URLs (per CyberInsider's relay of the same figures) by exploiting
      known vulnerabilities in IIS/ASP.NET, Zimbra, Nacos, AjaxPro and Telerik UI, then combines SEO-fraud
      monetization with a mature post-exploitation toolset spanning government, education, media, technology and
      gaming victims. The group's cross-platform C2 implant, SPECTRE, is written in C with 45 Windows commands
      (24 plaintext, 21 xorshift-PRNG-encrypted) covering process injection, credential theft, and — its most
      consequential capability — a BYOVD component that loads vulnerable signed drivers (MSI's RTCore64.sys,
      CVE-2019-16098, and Dell's DBUtil_2_3.sys, CVE-2021-21551) to obtain kernel read/write access and unlink the
      process/thread/image-load notification callbacks that EDR products depend on, rendering "kernel-callback-
      dependent security products such as CrowdStrike Falcon, SentinelOne, Microsoft Defender...completely blind
      to new process creations." SPECTRE's Linux variant deploys a companion kernel rootkit Talos calls Specter,
      masquerading as the legitimate module acpi_pad.ko, which uses ftrace-based syscall hooking to hide processes
      (a custom kill-signal value removes the target task_struct from the kernel PID list, making /proc/<pid>
      disappear) and persists via a fraudulent systemd unit. In the companion post, Talos documents evidence the
      actor used PentestGPT, DeepAudit and ysoserial-based automation — including a recovered artifact showing an
      AI tool generating a full exploitation README plus three companion Python scripts for a ViewState
      deserialization attack, and a section Talos calls its most significant finding: a detailed record of an
      active intrusion against a real target, generated as documentation by the AI tooling itself. Talos assesses
      with moderate-to-high confidence that UAT-10147 belongs to an emerging class of financially motivated
      operators using agentic AI to move beyond simple scripting assistance toward semi-autonomous offensive
      orchestration (iterative exploit refinement, adaptive troubleshooting, exploit-validation workflows).
    region_nexus: "Global; ~170,000 targeted URLs across government agencies, education, media, technology and gaming sectors in multiple countries per secondary reporting — direct relevance to any Swiss/EU public-sector or education entity running an internet-facing IIS, Zimbra, Nacos, AjaxPro or Telerik UI instance, and to any Windows/Linux estate defended by kernel-callback-dependent EDR."
    primary_sector_nexus: "direct"
    sector: "public-sector, technology, education"
    cves: ["CVE-2019-16098", "CVE-2021-21551"]
    techniques: [T1190, T1068, T1014, T1685, T1055, T1588.007]
    affected_products: ["MSI Afterburner RTCore64.sys driver", "Dell DBUtil_2_3.sys driver", "Microsoft IIS", "Zimbra Collaboration Suite", "Nacos", "Telerik UI", "ABRT"]
    entity_keys: []
    new_entities:
      - { key: "actor:uat-10147", type: actor, name: "UAT-10147", aliases: [],
          summary: "Cisco Talos designation for a Chinese-speaking, financially motivated cybercrime group ('x神'/xshen) that gains initial access via known vulnerabilities in internet-facing IIS, Zimbra, Nacos, AjaxPro and Telerik UI servers, combines SEO-fraud monetization (BadIIS) with a mature cross-platform post-exploitation toolset, and — per Talos's moderate-to-high-confidence assessment — uses agentic AI tooling (PentestGPT, DeepAudit, ysoserial automation) to operationalize offensive tradecraft at scale (Cisco Talos, 2026-08-20)." }
