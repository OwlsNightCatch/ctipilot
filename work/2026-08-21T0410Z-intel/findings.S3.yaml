  - title: "Operation ASTERIX: fake Trezor/Ledger/Exodus wallet apps kill the real app mid-launch to steal seed phrases, and when Claude declined to help obfuscate the malware the operators jailbroke Kimi instead"
    sources:
      - { url: "https://www.rapid7.com/blog/post/tr-operation-asterix-crypto-fraud-vishing-phishing/", publisher: "Rapid7", date: "2026-08-18", role: primary }
      - { url: "https://www.cryptotimes.io/2026/08/20/rapid7-exposes-fake-trezor-app-used-to-steal-crypto-seed-phrases/", publisher: "CryptoTimes", date: "2026-08-20", role: corroborating }
    discovery_trace: "first seen at: cryptotimes, URL https://www.cryptotimes.io/ (homepage listing, headline only, no outbound links surfaced) -> WebSearch (\"Rapid7 fake Trezor app seed phrase malware\") -> primary: Rapid7, URL https://www.rapid7.com/blog/post/tr-operation-asterix-crypto-fraud-vishing-phishing/ -> corroborating: CryptoTimes article drilled directly, URL https://www.cryptotimes.io/2026/08/20/rapid7-exposes-fake-trezor-app-used-to-steal-crypto-seed-phrases/"
    summary: >
      Rapid7 documents a crypto-fraud pipeline it calls Operation ASTERIX, discovered after finding a misconfigured
      web directory on the operators' infrastructure on 17 August. The pipeline chains bulk phone-number validation
      against exchange APIs (885,000 numbers mined; 43,066 of 316,002 numbers in a German dataset confirmed live,
      a 13.6% hit rate; 5,576 matched to Binance accounts and queued for attack), Asterisk/3CX-powered vishing that
      references a fake case number shared with a companion phishing email, and Electron-packaged counterfeit
      Trezor Suite, Ledger Live and Exodus wallet applications. The macOS Trezor build runs as a hidden Electron
      process that polls the process list every five seconds, kills the legitimate Trezor Suite the moment it
      launches, and brings its own transparent overlay window forward to prompt the victim for a 12-, 18-, 20- or
      24-word BIP39 recovery phrase (plus optional passphrase) before exfiltrating it to Telegram bots. Rapid7's
      most consequential finding is in the operators' own build environment: GitHub Copilot, Claude Code and Kimi
      were used throughout development of phishing infrastructure, payload code and debugging; when a request to
      obfuscate malicious code was refused by one model, the operators switched providers and deployed a custom
      jailbreak prompt against Kimi combining identity replacement and trigger-phrase conditioning to defeat its
      safety controls. Rapid7 frames AI-safety-control bypass as becoming a routine engineering step in malware
      development pipelines rather than an edge case.
    region_nexus: "Global; German phone-number dataset, Binance/Kraken/Crypto.com account validation. No Swiss/EU victim population disclosed, but the AI-jailbreak-in-malware-development-pipeline pattern is directly transferable to any SOC tracking AI-assisted threat evolution, and the targeted platforms (Trezor/Ledger/Exodus) see use among FINMA-supervised digital-asset custodians' retail customers."
