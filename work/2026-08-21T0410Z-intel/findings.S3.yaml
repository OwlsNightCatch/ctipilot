  - title: "IBM X-Force baits ITG27 (Mustang Panda) into a deception environment and catches a new hVNC backdoor, Havencode, plus a Toneshell v10 that moved from raw sockets to WebSocket-over-TLS"
    sources:
      - { url: "https://www.ibm.com/think/x-force/trapping-a-mustang-panda", publisher: "IBM X-Force", date: "2026-08-20", role: primary }
    discovery_trace: "first seen at: ibm-xforce, URL https://www.ibm.com/think/x-force (listing, dateless landing) -> primary: IBM X-Force, URL https://www.ibm.com/think/x-force/trapping-a-mustang-panda (dated 2026-08-20 in the article's own datePublished metadata)"
    summary: >
      IBM X-Force, working with deception-technology vendor Deception.Pro, captured live hands-on-keyboard
      intrusions by ITG27 (formerly Hive0154; a China-aligned espionage group X-Force states overlaps with actors
      publicly reported as Mustang Panda, Stately Taurus, UNK_SteadySplit, Camaro Dragon, Twill Typhoon, Polaris
      and Earth Preta) inside simulated Indian government and energy-sector environments. The initial-access chain
      uses hydropower-cooperation-themed spear-phishing archives whose legitimate executable side-loads a malicious
      DLL ("SolidPDFCreator.dll") that recovers embedded shellcode and executes it via the EnumSystemLocalesA
      enumeration-callback technique, delivering a new Claimloader variant that chains to Toneshell v10 — the
      tenth iteration of ITG27's backdoor, which X-Force says has moved from custom socket-based C2 to WebSocket-
      over-TLS via WinHTTP. In one incident, operators additionally deployed a backdoor X-Force had not seen
      before, Havencode: a 64-bit DLL side-loaded alongside a legitimate executable that offers hidden-desktop
      (HVNC) and existing-desktop (AVNC) remote control plus a generic TCP/UDP proxy/tunnel ("map") capability,
      with the C2 address supplied only as a runtime command-line argument rather than embedded in the binary.
      X-Force correlated operator activity across both incidents to consistent 08:00-18:00 China Standard Time
      working hours and observed hands-on-keyboard typos (e.g. "net user /doamin"), supporting an assessment that
      the intrusions were manually operated rather than fully automated. Detection guidance centers on DLL
      side-loading into non-standard paths under C:\ProgramData\, EnumSystemLocalesA-callback shellcode execution,
      Run-key persistence, and hidden-desktop / unexpected explorer.exe launches tied to HVNC activity; X-Force
      also recommends 90-day minimum log retention given the actor's multi-day operational tempo.
    region_nexus: "South Asia (Indian government and energy sector) — no direct Swiss/EU victim population disclosed, but the actor cluster (Mustang Panda / Stately Taurus / Camaro Dragon family) has a documented history of targeting European and Russian organisations, and the deception-capture methodology plus DLL-sideload/enumeration-callback tradecraft is directly transferable to any government or energy-sector defender."
