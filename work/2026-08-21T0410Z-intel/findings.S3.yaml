  - title: "BTR Reforged: Check Point turns Windows Defender's own boot-time remediation driver into a kernel read/write primitive, no vulnerability required"
    sources:
      - { url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/", publisher: "Check Point Research", date: "2026-08-20", role: primary }
      - { url: "https://cyberinsider.com/chinese-hackers-use-ai-to-automate-attacks-on-170000-servers/", publisher: "CyberInsider", date: "2026-08-20", role: unrelated-corroborating-attempt-dropped }
    discovery_trace: "first seen at: checkpoint-research, URL https://research.checkpoint.com/feed/ (RSS listing) -> primary: Check Point Research, URL https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/ (no independent secondary pickup found via WebSearch \"BTR Reforged Check Point Defender remediation driver\" beyond aggregator/vulners.com and a cybersecuritynews.com page that returned an empty body on fetch — logged as a dropped corroboration attempt, not cited)"
    summary: >
      Check Point Research reverse-engineered BTR.sys (the Boot-Time Removal driver embedded in Windows Defender's
      MpEngine.dll, used when Defender needs to remove a file that is locked by the OS after a reboot) and found it
      accepts a proprietary transaction blob — RC4-encrypted with a hardcoded key and protected by a modified
      CRC-32 check — via a value read from its own service registry key, rather than exposing a standard IOCTL
      interface. An attacker who already holds SeLoadDriverPrivilege (no memory-safety bug required, and no risk
      of the driver being added to the Microsoft Vulnerable Driver Blocklist, since it is a legitimate signed
      in-box component) can craft valid transactions instructing BTR.sys to delete or move files and directories
      and delete or write registry keys/values from kernel mode. The most consequential exploitation window is a
      "Golden Window" during Phase 1 boot, when the filesystem has become writable but security services
      (Defender itself, third-party EDR/AV) have not yet started — letting an attacker tamper with or neutralize
      those services before they can observe it. Check Point published a proof-of-concept tool, BTR_CLI, and
      reports reliable exploitation across Windows 7 through 11; it found no evidence of in-the-wild abuse, and
      states Microsoft's MSRC does not classify the finding as a vulnerability because it presupposes
      administrator-level privilege the attacker must already hold. Detection guidance centers on Sysmon Event ID
      15 (FileCreateStreamHash) alerts where the target filename ends in ".sys:changelist", and on monitoring for
      unauthorized reads/writes of the driver's "Args" service-registry value or invocation of its configuration
      interface outside Defender's own maintenance windows.
    region_nexus: "Global; a Windows-platform-wide (7 through 11) EDR/AV-neutralization primitive with no regional targeting of its own — directly relevant to any Windows estate, including Swiss federal, cantonal and communal administration and CI operators."
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: []
    techniques: [T1211, T1685]
    affected_products: ["Microsoft Defender for Endpoint (BTR.sys Boot-Time Removal driver, MpEngine.dll)"]
    entity_keys: []
    new_entities:
      - { key: "tool:btr_cli", type: tool, name: "BTR_CLI", aliases: [],
          summary: "Check Point Research's proof-of-concept command-line tool implementing the reverse-engineered BTR.sys transaction protocol, published as supporting material for the BTR Reforged research (Check Point Research, 2026-08-20)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The driver does not expose a standard IOCTL interface. Instead, it reads a configuration blob pointed to by the Args value in its Service Registry Key."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "The abuse of BTR.sys fundamentally relies on the attacker possessing SeLoadDriverPrivilege."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "Alert on FileCreateStreamHash (Event ID 15) where TargetFilename ends in \".sys:changelist\"."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
    extended_notes: >
      This is a different Windows-Defender-internals abuse technique from the already-covered ShieldBreak /
      CVE-2026-69414 story (Cloud Files API + Object Manager namespace TOCTOU race writing a fake phoneinfo.dll
      loaded by wermgr.exe) that appears in the url-liveness ledger for this run (fetched by a sibling sub-agent
      at 2026-08-21T04:26:12Z via a LevelBlue SpiderLabs post) — confirmed non-duplicate by direct comparison of
      mechanism (BTR.sys transaction-protocol abuse vs Cloud-Files/TOCTOU/wermgr.exe DLL planting). Presented at
      Black Hat USA 2026 / DEF CON 34 per the researcher's own GitHub repo (github.com/Dump-GUY/BTR_CLI, not
      fetched directly — surfaced via WebSearch snippet only). No independent secondary source was successfully
