    reason: "Direct transport worked cleanly this run (confirms the 2026-08-20 recipe fix) but the newest dated advisory row on the listing was 19/08/2026, outside this run's 26h window (window start ~2026-08-20T02:10Z); all titles visible were already-covered stories (GeoServer, SAP Commerce Cloud, Adobe Commerce, Zimbra, GitLab, Ivanti EPM, Microsoft Patch Tuesday, IBM i, Oracle CPU). No in-window CCB-original item found."

