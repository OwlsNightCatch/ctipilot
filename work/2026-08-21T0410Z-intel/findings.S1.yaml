    reason: "One honest attempt per instructions: direct fetch returned HTTP 202 (169-byte SiteGround anti-bot challenge shell) and the jina reader pool is exhausted (HTTP 402 on all seven keys), so neither transport reached content. Consistent with four prior consecutive runs logging the same site-wide anti-bot interstitial."
