  - item_ref: "ATutor LCMS — CVE-2026-64960 through CVE-2026-64972 (13 CVEs), CERT Polska"
    verification_result: >
      Primary reached in full (English + Polish bilingual versions both fetched and compared — identical
      content, no additional facts in Polish). CERT Polska's advisory page provides an EXPLICIT structured
      per-CVE mapping (a metadata block per CVE giving CVE ID / CWE / vulnerable version, immediately
      followed by a "Description" section enumerating each CVE's mechanism by ID) — this is a genuine
      1:1 mapping, not an inferred pairing. One correction required: the S1 draft's enumeration of "the
      remaining ten" omitted CVE-2026-64967 entirely.

    per_cve_mapping_verbatim_from_advisory:
      - cve: CVE-2026-64960
        cwe: "CWE-434 — Unrestricted upload of file with dangerous type"
        auth_precondition: "authenticated (any authenticated user who knows a valid course_id; course_id=0 commonly works as it represents the global context)"
        mechanism: "ATutor's Gameme module allows upload of files of any type/extension with no restriction; uploaded files are stored in a web-accessible location BEFORE their content is validated. An authenticated attacker who knows a valid course_id can upload a server-executable malicious script, then request it over HTTP for remote code execution as the web server process user."
      - cve: CVE-2026-64961
        cwe: "CWE-639 — Authorization bypass through User-Controlled key"
        auth_precondition: "UNauthenticated"
        mechanism: >
          Full authentication-bypass / account-takeover via the auto-login functionality: a token
          validation check is present in code, but the values required for that validation remain
          UNINITIALIZED in certain code paths. An unauthenticated attacker who can determine a user's
          identifier and registration timestamp can generate a valid token and authenticate AS AN EXISTING
          USER, INCLUDING ADMINISTRATOR, without knowing the password. (This is the "unauthenticated
          login-token forgery" mechanism referenced in the task brief.)
      - cve: CVE-2026-64962
        cwe: "CWE-352 — Cross-Site Request Forgery (CSRF)"
        auth_precondition: "requires an authenticated victim to visit an attacker-crafted page"
        mechanism: "CSRF on the profile-update endpoint; lack of a CSRF token lets a forged cross-site request modify profile fields of an existing, logged-in user."
      - cve: CVE-2026-64963
        cwe: "CWE-22 — Path Traversal"
        auth_precondition: "authenticated"
        mechanism: "an authenticated user can access files from OTHER course directories when the AT_FORCE_GET_FILE configuration option is enabled — unauthorized cross-course file/information disclosure."
      - cve: CVE-2026-64964
        cwe: "CWE-340 — Generation of Predictable Numbers or Identifiers"
        auth_precondition: "unauthenticated (against a target account)"
        mechanism: "predictable email-confirmation/account-activation tokens derived from insufficiently random, registration-related values; an attacker who knows/predicts them can activate an unconfirmed account without access to the victim's mailbox."
      - cve: CVE-2026-64965
        cwe: "CWE-862 — Missing Authorization"
        auth_precondition: "low-privileged authenticated (e.g. an enrolled student)"
        mechanism: "missing authorization on Test and Question Import backend endpoints — a low-privileged user enrolled in a course can bypass authorization checks by sending requests directly to the backend import endpoints, allowing unauthorized import of tests/questions into a course."
      - cve: CVE-2026-64966
        cwe: "CWE-22 — Path Traversal"
        auth_precondition: "authenticated with course-instructor privileges"
        mechanism: >
          Path traversal in ZIP-extraction functionality. An attacker with instructor privileges uploads and
          extracts a specially crafted ZIP archive, causing files to be written OUTSIDE the intended
          extraction directory; this places a server-executable .phtml file in the web root, achieving
          remote code execution with web-server privileges. (This is the second of the two file-upload RCE
          paths referenced in the task brief.)
      - cve: CVE-2026-64967
        cwe: "CWE-22 — Path Traversal"
        auth_precondition: "authenticated with ADMINISTRATIVE privileges"
        mechanism: >
          [OMITTED FROM S1's DRAFT SUMMARY — ADD ON COMPOSITION] Path traversal in ATutor's error-log
          viewer: an attacker with administrative privileges can access arbitrary files OUTSIDE the intended
          logs directory, exposing sensitive files/other web-server-accessible resources.
      - cve: CVE-2026-64968
        cwe: "CWE-918 — Server-Side Request Forgery (SSRF)"
        auth_precondition: "authenticated administrator"
        mechanism: "SSRF in import functionality — an authenticated administrator can make the server request arbitrary internal HTTP endpoints, cloud metadata services, or local files via the file:// scheme if the PHP environment permits URL wrappers."
      - cve: CVE-2026-64969
        cwe: "CWE-639 — Authorization bypass through User-Controlled key (IDOR)"
        auth_precondition: "any authenticated user (e.g. a student)"
        mechanism: "IDOR in profile-picture endpoints — any authenticated user, including a student, can supply another user's member_id in a POST request to the profile-album endpoint and permanently delete that user's profile picture, including instructors' and administrators'."
      - cve: CVE-2026-64970
        cwe: "CWE-79 — Cross-site scripting (Stored)"
        auth_precondition: "unauthenticated attacker (self-registers); victim must be authenticated and view the attacker's profile"
        mechanism: "stored XSS via the registration 'phone' field — attacker registers an account with a JavaScript payload in the phone field; any authenticated user who views the attacker's public profile has that payload echoed without output encoding, executing in their browser and stealing their session cookie."
      - cve: CVE-2026-64971
        cwe: "CWE-79 — Improper Neutralization of Input During Web Page Generation (Reflected XSS)"
        auth_precondition: "victim must open an attacker-supplied URL"
        mechanism: "reflected XSS in the restore functionality via a specially crafted URL."
      - cve: CVE-2026-64972
        cwe: "CWE-79 — Improper Neutralization of Input During Web Page Generation (Reflected XSS)"
        auth_precondition: "authenticated attacker"
        mechanism: >
          reflected XSS via the popup parameter of preview.php: an authenticated attacker injects a double
          quote into the popup parameter to break out of the attribute value and append a new event handler
          (e.g. onload); the related preview_top.php file DOES sanitise these parameters, but that does not
          prevent XSS in the parent frameset rendered directly by preview.php itself — i.e., a
          same-mechanism bypass because a sibling file's sanitization doesn't cover the top-level file's own
          use of the parameter.

