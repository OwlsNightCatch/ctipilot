    dprk_attribution_claim_wiz_only: >
      This is Wiz Research's OWN assessed claim; none of rust-lang.org, StepSecurity, or SafeDep make any
      DPRK/North Korea attribution. Wiz's exact framing (verbatim, single JSON value-field per fragment,
      confirmed contiguous in the fetched page): the arrayref campaign's "infrastructure substantially
      overlaps with operations attributed to recent North Korean actors," on four cited evidence points: (1)
      shared C2 endpoint URL-path pattern between the arrayref beacon and a campaign Wiz calls "Mastra,"
      which Wiz states is "attributed by Microsoft to DPRK / Sapphire Sleet"; (2) the arrayref beacon's IP
      shares an SSL certificate issuer with an IP also used in the Mastra campaign; (3) a victim-reported C2
      IP from the arrayref incident appears in "Google Cloud Threat Intelligence's analysis of UNC1069's
      axios npm attack, which Mandiant links to North Korea"; (4) both campaigns generally use the same
      hosting-provider IP range (Wiz names the provider as Hostwinds LLC). This is infrastructure-overlap
      reasoning (shared hosting range / SSL issuer / endpoint-path pattern / a victim report), explicitly
      NOT a confirmed attribution by Wiz itself, and doubly not by Microsoft or Mandiant for THIS specific
      campaign (their attributions are for the separate, earlier Mastra and axios campaigns that Wiz says
      share infrastructure with this one). Compose as: "Wiz Research assesses infrastructure overlap between
      this campaign and prior DPRK-linked (Sapphire Sleet / UNC1069) npm supply-chain campaigns, based on
      [the four points above] — not as a settled attribution of the arrayref campaign itself to DPRK."

    detection_and_hardening_concepts:
      telemetry_class_and_anchors: >
        Process-creation / child-process telemetry with parent lineage on build and CI hosts: a cargo
        build-rs/build-script-build child process spawning a network client (or resolving a TLS/HTTP-client
        library it has no functional need for) followed by writing an executable/script to a temp directory
        and launching it detached is the core observable sequence — vendor-neutral anchors are Sysmon EID 1
        (process creation) with parent image = a *-build-script-build.exe / cargo.exe / rustc.exe lineage,
        Sysmon EID 3 (network connection) from that same lineage to a destination never seen in a build
        baseline, and Sysmon EID 11 (file create) for a new executable/script dropped to a temp path
        immediately followed by EID 1 executing it. On Windows specifically, wscript.exe spawned as a child
        of a build process (rather than a user-invoked script) is anomalous. CI-specific anchor: egress
        allow-listing / anomaly detection on build-runner network baselines (what StepSecurity's own
        reproduction relied on) — any build-time destination not previously observed for a given
        project/workflow is the signal, independent of which package or crate triggered it.
      why_lockfile_pin_alone_is_insufficient: >
        A Cargo.toml version *range* pin (e.g. arrayref = "0.3") never protects against this class — only
        the RESOLVED Cargo.lock entry matters, and Cargo builds every declared non-optional dependency
        (including a malicious proc-macro build dependency) regardless of whether the parent crate's runtime
        code calls into it. A project must inspect its actual resolved Cargo.lock (and any warm
        ~/.cargo/registry/cache or vendor/ directory, and any CI cache restore such as actions/cache or a
        container image baked with a pre-warmed cache) for the specific poisoned version string, not merely
        confirm its Cargo.toml constraint looks safe.
      cargo_audit_gap: >
        Because the malicious versions were deleted from the registry rather than formally yanked with a
        published RustSec advisory at time of detonation, cargo audit / cargo-vet will not flag a project
        that already resolved a poisoned version into its lockfile before the advisories were published —
        an explicit, source-confirmed detection blind spot.
      hardening: >
        Sources' own recommended remediation: pin to the confirmed last-safe version per crate (0.3.9 /
        0.8.6 / 0.1.8); treat any developer workstation or CI runner that built an affected project during
        the exposure window as compromised and rotate every credential reachable from it (SSH keys, cloud
        tokens, crates.io/registry API tokens, signing keys, CI secrets); adopt a "cooldown" policy that only
        admits crate versions older than N days (StepSecurity notes this would have made the ~90-minute
        exposure window a non-event); commit and enforce Cargo.lock with `--locked` in CI and review lockfile
        diffs in PRs so a newly-added dependency name is visible in code review; treat a sudden multi-version
        yank burst on a long-lived, previously dependency-free crate as an investigation trigger rather than
        a routine "please upgrade" nudge.

