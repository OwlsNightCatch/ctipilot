  # ITEM 2 — Rust crates.io supply-chain attack (arrayref / internment / append-only-vec)
  # ---------------------------------------------------------------------
  - item_ref: "Rust crates.io supply-chain attack (arrayref, internment, append-only-vec) — CVE-2026-77651"
    verification_result: "primaries fully reached; S1 draft required two corrections (below) and several enrichments"

    corrections_required:
      - field: cves / cve_table.product
        issue: >
          CVE-2026-77651 (MITRE-assigned; alias GHSA-jvc2-9prg-ffvc) is scoped to arrayref 0.3.10 ONLY.
          Confirmed via ENISA EUVD record EUVD-2026-63780: enisaIdProduct lists a single product entry
          {name: "arrayref", vendor: "droundy", product_version: "0.3.10"}. internment 0.8.7 and
          append-only-vec 0.1.9 are tracked under separate identifiers with NO CVE of their own:
          RUSTSEC-2026-0266 / OSV MAL-2026-14337 (internment) and RUSTSEC-2026-0262 / OSV MAL-2026-14333
          (append-only-vec). The cve_table / cves[] field should not imply one CVE covers all three crates.
      - field: cve_table.patch (CVE-2026-77651 row)
        issue: >
          "no fixed version applicable" is imprecise. RustSec's own advisory (RUSTSEC-2026-0260, fetched at
          https://rustsec.org/advisories/RUSTSEC-2026-0260.html) states explicitly: Patched: "no patched
          versions"; Unaffected: "<=0.3.9". The correct framing is: the malicious 0.3.10 was hard-deleted
          from the registry (not fixed-forward); the last clean/safe release is 0.3.9, and the vendor
          (Rust Security Response Team) recommends pinning arrayref="=0.3.9" (StepSecurity's explicit
          recovery guidance). Same shape for internment (last safe 0.8.6) and append-only-vec (last safe
          0.1.8) per StepSecurity's blast-radius section, independently corroborated by the SafeDep original
          report's package table.
      - field: summary prose
        issue: >
          The download-count framing "245M+ lifetime downloads of the family" conflates figures. Per
          StepSecurity's own "attack at a glance" box: arrayref 0.3.10 alone = 245.2M all-time downloads
          (53.7M in the trailing 90 days); internment 0.8.7 = 14.4M all-time (3.5M/90d); append-only-vec
          0.1.9 = 4.5M all-time (1.3M/90d). StepSecurity states the COMBINED figure for the three
          compromised crates explicitly as "264M: combined all-time downloads of the three compromised
          crates" — 264M is the correct combined figure, not 245M (245M is arrayref alone). SafeDep
          independently gives a near-identical arrayref figure (244,989,384 at time of writing).

    verified_facts:
      timeline_utc_2026_08_20:
