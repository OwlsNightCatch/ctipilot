      mechanism_build_time_execution: >
        proc-macro1 is a typosquat of the legitimate proc-macro2 (154M+ downloads per Wiz); its library
        source is an unmodified copy of proc-macro2 (so every build and test still passes — "there is not a
        single line of malicious code inside arrayref itself" per StepSecurity), meaning the ENTIRE weapon is
        confined to build.rs plus three new build-time-only dependencies (base64, rustls, ureq — a
        downloader toolkit a token-parsing proc-macro crate has no legitimate reason to need). Because Cargo
        compiles and RUNS build.rs at compile time as a normal step of `cargo build`/`cargo update` — before
        any of the host crate's own runtime code executes and with the full privileges of the invoking
        user/service account — simply resolving arrayref 0.3.10 in a Cargo.lock and building the project was
        sufficient to detonate the payload; the arrayref/internment/append-only-vec code itself never needs
        to be called. This is the reason Cargo.toml version-range pins ("arrayref = \"0.3\"") do not protect
        a project — only the resolved Cargo.lock version matters, and Cargo builds every declared
        non-optional dependency (proc-macro1) regardless of whether the parent crate's own code references
        it.
      mechanism_payload_delivery: >
        build.rs reconstructs the payload-host URL and a callback address from base64-encoded string
        fragments (so no plaintext network address appears in the source), fetches an OS/architecture-
        specific second-stage binary (four build targets: linux/x86_64, windows/x86_64, macos/x86_64,
        macos/aarch64 — any other platform combination panics the build) over a TLS connection whose
        certificate validation is disabled via a custom ServerCertVerifier ("AcceptAll") that unconditionally
        returns success from every certificate and signature check, necessary because the payload host is a
        bare IP address with no valid certificate. On Unix the binary is written to a fixed temp path, marked
        executable, and spawned detached with stdio nulled. On Windows the fetched bytes are a PowerShell
        script written to the user's temp directory and launched via a VBScript wrapper executed by
        wscript.exe with no window/console/prompt — the source carries an explicit comment (quoted by
        SafeDep) that routing through wscript.exe/ShellExecute is specifically what escapes Cargo's job
        object, so the process keeps running after cargo build exits; both platforms additionally leak the
        child handle via Rust's std::mem::forget(child) so its destructor never runs and Cargo does not wait
        on it. The build script's own execution completes and exits 0 either way — "the build succeeds.
        Nothing looks wrong" (StepSecurity).
      mechanism_second_stage_wiz_analysis: >
        Wiz Research states it analyzed samples of the malicious crates "retrieved from Google Threat
        Intelligence" (i.e., Wiz did not merely read third-party reports but examined the actual malware).
        Per Wiz: the stage-2 implant beacons to its C2 via HTTPS POST to a fixed callback endpoint path,
        exfiltrating host/user/OS metadata as Base64-encoded JSON; it collects hostname, username and OS
        details, enumerates installed applications, and queries the Chrome/Brave/Edge browsers' SQLite
        credential-store databases directly for SAVED-LOGIN records and extension settings. Persistence is
        via a Registry Run key (Windows), a LaunchAgent (macOS), or a systemd user service (Linux). It
        supports four commands (kill, minicfg [reconfigure C2/beacon interval], startup [install
        persistence], runscript [download+execute PowerShell/shell scripts sync or background]), falls back
        to a Domain Generation Algorithm generating 10 algorithmic .com domains every 5 days if the primary
        C2 is unreachable (Wiz notes the DGA domains do not currently appear registered), encrypts its
        configuration with AES-128-GCM under a hardcoded key, and authenticates commands via an embedded
        RSA-2048 private key.
      IMPORTANT_correction_wiz_self_issued: >
        Wiz Research published a self-correction inline on this exact point, which must be carried forward
        verbatim rather than the original claim: "Edit: A prior version of this piece mistakenly stated that
        browser credentials were stolen. The queries only enumerate saved logins, they do not retrieve the
        encrypted credential material." I.e., the malware lists WHICH sites/accounts have saved logins in
        the browser's credential store; it does NOT decrypt/exfiltrate the actual password material itself.
        Any composed entry must reflect "enumerates saved logins" / "reads which accounts have saved
        credentials," not "steals passwords" or "exfiltrates credentials" outright.
      second_stage_stepsecurity_caveat: >
        StepSecurity's own persistence/behavior details for the second stage (Linux artifacts under
        $HOME/.config, executables named similarly to legitimate-looking service names, a systemd service
        registered to restart the payload, and a second reported C2 address distinct from the build-time
        payload host) are explicitly sourced to a THIRD-PARTY report from an infected developer inside the
        RustSec advisory-db thread, and StepSecurity states plainly: "These are third-party reports we have
        not independently reproduced, but they are consistent with the dropper's design and worth hunting
        for now." This is a lower-confidence claim than Wiz's own direct sample analysis and should be
        attributed as such if carried into the entry.
      runtime_reproduction_stepsecurity: >
        StepSecurity independently reproduced the build-time detonation in a monitored GitHub Actions
        workflow (their Harden-Runner CI egress-monitoring product) building a project pinned to the
        malicious arrayref 0.3.10. In an audit-mode run, every expected Rust-toolchain network destination
        (github.com, index.crates.io, static.crates.io, docs.rs, static.rust-lang.org) was allowed, and then,
        mid-build-step, the job opened a connection to the payload host that had never been seen in any
        prior run of the same workflow — flagged "Anomalous, first-seen endpoint" — while the build step
        itself still reported success and the overall CI job still went green. In a second run, after the
        payload host was added to a block list, the same connection was denied and the build continued
        (silent failure swallowed by the dropper's own error handling) with the stage-2 payload never
        reaching the runner. This independently confirms build.rs makes the network connection during
        `cargo build` itself (not merely "if executed later") and that the compromise is invisible from the
        CI job's pass/fail status alone.
      exploitation_status_nuance: >
        FLAG FOR COMPOSER: this is a genuine cross-source tension, not resolvable from the primaries — carry
        both sides. RustSec's own formal advisory text for BOTH affected crates states no confirmed victim
        usage: RUSTSEC-2026-0260 (arrayref): "This compromised version was published on 2026-08-20 and
        removed approximately 86 minutes later, with no evidence of actual usage." RUSTSEC-2026-0262
        (append-only-vec) carries the identical "with no evidence of actual usage" line for its 107-minute
        window. Separately, StepSecurity reports (attributed explicitly as an unverified third-party account
        from the same RustSec advisory-db thread) that "a developer who was infected on Linux reported the
        post-execution behavior" — i.e., at least one third-party claim of an actual infection exists, but
        it postdates/sits outside RustSec's own "no evidence of actual usage" assessment and has not been
        independently reproduced by any of the four fetched primaries. Do not represent this as "confirmed
        exploited" — the S1 cve_table's "exploited: true" for CVE-2026-77651 should be softened or footnoted
        to reflect that the crate's own coordinating advisory (RustSec) explicitly found no evidence of
        actual usage, while a single unverified third-party infection report exists in parallel.
      yank_vs_delete_distinction: >
        Precise mechanics for the entry: the ATTACKER yanked the clean prior arrayref releases (0.3.5–0.3.9)
        as a social-engineering lure exploiting Cargo's "yanked version" warning to push developers toward
        upgrading to the one remaining, malicious 0.3.10 ("weaponizing Cargo's own 'yanked version' warning
        as the delivery mechanism" — StepSecurity). The RUST SECURITY RESPONSE TEAM then (a) hard-deleted
        the three malicious releases (0.3.10/0.8.7/0.1.9) and the six attacker-owned crates from the
        registry entirely — not merely yanked — and (b) reversed ("un-yanked") the maliciously-yanked clean
        releases, restoring them to their normal, warning-free state. Because deletion (rather than a formal
        yank + RustSec advisory) is what removed the malicious versions, and the RustSec advisories were
        still pending at the time of detonation, `cargo audit` does not flag a project whose lockfile already
        resolved the poisoned version — explicit detection gap stated by both rust-lang.org (implicitly, via
        its manual cache-search recommendation) and StepSecurity directly: "cargo audit reports clean for a
        project that pinned a poisoned version."

