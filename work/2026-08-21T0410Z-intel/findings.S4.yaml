items:
  - title: "GTIG: three Russian-nexus clusters abuse WhatsApp device-linking and OAuth/device-code flows to spy on European and US officials, academics and defense personnel"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia", publisher: "Google Threat Intelligence Group (GTIG)", date: "2026-08-20", role: "primary" }
      - { url: "https://cyberinsider.com/russian-hackers-abuse-whatsapp-device-linking-to-spy-on-high-value-targets/", publisher: "CyberInsider", date: "2026-08-20", role: "corroborating (re-reports the GTIG primary; not an independent second source)" }
    discovery_trace: "first seen at: cyberinsider, URL https://cyberinsider.com/russian-hackers-abuse-whatsapp-device-linking-to-spy-on-high-value-targets/ -> primary: Google Threat Intelligence Group, URL https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia"
    summary: |
      GTIG is tracking three suspected Russian-nexus cyber-espionage clusters — UNC6293, UNC7005
      (Microsoft: Storm-2945, a sub-cluster this pipeline already tracks under actor:storm-2945)
      and UNC5976 — abusing *legitimate* authentication flows rather than exploiting software bugs.
      UNC6293 and UNC7005 are assessed (moderate confidence) as related sub-clusters of ICE RELIC
      (Midnight Blizzard/APT29/Cozy Bear, tracked here as actor:midnight-blizzard); UNC5976 is a
      distinct cluster with heavier malware use against military/aerospace targets in Ukraine and
      Armenia via the HEADRUSH Excel-plugin/HTA downloader. Victimology explicitly spans "academia,
      aerospace and defense, governments and think tanks across Europe" plus academia/think tanks
      in the US.
      Three abused flows, each using only legitimate infrastructure: (1) WhatsApp device-linking —
      a phishing page harvests the target's phone number, the operator initiates a real WhatsApp
      device-link request, the page shows the *genuine* QR/link code and talks the target into
      approving it, handing the attacker a linked device with full account access; a follow-on fake
      "voice call" invokes navigator.mediaDevices.getUserMedia() and MediaRecorder to capture
      webcam/mic audio-video and upload the WebM to a C2 endpoint. (2) Google OAuth abuse — an
      unverified, testing-mode Google Cloud project hosts a "Sign in with Google" button that
      redirects through the real accounts.google.com login and then captures the resulting OAuth
      token on the attacker's own (unverified) redirect URI — no credential phishing, pure token
      theft. (3) Microsoft device-code phishing — a spoofed conference-registration page (one lure
      impersonated GLOBSEC) fingerprints the browser (screen, timezone, hardware concurrency,
      touch support, headless-browser tells) before asking the target to complete a real Microsoft
      device-code login and hand the code to the "verification" form, giving the attacker the
      resulting token. UNC7005 also distributes VIDAR (Windows) and AtomicStealer (macOS)
      infostealers by OS-fingerprinting the User-Agent, plus ENGINELIGHT (Go) and CHERRYPIE, which
      GTIG's own artefacts suggest is LLM-assisted code and which this pipeline already tracks as
      tool:chocoshell-powershell-stealer (used by actor:storm-2945). GTIG documents the actor
      iterating within days of exposure — revising templates, social-engineering questions and
      color scheme, then adding a second fingerprinting stage to detect headless/automated
      browsers.
    region_nexus: "Europe (explicit: 'governments and think tanks across Europe'), Ukraine, Armenia, plus US academia/think tanks"
