    evidence:
      - quote: "Google Threat Intelligence Group (GTIG) is tracking three distinct suspected Russian cyber espionage threat clusters abusing legitimate authentication flows to target individuals working in academia, aerospace and defense, governments and think tanks across Europe, as well as academia and think tanks within the United States."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia"
      - quote: "Anyone following the instructions effectively authorized an attacker-controlled device to access their WhatsApp account."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia"
      - quote: "Within days of identifying this activity, we observed the actor actively make changes to the operation... UNC7005 revised the template they used for social engineering, modifying the questions asked to the target as well as the color scheme."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia"
    extended_notes: |
      Triage/lookalike guidance from the source: the entire point of all three flows is that they
      generate a *legitimate* auth event (a real WhatsApp device-link, a real Google OAuth consent,
      a real Microsoft device-code redemption) — no malware execution and no anomalous credential
      submission at the moment of compromise. Defender-relevant discriminators GTIG gives: (a)
      WhatsApp — linked-device audits are the only user-visible signal; enterprises should establish
      a routine of auditing linked/secondary devices on messaging apps and enforce off-platform
      identity verification (safety numbers) before acting on "secure call/chat" invitations; (b)
      Google OAuth — the giveaway is an *unverified, testing-mode* Cloud-project consent screen
      requesting sensitive scopes, which Google's own UI flags with a warning most users click
      through; hardening is to disable Application Specific Passwords org-wide (restrict 2-Step
      Verification to security-keys-only) and enrol high-risk users in Advanced Protection Program;
      (c) Microsoft device-code — the tell is an out-of-band request to relay a device code or
      verification URL entered on a *different* site than the one that generated it; hardening is
      disabling legacy/device-code authentication where not operationally required. GTIG also
      published network/file IOCs (omitted here per this pipeline's no-IOC policy) and notes the
      captive-portal/hospitality-network angle (Storm-2945's CaptiveCrunch, already tracked) and a
      Microsoft blog on the same Storm-2945 activity (2026-07-31) as related reporting.
      Not included as a separate item this run: a joint CISA/NSA/FBI/DOE/EPA advisory on
      AI-generated exploitation scripts abusing the snap7 library against Internet-exposed Siemens
      S7-series PLCs (energy/water/manufacturing sectors) — confirmed via prior_coverage.json to
      already be published today as entry "2026-08-20/joint-advisory-active-threat-siemens-s7-plcs"
      (discovered 2026-08-20T06:48Z by an earlier run). No material delta found beyond what that
      entry already carries after reading the advisory's full text (PP-26-3374, created
      2026-08-19T14:24Z) via the primary PDF.
