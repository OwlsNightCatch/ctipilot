items:
  - title: "PTC Windchill/FlexPLM CVE-2026-12569 — unauthenticated Java deserialization RCE, CVSS 10.0, BSI emergency outreach, actively exploited"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12713"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-19"
        role: "primary"
      - url: "https://www.heise.de/en/news/PTC-Windchill-BSI-calls-admins-at-night-due-to-critical-security-vulnerability-11338329.html"
        publisher: "Heise Security (EN)"
        date: "2026-06-19"
        role: "corroborating"
      - url: "https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability"
        publisher: "PTC PSIRT"
        date: "2026-06-15"
        role: "vendor-advisory"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12713 (bridge: ncsc-csh recent 10) → pivot: Heise Security EN article URL https://www.heise.de/en/news/PTC-Windchill-BSI-calls-admins-at-night-due-to-critical-security-vulnerability-11338329.html → primary: PTC PSIRT advisory URL https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability"
    summary: |
      CVE-2026-12569 is a critical unauthenticated remote code execution vulnerability in PTC Windchill and FlexPLM arising from unsafe Java deserialization in the web-based login interface. An unauthenticated attacker with network access to the login endpoint can send a crafted serialized payload to achieve arbitrary code execution on the server. CVSS v3.1 base score is 10.0 (Critical); CVSS v4.0 score is 9.3. The BSI notified affected organisations via direct phone calls to system administrators outside business hours, reflecting elevated threat response — the NCSC-CH lists the vulnerability status as "Actively Exploited." Affected on-premises versions include PDMLink 11.2.1.0, 12.0.2.0, 12.1.2.0, 13.0.2.0, and 13.1.0.0 through 13.1.3.0, as well as versions prior to 11.0 M030; PTC released a patch on 2026-06-15 and cloud-hosted instances were auto-patched. Windchill is the dominant PLM platform in DACH aerospace, automotive, and defence-industrial supply chains, making EU public-sector-adjacent organisations a high-priority segment for defenders.
    ch_eu_nexus: "direct — BSI issued emergency outreach; NCSC-CH flagged as actively exploited; high prevalence of Windchill in DACH manufacturing and defence-industrial sector"
    public_sector_nexus: "indirect — defence-industrial base, aerospace, automotive OEMs and their EU public-sector contractors"
    sector: "manufacturing, defence-industrial, engineering"
    cves: [CVE-2026-12569]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The NCSC is warning of a critical vulnerability in PTC Windchill and FlexPLM products. The vulnerability is actively being exploited."
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12713"
      - quote: "BSI calls admins at night due to critical security vulnerability — The BSI is contacting Windchill operators directly outside business hours due to the severity of the issue and active exploitation."
        attribution: "Heise Security (EN)"
        source_url: "https://www.heise.de/en/news/PTC-Windchill-BSI-calls-admins-at-night-due-to-critical-security-vulnerability-11338329.html"
      - quote: "Unauthenticated remote code execution via unsafe deserialization in the Windchill/FlexPLM login interface. CVSS v3.1: 10.0, CVSS v4.0: 9.3. Affected versions: PDMLink 11.2.1.0, 12.0.2.0, 12.1.2.0, 13.0.2.0, 13.1.0.0-13.1.3.0, and pre-11.0 M030. Patch released 2026-06-15."
        attribution: "PTC PSIRT"
        source_url: "https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability"
    extended_notes: |
      Technique class: T1190 Exploit Public-Facing Application (MITRE ATT&CK). Attack surface is the Windchill/FlexPLM web-based login interface accessible over HTTPS; the deserialization sink receives attacker-controlled data prior to authentication. Exploitation prerequisites: unauthenticated network-layer access to the login endpoint (TCP 7001 or HTTPS frontend). No prior foothold required. Detection concept: anomalous inbound connections from unexpected CIDR ranges to Windchill HTTP/HTTPS ports, JVM crash dumps or unexpected child-process spawns from Windchill parent processes, Java deserialization exception events in Windchill server logs. Hardening: apply PTC patch released 2026-06-15; enforce network segmentation so Windchill is not directly internet-exposed (no public-facing login interface); verify cloud instances were auto-patched. This vulnerability is distinct from the earlier CVE-2026-4681 (March 2026) that also affected PTC products.

  - title: "AVer PTC500/PTC115 conference camera series CVE-2026-40624 — unauthenticated RCE via improper input validation, CVSS 9.8, CISA ICS advisory"
    sources:
      - url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-169-01"
        publisher: "CISA ICS"
        date: "2026-06-18"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12720"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-19"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12720 (bridge: ncsc-csh recent 10) → primary: CISA ICS advisory, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-169-01 (bridge: cisa page)"
    summary: |
      CVE-2026-40624 is a critical improper input validation vulnerability in AVer's PTC500S, PTC115, PTC500+, and PTC115+ conference / presentation camera models. An unauthenticated attacker with network access to the camera's web-based management interface can send a crafted request to achieve remote code execution. CVSS v3.1 base score is 9.8 (Critical). CISA published ICS advisory ICSA-26-169-01 on 2026-06-18; NCSC-CH echoed the advisory on 2026-06-19. AVer has released a firmware update addressing the vulnerability. These camera models are widely deployed in government meeting rooms, EU institution boardrooms, and legislative chamber hybrid-meeting setups, making them relevant to EU public-sector attack surface mapping despite the ICS advisory classification. No authentication is required for exploitation; the attack surface is the HTTP management interface on the LAN/VLAN where cameras are placed.
    ch_eu_nexus: "direct — NCSC-CH echoed advisory; AVer PTC-series cameras common in Swiss cantonal government and EU institution meeting infrastructure"
    public_sector_nexus: "direct — government meeting rooms, parliamentary hybrid-meeting setups, EU institution conference systems"
    sector: "government, public-sector"
    cves: [CVE-2026-40624]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CISA issued advisory ICSA-26-169-01 for AVer PTC500S, PTC115, PTC500+, and PTC115+ cameras. Vulnerability: improper input validation (CWE-20) allows unauthenticated remote code execution. CVSS v3.1 score: 9.8."
        attribution: "CISA ICS (ICSA-26-169-01)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-169-01"
      - quote: "NCSC-CH alerts on critical AVer conference camera vulnerability CVE-2026-40624 allowing unauthenticated remote code execution."
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12720"
    extended_notes: |
      Technique class: T1190 Exploit Public-Facing Application (MITRE ATT&CK). Attack surface: HTTP/HTTPS management web interface of the camera (default on a LAN-accessible port). Prerequisites: unauthenticated access to camera management interface — cameras on flat office or meeting-room networks without VLAN isolation are exploitable by any device on the same segment. Detection concept: anomalous outbound connections from camera IP ranges (cameras should not initiate outbound connections to arbitrary destinations); unexpected configuration changes to camera settings; lateral movement attempts from camera IP range. Hardening: apply AVer firmware update immediately; place cameras on isolated VLAN with no internet egress and restricted management-interface access; disable HTTP management interface if HTTPS-only management is supported; inventory all AVer PTC-series units in government facilities. All versions of the four affected models are vulnerable — no version carve-out.

  - title: "Gogs self-hosted Git server batch of 20+ CVEs (BSI WID-SEC-2026-2013) — including CVE-2026-52806 argument injection to RCE, CVSSv4 9.4, fixed in 0.14.3"
    sources:
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2013"
        publisher: "BSI CERT-Bund"
        date: "2026-06-19"
        role: "primary"
      - url: "https://github.com/advisories?query=gogs+2026"
        publisher: "GitHub Security Advisories"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-de, bridge: bsi-rss feed returned WID-SEC-2026-2013 title → bridge: bsi-csaf WID-SEC-2026-2013 returned full CSAF JSON with CVE list → corroborating: GitHub Security Advisories search confirmed CVE-2026-52806 and patch in Gogs 0.14.3 (June 7, 2026)"
    summary: |
      BSI published advisory WID-SEC-2026-2013 on 2026-06-19, consolidating over 20 CVEs in the Gogs self-hosted Git server, rated kritisch (critical). The most severe is CVE-2026-52806 (CVSSv4 9.4), an argument injection vulnerability in Gogs' handling of pull-request branch names: an authenticated user can create a branch name containing `--exec` or similar Git flag-injection strings, which Gogs passes unsanitised to the underlying `git rebase` command, resulting in arbitrary OS command execution on the Gogs server. Because Gogs ships with open self-registration enabled by default and imposes no repository-count limit by default, the authenticated prerequisite is effectively eliminated on default-configured instances exposed to the internet. The batch also includes stored XSS, path traversal, and SSRF vulnerabilities (CVE-2026-52805, CVE-2026-52807 and others). All vulnerabilities are fixed in Gogs 0.14.3, released 2026-06-07. Gogs is popular in EU research institutions, universities, and smaller public-sector IT teams as a lightweight alternative to GitLab/Gitea.
    ch_eu_nexus: "direct — BSI advisory; Gogs widely deployed in EU academic and research network environments as a self-hosted lightweight Git platform"
    public_sector_nexus: "indirect — universities, research institutes, smaller government IT teams self-hosting Gogs"
    sector: "education, research, public-sector IT"
    cves: [CVE-2026-52806, CVE-2026-52805, CVE-2026-52807]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "BSI WID-SEC-2026-2013 (kritisch): Multiple vulnerabilities in Gogs including argument injection (CVE-2026-52806, CVSSv4 9.4) allowing authenticated remote code execution via malicious branch name passed to git rebase --exec. Over 20 CVEs total. Fixed in Gogs 0.14.3."
        attribution: "BSI CERT-Bund (WID-SEC-2026-2013)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2013"
      - quote: "CVE-2026-52806: Argument injection in Gogs pull-request branch handling allows injection of --exec flag into git rebase command, achieving OS command execution. Fixed in Gogs 0.14.3 released 2026-06-07."
        attribution: "GitHub Security Advisories"
        source_url: "https://github.com/advisories?query=gogs+2026"
    extended_notes: |
      Technique class: T1072 Software Deployment Tools / T1190 Exploit Public-Facing Application; T1059 Command and Scripting Interpreter (OS command execution via argument injection, CWE-88). Attack surface: Gogs pull-request creation endpoint and branch-name handling in the merge/rebase code path. Prerequisites: authenticated Gogs account (eliminated on default open-registration instances). The argument injection chain: (1) attacker creates a repository, (2) creates a branch with a name containing `--exec=<command>`, (3) opens a pull request, (4) when an admin or automated process triggers rebase, Gogs executes the injected command as the Gogs process owner. Detection concept: monitor Gogs server process for unexpected child-process spawns from `git` binary with `--exec` arguments; review Gogs audit logs for pull-request creation by newly-registered accounts with unusual branch names; alert on outbound network connections initiated by the Gogs server process to non-Git destinations. Hardening: upgrade to Gogs 0.14.3 immediately; disable open self-registration if not required (`[service] DISABLE_REGISTRATION = true` in app.ini); run Gogs process under a minimal-privilege OS user with no shell; consider migrating to actively-maintained Gitea (Gogs development pace is slower). Note: a May 2026 Rapid7 disclosure stated these CVEs were unpatched — the 0.14.3 patch landed on 2026-06-07, after that disclosure.

  - title: "Splunk CVE-2026-20253 limited targeted exploitation confirmed by Splunk PSIRT — UPDATE (original coverage 2026-06-14)"
    sources:
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0198"
        publisher: "NCSC-NL"
        date: "2026-06-19"
        role: "primary"
      - url: "https://advisory.splunk.com/advisories/SVD-2026-0601"
        publisher: "Splunk PSIRT"
        date: "2026-06-19"
        role: "corroborating"
    discovery_trace: "first seen at: advisories-ncsc-nl, bridge: ncsc-nl recent 10 returned NCSC-2026-0198 updated 2026-06-19 → bridge: ncsc-nl csaf NCSC-2026-0198 returned CSAF JSON with Splunk PSIRT exploitation note → corroborating: Splunk advisory SVD-2026-0601 confirmed limited targeted exploitation"
    summary: |
      NCSC-NL advisory NCSC-2026-0198 was updated on 2026-06-19 to reflect Splunk PSIRT's confirmation that CVE-2026-20253 (Splunk Enterprise Remote Code Execution via search job serialization, CVSS 8.8) is under limited targeted exploitation in the wild. The original vulnerability was first reported on 2026-06-14 and was previously covered. The in-window delta is the shift from "publicly disclosed / no known exploitation" to "limited targeted exploitation confirmed." Splunk Enterprise versions 9.x prior to 9.4.2 and Splunk Cloud Platform versions prior to 9.4.1300 are affected. The patch has been available since 2026-06-14; the exploitation confirmation raises urgency for organisations that have not yet applied the update.
    ch_eu_nexus: "direct — NCSC-NL advisory update; Splunk is standard SIEM platform in Swiss and EU public-sector SOC environments"
    public_sector_nexus: "direct — Splunk is standard SIEM in CH and EU public-sector SOC environments"
    sector: "government, finance, telco"
    cves: [CVE-2026-20253]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-14"
    evidence:
      - quote: "NCSC-NL NCSC-2026-0198 updated 2026-06-19: Splunk has confirmed limited targeted exploitation of CVE-2026-20253 in the wild. Previous risk rating has been revised upward."
        attribution: "NCSC-NL (NCSC-2026-0198)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0198"
      - quote: "Splunk PSIRT confirms limited targeted exploitation of SVD-2026-0601 / CVE-2026-20253. Customers who have not yet applied the June 14 patch should do so immediately."
        attribution: "Splunk PSIRT"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0601"
    extended_notes: |
      Patch urgency upgrade: was medium-urgency patching cycle, now emergency-patch priority given confirmed targeted exploitation. Detection: Splunk search head anomalous search job submissions, specifically serialized search job payloads from non-administrative accounts or unexpected source IPs; Splunk internal audit log event type=search for unusual dispatch paths. Hardening: patch to Splunk Enterprise 9.4.2+ or Splunk Cloud Platform 9.4.1300+ immediately; restrict search job submission to authorized analyst accounts only; verify Splunk indexer / search head network segmentation.

