    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The exploit targets a hardware vulnerability in Apple's DWC2 USB controller. The bug involves improper DMA buffer management"
        attribution: "Paradigm Shift Technology"
        source_url: "https://ps.tc/pages/blog-usbliter8.html"
      - quote: "An attacker with physical device access, DFU mode capability, and a custom microcontroller board can achieve execution within two seconds"
        attribution: "The Hacker News"
