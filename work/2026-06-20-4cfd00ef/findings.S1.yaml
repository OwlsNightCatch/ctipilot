  - title: "Sapphire Sleet (DPRK/BlueNoroff) poisons 142 @mastra npm packages via dormant maintainer account — postinstall payload hits developer CI/CD"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/"
