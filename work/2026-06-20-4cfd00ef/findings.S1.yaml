    summary: |
      A four-nation law enforcement action (Netherlands NHCTU, Canada RCMP, US FBI, Germany BKA, coordinated by Europol/Eurojust) on 18 June 2026 dismantled the SocGholish initial-access infrastructure as part of Operation Endgame — the second such coordinated action under that name following the 2024 malware-loader takedown. SocGholish (tracked as TA569, GOLD PRELUDE, Mustard Tempest, UNC1543; operated by Evil Corp affiliate infrastructure) works by injecting a fake browser-update JavaScript lure into compromised WordPress sites; the Gholoader second-stage then profiles victims and gates delivery of follow-on ransomware payloads (LockBit, WastedLocker, RansomHub affiliates). The operation took down 106 servers and domains and actively cleaned 14,971 compromised WordPress installations. Shadowserver's special report counted 1,441,695 instances of compromised WordPress across 1.1 million domains and 271,176 IP addresses active from May 2023 to May 2026. Defenders hunting for SocGholish residuals should look for inbound JavaScript injection into legitimate site's wp-includes/js/ paths, browser-update themed file names (browser_update.js, update_b.js), and cross-origin requests to the characteristic TDS-gated redirection chains. Network-level detection: DNS requests to actor-controlled domains registered as subdomains of legitimate domains (domain shadowing), TA2726 TDS pattern.
    ch_eu_nexus: "European sites among the 1.4M compromised; Dutch NHCTU led the action; EU-adjacent crime group (Evil Corp, sanctioned UK/US/AU)."
    public_sector_nexus: "indirect — WordPress sites hosted by public institutions are potential delivery vectors; direct victims include corporate and enterprise endpoints"
