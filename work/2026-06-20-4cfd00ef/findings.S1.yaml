    discovery_trace: "first seen at: THN RSS feed (The Gentlemen RaaS Uses GentleKiller EDR Framework Targeting 400 Security Processes, 2026-06-19/20) → primary: ESET WeLiveSecurity https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/ → corroborating: Help Net Security https://www.helpnetsecurity.com/2026/06/18/eset-gentlemen-edr-killers/"
    summary: |
      ESET published on 18 June 2026 a deep analysis of GentleKiller, the in-house EDR-killer framework maintained by Gentlemen RaaS (Microsoft tracks the ransomware operators as Storm-2697). The framework has eight documented variants, each exploiting a different BYOVD (Bring Your Own Vulnerable Driver) kernel-level driver: the named drivers include eb.sys (rootkit), nseckrnl.sys (NSecsoft), GameDriverX64.sys (anti-cheat game driver), stpm drivers (Safetica ProcessMonitor), dmx.sys (Zemana WatchDog), 360netmon_wfp.sys (Qihoo 360), and IMFForceDelete (IObit). GentleKiller collectively targets 400 processes across 48 security vendors (Acronis, AlienVault, Avast, Bitdefender, Carbon Black, CrowdStrike, ESET, Kaspersky, SentinelOne, Sophos, Trend Micro, and others). The group rapidly operationalizes newly published BYOVD PoCs — often within days of public release — and supplements the in-house suite with third-party killers (HexKiller, ThrottleBlood, HavocKiller) plus OxideHarvest, a Rust-based credential stealer targeting major browsers. The group has claimed 478 victims across 70+ countries. Detection focus: monitor for unusual driver loads (Sysmon Event ID 6 — driver loaded) against a deny-list of vulnerable driver hashes; alert on `NtLoadDriver` calls from non-system parent processes; hunt for process-termination events (Sysmon EID 5) targeting av/edr processes in rapid succession, particularly in the seconds before ransomware encryptor execution.
    ch_eu_nexus: "European victims confirmed; the group operates a RaaS model with global affiliates."
