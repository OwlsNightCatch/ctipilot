        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/cisa-warns-fortinet-users-to-secure-devices-after-fortibleed-leak/"
        publisher: "BleepingComputer"
        date: "2026-06-19"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews THN RSS feed (CISA Warns Fortinet Customers as FortiBleed Hits 86,644 FortiGate Devices headline, 2026-06-19) → primary: SecurityWeek detailed analysis URL https://www.securityweek.com/fortibleed-86000-fortinet-device-credentials-compromised/ → corroborating: CISA alert https://www.cisa.gov/news-events/alerts/2026/06/18/cisa-urges-hardening-fortinet-devices-after-reports-credential-exposure"
    summary: |
      CISA published an emergency hardening advisory on 18 June 2026, and SecurityWeek confirmed on 19 June that the FortiBleed campaign has now compromised credentials from 86,644 internet-accessible FortiGate devices across 194 countries — up from the 73,932 figure covered on 2026-06-18. The attack methodology involves a Russian-speaking threat actor cracking SSL VPN password hashes with a 45-GPU Hashtopolis cluster (approximately 1.16 billion credential attempts against 320,000+ FortiGate targets, plus 2.1 billion brute-force attempts against 160,000+ MSSQL servers). Post-compromise, actors pivot into internal Active Directory environments using harvested service and admin accounts; generic admin and built-in Fortinet system accounts collectively represent 63.3% of compromised credentials. CISA's advisory mandates immediate session termination, full password resets, enforcement of the PBKDF2 algorithm for admin-credential hashing (replacing the older MD5-crypt scheme), and phishing-resistant MFA across all remote access points. Defenders should search web and auth logs for the attacker's characteristic SSL VPN probing pattern — sequential authentication failures against multiple accounts in short succession from rotating residential IP blocks, followed by a short success event — and compare SSL VPN session logs against the Shadowserver notification feed that identifies affected IPs.
    ch_eu_nexus: "Global campaign; ~190 countries affected. European public-sector organizations with internet-exposed FortiGate appliances directly in scope."
    public_sector_nexus: "direct — government and public-sector networks use FortiGate as primary perimeter VPN"
    sector: "government, telco, energy, financial"
