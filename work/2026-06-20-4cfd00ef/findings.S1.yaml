    extended_notes: |
      Prior coverage: 2026-06-18 brief covered this as a newly emerging campaign at 73,932 devices. The delta here is CISA formalising guidance plus the credential-cracking methodology now confirmed. Hunter note: hunt for FortiGate authentication events (Fortinet log type auth, subtype vpn, action tunnel-stats/tunnel-up) followed by internal RDP/SMB/LDAP recon within the same source NAT range.

