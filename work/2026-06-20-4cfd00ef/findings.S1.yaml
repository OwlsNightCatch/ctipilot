  - title: "AutoJack: Microsoft Research demonstrates MCP WebSocket → localhost trust bypass → OS command injection chain in AutoGen Studio dev builds"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/18/autojack-single-page-rce-host-running-ai-agent/"
        publisher: "Microsoft Security Blog"
        date: "2026-06-18"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/autojack-attack-lets-one-web-page.html"
        publisher: "The Hacker News"
        date: "2026-06-19"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed (AutoJack Attack Lets One Web Page Hijack AI Agent for Host Code Execution, 2026-06-19) → primary: Microsoft Security Blog https://www.microsoft.com/en-us/security/blog/2026/06/18/autojack-single-page-rce-host-running-ai-agent/"
    summary: |
      Microsoft Security researchers published AutoJack on 18 June 2026, an exploit chain against AutoGen Studio's Model Context Protocol (MCP) WebSocket surface that was never shipped in a stable PyPI release but demonstrates a structural vulnerability class relevant to all agentic AI framework developers. Three weaknesses chain together: (1) the localhost origin allowlist accepts connections from local browsing agents rendering attacker-controlled web content (CWE-1385, Missing Origin Validation); (2) authentication middleware explicitly exempts all `/api/mcp/*` paths (CWE-306, Missing Authentication for Critical Function); (3) the MCP WebSocket handler accepts `server_params` as a URL query-parameter, base64-decodes it, and passes the decoded `StdioServerParams` directly to OS process execution (CWE-78, OS Command Injection). An attacker page JavaScript opens `ws://localhost:8081/api/mcp/ws/?server_params=<b64_payload>` to spawn arbitrary processes under the developer's account. The fix (commit b047730, pre-PyPI-release) implements server-side parameter binding: a POST /api/mcp/ws/connect route stores parameters keyed by UUID, eliminating URL-borne injection. The vulnerability was present only in AutoGen Studio pre-release dev builds 0.4.3.dev1 and 0.4.3.dev2 on PyPI; the stable 0.4.2.2 is unaffected. Microsoft confirmed no exploitation in the wild. The research methodology applies to any local MCP WebSocket server: developers building MCP-based agentic tools should ensure MCP WebSocket servers validate Origin headers, require authentication on all paths, and do not accept executable parameters via URL query strings. MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1059.001 (PowerShell), T1059.004 (Unix Shell).
    ch_eu_nexus: "Global — affects developers building with AutoGen Studio or analogous MCP-based AI agent frameworks in any environment."
    public_sector_nexus: "indirect — public-sector digitisation teams evaluating or deploying AI agent frameworks"
    sector: "technology, financial services"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
