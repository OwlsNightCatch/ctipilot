  - title: "usbliter8 — unpatchable hardware exploit for Apple A12/A13 SecureROM; PoC published, affects iPhone XS through 11 series"
    sources:
      - url: "https://ps.tc/pages/blog-usbliter8.html"
        publisher: "Paradigm Shift Technology"
        date: "2026-06-18"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/unpatchable-usbliter8-exploit-breaks.html"
        publisher: "The Hacker News"
        date: "2026-06-19"
        role: "corroborating"
      - url: "https://appleinsider.com/articles/26/06/18/a12-a13-apple-devices-face-an-unpatchable-securerom-vulnerability"
        publisher: "Apple Insider"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed (Unpatchable 'usbliter8' Exploit Breaks Apple A12 and A13 SecureROM Boot Chain, 2026-06-20) → primary: Paradigm Shift technical write-up https://ps.tc/pages/blog-usbliter8.html → corroborating: Apple Insider https://appleinsider.com/articles/26/06/18/a12-a13-apple-devices-face-an-unpatchable-securerom-vulnerability"
    summary: |
      Paradigm Shift Technology disclosed on 18 June 2026 a permanent hardware-level boot-chain exploit dubbed usbliter8, analogous to the 2019 checkm8 exploit for A5–A11 chips. The root cause is improper DMA buffer management in Apple's Synopsys DWC2 USB controller: when a fourth consecutive Setup packet is received, the controller resets the DMA address by decrementing it by 24 bytes but continues to increment it by packet size after each write, creating a buffer underflow primitive in 12-byte steps. Because the flaw is in mask-ROM (immutable silicon firmware), no software update can remediate it. Exploitation requires physical device access with the device in DFU mode, USB connectivity, and a dedicated RP2350-based microcontroller board; the full chain completes in under two seconds. Affected SoCs: Apple A12, A13, S4, S5. Affected devices: iPhone XS/XS Max/XR, iPhone 11/11 Pro/11 Pro Max, iPhone SE (2nd gen), iPad Pro 11" (1st-2nd gen), iPad Pro 12.9" (3rd-4th gen), iPad Air 3rd gen, iPad mini 5th gen, iPad 8th-9th gen, Apple Watch SE (1st gen)/Series 4/Series 5, HomePod mini, Apple TV 4K (2nd gen). Post-exploitation capabilities include booting unsigned iBoot images, bypassing Apple's secure boot chain, and achieving code execution before iOS loads. A14+ chips are unaffected (DART correctly configured). For enterprise defenders: this is a physical-access risk, not a network threat. Key mitigations are physical device security policies, managed MDM enrollment with supervised mode (which detects unmanaged DFU-mode connections), and retiring affected hardware from high-security environments where physical control cannot be guaranteed.
    ch_eu_nexus: "Global; iOS devices widely used in Swiss federal and cantonal government, BYOD environments."
    public_sector_nexus: "indirect — government employees using older iPhones/iPads are at risk in physical-access scenarios"
    sector: "government, financial services, critical infrastructure"
    cves: []
    actors_campaigns_malware: []
