    novelty: new
    evidence:
      - quote: "CWE-1385 (Missing Origin Validation), CWE-306 (Missing Authentication), and CWE-78 (OS Command Injection)"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/18/autojack-single-page-rce-host-running-ai-agent/"
      - quote: "the endpoint accepts server_params URL query parameters that are base64-decoded and executed as arbitrary OS commands via StdioServerParams"
        attribution: "Microsoft Security Blog"
