        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog bridge fetch threat-intelligence feed (From package to postinstall payload: Inside the Mastra npm supply chain compromise by Sapphire Sleet, 2026-06-17) → primary: Microsoft Security Blog https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/ → corroborating: Snyk https://snyk.io/blog/a-forgotten-contributor-account-compromised-the-entire-mastra-npm-package-scope/"
    summary: |
      Microsoft Threat Intelligence attributes, with high confidence, to Sapphire Sleet (BlueNoroff, DPRK-nexus) a supply chain attack that ran an 88-minute automated campaign on 17 June 2026 (01:12–02:39 UTC). The attacker leveraged a dormant npm maintainer credential (`ehindero` account) to republish 142 packages across the `@mastra` scope, injecting `easy-day-js@1.11.22` — a typosquat of the legitimate `dayjs` library — as a dependency. The malicious `postinstall` hook (`setup.cjs`, 4,572 bytes) ran automatically on `npm install`, disabled TLS verification, wrote beacon markers to temp directories, fetched a second-stage payload from attacker C2, and established persistence via LaunchAgents (macOS), systemd services (Linux), or PowerShell staging (Windows). The payload is a cross-platform RAT plus cryptocurrency wallet stealer targeting Chrome, Brave, Edge, MetaMask, Phantom, Solflare, Coinbase Wallet, OKX, and Keplr. MITRE ATT&CK: T1195.002 (Compromise Software Supply Chain), T1547 (Boot/Logon Autostart Execution), T1140 (Deobfuscate/Decode), T1055 (Process Injection). Defenders: check `package-lock.json` for `easy-day-js` entries; scan for `setup.cjs` execution artifacts in temp directories; search EDR telemetry for npm/node parent-process spawning unexpected network connections. Any CI/CD runner or developer workstation that ran `npm install` against @mastra/* after 16 June 2026 should be treated as potentially compromised.
    ch_eu_nexus: "Global; affects any developer or CI/CD pipeline running @mastra npm packages. European enterprises using AI agent frameworks (Mastra targets LLM/agentic developers) directly in scope."
