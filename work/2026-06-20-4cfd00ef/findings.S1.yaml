  - title: "UPDATE: FortiBleed campaign now 86,644 devices — CISA emergency advisory confirms SSL VPN credential cracking into Active Directory"
    sources:
      - url: "https://www.securityweek.com/fortibleed-86000-fortinet-device-credentials-compromised/"
        publisher: "SecurityWeek"
