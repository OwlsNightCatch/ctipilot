    summary: |
      The BSI published a critical-rated advisory (WID-SEC-2026-2013) on 19 June 2026 covering 28 CVEs in Gogs, the self-hosted Git server software popular in European SMEs and research institutions as a lightweight Gitea/GitHub alternative. The CVEs span multiple classes: privilege escalation (including CVE-2026-52808, CVSS 7.1, CWE-863/CWE-269 — write-level collaborators modifying admin-only repository settings via three incorrectly authorized API endpoints: PATCH /issue-tracker, PATCH /wiki, POST /mirror-sync), information disclosure, XSS, CSRF, and code execution chains. The patched version is 0.14.3. Older CVEs such as CVE-2022-1285, CVE-2024-39930, CVE-2024-39932, and CVE-2024-39933 are included in the batch, indicating this is a mass-patch release. All CVE GitHub advisories are dated 18–19 June 2026. Organizations running Gogs on-premises should update to 0.14.3 immediately; prior research (2024) found ~1,141 internet-facing Gogs instances — a small but significant footprint in research, government, and SME environments. Hunt signal: Gogs authentication logs for unexpected admin-level API calls from write-access accounts; web server access logs for anomalous PATCH/POST requests to /issue-tracker or /mirror-sync endpoints.
    ch_eu_nexus: "EU/CH research institutions and SMEs running self-hosted Gogs in scope. BSI advisory underscores German national concern."
