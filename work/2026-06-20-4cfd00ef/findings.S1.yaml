    summary: |
      CVE-2026-12569 (CVSS 3.1 10.0 Critical, CVSS 4.0 9.3) is an unsafe deserialization flaw (CWE-20) in PTC's Windchill PDMlink and FlexPLM product lifecycle management suite. The vulnerable component is a network-accessible deserialisation endpoint reachable without prior authentication — network access to the web-based Windchill or FlexPLM login interface is the only prerequisite. Patches for versions 12.1.2 and 12.0.2 were released on 15 June 2026; affected versions span 11.0 M030 through 13.1.3.0. The BSI (German Federal Office for Information Security) took the unusual step of calling administrators directly via telephone in the evening hours to accelerate patching. Active exploitation is confirmed: backdoors are being deployed on vulnerable systems. The NCSC-CH Security Hub published a dedicated advisory on 19 June 2026, designating exploitation status as "Actively Exploited." PTC Windchill is widely deployed in European manufacturing, aerospace, defence, and automotive PLM environments. Defenders should immediately block external perimeter network access to Windchill login endpoints and apply the patch; for detection, look for anomalous Java deserialization errors in Windchill application logs, unexpected child process spawns from the Windchill JBoss/WildFly application server process, and suspicious outbound connections from PLM servers.
