items:
  - title: "Nintendo confirms employee data stolen from TinyPulse (WebMD subsidiary) via Shadowbyt3$ extortion attack"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/nintendo-confirms-data-stolen-in-webmd-subsidiary-cyberattack/"
        publisher: "BleepingComputer"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.technadu.com/nintendo-confirms-tinypulse-data-stolen-in-shadowbyt3-extortion-attack/629628/"
        publisher: "TechNadu"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer (news corroboration), URL https://www.bleepingcomputer.com/news/security/nintendo-confirms-data-stolen-in-webmd-subsidiary-cyberattack/ (datePublished 2026-06-18T18:31Z UTC) → corroborating: TechNadu URL https://www.technadu.com/nintendo-confirms-tinypulse-data-stolen-in-shadowbyt3-extortion-attack/629628/"
    summary: |
      Nintendo of America confirmed that the extortion group Shadowbyt3$ stole 859 MB of employee data
      from TinyPulse — an HR engagement / pulse-survey SaaS platform owned by WebMD Health Services, a
      subsidiary of WebMD Health Corp — not from Nintendo's own systems. The attack vector was a
      precision compromise of the third-party cloud environment rather than Nintendo's perimeter;
      HudsonRock data cited in analysis identified compromised employee credentials (115 employee
      accounts, 32 third-party credential sets) as a contributing factor, consistent with infostealer
      sourcing or credential stuffing against TinyPulse's SaaS tenant. The exfiltrated dataset (2016–
      early 2026) includes employee names, email addresses, W-9 tax forms, bank statement PDFs, HR
      analytics, and workplace-feedback records. Shadowbyt3$ demanded $2 million from Nintendo on 12
      June with a 48-hour deadline; when Nintendo refused, the group redirected extortion to TinyPulse
      directly (new deadline 16 June), then began releasing data samples. Nintendo's public statement
      characterised the exposure as "internal survey content comprising a small subset of our employees"
      — substantially narrower than the attacker's claims. Lesson for defenders: HR/engagement SaaS
      tenants that aggregate employee PII including financial documents (W-9, bank data) are high-value
      targets and are routinely overlooked in third-party risk assessments. Vendors of this class
      typically hold personal and financial data beyond what their primary use-case implies.
    ch_eu_nexus: "indirect (Nintendo of America entity; pattern relevant to any organization using HR/survey SaaS platforms globally including EU/CH deployments)"
    public_sector_nexus: "pattern"
    sector: "technology, HR-SaaS supply chain"
    cves: []
    actors_campaigns_malware: ["Shadowbyt3$", "SHADOWBYT3$"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Nintendo of America has confirmed to BleepingComputer that threat actors stole survey data from the third-party TinyPulse service used internally, but its systems were not compromised"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/nintendo-confirms-data-stolen-in-webmd-subsidiary-cyberattack/"
      - quote: "TinyPulse is an employee engagement and feedback platform owned by WebMD Health Services, a subsidiary of WebMD Health Corp"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/nintendo-confirms-data-stolen-in-webmd-subsidiary-cyberattack/"
    extended_notes: |
      Defender detection angle: monitor for large-volume data exports from HR/survey SaaS audit logs.
      SaaS platforms serving HR functions (TinyPulse, Glint, Culture Amp, Leapsome, Qualtrics) often
      store financial onboarding documents beyond survey content. Enforce DLP classification on uploads
      to these platforms and audit what data types are stored by SaaS tenants in their own cloud storage.
      Credential hygiene for single-sign-on integrations to HR SaaS is critical — if the SaaS tenant
      uses separate credential store from your IdP, that is a lateral-movement path from a
      compromised employee credential to the full dataset stored by the vendor.

  - title: "Kodak confirms data breach after ShinyHunters claims 2.2M records; June 18 extortion deadline passed without confirmed publication"
    sources:
      - url: "https://www.securityweek.com/kodak-admits-data-breach-after-shinyhunters-hack-claims/"
        publisher: "SecurityWeek"
        date: "2026-06-18"
