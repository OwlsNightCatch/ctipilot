        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/kodak-confirms-data-breach-claimed-by-shinyhunters-extortion-gang/"
      - quote: "ShinyHunters has also claimed attacks against hundreds of Salesforce customers over the past year, saying they've stolen over 1.5 billion records in Salesforce Aura and Salesloft Drift campaigns"
        attribution: "Malwarebytes"
        source_url: "https://www.malwarebytes.com/blog/news/2026/06/kodak-confirms-breach-as-shinyhunters-leak-threat-reaches-deadline"
    extended_notes: |
      Dark-web-listing framing: Kodak was listed by ShinyHunters; Kodak confirmed access to "limited
      amount" of company data, not independently verified the 2.2 million record figure. The gap
      between ShinyHunters' claim and Kodak's statement is typical of this group's pre-deadline
      posture. Operational lesson: ShinyHunters' broader 2026 campaign exploits enterprise platform
      misconfigurations — Salesforce Experience Cloud guest-user API access (unauthenticated reads of
      customer tables), Oracle PeopleSoft HTTP handler CVE-2026-35273, and Snowflake SSO credential
      stuffing. Detection: audit Salesforce Experience Cloud for `IsGuestEnabled=true` profiles with
      Object-level access to sensitive tables; monitor Salesforce API call logs for high-volume SOQL
      queries from guest sessions; enforce IP restriction on Salesforce orgs.

