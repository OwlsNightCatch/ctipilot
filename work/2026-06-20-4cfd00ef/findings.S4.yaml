        publisher: "Malwarebytes"
        date: "2026-06-18"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/kodak-confirms-data-breach-claimed-by-shinyhunters-extortion-gang/"
        publisher: "BleepingComputer"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Kodak ShinyHunters breach update June 18 19 20 2026') → primary: SecurityWeek URL https://www.securityweek.com/kodak-admits-data-breach-after-shinyhunters-hack-claims/ (datePublished 2026-06-18T07:18Z UTC) → corroborating: Malwarebytes URL https://www.malwarebytes.com/blog/news/2026/06/kodak-confirms-breach-as-shinyhunters-leak-threat-reaches-deadline → corroborating: BleepingComputer URL https://www.bleepingcomputer.com/news/security/kodak-confirms-data-breach-claimed-by-shinyhunters-extortion-gang/"
    summary: |
      Eastman Kodak acknowledged a security incident on 17 June 2026 after ShinyHunters (UNC6395 /
      The Com affiliate) listed it on their dark-web leak site on 15 June claiming 2.2 million records
      of customer PII and internal corporate data. ShinyHunters set a June 18 deadline for Kodak to
      make contact before "leaking along with several annoying (digital) problems." As of June 20,
      ShinyHunters had not published data samples or the full dataset, consistent with the group's
      historical pattern of withholding proof to maximise leverage before a deadline. Kodak's statement
      confirmed "an unauthorized third party illegally gained access to a limited amount of company
      data," an active investigation with external cybersecurity experts and law enforcement, and no
      systemic threat to operations. The access vector was not disclosed; ShinyHunters' 2026 campaign
      has leveraged misconfigured Salesforce Aura/Experience Cloud portals, Oracle PeopleSoft zero-
      days (CVE-2026-35273), Snowflake credential stuffing, and Salesloft Drift API tokens across
      more than 100 victims in a documented enterprise-platform campaign. Swiss/EU defenders running
      any of these platforms should treat ShinyHunters' claimed 1.5 billion–record Salesforce Aura
      corpus as an active exposure surface.
    ch_eu_nexus: "global; ShinyHunters' ongoing enterprise-platform campaign (Salesforce Aura, Oracle PeopleSoft) has confirmed EU victims including Council of Europe (covered 2026-06-16)"
    public_sector_nexus: "indirect (ShinyHunters' 2026 campaign has hit public-sector ERP and CRM platforms)"
    sector: "technology/manufacturing; broader campaign targets all sectors"
    cves: []
