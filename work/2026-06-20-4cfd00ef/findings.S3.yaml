  - title: "NCSC UK CEO: hostile states account for 75% of 200+ UK critical infrastructure incidents; AI to weaponise legacy-tech vulns at scale by 2028"
    sources:
      - url: "https://www.ncsc.gov.uk/news/ncsc-ceo-hostile-states-linked-to-three-quarters-of-cyber-attacks"
        publisher: "UK NCSC"
        date: "2026-06-17"
        role: "primary"
      - url: "https://therecord.media/britain-nation-state-cyberattacks-richard-horne-rusi"
        publisher: "The Record"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: therecord feed, URL https://therecord.media/britain-nation-state-cyberattacks-richard-horne-rusi → primary: UK NCSC official news page, URL https://www.ncsc.gov.uk/news/ncsc-ceo-hostile-states-linked-to-three-quarters-of-cyber-attacks"
    summary: |
      UK NCSC CEO Richard Horne, speaking at the RUSI Annual Security Lecture on 2026-06-17,
      disclosed that approximately 75% of the 200+ cyber incidents affecting UK critical
      national infrastructure in the year to May 2026 are assessed as state-linked, with Russia,
      China, and Iran identified as the primary hostile actors. Horne described cyberspace as an
      active contest rather than a risk domain, citing adversary "prepositioning" across
      essential service networks — language directly echoing the Volt Typhoon pattern in US
      infrastructure. The NCSC assessed with high confidence that by 2028 AI-enabled attack
      capabilities will be used to exploit known vulnerabilities in legacy technology at scale
      across critical national infrastructure. Three defensive priorities highlighted: threat
      exposure understanding, security fundamentals implementation, and operational resilience.
      The UK Cyber Security and Resilience Bill and National Cyber Action Plan (due early July
      2026) are the legislative backdrop. While UK-specific in framing, the assessment is
      operationally relevant to Swiss/EU infrastructure defenders who share threat actors and
      face the same legacy-technology exposure pattern. MITRE ATT&CK relevance: T1195 (Supply
      Chain), T1190 (Exploit Public-Facing Application), T1564/T1071 (Living-off-the-land
      persistence patterns associated with PRC prepositioning). Defender takeaway: the 2028
      AI-exploitation forecast is an operational planning horizon — legacy OT/ICS SCADA systems
      with known unpatched CVEs face elevated risk from AI-accelerated mass-exploitation tooling.
    ch_eu_nexus: "directly relevant — UK shares threat actors with CH/EU; NCSC-CH tracks same PRC/RU prepositioning patterns; findings inform Swiss CNI risk posture"
    public_sector_nexus: "direct — critical infrastructure, public administration"
    sector: "cross-sector, critical infrastructure, energy, water, telecoms"
