        publisher: "The Hacker News"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (THN, 2026-06-18), URL https://thehackernews.com/2026/06/inc-ransomware-claims-830-victims-since.html → pivot to primary: Acronis TRU, URL https://www.acronis.com/en/tru/posts/from-emerging-threat-to-top-tier-ransomware-as-a-service-the-evolution-of-inc-ransomware/"
    summary: |
      Acronis Threat Research Unit published a comprehensive INC ransomware-as-a-service
      evolution report on 2026-06-17, documenting the group's growth from August 2023 to
      2026 (830+ victims) and its post-LockBit/BlackCat affiliate migration. Key TTPs: initial
      access via edge-device exploitation (Citrix NetScaler CVE-2023-3519, CVE-2025-5777;
      Fortinet EMS CVE-2023-48788; SimpleHelp CVE-2024-57727), credential access via updated
      Veeam backup credential dumpers, BYOVD defense evasion using custom drivers
      filwfp.sys / filnk.sys / fildds.sys to disable security products, lateral movement via
      PsExec and living-off-the-land binaries, C2 via Cobalt Strike and legitimate RMM tools
      (AnyDesk, ScreenConnect, TeamViewer), and data exfiltration via Rclone before encryption.
      Encryptors rebuilt in Rust support multithreading and partial-file encryption with ESXi
      targeting. Primary victims are US organizations (65%+) across legal, manufacturing,
      construction, technology, and healthcare; top-2 countries targeted include Australia.
      MITRE ATT&CK: T1190 (edge device exploitation), T1003 (credential dumping from Veeam),
      T1068 (BYOVD via custom driver stack), T1486 (ransomware), T1537 (data exfiltration).
      Detection: alert on loading of unsigned or unknown kernel drivers (filwfp.sys, filnk.sys,
      fildds.sys); monitor Veeam APIs and database paths for credential extraction patterns;
      hunt for Rclone usage with cloud storage destinations. Hardening: patch CVE-2023-3519,
      CVE-2025-5777, CVE-2023-48788, CVE-2024-57727 on internet-facing edge devices; restrict
      Veeam API access; deploy Windows Driver Block List for known-vulnerable drivers.
    ch_eu_nexus: "global; INC has EU victims; the BYOVD driver set (filwfp/filnk) is a direct evasion threat to Swiss/EU EDR deployments"
    public_sector_nexus: "indirect — public-sector legal, IT, and healthcare organisations in scope"
    sector: "cross-sector, legal, manufacturing, healthcare"
