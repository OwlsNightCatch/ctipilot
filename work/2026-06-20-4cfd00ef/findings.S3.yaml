    summary: |
      Mackay Sugar (Australia's second-largest sugar producer) confirmed on 2026-06-18 that an
      external party accessed parts of its IT environment on approximately 2026-06-10, halting
      harvesting and milling operations at two of its three mills. The Gentlemen ransomware
      group claimed responsibility on its dark web leak site, threatening data publication.
      This is the most operationally impactful OT-adjacent Gentlemen incident reported in-window;
      Gentlemen (Storm-2697) has emerged as 2026's second-most-active RaaS by victim count
      (240+ victims through June 2026), operating a 90%-affiliate model with the GentleKiller
      EDR-kill framework previously documented by ESET. Separately, KrebsOnSecurity (2026-06-10)
      and Check Point (research.checkpoint.com/2026/thus-spoke-the-gentlemen/) published
      OSINT attribution identifying the administrator as Alexander Andreevich Yapaev (aliases:
      Hastalamuerte, Zeta88), a 36-year-old from Izhevsk, Russia. Attribution evidence: cross-
      matched ProtonMail addresses, Telegram IDs, GitHub handles, and phone numbers from
      Russian data-breach corpora across BreachForums, RaidForums, Exploit, and Nulled.
      Operational AI use confirmed: admin uses AI tools to develop ransomware tooling and assist
      post-exploitation. Note: the ESET EDR-killer framework write-up was covered in the
      2026-06-19 brief (key: item:eset-the-gentlemen-raas-gang) — this is a fresh incident and
      attribution development, not a repeat.
