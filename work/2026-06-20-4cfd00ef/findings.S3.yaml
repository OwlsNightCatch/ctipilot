  - title: "'Popa' Android TV-box botnet linked to publicly-traded Israeli proxy firm Alarum Technologies (NetNut) — 1.5-2.5M nodes, running four years"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/"
        publisher: "KrebsOnSecurity"
        date: "2026-06-18"
        role: "primary"
      - url: "https://www.qurium.org/forensics/finding-popa/"
        publisher: "Qurium (independent forensics)"
        date: "2026-06-18"
        role: "corroborating"
    discovery_trace: "first seen at: krebs feed, URL https://krebsonsecurity.com/2026/06/popa-botnet-linked-to-publicly-traded-israeli-firm/ → primary (no pivot needed); Qurium forensics report surfaced as outbound link from the Krebs article"
    summary: |
      KrebsOnSecurity and independent researchers from Qurium and Synthient documented the Popa
      botnet — an Android-based malware running on consumer TV boxes that has maintained
      1.5–2.5 million distinct IP addresses daily across 250–300 control servers for four years,
      relaying traffic linked to advertising fraud, account takeovers, and AI training data
      scraping. Multiple independent security firms (XLAB, Qurium, Synthient, Nokia Deepfield,
      Include Security, Spur) attributed Popa's outbound traffic to infrastructure operated by
      NetNut, the "residential proxy" business unit of Alarum Technologies Ltd (NASDAQ: ALAR,
      Tel Aviv). The technical linkage runs through an SDK named Popa originally written by
      Moishi Kramer (currently NetNut VP of R&D), who claims he lost control of the SDK after
      licensing it years ago. Alarum Technologies rejected the characterisation as "a botnet",
      asserting flawed deductions. The investigation surfaces a recurring commercial grey-zone
      pattern: SDK monetisation embedding proxy-relay functionality without adequate user
      consent, repurposed as botnet infrastructure. Affected device categories include
      third-party Android TV boxes (CRICFy, DooFlix, X96 Mini Box, etc.) as well as LG webOS,
      Samsung Tizen and Roku devices. Detection: Popa nodes open encrypted relay tunnels and
      average traffic to ~300 C2 IPs; hunt for unexpected outbound CONNECT/tunnel traffic from
      media-device classes on enterprise/campus networks. Hardening: block media device access
      to corporate internet by default; audit Android TV boxes on guest/IoT VLANs for proxy
      relay behaviour.
