    kind: cited
    text: "A \"Download Reference\" button opens a new tab on an attacker domain that fingerprints the visitor (operating system, browser, automation indicators, cloud-provider cookies), reports victims to a Telegram bot and redirects visitors who fail its checks; after a delay a script clicks a hidden download link for a ScreenConnect installer ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: 714709b255
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "The installer deploys a first rogue ScreenConnect client, which establishes a second one pointed at different infrastructure ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
