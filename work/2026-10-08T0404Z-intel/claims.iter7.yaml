    surface: "body"
    kind: cited
    text: "CVE-2026-83549 (CVSS 3.0 7.8) is a post-authentication OS command injection in the Appliance Management Console (AMC), letting an attacker who already holds administrative access execute arbitrary operating-system commands ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016"]
