    kind: derived
    text: "Upgrading does not undo a read of the Crowd credential, so Crowd's own audit records of new users and changed group memberships are the post-patch check for Jira instances integrated with Crowd."
  - claim_id: 15bb610e8e
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every Jira instance integrated with Crowd and review Crowd for accounts created since the exposure began, because the flaw's mechanics are public, exploitation attempts have been observed since 2026-10-06 and Atlassian cannot confirm that any instance is unaffected."
