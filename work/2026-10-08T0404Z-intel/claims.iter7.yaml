    surface: "summary"
    kind: frontmatter
    text: "Le Temps reports, and the AWP news agency names the firm as Ixa Systems of Crissier (Vaud), that data stolen from a video-surveillance, alarm and access-control integrator is on sale on the darknet; the group TheGentlemen claimed the theft at the end of August. The loot reportedly includes camera locations, security-installation plans and, in some cases, usernames or passwords, for clients including police authorities, gendarmerie premises, prisons, hospitals, schools and banks; the reports do not state the access vector or list every affected site."
