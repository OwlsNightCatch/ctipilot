  - claim_id: e67cf75a9c
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "), and BleepingComputer reports researcher Kevin Beaumont observing that many affected devices were running relatively recent FortiOS versions ("
