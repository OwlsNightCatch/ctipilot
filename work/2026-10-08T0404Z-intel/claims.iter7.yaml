    surface: "body"
    kind: cited
    text: "**Detection:** SonicWall's advisory title calls the access path an unintended forward proxy, so the telemetry is the Work Place web access log, looking for requests that name internal hosts or services as the destination, and connections that the appliance itself opens to internal management endpoints without a user session behind them ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017"]
