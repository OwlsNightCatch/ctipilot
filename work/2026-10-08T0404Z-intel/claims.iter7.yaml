  - claim_id: 9df3187c77
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root in all versions. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes. Zammad's advisory of 2026-10-05 says it assesses the root flaw as a local escalation that needs prior access to the server, ties it to a confirmed vulnerability in packager.io and is working on a solution, and names no fix. Zammad 7.2.1 (2026-10-06) replaces 7.2.0 as the release to install: it fixes 27 newly published advisories in 7.2.0 and earlier, two rated critical (a sign-up path to other customers' tickets and a multi-factor bypass in the email-verification flow), none with a CVE id and none reported exploited. Horizon3 published the root cause and a working exploit for CVE-2026-102489 on 2026-10-07: one unauthenticated WebSocket request returns every active user's session cookies, and an administrator session then writes a mail template that runs code as the zammad user."
  - claim_id: f324230c9e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every self-hosted Zammad instance, copy its application and network logs before changing anything, upgrade to Zammad 7.2.1 (7.2.0 is affected by the 27 advisories Zammad published on 2026-10-06, two of them critical; 6.5 and older receive no security fixes), or take it offline if it cannot be upgraded, and run DIVD's log-check script against the logs for the code-execution flaw; also check the application directory for packages installed through the admin interface that you did not install and for a mail view template that overrides the built-in password-reset email, the route Horizon3's public exploit takes."
  - claim_id: 37f62f7fdb
