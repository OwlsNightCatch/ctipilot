    text: "Fortinet's advisory FG-IR-26-175 of 2026-10-01 describes a path traversal in FortiMail that lets an unauthenticated attacker write arbitrary files through crafted HTTP or HTTPS requests, and says it has been reported exploited in the wild; CISA listed it in KEV the same day. Belnet, the Belgian government and research network, says a zero-day in its supplier Fortinet's technology let attackers copy its inbound mail from 2026-07-22 and links this advisory, which puts exploitation about ten weeks before the disclosure. Fortinet's revision of 2026-10-05 names the fixed builds 8.0.2, 7.6.7 and 7.4.9 and tells 7.2 users to move to branch 7.4 or above; the vendor workarounds remain the interim control. Fortinet says it remediated FortiMail Cloud on 2026-10-05, so only self-managed appliances need action."
