  - claim_id: 06c163474a
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "summary"
    kind: frontmatter
    text: "SonicWall confirms active exploitation of two SMA1000 secure-remote-access flaws (SNWLID-2026-0016): CVE-2026-83548 (CVSS 3.0 10.0), a pre-authentication SSRF in the Work Place interface via an unintended alternate access path, and CVE-2026-83549 (CVSS 3.0 7.8), a post-authentication OS command injection in the Appliance Management Console. Shadowserver tracks over 400 internet-exposed SMA1000 appliances. Fixed in hotfix 12.4.3-03526 / 12.5.0-02952; no fix exists short of upgrading, and this is the second SMA1000 zero-day chain reported in seven weeks. SonicWall's advisory of 2026-10-06 shows these hotfix builds are themselves affected by a further Work Place SSRF, CVE-2026-102255, fixed in 12.4.3-03670 and 12.5.0-03082."
  - claim_id: c3e62723ea
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply SonicWall's hotfix 12.4.3-03526 or 12.5.0-02952 to every SMA1000 6210/7210/8200v appliance now; if immediate patching is not possible, remove the appliance from internet exposure entirely rather than relying on network-layer filtering alone, since the SSRF reaches internal functionality through the appliance's own Work Place interface."
  - claim_id: b4cf28b379
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "actions[1]"
    kind: frontmatter
    text: "Where indicators of compromise are found, follow SonicWall's own remediation position: re-image or re-deploy the appliance, rotate every user and administrator password, and reset TOTP seeds, since that guidance implies that stored credentials and MFA seeds are compromised along with the appliance."
