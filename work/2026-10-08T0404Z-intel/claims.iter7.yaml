    surface: "body"
    kind: cited
    text: "**Exposure:** SMA1000 6210, 7210 and 8200v whose Work Place interface is reachable from untrusted networks, on 12.4.3-03526 or older or 12.5.0-02952 or older, which includes appliances that already took the September hotfix; the SMA 100 series and SSL-VPN on SonicWall firewalls are not affected ("
