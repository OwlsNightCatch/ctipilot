  - claim_id: c3db961474
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Detection:** administrator-login and configuration audit events on the FortiGate, and domain controller authentication logs for logins from unexpected sources ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: 9d10da8b02
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** force administrator and VPN password resets, enforce MFA on every administrator and VPN login, and restrict management access to trusted hosts, a local-in policy or no internet administration ("
