    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "In one incident the first client ran a command-shell script that launched a PowerShell script from the temp directory; that script downloaded and ran the installer for the second client and uninstalled the first, in a likely effort to evade detection, and a scheduled task re-ran it every two minutes before the attack was shut down ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
