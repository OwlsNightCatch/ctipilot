    surface: "section 2026-10-08T04:57:05Z"
    kind: cited
    text: "With a leaked administrator session an attacker writes files into the application directory through the package installation endpoint, overrides the built-in password-reset email view with a malicious template and triggers a password reset for any user, which executes the template as the zammad user ("
    urls: ["https://horizon3.ai/attack-research/disclosures/cve-2026-102489-zammad-session-leak-rce/"]
