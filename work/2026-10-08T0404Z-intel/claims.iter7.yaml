  - claim_id: 9cf5b5d7e1
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "Secret Service (JCSA-20261006-01, 2026-10-06) calls FortiBleed an active, global credential-compromise campaign against internet-facing FortiGate firewalls and SSL VPN gateways, cites SOCRadar for more than 86,644 compromised devices in 194 countries, and says attackers are continuing to scan exposed devices with previously obtained credentials ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf"]
  - claim_id: 8f4c29a21e
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "The operators scan exposed SSL VPN portals, run credential stuffing and password spraying from earlier Fortinet leak dumps and infostealer logs, pull password hashes and session tokens from compromised devices and crack the hashes offline with Hashcat and Hashtopolis on a rented GPU cluster; the advisory ties the success to reused or leaked credentials and a legacy SHA-256 password storage ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf"]
  - claim_id: 52e1ad2678
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "On a compromised firewall the actors create administrator accounts that were not there before and, in some cases, delete existing accounts or change their passwords, so the owners cannot log in and recovery needs steps beyond patching and password resets ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf", "https://www.bleepingcomputer.com/news/security/fbi-ongoing-fortibleed-attacks-lock-out-fortigate-vpn-admins/"]
  - claim_id: 2d30b5fabf
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "Cracked credentials are enriched and validated by scripts that filter out honeypots and rank targets by revenue and network structure; with verified credentials the attackers enumerate Active Directory accounts and spray passwords to find privileged users, and the operation packages working VPN configurations and target lists for sale, the role of an initial-access broker ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf"]
  - claim_id: d2c534ff61
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "The advisory says the chain has been an initial entry point for ransomware affiliates, currently INC/Lynx and Payload ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf"]
  - claim_id: 6efbce859d
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "); SOCRadar had linked FortiBleed to INC and Lynx in July after reaching both groups' negotiation panels on a server used in the campaign ("
    urls: ["https://www.bleepingcomputer.com/news/security/fbi-ongoing-fortibleed-attacks-lock-out-fortigate-vpn-admins/"]
  - claim_id: 28a7bbe6e2
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "section 2026-10-08T04:58:53Z"
    kind: cited
    text: "The advisory's measures: restrict external management through trusted hosts, a local-in policy or no internet administration at all; terminate all administrative and VPN sessions and reset all Fortinet VPN and administrator passwords; require phishing-resistant MFA on remote access and administrator accounts; review users, configuration and REST API keys for entries nobody created, removing unknown keys and refreshing the legitimate ones; enforce PBKDF2 for administrator password storage per Fortinet's guidance for FortiOS 7.2.11 and later; and review firewall, VPN, authentication and domain controller logs for lateral movement ("
    urls: ["https://www.ic3.gov/CSA/2026/261006.pdf"]
