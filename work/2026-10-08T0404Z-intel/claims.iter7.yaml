claims:
  - claim_id: cd165ab155
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "headline"
    kind: frontmatter
    text: "FBI and Secret Service: FortiBleed is still active, locks admins out of FortiGates and feeds ransomware affiliates"
  - claim_id: ea9241150c
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "summary"
    kind: frontmatter
    text: "FortiBleed is an active credential-compromise campaign against internet-facing FortiGate firewalls and SSL VPN gateways, with SOCRadar counting more than 86,644 compromised devices in 194 countries; Fortinet said in June that it uses no new vulnerability, only reused credentials and brute force. A joint FBI and U.S. Secret Service advisory of 2026-10-06 says attackers keep scanning exposed devices with previously obtained credentials, create administrator accounts on compromised firewalls and in some cases delete or change the original accounts so owners are locked out, and that access brokers using the chain have supplied INC/Lynx and Payload ransomware affiliates. An organisation with an internet-exposed FortiGate should end all administrator and VPN sessions, reset every credential and look for accounts and API keys it did not create."
  - claim_id: 82698075b1
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing FortiGate, terminate all administrator and VPN sessions, reset every administrator and VPN password, review the local administrator list and the REST API keys for entries nobody created (the actors add administrator accounts for persistence and may delete or lock the original ones), restrict management access to trusted hosts or a local-in policy, and enforce PBKDF2 for administrator password storage as Fortinet's guidance describes for FortiOS 7.2.11 and later."
  - claim_id: 61e240f2dd
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "A dataset branded \"FortiBleed\" was reported on 2026-06-18, containing 73,932 unique FortiGate management URLs, roughly 75,000 devices across 194 countries and 21,632 domains, paired with valid VPN and administrative credentials ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/"]
  - claim_id: de002b43ef
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "Fortinet's position is that this is **not a new Fortinet vulnerability**: it believes threat actors are reusing credentials from previous incidents and using brute force against devices with weak password hygiene and no multi-factor authentication ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: d01d3d5c6c
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "BleepingComputer reports researcher Bob Diachenko's claim that a Russian-speaking multi-operator group harvested the credentials, cracked intercepted SSL VPN hashes on a 45-GPU cluster and moved laterally into internal Active Directory environments, with several organisations fully compromised; Diachenko says he drew this from files the attackers left exposed on the same server ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/"]
  - claim_id: 4c15d7d88c
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "); Arctic Wolf is separately tracking the FortiBleed campaign's reach across 194 countries ("
    urls: ["https://arcticwolf.com/resources/blog/active-fortibleed-campaign-impacting-fortinet-devices-across-194-countries/"]
  - claim_id: d75c3cf02f
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Exposure:** any internet-exposed FortiGate: Fortinet says the campaign reuses credentials from previous incidents and tells customers to reset administrator and VPN passwords, especially on internet-facing systems ("
