    surface: "section 2026-10-08T04:56:05Z"
    kind: cited
    text: "Its telemetry page, updated 2026-10-08, shows at least 129 attempts from at least 22 source addresses in eight countries across three sensors, first observed on 2026-10-06 (its timeline lists the first sensor observation at 21:55 UTC) and last on 2026-10-08, and lists the flaw as not in CISA's KEV catalog ("
    urls: ["https://previdian.com/CVE-2026-21589"]
