    summary: |
      SonicWall's advisory SNWLID-2026-0017 (dated 2026-10-06; CVE records published 2026-10-07) fixes four flaws in the SMA1000 appliances (models 6210, 7210, 8200v). CVE-2026-102255 (CVSS 3.0 10.0, CWE-918 and CWE-441) is a pre-authentication server-side request forgery in the Appliance Work Place interface that SonicWall attributes to an unintended alternate access path; by abusing it a remote unauthenticated attacker can make the appliance issue requests on their behalf and reach internal functionality and perform unauthorized operations. The other three need a login: CVE-2026-102256 (7.8, OS command injection by an administrator, leading to code execution), CVE-2026-102257 (7.2, Zip Slip in the Appliance Management Console leading to code execution) and CVE-2026-102258 (5.5, stored XSS in the console). SSL-VPN on SonicWall firewalls and the SMA 100 series are not affected. SonicWall states there is currently no evidence that any of the four is exploited in the wild, lists no workaround, and ships a platform hotfix through MySonicWall that restarts the appliance.
      The delta for defenders is the affected range: the CVE record and The Hacker News list 12.4.3-03526 and older and 12.5.0-02952 and older as affected, which are exactly the hotfix builds SonicWall named on 2026-09-01 as the fix for the exploited CVE-2026-83548 and CVE-2026-83549, so an appliance that took the September hotfix is still exposed. The Hacker News reads the fixed builds as 12.4.3-03670 and higher and 12.5.0-03082 and higher; the Canadian Cyber Centre lists those same two builds as 'and prior' (affected), a contradiction, and the SonicWall advisory page as read through the reader omitted the fixed-version table, so the fixed builds need confirming on the advisory or in MySonicWall before the entry states them as fact. BleepingComputer cites Shadowserver for over 400 internet-exposed SMA1000 appliances. Reporting (The Hacker News) counts this as the third 10.0-rated pre-authentication WorkPlace SSRF fixed this year, after the July pair (CVE-2026-15409/15410) and the September pair (CVE-2026-83548/83549), both exploited as zero-days; each earlier pair combined a no-login SSRF with an administrator-only command-execution flaw, the same shape as this advisory, but no source says CVE-2026-102255 has been chained or attacked. SonicWall credits external finders this time (The Hacker News names Benoit Sevens of Anthropic for CVE-2026-102255 and CVE-2026-102256, and Brian Mariani of DigitalCanion SA, one report through Trend Micro's Zero Day Initiative, for the other two).
    region_nexus: "global; SMA1000 is a remote-access gateway BleepingComputer says government agencies and managed service providers use; NCSC Switzerland and NCSC-NL both published advisories on 2026-10-07"
