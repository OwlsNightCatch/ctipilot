  rss_url: https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en
  category: vulns
  why: 'Timestamped Atom feed (read directly 2026-10-08, 40 items) of one-vendor-per-item advisories with affected-version lists, and an Update marker where a status changes: its AV26-1002 Update 1 on 2026-10-07 is how the Atlassian exploitation claim surfaced. Per-item pages read with extract (four of nine came back as raw HTML with the text inside). A government CERT, reliability A; a cheap survey of the vendor-advisory day for S1.'
