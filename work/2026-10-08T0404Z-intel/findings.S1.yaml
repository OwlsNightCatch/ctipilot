      Exposure: Splunk Enterprise 10.2 or 10.4 search head cluster members; the listener port of the Patroni API is not named in the source (do not state one). Detection concept: network flow logs for connections to the sidecar/Patroni port from hosts that are not cluster peers, process-creation events with the splunkd or Patroni/PostgreSQL sidecar as parent spawning shells, and changes to PostgreSQL sidecar configuration; post-patch, check for new OS accounts, cron entries and outbound connections from SHC members. The advisory's 'additional steps' CVEs are 76264, 76265, 76272 and 76280 (not critical). Related stored entry: 2026-08-28/splunk-svd-2026-0801-embedded-report-session-hijack (earlier Splunk advisory). EUVD assigner shows cisco (Splunk is a Cisco company).
