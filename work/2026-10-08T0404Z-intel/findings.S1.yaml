      Exposure: ClearPass management (CLI and web UI) and the OnGuard/client-agent communication paths; read the version in the ClearPass admin UI. AOS-S: management interface reachable from user VLANs. Detection concept: authentication and web-server logs on CPPM for administrative sessions or API calls without a preceding interactive login, unexpected process spawns by the web application, and changes to policy/admin accounts; post-patch, review CPPM admin accounts, API clients and service credentials created since the exposure began. Hardening: the vendor workaround (management plane on a dedicated VLAN/firewalled) is the control until patched. The exact CVE text of the unauthenticated 9.8 set is in the CSAF; prerequisites for CVE-2026-76743 ('if certain preconditions') are not stated. Registry: no ClearPass key exists; two proposed above.
  - title: "CVE-2026-76268, Splunk Enterprise 10.2 and 10.4: unauthenticated operating-system command execution through the Patroni REST API of the PostgreSQL sidecar on search head cluster members (CVSS 9.8, fixed in 10.2.7 and 10.4.3)"
    sources:
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-1001", publisher: "Splunk (SVD-2026-1001)", date: "2026-10-07", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd, bridge url --direct https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-10-05&toDate=2026-10-08 (EUVD-2026-94620, CVE-2026-76268, published 2026-10-07T20:46Z) -> primary (no pivot needed): https://advisory.splunk.com/advisories/SVD-2026-1001 read with extract"
    summary: |
      Splunk's advisory SVD-2026-1001 (published 2026-10-07) fixes Splunk Enterprise in 10.4.3, 10.2.7, 10.0.10 and 9.4.15. Its one critical entry, CVE-2026-76268 (CVSS 3.1 9.8, CWE-306 missing authentication for a critical function), concerns the Patroni REST API: an unauthenticated user with network access to that API on a search head cluster member could execute attacker-controlled operating-system commands, because the interface does not require authentication for critical configuration operations. Only 10.4.0 to 10.4.2 and 10.2.0 to 10.2.6 are affected; Splunk states 10.0.x and 9.4.x are not. The vendor mitigation is to turn the PostgreSQL sidecar off by setting disabled = true in the [postgres] stanza of server.conf under SPLUNK_HOME/etc/system/local and restarting, which is only acceptable if the deployment does not use Edge Processor, OpAmp or SPL2 data pipelines. The same advisory carries a High local privilege escalation through Linux package upgrades (CVE-2026-76266, 7.7) and several medium authorization flaws; four CVEs need additional steps beyond the upgrade. The finder is credited as Splunk's own staff, and the advisory does not report exploitation (EPSS not yet scored; not in CISA KEV).
    region_nexus: "global; Splunk Enterprise is a SIEM platform widely run by public-sector SOCs (no Swiss-specific signal in the source)"
    primary_sector_nexus: "indirect: a SIEM search head cluster is a high-value target (log data, stored credentials, detection blind spot), but exposure depends on the sidecar port being reachable"
