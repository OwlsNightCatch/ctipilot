- source_id: msrc-update-guide
  note: 'Until Patch Tuesday (next 2026-10-13) the 2026-Oct release id holds the early release: 233 Azure Linux kernel and Apache Thrift CVEs with no Exploited or Publicly Disclosed flags; msrc cve <CVE> returns the exploited, publiclyDisclosed and latestSoftwareRelease fields (used for the Exchange out-of-band CVE-2026-96940: exploited No, Exploitation More Likely).'
- source_id: fortinet-psirt
  note: 'Confirmed again: the advisory HTML Timeline block exposes revisions the RSS pubDate hides (FG-IR-26-175 revised 2026-10-05 and 2026-10-07 while the feed still says 2026-10-01).'
- source_id: checkpoint-support
  note: jina on the specific SK (sk1000171) works; extract returns a shell.
