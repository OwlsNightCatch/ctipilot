    extended_notes: |
      Exposure: the Work Place portal of an SMA1000 reachable from untrusted networks; read the running build from the appliance management console and compare with the hotfix builds. Detection concept: web access logs of the Work Place interface for requests that behave like a forward proxy toward internal addresses and services, and appliance-originated connections to internal management or metadata endpoints that no user session explains; for any appliance that was internet-exposed on builds older than the September hotfix, the September advisory's compromise-check guidance still applies (appliances that took the hotfix after exploitation are not cleaned by it). Hardening: apply the new hotfix, keep the AMC off the internet, and restrict Work Place exposure to the user population that needs it. No IOCs in this item. Related stored entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection (and 2026-07-14/sonicwall-sma1000-ssrf-cve-2026-15409-actively-exploited); this is a distinct CVE set with its own advisory, so a new entry referencing them. Date note: the vendor lists 2026-10-06; the CVE record went public 2026-10-07T13:07Z; NCSC-CH, NCSC-NL, BleepingComputer, The Hacker News and CCCS are all 2026-10-07 (in window).
  - title: "HPE Networking ClearPass Policy Manager and AOS-Switch: two 2026-10-06 bulletins fix seven unauthenticated CVSS 9.8 flaws in ClearPass (deserialization RCE, authentication bypass, SQL injection to RCE, format string, agent integrity) and an unauthenticated 9.8 set in AOS-S; HPE knows of no exploit code"
