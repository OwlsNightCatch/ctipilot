      - { url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05156.json", publisher: "HPE Networking CSAF (HPESBNW05156, AOS-Switch)", date: "2026-10-06", role: "primary" }
      - { url: "https://cyber.gc.ca/en/alerts-advisories/hpe-security-advisory-av26-1011", publisher: "Canadian Centre for Cyber Security (AV26-1011)", date: "2026-10-07", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, bridge url --direct https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-10-05&toDate=2026-10-08 (EUVD-2026-93877 CVE-2026-76750 and 20+ sibling ClearPass/AOS-S records, dateUpdated 2026-10-07T19:18Z) -> pivot: CCCS feed https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en (AV26-1011, 2026-10-07T15:56Z) -> primary: HPE CSAF index https://csaf.arubanetworking.hpe.com/changes.csv -> https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05158.json and ..._hpesbnw05156.json (support.hpe.com bulletin pages are a login-gated SPA)"
    summary: |
      HPE Networking published two bulletins on 2026-10-06 (CSAF release time 16:00Z). HPESBNW05158 covers 28 CVEs in ClearPass Policy Manager (CPPM) 6.14.0 and below and 6.11.15 and below, fixed in CPPM 6.14.1 and 6.11.16. Seven are unauthenticated at CVSS 9.8: CVE-2026-76750 (deserialization of untrusted data in the web interface, remote code execution), CVE-2026-76751 (missing integrity verification in the OnGuard agent, unauthenticated remote code execution), CVE-2026-76752 and CVE-2026-79796 (authentication bypass, the first yielding administrative access through the web and API interfaces), CVE-2026-76753 (format string in a service interface), CVE-2026-76754 (SQL injection leading to code execution) and CVE-2026-79801 (missing integrity verification in the client agent). The bulletin also lists authenticated flaws at 9.9 and 9.8 (SQL injection, path traversal), an unauthenticated path traversal at 7.3 and an unauthenticated stored XSS at 8.8. HPESBNW05156 covers nine CVEs in AOS-Switch (AOS-S) 16.11.0031 and below, fixed in 16.11.0032: CVE-2026-76742 and CVE-2026-76743 (authentication bypass of the management interfaces, the latter if certain preconditions are met), CVE-2026-76744 (unauthenticated buffer overflows leading to code execution, 9.8), adjacent-network memory corruption at 9.6 and 9.3 and an information-disclosure overflow at 9.1.
      HPE states the flaws were generally found by its internal research and that it is not aware of any public discussion or exploit code targeting them as of the release date, but urges customers to patch because of their complexity, breadth and impact. The only vendor mitigation is to restrict the CLI and web-based management interfaces to a dedicated layer 2 segment or VLAN and/or control them with firewall policy at layer 3 and above, with accounting. EPSS values on 2026-10-07 are all below 0.01 (not yet scored higher); none of these CVEs is in CISA KEV (catalog 2026.10.04).
    region_nexus: "global; ClearPass is a network-access-control and AAA policy server and AOS-S a legacy campus switch line, both common in public-sector campus and cantonal networks (HPE Aruba line); no Swiss-specific signal in the sources"
    primary_sector_nexus: "indirect to direct: management-plane exposure of an authentication and policy server is normally internal, which lowers urgency, but a bypass of ClearPass administrative access exposes network access control for every connected site"
