    summary: |
      Cisco published its first-Wednesday batch on 2026-10-07 (announced seven days earlier): hardening releases for NX-OS, ACI APIC, License On-Prem (formerly Smart Software Manager On-Prem) and Meraki, plus separate advisories for the worst NX-OS and License On-Prem flaws and one for Finesse. Cisco states for every one that the PSIRT is not aware of any public announcements or malicious use. The NX-OS, APIC and Meraki-class findings were found in internal testing, and the hardening advisories add that frontier AI models were part of that testing; Cisco groups each hardening release's flaws by CWE class under one CVE id whose score is the worst underlying flaw.
      Pre-authentication, network-reachable entries at CVSS 9.0 or above, with their gating condition: NX-OS NX-API (CVE-2026-76471, 9.8, root code execution or reload by a crafted HTTP request; affects Nexus 3000 and standalone 9000 only with the nxapi feature enabled, which is off by default; on UCS 6300 fabric interconnects it needs low-privileged credentials through the UCS Manager XML API, so Cisco rates that platform High; Cisco released a Live Protect shield for it); NX-OS MPLS OAM (CVE-2026-76465, 9.8, a crafted MPLS echo-request to an IP address on the device; Nexus 3000 and standalone 9000 with the mpls_oam feature enabled, off by default, and 'no feature mpls oam' removes the vector); NX-OS NGOAM (CVE-2026-76485, 9.8, only NGOAM enabled; CVE-2026-76486, 9.8, NGOAM plus SRv6 or an NV overlay with an EVPN VNI mapped to an NVE interface and a learned peer; CVE-2026-76501, 9.8, NGOAM plus SRv6). The NX-OS hardening release adds CVE-2026-76455 (9.8, improper access control) and CVE-2026-76459 (9.8, out-of-bounds write) that apply to MDS 9000, Nexus 3000/7000/9000 (standalone and ACI) and UCS 6300/6400/6500/6600 and 9108 regardless of configuration, fixed in 9.4(5a) (MDS 9.4), 10.3(10), 10.4(8), 10.5(6) and 10.6(4) (Nexus 3000 and standalone 9000), 8.4(14) (Nexus 7000), 16.0(9h), 16.1(6g) and 16.2(3g) (ACI mode) and UCS 4.3(6j) or 6.0(2e) (older trains migrate). APIC (CVE-2026-76498, -76499, -76500, each 9.8, regardless of configuration) is fixed in 6.0(9h), 6.1(6g) and 6.2(3g), with 5.3 and earlier told to migrate. License On-Prem: CVE-2026-76480 (9.8, missing authentication) and CVE-2026-76482 (10.0, improper signature verification) and CVE-2026-76483 (9.1) in the hardening release, fixed in 10-202609 (10-202608 and earlier affected, 9-202601 and earlier migrate); the separate advisory adds CVE-2026-20328 (9.1, arbitrary account password reset, credited to the NATO Cyber Security Centre's Gabriele Paris) and CVE-2026-76454 (9.1), fixed in 10-202608 and 10-202609. Meraki: CVE-2026-76464 (9.6) needs an adjacent attacker (AV:A); fixes are per model line and some are scheduled for late October and mid-November. Below the threshold and dropped: Finesse CVE-2026-20362 (7.2, unauthenticated SSRF), Meraki CVE-2026-76463 (8.8) and the 8.6 to 8.8 NX-OS classes.
      Delta for defenders: Cisco moved to a predictable first-and-third-Wednesday disclosure cadence for AI-accelerated discovery; the next batch is 2026-10-21. No exploitation, public proof of concept or KEV listing exists for any of these.
