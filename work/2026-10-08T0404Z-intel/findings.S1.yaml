    summary: |
      New development on the covered entry (2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed, registry incident:fortibleed-fortigate-credential-exposure). The FBI and U.S. Secret Service advisory of 2026-10-06 (TLP:CLEAR) describes FortiBleed as an active credential-compromise operation against internet-facing FortiGate firewalls and SSL VPN gateways, citing SOCRadar for more than 86,644 compromised devices in 194 countries (the June entry carried 73,932 URLs). The operators scan exposed SSL VPN portals, run credential stuffing and password spraying from earlier Fortinet leak dumps and infostealer logs, pull password hashes from compromised devices and crack them offline with Hashcat and Hashtopolis on a GPU cluster, the advisory attributing the success to reused or leaked credentials and legacy SHA-256 password storage. After validating credentials they create new administrator accounts on the firewall for persistence, in some cases delete or change the passwords of the original accounts so victims are locked out, enumerate Active Directory and password-spray internally, and package working VPN configurations for sale; the advisory states initial access brokers using this chain have provided access to ransomware affiliates, currently including INC/Lynx and Payload. It says recovery may need steps beyond patching and password resets and lists IP addresses and account names for log review (omitted here).
