    discovery_trace: "first seen at: horizon3-ai, extract https://horizon3.ai/attack-research/ (listing readable; top item 'Zammad CVE-2026-102489: Session Leak to RCE', 2026-10-07) -> primary: https://horizon3.ai/attack-research/disclosures/cve-2026-102489-zammad-session-leak-rce/ -> PoC repository https://github.com/horizon3ai/CVE-2026-102489 -> re-read Zammad advisory https://zammad.com/en/advisories/cve-2026-102489-cve-2026-102490 and GitHub advisory list (API: 76 advisories, newest 2026-10-06, none carrying either CVE) for a fix to CVE-2026-102490"
    summary: |
      New development on the covered entry (2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach). Horizon3.ai published on 2026-10-07 a reverse-engineering of CVE-2026-102489, the session-hijack flaw DIVD reported as exploited, together with a public proof-of-concept repository. Its account: Zammad keeps every connected WebSocket client's request context, including the Cookie header, in a class-level registry; an unauthenticated client can send one crafted event name over the WebSocket endpoint, the dispatcher instantiates an event class that has no implementation, and the resulting error message returned to the caller contains the full object representation including every active user's session cookies. A leaked administrator session then lets the attacker write files into the application directory through the package-installation endpoint, overriding the password-reset mail template with attacker-controlled ERB that executes when a password reset is triggered, giving code execution as the zammad OS user. Horizon3 withholds details of the root escalation it believes is CVE-2026-102490, stating that it 'remains unpatched'.
      Reconciliation needed: Zammad's own advisory (2026-10-05) says CVE-2026-102489 is exploitable only on 6.5 and earlier because of the runtime those versions use, that 7.0 and later are not affected in practice (code hardened in 7.2.0), and that CVE-2026-102490 is a local escalation tied to a confirmed packager.io vulnerability on which it is 'working on a solution'; the Horizon3 text read does not state which Zammad version it tested. Zammad's GitHub advisory list through 2026-10-06 (the 27 advisories of 7.2.1) carries neither CVE, so no fix for CVE-2026-102490 is named anywhere as of this read. Net change for the entry: a public, working exploit chain now exists for a flaw already exploited and in CISA KEV (listed 2026-10-02), shifting unpatched 6.x installations from targeted to commodity exposure.
