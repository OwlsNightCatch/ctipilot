      Red Hat and the GitHub Advisory Database (both dated 2026-10-06; BSI flags the advisory unpatched and rates it hoch on 2026-10-07) describe CVE-2026-101258: when Ghostscript renders a crafted PostScript or EPS document it can bypass the -dSAFER sandbox and execute arbitrary shell commands as the Ghostscript process, by chaining memory corruption in document parsing with disabling internal path access controls at runtime; delivery can be direct or through formats that delegate to Ghostscript such as EPS import or print conversion. Red Hat rates it Important (CVSS 3.1 7.8, local, user interaction required), confirmed command execution under -dSAFER on RHEL 10.2 with Ghostscript 10.02.1, says SELinux targeted policy did not prevent it for common domains, says affectedness of RHEL 8 (9.27) and 9 (9.54) is under analysis against a public proof of concept that targets the 10.x series, and states that no mitigation meeting its standards is currently available. Reporters: Akiyoshi Kurita and V12 Security. No exploitation is reported and no upstream fixed version is named in the sources read.
    region_nexus: "global; Ghostscript sits behind document conversion, print and thumbnail pipelines on public-sector servers and desktops"
    primary_sector_nexus: "indirect: reachable where untrusted documents are converted automatically (mail gateways, document portals, print servers)"
    sector: "public-sector"
    cves: [CVE-2026-101258]
    techniques: [T1203, T1204.002]
    affected_products: ["Ghostscript"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Public PoC and no fix, but local/user-interaction CVSS 7.8, no exploitation, sources dated 2026-10-06 (outside the 26 h window, with the EUVD and BSI records updated inside it), and server-side reach depends on document-conversion pipelines the sources do not map. Offered as a watch item."
    admiralty_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "it can bypass the -dSAFER sandbox and execute arbitrary shell commands in the context of the Ghostscript process"
        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/CVE-2026-101258"
      - quote: "No mitigation is currently available that meets Red Hat Product Security's standards for usability, deployment, applicability, or stability."
        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/CVE-2026-101258"
    extended_notes: |
      Detection concept: gs/ghostscript process creation with shell children (sh, bash, cmd) on conversion hosts, ImageMagick or print-spooler workers spawning shells after processing EPS/PS input. Upstream fix status not read (no Ghostscript project advisory fetched).
