    extended_notes: |
      Defender vantage (decision, not detection): the leaked set is a supplier-held copy of client site-security material. Cantonal and communal bodies that use a Romandie security integrator should ask their supplier in writing whether they are in the affected dataset, treat any camera, alarm, intercom or access-control credentials the supplier held as exposed (rotate them, including remote-maintenance accounts the supplier used), and re-assess the physical-security posture of sites whose layouts or camera placement were in plans. Detection hook: authentication logs of video-management, alarm and access-control systems for logins from the supplier's accounts or from new source networks, and vendor remote-access path logs, since ransomware.live's profile says the firm sold 24/7 maintenance contracts (tracker description, unverified). Open questions a later source could close: the access vector, whether data was encrypted at the client sites or only at Ixa, which Vaud bodies are clients (SPEN, police and hospitals are inferences from the client-category wording, not named), and whether Vaud authorities or the cantonal data-protection officer have published a statement. Incident-floor note: no vector and no behaviour beyond impact are public, so keep the entry short and carry the relevance ground in one clause.
