    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (homepage via bridge url; entry list) → pivot: Piyolog entry, URL https://piyolog.hatenadiary.jp/entry/2026/10/08/070606 (read via extract; it lists every statement) → primary: IDC Frontier first and second reports, URLs https://www.idcf.jp/news/topics/20261007001 and https://www.idcf.jp/news/topics/20261007002 → independent corroboration: Mainichi https://mainichi.jp/articles/20261007/k00/00m/020/347000c, Asahi https://www.asahi.com/articles/ASVB72QB4VB7UJHB009M.html, Kyodo via Kanaloco https://www.kanaloco.jp/news/economy/article-1310592.html; customer and public-body statements https://www.nissui.co.jp/news/2026100702.html, https://www.sixapart.jp/movabletype/news/2026/10/08-0900.html, https://www.pref.tochigi.lg.jp/r081007calendar.html. WebSearch (English and Japanese) found no indexed coverage of the event; the chain rests on direct fetches."
    summary: |
      IDC Frontier, a SoftBank subsidiary, told customers at 13:52 JST on 2026-10-07 that unauthorised access had caused a failure in part of its IDCF Cloud from about 03:40 JST in the East Japan Region 1, and at 20:18 JST said the investigation showed a third-party ransomware attack. IDCF states the impact reaches "495 companies and municipalities" under contract; it cut the region from the network and stopped its systems, is still identifying and blocking the intrusion route, and suspended the customer-facing management consoles of the other regions while it verifies them. Public-sector effects reported by Mainichi, Asahi and the bodies themselves: the websites of Ibaraki Prefecture and its prefectural police headquarters, an event-calendar service on Tochigi Prefecture's site and the city website of Kodaira went down, and Asahi reports Ibaraki was first told by SoftBank of a power failure at the data centre and had not been told it was ransomware. A Nissui-group logistics company reported that it cannot receive or ship goods and attributes this to apparent unauthorised access to an outsourced data centre; Nissui does not name IDCF, and Piyolog groups the case with this incident on timing (media put the stopped sites at 17). Six Apart says its 31 Movable Type servers in the region have no prospect of recovery on IDCF Cloud and is restoring them from daily backups held on a different IaaS platform (Google Cloud) onto another provider, while other customers were reportedly told data restoration was difficult (Piyolog's compilation). Social-media images claiming data was encrypted are circulating and IDCF says it is investigating their authenticity (Kyodo); whether personal data left is "under confirmation", the initial access vector and the actor are not stated. Transfer ground (supply-chain blast radius, PD-11 d): one provider-side compromise took government websites, a prefectural police site and customers' co-located backups offline at once. A second Japanese virtualisation-layer case this week is Osaka Metropolitan University (public university), where the university said on 2026-10-05 that the 2026-10-02 outage of its virtualisation platform was a ransomware attack, with servers halted and traces of data tampering (Piyolog's summary of the press conference).
