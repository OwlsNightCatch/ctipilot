    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed via bridge feed; 15 items) → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/asos-confirms-data-breach-after-hacked-in-app-notifications/ → pivot: BBC, URL https://www.bbc.com/news/articles/cj62ylzpr6d3o → regulator reaction found through the ico-uk sitemap recipe (https://ico.org.uk/sitemap.xml, lastmod filter), URL https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/10/asos-statement/. ASOS's own regulatory announcement is linked from BleepingComputer on an http-only host and could not be fetched (bridge refuses http)."
    summary: |
      On the morning of 2026-10-06 users of the ASOS app received a push notification reading "ASOS HACKED", addressed to the company's data protection officer and IT team and claiming that the Snowflake instance was fully compromised, with a link to a Telegram channel run by a group calling itself "Xuanye group" (BleepingComputer, BBC). ASOS confirmed that third-party platforms it uses to communicate with customers were accessed without authorization, that basic personal data such as names and contact details may have been exposed, and says it does not believe payment-card data or account passwords were affected (BleepingComputer relaying ASOS). ASOS has not confirmed the Snowflake claim or a customer count; the group later posted a "FINAL STATEMENT" claiming customer information was stolen, without evidence. The BBC calls hackers informing a victim's customers rare, since most extortion happens in private, and notes the app has more than 10 million Android installs. On 2026-10-07 the UK Information Commission's Office issued a public statement on messages of this kind, advising caution with links and attachments. Transferable point: the extortion used the victim's own authenticated broadcast channel, a third-party engagement platform, so any organisation (including public bodies) that sends citizen notifications through an external messaging or app-engagement service has the same exposure; the platform vendor, the access method and the data accessed are all unstated.
