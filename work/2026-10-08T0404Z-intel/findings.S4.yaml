    summary: |
      A leak of Silent Ransom Group's internal chats (5,692 messages from two servers, 2025-08-27 to 2026-09-29, mostly Russian) surfaced on 2026-10-06/07; Crystal Intelligence, a blockchain-analytics firm, analysed it and DataBreaches.net, whose owner has covered the group since 2022, read it for victim payments. Per the chat's own deal board the group marked about USD 207M as paid by 27 firms between 2026-04-03 and 2026-09-24, with a median payment of USD 6M and a top payment of USD 30M (DataBreaches.net's arithmetic on the chat); Crystal says the blockchain confirms that real money moved when the chat says it did but cannot verify the headline figures, and DataBreaches.net stresses that no victim has confirmed any listed payment, although 9 of the 27 disclosed breaches in 2026 that fit the dates. Crystal describes the group (also tracked as Luna Moth, Chatty Spider, UNC3753 and Storm-0252, a Conti offshoot) as never using ransomware: it sends staff fake invoices or phones them posing as IT support, talks them into granting remote access, steals data and threatens to publish it, with US law firms its focus since 2023, and since May 2026 it has also sent people into victims' offices with fake IDs (Crystal citing an FBI FLASH alert). The leak also documents a cash-out chain of single-use wallets, instant exchangers, a Moscow cash courier and a Bitcoin-to-Zelle desk. Relevance is indirect: no Swiss or public-sector victim is named; the transferable pieces are a voice-based help-desk lure that ends in a remote-access session with no malware and the in-person pretext, both aimed at organisations holding privileged third-party data.
