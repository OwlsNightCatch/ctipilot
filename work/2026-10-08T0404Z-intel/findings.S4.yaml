    summary: |
      Le Temps reported on 2026-10-06 (AWP relayed it on 2026-10-07; Inside IT ran its own piece the same day) that data stolen from Ixa Systems SA, a Crissier (VD) integrator of video-surveillance, alarm and access-control installations, is now on the darknet. The group that announced and claimed the theft at the end of August is TheGentlemen. Le Temps standfirst says the loot includes the locations of surveillance cameras, passwords and plans of security installations, and AWP, summarising Le Temps, adds that clients include police authorities, banks, hospitals, schools and prisons and that a cybersecurity expert's analysis seen by the paper shows how much is accessible. Le Temps also states that the canton and the company say they have taken all necessary measures. The two outlets differ on the stage: Le Temps and AWP say the documents were offered for sale about a month after the claim, Inside IT says the group made good on its publication threat at the end of September. Facts that are missing: no access vector, no list of the affected client sites and no statement from a Vaud authority were reachable, and the Le Temps article is paywalled (only its opening paragraphs were read). Ransomware.live recorded the leak-site claim on 2026-08-30 with an attack date of 2026-08-28; its profile of the firm (about ten staff, 24/7 maintenance contracts, a client list naming police, banks, museums, schools, hospitals, prisons and railways) is the tracker's own, unverified description. Ground for relevance: Swiss home-region supplier whose stolen data is site-security material of public-sector institutions, not citizen records.
