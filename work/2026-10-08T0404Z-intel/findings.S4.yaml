  - title: "ASOS: attackers abuse a third-party customer-communications platform to push 'ASOS HACKED' extortion alerts to app users, claiming a Snowflake compromise"
    sources:
      - { url: "https://www.bbc.com/news/articles/cj62ylzpr6d3o", publisher: "BBC News", date: "2026-10-06", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/asos-confirms-data-breach-after-hacked-in-app-notifications/", publisher: "BleepingComputer", date: "2026-10-06", role: "corroborating" }
