claims:
  - claim_id: 0334974ff3
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "A dataset branded \"FortiBleed\" surfaced on 2026-06-17 containing 73,932 unique FortiGate management URLs, roughly 75,000 devices across 194 countries and 21,632 domains, paired with valid VPN and administrative credentials ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/"]
  - claim_id: de002b43ef
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "Fortinet's position is that this is **not a new Fortinet vulnerability**: it believes threat actors are reusing credentials from previous incidents and using brute force against devices with weak password hygiene and no multi-factor authentication ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: d01d3d5c6c
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "BleepingComputer reports researcher Bob Diachenko's claim that a Russian-speaking multi-operator group harvested the credentials, cracked intercepted SSL VPN hashes on a 45-GPU cluster and moved laterally into internal Active Directory environments, with several organisations fully compromised; Diachenko says he drew this from files the attackers left exposed on the same server ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/"]
  - claim_id: 7489f9d233
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Exposure:** any internet-exposed FortiGate: its administrator and SSL VPN credentials may be in the compromised data whatever the patch level, because patching does not rotate a credential that has already leaked ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: c3db961474
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Detection:** administrator-login and configuration audit events on the FortiGate, and domain controller authentication logs for logins from unexpected sources ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: 9d10da8b02
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** force administrator and VPN password resets, enforce MFA on every administrator and VPN login, and restrict management access to trusted hosts, a local-in policy or no internet administration ("
    urls: ["https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices"]
  - claim_id: 5f5af0fc7e
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "body"
    kind: uncited
    text: "The technique class is valid-account abuse following credential access, not exploitation of a fresh CVE."
  - claim_id: b9439395be
    entry: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed
    surface: "record 2026-10-08T04:58:53Z"
    kind: record-summary
    text: "A joint FBI and U.S. Secret Service advisory of 2026-10-06 says FortiBleed is still active: the operators create administrator accounts on compromised FortiGates and in some cases delete or change the original accounts, locking owners out, and access brokers using the chain have supplied INC/Lynx and Payload ransomware affiliates. It cites SOCRadar for more than 86,644 compromised devices and adds firewall, VPN and domain controller log review, REST API key review and PBKDF2 enforcement to the response. The June sections now attribute the Russian-speaking actor and the GPU cluster to researcher Bob Diachenko's claims and cite Fortinet's position to its own blog."
  - claim_id: 06c163474a
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "summary"
    kind: frontmatter
    text: "SonicWall confirms active exploitation of two SMA1000 secure-remote-access flaws (SNWLID-2026-0016): CVE-2026-83548 (CVSS 3.0 10.0), a pre-authentication SSRF in the Work Place interface via an unintended alternate access path, and CVE-2026-83549 (CVSS 3.0 7.8), a post-authentication OS command injection in the Appliance Management Console. Shadowserver tracks over 400 internet-exposed SMA1000 appliances. Fixed in hotfix 12.4.3-03526 / 12.5.0-02952; no fix exists short of upgrading, and this is the second SMA1000 zero-day chain reported in seven weeks. SonicWall's advisory of 2026-10-06 shows these hotfix builds are themselves affected by a further Work Place SSRF, CVE-2026-102255, fixed in 12.4.3-03670 and 12.5.0-03082."
  - claim_id: 3330d04233
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply SonicWall's hotfix 12.4.3-03526 or 12.5.0-02952 to every SMA1000 6210/7210/8200v appliance now, then the later hotfix 12.4.3-03670 or 12.5.0-03082 (or higher), because the first pair is affected by CVE-2026-102255; if immediate patching is not possible, remove the appliance from internet exposure entirely rather than relying on network-layer filtering alone, since the SSRF reaches internal functionality through the appliance's own Work Place interface."
  - claim_id: dc862f5fca
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "actions[1]"
    kind: frontmatter
    text: "Where indicators of compromise are found, follow SonicWall's own remediation position: re-image or re-deploy the appliance, rotate every user and administrator password, and reset TOTP seeds — SonicWall's guidance treats successful exploitation as credential- and MFA-seed-compromising, not just appliance-compromising."
  - claim_id: 19d12ce881
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: cited
    text: "SonicWall's advisory SNWLID-2026-0016 (updated 2026-09-01) discloses two flaws it states it has investigated as actively exploited ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016"]
  - claim_id: 675b5c880c
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: cited
    text: "CVE-2026-83548 (CVSS 3.0 10.0) is a pre-authentication server-side request forgery in the SMA1000 Appliance Work Place interface, arising from an unintended alternate access path (CWE-918 SSRF, CWE-441 Confused Deputy); a remote, unauthenticated attacker uses it to reach functionality normally gated behind authentication ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016"]
  - claim_id: 5a0740404f
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: cited
    text: "CVE-2026-83549 (CVSS 3.0 7.8) is a post-authentication OS command injection in the Appliance Management Console (AMC), letting an attacker who already holds administrative access execute arbitrary operating-system commands ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016"]
  - claim_id: 1c9d3ee5ef
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: cited
    text: "Chained, the SSRF supplies the unauthorized access the command injection then turns into code execution — SecurityWeek and BleepingComputer both report the flaws are being exploited together, with the appliance considered fully compromised once both stages complete ("
