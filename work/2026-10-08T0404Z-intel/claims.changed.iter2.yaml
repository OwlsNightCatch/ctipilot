  - claim_id: 7fab5741d2
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed within two hours: Previdian's sensors have recorded at least 129 attempts from at least 22 addresses, SANS ISC saw the same probes, and a Nuclei template exists; neither honeypot operator reports a compromise. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application."
  - claim_id: fdd26f14f3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Jira instance that was internet-reachable and unpatched and is integrated with Crowd, treat the Crowd application password in its WEB-INF/classes/crowd.properties as readable: rotate it after the upgrade and review Crowd for user accounts created or group memberships changed since the exposure began; on every affected instance search the web server and proxy logs back to 2026-10-05, the day the advisory published (honeypots recorded the first attempts on 2026-10-06), for '..' next to '/', '\\\\' or '::'."
  - claim_id: 73c0675db2
