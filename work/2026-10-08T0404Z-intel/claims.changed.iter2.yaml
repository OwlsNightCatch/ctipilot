  - claim_id: f21c373851
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "headline"
    kind: frontmatter
    text: "Huntress: a Power BI-hosted phishing link installs rogue ScreenConnect clients, and a script removes the first"
  - claim_id: fa665f2147
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a phishing campaign seen since 2026-09-10 in which an Outlook email links to a fake reference document on a legitimate Power BI domain; a \"Download Reference\" button opens an attacker page that fingerprints the visitor and then downloads a ScreenConnect installer. The installer deploys a rogue ScreenConnect client that establishes a second one, and in one incident a PowerShell script removed the first; Huntress could not obtain the original email, and the second client's configuration also appeared on 22 other endpoints."
  - claim_id: cb8ee76888
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "body"
    kind: cited
    text: "Huntress notes that threat actors have previously abused Power BI in this way, building a real dashboard under an account of their own (usually compromised or throwaway), embedding a malicious link and setting its sharing to public, and that because the link points to Microsoft's real domain it passes Microsoft 365 mail filters and other gateways that trust that domain; it does not say how this campaign's page was set up ("
    urls: ["https://www.huntress.com/blog/screenconnect-power-bi"]
  - claim_id: 2326214046
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows endpoints running Defender Antivirus; LevelBlue ran it from a standard user account, and an estate shows the effect as endpoints whose security-intelligence age keeps growing ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 9a40524d8a
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "In endpoint file-handle or ETW telemetry, a non-Defender, non-TrustedInstaller process holding a handle on MRT.exe is a high-confidence signal, and the same process also holding a raw handle on the volume device is rated critical; short-lived hidden GUID-named files in the user temp directory during update failures corroborate it ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
  - claim_id: 457e514b7c
    entry: 2026-10-08/bigdiskbuster-defender-update-starvation-disk-exhaustion-poc
    surface: "body"
    kind: cited
    text: "**Triage:** a handle on the volume device alone is low-specificity because svchost, SearchIndexer, dllhost and TiWorker hold the same kind of handle in normal operation; in LevelBlue's tested environment only the Defender service processes and TrustedInstaller legitimately held a handle on MRT.exe ("
    urls: ["https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"]
