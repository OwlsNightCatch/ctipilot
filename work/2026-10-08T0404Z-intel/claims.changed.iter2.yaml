  - claim_id: 7faaff1157
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: uncited
    text: "This is the second SMA1000 zero-day chain disclosed in seven weeks: a 2026-07-14 entry covers CVE-2026-15409/CVE-2026-15410, an SSRF-to-command-injection pair on a different endpoint pair, exploited for weeks before disclosure and later abused by ransomware affiliates per CISA."
  - claim_id: 7c0ca0888c
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: uncited
    text: "No source ties this new chain to the same UTA0533 cluster or any other named actor — the recurrence is in the vulnerability class and product line, not in a confirmed shared operator."
  - claim_id: ad5267d20d
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
    kind: uncited
    text: "**Triage:** requests to the Work Place interface that trigger outbound connections to internal-only services, or AMC command-execution audit entries not tied to an interactive administrator session, are the observable signature the mechanism supports — a legitimate Work Place session has no reason to originate internal service-to-service traffic."
  - claim_id: 9764150115
    entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
    surface: "body"
