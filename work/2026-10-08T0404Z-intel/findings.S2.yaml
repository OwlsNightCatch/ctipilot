    Veeam's KB4934 (2026-10-06) resolves vulnerabilities in Veeam Backup & Replication 12.3.2 P3 (build 12.3.2.4854) and all earlier version 12 builds, fixed in 12.3.2 P4 (build 12.3.2.4934); version 13 builds are not affected and version 12 reaches end of support on 2027-02-28. The critical flaw (vendor severity Critical, CVSS 4.0 9.4) lets a low-privileged user holding the Backup Viewer role perform remote code execution on the Veeam backup server through insecure deserialization of untrusted data received via the Mount Service; it was reported through HackerOne. A medium flaw (6.1) lets an authenticated Backup Viewer modify or delete the Enterprise Manager master key and read or overwrite stored antivirus-update credentials on the backup server, and a reflected XSS (4.8) affects Veeam Backup Enterprise Manager. No source reports exploitation. CERT-FR and BSI list CVE-2025-64392, CVE-2025-64393 and CVE-2026-93026 against the advisory; Veeam's KB names no CVE ids and no source maps ids to individual flaws.
  region_nexus: global; Veeam Backup & Replication is common backup infrastructure in public-sector estates (not source-stated for Switzerland)
  primary_sector_nexus: indirect
  sector: public-sector
  cves: []
  techniques:
  - T1210
  affected_products:
  - Veeam Backup & Replication 12
  - Veeam Backup Enterprise Manager
  entity_keys:
  - product:veeam-backup-replication
  new_entities: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: A vulnerability allowing a low-privileged user with the Backup Viewer role to perform remote code execution (RCE) on the Veeam Backup Server through insecure deserialization of untrusted data received via the Mount Service.
    attribution: Veeam
    source_url: https://www.veeam.com/kb4934
  - quote: Backup & Replication versions antérieures à 12.3.2 P4 (build 12.3.2.4934)
    attribution: CERT-FR
    source_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1278/
  extended_notes: |
    Cves left empty on purpose: the ids appear only in CERT-FR/BSI lists with no per-flaw mapping (two of them carry 2025 numbers), so they cannot be tied to the Mount Service flaw without guessing; the main agent can add them from the CERT-FR page if it keeps the item.
    Exposure: affected are Veeam Backup & Replication 12.3.2.4854 and all earlier version 12 builds; the Mount Service is part of the backup server; the attacker needs an account with the Backup Viewer role (low privilege), so the realistic attacker is an intruder who already holds backup-console or domain credentials (inference from the stated prerequisite). Upgrade to 12.3.2 P4, or to version 13 (not affected).
    Detection (concept): Veeam backup-server service logs for the Mount Service and for Backup Viewer role sessions; process-creation events with the Veeam service as parent that launch shells or scripting hosts; creation of new backup-role accounts.
    Borderline reasons: authenticated (low-privilege) flaw, no exploitation or PoC reported, S1 overlap (vendor patch cycle); kept because backup servers are the standard ransomware pre-encryption target and CVSS 4.0 9.4 is vendor-rated Critical.
  borderline: true
  borderline_reason: critical but authenticated (Backup Viewer) flaw, no exploitation reported, S1 overlap; backup servers are the standard ransomware pre-encryption target
- title: 'ILIAS learning platform: maintenance releases 9.24, 10.12 and 11.5 fix several RCE flaws (test, CmiXapi and question imports), anonymous download of protected file objects with the public area enabled, and further access-control flaws'
  sources:
  - url: https://security-hub.ncsc.admin.ch/#/posts/13035
    publisher: NCSC Switzerland (Security Hub)
    date: '2026-10-07'
    role: primary
  - url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3783
    publisher: BSI CERT-Bund
    date: '2026-10-07'
    role: corroborating
  - url: https://github.com/ILIAS-eLearning/ILIAS/releases/tag/v11.5
    publisher: ILIAS (GitHub release)
    date: '2026-10-06'
    role: corroborating
  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13035 (via `ncsc-csh recent 30`, created 2026-10-07T07:06Z) -> pivot: bsi-de, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3783 (CSAF via `bsi-csaf`: fixed 9.24, 10.12, 11.5) -> pivot: ILIAS GitHub release, URL https://github.com/ILIAS-eLearning/ILIAS/releases/tag/v11.5; the ILIAS security-blog advisory itself (docu.ilias.de) returns a captcha page to every transport tried, so per-flaw CVE ids and scores were not obtainable.'
  summary: |
    NCSC Switzerland's Security Hub (2026-10-07) reports that multiple vulnerabilities were resolved in the open-source learning management system ILIAS, including several remote code execution flaws. NCSC-CH's reading: RCE is reachable through the test, CmiXapi or question-import functions and generally requires an authenticated user; one notable flaw lets anonymous users download protected file objects when the public area feature is enabled; other fixes cover stored XSS, broken access control, a path-traversal file deletion and unauthenticated user enumeration. Fixed in maintenance releases 9.24, 10.12 and 11.5 (BSI CSAF; the ILIAS GitHub release of 11.5 states it contains security fixes). NCSC-CH lists the exploitation status as unknown and no source reports exploitation. The vendor advisory is behind a captcha, so CVE ids and per-flaw severities are not available here; BSI rates the set high. This is the second ILIAS advisory from NCSC-CH in about four months (the store's 2026-05-28 entry covers the May batch).
  region_nexus: 'Switzerland and DACH: advisory issued by NCSC-CH; the store''s 2026-05-28 entry treats ILIAS as widely used in Swiss federal training and universities (that claim is not re-verified here)'
  primary_sector_nexus: 'indirect: education and public-sector e-learning'
  sector: education
  cves: []
  techniques:
  - T1190
  affected_products:
  - ILIAS (open-source e-learning platform)
  entity_keys:
  - trend:ilias-lms-nine-fixes-2026-05-27-tileimageupload-unauth-write-soap-access-bypass
  new_entities:
  - key: product:ilias
    type: product
    name: ILIAS
    aliases:
    - ILIAS LMS
    - ILIAS e-learning
    summary: Open-source learning management system (ILIAS Open Source e-Learning) used by universities and public-sector training bodies in DACH; NCSC-CH published security advisories for it on 2026-05-27 and 2026-10-07.
  verification: MULTI-SOURCE
  confidence: MEDIUM
  novelty: new
  evidence:
  - quote: Multiple vulnerabilities have been resolved in the open-source learning management system ILIAS, including several remote code execution (RCE) flaws.
    attribution: NCSC Switzerland (Security Hub)
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13035
  - quote: One notable flaw lets anonymous users download protected file objects without permission when the public area is enabled.
    attribution: NCSC Switzerland (Security Hub)
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13035
  - quote: This release contains security fixes.
    attribution: ILIAS (GitHub release)
    source_url: https://github.com/ILIAS-eLearning/ILIAS/releases/tag/v11.5
  extended_notes: |
    Exposure: affected are ILIAS releases before 9.24, 10.12 and 11.5 (BSI CSAF). The anonymous file download applies only where the public area is enabled; the RCE paths need a logged-in user, so self-registration and open course enrolment widen exposure.
    Detection (concept): web-server access logs for requests to the test/CmiXapi/question-import endpoints from newly registered or low-trust accounts; unusual file writes under the web root or data directory after imports; anonymous requests that fetch file objects from the public area.
    Borderline reasons: no CVE ids or severities obtainable, RCE needs an authenticated user, no exploitation reported; kept because NCSC-CH chose to issue a Swiss advisory and the store already tracks ILIAS as Swiss-relevant. Both national CERTs (NCSC-CH, BSI) summarise the same vendor advisory that could not be read, so independence is limited; NCSC-CH is a carve-out authority for its own advisory. The main agent may fold this into the existing ILIAS trend entity rather than a stand-alone entry.
  borderline: true
  borderline_reason: NCSC-CH advisory with RCE wording but authenticated prerequisites, no CVE ids or exploitation; Swiss deployment footprint rests on an earlier store entry
- title: Microsoft will block .msix and .msixbundle attachments by default in Outlook on the web and new Outlook for Windows from early November 2026
  sources:
  - url: https://mc.merill.net/message/MC1488841
    publisher: Microsoft 365 Message Center Archive (MC1488841)
    date: '2026-10-05'
    role: primary
  - url: https://www.heise.de/news/Microsoft-blockiert-MSIX-Dateien-in-Outlook-11479085.html
    publisher: heise online
    date: '2026-10-07'
    role: corroborating
  discovery_trace: 'first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item https://www.heise.de/news/Microsoft-blockiert-MSIX-Dateien-in-Outlook-11479085.html, 2026-10-07T10:24Z) -> primary: Microsoft 365 Message Center post MC1488841 as archived at URL https://mc.merill.net/message/MC1488841 (linked from the heise article; the archive mirrors the Message Center text).'
  summary: |
    Microsoft message MC1488841 (2026-10-05) announces that .msix and .msixbundle will be added to the BlockedFileTypes list of the default OwaMailboxPolicy and of every custom policy in a tenant, so users of Outlook on the web and the new Outlook for Windows can no longer open or download such attachments. Rollout starts early November 2026 and is expected to finish by mid-November 2026 in Worldwide, GCC, GCC High and DoD. Microsoft says most organisations are not expected to be affected because the types are rarely mailed; organisations that do exchange MSIX by mail are advised to add them to AllowedFileTypes on the OwaMailboxPolicy objects before the rollout. heise recalls that Microsoft disabled direct installation through the ms-appinstaller URL scheme in late 2023 after attackers abused it. The sources do not say whether classic Outlook for Windows or other delivery channels (web download, Teams, shared drives) are covered, so the change narrows one mail path for packaged-app delivery and nothing more.
  region_nexus: global; Exchange Online tenants (Swiss public bodies on Microsoft 365 included, not source-stated)
  primary_sector_nexus: indirect
  sector: public-sector
  cves: []
  techniques:
  - T1566.001
  affected_products:
  - Microsoft Outlook on the web
  - Microsoft Outlook (new Outlook for Windows)
  - Microsoft Exchange Online
  entity_keys:
  - product:microsoft-outlook
  new_entities: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: we recommend that you add them to the AllowedFileTypes property
    attribution: Microsoft 365 Message Center Archive (MC1488841)
    source_url: https://mc.merill.net/message/MC1488841
  - quote: Rollout begins in early November 2026 and is expected to complete by mid-November 2026.
    attribution: Microsoft 365 Message Center Archive (MC1488841)
    source_url: https://mc.merill.net/message/MC1488841
  extended_notes: |
    Recommendation: drop unless the main agent wants a one-line mail-hardening note. The defender consequence is a deadline-bound configuration decision (exceptions before early November) rather than a threat finding; the MSIX/AppX abuse the store already tracks (wwahost AppX token theft, 2026-09-27) is delivered by more channels than this mail path.
    Exposure: Exchange Online tenants (the BlockedFileTypes and AllowedFileTypes properties of OwaMailboxPolicy objects, default and custom); no on-premises Exchange coverage is stated.
    Detection: not applicable (preventive control); a hunt hook remains MSIX/MSIXBUNDLE attachments in mail-flow logs before the rollout date.
    Borderline reasons: marginal consequence for most tenants (Microsoft says rarely used), no active campaign cited.
  borderline: true
  borderline_reason: preventive default change with a configuration deadline but no campaign and limited defender consequence; recommend drop
