    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/
  extended_notes: |
    Suggested handling: priority high (no exploitation reported, but two of the three SMA1000 SSRF-plus-RCE rounds this year were exploited before or at disclosure); Admiralty A1 (vendor PSIRT plus four national authorities); builds on 2026-07-14/sonicwall-sma1000-ssrf-cve-2026-15409-actively-exploited and 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection (declare in references[]). Not in CISA KEV at fetch time (run KEV window check lists no additions since 2026-10-07).
    Exposure: affected are SMA1000 builds before 12.4.3-03670 and 12.5.0-03082 (hotfixes released Tuesday 2026-10-06 per BleepingComputer); exposure follows from the Work Place portal or the AMC being reachable from the internet (the sources do not name a vendor-documented way to read the running build). SMA 100 series and firewall-hosted SSL-VPN are not affected (vendor).
    Detection (concept derived from the stated mechanism, no source gives a signature): web/portal access logs of the Work Place listener for requests that cause the appliance to fetch addresses on the requester's behalf or that touch AMC-only functionality from the portal listener; AMC administrator logins and configuration-change audit records without a matching operator; unexpected connections from the appliance towards internal management endpoints; files written outside expected directories after an archive upload in the AMC (Zip Slip). Post-patch: any SMA1000 that ran an affected build on the internet during the July and September exploitation periods warrants the same compromise review as the earlier entries (new admin accounts, config changes, persistence), because patching does not evict an attacker already on the appliance.
    Triage: legitimate AMC administration and normal portal sessions look unremarkable on their own; the discriminator is cross-listener behaviour (portal-side requests that result in management-plane activity) and AMC actions with no preceding administrator authentication. No source states a benign lookalike.
    Defender takeaway: apply the platform hotfix to every SMA1000 that exposes Work Place or AMC without waiting for a KEV listing; the vendor's own earlier hotfix did not end this class of issue.
    Drop reason none; S1 may also return this CVE set (S2 found it through NCSC-CH Security Hub, which the main agent should treat as the home-region anchor).
