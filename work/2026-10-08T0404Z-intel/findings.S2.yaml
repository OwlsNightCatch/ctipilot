    against the MITRE CVE services record (all four PUBLISHED 2026-10-07).'
  summary: |
    SonicWall's advisory SNWLID-2026-0017 (2026-10-06) fixes four flaws in the SMA1000 secure-remote-access appliances (models 6210, 7210 and 8200v). CVE-2026-102255 is a pre-authentication server-side request forgery in the Work Place interface that the vendor attributes to "an unintended alternate access path" (CWE-918 and CWE-441; vendor CVSS 3.0 10.0): a remote unauthenticated attacker can make the appliance issue requests on their behalf, reach internal functionality and perform unauthorized operations. Three further flaws need an administrator session: CVE-2026-102256, an OS command injection leading to code execution (7.8); CVE-2026-102257, a Zip Slip path traversal in the Appliance Management Console (AMC) archive handling that leads to code execution (7.2); and CVE-2026-102258, a stored XSS in the AMC (5.5). SonicWall states there is currently no evidence of in-the-wild exploitation and that SSL-VPN on SonicWall firewalls is not affected. CERT-FR lists the affected builds as SMA1000 12.5 before 12.5.0-03082 and earlier builds before 12.4.3-03670, and BSI's CSAF names the same two fixed builds for all three models.

    The pattern is the reason to treat this as imminent rather than routine. CERT-FR reminds that combinations of an SSRF that bypasses authentication with an authenticated remote-code-execution flaw have already been actively exploited several times this year on this product. BleepingComputer recounts the July zero-days CVE-2026-15409 and CVE-2026-15410 (exploited for weeks to install custom malware, with CISA linking the flaws to ransomware gangs) and the September pair CVE-2026-83548 and CVE-2026-83549; both rounds are already in this store. This is the third SonicWall advisory in under four months that names a pre-authentication Work Place SSRF paired with a post-authentication code-execution flaw; no source says the three share a root cause. BleepingComputer cites Shadowserver tracking over 400 internet-exposed SMA1000 appliances, some possibly already patched. NCSC-CH, NCSC-NL, CERT-FR and BSI all published within a day of the advisory; NCSC-NL's CSAF carries CVSS 10.0 for all four CVEs while the vendor scores them 10.0, 7.8, 7.2 and 5.5, so use the vendor figures.
  region_nexus: global; published by NCSC-CH (Security Hub), NCSC-NL, CERT-FR and BSI; Swiss deployment footprint not stated by any source
