    publisher: Borns IT- und Windows-Blog
    date: '2026-10-07'
    role: corroborating
  discovery_trace: 'first seen at: cert-at, URL https://www.cert.at/de/tagesberichte/2026/10/tagesberichte-07102026 (daily report, ''Sicherheitslücke in Sungrow-Komponente ...'') -> pivot: borncity, URL https://borncity.com/blog/2026/10/07/sicherheitsluecke-in-sungrow-komponente-ermoeglichte-solaranlagen-abzuschalten/ -> primary: Jakkaru Insights, URL https://jakkaru.de/de/artikel/sungrow-vulnerability-exposes-gigawatts-worldwide; corroborating: DIE ZEIT, URL https://www.zeit.de/digital/2026-10/hackerangriff-solaranlagen-sicherheitsluecke-blackout-solarenergie?freebie=a55a2a29 (read through the publisher''s freebie share link with `extract`; the plain URL is paywalled).'
  summary: |
    Jakkaru, a German penetration-testing firm (researcher Marlon Starkloff), published on 2026-10-06 a flaw in the business logic of Sungrow's iSolarCloud management platform, which exists on all four regional cloud servers (Europe, China, Australia, International). In the login request, setting the login_type field to 5 logged the requester in as whichever account was named in user_account while the password field was ignored, and no notification reached the account holder. Administrator and support e-mail addresses were obtainable by walking up the organisation hierarchy or through an undisclosed information leak, which led to the administrative interface of the vendor itself. Jakkaru states that this administrative access allows complete control of all plants on that regional server: listing, modifying, starting or stopping plants, inverters and battery systems, and installing new or custom firmware on every connected device. Jakkaru says it notified Sungrow immediately and that the vendor published a hotfix within a day.

    DIE ZEIT (2026-10-07) says it reproduced and verified the access, counts about 250,000 Sungrow plants with 7.8 GW in Germany and about 220,000 plants with almost 28 GW elsewhere in Europe, and frames the risk as a simultaneous shutdown large enough to cause wide-area outages; it dates the exposure to the end of August. No source reports exploitation by anyone other than the researchers, and no source says whether Swiss installations run on the European server. The remediation sat with the vendor's cloud, so owners had nothing to patch; Jakkaru's advice to owners is to limit cloud connectivity of the plant to firmware retrieval where possible.
  region_nexus: Europe-wide (European iSolarCloud server); DACH counts given for Germany only; Swiss footprint not stated
  primary_sector_nexus: 'indirect: energy infrastructure; municipal and cantonal buildings and utilities with Sungrow-based PV would be affected types (not stated by any source)'
  sector: energy
  cves: []
  techniques:
  - T1190
  - T1078.004
  affected_products:
  - Sungrow iSolarCloud
  entity_keys: []
  new_entities:
  - key: product:sungrow-isolarcloud
    type: product
    name: Sungrow iSolarCloud
    aliases:
    - iSolarCloud
    summary: Sungrow's cloud user and management platform for its solar inverters and battery systems, run as four regional servers; an authentication bypass in its login logic was disclosed on 2026-10-06 (Jakkaru) and fixed by the vendor within a day.
  verification: MULTI-SOURCE
  confidence: MEDIUM
  novelty: new
  evidence:
  - quote: setting the login type to five automatically logged us into the account of the user specified in the user account field. The password field is ignored.
    attribution: Jakkaru Insights
    source_url: https://jakkaru.de/de/artikel/sungrow-vulnerability-exposes-gigawatts-worldwide
  - quote: We immediately notified Sungrow regarding the vulnerabilities and within a day they published a patch, hotfixing the issue.
    attribution: Jakkaru Insights
    source_url: https://jakkaru.de/de/artikel/sungrow-vulnerability-exposes-gigawatts-worldwide
  - quote: Die ZEIT konnte das nachvollziehen und verifizieren.
    attribution: DIE ZEIT
    source_url: https://www.zeit.de/digital/2026-10/hackerangriff-solaranlagen-sicherheitsluecke-blackout-solarenergie?freebie=a55a2a29
  extended_notes: |
    Exposure: owners of Sungrow inverters/batteries connected to iSolarCloud (Europe server). Vendor-side fix; nothing for the owner to patch. A check an owner or integrator can still make: whether the plant's cloud account shows unexpected logins, setting changes or firmware changes in the period up to the end of August 2026 (no source says this is possible to audit; mention only if the main agent keeps the item).
    Detection: none customer-side that any source gives; the abused control is the login API's undocumented login_type field (application-layer-encrypted REST), so it is invisible to network inspection by design (Jakkaru describes asymmetric application-layer encryption of every POST body).
    Defender takeaway: for municipal energy suppliers and public bodies with cloud-managed PV or storage, treat the vendor cloud as part of the control plane: restrict the plant's cloud connectivity to what operations need and ask the supplier for its disclosure and audit position on this flaw.
    Borderline reasons: fix is vendor-side and complete per both sources; no exploitation by others reported; Swiss nexus is not established. Kept as borderline because of the continental-scale impact and the municipal-energy angle (Zeit: unauthorised access to more than 3 GW swing can cause multi-day outages). The first-hand research article is dated 2026-10-06 (before the window start); the mainstream pickup (Zeit, 2026-10-07) is inside it.
  borderline: true
  borderline_reason: vendor-side hotfix already applied, no exploitation reported, Swiss exposure not established; kept for continental-scale energy-infrastructure impact (S2 sector lens)
