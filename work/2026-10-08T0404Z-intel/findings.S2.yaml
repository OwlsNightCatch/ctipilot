  extended_notes: |
    Overlap: S4 independently holds this incident (primary Le Temps, ransomware.live claim record); this S2 record adds the ICTjournal reading (canton SOC and delegate statements), the AWP wire that names the firm, and the leak-site tracker listings. Merge into one entry.
    Source-quality notes: Le Temps is paywalled (lead and metadata read; page date 2026-10-06, AWP says the report ran Wednesday 2026-10-07); the independent first-hand observations are Le Temps' own reporting with an expert analysis and the leak-site listing (a claim). ICTjournal, AWP and Inside IT are relays of Le Temps. Inside IT dates the claim 28 August, the trackers 30 August.
    ATT&CK: only the extortion-by-publication behaviour is source-supported (T1657); no initial access vector, tooling or encryption is reported (the company says it never lost use of its data), so no access technique can be mapped honestly.
    Exposure: any cantonal, communal or private body that used a Romandie security integrator for cameras, alarm buttons, motion detectors or access control; ask the supplier in writing whether the client's site plans, device lists or credentials were in the affected set (Le Temps: clients were warned individually).
    Detection: not a detection-led incident. Hunt-side concept: authentication logs of camera/NVR, alarm and access-control management interfaces for logins from addresses outside the supplier's and the operator's known ranges, and supplier remote-support/VPN sessions into those systems since August; check that those systems are not internet-reachable (the canton's own point: reachability is what turns a leaked model list into a flaw).
    Defender takeaway: rotate any credential a security integrator ever held for physical-security systems (cameras, NVRs, alarm panels, door controllers), confirm the management planes are segmented, and treat leaked floor plans and camera positions as a physical-security exposure that credential rotation does not fix.
