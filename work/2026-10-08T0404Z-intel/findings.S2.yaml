  summary: |
    Le Temps reported on 2026-10-06/07, and ICTjournal, AWP (via cash.ch) and Inside IT relayed on 2026-10-07, that data taken in a ransomware attack on a Vaud security-installation firm is now offered on the darknet. AWP names the firm as Ixa Systems (Crissier), a specialist in video surveillance, access control and burglary protection whose customers include police authorities, banks, hospitals, schools and prisons. According to Le Temps, the group TheGentlemen claimed the theft of a data set at the end of August (leak-site trackers DeXpose and SOCRadar record the listing on 2026-08-30; Inside IT writes 28 August) and the documents were put up for sale on the darknet on 25 September; an expert analysis seen by Le Temps shows how much is reachable and some data has begun to circulate.

    What the reporting says the data contains: infrastructure plans, information on video-surveillance systems and, in some cases, user names or passwords, including the locations of cameras and alarm buttons; Le Temps mentions views from the video surveillance of a vault room at a point of sale. Named exposed bodies are the Établissements de la plaine de l'Orbe and other judicial entities, gendarmerie premises, several banks including the Banque cantonale vaudoise, and several dozen companies; exposure differs by client, for some only tenders or consultations. The company says it never lost use of its data, paid no ransom and that the attack gave no direct access to camera images (the company's own account, not verified). The BCV says in-depth analyses found no particular security problem. The canton of Vaud was told on the day the attack was discovered; its security operations centre works with the company and the risk assessment continues. The canton's cybersecurity delegate Marc Barbezat is quoted that knowing camera models is not enough to exploit a flaw because the devices must be reachable, and he stresses segmentation. The initial access vector, the intrusion timeline and whether the company reported to BACS are not public.
