  - claim_id: 1a63b351f4
    entry: 2026-10-08/power-bi-dashboard-phishing-rogue-screenconnect-clients
    surface: "summary"
    kind: frontmatter
    text: "Huntress describes a phishing campaign seen since 2026-09-10 in which an Outlook email links to a fake reference document on a legitimate Power BI domain; a \"Download Reference\" button opens an attacker page that fingerprints the visitor and then downloads a ScreenConnect installer. The installer deploys a rogue ScreenConnect client that establishes a second one, and in one incident a PowerShell script removed the first; Huntress could not obtain the original email, and the configuration of one of the rogue clients also appeared on 22 other endpoints."
