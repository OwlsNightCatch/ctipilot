    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's sensors have recorded at least 129 attempts from at least 22 addresses, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application."
