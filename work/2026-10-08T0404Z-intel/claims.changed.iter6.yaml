  - claim_id: 2b1cd38343
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-08T04:56:05Z"
    kind: record-summary
    text: "Exploitation attempts began on 2026-10-06, the day watchTowr published its write-up and proof of concept: Previdian's sensors have recorded at least 129 attempts from at least 22 addresses in eight countries, SANS ISC recorded similar attempts against Jira, Confluence and Bitbucket on its own honeypots, all from one cloud provider, and a Nuclei template exists; the Canadian Cyber Centre's bulletin now cites open-source reporting of in-the-wild exploitation. The status moves from patch-available to exploited, with no compromise reported and the flaw not listed in CISA's KEV catalog on Previdian's page."
