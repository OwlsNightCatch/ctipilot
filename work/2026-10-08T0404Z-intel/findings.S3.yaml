      change followed by DNS-based domain validation at a public CA) applies to any domain whose validation can be satisfied by a
      DNS record. Check that your own domain portfolio, including parked variants, is covered by CT monitoring; the vendor-documented
      checks are CT-log alerts and a published CAA record (Google also recommends binding CAA to the ACME account, RFC 8657).
      Detection (telemetry class first): Certificate Transparency monitor alerts for any certificate issued for an owned name by a
      CA or ACME account you do not use; authoritative-DNS change logs and registrar/registry notifications for NS, A and MX
      changes; Google's note that CT data exposed other organizations means a CT search of your own names for September 2026 is a
      cheap retrospective check. Hardening: restrictive CAA with accounturi and validationmethods parameters (the reuse window of up
      to 200 days is what makes a post-hijack CAA valuable), registry/registrar locks where offered (inference; not stated by
      Google), and not relying on browser blocklists for non-Chrome clients, which Google says are not reliably protected.
      Defender takeaway: audit CAA and CT monitoring for every domain the organization owns, including ones nobody uses.
