  - title: "BigDiskBuster: a roughly 300-line Windows proof of concept stops Microsoft Defender updates by claiming all free disk space, with no CVE and no patch"
    sources:
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands", publisher: "LevelBlue SpiderLabs", date: "2026-10-05", role: "primary" }
      - { url: "https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates", publisher: "Dark Reading", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: darkreading (slice record), URL https://www.darkreading.com/rss.xml -> https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates -> primary: LevelBlue SpiderLabs, URL https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"
    summary: |
      LevelBlue SpiderLabs (2026-10-05) reproduced BigDiskBuster, a proof of concept published on GitHub on 2026-09-19 by the actor
      known as MSNightmare (Nightmare Eclipse; the repository has since been taken down). It needs no vulnerability: it watches the
      C:\ volume for Defender update activity and, when an update starts, creates a hidden file under %TEMP% whose allocation size
      equals the free space, so the update fails, Defender clears its staging directory, and the tool re-arms on every size-change
      event. The Defender service keeps running and real-time protection stays on, so service-state and health monitoring show
      nothing; the only visible artifact is a stale security-intelligence version and the generic error 0x80070643. SpiderLabs
      describes about 300 lines of C++ combining a raw handle on the volume device (opened through NtCreateFile), an MRT.exe handle
      opened relative to that volume handle, a recursive ReadDirectoryChangesW watch on the volume root and an oversized allocation
      created hidden and delete-on-close. Dark Reading reports SpiderLabs found it runs under a standard user account. There is no
      CVE, patch or Microsoft advisory; a Microsoft spokesperson told Dark Reading that Defender Antivirus includes detections and
      preventions against the proof of concept. No in-the-wild use is reported.
    region_nexus: "global; any Windows fleet relying on Microsoft Defender"
    primary_sector_nexus: "direct: Microsoft Defender Antivirus is the baseline endpoint control of most Microsoft 365 public-sector estates; a stale-signature gap is invisible to service-health monitoring"
    sector: "cross-sector"
    cves: []
    techniques: [T1685, T1564.001]
    affected_products: ["Microsoft Defender Antivirus", "Microsoft Windows"]
    entity_keys: ["actor:nightmare-eclipse", "product:microsoft-defender-antivirus"]
    new_entities:
      - { key: "tool:bigdiskbuster", type: tool, name: "BigDiskBuster", aliases: [],
          summary: "Roughly 300-line Windows proof of concept published on GitHub on 2026-09-19 by MSNightmare that prevents Microsoft Defender updates by claiming all free disk space during an update; no CVE or patch; reproduced by LevelBlue SpiderLabs (2026-10-05)." }
    relation_suggestions:
      - { subject: "tool:bigdiskbuster", object: "actor:nightmare-eclipse",
          basis: "LevelBlue SpiderLabs: BigDiskBuster was published on GitHub on 2026-09-19 by the actor known as MSNightmare (LevelBlue SpiderLabs, 2026-10-05)" }
    related_entries:
      - "2026-08-12/shieldbreak-defender-rogueplanet-patch-bypass-no-fix"
      - "2026-09-06/chaotic-eclipse-falconflank-prettyprague-edr-av-lpe-drops"
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    lookback: true
    evidence:
      - quote: "At the time of publication, BigDiskBuster has no assigned CVE, available patch, or Microsoft advisory."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"
      - quote: "It watches the C:\\ volume for Defender update activity and, when an update begins, creates a hidden file that claims essentially all available free space."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/filling-the-well-nightmare-eclipses-bigdiskbuster-and-the-defender-update-that-never-lands"
      - quote: "Microsoft Defender Antivirus includes detections and preventions against the PoC"
        attribution: "Dark Reading (quoting a Microsoft spokesperson)"
        source_url: "https://www.darkreading.com/application-security/bigdiskbuster-microsoft-defender-running-blocking-updates"
    extended_notes: |
      Exposure: every Windows endpoint running Defender Antivirus; the technique needs only a user-level process able to write to
      %TEMP% (SpiderLabs ran it from a standard account) and a volume with enough free space to claim. Whether an estate is exposed
      is observable as endpoints whose security-intelligence age keeps growing.
      Detection (telemetry class first, from SpiderLabs): (1) endpoint handle or ETW file-object telemetry: the same non-OS process
      holding both a handle on the C:\ volume device and a persistent handle on MRT.exe opened through the volume handle is the
      highest-confidence signal (SpiderLabs rates it Critical; volume-device handles alone are low-specificity because svchost,
      SearchIndexer, dllhost and TiWorker hold them; legitimate MRT.exe holders in its tests were Defender service processes and
      TrustedInstaller); (2) file-creation telemetry: brace-GUID-named hidden files appearing and vanishing in the user's %TEMP%
      during Defender update failures; (3) update health: recurring 0x80070643 platform or signature update failures with no
      installer activity, the Defender update chain (svchost, wuauclcore, UpdatePlatform.amd64fre, MpSigStub, MpRecovery) starting
      and failing while free space on C: collapses; (4) fleet monitoring of Defender signature and platform age rather than service
      state. SpiderLabs supplies a SentinelOne query joining GUID-named temp-file creation with MpRecovery.exe execution within
      30 seconds (not carried; vendor query code). Post-event check: a host that shows the pattern should be treated as having had
      stale detections for the whole interval, so look back for malware that would have been caught by the missed updates.
      Triage: 0x80070643 is a generic installer error with many benign causes; SpiderLabs treats it as an investigative trigger
      only in combination with handle or hidden-allocation evidence, not on its own.
      Defender takeaway: add a "protection content is current" check to endpoint monitoring; service-running is not a health
      signal for this class. Microsoft advises keeping security intelligence and platform updates current. No hardening switch
      is named by either source.
    borderline: false
