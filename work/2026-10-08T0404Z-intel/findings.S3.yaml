  - title: "FortiBleed: FBI and Secret Service joint advisory of 2026-10-06 says the campaign is still active, new admin accounts and deleted accounts lock owners out, and the chain feeds ransomware affiliates"
    sources:
      - { url: "https://www.ic3.gov/CSA/2026/261006.pdf", publisher: "FBI and U.S. Secret Service (joint cybersecurity advisory JCSA-20261006-01)", date: "2026-10-06", role: "primary" }
      - { url: "https://thehackernews.com/2026/10/fbi-warns-fortibleed-remains-active.html", publisher: "The Hacker News", date: "2026-10-07", role: "corroborating" }
    discovery_trace: "first seen at: socradar (slice record), URL https://socradar.io/blog/ (listing item 'FortiBleed Is Still Active, Locking Organizations Out') -> THN https://thehackernews.com/2026/10/fbi-warns-fortibleed-remains-active.html -> primary: FBI/USSS advisory PDF read with `fetch_source.py pdf`, URL https://www.ic3.gov/CSA/2026/261006.pdf (16 of 36 PDF streams decoded to text; the technical sections and key actions were readable, the IP table and some figures were not)"
    summary: |
      Delta on the existing FortiBleed entry. The FBI and U.S. Secret Service published joint advisory JCSA-20261006-01 on
      2026-10-06 stating that FortiBleed is an active, global credential-compromise campaign against internet-facing FortiGate
      firewalls and SSL VPN gateways (SOCRadar verified more than 86,644 compromised devices across 194 countries), exploiting
      reused or leaked credentials and legacy SHA-256 password storage, with attackers continuing to scan exposed Fortinet
      firewalls using previously obtained credentials. New in the advisory: owners may be locked out because the actors create
      new administrative accounts on the firewall for persistence and in some cases delete or change the passwords of the original
      accounts [T1531]; the attack chain "has been observed as an initial entry point for ransomware affiliates"; SSH may also
      have been used where the port was open on the firewall; and the advisory lists commonly seen rogue account names and
      infrastructure observed in victim logs (IOCs, not carried). The advisory's workflow description (from the operators' exposed
      backend) is internet scanning for exposed FortiGate SSL VPN portals, credential stuffing and password spraying from leak dumps
      and infostealer logs, a GPU cracking cluster for hashes, validation and prioritisation of victims, firewall persistence,
      then Active Directory enumeration and password spraying, and selling of VPN configurations as an initial-access broker.
      Key actions: restrict external management via trusted hosts (good), local-in policy (better) or remove internet administration
      (best); terminate all admin and VPN sessions and reset every Fortinet VPN and administrative credential; require
      phishing-resistant MFA on remote access and administrative accounts. THN (not independent) adds that earlier reporting linked
      the operation to INC and Lynx ransomware and that CISA had earlier urged PBKDF2 for administrator credential storage.
    region_nexus: "global (194 countries per SOCRadar via the advisory); applies to all 16 U.S. critical-infrastructure sectors including emergency services and government facilities"
    primary_sector_nexus: "direct: FortiGate SSL VPN and firewalls are widely deployed in Swiss and European public administrations; the advisory names government facilities and emergency services among the audience"
    sector: "cross-sector"
    cves: []
    techniques: [T1595, T1190, T1110.004, T1110.003, T1003, T1110.002, T1136.001, T1078, T1087, T1531]
    affected_products: ["Fortinet FortiGate", "Fortinet FortiGate SSL VPN"]
    entity_keys: ["incident:fortibleed-fortigate-credential-exposure", "product:fortinet-fortigate", "product:fortinet-fortigate-ssl-vpn"]
    new_entities: []
    relation_suggestions: []
    related_entries:
      - "2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed"
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    classification_suggestion: { reliability: A, credibility: 2 }
    novelty: "update-of:2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed"
    evidence:
      - quote: "Affected organizations may find themselves locked out of their systems if threat actors disable accounts or change passwords, requiring remediation steps beyond standard patching and password resets."
        attribution: "FBI and U.S. Secret Service"
        source_url: "https://www.ic3.gov/CSA/2026/261006.pdf"
      - quote: "In addition, the FortiBleed attack chain has been observed as an initial entry point for ransomware affiliates."
        attribution: "FBI and U.S. Secret Service"
        source_url: "https://www.ic3.gov/CSA/2026/261006.pdf"
      - quote: "Terminate all admin and VPN sessions and reset credentials."
        attribution: "FBI and U.S. Secret Service"
        source_url: "https://www.ic3.gov/CSA/2026/261006.pdf"
      - quote: "Initial findings indicate attackers are continuing to scan internet-exposed Fortinet firewalls using previously obtained compromised credentials."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/10/fbi-warns-fortibleed-remains-active.html"
    extended_notes: |
      Exposure: internet-facing FortiGate management and SSL VPN portals whose administrator or VPN passwords predate June 2026 or
      that still store administrator passwords with the legacy SHA-256 scheme; the advisory is credential-driven, not a firmware
      flaw, so patching does not change exposure.
      Detection (telemetry class first, from the advisory): firewall configuration and admin audit logs for administrator accounts that
      were created or deleted outside change control (compare against the advisory's rogue-name list); authentication logs for
      credential stuffing and password spraying against the SSL VPN and management interface, and for successful logins from
      addresses without history; session logs showing administrator sessions from unexpected sources; post-compromise: Active
      Directory enumeration and password-spraying from the VPN address pool. Account deletion and password changes by the actor can
      lock the owner out, so out-of-band console access and a verified configuration backup are prerequisites for recovery.
      Defender takeaway: a Fortinet estate that has not rotated all VPN and administrator credentials since June, restricted management
      access (trusted hosts or local-in policy) and enforced phishing-resistant MFA is still exposed to a ransomware initial-access
      chain; check admin-account inventories on every FortiGate now.
    borderline: false
