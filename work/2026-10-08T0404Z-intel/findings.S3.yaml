    discovery_trace: "first seen at: hackernews (discovery-tail feed sweep), URL https://feeds.feedburner.com/TheHackersNews -> https://thehackernews.com/2026/10/atlassian-data-center-flaw-draws.html -> primary: SANS ISC diary https://isc.sans.edu/diary/33406 (found through the sans-isc feed https://isc.sans.edu/rssfeed.xml) and Previdian https://previdian.com/CVE-2026-21589"
    summary: |
      Delta on the existing CVE-2026-21589 entry, which records that no exploitation was reported as of 2026-10-05. SANS ISC (Johannes
      Ullrich, 2026-10-07) says its honeypots began receiving exploit attempts the day before, using the URLs from watchTowr's
      write-up (traversal written with double-colon sequences under the product web-resource download paths, targeting WEB-INF
      files such as web.xml and urlrewrite.xml for Jira, Confluence and Bitbucket); all source addresses are at one cloud hosting
      provider and Ullrich believes a single actor is behind them; he notes the target file must exist, so web.xml, which every
      Tomcat application has, serves as the equivalent of /etc/passwd. Previdian's honeypot telemetry, as relayed by The Hacker News and
      shown on its own page, reports 15 exploitation attempts from three addresses in Japan and the United States beginning about
      two hours after watchTowr published, rates exploitation as confirmed, and notes the flaw was not in the CISA KEV catalog when
      the page was read; Previdian's CEO expects a Nuclei template to drive mass scanning. Neither source reports a successful
      compromise.
    region_nexus: "global; Data Center installations of eight Atlassian products"
    primary_sector_nexus: "direct: self-managed Jira, Confluence and Bitbucket are common in public-sector IT; credential files read via the flaw (crowd.properties) lead to administrator access per watchTowr in the existing entry"
    sector: "technology"
    cves: [CVE-2026-21589]
    techniques: [T1190, T1552.001]
