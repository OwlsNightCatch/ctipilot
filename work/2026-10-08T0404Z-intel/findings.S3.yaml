  - title: "PoeLLM: a cryptomining botnet exploits exposed LiteLLM, Ollama, Gotenberg and Gitea servers and keeps its C2 address in a GitHub poem"
    sources:
      - { url: "https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware", publisher: "Lumen Black Lotus Labs", date: "2026-10-07", role: "primary" }
