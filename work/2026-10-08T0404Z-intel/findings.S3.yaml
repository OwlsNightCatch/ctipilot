    discovery_trace: "first seen at: cyberscoop (slice record), URL https://cyberscoop.com/feed/ -> article https://cyberscoop.com/poellm-malware-botnet-poem-lumen-black-lotus-labs/ (article links no report) -> WebSearch (\"Black Lotus Labs PoeLLM botnet poem GitHub command and control LiteLLM Ollama\") no hit -> WebSearch (\"PoeLLM\" Black Lotus Labs Lumen report) no hit -> pivot: Lumen Black Lotus Labs hub https://www.lumen.com/blog-and-news/en-us/black-lotus-labs (JS shell, read through the jina reader) -> primary: https://www.lumen.com/blog/en-us/canto-incognito-tracking-the-poellm-malware. Note: the primary's own page metadata carries date 2026-03-16 (wrong); the hub listing dates it October 7, 2026 and CyberScoop calls it a Wednesday report (2026-10-07)."
    summary: |
      Lumen's Black Lotus Labs (report of 2026-10-07, campaign name "Canto Incognito") tracks PoeLLM, a Linux malware campaign
      active since at least April 2026 that exploits vulnerable internet-facing AI and developer services (LiteLLM, Ollama, Gotenberg,
      Gitea, with possible targeting of Ivanti Sentry) to run cryptominers and turn each victim into a scanner and exploit server.
      Lumen counts more than 3,400 victim servers (peak of roughly 800 active per day in mid-June), mainly in the United States and
      Western Europe. Lumen found the infrastructure in June while investigating exploitation of the Ivanti Sentry flaw
      CVE-2026-10520. Scanning concentrates on TCP 3000 (Gotenberg) and 4000 (LiteLLM); an exploit server sends a crafted POST that
      makes the target download a payload from the C2 on port 81, and the implant then beacons to one of several C2 ports. Lumen
      says the LiteLLM endpoint targeted for abuse, /mcp-rest/test/connection (referenced in CVE-2026-42271), was likely the
      exploitation path; it states it found no direct evidence of exploitation for the router CVEs it mentions. The payload (an ELF file named libgcrypt)
      carries remote-shell, XMRig and Iron miner, HTTP/S scanning and exploit-deployment functions, and victims reach the Kryptex
      mining pool. The C2 mechanism is unusual: the malware parses a poem committed to a GitHub repository (a fork of the nodejs.org
      site source, in a CSS file name absent from the original), extracts four words at fixed text anchors, maps each through a
      hard-coded dictionary to a number and combines the four numbers into the C2 IPv4 address; the actor has edited the poem 11
      times since 2026-04-13 so infected hosts re-derive the C2 without a new binary. Lumen researcher Ryan English tells CyberScoop
      the resulting C2 address is invisible outside the victim's own netflow. Early C2s were compromised routers with exposed Boa web servers (Lumen says the actor repeatedly reused vulnerable routers as malware hosts and C2s), and
      recent traffic toward SSH and login portals suggests experiments with distributed brute force (maturity uncertain). Lumen
      assesses an Italian-speaking, financially motivated actor (Italian-language code comments, Italy-hosted admin and test servers);
      CyberScoop quotes Lumen that the actor's gains beyond scanning and mining remain under investigation and that the malware has
      remote code execution functions that could let the actor abuse AI models on victim servers.
    region_nexus: "Western Europe is named by Lumen as a predominant victim region alongside the United States; no Swiss victim is named"
    primary_sector_nexus: "indirect: public-sector bodies that self-host LiteLLM or Ollama AI gateways, Gotenberg PDF conversion in document workflows, or Gitea source hosting"
