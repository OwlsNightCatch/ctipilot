  - title: "Phishing links hosted on a public Power BI dashboard deliver rogue ScreenConnect clients, with a second RMM installed and the first removed"
    sources:
      - { url: "https://www.huntress.com/blog/screenconnect-power-bi", publisher: "Huntress", date: "2026-10-07", role: "primary" }
    discovery_trace: "first seen at: huntress (major-publisher spot check), URL https://www.huntress.com/blog/rss.xml -> primary (no pivot needed): https://www.huntress.com/blog/screenconnect-power-bi"
    summary: |
      Huntress (2026-10-07) describes a phishing campaign it first saw on 2026-09-10 in which an Outlook email links to a fake
      reference document on a legitimate app.powerbi.com page: the actor builds a real dashboard under its own (compromised or
      throwaway) account, embeds a malicious link and sets sharing to public, which Huntress says lets the link pass Microsoft 365
      mail filters and gateways that trust the domain. A "Download Reference" button opens a new tab on an attacker domain that
      fingerprints the browser and environment (OS, browser, automation indicators, cloud-provider cookies), reports victims to a
      hard-coded Telegram bot, redirects failed checks, and after a delay triggers a download of a ScreenConnect client installer
      from a reused ScreenConnect tenant, with a per-lure guest-access parameter. The first rogue client connects to an attacker
      relay and sets up a second rogue client on a different attacker host; in one incident the first client ran a CMD file that
      launched a PowerShell script from the temp directory, which installed the second RMM and uninstalled the first, then a
      defense-evasion tool (HideUL_x64.exe) ran and a scheduled task re-ran the script every two minutes before Huntress's SOC shut
      it down. A retroactive hunt found the same client configuration on 22 other endpoints across separate incidents. Huntress
      does not name an actor or what the access was sold or used for.
    region_nexus: "global; no regional targeting stated"
    primary_sector_nexus: "direct technique relevance: Microsoft 365 tenants (Power BI public sharing) and any estate that lets unapproved RMM clients run"
