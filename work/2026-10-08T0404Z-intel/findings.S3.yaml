  - title: "ClingSTUN: a Linux IoT backdoor exploits about two dozen known device flaws and uses public STUN servers for NAT traversal instead of a classic C2"
    sources:
      - { url: "https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure", publisher: "Fortinet FortiGuard Labs", date: "2026-10-05", role: "primary" }
