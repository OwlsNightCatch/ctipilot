  - title: "CrocoRat: a ClickFix paste command that fetches its next PowerShell step from a DNS TXT record, then runs a bundled Python RAT"
    sources:
      - { url: "https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/", publisher: "Flare Research", date: "2026-10-06", role: "primary" }
      - { url: "https://www.darkreading.com/cyberattacks-data-breaches/clickfix-attacks-evolve-better-hide-malicious-payloads", publisher: "Dark Reading", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: darkreading (slice record), URL https://www.darkreading.com/rss.xml -> https://www.darkreading.com/cyberattacks-data-breaches/clickfix-attacks-evolve-better-hide-malicious-payloads -> primary: Flare, URL https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/ (Dark Reading's second example, a Microsoft Threat Intelligence note on browser-cache payload pre-fetching, was shared on X only and is not carried)"
    summary: |
      Flare Research (2026-10-06) documents CrocoRat, a previously undocumented Python-based remote access trojan and cryptocurrency
      stealer delivered by ClickFix from a typo-squatted lure page that shows a fake reCAPTCHA box under spoofed Cloudflare branding.
      Page JavaScript fetches a command from the lure host and writes it to the clipboard with navigator.clipboard.writeText(), and
      the victim is told to press Windows+R and paste. The pasted PowerShell one-liner looks harmless: it calls Resolve-DnsName for a
      TXT record, but against the attacker's own DNS server, and the TXT answer is the real instruction (download a script and pipe
      it to Invoke-Expression), so the second stage never appears in the clipboard string or in clipboard-history capture. The
      script wipes and recreates C:\ProgramData\App, downloads a ZIP that carries its own Python runtime, packages and native
      modules, launches two Python components with the windowless pythonw.exe, registers a hidden scheduled task named like an
      application updater that runs at logon, and deletes the ZIP. The persistent component fetches an AES-GCM key from the C2
      (TLS verification disabled) to decrypt a local payload in memory (a "CrocoRat 1.0 HTTPS Client"); the other decrypts encrypted
      Python bytecode for a browser stealer (Chrome, Edge, Brave; DLL injection into the browser over named pipes, which Flare says
      is consistent with App-Bound Encryption bypass tooling but rests on static analysis) and a wallet and seed-phrase collector.
      Flare found a launcher script, not executed in any sample it captured, that compares USERDOMAIN with COMPUTERNAME and runs the
      RAT only (scheduled every 15 minutes) when they differ, or the RAT plus the stealer when they match; Flare cautions the
      heuristic is imperfect (Entra ID joined machines report AzureAD, so they would be treated as organizational). Flare captured
      packages from late August to late September, saw filenames, keys and infrastructure change between snapshots, could not
      recover the RAT's final payload because the C2 withheld the key from its lab, and says the attacker infrastructure was
      probably detected and taken down by late September. Attribution evidence is very limited (well-formed Russian-language
      comments; Flare suggests either heavy LLM use by a Russian speaker or a proficient developer).
    region_nexus: "global; no regional targeting stated"
    primary_sector_nexus: "direct technique relevance: domain-joined enterprise endpoints are the RAT-only branch; any public-sector Windows fleet reachable through ClickFix lures"
    sector: "cross-sector"
    cves: []
    techniques: [T1204.004, T1059.001, T1071.004, T1105, T1053.005, T1027, T1555.003, T1055.001, T1497]
    affected_products: ["Microsoft Windows", "Google Chrome", "Microsoft Edge", "Brave"]
    entity_keys: []
    new_entities:
      - { key: "malware:crocorat", type: malware, name: "CrocoRat", aliases: [],
          summary: "Previously undocumented Python-based RAT and cryptocurrency stealer delivered by a ClickFix lure that stages its next PowerShell step in a DNS TXT record; documented by Flare Research on 2026-10-06 from packages captured between late August and late September 2026." }
    relation_suggestions: []
    related_entries:
      - "2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign"
      - "2026-09-29/push-security-clickfix-h2-2026-detection-review"
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    lookback: true
    evidence:
      - quote: "Systems that appear domain-joined receive the RAT path, while standalone systems receive the RAT path plus a broader theft workflow targeting browsers, stored credentials, cryptocurrency wallets, and seed phrases."
        attribution: "Flare Research"
        source_url: "https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/"
      - quote: "PowerShell commands that use Resolve-DnsName to query TXT records against an explicit external resolver are especially suspicious when followed by web retrieval or archive extraction."
        attribution: "Flare Research"
        source_url: "https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/"
      - quote: "A non-executed script in the update.zip file, suggests the malware authors are trying to distinguish between various environments."
        attribution: "Flare Research"
        source_url: "https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/"
      - quote: "In late September the attackers infrastructure was no longer usable (probably detected and takendown), thus we decided to stop our recovery attempts and publish this article."
        attribution: "Flare Research"
        source_url: "https://flare.io/learn/resources/blog/crocorat-clickfix-dns-payload-delivery/"
    extended_notes: |
      Exposure: any Windows endpoint where users can open the Run dialog and PowerShell is not constrained (no Constrained Language
      Mode, no script-block logging, no application control on interpreters). The lure delivery route is unknown (Flare does not know
      how victims reached the page). Because infrastructure was reported down by late September, the value of this item is the
      technique (DNS TXT as a staging channel and portable-interpreter deployment), not an active campaign alert.
      Detection (telemetry class first; all from Flare except where marked): process creation with parent lineage: powershell.exe
      started shortly after a browser visit to a verification, CAPTCHA or Cloudflare-themed page with a command line containing a
      TXT lookup, a download, or execution from a writable directory; PowerShell script-block logs showing Resolve-DnsName with
      an explicit external -Server followed by iwr or Invoke-Expression of the answer; DNS or firewall logs showing an endpoint
      sending TXT queries directly to an external resolver instead of the corporate one (inference: this is the network-side
      view of the same call); scripting runtimes executing from ProgramData, AppData, Temp or Downloads (here a bundled
      pythonw.exe in C:\ProgramData\App making connections to bootstrap.pypa.io or pypi.org); scheduled tasks created by a script
      interpreter that run Python or PowerShell from user-writable paths (this build used AppUpdatePythonRunner and AdvancedIPRun);
      unexpected DLL loads and named-pipe activity in Chrome, Edge or Brave. Post-compromise check: Flare says to assume credential
      and wallet exposure on a confirmed host: preserve memory, export scheduled tasks, collect C:\ProgramData\App, and review
      browser sessions, saved credentials, password-manager and cloud sign-ins.
      Triage: Resolve-DnsName with -Type TXT is a normal administrative cmdlet (SPF and DKIM checks); the discriminating features
      are its parent (explorer.exe after a Run-dialog paste rather than an admin console), an explicit external resolver and the
      answer being piped to an interpreter (inference from the mechanism, not stated by Flare).
      Defender takeaway: single-layer command-line inspection of the pasted text misses this chain; hunt the sequence (Run-dialog
      PowerShell, TXT lookup against a non-corporate resolver, interpreter from a writable path, scheduled task) and block direct
      outbound DNS from endpoints. Do not carry the lure domain, IPs or hashes (IOCs).
    borderline: false
