    extended_notes: |
      Source independence: THN and The Register (both listed in the feeds read, not fetched) rewrite the same Lumen report; CyberScoop
      adds a Lumen researcher interview. One first-hand origin, so verification is single-source (vendor research lab, first-hand
      netflow telemetry).
      Exposure: internet-reachable LiteLLM proxies (the abused endpoint needs a valid proxy key per the existing CVE-2026-42271 entry),
      Gotenberg (no authentication by design; Lumen quotes its install guidance warning not to expose it), Ollama and Gitea. Lumen's
      identification of exposed hosts used open ports and banners; the defender equivalent is an external attack-surface check of every
      host installed for an AI, document-conversion or source-hosting project (Lumen names TCP 3000 for Gotenberg and 4000 for LiteLLM).
      Detection (telemetry class first): (1) network flow and firewall logs: a server that normally only receives requests starting
      outbound connections to many addresses on TCP 3000 and 4000 (scanner behaviour), outbound HTTP to a C2 on port 81, or beacons to
      ports 3778, 5001, 5002 or 9999; (2) proxy or DNS logs: a non-developer server repeatedly fetching the same small CSS or text file
      from a GitHub repository (raw content), followed by a connection to a new bare IP address, is the resolution step of the poem
      mechanism; (3) endpoint or cloud workload telemetry: sustained CPU or GPU load, miner processes and connections to a Kryptex
      mining endpoint; (4) application access logs: POST requests to the LiteLLM /mcp-rest/test/connection path from addresses that
      are not the admin console. Post-patch check: patching LiteLLM does not remove a miner or a scanner already installed; look for
      the payload and persistence on hosts that were exposed since April 2026, and rotate every API key and model-provider
      credential stored on the host (Lumen names LLM jacking, token abuse and lateral movement as the risks; the credential-rotation
      step is an inference from that).
      Triage: GitHub fetches from servers are normal for developer or build hosts; the discriminator is a host with no
      development role fetching one file repeatedly and then changing its outbound destination each time the file changes.
      Defender takeaway: AI gateways and PDF converters are being added to estates faster than they are added to the
      exposure inventory; put every such service behind authentication and off the internet, and treat any that was exposed as
      possibly compromised. C2 IPs and the GitHub account are IOCs and are intentionally not carried.
