    summary: |
      FortiGuard Labs (2026-10-05) analyzes ClingSTUN, a Linux back-connect proxy backdoor that turns compromised devices into
      remotely controlled proxy nodes. Delivery uses command-injection and code-injection flaws in internet-facing devices (the
      list spans EnGenius, D-Link, Linear eMerge, Realtek SDK, TP-Link Archer AX21, Sunhillo SureLine, Ivanti Connect Secure
      CVE-2024-21887 and CVE-2023-46805, Tenda, Hytec, AVTECH, MeiG, Lantronix and others) and the downloader fetches builds for
      ARM, x86, MIPS and PowerPC; FortiGuard saw three delivery periods with different download hosts and a growing exploit list,
      and the implant carries seven more hard-coded exploits for self-propagation. On the device it opens /dev/watchdog and
      disables the watchdog timer, kills processes whose executables sit in /tmp or /var/tmp and processes whose command line does
      not match their binary, persists through /etc/inittab, /etc/init.d/rcS and /etc/rc.d/rc.boot with hidden copies in /root and
      /usr/local/bin, clears its command line, and (as root) bind-mounts a copy of selected /proc/1 files over its own /proc/<pid>
      directory to pose as the init process. Its communication is the unusual part: it sends standard 20-byte STUN binding
      requests from a random UDP port to 24 public STUN endpoints (13 in the third variant, all of which must answer), then
      periodically sends a group identifier and mapped-port list to the same endpoints; a 20-byte operator datagram triggers
      remote command execution (the device opens a TCP connection to an operator-specified endpoint and runs the command it
      receives) and self-propagation. FortiGuard says how the operator learns the external mapping and reaches the device through
      NAT remains unverified, that the public STUN servers should not be classed as attacker infrastructure, and that detection
      should look at whether STUN behaviour fits the device's role.
    region_nexus: "global; no regional targeting stated"
    primary_sector_nexus: "indirect: exposed routers, cameras, building-access controllers (Linear eMerge) and legacy Ivanti Connect Secure appliances in public-sector networks"
    sector: "cross-sector"
    cves: [CVE-2024-21887, CVE-2023-46805, CVE-2019-7256, CVE-2023-1389, CVE-2021-36380]
    techniques: [T1190, T1105, T1090, T1095, T1037.004, T1036.005]
    affected_products: ["Ivanti Connect Secure", "Linear eMerge", "TP-Link Archer AX21", "D-Link routers", "EnGenius", "Realtek SDK", "Sunhillo SureLine"]
