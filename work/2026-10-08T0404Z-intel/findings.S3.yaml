    discovery_trace: "first seen at: hackernews (discovery-tail feed sweep), URL https://feeds.feedburner.com/TheHackersNews -> https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html -> primary: Google, URL https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/ -> corroboration: Let's Encrypt community forum thread (a Let's Encrypt staff member confirms issuance and revocation, per THN)"
    summary: |
      Google's Chrome security team said on 2026-10-06 that attackers compromised the third-party country-code TLDs .gh (Ghana),
      .sl (Sierra Leone) and .as (American Samoa), modified authoritative DNS records and obtained unauthorized HTTPS certificates
      covering several Google domains and domains of other organizations; Google's own systems were not breached and it has no
      reason to believe the issuing CAs erred. Chrome blocked the certificates through CRLSets and the CAs revoked them; Google
      also blocked certificates it found through Certificate Transparency for other organizations (it names no other brands, no
      attacker, no date of the hijacks and no root cause at the registries). The Hacker News, reading CT logs itself on 2026-10-07,
      found at least 12 domain-validated certificates for Google and YouTube names under the three ccTLDs logged between 2026-09-22
      and 2026-09-27 (11 from Let's Encrypt, one from ZeroSSL), revoked between 2026-09-26 and 2026-10-01, which puts the shortest
      gap between logging and revocation at about a day and a half and the longest at nearly a week; a Let's Encrypt staff member
      confirmed issuance and revocation on the community forum. Google asks domain owners to monitor CT for their whole domain
      portfolio including parked and regional ccTLD names, and to publish restrictive CAA records bound to specific ACME accounts
      and validation methods, because CAs may reuse a completed domain-control validation for later issuance and a strict CAA
      record blocks that reuse once the owner regains DNS control. THN adds that CAA cannot stop issuance during an active hijack,
      and that the CA/Browser Forum rules let validation be reused for up to 200 days today (100 days from March 2027).
    region_nexus: "global; affected ccTLDs are Ghana, Sierra Leone and American Samoa; no Swiss (.ch, .li) involvement is reported"
