        attribution: "Fortinet FortiGuard Labs"
        source_url: "https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure"
    extended_notes: |
      Exposure: internet-facing embedded Linux devices on the vendor and CVE list in the primary; an inventory of firmware versions
      and support status is the vendor's own recommendation. Notable for this constituency: Ivanti Connect Secure CVE-2024-21887 and
      CVE-2023-46805 are on the initial-access list, so an unpatched appliance is a botnet target as well as an intrusion target.
      Detection (telemetry class first): network flow: a device with no VoIP or WebRTC role sending UDP STUN binding requests
      to many public STUN endpoints, using several UDP sockets and recurring custom messages with a group identifier and mapped-port
      list (FortiGuard, via Dark Reading), followed by a new outbound TCP connection after an inbound 20-byte datagram; on devices
      that allow file or process inspection: a process whose /proc/<pid> content mirrors PID 1, an empty command line, hidden
      .cling-style copies in /root and /usr/local/bin, additions to /etc/inittab, /etc/init.d/rcS and /etc/rc.d/rc.boot, and
      /dev/watchdog opened by a non-init process. Blocking public STUN wholesale would break legitimate VoIP and WebRTC (Dark Reading,
      quoting FortiGuard).
      Triage: public STUN traffic is normal for phones, conferencing endpoints and browsers; the discriminator is device role
      plus the number of distinct STUN endpoints, multiple UDP sockets and recurring fixed-format keepalives.
      Defender takeaway: for edge and IoT estates the control is exposure reduction and firmware lifecycle, since the exploited
      flaws are known and patched or end-of-life. IOCs (download hosts, STUN endpoint list) intentionally not carried.
    borderline: true
    borderline_reason: "embedded-IoT botnet analysis with network-side detection value only; indirect constituency relevance (exposed edge and building-access devices); Fortinet write-up is the sole first-hand source"
