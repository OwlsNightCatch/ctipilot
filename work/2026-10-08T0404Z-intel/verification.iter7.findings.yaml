- code: F3
  category: claim-not-supported
  section: "entries/2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access (Update 2026-10-08T04:56:05Z)"
  item: "Atlassian CVE-2026-21589: Previdian telemetry sentence added by the iteration-6 remediation"
  url_or_quote: "\"(its timeline lists the first sensor observation at 21:55 UTC)\" ([Previdian, 2026-10-08](https://previdian.com/CVE-2026-21589))"
  summary: "The page's Timeline section (From disclosure to observed exploitation) lists 'Observed by Previdian sensors' at 06 Oct 2026 20:52 UTC (datetime 2026-10-06T20:52:18Z). 21:55 UTC appears only in the Exploitation-evidence table row 'Previdian Sensors First | 2026-10-06 21:55 UTC' and the callout 'before Previdian confirmed it as a KEV at 21:55 UTC', i.e. the KEV-confirmation time, not the timeline's first observation. Fix: say 20:52 UTC (or drop the parenthetical); if kept, state watchTowr's publication time (2026-10-06 17:01 UTC per the watchTowr page's article:published_time) so the gap against 'within two hours' is explicit."
- code: F4
  category: hallucinated-fact
  section: "entries/2026-10-08/ixa-systems-vaud-security-integrator-thegentlemen-sale (headline)"
  item: "Ixa Systems: headline"
  url_or_quote: "\"Camera locations, site plans and some credentials of Vaud police, prison and bank sites reported for sale\""
  summary: "(low confidence) None of the readable sources places the police sites in Vaud: AWP says only 'Polizeibehoerden' among Ixa's customers; ICTjournal says 'des locaux de la gendarmerie' with no canton; only the prisons (Etablissements de la plaine de l'Orbe) and the Banque cantonale vaudoise are Vaud-specific, and ICTjournal/Le Temps describe the client base as 'romande'. Reword to 'police, prison and bank sites' or 'Vaud prison and bank sites and police premises'. The paywalled Le Temps body may carry the detail, so this is unconfirmed."
- code: F4
  category: hallucinated-fact
  section: "entities/registry.yaml (relation note on incident:ixa-systems-thegentlemen-2026-08)"
  item: "Ixa Systems incident record, edge to actor:thegentlemen"
  url_or_quote: "\"the firm has not attributed it, so the edge rests on the group's own claim and is not attributed-to\""
  summary: "(low confidence) No source read (Le Temps lead, ICTjournal, AWP via cash.ch, Inside IT) states the firm's position on attribution; they say only that TheGentlemen announced and claimed the theft at the end of August. Replace with 'no source reports the firm confirming the attribution'."
- code: F4
  category: hallucinated-fact
  section: "entries/2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection (sourcing_note, unchanged by this run)"
  item: "Older SonicWall entry: sourcing_note"
  url_or_quote: "\"that detail is cited to SecurityWeek and BleepingComputer, both independently reporting the same figures\""
  summary: "(low confidence) BleepingComputer's 2026-09-02 article gives the affected models (6210, 7210, 8200v) but no hotfix version numbers (it says only 'upgrade ... to the latest hotfix version'); the body now cites only SecurityWeek for models and hotfix builds. 'Both ... the same figures' is not true for the builds. Fix: attribute the builds to SecurityWeek (and, since 2026-10-07, The Hacker News) and the models to SecurityWeek and BleepingComputer."
- code: F18
  category: action-item-discipline
  section: "entries/2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection (actions[0])"
  item: "Older SonicWall entry: first action still names the superseded hotfix builds"
  url_or_quote: "\"Apply SonicWall's hotfix 12.4.3-03526 or 12.5.0-02952 to every SMA1000 6210/7210/8200v appliance now; ...\""
  summary: "(low confidence; judgement call left on purpose at iterations 4 to 6, recorded here because check 4c(g) names a superseded action as F18) The newest section of the same entry says 'an appliance on them needs the later hotfix as well', so a team working actions[] literally installs builds that remain vulnerable to the CVSS 10.0 pre-auth SSRF CVE-2026-102255. Cheapest fix: append a clause to actions[0], e.g. 'SonicWall's advisory of 2026-10-06 shows these builds are themselves affected by CVE-2026-102255; install 12.4.3-03670 or 12.5.0-03082 instead'. The summary and Improvement section already carry the pointer."
- code: F11
  category: editorial-advisory
  section: "entries/2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access (Update 2026-10-08T04:56:05Z)"
  item: "Atlassian: Previdian 'within two hours' versus the same page's own timeline"
  url_or_quote: "\"began recording attempts within two hours of that publication\" (BleepingComputer, attributed to Previdian) versus the Previdian page timeline 'Observed by Previdian sensors' 20:52 UTC"
  summary: "Advisory. watchTowr published at 17:01:36Z, so the page timeline puts first observation 3 h 51 min later; the section reports both but never says they differ. After correcting the F3 time, either state the gap in one clause or drop the parenthetical; both attributions are otherwise accurate."
