  - {claim_id: "853a7e8adc", verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "Upgrade to 8.0.2 / 7.6.7 / 7.4.9 or above; 7.2: upgrade to branch 7.4 or above; Fortinet has remediated this issue on oct 05, 2026 in FortiMail Cloud ... need not perform any action"}
