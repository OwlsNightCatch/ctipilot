claims:
  - {claim_id: "cd165ab155", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Publication: October 6, 2026 ... FortiBleed Operations Continue Targeting Exposed Systems Leading to Reports of Lockouts"}
  - {claim_id: "ea9241150c", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "SOCRadar verifying more than 86,644 compromised devices across 194 countries; attackers are continuing to scan ... using previously obtained compromised credentials; ransomware affiliates"}
  - {claim_id: "82698075b1", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Terminate all active administrative sessions. Reset all Fortinet VPN and administrative passwords ... API keys should be reviewed ... trusted hosts ... PBKDF2 ... FortiOS v7.2.11 and later"}
  - {claim_id: "61e240f2dd", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/", passage: "dated 2026-06-18: 73,932 firewall URLs; Hudson Rock: 194 countries, 21,632 unique domains; Beaumont: roughly 75,000 Fortinet devices"}
  - {claim_id: "de002b43ef", verdict: ok, source_url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices", passage: "we believe the activity involves threat actors reusing credentials from previous incidents ... brute-force techniques ... weak password hygiene and no multi-factor authentication (MFA)"}
  - {claim_id: "d01d3d5c6c", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/", passage: "Russian-speaking multi-operator threat group ... 45-GPU cluster managed through Hashtopolis ... move laterally into internal Active Directory ... accidentally left an open directory"}
  - {claim_id: "4c15d7d88c", verdict: ok, source_url: "https://arcticwolf.com/resources/blog/active-fortibleed-campaign-impacting-fortinet-devices-across-194-countries/", passage: "Arctic Wolf 2026-06-17: Active FortiBleed Campaign Impacting Fortinet Devices Across 194 Countries"}
  - {claim_id: "d75c3cf02f", verdict: ok, source_url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices", passage: "Reset all Fortinet VPN and administrative passwords, especially on internet-facing systems; reusing credentials from previous incidents"}
  - {claim_id: "e67cf75a9c", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-leak-exposes-fortinet-vpn-credentials-for-73-000-devices/", passage: "Beaumont ... published additional findings indicating the dataset contains credentials for roughly 75,000 Fortinet devices; many ran relatively recent FortiOS (per earlier read)"}
  - {claim_id: "c3db961474", verdict: ok, source_url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices", passage: "Look for unexpected administrator access from an unknown IP and domain controller logs for lateral movement, unusual access, suspicious accounts"}
  - {claim_id: "9d10da8b02", verdict: ok, source_url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices", passage: "Implement MFA on all administrator and VPN user accounts; trusted hosts (good), a local-in policy (better), or remove internet administration altogether (best)"}
  - {claim_id: "5f5af0fc7e", verdict: ok, source_url: "https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices", passage: "This is not a new Fortinet vulnerability ... reusing credentials ... brute-force (derived: valid-account abuse, no fresh CVE)"}
  - {claim_id: "9cf5b5d7e1", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "FortiBleed is an active, global credential-compromise campaign ... SOCRadar verifying more than 86,644 ... Initial findings indicate attackers are continuing to scan"}
  - {claim_id: "8f4c29a21e", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "credential stuffing [T1110.004] and password spraying [T1110.003] ... prior Fortinet leak dumps and infostealer logs ... Hashcat and Hashtopolis ... Adversaries rented GPU infrastructure; legacy SHA-2"}
  - {claim_id: "52e1ad2678", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "threat actors create new accounts not previously on the device. In certain cases, threat actors delete existing accounts; requiring remediation steps beyond standard patching and password resets"}
  - {claim_id: "2d30b5fabf", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Cracked credentials were enriched, sorted, and validated, with scripts filtering out honeypots ... revenue and network structure ... Active Directory enumeration and password spraying ... initial-acce"}
  - {claim_id: "d2c534ff61", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Reporting indicates initial access brokers (IABs), utilizing the FortiBleed attack chain, have provided further access to ransomware affiliates, currently including INC/Lynx ransomware and Payload ran"}
  - {claim_id: "6efbce859d", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/fbi-ongoing-fortibleed-attacks-lock-out-fortigate-vpn-admins/", passage: "In July, SOCRadar linked FortiBleed to the INC and Lynx ransomware operations after getting access to both groups' negotiation panels on a server used in the campaign."}
  - {claim_id: "28a7bbe6e2", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Mitigations: trusted hosts / local-in / remove internet administration; terminate sessions; phishing-resistant MFA; review logs; PBKDF2 ... v7.2.11; REST API keys reviewed, unknown removed, legitimate"}
  - {claim_id: "c248959243", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Review firewall, VPN, authentication, and domain controller logs for lateral movement, unusual access, suspicious accounts, or unauthorized configuration changes (telemetry mapping is derived)"}
  - {claim_id: "b9fca7f9cf", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "joint cybersecurity advisory developed by the FBI and the U.S. Secret Service; Publication October 6, 2026; JCSA-20261006-01"}
  - {claim_id: "967a26aad3", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "active, global credential-compromise campaign ... SOCRadar verifying more than 86,644 compromised devices across 194 countries (sentence continues in the cited clause)"}
  - {claim_id: "72b5968488", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "fragment: citation tail of the preceding sentence; source is the FBI/USSS PDF dated October 6, 2026"}
  - {claim_id: "1e406b5dea", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "scanning ... credential stuffing ... password spraying ... Hashcat and Hashtopolis ... GPU ... exploits reused or leaked credentials and legacy SHA-256 password storage"}
  - {claim_id: "fc0deac0c4", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Potential Lockout: some victims may get locked out of their Fortinet devices if the threat actor either deletes or changes the password for original accounts"}
  - {claim_id: "427d638b0f", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "threat actors create new accounts not previously on the device. In certain cases, threat actors delete existing accounts to block organizations from accessing affected devices"}
  - {claim_id: "248a52d267", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Cracked credentials were enriched ... filtering out honeypots ... prioritizing high-value targets based on revenue and network structure ... role as an initial-access broker"}
  - {claim_id: "0ab1be8ccb", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "the FortiBleed attack chain has been observed as an initial entry point for ransomware affiliates; currently including INC/Lynx ransomware and Payload ransomware"}
  - {claim_id: "9c642407d2", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Reduce attack surface (trusted hosts/local-in/no internet admin); terminate sessions and reset; phishing-resistant MFA; validate config; review logs; PBKDF2 v7.2.11 and later; REST API keys"}
  - {claim_id: "63491aaf0c", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Review firewall, VPN, authentication, and domain controller logs ...; All API keys should be reviewed (telemetry sentence is a derived mapping)"}
  - {claim_id: "ff463f52ca", verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261006.pdf", passage: "Section states the lockout, ransomware-affiliate supply, SOCRadar count, log/REST API key/PBKDF2 measures; summary carries no edit narration (iteration-3 sentence removed)"}
  - {claim_id: "06c163474a", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "12.4.3-03526 and 12.5.0-02952, which SonicWall named on September 1 as the fix for two flaws ... An appliance still on those versions needs the new hotfix."}
  - {claim_id: "854f594027", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "An appliance still on those versions needs the new hotfix. (facts supported; sequencing 'then the later hotfix' is raised as F18, not a claim defect)"}
  - {claim_id: "15121a6d03", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", passage: "advised admins to re-image appliances, change all user and administrator passwords, and reset TOTP tokens if indicators of compromise (IOCs) are detected (the 'treats ... as compromising' reading is t"}
  - {claim_id: "748addabc5", verdict: ok, source_url: "https://www.securityweek.com/sonicwall-warns-of-two-sma1000-zero-days-exploited-in-attacks/", passage: "CVE-2026-83548 CVSS 10, pre-authentication SSRF in Appliance Work Place; Hotfixes 12.4.3-03526, 12.5.0-02952; KEV dateAdded 2026-09-02"}
  - {claim_id: "1b3e47cca0", verdict: ok, source_url: "https://www.securityweek.com/sonicwall-warns-of-two-sma1000-zero-days-exploited-in-attacks/", passage: "CVE-2026-83549 CVSS 7.8, OS command injection in AMC, authenticated attacker; KEV dateAdded 2026-09-02"}
  - {claim_id: "19d12ce881", verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016", passage: "IMPORTANT: SonicWall PSIRT has investigated a case indicating the active exploitation of the vulnerabilities described in this advisory."}
  - {claim_id: "675b5c880c", verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016", passage: "Pre-authentication SSRF ... SMA1000 Appliance Work Place interface due to an unintended alternate access path ... CVSS 10.0 ... CWE-918 ... CWE-441"}
  - {claim_id: "5a0740404f", verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0016", passage: "OS Command Injection ... Appliance Management Console (AMC) ... remote authenticated attacker as administrator to execute arbitrary OS commands ... CVSS 7.8"}
  - {claim_id: "86f88c35d7", verdict: ok, source_url: "https://www.securityweek.com/sonicwall-warns-of-two-sma1000-zero-days-exploited-in-attacks/", passage: "SonicWall noted in its advisory that it has observed exploitation of both vulnerabilities, which suggests they have been chained in attacks."}
  - {claim_id: "73c1dc21f2", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", passage: "SonicWall warned customers that threat actors are chaining two new SMA1000 zero-day vulnerabilities in remote code execution attacks."}
  - {claim_id: "928dc7bf07", verdict: ok, source_url: "https://www.securityweek.com/sonicwall-warns-of-two-sma1000-zero-days-exploited-in-attacks/", passage: "SMA1000 models 6210, 7210, and 8200v are affected ... SSL-VPN on SonicWall firewalls and SMA100 series products are not affected."}
  - {claim_id: "bc40f7a2c7", verdict: ok, source_url: "https://www.securityweek.com/sonicwall-warns-of-two-sma1000-zero-days-exploited-in-attacks/", passage: "Hotfixes 12.4.3-03526, 12.5.0-02952, and higher versions patch the vulnerabilities."}
  - {claim_id: "1c2b4e1d1f", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", passage: "Shadowserver currently tracks over 400 SMA1000 appliances exposed online, although some may already have been patched against this exploit chain."}
  - {claim_id: "224856c75d", verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "catalogVersion 2026.10.04: CVE-2026-83548 and CVE-2026-83549 dateAdded 2026-09-02 (SonicWall SMA1000 Appliances)"}
  - {claim_id: "f691aecb67", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/", passage: "In July, two SMA1000 zero-days (CVE-2026-15409 and CVE-2026-15410) were exploited for weeks ... in attacks that ... CISA linked to ransomware gangs."}
  - {claim_id: "e5964f5f08", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "SonicWall told customers to check for indicators of compromise and, if any were found, to re-image or redeploy the appliance, change user and administrator passwords, and reset the TOTP tokens"}
  - {claim_id: "b8b1e6abbd", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", passage: "SMA1000 is a secure remote access appliance used by large enterprises, government, and critical infrastructure organizations."}
  - {claim_id: "502dcccaa0", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/", passage: "No cited page names an actor for CVE-2026-83548/83549 (BC 09-02, BC 10-07, THN, SecurityWeek read; none attributes the chain)"}
  - {claim_id: "0925bd58db", verdict: F4, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/", passage: "SMA1000 gateways 'provide VPN access to internal apps and corporate networks'; no source says a legitimate Work Place session never originates internal traffic (low confidence)"}
  - {claim_id: "9764150115", verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-actively-exploited-sma1000-zero-day-flaws/", passage: "SonicWall PSIRT has investigated a case indicating the active exploitation ... Customers are strongly urged to upgrade to the hotfix release as soon as possible"}
  - {claim_id: "3f83beb096", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "The affected versions include 12.4.3-03526 and 12.5.0-02952 ... 12.4.3-03670 and higher versions are fixed ... 12.5.0-03082 and higher versions are fixed."}
  - {claim_id: "34d0dfc044", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "An appliance still on those versions needs the new hotfix. (the older hotfixes still fix 83548/83549 per SecurityWeek)"}
  - {claim_id: "a154cdab40", verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "Record summary matches the Improvement section: third pre-auth Work Place SSRF; 03526/02952 affected; 03670/03082 fixed"}
