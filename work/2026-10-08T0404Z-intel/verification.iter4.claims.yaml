  - {claim_id: "cb0eff9a92", verdict: ok, source_url: "https://www.cisa.gov/news-events/alerts/2026/10/01/cisa-adds-one-known-exploited-vulnerability-catalog", passage: "CISA Adds One Known Exploited Vulnerability to Catalog (October 01, 2026): CVE-2026-104286 Fortinet FortiMail Path Traversal Vulnerability"}
