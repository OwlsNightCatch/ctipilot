  - title: "\"Ghost in the Database\": Mandiant recovers active ADFS token-signing keys from Machine DPAPI, bypassing the WID/DKM Golden SAML extraction path"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi", publisher: "Mandiant (Google Cloud Blog / GTIG)", date: "2026-07-07", role: primary }
      - { url: "https://itbrief.co.uk/story/mandiant-finds-way-to-recover-active-adfs-signing-keys", publisher: "itbrief.co.uk", date: "2026-07-08", role: corroborating }
      - { url: "https://securitybrief.com.au/story/mandiant-finds-way-to-recover-active-adfs-signing-keys", publisher: "securitybrief.com.au", date: "2026-07-08", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Mandiant GTIG ADFS DPAPI signing keys blog\") → pivot: itbrief.co.uk, URL https://itbrief.co.uk/story/mandiant-finds-way-to-recover-active-adfs-signing-keys → primary: Mandiant / Google Cloud Blog (via jina reader on cloud.google.com/blog/topics/threat-intelligence listing), URL https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
    summary: |
      During a red-team engagement, Mandiant found that ADFS deployments with AutoCertificateRollover disabled and certificates manually rotated can leave the active token-signing private key exposed via Windows Machine DPAPI even after the standard Golden SAML extraction path (WID database + DKM decryption) fails. In this drift state the WID configuration database retains a stale "ghost" certificate record — decryptable but rejected by Entra ID with AADSTS500172 — while the ADFS service actually signs tokens with a newer certificate whose private key sits in the machine-scoped CAPI store (C:\ProgramData\Microsoft\Crypto\RSA\MachineKeys\), protected by Machine DPAPI (the DPAPI_SYSTEM LSA secret plus S-1-5-18 machine masterkeys) rather than a user-bound DPAPI context. A SYSTEM-level attacker can recover this key with a tool such as SharpDPAPI /machine without touching LSASS or the live ADFS process — reducing visibility to defenses that watch only credential-dumping/process-memory access. The recovered key was used to forge a Global Administrator SAML assertion that Entra ID accepted, bypassing MFA and conditional access entirely. The drift condition itself is observable: ADFS Event ID 385 fires when the WID record and the actively used signing certificate diverge, and self-resolves only if AutoCertificateRollover is re-enabled.
    region_nexus: "global; ADFS remains widely deployed for on-prem/hybrid identity federation across Swiss and EU public-sector and enterprise environments migrating to Entra ID"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, energy, healthcare, telco"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "tool:adfs-machine-dpapi-key-recovery", type: tool, name: "Machine DPAPI ADFS signing-key recovery (\"Ghost in the Database\")",
          aliases: ["Ghost in the Database"],
          summary: "Mandiant-documented technique to recover an active ADFS token-signing private key from the machine-scoped Windows CAPI key store via Machine DPAPI when the WID configuration database has drifted from the actively-used signing certificate (AutoCertificateRollover disabled, manual rotation) — enables Golden SAML forgery without LSASS or ADFS-process interaction (Mandiant, 2026-07-07)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attackers who obtain the active private key can forge SAML assertions for any user in a federated environment"
        attribution: "Mandiant (Google Cloud Blog)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
      - quote: "The recovered key was used to forge a SAML assertion impersonating a Global Administrator identity, which Entra ID accepted as a valid authentication assertion"
        attribution: "Mandiant (Google Cloud Blog)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
      - quote: "SACL-Based Object Access Monitoring: Configure object access auditing via SACLs on C:\\ProgramData\\Microsoft\\Crypto\\RSA\\MachineKeys\\ ... this generates Security Event ID 4663 for file access attempts"
        attribution: "Mandiant (Google Cloud Blog)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
    extended_notes: |
      MITRE ATT&CK: T1606.002 (Forge Web Credentials: SAML Tokens), T1552 (Unsecured Credentials — DPAPI), T1078.004 (Valid Accounts: Cloud Accounts). Detection concepts beyond the Event ID 4663 SACL: correlate ADFS token-issuance/claims-processing audit events (Event IDs 299, 1200-series) against Entra ID sign-in logs for federated sign-ins with no matching upstream authentication context; baseline claim sets/IP ranges/user-agents per relying-party trust for privileged accounts. Hardening: migrate token-signing certs to an HSM (removes the Machine DPAPI extraction path entirely), run ADFS under gMSA, treat ADFS hosts as Tier 0 (equivalent to domain controllers), and when rotating manually always run Set-AdfsCertificate (not just certificate installation) — verify with Get-AdfsCertificate and watch for recurrence of Event ID 385. Published slightly outside the strict 24h/8h intraday gate (2026-07-07 14:00 UTC, ~38h before this run) but not surfaced by any prior run in the 14-day dedup index — included as a genuine gap-fill within the 72h developing window given its direct relevance to identity-infrastructure defenders.
