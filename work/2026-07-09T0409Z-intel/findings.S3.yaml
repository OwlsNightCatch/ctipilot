  - title: "Cavern Manticore (Iran MOIS/OilRig-Lyceum nexus): a modular .NET C2 that weaponizes three different compilation formats as an anti-analysis layer, deployed via SysAid RMM abuse"
    sources:
      - { url: "https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/", publisher: "Check Point Research", date: "2026-07-06", role: primary }
    discovery_trace: "first seen at: bridge feed fetch on research.checkpoint.com/feed/ → primary: Check Point Research, URL https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/ (no pivot needed)"
    summary: |
      Check Point Research documented Cavern Manticore, an Iran MOIS-linked APT it assesses shares technical overlap with MuddyWater and OilRig's Lyceum subgroup, targeting Israeli government and IT-sector organizations. The group's namesake framework, Cavern, is a modular post-exploitation C2 built entirely on .NET but deliberately compiled into three different binary formats across its components — pure .NET Framework/IL-only (mhm.dll file-ops/DPAPI-decrypt module, db.dll SQL browser, ode.dll LDAP/AD-recon module), Mixed-Mode C++/CLI IL+Native (the uxtheme.dll Cavern Agent core), and .NET 8 NativeAOT native-only (n-HTCommp.dll HTTPS/WebSocket transport, n-ten.dll network recon/SMB-brute-force, n-sws.dll SOCKS5/WSS tunnel module). The compilation-format diversity itself is the anti-analysis layer: each format demands a different reverse-engineering toolchain, and NativeAOT strips framework symbols and resolves security-sensitive P/Invoke calls (WNetAddConnection2, NetShareEnum, NetLocalGroupGetMembers) through runtime descriptor tables rather than the PE import table, hiding capability from import-based triage. In the observed intrusion chain, the actor abused SysAid's legitimate software-update/deployment feature (not a SysAid vulnerability) to push a WinDirStat DLL-sideloading package that loads the trojanized uxtheme.dll as the Cavern Agent, which exports 83 functions mimicking the real Windows theming library — 82 are empty stubs, and the one live export (EnableThemeDialogTexture) is the actual C2 entry point, creating a sandbox trap for automated analysis that only invokes default exports. The agent isolates each loaded module in its own .NET AppDomain (via a MarshalByRefObject proxy) so modules can be unloaded cleanly after execution, leaving minimal forensic residue — a technique not commonly seen in commodity loaders. Most samples score zero or very-low detection on VirusTotal.
    region_nexus: "primary targeting is Israeli government/IT; transferable relevance is the anti-analysis technique class and RMM-software-feature-abuse initial-access pattern, applicable to any organization running SysAid or similar RMM/deployment tooling in Swiss/EU government and critical-infrastructure environments"
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "actor:cavern-manticore", type: actor, name: "Cavern Manticore",
          aliases: [],
          summary: "Cavern Manticore — Iran MOIS-linked APT targeting Israeli government and IT-sector organizations, sharing technical/infrastructure overlap with MuddyWater and OilRig's Lyceum subgroup; operates the modular .NET C2 framework 'Cavern' (Check Point Research, 2026-07-06)." }
      - { key: "tool:cavern-c2-framework", type: tool, name: "Cavern",
          aliases: [],
          summary: "Cavern — modular post-exploitation .NET C2 framework (agent + specialized modules for file/DPAPI, SQL, LDAP, network and tunneling operations) used by Cavern Manticore; deliberately compiled across three .NET formats (IL-only, Mixed-Mode C++/CLI, NativeAOT) as an anti-analysis layer, with per-module AppDomain isolation and DLL-sideload delivery via RMM software-update abuse (Check Point Research, 2026-07-06)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Cavern Manticore is an Iran MOIS (Ministry of Intelligence and Security)-linked actor, with links to the OilRig subgroup named Lyceum"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/"
      - quote: "the compilation format itself becomes the anti-analysis layer, since each of the three formats has to be reversed with a different toolchain"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/"
      - quote: "SysAid was not compromised, and no SysAid vulnerability was involved. The attacker had already gained access to the victim environment and abused a legitimate software-deployment feature"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/"
    extended_notes: |
      MITRE ATT&CK: T1574.002 (DLL Side-Loading), T1027 (Obfuscated Files or Information — via compilation-format diversity rather than packing), T1620 (Reflective Code Loading — AppDomain-isolated module loading), T1219 (Remote Access Software — RMM/SysAid abuse for lateral deployment), T1055 (Process Injection concepts absent — no injection observed; native P/Invoke resolution instead). Detection/hunt takeaway: hunt for uxtheme.dll outside its legitimate System32 location, especially loaded by non-standard parent processes (WinDirStat.exe is not a normal uxtheme.dll consumer); flag RMM/software-deployment-tool (SysAid and equivalents) push actions that stage executables to non-standard ProgramData paths; for reverse engineers, note the specific tooling gap — NativeAOT .NET 8 binaries need dedicated metadata-recovery tooling (the researchers ported washi1337's ghidra-nativeaot plugin to IDA Pro, published as ida-nativeaot on GitHub) since standard .NET decompilers do not handle Native-only compiled output. Published 2026-07-06, ~40h before this run — outside the 24h/8h intraday gate but within the 72h developing window; no prior-run coverage found in the 14-day dedup index or entity registry.
