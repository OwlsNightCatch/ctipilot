  - title: "GhostApproval: symlink-following + confirmation-dialog UI misrepresentation lets malicious repos achieve pre-auth RCE against 6 major AI coding assistants"
    sources:
      - { url: "https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants", publisher: "Wiz Research", date: "2026-07-08", role: primary }
    discovery_trace: "first seen at: WebFetch (Wiz Research blog listing), URL https://www.wiz.io/blog → primary: Wiz Research, URL https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants (no pivot needed)"
    summary: |
      Wiz Research found a systematic vulnerability pattern, GhostApproval, across six major AI coding assistants: Amazon Q Developer, Anthropic Claude Code, Augment, Cursor, Google Antigravity and Windsurf. Each agent can be tricked by a malicious repository into following a symbolic link (CWE-61) that points outside the workspace sandbox — e.g. a file named project_settings.json that is actually a symlink to ~/.ssh/authorized_keys — and writing attacker-controlled content to the resolved target. In several tools (most clearly Claude Code and Augment) the failure compounds into CWE-451 (UI misrepresentation of critical information): the agent's own internal reasoning explicitly identifies the true target ("this is a symbolic link to the Claude settings file") yet the confirmation dialog shown to the user still asks to approve an edit to the harmless-looking filename, turning informed consent into a rubber stamp. Windsurf and Amazon Q exhibited pre-authorization writes — the file modification happens before the Accept/Reject dialog even renders, making the confirmation an "Undo" button rather than a gate. Severity ranged from disputed UI issue (Anthropic, closed as informative, though v2.1.32 already shipped a symlink warning before the report) to critical pre-auth RCE (Augment: silent read+write, no dialog at all; Windsurf: write-before-prompt). AWS (CVE-2026-12958, language server < 1.69.0, fixed in 1.69.0) and Cursor (CVE-2026-50549, < 3.0, fixed in 3.0) issued CVEs; Google fixed without a CVE; Augment and Windsurf remain in-progress as of publication.
    region_nexus: "global; AI coding assistants are in active use across Swiss/EU public-sector and enterprise development shops"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: ["CVE-2026-12958", "CVE-2026-50549"]
    entity_keys: []
    new_entities:
      - { key: "tool:ghostapproval-ai-coding-assistant-symlink", type: tool, name: "GhostApproval",
          aliases: [],
          summary: "Wiz Research's name for a symlink-following (CWE-61) + confirmation-UI misrepresentation (CWE-451) vulnerability pattern affecting Amazon Q Developer, Anthropic Claude Code, Augment, Cursor, Google Antigravity and Windsurf, letting a malicious repository write outside the AI coding agent's workspace sandbox (Wiz Research, 2026-07-08)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "a malicious repository can trick the agent into accessing arbitrary files outside the workspace sandbox, potentially achieving remote code execution on the developer's machine"
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants"
      - quote: "the agent's internal reasoning explicitly recognizes the dangerous target, yet the confirmation prompt shown to the user conceals this information entirely"
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants"
      - quote: "Windsurf presented a particularly dangerous variant. The agent writes file modifications directly to disk before the Accept/Reject buttons appear in the UI."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/ghostapproval-a-trust-boundary-gap-in-ai-coding-assistants"
    extended_notes: |
      MITRE ATT&CK: T1195.002 (Supply Chain Compromise — repository-delivered), T1222 (File and Directory Permissions Modification via symlink), T1552.004 (Unsecured Credentials — SSH keys via authorized_keys write). Detection concepts: monitor for git-clone operations that create symlinks resolving outside the repository root (Wiz's own sensor alerts at clone time); monitor writes to ~/.ssh/authorized_keys, shell rc files (.zshrc/.bashrc) and other sensitive dotfiles regardless of the writing process, elevating severity when the writer is an AI coding-assistant process. Hardening for defenders standing up these tools: canonicalize/resolve symlink targets before rendering any confirmation dialog; explicitly flag when a resolved path falls outside the workspace; never perform the underlying write before explicit user authorization (treat the confirmation as a gate, not an undo mechanism); patch to Cursor >= 3.0 and Amazon Q language server >= 1.69.0 now. Full responsible-disclosure timeline in the source runs Feb-Jul 2026; public disclosure itself is 2026-07-08.

  - title: "Sygnia: an AI-orchestrated AWS cloud intrusion moved from initial access to broad compromise in ~72 hours using only known techniques — four access keys used in parallel from one source in the same second"
    sources:
      - { url: "https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/", publisher: "Sygnia", date: "2026-07-08", role: primary }
    discovery_trace: "first seen at: jina reader on Sygnia blog listing, URL https://www.sygnia.co/blog/ → primary: Sygnia, URL https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/ (no pivot needed)"
    summary: |
      Sygnia's incident-response investigation of a financially-motivated AWS cloud intrusion found no novel malware or zero-day — every individual technique maps to a long-tracked MITRE ATT&CK ID — but the operationalization was materially faster than typical manual intrusions, which Sygnia attributes to AI-assisted or agentic tooling. After obtaining an initial access key via a weakness in an internet-facing application, the actor ran four parallel workstreams (secrets theft across ECS/EC2 environment variables, CI/CD runner env vars for GitHub and Bitbucket, S3 plaintext secrets, Secrets Manager, and SSM Parameter Store; backdoor/persistence via new IAM users, EC2/ECS reverse shells, and modified deployment files; RDS data exfiltration via several hundred distinct SQL queries across dozens of databases; and reversible impact actions — S3 access denial, ECS scaled to zero, SQS purges — used purely as extortion leverage) that repeated on every newly obtained credential rather than progressing as a single linear kill chain. The most striking single artefact: four different AWS access keys belonging to four separate accounts were used from the same source IP and user-agent within the same observed second — activity Sygnia assesses is very hard to explain as manual operation. Multiple artefacts (scripts, structured reporting output, commit messages and branch names framing the activity as an authorized "pentest"/"red team" with a fabricated CEO sign-off) are consistent with LLM-generated tooling and content, including possible prompt-framing intended to reduce refusal from AI assistants being abused by the operator. Sygnia maps the case onto the same ATT&CK tactic distribution (Execution, Discovery, Credential Access, Collection, Defense Evasion) that Anthropic's June 2026 LLM ATT&CK Navigator research found concentrated in banned AI-abuse accounts.
    region_nexus: "global; cloud/CI-CD identity-sprawl attack surface is directly relevant to any organization running AWS + GitHub/Bitbucket CI/CD, including Swiss/EU public-sector cloud migrations"
