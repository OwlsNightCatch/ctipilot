    extended_notes: |
      MITRE ATT&CK per Sygnia's own mapping: T1059 (scripting), T1651 (Cloud Administration Command), T1609/T1648 (Container/Serverless Execution), T1677 (Cloud Application Integration / CI/CD pipeline abuse), T1552/T1528 (credential/token harvesting), T1087/T1580/T1619 (account/cloud-infra/GCP-storage discovery re-run per new key), T1578 (modify cloud compute infra), T1078 (valid accounts). Detection/hunt takeaway for Tier 2/3: the ATT&CK-mappable individual actions are not the signal — the orchestration behavior is: alert on the same source IP/user-agent pair authenticating with multiple distinct IAM access keys/accounts within a tight time window (seconds), and on repeated re-execution of the same discovery/secrets-harvesting playbook triggered by newly-minted credentials. Hardening: assume any exposed credential is used immediately and at scale — automate secrets rotation, IP-allowlist cloud management planes, enforce MFA on privileged/external access, and pre-build containment playbooks (network isolation + credential rotation + session revocation) that can execute in minutes, not hours, since manual response cannot keep pace with this operational tempo.

  - title: "ANNUAL REPORT — ESET Threat Report H1 2026: first Android malware using generative AI at runtime (PromptSpy/Gemini), ClickFix detections more than double, QR phishing at record levels, 100+ EDR-killers catalogued"
