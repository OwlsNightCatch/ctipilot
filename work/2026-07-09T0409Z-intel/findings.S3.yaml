        attribution: "Sygnia"
        source_url: "https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/"
      - quote: "The intrusion progressed from initial access to broad cloud compromise within approximately 72 hours."
        attribution: "Sygnia"
