  item: "CVE-2026-48614 — Plesk XML API code injection root LPE"
  url_or_quote: "Body: 'Plesk's own advisory confirms the CVE and the LPE impact, credits independent researcher Georgii Shutiaev, and gives CVSS 3.1 9.9 (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H) ... ([Plesk, 2026-07-03](https://support.plesk.com/hc/en-us/articles/41171817973143-Vulnerability-CVE-2026-48614-in-Plesk-XML-API))'"
  summary: "The CVSS 9.9 score and the vector string are attributed to Plesk's own advisory, but the fetched Plesk PSIRT page (full text via jina: Situation / Affected Versions / Impact / Call to Action / Acknowledgements) carries NO CVSS score, no vector, no CWE-94 wording and no 'root' — only 'local privilege escalation (LPE) is possible', the version table, the disable-XML-API mitigation, and the Shutiaev credit. The CVSS 9.9 + vector actually appear on the co-cited CCB advisory ('CVE-2026-48614: 9.9 (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H)'). Fact is correct and sourced (CCB); it is misattributed to Plesk. Fix: attribute the CVSS/vector clause to CCB. (Frontmatter cvss '9.9' is fine — supported by CCB.)"
