    extended_notes: |
      Clears the general relevance bar on direct nexus (Swiss/EU payments-infrastructure exposure), not on the stricter out-of-nexus gate — Nayax explicitly operates in Switzerland and is an EU-licensed payment institution, so this is in-scope under the general bar rather than needing (a)-(d) justification.
      Fake-news / PD-6 handling: treated "The Syndicate"'s scope claims as an unverified, attributed leak-site assertion throughout (not stated as fact); the victim's own SEC filing is the fact base. Framed the internal contradiction (immediate containment vs. ~1-year dwell / 100TB) explicitly so a reader can weigh both.
      Defender takeaway (limited by disclosure gaps): if you operate or integrate with Nayax terminals/APIs, watch for a material update to this 6-K; in the meantime, treat this as a prompt to audit subsidiary/third-party cloud accounts with access to card-processing data pipelines for anomalous authentication and bulk-export activity (cloud IAM sign-in log review, DLP egress alerting on payment-data stores) — standard due diligence on third-party payment processors, not a technique newly disclosed by this filing.
      SEC filing mechanics for other analysts: Nayax files as a foreign private issuer (Form 6-K, not 8-K Item 1.05); the EDGAR full-text-search phrase query for "Item 1.05" 8-Ks in the 2026-07-07/09 window returned zero hits, so 6-K/20-F filers are a blind spot if you only monitor Item 1.05 8-Ks — worth widening any automated SEC-filing sweep to include 6-K "Explanatory Note" cybersecurity disclosures for foreign issuers.
