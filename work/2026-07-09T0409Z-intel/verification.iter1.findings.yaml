- code: F11
  category: editorial-advisory
  section: annual-report / incident
  item: "eset-threat-report-h1-2026 (and nayax sourcing_note)"
  url_or_quote: "ESET body: 'Defender takeaway: per PD-9 this is a single reference entry for ESET's H1/H2 report cadence (predecessor: ESET Threat Report H2 2025), not a re-summary target.' ; Nayax sourcing_note: '... reported as attributed claim, not fact, per PD-6.'"
  summary: "Workflow-internal policy-directive shorthand ('per PD-9', 'not a re-summary target', 'per PD-6') leaked into reader-facing text (style-discipline hard rule: no workflow-internal language in entries). 'per PD-9' opens the ESET Defender takeaway and is meaningless to a reader. Recommend removing the PD references and the meta framing; keep the operational reads that follow."
