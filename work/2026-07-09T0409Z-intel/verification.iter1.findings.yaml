- code: F4
  category: hallucinated-fact
  section: deep-dive (research)
  item: "mandiant-adfs-machine-dpapi-golden-saml-key-recovery"
  url_or_quote: "evidence[0].quote: \"Attackers who obtain the active private key can forge SAML assertions for any user in a federated environment\" (attributed to Mandiant)"
  summary: "Non-verbatim evidence quote. Fetched the Mandiant page (jina) in full; this exact string does not occur (no 'Attackers who', 'federated environment', or 'any user in a'). Actual verbatim text: 'Successfully obtaining this active key allows an attacker to forge valid SAML assertions for any user, bypassing the need for user credentials and multi-factor authentication' (also intro: 'By obtaining the private key of an ADFS token-signing certificate, an attacker can authenticate as any user to any SAML-federated application'). Replace the evidence[] quote with a verbatim substring. Claim itself is source-accurate; only the quotation is fabricated."
- code: F4
  category: hallucinated-fact
  section: incident
  item: "nayax-cloud-account-incident-the-syndicate-claim"
  url_or_quote: "body: 'a Bank-of-Lithuania-licensed EU payment institution serving enterprises across the EEA, including Switzerland'; summary/headline: 'operating in Switzerland and 40+ European markets'"
  summary: "The Swiss/EEA/Bank-of-Lithuania company-description facts that establish this breach entry's ENTIRE constituency nexus are not supported by any of the three cited sources. Fetched all three: SEC 6-K (incident-only), DataBreaches.net (no geography), Calcalistech (WebFetch explicit: does NOT mention Switzerland, Bank of Lithuania, or payment-institution status). Additionally the phrasing 'across the EEA, including Switzerland' is factually wrong — Switzerland is not in the EEA. My own web search confirms Nayax holds a Bank of Lithuania EMI/PI license (real) but it authorises EEA operations, which EXCLUDE Switzerland. Remediation: add a citation for the license + any Swiss-operations claim, and correct the EEA/Switzerland geography. The breach-inclusion (constituency-nexus) bar rests on this uncited/imprecise fact."
