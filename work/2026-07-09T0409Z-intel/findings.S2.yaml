items:
  - title: "CERT Polska: UNC1151/Ghostwriter pivots to Gmail with real-time 2FA-code phishing"
    sources:
      - { url: "https://cert.pl/en/posts/2026/06/UNC1151-gmail-campaign/", publisher: "CERT Polska (NASK)", date: "2026-07-08", role: "primary" }
    discovery_trace: "first seen at: cert-pl, URL https://cert.pl/en/news/ → primary: CERT Polska, URL https://cert.pl/en/posts/2026/06/UNC1151-gmail-campaign/ (no pivot needed — national CERT is the discovering and disclosing party)"
    summary: |
      CERT Polska (NASK) reports that the UNC1151/Ghostwriter group — which for years phished
      Polish-provider webmail (Onet, WP, Interia) — has since March 2026 shifted at high, near-daily
      intensity to targeting Gmail accounts, with new domains serving phishing pages appearing almost
      daily. The lure imitates a Gmail security/administrator notice ("suspicious activity", "account
      may be blocked") written in error-free Polish and sent from purpose-created Gmail accounts or
      compromised mailboxes (sender display name spoofed), frequently via BCC to obscure the target list.
      The core technical escalation versus prior campaigns: the fake login panel now proxies 2FA in
      real time — after harvesting the password it displays a second form requesting the TOTP/SMS code,
      which the operators use for an automated login attempt against the real account, defeating both
      app-based (Google Authenticator) and SMS-based second factors. Targeting is broad — political and
      public-life figures, senior officials, researchers, journalists, public-administration and
      law-enforcement staff, and their family/social contacts (including mistaken-identity delivery to
      similarly-named unrelated people) — with campaigns also observed narrowed to specific professional
      groups (translators, court experts). Infrastructure mixes dedicated phishing domains on .icu/.digital/.top
      TLDs with abuse of *.netlify.app subdomains, plus fake login panels hosted on compromised Polish
      websites (main page left untouched to avoid detection by the site owner).
    region_nexus: "Poland (EU member state); technique is directly transferable to any EU/CH government, law-enforcement or public-administration Gmail-using workforce"
    primary_sector_nexus: "direct"
    sector: "public-sector, government"
    cves: []
    entity_keys: ["campaign:frostyneighbor-2026-05-campaign"]
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Since March 2026, however, the group has been running phishing campaigns targeting Gmail users. These campaigns are carried out with high intensity, mainly on weekdays. Notably, they enable the theft of two-factor authentication (2FA) credentials."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/06/UNC1151-gmail-campaign/"
      - quote: "If a second factor is required, the phishing page displays an additional form requesting the code. This allows attackers to capture both SMS-based codes and those generated by applications such as Google Authenticator."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/06/UNC1151-gmail-campaign/"
      - quote: "phishing operations have involved both domains registered specifically for phishing purposes (often under TLDs such as .icu, .digital, and .top) and subdomains created using platforms that allow users to host their own websites within a provider's domain (most commonly *.netlify.app)"
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/06/UNC1151-gmail-campaign/"
    extended_notes: |
      Detection angle for defenders: hunt for Gmail-lookalike sender display names on newly-registered
      .icu/.digital/.top domains and *.netlify.app subdomains in mail gateway logs; the follow-up
      automated-login behaviour (near-simultaneous login attempt from an unfamiliar ASN immediately
      after a user visits a flagged phishing URL) is a stronger signal than credential entry alone.
      Hardening: push FIDO2/WebAuthn hardware-bound second factors for any staff whose Gmail identity
      intersects with public-administration, law-enforcement, or watchlisted-profession status — TOTP
      and SMS OTP are both defeated by this panel design (real-time relay, not offline cracking).
      MITRE ATT&CK: T1566.002 (Phishing: Spearphishing Link) for the initial lure; the live-relay 2FA
      capture is best described qualitatively (CERT Polska does not name it as AitM tooling) rather than
      forced into T1111, which describes a different interception mechanism. Registry note: this is the
      same UNC1151/Ghostwriter cluster tracked under campaign:frostyneighbor-2026-05-campaign
      (first_seen 2026-05-15, Poland/Lithuania/Ukraine) — this item is the Gmail-specific tradecraft
      shift, a material new development on that entity, not a duplicate.

  - title: "CVE-2026-48614 — Plesk XML API code-injection to root LPE (CVSS 9.9), flagged by CCB Belgium"
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-improper-authorization-vulnerability-plesk-xml-api-patch-immediately", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-07-08", role: "primary" }
      - { url: "https://support.plesk.com/hc/en-us/articles/41171817973143-Vulnerability-CVE-2026-48614-in-Plesk-XML-API", publisher: "Plesk (vendor PSIRT)", date: "2026-07-03", role: "primary" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories → primary: Plesk vendor advisory, URL https://support.plesk.com/hc/en-us/articles/41171817973143-Vulnerability-CVE-2026-48614-in-Plesk-XML-API"
    summary: |
      CCB Belgium published a fresh advisory (08 July 2026, last-update-dated 07 July on the vendor side)
      for CVE-2026-48614, a CWE-94 (Improper Control of Generation of Code / Code Injection) flaw in
      Plesk's XML API. An authenticated, low-privilege user can send a specially crafted XML-API request
      that bypasses the intended authorization boundary and injects arbitrary configuration directives
      into upstream config generation; because the API's input neutralisation is broken, this yields an
      arbitrary file write performed as root, i.e. local privilege escalation from any authenticated
      panel user to full root on the hosting server. CVSS 3.1 base score 9.9
      (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H). Affected: all Plesk versions below 18.0.30; fixed in
      18.0.30 through 18.0.78.4; versions 18.0.79 and later are unaffected by design (fix already
      incorporated). No confirmed in-the-wild exploitation stated by either CCB or Plesk at time of
      publication; discoverer credited is independent researcher Georgii Shutiaev. Plesk is widely
      deployed by web-hosting providers and public-sector/SME web infrastructure across Switzerland and
      the EU, making this a shared-hosting-tenant-compromise risk wherever multi-tenant Plesk panels
      grant any customer authenticated access.
    region_nexus: "EU (CCB Belgium is the disclosing national authority); Plesk is broadly deployed across Swiss and EU hosting providers and public-sector web infrastructure"
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco, hosting/infrastructure"
    cves: ["CVE-2026-48614"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An improper authorization vulnerability in the Plesk XML API allows an authenticated user to inject arbitrary configuration directives."
        attribution: "Centre for Cybersecurity Belgium (CCB)"
        source_url: "https://ccb.belgium.be/advisories/warning-improper-authorization-vulnerability-plesk-xml-api-patch-immediately"
      - quote: "The exploitation of this flaw can result in an arbitrary file write as the root user, leading to local privilege escalation (LPE)."
        attribution: "Centre for Cybersecurity Belgium (CCB)"
        source_url: "https://ccb.belgium.be/advisories/warning-improper-authorization-vulnerability-plesk-xml-api-patch-immediately"
      - quote: "A security vulnerability allowing local privilege escalation was discovered in Plesk's XML API. This security vulnerability has been identified as CVE-2026-48614."
        attribution: "Plesk"
        source_url: "https://support.plesk.com/hc/en-us/articles/41171817973143-Vulnerability-CVE-2026-48614-in-Plesk-XML-API"
    extended_notes: |
      Prerequisite is a valid low-privilege authenticated session on the Plesk panel (e.g. any hosting
      customer account) — no pre-auth path is described. On multi-tenant shared-hosting Plesk installs
      this collapses tenant isolation: any customer becomes a path to root on the shared server and
      therefore to every co-tenant's sites/data. Detection: monitor Plesk XML API access logs
      (/usr/local/psa/admin/htdocs/rpc or the sw-cp-server access log depending on version) for
      authenticated accounts issuing XML-API calls outside their normal automation/CLI pattern, and
      monitor for unexpected root-owned file writes under Plesk's config directories immediately
      following such calls. Hardening: patch to 18.0.30+ (or 18.0.79+ for the fully unaffected line);
      if patching is delayed, CCB and Plesk both recommend disabling or access-restricting the XML API
      entirely. MITRE ATT&CK: T1068 (Exploitation for Privilege Escalation).

