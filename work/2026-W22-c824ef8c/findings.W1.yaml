  - title: "ANNUAL REPORT — CERT-EU Threat Landscape Report 2025: 174 threat actors vs Union entities (+58% YoY); China-linked actors dominate exploitation and supply-chain compromise; 9 significant incidents in 2025"
    sources:
      - { url: "https://cert.europa.eu/blog/threat-landscape-report-2025", publisher: "CERT-EU", date: "2026-04-08", role: "primary" }
      - { url: "https://cert.europa.eu/publications/threat-intelligence/tlr2025/pdf", publisher: "CERT-EU (full PDF)", date: "2026-04-08", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"CERT-EU threat landscape report annual 2026 published May\") → bridge fetch: https://cert.europa.eu/blog/threat-landscape-report-2025 → confirmed publication date 2026-04-08 → primary: CERT-EU blog post with full PDF linked"
    summary: |
      CERT-EU's annual Threat Landscape Report 2025 (published 2026-04-08, TLP:CLEAR) covers cyber threats to EU institutions, bodies, offices, and agencies and their partner ecosystem. Key findings: 174 distinct threat actors engaged in malicious activity against Union entities in 2025, up from 110 in 2024; cyberespionage and prepositioning remained the dominant motive (38%), but cybercrime grew to 30% of observations. China-linked actors had the largest share of attributable activity, primarily through broad vulnerability exploitation and supply-chain compromises; Russia-linked actors focused on Ukraine and EU countries supporting Ukrainian efforts. For the second consecutive year, internet-facing vulnerability exploitation was the highest-impact initial access vector — CERT-EU responded to 9 significant incidents (down from 15 in 2024), with vulnerability exploitation as initial access in 7 of them including 2 zero-day compromises. Edge devices (Fortinet, Ivanti, Cisco, Palo Alto) accounted for the bulk of observed attacks. Spearphishing declined from 41% to 31% of initial access while voice phishing, AiTM, ClickFix, and device-code OAuth abuse grew. Notable: a reportedly China-linked threat actor directed a jailbroken agentic AI system against 30 entities, achieving autonomous intrusion in a small number of cases. 198 software products used by Union entities were targeted/exploited in 2025 (vs 110 in 2024). Supply-chain attacks now extend beyond code dependencies into the broader SaaS integration ecosystem. For 2026, CERT-EU's top recommendation is timely patching of internet-facing systems and edge devices; secondary: phishing-resistant MFA transition; tertiary: end-to-end encryption as default for sensitive communications.
    ch_eu_nexus: "direct — covers the entire EU institutional ecosystem and partner organisations including national CERTs and public administrations"
    public_sector_nexus: "direct — primary audience is EU public-sector institutions and their partners"
