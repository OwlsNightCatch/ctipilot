    discovery_trace: "first seen at: WebSearch (\"CVE-2026-45585 YellowKey patch released June Patch Tuesday out-of-band May 2026\") → primary: Help Net Security 2026-05-20 → corroborating: MSRC advisory"
    summary: |
      As of 2026-05-25, Microsoft has published only mitigation guidance for CVE-2026-45585 (BitLocker security feature bypass via Windows Recovery Environment / WinRE; CVSS 6.8; physical-access prerequisite). No out-of-band patch has shipped. The mitigation approach removes the `autofstx.exe` entry from WinRE's BootExecute registry value (`HKLM\SYSTEM\CurrentControlSet\Control\Session Manager`) and requires re-sealing the WinRE image. The underlying vulnerability is that deleting `winpeshl.ini` via Transactional NTFS (TxF) causes WinRE to launch an unrestricted shell rather than the standard recovery interface, bypassing TPM-only BitLocker protection. Enabling TPM+PIN mode is the highest-confidence hardening step — it closes the attack path regardless of the patch status. Affected: Windows 11 24H2, 25H2, 26H1 (x64) and Windows Server 2025. Permanent fix is anticipated at June 2026 Patch Tuesday (~2026-06-10). No new exploitation evidence or PoC variants observed in-window beyond the original YellowKey/GreenPlasma/MiniPlasma series.
    ch_eu_nexus: "global; affects all Windows 11 and Server 2025 deployments in EU/CH public sector"
