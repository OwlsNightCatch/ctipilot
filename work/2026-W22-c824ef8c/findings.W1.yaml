  - title: "UPDATE: CVE-2026-45585 (YellowKey) — Microsoft has issued WinRE mitigation only; no patch as of 2026-05-25; permanent fix expected June 2026 Patch Tuesday"
    sources:
      - { url: "https://www.helpnetsecurity.com/2026/05/20/yellowkey-bitlocker-mitigation-cve-2026-45585/", publisher: "Help Net Security", date: "2026-05-20", role: "primary" }
