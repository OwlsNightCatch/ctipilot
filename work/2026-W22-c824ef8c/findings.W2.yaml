  - title: "EU Cyber Solidarity Act cross-border cyber hub call for proposals deadline 28 May 2026 — EUR 4M ECCC funding round closes"
    sources:
      - { url: "https://cybersecurity-centre.europa.eu/news/new-eccc-call-proposals-reinforce-cross-border-cyber-hubs-now-open-applications-2025-12-10_en", publisher: "European Cybersecurity Competence Centre (ECCC)", date: "2025-12-10", role: "primary" }
