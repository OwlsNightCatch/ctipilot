    confidence: HIGH
    novelty: "update-to-prior:weekly:2026-W21"
    evidence:
      - quote: "managed security services" defined as "a service provided to a third party consisting of carrying out, or providing assistance for, activities relating to cybersecurity risk management, such as incident handling, penetration testing, security audits and consulting, including expert advice, related to technical support"
        attribution: "Greenberg Traurig (citing Council Regulation 833/2014 as amended)"
        source_url: "https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications"
      - quote: "The measures come into force at 11pm on 22 May"
        attribution: "CryptoBriefing (Switzerland adoption)"
        source_url: "https://cryptobriefing.com/switzerland-eu-russia-sanctions-crypto/"
    extended_notes: |
      Detection/hardening angle: Organisations that previously operated managed security services contracts into Russia should perform a contract audit and rotate any shared credentials, API keys, or monitoring agents that had Russian-side access. SIEM forwarding rules that sent logs to or received feeds from Russian entities represent a potential residual exposure even after contract termination. Hardening: remove any Russia-destined SIEM/SOAR forwarding rules; revoke shared API keys; archive last-known-good configs before decommissioning. Jurisdictional note: Switzerland's Embargo Act (EmbA) implementation has historically tracked EU Russia packages with 0–2 weeks delay; the 22 May adoption is the fastest alignment to date for a substantive services prohibition, which suggests the Federal Council treated the MSS prohibition as politically important to adopt promptly.

  - title: "Europol EU Internet Referral Unit dismantles IRGC online propaganda ecosystem — 14,200 links removed across 19 countries following EU terrorist designation"
    sources:
      - { url: "https://www.europol.europa.eu/media-press/newsroom/news/eu-targets-iran-revolutionary-guard-propaganda-ecosystem-in-online-crackdown", publisher: "Europol (official press release)", date: "2026-05-18", role: "primary" }
      - { url: "https://www.euronews.com/2026/05/19/europol-disrupts-thousands-of-irgc-online-accounts-across-19-countries", publisher: "Euronews", date: "2026-05-19", role: "corroborating" }
      - { url: "https://industrialcyber.co/threat-landscape/europol-dismantles-irgc-linked-online-propaganda-network-removes-14200-links-across-digital-platforms/", publisher: "Industrial Cyber", date: "2026-05-19", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('Europol cybercrime operation arrest law enforcement May 2026 Europe') → returned Euronews article URL https://www.euronews.com/2026/05/19/europol-disrupts-thousands-of-irgc-online-accounts-across-19-countries → pivot: WebSearch ('Europol IRGC online accounts disrupted 19 countries May 2026 operation') → primary Europol press release URL https://www.europol.europa.eu/media-press/newsroom/news/eu-targets-iran-revolutionary-guard-propaganda-ecosystem-in-online-crackdown → confirmed via Industrial Cyber URL https://industrialcyber.co/threat-landscape/europol-dismantles-irgc-linked-online-propaganda-network-removes-14200-links-across-digital-platforms/"
    summary: |
      Between 13 February and 28 April 2026, Europol's EU Internet Referral Unit (EU IRU) coordinated a major takedown of the IRGC's online propaganda and fundraising infrastructure, announced publicly on 18 May 2026. The legal basis was Council Decision (CFSP) 2026/421, designating the Islamic Revolutionary Guard Corps as a terrorist organisation on 19 February 2026 — the first EU-level terrorist designation of the IRGC. Over 14,200 posts, accounts, and hyperlinks were removed across mainstream social media platforms (including suspension of the IRGC's primary X account, which had 150,000+ followers), streaming services, blog-hosting sites, and independent websites. Content appeared in Arabic, English, French, Persian, Spanish, and Bahasa Indonesia. The operation involved law enforcement from 19 countries: Austria, Belgium, Bosnia-Herzegovina, Bulgaria, Czechia, Denmark, Estonia, Finland, France, Germany, Greece, Hungary, Italy, Netherlands, Portugal, Spain, Sweden, Ukraine, and the United States. Key findings include: (a) the IRGC used multi-jurisdictional hosting (Russia and US-based providers) to maintain operational resilience; (b) cryptocurrency transactions were used to bypass financial controls; (c) proxy groups coordinated via the same infrastructure included Hezbollah, Ansar Allah, Hamas, Palestinian Islamic Jihad, and HAYI; (d) AI-generated videos glorifying IRGC activity were a significant content category. Six EU member states that border Switzerland (Austria, France, Germany, Italy) participated. The designation and resulting enforcement action has direct implications for EU/Swiss financial compliance: entities must screen for IRGC-linked counterparties, and any cryptocurrency service provider receiving IRGC-originated funds faces EU sanctions exposure. This is also a precedent-setting use of EU terrorist-designation law to remove digital-influence infrastructure at scale.
    ch_eu_nexus: "Direct EU: operation involved 11 EU member states including major DACH/EU neighbours (Austria, Germany, France); Switzerland not an EU IRU participant but IRGC terrorist designation creates parallel screening obligations under Swiss anti-terrorism law (Art. 74 FINMAG, criminal code Art. 260ter)"
