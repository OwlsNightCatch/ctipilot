    summary: |
      CERT-EU's Cyber Brief 26-05 (published 4 May 2026, covering April 2026) surfaces three incidents of direct relevance to European public-sector defenders: (1) Finland's Valtori mobile device management (MDM) service was compromised via a zero-day vulnerability; approximately 50,000 government users were affected, and cyberespionage is suspected — this represents a national MDM single-point-of-failure compromise with significant intelligence-collection impact. (2) France's Agence Nationale des Titres Sécurisés (ANTS — responsible for national identity cards and driving licences) disclosed a breach affecting approximately 19 million users (names, emails, birthdates); a minor was arrested. (3) A Bellingcat analysis found approximately 795 government email/password combinations exposed across breach databases affecting 12 of 13 Hungarian government ministries, with 97 compromised machines identified via infostealer telemetry. The brief also documents APT28 SOHO-router compromise for DNS hijacking (affecting 200+ organisations and 5,000+ consumer devices globally) and French nuclear deterrent communications reconnaissance attributed to Russia-linked actors. CERT-EU also catalogued exploitation of Fortinet FortiClient EMS (CVE-2026-35616, 2,000+ exposed instances), SharePoint (CVE-2026-32201), and Flowise AI Platform (CVE-2025-59528, 12,000–15,000 exposed instances). Full brief scope: 366 open-source reports analysed.
