  - title: "NY DFS Cybersecurity Industry Letters (21 May 2026) — heightened threat environment guidance cites frontier AI exploit capability and geopolitical escalation; second letter specifically addresses AI cyber risk"
    sources:
      - { url: "https://www.dfs.ny.gov/industry-guidance/industry-letters/20260521-guidance-on-measures-reg-entities-should-consider-in-a-hcte", publisher: "New York DFS", date: "2026-05-21", role: "primary" }
