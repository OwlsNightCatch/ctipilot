  - title: "EU Council renews cyber-attacks sanctions listings until May 2027 — regime covering GRU/APT28-linked entities extended for annual cycle"
    sources:
      - { url: "https://dig.watch/updates/council-of-the-eu-extends-cyber-sanctions-framework-until-2027", publisher: "Digital Watch Observatory", date: "2026-05-13", role: "primary" }
    discovery_trace: "first seen at: WebSearch ('EU Council cyber sanctions framework extension 2026 May renewal decision') → Digital Watch Observatory article URL https://dig.watch/updates/council-of-the-eu-extends-cyber-sanctions-framework-until-2027 → attempted primary Consilium URL https://www.consilium.europa.eu/en/press/press-releases/2026/05/11/cyber-attacks-council-extends-listings-until-may-2027/ (bridge 403, Wayback no snapshot) → covered via Digital Watch Observatory [SINGLE-SOURCE]"
    summary: |
      On or around 11 May 2026, the Council of the EU renewed the individual listings under its cyber-attacks sanctions regime until 18 May 2027, maintaining the 19 individuals and 7 entities currently designated. The legal framework itself (the decision and regulation enabling future listings) remains in force until 18 May 2028. The regime, established in May 2019, allows asset freezes and travel bans on persons/entities behind significant cyber-attacks constituting an external threat to the EU or its member states. The current 19+7 listing set covers, inter alia, officers of GRU Unit 26165 (APT28/Fancy Bear, responsible for the Bundestag and WADA breaches) and Unit 74455 (Sandworm, responsible for NotPetya). No new designations were announced in this renewal cycle. The renewal is notable because (a) the prior annual extension in May 2025 was concurrent with the legal framework extension to 2028, signalling no sunset intent; (b) as of May 2026, 174 threat actors are tracked by CERT-EU against EU entities, yet only 26 total designations exist under the regime, reflecting the historically high evidentiary/political bar for cyber attribution attributions translated into formal sanctions. Swiss individuals and companies are not directly bound by EU sanctions law, but SECO-administered Swiss sanctions against Russia/Belarus include these and related actors through the broader Russia sanctions ordinance (UKRO).
