    summary: |
      The European Cybersecurity Competence Centre (ECCC) Digital Europe Programme call DIGITAL-ECCC-2026-DEPLOY-CYBER-10 closes 28 May 2026 at 17:00 CET, with a total budget of up to EUR 4 million. The call funds the establishment and consolidation of National Cyber Hubs (single-country SOCs as primary entities for collecting, analysing, and correlating cybersecurity data) and Cross-Border Cyber Hubs (multi-country platforms interconnecting national nodes for pan-European threat-intelligence exchange with national CSIRTs and ISACs). This is a direct implementation instrument of the EU Cyber Solidarity Act (in force 4 February 2025), which mandates the European Cybersecurity Alert System as a platform of national and cross-border cyber hubs. Two ENSOC (Spain/Italy plus 7 others) and ATHENA (Cyprus, Bulgaria, Greece, Malta) consortia already exist from pilot projects; the 28 May call funds reinforcement and expansion. The ENISA interoperability guidelines specifying information-sharing formats and protocols under Art. 5 of the Cyber Solidarity Act are due by 5 February 2026. Swiss entities are not eligible for DEP funding, but Swiss national CERT (NCSC.ch) operates bilateral intelligence-sharing arrangements with the two existing consortia through ENISA/FIRST channels.
