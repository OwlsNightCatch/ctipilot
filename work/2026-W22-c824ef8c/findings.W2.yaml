  - title: "EU 20th Russia sanctions package MSS prohibition enters force 25 May; Switzerland adopts parallel ban effective 22 May 2026"
    sources:
      - { url: "https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications", publisher: "Greenberg Traurig", date: "2026-05", role: "primary" }
      - { url: "https://www.skadden.com/insights/publications/2026/05/eu-20th-sanctions-package", publisher: "Skadden", date: "2026-05", role: "corroborating" }
      - { url: "https://www.cliffordchance.com/insights/resources/blogs/regulatory-investigations-financial-crime-insights/2026/05/eus-twentieth-russia-sanctions-package-anti-circumvention-measures-reshape-trade-and-compliance-risk.html", publisher: "Clifford Chance", date: "2026-05", role: "corroborating" }
      - { url: "https://cryptobriefing.com/switzerland-eu-russia-sanctions-crypto/", publisher: "CryptoBriefing / Bloomberg", date: "2026-05-22", role: "corroborating" }
      - { url: "https://finance.ec.europa.eu/news/eu-adopts-20th-package-sanctions-against-russia-2026-04-23_en", publisher: "European Commission DG FISMA", date: "2026-04-23", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('EU Russia 20th sanctions package managed security services guidance 2026') → pivot: Greenberg Traurig primary analysis, URL https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications → pivot: Skadden analysis for Article reference, URL https://www.skadden.com/insights/publications/2026/05/eu-20th-sanctions-package → pivot: Switzerland adoption confirmed via WebSearch ('Switzerland SECO embargo Russia 20th sanctions package implementation May 2026'), URL https://cryptobriefing.com/switzerland-eu-russia-sanctions-crypto/ → primary: EC FISMA announcement, URL https://finance.ec.europa.eu/news/eu-adopts-20th-package-sanctions-against-russia-2026-04-23_en"
    summary: |
      The EU 20th Russia sanctions package (Council Regulations 2026/506 and 2026/511, adopted 23 April 2026) added a prohibition on providing managed security services (MSS) to the Russian government and entities established in Russia, entering force on 25 May 2026. MSS is defined under Regulation 833/2014 as amended: "a service provided to a third party consisting of carrying out, or providing assistance for, activities relating to cybersecurity risk management, such as incident handling, penetration testing, security audits and consulting, including expert advice, related to technical support." The prohibition extends to Russian subsidiaries of EU-incorporated companies unless a national competent authority licence is obtained; the sole named exception is services strictly necessary for the functioning of Russian consular or diplomatic representations in EU member states. Switzerland's Federal Department of Economic Affairs, Education and Research (EAER/SECO) adopted a parallel package effective 22 May 2026 at 23:00 local time, including most — but not all — EU 20th-package measures: 115 additional asset freeze/travel ban designations, 60 export-control additions, 20 Russian banks and 7 third-country financial intermediaries under transaction bans, and the RUBx/digital-rouble prohibition (effective 26 May). The Swiss adoption confirmed it mirrored the MSS prohibition as part of the professional-services expansion. Seven third-country companies were not listed by Switzerland, citing operational measures sufficient to prevent circumvention. No separate SECO FAQ update on the cybersecurity-services definition has been published as of 25 May. EU firms providing SIEM-as-a-service, managed detection and response (MDR), incident response retainer services, or red-team/penetration-testing engagements to Russian clients must have terminated those contracts or obtained a licence by 25 May 2026; Swiss-domiciled firms face the same constraint since 22 May.
    ch_eu_nexus: "Direct — prohibition applies to EU and (now) Swiss security-services firms; Swiss adoption as of 22 May 2026 makes this operationally live for DACH MSS providers"
    public_sector_nexus: "direct — government-owned security operations centres and shared-service security providers must audit any Russia-touching service contracts"
    sector: "cybersecurity-services, financial, public-sector"
    cves: []
    actors_campaigns_malware: []
