  - title: "Unit 42's dataset of 405 AI-enabled malware samples finds 97% never leave sandboxes, and every sample that reached a production environment was caught by existing behavioral detection with no novel approach required"
    sweep: outage-backfill
    sources:
      - { url: "https://unit42.paloaltonetworks.com/ai-enabled-malware-analysis/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-25", role: "primary" }
    discovery_trace: "first seen at: unit42.paloaltonetworks.com listing sweep, URL https://unit42.paloaltonetworks.com/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/ai-enabled-malware-analysis/"
    summary: |
      Unit 42 analyzed 405 AI-enabled malware samples and reports that approximately 97% exist only in
      research repositories and public sandboxes (e.g. VirusTotal), with just 12 samples observed
      attempting to reach production environments across Cortex XDR-protected endpoints — and every one
      of those 12 was detected and blocked before execution completed. Five malware families accounted
      for the in-the-wild attempts: FunkSec ransomware, a set of trojanized AI-branded applications, the
      Oyster backdoor, the Rhadamanthys stealer, and a COM-hijacking DLL. The most concrete evidence of
      LLM-assisted development speed is FunkSec, which the report says produced seven distinct
      ransomware-builder variants in six days — "a pace that suggests LLM-assisted development, where
      generating a new variant is closer to a prompt generation rather than a software development
      task." The report's central, counter-hype finding is that none of the 405 samples required a novel
      detection approach: "the AI component influenced how the malware was written, but the resulting
      binary still exhibits the same behavioral indicators that existing detection logic targets" —
      sandbox detonation, behavioral analytics, code-signing anomaly detection and entropy analysis
      caught every sample without modification. This is a direct, data-rich complement to the
      "AI bought throughput not capability" thread this pipeline's 2026-08-23 weekly already carries
      (Talos/UAT-10147, Bitdefender/SilkParasite, CISA/Siemens-S7-tooling, Insikt/PurpleDelta): Unit 42
      supplies the quantitative production-vs-sandbox ratio and detection-sufficiency claim that the
      earlier reporting argued qualitatively.
    region_nexus: "global; the detection-sufficiency finding is a direct calibration input for any SOC deciding whether to invest in AI-malware-specific detection tooling versus trusting existing behavioral/sandbox pipelines"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
