  - title: "'GreenPlasma' — Windows Collaborative Translation Framework local privilege escalation to SYSTEM via named-object symlink redirection reaching consent.exe (CVE-2026-45586); Microsoft rates exploitation 'More Likely'"
    sweep: backlog
    sources:
      - { url: "https://0patch.com/blog/micropatches-released-for-greenplasma-windows-collaborative-translation-framework", publisher: "0patch (ACROS Security)", date: "2026-08-10", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md row surfaced 2026-08-24 by 2026-08-23T1311Z-audit → re-fetched this run, URL https://0patch.com/blog/micropatches-released-for-greenplasma-windows-collaborative-translation-framework (no pivot needed)"
    summary: |
      CVE-2026-45586 (CWE-59 Improper Link Resolution Before File Access, MSRC-rated "Exploitation More
      Likely," patched in Microsoft's June 2026 updates) is a local privilege-escalation flaw in Windows
      Collaborative Translation Framework (CTF). Several Text Services Framework processes that always
      run as Local System — including consent.exe, the UAC elevation-prompt dialog — open a named memory
      section using a fixed, predictable name. A malicious local (unprivileged) process redirects that
      name to a different memory section via a Windows-object symbolic link, gaining full read/write
      access to the section's contents and using it for arbitrary code execution as Local System.
      Microsoft's fix loads the section without honoring symbolic links. Researcher Nightmare-Eclipse
      found the flaw and published a proof-of-concept, since deleted; 0patch (ACROS Security) reproduced
      it from the PoC and released free micropatches covering Windows 7 through 11 and Server 2008
      R2/2012/2012 R2, including versions no longer receiving official Microsoft security updates. This
      is the researcher's third distinct 2026 Windows local-elevation disclosure the store now tracks
      alongside RoguePlanet/ShieldBreak (Defender TOCTOU LPE) and LegacyHive (profile-registry hijack,
      CVE-2026-62832) — a recognizable pattern of named-object/symlink and TOCTOU primitives against
      Local System processes from the same researcher across three months.
    region_nexus: "global; any Windows endpoint where local/unprivileged code execution is achievable as a starting foothold"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-45586"]
    techniques: [T1068]
    affected_products: ["Windows Collaborative Translation Framework", "Microsoft Windows"]
    entity_keys: ["trend:nightmare-eclipse-rogueplanet-defender-toctou-lpe-2026-06", "trend:nightmare-eclipse-legacyhive-profile-registry-hijack-2026-07"]
    new_entities:
      - { key: "trend:nightmare-eclipse-greenplasma-ctf-symlink-lpe-2026-06", type: trend, name: "GreenPlasma", aliases: [],
          summary: "Nightmare-Eclipse's named-object symbolic-link redirection technique against Windows Collaborative Translation Framework processes (including consent.exe) running as Local System; patched by Microsoft in June 2026 as CVE-2026-45586, reported by 0patch on 2026-08-10. Third distinct Windows local-elevation disclosure by the same researcher this pipeline tracks in 2026, alongside trend:nightmare-eclipse-rogueplanet-defender-toctou-lpe-2026-06 and trend:nightmare-eclipse-legacyhive-profile-registry-hijack-2026-07." }
    relation_suggestions: []
