  - title: "Claroty Team82: 23 vulnerabilities in Copeland XWEB Pro supervisory refrigeration controllers chain to unauthenticated root RCE — only 2 of 20 published CVE ids are bound to a named flaw"
    sweep: backlog
    sources:
      - { url: "https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers", publisher: "Claroty Team82", date: "2026-08-09", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md row surfaced 2026-08-24 by 2026-08-23T1311Z-audit → re-fetched this run, URL https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers (no pivot needed)"
    summary: |
      Claroty Team82 disclosed 23 vulnerabilities (21 rated high) in Copeland XWEB300D/500D/500B PRO
      supervisory refrigeration controllers (firmware ≤1.12.1), which manage field devices such as the
      XR60CX controller over Modbus RS-485 and Ethernet in commercial refrigeration/cold-chain
      deployments. Two named flaws chain to unauthenticated root RCE: CVE-2026-25085 is a logic flaw in
      the Lua user_authenticate handler — when an attacker supplies an unrecognized auth_mode value in
      the HTTP Authorization: Basic header, the function does not return nil/false but an unpopulated
      yet "truthy" table {user=nil, role=nil, recovery=nil}, and the router downstream checks only that
      something was returned, not its contents, so the malformed request slips through unauthenticated.
      CVE-2026-21718 is a deterministic admin-password generator: the credential is derived via a KDF
      from a hardcoded firmware seed (identical across the product line) plus the device's MAC address
      and the current date — both obtainable from unauthenticated public endpoints/local-network
      broadcast — letting an attacker reconstruct valid admin credentials fully offline with zero
      interaction with the target. The remaining 18 CVE identifiers in Claroty's published range cover
      19 separate OS command-injection flaws across API/CGI endpoints (contact-list import, network
      configuration, firmware update) served by an embedded lighttpd instance, where unsanitized user
      input reaches Lua system-execution calls running with elevated privileges — any of the two
      pre-auth primitives chains directly to root. Claroty built a live physical demonstration: from an
      internet-exposed XWEB controller, an attacker reverse-engineers the connected field controller's
      undocumented Modbus register map and can display a normal temperature on the supervisory UI while
      silently disabling cooling — "spoiled food," or compromised temperature-sensitive medical supplies
      for pharmaceutical cold-chain. Copeland shipped firmware v1.13 through coordinated disclosure,
      fixing all 23 issues; no exploitation in the wild is reported — this is coordinated vulnerability
      research, not an active campaign.
    region_nexus: "global; internet-exposed commercial refrigeration/cold-chain deployments (retail, cold storage, pharmaceutical/laboratory cold-chain) — direct relevance to this constituency's healthcare and food-safety cold-chain infrastructure"
    primary_sector_nexus: "indirect"
    sector: "healthcare, energy"
    cves: ["CVE-2026-25085", "CVE-2026-21718", "CVE-2026-20742", "CVE-2026-20764", "CVE-2026-20902", "CVE-2026-20910", "CVE-2026-21389", "CVE-2026-23702", "CVE-2026-24452", "CVE-2026-24517", "CVE-2026-24663", "CVE-2026-24689", "CVE-2026-24695", "CVE-2026-25037", "CVE-2026-25105", "CVE-2026-25109", "CVE-2026-25111", "CVE-2026-25195", "CVE-2026-25196", "CVE-2026-25721"]
