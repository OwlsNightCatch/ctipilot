  - title: "GoCaracal: Dark Caracal's new Go-based malware framework uses an Ethereum smart contract as a resilient fallback channel to deliver replacement C2 addresses without redeploying the implant"
    sweep: outage-backfill
    sources:
      - { url: "https://arcticwolf.com/resources/blog/dark-caracal-reloaded-new-malware-same-hunting-grounds/", publisher: "Arctic Wolf Labs", date: "2026-08-26", role: "primary" }
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews (item 'GoCaracal Malware Uses Ethereum Smart Contract to Fetch Replacement C2 Address', published 2026-08-27T15:03+05:30) → pivot: WebSearch (\"Arctic Wolf GoCaracal Ethereum smart contract C2 Dark Caracal Venezuela\") → primary: Arctic Wolf Labs, URL https://arcticwolf.com/resources/blog/dark-caracal-reloaded-new-malware-same-hunting-grounds/"
    summary: |
      Arctic Wolf Labs identified GoCaracal, a previously undocumented Go-based modular malware
      framework, deployed during a June 2026 intrusion at an unnamed communications organization in
      Venezuela alongside an updated Bandook variant delivered via a Delphi loader. Analysis of 249
      samples traces the framework's development across four phases from January through July 2026 and
      identifies two operational build profiles: a lightweight implant for initial access and payload
      delivery, and an extended build for sustained intelligence collection adding browser data theft,
      keylogging, remote desktop control and SOCKS5 proxying to the lightweight build's remote-shell and
      payload-execution core. The extended variant's most notable feature is a blockchain-based C2
      resilience mechanism: after repeated failures to reach its primary command-and-control server, the
      malware sends an eth_getStorageAt JSON-RPC request to a public Ethereum node and reads a
      replacement C2 address from a smart contract's storage slot. Because the operator can update that
      stored value through an ordinary blockchain transaction, every deployed implant picks up a new C2
      address without the operator ever having to redeploy or update the malware binary itself — a
      takedown-resilient fallback channel that rides on infrastructure (public Ethereum RPC endpoints)
      no defender or ISP is going to block wholesale. Arctic Wolf assesses with medium confidence that
      the June intrusion was conducted by Dark Caracal, a cyberespionage group associated with Lebanon's
      General Directorate of General Security, based on a convergence of evidence: continued use of the
      historically-attributed Bandook malware, recurring Delphi-loader characteristics, Spanish-language
      financial lures, malicious SVG-based delivery, URL-shortening services, document-themed
      infrastructure, hosting-provider preferences and Latin American targeting consistent with the
      group's established pattern.
    region_nexus: "Latin America (Venezuela) is the confirmed victim region; the technique class — blockchain smart-contract storage as a dead-drop resolver for C2 address rotation — is a genuinely novel resilience pattern transferable to any actor's infrastructure and worth a detection concept regardless of region"
    primary_sector_nexus: "indirect"
    sector: "telco"
    cves: []
    techniques: [T1102.001, T1071.001, T1041]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:dark-caracal", type: actor, name: "Dark Caracal", aliases: [],
          summary: "Cyberespionage group associated with Lebanon's General Directorate of General Security (GDGS); historically linked to Bandook malware. Arctic Wolf assesses with medium confidence that Dark Caracal deployed the newly documented GoCaracal Go-based framework in a June 2026 Venezuela intrusion (Arctic Wolf Labs, 2026-08-26)." }
      - { key: "malware:gocaracal", type: malware, name: "GoCaracal", aliases: [],
          summary: "Previously undocumented Go-based modular malware framework with lightweight and extended build profiles (remote shell, payload execution, browser data theft, keylogging, RDP control, SOCKS5 proxying); the extended build uses an Ethereum smart contract as a fallback C2-address resolver via eth_getStorageAt JSON-RPC calls. Linked with medium confidence to Dark Caracal (Arctic Wolf Labs, 2026-08-26)." }
    relation_suggestions:
      - { subject: "actor:dark-caracal", object: "malware:gocaracal", basis: "Arctic Wolf assesses with medium confidence that Dark Caracal deployed GoCaracal, based on convergent evidence including co-deployment with the historically-attributed Bandook malware (Arctic Wolf Labs, 2026-08-26)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "After repeated failures to reach primary C2, malware sends eth_getStorageAt request to public Ethereum JSON-RPC endpoint and reads value from contract storage ... Operators can update stored C2 value through blockchain transaction, deployed implants retrieve new address without receiving updated binary."
        attribution: "Arctic Wolf Labs (2026-08-26)"
        source_url: "https://arcticwolf.com/resources/blog/dark-caracal-reloaded-new-malware-same-hunting-grounds/"
      - quote: "Arctic Wolf assesses with medium confidence that this intrusion was conducted by Dark Caracal ... convergence of multiple evidence types, including use of Bandook, recurring Delphi loader characteristics, Spanish-language financial lures, malicious SVG files, URL-shortening services, document-themed infrastructure."
        attribution: "Arctic Wolf Labs (2026-08-26)"
        source_url: "https://arcticwolf.com/resources/blog/dark-caracal-reloaded-new-malware-same-hunting-grounds/"
    extended_notes: |
      Detection concept: outbound JSON-RPC calls (eth_getStorageAt or similar Ethereum node RPC methods)
      from endpoint or server processes that have no legitimate business reason to talk to a blockchain
      node — most enterprise endpoints never make direct Ethereum RPC calls at all, so this is a
      high-signal, low-noise behavioral indicator (a query to any public Ethereum RPC endpoint from a
      non-blockchain-application process) rather than requiring a specific contract-address blocklist.
      No CVE (malware/infrastructure documentation). Single-source; the malware family and C2 mechanism
      are new to this pipeline, Dark Caracal is proposed as a new registry actor.

  - title: "GPUThor: a Rowhammer attack defeats ECC on NVIDIA Ampere-class workstation GPUs (RTX A4000/A4500/A5000/A6000), cutting a privilege-escalation exploit from 21.9 hours to 1.1 minutes"
    sweep: outage-backfill
    sources:
      - { url: "https://gputhor.com/", publisher: "University of Toronto (Chris S. Lin, Joyce Qu, Aditya Rajeev, Gururaj Saileshwar)", date: "2026-08-25", role: "primary (embargo-lift disclosure page; ACM CCS 2026 paper)" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-gputhor-attack-defeats-nvidia-ecc-protection-for-root-access/", publisher: "BleepingComputer", date: "2026-08-26", role: "corroborating" }
    discovery_trace: "first seen at: hackernews RSS feed, URL https://feeds.feedburner.com/TheHackersNews (item 'New GPUThor Rowhammer Defeats ECC on NVIDIA RTX A6000 to Gain Host Root Access', published 2026-08-27T13:43+05:30); independently corroborated at bleepingcomputer.com listing sweep, URL https://www.bleepingcomputer.com/news/security/ → pivot: WebSearch (\"GPUThor Rowhammer NVIDIA RTX A6000 ECC University of Toronto\") → primary: researcher disclosure site, URL https://gputhor.com/ (paper PDF: https://gururaj-s.github.io/assets/pdf/CCS26_GPUThor.pdf; code: https://github.com/sith-lab/gputhor)"
    summary: |
      University of Toronto researchers (accepted at ACM CCS 2026, reported to NVIDIA 29 April 2026 with
      the embargo lifting 25 August 2026) disclosed GPUThor, the first Rowhammer bit-flip attack to
      defeat error-correcting-code (ECC) protection on NVIDIA GPUs — the mitigation NVIDIA specifically
      recommends against GPU Rowhammer. By reverse-engineering how the GPU's memory controller coalesces
      repeated memory-access requests from different warps into a single row activation, and precisely
      characterizing the timing of the GPU's Target Row Refresh mitigation (GPUThor determined the
      mitigation on Ampere GDDR6 fires roughly once every 72 tREFI intervals, and crafted hammering
      patterns whose length divides 72 to stay synchronized with — and therefore evade — that schedule),
      the researchers deploy non-uniform hammering patterns that hammer 6.6x harder than prior GPU
      Rowhammer attacks and produce 500x-23,500x more bit flips, reaching 72,000-377,000 bit flips per GB
      — a rate comparable to CPU-side Rowhammer attacks. The practical impact: an end-to-end
      privilege-escalation exploit chain that took 21.9 hours to complete using the prior GPUHammer
      attack pattern on an RTX A6000 completes in 1.1 minutes with GPUThor, and GPUThor achieves a root
      shell for the first time with ECC enabled even against double- and triple-bit-error correction.
      Separately, GPUThor can induce a denial-of-service state on an ECC-enabled RTX A6000, forcing the
      GPU to reset every two hours and terminating all running workloads. Four Ampere-class NVIDIA
      workstation GPUs with GDDR6 memory are confirmed vulnerable: RTX A4000, A4500, A5000 and A6000 —
      all widely deployed in AI training/inference and cloud/virtualization infrastructure where a single
      physical GPU is frequently shared (via vGPU/MIG-style partitioning or multi-tenant scheduling)
      across workloads or tenants with different trust levels.
    region_nexus: "global; any cloud, HPC or AI infrastructure operator sharing physical Ampere-class NVIDIA workstation GPUs across tenants or workloads of differing trust levels is exposed, independent of geography"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1068, T1499]
    affected_products: ["NVIDIA RTX A4000", "NVIDIA RTX A4500", "NVIDIA RTX A5000", "NVIDIA RTX A6000"]
    entity_keys: []
    new_entities:
      - { key: "trend:gputhor-rowhammer-ecc-bypass-ampere-gpu-2026", type: trend, name: "GPUThor", aliases: [],
          summary: "University of Toronto Rowhammer attack that defeats ECC protection on Ampere-class NVIDIA workstation GPUs (RTX A4000/A4500/A5000/A6000) by exploiting GPU memory-request coalescing and precisely-timed Target Row Refresh evasion; achieves root-shell privilege escalation in 1.1 minutes (vs. 21.9 hours for the prior GPUHammer attack) and can force denial-of-service GPU resets. Reported to NVIDIA 2026-04-29, disclosed 2026-08-25 (ACM CCS 2026)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "GPUThor finds that mitigation on Ampere GDDR6 is issued roughly once every 72 tREFIs. Patterns whose length divides 72 stay synchronized with that schedule."
        attribution: "University of Toronto researchers (GPUThor disclosure, 2026-08-25)"
        source_url: "https://gputhor.com/"
      - quote: "GPUThor enables a root-shell for the first time with ECC enabled on GPUs with both double and triple bit errors."
        attribution: "University of Toronto researchers (GPUThor disclosure, 2026-08-25)"
        source_url: "https://gputhor.com/"
      - quote: "An end-to-end privilege-escalation exploit completes in 1.1 minutes with GPUThor [vs. 21.9 hours with GPUHammer]."
        attribution: "University of Toronto researchers (GPUThor disclosure, 2026-08-25)"
        source_url: "https://gputhor.com/"
      - quote: "Four Ampere-class NVIDIA workstation GPUs with GDDR6 memory—RTX A4000, A4500, A5000, and A6000—are vulnerable to bit flips."
        attribution: "University of Toronto researchers (GPUThor disclosure, 2026-08-25)"
        source_url: "https://gputhor.com/"
    extended_notes: |
      Mitigation guidance from the researchers: cloud operators should avoid sharing a single physical
      GPU across untrusted tenants, and should monitor NVIDIA's own error-correction counters as a
      detection signal (a rising rate of corrected ECC errors on a GPU is itself the hunting query — no
      IOC needed, since the physical fault-injection signature is the detection). No CVE has been
      assigned at disclosure time; whether NVIDIA has published or plans a driver/firmware-level
      mitigation was not stated in the reachable text — flagged as an open question for a follow-up
      fetch of NVIDIA's own security bulletin once one is issued. Distinct from — and a direct
      escalation of — this same research group's prior GPUHammer/GPUBreach work, which the researchers
      themselves state "became irrelevant after ECC was introduced"; GPUThor is the answer to that
      mitigation. No relation to the previously-tracked University of Toronto AI-adaptive-worm research
      (trend:ai-adaptive-worm-utoronto-2026) — checked and confirmed as a different research group/topic
      within the same institution.

