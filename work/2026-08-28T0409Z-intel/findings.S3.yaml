    discovery_trace: "first seen at: state/coverage_backlog.md row surfaced 2026-08-24 by 2026-08-23T1311Z-audit → re-fetched this run, URL https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers (no pivot needed)"
    summary: |
      Companion disclosure to the Copeland item above — same research team, same publish day
      (2026-08-09T17:59Z) — covering the Danfoss AK-SM 800A refrigeration system-manager platform used
      in supermarkets, cold-storage facilities and commercial HVAC. Claroty found "thousands of publicly
      accessible management interfaces" via internet-wide scan data; its own measurement puts the
      exposed population at roughly 2,765 devices. CVE-2025-41450 (CWE-287 Improper Authentication,
      CVSSv3 8.2) is a hidden, undocumented "code-of-the-day" authentication mechanism: the application
      accepts a specially crafted authentication request containing a generated "code of the day" that
      bypasses normal login and discloses a web report with internal IPs, usernames and store names —
      patched in firmware build 4.2. CVE-2025-41451 (CWE-77 OS Command Injection, CVSSv3 7.6) is a
      post-authenticated command injection in the alarm-to-email (SMTP) configuration field: a
      user-supplied value is formatted unsanitized into a shell command executed on the device, which
      Claroty used to achieve remote code execution. CVE-2025-41452 (CWE-15 External Control of
      Configuration Setting, CVSSv3 5.4) lets a post-authenticated user inject arbitrary Nginx directives
      via the exposed headers.conf include, implanting arbitrary routing rules into the internet-facing
      Nginx configuration and enabling denial-of-service. Danfoss shipped firmware R4.3.1 fixing
      CVE-2025-41451/41452 (4.2 for CVE-2025-41450). The RCE and Nginx-injection primitives require
      prior authentication; Claroty's article does not explicitly confirm the code-of-the-day mechanism
      as a pre-auth path into the two post-auth primitives, so treat the chain as auth-gated unless a
      combined path is independently confirmed.
    region_nexus: "global; ~2,765 internet-exposed Danfoss AK-SM 800A management interfaces per Claroty's own internet-scan measurement — same cold-chain sector relevance as the Copeland item"
