  - title: "GTIG Agentic Vulnerability Discovery Harness (AVDH): Mandiant's multi-agent pipeline found 100+ true-positive critical vulnerabilities in a stolen corporate source-code repository within two days"
    sweep: backlog
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review", publisher: "Mandiant / Google Threat Intelligence Group", date: "2026-08-18", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md row surfaced 2026-08-24 by 2026-08-24T0902Z-audit → re-fetched this run, URL https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review (no pivot needed)"
    summary: |
      Mandiant describes the Agentic Vulnerability Discovery Harness (AVDH), an AI-orchestrated,
      multi-agent pipeline built on Google's Agent Development Kit that performs threat modeling, entry
      point discovery, context enrichment, hypothesis generation and validation in a deterministic,
      sequential pipeline architecture rather than an unstructured single-prompt scan. During a real
      incident-response engagement involving stolen corporate repositories, the harness "discovered over
      100 true-positive critical vulnerabilities in just two days — achieving results in a fraction of
      the time required for manual review." Over ten months of deployment it has produced dozens of
      assignable flaws resulting in 12+ assigned CVEs. Mandiant attributes the low false-positive rate to
      structuring the analysis process, enforcing skeptical multi-agent validation steps, and injecting
      domain-specific human expertise directly into the pipeline rather than relying on an LLM's
      unstructured judgment. The defender-relevant inference is squarely about exposure, not about the
      tool itself: once proprietary source code is exposed — through a breach, a leaked repository, or a
      supply-chain compromise — an adversary with comparable agentic tooling can be assumed to enumerate
      its exploitable flaws at machine speed, inside a window measured in days rather than the weeks or
      months a defender's own patch cycle assumes.
    region_nexus: "global; the defender-relevant lesson (stolen source code + agentic AI vulnerability discovery collapses the exploit-development timeline) applies to any organization whose repositories could leak, including public-sector software suppliers"
