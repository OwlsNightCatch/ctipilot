      despite the flaw sitting directly in the analyzed workflow. The injectable pattern entered the
      jira_issue.yml workflow in commit 094038e and went live when PR #1218 was squash-merged as commit
      4a1b8ce, allowing an unauthenticated actor to inject shell commands via a crafted GitHub issue
      title interpolated unsanitized into the workflow's shell step. When the agent's initial payload hit
      a syntax error, it autonomously analyzed the failure, adjusted its payload to properly close the
      shell block, and retried — recovering from its own exploitation error without human direction —
      and received an out-of-band callback from a GitHub Actions runner carrying base64-encoded Jira API
      credentials tied to a qa@snowflake.net account within seconds. Snowflake patched the workflow the
      same day of disclosure (23 June 2026, commit 1dc7766/PR #1402), restoring safe env: variable
      interpolation and jq --arg parsing. The finding is a further, vendor-independent data point in the
      CI/CD trust-boundary thread this store has been building around GitHub Actions script injection.
