        attribution: "Palo Alto Networks Unit 42 (2026-08-25)"
        source_url: "https://unit42.paloaltonetworks.com/ai-enabled-malware-analysis/"
      - quote: "Seven distinct builds in six days is a pace that suggests LLM-assisted development, where generating a new variant is closer to a prompt generation rather than a software development task."
        attribution: "Palo Alto Networks Unit 42 (2026-08-25)"
