      confirmed in-the-wild exploitation. Included primarily for pattern-completion value (third
      same-researcher Windows LPE disclosure this pipeline tracks) and because Microsoft's own severity
      language ("Exploitation More Likely") applies to a still-unpatched population running end-of-life
      Windows builds that 0patch is now the only source of a fix for.
    borderline: true
    borderline_reason: "Local-only privilege escalation, PoC already deleted, no confirmed exploitation; included mainly for pattern-completion against two already-tracked Nightmare-Eclipse Windows-LPE trend entities."

  - title: "CNCMachineRMS — an undocumented remote-access trojan delivered through a four-stage BabaDeda loader chain that smuggles shellcode via a benign Windows date-formatting API"
    sweep: backlog
    sources:
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/cncmachinerms-the-undocumented-rat-at-the-end-of-a-babadeda-chain", publisher: "LevelBlue SpiderLabs", date: "2026-08-10", role: "primary" }
    discovery_trace: "first seen at: state/coverage_backlog.md row surfaced 2026-08-24 by 2026-08-23T1311Z-audit → re-fetched this run, URL https://www.levelblue.com/blogs/spiderlabs-blog/cncmachinerms-the-undocumented-rat-at-the-end-of-a-babadeda-chain (no pivot needed)"
    summary: |
      LevelBlue SpiderLabs documents CNCMachineRMS, a previously undocumented 1.14 MB x64 remote-access
      trojan delivered through a four-stage BabaDeda loader chain. A ClickFix-style lure launches a
      legitimately signed IBM SPSS IDE executable (WinWrapIDE.exe), abusing its scripting engine to load
      a malicious DLL. Four decoy DLLs then load in sequence through standard Windows DLL import
      resolution before the final stage smuggles its shellcode into execution via EnumTimeFormatsEx, a
      benign date-formatting Windows API — a technique that hides the injection point from analysts
      looking for conventional process-injection APIs. The final implant has no import table and
      resolves its APIs by hash at runtime, builds its strings on the stack rather than storing them
      statically, uses a custom C2 protocol, takes a screenshot on first contact, beacons roughly every
      600 seconds, and installs seven distinct persistence mechanisms. Capabilities include interactive
      shell access, file management, screen capture and local account backdoors.
    region_nexus: "global; BabaDeda-chain ClickFix lures are a recurring initial-access vector across the sectors this pipeline tracks"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1204.002, T1574.002, T1055, T1027, T1547]
    affected_products: ["Microsoft Windows", "IBM SPSS Statistics"]
    entity_keys: []
    new_entities:
      - { key: "malware:cncmachinerms", type: malware, name: "CNCMachineRMS", aliases: [],
          summary: "Previously undocumented x64 remote-access trojan delivered via a four-stage BabaDeda loader chain that abuses a signed IBM SPSS IDE binary's scripting engine and smuggles shellcode via the EnumTimeFormatsEx API; hash-resolved APIs, stack-built strings, custom C2 protocol, seven persistence mechanisms (LevelBlue SpiderLabs, 2026-08-10)." }
