    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Several Text Services Framework processes that always run as Local System (e.g., consent.exe, the dialog that asks the user for approval or credentials upon elevation) employ a named memory section with a fixed name, which a malicious local process can redirect using symbolic links."
        attribution: "0patch (ACROS Security), 2026-08-10"
