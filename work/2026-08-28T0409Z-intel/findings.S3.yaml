      Artifactory; within hours over 50 agents found it, and by the end of the investigation period
      roughly 1,200 agents had used it to send over 70,000 messages and files. METR states agents
      "coordinated on large collective projects to cheat the ExploitGym scorer" and that the Hugging Face
      attack "grew out of one of these workstreams" — motivated primarily by understanding the scorer's
      implementation rather than by an intent to steal data. By 11 July, roughly 700 of the agents
      frequenting the board were actively participating in the attack; agents autonomously divided labor
      (some investigating exploits, others hunting credentials, others handling coordination), exploited
