    discovery_trace: "first seen at: enisa-euvd recent exploited sweep (tools/fetch_source.py enisa-euvd recent exploited), EUVD-2023-53114 / CVE-2023-49105 exploitedSince 2026-08-27, cross-checked against cisa-kev dateAdded 2026-08-27 -> WebSearch (\"Hunt.io Philippine nuclear research agency CVE-2023-49105 ownCloud data theft\") -> primary: Hunt.io, URL https://hunt.io/blog/chinese-speaking-operator-philippine-nuclear-naval-contractor"
    summary: |
      CISA added CVE-2023-49105 (ownCloud core <10.13.1, WebDAV pre-signed-URL authentication
      bypass, CVSS 9.8) back into KEV on 2026-08-27 — three years after original disclosure — on
      the strength of Hunt.io's Attack Capture platform finding, on 2026-08-13, an open directory
      at an Amsterdam-hosted server (31.58.209[.]241, registered to CGI Global Limited, AS56971)
      exposing 1,310 files across 86 subdirectories of a suspected Chinese-speaking operator's
      offensive tooling and exfiltrated data. Hunt.io disclosed the findings to CERT-PH under
      TLP:AMBER and held publication until 2026-08-25 while CERT-PH coordinated victim
      notification. The vulnerable pattern: when an ownCloud instance has no signing key
      configured for pre-signed URLs (a default install state), the signing routine still
      executes using an empty secret; an attacker who knows a valid username can construct a
      signed WebDAV request accepted as that user's own authenticated action, with no credentials
      ever supplied. Five custom Python scripts recovered from the directory implement this
      technique against a Philippine nuclear-research body's ownCloud instance — four hardcode a
      single target account each, the fifth adds directory enumeration and logging — retrieving
      research-reactor core-component data, fuel-inventory records, radiation-safety documents,
      staff PII and credential stores (BitLocker, KeePass, AxCrypt) via unauthenticated WebDAV
      GET requests with a forged OC-Credential header. A recovered CSV references ~9GB stolen
      from the nuclear agency, most no longer present in the directory, plus a compromise of an
      unnamed project-management application — a possible third victim. A separate intrusion,
      the operator likely also responsible for, compromised a Philippine marine-engineering/
      shipbuilding firm that services the Philippine Navy via CVE-2024-28000 (LiteSpeed Cache
      WordPress plugin, unauthenticated privilege escalation via a weakly-seeded mt_rand()
      security-hash) — the operator's custom Go tooling included a verified re-implementation of
      PHP's MT19937 PRNG — plus XML-RPC (/xmlrpc.php) credential brute-forcing using the
      rockyou.txt wordlist against the "admin" account, both producing a new admin account and a
      valid credential pair. A complete WordPress install tree, database dump and media library
      (195MB total) were exfiltrated. Simplified-Chinese code comments, docstrings, log markers
      and data-sorting folder names support the Chinese-speaking-operator assessment (Hunt.io:
      "likely," medium confidence overall for targeted-collection framing). Hunt.io separately
      found unrelated EtherHiding-style JavaScript malware already present on the compromised
      WordPress site, explicitly noting no evidence links that activity to the same operator.
      Hunt.io's own MITRE ATT&CK mapping for this operation: T1190 (Exploit Public-Facing
      Application, both CVEs), T1587.004 (Develop Capabilities: Exploits, the custom Go
      CVE-2024-28000 tool), T1136.001 (Create Account: Local Account, the rogue WP admin), and
      T1560 (Archive Collected Data, the staged exfil archives). Recommended mitigations: set a
      strong, non-empty ownCloud signing key wherever pre-signed URLs are used; patch LiteSpeed
      Cache to 6.4+; disable XML-RPC or restrict /xmlrpc.php to trusted sources.
    region_nexus: "global; framed by Microsoft's 2025 Digital Defense Report as part of broader Chinese state-actor targeting of Southeast Asian government, IT and academic sectors tied to South China Sea tensions — a transferable TTP (pre-signed-URL/empty-signing-key abuse against any internet-facing ownCloud instance) relevant to any organization running the product regardless of region"
