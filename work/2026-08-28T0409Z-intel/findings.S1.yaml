  # ---------------------------------------------------------------
  # FRESH ITEM: miniOrange SAML/OAuth cross-platform (WordPress + Joomla)
  # ---------------------------------------------------------------
  - title: "miniOrange's SAML2Core library ships the SAME openssl_verify() tri-state authentication bypass across BOTH its WordPress and Joomla SAML SSO products — one vendor code defect, two ecosystems, exploitation already attempted against the WordPress line"
    sources:
      - { url: "https://patchstack.com/articles/one-slug-seven-editions-the-miniorange-saml-sso-bug-that-let-anyone-log-in-as-your-wordpress-admin/", publisher: "Patchstack / DigitalOcean security team", date: "2026-08-21", role: primary }
      - { url: "https://mysites.guru/blog/miniorange-oauth-joomla-account-takeover/", publisher: "mySites.guru", date: "2026-08-26", role: primary }
    discovery_trace: "first seen at: ncsc-csh recent sweep (tools/fetch_source.py ncsc-csh recent), post id 12874 published 2026-08-25 (WordPress SAML SSO) -> pivot: Patchstack full technical write-up -> cross-check against mysites.guru's Joomla miniOrange coverage found via the earlier mysites.guru/rss.xml pull -> confirmed shared root cause"
    summary: |
      Two independent research efforts converged on the same vendor-wide defect in miniOrange's
      (Xecurify) bundled SAML2Core library this week, across two different CMS ecosystems.
      WORDPRESS (miniOrange SAML 2.0 Single Sign On plugin): DigitalOcean's security team caught
      exploitation attempts on its own infrastructure via defense-in-depth controls — an anomalous
      admin-session attempt from outside the trusted network, using a bypass to obtain a valid
      admin session cookie but then blocked because admin-panel operations sit behind a separate
      network restriction. DigitalOcean's own root-cause analysis (the first published for ANY
      paid edition) found: CVE-2026-61979 (signature algorithm confusion) — the plugin lets an
      incoming SAML response choose its own SignatureMethod; setting it to HMAC-SHA1 makes the
      plugin use the IdP's PUBLIC RSA key (fetched from IdP metadata, by definition not secret) as
      the HMAC secret, so an attacker signs their own forged assertion with a key anyone can
      obtain, and the plugin verifies it as genuine (Utilities.php:246-281,
      XMLSecurityKey.php:216-218/308-314/546-548). CVE-2026-15981 (OpenSSL tri-state confusion) —
      openssl_verify() returns 1 (valid), 0 (invalid) or -1 (internal OpenSSL error); the plugin
      checks the result as a plain boolean, and PHP treats -1 as truthy, so a deliberately
      malformed signature that trips OpenSSL's error path is accepted as VALID
      (XMLSecurityKey.php:486-494, Utilities.php:252). Both let an unauthenticated attacker forge
      a SAML assertion and land in /wp-admin as ANY existing user, admins included. The public
      CVE records cover only the Free edition (3.x-5.x); DigitalOcean discovered the vendor
      silently patched six additional paid editions (Premium, Standard, two multisite/Enterprise
      tiers, VIP single/multisite) with no changelog entry and no public advisory, so a paid
      install on an unlisted version number (e.g. Standard 16.1.9) was reported "already patched"
      by every vulnerability database, including Patchstack's own, because its version number
      exceeded the Free edition's fixed version. A vulnerable 16.x release additionally shows no
      managed-update prompt in the WordPress dashboard at all — the upgrade to 17.0.6 requires a
      manual plugin upload. Opportunistic scanning against miniOrange SSO endpoints has been
      observed from multiple VPN/datacenter/hosting IP ranges, consistent with automated
      exploitation attempts against every reachable installation regardless of edition. A public
      PoC exists for the Free edition. JOOMLA (miniOrange SAML SSO and OAuth Client extensions):
      the Joomla CNA published CVE-2026-77998 (CVSS 4.0 10.0) on 2026-08-25 for miniOrange SAML
      SSO for Joomla — mySites.guru confirms this is THE SAME openssl_verify() tri-state bug
      (-1 treated as valid) in the same vendor's Joomla product, letting an attacker name and
      impersonate any account, Super User included, with a deliberately broken signature. A
      separate, simpler flaw, CVE-2026-77995 (CVSS 10.0, published 2026-08-24, credited to
      Krzysztof Zając of CERT PL), affects the miniOrange OAuth Client extension for Joomla: the
      extension trusts a client-supplied cookie value to determine which account a visitor is
      logged in as, with no verification at all (CWE-287) — set the cookie to name an
      administrator and you are one. Paid Joomla SAML editions (Basic 13.2, Standard 24.2,
      Premium 34.2, Enterprise 44.2) were fixed 26 August, two days after the free-line fix, but
      the Joomla CVE record for CVE-2026-77998 still only covers the free 1.0.0-11.0.1 range; the
      paid OAuth Client editions have no fix at all as of this writing.
    region_nexus: "global; both WordPress and Joomla are widely self-hosted across European public-sector and SME sites, and SAML SSO is disproportionately used for staff/administrative access on exactly those installations"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology"
    cves: [CVE-2026-61979, CVE-2026-15981, CVE-2026-77998, CVE-2026-77995]
    techniques: [T1190, T1606.002]
    affected_products: ["miniOrange SAML 2.0 Single Sign On (WordPress)", "miniOrange SAML SSO for Joomla", "miniOrange OAuth Client for Joomla"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker can exploit this by setting SignatureMethod to HMAC-SHA1. As a result, the plugin allows using the trusted RSA public key PEM as the HMAC secret."
        attribution: "Patchstack, citing DigitalOcean's root-cause analysis"
        source_url: "https://patchstack.com/articles/one-slug-seven-editions-the-miniorange-saml-sso-bug-that-let-anyone-log-in-as-your-wordpress-admin/"
      - quote: "openssl_verify() is tri-state, returning 1 for a valid signature, 0 for invalid, and -1 when OpenSSL itself errors out. The plugin loosely checked these results, and in PHP -1 is truthy (valid)."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/one-slug-seven-editions-the-miniorange-saml-sso-bug-that-let-anyone-log-in-as-your-wordpress-admin/"
      - quote: "PHP's openssl_verify() does not answer yes or no. It answers one of three things: 1 if the signature is valid, 0 if it is not, and -1 if OpenSSL could not complete the check at all. That third answer is the trap."
        attribution: "mySites.guru (on the Joomla SAML SSO product, CVE-2026-77998)"
        source_url: "https://mysites.guru/blog/miniorange-oauth-joomla-account-takeover/"
      - quote: "Exploitation has been attempted in the wild. DigitalOcean's defense-in-depth controls detected and blocked the activity on its infrastructure, and the identified indicators were shared to help strengthen detection and protection across the ecosystem."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/one-slug-seven-editions-the-miniorange-saml-sso-bug-that-let-anyone-log-in-as-your-wordpress-admin/"
    extended_notes: |
      This is the analytically interesting angle: the SAME code defect class (tri-state
      openssl_verify() return value treated as a PHP boolean) exists independently in what appear
      to be two separately-maintained codebases from the same vendor (the WordPress plugin and the
      Joomla extension both bundle their own copy of vendor SAML-handling code), suggesting either
      copy-paste reuse of a flawed internal library across product lines or two independent
      implementations of the same well-known PHP gotcha. Either way, any organization running ANY
      miniOrange SAML product on ANY platform should treat "we already checked WordPress" or "we
      already checked Joomla" as insufficient — the vendor's SAML verification code needs
      auditing wherever it appears. No IOCs are reported here per policy (the source lists
      specific scanning IPs; omitted). Triage/detection: alert on SAML AuthnResponse assertions
      whose SignatureMethod is HMAC-based rather than the expected RSA/DSA scheme, and on
      authentication log entries showing a successful SSO login immediately following a
      malformed/error-triggering signature-verification attempt in the web server or application
      log.

  # ---------------------------------------------------------------
  # FRESH ITEM: Kaltura mwEmbed
  # ---------------------------------------------------------------
  - title: "Kaltura mwEmbed/html5lib video player: unauthenticated RCE and arbitrary file read via an undocumented ServiceUrl parameter — no vendor response, no patch, 630+ exposed instances found by the discoverer"
    sources:
      - { url: "https://anddone-git.github.io/2026/one-parameter-two-bugs/", publisher: "AndDone (Gerjan Wemekamp)", date: "2026-08-26", role: primary }
    discovery_trace: "first seen at: ncsc-csh recent sweep (tools/fetch_source.py ncsc-csh recent), post id 12877 published 2026-08-26, citing kb.cert.org/vuls/id/308749 (unreadable this run — binary/compressed body) -> pivot: the discoverer's own technical write-up, URL https://anddone-git.github.io/2026/one-parameter-two-bugs/"
    summary: |
      Two unauthenticated vulnerabilities in Kaltura's mwEmbed/html5lib video-player library,
      reachable at the mwEmbedLoader.php endpoint with no session, token or user interaction.
      Root cause: an undocumented ServiceUrl request parameter lets the caller control the URL
      the server fetches data from — KalturaClientBase.php's doQueue() function concatenates it
      unchecked into "$this->config->serviceUrl . '/api_v3/index.php?service=...'" with no
      origin/scheme validation, then feeds the fetched response through PHP's unserialize()
      with no signature check, origin check, or class allow-list. CVE-2026-19913 (CVSS 9.1):
      supplying a file:// scheme in ServiceUrl makes the application fetch and attempt to
      deserialize an internal file's contents; failed-deserialization error messages reflect the
      raw file bytes back to the client, yielding arbitrary local file read. CVE-2026-19912
      (CVSS 10.0): the uiconf_id request parameter is concatenated unsanitized into the on-disk
      cache-file destination path (kInfraFileSystemCacheWrapper.php's getFilePath()), so path-
      traversal sequences in uiconf_id escape the cache directory; combined with the unchecked
      unserialize() above (PHP object injection), this reaches unauthenticated remote code
      execution when the default file-based cache backend is in use and PHP execution is not
      blocked in the cache directory. The discoverer (Gerjan Wemekamp, AndDone) fully demonstrated
      the file-read path against a production bug-bounty target and the current codebase, and
      validated the full RCE chain end-to-end against a 2019-era Kaltura Server Docker image
      (14.12.0) — the vulnerable code is confirmed unchanged in the current West-23.5.0 release,
      though no current-release container was available to re-run the full RCE demonstration
      against. The discoverer found 630+ indexed, internet-facing Kaltura instances via a search
      query. Disclosure attempts spanned personal email (23 March 2026), corporate email
      (13 April), LinkedIn escalation (23 May) and national CERT involvement (2 July); CERT/CC
      states it "was unable to reach Kaltura to coordinate these vulnerabilities," and no vendor
      response or patch existed as of this run. Because Kaltura is frequently deployed as
      shared, multi-tenant CDN/hosting infrastructure, a single exposed mwEmbedLoader.php can put
      every tenant served by that shared host at risk. Kaltura's video platform is widely used by
      universities and research institutions for lecture capture and media hosting.
    region_nexus: "global; higher-education and research-sector Kaltura deployments are common across Europe, including Swiss/EU academic institutions in this constituency's extended remit"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: [CVE-2026-19912, CVE-2026-19913]
    techniques: [T1190]
    affected_products: ["Kaltura HTML5 Player Library (mwEmbed / html5lib)", "Kaltura Server"]
    entity_keys: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "getFilePath() builds the on-disk destination by concatenating the cache base directory with a path derived from the uiconf_id request parameter, with no sanitisation"
        attribution: "AndDone (Gerjan Wemekamp)"
        source_url: "https://anddone-git.github.io/2026/one-parameter-two-bugs/"
      - quote: "the CERT/CC was unable to reach Kaltura to coordinate these vulnerabilities"
        attribution: "CERT/CC, quoted via WebFetch summary of kb.cert.org/vuls/id/308749"
        source_url: "https://kb.cert.org/vuls/id/308749"
    extended_notes: |
      Fetch note: CERT/CC's own vulnerability-note page (kb.cert.org/vuls/id/308749) returned a
      corrupted/binary body via the extract transport in this run (looks like an undecoded
      compressed response) — the CERT/CC quote above is carried through a WebFetch summarization
      pass rather than a verbatim re-read of the raw page text, so treat it as slightly
      lower-confidence sourcing than the discoverer's own write-up, which was read in full and
      cleanly. No vendor mitigation exists; the only defender-side control is to block or
      heavily restrict access to mwEmbedLoader.php at a WAF/reverse-proxy/CDN layer, reject
      non-http(s) ServiceUrl values, and deny PHP execution rights in cache directories.

  # ---------------------------------------------------------------
  # FRESH ITEM: Linux kernel CVE-2026-53362
  # ---------------------------------------------------------------
  - title: "Linux kernel IPv6 UDP fraggap accounting bug (CVE-2026-53362) added to CISA KEV — unprivileged local heap overflow via MSG_SPLICE_PAGES, no exploitation narrative published"
    sources:
      - { url: "https://euvd.enisa.europa.eu/enisa/EUVD-2026-41669", publisher: "ENISA EUVD (EUVD-2026-41669)", date: "2026-08-27", role: primary }
      - { url: "https://git.kernel.org/stable/c/14200d435af9a9eeb444f529fc2f689a236b7962", publisher: "Linux kernel stable tree (upstream fix commit)", date: "2026-08-27", role: primary }
    discovery_trace: "first seen at: enisa-euvd recent exploited sweep (tools/fetch_source.py enisa-euvd recent exploited), EUVD-2026-41669 exploitedSince 2026-08-27, cross-checked against cisa-kev dateAdded 2026-08-27 -> primary: the upstream kernel fix commit message, linked directly from the EUVD record"
    summary: |
      CISA added CVE-2026-53362 to KEV on 2026-08-27. In __ip6_append_data()'s paged-allocation
      branch (taken under MSG_MORE / NETIF_F_SG / large fraglen conditions), alloclen and
      pagedlen accounting fail to account for a non-zero "fraggap" carried over from a previous
      skb once transhdrlen is zero — undersizing the linear allocation while overstating
      pagedlen, so the fraggap-copy step writes past skb->end into the trailing skb_shared_info.
      The upstream fix commit states: "An unprivileged user can trigger this via a UDPv6 socket
      using MSG_MORE together with MSG_SPLICE_PAGES." The bad accounting was introduced by an
      earlier commit ("ipv6: avoid partial copy for zc") and only became reachable once a later
      commit allowed MSG_SPLICE_PAGES to proceed in the negative-copy case that previously
      returned -EINVAL. CVSS 3.1 7.8 (AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H). No public exploitation
      narrative, named cluster, or affected-distribution list was located beyond the KEV/EUVD
      listing and the upstream kernel commit itself in this run — treat as confirmed-exploited
      per CISA's determination, technical mechanism confirmed against the primary kernel-tree
      commit, but with no further detail available on how it is being exploited or by whom.
    region_nexus: "global; affects any Linux kernel exposing an unprivileged user to socket operations, i.e. effectively all general-purpose Linux deployments pending distribution backport"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: [CVE-2026-53362]
    techniques: [T1068]
    affected_products: ["Linux kernel"]
    entity_keys: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Confirmed KEV addition and a solid primary technical mechanism, but no independent exploitation reporting was found beyond the catalog listing itself — severity and local-only attack vector also place this below the run's headline items."
    evidence:
      - quote: "An unprivileged user can trigger this via a UDPv6 socket using MSG_MORE together with MSG_SPLICE_PAGES."
        attribution: "Linux kernel stable-tree fix commit"
        source_url: "https://git.kernel.org/stable/c/14200d435af9a9eeb444f529fc2f689a236b7962"
    extended_notes: |
      Patch/hardening lever: apply the vendor kernel update carrying this stable-tree fix once
      available for the running distribution; there is no config-level workaround short of
      restricting untrusted local users' ability to open raw UDPv6 sockets with MSG_SPLICE_PAGES-
      capable applications, which is not a practical general control.

