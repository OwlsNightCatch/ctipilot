      formal CVE record fetched directly from services.nvd.nist.gov. This is a generalizable
      supply-chain lesson for any EU organization on a mandatory e-invoicing network: a trading
      partner you have never interacted with can reach your back-office database through a
      routine, mandatory document-processing action, with no phishing, credential theft or
      network access required.

  # ---------------------------------------------------------------
  # BACKLOG ITEM 7: isolated-vm
  # ---------------------------------------------------------------
  - title: "isolated-vm sandbox escape (GHSA-864f-rcv7-6rh4): a TOCTOU type-confusion in ExternalCopy's transferList marshaling breaks the V8 Isolate guest/host boundary — widely used as the sandbox underneath AI-agent code-execution features"
    sources:
      - { url: "https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm", publisher: "Endor Labs", date: "2026-08-20", role: primary }
      - { url: "https://github.com/laverdet/isolated-vm/security/advisories/GHSA-864f-rcv7-6rh4", publisher: "GitHub Security Advisory (isolated-vm maintainer)", date: "2026-08-08", role: primary }
    discovery_trace: "first seen at: coverage-backlog re-verification task (api.github.com and github.com direct fetch both 403, jina credit exhausted) -> pivot: WebFetch of the GitHub advisory page directly succeeded -> primary: Endor Labs full technical write-up, URL https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm"
    summary: |
      isolated-vm gives each untrusted-JavaScript sandbox its own V8 Isolate — a separate heap
      with no shared object graph with the host, the same primitive Chrome uses to separate tabs.
      Endor Labs (credited discoverer, pending CVE assignment) found that the isolation primitive
      itself held; what broke is the C++ marshaling code that copies values across the boundary.
      ExternalCopy's transferList option (a postMessage-style zero-copy ArrayBuffer transfer)
      walks the transfer_list array TWICE in src/external_copy/serializer.cc: walk 1 validates
      each element IsArrayBuffer() and registers it; walk 2 performs an unchecked
      handle.As<ArrayBuffer>() reinterpret-cast with no re-validation. Because transfer_list is a
      real JavaScript array and both walks read it via array->Get(context, index) — a genuine
      property read that invokes JS accessors — a guest can define transferList[0] as a getter
      that returns a real ArrayBuffer on the first read (satisfying walk 1's check) and an
      attacker-chosen value such as 0x41414141 on the second read; the unchecked cast then treats
      that integer as an ArrayBuffer, yielding a controlled-address read/write primitive. Endor
      Labs escalated this from a single ivm.Reference — the minimum capability any embedder must
      hand a sandbox for it to do anything at all — to full host control-flow hijacking,
      demonstrating a complete guest-to-host escape. Affected: isolated-vm <=7.0.0 (all lines);
      fixed in 7.0.1 (mainline) and 6.2.0 (6.x backport), both released 2026-08-08, by wrapping
      ExternalCopy::Copy in a v8::Isolate::DisallowJavascriptExecutionScope that prevents any
      guest JS (getters, proxies, interceptors) from running during the copy — closing the TOCTOU
      window outright. isolated-vm (1M+ weekly downloads) is the sandbox of record for a wide
      range of AI-agent and automation platforms that execute model- or user-generated code:
      Endor Labs names n8n (200k GitHub stars, recommends isolated-vm for its Code-node task
      runners), Activepieces (23k stars), Mastra AI (27k stars, its "code mode" tool-orchestration
      execution), Budibase (28k stars, migrated off deprecated vm2), Sim.ai (29k stars), Directus
      (37k stars) and Rocket.Chat (46k stars) as production consumers whose guest/host boundary
      is this exact library. No CVE identifier has been assigned as of this run.
    region_nexus: "global; downstream impact wherever these named platforms are self-hosted, including EU public-sector low-code/automation deployments"
    primary_sector_nexus: "indirect"
    sector: "public-sector, technology"
    cves: []
    techniques: [T1611]
    affected_products: ["isolated-vm (npm package)", "n8n", "Activepieces", "Mastra AI", "Budibase", "Sim.ai", "Directus", "Rocket.Chat"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Walk 1's IsArrayBuffer() check says nothing about the value walk 2 receives, and As<ArrayBuffer>() is an unchecked reinterpret-cast, not a conversion."
        attribution: "Endor Labs"
        source_url: "https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm"
      - quote: "We did not break the V8 Isolate. We broke the code that carries data into it."
        attribution: "Endor Labs"
        source_url: "https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm"
      - quote: "The maintainer responded quickly and shipped a fix in versions 7.0.1 and 6.2.0. The patch wraps ExternalCopy::Copy in a v8::Isolate::DisallowJavascriptExecutionScope, which prevents any user JavaScript (getters, proxies, interceptors) from running during the copy."
        attribution: "Endor Labs"
        source_url: "https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm"
    extended_notes: |
      No CVE id exists yet (GHSA-864f-rcv7-6rh4 is the only identifier) — versions confirmed
      directly against both the GitHub Security Advisory (the maintainer's own record) and Endor
      Labs' independent technical analysis, satisfying two-source verification without needing
      OSV (which the tasking notes 404s on this record). Relevant for any org self-hosting an
      AI-agent/automation platform that advertises isolated-vm as its "safe" code-execution
      sandbox — this is exactly the kind of trust-boundary defect Tier 3 responders should be
      tracking as agentic-AI deployments grow.

  # ---------------------------------------------------------------
  # BACKLOG ITEM 8: Elementor Pro / Wordfence
  # ---------------------------------------------------------------
  - title: "Elementor Pro (WordPress, ~6M installs): unauthenticated arbitrary file upload to RCE via a validator/mover desynchronization in the Forms File Upload field (CVE-2026-32475, CVSS 9.0)"
    sources:
      - { url: "https://patchstack.com/articles/critical-unauthenticated-file-upload-to-rce-in-elementor-pro-plugin/", publisher: "Patchstack", date: "2026-08-19", role: primary }
      - { url: "https://thehackernews.com/2026/08/elementor-pro-flaw-could-let.html", publisher: "The Hacker News", date: "2026-08-20", role: corroborating }
    discovery_trace: "first seen at: coverage-backlog re-verification task (wordfence.com blog post unreachable on every transport this run) -> WebSearch (\"Elementor Pro arbitrary file upload vulnerability CVE August 2026 Wordfence patched\") -> primary: Patchstack (discoverer's disclosure venue), URL https://patchstack.com/articles/critical-unauthenticated-file-upload-to-rce-in-elementor-pro-plugin/"
    summary: |
      CVE-2026-32475 (CVSS 9.0) affects Elementor Pro <=4.2.1, fixed in 4.2.2 (patched 19 Aug,
      patch reviewed and confirmed effective by Patchstack). The Forms module's File Upload field
      (modules/forms/fields/upload.php) validates an upload's extension in one loop
      (validation()) and moves accepted files to a public directory in a separate loop
      (process_field()) — and the two loops disagree about what an EMPTY file entry
      (UPLOAD_ERR_NO_FILE) means. validation() does "if (!required && UPLOAD_ERR_NO_FILE) return;"
      — an empty first entry makes it abandon checking the ENTIRE field, including every
      later entry. process_field() instead does "if (UPLOAD_ERR_NO_FILE) continue;" — it skips
      only the empty entry and still moves everything after it. Submitting two file parts for one
      File Upload field — an empty first part, then a .php payload as the second — makes the
      validator report a clean submission (it stopped reading before reaching the .php entry)
      while the mover still processes and moves that .php file. The blocklist check
      (is_file_type_valid(), which does correctly reject php/phtml/asp/etc.) never runs against
      the payload at all. The stored filename is always uniqid().extension (the submitted name is
      discarded), so the payload lands as wp-content/uploads/elementor/forms/<uniqid>.php — a
      public, web-accessible path — giving a fully unauthenticated visitor RCE by requesting the
      file directly. Only prerequisite: any published Elementor page containing a Form widget
      with a File Upload field (Required toggle off by default) — an everyday configuration
      (job-application, support-ticket, "attach a document" forms). Every value the exploit needs
      (post_id, form_id, the field's form_fields[ID] name) is visible in the page's public HTML,
      and the request goes through the elementor_pro_forms_send_form AJAX action with no cookie
      or nonce required. Recovering the stored uniqid() filename is cheap: the 8 hex "seconds"
      digits come straight from the server's own Date: response header, leaving only 5 hex
      microsecond digits to brute-force — or, on forms with an autoresponder email action enabled
      (common on the same job-application/support-ticket forms), Elementor's own default
      notification template discloses the exact upload URL to the attacker-controlled email
      address with zero brute-forcing. Fix in 4.2.2 synchronizes the two loops' empty-entry
      handling and additionally re-checks the extension inside process_field() itself,
      immediately before the move, so the blocklist now guards the sink directly. Discovered and
      reported by Tin Pham (TF1T) to Patchstack.
    region_nexus: "global"
    primary_sector_nexus: "direct"
    sector: "public-sector, technology"
    cves: [CVE-2026-32475]
    techniques: [T1190, T1505.003]
    affected_products: ["Elementor Pro (WordPress plugin)"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An empty first entry makes validation() return before it ever type-checks the .php entry that follows it. process_field(), meanwhile, only continues past that empty entry and moves the .php one anyway. The validator reports a clean submission because it stopped reading; the mover proceeds because it did not."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/critical-unauthenticated-file-upload-to-rce-in-elementor-pro-plugin/"
      - quote: "The .php file lands in wp-content/uploads/elementor/forms/, a public, web-accessible directory, letting a fully unauthenticated visitor place executable PHP on the server and, by requesting the file directly, achieve remote code execution."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/critical-unauthenticated-file-upload-to-rce-in-elementor-pro-plugin/"
    extended_notes: |
      Coverage-gap note per the tasking: wordfence.com's blog post (the URL explicitly named in
      the backlog item) is STILL unreachable via any transport this run — WebFetch returned an
      empty/anti-bot-shell body, extract found "no readable body" via trafilatura, and the jina
      reader fallback failed because every credential in the pool reported HTTP 402 balance-
      exhausted. I recovered full, arguably deeper, technical detail from Patchstack's own
      disclosure article (the venue the finder actually reported to), corroborated by The Hacker
      News — do not treat this as a Wordfence-sourced item; Wordfence's own framing/CVE
      attribution (if it differs) could not be checked. Triage: audit
      wp-content/uploads/elementor/forms/ for any .php file.

