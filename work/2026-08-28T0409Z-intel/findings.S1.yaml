  # ---------------------------------------------------------------
  - title: "A 2023 ownCloud auth-bypass CVE just re-entered CISA KEV — because Hunt.io caught a suspected Chinese-speaking operator's open staging server using it to steal nuclear-research and naval-contractor data from two Philippine organizations"
    sources:
      - { url: "https://hunt.io/blog/chinese-speaking-operator-philippine-nuclear-naval-contractor", publisher: "Hunt.io (Hunt Intelligence)", date: "2026-08-25", role: primary }
